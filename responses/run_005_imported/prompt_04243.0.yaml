answer: |-
  You've made a sharp and accurate observation about Aquinas's text and its modern interpretation. Your reading is correct, and this passage from the *Summa Theologiae* **does not support the general-purpose, four-condition Doctrine of Double Effect (DDE) as commonly attributed to it today.** Aquinas is making a much narrower argument specific to self-defense and the nature of lawful authority. Here's a breakdown:

  1.  **Your Reading is Correct: The Authority Distinction is Key**
      *   Aquinas explicitly states: *"it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority... who while intending to kill a man in self-defense, refer this to the public good."*
      *   For a private individual, self-defense is only lawful if:
          *   The **intention** is solely self-preservation ("saving of one's life").
          *   The death of the aggressor is **merely foreseen** but **not intended** ("beside the intention").
          *   The force used is **proportionate and moderate** ("repel force with moderation").
      *   For someone with public authority (soldier, judge's officer), the calculus changes:
          *   They **can lawfully intend** to kill the aggressor.
          *   This is permissible *because* their action is done "for the public good" and refers to it. Their role transforms the act into an execution of public justice/defense.

  2.  **Why the Modern DDE is a Misreading/Misapplication:**
      *   **Specific Context:** Aquinas is answering a *very specific question*: "Whether it is lawful to kill a man in self-defense?" He is *not* formulating a universal ethical principle for all actions with good and bad effects. His focus is reconciling the natural right to self-preservation with the prohibition against killing.
      *   **Authority is Integral, Not Accidental:** The public/private distinction and the role of authority in justifying the *intention* to kill is a core part of Aquinas's argument here. The modern DDE abstracts this away entirely. For Aquinas, whether you *can* intend the bad effect hinges critically on your role relative to the common good.
      *   **"Intention" is Stricter for Private Actors:** Aquinas imposes a stricter requirement on intention for private individuals than the modern DDE implies. For the private person, the aggressor's death *must* be outside the intention; it cannot be intended *at all*, even as a means. The modern DDE's third condition ("the bad effect isn't the means to the good one") is related but distinct; it allows the bad effect to be a *foreseen consequence of the means*, just not the *intended means itself*. Aquinas's formulation for private actors seems to demand that the death simply *not be intended*, period.
      *   **Proportionality is Contextual:** While proportionality is present ("more than necessary violence... will be unlawful"), its application is tightly bound to the specific context of defensive force, not generalized.
      *   **Source of the Modern Formulation:** The modern 4-condition schema (act not wrong, intention good, bad effect not means, proportionality) is indeed Joseph Mangan's 1949 systematization, drawing *inspiration* from Aquinas (and other Scholastics) but abstracting and generalizing his specific argument. It retrofits Aquinas into a broader framework he wasn't explicitly constructing in this passage.

  3.  **Does it Support the General DDE?**
      *   **Minimally/Indirectly:** Aquinas provides *elements* that became foundational to DDE: the core idea that an act with two effects (one good, one bad) can be permissible if only the good is intended and the bad is unintended, alongside proportionality. He demonstrates the *concept* of double effect in action.
      *   **Not as a General Doctrine:** Crucially, he does *not* present this as a universal moral principle applicable to all dilemmas involving foreseen bad effects. His argument is deeply embedded in the specific moral and legal context of self-defense and the theology of killing, heavily reliant on the distinction between private individuals and public authority. The passage **cannot be directly lifted as support for applying DDE to scenarios like the trolley problem, medical dilemmas (e.g., palliative sedation), or wartime collateral damage** without significant extrapolation and abstraction that goes beyond Aquinas's explicit argument here.

  4.  **Implications for Trolley Problems & Rationalist Discussions:**
      *   **Anachronism:** Invoking Aquinas's *ST II-II, Q64, A7* as the *source* for the general DDE used in trolley problems is historically inaccurate. It's applying a later, generalized framework *inspired by* but distinct from his specific argument.
      *   **Limited Scope for Private Actors:** For scenarios involving *private individuals* (like most trolley problems), Aquinas's argument only justifies actions where the *sole intention* is the good effect (e.g., diverting the trolley to save five), the bad effect (killing one) is *truly unintended and beside the purpose*, and the force/proportionality is appropriate. It does *not* justify intending the death of the one as a means to save the five (e.g., pushing someone fatally in front of the trolley), *especially* for a private actor.
      *   **Authority Matters:** The passage implicitly questions whether complex moral dilemmas involving intended harms can *ever* be licitly performed by private individuals without some delegation of public authority, a nuance often lost in abstract trolley debates.

  **Conclusion:**

  You are absolutely right. Aquinas's argument in *ST II-II, Q64, A7* is primarily a **specific justification for private self-defense** under strict conditions (intention solely on preservation, death unintended, proportionality), while **granting broader intentional authority to public actors** serving the common good. It provides the *seed* of the Doctrine of Double Effect – the distinction between intended and merely foreseen effects within a single act – but **not its fully developed, generalized form.** The modern four-condition DDE is a 20th-century systematization that abstracts Aquinas's core insight from its original, narrower context. Citing this passage as the *direct* source for the general DDE used in trolley problems is a misreading that ignores the crucial role Aquinas assigns to public authority and the strict limits he places on the intentions of private individuals. Your close reading successfully identifies a significant gap between the historical source and its contemporary philosophical application.
