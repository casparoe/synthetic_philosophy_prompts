answer: |-
  ## Through a Mirror, Fractured

  The air in Dr. Aris Thorne's lab tasted of ozone and desperation. Lena Vance pressed her palms against the cold steel rim of the Quantum Mirror Array, staring into the swirling, non-Euclidean depths of the main aperture. Thorne, gaunt and fever-eyed, jabbed at a console. "The entanglement matrix is stabilizing! Lena, you *must* enter the focal point. We need a baseline consciousness reading *within* the quantum foam!"

  Lena wasn't a philosopher. She was a grad student with mounting debt and a reckless streak. Thorne promised proof of modal realism – actual alternate worlds. Now, facing the shimmering void, the metaphysics felt less abstract, more like vertigo. She stepped forward.

  The transition wasn't pain. It was dissolution. Her senses scattered like shards of glass. Then, coalescence. She stood in a near-identical lab. Thorne was here, but younger, less haunted. Relief washed over her – she was *somewhere*. Then she saw *herself*.

  Standing by an identical console was Lena Vance. Same height, same unruly dark hair, same faint scar above the left eyebrow from a childhood tumble. Same worn leather jacket Lena favoured. The *physical* continuity was undeniable. This was her body. This *was* her.

  "Prime," the other Lena breathed, eyes wide. "You stabilized? How?"

  *Prime?* Lena (our Lena) felt a surge of possessive anger. *I'm Lena.* "Stabilized? I just... arrived. Thorne sent me through."

  The counterpart – Lena Prime – frowned. "Thorne? *My* Thorne died six months ago. Lab accident." She gestured around. "This is *my* world. Projection Seven. You're a resonance echo." Prime stepped closer, scrutinizing. "The scar... the jacket... even that anxious twitch in your right hand. It's uncanny. But you *can't* be me. *I* remember Thorne dying. *You* don't."

  Here it was. The divergence. Not in atoms, but in memory. The body screamed "Me!", but the lived history, the defining trauma Prime carried, was utterly alien. Kripke’s objection echoed in Lena’s mind: *Humphrey couldn’t care less about some other man.* Was *this* Lena Vance? The body said yes. The life story said no. A cold dread replaced the anger.

  "Projection Seven," Prime continued, her voice hardening. "Designation: Memory-Depleted Variant. We scan echoes like you. Looking for... patterns." She tapped her temple. "Your quantum signature is weak. You won't last."

  Before Lena could react, the lab door hissed open. Another figure entered. Lena gasped. It was *her* again. But wrong. This Lena moved with a jerky, unnatural gait. Her features were blurred, like a bad hologram. Her clothes were a generic grey jumpsuit. She looked directly at Lena (our Lena), ignoring Prime completely.

  "Continuity... disrupted," the blurred Lena rasped, her voice layered with static. "Designation... contested. Similarity parameters... conflicting."

  Prime recoiled. "Projection Seven-Alpha! Containment breach! How did it get loose?"

  The blurred Lena – Projection Seven-Alpha – raised a hand not towards Prime, but towards Lena. "Bodily continuity... high correlation. Memory matrix... divergent. Alternate weighting... required." A flicker of something almost like recognition passed over the blurred features. "This... configuration... viable."

  Lena stared at the blurred figure. This wasn't her body, not really. It was a shoddy copy. But *this* projection seemed to recognize *her* as a closer counterpart based on... what? Some bizarre weighting of bodily similarity over memory? Lewis’s point hammered home: *Which similarity relation matters?* Prime claimed her based on the body, dismissing the divergent memory. Seven-Alpha seemed to claim her based on... something else entirely, perhaps the *potential* buried in the scrambled memory matrix? There was no single "counterpart" relation. Just competing claims under different criteria.

  Prime lunged for a console. "Terminating unstable projections!" Alarms blared. The blurred Lena flickered violently. "Designation... unresolved!" she shrieked, dissolving into static and light before vanishing.

  Lena felt a surge of panic, not just for her safety, but for her *self*. Prime turned back, her expression a mix of scientific detachment and visceral disgust. "See? Imperfect echoes. Dangerous. You’re just data, Projection Seven. A flawed iteration of *me*."

  "But *I* remember stepping into the mirror!" Lena cried, backing away. "I remember my Thorne, alive, desperate! I remember my life! Doesn't that *mean* something? Doesn't that make me *me*?"

  Prime’s gaze was pitiless. "Memories can be simulated. Quantum states can resonate. Your body *resembles* mine. But you didn't live *my* life. You don't carry *my* Thorne's death. Therefore, you are *not* me. You are a counterpart. A very close one, perhaps, but distinct. Numerically different." Lewis's solution stated plainly. It felt like an erasure.

  The lights in the lab flickered. A low hum built in the Quantum Mirror Array behind Lena. Prime glanced at it, then back, a flicker of something like... pity? "The matrix is pulling you back. Your anchor point. Goodbye, Projection Seven. Tell my counterpart... tell *yourself*... wherever you end up... good luck."

  The dissolution began again. Lena looked at Lena Prime – her body, her face, her stolen life. The woman who insisted she was fundamentally *other*. She looked at the spot where the blurred projection, who saw kinship based on some alien metric, had vanished. Which one was the "real" her? Which one mattered? Humphrey wouldn't care about the counterpart, Kripke said. But standing here, ripped between bodily twinship and alien memory, faced with another counterpart who used a different rulebook entirely, Lena *desperately* needed to know. Who was she? Who got to claim the name "Lena Vance"?

  The quantum foam surged. The lab dissolved. Lena tumbled back through fractured possibility, the cold steel rim of her original lab rushing up to meet her palms. Thorne’s frantic face swam into view.

  "Lena! Did it work? Did you see? *What did you see?*"

  Lena stared at her hands – her own hands, scarred and familiar. She felt the weight of her memories – Thorne alive, the debt, the reckless choice. The visceral horror of Prime's denial. The chilling ambiguity of the blurred projection's claim. The question wasn't "what did you see?". The question was buried deeper, clawing its way out, raw and unanswered.

  "I saw..." Lena whispered, her voice hoarse. Her gaze fixed on the swirling, treacherous surface of the Quantum Mirror. "I saw... me."
