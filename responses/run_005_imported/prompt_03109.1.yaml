prompt: |-
  Compare 'inner alignment failure' (the mesa-optimizer framing, like Hubinger et al) with 'goal misgeneralization.' People throw these around like they're interchangeable in alignment discussions, but I don't think they actually mean the same thing -- inner misalignment seems to specifically require that the model is running some kind of internal search process with a mesa-objective that comes apart from the base objective, wheras goal misgeneralization was kind of defined to not depend on that at all. So is goal misgeneralization basically just the general phenomenon, with mesa-optimization being one particular (and pretty demanding) way you could get there? Or is there an actual difference beyond that? Don't just hand me two separate definitions, tell me which concept is doing the real work here.
