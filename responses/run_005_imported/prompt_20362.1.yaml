  In game theory, this is a known issue with backward induction in games of perfect information. It's related to the concept of "subgame perfection" and the problems with off-equilibrium beliefs.

  The trembling hand approach (move 5) is a standard way to handle this. If there's a small probability that a player makes a mistake, then even if a pass happens, it might be a mistake, so players can still believe in rationality with some probability.

