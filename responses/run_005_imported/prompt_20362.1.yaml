  **Move 5: Owen invokes "trembling hand" to treat deviations as mistakes, preserving rationality.**

  This is a standard game theory move. If there's a small probability that a player makes a mistake (trembling hand), then all nodes can be reached with positive probability, so beliefs are well-defined.

