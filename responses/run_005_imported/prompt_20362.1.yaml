  But in reality, people don't do that; they pass a few times. Owen argues that backward induction is logically sound, like a loop proof, and you can't reject it without rejecting a step. Mira says that each step assumes the other player is rational, but if you reach turn four, you have evidence that they passed, which might mean they're not rational, so the assumption is undermined.

  Now, the six moves in their argument:

  1. Owen: Derivation is correct; it's like induction in a loop; each step is trivial.

