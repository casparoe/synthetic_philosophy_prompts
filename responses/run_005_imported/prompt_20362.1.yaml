  **Move 4: Mira says there's a difference between formal conditionals and actual beliefs for an agent in the scenario.**

  She says that at turn four, the belief that the other is rational is only justified if reaching turn four isn't evidence against it, but on Owen's setup, it is evidence against rationality.

  This is an epistemic point. If CKR were true, turn four shouldn't be reached, so if it is reached, it provides evidence that CKR doesn't hold. Therefore, at turn four, a player should not believe with certainty that the other is rational.

  In fact, they might assign some probability to the other being irrational or cooperative.

  Then, depending on that probability, passing might be better to allow for more cooperation.

  For example, if player A at turn four thinks there's a chance player B is cooperative, passing could lead to a higher payoff if B also passes.

  Whereas if B is rational, taking now might be better.

