  For example, in a loop, we might prove that after each iteration, some invariant holds, even if we break early.

  But in games, players are making decisions based on beliefs about others, which can change based on actions.

  Owen's point is that for the purpose of deciding at turn one, we use backward induction assuming CKR, and since CKR implies we take immediately, we never face the later decisions.

