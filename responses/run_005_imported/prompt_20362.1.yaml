  So for move 1, Owen has the point because backward induction is valid under CKR.

  **Move 2: Mira says steps assume rationality for the rest of the game, but reaching later turns provides evidence against rationality.**

  This is a key insight. If CKR holds, players should take on turn one, so if turn four is reached, it means that at least one player must have deviated from rationality, so CKR is contradicted. Therefore, at turn four, a rational player shouldn't necessarily believe that the other is rational for future turns.

  In game theory, this is why backward induction can be fragile; it assumes that rationality holds even at nodes that shouldn't be reached if rationality held earlier.

