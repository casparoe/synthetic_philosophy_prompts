  Here’s a eulogy that honors Alan’s complexity—grounded in his lived experience, true to his Leibnizian convictions, and structured for emotional resonance. It runs about 6-7 minutes when spoken slowly.  

  ---

  ### Eulogy for Alan  

  We’re here because we loved Alan.  
  Because he was a brilliant editor who taught so many of us to cut the fluff and find the nerve of a story. Because he listened like a seismograph, catching tremors of meaning others missed. Because he could silence a noisy newsroom with a single raised eyebrow.  

  But Alan was more than his profession. To understand him—*really* understand him—you had to know about the turn his life took after decades of bearing witness. After filing dispatches from war zones and famines in his 20s and 30s, after seeing things that would hollow most people out… Alan didn’t turn away from the world’s chaos. He turned *toward* it with a different lens: science, philosophy, the architecture of ideas.  

  That’s where some of us met him—in the quiet intensity of the science section, or later, in philosophy seminars where he’d sit, sharp-eyed, at the back. Retirement didn’t slow him; it gave him room to dive into Leibniz. Not the caricature—not Dr. Pangloss chirping “all is for the best”—but the real, thorny work: the *Theodicy*.  

  Alan cared fiercely about two things in that work.  

  **First:** Leibniz’s “best possible world” isn’t about happiness. It’s not a Hallcard sentiment. For Alan, it was a stark, almost mathematical elegance: a universe of staggering diversity—joy, yes, but also suffering, wonder, and waste—all unfolding under the fewest, simplest laws. *Maximum phenomena, minimum rules*. He found a terrible beauty in that economy. A cosmic austerity.  

  **Second:** He’d bristle if you said “everything happens for a reason.” Not because he denied cause and effect—the reporter in him knew chains of events cold—but because Leibniz’s whole point was contingency. *This* world isn’t inevitable. Other worlds were possible. This one simply… wasn’t ruled out. Alan had seen too much in Cambodia, in Sudan, in the dust and blood of famines, to pretend otherwise. Randomness wasn’t an abstraction to him. It was a fact.  

  That’s what made his commitment to the idea so arresting. A non-believer, wrestling with why “best” could mean anything if no one chose it. He never quite landed that plane for me—he died with the cockpit door locked—but I think I get it now.  

  For Alan, calling this world “best” wasn’t comfort. It was **courage**. It took courage to stare into the abyss of a child starving in a drought and still insist the universe wasn’t *chaos*—that beneath the horror, there was a terrible, elegant order. That the same laws that bent light through a prism, or spun planets into orbits, also permitted suffering. He didn’t call it “good.” He called it *possible*—and in its stark architecture, he found a reason to keep looking, keep asking, keep demanding clarity.  

  That was Alan: no platitudes, no false comfort. Just the work. The work of seeing the world clearly—first as a reporter, then as an editor, finally as a scholar stitching meaning from calculus and catastrophe. He trained me to inherit his old job not by handing down rules, but by showing how to hold contradictions: grief and wonder, randomness and pattern, the chaos of a newsroom and the silence of a library.  

  So yes, cry today. Cry for a great editor. Cry for a mentor who didn’t soften edges. But also remember: Alan never let us off easy. He asked us to hold the tension—between what is and what could be, between suffering and structure, between the world we have and the worlds that might have been.  

  He found a way to do that. And if he could, after all he’d seen?  
  Maybe we can too.  

  Goodbye, Alan. And thank you—for the rigor, the rage against the shallow, and the relentless, unconsoled wonder.  

  ---

  ### Why this works  
  1. **Acknowledges his trauma & integrity**: Links his war/famine years to his rejection of cheap optimism.  
  2. **Gets Leibniz right**: Explains "best possible world" and contingency *in lay terms* without academic jargon.  
  3. **Satisfies both audiences**: Colleagues hear "great editor"; philosophers hear his actual views (e.g., "cosmic austerity," "contingency," "not chaos").  
  4. **Makes his stance human**: Frames his belief as "courage," not coldness—answering *how* he held it without obscenity.  
  5. **Honors the unresolved**: Leaves his atheism/“best” tension poignant but dignified.  
  6. **Eulogy-first**: Opens/closes with emotion, uses rhythm and concrete images (raised eyebrow, cockpit door, child in drought).  

  Deliver it slowly. Pause at "dust and blood of famines," "he died with the cockpit door locked," and "the world we have and the worlds that might have been." Let the contradictions breathe—that’s where Alan lived.  

  Peace to you Saturday. He’d be proud you’re doing this right.
