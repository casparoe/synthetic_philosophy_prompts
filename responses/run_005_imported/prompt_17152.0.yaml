  I should explain why the bad lot problem feels more acute for IBE. In everyday reasoning, we often have a good set of hypotheses. But in cutting-edge science, where explanations are novel, the risk is higher. Plus, IBE's conclusions are often bold claims about truth, making the gap between "best available" and "true" more problematic. 

