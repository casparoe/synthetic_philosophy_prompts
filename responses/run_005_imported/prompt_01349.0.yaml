  Right, I need to reconstruct Aristotle's moves carefully. First, he establishes bivalence for present/past: "Socrates is sitting" is determinately true or false. Then comes the sea-battle example—this is where it gets tricky. Aristotle says "it will happen or it won't" is necessarily true (law of excluded middle holds), but neither "it will happen" nor "it won't" is *yet* necessarily true. 

  Ah! The key is the modal qualifier "determinately." When Aristotle says we "cannot say determinately which is false," he's distinguishing between a proposition *being* true/false (which holds eternally) and it being *settled* or *necessary* now. For future contingents, truth values exist but aren't accessible or "actualized" yet—like Schrödinger's cat, but in 350 BCE. 

  The user also asks if this blocks fatalism. Yes! Fatalism would require that future truths make events necessary. Aristotle's move denies this: "It will happen" being true (timelessly) doesn't imply it *must* happen—only that it will. The "truth-maker" is the future event itself, not present necessity. 

  But does this abandon bivalence? Not technically. Aristotle preserves "every statement is true or false" even for futures, while adding that we can't *know* or *assert* which one yet. The user might worry this is cheating—is "indeterminate truth" coherent? Later philosophers (like Łukasiewicz) thought not and dropped bivalence for futures. But Aristotle seems to want both: truth values exist, but aren't determinate *to us* until the event unfolds. 

  The user's deeper concern might be about logical consistency. If Aristotle says "one must be true" but then "we can't say which," isn't that waffling? Not if we read "must be true" as a logical requirement and "can't say" as epistemic. Medieval commentators (like Ockham) sharpened this into the "accidentally necessary" vs. "contingent" distinction. 

