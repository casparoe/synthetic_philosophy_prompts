  Okay, the user is the treasurer of a high school investment club. They need to draft a memo for their board meeting about position sizing. The board is split: some want to maximize expected value, others prefer fractional-Kelly for risk management. A fifth member says it's about risk tolerance, not rationality. The user needs a concrete policy, a review timeline, and to address that challenge.

  First, I need to understand the key points. The club manages a small fund from alumni donations. The trades are independent, each with win probabilities and payouts. The debate is between EV maximization and fractional-Kelly. The fifth member's point is crucial—it's about risk tolerance, not just rationality. The memo must respond to this directly.

  The user's explicit request is for a position-sizing policy, when to revisit it, and addressing the risk tolerance challenge. But deeper needs? They might want unity in the board, educational value for members, and long-term fund sustainability. Since it's a high school club, learning is probably as important as returns. Protecting the fund from ruin is key because losing alumni money could end the club.

  Why fractional-Kelly? Pure EV can lead to ruin if a bet loses, especially with multiple trades. Kelly optimizes growth but can be aggressive. Fractional-Kelly (like half-Kelly) reduces risk while still leveraging compounding. It balances growth and safety. Also, the club's risk tolerance isn't quantified, so starting conservatively makes sense.

  Addressing the fifth member: Agree that it's about risk tolerance. The policy choice reflects how much risk the club is willing to take. Fractional-Kelly incorporates risk aversion explicitly, unlike pure EV which ignores it. This turns the disagreement into a structured decision.

  Concrete policy: Use fractional-Kelly with a fraction (e.g., 1/2 or 1/3). Specify how to calculate it. Since trades are independent, size each based on its own edge and odds. Set a max allocation per trade to avoid overconcentration.

  Revisit timeline: After this month's results, or quarterly. This allows learning from real outcomes and adjusting based on performance and comfort.

  Other considerations: High school context means members are learning. Fractional-Kelly teaches risk management. Also, track metrics like max drawdown to evaluate the policy. Emphasize that this is a starting point, not permanent.

  Finally, memo structure: Start with the recommendation, explain why, address the challenge, outline implementation steps, and set review date. Keep it professional but accessible for students.
answer: |-
  ## MEMORANDUM  
  **TO:** Investment Club Board  
  **FROM:** Treasurer  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Position-Sizing Policy & Risk Framework  

  ### 1. Recommended Policy: Fractional-Kelly Sizing (1/3-Kelly)  
  For this month’s trades, we will size positions using **one-third of the full Kelly criterion** for each independent opportunity.  

  - **Implementation:**  
    - Calculate the optimal Kelly fraction for each trade: `ƒ* = (p * b - q) / b`  
      - `p` = Win probability, `q` = Loss probability (1 - `p`), `b` = Net payout odds (e.g., 2:1 payout → `b = 2`).  
    - Allocate **no more than (ƒ* / 3) of the fund** to any single trade.  
    - Cap total exposure at **20% of the fund** across all concurrent trades.  
  - **Example:** A trade with `p = 60%`, `b = 1.5` has `ƒ* = (0.6*1.5 - 0.4) / 1.5 ≈ 0.33`. We’d allocate **11%** of the fund (0.33 / 3 ≈ 0.11).  

  ### 2. When We’ll Revisit  
  We will evaluate this policy after **one full trading cycle** (end of this month) based on:  
  - Portfolio volatility and max drawdown.  
  - Execution practicality (liquidity, trade timing).  
  - Qualitative feedback on risk comfort.  
  A formal vote on longer-term policy will occur at our **next quarterly review**.  

  ---

  ### 3. Addressing the Risk Tolerance Challenge  
  The fifth member is correct: **This is fundamentally a debate about risk tolerance, not rationality.**  

  - Pure expected-value (EV) maximization ignores compounding and tail risk. It rationally maximizes *one-off* returns but risks catastrophic loss under repeated play—a critical flaw for a compounding fund.  
  - Full Kelly maximizes *long-term* growth but assumes precise probability estimates and total loss on failed bets. In practice, its volatility is often unacceptable (e.g., 50%+ drawdowns).  
  - **Fractional-Kelly is not a "compromise" but a direct parameterization of risk aversion.** Using 1/3-Kelly:  
    - Explicitly caps worst-case losses (e.g., ~15% drawdowns vs. ~50% for full Kelly).  
    - Acknowledges our **probability estimates are imperfect** (overconfidence is common).  
    - Aligns with our mandate: Grow the fund *responsibly* for future students, avoiding ruin.  

  This policy embeds a **moderate risk tolerance**: We sacrifice some EV (vs. pure Kelly) to severely reduce risk of severe impairment. If the board desires higher risk (e.g., 1/2-Kelly) or lower risk (e.g., 1/5-Kelly), we can adjust the fraction *after* testing this framework.  

  ---

  ### 4. Next Steps  
  - **Before Thursday:** I’ll distribute 1/3-Kelly sizing calculations for all flagged trades.  
  - **At the meeting:** We vote on this policy for **this month only**, with commitment to review outcomes.  
  - **Key question for debate:** *"Is a 15-20% max monthly loss an acceptable worst-case scenario?"*  

  This approach balances growth, sustainability, and education—while turning abstract risk debates into concrete parameters.  

  // Signature //  
  Treasurer
