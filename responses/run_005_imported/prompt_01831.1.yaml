  We are going to break down the Löbian obstacle and tiling agents step by step.

  The core issue is about an agent that wants to reason about itself and its successors. We'll start by recalling Löb's theorem and then see how it applies to agents.

  ### Löb's Theorem Recap

  Löb's theorem states that, for a consistent formal system \( T \) (that is sufficiently strong, e.g., containing Peano Arithmetic) and for any sentence \( X \) in the language of \( T \), we have:

  If \( T \vdash \square_T X \to X \), then \( T \vdash X \).

  Here, \( \square_T X \) is a formula in \( T \) that expresses the provability of \( X \) in \( T \). In words: if \( T \) proves that "if \( X \) is provable in \( T \) then \( X \) is true", then \( T \) actually proves \( X \).

  This is a fixed point result that comes from the self-referential capabilities of the system.

  ### The Naive Agent Plan

  Imagine an agent \( A_0 \) that operates as follows:

  - It uses a formal system \( T \) (which we assume is consistent and sufficiently strong).
  - It wants to maximize some utility. For simplicity, let's say it has a goal \( G \) (a sentence in \( T \)) and it takes an action \( X \) only if it can prove in \( T \) that taking \( X \) leads to \( G \). We write this as:

    \[
    A_0 \text{ takes action } X \quad \text{iff} \quad T \vdash \square_{T} [\text{do}(X) \to G]
    \]

  But note: the agent's own reasoning is part of the system. So if the agent is considering an action that involves a successor agent (say \( A_1 \)) that reasons the same way, we run into trouble.

  ### The Tiling Agents Scenario

  Consider a simple case: the agent \( A_0 \) is considering delegating a task to a successor \( A_1 \). The idea is: \( A_0 \) will do nothing (or some default action) and let \( A_1 \) take over. But \( A_0 \) will only do this if it can prove that \( A_1 \) will achieve \( G \).

  But \( A_1 \) is built the same way: it will only take an action if it can prove that the action leads to \( G \). So \( A_1 \) might also delegate to \( A_2 \), and so on. We want to avoid an infinite regress.

  The naive hope: \( A_0 \) might think, "If I can prove that \( A_1 \) will achieve \( G \), then I can safely delegate." But note that \( A_1 \) is just like \( A_0 \). So \( A_0 \) needs to prove that \( A_1 \) will achieve \( G \). How? By the same reasoning, \( A_1 \) will only act if it proves that \( A_2 \) will achieve \( G \), etc.

  We need a base case. Suppose that if the agent is the last in the chain, it does something that directly achieves \( G \). But the agent doesn't know whether it is the last. So we have:

  - Let \( \text{do}(A_i) \) be the action of \( A_i \) which is either:
    - Delegate to \( A_{i+1} \), or
    - Take a direct action that achieves \( G \) (if it is the last).

  We want \( A_0 \) to prove that if it delegates, then \( G \) will happen. But to prove that, it must prove that \( A_1 \) will eventually achieve \( G \). However, \( A_1 \)'s behavior is defined similarly.

  ### Enter Löb's Theorem

  We now see the issue: the agent must prove a statement about the behavior of its successor, which is defined in the same way.

  Consider the following: let \( S \) be the statement "if the agent (whatever one it is) takes the delegation action, then \( G \) will be achieved". We want \( A_0 \) to prove \( S \) for the chain starting with \( A_0 \).

  But note that \( S \) is a statement about the entire chain. How can \( A_0 \) prove \( S \)? It might try to use induction. However, the base case (the last agent) is clear: if the last agent is called, it does \( G \). But the problem is that the agent doesn't know if there is a last agent (the chain might be infinite) or how long the chain is.

  Alternatively, we can model the entire chain as one system. Let \( P \) be the statement: "the entire chain of agents achieves \( G \)". We want \( A_0 \) to prove \( P \). But \( P \) is equivalent to: "if \( A_0 \) delegates, then \( A_1 \)'s chain achieves \( G \)", which is \( S \) for \( A_0 \).

  But \( A_0 \) must prove that \( A_1 \) will achieve \( G \) (i.e., \( P \) for \( A_1 \)). However, \( A_1 \) is identical to \( A_0 \) and uses the same proof system. So \( A_0 \) must prove that \( A_1 \) will prove that \( A_2 \) will achieve \( G \), and so on.

  Now, we can see the connection to Löb's theorem. Let \( \square \varphi \) mean "\( \varphi \) is provable in \( T \)". The agent \( A_0 \) wants to prove:

  \[
  \square [ \text{delegate} \to G ]
  \]

  But note that \( \text{delegate} \) leads to \( G \) only if the chain of agents achieves \( G \). However, the chain of agents achieving \( G \) is exactly \( G \) (if we identify the outcome of the chain with \( G \))? Not exactly: the chain might not achieve \( G \) if one of the agents doesn't do its part. So let us define:

  - \( G \) is the goal, which we assume is achieved only if the entire chain (starting from the current agent) achieves it.

  Then the condition for \( A_0 \) to delegate is:

  \[
  T \vdash \square [ \text{delegate} \to G ]
  \]

  But note that \( \text{delegate} \) leads to \( A_1 \) being in charge. So we can write:

  \[
  \text{delegate} \to G \quad \text{is equivalent to} \quad (A_1 \text{ achieves } G)
  \]

  So we require:

  \[
  T \vdash \square (A_1 \text{ achieves } G)
  \]

  But \( A_1 \) is built the same way: it will delegate only if it can prove \( \square (A_2 \text{ achieves } G) \). And if we assume that \( A_1 \) will delegate, then we require \( A_2 \) to achieve \( G \), etc.

  Now, if the chain is infinite, then we have a problem because we never get to the base case. But even for a finite chain, the agent doesn't know the length. So we need a proof that works regardless of the length.

  Alternatively, consider the following: what if the agent tries to prove by induction on the chain length? But the chain length is not known to the agent. Moreover, the agent's proof system \( T \) might not be able to prove the induction step because of self-reference issues.

  ### The 5 and 10 Problem

  The classic example is the "5 and 10" problem. Consider an agent that must choose between two actions: one that gives $5 and one that gives $10. Obviously, we want it to choose $10. But the agent uses the following rule:

  - Choose the action that leads to the highest utility, but only if it can prove that the action leads to that utility.

  Now, suppose the agent has a button that, if pressed, would cause a successor agent (which reasons the same way) to be created and make the decision. The agent's choices are:

  - A: Take $5 now and stop.
  - B: Take $10 now and stop.
  - C: Delegate to the successor (which will face the same choices).

  We want the agent to choose B. But what does it prove?

  If the agent chooses C (delegate), then the successor will face the same choices. We want the successor to choose B. But the successor reasons the same way: it will choose an action only if it can prove that the action leads to the maximum utility.

  Now, what can the agent (the first one) prove?

  - It can easily prove that A gives $5 and B gives $10, so if it chooses A or B, it gets that amount.
  - For C: it must prove that choosing C leads to at least $10 (so that it is at least as good as B). But choosing C leads to the successor making a choice. The agent must prove that the successor will choose B (to get $10) or even better.

  But can the agent prove that the successor will choose B? The successor is identical. So the agent must prove that the successor will prove that B gives $10 and then choose B. However, the successor also has the option to delegate again. So the agent must prove that the successor will not delegate but choose B.

  But the successor's behavior is defined by the same rule: it will choose B only if it can prove that B leads to the maximum utility. The problem is that the successor might also consider delegating, and so on.

  This is where Löb's theorem comes in. Let \( \varphi \) be the statement "the agent (whoever it is) chooses B (the $10 action)".

  The agent (current) wants to prove that if it delegates, then the successor will choose B, i.e., \( \varphi \) holds for the successor. But the successor is identical, so it will only choose B if it can prove that \( \varphi \) holds for the agent after it (if any) or if it is the last. But we don't have a last.

  Alternatively, we can try to prove \( \varphi \) by assuming that the agent will choose B. But note: the agent's own reasoning might be circular.

  Let \( \psi \) be: "the current agent chooses B". The agent is trying to decide whether to choose B or not. But note that if the agent can prove \( \psi \), then it will choose B (because then it knows that B gives $10). But to prove \( \psi \), it must prove that it will choose B, which requires proving that it can prove that B is best, etc.

  This circularity is broken by Löb's theorem. Consider the following:

  Suppose the agent assumes that it will choose B. Then it can prove that it gets $10. But that doesn't help because it has to prove that it will choose B without assuming it.

  Now, what if the agent tries to prove that the entire chain will choose B? That is, for every agent in the chain, it chooses B. Let \( \chi \) be that statement.

  But then the agent must prove \( \chi \). How? By induction? The base case: if there is a last agent, it will choose B because it can prove that B gives $10 and A gives $5. But what if the chain is infinite? Then there is no base case.

