prompt: |-
  I've been down a rabbit hole reading about "evidential cooperation in large worlds" (ECL) from the rationalist/EA corner of the internet - the idea that we should act cooperatively toward agents we can never causally contact (like aliens on the other side of the universe, or versions of us in a different branch of the multiverse) because our choice is correlated evidence about what they choose, even with zero causal link between us. Then I noticed it used to just be called "multiverse-wide superrationality," which makes me think its basically just Hofstadter's old superrationality idea (the one with the twenty strangers and the prize) scaled up to the whole universe. Is that basically right, or is there something actually new going on in ECL that plain superrationality doesn't already capture? Every explaination I find just treats the two as interchangeable instead of spelling out the difference.
reasoning: |-
  Okay, the user is diving into Evidential Cooperation in Large Worlds (ECL) and wondering if it's just Hofstadter's superrationality scaled up. They noticed the term "multiverse-wide superrationality" and are confused about whether ECL adds anything new. Let me start by recalling both concepts.

  Hofstadter's superrationality is about symmetric games where players, knowing they are identical, should cooperate because their decisions are correlated. The Prisoner's Dilemma with identical twins is a classic example. Each reasons that since they both think the same, their actions will match, making mutual cooperation rational without causal links.

  ECL, on the other hand, extends this to large worlds where there are many agents, possibly in different locations or branches. It's not just about symmetry but about decision correlations across vast scales. The key difference is the introduction of "large worlds" where agents might not be symmetric but their decisions are evidentially linked through a common source, like a predictor or evolutionary process.

  The user is probably familiar with basic superrationality but is trying to grasp the nuances of ECL. They might be reading EA or rationalist materials where ECL is discussed in contexts like AI alignment or cosmic cooperation. Their deeper need is to understand if ECL offers new insights for practical applications, maybe in altruism or global coordination. They might also be confused why sources treat both terms interchangeably without clarifying differences.

  I should highlight the shift from small symmetric games to large, possibly asymmetric scenarios in ECL. Emphasize the role of logical correlation and updatelessness, which tackles issues in dynamic games where superrationality struggles. Also, mention how ECL addresses acausal interactions with aliens or other branches, which superrationality wasn't designed for. Making sure to connect these points to why ECL matters for real-world cooperation beyond theoretical games.
answer: |-
  You've hit on a core insight! **You're fundamentally correct that ECL is deeply rooted in and is essentially a scaling up of Hofstadter's superrationality concept.** However, ECL often involves nuances, specific framing, and applications that distinguish it in practice, even if the core logical mechanism remains the same. Here's a breakdown:

  1.  **Hofstadter's Superrationality (The Core Idea):**
      *   **Scenario:** Symmetric games (like repeated Prisoner's Dilemma among identical players).
      *   **Mechanism:** Players recognize they are identical and will reason identically. Therefore, their decisions are *logically correlated*.
      *   **Reasoning:** "If I cooperate, my identical counterpart will reason the same way and also cooperate. If I defect, they will defect. Therefore, mutual cooperation yields the best outcome *for me*."
      *   **Key:** It replaces causal reasoning ("What will *make* the other player do?") with *evidential* reasoning ("What does *my* choice *indicate* about the other player's choice, given our identical reasoning?"). Cooperation becomes the individually rational choice *because* of the logical correlation, not despite it.
      *   **Scope:** Primarily conceived for small, symmetric groups of identical agents in well-defined games.

  2.  **ECL: Scaling Up Superrationality:**
      *   **Scenario:** Vast, potentially infinite "worlds" (multiverses, cosmological scales, large populations of similar agents like humans or future AIs). Agents may be very distant, causally disconnected, or even in different Everett branches. They are not necessarily *identical* but share enough commonality (e.g., similar goals, decision processes, evolutionary history) that their decisions are *logically correlated*.
      *   **Mechanism:** Directly applies the superrationality mechanism: Your choice is evidence about the choices of other correlated agents. Cooperating increases the probability that other correlated agents also cooperate.
      *   **Reasoning:** "My decision to cooperate/acausally trade with this distant civilization isn't causing theirs. But because we are both rational agents likely facing similar dilemmas, my choice *is evidence* that similar agents in similar situations are also choosing cooperation. Therefore, by cooperating, I increase the chance that *I* benefit from cooperation elsewhere."
      *   **Key:** Emphasizes the *evidential* link over any causal link. It explicitly deals with the "large world" setting where causal contact is impossible or meaningless. It focuses on cooperation or coordination as the rational strategy *because* of the logical correlations spanning vast scales.

  **So, Is There Anything *New* in ECL?**

  Strictly speaking, the core logical mechanism of decision correlation is identical to Hofstadter's superrationality. However, ECL introduces important nuances and emphases that make it feel distinct:

  1.  **"Large Worlds" Framing:** This is crucial. ECL explicitly tackles the philosophical and practical implications of applying superrationality logic in settings vastly larger and more complex than Hofstadter's thought experiments – entire cosmologies, infinite multiverses, or populations so large that causal links are irrelevant. This raises unique questions about aggregation, similarity metrics, and anthropics.
  2.  **Focus on Acausal Trade & Cooperation:** While superrationality *enables* cooperation, ECL often centers specifically on the possibility and desirability of *acausal trade* or *acausal cooperation* – exchanging resources or coordinating actions across causal voids purely based on evidential links. This is a direct application of the scaled-up logic.
  3.  **Updateless Decision Theories:** ECL discussions are deeply intertwined with *updateless decision theories* (UDT), particularly those developed within the rationalist community (like Wei Dai's UDT). UDT formalizes the idea of choosing a strategy *before* considering any specific information about your position (e.g., "Which copy am I?"). This helps resolve paradoxes that can arise in large worlds and provides a more rigorous foundation for the "logical correlation" intuition. Superrationality hinted at this, but UDT makes it explicit and generalizable.
  4.  **Practical Applications & Motivation:** ECL is often discussed in the context of:
      *   **AI Alignment:** Ensuring that powerful future AIs, even if vastly separated or duplicated, will choose to cooperate with each other and with humans.
      *   **Existential Risk Mitigation:** Coordinating efforts to prevent human extinction across different possible futures or branches.
      *   **Long-Termism & Cosmic Scale Altruism:** Acting in ways that benefit agents (including future or distant ones) with whom we share logical correlations.
      *   **Anthropics & Self-Locating Uncertainty:** Dealing with questions like "How many copies of me are there?" and "What does that imply for my decisions?" in large worlds.
  5.  **Addressing "Why Cooperate If I'm Unique?":** In a truly infinite multiverse or large population, the argument shifts slightly. While superrationality relies on symmetry among a small group, ECL might argue that even if *you* are unique, your decision algorithm is likely instantiated elsewhere facing similar problems. Cooperating increases the chance that *those other instantiations* cooperate, benefiting others running your algorithm (which you might care about) or creating norms that benefit similar agents.

  **Why the Interchangeability?**

  *   **Core Mechanism:** At their heart, both rely on the same counterintuitive leap: using your own decision as evidence about the decisions of logically correlated others, leading to cooperation without causation.
  *   **ECL as the Natural Extension:** Once you grasp superrationality, applying it to large worlds/multiverses is the obvious next step. "Multiverse-wide superrationality" was a very descriptive earlier name.
  *   **"Evidential Cooperation" as a More Descriptive Term:** "Superrationality" is a bit opaque. "Evidential Cooperation in Large Worlds" explicitly names the mechanism (evidential), the action (cooperation), and the scope (large worlds).

  **Conclusion:**

  You are right. **ECL is fundamentally Hofstadter's superrationality idea scaled up to cosmological/multiversal scales and framed within modern decision theory (especially UDT).** The core insight of logical decision correlation driving cooperation is identical.

  However, the **"Large Worlds" context, the explicit focus on acausal interactions, the integration with formal updateless decision theories, and the specific motivations (AI alignment, x-risk, cosmic altruism)** give ECL its distinct flavor and practical urgency within the rationalist/EA community. It takes the elegant thought experiment and wrestles with its profound, complex, and potentially universe-shaping implications.

  So, while the engine is the same, ECL is superrationality equipped for interstellar/multiversal travel and tasked with solving cosmic-scale coordination problems. The lack of distinction in many explanations reflects their shared core logic, even if the applications and framing differ significantly.
