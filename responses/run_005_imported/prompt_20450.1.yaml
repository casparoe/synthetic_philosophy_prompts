  so the next guest on my podcast (small decision theory / x-risk show, maybe 300 listeners) is a researcher who's basically the go-to advocate for "surrogate goals" as a defense against acausal blackmail -- the idea that you precommit to act like some cheap, made-up goal is a real vulnerability, so that any threatener, even one you've never had causal contact with and who's just inferred your source code or simulated you, rationally redirects its threat there instead of at what you actually value. can you draft me 8-10 interview questions that go beyond just having her restate the pitch? I want at least one question on each of: why the surrogate detour beats just precommitting flat-out to never pay ransoms on the real goal in the first place (the standard updateless/FDT move) -- what does manufacturing a fake vulnerability buy you that blanket resistance doesn't already; whether a threatener smart enough to threaten you acausally is also smart enough to see that your "caring" about the surrogate is instrumental rather than intrinsic, and just route around the whole scheme; and the regress problem -- once its common knowledge that S is the sacrificial goal, whats stopping threats from targeting the commitment mechanism itself, or just ballooning in scope to cover everything you might plausibly value, so you're stuck minting new surrogates forever. for each of those three give me a follow-up keyed to the answer she's most likely to give -- my guess for the regress one is she'll say thats a generic problem for any threat-resistant policy, not something specific to surrogate goals, so bait that out and then push on whether surrogate goals are actually more exploitable on that front than flat resistance would be. then tack on one more question at the end about whether the whole framework secretly assumes a kind of source-code-level self-transparency that bounded, opaque agents -- humans, trained neural nets -- just don't have.
