  Then there's CEV (coherent extrapolated volition) from AI ethics. The user describes it well: it's about fulfilling what humans would want under idealized conditions of knowledge and rationality. The parallel to Rousseau's Legislator jumps out immediately - both seek to implement a "true" will that transcends current preferences.

