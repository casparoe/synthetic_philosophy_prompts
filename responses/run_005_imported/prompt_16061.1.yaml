    "maxim_formulation": {"score": 0, "comment": "..."},
    "conception_test": {"score": 0, "comment": "..."},
    "will_test_and_duty_type": {"score": 0, "comment": "..."},
    "use_of_kantian_examples": {"score": 0, "comment": "..."},
    "total": 0,
    "letter_grade": "..."
  }
  ```
