answer: |-
  ## The Punctual Truth: A Eulogy for Marguerite Calloway

  Good morning. For fifteen years, Marguerite Calloway was my first call when a story needed a sharp, careful quote on public shaming or political hypocrisy. For thirty-one years before that, she was the sharp, careful mind at the heart of this department’s work on the ethics of blame. Her scholarship, tracing the line from Cohen through Wallace, was uncompromising. Her core insight, distilled for every intro class, was this: A hypocrite doesn’t just *look bad* pointing out a fault they share. They actually *forfeit the standing* to raise it at all. They are, as she’d say with a gleam in her eye, borrowing from her debate days, "out of order." However right they might be on the merits, the door is closed.

  Now, Marguerite left instructions. Clear ones. Typed. One line reads: **"Do not let anyone up there call me punctual. I would rather be laughed at than lied for."**

  We honor her by starting here. With the truth. The glorious, inconvenient, philosopher-sized complication.

  Marguerite Calloway was constitutionally incapable of starting anything on time. Not a lecture, not a committee meeting, not her own office hours. Not once in thirty-one years within ten minutes of the posted time. And yet… she was also the fiercest critic of colleagues who kept students waiting, calling it "a small daily theft." She eviscerated the practice in faculty meetings, and yes, even in an op-ed I helped her place. She held others to a standard she herself could not meet.

  Half of you know this history intimately – her students, her co-authors, her worthy adversaries. You’re already thinking about it. The other half – her book club, Sarah, her grandchildren, Maria from the coffee cart – you know Marguerite. You know the whirlwind arrival, the flurry of apologies that never quite masked the sheer *Marguerite-ness* of her presence. You might not know the phrase "standing to blame," but you know the woman.

  So, here we are. At Marguerite’s memorial. And I’m pointing out this fault. Am *I* out of order? Does this very act – highlighting her lateness today, of all days – violate her own profound principle? Am I, by raising a fault we all likely share to some degree (who hasn’t run late?), forfeiting my standing to speak?

  Marguerite would demand we reason this through.

  Her work wasn't about excusing faults. It was about the *conditions* under which we can meaningfully hold each other accountable. It asked: Who gets to knock on the door? Hypocrisy, for Marguerite, slammed that door shut. It poisoned the well.

  But a eulogy… is this *blame*? Is it an accusation? Or is it something else entirely?

  I think Marguerite would argue this is different. A eulogy isn't a demand for accountability addressed to the person who can no longer answer. It’s not a call to change. It’s an act of remembrance, offered *to* the community gathered. It’s about seeing the person whole.

  To *not* mention her legendary lateness today, especially at her own insistence, *would* be a lie. A disservice. It would erase a thread woven into the very fabric of who she was – a thread connected to her intensity, her deep engagement, the way she *could not* disengage from a conversation, a student’s question, a colleague’s argument, or Maria’s coffee cart, until it felt *finished*. Her lateness wasn't indifference; it was often the collateral damage of a mind and heart fully present elsewhere, giving itself completely. She wasn't stealing time; she was deeply invested in the time she *was* in.

  To remember Marguerite truly, lovingly, is to remember the *whole* scholar, the *whole* friend, the *whole* force of nature. That includes the woman who revolutionized our understanding of moral standing, and the woman who, bless her, could never find her keys on time. The uncompromising critic of hypocrisy, and the walking, talking, endearingly late embodiment of the human complexity she studied so rigorously.

  She didn’t want to be lied for. She wanted the truth. Even if it meant being laughed *with*.

  So, Marguerite: You were brilliant. You were fierce. You were deeply, profoundly *loved*. And you… were gloriously, infuriatingly, authentically **late**.

  Thank you for demanding we tell the punctual truth. Thank you for teaching us that real integrity means embracing the whole, complicated, sometimes contradictory picture. You were never "out of order" in our hearts. You were simply, magnificently, Marguerite. We miss you.
