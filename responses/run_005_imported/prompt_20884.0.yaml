prompt: |-
  I co-run a small philosophy-of-science podcast with a labmate (we mostly get grad students and early-career folks who work on the weirder corners of probability and decision theory, since the big names never answer our emails), and this month's guest is a philosopher whose whole research program is defending the Bayesian Doomsday Argument -- the Bostrom/Leslie-style version that runs on the Self-Sampling Assumption, not the "we're probably not special" pop-science gloss you get in Vox explainers. She's published against the reference-class objection and has a paper arguing that anyone who reaches for the Self-Indication Assumption to dodge the doomsday conclusion ends up owning something worse, the presumptuous philosopher problem. Her go-to move whenever someone raises the reference-class worry is to call it "a red herring dressed up as a technical objection," and I dont want to just let her say that on air and move on.

  Can you draft me 8-10 interview questions? I want at least one that goes straight after the "red herring" line and makes her actually commit to what she thinks the right reference class is and why it's "humans" rather than, say, "observers," "observer-moments," or "beings capable of running the argument in the first place" -- one on whether trading SSA for SIA to escape doom really does saddle you with the presumptuous philosopher or whether that's overstated -- and one aimed at the thing that bugs me personally, which is why facts about my birth rank should count as evidence about asteroids, pandemics, and nuclear stockpiles at all, rather than just being a cute artifact of how you carve up the reference class with zero causal contact with the actual risks. For each of those three, give me a natural follow-up keyed to whatever answer she's most likely to give rather than a generic "how do you respond to critics." If there's room left in the 8-10, I'd also like a closing question on whether any of this is supposed to move real-world x-risk funding and policy decisions or whether even she thinks of it as more of an epistemology party trick.
