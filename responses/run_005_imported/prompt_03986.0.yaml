  Reiko then shifts to the "bloat" objection - if we accept extended mind, then everything from GPS to Wikipedia to friends becomes part of our mind. This is a common and serious challenge to the theory. Owen responds with Clark and Chalmers' "glue and trust" conditions which add criteria like constant availability and automatic endorsement. This does seem to mitigate the bloat worry for most everyday cases.

  But Reiko's final move is clever: she argues that adding these extra conditions is ad hoc for a functionalist, since functionalism is supposed to be liberal about implementation. She forces Owen to choose between accepting cognitive bloat or abandoning strict functionalism. This exposes a genuine tension in the extended mind position.

