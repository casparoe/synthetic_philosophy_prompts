  3. **The Modal Principle (Hall)**: This approach abandons strict Humeanism by allowing modal facts. It might work but at the cost of the Humean framework. If we are ranking within a Humean context, this might be less successful. But if we allow non-Humean, then it might be better. Since the problem arises in Humeanism, we are probably looking for Humean solutions. So this might be lower.

