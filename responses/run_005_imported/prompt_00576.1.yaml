answer: |-
  That's a deeply complex and painful situation, and your hesitation is completely valid. Your friend's advice contains *some* important truths, but it also oversimplifies a profoundly human dynamic. Let's break down why both perspectives have merit and where the crucial nuance lies:

  1.  **The Valid Parts of Your Friend's Argument:**
      *   **Understanding the Impact of BPD:** Your friend is right that BPD significantly warps perception, emotional regulation, and impulse control during episodes. The intense fear of abandonment, identity disturbance, and emotional dysregulation can fuel outbursts that feel disproportionate or cruel to others. It *isn't* the same as a neurotypical person making a calculated, malicious choice.
      *   **Adjusting Expectations is Necessary (to a degree):** Understanding BPD *does* mean realizing that certain behaviors are likely to recur. Setting boundaries, managing your own reactions, and having plans for when episodes happen *is* crucial self-preservation. Expecting someone with active, untreated BPD to consistently behave like someone without the disorder *will* lead to repeated hurt and frustration. It *is* like planning for storms if you live in a storm-prone area.
      *   **The Goal of Reducing Resentment:** Holding onto intense, festering resentment *is* harmful *to you*. Your friend is likely trying to protect you from that corrosive emotion.

  2.  **Where Your Friend's Argument Falls Short (and Your Hesitation is Spot On):**
      *   **Confusing Explanation with Justification:** Understanding *why* something happened doesn't automatically erase the *impact* or the *hurt*. Knowing a storm caused the flood doesn't mean your ruined belongings aren't real. Similarly, knowing BPD fueled your brother's words doesn't mean the pain they caused you isn't real or valid.
      *   **Erasing Agency & Personhood (The Core Issue):** This is the critical flaw. Saying "that wasn't him, it was the disorder" risks **dehumanizing** your brother. It implies he has no core self, no capacity for choice, and no responsibility whatsoever. While the *disorder* drives the behavior, it's still *him* experiencing it, *him* saying the words, *him* who needs to navigate the consequences. People with BPD *are* complex individuals, not just vessels for a disorder. Denying any agency treats him like a force of nature (like weather), not a person capable of growth, remorse, and relationship repair.
      *   **Ignoring the Need for Repair:** Your brother's "half-hearted sorry" highlights this. While the *initial outburst* might be heavily influenced by the episode, what happens *afterwards* is crucial for healing the relationship and addressing the hurt. **The "line" you're searching for often exists in the *aftermath*.** Does he:
          *   Acknowledge the *impact* of his words (even if he explains the distorted feelings that led to them)?
          *   Show genuine remorse for the *hurt caused*?
          *   Take steps to understand his triggers and patterns?
          *   Engage in treatment (therapy like DBT) to *reduce* the frequency and intensity of these episodes?
          *   Make amends in a way that feels meaningful to you (even if it's just consistent effort over time)?
      *   **Minimizing Your Pain & Experience:** Telling you to essentially "get over it" because it was "the disorder" invalidates your very real feelings of hurt, betrayal, and anger. Your emotional response is natural and needs to be processed, not dismissed with a clinical explanation.
      *   **"Adjusting Expectations" vs. "Accepting Abuse":** Adjusting expectations means understanding episodes might happen and having coping strategies. It does *not* mean you have to accept verbal abuse, tolerate cruelty without consequence, or have no expectation of accountability or repair afterward. You can understand the storm *and* expect help cleaning up the damage.

  **Where is the "Actual Line"?**

  **The line isn't between "him" and "the disorder." The line exists between *understanding the profound influence of the disorder* and *holding space for his personhood, agency, and the necessity of repair*.**

  1.  **During the Episode:** Yes, the disorder is overwhelmingly dominant. Blaming *him* in that moment as if he's making calm, rational choices is unfair. This is where the "storm" analogy holds some water.
  2.  **After the Episode:**
      *   **Understanding the Why:** Acknowledge the role BPD played in distorting his perceptions and fueling the outburst. This helps *you* contextualize and depersonalize it slightly (though the hurt remains).
      *   **Acknowledging the Hurt:** He needs to acknowledge that his words/actions (even if driven by the disorder) caused you real pain. This isn't about blame, but about validating your experience.
      *   **Taking Responsibility for Repair:** This is the crucial part. He needs to take responsibility for *managing his disorder* and *repairing the relationship damage*. This means:
          *   A sincere apology focused on *your* hurt, not just excuses.
          *   Commitment to treatment and learning skills to manage episodes better.
          *   Consistent effort to rebuild trust and safety in the relationship over time.
          *   Respecting your boundaries if you need space after an episode.

  **Your resentment is understandable because:**

  *   **The hurt was real and deep.** Vicious words cut, regardless of their source.
  *   **There hasn't been adequate repair.** A half-hearted apology fails to address the damage or demonstrate real understanding or commitment to change.
  *   **The lack of ownership.** Even if the outburst was disorder-driven, the *aftermath* requires his engagement as a person. His passivity ("it was the BPD, nothing to be done") feels like abandonment *again*.
  *   **Fear of repetition.** Without visible effort on his part, the threat of it happening again feels constant.

  **What Can You Do?**

  1.  **Validate Your Own Feelings:** Your anger and resentment are signals that something important (your well-being, the relationship) has been damaged and not properly addressed. Don't dismiss them.
  2.  **Seek Support for Yourself:** Consider therapy to process the complex emotions, set healthy boundaries, and learn coping strategies specific to having a loved one with BPD. Groups for family members can be invaluable.
  3.  **Focus on What *You* Can Control:** Your reactions, your boundaries, your self-care. You can't control his BPD or his choices, but you can control how you engage and protect yourself.
  4.  **Consider a Conversation (If Safe & You Feel Ready):** Instead of rehashing the fight, you could try (calmly, at a neutral time) saying something like: *"Brother, I understand your BPD episodes make things incredibly hard and distort your feelings. I know you didn't *intend* to be cruel in that moment. However, the things you said caused me deep pain. What I struggle with is that afterward, it feels like that pain isn't acknowledged, and I don't see the effort to manage things differently or repair the hurt. That's where the resentment comes from. I need to see *your* commitment to managing this and repairing our connection when these things happen."* Frame it around your needs and the impact, not blame.
  5.  **Adjust Expectations Realistically:** This doesn't mean dropping resentment or accepting abuse. It means:
      *   Expecting episodes *might* happen.
      *   Having a plan to protect yourself *during* them (leaving the situation, ending the call).
      *   Managing *your* hope for immediate, perfect repair afterward.
      *   Observing his *actions* over time: Is he *consistently* trying? Is he in treatment? Is his remorse and effort growing?
      *   Understanding that significant change takes time and intense work *on his part*.

  **In short:** Your friend's advice contains pragmatic elements about understanding BPD and self-protection, but it dangerously oversimplifies by erasing your brother's personhood and your valid need for repair. **The "actual line" isn't between him and the disorder; it's drawn in the aftermath, where understanding meets accountability, where explanation meets the hard work of human connection and repair.** Your resentment stems from that repair being absent. It's not about blaming him for the storm, but needing him to help rebuild after it passes. Holding onto *some* resentment until you see genuine effort towards repair and change is a natural, protective response.
