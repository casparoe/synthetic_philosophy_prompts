prompt: |-
  Had a long, kind of frustrating argument with my friend last night that I can't stop turning over in my head. My younger brother has borderline personality disorder, and during a bad episode a few weeks back he said some genuinely vicious stuff to me that he's never really owned up to beyond a half-hearted "sorry, I was in a bad place." When I told my friend I'm still hurt and kind of resentful about it, she said that's not really fair of me since "that wasn't him, it was the disorder," and that the only reasonable thing to do is adjust my expectations of him going forward, like planning around bad weather, instead of staying angry at someone who "wronged" me. Part of me buys the logic, but another part feels like fully dropping the resentment treats him as less of a person, not more. Is she right that once you know the "cause" behind someone's behavior, resentment just stops making sense? Or is there something real behind my hesitation, and if so, whats the actual line?
