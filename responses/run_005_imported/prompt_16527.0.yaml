  We are evaluating each proposed "paradigm shift" against Kuhn's specific criteria:
   - Prior state of crisis and proliferating rival schools
   - Genuine incommensurability of meaning and observation between old and new lexicons
   - Something like a Gestalt switch in perception
   - Wholesale rewriting of textbooks and disciplinary matrix

  Let's go through each case:

  1. **Ptolemaic to Copernican-Keplerian astronomy**:
     - **Crisis**: The Ptolemaic system had become increasingly complex with epicycles. There were rival systems (like Tycho Brahe's) and growing dissatisfaction.
     - **Incommensurability**: The shift from Earth-centered to Sun-centered was a radical change. Concepts like 'planet' changed meaning (e.g., Earth became a planet). Observations were reinterpreted (retrograde motion explained by relative motion, not epicycles).
     - **Gestalt switch**: The entire view of the universe changed. The Earth was no longer the center.
     - **Textbook rewrite**: The shift was fundamental and led to Newtonian physics. Textbooks were rewritten.
     - **Verdict**: Strong Kuhnian case. Often considered a classic example.

  2. **Chemical revolution (phlogiston to oxygen)**:
     - **Crisis**: Phlogiston theory faced anomalies (e.g., metals gaining weight when burned). Rival ideas existed.
     - **Incommensurability**: The concept of combustion and composition changed fundamentally. Phlogiston (a substance released) was replaced by oxygen (a substance absorbed). The very language of chemistry changed (Lavoisier's new nomenclature).
     - **Gestalt switch**: Chemists had to reinterpret reactions in terms of elements and compounds, not principles like phlogiston.
     - **Textbook rewrite**: Lavoisier's textbook (Traité Élémentaire de Chimie) established a new paradigm.
     - **Verdict**: Another classic Kuhnian example (Kuhn wrote a book on it).

  3. **Newtonian mechanics to relativity**:
     - **Crisis**: Newtonian physics had anomalies (e.g., Michelson-Morley experiment, Mercury's orbit). But there wasn't a proliferation of rival schools in the same way. Einstein's work was more of a radical solution.
     - **Incommensurability**: Concepts of space, time, mass, and energy changed. Simultaneity became relative. However, Newtonian mechanics is still approximately valid at low speeds, so there is a correspondence principle.
     - **Gestalt switch**: The view of the universe as having absolute space and time changed to a relative one. But the shift was not as immediate or universal in perception as in astronomy or chemistry.
     - **Textbook rewrite**: Textbooks were rewritten, but Newtonian mechanics is still taught as an approximation. The shift was more of a replacement at high speeds and strong gravitation.
     - **Verdict**: Kuhnian, but note that the transition was not as abrupt and the old theory was not entirely discarded.

  4. **Plate tectonics over geosynclinal theory**:
     - **Crisis**: Geosynclinal theory had become very complex and was failing to explain new data (e.g., seafloor spreading, paleomagnetism). There were competing ideas (continental drift, which was initially rejected, and then plate tectonics).
     - **Incommensurability**: The shift from static continents to moving plates. Concepts like mountain building and ocean basins were completely reinterpreted. The language changed (e.g., subduction, seafloor spreading).
     - **Gestalt switch**: The Earth became dynamic. The perception of the Earth's surface changed from fixed to mobile.
     - **Textbook rewrite**: Textbooks were rewritten entirely in the 1960s and 1970s.
     - **Verdict**: Strong Kuhnian case, as the user (a geophysicist) witnessed.

  5. **Molecular biology revolution (Watson and Crick)**:
     - **Crisis**: Before the double helix, there was no clear model of heredity at the molecular level. There were competing ideas (e.g., Linus Pauling's triple helix, protein vs. DNA as genetic material).
     - **Incommensurability**: The structure of DNA provided a mechanism for replication and coding. However, the shift built upon existing genetics (Mendelian) and biochemistry. The language of molecular biology (genes as DNA sequences) became central.
     - **Gestalt switch**: The double helix was a key moment, but it was more of a breakthrough that opened a new field. It did not immediately overthrow an existing paradigm in the same way. The previous paradigms (like biochemistry) were not entirely displaced but were extended.
     - **Textbook rewrite**: Textbooks were updated, but it was more of a rapid accumulation and integration. Molecular biology became a dominant approach, but it didn't require a complete abandonment of previous knowledge (e.g., biochemistry continued).
     - **Verdict**: Major discovery that led to a new paradigm, but it was more of a revolution within a developing field. It might be seen as a Kuhnian revolution in the context of genetics and biology, but note that biology had multiple competing approaches at the time.

  6. **Cognitive revolution vs. behaviorism**:
     - **Crisis**: Behaviorism (especially radical behaviorism) had limitations in explaining complex mental processes (e.g., language, memory). Chomsky's critique of Skinner was influential.
     - **Incommensurability**: The shift from studying only observable behavior to internal mental states. The language changed (cognitions, information processing). However, behaviorist methods and concepts (like conditioning) are still used in some contexts.
     - **Gestalt switch**: Psychologists began to see the mind as an information processor, not just a black box.
     - **Textbook rewrite**: Textbooks now include cognitive approaches, but behaviorism is still taught as part of psychology. It was more of an addition and partial replacement.
     - **Verdict**: A paradigm shift in psychology, but it was a gradual transition and behaviorism was not entirely abandoned. It might not meet the strict incommensurability and textbook rewrite criteria as fully as the top cases.

  7. **Germ theory vs. miasma theory**:
     - **Crisis**: Miasma theory (disease from bad air) couldn't explain the spread of specific diseases (e.g., cholera in specific patterns). There were rival theories (contagionism, germ theory).
     - **Incommensurability**: The cause of disease shifted from environmental air to specific microorganisms. The language changed (pathogens, infection, vectors).
     - **Gestalt switch**: Diseases were seen as caused by living organisms, leading to new practices (antisepsis, vaccines).
     - **Textbook rewrite**: Medical textbooks were rewritten. Public health practices changed.
     - **Verdict**: Strong Kuhnian case. Koch's postulates and Pasteur's work established a new paradigm.

  8. **Steady-state to Big Bang cosmology**:
     - **Crisis**: The steady-state model (universe eternal and unchanging) faced anomalies (e.g., radio source counts, cosmic microwave background). The Big Bang model (expanding universe from a hot dense state) gained support.
     - **Incommensurability**: The view of the universe changed from eternal to evolving. The concept of the universe having a beginning was radical.
     - **Gestalt switch**: The universe was now seen as having a history and changing over time.
     - **Textbook rewrite**: Cosmology textbooks were rewritten to focus on the Big Bang model.
     - **Verdict**: A paradigm shift, but note that the transition was relatively quick and without as many competing schools as in the classic cases. The Big Bang model built on earlier work (e.g., Hubble's expansion).

