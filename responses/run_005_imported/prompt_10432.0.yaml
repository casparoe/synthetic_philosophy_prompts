answer: |-
  This is an incredibly difficult ethical dilemma with no perfect solution—you're right that either choice involves disappointing someone you care about. However, there *are* ways to navigate this with integrity that minimize harm. Here’s a breakdown of your options, weighing ethics and practicality:

  ### Option 1: Protect the Secret (Prioritize Parents' Request)
  *   **The Challenge:** Requires direct deception ("No, nothing’s planned").
  *   **Pros:** Keeps your promise, honors parents' wishes, ensures the surprise isn't spoiled (protecting their effort and grandma’s experience).
  *   **Cons:** Violates your understanding with your cousin, damages trust in your relationship, reinforces her feeling of exclusion, and causes personal guilt.
  *   **Is it "wrong"?** It prioritizes one commitment (parents) over another (cousin). While a lie, the *intent* is to preserve a joyful moment, not malice. Context matters.

  ### Option 2: Be Honest with Your Cousin (Prioritize Your Bond)
  *   **The Challenge:** Breaks your promise to your parents and risks spoiling the surprise.
  *   **Pros:** Maintains absolute honesty with your cousin, potentially strengthens your bond by showing trust, addresses her fear of exclusion upfront.
  *   **Cons:** Betrays parents' trust, likely causes them significant distress ("mortified"), risks the surprise being spoiled (hurting grandma and others), may damage your relationship with parents.
  *   **Is it "wrong"?** It breaks a specific promise made to protect others' feelings and efforts.

  ### The Third Path: Navigating the Gray Area (Recommended)
  Since neither extreme feels right, try this nuanced approach:

  1.  **Honest Acknowledgment & Appeal to Her Better Self:**  
      *"Cousin, I value our honesty more than anything. I can't lie to you. What I *can* tell you is that I've been asked to keep something specific confidential right now. I need you to trust me on this: you are absolutely loved and wanted in this family. Please, let this one unfold. Can you do that for me, and for Grandma?"*

      *   **Why this works:**  
          *   **No Lie:** You avoid a direct falsehood ("nothing is planned").
          *   **Acknowledges Secrecy:** Confirms *something* exists without details.
          *   **Reassures Inclusion:** Explicitly states she *is* included/wanted (assuming she is invited!).
          *   **Appeals to Her:** Makes her an ally ("Can you do this for me/us?") instead of the problem.
          *   **Protects Core Value:** Maintains your principle of not lying about "things that matter."

  2.  **Immediately Advocate for Her Inclusion (Crucial Step):**  
      **Talk to your parents ASAP.** Say:  
      *"I need to talk to you about Cousin. She came to me directly, clearly feeling left out and asking if something was planned. I couldn't lie to her, but I didn't spoil the surprise. I told her I was bound by confidentiality but reassured her she is loved and wanted. To prevent her feeling excluded and potentially accidentally spoiling things *because* of that feeling, could we find a specific, manageable way to involve her? Maybe helping with one small task right before the event? Her feeling included might actually be the best way to ensure she helps *keep* the secret."*

      *   **Why this works:**  
          *   Shows you protected their secret while being ethical.
          *   Addresses the *root cause* of her past spoiling (exclusion).
          *   Offers a practical solution to reduce risk.
          *   Frames inclusion as a security measure.

  ### Key Considerations & Why the Third Path is Best

  *   **The Cousin's Feelings:** Her past spoiling likely stems from wanting connection. Direct exclusion fuels this cycle. Addressing her need *constructively* (through reassurance and advocating for minor involvement) is more effective than perpetuating secrecy that isolates her.
  *   **Your Integrity:** The "gray" response allows you to avoid a bald-faced lie while honoring the *spirit* of your promise to your parents (protecting the surprise). You're choosing honesty *differently*.
  *   **Risk Assessment:** A vague but reassuring response ("I'm bound by confidentiality, but trust me, you're included") coupled with immediate parental advocacy is *less* risky than a lie she might see through (damaging trust) or full disclosure (ruining the surprise). It makes her feel seen.
  *   **"Pick Family" Revisited:** You *are* picking family – *all* of it. You're protecting the surprise *for* your grandma and parents *while* actively working to heal the rift with your cousin and strengthen the wider family bond.

  ### What if She Pressures You After Your "Gray" Response?
  Hold firm:  
  *"I've told you what I can. Pressuring me puts me in an impossible position between promises. Please respect that I'm asking you to trust me on this one. The best way to be included is to let this happen as planned."*

  ### Conclusion
  The "right" choice isn't binary. **The most ethical and practical path is: 1) Give your cousin a truthful, non-specific response that reassures her inclusion while asking for her cooperation, and 2) Immediately advocate to your parents for a small, safe way to involve her.** This minimizes harm to all relationships, addresses the core issue (her exclusion), protects the surprise, and allows you to act with the most integrity possible in a no-win situation. You will likely disappoint someone *slightly* (your parents might be annoyed you didn't lie; your cousin might be frustrated by vagueness), but you won't have fundamentally betrayed anyone's core trust or ruined the event. You're navigating the conflict with compassion for everyone involved.
