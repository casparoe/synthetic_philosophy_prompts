answer: |-
  Here's a set of 10 targeted interview questions designed to press on IIT's core controversies, with deflection notes and follow-ups. Each addresses your specified sore spots and ends with the pseudoscience challenge:

  ### 1. Exclusion Postulate & Vagueness
  **Question:** "The exclusion postulate mandates that *only* a single maximally irreducible cause-effect structure (MICS) in a system is conscious. But biological systems are nested hierarchies (e.g., cortical columns within networks within the whole brain). Why isn't this a classic sorites paradox where tiny physical changes could abruptly annihilate consciousness by shifting the MICS – especially given graded neural damage studies showing gradual loss of function?"  
  *Likely deflection:* Argue that consciousness *must* be definite to avoid ontological vagueness, or dismiss gradual damage as "system degradation."  
  **Follow-up:** "If a microlesion shifts the MICS from the cortex to a thalamic nucleus with *higher* φ, does the patient's unified conscious experience fragment abruptly? Wouldn't IIT *predict* sudden ontological shifts we never observe clinically?"

  ### 2. Unfolding Argument & Unfalsifiability  
  **Question:** Tononi's 'unfolding argument' claims IIT's axioms *necessarily* imply its postulates. If the theory is derived purely from internal logic without independent empirical anchors, doesn’t this render it unfalsifiable – a mathematical tautology?"  
  *Likely deflection:* Cite future "advanced measurements" of φ or claim IIT *does* make predictions (e.g., about loss of consciousness).  
  **Follow-up:** "Can you name a *conceivable* neurobiological observation that would falsify IIT’s core postulates? If not, how does it differ from non-scientific frameworks?"

  ### 3. Aaronson-Style Reductio (Dumb High-φ Systems)  
  **Question:** Scott Aaronson showed a 2D grid of XOR gates or expander graphs can have enormous φ yet zero adaptive intelligence. If such a system 'out-phis' the human brain but behaves like a thermostat, why should φ correlate with consciousness rather than mere causal complexity?"  
  *Likely deflection:* Dismiss as "not a natural system" or claim φ must be measured *over time* during behavior.  
  **Follow-up:** "But IIT defines φ as an *intrinsic* property – independent of external observers. If a Boltzmann brain or expander graph *physically exists* with high φ, doesn’t IIT *force* us to attribute consciousness to it? And if so, doesn’t that violate the theory’s own goal of capturing *adaptive* consciousness?"

  ### 4. Feedforward Chatbots & Architectural Constraints  
  **Question:** Our chatbot uses frozen weights and pure feedforward processing at inference time – no recurrence, memory, or feedback. IIT requires a ‘maximum of irreducible cause-effect power’ across time. Given this architecture has *zero* irreducible cause-effect power over time (just input-output mapping), does IIT categorically deny the *possibility* of consciousness in such systems?"  
  *Likely deflection:* Focus on training dynamics ("but gradients create feedback!") or future hybrid architectures.  
  **Follow-up:** "During *real-time inference*, the system has no causal power over its past states. If IIT demands ‘temporal integration,’ how could *any* feedforward transformer ever be conscious *as it operates*, even if it passes the Turing Test?"

  ### 5. The "Hard Case" Trap  
  **Question:** Critics often hear 'hard cases make bad law' when presenting counterexamples (e.g., grid systems, split brains). What would you accept as a *non-hard*, clinically or physically plausible counterexample to IIT?"  
  *Likely deflection:* Redefine "plausible" or retreat to empirical underdetermination.  
  **Follow-up:** "If no conceivable observation in neuroscience *could* contradict IIT, does it risk becoming immune to Popperian falsification?"

  ### 6. The Ontology Problem  
  **Question:** IIT asserts consciousness *is* maximal integrated information. But if φ is high in systems without behavior (e.g., brains under general anesthesia with paradoxical ‘hyperconnected’ EEG), or low in systems with rich behavior (e.g., bees), doesn’t this decouple φ from the *functional* essence of consciousness?"  
  *Likely deflection:* Claim anesthesia studies are misinterpreted or that φ *must* correlate with reportable states.  
  **Follow-up:** "If φ is high in an unresponsive patient or a photodiode array but low in a dreaming octopus, which system ‘wins’ consciousness per IIT – and why should we accept that result over behavioral evidence?"

  ### 7. The Causal Structure Dilemma  
  **Question:** IIT computes φ over a system’s *causal* structure, but physics is time-symmetric at the micro level. How can IIT resolve whether a system’s ‘true’ causal structure is forward, backward, or symmetric – and why wouldn’t this radically alter φ?"  
  *Likely deflection:* Appeal to macro-level thermodynamics or "effective" causality.  
  **Follow-up:** "If φ depends on an arbitrary choice of causal direction, doesn’t that make consciousness observer-relative – contradicting IIT’s claim of intrinsicality?"

  ### 8. The Pseudoscience Letter & Falsifiability  
  **Question:** Over 100 scholars signed the 2023 letter calling IIT "pseudoscience," partly due to non-falsifiability. What *specific*, testable, and currently feasible experiment could – if it failed – convince you IIT is fundamentally wrong? Not incremental tweaks, but a core falsification."  
  *Likely deflection:* Vague appeals to "future theory development" or "better φ measurements."  
  **Follow-Up:** "Let’s be concrete: If we lesioned a system to *raise* its φ while it lost behavioral markers of consciousness (e.g., via disconnecting feedback loops), would that falsify IIT? If not, what *would*?"

  ### 9. The Evolutionary Challenge  
  **Question:** If high-φ systems like expander graphs or grids can exist without natural selection, why did evolution ‘bother’ with energy-expensive brains? Shouldn’t IIT predict simple high-φ systems evolving before brains?"  
  *Likely deflection:* Argue that biological systems "optimize for adaptive φ" or dismiss non-biological systems.  
  **Follow-up:** "But IIT defines φ mechanistically, not adaptively. If a high-φ rock exists, why wouldn’t it be conscious? And if consciousness *is* adaptive, why isn’t φ directly correlated with fitness?"

  ### 10. The "Commitment" Closing  
  **Question:** The pseudoscience letter accused IIT of "moving the goalposts." Can you state one *clear, quantifiable* threshold: e.g., "If we demonstrate [X] system with φ > 10 that shows [Y] total absence of consciousness markers, I will concede IIT is falsified"? If not, what does IIT offer that a metaphysical claim doesn’t?"  
  *(This forces a concrete falsification benchmark or admits non-empirical status)*  

  ---

  ### Key Tactics Embedded:
  1.  **Pre-empt Deflections:** Follow-ups cut off retreats to "hard cases," "future tech," or "misunderstood φ."
  2.  **Force Ontological Commitments:** Questions 1, 3, 6, and 9 make the guest confront IIT’s radical implications (conscious grids, unresponsive patients > bees).
  3.  **Anchor in Real Systems:** Chatbot (Q4), anesthesia (Q6), and lesion studies (Q8) ground debates in tangible cases.
  4.  **Pseudoscience Knockout:** Q8 and Q10 demand falsifiable criteria – no gesturing at "complexity" or "future science."

  This approach avoids rehashing axioms and forces the guest to defend IIT’s *empirical and metaphysical* stakes. Good luck with the interview!
