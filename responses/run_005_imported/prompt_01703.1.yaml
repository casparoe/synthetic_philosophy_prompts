  ok so we've been talking about how we justify our beliefs and apparently there's this problem called the regress problem. like, foundationalism says some beliefs are just basically justified without needing support, coherentism says beliefs are justified by fitting together in a coherent system, and infinitism says justification can just keep going on forever. i don't really get why infinitism isn't just like the worst option, but i have to argue for it. can you make the argument that infinitism actually solves the regress problem without just pushing the problem somewhere else?
