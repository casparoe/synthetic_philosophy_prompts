  Also... the user didn't mention but should get at Condorcet efficiency. If RCV sometimes rejects Condorcet winners (like Burlington), is that truly "fixed" strategic voting? Might weave that into Burlington question. 

  Structure-wise: Opening with softballs about her book's core thesis, then escalating to theorems. Saving computational hardness for middle—it's wonkier. Ending with Burlington makes for concrete, memorable closer. 

