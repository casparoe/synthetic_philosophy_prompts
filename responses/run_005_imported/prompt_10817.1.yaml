prompt: |-
  So I fell down a bit of a rabbit hole this week that started on a rationalist-adjacent blog and somehow ended with a 100-year old book on probability theory, and I want someone to help me connect the dots because I don't have a philosophy or econ backround (I write backend services for a living). It started with a post explaining Aumann's "agreeing to disagree" result: if two Bayesian agents start from the same prior and their posteriors on some question end up being common knowledge, they literally cannot still disagree, no matter what private info each of them updated on separately. Apparently this "common prior assumption" is load bearing for a ton of game theory and finance, up to and including "no-trade" theorems which say purely speculative trading between rational agents basically shouldn't happen. That last part definately seemed nuts to me, because real financial markets sure look like a giant pile of people betting against each other because they each think they know better.

  That's what made me think of Keynes, since I remembered from some pop-econ book that he had this "beauty contest" idea of markets being about guessing what other people think average opinion will be, several layers deep, rather than everyone converging on some shared fundamental value. I also vaguely recall that before he was the famous General Theory guy, he wrote a whole book on probability (Treatise on Probability) where he apparently argued that probabilities, or degrees of belief, aren't always even comparable to each other, let alone identical across people. Obviously Keynes died decades before Harsanyi and Aumann formalized any of this, so he never weighed in on it directly. But based on what he actually thought about probability, uncertainty, and how expectations form in markets, what do you think he'd say if you explained the common prior assumption to him? Would he have bought it as a reasonable idealization, or rejected it outright, and on what specific grounds from his own theory of probability? And how does that answer connect back to his broader claim that speculating on other people's beliefs is a structural feature of markets, rather than something that gets competed away as rational agents converge?
