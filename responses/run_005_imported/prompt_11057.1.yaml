answer: |-
  That's a fantastic question born out of a frustratingly relatable experience! You've grasped the core debate between Bratman and Gilbert brilliantly. Let's break down their theories and see how they handle that feeling of being wronged when a groupmate flakes, addressing both your concerns about Bratman's ability to "earn" obligation and Gilbert's potential "spookiness."

  **Core Concepts Recap:**

  1.  **Michael Bratman (Individualist/Reductionist):**
      *   **Shared Intention as Interlocking Individual Attitudes:** A shared intention to J (e.g., complete the history project) exists when:
          *   **Individual Intention-towards-Joint-Action:** Each participant *individually* intends *that we J*. (e.g., "I intend that *we* complete the project.")
          *   **Interdependence & Mesh:** Each intends that we J *in accordance with and because of* the intentions of the others, and *by way of* meshing subplans of each. (My subplan to research relies on your subplan to write; we both know this and intend our plans to mesh).
          *   **Common Knowledge:** All of the above is common knowledge among the participants. (Everyone knows everyone else has these intentions and knows the others know, etc.).
      *   **No "We" Over and Above:** There is no group mind or irreducible plural subject. The "we" is constructed entirely from the appropriately interconnected "I"s.
      *   **Normativity (Obligation) Source:** Primarily stems from the *interdependence* and *reliance* built into the structure. If you flake, you frustrate *my* plan (which depended on you), break the mutual responsiveness, and violate the expectations created by our publicly manifested individual intentions. It's a failure of *coordination* and *reliability*, grounded in individual practical reasoning and expectations.

  2.  **Margaret Gilbert (Plural Subject Theory):**
      *   **Shared Intention as Joint Commitment:** A shared intention arises from a **joint commitment**.
      *   **Joint Commitment Formation:** This occurs when two or more people *together*, as a body, commit *themselves as one* to intending as a body to J. This typically requires each expressing *readiness* to be jointly committed in this way (e.g., "Shall we do the project together?" "Yes!"), and these expressions being common knowledge.
      *   **Creates a Plural Subject:** The joint commitment creates a "plural subject" – a new entity constituted by the commitment itself. The commitment is *owned* by this plural subject ("us"), not individually by each member.
      *   **Obligations & Entitlements:** Joint commitment *directly* generates *normative* relations:
          *   **Obligations:** Each participant is *obligated* to the others *as a body* to do their part in fulfilling the joint commitment.
          *   **Entitlements:** Each participant is *entitled* to expect the others to do their part and *entitled to rebuke* others for non-fulfillment. This entitlement isn't based on a personal promise *to me*, but on violating the commitment *to us*.
      *   **Normativity (Obligation) Source:** The obligation arises directly from the *joint commitment itself*. It's a sui generis (unique) social phenomenon. By jointly committing, the parties create a normative bond between them.

  **Explaining the Feeling of Being Wronged (The Flake Scenario):**

  *   **Bratman's Explanation:**
      *   The flake frustrates your *individual* intention *that we J*. Your plan, built on the reasonable expectation (based on common knowledge of their expressed intention-towards-J and meshing subplans) that they would do their part, is wrecked.
      *   They violated the mutual responsiveness and interdependence central to the shared intention structure. You *relied* on them practically.
      *   The feeling of being wronged stems from this broken reliance, the dashed expectations publicly created, and the practical cost to *your* goals and effort. It's akin to feeling personally let down or betrayed in a cooperative endeavor based on mutual assurances (even if implicit).
      *   **Can it "earn" the obligation?** Bratman argues it captures the *core* of the feeling without needing irreducible group obligations. The "wrong" is the disruption of a complex, interdependent web of individual intentions and plans built on mutual assurances. The rebuke is justified by pointing to the flake's own expressed attitude ("You *said* you intended that we do this, we all relied on that, and your inaction directly contradicts that and sabotages *my* plan!"). It explains *a* sense of being wronged, grounded in broken interdependence and expectations.
      *   **The Challenge:** Does this feel *strong enough*? Does it fully capture the *distinctly collective* nature of the rebuke ("You let *us* down!") rather than just "You let *me* down"? Critics (like Gilbert) argue it misses the inherent *normative authority* the group seems to have over its members. The obligation feels deeper than just broken reliance; it feels like violating a *duty to the group*.

  *   **Gilbert's Explanation:**
      *   The flake violates the *joint commitment* constitutive of the plural subject ("us, the project group"). They are failing in their *obligation to the group as a body*.
      *   Your feeling of being wronged stems directly from their violation of this obligation *to you and the others together*. You are entitled, *as a member of this plural subject*, to expect their performance and to rebuke them for non-performance. The rebuke isn't just "You messed up my plan," but "You failed *us*; you broke *our* commitment."
      *   **Is it "spooky"?** This is the core objection to Gilbert. How can merely expressing willingness ("Yeah, I'll work on the project") *without* an explicit promise ("I promise *you personally* I'll do X") create a binding obligation? Gilbert's response:
          1.  **Not Out of Nothing:** It arises from a specific, recognizable social act – the *joint* creation of a commitment. It's a basic social fact that humans create obligations through mutual agreements/understandings (like accepting an invitation creates an obligation to attend).
          2.  **Not a Promise, but Stronger in a Way:** A joint commitment differs from a set of personal promises. It's a commitment *of the group*, creating obligations *to the group*. This explains why you can rebuke someone even if they didn't promise *you* personally. The obligation is to the *plural subject*.
          3.  **Explanatory Power:** It directly and powerfully explains the specific phenomenology: the sense that the group *itself* has a claim on the members, the entitlement to rebuke *as a member*, and the feeling that the wrong is *to the collective endeavor*. It captures why "We were counting on you!" feels different from "I was counting on you."

  **Which Does Better on the "Feeling Wronged/Obligation" Question?**

  *   **Gilbert has the stronger, more direct explanation.** Her theory is *designed* to account for the robust sense of mutual obligation and entitlement inherent in acting together. The feeling of being wronged when someone flakes *is precisely* the feeling that arises when a joint commitment is violated. The entitlement to rebuke flows directly from the normative structure of the plural subject. Bratman's reliance and interdependence explain *a* sense of letdown, but struggle to fully capture the *collective normative force* – the sense that the flake didn't just mess up *my* plan, but violated a *duty owed to the group*.

  **Addressing Your Specific Concerns:**

  1.  **Can Bratman earn the obligation without borrowing?** Bratman insists he can. He argues the complex structure of interlocking intentions, interdependence, reliance, and common knowledge *is* sufficient to ground the relevant expectations and the sense of being personally wronged through broken cooperation. He doesn't need a Gilbert-style irreducible obligation; he reduces it to complex individual practical reasoning and the normative force of reliance/assurance. However, many find this reduction ultimately unsatisfying for capturing the full, collective flavor of the obligation we feel. He might not *need* to borrow, but critics argue his explanation feels thinner.
  2.  **Is Gilbert's joint commitment "spooky"?** It challenges a highly individualistic view of obligation. But Gilbert argues it reflects a fundamental social reality. Think about simpler cases: If you and a stranger simultaneously rush to help someone lift a heavy object, and you both grunt "Okay, lift on three... one, two, THREE!", and then they just walk away, you'd likely feel they did something *wrong*, not just inconvenient. You might yell "Hey! We were lifting that!". Gilbert argues this intuition points to a basic joint commitment formed by the mutual expression of willingness to act together. It's not magic; it's a basic social ontology. However, it *is* ontologically "heavier" than Bratman's view, positing a new social entity (the plural subject) and a sui generis normative relation. Whether that's "too strong" or "spooky" depends on whether you think our social experiences *require* such an ontology. Bratman argues they don't; Gilbert argues they do.

  **Conclusion & Relating to Your Project:**

  Your group project fiasco is a perfect microcosm. Under Bratman's view, the flake failed to uphold their individual intention towards the joint action, wrecked the mesh of subplans (their research was missing), and violated the reliance built on common knowledge of everyone's (apparent) commitment. Your feeling is justified anger at broken reliance.

  Under Gilbert's view, when your group formed (even informally by agreeing on parts), a joint commitment was likely established. The flake violated an *obligation to the group itself*. Your feeling of being wronged stems from your *entitlement as a member* to expect their performance. Your rebuke ("You didn't do your part!") is an exercise of that normative entitlement granted by the joint commitment.

  **Which is better?** For explaining the *specific phenomenology* of collective obligation and entitlement to rebuke, **Gilbert's theory is more powerful and direct.** It takes the "we" seriously as a source of normativity. Bratman offers a compelling, ontologically parsimonious account of shared *agency*, but his explanation of the robust *normativity* feels less complete for many, leaning heavily on individual reliance rather than collective obligation.

  Gilbert might say your feeling of being wronged wasn't *just* because your personal plan was messed up, but because the flake violated the *group's* commitment. Bratman might say that group commitment is just a useful shorthand for the complex individual intentions and expectations that were genuinely violated. Your group project experience gives you direct insight into which explanation feels more accurate to the depth of the wrong you felt!
