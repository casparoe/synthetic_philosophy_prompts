answer: |-
  Here are 10 interview questions probing the tensions in "Criteria of Negro Art," designed for your protagonist to challenge Du Bois, complete with his likely answers and sharp follow-ups:

  **Core Question 1: The Propaganda/Beauty Paradox**
  *   **Protagonist:** "Dr. Du Bois, you state unequivocally that 'all Art is propaganda.' Yet, you also demand Negro art be 'Beautiful' and rise above mere 'didacticism' or 'sermonizing.' How do you reconcile the inherent didactic purpose of propaganda with your insistence on genuine aesthetic beauty? Doesn't the *intent* to persuade risk corrupting the artistic impulse?"
  *   **Du Bois' Likely Answer:** "Young lady, the reconciliation is precisely the challenge! Propaganda need not be crude. True Art, *by its very nature*, reveals Truth. The Truth of the Negro experience – our beauty, our struggle, our humanity – *is* the most powerful propaganda against the lies of white supremacy. To present that Truth with skill, nuance, and profound beauty *amplifies* its persuasive power. Didactic trash fails as both Art *and* propaganda; it preaches only to the converted and repels the very audience we must reach. Beauty is the vessel that carries Truth to skeptical hearts."
  *   **Follow-Up:** "But doesn't defining 'Truth' and 'Beauty' so narrowly *for* propaganda purposes itself become a constraint? Couldn't a focus on 'uplifting' propaganda lead an artist to avoid depicting painful, complex, or even 'ugly' realities of Black life for fear they wouldn't fit your 'Beautiful' criteria?"

  **Core Question 2: Fire!! & Controlling Images**
  *   **Protagonist:** "Some younger writers, like those associated with *Fire!!*, argue your vision of 'good propaganda' is simply a new form of respectability politics – that demanding art primarily uplift and counter white stereotypes is just as controlling as the old guard demanding perfect manners. How do you respond to the charge that your criteria impose *your* vision of 'proper' Blackness on the artist?"
  *   **Du Bois' Likely Answer:** *(Slightly bristling)* "Respectability? Nonsense. This is about *survival* and *progress*. We are besieged by degrading caricatures. To counter them requires deliberate effort, not naive indulgence in whatever fleeting impulse strikes the artist. Art *is* a weapon. Would you wield a dull, rusted blade? Or one you forged with care? The *Fire!!* group mistakes license for liberty. Their 'freedom' often plays directly into the hands of those who would depict us as primitive or immoral. True freedom lies in wielding our artistic power *effectively* for racial justice."
  *   **Follow-Up:** "Isn't the demand for 'effectiveness' itself a form of control, dictating subject matter and tone? Couldn't an artist argue that authentically depicting the *full* spectrum of Black experience – including its rawness, its despair, its complexities outside uplift – *is* effective propaganda precisely because it shatters simplistic stereotypes, even if it makes white audiences (or some Black ones) uncomfortable?"

  **Core Question 3: Van Vechten & Gatekeeping**
  *   **Protagonist:** "Your recent, fierce criticism of Carl Van Vechten's *Nigger Heaven* centers on its portrayal of Harlem life. You call it harmful propaganda. But many argue your outrage stems less from the novel's *accuracy* as propaganda, and more from resentment that a *white* man is defining the image of Black life for a massive white audience, usurping the role you believe Black artists must fulfill. Is the core issue Van Vechten's *message*, or Van Vechten's *control*?"
  *   **Du Bois' Likely Answer:** *(Forcefully)* "The issue is *both*, inextricably linked! The message *is* harmful precisely *because* it comes from an outsider who, despite his pretensions, cannot grasp the soul of our struggle. He reduces Harlem to a sensual spectacle, focusing on the exotic and the decadent, feeding the prurient fascination of whites while ignoring our intellectual strivings, our cultural depth, our fight for dignity. His control over the narrative *ensures* a distorted, damaging propaganda reaches the dominant audience. Black artists must tell our own stories!"
  *   **Follow-Up:** "If a Black writer had penned *Nigger Heaven* with the same scenes and characters, would you have condemned it with equal fury? Or is the greater sin Van Vechten's whiteness *combined* with his focus on aspects of Harlem life you deem unflattering or unproductive?"

  **Additional Probing Questions:**

  4.  **On Audience:** "You emphasize art reaching white audiences to change their minds. Doesn't this risk making the primary goal of Black art the *management of white perception*, rather than the authentic expression of Black life for Black people? Could this lead to art that feels inauthentic to its own community?"
      *   **Du Bois:** "Our expression *must* be authentic! But authenticity does not preclude strategic purpose. We must speak *both* to ourselves, to strengthen and uplift, *and* to the powerful white world that shapes our oppression. Ignoring either audience is folly. The best art resonates universally *because* of its deep authenticity."
      *   **Follow-Up:** "But doesn't prioritizing the 'white gaze' inherently shape the art, perhaps leading artists to soften edges, explain context excessively, or foreground messages they believe whites need to hear? Can art truly serve two masters – Black authenticity *and* white persuasion – without compromise?"

  5.  **On Defining "Beauty":** "You demand beauty, but who defines it? Aren't prevailing standards of beauty deeply rooted in European traditions? Could insisting on 'beauty' as a criterion inadvertently force Black artists to conform to white aesthetic values to be deemed 'successful' propaganda?"
      *   **Du Bois:** "Beauty is not solely European! We must discover and assert *our own* beauty – the beauty in our features, our music, our resilience, our unique perspective forged in struggle. True Negro art will develop its own aesthetic standards, born from our genius, not imitation. This *is* the discovery I call for."
      *   **Follow-Up:** "Yet, in practice, when evaluating specific works, do you find yourself applying traditional (often European-derived) standards of form, structure, and refinement? Can the 'beauty' you champion escape being measured, consciously or not, against the canon of white art history?"

  6.  **On Subject Matter:** "Does your framework leave room for art that explores purely personal themes – love, grief, nature – without an overt racial message? Or must *every* work by a Negro artist, in this time and place, inherently serve the propaganda purpose?"
      *   **Du Bois:** "In a world saturated with racial prejudice, even the most personal expression by a Negro artist takes on racial significance. A simple landscape painted by one of us is a statement: 'I see beauty; I am human.' It counters the lie that we are incapable of such perception or creation. So yes, *all* art by Negroes in this context serves the cause, consciously or not."
      *   **Follow-Up:** "But doesn't this view instrumentalize *every* facet of Black creativity? Doesn't it deny the artist the fundamental freedom to explore the universal human condition *as an individual*, without the burden of constantly representing the race?"

  7.  **On Didacticism vs. Subtlety:** "You condemn 'sermonizing,' yet your own call for art to show 'Truth' as you define it – our striving, our protest – seems to demand a clear message. Where is the line between powerful, implicit propaganda and the 'didactic trash' you reject? Can propaganda ever be truly subtle?"
      *   **Du Bois:** "The line is drawn by *artistry*. Great art persuades through feeling, image, and narrative, not blunt pronouncements. Think of the sorrow in a spiritual, the defiance in a folk tale, the dignity in a portrait. The message is *felt*, not lectured. Didacticism shouts; true Art sings, and its song carries the Truth deeper."
      *   **Follow-Up:** "But if the ultimate goal is persuasion ('propaganda'), and subtlety risks the message being missed or misinterpreted by the target audience (whites), isn't there a constant tension, even for the skilled artist, between artistic subtlety and propagandistic clarity? Might the pressure to be 'clear' pull the artist towards the very didacticism you warn against?"

  8.  **On the Artist's Autonomy:** "You speak of Art as a weapon to be wielded. Does this view not reduce the artist to a soldier, obligated to serve the cause first? What space remains for artistic exploration, experimentation, or expressing ambiguous or even contradictory truths that might not serve an immediate propagandistic goal?"
      *   **Du Bois:** "The true artist *is* a warrior for Truth and Justice! But a skilled warrior chooses their weapons and tactics wisely. Exploration and experimentation are vital – but they must be in service of discovering *more potent* forms of expression, *deeper* truths that serve the cause. Ambiguity can be powerful, but not if it merely confuses the essential message of our humanity and our right to equality."
      *   **Follow-Up:** "Doesn't this subordinate the artist's individual vision and conscience entirely to a collective political agenda? What if an artist's deepest truth *conflicts* with the current strategic needs of 'the cause' as you define them? Must their art be silenced or altered?"

  **Key Considerations for Your Scene:**

  *   **Du Bois' Tone:** He would be authoritative, articulate, often didactic himself, occasionally impatient or condescending towards a young reporter, but also potentially invigorated by a sharp challenge. He respects intellect, even dissenting intellect.
  *   **Protagonist's Voice:** She needs to be respectful but fearless, well-prepared (having read the essay closely), and quick on her feet. Her questions should show she understands his argument *and* its implications, not just superficial disagreement.
  *   **Harlem 1926 Context:** The tensions are palpable. *Fire!!* just burned, *Nigger Heaven* is the scandalous bestseller, the Renaissance is in full swing but fracturing along generational and ideological lines. The air should crackle with these debates.
  *   **Don't Let Him Monologue:** The follow-ups are crucial. She needs to interrupt politely but firmly when he tries to filibuster or evade, restating the core challenge embedded in her question ("With respect, Dr. Du Bois, that doesn't quite address the tension I'm asking about..."). She should use his own words against him where possible.

  This structure gives your protagonist the tools to push Du Bois into defending his most controversial positions, revealing both the power and the potential pitfalls of his "Criteria of Negro Art" thesis. Good luck!
