  Okay so I'm about two thirds through a historical novel set in Harlem in late 1926, and theres a chapter where my protagonist -- a green reporter for a Black weekly -- lands a real sit-down interview with Du Bois, not long after "Criteria of Negro Art" ran in the Crisis. I don't want him to just deliver the "all art is propaganda" line and have her nod along, I want her to actually press him on it. Can you draft me eight to ten interview questions that dig into the real tensions in that essay -- I want at least one on how he squares calling art "propaganda" with also demanding it be genuinely beautiful and not just didactic trash, one on what he'd say to the younger Fire!! writers who think his version of "good propaganda" is just as controlling as the respectability politics he claims to hate, and one on whether his fury over Van Vechten's Nigger Heaven that same year is really about propaganda at all or just about who gets to control the image of Black life. For each question, give me the answer he's most likely to actually give her, then a sharp follow-up question that doesn't let him off the hook.
