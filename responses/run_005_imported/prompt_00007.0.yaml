     So the gap is that common knowledge of rationality does not lead to a unique outcome.

   Therefore, the Battle of the Sexes is a standard example.
answer: |-
  A classic example illustrating the gap between common knowledge of rationality and the failure of iterated elimination of dominated strategies (IEDS) to yield a unique outcome is the **Battle of the Sexes** game. Consider the following payoff matrix:

  ```
          Player 2
          L       R
  Player 1 
    U     2, 1    0, 0
    D     0, 0    1, 2
  ```

  ### Key Features:
  1. **Common Knowledge of Rationality**: Both players know each other is rational, and this is common knowledge. Each player aims to maximize their own payoff.
  2. **No Dominated Strategies**:  
     - For Player 1:  
       - If Player 2 plays `L`, Player 1 prefers `U` (2 > 0).  
       - If Player 2 plays `R`, Player 1 prefers `D` (1 > 0).  
       Neither `U` nor `D` is strictly dominated.  
     - For Player 2:  
       - If Player 1 plays `U`, Player 2 prefers `L` (1 > 0).  
       - If Player 1 plays `D`, Player 2 prefers `R` (2 > 0).  
       Neither `L` nor `R` is strictly dominated.  
     **IEDS eliminates no strategies**, leaving all action profiles possible.

  3. **Multiple Nash Equilibria**:  
     - `(U, L)` is a Nash equilibrium: Player 1 gets 2 (best response to `L`), Player 2 gets 1 (best response to `U`).  
     - `(D, R)` is a Nash equilibrium: Player 1 gets 1 (best response to `R`), Player 2 gets 2 (best response to `D`).  
     - There is also a mixed-strategy equilibrium, but no pure-strategy equilibrium is uniquely selected.

  ### Why Common Knowledge of Rationality Fails to Pin Down a Unique Outcome:
  - Both players are rational and know the other is rational.  
  - Player 1 prefers `(U, L)` (payoff 2) over `(D, R)` (payoff 1).  
  - Player 2 prefers `(D, R)` (payoff 2) over `(U, L)` (payoff 1).  
  - Without coordination, Player 1 might play `U` expecting Player 2 to choose `L` (since Player 2 knows Player 1 is rational and prefers `U` when `L` is played). Simultaneously, Player 2 might play `R` expecting Player 1 to choose `D`. This could lead to `(U, R)` or `(D, L)`, both yielding (0, 0)—the worst outcome.  

  ### The Gap:
  Common knowledge of rationality ensures players avoid strictly dominated actions, but in this game, **no strategies are dominated**. Thus, IEDS—the standard epistemic solution concept—fails to refine the set of possible outcomes. Rationality alone cannot resolve the conflict of interest or coordination problem, leading to multiple equilibria where players may miscoordinate despite common knowledge of rationality.

  This demonstrates that "rationality is common knowledge" **does not imply** "a unique equilibrium is played," as rationality alone cannot dictate which of the Pareto-incompatible equilibria (each favoring one player) should be chosen.
