prompt: |-
  Give an example of a case where two agents each have common knowledge of the other's rationality, yet epistemic game theory's standard solution concepts (e.g., iterated elimination of dominated strategies) fail to pin down a unique action profile, revealing a gap between "rationality is common knowledge" and "a unique equilibrium is played."
reasoning: |-
  We are looking for a game where:
   1. Both players are rational and this is common knowledge.
   2. The standard solution concept of iterated elimination of dominated strategies (IEDS) does not lead to a unique outcome.

   One classic example is the "Battle of the Sexes" game without communication, but note that in the standard Battle of the Sexes there are two pure strategy Nash equilibria and IEDS does not eliminate any strategies.

   However, let us consider a modified version or another game that fits the criteria.

   Alternatively, consider the following game:

          Player 2
          L     R
   Player 1 
     U    2,1   0,0
     D    0,0   1,2

   This is the Battle of the Sexes. There are two pure Nash equilibria: (U, L) and (D, R). Also, there is a mixed strategy equilibrium.

   Now, iterated elimination of dominated strategies:
   - For Player 1: 
       U: gives 2 if Player 2 plays L, 0 if R.
       D: gives 0 if L, 1 if R.
       There is no strategy that is strictly dominated. Neither U nor D dominates the other.

   - For Player 2:
       L: 1 if U, 0 if D.
       R: 0 if U, 2 if D.
       Again, no dominated strategy.

   Therefore, IEDS does not eliminate any strategy. Thus, we have multiple equilibria.

   But note: common knowledge of rationality does not force a unique outcome. The players know the other is rational, but they still face a coordination problem. They both prefer to coordinate on an equilibrium, but without further communication or convention, they might fail to coordinate.

   However, the problem asks for a gap between "rationality is common knowledge" and "a unique equilibrium is played". In this game, even though rationality is common knowledge, there is no unique equilibrium. The players might end up in (U,L) or (D,R) or even the mixed equilibrium.

   Therefore, the Battle of the Sexes is a suitable example.

   But note: sometimes we might want a game where IEDS does eliminate some strategies but still leaves more than one. However, in this example, IEDS eliminates nothing and leaves all strategies.

   Alternatively, consider a game where IEDS does eliminate some strategies but still leaves multiple outcomes. For example, consider:

          Player 2
          L     M     R
   Player 1 
     U    10,0  0,10  3,3
     M    0,10  10,0  3,3
     D    3,3   3,3   4,4

   In this game, we can eliminate U and M for Player 1? Let's check:

   For Player 1:
     - Compare U and D: 
          If Player 2 plays L: U=10, D=3 -> U>D
          If Player 2 plays M: U=0, D=3 -> D>U
          If Player 2 plays R: U=3, D=4 -> D>U
       So U is not dominated by D, and vice versa.

     - Similarly, M and D: 
          L: M=0, D=3 -> D>M
          M: M=10, D=3 -> M>D
          R: M=3, D=4 -> D>M
       So M is not dominated by D.

     - Now compare U and M? 
          U: (10,0,3)
          M: (0,10,3)
          They are not dominated by each other.

   For Player 2:
     - L: (0,10,3) for (U,M,D) by Player 1.
     - M: (10,0,3)
     - R: (3,3,4)
     - None of these are dominated? For example, R is dominated by neither L nor M because if Player 1 plays D, then R gives 4 which is better than L (3) and M (3). Also, if Player 1 plays U, then R gives 3 which is less than M (10) but more than L (0) -> so not dominated by M? Actually, we need to check strict domination. R is strictly dominated by neither because:
          R vs L: 
            when Player 1 plays U: R=3 > L=0 -> so R is not dominated by L in this case.
          R vs M:
            when Player 1 plays M: R=3 < M=10 -> so R is not dominated by M in this case? Actually, to be strictly dominated by M we would need that M gives strictly more than R in every case. But when Player 1 plays D: R=4, M=3 -> R>M. So R is not dominated by M.

   However, note that R is not strictly dominated by any other strategy. Therefore, no elimination.

   But let's try a different game: the "Traveler's Dilemma" (but note that in the Traveler's Dilemma, IEDS does lead to a unique outcome?).

   Another candidate: a coordination game with a Pareto dominant equilibrium and a risk dominant equilibrium.

   Example:

          Player 2
          A     B
   Player 1 
     A    9,9   0,5
     B    5,0   7,7

   This is a coordination game. Two pure Nash equilibria: (A,A) and (B,B). 
   - (A,A) gives (9,9) and (B,B) gives (7,7). So (A,A) is Pareto dominant.
   - But (B,B) might be risk dominant? Let's compute the risk: 
        For Player 1: 
            If Player 2 plays A: A gives 9, B gives 5 -> best to play A.
            If Player 2 plays B: A gives 0, B gives 7 -> best to play B.
        Without knowing, Player 1 might consider the worst-case: 
            A: min(9,0)=0
            B: min(5,7)=5
        So B is less risky? Actually, the risk dominance concept by Harsanyi and Selten: 
            The equilibrium (A,A) is risk dominant if:
               (9-5) * (9-5) > (7-0) * (7-0)   [this is a simplification for 2x2 symmetric games]
            Here: (4)*(4)=16 and (7)*(7)=49 -> 16 < 49, so (B,B) is risk dominant.

   Now, IEDS:
     For Player 1: 
          A: 9 (if A), 0 (if B)
          B: 5 (if A), 7 (if B)
          No strategy is dominated? 
            If Player 1 thinks Player 2 will play A, then A (9) > B (5). 
            If Player 2 plays B, then B (7) > A (0). 
          So no dominated strategy.

     Similarly for Player 2.

   Therefore, IEDS does not eliminate any strategy. Again, we have two equilibria.

   But note: common knowledge of rationality does not tell the players which equilibrium to choose. So even if they are rational and know the other is rational, they might not coordinate on the same equilibrium.

   Therefore, both the Battle of the Sexes and the coordination game above are examples.

   However, the problem asks for an example. Let me present the Battle of the Sexes:

     Player 1 and Player 2 have two strategies each: {U, D} for Player 1, {L, R} for Player 2.

     Payoffs:
          (U, L): (2,1)
          (U, R): (0,0)
          (D, L): (0,0)
          (D, R): (1,2)

     Rationality is common knowledge. But there are two pure strategy Nash equilibria: (U, L) and (D, R). 

     Why might they fail to coordinate? 
        - Player 1 prefers (U,L) because 2>1.
        - Player 2 prefers (D,R) because 2>1.

     However, without communication, Player 1 might play U hoping that Player 2 will play L (since that's the best for Player 1) but Player 2 might play R hoping that Player 1 plays D. Then they end up at (U,R) or (D,L) which are both (0,0). 

