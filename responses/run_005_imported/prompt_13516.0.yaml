prompt: |-
  so I'm on the committee that runs the internal forecasting tournament at the org I work for -- basically a mini Good Judgment Project, people submit probabilities on stuff like "will this intervention show a significant effect at 12-month follow-up," scored with a log score, and the results feed into actual funding calls. we built a live dashboard so everyone sees everyone else's running forecast and can update on it, because obviously more info-sharing = more accurate, right, very aumann-agreement-pilled of us. except over the last 50ish resolved questions we're seeing textbook herding: whoever posts first anchors basically everyone, the spread of final forecasts has gotten way tighter even on questions where people's private info should differ alot, and on the ones we now know the answer to, the anchored consensus was sometimes confidently wrong in ways a bunch of people admitted afterward (in DMs, never on the dashboard) they'd privately doubted.

  the committee's split three ways: go back to fully blind submission till everyone's in; keep it open but switch to something like Prelec's surprisingly-popular scoring so we're eliciting private info instead of numbers people feel pressure to match; or leave it alone, since each person really was updating rationally on the info they actually had, so "groupthink" is an unfair word for it and it's not our job to override genuinely rational updates just because we dislike the aggregate result.

  can you draft the memo for monday's meeting -- an actual recommendation specific enough to roll out next quarter, the mechanics of why this is happening (not just "groupthink"), and a real engagement with that third camp, since I think they've got a point even if it shouldn't be the last word.
reasoning: |-
  Okay, the user is part of a committee running an internal forecasting tournament at their organization, similar to the Good Judgment Project. They're using a live dashboard where participants can see each other's forecasts and update their own. The problem is that they're seeing herding behavior: the first forecast anchors everyone else, the final forecasts are too tight even when private information should vary, and sometimes the consensus is confidently wrong. The committee is split on three options: go back to blind submissions, switch to a different scoring system like Prelec's "surprisingly popular," or leave it as is because the updates are rational.

  First, I need to understand why herding is happening. The user mentioned Aumann's agreement theorem, which suggests that with common knowledge of rationality, people should converge to the same belief. But in practice, there are issues. People might not fully disclose their private info because they doubt their own expertise or fear social pressure. The first forecaster sets an anchor, and others conform even if they have conflicting data. Also, the dashboard makes updates public, so later submitters might overweight earlier forecasts, leading to information cascades.

  The user's committee has three factions. One wants blind submissions to prevent anchoring. Another prefers Prelec's method to elicit private info by rewarding those who are correct when the majority is wrong. The third group argues that the updates are rational given the shared info, so herding isn't groupthink but proper updating. The user needs a memo that recommends a solution, explains the mechanics, and addresses the third camp respectfully.

  The key is to balance the need for diverse private information with the benefits of updating on others' inputs. Blind submissions might reduce herding but lose the benefit of shared insights. Prelec's method could encourage dissent but might complicate scoring. The third camp has a point about rational updating, but the problem is that private info isn't being fully shared, leading to poor aggregate accuracy.

  I should recommend a hybrid approach. Start with blind submissions until a deadline, then open the dashboard. This allows initial private info to be shared without anchoring. Switching to Prelec's scoring for the open phase could incentivize truthful reporting of dissenting views. Also, adding a "confidence" rating might help weight forecasts. Addressing the third camp by acknowledging rational updates but pointing out that social dynamics prevent full information sharing. Emphasize that the current setup creates information cascades, not just groupthink, due to observable updates.

  Need to outline steps: implement blind collection first, then open dashboard with Prelec scoring. Update the FAQ to explain the rationale, ensuring participants understand the importance of their private info. Highlight that this preserves updating benefits while reducing premature convergence. Mention that this approach is testable and can be adjusted based on results.
answer: |-
  ## MEMO: Addressing Herding in the Forecasting Tournament  
  **To:** Forecasting Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** [Date]  
  **Subject:** Recommendation: Hybrid Blind/Open Submission with Prelec Scoring  

  ### 1. Recommendation: Structured Hybrid Model  
  We propose a **two-phase system** combining blind initial submissions with a transparent update phase, enhanced by **Prelec scoring**, to be implemented next quarter:  

  **Phase 1: Blind Submission (Days 1–7)**  
  - Forecasts submitted privately.  
  - Aggregated anonymized distribution displayed as a histogram (no individual IDs).  
  - *Purpose:* Captures private information without anchoring.  

  **Phase 2: Open Dashboard (Days 8–14)**  
  - Live dashboard opens, showing all forecasts (with IDs) and real-time updates.  
  - **Prelec scoring applied**: Forecasts scored via:  
    `Score = Log(probability) × I(correct) + Weight × [I(your vote = surprisingly popular answer)]`  
    *(Where "surprisingly popular" = answer chosen by those most accurate on past questions)*  
  - *Purpose:* Incentivizes sharing contrarian private info even against consensus.  

  **Why this works:**  
  - **Prevents early anchoring** while preserving wisdom-of-crowds updating.  
  - **Prelec scoring** penalizes herd-following (e.g., agreeing with consensus when wrong) and rewards dissent backed by accuracy.  
  - Balances Aumann-updating benefits with robust private info elicitation.  

  ---

  ### 2. Mechanics: Why Herding ≠ Rational Updating  
  Herding arises from **observable actions distorting Bayesian updates**, not irrationality:  

  - **Information Cascades**: Early forecasts become public signals others overweight. Participants rationally (but wrongly) assume earlier forecasters have superior info, suppressing their own signals.  
  - **Reputational Bounds**: Even with anonymity, public conformity avoids "standing out" if wrong. DM admissions of private doubt confirm this.  
  - **Common Knowledge vs. Private Signals**: Aumann assumes honest belief updates *given all signals*. Our dashboard reveals *actions* (forecasts), not *reasons*. Participants infer signals from actions, creating feedback loops where shared public info drowns private signals.  

  **Result:** Forecasts converge faster than true beliefs, creating false confidence (e.g., tight spreads on ambiguous questions).  

  ---

  ### 3. Engaging the "Rational Updates" Argument  
  The third camp rightly notes:  
  > *"Participants *are* updating rationally on the info available to them via the dashboard. Calling this ‘groupthink’ dismisses legitimate consensus-building."*  

  **We agree in part, but stress:**  
  - Rational individual updates ≠ optimal group epistemology. When private signals are diverse (e.g., clinical vs. operational staff on intervention efficacy), the *process* of aggregating signals matters.  
  - **The dashboard creates an information bottleneck**: Early forecasts become focal points, making it Bayesian-rational to discount one’s own signal if it contradicts the visible trend. This wastes valuable dispersed knowledge.  
  - **Goal isn’t to override rational updates** but to design a system where updates incorporate *all* signals, not just those amplified by visibility.  

  Our hybrid model preserves rational updating *while diversifying the inputs* to that process.  

  ---

  ### 4. Implementation Timeline  
  | **Week** | **Action** |  
  |----------|------------|  
  | 1–2      | Dashboard mods: Build blind submission + Prelec scoring modules |  
  | 3        | Pilot test on 5 non-funding questions |  
  | 4        | Training: Explain Prelec scoring & "surprisingly popular" via FAQ |  
  | Next Q   | Full rollout |  

  **Metrics for success:**  
  - ↑ Spread of final forecasts on ambiguous questions.  
  - ↑ Correct "surprisingly popular" votes where consensus was wrong.  
  - ↓ Correlation between submission order and forecast distance from median.  

  ---

  ### 5. Why Not the Alternatives?  
  - **Full-blind forever**: Loses the benefit of shared insights post-private submission.  
  - **Status quo**: Perpetuates signal loss via cascades. Anchored wrong calls cost real funding.  
  - **Prelec-only without blind phase**: Early public anchors still distort starting points.  

  **This isn’t about forcing dissent**—it’s about ensuring the crowd’s knowledge isn’t silenced by its own visibility. The hybrid model respects rational updating while fixing the input pipeline.  

  **Vote to approve?** Draft spec doc attached.
