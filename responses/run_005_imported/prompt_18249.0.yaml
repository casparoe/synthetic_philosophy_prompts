  Here's a structured argument defending the adaptationist program against the claim that the spandrels critique renders it methodologically bankrupt, hitting your two core points and incorporating key philosophical distinctions:

  **Core Argument: The Spandrels Critique is an Internal Corrective, Not a Methodological Death Blow**

  1.  **The "Spandrel" Designation is Adaptationism-Dependent (Your Point #1):**
      *   **The Comparative Reasoning Requirement:** Identifying a trait *as* a spandrel (a non-adaptive byproduct of selection on *another* trait) inherently relies on the *same toolkit* adaptationists use.
          *   **Evidence Needed:** To robustly argue a trait is a spandrel requires:
              *   Identifying the *primary adaptive trait* it is supposedly a byproduct of.
              *   Demonstrating the *causal link* (developmental, structural, genetic) between the primary trait and the byproduct.
              *   **Crucially:** Showing the *absence of fitness consequences* for the byproduct itself, *or* demonstrating that any fitness consequences are *incidental and not the result of selection shaping the byproduct*. This necessitates comparative analysis across populations/species, functional analysis, and tests for correlation with fitness – **the hallmark methods of adaptationism.**
      *   **Not an "External" Vantage Point:** You cannot declare something a spandrel from a "theory-free" position. The *concept* of a spandrel only makes sense *within* an evolutionary framework where adaptation *is* a major force. The claim "Trait X is a spandrel" is fundamentally a claim *about adaptation* – specifically, about where adaptation *isn't* acting *on this specific trait*. It presupposes the reality and power of natural selection acting elsewhere in the system.
      *   **Conclusion on Point 1:** The spandrel concept functions as a *specific type of evolutionary hypothesis* competing with *direct adaptationist hypotheses* for the trait in question. Both require rigorous comparative/functional evidence. Declaring something a spandrel isn't escaping the adaptationist program; it's participating in a refined version of it, using its methods to argue for a different *kind* of evolutionary explanation (byproduct vs. direct adaptation).

  2.  **Gould & Lewontin's Alternatives are Equally Vulnerable to "Just-So" Criticisms (Your Point #2 & Dennett's Point):**
      *   **The Charge of Unfalsifiable "Stories":** Gould & Lewontin famously criticized adaptationist hypotheses as unfalsifiable "just-so stories." However, their preferred explanations suffer the same vulnerability *if pursued with the same lack of rigor*.
      *   **Developmental Constraints:** Saying "Trait X exists because of developmental constraint Y" is only scientifically valid if:
          *   Constraint Y is empirically demonstrated and characterized.
          *   The causal pathway from Y to X is shown.
          *   Alternative developmental pathways leading to different traits are shown to be impossible or highly improbable *in that lineage*. Otherwise, it's simply a *post-hoc* assertion ("It must be constrained!") with no more inherent validity than a weak adaptationist story.
      *   **Historical Contingency:** Explaining a trait as a "frozen accident" or a consequence of a unique historical sequence requires:
          *   Robust phylogenetic reconstruction showing the contingent sequence.
          *   Evidence that the trait *wasn't* subsequently modified by selection (or that its current form is strongly path-dependent).
          *   Without this, "historical contingency" becomes a catch-all for "we don't see an adaptation *now*," which is just as unfalsifiable as a bad adaptationist story claiming hidden current utility.
      *   **Dennett's "Crane" vs. "Skyhook" Analogy:** Dennett argued that Gould often presented alternatives like constraints or contingency not as other types of *cranes* (naturalistic, mechanistic explanations built from the ground up, like natural selection), but as disguised *skyhooks* (mysterious, unexplained explanatory stops). If a "constraint" isn't itself explained mechanistically (e.g., via physics of development, population genetics), it simply pushes the explanation back a step without resolving it, mirroring the unfalsifiability charge leveled at adaptationism.
      *   **Conclusion on Point 2:** Gould & Lewontin rightly demanded rigor and testability for adaptationist hypotheses. However, their favored alternatives *only escape the "just-so story" charge if held to the same rigorous standards of evidence and mechanistic explanation*. Otherwise, "it's a constraint" or "it's contingent" become functionally equivalent "just-because stories" that halt inquiry rather than advance it.

  **How Godfrey-Smith's Distinctions Fortify This Defense:**

  Peter Godfrey-Smith's taxonomy of adaptationism (Philosophy of Biology, 2001) is crucial here:

  1.  **Empirical Adaptationism:** The *claim* that natural selection is the *only* important cause of evolutionary change, and that most phenotypic traits are adaptations. *This* is the strong claim the spandrels paper directly attacks. The critique *does* effectively challenge the *universal truth* of empirical adaptationism.
  2.  **Methodological Adaptationism:** The *heuristic strategy* that the best way to study evolution is to *assume* (provisionally) that a trait is an adaptation and *test* that hypothesis as the *starting point* for investigation. This is where your defense is strongest.
      *   **Why it's NOT Bankrupt:** Methodological adaptationism is *not* the dogmatic assertion that everything *is* an adaptation. It's a pragmatic research strategy based on the demonstrable *power* and *ubiquity* (though not exclusivity) of natural selection.
      *   **Falsifiable Core:** It *is* falsifiable. If rigorous testing consistently fails to find evidence for an adaptive function *and* finds strong evidence for an alternative (spandrel, constraint, drift), the hypothesis is rejected. The spandrels critique *depends* on this falsifiability to work! It uses adaptationist methods to *falsify* specific adaptationist hypotheses in favor of alternatives.
      *   **Burden of Proof:** Methodological adaptationism addresses Gould & Lewontin's core point about burden of proof *by putting it into practice*. It says: "Start by assuming adaptation because it's the most powerful known force, *but be prepared to abandon that hypothesis* when evidence demands it." The "spandrel" designation is one possible *outcome* of this process, not its refutation.
      *   **Spandrels Rely on It:** As argued in Point 1, identifying a spandrel *requires* first considering the adaptationist hypothesis for the trait itself *and* for the trait it's a byproduct of, using comparative/functional methods.

  **The Tight Synthesis for Your Debate:**

  *   **Against Bankruptcy:** The spandrels critique does *not* show methodological adaptationism is bankrupt. Instead, it **operates *within* its framework**, using the same comparative/functional reasoning to argue for specific *alternative* evolutionary explanations (byproducts). It successfully challenges the *universal truth* of empirical adaptationism, but not the *heuristic value* of methodological adaptationism.
  *   **Point 1 Validated:** Calling something a "spandrel" isn't a magic bullet. It requires **empirical evidence gathered through the very adaptationist methods (comparative analysis, functional tests) it supposedly critiques.** It's an alternative hypothesis tested *using the same toolkit*, not an external vantage point.
  *   **Point 2 Validated:** Gould & Lewontin's favored explanations (constraints, contingency) are **just as susceptible to becoming unfalsifiable "just-so stories"** as bad adaptationist hypotheses *if not subjected to equally rigorous empirical testing and mechanistic explanation*. Dennett was right: they offer no inherent methodological superiority.
  *   **Godfrey-Smith's Key Insight:** The critique primarily targets *empirical* adaptationism (the strong claim). *Methodological* adaptationism (the research heuristic) remains robust because it is **provisional, testable, and explicitly allows for falsification by evidence of spandrels, constraints, or drift.** The identification of spandrels is a *product* of this heuristic, not its refutation. The burden of proof is managed *by* testing adaptive hypotheses first, then alternatives if they fail.

  **How to Use This:** Frame it around **methodological adaptationism as a falsifiable heuristic.** Point out that your flatmate's use of "that could just be a spandrel" only has weight if she can *actually point to the adaptive trait it's a byproduct of and provide evidence for the link and lack of function/selection on the trait itself*. If she can't, it's just speculation, mirroring the weak adaptationist stories G&L criticized. Emphasize that *both* adaptive and non-adaptive hypotheses need rigorous evidence – the critique demands higher standards *within* the evolutionary program, it doesn't invalidate the core methods for investigating function. The real debate is about the *relative frequency* of different evolutionary causes (selection, constraint, drift, byproducts), not the bankruptcy of investigating adaptation.
