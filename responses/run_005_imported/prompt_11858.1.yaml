  Most importantly, the story must never utter the words "Kelly criterion" or "geometric mean." The mathematics emerges through failed plantings, inventory logs, and the crushing realization that positive expectations don't guarantee survival when you only get one sequence of events. When Aris finally understands, it should feel like an awful revelation about the structure of existence itself.
answer: |-
  ## The Seed Master's Dilemma

  The *Eos*’s seed vault smelled perpetually of dust and desperation. Aris Thorne, Seed Master of the generation ship, ran calloused fingers over the translucent sacks of engineered wheat kernels. Each grain represented a potential future, a whisper of green on the unseen planet they were still three centuries from reaching. Today, the sacks felt perilously light.

  "Report, Aris?" Commander Vanya’s voice crackled through the comm. It wasn’t a question; it was a demand laced with the exhaustion of managing ten thousand souls suspended in steel and silence.

  "The hydroponics failure in Sector Gamma was... total," Aris replied, his voice flat. The sterile light glinted off the reinforced glass vials holding their last reserves of non-replicable micronutrients. "We salvaged less than 10% of the expected yield. Our buffer is gone, Commander."

  A pause, heavy with the unspoken: *Again*. Sector Gamma’s failure wasn't the first. The *Eos* was old, her systems increasingly fragile. Each harvest was a gamble against entropy.

  Vanya sighed. "Options?"

  Aris stared at the sacks. Standard protocol dictated planting 70% of the seed stock annually, banking the rest as an absolute reserve. The math was simple, comforting: *Expected Yield = Seed Planted x Average Success Rate*. Average success over decades was 85%. Plant 70%, expect 59.5% back, netting a comfortable surplus. Replant 70% of *that*, compound the growth. It was the arithmetic mean of survival, the spreadsheet logic that governed the ship’s life-support planning for generations. Aris had run the simulations a thousand times. They always showed growth, a gentle upward curve towards sustainability.

  But Sector Gamma’s failure wasn’t an outlier anymore; it felt like a pattern. The comforting curve felt like a lie drawn on fog.

  "We have enough seed for one full planting cycle," Aris stated. "Or… we could plant less. Say, 50%. Reduce the risk."

  "Reduce the *yield*, you mean," Vanya countered. "We need that surplus, Aris. The nutrient reserves are critical. The simulations show–"

  "The simulations show what happens *on average*," Aris interrupted, surprising himself. "Commander, what if… what if we don’t *get* the average? What if we get a bad sequence? Sector Beta was only 75% last cycle. Gamma was a near-total loss. If we plant 70% and get another Gamma…"

  He didn’t need to finish. Planting 70% and losing 90% of the crop meant they’d get back only 7% of the *original* seed stock. Recovery from that would be impossible. The arithmetic mean promised growth, but a single string of bad luck, a few harvests below the break-even point for their planting fraction, could doom them all. The geometric mean – the compounding reality of *actual* sequential outcomes – was a harsher master.

  Vanya was silent for a long moment. "Your job, Seed Master, is to ensure survival. The models, the historical averages… they’re the best tools we have. Plant the 70%. We need the upside. We gamble on the average."

  The gamble felt like a physical weight on Aris’s chest. He remembered his predecessor, Master Liren, an old woman who’d smelled perpetually of loam and worry. She’d once muttered, staring at similar depleted sacks, "The ship doesn’t live across a thousand worlds, Aris. It lives *this* one life. One harvest at a time. The math of averages forgets the sequence." He hadn’t understood her then. He thought she was just weary. Now, facing the abyss Liren had always seemed to see, he felt a chill.

  He obeyed Vanya. He planted 70%. He poured every ounce of skill, every prayer he didn’t believe in, into nurturing Sector Delta. The ship held its breath.

  The blight struck in the sixth week. A fungal contaminant, likely traced back to compromised filters from the Gamma failure. It spread silently, invisibly, until the first shoots began to wither. Containment failed. The yield was catastrophic: 15% salvage.

  Aris stood in the echoing, near-empty vault. They had 10.5% of the *original* seed stock left. Planting 70% of *that* meant risking virtually everything on one throw. The arithmetic mean still whispered promises – *average* 85% yield! – but the geometric reality screamed ruin. A single failure now meant extinction. The comforting spreadsheet curve was a fantasy for a ship that existed in only one timeline.

  He spent sleepless cycles buried not in future projections, but in the *Eos*’s ancient agronomy logs, the raw data behind the smoothed averages. He found Liren’s private notes, encrypted and forgotten. Page after page detailed not grand averages, but *sequences*. Harvest 12: 92% (Plant 65%). Harvest 13: 78% (Plant 60%). Harvest 14: Catastrophic Blight, 8% (Plant 50% of *remaining*). Harvest 15: 95% (Plant 55% of *remaining*)... Slowly, painstakingly, the reserves crept back *because* she hadn't maximized the expected value each time. She’d gambled a *fraction* of the *current* bankroll, leaving room to survive the inevitable loss. She hadn't averaged across hypothetical ships; she’d navigated the single, treacherous path of *this* one.

  It wasn't about maximizing the *average* fortune; it was about maximizing the *growth rate* of their one and only fortune, step by precarious step. It was geometric. It demanded humility before the sequence.

  Aris presented his new plan to the Council, his voice raw. "We plant 40%."

  The outcry was immediate. "Forty percent? That's surrender!" "The models show we need at least 60% to have a chance at rebuilding reserves!" "You're condemning us to slow starvation!"

  Aris projected Liren’s sequence logs, highlighting the near-extinction event she’d weathered by planting a fraction. "The models relying on arithmetic averages assume we can play this game infinitely many times. We cannot. We get *one* sequence. Maximizing the *expected value* tempts us to bet too much, because it ignores the compounding devastation of a loss. Betting a smaller fraction – 40% of what we have *now* – gives us a worse average outcome *if* we could average across universes. But here, now? It gives us a 60% buffer against *this* harvest failing. If it succeeds, even moderately, we plant 40% of a slightly larger stock next cycle. We grow slowly. We survive the bad throws because we didn’t stake everything."

  He pointed to the brutal math. Planting 40% and achieving even a modest 70% yield gave them back 28% of the *original* stock. Still devastatingly low, but *more* than the 10.5% they had now. And crucially, they’d have 60% of the original stock left in reserve. They could try again. Planting 70% now and achieving only 70% yield (a realistic possibility given their weakened state) would give back 49% of the *original* stock, but leave only 30% reserve. Better arithmetic outcome? Yes. But if the yield was worse than 70% – a high probability – they were obliterated. The geometric growth rate favored the smaller bet.

  The debate raged. Vanya, chastened by the Gamma disaster but still wedded to the grand averages, argued fiercely for 55%. Others demanded 60%. Aris held firm on 40%, the number feeling less like calculation and more like a desperate prayer to the goddess of sequences.

  They compromised on 50%. A gut-wrenching middle ground that satisfied neither the arithmetic optimists nor Aris’s geometric dread. He supervised the planting, the precious kernels disappearing into the sterile growth beds, feeling like he was scattering the ashes of their future.

  The harvest was… adequate. 72% yield. Planting 50% of the depleted stock meant they recovered 36% of the *original* seed mass. A net gain from their post-blight position, but agonizingly slow. Reserves were at 50% of original. They’d survived, but the specter of starvation still stalked the lower decks. Rations were cut. Hope was thin and brittle.

  Aris sat again in the vault, the sacks fuller but still insufficient. The tension wasn’t resolved; it was etched into the lines on his face. The arithmetic mean promised a brighter future *if only* they could average their luck. It beckoned them to plant more, chase the surplus, believe in the smoothed curve. The geometric mean was the cruel accountant of their single, unfolding reality: growth only happened if you survived the next step, and survival demanded you leave chips on the table for the next hand. It wasn't just about seeds; it was about every decision made on the edge of ruin. How much of your current life – your time, your hope, your relationships – do you stake on a future that, while probable on average, might never arrive in *your* sequence? How do you rationally bargain between your desperate present self and your possible future selves when only one path gets lived?

  He picked up a single wheat kernel, holding it to the light. It wasn't just potential food. It was a weight in an equation governing a thousand fragile tomorrows. He understood Liren’s worry now, the heavy scent of the earth that wasn’t there. The ship only sailed one course. Rationality wasn't a single star to steer by, but a contested constellation. He knew the formulas, the Kelly fraction whispering 40% in his mind, the arithmetic siren song of 70%. But the right answer for *this* ship, *this* moment, remained shrouded in the dust of the vault, a gamble not against the house, but against the merciless geometry of time itself. The next crisis was coming. He looked at the seed in his palm, a tiny, hard thing holding universes of consequence, and wondered what fraction of his remaining hope he dared to plant.
