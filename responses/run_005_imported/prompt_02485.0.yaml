  **2. Confirming the Unknowability (The Climactic Scene):**

  This is the crux. **You cannot directly "confirm" the unknowable fact *itself*.** That's the point! Confirmation happens *indirectly* by demonstrating the *impossibility* of knowing it. Here’s how to make it work dramatically and logically:

  1.  **The Setup:** The protagonist identifies her candidate Fitch-Truth (e.g., the Pre-Loom State, the Free Will Chain for a specific choice). She *doesn't* need to know the truth itself; she needs to prove it *must* be unknowable.
