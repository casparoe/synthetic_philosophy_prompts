          *   Enters a recursive loop trying to self-reference its origin.
          *   Physically malfunctions (glowing cracks, energy flares, localized archive corruption) when forced to access that "layer."
          *   *Crucially:* It *can* output flawless records from *just after* the critical moment, proving the failure is specific to the target.
      *   **For Free Will:** At a pivotal moment predicted by the Loom, the protagonist (or her subject) makes a choice demonstrably *against* all probability and prediction models derived from the Loom's "complete" data. They exploit the theoretical gap. The Loom's prediction fails spectacularly *for that specific choice*, and crucially, its *post-hoc* explanation reveals gaps or relies on newly invented "probabilities" that weren't in its original model, proving it couldn't contain the *full* truth of the causal chain leading to the free act.
      *   **For Statement K:** She formally submits Statement K to the Loom for verification/archiving via a sacred channel before the priesthood.
          *   The Loom might reject it as "invalid syntax" (but her syntax is flawless for other statements).
          *   It might enter an infinite processing loop, visibly straining its systems (lights pulsing erratically, archive crystals dimming/brightening).
          *   It might output contradictory verdicts in rapid succession (TRUE! FALSE! TRUE! FALSE!).
          *   It might suffer a localized system crash affecting *only* the sector processing self-referential queries.
  3.  **The Argument & Priesthood's Realization:** The protagonist pounces on the *failure*:
      *   "You see? It *cannot* handle it. Not *won't*. *Cannot.*"
      *   "If every truth *were* knowable, Fitch *proves* everything must be known. But look! Here is a truth – the state of its own birth, the truth of a free mind, this very statement – that it demonstrably *does not* and *cannot* know in its entirety!"
      *   "The failure is the proof! The paradox manifests! This *specific* failure, under *these* controlled conditions, targeting a truth that *must* exist if the universe is as we know it, demonstrates the *unknowability* Fitch predicted. The Loom's claim is logically impossible."
  4.  **The Dramatic Confirmation:** The confirmation isn't seeing the unknowable truth. It's:
      *   **Witnessing the Loom Fail:** The visible, undeniable malfunction or logical incoherence when challenged on this specific point.
      *   **The Priesthood's Implosion:** Their faith shatters because they *understand* the logic. They see the failure aligns perfectly with Fitch's Paradox. Their attempts to explain it away sound hollow even to themselves. A senior priest might whisper, "The Paradox... it's real." or simply collapse in despair. Their *recognition* and *loss of certainty* is the victory.
      *   **The Loom's Inability to Recover:** Perhaps it can't even record the *event* of its own failure accurately regarding this specific challenge, creating a ripple of uncertainty in its records.

  **Key Takeaways for Your Scene:**

  *   **Focus on Failure:** The climax isn't revealing a secret fact; it's forcing the Loom to publicly fail at knowing something it *should* know if it were truly omniscient.
  *   **Demonstrate the Paradox:** Tie the specific failure directly to the logical structure of Fitch's argument. Show how *this* failure *is* the manifestation of the unknowability.
