  By using this approach, you create a climax that is both philosophically rigorous and dramatically explosive. The protagonist doesn't find the unfindable truth; she forces the universe (and the priesthood) to acknowledge it *must* exist by breaking the god-machine trying to deny it. Good luck – this is an amazing premise!
