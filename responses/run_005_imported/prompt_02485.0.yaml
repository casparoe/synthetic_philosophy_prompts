  For the climax scene: The protagonist presents a device that changes when observed, and the Loom can't record its unobserved state. Or she uses the Liar Paradox by making the Loom assess a statement about itself. When it fails, the priesthood witnesses the Loom glitching, proving it has a gap. The emotional impact comes from the priesthood's realization that their infallible system has a flaw they can't fix.

