  First, I need to validate their Ramsey test insight. They're right that both conditionals involve supposition. But the key difference is context: what's known when. For indicatives, we're in the actual world, so adding the antecedent must respect current knowledge. For counterfactuals, we're imagining a scenario where the antecedent is false in reality, requiring a departure from actuality.

  The user's confusion stems from seeing both as identical inferences. But possible worlds for counterfactuals handle false antecedents by creating alternative scenarios. Adams' probabilistic approach for indicatives works because the antecedent might be true or unknown, fitting conditional probability. 

  Why don't the frameworks reduce to each other? Adams' system struggles with counterfactuals because probabilities of false events are zero or undefined. Stalnaker-Lewis worlds can't handle indicatives well since they ignore current epistemic constraints. So each addresses different contextual needs.

