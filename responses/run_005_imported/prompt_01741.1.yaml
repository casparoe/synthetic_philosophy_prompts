answer: |-
  Your intuition that both indicative and counterfactual conditionals stem from a Ramsey test is insightful and shared by many philosophers. However, the persistence of distinct formal frameworks (Adams vs. Stalnaker/Lewis) arises because **they solve fundamentally different problems related to context and the epistemic stance of the speaker.** The core difference isn't the inference mechanism itself, but **how the "background knowledge" in the Ramsey test is constrained** when the antecedent is known to be false. Here's why reductionism fails:

  ### 1. **The Ramsey Test & The Epistemic Context Problem**
     - **Indicative (Adams):** Operates within the *current epistemic context*. When evaluating "If P, then Q," you add P to *what you currently believe/know* and see if Q follows. Crucially, **P might be true or unknown.** Adams' conditional probability P(Q|P) perfectly captures this: it asks how likely Q is *given your current information and the supposition of P*.
     - **Counterfactual (Stalnaker/Lewis):** Operates when P is *known or strongly believed to be false*. Adding P to *your actual knowledge* creates an inconsistency. The Ramsey test requires modifying background knowledge to *accommodate P* while preserving as much of actual world history/facts as possible. This demands **minimal alteration of reality** – the essence of possible-worlds semantics. Conditional probability often fails here: if P is known false, P(P) = 0, making P(Q|P) undefined or arbitrary.

  ### 2. **Why Adams (Probability) Can't Reduce Counterfactuals**
     - **Zero Probability Problem:** If you *know* the culture wasn't contaminated (¬C), P(C) = 0. P(Assay Failed | C) is undefined in standard probability. Defining it via Popper functions or infinitesimals is complex and loses intuitive grounding.
     - **Epistemic Inertia:** Probability doesn't inherently prioritize *minimal changes*. Consider: "If this match had been struck, it would have lit." To evaluate this probabilistically *after knowing it wasn't struck*, you need to imagine a world where it *was* struck, but which otherwise matches reality as closely as possible (e.g., oxygen present, dry match). Probability alone doesn't encode this similarity metric – it's purely about degrees of belief in *this* world.

  ### 3. **Why Stalnaker/Lewis (Possible Worlds) Can't Reduce Indicatives**
     - **Epistemic Accessibility:** Indicatives are sensitive to what the speaker *knows now*. "If Oswald didn't shoot Kennedy, someone else did" (indicative) vs. "If Oswald hadn't shot Kennedy, someone else would have" (counterfactual). The indicative reflects *current uncertainty* about history. Possible worlds semantics, using objective similarity, might yield the same truth value for both, ignoring the speaker's epistemic state.
     - **Conditional Probability Intuitions:** Adams captures why we say "If the culture was contaminated, the assay failed" is highly assertable if *in all likely contamination scenarios we can conceive of*, the assay fails. Possible worlds might demand a single "closest" world, which could be unrepresentative (e.g., a freak contamination where the assay succeeds).

  ### 4. **The Fundamental Divide: Epistemic vs. Metaphysical**
     - **Indicatives (Adams):** Primarily *epistemic*. They express reasoning under *uncertainty* ("Given what I know/believe, if P holds, then Q follows").
     - **Counterfactuals (Stalnaker/Lewis):** Primarily *metaphysical*. They express how the world *would have been* if certain non-actual events occurred ("In the closest possible world where P holds, Q also holds").

  ### Why Both Frameworks Persist
  1. **Explanatory Scope:** Each framework solves critical problems the other cannot handle elegantly:
     - Adams explains why indicative conditionals are non-truth-functional (e.g., the paradoxes of material implication) and align with updating beliefs.
     - Stalnaker/Lewis explain counterfactual dependence, preemption, and the role of laws/norms in determining similarity (e.g., why "If I had dropped this glass, it would have shattered" is true, even if I *actually* didn't drop it).
  2. **Linguistic Data:** The Oswald/Kennedy example shows they can diverge in natural language. Indicatives track evidence; counterfactuals track causal/historical dependence.
  3. **Formal Fruitfulness:** Each framework integrates with broader theories:
     - Adams with Bayesian epistemology and decision theory.
     - Stalnaker/Lewis with modal logic, causation, and scientific laws.

  **In essence:** Philosophers generally view the frameworks as *complementary*, not reducible. The Ramsey test is the common *cognitive core*, but **indicatives require holding epistemic context fixed while adding P, whereas counterfactuals require minimally revising epistemic context to make P true.** This contextual difference necessitates distinct formal machinery. Your experimentalist lens is spot-on: indicatives are like "what-if" projections *within* an ongoing experiment (uncertain outcome); counterfactuals are like post-hoc analysis of *what would have happened* in a variant of a *completed* experiment (known outcome). The persistence of both reflects the irreducibility of epistemic supposition to metaphysical possibility, and vice versa.
