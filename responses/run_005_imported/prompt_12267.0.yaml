  Your friend's argument relies on the assumption that, after finding $60 in one envelope, it is equally likely that this amount is the smaller or larger of the two envelopes in the pair. This leads to the conclusion that the other envelope contains $30 or $120 with equal probability, resulting in an expected value of $75, which is higher than $60. However, this assumption of equal probability is not necessarily valid and depends critically on the unknown prior distribution of the smaller amount in the envelope pairs.

  ### The Flaw in the Reasoning
  The key issue is that the probability of the observed amount ($60) being the smaller or larger envelope depends on how the smaller amounts were chosen across all envelope pairs. Let \(S\) denote the smaller amount in a pair, so the envelopes contain \(S\) and \(2S\). The distribution of \(S\) (e.g., uniform, log-scale, or something else) affects the conditional probability that $60 is the smaller or larger amount given that it was observed.

  - If the distribution of \(S\) is such that smaller amounts are more likely, then observing $60 might make it more probable that it is the larger envelope.
  - Conversely, if larger values of \(S\) are more likely, observing $60 might make it more probable that it is the smaller envelope.

  Your friend's argument assumes \(P(\text{\$60 is smaller} \mid \text{observed}) = P(\text{\$60 is larger} \mid \text{observed}) = 0.5\) for any observed amount, but this is only true under very specific (and often unrealistic) conditions, such as an improper prior where \(S\) has a scale-invariant distribution like \(f(s) \propto 1/s\). This distribution is improper (it cannot be normalized over all positive amounts), so it doesn't correspond to a real-world scenario. For any proper prior distribution of \(S\), the conditional probabilities generally will not both be 0.5.

  ### Why the Expected Value Calculation Fails
  Without knowledge of the distribution of \(S\), the expected value of the other envelope cannot be computed accurately. Here's why:
  - The expected value \(E[\text{other} \mid X = 60]\) depends on \(P(\text{\$60 is smaller} \mid X = 60)\) and \(P(\text{\$60 is larger} \mid X = 60)\), which vary with the distribution.
  - For example:
    - If \(S\) is uniformly distributed between \(L\) and \(H\) (with \(2L \leq H\) to allow overlap), then for \(X = 60\) in the overlap region, \(P(\text{\$60 is smaller}) > 0.5\), leading to an expected value greater than $60. But this is not universal.
    - If \(S\) is skewed (e.g., high probability of large \(S\)), observing $60 might imply it is likely the smaller amount, making switching less advantageous or even disadvantageous.

  In cases where the equal probability assumption holds (e.g., discrete uniform distributions with specific values), switching may indeed yield a higher expected value. However, this is not guaranteed for arbitrary distributions or arbitrary observed amounts. Since the argument never uses the specific value $60, it suggests switching is always beneficial, but this leads to the absurdity of infinite swapping, confirming that the assumption is flawed.

  ### The Resolution
  - **Swapping is not always the better bet**: Whether switching is advantageous depends on the unknown distribution of the smaller amounts. Without this information, you cannot conclude that switching has a positive expected gain.
  - **Where the calculation fails**: The failure lies in the unjustified assumption that \(P(\text{observed amount is smaller}) = P(\text{observed amount is larger}) = 0.5\). This ignores the role of the prior distribution of \(S\), making the expected value calculation invalid in general.

  In practice, for the game you played, the amounts might have been chosen in a way that makes the probabilities symmetric, but without explicit knowledge, your friend's reasoning is incomplete. The paradox highlights the importance of considering prior distributions in probability problems. If you must decide based on the information given, sticking with the $60 is rational since no distribution is specified, and switching offers no guaranteed benefit.
