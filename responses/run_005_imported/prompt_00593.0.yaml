  Next, Lewis's solution. He requires that the intrinsic basis persists through the stimulus. For finks, when the mechanism changes the glass's structure upon striking, the basis doesn't persist, so the conditional fails. That makes sense. But masks? The intrinsic basis is still there. The foam doesn't change the glass's fragility; it just absorbs the impact. So Lewis's condition is met, but the manifestation doesn't occur. Hence, masking still breaks the analysis.

  Why is this asymmetry important? Finks attack the disposition's existence during the stimulus, while masks challenge the connection between stimulus and manifestation. Masking shows that even with the disposition and stimulus present, other factors can block the outcome. This highlights a limitation of conditional analysis: it can't account for external interferers. 

  The user also mentions this might be an open problem. Indeed, solutions like adding "in normal conditions" or ceteris paribus clauses are tricky because defining "normal" is vague. Martin's examples emphasize that dispositions are real properties, not just conditionals. 

