answer: |-
  Here’s a draft that honors your mum’s specific wishes, explains her belief accurately but accessibly, acknowledges its role in her courage, and centers the eulogy on *her* and the love she leaves behind – all while respecting the grief of those present in *this* branch:

  ---

  **(Start with warmth and personal memories)**

  Good morning, everyone. Thank you for being here to remember my mum, [Mum's Name]. For those who knew her well, you’ll remember her sharp wit, her quiet determination, and that incredibly practical mind she honed over decades as a bookkeeper. She was never one for fuss, always grounded. Which makes what I want to share next all the more remarkable, and so very *her*.

  Somewhere in her fifties, long after leaving school at 16 and building that solid, practical career, Mum stumbled into something unexpected: popular physics books. And she fell *hard*. Suddenly, alongside her spreadsheets, she was wrestling with ideas about the universe that would make most people's heads spin. She became particularly fascinated by this concept called the "many-worlds" interpretation of quantum mechanics. She’d talk for hours about it – especially after reading Sean Carroll – and she’d try her best to explain it to me, often with a cup of tea and a slightly mischievous glint in her eye.

  **(Explain the core belief simply and accurately)**

  Now, I am *not* a physicist, so forgive the simplicity, but here’s what truly captured her imagination and belief: the idea that every possible outcome of every event actually happens, but in separate, branching realities. Every choice, every chance event, splits the universe. And Mum, with her incredibly logical mind, followed this idea to a very personal conclusion she called "quantum immortality." She genuinely, thoughtfully believed that because the universe keeps branching forever, there is no version of reality where she would ever actually *experience* being dead. From her own perspective, she reasoned, she would always find herself alive in *some* branch of reality, continuing on.

  **(Address the personal comfort AND the distinction she insisted on)**

  This wasn't a vague hope for an afterlife to her. It wasn't about "living on" in spirit for *us*. It was a specific, almost mathematical, consequence of how she believed the fabric of reality worked. And honestly? It gave *her* an extraordinary sense of calm and courage, especially facing what she did these past few years. It allowed her to look at the end of her life in *this* particular branch of reality with a kind of wry detachment. She’d joke – darkly, yes – that somewhere out there in the multiverse, she was a 150-year-old woman hooked up to increasingly ridiculous machines, and she found that thought genuinely funny, not frightening. It took the absolute finality out of it *for her*.

  But Mum was very, very clear about something, and she made me promise to be clear about it today. **Her belief in quantum immortality wasn't meant as comfort for *us*, the people left behind in *this* branch.** She stressed that the branches where she keeps surviving are branches *we* aren't in. She knew, with absolute clarity, that in *this* reality, right here, right now, with all of us gathered, she is gone. She didn't want her carefully reasoned, specific belief turned into a fuzzy sentiment about her "still being out there somewhere" *for our sake*. She knew the loss we feel is real, profound, and happening right here. She knew we were losing *her*, the mum, the friend, the colleague, right here in this room.

  **(Pivot to the legacy: her courage, her spirit, and the love that remains HERE)**

  So why share it? Because this belief, this journey into the wilds of theoretical physics late in life, was such a massive part of who she became. It showcased her incredible intellectual curiosity – the bookkeeper who fearlessly tackled the cosmos! More importantly, it showed her unique brand of courage. This belief, born of logic and wonder, gave her a strength and a serenity in the face of death that was truly humbling to witness. It wasn't about denying death in *this* world; it was about facing it on her own terms, with a mind open to the universe's vast possibilities, and finding a peculiar kind of peace within that.

  **(Conclude focusing on THIS reality and her impact)**

  That peace, that courage, that sharp, curious mind – *that* is what stays with us *here*. That’s the legacy she leaves in *this* branch. The love she gave us, the memories we hold, the quiet strength she showed, the way she could find humor even in the darkest thoughts – *that* is real, tangible, and ours to keep. While Mum found solace in the idea of infinite branches, the most profound truth for *us*, gathered here today, is the unique and irreplaceable woman we knew and loved in *this* one. She faced the end with a bravery rooted in her own fascinating logic, and she taught us, right until the end, what it means to look reality squarely in the eye, even when it’s terrifying, and find your own way through.

  We miss her deeply. We will always miss her. And we are so grateful for the time we had with her in *this* reality, in *this* life. Thank you, Mum, for everything, especially for being so brilliantly, uniquely *you*.

  ---

  **Why this works:**

  1.  **Honors Her Specific Request:** It explicitly states that her belief was *not* for our comfort and clearly defines the separation between "her" surviving branches and "our" branch. It uses her own phrasing ("this branch").
  2.  **Explains Accessibly:** Uses simple metaphors ("branching realities," "paths," "storylines") without dumbing it down. Avoids jargon ("quantum decoherence," "wave function").
  3.  **Highlights the Positive Impact on HER:** Focuses on the calm, courage, and humor it gave *her*, making it clear why it's relevant to her story.
  4.  **Centers the Eulogy on HER:** It's about *her* curiosity, *her* courage, *her* unique mind, *her* way of facing death.
  5.  **Acknowledges the Loss HERE:** Explicitly states the loss is real and profound *in this reality* and validates the grief of the audience.
  6.  **Pivots to Legacy:** Connects her belief to her admirable qualities (courage, curiosity, facing reality) which *do* provide comfort and are part of her legacy *here*.
  7.  **Appropriate Tone:** Respectful, warm, acknowledges her dark humor without dwelling on it morbidly, ends on love and gratitude.
  8.  **Manages Audience Expectations:** Phrases like "forgive the simplicity," "this wasn't a vague hope," and "why share it?" preempt confusion or misinterpretation.
  9.  **Respects the Cousin:** Explains the core concept accurately enough that the PhD cousin will recognize it as a fair representation without needing a lecture. They'll appreciate the care taken.

  **Tips for Delivery:**

  *   **Practice:** Read it aloud multiple times. Get comfortable with the flow, especially the slightly more complex part explaining her belief.
  *   **Pace Yourself:** Slow down, especially during the key explanation and when emphasizing the distinction ("She stressed...", "So why share it?").
  *   **Pause:** Allow pauses after emotional points or the heavier concepts. Let the room absorb it.
  *   **Focus on Her:** When talking about the physics, remember you're really talking about *her* curiosity and courage. Let that come through.
  *   **It's Okay to Cry:** Your emotion honors her too. Have water handy and take a breath if needed. The audience is with you.

  This approach allows you to fulfill your promise to your mum – honoring her unique belief accurately and respecting her specific instructions – while still celebrating her extraordinary spirit and the very real love and loss felt by everyone present *in this branch of reality*. It turns her complex belief into a testament to *who she was*, which is the heart of any eulogy.
