answer: |-
  Here's a clear breakdown of each argument, scored on the -2 to +2 scale, followed by a step-by-step explanation:

  ### Scorecard
  1. **Marcus: "B is strictly dominated by a 50/50 mix of T and M"**  
     **Score: +2** (Correct and fundamental to rational choice theory)  
  2. **Yuki: "But nobody is flipping that coin"**  
     **Score: -2** (Misunderstands the purpose of mixed strategies in dominance)  
  3. **Marcus: "Order of elimination doesn’t matter for strict dominance"**  
     **Score: +1** (Mostly correct, but needs a caveat for mixed strategies)  
  4. **Yuki: "Order might matter because mixed strategies knock out options early"**  
     **Score: -1** (Valid concern but misapplied; order *is* invariant under standard assumptions)  

  ---

  ### Step-by-Step Analysis
  #### 1. **Strict Dominance by a Mixed Strategy**  
  - **Payoff Comparison**:  
    - Against L: B gives 1, while 50% T/50% M gives \(0.5 \times 3 + 0.5 \times 0 = 1.5 > 1\).  
    - Against R: B gives 1, while the mix gives \(0.5 \times 0 + 0.5 \times 3 = 1.5 > 1\).  
  - **Key Insight**:  
    A strategy is **strictly dominated** if *any* other strategy (pure or mixed) yields a strictly higher payoff *for every possible opponent action*. The coin flip is a mathematical device to prove that B is irrational—no rational player would choose B when a better "plan" (the mix) exists, regardless of Player 2’s choice.  
  - **Why Marcus is right**: Rationality doesn’t require physically randomizing; it means B is *never optimal*. Yuki’s "sleight of hand" objection confuses implementation with rationality.  

  #### 2. **The "Nobody’s Flipping That Coin" Objection**  
  - **The Flaw**:  
    Mixed strategies in dominance checks aren’t about commitment to randomize—they’re *proof tools* showing B is suboptimal under *all* beliefs about Player 2. If Player 1 believes Player 2 might play L, T is better than B; if R, M is better. Since Player 1 doesn’t know Player 2’s move, choosing B is irrational *no matter what they believe*.  
  - **Analogy**:  
    Saying "I won’t use a mixed strategy" is like saying "I won’t consider probabilities." Rationality requires avoiding strategies that lose to *some* alternative (mixed or pure) in all scenarios.  

  #### 3. **Order-Independence of Iterated Strict Dominance**  
  - **The Theorem**:  
    Under **strict** dominance (with no ties), the set of surviving strategies is **order-independent**. If a strategy is strictly dominated at *any* round, it will be eliminated regardless of sequence.  
  - **Caveat**:  
    This holds *only if* mixed strategies are allowed in dominance checks. If you restrict to pure strategies only, order *can* matter (e.g., in some games, a pure strategy may only become dominated after a mixed strategy eliminates another option first).  
  - **Marcus’s Claim (+1)**:  
    He’s correct that order doesn’t matter *in theory* but oversimplifies by not acknowledging that mixed strategies are essential for this property. Yuki’s TA example likely involved weak dominance (see below).  

  #### 4. **The TA Disagreement and Weak vs. Strict Dominance**  
  - **Why Yuki’s TA Example is Misleading**:  
    - **Weak dominance**: If a strategy is weakly dominated (e.g., "never better, sometimes worse"), elimination order *can* change the outcome.  
    - **Example**: In a game with ties, eliminating a weakly dominated strategy early might remove options that could have dominated others later.  
    - **The TA’s Context**: The deduction likely occurred in a **weak dominance** problem. If the problem set didn’t specify "strict," students might assume weak dominance, where order matters.  
  - **Yuki’s Concern (-1)**:  
    Valid in highlighting ambiguity but incorrect for *this* problem (strict dominance with mixed strategies). Marcus correctly noted weak dominance is "a different animal," but should have emphasized that mixed strategies resolve order-dependence in strict cases.  

  ---

  ### Final Resolution
  - **B is strictly dominated** by the 50/50 mix of T and M. Eliminating it first is correct.  
  - **Order doesn’t matter** for iterated *strict* dominance when mixed strategies are allowed.  
  - **The TA’s deduction** likely involved weak dominance or a problem restricting to pure strategies. In this specific game, with strict payoffs and mixed strategies permitted, Marcus’s approach is valid.  

  ### Practical Advice
  In problem sets, always:  
  1. Clarify if dominance is strict/weak.  
  2. Specify if mixed strategies are allowed.  
  3. For strict dominance with mixed strategies: eliminate in any order—results are identical.  
  4. For weak dominance: proceed cautiously, as order may affect outcomes.  

  This reconciles the math (Marcus) with the pedagogical ambiguity (Yuki’s TA example).
