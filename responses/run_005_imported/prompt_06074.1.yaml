  - **Oskar's notion**: A joint activity is merely **two individuals acting in parallel within a shared space**, bound only by explicit agreements or basic courtesy. Changes in personal commitment (e.g., waning enthusiasm) are individual prerogatives.  
    *Requirement the other lacks*: Formalized terms (e.g., promises) to trigger obligations beyond ad-hoc coordination during active involvement.  

  Renata emphasizes the *relational process* (implicit cooperation), while Oskar emphasizes the *individual autonomy* (explicit consent). This divergence explains their conflict: Renata sees silence as a betrayal of jointness; Oskar sees it as a neutral exercise of freedom.
