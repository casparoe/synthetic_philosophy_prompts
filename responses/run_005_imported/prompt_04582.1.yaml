answer: |-
  ## The Swamp Man's Heart

  The first sensation was cold. Thick, sucking cold, like mud packed around every limb. Then, the smell: ozone sharp as shattered glass, overlaid on the primordial decay of stagnant water and rotting vegetation. Sound rushed in – the frantic chirping of disturbed frogs, the drone of unseen insects, the heavy patter of rain on broad leaves, and beneath it all… *thump-thump… thump-thump… thump-thump.*

  He opened his eyes. Grey pre-dawn light filtered through a canopy of twisted cypress draped in moss. He was half-submerged in black water, thick reeds scratching his skin. He sat up, mud sloughing off his naked body. He knew *things*. He knew the reeds were called reeds, the water was water, the grey light meant dawn. He knew he was cold, he knew he needed to get out of the water. But he knew nothing else. No name. No past. No sense of *before*.

  He stood on shaky legs. The mud sucked at his feet. He looked down at his chest. It moved rhythmically. He placed a hand over the left side. *Thump-thump. Thump-thump.* Solid. Familiar. A heart. *His* heart. Pumping blood. Keeping him alive. The thought was instinctive, unquestioned. He breathed in the damp air, felt his lungs expand. Another function. Obvious.

  He stumbled onto a slightly drier patch of moss-covered ground. The rain lessened. He shivered violently. He needed warmth. He remembered fire. *Fire produces heat.* He looked around. Nearby, a lightning-shattered tree stump smoldered, a tiny orange ember winking in the damp gloom. Hope flared. He gathered damp twigs and leaves, clumsy fingers fumbling with the task yet somehow knowing *how*. He blew gently on the ember, coaxing a fragile flame to life. Heat bloomed, pushing back the swamp’s chill. He held his hands close, feeling the blood warm in his fingers, his heart rate slowing slightly with the comfort.

  He looked at the small fire, then at his hands. The reflex had been instant, automatic. His hand had jerked back from the first lick of flame that caught a dry leaf. *Pain. Danger. Withdraw.* A vital function. Protection. Preserving the organism.

  But a whisper started, cold as the swamp water still clinging to his legs: *Preserving for what?*

  He knew the words for things, the mechanics. He knew his heart pumped blood to oxygenate tissues. He knew his lungs exchanged gases. He knew his hand withdrew from fire to prevent tissue damage. But *why*? Why did these things happen? Why were they *for* something?

  The answer that surfaced felt borrowed, second-hand: *Evolution. Selection. Traits persist because they aided survival and reproduction in ancestors.* He pictured a lineage stretching back, hearts thumping in fish, in amphibians, in mammals… each beat selected for, refined over eons. *That* was the source of the function. The history gave it meaning.

  He looked down at his own chest again. *Thump-thump.* Strong. Steady. Pumping blood just like any other heart. But… was it? He had no ancestors. There was no line. No selection. No struggle for survival that shaped this specific organ. He hadn’t grown; he’d… coalesced. A lightning bolt. A cosmic accident in a swamp.

  So, was the pumping… just noise? Just pointless motion? Like the gurgle of the swamp water? Was the warmth it generated just incidental physics, not a *purpose*? The comforting heat from the fire suddenly felt hollow. Was the reflex that saved his hand *functional*, or just an empty, pre-programmed twitch in a system built without a blueprint of purpose?

  Panic, cold and sharp, pricked at him. He grabbed a small, smoldering twig from the fire’s edge. He held it close to the back of his other hand. The heat intensified. Pain signals screamed. His muscles tensed, ready to jerk away. *Withdraw! Preserve!*

  But he held it. He focused on the impulse, the biological imperative. *Is this function? Or just… happening?* He gritted his teeth against the burn. *What makes this reflex different from a rock falling? Gravity makes it fall. But does the rock *intend* to fall? Does it have the *function* of falling?*

  He yanked his hand back as the pain became unbearable. A small red welt bloomed. The reflex had worked. It had preserved tissue. *But for what purpose?* The question echoed louder now. Without history, without a future implied by that history (reproduction, continuation of a line he didn't belong to), was preservation just… delaying the inevitable decay of a random arrangement of atoms? Was his heart just a particularly complex pump in a temporary eddy of organized chaos, its rhythmic thudding no more inherently meaningful than the dripping of the swamp water?

  He sat back, cradling his burned hand, staring at the small, persistent fire. He felt the warmth on his skin, the steady *thump-thump* in his chest, the breath filling his lungs. All the processes worked. They interacted. They sustained *this* moment. The "bigger system" – this body, this consciousness – was undeniably *working*. By the "current contribution" view, everything functioned perfectly.

  But the cold knot of doubt remained. Was this just a magnificent, meaningless machine? A clockwork universe wound up once by lightning and now ticking down? Did the word "function" imply a *why* that simply didn't exist for him? That his hand withdrew, not because the reflex was *for* preservation in a meaningful lineage, but because the atoms were arranged to react that way? That his heart beat, not to serve a purpose shaped by eons, but because the swamp lightning accidentally built a pump that started pumping?

  He pressed his hand harder against his chest, feeling the vibration, the life-force it propelled. It felt real. It felt essential. It *was* him.

  But the silence of his past was a void. And in that void, the simple, vital *thump-thump* began to sound like a question mark echoing in an empty cathedral. *What am I doing?* it seemed to ask. *What are any of us doing?*

  He stayed by the fire as the true dawn finally broke, painting the swamp in greens and golds he could name but couldn't *know*. The warmth reached his skin. The blood flowed. The hand healed. It all worked. He existed.

  Yet, huddled naked on the moss, listening to the insistent rhythm within, he couldn't shake the chilling whisper: *But does it mean anything?* The heart beat on, a perfect pump with no history, its function a riddle written in blood and thunder.
