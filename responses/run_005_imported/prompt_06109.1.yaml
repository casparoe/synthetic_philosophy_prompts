        "description": "Contrasts with Bayesian updating by noting: no fixed hypothesis space/likelihoods, money-pump motivation, and handling of logical uncertainty."
      },
      "advanced_claims": {
        "max_points": 3,
        "description": "Handles nuanced claims correctly: Solomonoff comparison must note fundamental differences; convergence only guaranteed to truth for decidable sentences."
      }
    },
    "grading_notes": "Deduct -0.5 for minor omissions; -1 to -1.5 for significant technical errors. Total = sum of sections."
  }
  ```

  ### How to Apply Rubric Consistently
  1. **Stock Market Framing:** Award 2 if both payout structure ($1/$0) and prices-as-credence are present.  
  2. **Criterion Explanation:** 3 points only if it specifies *polynomial-time exploiters* and *no halting oracle* dependency.  
  3. **vs. Bayesian:** Full credit requires mentioning at least 2 of: no fixed prior/likelihood, logical uncertainty, or money-pump dynamics.  
  4. **Advanced Claims:**  
     - **Solomonoff:** Deduct 1.5 if equated beyond surface-level (their mechanisms are unrelated).  
     - **Convergence:** Deduct 0.5 if claiming *all* sentences converge to 1/0 (only decidable ones do).  

  This ensures objective grading focused on technical precision, not "vibes." The student lost points primarily on misrepresenting Solomonoff and overgeneralizing convergence—key points any LI paper reviewer would flag.
