  First, I need to recall the core of each theory. The norm-violation account suggests that people judge an action as intentional when it violates a norm because that violation reveals more about the agent's intentions. The deep-self account argues that intentionality depends on whether the outcome aligns with the agent's stable values or character.

  The user mentioned that in the classic chairman case, both accounts align—harming the environment is both a norm violation and misaligns with the agent's character. So the challenge is to create a scenario where these two factors diverge. I need a situation where a norm is violated but it doesn't reflect the agent's deep self, and vice versa.

  Let me brainstorm scenarios. For the first case (norm violation without deep-self mismatch), I consider a character who is generally conscientious but breaks a minor norm for a good reason. The side effect should be negative but not reflective of their values. For example, a punctual professor running late to help someone, causing a student to miss office hours. The norm violation is being late, but their deep self is caring, so the harm (student missing help) isn't intentional under deep-self but might be under norm-violation.

  Next, the opposite: deep-self mismatch without norm violation. A character with questionable values but follows norms. Their action has a negative side effect that aligns with their values but doesn't break any norms. For instance, a CEO who values profit over employee well-being but follows regulations, leading to layoffs as a side effect. Here, no norm is broken, but the outcome matches their deep self. Deep-self theory would say the layoffs are intentional, while norm-violation might not.

  I need to ensure the scenarios are clear and distinct from the original chairman case. Also, the side effects should be unintended but foreseeable. Testing these predictions: in the professor case, norm-violation predicts calling the harm intentional, deep-self predicts not. In the CEO case, deep-self predicts intentional, norm-violation doesn't.

