answer: |-
  That's a fantastic core concept, and your editor steered you right with Lewis! You've hit on the crucial tension between the *logic* of convention (it's arbitrary, any equally good solution would work) and the *psychology/sociology* of convention (it feels essential, sacred, or at least *ours*). **Lewis is logically correct, but human behavior often makes shifting even arbitrary conventions incredibly difficult.** Cutting the political battle would likely weaken your subplot and miss a profound truth about human societies, especially isolated ones like a generation ship.

  Here's why the fight makes perfect sense, even with Lewis's definition:

  1.  **Habit & Cognitive Ease:** Lewis acknowledges the power of precedent. Doing what we've always done requires no conscious thought. Switching requires active effort, constant monitoring, and potential mistakes. This friction is real, even if the new rule is "just as good." People instinctively resist the cognitive load.
  2.  **Signaling & Identity:** Conventions become markers of group membership and identity. Following the "ship way" signals you belong, you understand the unspoken rules, you're a reliable cooperator. Changing a convention can feel like:
      *   **Rejection of Tradition:** It implies the old way was "wrong" or foolish, implicitly criticizing previous generations (including ancestors held in reverence).
      *   **Disruption of Social Order:** It challenges the established "way things are done," creating uncertainty. In a fragile, closed system, uncertainty feels dangerous.
      *   **Loss of Shared Identity:** "This is how *we* queue!" becomes part of the collective "we." Changing it can feel like losing a piece of that shared identity, even a small one.
  3.  **Loss Aversion & Sunk Cost Fallacy:** People feel the pain of loss more acutely than the pleasure of an equivalent gain. *Losing* the familiar convention feels like a loss, even if the new one is objectively equivalent. They've also invested years (generations!) learning and internalizing the current rule – that feels like a sunk cost.
  4.  **Coordination Costs & Focal Points:** Lewis's whole point is that conventions solve coordination problems by providing a *focal point*. Shifting requires establishing a *new* focal point. This isn't trivial:
      *   **Simultaneous Shift:** How does everyone know *when* to switch? How do you ensure near-universal adoption quickly enough for it to "stick"?
      *   **The "Who Decides?" Problem:** Even if the rule is arbitrary, the *authority to change it* is not. Your reformer pointing it out challenges the implicit authority of tradition and precedent. Who anointed *her* to change *our* customs? This instantly becomes political.
      *   **Risk of Fragmentation:** What if some people adopt the new rule and others stick to the old? This creates confusion and *worse* coordination than before. The fear of this chaos makes people cling to the existing convention, even if flawed, as the "devil they know."
  5.  **Symbolic Battles & Power Dynamics:** The *specific* convention might be arbitrary, but the *act of changing it* is not. A young reformer challenging an established custom becomes a symbol:
      *   **Youth vs. Age/Experience:** Her challenge can be framed as disrespectful arrogance.
      *   **Innovation vs. Stability:** In a fragile ship environment, stability is paramount. Change is inherently risky.
      *   **Testing Authority:** If she succeeds in changing *this* arbitrary rule, what else might she (or others like her) challenge? Established power structures (formal or informal) will resist this precedent, even if they privately agree *this specific rule* is arbitrary.
      *   **The Reform Itself as the Stake:** The battle isn't *just* about left vs. right walking; it becomes about *the right to change things*. Winning this battle sets a precedent for future changes. Losing reinforces the immutability of tradition.
  6.  **The "Just as Good" Fallacy:** While logically true, humans rarely perceive alternatives as *exactly* equivalent. Someone will argue:
      *   "But the left side has better lighting for reading signs!" (even if trivial)
      *   "Walking on the right feels unnatural now!"
      *   "Our ancestors chose left for a *reason*!" (even if that reason is lost or never existed).
      *   The new rule might *slightly* inconvenience a specific group (e.g., people coming from a specific module), giving them a vested interest in the status quo.

  **How This Plays Out on Your Ship:**

  *   **The Reformers:** They see the logic, the arbitrariness. They might propose efficiency gains or fairness improvements ("This way reduces congestion near Module B!").
  *   **The Traditionalists:** They appeal to stability, respect for ancestors ("This worked for 200 years!"), group identity ("This is the *Nostromo* way!"), fear of chaos ("What if people get confused near the airlocks?"), and often, implicitly, the threat to established hierarchies ("Who does this upstart think she is?").
  *   **The Apathetic Majority:** They might privately agree it's arbitrary and don't care, but:
      *   Habit makes switching annoying.
      *   They fear social disapproval for adopting the new way too early.
      *   They don't want to get caught in the crossfire of the political battle.
      *   They'll only switch when it's clear *everyone else* is switching (the coordination problem again).

  **What to Do With Your Subplot:**

  *   **Keep the Battle!** It's realistic and rich with dramatic and thematic potential.
  *   **Use Lewis to Inform the Conflict:**
      *   Have your reformer *use* Lewis-like arguments: "Look, it's arbitrary! Right works just as well! Here's how it improves flow..." This is her rational weapon.
      *   Show the opposition deploying the *psychological/social* counter-arguments listed above. Their resistance isn't *logical* about the rule itself, but deeply human and social.
      *   Explore the *coordination challenge*. How *does* she get enough people to switch simultaneously? Does she need a pilot program in one corridor? A decree from a sympathetic council member? A viral social movement?
  *   **Explore the Nuance:** Maybe the convention *isn't* perfectly arbitrary anymore. Perhaps walking on the left *does* align slightly better with the ship's asymmetric layout due to centuries-old modifications, making the switch have minor, real (if exaggerated) costs for some.
  *   **The Stakes are Bigger Than the Rule:** Make the battle about what it represents: the right to challenge tradition, the tension between stability and progress, the power of unspoken rules to define a society.

  **Examples from Reality:**

  *   **Driving Side:** Sweden switched from left to right driving in 1967 ("Dagen H"). It was logically better for neighboring countries, but required massive government effort, public education, and temporary disruption. It wasn't just a casual announcement. People *did* resist.
  *   **Qwerty vs. Dvorak Keyboards:** Dvorak is arguably more efficient, but Qwerty persists due to massive sunk costs, network effects, and sheer habit. Switching isn't "painless."
  *   **Metric vs. Imperial:** The US clings to Imperial units despite the global standard being metric, due to cost, habit, and national identity.

  **Conclusion:** Lewis brilliantly explains *how* conventions form and *why* they are logically arbitrary. But he doesn't claim changing them is easy. The friction comes from human psychology, social cohesion, coordination costs, and power dynamics. Your political battle subplot is **more realistic and dramatically compelling** than a simple, painless switch. It reveals the deep social fabric of your generation ship society. Don't cut it – lean into the conflict! The struggle *is* the story of how deeply ingrained these unwritten rules become.
