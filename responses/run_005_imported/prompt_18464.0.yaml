answer: |-
  Here are eight interview questions probing the philosophical foundations and practical implications of Functional Decision Theory (FDT), designed to move beyond standard expositions of Parfit's Hitchhiker, including specified follow-ups anticipating common deflections:

  1.  **Distinctness Challenge (vs. Precommitment):** "You argue FDT is a fundamentally distinct theory of instrumental rationality, not merely causal decision theory (CDT) augmented with dynamic strategies like Gauthier's constrained maximization or McClennen's resolute choice. Could you elaborate on *why* FDT's 'act as the decision you would ideally want to make, given your beliefs about the overall decision problem' constitutes a *different kind of rationality* rather than just a sophisticated *precommitment strategy* implemented by a CDT agent? Specifically, what is the core *normative principle* in FDT that CDT fundamentally lacks or misapplies?"
      *   *Likely Deflection Follow-Up:* If you argue FDT identifies the *true* causal source of outcomes (the abstract decision rule) while CDT fixates on physical causation, doesn't this just push the question back to *why* we should normatively care about this abstract causation? Isn't CDT's focus on physical levers a coherent, if situationally suboptimal, definition of instrumental control? How is FDT's 'abstract control' fundamentally *rational* rather than just *strategically wise*?

  2.  **Subjunctive Dependence - Explanatory or Descriptive?:** "FDT relies heavily on the concept of 'subjunctive dependence' – the idea that the outcome counterfactually depends on the decision of the abstract agent. Critics argue this isn't an independently grounded metaphysical or causal relation, but rather a *label* applied post-hoc to whatever correlation FDT needs to justify its recommended action in a given problem. Can you articulate what *independent criteria* determine whether outcome Y subjunctively depends on decision X? How do we know this dependence exists *before* applying FDT's calculation, rather than FDT *defining* the dependence by the calculation's result?"
      *   *Likely Deflection Follow-Up:* If you point to the logical structure of the problem (e.g., the predictor's model) as defining subjunctive dependence, doesn't this make FDT highly sensitive to the *description* of the problem? Isn't this vulnerable to the charge that FDT is rationalizing predetermined outputs based on problem framing, rather than discovering a robust relation?

  3.  **Degrading Predictor Reliability:** "Parfit's Hitchhiker requires only that the driver is a *reasonably good* (but fallible) judge of character, not an infallible Omega. How does FDT's recommendation ('Pay') degrade as the driver's reliability decreases? At what point of uncertainty (e.g., 60% reliable? 51%?) does FDT cease to recommend paying *in the specific instance* where the driver picked you up? Does FDT still recommend *cultivating the disposition* to pay even if the predictor is only slightly better than chance? How does this interact with the cost/benefit ratio?"
      *   *Likely Deflection Follow-Up:* If you argue FDT focuses on the *ideal* decision rule regardless of specific predictor reliability in one instance, but then acknowledge that in a low-reliability world *cultivating* the disposition might be net harmful, doesn't this create a tension? How does FDT adjudicate between following the ideal rule *now* versus cultivating a disposition optimized for the *actual* reliability level of predictors in the world?

  4.  **Exploitability & Known Dispositions:** "FDT agents are often characterized as wanting to be 'predictably rational.' In Parfit's Hitchhiker, being known to be the 'type who pays' gets you picked up. But couldn't this very predictability make an FDT agent uniquely exploitable by other strategic agents? Imagine a 'Shakedown' variant: After being picked up, a *second* agent threatens, 'If you don't give me $50 too, I'll signal the driver (falsely) that you won't pay him, causing him to abandon you.' Doesn't FDT's commitment to 'acting as the decision rule that gets the best outcome' compel paying the blackmailer, starting an infinite regress of shakedowns? How does FDT avoid this vulnerability inherent in having a knowably fixed disposition?"
      *   *Likely Deflection Follow-Up:* If you respond that FDT would ideally adopt a decision rule conditional on the *entire* game structure, including potential blackmailers, and thus find a rule that doesn't pay blackmail, how is this different from CDT plus a complex contingent strategy? Doesn't this require FDT agents to have impossibly perfect foresight about all possible strategic interactions, making it impractical?

  5.  **Ontological Commitment & "The Agent":** "FDT requires identifying with an abstract, timeless 'agent' whose decision rule is the object of optimization. What is the *ontological status* of this agent? Is it a useful fiction, a normative ideal, or a description of a real cognitive module? How does this square with the physical reality of a biological decision-maker embedded in time, with limited cognitive resources, who cannot perfectly simulate or access this 'ideal' perspective?"
      *   *Likely Deflection Follow-Up:* If it's a normative ideal, how does this avoid the charge of being question-begging – defining rationality as 'doing what FDT says'? If it's a real cognitive module, what empirical evidence supports its existence distinct from mechanisms implementing CDT or other heuristics?

  6.  **Bootstrapping & Self-Fulfilling Prophecies:** "In cases like Parfit's Hitchhiker, FDT's recommendation seems to 'bootstrap' rationality: Paying is rational *because* it causes the condition (being picked up) that makes paying necessary and beneficial. Isn't there a risk of justifying *any* self-fulfilling prophecy as rational? For example, if a cult leader predicts I'll donate my life savings if I'm the 'true believer,' and only lets in 'true believers,' does FDT deem donating rational? If not, how does it distinguish valid bootstrapping (Hitchhiker) from exploitative bootstrapping (Cult) without appealing to consequences beyond the decision rule itself?"
      *   *Likely Deflection Follow-Up:* If you distinguish based on the predictor's accuracy *or* the structure of the dependency, doesn't this risk collapsing back into evaluating consequences (e.g., the cult predictor might be unreliable) or specific causal structures, potentially undermining FDT's claim to fundamentality?

  7.  **Regret & Lost Opportunities:** "Consider a variant of Newcomb's Problem where Omega is only 90% accurate. An FDT agent two-boxes and gets $1,000, while a CDT agent one-boxes and, by luck, gets $1,000,000. The FDT agent followed their 'ideal decision rule,' yet missed out on a massive gain due to Omega's error. How does FDT reconcile the claim of optimality with the possibility of significant regret in such scenarios? Does this expose a sense in which FDT optimizes for 'decision rule correctness' over actual world outcomes in imperfectly predictable worlds?"
      *   *Likely Deflection Follow-Up:* If you argue that over many such interactions, FDT does better, does this concede that FDT's justification is fundamentally frequentist and long-run, potentially making it irrational for high-stakes, one-shot decisions where predictor fallibility is known?

  8.  **FDT as a Tool vs. a Theory:** "Given the complexity of identifying the 'correct' abstract decision rule, the potential for framing dependence, and the challenges of practical implementation, could FDT be more productively viewed not as the *true* theory of instrumental rationality, but as an exceptionally powerful *engineering tool* for designing robust agents (like AIs) in environments containing predictors or logical correlations, while acknowledging that human rationality might be a messy hybrid? What would be lost in this pragmatic view?"
      *   *Likely Deflection Follow-Up:* If you resist this, arguing FDT captures a genuine normative truth, how do you address the concern that its prescriptions can seem deeply counterintuitive or even self-destructive in novel, complex, or poorly modeled real-world situations, compared to more local, causal reasoning?
