prompt: |-
  I was called up for jury duty for the first time this spring. During deliberations, our panel of twelve moved from an initial straw poll of seven-to-five to a unanimous verdict after nearly two days of discussion, which left me wondering how much weight to put on group verdicts generally. Looking into the matter afterward, I came across Condorcet's Jury Theorem, which, as I understand it, proves that if each juror is even just slightly more likely than not to reach the correct verdict, a majority vote among a sufficiently large panel becomes virtually certain to be correct. This struck me as a fairly powerful argument for reforming jury size: if a panel of a few hundred people would make correct verdicts almost certain, why do courts still rely on the traditional twelve, particularly in cases where the stakes are highest? I would like to understand why this argument for expanding juries is not taken more seriously by legal scholars.
reasoning: |-
  Okay, the user is asking about why Condorcet's Jury Theorem isn't used to argue for larger juries, especially since their experience showed how deliberation shifted a divided group to unanimity. Let me start by recalling what the theorem states. It says that if each juror has even a slightly better than 50% chance of being correct, then as the jury size increases, the majority vote's accuracy approaches certainty. The user wonders why we don't use hundreds of jurors for high-stakes cases instead of the traditional twelve.

  First, I need to address the assumptions of the theorem. Real jurors aren't independent; they influence each other through deliberation. The theorem assumes independence, but in reality, group dynamics like conformity or dominant personalities can skew decisions. Also, the "competence" assumption is tricky. In complex cases, jurors might not have better than random accuracy. Things like cognitive biases, evidence complexity, or lawyer effectiveness can lower individual competence below 50%. 

  Then there's the practical side. Larger juries mean more people to select, which is costly and time-consuming. Finding hundreds of impartial jurors isn't feasible. Deliberations with hundreds would be chaotic. The legal system values deliberation, not just voting. Larger groups might fragment into subgroups, reducing effective discussion. The user mentioned their jury moved to unanimity through discussion, which highlights deliberation's role beyond mere aggregation.

  Legal traditions also matter. Twelve jurors is a long-standing practice, and changing it faces resistance. There might be concerns about representativeness—larger juries might still not capture diversity if the pool is biased. Also, the theorem assumes a binary choice, but real cases have nuances. Even if the majority is correct, forcing unanimity might prevent hasty decisions, as in the user's case where deliberation led to consensus.

  The user might be concerned about the reliability of verdicts, especially in high-stakes cases. They might want the legal system to adopt more mathematically sound methods. But the gap between theory and practice is wide. Legal scholars likely recognize these practical and theoretical limitations. It's important to explain why an elegant mathematical model doesn't translate directly to legal reforms. Highlighting the balance between theoretical ideals and practical constraints would address their deeper concern about the justice system's efficacy.
answer: |-
  That's a fascinating and insightful question arising directly from your real-world experience. You've perfectly grasped the core intuition of Condorcet's Jury Theorem (CJT) and its apparent implication for jury size. However, legal scholars and the justice system haven't embraced massive juries for several compelling reasons, largely revolving around the theorem's restrictive assumptions and practical realities:

  1.  **Violation of the Independence Assumption:** CJT crucially assumes jurors make their decisions *independently*. Real jury deliberation is fundamentally about *interdependence*. Jurors:
      *   Share information and perspectives.
      *   Persuade and are persuaded.
      *   Challenge each other's reasoning and biases.
      *   Develop a shared narrative.
      *   Are susceptible to group dynamics (conformity pressure, dominance by vocal members, groupthink). Your own experience moving from 7-5 to unanimous shows this process in action. CJT models aggregating *pre-existing* independent judgments, not the dynamic *formation* of judgment through interaction.

  2.  **The Problem of Competence (p > 0.5):** CJT requires that *each* juror, *individually*, has a better-than-random chance (p > 0.5) of reaching the correct verdict *before deliberation*. This is highly questionable:
      *   **Complexity & Bias:** Cases often involve complex evidence, nuanced law, expert testimony, and emotional elements. Many jurors may start with p significantly *below* 0.5 due to confusion, pre-existing biases, susceptibility to lawyer rhetoric, or the inherent difficulty of the question.
      *   **Epistemic Uncertainty:** How do we *know* p > 0.5? In many cases, it's impossible to verify individual juror competence beforehand. If the average p is less than 0.5, increasing jury size *decreases* the probability of a correct majority verdict (the "incompetence catastrophe").
      *   **Deliberation as the Competence Builder:** The *point* of deliberation is often to *raise* individual competence *towards* or *above* 0.5 by correcting misunderstandings, filling knowledge gaps, and challenging biases. CJT treats competence as fixed and pre-deliberative.

  3.  **Practical Impossibility & Cost:**
      *   **Logistical Nightmare:** Summoning, selecting (voir dire), housing, managing, and deliberating with hundreds of jurors for every trial (especially serious ones) would be prohibitively expensive, slow, and logistically overwhelming for the court system.
      *   **Jury Pool Exhaustion:** Finding large numbers of impartial jurors willing and able to serve for potentially long trials is already challenging. Scaling up to hundreds would be impossible in many jurisdictions.
      *   **Ineffective Deliberation:** Deliberation with hundreds of people is impractical. It would devolve into chaos or factionalism, negating the very benefits CJT assumes from aggregation. Smaller groups (like 12) are far more conducive to meaningful discussion. Your panel's shift to unanimity likely *required* the manageable size for effective dialogue.

  4.  **Diminishing Returns & the Value of Twelve:**
      *   Research suggests that while moving from 6 to 12 jurors offers significant gains in reliability, deliberation quality, and representativeness, the marginal benefits of increasing beyond 12 (e.g., to 20, 50, 100+) diminish rapidly relative to the exploding costs and logistical burdens.
      *   Twelve has proven historically and empirically to be a reasonable balance between the desire for diverse perspectives and the need for manageable deliberation. It provides a robust buffer against individual eccentricities or biases without becoming unwieldy.

  5.  **The Role of Unanimity (Your Experience is Key):** Your jury *didn't* just take a majority vote and stop. It deliberated until *unanimous*. This requirement:
      *   Forces the majority to engage seriously with minority viewpoints (as happened in your case).
      *   Acts as a powerful check against premature or ill-considered verdicts.
      *   Increases the perceived legitimacy and acceptability of the verdict.
      *   CJT focuses on majority rule, but the unanimity requirement leverages deliberation to potentially achieve a higher standard of consensus, even if starting from division. A massive jury relying solely on majority vote would lose this crucial safeguard.

  6.  **Legal Tradition and Institutional Inertia:** The jury of twelve is deeply embedded in common law tradition. Changing such a fundamental institution requires overwhelming evidence of benefit and minimal disruption, which the theoretical argument from CJT, given its practical limitations, doesn't provide.

  **Why the Argument Isn't a Major Reform Driver:**

  *   **It Addresses a Simplified Model:** CJT is an elegant mathematical model, but its assumptions (independent, fixed p>0.5) are too far removed from the messy reality of jury trials. Legal scholars recognize that deliberation dynamics, competence building, group psychology, and practical constraints are more dominant factors than pure aggregation of independent votes.
  *   **It Doesn't Solve the Core Challenges:** Even large juries wouldn't automatically overcome juror bias, misunderstanding, complex evidence, or the need for skilled deliberation. Resources might be better spent on improving juror instructions, selection processes, or trial presentation than on inflating jury size.
  *   **The Costs Outweigh Theoretical Gains:** The logistical and financial burden of massive juries vastly outweighs the *theoretical* (and unproven in practice) marginal increase in accuracy predicted by CJT, especially when weighed against the proven effectiveness of smaller juries *with* deliberation and unanimity requirements.

  **In essence:** While Condorcet's Jury Theorem offers a compelling mathematical insight, it functions in a theoretical vacuum that doesn't account for the core mechanisms of *deliberation*, the difficulty in ensuring *individual juror competence*, the practical *costs and logistics*, the *psychological dynamics* of large groups, and the crucial role of the *unanimity requirement*. Your own experience highlights what CJT misses – the transformative power of discussion among a manageable group. The legal system prioritizes this deliberative process, manageable size, and unanimity over the theoretical aggregation benefits of vast, independent juries that CJT describes. The focus remains on making the *process* of deliberation within a traditionally sized jury as effective as possible.
