  What the user might not fully appreciate is how radical Sidgwick's position was. Unlike James who embraced "will to believe," Sidgwick refused to lower evidential bars even for existential relief. That's heroic, tragic integrity. I should emphasize how this makes him a proto-falsificationist before Popper.

  Also worth noting: the user mentions "dropping the benevolence axiom" as an alternative solution Sidgwick rejected. Smart catch - shows they grasp how foundational that axiom was for him. His ethical system would implode without it, hence the desperate search for cosmic backup.

