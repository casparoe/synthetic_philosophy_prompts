  Now the psychical research angle... ah, here's the key insight: for Sidgwick, theism alone couldn't resolve this. Why? Because his Methods already demolished all existing theological/ethical arguments. He needed empirical proof - observable evidence of a moral universe. Not faith, but data. That's why chasing mediums wasn't eccentric; it was the only escape hatch from his own logic.

