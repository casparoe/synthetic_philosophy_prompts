answer: |-
  That's a brilliantly sharp question cutting to the heart of Sidgwick's philosophical anguish and intellectual integrity. You're right – the connection between the "Dualism of the Practical Reason" and his psychical research is profound and deeply logical within his system. Here's the breakdown:

  **1. The Dualism of Practical Reason: The Core Problem**

  *   **The Utilitarian Commitment:** Sidgwick, in *Methods*, rigorously argued that **Rational Benevolence** is an undeniable axiom of practical reason. It's self-evidently rational to promote universal happiness. Morality (duty) fundamentally requires pursuing the greatest good for the greatest number.
  *   **The Prudential Commitment:** Equally rigorously, Sidgwick argued that **Rational Egoism** is an undeniable axiom. It's self-evidently rational for an individual to pursue their own greatest happiness over the long term. Self-interest is fundamental.
  *   **The Irreconcilable Conflict:** The problem arises when these two axioms conflict. Often, what maximizes *my* happiness (e.g., keeping a fortune) does *not* maximize *universal* happiness (e.g., giving it to charity). Sidgwick saw no inherent rational principle within human experience or reason itself to definitively resolve this conflict in favor of benevolence when they clash.
  *   **The "Profoundly Depressing" Conclusion:** Without a resolution, practical reason is fundamentally divided or "dualistic." Morality might demand self-sacrifice, but pure reason cannot show why an individual *ought* to choose sacrifice over self-interest when they conflict. This undermines the rationality of the entire moral enterprise. As he famously wrote, "the prolonged effort of the human intellect to frame a perfect ideal of rational conduct is seen to have been foredoomed to inevitable failure."

  **2. Why "Further Fact" Was Necessary: Theism as the Logical (But Insufficient) Solution**

  *   Sidgwick saw only one potential solution that could *rationally* reconcile the dualism: **Theism combined with a doctrine of future rewards and punishments.**
  *   **The Mechanism:** If a perfectly just, omnipotent, and omniscient God exists who administers the universe, then:
      *   Actions promoting universal happiness (duty) would be rewarded in an afterlife.
      *   Actions promoting purely selfish happiness contrary to duty would be punished.
      *   Therefore, *in the long run and considering the totality of existence*, an individual's self-interest (maximizing their *eternal* happiness) would be perfectly aligned with performing their duty (promoting universal happiness).
  *   **The Problem of Proof:** Sidgwick, the relentless rationalist, could not accept this solution *on faith*. His entire *Methods* was an exercise in demanding rigorous proof for ethical propositions. He had demolished other arguments for God and immortality based on pure reason or intuition. To simply *assume* theism to resolve the dualism would be:
      1.  **Intellectually Dishonest:** It would violate his foundational commitment to rigorous, evidence-based reasoning. It would be picking the conclusion *because* he needed it, not because reason demanded it.
      2.  **A Non-Rational Leap:** It wouldn't actually *resolve* the rational conflict through reason; it would just bypass it with an unproven assumption. The dualism within *human reason* would remain unresolved; the solution would be imposed from *outside* reason via faith.

  **3. Why Psychical Research? The Demand for Empirical Evidence**

  *   This is where psychical research enters as the *only conceivable path* Sidgwick could see to resolve the dualism *rationally*:
      *   **Targeted Evidence:** It promised **empirical evidence** for the specific "further fact" needed: **personal survival after bodily death.** Proof of survival is the essential prerequisite for the doctrine of future rewards/punishments to function as the reconciling mechanism.
      *   **Beyond Mere Theism:** Survival evidence could potentially point towards the *kind* of universe required – one where consciousness persists beyond the physical, opening the door to the possibility of a moral administrator (even if not proving God directly). Telepathy or apparitions hinted at a reality transcending the purely material, mechanistic universe that seemed indifferent to moral concerns.
      *   **Fulfilling Reason's Demand:** If empirical evidence *proved* survival, then the theistic reconciliation *becomes rationally compelling*. It wouldn't require faith; it would be a logical inference from established facts. The dualism would be resolved *within* the framework of reason and evidence.
      *   **The Stakes:** For Sidgwick, resolving the dualism wasn't just an academic puzzle; it was about **saving the rationality of ethics itself.** Without this resolution, ethics risked being fundamentally irrational or unstable. Psychical research offered the *only hope* of providing the necessary evidence to ground ethics securely.

  **4. Why the Brutal Epistemic Standards Never Bent: The Nature of His Need**

  *   This is the crux of his tragic integrity. Sidgwick "needed" a positive result *desperately*, but his need was **philosophical and rational**, not psychological or emotional in a way that would cloud judgment.
  *   **The Need Was for *Truth*, Not Comfort:**
      *   He didn't *want* to believe in spooky nonsense; he *needed* to know if a specific, universe-altering fact was *true*. Belief without proof wouldn't resolve the *rational* dualism; only verified truth could.
      *   His desperation was for **intellectual salvation for ethics**, not personal consolation. Comforting frauds wouldn't save utilitarianism; only genuine proof would.
  *   **The Stakes Demanded Rigor:**
      *   If he were to base the resolution of the most profound problem in ethics – the foundation of morality itself – on shoddy evidence, it would be a catastrophic philosophical failure. The solution had to be as robust as the problem.
      *   Finding a *false* positive (believing fraud) would be worse than finding nothing. It would corrupt the very rationality he was trying to save.
  *   **The Method *Was* the Solution:**
      *   His commitment to rigorous, scientific (for the time) investigation *was itself* the manifestation of his rationalism. Lowering standards wouldn't yield the *kind* of proof required to rationally resolve the dualism. Only evidence that could withstand his "brutal" scrutiny could possibly do the job.
      *   As SPR President, he championed meticulous investigation, statistical analysis (e.g., the Census of Hallucinations), exposure of fraud, and skepticism precisely *because* he understood the magnitude of what was at stake. A single proven case of telepathy or survival would be world-shaking, but it *had* to be proven beyond his own capacity for doubt.
  *   **The Agony of the Null Result:** His famous lament, "I confess that... the deep division I feel between my own intelligence and my closest sympathies is a very painful thing," captures this. His *heart* (sympathies, desire for ethical coherence) yearned for a solution, but his *intelligence* (epistemic rigor) refused to find it where the evidence wasn't sufficient. He couldn't force his intellect to accept what it couldn't validate, even though the lack of validation meant the philosophical problem remained agonizingly unresolved.

  **In Summary:**

  Sidgwick's psychical research was a direct, desperate, yet rigorously rational attempt to find *empirical evidence* for the *specific further fact* (personal survival) required to resolve the "Dualism of the Practical Reason" that threatened to undermine the rationality of ethics itself. He couldn't accept theism on faith because that would violate his core commitment to reason and evidence. He couldn't drop the benevolence axiom because he saw it as an undeniable rational truth. His brutal epistemic standards never bent because only evidence that met those standards could *truly* resolve the rational conflict; anything less would be philosophically worthless and a betrayal of the very rationality he sought to vindicate. His pursuit was a testament to both the depth of his philosophical despair and the extraordinary, almost tragic, integrity of his intellectual character. He needed proof *so badly* precisely *because* only proof would suffice, and his standards were the guarantee that only proof *could* suffice.
