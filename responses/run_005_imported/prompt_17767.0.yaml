  First, I need to understand Strawson's argument properly. He distinguishes between excuses (which address specific actions without undermining general responsibility) and considerations that trigger the objective attitude (which exempt individuals entirely from reactive attitudes like resentment or gratitude). His key point about determinism is that it couldn't practically justify adopting the objective attitude universally because humans are psychologically incapable of sustaining that stance.

