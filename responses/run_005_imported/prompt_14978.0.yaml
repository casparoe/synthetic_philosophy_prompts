  Hmm, I need to recall the core challenges in revealed preference theory. Samuelson's approach assumes choices reveal preferences under constraints, but Sen argued this conflates preference with choice, ignoring context like norms or self-control issues. The axioms (WARP, etc.) are necessary but often don't hold in real data, leading to circularity.

  For IRL, the key additions are modeling sub-optimality, priors over rewards, and sequential decision-making. Probabilistic models allow noisy behavior, which helps avoid the deterministic pitfalls of revealed preference. Priors over reward functions add a way to break symmetries, like distinguishing R from -R. Sequential settings leverage state transitions and time, providing more data points.

