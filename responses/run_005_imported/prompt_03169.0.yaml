  Here's the strongest case for Radford's position, engaging directly with Walton's core argument and avoiding strawmanning:

  **Radford's Core Insight: The Inescapable Contradiction**
  Radford’s argument rests on three seemingly undeniable premises:
  1.  **We feel genuine emotions** (pity, fear, grief) for fictional characters/situations.
  2.  **We know** these characters/situations do not exist and never existed.
  3.  **Genuine emotion requires belief in the existence** (past, present, or future) of its object. You can't be truly afraid of something you *know* doesn't exist and poses no real threat.

  The paradox arises because (1) and (2) directly contradict (3). Radford’s conclusion is stark: Since we *know* Anna Karenina isn't real, feeling genuine pity for her suffering *is* irrational and inconsistent. The emotion occurs, but it rests on a momentary, contradictory cognitive state – a "suspension of disbelief" that isn't a true *belief* but feels emotionally potent enough to trigger the response. This inconsistency *is* the irrationality.

  **Why Walton's "Quasi-Emotion" Doesn't Solve the Paradox (Even Acknowledging His Nuance)**

  Walton correctly identifies the problem: How can Charles feel genuine fear towards the green slime when he *knows* it's just images on a screen? His solution is to redefine the emotion: Charles isn't *afraid*, he's experiencing "quasi-fear" – a state *analogous* to fear, generated within the framework of a "game of make-believe" (like children pretending).

  1.  **The "Quasi" Label Dodges the Phenomenology:** Radford would argue that Walton's move simply *relabels* the problem rather than solving it. The core question isn't *whether* Charles's physiological reactions (racing heart, tension, jump scares) or feelings of dread/apprehension are real – Walton concedes they are. The question is: **What are these *real* physiological and phenomenological states *in response to*?**
      *   If they are *in response to* the *fictionally presented* threat (the green slime *in the story*), then Radford's paradox re-emerges: How can real physiology/feeling be triggered by an object Charles *knows* is non-existent? The "quasi" label doesn't explain the mechanism; it just asserts that it's "make-believe." But the *feeling* isn't make-believe – Charles's adrenaline is real.
      *   If they are *in response to* the *sensory stimuli* (loud noises, jarring images, tense music) and *not* the fictional object, then Walton has abandoned the core issue of emotional engagement *with the fiction*. Radford is specifically concerned with our sadness *for Anna Karenina*, our fear *of the green slime*. Reducing emotion to a response to non-representational stimuli misses the intentional object entirely.

  2.  **The "Lack of Action" Criterion is Flawed:** Walton uses Charles's lack of running/calling as evidence it's not real fear. Radford (and common sense) can counter this:
      *   **Contextual Inhibition:** Charles *knows* he's safe in the cinema. This *knowledge* rationally inhibits action *despite* the genuine fear response. We don't run from roller coasters either, even when genuinely terrified, because we *know* the safety restraints work. The inhibition of action doesn't negate the underlying fear state; it demonstrates the power of higher cognition to *override* action tendencies *stemming* from genuine emotion.
      *   **Emotion ≠ Action Tendency:** While fear often involves a flight impulse, genuine fear can manifest *without* it (e.g., freezing in terror, paralysis). Charles's white-knuckled grip on the armrest *is* a behavioral manifestation of fear, even if he doesn't flee. Walton's criterion sets an unrealistically high bar for "genuine" emotion.

  3.  **"Quasi-Emotion" Fails the "What-If" Test:** Imagine Charles suddenly receives a credible text: "Escaped experimental green slime reported heading towards this cinema." If Walton is right, Charles's state should simply shift from "quasi-fear" to genuine fear. But Radford argues the *initial* state already *was* genuine fear. The arrival of belief about a *real* threat would merely *intensify* and *focus* the existing fear, adding concrete action plans ("We need to leave NOW!"). The core physiological and affective state – the racing heart, the dread – was already present and directed (however inconsistently) at the *represented* threat. The "quasi" state doesn't transform; the *cognitive context* around the existing emotion changes.

  4.  **Irrationality Persists Under Walton's Model:** Even if we accept "quasi-emotions," Radford's core point about irrationality isn't resolved. Why do we voluntarily subject ourselves to experiences that reliably induce *real* physiological stress (increased heart rate, cortisol release), *real* feelings of sadness and dread, and *real* tears – all in response to stimuli we *know* represent non-existent things? Walton explains *how* we engage (through make-believe), but doesn't address *why* this engagement triggers such potent *real* effects if the underlying state is fundamentally different from genuine emotion. Calling it "quasi" doesn't make the expenditure of real psychological and physiological resources in response to known non-threats any *less* irrational from a purely instrumental standpoint. Radford forces us to confront this strangeness.

  **Conclusion: Radford's Enduring Challenge**

  Walton provides a sophisticated *description* of how we engage with fiction emotionally, framing it as participation in a game of make-believe. However, he doesn't *resolve* Radford's paradox; he **sidesteps** it by redefining "genuine emotion" in a way that excludes responses to fiction by fiat. By labeling the emotion "quasi," he avoids confronting the central contradiction Radford identified: the undeniable occurrence of *real* affective and physiological states, phenomenologically indistinguishable from their "genuine" counterparts, triggered by cognitive objects *known* to be non-existent.

  Radford's argument remains powerful because it highlights a fundamental tension in our psychology. Our emotional systems are not perfectly aligned with our rational beliefs. We *do* cry for Anna Karenina. We *do* feel dread from the green slime. And we *know*, incontrovertibly, that neither is real. Radford forces us to accept that this *is* inconsistent and, in a strict logical sense, irrational. Walton's "quasi-emotion" is a useful tool for *describing* the fictional context, but it doesn't dissolve the underlying paradox of why our real feelings are so powerfully engaged by unreal things. Radford compels us to acknowledge the fascinating, messy irrationality at the heart of our engagement with art. The "quasi" label feels less like a solution and more like a philosophical fig leaf for an enduring psychological puzzle.
