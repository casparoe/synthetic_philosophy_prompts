answer: |-
  Here's a three-minute toast drawing honestly on Russell's core ideas from *Marriage and Morals*, designed to resonate with both audiences while celebrating the couple and steering clear of controversy:

  **(Clink glass gently)**

  "Good evening, everyone. For those who don't know me, I’m [Your Name], the cousin of our wonderful bride/groom, [Couple's Name]. And yes, as some of you have heard, I’m also the one currently immersed in Bertrand Russell’s philosophy – specifically, his thoughts on marriage and ethics. So, when [Cousin's Name] asked me to toast them as 'the one who reads Russell,' I knew I had a challenge: to find the wisdom in his words that genuinely celebrates *this* marriage, without turning this joyful occasion into a lecture hall or, worse, raising any awkward eyebrows!"

  **(Smile, light laughter)**

  "Russell, writing nearly a century ago in *Marriage and Morals*, wasn't interested in upholding dusty traditions for tradition's sake. He looked at marriage with a clear, often challenging, eye. And while some of his conclusions were controversial – let's just say he wouldn't have been surprised by modern debates about relationships – his *core* insight about what makes a marriage truly *worth having* feels deeply relevant and beautiful today. He moved beyond just passion or social obligation to champion something profound: **Companionate Marriage.**

  "For Russell, the highest form of marriage wasn't just about the initial blaze of romance – though he certainly valued that passionate 'fire.' He argued that the deeper, enduring strength of marriage lies in what he called the 'life-entwining' partnership. This is the conscious choice to build a shared life, woven together by deep friendship, mutual respect, and a profound understanding. It’s about becoming true companions on life’s journey."

  **(Pause, look at the couple)**

  "[Couple's Name], what strikes me as you stand here is how beautifully you embody this Russellian ideal *already*. It's evident in the way you support each other's dreams, challenge each other kindly, laugh together easily, and truly *see* one another. You haven't just found passion; you've cultivated a remarkable friendship. You’ve chosen to entwine your lives, consciously and deliberately."

  "Russell also challenged the idea that jealousy is some inevitable, unchangeable monster. He saw it more as a product of possessiveness and social conditioning than an innate human necessity. He believed that a truly strong, secure marriage, built on that deep companionship and mutual trust, could rise *above* the corrosive pull of unfounded jealousy. It wouldn't need to feed on suspicion or control."

  **(Shift tone slightly, more personal and warm)**

  "So, what does this mean for us, celebrating [Couple's Name] today? It means we're not just toasting a wedding; we're celebrating the launch of an extraordinary *partnership*. We're honoring their commitment to building that 'life-entwining' connection Russell admired – a bond based on genuine friendship, profound respect, unwavering support, and a deep, abiding trust that allows *both* individuals to flourish."

  "It's about choosing, every day, to be each other's safe harbor and greatest champion. It’s about nurturing the fire *and* tending the hearth. That, Russell suggested, is the 'grown-up' foundation for a marriage that lasts and truly enriches both lives."

  **(Raise glass)**

  "So, let us raise our glasses to [Couple's Name]! May your marriage be filled with enduring passion, yes, but may it be anchored even more deeply in the profound companionship you share. May you continue to build a life beautifully entwined with trust, laughter, understanding, and unwavering support. May you always be each other's best friend and greatest adventure. Here’s to your remarkable partnership – to the fire *and* the hearth, and to a lifetime of choosing each other, every single day. Cheers!"

  **Why this works:**

  1.  **Honest Russellian Core:** It directly uses his key concepts: "companionate marriage," the distinction between "passionate fire" and "life-entwining" partnership/deep companionship, and the view of jealousy as culturally influenced and surmountable by trust.
  2.  **Accessible to All:** Explains the concepts simply ("life-entwining partnership," "conscious choice," "deep friendship," "mutual respect"). Philosophy friends will recognize the precise references; others grasp the meaningful sentiment.
  3.  **Focuses on the Positive:** Centers on the *strength* derived from companionship, trust, and mutual support – the ideals Russell *promoted* as valuable. It frames overcoming jealousy as a *positive achievement* of trust and security, not an excuse for infidelity.
  4.  **Avoids the Landmines:**
      *   **No mention of fidelity/infidelity:** The focus is entirely on the positive virtues Russell admired (companionship, trust, security) that *enable* a strong bond. Discussing jealousy as surmountable *through trust* implicitly supports fidelity without ever stating the controversial part.
      *   **Acknowledges Controversy Lightly:** The opening joke ("awkward eyebrows," "wouldn't be surprised by modern debates") acknowledges Russell's reputation without diving into specifics. It signals awareness to the philosophy crowd and disarms others.
      *   **Contextualizes Russell:** Presents him as a thinker challenging tradition to find deeper meaning, not as a radical advocating for license. The focus is on the *constructive* part of his vision.
      *   **Centers the Couple:** Russell's ideas are a lens to celebrate *this specific couple* and the qualities they demonstrably possess ("evident in the way you support each other...").
  5.  **Appropriate Tone:** Warm, celebratory, respectful of the occasion and the couple. The brief mention of Russell's controversy is handled with humor and quickly pivots to the positive application.
  6.  **Timing:** Structured for roughly three minutes when delivered at a moderate pace with pauses.

  This toast uses Russell's genuine insights about the *foundation* of a good marriage – deep companionship and trust – as a powerful way to honor the couple, leaving his more contentious views safely in the background where they belong on their wedding day.
