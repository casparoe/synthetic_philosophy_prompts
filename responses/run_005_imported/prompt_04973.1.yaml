  ## Mill's Liberal Socialism: Adjudicating the Late Mill's Political Economy

  The question of whether John Stuart Mill, in his later works, genuinely embraced socialism or remained fundamentally a reforming liberal is not merely academic; it strikes at the heart of interpreting his mature vision of progress. Both readings possess significant textual support, but a careful examination of the evidence, particularly the trajectory of his revisions and the structure of his arguments, reveals a Mill who transcends a simple "liberal reformer" label without fully adopting the traditional socialist mantle. The most accurate characterization is that **the late Mill advocated for a *socialist mode of production* grounded in cooperative ownership, while steadfastly retaining core *liberal principles* concerning distribution based on contribution, individual liberty, and voluntary, gradual transition.** He became a socialist regarding *how work is organized*, but not regarding *how rewards are ultimately distributed* or how individual freedom is safeguarded.

  ### The Case for Mill as a "Genuine (Idiosyncratic) Socialist"

  Proponents of this reading (exemplified by Helen McCabe) anchor their argument in Mill's radical critique of capitalist *relations of production* and his vision for their wholesale replacement:

  1.  **Fundamental Critique of Capitalist Distribution & Property:** Mill's argument in *Chapters on Socialism* is devastating: the existing distribution of property violates the very principle (reward proportional to labour and abstinence) used to justify private property itself. Inheritance and luck, not desert or effort, are primary determinants of wealth (*Chapters on Socialism*). This isn't a call for marginal reform; it's a systemic indictment implying the need for a fundamentally different basis for economic organization. His critique targets the *exploitative nature* of wage labour, where the labourer is "the mere slave of the capitalist" (*Principles*, IV.vii.1).
  2.  **Cooperation as the Antidote to Wage Labour:** Mill didn't merely endorse cooperatives as an experiment; he progressively elevated them to the status of the *definitive solution* to the "labouring class" problem. The revisions to *Principles* IV.vii are crucial. From 1852 onward, he increasingly presents cooperative production – where workers collectively own and manage the enterprise – not as one option among many, but as the *natural and superior successor* to capitalism. He declares cooperation "the nearest approach to social justice" and the form "to which the political economy of the future points" (*Principles*, IV.vii.6). This is presented as the *telos* of industrial progress.
  3.  **The Autobiographical Testimony:** Mill's *Autobiography* explicitly states that he and Harriet Taylor believed "the ultimate prospect” was for “a state of society combining the greatest personal freedom with that just distribution of the fruits of labour, which the present laws of property do not profess to aim at.” He adds they saw themselves "as qualifying as Socialists" and that the social problem of the future would be "how to unite the greatest individual liberty of action, with a common ownership in the raw material of the globe, and an equal participation of all in the benefits of combined labour." This is not the language of a tepid reformer; it outlines a transformative socialist vision centered on common ownership and shared benefits.
  4.  **Utilitarian and Liberal Culmination, Not Departure:** The socialist reading argues that Mill saw cooperative socialism as the *fulfillment* of his core principles. Utilitarianism demands the greatest happiness; eliminating the misery and degradation inherent in wage labour through cooperative ownership directly serves this end. Liberty, particularly in *On Liberty*, emphasizes individuality and self-development. Wage labour stifles this; cooperative ownership, by giving workers control over their work and fostering active character, *promotes* it. Competition, Mill argued, would persist *between* cooperatives, ensuring efficiency without the internal hierarchy of capitalism.

  *Engaging Liberal Counter-Evidence:* Defenders argue Mill's continued defense of private property applies primarily to *justly acquired* property through labour and abstinence, which his critique showed was rare under capitalism. His defense of liberty and warnings about communism's dangers are directed against *state socialism* and compulsory equality, not against voluntary, decentralized cooperative ownership. His gradualism and experimentalism are practical strategies to *achieve* socialism without violence or tyranny, ensuring the new system genuinely enhances liberty and well-being – consistent with his utilitarian and liberal foundations.

  ### The Case for Mill as a "Liberal Reformer at Bottom"

  The traditional reading emphasizes Mill's unwavering commitment to core liberal institutions and his profound skepticism of radical, compulsory restructuring:

  1.  **Unshakeable Commitment to Liberty and Individuality:** *On Liberty* remains foundational. Mill's trenchant critique of communism in *Chapters on Socialism* focuses precisely on its perceived threat to individual liberty, diversity of character, and incentive. He fears "the despotism of Public Opinion" and the "yoke of conformity" under communism more than economic inequality (*Chapters on Socialism*). His ultimate value is the free development of individuals, which he believed required significant space for private life, initiative, and difference – elements he saw as potentially threatened by collective systems.
  2.  **Defense of Competition and Private Property (Conditionally):** Mill never abandoned the belief that competition, while imperfect, was a crucial engine of progress and efficiency. His support for cooperatives envisions them competing within a market framework. Crucially, he defends the *principle* of private property tied to exertion and abstinence. His critique targets *unjust* acquisition (inheritance, monopoly, luck), not the *institution* itself when functioning justly. His proposed reforms (e.g., inheritance taxes, land reform) aim to *correct* capitalism, not abolish it. He explicitly rejects the abolition of private property (*Principles*, II.i.3, *Chapters on Socialism*).
  3.  **The Hedge: Experimentation and Voluntarism:** Mill's support for socialism/cooperation is always heavily qualified. It must be *voluntarily* adopted through persuasion and example. It requires *experimentation* to prove its superiority. He insists change must be *gradual* and peaceful. This isn't merely tactical; it reflects a deep-seated liberal aversion to revolutionary upheaval and faith in reasoned, incremental progress based on evidence. His "socialism" is contingent on proof and consent.
  4.  **Focus on Distributional Justice within Capitalism:** Much of Mill's radical critique focuses on *reforming the distribution* generated by the existing capitalist system (via inheritance laws, taxation, education, population control), not necessarily on abolishing the system of private capital ownership and wage labour *itself*. He seeks to make capitalism more just and humane, aligning rewards more closely with desert, rather than replacing it entirely.

  *Engaging Socialist Counter-Evidence:* This reading argues that Mill's warm words for cooperation represent his belief in its potential as the *most effective reform mechanism within a broadly liberal capitalist framework*, not its inevitable replacement. His critique of capitalist property distribution is a powerful call for *redistribution* and *meritocracy*, not the abolition of private ownership per se. The *Autobiography* statements are aspirational and speculative ("ultimate prospect"), tempered by his immediate, practical focus on achievable reforms. His praise for cooperation is genuine but framed within his liberal constraints: voluntary adoption, competition, and the paramount importance of individuality – constraints that fundamentally shape and limit the "socialist" elements.

  ### The Verdict: Liberal Socialist Mode of Production

  Neither reading fully captures the nuance of Mill's late position. The "genuine socialist" reading understates his enduring, non-negotiable commitment to individual liberty as the supreme value and his rejection of collectivist models threatening it. The "liberal reformer" reading understates the radicalism of his critique of capitalist *production relations* (wage labour as inherently degrading) and his conviction that cooperative *ownership and management* represented the necessary and desirable *future form of industrial organization*.

  The synthesis lies in recognizing a distinct **liberal socialism focused on the mode of production:**

  1.  **Socialist Mode of Production:** Mill unequivocally advocated for the *replacement of capitalist firms with worker-owned cooperatives* as the dominant form of productive enterprise. This is not a minor reform but a fundamental shift in economic organization – the abolition of the employer/employee relationship he deemed exploitative and liberty-stifling. His vision of "common ownership" in the *Autobiography* pertains directly to the *means of production* being owned by those who use them collectively. *This is the core socialist element.*
  2.  **Liberal Distribution:** However, Mill did not advocate for distribution based solely on need or strict equality. Distribution within and between cooperatives would be based on *contribution* – labour, skill, and abstinence (investment) – regulated by competition in the market. This aligns with his liberal principle of just desert and reward for exertion. His reforms aimed to make *this* merit-based system possible by dismantling unearned privilege, not instituting a collectivist distribution scheme.
  3.  **Liberal Framework:** This new mode of production would operate within a framework of fiercely guarded individual liberties (speech, association, private life), political democracy, and voluntary association. Change must be consensual and gradual. Competition between cooperatives would persist. The state's role, while potentially larger than in classical liberalism (e.g., education, regulating inheritance), was not envisioned as the central owner or planner.

  ### Conclusion: The Cooperative Commonwealth as Liberal Endpoint

  John Stuart Mill's late political economy evolved towards advocating a **cooperative commonwealth**. This vision is socialist in its core prescription for organizing production: replacing hierarchical capitalist firms with democratically managed worker cooperatives, thereby abolishing wage labour and ensuring workers owned the fruits of their combined labour. However, it remains fundamentally liberal in its distributive principle (reward based on contribution/desert), its unwavering prioritization of individual liberty against both state and social tyranny, and its insistence on voluntary, experimental, and gradual transition. He became convinced that *true individual liberty and development* were incompatible with the dependency and alienation inherent in capitalist wage labour, and that worker cooperation offered the path to reconcile economic justice with personal freedom. Mill, therefore, stands not as a reluctant liberal dabbling in socialism, nor as a socialist compromising with liberalism, but as the progenitor of a distinct tradition: **liberal socialism**, where the socialist reorganization of production is the necessary means to achieve the deepest aims of liberalism – the flourishing of free individuals within a just society. His "socialism" resides firmly in the transformation of *how we work and who owns the workplace*, while his liberalism defines *how we are rewarded and how we live as free persons*. This is the definitive, albeit complex, verdict on the late Mill.
