answer: |-
  The fluorescent lights of the Sterling Labs Annex hummed with the same monotonous indifference they always had. For postdocs Alex Chen and Samira Hassan, the Friday afternoon routine was ingrained: prep the catalyst batch for next week’s Suzuki coupling. The air held the familiar tang of acetone and ozone, the soundtrack the rhythmic click of centrifuges and the low thrum of the solvent recycler.

  "Batch C-17," Alex sighed, tapping the protocol sheet. "Same as last week, and the week before. Honestly, could automate this in our sleep."

  Samira glanced at the large amber bottle labelled **Di-tert-butyl Peroxide (DTBP) - HIGHLY SHOCK SENSITIVE. Store below 25°C. Verify temp/stability before handling.** The temperature strip read 24°C. "Safety check?" she murmured, more habit than question. The protocol mandated verifying the reagent’s internal temperature and stability indicator *before* decanting.

  Alex waved a dismissive hand. "It’s been rock solid. Look, temp’s fine. The indicator? It’s *always* fine when the temp’s good. We’d hear it hissing or something if it was off, right? I’m starving, and Patel’s buying beers at The Nucleus at six." He grabbed the bottle. "Quick in, quick out."

  Samira hesitated, her finger hovering over the protocol’s step 3b: *Verify Stability Indicator*. She pictured the cool pint glass, the relief of Friday. The bottle felt cool in Alex’s hands. *It’s fine*, she thought, echoing Alex. *It’s always fine. Just this once.* "Yeah, okay. Quick in, quick out." She grabbed the graduated cylinder.

  **Scene: Alex. Two Weeks Later.**
  Alex recounted the near-miss to laughter around a crowded table at The Nucleus. "So there I am, pouring the DTBP, right? And I swear, I *felt* it. This tiny little *pop*, like a bubble gum bubble inside the bottle. Barely audible. My hand just… froze." He mimed jerking the bottle away. "Nothing happened! Not even a fume cloud. But man, my heart was in my throat for a second. Lesson learned, folks. Don’t skip the check, even when you’re sure." He took a swig of beer, the near-disaster already morphing into a cautionary tale, a badge of experience. Dr. Patel clapped him on the shoulder. "Lucky escape, Chen! Good instincts to stop. Shows you’ve got the right reflexes." Alex basked in the relieved approval. The skipped check was a footnote, overshadowed by his quick, ultimately unnecessary, reaction. He was the careful one who’d *almost* learned the hard way.

  **Scene: Samira. The Following Monday.**
  The explosion wasn’t a Hollywood fireball. It was a sharp, contained *CRACK*, like a giant lightbulb shattering, followed by the terrifying hiss of high-pressure release. Samira had been decanting the DTBP. One moment, the viscous liquid was flowing smoothly; the next, the bottle fractured in her gloved hand. A shard of amber glass, propelled by the decomposing peroxide, sliced through her glove and deep into the tendons of her left hand before embedding itself in the fume hood sash. The cold shock came first, then the searing pain. The lab erupted into chaos – shouts, the emergency shower’s deluge hitting the floor nearby, the blare of the alarm.

  **Scene: Samira. Three Months Later.**
  Sterling Labs felt different. Quieter, somehow, when Samira walked through. The Annex had been repaired, the fume hood replaced. But the glances followed her – fleeting, wary, tinged with pity or unspoken blame. She held her left hand slightly stiffly; the physical therapy was helping, but fine motor control was a struggle, her grip permanently weakened. Grant applications stalled. The once-buzzing collaboration requests dried up.

  At a department coffee hour, she stood slightly apart, cradling her mug awkwardly. Nearby, a group of new grad students chatted animatedly. "…heard about the accident in the Annex?" one whispered, not seeing Samira. "Hassan, right? Skipped the stability check. Totally blew protocol." Another shook their head. "Crazy. One little step. Costly mistake." The word *mistake* hung heavy. Not *risk*, not *gamble*, but *mistake*. Her identical choice, made with identical reasoning, under identical conditions, had become a defining moral failure.

  Later, cornered by Dr. Vance, a senior researcher known for his bluntness, the judgment became explicit. "Samira," he said, his voice low, "terrible business. Truly. But you understand why the review board… well, it wasn’t just the injury. It was the procedural lapse. A fundamental safety violation. It erodes trust." He didn’t mention Alex’s identical lapse, the near-miss treated as a close call, not a violation. For Samira, the outcome *was* the violation.

  **Scene: The Rooftop. Late Evening.**
  Samira found Alex on the seldom-used lab roof, staring at the city lights. The silence stretched, filled only by distant traffic. Alex finally spoke, his voice tight. "They offered me the junior PI spot on the Henderson grant."

  Samira didn’t react immediately. She flexed her left hand, feeling the familiar tug of scar tissue. "Congratulations," she said, the word flat.

  "It doesn’t feel right," Alex blurted out. "What happened to you… it could have been me. *Should* have been me, maybe, that day. I skipped the check too. Same reason. Same stupid confidence." He turned to her, his face anguished. "We made the *exact* same choice, Sam. Down to the bone. Why am I the guy who ‘learned his lesson’ and you’re…" He trailed off, unable to voice the unspoken labels.

  Samira looked out at the grid of lights. "The shard of glass," she said quietly, "it severed the flexor tendon to my index and middle finger. I can hold a pen now, sort of. Pipetting? Forget precision work." She paused. "After the surgery, lying there, all I could think about was that bottle. It felt cold. The temp strip was green. It looked… exactly like every other time." She turned to Alex, her eyes reflecting the city’s glow, hollow and questioning. "So, Alex… what was the difference? Between your outcome and mine? Between a cautionary tale and a career-ending mistake?" She held up her damaged hand, not in accusation, but as a stark, silent question mark against the indifferent night sky. "If *that* difference is just… luck… what does it mean about *us*? About who we are?" The wind snatched the last words, leaving only the chilling echo of the thought hanging between them – the fragile illusion of control, shattered as easily as glass.
