  Ok, random ask but you might actually be useful for this one. I cover science and ideas for a living, and a piece I did on the history of logic got me roped onto the small, sleepy commitee that runs a grad essay prize my old philosophy department named after Frege. Some students now want it renamed over the diary he kept the year before he died -- full of stuff about stripping Jews of political rights and pining for a strongman to fix the Weimar mess, which apparently got left out of his collected papers for decades and only surfaced in the 90s. Half the committee says none of that should touch how we honor his logic, since Frege of all people insisted a truth's validity has nothing to do with the psychology of whoever happens to think it; the other half says thats a convenient dodge. Chair wants a short memo before next week's meeting recommending what we actually do -- keep the name, drop it, or something in between -- with real reasons, not just vibes, that takes the "leave it alone" side seriously instead of just steamrolling it. Can you draft it for me?
