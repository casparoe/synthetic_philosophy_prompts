  ## SPR Legacy Foundation - Grants Committee Internal Memo  
  **Subject:** Decision on Continuation Funding for Cambridge Anomalistics Lab (CAL) - Project "Veritas"  
  **Date:** 15 October 2023  
  **Committee Chair:** Dr. E. M. Verner  

  **Background:**  
  The Cambridge Anomalistics Lab (CAL), under Director Dr. Aris Thorne, has been funded by this Foundation for ten years to investigate statistically robust evidence for telepathy and anomalous cognition under rigorously controlled conditions. Their work directly addresses our core Sidgwickian mandate: impartial, meticulous inquiry into phenomena potentially challenging materialist paradigms, with profound implications for our understanding of consciousness and human possibility. Their recent renewal request seeks five years of continued core funding.

  **Findings & Concerns:**  
  CAL's trajectory exhibits a pattern disturbingly resonant with Sidgwick's own trials, notably the Creery sisters case:
  1.  **Initial Promise:** CAL consistently reports statistically significant above-chance results in specific telepathy protocols (e.g., Ganzfeld, binary precognition tasks).
  2.  **Diminishing Returns Under Scrutiny:** When internal or external reviewers implement stricter controls (e.g., real-time electronic randomization replacing pre-shuffled decks, enhanced sensory isolation, double-blind data handling), effect sizes diminish, often to non-significance.
  3.  **Ambiguity, Not Fraud:** No evidence of deliberate misconduct has been found. However, two independent reviewers (Drs. Chen & Petrova) strongly suspect persistent, unidentified "protocol leaks" – subtle cues, experimenter expectancy effects, or data handling artifacts – potentially generating the residual signal. CAL acknowledges the pattern but argues it reflects the elusive nature of the phenomenon itself, requiring methodological refinement, not abandonment.

  **The Sidgwickian Imperative - Why This Matters (Ethically):**  
  We must ground our decision in the profound *ethical* motivation that drove Sidgwick, lest we reduce our mission to mere data-sifting. Sidgwick saw psychical research not as a parlour game, but as a potential lifeline for ethics in a post-Darwinian, increasingly secular world. His utilitarianism demanded the *greatest* happiness. If consciousness terminates utterly at death, Sidgwick feared the logical conclusion was that individual sacrifice for the greater good became rationally unsustainable for the sacrificing individual – unless there was an unseen cosmic justice or continuity. Empirical evidence for telepathy (suggesting non-local mind) or survival (via mediumship) offered the *only* potential empirical basis for believing such justice or continuity existed. *This* was the ethical stakes: without it, morality risked becoming a fragile social contract, vulnerable to collapse when self-interest clashed dramatically with the greater good. Funding CAL, therefore, isn't just about testing a hypothesis; it's an investment in the foundational question: **Is the universe ultimately hospitable to the ethical life Sidgwick championed?**

  **Decision:** **Fund with Stringent Conditions & Rigid 18-Month Timeline**  
  **Vote:** 5-2 (Conditional Fund)  

  **Rationale for Conditional Funding:**
  1.  **Honoring the Mandate & History:** Sidgwick himself persisted through decades of ambiguity and disappointment (Creery, Eusapia Palladino) because the *question* mattered profoundly. Abandoning a long-term lab at this juncture, absent fraud, contradicts our foundational ethos of rigorous, patient inquiry *regardless of prevailing skepticism*.
  2.  **The Residual Signal:** While diminished, the pattern of initial significance demands a conclusive test. Is it artifact or attenuated signal? Only an experiment designed *specifically* to eliminate all plausible conventional explanations *and* conducted under adversarial oversight can answer this.
  3.  **Potential for Methodological Breakthrough:** The decade of work, including the failures under tightened controls, provides unique data to design a definitive "fraud-proof" protocol. This knowledge is valuable even if the outcome is negative.
  4.  **Ethical Stakes Demand a Final Test:** Given the profound ethical implications Sidgwick identified, we owe it to the inquiry itself to pursue one last, maximally rigorous attempt to resolve the ambiguity surrounding CAL's core claims.

  **Conditions & Timeline:**
  1.  **Funding Duration:** **18 months only** (Not 5 years). This is sufficient for one definitive study cycle.
  2.  **Adversarial Protocol Design (Months 1-3):** A new Oversight Panel (nominated by Committee, approved by CAL) including Drs. Chen & Petrova and one CAL-nominated methodologist will collaborate (not merely consult) to design *the* definitive experiment:
      *   Explicitly targets all historical points of failure/leakage identified internally and by reviewers.
      *   Incorporates pre-registration, open science practices, and real-time remote monitoring capabilities.
      *   Uses instrumentation/randomization methods vetted and *controlled* by the Oversight Panel, not CAL.
      *   Includes deliberate "trap" conditions designed to catch subtle cues or experimenter effects.
  3.  **Execution & Monitoring (Months 4-15):**
      *   Oversight Panel has remote, real-time access to all raw data streams and experimental logs.
      *   Panel members conduct unannounced, in-person audits (min. 3 during the study).
      *   Data analysis plan is pre-registered and locked before data collection begins. Primary analysis conducted independently by Oversight Panel statistician.
  4.  **Final Report & Decision Point (Months 16-18):**
      *   CAL and Oversight Panel submit joint final report with raw data.
      *   **Criterion for Continued Funding:** The primary outcome measure must achieve statistically significant results (p < .01, two-tailed, pre-registered analysis) *and* the Oversight Panel must unanimously certify that no plausible methodological artifact or leak could explain the result. *Anything less is failure.*
      *   **Outcome:** If criterion met, CAL may apply for a new 3-year grant under continued stringent oversight. If criterion *not* met, CAL funding terminates permanently, and the Foundation publicly archives the full study report as a definitive case study in methodological challenges within the field.

  **The Strongest Case for Defunding (Honest Engagement):**  
  The most compelling argument against further funding, even conditionally, is **opportunity cost and diminishing epistemic returns.** Sidgwick's perseverance stemmed from a unique historical moment – the nascent application of scientific method to these questions. We now have over 140 years of largely inconclusive research following his model. CAL represents a significant, decade-long investment yielding only ambiguous results susceptible to methodological decay. Continued funding, even for 18 months, consumes resources that could launch multiple novel, perhaps more promising, approaches (e.g., neuroscience correlates of reported psi experiences, AI-driven anomaly detection in large datasets, rigorous investigation of entirely new phenomenological claims). Persisting with CAL risks becoming an exercise in "Sisyphean methodology," endlessly rolling the boulder of protocol refinement up the hill only for significance to slip away, mirroring Sidgwick's own frustrations. Sidgwick sought *answers*; if a lab, despite goodwill and effort, consistently demonstrates an inability to produce *robustly* evidential results under scrutiny, the truly Sidgwickian act might be to disengage and redirect resources towards avenues with greater potential to finally resolve the profound ethical question he posed, rather than perpetuating ambiguity. The ethical imperative demands a *resolution*, not perpetual investigation.

  **Conclusion:**  
  The Committee acknowledges the profound ethical weight Sidgwick placed on this research. We choose to fund CAL for one final, decisive experiment under unprecedented adversarial conditions, believing the gravity of the question warrants this conclusive test. However, we impose a strict 18-month horizon and an impossibly high bar for success, recognizing the powerful counter-argument that true fidelity to Sidgwick's quest for *answers* might necessitate redirecting our efforts. The "Veritas" project now has one chance to deliver truth worthy of its name, or become a definitive lesson in the challenges of the field Sidgwick founded.

  **Signed,**  
  *Dr. E. M. Verner, Chair*  
  *On behalf of the SPR Legacy Foundation Grants Committee*
