  Pretend your on the grants committee of a small foundation that's basically the spiritual heir to Sidgwick's SPR: same mandate, rigorously test claims of telepathy and mediumship, don't prejudge the answer either way. A lab you've funded for a decade keeps hitting the exact pattern Sidgwick ran into with the Creery sisters -- promising above-chance results that shrink whenever outside reviewers tighten the controls, no outright fraud this time, but two reviewers smell an uncaught protocol leak nobody's pinned down. The lab's asking for another five years of money.

  Write the committee's memo: fund, defund, or fund with conditions, with an actual timeline attached. It should seriously engage with why Sidgwick himself thought this kind of research mattered so much for ethics, not just recite "extraordinary claims" boilerplate -- and give an honest account of the strongest reason the side you don't pick might still be right.
