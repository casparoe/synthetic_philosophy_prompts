answer: |-
  Here's a dialogue between **Kai** (who believes complex cluelessness fatally undermines consequentialism) and **Morgan** (who believes consequentialism can navigate it), both deeply familiar with the literature. They engage rigorously, building on each other’s points without strawmanning:

  ---

  **Setting:** A university common room, late evening. Coffee cups litter the table.

  **Kai:** (Leaning forward) Okay, hit me with your best defense. I’ve been stewing on Hilary Greaves’ distinction, and I’m convinced complex cluelessness is the poison pill for consequentialism. It’s not that we’re ignorant—it’s that we have *asymmetrical evidence* about long-term ripple effects that we can’t systematize. Take bednets: we save kids, but alter future populations. Maybe that prevents a war, or maybe it accelerates climate collapse. We have fragments of evidence—demographic studies, historical precedents—but no way to weigh them coherently. How can consequentialism demand we maximize expected value when the value function itself is buried under chaotic noise?

  **Morgan:** (Nodding) First, I’ll grant you this: complex cluelessness is real and terrifying. But it doesn’t wreck consequentialism; it *recontextualizes* it. Consequentialism isn’t about *omniscience*—it’s about *rational choice under uncertainty*. We use the best causal models we have, bounded by evidence. If bednets reliably reduce suffering *now* and we’ve no systematic reason to think they cause net harm long-term, acting on proximate evidence *is* maximizing expected value. The cluelessness is symmetric until proven asymmetric.

  **Kai:** But that’s just it! Complex cluelessness *is* proven asymmetric. We know from chaos theory and evolutionary biology that tiny changes *can* trigger massive, unpredictable shifts—and we have lopsided evidence that many interventions might *systematically* increase existential risk. Toby Ord’s work on AI, or Parfit’s repugnant conclusion—these aren’t random unknowns. They’re signposts pointing toward *directional uncertainty*. When we donate to bednets, we have *some* reason to think altering future populations might skew toward bad outcomes (e.g., resource scarcity), but no way to quantify it. That’s not symmetric ignorance; it’s unmanageable bias.

  **Morgan:** Two responses. First, directional uncertainty cuts both ways. For every disaster scenario, there’s a utopian one (e.g., bednets → more educated population → tech innovation → clean energy). We lack systematic evidence for *net* bias toward bad outcomes. Second—and this is key—consequentialism can absorb this by *discounting unpredictable long-term effects*. We focus on robustly good proximate impacts *and* avoid actions with clear catastrophic potential. That’s why effective altruists prioritize global health and AI safety: one has measurable short-term good, the other mitigates tail risks with modelable pathways. Cluelessness doesn’t paralyze us; it prioritizes actions with *shallow* causal depth.

  **Kai:** (Sighs) You’re retreating to the proximate! But consequentialism’s core claim is that *actual outcomes* determine rightness. If 99% of an action’s consequences are in the chaotic long-term—and we admit we can’t model them—then "expected value" collapses. Discounting long-term effects is arbitrary. Worse, it’s question-begging: we’re *defining* "robustly good" actions as those unaffected by cluelessness, but that’s circular. Every act has deep ripples. Williams was right: this makes consequentialism "practically self-defeating."

  **Morgan:** Not circular—*pragmatic*. We’re epistemic agents, not Laplace’s demon. When long-term effects are truly clueless (complex or not), we *should* ignore them because they carry no *actionable* expected value signal. The alternative isn’t better moral reasoning—it’s paralysis or moral luck worship. Besides, cluelessness isn’t unique to consequentialism! Deontologists can’t prove their rules won’t cause catastrophe either. At least we’re honest about the uncertainty and try to minimize predictable suffering.

  **Kai:** Ah, but deontology *embraces* constraints as intrinsically right—consequences be damned. Consequentialism can’t do that without betraying itself! And "ignoring" clueless effects is an epistemic surrender. Greaves’ whole point is that we *do* have *some* evidence—e.g., we know altering identities might *generally* be bad (via impersonal harm arguments)—but it’s too fragmentary to use. That’s the horror: the moral math is *indeterminate*, not zero. Consequentialism demands calculation where calculation is impossible. It’s like being lost in a maze with a map that says "some paths are deadly, but I won’t tell you which."

  **Morgan:** (Pauses) I’ll concede this much: complex cluelessness humbles consequentialism. It forces us into a "cluelessness-adjusted" version. We maximize expected value *within the domain we can model*, avoid clear tail risks, and accept moral uncertainty for the rest. That’s not surrender—it’s sophistication. Parfit himself argued we should often act on what we *can* know (e.g., reducing torture now). And if we find evidence of systematic asymmetry—like Bostrom’s vulnerable world hypothesis—we update. The map isn’t blank; it’s blurry. We walk carefully where it’s clear, and don’t sprint where it’s not.

  **Kai:** But "where it’s clear" is vanishingly small! And "blurry" implies we might someday fix it. I don’t think we can. Chaotic systems defy forecasting. Consequentialism’s promise was a science of morality, but complex cluelessness leaves it with… well, vibes. Beautiful theory, unworkable in practice.

  **Morgan:** Then give me a better guide. If not consequences—actual or expected—then what? Intuitions? Duties forged in a pre-chaos-theory era? I’ll take blurry consequentialist maps over no maps at all. We *do* improve models (e.g., climate science). We *do* learn. Cluelessness is a call to better epistemology, not defeat.

  **Kai:** (Smiles wryly) Touché. But I still think the maze eats your map for breakfast. Another coffee?

  **Morgan:** Only if we can model the long-term effects on our sleep cycles.

  **Kai:** Point taken. Let’s call it a draw.

  ---

  **Key Points Engaged:**
  - **Kai** emphasized the *indeterminacy* of moral math under complex cluelessness and its challenge to core consequentialism.
  - **Morgan** reframed consequentialism as *pragmatic decision-making under deep uncertainty*, prioritizing tractable impacts and avoiding tail risks.
  - Both agreed cluelessness is profound and asymmetrical but diverged on whether it invalidates ("unworkable") or reforms ("humbleness") consequentialism.
  - **No clean winner**: Kai sees it as a structural flaw; Morgan sees it as a navigable constraint. The debate mirrors real EA/ethics scholarship.
