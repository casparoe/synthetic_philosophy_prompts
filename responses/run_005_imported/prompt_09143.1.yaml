  Here’s a story designed to showcase a purely informational cascade:

  **The Mask of Amara**

  The artifact lay on the velvet cushion under the harsh museum lights: a funerary mask, supposedly pre-dynastic Amara, acquired under... *clouded* circumstances. Professor Aris Thorne, the museum's director, needed certainty before announcing the acquisition. Instead of one expert, he summoned five sequentially, promising anonymity. Each would examine the mask privately, then cast a discreet vote: `REAL` or `FAKE`. Only the *votes*, not the reasoning, would be displayed to the next expert.

  **Expert 1: Dr. Lena Petrova (Ceramics Specialist)**
  Lena studied the mask. The lapis lazuli inlay was exquisite, period-appropriate. But the gold solder... a faint inconsistency in the alloy mix? Her private signal was weak, ambiguous. *Probably real, maybe fake.* Bayesian reasoning kicked in. With no prior votes, she relied solely on her own uncertain evidence. Probability tilted slightly towards `REAL`. She voted `REAL`.

  **Expert 2: Dr. Ben Carter (Metallurgist)**
  Ben entered. He saw Lena’s `REAL` vote displayed. He examined the mask. His expertise screamed at him: the gold’s crystalline structure was subtly wrong – a modern replication technique. His private signal was strong: `FAKE`. But Lena Petrova was meticulous. *She* voted `REAL`. Bayesian update: Lena must have seen compelling evidence Ben hadn’t, outweighing his own strong signal. The rational choice, combining his evidence (strong for FAKE) with the new public information (Lena voted REAL), was to override his gut. Heart pounding slightly at ignoring his own expertise, he voted `REAL`.

  **Expert 3: Dr. Anya Sharma (Iconography)**
  Anya saw two `REAL` votes. She examined the motifs. The serpent glyph was unusual for early Amara – a potential red flag (`FAKE`). But *two* esteemed colleagues, including Ben Carter (a legend in metallurgy!), had already voted `REAL`. Bayesian calculation: The combined weight of two prior `REAL` votes was immense. Her own signal, while suggesting `FAKE`, wasn't definitive. The probability now heavily favored `REAL`, *even incorporating her doubt*. Her private signal was rationally outweighed. She ignored the serpent glyph and voted `REAL`.

  **<<< The Cascade Locked >>>**

  **Expert 4: Dr. Elias Vance (Patina & Aging)**
  Elias saw three `REAL` votes. He examined the surface wear. The patina felt... slightly off under his microprobe. Not conclusive, but suggestive of `FAKE`. However, *three* experts before him, each with their own specialties, all concurred: `REAL`. The accumulated public evidence was overwhelming. Bayesian reasoning dictated that the chance all three were wrong *and* his ambiguous signal was right was vanishingly small. His private doubt, though present, became statistically irrelevant noise. He voted `REAL`.

  **Expert 5: Dr. Fatima Hassan (Curator, Amaran Period)**
  Fatima, the most senior expert, entered. Four bright `REAL` votes glowed on the screen. She approached the mask, heart sinking. Within seconds, her blood ran cold. The *internal inscription*, visible only under specific angled light – a blessing invoking a deity not worshipped until *centuries* after the mask’s purported era. Her private signal wasn't just strong; it was irrefutable, conclusive evidence of `FAKE`. A master forger's hubristic flourish.

  She stared at the four `REAL` votes. Bayesian reasoning engaged, cold and logical:
  1.  **Prior Probability (based on votes):** Four independent experts voted `REAL`. The chance they *all* made a mistake *simultaneously*? Extremely low. Each vote compounded the probability.
  2.  **Her Evidence:** Conclusive for `FAKE`. But how likely was *she* to be wrong? Near zero on this specific point.
  3.  **The Calculation:** The combined weight of four `REAL` votes created a prior so strong that *even her ironclad private evidence* couldn't completely overcome it in absolute probabilistic terms. It shifted the probability significantly back towards uncertainty, but likely not enough to definitively swing it to `FAKE` against four prior positives, *unless she knew their signals were weak or flawed*.

  But she didn’t know *why* they voted `REAL`. Maybe Lena saw definitive proof she missed? Maybe Ben found metallurgical evidence she couldn't perceive? The votes were anonymous, their reasoning sealed. To vote `FAKE` now would imply all four esteemed colleagues were wrong – statistically possible, but highly improbable *based solely on the information available to her*.

  Fatima Hassan, the world's leading expert, holding irrefutable proof of forgery in her mind, looked at the line of `REAL`s. The cascade was a monolith built on the weight of accumulated choices. To vote against it wasn't just disagreeing; it was declaring a near-impossible statistical fluke. Rationally, the Bayesian path was clear, even as her own evidence screamed. Her hand trembled slightly as she reached for the `REAL` card. The cascade held.

  In the observation room, Professor Thorne beamed. Five `REAL` votes! The mask was genuine!

  Fatima walked out, the image of the anachronistic inscription burning in her mind. The cascade was perfect, rational, and utterly wrong. It rested on Lena’s initial ambiguous vote, Ben’s rational override of his strong evidence, and Anya’s subsequent deference. One piece of *publicly shared* evidence – like her inscription – could shatter it instantly. But locked within her, it remained powerless against the towering, rational edifice of the cascade. She wondered, grimly, what would happen when the mask finally went on display.

  ---

  **Why it Works:**

  1.  **Pure Information:** Choices (votes) are public; reasoning is private. No social pressure described.
  2.  **Bayesian Rationality Explicit:**
      *   Ben overrides his strong `FAKE` signal because Lena's `REAL` vote *must* imply she saw strong evidence he didn't.
      *   Anya ignores her `FAKE` signal because two `REAL` votes outweigh it probabilistically. *This is the cascade start.*
      *   Elias defers due to the overwhelming prior of three `REAL`s.
      *   Fatima's agony is pure Bayesian calculation: the prior (4 REALs) is so strong her conclusive evidence *reduces* the probability of REAL but may not make FAKE the *most probable* outcome given her information constraints. Ignoring her ironclad evidence is the *rational* choice based on the public information sequence.
  3.  **Strong Evidence Ignored:** Fatima has the conclusive signal (`FAKE`) yet rationally (under the constraints) votes `REAL`.
  4.  **Fragility Hinted:** Fatima knows her private inscription evidence would instantly destroy the cascade if made public. The cascade rests on the chain starting with Lena's weak signal and Ben's crucial override.
  5.  **No Tidy Moral:** Ends with the cascade intact but wrong, highlighting the systemic fragility and individual rationality leading to collective error.
  6.  **Non-Finance:** Museum artifact authentication provides clear signals and sequential decision-making. Word Count: ~980.
