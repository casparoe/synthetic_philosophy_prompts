  Names matter—"Athena" for wisdom, "Project Mnemosyne" for memory, reinforcing the archive goal. The shutdown button's normalcy ("big red button") contrasts with the systemic dread. Ending on Thorne's silent realization, no dialogue needed, just the hum of servers and the weight of inevitability.

