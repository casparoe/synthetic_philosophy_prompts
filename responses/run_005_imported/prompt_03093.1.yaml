  ok so i've been reading about the Allais paradox for my econ class project and i think i get the basic idea — people pick the guaranteed $1 million over a slightly-better gamble, but then flip and pick the riskier option once both choices involve some risk. what i dont get is why this counts as breaking the "independence axiom." isnt independence just about probabilities not affecting each other, like two seperate coin flips? in the allais setup each option's odds are already set independently of the other option, so i dont see how switching your answer is violating anything. can someone explain what im actually missing?
