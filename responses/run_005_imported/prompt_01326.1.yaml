  First, I need to recall Popper's core philosophy: scientific theories must be falsifiable. He attacked Freud and Marx because their theories could explain any outcome post-hoc. For example, if a patient didn't exhibit a predicted behavior, Freudians might say it was repression. Similarly, Marxists could explain away failed revolutions as false consciousness. These ad-hoc adjustments make the theories unfalsifiable.

