  Also, the user might be interested in the broader implications: Is Popper's criterion too rigid? Maybe. But his distinction highlights that some theories can be anchored in empirical evidence through specific predictions, while others remain insulated. The user might also be probing if Popper's personal biases played a role. While he admitted his initial mistake on evolution, his stance on Freud and Marx remained firm, possibly due to their social impact versus biology's empirical progress.

