  For follow-ups, I'll predict her likely defenses (e.g., "custom ensures predictability") and push further ("But doesn't that reduce God to a cosmic habit?"). On kasb, I'll press whether it truly resolves free will or just rebrands determinism—a classic critique she’s probably heard before. 

