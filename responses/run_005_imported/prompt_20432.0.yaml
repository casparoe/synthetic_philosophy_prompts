  Okay so I'm elbow deep in this novel where one of my leads is a probability theorist who's kind of insufferable at parties, and there's a scene I keep rewriting where she gets into an argument with her brother in law over dinner about what "50/50" even means. I want her to bring up something in the spirit of Bertrand's paradox -- you know, the classic setup where you ask "what's the probability that a random chord is longer than the side of an equilateral triangle inscribed in the same circle," and depending on whether you randomize the two endpoints of the chord, its perpendicular distance from the center, or its midpoint, you get 1/3, 1/2, or 1/4, and all three ways of picking "at random" sound equally fair and unbiased at first glance. That example's great but it's also the one every person who's ever taken a stats class has already heard, and my editor will definately clock it as me doing wikipedia research five minutes before a deadline, so I need something original for the actual page.

  Can you invent a brand new scenario -- doesn't have to be geometric at all, could be about darts, dice, picking a random road trip route, whatever works dramatically -- where at least two different, individually reasonable ways of applying "the principle of indifference" (just splitting probability evenly across options when you've got no reason to favor one over another) lead to genuinely different numeric answers for the same event? I'd like the actual numbers to work out cleanly so my character can scribble them on a napkin mid-argument, plus two or three sentences on why each method seems perfectly innocent on its own terms, since that's the part that makes it an actual paradox and not just "person A did the math wrong." Bonus points if it's something a mildly drunk dinner guest could still follow.
