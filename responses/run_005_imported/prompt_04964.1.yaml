  I should ensure examples from software make the philosophy concrete. Comparing microservices and modules using Chalmers' test shows how definitions resolve part of the dispute. Then Sider's point highlights choosing based on what structures (like scalability) are fundamental. The deflationist retort would emphasize pragmatic over objective factors.

  The user might also be interested in applying these philosophical frameworks to real technical decisions, so linking theory to practice is key. Explaining how joint-carving in software could mean aligning with domain boundaries or scalability needs. But the deflationist would say these are context-dependent, not universal truths.

