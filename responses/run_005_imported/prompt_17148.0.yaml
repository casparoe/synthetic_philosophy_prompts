  We are going to evaluate each move on a scale from -2 (clearly mistaken) to 2 (clearly right). The moves are:

  (1) Elena: We have reason to cooperate with distant agents because if many agents reason similarly, cooperation raises the correlated expected payoff (acausal trade).

  (2) Marcus: This isn't trade but unilateral niceness because there's no conditionality or trackability; it's a license to do what you want and call it a bargain.

