  For point (a) on overwork, Keynes would probably point to institutional failures and the persistence of scarcity mindset. He’d argue that distributional issues and policy choices prevented reduced work hours. The "tunnel" transition period is key here—society hasn’t adapted culturally to abundance. His moral view would criticize the normalization of overwork as a psychological disorder, worsened by social media’s reinforcement.

