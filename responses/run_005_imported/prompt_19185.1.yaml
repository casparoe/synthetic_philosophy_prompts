  4. **Priyanka (4): Score 2**  
     *Strong counter.* Distinguishes mundane claims from "impressive" ones subject to motivation bias. Highlights critical factors: verifiability difficulty, social gain, and rarity. Properly reframes skepticism as calibration, not paranoia.

  5. **Josh (5): Score 0**  
