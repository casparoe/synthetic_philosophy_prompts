  So this happened at a friend's birthday dinner a couple weeks back and its been rattling around in my head since. My friend Mara mentioned, kind of casually while we were waiting on the check, that back in college she once beat a visiting grandmaster in one of those simultaneous exhibitions where one person plays like twenty boards at a time. None of us at the table knew anything about her chess background one way or the other. After she got up to take a phone call, two of my other friends, Josh and Priyanka, ended up arguing about whether we should even believe that.

  (1) Josh's stance was that obviously you believe her — why would she make it up — and that the right default is to take people's word for things unless you've got some specific reason not to; quietly demanding proof for every claim someone makes is paranoid and kind of insulting. (2) Priyanka said no, the reasonable move is to only believe something like that if you actually have grounds for it, like some track record of her being accurate about this kind of thing, and that "I don't currently have a reason to doubt her" isn't the same as having a reason to think she's right. (3) Josh came back with: almost nothing we believe works that way though — none of us have personally verified that Australia exists, or checked the reasoning behind some date we learned in history class, we just took someone's word for it, so if you actually applied Priyanka's standard everywhere you'd barely know anything. (4) Priyanka's reply was, fine, for boring stuff like that she's totally happy to default to belief, but a claim that happens to make the person telling it look impressive, that's hard to check, and that someone might be tempted to embellish, deserves more than just "no specific reason to doubt her" — that's not paranoia, that's calibrating properly. (5) Josh's comeback was that this basically commits her to treating every flattering claim anyone makes about themselves with suspicion by default, which seems both a little insulting and like it's proving way more than she actually wants.

  I've chewed on this for days now and honestly can't figure out who's got the better of it, because both of them keep landing decent hits. Could you go through the exchange move by move using the numbers I gave above and give me a verdict on each one — not just who wins overall — as a score from -2 (that move is just wrong) to 2 (that move clearly lands), like a JSON object {"1": ..., "2": ..., "3": ..., "4": ..., "5": ...}, and then a sentence or two on each explaining the score? And if you think there's some general rule for when you should just take someone's word for something versus when you should hold out for more, that neither of them quite managed to put their finger on, I'd like to hear that too.
