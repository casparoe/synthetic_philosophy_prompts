  First, I need to recall the core arguments. Walzer's "moral equality of combatants" (MEC) hinges on the separation of jus ad bellum and jus in bello. Combatants are morally equal regardless of their side's cause because war is a collective enterprise where soldiers function as instruments. The key is the shared "liability" arising from mutual threat. But McMahan fundamentally challenges this by connecting individual moral liability to the justice of the war itself. 

  For McMahan, moral liability stems from moral responsibility for an unjust threat. So a soldier fighting for an unjust cause is morally responsible for posing that threat, even if following orders. This is where I should explain his "unjust threat" framing clearly—maybe use an analogy to a coerced mugger? The user seems to want that concrete causal chain: unjust cause → unjust threat → moral responsibility → liability. 

