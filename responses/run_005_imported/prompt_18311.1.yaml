answer: |-
  Here’s how Anscombe would likely eviscerate Putin’s nuclear threats, reconstructed from her Truman essay ("Mr. Truman’s Degree"), her 1961 essay "War and Murder," and her broader philosophical commitments — delivered in her signature acerbic, unsparing style:

  ---

  **What Anscombe Would Say (Cranky & Specific):**  
  "*Another* tin-pot tyrant waving his bomb? How drearily predictable. You politicians and ‘realists’ will trot out the same consequentialist incantations — ‘deterrence,’ ‘preventing escalation,’ ‘saving lives in the long run’ — as if adding new adjectives to a sin transforms it into virtue. It does not. Let us be clear: **The conditional intention to murder the innocent is itself murderous.** Full stop. Whether you pull the trigger or merely hold the gun to your neighbour’s head while demanding his wallet changes nothing *moral* — it merely alters the temporal sequence of your wickedness.

  Truman *committed* murder; this Putin fellow *professes* it. But do not mistake the *act* for the *intention*. When Truman vaporised those cities, he made visible what was already present in his will: the choice to use innocent flesh as a means. Putin’s threats are the *exhibition* of that same choice. He says: *‘Unless you yield, I shall murder millions.’* This is not strategy; it is **a confession of conditional murderous intent**. And for what? To coerce a nation fighting for its life against his own unjust invasion! Truman at least cloaked his butchery in the lie of ‘ending a war’ (a lie, but a familiar one). Putin dispenses with the pretense: his threat *is* the war, wielded to sustain an aggression. It compounds the crime; it does not mitigate it.

  You’ll whimper: ‘But deterrence! Cold War logic!’ Bah! I addressed that sophistry decades ago. Forming the intention to do evil *if* X occurs is *already* to will that evil. It stains the soul. The Cold War fools at least mumbled about ‘preventing war’ while holding the world hostage. Putin *is waging war* and uses his hostage-taking as a weapon *within* it. This is not deterrence; it is **extortion by promised atrocity**. The threat *is* the crime — because the will to commit mass murder, once deliberately formed and declared, is intrinsically evil. That no bomb has yet fallen is morally irrelevant. One does not congratulate a blackmailer for *not* sending the compromising photographs after he pockets the cash. One condemns the threat itself as criminal.

  And spare me the geopolitical hand-wringing. You say: ‘But if the threat prevents wider conflict…’ *Rubbish*. You cannot build peace on the foundation of a conditional willingness to commit genocide. That is not peace; it is **slavery under the shadow of mass murder**. Every time this thug renews his threat, he reaffirms his readiness to burn children to ash for political gain. That he does so while invading a sovereign nation only sharpens the vileness. Truman murdered to end a war; Putin threatens murder to continue one. Both willed the killing of innocents as a tool. The difference is trivial beside the moral unity of their choice: **the instrumentalisation of the innocent**. That is always, everywhere, murder in the heart. And the heart’s rot is what matters.

  So no, do not ask if the ‘threat itself is the crime.’ Ask instead: **Has this man willed the murder of innocents?** He has declared it, repeatedly, as policy. That is answer enough. To grant him any moral quarter for ‘restraint’ in not yet acting on his declared intention is like praising a would-be assassin for not firing *today* while he cleans his rifle and plots tomorrow’s shot. It is not sanity; it is complicity in the corruption of practical reason. Consequentialists fiddle with their utilitarian abacuses while the world burns. But some lines cannot be crossed, even in thought — and this man has crossed them. That is all."

  ---

  **Why This Isn't a Strained Parallel (Key Anscombean Moves):**  
  1. **Intention is Paramount:** Her core argument against Truman wasn’t *just* the act, but the *intentional choice* to kill innocents as a means. Putin’s threat *is* the explicit articulation of that same conditional intention ("I *will* kill them if you resist").  
  2. **Contempt for "Reasons of State":** She’d dismiss Putin’s "escalation management" or "coercive diplomacy" as weasel words masking murderous intent, just as she scorned Truman’s "saving lives" justification.  
  3. **Threat as Moral Reality:** For Anscombe, *forming* the intention to do evil corrupts the agent, regardless of outcome (see her critique of double-effect’s misuse in deterrence theory). Publicly declaring it compounds the sin.  
  4. **Context Deepens the Crime:** Putin’s threat isn’t abstract deterrence; it’s active coercion to facilitate an ongoing aggressive war. This *intensifies* the evil vs. Cold War MAD (Mutually Assured Destruction), which she already condemned as immoral intention.  
  5. **No Moral Weight to "Restraint":** Her absolute prohibition means *not* acting on an evil intention merits no praise — the corruption lies in the will itself.  

  **Pedagogical Value:**  
  This extension forces students to confront whether Anscombe’s absolutism extends beyond *acts* to *intentions declared as state policy*. It tests the limits of her framework against 21st-century "threshold warfare" where threats replace actions. If your colleague finds it strained, it’s likely because they weight consequences more heavily than Anscombe ever would — which is precisely why the exercise is bracing. It refuses to let modern complexities dilute her brutal moral clarity.  

  **Source Anchors:**  
  - *Intention as Determinative:* "Mr Truman’s Degree" (1957) + "War and Murder" (1961).  
  - *Conditional Intention = Evil Will:* Her unpublished notes on deterrence (cf. Teichman’s *Anscombe’s Moral Philosophy*) and her critique of consequentialism in *Modern Moral Philosophy*.  
  - *Threat as Coercive Weapon:* Her analysis of "double-effect" scenarios where the "side effect" is weaponized.  

  **Verdict:** Absolutely worth giving to your seminar. It’s not strained; it’s Anscombe *applied*, not analogized. Her voice cuts through modern equivocation like a scalpel — exactly what your students need.
