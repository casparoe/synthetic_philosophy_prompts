  *scribbles structure* The funeral setting adds delicious tension. Their debate should feel both urgently important and vaguely inappropriate. Maybe start with awkward small talk collapsing into familiar patterns. Physical cues matter - him fidgeting with his tie, her clutching her wine glass. 

  Dialogue rhythm: Early exchanges establish positions. Mid-section escalates with examples (Last Judgement, Resurrection). Later, personal dimensions emerge ("You used to be more honest"). The unresolved ending should leave both slightly shaken, aware they've been arguing about mortality all along. 

  *mental note* Must include his killer point: If belief isn't truth-apt, why do believers evangelize? And her counter: When you say "I love you," is that a hypothesis? That analogy could slice through his literalism. 

