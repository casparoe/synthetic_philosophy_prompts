  Let's list incorrect majority scenarios:
  1. All three wrong: prob = P(A wrong) * P(B wrong) * P(C wrong) = 0.1 * 0.3 * 0.4 = 0.012
  2. A correct, B wrong, C wrong: 0.9 * 0.3 * 0.4 = 0.108
  3. A wrong, B correct, C wrong: 0.1 * 0.7 * 0.4 = 0.028
  4. A wrong, B wrong, C correct: 0.1 * 0.3 * 0.6 = 0.018

  Sum for incorrect majority: 0.012 + 0.108 + 0.028 + 0.018 = 0.166

