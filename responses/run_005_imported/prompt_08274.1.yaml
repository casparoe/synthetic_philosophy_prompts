  - Case 4 produces incorrect majority (two wrong? No: A wrong, B and C correct → majority correct? Let's clarify:

  Actually:
  - Correct majority when ≥2 correct: cases 1 (all correct), 2 (A,B right; C wrong), 3 (A,C right; B wrong), and 4 is B and C correct while A wrong—that's two correct, so still correct majority. 

  Mistake here! Case 4 should be included in correct majority. So total correct majority probability is cases 1+2+3+4 = 0.378+0.252+0.162+0.042 = 0.834

