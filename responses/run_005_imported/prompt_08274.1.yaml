  Okay, the user is a retired experimental physicist with 35 years of experience, now diving into philosophy, specifically voting theory and the Condorcet Jury Theorem. They're questioning the theorem's implication that adding more competent voters always improves decision accuracy. Their lab experience tells them that averaging precise and sloppy measurements without weighting adds noise, so they suspect the same might apply to voting.

  The user wants a concrete numerical example with three independent jurors, each better than chance individually, but where a majority vote of all three is worse than relying solely on the most competent juror. They need actual probabilities to see the math work out.

  Hmm, this is interesting because the standard Condorcet theorem assumes equal competence. But in reality, jurors have varying reliability. The user's physics background makes them sensitive to noise from less reliable inputs. Their unspoken need might be to validate their intuition that unequal weighting matters in collective decisions, just like in scientific measurements.

  Let me recall the Condorcet Jury Theorem: with voters more likely correct than not, majority accuracy increases toward 1 as voters are added. But this assumes homogeneous competence. The user's insight is spot-on—heterogeneous competence changes everything. 

  I need to construct a scenario where:
  - All jurors have individual accuracy >50%
  - But the two weaker jurors introduce enough errors to drag down the majority vote below the strongest juror's accuracy.

  After some trial and error, I'll try these competencies:
  - Juror A (expert): 90% accurate
  - Juror B (mediocre): 70% accurate
  - Juror C (barely competent): 60% accurate

  Now to calculate majority accuracy. A correct majority requires:
  1. All three correct: (0.9)(0.7)(0.6) = 0.378
  2. A and B correct, C wrong: (0.9)(0.7)(0.4) = 0.252
  3. A and C correct, B wrong: (0.9)(0.3)(0.6) = 0.162
  4. B and C correct, A wrong: (0.1)(0.7)(0.6) = 0.042

  Summing cases 1,2,3: 0.378+0.252+0.162 = 0.792
  But wait—case 4 is incorrect majority. Total majority accuracy is cases 1+2+3 = 0.792? No: 
