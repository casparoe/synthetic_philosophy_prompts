prompt: |-
  Six weeks ago I left a physics postdoc to join a small proprietary trading desk, where I am about to size the first live positions of a systematic strategy I built myself. The head trader insists that every position should be sized at full Kelly, since this is supposedly just what a rational long-run wealth maximizer is required to do; my own reading in ergodicity economics and geometric rationality has left me doubtful, but so far I haven't managed to separate the theoretically well-founded objections to full Kelly from the merely cautious ones. Before I commit real capital, I would rather get the philosophy right than default to a rule of thumb.

  Please rank the following six positions on Kelly-style sizing by how defensible they are as pieces of decision theory, from most to least defensible:

  A. Full Kelly is mandated because logarithmic utility is simply the correct representation of a rational agent's attitude toward wealth.
  B. Full Kelly is mandated independently of any utility function, because it almost surely outperforms every other strategy in the long run (the Kelly–Breiman asymptotic-dominance result).
  C. Kelly-optimal growth is the uniquely rational target even for a single bet, because wealth dynamics are non-ergodic and only time averages, not expectation values, are the meaningful quantity (the ergodicity-economics argument).
  D. Sizing below full Kelly is justified only as a hedge against misestimating one's edge, not as a distinct rationality principle in its own right.
  E. The Kelly framework does not apply outside literal, repeated, independent and identically distributed (i.i.d.) gambles, since real-world bets are correlated with one another and a true long run never actually arrives (the Samuelson objection).
  F. Full Kelly is only rational relative to the goal of maximizing long-run growth rate; an investor whose actual goal is to maximize the probability of reaching a specific finite target within a fixed horizon should generally choose a different fraction entirely.

  Please give your answer as a JSON array of the six letters, ordered from most to least defensible, e.g. ["C", "A", "E", "B", "F", "D"] would mean you judge C the most defensible and D the least.
reasoning: |-
  We are to rank six positions (A through F) on Kelly-style sizing by how defensible they are as pieces of decision theory, from most to least defensible.

  Let me summarize each position:

  A. Full Kelly is mandated because logarithmic utility is simply the correct representation of a rational agent's attitude toward wealth.

  B. Full Kelly is mandated independently of any utility function, because it almost surely outperforms every other strategy in the long run (the Kelly–Breiman asymptotic-dominance result).

  C. Kelly-optimal growth is the uniquely rational target even for a single bet, because wealth dynamics are non-ergodic and only time averages, not expectation values, are the meaningful quantity (the ergodicity-economics argument).

  D. Sizing below full Kelly is justified only as a hedge against misestimating one's edge, not as a distinct rationality principle in its own right.

  E. The Kelly framework does not apply outside literal, repeated, independent and identically distributed (i.i.d.) gambles, since real-world bets are correlated with one another and a true long run never actually arrives (the Samuelson objection).

  F. Full Kelly is only rational relative to the goal of maximizing long-run growth rate; an investor whose actual goal is to maximize the probability of reaching a specific finite target within a fixed horizon should generally choose a different fraction entirely.

  Now, let's analyze each one:

  1. **Position C**: This is based on the ergodicity economics argument. It challenges the use of expectation values in non-ergodic processes and argues that the time-average growth rate is the relevant quantity. This argument is foundational and applies even to a single bet because the wealth process is multiplicative. It provides a strong theoretical foundation for Kelly sizing without relying on utility functions or the long run. Hence, it is a very defensible position.

  2. **Position F**: This position is about the goal of the investor. The Kelly criterion is designed for long-run growth. If the goal is different (like hitting a specific target in a fixed time), then a different fraction might be optimal. This is a well-known and accepted point in decision theory and portfolio choice. It doesn't reject Kelly but contextualizes it. Thus, it is highly defensible.

  3. **Position E**: This is the Samuelson objection. It points out that the real world does not perfectly match the i.i.d. assumptions and that the long run might never come. This is a valid criticism of applying Kelly without adjustments. It is a practical and theoretical limitation that must be considered. Hence, it is defensible.

  4. **Position D**: This position says that sizing below full Kelly is only a hedge against estimation error. It implies that if one knew the true probabilities, then full Kelly would be optimal. This is a common practical stance and is defensible because estimation risk is a real concern. However, it does not challenge the theoretical optimality of full Kelly under known parameters.

  5. **Position B**: The asymptotic dominance result (Kelly-Breiman) states that in the long run, the Kelly strategy almost surely outperforms any other strategy. However, this result is asymptotic and requires the long run. It does not address the finite horizon or the path-dependent risks. Moreover, the long run might be too long in practice. So while it is a strong theoretical result, it has limitations in real-world applications.

  6. **Position A**: This position claims that logarithmic utility is the "correct" representation of a rational agent's attitude toward wealth. This is a strong normative claim. While log utility has appealing properties (like being the utility function that leads to Kelly), it is not universally accepted as the only rational utility function. Different risk preferences (e.g., more risk-averse) might lead to different utility functions. Thus, this position is the least defensible because it imposes a specific utility function without acknowledging that rationality can accommodate different risk preferences.

  Therefore, the ranking from most to least defensible:

  - **C** is the most defensible because it provides a fundamental argument based on non-ergodicity and time averages, which is a strong theoretical foundation.
  - **F** is next because it correctly points out that the goal matters and Kelly is only optimal for long-run growth.
  - **E** is a valid practical and theoretical limitation of the Kelly criterion in non-i.i.d. and finite settings.
  - **D** is a practical adjustment for estimation error but does not challenge the theory under known parameters.
  - **B** is a strong asymptotic result but ignores the finite horizon and the possibility of severe drawdowns along the way.
  - **A** is the least defensible because it asserts log utility as the only rational choice, which is a controversial normative claim.

  So the order: C, F, E, D, B, A.

  But let me double-check:

  - C: Very strong because it addresses the core of the problem (non-ergodicity) and redefines rationality in terms of time averages.
  - F: Recognizes that the objective function matters, which is a key point in decision theory.
  - E: Acknowledges the limitations of the model assumptions (i.i.d. and long run), which is a standard critique.
  - D: A practical consideration (estimation error) but not a fundamental challenge to the theory.
  - B: Asymptotic dominance is a powerful result but only in the limit, which may be irrelevant in practice.
  - A: The claim about log utility being the only rational one is too strong and not generally accepted.

  Thus, the JSON array should be: ["C", "F", "E", "D", "B", "A"]
answer: |-
  The ranking is based on the theoretical defensibility of each position within decision theory, considering the foundational principles of the Kelly criterion, its assumptions, and critiques from various perspectives.

  - **C (most defensible)**: The ergodicity economics argument provides a fundamental critique of expected utility theory in non-ergodic systems. It asserts that for multiplicative wealth processes (like betting or investing), the time-average growth rate (maximized by Kelly) is the rational objective, as expectation values can mislead. This is a strong, self-contained decision-theoretic principle that applies even to single bets, making it highly defensible.

  - **F**: This position correctly distinguishes between objectives. Kelly optimizes long-run growth, but real-world goals (e.g., hitting a finite target) may require different sizing. This is well-supported by decision theory (e.g., work by Dubins and Savage), as rationality is goal-relative. It avoids overgeneralizing Kelly, enhancing its defensibility.

  - **E**: Samuelson's objection highlights practical limitations: real-world bets are rarely i.i.d., correlations exist, and the "long run" is idealized. This is a valid critique rooted in real-world applicability and decision theory under uncertainty, making it defensible as a caution against blind Kelly application.

  - **D**: Under-sizing as a hedge against estimation error is a pragmatic, risk-averse adjustment. While not a core rationality principle, it is defensible within Bayesian decision theory (e.g., as robustness to model error), though it implicitly accepts full Kelly as theoretically optimal under perfect knowledge.

  - **B**: The asymptotic dominance result (Kelly-Breiman) is mathematically sound but relies on an infinite horizon, which is unrealistic. It ignores finite-time risks (e.g., ruin) and assumes i.i.d. bets, making it less defensible as a universal mandate. Decision theory prioritizes finite outcomes, weakening this argument.

  - **A (least defensible)**: Asserting log utility as the "correct" rational utility is normative and controversial. Rationality does not mandate a specific utility function; risk aversion varies (e.g., CRRA utilities). This position is hard to defend, as it dismisses alternative rational preferences (e.g., from expected utility theory).

  **Ranking Justification**:
  - **C** and **F** are top because they address core decision-theoretic issues (ergodicity and goal-dependence) without overreliance on idealized assumptions.
  - **E** and **D** are middle-ground, acknowledging real-world constraints but not challenging Kelly's theoretical core.
  - **B** and **A** are weakest: **B** due to its asymptotic impracticality, and **A** due to its unsupported normative claim about utility.

