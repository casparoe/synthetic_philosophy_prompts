prompt: |-
  So a handful of us who've spent way too many years reading LessWrong / Overcoming Bias / the MIRI technical reports finally started an actual reading group this year, working through the old decision theory stuff -- Wei Dai's updateless posts, Yudkowsky's TDT writeup, the FDT paper, all of it. To keep ourselves honest we set each other little problem sets after each session instead of just nodding along like we understood everything. I got stuck grading this weeks submission from one of the guys in the group, and honestly I don't fully trust my own grip on this material enough to just eyeball it and slap a grade on it, so I want a second, more careful opinion before I hand it back to him.

  The question I wrote was:

  Consider the counterfactual mugging. Omega flips a fair coin. If it lands heads, Omega gives you $10,000 iff Omega predicted that you would pay Omega $100 had the coin landed tails. If it lands tails, Omega simply asks you to pay $100. Assume Omega is a perfect predictor.
  (a) What does an updateless decision theory (UDT) agent do upon learning the coin landed tails, and why? [5 pts]
  (b) Absent any prior commitment device, why do causal decision theory (CDT) and evidential decision theory (EDT) both decline to pay at that point, in contrast to UDT? [5 pts]
  (c) UDT is also said to one-box in Newcomb's problem. Explain the reasoning UDT uses to reach that verdict, and note how (if at all) it differs from the reasoning that leads EDT to one-box. [5 pts]

  And here's what he sent back:

  Updateless decision theory (UDT), which Eliezer Yudkowsky introduced on LessWrong as a refinement of his earlier timeless decision theory (TDT), rejects the idea that a rational agent should condition its decision on whatever it has already observed. Instead, an updateless agent commits in advance to the policy -- a full mapping from possible observations to actions -- that has the highest expected utility according to its prior, and then just executes whatever that policy says once it actually makes an observation.

  (a) In the counterfactual mugging, before the coin is flipped the two candidate policies are "pay if asked" and "refuse if asked." Paying nets an expected value of 0.5(10,000) + 0.5(-100) = $4,950, versus $0 for refusing, so the optimal policy is to pay. A UDT agent therefore pays the $100 even after learning the coin came up tails, because it is simply following through on the policy that was already optimal from the point of view of its prior -- it doesn't re-derive the decision in light of the new information.

  (b) CDT and EDT, applied without any prior commitment, will not pay. CDT reasons that the coin flip is already settled and paying now cannot causally influence a coin that landed in the past, so paying is a pure loss. EDT reasons similarly here, since the coin is exogenous and uncorrelated with anything else about the agent, so learning "tails" plus choosing to pay gives no evidence of any compensating benefit -- the heads-branch payout is simply not on the table anymore. Both would therefore have liked to commit to paying beforehand (since that has higher ex ante value) but renege once they're actually in the tails branch. This is exactly the dynamic inconsistency UDT is built to avoid: since Omega is a perfect predictor, it's really your willingness to pay in the tails-branch that causes Omega to have put you in a position to win the $10,000 in the heads-branch back when the coin was flipped.

  (c) UDT one-boxes in Newcomb's problem for a similar "evaluate the whole policy against the prior" reason: given a highly accurate predictor, the ex ante expected value of the one-boxing policy (~$1,000,000, weighted by predictor accuracy) exceeds that of the two-boxing policy (~$1,000 plus a small chance of the extra million), so UDT commits to one-boxing and just does it. EDT also one-boxes, but for a related-but-distinct reason: EDT conditions on its own act as evidence, so choosing to one-box is treated as evidence that Omega predicted one-boxing and filled box B, making one-boxing look better in conditional expectation. CDT two-boxes because it treats the contents of box B as causally fixed by the time you choose, so two-boxing dominates -- you get whatever is in B either way, plus the extra $1,000 from box A -- and CDT has no way to let the correlation between prediction and action count in its favor.

  Can you grade this out of 15 and go through it point by point -- I want the actual sentences or claims that earned or cost points, not just a vibe. A letter grade on top of the numeric one would be nice too. And since you're good at this sort of thing, could you format the whole verdict as JSON, something like {"part_a": {"points": ..., "comment": ...}, "part_b": {...}, "part_c": {...}, "total": ..., "letter_grade": ...}? Don't go easy on it -- I'd rather have accurate, specific feedback than a generous read.
reasoning: |-
  Okay, let me carefully evaluate this submission for the decision theory problem set. The student's answers need to be checked against the core concepts of UDT, CDT and EDT across three scenarios.

  Starting with part (a) on counterfactual mugging: The student correctly identifies that UDT evaluates policies ex ante and commits to "pay if asked", calculating the expected utility accurately as $4,950 vs $0. They properly explain that UDT executes this pre-committed policy upon observing tails without re-deriving the decision. This demonstrates solid understanding of updatelessness. Full marks here.

  For part (b): The CDT explanation is perfect - correctly noting the causal separation and past coin flip. The EDT explanation is also correct about lack of evidential benefit after observation. But the student makes a critical error by claiming both CDT/EDT would want to commit ex ante - this is only true for EDT (due to acausal correlations), while CDT would actually reject commitment since it sees no causal benefit. Missing this distinction costs points.

  In part (c): The UDT explanation is flawless - policy-based commitment and prior evaluation. The EDT comparison is correctly distinguished through evidential reasoning. However, the student slips by implying EDT's evidential mechanism is "distinct" from UDT's policy reasoning without clarifying that both lead to one-boxing but for fundamentally different reasons. Minor deduction.

  The student shows strong grasp overall but has specific correctable misunderstandings in (b) and (c). The numerical breakdown will reflect these nuances while acknowledging the quality of writing and conceptual command.
