  First, I should recall the technical frame problem. McCarthy and Hayes were working on situation calculus, where each action changes only some fluents. The challenge was efficiently stating what doesn't change without listing all frame axioms. Solutions like successor-state axioms or circumscription help by using non-monotonic logic. This seems manageable within formal systems.

  Then there's Dennett's take. His robots in "Cognitive Wheels" fail due to relevance blindness—not knowing which facts to consider or ignore. This points to a bigger issue: how any bounded rational agent handles relevance in real-world contexts. It's not just about representation but about cognition and common sense.

