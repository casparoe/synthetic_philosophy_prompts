answer: |-
  Here’s the scene—dialogue-driven, philosophically rigorous, and layered with marital tension. I’ve anchored it in contemporary metaethical debates (Blackburn, Schroeder, etc.) while keeping it natural for dinner-table sparring:

  ---

  **INT. KITCHEN - NIGHT**  

  Rain taps the window. ELARA (40s, sharp-eyed, gesturing with a forkful of roasted beet) and MARCUS (40s, steepling his fingers over his empty plate) face each other across a worn oak table. A half-finished bottle of Malbec sits between them.  

  **MARCUS**  
  *(Leaning in, voice deceptively calm)*  
  ...So take your position: "Cheating on your taxes is wrong." That’s not describing some moral fact out there, right? It’s just you *booing* the action. Expressing disapproval.  

  **ELARA**  
  *(Nods, unfazed)*  
  Correct. It’s a conative attitude. Like shouting "Down with taxes!" but more nuanced.  

  **MARCUS**  
  *(Tapping the table)*  
  Fine. Now: *If* cheating on your taxes is wrong, *then* getting your accountant to help you cheat is wrong. You accept that conditional?  

  **ELARA**  
  Obviously. The attitude extends to enabling.  

  **MARCUS**  
  *(Pressing, relentless)*  
  And you accept the antecedent? "Cheating on your taxes *is* wrong."  

  **ELARA**  
  Marcus, I literally wrote the paper on tax evasion as collective bad faith. Yes.  

  **MARCUS**  
  *(Spreading his hands)*  
  Then by modus ponens: Getting your accountant to help is wrong. But *your* premises are just attitudes—boos and hisses. How do attitudes *entail* another attitude? Logic binds propositions. Truth-apt things. Not... emotional noises.  

  *Elara sets down her fork. A beat. She swirls her wine, eyes narrowing—not in anger, but focus.*  

  **ELARA**  
  You always skip the scaffolding, love. It’s not *just* an attitude. It’s an attitude *held within a framework of commitment*. When I say "Cheating is wrong," I’m committing to *blaming* anyone who cheats. When I say "If cheating is wrong, then getting your accountant to help is wrong," I’m committing to blaming anyone who *doesn’t* blame enablers if they blame cheaters.  

  **MARCUS**  
  *(Eyes gleaming)*  
  Ah, the higher-order attitude dance. So "P" expresses attitude A. "If P, then Q" expresses... what? Attitude B about having attitude A and attitude C?  

  **ELARA**  
  *(Pointing at him)*  
  Exactly. Accepting the conditional is *commitment to consistency*: If I have the blame-attitude toward cheating, I *must* have it toward enabling. The logic isn’t in the propositions-as-truths. It’s in the *structure of the commitments themselves*. I can’t hold Attitude A and accept the conditional without holding Attitude C. Contradiction lives in the will.  

  *Marcus leans back, impressed but unyielding. He tops off both their glasses.*  

  **MARCUS**  
  Clever. Truly. Blackburn’s finest. But here’s where your quasi-realism strains: That "must." You say I *must* adopt Attitude C to be consistent? Fine. But *why* must I be consistent?  

  *Elara pauses, glass halfway to her lips.*  

  **MARCUS (CONT'D)**  
  *(Softer, lethal)*  
  If morality is just our projected attitudes, why is *logical coherence* between them obligatory? Truth-preserving logic *demands* consistency because truth can’t contradict itself. But if I’m just managing *my* feelings? Maybe I’m happy blaming tax cheats but shrugging at enablers. Your "contradiction" isn’t in the world—it’s just you disliking my emotional messiness. Where’s the *normative grip*?  

  *Silence. The rain hammers the glass. Elara’s knuckles whiten on her stemware. Marcus hasn’t repeated himself—he’s pushed her solution to its meta-level crisis: Can expressivism ground the authority of logic itself?*  

  **ELARA**  
  *(Quietly intense)*  
  You think cognitivism escapes that? If "wrong" is a property like... like *mass*, fine—but show me its causal signature. Show me how *you* know your moral facts aren’t just *your* attitudes in realist drag.  

  **MARCUS**  
  *(Spreading his hands)*  
  Oh, I can’t. But I’m not the one trying to reconstruct logic from emotive grunts. You quasi-realists want to *mimic* truth so well it becomes truth. But mimicry needs a purpose. Why mimic *this* structure?  

  *They lock eyes. The argument hangs, unresolved—a familiar, intimate stalemate.*  

  ---  

  **Philosophical Anchors:**  
  1. **Elara’s Defense:** Paraphrases Blackburn’s solution—moral conditionals express higher-order attitudes about the consistency of first-order attitudes (e.g., *Spreading the Word*).  
  2. **Marcus’s Counter:** Targets the normative foundation of logical constraints. Schroeder (*Being For*) and Dreier ("Another World") press this: Why *must* we be logically coherent if morality is attitude-dependent?  
  3. **Subtext:** Their clash mirrors deeper tensions—her embrace of fluidity vs. his craving for foundations; their marriage’s own unspoken "commitments."  

  **Word Count:** 498. Let me know if you’d like sharper barbs or more physical tension!
