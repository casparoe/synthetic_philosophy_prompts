  **Key Insights**:  
  - **IESDS/rationalizability** need only CKR and iterative reasoning.  
  - **Nash** adds correct beliefs about opponents.  
  - **Correlated equilibrium** further requires a shared prior.  
  - **Backward induction** demands unwavering belief in rationality, creating logical paradoxes.  
  The empty Tier 4 highlights the steep jump to backward induction’s extreme assumptions.
