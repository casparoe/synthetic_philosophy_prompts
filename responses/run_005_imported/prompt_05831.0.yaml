  2. Rationalizability
  3. Nash equilibrium
  4. Correlated equilibrium
  5. Backward induction in finite games of perfect information

  Let's analyze each:

  1. **IESDS (survival)**: This requires that players are rational (they don't play strictly dominated strategies) and that there is common knowledge of rationality. Moreover, because strict domination is strong (the dominated strategy is always worse, no matter what others do), the elimination process is robust. However, note that IESDS does not require the players to have correct beliefs about others' strategies beyond the fact that they are rational and that they also eliminate dominated strategies. The assumption is relatively weak and uncontroversial because it only uses the fact that players won't play strategies that are never best responses.

  2. **Rationalizability**: A strategy is rationalizable if it is a best response to some belief about the opponents' strategies, and these beliefs are themselves rationalizable (i.e., they are in the set of strategies that survive iterative removal of strategies that are never best responses). This is very similar to IESDS in the sense that it relies on common knowledge of rationality and the iterative process of removing strategies that are never best responses. In fact, in games with two players, rationalizability and IESDS coincide when we consider strict dominance and best responses. However, in general, rationalizability might be considered a bit more permissive because it allows for correlated beliefs (in the original Pearce version, but note that for more than two players, there are differences). But in terms of the CKR assumption, it is similar to IESDS. Both require common knowledge of rationality and the iterative reasoning process.

  3. **Nash equilibrium**: In a Nash equilibrium, every player's strategy is a best response to the actual strategies of the others. To justify Nash equilibrium, we need not only common knowledge of rationality but also that players have correct beliefs about what others will do. This is a stronger requirement because it adds a coordination of beliefs. Common knowledge of rationality alone does not imply that players will have correct expectations about others' play. So we need common knowledge of the equilibrium strategies (or at least that players' beliefs are correct). This is more demanding and controversial because it requires that players' beliefs are exactly in equilibrium.

  4. **Correlated equilibrium**: In Aumann's correlated equilibrium, players receive signals from a common source (a correlating device) and play according to a recommended strategy that is optimal given the signal and the fact that others follow their recommendations. The common prior assumption is crucial: there is a common prior over the state space that determines the signals. Moreover, common knowledge of rationality is assumed (each player is rational given their information). The common prior is an additional assumption beyond what is needed for Nash. This is because in Nash, the players' strategies are independent, while in correlated equilibrium, they can be correlated via the device. The common prior assumption is strong and controversial because it requires that all players interpret the correlating device in the same way (they share the same prior distribution). So this is stronger than Nash.

  5. **Backward induction (BI)**: In finite games of perfect information (like the centipede game), backward induction leads to a unique outcome (if there are no ties). Aumann argued that common knowledge of rationality implies the BI outcome. However, this is highly controversial because at an off-equilibrium node (where a player is supposed to move but according to BI they shouldn't reach that node), the player must still believe that the opponent is rational. But if the opponent was rational, they wouldn't have taken the action that led to that node. This leads to a contradiction. Therefore, to justify BI, we need not only common knowledge of rationality but also that players maintain the belief in rationality even after observing an irrational move (or that the game is in a counterfactual state). This is a very strong assumption and is often criticized as being too demanding and even logically inconsistent. Hence, it is the strongest and most contested.

