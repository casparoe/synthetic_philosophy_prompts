answer: |-
  ### Ranking of Solution Concepts by Strength of Common Knowledge of Rationality (CKR) Assumptions

  The ranking below orders the five concepts from the weakest/most defensible CKR-style assumptions to the strongest/most contested, based on the epistemic conditions required for justification. Tiers are defined by the "cost" of assumptions—strength, controversy, and auxiliary requirements (e.g., common priors, correct beliefs, off-equilibrium consistency).

  #### **Tier 1 (Weakest Assumption): Survival under IESDS and Rationalizability**  
  - **Justification**: Both rely **solely** on common knowledge of rationality (CKR) and iterative reasoning. No assumptions about opponents' actual strategies or beliefs are needed—only that players avoid strategies that are never best responses (rationalizability) or strictly dominated (IESDS). These are the least controversial, as they require minimal epistemic conditions and align with individual rationality under uncertainty.

  #### **Tier 2: Nash Equilibrium**  
  - **Justification**: Requires CKR **plus** common knowledge of the game and **correct beliefs about opponents' strategies**. Players must not only be rational but also accurately predict others' actions. This introduces "equilibrium beliefs," which are stronger than IESDS/rationalizability and often require unrealistic coordination of expectations.

  #### **Tier 3: Correlated Equilibrium**  
  - **Justification**: Builds on CKR but **adds a common prior** over a shared correlating device (e.g., a public signal). Players obey recommendations if they believe others will too, but the common prior assumption is controversial—it implies identical Bayesian priors across all players, which is epistemically demanding and rarely justified in heterogeneous groups.

  #### **Tier 4: (Empty)**  
  - *No concept fits here. This tier is skipped to emphasize the gap between correlated equilibrium and backward induction.*

  #### **Tier 5 (Strongest Assumption): Backward-Induction Outcome**  
  - **Justification**: Requires CKR **plus belief in rationality at every node, even after irrational moves**. This is hotly contested (e.g., in the centipede game) because it demands players maintain faith in opponents' rationality after observing irrational behavior—a logical inconsistency. Aumann’s argument is seen as tautological or impossible to satisfy, making this the most extreme assumption.

