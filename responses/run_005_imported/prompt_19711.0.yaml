  Theo argues that SSA can also produce arbitrarily large shifts with extreme hypothesis comparisons. This seems technically correct but misleading - in standard Doomsday, the shift is bounded, while SIA's presumption is inherently unbounded. I'll score this lower.

  Both miss deeper issues like the reference class problem - how we define "observers" affects both assumptions. Also, SSA's shift depends on your birth rank position, while SIA's is purely theory-driven. The tension between first-person perspectives and objective evidence remains unresolved.

