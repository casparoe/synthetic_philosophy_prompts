prompt: |-
  I'm currently taking a philosophy seminar on risk and rationality, and an experience from a few weeks ago has stayed with me. I had signed up for a paid decision-making study run by the economics department, and near the start of the session I was offered a choice between (a) a guaranteed $12, or (b) a coin flip paying $28 on heads and nothing on tails. I chose the guaranteed $12, even though the average payout of (b) works out to $14, and I'm fairly confident I'd choose the same way if offered the choice again. When I described the episode to a friend who's majoring in economics, she argued that my choice can't be explained by the usual reason people prefer sure things over gambles -- namely, that an additional dollar matters less to you the more of it you already have -- since $12 and $28 are both trivial sums for either of us and wouldn't change anything about our lives either way. On her view, this means I simply reasoned badly: I gave up money in expectation for no good reason. I don't feel that I made a mistake, but I can't quite say why her argument fails, if it does. Was I being irrational, or is there a legitimate way of defending a preference like mine that her argument overlooks?
reasoning: |-
  Okay, the user is grappling with a decision they made in a study where they chose a guaranteed $12 over a 50% chance of $28 or nothing. Their economics friend argues that since both amounts are trivial, the standard diminishing marginal utility explanation doesn't apply, making their choice irrational. The user doesn't feel it was a mistake but can't articulate why.

  First, I need to recall expected utility theory versus expected value. Expected value is straightforward: 50% of $28 is $14, which is more than $12. But expected utility theory incorporates personal utility functions. Even small amounts can have non-linear utility for someone. The user might derive more utility from certainty itself, which isn't captured by monetary value alone.

  The friend's argument assumes that utility is linear with money for trivial sums. But is that always true? For example, getting $0 might feel worse than the positive feeling of $28. Loss aversion could be at play here. Even though it's a gain frame, the possibility of getting nothing might trigger a fear of loss. Prospect theory shows people overweigh small probabilities and value certainty. A sure $12 eliminates any chance of disappointment.

  Also, transaction costs. The user mentioned it was a paid study. If the coin flip took more time or mental effort, choosing the sure thing saves cognitive resources. They might prefer to avoid the small hassle or the emotional letdown if they get tails. 

  Context matters too. The user is in a philosophy seminar on risk and rationality. They might be primed to think about decisions beyond pure economics. Their preference could stem from a broader philosophical stance on risk-aversion as rational for them personally, even if not monetarily optimal. 

  The friend's view is rooted in classical economics where rationality is about maximizing expected monetary gain. But behavioral economics shows that human decisions include psychological factors. The user's choice reflects a utility function that values certainty and minimizes regret, which is rational under a broader definition. 

  The user might need validation that their preference is defensible. They might also want to understand the theoretical frameworks that explain their choice, to articulate it in their seminar. Highlighting concepts like risk aversion without wealth effects, loss aversion, and utility of certainty could help them defend their stance. 

  In essence, the friend's argument fails by ignoring non-monetary utilities and psychological factors. Rationality isn't solely about money; it's about maximizing overall satisfaction, which includes emotional and cognitive aspects.
answer: |-
  Your choice was **not irrational**, and your friend's argument overlooks several legitimate dimensions of rational decision-making. While her perspective aligns with a narrow economic model (expected value maximization), real-world rationality incorporates psychology, context, and individual values. Here's a defense of your preference:

  ### 1. **Risk Aversion Without Diminishing Marginal Utility**  
     Your friend is correct that diminishing marginal utility (DMU) typically explains risk aversion for larger sums (e.g., rejecting a 50% chance of $1M vs. $400K guaranteed). However, **risk aversion can exist independently of DMU** for small stakes:  
     - **Psychological certainty premium**: Humans often assign inherent value to certainty. Avoiding the possibility of disappointment ($0) may provide psychological comfort exceeding the $2 expected gain.  
     - **Regret minimization**: If tails lands, you’d regret not taking $12. The pain of regret might outweigh the pleasure of an extra $16 on heads.  
     - **Prospect Theory (Kahneman & Tversky)**: People overweight small probabilities of loss. Here, a 50% chance of *losing $12* (compared to the sure thing) may feel subjectively larger than 50%.

  ### 2. **The "Rationality" of Small-Stakes Risk Aversion**  
     Economists like Matthew Rabin proved that **consistent rejection of small favorable gambles can be rational** if:  
     - You face repeated similar choices (even unconsciously).  
     - You prioritize protecting against worst-case outcomes ("minimax regret").  
     In your case, rejecting a +$2 EV gamble is reasonable if you value stability—even for trivial sums.

  ### 3. **Contextual and Emotional Factors**  
     - **Decision fatigue**: In a study setting, conserving mental effort is rational. Opting for the sure thing avoids post-decision dissonance.  
     - **Framing**: The choice was between "$12 for sure" vs. "a gamble." Certainty-focused framing nudges people toward safe options.  
     - **Symbolic meaning**: $12 guaranteed might represent "a win" (e.g., coffee paid for), while $0 feels like a loss—activating loss aversion.

  ### 4. **Philosophical Defenses**  
     - **Satisficing (Herbert Simon)**: You don’t need to maximize; $12 met your threshold for "good enough."  
     - **Virtue ethics**: Prudence/temperance might favor avoiding unnecessary gambling, even for trivial gains.  
     - **Pragmatism**: If $12 vs. $14 won’t change your life, why tolerate uncertainty? "Picking up free $12" feels fundamentally different from "gambling for $14."

  ### Why Your Friend's Argument Fails:
  - **Assumes linear utility for small sums**: But utility isn’t purely monetary; it includes emotional and cognitive dimensions.  
  - **Ignores transaction costs**: The mental cost of processing regret or uncertainty has utility implications.  
  - **Overlooks revealed preference**: Your choice *reveals* that you value certainty at >$2—which is valid if consistent.  

  ### Conclusion
  You were **rational** under a broader, descriptively accurate model of human decision-making. Economics often uses idealized models, but real rationality incorporates subjective preferences, emotions, and context. Defend your choice confidently:  
  > *"I rationally prioritized certainty and emotional comfort over a trivial expected gain. My utility function values avoiding disappointment more than $2 in this context."*  

  This mirrors how people buy insurance (paying a premium to avoid loss) or choose fixed salaries over commissions. If your preference aligns with your values, it’s not a mistake—it’s **authentic rationality**.
