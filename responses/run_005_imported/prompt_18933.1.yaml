prompt: |-
  So I co-host a pretty low-key podcast with two friends from work — we mostly riff on AI stuff since it's basically eaten our whole job this year (I'm a backend engineer, we've bolted an LLM onto literally everything). Next episode's guest is a researcher who's spent something like six years building and stress-testing "debate" as an answer to the scalable oversight problem: two copies of a model argue opposite sides of a question in front of a judge that cant check the answer directly, on the theory that lying is harder to defend once you're being cross-questioned than telling the truth is. Her go-to move whenever someone brings up a failure mode is to say "that's a training problem, not a theory problem," and honestly it works on me every single time, so I want questions that make that answer harder for her to reach for.

  Could you write me like 8 or 9 questions that go past whatever version of this pitch everyone's already absorbed from the original blog post? I want at least one on the obfuscated-arguments failure mode, where the dishonest debater just buries the flaw somewhere too expensive for anyone (judge included) to cheaply locate — with a follow-up ready for when she says cross-examining earlier copies of the opponent takes care of it. One on the complexity-theory pitch behind all this (the comparison to PSPACE) and whether that result is actually load-bearing once you admit real trained models aren't playing anywhere near an optimal strategy. One on the fact that, from what I remember reading, early experiments with human judges on hard reading-comprehension questions found debate barely beat a single debater just trying to talk the judge into an answer, and it took later, different setups for debate to actually pull ahead — I want to know what she thinks changed. And at least one question that isn't about a failure mode at all but goes after the setup itself: if the judge can be persuaded at all, couldn't two sufficiently clever debaters both learn to flatter that same soft spot, so the whole scheme selects for persuasiveness over truth even when it's working exactly as designed? For each one, bake in the pushback she'll probably give and a sharp one-line follow-up, so I'm not just sitting there nodding when she gives the answer I already know is coming.
