prompt: |-
  I'm a PhD student in behavioral econ and got roped into serving on my lab's hiring committee for a new lab manager position. We've interviewed 4 of the 9 people who applied, and the most recent one was clearly the strongest so far by a good margin, but she just told us she has a competing offer and needs our answer within a week -- before we'd even get through the remaining 5 in the pool. Half the committee wants to make her the offer now, the other half wants to stick to the plan and see everyone first in case theres someone even better left, and honestly nobody has a principled reason for their side, they're just going with gut feeling, which drives me a little nuts given what I study for a living. Could you write the short memo I'd actually send round -- a real recommendation on whether we make her the offer now, plus a general rule we could reuse next time we're hiring -- and don't just split the difference: commit to a side, but take the strongest version of the other side's worry seriously too.
reasoning: |-
  Okay, let me approach this behavioral econ PhD student's problem systematically. They're stuck in a hiring committee deadlock where the strongest candidate so far has given a one-week deadline, but half the committee insists on interviewing all remaining candidates first. 

  Hmm... the core tension here is between exploitation (acting on current information) and exploration (gathering more information) - a classic problem in decision theory. The student wants a memo that resolves this with behavioral science principles, not just compromise. 

  First, I should acknowledge the valid concerns: rushing risks overlooking better candidates, but delaying risks losing the top candidate. The key is reframing "seeing everyone" as irrational when the marginal benefit is low. Since they've already interviewed 44% of the pool and found a standout, continuing has diminishing returns - especially given the search costs (time, missed deadlines).

  For the memo structure: opening should establish urgency, then present the exploitation argument with three pillars: 1) opportunity cost of continued search (her offer expiring), 2) low probability of improvement (only 5 candidates left when she's "clearly the strongest"), and 3) behavioral biases at play (like the planning fallacy in scheduling). 

  The rule proposal should prevent future deadlocks: set "circuit-breaker" thresholds upfront (e.g., if a candidate meets X criteria before interviews finish, we can accelerate). This turns a one-off dilemma into a replicable process. 

  Crucially, the tone must balance academic rigor with decisiveness - no hedging. I'll cite the exploration-exploitation literature implicitly rather than jargon. And since they study biases, I should highlight how "completeness bias" drives the "see everyone" instinct. 

  ...Wait, is the candidate truly exceptional or just relatively better? The memo should include a checklist: if she meets predefined qualifications AND exceeds expectations, waiting becomes irrational. That's the behavioral nudge - making inaction feel like the riskier choice.
answer: |-
  **MEMORANDUM**  
  To: Lab Hiring Committee  
  From: [Your Name], PhD Candidate, Behavioral Economics  
  Date: October 26, 2023  
  Subject: **Urgent Recommendation: Offer to Current Top Candidate + Protocol for Future Hiring**  

  ### Recommendation: Make the Offer Now  
  **We should extend an offer to the leading candidate immediately**, despite not completing all interviews. This is not a concession to pressure but a rational response to the following:  

  1. **Diminishing Marginal Returns of Continued Search**:  
     We have observed 4 candidates (44% of the pool). Our leading candidate is described as "clearly the strongest by a good margin." The probability of finding a *significantly* stronger candidate in the remaining 55% is low, while the cost of losing her is high (opportunity cost of restarting the search, time delays, and potential settlement for a weaker candidate).  

  2. **The Competitor Offer as a Signal**:  
     Her competing offer validates her quality (market confirmation bias). If she is our best option *now*, delaying risks losing her for a hypothetical "better" candidate who may not exist.  

  3. **Behavioral Pitfalls in "Completion Bias"**:  
     Insisting on interviewing all candidates reflects **completion bias**—the irrational urge to finish a pre-set process despite new information. We are not obligated to maximize all options if a dominant choice emerges early (see: *optimal stopping theory*).  

  ---

  ### Addressing the Counterargument Seriously  
  The strongest worry from the "wait" camp: *"What if a perfect candidate remains in the untested pool?"*  

  **This is valid—but mitigable**:  
  - **Solution 1**: Contact remaining candidates to fast-track interviews within 48 hours. If none immediately rival our top candidate (based on CVs/pre-screens), proceed with her offer.  
  - **Solution 2**: Include a **48-hour "exploding offer" clause** in her contract. This preserves our option to continue interviewing while securing her. If we find a stronger candidate, we withdraw (ethically, with compensation for her time).  
  - **Solution 3**: If she declines, we retain the remaining pool and reopen applications. The marginal cost of re-listing is lower than losing her.  

  ---

  ### Proposed General Rule for Future Hires  
  To prevent deadlock, adopt this protocol:  
  > **"Circuit-Breaker Rule"**:  
  > 1. Before interviews, define a **threshold score** (e.g., skills/experience metrics) for an "exceptional" candidate.  
  > 2. If any candidate *exceeds* this threshold by >20% *and* has a competing offer/urgency, the committee **must** vote within 24 hours on an immediate offer.  
  > 3. If the vote is split, the default is to **offer immediately** unless >60% of the committee vetoes.  
  > *Rationale*: Balances rigor with decisiveness, leveraging precommitment to override present bias and sunk-cost fallacies.  

  ---

  **Conclusion**: Acting now aligns with evidence-based efficiency. The risk of losing a known top performer outweighs the unlikely upside of an unseen candidate. I move to draft the offer today with a 48-hour expiration clause.  

  *Appendices*:  
  - [Optional] Brief literature summary: Simons et al. (2006) on search costs; Bearden (2006) on optimal stopping.  
  - Risk matrix comparing "offer now" vs. "wait" scenarios.  

  // Signed //  
  [Your Name]  

  ---  
  **Key Behavioral Principles Embedded**:  
  - **Opportunity Cost Neglect**: The "wait" group undervalues the cost of losing the top candidate.  
  - **Probability Weighting**: Humans overestimate small probabilities (e.g., "a perfect candidate might be left!").  
  - **Precommitment**: The "Circuit-Breaker Rule" binds future decisions to avoid time-inconsistent preferences.  
  *This memo commits to a side but elevates the debate beyond intuition.*
