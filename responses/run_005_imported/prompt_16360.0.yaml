answer: |-
  You've nailed the core tension: Aquinas's epistemology fundamentally clashes with Gödel's methodology, making his rejection of Gödel's proof *more* profound than his rejection of Anselm's. Here's how Aquinas would dissect Gödel's machinery and why his objections would land decisively:

  **Aquinas's Core Objections to Anselm (Relevant to Gödel):**

  1.  **No Self-Evidence to Humans:** Aquinas argued that while "God exists" might be self-evident *in itself* (because God's essence *is* existence), it is *not* self-evident *to us*. We cannot grasp God's essence directly. We start from effects in the world and reason backwards to the cause (ST I, Q2, A1).
  2.  **Existence is Not a Predicate (Proto-Kantian):** Aquinas held that existence is the actuality of an essence, not a defining property *within* the essence itself. Saying "God exists" isn't adding a property like "omniscient" to the concept; it's asserting that the concept has an instance in reality. We cannot deduce real existence merely from analyzing a concept, no matter how grand (ST I, Q2, A1, ad 2; SCG I, 10-11).
  3.  **Conceptual Limits:** Our concept of "God" is derived from creatures via analogy and negation. We cannot form a complete, positive conception of God's essence that would allow an a priori proof. Any definition we use (like "that than which nothing greater can be conceived" or "being possessing all positive properties") is fundamentally inadequate and derived a posteriori.

  **Gödel's Machinery & Aquinas's Response:**

  1.  **"Positive Properties" (Axiom 1 & Definition 1):** Gödel defines God as possessing *all* positive properties and assumes positivity is consistent and non-empty.
      *   **Aquinas's Attack:** This is the Achilles' heel for Aquinas. He would argue this definition is *utterly arbitrary and epistemologically inaccessible* to humans.
          *   **Arbitrariness:** What makes a property "positive"? Is "being material" positive? "Being mutable"? "Being finite"? Gödel provides no objective, non-circular criterion. Aquinas would see this as projecting human, creaturely values onto the divine. Our judgments of "positive" are derived from our experience of created goods, not from knowledge of the divine essence.
          *   **Inaccessibility:** We simply cannot know what the full set of "positive properties" applicable to a transcendent God *is*. Our understanding of properties is based on finite beings. Applying this set to define God is, for Aquinas, starting from a concept we cannot adequately form or validate. It's building the proof on sand.

  2.  **Necessary Existence as a Positive Property (Axiom 5):** This is crucial: Gödel asserts that necessary existence (existing in all possible worlds) is itself a positive property.
      *   **Aquinas's Attack:** Aquinas would see this as a classic case of begging the question and violating his core principle that existence isn't a predicate *within* the essence.
          *   **Circularity:** Including "necessary existence" within the definition of the being *whose existence you are trying to prove* smuggles in the conclusion. For Aquinas, existence is the *act* of the essence, not part of its definition. Defining God *as* "the being that necessarily exists" assumes the very thing needing proof.
          *   **Existence ≠ Property:** Aquinas would reiterate: even "necessary existence" is not a property *like* goodness or power. It's the mode of being that *follows* from possessing an essence that cannot not exist. But we can only know *that* God necessarily exists *after* we've proven his existence via his effects (e.g., the Five Ways), not by defining it into the concept upfront.

  3.  **The Modal Leap (S5: Possibly Necessary → Necessary):** Gödel argues that if it's *possible* that a God-like being (possessing all positive properties, including necessary existence) exists, then it *must* exist necessarily.
      *   **Aquinas's Attack:** Aquinas wouldn't necessarily dispute the S5 modal logic itself *in abstracto*. His attack focuses entirely on the *premise*.
          *   **Unjustified Possibility:** How do we *know* that the existence of a being defined as possessing all positive properties (including necessary existence) is *possible*? Aquinas would argue we have *no way* of knowing this a priori. Our knowledge of possibility is grounded in our knowledge of actuality and causality in the created world. Asserting the mere possibility of this specific, maximally defined being is just as inaccessible and unjustified as asserting its actual existence based on the definition alone. It's an unwarranted assumption required to make the modal logic work.

  4.  **Modal Collapse (The Implied Disaster):** You correctly identify this as a major technical problem. If Gödel's axioms are accepted, they imply that *all* truths are necessary truths (since God's necessary existence and essential properties would ground everything). Contingency vanishes.
      *   **Aquinas's Attack:** Aquinas wouldn't just see this as a "technical flaw" to be patched; he would see it as *fatal confirmation* that the entire approach is metaphysically bankrupt.
          *   **Contingency is Real:** Aquinas's entire metaphysics, theology, and understanding of divine providence *depends* on the real distinction between necessary and contingent beings/events. Creatures *are* contingent. Free will acts *are* contingent. The world didn't *have* to be this way. Modal collapse obliterates this fundamental aspect of reality as Aquinas understands it.
          *   **Proof of Conceptual Error:** For Aquinas, the fact that Gödel's axioms lead to modal collapse isn't just an inconvenience; it's *proof positive* that the initial axioms (especially the definition of God and "positive properties") are flawed and do not correspond to reality. It demonstrates that the conceptual starting point is incoherent when pushed to its logical conclusion.

  **Aquinas's Verdict on Gödel:**

  Aquinas would **forcefully and fundamentally reject Gödel's proof**, seeing it as a more sophisticated but ultimately more revealing iteration of Anselm's error. His objections wouldn't just "still land"; they would strike at the very heart of Gödel's construction:

  1.  **Epistemological Failure:** Gödel's proof relies on concepts ("positive properties," the "possibility" of the maximally great being) that humans cannot adequately form or justify a priori. It attempts a kind of conceptual ascent to God that Aquinas believes is impossible for finite, creaturely intellects starting from sense experience.
  2.  **Metaphysical Failure:** By treating "necessary existence" as a defining positive property within the divine essence *before* proving God's existence, Gödel commits the core error Aquinas identified: confusing the *act* of existence with a predicate. This leads directly to the absurdity of modal collapse, which contradicts the evident contingency of the world.
  3.  **Methodological Failure:** The proof attempts to deduce real, necessary existence purely from the analysis of a concept. For Aquinas, this is the wrong direction. We *must* start from the effects we observe in the world (motion, causation, contingency, gradation, order) and reason *a posteriori* to the existence and attributes of the First Cause (the Five Ways). Gödel's armchair approach, no matter how logically rigorous within its own system, is fundamentally disconnected from the only reliable source of knowledge about God's existence available to human reason.

  **In short:** Aquinas wouldn't be "forced to come up with a new angle." He would see Gödel's proof as making the *same fundamental mistake* as Anselm's, just dressed up in fancier (modal) logic. The core objections – the inadequacy of our concept of God, the illegitimacy of treating existence (even necessary existence) as a defining predicate, the impossibility of the a priori approach, and the reliance on an unjustified assertion of possibility – apply *more* devastatingly to Gödel's more complex system. The emergence of modal collapse would simply confirm to Aquinas that the entire conceptual edifice is built on quicksand. His verdict would be a resounding rejection, grounded in his core philosophical principles about human knowledge and the nature of existence itself.
