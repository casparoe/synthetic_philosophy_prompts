  The strongest objection might say: "The evidence only speaks about what happens in Red territory, so why should it affect the comparison between Red and Blue?" To counter this, I need to show that evidence constraining conditional probabilities can indirectly affect marginals through coherence requirements. When you fix P(A|B), it binds the ratio P(A∩B)/P(B). If your prior had a different ratio, fixing P(A|B) forces P(B) to adjust to maintain coherence with other beliefs.

