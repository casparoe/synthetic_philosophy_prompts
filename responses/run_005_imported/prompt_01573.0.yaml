answer: |-
  Let's untangle this philosophical bar brawl. Here's a precise breakdown of Galen Strawson's "Basic Argument," why determinism/indeterminism is irrelevant, the Nietzsche connection, and the crucial difference from his father, P.F. Strawson.

  **Galen Strawson's Basic Argument Against Moral Responsibility (Ultimate Responsibility):**

  Strawson targets *ultimate moral responsibility* – the idea that you can be *truly deserving* of praise or blame for your actions in a deep, foundational way. His core insight is that this requires being the *ultimate originator* of yourself, which is impossible. Here's the premise-by-premise structure:

  1.  **Premise 1 (P1):** You do what you do, and you are the way you are, *because* of the way you are. (Your character, preferences, motives, reasons, etc., determine your choices/actions).
  2.  **Premise 2 (P2):** To be *ultimately morally responsible* for what you do, you must be *ultimately morally responsible* for the way you are (at least in certain crucial mental respects relevant to choice).
      *   *Why?* If you're not responsible for *why* you have the specific motives/character that led to the action, how can you be *truly, ultimately* responsible for the action itself? Your actions flow from your constitution.
  3.  **Premise 3 (P3):** You cannot be *causa sui* (self-caused).
      *   *Why?* Creating yourself requires existing prior to yourself to do the creating, which is a logical absurdity. You can't choose your fundamental nature *before* you have a fundamental nature to make that choice.
  4.  **Premise 4 (P4):** Therefore (from P2 & P3), you cannot be ultimately morally responsible for the way you are.
  5.  **Premise 5 (P5):** Therefore (from P1 & P4), you cannot be ultimately morally responsible for what you do.

  **The "Causa Sui" Move & Why Determinism/Indeterminism Doesn't Matter:**

  *   **The Crucial Work:** The "causa sui" move (P3) is the **linchpin**. It shows that the demand of P2 (you must be responsible for how you are) is fundamentally impossible to satisfy *in principle*, regardless of the mechanics of the universe. This is why determinism vs. indeterminism is irrelevant:
      *   **Determinism:** If determinism is true, your character and choices are the inevitable result of prior causes (genetics, environment, etc.). You didn't *ultimately* choose those causes. You're not responsible for how you are. (P1, P2, P4, P5 hold).
      *   **Indeterminism:** Suppose indeterminism is true. Random events (quantum or otherwise) influence how you develop or even specific choices.
          *   **Option A (Randomness in Character Formation):** If indeterminism affects how you *become* the way you are (e.g., a random event shapes your personality), then that aspect of "how you are" isn't *your* doing. It's luck. You're not responsible for it.
          *   **Option B (Randomness in Choice):** If indeterminism injects randomness directly into a specific choice (e.g., your decision "just happens" randomly), then *that specific choice isn't determined by "the way you are"* (contradicting P1 slightly, but Strawson would argue the randomness doesn't help). A random choice isn't something *you* authored or controlled; it's *also* just luck. You didn't *make* it happen; it *happened to you*. You're still not the *ultimate source* of the choice.
      *   **The "Luck" Objection:** In *both* scenarios (deterministic chains or random events), the core factors determining "how you are" at any given moment – your genes, upbringing, formative experiences, *and* any random influences – are ultimately things for which you bear no responsibility. You didn't *choose* to be born with your specific potential, into your specific environment, or to have random events affect you. Therefore, you cannot be *ultimately responsible* for "the way you are" (P4), and hence not for what you do (P5). Indeterminism doesn't provide the *control* or *self-creation* needed to satisfy P2; it only adds randomness, which is antithetical to authorship. Only being *causa sui* could break this chain, and that's impossible.

  **The Nietzsche Connection:**

  *   **Your friend is RIGHT!** Strawson explicitly credits Nietzsche for the concept of *causa sui* as central to the problem of free will and responsibility. Nietzsche famously mocked the idea in *Beyond Good and Evil*:
      > "The causa sui is the best self-contradiction that has been conceived so far; it is a sort of rape and perversion of logic. But the extravagant pride of man has managed to entangle itself profoundly and frightfully with just this nonsense. The desire for 'freedom of the will' in the superlative metaphysical sense... the desire to bear the entire and ultimate responsibility for one's actions oneself, and to absolve God, the world, ancestors, chance, and society involves nothing less than to be precisely this *causa sui* and, with more than Munchausen temerity, to pull oneself up into existence by the hair, out of the swamps of nothingness."
  *   **Strawson's Use:** Strawson takes Nietzsche's critique of *causa sui* as logically absurd and builds his entire argument around showing that *ultimate moral responsibility requires precisely this impossible self-creation*. He agrees with Nietzsche that this conception of free will/responsibility is incoherent. So yes, there's a direct and important Nietzschean influence.

  **Galen vs. P.F. Strawson: Father vs. Son, Opposite Shores**

  *   **P.F. Strawson (Father):** In his seminal paper **"Freedom and Resentment" (1962)**, P.F. Strawson argues for **compatibilism** (free will/moral responsibility *is* compatible with determinism), but he does it in a revolutionary way. He shifts the focus away from metaphysics (determinism vs. indeterminism, causa sui) and towards **human psychology and social practices**.
      *   **His Core Argument:** Our practices of holding people morally responsible (blaming, praising, feeling resentment, gratitude, etc.) are not *based* on some metaphysical belief in contra-causal freedom or being *causa sui*. They are rooted in our natural, non-optional **"reactive attitudes."** These attitudes (like resentment when harmed) are fundamental parts of human interpersonal relationships.
      *   **Why Determinism Doesn't Undermine This:** Even if determinism is true, we *still* naturally feel these reactive attitudes towards others in ordinary circumstances. We only suspend them (e.g., see someone as "object" rather than "person") in specific excusing conditions (insanity, extreme coercion, childhood) – not because we discover determinism is true, but because the agent wasn't functioning as a normal participant in interpersonal relationships *in that specific way*.
      *   **Conclusion:** The *truth* of determinism is irrelevant to the *practice* of moral responsibility because the practice is grounded in our emotional responses and social nature, not in a metaphysical fiction. We can't *reason* ourselves out of these attitudes; they define our form of life. **He defends a *form* of moral responsibility based on participation in the human community, rejecting the need for ultimate responsibility.**

  *   **Galen Strawson (Son):** Galen directly attacks the very possibility of the *kind* of moral responsibility his father's reactive attitudes *presume* we have. He argues:
      1.  P.F.'s reactive attitudes *do* implicitly rely on a belief in *some* form of ultimate responsibility/true desert. We feel resentment *because* we believe the person *could have done otherwise* in a deep, non-causal way, or *deserves* blame *ultimately*.
      2.  P.F. hasn't *refuted* the incompatibilist challenge; he's just sidestepped it by changing the subject to psychology. The metaphysical question ("Is ultimate responsibility *possible*?") remains.
      3.  Galen's Basic Argument shows that ultimate responsibility *is impossible*, regardless of determinism. Therefore, the reactive attitudes, while natural, are *objectively unjustified* in attributing true desert. We might be stuck with them psychologically (like P.F. says), but they are based on an illusion. **He rejects moral responsibility *in principle*, even if we can't shake the feelings.**

  **Summary of Key Differences:**

  | Feature             | P.F. Strawson ("Freedom and Resentment")      | Galen Strawson ("The Impossibility of Moral Responsibility") |
  | :------------------ | :-------------------------------------------- | :----------------------------------------------------------- |
  | **Core Project**    | Defend *practice* of moral responsibility     | Prove *impossibility* of ultimate moral responsibility       |
  | **Position**        | **Compatibilist** (via psychology/practice)   | **Hard Incompatibilist** (impossible on any metaphysics)     |
  | **Focus**           | Reactive attitudes & social practices         | Metaphysical preconditions (causa sui)                       |
  | **Determinism?**    | Irrelevant to *practice* of responsibility    | Irrelevant to *impossibility* of responsibility              |
  | **Conclusion**      | Moral responsibility is **real & justified** within our human framework | Ultimate moral responsibility is **logically impossible**    |
  | **Relation**        | Almost **opposite** positions on justification |                                                              |

  **In short:** You were right that Galen Strawson's argument aims to work *regardless* of determinism/indeterminism by targeting the impossible requirement of *causa sui* (thanks to Nietzsche). Your friend was right about the Nietzsche link. And the confusion with P.F. Strawson is understandable – father defends the practice of responsibility based on human nature, while son argues the deep kind of responsibility required for true desert is metaphysically impossible. They are indeed arguing for almost opposite conclusions about the *justification* of moral responsibility. Next round of drinks, you'll be armed!
