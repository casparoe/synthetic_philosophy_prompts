  The key is that T's chances are defined over all possible histories, so even if an undermining future occurs, T might still be the best system. The New Principle uses T's hypothetical chances, which are consistent. The user might worry that the theory T itself could be undermined. But in the conditioning, T is assumed true, so it's fixed. The admissibility is handled because T's chances are based on the entire Humean mosaic, making them admissible by definition. 

