  ## Dialogue: The Sterile Siblings Case

  **Setting:** A worn leather armchair faces a sturdy oak desk. Sir Patrick Devlin sits behind the desk, fingers steepled. Professor H.L.A. Hart occupies the armchair, leaning forward intently.

  **Devlin:** Professor Hart, you persist in this narrow view that the law should only concern itself with preventing tangible harm. Consider the case presented: two adult siblings, sterile, engaging in a consensual sexual relationship. You would, I presume, see no grounds for criminalization under your 'harm principle'?

  **Hart:** Precisely, Sir Patrick. There is no harm to them – consenting adults. No harm to others – it’s private. No harm to potential children – sterility precludes that. The law, in a society valuing individual liberty, has no business here. Criminalizing such acts is mere enforcement of popular disgust, not the prevention of harm. It’s the tyranny of the majority you so rightly cautioned against elsewhere.

  **Devlin:** You mistake disgust for disintegration, Professor. My thesis isn't about enforcing mere distaste. It's about the *necessary foundations* of society. Shared morality isn't an optional ornament; it's the mortar binding the social structure. Remove enough bricks – tolerate acts that fundamentally violate the deep-seated moral principles upon which that structure rests – and the entire edifice risks collapse. Incest, even sterile incest between consenting adults, is one such foundational brick.

  **Hart:** That’s the assertion, Sir Patrick. The *disintegration thesis*. But where is the *evidence*? You claim tolerating this specific act – sterile, consensual incest – threatens the social fabric. Demonstrate it. Show me the empirical chain: toleration of *this* leads directly to measurable social breakdown. Does Germany, where adult sibling incest was decriminalized in 2017 *precisely* for cases like this, teeter on the brink? Has Denmark, tolerant on such matters for longer, suffered societal collapse? Where is the causal link?

  **Devlin:** You demand observable, immediate societal collapse? That is too crude a test, Hart. Disintegration is often insidious, a slow erosion. Law isn't merely reactive to *existing* harm; it's *constitutive* of moral order. It teaches, it signals, it upholds norms essential for social trust and stability. The incest taboo isn't arbitrary; it protects the integrity of the family unit – the primary cell of society. Sexual relations within that unit fundamentally distort its nature, introducing a disruptive, private intimacy that excludes other familial bonds and obligations.

  **Hart:** But you must connect that *abstract* concern to *real-world* disintegration. Does a sterile brother and sister, in their private relationship, truly weaken *your* family, Sir Patrick? Does it weaken *mine*? Does it cause neighbors to distrust each other? Does it increase crime rates? Lower economic productivity? Fracture political cohesion? You posit a domino effect – tolerate this, then tolerance for more destructive acts follows, society crumbles. But where is the proof this domino *actually falls*? Perhaps society is far more robust. Perhaps the taboo persists *culturally* without needing the *criminal law's* bludgeon, especially where the core practical harms (procreation, exploitation) are absent.

  **Devlin:** Robustness isn't infinite, Hart. The proof lies in the nature of the norm itself. This taboo is near-universal, deeply rooted in human history and psychology. Its violation strikes at the very concept of kinship – the distinction between familial love and sexual love. Tolerating it *by law* sends a signal that this fundamental boundary is negotiable. It weakens the *authority* of shared morality. If *this* profound taboo can be abandoned without consequence, why not others? Why not prohibitions against polygamy, against certain forms of exploitation masked as consent? The law’s retreat here isn't neutral; it’s an active endorsement of the erosion of a core social institution.

  **Hart:** That’s still prediction, Sir Patrick, not evidence. It’s a slippery slope argument devoid of empirical grounding. Societies tolerate many things once deemed taboo without collapsing. Homosexuality is the prime example. Its decriminalization and growing acceptance haven't led to the breakdown of marriage or family you predicted decades ago. Why should sterile incest be different? Where is the specific mechanism by which *this specific tolerance* causes *measurable harm* to the social fabric beyond vague unease or symbolic offense? You burden individuals with profound criminal sanctions based on a fear of hypothetical, unproven future social decay.

  **Devlin:** The difference, Hart, is one of degree and fundamentality. Homosexuality, however controversial, creates relationships *external* to the core family unit. It builds *new* bonds. Incest, even sterile, consumes the family unit *from within*. It turns the foundational trust and non-sexual intimacy of kinship into something else entirely. The mechanism isn't mysterious: it weakens the internal coherence and distinct function of the family. When the law ceases to uphold this boundary, it implicitly downgrades the family's unique role. This erosion *is* the harm – a slow poisoning of the wellspring of social order. We cannot always wait for the collapse to be visible before we shore up the foundations. The law must act preventively to uphold the essential moral framework.

  **Hart:** Preventive law based on unverified predictions of societal collapse is a dangerous tool, Sir Patrick. It licenses the state to invade the most private lives based on philosophical speculation, not proven harm. You ask us to sacrifice the liberty and privacy of these individuals – causing *them* undeniable harm through prosecution and stigma – to avert a hypothetical, unquantified social malaise for which you provide no concrete evidence beyond an assertion about symbolic importance. That is too high a price for social cohesion that seems to persist quite well in tolerant jurisdictions without criminalizing such specific, harmless private acts. The burden of proof for criminalization must lie with demonstrating *actual* harm, not just a resonant metaphor about crumbling edifices. Until you can show *this act* causes *that harm*, the law should stand back.

  **Devlin:** And I say, Professor Hart, you underestimate how deeply the mortar of shared morality binds, and how quietly it can turn to dust. The absence of visible collapse today is not proof the foundation is sound tomorrow. Some walls must never be breached, lest we forget why they were built.

  **Hart:** And I say, Sir Patrick, without evidence of the breach causing the fall, we build our walls around prisons for the human spirit. We enforce not morality, but fear.
