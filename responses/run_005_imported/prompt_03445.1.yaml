  The ending should be ambiguous - perhaps the character chooses to believe in the consciousness to give meaning to their existence, even without proof. That feels truer to human nature than a definitive answer. I'll avoid Block's intended reductio or functionalist defenses, keeping it personal and existential.

  Key imagery: the cubicle as a neuron, radio static as neural noise, the "ghost patterns" metaphor. Sensory deprivation from being cut off from real sunlight/air will emphasize their disembodied state. The voice commands should feel alien - not quite human, not quite machine.

