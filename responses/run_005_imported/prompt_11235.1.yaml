  First, I need to unpack Aquinas' actual views on tyranny, which are more nuanced than commonly cited. The distinction between usurper and legitimate ruler is crucial here. A usurper who seized power violently lacks legitimacy from the start, which Aquinas addresses in De Regno. That changes the moral calculus compared to a ruler who became tyrannical after legitimate ascension.

  The collective action requirement is another key point. Aquinas consistently emphasizes that removal of tyrants shouldn't be done through private initiative. This comes from his views on order and the common good - private killings risk chaos and factionalism. The Summa Theologiae is clear on this, especially Question 42. 

  The user also mentioned Aquinas' apparent shift in views. The early Commentary on the Sentences has more permissive language, while later works like De Regno and Summa show greater caution. This reflects his evolving concerns about unintended consequences and the importance of proper authority. 

  For the uncle's dialogue, I should present these nuances dramatically. The usurper distinction lowers the barrier for removal, but the collective action requirement remains absolute. The tension between these creates the moral dilemma. The uncle would stress that while the president is indeed a usurper, assassination by an individual officer still violates Thomistic principles. 

  The historical context matters too - Aquinas wrote after witnessing failed tyrannicides that led to worse outcomes. The uncle could reference this to show why Aquinas became more cautious. This gives depth to the argument beyond textbook explanations. 

  The challenge is making this feel natural in dialogue. The uncle wouldn't lecture; he'd use Socratic questioning, pressing the colonel on who authorized the act and what authority he's acting under. The core conflict becomes: yes the tyrant may deserve death, but does this particular man have the right to deliver it? That's where Aquinas draws the line.
answer: |-
  Here's the Thomistic breakdown your uncle would wield – not as dogma, but as a conscience grappling with sacred fire and temporal blood:

  **The Core Tension:** Aquinas *does* justify removing tyrants under Natural Law... **but** it's a minefield of conditions, precisely because he fears anarchy more than tyranny. Your uncle wouldn't deny the *possibility*; he'd dissect the *permissibility* of *this specific act* by *this specific man*.

  **1. The Usurper vs. Legit-Turned-Tyrant Distinction: Lowering the First Barrier**
     *   **The Usurper:** This is key for your colonel. Aquinas (*De Regno*, *Commentary on the Sentences*) saw a ruler who seized power *violently and unjustly* (**usurper**) as fundamentally illegitimate *from the start*. He holds power *only* by force, not by any grant (real or perceived) from God through the people's tacit consent/established order. Killing him isn't *regicide* (king-killing, a grave sin), it's removing a *violent criminal* holding the community hostage. **Lower Barrier:** The moral justification for removal is *stronger* and *easier* to argue for a usurper than for a legitimately crowned king who later became tyrannical.
     *   **The Legit-Turned-Tyrant:** A ruler who ascended properly but *then* rules unjustly presents a higher bar. Aquinas is far more hesitant here (*Summa Theologiae* I-II, Q42, A2; *De Regno*). Removal might still be justified, but the potential for chaos, the sin of betrayal of sworn oaths, and the risk of a *worse* successor loom larger. Your uncle would stress: "Thank God we face a *usurper*, lad. Aquinas gives us that much. But it's only the *first* gate."

  **2. The Lone Actor vs. Collective/Public Action: The Non-Negotiable Wall**
     *   **The Absolute Core:** This is where Aquinas digs in hardest, especially later (*Summa* I-II, Q42, A2; Q64, A3; *De Regno*). Killing a tyrant **cannot be a private act.**
     *   **Why the Weight?**
          *   **Order over Chaos:** Aquinas lived amidst feudal strife. Private vengeance or ambition disguised as tyrannicide was the highway to civil war. Only action stemming from or sanctioned by *public authority* could claim to restore order, not ignite further chaos.
          *   **Authority Resides in the Community:** The power to appoint (and thus depose) rulers ultimately resides in the community/people (*De Regno*). A lone assassin acts as a *private individual*, arrogating to himself a power belonging to the whole. He becomes a *judge and executioner* without mandate.
          *   **Risk of Worse Tyranny:** A successful lone assassin doesn't restore law; he demonstrates that *might makes right*. Who succeeds? Likely another strongman, potentially worse. Only a *publicly constituted action* (nobles, representatives, established legal process, even popular uprising as *last resort*) offers a *path* to legitimate restoration.
          *   **Sin of Sedition:** Private killing risks the sin of "sedition" (disturbing the *just* unity of the people). Removing a usurper *might* avoid this if done publicly to restore order, but a lone act *is* inherently seditious, fracturing the social fabric further.
     *   **The Uncle's Thrust:** "So he's a usurper? Agreed. Deserves removal? Likely. But *you*, Colonel? Alone in the shadows? Or with your cabal of fellow officers? Where is the *public authority*? Where is the mandate *from the people* you claim to save? Aquinas doesn't bless the dagger in the dark, only the sword raised *publicly* by the hand of justice restored. You act alone, you become not a liberator, but the *next* proof that force rules. You plunge us back into the chaos he exploited."

  **3. The Apparent Shift: Experience & The Weight of Consequences**
     *   **Early Work (Commentary on the Sentences):** More theoretical, written young. Here, the focus is sharper on the *tyrant's guilt* and the *permissibility* of killing a *usurper*. The collective action emphasis is present but perhaps less painfully stressed. This is the source of the "pop" quotes.
     *   **Later Work (De Regno, Summa Theologiae):** Written after deeper study, observing real-world political turmoil (like the conflicts between Papacy and Empire, Frederick II). Here, the *consequences* and *practical dangers* dominate.
          *   **Witnessing Failure:** He likely saw "tyrannicides" leading to worse outcomes. He understood the fragility of order.
          *   **Emphasis on Prudence:** Removing a tyrant must be the *absolute last resort*, only when the tyranny is *intolerable and certain*, and only when there's a *probable chance of success leading to a better state*. The *method* becomes paramount. The later Aquinas screams: "For God's sake, consider the *aftermath*! Will your act heal or wound?"
     *   **The Uncle's Point:** "Don't cling to the young Aquinas, the firebrand theorist. Listen to the older, wiser Aquinas who saw blood flow from noble intentions gone awry. He learned the hard way that the *how* matters as much as the *why*. The later Aquinas would look at your plot and ask: 'Where is the public legitimacy? Where is the plan for the dawn *after* the shot?'"

  **Putting it in the Uncle's Mouth (Key Beats):**

  *   **Acknowledge the Usurpation:** "Yes, he seized power like a thief in the night. Aquinas grants that such a man holds no true mantle of authority. He is a wolf, not a shepherd. To remove him is not murder in the same way... *in principle*."
  *   **Hammer the Collective/Public Action:** "But *principle* is a map, boy, not the territory! Where is the *public judgment*? Where is the assembly, the magistrates, the voice of the people *acting as one*? Aquinas didn't write a license for vigilantes! He feared the chaos of the lone sword more than the tyrant's boot! You act alone, you shatter the very order we seek to rebuild. You become the proof that might alone rules."
  *   **Invoke the Mature Aquinas & Consequences:** "Remember the older Thomas, lad. The one who'd seen the bloodbaths after 'righteous' daggers fell. He asks us: 'Is there *no other way*? Will this truly heal, or just wound deeper? Who holds the reins *after* the horse bolts?' Your shot may echo forever in the chaos it births."
  *   **The Crushing Question:** "So tell me, Colonel: Are you the hand of a restored people's justice... or just another man with a gun and a grievance, playing God in the dark? Aquinas might bless the first. He would damn the second. Which are you?"

  This gives your uncle the depth: acknowledging the tyrant's status lowers the bar, but the *method* (lone actor vs. public action) is the insurmountable wall Aquinas builds higher as he ages, driven by the terrifying weight of unintended consequences. The uncle isn't saying "don't act"; he's saying "this *way* of acting damns you and risks damning us all." It forces the colonel to confront not the *goal*, but the *means* and his *own authority* to wield them.
