  Random research question for a novel I'm mid-draft on. My protagonist is a colonel who's part of a plot to kill a president who took power in a coup a decade back and has been vicious ever since -- a clean case of what the scholastics would call a usurper, not a legit ruler who just went bad. Right before it happens, his old seminary-trained uncle, who's basically the guy's conscience for the whole book, tries to talk him through whether Aquinas would actually bless this, and I don't want the uncle to just mouth the pop version ("natural law says you're allowed to kill tyrants"). From what I've picked up he's way more hedged then that -- it turns a lot on whether it's one guy acting alone versus some kind of collective or official action, and he apparently got more cautious about the whole thing later in his career than in that early commentary on the Sentences everyone quotes. Can you actually lay out the moving parts for me: what the usurper vs. legitimate-ruler distinction is doing, why the lone-actor-vs-collective thing carries so much weight, and what's behind the apparent shift -- at the depth I'd need to put it in the uncle's mouth convincingly, not as an encyclopedia paragraph?
