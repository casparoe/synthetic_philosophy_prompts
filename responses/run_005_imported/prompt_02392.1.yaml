answer: |-
  You've hit on a core tension in the Hart-Devlin debate, but your characterization of Hart as a "moral relativist" is a common misconception that weakens your argument. While your intuition about the link between legal positivism and Hart's position is partly right, you're oversimplifying both Hart's philosophy and the debate itself. Here's a breakdown:

  1.  **Hart Was NOT a Moral Relativist (in the strong sense you imply):**
      *   **Legal Positivism ≠ Moral Relativism:** Hart's core claim is that *the existence and validity of a law* are separate questions from its *moral worth*. A law can be valid (according to a society's rule of recognition) but deeply immoral, or morally good but legally invalid. This is **descriptive**, not prescriptive. It says nothing about whether morality itself is objective or relative.
      *   **Hart's "Minimum Content of Natural Law":** Hart explicitly argued that any legal system aiming for human survival must necessarily incorporate *some* basic moral principles (e.g., prohibitions on violence, theft, fraud, a system of promises). This demonstrates a belief in *some* objective, universal moral requirements based on human nature and survival needs.
      *   **Critique of Devlin's *Specific* Morality, Not Morality Itself:** Hart didn't argue that *nothing* is objectively immoral. He argued that Devlin's claim – that *any* shared morality (like Victorian sexual mores) is necessary for society's survival ("disintegration thesis") and therefore enforceable – was flawed. He attacked the *link* between enforcing specific conventional morals and societal survival, not the *possibility* of objective morality.

  2.  **Hart's Core Argument Against Devlin:**
      *   **The Harm Principle (Millian Influence):** Hart's primary weapon wasn't relativism, but a refined version of John Stuart Mill's harm principle. He argued that the *only* legitimate justification for using the criminal law to restrict individual liberty is to **prevent harm to others**. This creates a high barrier for enforcing purely "moral" offenses based solely on disgust or majority preference.
      *   **Critique of the "Disintegration Thesis":** Hart devastatingly critiqued Devlin's claim that society would disintegrate without shared *conventional* morality (especially sexual morality). He argued societies are held together by far more fundamental things (like Hart's "minimum content," mutual forbearance, political institutions, economic interdependence) than agreement on private sexual conduct. Changing morals ≠ societal collapse.
      *   **Tyranny of the Majority:** Hart emphasized the danger of using the law to enforce the majority's moral preferences on minorities concerning private, consensual conduct. This protects individual liberty and prevents oppression, regardless of whether the majority's morals are "objectively" right or not. He saw this as a crucial safeguard in a pluralistic society.
      *   **Moral Independence:** He argued that individuals should have a significant sphere of private moral choice free from state coercion, allowing for moral development, diversity, and experimentation. Enforcing conventional morality stifles this.

  3.  **Devlin's Position (What You Got Right):**
      *   **Objective Societal Morality:** Devlin *did* argue that a society's shared morality (its fundamental principles about right and wrong) is objectively necessary for its survival. He believed this morality was discernible through the "revolted feeling" or "intolerance, indignation, and disgust" of the "right-minded" person.
      *   **Enforcement Justified:** He argued society has the *right* and *duty* to use law to protect this essential shared morality, just as it protects its political institutions, because without it, society crumbles. He famously argued that the suppression of vice (like homosexuality, the Wolfenden Report's focus) was as legitimate as the suppression of subversive activities.

  **Why Your Argument Was Partially Strong, But Flawed:**

  *   **Strength:** You correctly identified that Hart's legal positivism *facilitates* his argument against enforcement. Because law and morality are conceptually distinct, it's easier for him to say "even if something is immoral, that doesn't automatically mean it *should be illegal*." His framework doesn't *require* belief in objective morality to function. This *does* give him a different starting point than Devlin.
  *   **Weakness/Misunderstanding:**
      *   **Conflating Separation with Relativism:** You equated Hart's descriptive separation of law and morality with a denial of objective morality. Hart explicitly rejected this. He argued *against enforcement* based on principles of liberty, harm, and the flawed link to societal survival, *not* because he thought Devlin's morals were merely relative opinions.
      *   **Ignoring Hart's Positive Moral Arguments:** Hart didn't just say "law and morals are separate, therefore don't enforce." He made *positive moral/political arguments* about liberty, harm, and the dangers of majoritarian tyranny that stand independently of whether morality is objective or relative. Someone can believe homosexuality is objectively immoral *and still agree with Hart* that criminalizing private consensual acts is wrong because it causes unjustified harm and infringes liberty.
      *   **Missing the Target:** Your argument implies Hart's opposition stems *only* from meta-ethical skepticism. In reality, his opposition was primarily based on substantive political philosophy (liberalism) and a sociological critique of Devlin's core premise (society needs *this specific* shared morality to survive).

  **Conclusion:**

  You had a *rhetorically* strong point in highlighting the different starting points (positivist separation vs. natural law-ish societal morality), but your claim that Hart's position *depends* on or *reveals* him being a "deep down moral relativist" is a misreading. **Hart opposed Devlin primarily based on liberal principles of individual liberty and a critique of Devlin's sociology, not because he denied the possibility of objective morality.**

  Your friend might have been unconvinced because she sensed Hart's arguments against enforcement could hold even if one *does* believe in objective morality. The stronger argument focuses on Hart's critique of the disintegration thesis and his defense of the harm principle as the limit of criminal law, rather than attributing his stance to relativism. Hart wins the debate not because morals are relative, but because Devlin failed to prove that enforcing conventional private morality is necessary for societal survival, and because enforcing it unjustifiably harms individual liberty.
