  I'll start by setting the scene: pre-dawn courtyard, one packing a camel (Tariq, CDT), the other unpacking (Zara, EDT). Tariq is calm, believing his action doesn't change Death's location. Zara is anxious, stuck in a loop because her decision provides evidence of Death's prediction. 

  Key points for Tariq (CDT):
