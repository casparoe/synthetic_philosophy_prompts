  The CDT character (let's call him Tariq) believes his choice can't affect Death's past decision. He might think flipping a coin is rational since the outcome is fixed. The EDT character (Zara) bases decisions on evidence; choosing to flee is evidence Death predicted that, so fleeing seems bad, but staying also seems bad, leading to flip-flopping. 

