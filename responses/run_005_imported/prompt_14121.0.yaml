  ## Oration for Hendrik van der Meer  
  (Delivered by Mistress Annette Visser, Widow, Merchant of Haarlem, at the Nieuwe Kerk, July 1672)

  Friends, neighbours, fellow citizens… we gather under a heavy sky, bowed by a grief as sharp as a winter gale off the IJ. We mourn Hendrik van der Meer. My partner. My friend. A man whose steady hand guided our shared enterprise, and whose quiet voice sought only the good order and prosperity of this city he served with such devotion.

  His life, like all lives under God’s Providence, was not his own to command utterly. He understood this truth, deeply. He knew that we are not solitary creatures, set adrift on our own currents, but bound together – like the reeds that make the dike strong. Each reed alone bends and breaks; bound together, they hold back the sea. Hendrik believed in the strength that arises *when many hands join* in common purpose. He saw the city not as a possession of the mighty, but as a *shared hearth*, its warmth and light dependent on the care of every soul gathered around it.

  He served as alderman not to grasp power for himself – God knows he sought no crown, no elevation above his neighbours! – but because he understood that *service* is the highest calling. He believed that the *enduring strength* of any community, its true resilience against the storms of fortune or the tides of passion, springs not from the will of one, however wise, nor even the few, however noble. It flows, rather, from the deep, quiet wellsprings of the *common life* – the daily labours, the shared concerns, the mutual trust woven between neighbours over generations. It is the *ground* upon which all structures, however grand, must ultimately rest. No tower, however tall, stands if the earth beneath it crumbles.

  Hendrik trusted in the *wisdom held within the multitude* – not the clamour of the mob, God forbid, but the considered weight of common interest, the shared desire for peace, for justice, for the prosperity that allows each man to tend his garden and raise his children in safety. He knew that authority, *true* authority, the kind that endures and commands respect rather than fear, cannot be *wrenched* or *imposed* from above like a foreign yoke. It must *arise*, naturally, like water finding its level, from the consent and the *inherent capacity* of the people themselves, whose collective well-being is the *only* legitimate purpose of any rule. A ruler, or a council, is but a *steward* of that which *already belongs*, in its essence, to the whole. They hold it *in trust*. They do not *own* the foundation; they build upon it, or they fail.

  His trust… his quiet, steadfast trust… was in *us*. In *this* assembly, in the merchant at his ledger, the weaver at her loom, the fisherman mending his nets. He believed that when the people remember their shared stake, their *common inheritance* in the order and peace of their city, when they recall the *source* from which all just guardianship flows… then, and only then, can true stability be found. Then, the foundations hold. Then, the hearth burns bright against the encroaching dark. For the strength of the many, focused on their common good, guided by reason and tempered by mutual respect, is the *only* strength that does not corrupt, the only strength that truly *preserves*.

  This was Hendrik’s faith. Not merely in God’s ultimate judgment – though he bowed humbly before it – but in the *order* God has woven into the very fabric of human society. An order where the *vigilance* and *active care* of the many are the cornerstones of peace. To abandon this vigilance, to forget the wellspring of our shared strength, to imagine that the *steward* is the *source*… this, he feared, was the path to discord, to the very chaos that has now… that has now taken him from us. *(She pauses, visibly composing herself, a hand briefly touching her mourning veil)*

  His trust was broken by violence. His service met with hatred. We weep for the man. We tremble for the city he loved. Let us honour him not merely with tears, but by cherishing the fragile thing he served: the peace born of *shared responsibility*, the order built upon the *acknowledged strength* of the community itself. Let us remember that the truest monument to Hendrik van der Meer is not carved in stone, but lived in the daily acts of neighbourly kindness, in the just conduct of our affairs, and in our *collective resolve* to safeguard the common hearth against the howling wind.

  May God, in His infinite mercy, grant Hendrik peace. And may He grant *us* the wisdom, the humility, and the courage to build – together – what endures. Amen.

  **Key Smuggled Elements & How They Work:**

  1.  **"Strength that arises when many hands join... shared hearth":** Replaces "multitude" with accessible, positive images of communal effort and shared space, evoking Dutch civic pride.
  2.  **"Enduring strength... springs not from the will of one... nor even the few... flows from the deep, quiet wellsprings of the common life... the ground":** Core Spinoza. Power originates in the collective ("common life/ground"), not rulers ("one/few"). "Wellsprings" and "ground" imply an inherent, natural source. "Enduring strength" hints at democratic stability.
  3.  **"Authority... cannot be wrenched or imposed... must arise... from the consent and the inherent capacity of the people themselves":** Explicitly states power originates with the people ("inherent capacity") and rulers derive legitimacy from that source ("consent," "arise"). "Inherent capacity" is the key Spinozist phrase disguised as civic virtue.
  4.  **"Whose collective well-being is the only legitimate purpose":** Justifies popular sovereignty through the common good, a universally acceptable principle.
  5.  **"A ruler... is but a steward of that which already belongs... to the whole. They hold it in trust. They do not own the foundation":** Directly states rulers *manage* power that fundamentally *resides* with the people ("the whole," "foundation"). "Steward" and "trust" sound pious and responsible. "Own the foundation" subtly denies the divine right of kings/oligarchs.
  6.  **"The source from which all just guardianship flows":** Reinforces the origin of power being the people ("source"). "Guardianship" sounds dutiful and protective.
  7.  **"Strength of the many... is the only strength that does not corrupt, the only strength that truly preserves":** Explicit argument for the stability and moral superiority of popular power (democracy) versus monarchy/oligarchy ("one/few"). Framed as a practical observation on stability and preservation.
  8.  **"The order God has woven... where the vigilance and active care of the many are the cornerstones":** Sanctifies the concept by attributing the *structure* (popular vigilance = cornerstone) to God's design. "Vigilance" hints at the people's retained power/responsibility.
  9.  **"To forget the wellspring of our shared strength... to imagine that the steward is the source… this... was the path to discord... chaos":** Directly links forgetting Spinoza's principle (confusing steward with source) to the mob violence that killed Hendrik (and the De Witts). The "chaos" is the Orangist mob/rule, blamed on this fundamental error.
  10. **"Safeguard the common hearth... collective resolve":** The call to action – remember your inherent power and responsibility. "Common hearth" is the positive symbol of the Republic they must protect.

  **For the Calvinists:** It sounds like a pious call for unity, humility before God, service, and the dangers of forgetting God's ordained order (which they might interpret hierarchically, but the emphasis on "community" and "stewardship" is hard to argue against biblically). Mentions God's judgment, mercy, and Providence repeatedly. Focuses on peace and stability – their primary concerns. Avoids any challenge to Church doctrine or God's ultimate sovereignty.

  **For the Republicans:** Every italicized phrase resonates with Spinoza's argument. They hear the call to remember the *source* of power, the critique of monarchy/oligarchy as unstable/imposed, the justification for popular sovereignty via the common good, and the direct link between forgetting this principle and the violent triumph of their Orangist enemies. The "wellspring," "ground," "source," "foundation," "inherent capacity," and "steward vs owner" metaphors are clear signals.

  **The Voice:** Grieving, dignified, measured, subtly forceful in the middle section, returning to sorrow and piety at the end. Uses accessible metaphors (reeds, dike, hearth, foundation, wellspring, steward) familiar to Dutch merchants and citizens. Grounded in the practical realities of civic life and shared survival.
