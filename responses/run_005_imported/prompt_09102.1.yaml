answer: |-
  You're right to question your friend's pessimism—this isn't a hopeless situation. While the technical knowledge gap creates a challenge, **you absolutely can create systems and communication habits that surface reality more reliably.** Your teammate isn't malicious, but his tendency to over-reassure (driven perhaps by conflict avoidance, overconfidence, or a desire to please) is a genuine management risk.

  Here’s how to move beyond guesswork and build real transparency:

  1.  **Stop Asking for "Status." Ask for Specifics Instead:**
      *   **Swap:** "What's the status?" → **"Show me the test results for Module X."** or **"Walk me through the deployment checklist for the new API."**
      *   **Swap:** "How's it going?" → **"What are the top 3 open risks right now, and what's your mitigation plan for each?"**
      *   **Swap:** "Are we on track?" → **"What specific tasks are behind schedule, and what's the impact on the launch date?"** or **"What dependencies are causing the most friction?"**
      *   **Why it works:** He can't "reassure" vague questions. Demanding concrete artifacts (logs, test reports, checklists) or forcing enumeration of *specific* risks/blockers makes obfuscation harder. His deep expertise becomes an asset *for you* in this format.

  2.  **Implement "No Surprises" Reporting (Formally):**
      *   **Define Triggers:** "For any task you own, if you encounter *any* of these, you *must* flag it immediately: 1) Missed an internal milestone by > 1 day, 2) Found a bug severity 'High' or above, 3) Identify a dependency delay > 2 days, 4) Solution complexity increases significantly from initial estimate."
      *   **Make it Easy & Expected:** "Your job isn't just to fix things, but to ensure I know *early* when things might need help or adjustment. I need these flags *as soon* as you see them, not when you think you have a solution." Frame it as essential for *your* job.

  3.  **Require "Pre-Mortems" for Critical Paths:**
      *   **Before Launch/Key Milestones:** "Okay, we *think* this is ready. Let's do a pre-mortem: Imagine it's 1 week post-launch and something major broke. What are the 3 most likely causes based on what we know *right now*? What evidence do we have that those causes *aren't* present?"
      *   **Why it works:** This psychologically safe exercise forces him to articulate potential failures using his expertise *proactively*, bypassing his instinct to reassure. It surfaces hidden doubts.

  4.  **Introduce Independent Verification (Subtly):**
      *   **Peer Review:** "This component is critical. Have you had [Another Senior Teammate] review the design/approach/code?" (Require it for high-risk areas).
      *   **Shadow Testing:** "The QA lead will run a focused smoke test on your area tomorrow. Can you walk them through the key scenarios?" Observing someone else interact with his work often reveals unspoken assumptions.
      *   **Third-Party Dashboards:** Implement shared monitoring (build status, test coverage %, performance metrics) that *you* can see independently. Ask him to explain *deviations*.

  5.  **Reframe "Bad News" as "Essential Input":**
      *   **Praise Candor Publicly & Privately:** When *anyone* (especially him) flags a risk early, explicitly thank them: "Thanks for catching that *now* - that saved us a huge headache later."
      *   **Respond Constructively to Problems:** When a problem *is* surfaced, focus entirely on solution-finding, *not* blame. If your reaction to bad news is stress or frustration (even understandable), he'll learn to hide it. Calmly ask: "Okay, what do we need to resolve this?"
      *   **Share Your Own Vulnerabilities:** "I'm worried about how Component Y integrates with the legacy system. What am I missing?" Modeling that it's safe to express uncertainty lowers his guard.

  6.  **Schedule Dedicated "Deep Dive" Sessions:**
      *   **Not status, but understanding:** "Every other week, let's block 30 mins just for you to walk me through the most complex part of what you're working on. I don't need to understand every line of code, but I need to grasp the core challenges and trade-offs you're making." Ask "Why?" frequently. His ability to explain complexity *to you* is a test of true clarity.

  **Why this works better than just hoping he'll "be straight":**

  *   **Reduces Ambiguity:** Vague requests get vague (and reassuring) answers. Specific requests demand specific, verifiable information.
  *   **Leverages His Expertise:** Instead of him using his knowledge to reassure, you force him to use it to *identify and articulate* risks and specifics *for you*.
  *   **Creates Accountability:** Defined triggers and independent checks make omissions harder to rationalize, even subconsciously.
  *   **Builds Psychological Safety:** By rewarding early flagging and focusing on solutions, you make it safer for him to be candid.
  *   **Shifts Your Role:** You move from passive recipient of status to active seeker of evidence and understanding.

  **Don't expect overnight change.** Consistently apply these techniques. If, after several months of this structured approach, you *still* get blind-sided by issues he should have foreseen and flagged, then you have a clear performance or trust issue to address directly. But your friend is wrong – you are absolutely **not** powerless. You just need better tools to bridge the knowledge gap and manage his communication tendency effectively. This is a core leadership skill: creating systems that surface truth.
