  Fourth, Hirshleifer’s critique: Good’s theorem assumes individual rationality, but information can wreck insurance markets. The guest might concede this but argue the theorem still holds for individuals. The follow-up should ask if this collapses her policy argument—since individual rationality ≠ social optimality.

