  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  and follow the JSON with one or two sentences per case explaining which of the four mechanisms (or none) you think actually fits best.
