  So I've been working on a piece about whether it's morally different to target a conscripted Russian soldier versus a volunteer, and I fell down a rabbit hole on the "moral equality of combatants" debate -- Walzer's argument in Just and Unjust Wars versus Jeff McMahan's revisionist critique in Killing in War. Every explainer I find just says "Walzer thinks soldiers on both sides are equals, McMahan disagrees" and leaves it there, which doesnt tell me much. Can you actually spell out the mechanics of McMahan's objection -- what is it about the justice of a soldier's cause thats supposed to change his individual standing to kill? And does Walzer (or anyone defending him) have a decent reply to the coerced-conscript case, where the soldier never really chose to fight for the unjust side? Curious which side handles that case better, and why.
reasoning: |-
  Okay, let me unpack this user's query. They're writing about the moral distinction between targeting conscripted versus volunteer Russian soldiers and got stuck in the "moral equality of combatants" debate. They mention Walzer and McMahan, but existing summaries are too vague. They want a deeper dive into McMahan's argument and how Walzer's side handles conscripts.

  First, I need to recall Walzer's position. He argues that soldiers on both sides are moral equals, meaning they can kill each other without being murderers. This is based on the idea of combatant's privilege. Soldiers are instruments of the state, not responsible for the war's justice. His main point is about maintaining war conventions and avoiding making soldiers judge the war's morality.

  Then there's McMahan's revisionist critique. He challenges Walzer by linking the permissibility of killing to the war's justice. If a war is unjust, soldiers fighting for that cause lose their moral immunity. McMahan uses the liability principle: you're liable to defensive harm only if you're responsible for an unjust threat. So, soldiers in an unjust war pose an unjust threat, making them liable to be killed. But what about conscripts? McMahan might argue that even if coerced, they still contribute to the threat, though their reduced responsibility could lessen their liability. This is where the distinction between liability and excuse comes in. They might be excused but still liable.

  The user is particularly interested in the coerced conscript case. Walzer's response is that coercion removes moral responsibility, so killing them is problematic. But his symmetry remains; both sides' conscripts are equally excused. McMahan would say that while conscripts aren't fully responsible, they still pose a threat in an unjust war, so liability exists. However, the level of force used against them should be minimized due to their excusable circumstances.

  Now, which side handles conscripts better? Walzer's approach is simpler for wartime ethics: treat all soldiers equally, which might protect non-combatants and maintain conventions. But it ignores the war's justice. McMahan's view is more nuanced, linking liability to the war's cause, but it's harder to apply in real conflicts. For conscripts, McMahan acknowledges their reduced culpability but maintains they can still be legitimate targets, though with proportionality considerations. This might be more morally precise but practically messy.

