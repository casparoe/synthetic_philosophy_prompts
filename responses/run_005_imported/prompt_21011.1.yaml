  First, the deadlock itself signals genuine scientific uncertainty - this isn't resolvable by simple compromise. Second, both reviewers being peers means their disagreement carries epistemic weight. Third, the proposal's fate affects real researchers and scientific progress. 

  For the memo structure, I should: 
