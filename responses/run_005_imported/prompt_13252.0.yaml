prompt: |-
  I'm a software engineer, and my team has recently been asked to build an automated model that scores job applicants for our company's engineering roles before a recruiter reviews them. While researching how to make such a model "fair," I came across the cluster of impossibility results from the mid-2010s (associated with work by Kleinberg, Mullainathan, and Raghavan, and separately by Chouldechova) showing that calibration within demographic groups and equalized error rates across those groups generally cannot both hold once the groups have different base rates for the outcome being predicted. I have no formal background in philosophy or the fairness literature beyond a few blog posts and paper abstracts I've skimmed. Please describe the most important implications of these impossibility results for how my team should go about selecting, and defending, a fairness criterion for a model like ours.
