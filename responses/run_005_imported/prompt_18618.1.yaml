answer: |-
  ## Eulogy for Miriam: The Space Where the Bell Rang

  [Stand, take a breath, acknowledge the gathering]

  Friends, family, fellow travelers on this strange path – thank you for gathering to remember Miriam. Thank you especially to her family for the profound honour of speaking about her today. For over six years, many of us met in living rooms, grappling with ancient, intricate texts like Nāgārjuna’s *Mūlamadhyamakakārikā*. Miriam wasn’t just our guide; she was the compass, the anchor, and occasionally, the very sharp pin that popped our comforting bubbles of certainty. Her mind, honed by decades in analytic philosophy and refined by her deep dive into Madhyamaka, was a remarkable instrument – precise, relentless, and fiercely devoted to truth.

  Miriam would be the first to warn us about the traps inherent in speaking about her now. She left explicit instructions, half-joking but entirely serious, about the memorial pitfalls she anticipated. No smuggling in a comforting, persistent self through the back door of memory or spiritual oversight. Equally, no collapsing her into a simple negation, a bare "nothingness," as if that concept itself weren't another subtle form of clinging. She knew, intimately, Nāgārjuna’s relentless deconstruction of the four corners of the tetralemma: *exists*, *doesn’t exist*, *both*, *neither*. Each, she taught us, is ultimately untenable. To grab any one as a life-raft in grief is precisely the reflex the arguments dismantle.

  So, how *do* we speak of Miriam? How do we honour her without violating the profound emptiness (*śūnyatā*) she spent decades contemplating? How do we grieve, feel gratitude, and acknowledge the immense space her absence creates, without falling into the very conceptual traps she spent her life illuminating?

  Miriam herself gave us the framework: the two truths. Not as a tidy solution, but as a way of navigating the profound tension inherent in being human.

  At the level of **conventional truth** (*saṃvṛti-satya*) – the truth of our shared, messy, everyday reality – there is undeniable loss. There is grief. It is real, it is raw, and it fills this room. We feel the absence of her sharp wit across the potluck table, the absence of her patient (and sometimes impatient) guidance through a thorny verse, the absence of her fierce intellectual integrity that held our little group together. This grief is not an illusion to be dismissed; it’s the natural, conventional response to the ending of a unique pattern we called "Miriam." It is the echo of a bell that has stopped ringing. To deny this grief would be to deny the profound impact she had in this conventional world.

  And what an impact it was. At this conventional level, we see what continues: not a *self*, but the imprints. We see it in the slightly different ways we approach a logical puzzle, the hesitation before grabbing for an easy "both/and" or "neither/nor" answer, the deeper respect for the sheer rigor required to truly engage with emptiness. We see it in the shared language, the inside jokes born of wrestling with paradoxes, the community she nurtured. Her clarity, her insistence on precision, her refusal to let us off the hook with spiritual-sounding vagueness – these are forces that shaped us. They continue to shape how we think, how we question, how we engage with the world and each other. This legacy is real. This gratitude is real. This love, felt in this room, is real – all within the realm of conventional truth.

  But Miriam would also insist we acknowledge the **ultimate truth** (*paramārtha-satya*). Here, the concepts we grasp for in our grief – existence, non-existence, persistence, annihilation – simply cannot capture the reality. The intricate, interdependent constellation of causes and conditions that manifested as Miriam has dispersed. To say she "exists" somewhere now is a comforting fiction. To say she "doesn't exist" absolutely is to reify non-existence, creating its own kind of solid ghost. To say "both" or "neither" is, as she would sharply remind us, not a clever escape, but the very trap Nāgārjuna exposed.

  **[Pause, look around]**

  This is the tension Miriam lived within and asked us to confront. The conventional truth of our grief and gratitude is undeniable and valid. The ultimate truth of emptiness, the unfindability of any inherent, independent existence, is profound and liberating. Yet, holding both simultaneously doesn't magically dissolve the ache of loss. The comfort found in convention and the rigor of the ultimate don't always neatly align, especially in the raw immediacy of grief. Miriam wouldn't want us to paper over that tension with vague platitudes about "interconnectedness" or "oneness" – concepts she meticulously argued could easily become new objects of subtle clinging. She taught us that true understanding often resides precisely *in* acknowledging the gap, the discomfort, the place where easy answers fail.

  So today, we honour Miriam by holding both truths. We honour the conventional Miriam – the brilliant philosopher, the exacting teacher, the sometimes-terrifying potluck companion, the friend, the family member – with our tears, our stories, our deep gratitude for the time she shared with us. We feel the void her departure leaves in our lives and our group. We celebrate the very real, conventional legacy she leaves in our minds and hearts.

  And we honour the ultimate truth she dedicated her life to exploring. We honour it by *not* claiming to know what we cannot know. By *not* offering her, or ourselves, the false comfort of a conceptual cage, however beautifully gilded. By sitting, even in our sorrow, with the profound openness, the radical uncertainty, that her philosophy pointed towards.

  Miriam taught us that clarity often looks like the absence of easy answers. That truth demands we relinquish our most cherished conceptual comforts. Her life was a testament to the courage required to look directly into that space. Her absence now is perhaps her final, most potent teaching: a vast silence echoing the bell that was her presence, reminding us that meaning isn't found in clinging to existence or non-existence, but in the clear, open awareness of the space itself.

  Thank you, Miriam, for the rigour, the clarity, the challenge, and the profound space you opened for us all. We miss you, conventionally and deeply. And we honour the ultimate mystery you pointed us towards. May we meet the silence you’ve left with the same fearless honesty you brought to every verse, every question, every potluck.
