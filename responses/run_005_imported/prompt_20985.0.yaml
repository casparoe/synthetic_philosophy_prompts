prompt: |-
  At work I've been asked to design the override mechanism for an autonomous coding agent we're about to give production access, including a clean way to halt it if it's midway through a multi-step change when someone decides it needs to stop. I've since read that AI safety researchers treat this as a genuinely hard problem under the names "corrigibility" and "the shutdown problem": the worry is that almost any goal-directed agent has some incentive to resist, delay, or route around being switched off, and that proposed fixes such as Armstrong's "utility indifference" or giving the agent incomplete preferences each trade one failure mode for another rather than resolving the issue outright. Could you lay out the most important implications of this literature for how I should actually approach the design, and specifically what it would take for "shutdownable" to mean something stronger than "there's a button that usually works"?
