  Setting: Kingdom of Aeloria, medieval with castles, councils. Names should feel period-appropriate. The story will start with the council in disarray after Garvin's revolt, showing the chaos. Then, focus on Eamon and Seren’s debate, incorporating Aquinas’s principles. End with the council deciding to use their authority to depose the king, respecting the legitimate process.

