answer: |-
  ## The Weight of the Crown

  The Council Chamber of Aeloria stank of fear and damp stone. Rain lashed the high, narrow windows, mirroring the storm raging within. News had just arrived: Lord Garvin, Marshal of the Western Marches, had declared King Torvald a tyrant unfit to rule. He’d seized the fortress of Blackridge with a company of loyalists and was marching east. The air crackled with the unspoken question: *What do we do?*

  At the heavy oak table, Lord Eamon, Chancellor and Keeper of the Rolls, traced the grain of the wood with a trembling finger. His face, usually serene with the weight of precedent, was pale. Beside him, Lady Seren, Steward of the Realm, stood rigid, her knuckles white on the back of her chair. Their eyes met across the panicked murmurs of lesser lords – a silent communication forged over decades of service.

  "Garvin oversteps," Eamon murmured, his voice barely audible above the rain. "He raises arms against the anointed King. This is not resistance; it is *usurpation*. Plain sedition."

  Seren’s gaze was flint. "Anointed he was, Eamon. Crowned with the sacred oils, blessed by the High Prelate. But that was ten years ago. Since the Queen’s death... the taxes that bleed the smallfolk dry, the arbitrary imprisonments, the silencing of every voice but sycophants like Viscount Hale over there." She jerked her chin towards a fawning courtier. "Torvald *made* himself a tyrant, by practice and oppression. Aquinas allows for action against such a one."

  "Allows *whom*?" Eamon countered, leaning forward, his voice gaining strength. "Not for every disgruntled lord with a grievance and a garrison! Garvin acts as a private man, seizing power for himself. He is no representative of the realm. He bypasses the Estates, the Council, the very laws he claims to uphold! Aquinas reserves the right to depose a tyrant-by-practice to *public authority* – the nobility *collectively*, acting for the common good, not a lone wolf seeking the throne! To support Garvin is to endorse the law of the sword over the law of the realm. We condemn ourselves to endless cycles of rebellion."

  Seren slammed her hand on the table, silencing the room. "Public authority? Look around you, Eamon! The Estates haven't been called in five years. The King dissolved the High Council of Barons. He listens only to fear and flattery. What 'public authority' remains? If the body politic is crippled, paralyzed by the tyrant’s own design, does the right to act simply... vanish? Does the common good rot while we wait for a sanction that Torvald ensures will never come?"

  Eamon met her fury with weary resolve. "It *must*. Because the alternative is Garvin. A man who breaks his oath of fealty, who uses force, not law or consent. Aquinas is *clear*, Seren. A tyrant-by-usurpation – which Garvin *becomes* the moment he takes up arms against the rightful sovereign, however flawed – may be resisted *by anyone*, for he has *no* legitimate claim. His rule is violence from the outset. But Torvald? However cruel, he *was* rightful. His removal requires due process, lest we legitimize assassination and chaos. Supporting Garvin isn't liberation; it's replacing one form of lawlessness with another, potentially worse."

  The argument hung heavy. The lesser lords looked between them, torn. The distinction wasn't academic; it was the chasm between order and anarchy. Was Garvin a liberator resisting a usurper of the people's trust (a tyrant-by-practice), or was he *becoming* the usurper himself by acting alone against a still-legitimate, though wicked, king?

  Days bled into weeks. Torvald, predictably, responded with brutal reprisals against villages suspected of Garvin sympathies. Garvin’s forces, fueled by outrage, grew, promising liberation but offering only the certainty of civil war. The Council remained paralyzed.

  Seren found Eamon late one night in the archives, surrounded by dusty scrolls – records of ancient councils, precedents for deposition. He looked exhausted, but his eyes held a fragile light.

  "You see the chaos Garvin sows," Seren stated, not a question. "His 'justice' looks suspiciously like looting. He speaks for himself, not Aeloria."

  Eamon nodded, pushing a brittle parchment towards her. "Aeloria, Year 347. King Borin the Heavy-Handed. Legitimately crowned, but ruled by terror. The Estates General, though long dormant, *were* still a recognized body. The leading nobles, acting *as* the Estates in emergency session, declared him deposed for tyranny. They named his nephew, with the Prelate's blessing, as Regent until a proper succession could be determined. It was... messy. But it wasn't Garvin’s way."

  Seren scanned the faded ink. "The Estates... dissolved by Torvald. But the *nobility* remains. The great lords and ladies. We," she gestured around the archive, encompassing the absent peers, "*are* the closest thing to public authority left. Not Garvin. Not a mob. *Us.*"

  Eamon took a deep breath. "Aquinas says a tyrant-by-practice forfeits his right *to be obeyed*, and the community, *through its constituted leaders*, may remove him. It must be public. It must be for the common good, not private gain. It must seek to restore lawful order, not shatter it further."

  The next Council session was tense. Torvald raged from the throne about traitors and Garvin’s head on a pike. Eamon stood, his voice surprisingly steady.

  "Your Grace," he began, the formal address feeling like ash in his mouth, "Lord Garvin’s rebellion is sedition. He acts without sanction, seeking power for himself. He is a usurper, and his path leads only to blood and lawlessness."

  A murmur of surprise. Seren held her breath. Torvald looked momentarily smug.

  "However," Eamon continued, his gaze sweeping the room, landing on each major lord and lady, "neither can the realm endure the weight of tyranny-by-practice. The excessive taxes, the denial of justice, the silencing of counsel... these burden the common good grievously." He paused, letting the accusations hang. "Therefore, as the leading nobles of Aeloria, the traditional guardians of the realm’s welfare in the absence of a sitting Estates, we *hereby* constitute ourselves an emergency Council of the Realm. We declare King Torvald deposed, effective immediately, for tyranny against his people and the fundamental laws of the kingdom."

  Silence. Thunderous silence, broken only by the King’s choked gasp.

  Seren stepped forward. "Not for Garvin," she declared, her voice ringing clear. "But for Aeloria. We act not as private individuals, but as the highest remaining *public authority*, invoking ancient precedent and natural law, to remove a ruler who has broken his covenant. We will name a Protector from among ourselves to steward the realm *until* a lawful Great Council, representing all estates, can be convened to choose a new monarch."

  The distinction landed like a physical blow. This wasn't Garvin’s lone violence. This wasn't passive acceptance of tyranny. It was the perilous, necessary middle path Aquinas had charted: action taken by the *right* people, in the *right* way, against the *right* kind of tyrant. They weren't endorsing the usurper; they were reclaiming public authority from the tyrant who had hollowed it out, acting *as* that authority to prevent the greater chaos Garvin represented. The ending wasn't triumph – armed loyalists still surrounded the throne room, Torvald sputtered denials – but it was a fragile, principled stand on the razor's edge Aquinas had defined. The fight was far from over, but it was finally being fought on ground that acknowledged the terrible, necessary weight of legitimacy.
