prompt: |-
  So I've been on a bit of a Bayesian decision theory kick lately (blame a stats podcast) and ran into I.J. Good's old 1967 result, the one that's usually filed under "the principle of total evidence." The claim is that a rational expected-utility maximizer can never expect, ahead of time, to be made worse off by getting a piece of free evidence relevant to a decision, as long as their allowed to just ignore the evidence if it turns out to be useless. Every source that mentions this just states it like its obvious ("well of course more info can't hurt you") and moves on, but when I actually tried to reconstruct for myself why it has to be true, rather than just feels true, I got stuck.

  What I'd love is for you to walk me through the actual mechanics of why the theorem holds, aimed at someone who can follow the math but wants the "aha," not just a restatement of the definitions. Like, is the whole proof basically just Jensen's inequality wearing a trenchcoat (the expectation of a max is >= the max of an expectation, so having the option to tailor your action to whatever you learn beats committing to one action in advance), or is there something more specifically decision-theoretic going on that I'm missing? And how does it relate to Blackwell's older, more general theorem about when one experiment counts as "more informative" than another for every possible decision-maker?

  And then, if you can, get into the weeds a bit on the classic-seeming exceptions people throw at this. Things like markets where information becoming public can destroy insurance-type arrangements that only worked because of everyone's shared uncertainty (I want to say this is called the Hirshleifer effect, but don't hold me to the name), or the everyday case of someone who'd genuinely rather not know a piece of information early even though knowing wouldn't change a single thing they'd do about it. Are cases like that real counterexamples to Good's theorem, or is each one secretly smuggling in a violation of some assumption baked into the proof (no cost to acquiring the info, a single decision-maker instead of several people whose strategies interact, purely instrumental preferences with nothing riding on the belief state itself, etc.)? Me and a friend keep going back and forth on whether these are "genuine" exceptions or just different problems wearing a disguise, and I'd like to actually pin down which assumption is doing the load-bearing work in each case.
reasoning: |-
  We are discussing I.J. Good's 1967 result, which states that for a rational expected-utility maximizer, acquiring free relevant evidence (with the option to ignore it) cannot be expected to decrease expected utility. We'll break down the proof, relate it to Blackwell's theorem, and then examine exceptions.

  ### The Core Argument

  Consider a decision problem with:
  - A set of possible actions, A.
  - A set of states of the world, S, with a prior probability distribution P(s).
  - A utility function U(s, a) that depends on the state and the action.

  We are considering whether to observe the outcome of an experiment (or "evidence") E, which is a random variable that may depend on S. The decision maker has two strategies:
  1. **Without evidence**: Choose an action a in A without seeing E. The expected utility is max_{a} E[U(s, a)].
  2. **With evidence**: Observe E and then choose an action a(E) that depends on E. The expected utility is E[ max_{a} E[U(s, a) | E] ].

  Good's theorem says that the expected utility of the second strategy (with evidence) is at least as large as the first (without evidence). 

  **Proof:**

  The key is to note that the decision maker with evidence can always choose to ignore the evidence and pick a fixed action. That is, for any fixed action a0, the strategy that ignores E and always picks a0 is a particular kind of strategy in the "with evidence" case. Therefore, the optimal strategy when having evidence must yield at least the same expected utility as any fixed action. In particular, it must yield at least the same as the best fixed action (the one that maximizes expected utility without evidence). 

  But we can also express it mathematically:

  Let V_without = max_{a} E[U(s, a)]

  Now, for the strategy with evidence, the decision maker picks, for each possible e, the action a(e) that maximizes the conditional expected utility given E=e. So:

  V_with = E[ max_{a} E[U(s, a) | E] ]

  We can rewrite V_with as:

  V_with = E[ f(E) ]   where f(e) = max_{a} E[U(s, a) | E=e]

  Now, note that for any fixed a0, we have:

  f(e) = max_{a} E[U(s, a) | E=e] >= E[U(s, a0) | E=e]

  Therefore, taking expectations:

  E[ f(E) ] >= E[ E[U(s, a0) | E] ] = E[U(s, a0)]

  Since this holds for every a0, it holds in particular for the a0 that maximizes E[U(s, a0)]:

  E[ f(E) ] >= max_{a0} E[U(s, a0)] = V_without

  Hence, V_with >= V_without.

  ### Relation to Blackwell's Theorem

  Blackwell's theorem (1951, 1953) is a more general result about the comparison of experiments (or information structures). It provides conditions under which one experiment is more informative than another for every decision problem. Specifically, experiment E is said to be more informative than experiment F (in the Blackwell sense) if for every decision problem, the expected utility from having E is at least as high as from having F.

  Good's theorem can be seen as a special case of Blackwell's theorem. In Good's setting, we are comparing the experiment E (which we may take) with the experiment that provides no information (the trivial experiment). Blackwell's theorem implies that if E is more informative than the trivial experiment (which it always is, unless E is independent of S and hence uninformative), then it cannot be worse for any decision problem. 

  But note: Good's theorem also allows the decision maker to ignore the evidence. This is equivalent to saying that the decision maker can choose a garbling of the experiment E that produces the same outcome as the trivial experiment (i.e., by ignoring E, you get the same as if you had no experiment). Therefore, the set of strategies available when you have E includes all the strategies available when you have no experiment (by ignoring E) and more. Hence, the value must be at least as high.

  ### Exceptions and Counterexamples

  Now, let's discuss the exceptions:

  1. **Hirshleifer Effect (Market Settings with Multiple Agents)**:
     - In a market setting, public information can destroy the possibility of risk-sharing. For example, if information reveals the state of the world (e.g., who will have a loss), then insurance contracts that were based on symmetric ignorance may break down. This leads to a situation where an individual might prefer that no one (including themselves) gets the information because the market as a whole would collapse.
     - **Why is this not a counterexample to Good?**: Good's theorem assumes a single decision maker. In a multi-agent setting, the actions of others (and the market structure) change the environment. The utility function of an individual now depends on the information that others have and their actions. Therefore, the prior decision problem (without information) is actually a different game than the one with information. The assumptions of Good's theorem (a fixed decision problem with fixed utility and fixed state space) are violated because the utility function in the presence of others' actions and information is different.

  2. **Preference for Ignorance (Non-Instrumental Value of Beliefs)**:
     - Example: A person might prefer not to know whether they have a genetic predisposition to a disease if knowing wouldn't change their actions (e.g., because there is no treatment). They might prefer to avoid anxiety.
     - **Why is this not a counterexample?**: Good's theorem assumes that utility is a function of the state and the action only, not of the beliefs themselves. If the person experiences disutility from knowing (e.g., anxiety), then we are violating the assumption. We can model this by expanding the state space to include the decision maker's belief state and then the utility function would depend on that. However, note that in the standard setup, the utility function does not depend on the information itself. So if the act of acquiring information causes disutility (even if it's free in monetary terms), then we are in a different setting. Alternatively, if the utility function includes a term for the belief state (e.g., peace of mind), then the problem changes. In that case, the original decision problem is not just about the state s and action a, but also about the information acquired. Therefore, the theorem does not apply because the utility function has changed.

  3. **Costly Information?**:
     - Good's theorem assumes the evidence is free. If there is a cost, then the net benefit might be negative. But note: the theorem says "free evidence". So if there is a cost, then it's not free.

  4. **The Option to Ignore**:
     - The theorem requires that the decision maker can ignore the evidence. In some situations, the decision maker might be forced to use the evidence (e.g., by legal requirements or social pressure). Then the option to ignore is not available, and the theorem does not apply.

  ### Conclusion

  Good's theorem is a robust result for a single decision maker in a fixed decision problem where utility is state-and-action based and the evidence is free and can be ignored. The proof is straightforward: the decision maker can always ignore the evidence and get the same expected utility as without it, and by using the evidence optimally they can only do better. 

  The apparent counterexamples typically involve either:
  - Multiple agents (so the decision problem is not fixed because others react to the information).
  - Non-instrumental value of information (utility depends on the information itself, not just the state and action).
  - Costs of acquisition (monetary or psychological) that violate the "free" assumption.
  - Inability to ignore the evidence (so the decision maker is forced to act on it).

  Therefore, these are not counterexamples to Good's theorem but rather examples of situations where the assumptions of the theorem do not hold.
answer: |-
  Let's unpack Good's theorem step by step, connecting the mathematical machinery to the intuition, and then dissect those apparent counterexamples. The core insight is indeed about optionality, but there's subtlety in how it manifests.

  ### The Mechanical Heart: Why Information Can't Hurt (Mathematically)
  Consider a decision problem with:
  - **States of the world** \(s \in S\) (unknown to you)
  - **Actions** \(a \in A\)
  - **Utility function** \(U(s, a)\)
  - **Prior belief** \(P(s)\)
  - **Potential evidence** \(E\) (a random variable correlated with \(S\))

  **Without evidence**, you choose a fixed action \(a\) maximizing *expected utility*:
  \[
  V_{\text{no-info}} = \max_{a} \mathbb{E}_s[U(s, a)]
  \]

  **With evidence**, you observe \(E = e\), update to posterior \(P(s|e)\), then choose \(a(e)\):
  \[
  V_{\text{info}} = \mathbb{E}_e \left[ \max_{a} \mathbb{E}_{s|e}[U(s, a)] \right]
  \]

  **Good's claim:** \(V_{\text{info}} \geq V_{\text{no-info}}\)

  **Proof (the "Aha!"):**
  1. For any *fixed* action \(a_0\), the expected utility if you *ignored* the evidence would be \(\mathbb{E}_s[U(s, a_0)]\).
  2. Crucially, when you *have* evidence, **ignoring it is one of your available strategies**. You could choose \(a(e) = a_0\) for all \(e\).
  3. But you'll only do this if it's optimal. For each \(e\), you choose \(a(e)\) to maximize \(\mathbb{E}_{s|e}[U(s, a)]\), so:
     \[
     \max_{a} \mathbb{E}_{s|e}[U(s, a)] \geq \mathbb{E}_{s|e}[U(s, a_0)] \quad \text{for every } e, \text{ and every } a_0.
     \]
  4. Take expectation over \(E\):
     \[
     \mathbb{E}_e \left[ \max_{a} \mathbb{E}_{s|e}[U(s, a)] \right] \geq \mathbb{E}_e \left[ \mathbb{E}_{s|e}[U(s, a_0)] \right] = \mathbb{E}_s[U(s, a_0)]
     \]
     (The last equality is the law of total expectation.)
  5. Since this holds for *every* \(a_0\), it holds for the *best* \(a_0\):
     \[
     V_{\text{info}} \geq \max_{a_0} \mathbb{E}_s[U(s, a_0)] = V_{\text{no-info}}
     \]

  **Why is this Jensen in a trenchcoat?**  
  Jensen's inequality says that for a convex function \(f\), \(\mathbb{E}[f(X)] \geq f(\mathbb{E}[X])\). Here, the "outer" operation is \(\mathbb{E}_e\), the "inner" operation is \(\max_a\), and \(\max_a\) is convex. But Good's result is more specific: it's the convexity of \(\max\) applied to conditional expectations, guaranteeing that the expectation of the maximum (conditionally optimal action) is at least the maximum of the expectation (unconditionally optimal action). The trenchcoat is decision-theoretic: it's about the *optionality* to condition actions on \(e\).

  **Connection to Blackwell:**  
  Blackwell's theorem defines when one experiment \(E\) is "more informative" than another \(F\). It requires that for *any* decision problem and *any* utility function, the expected utility from \(E\) is \(\geq\) that from \(F\). Good's theorem is a special case:  
  - Compare \(E\) (your evidence) to \(F = \text{nothing}\) (the trivial experiment).  
  - Blackwell says \(E\) is more informative than nothing iff \(E\) is a "garbling" of a sufficient statistic for \(S\).  
  - But if \(E\) is relevant to \(S\), it *isn't* a garbling of nothing—so by Blackwell, it must be better (or equal) for all decisions.  
  Good's proof is simpler because it directly uses the option to ignore, which corresponds to the "garbling" that makes \(E\) equivalent to no information.

  ### Dissecting the Apparent Counterexamples
  Now, why do exceptions *seem* to exist? Each violates a core assumption.

  #### 1. **The Hirshleifer Effect (Market Collapse from Public Information)**
  - **Scenario:** In an insurance market, mutual uncertainty allows risk-sharing. If a public signal reveals who will suffer a loss, insurance collapses (e.g., no one insures against certain floods). Everyone might be worse off with the signal.
  - **Why it *seems* like a counterexample:** Information destroys a valuable arrangement that relied on shared ignorance.
  - **The violated assumption: Single decision-maker.**  
    Good assumes one agent controlling all actions. Here, there are *many agents* whose strategies interact. When you get the signal, so do others, and they change their behavior. Your utility \(U(s, a_{\text{you}}, a_{\text{others}})\) now depends on *their* actions \(a_{\text{others}}\), which depend on the signal. The "decision problem" isn't fixed—it's a game. The proof breaks because \(\max_a \mathbb{E}[U|e]\) assumes others' strategies are fixed, but they aren't.

  #### 2. **"I'd Rather Not Know" (Non-Instrumental Value of Belief)**
  - **Scenario:** You wouldn't change your action (e.g., you'll climb the mountain regardless), but you'd prefer not to know the risk of avalanche. Knowing might cause anxiety, even if it doesn't affect behavior.
  - **Why it *seems* like a counterexample:** Information directly harms well-being.
  - **The violated assumption: Purely instrumental preferences.**  
    Good assumes utility depends *only* on \((s, a)\), not on your beliefs or knowledge state. Here, utility has a **doxastic component**: \(U(s, a, \text{belief})\). Knowing the risk adds \(-c\) (anxiety) to utility. Formally, the utility function in the "with evidence" case is *different* from the "without" case. The proof assumes \(U(s, a)\) is invariant.

  #### 3. **Costly Processing or Attention Scarcity**
  - **Scenario:** Even "free" evidence takes cognitive effort. If the info won't change your action, you'd rather not spend mental energy.
  - **Why it *seems* like a counterexample:** Information has hidden costs.
  - **The violated assumption: Truly cost-free evidence.**  
    Good assumes no cost to acquire, process, or attend to evidence. Cognitive load violates this. The theorem applies only if you can ignore the evidence *effortlessly*.

  #### 4. **Self-Fulfilling Prophecies / Information That Changes the World**
  - **Scenario:** Learning you're predestined for failure causes you to stop trying, making failure inevitable. Ignorance might have led to effort and success.
  - **Why it *seems* like a counterexample:** Information alters the state-action mapping.
  - **The violated assumption: Exogenous state space.**  
    Good assumes \(S\) is fixed and independent of your beliefs/actions. Here, \(S\) (success/failure) depends on your action, which depends on your belief. The causal structure violates the static \(U(s, a)\) model. (This is related to evidential vs. causal decision theory.)

  ### The Load-Bearing Assumptions Summarized
  | **Apparent Counterexample**       | **Key Violated Assumption**                     | **Why the Proof Fails**                                                                 |
  |-----------------------------------|------------------------------------------------|-----------------------------------------------------------------------------------------|
  | Hirshleifer (market collapse)     | Single decision-maker                          | Others' actions change; utility depends on their strategies.                            |
  | "I'd rather not know" (anxiety)   | Purely instrumental preferences                | Utility depends on belief state itself.                                                 |
  | Cognitive cost of processing      | Truly cost-free evidence                       | Ignoring evidence isn't free; attention is scarce.                                      |
  | Self-fulfilling prophecies        | Exogenous state space / no belief-effects      | Your belief affects the state \(S\), breaking independence.                            |

  ### Conclusion
  Good's theorem holds watertight *if* you stay within its Bayesian walls: one rational agent, cost-free evidence, instrumental preferences, and no belief-dependent states. The "aha" is that optionality dominates commitment: having the choice to condition on evidence can only help (or do no worse). But once you step outside—into multi-agent games, belief-dependent utility, or endogenous states—the walls crumble, and information can hurt. These aren't "counterexamples" to the theorem; they're reminders that its assumptions are idealizations. The deeper lesson is that information isn't free in reality; it operates in a strategic and psychological context.
