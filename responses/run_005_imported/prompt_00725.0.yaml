prompt: |-
  So I've been down a rabbit hole reading about procrastination and self control lately (side project: a habit tracker app), and I keep running into two ideas that seem to be pointing at the same thing from totally different angles. Philosophers have this concept of "akrasia" / weakness of will - basically knowingly acting against your own better judgement. Economists have "hyperbolic discounting" - where you weight near-term rewards way more heavily than later ones, so your preferences literally flip as a reward gets closer in time. Half the blog posts I read use these like they're just two names for the same phenomenon (i.e. why I'm refactoring code right now instead of doing my taxes). Can you actually compare the two properly for me? Mainly curious whether hyperbolic discounting basically dissolves the old philosophical puzzle of akrasia, or if theres some part of what philosophers mean by "weakness of will" that a discounting curve just can't capture (or the other way round) - a concrete example of a case that'd count as one but clearly not the other would be great too.
