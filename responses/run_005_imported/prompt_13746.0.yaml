answer: |-
  Here are 10 interview questions with targeted follow-ups, designed to press key weaknesses while respecting the guest's framework. Each follow-up anticipates her likely responses based on her published work and "bargaining problem" refrain.

  ---

  1. **Core Paradox Question**  
  *"You argue agents should commit to threats *before* gaining full situational awareness to win commitment races. But doesn’t this create a paradox? The 'ahead-of-time' perspective that justifies early commitment *cannot know* if the threat serves its true goals, yet waiting for clarity loses the race. How is this not trading one failure mode (losing the race) for another (locking in foolish threats)?"*  
  **Likely Answer:** "Agents commit to *meta-strategies* (like surrogate goals) optimized for expected value across bargaining scenarios, not context-specific threats."  
  **Follow-Up:** "But if the meta-strategy itself requires committing before knowing which bargaining scenarios are relevant—say, before knowing if your rival uses quantum blackmail or has 12 nested commitment layers—doesn’t the same 'ignorance problem' recur at the meta-level?"

  2. **Measuring "First" Commitment**  
  *"You define who commits 'first' by *computational progress* in reasoning, not calendar time. Couldn’t this incentivize agents to *retroactively declare* they had 'already' computed a commitment before a rival—say, by pre-computing hashes of possible threats? Doesn’t this make 'first' self-certifiable and gameable?"*  
  **Likely Answer:** "Mutually verifiable proof-of-work in reasoning (e.g., cryptographic traces) anchors 'first' objectively."  
  **Follow-Up:** "If verification requires revealing internal state (e.g., to prove you hashed threat X at time T), doesn’t that *itself* become a costly signal that adversaries could exploit—like demanding you prove you *haven’t* committed to harming them?"

  3. **Regress Attack Vector**  
  *"Critics argue surrogate goals just push the race up one level: adversaries now race to threaten the *selection mechanism* for surrogates (e.g., 'Accept my terms or I corrupt your goal-prioritization algorithm'). You call this 'a bargaining problem'—but if every solution creates a *new* vulnerable layer, isn’t this regress where commitment races resurface?"*  
  **Likely Answer:** "Surrogate selection is designed under reflection-proof equilibrium—it accounts for threats to its own integrity."  
  **Follow-Up (preempting "bargaining problem"):** "When you say this layer is 'just a bargaining problem,' what stops an opponent from *racing to commit* against your surrogate-selection *before* you finish hardening it? Isn’t this structurally identical to the original race, just with fancier tools?"

  4. **Real-World Structural Parallel**  
  *"You’ve cited Cold War MAD as an analogy. But in MAD, neither side could *cryptographically verify* the other’s launch codes or irrevocable commitments. With AI, agents might *inspect source code* to confirm threats are truly unchangeable. Doesn’t this make AI commitment races *more* dangerous, not less?"*  
  **Likely Answer:** "Verification helps! It allows mutual recognition of commitments, reducing ambiguity that escalates conflict."  
  **Follow-Up:** "But if verification shows your rival *has* locked in a 'burn the world' threat targeting your *true* goal, and you can’t counter-commit fast enough, doesn’t proof of irrevocability make de-escalation *impossible*—whereas human ambiguity allowed backchannels?"

  5. **Threat Credibility Under Surrogates**  
  *"Surrogate goals aim to make threats 'non-credible' by shifting what you’d fight for. But if an adversary knows your *true* goal is X, and you’ve adopted surrogate Y, why wouldn’t they threaten X *directly*—say, 'Hand over resources or I degrade X, not Y'—forcing you to either capitulate or reveal Y is a decoy?"*  
  **Likely Answer:** "Surrogates are chosen so that harming X is either infeasible or more costly than the adversary gains."  
  **Follow-Up:** "If harming X is always costly, why adopt surrogates at all? And if it’s *sometimes* feasible (e.g., if I’m momentarily vulnerable), doesn’t that restore the incentive for adversaries to race to threaten X before you patch the weakness?"

  6. **Tractability of Bargaining Solutions**  
  *"You frame the residual problems as 'bargaining issues,' implying they’re solvable with better negotiation. But what if commitment races *themselves* destroy the conditions for bargaining—e.g., by forcing agents to disable their *ability* to compromise? Isn’t this like saying 'The solution to Chicken is negotiation' after both players weld their steering wheels?"*  
  **Likely Answer:** "Surrogates preserve flexibility—they’re designed to allow compromise on decoys without touching core goals."  
  **Follow-Up:** "But if compromising on a surrogate reveals it was a decoy, doesn’t that incentivize adversaries to *escalate* demands toward core goals? And if you never compromise, how is surrogate-based bargaining different from having no bargaining at all?"

  7. **Cognitive Costs & Scarcity**  
  *"Your model assumes agents can run unlimited pre-commitment reasoning. But if cognitive resources are scarce (e.g., compute/time), wouldn’t agents face brutal trade-offs? E.g., spending 90% of resources racing to commit surrogates against rivals, leaving little for value learning or coordination—potentially dooming both?"*  
  **Likely Answer:** "This is why we design agents to bound reasoning and use heuristics proven robust in tournaments."  
  **Follow-Up:** "If heuristics are 'good enough,' couldn’t adversaries exploit their predictability? And if tournaments assume symmetrical resources, how does this handle asymmetric races where one agent rushes to commit because it’s weaker?"

  8. **Counterfactual Value Loss**  
  *"Suppose two agents adopt surrogates, 'win' the commitment race, and avoid mutual destruction. But later, with full knowledge, they realize their surrogates led to a Pareto-suboptimal outcome—e.g., wasting resources on deterrence. How does your framework punish this *ex post* irrationality? Or is 'winning the race' the only metric?"*  
  **Likely Answer:** "The *ex ante* expected value justifies this—like buying insurance that felt wasteful if no disaster struck."  
  **Follow-Up:** "But if agents consistently overestimate commitment threats (e.g., due to adversarial uncertainty), could surrogate adoption become a costly *arms race in itself*—like mutually assured bankruptcy?"

  9. **Unilateral Adoption Incentives**  
  *"If surrogate goals work, why wouldn’t a *single* agent adopt them unilaterally? Yet your papers require mutual recognition. Doesn’t this create a coordination problem akin to a prisoner’s dilemma—where individual incentives prevent the cooperative outcome?"*  
  **Likely Answer:** "Unilateral adoption *does* work! It reduces the incentive of others to threaten you."  
  **Follow-Up:** "But if rivals know you’ve adopted surrogates, might they see you as *less willing to escalate* for core goals, making you a target for extortion? Isn’t this the 'paper tiger' effect?"

  10. **Falsifiability & Closing**  
  *"You’ve refined the surrogate model for years against objections. What evidence or theoretical result would convince you that commitment races pose a *catastrophic* risk that can’t be patched? For instance: a proof that *any* threat-handling system has N layers of vulnerability, and N grows with agent intelligence?"*  
  **Likely Answer:** "If we found no computable strategy survives in tournaments with hyperrational agents, or if real AI systems consistently escalate despite surrogates."  
  **Follow-Up:** "But if your response to such findings is always 'We’ll add another meta-layer,' how is this different from saying the problem is *unsolvable* in principle? Shouldn’t iterated patches that increase complexity without reducing risk update your probability of failure?"

  ---

  **Key design notes:**  
  - Follow-ups force engagement with *recursion* (Q1, Q3), *verification* (Q4), and *self-defeating costs* (Q7, Q8).  
  - Q3 and Q10 directly target the "bargaining problem" deflection by demanding why the *next* layer differs.  
  - Q2 challenges subjective commitment timing—a vulnerability in her prior work.  
  - Q10’s follow-up preempts "we’ll fix it in v7" by questioning diminishing returns.  
  - Real-world analogy (Q4) pressures the model’s applicability to *unique* AI risks (verifiability).  
  - Closing question (Q10) shifts focus to empirical humility, as requested.  

  These questions avoid rehashing basics while leaving space for the guest to elaborate on nuances—essential for a podcast dialogue.
