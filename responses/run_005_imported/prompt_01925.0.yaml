  Ah, right. For Descartes, sensation is a mechanical process. Nerves and brain react to stimuli, producing automatic responses. No consciousness needed. Like a reflex. But thought—reasoning, understanding language—requires an immaterial soul. The user is stuck on why feeling (sensation) doesn't need a soul but thought does. 

