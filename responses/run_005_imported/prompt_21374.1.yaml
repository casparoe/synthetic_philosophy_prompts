answer: |-
  You're wise to question this assumption—your friend is absolutely right that reducing Smith to a cheerleader for empire would be a serious misreading. **A well-read Alan in 1778 would *not* find in *Wealth of Nations* (WN) a coherent defense of the British Empire as it existed; in fact, he'd find its core institutions savagely critiqued.** Here's a breakdown of Smith's actual arguments relevant to your scene:

  1.  **Scathing Critique of Colonial Monopolies (Especially the EIC):**
      *   **Book IV, Ch. VII (Of Colonies):** This is the key chapter. Smith condemns the mercantile system that governs colonies. He argues that the exclusive trade monopolies granted to companies like the East India Company are profoundly *inefficient* and *detrimental* to the home country.
      *   **"A Drain Upon the Country":** Smith famously argues that maintaining distant colonies and the wars associated with them constitute "a drain upon the country" (WN IV.vii.c.80). The costs of defense and administration far outweigh any potential benefits derived *under the monopoly system*.
      *   **Inefficiency and Corruption:** He excoriates the EIC specifically, highlighting its inefficiency, mismanagement, and corruption. He sees it as a vehicle for enriching a small group of merchants and officials at the expense of both the British public *and* the people of India. Smith viewed the EIC's rule in Bengal as disastrous (Book IV, Ch. VII, Pt. 3). Alan invoking Smith to defend his *uncle's* fortune, made under the EIC's monopoly, would be deeply ironic to anyone who'd actually read WN carefully.
      *   **Monopoly vs. Free Trade:** Smith argues the monopoly *prevents* the natural benefits of free trade with the colonies. He believed that if trade were truly open, Britain would benefit *more* through increased commerce, even if it meant competing fairly with other nations.

  2.  **The American Colonies:**
      *   **Costly Burden:** Smith applied the same "drain upon the country" logic to America. He saw the cost of defending and administering the American colonies as a significant burden on Britain.
      *   **Taxation Without Representation:** While not a political radical, Smith understood the American grievance. He famously proposed a solution: **incorporate the American colonies into the British Parliament.** He argued that if America sent representatives to Westminster, the justification for taxing them without representation would vanish, and the colonies could contribute proportionally to imperial expenses (WN IV.vii.c.77). He saw this as the only viable way to preserve the empire *without* injustice.
      *   **Alternative: Let Them Go:** Crucially, Smith also argued that if incorporating America was politically impossible (which he suspected), **Britain should voluntarily grant independence.** His reasoning was pragmatic: an amicable separation would allow Britain to "accommodate her future views and designs to the real mediocrity of her circumstances" and focus on mutually beneficial free trade (WN IV.vii.c.66 & 79). He believed a free America would *still* be Britain's best trading partner out of natural economic interest.

  3.  **"Natural" Expression of Free Trade? No.**
      *   Smith saw the *potential* benefits of global trade and specialization, but **he emphatically did not see the *existing* British Empire, built on mercantilist monopolies, political subjugation, and costly wars, as a natural or efficient expression of those principles.**
      *   The empire, as constituted, was the *antithesis* of the free, competitive, mutually beneficial market system he advocated. It was a state-sponsored, monopolistic distortion.

  **How Alan Might Misread Smith (and How Hector Could Destroy Him):**

  *   **Alan's Naive Argument:** Alan *could* start by enthusiastically quoting Smith on the benefits of specialization, the division of labour, and the potential gains from trade across oceans. He might say something like, "Uncle, surely Smith shows us that the Empire, by extending the market and fostering specialization from Bengal to Boston, is a grand engine of prosperity! It's the division of labour writ large!"
  *   **Hector's Devastating Rebuttal (Using Smith Himself):** Hector, the cynical, practical man enriched *by* the system, would likely pounce:
      *   **On the EIC:** "Prosperity, lad? For whom? For a handful of us 'nabobs' who game the monopoly? Smith calls the Company a 'strange absurdity'! He says its servants plunder India while its management bankrupts itself and burdens England. He calls our Bengal trade a drain on the nation! Your precious philosopher would see my fortune as proof of the *corruption* he denounces, not the prosperity he extols." (Ref: WN IV.vii.c.105-106 on EIC absurdity; general critique throughout IV.vii.pt.3).
      *   **On Empire Generally:** "A grand engine? Smith calls the whole colonial system a 'dead weight'! He calculates the cost of defending and governing these distant lands outweighs any profit gained *by the nation* under these cursed monopoly restrictions. The only winners are merchants like me – and he despises us for it!" (Ref: WN IV.vii.c.60, c.80 - "dead weight" and "drain").
      *   **On America:** "And these rebellious colonists? Your Smith doesn't cheer for Grenville or North! He thinks we should either give them seats in Parliament or *let them go*, man! He thinks taxing them without representation is unjust and that war is economic folly. He'd likely call this war proof of the idiocy of the mercantile system!" (Ref: WN IV.vii.c.75-79 on representation/separation).
      *   **The Final Cynical Thrust:** "You've swallowed the honeyed words about trade and missed the bitter medicine, Alan. Smith writes elegant theories. I deal in realities. The Empire isn't built on his principles; it's built on force, monopoly, and the sweat of others. His book is a condemnation of everything that made me rich and keeps England fighting this damned war. Don't quote *Wealth of Nations* at me to defend the Empire; quote it to bury the fools who run it – and the nabobs who profit from it."

  **Making the Scene Authentic and Dramatic:**

  1.  **Show Alan's Selective Reading:** He's young, idealistic, and dazzled by Smith's grand vision of commercial society. He latches onto the positive principles (trade good, markets efficient) but hasn't fully absorbed or grappled with the devastating *institutional critique* Smith levels against the *actual* empire.
  2.  **Hector's Worldly Cynicism:** He understands the system's rotten core because he's profited from it. He *can* use Smith to demolish Alan precisely because Smith articulates the systemic flaws Hector exploits and embodies. This makes Hector more formidable and Alan's idealism seem naive.
  3.  **Dramatic Irony:** The audience (and Hector) understand that Alan is using Smith against Smith's own conclusions.
  4.  **Historical Nuance:** This reflects a real historical debate. Proponents of empire *did* sometimes try to co-opt Smith's ideas about trade, while critics (and practical men like nabobs) saw the contradictions.

  **Conclusion:** Alan, having seriously read WN in 1778, would be primed to be *critical* of the Empire, the EIC, and the war in America, not to cheer for them. Giving him a pro-imperial speech based on Smith would indeed be a caricature. The dramatic potential lies in his *misreading* or *selective understanding* of Smith, allowing the worldly Hector to dismantle his nephew's idealism using the very book Alan reveres, exposing the harsh reality of empire that Smith himself so powerfully criticized. This creates a far richer and more historically accurate conflict for your scene.
