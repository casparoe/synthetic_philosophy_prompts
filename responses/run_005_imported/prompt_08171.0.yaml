answer: |-
  The humid air of the Congo Basin hung thick as Dr. Elias Vance adjusted the focus on his binoculars. Below, in a sun-dappled clearing, two bonobo females – Kiku and Lana – groomed each other with intense focus. Just yesterday, Kiku had shared a rare cache of ripe figs with Lana, who’d been injured. Now, Lana reciprocated. *Reciprocal altruism in action*, Elias thought, the familiar warmth of professional satisfaction momentarily eclipsing the deeper chill that had settled in him since retirement.

  That chill had a name: Sharon Street’s dilemma. It haunted his newfound passion for metaethics, a specter conjured by decades spent understanding how evolution shaped social bonds. Back at the field station – a modest cluster of buildings buzzing with younger researchers – Elias felt like an interloper in his own life. His worn copy of Street’s paper lay open, the central argument underlined:

  > *Option 1: Evolution shaped our moral intuitions to track mind-independent moral truths. (Implausible, biologically extravagant.)*
  > *Option 2: Evolution shaped our moral intuitions for adaptive advantage (fitness) alone. (Implausible that these intuitions reliably track truth; cosmic coincidence.)*

  Elias’s own concrete conviction, forged in the crucible of his work and life, was a fierce belief in the *intrinsic wrongness of causing unnecessary suffering to any sentient being*. He’d seen chimps torture, yes, but also bonobos console, gorillas mourn. He’d intervened against poachers, funded sanctuaries, lived the conviction. Now, Street whispered: *Was this profound moral certainty just a fitness-enhancing illusion? A trick played by genes to make you cooperative within your tribe?*

  The dilemma crystallized violently that afternoon. A commotion erupted near the perimeter. Mosi, a local field assistant, burst in, face ashen. "Doctor! Poachers… by the old river trail. They shot… shot a silverback. But… there’s a boy. One of theirs. He’s hurt. Bad. Leg trapped in a snare meant for duiker. They… they ran. Left him."

  A jolt of pure, instinctive horror shot through Elias. A child, abandoned, suffering. His conviction flared: *Get him. Help him. Now.* But almost instantly, the evolutionary biologist’s cold counter-voice hissed: *Fitness cost. High risk. Poachers might return. Resources diverted. He’s not kin, not tribe. Your impulse is just evolved tribalism misfiring – urging you to help any distressed signal that *looks* like an in-group member. Street’s Option 2. Your ‘moral truth’ is just noise.*

  He hesitated, paralyzed. Mosi stared, confused by his inaction. "Doctor?"

  **Option 1:** *Did natural selection, blindly optimizing for gene propagation, somehow wire my brain to grasp the *mind-independent truth* that suffering is intrinsically bad?* It felt absurd. Evolution favored traits that aided survival and reproduction in specific environments. Why would it care about abstract, universal moral facts? The extravagance of it!

  **Option 2:** *My powerful impulse to help is *only* the echo of strategies that helped my ancestors survive in small bands. Helping *this* boy offers no fitness benefit, only risk. Therefore, my conviction that helping him is *truly right* is almost certainly false – a remarkable, unjustified coincidence if it somehow aligned with moral truth.*

  The boy’s imagined cries echoed in the silence of his internal debate. He saw Kiku sharing figs, Lana grooming. Cooperation *worked*. But was it *good*, or just *effective*?

  Suddenly, Dr. Anya Petrova, the station's brilliant, fiercely rational mathematician-turned-primatologist, shouldered past Mosi. She was already grabbing the medical kit. "Elias! Move! Philosophical navel-gazing later! That's a *child*!"

  Her pragmatic urgency broke his paralysis. They went. The extraction was tense, dangerous. The boy, maybe ten, was terrified, his leg mangled. As Elias worked to free him, administering morphine, the child’s whimpers cut through the evolutionary theorizing. This was raw, undeniable *pain*. His conviction roared back: *This is wrong. Helping is right.*

  Back at the station, stabilizing the boy, the dilemma returned, sharper, personal. Had he acted on a profound truth, or a biological glitch?

  Anya found him later, washing blood from his hands. "You looked like you were arguing with God back there," she observed quietly.

  "More like arguing with Darwin via Sharon Street," Elias sighed, explaining the dilemma – the sense that his deepest moral certainty might be an evolutionary accident.

  Anya listened, then leaned against the sink. "Street sets a false dichotomy, Elias. What about the third factor?"

  "The third factor?"

  "Yes. Think Parfit. Think geometry." She picked up a stick, drawing in the damp earth floor. "Imagine a mountain range. Evolution is like erosion. It shapes the valleys – the paths of least resistance, the routes that water (or genes) *tend* to flow."

  She drew winding valleys. "Our moral intuitions are shaped by that erosion – they follow those paths. Fitness is the erosive force."

  "Exactly! So they track fitness, not truth!" Elias countered.

  "But," Anya continued, drawing a peak high above the valleys, "what if the mountain itself – the underlying reality – has a specific structure? What if the *truth* about what is good or right *just is* something like… promoting wellbeing, minimizing suffering, fostering cooperation capable of complex flourishing?"

  She tapped the peak, then traced a line down into one of the valleys. "Now, is it a *coincidence* that the paths carved by erosion *often* lead towards that peak? Or is it because the structure of the mountain *constrains* where the valleys can form? The paths of least resistance on *this* mountain naturally tend *towards* the high points."

  Elias stared at the rough diagram. The Third Factor: the nature of reality itself. Anya pressed: "Maybe cooperation, empathy, aversion to suffering *aren't just* fitness-enhancers. Maybe they are *also* constitutive elements of genuine moral value – necessary features of any universe where beings like us can exist and interact meaningfully. Evolution didn't *track* the peak, Elias; it was *channeled* by the landscape *towards* it. Fitness and moral truth correlate because the truth *informs* what sustainable, complex social fitness *looks like*."

  It wasn't a proof. It was a possibility, a different lens. Parfit’s point echoed: Necessary truths – like 2+2=4, or perhaps *'unnecessary suffering is bad'* – don't need a causal history. Their truth is inherent.

  Later, watching the sedated boy sleep, Elias thought of the bonobos. Kiku sharing figs wasn't *just* investing in future reciprocity. There was a raw *concern* in her eyes. Lana's grooming wasn't *just* paying a debt; it was tenderness. Was the landscape of value such that empathy and cooperation *had* to be part of the path upwards, for any social being? Did the erosion of natural selection, while blind, inevitably carve valleys that *tended* towards that peak because the peak defined what a viable, complex social valley *was*?

  He looked at his hands, still faintly stained. The debunking worry hadn't vanished. Street's challenge remained profound, a cold wind blowing through the foundations of ethics. But Anya’s third factor, Parfit’s necessary truths… they weren't surrenders. They were counter-arguments, grounding the map of morality not in the blind cartographer (evolution), but in the inherent structure of the territory itself.

  The boy whimpered in his sleep. Elias’s hand moved instinctively, gently adjusting the blanket. The conviction – *this suffering matters, alleviating it is right* – burned, undimmed. Was it a trick? Or was it a compass, shaped by evolution but somehow, possibly, aligned with the true north of a moral landscape whose existence required no evolutionary justification, only acknowledgement? He didn't have the final answer. But as he sat vigil in the humid African night, the weight of the dilemma felt different. The fear of illusion was real, but so was the possibility of a deeper, necessary truth. And for now, faced with a suffering child, that possibility, coupled with the undeniable reality before him, was enough. The action felt *right*, not just reflexive. He would act on it. He would *trust* it, even amidst the lingering, evolutionary doubt. The map might be shaped by the journey, but the territory, he dared hope, was real.
