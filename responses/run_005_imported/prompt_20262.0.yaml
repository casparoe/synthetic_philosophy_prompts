reasoning: |-
  We are ranking six theories as solutions to the sorites paradox based on two main criteria:
  1. How well they cope with higher-order vagueness.
  2. How much revision of our ordinary semantic and logical intuitions they demand.

  The theories:
  - Epistemicism
  - Supervaluationism
  - Degree-theoretic (fuzzy logic) approaches
  - Contextualism
  - Subvaluationism
  - Nihilism about vague predicates

  Higher-order vagueness refers to the idea that the boundaries of vague predicates are themselves vague. A good solution should handle this without collapsing.

  Revision of intuitions: We consider how much the theory requires us to change our ordinary understanding of logic, semantics, and truth.

  Let's analyze each theory:

  1. **Epistemicism** (e.g., Williamson):
     - Claims that vague predicates have sharp boundaries, but we cannot know them.
     - Higher-order vagueness: It struggles because if boundaries are sharp, then higher-order vagueness (vagueness about where the boundary is) seems to require sharp boundaries at higher levels too, which becomes implausible. It doesn't handle higher-order vagueness well.
     - Revision of intuitions: Requires massive revision. We must abandon the idea that vague predicates don't have sharp boundaries, which is deeply counterintuitive.

  2. **Supervaluationism** (e.g., Fine, Keefe):
     - Truth is what is true in all admissible precisifications. A sentence is true if true in every way we could make the predicate precise, false if false in every precisification, and neither otherwise.
     - Higher-order vagueness: It faces the problem of higher-order vagueness because the notion of an "admissible precisification" is itself vague. This leads to a regress. However, supervaluationists have responses (e.g., by allowing that the admissibility condition is vague but not requiring sharp boundaries). Still, it's a challenge.
     - Revision of intuitions: Requires accepting truth-value gaps and a non-classical logic (e.g., it invalidates the law of excluded middle for borderline cases). Also, it preserves classical logic for non-borderline cases. Moderate revision.

  3. **Degree-theoretic (Fuzzy Logic)** (e.g., Zadeh, Edgington):
     - Truth comes in degrees (e.g., 0 to 1). A sentence like "This is tall" has a truth value between 0 and 1.
     - Higher-order vagueness: It struggles because if we try to set a threshold for when a degree counts as true (e.g., above 0.5), we get sharp boundaries again. Alternatively, if we avoid thresholds, we must account for the vagueness of the degrees themselves. Higher-order vagueness is a well-known challenge for fuzzy logic.
     - Revision of intuitions: Requires a radical overhaul of logic. We must replace classical logic with a many-valued logic, which changes the meaning of logical connectives and inference rules. This is a significant revision.

  4. **Contextualism** (e.g., Raffman, Shapiro):
     - The extension of vague predicates is context-dependent, shifting in response to conversational factors and comparisons.
     - Higher-order vagueness: Contextualism can handle higher-order vagueness by allowing that what counts as a relevant context or comparison class is itself vague. It avoids sharp boundaries by making the shifts in context vague. This is often seen as a strength.
     - Revision of intuitions: It preserves classical logic and bivalence. The main revision is to semantics: we must accept that the meaning of vague predicates is context-sensitive in a way that might be more radical than ordinary context-dependence (like indexicals). Moderate revision.

  5. **Subvaluationism** (e.g., Hyde):
     - Dual to supervaluationism: A sentence is true if true in some admissible precisification, false if false in all. This is a paraconsistent approach (can have true contradictions).
     - Higher-order vagueness: Similar to supervaluationism, it faces the issue of defining "admissible precisification" vaguely. However, it might handle higher-order vagueness similarly by allowing vagueness in admissibility. But the paraconsistent nature might complicate.
     - Revision of intuitions: Requires accepting truth-value gluts (some contradictions can be true) and a paraconsistent logic. This is a radical revision and counterintuitive for many.

  6. **Nihilism** (e.g., Unger, Wheeler):
     - Vague predicates are empty (e.g., there are no heaps, no tall people) because they require sharp boundaries to have non-empty extensions, which they lack.
     - Higher-order vagueness: Avoids the problem by denying that vague predicates have any extension. But this doesn't really solve the paradox; it just accepts the conclusion in an extreme way.
     - Revision of intuitions: Requires us to deny that there are any objects falling under vague predicates (e.g., no heaps, no bald people). This is radically counterintuitive and revises our ontology and semantics drastically.

  Ranking by defensibility, with weight on higher-order vagueness and revision of intuitions:

  We want to place theories that handle higher-order vagueness well and require less revision higher.

  Tier S: Best overall defensibility.
  Tier A: Good but with some issues.
  Tier B: Moderate defensibility.
  Tier C: Significant problems.
  Tier D: Least defensible.

  Analysis:

  - Contextualism: Handles higher-order vagueness relatively well by making context shifts vague. Revision is moderate (classical logic preserved, but context-dependence is emphasized). This might be one of the best.

  - Supervaluationism: Handles higher-order vagueness with some difficulty (regress problem) but has developed responses. Revision: moderate (truth-value gaps, but classical logic mostly preserved). It's a leading theory.

  - Degree-theoretic: Struggles with higher-order vagueness (the problem of sharp thresholds in degrees). Revision: radical (many-valued logic). So, it might be lower.

  - Subvaluationism: Similar to supervaluationism in structure, but the paraconsistent approach is more revisionary. Higher-order vagueness: similar challenge. But paraconsistency is less intuitive than paracompleteness (gaps) for vagueness. So, less defensible than supervaluationism.

  - Epistemicism: Poor on higher-order vagueness (sharp boundaries at every level) and very revisionary (sharp boundaries exist but are unknowable). This is counterintuitive.

  - Nihilism: Avoids higher-order vagueness by denying the predicate has any extension, but the revision is extreme (denying the existence of heaps, etc.). Very counterintuitive.

  Tier List:

