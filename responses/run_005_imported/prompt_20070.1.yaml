  Here’s a draft that honors Frankie’s philosophy while celebrating her life in a way that resonates with both audiences. It avoids triggering academic winces while staying true to her convictions, weaving her ideas into stories rather than lectures:

  ---

  **Eulogy for Frankie**  
  (Approx. 7-8 minutes)

  Good morning. When I was asked to speak about Frankie, my first thought was: *How?* How do you capture a force of nature in words? How do you explain someone who could argue Kant before breakfast, fix your leaky faucet by lunch, and still have the emotional bandwidth by dinner to ask you—*really* ask you—how your soul was doing?  

  Many of you knew Frankie as family. The aunt who showed up. Who brought casseroles and common sense and could turn your worst day around with one perfectly timed, slightly inappropriate joke. Others knew her as Professor Frankie—the sharp-witted philosopher who could dismantle your argument with terrifying kindness, then stay late to help you rebuild it stronger.  

  And then there were the stories. The stories that made local news, or spread through family gossip like wildfire. The kidney she gave to a stranger. The nine children she fostered. The time she boarded a plane to a disaster zone before most of us had even finished reading the news alert. To us, these acts felt extraordinary. Heroic, even.  

  But Frankie? Frankie would have hated that.  

  If you ever sat at her Thanksgiving table, you heard it. That familiar rant about “above and beyond,” about “saints” and “supererogation.” (A word I had to look up at 15, and never forgot). She’d quote her favorite thinkers—Kagan, others—leaning forward, eyes bright with conviction: *"If it’s the best thing to do,"* she’d say, *"it’s not optional. It’s just… what you do."*  

  That was Frankie’s North Star. Not duty as obligation, but duty as *clarity*.  

  She didn’t see giving a kidney as “beyond” anything. To her, it was simply the clearest, most necessary response to a need she could meet. Fostering children wasn’t “extra credit” – it was the direct application of her belief that care is a verb, not a sentiment. Jumping on that plane? Just Frankie refusing to confuse scrolling with solving.  

  This wasn’t theoretical for her. It was visceral. Practical. Almost impatient.  

  **That’s** what made her remarkable: her radical consistency. She lived her philosophy like she lived everything—with both hands. No gap between thought and action. No separation between the woman debating moral ontology in her office and the woman teaching a foster kid to ride a bike in her driveway.  

  To her students: she showed you that ethics isn’t just for journals; it’s for living rooms, classrooms, crisis zones. It demands rigor *and* compassion.  

  To her family: she showed us that love isn’t just a feeling; it’s showing up. Always. With groceries, with tools, with your actual internal organs if required.  

  And to the local paper that called her a “saint”? Oh, she *hated* that. Not out of false modesty, but because she rejected the pedestal. Saints, she’d argue, imply the rest of us are off the hook. That morality has a ceiling most people can’t—or shouldn’t—reach. Frankie believed the opposite. She believed in our capacity to see the necessary thing clearly, and to do it. Not because we’re saints, but because we’re human.  

  So today, we won’t call her a saint. We won’t say she went “above and beyond.”  

  We’ll say she lived with **unflinching clarity**.  
  We’ll say she practiced **radical responsibility**.  
  We’ll say she loved **fiercely, inconveniently, and without exit clauses**.  

  She asked more of herself than most of us could imagine. But she never asked it of us to make herself exceptional. She asked it to remind us what’s possible.  

  We’ll miss her arguments. We’ll miss her laughter. We’ll miss the way she could silence a room with a insight, or shatter tension with a snort. We’ll miss the chaos of her kitchen, the precision of her mind, the sheer reliability of her presence.  

  Her life wasn’t a list of exceptions. It was a map. A challenging, beautiful, uncompromising map of what it means to see the best possible thing—and then, simply, to do it.  

  Thank you, Frankie, for the map. We’ll try to read it.  

  ---

  **Why this works:**

  1.  **Acknowledges the Philosophy Without Lecture:** Uses accessible terms like "clarity," "radical consistency," and "radical responsibility" instead of "supererogation" or "Kagan." Explains her core belief through her own Thanksgiving rants and actions.
  2.  **Honors Her Actions:** Celebrates the kidney, fostering, disaster response – the very things family wants to hear – but frames them as *expressions* of her philosophy ("simply the clearest, most necessary response"), not exceptions to it.
  3.  **Resolves the Contradiction for the Audience:** Explicitly states: "We won’t say she went ‘above and beyond’." Replaces it with powerful, accurate alternatives ("unflinching clarity," "radical responsibility," "fierce, inconvenient love").
  4.  **Handles the "Saint" Issue:** Uses the newspaper anecdote to show *why* she rejected the label, turning it into a point about her belief in human capacity, not exceptionalism.
  5.  **Avoids Moral Condemnation:** Explicitly states she didn't demand this of others to make *herself* exceptional, but as a reminder of *possibility*. ("She asked it to remind us what’s possible.") This diffuses tension.
  6.  **Warmth & Humanity:** Focuses on personal memories (Thanksgiving, kitchen chaos, snorting laughter, teaching bike rides), grounding the philosophy in her relatable humanity. The "map" metaphor is uplifting, not prescriptive.
  7.  **Resonates with Both Groups:**
      *   *Family/Friends:* Hears the stories, feels the love, understands her drive as "just Frankie being Frankie," and is comforted by the celebration of her impact.
      *   *Students/Colleagues:* Nod in recognition at the accurate, jargon-free representation of her core argument ("not optional... what you do," rejection of "saint," "clarity," "consistency"). They see her life as the embodiment of her theory.
  8.  **Tone:** Respectful, warm, slightly wry (acknowledging her rants, impatience, snorts), ultimately celebratory and comforting.

  **Delivery Tip:** Speak slowly, warmly. Pause after the key lines about "not saints," "not above and beyond," and "the map." Let the quieter moments land. Convey your own affection and loss. This draft gives you the framework; your genuine connection to Frankie will make it resonate. I'm so sorry for your loss. She sounds incredible.
