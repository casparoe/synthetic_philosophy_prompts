  - **B Tier**: CooperateBot cooperates unconditionally with all cooperative opponents (including FairBot and PrudentBot), fulfilling the first criterion well. However, it completely fails to resist exploitation, as it is exploited by defectors (e.g., gets the sucker's payoff against DefectBot). It is well-defined but not robust due to its vulnerability.

  - **C Tier**: The clone-detection strategy resists exploitation by defecting against non-clones (including defectors) and is well-defined. However, it only cooperates with byte-for-byte identical copies of itself, failing to cooperate with other cooperative opponents (like CooperateBot or FairBot). This extreme narrowness in cooperation limits its robustness.

  - **D Tier**: DefectBot resists exploitation by defecting unconditionally and is well-defined, but it fails entirely to cooperate with any cooperative opponent (e.g., defects against CooperateBot, FairBot). Its complete lack of cooperation places it low in the ranking.

  - **F Tier (Worst)**: The naive simulator is not well-defined, as it can cause infinite recursion when opponents attempt mutual simulation (e.g., against itself or other simulating strategies). This undefined behavior prevents reliable cooperation or exploitation resistance, making it unusable.

