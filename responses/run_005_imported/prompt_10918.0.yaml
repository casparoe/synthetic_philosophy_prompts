answer: |-
  Here’s a dialogue between two philosophers, **Elena** (defending Sidgwick’s psychical research as a rational extension of his ethics) and **Marcus** (criticizing it as a category error or psychological crutch). They engage directly with each other’s strongest points:

  ---

  **Setting:** A university common room after a seminar on Sidgwick. Coffee cups litter the table.  

  **Elena:** Marcus, I keep circling back to Schultz’s point about Sidgwick’s psychical research. It wasn’t a lapse—it was the *only* empirically disciplined way to resolve the dualism. If egoism and utilitarianism can genuinely conflict, and if reason can’t adjudicate, then Sidgwick *needed* a theistic postulate: a cosmic guarantor that virtue and happiness coincide. But he refused to take it on faith. So he turned to evidence. That’s integrity, not credulity.  

  **Marcus:** Integrity? Elena, this is the same man who resigned his Trinity fellowship over the Thirty-Nine Articles because he wouldn’t affirm what he couldn’t prove. Yet he spends 20 years chasing table-rappings and ghost stories? It’s a contradiction. No empirical fact about spirits or telepathy could *ever* resolve a *normative* conflict. Even if we proved an afterlife, why should that bind *practical reason*? Duty isn’t deduced from cosmic accounting!  

  **Elena:** You’re missing the structure of the problem. Sidgwick’s dualism arises because both egoism and benevolence are axiomatic—yet they pull apart *unless* the universe is providentially ordered. If psychical research could show *empirically* that self-interest and morality *converge* in an afterlife—say, via a cosmic system of justice—it would dissolve the conflict. It’s not about “binding” reason; it’s about revealing that the axioms *don’t actually conflict* in reality. The gap is epistemic, not metaphysical. Evidence bridges it.  

  **Marcus:** But that’s precisely the category error! Suppose we *did* find proof of an afterlife where altruists get rewarded. That’s a *fact*. But Sidgwick’s problem is about *reasons*: why should an egoist *care* about that system? If egoism is truly foundational, it remains authoritative even if the cosmos punishes it! And if it’s *not* authoritative without cosmic backing, then it wasn’t truly self-evident to begin with. Sidgwick wanted a *reason* to be moral when it costs you everything—and no séance can give you that.  

  **Elena:** You’re conflating two things. Sidgwick isn’t seeking a *new* reason; he’s testing whether the *existing* axioms cohere. If the universe guarantees harmony, then the *apparent* conflict vanishes. And his method was scrupulous! The SPR exposed frauds like Eusapia Palladino. Sidgwick wrote, “I remain an agnostic” because the evidence wasn’t there. He treated it as a falsifiable inquiry—exactly like a moral scientist.  

  **Marcus:** A “moral scientist” doesn’t spend decades on controlled experiments with mediums when his own epistemology—Book I of the *Methods*!—demands that self-evident truths be ascertained by reflection, not ouija boards. The desperation shows in his letters: “The year 1887 has gone, and I am nearer to the grave, and no nearer to solving the dualism.” This wasn’t calm inquiry; it was a man gasping for certainty.  

  **Elena:** Or a man holding reason and empiricism together under unbearable tension? Sidgwick saw ethics as fundamentally about human good. If psychical phenomena suggested a broader ontology of consciousness—telepathy as mental “friction,” survival as continuity of personhood—that *could* inform what “good” means. It’s not leap-of-faith theology; it’s updating metaphysics based on evidence.  

  **Marcus:** Updating metaphysics? Elena, this is where it unravels. Sidgwick’s ethics requires *universal* validity. But psychical research, even at its most rigorous, deals in *particular* anomalies. A thousand negative séances don’t disprove an afterlife, and one positive doesn’t prove universal harmony. It’s a quagmire of anecdotes—the antithesis of the axiomatic clarity he demanded in ethics.  

  **Elena:** But he knew that! He called psychical research a “forlorn hope” precisely because its evidence was probabilistic. Yet if there’s *any* chance empirical data could reconcile the axioms, shouldn’t a philosopher pursue it? Otherwise, we’re left with his despair: “The cosmos of duty is a chaos.” That’s not an academic footnote—it’s a cry against futility.  

  **Marcus:** And there’s the rub: you admit it was a “forlorn hope.” But when reason leads you to an aporia, turning to *worse* epistemology—paranormal anecdotes—isn’t admirable; it’s a failure of philosophical nerve. Sidgwick should have sat with the chaos. His resignation from Trinity was brave because he embraced uncertainty. The SPR was the opposite: a 20-year distraction from the harder truth—that reason *might* be fractured.  

  **Elena:** Or it was courage to seek coherence beyond the limits of pure introspection. If the dualism is real, ethics collapses into arbitrariness. Sidgwick refused that. His empiricism was an extension of his rigor: “If the universe isn’t rational, I need to *know*.”  

  **Marcus:** But he didn’t “know.” He died in despair. And that’s the lesson: some gaps can’t be closed by evidence—only by choosing to live with unresolved reason. The SPR wasn’t a footnote to his ethics; it was its elegy.  

  ---  

  **Key engagements:**  
  - **Elena** forces Marcus to confront Sidgwick’s methodological rigor (fraud exposure, agnosticism).  
  - **Marcus** compels Elena to defend why empirical facts (afterlife) bear on normative authority.  
  - Both grapple with whether Sidgwick’s search was a dignified empirical extension or a flight from rational despair.  

  This mirrors Sidgwick’s own tension: Is the quest for cosmic harmony philosophically vital—or a betrayal of reason’s limits? Neither side "wins," but the dialogue sharpens the stakes for your seminar. Would this work as a springboard?
