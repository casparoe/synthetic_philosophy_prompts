answer: |-
  To build the strongest case for your position, I'll rigorously defend the mass-noun/mereological reconstruction of Gongsun Long's arguments, demonstrating how it blocks the equivocation charge and addresses the core objection about intuitive falsity. Following Hansen's hypothesis, we treat "horse" (馬) as referring to the totality of *horse-stuff* (a scattered mereological whole), and "white horse" (白馬) as referring to the *white-horse-stuff* (a proper part of that whole). "Fei" (非) consistently denotes **mereological non-identity** (≠), not set exclusion (∉). Under this model, *at least three arguments become valid with a true conclusion*, and the "equivocation" objection relies on unstated count-noun assumptions.

  ### Core Semantic Framework
  1.  **Mass-Noun Semantics**: Nouns denote *stuffs* or *aggregates*, not sets of individuals. "Horse" = all horse-flesh/essence in existence. "White horse" = the white portion of that aggregate.
  2.  **Mereology**: "White horse" is a *proper part* of "horse." The whole ≠ any of its proper parts.
  3.  **"Fei" (非)**: Unambiguous denial of identity. "A fei B" = "A is not identical to B."
  4.  **Truth of Conclusion**: White-horse-stuff ≠ horse-stuff (just as "the water in this glass ≠ all water").

  ---

  ### Close Analysis: Two Key Arguments Blocking Equivocation
  **Argument 1: The Naming Argument (Shape vs. Color)**
  *   **Sophist's Claim:** "Horse names the shape; white names the color. Naming the color is not naming the shape. Hence white horse is not horse."
  *   **Equivocation Charge (Fraser/Standard View):** Slides between:
      *   "White horse" is not *identical to* the universal "Horse" (possibly true, Platonist reading).
      *   "White horse" does not *belong to* the kind Horse (false).
  *   **Mass-Noun Reconstruction (Blocking Equivocation):**
      1.  "Horse" (馬) names/references the aggregate defined *solely by shape* (ignoring color).
      2.  "White" (白) names/references a *color property*.
      3.  "White horse" (白馬) names/references the aggregate defined by the *fusion of shape and color* – i.e., the overlap of horse-shape-stuff and white-color-stuff.
      4.  The aggregate denoted by "horse" (shape-only) and the aggregate denoted by "white horse" (shape+color) are **mereologically distinct wholes**. The former includes brown/black horse-stuff; the latter excludes it.
      5.  Therefore, white-horse-stuff (A) is **not identical to** horse-stuff (B) (A ⊂ B → A ≠ B). "Fei" has a single, consistent meaning: non-identity of aggregates.
  *   **Why No Equivocation?** The argument relies *only* on the different compositional criteria defining the aggregates and the mereological principle that a whole is not identical to its proper parts. There is no illicit shift between "is not identical to" and "is not an instance of." "Belonging to a kind" is absent; only aggregate identity matters.

  **Argument 2: The Exclusion Argument (Color Inclusivity)**
  *   **Sophist's Claim:** "Horses certainly have no fixed color... But a white horse *does* have a fixed color... That which has no fixed color is not that which has a fixed color. Hence... white horse is not horse."
  *   **Equivocation Charge:** Slides between:
      *   The *concept* "horse" doesn't specify color, while "white horse" does (true).
      *   Therefore, a white horse *object* is not a horse (false).
  *   **Mass-Noun Reconstruction (Blocking Equivocation):**
      1.  "Horse" (馬) references an aggregate *defined without any color restriction*. Its identity condition is *only* shape. It encompasses *all* color-variants of horse-stuff.
      2.  "White horse" (白馬) references an aggregate *defined with a color restriction* (white). Its identity condition is shape *plus* color. It *excludes* non-white horse-stuff.
      3.  The aggregate "horse" (A) has the property of *including all colors* (its definition imposes no color exclusion).
      4.  The aggregate "white horse" (B) has the property of *excluding non-white colors* (its definition imposes this exclusion).
      5.  An aggregate defined without color exclusion **cannot be identical to** an aggregate defined with color exclusion (A ≠ B). They have different compositional criteria and different mereological structures (B ⊂ A).
      6.  Therefore, white-horse-stuff (B) is **not identical to** horse-stuff (A). "Fei" consistently denies identity.
  *   **Why No Equivocation?** The difference in "having/lacking fixed color" is about the *defining conditions of the aggregates themselves*, not about concepts vs. objects. The argument hinges on the principle that aggregates defined by different criteria cannot be identical. "Exclusion" is a property of the *aggregate's definition*, not a statement about instantiation.

  ---

  ### Addressing the Strongest Objection: Intuitive Falsity
  **Objection:** *If "白馬非馬" is literally, non-equivocally true under mass-noun semantics, why did competent speakers find it obviously false? Doesn't this undermine the claim that it expresses a straightforward truth?*

  **Defense (Mass-Noun Position):**

  1.  **Pragmatic Override of Semantic Literalism:** Competence involves *pragmatic* understanding, not just semantics. In everyday contexts:
      *   **"Horse" functions as a cover term:** Uttering "horse" pragmatically *implicates* the availability of any subtype (including white horses) for fulfilling requests or making generalizations ("Bring me a horse" includes white horses). This doesn't make "white horse is identical to horse" *semantically* true; it means the distinction is pragmatically irrelevant for most purposes.
      *   **Functional Similarity Dominates:** For practical purposes (riding, feeding, breeding), a white horse is *functionally equivalent* to other horses. This functional equivalence makes the mereological distinction *pragmatically inert or misleading* to assert in ordinary discourse. Its assertion violates Gricean maxims (Relevance, Manner) by highlighting a distinction without a practical difference.
      *   **Default "Sortal" Thinking:** While the *semantics* might be mass-like, humans naturally think in terms of discrete objects and kinds for interaction. The mass-noun reading is a *philosophical abstraction* revealing underlying semantics, but everyday cognition defaults to a quasi-sortal mode, making "white horse is a horse" seem obviously true.

  2.  **The Dialectical Purpose:** Gongsun Long's goal is likely *not* to make a mundane claim about horse procurement. It's a *philosophical provocation* designed to expose the underlying semantic structure of language and challenge uncritical assumptions about reference and identity. The intuitive falsity *is the point* – it reveals the tension between the literal semantics (mass/mereological) and pragmatic usage (functional/sortal). Competent speakers reject it because they instinctively default to the pragmatic, functional reading essential for daily life, not the literal, mereological semantics.

  3.  **Semantics vs. Metalinguistic Intuition:** Competent speakers' intuitions are about *language use and application*, not necessarily about the *theoretical semantic referent*. They know how to *use* "horse" and "white horse" correctly in context. The mass-noun theory offers an explanation for *why* the language works that way at a fundamental level, even if speakers don't consciously represent aggregates. Their intuition that "white horse is a horse" is "true" reflects the *correct pragmatic application* ("white horse" falls under the cover term "horse"), not a refutation of the literal mereological identity claim. The sophist is making a precise, counter-intuitive claim *about* the semantic referents, not about usage.

  ---

  ### Conclusion: Valid Arguments & Question-Begging Objections
  Under the mass-noun/mereological semantics:
  1.  **Validity & Truth:** The Naming Argument and Exclusion Argument (and likely others like the request argument) are **valid** with a **true conclusion** (white-horse-stuff ≠ horse-stuff). The arguments rely solely on the definitions of the aggregates and mereological non-identity of parts and wholes.
  2.  **Equivocation Blocked:** The charge of equivocation dissolves. "Fei" has a single, consistent meaning (non-identity). The differences highlighted (shape vs. shape+color, inclusivity vs. exclusivity) directly establish distinct aggregate identities.
  3.  **Question-Begging Standard Critique:** The standard "equivocation" diagnosis (Fraser et al.) **covertly assumes count-noun/sortal semantics**. It interprets "horse" as a kind or set and "white horse" as a subclass/subset, making "is not" ambiguous between non-identity and non-membership. This framework *presupposes* the very count-noun structure that Gongsun Long, interpreted through Hansen, is challenging. It begs the question by imposing an alien semantic model onto the text.
  4.  **Intuitive Falsity Explained:** The apparent obvious falsity stems from the dominance of *pragmatic function* and *quasi-sortal cognition* in everyday language use, overriding the literal (but pragmatically irrelevant) mereological truth. This dissonance is precisely what makes the dialogue philosophically profound.

  Your resistance to the equivocation charge is well-founded. The mass-noun reconstruction provides a coherent, non-equivocal interpretation where Gongsun Long's arguments are valid and his conclusion is literally true, exposing a deep, counterintuitive feature of Classical Chinese semantics. The challenge to the count-noun paradigm is the core philosophical contribution, making the dialogue far more than a sophistical sleight-of-hand.
