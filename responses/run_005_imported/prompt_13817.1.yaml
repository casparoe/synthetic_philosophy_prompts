answer: |-
  Here is a rigorous argument against the anti-realist restriction of the Knowability Principle (KP) to "basic" statements, engaging seriously with the parasitism motivation while demonstrating why it fails to license the specific restriction needed to block Fitch's paradox. The core contention is that the semantic dependency of complex statements on basic ones **does not entail** that KP must be restricted to avoid epistemic vocabulary, making the restriction ad hoc in the context of Fitch.

  ### Step 1: Granting the Anti-Realist Semantic Framework
  Assume the anti-realist theory of meaning is correct:  
  - (P1) **Compositionality via Assertibility Conditions**: The meaning (assertibility conditions) of logically complex statements (e.g., conjunctions, disjunctions) is wholly determined by the assertibility conditions of their atomic constituents and their logical structure.  
  - (P2) **Parasitism**: Complex statements inherit their epistemic status (e.g., knowability, warrant) *from* their constituents. A complex statement is knowable only if its constituents are knowable *in the appropriate way* (e.g., a conjunction "A ∧ B" is knowable iff A is knowable *and* B is knowable).  

  This framework *seems* to support restricting KP to basic statements. If complex statements derive their content from basic ones, then—the argument goes—KP should govern only basic truths, and complex truths are knowable *solely in virtue of* their components being knowable.  

  ### Step 2: The Gap in the Motivation: Compositionality ≠ Epistemic Restriction
  The critical flaw lies in conflating **semantic compositionality** with **epistemic restrictivity**. P1 and P2 explain *how* complex statements acquire meaning and epistemic properties, but they **do not entail** that KP *cannot apply* to complex statements. Specifically:  
  - **Compositionality is neutral on universal knowability**: Even if "A ∧ B" is knowable iff A is knowable and B is knowable, this does *not* imply that "A ∧ B" itself falls outside the scope of KP. KP could still hold for complex statements *in virtue of* their compositional structure.  
  - **No ban on self-referential knowability**: P1 and P2 do not forbid a complex statement from being *directly* knowable. They merely specify *how* such knowledge would be structured. For example, knowing "A ∧ B" requires knowing A and knowing B, but this doesn’t preclude "A ∧ B" from being a *candidate* for knowability under KP.  

  **Thus, the parasitism motivation fails to justify *excluding* complex statements from KP’s domain**. It only explains *how* their knowability would be realized.  

  ### Step 3: The Ad Hoc Nature of Targeting Epistemic Vocabulary
  The anti-realist restricts KP to statements *without epistemic operators* (e.g., "K"). But parasitism applies to *all* complex statements, regardless of vocabulary:  
  - (P2) governs logical complexity (e.g., "A ∧ B", "A ∨ B") equally, whether A/B are about rocks or knowledge.  
  - Yet the restriction *only* blocks statements embedding K (e.g., "p ∧ ¬Kp"). This is suspiciously precise: it surgically removes the Fitch-conjunction while leaving other complex statements (e.g., "p ∧ q") untouched.  

  **Why is epistemic vocabulary special?** The anti-realist must argue that:  
  > (i) Statements with "K" are not "basic" (plausible, since "K" is an operator).  
  > (ii) *Therefore*, KP cannot apply to them.  

  But (ii) does not follow from P1 or P2. The semantic dependency of "Kp" on "p" (e.g., knowing "Kp" requires knowing p) is **structurally identical** to the dependency of "A ∧ B" on A and B. If KP can apply to "A ∧ B" *despite* its dependency (since its knowability reduces to its parts), it should equally apply to "p ∧ ¬Kp" *if* its knowability reduces to its parts.  

  ### Step 4: Fitch’s Lemma Exposes the Circularity
  Recall Fitch’s lemma: "p ∧ ¬Kp" cannot be known. Anti-realists claim this is harmless because KP doesn’t apply to such statements. But **the lemma’s proof relies only on:**  
  - (a) The *factivity* of knowledge (Kp → p),  
  - (b) The *non-omniscience* premise (NO),  
  - (c) Elementary logic.  

  **Notably, it does not assume KP or anti-realist semantics.** The unknowability of "p ∧ ¬Kp" is a *logical truth* about knowledge, independent of anti-realism.  

  **The ad hoc move**: Anti-realists use parasitism to restrict KP *specifically* to avoid this lemma. But:  
  - The lemma is a problem *only* because anti-realism endorses KP.  
  - Without the threat of Fitch’s paradox, there would be *no reason* from P1/P2 to exclude epistemic statements from KP.  

  **Thus, the restriction is reverse-engineered**: It is proposed *because* it blocks Fitch’s derivation, not because parasitism demands it. The "motivation" is retrofitted to the technical fix.  

  ### Step 5: Why Parasitism Doesn’t Block Fitch’s Application of KP
  Even granting parasitism, applying KP to "p ∧ ¬Kp" *should* be licit *if* anti-realism is coherent. Consider:  
  1. Suppose "p ∧ ¬Kp" is true (per NO).  
  2. KP (unrestricted) says it must be knowable: ◊K(p ∧ ¬Kp).  
  3. But Fitch’s lemma shows K(p ∧ ¬Kp) entails a contradiction.  

  The anti-realist restriction blocks step 2 by exempting "p ∧ ¬Kp" from KP. But parasitism alone doesn’t justify this:  
  - **Parasitism allows knowability for complexes**: If "p ∧ ¬Kp" is true, its components ("p" and "¬Kp") must each be knowable (per P2).  
  - **"¬Kp" is not "basic"**: It embeds "K", so the anti-realist excludes it from KP. But parasitism doesn’t mark "K" as special—only the *need to avoid Fitch* does.  

  **Crucially, the unknowability of "p ∧ ¬Kp" (via the lemma) is a *pre-existing* logical feature of knowledge, not a consequence of anti-realism**. The anti-realist restriction is ad hoc because it treats this feature as a *boundary condition* for their semantics, rather than deriving it from their core principles.  

  ### Conclusion: The Specific Gap
  The gap lies here:  
  > **Semantic parasitism explains *how* complex statements are knowable, but it does not justify *excluding any class of truths* from KP’s scope.**  

  The restriction of KP to non-epistemic statements is **unmotivated by parasitism alone** and is **indistinguishable from a strategic retreat** to avoid Fitch’s contradiction. It is ad hoc because:  
  - (i) It selectively targets epistemic vocabulary, though parasitism applies uniformly to all complexes.  
  - (ii) It is necessitated *only* by the paradox, not by the internal logic of assertibility semantics.  
  - (iii) It fails to explain why KP *cannot* meaningfully govern complex statements when parasitism already defines their knowability conditions.  

  Thus, while parasitism might *permit* the restriction, it does not *demand* it. The burden remains on anti-realists to show why Fitch-conjunctions are *semantically exceptional*—a burden unmet by appeals to compositionality alone. The restriction remains a rescue device, not a principled consequence of anti-realist theory.  

  **Key reinforcement**: Without Fitch’s paradox, anti-realists would likely endorse *unrestricted* KP (e.g., Dummett’s original proposals). The restriction’s *sole independent motivation* is avoiding absurdity—the hallmark of an ad hoc fix.
