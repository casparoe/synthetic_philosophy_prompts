  Now, the IAU's decision: they defined "dwarf planet" as separate from "planet," excluding Pluto from being a planet. The user points out that terms like "dwarf star" still fall under "star," making the IAU's move seem inconsistent. 

  To reconstruct Gongsun Long's view, I should apply his principles to "dwarf planet." The term "planet" originally included bodies like Pluto. But the IAU introduced a new definition, splitting the category. Gongsun Long would see this as a vindication of his reasoning. He'd argue that "dwarf planet" has additional criteria (like clearing its orbit) that "planet" doesn't require. So "dwarf planet" isn't a "planet" because the compound term has different properties, similar to "white horse" not being "horse."

  Where the analogy holds: both cases involve compound terms with added attributes changing the extension. The seeking argument applies too—asking for a planet might include Pluto before, but now it doesn't, while asking for a dwarf planet specifically points to Pluto and others.

  But the breakdown is in the nature of the terms. Gongsun Long deals with inherent attributes like color and shape, which are perceptual. The IAU's criteria are stipulative definitions based on scientific consensus, not inherent properties. Also, "dwarf planet" includes "planet" in its name, creating a linguistic contradiction that "white horse" doesn't have. Plus, the IAU's decision is a reclassification, not a logical analysis of existing terms.

