prompt: |-
  Okay so my friend Priya and I got into it last night over the statue-and-clay thing — like genuinely heated, we were still re-explaining premises to each other over text at 1am — and now I have to record a podcast episode this weekend with a metaphysician who basically defends the position Priya was pushing, the "constitution without identity" line: her view is that the statue and the lump of clay are two numerically distinct objects even though they share literally every particle and every arrangement of those particles at every moment they coincide. I dont want to just sit there and let her restate the view for forty minutes, I want the episode to actually go somewhere.

  Can you draft me 8-10 interview questions? I want at least one that really presses the grounding problem — if the statue and the lump are made of exactly the same stuff, arranged exactly the same way, for as long as they overlap, what actually makes it true that only one of them could survive being squashed into a ball? I also want one that generalizes the old "too many thinkers" worry beyond persons — if constitution is a real, non-identity relation, doesn't that commit her to two valuable artworks sitting in the same spot, two things weighing exactly one kilo, etc., and isn't that just multiplying objects for free wherever there's a shape? And I'd love a question that brings in the old Chrysippus "Dion and Theon" amputee puzzle (or the Stoic growing-argument stuff more generally), just to see whether her solution is a genuinely general theory of coincidence or something built to fit freshly-sculpted statues specifically. For each question, give me a quick follow-up keyed to whatever dodge she'll probably reach for — my money's on her eventually saying the modal difference is just a "brute" fact about which properties get inherited through constitution — and please, no "what first drew you to metaphysics" filler questions, I want the kind of thing someone who's actually sat with Wiggins and Baker would ask.
