  But then weak discernibility enters—Leibniz's "same object" trick. If objects are related asymmetrically (like "being 2m apart"), they're discernible after all. Applied to persons: if the original and duplicate coexist, their spatial relation ("here" vs "there") breaks symmetry. So they'd be numerically distinct. 

