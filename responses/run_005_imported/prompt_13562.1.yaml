  I need to recall the key arguments. Pylyshyn and Fodor are major impenetrability proponents. They define perception narrowly as early vision—modular, info-encapsulated. Top-down effects, they argue, happen post-perception. But what's the actual criterion? It's about the locus of the effect: early vs. late processing. Genuine penetration would require cognition altering early visual processing itself, not attention or judgment.

