  First, I need to recall Quine's arguments in both texts. In "Two Dogmas," holism means that individual sentences aren't verified in isolation but as part of a web of beliefs. This challenges the analytic/synthetic divide because meaning and fact are intertwined. Now, in the moral values essay, Quine applies holism to ethics, suggesting moral judgments are also adjusted holistically based on experience and feeling. The user's point is that if holism erases one distinction, why not the other?

  The user's inference seems solid, but I should check Quine's reasoning. Why does he maintain a fact/value distinction despite both domains being holistic? The key might be in his correspondence/coherence hedge. Quine grants science a "title" to correspondence theory because scientific claims can be tested against sensory experiences. Ethics, however, relies on coherence with other values and feelings, which aren't empirical in the same way. 

  But is that enough? The user is right that Quine's holism in ethics mirrors his holism in epistemology. So why the asymmetry? Maybe Quine's naturalism prioritizes empirical science as the ultimate arbiter of truth. Even though both systems are holistic, science's connection to sensory input gives it a different epistemological status. Ethics, lacking that direct empirical link, remains in the realm of coherence.

  The user might be implying that Quine is inconsistent. If holism levels the analytic/synthetic distinction, it should do the same for fact/value. But Quine seems to resist that. The deeper need here is to validate their argument for the dissertation, ensuring it holds against potential critiques. They want to pressure-test their inference, so I need to consider counterarguments. 

  One counter is Quine's emphasis on empirical content. Science's truths are tied to sensory evidence, which ethics doesn't have. Feelings in ethics aren't equivalent to observations in science. Another angle is Quine's naturalized epistemology, where science is continuous with itself, but ethics isn't part of that continuity. 

  The user also mentions Quine's "recalcitrant experience and feeling." They might be equating experience in science with feeling in ethics. But Quine likely sees a difference: sensory experiences are public and testable, while feelings are subjective. That could justify the asymmetry. 

  However, the user could argue that this distinction is arbitrary. If holism allows any belief to be revised, including moral ones, why can't ethics have empirical content? Quine's naturalism might exclude ethics from scientific discourse, but that exclusion needs justification beyond holism. 

  In conclusion, the user's inference is strong. Quine's holism does undermine both distinctions, but he maintains the fact/value line by appealing to empirical grounding. The correspondence/coherence distinction is crucial here, though it might rely on an unargued premise about what counts as empirical. The user should address this in their chapter to strengthen their argument.
answer: |-
  Your inference is sharp and well-supported—Quine's framework *does* create significant pressure to collapse the fact/value distinction in the same way as the analytic/synthetic distinction. Let's break down why, and where Quine might resist:

  ### The Core Parallel
  1.  **"Two Dogmas" Mechanism:**  
      -   Holism: Meaning/falsification applies to systems (the web of belief), not individual sentences.  
      -   **Result:** "Analytic" truths aren't immune to revision; they're simply more *central* (less likely to be revised under experiential pressure). The distinction becomes pragmatic (degree of centrality) rather than principled (kind).  

  2.  **"Moral Values" Mechanism:**  
      -   Holism Applied to Ethics: Moral judgments are revised holistically under pressure from "recalcitrant experience *and feeling*".  
      -   **Implication:** No *single* moral judgment is tested in isolation; its fate depends on its fit within the web of *values* and its responsiveness to experiential/affective input.  

  **The Tension:** If holism dismantled the analytic/synthetic line by showing both types are revisable within the *same* web under *experiential* pressure, then applying holism to ethics (where revisions occur under *experiential and affective* pressure within the *value* web) suggests the fact/value line should also collapse into a distinction of *pragmatic centrality*, not kind.

  ### Why Quine Resists Collapse (The Hedge & Its Foundation)
  Quine's "correspondence/coherence" hedge isn't *just* a restatement; it points to the deeper asymmetry he anchors in **naturalized epistemology**. Here's what's doing the work:

  1.  **The Primacy of the *Physical* Web:**  
      -   Quine's naturalism identifies the *scientific* web of belief (physics as paradigm) as the fundamental locus of inquiry into "what there is" and how we know it.  
      -   This web has a privileged, *causal* connection to sensory input ("nerve endings"). Truth here *aims* at correspondence with this physical reality, constrained holistically by recalcitrant *sensory* experience.  

  2.  **Ethics as a *Derivative* Web:**  
      -   While *structured* holistically like the scientific web, the *content* and *input* differ fundamentally:  
          -   **Input:** Pressure comes from "recalcitrant experience *and feeling*". The "feeling" component (moral sentiments, intuitions, desires) is crucial.  
          -   **Content:** Moral values concern prescriptions ("oughts"), preferences, and social coordination, not descriptions of mind-independent physical states.  
      -   **The Key Claim:** The value web lacks the *direct, causal link* to the *physical world* that the scientific web possesses via sensory input. Its "recalcitrance" is primarily *internal coherence* (logical, emotional, social) and *instrumental effectiveness* in guiding action/satisfying desires within the physical world *described* by science. Hence, "coherence" is its lot.

  3.  **Truth as Disquotation (Minimalism) vs. Correspondence (Robust):**  
      -   Quine accepts a *disquotational* view of truth: "'Snow is white' is true iff snow is white." This applies to *any* declarative sentence, including moral ones ("'Killing is wrong' is true iff killing is wrong").  
      -   However, he *reserves* a *robust correspondence theory* (truth as relation to mind-independent reality) *only* for the *scientific* domain. Why? Because *only* science has the methodology (ultimately grounded in sensory checkpoints) to *warrant* claims about that mind-independent reality.  
      -   Moral sentences are "true" in the minimal/disquotational sense, but their "truth-makers" are patterns within human sensibility/sociality, not features of the physical world described by physics. This is the essence of the asymmetry.

  ### Pressure-Testing Your Inference: Where the Collapse Argument Hits Quine
  1.  **Holism Undercuts the Input Barrier?**  
      -   *Your Challenge:* If scientific holism shows *any* belief (even "logical" ones) can be revised under *sufficient* experiential pressure, why can't the *affective* input driving ethical revision be seen as *continuous* with sensory input? Both are natural phenomena.  
      -   *Quine's Likely Response:* While both are natural, sensory input has a unique *epistemic* role as the *causal interface* with the external world science describes. Affective input, while real, doesn't provide *evidence* about that *same* external world; it provides data about our *internal* state and social needs. The "recalcitrance" in ethics isn't primarily about *world-mismatch* but *system-mismatch* (incoherence) or *goal-frustration*.

  2.  **Is the Centrality/Pragmatism Distinction Enough?**  
      -   *Your Challenge:* Quine reduced analyticity to *centrality*. Couldn't the fact/value distinction similarly reduce to *degree of connection to sensory input* (very direct in core science, very indirect in ethics), still within a holistic framework?  
      -   *Quine's Likely Response:* He might accept this *as a pragmatic description within naturalism*. However, he sees the *difference in kind of input* (sensory vs. affective) and *subject matter* (descriptive vs. prescriptive) as justifying the stronger claim that *only* science warrants a *robust* correspondence theory. The "degree of connection" difference is so vast it constitutes a qualitative epistemic difference.

  ### Conclusion: Your Inference Holds Significant Weight
  You are correct that **Quinean holism applied to ethics creates powerful pressure to collapse the fact/value distinction in a manner analogous to the analytic/synthetic collapse.** The pragmatic revision guided by holistic pressures looks structurally identical.

  However, Quine resists this collapse by **doubling down on the core tenets of his naturalism:**
  1.  **The Epistemic Primacy of Science:** Only the scientific web is directly causally constrained by sensory input about the physical world.
  2.  **A Dual Concept of Truth:** Minimal/disquotational truth applies everywhere; robust/correspondence truth applies *only* where the methodology (grounded in sensory input) warrants claims about mind-independent physical reality.
  3.  **The Nature of Input:** Sensory recalcitrance (science) vs. Affective/Coherence recalcitrance (ethics) is a difference in *kind* with profound epistemic consequences within his system.

  **The Correspondence/Coherence Hedge *is* doing the heavy lifting.** It's not *just* a restatement; it's the *application* of his naturalized epistemology to demarcate domains. Whether this defense is *ultimately consistent* given the force of holism is the critical point your chapter can press. Quine seems to grant ethics methodological holism but denies it ontological/epistemic parity based on the *source* and *target* of its "recalcitrance." Your strongest argument is that **holism itself, by emphasizing system-over-sentence and pragmatic revision, undermines the very grounds for this stark separation of source/target.** If *all* beliefs (scientific, logical, ethical) are revised holistically under system-internal pressures triggered by various inputs, the distinction between "correspondence" and "coherence" domains becomes harder to maintain *within the holistic engine itself.* The burden is on Quine to show why *this particular input* (sensory) justifies a unique truth relation, especially when his holism downplays the significance of testing *individual* sentences against *individual* experiences.

  Your pressure-test succeeds: Quine's framework creates a genuine tension, and his resistance relies critically on privileging sensory input and physical description in a way that *might* appear question-begging or inadequately defended *after* granting the holistic model to ethics. This is fertile ground for your dissertation.
