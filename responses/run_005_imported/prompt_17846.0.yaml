prompt: |-
  I sit on my university's student-run Honor Committee, and a seminar on Sartre I'm taking this term has made this week's case hard to shake. A first-year was found responsible for bringing prohibited notes into a final exam, and at the sanctioning hearing she presented testimony from professors calling her scrupulously honest, arguing that the act reflected panic, not who she really is. Our sanctioning guidelines list "character and reputation for integrity" as something the panel "may weigh" in setting the penalty, without saying how much. Half the committee wants to treat the testimony as an ordinary mitigating factor, the way we would for anyone with a clean record; the other half keeps returning to Sartre's point that facticity -- a person's past and traits -- never adds up to a fixed character that could make an act genuinely "out of character," and worries that crediting the plea just rewards the kind of self-flattering excuse he calls bad faith. Write the short memo I'll bring to Friday's meeting: recommend how much weight, if any, the testimony should get, with reasoning the rest of the committee could apply to later cases, and take the strongest version of the other side's argument seriously rather than dismiss it.
reasoning: |-
  Okay, the user is part of a university Honor Committee dealing with a tricky case. A first-year student brought prohibited notes into an exam. Professors testified that she's usually scrupulously honest and that this was a panic-induced mistake. The committee is split on how much weight to give this testimony about her character. Half see it as a standard mitigating factor, while the other half is influenced by Sartre's idea of facticity and bad faith—worried that accepting her plea is just excusing the behavior as "out of character" when character isn't fixed. 

  The user needs a memo for their meeting that recommends how much weight to give the testimony, with reasoning that can be applied to future cases. They specifically want the memo to engage seriously with the Sartrean counterargument, not dismiss it. 

  First, I need to unpack the core tension: Should past behavior matter in sanctioning when Sartre says character isn't fixed? The Sartrean view is strong—it warns against letting someone dodge responsibility by appealing to a "true self" that excuses the act. But outright ignoring testimony feels too rigid; universities do consider character in sanctions (like clean records). The key is finding a middle path where testimony informs but doesn't dictate, focusing on how it illuminates the act itself. 

  For the memo's structure: Start with a clear recommendation, then explain the reasoning. The reasoning must validate the Sartrean concern (bad faith risk) but argue testimony still has limited weight if used carefully. Emphasize that "character" here isn't about fixed essence but patterns of behavior that contextualize the violation. Stress that mitigation comes from how the testimony supports the "panic" claim, not just reputation. 

  The user's deeper needs: They want philosophical rigor (hence citing Sartre) but also practical, equitable guidelines. They might fear the committee is either being too lenient or too harsh. The memo should bridge theory and practice—honoring the existentialist critique while avoiding paralysis in real-world decisions. 

  Strongest counterargument: If we accept "good character" as mitigation, aren't we rewarding privilege? Students with connections to professors get lighter sanctions, and it incentivizes "bad faith" excuses. The response: Limit testimony's role to supporting specific claims (like panic) and treat it as one factor among many, not a free pass. Also, note that ignoring all context could lead to disproportionate sanctions for isolated mistakes. 

  Final tweak: The memo should urge the committee to ask, "Does this testimony help explain the act?" not "Is the student a good person?" That shifts focus from essence to circumstances.
answer: |-
  ## MEMO: WEIGHTING CHARACTER TESTIMONY IN SANCTIONING  
  **To:** Honor Committee  
  **From:** [Your Name]  
  **Date:** [Date of Meeting]  
  **Re:** Sanctioning Deliberation - Case # [Number]; Weight of "Character and Reputation" Testimony  

  ### Recommendation
  **Assign limited, contextual weight to the character testimony.** It should not serve as primary mitigation but may inform the *circumstances* of the violation and the *prospects for restoration*. Weigh it alongside other factors (e.g., premeditation, remorse, impact), **not** as proof the act was "out of character" in an essentialist sense.  

  ### Reasoning: Balancing Facticity and Responsibility  
  1. **The Sartrean Counterargument (Strong Version):**  
     Sartre’s critique of "bad faith" (*mauvaise foi*) is compelling: Appealing to a fixed "character" to disown an act ("*This isn’t who I am!*") is an evasion of radical responsibility. Facticity (past actions, traits, reputation) does not determine essence; the student *chose* to bring notes. Granting significant mitigation based on "good character" risks:  
     - **Rewarding Self-Deception:** Allowing students to use reputation as a shield, avoiding full accountability by appealing to an unchangeable "true self."  
     - **Privileging Perception:** Favoring students with social capital (e.g., those with professor advocates) over those without, regardless of actual conduct.  
     - **Undermining Deterrence:** Implying past behavior excuses present violations, weakening the Honor System’s normative force.  

  2. **Why Limited Weight is Nonetheless Justified:**  
     - **Facticity as Context, Not Excuse:** While character isn’t fixed, past behavior *is* relevant data. A pattern of scrupulous honesty (attested independently) makes a one-time panic response in high stress *more plausible* than for a student with prior violations. This speaks to **circumstance** (panic, not intent to deceive systematically), not inherent "goodness."  
     - **Guidelines Recognize Nuance:** Our guidelines list character as a factor precisely because honor systems address *conduct within a community context*. Ignoring all reputation evidence is as reductive as over-relying on it.  
     - **Restorative Potential:** Evidence of prior integrity may *indirectly* inform **restoration**. A student with a demonstrated pattern of ethical engagement may be more likely to learn from the sanction and reintegrate constructively. This is forward-looking, not backward-justifying.  
     - **"Panic" Requires Corroboration:** The testimony supports her claim of atypical panic. Without it, "panic" is just an assertion. Testimony transforms it into a *contestable fact* for the panel to weigh against evidence (e.g., how notes were prepared/hidden).  

  3. **Safeguards Against "Bad Faith":**  
     - **Not "Who She Is," But "What Happened":** Focus testimony on specific, observed behaviors (e.g., "She cited sources meticulously in all assignments," "She reported a grading error in her favor")—*not* vague endorsements ("She’s a good person").  
     - **Mitigation, Not Absolution:** Character testimony cannot negate responsibility. It can only modestly reduce sanction severity *if* it credibly supports claims about the violation’s nature (e.g., spontaneity under stress vs. premeditation).  
     - **Outweighed by Contradictory Evidence:** If the violation shows clear planning (e.g., notes in tiny font, hidden in clothing), "panic" claims (and supporting testimony) lose credibility.  
     - **One Factor Among Equals:** Give it no more weight than other factors like remorse, cooperation, or the violation’s impact on academic fairness.  

  ### Guideline for Future Cases  
  **Character/reputation testimony is admissible but carries limited weight. It should:**  
  - Corroborate specific claims about the *circumstances* of the violation (e.g., panic, impairment).  
  - Consist of concrete examples of past ethical conduct, not generalizations.  
  - Primarily inform the likelihood of restorative outcomes (e.g., learning, community trust rebuilding).  
  - Never override the core responsibility for the act itself or evidence of premeditation/deception.  
  - Be discounted if used to assert an essentialist "true self" inconsistent with the violation.  

  **Conclusion:** Sartre rightly warns against using "character" to escape freedom and responsibility. However, a blanket rejection of facticity ignores how context informs judgment. We honor both the gravity of the choice *and* the complexity of human behavior by allowing testimony *limited* weight to illuminate the *how* and *why* of the violation—not to redefine the *who*. This upholds accountability while permitting nuanced, individualized sanctioning focused on community restoration.  

  **Vote:** Support weighting testimony as a *secondary* mitigating factor, contingent on its specificity and relevance to the circumstances described.
