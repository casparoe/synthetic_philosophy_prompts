answer: |-
  Here’s a concise, principled draft opinion balancing the "joint commitment" argument with proportional responsibility. It recommends specific findings and consequences for each student:

  ---

  ### Honor Council Opinion: Joint Capstone Report Case  
  **Recommended Findings:**  
  1. **Student A (Fabricator):** Violated academic integrity by knowingly submitting fabricated data.  
  2. **Students B, C, D:** Did not knowingly violate integrity but failed in their duty to ensure the *joint submission’s* overall validity.  
  3. **All Four:** Breached the honor code’s implied duty of collective vigilance when opting for a single shared submission.  

  **Reasoning:**  
  We take the "joint commitment" argument seriously. By choosing to submit *one* document for a *shared* grade—as the syllabus explicitly permits—the group voluntarily assumed responsibility for the *entire* report. This structure creates an inherent duty: each member is both an author of their section and a guarantor of the whole. To treat the report as merely a collection of isolated parts ignores the syllabus’s design and the group’s deliberate choice to present a unified output.  

  However, responsibility is not monolithic. **Student A’s** fabrication was an intentional act of dishonesty, severing the chain of good faith. **Students B, C, and D** did not intend deceit, but their "joint commitment" required reasonable oversight. While they reviewed their *own* sections, they took no steps to verify the integrity of the *complete* work they endorsed as a group. This constitutes negligence, not malice.  

  **Consequences:**  
  | Student | Finding | Consequence |  
  |---------|---------|-------------|  
  | **A** | Major Violation (Fabrication) | Failing grade on capstone; 1-semester probation; mandatory ethics tutorial. |  
  | **B, C, D** | Minor Violation (Collective Negligence) | 20% reduction on capstone grade; required workshop on collaborative integrity. |  

  **Why This Balance?**  
  - **Joint Commitment Upheld:** All face consequences because the group’s choice to submit jointly created shared accountability for the document’s veracity.  
  - **Proportionality Respected:** The fabricator bears primary blame; the others’ penalty reflects their lesser role while underscoring that collaboration demands mutual verification.  

  This approach honors the syllabus’s framework, the honor code’s spirit, and the reality that academic collaboration requires both trust *and* vigilance.  

  ---  

  ### Key Rationale for Your Presentation:
  - **Defend "Joint Commitment":** Emphasize: "The syllabus didn’t just *allow* joint submission—it incentivized it by awarding one shared grade. This created a collective enterprise where reliance on peers was inherent. To benefit from shared credit while disclaiming shared responsibility retroactively undermines academic partnership."  
  - **Address "Didn’t Suspect":** Counter: "Reasonable suspicion isn’t required—reasonable *effort* is. Checking only your own section in a joint submission is like a pilot checking only their cockpit instruments. The group chose to fly together; they share duty for the flight’s safety."  
  - **Practical Impact:** This ruling encourages future groups to implement cross-checks (e.g., data audits) without chilling collaboration.  

  This draft ensures the philosophical argument is central but applied fairly—holding the group accountable *as a group* while differentiating individual culpability.
