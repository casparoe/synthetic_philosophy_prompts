  Game theory: in bargaining, revealing your hand can lead to worse outcomes because opponents adjust. Here, the key is that other agents react to your information state. Good's theorem is single-agent; it doesn't account for how others' strategies change based on your knowledge. The rational choice assumption includes fixed strategies from others, not adaptive ones.

  So the boundary is clear: Good's theorem applies only when the decision-maker can act unilaterally with the new info, utilities remain stable, and no strategic interactions where others observe your knowledge. Each counterexample drops one of these: market dynamics alter feasible actions, infohazards alter utilities, and games involve strategic responses.

