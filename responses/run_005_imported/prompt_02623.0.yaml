  ### Your Separate Questions  
  **1. Name for this paradox?**  
  Yes! This is the **"doctrinal paradox"** (or *discursive dilemma* in philosophy). It was formalized in the 1990s by legal scholars (e.g., Lewis Kornhauser) and parallels **Condorcet’s paradox** in social choice theory.  

  **2. Is Marcus’s "groups are irrational" takeaway standard?**  
  No, it’s overstated. The standard interpretation aligns with Elena:  
  - **Established view:** The paradox reveals that *no aggregation method* satisfies all desirable properties (consistency, majority rule, non-dictatorship).  
  - **Practical takeaway:** Courts/committees must *choose rules in advance* (e.g., U.S. appellate courts often vote issue-by-issue to preserve coherence).  
  - **Key insight:** Individual rationality ≠ group rationality under imperfect voting systems. This doesn’t mean groups are "irrational"—it means their outcomes depend on procedural choices.  

  **Example in law:** Real courts avoid Elena’s inconsistency by typically using issue-by-issue voting. But legislatures might prioritize bottom-line votes for democratic legitimacy. Neither is objectively "wrong"; it’s a design choice.
