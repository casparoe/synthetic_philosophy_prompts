answer: |-
  ## Eulogy for Dr. [Colleague's Name]

  We gather today with heavy hearts, united by the profound loss of Dr. [Colleague's Name]. Her sudden passing leaves a void – in our department, in the world of ideas she so passionately inhabited, and in the lives of everyone here who cherished her intellect, her wit, and her friendship. Fifty-four years feels painfully short, a reminder of the fragility we all share.

  [Colleague's Name] was a brilliant historian of early analytic philosophy, dedicating much of her remarkable career to understanding the mind of Frank Ramsey. Ramsey, the dazzling Cambridge thinker who himself left us at only twenty-six, offered her not just intellectual fascination, but a profound resonance with his worldview. She deeply admired his unflinching clarity, his commitment to reason, and his complete absence of religious belief. It wasn't faith she found in his work, but something perhaps more challenging and ultimately, for her, more sustaining.

  She often spoke, with characteristic sharpness, about Ramsey’s short essay, "Epilogue." What drew her wasn't that it offered solace about death, but that it fundamentally questioned the *need* for a certain kind of solace. She’d paraphrase his arresting sentiment: He felt no humility before the vastness of the cosmos. Why? Because however immense the stars may be, **they cannot think or love.** For Ramsey, and for [Colleague's Name], it was precisely these capacities – thought, love, connection, the messy business of human understanding and care – that imbued existence with meaning. Size, scale, eternity... these were not the metrics that mattered. What mattered was the quality of the mind and the depth of the heart right here, right now.

  This wasn't cold rationalism; it was the foundation of [Colleague's Name]'s vibrant warmth. Her fierce intellect wasn't aloof; it was engaged, probing, and deeply humane. She thought critically because she *cared* – about truth, about argument, about her students wrestling with complex ideas, about her colleagues' work, and about the people in her life. Her love wasn't abstract; it was present in her sharp humor that could disarm tension, in her unwavering support for junior scholars, in the meticulous care she took with her work, and in the loyalty she offered her friends and family.

  She would have rejected utterly the notion that her death is easier to bear because a single life is insignificant against the backdrop of the universe. To her, the universe’s sheer scale was irrelevant. What *was* relevant, what *was* significant, was the unique constellation of thought and feeling that was *her*. She would have equally rejected any suggestion of an afterlife watching over us. Her presence was resolutely *here*, in this world, in the conversations she sparked, the arguments she honed, the minds she challenged, and the hearts she touched.

  So, how do we honour [Colleague's Name]? How do we speak of her absence without reaching for consolations she found unnecessary? We honour her by embracing the very things she, following Ramsey, held paramount.

  We honour her by **thinking clearly.** By engaging with complex ideas, by seeking truth with rigor and intellectual honesty, just as she did. We honour her by championing reason, not as a cold tool, but as a vital expression of our humanity.

  We honour her by **loving fiercely.** By investing deeply in our connections – in our families, our friendships, our intellectual communities. By offering support, sharing laughter, and showing up for each other with the same vibrant presence she brought to our lives.

  The vastness of the heavens remains. But [Colleague's Name] taught us, through her work and her life, that the true measure of significance isn't found there. It’s found in the spark of understanding in a student's eyes, in the shared pursuit of an idea, in the comfort of genuine friendship, in the courage to face the world without false comforts, armed only with reason and love. That was her legacy. That is what mattered to her. And because it mattered so deeply to her, it resonates powerfully with us now.

  Her light, the light of a thinking, loving mind, may be gone from our sight. But the warmth it generated, the paths it illuminated, and the example it set, remain. Let us carry that forward, thinking and loving, in her memory.
