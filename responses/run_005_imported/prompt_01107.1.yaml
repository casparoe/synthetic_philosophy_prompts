  First, I need to recall Lewis's key points. He defines convention as a solution to coordination problems, relying on common knowledge and arbitrary regularity. The user questions why this complex framework is necessary when "social norm" seems sufficient. They also bring up Gilbert's argument about the moral dimension Lewis misses.

