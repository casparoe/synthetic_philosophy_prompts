prompt: |-
  Hey, random one for you. I'm poking at a piece about why totally arbitrary social habits — which side of the road we drive on, what counts as a "normal" tip, even office stuff like people saying "per my last email" instead of just asking again — end up feeling almost mandatory even though nobody voted on them or signed anything. Went down a rabbit hole and read the Stanford Encyclopedia entry (and skimmed maybe half the actual book, don't judge me) on David Lewis's 1969 "Convention," where he builds this pretty elaborate game-theory machine to define the term: a convention is a regularity that solves a recurring coordination problem, kept in place because everyone conforms, everyone expects everyone else to conform, everyone prefers to conform given that expectation, and the whole thing rests on "common knowledge" — that weird infinite-regress thing where I know that you know that I know, forever — plus it has to be arbitrary, in that some other regularity would've worked just as well.

  Heres my confusion, and my editor wants the plain-English version anyway: isnt that basically just... a social norm? "People do an arbitrary thing because everyone else does it and expects them to" feels like exactly what a normal person already means by "convention" or "custom," no fancy apparatus required. So could you actually compare Lewis's specific technical account against that more general, folk notion of a social norm — is he really picking out something narrower or more precise than the everyday concept, and if so, what is the coordination-equilibrium-plus-common-knowledge machinery buying him that the folk version can't get on its own? I also came across a reference to Margaret Gilbert arguing that because Lewis builds conventions purely out of self-interested expectations, his picture can't explain why breaking one feels like you've wronged people, not just been impractical or rude — which sounds like a real gap to me, but I don't know either theory well enough to judge if that's fair. Would love an actual comparison of the two ideas, including where the "special sauce" of Lewis's version is supposed to be and whether it survives that objection.
