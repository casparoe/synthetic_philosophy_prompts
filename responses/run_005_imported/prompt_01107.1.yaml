  I should start by breaking down Lewis's definition: coordination equilibrium, common knowledge, arbitrariness. Then contrast with everyday norms, which might not require coordination problems or common knowledge. For example, tipping is a coordination solution, while small talk isn't necessarily. Highlighting the precision Lewis adds by requiring mutual expectations and alternatives.

  Next, Gilbert's critique about the moral aspect. Lewis's model is based on self-interest, so breaking a convention is impractical, not a moral wrong. Gilbert argues for joint commitments creating obligations. This is a valid gap, especially for norms with perceived duties, like queuing. But Lewis's focus might still apply to pure coordination norms, like driving sides.

  The user might also need examples to illustrate these differences. Real-world cases like driving versus tipping can show where Lewis's model fits and where it falls short. Emphasizing that his framework is a specific subset of social norms, useful for analyzing coordination but not all social rules.

  Finally, assessing if the "special sauce" is worth it. For certain applications, like game theory or institutional design, the precision matters. But for everyday understanding, folk concepts suffice. Conclude that Lewis's model is a powerful tool for specific cases but doesn't cover all social norms, especially those with moral weight.
answer: |-
  You've hit the nail on the head regarding the core tension! Lewis *is* trying to rigorously define a *specific subset* of social norms – the ones that solve coordination problems – using game theory and common knowledge. While it overlaps heavily with the folk concept of "convention" or "custom," his definition is deliberately narrower and more precise. Here's the breakdown:

  **The Folk Concept of a Social Norm (The "Kitchen Sink" View):**

  1.  **Broad Scope:** Encompasses *any* widely shared rule of behavior within a group.
  2.  **Basis:** Can arise from tradition, morality, authority, convenience, coordination, or simple inertia. The "why" is often fuzzy.
  3.  **Enforcement:** Relies on a mix of internalization (guilt/shame), social sanctions (disapproval, gossip, ostracism), and sometimes formal rules.
  4.  **"Oughtness":** Often carries a sense of *obligation* or "this is how things *should* be done." Breaking it feels morally or socially *wrong*.
  5.  **Examples:** Tipping, driving on the right/left, saying "bless you" after a sneeze, not talking loudly in a library, wearing black to a funeral, queuing.

  **Lewis's Technical Concept of Convention (The Precision Tool):**

  1.  **Narrow Scope:** *Only* applies to behaviors that solve a **recurrent coordination problem.** This is crucial. A coordination problem exists when:
      *   Multiple individuals need to coordinate their actions to achieve a mutually beneficial outcome.
      *   There are *multiple possible stable solutions* (equilibria), but *no inherent reason* to prefer one solution over another *except that others are choosing it*.
      *   Everyone prefers to conform *if* others conform.
  2.  **The Arbitrariness Requirement:** This isn't just "weird," it's essential. It means *another regularity could have solved the problem equally well* (driving on left vs. right; "Hello" vs. "Hi"; file naming convention A vs. B). The *content* doesn't matter, only the *coordination* does.
  3.  **Self-Sustaining Expectations (The Game Theory Core):**
      *   **Regularity:** People *do* conform to R.
      *   **Mutual Expectations:** Everyone *expects* everyone else to conform to R.
      *   **Preferential Conformity:** Everyone *prefers* to conform to R *conditional* on expecting others to conform to R (it's an equilibrium).
      *   **Common Knowledge:** It's not just that *you* expect others to conform, but you know *they* expect *you* to conform, and they know *you know* they expect you to conform, and so on... ad infinitum. This prevents the coordination from unraveling due to doubt.
  4.  **Basis:** Purely instrumental rationality and mutual expectations. People conform because it's in their *individual self-interest* to coordinate, given their expectations about others.
  5.  **"Oughtness"?** Lewis's conventions *lack* inherent moral obligation. Conforming is simply the rational, self-interested thing to do *given the expectations*. Breaking it is primarily *irrational* or *impractical* (you crash your car, your email gets ignored, you look foolish/out-of-step), not necessarily *immoral*. The "ought" is conditional: "If you want to coordinate successfully, you *ought* to do R."
  6.  **Examples (Lewisian):** Driving side, traffic lights (red=stop), currency, language (the word "dog" meaning dog), standard time zones, QWERTY keyboard, "Reply All" vs. "Reply" norms in email.
  7.  **Counter-Examples (Things that *aren't* Lewisian Conventions):**
      *   *Moral Taboos:* Not murdering isn't arbitrary; it solves a problem, but the alternatives aren't equally good. It's based on fundamental values, not pure coordination.
      *   *Purely Sanctioned Norms:* Wearing a specific uniform *only* because you'll be fired isn't primarily about coordination with peers; it's about obedience to authority/punishment.
      *   *Norms Without Coordination Problems:* Saying "Bless you" after a sneeze isn't solving a coordination problem; it's tradition/courtesy. Small talk serves social functions, but isn't primarily about aligning actions for mutual benefit like avoiding collisions.
      *   *Unique Solution Norms:* If there's only *one* obvious way to solve a problem (e.g., the most efficient route between two points), it's not arbitrary and thus not a Lewisian convention.

  **What the Fancy Machinery Buys Lewis (The "Special Sauce"):**

  1.  **Precision & Predictive Power:** It precisely defines *which* norms will be stable and self-sustaining *without* needing constant enforcement, authority, or moral internalization. It predicts *why* a convention persists once established and *how* a new one can emerge (through precedent/salience).
  2.  **Explains Arbitrariness:** Game theory explicitly models why *any* arbitrary solution, once established, is stable as long as everyone expects it. The "focal point" concept explains how one solution gets selected initially.
  3.  **Highlights the Coordination Problem Core:** It isolates norms whose *primary function* is alignment, separating them from norms based on morality, efficiency (non-arbitrary), or pure authority.
  4.  **Common Knowledge as Glue:** This solves the "how do we *know* we're coordinating?" problem. Without common knowledge, doubt ("Do they *really* expect me to drive on the right? Do they know *I* know?") could cause coordination to break down. CK makes the expectation infinitely robust.
  5.  **Foundation for Complex Systems:** Provides a rigorous framework for analyzing language, institutions, markets, and technology standards as systems built on layers of conventions.

  **Margaret Gilbert's Critique (The "Wronging" Objection):**

  Gilbert argues Lewis's model is fundamentally incomplete because it misses the **collective intentionality** and **obligation** inherent in many conventions.

  1.  **Joint Commitment:** Gilbert argues conventions arise from a *joint commitment* by the group. We *together* commit to doing R as a body. This creates mutual obligations.
  2.  **Obligation, Not Just Preference:** When you break a convention, you don't *just* act irrationally or annoy people; you *violate an obligation* you owe to the group because of the joint commitment. You've *wronged* them. The feeling is "You *shouldn't* have done that (to us)," not just "That was dumb/inconvenient."
  3.  **Lewis's Gap:** Lewis's model, based solely on individual preferences and expectations, can only explain *disappointment* or *frustration* when a convention is broken. It struggles to explain the specific feeling of *entitlement* to conformity and the sense of *being wronged* or having a *right* to complain that often accompanies breaches (e.g., queue-jumping feels like a personal affront, not just inefficient).
  4.  **Is the Critique Fair?** It's a powerful and widely accepted critique **for a significant subset of conventions**, especially those deeply tied to group identity or fairness (like queuing norms). Lewis's model seems too "bloodless" to capture the normative force. *However*, it likely works very well for purely instrumental, low-stakes conventions where the "wronging" feeling is minimal (e.g., using an unexpected file format might annoy colleagues but rarely feels like a moral violation). Gilbert highlights a dimension Lewis deliberately excluded.

  **Conclusion for Your Editor (Plain English):**

  Think of social norms as a big, messy toolbox. Lewis isn't describing the whole toolbox; he's meticulously defining *one specific, incredibly important tool* inside it: the "coordination wrench."

  *   **Folk "Convention":** "We do this arbitrary thing because everyone else does it, and it's just the way things are done. It feels kinda mandatory, and breaking it seems wrong or rude."
  *   **Lewis's "Convention":** "We *all* keep doing this *specific arbitrary thing* because it solves a recurring problem where we *need* to match each other's actions (like not crashing cars). Crucially: 1) *Other solutions would have worked just as well*, 2) *Everyone expects everyone else to keep doing it*, 3) *It's common knowledge that we all expect this*, and 4) *It's simply in each person's self-interest to go along with the crowd* given these expectations. Breaking it is mainly dumb or inconvenient, not necessarily evil."

  **The "special sauce"** (game theory + common knowledge) lets Lewis precisely explain *why* these particular norms are so stable and self-sustaining without needing bosses or guilt trips. **The gap** identified by Gilbert is that Lewis's wrench can't explain *why* breaking some of these norms (like cutting in line) feels like you've personally violated a promise to the group, not just been inefficient. His model explains the *coordination*, but not the deeper sense of *collective obligation* some conventions carry. Both views capture essential, but different, aspects of how arbitrary rules govern our lives.
