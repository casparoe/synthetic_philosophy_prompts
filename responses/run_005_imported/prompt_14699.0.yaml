  First, I should map their exchange chronologically. Marcus starts with calibration fairness. That's logically solid because if a 20% score means 20% default risk for every group, the model isn't over/under-predicting for any demographic. But Priya's counter about false-positive rates being higher for Black applicants hits harder ethically - denied creditworthy applicants feel real harm, and regulators like the CFPB do monitor disproportionate impact. 

