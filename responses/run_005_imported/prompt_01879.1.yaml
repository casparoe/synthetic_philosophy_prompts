  This topic revolves around Jeff McMahan's revisionist ethics of war. McMahan argues that liability to be killed depends on moral responsibility for contributing to an unjust threat. Therefore, unjust combatants are not morally equal to just combatants. Traditionalists counter with an epistemic argument: soldiers can't reliably know if their cause is just, so it's unfair to hold them individually liable, and the moral equality of combatants should remain a practical norm.

  I should start by explaining McMahan's position clearly. His key point is that moral responsibility for an unjust threat makes one liable to defensive harm. This undermines the traditional doctrine of moral equality, which holds that all combatants share equal permissions and liabilities regardless of the war's justice.

  The traditionalist epistemic argument claims that soldiers lack the capacity to make reliable judgments about their war's justice. Factors like propaganda, information control, and cognitive biases prevent them from knowing. Thus, holding them liable based on uncertain justice is unfair, and moral equality serves as a practical norm to avoid punishing soldiers for unavoidable ignorance.

  McMahan's rebuttal is crucial here. He distinguishes between justifiability and excusability. An act can be objectively unjustified (wrong) but subjectively excusable due to epistemic limitations. So, unjust combatants might be excused for their actions, but that doesn't make their killing justified or alter their liability. Excuses don't negate liability; they only affect blameworthiness. This means the epistemic argument doesn't restore moral equality—unjust combatants are still liable, even if excused.

  I need to weigh both sides. For the traditionalists, the epistemic constraints are real. Soldiers operate under severe informational limitations, and demanding perfect moral discernment is unrealistic. The fog of war extends beyond the battlefield to moral clarity. Insisting on individual liability could paralyze military operations and erode unit cohesion. Plus, asymmetric application might occur, where powerful states impose liability judgments unilaterally. Moral equality as a practical norm maintains a clear, binary framework: combatant vs. non-combatant, which simplifies international law and reduces friction.

  On McMahan's side, maintaining the distinction between justification and excuse is philosophically robust. Excuses mitigate blame but don't change the objective wrongness of actions. If we accept moral equality in practice, we grant unjust combatants permissions they don't morally deserve, which could encourage participation in unjust wars. Also, epistemic limitations vary—some soldiers might have better access to information or critical capacity. A blanket equality norm overlooks these differences. Furthermore, McMahan suggests that soldiers have a duty to investigate their war's justice, so pleading ignorance isn't always valid.

  I should also consider deeper tensions. The traditionalist view prioritizes practicality and the functional needs of military operations, while McMahan emphasizes moral truth and accountability. There's a risk that McMahan's approach could lead to excessive second-guessing of soldiers, but he might argue that acknowledging liability even with excuses still allows for respectful treatment post-conflict, like not punishing excused unjust combatants.

  For my verdict, I think McMahan has the stronger argument. The epistemic challenge is significant but doesn't collapse liability into equality; it just makes excuses more common. Upholding moral equality in practice grants unjust combatants undue legitimacy and weakens deterrents against unjust wars. A better approach might be a graded liability system that considers individual epistemic circumstances without reverting to blanket equality. This balances moral principles with practical realities better than the traditionalist norm.

