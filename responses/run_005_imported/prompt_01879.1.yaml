  ## The Unsteady Shield: Why Epistemic Constraints Fail to Rehabilitate Combatant Equality

  Jeff McMahan’s revisionist project fundamentally challenges the traditional Just War Theory doctrine of the moral equality of combatants (MEC). By grounding liability to be killed in individual moral responsibility for contributing to an unjust lethal threat, McMahan argues that unjust combatants are, typically, morally liable to defensive killing by just combatants, while the reverse is not true. This dissolves MEC, the notion that combatants on both sides share equal moral permissions and liabilities regardless of the justice of their cause. Traditionalists counter with a potent **epistemic argument**: ordinary soldiers, immersed in the "fog of war" amplified by propaganda, state control, and limited information, are rarely positioned to know *with sufficient certainty* whether their war is just. Holding them individually liable based on an objective assessment of the war's justice they cannot reliably access is therefore profoundly unfair. Consequently, MEC should be retained as a practical norm governing judgment and conduct in war, *even if* McMahan is correct about the "deep morality." Assessing whether this epistemic challenge successfully rehabilitates MEC as a practical norm requires engaging McMahan's key rebuttal – the distinction between *excusability* and *justifiability* – and weighing the competing demands of fairness, practicality, and moral truth.

  **The Traditionalist Epistemic Argument: Fairness in the Fog**
  The traditionalist case rests on the profound epistemic burdens soldiers face:
  1.  **Information Scarcity & Manipulation:** Soldiers operate within hierarchical structures where information is tightly controlled, often filtered through nationalist propaganda, security classifications, and deliberate misinformation. Access to independent, critical analysis of the war's *jus ad bellum* justification is severely limited.
  2.  **Cognitive Limitations & Bias:** Even with information, soldiers face immense cognitive pressures – in-group loyalty, deference to authority, fear, the urgency of combat, and the sheer complexity of geopolitical realities. Objectively weighing competing claims about proportionality, last resort, or legitimate authority under such conditions is arguably beyond reasonable expectation.
  3.  **The Demand for Certainty:** McMahan's liability model implicitly requires a near-certain judgment about the objective justice of the cause to assign liability. The traditionalist argues this level of certainty is unattainable for the individual soldier. Holding them liable based on a truth they *could not* know seems akin to punishing unavoidable ignorance.
  4.  **Practical Necessity & Fairness:** Given this pervasive uncertainty, MEC provides a clear, workable, and *fair* rule for the battlefield. It treats combatants symmetrically based on their role (combatant status) rather than asymmetrically based on an unknowable moral truth. This avoids the paralyzing doubt and potential for abuse that might arise if soldiers constantly second-guessed the justice of their own cause or hesitated to defend themselves against "possibly just" enemies. It upholds a form of procedural fairness amidst chaos.

  **McMahan's Rebuttal: The Excuse/Justification Chasm**
  McMahan’s core response is that the epistemic argument commits a fundamental category error: **it conflates the *excusability* of an unjust combatant with the *justifiability* of their actions or their *liability* to defensive harm.**

  1.  **Justification vs. Excuse:** An action is *justified* if it is objectively morally permissible (e.g., a just combatant killing an unjust combatant posing a threat). An action is *excused* if it is objectively wrong but the agent is not fully blameworthy due to mitigating factors like ignorance, duress, or mistake. McMahan argues that even if an unjust combatant is *excused* for fighting (due to invincible ignorance fostered by their state), their actions remain objectively *unjustified*. They are still materially contributing to an unjust lethal threat.
  2.  **Liability Grounded in Threat, Not Blame:** Liability to defensive killing, for McMahan, is primarily grounded in the *objective moral responsibility for contributing to an unjust threat*, not in subjective blameworthiness or culpability. If an unjust combatant is objectively responsible for contributing to an unjust threat (even if excusably ignorant), they are liable to be killed to prevent that threat. Their excuse may mean we shouldn't *blame* them morally or punish them after the fact, but it doesn't magically transform their threatening actions into justified ones or negate the just combatant's right to defend against them.
  3.  **MEC as a Dangerous Fiction:** Granting MEC as a practical norm, McMahan contends, does more than acknowledge epistemic limits; it actively *misrepresents* the moral reality. It tells the unjust combatant that their killing is permissible, effectively granting them a moral license they do not possess. This undermines the crucial deterrent function of moral norms against participating in unjust wars and erodes the distinction between just and unjust warfare at the practical level it matters most. Practicality shouldn't demand embracing a moral falsehood.

  **Weighing the Scales: Practicality vs. Moral Truth**

  *   **Strengths of the Epistemic Argument:**
      *   **Realism about Soldier Cognition:** It accurately captures the immense difficulty soldiers face in making independent moral judgments about their war. The pressures are immense, and demanding Olympian moral discernment seems unreasonable.
      *   **Procedural Fairness & Predictability:** MEC offers a clear, binary rule (combatant vs. non-combatant) that simplifies decision-making in the lethal chaos of war. It prevents the chaos and potential for abuse if liability hinged on contested, individual judgments about *jus ad bellum* made under fire. It protects soldiers from being held liable for circumstances beyond their ken.
      *   **Maintaining Functionality:** Military operations rely on discipline, unit cohesion, and obedience. Constant internal moral questioning based on uncertain *ad bellum* judgments could be paralyzing and operationally disastrous. MEC provides psychological stability.

  *   **Strengths of McMahan's Rebuttal:**
      *   **Conceptual Rigor:** The justification/excuse distinction is a bedrock of moral philosophy. Ignorance *can* excuse blame but doesn't erase objective wrongness or the threat posed. Conflating them is philosophically muddled.
      *   **Moral Hazard:** Institutionalizing MEC as a practical norm actively facilitates participation in unjust wars. If soldiers believe (or are told) their moral status is equal regardless of cause, the moral barrier to fighting for an unjust state is significantly lowered. It provides a dangerous moral carte blanche.
      *   **Diminished Accountability:** While not demanding punishment for excusable ignorance, McMahan's view maintains the crucial moral truth that fighting for an unjust cause *is wrong*, even if often excusable. This preserves a vital normative standard and avoids whitewashing aggression.
      *   **Nuance is Possible:** McMahan doesn't require *perfect* certainty. Soldiers can have a *duty to inquire* reasonably into the justice of their cause. Liability assessments can be probabilistic and context-sensitive, acknowledging degrees of responsibility and access to information. Not all ignorance is equally invincible.

  **Verdict: The Epistemic Shield Cracks – MEC Fails Rehabilitation**

  While the traditionalist epistemic argument powerfully highlights the brutal realities soldiers face and the genuine unfairness of demanding impossible moral certainty, it ultimately fails to rehabilitate the moral equality of combatants as a defensible *practical norm*. Granting McMahan's core premise about deep morality is fatal to MEC.

  McMahan successfully exposes the argument's fatal flaw: **it mistakes an excuse for a justification.** The tragic epistemic constraints of soldiering may often *excuse* unjust combatants from blame, rendering them non-culpable or less culpable, but they do not alter the *objective moral character* of their actions. An excusably ignorant combatant who contributes to an unjust threat remains objectively liable to defensive killing. To treat them as morally equal to a just combatant defending against that threat is not merely a practical simplification; it is an endorsement of a moral falsehood with pernicious consequences.

  Upholding MEC as a practical norm, even based on epistemic concerns, actively *obscures* the crucial moral asymmetry McMahan identifies. It sends the message that fighting for an unjust cause is permissible *as long as you wear a uniform and follow orders*, effectively erasing the primary moral wrong of aggressive war at the individual combatant level. The practical benefits – clarity, predictability, psychological ease – are purchased at too high a moral cost: the legitimization of unjust killing and the weakening of barriers against aggression.

  Therefore, even acknowledging the profound epistemic burdens, **combatant equality cannot be salvaged as a norm for practical judgment.** The appropriate practical response to epistemic constraints is not to grant unjust combatants equal moral standing, but to:
  1.  **Emphasize the Excuse:** Recognize that many unjust combatants act under excusing conditions, mitigating their blameworthiness and demanding humane treatment (including as POWs) and potentially affecting post-war accountability.
  2.  **Focus on Individual Manifest Threat:** Prioritize liability judgments based on the immediate, observable threat a combatant poses and their conduct (*jus in bello*), while acknowledging that the *overall justification* for killing them rests on the deeper *ad bellum* liability McMahan describes (even if this ultimate justification is often opaque to the actors involved).
  3.  **Intensify Scrutiny on Leaders:** Place the primary burden of *ad bellum* judgment and liability where epistemic access is greatest – on political leaders and high commanders who initiate wars.

  The fog of war may obscure deep moral truths, but practical norms should not enshrine those obscurities as moral equivalences. McMahan's distinction holds: excusable ignorance absolves blame; it does not confer justification or dissolve liability. Combatant equality remains a morally dangerous fiction, incapable of genuine rehabilitation, even amidst the profound uncertainties of war.
