  ### Draft Fictional Continuation (Spinoza’s Voice):

  "...Thus, from the differing constitution of their bodies and the affections which necessarily follow, women are commonly less capable than men of the free exercise of reason in political deliberation. Yet here we must carefully distinguish. If the *potentia* of women—their power of acting and striving to persevere in being (*conatus*)—is diminished not by nature absolutely, but by custom, education, or the very structure of dominion (*imperium*) within the household which assigns them to obedience, then the cause of their apparent incapacity lies not in nature, but in an artificial impediment to their *potentia*. 

  Consider that the natural right of every individual is coextensive with their actual *potentia* (TP Ch. 2). Where the *potentia* of women is restrained by laws or customs denying them access to public forums, education, or independent judgment—where their power of thinking and acting is systematically channeled into domestic dependence—their *natural* incapacity for citizenship cannot be conclusively demonstrated. We observe only their *constrained* power. The true measure of nature is revealed only where individuals develop freely according to their own *conatus*, unimpeded by external coercion not derived from the common order of nature itself. 

  Does the commonwealth (*imperium*) gain or lose *potentia* by their inclusion? The strength of the state resides solely in the united *potentia* of the multitude (*multitudo*) from which its right flows (TP Ch. 3). To exclude a segment of the multitude whose *potentia* could, under altered circumstances, contribute to the common strength—and whose exclusion may foster resentment, a weakening passion—is to diminish the aggregate power of the state unnecessarily. If custom, not immutable nature, restrains their *potentia*, then reason dictates the removal of that custom, for reason seeks only what is truly useful to augment our power of existence. The question is not whether women *are now* fit, but whether the causes of their unfitness are natural necessities or remediable obstacles to the common *conatus* of the polity..."

  ---

  ### Analysis: Spinoza's Logic and the Modern Franchise

  **Verdict: Spinoza’s logic in the *Political Treatise* (TP) structurally *supports* the expansion of the franchise to women, laborers, and the propertyless, despite his own prejudiced application of it.** His system demands it, even if he failed to see it. Here’s why, grounded in his core concepts:

  1.  **Natural Right = *Potentia* (Power):** This is the bedrock (TP Ch. 2). An entity’s natural right isn’t a moral claim; it *is* its power (*potentia*) to exist and act. "The natural right of every individual is coextensive with its power" (TP 2.3). Excluding a group isn't justified by abstract "unfitness" but only if their *actual power* (individually or collectively) is inherently insufficient to participate without destroying the state. Spinoza’s arguments against women hinge on *assumed* inherent weakness (physical, emotional) leading to divided sovereignty in marriage. Modern democracies prove this assumption false: women demonstrably possess the *potentia* (intellectual, physical capacity for action) to participate fully. Their inclusion doesn't collapse the state; it augments the *multitudo*'s power.

  2.  ***Imperium* as the *Potentia* of the *Multitudo*:** The state’s right and power (*imperium*) *is* nothing other than the combined natural right/power (*potentia*) of the individuals composing the multitude (TP 2.15-17, 3.2, 3.7). To exclude any segment whose *potentia* is real and can be integrated is to *artificially limit* the state’s own power. Excluding women, laborers, or the propertyless doesn't make their *potentia* vanish; it merely renders it *alienated* or *latent*. This latent power can become a source of instability (resentment, conflict) *diminishing* the state's overall *potentia*. Integrating them harnesses their power *for* the state. Modern democracies didn't grant rights out of morality; they integrated potent social forces (organized labor, women's movements) whose exclusion had become destabilizing.

  3.  **Reason, Utility, and the Removal of Artificial Constraints:** Spinoza is a ruthless realist. Reason dictates pursuing what truly increases our power of existence (E4P24, E4P26). Customs or laws that systematically restrain the *potentia* of a group (like denying education or political voice to women, or restricting laborers' mobility/assembly) are *artificial impediments*, not natural necessities. If these restraints prevent individuals from developing their full *potentia* (and thus contributing to the *multitudo*'s power), reason demands their removal as *useless* or even *harmful* to the commonwealth's strength (TP 5.3-5, TP 10.8). The modern expansion occurred precisely as these artificial restraints (legal, educational, economic) were challenged and shown *not* to be necessary for social order, but detrimental to harnessing the full *potentia* of the populace.

  4.  **Dependence is Contextual, not Natural:** Spinoza argues some are "naturally dependent" (TP 11.3). However, within his system, dependence stems from *relative power imbalance*, not ontological status. A wage laborer’s dependence on an employer is a function of economic structure and laws favoring capital, not an inherent lack of *potentia*. If laborers organize (increasing their collective *potentia*) or laws change (reflecting a shift in the *multitudo*'s power balance), this dependence lessens. Their political inclusion reflects and reinforces this shift in actual power relations. Similarly, property ownership was historically tied to power; its detachment from the franchise reflects the *potentia* of the propertyless becoming politically significant through numbers and organization.

  **Why Spinoza Failed to See It (and Why Modern Admirers Flinch):**
  *   **Prejudice:** His views on women reflect pervasive 17th-century biases he uncritically accepted, applying his logic poorly to a group he assumed *a priori* was weaker.
  *   **Misidentifying the "Artificial":** He mistook socially constructed dependence (women in patriarchal households, laborers in feudal/capitalist structures) for natural necessity.
  *   **Underestimating Collective Action:** He didn't fully conceptualize how the *multitudo* of the excluded could organize to manifest latent *potentia* and force institutional change.
  *   **The Flinch:** Modern admirers often emphasize Spinoza’s radical democracy and *potentia* but downplay the harshness of his realism. Expanding the franchise wasn't a moral victory in his terms, but a *power shift*. It forces uncomfortable questions: Was the exclusion *ever* truly "natural," or always an artificial restraint on *potentia*? Does his logic justify *any* exclusion if a group can demonstrate sufficient disruptive *potentia*? Admitting this feels less noble than claiming he was a proto-egalitarian.

  **Conclusion:** On the strict logic of the *Political Treatise*—natural right as *potentia*, *imperium* as the *multitudo*'s combined power, reason seeking utility via removing harmful constraints—the expansion of the franchise to groups Spinoza excluded is not just compatible, but *demanded*. Their inclusion demonstrates their *actual potentia* to function within the polity. Their prior exclusion was an artificial restraint on the *multitudo*'s total power, born of prejudice and misidentification of social constructs as natural law. Spinoza’s system, rigorously applied, is structurally supportive of this expansion, revealing his own conclusions on women as a failure to apply his best tools. The discomfort for modern readers lies in accepting that this expansion is validated not by innate dignity, but by the cold calculus of power integration.
