  But here's the crucial divergence: in the Lazy Argument, the doctor-calling directly causes recovery, while in Newcomb, the choice doesn't causally affect the boxes - it's purely correlational due to prediction. Stoic causation is always forward-moving; Chrysippus would reject any interpretation where present choices "retroactively" influence past predictions, even if correlated.

