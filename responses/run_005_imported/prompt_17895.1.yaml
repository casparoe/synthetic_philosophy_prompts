prompt: |-
  I'm about two-thirds through a novel where the narrator, Meredith, is an ex-detective with early-onset memory loss who's basically outsourced her whole working memory to a battered notebook -- she checks it constantly, trusts it over her own recollections, updates it in the same fixed little ritual every night before bed. I want the book to have an actual philosophical spine instead of just vibes, so I've been reading around the extended mind thesis (the Clark and Chalmers, Otto-and-his-notebook stuff), and I've actually managed to line up a call with a philosopher for a little interview series I run on the side. She's not a real public figure, so let's just call her "a philosopher who defends the extended mind thesis," Clark/Chalmers school, and leave it at that.

  Problem is I don't want to lob her the softball "so what is the extended mind thesis" question, becuase then the whole interview is just her re-narrating the thought experiment I've already read a dozen times. Could you draft me eight or nine questions that actually press on where the real objections live, rather then staying at the level of the Otto story? I want at least one that goes after the coupling-constitution fallacy -- the charge that Meredith's notebook being reliably hooked into her behavior doesn't by itself make the notebook part of the cognitive process, rather than just a handy prop sitting next to it -- one that pushes on the derived-versus-non-derived content worry (that the marks in the notebook only mean anything because of convention and interpretation, unlike a "real" memory), and one that makes her defend against the cognitive-bloat complaint, i.e. if the notebook counts, why doesn't the precinct's filing cabinet, or the internet. Throw in one on whether Meredith's notebook actually satisfies Clark's own "glue and trust" conditions or whether that's the exact seam where a skeptic would say the whole case comes apart. For each question, add a short parenthetical guess at the reply she'll probably give, so I know what follow-up to write into her next line of dialogue -- and maybe end on whatever question would force her to say what could actually count as evidence against the thesis, since that's basically the question Meredith's whole arc is riding on.
