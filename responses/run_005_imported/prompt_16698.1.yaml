  Here’s the scene, focusing on the core philosophical clash while keeping both characters grounded, passionate, and logically consistent:

  **Setting:** Priya and Dev’s living room, late evening. The tension is thick enough to cut. Priya paces like a caged animal, clutching a file folder. Dev stands near the window, arms crossed, looking weary but resolved.

  **PRIYA**  
  (Stops pacing, brandishing the folder)  
  "It’s *right there*, Dev! Invoices doctored, payments rerouted... he’s bled us dry for months. The board needs to see this *tonight*. Every minute we wait is another dollar he steals!"

  **DEV**  
  (Quietly, not looking at her)  
  "And what happens when *they* ask how you spotted it? How you knew exactly where to look? When you explain your 'sharp eye for discrepancies'?"

  **PRIYA**  
  (Flushes, defensive)  
  "I *do* have a sharp eye! It *is* discrepancies! Just because I..." She trails off, jaw tightening. "That has *nothing* to do with this. This is *his* crime. *His* betrayal. The evidence stands on its own."

  **DEV**  
  (Turns to face her, his eyes intense)  
  "Does it, Priya? Really? Or does it stand on the foundation of *your* silence? On the fact that you, the accuser, committed the *exact same act* and walked away scot-free?"

  **PRIYA**  
  "That was different! That was ten years ago! A different company, different circumstances! I was desperate, I was young—"

  **DEV**  
  "—And you never made it right. You never confessed. You buried it. You built a career, *this* company, on the fact that you got away with it." He takes a step closer. "You don't get to stand on this moral high ground now, pointing fingers at *his* theft, without acknowledging your own. It’s not just hypocritical, it’s… it’s a *fraud*."

  **PRIYA**  
  (Stung, voice rising)  
  "So what? Are you saying his theft is *okay*? Are you saying I shouldn't stop him because I screwed up a decade ago? That’s insane! The *wrongness* of what he’s doing exists independently of *me*! Exposing him *is* the right call, regardless of who blows the whistle!"

  **DEV**  
  "I’m not saying *he* isn’t guilty! He absolutely is. Exposing him *is* necessary. But *you* doing it *this way*? Marching in there pretending you’re pure as snow? That’s where it falls apart, Priya. The *accusation* might be true, but *your standing* to make it, without context, is poisoned."

  **PRIYA**  
  "My 'standing'? What is this, some aristocratic duel? This is business! This is fraud! The facts matter, not the... the *pedigree* of the person presenting them!"

  **DEV**  
  "It’s about *integrity*, Priya! Not pedigree. You want justice? Real justice? Then it has to be *clean*. You can't demand accountability from him while shielding yourself from the same light. If you expose him without revealing your own past, you're not upholding justice; you're weaponizing it selectively. You're saying *your* past mistake gets buried forever, but *his* must be dragged into the light. Where's the fairness in *that*?"

  **PRIYA**  
  (Scoffs, but there's a flicker of doubt)  
  "Fairness? To *him*? He's stealing *now*! He's actively harming our company, our employees, *us*! My past mistake... it's irrelevant to *this* crime. Bringing it up would just muddy the waters, distract from the real issue!"

  **DEV**  
  "It muddies the waters *because it should*! Because *you* are muddy! Priya, look at yourself. You are *exactly* what he is, just luckier and smarter about covering your tracks back then. Does that *really* not change how you approach this? Does it not make you pause about claiming the moral authority?"

  **PRIYA**  
  (Quieter, fists clenched)  
  "It makes me furious that I can't just... do the right thing *now* without the past haunting me. It makes me feel trapped. But it doesn't change the *fact* that exposing him *is* the right thing. The accusation stands *on its own merits*. My history… it’s a separate sin. Punishing him doesn't absolve me, but *not* punishing him doesn't absolve me either! They're parallel tracks."

  **DEV**  
  "But they collide *here*, in *you*. You're not a bystander; you're the prosecutor. And a prosecutor who committed the same crime they're prosecuting? That *fundamentally* undermines the process. It makes the whole thing feel like… like vengeance, not justice. Or worse, like covering your own tracks by sacrificing him."

  **PRIYA**  
  (Voice thick with emotion)  
  "That’s not fair, Dev. That’s not *why* I’m doing it. I’m doing it to stop the bleeding! To save what *we* built!"

  **DEV**  
  (Softens slightly, but holds his ground)  
  "I believe you want to stop the bleeding. But intentions aren't magic. You *also* want to protect yourself. You want the satisfaction of being the hero who caught the thief, without ever facing the consequence of having been one. You can't have both. Not cleanly. The accusation might be pure, Priya, but *your hand* holding it out isn't. Not unless you clean it first."

  **PRIYA**  
  (Stares at the folder in her hands, then at Dev. Her expression is a storm of anger, fear, and reluctant understanding. She doesn't concede, but the certainty of her initial march has fractured.)  
  "So... what? I just let him keep stealing? Or I walk in and say, 'Here's the proof he's a thief... and by the way, so was I, once'? How does *that* help anyone? How does that save the company?"

  **DEV**  
  (Sighs, running a hand through his hair. He doesn't have a perfect answer.)  
  "I don't know the perfect 'how,' Priya. But I know the 'what' feels wrong if you don't. The accusation might be true, but your voice... right now, carrying this particular truth... it rings hollow. Because it hasn't earned the right to condemn."

  **PRIYA**  
  (Turns away, shoulders slumped. The folder hangs limply at her side. The fire to storm to the board is banked, replaced by a cold, complex dread. The argument isn't won; it's merely exposed the impossible knot.)  
  "...Hollow." (She whispers it, tasting the word. The silence stretches, heavy with unresolved conflict and the weight of two pasts colliding in the present.)

  **Key elements achieved:**

  1.  **No Clear Winner:** Priya's logic (the accusation stands alone) isn't refuted. Dev's logic (her standing is compromised) isn't dismissed. Both points land.
  2.  **Beyond Hypocrisy:** They dig into *why* hypocrisy matters – it undermines the *process* (Dev: "makes it feel like vengeance, not justice"), poisons the moral authority (Dev: "your hand... isn't clean"), and creates a fundamental inconsistency in demanding accountability only for others (Dev: "weaponizing it selectively").
  3.  **Priya's Defense:** She argues effectively that the *wrongness* of the current act is independent (Priya: "The wrongness... exists independently of me!"). She feels trapped by her past preventing right action *now*.
  4.  **Dev's Nuance:** He doesn't defend the partner or say the theft shouldn't be exposed. He focuses *entirely* on Priya's *method* and *position* as the accuser (Dev: "You don't get to stand on this moral high ground...", "a prosecutor who committed the same crime...").
  5.  **Emotional Stakes:** Priya's frustration, desperation, and fear are palpable. Dev's weariness and insistence on principle (rooted in knowing her secret) are clear. Their relationship strain is evident.
  6.  **Working Through It:** They articulate the core conflict: **Is the validity of an accusation separable from the moral standing of the accuser?** Priya argues yes (facts are objective), Dev argues no (justice requires integrity in the process). The scene ends with them stuck on this fundamental disagreement, the practical path forward unclear and painful. The *working through* has deepened the conflict, not resolved it.
  7.  **Avoiding the Shrug:** It's not presented as a simple "you did it too, so shut up." It's a complex debate about integrity, justice, consequences, and the inescapable weight of unconfessed sin on present actions.
