answer: |-
  Based strictly on Hart's and Fuller's 1958 *Harvard Law Review* positions, here's how their analyses of the GDR border guard prosecutions would likely unfold, where they'd diverge, and the point straining Hartian positivism:

  ### **1. H.L.A. Hart's Positivist Analysis:**
     - **Legal Validity:** Hart would stress that the guards' actions were legally valid under GDR law at the time. The Schießbefehl was enacted according to the regime's secondary rules (sources of law), making it part of the GDR's "legal system."  
     - **Retroactivity Problem:** Prosecuting the guards violates the principle of *nulla poena sine lege* (no punishment without law). The guards relied on valid legal rules; convicting them *ex post facto* undermines legal certainty and the rule of law.  
     - **Solution:** Hart would endorse **retrospective legislation** (as he suggested for Nazi informers). A reunified Germany could pass new laws criminalizing past acts under the GDR, avoiding the fiction that the old laws were "invalid."  
     - **Role of Morality:** Hart insists legal validity is separate from moral abhorrence. Calling the Schießbefehl "not law" confuses moral critique with legal analysis. The injustice of the shootings is moral, not juridical.  

  ### **2. Lon Fuller's Anti-Positivist Analysis:**
     - **Internal Morality of Law:** Fuller would argue the Schießbefehl failed his 8 procedural principles (e.g., promulgation, clarity, non-contradiction, non-retroactivity, possibility of compliance). Secret directives or rules encouraging extrajudicial killings violate the "inner morality of law."  
     - **Radbruch's Formula Vindicated:** The GDR's laws were so devoid of procedural justice that they ceased to be "law." Prosecutions are thus not retroactive—the guards' acts were never legally valid.  
     - **Moral Accountability:** Fuller would see the guards as morally complicit for obeying grossly immoral "rules" that lacked the character of law. Convictions uphold the rule of law by rejecting the GDR's perversion of legality.  

  ### **3. Key Divergence: The Threshold of "Law" Itself**
     - **Hart:** The Schießbefehl is legally valid but morally monstrous. Validity depends solely on formal enactment.  
     - **Fuller:** The Schießbefehl isn’t "law" at all due to its defiance of procedural morality (e.g., impossible to comply with both the shoot-to-kill order and moral duties).  

  ### **4. Straining Hartian Positivism: The "Pathology" Caveat**
  Hart conceded that legal systems in collapse (e.g., Nazi Germany) might produce rules so aberrant that they strain the separation thesis. The GDR case presses this caveat:  
     - **The Schießbefehl as a "Pathological" Rule:**  
       - Secret directives and orders to shoot unarmed civilians arguably violate Hart's minimal "natural law" content (survival-based rules).  
       - The GDR’s systemic deception—claiming to be a *Rechtsstaat* (constitutional state) while operating extra-legally—blurs the line between "law" and "regime command."  
     - **Hart's Dilemma:**  
       To insist the Schießbefehl was "law" risks absurdity (e.g., legally "valid" orders to commit murder). Yet conceding its invalidity undermines positivism. His solution—retrospective legislation—avoids this by treating the acts as *newly* criminalized, preserving separation.  

  ### **Conclusion: Core Tensions in the GDR Context**
  | **Issue**               | **Hart's View**                            | **Fuller's View**                          |  
  |--------------------------|--------------------------------------------|--------------------------------------------|  
  | **Legal Validity of Schießbefehl** | Valid under GDR rules                      | Not "law" due to procedural defects        |  
  | **Legitimacy of Convictions** | Illegitimate (retroactive punishment)      | Legitimate (no valid law to obey)          |  
  | **Role of Radbruch Formula** | Dangerous confusion of law/morality        | Necessary tool to deny validity to evil     |  
  | **Guards' Culpability**  | Moral, not legal (unless new law passed)   | Legal *and* moral (compliance with evil)   |  

  **The Hartian Strain:** The GDR’s veneer of legality—statutes "validly" enacted but weaponized to brutalize citizens—tests Hart's separation thesis. If *any* rule enacted by a state is "law," regardless of its depravity or procedural bankruptcy, positivism risks normalizing tyranny. Hart’s retroactive-law compromise salvages legal certainty but sidesteps whether such regimes produce "law" at all—a tension Fuller would call fatal.  

  For your paper, emphasize that the GDR case *extends* the Nazi-era debate: unlike grudge informers, border guards acted under *systemic* perversion of legality, making Fuller’s procedural critique sharper and Hart’s retroactivity solution more urgent—but also more ethically uneasy.
