prompt: |-
  Okay so this has been living in my head rent free since it happened during our AP Bio group project, and I even brought it up at lunch with my friend group and nobody could agree so now I'm more confused than before. My lab partner Jae and I both "knew" our ecosystem report was due Friday - we'd both heard our teacher say it out loud in class, and we'd each checked the online gradebook like four seperate times over the week just to be sure, and it said Friday every single time. If you'd asked me on Tuesday "do you know when its due," I would've said yes without even blinking.

  Then on Wednesday we found out this report actually replaces our final for the class because of some scheduling thing, so its worth a genuinely huge chunk of our grade now. The second that sank in, Jae turns to me and goes "wait, we ARE sure its Friday right??" and I just froze. I had the literal same memory of the teacher saying it and the same gradebook screenshot as the day before, but suddenly saying "yeah I know" felt wrong, and I wanted to go track down the teacher in person and double check instead of just trusting the portal. Jae thinks I'm being ridiculous, his whole argument is that either you know a fact or you don't, and how much is riding on it can't retroactively change whether you actually knew it, because that's about your evidence and memory, not your feelings. I kind of see where he's coming from, but it doesn't feel ridiculous to me either, it really seems like going from "low stakes" to "high stakes" is what pushed me from knowing to not-knowing, even though not one single piece of my actual evidence changed in between Tuesday and Wednesday.

  So who's actually right here, me or Jae? Is there an actual reason it can make sense for stakes to affect whether you count as "knowing" something, or am I just describing being anxious and dressing it up like it's some big principle?
