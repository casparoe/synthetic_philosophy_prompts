answer: |-
  That's an excellent and penetrating critique—one that cuts to the heart of the most persistent objections to Molinism (the "grounding objection" and concerns about divine control). While Molinists vigorously deny that their view entails determinism, your reading group has identified a genuine tension. Let's break down why the criticism feels compelling, why Molinists reject it, and where the unresolved difficulties lie.

  **Why the Criticism Feels Compelling (The Core Worry):**

  1.  **God's "Authorship" of the Menu:** The criticism hinges on the idea that God *determines* or *causes* the truth values of the Counterfactuals of Creaturely Freedom (CCFs). If God "sets" which CCF is true for Peter in C (e.g., "In C, Peter would freely deny Christ"), *before* deciding to actualize C, then it seems God has unilaterally decided Peter's disposition. Your "double scripting" analogy is apt: God writes the script of *what Peter would do* in every possible scene, and then chooses *which scene* to put him in. The creature's "freedom" seems confined to playing the role pre-scripted in the CCFs God authored.

  2.  **Comparison to Calvinism:** The claim that Molinism is "more thoroughgoing determinism" stems from this perceived divine authorship of the CCFs. Calvinists openly state God *causally determines* the free act itself via a comprehensive decree. Molinists, however, claim the free act is *undetermined* by God yet *known* via middle knowledge. If God *makes* the CCFs true, critics argue, Molinism collapses into a Calvinism where God determines the act *indirectly* by fixing the CCFs, while *also* claiming libertarian freedom – hence the "dressing up" accusation.

  **The Molinist Defense: Where the Criticism "Misdescribes" (According to Molinists):**

  Molinists vehemently reject the claim that God *authors*, *causes*, or *determines* the truth of the CCFs. Their core rebuttal focuses on the *source* and *nature* of CCF truth:

  1.  **CCFs are "Prevolitional" and "Brute" Facts:** Molina argued that the truth of CCFs is *not* dependent on God's will or decree. They are *contingent* truths (not necessary like natural knowledge), but they are *true* entirely independently of God's creative action. God *discovers* them via middle knowledge; He does not *create* or *decide* them.
      *   **Analogy:** Think of necessary truths (2+2=4). God knows them, but doesn't *make* them true; their truth is independent. Molinists argue CCFs are similar *in kind* (though contingent): their truth is a *brute fact* about the *possibilities themselves*. Before God decides to create, it's *just true* that "If possible creature Peter were placed in circumstances C, he would *freely* deny Christ." God finds this fact; He doesn't invent it.

  2.  **Grounding in Creaturely Essences:** Molinists (especially contemporary ones like Flint and Craig) ground the truth of CCFs in the *individual essences* of possible free creatures. Peter's complete individual essence (his "haecceity") includes not only his essential properties but also *how he would freely choose* in every possible set of circumstances he could be placed in. God knows Peter's essence perfectly, and thus knows *all* the true CCFs about Peter.
      *   **Key Point:** God *does not choose or determine* the content of Peter's individual essence. God contemplates all *possible* individual essences (each with their own complete set of true CCFs) and then freely chooses *which* essence(s) to instantiate and *which* circumstances to place them in, based on His knowledge of their CCFs.

  3.  **Libertarian Freedom is Preserved *in the Actualization*:** When God actualizes Peter-in-Circumstances-C, Peter's denial is free in the libertarian sense because:
      *   Peter possesses the ability to do otherwise *in those very circumstances* (even if the CCF says he *wouldn't* exercise that ability).
      *   Nothing *causes* Peter to deny Christ; he does so for his own reasons. The CCF only describes what Peter *would* freely choose, not that he is *compelled* to choose it. The causal chain producing the choice originates in Peter, not God or prior causes.
      *   God's knowledge (natural and middle) tells Him *what Peter will freely do* in C, but it doesn't *make* Peter do it. Peter's choice is still causally undetermined.

  4.  **God's Control is Selective, Not Causal:** God's sovereignty, on Molinism, consists in:
      *   Knowing *all* possibilities and how *each* would freely behave in *every* situation (Middle Knowledge).
      *   Freely choosing *which* possible creatures to create (i.e., which essences to instantiate).
      *   Freely choosing *which* circumstances to place them in.
      *   God controls *which* free actions occur by wisely selecting *which* combination of free creatures and circumstances to actualize, knowing precisely what free choices would result. He does *not* control *by causing* the choices themselves.

  **Why the Worry Persists (The Unresolved Tension - The Grounding Objection):**

  Despite the Molinist defense, your reading group's worry persists in contemporary philosophy because of the **Grounding Objection**, most famously associated with Robert Adams and others:

  1.  **What Makes CCFs True?** If CCFs are contingent truths known by God prior to His creative decree, *what is the truth-maker* for them? What *grounds* their truth?
  2.  **The Creature Doesn't Exist Yet:** The possible creature (Peter) doesn't exist before creation to *make* the CCF true. His *essence* is just an abstraction.
  3.  **Can an Essence "Contain" Free Choices?** Does it make sense to say a *non-actualized, merely possible* individual essence has the property "would freely do X in C"? Libertarian freedom seems to require *actual agency* – a real agent making a causally undetermined choice. How can a mere possibility "contain" the outcome of a free act that hasn't happened (and might never happen)? This makes the truth of the CCF seem arbitrary or mysterious.
  4.  **Does God "Find" or "Determine" the Landscape?** If there's no clear ground for CCFs *other than* God's knowledge or will, then the criticism that God *effectively determines* them gains traction. Molinists insist they are found, not made, but critics argue the lack of a clear, independent truth-maker undermines this distinction in practice. The "menu" of possibilities *with their fixed CCFs* seems like a structure God must accept, but its origin and determinacy remain problematic for libertarian freedom.

  **Conclusion: Is the Criticism Fair?**

  *   **Fair in Highlighting a Deep Tension:** Yes, the criticism is absolutely fair and philosophically potent. It exposes the core difficulty of the Molinist project: reconciling *specific, definite divine foreknowledge and providence* based on CCFs with genuine *libertarian freedom*, especially regarding the *ontological status* of those CCFs. The grounding objection remains the most significant challenge to Molinism.
  *   **Unfair as a Claim of Determinism (According to Molinism):** Molinists argue it's unfair to call their view determinism. They maintain a crucial distinction:
      *   **Determinism (Calvinism):** God *causally determines* the choice itself.
      *   **Molinism:** God *knows* what the creature *would* freely choose in any situation due to the brute facts about its possible essence, and then *selects* the situation. The choice itself, *when actualized*, remains causally undetermined by anything other than the creature.
  *   **The Sticking Point:** The validity of this distinction hinges entirely on whether the truth of CCFs can be plausibly grounded *independently of God's will* in the *merely possible* free actions of *merely possible* creatures. If this grounding fails (as critics contend), then Molinism *does* risk collapsing into a form of determinism where God indirectly scripts all outcomes via the pre-volitional "menu." If the grounding succeeds (as Molinists insist), then libertarian freedom is preserved *in the moment of actual choice*, even under meticulous providence.

  Your reading group has grasped a fundamental and ongoing debate in contemporary philosophy of religion. The appeal of Molinism is its promise to reconcile seemingly incompatible truths; its vulnerability lies precisely in the metaphysical mechanics of that reconciliation, particularly the enigmatic status of middle knowledge.
