prompt: |-
  So in my history of ethics seminar we just spent a whole week on Sidgwick's Methods of Ethics, and everyone in class got kind of fixated on how the book ends on this totally unresolved note called the "dualism of practical reason" - basically Sidgwick admits he can't rationally prove that egoism or utilitarianism is the more rational method unless you assume some kind of moral government of the universe where self-interest and duty ultimately line up. Then in the very next lecture our professor mentioned, almost as a throwaway comment, that this same guy was also the founding president of the Society for Psychical Research and stayed involved with it right up until he died almost two decades later, personally investigating mediums, telepathy experiments, and haunted houses the whole time - and then she just moved on to the next slide like that wasn't the most random career detour ever for a famously rigorous analytic philosopher.

  I tried looking into it a bit more on my own and it seems like it maybe wasn't a random hobby at all - like there's supposedly a real philosophical link between the psychical research and that unresolved ending of the Methods - but I haven't found anything that actually spells out the reasoning in a way that clicks for me yet. Could you walk through what you think are the most important implications of Sidgwicks psychical research for his ethical theory? Specifically I guess I'm curious what he was hoping an empirical finding about telepathy or survival after death could actually DO for the dualism of practical reason that pure arguement couldn't, and whether the fact that his research basically turned up nothing conclusive says something interesting (or kind of tragic tbh) about the fate of his whole ethical project. I've also got to write a term paper defending or critiquing Sidgwick's utilitarianism in a few weeks, so I'm honestly wondering if any of this should change how seriously I take the theory itself, or if it's really just a curious biographical footnote that doesn't touch the philosophy at all.
