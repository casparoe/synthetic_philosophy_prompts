answer: |-
  ## The Case for Dialetheism in Nāgārjuna: Beyond Contextualist Dissolutions

  Professor, I'll present the strongest possible brief for the dialetheist reading of Nāgārjuna's *catuṣkoṭi*, directly confronting the contextualist reliance on *prasajya* negation and Robinson's charge of equivocation. The core argument is that contextualist strategies fail to capture the radical, non-conceptual thrust of Madhyamaka by domesticating its negations into a classical framework, thereby obscuring Nāgārjuna's genuine confrontation with the limits of thought and language concerning ultimate reality.

  **1. The Prasajya Maneuver: Dissolving Force, Not Contradiction**
  Contextualists correctly emphasize that Madhyamaka primarily employs *prasajya* negation – a pure, non-implicative negation denying a specific assertion without positing an alternative (*MMK* 1:1, 15:7). This is crucial. However, their claim that *prasajya* dissolves the *apparent* contradiction generated by negating all four *koṭis* is where the strategy falters:

  *   **Exhaustion, Not Elimination:** Negating all four horns *prasajya*-style doesn't magically make the contradiction disappear; it *demonstrates* the exhaustion of coherent conceptual possibilities *within the framework presupposed by the question itself*. When Nāgārjuna negates "The Tathāgata exists after death," "does not exist," "both," and "neither" (*MMK* 22:11-14), each *prasajya* negation successfully rejects the specific formulation. Crucially, **the collective negation reveals the inadequacy of the underlying conceptual framework (existence/non-existence, identity/difference) for characterizing the unconditioned (nirvāṇa) or the Tathāgata.** The contradiction isn't *avoided*; it's the *inevitable consequence* of applying inherently dichotomous concepts to what transcends them.
  *   **Preserving the Paradoxical Sting:** *Prasajya* negation prevents Nāgārjuna from *asserting* a fifth option ("neither-neither"?). But this doesn't mean the four negations are peacefully cohabiting within classical logic. The *effect* is a performative contradiction: **the conceptual apparatus required to formulate *any* position (including the negations themselves) is shown to be fundamentally incapable of capturing the ultimate.** The dialetheist argues that Nāgārjuna isn't *accidentally* generating contradictions; he is *deliberately leveraging* their arising at the limits of language to point beyond concepts. The contradiction survives as a *symptom* of conceptual overreach, not as a resolvable puzzle within the same framework.
  *   **The Danger of Over-Application:** Insisting that *prasajya* renders the *catuṣkoṭi* non-contradictory risks draining Nāgārjuna's arguments of their revolutionary force. If contextualists successfully map each negation onto subtly distinct meanings or presuppositions (*paryudāsa*-like in effect, even if not intent), they transform Nāgārjuna's radical deconstruction into a series of discrete, logically tame corrections. This fundamentally misrepresents his project. As *MMK* 18:7 states: "‘Empty’, ‘non-empty’, both, or neither – these should not be declared. It is expressed only for the purpose of designation (*prajñapti*)." The negation targets *all* conceptual fixation, including the fixation on non-implicative negation itself as a safe harbor.

  **2. Confronting Robinson: Equivocation vs. Radical Consistency**
  Richard Robinson famously argued that attempts to "resolve" Nāgārjuna's paradoxes often amount to accusing him of equivocation – shifting the meaning of terms between negations to avoid contradiction. The dialetheist reading offers a compelling response:

  *   **Radical Consistency, Not Equivocation:** The dialetheist contends that Nāgārjuna uses key terms (like "exists," "does not exist," "Tathāgata," "nirvāṇa") *consistently* within the *catuṣkoṭi* structure. **The contradiction arises precisely *because* the terms are used consistently *across* all four horns.** The problem lies not in Nāgārjuna's shifting definitions, but in the inherent limitations of the concepts *themselves* when applied to ultimate reality. Robinson's charge of equivocation only sticks if one *assumes* classical consistency must be preserved. The dialetheist rejects this assumption: the contradiction is real and intended as a *reductio ad absurdum* of the conceptual framework.
  *   **Contextualism Invites Robinson's Charge:** Ironically, the contextualist strategy *itself* is more vulnerable to Robinson's critique. By suggesting that the meaning of "exists" subtly shifts between the first and second negation, or that the "Tathāgata" refers to different aspects in different horns to avoid contradiction, contextualists *are* effectively positing equivocation. They rescue classical logic by attributing semantic shifts to Nāgārjuna. The dialetheist, by contrast, attributes the contradiction to the *subject matter*, not to Nāgārjuna's sloppy semantics. He is *exposing* the conceptual quagmire, not inadvertently falling into it through ambiguity.
  *   **Dialetheism as the Soteriologically Faithful Reading:** Nāgārjuna's goal is soteriological: the cessation of conceptual proliferation (*prapañca*) that fuels suffering (*MMK* 18:5, 25:24). The *catuṣkoṭi* is a therapeutic tool. **The dialetheist argues that the *full force* of the negation of all four options – generating a genuine paradox – is essential for this therapy.** It shocks the intellect out of its habitual clinging to conceptual positions (*dṛṣṭi*), forcing a recognition that ultimate truth (*paramārthasatya*) cannot be captured by propositions governed by binary logic. Contextualist resolutions, by domesticating the paradox, risk neutering this transformative power. They offer an intellectual "solution" where Nāgārjuna aims for a liberating *impasse*.

  **3. Logical Precision: Paraconsistency as the Faithful Model**
  The dialetheist doesn't claim Nāgārjuna *endorsed* formal logic. However, paraconsistent logic provides the most accurate *model* for understanding his arguments without distortion:

  *   **Preserving the Contradiction Without Triviality:** Paraconsistent logics (like Priest's LP) allow for true contradictions (*dialetheias*) without the principle of explosion (*ex contradictione quodlibet*). This mirrors the Madhyamaka stance: recognizing the contradictory nature of statements about the ultimate *does not* license arbitrary conclusions. It simply reflects the breakdown of conventional logic at the limits. *Prasajya* negation finds a natural home here as a strong, non-adjunctive negation operator.
  *   **Modeling Framework Collapse:** The dialetheist reading sees the *catuṣkoṭi* negations as demonstrating that the conceptual framework presupposed by the question (e.g., existence/non-existence) *collapses* when applied to the ultimate. Paraconsistent logic can model this collapse: statements like "The Tathāgata exists after death" and "The Tathāgata does not exist after death" are *both* rejected (as per *prasajya*), but their conjunction's negation (implied by rejecting "both") might hold, while the framework itself is seen as incoherent for this domain – a state naturally represented by a *dialetheia* concerning the framework's applicability. Contextualist classical logic cannot model this without either dissolving the force (via semantic shifts) or misrepresenting it as simple falsehood.

  **Conclusion: Embracing the Razor's Edge**

  The dialetheist reading survives the contextualist *prasajya* maneuver and Robinson's charge of equivocation precisely because it takes Nāgārjuna's radical project at face value. Contextualism, while sophisticated, ultimately functions as a protective strategy *for classical logic*, insulating it from the full impact of Madhyamaka deconstruction. By dissolving the apparent contradiction through semantic distinctions, it changes the subject from Nāgārjuna's demonstration of *conceptual exhaustion* to a logically consistent but potentially anodyne set of distinct negations. This drains the *catuṣkoṭi* of its intended soteriological force – the shattering of conceptual dependence.

  Robinson's charge of equivocation rebounds more strongly on contextualism, which must attribute subtle meaning shifts to Nāgārjuna to save consistency. The dialetheist attributes the contradiction to the inherent inadequacy of the concepts *themselves* when applied to the ultimate, a conclusion Nāgārjuna explicitly draws (*MMK* 22:11). Paraconsistent logic provides the most coherent formal model for this radical stance, preserving the performative contradiction as the necessary result of applying conditioned concepts to the unconditioned. Nāgārjuna, the dialetheist argues, doesn't equivocate; he consistently pushes language to its breaking point, forcing us to confront the silence beyond the fourfold negation. To domesticate this into classical logic is to miss the point. The contradiction isn't a problem to be solved; it's the signpost pointing beyond concepts.
