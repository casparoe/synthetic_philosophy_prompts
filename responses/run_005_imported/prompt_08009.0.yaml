  Robinson's charge of equivocation: Contextualists might say Nāgārjuna uses terms differently in each negation. But that risks making his arguments seem like sophistry. Dialetheism accepts the contradictions as real, showing Nāgārjuna's point about the limits of language. This aligns better with the soteriological goal of liberation through overcoming conceptual proliferation.

  I should emphasize that Madhyamaka targets the very framework of existence/non-existence. By negating all categories, Nāgārjuna demonstrates that ultimate truth can't be captured dichotomously. The dialetheist view preserves the paradoxical nature, which is essential for the therapeutic purpose of the text. Contextualism might domesticate the logic, losing its transformative intent.

