  First, I need to reconstruct Keynes' philosophical disgust. His Moore-inspired worldview saw intrinsic value only in states of consciousness - love, aesthetic appreciation, the pursuit of knowledge. Money was purely instrumental. Bentham's reduction of ethics to quantifiable units would've felt like replacing wine with nutritional paste. 

