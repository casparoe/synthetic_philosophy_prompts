answer: |-
  The ranking is based on the criteria of respecting strong Pareto-dominance and full impartiality while minimizing arbitrary stipulations such as discount rates, privileged sequences, or non-constructive objects. The known impossibility result—that no rule can satisfy Pareto, impartiality, and transitivity for all infinite utility streams without non-constructive arbitrariness—means that approaches avoiding completeness or explicit arbitrariness are favored. 

  - **Tier S (Most Promising)**: Contains proposals that fully respect strong Pareto and impartiality without introducing auxiliary choices. They are partial orderings based on dominance conditions, directly extending finite utilitarianism. Vallentyne and Kagan's approach ensures one world is better if it dominates in every finite region, while the strong-Pareto-only ordering requires individual-level dominance. Both avoid sequences, discounts, or non-constructive objects, making them maximally impartial and Pareto-respecting, though highly incomplete.
    
  - **Tier A**: Includes proposals that are more complete than those in S but rely on a fixed order or sequence of aggregation, introducing some arbitrariness. The overtaking and catching-up criteria depend on an enumeration order for summation, while the expansionist method depends on a sequence of regions. They respect Pareto and impartiality for a given order but are sensitive to the choice of that order.

  - **Tier B**: Contains methods that provide complete orderings but rely on mathematically abstract or non-constructive elements, leading to greater arbitrariness. Hyperreal/surreal utilitarianism uses non-standard numbers (e.g., via free ultrafilters), and limiting average utilitarianism depends on a limiting procedure over a sequence, both of which can violate Pareto or impartiality in subtle ways.

  - **Tier C (Least Promising)**: Discounted utilitarianism explicitly violates impartiality by weighting utilities based on time or location, introducing arbitrary discount rates that favor some individuals over others. It fundamentally contradicts the core utilitarian principle of equal consideration.

