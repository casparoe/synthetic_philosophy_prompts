answer: |-
  You've hit upon a profound and widely debated challenge. Let's rigorously dismantle the proposed asymmetry between morality and logic/math in evolutionary debunking arguments (EDAs). I'll structure this as a direct rebuttal to Street's tracking defense for logic/arithmetic, demonstrating that **if EDAs undermine moral realism, they equally undermine logical and mathematical realism** on pain of inconsistency.

  ### Core Argument: The Symmetry of Evolutionary Pressures
  1. **The Universal Mechanism of Selection**:  
     Natural selection operates on the *fitness consequences* of cognitive mechanisms, not their truth-tracking accuracy. Beliefs (or proto-beliefs/dispositions) are selected *solely* if they promote survival and reproduction. This is true whether the belief concerns morality ("Don't steal from kin"), logic ("Avoid contradictions"), or arithmetic ("Two apples feed more people than one").  

  2. **Street's Asymmetry Claim**:  
     Street contends that for logical/mathematical beliefs, *usefulness entails truth* (a "tracking" relationship), while for moral beliefs, usefulness and truth can diverge. For example:  
     - *Logic/Math*: Believing "¬(P ∧ ¬P)" (non-contradiction) is useful *because* it’s true.  
     - *Morality*: Believing "kin loyalty is good" may be useful (for inclusive fitness) but could be false (if moral facts exist).  

  3. **The Flaw: Confusing Practical Utility with Truth-Tracking**  
     Street’s argument assumes that in logic/math, usefulness *requires* truth. **This is false.** Evolution selects for *functional* success, not truth. Consider:  
     - **Scenario A (Logic)**: In a world where contradictions were common (e.g., quantum indeterminacy macroscopically manifest), a brain hardwired to *accept* contradictions might outperform one insisting on classical logic. If "P ∧ ¬P" were consistently useful (e.g., avoiding overcommitment to strategies), evolution would select for it.  
     - **Scenario B (Arithmetic)**: If "2 + 2 = 5" reliably produced fitness-enhancing behavior (e.g., by encouraging larger food stockpiles), it would be selected. Truth is irrelevant.  

     **Key Insight**: Evolution selects beliefs that *model the local environment well enough to survive*, not those that correspond to abstract truths. Our logical/arithmetical intuitions align with truth *only because* our ancestral environment was Newtonian and macro-scale. In a chaotic world, false logic/math could be adaptive.

  ### The Tracking Problem: No Guarantee of Correspondence
  Street claims logic/math enjoys a "tracking relationship" between usefulness and truth. But this relies on two unsupported assumptions:  
  - **Assumption 1**: *Fitness-enhancing logical beliefs must be true*.  
    **Rebuttal**: Not so. Consider *paraconsistent logics*, where contradictions don’t imply explosion. If such a system were more adaptive (e.g., reducing cognitive load), evolution would favor it. Truth plays no role.  
  - **Assumption 2**: *Arithmetic beliefs "track" mind-independent truths*.  
    **Rebuttal**: Our arithmetic intuitions (e.g., "1 + 1 = 2") are useful for counting discrete objects. But if our ancestors evolved in a continuum-rich world (e.g., fluid resources), fuzzy arithmetic ("1 + 1 ≈ 2") might dominate. Truth is incidental.

  ### The Coincidence Argument Applies Universally
  - **Moral Beliefs**:  
    If moral realism is true, moral facts (e.g., "torture is wrong") are mind-independent. But evolution shaped us to believe "torture undermines tribal cohesion" (useful for survival). That this aligns with moral truth would be coincidental.  
  - **Logical/Mathematical Beliefs**:  
    If logical/mathematical realism is true, then "¬(P ∧ ¬P)" or "2 + 2 = 4" are abstract truths. Evolution shaped us to avoid contradictions (to prevent indecision) and count predators (to assess threats). That this aligns with abstract truth is *equally coincidental*—there’s no evolutionary mechanism ensuring correspondence to Platonic realms.  

  **Thus**: If the moral realist faces a "staggering coincidence," so does the logical/mathematical realist.

  ### Objections and Counter-Rebuttals
  **Objection 1**: *"Logic/math is indispensable for reasoning—truth is necessary for usefulness!"*  
  - **Reply**: This confuses *consistency* with *truth*. Evolution only requires *internal coherence* and *pragmatic success*. Non-classical logics (e.g., intuitionistic, fuzzy) can be both useful and systematically "false" under realism.  

  **Objection 2**: *"We can *revise* logic/math using reason, but not morality!"*  
  - **Reply**: Revision presupposes logical norms (e.g., non-contradiction). If EDAs debunk these norms, revision collapses into question-begging. Moral realists similarly claim refinement via reflection (e.g., rejecting evolved tribalism).  

  **Objection 3**: *"Mathematical truths are *necessarily* true, so usefulness must track truth!"*  
  - **Reply**: Necessity is irrelevant. Evolution operates in *contingent* environments. If "2 + 2 = 4" were maladaptive (e.g., in a world where aggregating objects creates division), we’d evolve false beliefs. Necessity doesn’t explain why we *access* it correctly.  

  ### Conclusion: The Skeptical Dilemma
  If you accept EDAs against moral realism, you must accept:  
  1. Our logical/mathematical beliefs were shaped by selection pressures indifferent to abstract truth.  
  2. There is no evolutionary reason to think these beliefs track mind-independent truths.  
  3. Thus, their accuracy would be a "staggering coincidence."  

  **Result**: Either reject EDAs entirely, or embrace global skepticism about logic, math, and morality. Street’s asymmetry fails because evolutionary pressures *never* guarantee truth-tracking—only fitness-tracking. The moral realist can thus retort: *If you trust logic/math despite their evolutionary origins, why not morality?*  

  This forces a choice: Abandon realism about logic/math, reject EDAs as overgeneralizing, or bite the skeptical bullet. But privileging logic/math while debunking morality is philosophically untenable. The challenge is symmetric.

  ---
  **Further Reading**:  
  - Joyce, R. (2006). *The Evolution of Morality* (for EDAs).  
  - Clarke-Doane, J. (2015). "Justification and Explanation in Mathematics and Morality" (on symmetry).  
  - Benacerraf, P. (1973). "Mathematical Truth" (epistemological challenges to math realism).
