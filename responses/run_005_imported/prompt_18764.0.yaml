  The user needs the reductio ad absurdum: if you debunk morality this way, you must debunk math/logic. Street’s asymmetry collapses because her "tracking" assumes evolution selects for truth, but it only selects for fitness. Rigorously, there’s no evolutionary guarantee that useful beliefs map to mind-independent truths in either domain. 

  I should stress that this doesn’t mean math/logic are false—just that the realist can’t appeal to evolution to justify them without inviting the same problem for morality. The user’s friend was spot-on: the debunking weapon is symmetric. 

