prompt: |-
  I've followed the rationalist blogosphere's long-running argument about epistemic deference -- when it's reasonable to just adopt an expert's conclusion rather than work through the reasoning yourself -- but that debate is almost always about empirical or forecasting claims. I sit on my hospital's ethics committee, which also oversees our clinical ethics consultation service, and we're facing a version of the same question about moral judgment. Currently our consultants only facilitate, helping the care team and family reach their own reasoned resolution rather than handing down a verdict. A proposal backed by risk management and several intensivists tired of weeks-long futility disputes would instead let consultants issue documented 'directive' recommendations, in defined case types such as intractable futility disputes and surrogate conflicts, that the team must implement much as it would a subspecialty consult, whether or not it's independently persuaded by the reasoning. The chief objection isn't procedural but epistemic: consultants disagree with each other about first-order ethical questions the way cardiologists don't disagree about ejection fractions, so a team that merely implements an unpersuasive recommendation arguably achieves moral compliance without moral understanding -- and some members worry this lets everyone's sense of responsibility go slack, since no one in the room actually reasoned their way to the conclusion. Draft the committee's decision memo: recommend adopting the directive model, keeping the facilitative one, or some hybrid, with a concrete policy and a review date, and take that objection seriously on its own terms rather than treating it as mere friction against efficiency.
reasoning: |-
  Okay, the user is on a hospital ethics committee dealing with a proposal to shift from a facilitative to a directive model for ethics consultations. They want a decision memo that addresses the epistemic concern about moral deference without understanding. 

  First, I need to unpack the core tension here. The proposal wants to resolve intractable cases faster by letting ethics consultants issue binding recommendations, but opponents worry this creates "moral compliance without moral understanding." That's a serious philosophical objection - it's not just bureaucratic resistance. 

  The user is clearly sophisticated about both clinical ethics and epistemic debates. They're not asking for a simplified solution but a nuanced policy that grapples with the responsibility dilemma. The memo must show we've truly wrestled with how directive recommendations might atrophy moral reasoning muscles in the care team.

  Hmm... the cardiology comparison is telling. Ejection fractions are measurable facts, but ethical judgments involve values and context. Even with standardized frameworks, two ethicists might reasonably disagree about futility in borderline cases. That's unlike most medical consults.

  But the status quo has real costs too - prolonged futility disputes drain resources and prolong patient suffering. The intensivists' frustration is valid. So we need a middle path that preserves moral engagement while preventing gridlock.

  What if we... *only* allow directives in the clearest-cut cases where ethical standards are near-universal? Like when treatment truly meets the medical futility definition *and* surrogates are acting against documented patient wishes. And even then, require the consultant to demonstrate how they applied the hospital's own pre-approved criteria.

  Plus build in accountability: mandatory post-directive debriefs where the care team has to voice any residual discomfort, and tracking if teams start deferring reflexively. That addresses the "responsibility going slack" worry.

  The user will appreciate that this isn't just a compromise - it's designing deference to be *earned*. By tying directives to institutional standards rather than personal authority, we make the reasoning legible. And the sunset clause forces us to check if it's corroding moral discourse.

  ...Wait, should I emphasize more that the facilitative model remains the default? Yes - the memo must stress directives as rare exceptions. Otherwise teams might lean on them prematurely. 

  Also naming the policy after "accountable deference" signals we take the objection seriously. Not just efficiency, but responsible efficiency.
answer: |-
  ## Memorial Hospital Ethics Committee  
  **Decision Memo: Directive Ethics Consultation Model Proposal**  
  *Date: October 26, 2023*  

  ### I. Recommendation  
  After thorough deliberation, the Committee recommends adopting a **Hybrid Model with Strict Safeguards ("Accountable Deference Framework")** for a 24-month pilot period, effective January 1, 2024. This framework permits directive recommendations in specific, high-stakes scenarios while actively mitigating the epistemic and moral responsibility risks raised in objections. A formal review will occur by December 31, 2025.

  ---

  ### II. Policy Details  
  #### A. **Permissible Directive Cases**  
  Directive recommendations (*requiring implementation absent new evidence*) are **only** authorized when **all** criteria are met:  
  1. **Case Type**: Intractable treatment futility disputes (>14 days) OR surrogate decision-maker conflicts (≥2 surrogates with equal authority irreconcilably disagreeing)  
  2. **Consensus Threshold**: Ethics consultation team reaches unanimous agreement after applying the hospital’s **pre-approved Ethical Decision-Making Protocol** (Attachment A).  
  3. **Exhaustion of Facilitation**: ≥2 facilitative consultations failed to resolve conflict.  

  #### B. **Epistemic Safeguards Against "Uncomprehending Compliance"**  
  1. **Reasoning Transparency Directive**:  
     - All directive recommendations **must include**:  
       - A lay-language summary of the ethical principles applied.  
       - Explicit reference to the relevant section(s) of the hospital’s Ethics Policy.  
       - A "Moral Reasoning Appendix" (max. 1 page) detailing conflict resolution steps.  
     - *Purpose: Makes implicit reasoning legible, enabling moral understanding even without independent derivation.*  

  2. **Post-Implementation Debrief Requirement**:  
     - Within 72 hours of implementation, the ethics consultant **must convene** a 30-minute debrief with the core care team.  
     - Focus: "How did this resolution align with our duties to the patient?" NOT technical compliance.  
     - *Purpose: Forces engagement with moral justification, restoring agency and responsibility.*  

  3. **Prohibited in Value-Laden Ambiguity**:  
     - Directives **forbidden** in cases involving:  
       - Disagreements over quality-of-life valuations  
       - Religious/cultural disputes not violating hospital policy  
       - Ambiguous advance directives  
     - *Purpose: Restricts deference to areas with clearer institutional or professional consensus.*  

  #### C. **Hybrid Preservation**  
  - Facilitative model remains **default** for all consultations.  
  - Any team member may request revert to facilitation *during* directive process if new values-based concerns emerge.  

  ---

  ### III. Addressing the Epistemic Objection  
  We acknowledge the profound concern that directive recommendations risk fostering *procedural moral compliance without genuine moral understanding*, potentially eroding individual responsibility. This policy directly counters that risk by:  

  1. **Demanding Reason-Giving**: The "Moral Reasoning Appendix" compels consultants to articulate justifications in terms accessible to non-ethicists, transforming deference from blind trust into informed reliance on institutional principles.  
  2. **Embedding Accountability**: The mandatory debrief disrupts passive compliance. By requiring caregivers to reflect *after* implementation, it sustains moral engagement and affirms their role as moral agents executing—not merely obeying—a reasoned judgment.  
  3. **Limiting Scope to Minimize Value Discretion**: Restricting directives to narrowly defined scenarios (futility/surrogate conflict) where hospital policy and professional society guidelines provide strongest consensus reduces reliance on idiosyncratic moral reasoning. This mirrors deference to technical specialists where standards are clearest.  
  4. **Upholding Institutional Legitimacy**: Directives derive authority not from individual consultant wisdom, but from alignment with pre-established, committee-approved protocols. This shifts deference from *person* to *process*.  

  ---

  ### IV. Implementation & Review  
  - **Pilot Period**: January 1, 2024 – December 31, 2025  
  - **Oversight**: Quarterly audit of all directive cases by Committee subpanel for:  
    - Reasoning transparency quality  
    - Debrief completion/impact  
    - Evidence of care team moral disengagement (e.g., copied verbatim documentation without reflection)  
  - **Review Metrics**:  
    - % directive cases with post-debrief care team concerns  
    - Staff surveys on "moral responsibility clarity" (baseline vs. 2025)  
    - Time-to-resolution in futility cases (directive vs. facilitative)  
  - **Sunset Clause**: Full Committee vote required to renew policy post-2025. Automatic reversion to pure facilitation if audits show eroded moral engagement.  

  ---

  ### V. Conclusion  
  This hybrid model balances the urgent need for resolution in protracted, high-stakes conflicts with the ethical imperative to preserve moral agency and understanding. By strictly limiting directive authority, mandating transparency, and forcing post-hoc accountability, we mitigate the risks of unreflective compliance while acknowledging that endless facilitation can itself become a moral harm. The Committee will vigilantly monitor whether this framework sustains or undermines the culture of moral reasoning we value.  

  **Attachments**:  
  - A: Ethical Decision-Making Protocol for Directive Cases  
  - B: Directive Recommendation Template (Incl. Moral Reasoning Appendix)  
  - C: Post-Implementation Debrief Guide  

  *Approved by: Ethics Committee Chair*  
  *Date: October 26, 2023*  

  ---

  **Key Philosophical Resolution**: This policy accepts that *some* moral deference is operationally necessary in complex systems but treats it as a *dangerous tool* requiring containment and antidotes (transparency + debriefs). It rejects the false choice between efficiency and moral responsibility by designing deference to be *accountable* and *reason-revealing*, thus preserving the care team’s role as moral agents rather than mere executors.
