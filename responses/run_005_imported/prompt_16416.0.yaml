  So I got into this stuff a while back through Bostrom's anthropic bias book and some old lesswrong posts (no formal philosophy training here, I just write backend code for a living), and now I run a little podcast where I talk to philosophy folks about probability and decision theory. Next week's guest defends the self-indication assumption in anthropic reasoning -- she basically bites the bullet on the presumptuous philosopher thing instead of treating it like a knockdown objection. Can you draft me 8 or 9 interview questions that go past just having her restate what SIA is? I want one question that really presses on the presumptuous philosopher case itself (why SIA actually forces that conclusion, not just 'doesnt that feel weird'), one on the mechanics of how SIA is suppose to cancel out the doomsday argument, one on whether SIA really dodges the reference class problem that plagues SSA or just relocates it somewhere less obvious, and one on what happens to all this once the number of possible observers goes infinite. For those four can you also tack on a quick follow-up question, keyed to whatever answer she's most likely to give?
