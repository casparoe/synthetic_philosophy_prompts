  Finks, as per C.B. Martin, are cases like the wire that's live but has a finkish device that removes the disposition when triggered. Masks, like Johnston's vial with a protective coating, keep the disposition intact but block the manifestation. The user wants a clear differentiation here. They also want to know which is a bigger problem for conditional analyses and why Lewis's reformed version handles finks but not masks. 

