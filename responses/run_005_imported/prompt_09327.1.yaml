  The core tension here is between first-order certainty ("I was right in this instance") and higher-order doubt ("my confidence is usually wrong"). The user explicitly requests avoiding vague answers - they want a defended verdict applicable to cases like theirs. They've already done some reading on epistemic concepts but seek practical understanding over terminology.

