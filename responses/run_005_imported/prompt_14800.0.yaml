  First, I need to unpack the core disagreement. The user's friend claims that Bayesian methods (specifically Bayes factors) are immune to optional stopping because of the likelihood principle. The likelihood principle states that all evidence from data is contained in the likelihood function, which depends only on the observed data, not on the sampling plan. So, under this principle, the reason for stopping data collection doesn't matter. This contrasts with frequentist methods where p-values depend on the sampling distribution, which includes unobserved data paths. Optional stopping can inflate false positives in frequentist methods because the p-value calculation considers all possible ways the experiment could have continued.

  However, the user is concerned that allowing optional stopping might still lead to p-hacking, even with Bayes factors. I recall that while Bayes factors are less sensitive to optional stopping than p-values, they aren't entirely immune. Some papers show that with optional stopping, Bayes factors can still be biased, especially under certain priors. For example, if a researcher keeps adding data until the BF reaches a desired threshold, they might increase false positives. The key point is that while the likelihood principle protects the evidence measure itself, the decision to stop based on that evidence can introduce bias in the overall process.

  For the memo, the user needs to present both sides fairly. The Bayesian argument is strong theoretically: the likelihood principle does justify ignoring stopping rules. But practical concerns remain. Social psychology has a history of replication issues, often due to flexible analyses. Allowing optional stopping might create a perception problem or lead to misuse. Grad students might not fully grasp the nuances, leading to unintentional p-hacking. Also, the field values preregistration to curb such practices, and optional stopping could undermine that.

