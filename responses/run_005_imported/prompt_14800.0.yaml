answer: |-
  Here’s a concise, evidence-based memo that engages deeply with the Bayesian argument while addressing practical concerns. It balances theoretical validity with the realities of your field’s history and context.

  ---

  **MEMORANDUM**  
  To: Research-Methods and Data-Integrity Committee  
  From: [Your Name], Committee Member  
  Date: [Date]  
  Subject: Evaluation of Proposal to Permit Optional-Stopping Designs with Bayes Factors for Thesis Studies  

  ### **Core Disagreement: Optional Stopping and Evidential Frameworks**
  The proposal hinges on a fundamental statistical principle: the **Likelihood Principle** (LP). The LP states that *all evidence from an experiment is contained in the likelihood function of the observed data*. Crucially, the LP implies that the **reason for stopping data collection** (e.g., "I peeked and saw \(p < .05\)" vs. "I hit my preplanned \(n\)") does not change the *evidential meaning* of the collected data.  

  1.  **Frequentist Perspective (p-values):**  
      - p-values depend on the **sampling distribution** of the test statistic, which includes *unobserved data paths* (i.e., "what might have happened" under repeated sampling).  
      - Optional stopping inflates false-positive rates (Type I errors) because repeatedly testing data as it accumulates increases the chance of crossing a significance threshold by random fluctuation.  
      - *Example:* Simulating 10,000 experiments where researchers stop if \(p < .05\) or \(n = 1,000\) shows Type I error rates >40% under common conditions (e.g., Rouder, 2014).  

  2.  **Bayesian Perspective (Bayes Factors, BF):**  
      - BFs quantify evidence for one model (H₁) over another (H₀) using only the **observed data** (via the likelihood) and a preregistered prior.  
      - Because BFs obey the LP, their interpretation is **unaffected by the stopping rule** in theory (e.g., Edwards et al., 1963; Berger & Wolpert, 1988). Stopping when BF > 10 does not inherently bias the BF itself.  
      - *Key Asymmetry:* While optional stopping can inflate frequentist error rates, it does not systematically distort the *evidential interpretation* of BFs (though it affects *decision rules*; see below).  

  ### **Critical Nuances and Practical Risks**
  Despite the theoretical validity of the Bayesian argument, implementation in practice introduces significant risks:  

  - **BFs Are Not Invincible to Bias:**  
    - Optional stopping *can* inflate false-positive *decision rates* if researchers abuse sequential testing. While the *interpretation* of BF=10 remains "strong evidence for H₁," the probability of *obtaining* BF>10 for H₁ when H₀ is true can exceed nominal levels under aggressive optional stopping (e.g., 20–30% vs. 5% for p-values; Schönbrodt et al., 2017).  
    - This occurs because BFs can fluctuate dramatically with early data. Stopping only when BFs favor a preferred hypothesis exploits this.  

  - **Priors Matter Critically:**  
    - BFs require a **preregistered, justified prior**. Weak or overly diffuse priors can bias BFs toward H₁ under optional stopping (Ly et al., 2019). Without strong oversight, priors could be manipulated (e.g., "tuning" to favor significance).  

  - **Contextual Vulnerability:**  
    - Social psychology’s history of flexibility in designs (Simmons et al., 2011) increases risk of misuse. Graduate students—under time pressure—may engage in "BF hacking" by:  
      - Adding data until BF crosses a threshold,  
      - Switching hypotheses mid-stream,  
      - Misinterpreting BF > 3 as "proof" of H₁.  

  ### **Recommendation: Reject in Current Form, but Endorse with Safeguards**
  While the Bayesian argument holds theoretical merit, unrestricted optional stopping reintroduces flexibility that contributed to the replication crisis. **Reject the proposal as presented**, but **approve a modified version** with these binding conditions:  

  1.  **Mandatory Preregistration + Transparency:**  
      - Preregister: (a) Exact prior specifications with justification, (b) Stopping rules (e.g., "Collect min. \(n=50\), stop if BF > 10 or \(n > 500\)"), (c) Decision thresholds.  
      - Require full disclosure of all interim analyses and stopping points in publications.  

  2.  **Education and Oversight:**  
      - Graduate students must complete a certified workshop on Bayesian inference, emphasizing:  
        - Proper prior specification (e.g., using prior predictive checks),  
        - Risks of sequential testing,  
        - BF interpretation (e.g., "evidence strength" ≠ "decision threshold").  
      - Thesis committees must include a Bayesian methods expert to audit designs.  

  3.  **Robustness Checks:**  
      - Require sensitivity analyses for priors (e.g., report BFs under conservative/optimistic priors).  
      - For publication, include frequentist diagnostics (e.g., sequential p-value curves) alongside BFs for transparency.  

  ### **Conclusion**
  BFs with preregistered priors *theoretically* resolve optional-stopping issues per the Likelihood Principle. However, in a field rebuilding trust, unregulated sequential testing risks repeating past errors. With strict safeguards—transparent preregistration, education, and oversight—this approach could reduce costs while upholding rigor. **Approve only if amended conditions are enforced.**  

  ---  

  ### **Key References for Committee**  
  - Rouder, J. N. (2014). [Optional stopping: No problem for Bayesians](https://doi.org/10.3758/s13423-014-0595-4). *Psychonomic Bulletin & Review*.  
  - Schönbrodt, F. D. et al. (2017). [Sequential hypothesis testing with Bayes factors](https://doi.org/10.3758/s13428-016-0781-6). *Behavior Research Methods*.  
  - Ly, A. et al. (2019). [The impact of prior sensitivity on stopping decisions](https://doi.org/10.1007/s42113-019-00064-9). *Computational Brain & Behavior*.  
  - Simmons, J. P. et al. (2011). [False-positive psychology](https://doi.org/10.1177/0956797611417632). *Psychological Science*.  

  This memo engages the Bayesian argument rigorously while grounding the decision in practical safeguards. It respects the proposers’ expertise but prioritizes methodological integrity in light of your field’s history.
