prompt: |-
  I'm working through Principia Ethica for a reading group on early twentieth-century Cambridge ethics, and I've run into a passage in Chapter VI ("The Ideal") that I can't fully square with an argument earlier in the book. In §50, Moore uses what he calls the "method of absolute isolation" to argue, against Sidgwick, that mere beauty existing entirely unperceived still carries real intrinsic value — this is the thought experiment where he asks us to weigh an exquisitely beautiful, wholly unobserved world against an equally unobserved world that is "one heap of filth." Then, opening the book's positive account of the good in §113, he writes:

  "If, now, we use this method of absolute isolation, and guard against these errors, it appears that the question we have to answer is far less difficult than the controversies of Ethics might have led us to expect. Indeed, once the meaning of the question is clearly understood, the answer to it, in its main outlines, appears to be so obvious, that it runs the risk of seeming to be a platitude. By far the most valuable things, which we know or can imagine, are certain states of consciousness, which may be roughly described as the pleasures of human intercourse and the enjoyment of beautiful objects. No one, probably, who has asked himself the question, has ever doubted that personal affection and the appreciation of what is beautiful in Art or Nature, are good in themselves; nor, if we consider strictly what things are worth having purely for their own sakes, does it appear probable that any one will think that anything else has nearly so great a value as the things which are included under these two heads. I have myself urged in Chap. III. (§ 50) that the mere existence of what is beautiful does appear to have some intrinsic value; but I regard it as indubitable that Prof. Sidgwick was so far right, in the view there discussed, that such mere existence of what is beautiful has value, so small as to be negligible, in comparison with that which attaches to the consciousness of beauty. This simple truth may, indeed, be said to be universally recognised. What has not been recognised is that it is the ultimate and fundamental truth of Moral Philosophy. That it is only for the sake of these things—in order that as much of them as possible may at some time exist—that any one can be justified in performing any public or private duty; that they are the raison d'être of virtue; that it is they—these complex wholes themselves, and not any constituent or characteristic of them—that form the rational ultimate end of human action and the sole criterion of social progress: these appear to be truths which have been generally overlooked.

  "That they are truths—that personal affections and aesthetic enjoyments include all the greatest, and by far the greatest, goods we can imagine, will, I hope, appear more plainly in the course of that analysis of them, to which I shall now proceed. All the things, which I have meant to include under the above descriptions, are highly complex organic unities; and in discussing the consequences, which follow from this fact, and the elements of which they are composed, I may hope at the same time both to confirm and to define my position."

  Two things about this passage are tripping me up. First, I can't decide whether calling the value of unperceived beauty "negligible" in comparison with the value of consciously appreciating it is a real retreat from the force of the §50 thought experiment, or whether Moore thinks this was his position all along, so that nothing has actually changed and the two-worlds example was never meant to carry more weight than that. Second, and more importantly, I can't reconstruct the argument behind the jump from the fairly modest, widely shared premise that personal affection and aesthetic appreciation are good in themselves and more valuable than anything else we can name, to the much stronger claim that they are therefore the "sole criterion of social progress," with all duty and virtue justified purely as means to producing more of them. That is a substantial further step, and Moore doesn't seem to argue for it here so much as assert it as though it followed. Is there a hidden premise doing the work — perhaps some claim from earlier in the book that right conduct is always whatever action produces the most intrinsic value — or does the gesture toward "organic unities" in the second paragraph secretly carry some of that weight, or is this simply an unargued extension of his ideal utilitarianism that we're meant to accept on the strength of intuition alone?
reasoning: |-
  Okay, the user is wrestling with a dense passage from Moore's Principia Ethica, specifically the tension between §50 (unperceived beauty has intrinsic value) and §113 (conscious appreciation vastly outweighs it, becoming the sole ethical end). They're sharp—noticing both textual shifts and argumentative gaps. 

  First, their confusion about "negligible" is spot-on. Moore does sound like he's backpedaling from §50's bold stance. But looking closer, §50 was never claiming unperceived beauty rivals conscious appreciation—just that it's non-zero. Moore's "retreat" is actually consistent: he still grants unperceived beauty *some* value (§113 admits it exists!), but now emphasizes its practical insignificance. The two-worlds thought experiment was likely just a boundary test against subjectivism, not a claim about comparative worth. 

  The bigger puzzle is Moore's leap from "conscious goods are best" to "they justify all virtue/duty/progress." Here’s where the user’s instinct about hidden premises is key. Moore’s whole framework (established earlier) is ideal utilitarianism: the *only* ethical duty is maximizing intrinsic good. Once he establishes conscious appreciation as the *only* significant good (§113’s "sole criterion"), everything else *must* become instrumental. The "organic unities" bit isn’t doing heavy lifting here—it’s prepping for later analysis of *why* these states are so valuable. 

  User’s deeper need? They’re in a reading group—they likely need to explain this coherently to others. They might also be probing whether Moore’s ethics collapses into a pleasure-theory despite his protests. (Hint: it doesn’t, because "organic unities" mean conscious appreciation isn’t reducible to pleasure.) 

  Worth flagging: Moore’s rhetoric in §113 is uncharacteristically dogmatic ("indubitable," "simple truth"). He’s positioning his view as obvious to sidestep debate—a move the user rightly questions. The lack of argument here *is* jarring, but consistent with Moore’s method: he trusts intuition to reveal "obvious" truths, then deduces implications. Still, fair to call this a weak spot.
answer: |-
  You've pinpointed two crucial tensions in Moore's argument, reflecting genuine interpretive challenges in *Principia Ethica*. Let's break down each issue:

  **1. The "Negligible" Value of Unperceived Beauty: Retreat or Consistency?**

  *   **The §50 Argument:** Moore uses the "method of absolute isolation" to refute Sidgwick's skepticism about the intrinsic value of unperceived beauty. The *thought experiment* compels the intuition that a beautiful-but-unseen world is *intrinsically better* than an ugly/unseen one, establishing that value doesn't *depend* on consciousness for its existence. This is a powerful argument against subjectivism and hedonism.
  *   **The §113 Claim:** Moore now states that while unperceived beauty *does* have intrinsic value, it is "so small as to be negligible" compared to the value of *consciousness* of beauty.
  *   **Is it a Retreat?** Yes, **but a qualified one.** It's not a *logical* contradiction of §50, but a significant *practical* and *axiological* downplaying.
      *   **Consistency:** Moore *can* maintain both positions logically. §50 establishes *existence* of intrinsic value independent of consciousness. §113 makes a *comparative value judgment*: the value *added* by consciousness is astronomically larger than the base value of unperceived existence. The thought experiment proves the base value isn't *zero*; §113 says it's *almost* zero *relative* to conscious appreciation.
      *   **Shift in Emphasis:** The *force* of §50 lies in its bold assertion of objective, non-relational value. §113 effectively says, "Yes, that value exists technically, but for all practical ethical purposes (what we should aim to create), it's consciousness that matters overwhelmingly." The isolated worlds example was primarily a *boundary test* against subjectivism, not a claim about the *magnitude* of that value relative to other goods.
      *   **Moore's View:** He likely saw this as his position *all along*. The point of §50 wasn't to argue that unperceived beauty is *highly* valuable, but to prove it has *any* intrinsic value at all, refuting the idea that value *requires* a valuer. §113 then clarifies the *relative hierarchy* of goods he considers intuitive. The "negligible" claim feels like a retreat *because* the §50 experiment is so vivid, but Moore probably intended §113 as the full, nuanced picture.

  **2. The Leap to "Sole Criterion": The Hidden Premise of Ideal Utilitarianism**

  You are absolutely right to question the jump from "these conscious states are the highest goods" to "they are the *sole* justification for *all* duty/virtue/social progress." **The argument *is* incomplete in this passage, but relies heavily on Moore's foundational ethical framework established earlier:**

  *   **The Hidden Premise: Consequentialism/Ideal Utilitarianism:** This is the key. Moore is an **ideal utilitarian**. His core argument, developed throughout the book (especially Chapters I-II, V), is:
      1.  The *only* thing that is intrinsically good is a certain kind of state of affairs or "organic unity" possessing intrinsic value in itself.
      2.  The *sole* criterion for judging the rightness/wrongness of an action is its **consequences** – specifically, whether it produces *more intrinsic good* in the universe than any available alternative action.
      3.  "Duty," "virtue," "right action," "social progress" have no intrinsic value. Their value is *entirely instrumental*: they are good *only* insofar as they are effective *means* for bringing about states of affairs that *do* possess intrinsic value.
  *   **Applying the Premise to §113:**
      *   **Step 1 (Asserted in §113):** Through the method of isolation, Moore claims to have identified the states with the *greatest* intrinsic value: "the pleasures of human intercourse [personal affection] and the enjoyment of beautiful objects" (complex conscious states).
      *   **Step 2 (The Hidden Premise):** Right action = maximizing intrinsic good (Ideal Utilitarianism).
      *   **Conclusion (Jump in §113):** Therefore, *all* right actions (duties), *all* virtues (as dispositions to perform right actions), and *all* social progress *must* be aimed at, and justified solely by, their tendency to produce *more of these specific complex conscious states* (personal affection & aesthetic enjoyment). Nothing else matters *intrinsically*, so nothing else can be the *ultimate* justification.
  *   **Why it *Feels* Like a Leap:** Moore doesn't explicitly restate the ideal utilitarian premise in §113. He presents Step 1 ("these are the highest goods") and then immediately asserts the strong conclusion ("therefore, they are the sole justification..."). He assumes the reader accepts his earlier arguments establishing consequentialism as *the* correct ethical framework. The "organic unities" point in the second paragraph is preparatory for *analyzing why these specific states are so valuable* (their complexity, non-additive nature), not for justifying the leap to them being the sole end. The leap relies on the prior acceptance of ideal utilitarianism.
  *   **Is it *Just* Assertion?** While the *justification for consequentialism itself* relies heavily on Moorean intuition (e.g., the Open Question Argument against defining "good"), **within the framework he has built**, the move in §113 is *deductive*:
      *   If only intrinsic good matters ultimately (consequentialism), and
      *   If X & Y are the *only* things (or vastly predominant things) possessing significant intrinsic good (Step 1),
      *   Then *all* right action must aim at producing X & Y.

  **Conclusion:**

  1.  **On Unperceived Beauty:** Moore's §113 "negligible" claim is a **practical downplaying** but not a **logical contradiction** of §50. §50 aimed to prove *existence* of non-conscious value; §113 establishes the *comparative hierarchy*, asserting that conscious appreciation dwarfs that value. He likely saw this as consistent.
  2.  **On the "Sole Criterion" Leap:** The jump relies **crucially** on the **hidden premise of ideal utilitarianism** established earlier in the book. Moore assumes the reader accepts that:
      *   Only intrinsic good has ultimate value.
      *   Right action is *defined* as what maximizes intrinsic good.
      *   Therefore, once he identifies the *specific* states possessing the greatest intrinsic good (personal affection, aesthetic enjoyment), it *follows* that these are the *sole* ultimate ends justifying all action, duty, virtue, and progress. The argument in §113 itself is incomplete without this prior framework, but it *is* logically coherent *within* that framework. The gesture to "organic unities" is relevant to *understanding the nature* of these highest goods, not to justifying their status *as* the ultimate ends.

  Your reading group should discuss whether Moore successfully justifies his ideal utilitarianism *in general* (many find the Open Question Argument compelling but the consequentialism less so), and whether his intuition about the *specific* highest goods (and the relative negligibility of unperceived beauty) is truly as "indubitable" and "universally recognised" as he claims. The passage highlights both the power and the potential dogmatism of his intuitive method.
