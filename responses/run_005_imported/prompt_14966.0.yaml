  So my friend Mia and her friend Devon (they've co-run a youtube channel together since freshman year) got into this whole argument over text that's been living in my head all week, and I need an outside opinion from someone who has no clue who either of them is. They'd always just split ad and sponsor money 50/50, no real system, it just worked fine. But Devon just got offered a paid editing gig with a way bigger creator, so Devon could honestly walk away tomorrow and still make solid money solo, while Mia can't really run the channel alone and would make basically nothing without Devon. So now they're trying to hash out a new split going forward and it turned into this whole thing (I wrote it down after, not word for word but pretty close):

  (1) Mia says the fair method is to figure out the most extra money each of them could possibly gain over their walk-away amount if they had full control of the channel and the other person left, then split things so each person captures the exact same PERCENTAGE of their own maximum possible gain, so neither one ends up proportionally further from their own ceiling than the other.
  (2) Devon says that's a bad standard because "my absolute best case" is basically a number you get to just make up — everyone will claim the rosiest story about what they could pull off solo, and whoever's more shameless about it comes out ahead under Mia's rule. Devon wants to instead pick whatever split makes "the extra value each of us gets over walking away, multiplied together across the both of us" as big as possible, since that doesn't need anybody's fantasy numbers, just what's actually achievable between the two of them.
  (3) Mia claps back that Devon's rule has an even worse bug: under it, if Devon's outside offer gets even BETTER while literally nothing about Mia's side changes, Devon could end up walking away with LESS of the split than before, not more, which seems completely backwards for a rule that's supposed to be "fair."
  (4) Devon says okay sure, thats a real quirk, but a pretty contrived edge case, and Mia's rule has the mirror problem — it reacts to purely hypothetical scenarios that were never actually going to happen. Like if Mia's "best case" number changes for reasons that have nothing to do with anything real between them, Mia's rule changes the ACTUAL split, even though the real menu of deals between the two of them never moved an inch. Devon throws around some term they read online, "independence of irrelevant alternatives," and says Mia's rule fails it while Devon's doesn't.

  This is probably TMI but we'd literally just finished a "splitting the pie" unit in my econ elective, so I already had fairness rules on the brain, and I went and poked around a bit more after this happened — I think this whole fight maps onto two actual competing solutions from game theory (Nash's, and then I think the other one is named after a Kalai and a Smorodinsky?), but I honestly don't follow the underlying math, just the gist of what's above. Could you go through it move by move and grade who's more right at each numbered point, as a little json like {"1": x, "2": x, "3": x, "4": x} where x is from -2 (clearly wrong on that specific move) to 2 (clearly right), then explain each score in a couple sentences? And then at the very end just tell me straight up: once you tally up all four moves, is one of them actually more correct overall, or is it more that they're each exposing a real weakness in the other's system?
