  The user needs to draft a memo for the committee meeting on Thursday. They want the memo to seriously consider the case for including incoming students, not just dismiss it. They mentioned taking a Democratic Theory seminar, so they might appreciate arguments grounded in democratic principles. The committee is split: half thinks "currently enrolled" is neutral, the other half sees it as arbitrary.

  First, I should identify the key stakeholders. Graduating seniors won't pay or use the rec center, but they're currently enrolled. Incoming students will pay and use it but aren't enrolled yet. There's also the students who will continue next year; they're covered under "currently enrolled" and are affected. The memo needs to address fairness and legitimacy. If people who don't bear the costs get to decide, that could undermine the referendum's legitimacy. Democratic principles like affected interests and stakeholder legitimacy are relevant here.

  The user probably wants the memo to propose a solution that includes incoming students. But how? The incoming students are admitted but not enrolled. Maybe using the admission list? The registrar should have that data. The memo should acknowledge logistical concerns but argue that including these students aligns better with democratic ideals.

  Also, the user might have deeper needs. They want the decision to be seen as fair and legitimate to avoid future disputes. They might worry about low turnout or challenges to the referendum's validity. Including those who are affected could prevent backlash. The memo should balance practicality with principle, showing that the extra effort to include incoming students is worth it for the referendum's credibility.

  I should structure the memo with background, analysis of both positions, a recommendation, and justification. Emphasize democratic theory concepts like the all-affected principle. Address counterarguments: defining "affected" can be tricky, but here it's clear who pays and uses. Logistical issues can be managed with the registrar's help. The recommendation is to include incoming students officially admitted for the next fall semester. Highlight that this makes the vote more just and the result more accepted.

  Need to make sure the memo is concise, professional, and persuasive. Use bullet points for clarity. Stress that the committee's role is to ensure democratic integrity, not just follow tradition. Conclude by urging the committee to adopt a definition that reflects who is truly impacted.
answer: |-
  ## MEMORANDUM

  **TO:** Student Senate Elections Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Voter Eligibility for Rec Center Fee Referendum: Prioritizing Affected Interests  

  ### Background
  The referendum on the proposed $150/semester fee for the new Recreation Center presents a significant decision impacting student finances and campus life for years. The committee is currently divided on voter eligibility, with the primary proposal limiting voting to those "currently enrolled." This memo argues that while administratively simple, this definition **excludes the very students most directly affected** (incoming Fall admits) while **including students demonstrably unaffected** (graduating seniors). A more principled approach is required.

  ### Analysis of Competing Principles

  1.  **The "Currently Enrolled" Standard (Status Quo):**
      *   **Arguments For:** Clear administrative line, easily verifiable via current registrar data. Consistent with most past election procedures. Avoids potential complexity.
      *   **Arguments Against (The Democratic Deficit):**
          *   **Exclusion of Affected Parties:** ~600 students admitted for Fall already possess a concrete, vested interest. They *will* pay the fee and *will* use the facility. Excluding them violates the core democratic principle that **those subject to a decision should have a voice in making it** (the "all-affected principle").
          *   **Inclusion of Unaffected Parties:** Graduating seniors face no financial burden and will derive no benefit from the facility. Their votes directly impact others' future costs without consequence to themselves, creating a potential **moral hazard** and undermining the legitimacy of the outcome among those who *will* pay.
          *   **Arbitrariness:** Defining the electorate solely by a transient administrative status ("enrolled" on election day) ignores the substantive question: **Who bears the costs and enjoys the benefits?** This status line becomes arbitrary when measured against the policy's actual impact timeline.

  2.  **The "Affected Interest" Standard (Proposed Alternative):**
      *   **Core Principle:** Voting rights should extend to all students demonstrably obligated to pay the fee and eligible to use the facility. This prioritizes **stakeholder legitimacy** and **intergenerational equity**.
      *   **Target Group:** Students officially admitted and committed for the *next academic year* (Fall Semester), confirmed by the Registrar's Office. These students have a tangible, non-speculative stake.
      *   **Addressing Practical Concerns:**
          *   **Feasibility:** The Registrar *already* possesses the list of admitted/confirmed students for Fall. Integrating this data with the voting system (e.g., LMS or dedicated platform) is a manageable administrative task requiring coordination, not impossibility.
          *   **Defining "Affected":** The line is clear: obligation to pay the fee. Students starting *in* Fall are contractually obligated upon enrollment, which is guaranteed by their admission/commitment. Students graduating *before* Fall are not obligated. Students taking a leave of absence before Fall would need clear policy (e.g., confirmed enrollment intent for Fall).
          *   **Precedent:** While different from *elections*, it aligns with the logic of referenda impacting specific future cohorts. It demonstrates adaptability to the decision's unique nature.

  ### Recommendation: Adopt an "Affected Interest" Eligibility Standard
  **I strongly recommend the Committee define eligible voters for the Rec Center Fee Referendum as:**
      **"All students currently enrolled for the Spring Semester AND all students officially admitted and confirmed (e.g., deposit paid, intent to enroll) by the Registrar's Office for enrollment in the Fall Semester."**

  ### Justification

  1.  **Democratic Legitimacy:** This standard directly links voting rights to bearing the consequences of the decision. It ensures those mandated to pay the fee have a say in its imposition. A referendum decided significantly by those who don't pay lacks fundamental legitimacy among those who do.
  2.  **Fairness & Intergenerational Justice:** It prevents one cohort (current seniors) from imposing a significant financial burden on future cohorts (incoming students) without their consent. Incoming students deserve representation on decisions defining their financial obligations.
  3.  **Policy Coherence:** The fee's purpose is to fund a facility for *future* students. Excluding those future students from the decision while including those who won't use it is logically inconsistent with the project's rationale.
  4.  **Enhanced Legitimacy of Outcome:** A "Yes" vote from an electorate that includes those who will pay carries far greater moral and practical weight. It reduces grounds for future challenges or resentment from the excluded cohort.
  5.  **Administratively Achievable:** While requiring coordination with the Registrar, utilizing the existing list of confirmed Fall admits is a concrete, verifiable, and feasible solution. The complexity is justified by the principle at stake.

  ### Addressing Potential Counterarguments

  *   **"But 'currently enrolled' is the standard rule!"** While often practical for *elections* (choosing representatives), referenda on specific, future-focused financial obligations demand a principle tailored to the *nature of the decision*. Rules should serve principles, not vice-versa.
  *   **"It sets a problematic precedent!"** This standard is particularly suited to *mandatory fees* tied to *future use* where the affected paying cohort is clearly identifiable *before* the vote. It establishes a precedent for *thoughtful consideration* of voter eligibility based on impact, not just administrative convenience.
  *   **"What about students starting later (Spring admits)?"** Their stake is less immediate and certain. While ideally included in principle, practical identification before Fall may be impossible. The Fall cohort represents the primary, identifiable, and immediately affected group post-construction.
  *   **"Logistics might be tricky."** The Registrar manages complex enrollment data daily. Providing a list of confirmed Fall admits by a set deadline before the referendum vote is a reasonable request. The Committee's role is to define the just electorate; administration can find solutions.

  ### Conclusion
  Defining the electorate solely by "current enrollment" for this referendum is not a neutral act; it systematically disenfranchises the students with the greatest stake in the outcome while empowering those with none. This undermines the democratic validity and perceived fairness of the vote. Including confirmed incoming Fall students, alongside current students continuing into next year, creates an electorate aligned with the actual burdens and benefits of the proposal. It is a more just, legitimate, and defensible approach.

  I urge the Committee to adopt the recommended "Affected Interest" standard for this crucial referendum. Let's ensure the decision reflects the voices of those who will live with its consequences.

  **Respectfully submitted,**

  [Your Name]  
  Student Senate Elections Committee Member
