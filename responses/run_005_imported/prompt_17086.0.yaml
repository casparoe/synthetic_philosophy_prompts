answer: |-
  Your choice of Sidgwick and the early SPR is a brilliant case study for challenging simplistic demarcation narratives. Sidgwick's relentless intellectual honesty makes the SPR's work under his leadership uniquely compelling. It wasn't fringe credulity; it was arguably *more* methodologically scrupulous than much contemporary mainstream science in its domain. Here are the strongest cases from the SPR under Sidgwick's directorship (1882-1892, 1897-1898), chosen for their methodological rigor, scale, and the challenge they pose to easy dismissal:

  1.  **The Creery Sisters (1881-1884): The "Baseline" of Methodological Rigor:**
      *   **Phenomenon:** Thought transference (simple telepathy) – guessing names, objects, numbers, cards.
      *   **Methodology:** Sidgwick, Barrett, Gurney, Myers. Early trials were informal, but rapidly evolved under SPR scrutiny. Key features:
          *   **Isolation & Control:** Agents (sender) and percipients (receivers, the Creery sisters) in separate rooms, often on different floors or buildings. Observers present with both.
          *   **Randomization:** Targets generated randomly (e.g., drawing names/objects from a hat by an independent observer).
          *   **Documentation:** Meticulous recording of targets, guesses, conditions, observers.
          *   **Statistical Analysis:** Calculation of odds against chance. Early trials showed success rates wildly exceeding probability (e.g., guessing complex drawings, long names correctly).
      *   **Strength:** Demonstrated *replicable* phenomena under controlled conditions, observed by highly skeptical investigators (including Sidgwick himself). Sidgwick famously stated the results would convince him "if only one such case had occurred in my own experience." The sheer volume and statistical improbability were compelling *at the time*.
      *   **Later Complication:** Years *after* Sidgwick's involvement ended, the sisters confessed to using codes in *some* later trials (post-1886), likely due to pressure to perform. **Crucially:** This confession did *not* cover the initial, most rigorously controlled SPR trials that convinced Sidgwick, Gurney, et al. Sidgwick himself died before the confession. This highlights the *ongoing* challenge of fraud detection, even with good methodology, but doesn't negate the initial, well-documented results that launched SPR's serious investigation. **For Lecture:** Focus on the *initial methodology* and its impact on skeptical minds like Sidgwick. Ask: If *this* level of control and result wasn't enough to warrant investigation, what would be? How does later fraud *retrospectively* taint earlier, rigorously obtained data?

  2.  **The Census of Hallucinations (1889-1894): A Landmark in Empirical Sociology of the Unusual:**
      *   **Phenomenon:** Veridical hallucinations (apparitions coinciding with a real event, often a death).
      *   **Methodology:** Conceived by Sidgwick, designed by Gurney & Myers, analyzed by Sidgwick.
          *   **Scale:** 17,000+ responses solicited across the UK via a standardized questionnaire distributed by trained SPR agents.
          *   **Focus:** "Did you ever, when believing yourself to be completely awake, have a vivid impression of seeing or being touched by a living being or inanimate object, or of hearing a voice; which impression, so far as you could discover, was not due to any external physical cause?"
          *   **Veridicality Check:** For affirmative answers, detailed follow-up on whether the perceived event coincided with a real event (especially death) unknown to the percipient at the time. Corroboration sought from independent witnesses where possible.
          *   **Statistical Analysis:** Sidgwick calculated the baseline rate of hallucinatory experiences in the sane population (~1 in 43). He then calculated the expected rate of death-coincidences purely by chance based on mortality statistics. The observed rate of veridical death-coincidences significantly exceeded the chance expectation.
      *   **Strength:** Unprecedented scale and systematic approach. Sidgwick's analysis was statistically sophisticated for its time. The conclusion wasn't "proof of ghosts," but that veridical death-coincidences occurred far more frequently than chance could explain. This demanded *some* explanation beyond coincidence or fraud on such a massive scale. Sidgwick remained cautious, acknowledging limitations (e.g., memory errors, potential for *post hoc* association), but the sheer weight of data was staggering.
      *   **For Lecture:** This exemplifies Sidgwick's commitment to large-scale, quantitative data collection for phenomena typically relegated to anecdote. It forces the question: When does statistically significant anomaly become legitimate evidence requiring explanation, even if the explanation challenges orthodoxy? Sidgwick's own caution in interpreting the results models scientific integrity.

  3.  **Phantasms of the Living (Gurney, Myers, Podmore, 1886) - The Curated Corpus:**
      *   **Phenomenon:** Primarily crisis apparitions and telepathic impressions coinciding with death, accident, or intense emotion.
      *   **Methodology:** Sidgwick was deeply involved in planning, critique, and analysis throughout this monumental project.
          *   **Sourcing:** Solicited thousands of first-hand accounts via questionnaires, personal networks, and public appeals. Emphasis on educated, reliable witnesses.
          *   **Vetting:** Extremely stringent cross-examination. Cases only included if corroborated by independent witnesses (ideally to the percipient's *contemporaneous* report of the experience, not just the event), and after eliminating possibilities of normal sensory cues, prior knowledge, or conscious fraud. Many cases were discarded as insufficiently evidenced.
          *   **Analysis:** Presented as a corpus of "evidential" cases, analyzed for patterns (temporal relation to event, emotional state, health of agent/percipient). Gurney provided extensive theoretical discussion on telepathy as an explanation.
      *   **Strength:** The sheer volume of *apparently well-vetted* cases presented a formidable challenge. Sidgwick, the ultimate skeptic, found the cumulative weight of evidence, particularly for death-coincidences, impossible to dismiss entirely. The SPR's meticulous documentation of their vetting process aimed to preempt criticism. **Example Case:** The "Admiralty Case" (Reported in Vol. 1): A naval officer on watch clearly sees his brother (a fellow officer) standing beside him on deck at night. He turns to speak, the figure vanishes. He immediately records the experience in the ship's log. Weeks later, he learns his brother died (from fever in another country) at approximately the time of the apparition. Corroborated by the log entry and fellow officers aware of his contemporaneous report.
      *   **For Lecture:** Highlight the *process* of evidence collection and vetting – the SPR's attempt to apply legal/historical standards of testimony to anomalous phenomena. Sidgwick's involvement signals its methodological seriousness. Ask: What standard of evidence *should* apply to rare, unrepeatable personal experiences? Does orthodoxy allow for *any* standard to be met?

  **Key Themes for Your Lecture, Using These Cases:**

  *   **Sidgwick's Motivation:** Frame it as an extension of his ethical rigor. If consciousness survives death (a deeply held, if uncertain, belief for him), it was a *moral duty* to investigate evidence for it using the best available methods. He saw uncritical dismissal as intellectually dishonest as uncritical acceptance.
  *   **Methodological Innovation:** The SPR under Sidgwick pioneered techniques still used today: controlled experiments (Creery), large-scale surveys & statistical analysis (Census), systematic collection and cross-verification of anecdotal evidence (*Phantasms*). They actively sought *disconfirming* evidence and potential sources of error.
  *   **The Epistemological Clash:** Sidgwick's group amassed a significant body of *prima facie* evidence that met contemporary standards for empirical inquiry in other fields (e.g., geology, history, early psychology). The dismissal stemmed less from flaws in *their specific methods* and more from:
      *   **Ontological Prejudice:** The phenomena violated the emerging materialist paradigm of science.
      *   **The Replication Problem:** While some experiments (like early Creery) seemed replicable *within the SPR circle*, consistent replication by hostile outsiders proved elusive. This became the ultimate criterion for "science," but was it fairly applied? (Sidgwick lamented the lack of competent, impartial investigators).
      *   **Association with Fraud:** The contamination by undiscovered fraud (like later Creery, or numerous exposed mediums) allowed the entire enterprise to be tarred, regardless of the quality of specific, well-controlled investigations.
      *   **Boundary Work:** Scientific institutions actively defined themselves *against* the "occult" to secure cultural authority and resources.
  *   **Demarcation as Process:** Sidgwick's SPR shows demarcation isn't a bright line drawn by logic alone (Popper), but a messy, social process involving methodological standards, institutional power, ontological commitments, and the contingent success (or failure) of replication. A "methodologically serious but heterodox program" *can* be suppressed.
  *   **Sidgwick's Legacy:** He died (1900) deeply frustrated by the lack of conclusive proof, but convinced the investigation was valid and important. His integrity forced him to acknowledge the strength of the *evidence* (as data points), even while ultimate *explanation* remained elusive.

  **Delivering the Punch:** Present these cases not as "proof of the paranormal," but as exemplars of *how seriously and rigorously* Sidgwick's circle pursued the inquiry. Ask your students: If *this* level of careful, self-critical investigation by some of the sharpest minds of the era wasn't enough to grant the phenomena provisional legitimacy for further study within mainstream science, what does that say about the demarcation criteria actually applied in practice? Sidgwick's tragedy wasn't gullibility; it was the collision of scrupulous empiricism with the inflexible boundaries of institutional science. This makes it a powerful counterpoint to Popper and a rich case study in the sociology of scientific rejection.
