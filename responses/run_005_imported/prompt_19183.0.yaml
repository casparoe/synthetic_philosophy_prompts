  First, I need to recall Sidgwick's background. He was a utilitarian philosopher known for his rigor, yet he co-founded the SPR. That juxtaposition is key. The user mentions their interest was piqued by this contrast. So, understanding Sidgwick's position requires balancing his philosophical rigor with his open-minded approach to psychical research.

  Looking at the passage, the term "scandal" stands out. The user interprets this as Sidgwick blaming skeptics. But I should consider the historical context. In the 19th century, science was rapidly advancing, yet phenomena like spiritualism were widespread. Sidgwick might be frustrated with the lack of scientific attention to these claims, regardless of their validity. So the scandal isn't about belief or disbelief but the lack of systematic investigation.

  Sidgwick emphasizes the "scientific importance" of these phenomena. Even if only a fraction is true, they could revolutionize understanding. The scandal, then, is the educated world's dismissive attitude without proper inquiry. This aligns with his call for a "sustained and systematic attempt" to resolve the issue. 

  Next, the society's "unpledged" stance. Sidgwick unites believers and skeptics under a common goal: ascertaining facts without preconceptions. The scandal isn't skepticism per se, but the refusal to engage in rigorous investigation. By using strong language like "scandal" and "incredulity," he might be rallying both sides to action. The emotional charge serves to motivate, while the methodological neutrality ensures credibility.

  The user wonders why Sidgwick doesn't equally blame credulous believers. But note, Sidgwick mentions "competent witnesses" and those "profoundly interested." He's critiquing the educated elite's dismissal, not the believers' enthusiasm. His audience is academics, so the focus is on their responsibility to investigate rather than dismiss. 

  Also, Sidgwick's ethical philosophy valued impartiality. His utilitarian principles required weighing evidence without bias. So his approach in the SPR reflects this commitment. The scandal is the failure to apply scientific rigor, which impedes progress. 

  In conclusion, Sidgwick's rhetoric is strategic. By highlighting the scandal of inaction and incredulity, he pressures the academic community to take the matter seriously. The neutrality of the SPR's method counters potential bias, making their investigations credible. There's no contradiction; the emotional language addresses the urgency, while the methodology ensures objectivity. The user's interpretation leans toward seeing a contradiction, but contextualizing Sidgwick's goals and audience shows a coherent strategy.
answer: |-
  You've hit upon a fascinating and genuine interpretive crux in Sidgwick's rhetoric. Your confusion is understandable – the passage *does* perform a delicate balancing act. Sidgwick is **not** fundamentally contradicting himself, but he *is* employing a sophisticated and deliberate rhetorical strategy that leverages strong emotional language ("scandal," "incredulity") while simultaneously insisting on methodological neutrality. Here's a breakdown of how these elements cohere:

  1.  **The Core Scandal: Institutional Failure, Not Specific Belief:**
      *   Sidgwick explicitly defines the scandal: "That the dispute as to the reality of these marvellous phenomena... should still be going on."
      *   The scandal is **not** that the phenomena are real or unreal. It's the *enduring stalemate* itself within an "enlightened age."
      *   He highlights the key factors making this stalemate scandalous:
          *   The *potential* scientific importance is immense ("quite impossible to exaggerate").
          *   There are "competent witnesses" supporting the claims.
          *   Many people are "profoundly interested" in resolving the question.
          *   Yet, the "educated world, as a body" remains dismissively incredulous.
      *   **The scandal is the failure of established scientific and academic institutions to adequately investigate and resolve the question.** It's a scandal of intellectual *neglect* and *dismissiveness* from the mainstream, despite significant prima facie evidence (credible witnesses) and high stakes (potential scientific revolution).

  2.  **Why "Incredulity" is Targeted (and Why Not "Credulity" Equally):**
      *   **Power Dynamics:** Sidgwick is addressing the *educated world* ("we" in the SPR are part of it). The dominant, gatekeeping power in science and academia at the time was characterized by *institutionalized skepticism* towards the paranormal, often bordering on dogmatic dismissal. This incredulity actively *prevented* serious investigation within mainstream institutions.
      *   **Barrier to Inquiry:** Sidgwick saw this institutional incredulity as the primary *obstacle* preventing resolution. The credulous believers *were* investigating (albeit often poorly), forming societies, and gathering evidence (however flawed). The skeptical establishment was largely refusing to engage at all, or dismissing evidence out of hand. The scandal lay in the *powerful* side refusing to play the game of empirical investigation they claimed to champion.
      *   **Rhetorical Leverage:** Calling out the powerful establishment's failure carries more weight and urgency than criticizing the already-marginalized believers. "Incredulity" wasn't just doubt; it signified an *attitude* of closed-mindedness and refusal to investigate within the institutions best equipped to do so. He's shaming his own peers into action.
      *   **The Believers' Role:** Sidgwick *does* implicitly critique the believers by acknowledging that the SPR includes those who think most phenomena will be *disproved*, and by emphasizing the need for rigorous, systematic investigation – a clear contrast to the often uncritical methods of many spiritualist investigators. The call for neutrality *is* the critique of unscientific credulity.

  3.  **The Strategic Role of "Unpledged" Neutrality:**
      *   **Legitimacy:** For the SPR to be taken seriously *by the skeptical establishment* it needed to critique, it *had* to adopt a rigorously neutral stance. Sidgwick knew that if the SPR appeared to be a believers' club, it would be instantly dismissed.
      *   **Methodological Imperative:** Sidgwick, the philosopher of rigorous method, genuinely believed that truth could only be found through unbiased inquiry. His utilitarianism demanded weighing evidence without prejudice. The "single-minded desire to ascertain the facts" was non-negotiable for him philosophically.
      *   **Unifying Principle:** The *only* way to get both dedicated skeptics (like his colleague Henry Sidgwick) and open-minded believers (like Frederic Myers or Edmund Gurney) to work together productively was to agree on this neutral, fact-finding mission. The shared goal was resolving the scandalous stalemate, *not* proving or disproving any specific claim at the outset.
      *   **Distinguishing the SPR:** This neutrality explicitly set the SPR apart from both dogmatic skeptics *and* credulous spiritualist societies. It defined their unique contribution.

  4.  **How the Halves Hang Together: The Coherent Strategy**
      *   **Step 1: Diagnose the Problem & Create Urgency:** Sidgwick uses strong, even provocative language ("scandal," "incredulity") to diagnose the core problem: the *institutional failure* of the educated elite to investigate potentially revolutionary claims despite evidence warranting it. This creates a sense of urgency and moral/practical failing.
      *   **Step 2: Define the Solution:** The solution is not belief *or* disbelief, but *systematic investigation* to resolve the dispute once and for all.
      *   **Step 3: Establish Credibility & Method:** To make this investigation credible and effective *especially in the eyes of the skeptical establishment he's critiquing*, he insists on absolute neutrality ("unpledged") and a commitment to facts above preconceptions ("single-minded desire").
      *   **Step 4: Unite Opposing Camps:** He frames this neutral investigation as the common ground where both believers hoping for proof and skeptics expecting disproof can productively collaborate to end the scandalous stalemate.

  **Is it a deliberate rhetorical strategy? Absolutely, and a masterful one for his position.**

  *   **Audience Awareness:** He knew his audience included skeptical academics. Using "scandal" directly challenged their self-image as enlightened investigators. Framing neutrality as the antidote made the project palatable to them.
  *   **Philosophical Consistency:** Sidgwick deeply believed in rigorous, impartial inquiry as the path to truth (ethical or empirical). His strong language targeted the *failure to inquire*, not the skeptical conclusions *per se*. He was outraged by the *lack of method*, not the lack of belief.
  *   **Pragmatic Necessity:** Founding the SPR required convincing skeptical intellectuals to participate. Criticizing institutional incredulity while offering a rigorously neutral platform was the only viable approach. He needed to shame the establishment into engagement while assuring them the engagement would be scientifically respectable.

  **Conclusion:** You are not overreading. This passage reveals Sidgwick's core motivation for founding the SPR. The "scandal" is unequivocally the *failure of the educated/scientific establishment to conduct or sanction proper investigation* into phenomena that, by their potential importance and volume of testimony, demanded it. The "attitude of incredulity" is the *symptom* and *enabler* of this scandal – a dismissive posture blocking inquiry. His strong language falls specifically on the skeptics *because* they held the institutional power to investigate but refused. The insistence on neutrality is not a contradiction but the essential *antidote* to the scandal: it's the rigorous, unbiased method the establishment failed to apply, and it's the only way the SPR could gain legitimacy and actually resolve the dispute. Sidgwick is simultaneously shaming the establishment for its neglect and offering them a scientifically respectable path to redemption. It's a brilliant piece of rhetoric from a philosopher deeply committed to both empirical rigor and the unsettling possibility that the established scientific worldview might be radically incomplete.
