answer: |-
  Here's a breakdown of how Cummins's Causal-Role (CR) and the Modern History Etiological (MHE) accounts handle the feather case, comparing their verdicts and evaluating ad hoc-ness:

  1.  **Causal-Role Account (Cummins):**
      *   **Core Principle:** The function of a part (X) in a system (S) is its *current* causal contribution to some specified capacity (C) of that system. Function is relativized to the *analyst's explanatory interests* and the chosen system/capacity.
      *   **Verdict on Feathers:**
          *   **Thermoregulation:** If the analyst is explaining the bird's capacity for thermoregulation, feathers causally contribute (e.g., by trapping air, reducing heat loss). *Therefore, relative to this capacity, feathers have the function of providing insulation.*
          *   **Flight:** If the analyst is explaining the bird's capacity for flight, feathers causally contribute (e.g., by providing lift, reducing drag, enabling maneuverability). *Therefore, relative to this capacity, feathers have the function of enabling/providing aerodynamic surfaces.*
          *   **No Single "True" Function:** CR denies there is *one* privileged function inherent to feathers. Feathers *simultaneously* contribute to multiple capacities. Which contribution counts as "the function" depends entirely on which capacity the explanation targets.
      *   **Ad hoc-ness:** CR handles this case **effortlessly and non-ad-hoc**. Its core relativization to explanatory interests and capacities is built-in from the start. Exaptation presents no special problem; it's just a case where a trait contributes to multiple capacities. The account doesn't need modification or special pleading for this scenario.

  2.  **Modern History Etiological Account (Godfrey-Smith):**
      *   **Core Principle:** The function of a trait (X) is the effect for which it was selected *within a specified, recent time period* (e.g., the last N generations or a relevant recent epoch). It privileges recent selective history over ancient history to handle exaptation.
      *   **Verdict on Feathers:**
          *   **Focus on Recent History:** Assuming we're analyzing birds capable of flight, the MHE account looks at the selective pressures on feathers over the *recent* evolutionary history of the lineage (e.g., since powered flight evolved). During this period, feathers were strongly selected *for their aerodynamic properties* contributing to flight success.
          *   **Verdict:** *The function of feathers (in modern birds) is to enable flight.* The ancient thermoregulatory origin is relegated to being the trait's original *effect* or the reason it was present as an *exaptation*, but not its *current function*.
      *   **Ad hoc-ness:** The MHE approach **is arguably ad hoc** in its handling of exaptation, though it represents a *sophisticated* attempt to rescue the etiological core.
          *   **The Problem it Solves:** The standard etiological account (focusing on *total* history) struggles, potentially labeling the original effect (thermoregulation) as the "function" even when the trait is now maintained for something else (flight). This seems counterintuitive for traits like feathers where flight is clearly paramount *now*.
          *   **The Ad hoc Charge:** Privileging "recent" history introduces a new, undefined parameter: **What counts as "recent" or "modern"?** How many generations? Which geological epoch? The choice of timeframe seems arbitrary and lacks a principled basis *within the core etiological framework*. The cutoff is introduced *specifically* to avoid the counterintuitive verdicts the standard account gives for exaptations. It feels like a patch or a parameter added to fix a problem, rather than flowing naturally from the fundamental idea that function is what something was *selected for*.
          *   **Mitigating Factor:** Proponents argue privileging recent history captures the *maintenance* of the trait. Feathers are *currently maintained* in bird populations primarily by selection for flight. This grounds the "recent" timeframe in current selective pressures, making it less arbitrary than a purely temporal cutoff. However, defining the relevant timeframe for "maintenance" still presents challenges.

  **Comparison & Which is Less Ad Hoc:**

  *   **CR Verdict:** Feathers have multiple functions (insulation, flight) depending on the explanatory context and capacity being analyzed. No single privileged function.
  *   **MHE Verdict:** Feathers have the function of enabling flight (for modern birds), as this is their recent/maintaining selective effect. Thermoregulation is not their current function.
  *   **Less Ad Hoc Verdict:** **Cummins's Causal-Role account gives the less ad hoc verdict in this specific case of exaptation.**

  **Why:**

  1.  **Built-in Handling:** CR's relativization to explanatory interests and capacities is a *fundamental, defining feature* of the account, present from its inception to handle precisely the kind of complexity exaptation exemplifies. It doesn't need to add special rules, parameters, or temporal cutoffs to accommodate the case. The solution is inherent.
  2.  **No Arbitrary Parameters:** CR avoids introducing the problematic "recent history" cutoff that the MHE account requires. The analyst's choice of explanatory target provides the context, not an arbitrary temporal boundary.
  3.  **Accommodates Multi-functionality Naturally:** Feathers *do* contribute causally to both thermoregulation and flight *now*. CR straightforwardly acknowledges this reality by allowing multiple function ascriptions relative to different capacities. The MHE account, by insisting on a single "real" function based on recent selection, risks downplaying or ignoring the ongoing causal contribution to thermoregulation (which may still be subject to stabilizing selection, even if flight is the dominant pressure).
  4.  **Resolves the Question by Dissolving a False Dichotomy:** CR argues the philosophical puzzle ("Is the *real* function insulation *or* flight?") arises from mistakenly assuming functions must be unique and historically privileged. By showing how function talk is context-dependent and capacity-relative, CR dissolves the apparent conflict without needing ad hoc fixes.

  **In Conclusion:**

  While the Modern History Etiological account provides a valuable and more intuitive update to the etiological approach for exaptations like feathers, its reliance on privileging a "recent" timeframe introduces an element of arbitrariness that makes it appear somewhat ad hoc compared to the Causal-Role account. Cummins's account handles the case with its core machinery intact, relativizing the function ascription to the specific explanatory context (thermoregulation vs. flight capacity) without needing special evolutionary-temporal rules. This inherent flexibility makes CR's verdict on exaptation significantly less ad hoc. However, proponents of the etiological view would argue that CR loses the normative, selected-effect dimension that they consider essential to the concept of biological function (i.e., what the trait is *supposed* to do, not just what it *can* do).
