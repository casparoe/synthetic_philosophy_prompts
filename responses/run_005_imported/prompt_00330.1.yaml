answer: |-
  You've identified a profound tension at the heart of dynamic rationality. Your suspicion is correct: while McClennen's Resolute Choice (RC) and Updateless Decision Theory (UDT) share a core motivation (avoiding time inconsistency/exploitation), they stem from fundamentally different conceptions of agency and rational evaluation. They are **not** merely different framings; they represent distinct theoretical claims. Let's break this down:

  **Core Differences in Foundation:**

  1.  **Unit of Rational Evaluation & Metaphysics of Agency:**
      *   **Resolute Choice (McClennen):** Operates within a **temporally extended agent** framework. The rational unit is the *plan* adopted by the agent over time. Later "selves" are temporal parts of the *same* persisting agent. Rationality requires the agent to *identify* with her past commitments, viewing the plan as a binding expression of her overall agency. It's **Kantian/Practical Reason-focused**: Rationality involves self-governance according to principles one endorses over time. It doesn't require abandoning the standard temporal structure of experience and decision.
      *   **Updateless Decision Theory (UDT):** Operates within a **timeless, global policy** framework. The rational unit is the *entire function* mapping *all possible informational inputs* to actions, chosen *ex ante* before any specific information is received. Later "selves" are merely computational states executing the predetermined policy; they have no independent rational authority to "deviate." It's **Computational/Formal Utility Maximization-focused**: Rationality is about selecting the single policy that maximizes expected utility *globally*, across all possible branches of the information tree. This *requires* a radical revision of the metaphysics of decision-making, treating time and information updates as internal to the policy execution, not fundamental to agency.

  2.  **Role of Information & Updating:**
      *   **RC:** Acknowledges that new information arrives and changes the agent's epistemic state. The key move is that the *rational response* to this information is *not* necessarily to re-optimize locally ("sophisticated choice"), but to *adhere* to the previously adopted plan *if* that plan was adopted rationally with foresight. Information updates the epistemic state, but doesn't automatically invalidate the prior commitment.
      *   **UDT:** Explicitly *rejects* the standard Bayesian updating process *as the driver of rational action*. The agent selects a policy *before* knowing which information it will receive. The policy *encodes* what action to take *given* any specific information input. "Updating" is merely the process of *reading* the pre-specified output for the input you actually receive. Deviating based on the *local* state after updating is fundamentally irrational because it fails to maximize global utility.

  3.  **Source of Bindingness:**
      *   **RC:** The binding force comes from the agent's *endorsement* of the plan at the planning stage as expressing her overall good/values. It's a commitment to *diachronic integrity* – being true to one's past rational self. Failure is a failure of self-governance.
      *   **UDT:** The binding force comes purely from the *mathematical fact* that deviating from the globally optimal policy *reduces expected utility*. Failure is a failure of computation/logic. There is no "self" to be true to beyond the policy itself.

  **Case Study Analysis:**

  1.  **The Toxin Puzzle (Kavka):**
      *   **Setup:** A rich eccentric offers you $1M on Tuesday if you intend *on Tuesday night* to drink a nasty (but non-lethal) toxin on Wednesday. You get the money Tuesday night *if you have the intention then*. You know that come Wednesday morning, the money is already yours, and the *only* reason to drink is because you intended to. Drinking gains nothing and causes suffering.
      *   **Sophisticated Choice (Standard CDT/EDT):** Forms the intention Tuesday night to drink Wednesday (to get $1M). Receives $1M Tuesday night. Wednesday morning, knowing the money is banked and drinking gains nothing, chooses *not* to drink. Fails to fulfill the condition, but it's too late – the money is already paid.
      *   **Resolute Choice (RC):** On Tuesday, adopts a *plan*: "Intend to drink Wednesday night when asked on Tuesday, and *actually drink* on Wednesday." On Tuesday night, forms the intention (part of the plan). Receives $1M. On Wednesday, *executes the plan* and drinks the toxin. **Rationale:** The agent identifies with her Tuesday self's rational plan. Drinking on Wednesday is the execution of the *overall successful plan* ($1M - discomfort) that she endorsed. Deviating Wednesday would be a failure of self-governance and undermine her ability to form credible commitments in the future. The plan as a whole is rational; Wednesday's action is rational *as part of that plan*.
      *   **Updateless Decision Theory (UDT):** Before Tuesday (or "timelessly"), the agent considers all possible information states. It knows one branch is "Offered the deal Tuesday" and another is "Not offered". It selects a *policy*. The optimal policy is: "If offered the deal on Tuesday, *intend* to drink Wednesday *and drink* on Wednesday. If not offered, do nothing." When the agent finds itself in the "Offered" branch on Tuesday, it *intends* according to the policy. On Wednesday, with the money banked, it *drinks* according to the policy. **Rationale:** This is the *only* policy that gets the $1M. Any policy that says "drink only if it gains something *on Wednesday*" fails to get the money because the predictor (or your own inability to commit) knows you won't drink. UDT doesn't see "Wednesday morning" as a new decision point; it sees the execution of the predetermined response to the information state "Wednesday, toxin time, money received". The local irrationality of drinking is irrelevant; the *global policy* of drinking-in-this-branch is utility-maximizing.

  2.  **Counterfactual Mugging (Omega Version):**
      *   **Setup:** Omega flips a coin. If Heads, it asks you for $100. If Tails, it does nothing. If Omega *would have* given you $10,000 *if* the coin came up Heads *and* you *would have* paid it the $100 when asked, then it gives you the $10,000 *only if* the coin actually came up Tails (i.e., you never get asked). So: Tails (no ask) -> You get $10,000 *if* you would have paid $100 on Heads. Heads (asked) -> You pay $100, get nothing *unless* you would have paid on Heads (but you don't get the $10k now because it's Heads).
      *   **Sophisticated Choice (Standard CDT/EDT):** If Heads (asked): Paying $100 gets you nothing (the $10k is only for Tails). So you refuse. If Tails (not asked): You get nothing (because you *would* refuse on Heads). **Outcome:** $0.
      *   **Resolute Choice (RC):** Before the flip, the agent adopts a plan: "If Heads (asked), pay the $100. If Tails (not asked), do nothing." If Heads, it pays the $100 as per plan. If Tails, it does nothing. **Outcome:** If Tails, gets $10,000. **Rationale:** The plan "Pay if asked" is the only plan that leads to the $10k reward in the Tails branch. The agent commits to this plan. When Heads occurs, paying $100 is executing the plan necessary for the overall good outcome (the $10k in Tails worlds). It's costly locally but part of a globally beneficial commitment. *However, RC struggles slightly here*: The $10k reward depends on a *counterfactual* about what you *would do* in an unrealized branch. RC primarily binds the agent *across realized time* within a single branch. While the plan covers both branches, the *reason* for committing is the actual benefit in the Tails branch *she experiences*, not directly the counterfactual dependency. The counterfactual is a *mechanism* Omega uses, but the agent's commitment is to its own plan for its own experienced outcomes.
      *   **Updateless Decision Theory (UDT):** Before any observation, the agent selects a policy function: `f(observation) -> action`. The possible observations: "Heads & Asked" or "Tails & Not Asked". The optimal policy is: `If "Heads & Asked": Pay $100. If "Tails & Not Asked": Do Nothing.` When the agent receives the observation "Tails & Not Asked", it outputs "Do Nothing" and receives $10,000. **Rationale:** This is the *only* policy that results in $10,000 in the Tails branch. The policy *must* output "Pay" in the Heads branch *for the policy itself* to qualify for the $10k in the Tails branch. Crucially, UDT *does not care* that the Heads branch is unrealized; the *policy definition* includes the output for that input, and that's what Omega evaluates. The agent in the Tails branch isn't "deciding" anything about the Heads branch; it's simply outputting the action its optimal global policy specifies for the "Tails & Not Asked" input. The counterfactual is handled *within the policy specification itself*. UDT naturally and directly handles the acausal/counterfactual nature of the interaction.

  **Is UDT a Formalization/Descendant of Resolute Choice?**

  *   **Similarity:** Both recommend sticking to a pre-specified course of action even when local incentives seem to favor deviation, specifically to avoid dynamic inconsistency and exploitation (money pumps, failed commitments, lost rewards in Newcomblike problems).
  *   **Difference:** UDT is **not** merely a formalization of RC. The differences are foundational:
      *   **Metaphysics:** RC preserves temporal agency; UDT dissolves it into a timeless computation.
      *   **Rationale:** RC's bindingness is normative (self-governance, integrity); UDT's bindingness is purely consequentialist/formal (global utility maximization).
      *   **Scope:** UDT inherently and elegantly handles *counterfactual* dependencies and acausal interactions (like Counterfactual Mugging) in a way RC struggles with conceptually. RC is primarily designed for *diachronic* consistency within a single timeline.
      *   **Unit:** RC evaluates *plans* adopted by temporal agents; UDT evaluates *policies* (functions) chosen by a timeless agent.

  **Conclusion:**

  Resolute Choice and Updateless Decision Theory are distinct responses to dynamic inconsistency. **RC is a theory of *diachronic self-governance*** for a temporally extended agent, emphasizing commitment to prior rational plans as an expression of practical rationality and integrity. **UDT is a theory of *global computational optimization***, treating the agent as a timeless function selector where rational action is simply reading the output of the optimal policy for the current input, maximizing expected utility across all possible information paths.

  *   **RC** fits within traditional philosophical frameworks of agency and practical reason, offering a solution to temporal exploitation without abandoning the reality of time and changing epistemic states.
  *   **UDT** makes a genuinely radical claim: that the unit of rational evaluation *must* be the global policy, and that the appearance of sequential decision-making is an illusion masking the execution of a predetermined function. It's driven by solving problems involving predictors, counterfactuals, and acausal coordination that push beyond purely temporal concerns.

  UDT can be seen as a powerful *formal tool* that achieves similar *behavioral prescriptions* as RC in many classic cases (like Toxin), but it does so based on a fundamentally different and more revisionary theoretical foundation centered on timeless global policy optimization, making it uniquely suited for the complex, often counterfactual, decision problems prominent in AI alignment and certain advanced decision theory puzzles. Your dissertation chapter would benefit greatly by highlighting this contrast in metaphysical commitments and scope of application.
