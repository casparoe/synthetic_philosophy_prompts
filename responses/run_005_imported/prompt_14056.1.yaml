  The user's anxiety about "poker face" is telling - this is really about trust preservation. The SPI approach lets them delegate tactics without delegating betrayal. I should stress that the human pre-agreement acts as a circuit breaker against runaway AI negotiation.

  Most importantly, they need to document their BATNAs before turning on the bots. If either would genuinely walk away unless they get at least 40% equity and veto on spending, that becomes the safety floor. The AI assistants then get constrained to only propose deals where both get ≥40% + veto, plus some upside. 

  For asymmetric AI capability, the pre-agreement should include symmetry principles: "If my bot secures X advantage in area Y, your founder automatically gets equivalent compensation in area Z." This prevents winner-take-all outcomes.

  ...Wait, I'm realizing they might skip the BATNA documentation if it feels too abstract. Better suggest a quick worksheet: 
