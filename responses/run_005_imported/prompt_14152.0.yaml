answer: |-
  Here's a tight two-liner with an explanation chaser:

  > **Agent:** "I only take action if I can prove I'll take it!"  
  > **Löb:** "Congratulations! You just took *every* action... and proved 2+2=5."  

  **Why it works mechanically**: The agent's policy formalizes as "Do X only if □X" (□ = provability). But if the agent can universally prove □X → X (self-trust), Löb's theorem (□(□X → X) → □X) implies it can prove □X for *any* X—even false or absurd ones. So it both "takes every action" (since X is arbitrary) and "proves 2+2=5" (a classic example of an incoherent proof). The joke collapses if you don’t grasp how Löb forces □X from the self-referential premise.  

  **Bonus class-delivery tip**: Pause after "Löb" and gesture vaguely at the board where you derived the theorem. Stare directly at the students who looked "attacked" last time. If the punishers don’t laugh, sweetly add: "Don’t worry—if you *could* prove this joke was funny, it would be, but alas..." (then move swiftly to tiling).
