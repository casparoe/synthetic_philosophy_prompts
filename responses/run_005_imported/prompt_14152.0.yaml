  I teach a graduate seminar that's half formal epistemology, half AI-alignment adjacent, and this week we finally got to Löb's theorem and the "Löbian obstacle" to self-trust: the reason an agent can't just run on the policy "I'll do X whenever I can prove I'll do X," since if it could prove that schema in general it would thereby be able to prove X outright, wich for arbitrary X is obviously bad news. I put the whole derivation on the board, provability predicate, diagonal lemma and all, and by the end half the room had the look of people who'd just been personally attacked by a modal operator.

  For the start of next class I want to open with a joke about this before we move on to tiling agents, partly as a treat for whoever actually followed the proof and partly to mildly punish whoever didn't. Could you write me one? A single one-liner or a short two-line exchange is totally fine, I don't need a whole bit. The one condition is that it actually has to be funny *because* you understand Löb's theorem and the self-trust problem, not just a generic "AI is scary" or "logicians are pedantic" joke -- if someone who'd never heard of provability logic heard it, it should basically fall flat for them, that's how I'll know its doing its job. Throw in a sentence after the joke explaining why it works mechanically too, since I'll definitely have to break it down for at least one kid in the back row anyway.
