prompt: |-
  I am writing a novel centered on a decades-long, prickly friendship between two philosophers — both committed expressivists about morality — who have never managed to agree on how to answer the Frege–Geach problem. I want the argument I give them at a conference-hotel bar to rest on a genuine technical disagreement rather than a plausible-sounding fudge of my own invention, so I'd like to understand the terrain properly before I draft the scene. Please compare Simon Blackburn's quasi-realist strategy for handling embedded moral sentences with Allan Gibbard's norm-expressivist strategy, including his later appeal to "hyperplans" to fix normative content precisely. Concretely: what does each theory say is happening when someone accepts a sentence like "if lying is wrong, then getting your little brother to lie is wrong" without thereby asserting that lying is wrong? And in your own assessment, does either account give a more satisfying explanation of why the corresponding modus ponens is valid, or do the two of them ultimately founder on the same rock, just dressed differently?
reasoning: |-
  Okay, the user is writing a novel about two philosophers who are expressivists but disagree on the Frege-Geach problem. They want an authentic technical disagreement for a bar scene argument. Let me start by recalling what expressivism is. Moral expressivism says that moral statements express attitudes, not beliefs. The Frege-Geach problem is about how these statements work in logical contexts like conditionals.

  First, I need to compare Blackburn's quasi-realism and Gibbard's norm-expressivism. Blackburn uses higher-order attitudes. For the sentence "If lying is wrong, then getting your brother to lie is wrong," he'd say it expresses a commitment against tolerating both lying and not condemning getting the brother to lie. That's his solution to embedding—maintaining consistency in attitudes.

  Then there's Gibbard. His early approach involved conditional norms, but he later introduced "hyperplans" to specify what to do in all possible situations. So for the same conditional, accepting it means having a hyperplan that links the disapproval of lying to the disapproval of getting the brother to lie. The validity of modus ponens comes from the hyperplan's coherence.

  Now, assessing which account is more satisfying. Blackburn's quasi-realism aims to mimic realism without ontological commitments. His explanation of modus ponens relies on the consistency of attitudes. But critics say this might not fully capture logical necessity. Gibbard's hyperplans provide a more structured account, tying validity to the agent's normative system. However, both might face issues with the objectivity of logic, as they ground it in subjective attitudes or plans.

  The user's deeper need is authenticity in their characters' debate. They need clear, opposing viewpoints that reflect real academic disputes. The bar scene should highlight technical nuances without jargon overload. Maybe one character favors Blackburn's elegance, the other Gibbard's precision. The unresolved tension in philosophy allows their friendship to persist without resolution, fitting the novel's theme.

  I should also consider if both theories founder on the same issue. Both reduce logic to psychology, which realists argue misses logical truth's necessity. That's a point the characters could debate—whether expressivism can ever fully capture logical validity or if it's a fundamental limitation.
answer: |-
  That's a brilliant premise for a novel – the decades-long sparring over Frege-Geach perfectly embodies the stubborn intimacy of intellectual friendships. Let's break down Blackburn and Gibbard on embedded contexts, focusing on your conditional example, and then assess their handling of validity.

  **The Core Expressivist Commitment (Shared Starting Point):**
  Both philosophers start with the idea that a *simple, asserted* moral sentence like "Lying is wrong" does *not* primarily express a belief describing a moral fact. Instead, it expresses a non-cognitive, conative state of mind:
  *   **Blackburn:** Expresses an *attitude* (e.g., disapproval) towards lying.
  *   **Gibbard (Early):** Expresses *acceptance of a norm* that forbids lying.
  *   **Gibbard (Later/Hyperplans):** Expresses that a particular *hyperplan* (a complete contingency plan for what to feel and do in all conceivable situations) rules out lying.

  **The Challenge: Embedded Contexts (Your Conditional)**
  The problem arises when moral terms appear unasserted, like in the antecedent of your conditional: **"If lying is wrong, then getting your little brother to lie is wrong."** The speaker *accepts* this conditional without asserting that lying *is* wrong. What does accepting *this complex sentence* express, according to each?

  1.  **Simon Blackburn's Quasi-Realism (Projectivism & Higher-Order Attitudes):**
      *   **What's Happening:** Blackburn treats the conditional as expressing a *higher-order attitude* concerning the *relationship* between the attitudes expressed by its parts.
      *   **Analysis of the Conditional:** To accept "If lying is wrong, then getting your little brother to lie is wrong" is **to have an attitude *against* (disapprove of) *combining* the attitude of approval towards lying *with* the attitude of *not* disapproving of getting your little brother to lie.** It's an attitude *about* attitudes.
      *   **Key Mechanism:** He uses a "Hooray!" operator (H!) for the attitude expressed by the moral predicate. The conditional becomes: **H!(~H!(lying) or H!(getting brother to lie))**. Accepting it means you *oppose* (H! the negation of) the conjunction of *not* disapproving lying (~H!) and *not* disapproving getting brother to lie (~H!).
      *   **Why Not Asserting Antecedent?** You're not *expressing* disapproval of lying itself (H!(lying)). You're expressing disapproval of a specific *combination* of attitudes involving lying and the brother's action. You're saying your moral sensibility *constrains* how these attitudes must cohere.

  2.  **Allan Gibbard's Norm-Expressivism (Later: Hyperplans):**
      *   **What's Happening:** Gibbard aims for a more systematic, truth-conditional *structure* within an expressivist framework using hyperplans. A hyperplan is a maximally specific set of contingency plans for what to do and feel in all possible situations – it settles *all* normative questions.
      *   **Analysis of the Conditional:** To accept "If lying is wrong, then getting your little brother to lie is wrong" is **to possess a hyperplan that *links* the plan-component concerning lying to the plan-component concerning getting your brother to lie.** Specifically:
          *   If your hyperplan *rules out* lying (treats it as "wrong") in a situation,
          *   Then it *also rules out* getting your brother to lie in that (or relevantly similar) situation.
      *   **Why Not Asserting Antecedent?** You're not *expressing* that your hyperplan *actually does* rule out lying here and now. You're expressing that your hyperplan has a *conditional structure*: ruling out lying *entails* (within the plan) ruling out getting your brother to lie. You're committed to this link within your overall normative system.

  **Handling Modus Ponens Validity: The Core Disagreement**

  This is where your philosophers' bar argument ignites. Both need to explain why the inference:
      1. If lying is wrong, then getting your little brother to lie is wrong. (P1)
      2. Lying is wrong. (P2)
      Therefore,
      3. Getting your little brother to lie is wrong. (C)

  *feels* necessarily truth-preserving, like logical deduction, even though the components express attitudes/plans.

  *   **Blackburn's Explanation (Attitudinal Consistency):**
      *   Accepting P1 expresses disapproval of the combination: [approving of lying + not disapproving of getting brother to lie].
      *   Accepting P2 expresses disapproval of lying (i.e., *not* approving of lying).
      *   To accept P1 and P2 *together* is to disapprove of that combination *and* to disapprove of lying.
      *   Crucially, Blackburn argues that **having these two attitudes *logically commits* you to disapproving of getting your brother to lie (C).** Why? Because *not* disapproving of getting your brother to lie, while disapproving of lying, *is exactly the combination you expressed disapproval of in P1*. To accept P1 and P2 while rejecting C would be to hold incompatible attitudes – it would violate a fundamental requirement of attitudinal consistency inherent in having a coherent moral sensibility. Validity is explained by the *logic of attitudes* and the *impossibility* of coherently holding the premises while rejecting the conclusion at the level of conative commitment.

  *   **Gibbard's Explanation (Hyperplan Coherence):**
      *   Accepting P1 expresses that your hyperplan links ruling out lying to ruling out getting your brother to lie.
      *   Accepting P2 expresses that your hyperplan *does* rule out lying (here and now, or in the relevant context).
      *   Therefore, **given the link expressed in P1, your hyperplan *must also* rule out getting your brother to lie (C).** It's a matter of the *internal coherence of the hyperplan itself*. A hyperplan that contained the link (P1) and the ruling out of lying (P2) but *failed* to rule out getting your brother to lie (C) would be *inconsistent* – it would violate its own conditional structure. Validity is explained by the *structural constraints of hyperplan coherence*. The inference is necessarily truth-preserving *relative to the agent's own normative system* (the hyperplan).

  **Assessment: Dressing the Rock Differently, or Different Rocks?**

  This is the crux for your characters. Does either truly succeed, or do they share a fatal flaw?

  1.  **Blackburn's Strength/Weakness (The Rock: Attitudinal Logic):**
      *   **Strengths:** Elegantly extends the core expressivist idea. Makes validity a matter of *practical* inconsistency in attitudes. Explains the *felt necessity* well – it *feels* logically wrong to hold P1 & P2 but reject C because it *is* a conative contradiction.
      *   **Weaknesses/Criticisms:** Critics argue the "logic of attitudes" isn't *really* logic. Is the requirement for attitudinal consistency sufficiently robust and objective to ground logical necessity? Does it fully capture the *truth-conditional* intuition behind logic ("If P1 and P2 are true, C must be true"), or is it merely about psychological coherence? Is "disapproving of a combination of attitudes" the *right kind* of state to explain complex embeddings? It can feel strained.

  2.  **Gibbard's Strength/Weakness (The Rock: Plan Coherence):**
      *   **Strengths:** Provides a more systematic, structured account using hyperplans. Offers a clearer analogue to truth-conditions (a hyperplan "settles" normative questions). The explanation of validity as hyperplan coherence feels more like a formal constraint. Handles complex embeddings and quantification better.
      *   **Weaknesses/Criticisms:** Hyperplans are incredibly complex, abstract entities. Is positing them explanatory, or just pushing the problem back? Does grounding validity in *individual* hyperplan coherence make logic too subjective? While it mimics truth-conditional structure, does it *genuinely* recover the objectivity of logical truth, or is it still ultimately grounded in contingent features of our normative psychology (our need for coherent plans)? The "must" in the explanation ("your hyperplan *must* rule out C") relies on the *definition* of hyperplan coherence, which some argue is stipulative.

  **The Verdict for Your Novelists:**

  *   **Do they founder on the same rock?** **Broadly, yes, but dressed *very* differently.** The core challenge for *any* expressivism is explaining logical properties (validity, inconsistency) using only non-cognitive, conative states. Both Blackburn and Gibbard ultimately ground validity in a *kind of psychological or planning coherence requirement* (attitudinal consistency / hyperplan consistency) rather than in the representational truth/falsity of beliefs describing mind-independent facts. Realist critics argue this coherence requirement, however sophisticated, cannot fully replicate the *objective necessity* of logic grounded in truth-conditional semantics. The "rock" is the non-cognitive starting point itself.
  *   **Does either give a *more* satisfying explanation?** This is where your philosophers can have their genuine, heated disagreement:
      *   **Character A (Pro-Blackburn):** "Gibbard's hyperplans are monstrously complex metaphysical posits! He's smuggled in a truth-conditional structure while pretending to be expressivist. My higher-order attitudes capture the *lived experience* of moral reasoning and its constraints – the *practical* impossibility of holding P1 and P2 while rejecting C *is* the necessity of modus ponens for moral discourse. It's elegant, economical, and stays true to the spirit of expressivism!"
      *   **Character B (Pro-Gibbard):** "Blackburn's 'attitudinal logic' is hand-waving! He hasn't *explained* validity; he's just asserted a requirement for 'consistency' between fundamentally different kinds of states (simple attitudes vs. complex attitudes-about-attitudes). My hyperplans provide a *precise model* – validity *just is* coherence within a complete normative system. It explains *why* the inference holds structurally and handles complex cases Blackburn fudges. It's the only way to make expressivism systematically rigorous!"

  **For Your Bar Scene:** Focus on the *nature of the constraint* explaining validity. One character sees it as a fundamental *practical contradiction* in sensibility (Blackburn). The other sees it as a *structural inconsistency* within a complete normative blueprint (Gibbard). Argue about whether hyperplans are insightful tools or unnecessary monsters, and whether attitudinal consistency is profound or vague. The passion comes from each believing their approach *does* solve the problem elegantly while the other's is fundamentally flawed or compromised. Their decades-long prickly friendship persists *because* the Frege-Geach problem, even after Blackburn and Gibbard, remains a profound challenge at the heart of expressivism, ensuring neither can deliver a knockout blow. Good luck with the scene!
