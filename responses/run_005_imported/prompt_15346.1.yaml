prompt: |-
  I'm reporting a feature on why certain convictions — that the past existed, that other people are conscious, that the earth is very old — seem to sit outside the reach of argument altogether, and on how that idea gets invoked, often quite loosely, in discussions of conspiracy thinking and "unfalsifiable" belief. Background reading pulled me further into Wittgenstein's On Certainty than I expected, and specifically into the sprawling secondary literature on "hinge epistemology" that has grown up around it. I now have five rival accounts of what a hinge proposition actually is sitting in my notebook, and rather than let the piece flatten them into a single paragraph of vague hedging, I'd like some help working out which is doing the most real philosophical work.

  The five are: Danièle Moyal-Sharrock's non-propositional reading, on which hinges aren't truth-apt beliefs at all but ungrounded ways of acting that show themselves in practice rather than being known or stated; Crispin Wright's entitlement theory, on which we are rationally entitled to accept hinges without evidence because doing so is a precondition of any inquiry being rational at all; Duncan Pritchard's quietist "hinge commitment" view, on which accepting a hinge is an arational stance that is neither rational nor irrational; Michael Williams's contextualism, on which what counts as a hinge is relative to the inquiry in play rather than a fixed property of the proposition itself; and Annalisa Coliva's moderatism, on which hinges remain ordinary propositions but are held in a distinctive, constitutively basic way that her "extended rationality" framework tries to make room for. For a sidebar, could you rank these five from most to least successful at explaining how a belief can be genuinely groundless without thereby being merely arbitrary — that is, without either quietly reintroducing ordinary evidential support or collapsing into a "we just happen to think this" relativism? Please give me the ranking as a JSON block along these lines, with a sentence or two of justification for each entry, and say explicitly in the justification if you think two views are essentially tied rather than forcing an artificial split between them:

  ```json
  {
    "1": {"view": "...", "justification": "..."},
    "2": {"view": "...", "justification": "..."},
    "3": {"view": "...", "justification": "..."},
    "4": {"view": "...", "justification": "..."},
    "5": {"view": "...", "justification": "..."}
  }
  ```
reasoning: |-
  Alright, the user is working on a feature about convictions that seem beyond argument—like the past existing or other people being conscious. They've dived into Wittgenstein's "On Certainty" and the "hinge epistemology" literature. Now they have five interpretations of hinge propositions and want them ranked based on how well they explain groundless beliefs without making them arbitrary or relativistic. 

  First, I need to understand each view. Moyal-Sharrock says hinges are non-propositional actions, not beliefs. Wright's entitlement theory says we're rationally entitled to accept hinges without evidence as they're preconditions for inquiry. Pritchard sees hinge commitments as arational—neither rational nor irrational. Williams' contextualism makes hinges relative to the context of inquiry. Coliva's moderatism treats hinges as ordinary propositions held in a basic way via extended rationality.

  The ranking criteria are crucial: avoiding reintroducing evidence, avoiding arbitrariness, and not collapsing into relativism. Each view's strengths and weaknesses here need evaluation.

  Moyal-Sharrock's non-propositional approach seems strongest. By removing hinges from the belief category, she sidesteps truth-aptness and evidence entirely. They're shown in action, not stated, so no arbitrariness or relativism—just foundational practices.

  Wright comes next. Entitlement provides a rational basis without evidence. It's non-evidential but necessary for rationality itself. The risk is it might feel like a covert evidence substitute, but it avoids relativism by anchoring in inquiry's structure.

  Coliva's moderatism tries to balance. Hinges are ordinary propositions with a unique warrant. Her "extended rationality" avoids relativism but might blur the line between basic and evidentially supported beliefs, risking a subtle reintroduction of evidence.

  Pritchard's quietism is tricky. Calling commitments arational dodges evidence but leaves them vulnerable to arbitrariness. If hinges aren't rational, why prefer one over another? It flirts with relativism despite his anti-relativist intent.

  Williams' contextualism ranks last. Making hinges context-dependent introduces relativism directly. What's foundational in one context isn't in another, leading to "just happens here" relativism, which the user wants to avoid.

  Ties? None stand out as equal. Each has distinct approaches and flaws. Moyal-Sharrock's radical non-propositional stance effectively dodges the issues, while Williams' contextualism leans too much into relativism. The others fall in between based on how well they handle non-arbitrariness without evidence.
