  ## MEMORANDUM

  **TO:** Collections Committee, University Art Museum  
  **FROM:** [Your Name], Graduate Student Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation Regarding Attribution of Teaching Gallery Panel (Formerly "Circle of Gerrit Dou")  

  **BACKGROUND:**  
  Recent pigment analysis (zinc white detected in the ground layer) conclusively establishes that the small oak-panel genre scene (Accession # [Insert Number]), long catalogued as "Circle of Gerrit Dou," is a skilled 19th-century pastiche rather than a 17th-century work. This discovery fundamentally alters its historical context while leaving the *visible paint surface and technique* – the primary focus for studio art instruction in layered glazing – unchanged. The committee is divided on implications for its display.

  **CONSIDERED VIEWPOINTS:**

  1.  **"Technique-Centric" View (Keep Displayed):** The panel's pedagogical value for studio artists resides entirely in its perceptible surface qualities. The glazing technique demonstrated is authentic to the *method* being taught, regardless of the work's age or origin. Removing it deprives students of an exemplary visual resource based on information (chemical composition invisible to the eye) irrelevant to their learning objective. The value derived from direct observation remains intact.
  2.  **"Authenticity-Centric" View (Remove):** The panel's placement in the teaching gallery was predicated on its status as a genuine artifact of 17th-century Dutch practice, providing a direct "window" into period technique. This foundational context is now invalidated. Displaying it as a teaching tool for *historical* technique misrepresents its nature and undermines the museum's scholarly integrity, even if the visual effect is similar. Its continued display perpetuates a false premise.

  **PHILOSOPHICAL CONTEXT (Goodman & Forgery):**  
  Nelson Goodman's arguments in *Languages of Art* are highly relevant. He contends that knowing a work is a forgery (or pastiche) fundamentally alters our *cognitive* engagement with it, affecting perception itself ("allographic" arts). While the brushstrokes haven't changed, *what we know we are looking at* has. The "Circle of Dou" label provided specific art-historical expectations that shaped interpretation; removing that context changes the work's identity and meaning within the museum's educational narrative, regardless of visual similarity.

  **RECOMMENDATION & RATIONALE:**  
  **I recommend retaining the panel in the teaching gallery with immediate and prominent re-labeling, coupled with enhanced pedagogical framing, for an interim period of 2 years.** This recommendation takes the "Technique-Centric" view seriously but addresses the core concerns of the "Authenticity-Centric" view through radical transparency and repurposing.

  1.  **Immediate Action (Within 1 Week):**
      *   **Re-label Prominently:** Replace the label with:  
          `"Imitator of Gerrit Dou (Dutch School), 19th Century"`  
          `"Pastiche demonstrating layered glazing technique"`  
          *Provenance:* Previously attributed to the Circle of Gerrit Dou (17th C.). Pigment analysis (2023) confirmed a 19th-century origin. Retained for study of glazing technique.
      *   **Add Wall Text/QR Code:** Provide a brief, accessible explanation near the work:  
          *"This painting was long thought to be a 17th-century work by an artist near Gerrit Dou. Scientific analysis in 2023 revealed it is actually a highly skilled imitation made in the 1800s. While its *age* is different, the *painting technique* of building up translucent layers (glazing) to achieve luminous effects remains an outstanding example. It is displayed here specifically for studio artists to study this technique, acknowledging its complex history."*

  2.  **Enhanced Pedagogical Integration (Within 1 Month):**
      *   **Reframe Studio Assignments:** Instructors sending students to study the panel must explicitly frame it as "an exemplary study of layered glazing technique *executed in a later period*," directing focus solely to the observable surface.
      *   **Develop Cross-Disciplinary Module:** Collaborate with Conservation Science and Art History to create a teaching module *using this panel* about:
          *   Technical analysis (how pigment testing works).
          *   The history of pastiche and forgery.
          *   Shifting attributions and the role of science in connoisseurship.
          *   Goodman's arguments on authenticity and perception. This transforms the panel from a *passive* example of period technique into an *active* case study in material analysis, art history, and philosophical aesthetics.

  3.  **Interim Period & Review (2 Years):**
      *   **Retain for Defined Period:** Keep the panel in the teaching gallery for 24 months under the new label and framing.
      *   **Monitor & Evaluate:** Solicit specific feedback from Studio Art faculty and students: Does the reframing work? Is the glazing technique still effectively studied? Track usage of the cross-disciplinary module.
      *   **Actively Seek Alternatives:** Task curatorial staff with identifying potential *authentic* 17th-century Dutch works (within budget, possibly smaller works or fragments) or exceptionally high-quality reproductions/facsimiles that could serve the glazing technique teaching role long-term.
      *   **Formal Review (Q4 2025):** After 2 years, the committee re-evaluates based on:
          *   Pedagogical effectiveness for studio art.
          *   Success of the cross-disciplinary module.
          *   Availability of alternative resources.
          *   Ongoing feedback from stakeholders.
      *   **Decision Point:** Based on the review, decide to:
          *   Permanently retain the panel with its current educational mission.
          *   Move it to a different context (e.g., an exhibition on fakes/forgeries/pastiches, conservation science).
          *   Proceed with deaccession.

  **WHY THIS RECOMMENDATION?**

  *   **Honors Pedagogical Value:** It directly addresses the "Technique-Centric" view by preserving immediate access to the invaluable visual resource for students, acknowledging that the *perceptible technique* remains pedagogically sound.
  *   **Addresses Authenticity Concerns:** It confronts the Goodmanian issue head-on through radical transparency. The label and explanation explicitly dismantle the false historical context, preventing the work from functioning under false pretenses. It acknowledges the loss of the "period window" while repurposing the object.
  *   **Leverages the Discovery:** It transforms a problem into an opportunity for enriched, cross-disciplinary education, making the museum's process of discovery part of the teaching mission.
  *   **Provides a Clear Path Forward:** It avoids a permanent stalemate by setting a defined interim period with specific evaluation criteria and a mandate to seek alternatives, ensuring the situation is actively managed.
  *   **Upholds Integrity:** By being transparent and scholarly about the change in attribution and its implications, the museum maintains its integrity while pragmatically serving its educational functions.

  **TIMELINE SUMMARY:**

  *   **Immediate (By Next Gallery Opening):** Re-label panel and install explanatory text/QR code.
  *   **Short-Term (Within 1 Month):** Brief studio art faculty on reframing; develop cross-disciplinary teaching module.
  *   **Ongoing (Next 24 Months):** Implement module; actively seek alternative glazing examples; monitor feedback.
  *   **Review (Q4 2025):** Formal committee reassessment based on evaluation criteria.
  *   **Decision (Following Review):** Determine final disposition (retain in teaching role, repurpose, deaccession).

  This approach respects the valid concerns of both sides, leverages the panel's strengths, utilizes the discovery as an educational tool, and provides a responsible, time-bound framework for resolution.
