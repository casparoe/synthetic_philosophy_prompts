answer: |-
  You're absolutely onto something important, and your friend's objection, while clever, actually misses the mark. Your worry doesn't collapse into total self-doubt; it highlights a **specific and well-documented cognitive blind spot related to fatigue and impairment.**

  Here's why your concern is valid and survives her "total self-doubt" objection:

  1.  **Fatigue Specifically Impairs Metacognition:** Metacognition is your ability to judge your own mental state ("How tired am I?", "How well am I thinking?"). Crucially, **fatigue directly impairs this very ability.** As you get tired:
      *   Your reaction time slows.
      *   Your vigilance decreases (you miss things).
      *   Your decision-making worsens.
      *   **AND your ability to accurately perceive these declines diminishes.** You become *less aware* of how impaired you actually are. This is a known phenomenon, similar to how intoxicated people often overestimate their abilities.

  2.  **The "Alert Trap":** Feeling "totally alert" at 2 am after a party is *exactly* the state where this blind spot is most dangerous. You might be alert *relative to being half-asleep*, but still significantly impaired *relative to your fully rested state*. The feeling of "alertness" in that state is unreliable precisely because the system (your brain) responsible for generating that feeling is compromised. It's like a faulty fuel gauge that always reads "half-full" even as the tank empties.

  3.  **It's NOT About Doubting *All* Feelings:** Your friend's objection ("you could never trust anything you feel") is a false equivalence. We *routinely* trust our feelings *in contexts where our self-assessment mechanisms are functioning normally.*
      *   You trust you're hungry because the mechanism (stomach sensation, hormonal signals) is generally reliable when you're well-rested and healthy.
      *   You trust you're happy seeing a friend because the emotional feedback loop is intact.
      *   **The key difference is context:** Fatigue (like intoxication, severe stress, or certain medical conditions) is a *specific state known to disrupt the very mechanisms of self-assessment*. Doubting your self-assessment *in this specific, high-risk context* is prudent, not a slippery slope to total nihilism. We don't apply this doubt to *all* feelings, only to feelings about competence *when we have strong reason to believe our self-assessment tool is broken*.

  4.  **The Analogy to Intoxication:** This is the strongest counter to her point. We accept that someone who has been drinking:
      *   May *feel* perfectly capable of driving ("I'm fine!").
      *   Is demonstrably impaired (slower reactions, worse judgment).
      *   **Cannot accurately assess their own level of impairment.** Their feeling of being "fine" is unreliable *because* they are impaired.
      *   We don't say "If you can't trust a drunk person's self-assessment, you can't trust *anyone's* self-assessment ever!" We recognize intoxication *specifically* breaks the self-assessment tool. Fatigue does the same thing, albeit through a different biological pathway and often more insidiously.

  **A More Precise Version of Your Worry (That Survives Her Objection):**

  > *"Fatigue specifically damages the brain's ability to accurately self-monitor its own level of impairment. Therefore, feeling 'alert' or 'fine to drive' when significantly fatigued is an unreliable indicator of actual driving safety. Relying solely on that feeling in high-fatigue situations (like driving home at 2 am after a social event) is dangerous because the feeling itself may be a symptom of the impairment, not proof against it. This doesn't mean we distrust *all* self-assessments; it means we recognize that fatigue creates a known blind spot requiring extra caution (like using objective indicators or simply not driving), similar to how we treat intoxication."*

  **How to Counter Her Point & Practical Takeaway:**

  *   **"It's not about doubting *everything*, it's about recognizing when the *tool* for self-assessment is broken. Fatigue breaks that specific tool. Just like we don't trust a drunk person's assessment of their driving ability, we shouldn't fully trust a severely tired person's assessment, *especially* when they insist they feel fine. That 'feeling fine' might be the impairment talking."**
  *   **Focus on External Indicators & Prevention:** Instead of relying *only* on feeling, encourage looking for objective signs of fatigue (heavy eyelids, yawning, missing exits, drifting lanes, irritability) *before* getting behind the wheel, or better yet, plan ahead (nap, caffeine *before* driving, alternative transport, stay over) to avoid the high-risk situation altogether. The safest approach is to avoid driving when you *know* you've been awake too long or it's the middle of the night, *regardless* of how you feel in the moment.

  **In short: Your intuition is scientifically sound. Feeling alert while fatigued is notoriously unreliable. Her objection confuses a specific, well-understood cognitive vulnerability with a general philosophical problem of self-doubt. Your worry is precise, valid, and based on how human biology actually works under fatigue.**
