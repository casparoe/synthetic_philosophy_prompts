  Verdict: This is a common and strong objection to illusionism. The hard problem is about why there is any subjective appearance at all. If illusionism says the appearance is an illusion, then we must explain why that illusion (the seeming) exists and why it feels like something. This move highlights a gap in the illusionist account. Score: 2 (clearly right).

