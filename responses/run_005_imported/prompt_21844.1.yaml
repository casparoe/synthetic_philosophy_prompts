prompt: |-
  I have no formal training in either music theory or philosophy; everything in this message I have picked up on my own, largely as the byproduct of a hobby. For the past couple of years I have been teaching myself piano tuning, purely for my own amusement, and it was a tuning question that eventually walked me into Schopenhauer, of all people. A technician who once serviced my upright mentioned, almost as an aside, that "true" tuning is mathematically impossible, and the remark bothered me enough that I went looking into why. That search eventually took me to a piano forum thread claiming that Arthur Schopenhauer had, in the middle of his philosophy of music, tied this very fact about tuning to his entire theory of "the Will." I tracked the passage down myself in the old Haldane and Kemp translation of The World as Will and Idea. It comes quite late in the long chapter on music in Book Three, section 52 -- well after the part I found relatively easy to follow, where he matches the bass to the mineral kingdom, the inner voices to plants and animals, and the melody to human striving. The paragraph that has actually stopped me in my tracks is this one:

  "We have seen in the preceding book that notwithstanding the self-adaptation of all the phenomena of will to each other as regards their species, which constitutes their teleological aspect, there yet remains an unceasing conflict between those phenomena as individuals, which is visible at every grade, and makes the world a constant battle-field of all those manifestations of one and the same will, whose inner contradiction with itself becomes visible through it. In music also there is something corresponding to this. A complete, pure, harmonious system of tones is not only physically but arithmetically impossible. The numbers themselves by which the tones are expressed have inextricable irrationality. There is no scale in which, when it is counted, every fifth will be related to the keynote as 2 to 3, every major third as 4 to 5, every minor third as 5 to 6, and so on. For if they are correctly related to the key note, they can no longer be so to each other; because, for example, the fifth must be the minor third to the third, etc. For the notes of the scale may be compared to actors who must play now one part, now another. Therefore a perfectly accurate system of music cannot even be thought, far less worked out; and on this account all possible music deviates from perfect purity; it can only conceal the discords essential to it by dividing them among all the notes, i.e., by temperament."

  Taken separately, each half of this makes sense to me. I understand, at least in outline, why no closed tuning system can make every fifth a pure 3:2 and every third a pure 5:4 or 6:5 simultaneously -- I gather this is essentially the reason things like the syntonic and Pythagorean commas exist, and why equal temperament had to be invented as a compromise. And separately, I can follow the metaphysical claim that the will is fundamentally one thing that nonetheless turns against itself through the many individuals in which it appears. What I can't work out is the logical status of the connection Schopenhauer draws between the two. Is he actually offering the mathematics of tuning as evidence for a metaphysical claim, in the sense that someone with no prior sympathy for his system ought to find this passage at least a little persuasive on its own terms? Or is it closer to a decorative illustration of a conclusion he has already reached on entirely separate grounds, doing no real argumentative work at all? And given how much weight he puts elsewhere on music as the one art that reveals the will directly and without disguise, would he even be willing to admit that a tuning analogy could count against his metaphysics if it happened to fail -- or is the whole comparison built so that it couldn't possibly go the other way? I would like to understand exactly what kind of claim is being made here before I decide how seriously to take it.
