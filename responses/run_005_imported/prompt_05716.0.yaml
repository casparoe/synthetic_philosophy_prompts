  ## Beyond Symmetry: Why McMahan's Revisionism, Despite Epistemic Challenges, Offers a Morally Truer Account of Combatant Equality

  The principle of the moral equality of combatants (MEC), famously defended by Michael Walzer, asserts that soldiers fighting on both sides of a conflict possess equal rights to kill enemy combatants and are equally liable to be killed, regardless of the justice of their nation's cause (*jus ad bellum*). Walzer's "independence thesis" insists that the rules governing conduct *in* war (*jus in bello*) are logically and morally separate from the justice *of* the war. While this symmetry offers practical clarity, Jeff McMahan's revisionist critique in *Killing in War* dismantles its moral foundations. McMahan argues that liability to defensive harm stems from moral responsibility for an unjust threat. Consequently, soldiers fighting an unjust war generally lack the right to kill just combatants and are not morally equivalent. **Although the epistemic challenge – the difficulty ordinary soldiers face in reliably judging *jus ad bellum* – presents a significant practical hurdle to implementing McMahan's "deep morality," it does not invalidate his core moral argument. Walzer's symmetry, while pragmatically appealing, ultimately rests on a morally indefensible fiction that absolves unjust combatants of responsibility, making McMahan's account, despite its complexities, the more ethically coherent position.**

  **Walzer's Symmetry: Practicality over Moral Truth?**  
  Walzer grounds MEC in the concept of war as a "mutual contract of risk." Soldiers, he argues, are coerced instruments of the state, stripped of their political autonomy when they enter the "war convention." Their moral status derives not from the cause they serve but from their shared role as combatants facing reciprocal dangers. Killing an enemy combatant is justified not because the enemy is morally culpable *for the war*, but because they pose an immediate, reciprocal threat. This independence of *jus in bello* from *jus ad bellum* ensures the possibility of rules governing wartime conduct, protecting civilians and limiting suffering, even amidst an unjust aggression. The famous "naked soldier" vignette illustrates this: a soldier bathing is hors de combat and immune, regardless of his side's guilt. Walzer's model prioritizes the practical necessity of clear, symmetrical rules applicable to all combatants, fostering restraint and predictability in the inherently chaotic realm of war.

  **McMahan's Revision: Liability Based on Responsibility**  
  McMahan fundamentally challenges Walzer's separation thesis. He argues that the justification for killing in war is derivative of the justification for individual self- and other-defense. The right to kill hinges on moral liability: one becomes liable to defensive harm only if they are *morally responsible* for an *unjust threat*. Soldiers fighting a just war (e.g., defenders against aggression) pose a *justified* threat to unjust combatants. Therefore, unjust combatants (those fighting for an unjust cause) lack the right to kill just combatants, as killing them would be eliminating someone posing a *justified* threat. Conversely, just combatants *do* possess the right to kill unjust combatants because the latter pose an *unjust* threat. McMahan thus rejects MEC: combatants are morally unequal based on the justice of their cause and their individual responsibility for posing an unjust threat.

  Crucially, McMahan distinguishes between the **"deep morality" of war** – the fundamental moral principles governing liability and justification – and the **"law of war" (LOAC)**. He acknowledges that the deep morality, demanding knowledge of *jus ad bellum* for each act of killing, is often impractical for soldiers to apply in real-time. The law, therefore, must often operate with different, more workable rules – potentially *including* a *legal* version of combatant equality – for pragmatic reasons like preventing chaos and maintaining minimal humanitarian standards. However, this legal convention does not reflect the underlying moral truth.

  **Confronting the Epistemic Elephant: The Knowledge Problem**  
  The most potent objection to McMahan is the **epistemic challenge**: How can ordinary soldiers, subjected to propaganda, fog of war, limited information, and state coercion, possibly make reliable judgments about the *jus ad bellum* of their own war, let alone the enemy's? If they cannot, then holding them morally accountable based on an assessment they cannot reliably make seems unfair and unworkable. This challenge is not glossed over; it strikes at the heart of applying McMahan's deep morality. Critics argue that Walzer's model avoids this paralyzing uncertainty by providing clear, symmetrical rules based solely on combatant status, independent of unknowable (to the soldier) higher justifications.

  **Defending McMahan Against the Epistemic Tide**  
  While formidable, the epistemic challenge does not defeat McMahan's core moral argument; it primarily impacts its *practical application* and reinforces the need for his law/morality distinction.

  1.  **Moral Truth vs. Practical Application:** The epistemic problem highlights *why* we need a separate law of war, not why Walzer's symmetry is morally correct. That soldiers often cannot *know* the deep morality doesn't mean it ceases to exist. We accept that individuals in civilian life acting in genuine, reasonable self-defense based on appearances are morally justified, even if later evidence shows they were mistaken about the threat. The *moral justification* hinges on the *objective facts*, even if the *actor's knowledge* is imperfect. Similarly, McMahan's deep morality describes the objective moral landscape of war. The difficulty of perception doesn't change that landscape; it just makes navigating it according to its true contours incredibly hard.
  2.  **When Knowledge *Is* Possible:** The epistemic challenge is often overstated. There *are* clear cases where the unjust nature of a war is evident. The Nazi invasion of Poland, Saddam Hussein's invasion of Kuwait – these were unambiguous acts of aggression. Soldiers participating *know* (or *should* know, barring extreme indoctrination) they are part of an aggressive, unjust war. McMahan's model rightly holds them morally accountable for perpetuating an unjust threat in such contexts. Walzer's symmetry, conversely, morally absolves them simply for wearing a uniform, which is deeply problematic.
  3.  **Walzer's Symmetry Creates Its Own Moral Hazard:** Walzer's model *itself* suffers from an epistemic flaw. It requires soldiers to *know* who is a combatant and who is a civilian to apply *jus in bello* rules. Distinguishing combatants from civilians is often just as difficult and error-prone as making basic *jus ad bellum* judgments (e.g., is this a defensive war or not?). If epistemic uncertainty invalidates moral distinctions, it should invalidate the combatant/civilian distinction too – a conclusion Walzer rightly rejects. Furthermore, MEC provides a dangerous moral shield: it tells the soldier fighting for an obviously unjust, aggressive cause that their killing is morally permissible *simply because they are a soldier*. This undermines moral responsibility and incentivizes participation in unjust wars.
  4.  **McMahan's Framework Drives Reform:** Acknowledging the deep morality, even if the law must sometimes diverge for practicality, provides a crucial moral compass. It highlights that the current LOAC, while necessary, is morally imperfect. This awareness should drive efforts to improve the law and institutions (like robust international courts) to better hold *states* and *leaders* accountable for *jus ad bellum* violations, reducing the burden on individual soldiers. It also encourages better moral education for soldiers about the nature of just wars.

  **Conclusion: Embracing Moral Complexity**  
  Michael Walzer's defense of the moral equality of combatants offers a streamlined, practical framework for regulating warfare. However, its elegant symmetry is built on the morally dubious foundation that posing an unjust threat carries no greater moral burden than defending against one. Jeff McMahan's revisionist critique, grounded in the fundamental ethics of self-defense and individual responsibility, exposes this symmetry as a dangerous fiction. While the epistemic challenge – the difficulty soldiers face in knowing the justice of their cause – is a serious practical concern, it does not refute McMahan's core insight about liability based on moral responsibility. Instead, it explains why the *law* of war might need symmetrical conventions, even as we recognize they deviate from the "deep morality." Walzer's model, by morally absolving unjust combatants, fosters complacency and undermines accountability. McMahan's account, demanding we confront the uncomfortable truth that not all who fight do so justly, offers a morally truer, albeit more complex, vision. It compels us to strive for a world where the law better reflects the deep morality, where aggression is unequivocally condemned, and where soldiers are not merely cogs in a state machine, but moral agents accountable for the threats they unjustly pose. The difficulty of knowing the just side does not erase the moral difference between being on it or against it.
