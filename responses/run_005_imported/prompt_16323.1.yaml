answer: |-
  Here are 8 conversational but probing questions, designed to push beyond the basics, with notes on likely answers and quick follow-up prompts:

  1.  **On the Ignorant High-Stakes Subject:** "You've argued that whether someone *knows* depends on the actual practical stakes. But take someone who's *unaware* they're in a high-stakes situation – say, they're about to unknowingly bet their life savings on a hunch they feel totally confident about. Does your view say they *don't* know? If so, does that mean we need to build in *their* beliefs about the stakes after all to capture the intuition that they *feel* like they know?"
      *   *Likely Answer:* She'll likely deny they know, emphasizing the *objective* stakes matter. She might downplay the "feel like they know" intuition or argue it's about justification/confidence, not knowledge.
      *   *Follow-Up Prompt:* "So, is the key factor entirely external – the *actual* stakes – regardless of what the subject believes or is aware of? Does that make the subject's own perspective on their epistemic situation less central?"

  2.  **Distinguishing from Contextualism (DeRose-style):** "A lot of folks hear 'pragmatic encroachment' and think it's basically Keith DeRose's contextualism in new clothes – both seem to explain why we say 'knows' in low-stakes bank cases and deny it in high-stakes ones. Could you pinpoint where the *mechanism* fundamentally differs? Is it that contextualism changes the *meaning* of 'knows', while encroachment changes the *facts* about knowledge itself?"
      *   *Likely Answer:* She'll emphasize that contextualism makes "knows" context-sensitive (speaker-dependent), while encroachment is a form of *invariantism* – the truth-conditions for "S knows that p" are fixed, but include practical factors.
      *   *Follow-Up Prompt:* "So, for you, if two people in identical evidential states but different practical situations both say 'I know P', one could be speaking truly and the other falsely, even if neither is context-shifting? How would we *test* for that difference empirically?"

  3.  **The Slippery Slope to Skepticism & Sorites:** "If knowledge can fade away as practical stakes increase, even with the same evidence, doesn't this risk turning *every* high-stakes situation into a skeptical scenario? And if the shift isn't sharp but gradual – say, stakes increasing incrementally – how do we avoid a Sorites paradox for 'knows'? Where's the non-arbitrary cutoff?"
      *   *Likely Answer:* She'll likely deny it leads to widespread skepticism, arguing that very high stakes are rare, or that knowledge *can* survive very high stakes if evidence is strong enough. On gradualism, she might embrace vagueness or point to salience thresholds.
      *   *Follow-Up Prompt:* "But isn't 'salience' or 'significance' itself vague? If knowledge *can* gradually disappear with rising stakes, doesn't that mean there's *always* a point where adding just one more dollar of potential loss makes the difference between knowing and not knowing, which seems paradoxical?"

  4.  **Moral Encroachment Connection:** "There's growing interest in 'moral encroachment' – the idea that moral stakes (e.g., potential harm, injustice) can also affect knowledge, independently of practical stakes. Is this a natural extension of your pragmatic encroachment framework, or do you see important reasons to resist collapsing moral factors into practical ones?"
      *   *Likely Answer:* She might cautiously endorse it as compatible or analogous, seeing moral stakes as a *type* of practical stake (e.g., stakes involving moral responsibility). Alternatively, she might resist, arguing practical stakes concern the *subject's* goals, while moral stakes are external/normative.
      *   *Follow-Up Prompt:* "If you *do* resist moral encroachment, what shields purely epistemic norms from moral considerations? If you *accept* it, does this mean evidence supporting harmful stereotypes might require *more* justification to count as knowledge, even if practically irrelevant to the subject?"

  5.  **Actionability & Knowledge:** "A core motivation for pragmatic encroachment is linking knowledge to action – you can appropriately act on what you know. But in your view, does knowing P *entail* that acting as if P is rational, or is it the other way around (acting rationally entails knowing)? How tight is this connection, and what happens when actionability seems decoupled from stakes?"
      *   *Likely Answer:* She'll likely say high stakes raise the threshold for knowledge *because* they raise the threshold for rational action. Knowledge is the norm for action, so when rational action requires more, so does knowledge.
      *   *Follow-Up Prompt:* "Could there be cases where acting rationally requires very high confidence, but the *epistemic* standard for knowledge remains low? Or are the standards necessarily linked?"

  6.  **Whose Stakes Matter? Relativism Concerns:** "In a social context, whose practical stakes determine whether an individual 'knows'? For instance, if a doctor knows a patient's test result in a low-stakes research setting, but revealing it casually to a colleague *could* have high stakes for the patient's privacy, does the doctor cease to 'know' the result in that conversational context?"
      *   *Likely Answer:* She'll likely say the stakes relevant to the *subject* (the doctor) in the context of their potential *action* (speaking) matter. It's not the listener's stakes directly, but how the speaker's action impacts things they are responsible for/care about.
      *   *Follow-Up Prompt:* "Doesn't this risk making knowledge highly relative to the subject's current *awareness* of potential downstream consequences of their actions? How far downstream do the stakes count?"

  7.  **Methodology: Beyond Intuitions about Cases:** "While intuitions about bank cases or airport scenarios drive the debate, what broader methodological reasons, perhaps concerning the *role* or *function* of knowledge attributions, lead you to favor pragmatic encroachment over rival explanations (like varying standards for justification, or simple error theory about our intuitions)?"
      *   *Likely Answer:* She'll emphasize the tight link to rational action, the explanatory power for shifting attributions, and perhaps argue it better reflects how we actually *use* knowledge ascriptions in practical reasoning.
      *   *Follow-Up Prompt:* "Couldn't a theory that keeps knowledge purely epistemic but adds a separate 'actionable justification' norm explain the same phenomena without altering the *truth-conditions* of 'knows'?"

  8.  **Alternative Explanations: Salience vs. Stakes:** "Some critics suggest the 'stakes' effects are really about the *salience* of error possibilities, not the practical consequences themselves. A vividly imagined disaster might raise the evidential bar psychologically, even if the actual stakes are low. How does your view rule out this alternative explanation?"
      *   *Likely Answer:* She'll argue that salience often *tracks* stakes, but crucially, one can have high stakes without salient error possibilities (e.g., the ignorant high-stakes subject), and vice-versa (vivid but irrelevant error possibility in low stakes), and intuitions track the *stakes* in these cases.
      *   *Follow-Up Prompt:* "In cases where salience and stakes genuinely come apart, how confident are we in the intuitions? Isn't it possible that making stakes high *also* makes error possibilities more salient, making it hard to isolate the pure 'stakes' effect?"

  **Key for Chairing:**

  *   **Listen Actively:** Pay close attention to her answers – don't just wait to ask the next question. Her response might naturally lead to a follow-up from a different question on your list.
  *   **Adapt:** If she gives an unexpected or particularly interesting answer to one question, be ready to dive deeper there instead of rigidly sticking to the list.
  *   **Clarify & Paraphrase:** If an answer is complex or jargon-heavy, briefly paraphrase it for the audience ("So, if I understand, you're saying that...") before moving to the follow-up or next question.
  *   **Pace:** Keep things moving. Don't let her filibuster on any one answer. Gently interject with "Thanks, that's helpful. Let's turn to..." or "Building on that, about the distinction with contextualism..."
  *   **Audience:** Keep an eye on the audience. If they seem confused by an answer, ask for clarification on their behalf. Save time for audience questions after yours.

  This set pushes on core theoretical tensions, demands clarification on key distinctions, and connects to adjacent debates, all while staying grounded in the motivations and implications of her view. Good luck with the Q&A!
