answer: |-
  Here’s a dialogue between Dr. Lena Shaw (a scientific realist leaning toward structural realism) and Dr. Marcus Vale (a pessimistic meta-induction advocate), both well-versed in the history and philosophy of science. They engage deeply on the Fresnel-to-Maxwell case and stress-test with another historical theory.

  ---

  **Setting:** A university coffee shop after a colloquium on scientific realism. Papers are strewn across the table, including printouts of Fresnel’s 1819 memoir and Maxwell’s 1865 equations.

  **Lena Shaw (Realist):** ...so when your friend invoked the pessimistic meta-induction last night, did they address *why* Fresnel’s equations survived Maxwell’s revolution? That’s the key hole in the argument.  
  **Marcus Vale (Anti-Realist):** Oh, she mentioned it. But survival of equations doesn’t imply truth-tracking—it just means math is portable. Fresnel thought light waves were literal *vibrations in a mechanical ether*. Maxwell showed it was electromagnetic fields. The ontology was scrapped, Lena.  
  **Lena:** But the *relations* survived! Fresnel’s equations describe how light behaves at interfaces—amplitude, phase, polarization. Those relationships were preserved because they captured structural truths about wave propagation. Structural realism doesn’t care about the "furniture" (ether vs. fields)—it cares about the patterns.  
  **Marcus:** Patterns inferred *through* the furniture! Fresnel derived those equations *from* ether mechanics. His boundary conditions assumed an elastic solid. If you’d told him in 1820, "Your math will live on, but your ether is fiction," he’d have called you mad. How do we know which parts of *today’s* theories are the "structural" bits? Take quantum wave functions—  
  **Lena:** —Ah, but Fresnel’s core equations *didn’t depend* on ether’s mechanical details. When Maxwell reinterpreted them as EM fields, he kept the form: same differential equations, same sinusoidal solutions. That’s not portable math—it’s robust structure!  
  **Marcus:** Robust *how*? Fresnel’s theory also predicted partial dragging of the ether—Fizeau tested it in 1851, and it worked! But that part *didn’t* survive relativity. Einstein dumped the ether but kept Fizeau’s result by reinterpreting it as velocity composition. So: one "successful" ether prediction kept, another discarded. Real-time scientists couldn’t tell which was which.  
  **Lena:** Fair, but the *mathematical kernel* survived both times: first in Maxwell, then in special relativity. The invariant is the wave equation’s form under transformations. That’s structural continuity!  
  **Marcus:** Let’s stress-test that. Take caloric fluid. Early 1800s: it explained heat flow, phase changes, even predicted Carnot’s engine efficiency. The math for adiabatic expansion? Perfect. Then thermodynamics discarded caloric, kept Carnot’s equations by reinterpreting heat as energy, not fluid. Same as Fresnel! So: is "caloric structure" real? Or did we just salvage useful math while torching the ontology?  
  **Lena:** ...Carnot’s efficiency formula survives because it describes a structural constraint—energy conservation. Caloric theory got *that* right, even if its substance was wrong.  
  **Marcus:** But Carnot *derived* efficiency *from caloric’s conservation*. If we apply your structural realism, we should say, "Caloric theory latched onto real structure (energy conservation), so it was approximately true." But no one believes caloric was "approximately true"! It was *false*—heat isn’t conserved; entropy increases. The math worked *despite* the ontology.  
  **Lena:** You’re conflating two things. Caloric’s error was assuming heat conservation. The *surviving* bit—Carnot’s formula—doesn’t rely on that. It was *reconciled* with entropy. That’s progress!  
  **Marcus:** Progress, yes—but not truth-tracking. Fresnel’s ether had 20+ mechanical models (vortex sponges, anyone?). All made similar predictions. Why? Because they were *tuned* to fit data, not because they mirrored reality. Today’s dark matter models? Same tune: WIMPs, axions, MOND tweaks—all fit galactic rotation. One day, we’ll keep the rotation curves and scrap the particles.  
  **Lena:** But the structural core—"gravitational effects exceed visible mass"—*will* survive, just like EM waves survived the ether! You can’t deny the predictive precision: quantum electrodynamics nails magnetic moments to 10 decimal places. That’s not just "useful"; it’s latching onto something real.  
  **Marcus:** Phlogiston nailed metal calcination and combustion for 100 years! It predicted new metals would release phlogiston when reduced—and they did. Precision ≠ truth. Every dead theory had "miraculous" successes until it didn’t. Your structural retreat just moves the goalposts: when ontology fails, you say, "Ah, but the *structure*..." But in real time, we can’t know which structure is durable. Why is "field" more real than "ether" if both are unobservable posits?  
  **Lena:** Because fields are *integrated*—EM, weak, strong forces unified in QFT. Ether was ad hoc. Cross-theory consistency—  
  **Marcus:** Etherists said the same! They linked light, heat, and electromagnetism. Maxwell himself tried mechanical ether models until he gave up and went mathematical. The "integration" you praise is retrospective.  
  **Lena:** ...So you’d discard realism entirely?  
  **Marcus:** No—I’d say: believe theories are empirically adequate, not true. Keep the math; stay agnostic about the furniture. When your friend said, "It’d be a miracle if they weren’t tracking truth," remind her: every scientific era had its "miracles." Until the next revolution.  
  **Lena:** And if we ever find a theory of everything?  
  **Marcus:** Then I’ll ask: what did it discard from quantum gravity?  
  *(Both fall silent, stirring cold coffee.)*  
  **Lena:** ...We should run this as a seminar.  
  **Marcus:** Only if we serve ether-era wine.  
  **Lena:** *(Wryly)* Or caloric-era coffee. It’d never cool down.  

  ---

  **Key exchanges unpacked:**  
  - **Structural retreat:** Lena argues Fresnel’s equations survived because they describe *relations* (structural realism). Marcus counters that scientists couldn’t distinguish "structural" from "doomed" elements in real time (e.g., ether dragging vs. reflection equations).  
  - **Stress-test with caloric:** Marcus invokes Carnot’s efficiency—a "successful" prediction derived from false ontology (caloric fluid)—to show survival of math ≠ truth-tracking. Lena parries by separating the enduring structural constraint (energy conservation) from discarded substance.  
  - **Real-time problem:** Marcus hammers the "pessimistic meta-induction" core: past theories were successful but false, so why trust current ones? Lena’s structural realism offers a defense, but Marcus insists it’s only viable retrospectively.  

  **No winner:** Lena’s structural realism tempers the meta-induction by identifying preserved mathematical structure, but Marcus’s historical examples show scientists lack criteria to identify "durable structure" *before* theory change. The dialogue ends where your debate did: with unresolved tension between predictive success and historical caution.
