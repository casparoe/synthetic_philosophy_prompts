answer: |-
  ## The Ugly Name & The Unsettled Account  
  *(Cambridge, 1905. William James finds Charles Sanders Peirce hunched over a cluttered desk. The air smells of pipe smoke and old paper. James holds a journal open to Peirce’s recent article.)*

  **James:** Charles! This ‘pragmaticism’ business. ‘Ugly enough to be safe from kidnappers’? Really? *(He chuckles, but his eyes are sharp.)* It’s a fine joke, but it lands rather pointedly at my doorstep, wouldn’t you say? After all, I’m the fellow who keeps inviting you to lecture, hoping some of that formidable brain might finally earn you a stable post. Seems I’m also the kidnapper mangling your brainchild?

  **Peirce:** *(Looks up, weary but alert. A flicker of guilt crosses his face, quickly replaced by intellectual fervor.)* William. Gratitude isn’t absent, believe me. Your support… it’s been a lifeline. But philosophy, *my* philosophy – it demands precision! You and Schiller… you took my maxim, designed to clarify *conceptions* by tracing their practical bearings, and turned it loose on *truth itself*! You declared “Truth *is* what works”! That’s… that’s like using a scalpel to chop firewood. You’ve collapsed the entire edifice.

  **James:** Collapsed? Nonsense! We *expanded* it! Made it live in the world where real people sweat and hope and doubt! Your maxim *is* the key: the meaning of a conception lies in its conceivable practical effects. So what *is* the practical effect of calling an idea ‘true’? It *works*. It guides us satisfactorily through experience. It pays dividends – its ‘cash value’. If believing in free will *works* for a man, makes him strive harder, live better – then, for him, in that concrete context, it *is* true. Truth *happens* to an idea. It *becomes* true, *is made* true by events. Why fence it off in some abstract, bloodless future?

  **Peirce:** Because you confuse the *psychological satisfaction* of a belief with its *truth*! What ‘works’ for a solitary individual *right now* – what soothes *his* nerves, props up *his* hopes – that’s mere expediency! Psychology! It reduces truth to a transient feeling. What if believing he can fly ‘works’ for a man’s courage until he steps off the roof? His ‘truth’ shattered him. Your view, William, risks solipsism – a million private ‘truths’ colliding in chaos. It surrenders truth to the whims of the moment and the individual. That’s not science; it’s… wish-fulfillment! Especially on things like God – you invite anyone to believe whatever gives them comfort and call *that* truth? It renders the concept meaningless!

  **James:** Comfort? It’s deeper! It’s about vital *orientation* in a precarious universe! Some truths *are* made by believing – moral effort, social cohesion! But even for ‘hard’ facts – isn’t the *whole point* of scientific inquiry that its results *work*? They predict, they control, they let us build bridges that don’t fall down! The ‘truth’ of gravity is precisely its inescapable, practical *working* in every experiment! Where’s the gulf?

  **Peirce:** The gulf, William, lies in the *source* and the *telos*! The truth of gravity isn’t established because it pleases *me* today. It’s established because countless investigators, using public methods (logic, observation, experiment – the *community’s* methods!), testing against a stubborn reality that resists mere wishing, are driven – *fated* – to converge upon the *same* conclusion *in the long run*. Truth isn’t what works *for me now*; it’s the *final, settled opinion* that the community of inquiry, pursuing its investigations diligently and self-correctingly, *would* inevitably arrive at, given sufficient time and evidence. It’s independent of you, or me, or our passing needs. It’s the North Star we steer by, even when clouds obscure it.

  **James:** *(Leans forward, intensity matching Peirce's.)* Ah, the ‘final opinion’! The ‘long run’! Charles, my dear friend, isn’t *that* your own metaphysical ghost? What possible *practical* difference does it make *today* whether some hypothetical community *eons hence* converges on an opinion? How do I cash out *that* notion *now*? You rail against my ‘psychology’, but you posit an ideal convergence utterly detached from any *current* experience or action! Isn’t this ‘fated final opinion’ just the old Absolute Truth in pragmatic disguise? Something we must *assume* but can never *use*? Your maxim dissolves *conceptions* into practical effects. What are the practical effects *right here, right now* of this ‘final opinion’? If it guides no *present* inquiry, solves no *current* doubt, fulfills no *concrete* human need – isn’t it precisely the kind of empty abstraction pragmatism was meant to destroy? You smuggled the Absolute back in through the back door!

  **Peirce:** *(Stung, but thoughtful. He taps his pipe.)* It’s not empty, William. The *belief* in a *real* truth – independent of our whims, towards which inquiry *tends* – that belief *itself* has immense practical bearings *now*. It fuels the *discipline* of science. It demands we submit our personal biases to public test. It fosters cooperation among investigators. It gives meaning to *doubt* as a spur, and to *fallibilism* – knowing we might be wrong *now*, but trusting the *process* to correct us. Without that regulative ideal of a *final* settlement, why strive for consistency? Why correct errors? Why not just embrace whatever belief feels good *today*? Your ‘cash value’ is immediate coin, but it risks inflating the currency into worthlessness. My ‘final opinion’ is the gold standard we strive to approximate, even if we never hold the full ingot. It keeps inquiry honest.

  **James:** Honest? Or paralyzed by an impossible ideal? You demand we anchor our truths in a shore no ship can ever reach! My ‘cash value’ may be coin, but it’s coin that buys bread *today*, that lets us *live* and *act* with conviction in an unfinished world. Your ‘gold standard’ is a beautiful picture on a banker’s wall, but if it can’t be spent, can’t energize a single human heart *now* – what good is it *pragmatically*? Isn’t the working, the energizing, the *life-giving* power of a belief its *truest* validation? You saved the *concept* of truth from metaphysics only to exile it to an unreachable future!

  **Peirce:** And you saved it from the future only to drown it in the subjective present! We need *both*, William – the vital force *and* the guiding star. Without the star, the force is blind. Without the force… *(He sighs, looking at his chaotic desk, then back at James with a mix of frustration and deep respect.)* …well, without the force, nothing moves at all. Perhaps that’s the real wall, not between us, but inherent in the human condition. Pass me that tobacco, will you? Let’s smoke on it. The long run, as you know, requires sustaining the present effort.

  *(James hands him the pouch, a wry, acknowledging smile touching his lips. The argument isn't settled, but the respect, and the fundamental tension, remain.)*

  ---

  **Key Elements Captured:**

  1.  **The Personal Stakes:** James references his support and the "kidnapper" barb. Peirce acknowledges the debt but prioritizes philosophical integrity.
  2.  **James's Core:** Truth = what works concretely *now*, vital for life/action, "cash value," applicable to religious/moral beliefs ("vital orientation"), truth "happens" and is "made."
  3.  **Peirce's Core:** Truth = the final opinion of the community of inquiry *in the long run*. Rejects collapsing truth into individual psychology/expediency. Emphasizes reality's resistance, public methods, fallibilism, and the *regulative ideal* guiding current inquiry.
  4.  **James's Strong Critique:** Accuses Peirce's "final opinion" of being unpragmatic metaphysics – no practical cash value *now*, an empty abstraction ("metaphysical ghost," "Absolute Truth in disguise").
  5.  **Peirce's Defense:** Argues the *belief* in real, convergent truth *has* present practical value: it drives scientific discipline, cooperation, and error-correction. It's the necessary "gold standard."
  6.  **Mutual Respect & Stalemate:** The dialogue ends with no clear "winner." Peirce concedes the need for the "vital force" (James's emphasis), James acknowledges the tension ("the real wall"). The disagreement is fundamental and tied to deep philosophical commitments about time, community, and the nature of inquiry itself.
  7.  **Grounding in 1905:** The "pragmaticism" jab is the catalyst, setting the personal and philosophical tension.
