  Contextualism posits that the meaning of "knows" changes based on conversational context. In high stakes, the standards for "knows" rise, so the same evidence no longer meets the new threshold. It's about semantics—the word's meaning shifts. Pragmatic encroachment, however, argues that knowledge itself is partly constituted by practical factors. Stakes directly affect whether someone has knowledge, not just how we talk about it. So, for contextualism, it's about language; for pragmatic encroachment, it's about the nature of knowledge.

  The user might be conflating the two because both predict the same outcomes in thought experiments. But the underlying mechanisms are different. The user's deeper need is to accurately present these theories without conflating them, ensuring their feature is philosophically sound. They might also need to explain why the distinction matters—perhaps to highlight different implications for how we understand knowledge under pressure.

  I should structure the explanation by first outlining each theory separately, then contrasting their core differences: semantics vs. metaphysics, standards vs. knowledge itself. Emphasizing the "why" behind the attributions will clarify the distinction. Also, noting that contextualism preserves classical invariantism while pragmatic encroachment rejects it could help. Examples like the bank case applied to each theory might make it clearer. Finally, summarizing why the difference matters for understanding the impact of stakes on cognition.
answer: |-
  You're absolutely right that both contextualism and pragmatic encroachment (PE) *explain* the same bank case phenomenon (stakes affect knowledge attributions), and that's why they seem identical at first glance. The crucial difference isn't *what* they explain, but **how** they explain it – specifically, **what they think is *changing* when stakes change**. It's a fundamental disagreement about the *nature of knowledge* and the *meaning of "knows"*.

  Here's the breakdown:

  1.  **Epistemic Contextualism:**
      *   **Core Claim:** The word "knows" is **context-sensitive**. Its meaning (specifically, the *epistemic standards* required to satisfy it) shifts depending on the *conversational context* of the speaker making the knowledge attribution.
      *   **Explanation of Bank Case:**
          *   **Low Stakes Context:** When nothing much is riding on it, the speaker's context sets relatively *low standards* for "knows." The couple's evidence (past Saturdays, seeing hours) easily meets these low standards. So, "We know the bank is open Saturday" is **true**.
          *   **High Stakes Context:** When a mortgage payment is at stake, the speaker's context automatically sets *much higher standards* for "knows." The *same evidence* that met the low standards now fails to meet these newly heightened standards. Therefore, "We know the bank is open Saturday" becomes **false** (or at least, not confidently assertable as true) *in this new context*.
      *   **What Changes?** **The meaning/semantic standards of the word "knows" itself**, relative to the speaker's conversational context. Knowledge itself (as a mental state) *might* remain invariant, but whether we *call* it "knowledge" depends on the context's standards.
      *   **Analogy:** Like the word "tall." "Is John tall?" depends on context (tall for a jockey vs. tall for a basketball player). John's height doesn't change, but whether "tall" applies does. Similarly, the subject's evidence/mental state might not change, but whether "knows" applies does.

  2.  **Pragmatic Encroachment (PE):**
      *   **Core Claim:** Whether an agent **genuinely knows** a proposition *p* depends not *only* on "traditional" epistemic factors (like evidence, reliability, truth) but *also* on **pragmatic factors**, primarily the **stakes** or practical costs of being wrong about *p*. Knowledge itself is *partly constituted* by practical interests.
      *   **Explanation of Bank Case:**
          *   **Low Stakes:** The couple's evidence *is sufficient for knowledge* because the cost of being wrong is low. They **do know** the bank is open.
          *   **High Stakes:** The *exact same evidence* is **no longer sufficient for knowledge** because the stakes are so high. The astronomically higher cost of being wrong means their evidence doesn't meet the *epistemic* bar for knowledge anymore. They **do not know**.
      *   **What Changes?** **The epistemic status of the belief itself.** The *knowledge relation* between the subject and the proposition *p* changes because the practical stakes are an integral part of *what it means to know* in that situation. It's not just about how we *talk*; the subject *loses knowledge* when the stakes rise.
      *   **Analogy:** Like needing a stronger foundation to build a skyscraper than a garden shed. The *requirements for stability* (knowledge) change based on what's at stake (the building's height/importance). The materials (evidence) might be the same, but their *sufficiency* for the task (knowledge) changes with the practical demands.

  **The Crucial Distinction Summarized:**

  | Feature          | Epistemic Contextualism                          | Pragmatic Encroachment (PE)                     |
  | :--------------- | :----------------------------------------------- | :---------------------------------------------- |
  | **What Changes?** | Meaning of "knows" (contextual standards)        | Epistemic status of the belief itself           |
  | **Core Claim**   | "Knows" is context-sensitive (semantic claim)    | Knowledge depends partly on stakes (metaphysical claim about knowledge) |
  | **Subject's State** | *Might* remain the same (invariant knowledge?)   | *Changes* with stakes (knowledge lost/gained)   |
  | **Focus**        | Language use, knowledge *attributions*           | Nature of knowledge itself                      |
  | **Relation to Classical Invariantism** | Preserves it for the subject's mental state | **Rejects** it; knowledge isn't purely truth+epistemic factors |

  **Why This Matters & Why Philosophers Argue:**

  *   **Metaphysical vs. Semantic:** Contextualism is primarily a *semantic* theory about language ("knows" works like indexicals). PE is primarily a *metaphysical* theory about the nature of knowledge itself.
  *   **Invariantism:** Contextualism often tries to *preserve* a form of invariantism about the *subject's epistemic state* (their evidence/justification might be sufficient for "low-stakes knowledge" always, we just don't *call* it knowledge in high-stakes contexts). PE **flatly rejects invariantism** – the subject's epistemic state *isn't* sufficient for knowledge across contexts; the knowledge itself comes and goes with the stakes.
  *   **Intuitions:** Proponents argue about which explanation better captures our core intuitions. Does it feel like the *word* "know" gets stricter (Contextualism), or does it feel like the *risk* itself genuinely undermines their *actual epistemic position* (PE)?
  *   **Broader Implications:** The distinction has ripple effects for other areas of epistemology (e.g., skepticism, the value of knowledge, the relationship between practical and theoretical rationality).

  **For Your Feature:**

  You can accurately say: *"While both theories explain why we become hesitant to say 'I know' when the stakes get high – like in the classic bank case – they offer fundamentally different reasons. Contextualism argues the* meaning *of the word 'knows' itself gets stricter in high-pressure conversations. Pragmatic Encroachment argues that high stakes actually* undermine the knowledge itself*, making the same evidence insufficient. It's a debate about whether pressure changes our language or changes the facts about what we genuinely know."*

  This captures the essence without flattening the distinction. They agree on the *effect* (hedging under pressure) but fiercely disagree on the *mechanism and the underlying reality* of what's happening. That's where the philosophical careers are spent!
