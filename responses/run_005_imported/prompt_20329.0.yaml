  For (a), the student correctly identifies Popper's concern about "survival of the fittest" being tautological if "fittest" just means "those who survive." But Popper's criticism was more nuanced - he saw it as empirically empty but didn't claim it was strictly tautological. The phrasing "rules out no possible state of affairs" captures the unfalsifiability aspect well. Minor deduction for oversimplifying the tautology point.

