  First, structural approach. The toast should mirror the couple's meet-cute: starting with their argument about rain forecasts, then using that as a metaphor for their relationship. The "70% chance of rain" debate is perfect because it's both their origin story and a philosophical case study. 

  For the philosophy crowd, I'll need to:
