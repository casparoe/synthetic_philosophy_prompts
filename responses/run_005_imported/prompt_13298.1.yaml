answer: |-
  ### MEMORANDUM  
  **TO:** Academic Integrity Board Members  
  **FROM:** Chair, Academic Integrity Board  
  **SUBJECT:** Investigation Strategy Update – Probability Analysis of Suspect Groups  
  **DATE:** October 26, 2023  

  ---

  ### **Executive Summary**  
  After rigorous debate and probability modeling of the proctor’s tip, we conclude that the "global" Bayesian update (championed by Priya) is methodologically sound. This means:  
  1. **The overall morning/evening probability shifts** from 50/50 to **~71% evening / ~29% morning**.  
  2. **Within the evening**, Room 2 is now **~4× more likely** than Room 1 (consistent with the tip).  
  3. **Highest-risk group:** **Evening-2** (probability **~57%**).  
  4. **Recommended action:** Focus **~70% of investigative resources on Evening-2**, with the remainder on Evening-1. Do not allocate effort to morning groups at this stage.  

  This allocation maximizes the likelihood of identifying the source while minimizing harm to innocent students. The "local update" approach (holding morning/evening at 50/50) is statistically incoherent under scrutiny. I explain why below, including the strongest counterargument.  

  ---

  ### **1. Core Problem & Key Assumptions**  
  - **Initial prior:** Equal 25% probability for each group (Morning-1, Morning-2, Evening-1, Evening-2).  
  - **Proctor’s tip:** *If* the leak started in the evening, it is **4× more likely from Room 2 than Room 1**. No information about morning rooms or morning/evening likelihood.  
  - **Critical constraint:** We can only investigate **one group intensely** or **spread equivalent effort across 2–3 groups**.  
  - **Harm minimization:** Wrongly restricting a group delays grades for innocent students. Accuracy is urgent.  
  - **Key assumption:** The proctor’s statement is equally likely to occur whether the leak was in the morning or evening (i.e., her tip does not inherently favor evening as the leak source). This is the most neutral stance absent evidence otherwise.  

  ---

  ### **2. Why the "Local Update" Approach is Flawed**  
  Four board members advocate leaving the morning/evening split at 50/50 and only updating the evening rooms to an 80% (Room 2) / 20% (Room 1) split. **This seems intuitive but violates probability axioms.**  

  - **The flaw:** The tip ("if evening, 4× Room 2") is **not conditional on evening being true**—it is evidence that affects *all* hypotheses. Failing to update the morning/evening split implies that the proctor’s statement is **irrelevant to distinguishing morning from evening**, which is untrue.  
  - **Example:** If the leak *were* in the morning, the proctor might still observe evidence about evening rooms (e.g., suspicious behavior unrelated to the leak) and make the same statement. Assuming her statement is *only possible* under an evening leak overstates its specificity.  
  - **Strongest counterargument:** *If the tip is truly only about the relative likelihood within evening and provides zero information about morning vs. evening, then updating the marginal P(evening) is unnecessary.* However, this requires assuming the proctor’s propensity to make this statement is **identical** for morning and evening leaks (i.e., P(tip | morning) = P(tip | evening)). This is unlikely, as her silence on morning suggests the tip’s content is tied to evening observations.  

  ---

  ### **3. The Bayesian ("Global") Update: Method and Results**  
  Priya’s approach applies Bayes’ theorem correctly. We define:  
  - **Evidence (K):** Proctor states "if evening, leak is 4× more likely in Room 2 than Room 1."  
  - **Likelihoods:**  
    - *If leak in Evening-1:* P(K | E1) = 1 (arbitrary unit; we care about ratios).  
    - *If leak in Evening-2:* P(K | E2) = 4 (per tip).  
    - *If leak in Morning-1 or Morning-2:* P(K | M1) = P(K | M2) = *c* (unknown, but equal by symmetry).  
  - **Neutral assumption:** *c = 1* (i.e., the proctor is equally likely to make this statement for a morning leak as for an Evening-1 leak).  

  **Updated probabilities (see derivation in Appendix):**  
  | Group       | Prior Probability | Posterior Probability |  
  |-------------|-------------------|------------------------|  
  | **Evening-2** | 25%               | **~57.1%** (4/7)       |  
  | **Evening-1** | 25%               | **~14.3%** (1/7)       |  
  | **Morning-1** | 25%               | **~14.3%** (1/7)       |  
  | **Morning-2** | 25%               | **~14.3%** (1/7)       |  
  - **Evening overall:** **~71.4%** (vs. 50% prior).  
  - **Morning overall:** **~28.6%** (vs. 50% prior).  

  **Sensitivity check:** If *c* ≠ 1 (e.g., *c* = 0.5 or 2), evening probabilities shift (range: 63–80%), but Evening-2 remains dominant (50–64%). *c = 1* is the most conservative symmetric choice.  

  ---

  ### **4. Recommended Investigative Strategy**  
  Given grade-submission deadlines and harm risks, we must prioritize **efficiency** and **high-probability targets**.  

  - **Optimal allocation:**  
    - **Focus ~70% of resources on Evening-2** (swipe logs, interviews, handwriting).  
    - **Allocate ~30% to Evening-1** (lower effort; verify consistency with Evening-2 findings).  
    - **Do not investigate morning groups** yet. Probability is low (~14% each), and effort is better spent on higher-likelihood groups.  
  - **Why not spread effort further?**  
    - Investigating a third group (e.g., a morning room) dilutes resources, reducing effectiveness. Evening-2 + Evening-1 covers **71.4%** probability with focused effort.  
    - If Evening-2 evidence is conclusive, we avoid unnecessary holds on other groups.  

  **If evidence in Evening-2 is weak after initial review**, we can pivot to morning groups—but start here.  

  ---

  ### **5. Why This Matters**  
  - **Risk difference:** Evening-2 has **57% probability** under the global update vs. **40%** under the local update. Targeting Evening-2 increases our odds by **~17%**—a material difference given the stakes.  
  - **Harm reduction:** Investigating Morning-1 or Morning-2 (each 14.3% likely) risks delaying grades for 75 students per room with low payoff.  
  - **Procedural integrity:** Using coherent statistics protects us from appeals.  

  ---

  ### **Appendix: Simplified Bayesian Derivation**  
  - **Priors:** P(M1) = P(M2) = P(E1) = P(E2) = 0.25.  
  - **Likelihoods:** P(K|E1) = 1, P(K|E2) = 4, P(K|M1) = P(K|M2) = *c* = 1.  
  - **Posterior** ∝ **Likelihood × Prior**:  
    - P(E1|K) ∝ 1 × 0.25 = 0.25  
    - P(E2|K) ∝ 4 × 0.25 = 1.00  
    - P(M1|K) ∝ 1 × 0.25 = 0.25  
    - P(M2|K) ∝ 1 × 0.25 = 0.25  
  - **Normalize:** Total = 0.25 + 1.00 + 0.25 + 0.25 = 1.75  
    - P(E1|K) = 0.25 / 1.75 ≈ 14.3%  
    - P(E2|K) = 1.00 / 1.75 ≈ 57.1%  
    - P(M1|K) = P(M2|K) = 0.25 / 1.75 ≈ 14.3%  

  ---

  **ACTION REQUIRED:** By 5 PM today, confirm agreement with the strategy. Investigations begin at 8 AM tomorrow. I will handle swipe-log requests for Evening-1 and Evening-2. Thank you for your urgent attention.  

  // Signed //  
  Chair, Academic Integrity Board
