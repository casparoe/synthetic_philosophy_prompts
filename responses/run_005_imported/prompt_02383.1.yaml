answer: |-
  You've hit on a fascinating clash between rational decision theory and the harsh realities of legal liability. Your statistical intuition is mathematically sound in a vacuum—more information shouldn't *inherently* make your decisions worse. But legal systems deliberately warp this logic through **asymmetric consequences for intent**. Here's why deliberate ignorance is rational in this context:

  ### 1. **The Legal Switch: Innocent vs. Willful Infringement**
     - **Copyright/Patent Law Mechanics**: 
       - **Innocent Infringement**: If you independently create something similar without knowledge of the original, damages are limited (often to $0 for patents, or minimal statutory damages for copyright).
       - **Willful Infringement**: If you knowingly copy or derive from protected work, penalties skyrocket (triple damages in patent law, up to $150k per work in copyright).
     - **Avoiding the "Knowledge Trigger"**: Merely *viewing* the competitor's code/patent creates a factual record that you *could* have copied it. This flips the legal presumption. Proving independent creation after exposure is expensive and uncertain.

  ### 2. **The Discovery Nightmare**
     - If sued, your team's digital footprints (emails, search history, file access logs) would be subpoenaed. A single Slack message like "Hey, check out CompetitorX's plugin API docs on the shared drive" becomes catastrophic evidence of willfulness.
     - Clean-room documentation (specs, lawyer sign-offs, isolated teams) creates a defensible audit trail. Your colleague's legally obtained copy is a litigation landmine—not a resource.

  ### 3. **The Rational Calculus: Expected Value ≠ Expected Utility**
     - **Your View**: *Information has neutral or positive value*  
       (Potential upside: Avoid reinventing wheels; Downside: None, since you could ignore bad ideas).
     - **Legal Reality**: *Information has negative expected utility*  
       - Upside: Marginal engineering efficiency gains.  
       - Downside: Risk of existential liability (e.g., a willful infringement verdict could cost millions and force product withdrawal).  
     - **The Asymmetry**: The legal downside dwarfs the engineering upside. Avoiding knowledge isn't about better design—it's about capping liability.

  ### 4. **Why "Ignoring What You Learned" Doesn't Work**
     - **Cognitive Bias is Legally Exploitable**: In court, similarities between your code and the competitor's would be attributed to copying, not coincidence. Juries won't believe you "mentally deleted" what you saw.
     - **Burden of Proof Shift**: Once exposure is proven, *you* must prove independent creation. Clean rooms reverse this burden onto the plaintiff.

  ### 5. **The Flaw in Your Statistical Model**
     Decision theory assumes:
     - Consequences depend *only* on actions, not mental states.  
     - All options remain available regardless of knowledge.  
     Legal systems violate both:
     - **Mental state dictates penalties** (willful vs. innocent).  
     - **Knowledge removes legal options**—you can't "choose" to be innocent after seeing the code.  

  ### Practical Example: Patents
  - Engineer reads Competitor's Patent #123:  
    - Later develops similar solution.  
    - Court finds infringement → **Willful** → Triple damages + attorney fees.  
  - Engineer never reads Patent #123:  
    - Develops similar solution.  
    - Court finds infringement → **Innocent** → No damages or reasonable royalties.  

  ### Why Companies Accept the Inefficiency
  - **Risk Scaling**: For a $10M product, willful infringement risk might be $30M + legal costs. Clean room setup costs $500k. Rational trade-off.
  - **Process as Shield**: The documented clean room is a deterrent. Competitors know suing invites a winnable defense.

  ### What You’re Missing: This Isn’t About Engineering
  Your frustration is understandable—engineers value knowledge reuse. But legally, this isn't an optimization problem; it's a **liability containment protocol**. The "cost" isn't duplicated effort; it's insurance against unbounded legal risk. Lawyers aren't paid to build better products; they're paid to keep the company solvent.

  **In essence**: When the penalty for knowing X is catastrophic, and not knowing X is cheap, deliberate ignorance *is* rational—not as an information strategy, but as a legal survival tactic. The math works because the law changes the numbers.
