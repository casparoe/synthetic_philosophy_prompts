  For MMK 18.8: Parin might argue that "affirming all four" reflects the inexpressible nature of ultimate reality via glutty semantics (truth-value gaps/gluts), while Clarissa could see it as pragmatic pedagogy—using apparent contradictions to shock students out of reification. 

  The reductio point is crucial. Clarissa will stress that Nāgārjuna's reductios target opponents who *do* fear contradictions, so the method is ad hominem. Parin must counter that for Nāgārjuna himself, contradictions at the ultimate level aren't falsity-markers but truths about reality's indeterminacy. 

  The "no thesis" paradox in Vigrahavyāvartanī 29 needs handling: Parin embraces it as a true contradiction, while Clarissa might use hierarchical meta-statements or speech-act deflation. 

