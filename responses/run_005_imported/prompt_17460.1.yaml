answer: |-
  Here is the strongest possible case that omissions are **never** genuine causes, only grounds for responsibility based on duty:

  1.  **The "Metaphysical Vacuum" Problem:** Causation requires a *positive force* or *event* that initiates or sustains a change. Death by drowning is caused by water entering the lungs, preventing oxygen transfer – a chain of *positive physical events*. The lifeguard's sitting produces *no physical force*, *no energy transfer*, and *no alteration* to the existing causal chain already in motion (the victim struggling, water entering airways). Inaction is a *non-event*, a metaphysical void. You cannot point to *anything* the lifeguard *did* that contributed energy or matter to the lethal process. Assigning causation to a *lack of action* is like blaming the absence of a firefighter for a house burning down; the fire caused the burning, not the firefighter's non-intervention, even if intervention would have stopped it.

  2.  **The Fatal Over-Inclusion Problem (The Core Argument):** If causation is defined counterfactually ("but for X, Y wouldn't have happened") for omissions, it implodes any coherent concept of cause.
      *   If the lifeguard's omission causes death because *if* they had acted, death would have been prevented, then logically:
          *   The bystander's omission *also* causes death (if *they* had jumped in, death might have been prevented).
          *   The victim's parent's omission causes death (if they had forbidden swimming that day, death wouldn't have happened).
          *   The engineer who *didn't* design a better flotation device causes death.
          *   *Anyone anywhere* whose potential action, however remote or improbable, *could* have prevented the death becomes a "cause" under this logic.
      *   This renders "cause" meaningless. Every death becomes "caused" by billions of omissions. It obliterates any distinction between the lifeguard (who had a specific duty and capacity) and a random person on another continent. Causation must be selective and specific to be a useful concept; omission-as-cause destroys this. The *only* way to distinguish the lifeguard is via *duty/responsibility*, not causation.

  3.  **The Asymmetry of Action vs. Omission:**
      *   **Action as Cause:** If the lifeguard *pushes* the victim in, we identify a *new, positive force* introduced by the lifeguard (their shove) that initiates the lethal chain. This force demonstrably alters the victim's state (from safe on land to struggling in water).
      *   **Omission as Non-Cause:** When the lifeguard sits, they introduce *no new force*. The lethal chain (drowning) was already initiated by the victim entering the water (or a wave, etc.). The lifeguard's inaction *leaves this existing chain unaltered*. Preventing an intervention is not the same as initiating the harm. We hold them responsible *for failing to disrupt* the existing cause (the drowning process), not *for causing* it.

  4.  **The "No Difference Maker" Argument:** An omission cannot be the *difference maker* in the actual world compared to the closest possible world where the outcome changes. In the actual world, the victim drowns due to water inhalation. In the closest world where they are saved, the lifeguard *acts* – introducing a *new, positive force* (swimming, grabbing, pulling). The difference is the *presence* of that positive action. The absence of action in the actual world *is* the state of affairs, but it's not what *made the difference* between life and death; the lack of the *required positive intervention* is what was missing. The cause of death remains the water inhalation; the cause of the *lack of rescue* is the omission, but that lack of rescue isn't the *cause of death*, it's the *failure to prevent* the death caused by other factors.

  5.  **Responsibility Grounded in Duty, Not Causation:** The *only* coherent reason the lifeguard matters more than the bystander is *duty*. The lifeguard has a specific role-based obligation, training, proximity, and explicit expectation to intervene. The bystander does not. This creates a powerful moral and legal reason to *hold the lifeguard responsible* for the death. But this responsibility stems entirely from the violation of a duty to *prevent* harm caused by other factors (the water, the victim's actions), not from the lifeguard *causing* the harm itself. Blameworthiness arises from the failure of a protective obligation, not from being a causal agent of the outcome.

  **Conclusion:** Insisting omissions are genuine causes leads to metaphysical absurdity (causation from nothing) and logical incoherence (infinite causes for every event). The lifeguard's sitting adds nothing to the physical world that causes the victim's lungs to fill with water. The *only* rational way to understand why we condemn the lifeguard so severely, while not condemning the distant bystander, is through the lens of *violated duty and responsibility*, not spurious causation. Causation belongs to the positive forces at work (water, gravity, lack of oxygen); responsibility for failing to stop those forces belongs to those who had a specific obligation to do so. To claim otherwise is to fatally confuse moral blame with physical causality.
