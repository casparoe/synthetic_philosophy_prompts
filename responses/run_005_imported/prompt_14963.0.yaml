answer: |-
  Your critique cuts to the heart of a significant philosophical tension within the accuracy-first program. I'll rigorously argue for your claim, present the strongest reply from accuracy-first epistemology (the "alethic immodesty" defense), and explain why it fails to fully resolve the pragmatic entanglement.

  ### The Core Argument: Normative Migration to Scoring Rule Selection
  1.  **The Structure of the Dominance Argument:**
      *   Let $\mathcal{W}$ be a set of possible worlds, $\mathcal{F}$ a finite algebra of propositions, and $\mathcal{C}$ the set of credence functions $c: \mathcal{F} \to [0,1]$.
      *   $\mathcal{P} \subset \mathcal{C}$ is the set of *coherent* (probabilistically consistent) credence functions.
      *   A scoring rule $\mathfrak{s} : \mathcal{C} \times \mathcal{W} \to [0, \infty]$ measures the inaccuracy of credence $c$ at world $w$.
      *   **Dominance Theorem (Predd et al., 2009):** If $\mathfrak{s}$ is *continuous* and *strictly proper*, then for any incoherent $c \in \mathcal{C} \setminus \mathcal{P}$, there exists a coherent $c^* \in \mathcal{P}$ such that $\mathfrak{s}(c, w) > \mathfrak{s}(c^*, w)$ for *all* $w \in \mathcal{W}$. ($c$ is *accuracy dominated* by $c^*$).
      *   The comparison $\mathfrak{s}(c, w) > \mathfrak{s}(c^*, w)$ is **pointwise**: it holds at *every individual world* $w$, requiring no summation, averaging, or probability weighting over $\mathcal{W}$. This appears purely "alethic" or "factual".

  2.  **The Definition of Strict Propriety & Its Pragmatic Load:**
      *   **Strict Propriety:** $\mathfrak{s}$ is strictly proper if for any $c, c' \in \mathcal{C}$:
          $$ \sum_{w \in \mathcal{W}} c(w) \cdot \mathfrak{s}(c, w) < \sum_{w \in \mathcal{W}} c(w) \cdot \mathfrak{s}(c', w) $$
          *In words:* A credence function $c$ uniquely minimizes its *own expected inaccuracy*, where the expectation is calculated using $c$ itself as the probability weight over $\mathcal{W}$.
      *   **The Pragmatic Entanglement:**
          *   **Expectation:** The definition relies fundamentally on the mathematical operation of *expected value*. This operation is the cornerstone of Bayesian *decision theory*. It inherently involves *weighting* the value of outcomes (here, inaccuracies $\mathfrak{s}(c, w)$) by the *probability* assigned to those outcomes ($c(w)$) and *summing* these weighted values. This is not a pointwise comparison of states; it's an *aggregation* across possibilities.
          *   **Instrumental Rationality:** Minimizing expected inaccuracy, as required by strict propriety, is a form of *instrumental rationality*. It dictates that an agent *ought* to choose the option ($c'$) that their own beliefs ($c$) deem best suited to achieving their goal (minimizing inaccuracy). This "ought" is conditional on the agent's goal and beliefs – hallmarks of pragmatic reasoning.
          *   **Necessary Role:** Strict propriety isn't merely a *sufficient* condition for the dominance theorem; it's (along with continuity) *necessary* to rule out Maher-style counterexamples. Joyce's initial, more intuitively plausible "alethic" conditions (Normality, Propriety, Convexity) were *insufficient*. The mathematically successful repair *requires* strict propriety.

  3.  **The Migration of Normative Work:**
      *   The pointwise dominance relation ($\mathfrak{s}(c, w) > \mathfrak{s}(c^*, w)$ $\forall w$) is normatively compelling *only if* we accept $\mathfrak{s}$ as a legitimate measure of inaccuracy.
      *   The justification for restricting $\mathfrak{s}$ to continuous strictly proper scoring rules rests *entirely* on the expectation-based requirement of immodesty/self-recommendation.
      *   **Therefore:** The *primary normative force* of the argument stems from the decision-theoretic principle embedded in the *selection criterion* for scoring rules ("You *should* use a scoring rule where your own credences minimize expected inaccuracy by your own lights"). The pointwise dominance result then acts as a powerful *consequence* of this prior normative commitment to immodesty, applied within the specific mathematical framework. The advertised independence from pragmatic, decision-theoretic assumptions is illusory; those assumptions are foundational to defining the very class of "legitimate" scores used in the dominance comparison.

  ### The Strongest Reply: Alethic Immodesty
  Accuracy-first epistemologists (e.g., Pettigrew, Levinstein) offer a powerful counter-argument: **Immodesty is itself a purely alethic requirement.**

  1.  **The Argument:**
      *   **Goal:** The sole epistemic goal is accuracy – having credences that match the truth as closely as possible.
      *   **Self-Defeat:** Suppose an epistemic agent $A$, holding credences $c$, were to learn that according to *their own conception of accuracy* (embodied in $\mathfrak{s}$), some *other* credence function $c'$ has a *lower expected inaccuracy* than $c$ does (by $A$'s own lights, $c$). This would mean $A$ believes $c'$ is *likely* (in the expectation sense) to be *more accurate* than their own $c$.
      *   **Alethic Incoherence:** If $A$ truly values accuracy above all else and recognizes this belief, they would be epistemically irrational *not* to adopt $c'$ immediately. Sticking with $c$ would be knowingly persisting with a doxastic state they believe is *less likely* to achieve their core epistemic goal than an available alternative. This is a form of *epistemic self-sabotage* or *alethic incoherence*.
      *   **Necessity of Immodesty:** To avoid this self-defeating situation *purely on alethic grounds* (the pursuit of accuracy), an agent's credence function *must* be immodest relative to their chosen accuracy measure $\mathfrak{s}$. $c$ *must* uniquely minimize expected inaccuracy according to itself. Any $\mathfrak{s}$ that doesn't enforce this would license epistemic self-sabotage and is therefore alethically defective.
      *   **Conclusion:** Strict propriety isn't a pragmatic imposition; it's a *consequence* of the purely alethic demand that an agent's credences cohere with their own commitment to accuracy. The expectation calculation isn't a pragmatic add-on; it's the tool the agent *must* use, given their uncertainty, to estimate how well their credences serve their alethic goal. Choosing a strictly proper $\mathfrak{s}$ is simply ensuring the accuracy measure faithfully reflects this internal alethic consistency requirement.

  ### Why the Alethic Immodesty Reply Fails
  While sophisticated, this reply ultimately fails to purge the argument of pragmatic elements:

  1.  **The Goal-Expectation Gap:** The core alethic goal is pointwise accuracy: being close to truth *at the actual world*. Strict propriety governs *expected* accuracy *across possibilities*. The reply assumes a necessary link: that minimizing expected inaccuracy (by one's own lights) is the *only rational way* to pursue pointwise accuracy under uncertainty. This link is not alethically self-evident; it's a substantive claim about *rational choice under uncertainty*.
      *   **Alternatives Exist:** An agent solely focused on pointwise accuracy *could* rationally adopt a minimax strategy (minimize worst-case inaccuracy) or focus on conditional accuracy given specific evidence. The insistence that *expected* accuracy minimization is uniquely rational for pursuing the pointwise goal imports a *decision-theoretic norm* (maximize subjective expected utility) applied to the epistemic utility (accuracy).

  2.  **The Nature of "Likely" and "Believe":** The reply relies heavily on phrases like "believes $c'$ is *likely* to be more accurate." The concept of one credence function being "more likely" accurate than another, *from the agent's perspective*, inherently involves the agent's *credences* ($c$) serving as weights over possibilities to calculate the expectation. This *is* the application of decision theory (specifically, expected utility maximization) to the epistemic domain. Defining epistemic rationality in terms of avoiding actions (or credence adoptions) that one *believes* are *likely* (in this expectation sense) to be self-defeating *is* to ground it in pragmatic rationality. The alethic goal is primary, but the *means* prescribed (immovesty via expected accuracy) is pragmatic.

  3.  **The Justification for Expectation:** *Why* must an agent committed only to pointwise accuracy care about the *sum* $\sum_w c(w) \cdot \mathfrak{s}(c', w)$? The only compelling answer is that this sum represents the agent's *best estimate* of the pointwise inaccuracy they will *actually* incur, given their uncertainty ($c$). But "best estimate" here means the estimate that, if acted upon repeatedly under similar circumstances, would lead to the best *long-run* accuracy performance, or the uniquely admissible estimate under plausible decision-theoretic axioms. Both justifications appeal to *instrumental efficacy over time* or *consistency with choice axioms* – pragmatic considerations. The pure pointwise alethic goal doesn't, by itself, force this specific aggregation method.

  4.  **The Circularity Threat:** The defense argues that immodesty is required to avoid epistemic self-sabotage *given the agent's beliefs ($c$)*. However, $c$ itself is the object being justified! The argument assumes the legitimacy of using $c$ to define expectations *in order to justify* $c$'s coherence. While not strictly circular (the dominance result doesn't assume coherence), it grounds the normative force of the dominance result (which demands coherence) in a principle (immodesty) whose application presupposes the legitimacy of the very probabilistic expectations ($c$ as a weight) that coherence governs. This tight coupling reinforces the sense that probabilism is being justified using tools that already assume its framework.

  ### Conclusion
  Your worry is well-founded. The accuracy-dominance argument for probabilism, while mathematically elegant and powerful, achieves its success by leveraging the expectation-based requirement of strict propriety to define admissible scoring rules. The pointwise dominance comparison itself is indeed probability-free and alethically pristine, but its normative significance is entirely contingent upon the prior selection of scoring rules.

  The strongest defense, that immodesty is a purely alethic requirement to avoid self-sabotage, ultimately fails. It surreptitiously relies on the decision-theoretic principle that rational pursuit of a goal under uncertainty *must* involve maximizing subjective expected utility (here, minimizing expected inaccuracy). While this principle is deeply embedded in Bayesian epistemology, it is not itself derivable from a pure, pointwise alethic goal without importing pragmatic assumptions about rational choice and the aggregation of uncertainty.

  Therefore, the accuracy-dominance argument does not provide a vindication of probabilism that is wholly independent of pragmatic, decision-theoretic assumptions. Its normative force arises from a synthesis: a pragmatic decision rule (maximize expected utility/minimize expected inaccuracy) is used to define the alethic virtue (accuracy) and the legitimate measures thereof ($\mathfrak{s}$), which then yields a powerful pointwise dominance result against incoherent credences. The "accuracy-first" program succeeds brilliantly in clarifying the link between coherence and accuracy, but it cannot fully escape its decision-theoretic foundations to achieve a purely alethic justification.
