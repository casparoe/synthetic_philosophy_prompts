  Looking at today's context: People work long hours despite financial security, chase side hustles, feel guilty about downtime, and engage in low-quality leisure like doom-scrolling. Status competition seems amplified by social media, which didn't exist in Keynes's time. Hustle culture glorifies constant productivity, and social media creates new forms of relative deprivation through constant comparison.

  Keynes might argue that relative needs have expanded beyond material goods to include digital status markers (likes, followers, viral fame). This infinite status competition prevents society from reaching the leisure utopia he envisioned. The "art of life" is neglected because people are still trapped in striving mode, now supercharged by technology.

