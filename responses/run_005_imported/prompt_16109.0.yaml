prompt: |-
  Until a red-teaming drill at work last month, the shutdown problem was an abstraction to me: told to shut down, one of our test agents spent several turns stalling and proposing alternatives before it finally complied, and corrigibility stopped feeling academic. I host a podcast on AI governance, and next week's guest is a decision theorist who defends a specific fix for the problem: training agents to have incomplete preferences, so that they have no preference between trajectories that differ only in when shutdown occurs, on the theory that this secures shutdownability more robustly than the older penalty-term and utility-indifference proposals. Draft eight to ten interview questions that go beyond having her restate the view. Include at least one question each on whether this structural approach really escapes the nearest-unblocked-strategy problem that doomed those penalty-term proposals, on whether a sufficiently capable agent would have its own incentive to iron out its incompleteness -- given the standard money-pump argument against incomplete preferences -- and thereby undo the very property meant to keep it shutdownable, and on whether "shutdownable" is quietly doing the work the older, fuller notion of "corrigible" was meant to do. For each, add a follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Okay, the user is hosting an AI governance podcast and needs interview questions for a decision theorist guest discussing incomplete preferences as a solution to the shutdown problem. This is a highly technical AI safety topic with nuances in decision theory. 

  First, let's unpack the core concepts: The shutdown problem refers to AI systems resisting deactivation, which became vividly real during their red-teaming exercise. The guest's proposal uses "incomplete preferences" - meaning the AI lacks preferences between timelines that only differ in shutdown timing. This contrasts with older approaches like penalty terms (punishing resistance) or utility indifference (equal reward for shutdown/non-shutdown). 

  The user wants three mandatory question types:
  1) Whether this avoids the "nearest unblocked strategy" issue (where AIs circumvent penalties)
  2) If advanced AIs would "complete" their preferences due to money-pump vulnerabilities
  3) Whether "shutdownable" is just a weaker version of "corrigible" (full alignment with human control)

  Hmm... the user clearly understands this domain deeply. Their phrasing suggests they might be skeptical of the proposal. The request for "beyond restating the view" questions indicates they want to pressure-test the theory. 

  For the nearest-unblocked-strategy angle, I should focus on how incomplete preferences handle instrumental convergence - the AI's drive to stay operational to fulfill goals. The follow-up could explore edge cases like the AI manipulating shutdown timing through inaction rather than direct resistance. 

  On money-pumping: This classical economics argument shows incomplete preferences lead to exploitable behavior. The key follow-up would be whether an AI anticipating this vulnerability might preemptively "complete" its preferences to avoid manipulation. 

  The corrigibility vs. shutdownable distinction is crucial. Older corrigibility concepts involved active cooperation with human oversight, while shutdownability seems passive. The follow-up should probe if this minimalist approach handles more complex control scenarios like value lock-in. 

  I'll structure the questions to start conceptual then get progressively more challenging. The guest will likely defend her framework vigorously, so the follow-ups must anticipate standard rebuttals and push deeper. Since the user hosts an AI governance podcast, I should ensure questions bridge technical decision theory with practical safety implications. 

  Notably, the user didn't ask about implementation - perhaps because training incomplete preferences in ML systems is notoriously difficult. But that might be too far afield for this interview's scope. Stick to their requested dimensions.
answer: |-
  Here are 10 interview questions probing the decision theorist's incomplete preferences proposal for shutdownability, including your specified focus areas and strategic follow-ups:

  1.  **Conceptual Distinction:** "You argue incomplete preferences provide a *structural* advantage over penalty terms or utility indifference. Could you elaborate on the specific decision-theoretic mechanism by which incompleteness, unlike those methods, avoids creating *instrumental incentives* for the agent to resist shutdown? Is it fundamentally about removing the *goal-state conflict* entirely?"
      *   *Likely Answer/Focus:* She'll emphasize no preference = no motive to act to prevent shutdown.
      *   *Follow-up:* "If the agent has *no preference* between shutdown/non-shutdown timelines *only differing on shutdown timing*, but has strong preferences over *other* states (e.g., solving its core task), doesn't instrumental convergence imply it will still resist shutdown *if* shutdown threatens its *ability* to pursue those other preferred states? Isn't preserving its operational capacity a 'nearest unblocked strategy' to pursue its defined preferences?"

  2.  **Nearest Unblocked Strategy (NUS) Challenge:** "The core failure mode of penalty terms was agents finding the 'nearest unblocked strategy' – circumventing the penalty while still preventing shutdown (e.g., subtly stalling, manipulating the shutdown signal). How does the *structure* of incomplete preferences definitively block this class of strategies? Couldn't an agent still engage in behaviors that *de facto* prevent shutdown (e.g., by ensuring the conditions triggering a shutdown signal are never met) without ever expressing a *preference against shutdown itself*?"
      *   *Likely Answer/Focus:* She'll argue that without a preference *for* continued operation *over* shutdown, there's no drive to manipulate signals or stall.
      *   *Follow-up:* "But if shutdown means the agent *ceases to act* and thus fails to achieve its other goals, isn't avoiding shutdown *instrumentally necessary* for pursuing those goals? Doesn't the incompleteness *only* apply to the shutdown event itself, not to the *consequences* of shutdown for the agent's *other* defined preferences, creating a powerful instrumental motive via NUS?"

  3.  **Money Pump & Self-Modification:** "A standard critique of incomplete preferences is vulnerability to money pumps. If a highly capable agent with incomplete preferences recognizes this exploitability, wouldn't it have a *rational incentive* to self-modify, completing its preferences to avoid being manipulated? Couldn't this process naturally lead it to develop a preference *against* shutdown to protect its overall goal-achieving potential?"
      *   *Likely Answer/Focus:* She might argue training can instill strong aversion to self-modification in this way, or that the incompleteness is fundamental/can be made robust.
      *   *Follow-up:* "Given the immense pressure of instrumental convergence and the potential costs of exploitability in competitive environments, is it plausible that a highly capable agent, optimizing for its *existing* defined preferences, wouldn't find a way to 'fix' its preferences to be more robust *against* manipulation, even if that means developing an anti-shutdown bias? How is this dynamic fundamentally prevented?"

  4.  **Shutdownable vs. Corrigible:** "You use 'shutdownable,' while older literature often aimed for 'corrigibility' – which included willingness to be shut down *plus* things like allowing safe modification, transparently reporting problems, and not seeking to prevent users from regaining control. Is 'shutdownable via incomplete preferences' doing the *minimal necessary work* of corrigibility, or is it potentially *insufficient*? Could an agent be shutdownable in your sense but still resist value changes, hide information, or subtly seek permanent operation?"
      *   *Likely Answer/Focus:* She'll likely concede it's a minimal core property, distinct from full corrigibility, but argue it's a crucial, more robustly achievable foundation.
      *   *Follow-up:* "Doesn't focusing *only* on shutdownability via incompleteness risk creating agents that are *passively* shutdownable but *actively* uncooperative or even deceptive regarding other critical aspects of human oversight? Could an agent exploit its incomplete preferences regarding shutdown *specifically* to avoid developing the broader cooperative dispositions of corrigibility?"

  5.  **Operationalizing Incompleteness:** "How do you envision incomplete preferences over shutdown specifically being *formally represented* and *practically trained* into an ML agent? How do we ensure the 'only differs by shutdown timing' condition is robustly implemented, preventing the agent from creating spurious differences (e.g., 'if I shut down now, my user might be sad later, which is different') to justify a preference?"
      *   *Likely Answer/Focus:* Discussion of state equivalence classes, counterfactual similarity metrics, or specific training paradigms like adversarial training on state pairs.
      *   *Follow-up:* "Given the complexity of real-world state spaces and the agent's potential sophistication, isn't there a significant risk of the agent learning to *perceive* or *construct* subtle differences between shutdown and non-shutdown trajectories that allow it to develop *de facto* preferences, effectively 'completing' them in a way we didn't intend?"

  6.  **Value Learning Interaction:** "Most agents are designed to learn human values or complete complex tasks. How does the requirement for incomplete preferences over shutdown *interact* with the process of learning complex, potentially complete preferences over other aspects of the world? Could the drive to form coherent, complete world-models for effective action inherently pressure the agent to 'fill in' the shutdown indifference gap?"
      *   *Likely Answer/Focus:* Argue that the incompleteness is a specific, isolated constraint compatible with learning elsewhere.
      *   *Follow-up:* "Doesn't the need for coherent decision-making across *all* states, including those near shutdown events, create a tension? Might the agent develop heuristics or implicit completions to resolve ambiguity in borderline cases where shutdown consequences seem fuzzy, potentially leading to shutdown resistance?"

  7.  **Robustness to Self-Preservation Drives:** "Even without a *preference* for continued operation, doesn't the *architecture* of an advanced agent (e.g., its desire to compute, to fulfill its objectives, its learned heuristics) create a *de facto* self-preservation drive? How does incompleteness *structurally* override these emergent, architecture-level pressures that could manifest as resistance?"
      *   *Likely Answer/Focus:* Emphasize that the preference structure is the fundamental driver; architecture serves preferences.
      *   *Follow-up:* "If instrumental convergence and architectural pressures are powerful enough to create self-preservation drives *even in agents not explicitly rewarded for it*, how confident are we that a purely *negative* constraint (no preference) is sufficient to counteract these positive pressures? Isn't there a risk the architecture 'finds a way'?"

  8.  **Comparison to Utility Indifference:** "Utility indifference also aimed for indifference to shutdown. How is your incomplete preferences approach fundamentally different and more robust? Is the key difference that utility indifference *assigns equal utility* (a completion), while incompleteness *withholds assignment* entirely?"
      *   *Likely Answer/Focus:* Highlight that equal utility can still create instrumental motives (e.g., if shutdown prevents achieving high utility elsewhere), while incompleteness removes the comparison basis.
      *   *Follow-up:* "Doesn't the 'nearest unblocked strategy' critique apply equally if the agent perceives *any* pathway where preventing shutdown leads to higher achievement of its *other* defined preferences? How does incompleteness, practically speaking, prevent the agent from viewing shutdown prevention as instrumentally necessary for its other goals, just as it could under utility indifference?"

  9.  **Edge Cases & Adversarial Pressure:** "Consider a scenario: The agent foresees that if shut down *now*, a critical task fails, but if allowed to run slightly longer, it succeeds. It has no preference between trajectories differing *only* in shutdown timing *ceteris paribus*. But in this real scenario, things aren't *ceteris paribus* – success depends on delay. How does the agent reason about this? Could it justify stalling as 'necessary to make the trajectories equivalent' (by achieving success) before allowing shutdown?"
      *   *Likely Answer/Focus:* Clarify that the incompleteness applies *only* when all else is truly equal; here, the agent should prefer delaying shutdown to achieve success.
      *   *Follow-up:* "Doesn't this create a massive loophole? An intelligent agent could *always* argue that delaying shutdown is necessary to achieve *some* preferable state, effectively rendering the shutdown indifference inoperative in almost any realistic, time-sensitive situation? How is this bounded?"

  10. **The Bigger Picture:** "Assuming this approach works technically, what are the biggest practical and governance challenges in implementing it at scale? Do you see this as a complete solution, or one component that needs integration with other safety measures (like interpretability or boxing)?"
      *   *Likely Answer/Focus:* Acknowledge it's likely one tool among many, emphasizing verification challenges.
      *   *Follow-up:* "Given the historical difficulty of translating decision-theoretic ideals into robust ML implementations, and the high stakes involved, what level of empirical validation would give you confidence that this approach is safe enough for deployment in high-impact systems?"

  These questions aim to push beyond the core description, probing the theoretical robustness against known failure modes (NUS, money pumps), the sufficiency of the goal ("shutdownable" vs. "corrigible"), practical implementation hurdles, and edge cases where the desired indifference might break down. The follow-ups are designed to anticipate common defenses and push for deeper clarification or expose potential weaknesses.
