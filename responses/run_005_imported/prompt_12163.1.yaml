  The San Marco point is crucial - Jonah claims even Gould's original architectural analogy fails because spandrels weren't structurally necessary. I'll need to verify if this architectural history holds up and whether it actually undermines Sasha's biological argument. 

  For the chin specifically, I should check: does mechanical evidence really contradict bracing? Is dimorphism in shape (not presence) meaningful for signaling? Does covariance necessarily imply non-function? 

  Methodologically, both students might be missing how to positively identify spandrels versus exaptations. The key is whether the trait arose neutrally (spandrel) or was shaped by selection from inception (adaptation). But detecting that requires evolutionary trajectory analysis - hard with fossils. 

  I'll structure this move-by-move: 
  1) Jonah's uniqueness → function argument 
  2) Sasha's mechanical counter + covariance evidence 
