  and we minimize over p and q. The minimum is achieved at p=r, q=1-r? But is it unique?

  Alternatively, the domination argument we gave does not rely on the strictly proper property directly, but on the convexity of the quadratic function. However, the strictly proper property is what ensures that the coherent assignment is the unique best assignment for a given belief, and that is what we used in the convexity of the set of score vectors.

  But to answer the last part: why strictly proper? In the above argument for Brier, we had a strict domination. But what if the scoring rule is only proper, not strictly proper? Then there might be incoherent assignments that are not strictly dominated. For example, consider a scoring rule that is constant for coherent assignments? That wouldn't be very useful. But a proper scoring rule that is not strictly proper might have flat spots. So it is possible that an incoherent assignment achieves the same score in every world as the best coherent assignment, but then we cannot show that it is strictly dominated.

  For instance, suppose we have a scoring rule that, for any coherent assignment, gives a constant score (say 0) in both worlds. Then any coherent assignment is equally good, and an incoherent assignment might also get 0? Then there is no domination.

  But in practice, a strictly proper scoring rule is required to ensure that the domination is strict for incoherent assignments.

  In summary, the gut-level reason is that an incoherent assignment wastes some of your probability budget on impossible events, and by redistributing that budget to make your assignment coherent, you can reduce your penalty in every possible world. The strictly proper scoring rule ensures that this redistribution will result in a strict improvement in at least one world.

  We hope this explanation helps.
answer: |-
  Your journey into calibration and forecasting has led you to a profound insight: **caring solely about accuracy, with no bookmaker or exploitation involved, inherently demands that your credences obey the probability axioms**. This follows from the properties of **strictly proper scoring rules**, such as the Brier score. Below, I'll walk you through the intuition step by step, focusing on why incoherent credences (violating probability axioms) are always accuracy-dominated by coherent ones, and why "strictly proper" is essential.

  ### Core Idea: Accuracy-Domination
  - **Incoherent credences are suboptimal**: If your credences violate probability axioms (e.g., \(P(\text{rain}) + P(\text{no rain}) \neq 1\)), there exists a coherent alternative that is **at least as accurate in every possible outcome and strictly more accurate in at least one**. This is called **accuracy-domination**.
  - **Why it matters**: Since you care about accuracy (closeness to truth), you should prefer the dominating coherent credence. Thus, coherence isn't just about avoiding exploitation—it's about being as accurate as possible.

  ### Step-by-Step Intuition
  Let's simplify with a binary event: rain (\(R\)) or no rain (\(\neg R\)).  
  - **Your credences**: \(P(R) = p\), \(P(\neg R) = q\).  
  - **Coherence requires** \(p + q = 1\).  
  - **Incoherence**: \(p + q \neq 1\) (e.g., \(p = 0.7\), \(q = 0.4\), so \(p + q = 1.1\)).  

  We grade accuracy using a **strictly proper scoring rule** (e.g., Brier score). For any outcome, the score penalizes deviation from the truth:  
  - **Brier score for binary event**:  
    - If \(R\) happens: \(\text{Score} = (1 - p)^2 + (0 - q)^2\).  
    - If \(\neg R\) happens: \(\text{Score} = (0 - p)^2 + (1 - q)^2\).  
    (This captures error for both \(R\) and \(\neg R\), even though only one occurs.)  

  #### Why Incoherent Credences Are Dominated
  Suppose \(p + q > 1\) (e.g., \(p = 0.7\), \(q = 0.4\)).  
  - **Your scores**:  
    - If rain: \((1 - 0.7)^2 + (0 - 0.4)^2 = 0.09 + 0.16 = 0.25\).  
    - If no rain: \((0 - 0.7)^2 + (1 - 0.4)^2 = 0.49 + 0.36 = 0.85\).  

  Now, consider a **coherent alternative**: \(P'(R) = p'\), \(P'(\neg R) = 1 - p'\).  
  - **Key insight**: Choose \(p'\) between \(p\) and \(1 - q\) (e.g., \(p' = 0.55\), since \(p = 0.7\) and \(1 - q = 0.6\)).  
    - Why \(p' = 0.55\)? It splits the difference: \(p' = \frac{p + (1 - q)}{2} = \frac{0.7 + 0.6}{2} = 0.65\). But we'll use \(p' = 0.55\) for a clearer illustration.  
  - **Coherent scores**:  
    - If rain: \(2 \times (1 - 0.55)^2 = 2 \times 0.2025 = 0.405\).  
    - If no rain: \(2 \times (0.55)^2 = 2 \times 0.3025 = 0.605\).  

  Compare:  
  | Outcome       | Your Score (Incoherent) | Coherent Score (\(p' = 0.55\)) |  
  |---------------|--------------------------|--------------------------------|  
  | **Rain**      | 0.25                     | **0.405** (worse)              |  
  | **No rain**   | 0.85                     | **0.605** (better)             |  

  This coherent assignment doesn't dominate yet. Let's optimize \(p'\):  
  - Choose \(p'\) to **balance the penalties**. For \(p = 0.7, q = 0.4\), the optimal \(p'\) is:  
    \[
    p' = \frac{p + (1 - q)}{2} = \frac{0.7 + 0.6}{2} = 0.65.
    \]  
  - **Coherent scores**:  
    - Rain: \(2 \times (1 - 0.65)^2 = 2 \times 0.1225 = 0.245\).  
    - No rain: \(2 \times (0.65)^2 = 2 \times 0.4225 = 0.845\).  

  Now compare:  
  | Outcome       | Your Score (Incoherent) | Coherent Score (\(p' = 0.65\)) |  
  |---------------|--------------------------|--------------------------------|  
  | **Rain**      | 0.25                     | **0.245** (better)             |  
  | **No rain**   | 0.85                     | **0.845** (better)             |  

  **Both scores are strictly better!** This happens because:  
  1. **Incoherence wastes "probability mass"**: Your total probability budget (\(p + q = 1.1\)) exceeds 1. This forces you to overallocate, increasing penalties in both outcomes.  
  2. **Coherence rebalances mass**: By setting \(p' + (1 - p') = 1\), you redistribute the excess mass (0.1) optimally. The chosen \(p'\) minimizes the maximum penalty, but due to convexity (quadratic penalties), it lowers penalties everywhere.  

  #### Why This Works for Any Strictly Proper Rule
  The Brier score is **strictly convex**—it penalizes large errors disproportionately. This ensures:  
  - **Incoherent points lie outside the "coherent line"** in the accuracy landscape.  
  - **The coherent set is convex**, so any incoherent point is accuracy-dominated by a projection onto the coherent line.  

  <center>
    <img src="https://i.imgur.com/8aHd8V2.png" width="400" alt="Convexity and domination">
  </center>

  **General proof sketch**:  
  1. For incoherent \((p, q)\), the coherent point \((p', 1 - p')\) with \(p' = \frac{p + (1 - q)}{2}\) always exists.  
  2. By convexity of the scoring rule (e.g., squared error), the coherent scores are:  
     \[
     \text{Rain score: } 2(1 - p')^2 \leq (1 - p)^2 + q^2, \quad \text{No rain score: } 2(p')^2 \leq p^2 + (1 - q)^2.
     \]  
  3. Equality holds only if \(p + q = 1\) (coherence). Otherwise, **strict inequality** in at least one outcome.  

  ### Why "Strictly Proper" Is Crucial
  A scoring rule is **proper** if your true credences minimize expected score. **Strictly proper** means they are the **unique** minimizer.  
  - **Strictly proper (e.g., Brier, log score)**: Ensures the domination is **strict** for incoherent credences.  
  - **Merely proper (not strict)**: Domination may not be strict.  

  **Example**: A merely proper rule might have "flat spots" where multiple credences (coherent or not) yield the same score.  
  - Suppose a rule where all \(P(R) \in [0.4, 0.6]\) get the same score if \(R\) occurs.  
  - Your incoherent \(P(R) = 0.7\), \(P(\neg R) = 0.4\) might match some coherent score in one outcome.  
  - **Result**: No coherent assignment strictly dominates you in all outcomes.  

  **Strictly proper rules avoid this** by enforcing uniqueness:  
  - They guarantee that any incoherent credence is strictly worse in some outcome than its coherent counterpart.  
  - Without strict propriety, you could be incoherent but "accidentally" as accurate as coherent alternatives.  

  ### Key Takeaways
  1. **Accuracy demands coherence**: Incoherent credences are always accuracy-dominated by coherent ones under strictly proper rules.  
  2. **Why strictly proper?**: Ensures strict domination—without it, incoherence might not be penalized strictly.  
  3. **No bookmaker needed**: This is purely about accuracy optimization. Dutch books (exploitation) are a separate consequence.  

  By using strictly proper scoring rules, you align your pursuit of truth with the mathematical structure of probability. Incoherence isn't just "irrational"—it's **suboptimal for accuracy**. This is the hidden harmony between epistemology and probability calculus.  

  > *"Probability is not a mere convention; it is the currency of calibrated truth-seeking."*
