answer: |-
  Here’s a toast that threads the needle—grounded in behavioral ecology but voiced as a love story, with theory as its hidden architecture:

  ---

  **(Raise glass, warm eye contact with the couple)**  

  "Some of you know my sister as a scientist who studies why creatures do what they do. Why a bird sings until it’s exhausted. Why an animal stands guard all night. Why certain gestures in nature seem… extravagantly difficult. She’s spent years thinking about signals—the ones that aren’t just noise, but proof.  

  And proof, it turns out, isn’t always what it looks like. If you only glanced at the surface of their story—no flashy diamond, no choreographed proposal, this gloriously simple backyard wedding—you might miss the evidence.  

  But evidence isn’t about expense. It’s about cost. And cost isn’t always money.  

  For three years before they shared a city, [Groom's Name] got into his car. Friday after work. Sunday before dawn. Winter sleet, summer haze, the long, empty stretches of highway under every kind of sky. Four hours there. Four hours back. Not for a dramatic moment. Not to be seen doing it. Just to be *with her*. To share an ordinary Saturday. To fall asleep on her sofa. To be present in the quiet rhythm of her life.  

  That’s not a cheap signal. It’s the opposite. You can’t fake *time*. You can’t borrow commitment. You can’t rent resilience. That drive? That was currency paid in hours no one else saw. In weariness overcome. In a thousand small choices stacked like stones.  

  My brilliant sister knows: the truest signals aren’t the loudest. They’re the ones that would be *impossibly hard* to fake. The ones rooted in something deeper than show. The gift that isn’t given to impress, but because giving it is the point.  

  [Groom's Name], you never framed those miles as a grand gesture. You just drove. That’s the quiet magic of it. You built your proof weekend by weekend, turn by turn, in a car that became the most honest signal I’ve ever seen.  

  And [Sister's Name], you saw it. You recognized that steady, unadorned dedication for what it was—not a peacock’s tail, but a heartbeat. Reliable. Unforced. True.  

  So this wedding? These folding chairs? This simple, sunlit backyard? It’s not the absence of proof. It’s the culmination. It’s what happens when two people have already paid the real cost—in attention, in patience, in showing up—and arrive here utterly sure.  

  No one needs extravagance when they have *this*. When their love speaks in a language beyond price.  

  So let’s raise our glasses to the quiet signals. To the costs paid gladly in unseen hours. To the proof written not in diamond or grand gesture, but in miles driven, days shared, and a lifetime of Saturdays stretching ahead.  

  To [Sister's Name] and [Groom's Name]—your honesty is breathtaking, and your joy is ours. Cheers!"  

  ---

  **Why this works for both rooms:**  

  *   **For the Biologists:**  
      *   "Currency paid in hours no one else saw" + "impossibly hard to fake" = Clear nod to **index signals** (hard-to-fake traits correlating with quality) and **non-pecuniary costs** (time/effort > money).  
      *   "Not a peacock’s tail, but a heartbeat" = Acknowledges Zahavi while deliberately *avoiding* the overused example and shifting focus to **reliability and repetition** over sheer waste.  
      *   "Quiet signals," "showing up," "steady dedication" = Evokes **honest signaling via differential costs** – the cost *to him* (time/effort) is worth it *because of her value* to him. The biologists will hear the theory humming underneath the words.  

  *   **For Everyone Else:**  
      *   The drive is a universally relatable, emotionally resonant story of devotion.  
      *   "Proof," "evidence," "cost" are used in their everyday, emotional senses, not jargon.  
      *   The core message is crystal clear: Their love is proven by consistent, meaningful action, not expensive displays.  

  *   **Structure:**  
      *   **Hook:** Connects sister's work to the idea of "proof."  
      *   **Apparent Contradiction:** Acknowledges the lack of extravagance.  
      *   **Reframe via the Drive:** Introduces the key story illustrating *real*, non-monetary cost.  
      *   **Theoretical Pivot (Hidden):** Explains *why* this specific cost is powerful evidence (hard-to-fake, consistent, paid in effort/time).  
      *   **Apply to Couple:** Shows how both recognized and built upon this honesty.  
      *   **Reframe the Wedding:** Positions simplicity as confidence, not lack of commitment.  
      *   **Toast:** Celebrates the quiet, profound proof of their love.  

  The theory isn't named, but its logic drives the emotional argument. The drive is the perfect Zahavian index signal in human terms – costly (time, effort), reliable (hard to fake consistently), and directly beneficial to the receiver (her getting his presence). It lets you honor the science while making everyone feel the love.
