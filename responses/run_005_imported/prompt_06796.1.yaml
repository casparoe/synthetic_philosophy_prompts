  ## The Uplift Trap: Du Bois vs. Locke on McKay's Harlem

  **Setting:** Alain Locke's book-lined apartment, Harlem, late 1928. The controversial novel *Home to Harlem* lies on a low table between them. The air is thick with intellectual tension and the lingering scent of pipe smoke.

  **Characters:**
  *   **W.E.B. Du Bois (DuB):** 60, intense, impeccably dressed, radiating moral urgency.
  *   **Alain Locke (Locke):** 43, composed, precise, with an air of cosmopolitan detachment.

  **(The dialogue begins mid-argument, Locke gesturing calmly towards the book.)**

  **Locke:** ...precisely, Doctor Du Bois. That is the *danger* of your standard. You condemn McKay not for lack of craft – which would be a legitimate artistic critique – but for lack of *edification*. Because Jake and Ray do not comport themselves as ambassadors for the race, because they live, love, and struggle without an obvious moral appended? You call it "filth." But whose standard of cleanliness are you enforcing?

  **DuB:** (Leaning forward, tapping the book sharply) Cleanliness? Alain, spare me the sophistry. This isn't about bourgeois manners! It's about survival. Every page of McKay's... *reportage*... is ammunition for the very forces that depict us as shiftless, sensual, incapable of higher thought. When the white world holds up *Birth of a Nation* as truth, can we afford to hand them *this*? "All art is propaganda," I said. Must we propagate our own degradation?

  **Locke:** Propaganda demands simplification, Doctor. A flattening. You demand Jake embody a counter-narrative. But McKay shows a man *living*, complexly, amidst the grit and rhythm of Harlem. Isn't *that* truth also a weapon against caricature? More potent, perhaps, because it refuses the tidy box? Your demand for uplift becomes its own cage, policing not just what we show, but *how we feel*. Must every Negro in art be striving, sorrowful, noble? Is there no room for the cabaret’s release, the hustler’s weary pragmatism? That, sir, is a caricature in reverse.

  **DuB:** (Eyes flashing) Room? In whose drawing room? Yours? You speak loftily of "universal appeal" and "individual expression," Alain. But tell me, whose universal? Whose standards dictate that appeal? When the gates are guarded by men who see only savagery or sentimentality in the Negro, does your "art for art's sake" not quietly assume a freedom we do not possess? McKay gives them precisely the savage spectacle they crave! Is *that* freedom? Or is it capitulation to the lowest expectation?

  **Locke:** (Coolly, but with an edge) You mistake the nature of the appeal. The power lies not in confirming expectation, but in the undeniable *humanity* pulsing through it. Jake’s desires, his weariness, his search for fleeting joy – these are universal human conditions rendered in a specific, vibrant Black milieu. White readers may gawk, yes. But others *see*. They see past the caricature because McKay forces the humanity upon them, unvarnished. Your prescribed nobility often feels... manufactured. Congealed. Does it truly challenge, or merely plead?

  **DuB:** Humanity? (He picks up the book, weighs it in his hand) This humanity is filtered through a lens ground by centuries of contempt! You trust too much in the discerning eye of an audience steeped in prejudice. They will see the cabarets rattling like a cheap suitcase, not the complex soul you imagine. And while you champion the artist's sacred individuality, who pays the price for their "expression"? The schoolteacher denied a job because Harlem is deemed a "den of vice"? The child internalizing these limited, hedonistic portraits as the only authentic Black life? Your freedom is a luxury purchased with our collective coin.

  **Locke:** And your control, Doctor, is a straitjacket woven from fear! You fear the white gaze so deeply you would have us preen only for its approval on *your* terms. You silence the messy, the ambiguous, the truly revolutionary act of *owning* our complexity – joy *and* despair, respectability *and* rebellion. McKay shows Harlem breathing, not posing. If we only show what fits the "uplift" narrative, do we not become collaborators in erasing the vast, teeming reality of who we are? The caricaturist wins either way – by his hand, or by ours, silencing ourselves.

  **DuB:** (Stands, the book still in hand, his voice low and intense) Erasure? No. Strategic revelation. We fight a war, Alain, not host a salon. When the caricature is the weapon, counter-propaganda is the shield. You offer... aesthetics. Beautiful, perhaps, but a shield made of gauze. McKay hands the enemy the knife and calls it art. Forgive me if I cannot applaud the craftsmanship of the blade.

  **Locke:** (Remains seated, meeting Du Bois's gaze) And forgive me, Doctor, if I cannot live imprisoned within the enemy's definition of the battle. Your shield may protect, but it also imprisons. The art that endures, that truly shifts the soul, often carries the uncomfortable, unvarnished truth you deem too dangerous. Perhaps the deepest protest is simply to *be*, fully, complexly, refusing the terms of either the oppressor *or* the uplift officer.

  **(Du Bois looks down at the book, then back at Locke. Neither concedes. The argument isn't over; it's simply reached an impasse, the weight of their positions – the urgent need for defense versus the perilous desire for unfettered truth – hanging heavy in the room between them. Locke gestures silently towards the tea tray. Du Bois does not sit.)**
