answer: |-
  That's a fantastic rabbit hole to be down, and your skepticism about the scoring rule arbitrariness hits on one of the deepest and most persistent challenges for accuracy-first epistemology (AFE). You've perfectly identified the core tension: **Joyce's dominance argument seems to require a specific *kind* of scoring rule to work, and the justification for privileging *that kind* can feel circular or question-begging.** Let's break down the responses and assess the damage.

  **1. The Core Problem (Recap):**

  *   **Joyce's Argument (Simplified):** If your credences `(c1, c2, ..., cn)` over a partition are incoherent (don't sum to 1), there exists a *coherent* set `(c1*, c2*, ..., cn*)` such that for *every possible world* `w_i` (where proposition `i` is true), the accuracy score of `c*` is better than the score of `c` using a **strictly proper scoring rule (SPSR)** like the Brier score.
  *   **The Arbitrariness Worry:** Why the Brier score? Why *any* specific SPSR? There exist other scoring rules that seem intuitively reasonable (e.g., asymmetric rules, log-like rules not strictly proper) where:
      *   **A.** Coherent credences are *not* accuracy-dominated (e.g., under the log score, incoherent credences are either dominated *or* infinitely inaccurate in some worlds).
      *   **B.** Different SPSRs can sometimes rank coherent credence functions differently, suggesting no single "most accurate" coherent view.
  *   **The Smuggling Suspicion:** It feels like "accuracy" is being *defined* (via the choice of SPSR) in a way that *builds in* the requirement for coherence. If coherence is what makes a credence function rational, and we define "accuracy" such that only coherent functions can be optimally accurate, haven't we just assumed our conclusion?

  **2. How AFE Defenders Respond to the Arbitrariness Worry:**

  Proponents don't dismiss the worry; they engage with it seriously. Here are the main lines of defense:

  1.  **The Centrality of Propriety (Strict Propriety as a Rationality Constraint):**
      *   **The "No Self-Sabotage" Argument:** A scoring rule is *strictly proper* if a credence function expects *itself* to be more accurate than any *different* credence function. Think of it as a **no-foregone-improvement** principle. If you truly believe `c` is your best estimate, you shouldn't *expect* announcing some `c' ≠ c` to get you a better score. Using a non-proper rule would incentivize you to misrepresent your actual beliefs for anticipated gain – a clear epistemic vice. Strict propriety aligns epistemic honesty with expected accuracy maximization.
      *   **Why it Addresses Arbitrariness:** This argues that strict propriety isn't an *arbitrary* choice smuggled in to get coherence; it's an *independent* rational requirement for any scoring rule meant to measure *epistemic* accuracy. Rules that aren't strictly proper (like absolute value) fail this basic test of epistemic rationality. This shifts the debate: the focus isn't "why Brier?", but "why *any* strictly proper rule?".

  2.  **Characterization Theorems (Uniqueness Arguments - Weaker Forms):**
      *   **Goal:** Show that *all* strictly proper scoring rules, despite their differences, agree on the core result: **incoherent credences are always accuracy-dominated by *some* coherent alternative.**
      *   **The Result (Joyce, Predd et al.):** This is generally true *for finite partitions*. For any incoherent credence `c` over a finite set of mutually exclusive and exhaustive possibilities, and for *any* strictly proper scoring rule `S`, there exists a coherent credence `c*` such that `S(c*, w_i) > S(c, w_i)` for every possible world `w_i`.
      *   **Why it Addresses Arbitrariness:** This shows the dominance argument for coherence *doesn't depend* on choosing a *specific* SPSR like Brier. Any SPSR will deliver the dominance result. The choice of *which* SPSR matters for comparing coherent functions, but not for the fundamental argument *against* incoherence. Arbitrariness in the finer details doesn't undermine the core case for coherence.

  3.  **The "No Sweet Spot" Argument (Infinite Partition Case):**
      *   **The Problem:** Characterization theorems guaranteeing dominance *for any SPSR* typically rely on the partition being finite. For infinite partitions (e.g., a continuous parameter), things get messier. Some SPSRs (like a logarithmic rule) might *not* dominate certain incoherent credences over infinite partitions.
      *   **The Response (Seidenfeld, Schervish, Kadane - "SSK"):** They argue that while a *single* SPSR might not dominate a specific incoherent credence over an infinite partition, **no incoherent credence is "Pareto optimal" across *all* reasonable scoring rules.** For any incoherent `c`, there exists some coherent `c*` and some *set* of reasonable scoring rules (specifically, SPSRs) such that `c*` is at least as accurate as `c` in every world according to *every rule in that set*, and strictly more accurate in some world according to *some rule in that set*. There's no incoherent "sweet spot" that avoids being beaten by a coherent alternative under *some* reasonable perspective on accuracy.
      *   **Why it Addresses Arbitrariness:** It concedes that no single SPSR universally delivers dominance over infinite partitions but argues that coherence is still rationally required because incoherent credences are always vulnerable *from some reasonable accuracy perspective*. Rationality requires avoiding being dominated *on any reasonable measure*.

  4.  **Axiomatic Characterizations of Scoring Rules:**
      *   **Goal:** Instead of starting with propriety, derive the *form* of admissible scoring rules from more fundamental, intuitively plausible axioms about what an accuracy measure *should* be like (e.g., Separability, Symmetry, Continuity, Strict Propriety itself, Normality/Dominance).
      *   **Results:** Work by McCarthy, Savage, Aczél, Pfanzagl, Gneiting, Raftery, etc., shows that such axioms constrain scoring rules significantly. For example, under common sets of axioms, the only rules for probability assessments are linear (Brier-like) or logarithmic. These arguments try to justify the *class* of SPSRs as the uniquely reasonable ones based on prior, seemingly less loaded, principles.
      *   **Why it Addresses Arbitrariness:** If successful, this shows the choice isn't arbitrary; it's forced by basic, plausible constraints on what constitutes a measure of *pure epistemic accuracy*.

  **3. Your Honest Read: Does Probabilism Survive? Is the Crack Fatal?**

  This is where things get philosophically spicy. My honest assessment:

  *   **Probabilism (as a core norm) is remarkably resilient:** The defenses, particularly the **"No Self-Sabotage" argument for strict propriety** and the **characterization theorems for finite partitions**, are powerful. They successfully shift the ground. It's *very* hard to argue that epistemic agents should use scoring rules where misrepresenting their beliefs is *expected* to yield better scores. This makes strict propriety seem like a non-arbitrary, rational constraint. And knowing that *any* SPSR delivers dominance over incoherence in the finite case significantly mitigates the "why Brier?" worry. **For finite partitions, the crack is largely patched.**
  *   **The Arbitrariness Worry Transforms, Doesn't Disappear:** The worry doesn't kill probabilism, but it morphs:
      *   **Which SPSR? (The Fine-Graining Problem):** While *any* SPSR rules out incoherence, different SPSRs can rank *coherent* credences differently. Is the Brier-score-optimal credence always more rational than the log-score-optimal one? AFE struggles to give a unique "most accurate" coherent credence without appealing to further (potentially arbitrary) pragmatic or epistemic values (e.g., risk-aversion encoded in the scoring rule curvature). The "arbitrariness" moves from threatening coherence to threatening how we choose *among* coherent functions.
      *   **Infinite Partitions & The "SSK" Response:** The SSK "no sweet spot" argument is clever, but some find it less compelling than the clean dominance result for finite cases. It relies on judging rationality by avoiding vulnerability to *any* member of a large class of measures, which can feel less direct or forceful. The crack is wider here.
      *   **Are the Axioms Truly Neutral?:** Axiomatic derivations rely on axioms that might themselves encode probabilistic assumptions or controversial values (e.g., is "Separability" – scoring each proposition independently – always appropriate for measuring *total* epistemic state accuracy?).
  *   **It's a Significant Crack in the *Foundational Ambitions* of AFE:** AFE aspires to ground all epistemic norms (coherence, conditionalization, reflection) *solely* in accuracy maximization. The scoring rule sensitivity shows this is harder than it first appeared. **The choice of accuracy measure (SPSR) isn't *derived* purely from accuracy considerations; it's a substantive input that carries normative weight.** Defenders argue this input (strict propriety) is independently justified, but critics see it as importing the very norms AFE tries to derive. This makes AFE less "purely" accuracy-first than its strongest proponents sometimes suggest.
  *   **Probabilism Survives, AFE's Purity Takes a Hit:** Probabilism likely survives because the arguments *for* strict propriety are strong, and coherence is delivered robustly across SPSRs in the core finite case. However, **the scoring rule sensitivity reveals that "accuracy" in AFE is a richer, more normatively laden concept than a naive "distance to truth" metaphor suggests.** It incorporates a crucial element of epistemic rationality (no expected self-sabotage via propriety) and potentially other values. This doesn't make AFE useless – it's still a powerful framework and generates profound insights – but it tempers claims that accuracy alone, minimally conceived, is the *sole* fundamental epistemic good that explains everything else. Other considerations (like avoiding self-sabotage) are woven into the fabric of "accuracy" from the start.

  **In Conclusion:** Your rabbit hole led you to a profound and legitimate challenge. Defenders have sophisticated responses, particularly the independent rationale for strict propriety and the dominance-under-any-SPSR result for finite partitions. These effectively defend probabilism *against incoherence*. However, the sensitivity to the *choice* of SPSR highlights that "accuracy" in AFE is a carefully constructed normative concept, not a raw, pre-theoretical given. This is a significant qualification to AFE's foundationalist aspirations, revealing that the path from "accuracy" to specific norms isn't quite as direct or assumption-free as initial dominance arguments might suggest. The crack doesn't collapse the edifice of probabilism, but it does show that AFE's foundations are complex and require careful justification beyond just pointing to dominance under one rule. It's an active area of research precisely because the challenge is so potent. Keep digging!
