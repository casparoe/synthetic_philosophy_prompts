  ### Move-by-Move Justification

  1. **Naomi (Score: 2 - Clearly right)**  
     She correctly identifies all core Lewisian conditions:  
     - **Coordination equilibrium**: A boarding order solves the coordination problem (everyone prefers *some* order to chaos).  
     - **Arbitrariness**: Alternatives (lottery, tickets) would work if established (Lewis's key criterion: "arbitrary but useful").  
     - **Precedent-based emergence**: No explicit agreement needed; daily practice sets expectations.  
     *Lewis explicitly uses queues as examples (Convention, p. 42), making this a textbook case.*

  2. **Felix (Score: 1 - Partly right, but overreaches)**  
     He correctly notes that Lewis's core model focuses on *expectations* and *self-interest*, not moral outrage. However:  
     - Lewis *does* allow conventions to generate normative force through reliance (pp. 97-104).  
     - Anger ≠ proof of non-arbitrariness. Violating *any* deeply entrenched convention (e.g., driving on the left) can cause outrage due to disrupted expectations, not inherent fairness.  
     *His observation about intensity isn't a refutation, but highlights a phenomenon Lewis underemphasizes.*

  3. **Naomi (Score: 2 - Clearly right)**  
     She accurately extends Lewis's framework:  
     - **Common knowledge and reliance**: Once a convention is entrenched, people invest time/resources based on expectations (e.g., arriving early).  
     - **Frustrated expectation as cost**: Lewis treats conformity as rational because deviation *harms others* by thwarting their plans (p. 10). Anger reflects this real cost, not necessarily "fairness" as a moral primitive.  
     *This directly addresses Felix's concern within Lewis's model.*

  4. **Felix (Score: -1 - Misguided)**  
     His escalator analogy fails:  
     - **False equivalence**: Escalator standing doesn't allocate *scarce goods* (time/position on a train). Queues do, making reliance costs higher.  
     - **Lewis's arbitrariness isn't voided by reliance costs**: The *selection* of FCFS was arbitrary (tickets could work), even if its *violation* now imposes greater harm due to context.  
     - **Moralization ≠ non-arbitrariness**: As Naomi later argues, moral norms can *co-opt* conventions without making them non-arbitrary at origin.  
     *He conflates the convention's structure with its contingent social consequences.*

  5. **Naomi (Score: 2 - Clearly right)**  
     She delivers the decisive point:  
     - Lewis's arbitrariness condition applies to the *selection* of the regularity, not its subsequent social embedding.  
     - Conventions can *acquire* moral weight ("justice") through external norms (e.g., effort-reward fairness) without ceasing to be conventions.  
     - Lewis's goal was to explain *coordination*, not moral psychology.  
     *This preserves Lewis's definition while acknowledging the observed moral charge.*

  ---

  ### Final Verdict
  **Yes, first-come-first-served queueing satisfies Lewis's definition of a convention.** It meets all criteria:  
  1. A regularity in behavior (queuing).  
  2. Governed by mutual expectations (people expect others to hold their place).  
  3. Solving a coordination problem (orderly boarding).  
  4. Arbitrary (alternatives exist).  
  5. Self-perpetuating through precedent.  

  **The moral charge around queue-jumping does *not* expose a gap in Lewis's account.** Lewis explicitly limited his theory to explaining how conventions emerge and persist as solutions to *coordination problems*. The intensity of reactions to violations stems from:  
  - **High reliance costs**: Queues involve significant time investment and tangible scarcity (e.g., seating).  
  - **Co-option by fairness norms**: Societies often graft moral principles (e.g., "first arrival deserves priority") onto conventions *after* they form.  

  This moral dimension is simply **outside the scope** of what Lewis's theory attempts to explain. His framework successfully identifies queueing as a convention; it doesn't (and needn't) explain why *some* conventions become morally charged while others (like escalator standing) don't. That requires supplementary theories of fairness or social norms.
