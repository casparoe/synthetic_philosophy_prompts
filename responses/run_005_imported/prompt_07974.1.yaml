answer: |-
  **MEMORANDUM**  
  **To:** Capstone Committee, Formal Methods Concentration  
  **From:** [Your Name], Student Representative  
  **Date:** [Current Date]  
  **Subject:** Policy Recommendation on Classical Axioms in Capstone Proofs  

  ### **I. Background and Core Conflict**  
  The committee must resolve whether classical axioms (e.g., excluded middle, choice) should be permitted in Coq proofs for capstone projects, given last year’s incident where excluded middle led to non-executable code. This issue intersects technical constraints of code extraction with philosophical debates about proof semantics.  

  - **Pro-Ban Argument (Constructive Position):**  
    Brouwer’s intuitionism and the BHK interpretation hold that a proof of existence must supply a witness. Dummett’s meaning-as-use semantics further argues that truth conditions should be grounded in our capacity to verify claims. Importing classical axioms violates these principles, producing "verified" code that fails at runtime (e.g., inert stubs for real number comparisons). This undermines the capstone’s goal: extracting *runnable*, certified programs.  

  - **Anti-Ban Argument (Classical Utility Position):**  
    Classical logic is a powerful tool for proving specification-level lemmas (e.g., "this algorithm terminates or doesn’t") without computational intent. Banning it risks burdening students with avoidable proof complexity and implicitly endorses a contested metaphysical view—that classical mathematics is "incorrect"—which could mislead students about the pluralism of formal methods.  

  ### **II. Recommendation: A Contextual Ban**  
  **Classical axioms should be permitted in Coq proofs *only* in modules explicitly marked as non-computational (e.g., using `Declare Module` or `Parameter` sections), but banned outright in all computationally relevant proofs destined for extraction.**  

  #### **Reasoning:**  
  1. **Guarantees Executable Code:**  
     The primary goal of the capstone is to produce *extractable*, certified software. By restricting classical axioms to non-extracted modules, we ensure that all code-generating proofs adhere to constructive principles (e.g., providing witnesses for existence claims). This prevents runtime failures like last year’s stub.  

  2. **Respects Both Philosophical and Practical Concerns:**  
     - **For the Constructive Position:** It upholds the BHK-Dummett requirement that proofs of executable specifications must be witness-producing.  
     - **For the Classical Position:** It allows classical logic for non-extracted "background" proofs (e.g., high-level properties of specifications), preserving its utility without compromising executability.  

  3. **Aligns with Coq Best Practices:**  
     Coq supports segregating classical and constructive content via:  
     - The `Prop` universe for non-computational axioms.  
     - The `Extract` command’s ignorance of `Prop`-only dependencies.  
     This approach is standard in verified software projects (e.g., using `Classical_Prop` in isolated modules).  

  4. **Mitigates Pedagogical Risks:**  
     Students will learn that classical logic is *contextually valid*—useful for abstract reasoning but incompatible with extraction. This reflects real-world formal methods, where classical axioms may inform specifications but not implementations.  

  #### **Implementation Guidelines:**  
  - **Computational Proofs:** Must be constructive (no `Axiom classical`, `Require Import Classical`, etc.).  
  - **Non-Computational Proofs:** May use classical axioms if:  
    - The module is declared `Prop`-only or `Parameter`-based.  
    - No extracted code depends on it.  
  - **Education:** Teach students to:  
    - Separate specifications into computational vs. logical layers.  
    - Use `Prop` for classical lemmas (e.g., `forall x y : R, (x < y) \/ (x = y) \/ (x > y)`).  
    - Replace excluded middle on reals with constructive alternatives (e.g., `x <? y` for decidable comparisons).  

  ### **III. Acknowledging the Losing Side**  
  The committee recognizes the **anti-ban position’s strongest point**: a blanket ban could force students to prove trivial classical lemmas constructively, wasting time and obscuring the fact that classical logic remains sound and useful *outside extraction contexts*. Our recommendation addresses this by permitting classical axioms in non-extracted modules, ensuring students retain access to its efficiency for specification reasoning.  

  ### **IV. Conclusion**  
  This policy balances the capstone’s engineering mandate—extracting executable code—with respect for classical logic’s role in abstract mathematics. It prevents non-constructive proofs from generating dead code while allowing classical reasoning where harmless. **We recommend adopting this contextual ban for all capstone projects starting next year.**  

  ---  
  **Approved by:** [Your Name], Student Representative  
  **Next Steps:** Vote at [Date] meeting; draft updated capstone guidelines.  

  ---  
  **Rationale for Decisiveness:**  
  This recommendation rejects "it depends" by leveraging Coq’s architecture to enforce a clear boundary: classical logic in non-extracted proofs is permitted; in extracted proofs, it is banned. This satisfies the pro-ban demand for runtime correctness and the anti-ban demand for proof flexibility, without requiring metaphysical consensus.
