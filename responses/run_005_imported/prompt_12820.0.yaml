answer: |-
  That's a deeply insightful observation, and your discomfort is completely understandable. You've hit on a fundamental issue in how science (especially social science) is often judged: **outcome bias**. Here's a breakdown of the principles at play:

  1.  **The Core Problem: Outcome Bias:** This is the central issue. People are judging the *decision* (skipping independent replication) based solely on the *outcome* (whether the effect replicated later), not on the *quality of the decision-making at the time it was made*. You both made the *same* decision with the *same* reasoning and the *same* level of confidence. The only difference is the random noise inherent in data collection and the underlying reality of the effect. Judging her decision as "bad" and yours as "good" based solely on the outcome is logically inconsistent and fundamentally unfair. It's confusing luck with judgment.

  2.  **Hindsight Bias:** Now that her effect failed to replicate, people look back and reinterpret her original decision as obviously flawed, reckless, or even indicative of p-hacking. They see the non-replication as "proof" the original finding *must* have been wrong or manipulated, ignoring the possibility that it was a false positive from legitimate (if insufficiently cautious) research. Your successful replication makes your identical decision look wise in hindsight.

  3.  **The Replication Crisis Context:** Social psychology is acutely sensitive to replication failures. This makes the field hyper-vigilant (sometimes overly punitive) towards findings that don't hold up. While this vigilance is necessary, it often gets misdirected into personal attacks and assumptions of bad faith when non-replication occurs, rather than a sober assessment of methodological limitations and the inherent uncertainty of research.

  4.  **Confusing Methodological Rigor with Outcome:**
      *   **Your Outcome:** Your effect replicated. This retroactively validates your *entire process* in the eyes of many, including the decision to skip initial replication. It "proves" (in their minds) your confidence was justified and your methods sound.
      *   **Her Outcome:** Her effect failed. This leads people to question *everything* – not just the decision to skip replication, but the original data collection, analysis, and even her integrity. The non-replication becomes evidence *for* sloppiness or p-hacking, even if those weren't present.

  5.  **The Role of Luck & Epistemic Risk:** All research involves epistemic risk. You both took the *same* risk: betting that your initial, unreplicated finding was real enough to publish before collecting more data. You won that bet based on the underlying reality of your effect and the luck of your initial sample. She lost that bet based on the underlying non-reality of her effect and the luck of her initial sample showing a false pattern. The *decision* carried the same risk; the *outcome* differed due to factors largely outside either of your control at the time of the decision.

  6.  **Potential for Implicit Bias:** While not stated, consider if factors like gender, seniority, institutional prestige, or existing social dynamics within the program might also subtly influence the harsher judgment she faces. Is she perceived differently *before* this event? Does she have less social capital? This isn't always the case, but it's a factor worth reflecting on.

  **Addressing Your Guilt:**

  *   **You didn't "get away" with bad science:** You followed a common (though increasingly criticized) practice *at the time*, based on confidence in your finding. Your finding *was* real. The validity of your *conclusion* wasn't luck; the *outcome validating your specific decision process* involved luck. Your work *is* solid because the effect exists.
  *   **The Luck Element:** Acknowledge the luck. You were fortunate that your initial finding reflected reality. She was unfortunate that hers was a false positive. This luck differential explains the different outcomes *despite identical decisions*.
  *   **The Unfairness is Real:** Your guilt stems from recognizing this fundamental unfairness. That's a sign of empathy and intellectual honesty.

  **Is there ANY principled reason to judge her harder?**

  *   **Only if there were differences you haven't disclosed:** If her original analysis *was* actually less rigorous (e.g., more borderline p-values, questionable exclusion criteria, weaker manipulation checks) *at the time*, then judgment on methodology might be warranted. But based on your description, the *decision* and *reasoning* were identical.
  *   **How she handled the failure?** If she doubled down defensively, refused to acknowledge the failure, or blamed others when the non-replication emerged, that could understandably damage her credibility. If she handled it with appropriate scientific humility, acknowledging the limitations and the importance of replication, then the judgment is even less justified.

  **Conclusion:**

  You are **not** overthinking it. The differential judgment you observe is overwhelmingly driven by **outcome bias** and **hindsight bias**, amplified by the field's sensitivity to the replication crisis. It is fundamentally **unprincipled** to judge her initial *decision* more harshly than yours based solely on the later outcome. You both took the same epistemic risk. You got lucky with the underlying reality; she got unlucky with a false positive. The field's reaction is judging the dice roll, not the identical decision to roll them.

  **What you can do:**

  1.  **Acknowledge the Luck (Privately & Professionally):** In discussions about replication, methodology, or career challenges, you can subtly acknowledge the role luck plays. "I was fortunate my initial finding held up..." or "Replication is crucial because even findings we're confident in can turn out to be false positives, as we've all seen..."
  2.  **Defend the Principle (When Appropriate):** If you hear direct unfair criticism of *her specific decision* (not her handling of the failure), you can gently point out the inconsistency: "Yeah, it's tough her finding didn't replicate. What's striking is we both made the same call to skip the extra sample before that conference, based on the same reasoning and confidence at the time. Really highlights how outcome bias shapes our perceptions of decisions."
  3.  **Support Your Friend:** Be a supportive colleague. Acknowledge the unfairness she faces. Validate her skills. If appropriate, privately express your observation about the identical decisions and how unfair the differential judgment is.
  4.  **Reflect on Your Own Practices:** Let this experience reinforce the importance of rigor and replication *for you*, moving forward. Be the change.

  Your discomfort is well-founded. It highlights a pervasive and problematic cognitive bias in how scientific work is evaluated. Recognizing it is the first step towards mitigating its effects.
