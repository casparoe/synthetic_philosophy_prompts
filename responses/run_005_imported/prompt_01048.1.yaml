prompt: |-
  In longtermist discussions on LessWrong and the EA Forum, I frequently see Cowen and Parfit's argument cited to show that a positive rate of pure time preference is indefensible: there's no principled reason why the mere date at which a benefit occurs should reduce its moral weight. This strikes me as clearly correct. But when I look at how this plays out in actual cost-benefit analysis, even Nicholas Stern — usually treated as the reasonable, pro-future-generations side of his dispute with Nordhaus over climate policy — still discounted future consumption at roughly 1.4% per year rather than 0%, and over a century that compounds into an enormous difference in how much weight future people get. Doesn't Stern's own choice of a positive rate show that he never really accepted the Cowen–Parfit argument, and that even the "ethical" side of the climate-discounting debate ends up smuggling pure time preference back in under a more palatable label?
reasoning: |-
  Okay, the user is grappling with a tension in longtermist ethics. They see the Cowen-Parfit argument against pure time preference as logically sound, but notice that even "ethical" economists like Stern use positive discount rates in practice. This creates cognitive dissonance for them.

  Hmm, this user is clearly well-versed in EA concepts - they reference LessWrong, know the Stern-Nordhaus debate, and understand compounding effects. Their frustration is palpable: why does theory not match practice? The core question seems to be whether Stern is being inconsistent or dishonest by using 1.4% discounting while claiming to care about future generations.

  Let me unpack Stern's position carefully. The key is distinguishing between pure time preference (which Stern rejects) and other discounting components. Stern's 1.4% comes from two sources: catastrophic risk (0.1%) and declining marginal utility from growth (1.3%). Neither violates Cowen-Parfit. 

  I should emphasize that declining marginal utility isn't about time preference - it's about richer people valuing extra consumption less. If we expect future generations to be wealthier, this actually shows more concern for the poor present, not less for the future. That's ethically consistent.

  The user might be missing how small probabilities of extinction compound over centuries. Even 0.1% annual extinction risk means only about 90% survival chance over 100 years. That's significant! Stern includes this sober reality while still giving substantial weight to the long-term future.

  Perhaps the user's deeper concern is about compromise in cost-benefit analysis. They might wish Stern used 0% discounting. But in policy contexts, completely ignoring growth differentials or existential risks would be irresponsible. Stern's approach tries to balance ethical ideals with practical modeling constraints.

  I should acknowledge the user's valid point: 1.4% vs 0% makes a massive difference over centuries. But that's precisely why Stern chose the lower rate - Nordhaus used 4-6%! The ethical position isn't all-or-nothing; Stern moved the needle dramatically toward future generations while keeping the model usable.

  The user seems to want absolute ethical purity in modeling, but real-world policy analysis requires grappling with uncertainties and economic realities. Stern's framework maintains the spirit of Cowen-Parfit while operating within necessary constraints. His discount rate components all have defensible ethical justifications.
answer: |-
  You've pinpointed a crucial tension in longtermist ethics and climate economics. While your concern is valid, Stern's use of a positive discount rate *isn't* necessarily a rejection of the Cowen-Parfit argument. Here's a breakdown of the nuances:

  1.  **Distinguishing Components of Discounting:** Stern (in the Stern Review and subsequent work) explicitly distinguishes between:
      *   **Pure Time Preference (δ):** The "discounting of pure time" Cowen/Parfit reject. Stern sets this to **0.1%**, arguing this reflects only the *exogenous risk of human extinction* (e.g., asteroid strike, unforeseen pandemic), *not* mere passage of time.
      *   **Declining Marginal Utility of Consumption (η * g):** This is the larger component (≈1.3% in his model). It reflects two ethical judgments:
          *   **η (Elasticity of Marginal Utility):** How much less valuable an additional unit of consumption is to someone who is richer (η ≈ 1.0 in Stern). This embodies aversion to inequality.
          *   **g (Per capita consumption growth rate):** The expected rate at which future generations will be wealthier than the present (g ≈ 1.3% in Stern's baseline).
      *   **Total Discount Rate (r):** r = δ + η * g ≈ 0.1% + (1.0 * 1.3%) = 1.4%.

  2.  **Stern's Alignment with Cowen-Parfit:**
      *   **δ ≈ 0:** By setting the pure time preference component to near-zero (only accounting for extinction risk), Stern explicitly *accepts* the core Cowen-Parfit argument. He agrees the *mere date* of a benefit is morally irrelevant.
      *   **Justification for η * g:** Stern argues the η*g component is *not* about discounting time, but about:
          *   **Efficiency:** If future people are richer (g > 0), a dollar sacrificed today represents a larger *utility loss* to poorer present people than the *utility gain* it provides to richer future people. Discounting future *consumption* at η*g reflects this diminishing marginal utility across wealth levels, not time.
          *   **Equity:** It weights the welfare of poorer generations (today) more heavily than richer generations (the future), consistent with common ethical views about prioritizing the worse-off.

  3.  **Why it's Not "Smuggling":**
      *   **Transparency:** Stern is explicit about the components and their ethical justification. He doesn't hide a positive rate; he decomposes it and argues for the ethical basis of each part.
      *   **Ethical Consistency:** The argument for η*g stems from an ethical principle (diminishing marginal utility / priority to the worse-off) applied *across generations*, not from valuing the present more simply because it's present. It's logically distinct from pure time preference.
      *   **Focus on Welfare, Not Consumption:** Stern discounts *future consumption* because of expected higher future wealth, but he does *not* discount the *welfare* derived from that consumption *if* future generations were equally wealthy. The discounting arises *because* they are expected to be richer.

  4.  **The Legitimate Debate:**
      *   **Is η*g truly separable?** Critics argue that in practice, applying η*g *over time* functions similarly to time preference, especially when growth projections are uncertain and intergenerational inequality is viewed differently than intragenerational inequality.
      *   **Choice of η:** Stern's η=1.0 is relatively low (implying less aversion to consumption inequality). Nordhaus used η≈2-3, giving much higher weight to future consumption growth and resulting in a higher discount rate (4-6%). Choosing η involves a fundamental ethical judgment about inequality aversion.
      *   **Extinction Risk (δ):** Is 0.1% the right figure? Should this even be included in the discount rate, or modeled separately? Some longtermists argue for lower or higher values.
      *   **Growth Pessimism:** If future growth (g) is lower than Stern assumed (or negative due to climate impacts), then η*g becomes smaller or negative, reducing or even reversing the discounting effect.

  5.  **The Difference it Makes:**
      You are absolutely right that 1.4% vs. 0% compounds massively over centuries. This is precisely why Stern's rate (low by traditional economic standards, *especially* his near-zero δ) leads to vastly stronger conclusions about the urgency of climate action compared to models using rates like Nordhaus's 4-6%. Stern *dramatically* increased the weight given to future generations compared to standard practice.

  **Conclusion:**

  Stern's 1.4% rate **does not** mean he rejected Cowen-Parfit. He explicitly incorporated their core argument by setting pure time preference (δ) near zero. The positive rate primarily reflects an ethical judgment about **efficiency and equity** – that resources transferred from a poorer present to a much richer future yield less net welfare gain due to diminishing marginal utility. While one can debate the validity of η*g as a discounting component (especially its application across generations), its justification is distinct from pure time preference. Stern's approach represents a significant ethical shift towards future generations within the constraints of standard welfare economics, not a covert smuggling of time preference. The debate now centers on the validity and magnitude of η*g and δ, not on the principle that pure time discounting is indefensible.
