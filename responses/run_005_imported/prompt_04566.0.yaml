  What if we set T to be {w1, w2, w3}? Then P(T)=0.75. But in the set A, T is true at w3? But at w3, A is true and B is false. So if we define A>B to be true at w3, that would be wrong. And P(B|A)=0.666... but P(T)=0.75.

