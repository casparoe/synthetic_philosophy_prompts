     P(A|T) = P(B|A,T) * P(A|T)

  Assuming P(A|T) > 0, we can divide both sides:

     1 = P(B|A,T)

  This says that given T and A, B must be true with probability 1. But note that T is the set of worlds where A>B is true. In our earlier analysis, we had that in the set A, T is true only when B is true? Actually, in our example we had that in A, T is true at w1 and w2 (where B is true) and false at w3 (where B is false). So in the set A∩T, we have w1 and w2, and in that set B is true. So P(B|A,T)=1. So this holds.

  But wait, we already saw that we cannot have a fixed T that satisfies the Equation for all distributions. So the problem is that we cannot even get started.

  Let me try to construct a specific example with a fixed T and a specific distribution where the Equation fails, even though we tried to set T appropriately for a base distribution.

  Suppose we fix T as {w1, w2, w4} (which we thought might work for one distribution). And let our base distribution be uniform: p1=p2=p3=p4=0.25.

  Then P(A>B) = P(T) = 0.25+0.25+0.25 = 0.75.

  P(B|A) = P({w1,w2}) / P(A) = (0.25+0.25)/(0.25+0.25+0.25) = 0.5 / 0.75 ≈ 0.666... which is not 0.75. So it fails.

