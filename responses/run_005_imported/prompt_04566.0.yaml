  We are going to build intuition for Lewis's triviality result by considering a small example. The idea is to see how the requirement that P(A > B) = P(B|A) for all A, B forces the probability space to be trivial in a specific sense: the probability of any non-tautological conditional must be either 0 or 1, or the space must be very limited.

  Recall the Equation (Adams's Thesis): For any two propositions A and B, the probability of the indicative conditional "If A then B" (denoted A > B) is given by the conditional probability P(B|A) = P(A ∩ B) / P(A), provided P(A) > 0.

  Lewis's triviality result shows that if we assume that the conditional A > B is a proposition (so that it has a fixed truth value in every possible world) and the Equation holds for all A and B, then the probability function P must be trivial in the sense that it can only take at most two distinct values (other than 0 and 1) and the space is very constrained.

  Let's set up a small example with four possible worlds: w1, w2, w3, w4. We assign probabilities to these worlds: p1, p2, p3, p4 (nonnegative and sum to 1).

  We consider two events (propositions) A and B. Each proposition is a subset of the four worlds. Let:

  A = {w1, w2, w3}   (so that ~A = {w4})
  B = {w1, w2}        (so that ~B = {w3, w4})

