  okay so i had a whole argument with my friend last night that spiraled into bayesian epistemology lol. she was hyped that her new therapist basically "explained" her entire childhood and personality in one session, and i said that's not actually strong evidence the diagnosis is right, since all that stuff was already known before the explanation showed up. she called me a buzzkill for it. i tried to bring up the whole "problem of old evidence" thing (like how mercury's orbit precession was already known way before einstein, but people still treat it as huge confirmation of general relativity) and we couldn't agree on whether old evidence "counts" the same as a genuinely new prediction. can you break down the most important implications of the problem of old evidence for how much epistemic credit i should give an explanation or theory (a diagnosis, a personality test, whatever) when it just accomodates stuff i already knew, versus when it predicts something new? trying to figure out if my gut reaction was actually justified or if i was just being annoying about it.
