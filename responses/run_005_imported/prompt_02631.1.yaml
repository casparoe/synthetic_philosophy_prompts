prompt: |-
  I'm a PhD student in philosophy of biology drafting a seminar paper on rival accounts of biological function, and I'd like to avoid leaning on the well-worn example of the heart's function being to pump blood rather than to make a thumping sound. Could you write a short dialogue between an etiological theorist and a causal-role theorist debating whether the malleus and incus of the mammalian middle ear have the function of transmitting sound, given that these bones evolved from the jaw-joint bones of synapsids, the reptile-like ancestors of mammals, and only later came to serve hearing? Please have each side press the strongest objections available against the other's account, rather than simply restating their own view, and don't let either character concede too readily -- I suspect this case is genuinely difficult for both theories to handle cleanly.
