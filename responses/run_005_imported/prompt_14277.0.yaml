prompt: |-
  My grandma died last month and we did the Buddhist funeral rites for her, and the monk kept talking about dedicating merit for her next life and her being 'reborn.' Which is sweet and all, except I always thought the whole point of anatta was that theres no self to survive death and get reborn in the first place? Ive been down a rabbit hole since, and it turns out this was a huge internal Buddhist fight -- apparently there was a school, the Pudgalavada (hope im spelling that right), that argued you need some minimal 'person,' neither the same as nor different from the aggregates, to make memory, karma, and rebirth actually work, and mainstream Abhidharma folks like Vasubandhu wrote whole refutations arguing that's just smuggling the self back in through the side door. Could you write me a dialogue between a Pudgalavadin and a Vasubandhu-style reductionist that actually hashes out whether 'just a causal series, no further fact' can do the moral-responsibility-and-rebirth work its supposed to, rather than both sides just repeating 'no-self' at each other. Don't make either of them a pushover -- these were both serious positions, and I want to see them actually land punches on each other.
