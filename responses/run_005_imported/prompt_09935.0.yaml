  We are given a list of approaches to the infinite-aggregation problem in ethics, and we are to rank them in four buckets: "genuinely promising", "workable but seriously flawed", "doesn't really solve the problem", and "just changes the subject". The criteria are that the approach should dissolve the infinitarian paralysis while sacrificing as little as possible of ordinary ethical intuition (e.g., not violating Pareto arbitrarily, not being arbitrary about which chunk of the universe counts).

  Here is the list of approaches:

