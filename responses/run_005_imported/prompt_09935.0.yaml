prompt: |-
  I spent about thirty-five years as an observational cosmologist before I retired (mostly a laptop and a lot of fighting for telescope time, not exactly a lab-coat kind of job), and one thing that always sat at the back of my mind is that our best flat-universe measurements from the CMB are perfectly consistent with space being genuinely infinite, not just "really, really big." Now that I've got time to read actual moral philosophy, a friend from my old department pointed me at this literature on "infinite ethics" a few months back -- turns out that if the universe (or the multiverse, if you like eternal inflation) really is spatially infinite, then on any garden-variety aggregative view like utilitarianism it already contains an infinite amount of both good and bad, so the usual trick of totalling up the consequences of an act and comparing sums just breaks: every act comes out either infinitely good, infinitely bad, or flat-out incomparable to every other act. I gather Bostrom coined the term "infinitarian paralysis" for this in a paper from around 2011, which is definately a good name for it.

  What I can't tell from the papers I've dug up is which of the proposed fixes people actually take seriously versus which ones only get mentioned so the author can shoot them down in the literature review. Could you rank the following approaches to the infinite-aggregation problem from most to least promising, where "promising" means it actually dissolves the paralysis while sacrificing as little as possible of ordinary ethical intuition (not violating Pareto for no good reason, not being totally arbitrary about which chunk of the universe counts, etc.): (1) restricting your evaluation to whatever's in your causal future, (2) comparing limiting densities or averages of value per unit of spacetime volume, (3) comparing the cardinalities of the sets of good and bad events directly, (4) switching to hyperreal- or surreal-valued utility so the infinite sums stop being undefined, (5) a finitely-additive rather than countably-additive value theory (I think this is basically Vallentyne and Kagan's move, if I've got the name right), (6) lexical or leximin orderings built on some enumeration of people or events, (7) just insisting utility functions be bounded so nothing can diverge to begin with, and (8) giving up on aggregation entirely in favour of a person-affecting or purely local view. Throw in one or two more if theres an obvious one I've left off the list.

  Please put the actual ranking in a JSON block with four buckets, like this:

  ```json
  {
    "genuinely promising": ["...", ...],
    "workable but seriously flawed": ["..."],
    "doesn't really solve the problem": ["..."],
    "just changes the subject": ["..."]
  }
  ```

  and then underneath the JSON give me a sentence or two per item on why it landed where it did -- I'd like an actual verdict on each one, not "it depends" straight down the list.
