  So I've been reading up on Dutch book arguments in my retirement and I keep tripping over the difference between the 'synchronic' book, which forces your credences at a single moment to obey the probabilty axioms, and the 'diachronic' version that's supposed to force you to update by strict conditionalization over time. Something about the diachronic argument feels like a cheat to me though -- it seems like the bookie has to already know what your future credence will be in order to set the trap, which isn't really a fact about you being irrational so much as the bookie having weird foreknowledge. Can you unpack whats actually going on there, and tell me whether the diachronic dutch book really shows conditionalization is rationally mandatory, or if its a much shakier argument than the synchronic one?
