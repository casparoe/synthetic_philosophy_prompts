prompt: |-
  I'm about a third of the way into a historical novel set in 1650s-60s England, and one of my secondary characters is Thomas Hobbes with maybe 10% of the serial numbers filed off. Went down a total rabbit hole researching him and landed on his decades-long feud with John Wallis over mathematics -- the squaring-the-circle business -- which apparently even has its own book (Squaring the Circle, I think its called, by some historian of math, only about halfway through it). Now I'm planning a coffeehouse scene where my Hobbes-ish guy and a younger Wallis-ish rival really go at it, but every summary I find just says "Hobbes thought he'd squared the circle, he was wrong, everyone laughed at him," which is true but tells me nothing about what they were actually disagreeing about underneath. I don't want the scene to read like two guys arguing about nothing.

  So here's my actual question: can you compare how Hobbes and Wallis each thought about what geometry even is -- like, what a point or a line fundamentally is, whether it's okay to reason with indivisibles/infinitesimals the way Wallis does in his "arithmetic of infinites" stuff, versus Hobbes's insistence that everything in geometry has to cash out in terms of actual bodies moving around. I'm especially curious whether Hobbes's crazy confidence that he really had squared the circle follows naturally from that broader materialist picture of his (in which case he's sort of tragically consistent, which I could use), or whether it's basically separable from his "official" philosophy of geometry and he just refused to admit he'd been beaten. And given all that -- who do you think has the more defensible view of what geometry actually is, setting aside who was right about the specific proofs (which was Wallis, I gather, since Hobbes never did manage to loose that fight gracefully).

  Keep the explanation usable for fiction dialogue rather than a formal paper -- I just need the real shape of the disagreement so my characters sound like they're actually fighting about something that matters to them, not just posturing.
