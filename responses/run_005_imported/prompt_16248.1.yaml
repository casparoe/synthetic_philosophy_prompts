  Next, Greaves's taxonomy: simple cluelessness involves symmetric unforeseeable effects that cancel out, so we can focus on foreseeable impacts. Complex cluelessness involves asymmetric effects but with insufficient information to assign probabilities, making decisions difficult.

  The key question is whether Lenman's problem falls into simple or complex cluelessness in Greaves's framework. If it's simple, consequentialists can bracket it; if complex, the problem remains unsolved. 

