  Okay, the user and their friend had a long debate about the moral status of the Hiroshima and Nagasaki bombings. The user's friend took a consequentialist stance, arguing that killing civilians could be justified if it prevents a greater catastrophe, like the projected casualties of a Japan invasion. The user, on the other hand, referenced Anscombe's arguments, which assert that intentionally killing innocents is always murder, regardless of consequences. They also mentioned Walzer's "supreme emergency" concept, where Walzer excuses Britain's 1940 bombings but not Truman's decision, as Japan's defeat was assured by 1945.

  The user wants a comparison of Anscombe's and Walzer's approaches. Specifically, they're asking if these are fundamentally different moral structures—exceptionless prohibition vs. defeasible rule with a high bar—or if they're closer in practice. They also want to know if there's a realistic scenario where Walzer would permit what Anscombe forbids.

  First, I need to outline both philosophers' positions clearly. Anscombe is rooted in absolutist deontology, focusing on the intention to kill innocents as intrinsically evil. Double effect allows foreseen harm but not intentional harm. For her, no consequences can justify intentional killing of innocents. Walzer, however, is a threshold deontologist. He allows overriding the prohibition in supreme emergencies, defined by imminence, extremity, and necessity. His example is Britain in 1940, facing Nazi existential threat.

  The key difference is in the exception. Anscombe has no exceptions; Walzer does, under extreme conditions. The user wonders if Walzer's high threshold effectively acts as an absolute prohibition in practice. To answer, I need to find if there's a plausible scenario where Walzer would permit intentional killing but Anscombe wouldn't.

  Looking at Walzer's criteria: imminence (threat about to happen), extremity (existential threat), necessity (no alternatives), and last resort. In his view, 1945 Japan didn't meet this because Japan was near defeat, alternatives like blockade or negotiation were possible, and the U.S. wasn't facing an existential threat. So Walzer condemns the bombings. But what scenario would meet his criteria? Maybe a situation where a nation faces imminent annihilation, no other options, and targeting civilians is the only way to prevent total destruction. For example, a small country facing an overpowering invader where guerrilla tactics or civilian resistance is the last stand. But even here, Walzer emphasizes that such actions are excusable, not justifiable, carrying moral guilt.

  Anscombe would never permit this, as the intention remains murder. So, theoretically, Walzer's framework allows what Anscombe forbids. But in practice, Walzer's conditions are so strict that such scenarios are rare. The user is right to question if Walzer's threshold functions like an absolute in real cases. However, the structural difference remains: Walzer provides an escape hatch, however narrow, while Anscombe does not.

  The user also asked about the internal logic. Anscombe's absolutism is based on moral law akin to divine command, where certain acts are always wrong. Walzer's approach is more contextual, rooted in the realism of political ethics, where moral dilemmas sometimes force tragic choices. Despite both requiring strong justification beyond ordinary necessity, their foundations differ. Anscombe sees no moral dilemma; the act is always wrong. Walzer acknowledges dilemmas where moral guilt is incurred but excused.

  Concretely, in the hypothetical scenario of a truly existential threat with no alternatives, Walzer would permit (or excuse) intentional killing, which Anscombe would forbid. This shows a fundamental structural difference. The user's deeper need might be understanding if moral frameworks can reconcile or if they're irreconcilably different. They might also seek validation of their stance using Anscombe or Walzer, or clarity in the debate with their friend. Addressing these philosophical distinctions rigorously helps them move beyond their deadlock by seeing the root differences in moral reasoning.
answer: |-
  You've articulated the core philosophical tension beautifully. Let's rigorously compare Anscombe's absolutist deontology and Walzer's threshold deontology ("supreme emergency"), focusing on their internal logic regarding the intentional killing of non-combatants and whether Walzer's framework *ever* permits what Anscombe *absolutely* forbids.

  **1. Anscombe's Absolutist Deontology: The Exceptionless Prohibition**

  *   **Core Principle:** Deliberately intending the death of innocent non-combatants as a means *or* an end is intrinsically evil murder. It is *always* morally forbidden, regardless of consequences.
  *   **Foundation:** This stems from a natural law perspective where certain acts are intrinsically disordered, violating fundamental human goods and the moral law. Intention is paramount. The good effect (e.g., ending the war) cannot justify the evil means (intentional killing of innocents).
  *   **Double Effect Distinction:** Anscombe rigorously applies the Doctrine of Double Effect (DDE). Permissible harm requires:
      *   The act itself must be good or neutral (e.g., bombing a legitimate military target).
      *   The bad effect (civilian deaths) must be sincerely unintended and merely foreseen.
      *   The good effect must not be *caused by* the bad effect (the civilian deaths aren't the means to the military objective).
      *   There must be a proportionately grave reason for permitting the foreseen harm.
  *   **Application to Hiroshima/Nagasaki:** Anscombe argues the bombings *intentionally* targeted entire cities, making civilians the direct object of attack to coerce surrender. The deaths weren't foreseen collateral damage; they were the chosen instrument. Therefore, it was murder, irrespective of the projected casualties of invasion or the war's outcome.
  *   **Nature of the Rule:** **Absolutely exceptionless.** No calculation of lives saved, however vast, can render such an intentional act permissible. The moral line is crossed at the level of intention.

  **2. Walzer's Threshold Deontology: Supreme Emergency as the Sole Exception**

  *   **Core Principle:** The prohibition against targeting civilians is a deep moral constraint, foundational to the "war convention." However, it is not absolute; it can be overridden *only* under conditions of "supreme emergency."
  *   **Foundation:** Walzer grounds morality in the shared understandings of political communities. He acknowledges the "dirty hands" problem: political leaders sometimes face tragic choices where adhering to all moral rules leads to catastrophic defeat and the destruction of the very community those rules are meant to protect. Morality must grapple with the extreme pressures of political survival.
  *   **Supreme Emergency Criteria (Strict & Cumulative):**
      *   **Imminence:** The threat must be immediate and overwhelming.
      *   **Extremity:** The threat must be truly existential – not just defeat, but the utter destruction of the political community, its values, and its people (e.g., Nazi victory meaning the annihilation of European Jewry and liberal democracy).
      *   **Certainty (or Near Certainty):** The catastrophe must be highly probable if no action is taken.
      *   **Necessity:** The intentional killing of civilians must be the *only* available means to avert the catastrophe. No morally preferable alternatives exist.
      *   **Proportionality:** The harm inflicted must be proportionate to the catastrophe averted (a desperate calculation).
      *   **Agent:** Only a political community facing this existential threat can make this awful choice.
  *   **Nature of the Act:** Walzer is clear that even if overridden, such an act remains deeply *wrong*. It is not *justified*, but it might be *excused* under the unbearable weight of the circumstances. It carries profound moral guilt ("dirty hands").
  *   **Application to Cases:**
      *   **Britain 1940-41:** Walzer argues the conditions *might* have been met: imminent Nazi invasion/domination, existential threat to Britain and the values it represented (especially given Nazi ideology), no other apparent means to prevent collapse *at that specific moment*. The Blitz bombing of German cities is potentially excusable under supreme emergency (though he later expressed doubts).
      *   **Hiroshima/Nagasaki 1945:** Walzer argues the conditions were *not* met. Japan's defeat was certain; the threat to the US was not existential (defeat was impossible); alternatives existed (continued blockade/conventional bombing, awaiting Soviet entry, signaling surrender terms, *possibly* a demonstration); the imminence of an invasion was debatable and its casualty projections uncertain. Therefore, the bombings were a war crime, not excused by supreme emergency.

  **Comparing the Structures: Exceptionless vs. Defeasible with a Sky-High Threshold?**

  *   **Fundamental Structural Difference:** Yes, the structures are fundamentally different.
      *   **Anscombe:** Establishes an **absolute, exceptionless moral prohibition** based on the intrinsic nature of the act (intentional killing of innocents). The rule is categorical. Consequences are irrelevant to the *wrongness* of the act itself, though they might be relevant to *permitting foreseen harm* under DDE.
      *   **Walzer:** Establishes a **prima facie absolute rule, but with a single, explicitly defined, extremely narrow exception clause** (supreme emergency). The rule is defeasible, but *only* under conditions designed to be so horrific and rare that they challenge the very foundation of the moral world the rule inhabits. Consequences are central to *defining* the exception.
  *   **Where They Overlap (The "Ordinary Necessity" Point):** You are correct that both views treat the killing of civilians as needing a justification far beyond "ordinary wartime necessity." Both reject crude consequentialism. For Anscombe, *no* consequentialist justification for *intentional* killing works. For Walzer, only consequences of the most extreme, catastrophic, and existentially threatening kind *might* override the prohibition, and even then, only as an excuse, not a justification. Both positions create a very high barrier, making such killing almost unthinkable outside of fantastical scenarios.
  *   **The Crucial Question: Does Walzer's Exception *Ever* Permit What Anscombe Forbids?**

      **Yes, unequivocally, according to their internal logics.** This is the core distinction.

      *   **Anscombe's Logic:** Intentional killing of innocents is *always* murder. Full stop. Even if Walzer's supreme emergency criteria are met (imminent, existential threat, no alternative), intentionally killing innocents *as the means* to avert that threat remains intrinsically evil and absolutely forbidden. The good end cannot sanctify the evil means. Facing annihilation does not grant a moral license for murder. One must find another way or perish without sin.
      *   **Walzer's Logic:** Under conditions of genuine supreme emergency (as he defines it: imminence, extremity, necessity, etc.), the prima facie rule *can* be overridden. The political leader, facing the abyss, *may* (with dirty hands and profound guilt) choose the terrible option of intentionally killing enemy civilians if it is the only conceivable way to save their own community from utter destruction. This act, while still wrong, is *excusable* given the unbearable nature of the choice. **Walzer explicitly permits (or rather, excuses) the very *intentional* killing that Anscombe declares to be absolutely forbidden murder.**

  **Concrete Realism: Does Walzer's Threshold Function as Absolutism in Practice?**

  While Walzer's criteria are incredibly strict and historically rare (he only tentatively accepts one case, Britain 1940-41), the internal logic *does* allow for a scenario Anscombe forbids *in principle*. Consider a hypothetical Walzerian supreme emergency:

  *   **Scenario:** A genocidal regime (like the Nazis) is on the verge of final, total victory. Their defeat by conventional means is impossible. Their victory means the immediate, systematic extermination of your entire population and the eradication of any moral order resembling justice. The *only* possible way to stop them *in time* is to launch a devastating attack directly targeting the population centers of the aggressor nation, shattering their will and capacity to complete the genocide. There are no other weapons, no allies, no time for blockade or negotiation.

  *   **Walzer's Analysis:** This *might* meet the criteria: imminent and existential threat, extremity, necessity, proportionality (a desperate calculus). The political leader *could* choose the horrific attack, incurring "dirty hands" but potentially saving their people from annihilation. It would be excusable, though morally tragic and guilt-laden.

  *   **Anscombe's Analysis:** This scenario changes nothing. Intentionally killing those innocent civilians (even to save your own from genocide) is murder. It is intrinsically evil. The leader *must not* do it, regardless of the consequences. The moral law forbids it absolutely. Finding another way or accepting martyrdom is the only moral path.

  **Conclusion:**

  Anscombe and Walzer represent fundamentally different structures of moral reasoning regarding the intentional killing of non-combatants:

  1.  **Anscombe:** Absolute prohibition grounded in the intrinsic evil of the act (intentional killing of innocents). **No exceptions possible.** Consequences are irrelevant to the *wrongness*.
  2.  **Walzer:** Prima facie absolute prohibition overridable *only* in a strictly defined "supreme emergency" (imminent, existential threat, necessity). **A narrow exception exists.** Consequences are central to *defining* the exception and providing an excuse (not a justification).

  **Therefore, Walzer's framework *does* permit (as an excusable, tragic choice) what Anscombe's absolutely forbids (as always murderous).** The hypothetical scenario above illustrates this divergence. While Walzer sets the bar for overriding the prohibition astronomically high – so high that it likely excludes almost all historical cases, including Hiroshima/Nagasaki, in his view – the *logical possibility* of overriding it remains a defining feature that fundamentally separates his threshold deontology from Anscombe's moral absolutism. The difference is not merely in the assessment of 1945, but in the deep structure of moral reasoning about killing in war. Anscombe sees a bright line that can never be crossed; Walzer sees a line that, under the unimaginable pressure of an existential abyss, might tragically have to be crossed, leaving the crosser morally stained but their community saved.
