  **Justifications:**  
  1. **Norm-based accounts**: Best fit because they prioritize deviations from expected duties—the coworker's 👍 signaled acceptance of responsibility, making their inaction a normative breach others didn't commit.  
  2. **Contrastive accounts**: Strong but less direct; they highlight the coworker's omission by contrasting it with their implied action (via 👍), though they require contextual framing to outweigh other omissions.  
  3. **Counterfactual-dependence accounts**: Weak fit because they treat all omissions equally—if any observer had acted, the outage would've been prevented, diluting the coworker's unique role.  
  4. **Physical-process accounts**: Worst fit as they struggle with omissions (non-events) entirely, lacking a physical mechanism to tie the coworker's inaction to the outage over others'.
