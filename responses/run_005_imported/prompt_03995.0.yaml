prompt: |-
  Had a whole argument with my friend Mara last night, started from a work story she told me. A coworker of hers saw a slack message flagging that a server certificate was about to expire, reacted with a 👍, then got pulled into other stuff and never actually renewed it. Three weeks later it expired and took down checkout for six hours. Mara says the coworker not renewing it obviously caused the outage, same as if he'd unplugged the server himself. I said that's too quick -- a dozen other people saw the same message and also didn't renew it, whoever set the expiry warning for 3 weeks out instead of 3 days didn't do their job either, and technically the whole on-call rotation that week 'could have' caught it too. So either they're all equally causes, which seems nuts, or there's some principled reason the coworker is basically THE cause and the rest aren't -- and I don't know what that reason is. Mara thinks the 👍 counts as taking ownership; I think that's a fact about blame, not causation. We went in circles for an hour and its still bugging me.

  Turns out this is an actual known problem in the causation literature (something like a 'selection problem' for omissions), and there's a few rival strategies for handling it: counterfactual-dependence accounts, physical-process accounts, contrastive accounts, and norm-based accounts. Can you rank these four by how well they let you say the coworker -- and not everyone else who also didn't act -- caused the outage? Give me a JSON block like {"1": "<approach>", "2": "<approach>", "3": "<approach>", "4": "<approach>"}, where 1 is the best fit and 4 the worst, then justify each placement in 1-2 sentences.
reasoning: |-
  We are dealing with a problem of causation by omission: the coworker (and others) failed to renew the certificate, which led to an outage. The challenge is to explain why the coworker (who reacted with a thumbs-up) is singled out as the cause, while others (who also saw the message and did nothing) are not, and why other factors (like the warning being set too early) are not considered the primary cause.

  We have four approaches:

  1. Counterfactual-dependence accounts: An event A causes event B if, had A not occurred, B would not have occurred (or the probability would be significantly different). This is the classic "but for" test.

  2. Physical-process accounts: Causation is understood in terms of a physical process (like energy transfer or information flow) connecting the cause to the effect. Omissions (non-events) are tricky because there's no physical process.

  3. Contrastive accounts: Causation is relative to a contrast class. We ask "Why did B happen rather than some alternative?" and then look for a difference that made the difference. This often involves comparing what actually happened to a relevant alternative scenario.

  4. Norm-based accounts: Causation is determined in part by normative considerations (what should have happened, duties, norms, etc.). We focus on deviations from the norm.

  Now, we want to rank these by how well they let us say that the coworker (and not the others) caused the outage.

  **Reasoning:**

  - **Counterfactual-dependence**: For the coworker, we can say: "But for the coworker's omission (failing to renew after the thumbs-up), would the outage have occurred?" But note, if the coworker had renewed, the outage would have been prevented. However, the same counterfactual holds for every other person who saw the message and didn't act: if any one of them had renewed, the outage would have been prevented. So this approach would make every omission a cause. This doesn't single out the coworker. Thus, it's not the best for this purpose.

  - **Physical-process accounts**: Omissions are non-events. There's no physical process that we can point to for the coworker's inaction. How do we have a physical process for an omission? This account struggles with omissions in general. So it would be hard to say that the coworker (or anyone else) caused the outage by omission. This might be the worst.

  - **Contrastive accounts**: We can set up the contrast: Why did the outage occur in this scenario (where the coworker gave a thumbs-up and then didn't act) rather than in a scenario where the certificate was renewed? The key difference is that the coworker, by giving the thumbs-up, created an expectation of action. We might contrast the actual situation (thumbs-up and then nothing) with a situation where the coworker didn't give the thumbs-up (then someone else might have acted). This approach can pick out the coworker's omission as the salient one because of the context (the thumbs-up). It can also contrast the coworker with others: the others did not signal taking responsibility. So this can help.

  - **Norm-based accounts**: Here, we can appeal to norms. The coworker, by giving the thumbs-up, took on a duty (or at least created an expectation) to renew the certificate. The norm is that if you acknowledge a task (especially with a positive reaction), you are expected to follow through. The other observers had no such duty because they didn't signal ownership. Also, the person setting the warning too early might have violated a norm, but the immediate norm violation that led to the outage was the coworker's failure to act after acknowledging. This account naturally singles out the coworker because of the norm of responsibility-taking.

  **Ranking (from best to worst for singling out the coworker):**

  1. **Norm-based accounts**: Because they can directly appeal to the norm that the coworker, by giving the thumbs-up, took ownership and thus had a duty to act. The failure to fulfill that duty is the cause. The others had no such duty, so their omissions are not causes. This matches Mara's intuition.

  2. **Contrastive accounts**: By contrasting the actual situation (where the coworker acknowledged and then didn't act) with a scenario where he either didn't acknowledge (and someone else might have acted) or did act, we can highlight his omission as the key difference. This can also explain why the coworker is more salient than others.

  3. **Counterfactual-dependence accounts**: They would count every omission that could have prevented the outage as a cause. So the coworker is one cause among many (including the other observers, the on-call team, etc.). This does not single him out.

  4. **Physical-process accounts**: They have difficulty with omissions because there is no physical process for non-events. Thus, they might not even count omissions as causes. So they are the worst for this case.

  Therefore, the ranking is:

  1. Norm-based accounts
  2. Contrastive accounts
  3. Counterfactual-dependence accounts
  4. Physical-process accounts

