answer: |-
  You've pinpointed a crucial tension in Thomistic political thought and its reception within Catholic tradition. Your reading of Aquinas on the *theory* of tyranny is largely correct, but the tradition's practical caution stems from several key qualifications within Aquinas himself and subsequent developments:

  1.  **Aquinas's Critical Caveats (Where Your Reading Might Need Nuance):**
      *   **Not a License for Vigilantism:** Aquinas **explicitly rejects** private individuals assassinating a tyrant (*ST* II-II, Q.42, A.2; *De Regno* I, 6). He states this action must be undertaken by "public authority," not private judgment. He feared chaos, vendettas, and the potential for a worse tyrant emerging from anarchy. Killing a ruler, even a tyrant, is primarily framed as an act of *public justice*, not private rebellion.
      *   **The Danger of Greater Evil:** Aquinas emphasizes that if overthrowing a tyrant is likely to cause *even greater evils* (prolonged civil war, foreign invasion, societal collapse, replacement by a worse tyrant), then toleration might be the lesser evil (*De Regno* I, 6). Prudence dictates assessing the likely consequences.
      *   **Distinction between Usurper and Legitimate-but-Tyrannical Ruler:** Aquinas is clearer about the right to resist a *usurper* who seized power illegitimately (*ST* II-II, Q.42, A.2). Resistance to a ruler who *became* tyrannical after legitimate accession is treated with far greater caution, emphasizing the need for public authority to act.
      *   **Proportionality:** The remedy must be proportionate. Aquinas generally favored non-violent means first (admonition, appeal to higher authority like the Pope or Emperor if applicable). Violent removal is a last resort.

  2.  **Broader Catholic Tradition's Emphasis on Order and Authority:**
      *   **Romans 13:1-7:** "Let every person be subject to the governing authorities... for there is no authority except from God." This Pauline text was foundational. While Aquinas interpreted it as implying authority *rightly used* (for the common good), the surface reading strongly emphasized obedience and the divine origin of *all* authority, creating a powerful counterweight.
      *   **Fear of Anarchy:** The historical experience of rebellion, civil war, and the breakdown of order was often horrific. The Church, as an institution deeply invested in social stability for its mission and the well-being of souls, prioritized avoiding chaos, which was seen as a greater threat than many tyrannies. The "devil you know" argument held significant weight.
      *   **Practical Difficulty of Discernment:** Who definitively determines when a ruler has crossed the line from poor governance into true tyranny justifying lethal removal? The Church was wary of becoming the arbiter of every political dispute and unleashing forces of rebellion based on subjective judgments or partisan interests masquerading as concern for the common good.
      *   **Potential for Abuse:** Endorsing tyrannicide could easily be exploited by ambitious rivals, foreign powers, or ideological factions to justify assassinations for their own gain, destabilizing legitimate (if imperfect) orders. The Church sought to prevent this slippery slope.
      *   **Development of Doctrine (Post-Aquinas):** Later theologians and canonists (like Francisco Suárez and Robert Bellarmine in the Jesuit tradition) further developed the "indirect power" of the Pope over temporal rulers *in spiritual matters* and for *grave moral reasons*, but remained extremely cautious about endorsing popular rebellion or assassination. The focus shifted towards mechanisms like deposition by a higher authority (e.g., the Pope deposing a heretical king) rather than tyrannicide by subjects.

  **Why the Tradition Seems "Inconsistent" with Aquinas's Premises:**

  1.  **Aquinas Provided the Theoretical *Possibility*, Not a Practical Blueprint:** He established that tyranny destroys legitimacy *in principle* and that removal isn't intrinsically murder. However, the *practical application* of this principle is heavily constrained by the caveats above. The tradition consistently emphasized the constraints over the permissibility.
  2.  **Prioritizing Prudence and Order:** The broader tradition often prioritized the practical goods of peace, order, and the avoidance of greater evils (anarchy, worse tyranny) over the theoretical right of removal, even when tyranny was evident. Aquinas's caveat about the danger of greater evil became the dominant practical consideration.
  3.  **The "Public Authority" Problem:** Identifying who constitutes legitimate "public authority" capable of justly removing a tyrant, especially in hereditary monarchies or complex feudal systems, was often practically impossible without triggering civil war. This made Aquinas's preferred path frequently unviable.
  4.  **Distrust of Popular Rebellion:** The Catholic tradition, reflecting its medieval and early modern context, was deeply skeptical of popular sovereignty and mass rebellion. It preferred established hierarchies and authorities. Removing a tyrant "by public authority" usually implied action by nobles, estates, or the Church, not a popular uprising – and even then, it was fraught.

  **Conclusion:**

  Your reading isn't fundamentally "wrong" on Aquinas's core principle: a ruler governing solely for private gain *does* forfeit legitimacy, and removing such a ruler isn't murder *if done justly*. **The "inconsistency" arises because the Catholic tradition, drawing heavily on Aquinas's *own* qualifications and broader theological principles (like Romans 13), consistently emphasized the extreme dangers, practical difficulties, and stringent conditions surrounding tyrannicide.** They focused on:

  *   The primacy of avoiding greater evils (anarchy).
  *   The rejection of vigilantism and private judgment.
  *   The immense challenge of identifying legitimate "public authority" to act.
  *   The preference for non-violent means and toleration as the lesser evil.

  Aquinas provided a radical *theoretical limit* on political obligation but embedded it within a deeply *conservative practical framework* prioritizing order and fearing chaos. The broader tradition amplified this caution, making outright endorsement of tyrannicide exceptionally rare in practice, even when rulers were widely deemed tyrannical. The tension exists because Aquinas balanced a revolutionary principle with a profoundly cautious methodology, and the tradition leaned heavily into the caution.
