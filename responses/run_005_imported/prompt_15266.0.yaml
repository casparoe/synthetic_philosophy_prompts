  Okay, the user is a PhD student in political theory preparing a eulogy for their dissertation supervisor, Helen Aldrich. Helen specialized in Rawls' public reason theory—how citizens with different beliefs can agree on shared political principles. She was also deeply religious but strictly separated her faith from her arguments. The eulogy needs to balance her faith and scholarship without imposing her beliefs on others. 

  First, I need to understand the audience split: her congregation who knew her as a faithful member and political theorists critical of her work. The challenge is making her faith feel genuine without using it as an argument, while avoiding sounding like a lecture. 

  Helen’s key principle was not using her faith to bind others' reasoning. So, in the eulogy, I should show how her faith sustained her personally but never present it as a universal reason. For the congregation, it must resonate as a sincere tribute to her devotion, not an academic talk. 

  I’ll start with personal anecdotes to humanize her—like her humming hymns during office hours. This bridges both audiences by showing her multifaceted life. Then, I’ll explain her scholarly work in simple terms, linking it to her integrity: she practiced what she preached by keeping faith personal in public discourse. 

  For the faith aspect, I’ll use her own phrases ("sustained by hope") to reflect her voice without proselytizing. Highlighting her actions—serving at the shelter—demonstrates her commitment without philosophizing. 

  The theorists need to hear her distinction between personal conviction and public reason upheld. I’ll explicitly mention her refusal to argue from faith, framing it as intellectual rigor and deep respect for others. 

  Ending with gratitude from both perspectives ties it together. The congregation hears she was a woman of faith; theorists see her consistency. Closing on shared love avoids division. 

  Potential pitfalls: Over-explaining Rawls might lose the congregation; oversimplifying might offend theorists. Balancing anecdotes with concise theory is key. Also, ensuring "sustained by hope" feels authentic, not performative. 

  Finally, timing—5 minutes means tight editing. Each story must serve dual purposes: illustrating her character and principles. The humming detail, for example, shows her faith’s quiet presence in academia, acceptable to both audiences.
answer: |-
  ## For Helen: A Life Held in Tension, a Heart Held by Grace

  [Standing at the pulpit, facing the congregation and the contingent of academics]  

  Good morning. For those who don’t know me, my name is [Your Name], and I had the profound privilege of being Helen Aldrich’s final doctoral student. To her dear friends and family here at St. Luke’s, who knew her as Helen the faithful, the constant, the quiet presence in the third pew – and to my colleagues in political theory, who knew her as Professor Aldrich, a formidable mind wrestling with the deepest questions of how we live together… we are united today by grief, and by gratitude, for the same remarkable woman.

  Helen lived in a beautiful, deliberate tension. Many of you here knew the bedrock of her life: her deep, abiding faith. Sunday mornings weren't appointments in her calendar; they were anchors in her soul. The hymns we sing today, the prayers we offer, the quiet moments of communion – these weren’t rituals to Helen, they were lifelines. They sustained her. She found profound peace, profound *strength*, within these walls and within the quiet certainty of her belief. She would speak, simply and without fanfare, of being "held," of being "sustained by hope," of finding a "deep wellspring" in her relationship with God. It was as real to her as the air she breathed, the ground beneath her feet. It shaped her kindness, her patience, her unwavering commitment to serving this community – whether arranging flowers, visiting the sick, or quietly ensuring the shelter had enough volunteers. Her faith wasn't abstract; it was lived, here, among you.

  [Turning slightly towards the academics]  

  And yet, Helen spent her professional life exploring a different kind of common ground. Her scholarship focused on the work of John Rawls and the idea of "public reason." She wrestled with a fundamental question: In a society filled with people holding vastly different, deeply held beliefs – religious, secular, philosophical – how can we agree on the basic rules that govern us all? How do we find shared political principles, not by demanding everyone abandon their deepest convictions, but by finding where those convictions, surprisingly, might *overlap*? Her answer, meticulously argued through decades of work, was that we reason together using ideas accessible to all citizens, not arguments rooted solely in one particular faith or comprehensive worldview. It demanded a kind of restraint, a discipline of discourse.

  Here’s the extraordinary thing about Helen: she didn’t just write about this idea; she lived it, with an integrity that bordered on the austere. She held herself to a stricter version of her own theory than perhaps anyone I’ve ever known. She *never* hid her faith. She would tell you plainly, if asked, that it was her rock, her compass, the source of her endurance. But… she *refused* to argue *from* it. She would never say, "You must accept this policy *because* my faith tells me it's right." That, to Helen, was the very move her scholarship cautioned against – a move that could exclude, that could fail to respect the equal standing of fellow citizens holding different beliefs. For Helen, her deep, personal conviction and the language of public discourse occupied distinct spaces, each vital, each demanding its own respect.

  This wasn’t compartmentalization. It wasn’t hiding part of herself. It was, instead, an act of profound *fidelity* – fidelity both to the God she worshipped with such quiet devotion, and fidelity to the demanding ideal of a truly inclusive public square she dedicated her intellect to understanding. She believed her faith called her to serve justice and love her neighbor, *and* she believed serving justice effectively in a pluralistic society required finding reasons her neighbors, regardless of their own creeds, could potentially share. It was a discipline born not of doubt in her own beliefs, but of deep respect for yours.

  So today, we remember Helen the scholar, whose sharp mind illuminated the difficult path towards shared political understanding. And we remember Helen the woman of faith, whose quiet strength and deep compassion flowed directly from the wellspring she found here. She showed us that holding deep conviction and practicing intellectual restraint aren’t contradictions; they can be the marks of a profound integrity. She showed us that one can be sustained by a very particular grace, *and* fiercely committed to building a world where many different kinds of grace, and reason, can find a common home.

  Her congregation knew her steadfast heart. Her colleagues knew her rigorous mind. Both were essential parts of the whole. Both were fueled by the same deep well of conviction and care.

  Helen, we will miss your wisdom, your quiet strength, your unwavering presence. We are grateful for the life you lived – a life held beautifully in tension, a heart held securely by grace. May we carry forward both your commitment to genuine understanding and your example of quiet, sustaining faith. Rest in peace, dear teacher, dear friend. Amen.
