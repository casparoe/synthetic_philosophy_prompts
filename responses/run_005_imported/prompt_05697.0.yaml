  ## The Unyielding Automaton: Defending the Radical Reading of Descartes on Animals

  The enduring image of Descartes as the philosopher who reduced animals to mere "beast-machines," devoid of any inner life whatsoever, remains potent. Yet, a nuanced counter-reading persists: perhaps Descartes denied animals only *cogitatio* (thought, reason, self-awareness), while allowing that they mechanically undergo *something* analogous to sensation or feeling, devoid of conscious experience. While this interpretation seeks to soften the harshness of Descartes's view, a close examination of his criteria for withholding reason and his correspondence reveals that his considered position is, indeed, the radical one: animals are insensate automata, lacking not just thought, but *any* form of conscious feeling or sentience. Sensation, for Descartes, is inextricably bound to *cogitatio*.

  **The Discursive Framework: Absence of Mind, Absence of Sensation**

  In Part V of the *Discourse on Method*, Descartes offers two key criteria for distinguishing humans (possessing minds) from animals (mere machines):

  1.  **Linguistic Flexibility:** Humans can arrange words to express novel thoughts and respond appropriately to any circumstance. Animals, however, exhibit only fixed responses to specific stimuli. Even the most complex animal behaviors (like parrots mimicking speech or magpies chattering) are, for Descartes, purely mechanical reactions triggered by bodily dispositions, akin to a clock chiming. They lack the *understanding* signified by true language.
  2.  **Adaptive Response:** Humans can adapt their behavior creatively to entirely new situations, demonstrating reason. Animals, conversely, perform excellently only within their specific, instinctual domains. When faced with novelty, they fail or act inappropriately, revealing the absence of an adaptable mind.

  Crucially, Descartes explicitly links the *absence* of thought (*cogitatio*) demonstrated by these criteria to the *absence* of true sensation and feeling. He argues that if animals possessed thought, they would demonstrate it through language or adaptability. Since they do not, "we must... conclude... that [animals] have no intelligence at all, and that it is nature which acts in them according to the disposition of their organs, just as a clock, which is composed only of wheels and weights, can count the hours and measure time more accurately than we can with all our art." This "nature acting" explicitly includes behaviors we associate with sensation: "if there were such machines having the organs and appearance of a monkey or some other irrational animal, we would have no way of knowing that they were not of the same nature as these animals." The implication is clear: the monkey's cry when hurt is no more indicative of *felt pain* than the clock's chime is indicative of *knowing* the time. Both are purely mechanical outputs.

  **Correspondence: Closing the Door on Sentience**

  The correspondence with Henry More (1649) and the Marquess of Newcastle (1646) provides even less ambiguity, decisively shutting down the "mechanical sensation" interpretation.

  1.  **To Henry More (Feb 5, 1649):** More presses Descartes on animal suffering. Descartes's reply is unequivocal: "**I do not explain the feeling of pain without reference to the soul.** For in my view pain exists only in the understanding. What I do explain is all the external movements which accompany this feeling in us; in animals it is these movements alone which occur, and not pain in the strict sense." He reinforces this by stating that attributing a soul (and thus sensation) to animals is a primary error leading to superstition. His mechanistic explanation of animal reactions to harmful stimuli is offered *as an alternative to* attributing feeling, not as an account *of* a lesser form of feeling. He flatly denies animals possess the "thought" (*cogitatio*) that constitutes consciousness: "**I deny thought to [animals], which you alone accord to them.**"
  2.  **To the Marquess of Newcastle (Nov 23, 1646):** Responding to Newcastle's suggestions about animal passions and communication, Descartes concedes that animals have bodily organs analogous to ours, capable of being affected physically. However, he draws a sharp line: "**My opinion is not so much cruel to animals as indulgent to men... since it absolves them from the suspicion of crime when they eat or kill animals.**" He explicitly contrasts the "**movements which occur in the brain of an animal**" with the "**passions which are in the soul**" of a human. He allows that animals have "**natural impulses of fear, hope, and joy**" but clarifies that these are *not* felt passions: "**without any thought**." The key point is his explanation of pain avoidance: "**When an animal avoids things that are harmful to it, that is not because it knows they are harmful... it is the organs which are so formed that mechanically... the animal is moved to flee.**" There is no room here for a *feeling* of harm; only mechanical reaction.

  **Adjudication: Why the Radical Reading Prevails**

  The textual evidence overwhelmingly supports the traditional "unfeeling automata" interpretation:

  1.  **Sensation Requires *Cogitatio*:** Descartes consistently defines sensation not as raw neural input, but as a *mode of thought*. Pain "exists only in the understanding." Sensory perception (*sentire*) is listed alongside doubt, understanding, affirmation, denial, willing, imagining, and feeling (*sentire* again for emotions) as a form of *cogitatio* (Meditation II). To lack *cogitatio* is therefore to lack the conscious dimension of sensation. The mechanical processes in an animal's body and brain are necessary *causes* of sensation *in a mind*, but without a mind, they remain mere physical events, devoid of qualitative feel.
  2.  **Explicit Denials:** Descartes repeatedly and explicitly denies feeling (*sentire*) and thought (*cogitatio*) to animals in his correspondence. He frames his position as *denying* what others attribute to them, specifically including sensation. His mechanistic explanations are offered *instead of* attributing sentience.
  3.  **The Ethical Stakes:** Descartes himself highlights the ethical implication: his view absolves humans of cruelty *because animals do not feel pain*. If animals underwent even a mechanical analogue of feeling, this justification would collapse. His assertion that his view is "indulgent to men" only makes sense if animals truly lack sentience.
  4.  **No Conceptual Space:** Descartes's strict dualism offers no ontological category for "mechanical feeling." There is extended substance (body, governed by mechanics) and thinking substance (mind, characterized by *cogitatio*). Sensation, as a conscious phenomenon, belongs entirely to the latter. The physical processes in an animal are pure extension; they lack the thinking component necessary for consciousness. The "narrower reading" attempts to insert a third category (mechanical sentience) that Descartes's system explicitly rejects.

  **Conclusion**

  While the "narrower reading" arises from a desire to mitigate the harshness of Descartes's conclusion and perhaps find ambiguity in his mechanistic language, it cannot withstand scrutiny of his explicit definitions and arguments. The criteria in the *Discourse* link the absence of reason to the absence of mind, explicitly extending this absence to encompass sensation. The letters to More and Newcastle leave no room for doubt: Descartes unequivocally denies animals possess *cogitatio* in any form, and he explicitly identifies *cogitatio* as the necessary condition for sentience – for the conscious experience of pain, fear, joy, or any sensation. The mechanical processes he describes in animals are presented not as the substrate of a diminished form of feeling, but as a complete *alternative explanation* that renders any appeal to animal consciousness superfluous and erroneous. Therefore, Descartes's considered view is the radical one: animals are complex, reactive machines, devoid of any inner light of awareness. They are unfeeling automata.
