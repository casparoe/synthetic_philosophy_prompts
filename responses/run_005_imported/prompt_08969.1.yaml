answer: |-
  Here's a nuanced backstory for General Ibarra designed specifically to create Thomistic ambiguity, followed by the breakdown of Aquinas's criteria at play:

  **General Ibarra's Ambiguous Rise & Rule: A Sketch**

  1.  **The Crisis & The "Intervention" (Year Zero):** The country, "Republica de Santa Clara," is in deep crisis. A weak, deeply corrupt, and ideologically paralyzed civilian government (perhaps a fragile coalition) faces simultaneous threats: a potent Marxist insurgency controlling significant territory, hyperinflation, and widespread civil unrest bordering on anarchy. The constitutionally elected President, while technically legitimate, is widely seen as incompetent and possibly colluding with drug cartels to fund his crumbling regime. The military High Command is fractured. **General Ibarra, then a respected mid-ranking officer known for battlefield success against the insurgents and personal austerity (contrasting with the corrupt elite), stages a coup.** Crucially, he does *not* immediately declare himself President. Instead, he forms a **"Junta of National Salvation and Reconstruction"** with two other senior officers (one later conveniently exiled, the other killed in a suspicious accident). The Junta suspends the constitution *"temporarily,"* citing the "total collapse of constitutional order and imminent communist takeover."

  2.  **The "Legitimizing" Referendum (Year 1):** After 12 months of brutal but effective Junta rule (crushing the insurgency's main strongholds, stabilizing the currency through harsh measures), Ibarra engineers a transition. A new constitution is drafted by a handpicked commission (including some respected but pliable jurists and business leaders). It centralizes power immensely in the Executive (now the President), weakens the legislature to a consultative body, and grants the military vast autonomous powers. A **national referendum** is held to approve this new constitution. Voting occurs under martial law, with heavy military presence at polling stations. Opposition figures are harassed or imprisoned. State media runs relentless propaganda equating a "Yes" vote with stability and a "No" vote with a return to communist chaos. Unsurprisingly, the constitution passes with an implausibly high majority. Ibarra is "elected" President under this new constitution in a simultaneous, uncontested vote. **Thomistic Ambiguity Point:** Was this a *true* expression of the "will of the people" (consent of the governed) granting legitimacy, or a coerced farade under duress, making it an act of usurpation?

  3.  **The Gradual Descent (Years 2-10):** For the first few years, Ibarra rules *relatively* moderately under the new authoritarian constitution. The economy stabilizes further, major infrastructure projects begin, and the insurgency is largely contained (though human rights abuses by the military are rampant and systematic). He maintains a facade of legality, ruling through presidential decrees authorized by the new constitution. However, over time:
      *   **Erosion of the Facade:** The rubber-stamp legislature is sidelined completely. Courts are packed with loyalists. Independent media is systematically shut down or bought by regime cronies.
      *   **Personality Cult & Corruption:** Ibarra's image becomes omnipresent. Vast state resources are funneled to his family and inner circle. The "national reconstruction" projects become patronage machines for loyalists.
      *   **Targeted Repression:** Initial broad repression against insurgents morphs into targeting *any* dissent – student leaders, union organizers, critical intellectuals, even moderate clergy. Secret police (run by Ibarra's brother-in-law) operate with impunity, using torture and disappearances.
      *   **The Constitution as a Tool:** The very constitution Ibarra "legitimized" himself with becomes the primary legal tool for his tyranny. Its emergency provisions are made permanent. Amendments further concentrate power. Opposition is "illegal" under its draconian terms. **Thomistic Ambiguity Point:** Did Ibarra *become* a tyrant *after* achieving legitimate authority via the referendum/constitution? Or was the initial act (the coup and subsequent "referendum") *itself* a usurpation, meaning he never held legitimate authority in the first place? His rule uses the *forms* of the law he created, but perverts their substance.

  **Aquinas's Criteria & Where Ibarra's Case Creates Ambiguity:**

  Osvaldo's internal debate would hinge on applying these specific Thomistic principles to the muddy history:

  1.  **"Title to Rule" (Summa Theologiae II-II, Q.42, A.2; De Regno Ch.1):**
      *   *Usurper:* Gains power by pure force/fraud, with no pretense of right. No legal or customary claim.
      *   *Legitimate Ruler Turned Tyrant:* Initially gains power through a just title (election, inheritance, lawful succession).
      *   **Ibarra's Ambiguity:** His initial seizure was pure force (coup). **BUT**... he didn't immediately claim the highest title; he invoked a "state of necessity" and then sought (however questionably) popular ratification via referendum under a new legal framework. Does exploiting a crisis and then manufacturing consent *after* the seizure create a valid title, or is it just sophisticated usurpation? Aquinas emphasizes *just* titles – was this title "just" given the circumstances of its acquisition?

  2.  **Consent of the Governed / Common Good as Origin of Authority (ST I-II, Q.90, A.3; De Regno Ch.1):** Authority exists for the common good and derives *from* the community.
      *   *Usurper:* Never has the community's consent; rule is purely imposed.
      *   *Legitimate Ruler Turned Tyrant:* Initially has consent for the common good, but later subverts it to private advantage.
      *   **Ibarra's Ambiguity:** The referendum *appears* to be an act of consent. **BUT**... was it freely given under the shadow of martial law and repression? Did the "common good" argument used for the coup/referendum (saving the state from chaos) justify the means and the subsequent structure, even if some stability resulted? Did the *initial* actions genuinely serve the common good (crushing the insurgency), making the early rule arguably legitimate *before* the full tyranny emerged? Or was the "common good" always just a pretext for Ibarra's ambition?

  3.  **The Nature of the Tyrant's Actions (ST II-II, Q.42, A.2; Q.104, A.6; De Regno Ch. 3, 5-7):**
      *   *Usurper:* By definition rules unjustly; his *very presence* in power is the injustice.
      *   *Legitimate Ruler Turned Tyrant:* Rules justly initially, but later imposes laws/actions that are unjust, serving private advantage over the common good.
      *   **Ibarra's Ambiguity:** From Day 1 of the coup, the Junta ruled with brutal repression – is that the *inherent* injustice of usurpation, or the *initial* just rule of a savior using necessary harshness? Does the *later* codification of tyranny through the constitution he "legitimized" mean the injustice stems from the *use* of authority, not its *origin*? Aquinas condemns rulers who make laws solely for their own benefit – Ibarra's entire legal structure arguably does this. But was the structure *inherently* tyrannical from the moment of the referendum, or did it *become* so through his later actions and amendments? When exactly did the "turning" happen?

  4.  **The "Public Authority" Requirement for Removal (ST II-II, Q.42, A.2; Q.104, A.6; De Regno Ch. 6):** This is the crux for Osvaldo.
      *   *Usurper:* Can be resisted like a brigand by private persons (as there is no higher *legitimate* public authority to appeal to, and he *is* the brigand).
      *   *Legitimate Ruler Turned Tyrant:* Removal must be by "public authority" – either a superior (like the Pope over a king, rarely applicable), or by the community itself acting *as a whole* through established mechanisms (e.g., impeachment, declaration by estates), *not* by private individuals. Aquinas fears the precedent and chaos of private assassination.
      *   **Ibarra's Ambiguity:**
          *   **Pro-Usurper Argument:** Ibarra *never* legitimately held authority. The coup was usurpation. The referendum was a sham, devoid of true consent, thus no legitimate title was ever conferred. He is *still* just a violent brigand holding power. Therefore, any citizen can licitly resist him, including by force (assassination), as there is no higher *legitimate* public authority left to appeal to – he destroyed it all.
          *   **Pro-Legitimate-Ruler-Turned-Tyrant Argument:** However flawed, the referendum *was* an act of the community attempting to establish a new order. Ibarra became President under a constitution (however bad) that the populace ostensibly approved. He held legitimate authority *under that framework* for some time, arguably serving the common good initially. His subsequent tyranny is a *degeneration* of that authority. Therefore, removal *must* be by some remnant of "public authority" – perhaps a constitutional court he packed (useless), or the rump legislature (powerless), or ultimately by the *community as a whole* rising up (a popular revolution), *not* by a private conspiracy with a knife. Assassination is forbidden; only a public act of deposition is permissible, however unlikely. Aquinas's fear of anarchy applies.

  **Osvaldo's Crisis:**

  Osvaldo's torment stems from the fact that **both arguments have strong Thomistic grounding applied to Ibarra's specific history.** It's not vague; it's genuinely paradoxical under Aquinas's framework:

  *   If he focuses on the **origins** (the coup, the coerced referendum), Ibarra looks like a usurper. Killable.
  *   If he focuses on the **form** (the constitution, the office held, the initial years of relative stability), Ibarra looks like a legitimate ruler who degenerated. Not killable by private individuals.
  *   Aquinas provides no clear mechanism to resolve *which* framework applies when the origin is a violent seizure *followed by* a highly questionable but not entirely fictitious act of public ratification, *followed by* a gradual descent into tyranny using the very structures "ratified."

  **Writing the Debate:**

  Have Osvaldo articulate *both* sides clearly, citing Aquinas directly:

  1.  **The Usurper Argument:** "Fathers, he came in the night with guns! He tore up the true constitution! That referendum was held at gunpoint – ballots counted by his thugs! What 'title' does force and fraud confer? None! He is no different from the bandit on the road. Aquinas is clear: *'He who usurps the power by violence does not truly become lord or master.'* (De Regno). We *are* the community resisting a robber. The knife *is* licit!"
  2.  **The Legitimate-Ruler-Turned-Tyrant Argument:** "But he *didn't* immediately crown himself king! He formed a Junta, citing the common good in extremis. However flawed, the people *did* vote. He rules under *a* constitution, however perverted. For years, he *did* restore order. His tyranny grew *within* that structure. Aquinas warns us: *'If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power.'* (ST II-II, Q.104, A.6). But note: *'by that same multitude'* – *not* by us alone in this room! We are not the 'public authority.' To strike him down privately invites chaos worse than his rule! We must rouse the *whole people* or find a lawful path, however impossible it seems!"
  3.  **The Core Tension:** Osvaldo should wrestle with the **weight of the referendum** (was it *utterly* void, or did it confer *some* legitimacy, however tainted?) and the **point of degeneration** (was the tyranny inherent in the coup, or did it truly emerge later?). He might agonize: "Did he *become* a tyrant, or was he *always* one disguised as a savior? Aquinas gives us two doors, but Ibarra stands in the threshold of both!"

  This ambiguity makes Osvaldo's dilemma profound and authentically Thomistic. It forces him to confront not just the facts of Ibarra's rule, but the very nature of legitimacy, consent, and the terrifying responsibility of resisting evil within a framework designed for order. Your housemate is wrong – getting this right gives Osvaldo's crisis intellectual and moral weight that will resonate, even if readers don't know Aquinas. It shows the *real* cost of the decision. Good luck!
