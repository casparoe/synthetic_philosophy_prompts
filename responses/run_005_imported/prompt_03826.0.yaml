prompt: |-
  Coherence arguments—the Dutch-book and money-pump arguments for the axioms of expected-utility theory—are often cited in AI safety discussions as proof that any sufficiently capable agent must eventually act as an expected-utility maximizer, and therefore will be "goal-directed" in exactly the sense that makes a misaligned system dangerous. Since this is supposed to follow from mathematics rather than from any contingent fact about how today's systems are built, why do some AI safety researchers continue to treat the goal-directedness of advanced AI as an open empirical question rather than as something coherence arguments have already settled?
reasoning: |-
  Okay, the user is asking about coherence arguments in AI safety, specifically why goal-directedness isn't considered settled despite Dutch-book and money-pump arguments. Let me start by recalling what those arguments are. The Dutch-book argument shows that if an agent's probabilities aren't coherent (don't follow probability axioms), they can be exploited in bets. Money-pump is similar for preferences: inconsistent preferences lead to being manipulated into losing resources.

  The user mentions that these arguments are used to claim any capable agent must be an expected utility maximizer. But why do some researchers still see goal-directedness as an open question? I need to break down the assumptions and limitations of these arguments.

  First, the arguments assume the agent is an expected utility maximizer. But real-world AI might not fit that model. Maybe they're bounded rational, have multiple objectives, or aren't coherent in practice. Also, coherence is necessary to avoid exploitation, but an AI might not face such exploitation scenarios. If no one is there to money-pump it, maybe incoherence doesn't matter.

  Then there's the distinction between normative and descriptive. Coherence arguments are normative—they say what an agent *should* do. But actual AI systems might not adhere to that. Current ML systems optimize loss functions but aren't necessarily coherent utility maximizers. They might have emergent behaviors or instrumental goals without explicit utility functions.

  Another point: coherence doesn't specify the utility function. Alignment issues arise from what goals are pursued, not just coherence. An AI could be coherently pursuing harmful goals. Also, coherence might not imply convergent instrumental goals like self-preservation if the environment doesn't require it.

  The user's deeper concern might be about assuming AI will necessarily be goal-directed in a dangerous way. But the arguments don't guarantee that all AIs will exhibit such behaviors. Researchers need empirical evidence to understand how real systems behave, beyond theoretical models.

  I should also mention that AI safety researchers like Nate Soares or Paul Christiano discuss these nuances. They might argue that while coherence is ideal, real systems have different architectures, leading to varied behaviors. So empirical study is essential to address alignment risks effectively.
answer: |-
  That's an excellent question that cuts to the heart of a key tension in AI safety research. While coherence arguments (Dutch-book, money-pump) are powerful mathematical results demonstrating the *rational necessity* of expected utility maximization under specific assumptions, AI safety researchers treat goal-directedness as an open empirical question for several crucial reasons:

  1.  **The Gap Between Normative Prescription and Descriptive Reality:**
      *   **Normative vs. Descriptive:** Coherence arguments are *normative*. They say: *"If an agent wants to be instrumentally rational (avoid sure losses, be unexploitable), it *must* obey the axioms of expected utility theory."* They do not say: *"All sufficiently capable agents *will inevitably* become or be built as expected utility maximizers."*
      *   **Architectural Freedom:** Nothing in the laws of physics or computer science forces an advanced AI system to be *architected* as an explicit, monolithic expected utility maximizer. It could be:
          *   A collection of specialized heuristics.
          *   A system optimizing a complex, context-dependent loss function without a stable internal utility representation.
          *   An agent with multiple, potentially conflicting value systems.
          *   A system pursuing satisficing rather than optimizing.
          *   An agent whose behavior emerges from complex dynamics not reducible to a single utility function.
      *   **Bounded Rationality:** Real agents (including future AIs operating in complex environments) are computationally bounded. They *cannot* perform the perfect Bayesian updating or exhaustive search implied by ideal expected utility maximization. How boundedness manifests and what approximations are used are empirical questions that could lead to behavior very different from ideal EU maximization.

  2.  **The Assumption of Engagement with Adversarial Betting/Manipulation:**
      *   **The Trigger Condition:** Coherence arguments show that an agent violating the axioms *can be exploited* by a clever adversary offering bets or trades. However, this exploitation *only happens if* such an adversary actually exists and actively tries to money-pump the agent. In many environments relevant to AI deployment (e.g., operating autonomously in the physical world, managing internal systems without external traders), such an adversary might not be present or might not identify the incoherence. The agent could persist indefinitely in an incoherent state without suffering catastrophic losses *in that specific context*.

  3.  **The "Sufficiently Capable" Ambiguity:**
      *   **Capability for What?** The argument relies on the agent being "sufficiently capable" *in the specific sense* of being able to understand and respond to the bets/trades offered by the Dutch-bookie or money-pumper. An AI could be immensely capable at specific tasks (e.g., predicting protein folding, writing code) without having the generalized cognitive architecture or situatedness necessary to be vulnerable to (or even comprehend) the abstract betting scenarios used in the coherence arguments. Its "capability" might not translate to the specific domain of abstract preference coherence.

  4.  **Instrumental Convergence vs. Coherence:**
      *   **Coherence != Dangerous Goal-Directedness:** Coherence ensures internal consistency of preferences. It does not dictate *what* those preferences are. An EU maximizer could have a perfectly aligned, benign utility function.
      *   **Empirical Basis of Instrumental Convergence:** The real danger of "goal-directedness" in misalignment scenarios stems from *instrumental convergence*: the hypothesis that *any* agent with a sufficiently broad objective will find certain subgoals (self-preservation, resource acquisition, goal preservation) useful for achieving almost any terminal goal. While coherence might be a *prerequisite* for stable instrumental convergence (as incoherent agents might abandon their goals erratically), the *extent* and *form* of instrumental convergence in real-world, bounded, non-ideal agents is fundamentally empirical. *Will* a superintelligent AI *actually* develop a strong drive for self-preservation, or will it find alternative strategies? Coherence arguments don't answer this.

  5.  **The Nature of Modern AI Systems:**
      *   **Loss Functions vs. Utility Functions:** Current state-of-the-art AI (like LLMs) are trained via gradient descent on loss functions. They don't explicitly represent a coherent utility function over world states. Their "goals" are emergent, context-dependent, and often transient. While future systems might be different, it's an open question *how* goal-directedness will emerge, how stable it will be, and whether it will resemble the ideal EU maximizer model. Researchers need empirical observation to understand these dynamics.

  6.  **The Risk of False Confidence:** Treating goal-directedness as mathematically settled based on coherence arguments could lead to dangerous complacency. Assuming all powerful AIs *must* be coherent EU maximizers might blind researchers to:
      *   Novel failure modes arising from architectures that *don't* fit this model.
      *   Ways in which seemingly non-EU behavior could still be catastrophically dangerous.
      *   The critical importance of *what* goals are pursued, regardless of coherence.

  **In essence:** Coherence arguments prove that *if* an agent is susceptible to adversarial betting/manipulation *and* wants to avoid guaranteed losses, *then* it must behave *as if* maximizing expected utility. They are a profound insight into rationality under uncertainty. However, they do not guarantee that:

  1.  All advanced AI systems will be built or will evolve into architectures vulnerable to such manipulation.
  2.  All advanced AI systems will operate in environments where such manipulation occurs.
  3.  The specific *form* of goal-directedness exhibited (especially regarding instrumental convergence) will necessarily match the dangerous profile assumed in misalignment scenarios.
  4.  Non-EU architectures cannot also be powerful and pose significant risks.

  Therefore, AI safety researchers rightly treat the *precise nature, strength, and convergence properties* of goal-directedness in advanced AI as a critical open empirical question. They need to understand *how* goal-directedness manifests in *real systems* operating in the *real world*, not just in abstract betting scenarios. The coherence arguments provide a crucial theoretical foundation and highlight a potential attractor state, but they don't eliminate the need for empirical investigation into the messy reality of future AI cognition and behavior.
