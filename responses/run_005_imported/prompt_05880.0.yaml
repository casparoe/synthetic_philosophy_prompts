  *   **Disagreement Point (d):** (0, 0) - Both get nothing if they fail to agree.
  *   **Feasible Set (S):** Defined by:
      *   `u1 >= 0`, `u2 >= 0`
      *   `u1 + u2 <= 100` (Efficient frontier is linear *until* a point)
      *   BUT, Player 2 experiences diminishing returns significantly after $40. Specifically, any allocation giving P2 more than $40 requires giving up $3 from P1 for every additional $1 given to P2 beyond $40. The Pareto frontier consists of two segments:
          1.  From (100, 0) to (60, 40): Slope = -1 (`dU2/dU1 = -1`). Trading off dollar for dollar.
          2.  From (60, 40) to (0, 60): Slope = -3 (`dU2/dU1 = -3`). Giving P2 an extra dollar costs P1 three dollars.
