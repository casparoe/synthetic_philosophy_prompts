  Okay, the user is on a grants committee for a longtermist research fund focused on decision theory and AI safety. They're split on a proposal about acausal trade, now called "evidential cooperation in large worlds." I need to help draft a decision memo that addresses both sides fairly.

  First, let's understand the core of the proposal. The applicant wants to formalize conditions under which agents with no causal interaction can cooperate based on decision-theoretic correlations. The committee is divided: one side sees it as legitimate decision theory, while the other sees it as unfalsifiable and impractical.

  The user's explicit request is for a memo with a clear recommendation—fund, decline, or fund with conditions—plus reasoning that acknowledges both viewpoints. They also want guidance on how to reframe the proposal if needed. The deeper need here is probably facilitating a constructive committee decision despite polarization, maintaining team cohesion, and ensuring rigorous evaluation of unconventional ideas.

  Key arguments for funding: This builds on established work in non-causal decision theories (like evidential decision theory and functional decision theory). Concepts like superrationality have academic standing, and dismissing it for being abstract might contradict existing accepted theories. The research could offer novel insights for AI coordination.

  Key arguments against: The theory is fundamentally unfalsifiable—no empirical test can verify the existence or cooperation of acausal agents. The term "trade" is misleading without enforcement mechanisms. It risks becoming a theoretical exercise with no actionable output, potentially diverting resources from more testable AI safety work.

  To bridge this, a conditional funding recommendation makes sense. The proposal needs stronger grounding in real-world AI safety challenges. For example, could this inform multi-agent AI systems where agents have limited causal access? The applicant should clarify how findings would translate into concrete guidelines for AI labs, perhaps through decision frameworks or coordination protocols.

  Methodological rigor is another condition. The proposal must address how to handle uncertainty about agent similarity and value alignment. Proposing falsifiable sub-questions or empirical analogs (like distributed systems) would strengthen it. Rebranding away from "acausal trade" to "correlated coordination" might mitigate semantic objections.

  This approach validates both sides: proponents see the theory's potential being taken seriously, while skeptics get safeguards against unfalsifiability. It also pushes the applicant toward impactful work, aligning with the fund's goal of supporting early-career researchers without compromising rigor.
answer: |-
  ## MEMO: Funding Recommendation for Proposal on "Evidential Cooperation in Large Worlds" (Acausal Trade)

  **To:** Small Grants Committee, Longtermist Research Fund  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Proposal: "Formalizing Evidential Cooperation for Non-Causal Agents"

  **Proposal Summary:** The applicant seeks one year of funding to formalize conditions under which agents lacking causal interaction (e.g., distant civilizations, future superintelligences) can rationally cooperate based on decision-theoretic correlations ("evidential cooperation in large worlds," historically termed "acausal trade"). The goal is to derive actionable guidance for present-day actors, particularly AI labs.

  **Committee Split:** The committee is divided on the proposal's merit. Key arguments are summarized below:

  *   **Arguments FOR Funding (Legitimacy & Standing):**
      *   Rooted in established decision theory: Builds directly on Newcomb's problem, superrationality, and active academic work in non-causal decision theories (Evidential Decision Theory, Functional Decision Theory, Logical Decision Theory).
      *   Theoretical Rigor: Addresses fundamental questions about rationality under uncertainty and correlation, independent of immediate empirical testability. Abstractness alone is not disqualifying in this field.
      *   Potential Relevance: May offer novel frameworks for reasoning about coordination with highly capable, opaque, or temporally distant agents (including future AI systems). Understanding correlation-based cooperation could inform broader AI alignment strategies.
      *   Academic Standing: Concepts like superrationality among correlated reasoners are recognized within decision theory literature, not fringe ideas.

  *   **Arguments AGAINST Funding (Falsifiability & Practicality):**
      *   Unfalsifiable Core Premises: Requires assuming (1) the existence of relevantly similar agents in inaccessible locations/times, and (2) sufficient knowledge of their values/decision processes. No conceivable observation can confirm/disconfirm these assumptions or the success/failure of proposed "cooperation."
      *   Misleading Terminology ("Trade"): Lacks the core element of verifiable reciprocity present in causal trade. Without enforcement or verification mechanisms, the practical applicability of "cooperation" is highly suspect.
      *   Risk of Unactionable Speculation: High potential to yield purely theoretical results disconnected from verifiable reality or actionable guidance for present actors. The "Pascal's Mugging" analogy highlights the risk of investing resources based on speculative, unverifiable high-impact scenarios.
      *   Opportunity Cost: Resources directed here might be better spent on decision theory or AI safety research with clearer paths to empirical validation or near-term impact.

  **Committee Recommendation: FUND WITH SPECIFIC CONDITIONS**

  After careful consideration of both compelling perspectives, the committee recommends funding the proposal **contingent on the applicant explicitly addressing the core concerns regarding falsifiability, applicability, and terminology in a revised research plan.** We acknowledge the theoretical legitimacy of investigating non-causal cooperation within decision theory but share significant skepticism about its direct practical application and the risk of untestable speculation.

  **Rationale for Conditional Funding:**

  1.  **Theoretical Value is Recognized:** The proposal tackles questions within the legitimate scope of formal decision theory. Dismissing it solely because its conclusions *sound* strange or its domain *is* abstract would be inconsistent with supporting fundamental research in this field. The connection to existing literature (Newcomb, superrationality, EDT/FDT/LDT) is valid.
  2.  **Potential for Foundational Insights:** Even if direct "acausal trade" proves practically unrealizable, rigorously exploring the limits of correlation-based cooperation could yield valuable insights into:
      *   The nature of rationality under radical uncertainty and correlation.
      *   Requirements for successful coordination between highly capable, potentially opaque agents.
      *   The boundaries and assumptions of different decision theories.
  3.  **Conditionality Forces Engagement with Critiques:** Funding with conditions provides an opportunity to steer the research towards greater rigor and potential relevance, addressing the strongest objections head-on.

  **Required Conditions for Funding:**

  The applicant must submit a revised research plan, integrated into the proposal, that explicitly:

  1.  **Reframe the Objective & Terminology:**
      *   De-emphasize "trade" and "cooperation" in the practical, reciprocal sense. Reframe the core objective as: **"Formalizing the conditions under which correlated decision-making *could* rationally influence actions *if* certain strong assumptions (existence of relevantly similar agents, knowledge of values/correlation structures) hold."**
      *   Use terminology like "correlated coordination," "evidential influence," or "superrational strategies in large worlds" instead of "acausal trade" to avoid implying verifiable reciprocity.
  2.  **Address Falsifiability & Testability Concerns:**
      *   **Explicitly Acknowledge Assumptions:** Clearly state and rigorously justify the necessary assumptions (e.g., existence of agents, similarity, knowable correlations). Discuss the sensitivity of results to relaxing these assumptions.
      *   **Identify Falsifiable Sub-Questions:** Focus on aspects that *can* be tested or analyzed within the model, even if the grand scenario cannot. Examples:
          *   Under what formal correlation structures do specific strategies dominate?
          *   How robust are proposed strategies to uncertainty about agent similarity or value alignment?
          *   Can the formalism produce testable predictions within simulated multi-agent systems (even causally connected ones) exhibiting high correlation?
          *   Does the framework offer novel insights or recover known results in *causally connected* game-theoretic scenarios with information barriers?
  3.  **Clarify Path to Actionable Guidance:**
      *   **Temper Expectations:** Explicitly state that deriving concrete, verifiable instructions for present-day AI labs regarding interactions with *truly* non-causal agents is likely infeasible due to the unfalsifiability problem.
      *   **Focus on Intermediate Value:** Articulate how the *formal tools, concepts, or insights* developed could *indirectly* inform practical decision-making or strategy in more tractable scenarios. Examples:
          *   Could it inform strategies for coordinating with AI systems whose internal states are opaque but whose outputs are highly correlated?
          *   Does it offer new perspectives on handling decision-making under deep uncertainty about other actors' capabilities or intentions?
          *   Can it contribute to formal models of "longtermist" decision-making under cosmic uncertainty?
  4.  **Strengthen Methodological Rigor:**
      *   Outline specific formal methods (e.g., developing game-theoretic models with specific correlation structures, agent-based simulations, logical proofs).
      *   Define clear success criteria for the formal work itself (e.g., deriving specific theorems, characterizing equilibria under defined assumptions, demonstrating convergence properties).

  **Recommendation Summary:**

  *   **Recommendation:** Fund, subject to the applicant successfully revising the proposal to meet the four conditions outlined above within [Specify Timeframe, e.g., 4 weeks].
  *   **Reasoning:** The proposal engages with theoretically legitimate questions in decision theory but currently carries significant risks of unfalsifiability, misleading framing ("trade"), and unclear practical relevance. Conditional funding leverages the proposal's theoretical potential while mandating necessary rigor and realism. It ensures the research explicitly confronts its core critiques and seeks value within the bounds of testable formal analysis and indirect insights.
  *   **Fallback:** If the applicant cannot or will not satisfactorily address these conditions, the committee should **decline** funding. The unfalsifiability and applicability concerns, unmitigated, would render the research unlikely to yield actionable knowledge or robust contributions justifying the investment.

  **Conclusion:**

  This recommendation seeks a middle path. It validates the proponents' argument that the research sits within legitimate decision theory and should not be dismissed solely for its abstractness or counterintuitive nature. Simultaneously, it takes the skeptics' concerns about unfalsifiability and practical applicability seriously by making funding contingent on the applicant directly engaging with and mitigating these issues through reframing, methodological rigor, and a focus on potentially testable sub-questions or indirect insights. This approach aims to maximize the potential value of the research while minimizing the risk of funding purely speculative work.
