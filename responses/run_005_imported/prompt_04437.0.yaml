prompt: |-
  in my phil of mind class we're covering Kim's causal exclusion argument rn (if a physical cause is already sufficient for a physical effect, a distinct mental cause of that same effect gets 'excluded' unless its just identical to the physical cause - otherwise your stuck with systematic overdetermination). we did Spinoza earlier this semester and his parallelism thing kind of feels like its trying to dodge exactly this problem - mind and body aren't distinct causes competing for the same effect, they're just two attributes of one substance (the whole "order and connection of ideas is the same as the order and connection of things" bit). what do you think spinoza would actually say if you confronted him with kim's argument - does his metaphysics genuinely escape exclusion, or does it just relocate the same problem somewhere else?
reasoning: |-
