  3. Outline criteria for future systemic interventions to reduce cluelessness concerns. 

  This approach satisfies the immediate need for a decision, respects the bednets' proven impact, and addresses systemic-change advocates by committing to develop better evaluation methods. It turns the debate into a procedural step forward rather than a philosophical stalemate. 

  Key elements: 
