answer: |-
  You've hit on one of the most profound and contentious debates in value theory! Moore's ideas (especially in *Principia Ethica*) are brilliant thought-starters, but also deeply controversial. Let's break down the implications if we take him seriously:

  **Core Implications of Moore's View:**

  1.  **Intrinsic Value Exists Independently of Consciousness:** Beauty (and loving relationships) possess *goodness-in-themselves*, not because they please us or serve a purpose. This directly challenges utilitarian (value = happiness/utility) and subjectivist (value = personal preference) views. The beautiful planet *is* better, objectively, simply by virtue of being beautiful.
  2.  **Radical Environmental Ethics:** Yes, under Moore's view, the destruction of an unseen, unvisited coral reef *is* a genuine moral tragedy. Its intrinsic aesthetic value is snuffed out. This aligns with deep ecology and some non-anthropocentric environmental philosophies arguing nature has value beyond human use.
  3.  **The Primacy of Personal Experience & Relationships:** Moore elevates the conscious appreciation of beauty and the state of being in loving relationships to the highest goods. This implies:
      *   **Desert Island Love:** Your example is spot-on. Moore would likely argue that the couple experiencing deep love and appreciating each other's beauty (physical, emotional) *is* achieving peak "goodness," even without societal impact. The *state of being* in that loving relationship is intrinsically valuable.
      *   **The Lonely Genius:** The disease-curing genius lacking close relationships is achieving immense *instrumental* good (saving lives, reducing suffering – which Moore *does* acknowledge as good, but lower down the hierarchy). However, they are missing out on the *highest* intrinsic goods. Their life, while hugely beneficial to others, lacks the supreme value Moore identifies. It might be "admirable" or "useful" but not the "best" state of existence.
  4.  **Devaluation of Traditional Morality:** Duty, obligation, social utility, and even moral rules (like Kantian deontology) become *instrumental* goods at best for Moore. They are valuable *only* insofar as they tend to produce situations where people can experience beauty or loving relationships. They aren't intrinsically valuable in themselves.
  5.  **Aesthetics Becomes Central to Ethics:** Ethics isn't just about rules, consequences, or virtues; it's fundamentally concerned with the creation, preservation, and appreciation of beauty in the broadest sense (natural, artistic, personal).

  **Major Critiques & Counterarguments (Why it Might *Not* Be Profound "Fact"):**

  1.  **The "Queerness" of Non-Natural Properties:** Moore's "good" is a simple, non-natural property. Critics (like J.L. Mackie) argue this is metaphysically mysterious. *How* does beauty "hook onto" reality without any conscious mind to perceive it? How do we *know* about it? This feels like projecting human values onto the universe.
  2.  **Intuition Isn't Proof:** Moore relies heavily on "intuition." But intuitions vary wildly. Is the unseen planet *really* "better"? Some might argue it's simply *different*, or that value *requires* a valuer. Moore's "most people agree" is debatable and not a logical proof.
  3.  **The Problem of Defining "Beauty":** What *is* beauty? Is it objective? Or culturally conditioned? If the latter, how can it be intrinsically valuable independent of observers? Moore struggles to define it rigorously.
  4.  **Neglect of Suffering & Justice:** Critics argue Moore underplays the intrinsic *badness* of suffering and the importance of justice/fairness. Is preventing horrific suffering really less important than preserving unseen beauty? Is a loving but deeply unjust relationship truly the "best" state?
  5.  **The Danger of Quietism:** If the peak of goodness is private appreciation/love, does this undermine motivation for social action, fighting injustice, or creating wider well-being? Is Moore's ideal world one of isolated aesthetes and couples, ignoring societal problems?
  6.  **Isolation vs. Contribution:** While the desert island love might be *intrinsically* good, is it *as good* as a love that also radiates outwards, fostering kindness, creativity, or support in a community? Moore's framework struggles to capture the value of positive impact beyond the immediate relationship.

  **What Should You Feel About the Coral Reef?**

  *   **If Moore is right:** Yes, you should feel profound moral loss. A unique, intrinsically valuable state of the universe has been destroyed.
  *   **If Moore is wrong (but beauty matters subjectively/ecologically):** You might still feel loss because it *could* have been experienced, or because it represents biodiversity loss with potential unknown consequences, or simply because its existence *felt* meaningful to you, knowing it was there.
  *   **If value strictly requires a valuer:** The loss has no *inherent* moral weight, though it might signal ecological processes that could impact valuers later.

  **Desert Island Love vs. Lonely Genius:**

  *   **Moore's Peak:** The loving couple achieves the highest intrinsic good directly.
  *   **Instrumental Good vs. Intrinsic Good:** The genius achieves immense instrumental good (preventing suffering, enabling others to pursue *their* intrinsic goods). But they lack the highest intrinsic good themselves.
  *   **A Balanced View:** Perhaps the *ideal* is the genius who *also* has deep loving relationships, combining both intrinsic and instrumental goods. Or perhaps a life rich in intrinsic goods *and* positive contribution is superior to either extreme. Moore arguably undervalues the intrinsic worth of alleviating suffering or creating justice.

  **Conclusion: Profound Point or Dressed Preferences?**

  It's **both**.

  *   **Profound:** Moore forces us to confront whether value exists independently of human minds and to question the hierarchy of goods. He highlights the irreplaceable depth of aesthetic experience and personal love in a way that resonates deeply. The thought experiment effectively challenges purely subjectivist or utilitarian views.
  *   **Dressed Preferences:** Moore's *specific hierarchy* (beauty/love > everything else) and his *metaphysics* of non-natural properties are highly contested. His views reflect a particular (early 20th-century, Bloomsbury-influenced) sensibility that prized aesthetic experience and personal relationships above conventional morality and social utility. Critics see it as an elegant justification for a certain privileged way of life.

  **The Takeaway:** Moore provides a powerful lens, not final answers. It *should* make you question the moral weight of the unseen natural world and the true source of value in relationships. It challenges the over-emphasis on utility. But it doesn't definitively prove that beauty exists as an objective property in rocks or that a life of isolated aesthetic appreciation is ethically superior to one of engaged contribution, even if lacking intimacy. The tension Moore exposes – between intrinsic experience and instrumental impact, between private good and public responsibility – remains a core, unresolved question in how we live and what we value. Keep chewing on it! The value is in the questioning itself.
