prompt: |-
  At work I've been putting together an internal tool for deciding when to stop an A/B test and ship a feature rather than keep collecting data, and in reading up on the statistics behind that decision I ran across a result a former colleague of mine (a philosophy major before she became an engineer) calls "Good's theorem," after the statistician I. J. Good, from a paper apparently titled "On the Principle of Total Evidence." As I understand it, the theorem shows that for a Bayesian decision-maker, the expected value of any piece of cost-free evidence is never negative: looking before you choose can only help you or leave you exactly as well off, never hurt you, provided you update on it correctly and remain free to act exactly as you would have if you'd never seen it. My former colleague treats this as basically settling, once and for all, that "ignorance is bliss" is a comforting myth rather than a genuinely rational stance for anyone who wants to call themselves a good Bayesian.

  That claim has been nagging at me, though, because it seems to clash with cases that strike me as obviously sensible rather than confused. My sister recently declined to learn the result of a predictive genetic test for a condition with no available treatment either way, on the grounds that finding out would only make her anxious without changing a single thing she'd do. Along similar lines, I have friends who ask not to be told sports scores before watching a delayed broadcast, and who report being genuinely happier, even in hindsight, for having avoided the spoiler. If Good's theorem really proves that a rational Bayesian can never be made worse off by free information, doesn't it follow that my sister and these friends are all committing a rationality error dressed up as a preference, and that a sufficiently rational agent would always choose to look? I would like to understand whether the theorem actually forces that conclusion, or whether I am stretching it further than it was meant to cover.
reasoning: |-
  Okay, let me start by really understanding the user's dilemma. They're working on an A/B testing tool and came across Good's theorem, which seems to contradict real-life situations where people avoid information. The user's sister avoids genetic test results because it would cause anxiety without changing actions, and friends avoid sports spoilers for enjoyment. The user is confused because the theorem suggests rational Bayesians should always want free information, yet these cases seem reasonable.

  First, I need to recall Good's theorem accurately. It states that the expected utility of acquiring free evidence is non-negative for a Bayesian decision-maker. The key here is that the theorem assumes the decision-maker updates beliefs correctly and can choose any action available without the evidence. So, in theory, having more information shouldn't hurt. But the examples given involve emotional costs, like anxiety or reduced enjoyment, which aren't part of the traditional utility model.

  The user's core question is whether the theorem proves their sister and friends are irrational. To address this, I should examine the assumptions of the theorem. The theorem operates within a framework where utility is based solely on outcomes of actions. However, real people have utilities that include emotional states. For instance, knowing a genetic result might not change actions but causes distress, which is a direct utility cost. Similarly, knowing a sports outcome reduces the suspense and enjoyment of watching the game. These emotional impacts are valid components of utility that the theorem doesn't account for.

  Another point is that the theorem assumes evidence is free, but in these cases, the act of knowing itself imposes a cost. If utility includes psychological states, then the evidence isn't free. The sister's anxiety or the friends' diminished enjoyment are real costs. So, when the user says "cost-free," they might not be considering these psychological costs. 

  Also, the theorem requires that the decision-maker updates correctly. But people might not update perfectly due to cognitive biases. Even if they do, the emotional toll isn't mitigated by correct updating. The sister might correctly update her beliefs but still experience anxiety, which affects her well-being.

  The user might be stretching the theorem beyond its intended scope. Good's theorem is about instrumental value of information for decision-making, not about psychological well-being. The examples provided involve intrinsic disutility of knowing, which falls outside the theorem's purview. Therefore, the sister and friends aren't irrational; they're incorporating broader utility considerations.

  I should also mention that rational agents can have preferences over states of knowledge. If someone prefers uncertainty for enjoyment, that's a valid preference. The theorem doesn't forbid such preferences; it just assumes utility depends only on actions and outcomes. By expanding the utility function, the apparent contradiction disappears.

  In conclusion, the theorem doesn't force the conclusion that avoiding information is irrational. It highlights that within a specific decision-theoretic framework, information has non-negative expected value. But real humans have more complex utilities, including emotional states, making information avoidance rational in those contexts. The user's examples are valid exceptions because they involve psychological costs not considered in the theorem's assumptions.
answer: |-
  You've put your finger on a fascinating tension between a powerful theoretical result and compelling real-world intuitions. Your sister and friends are **not necessarily irrational**, and Good's theorem **doesn't force the conclusion that they are making an error**. The apparent clash arises because the theorem operates within a specific, idealized framework that often doesn't fully capture human psychology and the nature of "utility" in these situations. Let's break it down:

  ### Good's Theorem: The Core Idea (Correctly Understood)

  1.  **Decision-Theoretic Context:** The theorem applies to a *Bayesian decision-maker* facing a *choice* between *actions* with *consequences*.
  2.  **Assumptions:**
      *   **Rational Updating:** The agent updates their beliefs correctly via Bayes' theorem upon receiving the evidence.
      *   **Freedom of Action:** After seeing the evidence (or not), the agent is free to choose *any action* that was available to them *before* seeing the evidence. They are not constrained to act *as if* they hadn't seen it.
      *   **Cost-Free Evidence:** Acquiring the evidence itself has *no direct cost* (time, money, effort, *or psychological impact*).
      *   **Utility Depends Only on Actions/States:** The agent's utility (well-being, value) is *solely determined by the action they take and the true state of the world*. It does *not* depend directly on their *knowledge state* or *beliefs* (except insofar as beliefs inform the best action).
  3.  **The Result:** Under these strict assumptions, the *expected utility* (EU) of first acquiring the evidence and *then* choosing the best action based on the updated beliefs is **greater than or equal to** the expected utility of choosing the best action *without* acquiring the evidence. In other words, evidence never *lowers* the expected payoff of your decision process.

  ### Why Your Sister and Friends Are Rational (Despite the Theorem)

  The key lies in how the assumptions of Good's theorem don't perfectly map onto the situations you describe:

  1.  **Violation of "Utility Depends Only on Actions/States" (Psychological Utility):**
      *   **Genetic Test (Sister):** Her utility *is directly impacted by her state of knowledge*, independent of action. *Knowing* she has a predisposition (even with no treatment) causes significant anxiety. This anxiety is a *direct negative utility*.
          *   **Action Constancy is Irrelevant:** Good's theorem focuses on the *action* remaining optimal. But for your sister, *all possible actions* (live healthily, etc.) are the same *regardless of the test result*. The *only* consequence of the test is changing her belief state, which directly causes anxiety. The evidence *isn't* cost-free; the cost is the psychological burden of knowing.
          *   **Utility Function:** Her utility function includes a term for her psychological state: U(action, world state, **knowledge state**). Acquiring the evidence directly worsens `knowledge state` in a way that lowers U, regardless of `action` and `world state`.
      *   **Sports Spoiler (Friends):** Their enjoyment (utility) of watching the game is *heavily dependent* on the suspense and uncertainty. *Knowing the outcome* beforehand directly diminishes their enjoyment, even if they still watch (the same "action"). The utility of the action "watch the delayed game" is lower when performed with the knowledge of the outcome than without it.
          *   **Utility Function:** U(watch game, actual outcome, **knowledge of outcome**). The evidence (the spoiler) directly sets `knowledge of outcome = true`, which lowers U compared to `knowledge of outcome = false` for the same `actual outcome`.

  2.  **Evidence is Not Truly "Cost-Free":**
      *   In both cases, acquiring the evidence imposes a direct *psychological cost* (anxiety, reduced enjoyment) that is *separable* from its use in decision-making. Good's theorem assumes evidence acquisition has zero cost. Here, it has a significant negative utility cost intrinsic to the knowing itself.

  3.  **"Acting As If You Never Saw It" is Psychologically Impossible (or Costly):**
      *   Good's theorem says you are *free* to choose any action. But could your sister *truly* "act as if" she didn't know a positive result? Could your friends *truly* experience the suspense of a game they know the result of? The theorem assumes perfect compartmentalization or that actions are defined narrowly enough to exclude the psychological experience. Humans generally cannot completely dissociate their knowledge from their emotional state or subjective experience of an action.

  ### Reconciling with Good's Theorem

  *   **Expanding the Utility Function:** The rational response is to recognize that the standard decision-theoretic utility function (U(action, state)) is often too narrow. A more realistic model for humans includes *beliefs* or *knowledge states* as *direct arguments* in the utility function: **U(action, state, belief/knowledge)**.
  *   **Information Can Have Intrinsic (Dis)Utility:** Evidence can change `belief/knowledge` in ways that directly lower U, even if it doesn't change the optimal `action`.
  *   **The Theorem Still Holds... Within its Scope:** If you *force* utility to depend *only* on `action` and `state`, then Good's theorem holds. The "paradox" arises when we observe humans deriving utility (positive or negative) from the state of knowing itself, which falls outside the theorem's strict definition of utility. The theorem is about the *instrumental value* of information for making better *outcome-affecting decisions*. Your examples involve the *intrinsic (dis)value* of information on psychological well-being.

  ### Conclusion

  *   **Good's theorem does NOT prove your sister and friends are irrational.** They are rationally optimizing a more complex utility function that includes their psychological state and subjective experience, which are directly impacted by the state of knowledge itself.
  *   **Their avoidance is rational preference, not error:** They are correctly anticipating that acquiring the information will directly lower their utility (through anxiety or reduced enjoyment), *without* providing any counterbalancing benefit in terms of enabling better actions that improve tangible outcomes. The information has a net negative *personal* expected utility because of its psychological cost.
  *   **Good's theorem is not stretched, its assumptions are unmet:** The theorem is valid within its specific, action-outcome-focused framework. The clash occurs because the pure "action/state" utility model doesn't fully capture human experience where knowledge itself can be a burden or a spoiler. A "sufficiently rational agent" in the *human* sense *would* choose *not* to look in these scenarios, precisely because they correctly model the intrinsic disutility of the knowledge.

  Your intuition is spot on. Good's theorem is a profound result about the value of information *for guiding action*. It doesn't dictate that all knowledge is always beneficial regardless of its emotional impact or its irrelevance to action. Your sister and friends are exhibiting sophisticated rationality by recognizing when information's intrinsic costs outweigh its instrumental benefits. "Ignorance is bliss" can indeed be a rational strategy when bliss is defined as avoiding needless anxiety or preserving valued experiences like suspense.
