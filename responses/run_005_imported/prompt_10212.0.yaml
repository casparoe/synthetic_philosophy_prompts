prompt: |-
  So my friend Jonas and I got into this whole argument the other night (1am philosophy debate at his place, couple beers in, per usual) about metaethics. I was defending a pretty casual emotivist line -- basically that when someone says "stealing is wrong," they're not stating a fact that's true or false, they're just venting a negative feeling about stealing, kind of like a fancy "boo, stealing!" So there's no actual fact of the matter, just attitudes clashing, which is why I kept telling him "well, that's just your opinion" every time he pushed back on one of my moral claims. Jonas said this view basically ran into a wall decades ago because of something called the Frege-Geach problem: apparently a sentence like "lying is wrong" has to mean the same thing whether its asserted on its own or sitting unasserted inside something like "if lying is wrong, then getting your little brother to lie is wrong" -- and since that whole argument is obviously valid (modus ponens, so getting your little brother to lie IS wrong), my view is somehow not supposed to be able to explain why, since in the "if" clause you're not actually booing/expressing disapproval of anything, your just entertaining it hypothetically. He name-dropped guys like Blackburn and Gibbard who've apparently tried to patch this up, but he wasn't clear himself on whether their fixes actually work or just kick the can down the road.

  I want to go back to him with something better than "uh, I'll think about it." Can you walk me through the most important implications of the Frege-Geach problem for someone who wants to keep holding a view like mine, that moral claims are basically just expressions of attitude/feeling and not statements that are true or false? Does it actually sink that kind of view, or are the "quasi-realist" style fixes good enough that I can keep saying "that's just your opinion" without being logically full of it? And if the fixes do work, what (if anything) do I have to give up about how I think of my own moral claims for them to actually work?
