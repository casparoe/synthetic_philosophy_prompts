  Okay, let me start by unpacking the user's query. They had a late-night debate with their friend Jonas about metaethics, specifically emotivism. The user defended the idea that moral statements like "stealing is wrong" are just expressions of feeling, not factual claims. Jonas brought up the Frege-Geach problem, arguing that this view can't handle moral statements in unasserted contexts, like conditionals. The user wants to understand this problem and whether quasi-realist solutions (like Blackburn's or Gibbard's) save their position without compromising too much.

  First, I need to ensure I correctly explain the Frege-Geach problem. The core issue is consistency in meaning across asserted and unasserted contexts. In emotivism, "lying is wrong" expresses disapproval. But in a conditional like "If lying is wrong, then...", the same phrase isn't expressing disapproval; it's hypothetical. This challenges emotivism's ability to explain logical validity in moral arguments, such as modus ponens.

  The user mentioned Blackburn and Gibbard. I should outline their quasi-realist solutions. Blackburn's projectivism suggests that moral language projects attitudes but constructs a proposition-like structure to handle logic. Gibbard's norm-expressivism frames moral judgments in terms of planning and norms. Both aim to preserve logical consistency while maintaining that moral claims aren't about objective facts.

  The user's deeper need might be to defend their emotivist stance without looking logically inconsistent. They want to keep saying "that's just your opinion" but need a way to counter Jonas's argument. They might also be seeking validation that their view isn't obsolete and that sophisticated versions exist. They might not want to concede to moral realism but need to understand the concessions required by quasi-realism.

  I should highlight the implications: quasi-realism allows moral discourse to mimic realism but demands acknowledging that moral judgments involve more than simple emotions. They're embedded in a framework of attitudes and norms that support logical operations. The user might need to adjust from seeing moral claims as mere venting to recognizing them as commitments within a system of attitudes.

  Also, the user might wonder if these solutions are just stopgaps. I should note that while debated, quasi-realism is a respected position. The key takeaway is that emotivism can evolve into a more robust expressivism, but it requires accepting that moral language functions as if it's truth-apt, even if it's not fundamentally factual.

  Finally, the user needs practical advice for their next debate. Emphasize that with quasi-realism, they can still say "that's your opinion" but must explain how moral arguments work through expressed attitudes and logical structures built on those attitudes. Acknowledge that this moves beyond simple emotivism but maintains the non-cognitive core.
answer: |-
  Okay, let's break down this 1am philosophy brawl! You're right that Frege-Geach is *the* major challenge for simple emotivism (and expressivism in general). But it doesn't necessarily sink the ship – it just forces you to upgrade to a more sophisticated model, like Blackburn's quasi-realism or Gibbard's norm-expressivism. Here's the breakdown:

  **The Core of the Frege-Geach Problem (For Emotivists):**

  1.  **The Claim:** Simple emotivism says "X is wrong" means "Boo X!" (expressing disapproval).
  2.  **The Problem:** Meaning must be consistent across contexts. The phrase "lying is wrong" has to contribute the *same meaning* whether it's:
      *   **Asserted:** "Lying is wrong!" (You're *booing* lying).
      *   **Unasserted (e.g., in a conditional):** "If lying is wrong, then getting your little brother to lie is wrong." (You're *not* booing lying here; you're just *considering the idea* hypothetically).
  3.  **The Logic Problem:** The argument "If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong" is clearly logically valid (modus ponens). Its validity depends on the *meaning* of "lying is wrong" being the same in both premises and allowing the inference.
  4.  **The Emotivist Stumbling Block:** For simple emotivism:
      *   In the first premise ("If lying is wrong..."), "lying is wrong" *isn't* expressing disapproval (booing). It's just floating there hypothetically. So what meaning does it even *have* in that context?
      *   In the second premise ("Lying is wrong"), it *is* expressing disapproval.
      *   How can two premises with *fundamentally different kinds of meaning* (one hypothetical/non-expressive, one actual expression of feeling) logically combine to force a conclusion that *also* expresses a feeling ("Boo getting your little brother to lie!")? Simple emotivism struggles to explain how logic *works* with moral language. It seems to reduce the first premise to nonsense ("If 'Boo lying!' then...") or make the inference mysterious.

  **Implications for Your View:**

  1.  **Simple Emotivism is Toast:** Frege-Geach shows that "stealing is wrong" can't *just* mean "Boo stealing!" *if* we want moral language to function logically in arguments, conditionals, questions ("Is stealing wrong?"), etc. The expression theory needs to account for the *logical* role of moral terms, not just their use in direct assertions.
  2.  **"That's Just Your Opinion" Needs Nuance:** You can still *ultimately* hold that moral claims express attitudes, not report mind-independent facts. However, you can't *simply* dismiss Jonas's arguments by saying "that's just your opinion" *if* you want to grant that moral arguments can be logically valid. Frege-Geach forces you to explain *how* expressions of attitude can be logically connected.

  **The Quasi-Realist Fix (Blackburn) & Norm-Expressivism (Gibbard): Can They Save the Day?**

  These are sophisticated attempts to save expressivism from Frege-Geach. They don't "kick the can," they try to build a new vehicle. Here's the gist:

  1.  **Blackburn's Quasi-Realism (Projectivism):**
      *   **Core Idea:** We *project* our attitudes onto the world, talking *as if* there were moral facts. Language develops rules to allow us to express complex combinations of attitudes logically.
      *   **Solving Frege-Geach:** When you say "If lying is wrong, then getting your little brother to lie is wrong," you are **expressing a higher-order attitude** about your attitudes.
          *   You are *disapproving* of the combination: *approving of lying* AND *not disapproving of getting your little brother to lie*.
          *   Essentially: "Boo to approving of lying without also booing getting your little brother to lie!"
      *   **The Logic:** Validity is understood in terms of **consistency of attitudes**. Accepting the premises ("If lying is wrong..." and "Lying is wrong") but rejecting the conclusion ("Getting your little brother to lie is *not* wrong") involves an **inconsistency in your practical commitments/attitudes**. The logical structure mirrors the structure of these commitments. Modus ponens *works* because it reflects a constraint on coherent planning and disapproval.
      *   **What it Preserves:** There are no objective moral facts "out there." Moral talk is fundamentally about attitudes.
      *   **What it Mimics:** It successfully mimics *all the surface features* of moral realism: truth-aptness ("It's true that stealing is wrong" means something like "Hooray for disapproving of stealing!"), logical validity, knowledge claims, etc. Hence "quasi-realism" – it *looks* like realism, but its foundations are different.

  2.  **Gibbard's Norm-Expressivism:**
      *   **Core Idea:** Moral judgments express our acceptance of *norms* that govern feeling and action. "X is wrong" means "I accept norms that prescribe feelings of guilt for doing X and anger towards others who do X."
      *   **Solving Frege-Geach:** When you say "If lying is wrong, then getting your little brother to lie is wrong," you are expressing a **norm about norms**. You're saying that the norm that forbids lying *requires* the norm that forbids getting your little brother to lie. It's a rule about how rules connect.
      *   **The Logic:** Logic applies to the *content of the norms* being expressed and their logical relationships. Accepting the premises commits you, rationally, to accepting the conclusion *as a matter of consistent norm-acceptance*.

  **Can You Keep Saying "That's Just Your Opinion"? (The Quasi-Realist Answer)**

  *   **Yes, BUT...** with significant caveats that change *what you mean* by it:
      *   **Not *Just* a Simple Feeling:** You have to accept that moral judgments involve complex *commitments* (Blackburn) or *accepted norms* (Gibbard) that are subject to rational constraints (consistency, coherence). It's not *just* a fleeting emotion like "I hate broccoli." Saying "stealing is wrong" expresses a stable attitude/norm that you apply generally and are committed to.
      *   **Logic Applies:** You have to grant that moral *arguments* can be logically valid *because* they track consistency in our commitments/norms. You can't dismiss Jonas's modus ponens argument *just* by saying "that's your opinion" *if* you accept the premises. You have to either reject a premise *or* accept the conclusion to be consistent. The "opinion" is embedded in a logical framework.
      *   **"True" and "False" Get Redefined:** Within quasi-realism, you *can* say moral claims are true or false, but it means something like "It is correct to hold this attitude/accept this norm" (based on coherence with other attitudes/norms, or perhaps sensitivity to non-moral facts). It's not truth in the "corresponds to mind-independent reality" sense. So "that's just your opinion" means "that's just the system of attitudes/norms you happen to hold," *not* "that has no logical connection to anything else you say."
      *   **The "Realism" in Quasi-Realism:** Quasi-realism allows you to *talk* realistically about morality ("There *are* moral truths," "We *discover* what's wrong") as a natural way to express our deepest, most coherent commitments. But the *metaphysical foundation* remains non-objective. The key move is separating *surface grammar/logic* from *underlying metaphysics*.

  **What You Might Have to Give Up About Your Own View:**

  1.  **Pure Emotional Venting:** You likely have to move beyond seeing moral claims *only* as expressions of immediate, simple feelings ("Boo!"). They involve more stable dispositions, commitments, plans, or accepted norms.
  2.  **Total Logical Immunity:** You have to accept that your moral "opinions" are subject to logical scrutiny and constraints of consistency. You can't arbitrarily hold any combination of views without risking incoherence. "That's just my opinion" isn't a universal shield against logical critique *within* your own system of attitudes.
  3.  **The Simplicity of "Not True or False":** While quasi-realism denies mind-independent moral facts, it typically embraces *minimalist* or *deflationary* notions of truth that *do* apply to moral claims. Saying "Murder is wrong is true" isn't stating an objective fact, but it's *not* meaningless gibberish either – it expresses robust endorsement of the attitude/norm against murder. You might need to say "not true or false *in the realist sense*" instead of just "not true or false."
  4.  **The Idea that Moral Disagreement is *Just* Like Disliking Different Foods:** While moral disagreements are ultimately clashes of attitudes/norms, quasi-realism explains *why* they feel deeper and involve reasoning. We argue logically *because* we are trying to resolve clashes in our complex systems of commitment or find norms we can all accept. It's not *just* "I like chocolate, you like vanilla."

  **Conclusion & What to Tell Jonas:**

  Frege-Geach **devastates simple, "Boo/Hurrah" emotivism.** It shows that view can't account for the logical structure of moral language and argument.

  However, **sophisticated expressivist theories like Blackburn's quasi-realism or Gibbard's norm-expressivism offer serious, non-ad-hoc solutions.** They explain logical validity by grounding it in the consistency of expressed attitudes or accepted norms. They allow moral language to function *as if* it were factual and truth-apt, while maintaining the core non-cognitivist insight that morality is rooted in our attitudes/commitments/norms, not in mind-independent reality.

  **So, can you keep saying "that's just your opinion"?** Yes, *if* you mean: "That's ultimately an expression of the attitudes/norms you are committed to, not a report of an objective moral fact." **But you *cannot* use it to dismiss logical arguments** based on premises you (or your opponent) accept, as Frege-Geach shows those arguments have force *even on an expressivist view*. Quasi-realism explains *why* they have force.

  **What to say to Jonas:** "Okay, Frege-Geach wrecks the simple 'Boo!' version. Point taken. But Blackburn and Gibbard didn't just kick the can; they built expressivism 2.0. Their solutions show how attitudes/norms can be expressed in logically complex ways, explaining validity through consistency in commitments. So I can still hold that moral claims express non-cognitive states, but I have to grant they form complex, logically constrained systems. 'That's just your opinion' still means it's attitude-based, not fact-based, but it doesn't mean the opinion is immune to logic. The quasi-realist patch seems robust enough for me to stay non-objectivist without being logically incoherent. What do you think *still* doesn't work about their solutions?"

  This shows you understood the challenge, acknowledged the need for sophistication, and can now defend a more resilient expressivist position. Good luck with round two!
