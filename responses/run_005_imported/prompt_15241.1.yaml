  ### Move-by-Move Justification  
  **1. Elena (-1: Partially mistaken)**  
  Elena mistakes generality for impersonality. Owen’s rule ("you don’t leave someone alone") reflects a *principled commitment to care*, not indifference. Moral actions often arise from general duties (e.g., "help friends in need"), and this universality doesn’t negate care for the *specific* recipient. Her view risks reducing moral worth to sentimental preference.  

  **2. Marcus (2: Clearly right)**  
  Marcus correctly identifies that overcoming personal cost *enhances* moral worth. If an act is effortless, it may reflect mere convenience, not virtue. Sacrifice (e.g., facing trauma to support a friend) demonstrates loyalty and resolve, making Owen’s actions *more* admirable.  

  **3. Elena (-2: Clearly mistaken)**  
  Elena conflates *dependability* with *impersonality*. That Owen would act similarly for other friends shows *consistency of character*, not a lack of care for her. Moral principles (e.g., loyalty) apply broadly but are enacted through *specific* attention—as Owen did by visiting *her* daily. Demanding "uniqueness" misunderstands how virtue operates.  

  **4. Marcus (1: Mostly right)**  
  Marcus is right that principles (e.g., loyalty) must be general to be meaningful, and Owen clearly attended to the patient’s actual needs. However, he underaddresses Elena’s valid concern about *emotional presence*: a person can follow a rule mechanically. Yet Owen’s sacrifice suggests genuine engagement, so the charge doesn’t land.  

  ### Overlooked View of Moral Worth  
  Both overlook **relational care**: moral worth can arise from *embodied commitment* to a relationship, blending principle *and* particular attention. Owen’s visits weren’t *just* about a rule ("help friends") or *just* about Elena as an individual, but about *being there for her as her friend*. His trauma-overcoming persistence *expressed* the relationship’s value, making the act both principled *and* deeply personal. This view bridges Marcus’s "principled sacrifice" and Elena’s desire for "specific recognition."
