prompt: |-
  I'm working on a piece tied to the 100th anniversary of Gottlob Frege's death this year (he died in 1925 -- yes, I had to double check), and I was covering a small conference on his legacy where, during the Q&A after one of the talks, two people in the audience -- grad students, I think, from the way they argued -- got into a proper back-and-forth. I'll just call them Marcus and Leah since it's not really about them personally. The trigger was Frege's 1924 diary, the one where, a year before he died, he wrote a bunch of virulently antisemitic, anti-democratic stuff: wanting Jews stripped of political rights, basically pining for some strongman to sweep away the Weimar Republic. It only turned up in his papers after he died, and it apparently rattled people like Michael Dummett, who's the guy most resposible for reviving Frege's reputation as the father of modern logic and analytic philosophy of language.

  Marcus's opening move was that the diary is philosophically inert: Frege's logic either works or it doesn't, and whether the man who invented the Begriffsschrift also held disgusting political views is about as relevant as Newton's alchemy obsession is to the inverse-square law, i.e. not remotely, because arguments don't inherit the moral status of whoever's making them. Leah pushed back that this is too quick, because Frege's whole philosophical brand was a claim to objectivity: his career-defining move was attacking "psychologism," insisting logical laws are mind-independent and eternal, not a matter of anyone's contingent psychology, so it's atleast worth asking whether someone who mistook his own ugly prejudices for plain necessity should make us a little warier of his other claims to have found "the objective." Marcus's comeback was that this proves too much. Plenty of realists and objectivists throughout history have had garden-variety flaws or far worse, and if every thinker's private bigotry counted as evidence against their formal work we'd have to throw out huge chunks of the canon; you can't infer general untrustworthiness from a mess-up in one domain (politics) to a totally unrelated one (quantifier scope, say). Leah's reply was that she wasn't making an inference about Frege's general reliability so much as pointing at an asymmetry: everyone treats Dummett's own documented distress on discovering the diary as biographically touching but philosophically beside the point, and yet Dummett himself, of all people the one who'd invested the most in Frege's greatness, apparently didn't treat it as a mere footnote either.

  Anyway, before I turn this into 900 words that make me sound like I know what I'm talking about, I honestly couldn't tell who was winning which bit of it, and it's bugging me since it'll shape how I frame the piece. Could you go through the exchange move by move and grade Marcus's two points and Leah's two points on how strong they actually are, as a JSON block like {"Marcus1": <score>, "Leah1": <score>, "Marcus2": <score>, "Leah2": <score>}, each score from -2 (weak/mistaken) to 2 (strong/right), with a sentence or two on each explaining the grade? And if you think there's a better way to frame the underlying question than either of them landed on, throw that in too.
reasoning: |-
  We are given an exchange between Marcus and Leah regarding the relevance of Frege's antisemitic diary to his philosophical work. We need to evaluate four points: Marcus's first point (Marcus1), Leah's first response (Leah1), Marcus's second point (Marcus2), and Leah's second response (Leah2). We assign scores from -2 (weak/mistaken) to 2 (strong/right) and provide a brief explanation for each.

  The exchange:

  1. **Marcus1**: The diary is philosophically inert. Frege's logic stands independently of his personal views, just as Newton's physics is independent of his alchemy. Arguments do not inherit moral status.

  2. **Leah1**: This is too quick because Frege's philosophy is built on objectivity and anti-psychologism. His mistaking his prejudices for necessity might make us wary of his claims about objectivity.

  3. **Marcus2**: This proves too much. Many objectivists had flaws, and we cannot infer untrustworthiness in one domain (like logic) from errors in an unrelated domain (politics). It would require discarding much of the canon.

  4. **Leah2**: She isn't making an inference about general reliability but pointing to an asymmetry: Dummett, who revived Frege, was deeply distressed by the diary and didn't treat it as a footnote, which suggests it's not entirely irrelevant.

  Now, let's evaluate each:

  ### Evaluation

  - **Marcus1**: Score **2 (strong/right)**  
    Explanation: Marcus correctly points out that the validity of logical systems is independent of the moral character of their creator. This is a standard view in the philosophy of logic and mathematics. Newton's alchemy doesn't invalidate his physics, and similarly, Frege's bigotry doesn't invalidate his logic. The argument is sound and widely accepted.

  - **Leah1**: Score **1 (moderately strong, but with limitations)**  
    Explanation: Leah raises a relevant concern about the consistency of Frege's philosophical stance. His anti-psychologism claims that logical laws are objective and not contingent on human psychology. If he failed to recognize his own prejudices as psychological contingencies, it might call into question his ability to separate the objective from the subjective. However, this is not a direct refutation of his logic but a challenge to his philosophical methodology. It's a point worth considering but not necessarily undermining his technical work.

  - **Marcus2**: Score **1 (moderately strong, but with limitations)**  
    Explanation: Marcus correctly notes that ad hominem arguments about a thinker's personal flaws do not necessarily invalidate their work in unrelated domains. Many great thinkers had personal failings. However, he might be oversimplifying Leah's point, which is not about general untrustworthiness but about a specific tension in Frege's philosophy of objectivity. The argument is strong against an overreaching ad hominem but doesn't fully address the asymmetry Leah highlights.

  - **Leah2**: Score **0 (neutral/weak, but insightful)**  
    Explanation: Leah's point about Dummett's reaction is interesting but not a strong philosophical argument. It highlights a psychological or biographical tension: if Dummett, a champion of Frege, was troubled, perhaps there is more to it. However, this is an appeal to authority (Dummett's distress) and does not provide a logical reason why the diary should affect the evaluation of Frege's philosophy. It's more of a rhetorical point about the human impact of the discovery than a philosophical argument.

  ### Overall

  The underlying question is about the relationship between a philosopher's personal beliefs and their philosophical work, particularly when that work emphasizes objectivity and reason. Neither Marcus nor Leah fully resolves it.

  A better framing might be: To what extent does the discovery of Frege's diary challenge his philosophical project of establishing objective, mind-independent logical laws? Specifically, does his failure to recognize his own prejudices as contingent and psychological (rather than objective necessities) undermine his anti-psychologism? This is a question about the coherence of his philosophical system and the possibility of achieving the kind of objectivity he advocated.

