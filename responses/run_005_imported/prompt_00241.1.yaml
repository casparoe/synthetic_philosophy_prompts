  I should also address the problem of goal preservation. If the AI switches to a surrogate, the original goal is still compromised. The defense is about deterrence, not preservation. The user's team needs to decide if that trade-off is acceptable. Maybe they need a strategy that allows partial goal achievement under threat, but that's more complex.

