  First, I need to recall the core game-theoretic principles behind surrogate goals. The key here is commitment strategies and credible threats. The classic example is Schelling's kidnapping scenario. The surrogate goal acts as a commitment device that makes certain threats ineffective. But why doesn't the attacker just target the surrogate? Because the AI is designed to not care about the original goal when the surrogate is threatened. That's the crucial point.

