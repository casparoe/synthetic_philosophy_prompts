answer: |-
  Here's a joke crafted for your scene, hitting the philosophical notes while landing for non-specialists and making a pragmatist groan:

  **Character A:** (Leaning in, with a slightly smug smile) "So, I heard you finally finished that book. Took you long enough. Still chasing that *pragmatic* truth, I see? Whatever 'works' for the moment, right? Pays off like a winning lottery ticket?"

  **Character B:** (Takes a slow sip of wine, meets A's gaze calmly) "Actually, I was just recalling how Peirce defined it. You know, truth isn't just what conveniently cashes out *tonight*..." (Character B gestures subtly around the dinner table) "...like claiming you'd *definitely* help with the dishes to avoid an argument *now*."

  **Character A:** (Eyes narrow slightly, caught off guard but trying to maintain composure) "And? What's his dusty old definition?"

  **Character B:** "Truth is the opinion *everyone* would finally agree on... **if we kept arguing about the dishes for the next million years.**"

  **Character A:** (Scoffs, trying to deflect) "Sounds impractical. And unnecessarily complicated."

  **Character B:** (Smiling faintly) "Exactly. That's why Peirce renamed his version '**pragmaticism**'. Figured if he made it sound like a skin condition, *some people* wouldn't be so tempted to steal it and water it down for quick party tricks."

  ### Why it works

  1.  **The Core Philosophical Contrast:**
      *   **James (Character A's implied view):** Truth = what "works" *immediately/practically* ("Pays off like a winning lottery ticket", "conveniently cashes out *tonight*", "avoid an argument *now*", "quick party tricks").
      *   **Peirce (Character B's defense):** Truth = the *ultimate, long-term consensus* reached through indefinite inquiry ("opinion *everyone* would finally agree on... **if we kept arguing about the dishes for the next million years**").
  2.  **The Historical Dig (Peirce's Renaming):**
      *   Directly references Peirce's annoyance ("some people wouldn't be so tempted to steal it").
      *   Explains *why* he chose "pragmaticism" ("sound like a skin condition").
      *   The punchline ("**pragmaticism**... sound like a skin condition") lands the historical fact in a relatable, slightly absurd way. Everyone understands making a word ugly to deter thieves.
  3.  **Accessibility:**
      *   Uses concrete, relatable metaphors: lottery tickets, party tricks, washing dishes, arguments, stealing, skin conditions.
      *   Doesn't rely on jargon ("cash-value", "inquiry", "community"). The concepts are explained through the examples.
      *   The dinner party setting provides the perfect context for the "washing dishes" example – immediate social convenience vs. a hypothetical, endless debate about fairness/obligation.
  4.  **The Groan Test (For Pragmatists):**
      *   A real pragmatist (especially a Peircean) would groan because:
          *   It accurately reduces the James/Peirce split to its core operational difference (immediate payoff vs. ultimate consensus).
          *   It perfectly captures Peirce's motivation for the ugly neologism "pragmaticism" and his frustration with James's popularization/misinterpretation.
          *   It frames James's view as shallow and opportunistic ("quick party tricks", "conveniently cashes out tonight"), which is precisely the caricature Peirceans object to.
          *   It uses a mundane example (dishes) that starkly illustrates the philosophical gulf. The groan comes from the painful accuracy wrapped in a slightly silly package.
  5.  **The "Dig":**
      *   Character A starts the dig by mocking "pragmatism" as shallow opportunism (attributing the Jamesian view to B).
      *   Character B flips it into a much deeper dig: not only defending the more rigorous Peircean view but *also* implying that A is exactly the kind of shallow thinker Peirce was trying to deter with the ugly name. B essentially calls A intellectually lazy and a philosophical thief. The final line is the real sting.

  **Delivery Tips:** Have Character B deliver the "million years" line with deadpan seriousness and the "skin condition" line with a dry, knowing finality. Character A should look momentarily flustered by the specificity of the "dishes" example (if it resonates with their past) and then increasingly annoyed/defensive. The surrounding dinner guests might chuckle awkwardly or miss the depth entirely, adding to the scene's tension.
