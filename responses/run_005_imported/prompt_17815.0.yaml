  Next, Fuller's eight principles of legality. Publicity, clarity, non-contradiction, feasibility, constancy, non-retroactivity, congruence, and official adherence. An opaque ML model directly violates publicity and clarity because defendants can't understand the rules applied. Congruence is also an issue since the announced rule (e.g., "risk score determines sentence") doesn't align with the hidden mechanics. Fuller would argue that such a system fails as law, becoming mere managerial direction or arbitrary control.

