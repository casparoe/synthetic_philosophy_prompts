answer: |-
  Your skepticism is well-founded—this is one of the deepest conceptual clashes in statistics. Let's dissect the mechanics and practical realities.

  ### Core Conceptual Divide
  - **Frequentism**: Defines error rates *before seeing data* via long-run behavior over hypothetical repetitions. The stopping rule changes the sample space, altering the sampling distribution.
  - **Bayesianism**: Updates beliefs *conditional on observed data*. The stopping rule doesn't appear in the likelihood function, so it doesn't affect the posterior.

  ### Mechanistic Explanation
  **Frequentist Failure:**
  Suppose you test \(H_0: \mu = 0\) vs \(H_1: \mu > 0\) with sequential data collection. You stop when \(p < 0.05\) or after \(n_{max}\) trials.  
  - **Problem**: The sampling distribution under \(H_0\) isn't Normal—it's skewed by "peeking." The true \(\alpha\) can inflate to >30% (e.g., [Armitage, 1975]).  
  - **Why?** You're not conditioning on \(n\); you're conditioning on the *event* "p<0.05 at some n." This creates multiple testing:  
    \[
    P(\text{reject } H_0 | H_0) = P\left( \bigcup_{n=1}^{n_{max}} \{T_n > c_n\} \right) > 0.05
    \]

  **Bayesian Claim:**
  For the same data \((n, \bar{x}_n)\), the posterior depends *only* on the likelihood \(P(\text{data} | \mu)\) and prior \(P(\mu)\). The stopping rule doesn't enter:  
  \[
  P(\mu | \text{data}) \propto P(\bar{x}_n | \mu, n) \cdot P(\mu)
  \]  
  Example: Coin flip experiment stopping when \(k\) heads observed.  
  - Likelihood remains \(P(k | p) = \text{Binomial}(k; n, p)\)  
  - Posterior depends only on \(k\), \(n\), and prior—*not* whether you planned \(n=20\) or stopped at \(n=15\) because \(k=12\).

  ### Why This Feels "Too Convenient"
  1. **The Intention Paradox**:  
     Frequentist inference depends on *counterfactuals* (what *might* have been done). If two researchers collect identical data but with different stopping intentions, frequentism gives different p-values. Bayesians argue this violates the **likelihood principle** (LP): identical data ⇒ identical evidence.

  2. **The Practical Catch**:  
     Bayesian immunity requires:
     - **Correct model specification** (likelihood + prior)
     - **Pre-specified prior** (not tuned to data)
     - **No model checking based on stopping rule**

  ### Where Bayesian Immunity Can Break Down
  | **Condition**                | **Holds?** | **Practical Reality**                                  |
  |------------------------------|------------|-------------------------------------------------------|
  | **Correct likelihood**       | Critical   | Model misspecification (e.g., non-normality) reintroduces stopping-rule dependence |
  | **Pre-specified prior**      | Critical   | Using default priors chosen *post hoc* compromises immunity |
  | **Proper priors**            | Necessary  | Improper priors (e.g., \(p(\mu) \propto 1\)) can make posteriors sensitive to stopping |
  | **Computational exactness**  | Important  | Approximate methods (e.g., variational Bayes) may reintroduce errors |

  ### Honest Assessment
  1. **Theoretical idealization holds**...  
     ...if you rigidly follow LP: With a pre-specified model/prior, Bayesian updating *is* immune to optional stopping. Simulations confirm this (e.g., [Rouder, 2014]).

  2. **But practicing researchers rarely satisfy assumptions**:  
     - **P-hacking with Bayes**: If you try multiple priors/models until "significant" \(BF>10\), you inflate false positives similarly to p-hacking.  
     - **Improper priors**: Common default priors (e.g., Jeffreys) can be problematic under optional stopping.  
     - **Model uncertainty**: Few researchers pre-specify models without exploratory adjustments.

  3. **Empirical reality**:  
     Studies show Bayesians *do* get misled by optional stopping when using default tools (e.g., JASP with uninformed priors). However, with cautious priors and pre-registration, Bayesian methods are *more robust* than frequentist ones.

  ### Bottom Line
  - **Yes**, the likelihood principle validly protects Bayesian inference *in theory*.  
  - **But**, it demands rigorous discipline: pre-specified models, justified priors, and no "hunting" for Bayes factors.  
  - **In practice**, optional stopping *can* distort Bayesian results when researchers deviate from ideal conditions—just less catastrophically than in frequentist methods.

  For irreproducible findings, **both frameworks suffer when abused**. The Bayesian advantage isn't magic—it's conditional on methodological integrity. Pre-registration benefits both paradigms.
