answer: |-
  Here is a eulogy that honors your grandmother's intellect, her legacy, and her honest wrestling with the big questions, crafted for both audiences:

  ---

  **For Grandma**

  Good morning. For those who don’t know me, I’m [Your Name], [Grandma's Name]’s grandchild. And for thirty years, for so many in this room, she was also simply “Doc” – the fierce, funny, unforgettable force who taught AP Psychology and led the Philosophy Club at [High School Name].

  If you sat in her classroom, even once, you know the line. You can probably hear her voice right now, demanding we repeat it together: **“Character is what you do when nobody’s grading you.”** It wasn’t just a slogan for her; it was the bedrock of her belief – her conviction that who we *are* deep down, our core virtues, mattered more than rules, more than consequences, more than any external pressure. She built her ethical world on that foundation: Virtue Ethics.

  Grandma loved a good argument. She thrived on wrestling with ideas. She didn’t just teach psychology; she lived it, breathed it, questioned it constantly. That’s why, in her final weeks with us, teaching one last time, her honesty struck me so deeply.

  She taught us about Milgram’s obedience experiments, where ordinary people followed orders to inflict pain. She taught us about Zimbardo’s Stanford Prison Experiment, where good students became cruel guards in just days. She taught us about seminary students, rushing past a man in distress because they were focused on giving a lecture *about the Good Samaritan*. These studies, part of the "situationist critique," scream a challenging truth: that circumstances – the situation we find ourselves in – can overwhelm our inner character, our supposed virtues, far more easily than we like to admit.

  And Grandma, the champion of inner character, looked at us – her students, her grandchild in that class – and said, quietly, unprompted, that she’d never found an answer to that critique, that fundamental challenge to her life’s philosophy, that she *truly believed*.

  She left us with that tension hanging in the air. She didn’t resolve it for us that day. And then, far too soon, she was gone before she could circle back.

  It would be easy today, comforting perhaps, to just declare that Grandma *was* that good character. And she was. Oh, she was. Anyone who knew her – whether as a demanding teacher, a devoted family member, a sharp-witted neighbor – saw her integrity, her kindness, her fierce loyalty. We saw the character.

  But to *only* say that feels… incomplete. It feels like skipping the last page of one of her lessons. Because Grandma taught us to *think*, to grapple with uncomfortable truths, to hold ideas with both conviction and humility. To ignore the profound question she left us with – the question she herself wrestled with honestly until the end – wouldn’t honor her. It wouldn’t be *her*.

  So how do we hold both? How do we honor the woman who built her life on the power of inner virtue, while acknowledging the terrifying power of circumstance that she couldn’t dismiss?

  Maybe the answer isn’t in declaring one side the winner. Maybe the answer is in the wrestling itself. Maybe it’s in recognizing that Grandma’s life *was* her most powerful argument.

  She spent decades creating a *situation* – her classroom, her club, this family, this community – deliberately designed to *nurture* character. A situation where curiosity was graded higher than rote answers, where questioning was encouraged, where “what you do when nobody’s grading” was the ultimate test. She poured herself into building environments where virtue *could* flourish, where the better angels of our nature felt safe to speak up.

  She understood the power of situation profoundly, not just as a critique, but as a call to action. Her answer wasn't just *having* character; it was the relentless, daily *work* of creating spaces – in a classroom, around a dinner table, in a quiet conversation – where character stood a fighting chance against the currents of conformity, haste, or fear.

  She taught us the ideal: “Character is what you do when nobody’s grading.” But she also lived the practical, necessary corollary: **“Build a world where character gets a fair grade.”**

  She built that world for us. She graded us, yes, on tests and papers. But more importantly, she created a space where we learned to grade ourselves by that higher standard she held so dear. And in her unflinching honesty about the forces that undermine character, she showed us the depth of her own.

  Grandma didn’t give us a neat answer to the tension between virtue and situation. She gave us something better: the courage to live honestly within that tension. She showed us how to build situations worthy of our best selves. She lived a life that proved, again and again, in countless ungraded moments, the profound power of trying.

  So, let’s honor her by holding both truths: the fragility of character in a harsh wind, and the undeniable strength of a character like hers, which spent a lifetime building shelters against that storm for everyone she loved.

  We’ll miss her voice, her wit, her fierce love, and the sound of her classroom repeating her creed. But the lesson – the complex, challenging, beautiful lesson of how she lived and how she taught us to think – that endures. Thank you, Grandma. We were listening. We are still listening.

  ---

  **Why this works:**

  1.  **Honors Her Legacy:** Starts with her famous line and core philosophy, anchoring everyone in what she stood for.
  2.  **Introduces the Tension Accessibly:** Explains the "situationist critique" using simple language ("circumstances," "overwhelm," "challenging truth") and relatable summaries of the studies, avoiding jargon. The phrase "fundamental challenge to her life’s philosophy" makes the stakes clear.
  3.  **Centers Her Honesty:** Highlights her admission as a sign of her intellectual integrity and courage, not a failure. "Unprompted" and "quietly" emphasize its authenticity.
  4.  **Acknowledges the Unresolved:** Explicitly states she left it hanging, validating the grandchild's experience and the core of the request.
  5.  **Finds Meaning in the Tension:** Instead of forcing an answer, it frames the *wrestling* as her legacy. It shifts the focus to how she *lived* within that tension.
  6.  **The Key Insight:** Connects her philosophy to her *actions* – she used her understanding of situational power *to create situations that fostered virtue*. This is the profound resolution: her life *was* the practical answer to the theoretical problem.
  7.  **Uplifting Conclusion:** Focuses on her enduring impact – teaching us to think, to build better environments, and to live honestly. The final lines are personal and warm.
  8.  **Balances Audiences:** The psychology is explained simply enough for non-students, while the references and depth will resonate powerfully with her former students. The core message about her character and impact is universal.
  9.  **Respectful Tone:** It treats her intellectual struggle with reverence, not as a debate to be won, but as part of her profound engagement with life.
  10. **Fits the Time:** This is concise enough for 5 minutes when delivered with appropriate pauses.

  This eulogy honors your grandmother not just as a good woman, but as the complex, thoughtful, and inspiring teacher and thinker she was, leaving her final lesson exactly where it should be: as an invitation to keep thinking and building, just as she did.
