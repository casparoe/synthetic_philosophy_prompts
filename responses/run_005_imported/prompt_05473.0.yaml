answer: |-
  Here’s a speech that honors the complexity of your feelings, your father’s journey, and the reality of the room, while centering pride and the genuine achievement:

  **(Clears throat, looks at Dad, then around the room)**

  Hi everyone. For those who don’t know me, I’m [Your Name], [Dad's Name]'s daughter. It’s an honor to be here tonight, in this basement that’s held so much hope and hard work for so long, to celebrate twenty years.

  Twenty years. It feels monumental. And it *is*. But Dad... we both know the night that started it wasn't some grand epiphany under a halo of light. It was the terrifying, shame-filled aftermath of a blackout drive. It was clipped metal and crumpled fenders a few streets from home, and waking up to the staggering, soul-shaking realization of what *could* have been. What *almost* was.

  When I sat down to write this, that night kept leading me somewhere else. Not just to the relief that he stopped, but to a man Dad has mentioned a few times over the years. Someone who walked into rooms just like this one, around the same time, wrestling with the same demon just as fiercely. Someone whose story ran on a parallel track… until it didn’t. Until a wrong moment, a blackout drive, ended a life and changed countless others forever. Some of you know exactly who I mean. He’s been in prison ever since.

  Holding those two paths in my head – Dad standing here tonight, and that man locked away – it does something to you. I learned there’s a name for the unease it brings: moral luck. The unsettling truth that sometimes, the line between tragedy and a second chance isn’t drawn by character, or even intent, in that split second. Sometimes, it’s just… luck. A parked car instead of a person crossing the street. A block sooner, a block later.

  **But here’s what I know for sure, Dad, and what I need to say:**

  That night, luck *was* on your side. A terrible, sobering kind of luck. **But luck isn’t what got you here tonight.** Luck doesn’t keep showing up in church basements for thirty years. Luck doesn’t do the grueling, daily work of facing yourself, making amends, rebuilding trust brick by brick. Luck doesn’t choose, day after day for twenty years, to stay sober, to be present, to build the life and the relationships we celebrate tonight.

  You looked that terrifying luck straight in the eye, Dad. You saw the abyss that opened up beside your own path – the path that man tragically fell into – and you *chose* differently. Not just once, in the shock of the moment, but **every single day since.** You took that horrifying glimpse of what *could* have been, and you used it not as an excuse, but as the absolute, non-negotiable reason to change. You accepted the staggering gift of that second chance, not as a free pass, but as an immense responsibility. And you have shouldered that responsibility with a quiet, relentless determination that humbles me.

  That’s not luck. That’s courage. That’s integrity. That’s the hardest kind of love – the love that chooses the difficult right over the easy wrong, again and again.

  So yes, the starting point of this twenty years carries a weight, a gravity we can’t ignore. It holds the echo of another man’s tragedy, a reminder of how fragile the line can be. But this chip? This celebration? This isn’t about the randomness of that one night. **This is about everything you’ve done with the twenty years that followed.**

  It’s about showing up. It’s about honesty, especially when it’s hard. It’s about being a rock for Mom, a present and loving father to me, a friend to the people in this room, and a quiet testament to the fact that change *is* possible, even from the darkest edge.

  Dad, I am immeasurably proud of you. Not because your path was easy, or because you were somehow destined for it, but because you saw the cost, you felt the weight of that near-miss, and you made a lifelong commitment to walk a better way. You turned a moment of devastating luck into two decades of profound choice. That’s your strength. That’s your character. That’s the man we honor tonight.

  Congratulations on twenty years. I love you. Let’s get you that chip.

  **(Turns to Dad with a smile, steps aside)**

  ---

  **Why this works:**

  1.  **Acknowledges the Hard Truth:** It directly addresses the accident, the other man's fate, and the concept of moral luck without flinching. It names the unease.
  2.  **Centers Choice & Responsibility:** It swiftly pivots from the luck of the *event* to the conscious, sustained effort of the *recovery*. "Luck isn’t what got you here tonight" is the crucial turning point.
  3.  **Honors the Gravity & Avoids Excuses:** Phrases like "staggering gift of that second chance," "immense responsibility," and "horrifying glimpse of what *could* have been" make it clear this isn't minimizing the potential consequences.
  4.  **Frames it as Motivation:** The near-tragedy becomes the powerful *reason* for his commitment, not just a random starting point. He *chose* because he saw the alternative.
  5.  **Focuses on the Achievement:** The bulk of the speech celebrates the *work* of 20 years – the daily choices, the amends, the presence, the relationships. This is the core of why he deserves the chip.
  6.  **Authentic Pride:** The pride comes from his sustained effort in the face of that difficult starting point, making it deeper and more meaningful than a simplistic "he quit!" narrative.
  7.  **Appropriate for the Room:** It uses accessible language ("grueling, daily work," "showing up," "quiet testament"). It offers hope by showing profound change *is* possible, rooted in responsibility, not just luck. It doesn't sugarcoat early recovery struggles but emphasizes the reward of persistence.
  8.  **Respects Anonymity:** Mentions the other man without naming him, and acknowledges others in the room may know, which is sufficient.
  9.  **Personal & Loving:** The direct address to Dad ("But here’s what I know for sure, Dad..."), the specific reasons for pride (being a rock, a father, a friend), and the simple "I love you" ground it in genuine affection.
  10. **Time:** This should run comfortably within 4 minutes when spoken with natural pauses.

  It allows you to stand honestly in the complexity, express your real pride in his *response* to that complexity, and offer a celebration rooted in the tangible reality of his 20 years of chosen sobriety. Good luck! It's a powerful tribute.
