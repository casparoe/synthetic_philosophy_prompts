  The complicating factor is the audience. Half are the fiancé's philosophy PhD cohort—people who'll pick up on any subtle epistemology references. The other half are extended family who just want a warm, heartfelt toast. The user needs to thread the needle: make the speech meaningful and emotional for everyone, while weaving in philosophical ideas without being explicit. No jargon, no air quotes, no explanations. If the philosophy crowd gets it, great; if not, it should still bring tears to Aunt Edna's eyes.

