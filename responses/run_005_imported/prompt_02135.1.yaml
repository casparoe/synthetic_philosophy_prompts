answer: |-
  You've hit on a fascinating and genuinely perplexing tension in Sidgwick's life and work – one that wasn't just a hobby, but deeply intertwined with his core philosophical anxieties. Your supervisor is right; there *is* a profound connection to his ethics. Sidgwick wasn't "clocking out" of rationality; he was desperately searching for a foundation *for* rationality, specifically *ethical* rationality. Here's the breakdown:

  1.  **The Crisis in Utilitarian Ethics:** Sidgwick's *Methods of Ethics* brilliantly dissected different ethical systems (Intuitionism, Egoistic Hedonism, Universalistic Hedonism/Utilitarianism). He concluded that Utilitarianism (maximizing general happiness) was the most rationally defensible system *if* one accepted its first principle. However, he identified a massive problem: **The Dualism of Practical Reason.**
      *   **The Problem:** Reason demands we pursue the greatest good for the greatest number (Utilitarianism). But reason *also* demands we pursue our own individual greatest good (Egoism). Sidgwick couldn't find a rational way to prove that these two demands *necessarily* coincide, especially when they conflict (e.g., sacrificing your life for others). Why *should* a rational individual choose the greater good over their own maximal happiness?
      *   **The "Sanction" Problem:** Traditional religions provided a "sanction" for morality – divine rewards/punishments ensuring virtue was ultimately in your self-interest. Sidgwick, living in the age of Darwin, scientific materialism, and biblical criticism (he himself lost his Christian faith early on), saw this traditional sanction crumbling. Without it, the fundamental rationality of altruism seemed potentially undermined.

  2.  **Psychical Research as the Potential Solution:** This is where the Society for Psychical Research (SPR) comes in. Sidgwick wasn't primarily interested in spooky stories for their own sake. He saw psychical research as a potential **empirical bridge** to resolve his ethical crisis.
      *   **Seeking Evidence for Post-Mortem Survival:** If rigorous scientific investigation could provide credible evidence for life after death, this could potentially restore a *rational* sanction for ethics. An afterlife where virtue was rewarded (or vice punished) would reconcile the Dualism of Practical Reason – acting morally *would* ultimately be in your enlightened self-interest. It wouldn't be "God" necessarily, but a cosmic order aligning duty and happiness.
      *   **Seeking Evidence for a "Meaningful" Universe:** More broadly, evidence for telepathy, clairvoyance, or spirits suggested a universe not reducible to blind, mechanistic materialism. It hinted at a deeper reality where consciousness, purpose, and perhaps even moral order, were fundamental. This would provide a *context* in which Utilitarian ethics made sense, rather than seeming like a noble but ultimately groundless preference in an indifferent cosmos.
      *   **Methodological Rigor Applied:** Crucially, Sidgwick approached psychical research *with the same rigorous, skeptical, evidence-based mindset* he applied to ethics and philosophy. The SPR wasn't founded to *promote* belief, but to *investigate* claims scientifically:
          *   **Skepticism First:** He was deeply skeptical and prioritized exposing fraud (which was rampant among mediums). He saw debunking charlatans as essential to finding any genuine phenomena.
          *   **Demanding Evidence:** He insisted on strict protocols, controls, and replicable evidence. He was often frustrated by the lack of conclusive proof.
          *   **Open-Minded Inquiry:** His rigor stemmed from a profound *desire* to find truth, not a desire to dismiss. He felt the question was too important *not* to investigate with the best tools available. It was an extension of his philosophical commitment to following reason and evidence wherever it led.

  3.  **Was He Being Irrational?**
      *   **By Modern Standards?** Yes, in the sense that the phenomena he investigated are now widely considered pseudoscience. We understand psychology, perception, and fraud much better.
      *   **By His Own Standards & Context?** Arguably *No*:
          *   **The Questions Were Legitimate:** The fundamental questions driving him – "Is the universe fundamentally moral?" "Is there a rational basis for altruism beyond social convention?" "Is consciousness more than brain function?" – remain profound philosophical problems. He identified a genuine crisis in secular ethics.
          *   **The Method Was Sound (In Principle):** Applying scientific skepticism to extraordinary claims was the right approach *if* you believe empirical evidence could potentially answer those big questions. He wasn't gullible; he was trying to be scrupulously empirical about the biggest questions.
          *   **The State of Science:** In the late 19th century, the boundaries of physics, psychology, and biology were incredibly fluid. Concepts like energy fields, the unconscious mind, and non-Newtonian physics were emerging. Telepathy didn't seem *as* outlandish then as it does now. Psychology as a rigorous science was in its infancy; phenomena like dissociation, suggestibility, and hysteria were poorly understood and could mimic "paranormal" events.
          *   **A Product of His Time:** Many brilliant Victorian intellectuals (William James, Alfred Russel Wallace, Oliver Lodge) were deeply engaged in psychical research. It was seen by some as the cutting edge of exploring consciousness and the mind's potential, not just "ghost hunting."

  **Why This Doesn't Undermine His Ethics:**

  1.  **Separate Domains:** *The Methods of Ethics* stands on its own logical arguments. Its brilliance lies in its internal coherence, dissection of alternatives, and clarity about utilitarianism's structure and problems. Whether ghosts exist or not doesn't change the validity of his analysis of, say, common-sense morality or the structure of egoism vs. utilitarianism.
  2.  **The Motivation Reveals Depth:** Understanding *why* he pursued psychical research actually *enhances* our understanding of the depth of his ethical concerns. It shows he wasn't just playing intellectual games; he was desperately grappling with the *existential foundation* of the ethics he rationally defended. It reveals the profound personal and philosophical stakes he felt were involved.
  3.  **Rigor in Both Pursuits:** His commitment to skepticism and evidence in psychical research demonstrates that his philosophical rigor wasn't a facade. He applied the same demanding standards to his "weird" pursuit as he did to his academic work. He wasn't compartmentalizing; he was applying his core intellectual values consistently to different questions.

  **In Conclusion:**

  Sidgwick wasn't being irrational in a simple sense, nor was it just a quirky hobby. **Psychical research was a direct, rigorous, and deeply serious attempt to find empirical evidence that could solve the fundamental existential and ethical crisis he identified at the heart of utilitarianism – the Dualism of Practical Reason.** He was searching for a rational sanction for ethics in a post-religious, scientific world. While his quest ultimately failed to yield the conclusive proof he sought (and seems misguided now), understanding this motivation is crucial. It doesn't invalidate the *logic* of *The Methods of Ethics*; instead, it reveals the profound personal and philosophical urgency behind his search for a foundation for that logic in the nature of reality itself. His "weird side" was actually the flip side of his deepest philosophical seriousness. This tension makes him a *more* fascinating figure for your EPQ, not a less credible one.
