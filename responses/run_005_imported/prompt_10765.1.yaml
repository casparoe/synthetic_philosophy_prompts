answer: |-
  ## Memorandum: Recommendations for Faculty Evaluation Policy Reform  
  **To:** Teaching Effectiveness Committee  
  **From:** [Your Name], Contingent-Faculty Representative, MFA Program  
  **Date:** October 26, 2023  
  **Subject:** Revised Approach to Student Evaluations in Contract Renewal Decisions  

  ### I. The Core Problem: Context Matters More Than a Single Number
  Our current policy’s reliance on a **university-wide average (3.5/5)** as a renewal trigger is statistically flawed and fundamentally unfair. As the data demonstrates, **course context significantly skews evaluation scores**:
  *   Adjuncts teach 78% of large introductory sections (avg. rating: 3.1-3.3).
  *   Tenure-line faculty teach 85% of small upper-level electives (avg. rating: 4.2-4.4).
  *   **Simpson’s Paradox occurs because aggregating these distinct groups masks the underlying context:** Adjuncts perform comparably to tenure-line peers *within the same course level*, but their disproportionate assignment to low-scoring courses depresses their overall average.

  The 3.4 vs. 3.9 disparity is **primarily an artifact of workload distribution, not inherent teaching quality**. Applying the 3.5 cutoff university-wide penalizes adjuncts for structural factors beyond their control.

  ### II. Addressing the Selection-Effect Concern
  The valid counter-argument – that chairs *might* assign "weaker" instructors to intro courses – cannot be dismissed outright. However, our policy must address **measurable realities, not unproven assumptions**:
  1.  **No Evidence of Systematic Steering:** We lack data showing chairs consistently assign lower-performing adjuncts to intro courses based on *anticipated* poor evaluations. Assignment decisions are driven by seniority, specialization, scheduling, budget (adjunct cost), and departmental need – not primarily by pre-judged teaching "weakness."
  2.  **The Burden of Proof:** If the university believes chairs *are* using assignments this way, it must first *prove* this practice exists and is widespread *before* using it to justify penalizing faculty. We cannot assume bias to validate a biased metric.
  3.  **Intro Courses Are Not "Easier":** Teaching large, mandatory intro sections effectively requires distinct, often *more demanding*, pedagogical skills (classroom management, engaging diverse learners, foundational knowledge transmission). Success here is a mark of strength, not a refuge for weakness.
  4.  **Mitigation, Not Ignoring:** Our revised approach (below) incorporates safeguards against *potential* selection effects without accepting the raw average as "truth."

  ### III. Recommendations: A Fairer, More Nuanced System
  We propose replacing the university-wide average threshold with a **multi-faceted, context-sensitive approach**:

  1.  **Implement Course-Level Adjusted Scores:**
      *   Calculate average evaluation scores **separately for distinct course categories** (e.g., Large Intro Lecture (100+), Small Intro Seminar (<30), Upper-Level Core, Advanced Elective). Use historical data (3-5 years) to establish stable benchmarks *within each category*.
      *   **Recommendation:** An instructor’s primary evaluation metric becomes their **performance relative to the historical benchmark *for the specific course types they taught***. (e.g., "Adjunct A taught Large Intro Lectures scoring 3.4, exceeding the category benchmark of 3.2").
      *   *Addresses Simpson's Paradox:* This directly accounts for the context driving score variation.
      *   *Mitigates Selection Effect:* If an instructor is consistently assigned to a category and performs well *within that challenging context*, it demonstrates competence. Consistently poor performance *relative to peers teaching the same course type* is a clearer signal of concern than a raw average dragged down by the course type itself.

  2.  **Require Multi-Semester Data for Decisions:**
      *   **Recommendation:** Base renewal decisions on **evaluation data from at least 3 consecutive semesters** (or the instructor’s full contract period, if longer). Do not rely on single-semester scores.
      *   *Addresses Small Sample Sizes/Volatility:* Trends over time are more reliable and less susceptible to the quirks of one small class or one difficult semester.
      *   *Mitigates Selection Effect:* A sustained pattern of underperformance *relative to course-type benchmarks* across multiple assignments provides stronger evidence of a genuine issue than a single low raw average.

  3.  **Supplement with Qualitative & Peer Review:**
      *   **Recommendation:** **Never use evaluation scores as the sole criterion.** Mandate inclusion of:
          *   **Chair/Coordinator Assessment:** Based on classroom observations, syllabus/course design review, and knowledge of student cohort challenges.
          *   **Peer Observation (Optional for Renewal, Mandatory for PIP):** A brief, structured observation report from a tenured/tenure-track colleague focused on specific teaching practices.
          *   **Instructor Reflection:** A short statement from the instructor contextualizing their evaluations and goals.
      *   *Addresses All Concerns:* Qualitative input provides crucial context missing from numbers. It directly addresses whether perceived issues are due to teaching quality, assignment difficulty, or external factors. Peer observation specifically counters potential chair bias.

  4.  **Redefine the "Trigger" Threshold:**
      *   **Recommendation:** **Eliminate a single university-wide numerical cut-off.** Instead, define a **"Review Threshold" based on course-adjusted scores.**
          *   An instructor consistently scoring **significantly below (< 0.3 points) the historical benchmark *for their assigned course types*** over multiple semesters triggers a **mandatory, supportive review process** (not automatic non-renewal). This review uses *all* evidence (scores, chair assessment, peer observation if available, reflection) to determine if a formal Teaching Improvement Plan (TIP) is warranted.
      *   *Addresses Fairness & Nuance:* Focuses on underperformance *relative to the specific teaching context*, not an arbitrary absolute number. Shifts the focus from punishment to identification and support.

  ### IV. Policy Revision & Timeline
  *   **Immediate Suspension:** Suspend the use of the university-wide 3.5 average as a contract renewal trigger effective immediately for Spring renewals.
  *   **Pilot & Refine:** Implement the **course-level adjusted score analysis** using existing historical data starting with Spring 2024 renewal decisions. Use this cycle to refine the course categories and benchmarks. Incorporate the **multi-semester requirement** and **qualitative supplement** immediately.
  *   **Formal Adoption:** Draft revised policy language incorporating Recommendations 1-4 for full committee vote by end of Spring 2024 semester, effective for AY 2024-25 contracts.
  *   **Audit Assignment Practices:** The University should concurrently audit departmental assignment practices to ensure transparency and fairness, addressing the *root* of the selection-effect concern.

  ### V. Conclusion
  Our goal is an evaluation system that **accurately identifies instructors needing support** while being **fair to those excelling in challenging teaching assignments**. The current policy fails on both counts. The proposed approach acknowledges the statistical reality of Simpson’s Paradox through course-level adjustment, mitigates potential selection effects through multi-semester data and qualitative review, and replaces a blunt numerical cutoff with a nuanced, evidence-based review process. This creates a fairer system for contingent faculty *and* strengthens our commitment to genuine teaching effectiveness for all students, regardless of course level.

  **Recommendation Summary:** Suspend the 3.5 university-wide threshold. For Spring 2024 renewals, use course-level adjusted scores, multi-semester data, and qualitative input for holistic review. Adopt a formal policy based on this framework for AY 2024-25.  

  Respectfully submitted,  
  [Your Name]  

  ---

  **Key Strengths for Your Committee/Dean:**
  *   **Confronts Simpson's Paradox:** Directly uses course-level adjustment as the core solution.
  *   **Engages Selection Effect:** Doesn't dismiss it; offers concrete mitigations (multi-semester trends, peer/chair input) and shifts the burden of proof.
  *   **Solves Small-Sample Worry:** Mandates multi-semester data.
  *   **Dismantles the Damning 3.4 vs. 3.9:** Explains *why* it happens and why it's misleading.
  *   **Actionable & Phased:** Clear, immediate steps (suspend old rule, pilot adjustment) + longer-term policy revision.
  *   **Humanist-Friendly:** Avoids complex stats; uses clear reasoning, analogies ("context matters"), and plain language. Focuses on fairness and practical evidence (chair/peer input).
  *   **Defensible:** Balances statistical rigor with qualitative nuance. Shifts focus from punitive cutoff to supportive review. Addresses the core complaint (unfair penalization for teaching intro courses) directly.
  *   **Protects Your Time:** Provides a ready-made, logically sound memo. Now go finish that novel.
