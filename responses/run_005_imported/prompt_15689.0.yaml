prompt: |-
  I'm one of five people on my engineering org's committee that decides who gets promoted to Staff Engineer. Our rubric has two dimensions, 'technical depth' and 'organizational influence,' each decided by majority vote among the five of us, and a candidate is promoted only if both pass. On our latest candidate, two of us judged she cleared both dimensions, one judged she cleared depth but not influence, one judged the reverse, and one judged she cleared neither -- so, dimension by dimension, three of five of us credit her with depth and three of five credit her with influence, and by the rubric she's promoted. But when I polled the five of us directly on whether she should be promoted, only the two who credited her with both dimensions said yes; the other three said no. Three of us, including me, want to keep deciding dimension-by-dimension, since it's auditable and ties the outcome to stated criteria rather than gut feeling; the other two want to just poll overall judgment directly, since it seems indefensible to promote someone that a majority of us, individually, don't think has earned it. I need to circulate the committee's written rationale before we finalize this promotion cycle on Friday, and whatever reasoning I write will likely set the default for every future split decision -- please draft that memo: it should say plainly what happens to this candidate, recommend which procedure we adopt going forward, and take the losing side's argument seriously rather than wave it away.
reasoning: |-
  Okay, let me understand this situation. There's a committee of five people deciding promotions to Staff Engineer. The current rubric requires majority approval on two dimensions: technical depth and organizational influence. For this candidate, three members approved technical depth, and three approved organizational influence, so by the rules, she should be promoted. However, when polled directly on whether to promote her, only two said yes; three said no. 

  The user is caught in a procedural dilemma. Three members (including the user) want to stick with the dimension-by-dimension approach because it's auditable and criteria-based. The other two want direct polling, arguing it's contradictory to promote someone a majority opposes. The user needs to draft a memo that resolves this candidate's case, sets a future precedent, and respectfully addresses both viewpoints—by Friday.

  Hmm, the core tension is between objective criteria and holistic judgment. The dimension-based method prevents bias but risks promoting someone who doesn't feel "ready" to most voters. The direct-poll method values consensus but could introduce subjectivity, making promotions harder to audit. 

  I should note the committee's own votes reveal cognitive dissonance: the member who said "yes" to both dimensions logically must support promotion, while the three "no" voters include contradictions (e.g., one rejected only influence but voted no overall). Only the member who rejected both dimensions is internally consistent. This suggests some voters aren't separating dimensions mentally—a problem if the rubric relies on that separation.

  For the memo, I need to:
  1. Declare the candidate promoted under current rules (since votes met the rubric).
  2. Recommend keeping dimension-based voting but adding a safeguard, like requiring dimension consensus or clarifying voter intent.
  3. Acknowledge the losing side's concern: promotion without majority support feels illegitimate, and the rubric might not capture "whole picture."
  4. Propose a review process for future rubric refinements.

  The solution should honor the current outcome while preventing similar conflicts. Maybe a revote isn't fair, but for future cases, adding a clause like "no dimension majority opposition" could help. Also, training voters to decouple dimensions might reduce mismatches. 

  The tone must be diplomatic—no vilifying either side. Phrases like "valid concern" and "structural tension" can validate dissent without undermining the decision. And since the user is on the dimension-based side, the memo shouldn't gloat; it should frame the compromise as strengthening the system.
answer: |-
  ## Memorandum: Promotion Decision Protocol & Candidate Outcome  

  **To:** Engineering Promotion Committee  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Resolution of Promotion Criteria Tension & Path Forward  

  ### I. Decision for Current Candidate  
  **Per our established rubric**, Candidate X has met the promotion criteria:  
  - **Technical Depth**: Approved by 3 of 5 members.  
  - **Organizational Influence**: Approved by 3 of 5 members.  
  Thus, **Candidate X will be promoted** in accordance with our predefined process.  

  This outcome is consistent with our commitment to auditable, criteria-driven decisions. While only two members explicitly endorsed promotion overall, the rubric’s structure—requiring separate majority approval on each dimension—was satisfied. We honor the system we designed.  

  ---

  ### II. Addressing the Procedural Debate  
  We recognize two valid perspectives:  
  **A. The Case for Dimension-Based Voting (Current System)**  
  *Advocated by 3 members, including myself.*  
  - **Strengths**:  
    - Ensures decisions align with **specific, measurable competencies** (depth/influence), not subjective "gut feeling."  
    - Provides **auditability** and **consistency**; future committees can replicate the process.  
    - Prevents strong feelings on *one* dimension from overriding strength in another.  
  - **Weakness Exposed**:  
    - A candidate can pass both dimensions *without* earning majority confidence in their *overall readiness*. This creates perceived legitimacy gaps.  

  **B. The Case for Direct Promotion Voting**  
  *Advocated by 2 members.*  
  - **Strengths**:  
    - Reflects **holistic judgment**; Staff Engineer is a unified role, not a sum of parts.  
    - Ensures promotion requires **explicit majority endorsement**, avoiding dissonance.  
  - **Weakness Exposed**:  
    - Risks inconsistency and opacity. Without anchored criteria, biases may influence decisions, making rationale harder to defend or audit.  

  **The Tension Is Real**:  
  Both sides seek rigor and fairness. Dimension-based voting prioritizes **objective criteria**, while direct voting prioritizes **consensus legitimacy**. Neither is inherently wrong, but our current system is documented—and we applied it faithfully here.  

  ---

  ### III. Recommended Path Forward  
  **We will retain dimension-based voting** for future cycles—**with critical refinements**:  
  1. **Clarify Voter Intent**:  
     - Committee members **must** vote on dimensions *independently*, setting aside overall sentiment. Training will reinforce this.  
     - *Example*: If you believe a candidate lacks "overall readiness" but meets *both dimensions*, you must still vote "yes" on dimensions.  

  2. **Add a Tiebreaker Safeguard**:  
     - **New Rule**: If a candidate passes both dimensions *but* lacks majority approval in a direct promotion vote, we will:  
       - Hold a **revote on dimensions** after 24 hours (allowing reflection).  
       - If dimensions still pass, **escalate to the Engineering Director** for final review.  
     - *Why?* This addresses "legitimacy gap" concerns while preserving criteria-based assessment. The Director reviews documentation only (no new evidence).  

  3. **Annual Rubric Review**:  
     - Re-evaluate dimensions quarterly. Are "depth" and "influence" still the right pillars? Should we add a third dimension (e.g., "leadership")?  

  ---

  ### IV. Why This Balances Both Concerns  
  - **Upholds auditability** by keeping core dimensions.  
  - **Acknowledges holistic judgment** via the Director escalation safeguard.  
  - **Prevents stagnation**: Candidates strong in both dimensions won’t be blocked by arbitrary overall vetoes.  
  - **Builds trust**: Losing side’s concern—that promotion without majority support feels unjust—is mitigated by the review step.  

  ### V. Final Rationale for Candidate X  
  Candidate X met the bar defined by our rubric. While divergent overall opinions exist, her promotion stands as a testament to our commitment to process. Our refinements ensure future candidates benefit from both rigorous criteria *and* collective confidence.  

  We finalize this decision Friday. Please reply with feedback on the proposed protocol by 5 PM tomorrow.  

  —  
  **Respectfully submitted,**  
  [Your Name]
