prompt: |-
  My podcast's guest next month is a Kierkegaard scholar who's basically built her whole media presence on the line that Two Ages "predicted Twitter" -- every interview she does eventually gets there. I'd like to get through an hour without it just being that. Give me 8-9 interview questions that go past the prophecy angle into the actual argument: at least one on the difference between leveling and mere equality, one on why "the public" is supposed to be worse than an actual assembly or association of people who stand for something, one on how much of the diagnosis depends on anonymity and print specifically rather than being a point about idle chatter as such, and one that presses on the Corsair affair -- is that a diagnosis of the age or a literary grudge dressed up as one? Give each question a short follow-up keyed to the answer shes most likely to give, and make the last one test whether the social-media analogy survives the disanalogies (solitary reading and daydreaming vs. an interactive, algorithm-fed feed).
