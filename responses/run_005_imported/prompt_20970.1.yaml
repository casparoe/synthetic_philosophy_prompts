  The hole argument shows that if spacetime points have independent identities (substantivalism), general covariance leads to indeterminism in empty regions. That's problematic because physics should be deterministic where possible. Earman and Norton use this to argue against substantivalism. But there are responses, like sophisticated substantivalism, which denies primitive identities for points. Relationism avoids this by defining spacetime through relations between events.

