  So I've been reading up on Frederick Douglass on my own time (no history degree, just curious) and got to his "What to the Slave is the Fourth of July" speech. He absolutely rips into the idea that America stands for freedom, and lumps the Constitution in with all the hypocrisy, kinda like Garrisons "covenant with death" line. Since he was clearly that disillusioned with the Constitution already by 1852, I'm wondering what finally made him give up on legal/constitutional arguments against slavery for good and just stick to moral appeals for the rest of his career?
