answer: |-
  Here’s the strongest possible deflationary case, rigorously engaging with Sober and Wilson’s averaging fallacy objection. The core argument hinges on **causal completeness**, **supervenience**, and **explanatory parsimony**, using the formal equivalence as its foundation.

  ### Step 1: Establish Formal Equivalence as Ontologically Neutral
  Kerr & Godfrey-Smith (2002) demonstrate that for any evolutionary change in a structured population:
  - The **multilevel (MLS) model** partitions change via Price:  
    *Δz̄ = Cov(Wᵢ, zᵢ) + E[Cov(wⱼ, zⱼ)ᵍᵣₒᵤₚ]*  
    (Between-group selection + average within-group selection).  
  - The **individualist contextual (IC) model** expresses fitness *wᵢ* as:  
    *wᵢ = f(zᵢ, Z₋ᵢ, E)*  
    where *zᵢ* = individual trait, *Z₋ᵢ* = group context (e.g., group mean trait), *E* = environment.  
  **Crucially**: Both models yield identical *Δz̄* predictions for any dataset.  

  This isn’t mere "relabeling"—it’s a mathematical proof that the *total causal structure* of selection is fully captured by individual fitness functions incorporating local context. The models are empirically indistinguishable, violating a key criterion for ontological realism (Quine-Putnam indispensability).

  ---

  ### Step 2: Deflating the "Averaging Fallacy" Objection
  Sober & Wilson argue that IC models commit an "averaging fallacy" by folding between-group selection into individual fitness. Their claim: 
  > *"Group selection is causally real because group properties (e.g., altruism frequency) non-trivially affect individual fitness, and MLS exposes this causal structure while IC obscures it."*  

  **Deflationary rebuttal**:  
  1. **Causal Sufficiency of IC**:  
     - In the IC model, *wᵢ* explicitly depends on *Z₋ᵢ* (e.g., group mean altruism). This *directly* represents how group composition affects individual fitness.  
     - Example: An altruist’s fitness *wᵢᴬ* = *f(zᵢᴬ, proportion_altruists)*. If groups with more altruists have higher *mean fitness*, this is captured by the *Z₋ᵢ* term.  
     - **Key point**: No group-level "causal residue" exists. *All fitness-affecting factors* (individual trait, social environment, resources) are encoded in *f(zᵢ, Z₋ᵢ, E)*. Calling *Z₋ᵢ* "group selection" adds nothing causally.  

  2. **Supervenience Neutralizes Causal Autonomy**:  
     - Group properties *supervene* on individual properties: Fix all individual traits (*zᵢ*) and environmental facts (*E*), and group properties (*Z₋ᵢ*) are fixed.  
     - Thus, any "group effect" is *exhausted* by individual traits and their spatial configuration. IC models include this configuration via *Z₋ᵢ*. Positing an *additional* group-level causal force violates Occam’s razor—it’s redundant.  

  3. **The Fallacy in the "Fallacy"**:  
     - Sober & Wilson confuse *convenience* with *causal necessity*. While MLS partitioning is useful heuristically (e.g., identifying when group composition drives change), it doesn’t reveal "hidden" causality.  
     - **Analogy**: Consider Newtonian gravity. You can decompose planetary motion into "sun-induced acceleration" + "planet inertia." But this doesn’t mean inertia is a distinct causal force—it’s a mathematical partition of *F=ma*. Similarly, between-group covariance is a statistical artifact of individual fitness dependencies.  

  ---

  ### Step 3: Addressing Sober & Wilson’s Key Examples
  #### Case 1: Altruism Evolution  
  - **MLS view**: Altruism evolves via between-group selection overpowering within-group selection.  
  - **IC view**: Altruists have low *wᵢ* when rare in a group (suffering costs without partners) but high *wᵢ* in altruism-rich groups (gaining benefits).  
  - **Deflationary take**: Both describe identical dynamics. The IC model *directly* shows that altruism’s success depends on *non-random assortment* (clustering with other altruists)—a property fully specified by *Z₋ᵢ*. No group "selection" beyond individual fitness in structured contexts is needed.  

  #### Case 2: Averaging ≠ Concealing Causality  
  - S&W claim IC "hides" group effects by averaging. But:  
    - **Causal graph symmetry**:  
      - MLS: *Group trait → Group fitness → Individual fitness*  
      - IC: *Individual trait + Group trait → Individual fitness*  
    - Both graphs imply identical conditional dependencies. The IC graph is *causally sufficient*—no arrow from "group fitness" adds information.  

  ---

  ### Step 4: The Epistemic Knockout Punch  
  If two models:  
  (A) Make identical predictions in all scenarios,  
  (B) Are mutually translatable (via Price partitioning/aggregation),  
  (C) Share the same causal dependencies (as per structural equations),  
  —then **no experiment can distinguish which is "real."** Insisting group selection is ontologically distinct becomes scientifically vacuous.  

  ### Conclusion: Why Deflation Wins  
  The equivalence isn’t just mathematical—it reflects that **selection acts on individuals situated in environments**. "Group effects" emerge from how individuals interact spatially/temporally. The IC model captures this without reifying groups as causal agents. Sober & Wilson’s "averaging fallacy" is itself fallacious: IC models don’t average away causality; they *embed* group effects in contextual variables, providing a leaner ontology. For a working geneticist, this isn’t philosophy wordplay—it’s recognizing that causality resides in the fitness-affecting parameters (individual + context), not in how we partition variances.  

  *Recommended next step: Examine Waters (2005) on "causal exclusion" in hierarchies, which formalizes why adding group selection violates causal parsimony when IC suffices.*
