  For point 1: Frank's emphasis on fixists' conceptual toolkit is strong Kuhn. But I should note Jeffreys might be an extreme case - Kuhn himself warned against taking incommensurability as total untranslatability. Carol's counter in point 2 rightly highlights the field's relatively swift convergence, which feels un-Kuhnian. However, her dismissal of Jeffreys as mere conservatism overlooks how his rigid-mantle framework made convection literally inconceivable.

