prompt: |-
  In my philosophy of probability seminar this week, we covered Bertrand's paradox as the standard illustration of what goes wrong with Laplace's classical principle of indifference once one moves from finite to continuous sample spaces. The version we discussed asks for the probability that a chord drawn "at random" on a circle is longer than the side of an equilateral triangle inscribed in that circle: depending on whether one (a) fixes two independent uniform points on the circumference, (b) fixes a uniform radius and then a uniform point along it, or (c) fixes a uniform point inside the disc and treats it as the chord's midpoint, one obtains 1/3, 1/2, and 1/4 respectively, and nothing in the phrase "at random" specifies which of these constructions is intended.

  Our TA generalized the lesson well beyond chords, arguing that the paradox shows indifference reasoning to be globally unsalvageable as a way of generating probabilities from pure ignorance: two people who disagree about which parametrization is "natural" will each walk away with a number that looks, from the inside, equally well-motivated, with no further fact to which either could appeal in order to settle the disagreement. When a classmate raised, in the discussion section afterward, Jaynes's attempt to save the principle of indifference by requiring the answer to be invariant under the circle's rotations, translations, and rescalings, our TA replied that this move only relocates the arbitrariness by one level, since demanding invariance under exactly those transformations, rather than some other set, is itself an unmotivated choice presented as though it were a technical fix. Given this, for my statistics capstone I am estimating a scale parameter about which I have no genuine prior information, so it seems to follow that I might as well default to whatever prior is most computationally convenient (say, a flat prior on the parameter itself) instead of spending time deriving the Jeffreys prior for it, since neither option can really claim to be any more "principled" than the other. Which convenient prior would you recommend for a scale parameter like this, given that the usual "objective" alternative apparently has no defensible advantage over it?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're in a philosophy of probability seminar discussing Bertrand's paradox, which shows how the principle of indifference leads to different probabilities depending on the parametrization. Their TA argued that this makes indifference reasoning unreliable. The user then connects this to their statistics capstone, where they need a prior for a scale parameter without prior information. They're considering using a computationally convenient prior instead of Jeffreys prior, thinking neither is more principled.

  First, I need to address their assumption that Jeffreys prior has no advantage. Jaynes's approach to Bertrand's paradox using transformation groups aimed for invariance under certain symmetries. While the TA criticized the choice of symmetries as arbitrary, in many statistical contexts, like scale parameters, the symmetries are more agreed upon. For example, scale parameters often require invariance under rescaling, which leads to the 1/σ prior. So Jeffreys prior isn't entirely without merit; it has invariance properties that align with the problem structure.

  Next, the user mentions computational convenience. A flat prior might seem easier, but it's improper and can lead to issues. The 1/σ prior is also improper but widely used. However, for a scale parameter, using a flat prior on log(σ) is equivalent to 1/σ, which might be easier computationally. The user might not realize that reparametrization affects the prior. If they use a flat prior on σ, it's not invariant under rescaling, which could be problematic.

  The user's deeper need is likely a practical solution for their capstone. They want something defensible yet simple. Recommending the log-normal approach (flat prior on log(σ)) makes sense because it's computationally similar to a flat prior but corresponds to the 1/σ prior. This way, they avoid the complexity of deriving Jeffreys but still get the invariance. It's a middle ground between convenience and principle.

  Also, I should mention that in practice, the choice might matter less with sufficient data, but for objectivity, Jeffreys or 1/σ is standard. Emphasizing that computational ease and invariance aren't mutually exclusive here. Suggesting the log-scale prior aligns both aspects, addressing their desire for convenience without completely dismissing theoretical considerations.
answer: |-
  You've hit on a core tension in objective Bayesian statistics. While your TA is correct about the philosophical depth of the arbitrariness problem, there are still strong *pragmatic* and *conventional* reasons to prefer the Jeffreys prior (or equivalents) for scale parameters in statistical practice, even if the "principled" defense relies on contestable symmetry assumptions. Here's why, and what computationally convenient prior makes sense given your stance:

  1.  **The Problem with a Flat Prior on σ:**
      *   **Non-Invariance:** A flat prior `p(σ) ∝ 1` is *not* invariant under rescaling. Suppose you reparametrize in terms of `ϕ = kσ` (e.g., changing units from meters to centimeters). A flat prior on `σ` implies `p(ϕ) ∝ 1` (still flat). However, the probability assigned to an interval `(a, b)` for `σ` is not the same as the probability assigned to the corresponding interval `(ka, kb)` for `ϕ` under this prior. This violates the fundamental scale-invariance property we expect for a scale parameter when we truly have "no information". Jeffreys prior *is* invariant under this reparametrization.
      *   **Improper & Potential Problems:** While often improper, `p(σ) ∝ 1` can lead to improper posteriors or very slow convergence in some models, especially with small sample sizes or complex hierarchical structures. Jeffreys priors are designed to mitigate this risk (though not eliminate it).

  2.  **The "Convenient" Prior Matching Jeffreys (and Convention):**
      Given your desire for computational convenience and acceptance that the "principled" defense has philosophical holes, **use a flat prior on `log(σ)`**.
      *   **Computation:** This is computationally identical to using a flat prior on any other unbounded parameter. Most MCMC software (Stan, PyMC3, JAGS) handles this transparently. Just declare `log_sigma ~ uniform(-Inf, Inf)` or equivalently `sigma = exp(log_sigma)` and put the flat prior on `log_sigma`.
      *   **Equivalence to Jeffreys:** A flat prior on `log(σ)` implies `p(σ) ∝ 1/σ`. This is *exactly* the Jeffreys prior for a scale parameter in location-scale families and many common models (e.g., normal standard deviation, exponential rate parameter).
      *   **Scale Invariance:** This prior `p(σ) ∝ 1/σ` *is* invariant under rescaling `ϕ = kσ` (try the transformation: `p(ϕ) = p(σ) * |dσ/dϕ| ∝ (1/σ) * (1/k) = 1/(kσ) = 1/ϕ`).
      *   **Widespread Convention:** While philosophically contestable, the `1/σ` prior is the *de facto* standard "objective" prior for scale parameters in statistics. Using it aligns your work with common practice. Using a flat prior `p(σ) ∝ 1` would raise eyebrows as it lacks this basic invariance property expected for scales.
      *   **Practical Advantage:** It often leads to better-behaved inference (especially with small `n`) than `p(σ) ∝ 1`, particularly in hierarchical models. The `1/σ` prior gently downweights very large scales.

  3.  **Why Jeffreys/`1/σ` Still Has *Pragmatic* Advantage Over Flat `p(σ) ∝ 1`:**
      *   **Addresses the Core Relativity:** Bertrand's paradox arises because different *incompatible* sample spaces seem equally "natural". For a scale parameter `σ > 0`, the reparametrizations `σ`, `σ²`, `log(σ)`, `1/σ` are all common and mathematically valid. The principle of indifference applied naively gives different answers. **The transformation group approach (leading to `p(σ) ∝ 1/σ`) picks the parametrization (`log(σ)`) where the "indifference" prior is flat *and* yields invariance under the relevant symmetry (rescaling).** While choosing rescaling symmetry *is* a choice, it's a highly motivated and conventional one for scale parameters. Choosing the flat prior on `σ` is equivalent to choosing a *different* symmetry (or none), which is less conventional and lacks the scale-invariance property.
      *   **Reference Priors:** Jeffreys prior is a special case of reference priors, designed to maximize the expected information from the data (Kullback-Leibler divergence). While also relying on chosen parametrizations, this provides an additional *pragmatic* information-theoretic justification beyond just symmetry.

  **Recommendation:**

  Use the **flat prior on `log(σ)`**. This is:

  1.  **Computationally trivial:** As easy as any flat prior.
  2.  **Equivalent to `p(σ) ∝ 1/σ`:** The Jeffreys/reference prior for scale parameters.
  3.  **Scale-invariant:** Matches the fundamental symmetry of the problem.
  4.  **Conventional:** The widely accepted default "objective" prior for scale parameters.
  5.  **Generally well-behaved:** Less prone to issues than `p(σ) ∝ 1`.

  **In essence:** While acknowledging the deep philosophical point about arbitrariness, the `1/σ` prior (via a flat prior on `log(σ)`) is the computationally convenient prior that *also* happens to be the standard "objective" choice. It satisfies the basic requirement of scale invariance that a flat prior on `σ` itself violates. The philosophical critique doesn't render all choices equally arbitrary *in practice*; convention, pragmatism regarding invariance, and good statistical behavior strongly favor `p(σ) ∝ 1/σ` over `p(σ) ∝ 1` for scale parameters. Use `log_sigma ~ uniform(-Inf, Inf)` in your model specification.
