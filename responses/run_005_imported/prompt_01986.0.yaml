answer: |-
  That's a fascinating philosophical dilemma! You both have valid points, representing different positions on the "epistemology of testimony" – how we gain knowledge from other people's words. Neither stance is entirely wrong, but the *context* matters significantly.

  Here's a breakdown:

  **Your Partner's Argument (Skepticism & Justification):**
  1.  **Risk of Error or Deception:** People can be mistaken, misremembering, exaggerating, or even lying. Without any way to check, you're vulnerable to accepting false information.
  2.  **Burden of Justification:** Knowledge requires justification. Simply hearing something isn't sufficient justification to *know* it's true. Your partner argues that independent confirmation (or at least knowing the person is reliable) is part of that justification.
  3.  **Gullibility:** Uncritically accepting everything you hear *is* irrational and makes you susceptible to misinformation.
  4.  **High-Stakes Analogy:** If the stranger was selling you an investment based on his claims, your partner's stance would be obviously correct. While wedding chat is low-stakes, the principle of needing justification remains.

  **Your Argument (Pragmatism & Social Epistemology):**
  1.  **Practical Impossibility:** As you rightly point out, it's impossible to personally verify 90%+ of what we "know" (historical events, scientific facts, news, personal stories from friends, etc.). Modern life *depends* on trusting others' testimony.
  2.  **Default Trust is Necessary:** Society functions on a baseline level of trust. We generally assume people are sincere and reasonably competent in their own domains unless we have specific reasons to doubt them. This is a practical necessity, not necessarily irrationality.
  3.  **Cost-Benefit Analysis:** At a low-stakes social event like a wedding, the *cost* of being potentially wrong about a stranger's job details is negligible (mild embarrassment at most). The *benefit* is smooth social interaction, learning something new, and avoiding paralyzing skepticism. Demanding proof in that context would be socially bizarre and impractical.
  4.  **Plausibility Filter:** You likely *did* apply some implicit filtering. Did his story seem internally consistent? Did it fit broadly with what you know about the world? Did he seem earnest? If nothing raised red flags, accepting it provisionally makes sense.
  5.  **Knowledge vs. Belief:** You might "believe" him *at that moment* for conversational purposes without necessarily incorporating every detail into your core "knowledge" base permanently. Much casual information is held lightly.

  **Who Has the Better Argument? It Depends on the Context:**

  1.  **Low-Stakes, Social Context (The Wedding): YOU have the stronger argument.**
      *   **Pragmatism Wins:** Demanding verification here is impractical and socially disruptive. Default trust is reasonable.
      *   **Cost is Low:** The consequences of being wrong are minimal.
      *   **Plausibility is Key:** Absent glaring inconsistencies or implausibilities, taking someone's word about their own specific work is generally acceptable.

  2.  **High-Stakes Context or Forming Core Beliefs: YOUR PARTNER has the stronger argument.**
      *   **Justification Matters:** When decisions, investments, safety, or important beliefs hinge on the information, independent verification or assessing reliability is crucial.
      *   **Avoiding Gullibility:** Blind acceptance *is* dangerous in these contexts. The principle of needing justification is sound.
      *   **The "90%" is Filtered:** While you don't verify most facts personally, the information ecosystem you rely on (reputable news, scientific consensus, established history, trusted friends) *has* been subjected to layers of verification and scrutiny *by others*. You're relying on institutional or communal reliability, not just one uncorroborated stranger.

  **The Balanced View (The Winner is Nuance):**

  *   **Default Trust with Discernment:** It's reasonable and necessary to start from a position of default trust in casual social interactions, especially about personal experiences like one's job, *provided* the claims seem plausible and there are no obvious red flags.
  *   **Provisional Acceptance:** You can accept the information *provisionally* for the sake of conversation and interest without committing to it as absolute, verified truth. Think "That's fascinating, I'll take your word for it *for now*" rather than "This is now an unshakable fact in my worldview."
  *   **Context is King:** The stakes dictate the level of skepticism required. Wedding chat? Low skepticism. Investing your life savings based on his tip? High skepticism.
  *   **Plausibility is Your First Defense:** Your brain likely did a quick check: "Does this *sound* possible based on what I generally know?" If he claimed he was a unicorn rancher, you'd have been skeptical even without Google.
  *   **Your Partner's Rule is a Guideline, Not an Absolute:** Insisting on *always* having independent verification before believing *anything* is paralyzing and unrealistic. The rule should be applied proportionally to the stakes and context. Your partner likely applies this filter unconsciously most of the time themselves.

  **Conclusion:** In the specific context of a wedding conversation with a stranger about his job details, **your approach was perfectly reasonable and pragmatic.** Your partner's principle (demand justification) is philosophically sound *in general* and crucial for high-stakes situations, but applying it rigidly to every casual interaction is impractical and ignores how human communication and knowledge-sharing actually work. You navigated the social situation appropriately. Your partner's rule is a valuable tool, but it shouldn't be the *only* tool in your epistemological toolkit.
