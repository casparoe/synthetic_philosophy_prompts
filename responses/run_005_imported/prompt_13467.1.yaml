  **Key separation between tiers**:  
  - **S-tier approaches** (Schaffer, McGrath) **explicitly build contextual relevance into causation**, blocking overcounting by requiring a structured baseline (e.g., contrasts with normal expectations or default scenarios). Schaffer disconnects irrelevant pathways via contrasts, while McGrath distinguishes deviations from defaults – both exclude the Queen’s omission as non-deviant/non-contrastive.  
  - **D-tier approaches** (Beebee) **deny the core intuition** that omissions can be causal, failing to resolve the puzzle by eliminating the phenomenon altogether. This leaves the lifeguard’s moral responsibility inexplicable within a causal framework, making it the least satisfying solution.  

  The S-tier succeeds by embedding *relational constraints* (contrasts/norms) directly into causal structure, whereas D-tier either overcounts (Lewis), denies causation’s existence (Beebee), or reduces omissions to second-class status without robust criteria (Dowe).
