  - **Lewis (counterfactual dependence)**: Absences can be causes if the effect counterfactually depends on them. But this leads to the problem of too many causes (e.g., the plant dies if Jones doesn't water it, but also if the Queen doesn't, etc.). Lewis tried to address this by requiring a causal chain, but it's not clear it fully avoids the problem.

  - **Dowe (conserved quantity)**: Causation requires the transfer of conserved quantities (like energy or momentum). Omissions involve no transfer, so they are not causes. Instead, they are "quasi-causes". This avoids the problem by denying that omissions are causes, but then we have to explain why the lifeguard is responsible without causing the death.

  - **Beebee (skeptical/eliminativist)**: She argues that omissions are not causes at all. We might think they are due to pragmatic or moral reasons, but strictly speaking, nothing is caused by an absence. This avoids the problem by denying the premise, but it might be counterintuitive for cases like the lifeguard.

  - **Schaffer (contrastive)**: Causation is contrastive. We don't ask "did the omission cause the death?" but "did the omission rather than some alternative cause the death rather than some alternative?" By specifying the right contrasts, we can pick out only the relevant omissions. This might help by making causation relative to a context that specifies the relevant alternatives.

  - **Sartorio (actual causation tied to moral responsibility)**: Ties causation to moral responsibility. The lifeguard's omission is a cause because they had a duty to act, whereas the Queen did not. This directly uses normative factors to distinguish causes.

  - **Hall (two concepts)**: Distinguishes between production (causal process) and dependence (counterfactual). Omissions are causes in the dependence sense but not in the production sense. The lifeguard's omission is a cause in the dependence sense, but we don't have to say that every omission is a cause because the dependence is only on the relevant factors. However, without further constraints, it might still have an overabundance problem.

