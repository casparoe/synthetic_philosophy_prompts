prompt: |-
  So I've been working on a longer piece about AI alignment and keep running into Eliezer Yudkowsky's old "coherent extrapolated volition" idea — basically the notion that instead of programming a superintelligent AI with our current, messy preferences, you'd want it to figure out what we'd want if we knew more, thought faster, and were more the people we wish we were, and then have it act on that instead. A philosopher friend told me over drinks a few weeks back that this is basically just repackaged "idealized preference" / "ideal advisor" theory of the good, the kind of thing Peter Railton was doing back in the 80s, and that Yudkowsky didnt really add anything philosophically new, just AI flavoring on an old dish. I wasnt totally convinced but I don't know the Railton-adjacent literature (Sidgwick, Brandt, Harsanyi's "true preferences" stuff, etc.) well enough to push back properly, and it's been bugging me since.

  Could you actually compare these two ideas for me properly? Specifically I'm curious about two things: (1) is CEV doing anything philosophically distinct from earlier idealized-preference/full-information accounts of a person's good, or is my friend basically right that its only real innovation is the delivery mechanism (an AI actually implementing it) rather than the underlying theory of value, and (2) the part of CEV that has to somehow combine millions of different people's extrapolated volitions into one coherent output — is that a genuinely new problem, or just the old interpersonal-aggregation/social-choice problem turning up again in a new costume? I'd rather you take a real stance on both questions than give me a diplomatic "well, there are similarities and differences" non-answer.
reasoning: |-
  Okay, the user is working on a piece about AI alignment and is stuck on understanding how Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) compares to earlier philosophical concepts like Peter Railton's idealized preference theory. They mentioned a philosopher friend who thinks CEV is just a repackaged version with AI flavor, and the user isn't sure how to counter that. They want a clear stance on two points: whether CEV introduces anything philosophically new beyond older theories, and whether the aggregation problem in CEV is genuinely novel or just a rehash of social choice theory.

  First, I need to recall what CEV entails. Yudkowsky's idea is that an AI should figure out what humans would want if they were more informed, rational, and aligned with their idealized selves. Then, it must combine these individual volitions into a coherent whole. The user's friend points to Railton's "ideal advisor" model, where an individual's good is what they would desire if fully informed and rational. Also, Sidgwick and Brandt have similar concepts. So, the first question is whether CEV's philosophical foundation is new or just applied to AI.

  Looking at the philosophical core, CEV does seem to build on existing ideas. Railton's work in the 80s already proposed that a person's good is determined by what they would want under idealized conditions. Brandt's "cognitive psychotherapy" is another precursor. Even Harsanyi's "true preferences" fit here. So, the basic mechanism of extrapolating individual preferences under ideal conditions isn't new. Yudkowsky himself acknowledged borrowing from these traditions. So, the friend has a point that the underlying theory of value isn't original.

  But where CEV might differ is in its application to AI and the scale of implementation. Traditional idealized preference theories are analytical tools for understanding individual good, not practical blueprints for action. CEV, however, is framed as a functional specification for an AI system. This shift from theoretical analysis to executable design is significant. Also, CEV emphasizes the coherence aspect more heavily. While philosophers might assume idealized preferences are coherent, CEV explicitly requires resolving contradictions both within individuals and across society. This operational focus on coherence as a dynamic process is a nuanced addition.

  The second part is about aggregating millions of extrapolated volitions. The user wants to know if this is a new problem or just social choice theory in disguise. Social choice theory (like Arrow's Impossibility Theorem) deals with aggregating individual preferences into a collective decision. CEV's aggregation step seems similar. However, CEV's inputs are idealized preferences, not raw ones. This adds complexity because each individual's volition is already processed and extrapolated. Moreover, CEV demands coherence not just in outcomes but in the values themselves, which might involve modifying individual volitions to fit together harmoniously. This is more invasive than traditional social choice, which typically takes preferences as given. 

  But is this aggregation problem fundamentally new? The user might be hinting that while the inputs are different (idealized vs. actual preferences), the core challenge of combining diverse preferences into one coherent output remains. However, the scale and the fact that the preferences are hypothetical and extrapolated introduce new dimensions. Traditional social choice deals with existing preferences, whereas CEV requires the AI to simulate what preferences would be under ideal conditions and then combine them. This simulation aspect adds layers of uncertainty and complexity. Yet, philosophically, the aggregation problem still revolves around the same issues of interpersonal comparison and value conflicts.

  The user's deeper need is to strengthen their argument in their article. They might be looking for ammunition to either defend CEV's novelty or concede its philosophical debts while highlighting its practical innovations. They also need to address the aggregation issue convincingly. Emphasizing the shift from theory to implementation and the heightened coherence demands could be key points. Acknowledging the philosophical roots but stressing the unique challenges posed by AI implementation might strike the right balance.

  I should also consider the user's identity as a writer on AI alignment. They need to present a nuanced view that respects philosophical traditions while showcasing AI-specific contributions. Their frustration with diplomatic non-answers suggests they want clear, bold statements. So, stating that CEV's value theory isn't new but its operationalization is, and that aggregation is an exacerbated version of an old problem, provides the stance they seek. Highlighting the practical challenges of coherence and scale could underline CEV's relevance to AI safety debates.
answer: |-
  Let's cut through the philosophical fog and tackle your questions head-on. Your friend has a valid point about the lineage, but misses the crucial operational and conceptual shifts CEV introduces in the context of AGI. Here's the breakdown:

  ### (1) CEV's Philosophical Core: Repackaged, But With Critical AI-Driven Twists
  **Verdict: Your friend is *mostly* correct about the individual-value core, but crucially underestimates the novel implications of *operationalization* and *coherence demands* for AGI.**

  *   **The Core Debt is Real:** Railton's "ideal advisor" (1986) explicitly defines an individual's good as what they *would* desire with "full information and vivid appreciation" and "unqualified cognitive rationality." Sidgwick's "point of view of the Universe" (1874), Brandt's "cognitive psychotherapy" (1979), and Harsanyi's "true preferences" (1955) all explore versions of *idealized, informed, rational preference* as constitutive of the good. Yudkowsky openly acknowledged this heritage. **The fundamental mechanism of *extrapolating* an individual's preferences under counterfactual conditions of improved cognition/information is not philosophically novel.** CEV's description ("if we knew more, thought faster, were more the people we wished we were") is practically a paraphrase of these ideas.

  *   **Where CEV Adds Crucial Nuance (Beyond Flavoring):**
      *   **Operationalization as AGI Specification:** Railton & co. were offering *analytical frameworks* or *definitions* of "the good." CEV is explicitly framed as a *functional specification for an AGI's utility function*. This shift from philosophical analysis to engineering blueprint forces concrete answers to questions these theories often left vague or assumed away. *How* does the AGI perform the extrapolation? *What* counts as "knowing more" or "thinking faster" in computable terms? The burden of *implementation* creates new philosophical pressure points.
      *   **Hyper-Emphasis on Coherence (Intra-personal):** While idealized preference theories *assume* idealized preferences are coherent (rational), CEV makes resolving internal conflicts within an individual's *extrapolated* volition a central, explicit, and non-trivial step. An AGI *must* resolve contradictions in the hypothetical output of your "better self." This isn't just an assumption of rationality; it's an active, algorithmic process of conflict resolution applied to a simulated, enhanced mind. The nature of this "coherentization" process is underspecified and philosophically loaded.
      *   **The "Wished We Were" Layer:** While Brandt talked of "cognitive psychotherapy" removing irrational desires, CEV's "more the people we wished we were" injects a potentially distinct normative element. Does this include *moral* wishes? Does it bootstrap idealized *meta-preferences*? This phrasing arguably blends descriptive extrapolation with a subtle normative filter ("wished we were") in a way slightly different from pure "full information" models. It hints at incorporating idealized *character*, not just cognition.

  **Conclusion on (1):** Philosophically, the *source material* for defining an individual's "good" is heavily derivative. However, framing it as an *AGI's task* necessitates confronting operational ambiguities (extrapolation mechanics, coherence resolution) and subtly shifts the emphasis (via "wished we were") in ways that create novel *practical philosophical problems* distinct from the original analytical context.

  ### (2) Aggregation: Old Problem in a Radically New (and Terrifying) Guise
  **Verdict: This is the *genuinely novel* and terrifying core of CEV. While it leverages old social choice problems, the inputs and required output transform it into something fundamentally different and harder.**

  *   **The Superficial Similarity:** Yes, combining many individual preference orderings into a social ordering is the domain of social choice theory (Arrow's Impossibility Theorem, etc.). CEV inherits all these well-known aggregation paradoxes and impossibility results. *That* problem is ancient.

  *   **Why CEV Aggregation is Radically Different (and Worse):**
      1.  **Inputs are Hypothetical Constructs, Not Revealed Preferences:** Social choice deals with *actual, observable* preferences (votes, market choices). CEV requires aggregating *millions of hypothetical, counterfactual extrapolations*. The AI isn't summing votes; it's summing the outputs of millions of incredibly complex simulations of idealized human minds. The uncertainty and potential for error in *generating* each input is colossal and unprecedented.
      2.  **The Demand for *Coherence* (Inter-personal):** Social choice aims for a *collective decision* (even if messy or paradoxical). CEV demands a single, *coherent* volition. This isn't just about ranking options; it's about synthesizing potentially conflicting *values, terminal goals, and worldviews* from idealized individuals into a unified, non-contradictory "will." This goes far beyond aggregating preferences; it requires *value harmonization* or *value reconciliation* at a fundamental level. How does the AI resolve deep moral disagreements between idealized versions of different people? Should it?
      3.  **Dynamic Emergence vs. Static Aggregation:** Yudkowsky's description hints that the coherent whole might not be a simple sum, but something that "emerges" from the interaction of extrapolated volitions. This suggests a process more akin to simulating a society of idealized minds and finding a stable attractor state for their *combined* values, rather than applying an aggregation rule (like utilitarianism or voting) to static preference lists. This dynamic, emergent aspect is poorly defined but points to a problem far more complex than traditional social choice.
      4.  **Scale and Interdependence:** Aggregating millions of entities is computationally daunting, but the real novelty is the *interpretive interdependence*. Understanding *your* extrapolated volition might require understanding how you *would* interact with and be influenced by the *extrapolated volitions of others* in a hypothetical ideal discourse. This creates a massive circularity problem absent from standard social choice.

  **Conclusion on (2):** While leveraging old aggregation problems, CEV transforms them by demanding the aggregation of *simulated, idealized minds* into a *coherent, unified, dynamic volition*. The shift from aggregating *observed choices* to synthesizing *hypothetical, harmonized values* creates a problem of qualitatively different scale and complexity. It's not just a new costume; it's asking the old problem to perform an impossible acrobatic feat on a high wire over an abyss.

  ### The Bottom Line for Your Piece
  *   **Acknowledge the Debt:** Give Railton, Brandt, et al. their due. The core idea of defining the good via idealized preferences *is* borrowed. Yudkowsky wasn't claiming otherwise.
  *   **Highlight the AGI Wrinkle:** Emphasize how the *operationalization imperative* for AGI forces novel confrontations with the mechanics of extrapolation and intra-personal coherence that philosophical definitions could leave abstract.
  *   **Sound the Alarm on Aggregation:** This is where CEV truly breaks new (and dangerous) ground. Argue that while mathematically related to social choice, the task of synthesizing *coherent global volition from millions of hypothetical idealized minds* is a uniquely terrifying and ill-defined challenge central to the existential risk debate. It's the monstrous offspring of social choice theory and strong AI. Your friend's dismissal undersells the profound difficulty here.

  CEV's philosophical value lies less in its raw definition of "good" and more in its stark revelation of the *implementation nightmares* and *aggregation abyss* that emerge when you try to turn centuries-old philosophical thought experiments into code running on a superintelligence. That's the core tension your piece should explore.
