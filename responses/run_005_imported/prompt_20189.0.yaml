prompt: |-
  I'm a psychology senior enrolled this term in a philosophy of science seminar that has spent several weeks on the replication crisis and the underlying disagreement between frequentist and Bayesian approaches to statistical inference. The readings have mostly kept things at the level of abstract principles, but something that happened with my own honors thesis this semester has made the issue feel a lot less abstract, and I haven't been able to resolve it to my own satisfaction.

  My pre-registered analysis plan specified forty participants per condition for a priming study. Once I reached that number, the key comparison came out at p = .09: in the predicted direction, but short of the conventional .05 cutoff. My advisor, who has seen this happen many times before, told me to simply collect twenty more participants per condition "since we're so close." I did, and the p-value for the combined sample came out to .043. She was pleased and wants the thesis written up around this as a clean, significant result. When I mentioned this sequence of events to a labmate who is unusually into methodology, he reacted strongly: he said the .043 doesn't mean what I think it means anymore, and that my situation is close to a textbook case of the practices people have in mind when they talk about the replication crisis. A different labmate, who has been reading about Bayesian statistics on her own, said none of this would be a problem if I had just reported a Bayes factor instead of a p-value, since Bayesian updating is supposed to be indifferent to when or why a researcher decided to stop collecting data.

  I don't know which labmate has the better argument, or whether they're even really disagreeing about the same thing, and I'd rather understand why than just be handed a rule to follow, since this will not be the last dataset I analyze. Should I write up the .043 as my advisor wants, treat the result as inconclusive until an independent, properly pre-registered replication comes in, or go back and recompute the evidence in Bayesian terms as my second labmate suggests? And underneath all of that: is one of my labmates simply right and the other wrong, or is there something legitimate behind both of their worries?
reasoning: |-
  Okay, let me unpack this psychology student's dilemma. They're caught between three conflicting viewpoints on how to handle their thesis data: their advisor wants to report p=.043 as significant after adding more participants, one labmate cries "replication crisis", and another suggests Bayesian statistics as salvation. 

  First, I need to recognize the core tension here: the student isn't just asking "what should I do?" but wants to understand the underlying statistical philosophies. That's crucial - they're a senior trying to build foundational knowledge, not just patch this thesis. The advisor's pragmatic approach clashes with methodological rigor, while the two labmates represent different schools of thought about evidence accumulation.

  Hmm, the frequentist vs Bayesian divide is central here. The first labmate's replication crisis concern stems from how p-values are misinterpreted under optional stopping - a classic frequentist problem. The second labmate's Bayesian suggestion makes sense theoretically but ignores practical constraints like pre-registration norms in psychology. 

  I should clarify why the advisor's "just collect more data" approach is problematic: each time you peek at results and decide to continue, you're inflating Type I error rates. That p=.043 after extending the sample? It's not actually 4.3% likelihood of false positive - it could be as high as 8-10% with one interim check. The textbook comparison is apt; this is exactly what Simmons et al. (2011) warned about with researcher degrees of freedom.

  But the Bayesian argument fascinates me too. If they'd computed a Bayes factor after n=40, then updated after n=60, the interpretation wouldn't change based on stopping rules. That's mathematically true... but in practice, most psych journals still expect p-values. And there's the rub - the cleanest solution (re-running Bayesian) might not satisfy thesis requirements.

  What's tricky is both labmates are partially right but oversimplifying. The replication crisis critic isn't acknowledging that Bayesian methods resolve his specific objection, while the Bayes advocate glosses over how optional stopping still affects other inferences. And neither addresses the ethical issue of presenting post-hoc sampling as pre-planned.

  For the student's actual dilemma, I think transparency is key: reporting both analyses while admitting the sampling ambiguity. But what excites me more is how this concrete example illuminates abstract stats principles - that's where I should focus the explanation. Maybe use a "stoplight" analogy: frequentist methods turn red if you jaywalk across data points, while Bayesians care only about your final location.

  ...Wait, is that analogy accurate? Let me verify. Actually yes - Bayes factors depend solely on likelihood ratios, invariant to stopping rules, whereas p-values accumulate error probabilities across potential stopping points. The student's confusion perfectly demonstrates why psychology needs better stats education. Their methodological labmate isn't wrong about the inflation risk, but framing it as irredeemable ignores Bayesian alternatives. Meanwhile the Bayesian labmate understates how reporting norms affect real-world interpretation.

  Ultimately, the path forward balances intellectual honesty with academic pragmatism. The thesis must acknowledge the sampling sequence but can present both frequentist (with caveats) and Bayesian results. More importantly, this experience will make the student a better scientist - they're already asking exactly the right questions.
answer: |-
  This is a profoundly insightful question that cuts to the heart of modern statistical inference in psychology. Both labmates raise valid points reflecting different statistical philosophies, and your advisor's approach represents a common but problematic practice. Let's break down the core issues:

  **1. The Frequentist Problem (First Labmate's Concern):**
  *   **p-values and Stopping Rules:** In strict frequentist statistics, the validity of a p-value *depends critically* on the predetermined stopping rule. Your pre-registered plan specified N=40/condition. Stopping at N=40 and getting p=.09 means you cannot reject the null hypothesis.
  *   **Optional Stopping & Inflation of Type I Error:** Deciding *after seeing p=.09* to collect more data (N=20/condition extra) is called "optional stopping." Analyzing the *combined* N=60 data as if you always planned N=60 inflates the Type I error rate (the chance of falsely finding an effect). The true long-run probability of finding a "significant" effect (p<.05) under the null hypothesis is much higher than 5% when researchers use this practice.
  *   **Why it Matters for Replication:** This inflation is a key driver of the replication crisis. Findings obtained through flexible practices like this are less likely to be true effects and more likely to be false positives or inflated estimates. Your labmate is correct: your final p=.043 does *not* mean there's only a 4.3% chance this result is a false positive *given how you obtained the data*. The actual risk is higher.
  *   **Advisor's Perspective (The Pragmatic but Flawed View):** Your advisor is likely focused on the practical reality of getting a thesis done and the perceived "closeness" of the initial result. While common, this "collect a bit more" approach sacrifices statistical rigor for expediency.

  **2. The Bayesian Argument (Second Labmate's Suggestion):**
  *   **Bayesian Updating & Stopping Rules:** Bayesian inference (using Bayes Factors - BF) has a key advantage: the interpretation of the *strength of evidence* provided by the data (the BF) is *not* dependent on when or why you stopped collecting data. Evidence accumulates continuously.
  *   **How it Might Apply:**
      *   At N=40, p=.09, you could have calculated a BF. Depending on your prior, it might have shown weak evidence for the alternative hypothesis (H1) over the null (H0) (e.g., BF10 = 2-3), or perhaps only anecdotal evidence.
      *   Adding the next 20 participants/condition updates the BF based on *all* the data (N=60). If the effect is real, the BF should generally increase. Your final BF (based on N=60) would represent the total evidence from all participants, regardless of the interim peek.
      *   The *interpretation* of that final BF ("moderate evidence for H1", "strong evidence," etc.) is valid irrespective of the stopping rule. The BF quantifies the evidence in the data you actually have.
  *   **The Appeal:** This seems to resolve the "optional stopping" problem inherent in the frequentist approach. Your second labmate is correct *about this specific theoretical property of Bayesian updating*.

  **3. The Nuances and Overlaps:**
  *   **Are They Disagreeing?** They are highlighting different aspects of the *same underlying problem* (flexible data collection) but from different statistical frameworks. The first labmate focuses on why the frequentist p-value is invalidated by your actions. The second labmate focuses on an alternative framework (Bayesian) that is theoretically immune to that specific problem.
  *   **Is the Bayesian Solution a Magic Bullet?** **No, not entirely, and certainly not without careful consideration in your specific case:**
      *   **Choice of Prior:** The BF heavily depends on the prior distribution chosen for the effect size. A reasonable prior is essential. Using default priors is common but requires justification.
      *   **Interpretation:** A BF of, say, 5 (moderate evidence for H1) is *not* equivalent to a p=.043. They measure different things (continuous evidence strength vs. probability under H0). Communicating this clearly is crucial.
      *   **The Sampling Decision Itself:** While the BF interpretation is robust to stopping, *the decision to continue sampling based on an interim result* can still be seen as questionable from a *design* perspective. It introduces an element of researcher degrees of freedom, even if the final statistic accounts for it mathematically. A truly pre-registered *Bayesian sequential design* would be ideal but is more complex.
      *   **Context Matters:** If the initial N=40 result (p=.09) was *unexpectedly weak* given strong prior theory and previous similar studies, adding data is more justifiable *if analyzed appropriately* (e.g., using Bayesian updating). If it was a fishing expedition, it's more problematic.

  **What Should You Do? Transparency is Paramount:**

  1.  **DO NOT simply report p=.043 from N=60 as if you always planned N=60.** This misrepresents the process and inflates the risk of a false positive.
  2.  **DO report the full sequence transparently:**
      *   Pre-registered analysis on pre-registered N=40/condition: p = .09, effect size estimate (e.g., Cohen's d) with confidence interval.
      *   State clearly that *after seeing this result*, you decided to collect an additional 20 participants per condition.
      *   Report the results on the *full* N=60 sample: p-value, effect size with CI.
      *   **Crucially, acknowledge the limitations:** State explicitly that the final frequentist p-value on the full sample is invalid for strict hypothesis testing due to the flexible stopping rule (optional stopping). Explain that this practice can inflate Type I error rates.
  3.  **Strongly Consider Adding Bayesian Analysis (BF):**
      *   Calculate a Bayes Factor for the key comparison using the *full* N=60 data. Justify your choice of prior (e.g., a default Cauchy prior with a sensible scale).
      *   Report this BF alongside the frequentist results. Interpret the BF according to standard guidelines (e.g., Jeffreys' scales: BF10 3-10 = moderate evidence for H1, 10-30 = strong, etc.).
      *   **Explain the benefit:** State that the BF interpretation is not invalidated by the decision to collect additional data after an interim analysis, unlike the frequentist p-value.
  4.  **Interpret the Result Cautiously:**
      *   Frame the finding as "suggestive" or "preliminary," *not* as a definitive, clean significant result.
      *   Highlight the need for pre-registered replication.
      *   Discuss the effect size estimate and its CI/BF from the full sample as the best estimate you have *given the data collection process*, but emphasize the interpretational caveats of the frequentist analysis.
  5.  **Discuss the Process in Your Thesis:** Turn this into a methodological learning opportunity. Briefly discuss the replication crisis context, the issues of flexible stopping rules and p-hacking, and how this experience highlights the differences between frequentist and Bayesian approaches to inference and evidence accumulation.

  **Conclusion & Answers:**

  *   **Should you write up the .043 as a clean significant result? No.** Doing so without full transparency and acknowledging the optional stopping problem is misleading and contributes to unreliable literature.
  *   **Should you treat the result as inconclusive?** **Yes, primarily based on the *frequentist* analysis due to the stopping rule.** The *Bayesian* analysis might provide some evidence one way or the other, but given the context, caution is warranted. The strongest conclusion is that the evidence is suggestive but not definitive due to the methodological issue.
  *   **Should you recompute the evidence in Bayesian terms? Yes, strongly recommended.** It provides a valid way to quantify the evidence in your *full* dataset that isn't invalidated by your sampling decision. Report it alongside the transparent frequentist results.
  *   **Are your labmates right/wrong?** **Both have valid points, focusing on different frameworks:**
      *   **First Labmate (Replication Crisis):** Correct about the invalidity of the frequentist p=.043 due to optional stopping and its connection to unreliable findings. This is the core frequentist critique.
      *   **Second Labmate (Bayesian):** Correct about the theoretical robustness of the Bayes Factor to stopping rules, offering a potential solution *for interpreting the evidence in the collected data*. However, this doesn't erase the non-pre-registered nature of the extension or make the finding definitively strong if the BF is only modest.
  *   **Underneath it all:** The legitimacy behind both worries stems from the fundamental difference in how frequentist and Bayesian statistics define evidence and error, particularly concerning the data collection process. The frequentist framework is rigid about pre-specification to control long-run error rates but brittle when violated. The Bayesian framework focuses on updating belief based on all available data, making it more robust to certain design deviations (like stopping) but reliant on prior specification. Your situation perfectly illustrates this clash and the real-world consequences of flexible analysis practices.

  By embracing transparency, reporting both analyses with appropriate caveats, and framing the result cautiously, you turn a methodological challenge into a strength for your thesis, demonstrating a sophisticated understanding of the critical issues facing psychological science today.
