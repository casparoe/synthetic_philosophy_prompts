  For the user's purpose, I'll structure this as a head-to-head comparison: premises, conclusions, and policy implications for each. The "what each licenses" angle is key—Hume undermines mercantilist goals but doesn't justify trade; Ricardo justifies trade but doesn't address monetary policy. 

