answer: |-
  ## The Scaffolding and the Storm (A Tavern near St. Paul's, London, 1656)

  **The Scene:** Rain lashes the windows of a dimly lit tavern. The air smells of damp wool, woodsmoke, and stale ale. **Thomas Hobbes**, hunched over a corner table, glares at a freshly printed copy of *Six Lessons*. **John Wallis**, cloaked and dripping, spots him. He hesitates, then approaches, placing his own damp pamphlet on the table – *Elenchus Geometriae Hobbianae*.

  **Wallis:** (Removing his hat, shaking off rain) Master Hobbes. Fancy finding you here, contemplating your latest... *lesson*.

  **Hobbes:** (Doesn't look up, voice low and gravelly) Wallis. Come to gloat? Or perhaps to confess you finally comprehend the *certainty* of my method, obscured as it is by your own symbolic fog?

  **Wallis:** (Sitting opposite, signalling for ale) Neither. Though I confess, finding the Savilian Professor of Geometry 'obscured' by the very language that *reveals* mathematical truth is... ironic. No, I came because your *Six Lessons*... it moves beyond the circle. You stake your entire philosophy upon it.

  **Hobbes:** (Looks up, eyes sharp) As well I should! Geometry *is* philosophy’s bedrock. Not your algebra, those empty scratches signifying nothing but themselves! In geometry, we *make* the objects: we draw the line, we describe the circle. Their properties flow *necessarily* from our clear definitions and constructions. We are the *makers*, Wallis! We know the causes because we *are* the causes! Just as in the Commonwealth – we covenant, we *construct* Leviathan, and thus we understand its powers and limits with absolute certainty. Unlike your physics, groping blindly at a nature we did not build and cannot fully fathom.

  **Wallis:** (Leans forward, intensity matching Hobbes') Aye, the 'maker's knowledge'. A powerful idea, Master Hobbes. I grant it readily for the *ideal* of geometry. The circle defined, the line postulated – their properties deduced *are* certain. But your claim rests not on the ideal, but on the *act* of construction, does it not? That *your* hand, *your* mind, building the figure, grants you unique access to its truth?

  **Hobbes:** Precisely! The certainty resides in the *act*, guided by reason.

  **Wallis:** Then here lies the ruin of your edifice! You claim the certainty of the maker. But *what* have you made? Show me this perfect circle you claim to have squared! Show me this construction that grants you such profound certainty! Your 'arc equal to the line' – a phantom! Your quadrature – demonstrably false! Repeatedly! By myself, by others. Your *actual constructions*, Hobbes, the ones you publish with such bombast, are *flawed*. They do not *work*.

  **Hobbes:** (Face darkening) Flaws? Or merely imperfections of execution? The *method* is sound! The *idea* is clear! Your algebra cannot grasp the essential nature, it only manipulates shadows!

  **Wallis:** Execution *is* the test! If your claim is that certainty arises from the *act of construction itself*, then a construction that demonstrably fails to achieve its stated end – like squaring the circle – proves that the act, *in your hands*, did *not* yield certain knowledge! It yielded error. Monumental, persistent error. If the maker’s hand trembles so consistently, can you truly claim his knowledge is uniquely certain? Your scaffolding, Hobbes, collapses under its own weight the moment you try to build upon it!

  **Hobbes:** (Slams a fist on the table, making tankards jump) You mistake the *ideal* for the *accidental*! The trembling hand is the fault of the craftsman, not the nature of the craft! Geometry *itself* is certain because its objects are conceived and built by reason. My... missteps... prove only the difficulty of the problem, or perhaps the distraction of lesser minds constantly sniping at the foundations! They do not invalidate the *principle* of constructed certainty.

  **Wallis:** But they *must* call it into question *for your application of it*! If the principle guarantees certainty *through correct construction*, and your constructions are consistently incorrect, what does that say about your grasp of the principle? Or its power to guarantee *your* conclusions? You build the Commonwealth on this geometric certainty, you say. But if the geometric foundation you personally lay is demonstrably unsound... what becomes of the Commonwealth built upon *your* reasoning? Is *it* truly certain? Or is it another beautiful, necessary ideal... undermined by flawed execution? My symbols, Hobbes, these 'empty scratches', are tools to *ensure* the construction is sound *before* we trust the maker's hand. They reveal contradictions your hand and eye alone cannot see.

  **Hobbes:** (Voice dropping to a dangerous growl) Symbols! Tools for sophists! They distance the mind from the *thing itself*! Geometry is philosophy made visible through construction. My certainty lies in the *clarity of the conception*, the *necessity of the reasoning*. The hand may err, but the *mind* that conceived the true circle, the true line... *that* mind possesses the maker's knowledge. My attempts prove the *challenge*, not the *falsehood* of the principle! You would reduce philosophy to calculation, Wallis. You mistake the map for the territory.

  **Wallis:** And you, Master Hobbes, mistake the architect's confident blueprint for the standing house. A blueprint riddled with structural errors will never yield a stable building, no matter how grand the conception. Your philosophy demands that the architect *also* be the infallible builder. History, and geometry, show no such infallibility exists. Not even in Thomas Hobbes. The *ideal* of constructed certainty remains potent. But your *claim* to have achieved it, repeatedly, in the face of overwhelming evidence to the contrary... *that* is what quietly wrecks your specific system. It shows the ideal, in mortal hands, is perilously fragile. Perhaps even unattainable in full. Especially when the builder refuses to check his levels.

  **Hobbes:** (Stares fiercely at Wallis, then down at the pamphlets – his and Wallis's – lying like opposing battle standards on the wet wood. He drains his tankard. The rain hammers the window.) Fragile? Unattainable? No. The truth is clear. The method is sound. It is the *world* that is stubborn, Wallis. And men like you who obscure it with your scribbles. Good day, Professor. Mind the puddles. They reflect nothing but distortion. (Hobbes gathers his papers and stalks out into the downpour.)

  **Wallis:** (Watches him go, then sighs, looking at the rain-blurred window) Distortion... or a clearer view of the storm within? The scaffolding stands... but the storm batters it relentlessly. And the builder will not yield. (He taps Hobbes's *Six Lessons* with a finger). A lifetime of storms, then. So be it.
