answer: |-
  Here’s a toast weaving supererogation into the fabric of Ray’s story while honoring *every* firefighter in the room. It avoids the philosophy lecture but uses the core idea to solve your problem:

  **(Clink glass)**  
  "Friends, family, fellow firefighters… gather ‘round for Ray. After 41 years steering this ship, the man deserves a send-off. Now, we all know what the job *is*. The bell rings, you go. You train, you sweat, you risk, you save. You do the job right. You go home. **That** is the standard. That is the *duty*. And to every single person in this department, past and present, who has answered that call, met that standard, and upheld that duty with unwavering commitment: we owe you our deepest respect and gratitude. You are the bedrock. You are the reason this town sleeps safe.

  But Uncle Ray… Ray always seemed to hear a different bell. Or maybe the same bell, just… louder. Longer. The job description ended at ‘extinguish fire, secure scene, return to station.’ For Ray? That was just the opening act. He saw the Hendersons standing in ash, and his mind went straight to lumber and hammers. He heard Mrs. Kowalski needed chemo, and his keys were already jingling. **Not because the job demanded it.** The job was done. The fire was out. The call was clear. **Because *he* demanded it of himself.**

  That’s the magic trick Ray performed, year after year. He lived in the space *beyond* the duty. Beyond the perfectly fulfilled obligation. Philosophers have a fancy word for it: supererogation. Acts that are *more* than required. The saints-and-heroes stuff. But Ray didn't need the word; he just saw the need and filled it. He built porches and drove to appointments not as Chief, but as Ray.

  **Here’s the crucial part, and why this room matters:** That space Ray occupied? It only *exists* because the bedrock is solid. It only shines because the duty is met, consistently and excellently, by everyone here. You can’t have the ‘beyond’ without the ‘call’ being answered flawlessly first. Ray’s extra mile wasn’t a critique of the standard route; it was a luxury *made possible* by knowing the standard route was covered, reliably, by all of you. His supererogation wasn't him working *alone*; it was him building *on top* of the foundation this entire department poured, day in and day out, call after call.

  So tonight, we toast Ray Ray. The man who redefined ‘enough.’ Who showed us that sometimes, the most profound service happens *after* the siren stops. Who proved that duty is the floor, not the ceiling. But we also toast this incredible volunteer fire department – the ones who showed up, did it right, went home, and made the town safer, year after year. You created the stability, the trust, the *capacity* that allowed Ray’s extraordinary ‘more’ to flourish. You are the essential rhythm; Ray was the unforgettable grace note.

  To Ray: For showing us what lies beyond the call. And to this department: For answering the call, every single time, making that ‘beyond’ possible. Cheers!"

  **Why this works for your problem:**

  1.  **Explicitly Honors the Standard Duty:** It clearly defines and praises the core job done right by everyone ("bedrock," "foundation," "answered the call every single time").
  2.  **Defines Supererogation Practically:** Uses clear examples (porch, chemo) and simple language ("beyond the duty," "more than required," "space beyond the call") without jargon or paradoxes. The "saints-and-heroes" reference is fleeting and illustrative, not academic.
  3.  **Makes Ray's Actions Relational, Not Superior:** Positions Ray's supererogatory acts as *dependent* on the department's reliable fulfillment of duty ("luxury *made possible*," "building *on top* of the foundation," "created the stability... that allowed Ray’s... ‘more’ to flourish"). His actions are framed as additive, not indicative of greater care.
  4.  **Elevates Both:** The final toast explicitly toasts *both* Ray for the "beyond" *and* the department for the essential foundation that enables it. It shows they are two vital parts of the same ecosystem.
  5.  **Dodges the Paradox:** By focusing purely on the observable *actions* (duty done vs. extra acts done) and their practical interdependence within the department's culture, it sidesteps the philosophical "ought/can" debate entirely. It's about what *was* done, not abstract obligation.
  6.  **Time & Tone:** Concise, heartfelt, uses firefighter imagery, lands within 5 minutes, and ends on a unifying note of shared purpose and mutual respect.

  This approach uses the *concept* of supererogation not just as decoration, but as the structural beam holding up the central argument: Ray's greatness was enabled by, and exists alongside, the consistent, essential greatness of the whole team.
