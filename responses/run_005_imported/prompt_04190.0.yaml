prompt: |-
  A friend and I spent an evening arguing about evidential cooperation in large worlds (ECL) -- the idea, discussed in some effective-altruist and rationalist circles, that in a sufficiently large or infinite universe you should act somewhat cooperatively toward the values of other agents whose reasoning correlates with yours, despite having no causal contact with them. Neither of us gave ground. Her position: ECL is just Hofstadter's superrationality dressed up in cosmology; she pointed out that Caspar Oesterheld's original 2017 paper literally called the idea 'multiverse-wide superrationality,' so the later rebranding as 'ECL' is a change in marketing, not in substance. My position: the rebranding tracks something real, since ECL is meant to justify cooperation among agents with divergent, even conflicting, terminal values who never negotiate or communicate, whereas Hofstadter's argument was built for symmetric games between agents with the same payoff structure. She replied that extending superrational reasoning to asymmetric, differing-value cases is just applying the same logic to a wider domain, not a different kind of argument. I want a real verdict, not a diplomatic split of the difference. Please compare ECL with superrationality in enough technical detail to identify exactly where, if anywhere, ECL's case for cooperation relies on assumptions Hofstadter's argument doesn't need -- for instance, regarding correlation across dissimilar agents, compromise across value systems, and the role of evidential versus causal decision theory -- and then state plainly whose reading of the relationship holds up better, noting anything you think we're both overlooking.
reasoning: |-
  Okay, the user and their friend are deep into a philosophical debate about ECL vs. superrationality. Let me start by recalling the core arguments. The friend claims ECL is just a rebranded superrationality with cosmology, pointing to Oesterheld's original naming. The user argues ECL introduces something new by handling asymmetric values and no communication.

  First, I need to dissect both concepts. Hofstadter's superrationality is based on symmetric games where players have identical payoffs and reasoning. The key is mutual prediction leading to cooperation without communication. It's grounded in game theory and assumes symmetry.

  ECL, on the other hand, deals with large worlds where agents might have different values and no causal contact. The cooperation here isn't about identical payoffs but about correlated decision-making across a multiverse. Agents condition their actions on the broader ensemble of similar reasoners.

  Where's the divergence? Asymmetry in values is a big point. Superrationality requires symmetric payoffs, while ECL allows for conflicting terminal values. The user mentioned compromise across value systems. In ECL, agents maximize a compromise utility function, which isn't present in Hofstadter's model. That's a structural difference.

  Evidential decision theory (EDT) versus causal decision theory (CDT) is another angle. Superrationality uses EDT, where actions are evidence of others' actions. ECL also relies on EDT but extends it to large worlds where correlations come from logical ties or reasoning similarities, not just game symmetry. The cosmological scale introduces acausal correlations based on agent types.

  The friend's argument that ECL is just an extension might overlook these new elements. The compromise utility function and the handling of value conflicts are substantive additions. Also, the large world assumption changes how correlations work, moving beyond symmetric games to any correlated decision-makers, regardless of payoff structures.

  The user wants a verdict. After comparing, ECL does introduce new assumptions: compromise over conflicting values, agent typing in large worlds, and reliance on EDT in cosmological contexts. These aren't minor extensions but foundational differences. So the user's position holds better. However, both might overlook how ECL's dependency on EDT makes it controversial, as CDT proponents would reject the premise. Also, the practical implementation of compromise utilities is a challenge. The debate's depth shows they're both insightful, but the technical additions in ECL justify its rebranding as more than just marketing.
answer: |-
  Your debate cuts to the core of philosophical decision theory. While your friend correctly identifies the lineage, **your position holds up significantly better.** ECL isn't *just* superrationality rebranded; it crucially extends and modifies the framework to handle fundamentally different scenarios, relying on stronger and more contestable assumptions. Here's the technical breakdown:

  **1. Core of Hofstadter's Superrationality:**
      *   **Domain:** Symmetric, one-shot games (especially pure coordination/cooperation dilemmas like Prisoner's Dilemma).
      *   **Agents:** Assumed *identical* in payoff structure, reasoning capabilities, and access to the same logical truths. They are perfect "clones" in terms of decision process.
      *   **Mechanism:** Evidential Decision Theory (EDT). An agent reasons: "My choice is *evidence* of what other superrational agents *like me* will choose, because we all reason the *same way* from the *same premises*. If I cooperate, that is strong evidence they cooperate too (and vice versa), leading to the best mutual outcome. Defecting guarantees mutual defection."
      *   **Key Assumption:** **Strict Symmetry.** Identical payoffs, identical reasoning processes, identical situational knowledge. Cooperation emerges from perfect mutual predictability based on shared identity.
      *   **Outcome:** Points to a specific cooperative Nash equilibrium in symmetric games reached acausally via EDT reasoning.

  **2. Core of ECL (Multiverse-Wide Superrationality):**
      *   **Domain:** Large or infinite universe/multiverse containing many instances of decision-makers facing *structurally similar but not identical* decisions, potentially with vastly different resources, environments, and crucially, **different terminal values**.
      *   **Agents:** Agents whose *decision algorithms* are correlated (e.g., similar reasoning heuristics, same source code, same evolved instincts, same mathematical intuitions) **even if their payoffs/values differ**. They are "similar reasoners," not "clones."
      *   **Mechanism:** Evidential Decision Theory (EDT) + **Compromise Utility Function**. An agent reasons: "My choice is *evidence* of what other *correlated reasoners* will choose in *their* respective situations. Because we share correlated decision algorithms, my action provides information about theirs. To maximize the expected fulfillment of *my* values, I should choose an action that, *if imitated* by correlated agents in other contexts, leads to outcomes that best satisfy a **compromise** between *my* values and *theirs* (weighted by correlation strength)."
      *   **Key Assumptions:**
          *   **Agent Correlation Across Dissimilarity:** Decision algorithms remain correlated even when agents have different goals, resources, and environments. This correlation is often posited via "agent type" based on reasoning procedure.
          *   **Value Compromise:** An agent must optimize a **meta-utility function** that isn't their own terminal values, but a function incorporating the values of *other* correlated agents. ECL typically suggests weighting by the *strength of the decision correlation*. (e.g., U_meta(a) = Σ_i [ Correlation(Me, Agent_i) * U_i(Outcome_i | a) ]).
          *   **Large World Justifies EDT:** The vastness/infinity of the universe ensures that for any agent type, there are many instances facing decisions where their action provides evidence about the actions of others *acausally*.
          *   **Dominance of Acausal Effects:** The benefits of influencing correlated agents elsewhere outweigh the local costs of compromise (reliant on the large world assumption).
      *   **Outcome:** Prescribes cooperation/compromise *even when local incentives strongly favor defection/selfishness* and *even when dealing with agents whose terminal values conflict with yours*, based on the acausal benefits of coordinated action across the multiverse.

  **Crucial Differences & ECL's Additional Assumptions:**

  1.  **Symmetry vs. Asymmetry & Value Conflict:**
      *   **Superrationality:** *Requires* symmetric payoffs/values. Cooperation is selfishly optimal *because* others value the same outcomes as you. No value compromise is needed.
      *   **ECL:** *Explicitly addresses* asymmetric payoffs and conflicting terminal values. **This is the core innovation and departure.** Cooperation/compromise requires agents to optimize a *compromise utility function* incorporating *others' values*, weighted by correlation. **This "value compromise" assumption is entirely absent from Hofstadter's symmetric framework.**

  2.  **Nature of Correlation:**
      *   **Superrationality:** Correlation stems from *perfect identity* in reasoning and situation. Agents *are* the same.
      *   **ECL:** Correlation stems from *similarity in the decision algorithm/type*, persisting across vast differences in values, situations, and resources. This "agent typing" and the persistence of correlation across dissimilarity is a **stronger, more abstract, and less empirically grounded assumption** than Hofstadter's perfect symmetry.

  3.  **Role of EDT:**
      *   **Superrationality:** EDT provides a *justification* for cooperation within a symmetric game that CDT fails to provide. The evidence is straightforward: same game, same reasoning → same decision.
      *   **ECL:** EDT is the *fundamental engine*. The "evidence" link between *your* action and the actions of *dissimilar agents in different situations* is far more tenuous and relies entirely on the metaphysical premise of correlated decision types across a vast multiverse. **ECL is fundamentally *incoherent* under Causal Decision Theory (CDT)**, as there is no causal link. Superrationality, while EDT-based, *could* be seen as a pragmatic solution within a symmetric game, even if CDT is considered metaphysically correct. ECL *requires* accepting EDT as the *true* theory of rational choice in large worlds.

  4.  **Scope and Justification:**
      *   **Superrationality:** Solves a specific, well-defined problem in symmetric game theory. Its justification is logical self-consistency within that constrained domain.
      *   **ECL:** Makes a grand claim about how rational agents *should generally behave* across the multiverse to maximize their own value fulfillment, even in non-game-theoretic, asymmetric, value-conflicting scenarios. Its justification relies heavily on the **large world assumption** and the **acceptance of EDT as normative**, making it a much broader, more speculative, and philosophically loaded framework.

  **The Verdict:**

  You are correct. While ECL is deeply *inspired* by superrationality and uses EDT similarly, **the rebranding tracks a substantial conceptual evolution.** ECL's core innovation and its most controversial element is the **explicit mechanism for cooperation/compromise between agents with *conflicting terminal values* who never interact, based on optimizing a compromise meta-utility function weighted by decision correlation.**

  **Your friend is overlooking:** Superrationality fundamentally relies on payoff symmetry. Removing this symmetry and introducing value conflict creates a qualitatively different problem. Applying "the same logic" to this different problem *requires* introducing entirely new conceptual components – namely, the **compromise utility function** and the **persistence of decision correlation across value differences**. These are not minor extensions; they are the defining features that allow ECL to address scenarios Hofstadter's framework cannot touch.

  **What You're Both Overlooking (Potential Weaknesses):**

  1.  **The "Agent Type" Problem:** Defining and measuring "decision algorithm similarity" or "agent type" across vast differences in embodiment, values, and environment is extremely fuzzy and potentially ill-defined. How similar is similar enough for non-negligible correlation?
  2.  **Practical Calculation:** Calculating the compromise meta-utility function requires impossible knowledge: identifying *all* correlated agents, their *exact* decision correlation strength, *their* utility functions, and *their* decision contexts. ECL often relies on highly abstract, idealized models.
  3.  **Tussle with CDT:** ECL stands in direct opposition to CDT. Critics argue EDT leads to absurdities (e.g., Smoking Lesion problem) and that rational action should only consider causal consequences. ECL's viability hinges on winning the broader CDT vs. EDT debate.
  4.  **Anthropics & Infinite Ethics:** In truly infinite universes, standard utility aggregation breaks down (Pascal's Wager on steroids). ECL papers often brush against these deep, unresolved problems in infinite ethics and anthropic reasoning without fully resolving them.
  5.  **Bootstrapping Cooperation:** Why would the *first* agent using this reasoning assume others are also using it? Superrationality assumes mutual recognition of superrationality. ECL requires assuming correlated agents are *also* applying ECL reasoning, creating a potential circularity or coordination problem in adopting the framework itself.

  **Conclusion:** Your friend is right that ECL descends directly from superrationality and shares its EDT core. However, **your position is stronger:** ECL's necessity for a **value compromise mechanism** and its reliance on **persistent decision correlation across agents with divergent terminal values and asymmetric situations** represent significant conceptual additions and stronger assumptions not present in Hofstadter's original symmetric framework. The "ECL" rebranding reflects this substantive extension to a far broader and more challenging domain of cooperation under value conflict and causal isolation. It's not just marketing; it's a distinct, more ambitious, and more philosophically fraught argument.
