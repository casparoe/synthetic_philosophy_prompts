answer: |-
  That's a fantastic and very common debate in probability and gambling theory! Your intuition is spot on - your friend is making a classic mistake by focusing *only* on Expected Value (EV) while ignoring **Risk of Ruin (RoR)** and the concept of **Bankroll Growth Optimization**. Here's the breakdown:

  **The Flaw in Your Friend's Logic (Betting Max When +EV):**

  1.  **Expected Value (EV) is Long-Term AVERAGE, Not Guaranteed Outcome:** EV tells you what you expect to win *on average* over an infinite number of identical bets. It does *not* guarantee you win *this specific hand*, or even a series of hands. Variance (swings) is real.
  2.  **Bankroll Size Matters:** Betting a huge portion of your bankroll on a single hand, even with a positive EV, exposes you to catastrophic loss. Losing a single large bet can wipe out a significant chunk of your capital, making it impossible to recover and play future +EV hands.
  3.  **Risk of Ruin (RoR):** This is the probability you will lose your entire bankroll before achieving the long-term EV. **Betting too large a fraction of your bankroll *dramatically* increases your Risk of Ruin, even when every bet has positive EV.** This is the core flaw. You can mathematically prove that betting too aggressively leads to a 100% chance of ruin over time.
  4.  **Diminishing Returns on Growth:** While a bigger bet scales up the *dollar* EV ($EV), it also scales up the *variance* and the *percentage risk* to your bankroll. There's a point where increasing your bet *reduces* your *expected long-term growth rate* per bet because the risk of losing a large chunk outweighs the potential gain.

  **Why Your Friend is Wrong (Mathematically):**

  *   Imagine a simple coin flip: Heads you win double your bet, Tails you lose your bet. This has a massive 50% edge (EV = +25% of bet)! If you start with $100, betting $100 gives:
      *   50% chance: $200 (Win $100)
      *   50% chance: $0 (Lose $100)
      *   EV = +$50! Amazing!
      *   **RoR = 50%!** Half the time you're broke after one flip. Even if you win the first flip and have $200, betting $200 next gives you a 50% chance to be broke on flip #2. Your long-term chance of ruin approaches 100% because one loss wipes you out.
  *   Now, bet only $10 on that same coin flip:
      *   EV = +$2.50 (smaller dollar amount)
      *   RoR is *drastically* lower. It would take a *long* streak of losses to go broke. Your bankroll can weather the variance.

  **The Solution: The Kelly Criterion**

  This is the mathematical answer to "how much *should* I bet?" when you have an edge. It balances maximizing the *expected long-term growth rate* of your bankroll while **reducing the Risk of Ruin to near zero**.

  *   **Core Idea:** Bet a *percentage* of your *current bankroll* proportional to your edge and the odds offered.
  *   **Formula (Simplified for Even-Money Bets like Blackjack):**
      `f* = (bp - q) / b`
      *   `f*` = Fraction of bankroll to bet
      *   `b` = Net odds received on the bet (for even money, `b = 1` - you win $1 for each $1 bet)
      *   `p` = Probability of winning
      *   `q` = Probability of losing (`q = 1 - p`)
  *   **For Blackjack:** Your "edge" comes from the count. You estimate `p` (win prob) and `q` (loss prob) based on the count and basic strategy for that situation. `b` is usually 1 (for a standard win), but remember blackjack pays 3:2, which slightly modifies the formula. Card counters use software or complex calculations to estimate their precise edge (`p - q`) for different counts/deck penetrations.
  *   **Key Outcomes of Kelly Betting:**
      *   **Maximizes Long-Term Growth:** Your bankroll grows faster over time than with any other strategy.
      *   **Minimizes Risk of Ruin:** Theoretically zero if you know the edge perfectly (though practical RoR is very low).
      *   **Requires Precise Edge Estimation:** If you overestimate your edge (`p`), you bet too much and increase RoR. If you underestimate, you bet too little and grow slower. Card counters often bet a *fraction* of Kelly (e.g., 1/2 Kelly) to be conservative.

  **Applying it to Your Friend's Situation:**

  1.  **Estimate the Edge:** When the count is favorable, your friend needs to know *how* favorable. What is his estimated win probability (`p`) and edge (`p - q`)? This requires significant skill and data.
  2.  **Calculate Kelly Fraction:** Plug the edge and odds into the Kelly formula. Let's say he calculates a 2% edge (`p = 0.51`, `q = 0.49`, `b = 1`):
      `f* = ((1 * 0.51) - 0.49) / 1 = (0.51 - 0.49) = 0.02`
      He should bet **2%** of his *current bankroll*.
  3.  **Bet Size is Dynamic:** If his bankroll is $10,000, he bets $200. If he wins and his bankroll becomes $10,200, he bets $204 on the next +EV hand. If he loses and it drops to $9,800, he bets $196. It scales with his available capital.
  4.  **Table Limits:** Kelly tells him the *optimal* bet based on his bankroll and edge. If 2% of his bankroll is $500, but the table max is $300, then betting $300 is acceptable (it's less than Kelly). If the table min is $50 but Kelly says bet $10, he *shouldn't* play that hand (or just bet the min if forced), as it's -EV or insufficient edge. The table max only *caps* his bet; it doesn't mean he *should* bet it.

  **Why Betting Max is Sub-Optimal (Even with Kelly Fraction < Max):**

  *   If Kelly says bet 1% ($100 on a $10k roll), but the table allows $1000, betting $1000 is *reckless*:
      *   Your $EV is higher ($10 vs $1, assuming 1% edge).
      *   **BUT** your RoR skyrockets. Losing that $1000 bet cripples your bankroll. Winning it gives a nice boost, but the *asymmetric risk* (losing hurts more than winning helps at that scale relative to your bankroll) makes it bad for long-term survival and growth.
      *   The *growth rate* of your bankroll is *lower* with the oversized bet than with the Kelly bet.

  **In Summary:**

  *   **You are correct:** Betting a huge portion of your bankroll on every +EV hand, even if you have an edge, is a mathematically proven path to eventual ruin due to variance. Positive EV alone does *not* justify any bet size.
  *   **The flaw:** Ignoring **Risk of Ruin (RoR)** and the impact of bet size on **long-term bankroll growth rate**.
  *   **The solution:** Use the **Kelly Criterion** (or a fraction thereof) to determine the optimal bet size as a *percentage of your current bankroll* based on your estimated edge. This maximizes growth while minimizing the risk of going broke.
  *   **Table limits:** Are a constraint. You bet the Kelly fraction *or less* (capped by the table max). Betting the max *only* makes sense if the Kelly fraction calculation tells you to bet *at least* that much relative to your bankroll and edge.

  Tell your friend his strategy maximizes *expected profit per hand* but minimizes his *chance of staying in the game long enough to realize that profit*. Kelly maximizes *long-term wealth accumulation*. It's not about being risk-averse; it's about being mathematically optimal for sustained success.
