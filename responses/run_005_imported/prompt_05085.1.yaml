  ok so I had this whole argument with my friend last night that's still bugging me. He counts cards at blackjack, and his rule is: whenever the count says the odds favor him, bet as much of your bankroll as the table allows, because thats when your expected value per hand is highest, so betting bigger just scales up the edge. I said that seems like a great way to eventually go broke even if every single bet really is good on paper, but he says thats just me being irrationally risk-averse and not trusting the math. Problem is, I couldn't actually explain what's wrong with his logic if the expected value genuinely is in his favor every time. Is he right that positive expected value alone justifies betting as big as possible, or is there a real flaw in that reasoning? And if there is, how would you actually figure out how much you should bet instead?
