answer: |-
  ## Dialogue: After Lewis  
  *Setting: A seminar room, whiteboard still covered in the remnants of Lewis’s triviality proof. DR. ARIS THORNE (Propositionalist) and DR. BRYN KELLER (NTV Theorist) are packing up.*  

  **Thorne:** Well, Bryn, Lewis certainly lays it bare. The Equation *can’t* hold as a general identity between the probability of a proposition and a conditional probability. Trying to make `P(If A, B) = P(B|A)` a universal law of the credence calculus forces absurd independence. So, the Equation must be context-bound. It’s a feature of how we *use* conditionals relative to a fixed body of evidence, not a deep structural feature of their content. Van Fraassen showed how to model it within a single probability space via supervaluations over contextually determined selection functions.  

  **Keller:** *[Leaning against the table, frowning]* Context-bound? That feels like surrender dressed up as sophistication, Aris. Lewis’s proof shows precisely why trying to *force* conditionals into the propositional mold is the problem. If ‘If A, B’ expressed a proposition whose probability *always* equaled P(B|A), Lewis breaks it. Good! It never did. The Equation *isn’t* about truth-probability – it’s about *assertability*. Adams got it right: the assertability of ‘If A, B’ *is* P(B|A). Lewis doesn’t refute that; he refutes the idea that it’s a proposition with a fixed truth-condition. Denying NTV means you inherit the entire wreckage Lewis created. How much pragmatic glue do you need to explain why the Equation seems compelling *only* until we shift our credences?  

  **Thorne:** Pragmatic glue is preferable to abandoning logic! Start with negation. Take ‘It’s not the case that if it rains, the match will be canceled.’ On your view, what am I denying? If the conditional has no truth value, negation shouldn’t apply cleanly. Yet we reason with such negations: "If it rains and the match isn’t canceled, we’ll get wet; but it’s *not* the case that if it rains, the match is canceled; so…" How does *that* work without truth-apt components? Frege-Geach isn’t a minor nuisance; it’s about compositionality. Your ‘assertability’ looks like probability in drag, but collapses when embedded.  

  **Keller:** *[Holds up a hand]* Hold on. First, negation: denying ‘If A, B’ isn’t asserting a truth-functional negation of a non-proposition. It’s expressing *rejection* of the high conditional probability – roughly, it’s assertable when P(B|A) is low. Embedding *is* trickier, I grant you. But Edgington’s work shows we can extend the probabilistic assertability model. For ‘If (If A, B), then C’, its assertability isn’t P(C | some proposition), but a *conditional conditional probability* – a complex, but coherent, constraint on credences: the assertability is high if P(C | A & B) is high *given* that P(B|A) is high. It’s meta-probabilistic, not truth-conditional, but it tracks how we *reason* with uncertain conditionals. Your supervaluations are elegant, but they’re silent on *why* shifting to P’(·) = P(·|¬B) suddenly makes P’(If A, B) diverge wildly from P’(B|A). Isn’t *that* the unexplained pragmatics?  

  **Thorne:** *[Pauses, tapping his pen]* It’s not unexplained; it’s about context shift. Stalnaker’s framework builds it in: conditionalizing on ¬B changes the context, altering the selection function determining the closest A-world. The *proposition* expressed by ‘If A, B’ shifts. The Equation holds relative to a context, but contexts aren’t stable under arbitrary belief revision. Lewis’s proof exploits that instability. What *you* call ‘meta-probabilistic’ machinery looks like a hidden admission that the *real* work is done by the probability of A&B versus A&¬B – the truth-conditional core you deny!  

  **Keller:** *[Leans forward, intense]* But that’s the heart of it! You say the *proposition* shifts with context. I say there *is* no proposition – only a rule for updating our attitudes. When I say ‘If A, B’, I’m not describing a world; I’m constraining my hypothetical belief state. Lewis’s proof shows that if you try to make it a proposition, its probability must be pathologically sensitive to irrelevant evidence – like conditionalizing on ¬B forcing independence. That’s not context-sensitivity; that’s a *reductio* on propositionality! My ‘meta-probabilistic’ account doesn’t *need* that sensitivity because it’s not trying to be truth-conditional. The cost of your contextual propositionalism is that the intuitive, surface validity of simple inferences – which the Equation captures beautifully in a fixed context – becomes hostage to opaque shifts in the proposition expressed. How is *that* explanatory?  

  **Thorne:** *[Sighs, conceding ground slightly]* It’s explanatory because it preserves classical logic and compositionality. Your assertability conditions for complex embeddings – ‘If (If A, B), C’ – might be formally specifiable, but do they *really* mirror how ordinary speakers grasp the content? When someone says, "Even if it’s true that if she studied she passed, I doubt she studied," they’re treating the conditional as a factive component. Your system has to reinterpret that as an attitude towards a probability. Isn’t *that* the more radical reinterpretation?  

  **Keller:** Radical, perhaps, but honest about the data Lewis forces on us. Ordinary speakers *do* treat ‘If A, B’ differently from ‘A and B’ or ‘A or B’. They balk at truth tables for conditionals! The Equation’s resilience in *fixed* contexts is explained by its role in guiding suppositional reasoning. The embedding challenges are real, but they push us towards a richer non-propositional logic of attitudes, not back into a propositional mold that Lewis proved is leaky. Your contextualism saves the letter of propositionality only by making the content so shifty that the Equation’s apparent simplicity becomes a pragmatic mirage.  

  **Thorne:** And your non-propositionalism saves the Equation only by sacrificing the unity of semantic content. *[Gathers papers, stands]* So we agree Lewis leaves no comfortable middle ground. Either conditionals are propositions whose probability is contextually tethered to P(B|A) but prone to Lewisian fractures, or they aren’t truth-apt at all, and we rebuild logic around assertability gradients.  

  **Keller:** *[Also standing, offering a wry smile]* Exactly. And I’ll take rebuilding over patching any day. Coffee? I want to hear how your supervaluations handle the case where A is about the *same* context shift induced by conditionalizing…  

  **Thorne:** *[Chuckles]* Only if you first explain how negation works in your ‘If not-A, then if A, B’ without truth values. Touche. Lead on.  

  *(The door closes behind them, the unresolved tension lingering with the chalk dust.)*  

  ---

  **Key Points Covered:**  
  1.  **Lewis's Proof as Fork:** Both agree it forces a choice: propositionalism + contextual fragility vs. NTV + compositional challenges.  
  2.  **Frege-Geach Press:** Thorne challenges negation and embedding (e.g., conditionals as antecedents). Keller responds with probabilistic assertability rules (Edgington) for embeddings, framing it as meta-constraints on credences.  
  3.  **Pragmatic Cost Press:** Keller argues propositionalism needs unexplained pragmatics to explain why the Equation *seems* true locally but breaks under conditionalization. Thorne attributes this to context-shift (Stalnaker/van Fraassen).  
  4.  **Core Trade-off Sharpened:**  
      *   *Thorne (Propositionalist):* Prioritizes classical compositionality and logic, accepts contextual instability of the Equation as the price.  
      *   *Keller (NTV):* Prioritizes preserving the Equation as a direct rule of rational assertability/reasoning, accepts non-standard semantics for embeddings as the price.  
  5.  **No Resolution, Narrowed Disagreement:** Ends on symmetrical challenges: Thorne presses on negation in complex NTV embeddings; Keller presses on the opacity of propositional context-shifts. The fundamental divide – truth-aptness vs. assertability-guide – remains.
