answer: |-
  Here's a meticulously constructed counterexample designed to satisfy all eight of Fuller's desiderata while embodying profound substantive injustice: **The "Historical Property Validation and Restitution Act" (HPVRA) Regime.**

  **The Regime & Its Core Law:** A newly established state, founded on territory with a complex history of conquest, displacement, and contested ownership, enacts the HPVRA. Its primary function is to definitively settle *all* land and major asset ownership claims based on a single, procedurally rigid principle:

  1.  **The Core Rule:** Absolute legal title to any land or major asset (buildings, businesses above a certain value) is vested *solely* in the person(s) who can produce an unbroken chain of documented legal transfers ("chain of title") recognized under *any* prior sovereign authority that exercised *de facto* control over the territory where the asset is located, dating back at least 100 years. Possession without documented title is legally meaningless. Claims based on historical use, cultural significance, ancestral occupation without documented *legal* ownership, or moral rectification of past injustices are explicitly barred.

  **Why this is Substantively Unjust:**
  *   **Perpetuates Historical Theft:** It formalizes ownership based on legal systems (e.g., colonial powers, conquering states, discriminatory regimes) that often seized land violently or through fraudulent treaties, dispossessing indigenous populations or minority groups whose concepts of ownership weren't documented in that manner.
  *   **Ignores Systemic Dispossession:** Groups systematically excluded from legal systems (denied property rights, literacy, access to courts) under prior regimes have no path to reclaim ancestral lands, even if dispossession is recent and well-documented *outside* the strict legal chain.
  *   **Wealth & Power Entrenchment:** Benefits only those who already possess (or can afford to research/forge/fabricate) complex historical legal documents, overwhelmingly favoring the wealthy, connected, and descendants of the privileged/powerful under prior unjust regimes. It locks in historical inequalities.
  *   **Denies Remedial Justice:** Explicitly prohibits any legal avenue for addressing past wrongs related to property, no matter how grievous or well-proven through non-legal historical evidence.

  **Demonstrating Compliance with Fuller's Eight Desiderata:**

  1.  **Generality:** The HPVRA applies universally to *all* land and major assets within the state's territory. It establishes a single, abstract rule for determining ownership applicable to every citizen and every relevant asset. No ad hoc decisions are made about who owns what; ownership flows solely from the documented chain of title rule. *(Check: Satisfied)*
  2.  **Promulgation (Publicity):** The HPVRA is published in the official gazette, available in all major languages spoken in the state, distributed to all courts and government offices, and summarized in public information campaigns. Its core rule ("ownership = documented chain of title back 100+ years") is clearly stated. The complex *procedures* for submitting claims, the required documentation standards, and the appeals process are also fully public and accessible (though complex). *(Check: Satisfied - Rules are public, knowable)*
  3.  **Non-Retroactivity:** The HPVRA establishes rules for *current* ownership determination. It doesn't *criminalize* past possession based on different norms. It changes the *future* legal status of assets based on a newly applied standard (the 100-year chain requirement), but the standard itself relies on *past* legal acts (transfers) that were legal under the regimes that performed them. It doesn't declare past legal transfers illegal *now*; it uses them as the *sole basis* for current ownership. *(Check: Satisfied - It's prospectively determining present rights based on a new rule applied to past facts, not retroactively punishing past lawful acts.)*
  4.  **Clarity:** The rule is remarkably clear: "Legal ownership requires an unbroken chain of documented legal transfers recognized by a prior *de facto* sovereign, traceable back at least 100 years. No other claims are valid." Definitions ("legal transfer," "recognized," "*de facto* sovereign," "documented," "unbroken chain," "major asset") are exhaustively and precisely defined in accompanying regulations. While complex to *apply* (requiring historical research), the *rule itself* is unambiguous. *(Check: Satisfied - Clear rule, clear definitions)*
  5.  **Non-Contradiction:** The legal system built around the HPVRA is meticulously crafted. The HPVRA is the supreme law concerning property title. All other laws (contract, tort, inheritance) are amended or interpreted to be consistent with its core principle. Regulations detail procedures without contradicting the Act or each other. Courts are given clear precedence rules. *(Check: Satisfied - Unified, non-contradictory system built around the core rule)*
  6.  **Possibility of Compliance:** Complying with the *rule* as a citizen is possible:
      *   If you have the documents, you submit them to the Title Validation Tribunal (TVT).
      *   If you lack documents and believe you should own something, the law clearly states you have *no valid claim* under the HPVRA. Your compliance is to *not* file a claim or to relinquish possession if challenged by a validated owner. Complying means *accepting* the outcome dictated by the rule.
      *   The procedures for submitting claims, while arduous and expensive, are technically feasible: file forms, present documents, attend hearings, appeal. *(Check: Satisfied - One can either follow the claim procedure or accept non-ownership; the law doesn't demand impossible actions like proving a negative or creating documents that don't exist.)*
  7.  **Constancy (Stability):** The HPVRA is entrenched as a constitutional cornerstone. Amendments require supermajorities. The core rule and definitions remain fixed. Procedures might be refined for efficiency, but the fundamental principle of ownership determination is unwavering. Predictability is high: everyone knows the *only* way to establish ownership. *(Check: Satisfied - Stable core rule)*
  8.  **Congruence (Between Declared Rule and Official Action):** This is crucial. The state invests heavily in a professional, well-trained, and uncorrupt Title Validation Tribunal (TVT) and enforcement apparatus.
      *   The TVT *scrupulously* applies only the documented chain of title rule. Historical injustice pleas are ignored, as the law commands. Emotional appeals are inadmissible.
      *   Police and courts *consistently* evict occupants lacking validated title, enforcing the TVT's decisions swiftly and impartially according to the letter of the HPVRA and enforcement regulations.
      *   No secret exceptions exist. Officials do not deviate from the rules based on personal feelings or hidden directives. The law is enforced *exactly* as written and promulgated. *(Check: Satisfied - Perfect congruence. Officials are "Vogons" following the rule meticulously.)*

  **The Airtight Procedural Case & Pressure on Fuller:**

  This regime satisfies all eight desiderata *formally* and *in practice*. It is the antithesis of Rex's failures. The law is general, public, clear, consistent, prospective, stable, possible to comply with (in its own terms), and enforced with robotic congruence.

  Yet, it is profoundly substantively unjust. It weaponizes procedural perfection to sanctify historical wrongs and permanently disenfranchise vulnerable populations. There is no "nudge" towards decency here. The regime can operate with cold, procedural efficiency while perpetuating massive injustice. Officials can feel they are perfectly moral *as legal officials* – they are just following the clear, public, stable rules! – while enacting profound societal harm.

  This directly challenges Fuller's core claim. It demonstrates that the "inner morality of law," concerned solely with the *how* of lawmaking, is compatible with deeply immoral *content*. The procedural virtues ensure the law works *effectively* as a system of rules, but they provide no inherent barrier to rules that systematically favor one group over another based on the frozen accidents of history and prior power structures. The regime is monstrous precisely *because* it satisfies Fuller's eight points so well, making its injustice legally unassailable within the system it creates. The procedural morality facilitates, rather than impedes, the substantive immorality by giving it a stable, predictable, and efficiently enforced form.
