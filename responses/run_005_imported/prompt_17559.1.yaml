  The air in *The Rusty Valve* tasted like stale beer and desperation. Aris traced a finger through the condensation on his glass, watching the bubbles die in cheap synth-ale. Rent was due yesterday. The repo bots were circling his flitter like vultures. He was two bad decisions away from selling his internal augmentations for scrap.

  "Rough week?"

  The voice was low, gravel scraped over concrete. Silas slid onto the stool beside him, his worn synth-leather jacket creaking. He wasn't a regular. He had the look: calm eyes that missed nothing, hands that stayed relaxed but looked like they knew how to break things. Aris knew the type. Fixer. Opportunity. Danger.

  "Something like that," Aris muttered, not meeting his gaze.

  "Heard you’re good with locks. The *quiet* kind. Not the smash-and-grab amateurs."

  Aris finally looked at him. "Depends."

  "Depends on what?"

  "On the lock. And the pay."

  Silas smiled, a thin curve of lips. "The lock is Level-5 BioSecure on a private vault. The pay…" He named a figure that made Aris’s synth-ale suddenly taste like vintage champagne. Enough to vanish, start clean. "Forty percent. Upfront."

  Aris scoffed. "No one pays forty upfront for muscle and lockpicks. Not for a vault job. What’s the catch?"

  "The catch," Silas leaned in, his voice dropping further, "is *you* don't get the forty upfront. You get ten. The rest waits in a dead-drop *after* the job, *after* we’re clear. *After* you meet me at the rendezvous point and hand over the primary payload."

  Aris blinked. "You expect me to do the hard part, get the goods, and then just… *meet* you? With the payload? After I already have it all?" It sounded insane. Once the payload – rumored to be uncut data-slivers worth millions – was in his hands, meeting Silas meant sharing. Fleeing meant keeping it *all*.

  Silas’s eyes didn’t waver. "I do. Because I know people, Aris. I know desperation. I also know a bluff. That little tremor in your voice when you lie? The micro-tension around your eyes? My neural lace picks it up. Crystal clear." He tapped his temple. "If you sit here right now and tell me, hand on heart, that once you have that payload safe in your hands, you *will* come to the rendezvous and hand over my share… I’ll know if you mean it. Truly mean it. If I believe you, you’re in. Ten percent upfront, tools, schematics. If I don’t…" He shrugged. "You finish your synth-ale."

  Aris felt the trap. The beautiful, terrifying, Parfitian trap. To get the job, the upfront ten, the *chance*, he had to convince Silas he was the kind of person who would *later* do the seemingly irrational thing: share the loot when keeping it all was easier and safer. He had to *be* that person, right now, in his core. Silas wasn’t buying a promise for the future; he was buying Aris’s *character* in the present.

  He thought of the repo bots. Of sleeping in the rain-slicked alley behind the bar. The ten percent upfront would stave off disaster. The full forty… was freedom. But only if Silas believed he wouldn’t run.

  He looked Silas dead in the eye, pouring every ounce of sincerity he could dredge up from a life of mostly insincerity. "Silas," he said, his voice steady, low, matching the fixer's intensity. "You get me on this job, you get me that upfront ten to handle my… situation, and I swear on whatever’s left of my honor: I get that payload, I *will* be at the rendezvous. I *will* hand you your share. That’s the deal. That’s how I operate." He held his breath.

  Silas watched him. Seconds stretched. Aris felt the neural lace probing, a phantom itch behind his own eyes. Then, Silas nodded once, curtly. "Good. Meet me at the docks, Bay 47, tomorrow night. Midnight. Don’t be late." He slid a cred-stick across the bar – the ten percent. Aris pocketed it, his fingers trembling only slightly. The first part was done.

  ***

  The vault job was a symphony of tension and near-disasters. Silas’s intel was good, Aris’s lockpicks were better. They bypassed drones, silenced alarms, danced through laser grids. Aris cracked the BioSecure lock with sweat stinging his eyes and his heart hammering against his ribs. Inside, nestled in a null-field case, were the data-slivers – sleek, black, humming with potential energy. Worth more than Aris had ever dreamed.

  Silas handled the exterior security overwrite, his voice calm in Aris’s comm-piece. "Payload secure?"

  "Secure," Aris confirmed, hefting the surprisingly heavy case.

  "Exfil route Beta. Clean. Go. Rendezvous unchanged. Two hours." The comm clicked off.

  Aris melted into the pre-dawn shadows of the city’s underbelly. The cred-stick with ten percent was a comforting weight, but the case… the case was *everything*. Freedom. A new life. No more *Rusty Valve*, no more repo bots. He navigated service tunnels, his augmented senses alert for pursuit, but the city slept. Silas had been right; the exit was clean.

  He reached the abandoned transit hub Silas had designated as the rendezvous point. Dim emergency lights cast long, skeletal shadows. He was early. The case sat at his feet, a small, dark monolith of possibility. The rational thought screamed in his head: *Run. Now. You have it all. Silas doesn’t know where you are. You owe him nothing. He paid you ten for the work; the rest is profit. Pure, beautiful profit. RUN.*

  He could be on a sub-orbital shuttle in an hour. Gone. Silas couldn’t track the slivers; they were shielded. The neural lace lie-detector was kilometers away. The rational, self-interested move was blindingly obvious: take the case and vanish.

  But the memory of Silas’s probing gaze in the bar slammed back into him. *"I’ll know if you mean it. Truly mean it."* Aris hadn't just been lying to Silas that night; he’d been convincing *himself*. To pass the test, to get the job, he’d had to *become*, in that moment, the man who keeps his word even when it burns. He’d had to bury the opportunistic thief and resurrect some ghost of integrity, just deep enough to fool the lace, just deep enough to fool *himself* into believing it was real. Because only genuine conviction could have passed Silas’s test.

  He looked down at the case. The rational move *now* was to run. But the rational move *then* had required him to be the kind of person who *wouldn't* run now. That person had gotten him the job, the upfront ten, the schematics, the clean exfil. That person had saved him. Was he still that person?

  The ghost of integrity, conjured for survival, felt suddenly heavy. It wasn't morality; it was the terrifying weight of his own prior, necessary commitment. Running felt like betraying the only version of himself that had earned this chance. He heard the distant hum of an approaching hover-craft – Silas, right on time.

  Aris didn't pick up the case to flee. He shifted his weight, the cold concrete biting through his boots, and waited in the shadows. The hum grew louder, resolving into the sleek, dark shape of Silas’s vehicle descending into the hub. The door hissed open. Silas stepped out, alone, his face unreadable in the gloom. His eyes went straight to the case at Aris’s feet, then lifted to meet Aris’s own.

  Aris said nothing. He simply nudged the case forward with his boot, a fraction of an inch. The gesture was small, insignificant. But in the silence of the abandoned hub, it echoed like the click of the vault lock disengaging. It was the sound of an irrational promise, kept.
