  The second committee member's point is crucial: if both have untraceable effects, why privilege measurability? But there's a difference in degree. The bed-net program's direct effects are immediate and observable, while advocacy's effects are several steps removed. The key is whether there's a threshold where uncertainty becomes cluelessness—where we can't even assign probabilities.

