  Okay so I need some help because I clearly lost an argument last night and I'm still a little annoyed about it. My friend Marco and I both had Mrs. Okafor for physics and homeroom back in high school, and shes retiring after 34 years, and the reunion committee (why did they pick me, I don't even live in the same state anymore) asked me to give a short toast at her retirement dinner next month. Mrs. Okafor basically ran her whole classroom off Whitehead's philosophy of education -- she had the "romance, precision, generalization" rhythm thing taped up by the door for years, and she'd go on about "inert ideas" like they were a disease you could catch. Marco's whole argument was that this was just branding: that she was a naturally intense, gifted teacher who happened to like reading Whitehead, and retrofit fancy vocabulary onto instincts she already had, and that if you deleted every Whitehead word from her classroom nothing about what actually happened there would change. I tried to argue the stages thing was doing real work and wasn't just a fancy way of saying "make it fun first, test them later," but when he pushed on what the difference actually was I kind of collapsed and he won by attrition.

  So here's what I actually need. The dinner is maybe 60 people, half of them other teachers from her department who will clock every single reference to the rhythm of education or inert ideas, and half of them former students and family who will mostly just remember her yelling that memorizing the value of g without understanding what it meant was "intellectually criminal." I don't want to write two speeches stapled together, and I definately don't want to give the kind of dead, going-through-the-motions toast that is exactly what Whitehead would call inert -- all the right words, no actual idea alive underneath them. Could you write me a 4-5 minute toast that uses the real substance of Whitehead's stages (and the inert-ideas thing) to structure what gets said, in a way that would basically settle my argument with Marco in my favor if he happened to be standing in the back? It should land first as a warm, funny toast for a room that loved her, not as a philosophy-of-education lecture wearing a party hat.
