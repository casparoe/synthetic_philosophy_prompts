answer: |-
  Here's a sharpened objection to Frege's unsaturatedness solution, designed to confront the core rejoinder and test its uniqueness:

  ### Core Objection: Unsaturatedness as Explanatorily Vacuous Labeling
  Frege's doctrine doesn't *explain* propositional unity; it merely *renames* the explanandum ("how do concepts unify propositions?") as a primitive property ("concepts are unsaturated"). This fails for three interdependent reasons:

  1.  **The Circularity Charge:** To say a concept is "unsaturated" is just to say *it has the capacity to combine with an object to form a unified whole*. But the very phenomenon we need explained is *how anything possesses this capacity*. Calling it "unsaturatedness" adds no explanatory content—it simply baptizes the mystery. It's analogous to explaining why opium induces sleep by attributing to it a "dormitive virtue." The regress is avoided only by declaring the unifying capacity primitive, not by illuminating its nature.

  2.  **Confronting the "Primitive Categorial Fact" Rejoinder:**
      *   **Granted:** Frege avoids *Bradleian-style* regress (needing a further relation) by making unsaturatedness a *fundamental, non-relational* feature of concepts. It's not an *item* needing glue; it's a *mode of being*.
      *   **However:** This merely shifts the locus of mystery. Instead of asking "What connects the concept to the object?", we now ask "What *is* this unsaturatedness such that it *enables* this automatic combination?" or "Why does presenting an unsaturated entity *together with* a saturated one *result* in unity rather than a list?" Declaring it primitive doesn't dissolve the puzzle; it declares the puzzle insoluble by further analysis. The *explanatory gap* – why *this* type of entity unifies while *that* type doesn't – remains wide open. Frege identifies *which* entities unify (unsaturated ones), but doesn't explain *how* or *why* their unsaturatedness grants them this unique unifying power. The unity problem isn't solved; its explanation is *foreclosed* by fiat.

  3.  **The Bradleian Parity Argument (Undermining Uniqueness):**
      *   A defender of Bradleian relations *can* make precisely the same move Frege makes with unsaturatedness. They can simply stipulate:
          > "Relations possess a primitive, sui generis *relating capacity*. This capacity is not an additional term or entity; it is an intrinsic, irreducible power of relations themselves. When a relation is 'occurring' or 'actualized' (not just mentioned), this primitive capacity is exercised, binding the relata into a unified complex *without* requiring any further connector. Objects lack this capacity; only relations possess it. This is a brute categorial fact."
      *   **Consequence:** This Bradleian stipulation *also* stops the regress at step one. The relating capacity is primitive, so no further relation is needed to connect *it* to the relata. The Fregean student's claim that unsaturatedness *uniquely* stops the regress evaporates. *Both* frameworks avoid an infinite regress by positing a primitive, non-relational unifying power inherent to a specific category of entity (unsaturated concepts / relating relations).
      *   **The Stalemate:** If the Fregean rejoinder ("it's primitive, so no regress!") is sufficient to solve the unity problem for concepts, then the *exact same rejoinder* is sufficient to solve it for Bradleian relations. Neither proposal offers a substantive *explanation* of unity; both merely *label* the unifying entities and declare their unifying power brute. Frege's unsaturatedness offers no *explanatory advantage* over a suitably primitivized Bradleian relation; it merely offers a different *metaphorical picture* (gaps vs. hooks vs. active powers).

  ### Implications for the Seminar Discussion
  *   **Testing the Verdict:** This objection forces students to defend whether unsaturatedness provides anything *more* than a primitive stopping point. Does it offer genuine *explanatory insight* into unity, or just a *description* packaged as an explanation? If it's the latter, then Frege hasn't "dissolved" the problem; he's re-described the datum and blocked inquiry.
  *   **Highlighting the Core Issue:** The fundamental challenge of the unity problem isn't *just* avoiding an infinite regress (many brute facts can do that). It's providing a satisfying account of *how disparate elements cohere into a truth-evaluable whole*. Frege brilliantly identifies a crucial *logical* distinction (saturated/unsaturated), but his metaphysical invocation of unsaturatedness as the *explanation* for unity risks being question-begging. It answers "How does the proposition unite?" with "Because one part is *the kind of thing* that unites propositions."
  *   **Pushing Further:** This sets the stage for discussing whether *any* solution can avoid brute facts (e.g., Armstrong's states of affairs, Wittgenstein's picturing) or whether the demand for a non-brute explanation is misguided. It also connects to critiques of Frege (e.g., from the Tractatus) that his "gaps" are merely notational artifacts without genuine metaphysical grounding.

  By presenting this objection, you challenge your students to move beyond the initial appeal of the regress-stopping power of unsaturatedness and grapple with the deeper metaphysical question of whether it genuinely *explains* unity or merely restates it within a novel (but equally primitive) categorial framework. The parity argument with Bradleian relations is particularly potent for undermining claims of Frege's unique success.
