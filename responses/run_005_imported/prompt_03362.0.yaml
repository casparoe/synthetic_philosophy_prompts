  Wittgenstein's lectures on religious belief draw this contrast: for an ordinary empirical claim, like "there's a German plane overhead," its totally fine to say "probably" or "I'm not sure" - but treating belief in the Last Judgement the same way, like its just one more hypothesis on a probability scale, misses something huge about what that belief actually is, according to him. He's also pretty scathing about Father O'Hara, a priest who tried to defend faith as reasonable using ordinary scientific-style evidence. Now, Dawkins literally puts belief in God on a probability spectrum in The God Delusion and treats it as a scientific hypothesis that the evidence refutes. What do you reckon Wittgenstein would've said to that? Would he actually side with Dawkins against O'Hara-style believers, or would he think Dawkins is making basically the same mistake, just from the other direction? Actually work through the reasoning, don't just guess.
