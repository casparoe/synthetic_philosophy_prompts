prompt: |-
  I'm a backend engineer, not a philosophy person, but I got nerd-sniped into reading about Gricean pragmatics after an argument at work over whether our support chatbot actually "gets" sarcasm or just fakes it. A friend who runs a tiny language/mind podcast talked me into writing questions for her next guest, who defends a pretty orthodox Gricean account of speaker meaning -- cooperative principle, the four maxims, the whole nested-intentions (meaning-NN) definition. Give me 8 or 9 interview questions that don't just have him re-explain the maxims: I want one on the circularity/regress worry Schiffer raised about cashing out meaning via infinitely iterated mutual beliefs, one on how he'd seperate conventional implicature from presupposition (the "but" vs "and" example always comes up), and one on whether the neo-Gricean take on scalar implicature (the Horn/Levinson stuff) survives the Relevance Theory objection that the maxims should just collapse into a single relevance principle. For each, toss in a quick follow-up keyed to whatever answer he's most likely to give.
