  hey, random question from my comps prep – I think I've finally got the difference between epistemic contextualism and pragmatic encroachment (SSI) straight: contextualism makes "knows" context-sensitive to the speaker's situation, and SSI is basically the same move just relocated onto the subject instead, so the word ends up tracking the subjects stakes rather than the attributor's. That's really the whole distinction, right? My advisor wrote "not quite!" in the margin of my draft and didn't elaborate, which is not helping me sleep at night lol. Am I at least close, or is there something more fundamental about how the two views actually work that I'm missing?
