answer: |-
  You've stumbled upon a fundamental and deeply unsettling truth in social choice theory: **no voting system that aggregates individual preferences into a collective decision can be perfectly immune to strategic voting (tactical or insincere voting) while simultaneously satisfying other basic fairness criteria, whenever there are three or more options and more than one voter.**

  What you experienced with the instant-runoff voting (IRV) app is **not just a quirk of IRV; it's an unavoidable mathematical consequence.** This is one of the most profound results in the field.

  Here's the breakdown:

  1.  **The Problem You Experienced:** You encountered a specific type of strategic vulnerability called **"Compromising"** (or "Burying" in some contexts). Voting sincerely (ranking Sushi 1st) led to Pizza winning (your 2nd choice). Voting *insincerely* (ranking Pizza 1st, even though it wasn't your favorite) would have led to Sushi winning (your *actual* favorite). Your sincere vote inadvertently helped elect a candidate (Pizza) that blocked your favorite (Sushi) from winning.

  2.  **The Guarantee IRV *Does* Provide (and Why it Failed Here):** IRV's primary advertised benefit is eliminating the "spoiler effect" inherent in plurality voting (first-past-the-post). It guarantees that if a candidate would win an absolute majority (>50%) in a head-to-head matchup against every other candidate (a "Condorcet winner"), that candidate *cannot* be eliminated in an early round. However, **IRV does *not* guarantee that the Condorcet winner will actually *win*.** It can elect a candidate preferred by a broader coalition over the head-to-head favorite. Worse, **it provides *no* guarantee against the compromising scenario you experienced.** Your favorite (Sushi) might have been the Condorcet winner, beaten only by Pizza in the final round due to how votes were distributed when Burgers were eliminated.

  3.  **The Fundamental Theorems: Why It's Unavoidable:**
      *   **Gibbard-Satterthwaite Theorem (1970s):** This is the most direct answer to your question. It rigorously proves that **any voting system that:**
          *   Has at least three possible outcomes.
          *   Allows voters to have any possible preference ordering.
          *   Is non-dictatorial (no single voter always decides the winner).
          *   Is deterministic (produces a single winner).
          **must be manipulable.** That is, there will always be *some* situations where at least one voter can achieve a *better* outcome by voting insincerely (misrepresenting their true preferences) than by voting sincerely.
      *   **Arrow's Impossibility Theorem (1951):** While focused on social welfare functions (ranking all options), it's foundational. It proves that **no ranked voting system can simultaneously satisfy:** Unrestricted Domain (any voter preferences allowed), Non-dictatorship, Pareto Efficiency (if everyone prefers A over B, B shouldn't win), and Independence of Irrelevant Alternatives (IIA - the relative ranking of A vs B shouldn't depend on whether C is present or not). IRV (and most systems) violate IIA, which is directly linked to strategic vulnerabilities like the one you saw. Your vote between Sushi and Pizza *shouldn't* depend on the presence of Burgers, but in reality (and under IRV), it did.

  4.  **Is IRV Particularly Bad? Could a "Cleverer" Method Fix It?**
      *   **IRV is Vulnerable:** IRV is known to be susceptible to the "compromising" strategy you identified, as well as the "burying" strategy (ranking a strong rival last to help your favorite).
      *   **No Perfect System Exists:** Gibbard-Satterthwaite tells us **no** deterministic, non-dictatorial system for 3+ options is immune. Every system has its flaws:
          *   **Condorcet Methods:** Aim to elect the candidate who beats all others head-to-head. But they can suffer from cycles (A>B, B>C, C>A - the "Condorcet Paradox") and complex tie-breaking. They are also manipulable.
          *   **Approval Voting:** Vote for as many as you "approve" of. Winner has most approvals. Simpler, avoids some IRV pitfalls, but encourages "bullet voting" (approving only your top choice) or over-approving strategically. Also manipulable.
          *   **Score Voting / Range Voting:** Rate candidates on a scale (e.g., 0-5). Sum scores, highest wins. Less susceptible to some spoiler effects than plurality, but highly manipulable (e.g., min-maxing: rating your favorite 5, all others 0, regardless of true feeling).
      *   **Trade-offs:** Different systems prioritize different fairness criteria and are vulnerable to different *types* of strategic voting. IRV prioritizes majority support and eliminating spoilers at the cost of potential Condorcet failures and compromising/burying vulnerabilities. No system optimizes everything.

  5.  **Is This Settled Science?**
      *   **Absolutely Yes.** The core mathematical results (Arrow, Gibbard-Satterthwaite) are among the most celebrated and well-established theorems in economics and political science. They are not contested; they are foundational truths. The field understands that perfect voting systems (immune to strategy, fair in all ways) are mathematically impossible for 3+ candidates.
      *   **Ongoing Work:** While the *impossibility* is settled, research is very active in:
          *   **Quantifying Vulnerability:** How *likely* is strategic voting to be successful or necessary in different systems under realistic assumptions? (IRV's compromising vulnerability, while possible, might be less frequent in large public elections than in small groups like yours).
          *   **Designing "Resistant" Systems:** Creating systems where successful manipulation is computationally hard for voters to figure out, or where the incentives/opportunities are minimized.
          *   **Comparing Practical Performance:** Analyzing real-world elections and simulations to see which systems perform best *on average* or under specific conditions, minimizing the negative impacts of their inherent flaws.

  **Conclusion:**

  Your dinner experience wasn't a fluke or an app bug. It was a direct encounter with the Gibbard-Satterthwaite theorem in action. **Strategic voting is mathematically unavoidable in any non-dictatorial voting system with three or more options.** IRV specifically avoids the spoiler effect of plurality voting but introduces other vulnerabilities, like the "compromising" scenario you experienced.

  You didn't fundamentally "get it wrong" in your explainers. RCV (IRV) *is* often a significant improvement over plurality voting because it *reduces* the need for strategic voting in common scenarios (like fearing a vote for a minor candidate is wasted) and ensures majority support. However, your experience highlights a crucial nuance: **it is not a panacea.** It cannot eliminate strategic voting entirely. No system can. This deep limitation is a settled cornerstone of social choice theory. The goal becomes choosing a system whose specific vulnerabilities are less damaging or less likely to occur in a given context than the vulnerabilities of alternative systems.
