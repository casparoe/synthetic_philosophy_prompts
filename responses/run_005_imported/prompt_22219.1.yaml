  Superdeterminism is indeed a loophole in Bell's theorem. It assumes that the experimenters' choices are correlated with the hidden variables in such a way that the Bell inequalities are violated even in a local deterministic theory. This is a valid theoretical possibility. However, it is controversial because it requires that the entire experimental setup (including the experimenters' choices) is predetermined in a way that might undermine the scientific method (as it questions the freedom to choose measurements). Therefore, Marcus is correct that Bell's theorem does not force nonlocality if one accepts superdeterminism. But note: superdeterminism is not the only alternative. There are other options (like giving up realism, as in orthodox quantum mechanics) that are not local in the sense of local hidden variables but do not require superdeterminism either.

