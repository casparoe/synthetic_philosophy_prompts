prompt: |-
  Compare Kripke's fixed-point theory of truth (built on the Strong Kleene valuation scheme) with the Gupta–Belnap revision theory of truth, both of which aim to handle the Liar sentence without appealing to a Tarskian hierarchy of languages. Focus in particular on how each theory treats the Truth-teller sentence ("This sentence is true"): like the Liar, it receives no truth value in Kripke's minimal fixed point, yet it seems intuitively far less pathological than the Liar. Does either theory succeed in capturing this intuitive difference between the Truth-teller and the Liar, and does either genuinely escape a "revenge" Liar formulated with a predicate such as "is not true" rather than "is false"? Justify your answer by reference to the internal mechanics of each theory—e.g., groundedness versus paradoxicality for Kripke, and stability versus categorical truth across revision sequences for Gupta–Belnap.
