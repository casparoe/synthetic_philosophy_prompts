answer: |-
  Here’s the strongest version of the circularity objection to Joyce-style accuracy-dominance arguments for probabilism, structured to maximize the critique:

  ### Core Objection: **The Scoring Rule Selection Smuggles in Probabilism**
  The argument hinges on defining "legitimate" inaccuracy measures as **strictly proper scoring rules** (e.g., Brier score, logarithmic score). But strict propriety is *defined* by the very property that Joyce’s proof requires to make probabilism win:  
  - **Strict Propriety**: A scoring rule \(S\) is strictly proper if, *for any coherent credence function \(P\)*, \(P\) uniquely minimizes *expected* inaccuracy *according to itself*.  
  This means:  
  > *"Coherent credences are the optimal self-recommending strategies under \(S\)."*  

  **The circularity is inescapable**:  
  1. **Strict Propriety presupposes coherence is optimal**  
     To even *define* strict propriety, you must assume that coherent credences are the rational default. The scoring rule is *designed* so that coherent credences "win" by their own lights. This isn’t a neutral starting point—it builds probabilism into the definition of "accuracy."  

  2. **The dominance result *depends* on this embedded bias**  
     Joyce’s theorem shows:  
     > *If \(S\) is strictly proper → incoherent credences are accuracy-dominated.*  
     But the *only* scoring rules that produce this result are those rigged to favor coherence from the outset. Without strict propriety, the dominance vanishes:  
     - Example: The **absolute value score** \(S(c, \omega) = |c - \mathbb{1}_\omega|\) isn’t strictly proper.  
       - Incoherent credences often *aren’t dominated* under this rule.  
       - Yet one could argue it genuinely measures "closeness to truth" (e.g., L1 distance).  
     *Why is this not a "legitimate" measure?* The accuracy-first program offers no non-circular answer.  

  3. **Justifying strict propriety *without* assuming coherence is impossible**  
     - *Claim*: "Strictly proper rules are the only ones that respect the *gradational* nature of accuracy."  
       - **Rebuttal**: This assumes credences *ought* to be scored by how well they *anticipate* their own expected score—a distinctly Bayesian, coherence-dependent goal.  
     - *Claim*: "Proper rules prevent manipulation via self-scoring."  
       - **Rebuttal**: Avoiding manipulation is a *pragmatic* concern—precisely what accuracy-first aims to avoid!  

  ### Why This is *Specifically* Question-Begging
  - **The argument’s conclusion is presupposed in its key premise**:  
    Joyce requires strict propriety to derive dominance → but strict propriety is defined by the optimality of coherent credences → which *is* probabilism.  
    This reduces to: *"If you assume coherent credences are optimal, then incoherent credences are suboptimal."*  

  - **Accuracy-first’s promise is broken**:  
    It claims to ground epistemic norms *purely* in alethic value (truth-closeness), without pragmatic elements (e.g., Dutch Books). But if "truth-closeness" is *defined* by a scoring rule that covertly enforces coherence, the "purely alethic" claim collapses. The scoring rule becomes a **Trojan horse for probabilism**.  

  ### Counterarguments Dismantled
  1. *"Strict propriety is intuitive!"*  
     - **Objection**: Intuition here is likely contaminated by prior acceptance of probabilism. To someone rejecting coherence (e.g., a Dempster-Shafer theorist), a non-proper rule may seem equally "intuitive."  

  2. *"All scoring rules that satisfy basic axioms are strictly proper!"*  
     - **Objection**: Common "basic axioms" (e.g., **truth-directedness**, **convexity**) are not neutral:  
       - **Truth-directedness** (more accurate when credence moves toward truth-value) seems safe.  
       - But **convexity** (penalizing "miscalibration" disproportionally) *presupposes* that credences *should* be linear. Why not allow cliff-like penalties at 0/1?  

  3. *"We can derive propriety from accuracy alone!"* (e.g., Predd et al., 2009)  
     - **Objection**: These derivations assume *separability* (total inaccuracy = sum of individual inaccuracies), which is not a pure "accuracy" constraint. It’s a structural assumption that favors additivity—core to probability.  

  ### Conclusion: The Unavoidable Circularity
  Joyce’s argument doesn’t *establish* that coherence promotes accuracy; it **presupposes** that coherence is the benchmark for accuracy. By defining "legitimate" scoring rules as those that make coherence *win*, the argument guarantees its conclusion. This isn’t a non-pragmatic vindication—it’s a **conceptual shell game** where probabilism is assumed in the definition of the very epistemic good (accuracy) meant to justify it.  

  **The strongest case**: If you reject probabilism, you have no reason to accept strict propriety as a necessary condition for "accuracy." Thus, the dominance argument only persuades those who already believe in coherence—making it epistemically circular.  

  ---

  *For further reading supporting this critique*:  
  - Aaron Bronfman’s (2014) objections to separable scoring rules.  
  - Hájek’s (2008) "Arguments for–or against–Probabilism?" on question-begging.  
  - Schoenfield’s (2017) work on the "arbitrariness" of propriety.
