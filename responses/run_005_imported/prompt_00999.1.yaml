answer: |-
  That's a fascinating and understandable line of thought, but there are several key reasons why Gödel's ontological argument isn't generally accepted, even within logic circles, as proof of God *or* as implying an afterlife, and why the LessWrong/rationalist community specifically doesn't treat it as a slam dunk for immortality. Here's what you're likely missing:

  1.  **The Theorem Prover Validated the *Logic*, Not the *Premises* or *Conclusion*:**
      *   You're right that Gödel's formalization (using modal logic) was shown to be *logically consistent* – meaning if you accept his specific axioms and definitions, the conclusion (a God-like being necessarily exists) *follows* deductively. Computer verification (like the 2013 work) confirmed this internal consistency.
      *   **The Crucial Point:** This *does not* mean the argument is "true" or that the conclusion is proven in reality. It only means the argument is *valid* (the conclusion follows from the premises) and *non-contradictory* within its own system. The entire weight rests on the acceptability of Gödel's starting definitions and axioms.

  2.  **Gödel's Axioms and Definitions Are Highly Controversial and Subjective:**
      *   **"Positive" Properties:** Gödel defines a "God-like" being as possessing all "positive" properties. But what makes a property "positive"? Gödel offers some intuitions (e.g., "positive = good, desirable, attributive without negation"), but this is fundamentally subjective and debatable. Is "necessary existence" uncontroversially "positive"? Is "omniscience" always positive? Rationalists are deeply skeptical of such fuzzy, value-laden starting points.
      *   **Existence as a Predicate/Property:** Gödel treats "necessary existence" as a property that can be attributed to an essence. Philosophers since Kant have heavily criticized the idea that "existence" is a predicate like "red" or "tall." Saying something "exists" doesn't add a descriptive property *to* the thing itself in the same way; it asserts its instantiation in reality. Treating "existence" as just another property in the essence is a major point of contention.
      *   **Modal Logic Assumptions:** The argument relies heavily on specific interpretations of possibility and necessity (S5 modal logic), which aren't universally accepted as the *only* or *correct* way to model metaphysical possibility.

  3.  **The Gap Between "Necessarily Existing God" and "Afterlife" is Enormous:**
      *   Gödel's argument, at its absolute strongest *if accepted*, only concludes that a being with maximal positive properties (including necessary existence) exists. **It says absolutely nothing about:**
          *   **Human Souls:** Does this God create immortal souls?
          *   **Personal Survival:** Does individual consciousness persist after death?
          *   **The Nature of the Afterlife:** What form would it take? Reward/punishment? Merging with God? Something else?
      *   Gödel's personal belief in an afterlife stemmed from *entirely separate philosophical commitments*, primarily his strong Platonism (belief in an objective realm of abstract concepts and truths) and a Leibnizian view of the soul. He likely believed a benevolent, necessary God *would* ensure an afterlife, but **this is a separate philosophical inference or article of faith, *not* a logical corollary derived *from* the ontological argument itself.** His letters to his mother reflect his broader philosophical and spiritual worldview, not a deduction solely from that specific proof.

  4.  **Why the Rationalist/LessWrong Sphere Ignores it as an Afterlife Argument:**
      *   **Rejection of Premises:** They fundamentally reject the subjective definitions ("positive properties") and the treatment of existence as a predicate. The argument is seen as clever wordplay built on shaky foundations, not a genuine proof about reality.
      *   **Demand for Evidence:** Rationalism heavily emphasizes empirical evidence and Bayesian reasoning. An abstract logical argument, especially one based on contested definitions, carries very little weight compared to observable evidence about consciousness, brain function, and the lack of any reproducible evidence for survival after death. They see the brain as the clear seat of consciousness; destroy it, and consciousness ends.
      *   **Scope of the Argument:** They correctly recognize that the ontological argument, even if accepted, only gets you to a necessary maximal being. *Everything else* about God's nature, intentions, or actions towards humans (including granting an afterlife) requires *additional*, unsupported assumptions or revelation.
      *   **Focus on Instrumental Rationality:** LessWrong often focuses on reasoning that helps achieve real-world goals. An unprovable, abstract argument about the afterlife, derived from an already contested proof of God, doesn't offer practical guidance or falsifiable predictions.
      *   **Gödel's Other Reputation:** While respected for his incompleteness theorems, Gödel's later philosophical and cosmological work (including this argument and his strange solution to Einstein's field equations) is often viewed as eccentric and detached from scientific rigor within these circles.

  **In Summary:**

  *   **Gödel's Argument:** Proves *if* you accept his specific, highly subjective definitions and axioms about "positive properties" and necessary existence, *then* a God-like being necessarily exists. Computer verification confirms the logical consistency of this *if-then* structure.
  *   **Afterlife Connection:** **Is not a corollary.** Gödel's belief in an afterlife came from his broader Platonist philosophy and personal faith, *not* as a deductive consequence of the ontological argument. The argument itself is silent on souls, consciousness survival, or any form of afterlife.
  *   **Rationalist Skepticism:** LessWrong/rationalists dismiss the argument because its premises are seen as arbitrary and non-empirical ("positive properties"), it commits the error (in their view) of treating existence as a predicate, and it provides zero evidence for the specific claim of an afterlife, which contradicts the neuroscientific understanding of consciousness. It's seen as an intriguing formal exercise, not a proof of anything about reality.

  You're right that *if* one fully accepts Gödel's ontological argument as sound *and* *also* accepts additional philosophical/theological premises about God's benevolence and the nature of the soul, *then* an afterlife becomes plausible within that belief system. But that's a much larger and less logically airtight structure than Gödel's formal proof itself. The rationalist objection is primarily to the foundational premises of the ontological argument and the complete lack of empirical support for the afterlife claim.
