answer: |-
  Here’s the steelmanned argument for bounded utility as the *only* solution to contagion, with a direct takedown of the "arbitrary cap" objection:

  ### The Core Argument: Unbounded Utilities Invite Catastrophic Contagion

  1.  **The Pasadena Pathology is Inescapable:** The Pasadena game exploits the core structure of unbounded utilities combined with infinite possibilities. Its payoff function `f(n) = (-1)^{n+1} * 2^n / n` grows without bound in both positive and negative directions (`|f(n)| → ∞`) while its absolute values diverge (`Σ |f(n)| = ∞`), creating conditional convergence.
  2.  **Contagion is Fatal (Not Merely Annoying):** As Resnik (1987) and subsequent work shows, if an agent assigns *any* non-zero probability `ε > 0` (no matter how small!) to facing a Pasadena-like gamble `P`, then for *any* two ordinary, finite-utility gambles `A` and `B`:
      *   The complex gamble `[ε, P; (1-ε), A]` has **undefined expected utility**.
      *   So does `[ε, P; (1-ε), B]`.
      *   **Therefore, `A` and `B` cannot be compared via standard expected utility maximization.** The undefinedness infects *every* pairwise choice involving *any* gamble mixed with `P`.
  3.  **Cordon Sanitaire Fails:** Attempts to "quarantine" Pasadena-like gambles by assigning them probability zero are:
      *   **Epistemologically Bankrupt:** Rational agents *should* assign non-zero credence to complex, non-finite gambles existing in a vast universe (or even just complex financial instruments). Demanding `Pr(P) = 0` is an ad hoc fix denying plausible open-mindedness.
      *   **Dynamically Incoherent:** Upon being *presented* with a plausible Pasadena-like option, a rational agent should update `Pr(P) > 0`, immediately triggering contagion. The cordon is fragile.
      *   **Merely Hides the Problem:** It doesn't solve the mathematical pathology; it just pretends scenarios enabling it don't exist. A robust decision theory shouldn't collapse upon encountering plausible uncertainties.
  4.  **Bounded Utility is the Structural Solution:** Imposing bounded utility (`∃ M ∀ o: |U(o)| ≤ M`) is **not a mere patch**; it surgically removes the *root cause* of the pathology:
      *   **Prevents Conditional Convergence:** If `|U(o)| ≤ M` and `|Payoff(o)|` can grow, then `|U(o) * Payoff(o)| ≤ M * |Payoff(o)|`. For any gamble with finite expected *monetary* value (like St. Petersburg), `Σ Pr(o) * |U(o) * Payoff(o)| ≤ M * Σ Pr(o) * |Payoff(o)| < ∞`. Absolute convergence is guaranteed. No rearrangement effects.
      *   **Prevents Contagion:** If all utilities are bounded by `M`, then for *any* gamble `G` mixed with *any* other gamble `P`, `|Pr(o) * U(o)| ≤ Pr(o) * M`. The total EU is always absolutely convergent (as `Σ Pr(o) * M = M < ∞`). Undefined EU becomes impossible. Comparisons between finite gambles remain robust even if strange non-finite gambles are considered.
      *   **Addresses the Core Flaw:** The pathology arises fundamentally from the *combination* of unbounded utility and the potential for unbounded payoffs with divergent absolute expectation. Bounded utility breaks this combination at its source. It's the *only* known solution that achieves this without ad hoc restrictions on probability assignments or payoff structures.

  ### Obliterating the "Arbitrary Cap" Objection

  The objection: *"Bounded utility artificially caps how good or bad an outcome can be. Isn't it absurd to say saving infinite lives isn't infinitely valuable?"*

  **Reply 1: Utility is a Measure of Choice-Worthiness, Not Intrinsic "Value":**
      *   Expected Utility Theory is a *tool for modeling rational preference under uncertainty*. Its primary goal is to provide coherent, consistent criteria for choosing between gambles.
      *   **Boundedness is a Necessary Axiom for Coherence:** Just as the Archimedean Axiom prevents lexicographic preferences and ensures comparability, boundedness prevents EU from becoming undefined under plausible uncertainty. It ensures the tool *functions*.
      *   **The "Cap" Reflects Instrumental Rationality:** Saying `U(Save ∞ Lives) = M` doesn't mean saving infinite lives is only "M-good." It means that within the *framework of coherent choice under uncertainty involving potentially unbounded payoffs*, the *instrumental weight* this outcome has in determining rational preferences cannot exceed `M`. This is necessary to avoid decision-theoretic incoherence (contagion). To reject this is to reject coherent decision theory itself in these contexts.

  **Reply 2: The "Infinite Value" Intuition is Mismodeled:**
      *   **Demanding Infinite Utility Creates Nonsense:** Assigning `U(Save ∞ Lives) = ∞` isn't a solution; it destroys the theory. Any gamble with a positive probability of this outcome has `EU = ∞`, making it incomparable to any finite gamble (violating continuity and often dominance). This is just as paralyzing as undefined EU.
      *   **Boundedness Captures Diminishing Marginal Choice Impact:** Imagine two outcomes: `A` = Save 1 billion lives, `B` = Save 1 billion and 1 lives. The difference in `U(A)` and `U(B)` should be finite and reflect the marginal value of one more life. Now compare `C` = Save `N` billion lives. As `N → ∞`, the *marginal impact on choice* between saving `N` and `N+1` billion lives diminishes relative to the overwhelming value of saving `N` billion. Bounded utility naturally models this compression of marginal choice-worthiness at extremes. The "cap" `M` represents the point where further increases have negligible impact *on comparisons between gambles*.
      *   **Focus on Comparability:** The key question isn't "Is outcome O infinitely valuable in some metaphysical sense?" but "Can we *consistently compare* gambles involving O to other gambles?" Bounded utility ensures we can. Unbounded utility often prevents this.

  **Reply 3: The Alternative is Worse:**
      *   The choice isn't between bounded utility and a perfect representation of "infinite value." The choice is between:
          1.  **Bounded Utility:** A coherent, universally applicable decision theory where all EUs are defined, comparisons are always possible, and contagion is impossible. Outcomes have large but finite choice weights.
          2.  **Unbounded Utility:** A decision theory vulnerable to catastrophic failure (undefined EU, pervasive contagion) upon encountering plausible uncertainties involving complex, non-finite gambles. Outcomes can be labeled "infinitely valuable" but this label paralyzes rational choice.
      *   **Robustness Trumps Naive Expressiveness:** A theory that works flawlessly under all conceivable uncertainties, even if it compresses the representation of extreme value, is superior to a theory that promises to express "infinite value" but collapses into incoherence when faced with realistic open-ended possibilities. Bounded utility is the price of a *functional* and *universal* decision theory.

  ### Conclusion

  The Pasadena game isn't a quirky outlier; it's a canary in the coal mine, exposing a fatal flaw in decision theories allowing unbounded utility. Contagion proves this flaw isn't containable; any non-zero credence in such pathologies infects the entire decision framework. Assigning zero probability is epistemologically untenable and dynamically fragile. The *only* way to build a decision theory immune to this contagion, capable of handling *any* conceivable gamble under uncertainty without collapse, is to impose bounded utility. This bound isn't an arbitrary cap on value; it's a necessary structural feature ensuring the coherence and functionality of rational choice itself. Rejecting it isn't embracing higher values; it's embracing decision-theoretic incoherence. Arrow's boundedness condition isn't an ad hoc fix; it's the essential foundation for a robust theory of rational choice under uncertainty.
