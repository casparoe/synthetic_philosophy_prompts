answer: |-
  You've pinpointed the core conceptual tension in evolutionary biology that Gould and Lewontin's "spandrel" metaphor exposed, and why Gould and Vrba later introduced "exaptation." The blurring occurred because "spandrel" was being used ambiguously for two fundamentally different evolutionary scenarios that *both* involve a trait having a current function different from its original cause. The critical distinction is between **origin** and **current utility**, and why **present function alone cannot reveal evolutionary history**.

  Here's the precise reconstruction of the blurred concepts and the crucial distinction:

  **The Blurred Concepts in the Original "Spandrel" Usage:**

  1.  **"Byproduct Spandrel" (Non-Adaptive Origin):** A trait that arises purely as a non-adaptive, architecturally *necessary consequence* of other selected traits (like the triangular space under a dome). It has *no* function at its origin. *Later*, it might be co-opted for a new function (e.g., decorated surface). **Origin: Non-adaptive constraint/byproduct. Current Utility: Later adaptation (exaptation).**
  2.  **"Co-opted Adaptation Spandrel" (Adaptive Origin, New Function):** A trait that *was* originally built by selection for a specific function (Adaptation A), but *later* is co-opted to serve a completely *different* function (Function B). The trait had an adaptive origin, but its *current* primary function is different. **Origin: Adaptation (for A). Current Utility: Later adaptation (exaptation for B).**

  **The Problem:** Calling *both* scenarios "spandrels" blurred the fundamental question of **whether the trait originated *as an adaptation at all*.** This was crucial for understanding evolutionary pathways and challenging "just-so" stories.

  **Gould and Vrba's Solution (1982): Exaptation**

  They introduced "exaptation" to clarify the *current utility* aspect, decoupling it entirely from the question of *origin*:

  1.  **Adaptation:** A trait built by natural selection *for* its current function. (**Origin = Current Utility**)
  2.  **Exaptation:** A trait currently useful (co-opted) for a function *other* than the one it was originally built for by natural selection. (**Current Utility ≠ Original Cause**)
      *   **Exaptation can arise from TWO distinct origins:**
          *   **(a) From a Non-Adaptation (a true "Spandrel"):** A trait that originated as a non-adaptive byproduct or constraint (e.g., San Marco's pendentive space). *Later* co-opted for a new function (e.g., decoration). `[Origin: Non-Adaptive -> Current Utility: Exaptation]`
          *   **(b) From a Prior Adaptation:** A trait that originated as an adaptation for one function (Adaptation A). *Later* co-opted for a *new* function (Function B), which may even replace the original function. `[Origin: Adaptation (for A) -> Current Utility: Exaptation (for B)]`

  **The Crucial Distinction: Why Origin Matters & Why Fittingness Isn't Proof**

  1.  **Present Fittingness ≠ Evolutionary Cause:** A trait can be exquisitely well-fitted to its *current* function purely because it was *co-opted* (exapted) for that function *after* it already existed. Natural selection can *refine* an exaptation for its new role ("secondary adaptation"), making it appear "designed" for that purpose *now*. **However, this perfect fit tells you *nothing* about whether the trait *originated* because of selection for that current function.** Its origin could be:
      *   A non-adaptive byproduct/spandrel (Origin A).
      *   An adaptation for a *different* prior function (Origin B).
      *   An adaptation *for* the current function (true Adaptation).
  2.  **The Burden of Proof for Adaptation:** To claim a trait is an *adaptation* (built by selection *for* its current function), you must provide evidence *beyond* its current utility. This evidence can include:
      *   **Comparative Evidence:** The trait correlates with specific selective pressures across related species.
      *   **Optimality/Engineering Analysis:** Does the trait's form *specifically* solve the proposed adaptive problem efficiently?
      *   **Paleontological/Fossil Evidence:** Does the trait's appearance in the fossil record coincide with evidence for the relevant selective pressure?
      *   **Genetic/Developmental Evidence:** Are there complex, specific genetic mechanisms underlying the trait that are unlikely to arise neutrally?
      *   **Exclusion of Alternatives:** Can plausible non-adaptive origins (like developmental constraints, physical necessity, or exaptation from another function) be reasonably ruled out?
  3.  **Why San Marco Stays Contested (Exactly This Point):** The debate hinges entirely on the **origin** of the pendentive's *decorative surface potential*.
      *   **"True Spandrel/Exaptation" View:** The triangular space *arose unavoidably* as a structural necessity to support the dome on square piers. Its existence was *not* driven by a desire for a decorative surface; that was a secondary, unplanned consequence. Decoration was an *exaptation* of a non-adaptive byproduct. (`Origin: Non-Adaptive Constraint -> Current Utility: Exaptation (Decoration)`).
      *   **"Adaptation/Design Choice" View:** The builders, aware of multiple architectural solutions (e.g., squinches vs. pendentives), *chose* the pendentive solution *partly or wholly because* it created these large, well-placed, curved surfaces *ideal for decoration*. The decorative potential was a *primary factor* in the selection of this structural solution. The surface's existence *was* driven by selection for its decorative utility from the outset. (`Origin: Adaptation (for Decorative Surface) -> Current Utility: Adaptation (Decoration)`).
      *   **The Blur & The Problem:** Looking *only* at the *current* state – a beautifully decorated pendentive surface – you cannot distinguish between these two historical pathways. Both explain the *present fittingness* of the surface for decoration. The debate requires historical evidence about the *builders' intent and knowledge of alternatives* – the architectural equivalent of the comparative, fossil, and genetic evidence needed in biology.

  **In Summary:**

  *   **Spandrel (strict sense):** A trait whose *origin* is a non-adaptive byproduct/constraint.
  *   **Exaptation:** A trait whose *current utility* is different from its original cause (whether that cause was adaptive or non-adaptive).
  *   **Key Distinction:** **Origin vs. Current Utility.** Did the trait originate *as an adaptation* (for *any* function), or not? Present utility alone cannot answer this.
  *   **Why Fittingness Isn't Proof:** Exaptations (from either origin) can be refined by selection to be perfectly fitted to their *current* function, mimicking true adaptations. Evidence *beyond* current utility is required to demonstrate that selection built the trait *for* that function.
  *   **Why San Marco is Contested:** It's a perfect illustration of this epistemological problem. The *current* decorative utility is evident. But was this utility the *cause* of the structure's existence (Adaptation), or merely a *later use* of a structure that existed for other reasons (Exaptation from a Spandrel)? The historical evidence (architectural intent) is ambiguous, mirroring the challenge of reconstructing evolutionary history from present-day biology.
