  Starting with point 1: Marcus says you can't call a single 70% forecast wrong just because it didn't rain. That's correct. Probability forecasts aren't about one event but long-run frequencies. So Marcus is right here. Score +2.

  Point 2: Dana asks which group of afternoons the forecast refers to. Different groups could lead to different interpretations, and forecasters might cherry-pick. That's a valid concern about reference classes. Dana has a point, so +1.

