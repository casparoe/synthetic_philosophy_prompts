  First, I need to address the core question: can expectations change perception? From what I remember, cognitive psychology has concepts like top-down processing where prior knowledge influences perception. Studies like the hollow mask illusion or McGurk effect show that expectations can alter what we see or hear. There's also research on how radiologists' diagnoses can be affected by clinical history. So yes, it's possible that the radiologist's visual experience is being modified, not just her attention or conclusions.

  Next, the radiologist's concern about her trained eye as an independent check. She's worried that her objectivity is compromised. I should explain the mechanisms behind this. Attention plays a big role—knowing where to look might enhance the salience of certain areas. Perceptual sets could prime her to interpret ambiguous shadows as abnormal. There's also neural feedback loops where higher-order brain areas modulate sensory processing. All these factors mean that her perception isn't purely data-driven; it's influenced by expectations.

