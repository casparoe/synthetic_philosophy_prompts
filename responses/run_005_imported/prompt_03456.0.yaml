  That's a razor-sharp connection you've made – the "legal but harmful" debate is *exactly* where Hart and Devlin would clash today. Let's break down their likely arguments, avoiding caricatures and sticking to their core philosophical frameworks:

  **Lord Devlin (Pro-Online Safety Act "Legal but Harmful" Provision - in principle):**

  1.  **The "Glue" Argument Applied Digitally:** Devlin would argue the internet isn't some separate realm; it *is* society now. Widespread, easily accessible content deemed "harmful" (e.g., extreme misogyny, promotion of self-harm, certain forms of hate speech falling below criminal thresholds, pervasive trolling designed to inflict distress) *does* erode the shared moral fabric essential for social cohesion. It normalizes cruelty, undermines mutual respect, and fragments communal bonds. The sheer scale and reach of online content amplify the threat beyond what he imagined in the 1950s.
  2.  **The "Disgust" Test & Its Online Challenge:** Devlin *would* face the core problem you identified: the "vibes" of disgust are fragmented online. His "reasonable man" (the Clapham omnibus rider) is splintered into countless algorithmic bubbles. He might counter by arguing that when certain content sparks *widespread and intense* public outrage, media focus, and political pressure (e.g., campaigns against specific types of cyberbullying, non-consensual intimate imagery, or promotion of eating disorders), that *is* the modern manifestation of society's collective "intolerance, indignation, and disgust." The platform's role becomes akin to the state's in his view – acting as agents to suppress this socially corrosive material *before* it causes significant disintegration. He'd likely argue platforms *are* the new "public square" requiring moral guardianship.
  3.  **"Toleration as Treason" Analogy Updated:** Devlin might argue that allowing platforms to *actively facilitate* (through algorithms and design) the mass dissemination of content that profoundly violates core societal values *is* a form of societal betrayal. It's not just passive tolerance; it's enabling the corrosion. The state mandating platforms to act is therefore a legitimate defense of the social order.
  4.  **Focus on "Harmful" as Social Harm, Not Just Offense:** Devlin would insist the category shouldn't be about mere offense (which he might dismiss as trivial) but about content that genuinely threatens the underlying moral consensus necessary for social stability – content that makes peaceful coexistence harder. He'd likely point to phenomena like radicalization pipelines or the normalization of extreme ideologies as evidence of this *type* of disintegration happening online.

  **H.L.A. Hart (Critic of "Legal but Harmful" Provision):**

  1.  **The Empirical Challenge Intensified:** Hart would hammer this point harder than ever. "Show me the causal link!" Decades of profound moral shifts (sexual liberation, LGBTQ+ rights, changing family structures, religious decline) haven't caused societal collapse. Why should *this* specific category of online speech? He'd demand concrete evidence that suppressing "legal but harmful" content *prevents* tangible societal disintegration (not just discomfort or offense), which would be incredibly difficult to isolate and prove. He'd argue correlation (polarization exists alongside toxic content) isn't causation.
  2.  **The Slippery Slope & Tyranny of the Majority:** Hart would see "legal but harmful" as the quintessential slippery slope Devlin's approach enables. Who defines "harmful"? Based on *whose* disgust? In a pluralistic society, one group's "moral necessity" is another's legitimate expression or exploration. Legislating based on "disgust" in the fragmented online world is even more prone to capture by vocal minorities, moral panics, or government overreach suppressing dissent or unpopular views. The UK critics' "legislating against being offended" argument would resonate deeply with Hart. He'd see it as state-enforced moral conformity, stifling necessary moral evolution.
  3.  **The Harm Principle as the Only Legitimate Standard:** Hart, building on Mill, would argue the *only* justification for legal (or state-mandated platform) suppression is the prevention of **direct, tangible harm to others** (incitement to violence, credible threats, fraud, defamation, child exploitation). Vague notions of "corrosive to society" or "harmful" based on moral disgust fall far outside this principle. The Online Safety Act's "legal but harmful" category would strike him as inherently paternalistic and illiberal.
  4.  **Moral Pluralism & the Online Reality:** The internet's global, diverse nature makes Hart's argument even stronger. There *is no single, monolithic moral consensus* online. Attempting to enforce one based on a particular national (or vocal segment's) sense of disgust is both impractical and fundamentally oppressive to minority viewpoints within that society. Hart would argue the online sphere *requires* greater tolerance of moral difference precisely because it *is* so diffuse.
  5.  **Focus on Precision & Evidence-Based Law:** Hart would likely support targeted, precisely defined online harms backed by evidence (e.g., laws against specific threats, CSAM). He would vehemently oppose the broad, vague, morality-based category of "legal but harmful" as a dangerous abdication of liberal legal principle.

  **The Sticking Points in Your Questions:**

  *   **Does Devlin's Disgust-Test Work Online?** Arguably **no, it fails spectacularly.** Online disgust is amplified, fragmented, manipulated, and often unrepresentative. Algorithmic curation means "widespread" disgust might just be an echo chamber yelling loudly. Devlin's model assumed a relatively homogenous society with shared media; that's gone. He'd struggle to define a coherent "societal" disgust metric online.
  *   **Does Hart's "No Evidence of Disintegration" Hold Up?** **Yes, and arguably it's stronger.** The continued resilience of societies through massive moral transformations *is* evidence that Devlin overestimated the fragility of the social glue and underestimated society's capacity to adapt morally. While online toxicity poses real challenges (polarization, mental health impacts), directly linking specific "legal but harmful" content *categories* to societal *collapse* remains speculative. Harm (e.g., radicalization leading to violence) is better addressed through Hart's narrow harm principle than Devlin's broad moral enforcement.

  **Conclusion:** In the Online Safety Act saga, Devlin would likely see the *intent* behind "legal but harmful" as philosophically sound (defending social glue against corrosive forces) but would be flummoxed by the practical impossibility of applying his "disgust" test coherently online. Hart would see the provision as the *perfect* example of the dangers he warned about – vague moral legislation based on unproven disintegration fears, opening the door to censorship and suppressing legitimate moral diversity, all while failing to meet the strict standard of preventing direct harm to others. Hart's critique, grounded in moral skepticism and the harm principle, seems far more robust in the complex, pluralistic reality of the digital age.
