  What I can't figure out, and was hoping you could help with, is how he handled the obvious gap in that argument when writing to her — the incompleteness theorems are about formal axiomatic systems, not biological brains, so there's a real disanalogy between "a machine" in Gödel's logical sense and an actual squishy human brain. Did he spell out, in those letters, why a brain should count as "a machine" in the relevant sense, or was he just asserting the analogy and hoping his mom wouldn't push back? I've got enough of a math background to follow the theorems themselves fine, but I'm hazy on the philosophy/biography side of things, and dont want to write a paragraph implying he addressed that gap if he actually just glossed over it — or worse, if I'm misremembering which argument even shows up in those letters at all.
