answer: |-
  Here are 10 interview questions focused on dissecting the structure and implications of Dummett's argument, including your three specific requests, each with a probing follow-up designed to push beyond initial responses:

  1.  **Core Distinction Question:** Dummett argues that a state's right to control borders is conditional, not absolute. One crucial condition seems to be avoiding restrictions rooted in racial hostility disguised as concerns about capacity or cohesion. What *operationalizable criteria* does his framework suggest for distinguishing a genuine, race-neutral capacity constraint (e.g., demonstrable strain on specific, non-substitutable infrastructure) from one that's primarily a mask for racism, especially given policymakers rarely state racist motives explicitly?
      *   **Follow-Up:** You mention [Criteria X, Y, Z]. Critics might argue that even "objective" capacity measures (like housing shortages or hospital wait times) can be *influenced* by prior racist policies (e.g., underinvestment in certain areas) or public perception inflamed by racialized rhetoric. Doesn't this make the "genuine capacity" test practically impossible to isolate cleanly within Dummett's own historical analysis? How can the framework account for this entanglement?

  2.  **Colonial Obligations vs. Humanitarian Need Question:** Dummett grounds stronger admission claims for migrants from former colonies in the specific historical injustices and entanglements of colonialism. How does his framework reconcile this *special obligation* based on history with the arguably more *fundamental humanitarian obligation* to refugees fleeing immediate persecution or disaster, regardless of the host country's colonial past? What does it say about the refugee fleeing a brutal regime in a country the UK never colonized?
      *   **Follow-Up:** If the obligation to the non-colonized refugee is based *solely* on immediate humanitarian need, while the obligation to the migrant from a former colony is *both* humanitarian *and* grounded in historical rectification, does this imply a *hierarchy* of obligations where the latter takes precedence? Doesn't this risk instrumentalizing current suffering for historical accounting, potentially diverting resources from the most acute crises elsewhere?

  3.  **Racism Diagnosis vs. Mundane Objections Question:** A central thrust of Dummett's critique is that restrictionist sentiment in Britain was fundamentally fueled by racism, often cloaked in more "respectable" concerns about wages, public services, and social trust. How does his argument avoid the charge of simply *dismissing* these more mundane objections as *always* being mere covers for racism, rather than engaging with them as potentially legitimate (even if sometimes exaggerated or misused) concerns that need addressing within a just immigration policy?
      *   **Follow-Up:** Let's grant that racism was a powerful driver historically. But if we accept that large-scale migration *can* have real, complex impacts on wages (especially for specific low-skill sectors), strain public services in the short-to-medium term, and challenge social trust in diverse societies – even if managed well – doesn't attributing *all* restrictionist concern *primarily* to racism risk undermining the credibility of the critique by refusing to engage with opponents' strongest *non-racist* arguments? How does the framework incorporate mitigating these impacts *without* resorting to exclusion?

  4.  **The "Conditionality" Test:** Dummett grants states a *conditional* right to control borders. What specific conditions must be met for a state to *legitimately* exercise that right under his view? Is it purely the absence of racist intent/motivation, or are there substantive thresholds related to the state's actual capacity, the fairness of the global system, or the severity of the migrant's need?
      *   **Follow-Up:** How would this conditionality apply concretely? If a state demonstrates a genuine, acute capacity limit (e.g., a small island nation facing climate displacement), but its historical immigration policies were racially exclusionary, does Dummett's framework *still* obligate it to admit migrants beyond that capacity due to its past racism, or does the immediate capacity limit override the historical obligation in that specific moment?

  5.  **Burden of Proof & Evidence:** Dummett is deeply skeptical of "capacity" arguments, seeing them as often pretextual. Within his framework, where does the *burden of proof* lie when a state claims its restrictions are based on genuine capacity limits rather than racism or xenophobia? What kind of evidence should be required to meet that burden?
      *   **Follow-Up:** Given the complexity of measuring "capacity" (is it absolute physical space, economic absorptive capacity, social integration bandwidth?) and the difficulty of proving subjective motivations, isn't placing a high burden of proof on the state effectively a recipe for *de facto* open borders in most cases, regardless of his stated acceptance of a conditional right? Is that a fair implication or a misreading?

  6.  **Cultural Cohesion as a Limit?** Dummett dismisses concerns about cultural cohesion as frequently masking racism. But does his framework allow *any* legitimate role for concerns about preserving specific cultural practices or social norms as a *non-racist* reason for *some* level of immigration control or integration requirements? Or is any appeal to "cohesion" inherently suspect in his view?
      *   **Follow-Up:** If concerns about cultural cohesion are always illegitimate under this framework, how does it respond to the argument that stable, functioning democracies often rely on *some* shared foundational values or civic culture? Doesn't completely dismissing cohesion risk ignoring a legitimate challenge of building common ground in diverse societies, potentially fueling the very resentment the framework attributes to racism?

  7.  **The Scope of "Colonial History":** Dummett emphasizes obligations arising from Britain's colonial history. How precisely does his framework define the scope of this obligation? Does it extend only to citizens of former colonies, or to ethnic groups specifically impacted by colonial policies within those states? Does the *nature* or *severity* of the colonial relationship matter (e.g., settler colonialism vs. indirect rule)? What about migrants from countries that were *not* colonies but were significantly impacted by British imperial policy (e.g., through economic domination or military intervention)?
      *   **Follow-Up:** Doesn't defining obligations based on specific colonial histories risk creating an incredibly complex, potentially arbitrary, and administratively burdensome system for determining admission claims? How can such a system be practically implemented fairly and efficiently?

  8.  **Public Opinion & Democratic Legitimacy:** Dummett diagnoses much restrictionist public opinion as rooted in racism. How does his framework reconcile the demands of justice (as he defines it, involving significant obligations to admit migrants) with the principles of democratic self-determination, especially if a majority of the citizenry holds restrictionist views (which he argues are often racist or misinformed)? Can a just immigration policy be imposed against the will of a democratic majority?
      *   **Follow-Up:** If the answer involves changing public opinion through moral argument and exposing racist underpinnings, but significant restrictionist sentiment persists democratically for decades, does the framework ultimately prioritize abstract justice over democratic legitimacy in a way that might be politically unsustainable or counterproductive?

  9.  **The Role of International Justice:** Dummett focuses on obligations arising from *specific* colonial histories. Does his framework also incorporate a broader argument for immigration justice based on global inequality, the unfairness of the global nation-state system, or universal human rights, independent of colonial history? Or is the colonial link the *primary* or even *sole* basis for stronger obligations beyond basic humanitarian refuge?
      *   **Follow-Up:** If the colonial link is primary, doesn't this let states without significant colonial histories (or with very different histories) largely off the hook for admitting migrants beyond minimal humanitarian obligations, even if they benefit immensely from the current unjust global order? Does this adequately address global migration justice?

  10. **Enduring Relevance & Structural Flaws:** Stepping back, if we accept the core moral structure of Dummett's argument (conditional right, suspicion of capacity claims, special colonial obligations), what do you see as its *most significant structural vulnerability* when applied to contemporary migration challenges – perhaps its reliance on difficult-to-prove motivations, the practical weight given to historical obligations vs. present need, or its handling of democratic dissent? How might you strengthen or adapt this core structure to address that vulnerability?
      *   **Follow-Up:** You identify [Vulnerability X] as key. Does addressing this vulnerability significantly alter the practical implications of Dummett's argument, perhaps making it *less* demanding on states than his original formulation, or does it require auxiliary mechanisms (e.g., international courts, specific burden-shifting rules) to make the core moral claims actionable?

  These questions focus on the *mechanics*, *tensions*, *practical implications*, and *underlying assumptions* of Dummett's argument, pushing your guest to explain not just *what* he argued, but *how* it works, *where* it might struggle, and *how* its core insights translate (or don't) into a coherent framework for analyzing real-world immigration debates. The follow-ups are designed to anticipate common lines of defense or points of complexity and push the conversation into deeper critical engagement.
