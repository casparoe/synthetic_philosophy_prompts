  In a recent case, the voting resulted in a paradox. The breakdown was: two yes/yes, one yes/no, one no/yes, and one no/no. So, individually, only two members thought the student was responsible. But collectively, the separate votes led to three "yes" on each question, making the student responsible. The user mentions this is similar to the doctrinal paradox or discursive dilemma.

