  Recommendations: Stick with premise-based but add safeguards. Require a supermajority? But that might make it too hard to find violations. Maybe allow panelists to change votes after discussion or have a third vote as a tiebreaker. Transparency about the paradox could help, explaining it in training so members understand the implications.

