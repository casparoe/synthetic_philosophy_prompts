answer: |-
  You've hit on the core tension brilliantly! The grudge-informer case *is* the crucible where natural law (Fuller) and positivism (Hart) clash most dramatically. Your frustration is understandable, but both positions offer more nuance than your initial framing suggests. Let's break down why Fuller's move isn't *just* Aquinas redux and why Hart's position isn't a moral dead end:

  **Why Fuller's "Inner Morality" is More Than Aquinas Repackaged:**

  1.  **Shift from Substance to Procedure:** Aquinas focused on the *substantive moral content* of the law ("lex iniusta non est lex"). A law violating fundamental moral principles (like commanding evil) wasn't law. **Fuller shifts the focus to *procedural morality*.** His eight "principles of legality" (generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy over time, congruence between official action and declared rule) are about the *form* and *process* of lawmaking and application, not the inherent rightness/wrongness of the law's *content*.
      *   **The Nazi Problem:** Fuller argues that Nazi "laws," like the one criminalizing criticism of Hitler, systematically *violated* these principles. They were often secret, retroactive, impossibly vague (e.g., what constitutes "undermining morale"?), arbitrarily applied, and lacked constancy. For Fuller, a system so fundamentally failing these procedural requirements *cannot function as law* – it's not merely substantively evil; it's *legally defective* at its core. The grudge-informer relied on a "rule" that wasn't a *legal* rule at all because it lacked these defining features of legality.

  2.  **Law as a Purposeful Enterprise:** Fuller sees law as having an inherent purpose: to subject human conduct to the governance of rules. His principles aren't arbitrary moral dictates; they are *functional requirements* for achieving that purpose. A system utterly failing these principles isn't just immoral; it *fails at being law* because it cannot fulfill its defining function of guiding behavior through rules. Aquinas might say an evil command isn't law; Fuller says a command issued in a way that makes rule-following *impossible* isn't law.

  3.  **The Eight Principles Do Real Work:** Your professor is right to emphasize them. They provide concrete, *identifiable criteria* for assessing whether a purported legal system meets a minimum threshold of legality. It's not just "immoral = not law"; it's "systematically violates these procedural norms essential for rule-guided behavior = not law." This offers a more objective (though still debated) standard than pure substantive moral judgment. The grudge-informer statute likely violated *multiple* principles (clarity? non-retroactivity in application? congruence?).

  **Why Hart's Positivism Isn't Morally Bankrupt (And Why It's Still Vital):**

  1.  **Clarity of Analysis - Separating "Is" and "Ought":** Hart's core point is descriptive and analytical. His goal is to understand *what law is* as a social phenomenon, distinct from what it *ought to be*. Saying the Nazi statute was "valid law" *within the Nazi system* (according to their own rules of recognition) is simply stating a sociological fact. It doesn't mean endorsing it morally.
      *   **The Danger of Conflation:** Hart argues that *conflating* legal validity with moral validity (like Fuller arguably does, and Aquinas definitely does) is dangerous. It can blind us to the reality that evil regimes *do* use legal forms effectively to perpetrate atrocities. Calling it "not law" risks underestimating its power and the nature of the threat. We need to recognize the "law" *as law* to fully confront its evil.

  2.  **The Retroactive Law Solution - A Principled Positivist Response:** Hart explicitly addresses the grudge-informer dilemma. His solution isn't a shrug! He argues that the *morally correct and legally honest* approach is to pass a *retroactive* law explicitly criminalizing the actions of the informers *under the new, democratic regime*.
      *   **Why this is Principled:**
          *   **Honesty:** It openly admits that what the informers did was *legal under the old regime* but is now deemed so morally repugnant that it warrants punishment *despite* its prior legality.
          *   **Rule of Law Values:** While retroactivity is generally problematic (violating Fuller's principle!), Hart argues it's the *lesser evil* in such extreme cases. It avoids the fiction of pretending the Nazi statute wasn't "law" and maintains clarity about the source of the new legal/moral judgment (the new democratic legislature).
          *   **Preserving the Core Insight:** It upholds the separation thesis – the old law was valid (as law) but evil; the new law is valid and morally justified. We condemn the act *morally* and create *new law* to punish it, rather than distorting the concept of law itself.

  3.  **Avoiding Subjective Moral Floodgates:** Hart fears that building morality into the *definition* of law opens the door to chaos and arbitrary rule. Who decides what's "sufficiently immoral" to not be law? Is a tax law deemed unfair by some suddenly "not law"? Fuller's procedural criteria aim for objectivity, but critics argue even they have a moral dimension and can be fuzzy at the edges. Positivism offers greater stability and predictability by anchoring validity in relatively clear social facts (sources, like legislative enactment).

  **Why the Debate Persists & Why Both Are "Live" Positions:**

  1.  **Fuller's Enduring Appeal:** The grudge-informer case *is* a powerful indictment of pure positivism. Fuller's response resonates because it offers a way to deny *legal* legitimacy to profoundly evil regimes *from within the concept of law itself*, using criteria focused on the *form* of law rather than just its content. His principles provide a valuable toolkit for critiquing legal systems that are tyrannical *because* they are arbitrary and unpredictable.
  2.  **Hart's Enduring Strength:** The clarity of the separation thesis remains powerful. It allows us to:
      *   Clearly describe evil legal systems without euphemism.
      *   Vigorously criticize laws as morally abhorrent *even while recognizing them as legally valid*.
      *   Understand the diverse functions law serves (not always for good!).
      *   Provide a stable framework for legal analysis in morally complex but less extreme situations than Nazi Germany.
      *   Offer a practical (if uncomfortable) solution (retroactive law) for transitional justice.
  3.  **The Grudge-Informer Case Doesn't Refute Positivism:** It exposes its limitations and moral discomfort in the *most extreme* cases. But Hart *has* a principled, rule-of-law respecting response (retroactive legislation). For many, this response, while admitting a painful truth about the past, is more honest and ultimately safer than redefining law to exclude whatever we find morally repugnant. Fuller offers a different, compelling way to draw a line against tyranny *within* jurisprudence.

  **In Conclusion:**

  *   **Fuller isn't just Aquinas:** He moved the debate from substantive morality to the *procedural morality inherent in the very enterprise of lawgiving*. The eight principles *do* independent work defining a minimum threshold for calling a system "law."
  *   **Hart doesn't just shrug:** He offers a distinct, rule-of-law based solution (retroactive legislation) that preserves the separation of law and morality while still achieving moral condemnation. He argues this is *more* honest and ultimately safer.
  *   **The Debate Lives On:** Because it grapples with fundamental questions: What *is* law? Can something utterly evil still *be* law? How should a society deal with atrocities committed under the color of past "law"? Fuller provides a way to deny the legal character of extreme evil; Hart provides a way to confront its legal reality head-on while condemning it morally and legally after the fact. Both perspectives offer crucial insights into law's nature, power, and peril. The grudge-informer case remains powerful precisely because it shows the strengths *and* limitations of both approaches under the most severe moral pressure.
