answer: |-
  You've put your finger on a profound tension in journalism epistemology. This isn't just institutional habit—there *are* defensible principles at work, though they reveal deeper philosophical differences about evidence, institutions, and the nature of truth-claims. Let's break it down:

  ### Core Principles Explaining the Divide
  1.  **Nature of the Claim & Burden of Proof:**
      *   **Investigative/Political (Wrongdoing):** These are *accusatory* claims about *hidden actions* with *high stakes* (reputation, legality, power). They inherently demand a higher burden of proof. The claim itself implies deception or illegality, automatically casting doubt on the subject's credibility and requiring external validation. The two-source rule mitigates the risk of being weaponized by a single malicious or mistaken source.
      *   **Science (Researcher's Own Work):** This is a *first-hand account* of *observable events/data* within the source's *direct purview* by someone whose professional credibility *depends* on accurate reporting of their work. The claim ("We observed X in our lab") isn't inherently accusatory; it's a report of fact within their domain. The burden of proof is lower because the claim aligns with the source's role and incentives (advancing accurate science).

  2.  **Epistemological Foundations & Verification Mechanisms:**
      *   **Investigative/Political:** The claim exists largely *outside* robust, immediate verification systems. Politics lacks a formal "peer review." Corroboration *must* be built by the reporter through multiple independent accounts. The "say-so" is the *entire* evidence base, hence needing redundancy.
      *   **Science:** The claim exists *within* a powerful verification system (scientific method, peer review, replication). The researcher's "say-so" about their *own direct observation* is the *starting point*, not the endpoint. Publication (and subsequent attempts at replication) *is* the built-in, institutionalized "second source" (and third, and fourth...). Your attribution ("Researcher X said they observed Y") accurately reports the *claim's existence* at a specific point in this process. You're not declaring the claim *true*; you're reporting the researcher's assertion as part of the scientific discourse.

  3.  **Source Motivation & Risk of Deception:**
      *   **Investigative/Political (Especially Unnamed):** Sources often have complex, hidden agendas (vengeance, political maneuvering, self-preservation). The *act of making the claim* might be strategic. High risk of deliberate deception or unconscious bias.
      *   **Science (Named Lead Researcher):** While bias exists (desire for fame, funding), the primary professional incentive is *accurate reporting* of their work. Fabricating data is career suicide if discovered, and the scientific process is designed to catch it. Deception about *their own direct observations* is high-risk/low-reward in the long term. Their name attached creates accountability.

  4.  **The "Couldn't Compare Notes" Clause & Its Absence in Science:**
      *   **Investigative/Political:** Essential. Prevents collusion, groupthink, or contamination of accounts. Ensures the story isn't built on a single, potentially distorted narrative stream.
      *   **Science:** Often irrelevant. The "source" *is* the primary witness to the phenomenon. Other lab members likely *did* "compare notes" – that's how science works! Their corroboration (if sought) wouldn't be independent in the investigative sense, but it would check for internal consistency/fraud. Your story relies on the *principal investigator's* account *as the authoritative voice for the lab's work*.

  ### Why Your Colleague's "Common Sense" Argument is Incomplete (But Not Wrong)
  Your investigations colleague is right about the *risk* in high-stakes adversarial reporting. However, their argument misses the key distinctions above:
  *   **"Ultimately rest on somebody's word":** True, but the *nature* of that "word" differs radically. A whistleblower's word about a secret meeting is fundamentally different from a named researcher's word about the color of a solution in their own beaker. The former is *allegation*, the latter is *direct observation reported by the observer*.
  *   **"How reporters get burned":** Absolutely true *for their beat*. The consequences of a false accusation in politics/investigations are catastrophic (libel, destroyed trust, ruined careers). In science reporting on a *new claim*, the primary "burn" is reputational damage to the *outlet* if the claim is later retracted, mitigated by accurate attribution ("X claimed Y"). The *scientific process itself* is expected to validate or falsify the claim later. The risk profile is different.

  ### Is There a Unifying Theory? A Synthesis
  The deeper principle unifying both practices is **contextual burden of proof based on claim type, stakes, and available verification mechanisms:**

  1.  **High Burden (Two-Source Rule Applies):** Claims about *hidden actions/mental states* (intent, wrongdoing, secret meetings) involving *powerful actors*, made by sources *not directly involved* or with *highly complex motives*, where *immediate institutional verification is absent* and the *consequences of error are severe* (e.g., political corruption, corporate malfeasance).
  2.  **Lower Burden (Single Named Source Often Sufficient):** Claims about *direct, observable phenomena* within the *source's professional domain and purview*, made by a *credible, named expert* whose *incentives align* with accuracy, operating within a *robust institutional verification system* (science, established bureaucratic procedure), where the *claim itself is non-accusatory* and the *consequences of initial error are correctable* (e.g., reporting a new scientific finding, a CEO stating quarterly earnings, a police chief describing a public event).

  **Therefore, the gap isn't unprincipled.** It reflects a sophisticated (though often implicit) understanding of different epistemic contexts:

  *   **Investigative Journalism:** Operates in a realm of deliberate obscurity and potential bad faith. Its core method is *forensic reconstruction* via corroboration.
  *   **Science Journalism:** Operates in a realm (ideally) of transparent methodology and institutionalized truth-seeking. Its core method is *reporting the current state of inquiry*, often relying on authoritative accounts of direct observation, trusting (critically, not blindly) the discipline's verification processes to follow.

  **The Tension You Feel is Real:** It highlights journalism's struggle to be a single epistemology. Your editor's justification ("entitled to take a credible scientist's word") points to the *institutional trust* inherent in science reporting – trust that is deliberately suspended in investigative work. The investigations desk's rule embodies *radical skepticism* necessary for their adversarial role. Both are principled stances adapted to their specific domains of reality and risk. The challenge is ensuring the *right* principle governs the *right* story, and avoiding the misapplication of one beat's norm to another's context.
