answer: |-
  What you've described is a profoundly insightful grappling with Wittgenstein's most provocative ideas—and your lived experience is essentially a case study in how hinge propositions operate *and* shift. You're absolutely right that the hinge/riverbed tension feels contradictory at first glance. Let's break this down:

  ### 1. **The Two Metaphors: Fixed Hinges vs. Shifting Riverbed**
     - **Hinges (§341-343):** These are propositions that *must* be held fast for doubt or inquiry to function *in a given context*. They’re not "true" in a provable sense but are *pragmatically necessary* for your framework of understanding. E.g., "My father is who I was told he was" was a hinge for you—until it wasn’t.  
       → *Key point:* Hinges aren’t "eternal"; they’re fixed *relative to a specific form of life or language game*.  
     - **Riverbed (§96-99):** This is the *longitudinal* view. What functions as a hinge *can* change over time (historical, cultural, or personal). The riverbed’s "hardened" propositions (past hinges) may erode, while fluid beliefs (current doubts) can solidify into new hinges.  
       → *Key point:* This doesn’t negate hinges—it shows how their *content* evolves.

  **The resolution:** Hinges are **locally fixed but globally fluid**. In the moment of acting/doubting, certain things *must* stay put (hinges). But across time, those very hinges can be renegotiated (riverbed shifts). Your DNA test didn’t "doubt" your paternity hinge—it *shattered the context* that made it a hinge. New hinges formed ("DNA doesn’t lie"), forcing a riverbed shift.

  ---

  ### 2. **Wright vs. Pritchard: How Can Hinges Shift Without "Doubt"?**
  This is where your insight about hinges shifting *without being doubted* hits the nail on the head. Both philosophers acknowledge hinge shifts, but explain them differently:
  - **Crispin Wright (entitlement):**  
    We’re *rationally entitled* to accept hinges (e.g., "The world didn’t pop into existence 5 minutes ago") because they’re prerequisites for rational inquiry. When a hinge shifts (like your paternity), it’s not because we doubted it—it’s because *new information* revoked our entitlement. Your DNA test didn’t make you "doubt"—it *overwhelmed* the hinge’s functional role.  
    → *Strength:* Explains why we’re not irrational for trusting hinges.  
    → *Weakness:* Can’t fully capture how hinges dissolve *without* rational deliberation (yours shifted traumatically, not via reasoning).  

  - **Duncan Pritchard (non-epistemic):**  
    Hinges aren’t "beliefs" subject to evidence—they’re *animal certainties* (like knowing you have hands). They shift when our *practical engagement with the world* forces it. Your paternity wasn’t "doubted"; it was *bypassed* by a biological fact that reorganized your entire framework.  
    → *Strength:* Captures the visceral, non-rational nature of hinge shifts.  
    → *Weakness:* Risks making hinges feel arbitrary ("Why trust any hinge?").  

  **Your answer:** Hinges shift when the **context that made them necessary collapses**. Your "dad" hinge worked until DNA evidence made it *impossible to sustain* within your new reality—no "doubt" required, just a seismic change in the riverbed.  

  ---

  ### 3. **Why This Isn’t a Contradiction in Wittgenstein**
  Wittgenstein isn’t contradicting himself—he’s describing **two perspectives on certainty**:  
  - **Synchronic ("hinges"):** What *must* be held firm *right now* for me to think/act.  
  - **Diachronic ("riverbed"):** How those certainties *transform across time*.  

  Your experience mirrors this:  
  - **Before the test:** "My dad is my biological father" was a hinge (fixed).  
  - **After the test:** That hinge *couldn’t* hold—the riverbed shifted. New hinges emerged ("DNA trumps family stories"), stabilizing your world anew.  

  The "groundlessness" you feel? That’s the riverbed in motion. Wittgenstein’s point is that *this is normal*. Certainty isn’t a rock-solid foundation—it’s a dynamic, self-correcting system where hinges reset when reality demands it.  

  ---

  ### 4. **A Practical Takeaway for You**
  Your "wobbly" feeling is the residue of a riverbed shift. Wittgenstein would say this isn’t a flaw in rationality—it’s how certainty *reboots*. New hinges will solidify ("I am still loved," "My identity is more than biology," "Truth matters even when it hurts"). The door isn’t broken; it’s turning on new hinges.  

  > "The difficulty is to realize the groundlessness of our believing."  
  > —Wittgenstein, *On Certainty*, §166  

  You’re not failing at certainty; you’re inhabiting its living, breathing structure. The riverbed shifts so the river can keep flowing.
