answer: |-
  Here's a breakdown of Galen Strawson's "Basic Argument" against moral responsibility, addressing your points precisely:

  **The Core Structure of the Basic Argument (Premise-by-Premise):**

  Strawson's argument targets the idea of *ultimate moral responsibility* (UMR) – the idea that you can be truly *deserving* of praise or blame for your actions in a deep, non-derivative way. It's a logical regress argument:

  1.  **Premise 1 (P1):** You do what you do, in any given situation, because of the way you are. (Your actions flow from your specific mental state – your beliefs, desires, personality, character, values, etc., at that moment).
  2.  **Premise 2 (P2):** To be *ultimately morally responsible* (UMR) for what you do, you must be ultimately responsible for the way you are (at least in certain crucial mental respects relevant to that action).
      *   *Reasoning:* If you're not responsible for *why* you have the specific motivations/character that led to the action, how can you be *truly* responsible for the action *itself*? The responsibility would be derivative, tracing back to factors outside your control.
  3.  **Premise 3 (P3):** You cannot be ultimately responsible for the way you are at any given time T1.
      *   *Sub-Argument for P3:*
          *   **P3a:** The way you are at T1 is the result of either:
              *   (a) Genetic inheritance (factors you didn't choose).
              *   (b) Early environment and upbringing (factors you didn't choose and couldn't control).
              *   (c) Previous actions and choices you made (which occurred at some earlier time T0).
          *   **P3b:** If (a) or (b), you clearly aren't ultimately responsible for the way you are at T1 (since you didn't control those formative causes).
          *   **P3c:** If (c), then to be ultimately responsible for the way you are at T1 (resulting from choices/actions at T0), you must have been ultimately responsible for the way you were *at the earlier time T0* (because your choices/actions at T0 flowed from the way you were at T0).
  4.  **Premise 4 (P4):** This creates an infinite regress. To be ultimately responsible for the way you are at T1, you need to be ultimately responsible for the way you were at T0. To be ultimately responsible for the way you were at T0, you need to be ultimately responsible for the way you were at T-1, and so on, *ad infinitum*.
  5.  **Premise 5 (P5):** This regress cannot be completed. You cannot go infinitely far back in time to create or fundamentally shape your own initial starting state ("the way you were" at the first moment).
  6.  **Conclusion:** Therefore, you cannot be ultimately morally responsible for the way you are at T1 (or any T). Therefore, by P2, you cannot be ultimately morally responsible for anything you do.

  **Where "Causa Sui" Does the Work:**

  *   The **causa sui** (Latin: "cause of itself") move is the fatal requirement identified in the regress. The argument shows that UMR *requires* you to be your own *fundamental, uncaused cause*.
  *   Specifically, it requires you to be **causa sui** with respect to your *initial character-forming state* or your *very self* at some primordial starting point. You would need to have created yourself *ex nihilo* (out of nothing), or chosen your fundamental nature *before* you had any nature to make such a choice with.
  *   **The Work:** The argument demonstrates that UMR logically *demands* this impossible **causa sui** status. Since being **causa sui** is impossible (nothing can cause itself to exist or cause its own fundamental nature prior to existing), UMR is impossible. The regress *forces* you back to this impossible requirement. P3c -> P4 -> P5 explicitly trap you in this need for self-creation.

  **Why Determinism vs. Indeterminism Doesn't Matter:**

  This is the **crucial point** where Strawson argues his case is *stronger* than hard determinism:

  1.  **If Determinism is True:** Everything is causally determined. Your initial state (T0) is fixed by prior causes (genes/environment) outside your control. Your choices and character development are determined by that initial state + subsequent determined causes. You clearly lack UMR. Hard determinism stops here.
  2.  **If Indeterminism is True (e.g., Quantum randomness, libertarian free will):** Some events aren't fully causally determined. *How does this help?*
      *   **Option 1: Indeterminism *before* your character/choices.** If the indeterminism lies in the initial formation of your character (e.g., random genetic mutations, random environmental events), this just adds *randomness* to the factors shaping you that you *didn't control*. Randomness isn't control; it doesn't make you responsible for the outcome. You still didn't *choose* or *cause* that initial state.
      *   **Option 2: Indeterminism *within* your decision-making.** Suppose your choices involve some element of randomness or uncaused events. Strawson argues:
          *   **Lack of Control:** An uncaused or random event in your decision process isn't something *you* control. It just *happens* to you. How can you be responsible for a random mental event?
          *   **Failure to Solve the Regress:** Even *if* a choice at T0 involved indeterminism, the *capacity* or *tendency* to make choices in that way (or to have randomness affect you in that way) is still part of "the way you are" at T0. To be UMR for the choice at T0, you'd *still* need to be UMR for "the way you are" at T0 (including that indeterministic tendency). This just pushes the regress back one step; you still need to be UMR for the prior state that gave rise to *that* indeterministic capacity. You still hit the **causa sui** requirement.
  3.  **The Core Insight:** Indeterminism might break causal chains, but it doesn't provide the *self-creation* needed for UMR. It either introduces *uncontrolled randomness* (which doesn't help) or fails to stop the regress demanding that you be ultimately responsible for your own fundamental nature. **Only being *causa sui* could stop the regress and grant UMR, and that's impossible.** Therefore, determinism *or* indeterminism leads to the same conclusion: UMR is impossible.

  **The Nietzsche Connection (It's Real!):**

  *   Your friend wasn't making it up. Strawson **explicitly references Nietzsche** on **causa sui**.
  *   Nietzsche famously ridiculed the concept of **causa sui** in *Beyond Good and Evil* (Section 21): *"The causa sui is the best self-contradiction that has been conceived so far; it is a sort of rape and perversion of logic. But the extravagant pride of man has managed to entangle itself profoundly and frightfully with just this nonsense."*
  *   Strawson wholeheartedly agrees. His argument shows that UMR *requires* this "best self-contradiction." He uses Nietzsche's point to highlight the sheer absurdity of the requirement his regress argument exposes. So yes, Nietzsche is a key philosophical ancestor for this specific point in Strawson's argument.

  **Galen Strawson vs. P.F. Strawson (His Father): Almost Polar Opposites**

  This is a classic philosophical father-son disagreement!

  *   **P.F. Strawson (Peter Frederick Strawson):** Argued in his seminal paper **"Freedom and Resentment" (1962)** for a **compatibilist** position, but a very distinctive one.
      *   **Core Argument:** The traditional debate between hard determinists/incompatibilists and classical compatibilists misses the point. Our practices of holding people morally responsible aren't based on a metaphysical belief in contra-causal freedom (libertarian free will). Instead, they are rooted in our natural, human **"reactive attitudes"** – emotions like resentment, gratitude, forgiveness, indignation, moral praise, and blame.
      *   **Reactive Attitudes:** These are fundamental to human interpersonal relationships and society. We *naturally* react to others as responsible agents based on the quality of their will towards us (e.g., resentment when someone shows ill will, gratitude for good will).
      *   **The "Pessimist" (Hard Determinist/Incompatibilist):** P.F. Strawson argues the pessimist asks us to suspend these natural reactive attitudes if determinism is true. But this is practically *impossible* and deeply *undesirable*. We couldn't function as social beings.
      *   **Conclusion:** Determinism is irrelevant to our actual practices of responsibility. Our responsibility practices are justified *because* they are constitutive of our social existence and relationships, grounded in these inescapable reactive attitudes. We don't need (and shouldn't seek) a metaphysical foundation in libertarian free will. Responsibility is a *social* phenomenon, not a metaphysical one. **Compatibilist Conclusion:** Moral responsibility is compatible with determinism *because* it doesn't ultimately depend on the truth or falsity of libertarian free will.
  *   **Galen Strawson:** Argues for **incompatibilism** but **skepticism** about free will/responsibility *even under indeterminism*.
      *   **Core Argument:** P.F.'s account might describe our *practices*, but it doesn't address the core *metaphysical* question Galen cares about: **Ultimate Moral Responsibility (UMR)**. He argues that our reactive attitudes and practices *presuppose* a belief in UMR. If we truly believed we lacked UMR (as his Basic Argument concludes), these reactive attitudes would be rationally undermined.
      *   **Against His Father:** Galen thinks P.F. Strawson sidesteps the real metaphysical challenge. If the Basic Argument is sound, then the UMR presupposed by our reactive attitudes is impossible. While we might *feel* resentment, knowing we lack UMR means those feelings are ultimately unjustified in the deep desert sense. He argues his father's position doesn't *refute* the incompatibilist challenge; it just changes the subject to psychology/sociology.
      *   **Conclusion:** UMR is impossible (metaphysical conclusion), which means our reactive attitudes, while perhaps psychologically unavoidable or socially useful, lack ultimate *justifying* grounds in true desert. Responsibility, in the deep sense of *deserving* praise/blame, doesn't exist.

  **Summary:**

  *   **Galen Strawson's Basic Argument:** Shows UMR requires impossible self-creation (**causa sui**) via a logical regress. This regress hits the **causa sui** wall regardless of determinism (randomness doesn't help).
  *   **Nietzsche Connection:** Strawson uses Nietzsche's critique of **causa sui** to highlight the absurdity of the requirement for UMR.
  *   **P.F. Strawson (Father):** Argues responsibility practices are grounded in natural reactive attitudes, not metaphysics, and are compatible with determinism. Focuses on social practice.
  *   **Galen Strawson (Son):** Argues reactive attitudes *presuppose* UMR, which is metaphysically impossible (due to the **causa sui** problem), so true desert-based moral responsibility doesn't exist. Focuses on metaphysical foundations.

  You were right to push back on your friend – Galen Strawson's argument *is* designed to work even if indeterminism is true, precisely because indeterminism fails to provide the necessary self-creation (**causa sui**) to stop the regress. The confusion with his father is also very common – they represent fundamentally different approaches to the free will problem!
