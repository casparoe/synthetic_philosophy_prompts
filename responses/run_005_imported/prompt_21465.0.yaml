prompt: |-
  A friend and I spent last night arguing about whether the fink and mask literature really forces you into treating dispositions as primitive, or whether a sufficiently patched conditional analysis can still be saved -- we never settled it. I host a small philosophy podcast, and next week's guest is a metaphysician known for defending dispositional essentialism: the view that powers are ontologically basic, and that finks and masks show that no conditional analysis of dispositions can be repaired. Draft eight to ten interview questions that go beyond having her restate the position. I want at least one question on why Martin's electro-fink is supposed to be fatal to the simple conditional analysis but not to a suitably reformed one, such as Lewis's proposal that the relevant intrinsic basis need only persist through the stimulus; one on how her view handles masks and antidotes differently from finks, given that in a masking case the disposition and its basis are both still present and merely blocked, which seems to owe us some independent account of "still present" that doesn't itself bottom out in a conditional; one on whether explaining a power's manifestation by appeal to yet further, more fundamental powers threatens a regress that empties the essentialist thesis of content; and one, to close, on what observation or argument would count as evidence against dispositional essentialism specifically, rather than merely against some particular conditional analysis of dispositions. For each, add a follow-up keyed to the answer she's most likely to give.
