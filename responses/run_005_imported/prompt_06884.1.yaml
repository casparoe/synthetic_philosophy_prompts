answer: |-
  Here are 8 interview questions with follow-ups designed to probe the core arguments, distinctions, and implications of your guest's work, specifically targeting the areas you requested:

  1.  **The Hacking Foundation:**
      *   **Question:** "Hacking famously used autism as his *primary* example when developing the Interactive Kind concept. Your work argues the *recent* diagnostic explosion is best explained by looping effects. Beyond just updating the scale or timeframe, what fundamentally *new* mechanisms, dynamics, or empirical evidence does your analysis reveal about autism that Hacking's original framework didn't capture or anticipate?"
      *   **Likely Answer/Follow-Up Key:** (She might emphasize neurodiversity movement impact, social media acceleration, specific DSM-5 changes' interaction effects, or economic incentives). *Follow-Up:* "Hacking focused on the 'making up' of people via classification. You mention [mechanism X]. Does this suggest a qualitatively *different kind* of interactivity than he described, or just a more intense version operating on the same core principle?"

  2.  **Distinguishing Looping from Better Detection:**
      *   **Question:** "The core counter-argument is always 'We're just better at finding it, especially in girls, adults, and higher-functioning individuals.' What specific empirical evidence or methodological approach allows you to *disentangle* a genuine Hacking-style feedback loop (where the classification changes the classified) from simply improved detection sensitivity and reduced stigma leading to more *accurate* identification of a pre-existing condition?"
      *   **Likely Answer/Follow-Up Key:** (She might cite lagged effects post-DSM-5, specific symptom shifts in new diagnoses, prevalence patterns inconsistent with passive discovery, or changes in *how* autism manifests socially). *Follow-Up:* "Couldn't those patterns also be explained by the *broadening* of the diagnostic criteria itself (DSM-5) acting as a one-time 'detection improvement,' rather than an *ongoing* interactive process? How do you rule that out as the primary driver?"

  3.  **Concept Creep vs. Looping:**
      *   **Question:** "Nick Haslam's work on 'concept creep' describes the expansion of harm-related concepts like trauma or bullying into softer domains. Autism's diagnostic expansion shares features with this. How is your 'looping effect' explanation for autism's diagnostic explosion *distinct* from Haslam-style concept creep? Is looping just concept creep applied to medical categories, or is there a crucial difference in mechanism?"
      *   **Likely Answer/Follow-Up Key:** (She'll likely emphasize the *bidirectional feedback* in looping – how the labeled individuals actively reshape the category and its meaning – vs. concept creep's more top-down or cultural semantic drift). *Follow-Up:* "But doesn't concept creep *also* involve feedback? As 'autism' expands culturally, doesn't that influence self-perception and reporting, blurring the line? Isn't the key distinction *degree* rather than *kind* of social influence?"

  4.  **Social Constructionism Redux?**
      *   **Question:** "Hacking spent decades insisting interactive kinds were *not* mere social constructions in the strong sense – there was a 'something' there that the classification latched onto and interacted *with*. Does your explanation for the autism explosion risk collapsing back into a plain social constructionist view? If not, what specific 'indifferent' kernel or biological reality does your analysis *preserve* that prevents this collapse?"
      *   **Likely Answer/Follow-Up Key:** (She'll assert preserving a biological basis, perhaps neurodevelopmental differences in sensory processing, cognition, etc., that the label interacts *with*). *Follow-Up:* "If that biological kernel is stable, and the explosion is primarily driven by looping interacting with *that* kernel, how do you explain the dramatic shift in *who* gets diagnosed (e.g., massive increase in verbal females)? Does this require the 'kernel' itself to be far broader and fuzzier than previously thought, pushing back towards constructionism?"

  5.  **The MPD Test Case:**
      *   **Question:** "Multiple Personality Disorder (MPD/DID) in the 80s/90s is often seen as a classic, almost paradigmatic example of a Hacking-style looping effect that eventually collapsed under scrutiny and diagnostic reform. If your framework for autism had been applied *during* the MPD wave, what specific signals or dynamics within the diagnostic process, patient presentations, or therapeutic community would it have identified as indicating an unstable, looping-driven phenomenon *likely* to collapse, rather than a stable discovery?"
      *   **Likely Answer/Follow-Up Key:** (She might point to therapist suggestion, lack of cross-cultural consistency, instability of symptoms, media amplification, specific iatrogenic factors). *Follow-Up:* "Autism advocacy is incredibly powerful, and the neurodiversity movement actively embraces the identity. Doesn't this strong, positive identity formation *stabilize* the category in a way MPD lacked, making an MPD-style collapse for autism far less likely, even *if* looping is a major driver? Does your framework account for this stabilizing power?"

  6.  **Predictive Power & Falsifiability:**
      *   **Question:** "A key strength of Hacking's framework is its *retrospective* explanatory power for phenomena like fugue states or MPD. But for it to be robust science, it needs predictive or falsifiable elements. What specific future observation regarding autism diagnoses, their characteristics, or societal impact would *falsify* your looping-effects explanation as the primary driver of the recent explosion? Conversely, what would strongly *confirm* it?"
      *   **Likely Answer/Follow-Up Key:** (She might suggest falsification: prevalence plateaus sharply without criteria changes; new diagnoses lack identity adoption. Confirmation: emergence of distinct "DSM-5 autism" subculture; diagnostic criteria evolve *in response* to patient advocacy in specific ways). *Follow-Up:* "Couldn't a plateau just mean detection finally reached saturation? And couldn't patient advocacy influencing criteria simply reflect better science incorporating lived experience? How are those clearly different from your looping predictions?"

  7.  **Implications for Practice & Identity:**
      *   **Question:** "If your looping explanation is correct, what are the concrete implications for clinicians making autism diagnoses *today*? Should they be more skeptical? More cautious about labels? Or does the explanation largely sit at a sociological level, not affecting the individual clinical encounter where a diagnosis might bring real benefit (access, understanding, community)?"
      *   **Likely Answer/Follow-Up Key:** (She'll likely emphasize awareness of context, avoiding over-medicalization, but stress current diagnostic utility for individuals). *Follow-Up:* "Doesn't the *potential* for looping effects, especially if clinicians are primed to look for autism, create an ethical tension? How do clinicians balance the real benefits of diagnosis for an individual *right now* against the risk of contributing to a potentially unstable or expanding diagnostic category driven by feedback loops?"

  8.  **The Neurodiversity Movement: Engine or Effect?**
      *   **Question:** "The neurodiversity movement is deeply intertwined with the rise in autism diagnoses and identity. Within your looping framework, is the neurodiversity movement primarily a *driver* of the looping effect (actively shaping the category and encouraging identification), a *product* of it (arising from the larger identified population), or is the relationship more complexly bidirectional? And how crucial is this movement to your overall thesis?"
      *   **Likely Answer/Follow-Up Key:** (She'll emphasize the complex bidirectionality - the movement fuels identification which fuels the movement). *Follow-Up:* "If the neurodiversity movement is a key *component* of the contemporary autism loop, rather than just a response, does this reframe the movement? Is it partly engaged in a form of strategic 'category-making' for political/identity purposes, even if grounded in real experiences?"

  **Key Rationale for these Questions:**

  *   **Forces Distinction:** Q2 & Q3 directly tackle the "better detection" and "concept creep" challenges, demanding specific evidence and conceptual clarity.
  *   **Hacking's Ghost:** Q1 addresses the "updating Hacking" point, while Q4 confronts the social constructionism tension head-on, demanding a defense of the 'something there'.
  *   **MPD Test:** Q5 specifically uses MPD as a stress test for *predictive* power or diagnostic signs of instability within the framework.
  *   **Falsifiability:** Q6 pushes the framework towards being scientific, not just post-hoc explanatory.
  *   **Nuance & Implications:** Q7 & Q8 explore real-world consequences and the crucial role of identity/advocacy, moving beyond pure theory.
  *   **Follow-Ups:** Designed to anticipate common answers and push deeper into the logical implications, contradictions, or evidentiary burdens. They avoid simple clarification and aim for productive tension.

  **Delivery Tip:** Frame these collaboratively: "I'm really trying to steelman your argument for our listeners and probe where it might face pushback, so they get the full picture..." Good luck with the interview!
