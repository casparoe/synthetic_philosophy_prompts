prompt: |-
  so i run a little interview podcast for my rationalist meetup (very small potatoes, maybe 40 listeners lol), and next month's guest is a philosopher of psychiatry who's about to publish something arguing the recent explosion in autism diagnoses is best explained as a Hacking-style looping effect, not just better detection or looser DSM-5 criteria -- kind of the same territory Scott Alexander pokes at on ACX sometimes, but with actual philosophy-of-science machinery behind it. thing is, Hacking himself already used autism as his go-to example when he worked out the interactive-kind/indifferent-kind distinction, so there's an obvious "so you're just updating his numbers?" question sitting right there, but i want stuff sharper than that too.

  can you draft 8-10 interview questions, each with a quick follow-up keyed to whatever answer she'd probably give? at minimum i want: one that forces her to say how a looping-effect explanation is even distinguishable in principle from "we just got better at recognizing it," or from Haslam-style concept creep (a seperate literature about basically the same phenomenon that i don't think she gets to just wave away); one on whether her view secretly collapses into the plain social constructionism Hacking spent his whole career insisting he wasn't doing; and one that uses the old multiple-personality-disorder wave from the 80s/90s as a test case -- would her framework have predicted that one would collapse the way it did, or does it only explain things after the fact?
