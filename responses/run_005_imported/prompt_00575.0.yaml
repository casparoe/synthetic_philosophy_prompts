  so for the nonidentity problem, i get that Parfit says a future person can't be "harmed" by being brought into existence in a worse condition since if you'd acted differently they literally wouldn't exist to compare against. but doesn't this basically mean its impossible to ever wrong future generations at all, like with climate change or w/e, since literally any different policy changes who gets born later? seems like the nonidentity problem basically proves we have zero obligations to future people. is that the accepted conclusion philosophers landed on?
