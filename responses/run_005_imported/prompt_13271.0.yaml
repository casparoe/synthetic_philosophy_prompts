  In their decision, the guaranteed job offers certainty. Under standard EU, if they prefer the job, it's assumed that the utility of $800 is higher than 20% of $5000's utility. But with Buchak's model, they might assign extra weight to the worst outcome. So even if utility is linear, the risk function could make the gamble less attractive. 

  I should explain the calculations. For standard EU, if utility is linear, the gamble's expected utility is $1000, higher than $800. But with diminishing utility, maybe $800 has more utility than 20% of $5000. Buchak's model adds a risk function. If they're risk-averse, they might use a function that overweights bad outcomes. So the 80% chance of nothing gets weighted more, lowering the gamble's appeal even with linear utility. 

