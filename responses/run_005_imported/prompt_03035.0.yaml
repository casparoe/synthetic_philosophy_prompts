  ok i need a tiebreaker. spent like two hours last night arguing with my friend about longtermism (she's deep into the "the far future has way more potential people in it so it should dominate the moral math" camp). my pushback was basically: how could you possibly know whether anything you do today makes the far future better instead of worse, given how chaotic a million-year causal chain is. she said that's literally just "the cluelessness objection" and that Greaves splits it into 'simple' vs 'complex' cluelessness — simple cluelessness supposedly isn't a real problem because the unknown effects cancel out symmetrically, so the actual question is whether longtermism suffers from complex cluelessness any worse than ordinary near-term charity does. i got lost somewhere in there and honestly don't think she nailed the explanation either. can you break down what the simple/complex distinction actually amounts to and give me a straight answer on whether it actually gets strong longtermism off the hook, or if its just relabeling the original problem?
