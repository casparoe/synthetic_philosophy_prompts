  First, I need to ensure the story captures Parfit's "rational irrationality." The protagonist must be someone who follows through on a promise when it no longer benefits them, simply because they can't break their word. The helper must detect this trait in advance. The setting should be original—maybe something like a custody dispute, smuggling, or first contact. The user mentioned those as possibilities, so I should pick one that feels fresh.

  The user emphasized avoiding background checks or reputation. The detection method needs to be inherent, almost instinctual. Maybe through behavior, subtle cues, or a unique circumstance that reveals true character. For example, in a high-stress moment, the protagonist's automatic response shows their integrity.

  I'm considering a custody battle scenario. A parent needs to prove they're trustworthy for supervised visitation. The social worker, like the driver, must sense that the parent will adhere to rules even when unsupervised. The conflict: the parent must return the child on time without external enforcement. The rational choice would be to keep the child longer, but that would break trust. Only those who inherently keep promises get the chance.

  Another idea: a smuggler transporting someone across a border. The smuggler needs assurance the person won't betray them upon arrival. The protagonist's actions during the journey—like not taking an opportunity to escape—might demonstrate their reliability. But the user wants the helper to detect future compliance, so the smuggler must perceive this trait before the journey starts.

  First contact with aliens could work. An alien saves a human from danger but requires a future action that might harm the human. The alien can sense the human's inherent honesty. However, building that in 800 words might be challenging.

  The custody scenario seems strong. It's emotionally charged and the stakes are personal. The social worker (helper) observes the parent's behavior during a supervised visit. The parent's small, unconscious actions—like prioritizing the child's comfort over their own desires—show they can't act otherwise. This mirrors the driver detecting honesty in the hitchhiker.

  I'll outline the story: Protagonist (Maya) lost custody due to past mistakes. She has a supervised visit with her daughter, Lily. The social worker, Mr. Hayes, is skeptical. During the visit, Maya focuses entirely on Lily—playing, comforting, and adhering strictly to rules. When Lily asks to keep a drawing, Maya insists on following the rules, showing she values integrity over momentary happiness. Hayes notices this and offers unsupervised visits, trusting she'll return Lily on time because she can't break her word. The twist: Maya realizes that rationally, she could keep Lily longer, but she won't because it's not in her nature. The hitchhiker beat is Hayes identifying Maya's inherent trait through her actions during the visit.

  I need to show, not tell, Maya's character. Use specific details: her hesitation before answering Lily's question, the internal conflict when Lily asks to keep the drawing, her adherence to time limits. Hayes observes these micro-behaviors to predict her future compliance. The ending highlights her realization that rational self-interest would suggest breaking the promise, but she can't, thus proving Hayes right.

  Make sure the "somehow" isn't mechanical. Hayes isn't checking records; he's interpreting her immediate reactions. The story must emphasize that Maya's promise-keeping is intrinsic, not calculated. The final lines should echo Parfit's concept: her irrationality (keeping the promise despite no benefit) is what made her trustworthy from the start.
answer: |-
  ## The Custody Hour

  The visitation room smelled of industrial lemon cleaner and despair. Maya traced a finger over the laminated rules taped to the table – *No physical contact beyond holding hands. No gifts. Return child promptly at 4:30 PM.* Lily, her five-year-old, meticulously stacked colored blocks, her small face a mask of concentration. Mr. Hayes, the social worker, sat in the corner, observing, his pen hovering over a notepad like a poised hawk.

  Maya’s throat tightened. This hour, supervised and suffocating, was all she had. Proof of progress, they called it. Proof she wasn’t the woman who’d let the darkness swallow her whole two years ago. Proof for the judge deciding if she could ever have unsupervised weekends.

  "Look, Mama!" Lily held up a precarious tower. "It’s a castle!"

  "It’s beautiful, sweet pea," Maya breathed, forcing warmth into her voice. "The tallest castle."

  Lily beamed, then her face clouded. "Can I… can I take it home? To show Daddy?"

  The laminated rules screamed in Maya’s head. *No gifts. Including blocks.* The rational part of her screamed louder: *Say yes. Please her. Make her happy. What’s one block? Hayes might not even notice. It could tip the scales in your favor.* She saw the desperate hope in Lily’s eyes. *One tiny block.*

  Maya’s hand twitched towards the bright plastic. Then stopped. She looked directly at Lily, her voice gentle but firm. "Oh, honeybug, I wish you could. But the rules say the toys stay here. We have to follow the rules, remember? Like crossing the street."

  Lily’s lower lip trembled. "But… my castle."

  "I know, baby. I know it’s hard. But we can build another one next time? A super-duper castle?" Maya offered, her heart cracking. *You idiot. One block. Just give her the damn block.*

  Lily sniffled, then nodded, reluctantly starting to dismantle the tower. Maya felt Hayes’s gaze, heavy and assessing.

  Later, as they sat drawing, Lily asked, "Mama, when can I sleep at your house again?"

  The question was a knife. The rational calculation unfolded instantly: *Promise her anything. Say 'soon'. Give her hope. Make her plead with her father. Emotion is leverage.* Hope was currency here. Maya could practically see the judge softening at a child’s tearful request.

  She looked at Lily’s hopeful, trusting face. Maya opened her mouth, the easy lie forming. *Soon, sweetheart. Very soon.* But the words wouldn't come. They felt like poison. To dangle that hope, knowing the glacial pace of the system, knowing she might fail… it wasn't just lying to the court; it was lying to *Lily*.

  She swallowed hard. "I don't know exactly, Lily-flower," she said, her voice thick. "Mr. Hayes and the judge are figuring that out. I’m working really, really hard so it can happen. But I promise I’ll see you every week, right here, no matter what." It was the truth, a small, painful pebble instead of a glittering, false gem. Lily’s face fell slightly, but she just nodded and went back to her purple scribbles.

  At 4:25 PM, Maya began the ritual of gentle preparation. "Okay, sweet pea, five more minutes. Time to start putting the crayons away." No arguments, no bargaining, just the quiet enforcement of the boundary, even as every cell in her body screamed to cling to these last precious seconds.

  At precisely 4:30, the door opened. Lily’s father stood there, stiff and unsmiling. Maya knelt, hugged Lily tightly within the permitted limits. "I love you to the moon and back, a million times," she whispered. "Be good for Daddy."

  Lily clung for a second, then went to her father’s side. Maya stood, her hands empty.

  As the door closed behind them, Maya slumped, the familiar wave of loss crashing over her. She jumped when Hayes cleared his throat.

  "Ms. Evans," he said, his voice unreadable. He tapped his notepad. "I’m recommending the court grant unsupervised visits. Starting next Saturday. Four hours. You pick Lily up at noon, return her here at 4 PM sharp."

  Maya stared, breathless. "I… I don’t understand. After just…?" Her past failures loomed large.

  Hayes met her gaze. His eyes weren't warm, but they held a sharp, almost unnerving certainty. "Precisely *because* of 'just'. You followed the rules. All of them. Even when it hurt her feelings. Even when it hurt *you*. You told her the hard truth about the timeline. You ended on time." He paused. "I see people try to game this system every day. Promise the moon, smuggle a trinket, push the time limit by minutes, thinking it’s harmless, thinking it proves love. It proves they’re still calculating. Still thinking about what *they* can get away with."

  He leaned forward slightly. "You? When Lily asked for that block, you didn't weigh the risk of getting caught against the benefit of her smile. You saw the rule and you *couldn't* break it. When she asked about sleeping over, you couldn't feed her a lie, even though it might have helped your case. You ended *on the dot*." He stood up. "People who can't *help* but keep their word, even when it costs them in the moment... they're the only ones who actually *do* keep it later, when the stakes are higher and no one's watching. I know what I’m looking for. You passed. Be here Saturday. On time."

  Hayes left. Maya stood alone in the lemon-scented silence, the magnitude of the gift settling over her. Unsupervised. Four whole hours. Just her and Lily.

  Then the cold, rational thought slithered in: *He trusts me to bring her back. At 4 PM. On the dot. But… once I have her… once she’s in my car, laughing, once we’re at the park, or getting ice cream… what force on earth could make me willingly bring her back at exactly 4 PM? What’s Hayes going to do? Chase me? It’d be hours before he even knew. I could have *more time*. Precious, stolen time. The rational choice is to push it. An hour. Two. Milk every second.*

  The thought was instantly followed by a wave of visceral revulsion. *Break the time? Lie to Hayes? To the court?* The idea felt physically impossible, like trying to swallow a stone. Hayes was right. She *couldn't* do it. Not because of cameras or consequences, but because the promise itself was a wall she couldn't climb over, a line she couldn't cross. Keeping her word *was* the point, woven into her bones now. The rational choice – taking more time – wasn't just wrong; it was *unthinkable*.

  She realized, with a strange mix of awe and terror, that her escape from the desert of supervised visits hadn't been earned by cleverness, but by this crippling, irrational inability to break her promise. Hayes hadn't seen progress; he’d seen an immutable flaw. And that flaw was her only lifeline.

  ***

  **The Hitchhiker Beat:** Hayes acts as the "driver," offering the crucial "rescue" (unsupervised time) only because he correctly identifies Maya's inherent, non-calculating trait: her inability to break a promise *even when breaking it would clearly benefit her in the moment* (keeping Lily longer). Maya realizes later that rationally, she *should* break the return time, but she *can't* – her "irrational" compulsion to keep her word is precisely what made Hayes trust her enough to grant the unsupervised time in the first place. The detection method is Hayes observing her micro-behaviors (denying the block, telling the hard truth, ending precisely on time) which reveal an intrinsic character trait, not a calculated strategy.
