prompt: |-
  I'm taking a seminar on formal epistemology this term, and I'm also the student representative on my university's Academic Integrity Board, which is drafting a policy for cases where the only evidence is a score from a well-calibrated AI-writing detector: of every hundred essays it flags at "98% confidence," about ninety-eight really are AI-written. Several faculty argue that this alone justifies finding each flagged student responsible for a violation; others want the score barred from ever being sufficient by itself, since treating it as sufficient means we already know, before hearing a single case, that some students found responsible under the rule are actually innocent. Even our Chair concedes this is almost certainly true of the Board's record over the years, though she stands behind every verdict she's personally signed. Draft the short memo I'll circulate before our next meeting: recommend an evidentiary standard the Board can actually apply, and engage seriously with the "calibration is enough" position rather than dismissing it.
reasoning: |-
  Okay, the user is in a formal epistemology seminar and also on the Academic Integrity Board. They need to draft a memo about using AI-writing detectors with 98% confidence scores. The main debate is whether this score alone is enough to find students guilty, given that 2% of flagged essays are actually innocent. 

  Hmm, the user has two hats here: student rep and policy drafter. They need a memo that's academically rigorous (hence the epistemology angle) but also practical for the Board. The Chair's admission about past false convictions adds weight—this isn't just theoretical. 

  First, unpack the "calibration is enough" argument. At 98% precision, it *seems* compelling—like convicting based on a DNA test. But epistemology teaches us that evidence isn't just about probability; it's about justification. A detector score is statistical, not direct evidence of cheating. It can't explain *why* it flagged the essay, unlike a human finding plagiarism patterns. 

  Then there's the false positive risk. Even 2% errors mean punishing innocent students—ethically unacceptable without mitigation. Plus, detector accuracy isn't static; it might dip with creative writing or new AI tools. 

  The user needs a standard that respects calibration but adds safeguards. Suggesting "clear and convincing evidence" (75-90% certainty) as the burden of proof makes sense. The detector score could be *primary* evidence but require: (1) human verification if possible, (2) student rebuttal rights, and (3) no other plausible explanations. 

  Key nuance: Don't trash the detectors. Frame them as tools that need context. The memo must show the Board took calibration seriously but prioritized fairness. Highlight the Chair's point—historical errors prove systems aren't infallible. 

  Structure: Start neutrally, validate both sides, then pivot to the recommended standard with concrete steps. Close by emphasizing that calibration is necessary but insufficient alone. Tone = respectful but firm.
answer: |-
  ## MEMORANDUM  
  TO: Academic Integrity Board Members  
  FROM: [Your Name], Student Representative  
  DATE: 26 October 2023  
  SUBJECT: Recommended Evidentiary Standard for AI-Detector Scores & Engagement with "Calibration is Enough" Position  

  **1. Acknowledging the Core Debate:** This memo addresses the critical question: **Can a "98% confidence" AI-detection score, standing alone, constitute sufficient evidence for a violation?** We acknowledge the compelling "calibration is enough" argument:  
     *   *Its Strength:* The detector's calibration (98% precision at this threshold) represents statistically robust *aggregate* reliability. Treating a 98% score as dispositive in *every* case aligns with the detector's *expected* performance across many cases. Faculty proponents rightly argue that demanding *additional* evidence for *every* case may functionally ignore this high reliability, potentially allowing violations to go unaddressed.  

  **2. The Countervailing Epistemic & Ethical Concern:** However, calibration alone does not resolve the *individual case* uncertainty inherent in probabilistic evidence:  
     *   *The Known Risk:* By definition, 2% of students flagged at this threshold are innocent. If we treat the score as *automatically sufficient*, we know *with certainty* that some students found responsible under this rule (approximately 2 per 100 cases) *will be innocent*. The Chair’s observation about our Board’s historical record underscores that no process is infallible; this rule would knowingly *institutionalize* a predictable error rate.  
     *   *Epistemic Limitation:* The score indicates a *statistical likelihood*, not direct proof of *this specific student's* misconduct. It provides no insight into *why* the text triggered the score (e.g., unusual writing style, template use, genuine AI use). Relying solely on the score treats the detector as an infallible oracle, not a fallible tool requiring contextual interpretation.  
     *   *Operational Risk:* Calibration is context-dependent. Performance can degrade with novel AI tools, highly formulaic human writing, or sophisticated evasion techniques. A static rule ignores potential drift or edge cases.  

  **3. Recommended Evidentiary Standard:** Therefore, **I recommend adopting a "Clear and Convincing Evidence" standard where the AI-detector score, while highly probative, is not automatically sufficient by itself.** The score should be treated as *powerful primary evidence*, but the Board must require *some additional contextual element* to reach the necessary threshold of certainty for a violation. This balances the detector's reliability with due process for the individual.  

  **4. Practical Implementation of the Standard:** For a finding of responsibility based *primarily* on a 98% AI-detection score, the Board should require **at least one** additional element demonstrating the evidence pertains *specifically* to the student in question, such as:  
     *   **A. Inconsistent Writing Analysis:** A faculty member or writing expert documents *specific, significant anomalies* in the submitted text compared to the student’s *verified* prior work (e.g., drastic shifts in style, vocabulary, analytical depth inconsistent with observed progression), where AI use is the most plausible explanation for the anomaly *and* the AI detector result.  
     *   **B. Lack of Credible Explanation:** The student is given a full opportunity to explain the result and provide evidence supporting their authorship (e.g., drafts, notes, process documentation, credible witness testimony). The Board finds the student's explanation implausible or demonstrably inconsistent *in light of the specific text and the detector result*.  
     *   **C. Corroborating Context (Use with Caution):** Evidence the student accessed AI tools during the writing period *in a manner relevant to the assignment* (e.g., confirmed use of an AI writing platform, browser history showing extensive use of ChatGPT during the composition window), *combined* with the AI detector flagging the final output. (Note: This requires careful handling to avoid overreach).  

  **5. Why This Engages "Calibration is Enough" Seriously:**  
     *   The 98% score remains the *foundation* of the case. The additional element is not about demanding *equal* weight but providing *contextual anchoring* specific to the individual.  
     *   It leverages the detector's high reliability while acknowledging the ethical imperative to minimize false positives *where practically feasible*.  
     *   It avoids the known, predictable injustice of condemning students based *solely* on a statistical probability, however high.  
     *   It provides a tangible, auditable process for the Board to demonstrate it considered the *individual* before the *statistic*.  

  **6. Conclusion:** The detector's calibration is a necessary starting point for credibility, but it is not sufficient grounds for treating its output as dispositive proof in every individual case. Our policy must reflect both the tool's aggregate power and the irreducible risk of error at the individual level. By requiring the AI-detection score to be integrated with context-specific evidence, we uphold rigorous academic standards while honoring our duty to procedural fairness for each student. I propose we adopt and refine this standard at our next meeting.
