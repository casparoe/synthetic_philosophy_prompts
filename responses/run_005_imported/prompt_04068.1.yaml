  In other words, the practical reason to cooperate is not a reason that the agent can act on; it is already settled by her disposition (as encoded in S). The decision process is just a formality and does not actually provide new information or reasons.

  **Rebuttal of the ECL Defender's Reply:**

  The ECL defender says: the logical correlation is direct and not screened off by S because S does not include the output. The objector replies: but S determines the output, so conditioning on S fixes the output. The defender says: but the agent doesn't know the output until she decides. The objector counters: then she can simulate the decision process to determine the output. If she does, she will see that the decision process (which is part of S) will output a particular action. So she can know in advance. If she cannot simulate due to computational limitations, then she must rely on the decision algorithm. But the decision algorithm, if it is EDT, will compute:

