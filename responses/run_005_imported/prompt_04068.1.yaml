  Let:
  - A = Alice's action (cooperate or defect)
  - B = Bob's action
  - S = the source code (which is the same for both) and the inputs (which we assume are symmetric and known)

  Because the source code is deterministic and identical, A and B are both deterministic functions of S. Therefore, once S is fixed, A and B are fixed. So:

    P(B | A, S) = P(B | S)

  because given S, A is determined and B is determined, and A doesn't add any information about B beyond S.

  Therefore, when Alice is deciding, she conditions on S (which she knows). Then, the expected utility of an action A is:

    EU(A) = \sum_{outcomes} U(outcome) * P(outcome | A, S)

  But in the prisoner's dilemma, the outcome depends on both A and B. However, because P(B | A, S) = P(B | S), we have:

    P(outcome | A, S) = P(B | A, S) * [indicator for outcome given A and B] = P(B | S) * [indicator]

  But note: given S, B is fixed. So P(B | S) is either 1 or 0 for a particular B. Therefore, the expected utility of A is just the utility of (A, B(S)), where B(S) is the action that Bob takes given S.

  But wait: because Alice and Bob have the same source code and inputs, and the situation is symmetric, then whatever action Alice takes, Bob will take the same action? Not exactly: the source code is identical and the inputs are symmetric, so the output (action) should be the same. So if Alice cooperates, then Bob must cooperate, and if Alice defects, Bob defects. But note: this is because the source code and inputs determine the action. So if the source code is such that it produces cooperation in this situation, then both will cooperate, regardless of what Alice "chooses" in her deliberation? This seems to conflict with the idea of decision.

  **The Crux: Decision in a Deterministic System**

  In a deterministic system, the agent's action is fixed by S. So how can we even talk about conditioning on an action? This is the old problem of "what if I do something else?" in deterministic settings.

  EDT typically handles this by considering counterfactual conditioning: we imagine the agent sets her action to a particular value, and then updates the probabilities of other nodes accordingly. In causal models, we do an intervention. But EDT does evidential conditioning.

