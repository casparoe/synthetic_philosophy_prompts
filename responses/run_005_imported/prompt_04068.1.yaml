  The objector's screening-off argument said: condition on S, then A doesn't provide additional evidence about B. But in the logical decision theory approach, we are not conditioning on S in the sense of holding fixed the entire state (including the output). Instead, we are considering counterfactuals about the output. In these counterfactuals, we change the output and then update Bob's output accordingly because of the logical tie.

  Therefore, the correlation between A and B is not screened off by S because S (the source code) is what establishes the logical tie. But in the counterfactual, we are changing the output of S for Alice, and by logical necessity, that implies a change in the output of S for Bob.

