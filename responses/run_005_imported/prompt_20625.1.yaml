  The key point is that Fitch's result is general. It doesn't specify which propositions are unknowable. It only shows that if there's an unknown truth, then the anti-realist position is inconsistent. The unknowable proposition in the proof is a specific construction: a conjunction of an unknown truth and the fact that it's unknown. But this proposition is constructed from the existence of some unknown truth. It doesn't point to particular areas like consciousness. The friend is interpreting the paradox as revealing specific metaphysical truths, but the proof itself doesn't support that.

  Also, the friend claims this provides a non-empirical demonstration of substantive facts beyond our grasp. However, Fitch's Paradox is a logical result about the incompatibility between universal knowability and the existence of unknown truths. It doesn't provide information about what those truths are. The unknowability arises from the logical structure itself, not from any inherent property of the facts. So, while it shows that some truths must be unknowable if not all are known, it doesn't tell us anything about their nature or subject matter.

  The user's unease likely stems from the friend overextending the theorem. The proof doesn't license targeted pessimism about specific open questions. Instead, it's a broader logical point. The friend's examples like consciousness are her own interpretations, not derived from the paradox. The theorem is neutral on what the unknown truths are; they could be mundane facts, not necessarily profound metaphysical ones.

