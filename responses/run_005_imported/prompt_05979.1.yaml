prompt: |-
  Had a long, kind of heated argument with my friend last night that I still can't stop turning over. It started over whether a genuinely selfish person -- someone who just does not care, at any level, about anyone else's wellbeing -- has any reason at all to keep a promise or help a stranger. My friend's basically a Williams-style internalist about it: if nothing in the guy's own motivational set could get him to do it via sound deliberation, then it's just flat out false that he has a reason to, and moralizing at him is confused. I wanted to say there's still a reason there that he's failing to respond to, but I couldn't get the argument straight against her.

  Could you write me a dialogue between a Williams-style internalist and an externalist in the spirit of McDowell or Korsgaard, hashing this out properly? No strawmanning -- the internalist should use the actual S/D apparatus (including the ways sound deliberation can expand S, like new information or imaginitive vividness), and the externalist needs to actually land the objection that 'sound' deliberation is already smuggling in standards that don't reduce to the agent's existing desires. Ground it in one concrete case instead of staying abstract -- Williams' Owen Wingrave example would be perfect, or something similarly specific you invent. I want them really responding to each other's moves, not just restating their own view, and don't force some tidy resolution at the end.
