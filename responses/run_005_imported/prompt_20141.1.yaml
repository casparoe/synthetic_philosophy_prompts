prompt: |-
  Ok so this is a weird one, but I'm hoping you can help me actually sound coherent before Thursday's meeting. I sit on the benefits committee at the mid-size company I work for. We self-insure our health plan, so whenever the plan's medical director denies something unusual, it lands on a little volunteer committee (five of us, nobody with any medical or philosophy background, me included) to decide the appeal. We've been stuck on the same case for two meetings running and I told everyone I'd write up an actual recommendation before we meet again.

  Here's the case: an employee got a letter from a longevity-medicine doctor prescribing her low-dose rapamycin off-label, explicitly to slow down her biological aging, and she's asking us to cover it. Our medical director denied it flat out — her reasoning was basically "aging isn't a diagnosis, it's not a disease, there's nothing here for insurance to treat," which sounded totally obvious to me too, until my sister sent me some podcast clip about this stuff and I fell down a rabbit hole reading about how philosophers of medicine actually argue about what even makes something count as a disease in the first place, and now I'm a lot less sure and kind of annoyed about it. Apparently there's a whole camp (I think the name attached to it is Boorse?) that says disease is basically just a biological/statistical fact — a body part or process counts as diseased if its functioning below whats typical for your "reference class," which is like your species, sex, AND age group all together. But then I read further and realized that actually cuts against our medical director, not for her: if you're only ever comparing a 70 year old to other 70 year olds, completely textbook aging can never count as a disease under that theory, no matter how much it wrecks someone's body, since everyone that age is declining "on schedule" by definition. Then apparently there's a whole other camp that says that's backwards — that whether something's a disease was never just a biological fact to begin with, it always sneaks in a judgment about whether the state is bad for the person who has it, and if that's right then something making our employee measurably worse off should maybe count for something regardless of how common it is, and "well, everybody ages" stops being an actual answer.

  I don't need a philosophy lecture, I need the actual memo. Can you draft the short recommendation I'm bringing to committee — it has to land on a real decision (approve the coverage, deny it, or approve it as some kind of limited pilot with specific conditions attached), give a rough timeframe for when we'd revisit it, and whichever way it comes down, it needs to seriously engage with the losing argument instead of just waving at "aging is natural" or "well, everybody declines eventually," since that hand-wave is exactly what's had us stuck for two meetings already.
reasoning: |-
  Okay, the user is on a benefits committee at a mid-sized company that self-insures its health plan. They're stuck on an appeal case where an employee wants coverage for low-dose rapamycin prescribed off-label to slow aging. The medical director denied it because aging isn't a disease. The user has done some research into philosophy of medicine and found arguments that challenge that view. Now they need help drafting a coherent recommendation memo for their committee meeting.

  Hmm, this is a complex situation. The user needs to make a practical decision but wants to avoid superficial reasoning. They've clearly dug into the philosophical debate between naturalist (Boorse) and normativist views of disease - which is impressive given their non-medical background. 

  The core tension here is between:
  - The medical director's position (aging = natural process, not disease)
  - Emerging science suggesting aging might be treatable
  - Philosophical frameworks that could support classifying aging as a "disease" under certain definitions

  I notice the user is frustrated - they started thinking the denial was obvious, then got confused by the philosophy, and now feel stuck. They need clarity, not more academic debate. The memo must balance practical insurance considerations with intellectual honesty about the definitional questions.

  Key points to address:
  - Off-label use is common but insurers can set coverage policies
  - Limited evidence for rapamycin in longevity (mostly animal studies)
  - Precedent risk - if they cover this, what about other anti-aging interventions?
  - But also: if something measurably prevents decline, is that inherently valuable?

  The recommendation should probably lean toward denial but with more nuance than "aging is natural." Maybe a compromise position? Like suggesting they revisit when human trials mature? That shows openness without setting a risky precedent now.

  The user's real need seems to be: "Help me make this decision in a way that feels intellectually honest and gets my committee unstuck." They want to acknowledge the complexity while reaching a workable business decision.
answer: |-
  Here’s a concise, decision-focused memo draft that engages with the core philosophical tension while providing actionable guidance:

  ---

  **TO:** Benefits Committee  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation: Appeal for Off-Label Rapamycin Coverage (Employee #[ID])  

  ### Proposed Decision
  **Deny coverage at this time, but establish a formal review trigger tied to clinical trial milestones (e.g., Phase 3 human longevity trial completion), with reassessment by [Date: 12-18 months from now].**

  ### Key Reasoning
  1. **Medical Director’s Position (Naturalist View):**  
     Aging is not a pathology but a universal biological process. Insuring against universal/normative decline fundamentally alters the purpose of health coverage (treating *abnormal* conditions). Approving this could set untenable precedent (e.g., demands for other unproven "enhancements").  

  2. **Appellant’s Position (Normativist View):**  
     If a condition causes harm (e.g., age-related decline), and treatment mitigates it, "naturalness" alone is insufficient grounds for denial. Emerging science suggests biological aging *is* modifiable.  

  3. **Committee’s Balancing Act:**  
     - **Evidence Gap:** Current rapamycin longevity data lacks robust human clinical outcomes (reliant on biomarkers/mouse studies).  
     - **Practical Impact:** Covering off-label interventions without strong evidence risks diverting funds from proven care.  
     - **Philosophical Middle Path:** We acknowledge normativist concerns—if aging *causes* diseases (cancer, dementia), preventing it *could* align with insurance goals. **However, absent human efficacy data, approval now conflates *potential* with *treatable pathology*.**  

  ### Conditions for Future Review
  Approve coverage only if **ONE** of these occurs by our reassessment date ([Date]):  
  - FDA approval of rapamycin (or analogous mTOR inhibitor) for longevity/aging-related indications.  
  - Publication of Phase 3 clinical trial data demonstrating statistically significant reduction in **age-related morbidity/mortality** (not just biomarkers) in humans.  
  - *Alternatively:* Commission an independent actuarial analysis of cost/benefit if pilot coverage is later reconsidered.  

  ### Why This Path?
  - **Avoids Stalemate:** Directly addresses both "aging isn’t a disease" (by requiring pathology-specific evidence) and "harm matters" (by creating a pathway if evidence emerges).  
  - **Time-Bound:** Prevents indefinite limbo; review in 12-18 months aligns with expected research timelines.  
  - **Precedent Management:** Demands evidence parity with covered treatments (e.g., statins for primary prevention) without opening floodgates.  

  --- 

  ### Key Strengths for Your Committee Discussion:
  - **For Normativist Skeptics:** Explicitly ties coverage to *disease prevention* (reducing age-linked pathologies), not "treating aging."  
  - **For Naturalist Skeptics:** Concedes that "universal" processes can become insurable if proven to *cause preventable disease*.  
  - **Practical Off-Ramp:** If evidence remains weak in 12-18 months, denial stands firmly. If breakthroughs occur, we revisit ethically.  

  This cuts through the "is aging a disease?" loop by focusing on **insurability standards** (evidence of preventable harm) rather than ontological debates. It’s defensible to auditors, empathetic to the employee, and forces the committee toward evidence-based action.
