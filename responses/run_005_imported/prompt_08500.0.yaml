prompt: |-
  So this semester I'm taking a research methods class for my psych major, and last week we spent basically a whole lecture on Simpson's paradox -- my professor's big line was that the paradox doesn't actually get "solved" by crunching more numbers, it gets solved by figuring out the causal story behind why the groups differ in the first place, which I'm still chewing on. Anyway, I ended up arguing about this with my roommate last night because it turns out to be extremely relevant to something happening on the Learning Support Advisory Committee, which I sit on as the student rep.

  Here's the situation: the committee has to decide by next Tuesday whether to renew, expand, or cut funding (about $80k/year) for our college's Supplemental Instruction (SI) program, where upperclassmen run extra study sessions attached to specific gateway courses. The provost's office gave us the pass-rate data, and depending on how you slice it, it tells opposite stories. Overall, across the whole student body, kids who went to SI passed their course at about 77% (347/450) vs about 86% (475/550) for non-attendees -- so on paper SI attendees do worse, and two committee members want to kill the program over this. But broken down by course it flips: in Calc I, SI attendees passed at 75% (300/400) vs 65% (65/100) for non-attendees, and in Intro Psych, SI attendees passed at 94% (47/50) vs about 91% (410/450) for non-attendees -- SI attendees do better in both courses individually. The reversal happens because SI attendance is way more concentrated in Calc I (which has a much lower baseline pass rate for everybody, SI or not) than in Psych. Our committee chair pointed this out and wants to expand SI, but the member who wants to cut it says breaking the data down by course just lets us keep slicing it until we land on whatever story we already wanted, and that the trustees are only ever gonna ask about the topline number anyway.

  I have to actually write the one-page recommendation memo for Tuesday, and I dont want to just yell "Simpson's paradox!" and call it a day -- I want it to seriously engage with the "you're just cherry-picking your slice" objection, since it kind of nags at me too even though I suspect it's wrong here. Could you draft that memo for me: a clear recommendation with a timeline for how we'd check it's actually working, and reasoning solid enough that it'd definately survive being read out loud to the one committee member who thinks this is all statistical sleight of hand?
reasoning: |-
  Okay, the user is a psychology major dealing with a real-world application of Simpson's paradox in their role on a Learning Support Advisory Committee. They need to draft a recommendation memo about funding a Supplemental Instruction (SI) program. The data shows conflicting results: overall, SI attendees have a lower pass rate, but when broken down by course, they perform better in both Calc I and Intro Psych. The user's challenge is to address the "cherry-picking" objection convincingly while providing a solid rationale for their recommendation.

  First, I need to recall what Simpson's paradox is. It occurs when a trend appears in different groups but disappears or reverses when combined. Here, the overall data shows SI attendees with a 77% pass rate versus 86% for non-attendees. But when split by course, Calc I shows 75% vs. 65%, and Intro Psych shows 94% vs. 91%. The paradox happens because more students attend SI in Calc I, which has a lower baseline pass rate. So the aggregated data is misleading because it doesn't account for the different course difficulties.

  The user's professor emphasized that solving the paradox isn't about more data but understanding the causal story. So the memo needs to explain why the groups differ. Here, students self-select into SI, likely based on perceived need. In Calc I, where the course is harder, more students attend SI, including those struggling. In Intro Psych, fewer attend, possibly those who need extra help or are highly motivated. The overall numbers get skewed because Calc I's lower pass rates drag down the SI attendees' average.

  The main objection is that breaking down by course is cherry-picking. The committee member argues that slicing data can support any narrative. To counter this, the memo should explain why course-level analysis is essential here. Courses have different baseline pass rates; ignoring that confounds the results. It's not arbitrary slicing—it's adjusting for a key variable (course difficulty) that affects outcomes. The aggregated data hides this confounding effect.

  The user also needs a recommendation and a plan to verify the program's effectiveness. The data suggests SI helps in both courses, especially Calc I, where the pass rate difference is significant (75% vs. 65%). So recommending expansion makes sense. But to address the cherry-picking concern, proposing a controlled evaluation plan is crucial. Suggest random assignment or quasi-experimental methods to measure SI's causal impact. Including a timeline for this evaluation shows proactive steps to validate the program beyond current data.

  The memo must be concise, one page, and withstand scrutiny from skeptical committee members. Emphasizing that the course breakdown isn't manipulation but necessary adjustment for a confounder is key. Highlighting that trustees might focus on top-line numbers but that deeper analysis reveals the true story. Also, pointing out that cutting SI based on flawed aggregates could harm students, especially in Calc I where SI shows a 10% boost.

  Lastly, the user's deeper need is to present a logically sound argument that bridges statistical theory with practical decision-making. They want to ensure their recommendation is defensible and actionable, preventing the program from being cut due to misinterpreted data. Providing clear steps for future evaluation addresses long-term accountability, showing that the committee isn't just trusting correlations but seeking causal evidence.
answer: |-
  ## MEMORANDUM  
  **TO:** Learning Support Advisory Committee  
  **FROM:** [Your Name], Student Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Supplemental Instruction (SI) Program Funding & Evaluation  

  **RECOMMENDATION:** **Renew and expand funding for the Supplemental Instruction (SI) program**, with an immediate focus on high-risk courses like Calc I, coupled with a robust 12-month evaluation plan to establish causal efficacy (detailed below).  

  ### 1. Addressing the Conflicting Data & "Cherry-Picking" Objection  
  The apparent contradiction in pass rates (overall disadvantage for SI attendees vs. advantage within each course) is a textbook case of **Simpson’s Paradox**. This occurs when a lurking variable distorts aggregate data. Here, **course selection and baseline difficulty** are the critical confounding factors:  

  *   **Calc I** has a **low baseline pass rate** (≈68% overall: (300+65)/500 = 73%? Wait, let's recalculate: 300 SI passed + 65 non-SI passed = 365 passed. Total students: 400 SI + 100 non-SI = 500. Pass rate: 365/500 = 73%. Non-SI alone: 65/100 = 65%. SI alone: 300/400 = 75%. Overall ≈73% pass).  
  *   **Intro Psych** has a **high baseline pass rate** (≈92% overall: (47+410)/500 = 457/500 = 91.4%).  
  *   **Crucially, SI participation is heavily skewed:** 400/450 (89%) of SI attendees are in the *harder* course (Calc I), while only 100/550 (18%) of non-attendees are in Calc I.  

  **Why disaggregating by course is NOT cherry-picking, but essential:**  
  *   **The Confounder:** Course difficulty fundamentally impacts pass probability. Ignoring it combines apples (struggling Calc students) and oranges (thriving Psych students).  
  *   **Self-Selection Bias:** Students *choose* to attend SI, typically those perceiving greater need. The aggregate data reflects that SI attracts students in harder courses *and* potentially those already struggling within those courses. It does **not** measure the *effect* of SI.  
  *   **The Paradox Resolved:** Within each *comparable group* (same course), SI attendees performed *better*:  
      *   **Calc I:** +10% pass rate (75% vs 65%)  
      *   **Intro Psych:** +3% pass rate (94% vs 91%)  
  *   **The Aggregate Illusion:** The lower overall SI pass rate (77% vs 86%) is an artifact of SI being overwhelmingly used in the course where *everyone* (attendee or not) is more likely to fail. Cutting SI based on this aggregate risks eliminating a program that demonstrably *improves* outcomes for students in our most challenging courses.  

  **Addressing "Trustees Only Care About Topline":** We serve students best by making decisions based on *accurate understanding*, not misleading aggregates. Our recommendation includes a plan to *generate* a compelling topline metric (see Section 3). Defending a program requires explaining *why* the data looks contradictory – trustees deserve that rigor.  

  ### 2. Why Expand, Not Just Renew?  
  *   **Significant Impact in High-Risk Course:** The +10% pass rate in Calc I is substantial. With 400 attendees, this suggests SI helped ~40 additional students pass Calc I who otherwise might not have.  
  *   **Underutilization in Psych:** While the absolute gain is smaller (+3%), the high pass rate suggests SI may be reaching only the most at-risk Psych students. Expanding outreach here could yield further gains.  
  *   **Scalability:** SI is a relatively low-cost, high-impact peer support model. Success in Calc I suggests potential in other high-failure gateway courses (e.g., Gen Chem, Organic Chem, Statistics).  

  ### 3. Evaluation Plan: Establishing Causal Efficacy & Generating Clear Metrics (Timeline: 12 Months)  
  To move beyond correlation and address concerns about self-selection bias definitively, we propose:  

  1.  **Immediate (Semester 1 - [Next Semester]):**  
      *   **Stratified Tracking:** Mandate detailed tracking for *all* core SI-linked courses: Pass/Fail, SI attendance (frequency), prior GPA, major (STEM/non-STEM), demographics (if permissible).  
      *   **Quasi-Experimental Analysis:** Partner with Institutional Research to employ **Propensity Score Matching (PSM)**. This statistically matches SI attendees with non-attendees *of similar prior academic standing* (GPA, relevant pre-req grades) *within the same course*. This directly isolates the SI effect by comparing like-with-like.  
      *   **Student Surveys:** Gather data on *why* students attend/don't attend SI (perceived need, schedule, awareness).  

  2.  **Semester 2:**  
      *   **Refine & Expand:** Apply PSM analysis to full dataset from Semester 1. Pilot SI in 1-2 new high-risk courses (e.g., Gen Chem).  
      *   **Develop "Adjusted" Success Metric:** Create a program-level metric incorporating course difficulty and student preparation (e.g., "SI Boost" = Avg. pass rate difference within matched pairs across courses).  

  3.  **Month 12 (Reporting):**  
      *   **Final Causal Report:** Present PSM results quantifying the average causal effect of SI attendance on pass rates, controlling for prior achievement and course.  
      *   **Clear Topline Metric:** Report the "SI Boost" alongside overall participation and pass rates *within* key courses.  
      *   **Recommendation:** Based on causal evidence, recommend continuation, expansion to specific new courses, modification, or discontinuation.  

  ### Conclusion  
  The aggregate data is dangerously misleading due to Simpson’s Paradox. Disaggregation by course is not cherry-picking; it is essential to account for the critical confounding factor of course difficulty and self-selection. The course-level data provides strong evidence that SI *improves* pass rates, particularly in our highest-risk courses like Calc I. Cutting funding based on the flawed aggregate would harm students relying on this vital support.  

  We recommend **renewing and strategically expanding the SI program** while immediately implementing a rigorous 12-month evaluation using Propensity Score Matching to establish its *causal impact* and generate unambiguous metrics for future decision-making and trustee reporting. This approach addresses the current paradox, counters objections rigorously, and ensures data-driven stewardship of resources.  

  **Recommended Vote:** Approve renewal + expansion funding; Approve the 12-month evaluation plan.
