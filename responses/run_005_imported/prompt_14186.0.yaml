   The hole argument, as presented by Earman and Norton, leads to an indeterminism dilemma for manifold substantivalism: if spacetime points are real and exist independently of the metric, then the equations of general relativity seem to underdetermine the metric field because we can have two solutions that agree everywhere outside a hole (a region without matter) but differ inside, even though they are related by a diffeomorphism. This is taken to be a form of indeterminism.

