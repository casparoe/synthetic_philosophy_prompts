   (c) Maudlin's metric essentialism: Each spacetime point has its metrical properties essentially. Thus, if we change the metric at a point, we are not talking about the same point anymore. This blocks the hole argument by making the metric properties necessary to the identity of the point.
   (d) Melia's strategy: Rejects the conceptions of determinism used by Earman-Norton and Butterfield, and proposes an alternative that blocks the argument.
   (e) Dasgupta's skeptical diagnosis: Argues that even the anti-haecceitist move is problematic because it relies on an obscure notion of identity. He pushes a "no individuals" metaphysics, which denies that we need to talk about the identity of spacetime points at all.

