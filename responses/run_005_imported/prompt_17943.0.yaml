  ### Key Insights:
  1. **IIA is most commonly sacrificed** because systems like IRV, Borda Count, or even approval voting inherently use full preference orders to break ties, accepting that candidate C can sway A vs B outcomes. This mirrors your hack week scenario.
  2. **Unrestricted Domain** is frequently restricted in practice (e.g., limiting project pitches to align with company goals) to avoid cyclic preferences.
  3. **Pareto violations** are rare by design – systems that allow them (e.g., some quota-based methods) face legitimacy crises.
  4. **Non-dictatorship** is the "last resort" sacrifice – only justifiable in efficiency-focused hierarchies, not collective ranking.
