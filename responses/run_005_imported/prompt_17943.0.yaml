prompt: |-
  Ok this has been living in my head rent free for like two weeks now lol. At my company we do this quarterly "hack week" thing where anyone can pitch a side project, and then the whole eng org votes by ranking their top 5 pitches, and we merge everyone's individual rankings into one master list that decides which projects actually get engineering time. This last round there was a whole drama because the final ranking felt "wrong" to a bunch of people even though nobody did anything shady with the process, and a friend of mine who has an econ background (I'm just a backend dev so this was all new to me) said that's basically unavoidable because of Arrow's impossibility theorem — apparently there's an actual proof that no ranked voting system with 3+ options can satisfy unrestricted domain, Pareto efficiency, independence of irrelevant alternatives (IIA), and non-dictatorship all at the same time, no matter how clever you are about designing it.

  I went and read up on it and I get the general shape of the proof now, but the thing I cant wrap my head around is which of these four conditions real-world systems actually end up sacrificing in practice, and whether some are "safer" to give up than others. Like obviously nobody wants to just admit "ok fine, we have a dictator" (or... do some systems basically do exactly that, on purpose?), but I don't have good intuitions for the other three. So can you rank Arrow's four conditions from "most reasonable to sacrifice if you need a workable real-world voting/ranking system" down to "least reasonable to sacrifice"? For each one give me 1-2 sentences on why it lands where it does, and if you can, name an actual real or semi-real voting method/governance system that effectively gives up that specific condition (bonus points if it's something a software person would recognize). Please don't just tell me "it depends" across the board — I want your actual best-guess ordering. Format it as a JSON block like this so I can paste it straight into my notes:

  ```json
  {
    "ranking": [
      {"condition": "...", "reason": "...", "example": "..."},
      ...
    ]
  }
  ```

  with the first entry being the easiest condition to sacrifice and the last one being the hardest.
reasoning: |-
  We are asked to rank Arrow's four conditions from "most reasonable to sacrifice" to "least reasonable to sacrifice" in the context of real-world voting systems. The conditions are:
  1. Unrestricted domain: Voters can have any preference ordering over the alternatives.
  2. Pareto efficiency: If every voter prefers alternative A over alternative B, then the group must prefer A over B.
  3. Independence of irrelevant alternatives (IIA): The group preference between A and B should depend only on the individual preferences between A and B, not on preferences about a third alternative C.
  4. Non-dictatorship: There is no single voter whose preference always determines the group's preference.

  We must provide a ranking (as a JSON array) with the first element being the easiest to sacrifice and the last the hardest. For each, we give a reason and an example.

  Reasoning:

  - The condition that is most commonly sacrificed in real-world systems is IIA. Many voting methods (like Borda count, instant-runoff voting) do not satisfy IIA. The reason is that IIA is a very strong condition and in practice, we often want to consider the entire preference ordering to break cycles or find a compromise. Sacrificing IIA might lead to some paradoxical outcomes (like the spoiler effect) but it is often accepted for the sake of having a more expressive system.

  - Next, unrestricted domain might be sacrificed by restricting the type of preferences allowed (e.g., single-peaked preferences). This is sometimes acceptable in controlled environments (like within a company) where preferences might be naturally aligned. However, in a general election, it is harder to justify.

  - Pareto efficiency is a very basic condition that seems fundamental. If everyone agrees that A is better than B, then the system should reflect that. Sacrificing it would be very counter-intuitive and could lead to outcomes that are clearly against the will of the entire electorate. Thus, it is harder to sacrifice.

  - Non-dictatorship is the condition that is least reasonable to sacrifice because having a dictator is the antithesis of a fair voting system. In a democratic context, giving up non-dictatorship would mean that one person decides everything, which is unacceptable.

  However, note that in some non-democratic systems (like a company with a CEO having final say) one might accept a dictator. But in the context of a voting system that aims to be fair, non-dictatorship is essential.

  Therefore, the ranking from easiest to hardest to sacrifice:

  1. IIA (Independence of irrelevant alternatives) - because many common systems (like Borda count, IRV) violate it and we accept that to get more nuanced information about preferences. Example: Instant-runoff voting (IRV) used in some elections (e.g., Australian House of Representatives) can violate IIA.

  2. Unrestricted domain - by assuming that preferences are single-peaked (which often holds in practice) we can avoid some impossibility results. Example: The median voter theorem in political science assumes single-peaked preferences and leads to stable outcomes.

  3. Pareto efficiency - it is a minimal requirement for collective rationality. If everyone prefers A over B, then B should not be chosen. Example: It's hard to find a real system that intentionally violates Pareto efficiency because it would be seen as irrational. However, some systems might do so inadvertently due to strategic voting or complex rules, but not by design.

  4. Non-dictatorship - because having a dictator is the opposite of a fair voting system. Example: A system where the CEO has the final say (like in some corporate settings) effectively gives up non-dictatorship, but that's not a democratic system.

  But note: Arrow's theorem states that we must sacrifice at least one. In practice, the most common sacrifice is IIA.

