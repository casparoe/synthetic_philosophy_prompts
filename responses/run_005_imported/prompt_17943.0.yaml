  3. Pareto efficiency
  4. Non-dictatorship

  Examples:

  - IIA: Borda count (used in some private organizations and competitions) violates IIA. Also, IRV (used in some political elections) can violate IIA.

  - Unrestricted domain: The median voter system (theoretical) or any system that requires preferences to be single-peaked. In practice, some voting systems are designed under the assumption of single-peakedness (like the Black system, which is a Condorcet method that uses the median if preferences are single-peaked).

  - Pareto efficiency: Violations are rare by design, but note that some systems might have a "status quo" bias that could lead to Pareto inefficiencies. However, I cannot think of a real system that intentionally violates it. So, we might say that in practice, systems try to satisfy Pareto efficiency. But note: Arrow's theorem doesn't say that Pareto efficiency must be violated, only that one of the four must be. So we are ranking by how reasonable it is to sacrifice.

  - Non-dictatorship: Any system where one person has absolute power (e.g., a dictatorship, or a monarch, or a CEO with veto power). But in a voting system intended to be fair, this is unacceptable.

