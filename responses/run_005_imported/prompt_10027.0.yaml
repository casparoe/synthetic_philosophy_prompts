prompt: |-
  Ok so I had this whole argument with my friend last night about superrationality (the Hofstadter idea that two "ideal" reasoners will cooperate in a one-shot prisoner's dilemma just because they know they'll both reach the same conclusion). She says its basically cheating -- defection dominates no matter what the other guy does, so the second you let "well, they'll think what I think" change your move, you've quietly thrown out dominance reasoning without admitting it. I tried to argue that the real move is noticing your choice is correlated with theirs even with zero causal link between you, so treating the two choices as independent (which is what makes dominance reasoning valid in the first place) is the actual mistake here, but I couldn't make that rigorous on the spot and now I'm not 100% sure I even believe it. Can you lay out the strongest version of this argument, whether superrationality can actually be defended without it basically collapsing into evidential decision theory, and how much weight it puts on the two agents being near-identical vs just "similar enough"?
