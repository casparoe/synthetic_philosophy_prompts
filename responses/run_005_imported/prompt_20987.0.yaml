  I'm a physician on my national shooting federation's therapeutic-use-exemption (TUE) panel -- sports really do have these, I didn't know until I got roped into it. Current case: one of our best young pistol shooters has documented panic disorder and a mild hand tremor, diagnosed years before she ever picked up a gun, and her doctor wants to start her on propranolol. Problem is propranolol's banned in this sport precisely because it slows the heart and steadies the hand, which is more or less the entire skill being tested. The rule we're suppose to apply says a TUE is fine as long as the drug doesn't give more benefit than simply returning the athlete to normal healthy functioning -- but here "normal healthy functioning" and "the thing the sport measures" are the same variable, so the rule can't actually seperate therapy from enhancement in her case. Meanwhile, I happen to know half the string section of every major orchestra pops the same pill before auditions and nobody blinks. Some panel members want to grant it quietly and worry about precedent later; others think it's a backdoor to legalized doping for anyone with a sympathetic diagnosis. I have to circulate our written ruling before her qualifier in 8 weeks -- can you draft it (grant, deny, or grant-with-conditions), with reasoning stated plainly enough that a rejected athlete's lawyer could actually engage with it, and an honest account of the strongest argument against whichever way you land?
reasoning: |-
  We are facing a dilemma where the therapeutic use of a banned substance (propranolol) for a legitimate medical condition (panic disorder with hand tremor) overlaps with the core skill being tested in the sport (steady hand and controlled heart rate). The TUE rule requires that the medication should not provide more benefit than returning the athlete to "normal healthy functioning". However, in this case, the athlete's "normal healthy functioning" without the medication includes a tremor that impairs her ability to perform the sport. Thus, treating her condition would simultaneously restore her to a baseline without the tremor and improve her performance.

  The strongest argument for granting the TUE:
  - The athlete has a documented pre-existing condition (panic disorder and tremor) that is unrelated to her sport participation. 
  - Propranolol is a standard treatment for this condition and is necessary for her general health and well-being.
  - Without treatment, she would be at a competitive disadvantage due to her medical condition. 
  - The rule's intent is to allow necessary medical treatment without providing an unfair advantage. Here, the treatment would only bring her to a level playing field (i.e., without the tremor) that she would have if she did not have the condition.

  The strongest argument against granting the TUE:
  - The substance is banned precisely because it enhances performance by steadying the hand and reducing heart rate, which are the core skills of pistol shooting.
  - Granting a TUE in this case blurs the line between therapy and enhancement because the treatment directly improves the exact function that the sport measures. 
  - It sets a precedent that could allow athletes with similar conditions (or even self-reported conditions) to use performance-enhancing drugs under the guise of therapy.

  Given the complexity, a middle-ground approach might be to grant the TUE with conditions. However, the rules require that the TUE should not provide an advantage beyond restoring normal function. Since the athlete's "normal" without the condition is not something she has ever had (as the tremor is chronic and pre-existing), we must define "normal" as the state of a healthy individual without the medical condition. 

  But note: the athlete has never been without the tremor since before she started the sport. Therefore, the treatment would not restore her to a state she previously had in the sport, but rather to a state that she would have if she didn't have the condition. This is a critical point.

  Alternative: We might consider whether there are non-banned alternatives for treating her condition. However, the physician has proposed propranolol, which is a standard first-line treatment for essential tremor and panic disorder. Other beta-blockers are also banned in shooting sports (as they have similar effects). Non-beta-blocker alternatives for tremor (like primidone) might be considered, but they may not be as effective and may have side effects. For panic disorder, SSRIs are first-line but do not address tremor. Thus, propranolol might be the most appropriate treatment.

  Given the above, I propose to deny the TUE. The reasoning is that the substance is banned because of its performance-enhancing effect on the core skill of the sport, and the TUE criteria require that the treatment does not enhance performance beyond normal health. In this case, because the core skill being measured (steady hand) is the same as the symptom being treated, the use of propranolol would provide a competitive advantage relative to other athletes who do not have the condition (and thus do not require medication to achieve a steady hand). 

  However, this decision must be made with careful consideration and clear reasoning. We must also consider the athlete's health and well-being. Therefore, we should encourage her to seek alternative treatments that are not banned and that do not enhance performance.

  Draft of the ruling:

  ---

  **Therapeutic Use Exemption (TUE) Decision**

  **Athlete:** [Name]
  **Sport:** Pistol Shooting
  **Medication:** Propranolol
  **Condition:** Panic Disorder with Mild Hand Tremor

  **Decision:** Denied

  **Reasoning:**

  1. **Medical Condition and Treatment:** The athlete has a documented history of panic disorder and mild hand tremor, diagnosed prior to her involvement in the sport. The requested medication, propranolol, is a beta-blocker that is commonly prescribed for these conditions. The TUE Panel acknowledges the legitimacy of the diagnosis and the therapeutic need for treatment.

  2. **Prohibited Substance:** Propranolol is listed on the World Anti-Doping Agency (WADA) Prohibited List under the category of "Beta-Blockers" and is banned in-competition for the sport of shooting. This ban is in place because beta-blockers are known to reduce heart rate and tremors, which are core elements of performance in shooting sports.

  3. **TUE Criteria Analysis:** The TUE criteria require that:
     a. The athlete has a diagnosed medical condition that requires treatment with a prohibited substance.
     b. The therapeutic use of the substance will not produce significant enhancement of performance beyond the athlete's normal state of health.
     c. There is no reasonable permitted therapeutic alternative.
     d. The necessity for the use of the prohibited substance is not a consequence of prior non-therapeutic use.

     The Panel finds that criteria (a) and (d) are satisfied. However, criteria (b) and (c) are not met.

     - **Criterion (b):** The Panel recognizes that the athlete's "normal state of health" without treatment includes a hand tremor that impairs her ability to perform. However, the use of propranolol would not merely restore her to a level of normal functioning that is typical for a healthy athlete without the condition. Instead, it would suppress the tremor and lower her heart rate, which are the very skills that the sport measures. Thus, the medication would provide a competitive advantage relative to other athletes who do not have the condition and do not require medication. The Panel finds that the substance would enhance performance beyond simply restoring normal health because the core skill of the sport is the ability to control tremor and heart rate naturally. The athlete's condition, which causes tremor, is a disadvantage in the sport. Treating it with a banned substance that directly targets the core skill would confer an advantage that other athletes do not have.

     - **Criterion (c):** The Panel notes that there are alternative treatments for panic disorder and essential tremor that are not prohibited. For panic disorder, first-line treatments include selective serotonin reuptake inhibitors (SSRIs) and cognitive behavioral therapy. For essential tremor, alternatives such as primidone, gabapentin, or topiramate may be considered. While propranolol is a standard treatment, the existence of non-prohibited alternatives (even if less effective or with different side effect profiles) means that the athlete and her physician should explore these options before resorting to a prohibited substance.

  4. **Precedent and Fairness:** The Panel is concerned about setting a precedent that would allow athletes to use banned substances that directly enhance performance under the guise of treating a condition. Granting a TUE in this case could open the door to athletes seeking similar exemptions for conditions that are common and for which beta-blockers are prescribed, thereby undermining the level playing field.

  5. **Strongest Counterargument Considered:** The Panel acknowledges the argument that without treatment, the athlete is at a competitive disadvantage due to her medical condition, and that the treatment would only allow her to compete at the level she would have without the condition. However, the Panel concludes that the sport inherently tests the natural ability to control hand steadiness and heart rate. The use of a substance that artificially controls these factors, even for therapeutic reasons, provides an advantage that is not available to athletes without the condition and who must rely solely on natural ability and training.

  **Conclusion:** The TUE for propranolol is denied. The athlete is advised to work with her physician to explore non-prohibited treatment options for her condition. The Panel emphasizes that this decision is based on the specific circumstances and the nature of the sport, and it does not preclude the athlete from reapplying for a TUE if non-prohibited alternatives are tried and found to be ineffective, or if new medical evidence emerges.

  **Timeline for Appeal:** The athlete has the right to appeal this decision within 21 days to [appropriate appellate body].

  ---

  This ruling denies the TUE but leaves open the possibility of reconsideration if non-prohibited alternatives fail. It also provides a clear and honest account of the reasoning, including the strongest counterargument. The decision is based on the specific criteria of the TUE rules and the nature of the sport.
