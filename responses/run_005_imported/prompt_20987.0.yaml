  ### Therapeutic Use Exemption (TUE) Ruling: Denial  
  **Athlete:** [Name Redacted]  
  **Sport:** Pistol Shooting  
  **Medication:** Propranolol  
  **Condition:** Documented Panic Disorder with Mild Hand Tremor  

  #### Decision:  
  **TUE DENIED.**  

  #### Plain-Language Reasoning:  
  1. **Core Conflict with Sport-Specific Rules:**  
     Propranolol is banned in shooting sports because it directly suppresses heart rate and minimizes tremor—precisely the physical variables that define competitive performance. The sport tests an athlete’s *natural* ability to control these factors under pressure. While you have a legitimate medical need for propranolol, its effects overlap entirely with the skill being measured. Administering it would not merely treat your condition; it would artificially enhance the core performance metric the sport exists to evaluate.  

  2. **TUE Standard Not Met:**  
     The TUE criteria require that a medication must **only restore normal health without providing a competitive advantage**. Here, "normal health" (absence of tremor/panic) and "competitive performance" (steady aim) are identical. Granting this TUE would:  
     - **Fail the "no enhancement" test:** Even if propranolol only neutralizes your tremor, it gives you an advantage relative to athletes who *naturally* experience stress-induced tremor during competition.  
     - **Blur therapy and enhancement:** Your "baseline" without medication includes a tremor that impairs shooting. Propranolol would create a *new* baseline (steady hands) that other athletes achieve solely through training/psychology. This violates the rule’s intent.  

  3. **Feasible Alternatives Exist:**  
     Non-banned treatments for panic disorder/tremor are available (e.g., SSRIs, CBT, exposure therapy). While propranolol is effective, it is not the *only* option. We cannot approve a banned substance when permitted alternatives remain unexplored.  

  4. **Precedent Risk:**  
     Granting this TUE would incentivize athletes to seek diagnoses for conditions responsive to beta-blockers. Shooting sports could face widespread "diagnosis doping," undermining fair competition.  

  ---

  ### Strongest Argument Against This Decision (Acknowledged & Addressed):  
  **"This penalizes an athlete for a pre-existing disability. Without propranolol, her condition unfairly hinders her ability to compete, and the TUE would level the playing field."**  
  - **Counter:** We recognize this argument’s moral weight. However, competitive fairness requires consistency: *all* athletes must cope with natural variations in tremor/stress without medication. Allowing propranolol would give you an artificial edge by mitigating a disadvantage that others must overcome intrinsically. The sport’s rules explicitly prioritize natural performance over medical normalization in such cases.  

  ---

  ### Conditions for Future Consideration:  
  If non-banned treatments fail after documented trials:  
  1. Submit evidence of attempted therapies (e.g., 3+ months of CBT/SSRIs with no tremor reduction).  
  2. Provide peer-reviewed literature demonstrating that propranolol is the *only* viable option for your specific physiology.  
  3. Proposal for dosage limits (e.g., ≤20mg) to minimize performance impact.  

  ---

  ### Why This Ruling Is Transparent & Legally Engageable:  
  - **Clear Test Applied:** We distinguish between "health" (treating panic) and "performance" (steady aim). Propranolol’s mechanism fails this test.  
  - **Precedent Clarified:** Denial hinges on the **unique overlap** between your condition’s symptoms and the sport’s measured skill. This does not apply to non-performance-linked conditions (e.g., asthma).  
  - **Documentation Pathway:** Outlines concrete steps for appeal/reapplication.  

  ---  
  *Approved by [National Shooting Federation] TUE Panel on [Date].  
  Appeals must be filed within 21 days with [Governing Body].*  

  ### Addendum: Orchestras vs. Sports Context  
  *You raised orchestras—here’s why that analogy fails:*  
  - Music performances prioritize artistic output, not biological metrics (e.g., heart rate). Shooting sports *objectively measure* physical steadiness.  
  - Anti-doping rules exist solely to protect sport integrity, not artistic expression.  

  This ruling prioritizes competitive fairness but urges your physician to pursue non-banned options. We recognize this is difficult—but the integrity of the sport demands consistency.
