  Check the tiers: S for Turing (strongest), A for confluence, B for Gandy, C for no counterexamples, D for physical. Make sure explanations are concise but informative. Avoid technical jargon where possible, but since it's a philosophy seminar, some terms are necessary. Also, note that Gandy's argument is less known but still respected in certain circles, whereas physical CTT is contentious. 

