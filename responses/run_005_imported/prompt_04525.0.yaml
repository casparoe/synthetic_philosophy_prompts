answer: |-
  The gas lamps hissed like disapproving librarians as Professor Silas Thorne adjusted his spectacles. The air in Mrs. Ainsley’s parlour hung thick with the cloying scent of lilies and damp wool. Around the heavy oak table sat the usual assortment: Colonel Briggs, red-faced and expectant; Miss Havisham, her knuckles white on her lace handkerchief; and Thorne himself, notebook open, pencil poised – the skeptic praying for a miracle.

  *Another Thursday,* Thorne thought, the worn phrase echoing in his mind. Nineteen years of Thursdays, give or take. Nineteen years chasing whispers in the dark, hoping to find the keystone that would bridge the terrifying chasm his own intellect had opened. *The dualism of practical reason.* The words were etched onto his soul, colder than any séance table. Why be good, truly good, sacrificing self utterly for the greater whole, if the universe offered no guarantee of ultimate reconciliation? If death was simply… annihilation? Only proof, *empirical* proof, of survival – of a moral order persisting beyond the veil – could suture that wound. So he sat, year after year, the merciless logician holding a trembling vigil for hope.

  Mrs. Ainsley, draped in enough violet silk to upholster a small chaise longue, dimmed the lamps. Darkness pooled, thick and velvet. The only sounds were the Colonel’s asthmatic breathing and the frantic scribbling of Thorne’s pencil as he noted the room’s dimensions, the position of the sitters, the distance to the cabinet.

  “Spirit friends,” Mrs. Ainsley intoned, her voice dropping an octave into practiced reverence, “we seek communion. Make yourselves known to those gathered in faith.”

  Silence. Thorne strained his ears. He catalogued the mundane: the creak of the house settling, a distant carriage wheel on cobbles, the Colonel’s wheeze. He was listening *through* the silence, dissecting it for anomalies, for the faintest tremor of the impossible.

  A rap. Sharp, distinct, on the table leg near Miss Havisham.

  *Possible.* Thorne noted the location. Mrs. Ainsley’s hands were visible, resting palms down on the tablecloth. Miss Havisham flinched, a small gasp escaping her.

  “Arthur? Is that you, dear Arthur?” Miss Havisham whispered, her voice thick.

  Two raps. *Yes.*

  Thorne’s pencil moved: *Raps – lower table leg, subject’s left. Source indeterminate. Emotional priming high.* Hope, a treacherous warmth, flickered in his chest. *Could it?* His rational self instantly doused it. Joints expanding with temperature change? A clever manipulation of musculature by the medium? He’d exposed the Creery sisters’ toe-tapping code, hadn’t he? He’d *needed* to expose it. Only by eliminating the false could the true emerge.

  A cold breeze, inexplicable, stirred the hair at Thorne’s temple. He shivered, not from the chill, but from the fierce internal clash. His senses screamed *artifact* – a hidden draft, a bellows perhaps? Yet his heart, that stubborn, yearning organ, whispered: *Draft? From where? Check the windows later. Note the sensation.*

  Mrs. Ainsley moaned softly. “A presence… strong… near the cabinet.” The small, curtained enclosure beside her seemed to pulse in the gloom.

  A faint, phosphorescent glow appeared behind the curtains – a wispy, indeterminate shape. Miss Havisham sobbed quietly. The Colonel grunted approval.

  Thorne’s eyes, adapted to the dark, scanned the edges of the cabinet curtain. *Luminescent paint? Chemical reaction?* His mind raced through possibilities, a grim inventory of deception. He leaned forward slightly, his gaze sharp as a scalpel, searching for the tell-tale tremor of a wire, the glint of a hidden mirror. He *wanted* to find the trick. Finding the trick proved his rigor, proved he wasn’t a credulous fool. And if he found no trick…?

  The glow intensified, forming a vague, shimmering column. A voice, thin and ethereal, breathed from within the cabinet: “Beatrice…”

  Miss Havisham cried out, “Mother!”

  The voice continued, a murmur about forgiveness and peace. Generic platitudes, Thorne noted grimly. Phrases easily gleaned from a grieving daughter’s earlier conversations. Yet the *delivery*… the unnatural resonance, the seeming lack of origin point… It gnawed at him.

  His skepticism was a fortress, but hope was the relentless sapper at its gates. He pictured Sidgwick, weary but unyielding, sitting through countless such performances, the famous mercilessness a shield against despair as much as credulity. To debunk was not to destroy faith, but to refine the search. Each exposed fraud was a step *closer* to the genuine article – if it existed. *It must exist. Else the Cosmos remains Chaos.*

  The voice faded. The glow dimmed. The cold draft vanished as suddenly as it came. Mrs. Ainsley sagged in her chair, breathing heavily. “They… withdraw,” she gasped. “The connection weakens.”

  The lamps were turned up. Blinking in the sudden light, the room seemed smaller, dingier. The lilies smelled overpowering. Miss Havisham wept quietly into her handkerchief, comforted by the Colonel. Mrs. Ainsley accepted a glass of water, avoiding Thorne’s eyes.

  He closed his notebook. His usual post-séance routine began: checking the cabinet (finding only bare wood and a faint smell of ozone), examining the table leg (no obvious mechanism), feeling along the wall near where the draft occurred (a hairline crack near the wainscoting, perhaps?). He questioned Mrs. Ainsley gently but persistently about her sensations, her control. Her answers were vague, tinged with defensiveness.

  Walking home through the fog-cloaked London streets, the cold seeped into his bones. The rational dissection was complete: the raps easily faked, the draft explainable, the voice likely ventriloquism enhanced by suggestion, the glow a known trick of chemistry. Another Thursday, another failure. Decades of effort yielding only dust and disappointment. Sidgwick’s final judgment echoed in his mind: *largely wasted effort.*

  He reached his dim study, the weight of years pressing down. He opened his notebook to the final page, the pencil lead hovering over the blank space reserved for conclusions. He saw the meticulous notes: *Draft source plausible. Glow technique suspected. Voice content generic.* Standard debunking. Routine.

  But then his finger traced back up the page, to his own scribbled note in the margin, made in the thick of the cold draft’s touch: *Simultaneous chill – left temple ONLY. Contralateral to draft source?*

  A tiny anomaly. Insignificant, probably. A trick of perception, a stray current of air deflected. Easily dismissed. He *should* dismiss it. His entire philosophy demanded it.

  Professor Silas Thorne closed the notebook. He did not write a conclusion. He placed the book carefully on the crowded shelf beside its identical predecessors, a library of meticulously documented doubt. He poured a small measure of brandy, the glass trembling slightly in his hand.

  The fire in the grate had died to embers. In the silent, fading glow, he stared not at the flames, but at the empty chair opposite. The question, vast and unanswerable, hung in the air, colder and more persistent than any séance draft. It wasn't about the raps, the voice, or the glow. It was about the terrifying silence of the universe, and the fragile, persistent echo of his own hope resonating within it. He took a slow sip, the warmth a fleeting comfort against the chill of the unsolved equation. The notebook on the shelf held no answers. Only the question remained, glowing faintly in the dark, as stubborn and unexplained as a single, anomalous point of cold on a philosopher's temple.
