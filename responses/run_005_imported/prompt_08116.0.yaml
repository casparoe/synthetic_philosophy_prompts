prompt: |-
  Quick request -- I'm putting together the handout for next week's grad seminar on dispositions, right before we hit the Lewis and Johnston readings, and I want something that gets people arguing before they've even done the reading closely. Write me a dialogue, maybe set at the whiteboard after class, between two philosophers who are both genuinely sharp on this: one thinks the conditional analysis of dispositions can still be rescued -- knows Lewis's reformed version cold, the move where the intrinsic basis has to persist through to just after the stimulus, and is willing to bite some bullets to keep it -- and the other has basically given up on analyzing dispositions conditionally at all after finks and masks, and just treats dispositions as primitive, full stop. I want them actually engaging with each others examples -- the electro-fink wire, the styrofoam-packed wine glass, throw in an antidote case if it helps -- not just each restating their own view. Really want the primitivist leaning hard on whether the reformed analysis is anything more than an ad hoc patch that a determined critic can always beat with one more counterexample. Dont need it resolved, just make sure neither one is a pushover.
