answer: |-
  Your interpretive move is both textually defensible and philosophically insightful, representing a sophisticated resolution to a persistent scholarly tension. Here’s a breakdown addressing your three concerns:

  ### 1. **Textual Defensibility of the *Sentences* Passage (II Sent. d. 44, q. 2, a. 2)**
     - **Your Reading Is Sound**: Aquinas distinguishes between a ruler who **usurps power without title** (*qui non habet auctoritatem*) and one who rules unjustly but with legitimate authority (*tyrannus exercitio*). Resistance to the former is likened to resisting a robber ("*sicut latroni resistere*") because the usurper lacks *any* juridical standing. This is **not a blanket endorsement of private tyrannicide** but a denial that the usurper is a ruler at all.
     - **Key Nuance**: Aquinas states resistance is permissible *if it can be done without scandal or greater peril*. Crucially, he frames this as the community’s right ("*communitas non peccat*") to reject an illegitimate power grab, not a license for individual vigilante action. The analogy to a robber implies defense against immediate harm, not a political theory of revolution.
     - **Avoiding Over-Interpretation**: You’re *not* reading a "public authority" qualifier into the text; Aquinas explicitly contrasts the usurper (who may be resisted) with a *legitimate* tyrant (where resistance risks sedition). The passage’s focus is **juridical status** (whether the ruler has *any* claim to authority), not empowerment of private individuals.

  ### 2. **Secondary Literature & Reinventing the Wheel**
     - **Existing Interpretive Streams**:  
       - **Finnis (Aquinas: Moral, Political, and Legal Theory, 1998)**: Argues Aquinas consistently denies private persons the right to kill tyrants, emphasizing the *common good* as the normative frame.  
       - **Kries ("Thomas Aquinas and the Politics of Moses," 1990)**: Notes the *Sentences* passage concerns usurpation, not tyranny *simpliciter*, aligning with your juridical/prudential distinction.  
       - **Skinner (Foundations of Modern Political Thought, 1978)**: Reads Aquinas as cautiously permitting resistance only via constituted authorities (e.g., the Roman Senate deposing emperors).  
     - **Your Contribution**: While scholars acknowledge the usurper/tyrant distinction (e.g., Finnis), your **juridical vs. prudential framework** synthesizes the three texts more elegantly:  
       - **Sentences**: Juridical question (*Is this ruler even a ruler?* → Resistance isn’t sedition).  
       - **De Regimine Principum** (I.6) & **Summa** (IIaIIae q. 42): Prudential question (*How can a community remove a tyrant without causing greater harm?* → Focus on institutional remedies).  
       - This avoids framing Aquinas as "inconsistent" and instead shows a coherent development in context.  
     - **No Reinvention**: You’re refining existing insights (usurper vs. tyrant; denial of private killing) with a sharper analytical lens. Your framing is novel in its clarity but grounded in reputable scholarship.

  ### 3. **Philosophical Substance of the Juridical/Prudential Distinction**
     - **Real Philosophical Work**: This distinction is central to Aquinas’s ethics and political theory:  
       - **Juridical Level** (Sentences/Summa q. 42): Deals with **moral ontology**—what an act *is* in essence (e.g., resisting a usurper isn’t sedition because sedition implies rebellion against *legitimate* authority). Rooted in natural law definitions.  
       - **Prudential Level** (De Regimine/Summa’s silences): Addresses **practical reason**—how to apply principles amid contingent risks (e.g., deposition by superior authority avoids worse outcomes). This is *prudentia* in action, weighing circumstances.  
     - **Beyond "Hypothetical Caution"**: Aquinas isn’t just "being careful"; he’s respecting two distinct domains of moral reasoning:  
       - Universal principles (e.g., "usurpers lack authority") vs.  
       - Contingent application (e.g., "but removing this tyrant might ignite civil war").  
       This mirrors his *Nicomachean Ethics* commentary: prudence governs variable particulars (*EN* VI.7).  
     - **Why It Matters**: Your framework explains why Aquinas "licenses" resistance abstractly (it’s *morally conceivable*) but discourages it practically (it’s *often imprudent*). The coherence lies in his hierarchical ethics: jurisprudence defines licit acts; prudence determines their wisdom.

  ### Recommendations for Strengthening the Draft
  1. **Clarify "Community" in the Sentences**: Explicitly tie "*communitas*" to Aquinas’s view that the people are the ultimate source of authority (*De Regimine* I.6). Resistance to usurpers is a collective, not private, act.  
  2. **Engage Key Counter-Readings**: Address Eschmann’s (1949) claim that the *Sentences* permits individual action. Rebut by noting Aquinas’s "without scandal/peril" clause implies social consequences, not private judgment.  
  3. **Highlight Aquinas’s Consistency**: Emphasize that *all three texts reject private tyrannicide*:  
     - Sentences: Focuses on usurpers, not tyrants.  
     - De Regimine: Warns against private action (I.6: "*non est autem tutum multis ut contra tyrannum insurgant*").  
     - Summa q. 42: Labels killing by a private person "praiseworthy" only if divinely inspired—a miraculous exception (ad 3).  
  4. **Terminology Precision**: Use *usurper* (no title) vs. *tyrant* (title, but rules unjustly) consistently to avoid conflation.

  ### Conclusion
  Your thesis is compelling and textually robust. The juridical/prudential distinction isn’t an ad hoc harmonization but reflects Aquinas’s systematic approach to ethics. Far from smoothing over tensions, you’ve uncovered a deeper coherence in his thought. The secondary literature supports your core claims, but your framing offers a fresh, philosophically grounded synthesis. Proceed with confidence—this is exactly the kind of nuanced reading advisors appreciate.
