prompt: |-
  Ok so I do Lincoln-Douglas debate and the veil of ignorance + difference principle combo is basically our go-to framework for distributive justice cases, but at practice last week our coach brought up this part of Rawls that pretty much nobody on our circuit ever reads, called the "just savings principle." Apparently behind the veil you're also not supposed to know which GENERATION you're born into, not just your class or talents or whatever, and that's supposed to be the basis for how much a generation is allowed to consume now vs. how much it owes to the future. This kind of broke my brain because with the normal veil of ignorance you can at least imagine getting unlucky and ending up poor, and picture what it'd be like to trade places with someone — but you literally cannot trade places with, or compensate, a person who won't exist for another 150 years, so I'm not sure how the whole "fairness" logic even carries over.

  Could you write me a short story (maybe 1000-1500 words, doesn't need a bow tied on the ending) that actually dramatizes this instead of just explaining it? Like say the founding council of a generation ship or some long-horizon colony has to hammer out its charter from behind something like this generational veil — and I want the disagreement to feel real, not everyone-agrees-to-be-nice. Have one character push back that the difference principle is supposed to be about maximizing the position of the worst-off group, and ask why that has to mean the worst-off group alive right now instead of some worse-off generation ten generations down the line, and have someone else point out that Rawls's whole case for the cautious maximin rule over just betting on average utility depends on not being able to trust any probabilities behind the veil — so what happens to that argument once the "gamble" is spread across time instead of across people who all exist at once. I don't need the story to resolve it, i just want the dilemma to feel like something that would actually stump our practice round, not a fable with the moral spelled out at the end.
