answer: |-
  ## Demarcating the Demos: Subjection, Not Affection, as the Foundational Principle

  The "boundary problem" strikes at the very heart of democratic legitimacy. If democracy requires that "the people" rule, but the composition of "the people" must be decided *before* any democratic procedure can commence, we face an apparently irresolvable paradox: a logical circularity that seems to render all subsequent democratic acts suspect. While Robert Goodin's "all-affected interests" principle (AAI) offers an intuitively appealing solution, it ultimately founders on vagueness, impracticality, and vulnerability to the "tourist and toddler" objection. Arash Abizadeh's "all-subjected to law" principle (ASL), grounded in the coercive nature of political authority, provides a far more robust, defensible, and operationally feasible foundation for demarcating the demos. It is this principle we should embrace, even as we refine it to address practical concerns.

  **The All-Affected Interests Principle: An Appealing but Flawed Foundation**
  Goodin's AAI principle asserts that "everyone whose interests are affected by a decision should have a right to a say in that decision." Its strength lies in its moral breadth and intuitive fairness: if a policy profoundly impacts individuals beyond a state's borders (e.g., climate change, trade wars, military interventions), why *shouldn't* they have a voice? It directly tackles the problem of externalities and avoids the arbitrariness of existing territorial boundaries. AAI seems to demand a truly cosmopolitan demos for truly global issues.

  However, AAI suffers from fatal flaws:
  1.  **Boundless Over-Inclusiveness:** The principle implodes under the weight of causal chains. *Every* decision has potential ripple effects. A tax hike in France might affect a tourist contemplating a visit (reduced spending), a supplier in Vietnam (reduced demand for goods), or future generations inheriting the national debt. Taken literally, AAI demands universal suffrage for virtually every decision, dissolving the very concept of a bounded demos necessary for functional decision-making. Goodin attempts rescue operations (e.g., focusing on "urgent" or "foreseeable" effects), but these are inherently contestable and lack a clear stopping point.
  2.  **The Tourist and Toddler Objection:** AAI technically enfranchises anyone minimally affected, including transient tourists (affected by local laws during their stay) and infants (affected by education, healthcare, and inheritance policies). While proponents might argue this merely reveals our unjustified biases, it starkly highlights AAI's disconnect from the practical realities and intuitive understandings of political agency required for a functioning polity. Granting toddlers voting rights is nonsensical; granting them to tourists based on fleeting exposure is administratively chaotic and undermines the notion of a *membership* in a political community.
  3.  **Operational Impossibility:** Identifying *all* affected individuals for every decision, determining the *degree* of effect required for inclusion, and practically enabling their participation is logistically impossible. AAI risks paralysis or, more likely, arbitrary limitation in practice, reintroducing the boundary problem it sought to solve.

  **The All-Subjected to Law Principle: Coercion as the Core Criterion**
  Abizadeh's ASL principle argues that the demos must include all those who are *subject to the coercive power* of the state. The core justification is democratic legitimacy itself: if the state imposes binding laws backed by force on individuals, those individuals must have a voice in authorizing that coercion to avoid being ruled without consent. This grounds membership not in vague "interests" but in the direct experience of political power. As Abizadeh emphasizes regarding borders, border controls are coercive acts *imposed* on non-citizens; therefore, their imposition requires democratic justification *by* those subjected to them, meaning the demos cannot be presupposed as bounded by the very borders it coercively controls.

  ASL offers significant advantages:
  1.  **Conceptual Clarity and Non-Circularity:** Subjection to coercion provides a *relatively* clear, observable criterion. Are you liable to be fined, imprisoned, or otherwise compelled by the state's legal apparatus? If yes, you belong in the demos authorizing that apparatus. This avoids the infinite regress of AAI. The act of coercion *defines* the relationship necessitating democratic justification.
  2.  **Practical Feasibility:** Identifying who is subject to a state's jurisdiction (e.g., residing within its territory, operating under its laws) is a core function of existing legal and administrative systems. While residency determination has complexities, it is fundamentally more manageable than mapping global "affected interests."
  3.  **Addressing the Core Legitimacy Deficit:** ASL directly targets the primary source of democratic illegitimacy: being governed without consent. It focuses on the *relationship of power* between ruler and ruled, ensuring that those coerced are the authors of the coercion.
  4.  **Mitigating the Tourist/Toddler Objection (Partially):**
      *   **Tourists:** ASL *does* technically include tourists, as they are subject to criminal law, traffic regulations, etc., during their stay. However, this points towards a necessary refinement: **duration and centrality of subjection.** While a tourist *is* subjected, it is typically temporary and peripheral to their life. The core ASL principle suggests a pathway: **permanent residency or habitual abode** as a proxy for *ongoing, comprehensive subjection* to the state's coercive framework. Tourists are subject *temporarily*; citizens and permanent residents are subject *pervasively and enduringly*. This justifies a residency requirement within the ASL framework, focusing on those whose lives are fundamentally structured by the state's laws.
      *   **Children:** The toddler objection misunderstands the nature of political exclusion. Excluding children isn't a denial that they are *subjected* (they clearly are), but a recognition based on **presumed competence and capacity for political agency**. Democratic theory universally acknowledges that suffrage requires a minimum capacity for judgment and autonomy. This is a separate, secondary filter *applied after* the primary criterion of subjection. We exclude children not because they aren't subjected, but because we deem them incapable of exercising the franchise responsibly *at that time*. The ASL principle identifies the *pool* (the subjected); competence requirements determine *eligibility within that pool*. This is conceptually distinct from AAI's problem of potentially including affected but non-subjected entities (like foreign corporations or distant future generations).

  **Defending ASL as Foundational: Beyond Mere Practicality**
  Choosing ASL over AAI is not merely a pragmatic concession. It is philosophically superior because it correctly identifies the *source* of the legitimacy problem: coercion. Democracy is fundamentally a system for legitimizing the use of coercive political power. Therefore, the group entitled to authorize that coercion *must* be coextensive with the group upon whom it is exercised. AAI, by focusing on interests, risks diluting the core political relationship into a general calculus of welfare impacts, losing sight of the specific *authority* relationship that demands justification.

  Abizadeh's application to borders powerfully demonstrates ASL's critical bite. If the demos is defined *only* by those already inside coercively maintained borders, then the imposition of borders themselves escapes democratic scrutiny by those most directly coerced by them (those seeking entry). ASL demands that border regimes be justifiable to those subjected to their force, necessitating either a global demos for border policy (impractical) or mechanisms for input from those seeking entry (a radical but coherent implication).

  **Conclusion: Subjection as the Bedrock**
  The boundary problem cannot be wished away, but it can be coherently addressed. Goodin's All-Affected Interests principle, while morally expansive, proves conceptually boundless, operationally impossible, and vulnerable to reductio ad absurdum via the tourist and toddler objection. Abizadeh's All-Subjected to Law principle, grounded in the imperative to legitimize state coercion, provides a clearer, more defensible, and practically workable foundation. By defining the demos as all those *pervasively and enduringly subject* to the state's coercive legal order (typically established via residency), ASL directly tackles the core legitimacy deficit. While competence-based exclusions (like for children) remain necessary and distinct, and while the inclusion of temporary visitors highlights the need for a "pervasive subjection" refinement, ASL alone successfully navigates the circularity by rooting membership in the very condition – subjection to rule – that democracy exists to justify. It is this principle, demanding that the coerced authorize the coercion, that should define the boundaries of the democratic people. The alternative is either arbitrary exclusion or democratic dissolution.
