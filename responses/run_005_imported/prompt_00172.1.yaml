  Hmm... there are actually solid behavioral economics concepts that could explain this. Loss aversion (Kahneman & Tversky) makes people fear losses more than equivalent gains - so that 15% chance of zero income might psychologically feel like 30% or more. Also, with a small kid, the stability need isn't just financial - it's emotional security too. The corporate job isn't just income; it's predictable bedtimes and healthcare stability.

  The user mentions "literally nothing for a year" - that's catastrophic risk, not just incremental loss. Standard utility functions assume smooth curves, but real human welfare has cliffs (e.g., losing health insurance). Plus, with dependents, risk tolerance plummets - you're no longer optimizing for yourself alone. 

  I should also consider the hidden asymmetries the math might miss: 
