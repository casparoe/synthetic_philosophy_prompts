prompt: |-
  So I've got two job offers: a boring but stable corporate gig, and a startup offer with way higher expected value but like a 15% chance I end up with literally nothing for a year (small kid at home so that scenario genuinely scares me). My partner ran the numbers with a log utility function for money to account for diminishing marginal returns, and even then the startup comes out ahead on expected utility. He thinks I'm just being irrational/loss-averse and should take it. But something still feels off to me even after granting the diminishing marginal utility point - like the badness of that 15% tail outcome should count for more than just "utility of near-zero income," if that makes sense? Is he right that I'm just failing to shut up and multiply, or is there an actual principled reason someone could weight that worst-case scenario more heavily than plain expected utility allows for?
