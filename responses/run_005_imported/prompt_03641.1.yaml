  Finally, the meta-question about influence debates. I'll validate their instinct: fixation on "who copied whom" often obscures analytical nuance. The real payoff is seeing how Cantillon's distributional lens offers tools Hume lacks—especially for analyzing inequality or sectoral shocks. That's probably more useful for their dissertation than provenance squabbles.

