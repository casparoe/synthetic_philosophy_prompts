prompt: |-
  ok this has been bugging me since our formal semantics reading group last week. pretty sure Lewis's triviality result proves indicative conditionals literally cant have truth conditions, since you cant get P(if A, C) = P(C|A) to hold in general without the probability space collapsing into something trivial. but then everyone, including stuff my own advisor writes, just goes ahead and assigns possible-worlds truth conditions to indicative 'if' anyway, truth tables and all, like the proof never happened. is that just sloppy, or is there some standard move for having your cake and eating it too that im blanking on from Adams/Edgington?
reasoning: |-
  Okay, the user is struggling with Lewis's triviality result and how it conflicts with the common practice of assigning truth conditions to indicative conditionals. They mention that in their reading group, they discussed how Lewis proved that P(if A, C) can't generally equal P(C|A) without trivializing the probability space. Yet, they see scholars, including their advisor, using possible-worlds semantics with truth tables for indicatives. They're confused if this is sloppy or if there's a workaround they're missing.

  First, I need to recall Lewis's result. He showed that if you try to equate the probability of a conditional with the conditional probability, it forces the probability space to have only trivial dependencies. That means no non-trivial conditionals can exist. So, assigning truth values to indicative conditionals as if they're standard propositions leads to this collapse. 

  The user is aware of Adams and Edgington, who argue that indicative conditionals aren't truth-apt. Adams' assertion theory says that asserting "if A, C" is like asserting C under the supposition A. So, they don't have truth conditions. Edgington also denies they have truth values. But the user sees people using possible-worlds models anyway. Why?

  I should explain the two main approaches. The "no truth conditions" camp (Adams, Edgington, Bennett) avoids assigning truth values. They handle conditionals via assertability or probability. The other camp, like Stalnaker, tries to assign truth conditions while respecting the triviality result. Stalnaker's semantics uses selection functions in possible worlds, so "if A, C" is true at a world if C is true in the closest A-world. But Lewis showed this leads to collapse under certain assumptions. Stalnaker responded by restricting the probability distribution or making the conditional context-dependent. So, in some contexts, it can have truth conditions without collapse.

  The user's advisor might be using such a model. Possible-worlds semantics can work if they don't equate P(conditional) with P(C|A) universally. Maybe they're modeling a specific context where the probabilities align. Or perhaps they're using the semantics for subjunctive conditionals, which aren't affected by Lewis's result. Indicatives vs. subjunctives are different here.

  The user might be missing that possible-worlds semantics can still be used formally while acknowledging that P(if A, C) = P(C|A) isn't a universal identity. Stalnaker's approach allows truth conditions by making conditionals sensitive to context or restricting probabilistic constraints. So, the advisor isn't necessarily sloppy; they might be working within a framework that circumvents the triviality by adjusting assumptions.

  Another point: some theorists use possible-worlds for both indicatives and subjunctives but handle probabilities differently. For indicatives, they might only consider epistemically possible worlds, avoiding the collapse. The user should check if their advisor's work specifies such distinctions.

  Also, the triviality result assumes Boolean operators apply to conditionals. If conditionals aren't part of the Boolean algebra, they avoid the collapse. So, in a logic where conditionals are a different type, truth conditions can exist without equating to conditional probability in all cases.

  The user's deeper need might be understanding how to reconcile formal semantics with the triviality result. They might feel conflicted seeing their advisor's work ignore this. They need reassurance that there are valid approaches (like Stalnaker's) that address the issue. Emphasizing the context-dependency or restricted probabilistic models could help them see it's not sloppy but a different solution.

  I should also mention that some theorists are explicit about the limitations. Others might be using possible-worlds for simplicity, assuming readers know the nuances. The user's advisor might fall into the former category. Suggesting the user ask their advisor about how they handle the triviality result could be good advice.
answer: |-
  You've hit on one of the most notorious and persistent headaches in conditional logic! Your frustration is completely justified – Lewis's triviality result (and its variants by Hájek, Bradley, etc.) *does* pose a devastating challenge to the idea that indicative conditionals (e.g., "If it rains, the match will be canceled") have standard truth-conditional meaning *while also* satisfying the Equation: **P(If A, C) = P(C | A)** for all A, C in non-trivial probability spaces.

  **Here's why it feels like scholars are ignoring it, and why (sometimes) they aren't being entirely sloppy:**

  1.  **The "No Truth Conditions" Camp (Adams, Edgington, Bennett):** This group takes the triviality results *dead seriously*. Their core argument is:
      *   The Equation (P(If A, C) = P(C | A)) is *non-negotiable* for indicative conditionals. It captures their core logic, assertability conditions, and role in reasoning.
      *   Lewis proved you *cannot* have this Equation *and* assign standard truth conditions to "If A, C" *and* have a non-trivial probability space.
      *   **Therefore:** Indicative conditionals **do not have truth conditions** (or truth values) at all. They are not propositions.
      *   **What they are:** Devices for managing *suppositions* or *conditional beliefs*. Asserting "If A, C" is an act of expressing your high conditional probability P(C|A), or your willingness to add C to your belief set *on the supposition that A*. Their "semantics" is given by rules of *assertability* or *acceptability*, not truth conditions.
      *   **How they handle logic:** Validity is defined in terms of *preservation of probability/acceptability*, not truth preservation. An argument is valid if it's impossible for the premises to be highly acceptable/probable while the conclusion is not.
      *   **Your Advisor?** If your advisor writes things like "The truth conditions of 'If A, C'..." for *indicatives*, they are almost certainly *not* in this camp, or are being contextually sloppy (e.g., talking about subjunctives).

  2.  **The "Truth Conditions Anyway" Camp (Stalnaker, Jackson, Contextualists):** This group tries to salvage truth conditions *despite* Lewis. They typically argue one of the following:
      *   **The Equation is Wrong (or Limited):** They deny that P(If A, C) *must always equal* P(C|A) in *every* context or for *every* agent. Lewis's proof relies on this universal applicability. They might argue the Equation holds only under "ideal" conditions, or only for the *assertability* of the conditional, not its *truth*.
      *   **Truth Conditions are Contextual/Non-Propositional:** Stalnaker (especially later work) emphasizes context-dependence. The "proposition" expressed by "If A, C" is highly sensitive to the contextually relevant possibilities and selection function. It *can* have a truth value *in a specific context*, but this proposition *itself* might not be easily embeddable or subject to the same probabilistic constraints assumed in Lewis's proof. The *same sentence* can express different propositions in different contexts, potentially dodging the universal quantification Lewis needs.
      *   **Restrict the Logic/Probability:** Some argue Lewis's assumptions about how conditionals interact with Boolean operators (especially within the scope of probability) are too strong or unnatural for natural language. By restricting the logic (e.g., denying that conditionals can freely embed or be embedded), they try to block the triviality proofs. (This is often seen as ad hoc).
      *   **Jackson's "Robustness":** Frank Jackson argued that while P(If A, C) might sometimes diverge from P(C|A), the *assertability* of "If A, C" requires both high P(C|A) *and* high P(C|A) to be *robust* under learning A (i.e., P(C|A) shouldn't crash if you learn A). He assigned truth conditions (similar to the material conditional or Stalnaker's) but argued assertability depends on robustness. Lewis's result still applies to the *truth-conditional content* Jackson assigns, so this doesn't fully solve the problem for the Equation itself.
      *   **Possible Worlds as a Tool:** Many who use possible worlds semantics are *not* necessarily committed to the Equation holding universally for indicative conditionals *in the way Lewis assumes*. They might be:
          *   **Modeling Subjunctives:** Lewis's result primarily targets *indicatives*. Possible worlds semantics is widely seen as more appropriate for *subjunctive/counterfactual* conditionals ("If it had rained, the match would have been canceled"), where the Equation doesn't hold and triviality isn't an issue. **This is a HUGE source of confusion.** Always check if the author is talking about indicatives or subjunctives! Your advisor might be using possible worlds for subjunctives while holding an Adams-like view for indicatives.
          *   **Modeling Epistemic/Doxastic States:** Worlds can represent an agent's epistemic possibilities. "If A, C" might be evaluated as true *relative to that state* if all the A-worlds in the state are C-worlds. This makes P(If A, C) = 1 if P(C|A)=1 and 0 if P(C|A)=0, but allows divergence otherwise. This avoids Lewis by not requiring the Equation *within* the probability space modeling the agent's beliefs.
          *   **Providing a Formal Structure:** Possible worlds offer a powerful framework for defining logical consequence and entailment relations, even if the connection to probability has to be handled carefully or restricted. They might be focusing on the logic of *certainty* (P=1) rather than gradable belief.

  **The "Standard Moves" for Having Cake and Eating It (Sort Of):**

  1.  **Stalnaker's Contextualism:** This is the most influential "truth-conditional anyway" approach trying to respect the Equation. The core ideas:
      *   "If A, C" expresses a proposition (true/false at a world) *relative to a context*.
      *   The context provides a *selection function* that picks the unique "closest" A-world.
      *   "If A, C" is true (at w, relative to f) iff C is true at f(A, w).
      *   **Respecting Probability:** Stalnaker *also* endorses the Equation *as a pragmatic constraint on assertability* or *as a default assumption about rational belief*. Crucially, he argues Lewis's proof relies on the conditional *proposition* being *unconditionally probabilifiable* in the same way as simple propositions, which he denies. The conditional proposition is *about* the selection function, which is often contextually fixed. The Equation holds *only when* the agent is certain about the relevant context/selection function. When uncertainty exists about the context (i.e., about *which* A-world is closest), P(If A, C) can diverge from P(C|A). Lewis's proof forces the context/selection function to be trivial because it assumes the conditional proposition behaves like an ordinary proposition within the probability calculus. Stalnaker bites the bullet and says conditionals *don't* always behave that way under uncertainty about context. **This is the main "cake-eating" move.** It preserves truth conditions *and* a connection to conditional probability, but denies the universal, context-insensitive applicability of the Equation that Lewis's proof requires.

  2.  **The Restrictor View (Kratzer, etc.):** This view treats "if" not as a binary connective creating a proposition "If A, C", but as a device that *restricts* the domain of some other operator (like a modal or quantifier, often implicit). "If A, C" might be analyzed as something like "Necessarily [under circumstances where A], C" or "In all relevant A-situations, C". The "if"-clause restricts the domain of the modal/quantifier. On this view:
      *   There *is* no unique proposition "If A, C" standing alone. Its meaning depends on the operator it restricts.
      *   Truth conditions *are* assigned, but they are the truth conditions of the *restricted operator* (e.g., the modal claim), not of a unique conditional proposition.
      *   The triviality results are sidestepped because there is no single proposition "If A, C" whose probability is supposed to equal P(C|A). The probability of the *overall statement* containing the conditional might relate to conditional probability, but the mapping is more complex and depends on the operator. This view is popular in formal semantics but less focused on the Equation directly.

  **Conclusion & Is it Sloppy?**

  *   **Sometimes, yes, it's sloppy.** Using possible worlds truth tables for *indicative* conditionals without *any* acknowledgment of Lewis's result or the arguments of Adams/Edgington *is* problematic, especially in work focused on the logic or probability of conditionals. Confusing indicative and subjunctive semantics is a common pitfall.
  *   **Often, it's strategic simplification.** In work focused on other phenomena (e.g., embedding under attitude verbs, focus, presupposition projection) where the precise probabilistic behavior isn't central, authors might use a simple truth-conditional possible worlds model for indicatives *as a placeholder* or *for ease of exposition*, knowing the foundational issues exist but aren't crucial to their immediate point. This is common in broader formal semantics/pragmatics.
  *   **Frequently, it's Stalnaker's move.** Many truth-conditionalists are explicitly or implicitly relying on Stalnaker's contextualist framework. They *are* trying to respect the Equation where possible while assigning truth conditions by making context carry the load and denying the universal probabilistic embeddability Lewis assumed. Whether this move is ultimately successful is still debated, but it's a sophisticated and deliberate response, not simple ignorance.
  *   **Rarely, it's the Restrictor View.** Authors using this framework genuinely don't think there *is* a unique conditional proposition for Lewis's result to target in the first place.

  **What you should do:**

  1.  **Read Stalnaker's "Indicative Conditionals" (1975) and his response to Lewis (1976).** This is the canonical "have cake and eat it too" move.
  2.  **Scrutinize your advisor's (and others') work closely:**
      *   Are they explicitly talking about *indicatives* or *subjunctives*? (Lewis's result targets indicatives).
      *   Do they mention Lewis/Adams/Edgington/triviality? How do they address it?
      *   Are they using possible worlds for truth conditions *or* just to model epistemic states?
      *   Does their logic allow free embedding of conditionals? (Lewis's proof requires this).
      *   Do they explicitly endorse the Equation universally? Contextually? Or not at all?
  3.  **Recognize the deep divide:** The field remains fundamentally split between the "No Truth Conditions" camp (Adams, Edgington, Bennett) and the "Contextualist Truth Conditions" camp (Stalnaker, later Jackson). The triviality results are the primary weapon of the first camp. The second camp's responses involve significant theoretical adjustments. Much writing assumes one framework without always fully defending it against the other.

  Your understanding is spot on. The apparent disregard for Lewis often stems from working within Stalnaker's contextualist framework (which addresses the result), focusing on subjunctives, using possible worlds for epistemic modeling rather than direct truth conditions, or occasionally, simplification for other purposes. But outright ignoring the result while claiming indicative conditionals have straightforward truth conditions *and* obey the Equation *is* sloppy foundational work. Keep questioning it!
