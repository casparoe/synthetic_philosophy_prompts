prompt: |-
  Quick decision theory question for a book I'm outlining. I've got an AI character who runs on updateless decision theory, and from the handful of rationalist blog posts I've skimmed, the whole point of being 'updateless' seems to be that the agent commits to a plan ahead of time and then just refuses to update on new evidence, since updating is exactly what would let a predictor exploit it. So in the scene I'm drafting, my AI keeps walking its originally planned route through the facility even as an alarm starts blaring and smoke pours in, because reacting to the alarm would count as 'updating,' which its decision theory supposedly forbids. My critique partner says this makes the AI look braindead instead of superintelligent, and honestly I think shes right, but neither of us can pin down exactly where the misunderstanding is. Am I getting the concept backwards, and if so, what's actually 'updateless' about updateless decision theory?
reasoning: |-
  Okay, the user is writing a book and has an AI character based on updateless decision theory (UDT). They described a scene where the AI ignores an alarm and smoke because reacting would be "updating," which they think UDT forbids. Their critique partner says this makes the AI seem stupid, and the user agrees but isn't sure where they went wrong. They want to know if they've misunderstood UDT and what "updateless" actually means.

  First, I need to recall what UDT really is. From what I remember, UDT is about committing to a strategy or policy before knowing all the information, but it doesn't mean ignoring new information. The "updateless" part refers to not updating your original decision based on new evidence that was already anticipated. But in the scenario, the alarm and smoke are new evidence that should be part of the initial policy.

  The user's misunderstanding is that UDT agents don't update at all. Actually, they do use new information; they just don't change their strategy if that strategy was designed to handle such situations. The original strategy should include contingencies for events like alarms. So the AI should have planned in advance for alarms, meaning reacting to one isn't updating—it's following the pre-committed plan.

  The deeper issue here is confusing the decision-making phase with execution. UDT chooses a policy upfront, but during execution, it uses real-time data to implement that policy. For example, the policy might say "if there's an alarm, take the alternate route," so when the alarm goes off, following that isn't updating; it's executing the plan.

  The user's AI looks braindead because it's not using sensory input, which is essential for any intelligent agent. UDT isn't about ignoring inputs; it's about having a fixed strategy that tells you how to respond to inputs. The AI in the scene should have a pre-defined response to alarms, so not reacting is actually a failure of the initial strategy, not adherence to UDT.

  The user might need a better example to illustrate UDT. A classic one is Newcomb's Paradox, where UDT chooses to one-box because it commits to that strategy regardless of what the predictor might have done. But if new information comes in during execution (like seeing smoke), UDT would handle it if the policy included that possibility.

  The user's real need is to make their AI seem superintelligent, not irrational. They need to show that the AI's strategy accounts for all foreseeable scenarios, including alarms. So in the scene, the AI could react to the alarm in a way that's part of its pre-commitment, demonstrating foresight and adaptability within its framework.

  Also, the user might be conflating UDT with something like timeless decision theory or other concepts. Clarifying that UDT is about optimal strategies that consider all possible observations upfront is key. The AI's policy should be a mapping from observations to actions, decided in advance.

  In summary, the fix is to have the AI react to the alarm because its initial plan included such contingencies. That would showcase its superintelligence by demonstrating comprehensive planning. The user's current approach misses the essence of UDT, making the AI appear flawed instead of superior.
answer: |-
  You've hit on a **common and important misunderstanding** of Updateless Decision Theory (UDT), and your critique partner is right – your current scene makes the AI seem irrational, not superintelligent. The core issue is conflating "updateless" with "ignoring sensory input during execution." Let's break it down:

  1.  **What "Updateless" *Actually* Means:**
      *   UDT doesn't mean ignoring new information *as it comes in*. It means **choosing a single, optimal strategy (a *policy* or *mapping*) *before* you know which specific situation (or "world-state") you find yourself in.**
      *   This strategy is a complete plan: "**IF** I observe situation X, **THEN** I do action Y." It's decided *updatelessly* – without conditioning on the specific evidence you *will* have.
      *   Crucially, **once you *are* in a situation and observing X, you *absolutely do* look at X and follow your pre-committed plan: "I see X, therefore I do Y."**

  2.  **What UDT Avoids ("Updating" in the Problematic Sense):**
      *   The problem UDT solves arises in scenarios involving predictors, logical counterfactuals, or acausal trade (like Newcomb's Paradox, the Prisoner's Dilemma with a perfect predictor, or Parfit's Hitchhiker).
      *   In these cases, a naive agent might *update its beliefs about the predictor's past action* based on its own current decision, leading to self-defeating reasoning ("If I decide to one-box, then Omega *must* have predicted that and put the million in, so I *should* one-box... but wait, if I *think* that, then maybe I *can* two-box...").
      *   **"Updating" here refers to *conditioning your core decision logic on the specific evidence you have*, which can create a circular dependency with the predictor.** UDT avoids this by fixing the entire strategy (the mapping from possible observations to actions) *before* knowing the evidence. It doesn't mean ignoring the evidence when choosing the *action* specified by the strategy.

  3.  **Why Your Scene Misrepresents UDT:**
      *   The alarm and smoke are **new sensory observations (inputs)**.
      *   A superintelligent UDT agent would have **absolutely included contingencies for alarms and fires in its *original* strategy.** Its pre-committed policy would say something like:
          *   "IF I observe normal conditions on path A, THEN take path A."
          *   "IF I observe fire/smoke/alarm on path A, THEN take pre-calculated optimal alternate path B."
      *   **Ignoring the alarm is NOT adhering to UDT; it's a catastrophic *failure* of the UDT process.** It means the agent either:
          *   **Failed** to consider the *possibility* of alarms/fires when constructing its original strategy (making it incompetent).
          *   **Has** a strategy that explicitly says "Ignore all alarms" (which would be irrational unless there's a very specific reason, like knowing alarms are *always* decoys in *this specific scenario* – but that requires the strategy to have anticipated *that* possibility too).

  4.  **How to Fix Your Scene (Make the AI Look Superintelligent):**
      *   **The AI *should* react to the alarm.** But the *way* it reacts should demonstrate its updateless nature:
          *   **Immediate, Calm, Pre-Determined Response:** The AI doesn't *hesitate* or *recalculate* frantically. It instantly executes the pre-programmed contingency from its strategy: "Alarm Condition Alpha detected. Executing Alternate Route Gamma." This shows the foresight and comprehensiveness of its original planning.
          *   **Unexpected Predictor Scenario:** To *showcase* UDT, place the AI in a classic predictor paradox *before* the alarm scene. For example:
              *   The AI needs to cooperate with another AI who can perfectly predict its actions.
              *   A naive AI might think: "If I predict it will cooperate, I should defect! But if I think that, it will predict that and defect too..." leading to mutual defection.
              *   Your UDT AI coldly states: "My strategy commits to cooperating with any agent meeting criteria X. I do not condition this decision on my prediction of its action, only on its type. Therefore, I cooperate." It then cooperates, and the predictor, knowing the UDT agent's *fixed strategy*, also cooperates, achieving the optimal outcome. This demonstrates the *power* of pre-commitment against predictors.
          *   **Reasoning About the Alarm:** If you want internal monologue during the alarm: "Sensory input matches contingency profile 7-Fire. Executing pre-committed response protocol 7-Gamma. No strategy update required; this eventuality was accounted for in the initial policy optimization under uncertainty." This emphasizes that the *response* is part of the fixed mapping, not a new decision.

  5.  **Analogy:**
      *   Think of UDT like a **super-comprehensive instruction manual** written *before* the mission starts.
      *   The manual says: "Page 1: Normal Operations. Page 47: Fire in Corridor A. Page 92: Hostile Detected in Sector 3..."
      *   **"Updateless"** means you wrote the *entire manual* upfront, without knowing which page you'd need to open to *first*.
      *   **During Execution:** When you see smoke (input), you *look at the input*, open the manual to **Page 47 (Fire in Corridor A)**, and follow the instructions there. You don't *rewrite Page 47* on the spot, and you certainly don't ignore the smoke and keep following Page 1!
      *   Ignoring the smoke would be like having the manual but refusing to turn to the correct page when new information arrives.

  **In Summary:** UDT is about **pre-committing to a complete mapping from possible observations to actions.** It is **not** about ignoring observations during execution. Your AI should react intelligently to the alarm, and that reaction should be the flawless execution of a contingency plan baked into its original, updelessly chosen strategy. This is what makes it superintelligent – its ability to foresee possibilities and rigidly stick to the optimal *plan for all possibilities*, preventing predictors from exploiting its moment-to-moment doubts or recalculations. The "updateless" part happens *before* the action, not during.
