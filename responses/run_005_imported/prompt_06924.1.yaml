  Hmm, the user needs more than just theory - they need a actionable memo draft that withstands scrutiny from an EV-maximizing committee member. Key challenges jump out: First, how to reject the proposal without dismissing expected value principles outright. Second, how to establish defensible filters for future similar pitches. Third, how to frame this as institutional integrity rather than risk-aversion.

  I recall Bostrom's leverage penalty and Yudkowsky's "Pascal's Muggle" points about evidence thresholds. The mugger here has crossed the initial barrier by providing some methodology (however flimsy), which complicates simple probability discounting. But the complete lack of verifiable credentials or track record seems crucial - this isn't just low probability, it's structurally unverifiable.

  *scratches head* What's the user's hidden need here? Probably: 1) Preserve committee credibility while rejecting moonshots, 2) Avoid setting bad precedent, 3) Not get steamrolled by "shut up and multiply" rhetoric. The memo needs to reframe "irrationality" as "due diligence" - that's the tightrope walk.

  *starts structuring* The recommendation should be rejection, but with three layers of justification: epistemic (why we can't trust the inputs), decision-theoretic (why EV alone isn't sufficient), and practical (how this protects future grants). The leverage penalty concept needs retooling - instead of discounting probability, we're discounting the entire EV calculation's validity when inputs are unanchored.

  *checks watch* Better include concrete alternatives too. A token grant with conditions could placate the EV-maximizer while maintaining safeguards. And absolutely must bake in review standards for future proposals - this won't be the last mugging attempt.

  *nods* The tone has to stay rigorously analytical. No eye-rolling at big numbers, just showing how unbounded claims demand corresponding evidence. Frame the rejection as upholding EV principles by refusing to feed garbage inputs into the calculation. That might actually convince the hardcore EV guy...
answer: |-
  ## MEMORANDUM  
  **TO:** Small-Grants Committee Members  
  **FROM:** [Your Name]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation & Framework for Evaluating Proposal #23-AI ("High-EV AI Alignment Research")  

  **1. EXECUTIVE SUMMARY**  
  We recommend **rejecting Proposal #23-AI** in its current form. While the astronomical expected value (EV) claim demands serious consideration, critical flaws in its epistemic foundations render the EV calculation unactionable. Funding would violate core principles of evidence-based giving and set a harmful precedent. Instead, we propose establishing clear evidence thresholds for "Pascalian" proposals and offering the applicant a conditional pathway for future consideration with verified milestones.

  **2. THE EXPECTED-VALUE CHALLENGE: ACKNOWLEDGING THE APPEAL**  
  The proposer correctly notes that under a naive EV calculation (Probability x Impact), their claim dominates alternatives:  
  - `(1/200,000) * 10^16 lives ≈ 5*10^10 expected lives saved`  
  - Compared to e.g., $4k to AMF (~0.3 lives saved) or top GiveWell charities (~1-2 lives/$50k).  

  A funder committed *only* to maximizing EV *without epistemic constraints* might see refusal as irrational. We acknowledge this mathematical surface appeal.

  **3. WHY THE NAIVE EV CALCULATION IS UNTRUSTWORTHY: THE LEVERAGE PENALTY REVISITED**  
  Bostrom's leverage penalty (discounting claims inversely proportional to the "mugger's" cost to make the claim) is insufficient here, as Yudkowsky notes, when *some* evidence exists. However, **a leverage penalty must evolve into a broader "Epistemic Integrity Penalty" when claims are structurally immune to verification.** Key flaws:

  *   **Unverifiable Probability Estimate (1/200,000):** This figure originates solely from the applicant's friend. No independent basis exists to assess it (e.g., track record, peer review, documented progress). It could easily be off by orders of magnitude in either direction, rendering the EV calculation meaningless.
  *   **Unverifiable Impact Claim (10^16 lives):** While grounded in longtermist frameworks, the *specific magnitude* hinges entirely on the unverified claim of a "decision-theoretic result on AI bargaining/alignment." No draft, proof sketch, or independent expert validation supports the *scale* of impact asserted.
  *   **Unverifiable Agent Credibility:** The researcher lacks a publication record, institutional affiliation, or demonstrable expertise we can assess. The proposer (a club member) has no expertise to validate the claim's plausibility. The chain of trust is broken.
  *   **Absence of Falsifiability:** The proposal offers no near-term milestones or mechanisms to disprove its core claims before the full $4k is spent. Failure is indistinguishable from "not there yet."

  **4. DECISION-THEORETIC PRINCIPLE: EXPECTED VALUE REQUIRES ACTIONABLE INPUTS**  
  Maximizing EV is only rational when the *inputs* to the calculation (P(Success), Impact) are sufficiently reliable. **Funding decisions based on arbitrary numbers plugged into an EV formula, without credible anchors for those numbers, is not rational EV maximization—it’s gambling on unconstrained fiction.** Rationality demands:

  *   **Evidence Thresholds:** Extraordinary claims require extraordinary evidence proportional to the scale of the claim. A 1-in-200,000 chance of affecting 10^16 lives requires *substantial, verifiable* evidence to justify action. None exists here.
  *   **Robustness to Skepticism:** A defensible EV estimate should withstand reasonable scrutiny of its components. This estimate collapses under minimal scrutiny of its inputs.
  *   **Avoiding Predictable Exploitation:** Funding this proposal signals that unfalsifiable, self-reported mega-EV claims are sufficient for funding. This invites infinite similar proposals, overwhelming our process and diverting funds from verifiable good.

  **5. THE COST OF FALSE POSITIVES & INSTITUTIONAL PRECEDENT**  
  Funding this sets a dangerous precedent:
  *   **Dilution of Rigor:** It lowers the evidence bar for all future grants, undermining our credibility and effectiveness.
  *   **Opportunity Cost:** $4k diverted from known-effective interventions has a *real, immediate cost* (~0.1-0.2 lives lost based on GiveWell estimates).
  *   **Reputational Risk:** Funding obviously unverifiable "moon shots" harms the club's reputation for seriousness within the EA community and the university.

  **6. RECOMMENDATION & ALTERNATIVE PATHWAY**  
  *   **Recommendation: REJECT Proposal #23-AI** for funding in this cycle. The epistemic foundation is too weak to justify diverting funds from verifiable opportunities or setting a harmful precedent.
  *   **Conditional Pathway:** Communicate to the proposer that we are intrigued by the *potential* domain but require **verifiable evidence** to make such an asymmetric bet. Offer a pathway for future consideration if the researcher can provide, *before the next grant cycle*:
      *   A detailed technical abstract or proof sketch of the claimed result.
      *   Anonymized expert review from *one* credible AI alignment researcher (e.g., PhD candidate+ in a relevant field, researcher at a recognized lab) assessing the novelty and plausibility of the claimed approach/result.
      *   Specific, verifiable 6-month milestones achievable with a smaller grant (e.g., $500).

  **7. PROPOSED STANDING PRINCIPLE FOR FUTURE "PASCALIAN" PROPOSALS**  
  To ensure consistent, defensible evaluation of high-EV, low-probability proposals, we adopt this principle:  

  > **"Epistemic Threshold for Pascalian Bets":** Proposals claiming extreme expected value based on low-probability, high-impact outcomes may only be funded if they provide **credible, verifiable evidence for both the probability and impact estimates, proportional to the scale of the claim.** This requires at minimum:  
  > (a) Demonstrable relevant expertise or a credible track record from the core researcher(s).  
  > (b) Independent verification (e.g., expert review, prototype, data) of the core claims or methodology.  
  > (c) Falsifiable near-term milestones.  
  > *Absent such evidence, the EV calculation is deemed non-actionable, regardless of its nominal magnitude.*  

  **8. CONCLUSION**  
  Rejecting this proposal is not a rejection of expected value maximization. It is an affirmation that *rational* EV maximization requires trustworthy inputs. Funding unverifiable mega-EV claims undermines our mission, invites exploitation, and wastes resources on gambling disguised as calculation. By establishing clear epistemic thresholds and offering a path for credible future applications, we uphold rigor while remaining open to truly transformative opportunities.  

  **VOTE RECOMMENDATION:** ❌ REJECT Proposal #23-AI. Adopt the "Epistemic Threshold for Pascalian Bets" principle for future cycles.  

  ---  
  **Appendices (For Discussion):**  
  *   *Brief Summary of Bostrom's Leverage Penalty & Yudkowsky's Critique:* The leverage penalty discounts P(Claim) based on the mugger's cost to make the claim. Yudkowsky argues it fails once the mugger provides *any* evidence, requiring Bayesian updating instead. Our principle addresses this by demanding *credible, verifiable* evidence proportional to the claim's scale, not just any evidence.  
  *   *Comparison to Legitimate High-Risk/High-Reward Science Funding:* Legitimate programs (e.g., FROs, some EA Funds grants) still require expertise, a plausible mechanism, and peer scrutiny *before* significant funding. This proposal lacks these guardrails.
