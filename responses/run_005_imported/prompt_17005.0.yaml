  The user also mentioned McMahan's revisionist critique. McMahan rejects moral equality, arguing that only combatants fighting for a just cause have the right to kill. This directly challenges Walzer's separation. The user might be sensing this tension, which McMahan exploits. Highlighting this contrast could help the user understand the debate's core.

  Deep needs: The user needs a clear distinction between ad bellum and in bello to resolve their study group's argument. They also need to grasp why Walzer maintains both despite apparent conflict. Additionally, they might be preparing for discussions on McMahan, so explaining the revisionist critique's basis would be beneficial. Emphasizing Walzer's practical concerns (order, reciprocity) versus McMahan's focus on individual moral responsibility could clarify the theoretical divide.

