  ### Key Defense Points for Peer Dispute  
  - **Intensions**: Emphasize that primary intension asks, "If *this* world were actual, what would 'water' refer to?" (contingent). Secondary intension asks, "Given *our actual* world, what does 'water' refer to in *that* counterfactual world?" (necessary).  
  - **Apriority/Necessity Link**: Stress that two-dimensionalism preserves a link by making **primary intension ≡ a priori** (knowable without experience) and **secondary intension ≡ necessity** (Kripkean metaphysical necessity).  
  - **Why Inversion Matters**: Your classmate’s version implies "Water is H₂O" is necessary a priori—directly contradicting Kripke’s *necessary a posteriori* thesis.  
  - **Objection Strength**: Acknowledge their objection is textbook-perfect—it’s why many philosophers (e.g., Scott Soames) reject two-dimensional semantics.  

