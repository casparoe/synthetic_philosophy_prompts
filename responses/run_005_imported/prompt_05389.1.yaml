  Okay, let me start by unpacking the user's query. They're deeply interested in Frederick Douglass's shift in interpreting the U.S. Constitution, specifically his 1860 Glasgow speech. The user points out that Douglass used two interpretive methods: one based on public meaning originalism and the other on natural rights. The core question is how Douglass would react to recent Supreme Court decisions if he were exposed to modern originalist rulings.

  First, I need to recall Douglass's arguments accurately. In his Glasgow speech, he emphasized the absence of "slavery" in the Constitution, arguing that a competent reader in 1787 wouldn't see it as a pro-slavery document. Simultaneously, he invoked the Preamble's commitment to justice and liberty, suggesting that any ambiguity should favor freedom. The user is concerned whether Douglass's originalism was merely a tool for his higher-law principles or a standalone method.

  The user mentions specific cases: Shelby County (Voting Rights Act), Dobbs (abortion rights), and Bostock (LGBTQ+ rights). They want an analysis based on Douglass's arguments, not just his political leanings. I should avoid vague answers and provide a reasoned stance on each case.

  For Shelby County, Douglass would likely oppose it. He saw federal power as essential to protect rights, especially against state-level oppression. His support for the 15th Amendment shows he trusted federal oversight, so gutting preclearance would contradict his views on federal enforcement of equality.

  Dobbs is trickier. While Douglass advocated for natural rights, he might not extend them to abortion, given his 19th-century context. However, his higher-law approach could support bodily autonomy. But since he prioritized explicit textual commitments, he might defer to states here, aligning with originalism but conflicting with his broader principles.

  Bostock would be a win for him. Using textualism to protect a marginalized group aligns with his move in Glasgow. Prohibiting sex discrimination to cover LGBTQ+ rights mirrors his argument that constitutional silence on slavery doesn't permit it. This case blends his two moves effectively.

  The user's deeper need might be understanding if originalism can consistently promote civil rights or if it's co-opted. They might also seek validation of their suspicion that Douglass's methods are in tension. I should address whether his originalism was instrumental, leading him to critique modern originalists when they ignore natural rights.

  In conclusion, Douglass would endorse Bostock, reject Shelby County, and have mixed views on Dobbs. He'd likely critique originalists who ignore higher-law principles, seeing them as betraying the Constitution's spirit. His originalism was a means to an end—liberty—so he'd oppose interpretations undermining that goal.
answer: |-
  Based on Douglass's core principles and argumentative structure in the Glasgow speech, here's a specific, defended leaning on how he'd likely react to the modern cases you mentioned, *without* assuming he'd simply adopt modern partisan alignments:

  1.  **Shelby County v. Holder (2013):** **Strong Rejection.**
      *   **Why:** This case hinges on federalism and the textual requirement for current conditions to justify preclearance. Douglass, however, saw the *federal government* as the essential bulwark *against* state-level oppression. His entire later constitutional argument was predicated on the federal government having the *power and duty* to override state laws that violated fundamental rights (like slavery). Gutting a key federal enforcement mechanism (VRA preclearance) designed to protect the voting rights of a historically oppressed group would strike him as a catastrophic failure of the federal power he relied upon.
      *   **Link to His Moves:** This directly violates his "Move Two" (higher law/natural rights). Protecting the franchise for Black citizens was paramount to securing the liberty promised in the Preamble. The "Move One" (public meaning) textualism/federalism argument used by the Court would feel like the *exact kind of formalism* he feared – prioritizing structural federalism over the substantive guarantee of equal liberty. He'd argue the Reconstruction Amendments fundamentally altered the federal-state balance *specifically* to empower the federal government to protect citizens *from* states. Ignoring the *purpose* and *effect* of the VRA in the name of an abstract textual principle (equal sovereignty of states) would be anathema to his higher-law reading. He'd see it as a betrayal of the Constitution's post-1865 commitment.

  2.  **Dobbs v. Jackson Women's Health Organization (2022):** **Likely Agreement with the Method (reluctantly?), Strong Disagreement with the Outcome (probably?), But Significant Ambivalence.**
      *   **Why:** This is the hardest one, forcing a potential split between his moves.
      *   **Agreement with Method?** Douglass *might* concede the *formal* point that the 14th Amendment's Due Process Clause, as publicly understood in 1868, wasn't specifically intended to encompass a right to abortion. His "Move One" (public meaning originalism) focused on the absence of explicit textual sanction for slavery and the presence of liberty-oriented language. Applying that same logic, he might agree that abortion rights aren't *explicitly* grounded in the text/history of the 14th Amendment as understood at ratification. He was wary of rights claimed without clear textual moorings *if* they could be used to undermine fundamental liberties (like attacking emancipation). The "history and tradition" test, while flawed, *resembles* his appeal to the document's original public meaning.
      *   **Disagreement with Outcome & Ambivalence:** However, "Move Two" (higher law/natural rights) would scream against the outcome. Bodily autonomy and the right to make fundamental personal decisions are core components of liberty. Denying women this right would likely strike him as a profound violation of the Preamble's promise to "secure the Blessings of Liberty." He would be deeply troubled by the *consequences* and the state's intrusion into personal liberty.
      *   **The Tension & Likely Leaning:** He'd feel the tension acutely. Ultimately, his *primary* commitment was to *liberty*. While he might *understand* the formal originalist argument in *Dobbs*, he would likely **reject its application here** because:
          *   He saw the Constitution as a *living guarantor* of liberty, not just a static artifact. The Reconstruction Amendments were *meant* to expand liberty dynamically.
          *   The absence of explicit textual protection didn't mean a right *couldn't* exist; it meant the government needed explicit, unambiguous authority to infringe on fundamental liberty (his Glasgow argument flipped). *Dobbs* empowers states to infringe without such explicit federal constitutional prohibition.
          *   He would likely argue that the "liberty" protected by the 14th Amendment *must* be read broadly in light of the Preamble's commitment and natural rights principles ("Move Two" overriding the narrowest reading of "Move One"). He'd probably see *Roe/Casey* as a more faithful application of his higher-law principle, even if the originalist methodology of *Dobbs* superficially resembles his "Move One." **Leaning: Rejection of *Dobbs* as contrary to the spirit of liberty.**

  3.  **Bostock v. Clayton County (2020):** **Strong Approval.**
      *   **Why:** This is where his two moves converge perfectly, just like in his Glasgow argument.
      *   **Link to His Moves:**
          *   **Move One (Textualism/Public Meaning):** The Court focused strictly on the ordinary public meaning of "discriminate because of sex" in 1964. It didn't delve into secret intentions or whether Congress specifically thought about LGBTQ+ individuals. It applied the text as a competent reader would understand the words. Douglass did *exactly* this with slavery: the words "slave" and "slavery" weren't there, so the document couldn't be read as *establishing* or *mandating* it. Similarly, "sex" discrimination in 1964 included firing someone for being gay or trans based on the plain meaning of the words.
          *   **Move Two (Higher Law/Natural Rights):** The outcome protects a marginalized group from discrimination, advancing the cause of equal justice and liberty under the law – the core purpose Douglass ascribed to the Constitution via the Preamble. He would see this as the Constitution operating *as it should*: its text, plainly read, serving as a shield for individual liberty against arbitrary discrimination.
      *   **The Convergence:** *Bostock* demonstrates how textualism/originalism (public meaning) *can* serve higher-law/natural rights ends when the text is liberty-oriented. Douglass would see this as vindication of his Glasgow argument: reading the text faithfully, without smuggled-in biases or hidden agendas, leads to a result aligned with fundamental justice. He would applaud Gorsuch's opinion as embodying the spirit of his own interpretive method.

  **Overall Leaning & Conclusion:**

  Douglass would likely **become a fierce critic of the dominant modern "public meaning originalism" project as practiced by the Court's conservative wing**, seeing it as a **hostile takeover and perversion of the tool he deployed.**

  *   **Why:** His Glasgow speech reveals that his "Move One" (public meaning/textualism) was **entirely instrumental** to "Move Two" (higher law/natural rights/liberty as the default). He wasn't a formalist for formalism's sake. He deployed textualism *because* he believed that, properly read *against the backdrop of natural rights*, the Constitution's text *did* support liberty and condemn slavery. Textualism was the *means*, liberty was the *end*.
  *   **Reaction to Modern Originalism:** Seeing modern originalism consistently deployed to:
      *   Curtail federal power designed to protect marginalized groups (*Shelby County*),
      *   Overturn established liberty protections based on narrow historical readings (*Dobbs*, though ambivalent),
      *   And *only* occasionally yield a liberty-protecting result via pure textualism (*Bostock*),
      ...would convince him that the modern project had severed the essential link between text and the animating spirit of liberty. He would argue that the conservative justices were using the *methodology* he championed (public meaning textualism) but ignoring or actively suppressing the *hermeneutic principle* (liberty as the default, requiring explicit textual sanction for infringement) that gave his use of the method its moral force and purpose.
  *   **His Likely Stance:** He would likely emerge as a proponent of **"Textualism in Service of Liberty,"** arguing that textualism *must* be read through the lens of the Preamble's commitment to justice, liberty, and the general welfare. He would see the modern conservative originalist project as having abandoned the higher-law foundation that made his own originalism morally coherent and effective in fighting for freedom. He'd cheer *Bostock* as a correct application of his method, condemn *Shelby County* as a betrayal of the Constitution's purpose, and reject *Dobbs* as a dangerous narrowing of liberty justified by a hollowed-out version of his originalism. The "hostile takeover" suspicion would be confirmed.
