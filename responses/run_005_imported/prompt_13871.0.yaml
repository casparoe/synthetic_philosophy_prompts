  for my just war theory class we keep coming back to walzer vs mcmahan on the "moral equality of combatants," and i feel like none of the readings actually pin down where the disagreement bites -- everyone just states thier position and moves on. could you write me a dialogue (maybe 15ish exchanges) between a walzer-style defender of the moral equality of combatants and a mcmahan-style revisionist who rejects it? i want them to get into the epistemic argument specifically -- the claim that unjust combatants shouldn't be blamed since they can't reliably know their war is unjust -- and i want the revisionist to actually engage with that using the justification/excuse distinction, instead of just repeating "unjust combatants have no right to kill." both of them need to be arguing in good faith and responding to what the other just said, not talking past each other.
