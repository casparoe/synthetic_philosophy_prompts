answer: |-
  Here’s a 15-exchange dialogue focusing on the epistemic argument and the justification/excuse distinction, with both thinkers engaging directly and in good faith:

  ---

  **Characters:**  
  **W:** Walzer-style traditionalist (defends moral equality of combatants)  
  **R:** McMahan-style revisionist (rejects moral equality)  

  ---

  ### Dialogue:  
  **W:** Look, the core of moral equality is practical: soldiers on both sides fight under orders, risking their lives. We can’t expect every combatant to investigate the *jus ad bellum* of their nation’s war. That’s impossible in the fog of war and politics.  

  **R:** But that confuses *blameworthiness* with *objective wrongness*. Even if a soldier *believes* their cause is just, if the war is objectively unjust, their violent acts lack moral justification. They aren’t *entitled* to kill.  

  **W:** Hold on – if soldiers can’t reliably know whether their war is just, how can we hold them morally responsible? Demanding they refuse to serve turns every citizen into a geopolitical analyst! Most soldiers rely on their state’s authority.  

  **R:** That’s where the justification/excuse distinction matters. I agree many unjust combatants may be *excused* due to ignorance, duress, or epistemic limits. But an excuse doesn’t make their acts *justified*. Justification means the act was *permissible*; an excuse means the agent isn’t fully *blameworthy*. Their killings remain objectively wrongful.  

  **W:** But if they’re excused, why deny moral equality? If unjust combatants aren’t blameworthy, they shouldn’t be treated as moral criminals. Calling them "murderers" ignores their reality.  

  **R:** Because moral equality implies symmetry: that both sides have an *equal right* to kill. But they don’t. An unjust combatant has no right to kill a just combatant – who is defending their community. The just combatant *does* have that right. Ignorance excuses blame, but it doesn’t grant permission.  

  **W:** But your view paralyzes soldiers! If they doubt their cause, must they lay down arms? What if they’re *wrong* about their doubt? We’d have chaos.  

  **R:** I’m not demanding perfect certainty. But soldiers have a duty to exercise due diligence. If there are obvious red flags – e.g., invading a democracy on fabricated grounds – refusing to fight isn’t unreasonable. We expect citizens to resist manifestly unjust laws; why not unjust wars?  

  **W:** Due diligence? Soldiers aren’t philosophers. They’re trained to follow orders, not dissect intelligence dossiers. And states control information! An 18-year-old conscript can’t assess whether WMD claims are credible.  

  **R:** True, and that’s why many would be excused. But consider: if a soldier *knows* their war is aggressive – say, they’ve seen evidence of lies – they’re blameworthy. And even if they don’t *know*, their participation perpetuates injustice. Excuses are gradational; not all unjust combatants are equally excused.  

  **W:** So you grant some are excused, yet still insist they do wrong. But functionally, doesn’t this collapse? If they’re excused, we treat them as non-culpable. Calling their acts "wrong" without blame is a philosophical abstraction.  

  **R:** Not at all! The distinction guides how we *respond* to them. A just combatant who kills an excused unjust combatant isn’t committing murder; they’re acting permissibly. Conversely, the unjust combatant’s act remains objectively unjustified – which matters for reparations, reconciliation, and preventing future wars.  

  **W:** But in practice, soldiers on both sides *feel* entitled to fight. Undermining that risks dehumanizing the "unjust" side. Your view could justify summary executions!  

  **R:** Not if we stress the *excuse* dimension. We can recognize their humanity – even pity them – while insisting their cause lacks justification. And we *must* do this: moral clarity deters aggression. If soldiers know they’ll be excused but not justified, it creates pressure against unjust wars.  

  **W:** Still, you expect too much of ordinary soldiers. They join for duty, patriotism, or survival. Holding them to account for state-level decisions feels unjust.  

  **R:** And I sympathize. But we can’t absolve them entirely without absolving the war machine itself. The excuse/justification split lets us say: "You were trapped, but your actions helped kill innocents. We won’t punish you, but we must condemn the war." That’s how we demand better.  

  **W:** ...I see your point. But I still fear it erodes the war convention. Sometimes, moral equality keeps war from becoming hell.  

  **R:** And I worry that excusing *all* combatants normalizes hell. We owe soldiers the truth: that their moral status depends on the justice of their cause.  

  ---

  ### Key Disagreement "Bites":
  - **Epistemic Argument:** Walzer sees soldiers as *epistemically helpless*, making blame unfair. McMahan grants excuses for ignorance but insists objective wrongness remains.  
  - **Justification/Excuse Distinction:** McMahan uses it to deny that excuses create moral symmetry. Walzer worries this distinction is too fragile for the chaos of war.  
  - **Practical Impact:** Walzer fears moral inequality undermines soldiers’ psychological stability and the laws of war. McMahan argues it’s essential for accountability and deterrence.  

  Both engage the core tension: **Can soldiers be expected to scrutinize their wars? And if not, does ignorance erase the wrongness of their acts?** The dialogue shows how the same premise (epistemic limits) leads to opposite conclusions.
