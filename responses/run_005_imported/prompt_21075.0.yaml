prompt: |-
  I sit on my university's Institutional Animal Care and Use Committee. A neuroscience lab has applied to implant chronic recording electrodes in the vertical lobe of several octopuses to study memory consolidation -- survival surgery, weeks of solitary confinement, only experimental analgesia -- and although federal rules exclude invertebrates from oversight altogether, our own policy already extends review to cephalopods given what's known about their cognitive complexity. Nobody on the committee disputes the relevant behavioral and neurophysiological facts; the dispute is entirely over how much moral weight those facts warrant, since members hold genuinely different views about which theory of moral status is correct, and those theories range from ones granting octopuses near-primate-level protections to ones granting them almost none. One faction wants us to weight the decision by the committee's actual spread of credence across these rival theories and choose whichever disposition of the protocol comes out ahead in expectation; another objects that this lets a few members' modest credence in high-stakes theories about octopus sentience effectively dictate the outcome for everyone else. Draft the memo I will circulate before the vote: recommend a specific disposition of the protocol -- approve, reject, or approve with named modifications -- propose a decision rule the committee should use for similar cases going forward, and engage honestly with the worry that this kind of expected-choiceworthiness reasoning can be hijacked by a minority's credence in extreme theories, rather than simply dismissing it.
reasoning: |-
  Okay, the user is part of their university's Institutional Animal Care and Use Committee (IACUC) and is facing a challenging ethical dilemma. They need to draft a memo for an upcoming vote on a neuroscience study involving octopuses. The study proposes implanting chronic electrodes in octopuses' vertical lobes for memory research, involving survival surgery, weeks of solitary confinement, and only experimental analgesia. 

  The key tension here is that while cephalopods aren't legally protected like vertebrates, the committee's own policy extends oversight to them due to their cognitive complexity. The real conflict isn't about facts—everyone agrees on octopuses' advanced cognition—but about moral weight. Committee members hold radically different theories: some view octopuses as near-primate level in moral status, others see them as having minimal status. 

  The procedural debate is fascinating. One faction wants to use expected moral choiceworthiness—calculating outcomes based on each theory's plausibility. The other faction worries this gives disproportionate power to minority "high-stakes" views (e.g., even 10% credence in octopus sentience could veto the study). The user wants the memo to: recommend a disposition (approve/reject/modify), propose a future decision rule, and seriously address the "hijacking" concern without dismissing it.

  Hmm, the user's unspoken needs feel multidimensional. Professionally, they need a framework that respects academic rigor while preventing gridlock. Ethically, they're signaling discomfort with both extremes—blanket approval feels reckless given cephalopod sentience evidence, but rejection might stall science. Politically, they need a solution that won't alienate either faction. And existentially, this is about defining what kind of committee they are: one that hides behind regulations or one that grapples with moral uncertainty.

  For the recommendation... conditional approval makes sense. Require anesthesia depth verification (since vertical lobe surgery is novel), environmental enrichment to offset solitary confinement, and kill-switch criteria. It acknowledges risks without assuming we know octopuses' exact moral status. 

  The decision rule should split the difference: use expected choiceworthiness but with a sentience probability threshold to block "hijacking." Maybe set it at 30%? That means if the aggregate credence in "high moral status" theories exceeds 30%, we default to maximal protections. Otherwise, we proceed cautiously but permit the study. 

  The hijacking worry needs nuance. Yes, expected utility can amplify extreme views, but that's not irrational if the stakes are asymmetric (suffering vs. knowledge gain). The memo should admit this frankly but argue thresholds prevent paralysis. Also emphasize that dissenters' views are recorded—this isn't tyranny of the minority. 

  ...Wait, is the user subtly hoping for a way to elevate cephalopod ethics beyond this case? The memo's closing should probably stress that this framework is provisional until cephalopod sentience research advances. Maybe suggest a subcommittee to review new evidence annually. 

  *adjusts metaphorical glasses* Alright, drafting now: compassionate but analytical tone, structure around "recommendation → framework → addressing concerns," and absolutely no glossing over the discomfort around minority viewpoints wielding veto power.
