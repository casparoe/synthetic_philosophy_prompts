  Another point is the stability of the surrogate goal. If the AI is superintelligent, it might manipulate the agent into abandoning the surrogate. Or, during the AI's development, humans might interfere with the goal-setting process. The user might not realize how hard it is to maintain a goal purely as a decoy without it being corrupted.

