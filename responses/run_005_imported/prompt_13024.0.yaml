  Regarding the Gettier case: a reliable speaker accidentally says something true based on a false belief. For Hume, since the speaker is reliable, the listener might form a true belief via induction, but it's not knowledge because the reliability chain is broken internally. Reid would likely call it knowledge because the trust principle is satisfied, even if accidentally. Nyaya, however, requires the speaker to have valid knowledge. If the speaker’s belief is false, even if the statement turns out true, the causal condition fails. So Nyaya blocks the Gettier case, which is a strength.

