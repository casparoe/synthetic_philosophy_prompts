prompt: |-
  A few of us in my school's philosophy club started a mini podcast this year, and our advisor (who also teaches AP Euro) said that for the next episode we're allowed to interview a made-up guest instead of a real person, as long as they defend an actual position from the literature -- its supposed to force us to engage with the argument instead of just wikipedia-ing facts about some famous philosopher. I picked the whole Frege diary situation because we'd just covered his logic in my intro philosophy elective, and then I found out separately that he kept an actual diary for a few weeks in 1924 that's full of genuinely ugly stuff -- wanting Jews stripped of political influence, hoping for some kind of strongman to save Germany, hating the Weimar government and universal suffrage, being bitter about the French because of the Ruhr thing. What got me is that Michael Dummett, who's basically THE guy who built Frege's reputation in English AND was a real anti-racism campaigner in his own life, apparently said finding out about the diary genuinely shook him.

  My made-up guest is a philosophy of logic professor who thinks the standard "just separate the man from the math" move is too easy. Her actual thesis is that Frege's obsession with keeping logic "pure" -- kicking psychology out of it, insisting concepts have totally sharp boundaries with no vagueness allowed, thoughts existing in some objective "third realm" untouched by any one mind (which I read somewhere is literally called the "drittes Reich" in the original German, if I'm remembering that right, which honestly feels like an insane coincidence) -- comes from the same underlying temperament as his obsession with political and ethnic purity, not just a coincidence sitting next to it. Could you write me like 8 or 9 interview questions for her that don't just let her restate that thesis over and over? I specifically want: one question that makes her deal with the obvious objection (plenty of totally non-antisemitic logicians also cared about anti-psychologism and sharp concepts, so what does the correlation actually prove), one that brings in the Dummett angle and asks what his reaction is even evidence of, and one asking what would actually count as evidence against her own view. Please add a short follow-up after each question based on how she'd probably respond, so it's not just one level deep -- our advisor is big on "steelmanning" so I really don't want this coming off like we're just dunking on her.
