  ## Hume's Incomplete Emancipation: The Mercantilist Worm in the Philosopher's Apple

  Your retired econ professor isn't entirely wrong – David Hume delivered a devastating, foundational blow to core mercantilist doctrine. But his hero-worship overlooks crucial nuances where mercantilist anxieties and logic stubbornly persist within his own framework. **While Hume decisively shattered the mercantilist obsession with specie hoarding and perpetual trade surpluses, his theory of money harbors a distinctly mercantilist worm: the pursuit of *relative* advantage through monetary expansion, and his "jealousy" reveals a lingering mercantilist fear of decline.** The break was profound, but not pristine.

  **Granting the Strongest "Clean Break" Case:**

  Hume's demolition of mercantilism's core tenets is brilliant and undeniable in the passages you've identified:

  1.  **The Price-Specie Flow Mechanism ("Of the Balance of Trade"):** This is the sledgehammer. Hume demonstrated that mercantilist efforts to hoard gold and silver (specie) through trade surpluses were self-defeating. An influx of specie increases the domestic money supply, leading to inflation (rising prices). Higher prices make domestic goods less competitive internationally, reducing exports and increasing imports, causing specie to flow *out* again. Conversely, a specie outflow reduces the money supply, lowers prices, boosts competitiveness, and attracts specie back in. The system is self-regulating; persistent surpluses or deficits are impossible. This directly refuted the mercantilist nightmare of an "unfavorable" balance draining the nation's wealth.
  2.  **Rejection of Zero-Sum Trade ("Of the Jealousy of Trade"):** Hume explicitly attacked the mercantilist view that one nation's gain must be another's loss ("jealousy of trade"). He argued that prosperity is not a fixed pie. The growth and industry of neighboring nations stimulate demand, innovation, and emulation: "I shall therefore venture to acknowledge, that, not only as a man, but as a BRITISH subject, I pray for the flourishing commerce of GERMANY, SPAIN, ITALY, and even FRANCE itself." Increased trade benefits all participants through specialization and expanded markets. This fundamentally undermined the mercantilist rationale for protectionism and beggar-thy-neighbor policies.
  3.  **Wealth is Industry and Commodities, Not Just Money ("Of Money"):** Hume repeatedly emphasized that "money is none of the wheels of trade: It is the oil which renders the motion of the wheels more smooth and easy." True wealth lies in productive capacity, goods, and the industry of the people. Hoarding inert metal was pointless; its value stemmed solely from its facilitation of exchange. This shifted focus away from bullion accumulation towards real economic activity.

  **Arguing Past the Break: The Mercantilist Worm Survives**

  However, delving deeper into "Of Money" and "Of the Jealousy of Trade" reveals significant mercantilist residues:

  1.  **The Active Pursuit of Relative Advantage Through Monetary Expansion ("Of Money"):** This is the core of the worm. Hume argues that a nation benefits most not when its money supply is simply large, but when it is *actively increasing*:
      *   *The Lag Mechanism:* "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry." New money enters the economy through specific channels (e.g., exporters, miners, lenders). These recipients spend it *before* prices generally rise. They can hire more workers or buy materials at the *old* prices, effectively giving them a real income boost and stimulating production. Crucially, this happens *before* the new money diffuses and inflates *all* prices.
      *   *The Relative Edge:* This temporary lag creates a **competitive advantage**. Hume states: "The workman... finding that more money is now to be had for the same labour... he will naturally be tempted to increase his industry... [The manufacturer] will employ a greater number of workmen than formerly... It is easy to trace the money in its progress through the whole commonwealth; where we shall find, that it must first quicken the diligence of every individual, before it increase the price of labour." The key point: *during this lag*, domestic goods become relatively cheaper *compared to foreign goods* whose prices haven't yet adjusted to the new money supply. This boosts exports and dampens imports. **Hume explicitly links the benefit to this *relative* price shift:** "There is always an interval before matters be adjusted to their new situation; and this interval is as pernicious to industry, when gold and silver are diminishing, as it is advantageous when these metals are encreasing."
      *   *Mercantilist Echo:* This logic is perilously close to mercantilist thinking. While Hume rejects *permanent* hoarding, he advocates for policies (or celebrates circumstances) that create a *temporary* trade surplus fueled by monetary expansion giving domestic industry an artificial, monetary edge over foreign competitors. The goal isn't just domestic stimulation *in isolation*; the benefit hinges on gaining a *relative* advantage in international trade *during the transition*. This prioritizes a nation's position *against* others, echoing mercantilist concerns.

  2.  **The Lingering "Jealousy" and Fear of Decline ("Of the Jealousy of Trade"):** Despite his eloquent defense of mutual gains, Hume betrays a deep-seated anxiety about relative decline that feels distinctly mercantilist:
      *   *Loss of Manufacturing:* He frets: "Manufactures... gradually shift their places, leaving those countries and provinces which they have already enriched, and flying to others, whither they are allured by the cheapness of provisions and labour; till they have enriched these also, and are again banished by the same causes." His concern isn't just domestic adjustment; it's the *loss* of industry and wealth to rivals.
      *   *The "Rich Country" Problem:* He ponders whether a rich country (high wages/prices) can compete with a poor country (low wages/prices), worrying that the poor country might undersell the rich one: "The poverty of the common people in FRANCE, ITALY, and SPAIN, is, perhaps, a greater obstacle to the sale of our commodities than any other circumstance whatsoever." While he eventually concludes rich countries can compete via skill and capital, the mere presence of this lengthy, nervous discussion reveals a mercantilist-like preoccupation with relative position and the fear of being undersold by cheaper rivals – the very fear his "clean break" theory should alleviate. His solution ("emulation" and "industry") sounds more like a hope than a mechanism derived from his price-flow theory.

  **The Verdict: A Revolutionary But Imperfect Break**

  Hume delivered a revolutionary and essential critique that shattered the intellectual foundations of mercantilism's core tenets: the necessity of perpetual surpluses, the zero-sum nature of trade, and the equation of wealth with specie. He established the self-correcting mechanism of trade balances and powerfully advocated for the mutual benefits of commerce.

  **However, he did not fully escape the mercantilist paradigm.** The worm lives in two places:

  1.  **In his Monetary Theory:** The explicit mechanism by which an *increasing* money supply confers benefit relies on gaining a *temporary relative advantage in international trade* through the price lag. This conceptualizes trade success in relative, competitive terms fueled by monetary policy – a core mercantilist preoccupation, even if Hume saw it as temporary and self-limiting.
  2.  **In his Psychological/Political Anxiety:** The palpable "jealousy" and fear of losing manufacturing to cheaper rivals, despite his theoretical framework, reveals a mercantilist sensibility persisting beneath the surface logic. He intellectually grasped mutual gains but emotionally recoiled from the prospect of relative decline.

  **Therefore, your professor is half-right but fatally over-simplistic.** Hume killed the mercantilist dragon of specie hoarding and perpetual surplus obsession. But he inadvertently nurtured a mercantilist worm: the idea that a nation could and *should* seek competitive advantage through monetary dynamics (even if temporary), and the deep-seated fear of losing relative economic position. His break was monumental and essential for classical economics, but it was not "clean." The worm of relative advantage and competitive anxiety wriggled free from the hoarders' chest and found new refuge in the very theory that sought to bury its host. Your character might be insufferable, but giving him this nuanced flaw – an idol with clay feet visible only to those who read closely – makes him far more interesting than a dogmatic hero-worshipper.
