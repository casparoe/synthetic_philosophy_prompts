  hey so for my gov class we're doing this unit on democracy vs epistocracy and we got assigned part of john stuart mill's *considerations on representative government* (1861), where he's arguing some people should get more than one vote. i mostly get the general idea but this bit is messing with my head:

  "I hasten to say that I consider it entirely inadmissible, unless as a temporary makeshift, that the superiority of influence should be conferred in consideration of property. I do not deny that property is a kind of test; education, in most countries, though any thing but proportional to riches, is on the average better in the richer half of society than in the poorer. But the criterion is so imperfect; accident has so much more to do than merit with enabling men to rise in the world; and it is so impossible for any one, by acquiring any amount of instruction, to make sure of the corresponding rise in station, that this foundation of electoral privilege is always, and will continue to be, supremely odious. To connect plurality of votes with any pecuniary qualification would be not only objectionable in itself, but a sure mode of compromising the principle, and making its permanent maintenance impracticable. [...] The only thing which can justify reckoning one person's opinion as equivalent to more than one is individual mental superiority, and what is wanted is some approximate means of ascertaining that. If there existed such a thing as a really national education or a trustworthy system of general examination, education might be tested directly. In the absence of these, the nature of a person's occupation is some test. An employer of labor is on the average more intelligent than a laborer; for he must labor with his head, and not solely with his hands. A foreman is generally more intelligent than an ordinary laborer, and a laborer in the skilled trades than in the unskilled. A banker, merchant, or manufacturer is likely to be more intelligent than a tradesman, because he has larger and more complicated interests to manage. [...] Subject to some such condition, two or more votes might be allowed to every person who exercises any of these superior functions."

  so wait, he spends this whole part saying plural votes should NOT be based on property/money bc thats "odious" and unfair, but then two sentences later his actual system for deciding who gets extra votes is literally "employer vs laborer," "banker vs tradesman," stuff like that?? which just sounds like class/money again to me. is he contradicting himself or is there some real distinction hes making that im not getting. also kinda separate question but does this even still count as "epistocracy" like we've been talking about in class, since technically everyone still gets a vote, its just that some people get extra ones - feels like its own weird in-between thing. can someone help me untangle this
