answer: |-
  Here's a joke tailored to Taurek's core argument, followed by a gloss:

  **Joke:**  
  *Two ethicists watch a sinking ship with six survivors. Only one lifeboat seat remains.*  
  **First Ethicist:** "We must save the five! The loss of one is lesser!"  
  **Second Ethicist:** "Nonsense. Flipping a coin gives each of the six a fair chance. Anything else ignores the *separateness of persons*."  
  **First Ethicist:** "But... there are only six people."  
  **Second Ethicist:** "Exactly! Not five losses and one loss. Six individual *maybes*."  

  **Gloss:** *This riffs on Taurek’s rejection of aggregating harms across persons (the "five losses ≠ one greater loss" move) and his insistence that fairness requires a lottery when you can’t save all, giving equal weight to each individual’s claim.*

  ### Why it works for Taurek readers:
  1. **"Six individual *maybes*"** directly mocks Taurek’s view that the moral question is *only* about each person’s binary fate ("maybe saved/maybe not"), never about summing outcomes.  
  2. The punchline highlights the counterintuitive leap: prioritizing a *procedure* (coin flip for all) over minimizing total harm, even when the numbers are small and clear.  
  3. The second ethicist’s conflation of the *number of people* (6) with the *number of "losses"* (which Taurek insists are incommensurable) satirizes how his framework treats headcounts as irrelevant to moral weight.  
  4. Taurek fans recognize the "separateness of persons" as his foundational mantra; critics hear it as a non-sequitur justifying absurdity.  

  For non-readers, it’s just a weirdly rigid ethicist. For your seminar, it’s battlefield humor.
