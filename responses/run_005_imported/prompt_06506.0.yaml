answer: |-
  You've hit the nail on the head regarding the core tension – and your skepticism about supervaluationism hiding a sharp boundary is *exactly* the right question. Let's break down the key differences and why supervaluationism *does* offer a distinct (and arguably better) account, even if it doesn't entirely escape the specter of precision.

  **1. Epistemicism: The Unknowable Knife-Edge**

  *   **Core Claim:** Vagueness is purely a matter of **ignorance**. For any vague predicate ("is a heap," "is bald," "is tall") and any sorites series (gradual removal of sand grains, hairs, etc.), there **is** a single, exact, metaphysically sharp boundary where the predicate flips from true to false.
  *   **Nature of the Boundary:** This boundary is a **fact of the world** or the meaning of the word itself. It's fixed, but *unknowable* to us. Williamson argues our linguistic competence and cognitive limitations prevent us from pinpointing it (like knowing *exactly* how many milliseconds a sound lasts while still distinguishing "short" from "long").
  *   **Consequence for the Paradox:** The Sorites argument is **invalid** because it falsely assumes there is *no* such sharp boundary. The paradox arises because we mistakenly think the tolerance principle ("Removing one grain doesn't turn a heap into a non-heap") is universally true. It *is* true for nearly all cases, but it fails *exactly once* at the hidden boundary. We just can't know where that failure point is.
  *   **Problem:** This seems deeply counterintuitive. Is there *really* a specific grain such that *before* removal it's a heap, and *after* it's not? Our linguistic practices and intuitions strongly resist this. It makes vagueness seem like a bizarre epistemological defect rather than an inherent feature of language and the world.

  **2. Supervaluationism: Truth Under Every Way of Being Precise**

  *   **Core Claim:** Vagueness is a **semantic indeterminacy**. The meaning of a vague predicate doesn't specify *one* precise boundary; it **allows for many equally legitimate ways of making it precise** (called "precisifications" or "admissible sharpenings").
  *   **Nature of Boundaries:** Yes, *each admissible precisification* has a sharp boundary. **BUT:** Crucially, there is **no single privileged boundary** dictated by the meaning of the word itself. The vagueness *consists* in the existence of multiple, equally valid boundaries.
  *   **Key Concepts:**
      *   **Supertruth:** A statement is **supertrue** if it is true on *every* admissible precisification.
      *   **Superfalsehood:** A statement is **superfalse** if it is false on *every* admissible precisification.
      *   **Indeterminacy/Truth-Value Gap:** A statement is **indeterminate** if it is true on *some* precisifications and false on *others*.
  *   **Consequence for the Paradox:**
      *   **Tolerance Principle:** "Removing one grain from a heap still leaves a heap" is **indeterminate**. For grains in the clear heap zone, it's true on *all* precisifications (supertrue). For grains in the clear non-heap zone, it's false on *all* precisifications (superfalse). But *in the borderline region*, it's true on *some* precisifications (those where the boundary is *after* that grain) and false on *others* (those where the boundary is *before* that grain).
      *   **The Paradox Itself:** The Sorites argument is **supervalid** (its conclusion follows from its premises on every precisification), **BUT** the crucial tolerance premise is **not supertrue**. It's indeterminate in the borderline region. Since logic (classically applied) requires premises to be straightforwardly true/false, the argument fails because it relies on a premise that isn't definitely true.
  *   **Avoiding the Epistemicist Commitment?** This is the crux. Supervaluationism **avoids committing to a *single*, *metaphysically privileged* sharp boundary** known only to an omniscient being. Instead, it commits to:
      1.  **A range** of possible sharp boundaries (the borderline area).
      2.  The **semantic fact** that the meaning of the word doesn't select *one* of them as *the* correct one.

  **The Disguise? The Real Difference:**

  Your intuition is sharp: both theories involve precise boundaries *somewhere* in the machinery. **The critical difference is ontological vs. semantic:**

  *   **Epistemicism:** There is **One True Boundary** out there in the world/meaning. We are tragically ignorant of it. Vagueness = Ignorance.
  *   **Supervaluationism:** There is **No One True Boundary** specified by the meaning. The meaning *permits many*. Vagueness = Semantic Underdetermination. The boundaries exist only as *options* within admissible interpretations, not as a hidden fact.

  Supervaluationism replaces the mysterious *unknowable fact* with a *semantic openness*. While each precisification is sharp, the *meaning of the word itself* is not sharp. The "sharpness" is a feature of how we *model* precision, not a feature of reality or the core meaning.

  **The Verdict: Which Gives the Better Account?**

  Neither is perfect. Both struggle with higher-order vagueness (is the borderline region itself sharply defined?). But **supervaluationism offers the more plausible and palatable account overall**:

  1.  **Avoids Mysterious Ignorance:** It doesn't postulate unknowable facts about mundane concepts like "heap" or "bald." Our inability to pinpoint a boundary stems naturally from the meaning *not specifying one*, not from cognitive failure.
  2.  **Captures Indeterminacy:** It directly models the intuitive feeling that borderline cases genuinely lack a definite truth value ("It's neither clearly a heap nor clearly not a heap").
  3.  **Explains Incoherence of Tolerance:** It shows *why* the tolerance principle feels plausible (it *is* true for clear cases) but ultimately fails (it's not *definitely* true across the whole spectrum).
  4.  **Aligns with Linguistic Practice:** It better reflects how we actually use vague predicates – we accept different reasonable ways of drawing the line in different contexts without thinking one is "absolutely right" and others "wrong but indistinguishable."

  **Epistemicism's main strength** is its logical simplicity and adherence to classical bivalence (every statement is simply true or false, even if we don't know which). However, this strength comes at the high cost of postulating those unknowable sharp boundaries, which feels like a solution *imposed* on the phenomenon rather than one that *explains* it naturally.

  **Conclusion:** Your instinct is correct that supervaluationism doesn't banish precise boundaries entirely. It incorporates them as part of its *semantic machinery*. **However, it fundamentally avoids epistemicism's core commitment to a *single, unknowable, metaphysically sharp boundary*.** Instead, it explains vagueness as the *semantic underdetermination* of the predicate's extension, manifested as a *range* of equally acceptable boundaries. While both theories involve precision *somewhere*, supervaluationism locates it in the *models we use to understand meaning*, not in the meaning itself or the world. **Therefore, supervaluationism provides the significantly better account of vagueness.** It takes the "sharpness" seriously but deflates its metaphysical mystery, offering a more intuitive explanation of why the Sorites paradox arises and how borderline cases genuinely lack definite truth values.
