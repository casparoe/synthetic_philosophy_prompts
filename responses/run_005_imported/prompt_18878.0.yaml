answer: |-
  Let's break this down move-by-move, referencing key ideas in causation theory (especially omission literature by Schaffer, McGrath, Beebee, etc.):

  **Step 1: Marcus's Initial Claim**  
  *"Sam caused the corruption... he's the one who didn't act when he should've."*  
  **Analysis:** Marcus relies on **normative expectation** (duty) to pick Sam's omission as causal. This aligns with folk attributions but conflates *causation* with *responsibility*. Ilana will rightly challenge the causal part.  
  **Who's ahead?** Neither yet – Marcus captures intuition, but Ilana's counter is looming.

  **Step 2: Ilana's Overgeneration Objection**  
  *If omissions = "didn't prevent X," then Priya/sysadmin/everyone with SSH access caused it. But we don't say that → the theory is flawed.*  
  **Analysis:** Ilana nails the **central problem of omissions**: their "overabundance" (Schaffer). If every possible preventer is a cause, causation becomes meaningless. Her point exposes that *pure counterfactual dependence* (if Sam/Priya acted, corruption wouldn’t occur) can’t distinguish Sam/Priya.  
  **Who's ahead?** **Ilana** – she identifies a critical weakness in naïve omission-as-cause views.

  **Step 3: Marcus's Normative Salience Reply**  
  *Sam’s on-call duty makes his omission a "departure from what was supposed to happen."*  
  **Analysis:** Marcus invokes **contrastive causation** (Schaffer): causation requires a *relevant contrast*. Sam’s omission contrasts with his expected *baseline action* (due to duty); Priya’s doesn’t. This avoids overgeneration by restricting "relevant omissions" to norm-governed contexts.  
  **Who's ahead?** **Marcus** – he offers a principled (non-arbitrary) distinction grounded in social/normative facts.

  **Step 4: Ilana's Physicalism Objection**  
  *"The disk doesn't know about the on-call spreadsheet... duty is obligation smuggled into causation."*  
  **Analysis:** Ilana defends **causal fundamentalism**: causation must supervene on physical facts. The disk filled identically regardless of duty rosters → normative facts can’t *alter causal structure*. Marcus’s view makes causation mind-dependent.  
  **Who's ahead?** **Ilana** – she exposes Marcus’s reliance on non-physical facts, challenging core metaphysical assumptions.

  **Step 5: Marcus's Pragmatic Turn**  
  *"Nobody thinks dozens caused it → ordinary usage rejects pure counterfactualism."*  
  **Analysis:** Marcus shifts to **pragmatics/epistemology**: if a theory (pure counterfactualism) conflicts with universal intuitions, it’s flawed. Ilana’s view leads to absurd conclusions → we need normative constraints.  
  **Who's ahead?** **Marcus** – he highlights that Ilana’s "pure" view is revisionist and unintuitive.

  **Step 6: Ilana's Metaphysical Challenge**  
  *"If no on-call rotation existed, the disk fills the same way → how can a calendar change causation?"*  
  **Analysis:** Ilana forces the **supervenience problem**: if physical processes are identical in worlds with/without duty rosters, how can Sam’s omission *cause* anything in one world but not the other? This suggests duties are *explanatory* but not *causally efficacious*.  
  **Who's ahead?** **Ilana** – she shows Marcus’s view implies causal facts depend on extrinsic, non-physical factors.

  ---

  ### What Both Miss
  - **The distinction between *causal contribution* and *causal selection***: All potential preventers *contributed* to the outcome by not acting (counterfactual dependence), but we *select* Sam as "the cause" due to norms (Knobe & Hitchcock).  
  - **Contrastivism**: Causation is ternary: *c* rather than *c*' causes *e* rather than *e*' (Schaffer). Sam’s omission caused corruption *rather than normal operation*; Priya’s didn’t because no contrast class exists for her.  
  - **Double prevention**: Sam’s inaction isn’t "nothing" – it’s a *failure to interrupt* a process (disk filling). But this still faces overgeneration without norms.

  ---

  ### Overall Verdict
  **Ilana wins the metaphysical battle**, exposing that duties can't *fundamentally* alter causation without violating physicalism or inviting absurd overgeneration. Marcus wins the *pragmatic* battle, showing norms are indispensable for *picking out "the" cause* in everyday contexts. But since the debate centers on causal metaphysics (not blame or semantics), Ilana’s critique is more damaging to Marcus’s core claim that Sam *caused* it in a strict sense.  

  \answer{Ilana}
