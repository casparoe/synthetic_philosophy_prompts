  Ok so I just spent like two hours arguing with my friend about the doomsday argument and neither of us budged an inch. She's fully bought into SSA (self-sampling assumption) — reasoning that since your birth rank is presumably somewhere near the middle of all humans who will ever be born, you should update toward the species ending relatively soon instead of lasting for trillions more years. I kept pushing back with SIA (self-indication assumption), which cancels that update out, but she just says SIA has to bite an even weirder bullet with the presumptuous philosopher thing. We went round in circles for ages. Can you write me a dialogue between an SSA defender and an SIA defender actually hashing this out properly? I want them to hit each other with their strongest objections — the reference class problem for SSA, the presumptuous philosopher for SIA — and actually respond to each others points instead of just repeating their own side. Don't give me some neat resolution at the end either, bc honestly i don't think there is one.
