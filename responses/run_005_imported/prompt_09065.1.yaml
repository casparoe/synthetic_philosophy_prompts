  We are grading the answer in four parts, each worth 5 points, and then an overall letter grade. Let's break down the answer and assign points for each section.

  1. **Handicap Principle and Peacock Explanation (5 points)**
     - The student correctly explains Zahavi's handicap principle: that signals are honest because they are costly. The peacock's tail is described as costly to grow and maintain and making the peacock more vulnerable to predators. Only high-quality males can afford this cost, so it honestly signals fitness.
     - However, the student incorrectly states that this is "essentially the same mechanism as Fisher's runaway selection." This is a significant error because Fisher's runaway selection is a different mechanism (based on a genetic correlation between female preference and the male trait, leading to a positive feedback loop) and does not rely on the cost as a guarantee of honesty. The handicap principle is about costly signals ensuring honesty, while Fisher's model does not require the trait to be costly in the same way (it can be arbitrary). 
     - Therefore, we deduct for this confusion. The rest of the explanation is correct.

     Score: 3.5 out of 5 (due to the error in equating with Fisher's runaway)

  2. **The 1990 Model Part (5 points)**
     - The student states that biologists were skeptical until 1990 when Richard Dawkins built a mathematical model. However, the model was actually published by Alan Grafen, not Richard Dawkins. Dawkins popularized the idea in his book, but Grafen is the one who published the model. This is a factual error.
     - The explanation of the model is otherwise correct: the cost keeps the signal honest because low-quality males cannot afford the same cost as high-quality males, making it an evolutionarily stable strategy. The mention of borrowing from economic signaling theory is good.
     - Because of the incorrect attribution (Dawkins instead of Grafen), we deduct.

     Score: 3 out of 5 (for the major error in naming the author)

  3. **Index vs. Handicap Distinction (5 points)**
     - The student correctly defines an index signal as being automatically honest due to physical constraints and gives the example of the deer's roar (pitch tied to vocal tract size). 
     - The student also correctly contrasts this with a handicap signal, which requires an added cost to maintain honesty (like the peacock's tail).
     - The example for the index signal (deer roar) is appropriate. The example for the handicap signal (peacock's tail) is also appropriate and consistent with the question.
