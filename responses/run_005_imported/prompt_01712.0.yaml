  I recall Wittgenstein's "Lectures on Religious Belief" specifically addresses this. He gives that example about the Last Judgment - how a believer and atheist aren't contradicting each other empirically but operating in different frames. That's crucial here. The believer isn't making a scientific prediction but expressing a framework for life.

  Wait, but the skeptic has a point about actual believers thinking they're describing reality. Wittgenstein would probably say: yes, they are - but "reality" means something different in religious language games. It's not about competing with physics but about ultimate meaning. 

  The "equally valid" question is tricky. Wittgenstein isn't a relativist; he'd reject that framing. Different language games have different standards of validity internal to them. Comparing across games misses the point - like asking if chess is "more valid" than football.

