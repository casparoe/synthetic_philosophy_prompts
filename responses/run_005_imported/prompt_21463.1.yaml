prompt: |-
  okay so my friend and I got into it for like two hours last night over the ontological argument and neither of us gave any ground, so I need a tiebreaker. She kept coming back to Gödel's modal version, the one with "positive properties" and the S5 axiom, and her big point was that it's been formalized and actually run through computer proof assistants, checking out as logically valid. Her conclusion was basically: once an argument is valid AND machine-verified, its not really a matter of philosophical opinion anymore, its closer to a proven fact, the same way a theorem in math is. So if that's basically settled, how come most professional logicians and philosophers of religion don't just treat it as a real proof, and plenty of them stay atheists or agnostics anyway? Is everyone just being stubborn, or is her framing off somewhere?
