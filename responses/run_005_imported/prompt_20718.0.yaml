prompt: |-
  So we had a nasty outage at work last week - payments service was down for like 40 minutes. Now my team lead and I keep butting heads over how to write the postmortem. She wants it to boil down to one general rule, like "whenever the load balancer is in state X and theres a cache-miss storm at the same time, the service falls over" - something that'd explain this outage and any future one like it. I think that leaves out everything that actually happened though: the on-call engineer misreading an alert, an unrelated deploy from another team making things worse, and a warning system we'd switched off the week before for totally unrelated reasons. To me the play-by-play of what actually happened IS the explanation, but she keeps saying a pile of coincidences isn't a real explanation unless it boils down to a general rule like that. Who's actually right here, or is this just a matter of taste?
reasoning: |-
  Okay, let me start by understanding the user's problem. They had a significant outage at work, and now there's a disagreement between them and their team lead on how to write the postmortem. The user feels that including all the specific events—like the engineer misreading an alert, an unrelated deploy, and a disabled warning system—is crucial to explain what happened. Their team lead, however, wants to distill everything into a general rule that can prevent future similar outages.

  First, I need to recognize the core of the conflict. The team lead is focused on creating actionable, high-level insights that can be turned into preventative measures. The user is concerned that omitting the specific details glosses over the real, messy human and procedural factors that contributed to the outage. Both perspectives have valid points, but they serve different purposes in a postmortem.

  I recall that effective postmortems often balance both aspects. High-level rules help in systemic improvements, while detailed narratives highlight vulnerabilities in processes and human factors. The user mentioned several specific incidents: the misread alert, the unrelated deploy, and the disabled warning system. These are critical because they point to gaps in training, communication, and monitoring—areas that might not be covered by a general technical rule.

  The team lead's approach risks oversimplifying. If the postmortem only states a technical cause, like the load balancer and cache-miss storm, it ignores the procedural flaws that allowed the issue to escalate. For example, why was the warning system turned off? Why did the unrelated deploy happen during an incident? These are separate issues that need addressing beyond the technical rule.

  On the other hand, the user's detailed account without synthesis might miss the opportunity to prevent recurrence. If the report only lists events without linking them to underlying problems, it becomes a story without clear action items. The key is to connect each specific incident to a broader category of failure, like monitoring gaps or change management flaws.

  I should also consider the user's unspoken needs. They might feel that their team lead is dismissing the human elements of the outage, which could lead to frustration and repeated issues. The user likely wants to ensure that the postmortem leads to meaningful changes that address both technical and procedural aspects. They might also be seeking validation that their perspective is valuable in preventing future outages.

  Looking at best practices, postmortems should include both a timeline of events and a section on root causes that generalizes the issues. Each contributing factor—like the disabled alert or the misread alert—should have a corresponding action item. For instance, reviewing alert configurations or improving training for on-call engineers.

  The challenge is to present a structure that satisfies both needs. Maybe suggesting sections that separate the narrative from the analysis, but explicitly linking each event to a root cause. This way, the detailed events are included, and each is tied to a general principle or action. For example, the disabled warning system points to the need for better documentation of monitoring changes, which is a general procedural improvement.

  Another angle is the purpose of the postmortem. It's not just to explain what happened but to drive improvements. The team lead is right that without generalization, it's hard to create preventative measures. But the user is correct that without specifics, the report misses critical context. The solution lies in showing how the specifics illustrate systemic issues.

  I think the user's deeper need is for the postmortem to acknowledge the complexity of the outage and ensure that all contributing factors are addressed. They might fear that oversimplification will lead to incomplete fixes, leaving the system vulnerable to different failures in the future. By integrating both approaches, the postmortem can be comprehensive and actionable, addressing both immediate technical fixes and long-term procedural improvements.
answer: |-
  This isn't just a matter of taste; **both perspectives are essential for a truly effective postmortem, but they serve fundamentally different purposes.** Your team lead is focusing on **prevention**, while you're focusing on **understanding**. **You're *both* right, and the best postmortem integrates both.**

  Here's the breakdown:

  1.  **The "General Rule" (Team Lead's View - Prevention Focus):**
      *   **Purpose:** To identify the *underlying systemic vulnerability* that allowed the outage to happen. This is the "root cause" in the sense of "what fundamental weakness did we exploit?"
      *   **Value:**
          *   **Actionable:** Points directly to *what needs to be fixed/changed* in the system or processes to prevent *this class* of failure in the future. (e.g., "Implement circuit breakers between LB and cache layer," "Redesign cache population strategy," "Enforce stricter LB state monitoring").
          *   **Predictive:** Helps anticipate similar failures triggered by different specific sequences of events that exploit the same vulnerability.
          *   **Prioritization:** Highlights the most critical systemic weakness to address.
      *   **Weakness (if used alone):** It abstracts away the human, procedural, and contextual factors that turned a vulnerability into an actual *incident*. It risks missing contributing factors that aren't purely technical.

  2.  **The "Play-by-Play" (Your View - Understanding Focus):**
      *   **Purpose:** To document the *specific sequence of events and decisions* that led *this particular incident* to unfold as it did. This explains the *how* and *why* of *this* outage.
      *   **Value:**
          *   **Completeness:** Captures the full complexity of real-world incidents, including human factors, process failures, and environmental context.
          *   **Learning:** Provides concrete examples for training, highlights gaps in procedures (e.g., alert fatigue, misinterpretation, change management), and reveals unexpected interactions (e.g., the unrelated deploy).
          *   **Accountability (for process, not blame):** Shows where procedures broke down (misread alert), where assumptions were wrong (disabled warning system), and where coordination failed (unrelated deploy during instability).
          *   **Nuance:** Explains *why* this specific combination of factors led to a 40-minute outage, not just that the vulnerability exists.
      *   **Weakness (if used alone):** It can become just a story. Without synthesis, it doesn't clearly point to the *fundamental changes* needed to prevent recurrence. It risks focusing only on "this exact sequence won't happen again," while leaving the core vulnerability intact for *other* sequences to exploit.

  **Why You Need Both:**

  *   **The General Rule tells you *what* broke fundamentally.** (The systemic vulnerability: LB state X + Cache-miss storm = Failure)
  *   **The Play-by-Play tells you *how* and *why* it broke *this time*.** (The specific triggers and failures that exploited that vulnerability: Misread alert delayed detection -> Unrelated deploy exacerbated load -> Disabled warning system prevented early intervention -> Resulting in 40 min outage).

  **How to Structure the Postmortem for Maximum Impact:**

  1.  **Timeline:** Start with the detailed chronological sequence of events (your "play-by-play"). Include:
      *   Initial trigger(s)
      *   Actions taken (and decisions made) by engineers
      *   Misinterpretations (e.g., misread alert)
      *   Compounding factors (e.g., unrelated deploy)
      *   Missing mitigations (e.g., disabled warning system)
      *   Escalation path
      *   Resolution steps

  2.  **Impact:** Quantify the damage (duration, $ lost, customers affected).

  3.  **Root Cause Analysis (The Synthesis - Combining Both Views):** This is the critical section.
      *   **Identify the Proximate Cause(s):** The immediate technical failure (e.g., "Service became unresponsive due to cascading failures triggered by sustained high error rates under specific LB state during a cache-miss storm").
      *   **Identify the Underlying Systemic Cause(s):** (The Team Lead's Rule). State the vulnerability clearly: "The service lacks resilience to the combination of [Specific LB State] and [Cache-Miss Storm Pattern]."
      *   **Identify Key Contributing Factors:** (From your Play-by-Play). Explicitly call out the human/process failures that *allowed* the underlying vulnerability to cause *this major incident*:
          *   "Alert [X] was misinterpreted due to [reason - e.g., unclear wording, fatigue]."
          *   "Change control process did not prevent a high-risk deploy [Y] during a period of known instability."
          *   "Warning system [Z] was disabled without a compensating monitoring strategy or documented justification/review."
          *   "Runbook for [Scenario] was missing/inadequate."

  4.  **Action Items (Tied Directly to Causes & Factors):**
      *   **Prevent Recurrence (Address Systemic Cause):** "Implement [Specific Technical Fix] to mitigate the LB State + Cache-Miss vulnerability by Q3."
      *   **Improve Detection (Address Contributing Factors):** "Redesign alert [X] for clarity; implement fatigue-reduction strategy." "Re-enable and enhance warning system [Z] with documented ownership and review process."
      *   **Improve Response/Mitigation (Address Contributing Factors):** "Update change control policy to restrict deploys during active warnings/severe alerts." "Create/update runbook for LB State X scenarios." "Conduct training on alert interpretation for [Specific Alert Type]."
      *   **Improve Resilience (Broader):** "Evaluate circuit breaker pattern between LB and cache service." "Review monitoring coverage for cache efficiency metrics."

  **Conclusion:**

  *   **Your team lead is right** that without distilling the *systemic vulnerability*, the postmortem fails to drive the most critical preventative actions. A pile of coincidences *does* need to point to a fundamental weakness.
  *   **You are right** that ignoring the specific sequence of events, human decisions, and process failures renders the postmortem incomplete and misses crucial opportunities for improving detection, response, and operational hygiene. These factors explain *why* the outage was *this bad*.

  **The winning postmortem does both:** It tells the compelling story of *this specific incident* (your play-by-play) to build understanding and empathy, and it ruthlessly extracts the *generalizable lessons and vulnerabilities* (team lead's rule) to drive meaningful, preventative action. **Argue for structure, not exclusion.** Show how the detailed timeline *leads to* the identification of the systemic cause and the key contributing factors, which then directly inform the action items. This is how you turn an outage into genuine improvement.
