  Move 5: Dan accuses Mark of making excuses and not owning his mistakes. If true, this shows a double standard, which is a legitimate point about fairness. +1 or +2? Probably +1 since it's conditional on Mark actually doing this.

  Move 6: Mark argues that Dan's logic would prevent anyone imperfect from criticizing. But Dan isn't saying that—he's calling out hypocrisy specifically. Mark's overgeneralizing here, so -1.

