answer: |-
  Here's a detailed breakdown of the student's answer and a suggested grade, followed by a JSON rubric:

  ### Grading Breakdown (Out of 20)

  1.  **Explains the Problem of Honest Signaling:**
      *   **Student:** "if signaling quality were cheap, low-quality individuals could just fake it, so over time signals would stop being informative."
      *   **Assessment:** **Excellent (2/2)**. Clearly and concisely states the core problem Zahavi addressed.

  2.  **Explains Zahavi's Handicap Principle:**
      *   **Student:** "a signal stays honest only if it's costly enough that faking it isn't worth it for a low-quality individual, so mainly high-quality individuals can afford to produce it."
      *   **Assessment:** **Excellent (4/4)**. Perfectly captures the essence of the handicap principle: cost ensures honesty by making it uneconomical or impossible for low-quality individuals to produce the signal effectively.

  3.  **Uses Peacock's Tail as Example & Explains Why Costly:**
      *   **Student:** "a huge, brightly colored train is expensive to grow and makes the male slower and more visible to predators... Only a male in excellent condition can grow a train like that and still survive... peahens that prefer big trains are effectively choosing mates that have proven their quality by surviving in spite of a real handicap."
      *   **Assessment:** **Excellent (4/4)**. Clearly uses the peacock's tail as the requested example. Accurately identifies the costs (energy to grow, increased predation risk via slowness/visibility). Correctly links the survival *despite* the cost as proof of quality and the basis for female choice.

  4.  **Explains Why the Signal *Has* to be Costly:**
      *   **Student:** Implicitly and explicitly covered in points 2 & 3. The necessity of cost is the core of their explanation of the principle and the example ("costly enough that faking it isn't worth it", "Only a male in excellent condition can... still survive").
      *   **Assessment:** **Excellent (3/3)**. The answer consistently emphasizes that cost is the *mechanism* ensuring honesty, preventing cheating, and allowing reliable assessment of quality. No points deducted.

  5.  **Briefly Mentions How the Idea Got Theoretical Backing:**
      *   **Student:** "it was eventually given solid mathematical backing by Fisher's runaway selection model... proving that a costly ornament like the peacock's tail really can be a stable, reliable indicator of quality."
      *   **Assessment:** **Incorrect/Misattributed (0/4)**. This is the major flaw.
          *   **Wrong Model:** Fisher's runaway selection model (developed in the 1930s) is a *different* mechanism for the evolution of sexual ornaments. It explains how a preference and a trait can co-evolve in a positive feedback loop, but it **does not inherently require or explain the honesty of the signal based on cost.** Runaway can work with arbitrary or even detrimental traits.
          *   **Correct Model:** The theoretical backing for Zahavi came much later, primarily from **Alan Grafen** in the early 1990s. Grafen developed game-theoretic/optimality models showing that under specific conditions (like differential costs based on quality), costly signals *can* evolve as stable honest indicators of quality. This provided the missing mathematical rigor Zahavi's verbal argument lacked.
          *   **Consequence:** The student fundamentally misattributes the theoretical validation, suggesting the wrong mechanism (runaway) proves Zahavi right, when Grafen's work was the key.

  6.  **Accuracy of Historical Context:**
      *   **Student:** "Zahavi's idea was pretty controversial at first and mostly dismissed as an unproven, purely verbal argument"
      *   **Assessment:** **Good (1/2)**. Correctly states it was initially controversial and dismissed due to lack of formal modeling. Loses a point for not mentioning the *duration* of the controversy (roughly 20 years) or the key figure (Grafen) who resolved it, though this detail is less critical than the model error.

  7.  **Clarity, Conciseness, and Terminology:**
      *   **Student:** Well-written, logical flow, uses key terms correctly ("handicap", "honest signal", "costly", "genuine handicap", "genetically linked" - though this last one is misplaced in the runaway context).
      *   **Assessment:** **Excellent (3/3)**. Very clear and concise explanation of the core concepts (except the theoretical backing).

  **Overall Grade: 17/20 (B+)**

  *   **Strengths:** Masterful explanation of the problem, Zahavi's principle, the necessity of cost, and the peacock example. Excellent writing.
  *   **Weakness:** A significant error in attributing the theoretical validation to Fisher's runaway selection instead of Grafen's models. This misrepresents *how* the principle was proven theoretically.

