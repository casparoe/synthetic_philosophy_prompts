prompt: |-
  okay so i'm the sophomore rep on my school's ASB Constitution Committee, and this week we're voting on a proposal from the elections chair: before anyone can vote for ASB president they have to pass a quick 10-question quiz on what the officers actually do, since turnout is only like 20% and most people who do vote can't even say what the treasurer does. our advisor pointed out that this is basically the same move as the literacy tests used to keep people from voting in the Jim Crow south, which kind of derailed the meeting -- the elections chair says its different bc the quiz is retakeable and its about our actual student gov instead of general literacy. i have to write the committee's decision memo before we present to full council thursday: it needs to actually recommend adopt, reject, or adopt-with-changes, give real reasons, and it can't just wave away the literacy-test comparison, it has to actually engage with it. can you draft that for me?
reasoning: |-
  Okay, the user is a sophomore on their school's ASB Constitution Committee. They need to draft a decision memo about a proposal requiring a quiz before voting for ASB president. The main conflict is between increasing informed voting and the historical parallel to literacy tests. 

  First, I need to unpack the core tension: the elections chair wants voters to understand officer roles (valid goal given 20% turnout), but the advisor invoked Jim Crow literacy tests (serious historical weight). The user can't gloss over this comparison—it must be addressed head-on in the memo. 

  Hmm... the key differences seem to be: retakeability (no permanent barrier) and topic specificity (ASB functions vs. arbitrary knowledge). But even with those safeguards, the *optics* of a voting prerequisite are dangerously close to historical voter suppression tactics. The committee can't ignore that symbolism, especially in a school setting meant to model good civic practice. 

  Alternative approaches might satisfy both sides: mandatory info sessions instead of tests, or quiz-as-encouragement (vote without passing but get resources). The memo needs concrete recommendations—adopt-with-changes feels right, but the changes must fundamentally shift the mechanism away from "gatekeeping." 

  User's deeper needs: 
  - They likely want to support informed voting without endorsing something ethically shaky. 
  - They need cover for potentially disagreeing with both advisor (who shut down discussion) and elections chair (who dug in). 
  - The memo must demonstrate nuanced thinking to senior council members. 

  Structure-wise: 
  Start by validating both concerns (low turnout *and* historical parallels), then pivot to solutions that avoid the test-as-barrier model. Stress that intent ≠ impact, and student gov should lead by example on accessible voting. Recommend rejecting the quiz as proposed but counter-proposing alternatives that educate without excluding. 

  ...And avoid academic jargon. They're a sophomore; clarity over cleverness.
answer: |-
  Here’s a draft decision memo that addresses the proposal’s intent, engages critically with the literacy-test comparison, and offers a principled recommendation. Adjust names/titles as needed:

  ---

  **TO:** ASB Full Council  
  **FROM:** Constitution Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Proposal #24-01 (Voter Quiz Requirement for ASB President Elections)  

  ### Proposal Summary
  The Elections Chair proposes requiring voters to pass a 10-question quiz on ASB officer duties before casting a ballot for ASB President. The goal is to increase voter awareness of student government functions, citing low turnout (20%) and anecdotal evidence of voter unfamiliarity with roles (e.g., Treasurer duties).

  ### Committee Deliberation
  The committee acknowledges the **valid intent** behind the proposal: promoting informed voting in ASB elections. However, after thorough debate, we identify significant concerns:

  1. **Historical Parallel to Literacy Tests**:  
     The advisor’s comparison to Jim Crow-era literacy tests warrants serious consideration. While key differences exist (e.g., this quiz is retakeable, ASB-specific, and not racially targeted), **the core mechanism—conditioning voting rights on passing a test—creates a concerning precedent**. Even with benign intent, such barriers risk:
     - **Disproportionate Impact**: Students with learning differences, language barriers, time constraints (e.g., athletes, caretakers), or disengagement may face unintended exclusion.
     - **Erosion of Inclusivity**: Voting should prioritize accessibility; adding steps contradicts this principle, regardless of the test’s simplicity.
     - **Symbolic Harm**: Associating ASB elections with historical tools of voter suppression undermines trust in student democracy.

  2. **Practical Effectiveness**:  
     A quiz may incentivize rote memorization, not genuine civic engagement. It does not address root causes of low turnout (e.g., lack of candidate outreach, perceived irrelevance of ASB).

  3. **Alternative Solutions**:  
     Less restrictive methods exist to educate voters (e.g., mandatory candidate forums, infographics in voting booths, social media campaigns, QR codes linking to role descriptions).

  ### Recommendation: **REJECT** (with Alternative Path Forward)
  The committee **recommends REJECTING Proposal #24-01** as submitted. Conditioning voting rights on a test, however well-intentioned, is incompatible with ASB’s mission to represent *all* students. The literacy-test comparison, while not identical, highlights a fundamental risk: using knowledge as a gatekeeper to participation. 

  ### Proposed Alternatives
  We urge the Elections Chair and Council to pursue these solutions instead:
  1. **"Strongly Encouraged" Pre-Vote Quiz**: Offer the quiz as an optional tool (e.g., via QR code on ballots) with instant feedback, *without* blocking ballot access.
  2. **Mandatory Education Campaign**: Require candidates to co-create/share 60-second videos explaining each role, promoted before/during elections.
  3. **Voter Guide**: Distribute a simple, visually engaging guide (digital/print) detailing officer duties with voting materials.
  4. **Turnout Incentives**: Tie participation to class competitions or reward draw entries (e.g., "Complete quiz → extra raffle entry").

  ### Conclusion
  Promoting informed voting is a shared priority, but methods must align with ASB’s values of equity and accessibility. The committee stands ready to collaborate on implementing the alternatives above before the next election cycle.

  Respectfully submitted,  
  [Your Name], Sophomore Representative  
  ASB Constitution Committee  

  ---

  ### Key reasons this memo works:
  1. **Acknowledges Intent**: Validates the Elections Chair’s goal upfront.  
  2. **Engages the Comparison**: Doesn’t dismiss the advisor’s point; uses it to highlight structural risks.  
  3. **Focuses on Impact Over Intent**: Emphasizes *how* the mechanism could exclude, regardless of design.  
  4. **Offers Solutions**: Shifts focus to inclusive alternatives (shows proactive problem-solving).  
  5. **Clear Recommendation**: "Reject" is unambiguous but paired with constructive next steps.  
  6. **Principles-Based**: Anchors in ASB’s duty to represent all students.  

  **Before submitting**:  
  - Confirm committee consensus on rejection/alternatives.  
  - Replace bracketed info.  
  - Add specific examples of "disproportionate impact" if possible (e.g., "students in after-school jobs").  
  - Run it by your advisor for tone checks!
