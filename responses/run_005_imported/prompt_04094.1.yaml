  The measurement analogy is crucial here. The user's experience with significant figures and instruments that could always be more precise mirrors the margin for error. But in metrology, we accept that measurements have uncertainty; we report values with error margins. Williamson is saying knowledge requires a similar margin, so exact empirical knowledge might be impossible. That seems too strong to the user, and I need to address that tension.

