  *checks imaginary watch* Better structure this: first confirm their reading isn't wrong, then unpack the two tyranny types, then explain why Aquinas still fears chaos even when rebellion seems justified. Maybe quote *De Regno* 1.6 on the "remedy" being public—oh! And note how he calls private tyrannicide "dangerous" even when deserved. Classic medieval priority of order over justice. 

