answer: |-
  You've hit upon a **genuine and much-debated tension** in Aquinas's political thought. Your students are right that Aquinas strongly condemns *private* tyrannicide as seditious, but your instinct about the grounding of authority in the common good potentially undermining that blanket ban is spot-on. Aquinas isn't entirely consistent, and later Scholastics (like Suárez and Mariana) explicitly wrestled with this tension. Here's the breakdown:

  1.  **The Explicit Condemnation of Private Tyrannicide:**
      *   **Source:** Primarily *Summa Theologiae* II-II, Q. 42, A. 2 ("On Sedition") and *De Regno (On Kingship)*, Book I, Chapter 6.
      *   **Argument:**
          *   Rebelling against *any* constituted authority disrupts the peace and order essential for the common good.
          *   Private individuals lack the *authority* to judge and execute a ruler, even a tyrant. This judgment belongs to the "public authority" (*auctoritas publica*).
          *   Killing a ruler, even a bad one, by a private citizen is an act of sedition (*seditio*) – a sin against charity and justice because it destroys the unity and peace of the community.
          *   *De Regno I.6*: "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power... Nor should such a multitude be accused of faithlessness for deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands." **Crucially, Aquinas immediately adds:** "...*But if the right to provide itself with a king belongs to some superior*, then a remedy against the wickedness of a tyrant must be sought from him... *If no human aid whatsoever can be obtained against the tyrant*, recourse must be had to God, the King of all... **It is not, however, expedient that private persons should attempt to kill the tyrant, even though he has taken power unjustly, because this is usually dangerous to the community and to the private persons themselves.**"
      *   **Key Point:** The "public authority" for deposition is either the original source of the ruler's power (the people, if they had that right; or a superior like the Pope/Emperor) or God. *Private initiative is explicitly rejected as dangerous and disorderly.*

  2.  **The Tension: Authority Grounded in the Common Good:**
      *   **Source:** Aquinas's fundamental political principle (ST I-II, Q. 90, A. 2; Q. 96, A. 4; *De Regno* I.1).
      *   **Argument:**
          *   Legitimate authority (*auctoritas*) exists *only* for the sake of the common good.
          *   A ruler who governs *purely* for private advantage and *against* the common good ceases to be a true ruler and becomes a tyrant.
          *   **The Tension:** If authority is *constituted* by its service to the common good, then a tyrant who fundamentally *opposes* the common good *ceases to possess legitimate authority*. He holds power *de facto* (in fact) but not *de iure* (by right). Therefore, resisting or removing him isn't an act *against* legitimate authority, but *against* an unjust usurper or oppressor. Killing him wouldn't be "sedition" against the *legitimate* political order because *he has destroyed that order himself*. The tyrant, by his actions, has arguably dissolved the bond of obedience.

  3.  **Resolving (or Failing to Resolve) the Tension:**
      Aquinas doesn't explicitly bridge this gap perfectly. His primary concerns seem to be:
      *   **The Danger of Anarchy:** He fears the chaos, violence, and potential for worse tyranny that often follows popular uprisings or private assassinations (*De Regno* I.6: "dangerous to the community"). Order, even imperfect order, is often preferable to the chaos of rebellion.
      *   **The Problem of Judgment:** Who definitively *decides* when a ruler has become a tyrant warranting removal? Aquinas implicitly trusts established hierarchies (the people collectively, a council of nobles, a superior like the Pope) more than the judgment of isolated individuals. Private judgment is seen as inherently unstable and prone to error or malice.
      *   **Distinguishing Usurpers from Legitimate-but-Tyrannical Rulers:**
          *   **Tyrant *ex defectu tituli* (Usurper):** Someone who seized power without any right. Aquinas is *much* more open to resistance here, potentially even by private individuals acting *in lieu of* public authority (though he still prefers public action). The usurper *never* possessed legitimate authority.
          *   **Tyrant *ex parte regiminis* (Abusive Legitimate Ruler):** Someone who came to power legitimately but rules tyrannically. This is the harder case. Aquinas strongly emphasizes that judgment and removal belong *only* to the public authority that instituted him (the people or their representatives) or a higher authority (like the Pope). Private action here is unequivocally condemned as sedition. His logic seems to be that the *office* still holds a residue of legitimacy that only the instituting authority can revoke, even if the *person* has forfeited their right to hold it.

  4.  **Conclusion: A Genuine Tension, Not Oversimplification:**
      *   **Yes, there is a tension.** Your reasoning is correct: If authority is *solely* constituted by service to the common good, then a tyrant *ipso facto* lacks authority, making resistance against him *not* sedition against legitimate rule. Aquinas's blanket condemnation of *private* tyrannicide, especially against tyrants *ex parte regiminis*, seems to partially contradict this foundational principle.
      *   **Aquinas Prioritizes Order and Process:** He resolves the tension *in practice* by prioritizing the preservation of social order and the necessity of *authoritative judgment* over the *theoretical* forfeiture of authority. He fears the unpredictable consequences of private violence more than he fears the continuation of tyranny (within limits – he *does* endorse public resistance/deposal).
      *   **Later Scholastics Explicitly Addressed It:** Thinkers like the Monarchomachs, Suárez, and Mariana pushed Aquinas's common-good principle further, arguing that if the *public authority* (e.g., representatives of the people) judges a ruler a tyrant, then tyrannicide *by that public authority's agent* could be justified. Some even edged towards justifying tyrannicide by *anyone* if the tyrant was sufficiently destructive and no public remedy existed, though this remained controversial.
      *   **Your Teaching is Accurate, but Nuance is Needed:** You are right to tell students Aquinas condemns *private* tyrannicide as sedition. However, acknowledging the tension with his common-good principle is crucial. Highlight:
          *   The distinction between usurpers and abusive legitimate rulers.
          *   His clear endorsement of *public* authority deposing tyrants.
          *   His deep fear of anarchy driving the condemnation of private action.
          *   The logical pull of the common-good principle that creates the tension.

  **In essence:** Aquinas's system *does* contain this tension. His practical concern for order and his medieval hierarchical worldview lead him to uphold a strong prohibition on private tyrannicide, even while his core principle of authority being grounded in the common good theoretically undermines the tyrant's legitimacy. You're not oversimplifying; you've identified a central interpretive challenge in his political philosophy.
