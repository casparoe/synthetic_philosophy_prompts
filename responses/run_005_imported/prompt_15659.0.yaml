answer: |-
  That's an insightful observation about the Frege-Geach problem (FGP) – you've grasped its core challenge to expressivism. However, your conclusion that it "settles the debate decisively" overlooks the sophisticated responses expressivists like Blackburn and Gibbard have developed. While FGP is undeniably serious, they haven't conceded because they believe they *can* solve it within an expressivist framework. Here's why the debate continues:

  1.  **Expressivists Don't Deny Logic Works:** Their core claim isn't that moral inferences *don't* work, but that they work *differently* than descriptivists claim. They need to explain *how* valid inferences involving moral sentences are possible *without* attributing truth-apt descriptive content to the atomic moral claims themselves. Their elaborate theories are attempts to provide that explanation.

  2.  **Blackburn's Quasi-Realism & Higher-Order Attitudes:**
      *   **Projectivism:** Moral judgments project our attitudes (like disapproval) onto the world, making them *seem* like descriptions of objective features.
      *   **Higher-Order Attitudes:** For embedded contexts, Blackburn argues we express higher-order attitudes *about* the consistency of holding certain combinations of attitudes.
      *   **Example:** "If lying is wrong, then getting your little brother to lie is wrong."
          *   Expressing "lying is wrong" *simpliciter* expresses disapproval of lying.
          *   Expressing the *conditional* expresses a higher-order attitude: disapproval of *combining* approval of lying with disapproval of getting your little brother to lie. It's an attitude *about* the consistency of attitudes.
          *   **Modus Ponens:** When you assert the antecedent ("Lying is wrong"), you express the first-order disapproval. The conditional has already expressed disapproval of the inconsistent combination (approving lying while disapproving getting brother to lie). Therefore, consistency *requires* you to disapprove of getting your brother to lie. The inference is valid *as a requirement of attitudinal consistency*, not because the sentences describe facts that entail each other.

  3.  **Gibbard's Norm-Expressivism & Planning:**
      *   **Plans, not just feelings:** Gibbard sees moral judgments as expressions of plans for what to do or feel in certain situations, tied to systems of norms.
      *   **Hyperplans & Consistency:** We reason using complex systems of norms (or "hyperplans"). Logic applies to the *acceptance* of norms and their logical relationships within a system.
      *   **Embedding:** An embedded moral sentence expresses a state that is *part of* the complex planning state expressed by the whole sentence. A conditional like "If lying is wrong..." expresses a planning state that *rules out* certain combinations: namely, planning to have the norm against lying while *not* planning to have the norm against getting your brother to lie.
      *   **Modus Ponens:** Asserting the antecedent commits you to the plan against lying. The conditional committed you to ruling out the combination (plan against lying + no plan against brother lying). So, you are logically committed to the plan against getting your brother to lie. Validity arises from the consistency requirements of planning states.

  4.  **Inferentialist Accounts & Bifurcation Thesis:** Later expressivists (like Schroeder) argue that the core function of moral terms is not primarily descriptive *or* expressive, but to enable specific kinds of complex *inferences*. They try to define the meaning of "wrong" directly in terms of the inferential roles it plays, bypassing the need for truth-apt descriptive content as the foundation of meaning.

  5.  **Challenging the Cognitivist Presumption:** Expressivists argue that FGP only seems like a decisive refutation if you *presuppose* that logic *must* operate on truth-apt descriptive contents. They aim to show that logic can equally well operate on states like commitments, plans, or complex attitudes. If they succeed, they haven't conceded cognitivism; they've shown expressivism can account for the phenomena.

  **Why They Keep Building Elaborate Theories:**

  1.  **Solving the Specific Problem:** Each iteration aims to provide a more precise, robust, and formally adequate account of how logical operators embed non-descriptive expressions.
  2.  **Explaining More Phenomena:** Beyond simple conditionals, they need to handle negation, disjunction, quantifiers, belief reports ("Mary believes lying is wrong"), moral disagreement, etc., within their framework.
  3.  **Achieving "Quasi-Realism":** Blackburn's project aims to explain *why* moral discourse *seems* realist (truth-apt, objective, factual) even though its core function is expressive. Solving FGP is crucial to making moral discourse "mimic" realist discourse convincingly.
  4.  **Internal Challenges:** Expressivist solutions face their own internal critiques (e.g., the "negation problem" – how to distinguish denying "lying is wrong" from asserting "lying is permissible" within expressivism). Elaboration is needed to address these.

  **Conclusion:**

  You're right that FGP exposes a fundamental challenge for expressivism. However, philosophers like Blackburn and Gibbard persist because:

  1.  **They believe they *can* solve it:** Their elaborate theories are detailed blueprints explaining *how* logic works with non-truth-apt expressions.
  2.  **They offer a *different explanation* of validity:** Validity stems from consistency requirements of attitudes/plans/commitments, not truth-preservation of descriptive content.
  3.  **They aim for quasi-realism:** Solving FGP is key to explaining the realist *appearance* of moral discourse without abandoning expressivism's core insight.
  4.  **The debate is about explanatory power:** Cognitivists argue expressivist solutions are convoluted compared to straightforward truth-conditional semantics. Expressivists counter that the initial appeal to simple truth-aptness ignores the unique, practical nature of moral language. The "clean" logic of modus ponens doesn't *prove* the cognitivist explanation is correct; it sets the challenge expressivists are trying to meet *on their own terms*.

  So, FGP hasn't settled the debate decisively *for most metaethicists* because expressivists have offered complex, plausible (though contested) solutions. Whether these solutions are ultimately successful remains a central and active point of contention in metaethics, which is precisely why your piece on the "state of play" needs to engage with them. The elaborate theories *are* the concession that FGP must be addressed, but they represent the fight *against* conceding the debate to cognitivism.
