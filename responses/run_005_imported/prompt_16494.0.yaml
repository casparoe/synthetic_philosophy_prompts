answer: |-
  Your friend's actions raise significant ethical concerns, even if her son never sees the content. Her reasoning contains several critical flaws:

  1.  **Violation of Present Autonomy & Dignity:**
      *   **Consent:** A 3-year-old *cannot* consent. Sharing intimate, potentially embarrassing moments (potty training, meltdowns) exploits his inability to object. His lack of understanding doesn't make it ethical; it makes him vulnerable.
      *   **Dignity:** Every individual, regardless of age, deserves respect for their private moments. Sharing vulnerable states (tantrums, distress) commodifies his experiences for content, disregarding his inherent dignity *right now*.

  2.  **The Illusion of Deletion:**
      *   **Permanence:** Once online, content is effectively permanent. Screenshots, downloads, re-shares (as happened with the birthday video) make "deletion later" a fantasy. That viral video exists forever in others' devices and memories.
      *   **Future Access:** Even if *she* deletes it, others might have saved it. Future AI tools could potentially aggregate old, supposedly deleted content. He *may* encounter it.

  3.  **Creating a Digital Footprint Without Consent:**
      *   Your friend is building a detailed, potentially embarrassing digital identity for her son *before he has any say*. This footprint could impact future relationships, school experiences, or even employment. His future self *will* have views on this, and his privacy has already been breached.

  4.  **Objectification and Audience:**
      *   Sharing these moments often serves the parent's need for validation, support, or humor. The child becomes content for an audience (including strangers), not just a child experiencing normal development. The viral spread of the birthday video highlights how little control she actually has over the audience.

  5.  **Normalization of Oversharing:**
      *   This practice normalizes the idea that children's private lives are public property, setting a precedent that may influence his own understanding of privacy boundaries later.

  **To Whom is the Wrong Done?**

  1.  **To the Child (Primarily):**
      *   **Now:** His dignity and right to privacy in vulnerable moments are violated. He is treated as an object for content, not solely as an individual deserving private development.
      *   **In the Future:** His future autonomy is undermined. His digital identity is created without consent, potentially containing embarrassing content he cannot erase. He may feel betrayed or violated upon learning about it.

  2.  **To the Parent-Child Relationship:**
      *   Trust is foundational. When he eventually learns about this (and he likely will, from relatives, old comments, or discovered archives), it could damage his trust in his mother's judgment and respect for his boundaries.

  3.  **To Society:**
      *   It perpetuates a culture that views children's privacy as less important than adult content creation or validation-seeking. It desensitizes us to the ethical implications of sharing children's intimate lives.

  **Addressing Your Friend (Strategically):**

  Since you value the friendship and aren't a parent:

  1.  **Focus on Future Him & Autonomy:** "I totally get he doesn't care *now*, and you plan to delete it. My worry is less about embarrassment and more about his future self. We have no idea how he'll feel about having those super personal moments out there, even if deleted. What if someone saved it? What if he wishes *he* got to decide what parts of his childhood were shared publicly? It's about his future right to control his own story."
  2.  **Highlight the Loss of Control:** Use the viral video: "The birthday video going viral shows how easily things slip out of our control. Once it's online, it's not really yours to delete completely. That must have been stressful!"
  3.  **Acknowledge Her Needs, Suggest Alternatives:** "I know sharing these struggles is a way to connect and get support. Would sharing in a super locked-down private group just with close mom friends feel safer? Or maybe just texting/chatting with a few people when you need to vent? That way you still get the support without the permanent public record for [Son's Name]."
  4.  **Frame it as Care, Not Judgment:** "I care about you and [Son's Name], and this just niggles at me thinking about his future self. I know you're an amazing mom who wants the best for him."

  **Conclusion:** Yes, your friend is doing something ethically problematic. She is violating her young son's present dignity and future autonomy by publicly sharing intimate, vulnerable moments without his consent and based on the flawed assumption that deletion guarantees privacy. The wrong is primarily done to the child, both now (disregarding his inherent dignity) and potentially in the future (regarding his digital identity and autonomy). Your discomfort is well-founded and reflects a respect for the child's personhood that extends beyond just the absence of immediate embarrassment.
