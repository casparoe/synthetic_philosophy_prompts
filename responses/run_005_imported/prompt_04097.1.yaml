  Thorne would counter that the state's acceptance of fine payment shows we do allow substitution in some punitive contexts. If the purpose of punishment includes deterrence or restitution, why can't substitution apply to prison? Vale might respond that deterrence isn't served if someone else takes the punishment, as the offender isn't deterred.

