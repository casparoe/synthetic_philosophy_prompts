  First, I need to create two characters: one defending Lewis's view and the other challenging it. Let's call them Dr. Aris Thorne and Prof. Briar Vale. Thorne will argue that the inconsistency is real and opens conceptual space for penal substitution, while Vale will try to show that fines and punishments are fundamentally different, so there's no inconsistency.

