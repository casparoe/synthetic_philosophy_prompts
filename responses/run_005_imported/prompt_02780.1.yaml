  We are ranking five proposals for solving the "problem of old evidence" in Bayesian confirmation theory, specifically in the context of Mercury's perihelion precession confirming General Relativity (GR). The goal is to rank them by how well they rescue the pretheoretic intuition that the precession did confirm GR, without relocating the puzzle or introducing ad hoc machinery.

  The proposals:
  1. Hutter's simplicity-prior fix (algorithmic information theory, using a Solomonoff-style prior to penalize "cheating" hypotheses).
  2. Garber-Jeffrey-Niiniluoto approach (treating the discovery that GR entails the precession as new information).
  3. Howson's counterfactual strategy (considering what credence in GR would be without the precession known, later disavowed by Howson).
  4. Fleisher's fragmentation proposal (using fragmented credal states and an ur-prior).
  5. Earman's pessimistic verdict (that none work and it's a permanent scar).

  Tiers:
  - S: Basically solves the problem on its own terms.
  - A: Very good, but minor issues.
  - B: Works but with notable drawbacks.
  - C: Partial solution but serious flaws.
  - F: Does not work.

  Ranking rationale:

  1. **Fleisher's fragmentation proposal (2023)**: This is a recent and sophisticated approach. It avoids counterfactuals by positing that the scientist has a fragmented credal state, and the learning occurs by integrating a fragment that hadn't yet incorporated the old evidence. It uses an "ur-prior" to model the update. This seems to capture the intuition without ad hoc counterfactuals and without requiring the agent to be logically omniscient. It directly addresses the issue that the evidence was known but not connected to the theory. Thus, it might be the most promising.

  2. **Garber-Jeffrey-Niiniluoto approach**: This approach treats the logical connection (that GR entails the precession) as new information. It is a standard move in the literature and avoids the problem of logical omniscience. However, it has been criticized because the new information (the entailment) is not contingent but necessary, and Bayesianism typically deals with contingent evidence. Also, it might require a prior over logical facts which is tricky. Still, it is a common and relatively successful approach.

  3. **Hutter's simplicity-prior fix**: This uses algorithmic information theory to penalize hypotheses that "cheat" by building in the known data. It works in a Solomonoff induction framework. However, it is highly idealized and may not be applicable to human scientists. Moreover, it might be seen as relocating the puzzle because it relies on a particular prior that is not standard in subjective Bayesianism. Also, the "cheating" hypothesis is penalized by complexity, but it's not clear that this fully captures the confirmation in a non-ad-hoc way.

  4. **Howson's counterfactual strategy (later abandoned)**: This asks what the credence in GR would have been if the precession had not been known. Howson later disavowed it because counterfactual credences are not well-defined in subjective Bayesianism. It is also ad hoc because it requires subtracting knowledge without a clear method. Thus, it is problematic and Howson himself rejected it.

  5. **Earman's pessimistic verdict**: This is not a solution but a conclusion that none of the above work. So by itself, it doesn't rescue the pretheoretic judgment. However, if we are ranking the proposals as attempts, this would be at the bottom because it doesn't provide a fix.

