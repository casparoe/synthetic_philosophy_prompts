answer: |-
  Your friend's argument is technically correct within the narrow confines of the **formal semantics of first-order logic and model theory**, but its philosophical implications about the "objectivity" of uncountability are contested and depend heavily on one's views about mathematical realism. Here's a breakdown of the mechanics and why set theorists *don't* abandon the claim of objective uncountability:

  ### 1. **The Core Mechanic: Internal vs. External Perspective**
     - **The Countable Model (M):** Downward Löwenheim-Skolem guarantees a countable model **M** of ZFC. This means:
       - *Externally* (from our perspective outside **M**), the domain of **M** is countable. Every set in **M** is encoded by a natural number.
       - *Internally* (within **M**), ZFC holds. So, **M** satisfies the statement: "There exists a set **P(ω)** that is uncountable."
     - **The "Paradox":** How can **M** think **P(ω)^M** (its version of the power set of naturals) is uncountable, while we see it's countable?

     **Resolution:** The terms "countable" and "uncountable" **mean different things** internally vs. externally.
       - **External "Countable":** There exists a bijection *in the real universe* (or our background model theory) between the domain of **M** and **ω**.
       - **Internal "Uncountable":** **M** satisfies: "There is *no bijection* between **P(ω)^M** and **ω^M**." Crucially, **M** only "sees" functions *that are elements of itself*. The bijection proving external countability **lives outside M**.

  ### 2. **Why Cantor's Proof Still Holds Internally & Externally**
     - **Inside M:** Cantor's diagonal argument is a theorem of ZFC. **M** satisfies it. So, **M** correctly proves: "For *every* function **f: ω^M → P(ω)^M** that I know about (i.e., that is an element of me), there is a subset of **ω^M** not in the range of **f**." Thus, **P(ω)^M** is internally uncountable.
     - **Outside M:** We see a bijection **g: ω → P(ω)^M** (because **M**'s domain is countable). **But g is not an element of M!** **M** lacks this function. From **M**'s perspective, **g** doesn't exist. Cantor's proof inside **M** never considered **g** because **g** isn't part of its universe.

  ### 3. **The Crucial Point: What is "The Power Set"?**
     - **The Illusion:** Your friend interprets "**P(ω)**" as having a fixed, absolute meaning. Skolem shows it doesn't in first-order logic.
     - **The Reality:** **P(ω)^M** is **not** the true power set of **ω** (all subsets of **ω** we can conceive of). It's merely a set *within M* that **M** *believes* contains all subsets of **ω^M**.
       - **M** is "missing" many subsets of **ω^M**. Specifically, it's missing the bijection **g** and the subsets needed to make **P(ω)^M** truly uncountable *from our perspective*.
       - **P(ω)^M** is countable *externally* precisely because **M** only contains countably many subsets of **ω^M**, despite its internal insistence that there are "more".

  ### 4. **Why Set Theorists Don't Abandon Objective Uncountability**
     Set theorists generally reject the idea that Skolem's Paradox undermines the objectivity of uncountability for these reasons:

     - **The Intended Model:** Set theorists work with an *intended interpretation* of ZFC, where "**P(ω)**" means the *actual, full power set* of the natural numbers. In this intended model, **P(ω)** is provably uncountable by Cantor's proof, and there is no bijection to **ω**. Löwenheim-Skolem applies to *formal* first-order theories, not to intended interpretations. The countable model **M** is seen as pathological, not reflecting this intended meaning.
     - **First-Order Logic's Weakness:** The paradox highlights a *limitation of first-order logic* to categorically define concepts like "power set" or "uncountable" within a single formal system. It doesn't prove these concepts are relative or subjective. Alternative frameworks exist:
       - **Second-Order Logic:** If we axiomatize set theory in second-order logic (SOL), Löwenheim-Skolem fails. Standard models of SOL ZFC are isomorphic and have genuinely uncountable power sets. (Your friend might counter that SOL relies on set theory itself for its semantics).
       - **Set-Theoretic Platonism:** Most set theorists are philosophical Platonists. They believe the universe of sets has a definite structure. **V** (the cumulative hierarchy) contains **P(ω)**, which is objectively uncountable. Countable models like **M** exist but are seen as incomplete *shadows* of **V**, misrepresenting the true nature of **P(ω)** by lacking subsets.
       - **Absolute Provability:** Cantor's proof establishes that *if* ZFC is consistent, *then* in *every* model of ZFC (including the countable ones), the *internal* statement "**P(ω)** is uncountable" holds. This theorem itself is absolute and model-independent.
     - **What "Uncountable" Tracks:** Cantor's proof tracks a *structural relationship between sets within a given model*. It shows that *no matter what functions exist within that specific universe*, none map **ω** onto **P(ω)** in that universe. This structural fact *is* objective *relative to the model*. The model-hopping shows the *label* "**P(ω)**" doesn't rigidly designate the same set across models, not that uncountability itself is relative.

  ### 5. **Does the Argument Hold Up?**
     - **Technically Yes:** His description of the countable model **M** and its internal belief in an uncountable **P(ω)^M** is mathematically sound. The downward Löwenheim-Skolem theorem and its consequences are uncontroversial.
     - **Philosophically Contentious:** His inference—"Therefore, there's no model-independent fact about uncountability, and Cantor's proof doesn't track mind-independent reality"—is a *philosophical interpretation*, not a mathematical necessity. It leans towards **Skolemite Relativism** (or formalism).
       - **Set Theorists' Rebuttal:** They argue:
          1. The intended model **V** (or a sufficiently robust universe) *does* have a mind-independently uncountable **P(ω)**.
          2. Countable models exist only because first-order logic is too weak to rule them out; they are artifacts of the formalism, not evidence against the objectivity of uncountability in the intended universe.
          3. Cantor's proof *does* track a mind-independent structural fact *within any fixed universe of sets*. The "relativity" comes only when we confuse the *label* "**P(ω)**" across different universes/models.

  ### Conclusion: What's Left of "Objective" Uncountability?
  Set theorists continue to assert uncountability as objectively true because:
  1. **Within their framework:** Cantor's proof is valid in the intended model (**V**), where **P(ω)** genuinely contains all subsets of **ω** and is uncountable.
  2. **The Paradox is Resolved:** It stems from conflating internal and external views and the inability of first-order logic to fix the meaning of "power set". It doesn't invalidate Cantor's diagonal argument.
  3. **Alternatives Exist:** Second-order frameworks or a commitment to a Platonic universe avoid the relativism.
  4. **Structural Objectivity:** The proof establishes an objective structural relationship (no surjection from **ω** to **P(ω)**) *within any given model*. The existence of other models doesn't negate this fact within a model.

  **The hole isn't in his math, but in the leap from model-theoretic relativity to the denial of *any* objective uncountability.** Skolem's paradox shows **formal first-order ZFC cannot categorically define "uncountable"**, but it doesn't force us to conclude uncountability is purely relative or non-objective. Set theorists maintain that in the *intended universe of sets*, uncountability is as real and objective as the natural numbers themselves. The countable model **M** is a testament to the subtlety of formalization, not a disproof of Cantor's insight.
