  We are going to stage a dialogue between two characters at a betting table. The bet offered is: 60% chance to double the staked amount (so gain equals stake) and 40% chance to lose the staked amount. The bet can be repeated as many rounds as they like, and they can choose any fraction of their current bankroll to stake.

  Character A: risk-neutral expected-value maximizer.
  Character B: proponent of the Kelly criterion (geometric rationality).

  We set up the dialogue so that both characters are sharp and engage with each other's strongest arguments.

  Setting: A casino or a private betting table. Two characters, A and B, are seated. They have just been offered the bet and are discussing how much to stake.

  Dialogue:

  Character A: (Smiling confidently) Well, this is a no-brainer. The expected value per unit staked is 0.6 * 1 + 0.4 * (-1) = 0.2, so a 20% expected return. Why wouldn't I stake everything? If I stake my entire bankroll each time, my expected wealth grows by 20% per round. That's unbeatable.

  Character B: (Shaking head) Unbeatable? Let me ask you: if you stake everything, what happens when you lose? And you will lose eventually. With a 40% chance of loss per round, the probability of surviving n rounds without a single loss is (0.6)^n, which goes to zero as n increases. So ruin is almost certain. And then your expected wealth growth doesn't matter because you're broke.

  Character A: (Leaning forward) But note that I said "expected" wealth. In expectation, I'm multiplying my wealth by 1.2 each round. And if we consider a finite horizon, say 100 rounds, then the expected wealth is (1.2)^100 times the initial bankroll. That's enormous! Yes, there's a risk of ruin, but the expected value is still astronomical. And if I have a large number of independent bets running in parallel — say, I spread my wealth across 100 identical tables all running the same bet independently — then the law of large numbers kicks in. The fraction of bets that win will be about 60%, so I'll get a 20% return with very high probability. In that case, staking everything on each independent bet is optimal.

  Character B: (Thoughtfully) Okay, the parallel case is interesting. But note: in the sequential setting, which is what we have here, the multiplicative nature of wealth accumulation changes everything. The arithmetic mean you're using doesn't capture the long-run growth for a single trajectory. Let me show you: the geometric mean growth rate per round is (1+f)^(0.6) * (1-f)^(0.4), where f is the fraction staked. The logarithm of this is the expected log growth: 0.6*log(1+f) + 0.4*log(1-f). Maximizing that gives the Kelly fraction f* = 0.6 - 0.4 = 0.2. Now, if you stake more than Kelly, say 100%, then the geometric growth rate becomes (2)^0.6 * (0)^0.4 = 0. So the long-run growth rate is zero? Actually, worse: because after a loss you have zero and stay at zero. The expected log growth rate is negative infinity? Actually, since log(0) is undefined, we can say the growth rate is negative infinity. So in the long run, you go broke with probability 1. That's not a matter of taste; it's a mathematical certainty.

  Character A: (Nodding) I agree that in the infinite sequential play with no ability to recover from ruin, staking everything is ruinous. But in practice, we don't have infinite time. We have a finite number of rounds. And in that finite setting, the expected terminal wealth is maximized by staking everything. Also, if we allow for bankruptcy and then restarting with a fixed amount (like a rebuy in a tournament), then again the risk-neutral approach might be justified.

  Character B: But even in a finite setting, the probability of ruin might be unacceptably high. For example, in 10 rounds, the probability of at least one loss is 1 - (0.6)^10 ≈ 0.994. So you have a 99.4% chance of being ruined. And even if you don't get ruined, the expected value is driven by the very small chance of winning all 10 rounds: (0.6)^10 * (2^10) * initial bankroll. That's about 0.006 * 1024 ≈ 6.14 times initial bankroll. But the expected value is indeed (1.2)^10 ≈ 6.19 times. However, 99.4% of the time you get zero, and 0.6% of the time you get 1024 times. That expected value is high, but the distribution is terrible: almost always zero, and very rarely a big win. Most people would not take that bet with their entire bankroll.

  Character A: (Raising an eyebrow) But I am risk-neutral. I care only about expected value. And 6.19 times the initial bankroll in 10 rounds is great. If I could play this game once with a 10-round commitment, I'd do it. But note: I don't have to stake everything every time. I could stake a fraction. However, if I'm risk-neutral, then I should choose the fraction that maximizes the expected terminal wealth. For a single round, that's staking everything. For multiple rounds? Actually, for independent identical bets, the expected wealth after n rounds is [1 + 2f + (1-f)]? Wait, no. Let me compute: after one round, E[W1] = W0 * [0.6*(1+f) + 0.4*(1-f)]? Actually, if we stake fraction f, then with 60% chance we have W0*(1+f) and 40% chance we have W0*(1-f). So E[W1] = W0 * [0.6*(1+f) + 0.4*(1-f)] = W0 * [1 + 0.2f]. So the expected value is linear in f. Therefore, to maximize expected value, I should set f=1. That holds for every round. So after n rounds, E[Wn] = W0 * (1.2)^n. So in expectation, the best is to set f=1.

  Character B: But that expectation is an average over paths. And in the vast majority of paths, you end up with nothing. The expectation is high because of the extremely high wealth in the very few paths that never lose. But for an individual, you only live one path. And on that path, if you lose once, you are done. So the expectation doesn't reflect your actual experience. That's the non-ergodicity point.

  Character A: (Pausing) I see your point. But what if I have access to many such betting opportunities in parallel? Suppose I split my bankroll into 100 equal parts and place each on an independent table with the same bet, all running simultaneously. Then, by the law of large numbers, about 60 tables will win and 40 will lose. So my total wealth becomes (2 * 60/100) + (0 * 40/100) of the staked amount? Wait, no. For each table, I staked f fraction of my total bankroll? Actually, if I split my bankroll into 100 independent bets, each of size (1/100) of my bankroll, then after one round, the total return is the sum of the returns. For each bet, I get 2*(1/100)*W0 with probability 0.6, and 0 with probability 0.4. So the expected total wealth is 100 * [0.6 * (2 * W0/100) + 0.4 * 0] = 0.6 * 2 * W0 = 1.2 * W0. And the variance is low: by the law of large numbers, the actual return will be close to 1.2. So I can safely stake my entire bankroll, split across 100 independent bets, and get about 20% growth with very high probability. And then I can do this again next round. In that case, the arithmetic expectation is realized.

  Character B: (Smiling) That's a good point. In the parallel case, the law of large numbers does indeed make the arithmetic expectation a good guide. But note: in the sequential setting without parallelization, the situation is different. And in many real-life investment scenarios, we don't have the luxury of parallelization. We have to reinvest sequentially. Also, in the parallel case, you are still not staking 100% of your bankroll on a single bet. You are effectively staking 1% per bet. And 1% is much less than the Kelly fraction of 20%. In fact, if you do the Kelly calculation for the parallel case with many independent bets, the optimal fraction per bet would be the same as in the sequential case? Actually, for the parallel case with one round, the growth rate is the same as the sequential case for one round? But in the parallel case with many bets, we are effectively diversifying. The Kelly fraction per bet would be 20%, but if I have 100 independent bets, I could in theory stake 20% of my bankroll on each? That would be overbetting because the bets are independent? Actually, the correct way is to consider the overall portfolio. The Kelly criterion for multiple independent bets is to bet the Kelly fraction on each. But note: if I bet 20% on each of 100 independent bets, then I'm effectively staking 2000% of my bankroll? That doesn't make sense.

  Character A: (Chuckles) No, I think I see the confusion. In the parallel case, if I have 100 independent bets and I want to allocate fractions f1, f2, ..., f100 of my bankroll, then the growth rate is the average of the log growth? Actually, the total wealth is W0 * product_{i=1}^{100} [1 + return_i], but the returns are not multiplicative in the same way because they are simultaneous. Actually, if I allocate fraction f_i to bet i, then the total wealth after one round is W0 * [1 + sum_{i} f_i * r_i], where r_i is the return of bet i (which is +1 with prob 0.6 and -1 with prob 0.4). But note: if I allocate non-overlapping fractions, then the fractions must sum to at most 1. So if I split equally, I set f_i = 1/100 for each. Then the total return is the sum of (1/100)*r_i. The expected log growth is E[log(1 + sum_i f_i r_i)]. That's complicated. But if the number of bets is large, by the law of large numbers, the sum is approximately 0.2, so log(1+0.2) = log(1.2) ≈ 0.182. That's the same as the log growth of a single bet at 20%? Actually, no. The Kelly fraction for a single bet is 20%, which gives expected log growth 0.6*log(1.2) + 0.4*log(0.8) ≈ 0.6*0.1823 - 0.4*0.2231 ≈ 0.1094 - 0.0892 = 0.0202. But in the diversified case with 100 bets at 1% each, the expected log growth is E[log(1 + 0.01 * sum r_i)]. The sum of r_i is a binomial: 100*0.6=60 wins and 40 losses? So the total return is 0.01 * (60*1 + 40*(-1)) = 0.01*20 = 0.2. So the growth factor is 1.2, and the log growth is log(1.2)≈0.182? But that's only if we get exactly 60 wins. Actually, we get a random number of wins, say k, which is binomial(100,0.6). Then the return is 0.01*(2k - 100) = 0.02k - 1. So the growth factor is 1 + (0.02k - 1) = 0.02k. Wait, that doesn't make sense because if k=60, then 0.02*60=1.2, which is correct. But if k=0, then 0.02*0=0, which is total loss. So the log growth is log(0.02k). Now, the expected log growth is E[log(0.02k)]. That's not the same as log(0.02*E[k]) because log is concave. By Jensen's inequality, E[log(k)] < log(E[k]). So the expected log growth is less than log(0.02*60)=log(1.2)≈0.182. But actually, we can compute it: 
  E[log(0.02k)] = log(0.02) + E[log(k)].
  E[log(k)] for k ~ Binomial(100,0.6) is hard to compute exactly, but we know that the mode is at 60. However, the log is concave, so the expectation is less than log(60). Actually, we can approximate: k is approximately normal with mean 60 and variance 24 (since np(1-p)=100*0.6*0.4=24). Then E[log(k)] ≈ log(60) - variance(k)/(2*60^2) = log(60) - 24/(2*3600) = log(60) - 24/7200 = log(60) - 1/300 ≈ 4.0943 - 0.00333 ≈ 4.09097. Then E[log(0.02k)] = log(0.02) + 4.09097 = -3.91202 + 4.09097 ≈ 0.17895. Compare this to the Kelly single bet: 0.0202? That seems off.

  Wait, I think I made a mistake. In the parallel case, we are not compounding multiplicatively within the round? The entire round happens at once. So the growth factor for the round is (1 + total return). The log growth for the round is log(1 + total return). For the parallel case with 100 bets of 1% each, the total return is (sum r_i * f_i) = (1/100)*sum r_i. So the log growth is log(1 + (1/100)*sum r_i). Now, the sum r_i is the number of wins minus the number of losses? Actually, for each bet, r_i = 1 (if win) or -1 (if loss). So the total return is (1/100) * (wins - losses). But note: wins + losses = 100, so wins - losses = 2*wins - 100. So total return = (2*wins - 100)/100 = (wins/50) - 1. Then the growth factor is 1 + (wins/50 - 1) = wins/50. So the log growth is log(wins/50). Now, wins ~ Binomial(100,0.6). So E[log(wins/50)] = E[log(wins)] - log(50). We can approximate: wins has mean 60, variance 24. Then E[log(wins)] ≈ log(60) - 24/(2*60^2) = log(60) - 1/300 ≈ 4.0943 - 0.00333 ≈ 4.09097. Then E[log(wins/50)] ≈ 4.09097 - 3.91202 = 0.17895.

  But note: this is the expected log growth for one round of parallel betting. For the sequential Kelly strategy, we have per round expected log growth of 0.6*log(1.2) + 0.4*log(0.8) ≈ 0.6*0.1823 + 0.4*(-0.22314) = 0.10938 - 0.089256 ≈ 0.020124. So the parallel strategy with 1% per bet gives a much higher expected log growth per round (0.17895) than the sequential Kelly (0.020124)? That doesn't make sense because in the parallel case, we are effectively getting a fixed return of 20% per round (with very low variance) so the log growth is about 0.1823 (if we got exactly 20%) and we are getting 0.17895 in expectation? Actually, the expected log growth is 0.17895, which is very close to log(1.2) because the variance is low. But note: the sequential Kelly strategy also compounds, but at a lower rate. However, the parallel strategy is not subject to the same risk of ruin because even if one bet loses, it's only 1% of the bankroll. So the parallel strategy is safer and has a higher growth rate? 

  But wait, the comparison is not fair: in the sequential case, we are betting one bet at a time and then reinvesting. In the parallel case, we are betting 100 bets at the same time. The per-round growth rate in the parallel case is higher because we are effectively getting the average return of 100 bets at once. But note: the sequential case also has the potential to compound over many rounds. However, the parallel case in one round is equivalent to 100 rounds of sequential play? Not exactly, because in sequential play the bets are dependent (the outcome of one affects the bankroll for the next). But if we could run 100 independent sequential games in parallel, that would be different.

  Character B: (Interjecting) This is getting complicated. But let me bring it back: in the original sequential setting, without the ability to parallelize, the Kelly fraction is the one that maximizes the long-run growth rate. And staking more than Kelly (like 100%) leads to a growth rate of negative infinity because of ruin. So for an agent who must play sequentially, the Kelly fraction is the only one that avoids certain ruin and maximizes growth. And even in the parallel case, if you have a finite number of independent bets, you still don't want to overbet. The Kelly fraction per bet would be 20%, but if you have only one bet available, then you bet 20% of your bankroll. If you have multiple independent bets, you can bet 20% on each? But that might lead to overbetting if the bets are correlated or if the number of bets is small. Actually, the general rule for multiple independent bets is that the optimal fraction per bet is still the Kelly fraction for that bet, but you have to make sure that the total exposure is not too high. However, in the case of many independent bets, the risk is diversified.

  Character A: So we agree that the context matters. In the sequential setting without parallelization, the Kelly fraction avoids ruin and maximizes growth. But if I can parallelize, then I can achieve a higher growth rate with less risk. And if I am risk-neutral and can afford to play many independent bets (either in parallel or sequentially with rebuys), then maximizing expected value by staking large fractions may be justified. But in the pure sequential setting without rebuys, the Kelly fraction is the one that maximizes the long-run growth.

  Character B: Exactly. And the key is the non-ergodicity: in the sequential setting, the time average (the growth rate along a single path) is not the same as the ensemble average (the arithmetic expectation). The ensemble average is what you get by averaging over many parallel paths at a fixed time. But the time average is what a single agent experiences. And the Kelly criterion optimizes the time average.

  Character A: So perhaps we can agree that the optimal strategy depends on the setting: sequential vs. parallel, finite vs. infinite horizon, and the agent's ability to absorb losses and rebuy. But in the classic sequential betting scenario with no rebuys and a long horizon, Kelly is indeed the way to go.

  Character B: (Smiling) I'll drink to that.

  (They clink glasses.)

  End of dialogue.
answer: |-
  ### Dialogue: The Betting Table Dispute  
  **Setting:** A dimly lit casino bar. Two economists, Alex (Character A, risk-neutral expected-value maximizer) and Blair (Character B, proponent of geometric rationality/Kelly criterion), sit across a velvet table. A bookmaker has just offered them a repeated bet: stake any fraction of current wealth per round, with a 60% chance to double the stake and a 40% chance to lose it. They debate optimal strategy over whiskey.

  ---

  **Alex:** (Leans forward, eyes gleaming) Let’s cut to the chase. This bet has an expected return of 20% per unit staked—0.6 × 2 + 0.4 × 0 = 1.2, minus the stake. Risk neutrality means maximizing expected terminal wealth. I’d stake 100% every round. Why leave money on the table when the math guarantees growth? After *n* rounds, expected wealth is \(W_0 \times (1.2)^n\). At 100 rounds, that’s over 80 million times your starting bankroll. Case closed.  

  **Blair:** (Shakes head, swirling whiskey) "Guarantees growth"? Only in an ensemble average over infinite parallel universes. For a single agent living through time, wealth compounds *multiplicatively*. Stake everything, and one loss reduces you to zero—an absorbing state that kills all future growth. With 40% ruin risk per round, your survival probability over 100 rounds is \(0.6^{100} \approx 10^{-24}\). You’ll almost surely be ruined, while your "expected wealth" is inflated by astronomically rare paths where you win every time. That’s not rational; it’s a fallacy of averages.  

  **Alex:** (Raises a finger) A finite horizon rescues this. Suppose I only play 10 rounds. Expected terminal wealth is still maximized at \(W_0 \times (1.2)^{10} \approx 6.19 W_0\) by staking fully. Yes, ruin probability is high—\(1 - 0.6^{10} \approx 99.4\%\)—but the payoff in the 0.6% of surviving paths is enormous (\(1024 W_0\)). For a risk-neutral agent, that trade-off is optimal. We’re not obligated to avoid ruin; we’re obligated to maximize expectation.  

  **Blair:** (Leans in, intense) But expectation here is non-ergodic! Your calculation averages over paths you’ll never experience. In your 0.6% survival scenario, you’re ignoring the other 99.4% of your future selves—all bankrupt. For the *actual* trajectory you live, the time-average growth rate is what matters. And for multiplicative growth, that’s the geometric mean, maximized by Kelly. Stake \(f^* = 0.6 - 0.4 = 20\%\), and growth per round is \(g = 0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 1.98\%\). Stake 100%, and \(g = -\infty\) because ruin is certain in the long run. This isn’t about "taste"; it’s about correcting a mathematical error in dynamic choice.  

  **Alex:** (Nods slowly) I concede that infinite sequential play demands Kelly to avoid ruin. But your critique assumes isolation. What if I diversify? Suppose I spread my wealth across 1,000 independent copies of this bet running in parallel—like a portfolio of uncorrelated assets. Now, the law of large numbers kicks in: roughly 60% win, 40% lose per round. If I stake 100% of my total wealth equally across all 1,000 bets, expected terminal wealth grows by 20% per round with negligible variance. Ruin risk vanishes because no single bet can wipe me out. Arithmetic expectation dominates again.  

  **Blair:** (Pauses, then smiles thinly) Clever—but you’ve changed the game. Parallelization converts a non-ergodic process into an ergodic one. Yet even here, Kelly isn’t irrelevant. If you stake 100% across 1,000 bets, each gets 0.1% of your wealth. But the Kelly-optimal fraction *per independent bet* is still 20%. Your staking scheme is equivalent to a fractional Kelly system with \(f = 0.1\% \times 1,000 = 100\%\), which is *overbetting*. Optimal parallel play would stake 20% per bet—so \(0.02\% \times 1,000 = 20\%\) total exposure—maximizing the portfolio’s geometric growth rate. Your 100% stake sacrifices growth for scale.  

  **Alex:** (Taps the table) Fair point on overbetting in parallel, but my core argument stands: context dictates strategy. In parallel or with rebuys, arithmetic expectation rules. In pure sequential play, Kelly avoids ruin. But even sequentially, if I have a fixed horizon and no utility for wealth’s distribution—only its expectation—staking fully is coherent. Risk neutrality isn’t irrational; it’s preference-consistent.  

  **Blair:** (Sighs) Preference-consistent, yes—but only if you ignore path dependence. Your "finite horizon + risk neutrality" defense treats bankruptcy as a terminal state with utility zero, which is arbitrary. In reality, losing everything forecloses future opportunities, so ruin’s disutility isn’t captured by a snapshot expectation. Geometric rationality respects the irrevocability of time. That’s why Kelly isn’t just "log utility"; it’s the fraction that aligns ensemble averages with time averages.  

  **Alex:** (Sips whiskey, conceding ground) I’ll grant that Kelly is uniquely compelling for ergodicity-adjusted objectives. But for agents who can diversify or whose horizons are short, maximizing expectation is valid. The literature’s stalemate persists because both views are contextually right.  

  **Blair:** (Clinks glasses) Agreed. So let’s settle this: I’ll stake 20% per round for my trajectory. You split your wealth across parallel tables. We’ll meet in a year and compare notes.  

  **Alex:** (Grins) Deal. But if I go bankrupt, I’m borrowing your Kelly winnings to rebuy.  

  **Blair:** Only at 20% per bet, Alex. Only at 20%.  

  ---

  ### Key Takeaways from the Dialogue  
  1. **Alex’s Strongest Move (Risk Neutrality):**  
     - In finite horizons or parallelized bets, arithmetic expectation maximizes terminal wealth, vindicated by the law of large numbers.  
     - Risk neutrality is coherent if bankruptcy disutility is modeled as "utility = 0" and distributional skew is irrelevant.  

  2. **Blair’s Strongest Move (Geometric Rationality):**  
     - Sequential betting under multiplicative dynamics is non-ergodic: ensemble expectations misrepresent individual experience.  
     - Kelly maximizes the almost-sure long-run growth rate and avoids certain ruin, which arithmetic expectations ignore.  

  3. **Resolution:**  
     - **Parallelization** (Alex’s rebuttal) restores ergodicity, allowing arithmetic expectations to shine.  
     - **Path dependence** (Blair’s core argument) makes Kelly indispensable for isolated sequential play.  
     - Neither view is a strawman; the optimal strategy depends on horizon, diversification, and the agent’s capacity to absorb losses.  

  This dialogue mirrors real debates (e.g., Samuelson vs. Kelly advocates) and underscores that decision theory under risk must specify:  
  - Whether the agent experiences one path (time-average) or many (ensemble-average).  
  - The role of bankruptcy and compounding constraints.  
  - The possibility of diversification.
