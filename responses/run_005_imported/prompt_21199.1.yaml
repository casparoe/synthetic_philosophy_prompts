answer: |-
  ## The Unselected Effect

  The *Kunmingornis paradoxus* specimen lay on the prep lab table, a whisper of Cretaceous life trapped in buff-colored limestone. Its small, delicate skull was turned slightly, jaws agape in a silent scream or perhaps just the slackness of death. But the glory, the argument, lay in the halo of preservation surrounding it: filaments. Not the simple, hairlike pycnofibers of early pterosaurs, nor the clearly pennaceous feathers of later birds, but something exquisitely in-between. Fine, branching structures, some with rudimentary vanes, radiating from the slender arms and tail. A theropod caught mid-evolution.

  Dr. Clara Vance ran a gloved finger along the edge of the fossil slab, not touching the precious filaments. Her grey hair was pulled back severely, her lab coat immaculate. "Look at the density on the distal tail, Ben. And the asymmetry on the arm structures. It screams *display*. Or perhaps thermoregulation concentrated on appendages."

  Dr. Ben Shaw leaned closer, his own coat bearing faint smudges of sediment. He hadn’t shaved. "It *suggests* it, Clara. But look at the articulation of the forelimbs. The robustness of the pectoral girdle relative to body size. These structures," he pointed to a cluster of filaments near the wrist, "could absolutely have provided lift during a leap, or stability during a run. A proto-wing function."

  It was the same argument that had stalled their respective labs for months. The *Kunmingornis* paper was paralyzed. Neither lab director would yield, and the specimen, on loan from the Kunming Institute, demanded co-authorship from both discoverers: Clara and Ben. Divorced for fifteen years, co-authors on a dozen papers since, collaborators who communicated mostly via terse emails and shared Dropbox folders. Now, forced into proximity by this tiny, confounding dinosaur.

  Clara straightened. "Ben, you know the position. A structure’s function is defined by the effect it was *selected for*. That’s the etiological view. Until we have evidence – phylogenetic bracketing, biomechanical modelling showing clear selective advantage for a *specific* role – we cannot assign a function. This," she gestured at the fossil, "has no function *yet*. It’s a structure awaiting its selective history. Which, tragically, stopped sixty-six million years ago."

  Ben snorted, a familiar sound that still grated. "And that’s the gap, Clara. The fatal flaw. You’re so fixated on the dead past, you can’t see the living present. What *was* it doing? What *could* it do? The Cummins view: function is causal role *now*. What contribution does this filament make *right here*," he tapped the glass case over the fossil's arm, "to the systems of *this* animal? Did it insulate? Probably, a bit. Did it catch the eye? Likely. Did it help it move? Plausibly! Why must it have only *one* ordained purpose from the evolutionary heavens? Why can’t it just... *be* useful?"

  The air crackled, thick with more than just the hum of the climate control and the smell of consolidant. It was the same tension that had permeated their marriage’s final years, distilled into academic jargon. Clara saw Ben’s pragmatism as intellectual laziness, a refusal to acknowledge the weight of history. Ben saw Clara’s rigor as a form of paralysis, an obsession with origins that blinded her to current reality.

  Later, in the quiet dimness of the specimen storage room, the argument bled past the fossil.

  "You always did this," Clara said, her voice low but sharp. "Reduce everything to what it *does* in the immediate moment. Forget the context, the build-up, the *why*."

  Ben was checking the humidity log for the cabinet holding *Kunmingornis*. He didn't look up. "And you always needed a grand narrative, Clara. A pre-determined purpose. If something didn't fit the 'selected effect' of your life plan, you discarded it as malfunction. Like us."

  Clara flinched. "Our marriage wasn't a malfunctioning structure, Ben. It was a complex system whose selective pressures changed. The environment shifted. We weren't adapted."

  Ben finally turned. "Adapted? Is that what you call it? We *were* adapted, Clara. We worked. We built something. Then you decided the 'selected effect' of marriage was supposed to be... what? Perpetual romantic bliss? Academic synergy? When it became something else – companionship, shared history, practical support – you declared it non-functional because it didn't match your original blueprint."

  "And what was your blueprint, Ben?" she shot back. "Just... drift? Whatever happens, happens? No responsibility for the trajectory, just deal with the immediate consequences? Like leaving the dishes because washing them *now* serves the function of having a clean sink *now*, never mind the long-term mess?"

  "You see?" Ben spread his hands, encompassing the room, the fossil, their history. "The filament! You want its function pinned down by its ultimate, unknowable origin story. I want to know what it *did* for the animal while it lived. You want your life defined by what you were *supposed* to become. I define mine by what I *am* doing. Right now. Including trying to publish a damn paper about this dinosaur."

  Clara stared at the fossil, suspended in its eternal present. The filaments were beautiful, intricate, mute. Was she like that? Defined only by the selective pressures that shaped her childhood ambition, her academic drive? Was her current self – the meticulous professor, the sometimes-lonely woman, the still-collaborative ex-wife – merely an unselected effect, an epiphenomenon with no true function? Or was Ben right? Was she simply the sum of her current actions: prepping fossils, writing grants, arguing with Ben Shaw?

  And Ben? Was he just an accumulation of present-tense reactions, unmoored from the boy who’d fallen for the brilliant, driven Clara? Or was the man he was now – passionate, messy, frustratingly pragmatic – the inevitable result of the pressures *he* had faced?

  The *Kunmingornis* offered no answers. Its filaments hadn't been selected for flight – the structure wasn't advanced enough. Hadn't clearly been selected solely for display – the distribution was odd. Insulation? Perhaps, but inefficiently. It was a structure caught in the act of *becoming*, its future evolutionary pathway abruptly severed. Its function, in Clara’s strict view, was indeterminate, lost to time. In Ben’s view, its function had been manifold: warmth, show, a hint of lift, maybe even something they hadn't imagined. It had *worked*, until it didn’t.

  "We need to describe the morphology," Clara said finally, her voice tired. "Exhaustively. The branching patterns, the density gradients, the insertion points. Let the data speak. The function... we can present both interpretations. As competing hypotheses."

  Ben leaned against a cabinet. "The 'Selected Effect vs. Causal Role' debate. Framing the discussion." He paused. "And the personal subtext?"

  Clara managed a thin smile. "Buried deep in the supplementary material, Ben. Where it belongs. Along with everything else unresolved."

  He nodded slowly. "Okay. Okay, Vance. Let's write the damn thing. Again."

  They walked out of the storage room, not touching, the ghost of their marriage and the enigma of the little feathered dinosaur hanging in the cool, dry air between them. The past was a locked stratum. The present was a collaboration. The future, like the function of *Kunmingornis paradoxus*’s filaments, remained stubbornly, beautifully unresolved.
