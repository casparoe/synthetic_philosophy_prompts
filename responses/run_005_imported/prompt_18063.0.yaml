  Hey, so I've been reading up on Pascal's mugging for a piece on the whole longtermism debate, and something's bugging me. As I understand the argument, expected-value reasoning falls apart once someone can pair an arbitrarily tiny probabilty with an arbitrarily huge payoff, because you can always be out-bid by a bigger claimed disaster. But isn't that basically the exact structure behind the 'even a small chance of preventing human extinction justifies enormous spending' arguments you hear for AI safety, pandemic prep, asteroid defense, all of it? Feels to me like effective altruists have just found a more respectable-sounding version of the mugger's trick. Is there an actual principled line between the two, or is 'big number, small probability' reasoning basically Pascal's mugging any time someone does it with a straight face?
