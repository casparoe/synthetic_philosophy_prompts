prompt: |-
  I co-host a pretty small podcast on philosophy of economics (like maybe 200 listeners on a good week) and next week's guest is an economist who's built a bit of a name for herself with a deflationary take on the whole "markets aggregate information" story. Her basic pitch is that once you take the Milgrom-Stokey no-trade theorem and Aumann agreement seriously, the hayekian idea that prices/prediction markets are magically pooling everyone's dispersed private information through voluntary trade doesn't really survive -- most observed trading volume is, on her view, liquidity and hedging noise plus garden-variety irrationality dressed up as "informed trading." She's given versions of this talk a bunch of times and has very smooth stock answers ready, so I don't want the episode to just be her restating the thesis. I spent the week reading the original Milgrom-Stokey and Aumann papers to prep and honestly followed maybe 60% of the math, so could you draft me 8 to 10 interview questions, each with a quick follow-up keyed to whatever dodge shes most likely to reach for?

  Things I definitely want in there: one question that makes her actually walk through the unraveling logic itself -- like why the mere common-knowledge fact that someone's willing to trade with you should already tell you enough to erase whatever gains you thought were on the table; one that puts her in the Grossman-Stiglitz bind, i.e. if rational traders shouldn't trade on private info per the no-trade result, where does the information in "informative" prices even come from, and whether "noise traders did it" actually answers that or just relocates the mystery; one that pushes on how much of the whole result is riding on the common-prior assumption, since drop that and the no-trade conclusion apparently evaporates -- isnt that assumption doing basically all the philosophical work while dressed up as a harmless technical add-on; and one connecting this back to Aumann and ordinary disagreement, asking whether her view commits her to saying persistent good-faith disagreement between people who are plainly aware of each other's reasoning (competing recession forecasters, superforecasters disagreeing on a number, whatever) has to be chalked up to irrationality or secretly different priors rather than anything more interesting. Add a couple more questions of your own if you think of good ones, just keep them all this specific instead of generic "what got you into this" stuff.
