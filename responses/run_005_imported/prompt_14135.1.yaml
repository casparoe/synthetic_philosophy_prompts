answer: |-
  Your question cuts to the heart of a fascinating tension in the philosophy of social norms. Here's my verdict: **Skyrms fundamentally challenges Lewis's conception of convention by undermining the *necessity* of arbitrariness, but does not destroy the core insight about coordination equilibria.** Lewis's analysis is partially vindicated in its structure but critically weakened in its defining feature.

  Here's the breakdown and reasoning:

  1.  **Vindication of the Coordination Equilibrium Structure:**
      *   Skyrms *absolutely* vindicates Lewis's core insight that conventions are solutions to recurrent coordination problems, emerging as stable equilibria in strategic interactions (like signaling games). Both agree conventions are self-sustaining patterns of behavior where agents' actions are mutually best responses.
      *   The demonstration that these equilibria emerge through simple dynamics (evolution, learning) *without* requiring hyper-rationality, deliberation, or common knowledge is a powerful *extension* of Lewis's project. It shows how Lewis-like phenomena can arise in a much broader range of contexts – from animal signaling to early human societies to algorithmic interactions. This strengthens the applicability of the coordination equilibrium framework.

  2.  **The Undercutting of Arbitrariness:**
      *   **Lewis's Non-Negotiable Arbitrariness:** For Lewis, arbitrariness is definitional. A convention *must* be one of *several* possible coordination equilibria that could have solved the problem. The fact that "we do it this way" is contingent; there's a salient alternative where "they do it that way" and it works just as well. This is crucial for distinguishing conventions from norms driven by intrinsic superiority (e.g., driving on the *safe* side) or physical necessity.
      *   **Skyrms's Challenge via Stochastic Stability:** Skyrms's models (and Peyton Young's work) show that evolutionary dynamics often *do not treat all equilibria equally*. Due to population structure, mutation rates, noise, payoff asymmetries, or the specific dynamics of learning (like reinforcement), one equilibrium can become *stochastically stable* – meaning it's vastly more likely to emerge and persist in the long run under random perturbations.
      *   **The Problem for Arbitrariness:** If dynamics consistently favor Equilibrium A over Equilibrium B (e.g., a specific signaling system emerges far more frequently than its alternatives in simulations), then Equilibrium A is *not arbitrary* in the strong Lewisian sense. Its emergence isn't contingent on a particular history or agreement; it's the robust, predictable outcome of the underlying dynamics. The "alternative" isn't equally viable; it's significantly less likely or stable. The convention is, in a very real sense, *selected for* by the dynamics, not merely chosen from equivalent options.

  3.  **The Verdict: Partial Vindication, Critical Challenge:**
      *   Skyrms **does not** simply replace Lewis's rationalistic mechanism with an evolutionary one while leaving the *concept* intact. The mechanism change has profound conceptual consequences.
      *   Skyrms **vindicates** Lewis's core idea that conventions are self-sustaining coordination equilibria arising from recurrent interaction.
      *   Skyrms **undercuts** Lewis's *defining requirement* of strict arbitrariness. By demonstrating that dynamics can non-arbitrarily select a single dominant equilibrium (or make one vastly more probable), Skyrms shows that Lewis built an empirically contingent feature (common knowledge enabling choice among arbitrary options) into the *essence* of convention in a way that is often untrue.
      *   **Therefore, Skyrms forces a revision of the concept:** Conventions *can* be arbitrary (Lewis's case), but they can *also* be non-arbitrary, emergent attractors favored by the dynamics of the system (Skyrms's case). The *key defining feature* becomes the self-sustaining coordination equilibrium structure, *not* the presence of equally viable alternatives.

  **Implications for your Seminar Discussion:**

  *   **Lewis vs. Skyrms on "What a Convention Is":** Lewis offers a *stipulative definition* centered on rational choice among arbitrary options. Skyrms offers an *explanatory model* showing how convention-like stable behavioral regularities emerge, which often lack strict arbitrariness. Skyrms is describing a broader natural phenomenon that sometimes fits Lewis's definition and sometimes doesn't.
  *   **The Role of Arbitrariness:** Is arbitrariness essential to the *concept*, or is it merely a common *feature* of some conventions? Skyrms suggests the latter. Can something still be a convention if it's the *only* or *overwhelmingly likely* solution? Skyrms implies yes.
  *   **"Convention" as a Spectrum:** Skyrms's work suggests conventions exist on a spectrum. At one end are highly arbitrary norms (like "green means go") where alternatives *are* equally viable. At the other end are norms that emerge as the uniquely stable or highly probable outcome of specific dynamics, exhibiting less arbitrariness (e.g., specific signal-meaning mappings favored by the structure of the world or the learning process).
  *   **Young's Stochastic Stability:** This concept is crucial. It provides the *mechanism* demonstrating non-arbitrariness. Highlighting specific models where one equilibrium has much higher stochastic stability than others (e.g., due to risk-dominance, network effects) will solidify the argument against Lewis's universal arbitrariness requirement.

  **In essence:** Skyrms doesn't just swap mechanisms; he expands and revises the *concept* of convention. He shows that the stable, self-sustaining coordination equilibria Lewis identified can emerge without the rational deliberation and common knowledge Lewis deemed essential, and crucially, *without the arbitrariness* Lewis considered definitional. The core coordination structure remains, but the requirement for equally viable alternatives becomes an optional feature, not a necessary one. Lewis captured an important *type* of convention, but Skyrms revealed a broader phenomenon.
