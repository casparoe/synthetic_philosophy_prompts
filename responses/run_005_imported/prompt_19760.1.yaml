prompt: |-
  I've been nerd-sniped by the "Embedded Agency" sequence Garrabrant and Demski wrote for MIRI. It keeps hammering on how the classic picture of an agent, like the boxes-and-arrows diagram from the RL textbooks with the agent on one side and the environment on the other sending actions and observations back and forth, is basically a "Cartesian" fiction, and they use AIXI as the poster child of an agent that's strictly bigger than its own environment. Can you compare that dualistic setup to what they mean by an "embedded" agent? Don't just give me the textbook definition, actually work through what concretely breaks once the agent has to be smaller than, and part of, the world its modeling. Then tell me which of their four subproblems (decision theory, embedded world-models, robust delegation, subsystem alignment) is doing the most "root cause" work for the other three, and justify the pick instead of just listing them.
