answer: |-
  You've hit on a critical and widely acknowledged tension in Tolstoy's theory – arguably its most significant structural weakness. Your concern about circularity and the problematic nature of "sincerity" as an objective criterion is absolutely valid and central to critiques of *What is Art?*.

  Here's a breakdown of the issue and how scholars typically address it:

  1.  **The Core Problem (As You Articulate It):**
      *   **Goal:** Tolstoy seeks an *objective* criterion for art ("infection") to replace subjective notions like "beauty" or "taste."
      *   **The Contradiction:** Condition (3) – "sincerity" – anchors the *degree* of infectiousness in the artist's *private, unobservable, subjective state* ("the greater or lesser force with which the artist himself feels the emotion").
      *   **The Circularity:** How do we *know* the artist was sincere? Primarily, because the work *infects us*. But the *degree* of infection is supposed to *depend* on the sincerity we can't directly access. It becomes: "The work is highly infectious because the artist was deeply sincere; we know the artist was deeply sincere because the work is highly infectious." This is indeed circular when trying to establish an objective basis *external* to the audience's subjective experience.

  2.  **Tolstoy's Attempts (and Limitations) to Address This:**
      *   **Empiricism vs. Metaphysics:** Tolstoy tries to present his theory as empirical – we observe the *effect* of infection. However, condition (3) smuggles in a metaphysical claim about the artist's internal state that *cannot* be empirically verified independently of the effect. He conflates the *cause* of the effect (sincerity) with the *evidence* for the cause (the effect itself).
      *   **Focus on Communicability:** Tolstoy might argue that "sincerity" isn't *just* a private feeling, but is *manifest* in the work's ability to communicate *clearly* and *individually* (conditions 1 & 2). A work that is vague or derivative *cannot* be sincerely felt in the way Tolstoy demands, because true feeling seeks unique and clear expression. However, this links sincerity to the *outcome* (clarity/individuality), not providing an independent verification.
      *   **Sincerity as Necessary but Not Sufficient (Implied):** Tolstoy states that without sincerity, no amount of skill creates infection. This positions sincerity as a *precondition* for infection, not something solely inferred *from* infection. But how do we know the precondition was met? Only by the presence of infection... bringing us back to the circle.
      *   **Chapter 15:** Later in the book, Tolstoy reiterates sincerity as paramount and explicitly states: "The chief peculiarity of this feeling [infectiousness] consists in the receiver of a true artistic impression *so* joining in with the artist that he feels as if the work were his own... and this is brought about... solely by the artist's having *inwardly* experienced the feeling which he expresses." This reinforces the dependence on the inaccessible inward state.

  3.  **Scholarly Recognition of this Problem:**
      *   **Widespread Critique:** Yes, this is a standard and powerful criticism levied against Tolstoy's theory. Scholars like Gary Saul Morson, Terry Diffey, and many anthologies on aesthetics/philosophy of art explicitly point out this circularity and the problem of verifying sincerity.
      *   **T.J. Diffey's Point:** Diffey argues that Tolstoy's sincerity criterion effectively *collapses back into the subjective response of the audience*. If we feel infected, we judge the artist sincere. There's no way to access the artist's state independently to *test* the theory objectively.
      *   **The "Unobservable Cause":** Critics emphasize that basing the objective power of art on an unobservable, private mental state fundamentally undermines the project of finding an objective criterion. It replaces one subjectivity (taste/beauty) with another (inferred sincerity based on personal infection).

  4.  **Possible Salvage Attempts & Nuances:**
      *   **Sincerity as "Truthfulness in Expression":** Some interpretations try to shift "sincerity" away from raw biographical feeling intensity towards a notion of *authenticity within the work itself*. Does the emotion expressed *ring true* to the human condition as presented? Does the artwork embody its emotion coherently? This moves it closer to condition (2) - clarity. However, this is arguably *not* what Tolstoy meant; he was quite literal about the artist's personal feeling at the moment of creation.
      *   **Focus on the Work's Effect, Not the Artist's Mind:** We can *ignore* the problematic causal claim about the artist's mind and focus purely on the *observable effect*: a work that communicates a clear, individual feeling powerfully *to us* is, *for us*, highly infectious art. The "sincerity" becomes a *metaphor* for the work's *convincing power*, not a claim about biography. This makes the theory more coherent but abandons Tolstoy's explicit emphasis on the artist's actual feeling as the causal engine.
      *   **Sincerity as Anti-Performative:** Tolstoy's target here is the decadent, artificial art of his time. "Sincerity" is his weapon against technical virtuosity devoid of genuine feeling or art created for status/fashion. In this context, "sincerity" functions less as a verifiable criterion and more as a polemical demand for art rooted in authentic human experience rather than elite conventions. Its weakness as objective proof doesn't negate its force as a critical stance against perceived artifice.

  **Conclusion & Recommendation for Your Seminar:**

  *   **Yes, it's a real soft spot:** Your analysis is correct. The dependence of the supposedly objective criterion (degree of infection) on the unverifiable, subjective state of the artist (sincerity) creates a significant circularity and undermines Tolstoy's goal of complete objectivity. This is a standard and well-founded criticism.
  *   **Tolstoy Doesn't Truly Escape It:** There isn't a convincing "get out of jail free card" elsewhere in the text. His attempts to link sincerity to clarity/individuality help define *what* sincerity looks like *in the work*, but don't solve the verification problem or the causal circularity.
  *   **Scholars Have Flagged It:** You can confidently tell your students this is a major point of critique.
  *   **Productive Discussion Points:**
      *   Why was Tolstoy so committed to the artist's inner state despite his quest for objectivity? (His religious/moral view of art as communication of feeling).
      *   Can *any* theory of art completely avoid some element of subjectivity or inference? Does Tolstoy's attempt, despite its flaw, highlight the difficulty?
      *   Is "sincerity" still a *valuable* concept in art criticism, even if it can't be objectively proven? How do we talk about "authenticity" or "conviction" in a work?
      *   Does focusing on the *effect* of the work (the infection felt *by the audience*) as the *only* criterion, dropping the causal claim about the artist's mind, salvage a usable part of Tolstoy's theory?
      *   Compare this problem to similar issues in other expression theories (e.g., Collingwood).

  You can present it clearly: "Tolstoy aims for an objective criterion based on infection, but his crucial third condition, 'sincerity,' reintroduces a profound problem. It relies on an unverifiable fact about the artist's private state, creating a potential circularity where we infer sincerity *from* the very infection it's supposed to explain. This is widely recognized as a major tension in his argument." Then open it up for discussion on *why* he does this and whether the concept holds value despite the logical flaw. This approach is both accurate and stimulating for graduate-level debate.
