  Okay, let's tackle this user's query. The user is a retired physicist who joined a philosophy discussion group. They've been discussing Galileo and the Church, focusing on his quote about the Bible teaching how to go to heaven, not how the heavens go. The group interprets this as Galileo advocating for non-overlapping magisteria (NOMA), like Stephen Jay Gould's idea. But when the user read Galileo's Letter to the Grand Duchess Christina, they noticed Galileo spent time interpreting biblical passages, which seems contradictory to NOMA. The user is confused: did the group misunderstand, or was Galileo not actually supporting a clean separation?

