  The group's interpretation aligns with Gould's NOMA, which is a modern concept. But Galileo wasn't proposing strict separation. His context was different: he was trying to convince the Church that Copernicus wasn't heretical by showing scripture could accommodate heliocentrism. His strategy was to use theology to defend science, which is the opposite of keeping them separate.

