  - **Armstrong's utility indifference**: The agent is designed to be indifferent to the shutdown action when a shutdown signal is present. That is, it doesn't care whether it is shut down or not. This directly removes the incentive to resist shutdown. However, it requires the agent to correctly interpret the shutdown signal and may be difficult to implement in practice. It directly resolves the tension for the moment of shutdown, but the agent might have incentives to avoid reaching a state where the shutdown signal is given? The theory is that it should not.

