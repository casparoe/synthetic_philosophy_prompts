answer: |-
  Here’s a 3-4 minute speech balancing warmth, clarity, and philosophical precision for Priya's award, designed to resonate with the whole audience while satisfying your ethics classmates:

  ---

  **Speech: Celebrating Priya’s Courage**

  [Start warmly, addressing the room]  
  "Good morning, everyone. As part of Student Council, I’ve introduced a lot of awards, but today is special. We’re here to honor Priya Sharma for something truly extraordinary. Two months ago, on a cold March afternoon, Priya saw a middle schooler fall through thin ice into the retention pond behind the school. In that terrifying moment—when panic could freeze anyone—Priya acted. She didn’t hesitate. She didn’t run for help first. She went straight into that icy water and pulled him to safety.  

  Now, Priya keeps saying something when people praise her: *‘Anyone would’ve done the same thing.’* And I think that tells us everything about who she is—humble, selfless, and focused on what mattered most: saving a life. But let’s be honest: *Would* everyone have done the same?  

  Think about it. Any reasonable person would have called for help. Any responsible person would’ve gotten an adult. And that would have been *enough*. It would have been the right thing to do. We all hope we’d have the presence of mind to do *that*.  

  But Priya didn’t just do the reasonable thing. She did something **more**. She saw a child in danger and thought, *‘I cannot wait.’* She risked herself without being asked, without calculating, because in that split second, her instinct was to act—not just responsibly, but heroically.  

  That’s why this award is called ‘Above and Beyond.’ It’s not about comparing Priya to anyone else who was there that day. It’s not about saying others *should* have done what she did. What she did wasn’t expected. It wasn’t required. It was a choice made in a heartbeat—a choice that went beyond duty.  

  Today, we’re also recognizing students who completed their 20 volunteer hours [*gesture politely toward volunteer pin recipients*]. That commitment matters—it shows dedication to our community. But let’s be clear: Priya’s action was different. Volunteering is a requirement we plan for; it’s a path we choose. What Priya did was an unplanned, selfless leap into danger. One is meeting an expectation; the other is surpassing it entirely.  

  So yes, Priya, *some* people might have done what you did. But the truth is, most of us hope we’d have your courage but don’t know if we would. That’s what makes this ‘above and beyond.’ Not because you owe us heroism, but because you gave it freely.  

  Priya, your modesty speaks volumes, but your actions speak louder. You didn’t just save a life—you reminded us all what compassion looks like when it’s fearless and immediate. On behalf of the entire school, thank you for showing us that extraordinary goodness isn’t about being perfect. It’s about being brave enough to act when it counts.  

  Please join me in honoring Priya Sharma with the ‘Above and Beyond’ Award."  
  [Lead applause]

  ---

  ### Why This Works:
  1. **Handles Priya’s Modesty**: Quotes her “anyone would’ve” line but reframes it as evidence of her character, not a literal truth.  
  2. **Avoids Blame**: Explicitly states that getting help was “reasonable” and “enough,” protecting bystanders from implied criticism.  
  3. **Supererogation Without Jargon**: Calls her act “not expected, not required,” “beyond duty,” and “more” than the reasonable alternative—hitting Urmson’s point clearly for your philosophy peers.  
  4. **Contrasts Volunteer Pins**: Distinguishes between “meeting an expectation” (volunteer hours) and “surpassing it entirely” (Priya’s act) without diminishing either.  
  5. **Warm & Relatable**: Uses vivid language (“icy water,” “split second,” “fearless and immediate”) and avoids academic terms. Parents and teachers will feel the emotional weight; your ethics class will nod at the precision.  
  6. **Philosophically Robust**:  
     - Clearly separates *permissible* (calling for help) from *praiseworthy* (jumping in).  
     - Aligns with Urmson: Her act exists outside the “required/reasonable” box.  
     - Sidesteps “moral sainthood” by focusing on a single, contextual act of courage—not a lifelong identity.

  ### Delivery Tip:
  Pause after "She risked herself..." and "...surpassing it entirely." Let the distinction sink in. Your tone should shift from *respectful* (describing the act) to *awe* (explaining its rarity) to *gratitude* (the closing).  

  This frames Priya as exceptional without alienating others—and your philosophy teacher will know you nailed the assignment *and* the moment. Good luck!
