answer: |-
  Here are ten targeted questions designed to press beyond Lewis's cost-benefit defense, with predicted responses and follow-ups engineered to close escape routes. Each question isolates a specific vulnerability while anticipating standard Lewisian replies.

  ### 1. **Epistemology: Modal Knowledge Without Contact**
     **Q:** If worlds are causally/spatiotemporally isolated, how can we *know* that a world where gravity is repulsive exists? Our modal intuitions (e.g., "I could have skipped breakfast") seem finely detailed, but if justification requires causal contact, isn't modal realism left with skepticism about most modal claims?  
     *Expected Lewisian Reply:* Modal knowledge is *a priori* conceptual analysis or logical consistency, akin to math. We intuit possibilities by grasping combinatorial recombinations of fundamental properties.  
     **Follow-Up:** But combinatorial recombination assumes a prior grasp of *which fundamental properties exist* and *which combinations are consistent*. How is this not circular? If I claim "a world with 17-dimensional spacetime is possible," what constrains that claim beyond *my own inability to conceive a contradiction*—which Lewis admits is fallible?  

  ### 2. **Counterpart Theory: Changing the Subject?**
     **Q:** When counterpart theory analyzes "Humphrey could have won" as "a *counterpart* of Humphrey wins in some world," isn’t this a bait-and-switch? We care about *Humphrey himself*—not a duplicate. Does this preserve the *de re* modal intuition, or replace it with *de dicto* similarity?  
     *Expected Lewisian Reply:* Counterpart relations *are* what transworld identity consists in. There’s no strict identity across worlds, so this *is* the correct analysis of *de re* modality.  
     **Follow-Up:** But Lewis grants that counterpart relations are context-dependent and vague. If I say, "Humphrey *himself* could have suffered more in defeat," and you reply "a *very similar* person suffered," haven’t you changed the subject? Why should vague similarity replace identity in our ontology?  

  ### 3. **World Individuation: Island Universes**  
     **Q:** Lewis individuates worlds by maximal spatiotemporal interrelatedness. But he admits "island universes" (disconnected spacetimes) *might* exist. If we discovered our universe has such islands, would that force modal realism to either (a) falsely count one world as many, or (b) abandon spatiotemporal unity as the criterion?  
     *Expected Lewisian Reply:* This is a problem for *physics*, not modal realism. If island universes exist, we revise "world" to mean *maximally spatiotemporally interrelated entity* (so one world = one island).  
     **Follow-Up:** But if "maximal interrelatedness" is abandoned, what *replaces* it? Without a non-arbitrary criterion, how do we avoid counting every disconnected object as a "world"—collapsing the plurality into chaos?  

  ### 4. **Theoretical Unity: Is Extravagance Necessary?**  
     **Q:** Lewis claims modal realism unifies modality, properties, and counterfactuals. But ersatzists (e.g., Plantinga, Stalnaker) achieve similar unity with abstract worlds. Why is concrete plurality *essential* to these benefits?  
     *Expected Lewisian Reply:* Ersatz worlds are "cheating"—they reduce modality to language or math but can’t ground *truthmakers* for claims like "There could be alien properties."  
     **Follow-Up:** If ersatz worlds are linguistic/mathematical constructs, why can’t they serve as truthmakers? Lewis insists truthmakers must be *concrete*, but that’s question-begging. What *independent* argument proves abstracta can’t ground modality?  

  ### 5. **Ethical/Practical Irrelevance**  
     **Q:** If other worlds are causally inert, why should I care if a counterpart of me suffers? Doesn’t this make modal realism ethically inert—and thus *practically* trivial—despite its ontological weight?  
     *Expected Lewisian Reply:* Modal realism isn’t *for* ethics. Its value is theoretical. Worlds aren’t "alternatives" for action; they’re explanatory tools.  
     **Follow-Up:** But if all concrete suffering in other worlds is *real* yet *ethically irrelevant*, doesn’t that undermine Lewis’s claim that modal realism "accommodates" ordinary modal thought? Our moral intuitions treat "possible suffering" as normatively significant—yours renders it inert.  

  ### 6. **Parsimony vs. Extravagance**  
     **Q:** Lewis dismisses ontological parsimony as "a taste for desert landscapes." But when two theories are empirically equivalent, parsimony *is* a scientific virtue (e.g., rejecting phlogiston). Why is modal realism exempt?  
     *Expected Lewisian Reply:* Parsimony in *fundamental categories* matters—but modal realism adds only one category (worlds) while reducing others (modality, properties, etc.).  
     **Follow-Up:** But you posit *infinitely many* concrete worlds. If quantitative extravagance is irrelevant, could I posit infinitely many undetectable gremlins to "explain" gravitational variance? Why not?  

  ### 7. **The Role of Actuality**  
     **Q:** If "actual" is indexical, why does *our* world have any privileged status? Why does science investigate *this* world, not others?  
     *Expected Lewisian Reply:* We care about our world because we’re *in* it. But no world is metaphysically privileged.  
     **Follow-Up:** Doesn’t this imply that physics—which studies *this* world’s laws—is arbitrary? If laws vary across worlds, why expect *our* physics to reveal fundamental truths?  

  ### 8. **Mereological Universalism & Gunk**  
     **Q:** Lewis accepts mereological universalism (any plurality composes an object). But if worlds are maximal mereological sums, and reality contains "gunk" (partless atoms don’t exist), how are worlds individuated? Gunk suggests boundless parts, threatening maximality.  
     *Expected Lewisian Reply:* Worlds are sums of *spatiotemporally* interrelated parts. Gunk doesn’t violate this.  
     **Follow-Up:** If spacetime is gunky, every region has proper parts. What makes a world "maximal"? Isn’t there always a larger sum including adjacent worlds?  

  ### 9. **The Incredulous Stare: Beyond Cost-Benefit**  
     **Q:** Lewis calls the incredulous stare a "feeble" objection. But when experts across fields (science, math) reject your ontology as counterintuitive, isn’t that *evidence* requiring more than theoretical utility?  
     *Expected Lewisian Reply:* Intuition is fallible (e.g., quantum mechanics). We must follow the arguments.  
     **Follow-Up:** But quantum mechanics has *empirical confirmation*. Modal realism has none. Without intuition *or* empiricism, what constrains the theory besides internal consistency?  

  ### 10. **Falsifiability: What Could Disprove Modal Realism?**  
     **Q:** If modal realism is insulated from empirical disconfirmation (worlds are causally isolated) and recalcitrant intuitions are dismissed, what *could* count as evidence against it? If *nothing*, doesn’t it function as dogma?  
     *Expected Lewisian Reply:* It could be falsified by showing its theoretical benefits (unifying modality, properties, etc.) are achievable more parsimoniously.  
     **Follow-Up:** But ersatzists *claim* to achieve this. Lewis rejects them because they "cheat"—but that’s just *his* intuition about truthmaking. If the debate reduces to clashing intuitions, hasn’t modal realism lost its objective footing?  

  ---

  **Key Tactics:**  
  - **Block Retreats to Cost-Benefit:** Follow-ups demand *independent arguments* for Lewis’s primitives (e.g., "Why must truthmakers be concrete?").  
  - **Target Internal Tensions:** Questions exploit Lewis’s own doubts (island universes) or clashes within his system (gunk + maximality).  
  - **Force Meta-Philosophical Engagement:** The final question pressures the speaker to defend modal realism’s status as philosophy vs. unfalsifiable speculation.  

  This sequence ensures the speaker must either defend Lewis’s axioms on grounds beyond theoretical utility or concede serious vulnerabilities in the view.
