  Okay I need to get this out of my system because I was up way too late arguing about it with my friend Priya last night. She's TA-ing a medieval philosophy section this semester and got me sucked into this whole debate about Al-Ghazali's occasionalism -- specifically the bit in the Incoherence of the Philosophers (I think it's the 17th discussion?) where he goes after Aristotelian causation with the fire-and-cotton example: the idea that fire doesn't actually burn the cotton, God just creates the burning alongside the contact, and there's no necessary connection between the two, only habitual co-occurence. I kept hammering on the obvious "doesn't this just wreck science and induction" objection -- if literally nothing necessitates anything, why should we expect fire to keep "burning" cotton tomorrow -- and she kept coming back with Ghazali's own move that it's all just God's "custom" (ada, or something like that) acting in a reliable pattern, so induction is fine even without necessity. We got stuck arguing about whether that response actually answers the objection or just relabels the mystery one level up, and also whether this is basically the same insight Hume had later (constant conjunction, no necessary connection, minus the theology) or whether that comparison is superficial and misses what Ghazali's actually doing with the "custom" idea.

  Can you write me an essay that actually settles this instead of doing the "both sides have a point" cop-out? Walk through Ghazali's argument against necessary causal connection properly, take the induction/science objection seriously along with his custom-based reply to it, bring in how Averroes pushed back on this in his rebuttal (something about it making it impossible to even attribute wisdom to God's actions if secondary causes have no real natures, if I'm remembering Priya's point right), and say something about whether the Hume comparison actually holds up. Then commit to an actual verdict: once you take the induction objection and Ghazali's reply to it seriously, is occasionalism a coherent and defensible account of causation, or does it fail? No wishy-washy "it depends how you look at it" ending, please.
