answer: |-
  ## Parking Garage Philosophy (598 words)

  The concrete cavern swallowed the sound of Anders Clark kicking a tire. "Unbelievable. We live *here*. For seven years. And neither of us can recall the number? Just... *poof*?"

  Sarah slumped against their dusty sedan, the dead phone a cold weight in her hand. "It's not *poof*, Anders. It's delegation. Efficient cognitive offloading. My phone *holds* the address. Reliably. Always has. Why waste neural real estate?"

  Anders scrubbed a hand over his face. "Because neural real estate *is* the mind, Sarah! Your phone isn't *in* your head. It's a tool. A damn useful one, but still just a tool. You might as well say the screwdriver in the trunk is part of your hand."

  "Bad analogy," Sarah shot back, pushing off the car. Her voice echoed slightly. "The screwdriver doesn't *store* and *process* information critical for my navigation, accessible instantly. My phone does. It’s functionally equivalent to biological memory when I need it. Otto needs his notebook for Alzheimer's, I need my phone for modern life. The *parity* is the point. If it walks like a duck, solves the problem like a duck..."

  "It’s *not* a duck!" Anders interrupted, frustration sharpening his tone. "It’s a duck-shaped tool you *use*. That's the category mistake. Just because you *couple* with it tightly, constantly, doesn't mean it *constitutes* your mind. It’s coupled, sure. But it’s not *constituted*."

  Sarah crossed her arms. "So, where's the line, Professor? My hippocampus stores the info, that's 'real' memory. The notebook stores it, that's 'external' memory. But the *function* – retrieval, reliability, integration into action – is identical. Why does the skull bone get to be the magic wall? If the notebook counts for Otto, functionally, why not the phone for me? The principle demands parity."

  Anders leaned against a concrete pillar, the fluorescent light flickering above him. "Okay, parity. Fine. But what about the *nature* of the content? Your hippocampus *generates* or *intrinsically holds* the memory trace, right? Or at least, it's biologically integrated. The phone? It just *stores* symbols. *Derived* content. You put it there. It doesn't 'know' our address. It displays pixels based on code *you* programmed it with. Your brain *understands* the address. Big difference."

  "Semantics!" Sarah threw her hands up. "Understanding emerges from the *system*! Me-plus-phone. When I recall with my bio-memory, neurons fire based on stored patterns. When I 'recall' with the phone, I trigger a retrieval process based on stored data. The *outcome* – knowing where to go – is what matters for cognition. The implementation is irrelevant if the function is preserved."

  Anders pushed off the pillar, pacing a short, tight line. "Preserved until the battery dies in a damn parking garage at 2 AM! But okay, let's grant you the phone as 'mind.' Where does it stop, Sarah? Is the GPS satellite part of 'your' mind? The cell tower? The entire internet? Is Wikipedia now part of your belief system *constitutively*? That way lies cognitive bloat. Absurdity. Suddenly, 'your' mind includes half the planet's infrastructure and every server farm in Nevada."

  Sarah paused, her earlier heat cooling slightly. She rubbed her temples. "That... that's a fair push. The 'cognitive bloat' objection. Andy Clark himself wrestles with it. Maybe... maybe the line is reliable, constant access? Direct control? The phone is in my pocket, instant on, personalized. The internet isn't *reliably* mine in the same way. It's... potential, not actualized resource."

  "Potential you access constantly!" Anders countered, but his voice was losing its edge, replaced by weary reason. "Is Siri part of your mind when you ask her the capital of France? Or just a really fast librarian you yell at?"

  A faint, tired smile touched Sarah's lips. "Maybe... maybe it's about the *kind* of coupling. Otto's notebook is dedicated, personal, constantly consulted for specific cognitive tasks. Like my contacts, calendar, maps... the stuff I *rely* on, woven into my daily cognitive loops. Not just any random Google search."

  Anders sighed, the sound heavy in the stillness. He walked back to the driver's side door. "So, the dedicated notebook counts. The dedicated, personalized, always-there phone *might* count. But the entire chaotic, glorious mess of the web? Probably not." He tapped the roof of the car. "Still feels like a dangerous slope. And it doesn't get us home."

  "No," Sarah admitted, slumping into the passenger seat. She stared at the blank phone screen. "Functional parity or not... right now, it's just a brick. And my bio-memory is failing spectacularly." She glanced at him, a flicker of their old academic sparring in her eyes. "Still think it's just a tool?"

  Anders started the engine, the sound startlingly loud. "I think," he said, pulling out slowly, "that if we define 'mind' so broadly, we risk losing what makes it... *us*. And right now, I just want *us* to find 327 Oakwood Drive." He managed a tired smirk. "Sharp as ever, Dr. Clark."

  "Still a bulldog, Dr. Clark," Sarah murmured, gazing out at the endless concrete ramps, the philosophical lines blurring as fatigue won. The GPS screen lit up, waiting for an input neither could provide.
