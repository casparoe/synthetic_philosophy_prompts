prompt: |-
  This summer I've been reading through some of W. V. O. Quine's papers for an independent project that grew out of my IB Theory of Knowledge class, where we spent a few weeks on the fact/value distinction. Quine is mostly known for his work in logic and epistemology, and both my teacher and most of what I could find online treat him as a philosopher who basically stayed out of ethics. But I tracked down a short, strange 1978 piece of his called "On the Nature of Moral Values" — which appeared that year both in the journal Critical Inquiry and in a festschrift for William Frankena, Charles Stevenson, and Richard Brandt, and was later folded into his essay collection Theories and Things — where he actually does take the subject on directly. He opens with a scenario about a dog that, for some unclear reason, ignores a turnip lying nearby, and uses it to argue that all behavior is a tangle of belief and desire. From there he argues that ethics stands on much shakier methodological ground than science does, because moral disagreements have nothing playing the role that observation sentences play in science: no shared trigger that makes everyone assent the instant they're confronted with it, the way a rabbit darting across a field makes everyone standing there agree that a rabbit just ran by. Still, he stops short of dismissing moral discourse as meaningless, and the handful of secondary sources I've found seem genuinely divided on whether the essay leaves Quine as a kind of noncognitivist, a naturalist who thought ethics could eventually be brought into the scientific fold like everything else, or something in between.

  Here is what I can't work out on my own, and my teacher wasn't much help either. Quine, together with Hilary Putnam, is also responsible for the indispensability argument: the claim that we ought to believe in things like numbers and sets because they are indispensable to our best scientific theories. More than a decade after Quine's death, the philosopher David Enoch built a version of that very same argument for moral realism, claiming that moral facts are just as indispensable to practical deliberation as mathematical facts are to physics, even if they don't do the same causal-explanatory work. Quine never got the chance to respond to Enoch directly, and I haven't come across anyone who has seriously tried to reconstruct how he would have. So: reasoning only from commitments Quine actually held — his naturalism, his holism, his insistence on observation as the anchor of any respectable ontology, and his own doubts about how methodologically secure ethics could ever be — would he have accepted Enoch's move as a legitimate extension of his own argument, or would he have had principled grounds for blocking it? Feel free to note considerations that cut in each direction, but please don't leave the question hanging: reconstruct the reasoning Quine most plausibly would have used, and end with a clear, defended verdict.
reasoning: |-
  Okay, the user has a deep question about Quine's philosophy and how he might respond to David Enoch's extension of the indispensability argument to moral realism. Let me start by recalling Quine's key positions. His naturalism emphasizes science as the ultimate arbiter of truth. Holism suggests that our beliefs form a web, but observation sentences are crucial for anchoring that web. In his 1978 essay, Quine argued that ethics lacks the kind of observational grounding that science has. Moral disagreements don't have the same shared triggers like seeing a rabbit.

  Now, Enoch argues that moral facts are indispensable for practical deliberation, similar to how math is indispensable in science. But Quine's naturalism restricts ontology to what's scientifically indispensable. Practical deliberation isn't part of science; it's more about decision-making. Quine might see this as a category error. Ethics, for him, doesn't contribute to explaining empirical phenomena, which is key for scientific theories.

  Also, Quine's holism ties confirmation to observation. Math gets a pass because it's woven into the scientific web tested against observations. Moral claims, however, don't have observational consequences that can be tested. Even if they're part of deliberation, they don't help predict or explain observable events. So, Enoch's move might not meet Quine's criteria for ontological commitment.

  The user might be looking for a clear verdict based on Quine's principles. They might also be interested in understanding why Quine separates science and ethics so strictly. Underlying this, they could be exploring whether moral realism can be defended within a naturalist framework, which is relevant to their Theory of Knowledge class. So, emphasizing Quine's strict naturalism and the role of observation would address their deeper need to reconcile ethical discourse with scientific methodology.
answer: |-
  Based on Quine's core commitments – naturalism, holism, the primacy of observation, and his specific doubts about ethics – he would **reject Enoch's extension of the indispensability argument to moral realism.** While Enoch's move is clever and parallels Quine's structure, Quine would see fundamental disanalogies between the indispensable roles of mathematics in science and morality in practical deliberation, grounded in his naturalistic criteria for ontological commitment. Here's the step-by-step reconstruction of Quine's likely reasoning:

  1.  **The Core of Quine's Indispensability Argument:** Quine's argument isn't *just* about indispensability *simpliciter*. It's about indispensability **within our best *scientific* theories of the world**, which are tested against **observation sentences** (the tribunal of experience). We posit mathematical entities because they are essential components of the very theories that successfully predict and explain observable phenomena. Their justification flows from their role in this empirically anchored, confirmable web of belief.

  2.  **Naturalism as the Constraint:** Quinean naturalism holds that philosophy is continuous with science. The methods and standards for determining what exists are fundamentally those of natural science. Ontology is settled by what our best scientific theories quantify over. Anything outside this scientific framework lacks the methodological credentials for genuine ontological commitment.

  3.  **The Problem with "Practical Deliberation":** Quine would sharply distinguish *practical deliberation* from *scientific theorizing*.
      *   **Lack of Empirical Anchoring:** While practical deliberation is real and important, it lacks the crucial anchor in *shared observation sentences* that Quine saw as the hallmark of scientific objectivity and the key to resolving disagreements. As he argued in "On the Nature of Moral Values," there is no moral analogue to seeing a rabbit run by. Moral disagreements persist precisely because there is no shared sensory trigger forcing assent in the same way.
      *   **Not "Best Scientific Theory":** Practical deliberation, even if indispensable for *action* and *decision-making*, is not itself part of our best scientific *description and explanation* of the observable world. It belongs to a different domain – the domain of planning, prescribing, and evaluating, not explaining natural phenomena. Quine's naturalism restricts ontological commitment to the descriptive/explanatory project of science.
      *   **Holism's Limits:** While Quinean holism allows that beliefs face experience as a whole, the *confirmation* and *revision* process is driven by clashes with observation at the periphery. Moral claims, embedded in practical deliberation, are too far removed from this periphery. Revising a moral belief based on experience (e.g., witnessing suffering) doesn't function like revising a scientific hypothesis based on a failed prediction; the link is more complex, mediated by desires, values, and norms, which Quine saw as lacking the same empirical constraints.

  4.  **Indispensability ≠ Ontological Commitment (in this context):** Quine would agree that normative concepts (like "should," "reason," "good") are indispensable for practical deliberation. We *must* use them to decide what to do. However, he would argue this indispensability does **not** entail the existence of *moral facts* as part of the natural world's furniture. It only entails the indispensability of *moral discourse* or *moral concepts as psychological/social tools* for navigating life. We need the *language* of morality to deliberate, just as we need the language of mathematics to do physics, but the ontological conclusion only follows for mathematics because its language is embedded within empirically testable science. The indispensability of moral language for *practical* purposes doesn't meet the naturalistic bar for positing corresponding *facts*.

  5.  **The Causal/Explanatory Gap:** Quine would emphasize a key difference Enoch downplays: mathematical entities, while abstract and non-causal, are indispensable within theories that *do* provide causal explanations of observable events. Physics *explains* why the apple fell using equations quantifying over numbers and functions. Moral facts, in Quine's view (as expressed in the 1978 essay), play no analogous *causal-explanatory* role within science. They don't help explain *why* physical events happen. Their indispensability, even if granted for deliberation, is non-explanatory within the scientific framework that defines Quinean ontology.

  6.  **Quine's View of Ethics Revisited:** Quine's 1978 essay places ethics on "shakier methodological ground" precisely because it lacks the observational anchor. He saw moral judgments as complex blends of belief and desire, deeply entangled and lacking the clear empirical checkpoints of science. While he didn't dismiss them as meaningless (they have expressive and motivational force), he denied them the same epistemic status and ontological grounding as scientific claims. Enoch's argument attempts to bootstrap moral facts into ontology using a tool (indispensability) that Quine designed specifically for the scientific context. Quine would see this as misapplying the tool.

  **Verdict:**

  **Quine would have rejected Enoch's extension of the indispensability argument to moral realism.** His principled grounds are his **naturalism** – restricting serious ontology to what is indispensable within our best, empirically testable *scientific* theories – and his view that **ethics fundamentally lacks the shared observational anchor** that allows science (and the mathematics embedded within it) to achieve the methodological security and objectivity necessary for ontological commitment. The indispensability of moral concepts for practical deliberation demonstrates their utility in human life, but not, for Quine, the existence of corresponding moral facts within the natural world described by science. Enoch's move, while structurally similar, transplants the indispensability argument into a domain (practical reason) that Quine's naturalism explicitly excludes from the realm of fact-stating discourse capable of grounding ontology.
