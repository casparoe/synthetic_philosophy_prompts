     Example 2 (Restriction):
          Start with U1: x+y<=1 -> solution (0.5,0.5) by both.
          Then restrict to U2: x+y<=1 and y<=0.5 -> then Nash: (0.5,0.5), KS: (0.6667,0.3333).

