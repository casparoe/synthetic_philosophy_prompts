   Participants:
     Dr. Nash (defending Nash solution)
     Dr. Kalai (defending KS solution)

   Setting: After a workshop, at a whiteboard.

   We'll do two examples on the whiteboard:

     Example 1 (Expansion): 
          S1: x+2y<=2 -> solution (1,0.5) by both.
          S2: convex hull of S1 and (2.5,0.5) -> frontier y=1-0.2x for x in [0,2.5].
