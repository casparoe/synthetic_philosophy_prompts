     Dr. Kalai: "And in the restriction example, your solution ignores that B is now weaker overall, even if the solution point is still available. We think the ideal point is a crucial piece of information about the bargaining context."

     Both pause, acknowledging the other's point.

     Dr. Nash: "I see your point about the ideal point mattering, but I worry that it makes the solution too sensitive to changes in the set that are far from the solution."

     Dr. Kalai: "And I see your point about stability, but I worry that the Nash product can lead to counterintuitive results when the set expands in a way that benefits one player disproportionately, without sharing."

     They nod, agreeing to disagree, and head out for coffee.

