  ### Dialogue: The Merger Bargain  
  **Setting:** *Two bargaining theorists, Dr. Nash (defending Nash) and Dr. Kalai (defending Kalai-Smorodinsky), argue at a whiteboard after a seminar. They sketch a scenario involving two firms, A and B, negotiating surplus division from a merger. The disagreement point is (0,0).*

  ---

  **Dr. Nash**: (draws a convex set on the whiteboard) Let’s start simply. Firm A is a tech startup, B is a manufacturer. **Baseline feasible set S1**: Payoffs bounded by the line from (0,1) to (1,0). Max surplus is 1. Symmetric, so both solutions agree: split (0.5, 0.5).  
  *(Marks (0.5,0.5) on the line)*  

  **Dr. Kalai**: Fine. Now, suppose Firm A’s outside option improves—say, a rival bidder emerges. **New feasible set S2**: We expand to the convex hull of S1 and a new point, (1.2, 0.2). The frontier becomes the line from (0,1) to (1.2,0.2).  
  *(Redraws the set, showing a steeper frontier)*  

  **Dr. Nash**: (calculating) Nash solution maximizes \(x \cdot y\). Under S2, the optimum is at (1.0, 0.4). Firm A gets *more* (1.0 > 0.5), B gets *less* (0.4 < 0.5).  
  *(Points to (1.0, 0.4) on the new frontier)*  

  **Dr. Kalai**: Precisely the problem! A’s outside option improved—objectively helping both. Yet Nash *reduces* B’s payoff. KS avoids this: our ideal point is (max A, max B) = (1.2, 1.0). We scale proportionally: the ray from (0,0) to (1.2,1.0) hits the frontier at (0.9, 0.75).  
  *(Draws a ray to (0.9,0.75))*  
  A gains (0.9 > 0.5), B *also* gains (0.75 > 0.5). Individual monotonicity—when the set expands in a way that benefits one player, they shouldn’t be punished. Nash fails this.  

  **Dr. Nash**: (leaning in) But your “fix” breaks when we remove *irrelevant* alternatives! Consider **set S3**: Take S1 and remove an unused option, say (0.9, 0.1). The feasible set shrinks, but (0.5,0.5) is still available and unchanged. Nash respects IIA: solution stays (0.5,0.5).  
  *(Erases a section of S1, far from (0.5,0.5))*  

  **Dr. Kalai**: (nods) In S3, KS recalculates the ideal point. Originally (1,1), but removing (0.9,0.1) doesn’t change max B (still 1), *does* change max A—from 1 to 0.5? No, max A is still 1 at (1,0).  
  **Dr. Nash**: Exactly! The *only* change is dropping an interior point no one wanted. Yet KS shifts to… let’s see, ideal point (1,1), ray hits frontier at (0.5,0.5). Same as Nash.  
  **Dr. Kalai**: Not so fast. Suppose we remove a *boundary* point. Take S1 and impose a cap: **set S4** where B’s payoff can’t exceed 0.7. The frontier now runs from (0.3,0.7) to (1,0).  
  *(Redraws S4 with a flat segment at y=0.7 from x=0.3 to x=0)*  
  Nash? Still (0.5,0.5), since it’s in S4.  

  **Dr. Kalai**: But KS recalculates the ideal point: max A is still 1, max B is now 0.7. The ray to (1,0.7) hits the *new* frontier at (0.65, 0.45). B gets less (0.45 < 0.5) purely because we constrained payoffs B *wasn’t even getting*! Monotonicity is violated here—B is hurt despite no change to the options near the solution.  

  **Dr. Nash**: (pauses) So we agree the other’s solution behaves oddly in one scenario. But IIA isn’t just “no harm from removing trash.” It’s a stability axiom: solutions shouldn’t shift if unchosen options vanish. Your ideal point is hypersensitive to distant constraints. In the merger, if we accidentally include an irrelevant patent license (inflating A’s max payoff), KS forces B to concede more, even if it’s never used!  

  **Dr. Kalai**: And Nash’s product rule is hypersensitive to curvature. In the expanded set, why should A grab all gains when B’s opportunities improved too? Your “efficiency” prioritizes the product over equity. KS’s proportional sacrifice—equalizing relative concessions—is fairer when outside options shift.  

  **Dr. Nash**: Yet in S4, you punish B for a constraint that doesn’t bind! If we can’t agree on what “irrelevant” means—  
  **Dr. Kalai**: —or on how to measure “fairness” when the pie changes—  
  *(Both fall silent, studying the board)*  

  **Dr. Nash**: (quietly) Your monotonicity *does* better when expansion helps one player unambiguously. But IIA protects against noise in the feasible set.  
  **Dr. Kalai**: And your product *is* elegant. But it fixates on local curvature, not global opportunity. The ideal point matters.  
  **Dr. Nash**: So we’re at an impasse. Coffee?  
  **Dr. Kalai**: (smiles) Only if we split the bill… KS-style.  

  ---

  ### Key Pedagogical Points  
  - **Nash’s flaw**: Expanding the set to help one player (via better outside options) can *reduce* their payoff under Nash if the new frontier curvature favors the other player. Nash prioritizes "local" efficiency (product maximization) over global equity.  
  - **KS’s flaw**: Removing irrelevant alternatives can alter the ideal point and shift the solution, even if the removed options are Pareto-inferior to the original solution. KS prioritizes "aspirations" (ideal point) over stability.  
  - **Unresolved tension**:  
    - Nash: Stability (IIA) and local efficiency justify ignoring "distant" changes.  
    - KS: Monotonicity and proportional sacrifice require accounting for shifts in bargaining power.  
  - **Why it matters**: Real-world bargaining (mergers, treaties) involves changing feasible sets. Economists must choose axioms based on context—e.g., IIA for contract stability, monotonicity for shifting power dynamics. Neither is "wrong."  

  > **Suggested follow-up**: Assign students to design a merger example where Nash and KS *agree*, then modify it to force a divergence. "Which solution would Firm B lobby for, and why?"
