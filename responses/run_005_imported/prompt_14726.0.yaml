    For KS, in S1 the solution was (0.5,0.5), but in S3 it is (0.6667,0.3333). This is because the ideal point changed from (1,1) to (1,0.5). 

    Now, the complaint for KS: if we start with S1 and then we add the constraint that y<=0.5 (which is a restriction that may be seen as irrelevant because the solution in S1 was (0.5,0.5) which satisfies y<=0.5), then the KS solution changes to (0.6667,0.3333). 

    But note: the point (0.5,0.5) is still available. Why should the solution change? The KS defender would say: the ideal point changed, so the relative bargaining power changed.

    The Nash defender says: since (0.5,0.5) is still available and was the solution in the bigger set, it should remain the solution.

    This is the kind of example we want.

    So in dialogue, we can have:

    Scenario 1: S1 (x+y<=1, x>=0,y>=0) -> both agree on (0.5,0.5).
    Scenario 2: S3 (subset of S1: x+y<=1, x>=0,y>=0, y<=0.5) -> Nash: (0.5,0.5), KS: (0.6667,0.3333).

    The change: we added the constraint that y cannot exceed 0.5. This seems to be a restriction that only hurts player B. But note, in the Nash solution, B's payoff is 0.5 which is still allowed. In the KS solution, B's payoff drops to 0.3333.

    The Nash defender will say: This constraint is not binding at the solution, so it shouldn't matter. The KS solution changes, which is counterintuitive.

    The KS defender will say: The constraint changes the ideal point for B from 1 to 0.5, which reflects that B's bargaining position has weakened. Therefore, B should get less.

