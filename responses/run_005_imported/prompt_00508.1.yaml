answer: |-
  You're absolutely right that both paradoxes exploit self-reference to create logical trouble, and solutions to the Liar *often* help with Curry. However, Curry's paradox presents unique challenges that force logicians to consider adjustments *beyond* those needed for the Liar, or to prioritize different aspects of a solution. Here's why they aren't always perfectly co-solved:

  1.  **The Core Difference: Negation vs. Implication & Contraction:**
      *   **Liar:** Primarily challenges fundamental assumptions about **truth values, negation, and bivalence**. It forces us to confront sentences that seemingly cannot consistently be assigned True or False.
      *   **Curry:** Primarily challenges fundamental assumptions about **implication (`→`) and the structural rule of *Contraction***. It shows that certain intuitive properties of `→` combined with self-reference and the ability to use an assumption multiple times (Contraction) lead to triviality (everything is true), *even without using negation*.

  2.  **Why Liar Fixes *Might Not* Fully Defuse Curry:**
      *   **Truth-Value Gaps (e.g., Kripke):** A common Liar fix allows sentences to be neither True nor False (gappy). For the Liar sentence L ("L is false"):
          *   If L is neither T nor F, assigning it a third value avoids the contradiction.
      *   **Curry in a Gappy Logic:** Consider the Curry sentence C ("If C is true, then everything is true" or C ≡ (T(C) → ⊥), where ⊥ is absurdity/falsity).
          *   If C is *neither* T nor F, what is the status of the *implication* `T(C) → ⊥`?
          *   Crucially, **`→` often retains its classical truth table in gappy logics.** If the antecedent `T(C)` is false (because C isn't true) or indeterminate, the implication `T(C) → ⊥` is considered **True** (by the classical/material conditional rule: false antecedent makes the whole implication true).
          *   But if `T(C) → ⊥` is True, and C *just is* `T(C) → ⊥`, then **C is True**! This contradicts our initial assignment that it was neither T nor F. The paradox potentially reappears.
          *   *Solution Attempt:* Modify the logic of `→` (e.g., use a stronger conditional like in relevant logic) or adjust the truth conditions for implications with indeterminate components. This goes *beyond* just adding gaps.

      *   **Paraconsistency (e.g., LP):** Another Liar fix allows sentences to be both True and False (glutty). For L:
          *   L being both T and F accommodates its claim of its own falsity.
      *   **Curry in a Paraconsistent Logic:** In a simple paraconsistent logic like Priest's Logic of Paradox (LP):
          *   The inference rule `A, A → B ⊢ B` (Modus Ponens) is generally valid.
          *   Contraction (if `A → (A → B)` is true, then `A → B` is true) might still hold.
          *   **Problem:** The Curry derivation *relies heavily on Modus Ponens and Contraction*. If these rules are preserved, the proof of triviality (`⊥`) often **still goes through** within the paraconsistent system! While the logic tolerates *some* contradictions (like the Liar), it cannot tolerate the *triviality* produced by Curry without collapsing. True triviality means *every* sentence is true, including contradictions, but also their negations, destroying any useful distinction.
          *   *Solution Attempt:* Weaken Modus Ponens for the relevant conditional or, more commonly, **reject Contraction**. This is a significant structural change not required by the Liar alone.

  3.  **The Crucial Role of Contraction:**
      Curry's paradox crucially depends on the **structural rule of Contraction**. Informally, Contraction says: "If you can prove B using assumption A twice, you can prove B using A once." Formally: If `Γ, A, A ⊢ B` then `Γ, A ⊢ B`. In the context of implication, it validates `(A → (A → B)) → (A → B)`.
      *   The standard Curry proof uses the assumption `T(C)` (which is equivalent to `C` itself) *multiple times*. Contraction allows this.
      *   **Key Insight:** Logics that **reject Contraction** (like some substructural logics - Linear Logic, Affine Logic) can block the Curry paradox *even if they keep a relatively strong implication and bivalence*. The Liar paradox doesn't inherently require Contraction in the same way. So, a solution targeting Contraction specifically addresses Curry but isn't necessary for the Liar.

  4.  **Why People Emphasize Separate Treatment:**
      *   **Highlighting Different Vulnerabilities:** Curry exposes problems specifically related to the *conditional* and *structural rules* (like Contraction) that the Liar, focused on negation and truth values, doesn't directly address. Logicians want to understand *all* the weak points self-reference can exploit.
      *   **Testing Solution Robustness:** A proposed solution to the Liar (e.g., gaps, gluts) is seen as inadequate if it *doesn't* also handle Curry. Curry acts as a stringent test case. If a Liar solution fails against Curry, it forces refinement (e.g., modifying the conditional, rejecting contraction).
      *   **Focus on Triviality:** Curry produces *triviality* (everything true), which is even more catastrophic than a simple contradiction. Preventing triviality is a paramount concern, and Curry shows it can arise directly from implication and self-reference without negation.
      *   **Independent Motivation:** Some logicians are primarily motivated by understanding implication or resource-sensitive reasoning (where Contraction is suspect). For them, Curry is the *primary* paradox driving their research, and the Liar is handled as a consequence or separate issue.

  **In Summary:**

  *   Yes, solutions to the Liar (gaps, gluts) *often* form the *basis* for handling Curry.
  *   **However, Curry specifically targets implication (`→`) and the structural rule of Contraction.**
  *   Naive implementations of gappy or glutty solutions might *still* be vulnerable to Curry if they retain a classical-like conditional and contraction.
  *   Fully defusing Curry within these frameworks usually requires **additional adjustments**: modifying the logic of the conditional (making it "relevant" or "non-material") and/or **rejecting the structural rule of Contraction**.
  *   Alternatively, one can attack Curry *directly* by rejecting Contraction, which isn't necessary for the Liar.

  So, while the paradoxes are deeply related siblings born of self-reference, Curry's dependence on implication and contraction means it sometimes demands *extra* logical surgery or highlights weaknesses in Liar fixes that need patching. People treat it separately to emphasize these specific logical mechanisms and ensure solutions are robust against *all* forms of semantic catastrophe.
