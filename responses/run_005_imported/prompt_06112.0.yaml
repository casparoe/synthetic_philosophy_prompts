  Next, the objection. The student cites Parfit's point about the 1 vs. 1,000,000 case being a harder bullet to bite. That's correct, but I should check if they explained why this is problematic. The student did mention it's counterintuitive but didn't delve into the implications for Taurek's reasoning. Maybe that's a minor omission.

