     - Determinacy: Casey says causal covariance fixes content (e.g., neuron firing covaries with *flies*, not BBs, under normal conditions). Terry asks: what are "normal conditions" without history?  
  6. **End unresolved**: Both score points. Terry: Swampman is a philosophical zombie. Casey: Denying his mind is like denying biology when life emerges from non-life.  

  Key nuances:  
