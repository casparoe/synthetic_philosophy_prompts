answer: |-
  Here's a toast that honors Mara's unique character without turning her into a caricature, acknowledges her philosophy with warmth and humor, centers her love for Dev, and keeps the celebration joyful. It subtly addresses the family eye-rolls by reframing her intensity as a form of deep care:

  ---

  **(Clink glass gently)**

  "Hi everyone. For those who don't know me, I’m [Your Name], and I’ve had the immense privilege of being Mara’s friend for [Number] years. Now, being asked to give the toast for Mara and Dev is… well, let’s just say I felt a familiar wave of pressure. Because when Mara asks you to do something, you know she’s *thought* about it. Deeply. Probably run a cost-benefit analysis. Maybe even modeled a few scenarios. **Laughter** Seriously, Dev, you know exactly what I mean.

  Mara is… well, she’s Mara. The only person I know whose idea of light reading is moral philosophy textbooks, who can turn a debate about *appetizers* into a surprisingly profound discussion about resource allocation, and who genuinely, earnestly, wants to make the world a little less broken. She calculates impact with spreadsheets, sure, but the *drive* behind it? That’s pure, uncut Mara. It’s not cold logic; it’s a fiercely warm heart that just refuses to look away from suffering. It’s seeing a problem and saying, 'Okay, what can *I* actually *do*?' – and then doing it, relentlessly. That’s not being a saint; that’s being incredibly, wonderfully *Mara*.

  She agonized over this wedding. We all know she did. Spreadsheets were involved. Malaria nets were weighed against canapés. **Warm laughter, glance at Mara**. But what that agonizing tells me, what it tells *us*, isn’t just about utility functions. It tells us how deeply she feels the weight of her choices, how seriously she takes her commitment to doing good. And crucially, Dev? It tells us how incredibly important *this* moment, *this* celebration with all of *you*, truly is to her. Because she chose *this*. She chose gathering the people she loves to witness and celebrate this massive, joyful step in her life *with* Dev.

  And Dev… Dev, you are the perfect counterweight and partner to this force of nature. You get her. You don’t just tolerate the spreadsheets and the philosophical deep dives at 11 PM; you engage with them, you challenge her gently, you ground her. You understand that her intensity isn't detachment, but a profound form of caring. You see the woman who meticulously calculates donation impact *and* the woman who will drop everything with fierce loyalty when a friend is hurting. You love all of her – the philosopher, the pragmatist, and the deeply loving partner.

  That’s what this day is really about. It’s not about justifying the cost per head (though Mara probably could!). It’s about celebrating a love built on profound mutual respect, shared values, and a deep understanding of each other’s quirks and convictions. It’s about two people who found in each other someone who makes their chosen path – a path focused on compassion and making a difference – not just sustainable, but joyful.

  So, let’s raise our glasses:

  To Mara and Dev. May your marriage be filled with the same clarity of purpose you bring to everything else, tempered by the grace and laughter you find in each other. May you continue to challenge the world and each other to be better, while never forgetting the immense joy found right here, in this partnership. May your love be a constant source of strength as you navigate life’s complex equations together. And may you always find the perfect balance – between saving the world, and savoring every single moment of your life together. Cheers!"

  ---

  **Why this works:**

  1.  **Acknowledges Her Philosophy Directly & Affectionately:** Uses humor ("spreadsheets," "cost-benefit analysis," "Malaria nets vs. canapés") to disarm potential awkwardness and show familiarity. It frames her utilitarianism as an intrinsic, earnest part of *who she is*, not a performance.
  2.  **Centers the Heart, Not the Calculus:** Explicitly states her drive comes from a "fiercely warm heart" and "refusing to look away." This counters the potential "cold logic" perception and aligns with Wolf's critique of joyless sainthood.
  3.  **Reframes the Wedding Agony:** Positions her deliberation as proof of how *important* celebrating love and community is to her. It wasn't just a cost analysis; it was a *value* judgment where *this* celebration won.
  4.  **Focuses on Dev & Their Partnership:** Makes Dev central to the toast. Highlights his understanding and grounding influence, showing how their love complements and supports her nature. This is key – the toast is about *them*.
  5.  **Balances Seriousness with Joy:** The core message is about love, partnership, and joy ("saving the world and savoring every moment"). The philosophy is the context, not the subject.
  6.  **Handles the "Moral Saints" Note:** By emphasizing her warmth, humor (implied in knowing her), fierce loyalty, and the *joy* she finds in her partnership, it explicitly avoids portraying her as one-dimensional or devoid of personal fulfillment. The toast *celebrates* her choices as part of a rich life.
  7.  **Addresses the Eye-Rolls (Subtly):** The affectionate humor and reframing ("It’s not cold logic; it’s a fiercely warm heart") help the skeptical family see her intensity as a form of deep caring, making it more relatable and less alienating.
  8.  **Uses Accessible Language:** Grounds the philosophy in relatable concepts ("deeply feels the weight," "commitment to doing good," "shared values") without jargon.

  **Delivery Tip:** Speak warmly, with genuine affection. Let the humor land naturally. Make eye contact with Mara and Dev, especially during the parts about their partnership. The tone should be celebratory and loving, acknowledging her uniqueness as a core part of why she's loved. Good luck! She's lucky to have a friend who gets it and wants to honor her so thoughtfully.
