  Okay, let me start by unpacking the user's question. They're in a seminar on normative ethics, and a classmate argued that act utilitarianism is refuted by computational complexity, specifically NP-hard problems. The user hasn't found a flaw and is confused why utilitarians still take act utilitarianism seriously.

  First, I need to recall what act utilitarianism is. It's the theory that the right action is the one that maximizes overall welfare. The classmate's argument is that finding that optimal action is computationally infeasible because it's like solving an NP-hard problem. Since no algorithm can do this efficiently in real-world scenarios, act utilitarianism can't provide practical guidance, thus it's refuted.

  Now, why is this argument compelling? It uses computer science, which seems objective, unlike moral intuitions. But I remember that utilitarians often distinguish between the criterion of rightness and decision procedures. The criterion defines what's right, while the decision procedure is how we achieve it. So even if we can't compute the optimal action, the theory still holds that the right action is the one that maximizes utility, even if we don't know what it is.

  The user might be conflating epistemic limitations with the theory's validity. Just because we can't always know the right action doesn't mean the theory is wrong. It's like saying physics is invalid because we can't perfectly predict every particle's motion. But physics still provides approximate models. Similarly, utilitarians use heuristics like rules of thumb (e.g., don't lie) that generally lead to good outcomes without complex calculations.

  Also, the classmate's argument assumes that act utilitarianism requires identifying the absolute optimum. But utilitarians often argue that satisficing—choosing actions that are good enough—is sufficient in practice. This shifts the focus from finding the best possible action to improving outcomes incrementally. 

  Another point: the computational complexity argument might overstate the problem. Many real-world decisions don't require evaluating every possible action. We use past experiences, cultural norms, and simplified models to narrow options. Plus, some optimization problems have efficient approximations. For example, while traveling salesman is NP-hard, there are algorithms that find near-optimal solutions quickly.

  The user might also be missing that utilitarianism is a normative theory, not a descriptive one. It sets an ideal standard, similar to how physics uses frictionless models. The impossibility of perfect computation doesn't negate the standard; it just means we aim for the best we can achieve.

  Why do utilitarians still hold the theory? Because the core principle—maximize welfare—remains compelling despite practical challenges. Alternatives might have their own issues, and rejecting utilitarianism due to computational limits doesn't automatically make other theories viable. Plus, heuristics and rules derived from utilitarianism can be effective guides.

  The user's deeper need might be understanding how ethical theories withstand practical objections. They might want reassurance that act utilitarianism isn't invalidated by real-world constraints. Or they could be seeking arguments to counter their classmate's point. They might also be interested in how different fields (CS and philosophy) interact here.

  I should address that the computational argument doesn't refute utilitarianism's ethical claims but highlights implementation challenges. Emphasizing the distinction between criterion and decision-making, the role of heuristics, and the theory's aspirational nature would clarify why utilitarians persist. Also, noting that other ethical theories face similar practical issues could help.
answer: |-
  Your classmate's argument is clever and highlights a genuine practical challenge for act utilitarianism (AU), but it doesn't constitute a fatal *refutation* of AU as a normative ethical theory. Here's why contemporary utilitarians generally remain unpersuaded by computational complexity objections, broken down into key philosophical distinctions and responses:

  1.  **Distinguishing the Criterion of Rightness from the Decision Procedure:**
      *   **Core Insight:** AU is fundamentally a theory about what *makes* an action right or wrong (its *criterion of rightness*: maximizing aggregate welfare). It is *not* primarily a theory about how moral agents *should decide* what to do in practice (their *decision procedure*).
      *   **The Objection's Target:** Your classmate's argument attacks the *feasibility of the decision procedure* implied by a naive interpretation of AU. It shows that reliably *identifying* the uniquely optimal action in complex real-world scenarios is computationally intractable.
      *   **The Utilitarian Response:** Utilitarians readily concede that humans (and likely any finite computational system) cannot reliably perform the astronomical calculations required to identify the *absolute* utility-maximizing action in most real-world situations. However, they argue this does not invalidate the *criterion* itself. The rightness of an action is still *defined* by its consequences, even if we can't perfectly calculate them. The theory tells us *what property* makes an action right (maximizing welfare), not that we must always *know* with certainty which action possesses that property.

  2.  **Satisficing vs. Optimizing (in Practice):**
      *   **Practical Morality:** AU, when applied by real agents, almost always functions as a *satisficing* rather than a strict *optimizing* theory at the level of the decision procedure. We don't need to find the *global optimum*; we need to find actions that are *good enough* and *reliably promote* significant welfare increases compared to obvious alternatives.
      *   **Heuristics and Rules of Thumb:** Utilitarians argue we use generally reliable heuristics (e.g., "don't lie," "keep promises," "help those in immediate need") *precisely because* these rules have evolved or been rationally adopted as computationally feasible proxies that, *in typical situations*, tend to produce good (even if not strictly optimal) outcomes. These heuristics are justified *by* AU – they are tools to approximate the ideal in a computationally constrained world. Their failure in specific edge cases doesn't undermine AU; it highlights the need for careful judgment when heuristics conflict or seem inadequate.

  3.  **The Nature of Normative Theories and Ideals:**
      *   **Regulative Ideals:** Many ethical theories propose ideals that are difficult or impossible to perfectly achieve. Kant's Categorical Imperative requires acting only on maxims you can will to be universal law – rigorously testing every maxim is also computationally demanding and subject to interpretation. Virtue ethics requires developing complex, situationally-appropriate character traits. AU's ideal of maximizing welfare is similarly demanding. Its value lies in providing a clear *direction* and *standard* for evaluation, even if perfect attainment is impossible. Complexity doesn't make the *ideal* incoherent or meaningless; it makes its *application* challenging.
      *   **Comparative Evaluation:** Utilitarians argue that rejecting AU because of computational complexity doesn't automatically vindicate alternative theories. Deontology or virtue ethics might offer *simpler* decision procedures, but they face their own profound philosophical challenges (e.g., justifying absolute rules, defining virtues objectively, handling conflicting duties/virtues). The complexity critique doesn't show AU is *worse* than its competitors in terms of providing practical guidance; it shows *all* theories face the problem of applying abstract principles to a complex world, albeit in different ways. AU's *standard* might still be seen as the most compelling even if perfectly following it is intractable.

  4.  **Complexity Theory Nuances:**
      *   **Approximation is Often Feasible:** While *finding the exact global optimum* for NP-hard problems is intractable, finding *very good approximate solutions* (solutions close to optimal) is often feasible in practice using efficient algorithms (heuristics, approximation algorithms, machine learning). Utilitarians don't need the *absolute best* action; they need actions that produce *very good* outcomes. Computational complexity doesn't preclude this.
      *   **Problem Structure Matters:** Not every ethical decision involves navigating a combinatorially explosive space of options with infinitely complex downstream consequences. Many decisions involve a manageable set of alternatives with reasonably predictable near-term consequences. Complexity is a spectrum, not a universal barrier. AU can provide clear guidance in many common cases.
      *   **"Widely Believed, Not Proven":** The argument hinges on the P vs. NP conjecture. While widely believed, it remains unproven. A proof that P = NP (however unlikely) would dissolve the objection entirely. Basing a refutation of an ethical theory on an unproven (though plausible) mathematical conjecture is philosophically risky.

  5.  **What Complexity *Does* Challenge:**
      *   **Naive AU as a Decision Procedure:** It definitively refutes the idea that moral agents (human or artificial) can *in practice*, for complex problems, *knowingly and reliably* perform the action that is *strictly and demonstrably optimal* according to AU by calculating all consequences. This is impossible.
      *   **The Demand for Certainty:** It highlights that AU, like any consequentialist theory, operates under significant uncertainty. We must act based on *expected* utility calculations, using the best information and predictive models we have, knowing we might be wrong. Complexity underscores this epistemic limitation.

  **Why Utilitarians Persist:**

  Contemporary utilitarians treat AU as a live theory because:
  1.  **The Core Insight Remains Powerful:** The idea that we should strive to make the world better by increasing overall well-being is deeply compelling, regardless of computational hurdles.
  2.  **It Provides a Foundational Standard:** AU offers a clear, unified principle for evaluating actions, rules, institutions, and policies. Complexity doesn't negate its value as a critical tool for analysis and justification.
  3.  **It Motivates Practical Improvements:** Even if we can't find the optimum, AU drives us to seek *better* outcomes. It encourages developing better predictive models, better heuristics, and better institutions to improve welfare within our computational limits.
  4.  **Refinement, Not Rejection:** The complexity challenge has led utilitarians to develop more sophisticated versions like **Rule Utilitarianism** (follow rules whose general acceptance maximizes utility) or **Two-Level Utilitarianism** (use simple rules most of the time, resort to direct utility calculation when rules conflict or fail), which explicitly address the decision procedure problem while retaining the core consequentialist criterion.
  5.  **Lack of a Better Alternative:** For many utilitarians, the perceived flaws in alternative theories (deontology's potential rigidity, virtue ethics' potential vagueness) are seen as more fundamental than AU's practical implementation challenges.

  **In essence:** Computational complexity demonstrates that AU is an *extremely demanding ideal* that cannot be perfectly realized as a decision procedure in complex reality. However, it does not demonstrate that the *criterion of rightness* (maximizing welfare) is incoherent, inconsistent, or invalid as a normative standard. Utilitarians continue to find the core principle compelling and believe that grappling with its practical demands, using heuristics, rules, and satisficing, is a more fruitful path than abandoning the goal of maximizing well-being altogether. They see complexity as a profound *practical challenge*, not a *logical refutation*.
