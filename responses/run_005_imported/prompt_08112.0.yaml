answer: |-
  ## Memo: Recommendation on Forecasting Scoring Rule

  **To:** Forecasting Program Working Group  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Resolution on Scoring Rule: Balancing Theoretical Rigor & Practical Incentives  

  This memo addresses the disagreement regarding replacing the Brier score with the Logarithmic score for our forecasting evaluation. Both positions raise valid concerns grounded in important principles: **epistemic rigor** and **practical incentive alignment**. This recommendation aims to synthesize these concerns and propose a solution that honors both the theoretical justification for proper scoring rules *and* the need to foster honest, unhedged forecasts within our operational context.

  ### Understanding the Core Arguments

  1.  **The Case for Log Score (Epistemic Rigor & Locality):**
      *   **Strength:** The argument is theoretically compelling. Strictly proper scoring rules (like Log) are uniquely justified by accuracy-first epistemology (Joyce, Pettigrew). They incentivize forecasters to report their *true beliefs* – any deviation harms their expected score. Locality is an additional theoretical virtue: only the probability assigned to the actual outcome matters, not the distribution over alternatives.
      *   **Goal:** Maximize honest revelation of credences and achieve the most accurate aggregate probabilistic assessments possible.

  2.  **The Case Against Log Score (Practical Incentives & Robustness):**
      *   **Strength:** The unbounded nature of the Log score poses a significant practical risk. A single highly confident miss (e.g., assigning 1% to an event that occurs) results in a catastrophic penalty (-log(0.01) ≈ 4.6). This can overwhelm weeks of excellent calibration. Anecdotal evidence suggests forecasters are already hedging (moving towards 50%) on high-stakes questions to mitigate this tail risk. This hedging directly undermines the core purpose of the program – obtaining honest, differentiated probabilities. The Brier score is bounded (0-2 for binary events), making it more robust to single errors and potentially less prone to inducing this defensive forecasting behavior.
      *   **Goal:** Maintain a robust evaluation system that encourages participation, minimizes counterproductive strategic behavior (hedging), and provides stable performance metrics suitable for reviews, while still rewarding accuracy.

  ### The Crucial Tension

  The fundamental tension is **not** whether theoretical justification matters – it unquestionably does – but **how to operationalize it effectively within the specific constraints and incentives of our workplace program.** A theoretically perfect rule that demonstrably distorts forecaster behavior (hedging) fails its practical purpose. Conversely, a rule that avoids distortion but lacks a strong epistemic foundation may yield suboptimal aggregate accuracy over time.

  ### Evaluation of Options

  *   **Maintain Brier Score:**
      *   *Pros:* Bounded, robust to single errors, proven track record, likely reduces hedging incentives.
      *   *Cons:* Not local. While proper, it's not the theoretically "purest" choice. May slightly under-penalize extreme over/under-confidence compared to Log *in expectation*, though the boundedness is its practical strength.
  *   **Switch to Logarithmic Score:**
      *   *Pros:* Strictly proper, local – the theoretically optimal choice for eliciting true beliefs *if forecasters report honestly without fear*.
      *   *Cons:* Unbounded penalties create extreme tail risk. Strong evidence suggests this *induces hedging* (moving towards 50%), precisely because forecasters rationally fear the catastrophic penalty. This negates the theoretical benefit in practice. Unsuitable for high-stakes performance reviews due to volatility.
  *   **Capped Log Score:** (e.g., Min probability = 0.01 or 0.02)
      *   *Pros:* Mitigates extreme penalties, retains strict propriety and locality *within the capped range*. Reduces hedging incentive compared to pure Log.
      *   *Cons:* Introduces a discontinuity. Forecasters know probabilities below the cap are treated the same, potentially inducing strategic underconfidence near the cap ("cliff effect"). Choosing the cap is arbitrary.
  *   **Different Rules for Leaderboard vs. Reviews:** (e.g., Log for leaderboard, Brier for reviews)
      *   *Pros:* Allows theoretical showcase (leaderboard) while protecting forecasters in reviews.
      *   *Cons:* Creates confusion, mixed incentives, and administrative complexity. Forecasters will inevitably optimize for the review metric (Brier), potentially undermining the leaderboard's purpose/accuracy. Undermines program coherence.
  *   **Use a Different Bounded Proper Scoring Rule:** (Specifically, the **Quadratic Score**)

  ### Recommendation: Adopt the Quadratic (Spherical) Scoring Rule

  **I recommend we replace the Brier score with the Quadratic Scoring Rule (QSR) for both the leaderboard and performance reviews, effective next quarter.**

  *   **Definition (Binary Event):** `QSR = 1 - ( (1 - p)^2 + p^2 )` if outcome occurs, or `QSR = 1 - ( (1 - p)^2 + p^2 )` if outcome does not occur.  
      *(For multiple outcomes, it's `1 - Sum(p_i^2)` normalized appropriately).*
  *   **Key Properties:**
      1.  **Strictly Proper:** Like Log and Brier, it incentivizes honest reporting of true beliefs. This directly addresses the core epistemic argument for propriety.
      2.  **Bounded:** Scores range between 0 and 1 (for binary events: 0.5 for 50/50, 1 for perfect confidence on the correct outcome, 0 for perfect confidence on the wrong outcome). This directly addresses the practical concern about catastrophic penalties and hedging.
      3.  **Sensitivity:** Penalizes both overconfidence and underconfidence more sharply than Brier near the extremes, while avoiding Log's unboundedness. Assigning 3% to a true event gives QSR ≈ 0.06 (bad, but bounded), compared to Log ≈ -3.5 (devastating) or Brier ≈ 0.94 (also bad, but less severe).
  *   **Why QSR is the Best Compromise:**
      *   **Honors Epistemic Rigor:** It satisfies the fundamental requirement for a strictly proper scoring rule, providing a principled justification. We are not abandoning theoretical soundness.
      *   **Mitigates Hedging Incentive:** The bounded range (0-1) eliminates the existential risk of a single very wrong forecast destroying a quarter's work. Forecasters should feel safer *not* hedging towards 50% on high-stakes questions.
      *   **Maintains Differentiability:** Unlike a capped log, it smoothly differentiates probabilities across the entire [0,1] range without artificial cliffs.
      *   **Suitable for Reviews:** Bounded scores provide stable, interpretable metrics for performance evaluation. A score of 0.85 consistently means very good performance.
      *   **Addresses Locality (Partially):** While not purely local like Log, QSR depends primarily on the probability assigned to the actual outcome (`p_i`), especially as the number of outcomes increases. The influence of other probabilities (`p_j`) is through the sum of squares normalization.

  ### Implementation Plan

  1.  **Adopt QSR:** Implement the Quadratic Scoring Rule for all forecasts starting next quarter.
  2.  **Communicate Clearly:** Explain the change to all forecasters, emphasizing:
      *   The commitment to proper scoring rules (theoretical soundness).
      *   The bounded nature protects them from catastrophic single errors, *encouraging them to report true beliefs even on high-stakes questions*.
      *   How QSR differs from Brier (sharper penalty for extremes, bounded maximum penalty).
  3.  **Monitor Behavior:** Actively solicit feedback and observe if hedging behavior decreases on high-stakes questions compared to the Brier era and the feared Log scenario.
  4.  **Review:** Re-evaluate the rule's effectiveness after two quarters, focusing on forecaster behavior, score distributions, and aggregate accuracy.

  ### Conclusion

  The choice isn't between theory and practice, but about finding the rule that best *integrates* sound theory with practical human incentives within our specific program. The Logarithmic score's unbounded penalty demonstrably creates perverse incentives (hedging) that undermine its theoretical virtues. The Brier score, while robust, lacks the strongest theoretical justification and may under-incentivize precision. The Quadratic Scoring Rule offers the crucial combination of **strict propriety** (honoring the epistemic argument) and **bounded scores** (mitigating hedging and ensuring review suitability). It provides a principled foundation while fostering the honest, differentiated probability assessments our program needs to be valuable.

  **Recommendation: Adopt the Quadratic Scoring Rule.**
