prompt: |-
  I'm a philosophy PhD student working mainly in ethics, and I've recently been assigned to lead next week's metaphysics reading group on Lewis's "Humean Supervenience Debugged" -- well outside my usual territory. I follow the original Principal Principle well enough (that absent "inadmissible" evidence, one's credence in an outcome, conditional on its objective chance being x, should equal x), but I'm not getting why "undermining futures" generate a genuine contradiction for a Humean, best-system theory of chance, rather than just an odd limiting case, or why simply ruling chance-facts inadmissible isn't a perfectly good way out. I'm also unsure whether Lewis's proposed fix -- the New Principle, which conditionalizes on the whole theory of chance rather than on the outcome's chance directly -- actually resolves the difficulty or just relocates it to the chance of the theory of chance itself. Could you walk me through the intuitions clearly enough that I could present them to the group without hand-waving through the hard part, and tell me candidly whether you think the New Principle really puts what's sometimes called the "Big Bad Bug" to rest?
