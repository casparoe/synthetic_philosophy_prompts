answer: |-
  ## Beyond the Book Report: Why Expressivism Weathers the Frege-Geach Storm (Mostly)

  The Frege-Geach problem isn't just a puzzle; it feels like an existential threat to expressivism. If moral language *only* expresses non-cognitive attitudes (disapproval, commitment, planning) in simple assertions, how can it retain its *semantic content* when embedded in complex, unasserted contexts like conditionals, negations, or disjunctions? More crucially, how can arguments employing these embeddings be *logically valid*? Geach's challenge – that "lying is wrong" must mean the same thing in "Lying is wrong" and "If lying is wrong, then getting your brother to lie is wrong" – seems to demand a stable propositional content that expressivism, by its nature, denies. After weeks immersed in Blackburn's dance of higher-order attitudes, Schroeder's skeptical scalpel, Gibbard's sprawling plans, and Dreier's relocation worries, it's tempting to throw up your hands. But let's stake out a position: **While expressivist solutions to Frege-Geach are complex and sometimes unsatisfyingly technical, the strongest versions (particularly Gibbard's) successfully meet the core challenge of explaining moral inconsistency and logical validity *on expressivist terms*. The residual objections often implicitly demand expressivism to mimic realism's *semantic structure*, a demand that misunderstands the project and overlooks analogous challenges lurking for realist views. Frege-Geach is not a solved problem in the sense of being trivial, but it is a *managed* one for sophisticated expressivism.**

  **The Core Challenge & The Expressivist Imperative:**
  Expressivism begins with a powerful insight: the primary function of moral judgment isn't to describe mind-independent facts, but to express conative states (attitudes, plans, commitments). The Frege-Geach problem exploits the gap between this core commitment and the *logical behavior* of moral language. If "Lying is wrong" (asserted) expresses disapproval of lying, what does "Lying is wrong" (in the antecedent of a conditional) express? Nothing, seemingly. But then, how can the conditional "If lying is wrong, then getting your brother to lie is wrong" have a truth-evaluable content? And crucially, how can the argument:
  1.  If lying is wrong, then getting your brother to lie is wrong.
  2.  Lying is wrong.
  3.  Therefore, getting your brother to lie is wrong.
  be logically *valid*? Validity depends on the preservation of truth (or some semantic property) from premises to conclusion based on their logical form. If the antecedent lacks stable content, the whole inference seems to unravel.

  **Blackburn's Quasi-Realism: Explaining Inconsistency, Not Validating Form**
  Blackburn's pioneering solution focuses on *inconsistency*. His key move is to explain the inconsistency of accepting "Lying is wrong," "If lying is wrong, then getting your brother to lie is wrong," and "Getting your brother to lie is *not* wrong," not as a clash of *beliefs about facts*, but as a clash of *attitudes*. Holding these three commitments simultaneously reveals an incoherent state of mind. The conditional premise expresses a *higher-order attitude*: a commitment to disapproving of getting your brother to lie *if* you disapprove of lying. Denying the conclusion (approving of getting your brother to lie) while holding the first two commitments violates this higher-order attitude, creating a kind of *practical inconsistency*.

  *   **Strength:** This brilliantly explains *why* the set of commitments is inconsistent without smuggling in propositions. It captures the intuitive "clash" we feel.
  *   **Schroeder's Complaint (The Hard Problem):** Schroeder argues Blackburn solves the *easy* problem – explaining why holding certain combinations of attitudes is inconsistent – but fails to solve the *hard* problem: explaining *why the inference is logically valid based on its form*. Validity requires that *any* instance of the modus ponens form with moral components preserves truth (or the relevant semantic property). Blackburn explains inconsistency in *this specific case* involving disapproval and conditionals expressing commitments about disapproval. But does this explanation *generalize*? Does it show how the *logical structure itself*, independent of the specific attitude (disapproval), guarantees validity? Schroeder suspects expressivists conflate explaining inconsistency in particular cases with validating the logical form universally. He worries the explanation is too local, tied to the specific attitude expressed by the atomic sentences and the specific higher-order attitude expressed by the conditional, rather than flowing from the *logical operators* themselves.

  **Gibbard's Norm-Expressivism: Plans, Worlds, and Logical Structure**
  Gibbard's *Thinking How to Live* offers the most ambitious reply. He replaces simple attitudes with *plan-laden concepts*. To judge "Lying is wrong" is to plan *to* disapprove of lying (or plan *for* situations where lying doesn't occur) in a certain context of deliberation. Crucially, Gibbard constructs a formal semantics using *plan-laden possible worlds*. A world isn't just a way the world might be (descriptive), but a *hyperplan* – a maximally specific set of contingency plans for what to do and feel in every conceivable situation.

  *   **The Semantics:** The content of a normative claim is defined by the set of hyperplans that are *inconsistent* with it. "Lying is wrong" is inconsistent with hyperplans that don't plan to disapprove of lying. The conditional "If P, then Q" is inconsistent with hyperplans that are consistent with P but inconsistent with Q. Crucially, the *logical operators* (not, and, or, if-then) are defined purely in terms of these sets of inconsistent hyperplans, mirroring truth-conditional semantics but replacing truth/falsity with consistency/inconsistency relative to hyperplans.
  *   **Explaining Validity:** Validity (deductive consistency) is defined: an argument is valid if there is no hyperplan consistent with the premises but inconsistent with the conclusion. Modus ponens works because any hyperplan consistent with "If P, then Q" and "P" *must* be consistent with "Q" (by the definition of the conditional and conjunction). If it were inconsistent with Q, it would be inconsistent with the conditional premise by definition.
  *   **Strength:** This directly addresses Schroeder's "hard problem." It provides a *formal, compositional semantics* that assigns content to moral sentences *even in embedded contexts* based solely on the logical operators and the fundamental expressivist state (planning). Logical validity (deductive consistency) is defined rigorously *within the expressivist framework*, based purely on the structure of hyperplan consistency. It validates the logical *form*, not just explains inconsistency in specific cases.

  **Dreier's Relocation Worry & The Verdict**
  Dreier's challenge is profound: do solutions like Gibbard's *solve* Frege-Geach, or do they merely *relocate* the problem? He argues that defining validity as "no hyperplan consistent with premises and inconsistent with the conclusion" is just defining validity *for expressivism*. It doesn't show that expressivist validity *corresponds* to real logical validity. It seems to presuppose the very logical structure it needs to explain. Why should inconsistency relative to hyperplans *count* as logical inconsistency?

  Here's where we land the argument:

  1.  **Gibbard Solves the Core Semantic Challenge:** Gibbard *does* provide a robust, compositional semantics for embedded contexts. He assigns content to "lying is wrong" in the antecedent using the same resources (hyperplans, consistency conditions) used for asserted contexts. He explains *how* the language works systematically.
  2.  **Gibbard Validates the Logic (Expressivist-Style):** He defines a rigorous notion of validity (deductive consistency relative to hyperplans) that perfectly mirrors classical logical forms like modus ponens *within his system*. The inference *works* according to the rules of the expressivist game he has set up.
  3.  **Dreier's Point is Real, But Not Fatal:** Dreier is right that Gibbard doesn't *prove* his defined validity is "real" validity in some transcendent sense. But this demand might be misplaced. Expressivism is offering an *alternative account* of what moral thought and talk *are*. It's not trying to mimic realism's ontology; it's trying to explain the *phenomena* (including logical phenomena) using different resources. The burden is to show that the expressivist account *adequately captures* the logical practices we observe. Gibbard's model *does* this: it shows how moral discourse can exhibit all the hallmarks of logical discipline – inconsistency, valid inference – grounded entirely in planning states. It explains *why* modus ponens feels compelling in ethics, just as Blackburn did, but with a formal apparatus that generalizes to logical form.
  4.  **The Leveling Move:** Crucially, the demand for a "correspondence" proof between expressivist validity and some external standard of "real" validity arguably applies *equally* to realism. How does the realist *prove* that their truth-conditional validity (based on correspondence to moral facts) is "real" validity? They define validity based on truth-preservation, define truth for moral sentences as correspondence to facts, and assert the existence of those facts. But this is also a closed system! The expressivist has simply defined validity based on *plan-consistency*. Both views face the challenge of justifying their fundamental semantic building blocks (truth/facts vs. planning/consistency). Frege-Geach exposes a *general* challenge for any metaethical view: to explain how moral language hooks onto logic. Realism has its answer (truth-conditional semantics), expressivism has its answer (Gibbardian plan-consistency semantics). Neither answer is self-justifying in a way that trumps the other; they are competing explanations of the same linguistic phenomena. Expressivism's answer is complex, but it *is* a coherent and comprehensive answer.

  **Conclusion: Managed, Not Solved; Adequate, Not Mimetic**

  Frege-Geach remains a *deep* problem, forcing expressivists into sophisticated theoretical constructions. Blackburn's quasi-realism brilliantly handles the *phenomenology* of inconsistency but arguably falls short of validating logical form in the way Schroeder demands. **Gibbard's norm-expressivism, however, represents the strongest reply: it constructs a formal, compositional semantics that assigns stable content to embedded clauses and defines a robust, internal notion of logical validity grounded solely in the expressivist's core commitment to planning states. While Dreier is correct that this "relocates" the problem into the expressivist framework, it successfully demonstrates *how* moral discourse can exhibit logical discipline without invoking truth-conditional content or realist metaphysics. The residual sense that it hasn't *quite* captured "real" logic stems from an implicit demand for expressivism to replicate realism's semantic structure – a demand that is both unfair to the expressivist project and overlooks the fact that realism faces analogous justificatory challenges for its own foundations. Therefore, the verdict is this: Frege-Geach is not a solved problem in the sense of being simple or trivialized, but it is a *managed* problem for sophisticated expressivism. Gibbard's framework provides a sufficiently powerful and coherent explanation of moral content and logical validity within an expressivist ontology, meeting the core challenge head-on and demonstrating that expressivism can account for the full complexity of moral language. The objection proves that expressivism must be complex; it does not prove that expressivism is false.** Your paper shouldn't end with a shrug, but with the acknowledgment that expressivism earns its keep through theoretical ingenuity, successfully navigating the treacherous waters Frege and Geach charted, even if the voyage is demanding. Focus your argument on why Gibbard's apparatus, despite its complexity and Dreier's concern, constitutes a *successful* (though not necessarily the only or final) expressivist response to the core semantic and logical demands of the problem.
