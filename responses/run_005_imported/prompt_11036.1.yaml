prompt: |-
  I'm taking a seminar on formal epistemology this term, and we've just spent a week on anthropic reasoning and the Doomsday argument. I've been asked to moderate the Q&A after our colloquium speaker's talk; she defends the self-indication assumption (SIA) as the correct response to the Doomsday argument, and her stock move whenever someone raises Bostrom's Presumptuous Philosopher case is to insist it isn't a counterexample at all, just an unfamiliar-looking corollary of ordinary Bayesian conditionalization on the fact that one exists -- and that every rival view escapes that discomfort only by inviting some worse absurdity of its own. Draft eight to ten questions that don't let her rest on that move: I want at least one question that forces her to spell out, in Bayesian terms, exactly how SIA's weighting of hypotheses by their predicted number of observers is supposed to cancel the shift toward doom that the self-sampling assumption generates; one that sharpens the Presumptuous Philosopher scenario so that biting the bullet costs her something concrete before any experiment is run; one on whether SIA genuinely dissolves the reference-class problem it inherits from the self-sampling assumption or merely relocates it; and one on why the whole apparatus collapses into an improper prior once rival theories are allowed to posit infinitely many observers -- and for each, a follow-up keyed to the answer she's most likely to give. Close with a question about what could possibly count as evidence against SIA itself.
