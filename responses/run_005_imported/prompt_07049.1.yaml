prompt: |-
  Okay so this is a bit of a weird ask, but I'm stuck on a scene and don't wanna fake it with vibes. My protagonist's mom, dying, made him promise he'd never tell his little sister that the man who raised her wasn't her real dad. Mom's been gone twelve years, nobody else alive even knows there was ever a secret, and now the sister did one of those ancestry DNA kits for fun and the numbers don't add up - she's spiraling a bit, sure it's a lab error, and keeps asking him if he knows anything. He does. He still feels like keeping his word to Mom matters more than telling her, even though Mom will never know either way, and the whole reason she wanted it buried - protecting her marriage, keeping the peace - doesn't even apply anymore since both parents are gone now. Before I write him working through it, I want the real answer, not the greeting-card one: is he actually right to feel bound by that promise, and why? Geniunely different takes welcome if there are any - I wanna pick whichever one actually fits him.
