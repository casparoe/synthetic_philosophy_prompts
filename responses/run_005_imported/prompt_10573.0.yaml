answer: |-
  Based on Anscombe's core principles in *Intention* and her arguments in "Mr. Truman's Degree," it's highly probable she would condemn signature strikes as **intentional killing of innocents**, and **double effect would not cover them**. Here's why, using her actual arguments:

  1.  **The Primacy of Intention:** Anscombe's *Intention* fundamentally distinguishes between what you *intend* and what you merely *foresee*. Intention defines the moral character of the act itself. For double effect to apply:
      *   The *good effect* (killing a legitimate combatant) must be intended.
      *   The *bad effect* (killing an innocent civilian) must be *merely foreseen* but not intended.
      *   The bad effect must not be the *means* to achieve the good effect.
      *   There must be a proportionally grave reason for permitting the foreseen bad effect.

  2.  **Signature Strikes and Intention:**
      *   **Targeting Uncertainty:** The defining feature of a signature strike is that the *identity and status* of the individuals targeted are *unknown*. The strike is authorized based on patterns of behavior deemed suspicious, *not* on confirmed knowledge that the individuals are combatants actively engaged in hostilities or directly participating in imminent attacks.
      *   **Knowing Acceptance of Innocent Death:** When launching a strike where you *know* you cannot distinguish combatants from non-combatants at the point of attack, you are knowingly accepting that you *will likely kill innocents*. Crucially, you are *choosing to act* despite this fundamental uncertainty and the high probability of killing non-combatants.
      *   **Intention vs. Foresight:** Anscombe would argue that in such a scenario, the death of innocents is not merely a *foreseen side effect* of an action aimed solely at a legitimate target. **Because the legitimate target (the combatant) hasn't been identified with certainty, the act of striking *cannot* be described as *intending* to kill *only* a combatant while *foreseeing* civilian death.** The lack of discrimination means the act inherently *includes* the killing of unknowns, among whom innocents are predictably present.
      *   **The Means:** In many cases, the *method* (striking based on patterns without confirmation) *relies* on accepting a high level of "collateral damage" as the operational cost of pursuing targets efficiently but indiscriminately. This makes the death of innocents functionally part of the means employed.

  3.  **Why Double Effect Fails:**
      *   **Intention of the Bad Effect:** Anscombe would likely argue that by choosing a method that cannot discriminate at the point of attack, the actor *intends* the action that *necessarily* kills a group containing unknown, likely innocent, individuals. The uncertainty isn't an external factor; it's built into the chosen *means*. She might say the *object of the act* itself – "killing a group of unidentified military-aged males exhibiting pattern X" – is morally impermissible because the act *by its nature* cannot ensure it targets only combatants.
      *   **The Bad Effect as Means:** If the strategy relies on accepting high levels of civilian casualties as a necessary cost of operational efficiency or intelligence limitations, then those deaths become part of the *means* by which the broader goal (disrupting militant networks) is pursued. This violates double effect.
      *   **Proportionality:** Even if one argued the bad effect was only foreseen (which Anscombe would likely reject), the proportionality condition would be incredibly difficult to meet. Killing multiple unknown civilians based on suspicion and behavioral patterns, without confirmation of imminent threat or specific hostile acts from *those individuals*, would be hard to justify as proportional by Anscombe's rigorous standards. She rejected the utilitarian calculus Truman employed ("saved more lives later"), demanding a much stricter justification for *foreseeably* causing innocent deaths.

  4.  **Echoes of "Mr. Truman's Degree":**
      *   Her core charge against Truman was that he *chose* a weapon (the atomic bomb) and *chose* targets (cities full of civilians) *knowing* it would deliberately kill vast numbers of innocents to achieve a military/political end. She called this murder.
      *   Signature strikes involve *choosing* a method (striking based on patterns without confirmed identities) *knowing* it will deliberately kill unknown individuals, among whom innocents are predictably present, to achieve a military/intelligence end (disrupting networks based on suspicion).
      *   For Anscombe, the *deliberate choice of an indiscriminate method* is key. Just as bombing a city intentionally uses civilians as part of the target, striking an unidentified group intentionally accepts killing innocents as part of the act. The lack of certainty doesn't absolve responsibility; it makes the action inherently unjust.

  **Conclusion:**

  Using Anscombe's framework, **signature strikes would constitute the intentional killing of innocents.** The fundamental lack of discrimination at the point of attack, the knowing acceptance of killing unknowns (including innocents), and the reliance on methods that inherently produce this outcome mean the death of innocents is not merely foreseen but is built into the intentional structure of the act itself. Double effect would fail because the condition of intending *only* the good effect (killing a legitimate combatant) cannot be met when the target's status is unknown, and the bad effect (killing innocents) is not merely a side effect but a predictable and accepted consequence of the chosen indiscriminate method. Anscombe would likely see signature strikes as a modern, technologically enabled form of the same moral failure she condemned in Truman: deliberately killing the innocent as part of a military strategy.
