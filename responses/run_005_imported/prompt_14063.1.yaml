  **S-Tier Justification**:  
  Germany's eternity clause (Article 79(3)) earns **S-tier** because it creates an *absolute, non-negotiable barrier* against backsliding on human dignity and democratic principles while allowing constitutional interpretation to evolve with genuinely new societal challenges through judicial review.

  ---

  ### Key Rationale
  1. **S: Germany's eternity clause**  
     - Unamendable core principles force all political actors to operate within inviolable boundaries, yet permit adaptive interpretation by the Constitutional Court (e.g., applying dignity to digital rights).

  2. **A-Tier Highlights**  
     - **US Article V**: Supermajority requirements prevent rash amendments but allow change with overwhelming consensus (e.g., 27 amendments).  
     - **Independent central banks**: Institutional insulation from short-term political pressure (e.g., inflation targeting) preserves economic stability without eliminating policy tools for crises.  
     - **Presidential term limits**: Irreversible exit of leaders prevents autocratic drift (e.g., 22nd Amendment compliance), while elections enable new directions.

  3. **B-Tier Limitations**  
     - **Germany's debt brake**: Binding fiscal rules include emergency exceptions (natural disasters, pandemics), but political pressure often exploits loopholes.  
     - **Psychiatric contracts**: Clinically validated for bipolar/schizophrenia relapse prevention, yet enforceability depends on healthcare infrastructure and legal recognition.

  4. **C-Tier Weaknesses**  
     - **EU unanimity rule**: Prevents coercive treaty changes but incentivizes gridlock and extra-treaty workarounds (e.g., bypassing vetoes via selective opt-ins).

  5. **D-Tier Failure**  
     - **War Powers Resolution**: Routinely ignored by presidents (e.g., Libya 2011, Syria 2014–present) due to unenforceable timelines and vague "hostilities" definitions, failing its core constraint purpose.

  ---

  ### Key Evaluation Metrics
  - **Binding Strength**: Resistance to override during crises (e.g., term limits vs. debt brake exceptions).  
  - **Adaptive Capacity**: Mechanisms for legitimate evolution (e.g., constitutional interpretation vs. EU gridlock).  
  - **Enforcement Reliability**: Judicial/structural backing (e.g., eternity clause litigation vs. War Powers non-justiciability).  

  This framework balances *rigidity against temptation* with *flexibility for novelty*—crucial for assessing real-world precommitment efficacy.
