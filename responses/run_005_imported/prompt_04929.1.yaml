answer: |-
  You've pinpointed a profound ethical dilemma that philosophers have wrestled with for centuries: the distinction between the *obligatory* and the *supererogatory*. Here's a breakdown to help clarify your intuition and build your argument:

  1.  **The Crucial Difference: Obligatory vs. Supererogatory:**
      *   **Obligatory Actions:** These are our moral *duties* or *requirements*. Failing to do them is morally wrong (e.g., keeping promises, not harming others, meeting basic responsibilities like your school's service minimum). We owe these to others as a baseline for decent coexistence.
      *   **Supererogatory Actions:** These are "above and beyond the call of duty." They are *morally good, praiseworthy, even excellent*, but **not required**. Doing them makes you morally admirable; *not* doing them does *not* make you morally deficient or blameworthy (e.g., Priya skipping her birthday for a shelter shift, donating a kidney to a stranger, risking your life to save someone). They exceed what can reasonably be demanded of anyone.

  2.  **Priya's Actions are Supererogatory:**
      *   Tutoring, organizing drives, and covering overnight shifts significantly exceed the basic social expectations and legal/school requirements most people operate under. While incredibly valuable and good, they go far beyond what society or morality *requires* of any individual. Her sacrifice (skipping her birthday) is a clear marker of supererogation – it's praiseworthy precisely *because* it wasn't demanded.

  3.  **Why Priya's Choice Doesn't Change *Your* Moral Obligations:**
      *   **The "Ought Implies Can" Principle:** Morality generally only requires what is reasonably possible for a person. Priya's capacity for self-sacrifice might be extraordinary. Others have different capacities, life circumstances, responsibilities (family, jobs, health, mental bandwidth), and legitimate personal goals. What is possible *for her* isn't necessarily possible, or even reasonable, *for you or others*.
      *   **The Danger of the "Ratcheting Effect":** If one person's supererogatory act automatically became the new baseline obligation, morality would become impossibly demanding. Imagine if everyone *had* to skip birthdays for shelters? It would lead to burnout, resentment, and potentially neglect of other important obligations (like studies, family, or self-care). Morality needs a stable floor of obligations.
      *   **Focus on the Action, Not the Actor:** The moral status (obligatory vs. supererogatory) is primarily a property of the *type of action* and the *context*, not solely defined by the fact that *one person* chose to do it. Priya choosing to do X doesn't automatically transform X from supererogatory into obligatory for everyone else.
      *   **Different Forms of Contribution:** Morality allows for diverse ways to contribute to the good. Your required service hours fulfill a baseline obligation. Perhaps you contribute ethically in other ways – being a supportive friend, working a job to support yourself/family, pursuing studies that may lead to future contributions, caring for family, or even recharging so you *can* be present and effective in your existing obligations. These are valid and necessary parts of a moral life.

  4.  **The Source of the Guilt: Social Pressure vs. Moral Obligation:**
      *   You've hit the nail on the head: your friends are likely experiencing **social pressure**, not a fundamental shift in moral obligation. Seeing Priya's extreme commitment creates:
          *   **Comparison:** Feeling inadequate by comparison.
          *   **Admiration Transference:** Mistaking admiration *for her* as condemnation *of themselves*.
          *   **Group Norms:** The group chat comments are actively *creating* a new, demanding social norm ("slacking," "selfish") based on Priya's standard. This is peer pressure masquerading as moral insight.
      *   **The friend who quit her job:** This is a worrying sign this pressure is causing potentially harmful decisions. Quitting a job for unpaid work might not be sustainable or wise for her, driven more by guilt/competition than a genuine calling or capacity. It highlights the *danger* of conflating supererogation with obligation.

  5.  **Addressing the "But Doesn't It Say Something About Us?" Feeling:**
      *   Priya's actions *do* highlight needs in the world. They *can* inspire us to reflect: "Could *I* do a *little* more? Is there a cause *I* feel passionate about?" This is healthy.
      *   **However, the leap to "Therefore, we are failing morally" is invalid.** Inspiration is not obligation. Recognizing a greater good is possible doesn't mean failing to achieve it is blameworthy. We can admire a mountain peak without blaming ourselves for not being able to climb it.
      *   **Focus on your own baseline:** Are you meeting your actual obligations (school, family, basic decency)? Are you causing harm? If yes, you are morally in the clear regarding the *requirement*. Priya's actions exist in a different category – the category of exceptional goodness, not minimum decency.

  **Your Argument for the Group Chat (Key Points):**

  1.  **Acknowledge & Praise Priya:** "What Priya does is truly amazing and inspiring. We all deeply admire her dedication and the real good she does."
  2.  **Distinguish the Categories:** "But we need to recognize that what Priya does goes *far beyond* what anyone could reasonably be expected or required to do. It's 'above and beyond,' not the baseline."
  3.  **Explain Why Obligations Don't Shift:** "Just because one person has an extraordinary capacity for sacrifice doesn't mean the rest of us are failing morally if we don't match it. We all have different lives, capacities, and responsibilities. Morality requires us to meet our obligations and avoid harm, not to constantly match the most self-sacrificing person we know."
  4.  **Highlight the Pressure Danger:** "The comments suggesting we're 'slacking' or 'selfish' feel like pressure, not a fair moral judgment. It worries me that [Friend] quit her job – that feels like a reaction to pressure, not necessarily a sustainable or healthy choice for *her*. We shouldn't feel guilty for having different limits or priorities."
  5.  **Refocus on Respect & Individual Paths:** "Instead of guilt, maybe we can feel inspired *within our own means*. Let's respect each other's choices. Maybe some of us *can* find a small way to do a bit more volunteering that fits our lives. Others might contribute ethically in completely different ways – through their work, their studies, their care for others, or just by being dependable friends. Priya sets an amazing example of one *kind* of goodness; it doesn't invalidate other ways of living a morally decent life."
  6.  **Emphasize Sustainability & Balance:** "Burnout helps no one. Priya's level might be sustainable *for her*, but it wouldn't be for most people. Making everyone feel like they *have* to do that much is a recipe for resentment and exhaustion. Sustainable contributions, even smaller ones, are valuable."

  **In short:** Priya's actions are morally excellent but supererogatory – beyond duty. They are praiseworthy for *her*, but their existence does not create a new moral obligation *for you*. The guilt your friends feel stems from social comparison and pressure, not from a genuine shift in moral requirements. Acknowledge the inspiration, reject the guilt, defend the validity of your own balanced life and contributions, and encourage the group to respect individual paths rather than imposing a single, extreme standard.
