prompt: |-
  I maintain a smallish open-source library for free on nights and weekends, and I've noticed a pattern: the more heroic unpaid stuff I do (late-night hotfix for a security bug, writing actual docs, whatever), the more entitled some users get when I'm slow on some random feature request, like the free labor was owed to them all along. Someone in a GitHub thread called this a 'supererogation' problem -- acts that are good to do but not obligatory -- and now I can't stop thinking about it. Can you walk me through the most important implications of the supererogation literature for this exact dynamic -- whether doing the 'extra' thing repeatedly changes if its still optional, whether the entitled-user reaction is a coherent complaint or just a category error, and whether theres a principled way to keep being generous without it quietly turning into a duty? Skip the dictionary definition, I want the parts of the debate that actually have teeth here.
reasoning: |-
  Okay, the user maintains an open-source library in their free time and has noticed that going above and beyond leads to some users feeling entitled. They mention the term "supererogation" from a GitHub thread and want to understand its implications. Let me unpack their query.

  First, they’re dealing with a common issue in volunteer work: their extra efforts seem to create expectations. They want to know if repeated supererogation turns into obligation, whether users' entitlement is valid, and how to stay generous without it becoming a duty. Their deeper needs likely include maintaining their motivation and boundaries while continuing to contribute without resentment.

  I recall that supererogation involves actions beyond duty. Philosophers like Urmson and Heyd discuss how such acts are praiseworthy but not required. But the key here is repetition. If you keep doing extras, does it become expected? Think about the "moral encroachment" idea—repeated acts can shift perceptions. Users start seeing the extra as the norm. That's a psychological effect, not a moral one. The user needs to know that the shift is in perception, not obligation.

  Next, the entitled reaction. Users might conflate supererogation with duty. That's a category error. The maintainer doesn't owe them beyond the project's scope. But explaining that won't always help. The user needs strategies to manage expectations without burning out. 

  Also, the maintainer's autonomy. Supererogation should be voluntary, but when users demand, it feels coercive. That undermines the act's goodness. The user needs to protect their autonomy to keep the work sustainable.

  For practical steps, clear communication is crucial. Setting boundaries in docs or READMEs about what's guaranteed versus extra. Using labels like "best effort" for features. Documenting contributions helps too—showing others can help reduces pressure. And recognizing that some users' entitlement isn't valid; it's okay to ignore unreasonable demands.

  The user's identity as a volunteer is key. They need affirmation that their contributions are gifts, not obligations. Reinforcing that through communication and community support can help. Also, delegating tasks to share the load might prevent the sole-maintainer burden.

  In summary, the philosophical debate validates the maintainer's stance: supererogation doesn't create duties. The challenge is managing perceptions and setting clear boundaries to sustain generosity without it becoming an obligation.
answer: |-
  This cuts to the heart of the volunteer-maintainer burnout paradox. The supererogation debate offers sharp, relevant tools to dissect your situation – here's the distilled essence with teeth:

  1.  **The Repetition Trap & Shifting Baselines:**
      *   **The Core Tension:** Philosophers like J.O. Urmson and David Heyd emphasize that supererogation relies on the act being *beyond* duty. The critical question for you is: **Does *repeatedly* performing a supererogatory act transform it into a *new duty*?**
      *   **The "Moral Creep" Argument:** Some argue (e.g., Gregory Mellema) that consistent performance of an extra act can create legitimate expectations in beneficiaries, potentially raising the baseline of what's considered "normal" or "expected" effort. This isn't a *logical* transformation of duty, but a *psychological/social* one. Your users experience this as entitlement.
      *   **The "Volitional Core" Defense:** The dominant counter-argument (Heyd, Susan Wolf) is that the *essential nature* of supererogation lies in its **voluntariness and optionality**, *regardless of frequency*. Doing something generous 100 times doesn't make the *101st* time obligatory. The baseline shift is a *misperception* by users, not a moral truth. **Your key takeaway:** Your past generosity does *not* create a moral debt requiring future generosity. The shift is in *their expectations*, not your obligations.

  2.  **Entitlement: Category Error vs. Coherent (but Mistaken) Complaint:**
      *   **The Category Error:** Entitlement arises from a fundamental misclassification. Users confuse:
          *   **Supererogation (Praiseworthy Extra):** Security hotfixes, extensive docs, rapid responses.
          *   **Beneficence (General Moral Goodwill):** The desire to help others where possible.
          *   **Strict Duty/Obligation:** What is owed based on explicit contract, role, or core promise.
      *   **Why it's an Error:** Open-source maintenance, *especially* volunteer, involves core duties arguably limited to: a) Licensing compliance, b) Basic project viability (maybe), c) *Minimal* responsiveness to critical issues (debatable). Everything else is supererogatory. Demanding supererogation negates its essence.
      *   **The (Flawed) Coherence:** The *only* semi-coherent argument for entitlement relies on the "Moral Creep" idea *or* a misinterpretation of your motivations. If users perceive your *past* supererogation as evidence of an *implicit promise* to *always* perform at that level, they feel "owed" consistency. **The Refutation:** Your motivation (passion, generosity) doesn't imply a promise. Consistency in *voluntary* acts doesn't create an obligation. Their complaint mistakes correlation (you did X before) for contract (you must do X again).

  3.  **Principled Generosity Without Slippery Slopes:**
      *   **The Autonomy Imperative (Heyd):** The *goodness* of supererogation hinges on it being freely chosen. **The moment it feels coerced or expected, its supererogatory nature (and much of its moral worth *to you*) vanishes.** Protecting your autonomy isn't selfish; it's necessary to *sustain* generosity.
      *   **Boundary Defense Tactics:**
          *   **Explicit, Public Demarcation:** State *clearly* in your README/CONTRIBUTING: "Critical security fixes are prioritized. All other work, including feature requests, documentation improvements, and non-critical bug fixes, is done on a volunteer basis as time and interest permit. Past efforts do not constitute a commitment to future timelines or feature delivery." **This resets the baseline.**
          *   **Label the Extras:** When you *do* go above and beyond, subtly label it: "Pushing this hotfix late tonight because it's critical, but please note this level of response isn't guaranteed for non-critical issues." This reinforces the supererogatory nature.
          *   **Manage Channels:** Use issue templates that force categorization (Bug/Feature/Question). Close non-critical feature requests that lack community support or a PR immediately with a polite template pointing to your contribution guidelines. **Reduce the surface area for entitlement.**
          *   **Celebrate Community Contribution:** Redirect demand by *enthusiastically* highlighting and merging quality PRs. "This fantastic feature was added by @user! Big thanks to them!" This reinforces that *they* can be supererogatory too.
          *   **Embrace "No" as a Principled Tool:** A polite, unapologetic "No, that doesn't fit my current priorities" or "I won't have time for this" is essential. It defends the optionality of future supererogation. Explanations are optional; justification implies an obligation to convince them.
      *   **Reframe Your Own Mindset:** View your supererogatory acts as **gifts**, freely given each time. A gift given yesterday doesn't obligate a gift today. Detach your self-worth from fulfilling every request. Your value is the project's existence and core stability, not its feature list.

  **The Sharpest Conclusions for You:**

  *   **Their Entitlement is a Category Error:** They fundamentally misunderstand the moral landscape of volunteer OSS. Your past heroics are *evidence of past generosity*, not a promissory note.
  *   **Repetition Doesn't Create Duty:** You are morally free to stop doing extras at any time. The "baseline shift" is their psychological problem, not your ethical failing.
  *   **Principled Generosity Requires Boundaries:** To keep giving *freely* (and avoid burnout/resentment), you *must* actively defend the optionality of your effort. Clear communication, managing expectations, and saying "no" are ethical imperatives for sustainable supererogation.
  *   **Autonomy is Non-Negotiable:** Protecting your freedom to choose *when* and *how* you go beyond is what keeps the act supererogatory and meaningful *for you*. Sacrificing autonomy turns generosity into servitude.

  The literature ultimately sides with *you*. Supererogation's power and goodness reside precisely in its freedom from obligation. Guard that freedom fiercely; it's the only way your generosity remains sustainable and truly virtuous. Your users' frustration is understandable *psychologically*, but it's built on a *philosophical* mistake about the nature of voluntary giving. Don't let their category error become your cage.
