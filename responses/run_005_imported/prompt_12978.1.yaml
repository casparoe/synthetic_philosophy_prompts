prompt: |-
  Had a whole argument with my friend Dana last night about Boorse's biostatistical theory of disease and I don't think I landed the point I was going for. Her line was that once you bring in the reference classes (age, sex, species), the "statistically subnormal function" stuff becomes a plain empirical fact with no values sneaking in anywhere, and that it's not arbitrary because clinicians already carve populations up that way, not some philosopher's made-up sorting -- which is basically her whole reason for thinking normativists don't have anything left to complain about. I tried to hit her with the osteoporosis case: doctors diagnose osteoporosis in old people by comparing their bone density to YOUNG adults, not to an age-matched reference class, even though low bone density is statistically typical for the elderly -- so which reference class counts as "the" relevant one seems to depend on whether we already think the result is a disease, not the other way round, which is what Boorse's theory actually needs. Dana said that's just doctors being sloppy, using a risk measure instead of a real disease definition, and that Boorse's theory properly applied would use the age-matched class and just call it aging, not disease. Didnt have a good comeback in the moment. Can you build the argument properly for me: the strongest version of the case that the reference-class problem shows Boorse's theory can't actually be the value-free naturalist account it's supposed to be, and deal with Dana's "sloppy doctors, risk-not-disease" escape hatch head-on instead of just brushing past it.
