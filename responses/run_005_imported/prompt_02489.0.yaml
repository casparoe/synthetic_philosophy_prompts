  The creator angle does challenge Walton more fundamentally. If quasi-emotions require rules of a game, who sets those rules when you're writing spontaneously? The simultaneity of creation and reaction feels more like Carroll's "thought causing affect" model. Still, Walton might counter that writers engage in self-directed pretense - but that feels less convincing for this raw, unplanned moment.

