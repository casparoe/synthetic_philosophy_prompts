    ],
    "B": [],
    "C": [
      "Simply relying on a strictly weaker, \"good enough\" meta-theory as a one-off pragmatic patch"
    ],
    "D": [
      "Paraconsistent or relevant logics that block explosion"
    ]
  }
  ```

  ### Rationale:
  - **S-tier**: Probabilistic reflection and logical induction replace binary provability with probabilistic or inductive reasoning, enabling consistent self-trust without Löbian collapse. They represent genuine breakthroughs by sidestepping the need for unrestricted reflection via quantitative uncertainty.  
  - **A-tier**: Infinite hierarchies avoid self-reference through meta-system layering (a standard logical workaround), while decision-theoretic reframing bypasses proof-based trust entirely. Both are principled but "externalize" the obstacle—hierarchies require infinite regress, and decision theory depends on policy-level abstractions that may not capture all safety nuances.  
  - **C-tier**: Weaker meta-theories pragmatically avoid the obstacle but sacrifice expressive power, leaving the tension unresolved for advanced systems. It’s a stopgap, not a solution.  
  - **D-tier**: Paraconsistent logics tolerate inconsistency but fail to enable reliable self-trust. They risk the system "proving" both safety and danger, exacerbating the problem.  

  B-tier is intentionally empty, as no approach fits a "moderate progress" category that exceeds partial workarounds without reaching principled resolution.
