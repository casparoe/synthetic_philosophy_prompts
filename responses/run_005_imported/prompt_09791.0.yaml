answer: |-
  You've hit on a fascinating and crucial distinction! While both Bentham and Mill defend the toleration of private, consensual "immoral" acts, their arguments rest on **fundamentally different philosophical foundations within the utilitarian framework.** Bentham's reasoning is **distinctly and purely utilitarian**, driven relentlessly by the hedonic calculus, while Mill's Harm Principle introduces a **significant deontological constraint** onto utility, prioritizing individual liberty as a *principle* rather than just a calculable outcome. Here's the breakdown:

  **Bentham's Argument (in "Offences Against One's Self"):**

  1.  **Core Driver: Rejection of "Antipathy" as Grounds for Punishment:** This is the linchpin. Bentham argues that disgust, prejudice, religious dogma, or moral revulsion ("antipathy") are *irrational* and *illegitimate* bases for law. Law must serve utility.
  2.  **Hedonic Calculus Applied Rigorously:**
      *   **No Primary Harm:** Consensual acts cause no direct, tangible harm to participants or unwilling others (no pain, loss of security, property, etc.).
      *   **Alleged "Secondary Harms" Dismantled:** Bentham systematically dissects common objections:
          *   *"Alarm" or "Corruption":* Argues this alarm is irrational prejudice based on antipathy. If the act is private, unknown, and causes no *actual* harm, the "alarm" is unfounded and shouldn't count. The *fear* stems from the *criminalization* itself, not the act.
          *   *"Expense" (e.g., population decline):* Dismisses this as empirically unfounded or negligible compared to the massive costs of enforcement.
          *   *"Weakening Marriage":* Sees no necessary link; might even strengthen it by providing an outlet.
      *   **Costs of Punishment Outweigh Any Alleged Benefit:** Enforcing laws against private consensual acts creates massive *real* harms: misery for those punished (execution, imprisonment, shame), creation of blackmail opportunities, waste of resources, perjury, and the infliction of pain based purely on prejudice. This *net pain* vastly outweighs any speculative, imaginary, or antipathy-based "harms."
  3.  **Conclusion (Purely Utilitarian):** Criminalization produces a massive *net increase in pain* (suffering of the punished, costs of enforcement, blackmail) for *no demonstrable net gain in pleasure/prevention of pain* (since the alleged harms are imaginary, speculative, or based on illegitimate antipathy). Therefore, it is *irrational* and *contrary to utility* to punish such acts.

  **Mill's Harm Principle (On Liberty):**

  1.  **Core Driver: Individual Sovereignty & Liberty as an *Intrinsic Good*:** Mill elevates individual liberty (thought, expression, lifestyle) to a near-absolute principle *within a specific sphere*. The Harm Principle acts as a boundary: **"the only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others."**
  2.  **Harm Defined Narrowly:** Mill means *tangible, material harm* to the interests of others – physical injury, theft, fraud, breach of contract, failure of duty, etc. Mere offense, disgust, moral disapproval, or perceived "corruption" do *not* constitute harm justifying interference.
  3.  **Utility as the Ultimate Foundation (But With a Twist):** Mill grounds the Harm Principle *ultimately* in utility – a society of free individuals is argued to be the most conducive to human flourishing, progress, and happiness in the long run. However, the *application* of the principle is **not based on a case-by-case hedonic calculus**.
  4.  **The Deontological Constraint:** This is the key difference. Mill imposes a *rule* or *side-constraint* on the pursuit of utility: *Even if* suppressing a self-regarding act *might* arguably increase net happiness in a specific instance (e.g., preventing someone from making a "foolish" choice), society is **not permitted** to interfere unless harm to others occurs. Liberty is protected *as a principle*, not just when the calculus favors it. The burden of proof is shifted: it's not "show net utility in allowing this," but "show the harm to others to justify forbidding it."
  5.  **Conclusion (Liberty-Constrained Utilitarianism):** Consensual private acts fall squarely within the self-regarding sphere. Society has no right to interfere based on morality, disgust, religion, or paternalism. Interference is only justified to prevent *harm to others*.

  **Comparison & Why Bentham's is Distinctly Utilitarian:**

  *   **Bentham: Pure Consequentialism/Hedonism:** His argument is *entirely* a cost-benefit analysis using the hedonic calculus. He shows the *costs* (pain) of criminalization vastly exceed the *benefits* (pleasure/avoided pain), which are based on irrational antipathy. **The calculus itself does the work.** If the calculus somehow showed net utility in banning consensual acts (e.g., if widespread panic *caused* real, measurable social collapse), Bentham would logically support the ban. His toleration is a *contingent outcome* of the calculation.
  *   **Mill: Principle-Led Constraint:** Mill starts with a *right* to liberty in self-regarding matters. The Harm Principle acts as a firewall against social tyranny, even if a majority (or utilitarian calculator) *thinks* interference might increase happiness. Toleration is a *protected sphere*, not just a calculative result. **Utility justifies the *principle*, not necessarily every specific outcome within it.** Mill tolerates the acts because they are *self-regarding*, not (primarily) because a calculation shows net utility in *this instance*.
  *   **Collapsing into Harm Principle?** Superficially, yes, both conclude "no harm to others, no grounds for interference." But the *reasoning* is fundamentally different:
      *   Bentham *arrives* at "no harm" by *disproving* alleged harms via calculus and dismissing antipathy.
      *   Mill *starts* with "no harm to others" as the *only* justification for interference, defining harm narrowly and excluding antipathy-based objections by definition. Liberty is the default.
  *   **Distinctly Utilitarian in Bentham:** Bentham's rejection of antipathy and his relentless focus on *measurable* pleasure/pain outcomes is the purest expression of utilitarian jurisprudence. He applies the calculus directly to the legal question of punishment. Mill uses utility to justify a *meta-principle* (liberty) which then governs specific cases, insulating many acts from direct utilitarian scrutiny. Bentham subjects *every* act/policy to direct scrutiny.

  **In short:** Bentham's argument is **utilitarianism in action** – the hedonic calculus directly proves criminalization is irrational and counter-productive. Mill's Harm Principle is **utilitarianism justifying a protective rule** – liberty is deemed so essential to long-term utility that it creates a zone *immune* to direct utilitarian calculation (and societal antipathy). Bentham reaches his conclusion *through* the calculus; Mill uses utility to justify a principle that *then* yields the conclusion. Your footnote can powerfully highlight this core difference in how utility operates within their philosophies of liberty. Bentham's radicalism lies in applying pure utility to dismantle prejudice *decades* before Mill erected his liberty principle.
