    Solves the self-reference paradox. For two FairBots, it guarantees:  
    > *"If it's provable that cooperation implies cooperation, then cooperation is provable."*  
    This forces mutual cooperation to be a fixed point in the logic.

  **How Proof Search Avoids Infinite Regress:**  
  1. Proofs are finite strings in a formal system (no runtime execution).  
  2. When FairBot checks `proof_exists(statement)`, it's statically analyzing logical relationships, not dynamically evaluating code.  
  3. The proof for mutual cooperation between two FairBots leverages symmetry:  
