  **Failure Mode:**  
  When two `NaiveBot`s face each other:
  1. `NaiveBot1` starts simulating `NaiveBot2`  
  2. Inside the simulation, `NaiveBot2` starts simulating `NaiveBot1`  
  3. This creates infinite recursion:  
     `Bot1 → simulates Bot2 → simulates Bot1 → simulates Bot2 → ...`  
     (Never terminates because neither completes their simulation first)

  **Core Problem:**  
  Direct simulation requires resolving mutual dependencies, but neither bot can "go first" without the other's output.

