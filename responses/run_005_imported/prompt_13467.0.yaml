  Why? Schaffer and Sartorio provide principled reasons to include the lifeguard/Jones and exclude the Queen. McGrath does too, but it relies on norms that might be more fluid. Hall has a framework that can accommodate but without a built-in relevance filter, it might not automatically solve the overcounting. Lewis, without modification, overcounts. Dowe and Beebee undercount by denying the lifeguard is a cause.

  But wait: Sartorio ties causation to moral responsibility, which might be seen as mixing metaphysics and normativity. Some might object. However, for the puzzle, it works. Schaffer's contrastive account is more purely metaphysical.

