answer: |-
  You've nailed the core frustration: the bank case *is* a Rorschach test theorists project onto, and the "stakes matter" slogan obscures the real fracture line. Let's cut through the noise.

  **The Core Structural Divergence: Location of Sensitivity**

  1.  **Contextualism (DeRose, Lewis, Cohen):** Sensitivity is **semantic/metalinguistic**. The word "knows" is *indexical* or *context-sensitive*; its *semantic content* (the standard it picks out) shifts with the **attributor's** conversational context (goals, stakes, presuppositions). Truth conditions for "S knows that p" change depending on *who is saying it* and *why*.
  2.  **Pragmatic Encroachment / Subject-Sensitive Invariantism (SSI - Hawthorne, Stanley; Fanti & McGrath):** Sensitivity is **metaphysical/epistemic**. What constitutes *knowledge itself* (the epistemic standing S must have) depends on the **subject's** practical situation (stakes, needs, potential actions). The *semantic content* of "knows" is fixed (invariant), but whether S meets that fixed standard depends on *S's* stakes.

  **The Crucial Test: Attributor-Subject Stakes Conflict**

  *   **Case 1 (Low Attributor / High Subject):** Bored Gossip Gertrude (stakes near zero) says about her friend High-Stakes Harry (about to bet his house on P): "Harry knows the bank is open tomorrow (P)." Harry's life savings depend on P.
  *   **Case 2 (High Attributor / Low Subject):** Panicked Parent Patricia (stakes: needs cash NOW for child's medicine) says about Oblivious Office Worker Owen (stakes near zero, just casually mentioned P): "Owen knows the bank is open (P)." Owen doesn't care either way.

  **Predictions & Commitments:**

  1.  **Contextualism:**
      *   **Case 1 (Gertrude about Harry):** Gertrude's context is low-stakes. The semantic standard for "knows" in *her* mouth is low. If Harry has good evidence (e.g., regular hours, website), Gertrude's utterance "Harry knows P" is **TRUE** *relative to her context*. Harry's high stakes are irrelevant to the *truth conditions of Gertrude's statement*; they only matter to whether *Harry* should act (a separate issue, per contextualism).
      *   **Case 2 (Patricia about Owen):** Patricia's context is high-stakes. The semantic standard for "knows" in *her* mouth is very high. Even if Owen has decent evidence, it likely won't meet Patricia's stringent standard (e.g., maybe he needs to have personally verified with the manager today). Patricia's utterance "Owen knows P" is likely **FALSE** *relative to her context*. Owen's low stakes are irrelevant to Patricia's contextually high standards.
      *   **The "Smuggling" Charge:** Can contextualism avoid smuggling in subject stakes? *Pure* contextualism insists the attributor's context alone sets the standard. However, *what factors shape the attributor's context?* DeRose/Lewis allow "speaker intentions" and "conversational purposes." If Gertrude *knows* Harry's stakes are high and is *discussing his action*, she *might* (though not necessarily) raise her own standards subconsciously, making "knows" false. This is the **achilles heel**: if attributors *systematically* adjust their standards based on the *subject's* practical situation when discussing that subject's knowledge/action, it blurs the line. Contextualism *can* technically insist Gertrude's low-stakes context keeps "knows" true, but this risks making "knowledge" attributions seem practically irrelevant or semantically blind to the subject's reality.

  2.  **Pragmatic Encroachment (SSI/Fanti-McGrath):**
      *   **Case 1 (Gertrude about Harry):** Whether Harry *knows* P depends *solely* on *Harry's* epistemic position *relative to his practical situation*. His sky-high stakes mean he needs *extremely* strong evidence to know P (e.g., perhaps confirmation from the manager is required). Gertrude's utterance "Harry knows P" aims to describe Harry's invariant epistemic state. Given Harry's stakes, he *lacks* knowledge. Therefore, Gertrude's statement is **FALSE**, regardless of her low stakes. Her low standards don't change the fact Harry doesn't meet the knowledge bar *for his situation*.
      *   **Case 2 (Patricia about Owen):** Whether Owen *knows* P depends *solely* on *Owen's* epistemic position *relative to his practical situation*. His stakes are negligible. If he has decent evidence (e.g., saw the hours posted, went last week), he *may well know* P. Patricia's utterance "Owen knows P" aims to describe Owen's invariant epistemic state. If Owen meets the (low) standard required by *his* stakes, Patricia's statement is **TRUE**, *even though her own stakes are high*. Her high standards don't change the fact Owen *does* meet the knowledge bar *for his situation*.
      *   **The "Ugly Result" Dodge:** SSI cleanly handles the conflict. The subject's stakes directly determine the epistemic standard *they* must meet. The attributor's stakes only matter for what *they care about*, not for the truth about the *subject's* knowledge state. Gertrude is *wrong* to say Harry knows; Patricia is *right* to say Owen knows, even if she wouldn't *act* on Owen's knowledge herself.

  **The Verdict: Divergence Case Winner & Lingering Costs**

  *   **Divergence Case Winner:** **Pragmatic Encroachment (SSI) comes out significantly less ad hoc.** Its predictions align directly with strong intuitions:
      *   Gertrude *shouldn't* blithely say "Harry knows" when Harry is about to bet his house on flimsy evidence. SSI says she's wrong. Contextualism struggles to explain why this feels wrong without appealing to subject stakes.
      *   Patricia *can* correctly say "Owen knows" even in her panic, *if* Owen has adequate evidence *for his low-stakes situation*. SSI gets this right. Contextualism wrongly makes Patricia's statement false, potentially over-intellectualizing her panic's effect on semantics.
      *   SSI cleanly separates the *truth* of a knowledge attribution from the *practical rationality* of an action based on it. Gertrude saying "Harry knows" is false *and* it would be irrational for Harry to act. Patricia saying "Owen knows" is true *even if* it would be irrational for *her* to act on it (she needs higher certainty).

  *   **Lingering Costs:**
      *   **Contextualism's Semantic Blindness:** This remains a major cost. Ordinary speakers show little awareness that "knows" shifts meaning mid-conversation based on their stakes. Explaining disagreement ("But you *said* you knew!") becomes complex. The "smuggling" suspicion in the divergence case exacerbates this – if attributors *do* track subject stakes, why posit a convoluted semantic mechanism?
      *   **Pragmatic Encroachment's Metaphysical Queerness:** The cost is real. Does the *truth* about the external world (does S have a true, justified belief?) really depend on how much S *cares*? It makes knowledge oddly "shifty" and agent-relative in a way that feels uncomfortable for a factive state. While proponents argue it reflects how justification *for action* works, the intuition that "knowledge = mind-world relation" is violated.

  **Translation into Credences & Action Licensing (The Nuclear Option)**

  Can we ditch "knows" entirely? Yes, and the disagreement *transforms* but doesn't vanish:

  1.  **The Core Dispute Becomes:** What *threshold* of credence (Cr(p)) is required to *licence acting as if p*?
      *   **Contextualism (Credence Translation):** The *word* "licence" (or "rational to act") is context-sensitive. In a low-stakes context, Cr(p) = 0.9 might suffice to say "S is licensed to act." In a high-stakes context, "licence" requires Cr(p) = 0.99.
      *   **Pragmatic Encroachment (Credence Translation):** The threshold T for when acting on p is rational *depends objectively on the agent's utilities/stakes*. T is a function of potential gains/losses. For Low-Stakes Owen, T might be 0.8. For High-Stakes Harry, T is 0.98. The *truth* of "S is licensed to act" depends *only* on S's credence relative to *their* T.

  2.  **Survival of Disagreement:** The structural disagreement **survives** in a purified form:
      *   Is the *meaning* of "it is rational for S to act on p" sensitive to the *speaker's* context (Contextualism), or is its truth determined solely by *S's* credence and *S's* practical situation (Encroachment)?
      *   The divergence cases play out identically:
          *   *Gertrude about Harry:* Gertrude (low stakes) says "It's rational for Harry to bet his house on p (if Cr(p)=0.92)." Contextualism: True (her low threshold). Encroachment: False (Harry's high stakes demand Cr(p)>0.95).
          *   *Patricia about Owen:* Patricia (high stakes) says "It's rational for Owen to act casually on p (if Cr(p)=0.85, Owen's T=0.8)." Contextualism: False (her high threshold). Encroachment: True (Owen meets *his* threshold).

  3.  **Parasitic on Vocabulary?** Not parasitic, but revealing. Translating exposes the core: **The debate is fundamentally about whether practical factors affect the *semantics of normative epistemic/action terms* (Contextualism) or the *metaphysical norms governing rational action/justification* themselves (Encroachment).** Ditching "knows" clarifies but doesn't dissolve this meta-normative dispute. It suggests the real argument is about the nature of epistemic norms and their relationship to practical reason. Both sides agree stakes affect *rational action*; they fight over *where that sensitivity enters our theoretical description* (language vs. world/norms).

  **Conclusion:** In the crucial divergence cases, Pragmatic Encroachment (SSI) provides a more intuitive, less ad-hoc account by directly tying the knowledge standard to the subject's practical reality. Contextualism's semantic blindness and its awkward handling of the low-attributor/high-subject case (Gertrude's potentially true but reckless attribution) are significant liabilities. While Encroachment faces the metaphysical cost of "stakes-dependent truths," its ability to cleanly handle the core intuition that *what it takes for Harry to know he shouldn't bet his house is different from what it takes for Owen to know he can grab coffee* gives it the edge in this specific battleground. Translating to credences confirms the deep disagreement is about the location of normative sensitivity, not dependent on the word "knows."
