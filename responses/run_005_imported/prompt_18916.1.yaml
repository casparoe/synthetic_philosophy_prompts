answer: |-
  Here's a rigorous argument against teleosemantics' ability to fix determinate content for innate detectors, using the frog's fly-snapping reflex, focusing precisely on the underdetermination by selection history you requested – avoiding both Swampman and standard misrepresentation replies:

  **Core Argument: Selection History Suffers from Causal Coextension, Rendering Content Arbitrary**

  1.  **The Target Mechanism:** The frog's innate visual detection mechanism triggers a snap response.
  2.  **The Indeterminacy:** What is the *determinate* content of this mechanism's state? Is it `FLY` or `SMALL-DARK-MOVING-THING` (SDMT)? Both seem plausible candidates.
  3.  **Teleosemantics' Proposed Fix:** The content is fixed by the mechanism's *evolutionarily selected proper function*. Specifically, what state of affairs in the environment was *historically responsible* for the selection and maintenance of this mechanism due to its fitness consequences? (Millikan's "Normal Explanation").
  4.  **The Problem - Causal Coextension in the EEA (Environment of Evolutionary Adaptedness):** During the period when the frog's snapping mechanism was under selection pressure:
      *   **Property Correlation:** `FLY` and `SDMT` were *causally coextensive* in the relevant environmental context. Flies *were* the paradigmatic (and likely overwhelmingly common) small, dark, moving things in the frog's ancestral environment that provided nutritional value when snapped at. Conversely, genuinely nutritious small, dark, moving things were almost certainly flies (or very similar insects).
      *   **Fitness Payoff Correlation:** The fitness payoff (nutrition leading to survival/reproduction) was *simultaneously caused* by snapping at both:
          *   `FLY` (because flies are nutritious).
          *   `SDMT` (because snapping at SDMT reliably captured flies, the source of nutrition).
      *   **Selection Mechanism Indifference:** Natural selection operates on the *actual causal chain* leading to fitness outcomes. It "sees" that mechanisms causing snaps at `SDMT` led to consumption of `FLY`, which led to increased fitness. It does *not* inherently distinguish which link in this chain (`SDMT` or `FLY`) is the "content-bearer." Selection simply favors mechanisms that reliably produce the fitness-enhancing *behavior* (snapping) in response to stimuli that *in fact* correlate with nutrition.
  5.  **The Underdetermination:** Therefore, the historical selection pressure *equally supports* two distinct functional descriptions:
      *   **Description 1 (Distal):** The mechanism's proper function is to *detect flies* (`FLY`). Its snapping when presented with SDMT is a reliable means to achieve this, exploiting the correlation.
      *   **Description 2 (Proximal):** The mechanism's proper function is to *detect small, dark, moving things* (`SDMT`). Its function is fulfilled whenever it detects SDMT, *because* in the EEA, this detection reliably led to capturing flies and gaining fitness. Snapping at a BB pellet is *not* malfunction under this description; it's functioning perfectly well according to its proximal detection function.
  6.  **The Arbitrariness:** Teleosemantics provides *no non-arbitrary principle* within its own framework (appealing solely to selection history) to decide between Description 1 (`FLY`) and Description 2 (`SDMT`) as the *determinate* content. Both descriptions:
      *   Accurately describe the historical causal chain responsible for selection.
      *   Explain why the mechanism was maintained (it produced snaps leading to nutrition via that chain).
      *   Are consistent with the mechanism's structure (it responds to SDMT).
      *   Account for "successful" operation in the EEA (snapping at flies).
  7.  **Reintroduction of the Disjunction Problem:** This is not merely a case of *misrepresentation* (where the mechanism fails its function). This is a case where the *very function itself* is ambiguous. Selection history does *not* isolate a single, determinate content (`FLY`). Instead, it isolates a *disjunction* of coextensive properties (`FLY` OR `SDMT` OR `NUTRITIOUS-SMALL-PREY` OR `OBJECT-TRIGGERING-SNAP-RESPONSE-LEADING-TO-NUTRITION`...) that were inseparable in the causal history. Picking `FLY` as the "real" content over `SDMT` is arbitrary because selection pressure was applied equally to the entire coextensive cluster. Teleosemantics *presupposes* we can isolate the "relevant" historical cause for the purpose of assigning content, but this case shows that very isolation is often impossible for innate detectors due to causal coextension in the EEA. The disjunction problem reappears *within the specification of the selected function itself*.

  **Why the Standard Replies Fail Here:**

  *   **"But Flies are the Benefit-Conferrer!":** True, but selection acts on the *mechanism's output* (snapping behavior) triggered by *inputs* (`SDMT`) that *caused* the benefit. The mechanism didn't "know" flies were the benefit; it was selected *because* responding to `SDMT` caused snaps that got flies. `SDMT` is just as much a *causal antecedent* of the fitness payoff in the historical chain. Picking the distal cause (fly) over the proximal cause (SDMT) is arbitrary from selection's perspective.
  *   **"The Mechanism Was Selected *For* Detecting Flies":** This assertion simply *assumes* the distal description (`FLY`) is the correct level of analysis. It doesn't *argue* for it based solely on selection history. One could equally validly say the mechanism was selected *for* detecting `SDMT` *as a means* to getting flies. Selection history underdetermines which description captures "the" function.
  *   **Appeal to Mechanism Structure:** While the mechanism is demonstrably sensitive to `SDMT`, this doesn't fix content. Teleosemantics needs the *evolutionary function* to add the semantic layer. The point is that the evolutionary function, derived from history, is ambiguous between `FLY` (what it *indirectly* gets) and `SDMT` (what it *directly* responds to and what was the reliable trigger for fitness).

  **Conclusion for Your Paper:**

  The frog's snap reflex demonstrates that even for simple *innate* detectors, teleosemantics fails to provide a determinate naturalistic grounding for mental content. The core problem is **causal coextension in the evolutionary history**. When the properties supposedly fixing content (like `FLY` and `SDMT`) were inseparable correlates within the causal chain responsible for the mechanism's selection, teleosemantics lacks the resources to non-arbitrarily select *one* property as the determinate content over the other. Selection history, rather than solving the disjunction problem, merely relocates it: the "proper function" itself becomes a disjunction of coextensive properties present in the Environment of Evolutionary Adaptedness. This undermines teleosemantics' fundamental claim to naturalize *determinate* content solely via appeal to evolutionary history. The frog doesn't snap at representations of flies *or* SDMT; it snaps, and evolution favored this because snapping at SDMT got flies. The content remains stubbornly indeterminate.
