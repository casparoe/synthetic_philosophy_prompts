  okay for a paper in my high school phil elective i've been down a rabbit hole on teleosemantics (the millikan/dretske project of naturalizing mental content via evolutionary function), and honestly im kind of over every source just repeating swampman and the cow/horse-in-the-dark disjunction problem for learned concepts. can you argue for something more specific: that teleosemantics can't fix determinate content even for simple innate detectors, using the frog's fly-snapping reflex (frogs will also snap at bb pellets shot past them). argue that selection history can't actually have discriminated between "the mechanism's proper function is detecting flies" and "its proper function is detecting small dark moving things," becuase both properties were presumably just as correlated with the fitness payoff back when the trait evolved -- so picking flies over small-dark-moving-things is arbitrary, and appealing to selection just reintroduces the disjunction problem one level up instead of solving it. pls don't just give me the standard misrepresentation/malfunction answer to the disjunction problem either, i've read that version already.
