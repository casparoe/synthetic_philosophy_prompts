  Random tangent from the novel im drafting right now -- I've got a minor character, a retired graphic designer who's kind of a crank, and she keeps ranting about Otto Neurath and those Isotype pictogram charts from the 20s and 30s (the ones with rows of little repeated worker/factory icons instead of one big scaled-up icon). I want her rant to actually hold up, so: if you dropped Neurath into 2024 and showed him emoji being pitched as a "universal language," the area-scaled bubble charts every news site loves, and those medical risk-communication graphics (100 stick figures, a few shaded in to show odds), which of these would he actually approve of by his own rules for Isotype, and which would he say are cheating? And is there anything around today that actually lives up to what he was trying to build, or did the whole "international picture language" dream just quietly die?
