  Next, the user asks if anything today lives up to Neurath's vision. Public health icons like restroom signs are standardized and universal, similar to Isotype. Transit icons (like airport signage) also follow his principles. Educational materials for kids use repeated icons effectively. However, the full dream of a comprehensive picture language didn't materialize. Instead, his principles influenced data viz without becoming a standalone language.

  The character's rant should highlight these points. She'd praise the medical infographics but criticize bubble charts and emoji. She might lament that Neurath's broader vision was co-opted by corporate interests, leading to inconsistent emojis and misleading charts. Mentioning the ISO 7001 standards could add depth, showing some legacy exists in transit systems and public symbols.

