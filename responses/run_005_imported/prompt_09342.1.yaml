answer: |-
  Your intuition is astute—Duhem and Quine articulate distinct theses often improperly fused. Let's dissect them systematically, addressing your core questions:

  ### 1. **Duhem’s Holism: Scope and Limits**  
     - **What he claimed**: In *La Théorie Physique: Son Objet et Sa Structure* (1906), Duhem argued that in *mathematical physics*, hypotheses cannot be tested in isolation. Experiments confront a *whole theoretical network* with observation. A failed prediction indicts the entire system (theory + auxiliary assumptions), not a single hypothesis.  
     - **Scope**: Explicitly restricted to **mathematical physics** (e.g., thermodynamics, electromagnetism). Physics relies on abstract formalism detached from direct intuition, requiring complex instrumentation and mathematics.  
     - **Exemptions?** Duhem distinguished physics from "practical" or "qualitative" sciences (e.g., physiology, early chemistry). In these, experiments might isolate hypotheses because theories map more directly to observation (e.g., "this chemical turns blue" vs. measuring abstract electromagnetic fields).  
     - **"Bon Sens" (Good Sense)**: Not intuition, but a cultivated scientific judgment rooted in experience. Physicists use it to decide which part of the theoretical web to adjust:  
       - Prioritizes conserving established principles (e.g., energy conservation) over ad hoc patches.  
       - Favors modifications preserving theoretical "naturalness" (e.g., adjusting instrument calibration before overhauling core laws).  
     - **What he *didn’t* claim**: Holism extending to all empirical sciences, let alone logic/mathematics. For Duhem, underdetermination is a *methodological challenge in physics*, resolvable via disciplined scientific judgment.

  ---

  ### 2. **Quine’s Radical Holism**  
     - **Scope**: In "Two Dogmas of Empiricism" (1951), Quine argues **all knowledge—logic, math, physics—forms a "seamless web"** confronting experience only at its edges. No statement (not even "2+2=4") is *immune* to revision.  
     - **Key Expansions beyond Duhem**:  
       - **Logic/Mathematics are Revisable**: Given "recalcitrant experience," we might alter logic itself (e.g., adopt quantum logic to preserve quantum mechanics). Quine’s example: revising the law of excluded middle to simplify quantum theory.  
       - **No Analytic/Synthetic Distinction**: Rejects the idea that logical/mathematical truths are true by definition (analytic). All truths are empirically constrained.  
       - **Global Underdetermination**: Any observation can be reconciled with *any* theory by sufficiently radical adjustments elsewhere in the web (e.g., positing hallucinations to save a favored metaphysics).  
     - **Negotiating Logical Truths**: For Quine, logical laws are central to the web—thus highly conserved—but *principles, not dogmas*. Sufficiently disruptive evidence (e.g., quantum anomalies) could justify revision if it yields overall simplicity.

  ---

  ### 3. **Resolving Underdetermination: *Bon Sens* vs. Pragmatism**  
     | **Aspect**               | **Duhem’s *Bon Sens***                          | **Quine’s Pragmatism**                     |  
     |---------------------------|-------------------------------------------------|--------------------------------------------|  
     | **Nature**                | Discipline-specific judgment honed by practice | Universal epistemic virtues                |  
     | **Criteria**              | - Fidelity to theoretical traditions<br>- Empirical adequacy<br>- Mathematical elegance | - Simplicity<br>- Conservatism<br>- Explanatory power |  
     | **Epistemic Status**      | Grounded in physics’ history and aims           | Grounded in biological/psychological utility |  
     | **Goal**                  | Resolve ambiguity in theory choice              | Justify *any* belief revision              |  
     - **Crucial Difference**:  
       - Duhem’s *bon sens* is **internal to science**—a tool for working physicists.  
       - Quine’s pragmatism is **naturalized epistemology**—science and philosophy continuous, with choices driven by survival/convenience.  

  ---

  ### **Synthesis: Why the Conflation Masks Key Distinctions**  
  - **The "Composite Name" Problem**: Yes, labeling both as "Duhem-Quine" smuggles Duhem’s narrow, physics-focused thesis into Quine’s radical epistemology. Duhem shows why *physics experiments* can’t pinpoint falsified hypotheses; Quine claims *no evidence ever* uniquely determines theory.  
  - **Underdetermination: Genuine or Trivial?**  
    - **Duhem**: Offers a *methodological reminder*: logic alone can’t assign blame in physics. Underdetermination is local and resolvable via *bon sens*.  
    - **Quine**: Asserts *systematic underdetermination* of theory by evidence. No "truest" theory exists—only pragmatically optimal ones.  
  - **Your Physics Experience**: Your habit of tweaking instruments before doubting theories aligns with Duhem’s *bon sens*. Quine would say this is one instance of a universal pragmatism—but Duhem would reject extending it beyond physics.  

  ### **Conclusion**  
  - **Duhem’s Thesis**: A modest, discipline-specific insight about testing in mathematical physics. Underdetermination is practical, not ontological.  
  - **Quine’s Thesis**: A revolutionary epistemological claim: all knowledge is holistic, revisable, and chosen pragmatically.  
  Their shared label obscures more than it reveals. Duhem gives physicists a tool; Quine redefines truth itself. Your instinct is correct: the fusion risks inflating Duhem’s careful analysis into Quine’s radicalism. Neither "gives reason" for underdetermination in the same way—Duhem observes it in practice; Quine elevates it to a first principle.
