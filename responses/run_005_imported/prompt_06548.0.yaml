prompt: |-
  A friend and I spent most of dinner last night arguing about whether a rational agent should always want more information before making a decision. I invoked Good's theorem -- the result that, for a Bayesian expected-utility maximizer, the expected value of cost-free evidence is never negative -- to argue that the answer is essentially yes. My friend countered with a case from information economics in which publicly revealing a fact in advance destroys an insurance market that depended on people not yet knowing how things would turn out, and took this as proof that more information can leave everyone worse off. Neither of us could say with any precision where Good's guarantee actually stops applying, so we ended the night unconvinced by each other. Could you lay out exactly what the theorem does and doesn't establish -- which assumptions are doing the real work -- and explain whether examples like my friend's genuinely violate it, or simply describe situations that were never within its scope to begin with?
reasoning: |-
  Okay, the user and their friend had a debate about whether a rational agent should always want more information before making a decision. The user cited Good's theorem, which suggests that free information can't have negative expected value for a Bayesian decision-maker. Their friend countered with an example from information economics where revealing information destroys an insurance market, making everyone worse off. They want to understand where Good's theorem applies and why the insurance example doesn't violate it.

  First, I need to recall Good's theorem clearly. The theorem states that for a Bayesian expected utility maximizer, the expected value of information (EVI) is non-negative when the information is free. The key assumptions here are a single agent, cost-free information, and a fixed decision problem. The agent updates beliefs via Bayes' theorem and chooses actions to maximize expected utility.

  The friend's example involves multiple agents and strategic interactions. In insurance markets, asymmetric information allows risk-pooling. If everyone knows their risk type beforehand, high-risk individuals are priced out, and low-risk ones might leave, collapsing the market. This is a multi-agent scenario with interdependent decisions, which Good's theorem doesn't cover.

  I should explain the scope of Good's theorem: single-agent, non-strategic, fixed decision problem. The insurance example is multi-agent, strategic, and the decision problem changes when information is revealed. The welfare loss comes from the market structure collapsing, not from the individual's Bayesian update. So, the theorem isn't violated because the example operates outside its assumptions.

  The user might need a clear distinction between individual rationality and group outcomes. Even if each agent benefits from their own information (as per Good), the collective result can be worse due to strategic interactions. Also, they might want to know if there are cases where information hurts within the theorem's scope. Probably not, unless costs or violations of rationality occur.

  Underlying needs: The user seeks a resolution to their debate, understanding the boundaries of Bayesian rationality, and how game theory extends beyond individual decision-making. They might also be interested in real-world applications where information can be harmful despite Good's result, like in markets or negotiations.
answer: |-
  You've hit upon a profound tension at the heart of decision theory and economics! Both you and your friend are correct *within the specific scopes* you were implicitly arguing about. Good's Theorem is powerful but has crucial limitations that your friend's insurance example exploits perfectly. Let's break down the theorem, its assumptions, and why the insurance market case exists *outside* its scope.

  **Good's Theorem: The Core Statement & Assumptions**

  1.  **The Agent:** A single, rational, Bayesian expected-utility maximizer.
  2.  **The Decision Problem:** The agent faces a fixed set of possible actions (`A`) and a fixed set of possible states of the world (`S`). Each action-state pair yields a fixed utility (`U(A, S)`).
  3.  **Prior Beliefs:** The agent has a prior probability distribution (`P(S)`) over the states `S`.
  4.  **Information/Evidence (`E`):** A potential piece of new information the agent could acquire *before* choosing an action. This information is modeled as an observation that comes from a known likelihood function (`P(E | S)`).
  5.  **Cost:** Acquiring `E` is assumed to be **cost-free** (no resources, time, or utility expended).
  6.  **Bayesian Updating:** Upon receiving `E`, the agent updates their beliefs to the posterior distribution `P(S | E)` using Bayes' theorem: `P(S | E) ∝ P(E | S) * P(S)`.
  7.  **Decision Rule:** The agent always chooses the action that maximizes expected utility given their *current* beliefs:
      *   Without `E`: Choose `A_noE` maximizing `Σ_S [ P(S) * U(A, S) ]`
      *   With `E`: Choose `A_E` maximizing `Σ_S [ P(S | E) * U(A, S) ]`

  **The Theorem:** Under these assumptions, the **Expected Value of Information (EVI)** for `E` is non-negative. Formally:
      `EVI(E) = E[ max_A Σ_S (P(S | E) * U(A, S)) ] - max_A Σ_S (P(S) * U(A, S)) ≥ 0`

  **What This Means & Establishes:**

  1.  **Non-Negative Expected Value:** *Before* observing the specific outcome of `E`, the agent *expects* to be at least as well off (in terms of utility) by having `E` and acting optimally based on it, as they would be without having `E` and acting optimally based on their prior. On average, it can't hurt.
  2.  **No Guarantee for Specific Realizations:** For *specific realizations* of `E`, the agent might end up worse off *after* seeing `E` than they *would have been* if they had made their optimal decision *without* seeing `E`. However, the key is that *before* seeing `E`, the agent doesn't know which realization they'll get, and the *expectation* over all possible `E` is non-negative. The bad outcomes are outweighed by the good ones in expectation.
  3.  **Value Comes from Better Decisions:** The value of information arises *solely* because it allows the agent to make better decisions *within their fixed decision problem*. It helps align actions with the true state.
  4.  **Strictly Positive Often:** EVI is strictly positive unless `E` is irrelevant to the decision (i.e., the optimal action is the same regardless of what `E` turns out to be).

  **Where Good's Guarantee Stops Applying: The Crucial Limitations**

  Your friend's insurance example violates **almost every core assumption** necessary for Good's Theorem to apply. It describes a fundamentally different scenario:

  1.  **Multiple Strategic Agents (Violates Assumption 1):** Good's theorem applies to a *single* agent making a decision against nature. Insurance markets involve *many* agents (potential buyers and sellers) who make *strategic decisions* based on their information, beliefs about others' information, and expectations about others' actions. The outcome depends on the *interaction* of these decisions.
  2.  **Endogenous Decision Problems & Payoffs (Violates Assumption 2):** The very *availability* of actions (e.g., offering specific insurance contracts, buying insurance) and the *payoffs* associated with actions (e.g., profitability of a contract) depend **critically** on the information structure itself. Revealing information *changes the game being played*.
      *   **The Insurance Mechanism:** Asymmetric information (people know their own risk but insurers don't) is *necessary* for a pooling equilibrium to potentially exist. Insurers offer contracts priced based on the *average* risk. Higher-risk individuals get a good deal, lower-risk individuals get a slightly bad deal, but both might buy, creating a functioning market and providing social value (risk pooling).
  3.  **Information Revealed Publicly/Across Agents (Violates Scope):** Good's theorem considers a single agent acquiring private information for their own decision. In the insurance example, the "fact" (e.g., everyone's genetic risk) is revealed *publicly* or to *all relevant agents simultaneously*. This fundamentally alters the strategic landscape for *everyone*.
  4.  **Cost-Free Assumption is Misleading (Violates Assumption 5 & Scope):** While acquiring the specific piece of info might be "cost-free" technically, its revelation imposes massive *systemic costs* by destroying the mechanism (the insurance market) that generated value under asymmetric information. The "cost" is the collapse of a beneficial social arrangement that depended on ignorance. This cost isn't borne in the act of *acquiring* the info, but in the *consequences* of its widespread revelation on the decision environment.

  **The Insurance Example Explained Through Good's Lens:**

  1.  **Pre-Revelation (Asymmetric Info):**
      *   *Agent (Insurer):* Prior (`P(S)`) reflects the average risk in the population. Optimal action *might* be to offer a pooling contract at an average price.
      *   *Agent (Low-Risk Individual):* Prior knows they are low-risk. Optimal action *might* be to buy the average-priced contract (it's still better than no insurance).
      *   *Agent (High-Risk Individual):* Prior knows they are high-risk. Optimal action is definitely to buy the average-priced contract (it's a great deal for them).
      *   *Outcome:* Market functions, risk is pooled, everyone (or almost everyone) has insurance. Social welfare is relatively high.
  2.  **Post-Public Revelation (Symmetric Info):**
      *   *Agent (Insurer):* Now knows *each individual's exact risk* (`S` is known!). Optimal action is to offer personalized contracts: very high price to high-risk, very low price to low-risk.
      *   *Agent (Low-Risk Individual):* Gets offered a low price. Buys insurance. Happy.
      *   *Agent (High-Risk Individual):* Gets offered a very high price (perhaps unaffordable). Cannot buy insurance. Very unhappy.
      *   *Outcome:* Market segregates. Low-risk individuals are better off. High-risk individuals are *much* worse off (no insurance). Insurers are fine (make fair profit per contract). **Social welfare is lower** because the high-risk group loses valuable insurance coverage entirely. The risk-pooling benefit is destroyed.

  **Why This Doesn't Violate Good's Theorem:**

  1.  **Individual Perspective (if they could get info secretly):**
      *   *Low-Risk Individual:* If they could *privately* learn they are low-risk *before anyone else*, Good's theorem applies. They could use this info to maybe find a better deal (if one existed) or at least confirm buying the average contract is correct. EVI ≥ 0 *for them*.
      *   *High-Risk Individual:* If they could *privately* learn they are high-risk, EVI might be low or zero (they already suspected it, and their optimal action was already to buy), but EVI ≥ 0.
      *   *Insurer (about a specific individual):* If an insurer could *privately* learn the risk of *one specific customer* before setting their price, Good's theorem applies. They could price accurately. EVI ≥ 0 *for that insurer regarding that customer*.
  2.  **The Problem is Systemic Revelation:** The welfare loss occurs **only** because the information is revealed *to everyone simultaneously and publicly*. This changes the *rules of the game* for all agents.
      *   The "action" available to the insurer (offering a single pooling contract) *disappears* as a viable option once information is symmetric. That action only existed *because* of the asymmetry.
      *   The payoff for high-risk individuals (access to affordable insurance) *disappears* once information is symmetric.
      *   Good's theorem assumes a *fixed* set of actions and payoffs. Public revelation fundamentally alters both the action sets and the payoff structure *for all agents* by destroying the possibility of pooling. It changes the decision problem itself.

  **Conclusion: Where the Guarantee Holds and Where It Doesn't**

  *   **Good's Theorem Holds:** For a **single, rational, Bayesian decision-maker** facing a **fixed decision problem** (fixed actions, fixed state-dependent utilities), acquiring **cost-free, private information** relevant to the state of the world **always has non-negative expected value**. The agent expects to make better decisions on average.
  *   **Good's Theorem Does *Not* Hold/Apply:**
      *   In situations with **multiple strategic agents** (game theory settings).
      *   When acquiring/revealing information **changes the fundamental decision problem** available to agents (e.g., destroys market mechanisms, changes available contracts, alters negotiation power).
      *   When information is revealed **publicly** or to **multiple agents simultaneously**, leading to shifts in the strategic equilibrium.
      *   When the information revelation imposes **systemic costs** by destroying beneficial arrangements that depended on asymmetric information (like insurance pooling or certain market equilibria).
      *   When information acquisition has direct **costs** (time, resources, utility).

  **Resolution:** You were correct that, *for an individual Bayesian agent within a fixed decision problem*, more (free, relevant) information is never expected to be harmful. Your friend was correct that in complex, multi-agent systems, the *public revelation* of information can destroy valuable social arrangements and leave some, or even all, agents worse off *ex post* compared to the *ex ante* situation under asymmetric information. His example doesn't violate Good's theorem; it simply operates in a domain far beyond its narrow (but important) scope of individual rational choice under fixed conditions. The "real work" is done by the assumptions of a single agent and a fixed decision problem. Once you move to multiple agents and endogenous decision structures, all bets are off.
