  However, Anderson's crucial move is in the definition of necessary existence. Anderson defines:

  NE(x) :<=> for every essential property E of x, necessarily there exists an entity that has E.

  Moreover, Anderson weakens the axioms on positivity: he does not assume that the conjunction of arbitrarily many positive properties is positive, but only finite conjunctions. And he does not assume that the disjunction of positive properties is positive. 

  But the main point is in the definition of essence and necessary existence. 

