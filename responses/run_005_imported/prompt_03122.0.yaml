  **Bailey:** This is where Anderson's emendation comes in. Anderson avoids the collapse by redefining the essence and necessary existence. Specifically:

  - Anderson defines: E is an essence of x if and only if E entails every property that x has necessarily. (This is the same as Gödel.) 
