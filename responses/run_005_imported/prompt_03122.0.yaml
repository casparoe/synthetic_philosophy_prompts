  But then how does collapse occur? 

  The critical step is that if we accept that the set of positive properties is the same in every world (because positive properties are necessarily positive) and that God in the actual world has all positive properties necessarily, then in every world, the being g_w has all positive properties. But that doesn't force the actual world's contingent facts to hold in every world. 

