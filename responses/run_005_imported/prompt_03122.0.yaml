  In Gödel's original, we have: 
  1. God has all positive properties necessarily. 
  2. Necessary existence (NE) is positive, so God has NE necessarily.
  3. Let G be the essence of God. Then G entails every property that God has necessarily. In particular, G entails NE.
  4. NE is defined as: for every essential property F of God, God necessarily has F. 
