  Moreover, the essence of God, G, entails only the necessary properties of God. So, in different worlds, the entities that have G might be different, and they might not have the same contingent properties. 

  Therefore, the actual God (g0) might exist only in the actual world, while in other worlds, there is a different entity that has G. And that entity has all the positive properties (which are the same in every world) but may have different contingent properties. 

