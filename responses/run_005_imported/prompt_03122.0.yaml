  **Bailey:** And that's where the trouble starts? 

  **Alex:** Precisely. Since G is the essence of God, and God has NE necessarily, then G entails NE. Now, NE says that for every essential property of God, God necessarily has it. But note: G itself is an essential property of God. So, by NE, God necessarily has G. And since G entails every property that God has necessarily, we get a kind of fixed point.

  **Bailey:** But how does that lead to modal collapse?

  **Alex:** Consider an arbitrary true proposition P. We can define a property Q_P: if P is true, then Q_P is the universal property (which every entity has), and if P is false, then Q_P is the empty property. But that's a bit messy. Alternatively, we can use the property of being identical to the actual world. However, a more straightforward way is to note that God has all positive properties necessarily. Now, consider the property of being such that P is true. If we can show that this property is positive, then God would have it necessarily, and then P would be true in every world.

