  This avoids the modal collapse because the actual world's contingent facts are not tied to the existence of God in every world. 

  **Alex:** I see. So in Anderson's version, we do not get that the actual God exists in every world, only that in every world there is a God-like being (with all positive properties). Therefore, the property I (being identical to the actual God) is not a positive property, and we don't have to worry about it. 

  Moreover, the essence G does not entail contingent properties, so the God-like being in another world might have different contingent properties. Hence, the actual truth P is not necessarily true.

  **Bailey:** Precisely. And that's why Anderson's emendation blocks Sobel's modal collapse.

  **Alex:** But then, is Anderson's God the same as the traditional God? The traditional God is usually thought of as a unique, necessary being. Anderson's argument gives that there is a God-like being in every world, but they might be different individuals. 

  **Bailey:** Anderson addresses that by arguing that the God-like being is unique in each world because the essence is individualizing. Specifically, the essence G is such that at most one entity can have it in any world. And since the God-like being has all positive properties, and negative properties (like not being identical to a particular individual) might not be positive, it could be that in each world there is exactly one God-like being. But they are not identical across worlds. 

  This is a form of "modal relativism" about God, but it still satisfies the requirement of necessary existence in the sense of a divine being in every world.

  **Alex:** So, in summary, the modal collapse in Gödel's original argument arises because the combination of the essence clause and the necessary existence property forces that the actual God exists in every world and has all its actual properties necessarily. But Anderson breaks this by redefining necessary existence to require only the necessary instantiation of the essence (not of the individual) and by having the essence entail only the necessary properties.

  **Bailey:** Exactly.

  **Alex:** I concede that Anderson's version avoids the modal collapse. But I still worry that the concept of God it delivers is not the traditional one. However, that's a separate debate.

  **Bailey:** Agreed. But at least we've pinpointed the step in the original argument that causes the collapse: the original definition of necessary existence, when combined with the essence clause, leads to the necessary existence of the actual individual God, which then forces all its properties to be necessary.

