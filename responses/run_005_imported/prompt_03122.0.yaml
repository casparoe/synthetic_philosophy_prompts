  Background: 
  - Gödel's argument defines a "positive property" and posits that necessary existence (NE) is positive. It also includes an "essence" clause: a property is the essence of an entity if it entails all and only the properties that the entity has necessarily.
  - Sobel's modal collapse objection: If we accept the axioms and definitions, then every true proposition becomes necessarily true (i.e., actual truths are true in every possible world). This is because the argument would imply that God has every positive property necessarily, and then the essence of God would entail all of God's properties, which would include the property of being identical with the actual world (thus collapsing all possibilities to the actual world).
  - Anderson's emendation: Anderson proposed to modify the definition of essence and to weaken the necessary existence condition. Specifically, in Anderson's version, necessary existence is defined as having all essential properties necessarily instantiated, and the essence definition is adjusted so that it doesn't entail all properties of the entity but only the ones that are necessarily had.

  Dialogue:

  **Alex:** Bailey, let's focus on Gödel's original argument. We both agree that necessary existence (NE) is taken as a positive property and that positive properties are necessarily positive. The critical step is the definition of essence. For an entity x, a property E is the essence of x if and only if E entails every property that x has necessarily. Correct?

  **Bailey:** That's the original definition, yes. But note that Anderson changes that definition to avoid the collapse.

