  Okay so I'm a 3rd-year CS PhD student working in algorithmic information theory (my advisor is big into universal priors, MDL, that whole cluster of ideas), and our reading group has been going through Li & Vitanyi again this week. We ended up spending basically the whole session arguing about the invariance theorem -- you know, the fact that Kolmogorov complexity is only machine-independant up to an additive constant, so in principle you could build a UTM that hardcodes literally any hypothesis to come out "simple." Solomonoff induction inherits the exact same problem through the universal prior. Someone in the group pointed out how funny it is that people love to invoke "just apply Occam's razor" as if simplicity were some pure, language-independent virtue, when the actual rigorous version of that idea turns out to be both secretly relative to your choice of machine, and, on top of that, uncomputable, so no one could actually run the "ideal" procedure even if they wanted too.

