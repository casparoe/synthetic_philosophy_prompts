  First, I need to recall the key points. Penrose uses Gödel to say any consistent formal system can't prove its own Gödel sentence. Humans can see it's true, so we're not formal systems. The friend argues we can't know our own consistency. Penrose counters with soundness, meaning the system only proves true statements. 

