  So in my formal epistemology seminar (cross-listed with the econ department's game theory sequence) we just went through Rubinstein's e-mail game -- the "almost common knowledge" coordination result -- and I followed the backward induction argument line by line but it still doesn't sit right in my gut. Quick recap incase I'm misremembering a detail: player 1 privately learns the state is "worth attacking," her machine auto-fires a confirmation to player 2's machine, which auto-replies, and so on back and forth, except each message independently has some tiny chance of getting lost, so the exchange just stops whenever one fails to arrive. Even though the expected number of confirmations blows up as that loss probability shrinks toward zero (so both players can become near-certain the other knows that they know that they know... to some absurdly high order), the unique equilibrium is still that neither one ever attacks, full stop, no matter how many confirmations actually went through.

  What I can't shake is the discontinuity. Everywhere else in decision theory a little more evidence just nudges your posterior a little, it doesn't flip your whole strategy. But here, going from "common knowledge" to "common knowledge minus epsilon" apparently collapses the entire cooperative outcome back to the safe default. Could you give me an intuitive, non-formal feel for why the unraveling is total instead of graceful -- like what's actually doing the work in the induction step, explained in plain english rather than in terms of belief hierarchies? And if you're up for it, I'd love a gut check on a follow-up thats been bugging me since class: real people seem to coordinate off "almost common knowledge" constantly (a rumor everyone's heard, a public announcement almost everyone saw) without everything collapsing -- so is the toy model missing some feature of how real public information works, or is our everyday coordination secretly relying on something other than the common knowledge condition game theorists say we need?
