  We are given eleven hypotheses to rank. Let me list them for clarity:

  1. Rare Earth Hypothesis
  2. Great Filter (early-filter version)
  3. Great Filter (late-filter version)
  4. Zoo Hypothesis
  5. Dark Forest Hypothesis
  6. Aestivation Hypothesis
