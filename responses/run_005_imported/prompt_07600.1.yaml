prompt: |-
  I've got this habit where I check a movie's Rotten Tomatoes score before watching anything, and if its 95%+ I'll tell people it's a great movie even if I haven't actually seen it yet myself. My roommate says that's basically dishonest since I don't have my own opinion, I'm just repeating critics. But I take people's word on stuff all the time, like which laptop to buy or whether a mechanic is trustworthy, without checking myself first. Is taste in art actually different in a way that makes this kind of secondhand opinion illegitimate, or is my roommate just being uptight about it?
