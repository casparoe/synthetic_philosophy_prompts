  First, I need to unpack why the roommate sees it as dishonest. The key here is the difference between factual information and subjective experience. When recommending a laptop, you're passing along specs or reliability data—things that are measurable. But art is subjective; it's about personal experience. By saying a movie is great without seeing it, the user is skipping that personal engagement. The roommate might feel misled because the user presents it as if they've actually watched it.

  Then, the user’s comparison to other recommendations. They have a point that we trust reviews daily. But for movies, the value isn't just in the aggregated score; it's in the individual experience. If someone asks for a movie recommendation, they might be seeking a personal endorsement, not just critic consensus. The user's approach could come off as insincere because they're not sharing their own experience.

  I should consider the social aspect. When people discuss movies, they often share personal reactions. If the user hasn't seen the film, they can't contribute to that conversation meaningfully. They might be seen as pretending to have knowledge they don't, which could undermine trust. The roommate might worry about that.

