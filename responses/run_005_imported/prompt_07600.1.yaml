answer: |-
  That's a fascinating habit, and your roommate raises a valid point, though the situation isn't entirely black and white. Here's a breakdown of why art *is* different, why your roommate might be reacting that way, and how you can navigate this honestly:

  **Why Art (Especially Taste) is Fundamentally Different:**

  1.  **Subjectivity:** A laptop's specs, a mechanic's turnaround time, or a restaurant's hygiene rating are largely objective (or based on verifiable experiences). Art appreciation is deeply, inherently subjective. What resonates profoundly with one person (or 95% of critics) might leave another cold or even offend them. When you say "it's a great movie," you're making a claim about *quality* and *experience*, not just functionality or reliability.
  2.  **The Experiential Gap:** You haven't *had* the experience you're recommending. Telling someone a mechanic is trustworthy because multiple people vouched for *their work* is passing along verified experiences. Telling someone a movie is great without having *felt* it, *experienced* its pacing, *reacted* to its performances, or *understood* its themes means you're recommending an experience you haven't actually had yourself. You're recommending the *idea* of the experience based on others' reactions.
  3.  **The Nature of Recommendation:** When people ask for movie recommendations, they are often seeking a *personal* connection or validation. "Have *you* seen it? Did *you* like it?" They want to know if it might resonate with *them*, based on knowing *your* tastes or trusting *your* judgment. You're offering a statistic, not a personal judgment.
  4.  **The Illusion of Consensus:** A 95% RT score means 95% of critics found it at least somewhat worthwhile (a "Fresh" rating, often 6/10 or above). It doesn't mean 95% think it's a masterpiece. It signifies broad *acceptability* or *competence*, not universal acclaim for greatness. You're potentially amplifying the meaning of the score.

  **Why Your Roommate Might Be Calling it Dishonest:**

  1.  **Implied Personal Experience:** Saying "It's a great movie" strongly implies you've seen it and formed that opinion. Omitting "I haven't seen it, but critics love it" creates a false impression. It feels like you're claiming credit for an opinion you haven't formed.
  2.  **Lack of Authenticity:** It can come across as wanting to appear knowledgeable or culturally current without doing the "work" of actually watching and forming your own view. It prioritizes social perception over genuine engagement.
  3.  **Potential for Mismatch:** If someone watches it based *specifically* on *your* "great movie" recommendation and hates it, they might feel misled, even if the critics loved it. Their trust in *your* recommendations diminishes.

  **Where Your Argument Holds Water (and Where it Doesn't):**

  *   **Yes, We Rely on Secondhand Info:** You're absolutely right that we constantly rely on reviews, recommendations, and aggregated opinions for countless decisions (laptops, mechanics, restaurants, doctors, travel destinations). This is essential in a complex world.
  *   **The Difference is Nuance:** The key difference lies in:
      *   **The nature of the claim:** "This laptop has good battery life based on reviews" vs. "This is a great movie" (implying personal aesthetic judgment).
      *   **The expectation:** When asking for a movie recommendation, people often expect a *personal* endorsement based on experience, not just a critical aggregate. They expect you to have *had* the experience you're recommending.
      *   **The subjectivity:** The stakes of a mismatched subjective experience (hating a movie you hyped) feel higher than a mismatched objective fact (the laptop battery being slightly less than reviews said).

  **Is Your Roommate Just Being Uptight?**

  Probably not *entirely*. They are identifying a genuine distinction in how we communicate opinions and recommendations, especially regarding subjective experiences. They likely value authenticity and personal engagement with art. However, their reaction might feel overly strong because your habit is common and stems from a reasonable place (trusting critical consensus).

  **A More Honest & Useful Approach:**

  1.  **Be Transparent:** "I haven't seen it myself *yet*, but it has a 95% on Rotten Tomatoes, so the critical consensus is extremely strong!" or "Critics are raving about it, it's sitting at 95% on RT."
  2.  **Frame it as Information, Not Your Verdict:** You're providing a *data point* ("Critics love it") rather than *your personal opinion* ("It's great"). This is honest and still valuable information.
  3.  **Explain *Why* You Trust It:** "I find that when movies hit that 95%+ mark on RT, they're almost always at least very well-made and interesting, even if they're not always *my* personal favorite."
  4.  **Use it as a Filter, Not a Recommendation:** Tell people *you* use high RT scores as *your* filter for what to watch, but make it clear your actual recommendation requires you to have seen it. "Based on the score, it's high on *my* list to watch soon!"

  **Conclusion:**

  Your roommate has a point about the potential dishonesty. Saying "it's a great movie" implies a personal judgment formed through experience, which you haven't had. Art's profound subjectivity makes personal experience central to forming and sharing a meaningful opinion. While relying on aggregated reviews is perfectly rational for choosing what to watch, *presenting* that aggregate as *your own* positive opinion crosses a line into misrepresentation.

  The solution isn't to stop sharing the RT score (it's useful info!), but to be transparent about its source and what it represents. Shift from "It's a great movie" to "Critics absolutely love it, it's at 95% on Rotten Tomatoes." This is honest, informative, and avoids the core issue your roommate identified.
