  Here’s a toast that weaves the money-pump mechanics into the emotional fabric of their story, honoring the theory for the sister while resonating emotionally with all:

  **(Raise glass, warm smile)**  

  "Eleven years. To everyone here, that number tells a story we all know bits of – the story of [Groom] and [Bride]. A story with chapters that felt, at times… *cyclical*. Breakups that felt like endings, reconciliations that felt like new beginnings… only to loop back around. If love were a simple equation, we might have solved it years ago!  

  **(Light chuckle, shift to gentle sincerity)**  

  But watching them navigate this, I always saw something profound. It wasn’t indecision. It was two fiercely independent, complex people learning the hardest thing: how to truly *choose* each other, not just once, but *continuously*, against every doubt and distraction. Each time they parted, it cost them something precious – not money, but time, peace of mind, pieces of their hearts. Each reunion was a triumph, yes, but also a temporary fix on a deeper instability. They were spending emotional currency in a cycle that couldn't sustain itself.  

  **(Pause, make eye contact with the couple)**  

  That’s what makes *today* so extraordinary. This vow isn’t just another chapter in the cycle. It’s the radical, resolute *closure* of it. It’s the moment they looked at the pattern – the beautiful, frustrating, exhausting pattern of attraction and retreat – and said, **‘No more leaks. No more cycles. This is the stable ground.’**  

  **(Nod subtly towards the groom's sister without naming theory)**  

  For anyone who’s ever studied how choices compound… you understand the profound power of this resolution. It stops the drain. It locks in the preference. It declares, finally and absolutely: *This* choice, *this* person, above all others, forever. The loop is broken by the sheer, unwavering weight of ‘I do.’  

  **(Turn fully to the couple, voice thick with emotion)**  

  For the rest of us? We just see the love story. We see two people who weathered storms, learned each other’s deepest truths – the beautiful and the challenging – and kept finding their way back because the connection was *worth* the chaos. We see the incredible strength it took to turn that magnetic pull into a permanent anchor. We see the proof that sometimes, the longest journeys aren’t about distance, but about depth. You didn’t just find love; you forged it, tested it, and ultimately, *chose* it with a clarity that only those eleven years could bring. That depth, that hard-won certainty… it’s breathtaking.  

  **(Raise glass higher)**  

  So let’s raise our glasses to [Groom] and [Bride]! To the end of the exhausting loops! To the triumphant, resolute choice made today! To locking in that preference and building a brilliantly stable, deeply loving future together. May your union be a testament to the power of finally – gloriously – getting it right. Cheers!"

  **Why this works for both audiences:**

  1.  **For the Decision Theorist (Groom's Sister):**
      *   **"Cyclical," "loop," "pattern," "temporary fix," "deeper instability":** Clearly references the irrational preference cycle.
      *   **"Spending emotional currency," "drain," "leaks":** Directly analogous to the "money pump" concept of value being extracted through the cycle.
      *   **"Radical, resolute closure," "stops the drain," "locks in the preference," "stable ground," "loop is broken":** Explicitly names the resolution as stopping the pump and establishing stable, transitive preferences. "Resolute choice" is a specific term in decision theory for commitment strategies that avoid dynamic inconsistency.
      *   **"For anyone who’s ever studied how choices compound…":** The subtle nod to her expertise without jargon.
      *   **Mechanics are Sound:** It accurately portrays the cycle as costly and irrational, and the marriage vow as the commitment device that stabilizes preferences and ends the exploitation (of their own emotions/time).

  2.  **For Everyone Else:**
      *   **Emotional Journey:** Focuses on universal themes – perseverance, learning, depth of love, overcoming challenges, the cost of breakups, the joy of reunions, the power of commitment.
      *   **Relatable Language:** Uses terms like "emotional currency," "exhausting," "triumph," "chaos," "anchor," "hard-won certainty," "breathtaking" – all deeply emotional and understandable.
      *   **Story Arc:** Presents the 11 years as a necessary, albeit difficult, journey to reach this profound level of commitment and understanding. "Forged love" is a powerful image.
      *   **Celebration of Choice:** The core message – that this final choice is different and definitive – resonates emotionally as the happy ending.
      *   **Humor & Warmth:** The opening chuckle, the focus on their strength and love, the heartfelt conclusion – all keep it warm, celebratory, and moving.

  **Key Balancing Act Achieved:**

  *   The toast **never mentions "money pump," "intransitive preferences," or "dynamic inconsistency."**
  *   It uses **metaphors** ("leaks," "drain," "spending currency," "loop," "stable ground") that perfectly *describe* the mechanics to the theorist while painting a vivid *emotional picture* for others.
  *   The **nod to "those who study choices"** acknowledges the sister without alienating anyone.
  *   The **core message of "this choice ends the cycle"** is the satisfying climax for both the love story and the decision theory narrative.

  This toast honors the complexity the sister understands, celebrates the love story everyone feels, and ultimately lands on the powerful, unifying triumph of the couple's final, resolute choice. Cheers indeed!
