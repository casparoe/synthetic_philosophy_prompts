  I should structure the dialogue to have two characters: Dr. Rosenthal (actualist) and Dr. Carruthers (dispositionalist). Each will present their theory, then challenge the other. They need to respond directly to the objections. For example, when Carruthers raises biological implausibility, Rosenthal should counter with how his theory explains phenomenology. When Rosenthal questions how dispositions create "what it's like," Carruthers should explain how dispositions ground current properties.

