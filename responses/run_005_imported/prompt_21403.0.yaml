  Here’s a draft eulogy that honors Ruth’s philosophy while offering genuine comfort, using plain language to bridge her academic rigor with universal human experience. It leans into the *consequences* of her view rather than its technical scaffolding:

  ---

  ### For Ruth Halvorsen  
  *(Delivered at her memorial service)*  

  We are here because we loved Ruth Halvorsen. We loved her wit, her fierce curiosity, the way she could turn a department meeting into a moral crusade or a dinner party into a philosophical seminar. She was brilliant, stubborn, and uncompromisingly honest—especially about ideas that mattered.  

  Ruth spent her life thinking deeply about what it means for things to *be*. She defended a radical, beautiful idea: that what truly exists in this world are not tables or mountains, but living things. **Life**, for Ruth, was the miracle. A cat, an oak tree, a person—these are not just collections of parts, but unified, breathing realities. When life ends, that unity ends. Ruth believed this with every fiber of her being. She would insist—gently but firmly—that we not pretend otherwise today.  

  **So what remains?**  
  Not a soul, or an essence, or a shadow of the person we knew. Ruth would dismiss that as wishful thinking. What remains is something more fragile, more human, and in its own way, more enduring:  

  1.  **Her Shape in the World**  
      Ruth spent 30 years arguing that after death, what’s left is merely “simples arranged person-wise.” But that arrangement *mattered*. It shaped rooms, conversations, institutions. Her absence isn’t an abstraction—it’s the empty chair at the seminar table, the unmarked exams on her desk, the silence where her laugh should be. That shape—the Ruth-shaped space in our lives—is real. We feel it now.  

  2.  **The Life She Lived**  
      Ruth taught us that existence is bound to a living moment. But within her moment—her life—she *burned*. She mentored students who now teach her ideas. She wrote papers that changed debates. She fought for adjuncts, challenged deans, and once convinced an entire conference that the lunch buffet didn’t exist (metaphysically, of course). **That life happened.** Its reality doesn’t fade because it ended.  

  3.  **What She Left Behind**  
      Ruth didn’t believe in persistent souls. But she believed fiercely in persistent *consequences*. Her kindnesses, her provocations, her legacy in this department—these are not illusions. They are facts in the world, as real as the force that bends an oak toward light. We inherit them. We *are* her aftermath.  

  To Ruth’s family: Thank you for sharing her with us. We know the woman you loved—the sister, aunt, friend—was more than a professor. We grieve the whole person, the vibrant life now ended.  

  To her students and colleagues: Ruth’s answer to the “Special Composition Question” was uncompromising. I will not soften it today. But let’s remember: her philosophy wasn’t cold. It was a hymn to the uniqueness of living things. In a universe of dust, she insisted, **life is the exception**.  

  We will miss Ruth’s voice, her presence, her living mind. But the shape she carved in the world? The lives she changed? The ideas that outlived her?  

  **That’s not metaphysics. That’s love.**  
  And love, Ruth would agree, is real.  

  ---

  ### Why this works
  - **Honors her philosophy:** Uses phrases like "life is the miracle," "unity ends," "simples arranged person-wise," and rejects "souls" or "living on." Academics will recognize her exact position without jargon.  
  - **Comforts non-philosophers:** Focuses on universal human experiences—absence, legacy, grief—using concrete images (empty chairs, ungraded exams, oak trees).  
  - **Reframes "what remains":** Shifts from metaphysical persistence to *historical impact* ("her shape in the world," "consequences," "aftermath"). This aligns with van Inwagen’s view while offering solace.  
  - **Centers her humanity:** Celebrates her humor, convictions, and relationships—things everyone valued, regardless of their views on composition.  
  - **Turns her rigor into warmth:** Her rejection of false comfort becomes intellectual integrity; her "radical" view becomes a "hymn to life."  

  Ruth might have raised an eyebrow at the word "love" in the closing line—but she’d appreciate that it’s not smuggled in as ontology. It’s a lived truth, messy and undeniable. Like her.
