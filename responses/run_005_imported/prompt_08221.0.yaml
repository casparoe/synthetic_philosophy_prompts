    "a": {"score": <0-2>, "comment": "<...>"},
    "b": {"score": <0-2>, "comment": "<...>"},
    "c": {"score": <0-2>, "comment": "<...>"},
    "total": <0-6>,
    "letter_grade": "<...>"
  }
  ```
