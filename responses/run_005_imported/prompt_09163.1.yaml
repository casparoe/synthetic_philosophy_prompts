answer: |-
  You're absolutely right to be suspicious of oversimplifications here – the Popper/evolution story is notoriously messy and frequently weaponized in evo psych debates. Let's untangle Popper's actual positions, the nuances of his shifts, and what this *really* means for the "just-so story" charge.

  **Popper's Evolving Stance on Darwinism:**

  1.  **Initial Critique (Pre-1970s): "Metaphysical" Not "Untrue"**
      *   Popper's core concern was falsifiability as the demarcation criterion for science. In works like *Unended Quest* (1974, recounting earlier views) and lectures, he argued that the *core formulation* of Darwinian natural selection ("survival of the fittest") was **tautological** and thus non-falsifiable.
      *   **The Tautology Problem:** If "fitness" is defined *only* by survival and reproductive success, then "survival of the fittest" essentially means "survival of those who survive." This makes it logically true but empirically empty – it doesn't specify *mechanisms* or make unique predictions about *which* traits will be selected in a *specific* environment. It seemed to explain everything *after the fact*.
      *   **Crucial Distinction:** Popper consistently **accepted common descent (evolution as a historical fact)** as strongly supported by evidence (fossils, biogeography, homology). His target was the *explanatory mechanism* of natural selection *in its broadest formulation*. He contrasted it with testable theories like genetics.
      *   **Label:** He famously called natural selection a "metaphysical research programme" – meaning it wasn't strictly scientific *by his criterion* but could be fruitful and lead to testable theories.

  2.  **The "Recantation" (Late 1970s): Acknowledging Progress, Clarifying Scope**
      *   Facing significant criticism from biologists (like Ernst Mayr and John Eccles) and recognizing advancements in the field, Popper revised his view. His most cited statement is from 1978 ("Natural Selection and the Emergence of Mind"):
      *   **Key Shift:** He stated he had been wrong to call natural selection untestable *in principle*. He acknowledged that the **Modern Synthesis** (integrating genetics with natural selection) had produced genuinely testable theories about *specific* mechanisms (e.g., genetic drift, specific selection pressures).
      *   **Nuance of the Recantation:**
          *   It was **not** a blanket endorsement of *all* Darwinian explanations as always falsifiable.
          *   It was an acknowledgment that the **core logic of natural selection *could be* embedded within testable frameworks** when combined with specific auxiliary hypotheses (about genetics, inheritance, mutation, specific environmental pressures, etc.).
          *   He **maintained his distinction** between the historical fact of evolution (well-supported) and the theory of natural selection as the *primary* mechanism (which he now conceded could be tested *in specific applications*).
          *   He still harbored concerns about the potential for unfalsifiable "adaptationist" storytelling if not rigorously constrained.

  **Implications for the "Just-So Story" Charge in Evolutionary Psychology:**

  Popper's framework *does* provide tools to distinguish testable adaptive hypotheses from untestable "just-so stories," **but it hinges critically on the specifics of the hypothesis and the evidence presented.** It's not a wash, but it requires careful application. Here's the breakdown:

  1.  **The Core Insight: Falsifiability Demands Specificity and Risk:** A genuinely scientific adaptive hypothesis must make **risky predictions** – predictions that could *conceivably be proven wrong* by evidence. Vague claims about "this trait must have been adaptive somehow" fail this test.
  2.  **What Makes an Adaptive Hypothesis Testable (and Potentially Popperian)?**
      *   **Specifies the Adaptive Problem:** Clearly defines the *specific* environmental challenge or recurrent problem faced by ancestors (e.g., "detecting cheaters in social exchanges," "avoiding plant toxins," "choosing nutrient-rich mates," NOT just "survival" or "reproduction" generally).
      *   **Proposes a Specific Trait as the Adaptation:** Identifies a *specific* psychological mechanism (e.g., a cheater-detection module, a disgust response to bitterness, a preference for symmetrical faces).
      *   **Generates Unique, Falsifiable Predictions:** This is the crux. Predictions must be:
          *   **Specific:** Not vague or easily explained by other means.
          *   **Novel:** They shouldn't just restate the observation that prompted the hypothesis.
          *   **Empirically Risky:** They must outline evidence that *could* disprove the hypothesis. Examples:
              *   **Universality:** If the trait is claimed to be a universal human adaptation, finding cultures where it's absent or operates differently *under the predicted conditions* would be problematic.
              *   **Functional Specificity:** Evidence that the mechanism *only* activates in the predicted context, not others (e.g., a "cheater detection module" firing *only* on social contract rules, not logical rules in general – a prediction from Cosmides & Tooby that *was* tested).
              *   **Development:** Predictions about how the trait develops (e.g., emerges reliably without specific cultural input, shows critical periods).
              *   **Comparative Evidence:** Predictions about the trait's presence/absence or form in closely related species facing similar/different pressures.
              *   **Neurocognitive Architecture:** Predictions about dedicated neural circuitry or information processing design.
              *   **Costly Signals:** Predictions that the trait involves costs that would only be borne if it solved a *specific* adaptive problem.
      *   **Considers Alternatives:** Actively seeks evidence against non-adaptive explanations (e.g., developmental constraints, byproducts of other adaptations, cultural transmission).

  3.  **What Makes it a "Just-So Story" (Potentially Unfalsifiable)?**
      *   **Post-hoc Reasoning Only:** Starts with a modern behavior and *only* constructs a plausible-sounding story about its past adaptive value without generating *new*, specific, testable predictions.
      *   **Vagueness:** Fails to specify the *exact* adaptive problem, the *exact* mechanism, or the *specific* environmental context.
      *   **Immunization:** Explains away *any* finding. If a trait is universal, it's adaptive. If it's not universal, maybe the environment was different. If costs are found, they prove its importance. If no costs are found, it was highly efficient. This makes the hypothesis untouchable by evidence.
      *   **Ignoring Plausible Alternatives:** Dismisses non-adaptive explanations (e.g., "It *must* be an adaptation because it exists") without evidence.
      *   **Lack of Ancestral Evidence/Constraints:** Makes claims about the EEA (Environment of Evolutionary Adaptedness) that are completely untestable due to lack of evidence about past environments or behaviors.

  **Applying This to Your Standoff & Evo Psych:**

  *   **The Defender's Counter ("Even natural selection wasn't falsifiable!") is Misleading:**
      *   Popper *did* recant his strongest claim, acknowledging natural selection *can* be tested within specific frameworks (like population genetics).
      *   Evolutionary biology *as a whole* isn't just "natural selection." It includes masses of falsifiable evidence: fossil sequences, genetic phylogenies, observed speciation events, biogeography, observed natural selection in real-time (e.g., Galapagos finches, antibiotic resistance). These *are* testable and falsified many non-evolutionary ideas.
      *   Granting natural selection initial "metaphysical" status doesn't absolve *specific* evo psych hypotheses from needing to be testable *now*. The onus is on evo psych to demonstrate its hypotheses meet the criterion, just as population genetics did.

  *   **The Critic's Charge ("It's just a just-so story!") Can Be Valid, But Needs Specificity:**
      *   It's a valid *warning* and a demand for rigor. Many early and some current evo psych hypotheses *do* fall into the untestable trap.
      *   **However, blanket dismissal is unfair.** Some evo psych research *does* generate specific, falsifiable predictions and tests them rigorously (e.g., work on kin recognition, spatial navigation differences, some aspects of mate preference, fear learning). The charge should be leveled at *specific, poorly constructed hypotheses*, not the entire field *a priori*.

  *   **Popper's Legacy Provides the Tools for Discrimination (Not a Wash):**
      *   **Principled Distinction:** Popper's framework *does* give you a principled way to judge: **Does *this specific* adaptive hypothesis make risky, specific, novel predictions that could be falsified by conceivable evidence?** If yes, it's potentially scientific. If no, or if its proponents constantly immunize it against counter-evidence, it's suspect.
      *   **It's About Methodology, Not Topic:** The difficulty of studying past behavior doesn't *inherently* make evo psych unscientific. It makes it *harder*, demanding greater methodological ingenuity (cross-cultural comparisons, physiological measures, priming studies, game theory experiments, neuroimaging, studies of development) to generate testable predictions.
      *   **The Burden of Proof:** Evo psych proponents bear the burden of demonstrating their specific hypotheses are testable *and* survive testing. Pointing to Popper's initial doubts about natural selection doesn't discharge this burden.

  **Conclusion for Your Longread:**

  Don't present it as "Popper doubted evolution, then recanted." Present the nuance:

  1.  Popper distinguished between the well-supported historical *fact* of evolution and the *mechanism* of natural selection.
  2.  He initially argued the *broadest formulation* of natural selection was tautological/metaphysical but **always accepted evolution as fact**.
  3.  He later acknowledged that the **Modern Synthesis provided testable formulations** of natural selection through specific models and auxiliary hypotheses.
  4.  **The key implication for evolutionary psychology is not that it gets a pass, but that it must meet the same standard evolutionary biology eventually met:** Specific adaptive hypotheses must be framed in ways that generate **risky, falsifiable predictions**.
  5.  Criticizing a *specific* evo psych hypothesis as an untestable "just-so story" is valid **if** it lacks specificity, relies only on post-hoc storytelling, or is immunized against counter-evidence. It's invalid as a blanket dismissal of the *entire field*, **but** the field must continuously demonstrate its hypotheses are genuinely testable to earn scientific credibility.
  6.  **The Standoff Resolution:** Move beyond the rhetoric. Evaluate *each specific claim* on whether it: a) Clearly defines the problem & mechanism, b) Generates unique, falsifiable predictions, c) Has been (or could be) tested against those predictions, and d) Considers and rules out plausible non-adaptive explanations. Popper's ghost demands no less. Some evo psych will pass this bar, some won't. Your job is to show readers *how* to tell the difference.

  Focus on the *methodological rigor* (or lack thereof) in specific studies/explanations, using Popper's demand for falsifiable predictions as the critical lens. This avoids the unproductive standoff and provides readers with a concrete tool for evaluation.
