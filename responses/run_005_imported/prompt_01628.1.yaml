answer: |-
  Here’s a robust argument for omissions as genuine causes, targeting the skeptic’s undefended metaphysical commitments while preserving counterfactual intuition:

  ### **The Core Argument: Parity, Ontology, and Explanatory Scope**
  1. **Counterfactual Symmetry Principle (CSP)**  
     If causation is fundamentally counterfactual dependence (as per Lewis), then *any* factor satisfying "~X → ~Y" should qualify as a cause. The skeptic must explain why dependence on an absence (e.g., "lifeguard’s non-intervention → drowning") is metaphysically inferior to dependence on a positive event (e.g., "push → fall"). Denying this parity requires:  
     - **Either** abandoning counterfactual theories altogether (which many skeptics accept),  
     - **Or** introducing an *ad hoc* restriction favoring "positive" events.  

     The burden is on the skeptic to justify this restriction without circularity.

  2. **The Ontological Sleight-of-Hand**  
     Skeptics often claim omissions aren’t "real" events because they lack spatiotemporal location or causal "oomph." But this relies on unargued assumptions:  
     - **Assumption 1**: *Causation requires energy transfer/mechanical push*.  
       This is a *physicalist* reduction of causation, not a neutral analysis. If causation is broader (e.g., difference-making), omissions qualify.  
     - **Assumption 2**: *Only positive entities exist*.  
       But negative facts are ubiquitous in discourse (e.g., "The absence of rain caused the famine"). Denying their reality conflicts with truth-conditional semantics: if "The lifeguard did not act" is true, it corresponds to a state of affairs—an absence.  
     - **Assumption 3**: *Causation must link distinct events*.  
       Omissions *are* distinct events under a fine-grained ontology: "the lifeguard’s non-action-at-t" is a particular with modal and temporal properties.

  3. **Explanatory Costs of Skepticism**  
     Reducing omissions to "positive surrogates" (e.g., negligence) fails in key cases:  
     - **Overdetermination**: Suppose two lifeguards independently fail to notice a drowning swimmer. Either omission alone suffices for drowning. The skeptic must say both omissions reduce to distinct positive states (e.g., each guard’s neural inattention), but this misidentifies the cause: the swimmer drowns because *no one acted*, not because of two neural states.  
     - **Non-Agential Omissions**: A drought kills crops. The skeptic claims the cause is "positive" (e.g., low soil moisture). But the *absence of rain* remains explanatorily irreducible: we explain crop failure by contrasting actual conditions with normal rainfall expectations.  
     - **Normative Neutrality**: Some omissions lack positive counterparts. If a comet fails to strike Earth, preventing extinction, the cause is the *non-occurrence of the impact*—not a "positive" factor, unless we stretch "positive" to vacuity.

  4. **The Metaphysical Payoff: Causation as Contextual Difference-Making**  
     Omissions are causes because causation is inherently contrastive and interest-relative:  
     - We pick causes from a backdrop of normal expectations. In the lifeguard case, the *expected norm* (intervention) is the foil against which absence matters.  
     - This doesn’t make causation "subjective." The counterfactual "Had X occurred, Y would not have happened" is objectively true/false.  
     - Rejecting omissions commits the *physicalist fallacy*: conflating causal *mechanisms* with causal *relations*. Mechanisms may be positive, but relations are difference-making structures.

  ### **Why the Skeptic’s Asymmetry Fails**
  The skeptic’s asymmetry rests on two undefended pillars:  
  - **Event Ontology Bias**: Assuming events must be "positive occurrences." But absences are robustly individuated (e.g., *the lifeguard’s failure during interval t*).  
  - **Causal Monism**: Insisting causation is univocal (only physical interaction). But causation operates at multiple levels: physical, agential, normative. Omissions dominate explanations in ethics, law, and history—e.g., "The central bank’s inaction caused the recession" isn’t shorthand for neural states of bankers.

  ### **Conclusion**
  Omissions are genuine causes because they satisfy counterfactual dependence, play irreplaceable explanatory roles, and reflect how causation structures our world. The skeptic’s rejection relies on arbitrary restrictions that conflate metaphysics with physics. To dismiss omissions is to impoverish causation—rendering it unable to capture the causal structure of responsibility, prevention, and luck. The burden is on skeptics to explain why counterfactual dependence *only* counts when grounded in positivity—a demand that itself may beg the question.

  *"What keeps the skeptic dry in the rain is not merely atoms in motion, but the absence of holes in their umbrella."*
