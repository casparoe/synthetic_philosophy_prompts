  Ok this is a bit of a random one but I've been chewing on it for weeks and can't shake it. My grandma is pretty devoutly religious and has always told us she'll be with my grandpa again after she dies too. But when he actually passed away last year she was completely wrecked about it, inconsolable for months, still won't touch his side of the closet, cries at random reminders, the whole thing. My cousin (total atheist) keeps saying this proves grandma doesn't really believe what she claims, because if she genuinely expected to see him again she wouldn't grieve like its permanent. Something about that argument bugs me but I can't quite articulate why. Is my cousin right that her grief exposes the belief as basically hollow/inconsistent, or is there a better way to think about whats actually going on here? Feels like I should have a good answer to this given I'm doing a PhD in cognitive science of religion, but honestly I'm stumped.
