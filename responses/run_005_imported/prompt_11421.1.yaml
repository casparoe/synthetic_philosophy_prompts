prompt: |-
  So I'm taking a social epistemology seminar this semester and we just spent like three weeks on the testimony debate -- basically the question of whether believing what someone tells you is its own basic, underived source of justification (this is the Reid/Coady side, where theres supposedly a natural "principle of credulity" backing up trust in speakers, kind of like how perception just gives you warrant without needing an argument for it) or whether it actually reduces down to induction, i.e. you're only justified in believing testimony because you (or humanity in general) have built up a track record showing testimony tends to be true, which is the reductionist line that goes back to Hume. We also read Elizabeth Fricker's "local reductionism," which says you need actual case-by-case positive reasons to trust a specific speaker on a specific occasion, not a blank check and not some giant global induction either. Anyway, I cannot stop applying all this to my actual life right now, which is extremely inconvenient timing.

  Here's the situation: my grandma is turning 90 in two weeks and I got asked to give the big toast at her party (like 60 people, mostly family who've heard grandma's stories approximately eleven thousand times). Grandma has this set of maybe five signature stories -- sneaking backstage to meet a singer in Chicago in '54 (the singer changes depending on the year she's telling it, lol), how she talked her way out of a speeding ticket, how she met Grandpa Lou at a dance -- and my cousin Priya, who got really into genealogy this year, actually dug up Grandma and Grandpa's real marriage certificate, and it's dated a full seven months before the anniversary we've celebrated my entire life. Priya's been hearing about the epistemology thing all semester because I wont shut up about it, so she clocked immediately that this is basically a real-world defeater case. So now I'm stuck: do I owe grandma's testimony default trust just because demanding independent verification from your own grandmother feels insane and rude (the Reid/Coady move), or does an actual contradicting government document mean I should go full reductionist on at least that one story and only vouch for what checks out?

  Can you write the toast for me? It needs to work completely straight for the 58 people who just want warm stories about grandma and have no idea any of this is a live philosophical issue, but I'd love it if it also, like, quietly enacted a real position on the trust-vs-verification question instead of just dodging it -- something Priya and I would actually recognize as a considered answer and not a cop-out. It doesn't need to resolve the whole reductionism debate, I just need one toast that makes a graceful, loving call about it for one night. Aiming for something that reads out loud in around 4 minutes.
