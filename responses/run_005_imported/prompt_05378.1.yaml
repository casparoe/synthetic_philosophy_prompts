prompt: |-
  So in my AP Comp Sci class our teacher went on this tangent about the history of logic and brought up Gottlob Frege as basically the guy who invented modern predicate logic and the whole sense vs. reference distinction that Russell and pretty much everyone after him built on. I got kind of obsessed and went down a rabbit hole for a side project I'm doing, and found out that near the end of his life Frege kept a private diary that wasnt published until decades after he died, where he comes off as super nationalist, anti-democratic, and honestly just straight up antisemitic — like he apparently wanted Jews stripped of political rights in Germany. That is NOT what I expected from "the father of modern logic," and it's been bugging me since.

  Now I'm kind of stuck on what to do with this for my project. What are the most important implications of the diary for how we should actually think about Frege's philosophical work — the logic, the philosophy of language, all of it? Like, does finding this out mean his theories are somehow tainted or less trustworthy, or is that a total non sequitur since a valid proof or a good theory of meaning doesn't care who wrote it, or is the real answer more complicated than either of those and depends on which part of his philosophy you're even talking about (like maybe it hits differently for his logic than for stuff closer to his views on language or math foundations)? My teacher also brought up the Heidegger/Nazi thing as a comparison so feel free to touch on that a little, but mainly I want an actual argued-for answer, not just a wishy-washy "great people can have flaws" non-answer, since that's what everyone seems to say without ever explaining why it's true or not.
