  Next, the user wants passages beyond the "brave men" quote. I should identify sections where Aquinas discusses tyranny, the conditions for resistance, and the preference for public authority. For example, in *Summa Theologiae*, he talks about the dangers of killing a ruler causing more harm. Also, in his *Commentary on the Sentences*, he mentions that killing a tyrant without public mandate is dangerous.

