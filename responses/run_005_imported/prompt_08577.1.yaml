  I'm a software engineer with no formal background in philosophy, though I've picked up a fair amount about David Lewis from discussions of decision theory and modal realism in the online circles I follow. I recently discovered, to my surprise, that he also wrote a short paper called "Do We Believe in Penal Substitution?", bringing the tools of analytic philosophy to bear on the Christian doctrine that Christ was punished in place of sinners. As I understand it, the argument hinges on a contrast between substituting for a debt, which seems unproblematic since a loan can be discharged by anyone's payment, and substituting for a punishment, where it's far less obvious that someone else suffering the penalty actually satisfies justice for what I did. Could you spell out that puzzle more precisely, ideally in terms of what a theory of punishment would need to look like for substitution to even make sense, and then walk through how Lewis tries to work out whether penal substitution can be rescued from incoherence?
