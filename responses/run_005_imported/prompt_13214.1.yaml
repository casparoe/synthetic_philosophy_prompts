  The user needs to draft a pre-vote memo with recommendations that:
  1. Assigns proportionate sanctions per student
  2. Resolves the philosophical tension about the fourth student's responsibility
  3. Avoids academic jargon (since scientists on the board won't engage with philosophical references)
  4. Engages substantively with counterarguments, especially on student four

  The core dilemma mirrors Gilbert vs. Bratman:
  - Gilbert's collective commitment would hold student four responsible by virtue of joining the group
  - Bratman's mutual responsiveness would absolve him since he lacked specific knowledge/intention about the fraud

  User's unspoken needs:
  - Practical resolution within bureaucratic constraints (academic code is vague)
  - Intellectual honesty in bridging theory/practice
  - Avoiding setting bad precedents (e.g., rewarding willful ignorance)
  - Preserving board unity despite philosophical divides

  Approach for the memo:
  - Sanctions: Max for students 1-2, significant for 3, conditional for 4
  - For student 4: Argue for reduced (not zero) responsibility using "reasonable diligence" standard
  - Preempt "free pass" criticism by requiring ethics training
  - Counter "full responsibility" view by emphasizing his demonstrable non-participation
  - Use plain language: Replace "joint commitment" with "group accountability," "mutual responsiveness" with "active collaboration"

  Key balancing act: Neither pure Gilbert (too harsh) nor pure Bratman (too lenient) fits this case. The solution lives in the practical middle ground—conditional sanctions that acknowledge group dynamics while honoring individual intent.
answer: |-
  Here’s a draft memo addressing the case, balancing philosophical principles with practical academic integrity standards. It avoids technical jargon while incorporating the core insights of shared agency theories implicitly. Recommendations are clear, proportionate, and engage directly with counterarguments.

  ---

  **MEMORANDUM**  
  **TO:** Academic Integrity Board Members  
  **FROM:** [Your Name/Position]  
  **DATE:** [Date]  
  **SUBJECT:** Case # [Number] - Joint Lab Report Fabrication (Research Methods Course)  

  ### Case Summary  
  Four students submitted a joint lab report containing two fabricated data columns. The evidence establishes:  
  - **Students 1 & 2**: Collaborated via text to fabricate data.  
  - **Student 3**: Discovered the fabrication thread 48 hours pre-deadline but took no action; allowed submission with their name.  
  - **Student 4**: Contributed an independently verified section using legitimate data. Was excluded from the fabrication thread and claims the group leader instructed them to “focus only on their part,” which they accepted without further inquiry.  

  The Academic Integrity Code holds all members of a joint submission “jointly and severally responsible for its integrity, absent clear and convincing evidence of non-participation.”  

  ### Recommended Sanctions  
  | Student | Recommended Sanction | Rationale |  
  |---------|----------------------|-----------|  
  | **1 & 2** | **Course Failure + Notation on Transcript** | Directly engaged in fabrication. Maximum sanction warranted. |  
  | **3** | **Course Failure + Mandatory Ethics Workshop** | Knew of fabrication but failed to act. Lesser than 1 & 2 due to late discovery, but complicity demands severe consequence. |  
  | **4** | **Grade Penalty on Assignment (e.g., 50% reduction) + Mandatory Ethics Workshop** | Did not participate in or know of fabrication, but failed in due diligence as a group member. *Not* equal culpability to others. |  

  ### Critical Analysis: Student 4’s Responsibility  
  **Recommendation Summary:**  
  Student 4 bears *partial* responsibility. They should receive a significant assignment penalty (not course failure) and mandatory ethics training. Full exoneration is inappropriate, but full parity with others is disproportionate.  

  #### Key Argument: The "Reasonable Diligence" Standard  
  - **Why Not Full Exoneration?**  
    Group work requires active oversight. Accepting a “focus on your part” directive without *any* inquiry into the final product ignores the baseline responsibility all members share for the *whole* submission. If we excuse this entirely, we incentivize willful ignorance—e.g., students could avoid liability by deliberately avoiding communication. Student 4’s inaction enabled the fraud.  
    - *Counterargument Engaged:* The claim that Student 4 “never shared an intention to fabricate data” is valid but incomplete. Shared intent isn’t binary; it’s about whether a member *could reasonably have known* their actions enabled misconduct. By submitting blindly, Student 4 violated the group’s collective duty to verify integrity.  

  - **Why Not Equal Sanction?**  
    Student 4 lacked actual knowledge of fabrication, did not contribute to it, and was excluded from planning. Punishing them identically to active fabricators (Students 1–2) or a knowing bystander (Student 3) conflates meaningfully distinct roles. Holding them fully liable under “joint responsibility” ignores their demonstrable non-participation in the fraud.  
    - *Counterargument Engaged:* The concern that “never asking” becomes a “free pass” is legitimate. This is why we impose a penalty—to reinforce that group membership demands diligence. However, equating blind trust with active deceit ignores intent and causality. Student 4’s failure was *negligence*, not *malice*.  

  #### Balancing the Two Extremes  
  1. **The "Group Bind" View (Gilbert-esque):**  
     Joining a group entails accepting responsibility for the collective output. You cannot benefit from the group (e.g., shared grade) while disclaiming all accountability for its methods.  
     *→ Applied here:* Student 4 chose to trust the group; they cannot fully escape consequences of that trust being misplaced.  

  2. **The "Specific Intent" View (Bratman-esque):**  
     True shared responsibility requires awareness of and contribution to the *specific wrongful act*. Absent that, liability is individual.  
     *→ Applied here:* Student 4’s honest work and exclusion from fraud planning show they did not “share” the fabrication.  

  **Synthesis:** Student 4’s violation lies in **negligent delegation**, not fraud. They are accountable for failing to verify the final product—a breach of academic duty—but not for the intentional deceit of others.  

  ### Conclusion  
  This case highlights tensions in group accountability, but our code’s “non-participation” clause allows nuanced application:  
  - **Students 1 & 2**: Active fraud → **Maximum sanction**.  
  - **Student 3**: Knowing inaction → **Severe sanction (one tier below 1 & 2)**.  
  - **Student 4**: Negligent oversight → **Significant assignment penalty + remediation**.  

  This approach:  
  - Upholds academic integrity without scapegoating.  
  - Recognizes degrees of culpability.  
  - Deters willful ignorance by penalizing negligence.  
  - Avoids incentivizing hyper-vigilant mistrust in teams.  

  ---  

  **Key Strengths for the Board:**  
  1. **Plain Language:** Uses “group accountability,” “due diligence,” and “negligent delegation” instead of philosophical terms.  
  2. **Proportionality:** Sanctions escalate based on knowledge and action.  
  3. **Precedent-Setting:** Defines “non-participation” as requiring both (a) no involvement in misconduct *and* (b) reasonable effort to verify work.  
  4. **Counterarguments Addressed:** Directly engages the “free pass” and “shared intent” concerns without privileging either absolutist view.  

  **Vote Recommendation:** Adopt the sanctions above to balance fairness with academic standards.
