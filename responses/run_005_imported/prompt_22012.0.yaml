answer: |-
  Here are eight targeted interview questions designed to probe the substantive challenges to expressivism, each with a precise follow-up anticipating common defenses. The sequence builds from concrete cases to meta-philosophical concerns, ending with your requested falsifiability test.

  ---

  ### **Core Questions & Follow-Ups**
  1. **Embedded Context Challenge**  
     *Question:* In the conditional "If breaking a promise is wrong, then talking someone into breaking theirs is wrong," expressivism holds that the antecedent "breaking a promise is wrong" isn’t *asserting* disapproval. What *precise attitude-state* does it express in this unasserted context, and how does this differ functionally from the attitude expressed when asserted outright?  
     → *Likely Defense:* "It expresses a *hypothetical* or *conditional* attitude."  
     → *Follow-up:* If it’s hypothetical, how does this avoid collapsing into a *propositional* content (e.g., "in the scenario where I disapprove of promise-breaking...")? Doesn’t this reintroduce truth-aptness through the back door?  

  2. **Negation Problem (Simple Case)**  
     *Question:* For the atomic claim "Breaking a promise is not wrong," what *specific attitude* does this express? Is it the absence of disapproval, approval of promise-breaking, or a distinct attitude like "tolerance"?  
     → *Likely Defense:* "It expresses a *negative* attitude (e.g., toleration or indifference)."  
     → *Follow-up:* If "not wrong" expresses tolerance, but "wrong" expresses disapproval, how are these two attitudes logically inconsistent in a way that mirrors the inconsistency of "P" and "¬P" in factual discourse?  

  3. **Negation Problem (Embedded & Generalized)**  
     *Question:* Consider a disjunction: "Either breaking promises is not wrong, or giraffe hunting is wrong." What single, unified attitude does this complex sentence express? Does it require inventing a *new primitive attitude* (e.g., "disapproval-of-giraffe-hunting-or-tolerance-of-promise-breaking")?  
     → *Likely Defense:* "Attitudes compose via higher-order states (e.g., disapproval of *failing* to have one of these attitudes)."  
     → *Follow-up:* If every logical operator (¬, ∨, →) requires a *new layer* of higher-order attitudes, how is this not ad hoc? Does this machinery differ meaningfully from assigning standard propositional content?  

  4. **Validity Without Truth**  
     *Question:* Take modus ponens: "If lying is wrong, then getting others to lie is wrong. Lying is wrong. Therefore, getting others to lie is wrong." How does expressivism *formally* define validity here without appealing to truth-preservation?  
     → *Likely Defense:* "Validity is defined by *attitude-inconsistency avoidance*: accepting premises but rejecting the conclusion induces incoherent attitudes."  
     → *Follow-up:* What constitutes "incoherence" between attitudes? If it’s defined as *logical* incoherence (e.g., "disapproving of X but not Y when Y necessarily follows from X"), haven’t you presupposed the very logical structure you were meant to explain?  

  5. **The Collapse Worry**  
     *Question:* If expressivism must reconstruct all logical relations, normative explanations, and even epistemic norms (e.g., "why infer *this* attitude from *those*?") using a shadow replica of propositional logic, what *substantive difference* remains between your view and non-naturalist cognitivism?  
     → *Likely Defense:* "The *metaphysical* difference: expressivism avoids positing moral facts while matching the *surface* logic of moral talk."  
     → *Follow-up:* If the "matching" requires identical formal structure and predictive power, is expressivism just cognitivism with an anti-realist *label*? What can your view *do* that a minimalist truth-conditional semantics (e.g., Crispin Wright) cannot?  

  6. **Attitude Logic vs. Propositional Logic**  
     *Question:* In standard logic, "P" has the same content in "P," "¬P," and "If P, then Q." If your attitude-logic assigns *different* attitude-types to "P" in these contexts (e.g., direct disapproval vs. hypothetical disapproval), how do you guarantee the *stability of meaning* needed for validity?  
     → *Likely Defense:* "The *expression-relation* is stable, but the *force* varies by context."  
     → *Follow-up:* If the meaning (content) of "wrong" is its expression-relation, but the attitude expressed changes with context, haven’t you equivocated on meaning in the very cases where logic requires uniformity?  

  7. **Empirical Testability**  
     *Question:* Psychological studies suggest moral judgments *behave like* factual beliefs in cognition (e.g., in reaction times, neural activation). If expressivism is correct, why do attitudes functionally mirror beliefs in logical processing?  
     → *Likely Defense:* "Evolution or pragmatics shaped moral language to *mimic* fact-stating discourse for efficiency."  
     → *Follow-up:* If the mimicry is so perfect that it replicates truth-conditional logic, inference patterns, and epistemic norms, what *observable evidence* could distinguish expressivism from a belief-based theory?  

  8. **Falsifiability Threshold**  
     *Question:* You’ve framed unresolved challenges as "engineering problems" for attitude-logic. What would constitute a *structural failure* of expressivism—i.e., evidence that *no possible* attitude-based semantics could resolve (e.g., for negation or embedding)—rather than just needing more complexity?  
     → *Likely Defense:* "If we could prove moral sentences *must* refer to truth-conditions to explain logic, expressivism fails."  
     → *Follow-up:* But hasn’t Blackburn *already* conceded that moral sentences project *as if* truth-apt? If your criterion for failure is "needing truth-conditions," but quasi-realism *endorses* truth-talk, how is this criterion non-circular?  

  ---

  ### **Key Design Rationale**
  - **Embedded Case (Q1)** forces operational specifics beyond "it’s conditional."  
  - **Negation (Q2–3)** targets scalability: Can expressivism handle all connectives without infinite attitude primitives?  
  - **Collapse (Q5)** questions whether the view retains any distinct content after reconstructing logic.  
  - **Falsifiability (Q8)** prevents indefinite deferral by demanding a failure condition.  
  - **Follow-ups** anticipate moves from quasi-realists like Blackburn (e.g., "inconsistency-avoidance," "mimicry") and press their internal coherence.  

  These questions avoid letting the guest retreat to "the project is possible"; they demand *how her specific solution works* and *where it would break*. Good luck with the episode!
