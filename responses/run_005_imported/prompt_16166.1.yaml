prompt: |-
  I spent my career running experiments in evolutionary biology, and since retiring I have been reading systematically in moral philosophy for the first time. One thing keeps striking me: the debate over 'moral worth' — what makes an action not just right but creditable to the agent — has exactly the structure of a confounded-variables problem. In the standard case of helping a friend, an agent's sense of duty and her direct sympathy for the friend are perfectly correlated, so nothing about that case alone can tell us which of the two is doing the explanatory work. This is essentially Michael Smith's 'moral fetishism' worry about the Kantian requirement that only action from duty has moral worth, and much of the subsequent literature amounts to designing cases — analogous to natural experiments — in which duty and inclination come apart. I would appreciate help weighing the proposed fixes. Please rank the following five accounts of moral worth, from most to least successful at resolving the fetishism/overdetermination problem while still preserving the idea that moral worth requires being moved by whatever actually makes an action right, rather than by lucky coincidence: Kant's classical motive-of-duty requirement; Barbara Herman's 'limiting condition' reading of Kant; Julia Markovits' coincident-reasons account; Nomy Arpaly's non-principled, desire-based account; and a plain Humean/sentimentalist view on which sympathy alone suffices. Please give the ranking as a JSON array ordered from best to worst, formatted as follows:

  ```json
  {
    "ranking": ["...", "...", "...", "...", "..."]
  }
  ```
reasoning: |-
  We are ranking five accounts of moral worth based on their success in resolving the "moral fetishism" problem (which arises when duty and inclination are confounded) while preserving the requirement that moral worth comes from being moved by what actually makes the action right (not by coincidence). The goal is to order them from most to least successful.

  The problem: In standard cases (like helping a friend), both duty and sympathy are present and correlated, so we cannot tell which one is the real motivator. We need accounts that can disentangle these and identify when the agent is motivated by the right-making feature.

  The five accounts:

  1. **Kant's classical motive-of-duty requirement**: Only actions done from duty have moral worth. Actions from inclination (even if they align with duty) lack moral worth.

  2. **Barbara Herman's 'limiting condition' reading of Kant**: Herman interprets Kant as saying that duty is a "limiting condition": it sets boundaries that inclination must not violate. However, within those boundaries, inclination can play a role. The motive of duty is necessary but not necessarily sufficient; it ensures that we don't act on inclinations that would lead us to do wrong, but we can still be motivated by inclination for the right action. This is supposed to avoid the fetishism worry by allowing for a role of inclination without making it the sole motivator.

  3. **Julia Markovits' coincident-reasons account**: Markovits argues that an action has moral worth when the agent's motivating reasons coincide with the normative reasons that make the action right. So, if the right-making feature of helping a friend is the friend's need, then the agent must be motivated by the friend's need (which could be from sympathy or duty, as long as the reason is the right one). This account is less about the type of motive (duty vs. inclination) and more about the content of the reason.

  4. **Nomy Arpaly's non-principled, desire-based account**: Arpaly rejects the idea that moral worth requires acting from duty. Instead, she argues that moral worth comes from acting out of a desire that is responsive to the right-making features of the action. For example, helping because one desires the friend's well-being (which is the right-making feature) and that desire is strong enough. She emphasizes the agent's responsiveness to moral reasons, which can be through non-principled desires (like sympathy) without needing to appeal to duty.

  5. **A plain Humean/sentimentalist view on which sympathy alone suffices**: This view holds that sympathy (or other sentiments) is sufficient for moral worth. Actions are morally worthy if they are done out of sympathy, regardless of duty. This view does not require the agent to be motivated by duty at all.

  Ranking criteria:
  - Success in resolving the fetishism/overdetermination problem: We want an account that can clearly distinguish cases where the agent is motivated by the right-making feature from cases of lucky coincidence.
  - Preserving the idea that moral worth requires being moved by what actually makes the action right.

  Analysis:

  1. **Julia Markovits' coincident-reasons account**: This seems particularly well-suited because it directly addresses the content of the reason. The agent must be motivated by the actual right-making feature (e.g., the friend's need). This avoids the confound by looking at the reason itself, regardless of whether it comes from duty or sympathy. So, in a case where duty and sympathy come apart, we can still check: is the agent motivated by the friend's need? If yes, then moral worth is present. This directly resolves the confound and ensures that the agent is moved by the right-making feature.

  2. **Nomy Arpaly's desire-based account**: Arpaly's account also focuses on the agent's responsiveness to the right-making features. She argues that a desire that tracks the moral reasons (e.g., desiring the friend's well-being because it is good) can confer moral worth. This also avoids the duty/sympathy confound by looking at the content of the desire and whether it is appropriately responsive. However, it is desire-based and non-principled, which might be seen as less stringent than Markovits' focus on reasons (but still very effective).

  3. **Barbara Herman's 'limiting condition' reading**: Herman tries to soften Kant's requirement by allowing inclination to play a role, but the motive of duty is still necessary as a limiting condition. This might avoid the fetishism worry to some extent because it doesn't require duty to be the only motive. However, it still requires duty to be present and playing a role, which might not be necessary if the agent is already fully motivated by the right reason (e.g., sympathy that is fully responsive). So, in cases where duty is absent but the agent is motivated by the right feature (e.g., pure sympathy that tracks the right-making feature), Herman might deny moral worth because duty is not present. This might not fully resolve the confound.

  4. **Kant's classical motive-of-duty requirement**: Kant requires that only actions done from duty have moral worth. This view is vulnerable to the fetishism objection because it seems to require the agent to be motivated by duty even when there are other good motives (like sympathy). In cases where duty and sympathy come apart, Kant would say that an action from sympathy (without duty) lacks moral worth, even if it is done for the right reason. But this might be too strict and not capture the intuition that being moved by the right feature (e.g., the friend's need) via sympathy is also creditable. Moreover, in the confounded case, we cannot tell if the agent is acting from duty or sympathy, but Kant would require that we know it's duty. This doesn't resolve the confound because it doesn't provide a way to isolate the motive of duty.

  5. **Plain Humean/sentimentalist view**: This view says that sympathy alone is sufficient. While this avoids the fetishism worry (by not requiring duty), it might not preserve the requirement that the agent must be moved by what actually makes the action right. For example, an agent might help out of sympathy but for the wrong reason (e.g., because the friend is similar to them, not because of the friend's need). The Humean view might not require that the sympathy be responsive to the right-making feature. Therefore, it might allow for cases of lucky coincidence (e.g., helping because of a coincidental sympathy that is not aligned with the right-making feature) to count as morally worthy. This fails to ensure that the agent is moved by the right-making feature.

  Therefore, the ranking from most to least successful:

  1. Julia Markovits' coincident-reasons account (best at isolating the right-making feature as the reason)
  2. Nomy Arpaly's desire-based account (also focuses on responsiveness to right-making features, but through desires)
  3. Barbara Herman's 'limiting condition' reading (requires duty, but allows some role for inclination; still might be too restrictive)
  4. Kant's classical motive-of-duty requirement (too rigid, requires duty even when the right reason is present via inclination)
  5. Plain Humean/sentimentalist view (risks allowing actions motivated by sympathy that doesn't track the right-making feature)

