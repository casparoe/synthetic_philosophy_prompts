  Here's my half-formed worry: doesn't this whole accommodation story get complicated once you look at who's already sacrificing earlier on in Tanakh, before there's any idolatry around for God to be weaning anyone off of? Can you give me one specific, fleshed-out example — an actual episode or set of verses, not just the abstract "sacrifice predates idolatry" slogan — where this problem really bites? And since I doubt Rambam (or a good defender of his) would just fold, can you also game out the single most natural comeback he'd have, and tell me honestly whether it actually rescues the theory or whether the tension survives anyway?
