  - Moreover, the theorem does not say that two rational people with the same information must agree immediately. It says that if they have the same prior and they communicate their posteriors and update until they have common knowledge of their posteriors, then they must agree. So Marcus is oversimplifying.
  - Also, the theorem does not rule out the possibility of different priors. So his claim that one must be wrong, confused, or lying is too strong because they might have different priors (which is allowed by the theorem as a reason for disagreement).
