  First, I need to validate their sophisticated understanding while carefully examining their inference. Their core question is whether rejecting PAP necessarily forces incompatibilists into indefensible positions. But I recall that the literature shows several nuanced incompatibilist responses that don't rely on PAP. 

  The user might be underestimating source incompatibilism - the position that determinism threatens responsibility not through alternative possibilities but through lack of ultimate control over the causal chain. Fischer's semi-compatibilism actually strengthens this point by separating alternative possibilities from sourcehood. 

  I should also highlight Kane's event-causal libertarianism and agent-causal theories as live options. Kane's self-forming actions where indeterminism exists at the moment of choice preserve alternative possibilities in a way that survives Frankfurt cases. And agent-causation theories reject PAP's relevance entirely while maintaining incompatibilism. 

  The user's concern about special pleading is understandable but premature. Source incompatibilists aren't just moving goalposts - they're making a principled distinction between the kind of control PAP protects (which Frankfurt undermines) and the deeper sourcehood control that determinism threatens. 

  For their dissertation, they'll need to engage with Stump's Frankfurt-inspired source incompatibilism - a fascinating position where even Frankfurt cases require ultimacy that determinism precludes. And Pereboom's hard incompatibilism shows one can reject PAP without becoming compatibilist. 

