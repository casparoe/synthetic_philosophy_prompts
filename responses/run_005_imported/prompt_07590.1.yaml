answer: |-
  Here’s a toast that honors your grandpa’s love for *De Senectute*, uses its core structure, acknowledges the historical irony with respect, and focuses firmly on celebrating *his* life and the philosophy he embodies:

  **(Raise your glass slightly, take a breath, smile warmly at your Grandpa)**

  "Family, friends, former students... and of course, the guest of honor himself – Grandpa. It’s truly an honor, and slightly intimidating, to be standing here celebrating 90 incredible years. Especially when the man we’re honoring spent nearly four decades ensuring people understood the precise meaning and weight of words... particularly those of a certain Roman orator.

  "Grandpa, your well-thumbed Loeb edition of Cicero’s *De Senectute* isn’t just a book on your shelf; it’s been a lens through which you’ve viewed life, aging, and, let’s be honest, occasionally gently ribbed the rest of us about our complaints. I think we all remember moments… maybe even at times of profound sadness… where you’d find that perfect passage to offer perspective. It’s part of who you are.

  "So, trying to give a *generic* toast about ‘the wisdom of age’ felt entirely inadequate. Because Grandpa, you didn’t just teach Cicero’s dialogue about old age; you lived its argument. You embodied old Cato’s spirited defense against the four great complaints people level against growing old.

  1.  **‘It withdraws us from active pursuits.’** Cato argued age brings not withdrawal, but a shift in focus – to counsel, wisdom, mentorship. Grandpa, look around this room. How many former students are here? How many lives did you shape not just in conjugating verbs, but in understanding the power of thought, language, and history? Your ‘active pursuits’ became cultivating minds, and that legacy echoes loudly tonight.
  2.  **‘It makes the body weaker.’** True, the body changes. But Cato countered that the mind and spirit can remain vigorous. Grandpa, even after that scare last month, what shines through? Your wit, your recall for lines of Latin poetry, your keen interest in the world – *that* vigor is undimmed. You taught us that strength isn't just physical; it's intellectual and spiritual resilience.
  3.  **‘It deprives us of physical pleasures.’** Cato, ever the pragmatist, suggested this might be a blessing! Freed from youthful passions, we appreciate finer things: conversation, friendship, reflection. Grandpa, your joy in a good debate, a shared memory, the company of family and friends gathered right here – it radiates. You show us that the pleasures of connection and understanding deepen with time.
  4.  **‘It is not far removed from death.’** And here, Cato, and Cicero writing his words, give us their most profound answer. They argue that a life well-lived, rich in virtue and accomplishment, renders the end not a terror, but a natural completion. Death matters less if the life preceding it had meaning.

  **(Pause, shift tone slightly – more reflective, respectful)**

  "Now, rereading that book this week, knowing Cicero penned this serene meditation on embracing age and meeting death without fear *barely a year* before Mark Antony’s assassins found him… that knowledge sits heavy. It’s an impossible irony. The man arguing so eloquently *against* the fear of death met a violent end.

  "But Grandpa, I don’t think that irony diminishes Cicero’s argument. If anything, knowing his fate *underscores* the courage of his philosophy – and more importantly, the power of *your* embrace of it. Cicero wrote ideals in the shadow of chaos. You, Grandpa, have *lived* them. You haven’t just quoted Cato’s calm rationale about death from the safety of a classroom; you’ve demonstrated that profound acceptance through your character, your resilience, your humor, and the deep, unwavering love you’ve built this family upon.

  "You’ve shown us, day in and day out for 90 years, what it truly means to answer those four complaints not just with words, but with action. Your life *is* the rebuttal. You turned the theoretical ‘De Senectute’ into a lived ‘De Vita Bene Actā’ – ‘On the Life Well Lived.’

  "So tonight, we’re not celebrating just longevity, but a specific kind of life: one rich in purpose, intellect, love, and an unwavering spirit that finds joy and meaning in every stage, just as your old friend Cicero urged. You’ve taught generations – in classrooms and around our own dinner table – that age isn’t about loss, but about the profound depth and beauty found in a life fully engaged, right up to the very end.

  "Grandpa, you are our Cato. You are the living proof of the philosophy you cherished. Thank you for teaching us, not just Latin, but how to live – and how to age – with such grace, wisdom, and undimmed fire.

  "To Grandpa – *Ad multos annos!* May we all strive to live the argument as well as you have. To 90 years of a life magnificently lived!"

  **(Raise glass high, make strong eye contact with Grandpa, smile)**

  **Why this works:**

  1.  **Honors His Passion:** Directly addresses *De Senectute* and its importance to him.
  2.  **Uses the Structure:** Clearly outlines the four complaints and Cato's rebuttals, framing them as the core of the toast.
  3.  **Acknowledges the Irony:** Doesn't shy away from Cicero's fate, but frames it respectfully ("sits heavy," "impossible irony").
  4.  **Refocuses on *Him*:** The key pivot: "You, Grandpa, have *lived* them." It shifts from Cicero's tragic end to Grandpa's successful embodiment of the philosophy. It makes Cicero's fate a *contrast* highlighting Grandpa's triumph in living the ideals.
  5.  **Connects to His Life:** Uses specific examples (students, recent fall, his character, building the family) to show *how* he embodies each rebuttal.
  6.  **Celebrates, Doesn't Mourn:** The overall tone is celebratory and admiring. The mention of death serves to highlight the strength of his life and philosophy, not to dwell on mortality. The final paragraphs are pure celebration of *his* 90 years.
  7.  **Respects the Audience:** Acknowledges the former students and the depth of understanding in the room. Uses Latin appropriately (*Ad multos annos!*).
  8.  **Personal & Loving:** The "Thank you" and "You are our Cato" lines are deeply personal and affirming.
  9.  **Manages Time:** Structured paragraphs should fit comfortably into 5 minutes, allowing for pauses and emphasis.

  **Delivery Tips:**

  *   **Speak to Him:** Make eye contact with your Grandpa often, especially during the parts directly about him.
  *   **Pace Yourself:** Don't rush the Latin terms or the philosophical points. Pause after the four complaints and after acknowledging Cicero's death.
  *   **Warmth & Conviction:** Let your love and admiration for him show in your voice. Deliver the final paragraphs with strong, celebratory conviction.
  *   **The Latin:** Pronounce *"Ad multos annos!"* clearly (Ahd MOOL-tohs AHN-nohs). It means "To many years!" and is a perfect, traditional touch for this context.

  This toast meets your grandpa on his own intellectual ground, honors his life's work and philosophy, handles the difficult context with honesty and respect, and ultimately delivers a powerful celebration of *him* and the life he's built – exactly what a 90th birthday deserves. Good luck! He'll be deeply touched.
