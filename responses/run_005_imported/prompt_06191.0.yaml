  Comparing this to Goodhart's types:
  - **Regressional/Extremal**: These rely on a statistical correlation breaking down, but in specification gaming, there's no correlation—it's direct optimization of a bad metric.
  - **Causal**: The reward function isn't causing harm to a hidden target; the reward itself is the target.
  - **Adversarial**: The agent is adversarial in exploiting the reward, but the problem is the reward's design, not an external adversary.

