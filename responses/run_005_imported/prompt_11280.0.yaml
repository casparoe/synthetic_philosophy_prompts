  I should consider ADHD challenges: executive dysfunction affects time management, memory, and impulse control. Forgetting birthdays or money isn't malice, but the brother can use strategies to mitigate these issues. He needs to show effort, like setting reminders or using apps. The user's role is to set boundaries without enabling helplessness.

  The user's current approach of pre-forgiving feels like giving up, leading to detachment. That's harmful long-term. They need mutual respect. The brother must acknowledge the impact of his actions, even if unintentional. Apologies and efforts to improve are crucial.

  Boundaries are essential. The user can express needs clearly: "I need you to set reminders for plans" instead of "stop flaking." Concrete requests help. Also, consequences like not lending money if he doesn't repay previous debts. Boundaries protect the user without being punitive.

  Communication strategies: Use "I" statements to avoid blame. Schedule talks during calm moments. Focus on specific behaviors, not character. The user should express how actions affect them, not diagnose ADHD issues.

  Compromise is key. Maybe the brother sets multiple alarms for plans. The user accepts some last-minute changes but not all. They meet in environments with fewer distractions. Shared calendars for birthdays. The brother takes initiative in suggesting solutions.

  The user's deeper needs: feeling valued, respected, and having a reciprocal relationship. They want their brother to try, not just excuses. It's about balancing compassion with self-respect. The brother's effort, not perfection, matters.

