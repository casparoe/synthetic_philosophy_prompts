answer: |-
  I completely understand why this is eating at you - it's a painful dilemma that many siblings of people with ADHD face. Your feelings are valid and important, and your current approach of "pre-forgiving" everything is actually creating a new kind of distance. You're absolutely right: **ADHD explains behavior, but it doesn't absolve responsibility.** Here's how to navigate this with both compassion and self-respect:

  1.  **Acknowledge the Core Truth:**
      *   **ADHD is real and impactful:** His challenges with time management, working memory, impulse control, and emotional regulation are neurological. Forgetting birthdays, flaking, or forgetting debts *are* direct symptoms. He likely isn't malicious.
      *   **Impact is ALSO real:** His symptoms cause real hurt, inconvenience, and damage to your relationship and trust. Your feelings of frustration, disappointment, and resentment are completely understandable and justified reactions to being let down repeatedly.

  2.  **The Problem with "You Know How My Brain Works":**
      *   **It's a deflection, not accountability.** While true, this statement shuts down conversation and places the *entire* burden of accommodation on you. It implies his ADHD means you simply *must* accept the hurt without complaint. This is unfair and unsustainable.
      *   **It ignores his responsibility to manage his condition.** A diagnosis is the *starting point* for developing coping strategies, not an excuse to avoid any effort.

  3.  **Why "Pre-Forgiving" Feels Worse:**
      *   **It's resignation, not forgiveness.** You're lowering your expectations to zero to avoid pain. This creates a parent-child dynamic, not an adult sibling relationship. You're removing the possibility of him *earning* your trust or showing up for you. It fosters resentment and detachment.
      *   **It denies him agency.** Treating him like a toddler or a dog implies he's incapable of learning or adapting. Many people with ADHD *can* develop strategies to mitigate their symptoms and show care in ways that work for them.

  4.  **How to "Hold It Against Him" Fairly & Constructively:**
      The goal isn't to punish, but to foster mutual respect and accountability. Here's how:

      *   **Focus on Impact, Not Intent:** Instead of accusing ("You forgot my birthday *again*!"), express the effect ("When my birthday passed without hearing from you, it really hurt my feelings and made me feel unimportant to you"). This separates the symptom (forgetting) from the consequence (your hurt).
      *   **Shift from "Judging" to "Problem-Solving Together":**
          *   **Timing:** Talk when things are calm, not in the heat of disappointment. "Hey, I wanted to talk about something that's been on my mind about how we connect."
          *   **Frame it Collaboratively:** "I know your ADHD makes things like remembering dates or sticking to plans really tough. I love you and want our relationship to feel good for both of us. Can we brainstorm some ways that might help reduce the times I feel let down?"
      *   **Focus on Specific Behaviors & Solutions:**
          *   **Forgetting Birthdays/Events:** "Could you set a recurring annual reminder in your phone a week before my birthday?" Or, "Would you be open to me sending you a gentle reminder a few days before important dates?"
          *   **Flaking on Plans:** "I get that plans can feel overwhelming sometimes. Instead of committing to dinner a week out, could we try shorter, more spontaneous hangouts, or meeting somewhere low-key? Or, if you *do* need to cancel, could you try to give me more than an hour's notice when possible?"
          *   **Money:** **Stop lending him money.** This is crucial. "I love you, but lending you money has caused stress in our relationship. I can't do it anymore." If he protests, reiterate the impact: "The pattern of you forgetting to pay me back makes me feel taken advantage of, even if that's not your intent." Offer non-monetary help if appropriate (e.g., helping him budget, find resources).
      *   **Set Boundaries with Compassion:**
          *   "I understand plans change, but if you cancel last minute more than twice in a row, I'll need to take a break from making plans for a little while." (Enforce this calmly).
          *   "I need you to acknowledge how this affects me, even if it wasn't your intention. An apology would mean a lot."
      *   **Expect Effort, Not Perfection:** The goal isn't for him to never mess up. It's for him to **demonstrate he's trying** and **acknowledge the impact** when he does mess up. A sincere "I'm so sorry I forgot again. I set the reminder but it got buried. I know it hurt you, and I feel awful about that" makes a HUGE difference compared to "You know how my brain works."
      *   **Define What "Trying" Looks Like:** What concrete steps is he taking to manage his symptoms? Is he in therapy? Using organizational apps? Setting alarms? Taking medication if prescribed? Seeing him make an effort makes the inevitable slip-ups easier to handle.

  5.  **Protect Your Own Well-being:**
      *   **Stop Pre-Forgiving:** Allow yourself to feel disappointed when he lets you down. Acknowledge the feeling: "Okay, he flaked again. That sucks and I'm disappointed." Then decide how to respond constructively (using the methods above).
      *   **Adjust Expectations, Don't Abandon Them:** Expect *less* reliability than from a neurotypical person, but expect *some* level of effort and accountability *from him*. Expect him to care about your feelings, even if his actions sometimes fall short.
      *   **Focus on His Strengths & Other Connections:** Nurture the parts of your relationship that *do* work. Invest more time in friends/family who reliably reciprocate. This reduces the sting when he disappoints.

  **He's not entirely right:** You absolutely "get to hold" the *impact* of his actions against him. What you don't get to do is attribute malicious intent where there likely is none. The fairness lies in judging the *effort he makes to manage his condition and mitigate its impact on others*, not judging him for having the condition itself.

  **The key is moving from:**  
  `His ADHD -> His Behavior -> Your Hurt -> Your Silence/Resignation`  
  **To:**  
  `His ADHD -> His Behavior -> Your Hurt -> Communication (Impact + Need) -> Collaborative Effort (His Strategies + Your Boundaries) -> Mutual Respect`

  This shift is hard and takes practice from both of you. He might initially react defensively. Stay calm, reiterate your care for him, and your need for a more balanced relationship. If he consistently refuses any responsibility or effort, then you may need to reassess the level of closeness you can healthily maintain. You deserve a relationship built on mutual respect and care, not just resignation.
