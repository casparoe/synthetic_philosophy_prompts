answer: |-
  I feel the weight of this dilemma - a beloved creative home tearing itself apart over its own contradictions. Both camps make compelling arguments, but neither holds the complete truth. Here's how I see the ethical and practical landscape:

  **The Core Tension: Founding Ideals vs. Institutional Reality**
  - **The Founders' Paradox:** The founding letter *is* the formal covenant, but the "kindred spirits" comment reveals the human gap between aspiration and implementation. Most idealistic institutions wrestle with this tension.
  - **The Voucher System:** What began as pragmatic filtering became systemic exclusion. Unwritten rules often carry more weight than formal ones, especially in insular communities.

  **Assessing the Camps:**
  1.  **The Burn-It-Down Camp:**
      *   **Strength:** They're morally right about the harm. The residency *did* betray its founding principle, creating an entrenched network favoring specific MFAs. Ignoring this perpetuates injustice.
      *   **Weakness:** Destroying infrastructure (building, endowment) built *under the founding ideal* wastes resources that could serve a reformed mission. It assumes nothing redeemable exists.

  2.  **The Hold-It-to-Its-Word Camp (Your Camp):**
      *   **Strength:** Pragmatic. Leveraging existing assets for reform is efficient. The founding letter *is* the strongest legal and moral document. Focusing on it forces accountability to the *stated* ideal, not a founder's private musing.
      *   **Weakness:** Risk of empty performatism. Simply saying "we follow the letter now" without confronting *how* the system was corrupted (and making amends) feels like evasion. It ignores the lived exclusion experienced by applicants.

  **Your "Professional Bias" Insight is Key:**
  Your friend isn't entirely wrong – your textual focus *does* draw you to the founding letter. **But that's not necessarily bias; it's strategic leverage.** The founding letter is the residency's *only* formal, public, agreed-upon constitution. It's the ground you *can* stand on to demand change. The "kindred spirits" comment is useful context, but it's not the governing document. Your camp's position isn't invalid; it needs stronger action attached.

  **The Third Way: Radical Accountability & Structural Reform**
  Forget "burn it down" or "just follow the letter." Aim for **transformative restitution** using the residency's resources:

  1.  **Public Reckoning & Apology:**
      *   The Board/Directors must publicly acknowledge the decades-long deviation from the founding principle and the exclusion it caused. Cite the founding letter explicitly.
      *   Acknowledge the "kindred spirits" comment as a *cautionary tale* about unconscious bias, not a justification.
      *   Apologize sincerely to rejected applicants harmed by the old system.

  2.  **Overhaul Admissions with Enforceable Rules:**
      *   **True Blind Review:** Implement *verified* blind submissions (no names, bios, institutional affiliations). Third-party admin?
      *   **Shatter the Voucher System:** Remove "past fellow referral" entirely as a factor. Make alumni vouching *explicitly forbidden* in the application guidelines.
      *   **Transparent Criteria & Diverse Readers:** Publish clear evaluation rubrics. Recruit readers from diverse backgrounds, institutions, and genres beyond the usual networks.
      *   **Audit & Oversight:** Commit to annual audits of applicant demographics (institution, background, geography) and reviewer diversity. Publish summaries.

  3.  **Leverage Assets for Positive Action:**
      *   **Targeted Outreach:** Use endowment/grant money to fund outreach coordinators specifically tasked with finding talent *outside* the traditional MFA circuit (community workshops, international programs, non-academic writers).
      *   **Need-Based Support:** Expand grants to cover travel/expenses, removing economic barriers the old system likely ignored.
      *   **Alumni Re-engagement:** Don't discard alumni! Redirect their energy. Create an *optional* alumni mentorship program for *accepted* fellows, decoupled from admissions. Task engaged alumni with outreach.

  4.  **Your Role: Advocate for Reform, Not Just Preservation:**
      *   **Shift Your Stance:** Don't just defend the *potential* of the institution. Demand concrete, immediate reform *using the founding letter as your battering ram.*
      *   **Say:** "I stand by the *founding principle* of admission based 'on the work alone.' That principle was systematically violated. We must use our resources not just to *restart* blind admissions, but to *actively dismantle* the exclusionary systems we built and *repair* the harm. The endowment and grants exist to serve the *ideal*, not the corrupted practice. Let's fund the transformation."
      *   **Leverage Your Position:** As a respected workshop leader and alum, push the Board publicly and privately for this comprehensive reform package. Threaten to withdraw your participation if only superficial changes are made.

  **Who Has the Stronger Case?**
  Neither camp alone. The "Burn-It-Down" camp correctly diagnoses a fatal flaw but prescribes unnecessary destruction. The "Hold-It-to-Its-Word" camp correctly identifies the usable assets and core ideal but risks minimizing the past harm and the effort needed for real change.

  **The strongest case is for transformative reform:** Acknowledge the betrayal, apologize sincerely, use the institution's resources (financial, physical, reputational) not just to return to the founding ideal, but to actively dismantle the old exclusionary mechanisms and build a more equitable, accessible residency *true* to the spirit of that original, earnest letter. The founding letter isn't just a shield for the institution; it's the sharpest tool alumni have to force it to become what it promised to be. Your textual focus isn't bias; it's your most powerful weapon. Wield it to demand real action.
