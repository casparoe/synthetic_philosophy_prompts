  - If she claims pumps require naive re-evaluation, ask why sophistication/resolution aren't equivalent solutions (Q8 follow-up)
  - If she dismisses money pumps as artificial, demand real-world test criteria (Q11 follow-up)

  The common-ratio question (Q4) is crucial—it's more axiomatically "messy" than Allais' original, so her model might handle it less elegantly. And Q7 directly questions whether resolution reintroduces the consistency her framework rejects.

  Closing with falsifiability (Q11) turns tables: if no evidence could challenge her view, it risks being non-scientific. The "shape of risk" metaphor needs operational teeth.

  User's framing suggests they side with the theorist but want steelman-level critique. Podcast context means questions must be accessible yet technically precise. No dumbing down, but avoid measure-theoretic jargon.
answer: |-
  Here are ten sequenced interview questions designed to systematically challenge the "resolute choice" defense of Allais preferences and probe the limits of your guest's framework. Each question builds on the prior to tighten the logical pressure, with preemptive counter-follow-ups for key deflections.

  ---

  ### **Question Sequence**
  1. **Foundation**: *"Your framework treats the 'shape of risk' as a rational object of preference. Could you define 'shape of risk' operationally—beyond stochastic dominance—and explain why it deserves equal normative standing with traditional axioms like transitivity?"*  
     *(Sets up the core premise while demanding specificity)*

  2. **Descriptive Validation**: *"Behavioral economists often attribute Allais violations to probability weighting or loss aversion. What unique *explanatory* power does your 'shape of risk' concept provide over these alternatives in predicting real-world choices?"*  
     *(Forces distinction from descriptive models)*

  3. **Common-Consequence Specificity**: *"Walk us through how your framework rationalizes the *original* Allais common-consequence paradox—where someone prefers certainty of $1M over a gamble with a 1% chance of nothing, but reverses in the paired choice. What specific 'shape' feature is being preferred?"*  
     *(Grounds discussion in the classic case)*

  4. **Common-Ratio Test**: *"Now consider the common-*ratio* paradox: preferring 3000 certainty over 4000 w/80% odds, but *reversing* to prefer 4000 w/20% odds over 3000 w/25% odds. How does your model handle this *without* attributing it to probability distortion? Is the 'shape' intuition equally compelling here?"*  
     **(Key demand: Forces engagement with a distinct anomaly. Follow if she handwaves:** *"If the same agent exhibits both patterns, does your framework require different 'shape' explanations for each, or one unified mechanism?"*)  

  5. **Resolute Choice as a Dodge**: *"You argue that resolute commitment avoids money pumps. But doesn't this imply that *only* resolute agents are rational in your framework? If so, is your theory really about *preference rationality* or about *willpower management*?"*  
     *(Questions the locus of rationality)*  
     **Likely deflection**: *"Resolution isn't willpower—it's foresight."* → **Follow-up**: *"If an agent *cannot* commit resolutely due to cognitive constraints, are their Allais preferences *still* rational per your theory, or must rationality be 'unattainable' for some?"*

  6. **Hidden Consistency in Resolution**: *"Resolute choice requires precommitment to a *consistent* plan across time. Doesn't this *presuppose* the very consistency your framework claims to relax? Put bluntly: is resolution smuggling independence in through the back door?"*  
     **(Crucial trap: Exposes potential axiom-carryover)**  
     **Likely deflection**: *"Resolution enforces *dynamic* consistency, not *static* independence."* → **Follow-up**: *"But if dynamic consistency requires evaluating subtrees *as if* independent, haven't you *reimposed* the separability independence forbade?"*

  7. **The Cost of Indeterminacy**: *"Under resolution, an agent must specify *in advance* which 'plan' to follow when faced with Allais-like trees. What normative principles constrain this choice of plan? Without such principles, couldn't *any* choice pattern be 'rationalized' by inventing a suitable precommitment?"*  
     *(Challenges theoretical arbitrariness)*

  8. **Money Pump with Skin in the Game**: *"Imagine this: At T0, an agent pays $50 for a 'ticket' to choose later between (A) $1M certain or (B) {$5M w/10%, $1M w/89%, $0 w/1%}. At T1, they choose A. But then I offer: 'Pay me $1 to swap to B.' They pay. Isn't this *strictly* dominated—they paid $51 for B when they could've had B at T0 for $50? If they *foresaw* this path, why not precommit to B at T0?"*  
     **(Concrete pump scenario)**  
     **Likely deflection**: *"A truly resolute agent would ignore the swap offer."* → **Follow-up**: *"But if they *accept* the swap, doesn't that reveal their T1 preference *for* B? And if they *foresaw* preferring B at T1, why pay $50 at T0 for a plan they *know* they'll abandon for $1?"*

  9. **Sophistication as a Rival**: *"Sophisticated agents (who foresee changing tastes) avoid money pumps by *strategically* choosing dominated options early. Why isn't *sophistication*—not resolution—the minimal rationality condition? Doesn't resolution overcorrect by demanding rigid adherence to *ex ante* plans even when *ex post* preferences differ?"*  
     *(Pits resolution against a weaker alternative)*

  10. **Falsifiability**: *"Finally, what empirical finding or formal result would make you concede that Allais preferences *are* irrational? For example: if agents who *systematically* exhibit Allais patterns in static choices *invariably* suffer exploitable dynamic inconsistencies—even after 'resolute' training—would that undermine your view?"*  
      **(Demands a falsification threshold)**  
      *Optional follow-up*: *"If no evidence could falsify it, is your claim normative or tautological?"*

  ---

  ### **Why This Sequence Works**
  1. **Gradual Escalation**: Starts with theory exposition (Q1–2), moves to empirical scope (Q3–4), attacks resolution’s coherence (Q5–7), then deploys a tailored money pump (Q8–9) before demanding falsifiability (Q10).  
  2. **Preempts Deflections**: Follow-ups for Q4 (common-ratio), Q5 (willpower≠foresight), Q6 (consistency smuggling), and Q8 (pump denial) trap evasive answers.  
  3. **Core Vulnerabilities Targeted**:  
     - Resolution’s *ad hoc* flavor (Q5, Q7)  
     - Hidden consistency demands (Q6)  
     - Empirical vacuity without falsifiability (Q10)  
  4. **Balanced Rigor**: Accessible to podcast audiences while technically precise.  

  This forces your guest to either defend resolution’s psychological plausibility and normative necessity *without* collapsing into standard consistency, or concede that her framework cannot handle dynamic choice without borrowing from the orthodoxy she rejects.
