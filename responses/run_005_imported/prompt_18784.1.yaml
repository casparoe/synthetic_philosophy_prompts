  My cousin refuses to register as an organ donor and it's become a whole thing at family dinners. Her argument is that 'brain dead' isnt the same as actually dead -- she read that some brain-dead patients keep regulating their own hormones, healing wounds, or even carrying a pregnancy for months, and she thinks that means declaring someone dead once their brain stops is more of a convenient legal line doctors drew so transplants can happen, not a discovery about when a person actually dies. I keep telling her a beating heart hooked up to a machine doesn't mean someone's alive, but honestly the pregnancy thing kind of got me too. Is she onto something real here, or is she just letting a scary internet fact talk her out of a good decision?
