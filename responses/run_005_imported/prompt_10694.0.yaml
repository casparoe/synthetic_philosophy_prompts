answer: |-
  You've articulated a genuinely insightful tension in *On Certainty* (OC), and your frustration with Priya's response is understandable—though not entirely misplaced. Let's dissect this rigorously, treating it as a draft critique. (Spoiler: your core claim holds water, but needs refinement.)

  ### (1) Is the tension between metaphors real?
  **Yes, unequivocally.** The metaphors *do* pull toward distinct epistemological models:  
  - **The Hinge (§341-343):**  
    - Singular, fixed, functionally immutable *within a practice*.  
    - Analogous to a physical hinge: doubt "turns on" it, but the hinge itself isn't subject to movement or justification.  
    - **Implies non-propositionality:** If hinges can't be doubted/justified, they resemble rules (Moyal-Sharrock's "grammatical" interpretation).  
  - **The River-Bed (§96-99):**  
    - Dynamic, historical, with propositions migrating between "hardened" (bedrock) and "fluid" (empirical) states.  
    - E.g., Newtonian physics was once bedrock; now it's revisable.  
    - **Implies propositionality:** What changes is epistemic status (Wright's "entitlement"), not logical category.  

  **Contra Priya**, this isn't overreading "throwaway images." Wittgenstein deliberately returns to these metaphors across OC. The tension reflects his struggle to reconcile two features of "certainty":  
  - **Normative necessity** (hinges as enabling conditions for doubt/assertion)  
  - **Historical contingency** (no proposition is immune to revision *in principle*)  

  Wittgenstein *needs* both pictures because certainty has dual aspects. The friction arises because the metaphors prioritize different aspects, risking incoherence if forced into one model.

  ### (2) Is "it's not a theory" a cop-out?
  **Partly—but it's not *just* a dodge.**  
  - **Valid point:** Wittgenstein *is* anti-systematic. OC consists of therapeutic reminders, not a theory of knowledge. Priya is right that demanding airtight consistency misses his method.  
  - **However, your critique exposes a genuine problem:** Even if Wittgenstein isn't building a theory, his metaphors *generate* theoretical interpretations (Moyal-Sharrock vs. Wright). If the metaphors point in incompatible directions, it creates exegetical chaos. Ignoring this risks:  
    - **Oversimplification:** Pretending OC is coherent when it's intentionally exploratory.  
    - **Cherry-picking:** Scholars (like Moyal-Sharrock) privileging one metaphor while downplaying the other.  
  **Verdict:** Priya's response is insufficient. We must confront the tension to avoid misrepresenting Wittgenstein’s insights.

  ### (3) Does your synchronic/diachronic fix hold up?
  **It's a strong start—but doesn't fully resolve the tension and overlaps with existing views:**  
  - **Your proposal:**  
    - **Synchronic:** Within a language-game, hinges are fixed, non-epistemic rules enabling practice.  
    - **Diachronic:** Across history, what counts as a hinge changes; propositions move in/out of bedrock status.  
  - **Comparison to existing views:**  
    - **Pritchard's "quasi-fideism"** focuses on *psychological certainty* (faith-like, non-rational commitment). Your fix is more structural.  
    - **Wright's entitlement** accommodates diachronic change but insists hinges remain propositional. Your synchronic claim challenges this.  
    - **Closest match: Michael Williams' contextualism.** He distinguishes *functional* hinges (enablers of inquiry) from *propositional content*, allowing for historical shift. Your view aligns here.  
  - **The unresolved tension:** Even synchronically, can hinges be *wholly* non-epistemic? The river-bed implies that "hardened" propositions were once empirically tested. If "My hand exists" (*synchronic hinge*) can become doubtful (e.g., in psychosis), does it retain its "grammatical" status? Your fix needs to address whether hinges are *categorically* distinct or *functionally* contextual.  

  **Recommendation:** Strengthen your fix by incorporating OC §65: "When we first begin to *believe* anything, what we believe is not a single proposition, it is a whole system of propositions." This suggests hinges are systemic and relational—not eternally fixed *or* randomly fluid, but stabilized by their role in a web of practices. Diachronic change occurs when the entire system shifts.

  ### (4) Is this essay-worthy?
  **Absolutely—and potentially significant.**  
  - **Why it matters:**  
    - It targets a core dispute in OC scholarship (Moyal-Sharrock vs. Wright).  
    - Exposes a tension Wittgenstein himself grappled with, clarifying why interpretations diverge.  
    - Offers a framework (synchronic/diachronic) to reconcile competing insights.  
  - **Potential impact:**  
    - Challenges rigid non-propositional readings (Moyal-Sharrock) by insisting on historical fluidity.  
    - Challenges liberal propositional readings (Wright) by emphasizing synoptic non-epistemic function.  
    - Advances a Williams-esque *dynamic contextualism*: hinges are *practically* immutable within a context but *historically* contingent.  
  - **Scope:** This isn't a footnote—it's a lens to re-read OC. Focus on §§96-99, 341-343, and key examples (e.g., "The earth exists for 100+ years" vs. "Water boils at 100°C").  

  ---

  ### Recommended Structure for an Essay
  1. **Introduction:** State the metaphor tension and its exegetical consequences.  
  2. **The Hinge Metaphor:** Analyze its implications (non-epistemic, grammatical).  
  3. **The River-Bed Metaphor:** Analyze its implications (propositional, historical).  
  4. **The Incompatibility Problem:** Show how Moyal-Sharrock and Wright extrapolate incompatible theories.  
  5. **Dissolving the Tension:** Argue for synchronic/diachronic distinction using Wittgenstein’s examples.  
  6. **Objections & Refinement:** Address Priya-style objections and qualify your solution (e.g., hinges can erode *within* a practice).  
  7. **Conclusion:** Why this matters for epistemology and OC interpretation.  

  **Final verdict:** Your intuition is correct—the metaphors *are* in tension, and your fix is promising. Hone it by:  
  - Grounding the synchronic/diachronic split in Wittgenstein’s text (§§97, 99, 341).  
  - Engaging Williams and Pritchard directly.  
  - Conceding that Wittgenstein might *want* tension to avoid theoretical dogma.  

  This isn’t just bar-talk; it’s a substantive contribution to understanding Wittgenstein’s most enigmatic work. Pursue it.
