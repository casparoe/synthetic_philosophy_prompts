  I should clarify the philosophical tests without jargon. Use analogies like the "heap of sand" or "statue vs. clay" to illustrate ontological disagreements. Emphasize that the novelist decides the metaphysics of their world. Sider's joint-carving adds a layer: even if terms vary, reality has a structure. But the author chooses if their world has such a structure for social objects.

