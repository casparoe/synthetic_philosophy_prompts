prompt: |-
  I sit on the grants committee of a small foundation that funds unconventional, high-uncertainty research bets. We are, for better or worse, the kind of organization that asks applicants for explicit credence intervals rather than mission statements, and that reviews every major funding recommendation against subsequent outcomes each quarter. An old friend from a university reading group -- we used to spend hours arguing about Robin Hanson's and Eliezer Yudkowsky's exchanges on when it is rational to defer to a group's judgment over your own -- now serves on the committee with me, and this case has revived that argument in a far less abstract form than either of us expected.

  Here is the situation. One of our most senior evaluators is recommending a three-year renewal for a grant supporting pandemic early-warning systems, a program she has championed since the foundation's founding. Our latest retrospective, however, shows that her recommendations specifically within this cause area have been substantially overconfident relative to outcomes, even though her track record everywhere else in the portfolio remains excellent. She has read the retrospective, accepts its methodology, has gone back and independently re-derived her assessment while explicitly checking herself for the exact biases it identifies, and still, on reflection, believes this grant is an outstanding bet -- for reasons she can articulate that are not simply a restatement of the judgment the retrospective flagged as unreliable. The committee has split down the middle: half want a standing rule that mechanically discounts any evaluator's credence toward the portfolio baseline whenever this kind of documented miscalibration exists, on the grounds that anything else means ignoring evidence we spent real money to collect; the other half think such a rule would have vetoed several of our best historical bets, all of which came from evaluators who held firm against the aggregate numbers, and worry that it effectively asks her to defer to a statistic rather than to any actual counter-argument.

  Could you draft the short memo I will bring to Thursday's meeting, when a decision has to be made or the earmarked funds revert to the general pool at quarter's end? I need one specific recommendation for this grant -- fund it as proposed, decline it, or some conditional middle path -- rather than a survey of the considerations, and I would like the memo to explain why a reflective, well-informed disagreement like hers is even a coherent position to hold, rather than simply asserting that she should either trust the retrospective or trust her gut. Whatever it recommends, the memo needs to engage honestly with the strongest version of whichever side it doesn't choose: a couple of committee members have made clear they will only be moved by an argument that has clearly grappled with the case against it.
reasoning: |-
  We are faced with a decision on whether to renew a grant for a pandemic early-warning system, championed by a senior evaluator with an otherwise excellent track record but a documented history of overconfidence in this specific cause area. The committee is split between two approaches: mechanically adjusting credences based on the retrospective data versus respecting the evaluator's reasoned judgment despite the data. 

  After careful consideration, I recommend funding the grant as proposed for the full three-year term, but with the following condition: that we require quarterly updates (rather than the standard annual reports) for this grant, with the explicit purpose of conducting an interim review at the 18-month mark to reassess the project's progress against the evaluator's current credence intervals. This interim review will be conducted by the full committee, including the senior evaluator, and will use the same retrospective methodology we have developed to check for calibration. If at that point the project is found to be performing within the adjusted (portfolio-baseline) confidence intervals, the grant continues without further conditions. If it is found to be underperforming relative to those adjusted intervals, we reserve the right to reduce the remaining funding by up to 50% and reallocate it to other projects in the portfolio.

  **Why this recommendation?**
  1. **Respecting the evaluator's expertise and reasoned judgment**: The senior evaluator has an outstanding record outside this cause area and has engaged deeply with the retrospective, re-examining her assessment for the identified biases. Her reasons for supporting this grant are articulated and go beyond the judgment that was flagged. We have a history of successful bets that came from evaluators who held firm against aggregate statistics. A mechanical rule that overrides her judgment without engaging with her specific arguments risks discarding valuable insights that the retrospective data might not capture (e.g., context-specific factors, recent developments, or unique aspects of this project).

  2. **Acknowledging the retrospective evidence**: The retrospective data is valuable and should not be ignored. However, it is not an infallible oracle. The data shows a pattern of overconfidence in this cause area, but it does not prove that every judgment in this area is necessarily overconfident. The condition we impose (quarterly updates and an 18-month review) ensures that we are not ignoring the evidence but rather using it to structure a more rigorous and timely evaluation. This approach allows us to test the evaluator's current judgment against new data in a time frame that minimizes the risk of substantial wasted funds.

  3. **A coherent position for reflective disagreement**: It is coherent for the evaluator to hold her position because:
     - **Base rates are not destiny**: While the retrospective shows a pattern, it does not eliminate the possibility that this particular case is an exception. Her re-evaluation, which explicitly addressed the biases, might have corrected for the past errors.
     - **The data is retrospective, not predictive in real-time**: The retrospective analysis is based on past judgments, but the current judgment has been made with the benefit of knowing that history and adjusting for it. This is a new judgment, not the same as the ones in the retrospective.
     - **The nature of high-uncertainty research**: In high-uncertainty domains, past miscalibration might reflect the inherent difficulty of the domain rather than a persistent flaw in the evaluator. If the domain has evolved (e.g., new data sources, improved models), then past miscalibration may not apply.

  **Engaging with the opposing view**:
  The strongest argument against funding without adjustment is that we have spent real money to collect evidence of systematic overconfidence in this evaluator's judgments in this cause area. Ignoring that evidence is equivalent to wasting that investment and potentially repeating the same error. By not applying a mechanical adjustment, we are effectively saying that we trust this evaluator's gut over the data. This could set a precedent that undermines our commitment to evidence-based decision-making.

  We address this by:
  - **Conditional funding**: We are not ignoring the data. We are using it to justify increased scrutiny and a shorter review cycle. This is a middle path that respects both the data and the evaluator's judgment.
  - **Creating a clear off-ramp**: The 18-month review, using our standard retrospective methodology, allows us to course-correct early if the overconfidence pattern reemerges. This reduces the financial risk relative to a full three-year commitment without conditions.
  - **Preserving optionality**: If the project shows promise at 18 months, we continue funding. If not, we can redirect funds to other projects, thereby limiting the downside while preserving the upside.

  This approach also avoids the rigidity of a standing rule that would mechanically discount all such judgments. Such a rule, while appealing for its simplicity, would have vetoed some of our best historical bets and might discourage evaluators from developing deep expertise in high-uncertainty domains where early judgments are often miscalibrated.

  In summary, we fund the grant because the evaluator's reasoned judgment, after reflection and with full knowledge of the retrospective, deserves our respect and a chance to prove itself. But we do so with heightened vigilance and a built-in mechanism to correct course if the pattern of overconfidence reemerges.

  Respectfully submitted,
  [Your Name]
answer: |-
  **MEMORANDUM**  
  To: Grants Committee  
  From: [Your Name]  
  Date: [Thursday's Meeting Date]  
  Subject: Recommendation for Pandemic Early-Warning Systems Grant Renewal  

  ### Recommendation  
  **Fund the grant as proposed for the full three-year term, conditional on the senior evaluator co-developing and committing to a formal, quantifiable "calibration adjustment" for her future credence intervals in this cause area, to be applied prospectively starting next quarter.** This adjustment will align her intervals with the foundation’s retrospective data (e.g., widening intervals by X% or shifting point estimates toward the portfolio baseline), while preserving her core judgment. Failure to agree to this adjustment by quarter-end will result in automatic reversion of funds.  

  ---

  ### Why This Position Is Coherent: The Case for Reflective Disagreement  
  The senior evaluator’s stance is defensible because **well-calibrated disagreement requires integrating two distinct evidential streams: aggregate base rates and case-specific nuance**. The retrospective identifies a *systematic* bias in her judgments within this domain, but it does not—and cannot—capture *why* this specific grant might defy that trend. Her re-evaluation, which acknowledges the bias and articulates novel, non-circular justifications (e.g., new data, evolving methodologies, or domain-specific shifts), constitutes **new information** the retrospective lacks. To ignore her updated assessment is to treat the retrospective as an immutable prior, negating the value of expertise and adaptive learning. In high-uncertainty research, base rates should inform—not override—expert judgment when:  
  1. **The expert demonstrably updates in light of counter-evidence** (as she did by re-examining her biases), and  
  2. **The case presents materially distinct factors** (e.g., technological advances or novel risk variables she cites).  

  This mirrors Hanson’s "expertise weighting" model: groups should defer to individuals when their local knowledge outweighs statistical noise. Here, her domain-specific insight warrants a conditional exception.  

  ---

  ### Engagement with the Strongest Counter-Argument  
  *The opposing view rightly argues: "Ignoring documented miscalibration wastes resources and undermines evidence-based governance. If we exempt her, why collect data at all?"* This is compelling. A standing rule to mechanically adjust credences would:  
  - **Prevent recurring errors** by internalizing hard-won lessons;  
  - **Uphold accountability** for consistent overconfidence;  
  - **Avoid ad hoc exceptions** that privilege seniority over data.  

  We agree this grant should not set a precedent for disregarding retrospectives. Hence, our recommendation **binds her future judgments to the data** via a formal adjustment. This respects the retrospective’s value while allowing her current bet to proceed based on her uniquely detailed defense. Crucially, it converts a one-time exemption into a structured learning opportunity: if her "outlier" judgment succeeds, it refines our understanding of when base rates fail; if it fails, it reinforces the adjustment’s necessity.  

  ---

  ### Why Not a Middle Path (e.g., Partial Funding)?  
  Compromises like one-year funding or reduced budgets:  
  - **Penalize high-variance bets disproportionately**, as short-term results may not reflect long-term potential;  
  - **Create perverse incentives** for evaluators to avoid ambitious projects;  
  - **Fail to resolve the core dilemma**—they still prioritize either data or judgment without integrating both.  
  Our solution imposes accountability (via future adjustments) while letting the current bet run.  

  ### Why Not Decline?  
  Declining would signal that retrospectives rigidly override expertise, discarding the possibility that her re-evaluation corrected past errors. Given her elite track record elsewhere and substantive defense, this risks false negatives—precisely what the dissenters fear would have vetoed historic wins.  

  ---  
  **Next Steps**:  
  1. Secure the evaluator’s written commitment to co-develop the calibration adjustment by quarter-end.  
  2. Proceed with full funding upon agreement; if not, funds revert to the general pool.  
  3. Document this decision as a bounded exception, not policy.  

  This approach honors our evidence-driven ethos while preserving the intellectual flexibility that fuels breakthrough bets.
