  The emotional core seems to be: how do you promise forever to someone who (according to Mara's own research) isn't a single enduring entity? That's actually beautiful—it turns abstract theory into a meditation on commitment. The humor should come from framing, not mocking the ideas. Maybe compare temporal parts to wedding cake slices? Physical enough for non-philosophers. 

