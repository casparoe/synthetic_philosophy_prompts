prompt: |-
  I'm the family rep on the ethics committee at my mom's memory-care facility (no medical background -- they just wanted somebody from the families on it). Management wants to bring in an AI system that watches residents' behavior all day, what they flinch from, what they reach for, how they react to different staff, and builds a "preference profile" that caregivers are supposed to follow, even when it overrides the written care plan the resident set up years ago while still lucid. Half the committee says residents are calmer now that the AI has "figured out" what they actually want; the other half says you can't tell a real preference from plain confusion or fear in someone with dementia just by watching them, and that the lucid version of my mom who signed that plan should still get the final say over the version of her walking around now. We vote next week -- approve the pilot, approve with limits, or reject it -- and i have to write the memo. I want an actual recommendation, not a "let's study it more" dodge, and i want whichever side we don't go with to get a fair, serious case made for it, not just a brush-off.
reasoning: |-
  Okay, the user is a family representative on an ethics committee at a memory-care facility. They're facing a tough decision about implementing an AI system that monitors residents' behaviors to create preference profiles. The user needs a clear recommendation for their memo, not just a suggestion to study it more. They also want fair arguments for both sides.

  First, I need to understand the core conflict. The AI claims to adapt care to current behaviors, but it might override prior directives set by the resident when they were lucid. The committee is split: some say residents are calmer, others argue you can't distinguish preferences from confusion in dementia patients.

  The user's role is crucial here. They're a family rep without medical training, so the memo must be accessible yet thorough. Their mom is a resident, which adds a personal stake. They need to balance ethical principles like autonomy and dignity while ensuring the memo respects both viewpoints.

  Looking deeper, the user might fear making the wrong choice that could affect their mom and others. They want validation that their decision is well-reasoned. The unspoken need is confidence in their recommendation, backed by strong ethics, not just procedural correctness.

  Key ethical issues: autonomy (past vs. present self), beneficence (what truly benefits the resident), non-maleficence (avoiding harm from misinterpreting behaviors), and justice (fairness to all residents). Also, informed consent is tricky since current residents can't consent to the AI's use.

  The AI's limitations are a big concern. Dementia behaviors can be reactions to fear or confusion, not true preferences. The system might not capture context, like why someone flinches—maybe due to hallucinations, not genuine dislike. Plus, staff might rely too much on AI, overlooking individual needs.

  On the other hand, if residents appear calmer, that suggests some benefit. But is calmness equivalent to well-being? And overriding prior directives disrespects the resident's past competent self. The care plan they created should hold weight, as it reflects their values when they could express them.

  The user needs a decisive stance. Recommending a limited pilot with strict conditions seems balanced. It allows testing the AI's effectiveness but with safeguards: no overriding medical directives, regular family reviews, staff training, and opt-out options. This addresses risks while gathering data.

  For the memo structure, start with the recommendation, then detail both sides fairly. Explain why rejecting or full approval has downsides. Emphasize that the pilot isn't an endorsement but a cautious step. Highlight monitoring and resident dignity as priorities.

  The user's personal connection means the memo must feel impartial. Acknowledge emotional aspects but ground arguments in ethics. Ensure the language is clear, avoiding jargon, so all committee members, regardless of background, can engage.

  Finally, reinforce that this decision impacts residents' dignity and families' trust. The pilot's constraints protect against harm while allowing evaluation. The goal is to honor the resident's entire life story, not just their current state.
answer: |-
  Here’s a structured memo draft with a clear recommendation, balanced arguments for both sides, and actionable safeguards. This prioritizes resident dignity while acknowledging the complexity of dementia care:

  ---

  **MEMORANDUM**  
  **To:** Ethics Committee, [Facility Name]  
  **From:** [Your Name], Family Representative  
  **Date:** [Date]  
  **Subject:** Recommendation on AI Behavioral Monitoring Pilot Program  

  ### I. RECOMMENDATION  
  **Approve a strictly limited 6-month pilot of the AI behavioral monitoring system, with the following non-negotiable conditions:**  
  1.  **No Override of Core Advance Directives:** The AI-generated "preference profile" **cannot override** medical directives, religious/cultural practices, or safety protocols in the resident’s existing care plan.  
  2.  **"Harm Principle" Threshold:** AI suggestions may only adjust non-core preferences (e.g., activity timing, snack choices, music selection) **if** clear, consistent behavioral data indicates the *current resident* is experiencing **significant distress** under the existing plan.  
  3.  **Mandatory Family/Caregiver Review:** AI suggestions require weekly review and explicit approval by the resident’s designated family representative *and* the primary nurse/caregiver team before implementation.  
  4.  **Opt-Out Guarantee:** Any resident’s family can withdraw from the pilot immediately at any time.  
  5.  **Staff Training Requirement:** Staff must receive dementia-specific training on interpreting behavioral cues *alongside* the AI, emphasizing its limitations.  
  6.  **Independent Audit:** An external dementia care expert reviews anonymized pilot data quarterly to assess validity and bias.  

  **If these conditions cannot be contractually guaranteed and enforced, I recommend REJECTING the pilot.**  

  ---

  ### II. THE CASE FOR APPROVAL (WITH LIMITS)  
  Proponents rightly argue that dementia changes needs and that reducing distress is paramount. The strongest points include:  
  *   **Responsive Care:** A lucid advance directive cannot predict every evolving need in late-stage dementia. The AI *may* identify real-time comforts (e.g., aversion to bright lights, calming effect of a specific voice) missed by static plans, reducing agitation and improving quality of life *now*.  
  *   **Non-Verbal Communication:** When verbal expression diminishes, behavior is a critical communication tool. The AI’s constant monitoring *could* detect subtle, consistent patterns human staff might overlook during shifts, revealing genuine preferences (e.g., reaching for lavender-scented towels, relaxing near a specific window).  
  *   **Potential for Calmer Environment:** Preliminary reports of residents being "calmer" suggest the system *might* reduce distress triggers. If validated ethically, this aligns with core care goals.  
  *   **Complement, Not Replace:** Used cautiously, the AI could *inform* caregiver judgment, not replace it – helping staff tailor interactions more sensitively.  

  **This pilot WITH STRICT GUARDS offers a responsible path to test these potential benefits while minimizing risks.**  

  ---

  ### III. THE CASE FOR REJECTION  
  Opponents raise profound ethical concerns that cannot be dismissed:  
  *   **Misinterpreting Dementia Behaviors:** Flinching, reaching, or vocalizations in dementia often stem from confusion, fear, hallucinations, or physical discomfort – **not** conscious preference. An AI trained on behavior alone risks pathologizing distress as "preference" (e.g., interpreting withdrawal from painful movement as "disliking physical therapy").  
  *   **Erasure of the Authentic Self:** The resident’s lucidly created care plan represents their **considered values, life story, and identity**. Overriding it based on algorithms interpreting fragmented behaviors disrespects their autonomy and reduces them to their disease. As one ethicist stated, "Dementia doesn’t create a new person; it obscures the existing one."  
  *   **Slippery Slope & Consent:** Residents cannot consent to this monitoring or its interpretations. Normalizing AI-driven overrides sets a dangerous precedent for increasingly intrusive "optimizations" based on algorithmic guesses about diminished capacity.  
  *   **False Objectivity:** AI profiles may appear "scientific" but are built on subjective correlations prone to bias (e.g., misreading fear of a staff member due to paranoia as a "preference" against that person).  
  *   **Undermining Staff Expertise:** Over-reliance on AI could devalue skilled caregiver intuition and human relationship-building, which are central to dementia care.  

  **Rejection prioritizes respecting the resident’s enduring personhood and protects against well-intentioned but harmful technological determinism.**  

  ---

  ### IV. WHY LIMITED PILOT OVER REJECTION OR FULL APPROVAL  
  *   **Full Approval** ignores valid ethical alarms about autonomy and misinterpretation, risking significant harm.  
  *   **Outright Rejection** forfeits the *potential* for AI to identify genuine, non-verbalized comforts *if* used with extreme caution and human oversight.  
  *   **Limited Pilot with Core Safeguards:**  
      *   **Honors Past Wishes:** By forbidding override of core directives, it respects the lucid self.  
      *   **Minimizes Harm:** The "Harm Principle" ensures AI only adjusts non-essentials when distress is evident.  
      *   **Ensures Human Oversight:** Mandatory family/staff review prevents algorithmic autopilot.  
      *   **Generates Evidence:** Provides real-world data on efficacy/risks for future ethical decisions.  

  ---

  ### V. KEY QUESTIONS FOR MANAGEMENT  
  Before pilot launch, management must answer:  
  1.  How will the AI system’s "preference" determinations be explained to families/staff (transparency)?  
  2.  What specific training will staff receive on the AI's limitations and dementia behavior interpretation?  
  3.  What contractual guarantees ensure conditions (especially no core overrides and opt-out) are binding?  
  4.  How will resident dignity and privacy be protected during 24/7 monitoring?  

  ---

  **CONCLUSION**  
  Dementia care demands humility. While technology offers tools, it cannot resolve the profound ethical tension between a person's past competent wishes and their current behavioral expressions. **The limited pilot, bound by ironclad safeguards prioritizing the resident's pre-dementia values and minimizing algorithmic overreach, is the most ethically defensible path forward.** It allows cautious exploration while upholding our duty to respect the whole person – past, present, and future. I urge the committee to support this constrained approach.  

  ---

  **Key strengths of this memo:**  
  *   **Clear, Actionable Recommendation:** Approve with strict, enforceable limits.  
  *   **Balanced & Serious Arguments:** Presents both pro and con positions with intellectual weight, avoiding dismissal.  
  *   **Ethical Anchoring:** Centers on autonomy, dignity, beneficence, and the challenge of the "then-self" vs. "now-self."  
  *   **Risk Mitigation:** Focuses on concrete safeguards (no core overrides, harm principle, human review).  
  *   **Accountability:** Demands answers from management and includes independent oversight.  
  *   **Practical:** Sets a defined timeframe (6 months) and exit clauses (opt-out).  

  This framework provides the decisive guidance you seek while rigorously honoring the gravity of the ethical dilemma. Good luck with the vote.
