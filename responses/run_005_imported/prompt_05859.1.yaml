prompt: |-
  I'm on the methods-reform committee for a psychology journal, and we're finally rewriting our stats policy after years of replication-crisis hand-wringing. Half the committee wants to stay frequentist but tighten the threshold to p < .005 and mandate preregistration; the other half wants to ditch null-hypothesis significance testing entirely for Bayes factors and credible intervals, arguing NHST is rotten at the root. One member keeps pointing out that Bayesian updating isn't supposed to care about optional stopping or how many tests you ran, so preregistration is basically a patch for a disease Bayesians don't even catch -- but nobody's checked whether that holds up once you factor in how much wiggle room there is in picking priors and models. I need to send our decision out by friday. Draft the memo: recommend an actual policy rather then splitting the difference, and take the strongest objection to whatever we land on seriously instead of hand-waving past it.
reasoning: |-
  Okay, the user is on a methods-reform committee for a psychology journal and needs to draft a memo recommending a new stats policy by Friday. They're torn between two factions: one advocating for stricter frequentist approaches (p < .005 + preregistration) and another pushing for Bayesian methods (Bayes factors + credible intervals) while dismissing NHST entirely. There's also a specific concern about whether Bayesian methods truly eliminate the need for preregistration given the flexibility in choosing priors and models.  

  The user explicitly wants a decisive recommendation that doesn't split the difference and demands a serious response to the strongest counterargument. They're clearly under time pressure and need a policy that's both scientifically rigorous and practically implementable for a broad psychology audience.  

  Hmm... the core tension here is between ideological purity (Bayesian overhaul) and pragmatic evolution (reformed frequentism). The Bayesian argument about optional stopping being "harmless" under their framework is technically correct in theory, but the committee member is right to worry about real-world subjectivity—researchers could fish for priors or models until they get a favorable BF, which preregistration alone can't fix. Meanwhile, the frequentist p < .005 camp is tightening standards but not solving NHST's deeper issues (e.g., dichotomous thinking, misinterpretation of p-values).  

  For the memo, I'll lean toward the Bayesian shift because:  
  - It directly addresses the replication crisis by quantifying evidence for both H₀ and H₁ (unlike p-values).  
  - Credible intervals are more intuitive than confidence intervals.  
  - But! To tackle the "wiggle room" objection, I'll mandate strong safeguards: default priors, sensitivity analyses, and crucially—preregistration of priors/models, not just hypotheses. This turns the counterargument on its head: preregistration isn't a "patch" here but a shield against researcher degrees of freedom.  

  The strongest objection will come from traditionalists who fear complexity. The rebuttal: provide extensive resources (templates, workshops) to lower adoption barriers. No half-measures—this either moves psychology forward or stalls reform.  

  ...Time to draft a memo that's firm but fair, with clear implementation steps. The tone should be urgent (Friday deadline!) but collaborative, acknowledging dissent while pivoting decisively.
answer: |-
  **MEMORANDUM**  
  **TO:** Methods-Reform Committee  
  **FROM:** [Your Name/Committee Chair]  
  **DATE:** [Current Date]  
  **SUBJECT:** Final Recommendation: Bayesian Transition with Robust Safeguards  

  ### **Decision & Recommended Policy**  
  After rigorous debate, we recommend **transitioning to a Bayesian framework as the primary statistical paradigm**, effective January 2025. This policy mandates:  
  1. **Bayes Factors (BF) or Credible Intervals (CrI)** as the core inferential tools, replacing NHST p-values.  
  2. **Preregistration of hypotheses, analysis plans, *and prior justifications***.  
  3. **Default priors + sensitivity analysis** for all confirmatory research.  
  4. **Training support** (workshops, templates) for authors during a 12-month transition.  

  This is *not* a compromise but a coherent shift addressing the replication crisis at its roots. NHST’s fundamental flaws (e.g., conflating evidence with error rates, misalignment with scientific reasoning) cannot be resolved by tightening thresholds alone.  

  ---

  ### **Strongest Objection & Our Response**  
  **Objection:** *"Bayesian updating is immune to optional stopping and multiple testing, so preregistration is redundant. Allowing flexible priors/models reintroduces researcher degrees of freedom."*  

  **Our Serious Response:**  
  1. **Optional Stopping/Multiple Tests**:  
     - While Bayesian updating *formally* accommodates optional stopping under a fixed model/prior, this assumes perfect specification. In practice, **researcher flexibility in *choosing* models or priors after seeing data creates a backdoor for bias**. Preregistration defends against this.  
     - Example: Running 10 models with different priors and reporting only the BF > 10 result is as invalid as p-hacking.  

  2. **Prior/Model Flexibility ≠ License for Fishing**:  
     - **Mandatory prior justification**: Authors must cite empirical/ theoretical bases for priors *before* data collection. Default priors (e.g., Cauchy r = 0.707) are required where strong justification is absent.  
     - **Sensitivity analysis**: All papers must report BFs/CrIs under *at least two alternative priors* (e.g., conservative vs. optimistic).  
     - **Preregistration of models**: If multiple models are plausible, all must be declared in the preregistration.  

  **Thus, preregistration is not a "patch" but a *safeguard against the Bayesian counterpart of p-hacking*: prior-hacking and model-tweaking.**  

  ---

  ### **Why Not p < .005 + Preregistration?**  
  While stricter p-values reduce false positives, they:  
  - Do not fix NHST’s logical fallacies (e.g., mistaking p < .005 as "evidence for H₁").  
  - Increase false negatives, especially for novel effects.  
  - Ignere the need to quantify evidence *for* the null (which BFs provide).  

  ---

  ### **Implementation Timeline**  
  1. **Immediate**:  
     - Preregistration required for all new submissions.  
     - NHST (p-values) permitted *only if* accompanied by BF/CrI.  
  2. **January 2025**:  
     - Full Bayesian reporting required (BF/CrI as primary statistics).  
     - NHST banned in results/discussion sections.  

  ### **Resources & Support**  
  - Dedicated journal portal with:  
    - Tutorials on prior justification.  
    - Templates for preregistration (AsPredicted/OSF).  
    - R/SPSS scripts for default Bayesian tests.  
  - Partnering with PSA for subsidized workshops.  

  ---

  ### **Acknowledging Dissent**  
  We recognize this transition demands effort. However, reforming NHST is akin to repairing a sinking ship—Bayesian methods rebuild it for the storms ahead. The strongest objection (flexibility abuse) is resolved by pairing preregistration with prior transparency, turning Bayesianism’s theoretical strengths into practical rigor.  

  **Deadline**: Final votes/comments by Thursday 5 PM. Policy locked Friday.  

  —  
  **This is progress, not perfection. But it is progress rooted in science, not ritual.**
