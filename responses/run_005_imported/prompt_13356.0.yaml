  Key insight: SIA doesn’t just oppose the doomsday shift—it *erases* it. Why? Under SIA, prior probabilities already favor big populations (since P(you exist) ∝ N). The "early birth rank" likelihood is exactly countered by this prior. Math-wise: posterior ∝ prior × likelihood, but SIA’s prior ∝ N, while the "early rank" likelihood ∝ 1/N. They cancel.  

  Now, failure modes:  
