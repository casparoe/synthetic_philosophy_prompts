prompt: |-
  So a while back I read about how Odysseus had his crew tie him to the mast so he could hear the sirens sing without being able to steer the ship onto the rocks, and I guess people use that story (I've seen it called a "Ulysses contract") to explain a bunch of other stuff that on the surface don't seem related at all — like why constitutions are hard to amend, why people sign prenups, why some psychiatric patients sign papers in advance saying "give me the treatment even if future-me refuses it," why central banks aren't supposed to answer to whoever's in government that week, stuff like that. Me and my roommate got into a whole argument about this because he thinks pretty much any rule you make to control your future self (or even other people's future selves) counts as basically "the same thing" as the mast story, and I think that's way to loose — like, me tying my own hands so I don't screw up later feels pretty different from, say, a bunch of guys 200 years ago writing a document that binds ME today even though I never agreed to it. Neither of us actually studied this stuff so we need a tiebreaker.

  Can you rank the following examples from most to least similar to the actual Odysseus/mast situation — basically judging how much each one is a real case of an agent locking in its own future behavior against its own foreseeable irrationality or weakness of will, versus something that just gets the "Ulysses" label slapped on it loosely but is actually a pretty different animal (like restraining someone else entirely, or just an ordinary deal/incentive)? The list: a country's constitution being hard to amend, a prenup, a psychiatric advance directive, an alcoholic giving their car keys to a friend before a party, central bank independence from elected officials, a debt ceiling law, a new year's resolution you post publicly on facebook so you'll be embarrassed if you quit, a mandatory "cooling off" period before you can finalize a divorce, and a company's vesting schedule for employee stock.

  Please give it to me as a JSON tier list like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  where S means "basically the same phenomenon as the mast" and D means "barely related, it just borrows the name/vibe." And if you don't mind, add a sentence under the JSON for each item explaining why you put it where you did — my roommate is petty enough that he's gonna want the actual reasoning, not just the verdict.
reasoning: |-
  Alright, let me tackle this user's query. They want examples ranked from most to least similar to Odysseus tying himself to the mast. The key elements here are an agent voluntarily restraining their future self to prevent a known weakness. 

  First, the psychiatric advance directive stands out. A patient decides in advance to enforce treatment, even if future them refuses. That's a direct parallel: current self binds future self against irrationality during an episode. 

  Next, the alcoholic giving car keys to a friend. They're proactively preventing a relapse by removing temptation. It's personal and voluntary, though involves another person. 

  The Facebook resolution uses social pressure as a commitment device. It's self-imposed but relies on external shame rather than physical restraint. 

  Vesting schedules for stock options: employees delay gratification by locking away assets. It's a self-control mechanism but often employer-imposed, so less pure. 

  Prenups are agreements between partners. Each person restricts future claims, but it's a mutual contract, not unilateral like Odysseus. 

  Central bank independence aims to prevent political interference in monetary policy. Founding designers bind future governments, but it's institutional, not personal weakness. 

  Constitutions being hard to amend involve founders restricting future societies. It's a collective restraint over time, which feels different from individual willpower. 

  Divorce cooling-off periods are state-mandated, not self-imposed. They override individual choice, so less about personal commitment. 

  Debt ceiling laws are political tools. They force reconsideration of spending but often create crises rather than prevent irrational actions. 

  Ranking these, the psychiatric directive and car keys are top-tier. Social media resolutions and vesting are next. Prenups and central banks are more structural. Constitutions, cooling periods, and debt ceilings are least similar as they involve external or collective constraints.
answer: |-
  Here's the tiebreaker ranking based on core Ulysses Contract criteria: **a single agent voluntarily binding *their own future self* against a known, specific weakness of will or irrational state they anticipate.** The closer to this, the higher the tier.

  ```json
  {
    "S": ["psychiatric advance directive"],
    "A": ["alcoholic giving their car keys to a friend before a party", "new year's resolution you post publicly on facebook so you'll be embarrassed if you quit"],
    "B": ["company's vesting schedule for employee stock", "prenup"],
    "C": ["central bank independence from elected officials", "mandatory \"cooling off\" period before you can finalize a divorce"],
    "D": ["a country's constitution being hard to amend", "a debt ceiling law"]
  }
  ```

  **Reasoning:**

  1.  **S: psychiatric advance directive** - *Directly mirrors Odysseus: A rational "present self" (during stability) creates a binding constraint specifically to prevent their anticipated irrational "future self" (during psychosis/manic episode) from refusing necessary treatment, overriding future refusal.*
  2.  **A: alcoholic giving their car keys to a friend before a party** - *Present self (sober & rational) proactively removes the *means* (keys) to act on a *specific anticipated weakness* (drunk driving impulse) during a *foreseeable risky situation* (party). Involves trust in a 3rd party (like the crew), but core is self-binding.*
  3.  **A: new year's resolution you post publicly on facebook...** - *Present self creates a *self-imposed psychological constraint* (fear of embarrassment) to counteract a *foreseeable weakness of will* (quitting). It leverages social pressure as the "mast," binding future self's choice through anticipated regret/shame.*
  4.  **B: company's vesting schedule for employee stock** - *Employee *agrees in advance* to a structure (the vesting schedule) that forces delayed gratification, counteracting the *foreseeable impulse* to cash out immediately. While imposed by the company, the employee consents to this self-binding mechanism as part of compensation.*
  5.  **B: prenup** - *Two *present selves* rationally agree on rules (division of assets) to govern a *foreseeable future state* (divorce) where rationality/amicability might be compromised by high emotions/conflict. It binds their *own* future choices/claims. Less pure "single agent" than S/A, but core idea of binding future selves against weakness applies.*
  6.  **C: central bank independence from elected officials** - *Founders/past legislators create rules to *insulate an institution* (central bank) from the *foreseeable short-term political pressures* (irrationality/weakness of will) of *future governments*. It's about binding *other* future agents (politicians) to protect a long-term goal (monetary stability), not an agent binding *its own* future self.*
  7.  **C: mandatory \"cooling off\" period before you can finalize a divorce** - *The *state* imposes a waiting period on *individuals* seeking divorce, anticipating that *heightened emotions* might lead to rash decisions. While it aims to counteract a foreseeable irrational state, it's *externally imposed* (state law) on the agent, not *voluntarily self-imposed* by the agent anticipating their own weakness.*
  8.  **D: a country's constitution being hard to amend** - *Founders/past generations create rigid rules to bind *future societies and governments* (entirely different agents/collectives) according to the founders' vision, anticipating future shortsightedness or passions. It's fundamentally about binding *others* across generations, not an agent binding *its own* future self.*
  9.  **D: a debt ceiling law** - *A *past legislature* sets an arbitrary statutory limit on borrowing that binds *future legislatures/administrations*. It's a political tool, not primarily designed to counter *personal irrationality/weakness of will*. It often *creates* crises rather than preventing foreseeable individual weakness. Binds *other* future agents.*
