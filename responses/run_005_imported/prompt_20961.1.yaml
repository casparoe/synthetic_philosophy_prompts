  for my non-classical logics seminar we've been reading about dialetheism and something about it still isnt clicking for me. if dialetheists like Priest hold that the liar sentence is both true and false, then doesnt the principle of explosion mean they're committed to literally every proposition being true, including totally unrelated stuff like the moon being made of cheese? that seems to make the whole position self-defeating, so why do logicians still treat dialetheism as worth debating instead of just an obvious reductio of itself?
