prompt: |-
  ok so for my philosophy elective (yes my school actually has one, it's kind of a mix of ethics and epistemology) we read a chunk of Hume's Treatise on promises being an "artificial virtue," plus part of Scanlon's chapter on promising from What We Owe to Each Other, and then had to answer this for homework in 150-200 words: "Explain Hume's account of why promises are binding and contrast it with Scanlon's contractualist account. Which do you find more convincing, and why?"

  My teacher makes us swap papers with a partner and grade each other using her rubric before we turn in the real thing, so we catch dumb mistakes early. My partner this week is Jordan, and honestly i don't trust my own grading on this topic enough yet, so here's exactly what Jordan wrote and i was hoping you could check my work on checking their work lol:

  "Hume thought promise-keeping is what he calls an 'artificial virtue,' meaning it isn't a real, natural moral obligation but more like a useful rule people invented so they could trust each other enough to trade and make deals over time -- similar to how we invented property rights or money. So for Hume, breaking a promise is only wrong because it violates this made up social convention, not because there's some deeper duty involved.

  Scanlon's contractualist theory disagrees with this. He basically says promises are like a mini social contract: two people agree to certain terms, and once you've gotten what you wanted out of the deal it would be irrational and self interested to back out, so keeping your word is really just enlightened self-interest turned into a rule everyone follows. This is different from Hume because Scanlon thinks the obligation comes from the logic of the contract itself, not from society just finding the rule convenient.

  I find Scanlon more convincing because his version explains why breaking a promise feels like your actually wronging a specific person, not just breaking some arbitrary rule of etiquette."

  Can you grade that the way my teacher would? Her rubric is out of 20: 5 pts for explaining Hume accurately, 5 pts for explaining Scanlon accurately, 5 pts for a comparison/personal take that actually follows logically from what was said, and 5 pts for overall clarity. Could you fill that in like a little json (score 0-5 for each category plus a total out of 20), and then under that give me specific comments for each category -- not just "good job" or "needs work" but the exact things Jordan got right or got wrong, so I can actually explain it to them instead of just handing back a number.
