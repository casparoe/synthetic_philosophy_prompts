prompt: |-
  Ok this is gonna sound kind of nerdy but here goes. I recently started keeping a spreadsheet where I track my credences on random personal stuff (like whether my landlord's actually gonna fix the heater by friday), updating with Jeffrey conditionalization since I'm basically never 100% certain about my evidence. Yesterday two separate pieces of soft evidence about the same question came in, and just for fun I updated on them in both possible orders -- and got two different final probabilities for the same event, which really threw me since with regular Bayesian conditionalization the order you learn things in never matters. Can you give me a gut-level explanation of why Jeffrey conditionalization can end up order-dependent like that, and whether it means I'm doing something wrong, or if that's genuinely just how it has to work?
