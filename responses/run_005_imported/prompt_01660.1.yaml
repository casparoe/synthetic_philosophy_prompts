  ## The Unconscious Target: A Critical Exploration of Higher-Order Thought Theory's Puzzle

  Higher-order thought (HOT) theories offer a compelling, intellectually elegant account of consciousness. Pioneered by thinkers like David Rosenthal, they posit that a mental state becomes conscious not intrinsically, but by virtue of being the target of a distinct, higher-order mental state – a thought *about* that first-order state. While this framework effectively distinguishes conscious from unconscious processing and avoids the pitfalls of intrinsic qualia, it confronts a persistent and seemingly paradoxical challenge: How can we coherently have a higher-order thought *about* a mental state that remains stubbornly unconscious? This essay will explore this puzzle, evaluate its threat to HOT theories, and argue that while it highlights a significant challenge demanding careful refinement, it does not fatally undermine the core insight that consciousness fundamentally involves higher-order representation.

  **The Puzzle Unveiled:**

  The core claim of HOT theory is: **A mental state M is conscious if and only if there is a suitable higher-order thought HOT directed at M.** Consciousness arises from the metarepresentational relation.

  The puzzle arises when we consider scenarios where we seem to possess a HOT *about* a state M, yet M itself remains unconscious. Examples abound:

  1.  **Unconscious Beliefs:** I might introspectively conclude, "I hold an unconscious bias against group X." Here, the HOT ("I believe I have a bias against X") seems to target the first-order bias. Yet, according to HOT theory, the HOT should render its target conscious. But the bias *itself* remains unconscious; I don't experience the biased thoughts or feelings directly, only the *knowledge* that they exist latently.
  2.  **Theorizing about Unconscious States:** A psychoanalyst forms the thought, "My patient has an unconscious repressed memory of event Y." The HOT ("The patient has a repressed memory of Y") targets the patient's unconscious memory. Yet, the memory remains unconscious for the patient (and is not directly conscious for the analyst either). If the HOT makes its target conscious, how can the target *be* unconscious?
  3.  **Self-Ascription of Implicit States:** After an implicit association test reveals a bias, I think, "Oh, I must have an implicit preference for A over B." The HOT targets the implicit preference. Yet, the preference itself isn't consciously experienced as a feeling or explicit thought; it's inferred from behavior.

  In each case, we have a clear HOT directed *at* a specific first-order state (the bias, the repressed memory, the implicit preference). According to the HOT theory's sufficiency claim (HOT causes consciousness of M), the target state *should* become conscious. Yet, phenomenologically and theoretically, it often does not. The state remains opaque, inferred, but not subjectively present. This creates a tension: **If M is unconscious, how can it be the *intentional object* of a HOT? And if the HOT successfully targets M, why isn't M conscious?**

  **Is this a Genuine Problem for HOT Theories?**

  The puzzle poses a *significant* challenge that HOT theorists must address. It directly questions the *sufficiency* of the HOT for conferring consciousness on its target. If HOTs can apparently target unconscious states without rendering them conscious, then something more or different seems required for conscious experience. Critics argue this reveals a fatal flaw: the theory fails to account for the very phenomenon it seeks to explain – the subjective "what-it's-like-ness" – by allowing the core mechanism (HOT targeting) to operate independently of it.

  However, HOT proponents offer sophisticated counterarguments, suggesting the puzzle may stem from misdescription rather than a fundamental theoretical flaw:

  1.  **Misrepresentation:** HOT theorists argue that in cases like the unconscious bias example, the HOT is *not* accurately targeting a *currently occurring*, specific unconscious *state*. Instead, it might be targeting:
      *   A *disposition* (e.g., "I am disposed to have biased reactions under certain conditions"), not a current occurrent state. Dispositions aren't conscious states themselves.
      *   A *theoretical construct* inferred from behavior ("There exists a cognitive structure causing bias"), not a directly introspected state.
      *   Or, crucially, the HOT might be *misrepresenting* its target. Perhaps I think I'm targeting the specific bias state, but I'm actually targeting a vague concept or a description derived from external evidence, not the state itself. If the HOT misrepresents M (e.g., attributes properties M doesn't have, or fails to pick out M accurately), then according to some HOT variants (like Rosenthal's), M won't become conscious. Consciousness requires *suitable* and *accurate* HOTs.
  2.  **Targeting the *Knowledge* of the State, Not the State Itself:** When I think "I have an unconscious bias," the HOT's *primary* target might be my *knowledge claim* or *belief* about the bias ("I believe I have a bias"), not the raw, first-order biased state itself. The first-order state remains unrepresented by the relevant HOT.
  3.  **Levels of Representation:** Some versions, like Kantian-inspired approaches or Robert Van Gulick's HOGS (Higher-Order Global States), suggest that the higher-order state doesn't just *point* to the first-order state but must be integrated with it into a unified representational complex. Merely having a detached *thought about* a state might not suffice; the representation needs to be of a specific kind – perhaps involving global availability or a specific mode of self-presentation within a complex state.

  **Evaluation and Defense of a Refined HOT View:**

  The puzzle is powerful because it leverages undeniable phenomenological facts: we *do* think and talk meaningfully about unconscious mental states. However, the HOT theorist's responses, particularly the misrepresentation and dispositional/target-refinement arguments, provide plausible avenues for resolving the apparent contradiction without abandoning the core framework. The examples often involve inferences based on indirect evidence (test results, behavioral patterns, therapeutic interpretations), not direct introspective access to the target state. The HOTs formed are typically *about the existence* or *effects* of the state, not about its *current occurrent phenomenal character* in a way that would meet the criteria for a "suitable" HOT.

  Therefore, while the puzzle highlights the need for HOT theories to precisely define "suitable" HOTs and carefully delineate the nature of the intentional relation required, it does not constitute a fatal blow. It underscores that **consciousness arises not from *any* higher-order thought, but from a *specific kind* of metarepresentational relationship where a HOT (or analogous higher-order state) accurately and directly represents the *subjective character* of a current, occurrent first-order state within a unified cognitive framework.**

  **My View: Consciousness as Inherently Metarepresentational (Refined HOT)**

  I defend a refined HOT perspective. The core intuition – that consciousness involves a "taking note" or awareness *of* one's own states – remains compelling. The alternative, that states are intrinsically conscious, struggles to explain unconscious mental processing and the difference between merely having information and being aware *that* one has it. The puzzle of the unconscious target, while significant, points not to the failure of metarepresentation as the key, but to the complexity of its implementation.

  *   **Necessity:** I argue higher-order representation (broadly construed, potentially including non-conceptual or non-propositional forms) is *necessary* for consciousness. A state cannot be conscious if the system has *no* internal representation whatsoever of its occurrence or character.
  *   **Sufficiency (with Conditions):** A *suitable* higher-order representation is sufficient. "Suitability" requires:
      *   **Accuracy:** The HO state must accurately represent the *phenomenal properties* of the first-order state, not just its existence or causal role.
      *   **Occurrent Targeting:** It must target an *occurrent* state, not merely a disposition or theoretical entity.
      *   **Directness/Integration:** The representation must be direct and integrated in a way that the first-order state's content becomes part of the content of the conscious field. Detached, purely inferential thoughts *about* states aren't sufficient.
      *   **Appropriate Format:** The HO representation might need a specific format or vehicle (e.g., non-conceptual, analog, or involving specific neural broadcasting) to generate phenomenology.

  In the unconscious bias case, my thought "I have an unconscious bias" fails on several counts: it targets a disposition, not an occurrent state; it's based on inference, not direct representation of phenomenal character; and it likely misrepresents the precise nature of any latent state. The HOT is *about the bias* in a descriptive, third-person way, not in the first-person, present-tense, phenomenal mode required for consciousness of the state itself.

  **Conclusion:**

  The puzzle of having higher-order thoughts about unconscious states is a serious challenge that forces HOT theories to refine their definitions and mechanisms. It highlights the crucial distinction between merely *thinking about* a mental state and consciously *experiencing* it. However, by invoking misrepresentation, the targeting of dispositions or knowledge-claims instead of occurrent states, and demanding specificity regarding the "suitability" of the HOT, proponents can resolve the apparent paradox. This resolution strengthens, rather than weakens, the theory by clarifying the precise metarepresentational conditions under which consciousness emerges. While the nature of "suitability" requires further empirical and philosophical investigation (e.g., neural correlates of specific metacognitive acts), the fundamental insight that consciousness is constituted by a specific kind of self-directed representation remains the most powerful and parsimonious explanation for the subjective character of our mental lives. Consciousness, in this view, is not a brute fact of first-order states, but an achievement of the mind's capacity to represent its own representational activity in a direct, integrated, and phenomenally relevant manner.
