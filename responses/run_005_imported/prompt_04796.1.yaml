  We are considering the hole argument in general relativity, which highlights a tension between the diffeomorphism invariance of the theory and the idea that spacetime points have inherent identities (substantivalism). The argument is often taken to show that if we take the spacetime manifold as representing a substantival space, then we are committed to indeterminism because the equations of general relativity allow for multiple solutions that are identical outside a region (the "hole") but differ inside, even when the initial conditions are fixed.

  Responses to the hole argument:

  1. **Sophisticated Substantivalism** (also known as "metric essentialism" by some, but note that sophisticated substantivalism is a broader category): This view accepts that spacetime points exist independently (substantivalism) but denies that they have their identities independently of the metric field. Instead, the points are individuated by the metric field. This avoids the hole argument because the two models related by a hole diffeomorphism are now seen as representing the same physical situation (since the points are individuated by the metric, and the metric is shifted along with the points, so the physical relations remain the same). This is the view that Earman and Norton themselves proposed as a way out for substantivalists.

  2. **Metric Essentialism**: This is a specific form of sophisticated substantivalism where the metric field is considered an essential property of the spacetime points. Without the metric, the points would not be the same points. Hence, the diffeomorphic models are just redescriptions of the same physical reality.

  3. **Relationalism**: This view denies the existence of spacetime points as fundamental entities. Instead, spacetime is a network of relations between physical events or objects. The hole argument is avoided because there are no spacetime points to be moved independently. The diffeomorphism is just a redescription of the same relational structure.

  4. **Structural Realism**: This is a more general philosophical position that can be applied to the hole argument. It suggests that what is real is the structure of the theory, not the individual objects (like spacetime points). The two models related by a diffeomorphism are isomorphic and hence represent the same physical structure.

  5. **Acceptance of Indeterminism**: Some might bite the bullet and accept that general relativity is indeterministic in this way, but this is generally considered unattractive because the indeterminism is seen as a purely formal artifact and not physical.

  6. **Leibniz Equivalence**: This is the principle that if two models are related by a diffeomorphism, then they represent the same physical situation. This is often taken as the standard resolution in the physics community. It is closely related to sophisticated substantivalism and structural realism.

  Now, regarding which ones are taken seriously and how they are ranked:

  In contemporary philosophy of physics, the most widely accepted resolution is to adopt Leibniz Equivalence, which is a core tenet of general relativity. This is often expressed by saying that the physical world is represented by an equivalence class of diffeomorphic models. This view is compatible with sophisticated substantivalism and structural realism. Relationalism is also a serious contender, but it has to be updated to a modern form (such as Rovelli's relational quantum gravity) to be fully compatible.

