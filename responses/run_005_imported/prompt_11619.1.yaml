answer: |-
  ## The Significance Skeptics: A Methods Conference Dialogue

  **Setting:** Coffee break at the "Advances in Psychological Methods" conference. Dr. Fiona Bayes (Bayesian) and Dr. Frank Frequentist (Frequentist) continue a heated discussion sparked by a keynote.

  **Dr. Fiona Bayes:** (Sipping espresso) Frank, that keynote perfectly illustrated my point. Bem's 2011 "Feeling the Future" paper. Nine experiments, p < .05 in eight? Textbook NHST success. Yet, it’s precognition! The *structural flaw* of p-values is laid bare: they measure incompatibility with a *specific null*, not the strength of evidence *for a specific alternative*. Wagenmakers et al.'s Bayes Factor reanalysis, using a skeptical prior, showed the evidence was actually *anecdotal* at best. That’s the crucial insight p-values miss: extraordinary claims demand overwhelming evidence, quantified by the likelihood ratio, not just a low p-value.

  **Dr. Frank Frequentist:** (Leaning forward) Fiona, you're blaming the tool for the user's malpractice. Bem didn't fall victim to NHST; he fell victim to *bad science practices* endemic *within* NHST frameworks. Let’s autopsy it properly:
  1.  **Multiple Comparisons:** Nine experiments? Even with Bonferroni (p < .0056), several "significant" results vanish. He didn't correct.
  2.  **Exploratory Fishing:** His protocols evolved across studies. Was this truly pre-registered, confirmatory research? No. It was exploratory data dredging masquerading as confirmatory.
  3.  **Flexible Analysis:** Optional stopping? Peeking at data mid-stream? Tweaking exclusion criteria? Classic p-hacking playbook.
  A *rigorous* frequentist critique, applying appropriate corrections for multiplicity and demanding strict pre-registration, would have deflated those p-values below significance *without ever invoking a prior*. The problem wasn't NHST; it was ignoring its safeguards.

  **Dr. Fiona Bayes:** A fair point about the practices, Frank. Correcting for multiplicity *is* essential within your framework. But even if you applied the most stringent correction *post-hoc*, you'd still only get "non-significant" for some studies. What you *don't* get is a positive quantification of how *likely* precognition is relative to chance or a skeptical position. The p-value tells you the data are *unlikely* under the null of *no effect*. But for psi, we need to know: *how much more likely* are these data under psi than under the null, or under plausible alternatives like subtle methodological artifacts? That's the Bayes Factor. Wagenmakers' BF~1 showed the data were *equally* likely under the skeptical prior (including skepticism about psi *and* potential flaws) as under Bem's precognition hypothesis. That's fundamentally different information than p > .05.

  **Dr. Frank Frequentist:** Ah, but there's the rub, Fiona. This "skeptical prior." You laud it as principled. Was it? Or was it reverse-engineered? Wagenmakers used a Cauchy prior centered on zero with a scale of 1 for the effect size in the psi direction. Why *that* specific form? Why *that* scale? It conveniently yielded a BF~1, telling everyone what they already suspected: "Move along, nothing to see here." Isn't this just dressing up subjective disbelief in mathematical clothing? How is this prior "principled" beyond confirming the prevailing scientific bias against psi? It feels less like objective analysis and more like prior-driven confirmation of the null.

  **Dr. Fiona Bayes:** (Nodding thoughtfully) A crucial challenge, Frank. Let's defend it on its merits, not just Bayes' theorem. The choice *is* principled, grounded in two key ideas:
  1.  **Default Skepticism for Extraordinary Claims:** Precognition overturns well-established physics and cognitive science. The prior *should* embody profound skepticism. A Cauchy(0,1) is heavy-tailed, allowing for *possible* large effects but *strongly* concentrating mass near zero. It formalizes the intuition: "Show me *overwhelming* evidence to shift my beliefs from 'almost certainly noise/chance/artifact'." It's a *default* position demanding strong evidence.
  2.  **Calibration to Existing Knowledge:** The scale (SD=1 on Cohen's d) wasn't arbitrary. It reflects a realistic expectation of effect sizes in psychology *for established phenomena*. Claiming an effect *larger* than most robust findings in the field *requires* stronger evidence. Setting a skeptical prior centered on zero with a scale *commensurate* with typical effects forces the BF to demand that stronger evidence. If Bem's effects were real and large, even this skeptical prior would eventually be overwhelmed by sufficient data. They weren't. It's not reverse-engineered; it's calibrated to the *context* of scientific plausibility. Would you use the same skeptical prior for a new antidepressant? Probably not – the existing evidence base justifies a different starting point. Context matters.

  **Dr. Frank Frequentist:** Context matters, yes. But doesn't that "context" risk smuggling in the very bias we're trying to avoid? You say "calibrated to existing knowledge," but existing knowledge *excludes psi*. Isn't this circular? The prior encodes "psi is implausible," the analysis shows "data don't overcome that implausibility," and you conclude "psi is implausible." The prior *is* the conclusion! At least with NHST, the starting assumption (the null) is simple and defined by the model, not by our pre-existing beliefs about the phenomenon. We *then* use replication and methodological rigor to build (or destroy) plausibility.

  **Dr. Fiona Bayes:** Frank, the null hypothesis *is* also a model choice reflecting context! Choosing a point null of *exactly zero* effect for psi is itself a strong statement, implying no effect is the *only* plausible default. Is that truly neutral? The Bayesian approach *makes the prior explicit* and forces us to justify it, rather than hiding it in the choice of null or alpha level. Wagenmakers' prior *is* a model: it represents a plausible state of the world where effects are most likely zero or very small, with a long tail acknowledging *potential* surprises. The BF then *explicitly compares* how well the data support this skeptical model versus Bem's psi model. NHST only tests compatibility with *one* specific model (the point null). It doesn't *compare* models. When the alternative is extraordinary, *comparison* is essential. The BF provides that comparison quantitatively. The prior isn't the conclusion; it's the starting point for a quantified belief update based on evidence. The conclusion ("weak evidence") comes from the *likelihood ratio* moderated by that prior.

  **Dr. Frank Frequentist:** But the quantification depends entirely on the prior you chose! Change the scale of your Cauchy prior, and the BF changes dramatically. Your "objective" BF is fragile to subjective prior specification. NHST, for all its flaws, gives a single number (the p-value) based solely on the data and the defined null model. Its interpretation is hard, yes, but at least it's not *explicitly* conditional on a subjective prior belief.

  **Dr. Fiona Bayes:** And that "single number" is routinely misinterpreted as the probability the null is true, or the strength of evidence for the alternative – misinterpretations *more* dangerous than a transparently stated prior! Sensitivity analysis is standard practice in Bayesian reporting. We *should* report how the BF changes under different reasonable priors. If the evidence is strong, it will withstand moderate changes to the prior. In Bem's case, even with *more* diffuse priors (less skeptical), the evidence remained weak. The core lesson holds: the data, even uncorrected, weren't *overwhelmingly* more likely under psi than under plausible skeptical models incorporating doubt *and* potential flaws. P-values alone couldn't reveal that; they only said "unlikely under strict null." The BF, even with its prior dependence, captures the *relativity* of evidence for extraordinary claims in a way NHST structurally cannot. The prior makes the necessary skepticism explicit and quantifiable.

  **Moderator:** (Interrupting) Fiona, Frank, fascinating debate! I hate to cut you off, but the next session on pre-registration is starting. Perhaps continue over drinks? We clearly need both better practices *and* better frameworks for interpreting evidence, especially at the edges of plausibility!

  **(Both nod, gathering their things, the intellectual tension unresolved but respectfully engaged.)**
