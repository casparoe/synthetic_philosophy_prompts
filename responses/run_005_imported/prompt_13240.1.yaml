prompt: |-
  so i'm on my high school's honor council (the student group that hears cheating cases and recommends a ruling to the dean) and we've got a case this friday that's actually splitting the group. this girl in my grade has kept one running notes doc since freshman year — formulas, her own shortcuts, old homework solutions, basically everything — and has it set up so a searchable version syncs to her smartwatch. during a "closed notes, no devices" chem test, a proctor caught her glancing at the watch for like 3 seconds to check one formula. her defense is that the doc basically functions as her memory at this point: she says she genuinely cant tell anymore what she "actually" remembers vs what's in the doc, she trusts it completely, and she's used it every day for three years, so checking it isn't really different from just recalling something in her head. half the council brought up this "extended mind" idea from psych elective as a real reason to go easier on her (or rewrite the policy), the other half thinks thats just a fancy excuse and a rule is a rule. can you write the actual memo i'd read out at the hearing — i need a specific finding + sanction (if any) for her case, plus a call on whether the closed-notes policy itself needs to change, and please actually engage with the extended-mind argument seriously instead of just waving it off as a loophole.
reasoning: |-
  Okay, the user is part of their high school's honor council and they're dealing with a tricky cheating case. A student used her smartwatch to access a notes doc during a closed-notes chemistry test. The council is split because some members are considering the "extended mind" theory, which suggests that the notes doc is part of her cognitive process. The user needs a memo for the hearing that addresses this argument seriously and provides a ruling.

  First, I need to understand the core issue. The student claims the doc is so integrated into her memory that checking it is like recalling information. The honor council is divided. The user wants a memo that includes a specific finding, sanction, and a policy recommendation, while engaging deeply with the extended mind concept.

  The extended mind theory, from Clark and Chalmers, posits that external tools can be part of one's cognitive system if they're constantly accessible and trusted. Applying this to education is complex. Schools test internal knowledge, not external resources. Even if the student relies on the doc, the test's purpose is to assess unaided recall. The policy clearly states "no devices," so using a smartwatch violates that regardless of intent.

  But the student's argument isn't frivolous. Her long-term use of the doc shows integration, but the context matters. Testing environments are designed to measure internal knowledge. Allowing this could create inequities—students without such tech couldn't claim the same advantage. Plus, the proctor observed her glancing at the watch, which indicates conscious use during the test.

  For the ruling, the violation is clear. However, intent and context matter. She wasn't hiding the watch, suggesting no malicious intent. But ignorance of the policy isn't an excuse. The sanction should be educational rather than punitive. Maybe requiring her to retake the test and participate in policy discussions. 

  Regarding policy changes, the council should review the rules. Maybe clarify that any wearable tech is prohibited. They could also consider allowing certain accommodations if a student genuinely uses tech as a cognitive aid, but that requires formal approval. For now, the policy stands, but a committee could explore updates.

  The memo needs to balance upholding rules with understanding the student's perspective. Acknowledge the extended mind theory but explain why it doesn't excuse the violation. Recommend a moderate sanction and suggest policy review without immediate changes. This addresses the council's split by validating both sides but emphasizing the importance of current rules and fairness.
answer: |-
  ## Honor Council Ruling Memorandum

  **TO:** Honor Council Members, Dean of Students  
  **FROM:** [Your Name], Honor Council Member  
  **DATE:** [Date of Hearing]  
  **SUBJECT:** Ruling & Policy Recommendation - Case # [Number]: Use of Smartwatch Notes During Closed-Chemistry Test  

  ### Case Summary
  Student A accessed a searchable, synced notes document stored on her smartwatch during a "closed notes, no devices" chemistry test to view a specific formula. The access lasted approximately 3 seconds and was observed by a proctor. Student A defends her actions by arguing the notes document is an integral, constantly accessed extension of her memory ("extended mind"), making its use functionally equivalent to unaided recall.

  ### Key Findings of Fact
  1.  **Violation Occurred:** Student A accessed an external digital resource (smartwatch notes) during a designated "closed notes, no devices" assessment. This constitutes a clear violation of the explicit test rules as currently written and understood.
  2.  **Intent & Context:** While the access was brief, it was deliberate. Student A did not attempt to hide the watch but used it overtly. Her claim of viewing the document as "memory" suggests a lack of *malicious* intent to deceive in the traditional sense, but demonstrates a significant misunderstanding (or rejection) of the core purpose of closed-note testing.
  3.  **The "Extended Mind" Argument (Serious Engagement):** The Council acknowledges the philosophical and psychological concept of the "extended mind" (Clark & Chalmers, 1998). Student A's description of deep integration and reliance on her notes document over three years resonates with this theory. External tools *can* become deeply coupled with cognition, acting as functional extensions of biological memory.
      *   **However, the Educational Testing Context is Crucial:** The primary purpose of a *closed-note*, *no-device* assessment is to evaluate a student's *internalized knowledge and unaided problem-solving ability under specific constraints*. It tests the ability to recall, synthesize, and apply information *without* external aids, simulating scenarios where such aids may be unavailable (e.g., lab work, certain exams, professional situations). Allowing reliance on deeply integrated external tools, however seamless, fundamentally changes the skill being assessed.
      *   **Equity & Policy Clarity:** Accepting the "extended mind" defense for personal digital repositories creates an unmanageable standard. Verification of genuine integration is impossible. It also creates inequity: students who develop strong unaided recall are disadvantaged compared to those using sophisticated (and potentially expensive) external systems, regardless of integration depth. Rules must be objectively enforceable based on observable actions (accessing a device) rather than subjective cognitive states.
      *   **The "Trust" Factor vs. Test Conditions:** While Student A trusts her document implicitly, the test condition explicitly required her to rely *only* on her biological recall during that specific period. The violation lies in choosing the external tool *during the constrained assessment window*, not in her general reliance on it.

  ### Ruling
  The Honor Council finds Student A **in violation** of the Academic Integrity Policy, specifically the provision prohibiting the use of unauthorized materials or devices during a closed-note, no-device assessment.

  ### Recommended Sanction
  1.  **Grade Sanction:** A zero on the specific chemistry test question where the formula was accessed. (Rationale: The violation provided an unfair advantage *for that specific piece of information* during the assessment. Nullifying the benefit gained is proportional).
  2.  **Educational Component:** Mandatory completion of a short reflective assignment (to be reviewed by the Council advisor or Dean) addressing:
      *   The distinction between personal study tools and assessment rules.
      *   The purpose of closed-note assessments in evaluating internalized knowledge.
      *   Why the "extended mind" concept, while valid for learning, does not override the specific constraints of a defined testing environment designed to measure unaided recall.
  3.  **Probation:** Standard academic probation for the remainder of the semester, lifted upon satisfactory completion of the educational component. (Rationale: Acknowledges the violation but recognizes the unique nature of the defense and lack of traditional deceit).

  ### Recommendation Regarding "Closed Notes, No Devices" Policy
  The Council **does NOT recommend** a blanket policy change permitting pre-loaded personal digital repositories on wearable devices based on an "extended mind" defense at this time. The reasons are:
  1.  **Enforceability & Equity:** As stated, verifying "genuine integration" is impractical and subjective, leading to inconsistent application and potential for abuse. It inherently advantages students with specific technological access and habits.
  2.  **Preservation of Assessment Intent:** The core purpose of testing unaided recall and application under constraint remains valid.
  3.  **Clarity & Predictability:** Clear, objective rules ("no devices") are essential for fairness and student understanding.

  **However, the Council STRONGLY RECOMMENDS that the Administration and Faculty:**

  1.  **Explicitly Define "Device" in Policy:** Amend the policy to explicitly include *all wearable technology* (smartwatches, AR glasses, etc.) within the prohibition of "devices" during closed-note tests. Remove any ambiguity.
  2.  **Formalize Accommodations for Cognitive Tools:** Establish a clear, documented process through the appropriate office (e.g., Learning Support) for students who genuinely rely on specific external tools due to documented learning differences or cognitive needs *to request formal accommodations* (e.g., access to printed notes, extended time without devices, alternative assessments). This addresses genuine needs *before* the test, not as a defense after a violation.
  3.  **Review Assessment Design:** Encourage faculty to consider *why* they use closed-note tests. Are they testing rote recall or deeper application? Could alternative assessments (e.g., open-note tests focusing on complex application, projects, oral exams) sometimes better measure the intended skills without creating this tension? The Council suggests faculty development on this topic.

  ### Conclusion
  While Student A's argument based on the "extended mind" theory highlights fascinating questions about modern cognition and the nature of memory, it does not negate the specific violation of accessing a prohibited device during a constrained assessment designed to measure unaided knowledge. The violation is confirmed. The recommended sanction balances accountability with the unique context of her defense. Crucially, the policy itself requires clearer language regarding devices and a formalized pathway for accommodations, not a fundamental change permitting personal digital repositories based on subjective integration claims. The Council urges the Administration to implement these specific clarifications and process improvements.  

  **Respectfully Submitted,**  
  [Your Name]  
  Honor Council Member
