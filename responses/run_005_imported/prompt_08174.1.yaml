  Quick one for you — I'm working on a piece about the science of splitting gains in negotiations, and I keep running into this claim that Nash's bargaining solution can actually violate monotonicity: you expand the feasible outcomes in a way that only sweetens things for player A, player B's own best-case outcome doesn't move an inch, and somehow the Nash solution still leaves B worse off than before. Apparently that's the exact reason Kalai and Smorodinsky cooked up thier alternative solution in the first place. I get the formal statement but not the actual mechanism — why does maximizing the product of utility gains cause that weird result, and how does KS's approach of matching each player's share of their own ideal point dodge it? Can you walk me through the intuition, ideally with a small toy example, and skip the full proofs — I want the "aha" in a form I could explain to readers who haven't touched game theory since undergrad.
