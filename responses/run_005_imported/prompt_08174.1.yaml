  For KS, we'd anchor to the ideal point (200,50). The solution lies where the ray from (0,0) to (200,50) hits the frontier. That ray has slope 0.25, so it intersects the new line at (100,25)? Wait no - the line is U_B=50-0.25U_A, set equal to 0.25U_A? 50-0.25A=0.25A → A=100, B=25. Same point? Oh! But in this symmetric expansion it wouldn't violate... I need asymmetric.

