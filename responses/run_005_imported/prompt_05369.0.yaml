answer: |-
  You've hit on a core tension in ethics brilliantly! Your solution – judging solely by intentions and effort (what was within the agent's control) – is elegant and aligns strongly with major ethical frameworks, particularly Kantian deontology ("good will") and much of virtue ethics (focus on character and deliberation). **It absolutely resolves the *core logical inconsistency* of outcome-based moral luck.**

  **However, philosophers haven't been making it harder *unnecessarily*. The puzzle persists because your solution, while logically appealing, runs into significant practical, psychological, and even conceptual challenges when applied to real-world moral life and responsibility:**

  1.  **The Inseparability of Action and Consequence in Moral Experience:**
      *   **Harm Matters:** Morality isn't just about internal states; it's deeply concerned with preventing and responding to *harm*. The reckless driver who *causes* death has brought about immense suffering that the other driver hasn't. Our moral outrage and demand for accountability are naturally (and arguably rightly) amplified by the *actual harm done*. Judging both drivers identically feels intuitively inadequate in addressing the victim's suffering and the societal need to mark such a grave outcome.
      *   **Agent-Regret (Bernard Williams):** Even the most virtuous agent who causes terrible harm through no fault of their *character* (pure bad luck) will likely experience profound "agent-regret" – a regret specifically tied to *being the cause*, distinct from mere sympathy. This deep psychological response suggests our moral identity is tied to the consequences of our actions, not just our intentions. Telling the driver who killed someone, "Don't feel worse than the other reckless driver; you both had the same intent," ignores a fundamental human moral emotion.

  2.  **Epistemic Limitations (The Problem of Knowing Intentions/Effort):**
      *   **We Judge What We See:** Outcomes are often the most visible and objective evidence we have. Proving the *exact equivalence* of intentions and effort between two agents is incredibly difficult, if not impossible, in practice. Outcomes become a crucial (though flawed) proxy for assessing culpability. Did the driver who hit the pedestrian *really* take the *exact* same level of care? Was their momentary distraction truly identical? We infer intention *from* action and result.
      *   **Character Assessment:** Consequences can be evidence (though not proof) of underlying character flaws or insufficient effort that *weren't* apparent beforehand. The driver who kills someone might reveal a pattern of recklessness previously hidden, while the "lucky" driver might genuinely have been atypically careless that one time.

  3.  **The Scope of "Control":**
      *   **Effort vs. Capacity:** Your solution focuses on "effort." But what about inherent capacities? Two people might exert identical effort, but one has better reflexes, judgment, or emotional control due to innate ability or privileged upbringing (constitutive/circumstantial luck). Is the person with lesser capacity, trying just as hard, less blameworthy for a reckless act? Focusing *only* on effort introduces new forms of potential unfairness.
      *   **Foreseeability and Risk:** Recklessness involves *foreseeing* a risk of harm and disregarding it. While the *specific* pedestrian wasn't controlled, the *general risk* was known and accepted. Judging recklessness inherently involves judging the *disregard for potential outcomes*. Eliminating consequences entirely from judgment risks minimizing the moral significance of imposing risks on others.

  4.  **Social and Legal Function of Responsibility:**
      *   **Deterrence and Protection:** Legal systems and social norms need to discourage risky behavior *because* of the potential for catastrophic outcomes. Punishing only based on intent/effort, ignoring actual harm, might be seen as insufficiently deterring dangerous conduct. Society needs mechanisms to respond to *actual harm*.
      *   **Restoration and Accountability:** When harm occurs, there's a need (for victims, communities, and sometimes the perpetrator) for forms of accountability, restitution, or punishment that are proportionate to the *damage caused*. This function isn't easily satisfied by purely intent-based judgments.

  **So, are philosophers overcomplicating it?**

  *   **Logically/Purely in terms of *desert* based on control?** Your solution is powerful and arguably correct. Philosophers like Kant and Nagel (when describing the problem) agree the inconsistency is troubling. *For backward-looking blameworthiness based solely on what the agent could control*, your solution dissolves the core paradox.
  *   **In terms of describing the *full reality* of moral life, responsibility, and social practice?** No, they aren't overcomplicating it. The tension arises because:
      *   We value both control *and* consequences.
      *   We are psychological beings affected by outcomes, both as agents and judges.
      *   We live in a world where knowing pure intentions is hard, and preventing harm is paramount.
      *   Responsibility serves multiple complex functions beyond pure desert.

  **Conclusion:** You've identified the cleanest *theoretical* solution to the paradox of outcome luck. Judge solely by what was controlled (intention, effort, deliberation). **However, the "puzzle" of moral luck endures because this pure solution feels deeply unsatisfying and incomplete in the face of actual harm, our psychological responses, practical limitations in judging control, and the social needs that moral and legal responsibility address.** Philosophers grapple with this tension not to be obscure, but because it reveals fundamental complexities in our concepts of agency, blame, harm, and justice. The "fix" is logically sound in theory but creates significant friction when applied to the messy reality of human life. The puzzle persists because *both* perspectives (control matters most *and* consequences matter) have powerful claims on our moral intuitions and practices.
