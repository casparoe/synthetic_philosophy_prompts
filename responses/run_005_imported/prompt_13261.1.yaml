  Here's a joke structured as a short scene, hinging entirely on Goodman's "future discernment" argument and its convenient unfalsifiability:

  **Scene:** A dimly lit gallery storage room. TWO ART HISTORIANS, BRENDA (earnest, Goodman-esque) and LEO (skeptical, pragmatic), examine two identical-looking paintings side-by-side under a single work lamp.

  **LEO:** (Squinting, gesturing vaguely) Brenda, I've run every test we have. Pigments match Vermeer's known palette. Canvas weave, craquelure pattern, brushwork signature... it's *perfect*. Forger X's copy is perceptually indistinguishable from the *Girl With a Pearl Earring*. Admit it, aesthetically, they're equals *now*.

  **BRENDA:** (Shaking her head firmly) Leo, Leo... you're falling into the trap of present perception. Goodman was right. *Indistinguishable today* doesn't mean *aesthetically equivalent*. The *original* possesses intrinsic aesthetic properties *as Vermeer's handiwork*. We simply lack the perceptual framework to discern them *yet*.

  **LEO:** (Sighing, rubbing his temples) Right. The mystical, undetectable "Vermeer-ness" aura. Very convenient. So, how long do we wait for this future discernment to kick in? A decade? A century? What if it *never* happens?

  **BRENDA:** (With serene confidence) It *will*. It must. Authenticity *demands* it. Future connoisseurs, armed with insights and techniques we can't even imagine, *will* perceive the subtle, profound aesthetic superiority radiating solely from the original. The copy will forever lack that... *ontological resonance*.

  **LEO:** (Pauses, then walks over to a cluttered desk. He picks up two identical, unlabeled coffee mugs from a tray) Okay. Future discernment. Got it. (He hands one mug to Brenda). Here. Which one is *my* mug? The *original* one I drank from this morning?

  **BRENDA:** (Looks at the mugs, identical in every observable way. Hesitates.) Well... I... I can't tell them apart *now*, obviously. But...

  **LEO:** (Interrupting, a slow grin spreading) Ah! But *future* historians of caffeination, Brenda! With advanced saliva spectroscopy and tannin-pattern analysis we can't fathom *today*... they'll *undoubtedly* perceive the subtle, profound aesthetic superiority radiating solely from the mug that was *authentically sipped by Leo*! The copy will forever lack that... *ontological stain*.

  **BRENDA:** (Stares at the mug, then at Leo. Opens her mouth. Closes it. Looks back at the mug, frowning intensely, as if willing the future discernment to start *right now*.)

  **(FADE OUT)**

  **Why it works for this specific dispute:**

  1.  **Targets Goodman's Core Argument:** The joke explicitly names "future discernment," "ontological resonance," and the idea that indistinguishability *now* doesn't negate potential aesthetic difference *later* due to the work's origin (autographic nature).
  2.  **Highlights the Unfalsifiability:** Leo directly calls out the "convenience" of the argument – it can always defer proof to an unspecified future ("decade? century? never?"). Brenda's serene faith ("It *will*. It must.") underscores its non-empirical, almost dogmatic nature.
  3.  **Absurd Application:** The punchline applies the *exact same logic* (future discernment of undetectable "authentic sipping-ness") to a mundane object (a coffee mug). This reductio ad absurdum exposes how the argument, when detached from *current* perception or evidence, can be used to justify *any* distinction based solely on origin, rendering the concept of "aesthetic property" meaningless in the present. Leo weaponizes Goodman's logic against itself.
  4.  **Requires Understanding:** The humor relies entirely on recognizing Goodman's argument and its weaknesses. Someone unfamiliar with the "future discernment" defense wouldn't get why applying it to a coffee mug is funny or pointed. Brenda's flustered silence at the end is the realization of the logical trap she's in.
  5.  **Avoids Generic Fake Jokes:** It doesn't joke about the forgery being poorly done, the forger being clever, or the buyer being fooled. The *entire* comedic engine is the philosophical move itself and its implications when pushed.
