   R: (entering) What's this? Fitch's paradox? I see you've been teaching it. So, what do you make of it? It seems to me that this is a pretty strong argument against the anti-realist's knowability principle.

   A: Well, I'm not ready to abandon the principle. It's central to the anti-realist idea that truth is tied to our epistemic capacities. I think we can find a way to restrict the principle to avoid the paradox without gutting it.

   R: Okay, I'm listening. How do you propose to do that?

   A: One common move is to restrict the knowability principle to propositions that do not involve epistemic concepts. The problematic proposition in the proof is q ∧ ¬Kq, which is explicitly about knowledge. So if we limit the knowability principle to non-epistemic propositions, then we don't apply it to q ∧ ¬Kq and we avoid the contradiction.

   R: Hmm. But that seems ad hoc. Why should the principle hold only for non-epistemic truths? The anti-realist motivation, as I understand it, is that truth is not evidence-transcendent. But why would that only apply to non-epistemic truths? For example, consider the proposition "There are electrons." The anti-realist wants to say that if it's true, then it must be knowable. But now consider "There are electrons and nobody knows it." Why would that be allowed to be evidence-transcendent? It seems that if the anti-realist is motivated by the idea that truth is within our cognitive grasp, then that should apply to all truths, including epistemic ones.

