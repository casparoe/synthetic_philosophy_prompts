   A: So that won't work.

   R: It seems to me that any restriction that is motivated solely by the desire to avoid the paradox is ad hoc. The anti-realist needs a principled reason to restrict the principle. And that reason must come from the core of anti-realism.

   A: Maybe the core idea is that truth is constituted by what we can know. But then the proposition q ∧ ¬Kq is problematic because it attempts to state a truth that by its very content is beyond our knowledge. So the anti-realist can say: such propositions cannot be true because they assert their own unknowability. But wait, that's not right because q ∧ ¬Kq might be true. For example, if q is a truth that no one knows, then q ∧ ¬Kq is true.

