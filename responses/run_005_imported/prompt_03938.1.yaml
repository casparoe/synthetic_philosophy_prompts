   R: But that seems arbitrary. The proposition q ∧ ¬Kq is still a truth about the world and our knowledge of it. And it's a perfectly ordinary proposition. Moreover, the anti-realist is committed to the idea that every truth is knowable. If they start making exceptions, then they have to explain why those exceptions are acceptable. And if the exception is made solely to avoid Fitch's paradox, that's not independently motivated.

   A: Perhaps it is independently motivated. Think about it: the anti-realist wants to avoid the idea of truths that are in principle beyond our ken. But the proposition q ∧ ¬Kq is not beyond our ken in the same way. We can know it, but only if we don't know it? That's a peculiarity. So maybe the knowability principle should be restricted to propositions that are in principle knowable without such self-defeating conditions.

   R: But then the restriction is being motivated by the very paradox we are trying to avoid. That's circular. We need an independent reason to think that such propositions are not subject to the knowability principle.

   A: Okay, let me try another approach. What if we question the logic used in the derivation? The proof uses classical logic. But anti-realists often favor intuitionistic logic. In intuitionistic logic, we don't have the same rules. For example, step (6) uses the factivity of knowledge: K¬Kq → ¬Kq. That's fine. But the derivation of a contradiction leads to the conclusion that ◊K(q ∧ ¬Kq) is impossible, which then by classical logic allows us to conclude that there is no such q. But in intuitionistic logic, we might not be able to draw that strong conclusion.

