   Steps of the paradox:
    (1) KP: ∀p (p → ◊Kp)   [every truth is knowable]
    (2) Non-omniscience: ∃p (p ∧ ¬Kp)   [there is an unknown truth]
    (3) Let q be such a truth: q ∧ ¬Kq.
    (4) By KP: ◊K(q ∧ ¬Kq)
    (5) But K(q ∧ ¬Kq) entails (by distribution of K over ∧) Kq ∧ K¬Kq.
    (6) K¬Kq entails ¬Kq (because knowledge is factive: Kφ → φ).
    (7) So we get Kq ∧ ¬Kq, a contradiction.
    (8) Therefore, ◊K(q ∧ ¬Kq) is impossible, which contradicts (4) unless there is no such q.

   So the argument shows that if every truth is knowable then there are no unknown truths (i.e., omniscience).

   Now the dialogue:

