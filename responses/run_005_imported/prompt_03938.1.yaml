   Therefore, the intuitionist anti-realist must either deny non-omniscience or deny KP? But then we are back to the same problem.

   A: That's a point. But perhaps the intuitionist can reinterpret the knowability principle. Maybe the quantifier in the knowability principle should be understood intuitionistically. Or maybe the modality. But I see the problem.

   R: So it seems that the intuitionistic move doesn't block the contradiction. Therefore, the anti-realist must either abandon the knowability principle or accept omniscience. But omniscience is absurd, so they must abandon KP.

   A: But wait, there is another intuitionistic perspective. The step (6) in the derivation of the contradiction uses the distribution of knowledge over conjunction: K(A ∧ B) → (KA ∧ KB). That seems unassailable. But then we get KA and KB. Then for B = ¬Kq, we have K(¬Kq). By factivity, ¬Kq. But we also have Kq from the other conjunct. So Kq and ¬Kq. That's a contradiction. So the problem seems inescapable.

