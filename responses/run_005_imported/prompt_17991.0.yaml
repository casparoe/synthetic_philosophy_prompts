  Based on your framework, here's the classification with justifications. I've refined the categories slightly to align with biological signaling theory while preserving your core distinctions. Key adjustments:
  - **Strict handicap** remains defined by differential cost (higher marginal cost for low-quality individuals).
  - **Index signal** emphasizes physical constraints (impossible to fake).
  - **Fisherian runaway** requires trait evolution driven solely by sensory/cultural preference feedback loops.
  - **Commitment signal** focuses on demonstrating investment in group cooperation.

  ### Classifications
  1. **Peacock's train**: Fisherian runaway  
     *Justification*: While often misattributed as a pure handicap, empirical studies (e.g., Takahashi et al. 2008) show female preference drives trait exaggeration beyond survival utility, fitting runaway criteria. *Contested*: Yes (handicap proponents cite condition-dependent costs).

  2. **Stotting by gazelles**: Strict handicap  
     *Justification*: High jumps waste energy and increase predation risk, but only fit gazelles afford this cost to signal unprofitability to predators (Caro 1986); low-fitness cheats are filtered out.

  3. **Low pitch of red deer stag's roar**: Index signal  
     *Justification*: Pitch directly correlates with larynx size and testosterone levels (Reby & Charlton 2012), making it physiologically impossible for smaller/weaker stags to fake.

  4. **Expensive watch**: Strict handicap  
     *Justification*: Cost disproportionately burdens less-wealthy individuals (Veblen effect), honestly signaling economic capacity (Nelissen & Meijers 2011).

  5. **Religious fasting/tithing**: Commitment signal  
     *Justification*: Costs (e.g., food/money sacrifice) demonstrate loyalty to in-group norms, fostering trust and deterring free-riders (Sosis 2003).

  6. **Elite university degree**: Strict handicap  
     *Justification*: Tuition/time costs are more easily borne by high-aptitude individuals (lower opportunity cost), signaling ability to employers (Spence 1973 signaling model).

  ### Contested Cases
  - Only **peacock's train** is flagged as contested. While your framework distinguishes Fisherian runaway, some biologists (e.g., Zahavi 1975) argue condition-dependent costs maintain honesty, blending runaway and handicap mechanisms.

