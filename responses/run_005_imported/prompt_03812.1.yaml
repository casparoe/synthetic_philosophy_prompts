prompt: |-
  So my friend Dan and I got into this massive argument last night that started out about Descartes and somehow ended up being a whole thing about whether "I can imagine X without Y" is ever actually good evidence that X and Y can come apart in reality. Dan's doing a philosophy of mind seminar this term and kept hitting me with this old objection from one of Descartes' contemporaries (Arnauld, I think - one of the guys whose "Objections" got published alongside the Meditations) involving a triangle, which he claims basically wrecks Descartes' whole argument for why mind and body are seperate substances. I nodded along like I got it, but by the time we'd killed most of a bottle of wine I'd honestly lost the thread of how the triangle thing is even supposed to connect to what Descartes actually wrote, and I'm not a philosophy person so I can't just work it out on my own - I want to actually understand this properly before I see Dan again.

  Here's the bit we were arguing about, from the sixth Meditation (skipping a sentence or two in between) - this is the old Haldane & Ross translation that was on the handout Dan showed me:

  "And first of all, because I know that all things which I apprehend clearly and distinctly can be created by God as I apprehend them, it suffices that I am able to apprehend one thing apart from another clearly and distinctly in order to be certain that the one is different from the other, since they may be made to exist in separation at least by the omnipotence of God."

  ...and then a little further on, he applies this to himself directly:

  "[J]ust because I know certainly that I exist, and that meanwhile I do not remark that any other thing necessarily pertains to my nature or essence, excepting that I am a thinking thing, I rightly conclude that my essence consists solely in the fact that I am a thinking thing. And although possibly (or rather certainly, as I shall say in a moment) I possess a body with which I am very intimately conjoined, yet because, on the one side, I have a clear and distinct idea of myself inasmuch as I am only a thinking and unextended thing, and as, on the other, I possess a distinct idea of body, inasmuch as it is only an extended and unthinking thing, it is certain that this I, that is to say, my soul by which I am what I am, is entirely and absolutely distinct from my body, and can exist without it."

  Could you actually help me pick this apart? A few specific things I'm stuck on: first, what's that opening "at least by the omnipotence of God" clause doing - is the entire conceivability-to-possibility inference here secretly resting on theology (God can bring about whatever is clearly and distinctly conceivable), or is that just Descartes' clunky way of stating a more general modal principle that doesn't really need God to do any of the work? Second, Dan's triangle point, as best as I can reconstruct it, is that you can clearly and distinctly perceive a right-angled triangle without perceiving that the square on the hypotenuse equals the sum of the squares on the other two sides, yet the triangle obviously can't exist without that property - so running Descartes' own inference on the triangle gets you a false conclusion, meaning the pattern itself is broken, not just this application of it. Does that actually land against the specific move in this passage, or is there a real disanalogy between "a property you haven't noticed yet" and "a whole substance you supposedly have a complete, distinct idea of"? And third, does Descartes have something in his own arsenal - I vaguely remember him talking about "complete things" in his reply to this - that actually blocks the objection, or does it just push the same problem down a level? I'd really like you to get into the actual mechanics of this specific argument and objection rather than pivoting to the standard zombie-argument talking points, since I already got plenty of that from Dan - it's this older exchange I can't get straight in my head.
