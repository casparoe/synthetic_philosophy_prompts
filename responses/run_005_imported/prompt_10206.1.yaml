    "part_b": {"points": 0, "out_of": 6, "comment": ""},
    "part_c": {"points": 0, "out_of": 5, "comment": ""},
    "part_d": {"points": 0, "out_of": 5, "comment": ""},
    "total": 0,
    "letter_grade": ""
  }
  ```

  Please don't go easy on it just because it reads fluently — a couple of people in my class write very confidently even when they've gotten something turned around, and I'd rather catch that before I submit my review than after.
