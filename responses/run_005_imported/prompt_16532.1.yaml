answer: |-
  ## The Limits of Purpose: Why Teleosemantics Fails to Fully Naturalize Mental Content

  Teleosemantics offers an elegant, biologically grounded solution to the problem of naturalizing intentionality. By anchoring mental content in the *proper function* of a state – what it was evolutionarily selected *to do* (e.g., track flies, avoid predators, secure mates) – it promises to explain both successful representation and misrepresentation without invoking mysterious, non-natural properties. A frog's visual state triggered by a BB pellet misrepresents *because* its proper function is detecting flies, not pellets, and it fails in that function. The appeal is undeniable, especially for basic biological indicators. However, two profound objections – the Disjunction/Indeterminacy Problem and Davidson's Swampman – expose fundamental limitations, suggesting teleosemantics cannot, on its own, provide a complete naturalistic account of mental content, particularly for the rich intentionality of human minds.

  **Deepening the Disjunction/Indeterminacy Problem: The Ghost in the Selection Machine**

  The core issue is that evolutionary selection is inherently coarse-grained and pluralistic. Traits are selected *for* their effects, but these effects are often described at multiple, equally valid levels of abstraction. Why does the frog's detector represent "fly" rather than:

  1.  **"Small, dark, moving thing"?** This is the proximal stimulus pattern that reliably correlated with flies in the EEA (Environment of Evolutionary Adaptedness). Selection operated directly on the detector's response to *this* pattern, as it was sufficient for catching flies. There was no selection *for* distinguishing flies from BB pellets, only for responding to the pattern that *usually* meant "fly".
  2.  **"Food"?** The ultimate *biological* function of catching flies is to obtain nutrition. The detector was selected because it contributed to securing *food*. Representing "food" captures this ultimate selective advantage.
  3.  **"Nutrient-rich airborne biological entity"?** A more scientifically accurate description of the relevant class in the frog's niche.
  4.  **"Fly-or-BB-pellet-like thing"?** Teleosemantics defines proper function by what the mechanism was selected *to do* in the past. Since BB pellets didn't exist, the mechanism was only ever selected to respond to things *like* flies (which includes BB pellets in terms of the triggering stimulus). On this reading, the state *correctly* represents BB pellets as well! Misrepresentation seems to vanish.

  **Teleosemanticist Replies & Their Shortcomings:**

  *   **Millikan's Local Natural Signs:** Ruth Millikan argues that content is fixed by the specific *correlations* in the environment that explain the mechanism's survival and reproduction. The mechanism was selected because it co-varied with *flies* (nutrient sources), not just any small dark moving thing (which might be irrelevant debris) or food in general (which could be stationary). The content is the most *specific* explanatorily relevant feature in the causal chain – flies themselves. However, critics argue that "specificity" is imposed by the theorist. Evolution only "cares" about fitness contributions. The correlation that *actually* drove selection was between the detector state and the presence of *nutrients* acquired via *catching small dark moving things*. Why privilege "fly" over "nutrient-acquisition-trigger"?
  *   **Papineau's Consumer-Based Teleology:** David Papineau emphasizes the *consuming* system. The content is what the state is *supposed* to indicate *to the systems that use it*. The frog's tongue-flicking mechanism "consumes" the detector state *as an indication of a catchable food item*. Therefore, the content is "catchable food item here now". This seems to favor "food" or "prey" over "fly". While this might resolve the fly/BB-pellet case (the pellet isn't food), it exacerbates indeterminacy: is it "food", "catchable object", or "nutrient source"? The consuming system likely evolved for a general function.
  *   **Neander's Hierarchical Selection:** Karen Neander suggests looking at the *hierarchy* of selection. While the *ultimate* function is nutrition, the *proximal* function of the detector itself is to detect *flies* (or fly-like stimuli), as that is the specific task it was designed to perform within the larger system. The malfunction occurs at the detector level when it fires without the proximal stimulus being caused by a fly. This offers some resolution, but the problem recurs at the level of defining the "proximal function." Was it selected to detect flies, or dark moving specks, or retinal patterns? Selection pressures operate simultaneously at multiple levels.

  **The Human Cognition Challenge:** The problem explodes with human cognition. Consider a belief about water. Was the underlying cognitive mechanism selected for tracking H2O, or potable liquid, or thirst-quenching stuff, or clear liquid in rivers and lakes? Our concepts for "electron," "justice," or "unicorn" have no clear evolutionary history at all. Teleosemantics struggles to explain how the content of abstract, theoretical, or fictional concepts is fixed solely by evolutionary proper function. Learning and cultural evolution introduce new "functions" not directly tied to biological selection, further muddying the waters.

  **Deepening Swampman: The Specter of the Accidental Mind**

  Davidson's Swampman is a devastating *reductio ad absurdum*. If Swampman is a physically identical duplicate of a human, created by a lightning strike rearranging swamp molecules, teleosemantics dictates he has no mental states. He lacks any evolutionary history (no ancestors, no selection) and, assuming instantaneous creation, no learning history either. Therefore, his brain states have no proper functions. There is nothing they *were selected to do*. Consequently, they represent nothing. Yet, by hypothesis, Swampman behaves exactly like a person: he speaks English, avoids danger, solves problems, and claims to have beliefs and desires. Intuitively, he *must* have mental content.

  **Teleosemanticist Replies & Their Insufficiency:**

  *   **Biological Essence over Instantiation:** Millikan argues that Swampman isn't a member of the human *biological kind*. Mental states are properties of biological systems *with* evolutionary histories. Swampman is a freak, a one-off, lacking the essential historical property. Therefore, he lacks genuine intentionality, no matter how similar he seems. This reply sacrifices a powerful intuition – that identical structure *should* yield identical function and content *now* – to save the theory. It makes mentality mysteriously historical in a way that seems disconnected from current causal powers.
  *   **Incorporating Learning History (Papineau):** Papineau extends "proper function" to include functions acquired through individual learning and cultural transmission. However, Swampman, created instantaneously, has *no* history – no evolutionary history *and* no learning history. He has never interacted with the world. Papineau's move helps with learned human concepts but offers no solace for Swampman.
  *   **System-Derived Function (Neander/Dretske):** Perhaps functions can arise from the role a state plays *within* the duplicate system itself at the moment of creation, even without history. However, this radically departs from core teleosemantics. Proper function is defined *historically* by selection. A state's current causal role within a system might indicate *what it is doing*, but not *what it is supposed to do* according to teleosemantics. Without history, there is no "supposed to."

  Swampman highlights that teleosemantics makes history *constitutive* of content in a way that severs the tight link we intuitively hold between current physical structure/function and mentality. If two identical physical systems, differing only in origin (one evolved, one accidental), have radically different mental properties (rich content vs. none), then content seems oddly extrinsic and disconnected from the machinery that realizes it *here and now*. This challenges the very project of naturalizing the mind within the current physical world.

  **Verdict: A Partial Victory, Not a Complete Naturalization**

  After weighing the objections and replies, the conclusion is unavoidable: while teleosemantics makes significant strides in naturalizing mental content for *basic biological indicators and drives*, it **fails to provide a sufficient, standalone naturalistic account of full-blown human intentionality.** The Disjunction Problem reveals an in-principle indeterminacy inherent in grounding content solely in selective history. Evolution selects for fitness contributions, not for carving the world at precise conceptual joints like "fly" versus "small dark moving thing," let alone "justice" or "electron." The strongest replies (Millikan's local signs, Neander's hierarchy) mitigate but do not eliminate this indeterminacy, especially as we ascend to human cognition involving abstraction, theory, and culture.

  Swampman delivers the *coup de grâce* to any claim of teleosemantics being a *complete* theory. Its insistence on historical proper function as the sole ground of content forces an intolerable conclusion: an entity physically and functionally identical to a thinking being, differing only in lacking a history, would be utterly mindless. This violates a core principle of supervenience – that mental properties depend solely on current physical properties. While teleosemanticists might bite this bullet (Millikan), doing so exposes a fatal flaw; it makes genuine intentionality inexplicably dependent on origins in a way that seems irrelevant to current cognitive capacity. A theory of content that cannot accommodate Swampman's intuitive mentality fails to capture the essence of what we mean by "aboutness."

  **Therefore, teleosemantics succeeds admirably in its core domain:** providing a naturalistic, selection-based account of misrepresentation and grounding the content of evolutionarily ancient perceptual, motivational, and simple cognitive states in organisms like frogs. It offers a crucial piece of the puzzle. **However, it cannot, on its own, naturalize the full spectrum of human mental content.** The richness, determinacy, and historical independence of human thought require additional resources. A complete naturalization will likely need to be **pluralistic**, incorporating:

  1.  **Teleosemantics for Basic Biology:** Explaining innate drives, simple perceptions, and emotions.
  2.  **Inferential Role Semantics:** Accounting for the content of complex concepts via their relations within a cognitive system (mitigating indeterminacy for abstract concepts).
  3.  **Social Externalism (a la Burge):** Grounding content partly in social practices and linguistic norms (addressing learned and cultural concepts).
  4.  **Causal/Informational Theories (refined):** Playing a role in fixing reference, perhaps integrated with historical function where available.

  Teleosemantics is not a dead end; it is a vital, foundational layer. But the Disjunction Problem and Swampman demonstrate that the edifice of human thought cannot be built upon this historical bedrock alone. Mental content, especially as experienced by humans, is a multi-faceted phenomenon demanding a multi-faceted naturalistic explanation. Teleosemantics provides powerful tools for part of the job, but claiming it completes the project overreaches its grasp.
