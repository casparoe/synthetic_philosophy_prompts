answer: |-
  You've hit the nail on the head – the Dollar Auction is a brilliant and brutal model for exactly your situation, and your frustration with the "sunk cost fallacy" explanation is justified. While sunk costs *are* incurred, the *mechanism* of escalation is driven by the **perverse payoff structure and strategic uncertainty**, making escalation appear rational step-by-step even for fully rational players. Here's the breakdown:

  **The Dollar Auction Mechanics:**

  1.  **Rules:** An auction is held for $1 (or any fixed prize, V).
  2.  **Crucial Twist:** *Both* the highest bidder *and* the second-highest bidder must pay their final bids, but *only* the highest bidder gets the prize.
  3.  **Bidding:** Bids increase in small increments (e.g., $0.05). Players bid sequentially.

  **Why Escalation Feels Rational Step-by-Step (The Trap):**

  Imagine the bidding is at $0.95 (Bidder A) vs. $0.90 (Bidder B - you).

  *   **Bidder B's Perspective (You, at $0.90):**
      *   **If you drop out:** You lose $0.90 (pay as second-highest) and get nothing. **Net Loss: $0.90**
      *   **If you bid $1.00:** You risk $1.00. If A drops out, you win the $1.00 prize. **Net Gain: $0.00** (You broke even on the bid, but you *avoided* the $0.90 loss!).
      *   **Perceived Choice:** Lose $0.90 *for sure* vs. a chance to break even ($0.00 net) *if* A drops out. Bidding $1.00 seems strictly better *at this moment*.

  *   **Bidder A's Perspective (At $0.95):**
      *   **If A drops out:** They lose $0.95 (as second-highest). **Net Loss: $0.95**
      *   **If A bids $1.05:** They risk $1.05. If B drops out, A wins $1.00. **Net Loss: $0.05** (But they *avoided* the $0.95 loss!).
      *   **Perceived Choice:** Lose $0.95 *for sure* vs. a chance to only lose $0.05 *if* B drops out. Bidding $1.05 seems strictly better *at this moment*.

  **The Crux:** At *every* stage where one player is the current high bidder (H) and the other is the current second-highest (S), player S faces:
  *   **Drop Out:** Lose their current bid (S) for sure. **Loss = S**
  *   **Bid (H + increment):** Risk losing (H + increment) *if* the other player outbids them again, but gain the prize (V) *if* the other player drops out. **Net Gain *if win* = V - (H + increment)**

  **The Trap Tightens:** As bids escalate (H increases), the *difference* between the sure loss (S) and the potential loss even if you win (V - H - increment) shrinks. But crucially, **as long as (V - H - increment) > -S**, bidding *appears* rational for S because the *potential* outcome (if H drops out) is better than the *guaranteed* outcome of dropping out. Specifically:
  *   Bidding is *strictly dominant* for S if: **V - H - increment > -S** (The potential net gain if H drops out is better than the guaranteed net loss if S drops out).
  *   Rearranged: **H < V + S - increment**

  **Nash Equilibria and the Role of Limits/Common Knowledge:**

  This is where your intuition about spending limits and common knowledge is spot on.

  1.  **No Limits / Unknown Limits (The Realistic Trap):** If players do *not* know each other's maximum spending limits (or valuation for winning, which includes emotional/principle value in your case), the game has **no pure-strategy Nash equilibrium** in the escalating phase. Why?
      *   Each player knows that escalating *might* make the other drop out *next round*.
      *   Because they don't know the other's breaking point, they keep hoping the next bid will be the last one the opponent is willing to make.
      *   **Result:** Escalation continues *past* the value of the prize (V) because the *avoidance of the sunk loss (S)* becomes the immediate driver. Players are trapped in a cycle where the next bid always seems rational *given the current sunk costs*. This is the "escalation trap" you're experiencing. Fully rational players *can* and *do* get trapped here due to **strategic uncertainty**.

  2.  **Common Knowledge of Limits (The Theoretical Escape):** Suppose it's **common knowledge** that Player A has a maximum bid of `M_A` and Player B has a maximum bid of `M_B`, and these are both less than or equal to V (the prize value). Assume `M_A > M_B` for simplicity.
      *   **Backward Induction Works:** Rational players look ahead.
      *   Player B knows they will *never* win if `M_A > M_B` because A can always bid just above B's max.
      *   **Rational Play:** Player B, knowing they will lose if they bid, should **bid $0**. Player A then bids $0.05 (or the minimum increment) and wins the dollar for $0.05. The prize is captured cheaply at the start.
      *   **Why?** Bidding anything positive (`S > 0`) guarantees B loses `S` as the second-highest bidder (since A can always outbid them). B's best response to A's ability to always outbid is to not incur any cost (`S = $0`) by not bidding at all.
      *   **Equilibrium:** (A bids min increment, B bids $0). A wins V for min cost. B pays $0, gets $0.
      *   **If `M_A` and `M_B` > V:** The logic gets messier, but crucially, *with common knowledge*, players can potentially coordinate (implicitly through rationality) to avoid the trap. They recognize that escalating past V is mutually destructive. However, multiple equilibria might exist, including inefficient ones where escalation still occurs if one player *threatens* to bid high. The key insight is that **common knowledge of limits *enables* rational players to avoid the trap through foresight.**

  **Applying it to Your Situation (Mom's House):**

  1.  **The Prize (V):** The net value of the house *to you* (market value minus what you'd pay the other sister, or the emotional/principle value minus the financial cost). Crucially, this V is being *eroded* by legal fees.
  2.  **The Sunk Costs (S):** The legal fees each of you has *already* spent. These are sunk, but the auction structure forces the *loser* to pay their bid (fees) and get nothing.
  3.  **Unknown Limits:** You likely don't know your sister's true maximum willingness to spend (her `M_sis`), nor does she know yours (`M_you`). This includes financial resources, emotional attachment, stubbornness, and principle.
  4.  **The Trap:** At *each* stage (each new legal bill, each court date):
      *   You (as the current "second-highest" in terms of potential loss) face: **Drop out now = Lose `S_you` (your sunk fees) for sure. Continue = Risk more fees (`S_you + new_fees`) but have a *chance* to win the house (V) *and avoid losing `S_you` as the "second-highest bidder" (loser)**.
      *   The calculation `(Potential Value of Winning) - (New Cost)` vs `(Guaranteed Loss if Quit)` makes continuing *seem* rational, even if `V - Total_Spent_So_Far` is negative. You're fighting to avoid crystallizing the sunk loss.
  5.  **Why "Sunk Cost Fallacy" is Inadequate:** It labels the behavior as irrational without explaining *why* the structure creates the *perception* of rationality at each decision point. The dollar auction shows that the *payoff structure itself* incentivizes throwing good money after bad to avoid admitting the sunk loss, *even with foresight*, unless limits are known.

  **Conclusion:**

  Your escalation is primarily driven by **the perverse payoff structure of the "auction" (both winner and loser pay) combined with a lack of common knowledge about spending limits (M_you, M_sis)**. This strategic uncertainty makes it rational at each step to bid/continue, hoping the *next* payment will be the one that makes the other side drop out, allowing you to "win" and avoid the guaranteed loss of your sunk costs. Fully rational players *can* get trapped in this dynamic.

  The theoretical escape hatch (**common knowledge of limits**) is practically impossible in emotionally charged family disputes like yours. The only truly rational move *now* is for both of you to recognize this trap, ignore the sunk costs, and negotiate a settlement (e.g., sell the house and split the proceeds minus legal fees, or one buys out the other at a price reflecting *current* net value) before the remaining value is completely destroyed. This requires a mutual, conscious decision to break the game theory trap by changing the rules (negotiation) rather than continuing the auction (litigation). Mediation focused on future costs, not past spending, is your best bet.
