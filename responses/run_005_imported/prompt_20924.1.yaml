  Ok this is a little embarrassing but my sister and I have now spent more on lawyers fighting over mom's house than the house is even worth, and neither of us will drop it because that would mean everything we already spent was for nothing. My husband said this is basically "the dollar auction" thing from game theory, that whole escalation of commitment trap, and now I'm way down a rabbit hole about it. Every pop explanation I find just says people get caught by the sunk cost fallacy, but that feels like it dodges the actual mechanism. Isn't raising your bid, at least for a while, the individually rational move given what the other bidder just did? You're out that money either way once you're in second place. I vaguely remember reading that some game theorist showed that if both side's spending limits were common knowledge, a fully rational player would just drop out immediately instead of escalating at all, kind of like backward induction in the centipede game. So which is it: is real-life escalation basically a failure of common knowledge about the other side's limits, or is there something about the payoff structure itself that traps people even when they're being fully rational and know the other side is too? I want the actual game theory mechanics here, not the sunk-cost hand-wave.
