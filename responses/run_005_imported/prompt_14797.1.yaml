  First, I need to unpack both sides. The strongest pro-analogy argument would emphasize that evolution "selects for" traits that historically boosted fitness, but now, in modern environments, those same traits lead to fitness-reducing behaviors. That's similar to proxies going haywire when the environment changes. The key point here is that evolution operates on proxies (like neural mechanisms for pleasure) that correlate with fitness, but aren't fitness itself.

  On the other hand, the anti-analogy side stresses that without an optimizer or representations, Goodhart's categories don't cleanly apply. Natural selection isn't "pursuing" a goal; it's just filtering based on survival and reproduction. The four failure modes—regressional, extremal, causal, adversarial—all imply some intentional optimization or representation, which evolution lacks. For example, adversarial Goodhart needs a strategic agent, which evolution doesn't have.

  Now, which of the four Goodhart modes survive translation? Regressional might fit because selecting on a proxy (like a hormone level) could lead to changes that don't improve fitness. Extremal works too—pushing a trait to extremes (e.g., huge antlers) backfires. Causal is tricky; if a proxy is only correlated via a shared cause, manipulating it might not help, but evolution doesn't "manipulate," it selects. Adversarial clearly doesn't apply because no other agents are gaming the system.

  The user's deeper need seems to be clarity on whether this analogy is scientifically valid or just a catchy metaphor. They might want to use it in their own arguments but don't want to propagate a misconception. They're likely well-read in rationalist literature but wary of oversimplification.

  So, the verdict: the analogy is a metaphor, not a literal application. It's useful heuristically to explain modern mismatches, but calling it "Goodharting" is category slippage. The substantive core is about proxy-target decoupling in novel environments, which aligns with extremal and regressional aspects. However, framing evolution as an optimizer misrepresents its mechanistic nature.
answer: |-
  ## The Goodharting of Fitness: A Category Error in Evolutionary Clothing

  The analogy of evolution "Goodharting on fitness" has become a rhetorical staple in rationalist discourse, vividly framing modern maladaptations as biological proxy failures. While compelling, this framing fundamentally misrepresents the structure of natural selection by anthropomorphizing a blind process. A careful analysis reveals it as a category error masquerading as biology, though it captures a *related* evolutionary phenomenon through a metaphorical lens. Let's weigh the strongest arguments.

  **The Case For: Evolution as Implicit Optimizer**

  Proponents argue natural selection *implicitly* optimizes for inclusive fitness. Genes coding for traits (proxies) that *correlated* with fitness in ancestral environments (e.g., dopamine response to sugar, testosterone-driven status pursuit) proliferated. The "specification" isn't conscious but is embodied in the genetic architecture shaped by past selection pressures.

  *   **Strongest Argument:** The core insight – that traits selected *because* they correlated with fitness in Environment A can become maladaptive in Environment B where the correlation breaks – is robust biology. Modern environments (junk food, social media, contraception) represent a drastic shift, decoupling the proxy (e.g., sugar craving) from the original evolutionary target (caloric sufficiency for survival/reproduction). This *looks* like Goodhart: the proxy is "gamed" by the new environment, leading to outcomes counter to the "goal" (fitness). The analogy powerfully highlights the vulnerability of historical correlation to environmental perturbation.

  **The Case Against: The Blind Watchmaker Isn't an Optimizer**

  Critics argue Goodhart's Law *requires* an optimizer with a *representation* of a goal and a *deliberate choice* to use a proxy. Natural selection possesses neither:

  1.  **No Representation:** Evolution has no internal model, no "goal state" of fitness it is trying to achieve. Fitness is an *emergent outcome* of differential survival and reproduction, not a represented target.
  2.  **No Agency, No Pursuit:** There is no "optimizer" making decisions. It's a statistical filter: variants causing higher replication rates in the *current* environment automatically increase in frequency. It doesn't "pursue" fitness using proxies; it merely *reflects* the aggregate success of whatever variants happened to exist and replicate.
  3.  **No "Gaming":** The environment isn't "gaming" anything. It simply *is*. Changes in the environment alter the survival/reproduction consequences of existing traits. Traits that were advantageous become neutral or detrimental. There's no adversarial intent.

  **Applying the Four-Way Taxonomy to a Blind Process**

  Evaluating the standard Goodhart failure modes against natural selection's structure reveals the category error:

  1.  **Regressional Goodhart (Noisy Proxy):** *Does Not Apply Cleanly.* Regressional Goodhart assumes optimizing a *measured* proxy with error leads the true goal to regress towards its mean *due to the noise being selected*. Natural selection doesn't "measure" a proxy; it acts directly on phenotypic effects. If a trait has multiple effects (some fitness-enhancing, some neutral/noisy), selection acts on the *net* effect. There's no separate "proxy measurement error" being selected for. The core issue (correlation breakdown) is present, but the *mechanism* (selection on measurement noise) is absent.
  2.  **Extremal Goodhart (Pushing Proxy Too Far):** *Survives Translation, But as a Consequence, Not a Failure Mode.* Natural selection can favor extreme values of a trait (e.g., enormous antlers, runaway sexual selection) that become detrimental when pushed beyond a point where the original fitness correlation reverses (e.g., antlers impede survival). However, this isn't because an optimizer "pushed too hard" based on a proxy; it's because selection *within the environment at that time* favored that extreme, even if it became maladaptive later or under different constraints. The *outcome* resembles extremal Goodhart, but the *process* lacks the optimizer's intent to "push."
  3.  **Causal Goodhart (Proxy Correlated Only via Shared Cause):** *Survives Translation as a Core Evolutionary Principle.* This is perhaps the closest fit. Traits are often selected because they correlate with fitness via a shared underlying cause (e.g., a hormonal pathway influencing both libido and immune function). If you directly manipulate the proxy (libido via contraception) without affecting the shared cause (or in a way that disrupts the causal chain), you decouple it from the original fitness outcome (reproduction). Evolution "fell for" this correlation in the past. This decoupling in novel environments is a fundamental source of evolutionary mismatch. **This is the one mode where the analogy holds substantial mechanistic weight.**
  4.  **Adversarial Goodhart (Strategic Gaming):** *Does Not Apply, Even in Principle.* This mode absolutely requires a strategic adversary aware of the proxy and intentionally manipulating it. Natural selection has no adversaries in this sense. Other species co-evolving (e.g., predators/prey) are adapting to *their own* selective pressures, not "gaming" their opponent's fitness proxy. Humans manipulating their *own* biology (e.g., using contraception) are not adversaries to natural selection; they are agents *escaping* its constraints, altering the environment of *future* selection. The "gaming" metaphor here is entirely misplaced.

  **The Verdict: Metaphor, Not Mechanism**

  "Evolution Goodharted on fitness" is **primarily a category error dressed up as biology.** It inaccurately imposes the framework of a goal-directed, representational optimizer with agency onto a fundamentally blind, non-representational statistical filtering process. Natural selection does not "specify," "target," "pursue," or get "gamed." It simply *is*, and its outcomes change as environments change.

  However, the analogy captures a **profoundly important *biological truth* metaphorically:** the inherent vulnerability of adaptations built on historical correlations between traits (proxies) and fitness outcomes. When environments shift radically, these correlations can catastrophically decouple, leading to maladaptive outcomes. **Causal Goodhart** provides the most legitimate conceptual bridge, describing how traits correlated via shared causes can become decoupled. **Extremal Goodhart** describes a frequent *outcome* (runaway selection leading to maladaptation) but misattributes its *cause* to an optimizer's intent rather than the dynamics of selection itself.

  **The Substance Within the Error:**

  The *substantive core* of the analogy is not Goodhart's Law per se, but the well-established evolutionary concepts of:
  *   **Historical Constraints & Path Dependence:** Evolution works with what exists, leading to suboptimal or fragile solutions.
  *   **Environmental Mismatch:** Adaptations tuned to past environments fail in novel ones.
  *   **Correlational Decoupling:** Traits selected for one effect (or correlation) can have different or opposite effects under new conditions.
  *   **Trade-offs & Pleiotropy:** Traits often have multiple effects; optimizing for one can inadvertently harm another fitness component.

  **Conclusion:**

  While "evolution Goodharted on fitness" is a vivid and rhetorically useful *metaphor* for highlighting the perils of environmental change on evolved adaptations, it is not a *substantive, non-metaphorical claim* about the structure of natural selection. It commits a category error by attributing agency, representation, and goal-directed optimization where none exist. Of the four Goodhart failure modes, only **Causal Goodhart** translates meaningfully into evolutionary dynamics, explaining how traits linked via shared causes can become maladaptive when manipulated directly. **Extremal Goodhart** describes a common outcome but misrepresents its cause. **Regressional** and especially **Adversarial Goodhart** fail entirely to map onto the agent-free process of natural selection. The power of the analogy lies in its intuitive grasp of evolutionary mismatch, but its explanatory framework is biologically misleading. The real story is the fragility of historical correlations in the face of environmental change, not an optimizer being tricked by its own proxy.
