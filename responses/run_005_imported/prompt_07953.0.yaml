  I'm taking an intro cognitive science course, and last week we spent a lecture on the Turing test. At one point my professor mentioned that Turing's original 1950 paper actually has this section where he takes telepathy pretty seriously - like he talks about the statistical evidence for it being strong and gets into how it would mess with the imitation game setup. I raised my hand and said that seemed backwards to me, since Turing was literally the guy who out-logic'd the Nazis at Bletchley and basically invented computer science - surely he was just using ESP as a throwaway example of unfalsifiable nonsense, the kind of thing a properly rational machine (or person) should reject out of hand, not something he actually thought had real evidence behind it. She just kinda smiled and said 'go check the text' instead of answering me directly, which was mildly annoying.

  So now I want to nail this down before next class instead of just dropping it. Am I basically right that Turing was being sarcastic or using ESP as a rhetorical strawman to make a point about the limits of the imitation game, and my professor was just being cagey for fun? Or is there actually something to what she said? And if its the second thing, I'm kind of curious how a guy that rigorous ended up taking something like telepathy seriously at all - that seems like a pretty big crack in the whole 'father of AI as pure logician' image I had of him.
