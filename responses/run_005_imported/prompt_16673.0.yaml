  This is tricky because I need to anticipate how a serious Cartesian would actually respond, not strawman positions. The follow-ups must close off escape routes - for example, if they say infants have souls, asking how we'd know animals don't. The ethical question about vivisection is particularly powerful because historical accounts suggest Descartes himself was uncomfortable with the implications.

