  I'm interviewing a guest on my history-of-philosophy podcast who defends the hardline Cartesian position that non-human animals are pure automata -- no feelings, no pain, nothing it's like to be them, just mechanism. Draft me 8-9 questions that push past the standard talking points: one on the language/action test from Part V of the Discourse on the Method (showing an animal can't use words flexibly proves it lacks reason -- but does that really prove zero sentience?), one on the letter to Henry More where Descartes seems to grant animals a kind of 'sensation' tied to bodily organs while still denying them 'thought,' which sounds like its conceding more than strict automatism, and one on why that same 'no flexible, general-purpose reasoning' test for inner life doesn't also strip feeling from infants or severely cognitively disabled humans. Give each one a follow-up keyed to whatever reply a committed Cartesian would actually give.
