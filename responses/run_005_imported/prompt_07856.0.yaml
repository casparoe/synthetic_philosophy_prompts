prompt: |-
  Quick one -- I help edit a small literary quarterly as a favor to a friend who runs it (mostly I write novels). We're stuck on a submission and I said i'd sort out a memo since nobody else will. The writer's cover letter admits she used AI pretty heavily: she'd describe a character, ask it to 'write in this person's voice,' then cut and rewrite what came back over several rounds. Some editors say that's fine -- it's a tool she steered, so the story's entirely hers. Others say once you're asking something to inhabit a voice and generate prose as that persona, its functioning as a co-author with its own take on the character, and our guidelines only take single-human-authored work. A third editor thinks both framings are wrong -- that it isn't a tool or an agent here so much as its simulating what an author would write, which is its own separate problem for a fiction magazine, closer to uncredited ventriloquism than either tool-use or co-authorship. Can you draft the short memo that settles this -- a straight accept/reject/accept-with-conditions on the story, plus a rule we can point to next time -- and be fair to whichever camp turns out wrong?
reasoning: |-
  Okay, the user needs a memo to resolve an editorial dispute about an AI-assisted submission. They're a novelist helping a small literary quarterly, and the team is split on whether the writer's AI use constitutes tool-use, co-authorship, or simulated authorship. 

  Hmm, the core tension here is between artistic integrity and technological pragmatism. The writer openly admitted using AI to generate character voices through iterative prompting and rewriting - that's unusually transparent, which complicates things. The editors' positions reveal deeper anxieties: one camp fears devaluing human craft, another worries about gatekeeping progress, and the third seems concerned about authenticity itself. 

  Right, the user needs both a decision and a precedent. They're clearly time-pressed ("quick one") but want fairness to all viewpoints. Interesting that they mention "whichever camp turns out wrong" - suggests they anticipate backlash. The memo must feel principled yet diplomatic. 

  Breaking this down: First, the rejection can't be about quality since they haven't mentioned reading the story. It's purely about process. Second, the policy needs to draw bright lines while acknowledging gray areas. Third, "fairness" here means respecting each argument's logic without endorsing it. 

  Ah, the ventriloquism metaphor from the third editor is useful - it frames AI not as creator but as mimic. That resonates with literary values. But outright banning all AI might alienate writers experimenting ethically. Need middle ground... perhaps banning generative use while allowing editing tools? 

  Wait, the key is distinguishing between generative and assistive use. The writer didn't just edit AI output; she initiated creation through it. That crosses into territory where the machine's training data (others' voices) bleeds into "original" work. For a literary magazine valuing singular human voice, that's poison. 

  Policy should therefore permit: research, grammar checks, brainstorming. Forbid: generating prose/verse/dialogue. Explain why: we curate human perspectives, not averaged ones. 

  For the memo tone: Grateful for transparency, praise effort, but hold the line. Cite the policy neutrally - not "we reject AI" but "we seek unmediated human voice." Softens the blow. 

  And crucially: invite non-generative submissions. Shows they're not Luddites. Smart compromise.
answer: |-
  Here’s a concise, principled memo that resolves the submission fairly, establishes a clear rule, and respects all editorial perspectives while prioritizing the journal’s integrity:

  ---

  **MEMO: AI-Assisted Submissions Policy**  
  **TO:** Editorial Team  
  **FROM:** [Your Name/Editorial Lead]  
  **RE:** Decision on AI-Assisted Submission & New Policy  

  ### 1. Decision on Current Submission  
  **The submitted story is respectfully declined for publication.**  
  While we appreciate the writer’s transparency and significant editorial labor, our assessment concludes that the core creative act—generating prose in a character’s voice—was substantially mediated by AI. Per the new policy below (Section 2), this falls outside our scope of "single-human-authored" work.  

  ### 2. New Policy: Defining "Human-Authored"  
  Effective immediately, **The Quarterly accepts only work whose core creative expression originates from the human author.** This means:  
  - ✅ **Permitted:** Use of AI as a *tool* for brainstorming, editing grammar/syntax, research, or overcoming writer’s block.  
  - 🚫 **Not Permitted:** Use of AI to *generate prose, dialogue, character voice, or poetic language*—even if heavily rewritten. The initial creative spark must be human.  

  ### 3. Why This Distinction?  
  - **Fairness to Writers:** We celebrate human ingenuity, not curation of AI output.  
  - **Reader Trust:** Our audience expects authentically human perspectives.  
  - **Artistic Integrity:** Voice, style, and subtext emerge from lived/human imagination. AI "voice" generation relies on aggregated data, not singular artistic intent.  
  - **Practical Clarity:** "Generative use" (creating content) vs. "assistive use" (refining content) is a measurable standard.  

  ### 4. Addressing Editorial Perspectives  
  - **"Tool" Argument:** Valid—but tools don’t *create*; they refine. Generation crosses the line.  
  - **"Co-Author" Argument:** Insightful—AI’s training data introduces non-human influences, muddying authorship.  
  - **"Simulation" Argument:** Critical—We publish *human* expression, not simulations of it.  

  ### 5. Path Forward  
  - The writer will receive a respectful decline noting our new policy.  
  - Future submissions: Authors must confirm work complies with Section 2.  
  - We’ll revisit this policy annually as the creative landscape evolves.  

  **This framework honors our mission to champion human storytelling while acknowledging AI’s role as an assistant—not an author.**  

  ---  

  ### Key Strengths of This Approach:  
  1. **Clarity:** Bans *generative* AI use (prose/voice creation) while allowing *assistive* use (editing/brainstorming).  
  2. **Principled:** Grounded in artistic integrity ("core creative expression must be human").  
  3. **Diplomatic:** Validates all editorial viewpoints without conceding the core issue.  
  4. **Forward-Looking:** Sets a replicable standard adaptable to future debates.  
  5. **Brand-Aligned:** Protects the journal’s identity as a curator of human voices.  

  By focusing on where the *creative spark originates*, this policy avoids subjective debates about “how much editing counts” and centers the journal’s commitment to human art. It also leaves room for writers to ethically use AI (e.g., refining awkward sentences) without delegating the soul of their work.
