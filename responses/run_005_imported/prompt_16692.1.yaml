  ### Key justifications for point deductions:
  1. **Doris' position misrepresentation**:  
     Doris explicitly rejects *global* character traits but endorses *local* traits (e.g., "dime-specific helpfulness" isn't a virtue, but "helpfulness-when-not-late" could be). Claiming he says "character does not exist at all" (final sentence of first paragraph) oversimplifies his view. Harman takes the harder eliminativist line, but Doris does not.

  2. **Annas' incomplete defense**:  
     While correctly noting virtues are aspirational, the response omits Annas' central analogy (from *Intelligent Virtue*) comparing virtue-development to skill-acquisition (e.g., a pianist may fumble when distracted but still possess skill). This analogy directly counters situationism by arguing consistency *in relevantly similar situations* is what matters – a key nuance missing here.

  3. **Fundamental attribution error**:  
     Correctly included (minor strength), but note Harman uses this to explain *why* we *believe* in virtues, not just why we "miss" situational influences – a subtle distinction not affecting scoring.

