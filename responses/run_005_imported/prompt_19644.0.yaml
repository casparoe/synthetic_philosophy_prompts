  Notably, the user didn't ask for philosophy lessons in the memo—just reasons "the administration could act on." So I'll keep Carnap in the subtext while focusing on operational risks: gaming metrics, disciplinary inequities, and the illusion of objectivity. The "societal impact" score is especially fraught—how would that even be measured? Better to leave it flexible.

