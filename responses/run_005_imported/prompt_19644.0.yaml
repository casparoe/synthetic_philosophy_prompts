answer: |-
  **MEMORANDUM**  
  **TO:** University Administration & Committee on Research Metrics  
  **FROM:** Committee on Research Metrics  
  **SUBJECT:** Decision on Adoption of Research Impact Index for Discretionary Fund Allocation  
  **DATE:** October 26, 2023  

  ---

  ### **Decision**  
  The Committee on Research Metrics **rejects the proposed Research Impact Index (RII) as a standalone tool** for allocating the $2M discretionary fund. We instead endorse **a hybrid model retaining departmental peer review as the primary mechanism**, augmented by transparent, discipline-specific quantitative indicators where appropriate.  

  ---

  ### **Reasons for Rejection of the RII Formula**  
  1. **Non-Neutrality of Weighting:**  
     The RII combines citations, grant income, and "societal impact" into a single formula. Each component implicitly prioritizes certain scholarly values (e.g., grant income favors STEM fields; "societal impact" is subjective and inconsistently defined). **This weighting constitutes a value judgment** about what constitutes "impact," which the formula presents as objective.  

  2. **Disciplinary Inequity:**  
     - Citation patterns vary widely (e.g., humanities vs. biomedicine).  
     - Grant funding accessibility differs across fields (e.g., lab sciences vs. philosophy).  
     - "Societal impact" metrics risk privileging short-term public engagement over foundational scholarship.  
     **A uniform formula cannot accommodate these disparities without distorting incentives.**  

  3. **Technocratic Risk:**  
     As cautioned in our debate on Carnap (see Appendix A), conflating technical metrics with value-laden goals allows expertise to **mask normative choices**. The RII’s "objective" framing could insulate its underlying values from democratic scrutiny—precisely the pitfall our committee must avoid.  

  ---

  ### **Fair Hearing for RII Supporters**  
  We acknowledge proponents’ valid concerns:  
  - **Efficiency:** Peer review is time-consuming and susceptible to bias.  
  - **Consistency:** Quantitative metrics offer standardized data for cross-departmental comparisons.  
  - **Accountability:** The RII could incentivize broader engagement beyond academia.  
  However, these benefits do not justify adopting a reductive tool that **fails to distinguish between diverse forms of scholarly excellence**.  

  ---

  ### **Recommended Alternative: A Values-Explicit Hybrid Model**  
  We propose the following framework for 2024 funding allocations:  
  1. **Departmental Peer Review (60% weight):**  
     Primary evaluation of scholarly merit, originality, and field-specific impact.  
  2. **Transparent Supplemental Metrics (40% weight):**  
     - **Discipline-adjusted indicators:** Citations (normalized by field), grants (scaled for typical award size), and optional impact narratives.  
     - **Explicit value choices:** Committees must publicly justify metric weightings (e.g., "We weight grants at 10% to support early-career researchers").  
  3. **Annual Review:** Metrics and weightings to be revisited each year with faculty input.  

  ---

  ### **Administrative Action Items**  
  1. **Pilot the hybrid model** for the 2024 fund, with a sunset clause requiring reevaluation in 2025.  
  2. **Convene a faculty working group** to refine discipline-specific metrics by December 2023.  
  3. **Allocate $50K from the discretionary fund** to develop an open-access platform for transparent data reporting.  

  ---

  ### **Conclusion**  
  Carnap’s distinction between facts and values reminds us that **objectivity lies in making value choices transparent, not in eliminating them**. The RII’s fatal flaw is its illusion of neutrality. Our hybrid model embraces pluralism in scholarship while demanding accountability in how we define "impact." This upholds the university’s mission: to foster diverse forms of knowledge, not to surrender them to a formula.  

  **Vote:** 8–1 (Reject RII; Adopt Hybrid Model)  
  **Attachments:**  
  - Appendix A: Philosophical Context (Carnap/Technocracy Debate)  
  - Appendix B: Disciplinary Impact Metric Prototypes  

  ---  
  **APPENDIX A: Philosophical Context**  
  *Per the Carnap-Neurath Manifesto debate:*  
  - **Your friend’s view prevails in our decision:** Carnap’s fact/value distinction, properly applied, demands explicit articulation of value judgments. The RII obscures these judgments; our hybrid model forces them into open deliberation.  
  - **Your technocracy concern is validated:** The manifesto’s call for "rational reorganization" becomes dangerous when expertise excludes democratic input—a risk inherent in the RII.  

  ---  
  **Signed,**  
  Committee on Research Metrics
