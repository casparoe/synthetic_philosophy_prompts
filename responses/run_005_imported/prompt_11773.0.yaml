  First, I need to recall the epistemology debate they mentioned. Hume and reductionists argue testimony needs independent verification, while Reid and Coady say testimony is fundamentally trustworthy unless there are reasons to doubt. The board members are split: some think no corroboration means it can't meet the "clear and convincing" standard, others say that's unrealistic since we rely on testimony daily.

