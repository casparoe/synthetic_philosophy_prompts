  I'm on my colleges academic integrity board, and this term I'm also taking an epistemology seminar thats spent weeks on testimony -- Hume and the reductionists vs. Reid and Coady on the other side. We've got a case this Thursday that's basically that debate live: a proctor testifies she saw a student glance at a note card tucked in his sleeve, but the card was never recovered and the hallway camera angle is inconclusive, so her word is literally the only evidence we have. Two board members say testimony with zero independent corroboration can't meet our 'clear and convincing' bar, full stop; a third says that's an impossible standard nobody applies consistently, since we take people's word for things constantly without a paper trail, and Coady's whole point is you can never fully get outside testimony to check it -- our reasons for trusting a witness usually trace back to more testimony anyway. Can you draft the memo I'll send the board before we meet? I need an actual standard for when uncorroborated testimony is enough (not just 'use your judgement'), a verdict on this specific case under that standard, and something that takes the corroboration camp's worry seriously instead of just calling it naive.
