prompt: |-
  I am taking a course on autonomy and paternalism this term, and a situation in my family has me grappling with a problem we have so far only discussed in the abstract. My aunt has bipolar disorder. Two years ago, during a stable period, she wrote out detailed instructions asking that if she ever refused hospitalization again during a manic episode, her family and psychiatrist should override her objections and have her admitted regardless. She is now in the midst of a manic episode and is refusing hospitalization, but she is lucid, articulate, and meets every ordinary clinical standard for decision-making capacity. So this is not a case of an incapacitated person requiring a proxy decision-maker; it is a case of two apparently competent versions of the same person, at two different times, wanting opposite things. Some relatives believe that honoring her earlier instructions is precisely what respecting her autonomy requires, since that is what she asked for while reasoning clearly; others believe that overriding a lucid adult's present refusal is precisely what respect for autonomy forbids, whatever she said two years ago. Is there a principled basis for deciding whose judgment should prevail, or does "respecting her autonomy" simply pull in two directions here, with nothing left to adjudicate between them?
reasoning: |-
  Okay, the user is dealing with a really complex ethical dilemma involving their aunt with bipolar disorder. The situation pits past autonomous decisions against present ones. I need to unpack this carefully.

  First, the core conflict: when the aunt was stable, she created advance instructions to be hospitalized during mania even if she refuses. Now, in a manic episode, she's refusing but appears lucid and capable. So two competent versions of her want opposite things. The family is split between honoring the past self's wishes versus respecting the present self's refusal.

  This is a classic autonomy paradox. I recall philosophical frameworks that might help. Dworkin's precedent autonomy argues that past competent decisions should bind future selves when they're impaired. But is she impaired? That's the sticking point - she meets standard capacity criteria now, despite being manic. The MacArthur Competence Assessment Tool for Bipolar shows some patients retain decision-making ability during mania, which complicates things.

  Beauchamp and Childress's four principles are relevant too: autonomy, beneficence, nonmaleficence, justice. But autonomy points both ways here. Beneficence supports hospitalization to prevent harm, but forced treatment could cause trauma. 

  The temporal extension view sees autonomy as spanning a lifetime, so past directives express enduring values. But the contemporaneous view says only present wishes count when competent. There's tension here.

  Clinically, mania can distort judgment even when cognition seems intact. The aunt's directive suggests she recognized this pattern herself. Her present refusal might be part of the illness she anticipated.

  The family needs to consider: How detailed was the directive? Did she specify behavioral triggers? What harm is imminent? Is outpatient treatment possible? They should consult her psychiatrist urgently - clinical judgment is key here.

  This isn't just theoretical for the user; they're stressed and need practical guidance. Beyond ethics, they probably want to minimize family conflict while doing right by their aunt. I should emphasize consultation with professionals while acknowledging how painful this must be.

  The resolution might involve assessing whether her current capacity is truly intact given manic symptoms, while respecting that she anticipated this exact scenario. But it's ethically messy - there's no perfect answer, only the least bad option in a terrible situation.
answer: |-
  This is a profoundly difficult ethical dilemma at the intersection of autonomy, paternalism, mental health ethics, and identity over time. You've articulated the core tension brilliantly: **respecting autonomy seems to pull in two contradictory directions.** There is no universally agreed-upon answer, but several principled frameworks exist to navigate this conflict:

  1.  **Precedent Autonomy & Ulysses Contracts:**
      *   **Concept:** This view prioritizes the wishes expressed by the individual when they were *stable and fully competent* (her "past self"). The directive written two years ago is seen as a "Ulysses Contract" – a pre-commitment strategy made rationally to bind one's future self during anticipated impaired judgment, much like Ulysses tied himself to the mast to resist the Sirens.
      *   **Argument for Prevailing:** Honoring the directive respects her *enduring autonomy* and her deep self-knowledge. She explicitly anticipated that her manic self would make harmful decisions contrary to her stable self's values and long-term well-being. Overriding her *current* refusal is seen as respecting her *overall life plan and values*.
      *   **Key Philosopher:** Ronald Dworkin strongly argued for precedent autonomy in cases like this, distinguishing between "critical interests" (deep values, life plan) and "experiential interests" (immediate desires). He argued critical interests should prevail when a person's judgment is distorted, even if they meet formal capacity standards.

  2.  **Contemporaneous Autonomy:**
      *   **Concept:** This view prioritizes the expressed wishes of the individual *in the present moment*, provided they meet the standard criteria for decision-making capacity (understanding, appreciation, reasoning, communication).
      *   **Argument for Prevailing:** Respecting autonomy fundamentally means respecting a capable person's *current* choices, regardless of past choices. To override a lucid adult's refusal based solely on a past document is pure paternalism and denies the moral significance of her present self. Her current values and perspective might genuinely differ.
      *   **Key Principle:** Standard medical ethics and law prioritize contemporaneous consent/refusal for capable patients. Forced treatment of a capable individual is a grave violation.

  3.  **The "Narrative Self" / "Extended Self" View:**
      *   **Concept:** Autonomy is exercised by a person over their *entire life narrative*, not just at isolated points. The directive is part of her ongoing narrative and self-creation, expressing her enduring values and her understanding of her illness.
      *   **Argument for Prevailing:** This view tries to bridge the gap. Honoring the directive respects the *coherence* of her life story and her identity *over time*. Her manic self, while capable in a narrow sense, represents a temporary fragmentation from her core narrative and values established during stability. Respecting the directive helps reintegrate her fractured self.

  4.  **Best Interests / Harm Prevention:**
      *   **Concept:** When autonomy conflicts with itself, the decision should focus on preventing serious harm and promoting the individual's overall well-being, especially when the harm was explicitly anticipated.
      *   **Argument for Prevailing:** Manic episodes, even when the person seems lucid, carry immense risks – financial ruin, destroyed relationships, legal trouble, physical harm, or triggering a depressive crash. Her directive explicitly acknowledged these risks. Hospitalization, while disruptive, aims to mitigate catastrophic harm she herself feared. This becomes a stronger argument if her current behavior shows *signs* of escalating risk despite her articulateness.

  **Crucial Considerations & Nuances:**

  *   **The Illusion of Capacity in Mania:** Meeting the *standard* four abilities (understanding, appreciation, reasoning, communication) does not *guarantee* the decision is truly autonomous *in the context of mania*. Mania can profoundly distort:
      *   **Appreciation:** She may intellectually understand the risks but lack emotional appreciation or believe she is uniquely immune ("This time is different").
      *   **Reasoning:** Grandiosity and pressured thinking can lead to unrealistic risk assessment and discounting of future consequences.
      *   **Value Consistency:** Her current refusal may stem from illness-driven values (euphoria, grandiosity) that conflict with her stable self's deeply held values (safety, stability, relationships). Her directive *acknowledged* this distortion.
  *   **Specificity & Context of the Directive:** How detailed was it? Did it specify *behaviors* or *symptoms* triggering the override? Did it anticipate her *meeting capacity criteria* during mania? Was it discussed thoroughly with her psychiatrist?
  *   **Severity of Current Episode & Imminent Risk:** How severe is the current mania? Are there concrete signs of escalating risk (reckless spending, aggression, sleep deprivation, psychosis)?
  *   **Alternatives:** Are there less restrictive alternatives (intensive outpatient, in-home crisis care, medication adjustment) that could stabilize her *without* overriding her current refusal? Has everything possible been tried?

  **Potential Path Forward (Requires Urgent Professional Involvement):**

  1.  **Immediate Psychiatric Assessment:** Her psychiatrist *must* be involved immediately. They need to conduct a **formal capacity assessment specifically focused on her ability to appreciate the risks of refusing hospitalization *in her current manic state* and the rationale behind her own advance directive.** This goes beyond a standard capacity check. They must document *why* her current capacity might be compromised *despite* apparent lucidity.
  2.  **Review the Directive:** The psychiatrist and family should carefully review the directive's specifics and the context in which it was made.
  3.  **Family Meeting with Psychiatrist:** A meeting involving key family members and the psychiatrist is essential. The psychiatrist should explain their clinical assessment of capacity, risk, and the ethical/clinical rationale for either honoring or overriding the current refusal *in light of the directive*. This is a medical *and* ethical decision.
  4.  **Legal Consultation (Likely Necessary):** Depending on jurisdiction and the psychiatrist's assessment, legal steps for involuntary hospitalization may be considered. The existence of a clear, competent advance directive *supporting* hospitalization in this exact scenario will be a significant factor, potentially making involuntary commitment easier to justify legally and ethically than if no directive existed. However, her current refusal remains a major counter-factor.
  5.  **Focus on Relationship & Communication:** Even if hospitalization proceeds, ongoing communication with the aunt (during and after) is crucial. Frame it as respecting *her own plan* made when well. Reaffirm care and commitment to her well-being.

  **Conclusion:**

  "Respecting her autonomy" *does* pull in two directions here. There is no simple, universally accepted answer. However, the strongest *principled* arguments often lean towards **honoring the advance directive (precedent autonomy)** in cases like bipolar disorder with documented history of impaired judgment during episodes, *especially* when:

  *   The directive was made competently during stability.
  *   It explicitly anticipated the current situation (refusal during mania).
  *   The current episode, despite apparent lucidity, involves distortions in appreciation, reasoning, or value consistency that the directive aimed to address.
  *   Significant harm is likely without intervention.

  This position acknowledges that respecting autonomy sometimes means protecting a person from their own temporarily distorted judgment, as per their own prior, competent instructions. It prioritizes the stable self's critical interests and life plan over the experiential interests of the manic self. However, the argument for contemporaneous autonomy remains powerful and must be weighed heavily. **The specific clinical assessment by her psychiatrist, focusing on the nuanced nature of capacity in mania and the level of risk, is absolutely paramount in adjudicating between these competing autonomy claims in practice.** This situation highlights the tragic complexity of mental illness and the limitations of simplistic autonomy models.
