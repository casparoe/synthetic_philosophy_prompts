answer: |-
  ## The Weight of Numbers: A Dialogue

  **Characters:**  
  *   **Elara:** Defends Taurek's view that numbers alone do not create a stronger reason to save the larger group.  
  *   **Kael:** Argues that fairness requires giving the larger group a proportionally better chance of being saved.  

  **Setting:** A quiet corner of a philosophy conference coffee break.

  **(Elara and Kael are discussing a well-known thought experiment over lukewarm coffee.)**

  **Kael:** ...and that’s why I think Parfit’s dismantling of Taurek in ‘Innumerate Ethics’ is decisive. If you genuinely care about each individual impartially, the sheer *number* of individuals whose interests are at stake *must* aggregate. Five people drowning creates five times the moral urgency of one person drowning. To deny it feels like refusing basic arithmetic.

  **Elara:** Kael, it’s precisely that “aggregation” Taurek challenges. Whose perspective is this “five times the urgency” located in? The five don’t drown *as a group entity* experiencing a fivefold loss. There’s no super-being suffering a loss equivalent to five lives. There are five distinct individuals, *each* suffering the exact same catastrophic loss – the end of their life – as the single individual would suffer. From each drowning person’s viewpoint, their loss is absolute and identical. Why should the presence of others suffering *separately* make *my* claim to be saved stronger?

  **Kael:** Because fairness demands we consider *all* claims equally! Ignoring the number is *not* impartial. If I save the one, I’m arbitrarily privileging that one person’s claim over the *five* equally valid claims of the others. I haven’t given each claim its due weight.

  **Elara:** But I *am* giving each claim its due weight. Each person has an equally strong claim on me to be saved. Facing six individuals – one here, five over there – each has an identical claim. Taurek’s point is that no single claim outweighs another. Since I can’t satisfy all claims, the only fair procedure is to give each *group* an equal chance: flip a coin. Heads, save the one; tails, save the five. Each person’s *claim* has a 50% chance of being satisfied.

  **Kael:** *That’s* where I think Taurek’s procedure fails. You say you’re respecting each claim equally, but the coin flip *doesn’t* treat the *individuals* equally. Imagine standing before all six people. If I flip a coin to decide whether to save the lone stranger or the group of five, each individual *in the group of five* only has a 10% chance of being saved (since if the coin lands tails, they *all* get saved, but if heads, they *all* die). The lone stranger has a 50% chance. That’s wildly unfair *to each member of the five*! Their individual chance of survival is unfairly diminished simply because they happen to be located near others in peril.

  **Elara:** You’re shifting the unit of concern. I’m respecting the *claim* each person makes on me. Each claim is equally valid and equally demanding. The coin flip gives each *claim* an equal shot. The fact that satisfying the claim of the lone stranger requires saving one person, while satisfying the claim of the five requires saving five people, is a contingent feature of the scenario, not a difference in the *moral weight* of the claims themselves. Each claim deserves a fair hearing, and the coin flip provides that.

  **Kael:** But why structure the "fair hearing" around the *groups* as the units? Why not structure it around the *individuals* as the units? That’s the core of the contractualist or weighted lottery reply. If we truly care about each individual impartially, we should give *each individual* an equal chance in a lottery. Put six tickets in a hat – one for each drowning person. Draw one ticket. Save whoever’s name is drawn. Now, each individual, regardless of location, has a 1/6 chance of survival. That’s genuinely equal treatment per person.

  **Elara:** I see the intuitive pull, Kael. But let’s think carefully. If I run *your* lottery, the *outcome* is almost certainly that I save the five. The chance of drawing a ticket belonging to the lone individual is only 1/6; the chance of drawing a ticket belonging to one of the five is 5/6. So, 5/6 of the time, I save five people. 1/6 of the time, I save one. Doesn’t adopting *this* procedure implicitly concede that saving five is the *preferred* outcome? That the numbers *do* count? If numbers *truly* didn’t matter, why wouldn’t the 50/50 coin flip be the truly fair option between the two available choices?

  **Kael:** Not necessarily! The weighted lottery doesn’t *presuppose* that saving five is morally better. It arises purely from the commitment to *individual fairness*. If I must save either one or five, and I have no other basis for choice, giving each individual an equal *ex ante* chance of survival is the fairest way to distribute the unavoidable risk of death. The higher probability of saving five is just the *statistical consequence* of that individual fairness, not a *judgment* that the death of five is worse. It’s emergent fairness, not aggregated badness.

  **Elara:** But doesn’t the *practical consequence* undermine Taurek’s core intuition? If I follow your procedure, I end up saving the five almost every time. That looks, for all the world, like acting *as if* saving five is better. More importantly, if I *believe* Taurek is right – that there is no greater loss in five deaths vs. one, only separate losses – why would I design a procedure that systematically favors saving the larger group? Wouldn’t that procedure be *biased* against the lone individual, precisely *because* there are fewer of them? The coin flip seems the only procedure truly neutral between the two options, reflecting the moral equivalence Taurek asserts.

  **Kael:** The bias you perceive is an illusion created by focusing on the group outcomes. From the *individual’s* perspective within the lottery, their chance is fair: 1/6. The lone stranger doesn’t get a *boost* to 50% just because they are alone; that would be unfair to the others. The coin flip *does* give them that boost, arbitrarily advantaging them. The weighted lottery avoids that arbitrariness by severing the chance from group membership altogether. The fact that this often results in saving five is a byproduct of individual fairness applied to the structure of the dilemma, not a concession that ‘five deaths are worse’. It’s about *procedural* fairness to persons, not *outcome* valuation based on sums.

  **Elara:** Yet, the procedure you advocate *embodies* the idea that the interests of the five *together* create a stronger claim on the rescuer’s action than the claim of the one, simply by virtue of their number. How else do you explain why the lone stranger only gets one ticket, while the five get five tickets? Isn't that *precisely* counting the numbers? Your lottery ticket *is* a unit of moral weight. Giving five tickets to one group and one to the other *is* assigning greater aggregate weight to the larger group. Taurek denies we can meaningfully do that. The coin flip treats the two *claims* – the claim of the one and the claim of the five – as singular, indivisible, and morally equal units demanding resolution. Your lottery dissolves the groups but ends up weighting the outcome towards the larger number – doesn’t that reveal the numerical aggregation you claim is merely emergent?

  **Kael:** Only if you insist on seeing the groups *as* groups with claims. I don’t. I see six individuals. Period. Each gets one ticket because each is one person with one life at stake. The grouping is irrelevant to the chance assignment. The *consequence* for the group is derivative. The coin flip, by contrast, *reifies* the groups, treating "the five" as a monolithic claimant with a single 50% chance, obscuring the fact that this dramatically disadvantages each member *within* that group compared to the singleton. The lottery exposes that disadvantage and corrects for it by focusing solely on the individual. If that means numbers influence the *statistical likelihood* of an outcome, it’s because reality contains more individuals on one side, not because we’ve judged their collective loss as ‘worse’. We’ve judged only that each individual deserves an equal shot.

  **Elara:** But by focusing solely on the individual lottery, haven’t you lost the moral shape of the *dilemma* itself? The choice isn’t "Save Adam OR Save Ben OR Save Chloe..." individually. The choice is "Save Adam OR Save Ben, Chloe, David, Ethan, and Fiona *together*." The structure forces me to choose *between these two collective actions*. Taurek’s coin flip respects the structure of the choice I actually face: two incompatible courses of action, each responding to a set of pleas. Your lottery changes the nature of the choice into something it isn’t – an individual selection – to achieve a numerical outcome that aligns with the intuition that numbers *should* count. Isn't that smuggling in the very aggregation Taurek rejects?

  **Kael:** Or is Taurek’s insistence on seeing the choice only as between two abstract "claims" smuggling in an artificial grouping that ignores the fundamental equality of persons? Perhaps the structure of the dilemma *should* be challenged if it leads to unfairness...  
  **(Their debate continues as the conference bell rings, the fundamental tension unresolved – between the symmetry of competing claims and the arithmetic of individual chances.)**
