prompt: |-
  So for the last couple months I've been kind of stuck on this one idea and I finally wrote my thoughts up into a little essay, mostly just to organize my own head, but now I want an actual sanity check from someone who knows the field, since I never went to uni for this stuff (I do IT support for a living, I just read a lot at night). It started because I watched a talk online by this guy Voevodsky, apparently a big deal mathematician, where he says out loud that he's genuinely suspicious Peano arithmetic could be inconsistent and that he isn't even convinced by the standard proof that its consistent. That sent me down a hole reading about Edward Nelson, a Princeton mathematician who'd gotten into logic and spent like 25 years building an actual claimed proof that PA (and even some smaller, supposedly safer fragment of primitive recursive arithmetic) was inconsistent, and how it only took Terence Tao and some other guy a little while to find a hole in it once he put it out there in 2011.

  Here's basically the argument of my essay, paraphrased: Gödel's second incompleteness theorem means PA can't prove its own consistency from inside itself. The usual answer to that worry is Gentzen's proof from the 30s, but that only works by leaning on transfinite induction up to this epsilon-nought ordinal, which is itself something PA can't justify on its own, so it feels less like "problem solved" and more like the same assumption wearing a different hat. And if a genuinely brilliant guy like Voevodsky can look at that move and say "nah, not convinced," and if Nelson could spend a quarter of a century convinced he'd actually found the crack (and reportedly still kind of believed it even after the first version got shot down), then maybe the thing that's actually holding up all of math isn't a proof of consistency at all, its just a really long track record of nobody finding a contradiction yet, kind of like trusting a bridge because it hasn't collapsed rather than because every bolt's been checked.

  Can you give me an honest, warts-and-all read on this? Specifically: am I actually representing the Gödel/Gentzen stuff right or mangling it, is it fair game to lean on the Voevodsky/Nelson story as real evidence for my "it's basically a very strong hunch, not a proof" conclusion or am I massively over-reading two anecdotes, and is there some standard rebuttal to this whole line of thinking that people in logic already consider settled and I just haven't stumbled across yet? Comments on any part of it are welcome, i'd rather hear the harsh version than a polite one.
