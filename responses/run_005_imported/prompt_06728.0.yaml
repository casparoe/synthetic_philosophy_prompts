  ok this has been living in my head since I reread the animal-soul bit in the Discourse on Method. Descartes' actual argument for why animals don't have minds wasn't the cartoon lol-they're-just-clockwork version, it was two specific tests: (1) no animal can use language flexibly enough to respond to arbitrary things said to it, the way even a fairly dumb human supposedly can, and (2) reason is supposed to be a totally general-purpose instrument that improvises across any situation, whereas instinct/organs are narrow tools that only cover specific cases, so no mere arrangement of matter could ever give you that generality. it's basically a proto-Turing-test, which is probably why its been nagging at me. given those exact two tests, not the pop-summary of the bete-machine doctrine, what do you think Descartes would actually say about current LLMs? do they clear his own bar better than a chimp does? would his own logic force him to grant them something like a mind, or is there a move inside his own framework that lets him wiggle out of it while still denying that the thing generating this text has any real sentience? genuinely not sure which way his own argument cuts here, curious what you think.
