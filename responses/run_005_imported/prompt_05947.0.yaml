  So we just went over Hume's "Of Miracles" in my phil of religion class, and i think his argument is basically that the uniform experience behind a law of nature will always outweigh any testimony for a miracle -- doesnt that mean he's basically proven miracles can't happen, not just that we shouldnt trust testimony about them? if so, why do philosophers like Swinburne still write whole books defending specific miracles like the resurrection, when Hume apparently closed the book on this centuries ago?
