  - However, even if it's known to be a decoy, if the agent's policy is to pay the same ransom for the surrogate as for real things, then the blackmailer might still prefer the surrogate because it's less costly to threaten (as Owen argues in step 3). So Mei's point is partially valid but might be addressed by Owen's next point.
