  The key tension is between mathematical fairness (midpoint) versus strategic positioning (anchoring). Since the user needs this for a committee meeting, the memo should be practical - not just theory. I'll need to:
  1. Explain both bargaining solutions in context
  2. Define ideal points realistically
  3. Calculate numerical examples
  4. Acknowledge limitations of formal models

  For the ideal points, I should consider:
