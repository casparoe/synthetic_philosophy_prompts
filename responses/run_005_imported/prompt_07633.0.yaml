answer: |-
  **MEMORANDUM**  
  To: Grad Student Union Bargaining Committee  
  From: [Your Name], Econ PhD Rep  
  Date: 17 October 2023  
  Subject: Strategic Framing for Stipend/Dental Counteroffer  

  ### 1. **Recommendation: Kalai-Smorodinsky (KS) > Nash > Midpoint**  
  Use **Kalai-Smorodinsky (KS)** to frame our counteroffer. It better addresses concerns about aggressive anchoring while ensuring "proportionally equal concessions." Nash is less intuitive here, and the midpoint is strategically naive.  

  ---

  ### 2. **Formal Framing: Defining Ideal Points and Disagreement**  
  - **Disagreement Point (D)**: Outcome if talks fail = **$34k stipend, $0 dental contribution** (current expired contract).  
  - **Union’s Ideal Point (U_max)**: Our opening ask = **$45k stipend + full dental** (≈ $45k + $1,200/yr value[^1] = **$46,200 total comp**).  
  - **University’s Ideal Point (Uni_min)**: Their latest credible offer = **$38k stipend + dental copay** (≈ $38k + $864/yr employer contribution[^2] = **$38,864 total comp**).  

  [^1]: Assuming full dental premium = ~$100/month × 12 = $1,200/yr.  
  [^2]: Assuming employer pays base dental premium minus $12/month copay × 12 months = $864/yr contribution.  

  #### **Solution Calculations**:  
  - **Nash Bargaining Solution**: Maximizes \((U - D) \times (Uni - D)\):  
    - Gains: Union gain = Total comp - $34k, Uni gain = $38,864 - Total comp (lower comp = better for Uni).  
    - Nash solution ≈ **$40,300 total comp** (see Appendix).  
      → *Implied offer: ~$39.5k stipend + 75% dental coverage*  

  - **Kalai-Smorodinsky Solution**: Equalizes **proportion of potential gains**:  
    - Union’s max gain: $46,200 - $34,000 = **$12,200**  
    - Uni’s max gain: $38,864 - $34,000 = **$4,864** (saved by not conceding)  
    - KS requires: \(\frac{U\_gain}{12,200} = \frac{Uni\_gain}{4,864}\)  
    - Solves to **$40,800 total comp** (see Appendix).  
      → *Implied offer: ~$40k stipend + 90% dental coverage*.  

  #### **Why KS Fits Best**:  
  - **Addresses Anchoring Bias**: KS doesn’t "split the difference" but equalizes *relative concessions*. If the union’s ideal is ambitious, KS still forces the university to concede proportionally more.  
  - **Axiomatic Fit**: Satisfies "individual monotonicity" (bigger pie → better for both), unlike Nash. Reflects our view that dental and stipend are linked gains.  
  - **Rhetorical Advantage**: We can frame $40.8k as "equal sacrifice" (we concede 44% of max gain; Uni concedes 44% of max gain).  

  ---

  ### 3. **The Case for Midpoint (and Why to Avoid It)**  
  - **Argument For**: Simple, intuitive, and low friction. Midpoint between latest offers:  
    - Stipend: Mid of $38k (Uni) vs. $45k (Union) = **$41.5k**  
    - Dental: Mid of full coverage vs. $12 copay = **$6/month copay**  
  - **Why Avoid?**  
    - Rewards aggressive anchoring: If Uni opened at $36k, midpoint would be lower.  
    - Ignores power dynamics: Our strike threat is weak (rollover contract), so midpoint overweights Uni’s position.  
    - Bundle problem: Treating stipend/dental separately ignores their unequal cost to Uni (dental is cheaper for them to concede).  

  ---

  ### 4. **Actionable Recommendation**  
  - **Propose KS-based counteroffer**: **$40.5k stipend + full dental coverage** (≈ $40.5k comp, near KS $40.8k).  
  - **Frame as "equal sacrifice"**:  
    > *"We concede $4.5k from our ask; you concede $1.6k from your offer. But proportionally, we both give up 44% of our possible gains."*  
  - **Prepare to compromise**: Settle for **$40k + 90% dental** ($40.8k KS value) if pressed.  

  ### Appendix: Quick Calculations  
  - **Nash**: Maximize \((x - 34,000) \times (38,864 - x)\) → \(x^* \approx 40,300\)  
  - **KS**: Solve \(\frac{x - 34,000}{12,200} = \frac{38,864 - x}{4,864}\) → \(x^* = 40,800\)  

  **Caution**: Models assume rational actors with symmetric power. Given Uni’s resistance, pair KS with:  
  - Emphasize **dental as low-cost win** (Uni’s marginal cost << stipend).  
  - Threaten **public pressure campaign** if talks stall.  

  Use this to unify the committee — KS respects both anchoring concerns and fairness axioms.  

  // End memo //
