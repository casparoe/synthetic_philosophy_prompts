  Also, the user mentioned per-message failure probability. If the failure probability is zero, common knowledge is possible. But if it's bounded above zero, no matter how small, the equilibrium holds. However, in practice, negligible probabilities are treated as zero. So, the stance should be that the model is correct under its assumptions, but those assumptions are unrealistic for human (or engineered system) decisions. Real agents use satisficing, not optimizing.

