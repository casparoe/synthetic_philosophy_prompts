  Random context for this: I'm taking one of those adult-ed night classes on ancient philosophy this semester (finally finishing gen-eds I dropped a decade ago), and we just started the unit on Plato's Laws. Funny timing, because a couple weeks ago I was at a wine tasting with my sister and her boyfriend, who's a classics major, and he went on this whole tangent about how Plato actually thought getting drunk together in a supervised group setting was good for building virtue in citizens. That threw me, because the only other Plato I've read is the Symposium (different class, years ago), where Socrates famously never gets drunk no matter how much he drinks, and everyone else in the dialogue actually agrees to go easy that night since they're all hungover from the party before. So going in, I had Plato filed away as basically "the reason-should-master-the-body guy," not someone who'd sign off on organized intoxication.

  Now that I've actually read the assigned excerpt from the Laws (books 1 and 2) for this week, it really does look like the Athenian Stranger is defending organized drinking parties, with different rules by age (kids can't touch wine at all, but older men basically get to cut loose at festivals). My working theory for the response paper due friday is that old-man Plato basically mellowed out and walked back the hardcore asceticism of the Republic (guardians trained to resist every bodily pleasure, no luxury, etc) and decided by the end of his life that pleasure and letting loose were actually fine, maybe even necessary for a well-run city. Does that basically track as a fair read of what's going on in that argument, or is there something about the actual structure of his reasoning I'm missing? Don't want to hand in a paper that misses the point entirely.
