  Hmm, the user is clearly well-versed in philosophy—they reference Foot and trolley problems, and their dispute centers on nuanced textual interpretation. Their frustration is palpable; they spent all night stuck on this. What they really want isn't just a summary but forensic analysis to resolve their deadlock. 

  Let me dissect Aquinas line by line. First, the core structure: Aquinas says one act can have two effects (saving life/killing), and moral species depends only on what's *intended*. Self-defense is lawful if you intend self-preservation (a natural good) and use proportionate force. But then comes the twist: killing is unlawful unless done by public authority for common good. 

  Ah, here's the crux—the friend thinks "except for such as have public authority" means only officials can *intend* killing, making authority the real divider. But look at the Latin: "non est licitum quod homo intendat occidere hominem in seipsum defendendo" ("it is not lawful for a man to intend killing..."). The prohibition applies to private actors. Yet when Aquinas grants exceptions, he says officials may intend killing *but must refer it to public good*. That "refer" is critical—it means even officials can't intend killing *as an end*; they must subordinate it to a higher good. 

  So intention isn't different in kind—both cases forbid intending death *as a means or end*. The difference is whether the actor can licitly incorporate that death into a broader intention (common good). For a private person, death can't be part of any lawful intention; for officials, it can be instrumental to public safety. 

  Now continuity with modern double effect: Aquinas lays groundwork with the intend/foresee distinction, but his emphasis on authority is alien to trolley debates. Foot et al. abstract the principle from its institutional context, which explains why the friend feels the textual link is shaky. Still, the core mechanism—permitting foreseen but unintended harm while forbidding intended harm—is undeniably there. 

  Verdict? The user is closer: intention works the same way in both cases; authority merely changes what intentions are possible. But the friend rightly notes Aquinas embeds this in a framework modern discussions ignore. Both readings have merit, but the user's captures Aquinas' ethical logic more cohesively.
answer: |-
  Here’s a close reading of Aquinas’ text, analyzing its structure, key terms, and logical flow to adjudicate between your interpretations. I’ll then address its continuity with contemporary double-effect reasoning (DE).

  ### Close Reading of Aquinas (ST II-II, Q. 64, Art. 7)

  1.  **The Core Framework (Intention as Morally Determinative):**
      *   Aquinas begins by establishing a foundational principle: **"Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention."**
      *   He immediately grounds morality in intention: **"Moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental."** This is the bedrock of his argument. The moral character ("species") of an act is defined by what the agent *aims at*, not by unintended side effects.

  2.  **Application to Self-Defense:**
      *   He applies this to self-defense: The act has two effects: (1) Saving one's own life (intended), (2) Killing the aggressor (unintended side effect).
      *   Since the *intention* is self-preservation (a natural good), the act is not *inherently* unlawful ("non est illicitum").
      *   **Proportionality as a Necessary Condition:** He adds a crucial constraint: **"if a man, in self-defense, uses more than necessary violence, it will be unlawful, whereas if he repel force with moderation his defense will be lawful."** Lawfulness requires both good intention *and* proportionate means. The unintended effect must not be disproportionate to the intended good.

  3.  **The Private Individual's Limitation:**
      *   Aquinas reinforces the permissibility for a private person: **"Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's."** Foreseeing but not intending the aggressor's death is permissible; one has a greater duty to self-preservation.
      *   **The General Prohibition on Intending Killing:** He then states a universal principle: **"it is unlawful to take a man's life, except for the public authority acting for the common good."** Killing is intrinsically linked to public authority and the common good.
      *   **Crucial Sentence:** **"it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority..."** This explicitly forbids a *private person* from *intending* the death of the aggressor. Their intention must *only* be self-preservation; the death remains a foreseen side effect.

  4.  **The Public Authority Exception:**
      *   For public authorities (soldier, judge's minister), intending death *is* lawful, **but** only under strict conditions:
          *   They must **"refer this to the public good"** (e.g., defending the community against foes or robbers).
          *   They **sin "if they be moved by private animosity."** Their intention *must* be oriented solely towards the public good, not personal vengeance.

  ### Adjudicating Your Interpretations

  *   **Your Friend's Reading (Authority Distinction is Primary):**
      *   **Strengths:** Your friend correctly highlights the *outcome*: Only public officials can licitly *intend* death in this context. The text explicitly states this exception based on authority. The "intend/foresee" distinction operates *differently* for private vs. public actors regarding the death itself.
      *   **Weaknesses:** This reading risks downplaying the *foundational role* Aquinas gives to intention in determining the moral species of *any* act (point 1). The prohibition on private individuals intending death *flows from* the general principle that killing requires public authority/common good reference, *combined with* the core DE structure (intention defines the act). It doesn't *replace* the intend/foresee distinction; it *constrains* what intentions are permissible *for whom*.

  *   **Your Reading (Intention Does Identical Work, Only the Referred End Changes):**
      *   **Strengths:** This reading captures the *underlying ethical logic* driving Aquinas's argument. The core DE principle (intention defines the act; proportionality governs side effects) applies universally. The difference between the private person and the public official lies in **what they are permitted to intend** *because* of the **end to which the act can licitly be referred** (private preservation vs. public good). The public official isn't using a *different kind* of intention; they are permitted to form an intention (killing the aggressor) that is *instrumental* to a higher, licit end (common good) that a private person cannot licitly invoke for lethal force. The "work" of intention (defining the moral act) remains consistent.
      *   **Weaknesses:** The text undeniably *emphasizes* the authority distinction as the decisive factor *permitting* the intention to kill. Your reading requires seeing the "referred end" as the *reason why* the intention is permissible for officials, which is textually supported ("refer this to the public good"), but the direct statement ties permissibility to holding authority.

  *   **Synthesis/Adjudication:**
      Aquinas integrates both elements inseparably:
      1.  **Core DE Mechanism is Foundational:** The distinction between intended end (defining the act's species) and foreseen side effects (governed by proportionality) is the *essential structure* he uses to analyze *all* cases, including private self-defense. This is established first and is non-negotiable.
      2.  **Authority/Common Good Constrains Permissible Intentions:** The general moral law ("it is unlawful to take a man's life, except...") dictates that *forming the intention to kill another human being* is only licit when done by someone with public authority *and* when that intention is referred to the common good. This law *uses* the DE structure but imposes a further restriction: For the specific effect of *death*, the "intended" box can only be licitly checked by an agent acting for the common good.
      3.  **Conclusion:** **Your reading is closer to Aquinas's ethical framework.** The "intend/foresee" distinction *is* the core mechanism Aquinas employs to explain the permissibility of private self-defense *despite* a foreseen death. The public authority exception shows that the *same* mechanism applies, but the *content* of what can be licitly intended (i.e., killing itself as a means) changes *because* the agent's role allows them to refer the act to the common good. The authority doesn't replace the role of intention; it defines the scope of what intentions are morally available to the agent. The friend is right that authority is *decisive for permitting the intention to kill*, but wrong to imply this undermines the intend/foresee distinction as the foundational ethical tool Aquinas uses throughout the passage.

  ### Continuity with Contemporary Double Effect (Trolley Problems)

  1.  **Core Continuity:**
      *   **Intention vs. Foresight:** Aquinas's core insight – that the *intended* effect defines the moral character of the act, while *merely foreseen* (though perhaps causally certain) bad effects may be permissible if proportionate to the intended good – is the heart of modern DE reasoning. Trolley problems (e.g., Foot, Thomson) explicitly rely on this distinction to argue that diverting the trolley (intending to save five, foreseeing one death) is permissible, while pushing the fat man (intending his death as a means) is not.
      *   **Proportionality:** Aquinas's requirement that the unintended harm not be disproportionate ("more than necessary violence") is a direct ancestor of the proportionality condition in modern DE.

  2.  **Significant Discontinuity:**
      *   **Role of Authority/Common Good:** Aquinas embeds his DE analysis within a **highly specific context of natural law, authority, and the common good.** The permissibility of *intending* death is strictly reserved for public authority acting for the common good. Modern DE, especially in trolleyology, is typically abstracted from these institutional and teleological contexts. It's applied to *any* agent in a dilemma, focusing purely on the structure of agency, intention, and consequences. Aquinas would likely find the application of DE to a bystander *intentionally* killing one to save five in a trolley scenario deeply problematic, precisely because that bystander lacks the requisite authority to form the intention to kill. The "public authority" element is almost entirely absent in contemporary discussions.
      *   **Scope of Application:** Aquinas develops DE primarily to resolve a specific problem (lawful self-defense) within a framework of natural duties and prohibitions. Modern DE is often presented as a *general* principle applicable to a vast array of moral dilemmas (war, medical ethics, trolleys) with less emphasis on the underlying Thomistic metaphysics/natural law.
      *   **"Beside the Intention" vs. "Merely Foreseen":** Aquinas's phrase "praeter intentionem" (beside the intention) is robust. It implies the effect is truly *outside* the agent's aim. Modern discussions sometimes stretch "foreseen but not intended" to cover effects that seem more integrated into the plan, leading to debates about closeness of means/ends (e.g., "direct" vs. "indirect").
      *   **Moral Species:** Aquinas's focus on the "species" of the act (defined by intention) is rooted in his Aristotelian metaphysics. Contemporary DE often operates within a more consequentialist-leaning or pluralistic framework, where intention matters but other factors (e.g., rights violations) also play significant roles.

  ### Conclusion

  Your friend correctly identifies that Aquinas's text *explicitly* ties the permissibility of *intending death* to public authority acting for the common good, while a private person can only *foresee* death as a side-effect of self-preservation. However, this does not make the passage a "shaky ancestor" of modern DE, nor does it mean authority *replaces* the intend/foresee distinction.

  **The core of Aquinas's argument *is* the Doctrine of Double Effect:** He uses the distinction between intended effect (defining the act's morality) and unintended side effects (permissible if proportionate) to resolve the dilemma of self-defense. The authority discussion is a *specific application* of this core principle within his broader natural law framework, showing *why* intending death is sometimes permissible (when referred to the common good by legitimate authority) and sometimes not (for private individuals). The DE structure is fundamental; the authority/role defines the permissible *content* of intention.

  **Continuity with Trolley Literature:** There is clear and significant continuity in the core mechanism – distinguishing intended from foreseen effects and applying proportionality. However, Aquinas's framework is embedded within a specific context of natural law, authority, and the common good largely absent in contemporary trolleyology. Modern DE abstracts and generalizes Aquinas's core insight about intention and foresight, often detaching it from his specific institutional and teleological constraints. The "public authority" element is the most glaring point of discontinuity, making direct application of Aquinas's self-defense analysis to bystander trolley dilemmas problematic from a strict Thomistic perspective. Foot and others rightly see the origins of the *logical structure* in Aquinas, even if they apply it in contexts he might not have sanctioned.
