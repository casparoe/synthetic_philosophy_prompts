prompt: |-
  Me and a labmate run a pretty small podcast where we interview people adjacent to consciousness studies, and next week we've actually landed a real IIT person -- a cognitive scientist who's spent basically her whole career defending Tononi's Integrated Information Theory. I prepped by listening to a bunch of her other appearances, and she has this one move she pulls out constantly: whenever a host brings up something that sounds absurd, she says some version of "that's exactly what a non-functionalist theory should predict, so its not actually a problem," and the host just kind of moves on. That works fine against objections that are basically about functionalism, but I don't think it should get her out of everything, and I want questions that make that obvious.

  Can you draft me 8-9 interview questions, with a quick follow-up after each one keyed to whatever answer she's likely to give? I want at least one question on the unfolding argument specifically (you unfold a recurrent network into a feedforward one with identical input-output behavior and, per the theory's own math, zero phi -- so two behaviorally indistinguishable systems are supposedly worlds apart in consciousness), one on the exclusion postulate and the boundary problem it creates (why does my cortex get to be "the" complex instead of some sub-circuit of it, or cortex-plus-cerebellum, or me-plus-my-phone), one built around that Scott Aaronson example -- I think it was some deliberately boring circuit based on an error-correcting code or an expander graph -- that supposedly ends up with way more integrated information than an actual human brain, and one on the 2023 open letter that basically called the theory pseudoscience, versus the zap-and-zip complexity-index stuff hospitals actually use on unresponsive patients, since that's probably her go-to comeback whenever the falsifiability worry comes up. Order them so the "that's what a non-functionalist theory predicts" line gets progressively harder for her to lean on, and end with a question that pins down what specific result would actually count as evidence against the theory.
reasoning: |-
  We are going to design 8-9 questions that target specific weaknesses in IIT, each with a follow-up that anticipates the guest's likely response (especially the "that's what a non-functionalist theory predicts" move) and pushes back. We'll order them to make that move progressively harder and end with a question about what would falsify IIT.

  The topics we must cover (as per the user's request):
  1. The unfolding argument (recurrent vs. feedforward networks with same behavior but zero phi).
  2. The exclusion postulate and the boundary problem (why the cortex and not a sub-circuit or cortex-plus-cerebellum, or even me-plus-my-phone).
  3. Scott Aaronson's example (a boring circuit with more phi than a human brain).
  4. The 2023 open letter calling IIT pseudoscience vs. the clinical use of PCI (perturbational complexity index) in hospitals.

  We'll also include other critical points to build a comprehensive challenge.

  Let's structure the questions:

  Question 1: Start with something that is clearly about functionalism but set up the non-functionalism defense early, then move to questions where that defense doesn't work.

  Question 2: The unfolding argument.

  Question 3: The boundary problem (exclusion postulate).

  Question 4: Scott Aaronson's counterexample.

  Question 5: The open letter and the clinical use of PCI.

  Question 6: Another critical issue (maybe the problem of trivial systems or the disconnect between phi and subjective experience).

  Question 7: The disconnect between IIT's predictions and empirical data (e.g., why doesn't phi correlate with behavioral measures in some cases?).

  Question 8: The falsifiability question.

  We'll draft each question with a follow-up.

  Draft:

  1. **Question (Functionalism Setup):** "IIT is famously non-functionalist, meaning it doesn't define consciousness by what a system does, but by its internal causal structure. But doesn't that make it inherently unfalsifiable? For example, if I build two systems that behave identically in every way, but one has high phi and the other doesn't, how could we ever know which one is conscious? And if we can't know, isn't that a problem for a scientific theory?"

     *Likely Response:* She will say that this is exactly what a non-functionalist theory predicts: two systems can be behaviorally identical but one is conscious and the other isn't. That's not a bug, it's a feature.

     **Follow-up:** "But if we can't tell the difference by any objective measure, how can IIT be tested? And more importantly, if a theory can't be tested, doesn't that make it unscientific? Or is there a way to measure the internal causal structure without relying on behavior?"

  2. **Question (Unfolding Argument):** "Let's talk about the unfolding argument. You can take a recurrent neural network that, by IIT's math, has high phi, and unfold it into a feedforward network with identical input-output behavior but zero phi. So according to IIT, one is conscious and the other isn't, even though they are behaviorally identical. But you just said that's what a non-functionalist theory should predict. So how is this not a problem for IIT?"

     *Likely Response:* She might argue that the unfolding changes the causal structure and that the feedforward network doesn't have the same intrinsic cause-effect power. She might also try to say that the unfolding creates a system that is not physically realizable in the same way.

     **Follow-up:** "But both networks are physically realizable. We can build both. And they do the same thing. So if IIT says one is conscious and the other isn't, but we can't tell by behavior, then what empirical test could distinguish them? And if there isn't one, doesn't that mean IIT is making an untestable claim?"

  3. **Question (Exclusion Postulate and Boundary Problem):** "The exclusion postulate in IIT says that consciousness is associated with the complex with the maximum phi. But this leads to a boundary problem. Why is my cortex the complex and not a sub-circuit within it? Or why not the cortex plus the cerebellum? Or even me plus my phone, if we are connected in a way that increases phi? How does IIT decide the boundaries?"

     *Likely Response:* She might say that the theory defines the complex by the maximum of integrated information, and that it's a mathematical property of the system. She might also argue that in practice, for the brain, it picks out the cortex.

     **Follow-up:** "But what if there are multiple maxima? And what about the fact that if I consider a system that includes my phone, it might have higher phi? Then IIT would say that system is conscious, but that seems absurd. Also, in the brain, there are many overlapping complexes. How can we be sure that the exclusion postulate picks out the right one? And if it doesn't, isn't that a problem for the theory?"

  4. **Question (Scott Aaronson's Counterexample):** "Scott Aaronson constructed a system using a 5-dimensional expander graph that, by IIT 3.0's math, has astronomically high phi — far more than the human brain — but it's a very simple, boring circuit with no apparent capacity for consciousness. How does IIT account for this?"

     *Likely Response:* She might argue that Aaronson's example is not a realistic physical system, or that IIT has been updated (to version 4.0) and that the example doesn't hold. Alternatively, she might say that the system is indeed conscious in a very simple way.

     **Follow-up:** "But if IIT attributes high phi to a system that is clearly not conscious, doesn't that show that phi is not sufficient for consciousness? And even if we move to IIT 4.0, are there any similar counterexamples that still hold? And if so, doesn't that falsify the theory?"

  5. **Question (Open Letter and Clinical Use):** "In 2023, a large group of consciousness researchers signed an open letter calling IIT pseudoscience, in part because of its lack of empirical support. But proponents often point to the clinical use of the Perturbational Complexity Index (PCI) in hospitals to assess consciousness in unresponsive patients. How do you respond to the open letter, and is PCI really evidence for IIT?"

     *Likely Response:* She will likely defend PCI as a practical measure inspired by IIT and note its clinical success. She might argue that the open letter is biased and that IIT is a work in progress.

     **Follow-up:** "But PCI is a measure of algorithmic complexity from EEG responses, not a direct measure of phi. And it's been successful in distinguishing conscious from unconscious states, but that's a functional measure — it's based on the brain's response to perturbation. Doesn't that mean that what's being measured is functional, not intrinsic? And if so, doesn't that undercut IIT's non-functionalist stance? Also, why hasn't there been a direct empirical test of IIT's predictions about phi?"

  6. **Question (Trivial Systems):** "IIT seems to attribute consciousness to very simple systems. For example, a photodiode has a small amount of phi. So does that mean it has a tiny bit of consciousness? And if so, how does that square with our intuition that consciousness requires complex cognition?"

     *Likely Response:* She might say that yes, even simple systems have a minimal amount of consciousness, and that IIT is a theory of the quantity and quality of consciousness.

     **Follow-up:** "But then IIT seems to lead to panpsychism, which many find implausible. And if even a photodiode has a little consciousness, then what about a thermostat? Or a rock? At what point does phi become zero? And if everything has some phi, doesn't that trivialize consciousness?"

  7. **Question (Disconnect from Behavior):** "There are cases where behavioral measures of consciousness (like in blindsight or masked priming) don't align with IIT's predictions. For example, in blindsight, patients can respond to visual stimuli without conscious awareness. How does IIT explain that?"

     *Likely Response:* She might argue that the visual cortex in blindsight patients is damaged, so the phi in that area is low, and that's why they aren't conscious of the stimuli.

     **Follow-up:** "But what if we have a case where a system has high phi but no behavioral report? Or vice versa? For instance, in some disorders of consciousness, patients might have high PCI but no behavioral response. But if we take IIT seriously, we should say they are conscious. But without behavior, how can we verify that? And if we rely on behavioral report to validate the theory, doesn't that make IIT functionalist in practice?"

  8. **Question (Falsifiability):** "To wrap up, let's talk about falsifiability. What specific empirical finding would make you say, 'If that were true, IIT would be falsified'? In other words, what's the test that IIT could fail?"

     *Likely Response:* She might say that if we found a system with high phi but no consciousness, or vice versa, that would falsify IIT. But she might also qualify that by saying the system must be properly analyzed.

     **Follow-up:** "But how do we know when a system is properly analyzed? And if we rely on behavioral measures to determine consciousness, then we're back to functionalism. Without an independent measure of consciousness, how can we ever test IIT?"

  We have 8 questions. Let's adjust the order to build the difficulty of using the non-functionalist defense.

  Final Order:

  1. Start with the functionalism setup (question 1 above).
  2. Then the unfolding argument (question 2).
  3. The boundary problem (question 3).
  4. Scott Aaronson's counterexample (question 4).
  5. The open letter and PCI (question 5).
  6. Trivial systems (question 6).
  7. Disconnect from behavior (question 7).
  8. Falsifiability (question 8).

  This order starts with the non-functionalist defense and then presents challenges that become harder to dismiss with that defense.

  Let me write out the full set of questions and follow-ups as per the above plan.
answer: |-
  Here are 8 interview questions designed to systematically challenge IIT's "non-functionalist predictions" defense, ordered to make that rebuttal progressively harder to use. Each question includes a concise follow-up targeting the likely response. The sequence builds from functionalism-adjacent issues toward core mathematical and empirical problems, ending with falsifiability.

  ---

  ### **Question 1: Functionalism Setup**  
  *Purpose: Surface the "non-functionalist" defense early to set up later rebuttals.*  
  **Q:** "IIT rejects functionalism by decoupling consciousness from behavior. But if two systems behave identically—say, a human and a perfect zombie—IIT says one could be conscious while the other isn’t. Since we can’t observe consciousness directly, how can this *ever* be tested scientifically?"  
  *Likely Response:* "That’s precisely what a non-functionalist theory predicts: behavior alone doesn’t dictate consciousness."  
  **Follow-up:** "If behavioral tests are irrelevant, what *non-behavioral* experiment could verify whether a system with identical inputs/outputs is conscious or not? If none exists, doesn’t IIT place consciousness outside empirical science?"  

  ---

  ### **Question 2: Unfolding Argument**  
  *Purpose: Force engagement with IIT’s mathematical contradictions.*  
  **Q:** "Take a recurrent neural network (RNN) with high Φ. If you 'unfold' it into a feedforward network with identical input-output behavior, IIT calculates Φ = 0. How can two physically realizable systems, indistinguishable via behavior, have such radically different conscious states?"  
  *Likely Response:* "Unfolding destroys causal integration—which is central to IIT—so it’s no surprise Φ drops. This highlights why functionalism fails."  
  **Follow-up:** "But both systems have identical *causal dynamics* at the input-output level. If IIT’s Φ depends on arbitrary implementation details (like recurrent wiring), isn’t it measuring physical design, not consciousness?"  

  ---

  ### **Question 3: Exclusion Postulate & Boundary Problem**  
  *Purpose: Challenge IIT’s core postulate with physical/intuitive absurdity.*  
  **Q:** "The exclusion postulate says only the *maximal Φ complex* is conscious. Why is my cortex ‘the’ complex, rather than a cortical sub-circuit, my cortex + cerebellum, or even me + my smartphone if it’s integrated via an implant?"  
  *Likely Response:* "Φ maximization resolves this—it picks the cortex because subsystems or larger aggregates have lower Φ."  
  **Follow-up:** "But in practice, Φ calculations show local maxima everywhere (e.g., visual cortex Φ ≠ whole-cortex Φ). If IIT can’t uniquely identify *which* complex is conscious without ad hoc biological assumptions, doesn’t that make it unfalsifiable?"  

  ---

  ### **Question 4: Scott Aaronson’s Expander Graph**  
  *Purpose: Use a concrete mathematical counterexample to question Φ’s sufficiency.*  
  **Q:** "Scott Aaronson designed a system using a 5-bit expander graph—a simple error-correcting code—that IIT 3.0 calculates as having Φ > 10²⁹, far exceeding a human brain. Yet it’s trivial hardware with no conscious features. Doesn’t this prove high Φ isn’t sufficient for consciousness?"  
  *Likely Response:** "IIT 4.0 addresses this by requiring 'intrinsic cause-effect power,' which Aaronson’s system lacks."  
  **Follow-up:** "But IIT 4.0’s ‘cause-effect power’ still relies on Φ-like integration. If the math can be gamed by *any* highly connected circuit, isn’t Φ measuring connectivity, not consciousness? What experiment could rule this out?"  

  ---

  ### **Question 5: Clinical Use (PCI) vs. Pseudoscience Claims**  
  *Purpose: Contrast IIT’s clinical applications with its critics.*  
  **Q:** "Critics like the 2023 open letter call IIT pseudoscience for lacking falsifiable predictions. Yet clinicians use IIT-derived tools like PCI (Perturbational Complexity Index) to detect consciousness in coma patients. Is PCI validation of IIT, or just a functional metric that borrows IIT’s math?"  
  *Likely Response:** "PCI *is* validation—it measures integrated information via EEG zap-and-zip, aligning with IIT’s predictions."  
  **Follow-up:** "But PCI correlates with *behavioral responsiveness* (e.g., command-following), which is functionalist. If PCI works *because* it tracks function, doesn’t that contradict IIT’s anti-functionalism? Shouldn’t a ‘true’ IIT tool detect consciousness *without* behavioral cues?"  

  ---

  ### **Question 6: Panpsychism & Trivial Systems**  
  *Purpose: Push IIT toward absurd panpsychist conclusions.*  
  **Q:** "IIT implies panpsychism: a photodiode has Φ > 0, so it’s ‘minimally conscious.’ But consciousness likely requires specific biological mechanisms. Why should we accept that Φ—a purely mathematical property—maps to subjective experience in *any* substrate?"  
  *Likely Response:** "That’s a strength! Non-functionalism allows consciousness in simple systems where functionalism would deny it."  
  **Follow-up:** "If Φ is substrate-neutral, why hasn’t IIT produced a single non-biological conscious system? And if my phone’s RAM has Φ > 0 when active, is it ‘more conscious’ than a person with dementia? How is this scientifically useful?"  

  ---

  ### **Question 7: Empirical Gaps & Evolutionary Inefficiency**  
  *Purpose: Highlight mismatches between IIT’s predictions and biology.*  
  **Q:** "IIT claims consciousness *is* Φ. But the cerebellum has almost as many neurons as the cortex, yet IIT assigns it low Φ and no consciousness. If consciousness is evolutionarily advantageous, why would the brain ‘waste’ resources on a massive unconscious cerebellum?"  
  *Likely Response:** "The cerebellum’s architecture lacks feedback loops, minimizing integration—so no Φ, no consciousness."  
  **Follow-up:** "But cerebellar damage impairs movement *awareness*—suggesting it contributes to consciousness. If IIT dismisses this as ‘unintegrated processing,’ isn’t it redefining consciousness to fit Φ, rather than testing Φ against evidence?"  

  ---

  ### **Question 8: Falsifiability & Exit Strategy**  
  *Purpose: Demand a concrete falsification criterion.*  
  **Q:** "Karl Popper said a theory is scientific only if it can be falsified. What specific finding would make you concede IIT is wrong? For example: if Φ were high in anesthetized brains, or if a low-Φ system reported conscious experiences?"  
  *Likely Response:** "If a system with *validated* high Φ lacked consciousness, or vice versa, I’d question IIT."  
  **Follow-up:** "But IIT defines consciousness *as* Φ, making this circular. Without independent consciousness metrics (e.g., report), how can Φ *ever* be falsified? Isn’t IIT self-justifying by definition?"  

  ---

  ### **Strategy Notes:**  
  1. **Order Logic:** Starts with functionalism (where her defense works), then escalates to mathematical (unfolding, Aaronson), empirical (PCI, cerebellum), and logical (panpsychism) challenges where "non-functionalism" is irrelevant. Ends with falsifiability, forcing her to confront circularity.  
  2. **Key Traps:**  
     - In Q2–Q4, her defense must address *internal contradictions* in IIT’s math, not functionalism.  
     - Q5 forces her to reconcile clinical success (functional) with IIT’s anti-functionalism.  
     - Q8 exposes IIT’s unfalsifiable core: equating Φ with consciousness.  
  3. **Delivery Tips:**  
     - If she uses the "non-functionalist" line past Q3, note: "But here the issue isn’t functionalism—it’s IIT’s *own axioms* leading to absurdity."  
     - Press for specifics: "What experiment *today* could test that?"  

  This sequence ensures her go-to move becomes increasingly untenable, culminating in a falsifiability challenge that IIT struggles to answer without conceding its empirical weaknesses.
