answer: |-
  You're absolutely right – Dworkin's critique in "Lord Devlin and the Enforcement of Morals" (1966) targets a *fundamentally different weakness* in Devlin's argument than Hart's, and it's arguably more devastating to Devlin's core project. Here's a breakdown:

  **Dworkin's Core Critique: The "Moral Position" Requirement**

  Dworkin zeroes in on Devlin's key test for when society can enforce its morality through law: when the ordinary reasonable person experiences feelings of **"intolerance, indignation, and disgust"** towards a practice. Devlin argued these intense emotional reactions *signified* the presence of a shared moral principle deemed essential to society's existence.

  Dworkin's devastating move is this: **He argues that Devlin provides no reason to believe these reactions (intolerance, indignation, disgust) are necessarily responses to a *genuine moral principle* at all.** They could just as easily be expressions of **irrational prejudice, blind tradition, or mere personal aversion.**

  1.  **Distinguishing Reactions from Principles:** Dworkin insists that for a feeling of disgust or indignation to justify legal enforcement, it must be demonstrably linked to a *rational moral conviction* held by the individual. The feeling alone is insufficient. He writes: *"The statement that homosexuality is immoral is a moral position; the statement that it is disgusting is not... Disgust is a *reaction*, not a reason."*
  2.  **The Burden of Proof Shift:** Dworkin argues Devlin places the burden of proof entirely in the wrong place. It's not enough for the majority to *feel* disgust; they must *justify* that their disgust stems from a defensible moral principle, not just prejudice. *"Devlin's thesis... allows the majority to appeal to their own emotional reactions as proof that a moral principle is at stake, without requiring them to defend the principle itself."*
  3.  **The "Moral Position" Requirement:** For legal enforcement of morality to be legitimate, according to Dworkin, society must be acting on a **"moral position"** – a conviction based on reasons that can be articulated and defended through critical morality. The "intolerance, indignation, and disgust" of the "man on the Clapham omnibus" *might* sometimes reflect such a position, but they are *not* reliable indicators in themselves. They could just be "bare dislikes" or prejudice masquerading as morality.

  **How This Differs Radically from Hart's Critique:**

  *   **Hart's Focus:** Hart attacked Devlin on **empirical/consequentialist grounds** (no evidence society collapses without enforcing sexual morality) and **conceptual grounds** (the crucial distinction between *positive* morality - what is believed - and *critical* morality - what is justified). Hart's harm principle argues we need a *reason* (preventing harm) beyond mere moral disapproval to justify criminalization.
  *   **Dworkin's Focus:** Dworkin attacks Devlin on the **epistemological/moral grounds** of his very *test* for identifying what counts as the "shared morality" worthy of enforcement. He argues Devlin provides **no valid criterion** to distinguish a genuine moral principle (which *might*, under some theories, be a candidate for enforcement) from irrational prejudice or personal squeamishness (which never should be). He challenges the *validity* of the emotional reaction as evidence for the *existence* of a defensible moral principle.

  **Analogy:**

  *   Imagine Devlin says: "If the crowd shouts 'Burn the witch!' with enough intensity and disgust, that *proves* witchcraft is a genuine threat to society's fabric, and we must outlaw it."
  *   **Hart responds:** "There's no historical evidence that societies allowing witchcraft actually collapse. Furthermore, just because the crowd *believes* it's a threat doesn't mean it *is* a threat (positive vs. critical morality). We need proof of actual harm."
  *   **Dworkin responds:** "Hold on. How do we know the crowd's shouting 'Burn the witch!' is based on a *moral belief* about societal danger at all? Maybe they just hate her because she's ugly, or different, or they misunderstood the weather? Their disgust doesn't *mean* anything morally significant until they can articulate a *reason* beyond the feeling itself. It might just be prejudice."

  **Which Critique Does More Damage to Devlin?**

  **Dworkin's critique is arguably more fundamentally damaging.**

  1.  **Undermines the Foundation:** Hart challenges the *consequences* and *conceptual basis* of enforcing morality. Dworkin challenges the very *method* Devlin proposes for identifying *which* morality should be enforced. If Devlin's test (reliance on intense public disgust) cannot reliably distinguish genuine moral principles from prejudice, then his entire project collapses at the starting gate. What good is enforcing "shared morality" if you can't know if the shared reaction is moral or just bigoted?
  2.  **Exposes the Slippery Slope of Prejudice:** Dworkin explicitly links Devlin's test to the potential for enforcing pure prejudice. History is littered with laws (against interracial marriage, homosexuality, religious minorities) justified by appeals to the "intolerance, indignation, and disgust" of the majority. Dworkin provides the theoretical tool to call this out: *"Prove this reaction is based on a defensible moral principle, not just the fact that you find these people icky."* Hart's harm principle also prevents this, but Dworkin attacks the legitimacy of using the feeling *as evidence* for the moral principle in the first place.
  3.  **More Difficult to Rebut:** Devlin could *attempt* (though arguably unsuccessfully) to counter Hart by pointing to perceived non-physical "harms" to the social fabric or disputing the empirical claim. Countering Dworkin requires him to show *how* intense disgust/intolerance *necessarily* reflects a reasoned moral position rather than prejudice – a much taller order that Devlin never satisfactorily addresses. He simply assumes the feeling *is* the evidence of the moral principle.

  **Conclusion:**

  While Hart powerfully argues that enforcing morality *without harm* is unjustified and empirically unsupported, **Dworkin delivers the more lethal blow by demonstrating that Devlin's proposed mechanism for identifying *which* morality to enforce is fundamentally flawed and potentially dangerous.** Devlin provides no safeguard against mistaking raw, unreasoned prejudice for a shared moral principle essential to society. Dworkin forces the question: *"Is this disgust *moral* disgust, or just disgust?"* Without a convincing answer (which Devlin lacks), his entire argument for using law to enforce morality based on public sentiment crumbles. So, tell your friend that while Hart weakened Devlin's structure, Dworkin pulled out the cornerstone. Case closed! (Until the next jurisprudence nerdfight, of course.)
