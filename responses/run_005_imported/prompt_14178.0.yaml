answer: |-
  ## Eulogy for Rosalind

  Good morning. We gather today to remember and celebrate the extraordinary life of Rosalind, a woman who graced this world for ninety-four remarkable years. For many of us, she was family – a beloved great-aunt, a sister, a cousin, a constant presence. For others here, she was a dedicated colleague and friend, united in a unique pursuit. And for all of us, she was a woman of profound depth, quiet courage, and unwavering intellectual honesty.

  That honesty… that was perhaps Rosalind’s defining quality. It wasn’t always easy. It didn’t always offer simple comforts. But it was real, and it shaped the decades of her life in a way that deserves our understanding and respect.

  Rosalind deeply admired a philosopher named Henry Sidgwick. For as long as anyone can remember, his biography sat on her nightstand. Sidgwick grappled with a fundamental question: Can reason alone *prove* we should be moral, rather than simply looking out for ourselves? He concluded his major work admitting he couldn’t definitively bridge that gap. He suggested that only a genuinely moral universe – perhaps one underpinned by survival beyond death, where virtue and ultimate well-being finally coincide – could truly resolve this profound tension.

  But here’s what Rosalind admired most, and what became a guiding principle for her own life: Sidgwick didn’t *assume* that universe existed. Nor did he dismiss the question as unanswerable nonsense. Instead, he turned to the world itself. He looked, empirically, methodically, even unglamorously, for evidence. He co-founded the Society for Psychical Research, seeking data, not dogma.

  Rosalind understood this quest intimately. And not long after experiencing the devastating loss of her fiancé at a young age, she found her way to a similar path. For nearly fifty years, she served on the council of our local psychical research society, modeled on Sidgwick’s own. Her commitment wasn't born of blind faith, nor was it driven by a desire to debunk. It was driven by that same profound question Sidgwick left open: *Is there more?*

  She sat patiently in countless sittings. She meticulously reviewed case notes, reports, and testimonies. She engaged with phenomena that defy easy explanation, not as a believer seeking confirmation, nor as a cynic seeking dismissal, but as a researcher seeking *understanding*. She approached the deepest questions of existence – questions of consciousness, of connection, of what might lie beyond our current sight – with the tools of reason and observation.

  **This is the Rosalind we must honor today:** The woman who looked into the profound mystery at the heart of Sidgwick’s ethics, and indeed, at the heart of human experience – the mystery of meaning, connection, and what endures – and said, *“I will look. I will examine. I will not pretend to know what I do not know.”*

  She wanted, deeply and humanly, for the evidence to point towards a universe where love isn’t severed by death, where her lost love awaited, where the moral arc truly bends towards justice. Who among us, touched by loss, hasn’t wished for that? That longing was part of her fuel. But her *integrity* was her compass. And by every account, right up until the very end, Rosalind remained, like Sidgwick before her, essentially unconvinced. Agnostic. Holding the question open, demanding evidence, refusing the easy solace of unfounded belief just as firmly as she refused the easy dismissal of unexplored possibility.

  To her fellow researchers here today: You knew this Rosalind. You shared the long hours, the careful scrutiny, the frustrating ambiguity, the shared commitment to the search itself, regardless of where it led. You know she was no secret spiritualist grasping at straws, nor a tidy debunker closing doors. She was your colleague in the demanding, often thankless, but profoundly important work of asking difficult questions honestly.

  To our family: We knew her love, her presence, her wit. We felt the weight of her loss, and yes, we share the human longing to imagine her “at peace,” reunited with the one she lost so long ago. We can hold that tender hope in our hearts. But we dishonor the essence of who Rosalind *was* if we claim she found an answer she spent her entire adult life telling us she hadn’t found. Her peace wasn’t found in easy answers. Her peace, I believe, was found in the *integrity* of the search itself.

  Rosalind’s life teaches us that it is possible, and indeed noble, to dwell in the uncomfortable space of *not knowing*. To hold profound questions – questions about love, loss, meaning, and what lies beyond – without demanding premature closure. To want an answer desperately, yet refuse to invent one for comfort’s sake. To dedicate a lifetime to looking, even when the light remains stubbornly dim.

  She lived Sidgwick’s challenge: to face the fundamental uncertainty of our moral and existential footing, not with despair or dogma, but with courageous, persistent inquiry. Her legacy isn’t a definitive answer to the question that haunted Sidgwick. Her legacy is the *example* – the example of a life lived with unflinching intellectual honesty, profound curiosity, and the courage to sustain hope *within* uncertainty, rather than seeking refuge from it.

  Rosalind looked. She questioned. She sought. She remained true to the evidence, even when it wasn’t what she hoped to find. In that unwavering commitment to truth, however elusive, she found a way to live meaningfully and ethically in a world full of profound, unanswered questions.

  We will miss her presence deeply. But we carry forward the enduring gift of her example: the courage to question honestly, the strength to dwell in uncertainty, and the profound dignity of a lifelong search for truth. That was Rosalind’s project. That was her life. And that is how we will remember her.
