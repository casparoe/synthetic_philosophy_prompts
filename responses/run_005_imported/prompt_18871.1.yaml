  Noticing they use "grown up farther together" in quotes—probable Yudkowsky paraphrase. They're mocking the vagueness. Good sign they want the critic to attack that poetic language as evasion. Also, "staying silent" as a "fix" gets air quotes in their description. That's the critical pressure point.

