  ### What Both Are Missing

  Both debaters miss crucial context that complicates their positions. Marcus overlooks how *any* large-scale bombing campaign, even against "legitimate" targets, inherently involves foreseeing massive civilian deaths as a *de facto* means of degrading enemy capacity/will, blurring Anscombe's clean distinction in practice. Leah underplays the profound dangers of consequentialism: the contested reliability of the invasion casualty estimates, the potential availability of alternatives (e.g., demonstrating the bomb or modifying surrender terms), and the normalization of "necessary evil" arguments that erode absolute prohibitions against targeting civilians, making future atrocities more thinkable. The debate focuses narrowly on intention vs. consequence but neglects deeper questions about the inherent morality of total war strategies and the epistemological challenges of predicting consequences in wartime.
