answer: |-
  Your argument is impressively constructed and historically grounded—Dan should be sweating. Let's break this down point by point:

  ### 1. **Historical Accuracy**:
     - **SPR Motivation**: You're correct. Sidgwick explicitly linked psychical research to his ethical dilemma. In *Methods of Ethics* (1874), he admits the dualism’s threat to ethics and writes elsewhere (e.g., letters to peers) that empirical proof of survival could resolve it. His 1869 resignation from Trinity over Anglican doctrine is key context.
     - **Creery Sisters**: Correct. They were caught signaling in 1884 (finger codes), embarrassing the SPR. Sidgwick acknowledged fraud but argued *some* phenomena remained unexplained.
     - **Census of Hallucinations**: Spot on. 17,000 responses (1894), finding 1 in 43 death-coinciding apparitions. Sidgwick saw this as *suggestive* (not conclusive) evidence for survival.
     - **Cross-Correspondences**: Post-1901, mediums produced fragmented messages (e.g., classical allusions) that only made sense when combined. SPR interpreted this as deceased founders (Myers, Sidgwick) designing "fraud-proof" evidence. Skeptics attribute it to cultural osmosis or collusion.

  ### 2. **Dan's Category-Mistake Objection: Does It Land?**
     - **Yes, partially**. Sidgwick’s project *is* vulnerable here. Even if survival were proven, it wouldn’t *logically* resolve the dualism:
       - Survival alone doesn’t guarantee virtue/self-interest alignment (e.g., an afterlife could be unjust).
       - "Rational self-evidence" (Sidgwick's standard) can’t be settled empirically. Facts don’t dictate normative truths.
     - **But your core point survives**: For Sidgwick, survival evidence wasn’t about *deriving* ethics but *enabling its coherence*. If the cosmos is just, survival *might* allow alignment. No survival = no alignment possible = ethics collapses. His SPR work was a Hail Mary to salvage rational ethics *given his premises*. It’s less a category error than a desperate empirical gamble to save his system.

  ### 3. **Alternative Explanations: Are You Underrating Them?**
     - **Grief**: Sidgwick lost his brother (1866) and close friend Henry Graham Dakyns (1873). His journal admits this fueled his "intense hope" for survival evidence.
     - **Nora’s Influence**: Nora Sidgwick (SPR President after Henry) was deeply involved. Her work on medium fraud was rigorous, but her personal investment (grief over siblings) mattered.
     - **Victorian Context**: Spiritualism was mainstream. William James, Alfred Russel Wallace, and even J.J. Thomson joined SPR. Sidgwick wasn’t eccentric by era standards.
     - **Professional Curiosity**: Sidgwick saw psychical research as an extension of his broader empiricism—applying scientific methods to "unexplained" phenomena.
     - **However**: These factors *complement* your thesis; they don’t refute it. Sidgwick’s letters and post-*Methods* writings consistently tie SPR to the dualism. Philosopher Bart Schultz (Sidgwick’s biographer) endorses your view: the SPR was "Sidgwick’s substitute for theology."

  ### 4. **Dan's Strongest Counterarguments**:
     - **Motivated Reasoning**: Sidgwick’s *need* for survival evidence *did* likely bias him. The Creery scandal (and others) show he downplayed fraud when phenomena "felt" evidential. His 1882 presidential address admits the SPR’s work is driven by "the deep and widespread longing" for proof.
     - **Epistemology**: Dan’s right that Sidgwick blurred "is" and "ought." Survival evidence could only support a *contingent* harmony (if the cosmos is fair), not a necessary one. Sidgwick arguably smuggled in a hidden premise: a moral cosmos *must* align duty and self-interest.

  ### **Verdict**:
  - **History**: You’re 95% accurate (Creery details correct, Census figure spot-on).  
  - **Philosophy**: Dan lands a blow with the category-mistake point—Sidgwick’s empirical quest couldn’t *fully* resolve the normative dualism. But your core claim (SPR as direct response to the ethical crisis) holds.  
  - **Motivations**: You’re not underrating alternatives; they enrich, but don’t replace, the ethical motivation.  

  **Who won?** It’s a draw with a slight edge to you. Sidgwick’s SPR work *was* philosophically motivated, making it more than a footnote. But Dan correctly flags its epistemological fragility and Sidgwick’s occasional lapses in rigor. Ultimately, Sidgwick himself died unconvinced—which might be the most honest outcome. As Parfit later noted, the dualism remains "unsolved and perhaps insoluble."  

  **P.S.**: The cross-correspondences *are* poetically satisfying—but Dan’s warning about narrative bias is fair. History’s best ironies often crumble under scrutiny. Still, Sidgwick’s tragic quest for cosmic justice remains one of philosophy’s great dramas.
