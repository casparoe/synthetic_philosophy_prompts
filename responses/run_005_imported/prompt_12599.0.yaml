  What I really want is for it to get into the actual mechanics of the disagreement, not just "should law enforce morality, yes or no." So have Devlin lay out the disintegration thesis and the "seamless web" idea for why a society needs a shared morality to survive, and then have Hart hit him with the obvious objection -- that this is an empirical claim about what societies need that he never actually backs up, so why should we believe a society unravels just because it stops legislating on private sexual conduct. Devlin should have a real answer to that, not just fold. Then I'd like Hart to bring up his positive-morality-vs-critical-morality distinction and press the point that Devlin's "intolerance, indignation and disgust" test just launders prejudice into law -- and have Devlin actually engage with that, maybe via the treason analogy, rather then dodge it. Bonus if at some point Devlin turns it around and asks Hart how liberalism avoids becoming exactly the kind of enforced orthodoxy he's accusing Devlin of. Don't let either of them win in a lopsided way, I want two people who each actually believe their view and are genuinely good at defending it.
