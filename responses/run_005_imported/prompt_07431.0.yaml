  Here is a eulogy that honors your grandfather's narrative, celebrates his extraordinary life and character, resonates with your family, and remains philosophically scrupulous for you and your cousins. It focuses on the *experience* of agency, the undeniable *expression* of his character, and the profound *impact* of his choices, without asserting ultimate self-creation:

  ---

  # Eulogy for [Grandfather's Name]

  We gather here today with heavy hearts, but also with immense gratitude, to celebrate the extraordinary life of [Grandfather's Name]. A husband, a father, a grandfather, a friend, and a man whose story became the bedrock of our family’s understanding of what’s possible.

  Most of you know the outline of that story by heart. A young man of nineteen, arriving in this country with little more than determination in his pocket. Facing a new language, a new culture, and the vast uncertainty of building a life from scratch. And then, step by deliberate step, brick by hard-laid brick, building not just a life, but a legacy. He took an idea, nurtured it through sheer force of will and relentless effort, and grew it into [Name of Business], a testament not just to his business acumen, but to his unwavering belief in the power of work and perseverance.

  Granddad loved to tell that story. He told it with pride, not boastfulness, but with the quiet conviction of someone who had lived every demanding moment of it. He told it because it *was* his truth. He *experienced* his life as a journey shaped by his own choices. He *felt* the weight of responsibility and the satisfaction of effort. He *chose* to work those long hours. He *chose* to learn, to adapt, to push forward when others might have given up. He *chose* the integrity with which he ran his business, the loyalty he showed his employees, the fierce devotion he gave to his family.

  And that’s what we celebrate most today: **the undeniable character of the man who made those choices.** Whether facing the daunting challenge of starting over in a new country, navigating the complexities of building a business, or simply showing up – day after day, year after year – for his family, [Grandfather's Name] acted with a consistency and resolve that defined him. He was a man of principle. He believed in hard work not as a theory, but as a practice. He believed in resilience not as a slogan, but as a necessity he embodied. He believed in providing, protecting, and building something lasting.

  His life stands as a powerful testament to **what human will, focused and unwavering, can achieve in the world.** He didn't wait for opportunity to knock; he built the door. He didn't rely on luck; he forged his own path through sheer determination. He *lived* as a self-directed man. He took ownership of his circumstances and shaped them with the tools he had: his intellect, his work ethic, his courage, and his profound sense of responsibility.

  To know him was to witness agency in action. It was to see a man who looked at the world not as something that happened *to* him, but as something he could engage with, influence, and build upon. He didn’t just have a vision; he had the relentless drive to turn that vision into reality. He built his business, yes, but more importantly, he built this family. He built a foundation of values – hard work, integrity, loyalty, resilience – that will continue to guide us long after today.

  The pride he took in his journey wasn't arrogance; it was the earned satisfaction of a life lived with intention and effort. He showed us, through his example, the immense power of **choosing** to meet challenges head-on. He showed us the dignity in hard work and the profound satisfaction of building something meaningful with your own hands and mind. He showed us what it means to be accountable, to be steadfast, to be the author of your own days as fully as anyone can be.

  His story, the one he told and the one he lived, remains an inspiration. It’s the story of possibility. It’s the story of what happens when talent meets tenacity, when opportunity – however small it first appears – is met with unyielding effort. He didn't just dream; he *did*. He didn't just wish; he *built*.

  So, while our hearts ache with his absence, they also swell with the magnitude of what he accomplished and the depth of the love he leaves behind. We honor him today not just by remembering his story, but by recognizing the incredible force of character that drove it. We honor him by carrying forward the values he lived by: the dedication, the responsibility, the unwavering spirit that said, "This is within my power to do, and I *will* do it."

  Rest well, Granddad. Your journey was remarkable. Your choices shaped our world. Your character endures in all of us. Thank you for showing us what it means to truly live with purpose and determination.

  ---

  ## Why this works for your requirements

  1.  **Honors His Narrative:** It explicitly recounts his story ("arrived... built..."), acknowledges how central it was to him ("his truth," "loved to tell," "pride he took"), and affirms the values it represented (hard work, determination, resilience, self-reliance).
  2.  **Celebrates Admirable Qualities:** It focuses intensely on his observable character traits (determination, work ethic, integrity, resilience, devotion, responsibility, courage) and the undeniable impact of his choices ("shaped his circumstances," "built his business," "built this family," "shaped our world").
  3.  **Avoids Metaphysical Claims:**
      *   Uses experiential language: "He *experienced* his life as...", "He *felt* the weight...", "He *lived* as a self-directed man."
      *   Focuses on *expression* of character: "the undeniable character of the man who *made those choices*," "agency in action," "the author of your own days *as fully as anyone can be*."
      *   Emphasizes *practical* self-direction: "took ownership of his circumstances," "shaped them with the tools he had."
      *   Uses qualified language: "what human will... can achieve *in the world*," "shaped his circumstances," "the author of your own days *as fully as anyone can be*."
      *   **Crucially, avoids:** "He *made himself*," "Ultimate responsibility," "Uncaused cause of his character," "Truly self-created."
  4.  **Respects Strawson:** It doesn't claim he was the ultimate, regress-stopping originator of his character (N). It focuses on how his existing character (whatever its origins) consistently expressed itself through responsible, effortful choices (M) that had real-world consequences. It talks about the *experience* and *expression* of agency, not its ultimate metaphysical source. Swapping "he made himself" for "he *lived* as a self-directed man" and "he *took ownership*" is the key shift.
  5.  **Family Resonance:** It tells the story they expect, praises him in the terms they understand and value, focuses on his achievements and admirable qualities, and provides comfort by affirming the meaningfulness and impact of his life's work and choices. The tone is warm, respectful, and celebratory.
  6.  **For Your Cousins:** They will hear the careful phrasing. They will note the absence of the explicit metaphysical claim "he made himself" and the substitution of experiential and practical agency language. They will recognize the focus on character expression and impact over ultimate origin. They should understand you've threaded the needle.

  **Delivery Tip:** Speak slowly, warmly, and with conviction. Pause after emphasizing the key experiential phrases ("He *experienced*...", "He *lived* as..."). Let the admiration for his character and achievements shine through. Your genuine respect for him will be the most powerful element.

  This allows you to stand before your family, honor your grandfather profoundly, and remain true to your philosophical understanding. Condolences on your loss.
