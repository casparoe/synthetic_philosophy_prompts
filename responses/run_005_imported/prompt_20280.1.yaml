  First, I need to recall the core ideas. Buck-passing reduces value to reasons for pro-attitudes. The demon example shows a reason (avoid torture) to admire something unadmirable. The friend's solution is restricting to object-given reasons—those based on the object's properties. But the user suspects circularity because defining "object's properties" might implicitly rely on value concepts.

