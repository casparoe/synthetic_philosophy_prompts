  Next, considering possible solutions. Parfit's proposal about reasons provided by features that count in favor of the attitude. But "count in favor" might just be another term for normative reasons, leading back to circularity. Hieronymi's stance that attitudes have constitutive standards might help, but applying that to admiration is tricky. Admiration's standards could vary culturally, so its nature might not provide clear criteria.

  Then, the comparison to belief. Pascal's Wager gives pragmatic reasons to believe, but belief aims at truth. Evidentialism restricts reasons to evidence. The attitude's nature here is clearer because belief is truth-aimed. But for pro-attitudes like admiration, the standards are less defined. This difference might make the belief case easier to handle without circularity, while admiration remains problematic.

