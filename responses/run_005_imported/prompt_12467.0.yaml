  Miriam argues that this is a classic case of a Hacking-style "looping effect" - where the classification (ADHD) becomes part of people's identity, influencing their behavior and even changing the classification itself. Gordon counters that it's simply better detection of a stable biological condition, not a looping effect.

  Looking at their arguments move by move:

