  Another angle: the children's prior experience with the objects. They handled them blindfolded, so the test is about cross-modal recognition. But post-surgery, they're disoriented. Any delay in allowing touch could heighten anxiety. Maybe modifying the test to minimize delay or providing immediate reassurance after the test.

  The memo must address both sides. For proponents, emphasize the scientific significance and minimal physical risk. For opponents, acknowledge the emotional burden and consent challenges. A middle path with modifications might be best. For instance, making the test very brief, ensuring the child can touch immediately after, and robust consent processes.

  Also, considering the children's age and vulnerability. Pediatric ethics require extra safeguards. The Belmont Report's principles: respect for persons (consent), beneficence (minimizing harm), justice (fair selection). Here, beneficence involves emotional harm, which isn't minimal if the child is distressed. Respect for persons means informed consent, which is tough in this high-stress moment.

  Possible modifications: limiting delay to seconds, not minutes; allowing parents to be present; ensuring immediate touch after the test; explicit opt-out option. Consent could be obtained in stages—initial consent during pre-op, reaffirmed post-op but with the ability to withdraw easily.

