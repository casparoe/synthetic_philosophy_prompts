  For the realization arc, I'm thinking three stages:
  First, the intellectual puzzle-solving high of following Gödel's argument. Then the dawning suspicion when properties like "necessary existence" start feeling sticky. Finally the gut-punch when they see Sobel's move - not an error in the proof but a feature that devours all maybes.

  Crucially, the horror isn't about God. It's about the axioms being a carnivorous machine that digests contingency. The user wants that machine left running at the end, whirring in the character's (and reader's) mind. No debunking, just coexistence with the thing.

  Notebooks and coffee stains will be my tactile anchors. The character should keep circling back to the same equations like tongue probing a rotten tooth. And the ending... maybe the window scene? Where even moonlight feels predetermined by the proof's implications. Leave them staring at ordinary objects made terrifying by necessity.
answer: |-
  The coffee had long gone cold in the ceramic mug beside Leo’s elbow. Outside the library’s high windows, the campus was drowned in the deep blue silence of 3 AM, punctuated only by the occasional sweep of a security light. Inside, the only sounds were the frantic scratch of Leo’s pencil and the dry whisper of turning pages. He wasn’t supposed to be here – the Philosophy section was technically closed – but Dr. Aris had lent him the key, trusting his obsession with Gödel’s ontological proof.

  It had started as a puzzle, a challenge for the regional logic competition. Gödel’s attempt to prove God’s existence using pure modal logic – S5 axioms, positive properties, the whole thing. Leo had dissected it step by step, building the skeletal structure:

  1.  **Positive Properties:** A fuzzy, undefined concept Gödel took as primitive. Good things, essentially. Justice, benevolence, existence itself... maybe.
  2.  **God-like (G):** Defined as possessing *every* positive property.
  3.  **Axiom 1:** If a property is positive, its negation isn't positive. (Fair enough).
  4.  **Axiom 2:** Positive properties entail only positive properties. (If good things lead to good things).
  5.  **Theorem 1:** Being God-like is positive. (Follows from definitions).
  6.  **Axiom 3:** Necessary existence is a positive property. (The big leap).
  7.  **Axiom 4:** If a property is positive, it's *necessarily* positive. (It's always good, in every possible world).
  8.  **From here...:** Using S5 modal logic (where if something is *possible*, it's *necessarily possible*), you show it's *possible* that a God-like being exists. Then, crucially, since necessary existence is a positive property God *must* have, and existing necessarily is part of being God-like... *boom*. It becomes *necessary* that God exists. Not just possible. Necessary.

  Leo had wrestled with it, diagrammed it, argued with the empty chairs. He’d felt the intellectual thrill of the structure locking into place, the gears meshing. It was audacious, brilliant, a castle built on air that somehow held its shape. He’d even drafted his competition entry, focusing on the elegance of the modal reasoning.

  But then he’d stumbled upon the footnote. A throwaway mention in an online forum: *Sobel. Modal Collapse.*

  Driven by a competitor’s paranoia (what if the judges knew this?), Leo had dug deeper, pulling obscure papers from the stacks. J. Howard Sobel. A philosopher who hadn’t found an error *in* Gödel’s logic, per se, but had shown what the logic *implied* if you took Gödel’s own axioms seriously.

  Leo’s pencil hovered over his notebook. He’d re-written Sobel’s argument, tracing the path not to God, but beyond.

  *If God exists necessarily, and God has all positive properties necessarily... and positive properties are *necessarily* positive (Axiom 4)...*

  He drew a box on the page. Labeled it: **The Actual World**. Inside it, he wrote: **G exists (Necessarily)**.

  Then he drew another box. **Possible World W**. Inside it: **G exists (Necessarily)**. Because necessary existence means existing in *all* possible worlds.

  But then Sobel’s move. Consider *any* true proposition in the actual world. Say, "The coffee is cold" (Leo glanced at his mug). Call that proposition **P**.

  Now, Gödel defined God-like as having *every* positive property. What if one of those positive properties is... **"Being such that P is true"**?

  Leo’s breath hitched. *Is that a positive property?* Gödel never gave a complete list. He left it open. But according to his axioms, if a property is positive, it *must* be exemplified by God. And God exists necessarily in all worlds.

  *So, if "Being such that P is true" is positive... then in every possible world, God exists and has that property. Therefore, in every possible world, **P is true**.*

  But **P** was just "The coffee is cold" *in this actual world*. If it’s true *here*, and if it’s a positive property God must have... then it must be true *everywhere*. Necessarily true.

  Leo stared at the implication. *But what if it's NOT positive?* Okay, fine. Then its negation, "Being such that P is *false*" might be positive? But Axiom 1 says if a property is positive, its negation isn't. So only one of them can be positive. But which one?

  **Here it was.** For *any* true proposition **P** in the actual world, *either*:
  *   "Being such that P is true" is a positive property, so God has it necessarily, so **P** is necessary.
  *   *Or* "Being such that P is *false*" is a positive property. But if *that* were positive, God would have *it* necessarily, meaning **P** would be *false* in every possible world... **including the actual world where it's true!** Contradiction.

  Therefore... the *only* consistent option is that for *every* true proposition **P** in the actual world, "Being such that P is true" *must* be a positive property. Therefore, God has it necessarily. Therefore, **P** is true in *every* possible world. **P** is necessary.

  **The coffee is cold. Necessarily.**

  Leo dropped the pencil. It rolled off the desk and clattered on the linoleum. The sound was absurdly loud in the silent library.

  He looked at his cold coffee. Not just *cold*, but *couldn't have been otherwise*. The security light swept across the window again. *That light had to sweep at that exact moment.* He thought about choosing Philosophy club over Chess club last semester. *He necessarily chose Philosophy.* He thought about his parents meeting. *They necessarily met.*

  It wasn't about God anymore. The proof wasn't just building a deity; it was pouring metaphysical concrete over *everything*. Every choice, every accident, every stray atom's path – solidified into absolute, inescapable necessity. The "could-have-beens" weren't just unrealized; they were *impossible*. Contradictions. Erased by the very axioms meant to prove a necessary God.

  *Modal collapse.* The term felt too clean, too academic, for the vertigo he felt. It wasn't just a logical consequence; it was the world shrinking, hardening. The vibrant, messy tapestry of possibility fraying into a single, rigid thread. The proof wasn't a window to the divine; it was a funhouse mirror reflecting a universe stripped of contingency, where "is" and "must be" became indistinguishable.

  Leo picked up the pencil slowly. His hand was trembling slightly. He looked back at Gödel's original axioms, written neatly at the top of his page. They looked innocent. Reasonable, even. The necessity of existence seemed profound, a worthy divine attribute. The stability of positive properties across worlds felt like a bedrock of value.

  But together, in this quiet, airless room at 3 AM, they felt like the bars of a cage. A cage built not of iron, but of pure, inescapable logic. Gödel, they said, might have known. Might have *accepted* this. That God's necessary existence demanded the necessity of *everything*. That free will, chance, alternate histories… were illusions dispelled by the cold light of these axioms.

  Leo closed the notebook. He didn't throw it. He didn't debunk it. The proof stood, a chillingly valid structure according to its own rules. He hadn't found a flaw; he'd found the foundation, and it was swallowing the world whole.

  He stood up, walked to the window. The campus below was still, frozen in the security light's glare. The trees didn't rustle with possibility; they stood as rigid monuments to what *had* to be. The stars, usually points of infinite potential, now felt like fixed, necessary sequins on a predetermined dome.

  He pressed his forehead against the cool glass. The proof hadn't given him God. It had given him a universe where the coffee was cold, he was in the library, and the security light swept its beam… necessarily. The "could-have-been" hadn't just faded; it had been proven logically impossible by the same reasoning that tried to prove the divine.

  The competition entry felt meaningless now. The unsettling truth wasn't a debunking point; it was the proof’s shadow, stretching long and dark over every conceivable fact. Leo knew he would carry this coldness out of the library with him, not as a solved problem, but as a permanent, low-grade hum in the back of his mind. A silent, logical engine turning every "is" into "must be," forever. The library wasn't quiet; it was filled with the deafening silence of a world where nothing else was possible.
