  without immediately triggering Löb's theorem in T0? But note, Löb's theorem applies to each system individually. However, the key is that T0 can prove the soundness of T1 (if T1 is sufficiently weaker). Specifically, if T0 can prove that every theorem of T1 is true (i.e., T0 proves □_{T1} φ → φ for every φ), then T0 can trust T1.

