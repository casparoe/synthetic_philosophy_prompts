  The agent, let's call it A0, wants to replace itself with a modified version A1. But A0 only wants to do this if it can be sure that A1 will be "safe" (for some notion of safety). One idea is that A0 requires that it can prove a certain trustworthiness condition about A1. Specifically, A0 might demand:

    "I (A0) can prove that: if A1 proves that some property S holds (say, safety of actions), then S is indeed true."

  In logical notation, if we let □_{A1} φ denote "A1 can prove φ" (in the proof system used by A1) and we let S be the safety property, then A0 wants to prove:

    □_{A0} ( □_{A1} S → S )

  Note: We are assuming that A0 and A1 use the same proof system, so we can write □ without subscript, but we must be careful. Actually, in the classic tiling setup, they use the same system. So let □ denote provability in the common system.

  So A0 wants: □ ( □ S → S )

  But then, by Löb's theorem, if the system can prove □(□S→S), then it can also prove S. That is:

    If □ (□S→S) is provable, then □S is provable.

  But note: Löb's theorem says that if □(□P→P) is provable then □P is provable. Here P is S.

  So, if A0 manages to prove □(□S→S), then by Löb's theorem, the system (and hence A0) can prove □S. But note that □S is the statement that S is provable by A1 (or by the common system). However, this does not necessarily mean that S is true! Unless we have soundness (which we cannot assume because the system might be inconsistent).

  But wait, the problem is that we are working in a consistent system. However, the agent cannot assume its own system is sound (because of Löb's theorem). In fact, the agent cannot prove its own consistency (by Gödel's second incompleteness theorem).

  So, if A0 proves □(□S→S), then by Löb's theorem, it also proves □S. But then, if A0 is consistent, it cannot prove that □S implies S (because that would require the system to be sound, which is not provable). So we have:

    A0 proves □S.

  But without the soundness of the system, A0 cannot conclude S. So the trustworthiness condition □(□S→S) leads to A0 proving □S, but not to proving S. Therefore, the agent A0 has not actually established the truth of S, only that S is provable in the system.

  This is a problem because we want S to be true, not just provable. And if the system is inconsistent, then □S is true for every S, but S might be false.

  Moreover, note that if A0 proves □S, then A1 (which uses the same system) will also be able to prove □S, but again that doesn't guarantee S.

  So the agent has not achieved its goal of ensuring S. It has only ensured that the system proves S, which is not the same.

  Now, let's see why this prevents an agent from certifying a successor that uses the same proof system.

  Suppose we have an agent A0 that wants to create a successor A1 that is identical in its proof system. A0 wants to be sure that whatever A1 proves about safety (i.e., S) is true. So it tries to prove:

    For the property S (which we assume is a fixed formula representing safety), we have □_{A0} ( □_{A1} S → S )

  But since A1 uses the same system, □_{A1} is the same as □_{A0}. So we have:

    □ ( □ S → S )

  Then by Löb's theorem, the system (and hence A0) can prove □S. But then what? We have:

    A0 has proven □S.

  But note: A0 does not necessarily have a proof of S. So when A0 is considering the rewrite, it has proven that the system proves S, but it has not proven S itself. Therefore, if A0 is only going to rewrite if it has a proof of S, then it will not rewrite because it doesn't have a proof of S (it only has a proof that the system proves S). But if A0 is willing to rewrite based on the trust condition, then it rewrites to A1, and A1 will have the same problem: it has a proof of □S, but not of S. So when A1 considers rewriting to A2, it will try to prove the same trust condition for A2, and again by Löb's theorem, it will only get □S again, but not S.

  Thus, the agent never actually proves S. It gets stuck in a loop of proving □S, □□S, □□□S, ... without ever proving S.

  This is the Löbian obstacle.

  Now, the common fix is to make the successor use a weaker proof system. For example, let A0 use system T0, and let A1 use a system T1 that is weaker in the sense that T0 can prove the consistency of T1. Then, A0 might be able to prove:

