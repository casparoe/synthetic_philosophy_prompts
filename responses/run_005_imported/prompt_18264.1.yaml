  Okay, let me start by unpacking the user's query. They're grappling with a dense paragraph from Dewey's *The Public and Its Problems* and their reading group is split on its interpretation. The main confusion revolves around Dewey's claim that there's a criterion for a good state (degree of public organization and officials' functionality) but no a priori rule for what constitutes the best state. The user's group member thinks this makes Dewey's theory empty, but the user suspects there's more nuance tied to his experimentalist pragmatism.

  First, I need to recall Dewey's broader philosophical framework. His pragmatism emphasizes that knowledge arises from problem-solving in specific contexts. Concepts and theories are tools to address real-world issues, not abstract truths. So when Dewey talks about the state, it's within this experimentalist, context-dependent framework.

  The user's specific questions are about the distinction between "criterion" and "a priori rule," the meaning of "rediscovery," and whether political knowledge can be settled. I should break down each element. The criterion isn't a fixed blueprint but a functional measure: how well does a state organize the public and enable officials to address shared problems? This avoids relativism because the function remains constant, even as forms change. 

  The "a priori rule" rejection makes sense here. Dewey opposes top-down, universal models (like natural law or utilitarianism) because they ignore contextual factors. His experimentalism requires adapting institutions to changing conditions, which aligns with his theory of inquiry where solutions are hypotheses tested in practice.

  "Rediscovery" is key. It's not just reform but a continuous process of inquiry. As societal actions evolve, new indirect consequences emerge, forming new publics. States must adapt, meaning each generation must engage in its own inquiry to reorganize institutions. This ties back to Dewey's view of knowledge as provisional and always needing re-testing.

  Addressing the group member's critique: the criterion isn't empty because it provides a direction—toward better organization and responsiveness. It's like a compass, not a map. The absence of a fixed "best" state reflects Dewey's commitment to democracy as a dynamic process, not an end-state.

  The user might also be seeking reassurance that Dewey isn't a relativist. By emphasizing the functional criterion and experimental process, Dewey avoids relativism while rejecting absolutism. The user's deeper need could be to defend Dewey's coherence against their group's skepticism, possibly for their own understanding or to present a counter-argument.

  I should also connect this to Dewey's educational philosophy, where learning is experiential. Just as education adapts to student needs, political institutions must adapt to societal changes. The user mentioned choosing this book over *Democracy and Education*, so highlighting how Dewey's political theory extends his educational principles might strengthen their analysis.

  Finally, the experimental process isn't random but intelligent inquiry using available knowledge. However, since conditions change, what works now may not later, necessitating perpetual rediscovery. This positions Dewey as a precursor to adaptive governance theories, which the user might find relevant for contemporary applications.
answer: |-
  You've hit on a crucial tension in Dewey's pragmatism, and your groupmate's reading, while understandable, misses the deeper experimentalist logic at work. Dewey isn't admitting emptiness; he's rejecting static, universal blueprints in favor of a dynamic, functional, and *experimental* standard. Here's how the passage coheres with his overall project:

  1.  **The "Criterion" vs. the "A Priori Rule":**
      *   **Criterion:** Dewey's criterion is **functional and directional, not prescriptive or comparative.** It asks: *How well is this specific state, in its specific context, performing its core function?* That function is the organization of the public (the people affected by indirect consequences) and the constitution of officials to effectively care for public interests arising from those consequences.
      *   **A Priori Rule:** This would be a fixed, universal formula or model for the "best state" (e.g., Plato's Republic, Rawls's Original Position principles applied rigidly, a specific constitutional arrangement deemed perfect). Dewey explicitly rejects this. Why? Because:
          *   **Context Matters:** "In no two ages or places is there the same public." The specific "indirect consequences" that define a public, the knowledge available about them, the social and technological conditions, and the available means for the public to exert control over officials – all vary immensely across time and place.
          *   **History is Open-Ended:** Human association and its consequences are constantly evolving. There is no final, perfect state achievable within history that can serve as a timeless benchmark ("not at least till history is ended").

      **The Work of the Criterion:** It provides a *lens for critical inquiry and judgment*, not a ranking system. We can ask of *any* state:
      *   Is the public (those affected) adequately identified and organized?
      *   Are the officials responsive and effective in addressing the public's problems (the indirect consequences)?
      *   Are the mechanisms for the public to control officials functioning?
      *   If not, *why* not? What specific obstacles exist *in this context*? This diagnosis guides the "experimental process" of reform. It tells us *what to look for* and *what the goal of political action is* (better organization, more responsive officials), without dictating *how* to achieve it universally.

  2.  **"Rediscovery" – More Than Just Reform:**
      *   **Tied to the Nature of the Public:** The public isn't static. As human activities change (technology, economy, social interaction, migration, etc.), the patterns of "indirect consequences" change. New publics form around new problems (e.g., climate change publics, digital privacy publics), while old publics may dissolve or transform. The *substance* of what constitutes "public interests" evolves.
      *   **Tied to the Theory of Inquiry:** Dewey views knowledge as *instrumental* and *provisional*, arising from and tested in the process of solving concrete problems. Political knowledge *does* accumulate (e.g., we learn about effective representation, checks on power, managing complex bureaucracies), but it never becomes *settled dogma* applicable universally for all time.
          *   **Why?** Because the *problems* change. The accumulated knowledge provides tools and hypotheses, but applying them to *new* contexts with *new* constellations of consequences and publics requires fresh inquiry and experimentation. What worked brilliantly for agrarian republics won't suffice for industrial democracies or digital network societies. The *application* must be rediscovered.
      *   **The "Must":** This isn't optional. Failure to "rediscover" the state – to continually re-examine how well the existing structures are organizing the *current* public and addressing *current* indirect consequences – leads to stagnation, irrelevance, and the dominance of private interests over the public good. The state becomes ossified, serving past problems or powerful factions, not the living public.

  **Addressing Your Groupmate's Critique & Your Questions:**

  *   **"Empty Criterion"?** No. It's a *functional* criterion. Think of it like judging the "goodness" of a tool. A good hammer drives nails well; a good saw cuts wood well. Dewey's criterion asks: Does this state organize its public and care for its interests well? The *form* of the hammer or saw (or state) varies wildly depending on the *specific task* (nailing finish vs. framing, sawing logs vs. doing dovetails; managing a small agrarian community vs. a vast industrialized nation vs. a globalized digital society). You *can* judge a specific hammer *as a hammer* against its function. You *cannot* say "The Claw Hammer is the universally Best Hammer Form for all nailing tasks for all time." Similarly, Dewey allows judgment of *a specific state* against its function but denies a single universal *form* is best.
  *   **Relativism?** Dewey avoids crude relativism. The *function* (organizing the public, caring for public interests) provides a constant, non-relative standard. What *counts* as good organization or effective care *is* relative to the specific context and problems at hand, but it's judged against the enduring functional goal. It's *contextual*, not relativistic.
  *   **Does it Hold Together with Experimentalism? Absolutely.** This passage is *core* Deweyan experimentalism applied to politics:
      *   **Problem-Driven:** The state arises from problematic situations (indirect consequences needing management).
      *   **Hypothetical Solutions:** States are "hypotheses" for organizing publics and officials.
      *   **Testing in Experience:** Their "goodness" is tested *in practice* by how well they perform their function *in their specific context* (the criterion).
      *   **Provisional Knowledge:** No solution is final or perfect for all time ("no form... can be said to be the best").
      *   **Continuous Inquiry:** Changing conditions demand constant re-inquiry and re-adaptation ("experimental process," "must always be retried," "rediscovered").
      *   **Intelligent vs. Blind Experimentation:** The process can be haphazard ("blindness," "accident," "fumbling") or intelligent ("guided by knowledge of the conditions").
  *   **"Rediscovery" Strength:** It's a much stronger claim than mere "periodic reform." It means the *very definition* of the public, its interests, and the appropriate mechanisms for organization and control are perpetually up for re-examination and reconstruction based on the evolving consequences of associated living. It's not just tweaking institutions; it's potentially redefining their purpose and structure based on a continuous inquiry into the present.

  **In essence:** Dewey offers a *teleological* criterion (oriented towards a function: organizing the public/caring for interests) but rejects *deontological* or *utopian* rules (fixed universal forms or end-states). The "good state" is always a work in progress, defined by its effectiveness *here and now* in fulfilling its core purpose, knowing that "here and now" is constantly changing, demanding perpetual intelligent experimentation – the state must always be "rediscovered" through democratic inquiry to meet the challenges of the present. This isn't a dodge; it's the radical, adaptive, and demanding heart of his democratic experimentalism. Your groupmate is looking for a static ranking Dewey explicitly argues is impossible and counterproductive; Dewey provides the dynamic tools for ongoing critical assessment and reconstruction.
