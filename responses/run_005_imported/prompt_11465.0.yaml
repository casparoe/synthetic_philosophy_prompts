answer: |-
  ## The Brittle Bridge: Why Good's Theorem Fails to Generalize to Human Rationality

  Good's theorem is mathematically elegant and conceptually powerful within its narrow domain. For an idealized Bayesian agent with a fixed utility function, a well-defined set of actions and outcomes, and a costless, non-strategically provided signal, it is indeed true that observing the signal *cannot harm* expected utility. The agent can always conditionally ignore the signal, replicating the pre-signal optimal action. This is often weaponized rhetorically to claim that any refusal to seek or engage with evidence is irrational motivated reasoning. However, this generalization collapses under scrutiny because the assumptions anchoring Good's theorem are systematically violated in the messy reality of human cognition, especially within adversarial or social contexts. Let's dissect the critical assumptions and see how their failure, particularly **dynamic consistency**, **fixed utilities**, **non-strategic signals**, and **guaranteed optimal updating/action**, overturns the conclusion for boundedly rational agents.

  **The Brittle Assumptions:**

  1.  **Dynamic Consistency (The Core Failure):** Good's proof relies on the agent being a unified, dynamically consistent entity *across time*. The pre-signal agent trusts that the post-signal agent will act optimally *according to the original utility function*. Crucially, the post-signal agent *can and will* choose to ignore the signal if acting identically to the pre-signal agent remains optimal. Humans are not dynamically consistent in this way. Exposure to information, especially persuasive or emotionally charged rhetoric, can fundamentally alter the agent's *internal state* in ways that make replicating the pre-signal action psychologically impossible or undesirable *by the post-signal agent's own lights*. This isn't just weakness of will; it's a transformation of the decision-making entity.
  2.  **Fixed Utility Function:** The theorem assumes the agent's goals and values are immutable. Humans, however, are susceptible to *preference shifts* induced by arguments, framing, and emotional appeals. A compelling argument might not just change your beliefs about *how* to achieve a goal, but subtly (or overtly) change *what* you value. The post-signal agent may no longer *want* what the pre-signal agent wanted, making the "ignore the signal" option unattractive to the new self.
  3.  **Non-Strategic, Costless Signal:** Good assumes the signal arrives passively and neutrally. Real-world information, especially in adversarial contexts (e.g., debates, political arguments, online flame wars), is often *strategically crafted* to exploit cognitive biases, induce specific emotional states (fear, outrage, tribal loyalty), or overwhelm processing capacity. The "signal" isn't pure evidence; it's a weaponized payload designed to *cause* suboptimal updating or action. Further, "costless" ignores cognitive load, opportunity cost, and emotional toll.
  4.  **Guaranteed Bayesian Updating & Optimal Action:** Humans are not perfect Bayesians. We suffer from confirmation bias, motivated reasoning, base rate neglect, and countless other cognitive limitations. Crucially, Good assumes that *after* updating, the agent *will* choose the objectively optimal action. Humans often fail at this final step due to weakness, akrasia, or simply misjudging the optimality based on flawed internal models.

  **The Concrete Failure: Scott Alexander's "Epistemic Learned Helplessness"**

  Scott Alexander's concept of "epistemic learned helplessness" (ELH) is a prime example where declining further evidence/argument engagement is *instrumentally rational* for a boundedly rational agent, precisely because of the failure of Good's assumptions. ELH describes the state where, after repeatedly engaging with bad-faith actors or incredibly complex/confusing arguments on a topic (e.g., contentious politics, fringe theories), one realizes that further engagement *degrades* one's ability to form accurate beliefs or make good decisions *on that topic*.

  **Why Declining Engagement is Rationally Better Off:**

  1.  **Violation of Dynamic Consistency & Fixed Utilities:** Engaging with highly polarized, emotionally charged, or bad-faith arguments doesn't just provide neutral evidence. It actively triggers psychological defenses, entrenches tribal identities, and induces states like anxiety, anger, or cynicism. The *post-engagement self* is fundamentally different:
      *   **Utility Shift:** The pre-engagement self valued truth-seeking on topic X. The post-engagement self, flooded with negativity and tribal signaling, may now primarily value *reducing cognitive dissonance*, *signaling in-group loyalty*, or simply *escaping the unpleasant emotional state*. The original goal of dispassionate truth-seeking becomes secondary or abandoned.
      *   **Action Shift:** The pre-engagement self might have planned to ignore weak arguments. But the post-engagement self, emotionally activated and identity-threatened, *cannot* calmly ignore them. It feels compelled to rebut (wasting energy), internalize the tribal framing (distorting beliefs), or disengage entirely *from the domain* (losing the ability to act on true beliefs later). The option to "act exactly as before" is psychologically off the table. The agent *becomes* the kind of agent who *cannot* ignore the noise.
  2.  **Violation of Non-Strategic Signal:** The arguments declined in ELH aren't neutral. They are often:
      *   **Gish Gallops:** Overwhelming volumes of low-quality, hard-to-refute-on-the-fly arguments designed to exploit processing limitations and force errors.
      *   **Motte-and-Baileys:** Presenting an extreme claim (bailey) and retreating to a defensible one (motte) when challenged, wasting the engager's effort and creating confusion.
      *   **Trolling/Sealioning:** Demanding excessive engagement under a veneer of civility to exhaust and frustrate.
      *   **Emotional Manipulation:** Framing arguments to trigger outrage, fear, or disgust, hijacking System 1 thinking.
      This "signal" isn't informative; it's *designed* to induce cognitive and emotional states that *prevent* optimal updating and action. Consuming it has a *cost* in degraded cognitive function and emotional well-being.
  3.  **Violation of Guaranteed Optimal Updating/Action:** A human exposed to this torrent is highly likely to update poorly (e.g., giving undue weight to the last loud voice, anchoring on a fringe claim) and then act suboptimally (e.g., making a rash decision based on anger, wasting hours on futile debate, abandoning the topic altogether out of frustration). The Bayesian ideal of perfect conditionalization followed by optimal action is a fantasy here.

  **The Rational Calculus of ELH:**

  The pre-engagement agent recognizes the pattern: "Every time I engage with arguments of type Y (e.g., on topic X from source Z), I emerge hours later feeling angry, confused, less certain of truths I previously held confidently, and likely to either lash out uselessly or avoid the topic entirely. My beliefs are *less* calibrated, my decision-making capacity *worse*, and my emotional state *poorer*."

  This agent rationally forecasts that *for them*, in *this specific context*, the "signal" (adversarial arguments) reliably induces a *harmful internal state change* (violating dynamic consistency and fixed utilities). This state change makes them *less capable* of performing optimal belief updating and action (violating guaranteed updating/action). The information is not costless; it carries a high cognitive and emotional tax (violating non-strategic/costless signal).

  Therefore, *in expectation*, by their own lights (valuing truth, good decisions, and emotional equilibrium), **declining the engagement leaves them better off.** They preserve their current (imperfect but functional) beliefs, decision-making capacity, and mental state. They avoid the *predictable transformation* into a less rational, more agitated, and potentially less effective version of themselves that engagement would cause. The "option to ignore the signal" exists only in Good's abstract model; for the human in the adversarial context, exposure *changes the agent* such that they reliably *fail* to exercise that option optimally.

  **Conclusion: Not Messiness, but Fundamental Mismatch**

  This isn't merely "real life is messier." It's a demonstration that Good's theorem rests on assumptions about agency, information, and rationality that are *structurally invalid* for humans in adversarial environments. The core failure is **dynamic inconsistency**: exposure to certain types of information strategically crafted to exploit human psychology *changes the agent's internal state* in ways that make the pre-signal strategy of "ignore if useless" impossible for the *new* agent to execute optimally, or even desirable. This state change also frequently involves shifts in utility and guarantees suboptimal updating and action due to cognitive bounds.

  Generalizing Good's theorem to argue that humans should always seek more evidence or arguments ignores this profound vulnerability. For a boundedly rational agent, recognizing contexts where information exposure predictably *degrades* their rationality (by their own standards) and strategically avoiding it is not "motivated ignorance"; it's **instrumental rationality in the face of cognitive fragility.** Epistemic learned helplessness, when accurately diagnosed, is a rational defense mechanism against self-sabotage induced by adversarial environments. The burden of proof lies not with the agent practicing strategic disengagement, but with those who insist that the pristine logic of Good's theorem, built on assumptions humans cannot satisfy, must govern their messy reality.
