  (4) Marcus counters that the Dutch book argument only works if the decision maker chooses each bet in isolation without a pre-commitment to a strategy. If he commits to a strategy (using his risk-weighting function) for the entire set of bets, then no Dutch book can be made against him.

  This is a valid point. The Dutch book argument relies on the decision maker being myopic (short-sighted) and not considering the entire set of choices. If Marcus uses a consistent rule (like a risk-weighted expected utility model) to evaluate any given gamble, and if he evaluates compound gambles by reducing them to simple lotteries (using the same rule) then he is immune to Dutch books.

  In fact, any model that satisfies the axioms of coherence (like transitivity, completeness, and perhaps some form of monotonicity and continuity) can avoid Dutch books. The risk-weighted models are typically designed to satisfy these properties.

