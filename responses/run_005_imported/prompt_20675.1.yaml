  The driver has two identical intersections. He must exit at the second one, but he can't remember if he's passed any. The payoff is highest if he continues at the first and exits at the second. The optimal pre-commitment is to continue with probability 2/3 at both points, giving an expected payoff of about 4.44. But if he finds himself at an intersection and considers which one it might be, he updates his belief and might choose a different action, leading to a lower payoff. 

