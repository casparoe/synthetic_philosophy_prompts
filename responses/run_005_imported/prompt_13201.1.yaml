  Hmm, assessing "success on own terms" is crucial here. For example:
  - Widerker's dilemma aims to expose circularity against libertarians - it largely succeeds internally but only within that narrow scope.
  - Fischer shifts the goalposts entirely by redefining control - highly successful for his compatibilist project but doesn't engage PAP directly.
  - Flicker defenses try to salvage PAP within Frankfurt's framework - that's why they end up in "Partial"; they identify real weaknesses but can't fully restore PAP.

  The user clearly understands the technical nuances (they namedrop Mele/Robb buffers and Kane's SFAs), so my explanations must avoid oversimplification while remaining concise. Their frustration with "cottage industry" complexity suggests they'd appreciate clarity about which moves substantively advance debates vs. which are dialectical dead ends.

  Notable challenge: Kane's SFA defense is elegant but its success depends on accepting libertarian premises - hence "Partial" alongside the structurally similar flicker approach. Meanwhile Mele/Robb gets "Strong" because it technically achieves its narrow aim of blocking flickers, even if it doesn't resolve deeper issues.

  Biggest insight: Fischer's semi-compatibilism might be the most transformative response precisely because it sidesteps the PAP battlefield entirely - a strategic victory rather than tactical. That deserves "Decisive" for reorienting the discourse, though PAP loyalists would disagree.
