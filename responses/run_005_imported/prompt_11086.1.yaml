prompt: |-
  Ok so I fell down a rabbit hole this weekend that started with an AI safety podcast, wandered through Newcomb's problem, and ended with me reading old LessWrong posts about "updateless decision theory" (I think Wei Dai came up with this? not totally sure). Havent taken a philosophy class since a gen-ed requirement in college so I'm probably missing context here. The example that hooked me was the "counterfactual mugging" thing: Omega flips a fair coin, and if it comes up heads it walks up and asks you for $100; if it had come up tails instead, it would've given you $10,000, but only if it had predicted beforehand that you'd be willing to pay the $100 in the heads case. Standard causal decision theory says that once you actually see heads, paying is pointless -- the coin already landed, you can't reach back and cause yourself to get the $10k in the other branch -- so a CDT agent keeps its money and ends up worse off on average than an agent that would've paid. Updateless decision theory is apparently the fix, because it wont let you "update" and recompute what's optimal after you already know the coin flip, you just commit up front to whatever policy is best across both branches.

  Here's my hangup though: isn't "don't recompute after you get new info" just a fancy way of saying "ignore the evidence"? In my day job that would be a straightforward bug. If I shipped a fraud-detection model that refused to change its behavior after seeing new labeled data because it had already "committed" to a policy back at training time, that's not a feature, thats a stale model, and we'd get paged about it. So why does a huge chunk of the AI safety / rationalist world treat "updatelessness" as the mark of a smarter agent instead of a strictly worse one? I brought it up with a coworker who's way deeper into this stuff than me and he just said "that's kind of the point" like it was obvious, which, uh, did not help.
reasoning: |-
  Okay, let me try to unpack this user's question. They're confused about why updateless decision theory (UDT) is considered smart when it seems like ignoring new information. From their background, they work with machine learning models where updating with new data is crucial. So the conflict is clear: in their field, not updating is a bug, but in decision theory, it's presented as a feature.

  First, I need to recall the counterfactual mugging example they mentioned. Omega's coin flip: heads, you pay $100; tails, you get $10,000 only if Omega predicted you'd pay in the heads scenario. CDT fails here because after seeing heads, it won't pay since it can't affect the past. UDT commits to a pre-flip policy, which in this case is to pay, ensuring the $10k in the tails branch. 

  The user's main hangup is equating "not updating" with ignoring evidence. But in UDT, it's not about ignoring evidence per se; it's about optimizing policies across all possible outcomes before the event. The key difference is between updating beliefs versus updating the decision-making policy. UDT separates the two: update beliefs with evidence, but stick to the pre-committed policy that was optimal globally.

  I should explain why this isn't a stale model. In ML, models update to improve future predictions based on new data. But in UDT, the policy is designed to handle all scenarios from the start, especially when decisions in one branch affect outcomes in another due to predictors like Omega. The model isn't stale because it was trained (pre-committed) to maximize expected utility across all counterfactuals.

  The user's coworker said "that's the point," which might mean that UDT's strength is handling predictors who can simulate your decisions. The user might need examples beyond counterfactual mugging. Maybe Newcomb's problem, where CDT takes both boxes and loses, while UDT takes one box and wins, trusting the prediction.

  Also, addressing their ML analogy: training vs. inference. UDT is like setting a policy during training that's optimized for deployment across all possible states, including those influenced by the policy itself. During inference, you don't change the policy on the fly because that would break the pre-commitment needed for the predictor to reward you in other branches.

  I need to emphasize the role of acausal agents like Omega. The predictor's knowledge links different branches, making your decision in one affect outcomes in another. UDT's pre-commitment ensures you act in a way that makes the predictor favor you in all scenarios. 

  The user's deeper need might be reconciling real-world ML practices with abstract decision theories. They might worry UDT is impractical. But it's a framework for specific problems with predictors, not general ML. Highlighting the niche application could help. Also, clarifying terms like "update" – UDT updates knowledge but not the policy, whereas in ML, updating the model changes its policy.
answer: |-
  You've hit on one of the most subtle and controversial tensions in decision theory! Your intuition about "ignoring evidence" is completely valid from a standard statistical perspective. Let me break down why UDT isn't quite that – and why it's contextually useful for certain *predictable* problems:

  ### 1. **The Core Misconception: "Update" vs. "Policy Change"**
     - **In ML/Fraud Detection:** "Updating" means *revising your model's parameters* when new data shows your *current model is inaccurate*. This is about *belief correction*.
     - **In UDT:** "Updating" refers to *recomputing your optimal action* **after** learning which branch of a counterfactual you're in. UDT argues this *recomputation* is the mistake in predictor-based dilemmas. It separates:
       - **Belief updating:** You still update your knowledge (e.g., "I see heads").
       - **Policy commitment:** You stick to the *pre-committed action* your "whole self" chose *before* knowing the branch.

  ### 2. **Why CDT Fails in Predictor Games (Like Mugging)**
     CDT says: "Given I see heads, paying $100 can't *cause* me to get $10k in the tails branch (which didn't happen)." This is *causally correct*.  
     **The catch:** Omega's prediction *links the branches*. Your action in the heads branch *isn't causing* the tails outcome – it's **correlated** with it via Omega's simulation of your policy. CDT fails because it ignores how your *pre-commitment* shapes Omega's behavior in *all* branches.

  ### 3. **UDT's Gambit: Optimize the "Source Code"**
     UDT treats your decision algorithm as a *fixed program* that Omega can simulate *before* the coin flip. It asks:  
     *"What single piece of code should I 'upload' now, such that when Omega simulates it in* ***all possible branches***, *my average payoff is maximized?"*  
     - **Heads Branch:** Code outputs "Pay $100".
     - **Tails Branch:** Simulation shows "Would pay if heads" → Omega gives $10k.  
     **Net gain:** (50% × -$100) + (50% × $10,000) = **$4,950**  
     CDT's code (defect if heads) nets $0 in tails → **$0 average**.

  ### 4. **Why This Isn't "Ignoring Evidence"**
     - You **use** the evidence ("I see heads!") to *execute* the correct branch of your policy.  
     - You **don't use it** to *redefine what the policy should be* in that branch, because that would break Omega's prediction in the counterfactual.  
     **Analogy:** Imagine coding a video game NPC:  
       - *Bad (CDT):* NPC sees a dragon → recalculates "Fighting is irrational now" → runs.  
       - *Good (UDT):* NPC *pre*-codes "If see dragon → fight" because the *designer* knows this makes dragons avoid the NPC entirely. The NPC doesn't "ignore" the dragon – it follows its optimal pre-scripted response.

  ### 5. **The Crucial Context: When UDT Matters**
     UDT isn't for *all* decisions – it's for dilemmas involving:  
     - **Superintelligent predictors** (Omega) who simulate you *perfectly*.  
     - **Acausal connections** where your action in *one* branch affects outcomes in *another* via prediction.  
     In everyday decisions (e.g., "Should I buy a lottery ticket?"), updating *is* correct. UDT addresses a niche where *your algorithm's consistency across branches* is what's being tested.

  ### 6. **The ML Analogy: Training vs. Deployment**
     - **Training Phase (Pre-commitment):** You optimize your model's *architecture* and *training protocol* using *all available data* (simulating counterfactuals).  
     - **Deployment Phase (Execution):** In production, you *don't retrain the model on every inference* – you run the frozen code.  
     UDT is like optimizing the training process for predictors who can *penalize you* if your deployment behavior doesn't match your training promises. "Updating" mid-deployment breaks the trust.

  ### Why AI Safety Cares
  Self-improving AGI might create Omega-like scenarios:  
  - An AI could predict its own future actions.  
  - Its subsystems might "tempt" each other to defect from cooperative policies.  
  UDT aims to build agents that remain *correlated* with their own idealized pre-commitments, avoiding self-sabotage. It’s not about ignoring *facts*, but about maintaining *strategic integrity* across counterfactuals.  

  **Your coworker's "that's the point" hint:** UDT *intentionally* defies causal intuition because in predictor games, CDT's "rational" myopia is exploitable. It's a feature for a specific threat model. That said, critics argue UDT is uncomputable, underspecified, or overfits to toy problems. The debate is very much alive!  

  If this still feels paradoxical, you're in good company – it exposes how deeply *time, causality, and identity* are tangled in decision theory.
