  Hey, random question for a novel I'm plotting -- I've got two con artists who have to make a series of go/no-go calls over the course of one long job, where at any point either of them could cut and run with a bigger cut for themselves, but if they both hold their nerve to the end the total payout is way bigger (basically a real-world centipede game / finitely repeated prisoner's dilemma). I want a cynical old academic side character to lay out the backward induction argument -- Aumann's claim that common knowledge of rationality actually forces rational players to betray at the very first opportunity -- and then have another character push back with the Binmore/Reny-style objection that the whole argument is shakier than it looks, something about common knowledge of rationality not even being a coherent thing to assume once you're off the "rational" path. Can you actually walk me through both sides properly (not just gesture at them) and tell me who comes out ahead? I've read summaries of this fight before but never really got why people think its such a big deal.
