answer: |-
  That's a razor-sharp observation about Douglass's interpretive shift and its resonance with modern debates. You're right to separate the moral outcome from the interpretive method itself. Analyzing whether Douglass would embrace *today's* originalism requires dissecting his specific arguments and contrasting them with the core tenets of modern originalism.

  Here's a breakdown of why Douglass would likely be **dead against modern originalism as it's predominantly practiced**:

  1.  **The Core Conflict: Text vs. Framers' Intent/Understanding:**
      *   **Douglass's Position:** His entire break with Garrison hinged on *rejecting* the Framers' pro-slavery intent and contemporary understanding as the binding force of the Constitution. He argued that the *written words themselves* ("persons," "citizens," "privileges and immunities," the lack of explicit sanction for slavery) created a framework fundamentally incompatible with slavery, regardless of what the Framers *meant* or what people *believed* at the time. As he put it in his 1860 Glasgow speech: "I hold that the Federal Government was never, in its essence, anything but an anti-slavery government... Abolish slavery tomorrow, and not a sentence or syllable of the Constitution need be altered." His method was **text-focused, principle-driven, and deliberately divorced from the Framers' compromised intentions.**
      *   **Modern Originalism:** While complex and varied, the dominant strands of modern originalism (Scalia, Thomas, much of the Federalist Society) heavily prioritize either:
          *   **Original Intent:** What the Framers *intended* the words to mean.
          *   **Original Public Meaning (OPM):** How the words would have been understood by a reasonable, informed person *at the time of ratification.*
      *   **The Clash:** Douglass's method is fundamentally *opposed* to both of these. He explicitly argued that the Framers' intent *was* pro-slavery, and the original public understanding *was* that the Constitution protected slavery. His interpretive genius was saying **"That doesn't matter; look at what the text actually says."** Modern originalism, by focusing on historical intent or understanding, would *require* incorporating the very pro-slavery context Douglass rejected as determinative.

  2.  **Douglass's Textualism as a Tool for Liberation, Not Historical Constraint:**
      *   Douglass used the text dynamically. He focused on broad principles ("liberty," "due process," "general welfare") embedded in the language and argued they had inherent power to delegitimize slavery, even if that wasn't their immediate application. He saw the text as containing "radical guarantees" that could be activated over time.
      *   Modern originalism (especially OPM) is often deployed as a *constraint* on interpretation, binding the meaning to historical context. For Douglass, binding meaning to the 1787/1788 understanding would have locked in the pro-slavery interpretations he fought against. His textualism was inherently *aspirational*, seeing the Constitution's language as a blueprint for a freedom it hadn't yet fully realized. Originalism is often seen as *prescriptive*, defining the fixed meaning established at the founding.

  3.  **The Role of Moral Principles:**
      *   While you rightly want to avoid the simple "civil rights" answer, Douglass's interpretive shift was *deeply* motivated by moral purpose. He rejected Garrison's "burn the Constitution" stance because he saw the text as a potential *weapon* for abolition. His textualism wasn't dry legalism; it was a strategic embrace of the system's own words to dismantle its greatest evil.
      *   Modern originalism often presents itself as neutral, focusing on historical facts rather than moral outcomes. However, Douglass would likely see an interpretive method that prioritizes the understanding of a society steeped in white supremacy and slavery as inherently *not* neutral. It would, from his perspective, risk codifying the very injustices he fought.

  4.  **"Original Meaning" vs. "Original Understanding":**
      *   There's a nuance here. Some originalists distinguish between "original public meaning" (the semantic meaning of the words at the time) and "original expected application" (how people at the time expected those words to be applied). They argue OPM is fixed, but application can evolve.
      *   **Douglass's Likely Rebuttal:** He would likely argue that the "original public meaning" of terms like "persons" or "property" *included* enslaved people as property in the minds of the ratifiers. His argument wasn't *just* about application; it was about insisting the *semantic meaning* of "persons" *should* be read to include enslaved people as rights-bearing individuals, contrary to the prevailing understanding. He forced a moral and philosophical reading *onto* the text, overriding the historical semantic context. Originalism, even OPM, would struggle to justify this leap based solely on 18th-century linguistic evidence.

  **Conclusion:**

  Based on his specific arguments and the *reason* he adopted a textualist approach, **Frederick Douglass would almost certainly be a fierce critic of modern originalism.** He developed his interpretive method *specifically* to *reject* the authority of the Framers' intent and the original public understanding regarding slavery. He championed the text *against* that history. Modern originalism, in its dominant forms, elevates precisely that historical context – intent or public meaning at ratification – as the key to interpretation. Douglass would see this as locking in the very pro-slavery framework he dedicated his life to dismantling through his radical re-reading of the text. His textualism was a tool for liberation grounded in principle; he would likely view much of modern originalism as a tool for historical constraint that risks perpetuating past injustices by privileging the understanding of a deeply flawed era.
