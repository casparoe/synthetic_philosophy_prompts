  ## MEMORANDUM: URGENT RESOLUTION FOR HOMECOMING PLEDGE DRIVE ESCALATION

  **TO:** Student Council Executive Board  
  **FROM:** [Your Name/Position, e.g., VP of Finance, or "The Rules Committee"]  
  **DATE:** October [Date], 2023  
  **SUBJECT:** Proposed Resolution: Homecoming Pledge Drive Cap & Recognition  

  **BACKGROUND:**  
  The competitive spirit during this year's Homecoming pledge drive significantly escalated between the Junior and Senior classes, resulting in pledged totals (~$2,800 each) far exceeding reasonable collection capacity. This escalation, while initially driven by enthusiasm, has created untenable pressure on students and families, with reports of personal funds used and financial hardship concerns. The core purpose of supporting the Food Bank risks being overshadowed by the competition's intensity. While no explicit rules were broken, the *collectibility* and *spirit* of the drive have been compromised.

  **THE JUNIORS' CONCERN (Engaged Directly):**  
  We acknowledge and take seriously the Junior class position: they engaged within the *stated rules* of the drive, matched increases strategically, and currently hold the lead. Declaring them "winners" based solely on the current whiteboard numbers is the literal interpretation of the original competition framework. They argue their commitment should be honored.

  **THE PROBLEM:**  
  However, honoring the *entirety* of the escalated pledges creates significant problems:
  1.  **Collectibility Risk:** Evidence suggests a substantial portion of these pledges ($2,500+ per class) cannot realistically be collected by Friday. This risks the Food Bank receiving *less* overall if pledges default, damaging our credibility and the event's purpose.
  2.  **Undue Pressure:** Students felt compelled to pledge beyond their means due to peer/competitive pressure, not genuine charitable intent. This violates the spirit of voluntary giving.
  3.  **Equity & Well-being:** Requiring payment on these inflated pledges imposes financial hardship on some families, creating an unfair burden and detracting from school spirit.
  4.  **Distorted Purpose:** The drive became primarily about "winning" the competition, not supporting the Food Bank. Allowing the final escalated numbers to stand validates this distortion.

  **PROPOSED RESOLUTION & CALL TO ACTION:**  
  **The Executive Board must vote to implement a Pledge Cap and reset the competitive totals based on pledges made BEFORE the unsustainable escalation began.** Specifically:

  1.  **Void Escalated Pledges:** All pledges *added specifically during the direct, reactive back-and-forth escalation* between Juniors and Seniors (starting from approximately the point pledges exceeded ~$500/class and became primarily competitive counters, not genuine new pledges) will be considered **void and non-binding**. Students are *not* obligated to pay these amounts.
  2.  **Establish Baseline & Cap:** The competitive totals for **BOTH** Junior and Senior classes will be reset to **$300 each** (the approximate level *before* the unsustainable escalation began). This represents the point where genuine, non-reactive pledges stopped.
  3.  **Honor Baseline Pledges:** Pledges made *up to the $300 baseline* for *all grades* remain **binding and must be collected** as originally intended. This respects the initial commitment of all donors.
  4.  **Allow Voluntary Additional Donations:** Students from *all grades* are **encouraged** to make *new, voluntary* donations **ABOVE** the $300 baseline if they wish to further support the Food Bank. These *new* donations will be tracked separately from the competitive total but will count towards the school's overall Food Bank contribution.
  5.  **Determine the Winner:** The competition winner (for the trophy and pizza party) will be based **SOLELY** on the **reset baseline totals ($300 per class)**. The class with the highest *baseline* total wins. *(Based on pre-escalation numbers, this likely means Seniors and Juniors tie at $300, but verify actual pre-escalation tallies if possible).*
  6.  **Pep Rally Announcement:** Announce the cap, the reset to baseline totals ($300), the winner based on those baselines, and the opportunity for voluntary additional donations. Emphasize the collective win for the Food Bank from the baseline pledges and any additional generosity.

  **WHY THIS ADDRESSES THE JUNIORS' FAIRNESS CONCERN:**  
  *   **Respects Initial Rules Within Reason:** It honors the pledges made *before* the environment became coercive and unsustainable ($300 baseline), which *were* collected under the original "fair" rules.
  *   **Acknowledges Their Strategy (Partially):** Their efforts *up to the baseline* are recognized and counted. Their strategic matching *caused* the problem, but it also highlighted the need for this intervention. The resolution doesn't punish them for playing the game, but it prevents the game's flawed outcome from causing real harm.
  *   **Focuses on Collectible Reality:** Declaring a winner based on uncollectible pledges is an *empty* victory. Winning based on the solid, collectible $300 baseline is a *real* win that delivers actual benefit to the Food Bank.
  *   **Avoids Punishing Prudence:** Juniors who *did* pledge within their means during the escalation are protected from financial hardship by the voiding of the excessive amounts, just like prudent Seniors.
  *   **Preserves Competitive Integrity (Adjusted):** The competition is decided on pledges that reflect genuine intent and are fully collectible, restoring integrity to the "win."

  **WHY THIS IS THE RIGHT CALL OVERALL:**  
  *   **Protects Students & Families:** Removes undue financial pressure and potential hardship.
  *   **Ensures Food Bank Support:** Maximizes the likelihood of actually collecting the pledged funds ($300 baseline + voluntary extras) and protects our relationship with them.
  *   **Upholds the Spirit of Giving:** Refocuses the drive on charity, not competition-at-all-costs.
  *   **Restores School Spirit:** Ends the toxic standoff and allows Homecoming to be celebratory.
  *   **Demonstrates Responsible Leadership:** The E-Board acts decisively to correct an unforeseen situation for the greater good.

  **VOTE REQUIRED:**  
  **Motion:** To resolve the Homecoming pledge drive escalation by voiding pledges made during the unsustainable back-and-forth between Juniors and Seniors, resetting the competitive totals for both classes to the pre-escalation baseline of $300, honoring all baseline pledges, encouraging voluntary additional donations, and declaring the winner based on the reset baseline totals. Announcement to be made at the Pep Rally.

  **VOTE:** [ ] Yes [ ] No

  **DISCUSSION & VOTE TO OCCUR IMMEDIATELY.** Time is critical before the Pep Rally. This solution is fair, practical, prioritizes student well-being and the Food Bank, and directly addresses the valid concerns raised while preventing a potentially damaging outcome.
