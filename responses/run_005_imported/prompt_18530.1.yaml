  ### Explanation of Ranking:
  - **1. Knowledge norm (Williamson)**: Most defensible because it correctly prohibits assertions in Moore, lottery, and Gettier cases by requiring knowledge, but its decisive failure is on selfless assertion, where it inappropriately forbids assertions based on strong evidence when belief is absent.
  - **2. Reasonable-to-believe norm (Lackey)**: Second most defensible as it handles Moore (contradictions are unreasonable to believe) and selfless assertion (evidence makes it reasonable to believe) but fails decisively on lottery propositions by permitting assertions based on reasonable belief without knowledge.
  - **3. Rational-credibility norm (Douven)**: Less defensible than Lackey's norm due to similar failures, but it ranks lower because its focus on evidence-based credibility (rather than reasonableness) may be slightly less intuitive in Moore cases; lottery propositions drive its ranking by showing it allows assertions without knowledge.
  - **4. Belief (sincerity) norm**: Weak because it only reliably handles Moore paradoxes but fails selfless assertion (prohibiting evidence-based assertions without belief), lottery (allowing assertions with belief but no knowledge), and Gettier cases (allowing lucky true beliefs).
  - **5. Truth norm (Weiner)**: Least defensible as it only handles selfless assertion if true but fails lottery (allowing true assertions without knowledge), Moore (allowing possibly true but absurd assertions), and Gettier cases (allowing assertions based on lucky truth).
