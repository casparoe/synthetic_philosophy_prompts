      "reason": "It handles Moore, lottery, and Gettier cases well but fails to permit selfless assertions where the speaker lacks belief yet has strong evidence."
    },
    "2": {
      "norm": "Reasonable-to-believe norm (Lackey)",
      "decisive_case": "Lottery propositions",
      "reason": "It handles Moore and selfless assertion appropriately but fails to prohibit lottery assertions despite high odds, as it allows reasonable belief without knowledge."
    },
    "3": {
      "norm": "Rational-credibility norm (Douven)",
      "decisive_case": "Lottery propositions",
      "reason": "It accommodates selfless assertion and Moore cases but fails to explain why lottery assertions are improper, as high evidence-based credibility does not ensure assertability."
    },
    "4": {
      "norm": "Belief (sincerity) norm",
      "decisive_case": "Selfless assertion",
      "reason": "It handles Moore paradoxes but fails selfless assertion by forbidding justified assertions when the speaker lacks belief, and also fails lottery and Gettier cases."
    },
    "5": {
      "norm": "Truth norm (Weiner)",
      "decisive_case": "Lottery propositions",
      "reason": "It permits selfless assertion if true but fails lottery, Moore, and Gettier cases by allowing assertions solely based on truth, ignoring epistemic shortcomings."
    }
