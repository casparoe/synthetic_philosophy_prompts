  Based on the analysis of how each norm handles the four key cases (Moore-paradoxical assertions, lottery propositions, selfless assertion, and Gettier-style lucky true belief), the norms are ranked from most to least defensible. The ranking prioritizes norms that best explain the impropriety or propriety of assertions across all cases, with the decisive case being the primary reason for each norm's position.

