answer: |-
  ## The Ergodicity Gambit: Dissecting the Kelly Criterion and the Objectivity of Geometric Growth

  Your journey from statistical mechanics to the contested terrain of decision theory places you perfectly to dissect this fascinating dispute. The core tension – between Ole Peters' "ergodicity economics" claim for the objective primacy of geometric growth and Samuelson's defense of expected utility as the arbiter of rationality – strikes at the foundations of how we model choice under repeated risk. Let's reconstruct the arguments with precision and arrive at a committed verdict.

  **Reconstructing the Battle Lines:**

  1.  **The Kelly Insight (Subjectivist Defense):** Kelly demonstrated that for an agent with *logarithmic utility of wealth*, maximizing expected log-wealth (equivalent to maximizing the geometric mean growth rate) is the strategy that asymptotically maximizes the *rate* of wealth growth in repeated, independent, favorable gambles. This is a powerful result *within the expected utility framework*. Kelly framed it as a solution for a specific preference (log utility), not as a universal law. It addresses risk aversion implicitly through the curvature of the log function, penalizing losses more severely than linear utility does.

  2.  **The Samuelson Objection (Defense of Subjectivity):** Samuelson launched a sustained critique against misinterpreting Kelly. His core argument, echoing your summary:
      *   **"Long Run" vs. Expected Utility:** Almost-sure dominance in the long run (i.e., wealth growing faster with probability 1 as time goes to infinity) is *not* equivalent to maximizing expected utility for a *finite* horizon or for a utility function other than log. A strategy maximizing expected linear utility (E[W]) might yield vastly higher wealth for some finite horizons or specific realizations, even if it eventually loses almost surely to a Kelly-optimal strategy. Crucially, a rational agent with a different utility function (e.g., highly risk-averse with U(W) = -1/W, or focused on short-term survival) would *rightly* choose differently than the Kelly bettor.
      *   **Utility is Primordial:** The choice of utility function embodies the agent's fundamental preferences regarding risk and wealth distribution. There is no "objective" utility function; rationality is defined relative to consistent preferences. Privileging log-wealth is just choosing one specific (though often sensible) preference structure.

  3.  **The Peters Gambit (Ergodicity Economics - Objectivist Claim):** Peters reframes the problem through the lens of dynamical systems and statistical mechanics:
      *   **Ensemble Average vs. Time Average:** In a non-ergodic system, the ensemble average (E[W_t] - the average wealth across *all possible parallel realizations* at time t) and the time average (<W>_T = (1/T) ∑ ln(W_t) for multiplicative processes, or lim_{T→∞} (1/T) ∑ ln(W_t) for growth rate) *diverge*. Your coin example is canonical: E[W_t] = W_0 * (1.5 * 0.5 * 0.5 + ... conceptually constant paths) remains constant forever (ensemble average), while the time-average growth rate per flip is (1/2)ln(1.5) + (1/2)ln(0.5) = ln(√(1.5*0.5)) = ln(√0.75) < 0, leading almost all *individual trajectories* to ruin (time average).
      *   **Observability is Key:** Peters argues that an individual agent doesn't experience the ensemble average; they live a single trajectory. Rationality should concern maximizing the observable outcome *along this single path*. For multiplicative wealth dynamics, this observable outcome is the *long-term time-average growth rate*, g = lim_{T→∞} (1/T) ln(W_T / W_0). Maximizing g is equivalent to maximizing the expected log-wealth *for a single multiplicative step* (as Kelly does).
      *   **"Objective" Rationality Claim:** When ergodicity is broken (ensemble avg ≠ time avg), maximizing the time-average growth rate (g) is argued to be the *only* rational criterion because it corresponds to the actual, observable wealth dynamic for the individual. It's not about risk preference; it's about correctly identifying which quantity (time avg) describes the individual's empirical reality, and maximizing *that*. Choosing a strategy optimizing E[W] (ensemble avg) leads to ruin almost surely, which Peters deems objectively irrational regardless of utility function.

  **The Verdict: Geometric Rationality as Objectively Correct *for a Specific Criterion in Multiplicative Dynamics***

  While Samuelson's defense of utility subjectivity is unassailable *as a general principle of rational choice theory*, Peters identifies a crucial domain where maximizing geometric growth possesses a unique, objective force **for the specific goal of maximizing long-run wealth *on a single realized path* in repeated, independent, multiplicative gambles.**

  1.  **The Irrelevance of Ensemble Averages for Single-Path Survival:** Samuelson is correct that E[W] maximization *could* be optimal *if* an agent could average across parallel universes or had a utility function valuing that specific average. But in the real world, an agent faces one sequence of outcomes. In multiplicative processes like the coin flip, *any* strategy that doesn't maximize g (i.e., doesn't use the Kelly fraction) will, *with probability 1*, be dominated in the long run by a strategy that does. More damningly, strategies maximizing E[W] often lead to *almost sure ruin* (Pr(W_T → 0) = 1) while Kelly strategies (for favorable gambles) lead to *almost sure growth* (Pr(W_T → ∞) = 1). **A criterion leading to almost certain destruction of wealth on the only path that exists cannot be rationally defended as optimal for achieving long-run wealth on that path, irrespective of utility curvature.** This is stronger than mere risk aversion; it's existential.
  2.  **The Primacy of the Time Average for Path-Wise Goals:** If the agent's goal is explicitly "maximize the wealth I will actually have in the distant future on the path I am living," then maximizing g is objectively the correct criterion for multiplicative dynamics. It directly controls the dominant term in W_T = W_0 * exp(g*T + ...) for large T. E[W_T] is irrelevant to this goal because it describes an average over paths that won't be realized. **For the goal of long-run wealth *on my path*, g is the observable, controllable parameter.**
  3.  **The Limits of the Objectivity:** This objectivity holds *only* for:
      *   **Repeated, Independent Gambles:** The long-run limit must be meaningful.
      *   **Multiplicative Dynamics:** Wealth grows/declines by multiplicative factors. The argument relies on the exponential relationship between additive log-wealth and multiplicative wealth.
      *   **The Specific Goal of Long-Run Wealth on a Single Path:** If the agent has a different goal (e.g., maximizing the probability of reaching a specific wealth target in 10 years, minimizing the chance of ruin in the next year, maximizing utility derived from intermediate consumption, or intrinsically valuing the ensemble average), then maximizing g may *not* be optimal. A rational agent with a nonlinear utility *not* tied solely to terminal log-wealth could prefer a different strategy.
      *   **Favorable Gambles:** Kelly (and maximizing g) requires a positive expected log-return. Betting optimally on a losing game still loses.

  **Conclusion: A Qualified Victory for Geometric Rationality**

  Samuelson is fundamentally right: there is no universal, utility-free "objective rationality." Different goals demand different criteria. **However, Peters successfully identifies a critically important *class* of problems (repeated, independent, multiplicative gambles) and a *specific, natural goal* (maximize long-run wealth on the single realized path) where maximizing geometric growth (g) possesses a compelling, objective rationale grounded in the non-ergodic dynamics of the process.**

  For this class and goal, maximizing E[W] is demonstrably self-defeating, leading almost surely to ruin while strategies maximizing g lead almost surely to exponential growth. The divergence of ensemble and time averages isn't just a curiosity; it reveals that E[W] is a *mathematical fiction* with no bearing on the individual's observable long-run outcome. **Rationality, in this specific context, demands focusing on the time average (g) because it is the quantity that dictates the individual's destiny.** To choose a strategy optimizing E[W] over g is to choose a strategy guaranteed to make you poorer than the g-maximizer *on your own life's path* – a choice hard to reconcile with *any* coherent desire for long-run wealth.

  Therefore, while "it depends on your utility function" remains the broader mantra of rational choice, for the physicist analyzing wealth trajectories under multiplicative noise, geometric rationality isn't merely *a* preference; it's the inescapable consequence of aligning your strategy with the observable, long-run dynamics of your single, non-ergodic path. In that specific arena, Peters' ergodicity argument elevates the Kelly criterion from a subjectively prudent choice to the objectively necessary standard for achieving the goal of long-run wealth survival and growth.
