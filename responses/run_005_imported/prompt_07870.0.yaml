  ok this is gonna sound random but hear me out. i fell down a lesswrong rabbit hole on "acausal trade/threats" -- the idea that agents who can predict or simulate each other can cooperate, or even blackmail each other, with zero causal contact between them (like across branches of the multiverse or whatever) -- and this proposed defense called "surrogate goals," where you make yourself artificially care about some fake goal so that if you ever get threatened acausally, the threatener targets the fake thing instead of what you actually value. we're covering david lewis in philosophy class rn (the possible worlds unit) and it's bugging me that he's both THE modal realist (every possible world is just as concrete and real as ours, just causally sealed off from us) and THE causal decision theorist (only the causal consequences of your choices are supposed to matter, ignore newcomb-y correlations). those feel like they'd pull him in opposite directions once you bring acausal stuff into it. what do you think lewis would actually say about acausal threats, and would he think "surrogate goals" is even a coherent defense, or would he just say the whole threat is confused given his own commitments?
reasoning: |-
  Okay, let me unpack this user's question. They've fallen into a LessWrong rabbit hole about acausal trade and threats, and now they're connecting it to David Lewis's philosophy from their class. The core tension they see is between Lewis's modal realism (all possible worlds are real) and his causal decision theory (only causal consequences matter). 

  Hmm, the user is clearly intellectually curious—they're making interdisciplinary links between niche rationality concepts and academic philosophy. That's impressive. I notice some underlying anxiety though: they seem worried this theoretical conflict might undermine Lewis's coherence. Their question has three layers: (1) Would Lewis take acausal threats seriously? (2) How would he reconcile them with his theories? (3) Is the "surrogate goals" defense philosophically viable under his system?

  First, let's map Lewis's positions. Modal realism treats possible worlds as concrete but causally isolated. Causal decision theory (CDT) explicitly rejects acting on correlations without causation—that's why Lewis dismisses Newcomb's Paradox. So acausal threats, which rely on correlation across worlds, seem incompatible at first glance. 

  But wait—Lewis *does* discuss something adjacent: his "Principal Principle" connects credence to objective chance. If an agent in another world could *simulate* our actions perfectly (not merely correlate), might Lewis grant that this creates a "pseudo-causal" link? Probably not; he'd likely insist simulation isn't causation. His 1979 paper "Prisoners' Dilemma is a Newcomb Problem" shows he'd treat cross-world correlation as evidentiary, not causal.

  For surrogate goals... Lewis would smell a rat. If you "fake" caring about X to protect Y, but Y remains your true terminal value, then any perfect predictor/simulator would see through the ruse. The threatener would still target Y. The only defense is if the faking changes your *actual* decision algorithm—but Lewis's CDT has no mechanism for pre-commitment like that. 

  User's phrasing suggests they enjoy counterintuitive logic puzzles. I should emphasize the irony: the thinker who gave us concrete possible worlds must dismiss threats crossing those worlds as irrational to act upon. That's juicy. Also, surrogate goals might be more viable under functional decision theories (UDT/FDT)—could mention that as a contrast.

  Biggest hurdle: explaining why Lewis wouldn't bite the acausal bullet despite modal realism. Need to stress that causal isolation is the lynchpin—worlds are real but *sealed*. Correlation without causation is epistemically relevant (for beliefs) but not materially relevant (for actions). 

  User might be hoping for a "Lewis 2.0" solution, but staying true to his texts means admitting this is a hole in his framework. Should validate their insight—it *is* a genuine tension, even if Lewis's own answer would be dismissive.
answer: |-
  That's a brilliantly sharp connection you've made! You're absolutely right—David Lewis's **modal realism** (concrete possible worlds, causally isolated) and his **causal decision theory** (CDT, which ignores acausal correlations) create a fascinating tension when confronted with acausal threats/trade. Here's how I think Lewis would likely analyze this, based on his commitments:

  ### 1. **Would Lewis Even Acknowledge Acausal Threats as "Real" Threats?**
     - **No, on ontological grounds.** For Lewis, possible worlds are *concretely real but causally isolated*. An agent in World A cannot *affect* World B. Any "threat" from another world is metaphysically impossible—it’s not just impractical, it’s *categorically excluded* by the causal barrier.  
     - **Correlation ≠ Causation (or Threat):** Lewis’s CDT treats Newcomb-style problems (e.g., Omega’s prediction) as *evidential*, not causal. If an agent in another world "simulates" you and acts based on that simulation, Lewis would say this is merely a *correlation* between your decision and theirs across worlds—not a causal relationship. To threaten you, they’d need *causal leverage*, which is impossible.

  ### 2. **Lewis on "Surrogate Goals" as Defense**
     - **Incoherent under CDT:** Surrogate goals rely on *manipulating acausal correlations* (e.g., "If I care about X instead of Y, a predictor won’t target Y"). But CDT *deliberately ignores* such correlations. If there’s no causal path, changing your goals doesn’t change outcomes—it’s irrelevant under CDT.  
     - **Self-Undermining:** If you adopt a fake goal Z to protect real goal Y, a perfect simulator (or acausal threatener) would simulate *your true motives*, seeing through the ruse. Only if the simulator *can’t distinguish* true/fake goals would this work—but Lewis’s framework assumes perfect knowledge in hypotheticals (like in Newcomb problems).  
     - **CDT’s Stance:** Lewis would say: "Choose the action with the best *causal* consequences. If an acausal threat exists, it’s epistemically inaccessible—so ignore it."

  ### 3. **The Deeper Conflict: Modal Realism vs. CDT**
     - **The Pull:** Modal realism makes acausal interactions *seem* plausible—if all worlds are real, why can’t agents "reason across" them?  
     - **Lewis’s Resolution:** He’d likely **double down on causal isolation**. Even if worlds are concrete, *no information or influence crosses the boundary*. Simulating another world is just *computing facts about a separate reality*—it doesn’t create interaction.  
     - **"Possible Worlds Aren’t a Playground for Acausal Shenanigans":** For Lewis, possible worlds describe *what could be*, not *what interacts*. Acausal trade/threats require a *shared decision-theoretic fabric* across worlds—something his ontology explicitly denies.

  ### 4. **What Lewis Might Say About Acausal Threats**
     > "The threat is confused. If you’re being 'threatened' by an agent in another possible world, you’ve misunderstood causality. They can no more harm you than a character in a novel can. Their 'simulation' of you is just a physical process in their world, causally inert in yours. Decision theory concerns *causal consequences*—and here, there are none. Adjusting your goals to placate a phantom is superstition, not rationality."

  ### 5. **Would He Have an Alternative Defense?**
     - **No need:** In Lewis’s view, acausal threats are *empty*—like fearing a ghost. CDT already "defends" by ignoring them.  
     - **But what if we force the issue?** Suppose we imagine a being *within your world* that simulates other worlds (e.g., a superintelligence running multiverse models). Then:
       - The threat is *causal* (the being is in your world).
       - Surrogate goals *might* work—but only by *causally* altering the simulator’s model (e.g., making it believe you value Z).
       - This reduces to ordinary causal bargaining, not acausal magic.

  ### Conclusion
  Lewis would **reject the entire premise** of acausal threats as metaphysically incoherent under his system. Modal realism’s concrete worlds are causally sealed, and CDT’s focus on causal consequences makes acausal correlations irrelevant to action. Surrogate goals would strike him as a confused attempt to "hack" correlations that CDT rightly ignores. His response would be: **"If there's no causal pathway, there's no threat—just patterns without power."**  

  That said, your insight exposes a crack in Lewis’s edifice: modal realism *intuitively* suggests a "grand ensemble" of worlds where agents *should* care about acausal counterparts. This tension inspired modern decision theories (like **UDT/FDT**) that *do* take acausal correlations seriously. Lewis would dismiss them, but they’re the natural evolution of these ideas. Brilliant question!
