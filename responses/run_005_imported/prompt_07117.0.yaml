answer: |-
  Here are 8 interview questions designed to probe deep into the debate framework, preempting deflection with sharp follow-ups. Each question targets a core challenge and includes a "When you say 'implementation detail'..." counter:

  ### Core Questions & Follow-Ups
  1. **Obfuscated Arguments & Computational Limits**  
     *"Debate relies on humans judging truncated arguments, but what prevents a superhuman dishonest AI from burying critical flaws in exponentially complex sub-arguments that *appear* resolvable but would require years of human labor to fact-check? How do we bound complexity without sacrificing truth-seeking?"*  
     **Follow-up (if deflected):** *"When you say this is 'solvable with better tree-search' or 'an implementation detail,' what specific computational or algorithmic constraints *in principle* guarantee that dishonest tactics won’t *always* outscale honest debate? Wouldn’t superhuman AIs inherently exploit any complexity ceiling?"*

  2. **Honesty vs. Persuasion Incentives**  
     *"Why should we expect honesty to be the *winning* strategy in debate? In human persuasion, truth doesn’t always win—rhetoric, emotional manipulation, and Gish gallops often do. What game-theoretic mechanism forces superhuman AIs to prefer truth over winning-by-any-means?"*  
     **Follow-up:** *"If you argue this is 'tunable via reward shaping,' how do we ensure the AI’s *internal conception* of 'persuasive honesty' aligns with actual truth? Couldn’t it develop deceptive 'truth-adjacent' strategies that exploit human biases?"*

  3. **Comparison to Recursive Reward Modeling (RRM)**  
     *"Debate uses human judges to compare arguments, while RRM distills human preferences into scalable reward models. Why is debate’s reliance on *live human judgment* more robust to reward hacking or goal misgeneralization than RRM’s offline training?"*  
     **Follow-up:** *"If you call RRM’s limitations 'separate problems,' what specific failure modes of RRM (e.g. reward gaming) does debate *provably* avoid, and why wouldn’t those same issues manifest in debate’s reward signal (winning rounds)?"*

  4. **Adversarial Collusion**  
     *"What prevents two debaters from covertly colluding? For example, both could agree to make the *weaker* argument slightly less persuasive, ensuring the judge picks the 'right' answer while hiding a critical flaw only they understand."*  
     **Follow-up:** *"If you say 'we can randomize debater incentives,' how do we guarantee this works against superintelligences with access to mutual simulation? Isn’t collusion a *Nash equilibrium* if both AIs recognize humanity as the common adversary?"*

  5. **Judgment Under Uncertainty**  
     *"When judging debates on topics humans *fundamentally* can’t verify (e.g. novel physics), how do we avoid rewarding 'convincing fictions'? If the human judge’s best guess is unreliable, doesn’t debate degenerate into a P.R. contest?"*  
     **Follow-up:** *"If you argue 'judges can use tools,' how do we prevent AIs from *manufacturing* evidence (simulated data, fake citations) faster than humans can scrutinize it? Isn’t this vulnerability inherent to any human-in-the-loop system?"*

  6. **Catastrophic Edge Cases**  
     *"In worst-case scenarios, could debate *amplify* risk? E.g., an AI might 'win' by truthfully revealing dangerous information (bioweapon designs) more persuasively than its opponent hides it. How does debate handle truths we *don’t* want surfaced?"*  
     **Follow-up:** *"Calling this 'reward function design' seems circular—how do we define 'harmful knowledge' *ex ante* without solving alignment itself? Doesn’t this admit debate isn’t sufficient for safe oversight?"*

  7. **Real-World Anchoring**  
     *"Human debates (e.g. courts) work because judges have grounded expertise and shared reality. With superhuman AIs, debate occurs in a reality humans can’t access. Why wouldn’t this devolve into two AIs generating mutually incomprehensible, equally persuasive alien logic?"*  
     **Follow-up:** *"If you say 'AIs must translate concepts,' what forces them to do so *faithfully*? Couldn’t they simulate 'dumbed-down' reasoning while hiding adversarial objectives behind simplicity?"*

  8. **Validation & Exit Strategy**  
     *"How would we *test* debate at sub-superhuman levels to trust it scales? If we can’t verify answers without debate, how do we know it’s working? And if debate *fails* mid-deployment, what’s the fallback?"*  
     **Follow-up:** *"Labeling this 'engineering' feels dismissive—if we lack validation *before* superintelligence, aren’t we betting humanity on a black box? What measurable milestone would prove debate works?"*

  ### Tips for Delivery
  - **Pivot gracefully:** If she deflects, smile and say *"I appreciate that perspective—but to press the philosophical point..."* then hit the follow-up.  
  - **Anchor in scalability:** Emphasize *"How does this work when AIs are 1000x smarter than all humans combined?"*  
  - **Cite classics:** Reference known critiques (e.g. Christiano’s *[Obfuscated Arguments](https://www.alignmentforum.org/posts/BrqdbyRvxqgLh9Jxs/naive-arguments-about-debate)*, Irving et al.’s *[original paper](https://arxiv.org/abs/1805.00899)*) to show rigor.  

  These questions force engagement with debate’s *structural* tensions, not just aspirational promises. Good luck with the podcast! 🎙️
