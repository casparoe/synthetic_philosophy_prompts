  Second, legal/financial systems naturally create "points of no return" (contracts, debt, PR announcements) that fit the irreversible commitment angle. 
  Third, the scale is human enough to feel relatable while still having high stakes.

  For the protagonist, maybe a conflicted executive who understands the trap but gets overruled? That creates natural tension between rationality and institutional momentum. The "mid-commitment regret" moment could be when she sees the competitor's identical move unfolding in real-time.

  Key beats to hit: 
  - The ticking clock pressure (board meeting deadline) 
  - The "commitment cascade" (each escalation making reversal more costly) 
  - The horror of realizing mutual destruction is locked in 
