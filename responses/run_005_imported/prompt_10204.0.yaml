answer: |-
  You've pinpointed a fascinating and genuinely tense ambiguity in Sidgwick's argument. Your reading is spot-on: the passage oscillates between a **valid statistical argument about cumulative evidence** and a **profoundly pessimistic observation about the unfalsifiability of the fraud hypothesis**. Let's reconstruct both strands and see if Sidgwick can reconcile them.

  ## 1. The Valid Statistical Argument (The "Heap of Facts" Strategy)

  *   **Core Premise:** Individual reports of paranormal phenomena are vulnerable to specific objections: fraud, error, hallucination, misinterpretation, coincidence, etc. No single case, no matter how well-investigated by a credible person, can be *absolutely conclusive* because the possibility of investigator error or deception remains.
  *   **Cumulative Power:** The strategy relies on gathering a *large number* of reports meeting specific criteria:
      *   **Independence:** Reports arise from different witnesses, locations, times, and investigators.
      *   **Variety:** Phenomena occur under diverse, uncontrolled conditions.
      *   **Credibility:** Witnesses and investigators have "a fair stock of credit to draw upon" – they are generally considered reliable, honest, and competent in other areas.
  *   **Statistical Force:** As the heap of independently attested facts grows, the probability that *every single instance* is explained by fraud, error, or coincidence *simultaneously* becomes vanishingly small. It's the joint probability of numerous independent low-probability events (e.g., every honest investigator being fooled *or* committing fraud *in this specific instance*). This is the "burying alive" under a mass of data that strains conventional explanations to the breaking point.
  *   **Goal:** To shift the burden of proof. The sheer mass of evidence makes the paranormal hypothesis *prima facie* plausible enough to demand serious scientific investigation, rather than automatic dismissal. It aims to overcome "scientific incredulity" rooted in methodological naturalism.

  **What Sidgwick is entitled to conclude here:** A large, diverse, independently corroborated body of evidence *can* make the hypothesis "it's all fraud/error" statistically implausible. It justifies further, rigorous investigation. It *can* move the needle for open-minded observers ("common sense of mankind").

  ## 2. The Unfalsifiability Problem (The "Investigator is in the Trick" Fallback)

  *   **Core Premise:** Sidgwick concedes that for *any single investigation*, no matter how meticulously conducted and reported by a credible person, the ultimate skeptical refuge is always available: accuse the investigator of being complicit in fraud ("in the trick").
  *   **Nature of the Accusation:** This is an *ad hominem* argument, attacking the investigator's character rather than the evidence or methodology. Crucially, it doesn't require evidence *for* the fraud; it merely asserts the *possibility*.
  *   **Unfalsifiability:** Because this accusation targets the *integrity* of the investigator rather than the *details of the evidence*, it is fundamentally unfalsifiable by the evidence *from that investigation*. No amount of controls, documentation, or witness testimony within a single case can *prove* the investigator wasn't deceptive. It shifts the debate from evidence to character.
  *   **Impact on the Cumulative Strategy:** This is where the tension arises. If the skeptic's ultimate fallback ("Investigator X lied/faked it") is *always available for every single case, regardless of its merits*, then adding more cases doesn't *logically disprove* the fraud hypothesis. It just adds more investigators who *could* potentially be accused of fraud. The skeptic can always say, "Case 1: fraud by Smith. Case 2: fraud by Jones. Case 3: fraud by Brown..." ad infinitum. The joint probability calculation relies on the *independence* and *prior credibility* of investigators. If the skeptic simply asserts dishonesty *as the default explanation for anyone reporting positive results*, the prior credibility is effectively set to zero *for the purpose of investigating the paranormal*, destroying the independence assumption. The "heap" doesn't bury the fraud hypothesis; the skeptic just adds an accusation for each new fact piled on.

  **What Sidgwick is conceding here:** The "investigator is in the trick" accusation is a logically irrefutable (though often unreasonable) *rhetorical* move available to a committed skeptic for *any individual case*. It renders *absolute, knockdown proof* of a paranormal event perpetually elusive *at the level of individual reports*.

  ## Is Sidgwick Equivocating? Can the Two Halves Be Reconciled?

  Sidgwick isn't *quite* equivocating blindly, but he is grappling with a deep tension inherent in investigating phenomena that challenge core scientific assumptions. He sees both points clearly:

  1.  **He recognizes the *practical* power of accumulation:** For reasonable people open to evidence, a vast heap of credible, independent reports *should* be compelling. It makes the "all fraud/error" hypothesis *practically* absurd, even if not *logically* impossible. This is the "common sense" target.
  2.  **He confronts the *logical* impasse with hardened skepticism:** He understands that a skeptic *determined* not to believe can always find a refuge in the unfalsifiable fraud accusation applied serially to each investigator. This is the "scientific incredulity" with "many and strong roots."

  **Is there a rigorous reconciliation?** Only partially, and it relies on context and burden-shifting:

  *   **Shrinking Joint Probability *Requires* Prior Credibility:** The cumulative argument *only works* if the investigators/witnesses are *initially granted* a non-zero prior probability of honesty and competence. Sidgwick assumes this ("fair stock of credit"). The skeptic who dismisses *every* investigator reporting positive results *a priori* is simply rejecting this starting point. Sidgwick is arguing that this blanket dismissal is *unreasonable* given the investigators' established credibility *outside* psychical research. He's entitled to argue that ignoring prior credibility is bad epistemology.
  *   **Burden Shifting:** The mass of evidence shifts the burden. It's no longer reasonable to demand *absolute, fraud-proof proof* for each case. The skeptic must either:
      *   Provide plausible *specific* fraud/error mechanisms for a *significant proportion* of the high-quality cases, or
      *   Explain *why* such a diverse group of otherwise credible people would *systematically* commit or be fooled by fraud on this specific topic.
  *   **Pragmatic vs. Absolute Proof:** Sidgwick isn't seeking *logical certainty* (which is unattainable against the unfalsifiable fraud hypothesis). He's seeking *pragmatic, scientific warrant* – enough evidence to make the paranormal hypothesis a serious contender demanding investigation *on its own terms* using standard scientific methods. The "heap" is meant to force that shift in attention. The "investigator in the trick" accusation, while logically possible, becomes increasingly *unreasonable and unscientific* as the heap grows and the investigators are vetted. A good scientist doesn't reject evidence solely based on an unsupported *possibility* of fraud when faced with a large, coherent body of data from credible sources.

  ## What Sidgwick Is and Isn't Entitled To Conclude

  *   **Entitled:**
      *   Individual cases, however good, cannot achieve *absolute* proof against the fraud hypothesis.
      *   A large, diverse body of independently investigated reports from credible sources *significantly increases* the implausibility of the hypothesis that *every single instance* is due to fraud or error.
      *   This accumulation is the *best available strategy* to overcome entrenched skepticism rooted in prior assumptions (methodological naturalism).
      *   Committed skeptics will *always* have the unfalsifiable "investigator fraud" accusation as a rhetorical fallback for any individual case.
      *   Overcoming scientific incredulity requires patience and mass ("pegging away," "mass of evidence").
  *   **Not Entitled (based solely on this argument):**
      *   That the cumulative evidence *logically compels* belief in the paranormal (the unfalsifiability loophole remains).
      *   That the "heap of facts" strategy will *inevitably succeed* in convincing the scientific mainstream (the strength of prior assumptions and the availability of the unfalsifiable counter may be too strong).
      *   That the "investigator in the trick" accusation is *reasonable* when applied systematically to a large group of otherwise credible investigators reporting similar phenomena under varied conditions. (He can argue it's unreasonable, but he can't *logically disprove* its possibility in each case).

  ## Conclusion

  Sidgwick is acutely aware of both the power *and* the limitations of his "heap of facts" strategy. He articulates a sound statistical principle for shifting probabilities and burden of proof through accumulation, grounded in the joint improbability of widespread independent error/fraud among credible sources. However, he simultaneously acknowledges the harsh reality that an *a priori* commitment to disbelief can always find shelter in the unfalsifiable accusation of investigator fraud applied serially. He doesn't fully resolve this tension; he presents it as the fundamental challenge facing psychical research.

  His reputation for intellectual honesty is evident here: he doesn't shy away from the most damning critique of his own strategy. He sees the "heap" as the only viable practical path forward, hoping the sheer weight will overwhelm the reflexive incredulity, even while recognizing the logical escape hatch for the truly determined skeptic. His argument is a powerful plea for open-mindedness and rigorous investigation, but it's also a sober admission of the profound difficulty in changing deeply held scientific paradigms, especially when the ultimate skeptical counterargument is immune to direct evidential refutation.
