  We are ranking the epistemic norms based on the strength of their accuracy-based justifications (via epistemic utility theory). The ranking tiers are S (strongest), A, B, C (weakest). We consider the standard arguments and their reception.

  1. **Probabilism**: The argument by Joyce (1998, 2009) and others shows that non-probabilistic credences are accuracy-dominated by probabilistic ones (under strictly proper scoring rules). This is widely accepted and robust.

  2. **Conditionalization**: There are arguments by Greaves and Wallace (2006) showing that conditionalization maximizes expected accuracy (from the prior perspective). This is also strong, but note that it assumes the agent adopts a fixed update procedure before learning. Some critiques exist (e.g., regarding the ex-ante perspective), but it is still a solid argument.

