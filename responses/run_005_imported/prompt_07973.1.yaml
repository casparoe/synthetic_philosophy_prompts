  4. **Regularity**: This norm says that credences should be regular (i.e., assign 0 only to logical falsehoods and 1 only to logical truths). Accuracy arguments for regularity are less straightforward. One might argue that assigning 0 to a truth (or 1 to a falsehood) leads to infinite inaccuracy (under log score). However, this requires using scoring rules that are unbounded (like the log score), which is not always assumed. Moreover, in many standard accuracy arguments (using bounded scores), regularity is not enforced. The argument is more controversial and less universally accepted.

