  For the prisoners, since they can agree on the choice function beforehand, it works, and for any actual assignment, only finitely many are wrong, regardless of how it was chosen, randomly or adversarially.

  But if we try to compute probabilities, we get inconsistencies because of non-measurable sets.

  So the honest resolution is that the representative-picking function is so non-constructive and non-measurable that "probability of success" isn't defined in a meaningful way for the events involved.

  To pin down the weirdness: AC allows us to pick representatives in a way that cannot be described or measured, and this introduces correlations that aren't there in the probabilistic sense.

  But in the combinatorial sense, it works.

  Another way to think: the strategy is using the infinite tail to encode information, but since the tail is fixed by the equivalence class, and the representative is chosen to agree on the tail, but it's arbitrary.

  I think for the gut level, it's that AC lets you make a global choice that aligns with the local views in a way that discrepancies are finite, but it's not constructive.

  So for your question, the resolution is indeed the non-measurability.
