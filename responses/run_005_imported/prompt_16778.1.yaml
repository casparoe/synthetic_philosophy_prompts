  The hat puzzle you described is a classic example that leverages the Axiom of Choice (AC) in a way that feels counterintuitive, especially when contrasted with probabilistic reasoning. Let's break it down step by step to clarify why it works, why it doesn't contradict the independence of random hat assignments, and where the "weirdness" resides.

  ### Step 1: The Strategy Using the Axiom of Choice
  - **Equivalence classes**: The prisoners consider the set of all possible hat sequences (functions from the natural numbers to the real numbers, denoted \(\mathbb{R}^\mathbb{N}\)). Two sequences are defined as "equivalent" if they differ in only finitely many positions. This partitions the space into equivalence classes.
  - **Choosing representatives**: Using the Axiom of Choice, the prisoners select a representative sequence for each equivalence class ahead of time. This choice is arbitrary and non-constructive—AC guarantees such a choice exists, but it doesn't specify how to find it.
  - **Guessing strategy**: Once hats are assigned (resulting in a sequence \(S = (s_1, s_2, s_3, \ldots)\)), each prisoner \(i\) observes all other hats \(S_{-i}\) (the sequence with the \(i\)-th position missing). Since \(S_{-i}\) determines the equivalence class of \(S\) (all completions of \(S_{-i}\) differ only at position \(i\), so they are all equivalent to \(S\)), prisoner \(i\) knows which equivalence class \(S\) belongs to. They then guess their own hat to be the \(i\)-th value of the representative sequence for that class.
  - **Outcome**: The actual sequence \(S\) and its representative \(R\) differ in only finitely many positions because they are in the same equivalence class. Thus, for all but finitely many \(i\), \(s_i = r_i\), meaning only finitely many prisoners guess incorrectly, regardless of the hat assignment.

  This works purely combinatorially for every possible hat sequence. AC enables this by allowing the prisoners to "coordinate" infinitely via the choice of representatives, even though no prisoner has access to the full sequence.

  ### Step 2: The Apparent Contradiction with Randomness
  Your confusion arises when considering random hat assignments. Suppose hats are assigned independently and identically (i.i.d.), with each hat drawn from a continuous distribution like uniform on \([0,1]\). In this case:
  - **Independence intuition**: For any prisoner \(i\), given \(S_{-i}\) (the hats they see), their own hat \(s_i\) should be independent of \(S_{-i}\) and have the same marginal distribution (e.g., uniform on \([0,1]\)). Since the guess \(g_i\) is fixed once \(S_{-i}\) is known (because it depends on the representative), and \(s_i\) is continuous, \(\mathbb{P}(s_i = g_i \mid S_{-i}) = 0\). Thus, \(\mathbb{P}(\text{prisoner } i \text{ guesses wrong} \mid S_{-i}) = 1\) almost surely. Unconditionally, \(\mathbb{P}(\text{prisoner } i \text{ guesses wrong}) = 1\).
  - **Contradiction with the strategy**: The strategy ensures that for every sequence, only finitely many prisoners guess wrong. Under i.i.d. assignments, this implies \(\mathbb{P}(\text{finitely many wrong}) = 1\). But if each prisoner guesses wrong with probability 1, it seems like \(\mathbb{P}(\text{infinitely many wrong}) = 1\), which contradicts the previous statement.

  This paradox highlights a tension between the deterministic success of the strategy and the probabilistic independence of the hats.

  ### Step 3: Resolving the Contradiction with Non-Measurability
  The resolution lies in the fact that the representative-choosing function (the choice function for the equivalence classes) is **non-measurable** with respect to any non-atomic product measure (like the i.i.d. uniform measure). Here's why:
  - **Non-measurable sets and events**: The events involved—such as "prisoner \(i\) guesses wrong" or "finitely many guess wrong"—depend on the representative function. Because the choice function is constructed using AC, it cannot be described constructively and does not respect the product \(\sigma\)-algebra (the standard way to define measurable events for product spaces like \(\mathbb{R}^\mathbb{N}\)). As a result:
    - These events are not measurable, so we cannot assign probabilities to them in a consistent way under the i.i.d. measure.
    - The conditional probabilities \(\mathbb{P}(s_i = g_i \mid S_{-i})\) and expectations like \(\mathbb{E}[\text{number wrong}]\) are ill-defined.
  - **Why non-measurability is inevitable**: 
    - Under an i.i.d. product measure, each equivalence class has probability 0 (as shown below). The choice function "samples" a representative from each class, but this sampling is so pathological that it creates sets that cannot be measured.
    - For example, fix a representative \(R\). The probability that a random sequence \(S\) is equivalent to \(R\) is \(\mathbb{P}(S \sim R) = \mathbb{P}(S \text{ and } R \text{ differ in finitely many positions})\). For any finite set \(F\), the probability that \(S\) agrees with \(R\) on \(\mathbb{N} \setminus F\) is 0 because it requires infinitely many independent events with probability 0 (e.g., \(\prod_{i \notin F} \mathbb{P}(s_i = r_i) = 0\)). Since there are countably many finite sets \(F\), \(\mathbb{P}(S \sim R) = 0\). Thus, each equivalence class has measure 0, and the choice function operates on a level that the measure cannot "see."
  - **Pointwise vs. probabilistic success**: The strategy works **pointwise** for every individual sequence, guaranteeing finite errors. But under a probabilistic framework, the non-measurability means that:
    - We cannot say that prisoners guess wrong "with probability 1" because the event isn't measurable.
    - The success of the strategy (finitely many wrong) holds almost surely not because of the measure, but because it holds for every sequence—but this set isn't measurable either, so \(\mathbb{P}(\text{finitely many wrong}) = 1\) is vacuously true only if we force the discrete \(\sigma\)-algebra, which contradicts the product measure structure.

  In essence, AC introduces non-measurable sets that break the probabilistic independence, allowing the strategy to work combinatorially while making probability theory inapplicable.

  ### Step 4: Pinpointing the "Weirdness"
  The weirdness you feel—that information is "manufactured out of nothing"—stems from the non-constructive power of AC:
  - **AC's role**: AC allows global coordination that isn't possible with local information alone. The representatives encode infinite information about the "tail" of the sequence, which prisoners access through their finite observations. This global choice forces the discrepancies to be finite, but it doesn't provide a way to compute or measure anything.
  - **Where the weirdness lives**: 
    - **In the choice function**: The representatives are chosen arbitrarily and cannot be described explicitly. This makes the strategy non-constructive—it exists mathematically but isn't implementable in any practical or computational sense.
    - **In the breakdown of measure**: Probability relies on measurability, but AC-generated sets are "too wild" for standard measures. This is why the independence intuition fails: the guess \(g_i\) is statistically dependent on \(s_i\) under the choice function, but this dependence isn't captured by the product measure. The non-measurability is not a "dodge"; it's the precise location of the paradox.
  - **Contrast with finite cases**: In finite versions of the puzzle (e.g., finitely many prisoners), AC isn't needed, and probabilistic reasoning works fine. But with infinitely many prisoners, AC's ability to handle uncountable infinities creates this phenomenon.

  ### Conclusion
  The hat puzzle works because AC lets the prisoners define a global strategy (via equivalence classes and representatives) that ensures finite errors for every possible sequence. However, under random hat assignments, the non-measurability of the choice function means that probabilistic concepts like independence and expectation become undefined or inconsistent. This isn't a flaw but a feature of AC: it enables powerful combinatorial outcomes at the cost of breaking measure-theoretic intuitions.

  As your math PhD friend said, "that's AC for you"—it's a tool that makes set theory richer but can lead to counterintuitive results when applied to analysis or probability. If you avoid AC, such a strategy might not exist, but with it, you get a guarantee that feels almost magical. The key takeaway is that AC and probability don't always mix well, and this puzzle is a perfect illustration of why.
