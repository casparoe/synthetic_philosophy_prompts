  **Justifications:**  
  - **Move 1 (+1):** Miriam is broadly correct about AC's indispensability for core mathematical results (bases, Tychonoff, etc.), and her "load-bearing" analogy has merit. However, "stuck with it" overstates the case – some mathematics (e.g., constructive analysis) rejects AC and remains coherent.  
  - **Move 2 (0):** Banach-Tarski is a valid *consequence* of AC, and Owen's "suspicion" reflects genuine philosophical discomfort. But calling it "a second ball for free" misrepresents the result – no new matter is created, and the reassembly relies on pathological decomposition.  
  - **Move 3 (+2):** Miriam's rebuttal is technically flawless. Non-measurable sets are rigorously defined, and the paradox vanishes if we reject the *assumption* that all sets must be measurable. AC doesn't "create" the paradox; it reveals a limitation of intuitive volume concepts.  
  - **Move 4 (-1):** Owen's core concern (AC's non-constructive nature) is valid, but his claim that other axioms "let you exhibit a concrete instance" is false. Axioms like Infinity (guaranteeing an infinite set) or Power Set (uncountable sets) also imply non-exhibitable objects. Calling AC uniquely "unfalsifiable" ignores this context.  

  ### Owen's Claim About Set Theory:  
  **No, it doesn't hold up.** Set theory axioms regularly imply non-constructible objects:  
  - **Axiom of Infinity:** Assures an infinite set exists but provides no "concrete instance" of completed infinity.  
  - **Power Set Axiom:** Guarantees uncountable sets (e.g., ℘(ℕ)) but offers no way to explicitly list their elements.  
  - **Axiom Schema of Replacement:** Generates sets beyond definable constructions (e.g., large ordinals).  
  AC is not unique here; its non-constructiveness is a matter of *degree* (producing counterintuitive objects like non-measurable sets), not kind.  

  ### Deeper Considerations Left Unaddressed:  
  1. **The Spectrum of Choice:** AC isn't binary. Weaker principles (e.g., Dependent Choice) support most "ordinary mathematics" (like real analysis) while blocking Banach-Tarski.  
  2. **Ontological Commitments:** AC forces a confrontation: must mathematics include sets *requiring* non-constructive axioms? Alternatives like **constructivism** or **computable mathematics** reject AC entirely.  
  3. **Consistency vs. Truth:** Even if AC is consistent (as Gödel proved), does that justify accepting its consequences? Or should mathematics prioritize *effective computability*?  
  4. **Alternative Frameworks:** In **Solovay's model** (ZF + "all sets are measurable"), Euclidean geometry behaves "normally" without AC – showing Banach-Tarski isn't inevitable.  

  ### Conclusion:  
  Miriam accurately defends AC's mathematical utility and clarifies Banach-Tarski (Move 3 is strongest). Owen rightly questions non-constructiveness but overreaches by claiming AC is uniquely problematic (Move 4 is weakest). The real issue is reconciling *which mathematical objects we deem legitimate* – a question not settled by set theory alone, but by philosophical preference for generality versus concreteness.
