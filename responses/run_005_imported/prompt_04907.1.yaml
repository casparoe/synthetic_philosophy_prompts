  First, I need to unpack each move neutrally. Miriam's first point about AC being "load-bearing" for standard mathematical results is technically correct - many fundamental theorems depend on it. But I should note that "ordinary mathematics" sometimes works with weaker fragments of AC, so her claim isn't universally absolute. 

  Owen's Banach-Tarski counterexample is valid but overplayed. The paradox relies on non-constructive decomposition, which Miriam correctly identifies as involving non-measurable sets. However, Owen's deeper concern about non-exhibitable objects touches on constructivism - a legitimate philosophical stance.

  Miriam's defense that non-measurability isn't ad hoc makes mathematical sense. The existence of non-measurable sets is provable from AC plus other axioms, not just declared to avoid paradoxes. But Owen has a point about the peculiarity of AC being non-constructive compared to other axioms.

  Owen's "redescribing casualties" argument is rhetorically strong but historically shaky. Other axioms like Infinity also imply non-constructible objects. The unfalsifiability charge ignores that AC's consequences are mathematically verifiable, even if the sets themselves aren't exhibitable.

  For the scoring: 
  - Move 1 gets +1: Correct but oversimplifies "indispensability"
  - Move 2 gets 0: Valid example but overstates "suspicion"
  - Move 3 gets +2: Precise technical rebuttal
  - Move 4 gets -1: Insightful critique but factually wrong about other axioms

  The deeper considerations involve: 
  - The spectrum between AC acceptance and constructivism
  - Whether mathematics needs ontological commitment to non-constructibles
  - Alternative frameworks like ZF+AD where all sets are measurable

  The user's marine biology background suggests they'll appreciate concrete analogies - perhaps comparing AC to theoretical entities in science that enable predictions despite being unobservable.
answer: |-
  Here's the adjudication, with scores and justifications:

