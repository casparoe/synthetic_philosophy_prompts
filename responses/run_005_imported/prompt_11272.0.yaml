  The user is also asking for a way to separate harm from offense. Philosophers like Mill and Feinberg have frameworks here. Harm involves set-back to interests, while offense is about discomfort. The challenge is when communities claim indirect harm, like erosion of values. But that's slippery. If there's no tangible harm, it's likely just offense.

