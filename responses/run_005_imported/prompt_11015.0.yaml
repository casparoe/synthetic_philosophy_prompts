  Another angle is expressivism: slurs express attitudes like "damn" in "damn Nazis". This isn't part of truth conditions but still affects meaning. So uttering a slur expresses hatred, making cancellation incoherent because you can't express and deny the attitude simultaneously.

  Hybrid approaches combine elements. For instance, semantic load (group membership) plus pragmatic force (derogation). The failure to cancel comes from the strong expressive component. 

  The user's worry about reducing moral objection to etiquette is crucial. If derogation is semantic, truthful use seems factually correct but rude. But if it's conventional implicature or expressive, the assertion of group membership might be true, but the speaker still performs a derogatory act. The moral wrong is in enacting hatred, not stating falsehood. Prohibitionism frames it as violating norms against using harmful words, which is a social/moral issue beyond etiquette.

  I should also consider the social context. Slurs perpetuate oppression, so their harm isn't just in individual use but systemic effects. Even if "true" in some sense, using them reinforces discrimination. So the moral case is about participating in harmful practices, not just truth conditions.

