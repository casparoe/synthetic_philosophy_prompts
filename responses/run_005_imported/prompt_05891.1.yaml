prompt: |-
  So I've been stuck in a bit of an internet rabbit hole lately, reading through some AI-alignment / rationalist blog stuff (a lot of it traces back to LessWrong) about why people think a sufficiently smart agent will basically end up behaving like an expected-utility maximizer even if nobody designed it that way on purpose — the whole "coherence theorem" argument. The move that keeps showing up is the money-pump: if you prefer A to B, B to C, and then (weirdly) C to A, a bookie can trade you around that loop, taking a cut each time, and hand you back the exact same thing you started with, just poorer. Okay, fine, I get why that's supposed to show cyclic preferences are irrational.

  But then some of these writeups also want to say your preferences need to be complete — meaning for any two options you either prefer one, prefer the other, or are indifferent, no "these just aren't comparable" option allowed — and they claim incompleteness can be money-pumped too, same as cyclicity. When I actually tried to work out how that pump is supposed to go, it felt like it secretly needs an extra assumption that the cyclic version doesn't: basically that the agent is willing to pay a small fee to swap one incomparable thing for another whenever its offered the chance. But why would an agent with incomplete preferences be stuck with that disposition in the first place? Seems like it could just adopt a policy of only trading when its a strict improvement on what it already has, never trade for something merely incomparable, and then it can't be pumped, no completeness required.

  I brought this up with a friend who's read more decision theory than me, and he mentioned something about "resolute choice" — like, maybe an agent can dodge the pump just by committing in advance to a plan, and if that same trick also saves cyclic preferences from being pumped, then maybe money pumps don't actually prove what people think they prove in either case. He wasn't totally sure though. Could you walk me through what the real extra ingredient is in the incompleteness version of the argument (versus the plain cyclic one), and whether "just refuse trades that aren't strict improvements" (or resolute choice, or whatever) actually gets an agent off the hook? I want to understand whether incomplete preferences are genuinely exploitable the way cyclic ones supposedly are, or whether that extension of the argument is quietly begging the question somewhere.
reasoning: |-
  Okay, let me try to unpack this user's query. They're deep into AI alignment and rationalist blogs, specifically the coherence theorems that argue for expected utility maximization. The user understands the money-pump argument against cyclic preferences but is skeptical about its application to incomplete preferences. They think the argument might sneak in an extra assumption—that an agent would pay to swap incomparable options. Their friend mentioned "resolute choice," which adds another layer. The user wants to know if incomplete preferences are truly exploitable like cyclic ones or if the argument is question-begging.

  First, I need to recall the standard money-pump for cyclic preferences. If an agent prefers A>B, B>C, C>A, a bookie can trade A for C plus a fee, then C for B plus another fee, then B for A plus a fee. The agent ends up with A but poorer. That makes sense for cyclicity.

  Now, for incomplete preferences, say between A and B where neither is preferred. The argument claims the agent can be pumped by offering a trade from A to B minus a small fee. If the agent accepts, they're exploited. But why would they accept? The user points out that an agent could only trade for strict improvements, refusing such swaps. So the crux is whether accepting trades between incomparables is necessary or rational.

  The user’s friend brought up "resolute choice," which involves pre-committing to a plan to avoid myopic decisions. This might help both cyclic and incomplete cases, but the user is unsure if it invalidates the money-pump argument entirely. They’re questioning if the incompleteness money-pump assumes the agent will always pay to switch, which isn't justified.

  I should break down the assumptions. The cyclic pump relies on the agent's current preferences leading to myopic trades. But with incompleteness, the agent might have a threshold or refuse trades. The counterargument is that if the agent sometimes accepts trades between incomparables for a small fee, they might still be pumped. But if they never do, maybe they're safe. However, some theorists argue that refusing all such trades is also problematic. For example, if faced with a sequence of small changes that transform A into B, refusing any trade might lead to status quo bias. But that's a different issue.

  The user’s core concern is whether the extension to incomplete preferences is valid. They suspect it might beg the question by assuming the agent must accept trades between incomparables. I need to explain why some decision theorists think incompleteness is exploitable. It might hinge on the idea that without completeness, the agent lacks a definitive choice, making them vulnerable in dynamic decisions. But the user’s proposal of only accepting strict improvements seems solid. However, perhaps in cases where options are very close, refusing any trade could lead to suboptimal outcomes, but that's speculative.

  Also, resolute choice could help both cases. If an agent pre-commits to avoid certain paths, they dodge the pump. But if resolute choice is allowed, then even cyclic preferences could be immune, which undermines the money-pump argument. That suggests money-pumps assume myopic choice, not resolute. So the real issue is the agent's choice behavior over time—myopic vs. resolute.

  The user wants to know if the incompleteness money-pump requires an extra assumption. Yes, it assumes the agent is willing to pay a fee to switch between incomparable options. Without that, the pump doesn't work. But is that assumption reasonable? It depends on the agent's decision rule. If they use a conservative rule, refusing such trades, they avoid the pump. However, some argue that this conservatism might lead to other irrationalities, like rejecting beneficial sequences. Still, that's not the same as a money-pump.

  In conclusion, the money-pump for incomplete preferences does rely on an additional assumption about the agent's trading behavior between incomparables, which isn't necessary for cyclic preferences. Resolute choice can block both pumps, suggesting that money-pumps target myopic agents. So the user’s skepticism is valid—the extension to incompleteness isn't as strong as for cyclicity without extra assumptions.
answer: |-
  You've hit on a profound and actively debated point in decision theory. The extension of money-pump arguments to *incomplete preferences* is indeed more contentious than the classic cyclic preference case, and your skepticism about an "extra assumption" is well-founded. Let's break it down step-by-step.

  ### 1. **The Classic Money Pump (Cyclic Preferences)**
     - **Setup**: Agent prefers A > B, B > C, but C > A (intransitivity).
     - **Exploit**: 
       1. Bookie offers to trade C for A + small fee ε. Agent prefers C > A, so accepts. Agent now has C, paid ε.
       2. Bookie offers to trade B for C + ε. Agent prefers B > C, accepts. Agent now has B, paid 2ε.
       3. Bookie offers to trade A for B + ε. Agent prefers A > B, accepts. Agent now has A, paid 3ε.
     - **Result**: Agent ends with original state (A) but poorer by 3ε. **No extra assumptions needed**—exploit relies *only* on the agent myopically acting on its *current* strict preferences at each step.

  ### 2. **The Incompleteness Money Pump: The Standard Argument**
     - **Setup**: Agent finds A and B *incomparable* (not A≻B, not B≻A, not indifferent).  
     - **Proposed Exploit**:
       1. Bookie offers to trade B for A + small fee ε.  
       2. Agent *might* accept (reason: "B isn't worse than A, and ε is tiny!").  
       3. Bookie then offers to trade A for B + ε.  
       4. Agent *might* accept again ("A isn't worse than B, and ε is tiny!").  
     - **Result**: Agent ends with original state (A) but poorer by 2ε.  

  **The Crucial Extra Assumption**:  
  The argument **requires** that the agent is willing to pay ε to switch between incomparables. This is often called **"small-improvement sensitivity"** or **"non-robustness to sweetening"**.  

  ### 3. **Your Defense: Why Incompleteness Might Be Safe**
  Your intuition is spot-on. An agent with incomplete preferences can adopt a **conservative trading policy**:  
  > *"Only accept trades that are **strict improvements** (X ≻ Y). Never trade between incomparables or for indifference."*  

  Under this policy:  
  - The bookie offers B for A + ε. Since A and B are incomparable, B is *not* a strict improvement over A. Agent **refuses**. Pump fails.  
  **No exploit occurs**.  

  ### 4. **Do Decision Theorists Accept This Defense?**
  This is where it gets messy. Responses fall into two camps:  

  #### **Camp 1: Incompleteness is Exploitable *Under Dynamic Choice***  
  Proponents argue that refusing *all* trades between incomparables leads to **status quo bias** or **dynamic inconsistency**:  
  - Suppose you face a sequence: Start with A. Bookie offers B for free (no fee!). Since B is incomparable to A, you refuse (no strict improvement).  
  - But if you *started* with B, you'd refuse to switch to A for the same reason.  
  - Result: You never move from your initial state, even if *some* paths through incomparables might lead to clearly better outcomes.  
  - **Critique**: This conservatism is its own irrationality—you miss "costless" opportunities to explore incomparable options.  

  #### **Camp 2: Incompleteness is Defensible (Your View)**  
  Skeptics (like economist **Isaac Levi**) argue:  
  - Incomparability reflects genuine **value ambiguity** (e.g., choosing between career paths with incommensurable goods).  
  - Refusing trades between incomparables isn't irrational—it’s **prudent**. Paying ε to swap incomparables is *arbitrary*, not rational.  
  - **Key point**: The money-pump *assumes* agents treat incomparables as "tradeable for a fee," but this begs the question against genuine incompleteness.  

  ### 5. **Resolute Choice: The Wildcard**
  Your friend is right. **Resolute choice** (pioneered by Edward McClennen) proposes:  
  > *"Commit in advance to a **plan** that avoids myopic traps, even if you'd deviate later."*  

  - **For cyclic preferences**: Resolve to never trade away A for C. Block the pump.  
  - **For incompleteness**: Resolve to never trade between incomparables. Block the pump.  
  - **Problem**: If resolute choice is allowed, **both cyclic and incomplete preferences can evade money pumps**. This undermines the argument that *only* EU-maximizers are "pump-proof."  

  ### 6. **The Real Stakes: What Money Pumps *Actually* Prove**
  - **Cyclic preferences**: Money pumps work **robustly** against *myopic* agents. Resolute choice "saves" them but requires controversial pre-commitment.  
  - **Incomplete preferences**: Money pumps **require extra assumptions** (sensitivity to small fees). A conservative agent blocks them *without* resolute choice.  
  - **Core insight**: Money pumps don't prove preferences *must* be complete/transitive. They prove that **myopic agents with cyclic/incomplete preferences are exploitable *in dynamic settings***.  

  ### Key Takeaways:
  1. **Cyclic vs. Incomplete**:  
     - Cyclic preferences are exploitable *by their own myopic logic*.  
     - Incomplete preferences are only exploitable if the agent accepts "small-fee swaps" between incomparables—a **substantive added assumption**.  

  2. **Your Defense Holds Water**:  
     An agent that only trades for strict improvements **cannot be money-pumped for incompleteness alone**. Critics must argue this policy is *dynamically irrational* in broader contexts (e.g., missing costless opportunities).  

  3. **Resolute Choice Undermines Both Pumps**:  
     If we allow resolute commitment, *neither* cyclic nor incomplete preferences are necessarily exploitable. This reveals money pumps as arguments against **myopia**, not against non-EU-maximization per se.  

  **Conclusion**: The extension of money pumps to incomplete preferences *is* question-begging if it assumes agents will pay to swap incomparables. Your proposed policy ("only trade for strict improvements") legitimately blocks the exploit. However, the debate hinges on deeper issues: whether rational choice *requires* sensitivity to tiny fees, and whether resolute choice is admissible. In AI alignment, this suggests that *non*-EU-maximizing agents (e.g., satisficers with incompleteness) *can* be designed to avoid exploitation—but they must be dynamically sophisticated.  

  > *"Incompleteness needs no defense. It needs only a little resolve."*  
  > — Apocryphal decision theorist, avoiding bookies since 2023.
