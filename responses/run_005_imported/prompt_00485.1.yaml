answer: |-
  You're absolutely right to feel that the epistemic reduction of resultant luck (à la Zimmerman/Thomson) doesn't fully capture our moral intuitions. While their move is analytically tidy, it flattens the lived reality of moral judgment and ignores crucial aspects of our responsibility practices. Here’s a robust case for the irreducible reality of resultant luck, holding mental states and negligence *fixed*:

  1.  **The Phenomenology of Agent-Regret (Williams) as a Moral Truth-Revealer:**
      *   Williams's "agent-regret" isn't just a psychological quirk; it's a *morally appropriate* response that points to an objective feature of the situation. The drunk driver who kills a child doesn't just *feel* worse than the one who gets home safely; they *are* morally entangled in a fundamentally different way.
      *   This regret isn't *only* about their prior intention/recklessness (which both drivers share). It's specifically about *being the agent of this terrible outcome*. The driver *identifies* with the causal chain they initiated in a way that transcends their initial mental state. The outcome *becomes part of their moral history* in a way the lucky driver's non-outcome does not. Reducing this profound moral burden to "Oh, we just know *more* about how reckless they were" cheapens the specific horror of having *actually caused* the harm.

  2.  **The Emergence of New Moral Claims (The Victim's Standpoint):**
      *   The epistemic view focuses entirely on the *agent's* state and what we *know* about it. It ignores the *victim* and the new moral landscape *created* by the harm.
      *   When the reckless act *results* in harm, a **new moral claim** is generated *against the agent* by the victim (or the victim's loved ones/society). This claim is for acknowledgment, restitution, repair, or atonement. The lucky driver, despite identical recklessness, *owes nothing* to a specific victim because they *created no specific victim*.
      *   This debt isn't merely epistemic evidence about past negligence; it's a present, objective obligation *constituted* by the outcome itself. The unlucky driver now stands in a unique moral relationship *to the harmed individual* that the lucky driver does not. Blameworthiness here isn't just about the internal state; it's about the *external relational fact* of having wronged *this person*.

  3.  **Moral Gravity and the Transformation of the Act:**
      *   Outcomes have **moral gravity**. They pull the moral significance of an action away from being solely defined by the agent's will and anchor it firmly in the world of consequences.
      *   Consider two surgeons performing equally complex, risky procedures with identical preparation and care. Due to an unforeseeable, freak occurrence (pure resultant luck), Surgeon A's patient dies, Surgeon B's survives. While both acted with equal skill and care, Surgeon A's *act* is now the act *of failing to save the patient* or even *causing death* (despite best efforts). Surgeon B's act is *saving the patient*.
      *   This isn't just about evidence of their care (which we assume is equal). The **moral character of the act itself is transformed by the outcome**. Surgeon A, through no fault of their own beyond taking the risk inherent in surgery, now bears the moral weight of a death. This weight is a real feature of the situation, not an illusion caused by better evidence. Their *action description* is fundamentally altered by the result.

  4.  **The Limits of Epistemic Reduction: Why "Total Evidence" Fails:**
      *   Zimmerman argues that with *perfect* knowledge of the agent's mental state *at the time of action*, resultant luck disappears. But this assumes blameworthiness is *solely* a function of that prior mental state, frozen in time.
      *   However, blameworthiness is also **reactive** and **relational**. Our reactive attitudes (resentment, indignation, blame) are *triggered by and proportionate to* the actual harm caused. The parent of the dead child *rightfully* feels a more intense, specific resentment towards the driver who killed their child than they would towards an *equally reckless* driver who didn't. This intensity isn't irrational or based on faulty inference; it's a direct response to the *actual object* of the harm – their dead child.
      *   Even with perfect knowledge of the reckless intent beforehand, the *actual occurrence* of the harm changes the nature of what we are reacting *to*. We are reacting not just to the reckless will, but to the *reckless will that manifested in this catastrophe*.

  5.  **Consequential Responsibility as a Distinct Moral Category:**
      *   We can distinguish **culpability** (fault based on intention/negligence) from **consequential responsibility** (being the cause of an outcome, and thus bearing certain burdens related to it).
      *   Both drunk drivers share equal *culpability* for reckless endangerment. But *only* the driver who hits the child bears **consequential responsibility** for the death. This responsibility generates distinct moral burdens: the need to answer *for this specific harm*, to make amends *to these specific people*, to bear the social and legal consequences *of this outcome*.
      *   This consequential responsibility is *irreducibly* tied to the outcome. It cannot be reduced to the epistemic access to culpability, because it exists *over and above* that culpability. It's the moral weight of having *actually changed the world for the worse* in this specific way.

  **Conclusion:**

  Resultant luck is irreducible because **outcomes create new, objective moral facts that did not exist prior to their occurrence.** They generate specific moral claims from victims, transform the moral description of the agent's act, impose unique burdens of consequential responsibility, and elicit fundamentally different (and appropriate) reactive attitudes and agent-regret. While the epistemic view correctly highlights that outcomes reveal evidence of prior fault, it mistakenly assumes that prior fault is the *only* source of moral significance. The unlucky agent isn't just *revealed* to be blameworthy; they are *made* more blameworthy *by* the outcome itself, as it entangles them in a web of harm, debt, and altered moral identity that the lucky agent, despite identical starting points, escapes. The moral universe is not static; it is dynamically shaped by the consequences of our actions, and resultant luck is the stark recognition of this fact. To dissolve it into epistemology is to deny the profound moral significance of what *actually happens* in the world as a result of our choices.
