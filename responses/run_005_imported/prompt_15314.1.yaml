  Second, focus on behavioral complexity (avoidance learning, not just reflexes) as the threshold since that's measurable. 
  Third, require analgesia not as admission of pain but because the evidence meets precautionary standards. 
  Fourth, sunset the decision to force evidence review - that reassures researchers it's not permanent.

  For structure: lead with the crab/cuttlefish evidence since that's the test case, then generalize to cephalopods/decapods. The 3-year review builds in time for emerging studies while allowing current research. The analgesia condition is the core protection but framed cautiously - "consistent with" vertebrate protocols rather than identical. 

  Biggest risk is oversimplifying Descartes' position. Must emphasize that flexible learning (not just nociception) challenges the pure automaton view. The memo should quote his "no language" argument directly when explaining why skeptics might still doubt subjective experience. 

  ...Wait, should I mention that Descartes vivisected dogs without qualms? No - too inflammatory for a policy doc. Stick to the logical argument. 

  Final touch: add the practical note about anesthetic protocols. Researchers will complain about implementation, so showing it's feasible matters. The 6-month grace period avoids halting ongoing studies.
