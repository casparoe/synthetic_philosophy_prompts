  Looking at Ockham's own framework, two key elements stand out: his absolute vs. per accidens necessity distinction, and his agnosticism about divine foreknowledge mechanics. The TRL model seems to make the actual future a present fact - but for Ockham, the future's fixity should only emerge per accidens as events unfold, not as a pre-existing metaphysical fact. 

