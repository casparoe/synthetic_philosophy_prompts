  okay so I just got off a two hour phone call with my friend priya arguing about the problem of evil and neither of us really "won" but its been stuck in my head since. she kept saying Job is basically the original theodicy, like the text that already worked all this out, but when I actually went back and reread the whirlwind speeches i'm not convinced God even answers Job's actual complaint. this is the bit that's bugging me (KJV, Job 40):

  "Then answered the LORD unto Job out of the whirlwind, and said, Gird up thy loins now like a man: I will demand of thee, and declare thou unto me. Wilt thou also disannul my judgment? wilt thou condemn me, that thou mayest be righteous? Hast thou an arm like God? or canst thou thunder with a voice like him?"

  priya's read is that this is basically ancient skeptical theism, i.e. God telling Job he's just not in an epistemic position to judge, the same move philosophers like Wykstra make today. I said it just sounds like God pulling rank, like "i'm bigger than you so i'm right." can you help me actually work through what argument, if any, is being made in this passage? does it function as a real theodicy, does it map onto one of the standard moves (free will defense, soul-making, skeptical theism), or is it doing something else entirely that doesn't really fit the modern taxonomy of theodicies at all?
