  Okay, the user is really wrestling with the problem of evil after a marathon debate with their friend Priya. They've both been digging into the Book of Job, specifically God's whirlwind speeches, and can't agree on whether it offers a real theodicy. The user feels God's response in Job 40 is just "might makes right," while Priya sees it as ancient skeptical theism. 

