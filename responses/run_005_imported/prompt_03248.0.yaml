answer: |-
  Your instincts are sharp—Douglass is performing a sophisticated, context-driven interpretive dance. The passages aren't inherently contradictory, but they reveal a strategic tension between textual fidelity and moral substance. Here's how to frame it for your seminar:

  ### 1. **The Compatibility Question: Textualism as a Platform for Moral Construction**
     - **First Principle (Textual Formalism):** Douglass insists the *ratified text* is the sole legitimate source of meaning. Secret intentions or debates are irrelevant because the people ratified only the *words*, not hidden agendas. This rejects Garrison’s claim that the framers' pro-slavery *intent* taints the Constitution irredeemably.  
       - *Why this move?* It creates a clean slate: the text can be judged on its own terms, detached from historical compromise.  

     - **Second Principle (Liberty-Presuming Construction):** When text is ambiguous, interpreters *must* choose readings that align with "justice and liberty," requiring "irresistible clearness" for rights violations.  
       - *Why this move?* It weaponizes textual ambiguity against slavery. Clauses like the 3/5 Compromise or Fugitive Slave Clause are *textually explicit* about slavery; Douglass argues they’re exceptions proving the Constitution’s *overall* anti-slavery character. But for ambiguous clauses (e.g., "privileges and immunities"), the tiebreaker favors freedom.  

     - **Synthesis:** Douglass uses textualism to *contain* pro-slavery intent (first passage), then deploys substantive canons *within* the textual framework to *advance* liberty (second passage). The text is fixed, but its ambiguities are resolved through a moral lens. As legal scholar Robert Cover noted, Douglass treats the Constitution as a "bridge" toward freedom—textual fidelity enables moral evolution.  

  ### 2. **Is the First Move Just a Façade?**
     Not quite. Both moves are essential to Douglass’s anti-slavery project:  
     - **Textualism as Shield:** Without the first principle, Garrison wins—the Constitution is forever stained by framers' intent.  
     - **Moral Canons as Sword:** Without the second, textual silence/ambiguity defaults to slavery’s benefit (as in *Dred Scott*).  
     Douglass’s genius is recognizing that the Constitution’s text *enables* this dual approach: its framers used deliberate ambiguity to obscure slavery, creating space for reinterpretation.  

  ### 3. **Parallels in Later Interpretive Theory**
     Douglass anticipates key modern debates:  
     - **"Semantic Originalism" (Jack Balkin):** Like Balkin, Douglass focuses on the text’s original public meaning but insists its principles must be applied in light of evolving moral values. The "irresistible clearness" rule mirrors Balkin’s view that ambiguous text permits "construction" in line with justice.  
     - **Dworkinian Integrity:** Douglass treats the Constitution as embodying abstract moral commitments ("justice," "liberty"). His method resembles Dworkin’s "moral reading," where interpreters seek the *best justification* of the text’s principles—here, freedom over oppression.  
     - **"Thin" vs. "Thick" Originalism:** Douglass rejects "thick" originalism (framers’ expectations) but embraces "thin" originalism (public semantic meaning). The moral tiebreaker then operates *within* that semantic field.  
     - **Anti-Cruelty Canons (William Eskridge):** Modern canons disfavoring violations of fundamental rights echo Douglass’s "irresistible clearness" principle.  

  ### 4. **Why This Matters for Your Seminar**
     - **Beyond Neutrality:** Douglass exposes the myth of "neutral" interpretation. His formalism *serves* emancipation—a reminder that interpretive methods are always deployed toward ends.  
     - **Slavery as Constitutional Stress Test:** Slavery forced radical clarity on theories of meaning. Douglass’s pragmatism (using textualism strategically) contrasts with Scalia’s rigid original-meaning approach and Dworkin’s principled idealism.  
     - **The Douglass Exception?** Note his caveat: where slavery *is* explicit (e.g., Fugitive Slave Clause), he condemns it as a "covenant with death" (1855). But he insists such clauses are deviations from the document’s *overall* spirit—a dialectic of text and principle.  

  ### Teaching Recommendation
  Frame the discussion with two questions:  
  1. **"Is Douglass a textualist?"** Have students dissect how his "public text" claim interacts with moral canons.  
  2. **"What work does 'history' do here?"** Contrast Douglass’s use of history (to expose framers’ evasion) with originalists who use it to fix meaning.  

  Douglass’s approach is *sui generis* in its abolitionist context, but it prefigures 20th-century efforts to reconcile text, principle, and justice. It’s a masterclass in how marginalized communities reinterpret foundational texts to demand inclusion—a vital lens for modern originalism debates.  

  *Suggested Reading:*  
  - Jack Balkin, *Living Originalism* (2011)  
  - Robert Cover, *Justice Accused: Antislavery and the Judicial Process* (1975)  
  - William Eskridge, *Interpreting Law: A Primer on How to Read Statutes* (2016)
