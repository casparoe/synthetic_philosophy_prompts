prompt: |-
  I sit on the governance committee of our condo association, and we're rewriting the bylaw on who is entitled to vote at meetings. Currently it's one vote per unit owner. Some long-term tenants -- one has rented here fourteen years, longer than half our owners have even lived here -- want a vote too, since they live under our rules every day, more than some owners do. Meanwhile, several owners live elsewhere and rent out their units, so under the current rule they help decide matters that barely touch them. The building next door shares our driveway under an old easement, and a resurfacing vote next month will cut off their access for weeks, yet they have no say in our association at all. Someone suggested we simply vote on who should get to vote, but that only relocates the problem, since it doesn't tell us who that first vote belongs to. Every rule I've tried -- owners only, residents only, whoever is affected -- handles some case badly. Please draft the memo I'll bring to the committee before that vote: a recommended rule for who gets a vote, applied to the tenants, the absentee owners, and the neighbors, with honest treatment of the strongest reason to reject it.
reasoning: |-
  Okay, the user is on a condo governance committee and they're struggling with rewriting the voting bylaws. They've laid out several key issues: long-term tenants who feel invested in the community but can't vote, absentee owners who vote but aren't affected by daily rules, and neighboring properties affected by shared infrastructure decisions. 

  The core tension here is between legal ownership rights and lived community impact. Tenants with 14 years of residency have more daily stake than owners who've never lived there, yet legally the association exists to serve owners. The driveway easement adds another layer - external parties bearing consequences without representation. 

  What the user really needs is a principled framework that acknowledges competing values. They're not just asking for rule options but for intellectual honesty - explicitly naming what each approach sacrifices. The memo should help the committee confront these tradeoffs rather than hide them. 

  I notice the user is frustrated with circular solutions ("vote on who votes"). They want structural integrity. The strongest counterarguments should be presented fairly - like how resident-only voting could violate property rights or create instability if renters outnumber owners. 

  For the neighbors, there's a thorny jurisdictional problem. Their interests matter but formal inclusion could blur association boundaries. Maybe a non-voting consultation mechanism would satisfy that concern without rewriting membership. 

  The user seems thoughtful and equity-minded. They're bothered by the mismatch between formal power and lived experience. The memo should validate that concern while staying legally sound. Highlighting "proxies for residents" as a middle path might appeal to that sensibility - it preserves owner sovereignty while giving voice to affected tenants.
answer: |-
  ## MEMORANDUM  
  TO: Governance Committee  
  FROM: [Your Name]  
  DATE: October 26, 2023  
  SUBJECT: Proposed Revised Voting Eligibility Bylaw – Balancing Representation, Responsibility, and Impact  

  ### Purpose
  This memo proposes a revised voting eligibility rule for our association meetings, addressing the limitations of our current "one vote per unit owner" structure. It confronts the legitimate concerns of long-term tenants, absentee owners, and affected neighbors, while acknowledging the inherent trade-offs in any approach.  

  ---

  ### Proposed Rule  
  **Voting Eligibility:**  
  *   **Primary Vote:** One vote per *deeded unit owner* recorded in the association registry.  
  *   **Resident Proxy Option:** Any *full-time resident* of a unit (owner or tenant with a lease of 12+ consecutive months) may be designated *in writing by the unit owner* as their **sole voting proxy** for association matters. This designation must be filed with management 30 days prior to any meeting and remains valid until revoked by the owner.  
  *   **Neighbor Consultation (Non-Voting):** For decisions *directly and materially impacting* properties sharing critical infrastructure (e.g., driveway easement), the Board shall provide formal written notice to affected external owners at least 60 days prior to the vote. Their *written feedback* must be received 14 days before the vote and shared with all voting members for consideration.  

  ---

  ### Application to Key Stakeholders  

  1.  **Long-Term Tenants (e.g., 14-year resident):**  
      *   **Under Proposed Rule:** The tenant *cannot* vote independently. However, the *unit owner* can formally delegate their vote to this tenant via the "Resident Proxy" mechanism. The tenant gains a direct voice *if* the owner empowers them.  
      *   **Rationale:** Recognizes the tenant's deep community investment by enabling their participation, while preserving the owner's ultimate legal and financial responsibility for the unit and association obligations.  
      *   **Strongest Reason for Rejection:** **It relies on owner goodwill.** An owner *could* refuse to delegate their vote, leaving a long-term tenant voiceless despite their significant stake in daily living conditions. This may feel inadequate to tenants seeking inherent rights.  

  2.  **Absentee Owners (Renting out their unit):**  
      *   **Under Proposed Rule:** The owner *retains* the legal right to vote. However, they are *strongly encouraged* to delegate this vote to their resident tenant via the proxy mechanism. If they choose not to delegate, they retain full voting rights.  
      *   **Rationale:** Upholds the owner's legal responsibility for fees, assessments, and compliance with governing documents. The proxy option incentivizes delegation to those most affected by day-to-day rules.  
      *   **Strongest Reason for Rejection:** **It doesn't *force* engagement from disinterested owners.** An absentee owner could still vote on operational matters without delegating, potentially based on minimal direct impact or information, while the resident remains voiceless if the owner doesn't act.  

  3.  **Affected Neighbors (e.g., Driveway Easement):**  
      *   **Under Proposed Rule:** Neighbors have **no voting rights** within our association. They receive formal notice and a structured opportunity to provide written feedback on specific, materially impactful decisions (like driveway resurfacing). Their concerns must be circulated to voting members.  
      *   **Rationale:** The association governs *our* units and common elements for *our* members. Extending formal voting rights to non-members creates legal complexity, potential conflicts of interest, and dilutes the voice of members who bear the financial costs. Formal consultation respects their legitimate interest without compromising association sovereignty.  
      *   **Strongest Reason for Rejection:** **"Consultation" lacks power.** While their voice is heard, neighbors have no guaranteed influence on the outcome. They bear significant inconvenience (weeks of access loss) without a formal say, which may feel unjust despite not being members.  

  ---

  ### Why This Approach? (Balancing Principles)  

  1.  **Legal Foundation:** Maintains the core principle that the association exists for the *owners* of the units, who hold ultimate legal and financial responsibility.  
  2.  **Resident Representation:** Provides a clear, formalized path for engaged owners to empower their residents (tenants) to be their voice on day-to-day matters.  
  3.  **Accountability:** Ensures voting rights remain linked to the entity (the owner) legally bound by decisions (fines, assessments, liens).  
  4.  **Impact Recognition:** Addresses the "affected neighbor" dilemma through mandated, transparent consultation, ensuring their concerns are formally documented and considered by voters.  
  5.  **Practicality:** Avoids the quagmire of defining "affectedness" for voting rights, which could be endlessly debated and is legally precarious.  

  ---

  ### Acknowledging the Imperfect Trade-Off  

  No rule perfectly resolves the tension between legal ownership, community residency, and external impact. This proposal prioritizes:  

  *   **Owner Sovereignty with Resident Voice:** Owners retain their legal rights but have a robust tool to delegate based on residency.  
  *   **Association Integrity:** Prevents dilution of membership rights by non-owners/non-members.  
  *   **Procedural Fairness for Neighbors:** Mandates a formal process to hear and share their concerns.  

  **The Core Trade-Off:** We unavoidably prioritize the **legal and financial responsibility** of ownership over the **lived experience** of residency or the **consequential impact** on external parties when defining the *formal* voting franchise. The Proxy and Consultation mechanisms are deliberate attempts to mitigate, but not eliminate, this inherent imbalance.  

  ---

  ### Recommendation  

  I recommend the Governance Committee adopt this "Owner Vote with Resident Proxy & Neighbor Consultation" model. It provides a legally sound, structured, and significantly fairer approach than our current system. It directly addresses the raised concerns through clear mechanisms while being upfront about the necessary compromises inherent in condominium governance.  

  **Motion:** I move to recommend the revised voting bylaw incorporating the "Owner Vote with Resident Proxy Option and Affected Neighbor Consultation Process" as outlined, for consideration by the full Board and membership.  

  **Attached:** Draft Bylaw Language incorporating the proposed rule.
