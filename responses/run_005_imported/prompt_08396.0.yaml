  First, I need to recall the context of "On Certainty." Wittgenstein is responding to G.E. Moore's claims about certainty, arguing that certain propositions aren't known but function as hinges for our epistemic practices. Hinges aren't justified through evidence; they're the framework enabling justification. The user's professor emphasized that hinges aren't chosen or questioned, which is key.

  The terms "mythology" and "rules of a game" need careful unpacking. "Mythology" here doesn't mean false stories but foundational narratives that structure understanding without being factual assertions. Similarly, game rules are constitutive, not arbitrary in practice—they define the game but are necessary for playing. The user might be conflating "contingent" with "arbitrary." Contingency means they could have been different, but within a form of life, they're fixed and necessary.

  Relativism is a big concern. Wittgenstein isn't saying all systems are equally valid. Hinges are deeply embedded in human practices and biology. They're not arbitrary because they're tied to successful interaction with the world. However, different cultures might have different hinges, which introduces a form of relativism at the margins, but core hinges (like the existence of physical objects) are universal across human forms of life.

  The user might also be worried about the stability of knowledge if hinges are called "mythology." But for Wittgenstein, the role these propositions play—enabling doubt and inquiry—gives them their certainty, not their content. Their function is what matters, not their metaphysical status.

  I should emphasize the distinction between genetic contingency (how we acquire hinges) and functional necessity (their role once acquired). The user needs to see that while the specific rules might vary, their function as hinges is universal. Also, clarifying that "mythology" refers to the non-rationalized acceptance, not falsehood, is crucial.

  The user's deeper need might be understanding if knowledge is secure or if everything is relative. Reassuring them that hinges, though contingent, provide a stable framework because they're rooted in successful human practices. Highlighting the practical necessity—how hinges enable action and inquiry—can alleviate fears of relativism undermining knowledge.
answer: |-
  This is a fantastic question that cuts to the heart of Wittgenstein's project in *On Certainty* – and you're absolutely right to feel the tension! Your professor is correct about hinges being unchosen and foundational, yet Wittgenstein *does* use language like "mythology" and "rules of a game." The key is understanding what he means by these terms and how they function *without* collapsing into arbitrariness or full-blown relativism. Here's a breakdown:

  1.  **"Inherited Background" & "Not Chosen":**
      *   You inherit your world-picture (hinges) like you inherit a language or a culture. You don't sit down and rationally justify why the world exists, why objects persist, or why your senses are generally reliable. These are absorbed through living, interacting, learning language, and participating in shared human practices ("forms of life").
      *   They are **non-propositional bedrock**: Before you can even ask "Is this true?" or "How do I know that?", you must already be operating within a framework that allows for the concepts of "true," "false," "evidence," "doubt," "knowledge," etc. Hinges *are* that framework. Trying to doubt them *within* the system they enable is nonsensical (like trying to doubt the rules of chess while playing chess).

  2.  **"Mythology": What it DOESN'T Mean:**
      *   **Not False:** Calling it "mythology" does *not* mean it's false, made up, or irrational in a pejorative sense.
      *   **Not Arbitrarily Invented:** It doesn't mean someone just dreamt it up on a whim.
      *   **Not Optional:** It doesn't mean we could easily swap it out for a completely different one without ceasing to be recognizable human thinkers/agents.

  3.  **"Mythology": What it DOES Mean:**
      *   **Non-Rationalized Foundation:** Myths are foundational stories that shape a culture's understanding *without* being subject to empirical verification *within* that culture. Similarly, hinges shape our epistemic practices without being the *result* of those practices. We don't *arrive* at "There are physical objects" via scientific inquiry; science *presupposes* it.
      *   **Narrative Structure:** Like myths, hinges form a coherent background narrative that makes sense of our experiences and actions. "The world exists," "Objects persist," "My name is X," are part of the story we live *within*.
      *   **Acquired, Not Proven:** We learn this "mythology" the way we learn cultural myths – through immersion, training, practice, not through deductive proof or empirical confirmation. It's *given*.

  4.  **"Rules of a Game": What it DOESN'T Mean:**
      *   **Not Arbitrary Choice:** It doesn't mean we consciously picked these rules from a menu of possibilities.
      *   **Not Easily Changed:** It doesn't mean the rules are flimsy conventions we can alter at will without consequence.

  5.  **"Rules of a Game": What it DOES Mean:**
      *   **Constitutive:** Rules *constitute* the game. You can't play chess without the rules defining what a king, pawn, check, and checkmate *are*. Similarly, hinges *constitute* what counts as a meaningful question, a justified belief, a doubt, or evidence *within* our epistemic "game." Without "The world exists," the question "Does this specific object exist?" loses its anchor.
      *   **Learned Practically:** We learn chess by playing, seeing examples, being corrected. We don't primarily learn by memorizing a rulebook first. Similarly, we learn our world-picture by *acting* in the world – reaching for objects, expecting them to be there, trusting others, learning language *through* interaction with the world. The "rules" (hinges) are embedded *in* the practice.
      *   **Enabling Constraints:** Rules constrain (you can't move the rook diagonally) but *only by enabling* the activity (playing chess). Hinges constrain what counts as doubt/knowledge *only by enabling* the very activities of doubting and knowing.
      *   **Contingent but Necessary-Within-the-Game:** The *specific* rules of chess are contingent (they could be different, hence other games exist). But *once you are playing chess*, those rules are necessary for *that specific game*. Similarly, the *specific* content of some hinges might be contingent on our biological form and evolutionary history (e.g., reliance on senses). But *given* our form of life as human beings interacting with a physical world, hinges like "There are physical objects" or "The earth existed long before I was born" are necessary for *our* epistemic practices to function. They could be different for radically different beings (Wittgenstein hints at this), but *for us*, they are fixed.

  **Reconciling the Tension & Addressing Relativism:**

  *   **Contingency vs. Arbitrariness:** The key distinction is between **contingency** and **arbitrariness**.
      *   Hinges are **contingent**: They depend on our specific biological and cultural history. A different kind of being might have different fundamental certainties. *Within our history*, they weren't *chosen* rationally.
      *   They are **not arbitrary** *for us*: They are deeply embedded in our successful engagement with the world. They are the inherited, hard-won framework that *enables* our practices to work and connect with reality. Their "correctness" isn't proven propositionally; it's demonstrated *pragmatically* by the fact that our practices (building, predicting, communicating, surviving) *work* within this framework. They are "rules" that have proven necessary for navigating *this* world successfully.
  *   **Relativism? A Nuanced Answer:**
      *   **Not Radical Relativism:** Wittgenstein is **NOT** saying *any* world-picture is as good as any other, or that truth is relative to individuals. Core hinges related to basic physical reality and logic seem remarkably stable across human cultures ("The world exists," "Fire burns," "2+2=4"). Their necessity stems from our shared biological form and the shared physical world we inhabit. Doubting these doesn't lead to a different, equally valid perspective; it leads to paralysis or incoherence *within our form of life*.
      *   **Moderate Contextualism/Relativism at the Margins:** *Some* hinges, especially those more culturally embedded (e.g., specific religious or historical narratives that function foundationally *within* a community), might appear more "relative" from an external perspective. However, even these function *within* a broader framework of shared human hinges about the physical world. Wittgenstein acknowledges the *possibility* of different systems, but he emphasizes the depth and stability of *our* inherited framework and the impossibility of genuinely doubting its core from within it. His focus is on the *role* propositions play, not declaring all foundations equally shaky.

  **In Summary:**

  Wittgenstein uses "mythology" and "rules of a game" to emphasize that our most fundamental certainties:
  1.  **Are not rationally justified foundations** (like axioms in logic).
  2.  **Are acquired through practical immersion** in a form of life.
  3.  **Function constitutively** – they make epistemic practices possible by defining what counts as doubt, evidence, etc.
  4.  **Are contingent on our human form of life** (they could, abstractly, be different for radically different beings).
  5.  **Are not arbitrary *for us*** because they are the indispensable, inherited framework that enables our successful interaction with the world. Their "correctness" is shown in their practical necessity and efficacy.

  He avoids radical relativism by grounding the core hinges in the shared biological and practical realities of human existence, while acknowledging a degree of contextual contingency, especially for hinges further from the absolute physical/logical core. The tension you feel reflects the delicate balance Wittgenstein strikes between recognizing the *inherited, non-rational* nature of our foundations and their *pragmatic necessity and stability* for human thought and action.
