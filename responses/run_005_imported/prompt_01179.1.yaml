answer: |-
  You've hit on one of the most profound and debated questions in medicine and philosophy of science. Your gut feeling is absolutely onto something real—this isn't just about technical redefinitions. The core issue you're wrestling with is the distinction between **disease as a biological fact** and **disease as a social/labeling construct**, and whether medicine can ever be truly value-neutral. Here's a breakdown:

  ### 1. **The Myth of "Purely Neutral" Disease Definitions**
     - **No Such Thing as Value-Free:** There is **no purely neutral, values-free fact** about whether someone "has a disease." Medicine operates within a framework of human goals: avoiding suffering, preventing early death, maintaining function. What counts as "dysfunctional" or "harmful" depends on societal and individual values.
     - **The Hypertension Example:** Your dad’s systolic blood pressure didn’t change, but the *interpretation* did. The guideline change (like the 2017 ACC/AHA update lowering thresholds) was based on evidence showing that *treating* people at lower pressures reduces strokes/heart attacks. But this embeds a value judgment: **How much risk is "too much"?** Is a 1.5% absolute risk reduction worth labeling millions more people as "diseased" and medicating them? That’s not a purely scientific question—it’s a risk-benefit assessment laden with values.

  ### 2. **Why Guidelines Change: Science + Values**
     - **New Evidence:** Guidelines evolve as we learn more (e.g., "mild" hypertension causing long-term damage).
     - **Risk-Aversion:** Modern medicine prioritizes prevention. Lowering thresholds reflects a value: *proactively treating risk factors* is better than waiting for harm.
     - **Access & Economics:** Defining a condition as a "disease" often unlocks insurance coverage for treatment. This can be beneficial (expanding access) but also problematic (medicalizing normal variation).

  ### 3. **Your Other Examples Prove the Point**
     - **Obesity:** The AMA's "disease" label (2013) aimed to reduce stigma and improve treatment access. Critics argue it medicalizes a *risk factor* influenced by genetics, environment, and behavior, potentially oversimplifying complex health determinants.
     - **ADHD:** Diagnostic expansion reflects better recognition of neurodiversity *and* societal shifts in expectations (e.g., longer school days, reduced tolerance for "disruptive" behavior). What was once "energy" is now "symptom" in contexts demanding high focus.

  ### 4. **When "Disease" Isn't Just Biological**
     - **Harm vs. Difference:** A broken bone is objectively harmful. High blood pressure? It’s harmful *because* it increases statistical risk of future events. Deafness? Some view it as a cultural identity, not a "disease." Homosexuality was historically pathologized—a stark example of values defining "disease."
     - **Medicalization:** Sociologists like Peter Conrad describe **medicalization**—when life experiences (aging, grief, childbirth) or behavioral variations (shyness, restlessness) get framed as medical problems. This isn’t inherently bad (it can bring relief and support) but reveals how values shape labels.

  ### 5. **Why This Matters (You're Not Overthinking)**
     - **Stigma & Identity:** A "disease" label affects self-perception. Your dad may now feel "ill," altering his identity.
     - **Overtreatment & Costs:** Lowering thresholds can lead to medicating low-risk people, causing side effects without significant benefit.
     - **Resource Allocation:** Defining more people as "sick" strains healthcare systems.
     - **Autonomy:** It raises questions about who decides what "optimal health" is—doctors, patients, or committees?

  ### The Nuanced Truth
  Your brother is half-right: **guidelines are technical tools**, and updating them based on evidence is crucial. But you're fundamentally correct: **disease definitions are never value-neutral**. Medicine is a **humanitarian science**—it blends objective data (blood pressure numbers, virus detection) with **subjective judgments** about:
  - What constitutes "normal" function.
  - What level of risk is "unacceptable."
  - What trade-offs (side effects, costs) are justified for prevention.

  ### What This Means for Your Dad
  - **Focus on the Individual:** The diagnosis is a *risk flag*, not a verdict. His doctor should assess his *overall* risk (age, cholesterol, diabetes, lifestyle), not just the number.
  - **Empowerment > Label:** The label matters less than actions. If lifestyle changes (diet, exercise) reduce his risk, they’re beneficial whether he’s "hypertensive" or "pre-hypertensive."
  - **Question Wisely:** Ask his doctor: "Given his *specific* risk profile, how much benefit would medication provide?" This cuts through abstract labels.

  **In short:** Medicine isn't physics. It navigates biology through a lens of human values. Your discomfort reveals a deep truth—that "disease" sits at the intersection of body, evidence, and culture. That’s not overthinking; it’s critical thinking about how we define health in a complex world. Your dad’s numbers didn’t change, but the story we tell about them did—and stories have power. Stay curious, but also focus on supporting his health beyond the label.
