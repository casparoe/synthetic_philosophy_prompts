answer: |-
  You've hit on a genuinely fascinating tension in Sidgwick's address, and it's **not just Victorian throat-clearing**. This passage reveals a core motivation and deliberate rhetorical strategy, reflecting both Sidgwick's personal leanings and his pragmatic approach to establishing credibility for the nascent SPR. Here's a breakdown of how the two halves cohere:

  1.  **The Nature of the "Scandal":**
      *   Sidgwick is explicit: The scandal is **"that the dispute... should still be going on."** It's the *persistence of the unresolved controversy* itself, not necessarily the disbelief *or* the belief in isolation.
      *   **Why is this persistence scandalous?** Because:
          *   The phenomena, *if real*, would be of immense scientific importance ("quite impossible to exaggerate").
          *   There exists a significant body of testimony from "generally credible" and "competent witnesses" supporting their reality.
          *   Many people are "profoundly interested" in finding an answer.
      *   The scandal lies in the **collective failure of the "educated world"** to properly investigate and resolve this question, given its potential significance and the evidence presented. They are stuck in an "attitude of incredulity" – a *default position of dismissal without adequate engagement*.

  2.  **The Target of "Incredulity":**
      *   While the scandal is the *ongoing dispute*, Sidgwick *does* specifically call out the "attitude of incredulity" of the "educated world, as a body." This is deliberate and strategic:
          *   **Context:** In 1882, the dominant scientific and academic establishment largely dismissed psychical phenomena out of hand as superstition, fraud, or delusion. Serious investigation was rare and often ridiculed. Sidgwick perceived this as *a priori* dismissal, not skepticism based on rigorous examination.
          *   **Rhetorical Focus:** The SPR needed to legitimize its work *to the very establishment whose attitude it found scandalous*. Sidgwick is directly addressing the inertia and complacency of that educated elite. He's saying: *You* find this unimportant or beneath you, yet the evidence demands attention, and *your* persistent refusal to engage is the problem.
          *   **Balance Implied:** While he explicitly names the "incredulity," his description of the scandal *implies* the failure on the believer side too: the failure to provide *conclusive*, rigorously tested evidence that could overcome this incredulity. He mentions "so many competent witnesses" believing, but the key is that their testimony, however credible individually, hasn't *collectively* convinced the scientific world due to lack of systematic study. The scandal is the *stalemate* caused by both sides – establishment dismissal *and* insufficiently rigorous proof from proponents.

  3.  **The "Unpledged" Society as the Solution:**
      *   Sidgwick immediately pivots to the SPR as the remedy for this scandal. Its primary aim is to "remove this scandal in one way or another" – meaning, to *resolve the dispute* definitively, whether by proving or disproving the phenomena.
      *   **Crucially, the solution hinges on method:** "a sustained and systematic attempt." This is the antidote to both the establishment's dismissive incredulity *and* the potentially credulous or haphazard investigations of believers.
      *   **"Unpledged" is Key:** Sidgwick emphasizes that the *Society as a body* has no official position ("quite unpledged"). This is vital for establishing its scientific credibility and differentiating it from spiritualist societies or purely skeptical groups. It signals that the SPR's authority will come from its *process*, not its pre-conclusions.
      *   **Individuals & Method:** He acknowledges that individual members *do* have beliefs (some pro, some con), but stresses that *all* agree investigations must be conducted "with a single-minded desire to ascertain the facts, and without any foregone conclusion." This binds everyone to the *method*, regardless of personal hope or bias.

  **How the Halves Hang Together & Sidgwick's Strategy:**

  1.  **Provocation to Action:** Calling the situation a "scandal" is a powerful rhetorical device. It shocks the audience (especially the educated elite he's implicitly criticizing) out of complacency. It frames the SPR's mission as urgent and necessary, addressing an intellectual failing of the age.
  2.  **Targeting the Dominant Obstacle:** Sidgwick identifies the primary barrier to resolution as the *institutionalized dismissal* by the educated/scientific mainstream. The "attitude of incredulity" is the prevailing wind the SPR must sail against. Focusing the "scandal" language here makes strategic sense to motivate change where resistance is strongest.
  3.  **Establishing Legitimacy through Neutrality:** Immediately following the provocation, he offers the solution: a rigorously neutral, scientific body committed *only* to the facts. The "unpledged" nature is the guarantee of that rigor. This reassures skeptics that it's not a spiritualist front, while assuring believers that their evidence will get a fair hearing.
  4.  **Reflecting Personal Leanings Pragmatically:** Sidgwick *personally* leaned towards the potential reality of some phenomena (otherwise, why dedicate decades?). His use of "scandal" and focus on credible witnesses hints at his private frustration with the establishment's dismissal. **However, his philosophical rigor demanded that this personal leaning *not* dictate the Society's methods.** Hence the strong emphasis on being "unpledged" and pursuing facts "without any foregone conclusion." He separated his *hope* from the Society's *mandate*.
  5.  **A "Procedural Scandal" Framed by Context:** Ultimately, the core scandal *is* procedural: the failure to apply sustained, systematic, scientific investigation to claims of significant potential importance. But Sidgwick frames it through the lens of the *dominant cultural/scientific attitude* ("incredulity") because that was the specific procedural failure he saw as most obstructive at that historical moment.

  **Conclusion:**

  This is **not a contradiction, but a deliberate and sophisticated rhetorical strategy.** Sidgwick uses strong, provocative language ("scandal," "incredulity") to diagnose a perceived intellectual failing of the establishment – their dismissive attitude preventing serious investigation. He then immediately prescribes the antidote: a rigorously neutral, scientific society committed solely to systematic inquiry ("unpledged," "without any foregone conclusion").

  He names unbelief (specifically, the *default, unexamined* kind) as the scandalous *symptom* of the deeper problem – the lack of proper procedure – because that was the most visible and obstructive symptom in 1882. His personal sympathies likely informed his perception of the scandal's nature, but his philosophical commitment to impartial inquiry dictated the Society's structure and method. The passage brilliantly balances provocation with a promise of rigorous neutrality, designed to shock the establishment into taking the question seriously while assuring them the investigation would be scientifically sound. It's a masterclass in launching a controversial scientific endeavor. Scholars of Sidgwick and the history of psychical research *do* recognize this tension and see this passage as emblematic of his approach. You've identified a genuine and important interpretive crux.
