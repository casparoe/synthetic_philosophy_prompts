  Everyone just kind of assumes PA and ZFC are consistent — sure, Godel's second theorem means the system can't prove its own consistency, but no working mathematician actually looses sleep over the idea that there's a real contradiction buried in there somewhere. I want you to push back on that complacency: argue that our confidence in the consistency of standard math is way less well-grounded than its usually treated as, and that "nobody's found a contradiction in over a century" is much weaker evidence than people assume. Get into the actual mechanics where you can — like what Gentzen's consistency proof for PA really buys us given that it leans on transfinite induction up to epsilon-0 (and whether that's genuinely more trustworthy than PA itself), how relative consistency proofs just push the question back a level instead of settling it, and maybe the Edward Nelson episode from 2011 where a serious logician thought he'd actually proved PA was inconsistent before people found the gap. Don't just wave at incompleteness and call it a day — actually engage with why our evidence for consistency is as thin as it is.
