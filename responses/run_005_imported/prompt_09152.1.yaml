  For the malfunction case: The etiological account handles it elegantly—the defective heart's function is still pumping blood because that's why hearts were selected, even if *this one* fails. The causal-role account struggles because it defines function by current contribution, and this heart contributes nothing. Verdict: etiological wins here. 

  Co-opted traits are trickier. Take feathers: originally for insulation, later for flight. Etiological theorists might say flight isn't the *original* function, but Millikan's "proper function" allows derived functions if there's recent selection. Still, it's messy. Causal-role account cleanly assigns function based on current role—flight for birds, insulation for dinosaurs. But is that satisfying? For whale pelvic bones, if sexual selection maintains them *now*, etiological accounts (depending on the version) could accept "anchor reproductive muscles" as a new function, while causal-role would just note their current mechanical role. Neither is perfect, but causal-role feels more flexible here. 

  The liberality problem hits causal-role hardest. If function is just any causal contribution, then yes, the heart *does* have a "thumping sound" function—but that seems absurd. Etiological accounts avoid this by tethering function to selective history. Cummins could impose constraints (e.g., contributions to "significant" capacities), but it's ad hoc. Strong point for etiologists. 

  Now, the big picture: Godfrey-Smith's "different questions" view is compelling. Etiological functions explain *why a trait exists* (selection history), while causal-role functions describe *current causal architecture*. The user might crave a "winner," but insisting on one overlooks that biologists need both tools. For example, in medicine, "why does this organ exist?" (etiological) vs. "how does it contribute to health now?" (causal-role) are distinct concerns. Pluralism isn't a cop-out—it reflects science's complexity. Still, I'll emphasize that etiological functions feel more "biological" because they're rooted in evolution, while causal-role is more general (applies to artifacts or ecosystems). 

