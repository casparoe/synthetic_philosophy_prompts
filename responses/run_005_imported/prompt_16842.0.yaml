answer: |-
  ## The Policy's the Thing: In Defense of Updateless Decision Theory in Predictor Games

  Your debate with your friend cuts to the heart of modern decision theory: **should rationality be judged solely by the expected utility of an *act* given the agent's *current information* at the moment of choice, or should it be judged by the expected utility of the *policy* (or decision rule) that generates acts, evaluated from a privileged prior perspective?** This is the core distinction separating "updated" decision theories (like Causal Decision Theory - CDT, and Evidential Decision Theory - EDT) from "updateless" approaches (like Updateless Decision Theory - UDT).

  *   **Updated (Conditional) Theories (CDT/EDT):** These theories hold that a rational agent, *at the moment of choice*, should always condition on all their *current* evidence. They calculate the expected utility of each available *act* using their updated credences *given what they now know*. In Counterfactual Mugging (tails), the agent knows the coin is tails, paying $100 gains nothing evidentially (EDT) and causes a loss of $100 causally (CDT), while refusing costs nothing. Paying is dominated; refusing is rational. The prior policy or potential counterfactual benefits are irrelevant to the current choice context.
  *   **Updateless (Policy-Based) Theories (UDT):** These theories hold that a rational agent should choose the *policy* (a complete mapping from possible information states to acts) that maximizes expected utility *from the perspective of the agent before they have any information specific to the situation*. The agent then follows this policy, even when, at a specific choice node, conditioning on their updated information suggests a different act would be locally optimal. In Counterfactual Mugging, the best policy *ex ante* is "Pay if asked," as it yields $0 if tails (pay $100) and $10,000 if heads (get paid). When tails occurs, UDT dictates paying $100 *because that's what the optimal policy dictates*, even though *given tails*, paying seems locally suboptimal. The "updateless" agent doesn't update their evaluation of the policy based on information that the policy itself was designed to handle optimally.

  **Illustrating the Divide: Three Cases**

  1.  **Counterfactual Mugging (Tails Scenario):**
      *   **Updated (CDT/EDT):** "I *know* it's tails. Paying costs me $100 now and gets me nothing (EDT: no correlation with good outcomes left; CDT: no causal benefit). Refusing costs nothing. Refuse."
      *   **Updateless (UDT):** "The best policy *before the flip* was 'Pay if asked'. It guaranteed $0 if tails and $10,000 if heads. Expected value $5,000. Any other policy (like 'Refuse if asked') gets $0 if tails and $0 if heads (since Omega wouldn't pay), expected value $0. I follow the best policy: Pay."

  2.  **Parfit's Hitchhiker:** You are dying of thirst in the desert. A driver finds you and says: "I'll drive you to town (saving your life) only if you *promise* to pay me $1000 once we arrive. If you don't promise, or promise but don't pay, I leave you here to die." You promise. Upon arriving safely in town, the driver asks for the $1000.
      *   **Updated (CDT/EDT):** "I *know* I'm in town. My life is saved. Paying costs me $1000 and gets me nothing (EDT: paying correlates with nothing good now; CDT: paying doesn't *cause* my continued survival, the driver already saved me). Refusing costs nothing. Refuse." (Result: You live but break the promise; the driver is exploited and won't help others).
      *   **Updateless (UDT):** "The best policy *before being rescued* was 'Promise to pay, and pay if saved'. This gets me saved and costs $1000. Expected value: Life - $1000. Policy 'Don't promise' gets death. Policy 'Promise but don't pay' gets death (driver doesn't save you, knowing you won't pay). I follow the best policy: Pay."

  3.  **Transparent Newcomb's Problem:** Omega places $1,000,000 in Box B only if it predicts you will take only Box B. It places $1000 in Box A regardless. Omega is a perfect predictor. Crucially, *you can see the contents of both boxes before choosing*. Box A visibly contains $1000. Box B visibly contains $1,000,000 *only if Omega predicted you'd one-box*; otherwise, it's empty.
      *   **Updated (CDT/EDT):** "I *see* Box B contains $1,000,000. Taking only Box B gets me $1,000,000. Taking both boxes gets me $1,001,000. Omega's prediction is in the past; my choice *now* cannot affect the contents. CDT/EDT agree: Take both boxes." (Result: You get only $1000, as Box B was empty because Omega predicted you'd two-box).
      *   **Updateless (UDT):** "The best policy *before seeing the boxes* is 'One-box' (take only Box B). Expected value: $1,000,000. Policy 'Two-box' (take both) gets $1000. The fact that I *now see* Box B is empty *because* I am (counterfactually) following a two-box policy doesn't change the fact that the *one-box policy* is superior *ex ante*. I follow the one-box policy: Take only Box B." (Result: You get $1,000,000, as Omega predicted you'd one-box and filled Box B).

  **Resolute vs. Sophisticated Choice: The Dynamic Choice Lens**

  This debate directly mirrors the "resolute" vs. "sophisticated" choice distinction (McClennen, Bratman). Imagine a multi-stage decision:

  *   **Sophisticated Choice:** The agent re-optimizes at *every* choice node using their updated information. They foresee their own future choices and plan accordingly, often leading to a "plan" they know they won't follow later if it becomes locally suboptimal. This corresponds perfectly to updated CDT/EDT in the above cases. The sophisticated agent in Parfit's Hitchhiker *plans* to refuse payment, knowing that's what they'll do later. In Transparent Newcomb, they *plan* to two-box, knowing they'll do so when they see Box B (potentially empty).
  *   **Resolute Choice:** The agent selects a complete *plan* (policy) at the outset that maximizes expected utility from that initial perspective. They then *resolve* to stick to this plan throughout, resisting the temptation to re-optimize locally at later nodes, even when new information makes the planned act seem suboptimal. This corresponds to UDT. The resolute agent in Parfit's Hitchhiker *plans and commits* to paying. In Transparent Newcomb, they *plan and commit* to one-boxing.

  **Weighing the Considerations**

  *   **Dynamic Consistency & Vulnerability to Exploitation/Money-Pumping (Pro-Updateless/Resolute):** This is the strongest argument for UDT/resoluteness. Updated/sophisticated agents are *dynamically inconsistent*: their planned course of action differs from what they actually do. More critically, they are *exploitable* by predictors (like Omega) or strategically aware opponents. In all three cases, the updated agent ends up worse off *by their own ex-ante lights* than the updateless agent: $0 vs. -$100 (effectively) in Mugging; death vs. life-$1000 in Hitchhiker; $1000 vs. $1,000,000 in Transparent Newcomb. They are victims of a "money-pump" or worse (death-pump!). A theory recommending acts that lead to dominated outcomes (worse in *all* possible worlds the agent cares about, or at least worse in expectation *ex ante*) seems fundamentally flawed. Resoluteness avoids this by ensuring the agent follows through on beneficial pre-commitments.

  *   **Apparent Arbitrariness of the Prior & Current Rationality (Pro-Updated/Sophisticated):** This is the strongest counter-argument. Why privilege the *ex ante* perspective? The agent *is* in the tails state *now*, with no causal or evidential link to the heads payoff. Paying $100 *now* for *absolutely nothing* seems irrational on its face. Conditioning on current information seems the essence of rational, responsive agency. Furthermore, UDT relies on specifying a "prior" state for policy evaluation. While often natural (before the flip, before meeting the driver), this can be arbitrary in more complex or unforeseen situations. Sophisticated choice seems more "realistic" – it acknowledges the agent's limited willpower or inability to bind their future self irrevocably. It treats each moment's choice as sovereign.

  **The Verdict: Updateless Rationality for Predictor Games**

  While acknowledging the intuitive pull of conditioning on current evidence, **I side decisively with the updateless/resolute approach in scenarios involving perfect predictors (or sufficiently reliable ones) and foreseeable dilemmas, such as Counterfactual Mugging, Parfit's Hitchhiker, and (Transparent) Newcomb's Problem.**

  Rationality cannot be solely about locally optimal acts if those acts systematically lead to outcomes the agent *knew in advance* were inferior. The exploitable nature of updated/sophisticated choice is a fatal flaw. A rational agent should care about the *overall consequences* of their decision-making *procedure*, not just the immediate consequence of a single act ripped from the context of the strategy that produces it. In these predictor games, the predictor's action depends on the agent's *disposition* or *policy*, not merely the isolated act in the counterfactual state. Judging rationality act-by-act ignores this crucial link.

  The "arbitrariness" of the prior is mitigated in these specific, well-defined games. The *ex ante* state (before the flip, before the desert ordeal, before seeing the boxes) is clearly defined and is the point where the agent faces genuine uncertainty about the state of the world *and* the predictor's response. It is the point where the value of different *ways of choosing* can be fairly assessed. While resoluteness may require a form of commitment that feels alien, it is precisely this commitment that allows the agent to reap the benefits of cooperation with the predictor or to avoid the traps of exploitation. It is not merely a "useful feature"; in these contexts, it is a *requirement* for achieving the best possible outcome and avoiding dominated strategies.

  **Qualification:** This verdict holds strongly for cases involving predictors whose actions depend on their prediction of the agent's *response* (policy) and where the agent could reasonably foresee the scenario and the predictor's behavior *ex ante*. It may be less compelling or applicable in genuinely novel situations, against non-predictive opponents, or where the "prior" state is ambiguous. However, for the paradigmatic thought experiments designed to probe rational choice under prediction – like the one that fueled your long drive – the rational agent pays up in Counterfactual Mugging, keeps their promise to the Parfit driver, and one-boxes in Transparent Newcomb. They do so not out of confusion, but because they understand that rationality demands evaluating and sticking to the best overall policy.
