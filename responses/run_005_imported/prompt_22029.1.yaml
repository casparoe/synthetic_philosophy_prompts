prompt: |-
  I chair my university's Academic Integrity Board, which hears cases of suspected AI-generated coursework based on little more than a detector's probability score and stylistic anomalies flagged by the instructor. The board is split on whether we should demand more of that evidence before finding a student responsible when the mandated sanction is severe, such as dismissal for a repeat offense, than when it is mild, such as resubmission with no notation on the transcript. Some members see this as no different from a court requiring stronger proof before a harsher verdict; others insist that whether a given student actually used AI is a fact about the world that cannot depend on what will happen to them if we rule against them, so letting the sanction shape our confidence threshold corrupts the fact-finding rather than improving it. Draft a short policy memo, to take effect next term, that states whether and how our confidence threshold should track sanction severity, and that answers the second group's objection rather than simply overriding it.
reasoning: |-
  Okay, the user chairs their university's Academic Integrity Board, and they're facing a split among members about whether the confidence threshold for AI-generated coursework should vary based on sanction severity. The core debate is whether harsher sanctions require stronger evidence, similar to legal standards, or if the fact of AI use is independent of consequences. 

  Hmm, this is a classic tension between procedural fairness and epistemological purity. The "legal model" advocates are prioritizing the stakes for the student's future, while the "fact purists" worry about contaminating truth-seeking. Both have valid points—academic integrity hearings aren't criminal trials, but dismissal *is* life-altering. 

  The user needs a policy memo that reconciles these views. Key challenges: avoiding perception of arbitrary thresholds while acknowledging severity concerns, and addressing the purists' objection head-on. Their phrase "answers rather than overrides" suggests this group includes principled faculty who'd resist bureaucratic fiat. 

  ...Right, so the solution must reframe the relationship between evidence and sanction. Instead of "we need 80% certainty for expulsion," focus on how *types* of evidence map to severity. For mild sanctions, stylistic anomalies plus detector flags might suffice—students get educational remediation. For severe sanctions, require layered evidence: behavioral patterns, digital footprints, or admissions. This way: 

  1. Thresholds aren't numerically fluid (addressing purists' corruption concern) 
  2. Stakes inform evidence *quality* not fact-finding standards 
  3. Investigative rigor naturally scales with severity 

  Also worth emphasizing that mild sanctions are pedagogical, not punitive—resubmission without transcript notation is about learning, not guilt branding. That distinction might placate purists who see binary guilt/innocence. 

  ...The memo should explicitly state: "Our determination of whether AI misuse occurred remains binary, but the consequences reflect proportionality." That's the compromise. Detector scores alone become insufficient for severe outcomes not because truth changes, but because such high-stakes decisions demand cross-corroboration. 

  Final polish: Stress board training on AI limitations. If detectors are part of evidence, instructors must document prompts and provide student drafts. Reduces overreliance on flawed tools. 

  This should satisfy both camps. Purists keep their factual binary; pragmatists get procedural safeguards. Win-win.
answer: |-
  ## Policy Memo: Thresholds for AI Misuse Findings  
  **To:** Academic Integrity Board Members  
  **From:** Chair, Academic Integrity Board  
  **Date:** October 26, 2023  
  **Subject:** Revised Evidence Threshold Policy for AI Misuse Cases (Effective Next Term)  
  **Policy Reference:** AI-2024-01  

  ### 1. Core Principle: Binary Fact-Finding, Proportional Sanctions  
  The Board reaffirms that determining whether academic misconduct occurred via unauthorized AI use is a **binary factual question**. A student either submitted work violating AI-use policies or did not. This factual finding *must not* vary based on potential sanctions.  

  However, the *consequences* of a violation must be proportional and procedurally just. Therefore:  
  > **The severity of the sanction shall determine the *robustness of evidence required* to reach the threshold of confidence needed for a finding of responsibility.**  

  ### 2. Threshold Tiers: Aligning Rigor with Stakes  
  To ensure fairness while upholding rigorous fact-finding, findings of responsibility shall align with the following evidence standards:  

  | **Sanction Severity** | **Evidence Threshold** | **Examples of Required Evidence** |  
  |------------------------|------------------------|----------------------------------|  
  | **Low Severity**<br>(e.g., resubmission, no transcript notation) | **Preponderance of Evidence**<br>(>50% likelihood) | • Single AI detector flag + instructor’s stylistic anomalies<br>• Lack of credible student explanation |  
  | **High Severity**<br>(e.g., course failure, suspension, dismissal) | **Clear and Convincing Evidence**<br>(High probability, unambiguous indicators) | • Corroborating evidence *beyond* detectors/stylistics:<br>  - Inconsistent draft history<br>  - Discrepancies in oral defense of work<br>  - Conflicting digital footprints<br>  - Prior confirmed violations<br>• Detector flags must be contextualized (tool limitations disclosed) |  

  ### 3. Addressing the "Fact-Finding Corruption" Objection  
  We agree that **the truth of whether AI misuse occurred is independent of sanctions**. This policy does *not* demand a higher probability of guilt for severe sanctions. Instead, it requires:  
  - **Deeper Investigative Rigor:** For severe sanctions, overreliance on inherently probabilistic tools (e.g., detectors) or subjective impressions (e.g., stylistic judgments) is insufficient. Corroborating evidence must demonstrate unambiguous indicators of misconduct.  
  - **Mitigating Tool Limitations:** AI detectors lack reliability as standalone proof. Their weight diminishes as sanctions increase, necessitating concrete, context-specific evidence.  
  - **Procedural Justice:** A student facing expulsion deserves a more thorough investigation than one facing resubmission. This aligns with academic best practices and fundamental fairness.  

  ### 4. Implementation Requirements  
  - **Training:** All Board members will receive training on AI evidence limitations, corroborative investigation techniques, and impartial application of tiered thresholds.  
  - **Documentation:** For high-severity cases, instructors must submit a detailed dossier showing efforts to gather multi-faceted evidence.  
  - **Burden of Proof:** The institution retains the burden of proof. The student’s explanation must be meaningfully considered at all tiers.  

  ### 5. Rationale  
  Varying evidence thresholds protect both institutional integrity and student rights. Low-stakes outcomes prioritize pedagogical resolution; high-stakes outcomes demand maximal safeguards against error. **This is not "adjusting the facts" – it is adjusting the diligence required to establish facts when irreversible harm is possible.**  

  **Approved and Effective:** First day of next academic term.  

  ---  
  *This policy balances the epistemological independence of truth (what happened) with the ethical necessity of proportionality (how we respond). By requiring richer evidence for severe outcomes, we ensure that life-altering decisions rest on more than algorithms and intuition.*
