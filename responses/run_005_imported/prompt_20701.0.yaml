prompt: |-
  A friend and I spent much of an evening arguing about G.E.M. Anscombe's 1956 protest against Oxford's decision to award Harry Truman an honorary degree despite his role in ordering the atomic bombings of Hiroshima and Nagasaki. By the end of the argument, I had come around to my friend's view: that Anscombe's condemnation of Truman is at bottom an empirical wager about body counts, since she is implicitly betting that a naval blockade or continued conventional bombing campaign would have forced Japan's surrender at a lower cost in civilian lives. Given that a fair number of historians now argue that a blockade-and-invasion strategy would likely have killed just as many, if not more, Japanese civilians, does this mean the historical evidence has largely vindicated Truman over Anscombe, by her own lights?
reasoning: |-
  Okay, the user is discussing a debate they had about Elizabeth Anscombe's protest against awarding Truman an honorary degree because of the atomic bombings. They've come to agree with their friend that Anscombe's argument boils down to an empirical wager about civilian casualties. Now, they're asking if the historical evidence showing that alternatives like a blockade or invasion might have caused even more deaths means Truman was justified by Anscombe's own standards.

  First, I need to recall Anscombe's position. She was a philosopher who opposed Truman's actions on moral grounds, specifically targeting the intentional killing of innocent civilians. Her protest wasn't just about body counts but about the principle of targeting non-combatants. So even if alternatives led to more deaths, she might argue that those deaths wouldn't be directly intended in the same way. 

  The user's question hinges on whether Anscombe's argument is primarily empirical. While she did argue that alternatives existed, her core point was moral. She distinguished between foreseeable deaths (which might be permissible under double effect) and intentional targeting, which she saw as murder. So if the bombings were aimed at civilians to force surrender, that's different from civilians dying as collateral damage in military operations.

  Looking at the historical evidence, estimates of casualties from a potential invasion vary. Some historians suggest hundreds of thousands to millions of Japanese deaths, plus Allied casualties. However, Anscombe might counter that blockade and conventional bombing could still be ongoing without the intentional element. Also, the Japanese government's internal discussions about surrender are complex, involving the Soviet entry into the war and other factors.

  The user might be conflating the empirical and moral aspects. Even if alternatives caused more deaths, Anscombe would likely maintain that the moral principle stands. Her vindication would depend on proving that Truman intentionally targeted civilians, not just on casualty numbers. Historical evidence about the decision-making process and targeting choices would be more relevant to her argument than comparative casualty figures.

  The user's deeper need might be understanding how moral principles interact with empirical data. They might be seeking clarity on whether consequentialist arguments override deontological ones when evidence changes. Or they might want to resolve their debate by seeing if historical facts settle the moral question. Addressing the structure of Anscombe's argument and how evidence impacts each layer is crucial here.
answer: |-
  That's a sophisticated and important question, but the answer is likely "no," **Truman has not been vindicated *by Anscombe's own lights* based solely on the historical evidence about potential body counts.** Here's why:

  1.  **Anscombe's Core Argument Was Deontological, Not Consequentialist:** While Anscombe certainly *did* argue that alternatives existed and would have caused fewer deaths, her primary condemnation rested on a **moral principle**, not a utilitarian calculus. She argued that deliberately targeting innocent civilians as a means to an end (ending the war) is intrinsically evil – **murder** – and absolutely prohibited, regardless of the consequences. She famously wrote in her pamphlet "Mr. Truman's Degree":
      > *"For men to choose to kill the innocent as a means to their ends is always murder... Murder is the deliberate killing of the innocent, whether for its own sake or as a means to some further end."*
      This principle is central to her argument. Even if an invasion *had* killed more people, she would likely argue that those deaths, while tragic, would be *foreseen but unintended* consequences of attacking legitimate military targets (soldiers, fortifications) or the result of combat operations. The atomic bombings, in her view, were the *intentional* destruction of entire cities full of non-combatants *as the chosen method* to break Japan's will.

  2.  **The "Double Effect" Distinction:** Anscombe, drawing on Catholic moral theology (particularly the Principle of Double Effect), made a crucial distinction:
      *   **Intended Killing of Innocents:** Absolutely forbidden. This is what she accused Truman of doing with Hiroshima and Nagasaki. The civilians *were* the direct target used to coerce surrender.
      *   **Foreseen but Unintended Deaths of Innocents:** May be permissible under strict conditions (e.g., the good effect is sufficiently grave, there's no other way to achieve it, the bad effect isn't intended as a means or end). She argued that conventional bombing (while horrific) or an invasion, however bloody, did not *necessarily* involve *intentionally* targeting non-combatants as the primary mechanism of victory in the same way the atomic bombings did. Blockades primarily target military logistics, though they foresee civilian starvation.

  3.  **The Empirical Point Was Secondary (But Important):** While the moral principle was primary, Anscombe *did* challenge the *necessity* of the atomic bombings on empirical grounds. She argued that Japan was already defeated, that alternatives (like accepting conditional surrender or tightening the blockade) existed and would have worked with fewer civilian deaths. **However, this empirical challenge served two purposes:**
      *   **To refute the justification:** If the bombings weren't necessary to achieve the good end (surrender) with fewer overall deaths, then even the consequentialist justification offered by Truman's supporters collapsed.
      *   **To expose the choice:** It highlighted that Truman *chose* a method involving the deliberate mass killing of civilians *when he (in Anscombe's view) had other options.* This choice revealed the moral character of the act itself.

  4.  **Why Historical Evidence Doesn't Vindicate Truman *by Anscombe's Lights*:**
      *   **Even if an invasion killed more:** If historians are correct that an invasion would have caused more total deaths (a highly contested point, but let's grant it for argument), Anscombe would likely respond: "Yes, that would have been a greater tragedy *consequentially*, but it wouldn't have been *murder* in the same way. Soldiers fighting soldiers, even with massive civilian collateral damage, is morally distinct from vaporizing cities full of civilians *because they are civilians* to terrorize a government into surrender." The higher death toll of an alternative doesn't retroactively make the *intentional targeting of innocents* morally permissible in her framework.
      *   **The Blockade/Conventional Bombing Argument:** Historians arguing against Anscombe's empirical point often focus on the invasion scenario. However, Anscombe emphasized the blockade and continued conventional bombing *as alternatives to both the bombs AND invasion*. If historians argue a blockade/conventional campaign *alone* would have taken longer and potentially killed *more* civilians than the bombs *through starvation and fire*, this *would* undermine her specific empirical wager about *relative body counts*. But crucially:
          *   This doesn't touch her core deontological principle about the intrinsic wrong of intentional targeting.
          *   She might argue that even a longer blockade/conventional campaign, while foreseeing immense suffering, still does not *intend* the death of civilians *as the direct means* to force surrender in the same explicit way the atomic bombs did. The means (blockade = cutting supplies; bombing = destroying industry/military targets) are different, even if the foreseen outcome (civilian death) is similar or worse.

  **Conclusion:**

  The historical debate about body counts is significant and relevant to *part* of Anscombe's argument (specifically, her challenge to the *necessity* and *consequentialist justification* of the bombings). **If** the evidence strongly suggests that realistic alternatives (especially blockade/conventional bombing, not just invasion) would have caused *more* Japanese civilian deaths than the atomic bombs did, then Anscombe's specific *empirical wager* about lower costs would be weakened or refuted.

  **However, this does *not* vindicate Truman "by her own lights."** Her primary light was a bright moral line: **deliberately killing the innocent as a means is always murder and is never permissible.** Historical evidence about comparative body counts, even if it favors Truman's decision on consequentialist grounds, does not erase that line or make the act permissible within her deontological framework. For Anscombe, the moral wrong was inherent in the *nature of the act itself*, not solely in a miscalculation of consequences. Vindicating Truman *by her lights* would require proving the bombings did *not* involve the intentional targeting of innocent civilians as a means – a very difficult task given the nature of the targets and the stated purpose of the attacks.
