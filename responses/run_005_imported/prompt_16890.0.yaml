prompt: |-
  So in my Philosophy of Logic seminar we just did dialetheism and paraconsistent logic back to back (right after the unit on the Liar), and I feel like my professor keeps drawing a seperate distinction between them that doesn't actually exist. As I understood it, a paraconsistent logic is just any logic where the principle of explosion fails, i.e. you can have some A and not-A both come out true without that letting you derive literally any random B you like. But why would anyone ever bother designing a logic that "tolerates" contradictions like that unless your already convinced some contradictions are actually true? It seems to me like the whole motivation for rejecting explosion basically IS dialetheism, so "paraconsistent logician" and "dialetheist" should really just be two labels for the same position, even if some people using these systems don't like admitting it.

  This actually came up with my roommate, who's a CS major, when she mentioned that certain database and expert systems deliberately run on paraconsistent logic so they don't crash or start outputting garbage answers the second they're fed contradictory info from two different sources. That kind of freaked me out - are all those engineers unknowingly signing up for the metaphysical claim that reality contains actual true contradictions, just because their system doesn't blow up the moment it hits one? Or is there some way to use a paraconsistent logic without buying into dialetheism that I'm just not seeing? Would love if someone could set me straight, because right now I genuinely can't find any daylight between these two things.
