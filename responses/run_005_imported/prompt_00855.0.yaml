answer: |-
  Your reading of Wittgenstein captures a key aspect of *On Certainty*, but I believe you're overextending it in a way Wittgenstein himself would likely resist. While hinge propositions *are* foundational and beyond direct evidential justification, their application to *this specific disagreement* is problematic. Here's a breakdown:

  1.  **The Core Insight is Correct:**
      *   **Hinges are Framework-Relative:** You're right that Wittgenstein sees basic certainties ("hinges") as the *preconditions* for doubt, inquiry, and justification within a particular "world-picture" or "form of life." They are not *themselves* justified by evidence within that system; they *enable* justification.
      *   **Clash at the Hinge Level is Intractable:** When two world-pictures have fundamentally different hinges, rational argument *about those specific hinges* often hits a wall. As Wittgenstein notes, it becomes more like missionary work (persuasion, conversion) than proof. The king raised to believe the world began with his birth exemplifies this radical incommensurability.

  2.  **Why Your Application to Your Brother Might Be Misplaced:**
      *   **Shared Background vs. Isolated Hinge:** You and your brother likely share *vastly more* hinges than you differ on. You both operate within a largely modern, scientific-technological form of life. You agree on hinges like: the existence of an external world, the reliability of senses (in everyday contexts), the reality of the past, basic logic, the usefulness of evidence and reason for navigating the world (e.g., fixing a car, treating an illness, understanding weather), the nature of family relationships, etc. Your disagreement is highly *localized* to a specific set of historical/scientific claims, not a wholesale clash of world-pictures.
      *   **The Nature of Young-Earth Creationism (YEC) as a "Hinge":** Is your brother's YEC belief truly functioning as a *hinge*? Hinges are usually *unarticulated*, background certainties that make thought and action possible. Your brother's belief is:
          *   **Highly Specific & Articulated:** It's a propositional belief *about* the world, actively defended.
          *   **Recent Acquisition:** It's a *change* from his previous stance, suggesting it wasn't a deep, formative hinge.
          *   **Potentially Inconsistent:** Does it genuinely *function* as the bedrock for *all* his other beliefs and actions? Or is it a specific belief *derived* from a prior commitment (e.g., a literalist interpretation of scripture elevated above other evidence)? This points to a conflict *within* his system, not just *between* systems.
      *   **Rejection vs. Replacement:** Your brother isn't operating within a *different* framework where radiometric dating, plate tectonics, and the fossil record *mean something else* or *don't exist*. He's operating within the *modern scientific framework* but *rejecting* specific conclusions *despite* their grounding in the shared methods and standards of that framework (methods he likely accepts in countless other contexts – medicine, technology, etc.). He's selectively suspending the rules of the game he otherwise plays.
      *   **Wittgenstein's Genesis Example:** His remark about intelligent people believing Genesis focuses on the *possibility* of such a belief persisting within a different *cultural/religious* form of life, perhaps one where scripture *is* the primary hinge for historical knowledge. Your brother was *raised* within a culture saturated with the scientific world-picture and *adopted* YEC later. This is different from someone deeply embedded in a pre-scientific, scripture-centric form of life.

  3.  **Wittgenstein's Nuance & Your Discomfort:**
      *   **Hinges are Practical & Shared:** For Wittgenstein, hinges aren't arbitrary personal whims; they are bound up with action, language-games, and *community*. Their "groundlessness" is practical, not relativistic. "My spade is turned" means we hit the bedrock of *shared action and practice*, not that "anything goes." The stability of hinges comes from their role in enabling coherent life and communication *within a community*.
      *   **The Instability of Your Brother's Position:** Wittgenstein might observe that your brother's YEC stance creates significant *tension* within the shared modern form of life. It requires constantly *explaining away* vast amounts of evidence generated by the very methods that underpin most other shared activities and beliefs. This makes it inherently unstable *as a hinge* within *your shared context*. It functions more like a deeply held, protected *belief* that conflicts with other foundational commitments.
      *   **Not All "Deep Beliefs" are Hinges:** Your brother's belief is fundamental *to him*, but that doesn't automatically make it a hinge *in the Wittgensteinian sense*. Hinges are what make doubting *itself* possible. Does doubting the age of the earth *enable* your brother to doubt other things? Or is it the *result* of a prior commitment (to scripture) that *itself* functions more hinge-like for him now?

  **Conclusion:**

  You are right that Wittgenstein highlights the *limits* of rational argument when confronting deeply held, framework-shaping beliefs. **However, characterizing your disagreement with your brother as a clash of incommensurable hinges overstates the case.** It's more accurately a **localized, severe conflict *within* a largely shared framework.**

  *   You share almost all the same hinges (external world, senses, logic, evidence-based reasoning in daily life, family bonds).
  *   His YEC belief is a *specific, derived belief* that has become axiomatic *for him*, but it clashes violently with other hinges and the evidence generated by the shared methods of your common world-picture. It's less a rival hinge and more a **protected fortress built *on top of* shared hinges but walling off specific areas from their implications.**

  **Your discomfort is warranted:** Using Wittgenstein to declare the disagreement fundamentally incommensurable *is* a convenient way to disengage, but it risks misrepresenting both Wittgenstein and the nature of the disagreement. Wittgenstein offers a powerful tool for understanding *why* arguments hit a wall – the belief is functioning *as if* it were a hinge for your brother, shielded from the usual rules of evidence within your shared game. However, it doesn't mean both positions are equally valid within the shared framework or that there's *no* fact of the matter accessible through shared methods. It means rational persuasion has reached its practical limit *with him* on this topic.

  **The Wittgensteinean path forward isn't declaring incommensurability, but recognizing the *kind* of impasse you face:** You're not encountering a radically different form of life; you're encountering a deep, localized commitment that resists the shared evidential standards. This understanding can indeed help you disengage gracefully ("My spade is turned; we just see the world differently on this"), focusing on the vast shared hinges that sustain your relationship, without needing to concede that your position is merely another arbitrary "hinge" or that the disagreement lacks a basis in shared evidence and reason.
