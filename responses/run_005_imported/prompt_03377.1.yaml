  First, I need to verify their understanding of Blackburn and Gibbard. Blackburn's solution uses higher-order attitudes to explain moral conditionals. For example, accepting "if lying is wrong, then getting your brother to lie is wrong" involves disapproving of approving lying but not getting others to lie. The user argues this reduces logical inconsistency to psychological conflict, which isn't formal like modus ponens. That's accurate. Blackburn's inconsistency is practical, based on conative attitudes clashing, not purely logical.

  Then Gibbard's hyperplans introduce world-plan pairs. Inconsistency becomes failing to have any pair satisfying all commitments. The user thinks this is cosmetic because plan individuation relies on practical facts, not formal logic. That's a common critique. The key question is whether plans can be defined formally or if they depend on substantive norms. If the latter, then Gibbard hasn't escaped the psychological grounding.

  The user's worry about "logical vs. practical inconsistency" is valid and recognized. Critics like Dreier, Schroeder, and van Roojen have raised similar points. Van Roojen's "Moral Rationalism and Rational Amoralism" argues that expressivist inconsistency doesn't match logical necessity. The user might be recalling that. Expressivists respond by redefining logical terms or embracing practicality, but the tension remains.

  For Gibbard's hyperplans, the user's critique has merit. If plan individuation isn't purely formal, the inconsistency might still be practical. Gibbard claims plans are abstract objects, but their identity conditions could rely on norms. The user should be ready for counterarguments: Gibbard might say the model is formal once plans are defined, but the deeper issue persists.

  The user needs to strengthen their argument by citing literature and addressing expressivist responses. They should clarify that the problem isn't about formalism but whether the inconsistency is genuinely logical. Students might object that the model works formally, but the user can counter that the formal system is built on practical foundations, which might not satisfy the demand for logical validity.

  In summary, the user's representation is accurate, their concern is valid and discussed in literature, and their hyperplan critique holds though they should anticipate defenses. Advising them to reference specific critiques and prepare responses will help them handle student challenges.
answer: |-
  Your critique is sharp, well-articulated, and hits on a **central, enduring tension** in sophisticated expressivism. You've represented the views accurately and identified a genuine, recognized problem. Let's break it down:

  **(a) Accuracy of Representation:**
  *   **Blackburn:** You've nailed it. His quasi-realism explains the *inconsistency* involved in accepting the premises but rejecting the conclusion of a moral modus ponens argument (like your lying example) as a *practical* inconsistency: a clash of conative attitudes. Accepting the conditional expresses a higher-order attitude (disapproval of the combination). Accepting the antecedent expresses the first-order attitude. Rejecting the conclusion expresses the incompatible first-order attitude. The "offness" is the clash of these *attitudes*, not a purely semantic contradiction in the representational sense. This is faithful to Blackburn's projectivism/quasi-realism.
  *   **Gibbard:** Your summary is also accurate. He introduces "hyperplans" (complete contingency plans for action) alongside possible worlds. Normative judgments express plan-laden states of mind. Inconsistency is defined model-theoretically: a set of judgments is inconsistent if there is *no* world-hyperplan pair that satisfies all of them simultaneously. This *looks* like standard logical inconsistency defined over a richer set of points of evaluation.

  **(b) The "Logical vs. Merely Practical Inconsistency" Worry:**
  *   **Yes, it is a VERY real and recognized problem.** It's arguably *the* core challenge for expressivism, even after sophisticated developments. It goes by names like:
      *   **The Problem of Creeping Minimalism:** (Dreier, 2004) If expressivists define "truth," "proposition," "inconsistency," etc., in their own terms (e.g., practical inconsistency, plan-theoretic models), how is their view *substantively different* from a minimalist realism? What work is "expression" *really* doing if all the logical trappings are mimicked? Your worry is a specific instance: does mimicking the *form* of logical inconsistency capture its *substance*?
      *   **The Problem of the Distinctively Logical:** (Schroeder, 2008, 2010; van Roojen, 1996, 2018) What makes inconsistency in logic *special*? Your point about modus ponens being formal and topic-neutral is crucial. Traditional logic applies universally because it deals with truth-conditional content and relations defined purely syntactically/semantically. Expressivist "inconsistency" seems grounded in *substantive facts* about the nature of the attitudes being expressed (e.g., that disapproval *is* the kind of state that conflicts in this specific way with that higher-order attitude). Is this *logic* or *psychology* masquerading as logic?
      *   **The Charge of "Psychologism":** Critics argue expressivism reduces logic to contingent facts about human psychology/attitudes. Van Roojen is indeed a key figure here. His 1996 paper "Moral Rationalism and Rational Amoralism" directly targets the idea that expressivist inconsistency captures *logical* necessity. He argues that an amoralist (or someone with different conative dispositions) could accept the premises and deny the conclusion of a moral modus ponens argument *without any rational failing recognizable as *logical* inconsistency* – they might just have different, consistent attitudes. The inconsistency only arises *if* you share the specific conative commitments presupposed by the expressivist account. Real logical inconsistency, the argument goes, is supposed to be *inescapable* by any rational agent, regardless of their contingent desires or plans.
  *   **Expressivist Answers (and their Limits):**
      *   **Redefining the Target:** Expressivists often argue they aren't trying to capture *realist* logical validity. They aim to explain *why moral discourse exhibits logical structure and discipline* despite being non-representational. Blackburn might say he's explaining the *internal logic* of normative discourse, grounded in the functional roles of the attitudes.
      *   **The Formal System Defense (Gibbard):** Gibbard argues that once you define the model theory (world-plan pairs) and the satisfaction conditions for normative claims *within the system*, inconsistency *is* formally defined. The logic *is* topic-neutral *within the domain of plan-laden content*. The rules apply regardless of the specific normative claims P and Q. The *formalism* itself is topic-neutral.
      *   **Biting the Bullet:** Some might concede that the foundation *is* practical/psychological but argue this is the best explanation available for normative discourse and that it successfully *mimics* the logical structure well enough for all practical (and philosophical) purposes. The "inconsistency" *feels* logical because of the deep functional role of the attitudes.

  **(c) Pushing Back on Your Hyperplan Critique (and Strengthening It):**

  Your suspicion about Gibbard is spot-on. **Your critique is not confused; it's penetrating and highlights the deepest challenge.** Here's how to refine it and anticipate defenses:

  1.  **The Core Issue (Individuation):** Your key insight is correct: the *formal* inconsistency in the world-plan model **depends entirely on how hyperplans are individuated and what counts as "satisfying" a normative commitment.** Gibbard defines hyperplans as *functions* from world-normative-circumstance pairs to actions. But:
      *   What determines *which* function a particular mental state (accepting "Lying is wrong") corresponds to?
      *   What makes two agents' mental states count as expressing the *same* hyperplan component?
      *   Crucially, **the answer *has* to bottom out in the *functional role* of the attitudes in practical reasoning, deliberation, and motivation.** The model is a formal *representation* of the underlying conative state and its logical consequences *as defined by its practical role*. The "plan" isn't a freestanding abstract object; it's a model *of* the agent's practical commitments.

  2.  **Why This Matters for "Formal" Logic:**
      *   In standard logic, the individuation of truth-conditional content (propositions) and the satisfaction conditions are (ideally) grounded in mind-independent reference or conceptual roles *not* tied to conative psychology. The inconsistency between "P" and "~P" is absolute.
      *   In Gibbard's model, the inconsistency between "P" and "~P" *only arises* because the model is built to reflect the practical inconsistency that would arise in an agent holding both attitudes. The *source* of the conflict modeled is the practical clash, not a purely representational contradiction. The formalism is a *description* of the practical logic, not its *ground*.

  3.  **Potential Gibbardian Defense & Counter:**
      *   **Defense:** "The model *is* the formal system. Once you accept the framework (worlds, plans, satisfaction conditions defined for normative claims), inconsistency *is* defined purely formally within that system, just like possible worlds semantics defines it for descriptive discourse. The *metaphysics* of plans (are they real? mental constructs?) is separate. The logic works *within the model*."
      *   **Your Strong Counter (Refined):** "This defense risks Creeping Minimalism. If the model is *just* a formal representation *of* practical inconsistency, then calling it 'logical inconsistency' is merely labeling the formal shadow of the underlying psychological/practical conflict. The *reason* there's no satisfying world-plan pair for 'P & ~P' is *because* the underlying attitudes are practically incompatible, and the model is designed to reflect that incompatibility. The 'formality' is superficial; the engine is still the functional role of the attitudes. It hasn't *replaced* Blackburn's explanation; it has *formalized* it. The worry remains: is this *genuinely* topic-neutral logical validity, or is it a useful formal system *built on* the substantive (and contingent?) functional nature of normative attitudes? Can an agent with sufficiently different conative architecture (like van Roojen's rational amoralist) coherently accept the premises and deny the conclusion *within their own conative framework*, showing the 'inconsistency' isn't truly *logical* in the universal sense?"

  4.  **The "Buried it a level down" Point:** This is exactly right. Blackburn's clash of attitudes is translated into Gibbard's failure of a world-plan pair to satisfy incompatible commitments. But the *conditions* for satisfaction and the *individuation* of the plan components are stipulated *precisely to mirror* the practical inconsistency. The hyperplan machinery doesn't *eliminate* the dependence on practical role; it *encodes* it into the formalism. The foundational work is still being done by the expressivist psychology.

  **Conclusion & Advice for Seminar:**

  *   **Your argument is sound, significant, and reflects a major current in the literature.** You've accurately represented the views and pinpointed a fundamental objection.
  *   **Emphasize the Distinction:** Hammer home the difference between:
      *   **Formal/Logical Inconsistency (Traditional):** Defined over truth-conditional content, topic-neutral, grounded in syntax/semantics, binding on any rational agent *qua* rational agent.
      *   **Practical Inconsistency (Expressivist):** Defined over conative states, grounded in the functional role of attitudes (disapproval, planning), binding on agents *only insofar* as they share the relevant conative dispositions/commitments.
  *   **Frame Gibbard's Move:** Present it as an attempt to *mimic* formal inconsistency by building a model *on top of* the practical foundation. The crucial question is: **Does this mimicry *succeed* in capturing the *distinctively logical* nature of validity, or does it merely provide a formal *description* of the practical inconsistency?** This is where the debate lies (Schroeder, Dreier, van Roojen vs. Gibbard, Blackburn, Ridge).
  *   **Anticipate Student Pushback:** A sharp student might say: "But Gibbard *defines* a formal system where validity *is* topic-neutral! P and Q can be *any* normative claims." Your response should be: "Yes, *within the formal system*. But the system itself is built to model practical inconsistency. The *reason* 'P & ~P' has no satisfying pair is *because* of the practical conflict it models. Is the 'formality' of the system sufficient to make the inconsistency *logical* in the strong, traditional sense, or is the system just a useful way to represent the *practical* logic? Does this system show why a *rational amoralist* must accept modus ponens for moral claims, or only why someone *already committed* to the conative framework must?"
  *   **References:** Definitely mention:
      *   **Mark van Roojen:** "Moral Rationalism and Rational Amoralism" (1996) is the classic on the amoralist challenge. His later work (e.g., "Moral Cognitivism vs. Non-Cognitivism" in SEP, 2018) reiterates the point.
      *   **James Dreier:** "Meta-ethics and the Problem of Creeping Minimalism" (2004) for the broader worry about distinctiveness.
      *   **Mark Schroeder:** *Being For: Evaluating the Semantic Program of Expressivism* (2008) and *Noncognitivism in Ethics* (2010) for deep dives into the challenges of capturing logic within expressivism, particularly the "distinctively logical" problem.
      *   **Allan Gibbard:** *Thinking How to Live* (2003) is the source for the hyperplan solution. He addresses concerns about formality in Ch. 5 and 6, but the critiques above persist.
      *   **Simon Blackburn:** "Attitudes and Contents" (1988), *Essays in Quasi-Realism* (1993) for his original solution. He'd likely argue the practical inconsistency *is* the relevant kind for normative discourse.

  **You are absolutely on solid ground.** Presenting this tension clearly will make for an excellent seminar discussion. Good luck!
