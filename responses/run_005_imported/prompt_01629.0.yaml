answer: |-
  The coffee mug slipped from David’s fingers, shattering on the kitchen tile like the last vestige of his old reality. He didn’t move to clean it up. He just stared at the shards, replaying the words from the late-night physics forum he’d fallen into: *Quantum Immortality. In the Many-Worlds Interpretation, you only experience the timelines where you survive.*

  It started as intellectual curiosity, a weird consequence of a fringe theory. But the logic was chillingly simple: every quantum event branches reality. When death is a possibility – a car crash, a falling anvil, a stray bullet – the universe splits. In one branch, you die. In others, you live. But *you*, the conscious observer, *only exist in the branches where you are conscious*. You never experience cessation. Subjectively, you are immortal.

  The initial thrill – a cheat code against oblivion! – curdled within days. It wasn't freedom; it was a cage of perpetual near-death.

  He started noticing the near misses. The truck that ran the red light *just* as he braked hard. The rotten step on the old library stairs that held *his* weight but groaned ominously. The flu that spiked a terrifying fever but broke overnight. Before, they were close calls, luck. Now, they felt like… confirmations. *Proof* that the universe was constantly shearing him away from death, leaving only the living Davids behind.

  The terror wasn't of dying, but of *persisting*. He imagined countless Davids snuffed out in parallel realities, their consciousnesses extinguished the moment death touched them. Only *this* David, perpetually skirting the edge, remained. He became hyper-aware of risk, not because he feared the end, but because he feared *continuing* under this grotesque premise. Crossing the street felt like a cosmic game of Russian Roulette where he was guaranteed to hear only empty clicks, yet each crossing left him trembling, picturing the splattered Davids in unseen dimensions.

  He tried to test it. A reckless phase. Speeding on wet roads, walking too close to unstable scaffolding. Each time, adrenaline spiked, fear clenched his gut… and nothing happened. Or rather, something *always* happened to avert disaster – a sudden swerve, a shout of warning, pure dumb luck. Each survival felt less like luck and more like inevitability, a horrifying validation. He stopped testing. The thought of deliberately stepping off a high place only to find himself inexplicably landing on a lower ledge or caught by a net in *this* branch made him nauseous. What would that do to his mind?

  The true horror crystallized one rainy evening. He was driving home over the old, narrow bridge. A blinding glare from an oncoming truck, a skid on the slick metal, a sickening lurch towards the guardrail. Time dilated. *This is it,* he thought, not with fear of oblivion, but with a crushing, existential dread: *Here comes the split. In one world, metal screams, water rushes… and David ceases. In this world… what improbable salvation?*

  The car jolted violently, tires screeching, then stopped. He was inches from the bent guardrail, engine stalled, heart hammering against his ribs. Utterly unharmed. Rain lashed the windshield. He didn’t feel relief. He felt profound, soul-chilling loneliness. *How many times? How many Davids have I left behind? Am I the only one still walking this tightening path?*

  It paralyzed him. Not physically, but existentially. Why strive? Why care? If death was an illusion from the inside, wasn't life also hollowed out? He became withdrawn, haunted. He saw people mourning loved ones and thought, *But are they truly gone? Or are they still experiencing *their* immortal stream somewhere, oblivious to our grief?* It fractured his empathy, made genuine connection feel pointless in the face of infinite, diverging solitudes.

  The turning point came slowly, fueled by exhaustion. The theory remained intellectually plausible, but its psychological weight was crushing him. He looked at the shards of the mug still on the floor days later. He looked at a photo of himself laughing with friends years ago – a David untouched by quantum dread.

  *What if it's true?* he finally admitted to the silence of his apartment. *So what?*

  The chilling corollary struck him: Even if he was subjectively immortal, his life *here* could still become unbearable. He could still suffer, decay, go mad. Quantum immortality wasn't paradise; it was potential eternal confinement to whatever reality he kept surviving in. It offered no escape from pain, only from the final curtain call.

  He knelt and started carefully picking up the ceramic pieces. The physicality of it, the small task, grounded him. *This* reality. *This* broken mug. *This* breath in his lungs.

  He stopped seeking near-death validations. He stopped obsessively calculating probabilities. He started cleaning his apartment. He called a friend he’d been avoiding. He made a doctor’s appointment he’d been putting off – not because he feared death, but because he feared living *here* with a treatable illness.

  Quantum immortality didn’t free him from fear; it weaponized survival. But David realized the only sane response was to live *as if* this life, this fragile, singular-seeming thread, was the only one that mattered. Because *in* this branch, it was. The alternative – dwelling in the ghoulish mathematics of his own perpetual non-death – was a different kind of dying.

  He placed the last large shard in the trash. He wouldn’t forget the theory. Its icy logic still lurked in the back of his mind, a ghost perpetually haunting its own funeral. But he wouldn't let it dictate his life. He picked up the kettle to make new coffee. He’d be careful. Not because he feared the end, but because he was learning, painfully, to cherish the middle. The heat of the mug in his hands, the bitter taste on his tongue – these were real, *now*. And "now" was the only place he could ever be, quantum ghosts or not. He breathed in the steam, choosing, moment by fragile moment, to inhabit the life he had, not the immortality he might – or might not – be cursed to endure.
