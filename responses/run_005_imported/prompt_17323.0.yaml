  ## The Oracle in the Attic

  The house on Cypress Street smelled of dust and forgotten summers. Elara had inherited it from Great-Aunt Miriam, a woman whose eccentricities were local legend. Among the cracked porcelain figurines and moth-eaten shawls, Elara found the Device. It sat in the attic, nestled in a cedar chest lined with faded velvet – a smooth obsidian disc, cold to the touch, mounted on a bronze tripod etched with spirals that seemed to shift when not looked at directly. A single, worn instruction sheet lay beneath it, written in Aunt Miriam’s looping script:

  *"Ask. It tells only one truth: the precise moment and nature of your death. Costless. Painless. Look, or don't. Your peace is your own."*

  Elara, pragmatic and burdened by student loans and a stalled graphic design career, initially dismissed it as another of Aunt Miriam's peculiar jokes. But curiosity, that insistent whisper, gnawed at her. One rain-lashed Tuesday, she placed the disc on her kitchen table. It hummed faintly, a vibration felt in the bones, not the ears.

  *Costless. Painless.* The words echoed Good’s theorem. Free evidence. Why *wouldn't* she look? Knowledge was power. Forewarned was forearmed. If she knew the *when* and *how*, she could avoid risks, maximize her remaining time, make *optimal* decisions. She envisioned structuring her life like a perfect financial portfolio, allocating resources against a known expiration date. She placed her palm on the cool obsidian. "Show me," she breathed.

  The disc didn’t glow or project. The knowledge simply *arrived*, fully formed and chillingly specific, like a memory she’d always possessed but forgotten: *Seventy-three years, four months, two days. Cardiac arrest, peacefully, in her sleep, in her own bed.* A wave of profound relief washed over her, followed immediately by a peculiar, hollow lightness. Seventy-three years! A long life. Peaceful. In her sleep. It was… perfect. Almost disappointingly so. The crushing anxiety about sudden accidents, terminal illnesses whispered about in doctor's offices, the nebulous dread of the unknown – it evaporated. She felt buoyant, unburdened.

  *This,* she thought, vindicated, *is why Good was right. This peace is the ultimate utility.*

  But the lightness began to curdle. The knowledge didn’t just remove fear; it began to reshape the landscape of her choices. Planning a trek through the Andes next year? Why bother with strenuous preparation? She wouldn't die on a mountainside. She had *decades*. The urgency that once fueled her late-night design sessions dimmed. Why burn the midnight oil for a promotion? She had time. So much time. Opportunities lost their sharp edges; risks their thrilling bite. Life became… flatter. Safer, yes, but tinged with a quiet melancholy, like living within pre-drawn lines.

  Her relationship with Ben shifted subtly. He talked excitedly about saving for an early retirement, traveling the world while they were still "young and spry." Elara found herself nodding, but her internal counter ticked relentlessly: *Seventy-three. Plenty of time.* His urgency felt vaguely irrational, almost charmingly naive. When he suggested skydiving for his birthday, a thrill Elara would have once embraced, she demurred. "Too risky," she said, the obsidian certainty a shield against his disappointed grin. A small fissure opened. He started calling her "cautious Elara," a new nickname that carried a faint, unspoken distance.

  Meanwhile, her friend Maya, who’d known about the Device and vehemently argued against looking ("Ignorance is the soil joy grows in, El! You'll turn your future into concrete!"), lived with vibrant recklessness. She quit her stable job to start a pottery studio, fell passionately in and out of love, embraced every spontaneous adventure. Elara watched her, sometimes envious of Maya’s palpable *aliveness*, sometimes pitying what seemed like chaotic, inefficient choices. Maya burned brightly, fueled by the delicious, terrifying uncertainty of a future unwritten.

  Years flowed. Elara built a comfortable life. She worked steadily, avoided unnecessary risks, enjoyed quiet pleasures. She married Ben, though the wedding felt less like a leap of faith and more like a sensible consolidation of assets against a long, predictable horizon. They had a daughter, Lila. Elara loved her fiercely, but even that love felt filtered through the lens of the obsidian disc. She found herself subtly steering Lila away from pursuits deemed "high-risk" – competitive rock climbing, distant volunteer work in unstable regions. "You have your whole life ahead of you, sweetheart," Elara would say, the phrase carrying the unspoken weight of her own known endpoint. Lila, sensing the invisible boundaries, sometimes chafed against them.

  *Was this optimal?* The question began to haunt Elara. She was safe. She was comfortable. She would likely achieve her predicted peaceful end. But the vibrant tapestry of possibility – the thrilling uncertainty, the potential for radical reinvention, the raw, unscripted joy Maya seemed to sip from every moment – felt faded in her own life. The knowledge hadn’t just informed her decisions; it had fundamentally altered the *nature* of the decision-problem itself. The utility of spontaneous joy, of risk-driven growth, of living *as if* the future was an open question – these had been subtly devalued, crowded out by the serene efficiency of the guaranteed path. Good’s theorem assumed a static utility function, but the knowledge had irrevocably changed hers.

  Then came the anomaly. During a routine check-up at fifty-five, the doctor frowned. "Elara, your EKG shows some irregularities. We need to run more tests. It could be a precursor to arrhythmia."

  A cold finger traced Elara’s spine. *Cardiac arrest. Seventy-three.* This was *wrong*. The Device was infallible. Aunt Miriam’s note said so. The panic she hadn’t felt in decades surged back, sharp and terrifying. The peace she’d purchased shattered like glass. The tests were invasive, stressful. Ben held her hand, his face etched with a worry she’d never allowed herself to show him. Lila flew home, anxious. The specter of a different, earlier end – one *not* peaceful, *not* in her sleep – loomed large.

  The results came back: a minor, treatable electrical issue. A medication regimen, lifestyle adjustments, and she’d be fine. Relief flooded her, but it was tainted. The bedrock certainty of seventy-three was gone, replaced by a chilling realization: *The Device only showed the* cause *of death. It didn't guarantee the path wouldn't be terrifying, or that intervening events wouldn't cause immense suffering along the way.* Her "peace of mind" had been a fragile illusion, shattered by a routine EKG. The knowledge had made her complacent, not resilient.

  Ben squeezed her hand after the all-clear. "You okay? You look… shaken. More than just the scare."
  "I am," Elara whispered, staring out the window at the rain, so like the day she first touched the disc. "I think… I traded the fear of the unknown for the fear of the known being wrong. Or incomplete."

  Years later, at seventy-two, Elara sat in her garden, watching Lila’s children play. Ben was gone, taken by a swift, unexpected stroke a few years prior – a death *not* predicted for him, a devastating blow that the Device’s knowledge about her own end did nothing to soften. Maya visited often, her hair silver, her eyes still sparkling with untamed curiosity. She’d just returned from helping build schools in Nepal.

  "Still glad you peeked?" Maya asked gently, sipping her tea.

  Elara watched a ladybird crawl across the weathered garden table. She thought of the decades of safety, the comfort of the long horizon, the opportunities perhaps wisely bypassed. She also thought of the flatness, the subtle constraints she’d placed on herself and Lila, the shock of the cardiac scare, the profound grief for Ben that the Device’s knowledge couldn’t mitigate.

  "I don’t know," Elara answered honestly, her voice soft. "I lived a long life, free from that particular dread. I made… sensible choices." She paused, watching her granddaughter attempt a wobbly cartwheel on the lawn, a flash of pure, unburdened joy. "But I wonder sometimes about the life I didn’t live. The paths not taken because the destination seemed fixed. I wonder if the fear of the unknown is the price of admission for… that." She nodded towards her granddaughter’s triumphant grin.

  Maya smiled, a little sadly. "And I wonder if my blissful ignorance is just luck. Maybe tomorrow, I fall down these very steps." She patted the stone beside her. "But today? Today, I don’t know, so today is everything."

  The sun dipped lower, casting long shadows. Elara’s predicted end was a year and a handful of months away. Cardiac arrest. Peaceful. In her sleep. The knowledge sat within her, a cold, familiar stone. It had given her a map, but perhaps the map had also drawn the borders. She had optimized for safety, for longevity, and likely achieved it. But as the twilight gathered, the question lingered, heavy and unanswerable: Had she optimized for a *life*, or merely for the conditions of its ending? The theorem promised maximum expected utility *if* the game remained the same. But the Device had changed the game. And Elara, holding the rulebook written in obsidian, could never be sure if she’d won, or simply avoided playing a different, wilder, perhaps more vibrant game altogether. The doubt, born the moment the knowledge crystallized her future, remained her constant companion – the price paid for a peace that was never quite complete.
