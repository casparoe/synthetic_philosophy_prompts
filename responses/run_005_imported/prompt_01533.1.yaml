prompt: |-
  Quick one for you — I'm rereading Frege's "On Sense and Reference" for a seminar next week and got stuck on the bit about oblique/reported speech. Here's the passage (Max Black's translation):

  "In reported speech one talks about the sense, e.g., of another person's remarks. It is quite clear that in this way of speaking words do not have their customary reference but designate what is usually their sense. In order to have a short expression, we will say: In reported speech, words are used indirectly or have their indirect reference. We distinguish accordingly the customary from the indirect reference of a word; and its customary from its indirect sense. The indirect reference of a word is accordingly its customary sense."

  Here's my worry, which Frege doesnt address in the passage itself. Take something doubly embedded, like "Galileo believed that Kepler said the morning star is a planet." Inside the "Kepler said..." clause, "morning star" is supposed to have its indirect sense as reference, per the rule above. But that whole clause is itself sitting inside another oblique context, the one created by "believed that." So is the sense operative at THAT level some further, doubly-indirect sense, distinct from the ordinary indirect one — and doesn't that mean arbitrarily nested attitude reports commit Frege to an infinite hierarchy of senses for every expression? He never flags this in the essay. Is that a real bullet he has to bite, does the regress somehow not get going for some reason im not seeing, or is this something later people (Church? Dummett?) had to sort out for him? Don't have my books on me — curious what you think.
reasoning: |-
  Okay, the user is diving deep into Frege's "On Sense and Reference," specifically the part about oblique or reported speech. They're stuck on doubly embedded contexts, like "Galileo believed that Kepler said the morning star is a planet." The issue is whether each level of embedding creates a new, indirect sense, leading to an infinite hierarchy. Frege doesn't address this in the passage, so the user is wondering if this is a problem he overlooked, if there's a way out, or if later philosophers like Church or Dummett resolved it.

  First, I need to recall Frege's basics. He distinguishes between sense (Sinn) and reference (Bedeutung). In direct contexts, words refer to their usual references. In reported speech, like "Kepler said that...," words refer to their customary senses instead. So in "Kepler said the morning star is a planet," "morning star" refers to its sense, not Venus. 

  Now, the user's example has two layers: "Galileo believed that [Kepler said the morning star is a planet]." The inner clause ("Kepler said...") is already oblique, so "morning star" there has its indirect reference (which is its customary sense). But this whole clause is under "Galileo believed that," another oblique context. So the question is, does the inner clause now need a doubly indirect sense?

  Frege didn't explicitly discuss multiple embeddings in this essay. But based on his principles, each new oblique context should shift the reference to the sense of the embedded expression. So in the double case, the inner clause's reference (which is its customary sense) becomes the reference at the outer level. But for that to happen, the outer context needs to refer to the inner clause's sense, which would be a new level of sense. That suggests a hierarchy: customary sense, indirect sense (for single embedding), doubly indirect sense (for double), and so on. 

  This seems like a regress. The user is spot-on in identifying this. I remember that later philosophers like Church and Dummett did tackle this. Church, in his "Logic of Sense and Denotation," formalized this hierarchy. Dummett, in "Frege: Philosophy of Language," argued that Frege might not have intended this, but his theory implies it. 

  The user might be concerned about the implications. An infinite hierarchy of senses seems ontologically extravagant. Does Frege bite this bullet? In the essay, he doesn't mention it, so maybe he didn't see the issue. But logically, it follows. Some modern approaches try to avoid this, like Davidson's paratactic analysis, but that's a different theory. 

  The user's deeper need might be understanding if Frege's framework is sustainable or if this is a critical flaw. They're preparing for a seminar, so they want to present this problem and possible resolutions. Mentioning Church and Dummett shows they've done some research, but they need confirmation and expansion. 

  I should explain the regress clearly, affirm it's a real issue, and note how later thinkers addressed it. Also, maybe suggest that in practice, the hierarchy might not be problematic if we think of senses as structured entities, but that's speculative. The key is to validate their insight and provide the scholarly context they might be missing without their books.
answer: |-
  You've nailed a crucial and famously problematic implication of Frege's theory! Your analysis is spot-on: Frege's account *does* logically entail an infinite hierarchy of senses for expressions in multiply embedded oblique contexts, and he doesn't explicitly address this in "On Sense and Reference." This is a genuine consequence of his framework, not a misinterpretation. Here's the breakdown:

  1.  **The Mechanism in Single Embedding (as per the passage):**
      *   In direct speech: "The morning star is a planet."
          *   "Morning star" has its **customary sense** (the mode of presentation of Venus) and its **customary reference** (Venus itself).
      *   In singly oblique speech: "Kepler said *that the morning star is a planet*."
          *   The whole clause "that the morning star is a planet" designates its **customary sense** (the *thought* that Venus is a planet).
          *   Within this oblique context, "morning star" **does not** refer to Venus. Instead, it refers to its **customary sense** (the mode of presentation of Venus). Frege says this *is* its **indirect reference**.
          *   To *express* this indirect reference (i.e., the customary sense) within the oblique context, the word "morning star" must have a **new sense** – its **indirect sense**. This indirect sense is the mode of presentation *of* the customary sense of "morning star". Frege doesn't elaborate on the nature of this new sense in detail.

  2.  **The Problem in Double Embedding (Your Example):** "Galileo believed *that Kepler said that the morning star is a planet*."
      *   **Level 1 (Innermost):** Within "Kepler said that...", "morning star" has its **indirect reference** (its customary sense) and is expressed using its **indirect sense**.
      *   **Level 2 (Outermost):** The whole clause "that Kepler said that the morning star is a planet" is itself embedded within Galileo's belief report ("Galileo believed *that...*"). This makes the *outer* context oblique.
          *   According to Frege's rule, in this outer oblique context, the *embedded clause* ("that Kepler said...") must designate its **customary sense** (the *thought* that Kepler asserted the thought that Venus is a planet).
          *   **BUT:** For the *words within* that embedded clause (like "morning star") to contribute to forming this higher-level thought *about* Kepler's assertion, they cannot simply have their *customary* senses or references. They are *still* inside an oblique context (Galileo's belief), reporting *what Kepler said*.
          *   **The Regress:** To designate the *indirect reference* (i.e., the customary sense) of "morning star" *within* the inner clause *from the perspective of the outer clause*, the word "morning star" needs yet *another* sense – its **doubly indirect sense**. This doubly indirect sense would be the mode of presentation *of* the (singly) indirect sense of "morning star". And so on, *ad infinitum*.

  3.  **Is this a "Bullet" Frege Bites?**
      *   **In "On Sense and Reference":** Frege simply doesn't address the issue of multiple embeddings. He presents the single embedding case and stops. He doesn't acknowledge the regress.
      *   **Logical Consequence:** However, the mechanism he describes for single embedding *forces* this regress upon application to multiple embeddings. The shift in reference (and corresponding need for a new sense) happens *each time* a new oblique operator ("said that", "believes that", "hopes that") is applied. There's no natural stopping point in his theory.
      *   **Did Frege Intend/Accept This?** While he doesn't discuss it in *this* essay, evidence suggests he *was* aware of the need for hierarchy and *did* accept it as a consequence. In later writings (like his correspondence or the "Logical Investigations"), he hints at the need for a hierarchy of senses when dealing with indirect discourse about indirect discourse. He seems to have accepted it as a necessary, if ontologically extravagant, consequence of his commitment to the objectivity of thoughts and the strict compositionality of sense and reference.

  4.  **How Later Philosophers Sorted It Out:**
      *   **Alonzo Church (Logic of Sense and Denotation - 1951):** Church explicitly formalized Frege's theory, embracing the infinite hierarchy. He introduced a type-theoretic system where each new level of obliqueness requires a distinct *type* of sense (Sense₀, Sense₁, Sense₂, etc.). In Church's system, "morning star" in your double embedding would have a doubly indirect sense (Sense₂) referring to its singly indirect sense (Sense₁), which refers to its customary sense (Sense₀), which refers to Venus. This is the most direct Fregean resolution, accepting the regress as theoretically necessary.
      *   **Michael Dummett (Frege: Philosophy of Language - 1973):** Dummett provides the most influential analysis of this problem within Fregean scholarship. He argues:
          *   The hierarchy is an *inescapable consequence* of Frege's core doctrines (the shift in reference in obliquity, compositionality, the objectivity of thoughts).
          *   While Frege didn't explicitly discuss it in "On Sense and Reference," his overall framework commits him to it.
          *   Dummett considers this hierarchy a major *problem* for Frege's theory. He argues it renders language learning and communication implausible, as speakers would need to grasp infinitely many distinct senses for every word. He saw it as a significant motivation for exploring alternatives (like Davidson's paratactic analysis).
      *   **Alternative Approaches (Rejecting the Hierarchy):** Many later philosophers saw the infinite hierarchy as a *reductio ad absurdum* of Frege's strict account. This led to various alternative theories of propositional attitudes and indirect discourse that try to avoid the regress, such as:
          *   **Davidson's Paratactic Theory (1968):** "Galileo believed that Kepler said that p" is analyzed as two utterances: "Kepler said that" (demonstrating the next utterance) and "The morning star is a planet". This avoids positing indirect senses.
          *   **Possible Worlds Semantics:** Attitudes are relations to propositions (sets of possible worlds or structured intensions). While reference shifts might occur, it doesn't inherently generate a *hierarchy of senses* in the Fregean way.
          *   **Direct Reference/Causal Theories:** Names directly refer, and belief reports track relations to the referent under some guise/description, but without generating an infinite hierarchy of *senses* for the name itself.

  **Conclusion:**

  Yes, the infinite hierarchy of senses is a real and necessary consequence of Frege's theory as presented in "On Sense and Reference" when applied to multiply embedded attitude reports. While Frege doesn't flag it in that essay, it's widely recognized as a fundamental implication (or problem) of his framework. It's not that the regress "doesn't get going"; it logically *must* get going. Frege likely accepted this consequence, though he didn't elaborate on it in that specific text. Later philosophers, especially **Church** (who formalized and embraced the hierarchy) and **Dummett** (who analyzed it critically as a major flaw), definitively sorted it out and brought the issue to the forefront of philosophical discussion. Your seminar should be lively – this is exactly the kind of deep dive Frege invites!
