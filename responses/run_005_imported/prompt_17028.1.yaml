answer: |-
  ## The Great Conditional Schism: Why Your Roommate's "If" Isn't a Boolean Check (And What To Do About It)

  You've hit the linguistic jackpot – the Oswald/Kennedy pair is *the* classic example exposing the chasm between indicative and counterfactual conditionals. Your programmer's intuition is spot-on: natural language "if" is doing something radically more complex than a dumb boolean gate. It's not just checking a fact; it's navigating **epistemic landscapes** (what we know/believe about this world) and **modal realities** (what could be true in other possible worlds). Let's cut through the philosophy and settle this like engineers.

  ### The Contenders & Their Blueprints

  1.  **The Unified Camp (Lewis-Stalnaker Framework): One Engine, Two Gears**
      *   **Core Idea:** Both indicatives and counterfactuals share the *same fundamental logical structure*: **truth depends on the consequent holding in relevant possible worlds where the antecedent is true**. The difference is purely **pragmatic** – it depends on *which worlds* we consider relevant, governed by a **similarity metric**.
      *   **Mechanics:**
          *   **Possible Worlds:** Imagine a vast multiverse of slightly different versions of reality.
          *   **Similarity Metric:** Worlds are ordered by how "close" they are to the actual world (minimizing arbitrary changes).
          *   **Truth Condition:** "If A, (then) B" is true if, in the *closest possible world(s)* where A is true, B is also true.
      *   **The Gear Shift (Context):**
          *   **Indicative ("If Oswald didn't kill Kennedy, someone else did"):** We consider worlds *compatible with our current knowledge*. We know Kennedy was killed. The closest worlds where Oswald *didn't* do it are worlds where the actual killing still happened, so *someone else* must have done it. Hence, true.
          *   **Counterfactual ("If Oswald hadn't killed Kennedy, someone else would have"):** We consider worlds *where the antecedent is presumed false*. We know Oswald *did* kill Kennedy. The closest worlds where he *hadn't* involve backtracking: minimally changing history to prevent *his specific action*. In these closest worlds, the actual conspiracy/plan might not have included a ready backup assassin. The killing *might not have happened at all*. Hence, false.
      *   **Why They Believe:** It's elegant, parsimonious, and uses a single powerful tool (possible worlds + similarity) to handle both cases. The Oswald flip is explained by a *contextual shift* in which worlds are "in view," not a change in the underlying logic. Stalnaker specifically argued that the indicative/counterfactual distinction is pragmatic, not semantic.

  2.  **The Divergence Camp (Adams-Gibbard Probabilistic/Expressivist View): Two Separate Engines**
      *   **Core Idea:** Indicatives and counterfactuals are fundamentally different beasts requiring different semantic treatments.
          *   **Indicatives:** Do **not** have standard truth conditions. Instead, they express **conditional probabilities** or serve to **constrain rational belief**. Their "assertability" depends on the probability of B given A (`P(B|A)`).
          *   **Counterfactuals:** **Do** have truth conditions, best analyzed using **possible worlds semantics** (like Lewis/Stalnaker).
      *   **Mechanics:**
          *   **Indicative ("If Oswald didn't kill Kennedy, someone else did"):** This isn't *true* or *false* in the standard sense. Given our knowledge (Kennedy *was* killed), the probability that *someone else* did it, *given* that Oswald didn't (`P(Someone Else | ~Oswald)`), is effectively 1. It's highly assertable. Crucially, if we discover Oswald *did* do it, the indicative doesn't become *false*; it becomes **void** or **moot**. We just stop asserting it.
          *   **Counterfactual ("If Oswald hadn't killed Kennedy, someone else would have"):** This *is* true or false. We evaluate it by looking at the closest possible worlds where Oswald didn't pull the trigger (worlds where the shot missed, he chickened out, etc.). Do those worlds contain a backup assassin successfully killing Kennedy? If not (and we have no evidence there was a backup plan), the counterfactual is false.
      *   **The Triviality Result (Lewis's Bomb):** David Lewis proved a devastating formal result. If you try to assign standard truth values to indicative conditionals that obey intuitive probabilistic principles (like `P(If A, B) = P(B|A)`), and you assume this holds for *all* probability functions, the logic collapses. Specifically, it forces `P(B|A)` to always be either 0 or 1, meaning conditionals could only express certainty, not uncertainty. This is the "collapse" your roommate mentioned. It's a powerful argument *against* treating indicative conditionals as having standard truth conditions.
      *   **Why They Believe:** The Oswald flip *feels* like a deep difference. Indicatives seem tightly bound to our *current knowledge state* and uncertainty (`P(Someone Else | ~Oswald) ≈ 1`). Counterfactuals explicitly involve *imagining the world differently*. Lewis's triviality result is a formal proof that you *cannot* successfully mash them into a single truth-conditional framework without losing the ability to express uncertain conditionals.

  ### The Verdict: Divergence Wins (With a Nuanced Implementation)

  **After careful code review and load testing, the divergence architecture proves more robust.** Here's why, engineer-to-engineer:

  1.  **The Triviality Result is a Showstopper:** Lewis's proof is like discovering a fundamental mathematical incompatibility. Trying to force indicative conditionals into a standard truth-conditional box *guarantees* logical collapse under probabilistic constraints. This isn't a bug; it's a fatal design flaw in the unified truth-conditional approach for indicatives. You *need* a different semantic type for indicatives (like Adams' conditional probability/assertability).
  2.  **Epistemic vs. Modal Focus:** The Oswald examples scream this difference.
      *   The indicative ("If Oswald didn't... someone else **did**") is fundamentally about *epistemology* – reasoning *within* our knowledge of the actual world ("We know he was shot. Who was the shooter?").
      *   The counterfactual ("If Oswald hadn't... someone else **would have**") is fundamentally about *modality* – reasoning *about* non-actual possibilities ("What would the world have been like if this specific event changed?").
  3.  **Voidness vs. Falsity:** If we discover Oswald *did* kill Kennedy, the indicative "If Oswald didn't kill Kennedy, someone else did" doesn't become *false*; it becomes **pointless to assert**. We know the antecedent is false, so the conditional probability isn't defined or relevant. The counterfactual, however, *can* be evaluated as false based on our understanding of history and possible worlds.
  4.  **Counterfactuals Need Worlds:** While the unified view uses worlds for both, it struggles to *naturally* explain the radical shift in perspective for counterfactuals without effectively smuggling in a different mechanism via the similarity metric. The divergence view acknowledges this difference upfront: counterfactuals *require* possible worlds semantics to make sense of their truth conditions. Indicatives do not.

  ### The Design Decision: A Hybrid System

  Think of it like this:

  *   **Module 1: Indicative Conditionals (`if_ind.js`)**
      *   **Input:** Proposition `A`, Proposition `B`, Current Belief State/Probability Distribution.
      *   **Output:** **Assertability Score** (or `void` if `A` is known false).
      *   **Core Algorithm:** Calculate `P(B | A)`. High probability → High assertability. Low probability → Low assertability. `P(A) = 0` → `void`.
      *   **Handles:** Reasoning under uncertainty within the actual world's epistemic constraints. (Oswald Indicative: `P(Someone Else | ~Oswald) ≈ 1` → Highly assertable).

  *   **Module 2: Counterfactual Conditionals (`if_cf.js`)**
      *   **Input:** Proposition `A`, Proposition `B`, Context `C` (providing similarity metric).
      *   **Output:** **Truth Value** (`true`, `false`, or `indeterminate`).
      *   **Core Algorithm:**
          1.  Access the set of all possible worlds.
          2.  Filter to worlds most similar to actual world *except* `A` is true (minimizing gratuitous changes).
          3.  Check if `B` is true in *all* closest `A`-worlds → `true`.
          4.  Check if `B` is false in *all* closest `A`-worlds → `false`.
          5.  Otherwise → `indeterminate`.
      *   **Handles:** Evaluating what *would* have happened if things had been different. (Oswald Counterfactual: Closest `~Oswald-Kills` worlds lack a backup assassin → `false`).

  *   **API Gateway (`if.js`):**
      *   **Input:** Sentence containing "if...", Context (Tense, Mood, Knowledge State).
      *   **Routing Logic:**
          *   If context suggests the antecedent is **open** (possibly true, possibly false given current knowledge) → Route to `if_ind.js`.
          *   If context suggests the antecedent is **contrary-to-fact** (presumed false in actual world) → Route to `if_cf.js`.

  ### What It Depends On (The Context Parameters)

  The routing decision in the API Gateway depends critically on the **linguistic and conversational context**:

  1.  **Temporal/Mood Marking:** "Didn't/did" vs. "Hadn't/would have" is the primary syntactic signal.
  2.  **Speaker/Listener Presuppositions:** Does everyone involved assume the antecedent is false? (Counterfactual) Or is it an open question? (Indicative).
  3.  **Overall Discourse Purpose:** Is the goal to explore actual possibilities given uncertainty? (Indicative) Or to speculate about alternative histories? (Counterfactual).

  ### Conclusion

  Natural language "if" isn't a single boolean operator. It's an overloaded function dispatching to two fundamentally different semantic modules based on context. The **indicative conditional** (`if_ind`) is an engine for managing uncertainty and belief within the actual world, outputting assertability based on conditional probability. The **counterfactual conditional** (`if_cf`) is an engine for exploring non-actual possibilities, outputting truth values based on similarity across possible worlds. Lewis's triviality result proves these modules cannot be merged into a single truth-conditional unit without catastrophic failure. The unified Lewis-Stalnaker framework, while elegant and powerful for counterfactuals, ultimately fails to account for the probabilistic, non-truth-conditional nature of indicative conditionals revealed by Adams and the triviality result.

  So, tell your roommate: **Divergence is the way.** The Oswald flip isn't just a trick of grammar; it's a window into two distinct cognitive operations our language performs. We need separate semantic theories because we're dealing with two genuinely different beasts. Your boolean `if` is safe in its realm of bits; natural language `if` operates in the messy, probabilistic, and infinitely branching landscape of human knowledge and imagination.
