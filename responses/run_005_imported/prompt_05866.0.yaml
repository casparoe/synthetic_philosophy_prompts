prompt: |-
  My father was moved into the memory care wing of an assisted-living facility three months ago, and partly because of that I have just been asked to join the facility's newly formed technology ethics committee. Our first substantial case is a "preference-adaptive" companion robot the facility wants to pilot for residents with mild-to-moderate dementia. Rather than asking residents to rank activities, foods, or music directly -- something many of them can no longer do reliably -- the vendor fits a reward function to each resident using inverse reinforcement learning over logged behavior: how long a resident lingers at an activity, whether they finish a meal, when they turn away from a suggested game, and so on. That inferred reward function then drives what the robot offers going forward, and the vendor's pitch is that this "lets residents' own choices speak" more honestly than self-report ever could.

  One committee member with a machine-learning background raised something that has been nagging at me since: this is not simply an engineering wrinkle that more logging would smooth out. Any such procedure has to assume some model of how much apparent inconsistency in a resident's behavior counts as meaningful signal versus noise, and, depending on that assumption, quite different reward functions -- some crediting a resident with almost none of their apparent likes -- can rationalize the exact same behavioral record equally well. Whoever fixes that assumption is quietly deciding, on behalf of people who often can no longer tell us themselves, which of their reactions revealed what they actually want and which were just fatigue, confusion, or an artifact of the limited menu of options on offer in the first place.

  I have been asked to draft the position our committee will vote on ahead of the pilot's ninety-day review, and I would like your help with a first pass. Please write it as a short decision memo, addressed to colleagues who are not machine-learning specialists, recommending approve, reject, or approve-with-conditions. The memo should take the vendor's strongest argument seriously -- that some form of behavioral inference is plausibly better than the realistic alternatives on offer, such as a one-off intake questionnaire or staff intuition -- rather than dismissing it, while being precise about exactly where the technical assumptions inside the inference procedure are doing ethically consequential work that residents and their families never see and cannot contest. If you recommend approval, with or without conditions, specify what should be monitored, by whom, and what findings would justify revisiting the decision at the ninety-day mark.
reasoning: |-
  We are drafting a memo for a technology ethics committee, addressing a "preference-adaptive" companion robot that uses inverse reinforcement learning (IRL) to infer residents' preferences from behavior. The main ethical concern is that the IRL model requires assumptions about what constitutes signal vs. noise in behavior, and these assumptions can lead to very different reward functions without being visible or contestable by the residents or their families.

   The vendor's argument is that behavioral inference is better than alternatives (like intake questionnaires or staff intuition) for residents with dementia who may not reliably self-report.

   We must take this argument seriously but also be precise about the ethical risks.

   After analysis, I recommend **approval with conditions** because:

   1. The approach has merit in trying to capture preferences from behavior when self-report is unreliable.
   2. However, the ethical risks are significant and must be mitigated by transparency, monitoring, and family/resident involvement.

   Conditions for approval:

   - **Transparency and Consent**: The facility must clearly explain to residents and their families (as appropriate) how the system works, including that it makes assumptions about what behaviors are meaningful. This should be part of the consent process.

   - **Audit Trail**: The vendor must provide a way for the facility (or an independent auditor) to review the model's assumptions and the inferred reward functions. This includes documenting the model's choice of what counts as signal vs. noise and how that choice was made.

   - **Monitoring During Pilot**:
      a. **Family/Resident Feedback**: Regularly solicit feedback from families and residents (to the extent possible) about whether the robot's suggestions seem aligned with the resident's known preferences. This could be done by staff during family visits or scheduled check-ins.
      b. **Staff Oversight**: Staff should observe and log any instances where the robot's suggestions appear inconsistent with the resident's well-being or previously known preferences. They should have an override mechanism.
      c. **Technical Monitoring**: The committee (or a designated technical expert) should periodically review a sample of the inferred reward functions and the model's assumptions to ensure they are reasonable and consistent.

   - **Criteria for Revisiting at 90-Day Review**:
      The decision to continue, modify, or terminate the pilot should be based on:
      1. Evidence of harm or significant discomfort to residents (from staff logs or family reports).
      2. Consistent feedback from families or residents that the robot's suggestions are off-base.
      3. Technical review showing that the model's assumptions are leading to reward functions that contradict well-established preferences of the resident (where known) without justification.
      4. Lack of cooperation from the vendor in providing necessary transparency.

   Draft Memo:

  ---

  **MEMORANDUM**

  TO: Technology Ethics Committee Members  
  FROM: [Your Name], Committee Member  
  DATE: [Current Date]  
  SUBJECT: Recommendation for Pilot of Preference-Adaptive Companion Robot  

  ### Background
  The facility is considering a 90-day pilot of a "preference-adaptive" companion robot for residents with mild-to-moderate dementia. The robot uses inverse reinforcement learning (IRL) to infer a resident's preferences (reward function) from observed behavior (e.g., time spent at activities, meal completion, etc.) without requiring direct self-report. The vendor argues this approach better captures residents' true preferences than alternatives such as intake questionnaires or staff intuition, which can be unreliable for this population.

  ### Ethical Analysis
  We recognize the potential benefits of this technology, especially for residents who cannot reliably articulate preferences. However, the IRL method requires critical technical assumptions about which behaviors are meaningful (signal) versus noise (e.g., due to fatigue, confusion, or limited options). These assumptions, made by the vendor and embedded in the model, can lead to very different interpretations of the same behavior. Because they are not visible to residents or their families, and because residents may lack the capacity to contest them, these assumptions carry significant ethical weight. They effectively decide which of the resident's actions count as expressing their "true" preferences.

  ### Recommendation: Approve with Conditions
  We recommend approving the pilot with the following conditions to mitigate ethical risks:

  1. **Informed Consent Process**: The facility must develop a clear, accessible explanation for residents and their families about how the robot infers preferences, including the role of model assumptions. Families must have the opportunity to opt out or withdraw at any time.

  2. **Transparency and Auditability**: The vendor must provide:
     - Documentation of the model's assumptions about signal vs. noise and how they were chosen.
     - Access (for the committee or an independent expert) to review the inferred reward functions for a sample of residents during the pilot.

  3. **Monitoring Protocol**:
     - **Family/Resident Feedback**: The facility will schedule regular check-ins (e.g., bi-weekly) with families to discuss the robot's suggestions and any concerns. Residents will also be asked for feedback when possible.
     - **Staff Oversight**: Staff will log any observed mismatches between the robot's suggestions and the resident's reactions or known preferences. Staff must have the ability to override the robot's suggestions and report these overrides.
     - **Technical Review**: The committee will designate a member with machine-learning expertise to review a sample of the model's inferences and assumptions at the 30-day and 60-day marks.

  4. **Criteria for 90-Day Review**: The committee will reassess the pilot based on:
     - Evidence of resident harm, discomfort, or distress attributable to the robot.
     - Consistent reports from families, residents, or staff that the robot's suggestions are misaligned with resident preferences.
     - Technical reviews indicating that the model's assumptions are leading to reward functions that conflict with known resident preferences without clear behavioral justification.
     - The vendor's cooperation in providing necessary transparency and data.

  ### Conclusion
  This pilot offers a valuable opportunity to explore whether technology can help honor the preferences of residents with dementia. However, the ethical risks inherent in the inference process require careful safeguards. With the above conditions, we can proceed while ensuring resident well-being and autonomy remain central.

  We recommend a vote to approve the pilot with these conditions.

