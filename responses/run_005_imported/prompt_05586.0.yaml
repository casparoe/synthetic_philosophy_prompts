answer: |-
  Your struggle with Hume's "quantitative" paragraph is well-founded—it's a notoriously tricky passage that straddles intuitive reasoning and nascent probabilistic thinking, without fully committing to either. As a physicist, your instinct that it feels non-probabilistic and additive is spot on. Let's break down Hume's model, its context, and its tensions:

  1.  **The Literal Calculation: Additive "Net Evidence"**
      *   Hume explicitly states: "deduct the smaller number from the greater." He means simple subtraction of *counts* of experiences.
      *   Example: 100 experiences supporting Event A, 50 supporting Event B? Net evidence for A = 100 - 50 = 50.
      *   **Experiments = Observations:** You're correct; "experiments" here means individual instances of past experience ("opposite experiments" or "observations"), *not* controlled trials. Each experience is treated as a discrete unit of evidence.
      *   **Model:** Evidence is conceived as additive weights. Each confirming experience adds +1 "unit" of evidence; each disconfirming experience adds -1 (or subtracts 1). The "force of the superior evidence" is the net sum. This is fundamentally an *additive balancing scale* model.

  2.  **Why Additive? Context & Limitations:**
      *   **Pre-Probability Theory:** While probability was developing (e.g., Bernoulli, Bayes), Hume didn't have access to modern concepts like probability distributions, likelihood ratios, or Bayes' theorem. His model reflects a common-sense, pre-statistical intuition: more observations on one side should count *more*.
      *   **Empiricism's Foundation:** Hume grounds all belief in custom and habit formed by constant conjunction of experiences. The sheer *number* of consistent experiences directly builds the "full proof" of infallible experience. Contradictory experiences literally chip away at that proof by providing counter-instances. Subtraction captures this erosion.
      *   **Psychological Plausibility:** Additive counting aligns with a basic cognitive process – tallying pros and cons. It's easier to grasp intuitively than ratios for a general audience.

  3.  **Tensions and Limitations of the Additive Model:**
      *   **Ignores Base Rates/Sample Size:** Hume's model treats "100 vs 50" the same as "10 vs 5" – both yield a net of +50 or +5. But intuitively and probabilistically, the *certainty* derived from 100 consistent experiences and 50 counter is much higher than from 10 consistent and 5 counter. The additive model lacks a concept of total evidence or variance.
      *   **"Infallible Experience" is Fragile:** His "full proof" (net evidence >> 0) collapses dramatically with a single counter-instance (100 vs 1 becomes net +99). While he notes this weakens assurance, the additive jump from "absolute certainty" (net infinite?) to "pretty strong assurance" (net +99) is jarring. Probability handles this better via likelihood ratios or Bayesian updating, where a single strong counter-evidence can drastically reduce a high prior probability.
      *   **The "Proof against Proof" Problem:** This is the crux of your question. Later, discussing rival miracles, Hume argues the testimonies cancel out: "And as the evidences which attend each miracle are proofs against *each other*, and the superior evidence gives us an assurance suitable to its force, it is impossible that the miracles can retain any credibility." This *sounds* multiplicative ("proofs *against* proofs" implying a product or ratio), not additive.
      *   **Reconciling the Tension?** Hume likely shifts frameworks without realizing it:
          *   **For Empirical Evidence (the "wise man"):** He uses the additive count model. Conflicting observations *directly* about the same event (e.g., sunrise observed 100 times vs. not observed 1 time) are balanced by subtraction.
          *   **For Testimonial Evidence about Miracles:** He switches to comparing the *strength of proof*. The proof *for* a miracle (testimony) is weighed against the proof *against* it (the uniform experience of natural law). This proof *against* is effectively a prior probability so overwhelming that it requires an immense proof *for* to overcome. When *multiple* miracle claims exist (e.g., different religions), each claim's required proof *for* is immense. Since these proofs *for* are mutually exclusive (only one religion's miracles can be true), Hume argues they act as counter-proofs *against each other*. One testimony's strength doesn't *add* to disprove another; rather, their mutual exclusivity means the *existence* of rival claims undermines the *credibility* of any single one. It's less a calculation of net evidence and more a logical argument about the burden of proof and mutual contradiction. The language ("proof against proof") evokes a multiplicative cancellation of *credibility*, not an additive tally of experiences.

  4.  **Does it Hold Up?**
      *   **As a Descriptive Model of Naive Reasoning:** Yes, the additive tally captures a common intuition. We often count arguments for and against.
      *   **As a Normative Model for Rational Belief:** **No, not rigorously.** The limitations are severe:
          *   **Ignores Strength of Evidence:** Not all experiences/testimonies are equally reliable. Hume acknowledges testimony strength varies elsewhere, but his "deduct" model doesn't incorporate it.
          *   **Ignores Prior Probability:** The net evidence count lacks an anchor. Is net +50 strong evidence that water boils at 90°C (contradicting vast prior experience) or that a slightly biased coin lands heads (mild prior uncertainty)? Additive counts alone can't distinguish.
          *   **Poor Handling of Uncertainty:** It struggles with degrees of belief between 0 and 1, especially near certainty.
          *   **Sample Size Neglect:** As noted, net +5 from 10 vs 5 is treated the same as net +5 from 1000 vs 995, which is irrational.
      *   **Hume's Core Insight Endures:** Despite the flawed quantitative model, Hume's *qualitative* point in the "miracles" section remains powerful: Extraordinary claims (violations of uniform, overwhelming past experience) require extraordinary evidence (testimony of surpassing reliability and consistency). The additive model was his attempt to *illustrate* the weighing process underlying this principle for the "wise man" dealing with ordinary empirical uncertainty. The later "proof against proof" argument relies on the *qualitative* strength of the proof *against* miracles (natural law) rather than the additive count.

  **In Conclusion:**

  Hume, in the "wise man" paragraph, is indeed proposing a genuinely **additive, non-probabilistic (in the modern sense) model of evidential weight based on simple subtraction of counts of experiences ("experiments" as observations).** This model reflects the empiricist foundation of belief and the intuitive process of tallying evidence. However, it is simplistic and suffers from significant flaws, particularly neglecting prior probability, varying evidence strength, and sample size effects.

  The tension with the later "proof against proof" language arises because Hume shifts context. When discussing *empirical* evidence for/against a single event, he uses the additive model. When discussing *testimonial* evidence for *mutually exclusive miraculous claims*, he shifts to arguing about the *mutual undermining* of credibility due to the immense prior probability (proof) *against* *any* miracle and the logical incompatibility of the claims. The "proof against proof" language suggests a multiplicative cancellation of *credibility*, not the additive balancing of *observation counts*. While the core insight about weighing evidence remains, his specific quantitative model in the "wise man" paragraph does not hold up as a rigorous normative theory of rational belief formation by modern (post-Bayesian) standards. It's best understood as a historically situated, intuitive illustration of his empiricist epistemology rather than a precise calculus. Your physicist's intuition that it feels "off" compared to modern probabilistic reasoning is entirely correct.
