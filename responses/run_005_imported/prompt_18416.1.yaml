answer: |-
  Here's a dialogue between H.L.A. Hart and Lon Fuller, wrestling with the Grudge Informer case and its implications for the Berlin Wall guards, pushing each other beyond initial positions and confronting the uncomfortable consequences of their theories:

  **Setting:** A spartan faculty lounge, shortly after a lecture on the Hart-Fuller debate. Coffee cups sit untouched.

  **Characters:**
  *   **H.L.A. Hart (H):** Calm, analytical, focused on clarity and the separation of law and morality as distinct concepts.
  *   **Lon Fuller (F):** Intense, morally engaged, convinced that law has an inherent "inner morality" necessary for it to *be* law.

  **(The dialogue begins mid-argument)**

  **F:** ...Hart, you miss the *essence* of the problem entirely! This woman denounced her husband under a Nazi statute for criticizing Hitler – a statute enacted specifically to terrorize, applied arbitrarily by kangaroo courts, and utterly divorced from any notion of fairness. Calling that "law" dignifies tyranny! My eight desiderata aren't just a wishlist; they are the *procedural morality* that makes rule *by* law possible. A purported "law" that is secret, retroactive, contradictory, impossible to follow, or applied capriciously *fails as law*. It lacks the minimal moral character required for legal validity. The Nazi statute here wasn't merely wicked; it was *legally* defective at its core.

  **H:** Lon, your passion is admirable, but your logic conflates two distinct inquiries. Firstly: *Was there a valid law in force in Nazi Germany at the time?* The sociological answer is yes. The Nazi regime effectively controlled the state apparatus. Courts applied the statute. Citizens, tragically, knew they *could* be punished under it. It functioned as law within that system, however repugnant. Secondly: *Ought this woman to be punished now?* That is a separate, profoundly moral and political question. To say the statute wasn't "law" back then is simply false description. It *was* the operative rule. Punishing her now requires acknowledging that past validity but morally overriding it – hence, a *new*, retrospective statute explicitly criminalizing such acts under the old regime is the honest, clear path. Your approach risks judicial legislation cloaked as discovering the law was never there.

  **F:** Honest? Clear? You propose the new West German court should *create* a retroactive crime! That violates the very first principle of the inner morality – prospectivity! It treats citizens as playthings of the state, punishing them for acts legal when committed. *Your* approach sanctions the ultimate legal vice: retroactivity. How does *that* uphold the Rule of Law? It merely replaces one form of arbitrariness with another!

  **H:** A necessary evil, Lon, to confront a greater one. My point is precisely to *avoid* the ambiguity and potential for arbitrary judicial power your theory invites. By admitting the Nazi rule *was* law, we face the moral dilemma squarely: We are choosing *now* to punish someone for an act we deem monstrous, even if it was technically legal then. We legislate that moral judgment retroactively, openly, democratically. Your theory, by declaring the old rule "not law," allows a judge to pretend they are merely applying *existing* legal principles – discovering that the informer's act was *always* criminal under some higher, unwritten "true law." That's far more dangerous! It makes law unpredictable and places immense, potentially unchecked, moral authority in the judiciary. Where is *your* Rule of Law then?

  **F:** It resides in the judge recognizing that a system utterly devoid of congruence between declared rules and official action, that encourages secret denunciations (violating promulgation!), that applies rules based on political whim rather than generality, is not a *legal* system at all. It's institutionalized banditry wearing a judge's robe. The court isn't applying a "higher law"; it's recognizing that the purported "statute" failed the minimum tests to *be* law. Therefore, there was no valid legal command shielding the informer. She can be judged under the *actual* fundamental legal principles that persisted – like the prohibition against murder – which the Nazi perversion couldn't extinguish. No retroactivity needed; just the reassertion of basic legal order.

  **H:** "Basic legal order"? Whose? The Weimar Republic's? Pre-Nazi German common law? Natural law? Your "persistent principles" are precisely the unwritten, contested moral notions I warn against elevating above positive law! Judges deciding *which* historical principles persist and override enacted statutes is the very definition of arbitrary judicial power in this context. My retroactive statute, however distasteful, is at least an act of the *democratic legislature* taking responsibility for the moral choice.

  **F:** And what of the citizen caught within the tyranny? Under your view, if the sovereign says it's law, it *is* law, full stop. The guard following orders, the informer filing the report – they are merely conforming to valid legal commands. Their moral culpability is entirely separate. But law *cannot* function if it demands citizens abandon all moral sense! Your separation is too clean, Hart. The inner morality *connects* the legal and the moral at the procedural level. A citizen confronting a "law" that is secret, retroactive, or impossible to obey isn't facing a legal obligation; they are facing brute force disguised as law. They retain a moral (and I argue, legal) right to resist *because* the command lacks legal validity.

  **H:** That's a perilous doctrine, Lon! It invites anarchy. Every citizen becomes their own judge of a law's "inner morality." Who decides if a law is sufficiently "general" or "non-contradictory" enough to count? You risk dissolving law into subjective morality. My separation provides clarity: This is the law (sociological fact). This is what we, morally, demand now (political choice). We change the law prospectively, or, in extreme cases like this, legislate retroactively to correct a past injustice, accepting the burden that entails.

  **F:** And what of the border guards, Hart? Those East Germans who shot escapees at the Wall? Let's apply *your* logic consistently. East Germany had enacted statutes, published orders, a functioning court system. The guards were following "valid law" within their system, yes? Under your strict separation, their defence is strong: "I followed the law of my land." To punish them, West Germany *must* pass a retroactive statute criminalizing acts that were legal under GDR law. Is that what justice demands? Or does it merely perpetuate the cycle of state power overriding individual morality with retrospective force?

  **H:** (Sighs heavily) It is the *consequence* of my position, yes. If the GDR statutes were valid law within that system – and sociologically, they were enforced and recognized internally – then simply applying *West* German law retroactively to acts committed under a different sovereign's valid law is problematic. It would require a clear, new legal basis established by the reunified German state – perhaps grounded in international human rights law deemed superior, or a specific retroactive statute acknowledging the unique context. It’s messy, legally fraught, but necessary for clarity. Punishment cannot be based *solely* on the moral revulsion of the new regime; it needs a legal anchor, even if retroactive. The alternative is victor's justice disguised as legal reasoning.

  **F:** And under *my* logic? The GDR's border regime systematically violated the inner morality of law. Orders to shoot were often secret, unwritten, or contradictory to published statutes (which sometimes suggested proportionality). The rules were not "promulgated" clearly to the victims – how could an escapee know the exact lethal force policy? The system lacked "congruence" – the published ideals of socialism bore no relation to the brutal reality at the Wall. The rules weren't "general" – they created a special, lethal status for a specific act (escaping) without due process. It was institutionalized arbitrariness. Therefore, those "laws" and "orders" *lacked legal validity*. The guard cannot hide behind a non-existent legal shield. He can be tried under the fundamental, persistent principles of law – like the prohibition against arbitrary deprivation of life – that the GDR apparatus, by its own procedural immorality, failed to validly override. No retroactivity is needed, only the recognition that true law, with its inherent moral structure, never sanctioned murder at the Wall.

  **H:** So you place the burden on the lowly guard to discern the complex "inner morality" of the entire GDR legal system in the heat of the moment? To decide that his commander's order lacks legal validity? That seems impossibly demanding, Lon. It risks condemning individuals for failing a philosophical test under duress.

  **F:** And you risk absolving them by reducing law to the mere command of the sovereign, however procedurally bankrupt. The guard *knew* he was shooting an unarmed human being trying to escape an oppressive state. The inner morality isn't an esoteric secret; its absence manifests as palpable injustice and arbitrariness. The law's failure wasn't hidden; it was the foundation of the Wall itself. My approach doesn't guarantee an easy answer for every guard – context, coercion, knowledge matter – but it denies the *automatic* defence of "valid law." It forces us to confront the moral vacuum they served, a vacuum created by the system's abandonment of law's essential character.

  **H:** And my approach forces us to confront the uncomfortable truth that law, as a social tool, can be horrifically wicked, and that justice after the fact sometimes requires the state to openly shoulder the burden of retroactive correction, rather than pretending the wickedness wasn't legally sanctioned at the time. Neither path is clean, Lon. The grudge informer and the border guard stand at the crossroads, reminding us that law alone cannot save us from ourselves.

  **(Both fall silent, the weight of the implications – for philosophy, for history, and for the individuals caught in the gears of unjust systems – hanging heavy in the air.)**

  **Key Implications Summarized:**

  *   **Fuller:** East German border laws likely violated the "inner morality" (procedural principles like promulgation, generality, congruence, non-retroactivity). Therefore, they weren't valid law. Guards cannot claim a legal defense based on invalid "law." Their culpability rests on violating fundamental, persistent legal/moral principles (prohibition on murder).
  *   **Hart:** East German laws were sociologically valid within that system. Guards *were* following "valid law" at the time. To punish them justly *now*, the reunified Germany needs a new legal basis – likely a carefully crafted retroactive statute or application of superior international law – acknowledging the past legality but morally overriding it. The "just following orders" defense has weight unless explicitly negated by new law.
