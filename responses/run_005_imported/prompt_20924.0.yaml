answer: |-
  You're absolutely right to call out the "sunk cost fallacy" explanation as insufficient for the dollar auction (and your situation). While sunk costs *feel* real psychologically, the *strategic trap* arises from the **unique payoff structure combined with incomplete information**, even for rational players. Here's the breakdown of the mechanics:

  **1. The Dollar Auction Setup & Payoffs:**

  *   A dollar is auctioned.
  *   **Bids increase in fixed increments** (e.g., $0.05, $0.10).
  *   **Crucial Rule:** The *highest bidder* wins the dollar but **pays their bid**. The *second-highest bidder* wins **nothing** but **also pays their last bid**.
  *   **Payoffs:**
      *   **Winner:** $1.00 - (Winning Bid)
      *   **Loser (2nd place):** $0.00 - (Losing Bid) = -(Losing Bid)
      *   **Non-bidders:** $0.00

  **2. The Escalation Mechanism: Why Bidding *Can* Be Rational Step-by-Step**

  Imagine the bidding is at $0.60, and Player A just bid it. Player B is the previous high bidder at $0.55 (now the *current* second-highest/losing bidder).

  *   **Player B's Situation:**
      *   If B **drops out now:**
          *   Payoff = -$0.55 (Loses, pays bid)
      *   If B **bids $0.65:**
          *   Becomes the *new* high bidder at $0.65.
          *   Player A is now the *new* second-highest/losing bidder at $0.60.
          *   B's *potential* payoff if A drops out: $1.00 - $0.65 = **$0.35**
          *   B's *potential* payoff if A bids again: They are now in the same position A was just in, facing a loss.

  *   **Player B's Rational Calculation:**
      *   "If I drop out, I lose $0.55 **for sure**."
      *   "If I bid $0.65, I *might* win the dollar for a net gain of $0.35 *if A drops out*. Even if A bids again, I *might* get them to drop out later. **Crucially, by bidding, I give myself a *chance* to avoid the *certain* loss of $0.55.**"
      *   The **certain loss** of dropping out immediately (-$0.55) feels worse than the **potential loss/gain** of bidding again (-$0.65 if outbid later, +$0.35 if win now, or break-even/win later). *As long as Player B believes there's a chance Player A will drop out after the next bid*, bidding $0.65 looks better than the guaranteed loss of $0.55.

  *   **Player A's Situation (After B bids $0.65):**
      *   Now A is the one facing a *certain* loss of $0.60 if they drop out. The same logic applies: "Do I accept a $0.60 loss, or bid $0.70 for a *chance* to win ($1.00 - $0.70 = $0.30) *and* avoid that certain loss?" The calculation repeats.

  **3. The Trap: The Asymmetric Payoff Structure**

  The core of the trap is the **asymmetry**:
  *   The **current leader** (highest bidder) stands to make a **profit** ($1.00 - Their Bid) if the other drops out *now*. They are motivated to stay in to *realize* that potential profit.
  *   The **current follower** (second-highest/losing bidder) faces a **certain loss** if they drop out *now*. They are motivated to bid again *to avoid that certain loss and potentially become the leader*.

  **This creates a vicious cycle:** Each new bid by the follower *immediately* imposes a certain loss on the *previous* leader, turning them into the new follower who then faces the same dilemma. Bidding seems rational at each step to avoid the immediate, certain loss imposed by the other player's last bid.

  **4. The Role of Common Knowledge and Limits (The Theoretical Escape)**

  You're correct about the theoretical solution with common knowledge. Assume:
  1.  Both players are perfectly rational.
  2.  Both players know each other's *maximum possible bid* (their "budget" or "limit" - L_A and L_B).
  3.  This knowledge is **common knowledge** (I know you know I know... etc.).

  *   **The Rational Outcome:** The player with the *lower* maximum bid should drop out *immediately*, and the other player should bid just $0.05 (or the minimum increment) to win. **No escalation occurs.**
  *   **Why? Backward Induction:** Imagine Player A knows Player B's max bid L_B is $0.90, and Player B knows Player A's max bid L_A is $0.95. Both know the other knows, etc.
      *   Player B thinks: "A can always outbid me since L_A ($0.95) > L_B ($0.90). If I ever bid, say $0.85, A can bid $0.90. I then face a choice: drop out and lose $0.85, or bid $0.95 (my max). But if I bid $0.95, A can still bid $0.96 (if increments allow) or just let me win. If I win at $0.95, I get $1 - $0.95 = $0.05. But A, knowing I'll do this, would bid $0.90 *before* I get to $0.85, forcing me to lose $0.85 or bid $0.95 for a tiny $0.05 profit. However, A also knows that if they let the bidding start, *they* might end up losing a lot. The *only* way to avoid massive losses is to not start bidding at all, or for the weaker player (B) to concede immediately. Rational players foresee this mutually destructive path and avoid it entirely. The player with the lower limit knows they will eventually lose and pay a high price, so they never bid."

  **5. The Real-World Trap: Incomplete Information**

  This is the key to why your situation (and most real dollar auctions) happen:

  *   **Unknown Limits:** Players do **not** know each other's true maximum spending limit (L_A, L_B). This is **incomplete information**.
  *   **No Common Knowledge:** Even if you suspect your sister's limit, you don't *know* she knows your limit, and she doesn't know you know hers, etc. Common knowledge fails.
  *   **The Result:** Players must *estimate* the other's limit based on bids and behavior. At *every* step:
      *   The follower thinks: "Maybe *this* bid is close to their limit. If I bid just a little more, they might drop out, letting me win and avoid my current certain loss. My potential gain (or reduced loss) is worth the risk."
      *   The leader thinks: "I'm so close to winning! If they drop out now, I make a profit. I just need to hold on a little longer. Surely they won't bid *again*?"
  *   **Escalation:** Each bid signals commitment and potentially revises the estimate of the other's limit upwards ("They bid $X, so they *must* be willing to go higher!"). This continues until one player hits their *actual* limit and drops out, often after both have bid far beyond the prize value.

  **Conclusion: The Mechanics of the Trap**

  1.  **Payoff Structure is Fundamental:** The rule forcing the *loser* to pay creates the asymmetric incentive. The follower faces a **certain, immediate loss** if they drop out, versus a **potential gain (or chance to pass the loss back)** if they bid. This makes bidding rational *in the moment*.
  2.  **Incomplete Information is the Catalyst:** Without knowing the other's limit, players rationally gamble that the *next* bid might be the one that makes the other player drop out, saving them from their current certain loss and potentially yielding a profit. They update their beliefs about the opponent's limit based on observed bids.
  3.  **Common Knowledge is the Escape Hatch (Theoretically):** Only with perfect, common knowledge of limits can fully rational players avoid the trap entirely through foresight (backward induction). The weaker player concedes immediately.
  4.  **Sunk Costs are the Symptom, Not the Cause:** The money already spent *creates* the current certain loss the follower faces, making the decision to bid again seem compelling. But the *mechanism* locking players in is the strategic interaction defined by the payoff rules and the uncertainty about the opponent's resolve.

  **In your case:** You and your sister are both in the position of the "follower" at different times, facing the certain loss of your *already-spent* legal fees if you drop out *now*. Bidding (continuing the legal fight) seems rational because it offers a *chance* to win the house and avoid that loss (or even come out ahead net). The lack of common knowledge about each other's true financial/emotional breaking point fuels the escalation. Recognizing this trap is the first step toward finding a face-saving off-ramp (mediation, splitting the asset, agreeing to sell and split proceeds minus *future* fees). Good luck – breaking out requires changing the perceived payoffs or establishing credible commitment about limits.
