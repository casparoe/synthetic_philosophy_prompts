  ### Justification for Each Move  
  1. **Maya (Score: 2)**  
     Maya is clearly right. The project's goal is to extract a *runnable* rescheduling suggestion, and a non-constructive proof by contradiction provides no witness (i.e., no specific job to reschedule). Her objection highlights a practical gap between mathematical validity and engineering utility.  

  2. **Owen (Score: -1)**  
     Owen is technically correct that the classical proof verifies the theorem’s truth, but he mistakes the project’s requirements for "tooling." The team needs an *actionable* output (a job to reschedule), not just truth. His reply dismisses the core need for witness extraction, making it partially mistaken.  

  3. **Maya (Score: 2)**  
     Maya is unequivocally right. Constructive proofs guarantee a witness via proof objects (e.g., dependent types in Lean), enabling code extraction. Classical proofs only assert existence without a computational path. This gap directly impacts their codebase’s ability to synthesize executable logic.  

  4. **Owen (Score: 1)**  
     Owen is partially right but misses the point. For finite batches, brute-forcing *is* possible, but:  
     - It’s inefficient (O(n) time vs. potential O(1) from a constructive witness).  
     - It decouples the proof from the algorithm, violating the project’s "proofs-as-code" ethos.  
     His point mitigates disaster but ignores elegance and future scalability.  

  5. **Maya (Score: 2)**  
     Maya is clearly right. Conceding recoverability for finite cases strengthens her argument: a constructive proof *now* avoids technical debt when scaling to unbounded streams (where brute-forcing is impossible). This foresight is essential for maintainability.  

  ---

  ### Principled General Rule  
  **When the distinction has teeth (practical impact):**  
  - **Teeth exist** when:  
    - You need to **extract executable code** from proofs (e.g., rescheduling logic).  
    - The domain is **infinite or too large for brute force** (e.g., streaming jobs).  
    - You require **algorithmic efficiency** (constructive proofs often imply optimal witnesses).  
    - Proofs must serve as **direct specifications for implementation**.  
    *Example:* Unbounded schedulers, cryptography (witnesses = keys), real-time systems.  

  **When it’s academic bookkeeping:**  
  - **No teeth** when:  
    - The domain is **small, finite, and brute-forcible** (e.g., tiny job batches).  
    - You only care about **truth validation**, not code generation.  
    - Witnesses can be **found post-hoc** without proof guidance.  
    *Example:* One-off verification of decidable properties on fixed-size inputs.  

  **Who missed the rule?**  
  - **Owen** missed that "finite brute force" is a band-aid: it fails for unbounded cases (which Maya foresaw) and ignores Lean’s capability to *unify* proofs and code.  
  - **Maya** correctly applied the rule but could have emphasized that even finite cases benefit from constructive witnesses (e.g., cleaner code, no redundant checks).  

  **Conclusion:** Maya wins the debate. The constructive approach is essential for their project’s goals—especially scalability—while Owen’s defense is contextually myopic. Redoing the proof constructively is warranted.
