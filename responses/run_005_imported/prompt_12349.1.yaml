  Lewis's triviality result shows that equating P(if A, B) with P(B|A) leads to triviality. But did Ramsey see conditionals as truth-apt? In "General Propositions," he suggested that conditionals aren't propositions with truth values but rules for belief updating. That's crucial. If conditionals don't express propositions, Lewis's proof might not apply directly because it assumes conditionals have probabilities as propositions.

