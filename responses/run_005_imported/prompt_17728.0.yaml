  I’m wary of clichés. Instead of "opposites attract," I’ll highlight how their conflict generates warmth. The vow analysis is key: it’s a virtue ethicist’s promise made situationally possible by mutual commitment. That’s the moving part—not winner-takes-all, but interdependence. 

