  So this is going to sound like a dumb question but I promise there's a real gap in my understanding here and not just laziness. I'm a second-year in the philosophy PhD program and this semester's metaphysics seminar spent two weeks on time travel, so I've basically got David Lewis's "The Paradoxes of Time Travel" memorized at the level of vocabulary -- personal time vs external time, compossibility, Tim and Grandfather, all of it -- but I don't think I've actually internalized WHY his resolution works, as opposed to just being able to recite it back in section. Everyone (me included) says "the grandfather paradox doesn't show time travel is impossible, it just shows Tim can't actually kill Grandfather" and leaves it there like that's obviously satisfying. Then my roomate, who is not a philosopher, pushed back on this over dinner last week and asked "ok but why couldn't he, if he's got the gun and a clear shot and the will to do it," and I realized I was basically just repeating jargon back at her instead of explaining anything.

  Could you actually walk me through the mechanics of Lewis's move here -- specifically what work the word "can" is doing for him, and why he thinks there's a perfectly good sense in which Tim both can and cannot kill Grandfather without that being a flat contradiction? I get that it has something to do with which set of facts you hold fixed when you evaluate an ability claim, and that it's supposed to be modeled on compatibilist moves about "can" elsewhere (free will type stuff), but I want the actual intuition for why that's the right way to carve up the problem, rather than it just feeling like Lewis is dissolving the paradox by stipulation. If a cleaner toy example than Tim and Grandfather isolates the logical structure better, feel free to use that instead.
