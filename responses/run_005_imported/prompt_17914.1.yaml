answer: |-
  You've hit on a brilliant point – Lewis's move *feels* like stipulation until you grasp the specific, powerful work the word "can" is doing and *why* it needs to do that work. It's not dumb; it's the core of his resolution. Let's ditch Tim for a second and use a cleaner toy example to isolate the logic before returning to Grandfather.

  **The Toy Example: The Bomb That Didn't Go Off**

  1.  **The Setup:** Imagine a perfectly functional bomb sitting in an empty room yesterday. It has all its wiring intact, the timer works, the explosive is stable but potent. At 2:00 PM yesterday, I pressed the detonate button.
  2.  **The Fact:** The bomb did *not* explode yesterday.
  3.  **The Question:** *Could* the bomb have exploded yesterday? Could *I* have exploded it?

  **Intuitive Tension (The Paradox Feel):**

  *   **Local Ability/Context:** Given just the state of the bomb *at the moment I pressed the button* – its wiring, its explosive nature, the button being pressed – it seems overwhelmingly obvious that it **could** have exploded. All the necessary local conditions were satisfied. It had the *capacity*, the *opportunity*, and the *trigger*.
  *   **Global Fact:** Yet, we know the bomb **did not** explode. This is a fixed fact about the actual world.

  **Lewis's Move: Contextualizing "Can"**

  Lewis argues the tension arises because we're using "could" in two subtly different senses, and we need to be explicit about **which facts we're holding fixed** when we evaluate the claim "X could have happened."

  1.  **"Can" Relative to Local Facts (Ability/Opportunity):**
      *   **What's fixed:** The intrinsic properties of the objects involved and the immediate circumstances *at the specific time and place* of the attempted action. (The bomb's wiring, explosive material, button being pressed at 2:00 PM).
      *   **What's *not* fixed:** Broader facts about the world's history or future, *especially* the fact that the event in question didn't actually happen.
      *   **Conclusion:** Relative to *these* fixed facts, the bomb **could** have exploded. It had the local ability and opportunity. I **could** have exploded it *in this specific sense*.

  2.  **"Can" Relative to Global Facts (Compossibility):**
      *   **What's fixed:** A broader set of facts about the actual world. Crucially, **we fix the fact that the bomb did not explode yesterday.** We might also fix other major facts depending on context (e.g., the laws of physics, the existence of the room, my existence yesterday).
      *   **What's *not* fixed:** The specific local state *at the exact moment* (we can imagine it being slightly different while holding the global fact fixed).
      *   **Conclusion:** Relative to *these* fixed facts (especially the fact of non-explosion), the bomb **could not** have exploded yesterday. Why? Because *given* that it didn't explode, any scenario where it *does* explode is a scenario that contradicts the fixed global fact we started with. It's **incompossible** with the fixed fact of non-explosion. I **could not** have exploded it *in this specific sense*.

  **Why This Isn't Stipulation (The Intuition Pump):**

  *   **"Could" is always relative.** We never mean "could" in some absolute, context-free vacuum. We always implicitly hold *some* facts about the world fixed when making ability or possibility claims. Lewis is just making these implicit background assumptions explicit.
  *   **The Global sense is fundamental to understanding actuality.** If we *didn't* hold the actual outcome fixed when asking "could it have happened?" in the global sense, we'd lose the ability to talk meaningfully about what *is* possible *given* what actually *is*. The global sense tells us what is consistent with the actual world's core truths.
  *   **The Local sense is fundamental to understanding agency and capacity.** If we *always* held the actual outcome fixed, we could never say an agent had the ability to do something they didn't actually do ("I could have taken the bus, but I walked"). The local sense isolates capacity from actual result.
  *   **Contradiction Avoidance:** The apparent contradiction ("It could and it couldn't!") vanishes when we realize the two "coulds" have different meanings defined by different sets of fixed facts. It's like saying "This object is large (compared to a mouse) and small (compared to an elephant)" – no contradiction, just different contexts.

  **Applying it to Tim and Grandfather:**

  1.  **Local "Can" (Ability/Opportunity):**
      *   **Fixed:** Tim's physical and mental state at the scene (he's healthy, determined, knows how to shoot), the gun's functionality, Grandfather's vulnerability, the clear line of sight, the lack of immediate intervention *at that specific external time and place*.
      *   **Not Fixed:** The fact that Grandfather wasn't killed then (obviously!), the fact Tim exists later to travel back.
      *   **Conclusion:** Relative to *these* fixed facts, Tim **can** kill Grandfather. He has the local ability and opportunity. This is the sense in which we say "He *can* pull the trigger."

  2.  **Global "Can" (Compossibility):**
      *   **Fixed:** Key facts about the actual world's history and Tim's existence: **Grandfather was not killed before father was conceived, Tim was born, Tim exists at the later time when he builds/uses the time machine.** We also fix the laws of physics (including the consistency of the time travel mechanism).
      *   **Not Fixed:** The specific details of the local scene *if* they are incompatible with the fixed global facts (e.g., we *can't* hold fixed Tim's perfect aim *and* the clear shot *while also* holding fixed Grandfather's survival, if those are incompatible).
      *   **Conclusion:** Relative to *these* fixed facts (especially Grandfather's survival and Tim's existence), Tim **cannot** kill Grandfather. Why? Because *given* that Grandfather survived to sire Tim's parent, and Tim exists to travel back, any scenario where Tim *succeeds* in killing Grandfather is a scenario that contradicts these fixed global facts. Success is **incompossible** with Tim's existence and the actual history. He **cannot** succeed *in this specific sense*.

  **Why Lewis Thinks This is Satisfying (The Resolution):**

  1.  **Dissolves the Contradiction:** The paradox claimed "Time travel implies Tim both can and cannot kill Grandfather, which is a contradiction, so time travel is impossible." Lewis shows the "can" and "cannot" are not applied in the same sense/context. There's no single, unified sense in which Tim both can and cannot succeed.
  2.  **Explains Tim's Failure:** It explains *why* Tim fails. It's not because of a miraculous gust of wind, a jammed gun, or a sudden loss of nerve *as ad-hoc interventions*. It's because **success is logically impossible** relative to the fixed global facts of Tim's existence and Grandfather's survival. *Whatever* happens at the scene (jammed gun, sudden change of heart, slipping on a banana peel, quantum fluctuation), it *must* be something that prevents success, precisely because success is incompossible with the fixed global facts. The failure is guaranteed by logic, not by contingent physics or psychology (though it manifests through them).
  3.  **Preserves Coherence of Time Travel:** This shows the Grandfather Paradox isn't an argument *against the possibility* of time travel itself. It only shows that *if* time travel occurs, then *certain specific events* (like a successful grandfather killing by the time traveler) are logically impossible *relative to the time traveler's existence*. Time travel scenarios involving consistent, non-paradoxical events (e.g., Tim fails, or Tim shoots but only wounds Grandfather, or Tim goes back and anonymously saves Grandfather from an unrelated accident) remain logically possible.

  **Answering Your Roommate:**

  "Okay, standing right there in 1921, with the gun working, Grandfather unsuspecting, and Tim determined? Yeah, in *that specific moment*, with just those facts, he absolutely *can* pull the trigger and aim to kill. He has the ability and the chance. *But* – and this is the crucial bit – because we *know* Tim exists in the future to make this trip, and we *know* Grandfather lived long enough to have kids, we *also* know that somehow, for some reason *in that very moment*, he *won't* succeed. The logic of the situation – his own existence – guarantees something will prevent success, whether it's the gun jamming, him missing, or changing his mind. So, he *can* try (local ability), but he logically *cannot* succeed (global compossibility). The 'can' and 'cannot' are answering slightly different questions about possibility."

  **In Essence:** Lewis's genius is recognizing that "can" is context-sensitive. He carves the problem by showing that the paradox exploits an ambiguity in this context-sensitivity. Resolving the ambiguity by explicitly defining the relevant contexts (local ability vs. global compossibility) reveals that the time travel scenario is consistent: Tim *can* try (local ability), but he *cannot* succeed (global compossibility), and there's no contradiction because these are different senses of "can." The intuition comes from recognizing how we *already* use "can" in these different ways in non-time-travel contexts (like the bomb example). Lewis provides the framework to apply this consistently to the mind-bending case of time travel.
