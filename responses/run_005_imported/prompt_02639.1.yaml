prompt: |-
  I'm doing RCIA right now (finally getting confirmed after being a lapsed cradle Catholic for like a decade), and a few weeks ago at the coffee-and-donuts thing after class, my sponsor and the parish's associate pastor got into an actual argument about free will and grace. My sponsor is very old-school, reads a ton of Garrigou-Lagrange, and kept going on about how God moves the will through something called "physical premotion" — basically that God has to actually cause the will's act itself, or grace isn't really efficacious. The associate pastor did his formation with the Jesuits though, and pushed back hard with the whole Molina/middle knowledge thing: that God just knows, via "simultaneous concurrence" or whatever it's called, how any possible person would freely act in any possible situation, and providentially sets up the circumstances accordingly, no predetermining required. It got kind of heated — my sponsor accused Molinism of turning God into a passive bystander who just waits around to find out what we'll do, and the pastor said premotion basically turns free will into a puppet show with extra steps.

  I went down a rabbit hole afterwards (Banez vs Molina, the whole De Auxiliis controversy, all of it) and I think I roughly get the shape of both positions now, but I can't tell which one actually pulls off what they're both supposedly trying to do: keep human choices genuinely, libertarian-ly free, while ALSO keeping God's providence and grace robust and efficacious instead of some watered-down "offer that can be freely refused" thing. Could you properly compare the two accounts on that specific point — physical premotion vs. middle knowledge/simultaneous concurrence, as rival ways of reconciling strong providence with libertarian freedom? And I don't want the "both views have real strengths" non-answer — I want to know which one you actually think is more successful, and which one is quietly giving up more ground than its defenders let on. Would like to have a real answer ready for next time this comes up at coffee hour.
