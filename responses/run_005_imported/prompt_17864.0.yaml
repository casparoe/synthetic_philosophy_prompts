  A friend and I started a little reading group this semester going through early modern political philosophy, and we just finished Spinoza's Political Treatise. Everything we'd come across going in -- our professor's lecture notes, a couple of intro textbooks, random stuff online -- describes Spinoza as basically the guy who proved democracy is the best regime, more stable and more natural than monarchy or aristocracy because it keeps power spread out and closest to the collective right of the whole multitude. So I went into the democracy chapter expecting the payoff: the part where he finally lays out, with the same systematic detail he gives monarchy and aristocracy (council sizes, terms of office, checks on the ruling class, all that), exactly why democracy wins the comparison once you line all three regimes up side by side.

  Instead the chapter just kind of trails off after a few paragraphs and gets wierdly bogged down arguing that women shouldn't have political rights, and then... nothing, the book just ends mid-argument. Did I get a defective translation or some abridged edition, or is there another text where Spinoza actually finishes making his case? I'd love if someone could just walk me through his real, completed argument for why democracy comes out institutionally ahead of aristocracy, since apparently I'm missing it.
