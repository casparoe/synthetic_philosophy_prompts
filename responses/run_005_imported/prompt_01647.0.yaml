answer: |-
  The polished brass plaque beside the service elevator read "Maintenance Access: Authorized Personnel Only." Silas Thorne, head janitor of the Sterling Trust building for twenty-three years, knew every rivet, every hum, every sigh of the building’s aging infrastructure. He also knew the unspoken rules: See nothing, hear nothing beyond the scope of the mop and bucket.

  Tonight, he heard it. The sharp, escalating argument spilling from Elevator Three’s shaft into the dimly lit service corridor. *Her* voice, Elena from Marketing, tight with fear. *His* voice, Paul Henderson, rising VP, slick with controlled fury. Silas froze, his cart of cleaning supplies silent beside him. He recognized the cadence of power being wielded, the kind that thrived in the Sterling Trust’s gilded corridors.

  *"You think you can just walk away? After everything I’ve done for you?"* Paul’s voice was a venomous whisper amplified by the metal shaft.
  *"Please, Paul. Just let me go home."* Elena’s reply was a tremor.
  *"We’re not finished. Not until you understand."*

  Silas’s hand tightened on the handle of his cart. He knew the service panel for Elevator Three was just around the corner. A flick of the override key, a barked command through the intercom – he could disrupt it. He *could*. He pictured Paul’s cold, handsome face turning towards the sudden interruption, the fury redirected. He pictured Elena’s terrified eyes meeting his through the grille. He pictured the inevitable fallout: Paul’s influence, the HR complaint against a lowly janitor "overstepping," the loss of his pension-nearing job. His knuckles whitened.

  *"Stop it! Let go!"* Elena’s cry was cut off, replaced by a scuffle, a muffled thud against the elevator wall.

  Silas closed his eyes. *Not my place. Not my job. Intervening could make it worse. They’ll work it out. It’s just a lover’s spat. Henderson’s important.* The justifications, honed by decades of keeping his head down, formed a solid wall. He deliberately took a step back, then another, turning his cart away from the service panel. He focused on the rhythmic squeak of the wheels, the smell of disinfectant, the familiar, safe mundanity of his domain. He chose the corridor leading away, the sounds fading behind him. He chose *inaction*.

  The next morning, the Sterling Trust buzzed with a different kind of tension. Elena Petrova hadn’t arrived. Calls went unanswered. By noon, security reviewed the lobby footage: Elena entering Elevator Three alone at 8:05 PM the previous night. Paul Henderson entering seconds later. The elevator descending. The footage inside, Silas knew, would be a silent, damning pantomime. Then, the elevator stalled between floors. The emergency call log showed one aborted attempt, then silence. Maintenance found it hours later when the overnight system check flagged a fault. They found Elena, unconscious, a deep, ugly bruise flowering on her temple, slumped against the wall. A brain hemorrhage, the hospital said. Critical condition. Unlikely to regain full function.

  Paul Henderson was questioned, of course. A regrettable argument, he admitted. He’d tried to calm her. She’d become hysterical, stumbled, hit her head. He’d panicked, unsure what to do. His expensive lawyer murmured about stress, misunderstandings. There was no concrete proof contradicting him, only Elena’s silent suffering. A month later, Paul received a promotion. The official report cited "tragic accident."

  Silas moved through the gleaming halls like a ghost. He buffed the floors where Elena’s heels had clicked, emptied trash bins in the marketing department where her empty desk sat like a tombstone. He saw the knowing looks exchanged between other staff, the hushed whispers about Paul. He saw the fresh coat of paint inside Elevator Three, covering the scuff marks. The polished brass plaque by the service access seemed to glare at him accusingly.

  The question wasn't abstract anymore. It lived in the hollow ache in his chest, in the phantom sound of Elena’s cry echoing every time the elevator chimed. **Did his deliberate choice *not* to act cause Elena’s fate?** If he had intervened, Paul might have stopped. The elevator might not have stalled at that precise, vulnerable moment. Elena might have walked away with only fear, not a shattered life. His inaction wasn’t neutral; it was the space where Paul’s aggression operated unchecked, where the faulty elevator became a trap. By removing the possibility of interruption, he had, in a terrible, passive way, *enabled* the chain of events.

  Yet, the counter-argument hammered in his mind: *Paul* struck her. *Paul* panicked. *The elevator* malfunctioned. Silas hadn’t pushed her, hadn’t broken the mechanism. Was he really responsible for evils he merely failed to prevent? Was the weight of the world on the shoulders of everyone who *could* have acted but chose self-preservation?

  He sat in the quiet cafeteria before dawn, staring at his cooling coffee. The building hummed around him, indifferent. The moral dilemma wasn't a puzzle to solve; it was a millstone. Whether his inaction *was* causation felt less important than the crushing certainty that his choice *mattered*. His refusal to turn the key, his retreat down the corridor – those weren't absences. They were concrete choices that shaped reality as surely as any action, leaving Elena in the dark and Silas forever in the shadow of a door he chose not to open. The consequences were real, tangible, and stained with his silent complicity. He could argue the semantics of causation until the end of his days, but the weight of his inaction, the part he played in that terrible stillness between the thud and the hospital lights, would never lift.
