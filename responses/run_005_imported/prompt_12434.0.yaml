  The dialogue must avoid two pitfalls: becoming too technical (it's philosophy seminar) or too abstract (must reference specific tracing/editing papers). I'll have them debate what would falsify their views - Alex might say complete inability to localize even approximately, Sam might concede if all methods consistently pinpoint same features.

