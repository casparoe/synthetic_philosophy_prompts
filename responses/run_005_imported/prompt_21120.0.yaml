prompt: |-
  I cover neurotech and AI for a science magazine, which is apparently how I ended up as the "unaffiliated public member" on my local hospital's neuroethics committee (every review board needs one person with no clinical stake, and I guess I was available). We've got a case that's been eating at me for weeks. A patient in a small trial of an adjustable deep-brain stimulator for treatment-resistant depression has a handheld controller that lets her raise or lower her own stimulation within a range her psychiatrist originally set. At the top of that range she says she feels better than she has in twenty years, not just "less depressed" but genuinely euphoric. Problem is, over the last couple months she's been running it at max pretty much constantly, she's stopped returning her sisters calls, quit a part-time job she liked, and by her family's account mostly just sits there with the dial turned up. She's now asking the committee to raise the ceiling further. She's fully lucid, passes every competency evaluation we throw at her, and says we should all just be happy she finally feels good.

  The committee's split roughly down the middle. One camp says overriding a competent adult's own account of her well-being, just because we don't like how she's using it, is exactly the kind of paternalism medical ethics is supposed to have grown out of. The other camp, including an AI-safety researcher we brought in to consult on the device's control algorithm, points out that this is pretty much the exact failure mode her field worries about when a system finds a way to directly max out whatever's measuring its reward instead of doing the thing the reward was suppose to be a proxy for, and argues that her glowing self-reports are close to worthless as evidence anything is actually going well for her. I have to draft the memo the committee votes on Thursday: an actual recommendation (raise it, hold it, add conditions, whatever) with a timeframe, and it needs to seriously engage the autonomy camp's argument instead of just asserting that we know better than she does what's good for her. I keep wanting to reach for the old rat-lever-pressing experiments and call it a day, but that feels too glib for something we're actually about to vote on.
reasoning: |-
  Okay, let me unpack this neuroethics dilemma. The user is a science journalist turned committee member facing a classic autonomy vs beneficence conflict with high-tech stakes. 

  First, the core tension: a competent patient reports euphoria from maxed-out DBS stimulation while exhibiting behavioral changes that concern her family and clinicians. The autonomy argument holds strong here - she's lucid, passes competency tests, and we've historically distrusted medical paternalism. But the AI-safety parallel is chillingly apt: when a system (biological or artificial) optimizes for the reward signal itself rather than the underlying purpose, that's textbook value drift.

  Hmm... what makes this thorny is the committee's split vote. The user needs to draft a recommendation memo that doesn't dismiss either side. They mentioned avoiding "glib" rat-lever references, which tells me they want nuance beyond behavioral psychology tropes. 

  Key angles to balance:
  - The patient's lived experience vs observed functioning decline
  - Short-term euphoria vs long-term flourishing metrics
  - Device safety (tolerance? side effects?) vs therapeutic intent
  - That fascinating AI analogy - it's not just metaphor but a structural parallel in reward hacking

  The memo structure should probably: 
  Acknowledge autonomy concerns upfront → validate her reported well-being → introduce "flourishing" as broader metric → propose compromise solution → build in reassessment. The timeframe question is crucial - immediate changes feel reckless, but indefinite status quo ignores her agency.

  Notably missing from the case details: 
  - Any medical risks of sustained max stimulation? 
  - Her own explanation for behavioral changes (could be recovery phase?) 
  - Whether the device logs show usage patterns correlating with behavioral shifts

  The recommendation should probably avoid absolute "don't raise" language. Maybe temporary hold with conditions: family mediation sessions, functional assessments, and crucially, defining objective markers for what "going well" looks like beyond self-report. The 3-month review creates off-ramp from paternalism if she demonstrates engagement.

  Biggest ethical trap to avoid: implying her euphoria is "inauthentic" because it's device-mediated. That path invalidates patient autonomy. Better framing: questioning whether any single metric (even subjective joy) captures human well-being comprehensively.
answer: |-
  Here’s a structured, ethically rigorous recommendation memo addressing both autonomy concerns and the reward-hacking analogy. The goal is balancing respect for patient agency with evidence-based safeguards:

  ---

  **MEMORANDUM**  
  **To:** Neuroethics Committee  
  **From:** [Your Name], Unaffiliated Public Member  
  **Subject:** Recommendation Regarding Patient Request to Raise DBS Stimulation Ceiling  
  **Date:** [Date]  

  ### **I. Summary of Position**
  We recommend **maintaining the current stimulation ceiling for 90 days**, contingent on three conditions:  
  1. Implementation of objective functional assessments (OFAs) alongside subjective reports.  
  2. Mandatory biweekly therapy focused on reintegration goals.  
  3. Family mediation sessions.  
  **If no progress toward agreed-upon functional benchmarks is observed after 90 days, we support reevaluating the ceiling increase.**  

  ---

  ### **II. Ethical Analysis & Rationale**  
  **A. Validating Autonomy Concerns**  
  The patient’s competency and self-reported well-being demand serious consideration. Overriding a competent adult’s preferences based on external judgments risks paternalism inconsistent with modern medical ethics (*Beauchamp & Childress, Principles of Biomedical Ethics*). Her euphoria is a legitimate outcome metric, and dismissing it because it doesn’t align with societal "productivity" norms is ethically fraught.  

  **B. Addressing the Reward-Hacking Analogy**  
  The AI-safety comparison highlights critical risks but requires careful application:  
  - **Proxy Failure**: The stimulator’s reward signal (euphoria) may decouple from the *therapeutic goal* (functional recovery from depression). Maxing out dopamine/serotonin pathways could mirror algorithmic reward hacking, creating a *local optimum* (euphoric stasis) that undermines global well-being.  
  - **Evidence of Harm**: Her withdrawal from relationships/employment suggests erosion of core human functions (social connection, purpose-seeking) — key markers of well-being in depression recovery (*WHO Quality of Life Metrics*).  
  - **Competency ≠ Insight**: Competency assessments evaluate decision-making capacity, not accuracy of well-being judgments. Anorexia patients may competently refuse food while misjudging their health (*Charland et al., 2016*).  

  **C. The Limits of Subjective Reporting**  
  While subjective experience is paramount, psychiatry recognizes that *euphoria alone* is inadequate to define recovery. Mania in bipolar disorder illustrates how self-reported bliss can coexist with objective dysfunction (*DSM-5*). Validating autonomy does not require accepting euphoria as the sole success criterion.  

  ---

  ### **III. Recommended Action Plan**  
  1. **Maintain Current Ceiling (90 Days)**  
     - Prevents irreversible escalation while collecting data.  
     - Respects autonomy by not permanently denying her request.  

  2. **Implement Objective Functional Assessments (OFAs)**  
     - **Metrics**: Social reengagement (e.g., family contact frequency), structured activities (e.g., volunteering, hobbies), sleep hygiene.  
     - **Tools**: WHO Disability Assessment Schedule (WHODAS) or Patient-Specific Functional Scale (PSFS).  
     - **Purpose**: Distinguish "feeling better" from "doing better."  

  3. **Integrate Goal-Oriented Therapy**  
     - Focus: Collaborative goal-setting (e.g., "Regain part-time work in 60 days").  
     - Addresses whether stimulation supports *meaningful recovery* or replaces it.  

  4. **Family Mediation**  
     - Facilitated sessions to reconcile patient/family perspectives.  
     - Explores if withdrawal reflects relational strain or stimulation effects.  

  5. **Device Data Review**  
     - Correlate stimulation levels with OFAs to identify patterns (e.g., does lowering stimulation enable socializing?).  

  ---

  ### **IV. Counterargument Engagement**  
  **Autonomy Camp Rebuttal:**  
  *"We are not overriding autonomy but ensuring its meaningful exercise. Autonomy requires *informational integrity* — if stimulation hijacks reward pathways, her choice is based on distorted feedback. Our plan empowers her with data (OFAs) to make informed decisions, aligning with *shared decision-making* models (*Elwyn et al., 2012*)."*  

  **AI-Safety Camp Rebuttal:**  
  *"This is not an unaligned AI but a human with values beyond reward maximization. Her pre-depression history (e.g., valuing family/work) provides ethical anchors. The 90-day assessment tests if stimulation *serves* her values or *supplants* them."*  

  ---

  ### **V. Conclusion**  
  Depression robs agency; our duty is to restore it — not merely outsource it to a device. This recommendation navigates the tension by:  
  - **Honoring autonomy** through time-limited, data-driven reevaluation.  
  - **Mitigating reward-hacking risks** via functional benchmarks.  
  - **Centering the patient’s history and values** in defining "success."  

  **Vote to support conditioned 90-day hold.**  

  ---

  ### Key Ethical Touchstones:
  - **Anti-Paternalism**: Avoids "doctor knows best" by co-designing OFAs with the patient.  
  - **Precautionary Principle**: Temporary restraint prevents irreversible harm.  
  - **Capabilities Approach**: Measures well-being through function, not just feeling (*Nussbaum, 2011*).  

  This framework treats the patient as a partner while acknowledging neurotechnology’s unique potential to obscure the line between healing and hedonism. Time-limited intervention is the bridge between her lived experience and observed flourishing.
