answer: |-
  Here's a breakdown of what hangs on Chang's "parity" move, the problems with "incomparability," and a critical pushback:

  **The Core Distinction & What Hangs On It:**

  1.  **Rational Justification vs. Arbitrariness:**
      *   **Incomparability Problem:** If options are simply *incomparable* (no value relation holds), then *any* choice between them seems rationally arbitrary. There are *no reasons* favoring one over the other. Choosing becomes akin to flipping a coin – neither choice can be justified as better, worse, or even "on a par." Rational agency seems undermined.
      *   **Parity Solution:** "Parity" is a *positive* fourth relation. When options are on a par, there *are* reasons for choosing each, and these reasons are *comparable* (you can weigh them against each other), but they fail to determine that one option is better than, worse than, or equal to the other. Crucially, **choosing one option *can be rationally justified* by appealing to the reasons supporting it**, even though the *other* option also had strong, comparable reasons supporting it. Your choice isn't arbitrary; it's based on your *commitment* to one set of reasons.

  2.  **The Nature of "Hard Choices":**
      *   **Incomparability View:** Hard choices are situations where reasons "run out." There's simply nothing more rational deliberation can do. The agony is realizing the absence of any justifying relation.
      *   **Parity View:** Hard choices are situations where reasons are *abundant* and *in tension*, but deliberation cannot produce a single decisive verdict. The agony stems from the conflict between genuinely good, comparable reasons. Deliberation *does* meaningful work identifying these reasons, even if it doesn't yield a "best" option.

  3.  **The Role of the Will/Agency:**
      *   **Incomparability Problem:** If choice is arbitrary, agency is passive. The agent just picks.
      *   **Parity Solution:** Chang argues that in hard choices characterized by parity, **the agent's will plays a constitutive role**. By choosing one option *for its reasons*, you *create* a justification where deliberation alone couldn't definitively establish one option as superior. You "put your normative weight" behind one set of reasons, making it your will that *this* reason (or set) is the one that tips the balance *for you*. Your agency is active and creative.

  4.  **Normative Significance of Choice:**
      *   **Incomparability View:** Since the choice is arbitrary, neither option is normatively "better chosen." Regret or satisfaction is purely psychological.
      *   **Parity View:** Because your choice is justified by the reasons you commit to, it can be the *right choice for you*, even if the other option was also rationally choosable. Choosing the lawyer path *because* you commit to the value of stability, intellectual challenge, and helping clients *makes it* the right choice *for you*, justified by your commitment to those reasons. Regret might linger, but it doesn't necessarily mean you made the *wrong* rational choice.

  **How "Parity" Supposedly Fixes It:**
  By introducing a *positive* value relation ("on a par"), Chang:
  *   **Preserves Rational Justification:** Choices can be justified by appealing to the agent's commitment to the reasons supporting the chosen option.
  *   **Explains the Phenomenology:** Captures why hard choices feel like genuine conflicts of *reasons*, not just the absence of reasons.
  *   **Elevates Agency:** Gives the will a crucial normative role in resolving conflicts where reasons are comparable but inconclusive.
  *   **Avoids Arbitrariness:** Provides a framework for saying one choice was rationally permissible and justified *for that agent*, even if the alternative was equally permissible.

  **The Pushback: Is Parity Just a Friendlier Label?**

  This is a valid and common criticism. Here's the case:

  1.  **Structural Equivalence?:** At the purely formal level (better, worse, equal, neither), "incomparable" and "no relation *except* parity" look identical. Both describe a state where none of the three traditional relations hold. Does adding a *name* for the absence ("parity") change the underlying structure?
  2.  **The "Positive Relation" Claim:** Critics argue "parity" is still just the *lack* of a determinate ordering relation. Calling it "positive" might be more about making us *feel* better about hard choices than adding real structural content. The "reasons" exist under incomparability too; they just don't combine to form any ordering relation.
  3.  **Justification via Commitment - Circular?:** Does saying "I commit to these reasons, therefore my choice is justified" actually provide *independent* justification, or does it just mask the underlying arbitrariness? If the reasons were truly sufficient to justify the choice *without* commitment, shouldn't they have determined a better/worse/equal relation? The commitment might feel like justification, but is it rational justification or just post-hoc rationalization?
  4.  **Occam's Razor:** Is positing a fourth fundamental value relation necessary? Can't the phenomenology of hard choices be explained by complex, multi-dimensional, and roughly equal weighting of values *within* the traditional framework, leading to practical indeterminacy (effectively incomparability in practice) without needing a new metaphysical category?

  **Chang's Defense (Implied in the Parity Concept):**

  Chang would argue the differences are substantive, not just semantic:
  *   **Reasons are Comparable under Parity, Not Under Incomparability:** This is key. For Chang, parity requires that the reasons *can* be placed on the same scale and compared (even if the comparison doesn't yield a decisive verdict), whereas incomparability often implies the reasons are so different they *can't* even be compared. Raz's lawyer/clarinetist reasons *are* comparable (both involve fulfilling careers, self-realization, contribution, etc.), they just don't yield a decisive outcome.
  *   **The Justificatory Work:** Only the parity framework allows the *choice itself*, mediated by commitment to reasons, to generate justification. Incomparability denies this possibility, leaving justification perpetually absent.
  *   **Explanatory Power:** Parity better explains *why* we deliberate so intensely in hard choices (we are weighing comparable reasons) and *why* we feel responsible for our choice (our will created the justification).

  **Conclusion:**

  What hangs on the move is the **possibility of rational justification for choices in hard cases, the active normative role of the will, and the avoidance of arbitrariness.** Chang argues that labeling the relation "parity" isn't just friendlier; it acknowledges a distinct normative structure where reasons are comparable but inconclusive, allowing agency to complete the justification. Sticking with "incomparable" collapses this structure, rendering choice arbitrary and undermining rational agency in hard choices.

  However, the pushback highlights a genuine tension: **Is parity a fundamental *new* relation, or is it a useful label for the complex *experience* of choice when values are multi-dimensional and finely balanced (effectively incomparable in practice)?** Chang stakes her claim on the former, arguing the structural and normative differences are real. Critics remain skeptical, seeing it as a potentially unnecessary complication or a psychological salve. Your seminar will likely delve deeper into this! Good luck!
