  I need to present this step-by-step. Start with an intuitive analogy, like the "planet" example. Then apply to composition, detailing each test step. Finally, clarify that Sider's objection isn't about the test but the framework's fundamentality, leading to a metametaphysical disagreement about quantifier privilege.
answer: |-
  Here's a clear, step-by-step explanation of Chalmers's test for verbal disputes, its application to the composition debate, and the precise residual disagreement between Hirsch and Sider:

  ---

  ### **Chalmers's Core Idea: The "Gut-Level" Intuition**
  Imagine two people arguing whether a *tumbler* is a "cup."  
  - **Person A:** "It's too wide and has no handle—it's not a cup!"  
  - **Person B:** "It holds liquid—it *is* a cup!"  
  ➠ **The dispute is merely verbal:** They agree on all physical facts about the tumbler but use "cup" with different meanings.  

  **Chalmers's Insight:** A dispute is verbal if:  
  > *"Once we fix what the words mean and agree on all non-verbal facts, the disagreement vanishes."*  

  The key is isolating *meaning differences* from *factual disagreements* using a **neutral framework**—a way to describe the world without the contested terms.

  ---

  ### **Chalmers's 3-Step Test (Simplified)**
  1. **Find a neutral framework**: Identify vocabulary *both sides accept* that can describe all relevant facts.  
  2. **Fix meanings**: Use this framework to *define* the contested terms.  
  3. **Check for residual disagreement**: If both sides now agree, the original dispute was verbal.  

  **Why stronger than "they mean different things"?**  
  - Observing meaning differences (*e.g.*, "quantifier variance") isn’t enough. Some meaning differences still track factual disagreements (*e.g.*, "water" in 1750 vs. H₂O).  
  - Chalmers’s test **proves** the disagreement *only* arises from meaning choices, not reality.  

  ---

  ### **Applying the Test to the Composition Dispute**
  **Step 1: Construct a neutral framework**  
  - Both universalists and anti-universalists accept:  
    - **Basic physical vocabulary**: "particle," "location," "arrangement," "causal relations."  
    - **Logical vocabulary**: "and," "or," "not."  
  - *Crucially, avoid "exists" or "object."* Describe the world in terms of *particles and their spatial-causal relations*.  

  **Step 2: Define key terms neutrally**  
  - **Define "fusion"**:  
    - Universalist: "A fusion of particles X is *any collection* of X arranged in way Y."  
    - Anti-universalist: "A fusion of X exists *only if* X are causally integrated/organic."  
  - **Define "exists"**:  
    - Use the neutral framework to specify *what conditions* must hold for something to "exist."  

  **Step 3: Check for agreement**  
  - Under the neutral description:  
    - Both sides agree on *all facts* about particles, locations, and causal relations.  
    - Their disagreement *only* re-emerges when they choose how to *map* words like "exists" or "object" onto these facts.  
  ➠ **Result**: The dispute satisfies Chalmers's test → **merely verbal**.  

  ---

  ### **The Residual Disagreement: Hirsch vs. Sider**
  **Where Chalmers and Hirsch agree**:  
  - The test *is satisfied* for the composition debate → It *is* merely verbal.  

  **Sider's objection**:  
  - He **grants** that Chalmers’s test is satisfied and that the dispute is verbal *in ordinary language*.  
  - But he **relocates the substantive dispute** to a *metametaphysical* level:  
    > *"Which meaning of 'exists' carves reality at its joints?"*  

  - For Sider, there’s a privileged, joint-carving quantifier (**"Ontologese"**) that *correctly describes the structure of reality*.  
    - Universalism might be *objectively true* in Ontologese, even if ordinary language is vague.  
    - **The real dispute isn’t about language** but about which quantifier is *fundamental*.  

  ---

  ### **Key Distinction for Students**
  | **Hirsch**                          | **Sider**                                  |
  |-------------------------------------|--------------------------------------------|
  | The test shows the dispute is *wholly* verbal. | The test shows it’s verbal *in ordinary language* but not in Ontologese. |
  | All quantifier meanings are metaphysically equal. | Only *one* quantifier meaning is joint-carving. |
  | **No further disagreement** after passing the test. | **Substantive disagreement remains**: "Which quantifier is privileged?" |

  **Why Chalmers ≠ Hirsch**:  
  - Chalmers’s test *validates* quantifier variance for ordinary disputes but *doesn’t rule out* Sider’s metametaphysical claim.  
  - Sider’s challenge isn’t about the test’s result—it’s about whether the **neutral framework** is metaphysically fundamental.  

  ---

  ### **Takeaway for Your Seminar**
  1. **Chalmers’s test** proves verbality by showing disagreement vanishes under meaning fixation + neutral facts.  
  2. **In the composition case**, the test works: Both sides agree on particle arrangements but label them differently.  
  3. **Sider’s move**: Accepts the test’s result but argues the *neutral framework isn’t fundamental*. The real issue is which quantifier "matches reality’s structure."  

  This clarifies why Chalmers doesn’t "basically agree with Hirsch"—he provides a *method* to detect verbality, but Sider rejects that method’s *metaphysical finality*. The residual dispute isn’t about composition but **metaontology**: Is there a "joint-carving" quantifier?
