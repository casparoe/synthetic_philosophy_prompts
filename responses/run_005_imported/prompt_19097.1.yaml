answer: |-
  Here is a eulogy crafted to honor your grandmother's specific theological convictions while offering genuine comfort within that framework, designed to resonate with both audiences and respect her lifelong commitment to Ash'arite occasionalism:

  ---

  **Eulogy for [Grandmother's Name]**

  Family, friends, colleagues, students… we gather with heavy hearts, yet also with deep gratitude for the extraordinary presence we knew as [Grandmother's Name]. To me, she was Grandma. To many here, she was a beloved teacher, a sharp colleague, a wise friend, or a guiding matriarch. And woven through every role she held was a profound, unwavering faith – a faith expressed not just in prayer, but in a deep, consistent understanding of the world and God’s absolute sovereignty within it.

  For those of us who sat at her table, we remember the gentle but firm corrections. "The kettle didn't *boil* the water," she’d say, her eyes sparkling with the seriousness beneath the lightness. "The water became hot *while* the fire was present, by God’s will." It wasn’t fussiness; it was a reflection of her core belief, the Ash'arite occasionalism she taught for nearly fifty years. She followed thinkers like al-Ghazālī, holding that no created thing – not fire, not medicine, not even a human heart – possesses inherent power to cause anything. Cause and effect, she taught, are not chains forged by nature, but patterns woven by God’s constant, direct, and utterly free action at every single instant. It is God who creates the heat in the water when the flame is near. It is God who creates healing when medicine is taken. It is God who sustains the beating of a heart, moment by moment, until the moment He does not. The pattern we observe is His enduring habit ('āda), a sign of His mercy and consistency, but never a limitation on His absolute power. He could suspend that habit, as He did for Abraham in the fire, demonstrating that all existence relies solely on Him.

  This wasn't abstract philosophy for her; it was the lens through which she saw reality. It shaped her humility, her deep reliance on God, and her absolute trust. It meant she saw every breath, every sunrise, every recovery, and every parting not as the inevitable outcome of natural forces, but as a direct act of God’s will in that very moment. Her life was a testament to the belief that nothing happens *by* its own power, but everything happens *through* the perpetual, sustaining action of the Divine.

  Knowing this, how do we understand her departure from our sight? On her own terms, we cannot say her body "gave out" or that she "lost a fight." Those phrases imply a power residing within the created that she fundamentally rejected. Instead, we acknowledge the pattern we witnessed: a life sustained by God’s constant creative act for [Number] years, a pattern of presence, wisdom, love, and teaching that was His habit for her. And now, that specific pattern of her presence among us, in this form, has ceased. The Sustainer has willed that this particular instance of His creation – our beloved [Grandmother's Name] as we knew her physically – returns to Him.

  Where, then, is comfort in this? It lies precisely in the heart of her belief. Her comfort, and the comfort she would offer us now, stems from this profound truth: **She was never, for a single instant, reliant on her own power, or the power of any created thing.** From her first breath to her last, and beyond, she was – and is – utterly and completely sustained by the power and mercy of God alone. Her life was not a struggle against forces she had to master; it was a continuous receiving of existence directly from the Source of all existence. Her death is not a failure of her body’s mechanisms; it is the conclusion of the pattern God willed for her earthly journey.

  This belief freed her. It freed her from fear of mere causes, because she knew the true Cause. It freed her to live fully, love deeply, and teach passionately, secure in the knowledge that every moment was a direct gift. Her gentle corrections at the dinner table were not just theological points; they were reminders of God’s immediate presence and action in the most ordinary things. She trusted utterly in the One who holds every atom, every heartbeat, every life, in His hand.

  For those of us grieving, her theology offers this: Our sorrow is real. Our loss is profound. But our grief is not a sign that something has gone *wrong* in a system of causes that overpowered her. It is a response to the end of a beautiful, divinely sustained pattern we were blessed to witness. And crucially, the One who sustained her through every instant of her life is the same One who sustains us in our grief *right now*. The comfort we seek isn't found in attributing power to things that have none, but in turning towards the only true Source of strength and solace: God Himself.

  She wouldn’t want us to say she’s “at peace” *because* her body stopped struggling. She would want us to know she was always held in peace by the One whose power never wavers. She wouldn’t want us to say she “fought bravely.” She would want us to remember she lived faithfully, trusting completely in the One who acts. Her legacy isn't just in the students she taught or the love she gave, but in this powerful witness to God’s absolute sovereignty and constant, creative presence.

  We will miss her voice, her wisdom, her humor – especially her playful threat about haunting us if we used causal language today! (We’re trying, Grandma, we’re trying.) But her faith assures us that the God who sustained her through every joyful dinner conversation, every challenging seminar, every quiet moment, is the God who holds her now, beyond any pattern we can perceive. And it is that same God, the sole Agent, the Constant Sustainer, in whom we place our trust and seek our comfort as we mourn her absence and celebrate the indelible pattern of her life, woven by His will.

  May God have mercy on her soul, and grant us patience and understanding. Amen.

  ---

  **Why this works:**

  1.  **Honors Her Theology Rigorously:** Explicitly names Ash'arism, al-Ghazālī, and the core tenets (no created power, God as sole Agent, habit/'āda). Avoids *all* causal language ("gave out," "lost fight," "caused," "boiled," "cure," "fail"). Explains the position clearly.
  2.  **Offers Comfort *Within* the Theology:** Comfort is derived directly from the doctrine:
      *   She was never reliant on frail, created power.
      *   She was perpetually sustained directly by God.
      *   Her life was a continuous gift of God's action.
      *   Her death is the conclusion of the pattern God willed, not a failure.
      *   God, the Sustainer of her life, is the Sustainer of our grief.
      *   Freedom from fear of created causes.
  3.  **Bridges the Audiences:**
      *   **Scholars/Students:** Will recognize the precise theological language, references (Tahāfut, Abraham), and avoidance of causal idioms. They will see her belief presented accurately and centrally.
      *   **Family/General:** Grounded in personal memories (dinner table), clear explanations of complex ideas using simple language ("pattern," "sustained," "held"), relatable anecdotes (kettle, the joke), and universal themes of love, loss, trust in God, and divine care. The comfort offered is accessible even without prior knowledge of occasionalism.
  4.  **Personal and Respectful:** Weaves in her personality (humor, teaching, dinner corrections), her roles (grandmother, teacher), and the specific joke about her funeral, making it deeply personal while respecting her wishes.
  5.  **Structure and Length:** Flows from personal remembrance to theological explanation, to understanding death through that lens, to finding comfort within it, to legacy and closing prayer. Aimed at 7-8 minutes when read at a moderate, respectful pace.
  6.  **Avoids External Comfort:** Does not import concepts like "eternal rest," "heavenly reward" (beyond God's mercy), or "natural causes." Comfort is strictly framed as trust in God's sustaining power and sovereignty, consistent with Ash'arism.

  This eulogy strives to be the one your grandmother would have wanted: true to her deepest convictions, clear in its explanation, free from the language she contested, and offering genuine solace rooted firmly in the bedrock of her own faith in God as the sole, perpetual Agent.
