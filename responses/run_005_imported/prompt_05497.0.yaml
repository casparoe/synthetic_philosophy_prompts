  Marcus argues for a "non-overlapping magisteria" interpretation where scripture and science address completely separate domains. He claims Galileo viewed biblical passages about nature as merely accommodated language without factual content. Elena counters that Galileo believed scripture was factually true even when discussing nature - the accommodation is in phrasing, not substance. She emphasizes Galileo's reliance on Augustine's principle that apparent conflicts require reinterpretation of scripture when scientific demonstration exists.

