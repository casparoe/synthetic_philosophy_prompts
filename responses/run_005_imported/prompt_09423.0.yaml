prompt: |-
  I did not expect to need actual philosophy for my job this year, but here we are. I'm an immunology professor, and back in the fall I got roped onto my university's Research Integrity Committee, which just got reactivated and given more teeth after -- well, you've probably seen the same headlines about manipulated data that I have, it feels like a new one breaks every few months. My actual first case landed on my desk two weeks ago, and it's a lot messier than the onboarding session made it sound.

  Short version: a postdoc in a cancer biology lab manipulated, and in a couple of spots outright fabricated, the quantification behind two of six figures in a paper (western blots and mouse tumor counts). Nobody disputes she acted alone or that the paper is getting retracted -- that part's easy. The fight is about the other three co-authors: the PI, an outside collaborator at another university who ran the statistical analysis on data as it was handed to him and never touched a raw blot, and a grad student whose own experiments in the same paper are totally clean. Our authorship policy just says authors "share responsibility for the accuracy and integrity of the reported work" and leaves it at that, which is not alot of help when the whole question is what that's even supposed to mean for three people who had no realistic way of knowing.

  Half the committee wants a finding only against the postdoc, with the other three simply asked to sign off on the retraction and otherwise cleared. The other half, led by our chair (she did a philosophy phd before moving into research administration), keeps insisting that co-authoring a paper is itself a joint act, not just four individual contributions stapled together, and that this creates a real, if lesser, form of shared responsibility that doesn't just reduce to who-knew-what -- she threw out some names, joint commitment, shared agency, Gilbert or Bratman or maybe both, I wrote it down wrong and don't have time to go chase down the actual texts before we reconvene a week from Monday. Could you draft the memo I'd actually bring to that meeting? I need a real recommendation on what, if anything, happens to the three non-fabricating co-authors, a rough timeline for next steps, and reasoning solid enough that the "only punish the person who did it" side of the room would have to actually engage with it rather than just being told they're wrong -- I think they've got a genuinely strong point, and I don't want the memo to just bulldoze past it.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're an immunology professor on a Research Integrity Committee dealing with a complex authorship misconduct case. The core issue is determining responsibility for co-authors when one member fabricates data. The user needs a memo that addresses philosophical concepts like shared agency without alienating committee members who favor individual accountability.

  First, I need to recall the key philosophical frameworks mentioned: Gilbert's joint commitment and Bratman's shared cooperative activity. Gilbert emphasizes mutual obligations formed through agreement, while Bratman focuses on interdependence in planning. Both theories suggest that co-authorship isn't just a collection of individual contributions but a collective endeavor with inherent responsibilities.

  The user’s committee is split. Half wants only the postdoc punished, arguing others couldn't have known. The other half, led by the philosophy-trained chair, pushes for shared responsibility. The challenge is to bridge these views without dismissing either. The memo must acknowledge the valid points of both sides—especially the "only punish the perpetrator" camp—while introducing the philosophical perspective as a necessary layer.

  I should consider the practical implications. The PI has supervisory duties, so their responsibility is clearer. The outside collaborator only handled provided data, which might limit their role. The grad student likely had minimal oversight capacity. The memo needs differentiated recommendations reflecting these roles. 

  The user emphasized not bulldozing opposing views. So the reasoning must show that shared agency doesn't equate to equal blame but creates a baseline duty. For example, authors implicitly agree to trust each other's work, but this doesn't mean they're culpable for intentional deceit. Instead, it highlights why systems (like verification steps) are necessary—shifting focus to preventive measures post-retraction.

  Timeline-wise, the retraction is urgent. The PI should coordinate it, while the collaborator and grad student provide formal consent. Consequences: the PI might need oversight training; the collaborator could review their verification processes; the grad student, likely least responsible, might only need educational guidance. 

  I should check if the memo structure balances philosophy with practicality. Starting with facts, then philosophical context, followed by role-based analysis, and concrete steps. This progression logically builds the case for shared responsibility while respecting individual circumstances. Highlighting the committee chair's perspective as a "framework" rather than absolute truth keeps it open for discussion.

  Also, the user mentioned not having time to research Gilbert/Bratman. The memo should summarize relevant concepts accessibly, avoiding jargon. Using examples like co-author agreements as "joint commitments" makes it tangible. 

  Finally, the recommendations must be actionable. Clear retraction steps, tailored consequences, and educational follow-ups address both integrity restoration and prevention. Including a review of authorship policies turns the incident into a systemic improvement opportunity—something both committee sides might support.
answer: |-
  Here’s a memo draft designed to bridge the philosophical and practical divide, incorporating shared responsibility principles while respecting individual circumstances. It includes actionable recommendations, a timeline, and structured reasoning to foster committee engagement:

  ---

  **MEMORANDUM**  
  **TO:** Research Integrity Committee  
  **FROM:** Dr. [Your Name], Immunology Department  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Co-Author Responsibility in Case [Case ID]  

  ### I. Case Summary  
  - **Misconduct**: Postdoc (Dr. X) manipulated/fabricated data in 2/6 figures (western blots, tumor counts).  
  - **Co-Authors**:  
    - **PI (Dr. Y)**: Supervised the project, approved manuscript.  
    - **Collaborator (Dr. Z)**: Conducted statistical analysis on provided data; no access to raw blots.  
    - **Grad Student (Ms. A)**: Executed independent experiments (validated); no oversight role.  
  - **Consensus**: Retraction is mandatory; Dr. X bears primary culpability.  

  ### II. Core Philosophical Framework (Per Committee Chair)  
  The chair’s emphasis on **joint commitment** (Gilbert) and **shared cooperative activity** (Bratman) posits that:  
  - Co-authorship constitutes a collective enterprise where members mutually commit to common goals (e.g., knowledge integrity).  
  - This creates *relational obligations* beyond individual tasks: authors are interdependent stewards of the work’s veracity.  
  - **Implication**: Responsibility is not binary (“guilty/innocent”) but exists on a spectrum, influenced by role, capacity, and norms.  

  ### III. Applying Shared Responsibility: Nuanced Recommendations  
  | **Party**       | **Degree of Responsibility**                                                                 | **Recommended Action**                                                                 |  
  |-----------------|----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|  
  | **Dr. X (Postdoc)** | Direct, intentional misconduct.                                                              | Full misconduct finding; retraction; institutional sanctions per HR policy.            |  
  | **Dr. Y (PI)**      | **High**: Ultimate oversight role; failure in data verification/supervision. Shared agency demands accountability for team output. | **Misconduct finding (negligence)**; mandatory research integrity training; 1-year bar on supervising trainees; must lead retraction process. |  
  | **Dr. Z (Collaborator)** | **Limited**: Operated on provided data; no access to raw materials. *But* shared commitment requires due diligence on data provenance. | **No misconduct finding**; required letter to journal explaining statistical reliance on co-authors’ data; mandatory data-trustworthiness workshop. |  
  | **Ms. A (Grad Student)** | **Minimal**: Executed own work properly; no authority to audit senior colleagues. Joint commitment burden disproportionately low. | **No misconduct**; no sanctions. Optional participation in retraction. Educational debrief recommended. |  

  ### IV. Reasoning: Balancing Philosophy and Pragmatism  
  - **Why not exonerate all non-perpetrators?**  
    - **Shared Agency Principle**: Co-authorship is a public attestation of collective validity. Absent verification mechanisms, the system incentivizes "wilful ignorance" (e.g., PIs outsourcing scrutiny).  
    - **Practical Risk**: Blanket exoneration erodes deterrence against lax oversight, especially among PIs.  

  - **Addressing the "Only Punish the Perpetrator" View**:  
    - **Valid Concern**: Punishing the unaware risks injustice and stifles collaboration.  
    - **Counterbalance**: Our recommendations:  
      - Differentiate by *role* (PI vs. collaborator vs. junior).  
      - Focus on *corrective* (training) vs. *punitive* (sanctions) measures for non-fabricators.  
      - Acknowledge that while *moral blame* rests with Dr. X, *professional responsibility* extends to those enabling the work’s credibility.  

  - **Why This Approach?**  
    - **PI Accountability**: PIs *benefit* from co-authorship (credit, funding); they must *own* its risks. Gilbert’s joint commitment implies PI as "anchor" of the group’s pledge.  
    - **Collaborator/Grad Student**: Their limited roles reduce obligation; sanctions focus on education, not penalty. Bratman’s "meshing subplans" concept: their tasks were siloed, but they relied on the group’s truthfulness.  

  ### V. Proposed Timeline  
  1. **Immediate (Week 1)**:  
     - Draft retraction notice (PI-led, all co-authors to sign).  
     - Notify journal of misconduct finding against Dr. X.  
  2. **Short-Term (Weeks 2-4)**:  
     - PI, Collaborator complete mandated training.  
     - PI submits supervision plan for future work.  
  3. **Long-Term (Ongoing)**:  
     - Committee review: Clarify authorship policy to include verification expectations (e.g., PI access to raw data; collaborator data-provenance checks).  

  ### VI. Conclusion  
  This case exposes ambiguities in our authorship policy. While Dr. X alone intended fraud, co-authorship inherently distributes *responsibility for vigilance*. Our recommendations:  
  - Reject *collective punishment* but uphold *graded accountability* tied to role-based capacity.  
  - Prioritize systemic correction (training, policy reform) over stigma for incidental co-authors.  
  - Align with research ethics norms (e.g., ICMJE: authors must "ensure accuracy").  

  **Recommended Vote**: Adopt the above sanctions framework to affirm research as a *collaborative trust enterprise* without scapegoating the unwitting.  

  ---  

  ### Key Strategic Elements:  
  - **Leverages Philosophy Without Jargon**: Frames "shared agency" as professional duty, not abstract theory.  
  - **Concedes Valid Points**: Explicitly acknowledges risks of over-punishment; limits consequences for low-control parties.  
  - **Focuses on Restoration**: Sanctions are corrective (training) or role-specific (PI oversight), not career-damaging for non-perpetrators.  
  - **Forces Engagement**: By grading responsibility (PI ≠ Grad Student), it challenges the committee to refine "only punish Dr. X" into "what does *each* role owe the collective?"  

  This memo provides a defensible middle path: it honors the chair’s philosophical foundation while addressing pragmatic concerns through proportional, role-based accountability.
