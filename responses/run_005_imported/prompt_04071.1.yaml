  7. **Classification of planets into benefic and malefic**: He was critical of this simplistic classification. He argued that the effect of a planet depended on the context (such as the aspects it forms) and that any planet could have positive or negative effects.

  8. **The system of the twelve astrological houses**: Kepler found the house system particularly problematic. He considered it arbitrary and without foundation. He preferred to focus on the aspects and the angles between planets.

