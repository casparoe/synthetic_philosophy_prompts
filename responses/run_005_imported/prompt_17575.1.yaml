  4. **Marcus (+1):** Insightfully highlights the normative conflict: Sam faces competing demands (trust perception vs. trust stats). *But wrongly implies symmetry; HOE specifically questions the capacity to evaluate first-order evidence, giving it priority.*  
  5. **Nadia (0):** Correct that HOE must sometimes override first-order judgments to be meaningful. *But overstates; HOE doesn’t *always* "win" – its force depends on strength, specificity, and context (e.g., 40% vs. 90% error rate).*  
