  Now, comparing Boethius and Molina. Boethius addresses God's eternal knowledge of actual events, while Molina deals with God's knowledge of counterfactuals—what free agents would do in any situation. Boethius's solution is about the necessity of truth in propositions, while Molina's middle knowledge allows God to know possibilities before creation. So they solve different problems: Boethius reconciles foreknowledge with freedom, Molina explains how God can sovereignly plan with free creatures.

