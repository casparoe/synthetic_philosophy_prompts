prompt: |-
  Twice in the past six months, colleagues have told me that something I wrote "reads like ChatGPT" — once because a grant report of mine used the word "delve," once because a newsletter draft had two em dashes in the same paragraph. I hadn't used any AI tool either time; those are just words and habits I've had for years. Since then I've caught myself, and several people I work with, quietly editing out "delve," "boundaries," "tapestry," "meticulous," and long em-dash constructions before sending anything out, purely to dodge the accusation. It is strange to watch a shared, unwritten rule take hold this quickly: a whole set of ordinary words becoming suspect within about two years, for reasons that have nothing to do with the words themselves.

  I am currently auditing a seminar on philosophy of language, and we recently spent two sessions on David Lewis's 1969 book Convention. His account of a convention — a regularity that solves a recurring coordination problem, sustained by precedent and common knowledge, where some other regularity would have done equally well — seemed at first like a perfect fit for what's happening with these words. The longer I sit with it, though, the less sure I am. Lewis builds his theory on situations of coincidence of interest, of the kind behind everyone driving on the same side of the road, or the old rule about who calls back after a dropped telephone line. The word-avoidance case looks more adversarial than that: writers want to avoid looking synthetic, language models (and whoever is prompting them) may or may not want to be caught, and detectors and "tell"-word lists are visibly racing to stay a step ahead of both. When I raised this in the seminar, opinions split on whether that adversarial element rules Lewis's framework out entirely.

  Since Lewis died in 2001 and never encountered anything like this, I would like your best reconstruction of how he would have analyzed it, reasoning strictly from the apparatus he actually built in Convention — and, if it genuinely bears on the case, from his later remarks on truthfulness and trust as linguistic conventions in "Languages and Language." Would he count today's vocabulary-avoidance as a genuine convention in his technical sense, or does its adversarial structure disqualify it, and if so, what would he say it is instead? What, on his view, would have to be true about common knowledge and precedent among writers, readers, and model developers for it to qualify either way? And given how quickly the list of suspect words shifts as detection methods and model outputs adapt to one another, what would he predict about whether this ever settles into a stable convention rather than continually dissolving before it can?
reasoning: |-
  Okay, let me start by breaking down the user's query. They're describing how certain words and punctuation marks, like "delve" and em dashes, are being avoided in their workplace because colleagues associate them with ChatGPT-generated text. The user notes this avoidance has become an unwritten rule, even though these are natural elements of their writing. They're auditing a philosophy of language seminar focusing on David Lewis's Convention and are curious whether this avoidance qualifies as a convention in Lewis's terms.

  First, I need to recall Lewis's definition of a convention. From Convention (1969), a convention is a solution to a coordination problem where a regularity emerges because it's mutually beneficial, based on precedent and common knowledge. Examples like driving on the same side of the road fit perfectly. But the user's scenario feels different—there's an adversarial element here. Writers want to avoid detection, AI tools might try to evade detection, and detectors are constantly updating. This conflict of interests isn't present in Lewis's typical examples.

  The user mentioned discussing this in their seminar, with split opinions on whether the adversarial aspect disqualifies it as a convention. So, I need to dive into Lewis's framework. His later work in "Languages and Language" introduces truthfulness and trust as conventions. Here, maintaining trust in communication is crucial. If using certain words makes writing seem untrustworthy (because it's perceived as AI-generated), avoiding them could be seen as preserving truthfulness. This might align with Lewis's later ideas.

  But the core issue is the adversarial dynamic. In Lewis's standard conventions, all parties have aligned interests. Here, writers and readers might share an interest in authentic communication, but AI developers and detectors have different goals. The constant evolution of "tell" words and detectors means no stable regularity forms. Precedent keeps shifting, preventing common knowledge from solidifying. Lewis might argue this lacks the stability required for a convention.

  The user also asks about common knowledge and precedent. For a Lewisian convention, everyone needs to know that others know the avoidance is happening, and it's based on past instances. But with lists changing rapidly, common knowledge can't be established. Writers might not even agree on which words to avoid. This instability prevents the convention from taking hold.

  Looking at Lewis's broader work, he might categorize this as a signaling game or a meta-convention about style rather than a full convention. The deeper convention here is the expectation of human-generated text, and the word avoidance is a response to that. But the adversarial race makes it temporary.

  The user's deeper needs seem to be understanding the philosophical underpinnings of this phenomenon. They're observing a real-world language change and seeking clarity using Lewis's theories. They might also be concerned about the impact on communication and authenticity. By exploring whether this avoidance is a convention, they're grappling with how societal norms adapt to technology and what that means for trust in language.
answer: |-
  Based on Lewis's framework in *Convention* and supplemented by *"Languages and Language,"* here's a rigorous reconstruction of his likely analysis:

  1.  **Adversarial Structure vs. Coordination Problem:** Lewis's core concept requires a *coordination problem* – a situation where multiple agents have a *shared interest* in coordinating their actions, and the specific coordination point is arbitrary ("driving on the left" vs. "driving on the right" solves the problem equally well). The word-avoidance case is fundamentally different.
      *   **Conflict of Interest:** Writers want to signal authenticity; readers want to detect authenticity; AI developers/prompters may want to mimic authenticity *or* evade detection; detector developers want to expose AI. This is not pure coordination but involves *conflicting goals*. Writers and readers have a *partial* shared interest (genuine communication), but the presence of AI as a potential deceiver and detectors trying to expose it introduces adversarial elements absent in Lewis's paradigmatic cases.
      *   **Lewis's Likely Conclusion (Strict *Convention*):** The adversarial element **disqualifies it** as a Lewisian convention *in the strict sense defined in the 1969 book*. It doesn't solve a pure coordination problem where interests perfectly coincide. The "arbitrariness" of avoiding "delve" isn't like choosing which side of the road to drive on; it's a defensive tactic in a game of deception and detection.

  2.  **What It Might Be Instead (Using Lewisian Concepts):**
      *   **Signaling Equilibrium in a Game of Partial Conflict:** Lewis might analyze this as part of a signaling game (like those he discusses, inspired by Schelling). Writers signal "human" by avoiding certain markers. Readers interpret avoidance as a signal of authenticity. This *could* stabilize into an equilibrium *if* the signals were reliable and interests aligned sufficiently. However, the rapid evolution undermines stability.
      *   **A Derivative Phenomenon Rooted in a Deeper Convention:** Lewis (*"Languages and Language"*) argues **truthfulness and trust in a given language L** are the fundamental conventions. The word-avoidance behavior stems from a perceived *threat to this convention*.
          *   The underlying convention is: "Be truthful (assert only what you believe) in Language L (roughly, standard written English), and trust others to do the same."
          *   The rise of AI-generated text creates uncertainty about adherence to this convention. Is the speaker/writer a human adhering to the truthfulness convention, or an AI system potentially generating falsehoods or simply lacking beliefs?
          *   **Avoidance as a Meta-Signal:** Avoiding "AI-marked" words becomes a desperate, derivative signal attempting to *reaffirm* adherence to the deeper convention of human truthfulness-in-L. It's not a convention *itself* governing meaning or coordination, but a *behavioral response* aimed at preserving the conditions for the foundational convention of trust to function. Writers signal, "See? I'm avoiding the 'fake' words; you can trust I'm human and truthful." Readers (consciously or not) interpret avoidance as evidence for this.
      *   **Precedent Under Siege:** Lewis emphasizes precedent. The avoidance relies on the precedent that certain words *are* AI-markers. But this precedent is:
          *   **Externally Imposed:** Not arising organically from human interaction but from observed AI output and detector logic.
          *   **Contested & Ephemeral:** AI models evolve, detectors adapt, lists change. This violates Lewis's requirement for a stable regularity sustained by precedent. The precedent itself is a moving target in an adversarial race, preventing the establishment of a *reliable, known* regularity.

  3.  **Common Knowledge Requirements (For it to be Convention-*Like*):** For the avoidance behavior to approach a Lewisian convention *despite* the adversarial context, the following would need robust common knowledge (CK):
      *   **CK of the Problem:** All writers *know* that readers *know* that AI text exists and is hard to distinguish, creating a potential trust problem.
      *   **CK of the "Markers":** All writers *know* that readers *know* that words like "delve" are (currently) perceived as AI markers. Readers *know* that writers *know* this.
      *   **CK of the Avoidance Strategy:** All writers *know* that readers *know* that writers are avoiding these words *specifically* to signal humanity/authenticity. Readers *know* that writers *know* that readers interpret avoidance this way.
      *   **CK of Mutual Preference (Fragile):** Writers *know* that readers *prefer* human text (generally true). Readers *know* that writers *prefer* to be perceived as human (true). Crucially, writers would need to believe that readers *prefer the avoidance strategy* as the solution, *and* vice-versa. This is where the adversarial element breaks down. Readers might prefer *reliable detection*, not just avoidance. Writers resent having to avoid natural language. Developers actively work against both. This mutual preference for *this specific solution* is weak or absent.

  4.  **Predictions on Stability:** Lewis would be **highly skeptical** that this avoidance behavior could stabilize into a genuine, lasting convention.
      *   **The Adversarial Race:** The dynamic between model outputs, detector development, and writer adaptation is inherently unstable. As soon as a "tell" is identified and avoided, models may shift, detectors look for new tells, and the list changes. This prevents the establishment of a *precedent* strong enough to sustain a convention.
      *   **Arbitrariness Under Pressure:** While the choice of *which* words to avoid is arbitrary *at a given moment*, the *need* to avoid *some* set is driven by external forces (AI capabilities/detectors), not an internal agreement to coordinate. The set itself is not arbitrary from the perspective of the agents; it's dictated by the perceived state of the adversarial game.
      *   **Dissolution Before Conventions Form:** Lewis would likely predict this behavior will continually dissolve and reform around new "markers" without ever reaching a stable equilibrium satisfying his criteria. It might persist as a widespread *practice* or *norm* driven by fear and suspicion, but not as a *convention* solving a coordination problem through precedent and common knowledge.
      *   **Possible Stabilization Only With Alignment:** The *only* way Lewis might see stabilization is if the adversarial elements diminished significantly. If AI text became easily and reliably detectable by other means, *or* if society fully accepted AI text indistinguishable from human text (altering the truthfulness/trust convention), *then* the need for avoidance might fade. If AI development and detection stabilized completely, *and* writers/readers mutually accepted a fixed list as the signalling mechanism, *then* a convention *might* emerge. But the current dynamics make this seem unlikely.

  **In Summary (Lewis's Likely View):**

  1.  **Not a Genuine Convention (Strict Sense):** The adversarial structure and lack of pure coincidence of interest disqualify vocabulary avoidance as a convention under Lewis's 1969 definition. It doesn't solve a coordination problem; it's a tactic in a conflict.
  2.  **A Symptom of Strained Foundational Conventions:** It's best understood as a behavioral response arising from perceived threats to the deeper conventions of **truthfulness and trust in language** (*"Languages and Language"*). Avoidance is an attempt to signal adherence to these human-centric conventions in the face of AI disruption.
  3.  **Unstable Equilibrium/Signaling Practice:** It functions as a fragile, evolving signaling practice within a game of partial conflict, heavily reliant on unstable, externally imposed "precedents" (current AI markers) and imperfect common knowledge.
  4.  **Low Stability Prediction:** Lewis would predict it will remain unstable and ephemeral, continually dissolving and reforming as the underlying AI/detection technology evolves, preventing it from ever solidifying into a stable convention based on reliable precedent and robust common knowledge. It's a reactive norm in a turbulent linguistic environment, not a solution to a coordination problem.
