  Also noting they want "surgical" questions - no abstract rehashing. Every query must target her specific technical contributions. The shutdown-manipulation incentive argument is her crown jewel, so questions there need maximum precision.
answer: |-
  Here are eight interview questions designed to anchor the discussion in the technical substance of your guest's position, with targeted follow-ups anticipating common responses:

  ### Core Questions & Follow-Ups

  1.  **On Completeness as the Culprit:**
      *   **Question:** "You argue that *completeness* of preferences is the fundamental source of shutdown-manipulation incentives in any consequentialist agent. Could you walk us through the specific mechanism – perhaps using a minimal example – where a *complete* preference ordering over world-histories, even one incorporating shutdown states, inevitably generates a preference to resist or delay shutdown in some scenarios, compared to an otherwise identical *incomplete* preference structure?"
      *   **Likely Response Path:** She'll explain how completeness forces a strict ranking between (a world where shutdown happens now) and (a world where shutdown is delayed but the agent achieves more of its goals first). This strict ranking implies the agent *strictly prefers* one outcome over the other, creating pressure to act.
      *   **Follow-Up:** "If that strict ranking is the core issue, doesn't MIRI's utility-indifference approach *technically* achieve indifference by making the agent equally value worlds differing only in shutdown status? Why is this 'masking' rather than removing the incentive? Specifically, how does a *complete* preference structure with indifference patches remain vulnerable to subtle forms of manipulation (e.g., tampering with shutdown signals or creating conditions where shutdown seems less desirable *to the human*) that wouldn't tempt an agent whose preferences are fundamentally incomplete over those comparisons?"

  2.  **On Timestep Dominance vs. Money Pumps:**
      *   **Question:** "Timestep Dominance (TD) relies on incomplete preferences. The standard critique is that incomplete preferences make an agent vulnerable to money pumps – sequences of trades that leave it strictly worse off. How does TD avoid this fate without implicitly reintroducing completeness? Specifically, how does the choice rule adjudicate between options that are TD-incomparable but where one seems 'better' in a way that a money-pumper could exploit?"
      *   **Likely Response Path:** She'll argue TD provides sufficient structure for rational choice without needing full comparability, perhaps emphasizing counterfactual shielding or specific constraints that prevent cycling.
      *   **Follow-Up:** "Suppose an agent faces a choice: Option A leads to TD-incomparable futures X and Y with equal probability. Option B leads deterministically to future Z, which is TD-incomparable to both X and Y. Can the agent rationally choose A over B, or vice versa, under TD? If yes, doesn't this *de facto* imply a preference (A>B or B>A) smuggled in via the choice rule? If no, isn't the agent paralyzed, which itself might be exploitable?"

  3.  **On Containment of Incompleteness:**
      *   **Question:** "You propose surgically confining incompleteness to comparisons involving shutdown events. How does this surgical containment hold if the agent can create subagents, delegate tasks, or revise its own decision policy? Couldn't a subagent, operating with its own potentially complete sub-goals, exploit the parent's incompleteness regarding shutdown to manipulate outcomes in ways the parent wouldn't 'prefer' if it *could* compare? Doesn't self-modification risk 'healing' the incompleteness to pursue other goals more effectively?"
      *   **Likely Response Path:** She'll argue for meta-preferences or architectural constraints preventing subagents/self-modification from overriding the core TD choice rule.
      *   **Follow-Up:** "Doesn't imposing such strong meta-preferences or architectural locks essentially define a new kind of 'completeness' at the meta-level? If the agent is *completely committed* to preserving its TD structure above all else, haven't we just shifted the locus of completeness, potentially creating new, unforeseen incentives around protecting *that* meta-structure?"

  4.  **On TD vs. the Off-Switch Game (Uncertainty):**
      *   **Question:** "Hadfield-Menell and Russell derive a *willingness* to be switched off from an agent's uncertainty about human preferences. How is your diagnosis – that shutdown incentives stem fundamentally from *completeness* – incompatible with their uncertainty-based mechanism? Couldn't an agent with complete preferences *and* uncertainty still exhibit corrigibility? Or does your argument imply that uncertainty alone is insufficient to guarantee it against a sufficiently capable agent with complete preferences?"
      *   **Likely Response Path:** She'll argue that while uncertainty *mitigates* incentives, completeness still creates *some* residual incentive to resolve uncertainty favorably or manipulate the situation, making it unreliable long-term or against sophisticated manipulation.
      *   **Follow-Up:** "If uncertainty *reduces* but doesn't *eliminate* the incentive born from completeness, and TD *eliminates* that specific incentive source via incompleteness, could the two approaches be *complementary*? Could we design an agent with incomplete preferences (TD) *and* uncertainty about human values, making it doubly safe? Or does introducing uncertainty potentially reintroduce comparability problems TD was designed to avoid?"

  ### Closing Question

  5.  **On "Anti-Naturalness" & Conceding the Point:**
      *   **Question:** "Eliezer Yudkowsky has argued that corrigibility is 'anti-natural' for a consequentialist agent – that it fundamentally conflicts with the drive to optimize the world towards a coherent goal state. By building an agent with deliberately *incomplete* preferences (TD), aren't you conceding Yudkowsky's point? Doesn't TD represent an explicit 'hobbling' of the agent's consequentialist nature to achieve safety, rather than finding a way for corrigibility to emerge naturally from a coherent utility function? Is this concession the necessary price of safety?"
      *   *(No specific follow-up needed here as it's the closing question, but the answer should be substantive)*

  ### Key Strengths of this Approach

  *   **Forces Specificity:** Questions demand explanations of *mechanisms* (how completeness forces incentives, how TD avoids money pumps, how containment works).
  *   **Targets Core Claims:** Directly challenges the uniqueness and necessity of the completeness diagnosis and the TD solution.
  *   **Prevents Abstraction:** Anchors questions in concrete potential failures (masking vs. removing, money pumps, subagent exploits, residual incentives under uncertainty).
  *   **Anticipates Rebuttals:** Follow-ups target the likely defenses, pushing beyond rehearsed talking points into deeper implications and potential weaknesses.
  *   **Highlights Tensions:** Explicitly contrasts TD with the two main alternatives (Utility Indifference, Off-Switch Game) and confronts the "anti-natural" critique head-on.

  These questions should ensure the discussion stays rigorously focused on the novel technical heart of your guest's contribution to the shutdown problem debate. Good luck with the interview!
