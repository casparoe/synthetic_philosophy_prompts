prompt: |-
  I've spent the past couple of weeks reading deeply into the literature on hard choices and value incomparability, partly spurred by a disagreement with a friend over whether "shut up and multiply"-style expected-value reasoning ever really breaks down, or whether any two options are always comparable in principle once you specify a fine-grained enough utility function. Ruth Chang's work keeps coming up as the canonical rebuttal: she argues that in cases like the stock career-choice examples common in this literature (a demanding, lucrative path versus a much less lucrative but more intrinsically fulfilling one, say), the two options are neither better, worse, nor equally good, and yet still fully comparable, because they stand in a fourth basic relation she calls being "on a par." This is meant to be an alternative both to the traditional "Trichotomy Thesis" (that comparability requires one of better/worse/equal) and to Joseph Raz's older claim that such pairs are simply incommensurable, related by no evaluative relation at all.

  What I haven't managed to reconstruct cleanly for myself is the actual logical structure of Chang's "small-improvement argument" for why parity has to be a distinct, sui generis relation, rather than just a loose way of describing rough or imprecise equality. As I understand it, the argument turns on the idea that a small enough improvement to one of the options is guaranteed to break a relation of exact equality, but need not break parity — yet I can't quite see why that asymmetry is supposed to rule out the two options simply being vaguely equal rather than on a par in Chang's stronger sense. Could you walk me through the argument step by step, and then help me weigh how much force it really has against John Broome's rival proposal that what Chang calls "parity" is really just vagueness in the predicates "better than" and "worse than," rather than evidence of some fourth determinate relation? I'd especially appreciate it if you could say what, if anything, would count as evidence capable of adjudicating between the two views, since from where I'm sitting they seem to predict much the same pattern of first-order intuitions about particular cases.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been diving into hard choices and value incomparability, specifically Ruth Chang's work on parity versus vagueness. The user is stuck on understanding Chang's small-improvement argument and how it differentiates parity from rough equality. They also want a comparison with Broome's vagueness view and evidence to adjudicate between them.

  First, I need to recall Chang's argument structure. The user mentions the asymmetry where a small improvement breaks equality but not parity. Why isn't that just vagueness? The key is that in vague equality, a small improvement might flip the relation due to borderline cases. But Chang argues that in parity cases, even after an improvement, the options still aren't clearly better/worse, and further improvements don't necessarily resolve it. That persistence suggests a different relation.

  Broome's position is that "better than" is vague. So, when two items are roughly equal, it's because we're in the vague range where neither is determinately better. The small improvement might push one into being better, but due to vagueness, there's no sharp point where this happens. The challenge is that both views predict similar intuitive judgments in many cases. The user is right to point out the similarity in predictions.

  Now, the user wants evidence to decide between the two. I should think about what each theory implies differently. Chang's parity requires a fourth relation, so it might predict that in some comparisons, even after improvements, choices remain hard without one option being superior. Broome's vagueness, however, might allow for cases where sufficient improvement eventually tips the scale determinately. But since vagueness lacks sharp boundaries, it's tricky. 

  Empirical methods could help. For example, studies on choice behavior. If people consistently rate options as incomparable even after small improvements, and this persists across contexts, that might favor Chang. If instead, reactions vary with framing or context, vagueness might explain it better. Also, normative implications: if parity exists, it supports the possibility of rational choices based on commitment rather than betterness. Vagueness might still allow for practical rationality through tie-breaking methods.

  The user's deeper need seems to be resolving a philosophical disagreement with their friend about comparability. They might want clarity on whether hard choices involve a unique relation (Chang) or epistemic uncertainty (Broome). Understanding the evidence could help them take a side in the debate or recognize the limitations of each view.
answer: |-
  Here's a step-by-step breakdown of Chang's Small Improvement Argument (SIA) for parity, followed by a comparison with Broome's vagueness view and an analysis of potential evidence to distinguish them:

  ### Ruth Chang's Small Improvement Argument (SIA) for Parity

  1.  **The Core Intuition:** Consider a paradigmatic hard choice (e.g., Career A: high salary, low meaning vs. Career B: low salary, high meaning). Intuitively:
      *   A is not better than B.
      *   B is not better than A.
      *   A and B are not equally good (their values differ significantly in kind, not just degree).
      *   Yet, they *are* comparable – we can deliberate meaningfully between them; one isn't simply "junk" compared to the other.

  2.  **The Challenge:** The standard "Trichotomy Thesis" says if two items are comparable, one *must* be better, worse, or equal. Raz's incommensurability denies comparability. Chang argues both are wrong for these cases.

  3.  **The Argument Setup:**
      *   Consider two options, A and B, in a hard choice scenario.
      *   Suppose, for the sake of argument, that A and B are *roughly equal* (the vagueness proposal).
      *   Now, make a *small improvement* to one option, say A, creating A+ (e.g., a slightly higher salary for Career A).

  4.  **The Crucial Step - Impact on Relations:**
      *   **If A and B were *exactly* equal:** Any improvement to A, no matter how small, would make A+ *definitively better* than B. Equality is precise and fragile.
      *   **If A and B were *roughly equal* (due to vagueness):** A small improvement *might* be enough to make A+ determinately better than B, *or* it might leave them still roughly equal (within the vague zone). It depends on the size of the improvement relative to the "borderline" area of the vague predicate "better than".
      *   **Chang's Claim (The Parity Intuition):** In the hard choice cases she targets, a small improvement (like a slight salary bump for A) *does not* suddenly make A+ determinately better than B. B still isn't worse than A+; A+ still isn't clearly better than B; and they certainly aren't equal. Yet, they remain comparable.

  5.  **The Inference to Parity:**
      *   The persistence of the relation (neither better, nor worse, nor equal) even *after* a small improvement rules out **exact equality** (which would be broken by any improvement).
      *   This persistence *despite* the improvement also rules out the idea that A and B were simply **incomparable** (Raz's view) – the improvement didn't suddenly make them comparable; they were comparable before and remain comparable after.
      *   Crucially, Chang argues this persistence is *incompatible* with **rough equality understood as vagueness in the "better than" relation**. If vagueness were the explanation:
          *   A small improvement *should* either push A+ clearly into being better than B, or leave them still vaguely equal/borderline.
          *   But in the parity case, after the improvement, we *still* have the strong intuition: A+ is *not better* than B, B is *not better* than A+, and they are *not equal*. This is a *determinate* judgment about the relation holding, not an admission of vagueness or borderline status.
      *   Therefore, the relation between A and B (and now between A+ and B) must be a distinct, fourth basic relation: **Parity**. Items on a par are comparable, one isn't better, but they aren't equal; they are in the same "neighborhood" of value but can differ significantly.

  6.  **Why "Vague Equality" Isn't Enough for Chang:** The vagueness view predicts that around the "borderline," judgments become indeterminate or conflicted ("Is A+ better? Well, it's kinda borderline... maybe?"). Chang contends that in parity cases, our judgment is *determinate*: we *know* A+ is not better than B, even after the improvement, and we *know* they aren't equal. The relation itself is determinate – it's the *relation of parity*, not an indeterminate instance of "better than" or "equal to".

  ### John Broome's Vagueness Challenge

  Broome argues that what Chang identifies as parity is simply the result of **vagueness in the comparative predicates "better than" and "worse than"**:

  1.  **Vagueness in Betterness:** The predicate "better than" is vague. There are clear cases (A is better than C), clear cases (B is better than D), and borderline cases where it's indeterminate whether A is better than B.
  2.  **Hard Choices as Borderline Cases:** In Chang's career example, it's *indeterminate* whether Career A is better than Career B, and indeterminate whether Career B is better than Career A. This is the zone of vagueness.
  3.  **Small Improvements Explained:** A small improvement (A+) might still leave it indeterminate whether A+ is better than B. The improvement wasn't big enough to push the comparison out of the vague borderline region into the determinate "better than" zone. We remain in a state of indeterminacy.
  4.  **No Need for a Fourth Relation:** All the phenomena Chang describes – the failure of Trichotomy in these cases, the persistence of non-betterness after small improvements, the sense of comparability – are fully explained by the vagueness inherent in the standard betterness relation. Introducing a distinct "parity" relation is unnecessary ontological inflation.
  5.  **"Equal" is Precise:** Broome often emphasizes that "equally good" is a *precise* relation. If two things aren't precisely equal, they aren't equal at all. The vague relation isn't "rough equality," but rather *indeterminate betterness*. So, the options aren't "roughly equal," it's indeterminate which, if either, is better.

  ### Weighing the Views and Adjudicating Evidence

  *   **Predictive Overlap:** You are correct that both views predict similar first-order intuitions in many cases: neither option seems clearly better, small improvements don't necessarily resolve the issue, choices feel hard but meaningful.
  *   **Key Difference:** The core difference is **ontological** and **explanatory**:
      *   **Chang:** Posits a new, *sui generis*, determinate relation (parity) to explain the determinate judgment that A is not better than B, B is not better than A, and they aren't equal, *even after improvements*.
      *   **Broome:** Explains the same judgments as resulting from the *indeterminacy* of the existing betterness relation in borderline cases. The judgment "A is not better than B" is true because it's indeterminate whether A is better, not because they stand in a new, determinate fourth relation.

  **Potential Evidence for Adjudication:**

  1.  **Persistence of Non-Betterness After *Significant* Improvements:** Chang's view predicts that even relatively large improvements to one option might *still* leave the improved option not determinately better than the other (as long as they remain "on a par"). Broome's vagueness view predicts that a *sufficiently large* improvement *must* eventually push the comparison out of the borderline vague zone, making the improved option determinately better.
      *   *Problem:* How large is "sufficient"? Vagueness inherently lacks sharp boundaries. Chang could argue that what counts as "significant" enough to break parity is itself context-dependent and not defined by a sharp threshold.
  2.  **Patterns of Choice/Justification:** Chang argues that if options are on a par, either choice can be rational, justified by the agent's commitment or will (not by the options' betterness). If the relation is merely vague indeterminacy, choice might be seen more as picking arbitrarily within an epistemically underdetermined zone, or justified by secondary considerations (tie-breakers) rather than genuine commitment. Studying how people *justify* hard choices and whether they appeal to "commitment" (Chang) or "it was a toss-up/no clear reason" (Broome) could offer evidence.
  3.  **The Nature of Regret/Residue:** Does the "chosen road/not chosen road" feeling persist differently? Chang might predict a specific, perhaps more profound, residue when choosing between true peers that feels different from the residue of an arbitrary choice within a vague range. Broome might see the residue as similar in both cases – stemming from the indeterminacy itself.
  4.  **Formal Modeling & Scope:** Can Broome's vagueness model (e.g., using supervaluationism) adequately capture *all* the intuitive judgments Chang describes without collapsing or generating counterintuitive results in complex multi-option comparisons or chains? Does Chang's parity relation integrate cleanly into a formal value theory without paradox? (This is highly technical).
  5.  **Conceptual Analysis of "Comparability":** Chang argues that genuine incomparability (Raz) involves options being so different that comparison is impossible or meaningless. Vagueness (Broome) involves indeterminacy *within* a comparison. Parity involves a *determinate comparable relation* that isn't better/worse/equal. Which best captures the *phenomenology* of deliberation in hard choices? Does it feel like groping in the fog (Broome) or seeing two distinct, comparable paths clearly related in a non-hierarchical way (Chang)?

  **Conclusion:**

  Chang's SIA powerfully challenges the idea that hard choices *must* reduce to rough equality or indeterminacy. The argument hinges on the *determinate* judgment of non-betterness persisting after improvements, which she claims rules out exact equality and cannot be fully captured by vagueness (which predicts indeterminacy, not determinate non-betterness). Broome offers a robust alternative by locating the phenomenon entirely within the vagueness of "better than," arguing this is more parsimonious.

  Ultimately, the debate is difficult to settle empirically because the core difference lies in the interpretation of our normative judgments and the underlying metaphysics of value relations. **The strongest potential evidence leans towards:**

  *   **Observing whether *any* amount of improvement to one option *always* eventually makes it determinately better** (supports Broome/vagueness) or whether there are cases where **significant improvements still leave neither option determinately better, worse, or equal** (supports Chang/parity).
  *   **Analyzing the phenomenology and justification of actual hard choices:** Do people experience and describe them as involving a commitment between peers (Chang) or as navigating an indeterminate fog where reasons run out (Broome)?

  Both views offer compelling accounts. Chang's provides a richer ontology for the distinct *feel* of peer comparisons, while Broome's maintains greater theoretical parsimony by relying on a well-understood phenomenon (vagueness). The choice between them may partly depend on whether one finds the intuition of a *determinate* fourth relation in hard choices as compelling and irreducible as Chang does.
