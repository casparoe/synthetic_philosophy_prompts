prompt: |-
  Been rereading old Yudkowsky posts on CEV and I still dont get why its supposed to be better than just running a giant global survey on values and going with whatever most people land on. Like isn't "extrapolate everyone's volition and find where it coheres" basically just polling with extra steps? Feels like it should still run into all the same aggregation problems (Arrow's theorem etc) that regular democratic voting does, so why does CEV get treated like it sidesteps that whole mess?
reasoning: |-
  Okay, the user is struggling to understand why CEV (Coherent Extrapolated Volition) is considered superior to a simple global survey for determining human values. They're rereading Yudkowsky's posts but still don't see the distinction. Let me unpack their confusion.

  First, they think CEV is just "polling with extra steps." That's a common misconception. The key difference is in the extrapolation part. A survey captures people's current, often contradictory preferences. CEV aims to model what people would want if they were more rational, informed, and self-aware. 

  The user mentions Arrow's theorem, which is about aggregating preferences under voting systems. CEV tries to bypass this by not aggregating preferences at all. Instead, it looks for coherence in idealized versions of individuals. If everyone had perfect knowledge and rationality, their values might converge naturally. That's the core idea.

  The user might be frustrated with abstract philosophical arguments. They want concrete reasons why CEV avoids real-world voting problems. I should emphasize the difference between surface-level preferences (which conflict) and deep values (which might align under ideal conditions). 

  Also, the user might be missing the evolutionary psychology angle. Humans have messy preferences due to cognitive biases and historical baggage. CEV strips that away to find what we'd value without those constraints. 

  I should clarify that CEV isn't a decision procedure but a discovery process. It's not counting votes; it's simulating wiser versions of ourselves and seeing where their values overlap. That's fundamentally different from polling. 

  The aggregation problem in Arrow's theorem assumes fixed, conflicting preferences. CEV assumes that idealized preferences aren't fixed and might not conflict. That's the big leap. 

  The user seems analytically minded but stuck on the "how." They need to understand the mechanism, not just the theory. I'll break down the extrapolation process step by step in my response.
answer: |-
  You've hit on a core tension in CEV (Coherent Extrapolated Volition)! Yudkowsky *does* claim it sidesteps Arrow's Theorem and democratic aggregation problems, but it's subtle and controversial. Here's why CEV is framed as fundamentally different from a giant poll:

  1.  **It's Not About Aggregating *Actual* Preferences, But *Extrapolated Idealized* Preferences:**
      *   **Survey:** Asks "What do you value *right now*, with your current knowledge, biases, and cognitive limitations?" You get a snapshot of messy, often contradictory, context-dependent preferences influenced by ignorance, advertising, short-term thinking, etc.
      *   **CEV:** Asks "What would this *specific person* value if they were:
          *   **More Rational:** Thinking clearly, free of cognitive biases (e.g., akrasia, sunk cost fallacy, scope neglect).
          *   **More Informed:** Possessing vastly more knowledge about the world, consequences, and themselves.
          *   **More Coherent:** Able to resolve internal inconsistencies in their own values.
          *   **More Self-Aware:** Understanding their "true" motivations and desires beneath surface impulses or societal conditioning.
      *   **Key Difference:** CEV doesn't aggregate *your current vote*. It simulates *a vastly improved, idealized version of you* and asks *that entity* what it values. It's modeling individuals *individually* at their hypothetical peak coherence.

  2.  **The "Coherence" Step Happens *Before* Aggregation (If Aggregation is Even Needed):**
      *   **Survey/Aggregation Problem:** Takes millions of conflicting, inconsistent preference sets and tries to mash them together into one societal choice. Arrow's Theorem shows this is impossible to do fairly under reasonable assumptions.
      *   **CEV Process:**
          1.  **Extrapolate Individually:** For each person, simulate what their *idealized, coherent self* would want. This resolves *internal* contradictions *within each person's value system*.
          2.  **Find Overlapping Consensus/Coherence:** *Then* look across all these idealized extrapolations. The core claim is that **if people were fully rational, informed, and coherent, their values would converge significantly.** They'd recognize shared fundamental goals (flourishing, understanding, avoiding suffering, growth) and resolve conflicts based on deeper principles rather than ignorance or bias.
      *   **Why This Might Avoid Arrow:** Arrow assumes fixed, conflicting preferences. CEV assumes the extrapolation process *changes* the preferences being aggregated by making them individually coherent and potentially much more aligned. It's aggregating the outputs of a transformative process, not raw inputs. If the extrapolated volitions are sufficiently similar, aggregation might be trivial (e.g., implement the shared core) or resolvable through rational discourse *between* the idealized agents.

  3.  **It's Discovery, Not Voting:**
      *   **Survey/Democracy:** A procedural method to *make a decision* with conflicting inputs. The outcome is defined by the aggregation rule (majority, ranked choice, etc.).
      *   **CEV:** An epistemological/axiological method to *discover* what humanity *"truly"* values at its best. The "coherent" outcome isn't defined by a voting rule; it's supposedly *revealed* by the extrapolation process itself. It seeks an objective (though complex) fact about idealized human psychology.

  4.  **Addressing the "Polling with Extra Steps" Feeling:**
      *   The "extra steps" (massive cognitive enhancement, resolving internal conflicts, gaining perfect knowledge) are **the entire point.** They are transformative. A poll asks the confused, conflicted, partially ignorant you. CEV asks the "you" that has overcome those limitations. The hope is that the outputs are qualitatively different and inherently more compatible.
      *   **Analogy:** Asking a group of toddlers what they want for dinner (survey) vs. asking those same individuals, but as educated, health-conscious, empathetic adults who've reflected deeply on nutrition and ethics (CEV extrapolation). The latter group's preferences are likely far more coherent and compatible.

  **Why Critics Remain Skeptical & The Problems Don't Fully Disappear:**

  1.  **The Extrapolation Process is Vague & Magical:** *How* do you simulate this idealized version? How do you resolve internal conflicts? How much knowledge is "enough"? This is handwaved as an AI-complete problem. The output is highly dependent on the (undefined) extrapolation algorithm.
  2.  **Convergence is an Assumption, Not a Guarantee:** Why *would* idealized human values converge? While shared biology and fundamental needs suggest overlap, deep philosophical differences (e.g., about the nature of the good life, the value of suffering, the priority of individuals vs. collectives) might persist or even deepen with more knowledge and rationality. CEV optimistically assumes these would resolve into harmony.
  3.  **Aggregation Might Still Be Necessary:** Even if idealized values overlap 90%, the remaining 10% divergence could be critical. How *do* you resolve conflicts between coherent-but-different extrapolated volitions? This reintroduces aggregation problems, albeit perhaps on a smaller scale with more compatible inputs.
  4.  **The "True Self" Problem:** Is there even a single, coherent "true volition" to extrapolate to? Human values are complex, context-dependent, and evolve. The idea of a single "ideal" endpoint might be philosophically flawed.
  5.  **Who Controls the Extrapolator?** Defining the CEV process inherently involves making value-laden choices about what "rationality," "coherence," and "idealization" mean. This creates a massive locus of power.

  **In Summary:**

  CEV claims to sidestep Arrow's Theorem **not** by finding a better voting system, but by **transforming the inputs** to aggregation. It argues that by making each individual's preferences *individually coherent and idealized* first, the resulting set of preferences will be so naturally compatible that aggregation becomes trivial or fundamentally different from summing raw, conflicting votes. The "coherence" is found *within* and *between* the idealized individuals through the extrapolation process itself, not imposed by an external voting rule.

  Whether this actually works or just moves the aggregation problem into the black box of "extrapolation" is the core of the debate. Yudkowsky bets heavily on human values fundamentally converging under ideal rationality and knowledge. Skeptics see this as wishful thinking that underestimates persistent, deep value pluralism. It's less "polling with extra steps" and more "radically transforming the poll respondents before asking the question."
