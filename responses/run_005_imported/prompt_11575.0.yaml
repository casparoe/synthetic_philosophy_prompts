prompt: |-
  I'm currently taking a seminar on practical rationality that's cross-listed between the philosophy and economics departments, and this week's response paper has to take the form of a dialogue rather than an essay. Please write one between two equally capable interlocutors: a philosopher in the Davidsonian tradition, who holds that weakness of will is a genuine form of irrationality -- intentionally acting against one's own occurrent, all-things-considered judgment about what one has most reason to do -- and a decision theorist who argues that the hyperbolic-discounting literature (Strotz's original account of dynamic inconsistency, Ainslie's work on preference reversal, and Laibson's quasi-hyperbolic model) already explains the phenomenon in full, since a hyperbolic discounter's choice at any given moment is perfectly consistent with its preferences at that moment, leaving no judgment for the action to conflict with. Have them argue over the case of a sophisticated discounter who knowingly pays for a commitment device, such as a website blocker, since each side is convinced this case actually favors them. Rather than letting either one simply prevail, the dialogue should work toward clarifying whether they are genuinely disagreeing about the same phenomenon, or whether the decision theorist has quietly changed the subject to mere preference-change-over-time, which only resembles akrasia from the outside.
