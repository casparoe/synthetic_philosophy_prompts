prompt: |-
  I'm a phil PhD student and I help run our dept's grad colloquium Q&As -- next month's guest is a philosopher known for defending consequentialism against the cluelessness objection (the Lenman/Greaves worry that since our actions ramify unpredictably forever, consequentialism can never actually tell us what to do). Her go-to move is Greaves' simple vs complex cluelessness split, plus the claim that unforeseeable effects just wash out in expectation so we can bracket them. Can you draft me 8-10 questions that dont just let her restate that setup? I want at least one pushing on whether the simple/complex line is principled or just drawn wherever it's convenient, one on whether the "washes out in expectation" reply -- which is only supposed to dispatch simple cluelessness -- actually does anything against complex cluelessness, where the problem isn't a lack of evidence but not knowing how to weigh the evidence you do have, and one tying this to how longtermist EAs justify confidently prioritizing far-future causes while granting they're clueless in exactly that sense. For each, add a quick follow-up keyed to whatever answer she'd most likely give.
reasoning: |-
  Okay, the user is a PhD student in philosophy who helps run their department's grad colloquium Q&As. They're preparing for a guest speaker who specializes in defending consequentialism against the cluelessness objection, particularly using Greaves' framework of simple vs complex cluelessness. The speaker's approach involves arguing that unforeseeable effects "wash out in expectation," allowing consequentialists to bracket them. 

  The user wants questions that go beyond surface-level restatements of the speaker's position. They specifically request three types of questions: one challenging whether the simple/complex distinction is principled or ad hoc, one questioning if the "washes out" argument actually addresses complex cluelessness, and one connecting this to longtermist EA (effective altruism) justifications. They also want follow-ups designed to push back on predictable answers.

  Hmm, the user is clearly deeply familiar with this debate - they reference Lenman/Greaves and longtermist EA with precision. Their frustration seems to be with what they perceive as a "too-neat" solution to cluelessness. The meta-request for "questions that don't just let her restate that setup" suggests they've seen this defense presented simplistically before. 

  For the simple/complex distinction challenge: The core worry is whether "knowing the causal model" is a bright enough line. We could press on cases where we have partial models (question 1), or where the model itself contains uncertainties (follow-up to question 3). The gambler analogy might be useful here - in complex cluelessness, it's not just that we don't know the odds, but that we don't even know what game we're playing.

  For the "washes out" objection: This is subtle. The speaker claims this only solves simple cluelessness, but the user suspects it's being smuggled into complex cases. We should force a clarification on whether "washing out" requires probabilistic independence (question 2) and attack the inference from "unknown" to "cancel out" (question 4 follow-up). The key move is separating epistemic from metaphysical indeterminacy.

  For the EA connection: Longtermists openly embrace cluelessness but claim prioritization is still possible. Question 7 should juxtapose this with the speaker's framework - does their view validate or undermine longtermism? The follow-up could target whether "structural features" (like preventing extinction) genuinely escape cluelessness when downstream effects are infinite.

  Additional angles: We should include methodological questions (question 5) since the user is a grad student running a colloquium - this helps shift from debate to broader implications. The moral mathematics angle (question 6) is underdeveloped in literature and might surprise the speaker. 

  The follow-ups are designed to be "sticky" - they anticipate defensive moves. For instance, when she likely appeals to "structural reasons" in Q3, the follow-up immediately questions whether those reasons are cluelessness-proof. This prevents retreat to talking points.

  Notable omission: No direct attack on expectationism itself, which is smart - that would derail into foundational debates. The user wants immanent criticism.
answer: |-
  Here are 8 focused questions with strategic follow-ups designed to push beyond standard defenses, targeting the core tensions in her approach:

  1.  **The Principled Distinction Challenge:**  
      "You rely on Greaves' simple/complex cluelessness distinction, where simple involves *unknown probabilities* over known outcomes, and complex involves *unknown outcomes/structures*. What specific, *non-question-begging* epistemic or metaphysical criterion anchors this distinction? Couldn't an opponent argue it's drawn precisely where consequentialism *needs* it to be, to salvage action-guidance, rather than reflecting a deep difference in the nature of our ignorance?"  
      *Likely Reply Focus:* Appeals to knowing the *causal model* or *outcome space* vs. just probabilities.  
      **Follow-up:** "But doesn't 'knowing the outcome space' often involve significant idealization or tacit assumptions? For instance, when we model climate policy outcomes, we define the space based on known mechanisms, but concede deep uncertainty about cascading ecological/social effects. Isn't this 'known structure' often just *less* complex cluelessness, making the distinction a matter of degree pragmatically adopted, not a principled binary?"

  2.  **"Washes Out" & Complex Cluelessness:**  
      "The 'washing out in expectation' move addresses simple cluelessness by arguing unknown symmetric effects cancel. But complex cluelessness involves ignorance *about the very structure* of the decision problem – we don't know what outcomes are possible, relevant, or how they compare. How does the 'washing out' intuition, which presupposes a *known* outcome space over which expectations are formed, even *engage* with this fundamentally different challenge where the outcome space itself is opaque?"  
      *Likely Reply Focus:* Argues complex cluelessness is rarer or that "washing out" is a first step; appeals to structural features.  
      **Follow-up:** "If complex cluelessness means we cannot reliably specify the set of possible outcomes or their relative desirabilities, how can we even *form* an expectation in the formal decision-theoretic sense required for 'washing out'? Doesn't this render the expectation undefined or arbitrary precisely where complex cluelessness bites hardest?"

  3.  **Structural Reasons & Hidden Cluelessness:**  
      "You often appeal to 'structural reasons' (e.g., avoiding extinction, promoting resilience) to navigate complex cluelessness. But how do we justify confidence that promoting these structures reliably conduces to *good consequences overall*, given the very same indefinite ramification problem? Doesn't endorsing these structures *itself* require overcoming complex cluelessness about whether, say, resilience *in this specific context* leads to net good over vast timescales?"  
      *Likely Reply Focus:* Structures are heuristics justified by their general tendency to improve expected value under deep uncertainty.  
      **Follow-up:** "Doesn't this justification depend on a meta-level consequentialist calculation about the long-term consequences of adopting *this* heuristic? And doesn't *that* meta-calculation immediately succumb to the same complex cluelessness about the infinite ramifications of adopting one heuristic over another? Isn't this a regress?"

  4.  **The Cancellation Assumption:**  
      "The 'washing out' argument crucially relies on the assumption that unforeseeable distant effects are *probabilistically independent* and *symmetric* in expectation. What justifies this assumption, especially concerning effects that might involve existential risks, path dependencies, or sensitive dependence on initial conditions? Couldn't unforeseeable effects systematically skew towards catastrophe or salvation in ways we cannot detect?"  
      *Likely Reply Focus:* Default epistemic symmetry absent evidence; burden on objector.  
      **Follow-up:** "But isn't the burden shifted? Consequentialism requires positive justification for action. If we grant deep *structural* ignorance (complex cluelessness), doesn't the possibility of *unknown systematic skews* (e.g., unknown hidden catastrophe risks inherent in many actions) undermine the justification for assuming symmetry? Isn't 'assume symmetry' just another potentially clueless heuristic?"

  5.  **Methodology & Pragmatism:**  
      "Your approach seems deeply pragmatic – bracketing the truly intractable ignorance to focus on tractable expected value calculations. Is this best understood not as *solving* cluelessness philosophically, but as a methodological prescription for *practically navigating* it within consequentialism? Does this concede that pure, unbounded consequentialism *is* clueless, and we need pragmatic rules to make it functional?"  
      *Likely Reply Focus:* Emphasizes that this *is* what consequentialism demands under uncertainty; it's not a concession but the correct application.  
      **Follow-up:** "If it's a pragmatic move within the theory, how do we adjudicate between competing pragmatic heuristics (e.g., maximizing tractable expected value vs. a precautionary principle) *without* appealing back to consequences we are clueless about? Doesn't consequentialism lose its grip here?"

  6.  **Moral Mathematics vs. Epistemic Constraint:**  
      "Greaves frames complex cluelessness partly as a problem of 'moral mathematics' – we can't compute the net value. But isn't the deeper issue *epistemic*? It's not just computational intractability; it's that we lack the requisite knowledge *to even attempt* a meaningful computation. Does framing it as 'mathematics' downplay the radical nature of the underlying *ignorance*?"  
      *Likely Reply Focus:* Agrees on ignorance but sees the math framework as useful for modeling.  
      **Follow-up:** "If the ignorance is truly radical (unknown unknowns), doesn't formalizing it within *any* mathematical expectation model (even with Knightian uncertainty, etc.) risk giving a false sense of precision or structure that isn't justified? Is the mathematical framing itself potentially misleading?"

  7.  **Longtermism & Confident Cluelessness (EA Tie-in):**  
      "Longtermist EAs explicitly acknowledge radical cluelessness about the far future but argue we can still confidently prioritize reducing existential risk (e.g., via AI safety) based on the *magnitude* of potential effects. How does your framework, particularly the distinction between simple/complex cluelessness and the role of structural reasons, evaluate this justification? Does it validate their confidence, or reveal a tension within their own concessions of cluelessness?"  
      *Likely Reply Focus:* May align with structural reasons (preventing extinction is structurally good); may question specific cause-prioritization claims.  
      **Follow-up:** "EA longtermists often grant that *any* specific far-future intervention is clueless, but argue the sheer scale of potential value justifies focusing on *influencing the long-term trajectory*. Does this 'trajectory change' argument successfully bypass complex cluelessness, or does the problem simply reappear when evaluating *which* trajectory changes have positive expected value, given infinite ramification?"

  8.  **Alternative Frameworks:**  
      "Given the persistent challenges of complex cluelessness within your framework, do you see merit in arguments that consequentialism might need to be fundamentally *supplemented* (e.g., with agent-relative constraints, non-consequentialist virtues of decision-making under ignorance) or even *modified* in its scope (e.g., adopting a more bounded, 'near-term' focus) to provide adequate action-guidance, rather than trying to resolve cluelessness entirely on its own terms?"  
      *Likely Reply Focus:* Defends the sufficiency of the consequentialist approach under uncertainty; downplays need for supplementation.  
      **Follow-up:** "If complex cluelessness is as pervasive as critics suggest, and the consequentialist solutions rely on contestable heuristics or assumptions (like symmetry), doesn't this create a significant *practical* advantage for theories offering more robust guidance under deep ignorance, even if we grant consequentialism's theoretical supremacy?"

  **Key Strategy:** These questions force engagement with the *limits* and *assumptions* of her framework, especially the grounding of the simple/complex split, the applicability of "washing out" to complex cases, and the potential for regress/pragmatic concessions. The EA question directly ties her theory to a live debate where her distinctions should have clear implications. The follow-ups anticipate common defensive moves and push further into the underlying epistemological and justificatory challenges. Good luck with the colloquium!
