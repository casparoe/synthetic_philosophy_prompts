prompt: |-
  so for my english elective we've been reading bits of Nietzsche's Genealogy of Morals and im stuck on one paragraph from the first essay (section 13, our copy is some old early 1900s translation which prob doesnt help). here's the bit:

  "It is not surprising that the lambs should bear a grudge against the great birds of prey, but that is no reason for blaming the great birds of prey for taking the little lambs. And when the lambs say among themselves, 'These birds of prey are evil, and he who is as far removed from being a bird of prey, who is rather its opposite, a lamb,—is he not good?' then there is nothing to cavil at in the setting up of this ideal, though it may also be that the birds of prey will regard it a little sneeringly, and perchance say to themselves, 'We bear no grudge against them, these good lambs, we even like them: nothing is tastier than a tender lamb.' To require of strength that it should not express itself as strength, that it should not be a wish to overpower, a wish to overthrow, a wish to become master, a thirst for enemies and antagonisms and triumphs, is just as absurd as to require of weakness that it should express itself as strength. A quantum of force is just such a quantum of movement, will, action—rather it is nothing else than just those very phenomena of moving, willing, acting, and can only appear otherwise in the misleading errors of language (and the fundamental fallacies of reason which have become petrified therein), which understands, and understands wrongly, all working as conditioned by a worker, by a 'subject.' And just exactly as the people separate the lightning from its flash, and interpret the latter as a thing done, as the working of a subject which is called lightning, so also does the popular morality separate strength from the expression of strength, as though behind the strong man there existed some indifferent neutral substratum, which enjoyed a caprice and option as to whether or not it should express strength. But there is no such substratum, there is no 'being' behind doing, working, becoming; 'the doer' is a mere appanage to the action. The action is everything."

  i get that the lambs are the weak/slave-morality people and the birds of prey are the strong ones, thats the easy part. but then out of nowhere he starts ranting about lightning and "subjects" and how grammer tricks us into believing theres a doer behind every action, and i genuinely cant tell why any of that is even in there or how it connects back to the lambs/birds thing. is that whole lightning/language tangent actually doing real philosophical work or is it just a random digression? whats he actually arguing, and why would it matter for the master-slave morality stuff we went over in class? we've got a response paper due friday and i dont wanna just describe the metaphor without getting what's actually going on underneath it.
