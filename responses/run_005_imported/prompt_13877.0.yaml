  So I just started working as a hospital social worker, and a couple weeks ago I had a case that's still messing with my head - had to choose between keeping a patient's confidentiality and what felt like a real duty to warn a family member, and whichever way I went it felt like I was doing something wrong. I complained about it to my partner, who's doing a philosophy MA and loves nothing more than a good "well actually," and they texted me this bit from Kant's Metaphysics of Morals (Doctrine of Virtue, 6:224), basically to prove that what I felt couldn't really happen:

  Kant says flat out that "a collision of duties and obligations is inconceivable" (obligationes non colliduntur, he adds in Latin, just to really drive it home). But then like one sentence later he admits a person can have two competing "grounds of obligation" (rationes obligandi) built into the same rule, where one of them turns out not to actually be strong enough to obligate you at all (rationes obligandi non obligantes) - and when that happens, its the stronger ground that wins (fortior obligandi ratio vincit), not the stronger obligation.

  Isnt that just relabeling my hospital problem instead of solving it? "Two grounds of obligation pulling opposite ways" sounds exactly like what a dilemma feels like from the inside. Can you help me actually understand what work the rationes obligandi/duty distinction is doing for Kant here, and whether it's a serious solution to the question of genuine moral dilemmas (the kind people like Bernard Williams say leave behind guilt/"moral residue" even when you did the right thing), or just a clever bit of Latin bookkeeping?
