prompt: |-
  I'm a software engineer at an AI lab, and over the past year or so I've watched "corrigibility" turn into a genuine term of art among the alignment researchers I work alongside, especially in connection with what people now call the shutdown problem: the puzzle of how to build an agent that reliably lets itself be corrected or switched off, in a way that doesn't collapse the moment the agent becomes smart enough to reason about the incentive. Curious where these worries actually originated, I spent a weekend reading Norbert Wiener instead of another arXiv paper, and I was struck by how directly his mid-century writing on automation and feedback control — in "The Human Use of Human Beings," his 1960 Science essay on the moral and technical consequences of automation, and his last book, "God and Golem, Inc." — anticipates the shape of the modern problem, right down to his taste for old stories about wishes granted too literally. When I mentioned this to a couple of colleagues, they were skeptical that a cybernetician writing before machine learning as we know it even existed could have anything precise to contribute to a debate this technical; I suspect they're underestimating him.

  I have no formal background in philosophy, so I'd like your help settling this properly. Drawing on what you actually know of Wiener's arguments, rather than the one-line caricature of him as a generic worrier about machines, please predict in some detail how he would have judged two specific responses to the shutdown problem that circulate in the current technical literature: (1) "utility indifference" schemes, which try to engineer an agent's utility function so that it is simply indifferent between being shut down and not, and (2) proposals, like Elliott Thornley's, that abandon complete, expected-utility-maximizing preferences altogether in favor of an agent whose preferences never rank outcomes by how or when its own shutdown occurs. Would Wiener have regarded either as a genuine fix for the danger he identified, or as exactly the kind of superficially reassuring patch that his own arguments should make us suspicious of? Please commit to a specific verdict rather than simply listing considerations on both sides, and flag clearly which parts of your answer are solidly grounded in Wiener's actual writing versus your own extrapolation.
