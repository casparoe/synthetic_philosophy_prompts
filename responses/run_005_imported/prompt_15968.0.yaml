prompt: |-
  I have been rereading Thorstein Veblen's Theory of the Leisure Class (1899) with an eye to a question I want to put to my seminar on costly signaling, which draws on both evolutionary biology and economic sociology. Does Veblen's notion of "conspicuous waste" genuinely anticipate the logic of Zahavi's handicap principle, or does it only resemble that theory on the surface? Here is the passage, from Chapter IV, that I want help with:

  "From the foregoing survey of the growth of conspicuous leisure and consumption, it appears that the utility of both alike for the purposes of reputability lies in the element of waste that is common to both. In the one case it is a waste of time and effort, in the other it is a waste of goods. Both are methods of demonstrating the possession of wealth, and the two are conventionally accepted as equivalents. The choice between them is a question of advertising expediency simply, except so far as it may be affected by other standards of propriety, springing from a different source. On grounds of expediency the preference may be given to the one or the other at different stages of the economic development. The question is, which of the two methods will most effectively reach the persons whose convictions it is desired to affect. Usage has answered this question in different ways under different circumstances."

  For the handicap principle to solve the problem of honest signaling, rather than merely describing costly displays, most modern formulations (e.g., Grafen's game-theoretic formalization of Zahavi's principle) require that the marginal cost of the signal fall more heavily on low-quality signalers than on high-quality ones, so that cheap mimicry is not worth its price for the former. Read closely: does Veblen's paragraph actually supply anything equivalent to that differential-cost requirement, or does he instead secure the credibility of leisure and consumption as evidence of wealth by some other route — mere habituation of taste, sheer visibility of expenditure, "advertising expediency" in some looser sense — that would not, on its own, guarantee the signal's honesty against a determined faker? I would like a close reading of the passage on this specific point, rather than a general comparison between Veblen and Zahavi.
