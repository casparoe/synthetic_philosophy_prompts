  Looking at the quoted passage, Veblen emphasizes waste as proof of wealth, but his mechanisms seem different. When he says waste demonstrates wealth "by putting it in evidence," he's relying on visibility of expenditure. The "advertising expediency" point suggests strategic display choices, not inherent cost differentials. 

  Crucially, Veblen's focus is on accumulated wealth as the quality being signaled, whereas Zahavi deals with biological qualities. This matters because wealth signals can be faked through debt - a loophole Veblen acknowledges when discussing "conspicuous consumption of valuable goods... acquired by the labors of others." 

  The user's laser focus on the differential-cost requirement is spot on. In Veblen's framework, a poor person could theoretically fake wealth signals through temporary sacrifice (like blowing savings on one luxury item), which wouldn't work in Zahavi's model where costs are inherently higher for low-quality organisms. 

