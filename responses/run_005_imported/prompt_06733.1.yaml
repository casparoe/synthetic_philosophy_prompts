  What's the real tension here? Perhaps the user feels they're violating some probability axiom, but actually they're modeling two different questions: P(individual success) vs P(at least one failure). These have mathematically consistent answers. I should emphasize they're using probability correctly while their friend is conflating different levels of analysis.

  The resolution lies in explicitly calculating the joint probability. For 50 predictions at 90% each, P(all correct) is (0.9)^50 ≈ 0.005 - meaning 99.5% chance of at least one error. This perfectly aligns their 90% individual and 100% aggregate confidence. 

