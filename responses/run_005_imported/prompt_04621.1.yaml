  But the parliamentary model... that's trickier. Here it's not people but moral perspectives inside one person's head. The "delegates" are just metaphors for the weights you give different ethical theories. When they "bargain" it's really you calculating expected moral value. No actual consent possible because the vegan theory in your head can't refuse to participate - it's just a viewpoint you entertain. 

