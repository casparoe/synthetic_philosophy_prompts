  ### Grading of Danny's Assignment

  **Total Score: 14/20**  
  **Letter Grade Equivalent:** C+ (Note: 14/20 = 70%, which typically falls in the C+ range in many academic systems, indicating adequate but not exceptional performance.)

  ---

  #### **Part (a): Find the Nash Bargaining Solution**  
  **Points Awarded: 8/8**  
  **Comments:**  
  - **Correct approach and calculation.** Danny correctly identifies that the Nash solution maximizes \(u_1 u_2\) (since \(d = (0,0)\)).  
  - **Proper segmentation of the frontier:** The frontier is split into two linear pieces:  
    - Segment 1 (from (0,3) to (2,2)): \(u_2 = 3 - 0.5u_1\)  
    - Segment 2 (from (2,2) to (4,0)): \(u_2 = 4 - u_1\)  
  - **Valid optimization:**  
    - On Segment 1: Product \(u_1 u_2 = u_1(3 - 0.5u_1) = 3u_1 - 0.5u_1^2\). Derivative \(3 - u_1 > 0\) at \(u_1 = 2\), confirming the product is increasing up to the endpoint (2,2).  
    - On Segment 2: Product \(u_1 u_2 = u_1(4 - u_1) = 4u_1 - u_1^2\). Derivative \(4 - 2u_1 = 0\) at \(u_1 = 2\), and second derivative confirms a maximum at (2,2).  
  - **Correct conclusion:** The maximum product occurs at the kink point (2,2), which is the Nash solution.  
  - **No errors.** Full credit awarded.

  ---

  #### **Part (b): Find the Kalai-Smorodinsky Solution**  
  **Points Awarded: 2/8**  
  **Comments:**  
  - **Ideal point correct:** Danny correctly identifies the ideal point \(a = (4,3)\), as \(a_1 = 4\) (maximum for Player 1 at (4,0)) and \(a_2 = 3\) (maximum for Player 2 at (0,3)).  
  - **Ray from disagreement point correct:** The line from \(d = (0,0)\) to \(a = (4,3)\) has the equation \(u_2 = (3/4)u_1\).  
  - **Incorrect intersection with frontier:**  
    - Danny intersects \(u_2 = (3/4)u_1\) with Segment 1 (\(u_2 = 3 - 0.5u_1\)), yielding (2.4, 1.8).  
    - **Mistake:** \(u_1 = 2.4\) is outside Segment 1 (which only applies for \(u_1 \in [0,2]\)). The correct segment for \(u_1 \in [2,4]\) is Segment 2 (\(u_2 = 4 - u_1\)).  
  - **Correct calculation not performed:**  
    - Intersect \(u_2 = (3/4)u_1\) with Segment 2: \(4 - u_1 = (3/4)u_1\) → \(4 = (7/4)u_1\) → \(u_1 = 16/7 \approx 2.286\), \(u_2 = 4 - 16/7 = 12/7 \approx 1.714\).  
    - **Feasibility check:** (2.4, 1.8) is infeasible (at \(u_1 = 2.4\), Segment 2 requires \(u_2 = 1.6\), but 1.8 > 1.6). The correct KS solution is \((16/7, 12/7) \approx (2.286, 1.714)\).  
  - **Partial credit rationale:** 2 points awarded for correctly identifying the ideal point and the ray equation. However, 6 points deducted for intersecting with the wrong segment, resulting in an infeasible point and incorrect solution.

  ---

  #### **Part (c): Explain Why the Solutions Diverge**  
  **Points Awarded: 4/4**  
  **Comments:**  
  - **Accurate axiom identification:**  
    - Correctly states that both solutions satisfy Pareto efficiency, symmetry, and scale invariance.  
    - Correctly identifies that Nash satisfies Independence of Irrelevant Alternatives (IIA), while Kalai-Smorodinsky satisfies individual monotonicity (not IIA).  
  - **Clear explanation of divergence:**  
    - IIA (for Nash) implies that removing "irrelevant" alternatives (e.g., non-binding parts of the feasible set) does not change the solution.  
    - Individual monotonicity (for KS) implies that if one player's maximum possible payoff increases, their outcome should not worsen.  
    - Correctly links the divergence to the kinked frontier (different slopes), where IIA anchors to the kink (2,2), while monotonicity responds to the ideal point (4,3) and favors a proportional solution.  
  - **No errors.** Full credit awarded, as the explanation is logically sound and independent of the numerical error in (b). The phrase "exactly like we found" refers to the divergence itself (which exists), not the specific (incorrect) KS point.

  ---

  ### Summary
  - **(a):** 8/8 (Perfect)  
  - **(b):** 2/8 (Ideal point and ray correct; wrong segment intersection)  
  - **(c):** 4/4 (Perfect)  
  - **Total:** 14/20 (C+ equivalent)  
