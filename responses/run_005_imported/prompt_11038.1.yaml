answer: |-
  You're absolutely right to sense a deep philosophical connection – Sidgwick's psychical research wasn't just a quirky hobby; it was a desperate, empirical attempt to solve the profound existential crisis he identified at the heart of his own ethical system. Here's the plain-terms breakdown of the logical link:

  1.  **The Core Problem: The "Dualism of Practical Reason"**
      *   Sidgwick, with brutal honesty, concluded that rational philosophy leads to *two* equally valid but potentially conflicting ultimate principles:
          *   **Rational Egoism:** It's supremely rational for *me* to seek my *own* greatest happiness/well-being over my lifetime.
          *   **Utilitarianism:** It's supremely rational for *me* to seek the *greatest overall happiness* for *everyone* affected by my actions.
      *   **The Conflict:** What happens when maximizing the general good requires *me* to sacrifice *my own* happiness significantly (e.g., giving away my wealth, risking my life for strangers)? Egoism says "Don't do it!" Utilitarianism says "You must do it!"
      *   **The Crisis:** Sidgwick couldn't find a purely *rational* argument to prove that acting for the greater good would *always* be in the individual's ultimate self-interest *within this known, natural world*. Without this reconciliation, he saw the moral universe collapsing into "**chaos**." Reason gives us two masters who might demand opposite things. How can we live rationally in such a cosmos?

  2.  **The Proposed Solution: Cosmic Justice & Personal Survival**
      *   Sidgwick realized the conflict disappears if there's a **cosmic order guaranteeing that virtue (acting for the greater good) is ultimately rewarded commensurately.** He needed a mechanism ensuring that self-sacrifice, while painful *now*, leads to greater *long-term* personal well-being.
      *   **Enter the Afterlife:** Survival after death and a morally governed universe (potentially overseen by a God) is the *perfect* candidate for this mechanism.
          *   If I sacrifice my earthly happiness for the greater good, and an afterlife exists where I am rewarded for that virtue, then my *ultimate, long-term self-interest* is served by acting morally/utilitarianly.
          *   **The Logical Link:** `Proven Survival of Death + Moral Order → Sacrificing Self-Interest Now Serves Ultimate Self-Interest Later → Egoism and Utilitarianism Harmonize → "Cosmos" (Order) replaces "Chaos".`
      *   **Why *Proof* Was Crucial:** Sidgwick wasn't satisfied with faith or hope. As a rigorous empiricist and utilitarian committed to reason, he needed *evidence* for this cosmic justice system to make it a rationally compelling basis for ethics. Wishful thinking wasn't enough. If survival could be *proven* scientifically, it would provide the missing rational foundation to unify the dualism.

  3.  **Psychical Research: The Empirical Quest**
      *   This is where the Society for Psychical Research (SPR) comes in. Sidgwick, along with others like Frederic Myers and Edmund Gurney, saw it as a rigorous, scientific investigation into phenomena that *might* provide empirical evidence for survival:
          *   **Mediumship:** Could verifiable communication from the deceased prove their continued existence?
          *   **Apparitions:** Were reports of ghosts evidence of post-mortem survival?
          *   **Telepathy/ESP:** While not direct proof of survival, understanding "supernormal" mental phenomena might validate the possibility of consciousness existing beyond the brain/body.
      *   **The Hope:** Finding solid, repeatable evidence for any of these would be the first step towards empirically validating the existence of the afterlife and the morally governed cosmos Sidgwick *needed* to resolve his ethical dilemma. It wasn't about spooky stories; it was about gathering data to potentially prove the fundamental structure of reality required for his rational ethics to hold together.

  **In Simple Terms:**

  1.  **Sidgwick's Ethics Hit a Wall:** He proved that being selfish and being selfless are both perfectly rational, but they can clash horribly. This made the universe seem morally chaotic and irrational.
  2.  **The Only Escape Hatch:** The *only* way to fix this clash, rationally, was if the universe itself guaranteed that being selfless *always* paid off for *you* in the very, very long run.
  3.  **Life After Death = The Guarantee:** If you survive death and live in a universe run by cosmic justice (maybe God), then sacrificing your happiness *now* gets you rewarded *later*. Suddenly, being selfless *is* being selfish (in the ultimate sense). The conflict vanishes.
  4.  **But He Needed Proof:** Sidgwick, the ultimate rationalist, couldn't just *believe* this. He needed cold, hard, scientific *proof* that life after death was real to base his entire ethical system on it.
  5.  **Ghost Hunting = Scientific Investigation:** That's why he spent decades investigating mediums and ghosts – not for thrills, but as a desperate, rigorous scientific search for the evidence that would plug the hole in his philosophy and save ethics from chaos. He was trying to empirically verify the foundation his rational ethics required.

  **The Tragic Irony:** Sidgwick, after decades of meticulous investigation, found the evidence deeply unconvincing. He died believing the dualism remained unresolved, the cosmos potentially chaotic. His psychical research, far from solving his problem, became a poignant testament to the depth of the crisis he identified and the lengths a brilliant, honest mind would go to try and resolve it. The "embarrassing hobby" was, in fact, the core drama of his philosophical life.
