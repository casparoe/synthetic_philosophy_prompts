prompt: |-
  Over the last few months, a few of us in an informal reading group have been working through the "moral uncertainty" literature that has grown out of MacAskill, Bykvist, and Ord's work, and I've been trying to apply it to my own case rather than to the toy examples the literature typically uses. My credences are currently split roughly as follows: about 45% on a broadly consequentialist view where welfare aggregates in a fairly standard cardinal way; 30% on a Kantian-ish view that treats a handful of constraints (against deception, coercion, and using people merely as means) as close to inviolable rather than as one more input to be weighed against everything else; and the remaining 25% spread across virtue ethics and a more particularist skepticism that any single systematic theory captures the moral facts at all. The standard recommendation in this literature is to act so as to maximize "expected choiceworthiness" across the theories one takes seriously, weighted by credence in each. But the more I try to apply this to actual decisions — whether a small, otherwise harmless deception is licensed by a sufficiently large downstream benefit, say, or whether a promise to a friend can be outweighed by a few more impactful hours spent volunteering elsewhere — the more I run into the fact that my consequentialist credence outputs a real-valued "amount" of choiceworthiness while my deontological credence mostly just outputs "permitted" or "forbidden," with no obvious common currency between the two.

  I understand this is more or less the "intertheoretic comparisons" problem that the literature spends a great deal of effort on, and that several fixes and alternatives have been proposed: normalizing each theory's choiceworthiness scale by something like its variance or range before combining them; giving certain constraints lexical priority over any amount of expected consequentialist gain; simply acting on whichever single theory one finds most credible ("my favourite theory" approaches) rather than aggregating at all; or setting up something like a bargaining or voting procedure among sub-agents representing each theory (a "moral parliament"). I don't have a good sense of how these actually compare to one another, or of how seriously to take the worry that a hedging agent constructed this way might end up "exploitable" in some sense that a committed single-theory agent would not be (or vice versa). Could you lay out the most important implications of this literature for how someone in roughly my position should actually make decisions — including which, if any, of these approaches you think best survives scrutiny, and whether there is a principled reason to hedge across theories at all rather than simply committing to whichever single theory I currently find most credible?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a reading group on moral uncertainty, specifically MacAskill et al.'s work. Their credences are split: 45% consequentialist, 30% Kantian deontological, 25% virtue ethics and particularism. The main issue they're facing is applying expected choiceworthiness when theories use different scales—consequentialism offers cardinal values while deontology gives binary outputs. They mention the intertheoretic comparison problem and various solutions like normalization, lexical priority, my favorite theory, and moral parliament. They want to know which approach is best and whether hedging is better than committing to one theory.

  First, I need to recall the core problem. Intertheoretic comparisons are tricky because without a common scale, aggregating choiceworthiness is like adding apples and oranges. The user is struggling with real decisions, like whether a small deception for greater good is permissible. Their consequentialist side quantifies outcomes, but deontology sees it as forbidden, no matter the benefits. 

  Next, I should break down each proposed solution. Normalization methods like variance normalization or range normalization try to standardize scales. But these have issues—variance can be undefined for binary theories, and range normalization depends on possible acts, which might be infinite. Also, normalization can dilute the strength of deontological constraints. For example, if the range of deontological choiceworthiness is small, it might get overshadowed by consequentialist values even if the constraint is strict.

  Lexical priority gives absolute weight to deontology when it forbids an action. But the user has only 30% credence in deontology, so overriding consequentialism 45% of the time might not reflect their uncertainty. It also doesn't handle cases where multiple theories have lexical claims, like virtue ethics or particularism.

  My favorite theory simplifies by acting on the highest credence theory. Here, consequentialism at 45%. But this ignores the significant credence in other theories. If the user is only 45% sure, why disregard the 55%? It might lead to regret if another theory was correct.

  Moral parliament uses bargaining or voting. It's flexible but complex and underdeveloped. Different voting systems could yield different results, and setting it up requires more parameters, which might be arbitrary.

  The user also mentions exploitability. A hedging agent might be exploited if they partially follow constraints, allowing others to take advantage. But a committed agent could be exploited if their theory is wrong. There's no clear winner here.

  Underlying needs: The user wants practical decision-making guidance. They might feel stuck in theoretical solutions that don't translate to real life. They need a balance between theoretical rigor and applicability. They might also seek validation that it's okay not to have a perfect method, and that some pragmatism is acceptable.

  I should consider their meta-ethical stance. With 25% in virtue ethics and particularism, rigid systems might conflict. Particularism rejects universal rules, so any aggregation might be counter to their skepticism. Maybe recommending context-sensitive approaches or embracing some inconsistency is necessary.

  Finally, synthesizing the advice. Emphasize that no method is perfect. Suggest starting with my favorite theory due to simplicity, but switch to variance normalization if they can handle the math. Highlight the importance of revisiting credences and being pragmatic. Acknowledge that moral uncertainty is inherently messy, and partial compliance might be the best path forward.
answer: |-
  Your situation perfectly captures the core challenge of moral uncertainty: aggregating fundamentally incommensurable moral frameworks into actionable guidance. The "intertheoretic comparisons" problem isn't just theoretical; it's the practical heart of making decisions under moral uncertainty. Here's a breakdown of the main approaches, their implications for your credence distribution, and how they might play out in your examples:

  ### Core Approaches & Implications for Your Case

  1.  **Expected Choiceworthiness with Normalization (ECN):**
      *   **Concept:** Create a common scale by normalizing each theory's choiceworthiness (CW) function. Common methods:
          *   *Variance Normalization:* Scale each theory's CW so its variance over possible acts is equal (e.g., 1 unit). Requires defining a probability distribution over possible acts.
          *   *Range Normalization:* Scale each theory's CW so the difference between its maximum and minimum CW over possible acts is equal (e.g., 1 unit).
      *   **Implications for You:**
          *   **Consequentialism (45%):** Its cardinal scale gets normalized. A large benefit might become +0.8 CW, a small one +0.1 CW.
          *   **Kantian Deontology (30%):** The binary "permitted" (e.g., 0 CW) vs. "forbidden" (e.g., -1 CW) needs stretching. Range normalization might assign -1 to forbidden acts and find the "most permitted" act to assign +1 (though this feels artificial for Kantians). Variance normalization struggles because the variance of a binary function depends heavily on the probability of forbidden acts occurring.
          *   **Virtue/Particularism (25%):** Highly problematic. Virtue ethics often lacks clear cardinality. Particularism explicitly rejects systematic quantification. Normalization requires forcing them into a scale they resist.
      *   **Your Examples:**
          *   *Small Deception:* Consequentialism might output +0.1 normalized CW (small benefit). Deontology outputs -1 CW (forbidden). ECN = (0.45 * 0.1) + (0.3 * -1) + (Virtue/Partic Weighted Avg) ≈ **Strongly Negative**. *Result: Don't deceive.*
          *   *Breaking Promise to Volunteer:* Similar calculation. The large consequentialist gain (+0.8?) might outweigh the deontological -1? ECN = (0.45 * 0.8) + (0.3 * -1) + ... = (0.36 - 0.3) = +0.06 + ... *Result: Probably break the promise (but highly sensitive to normalization & virtue/partic input).*
      *   **Pros:** Most direct implementation of the "maximize expected moral value" intuition. Formally rigorous.
      *   **Cons:** Normalization is often arbitrary and theory-distorting. Binary constraints get diluted by cardinal scales. Handles virtue/particulum poorly. Requires defining a set of "possible acts," which is non-trivial.

  2.  **Lexical Priority (LP):**
      *   **Concept:** Certain moral constraints (like the Kantian prohibitions) are given infinite (or near-infinite) negative weight. If *any* theory you have credence in forbids an act, you don't do it, regardless of other theories' assessments.
      *   **Implications for You:** Your 30% Kantian credence gets immense leverage. If the Kantian view forbids an act (deception, coercion, using as means, promise-breaking?), it vetoes the act, even if Consequentialism (45%) sees huge gains and Virtue/Particularism (25%) is silent or approving.
      *   **Your Examples:**
          *   *Small Deception:* Kantian forbids → **Veto. Don't deceive.**
          *   *Breaking Promise to Volunteer:* If promise-breaking falls under a Kantian constraint → **Veto. Keep promise.** If not, proceed to weigh other theories.
      *   **Pros:** Captures the "inviolability" intuition of deontology cleanly. Simple to apply for forbidden acts. Avoids normalization mess.
      *   **Cons:** Ignores your higher credence in Consequentialism. Feels irrational if the Kantian credence is low (30%) and the consequentialist benefit is astronomically large. What if Virtue Ethics has a different lexical constraint? Doesn't help with dilemmas *within* the permitted zone.

  3.  **My Favourite Theory (MFT):**
      *   **Concept:** Ignore aggregation. Act solely according to the theory you assign the highest credence to (Consequentialism at 45%).
      *   **Implications for You:** Consequentialism dictates all decisions. Kantian constraints are ignored unless they coincidentally align with consequentialist reasoning. Virtue/Particularism is ignored.
      *   **Your Examples:**
          *   *Small Deception:* If benefits > costs → **Deceive.**
          *   *Breaking Promise to Volunteer:* If volunteer impact > cost of broken promise → **Break promise.**
      *   **Pros:** Extremely simple. Avoids all aggregation problems. Feels "decisive."
      *   **Cons:** Completely ignores significant credences (55% in non-consequentialism!). Feels reckless if the disvalued outcome (violating a constraint) is severe and you have non-trivial credence in the forbidding theory. Maximizes "regret" if the favourite theory is wrong.

  4.  **Moral Parliament (MP):**
      *   **Concept:** Imagine agents representing each theory "bargain" or "vote" on what to do. Voting rules or bargaining power could reflect credences. Theories need to justify choices to each other.
      *   **Implications for You:** 45 Consequentialist MPs, 30 Kantian MPs, 25 Virtue/Particularist MPs. Need a decision rule: majority vote? supermajority? bargaining?
      *   **Your Examples:**
          *   *Small Deception:* Kantians (30) vote NO. Consequentialists (45) vote YES. Virtue/Particularists (25) are wildcards. If they split or vote NO → **Lose, Don't deceive.** If they mostly vote YES → **Win, Deceive.** Bargaining: Kantians demand veto on deception; Consequentialists might accept this for cooperation on other issues.
          *   *Breaking Promise to Volunteer:* Similar dynamic. Kantians likely NO, Consequentialists YES, Virtue/Particularists decide.
      *   **Pros:** Flexible. Can incorporate diverse theory structures (binary, cardinal, particularist). Can model compromise and "second-personal" reasoning. Feels less reductionist.
      *   **Cons:** Highly complex and underspecified. Many parameters (voting rule, bargaining protocol) are arbitrary. Computationally difficult. Particularist "MPs" struggle to define stable positions.

  ### Addressing Exploitability & The Case for Hedging

  *   **Exploitability:** This is a serious concern, but double-edged.
      *   *Hedging Agent (ECN/LP/MP):* Might be exploited by a "single-theory demon" who forces choices where the hedger's compromise action is bad by *all* theories (e.g., partially breaking a constraint for minimal gain, violating both deontology and inefficient consequentialism). LP agents are less exploitable on their forbidden acts but may miss beneficial opportunities.
      *   *Committed Agent (MFT):* Exploitable *if their single theory is wrong*. A demon knowing you're purely consequentialist could force you into horrific constraint violations. If you're purely Kantian, they could force massive, preventable suffering.
      *   **Implication:** Exploitability arguments don't clearly favor hedging or commitment. The safer choice depends on the *nature of the moral landscape* and *what adversaries know*, which is usually unknown. Hedging tries to minimize *actual* moral error across possible worlds, which seems more robust than minimizing exploitability by a hypothetical adversary.

  *   **The Case for Hedging (vs. MFT):** Hedging is compelling because:
      1.  **Respects Credences:** Ignoring 55% credence in non-consequentialist theories (especially 30% in a strongly constraining view) seems epistemically irresponsible. Moral uncertainty is *real* uncertainty; hedging is the rational response to uncertainty about *what matters*.
      2.  **Avoids Catastrophic Error:** MFT risks massive error if the favourite theory is wrong (e.g., violating a core constraint you gave 30% credence to). Hedging (especially LP or cautious ECN) protects against the worst outcomes across theories.
      3.  **Reflective Equilibrium:** Living solely by a theory you're only 45% confident in may create psychological or practical dissonance, especially when facing clear constraint violations.

  ### Recommendations for Your Position

  1.  **Start Simple, Acknowledge Imperfection:** No method is perfect. Accept that moral uncertainty *inherently* creates messy decisions. Aim for "least bad" aggregation.
  2.  **Prioritize Managing Deontological Constraints:** Your 30% Kantian credence is the biggest aggregation challenge. Given its binary nature and your intuition about inviolability, **Lexical Priority (LP) is the most pragmatically defensible and simplest approach for acts clearly forbidden by the Kantian view.** This cleanly handles deception, coercion, etc. It respects the constraint's intended force without messy normalization.
      *   *Refinement:* Define the constraints *very carefully*. Is *every* promise-breaking covered? Is "using as a mere means" defined narrowly or broadly? LP only works if the veto is applied precisely.
  3.  **For Non-Forbidden Acts, Use Variance-Normalized ECN (with Caution):** For decisions *not* vetoed by LP, aggregate Consequentialism and Virtue/Particularism using Variance Normalization ECN. Acknowledge this is weakest for Virtue/Particularism (25%).
      *   *For Virtue/Particularism:* Treat them as offering *reasons* or *defeaters* within the ECN framework rather than full CW functions. E.g., a virtue-ethical reason against an act might subtract a fixed amount from the Consequentialist CW after normalization, or a particularist insight might override the calculation in a specific context.
  4.  **MFT as a Fallback (or for Trivial Decisions):** If LP doesn't apply and aggregating the others feels intractable or arbitrary, default to MFT (Consequentialism) due to your highest credence. This is better than paralysis.
  5.  **Moral Parliament for Complex Trade-offs:** For high-stakes decisions where the above feels inadequate, *consider* a MP model. Let the Consequentialist and Kantian "factions" debate, with Virtue/Particularism as a mediator or tie-breaker. How would they justify their position to each other? What compromise could they live with? This leverages the "second-personal" aspect often missing in ECN.
  6.  **Re-evaluate Credences & Theories:** Notice *when* aggregation feels most problematic. Does it reveal that your Kantian view isn't truly binary in practice? Does your particularism undermine the whole aggregation project? Use decision paralysis as a signal to refine your meta-ethical views or credences.
  7.  **Embrace Context & Pragmatism:** No algorithm replaces judgment. In close calls, factor in:
      *   *Severity:* How bad is the constraint violation? How large is the benefit/cost?
      *   *Confidence:* Are you *sure* the act is forbidden/permitted under each theory?
      *   *Practicality:* Can you even *implement* the "optimal" act? Is there a less problematic alternative?

  **In summary:** For decisions involving core Kantian constraints (deception, coercion, using as mere means), **use Lexical Priority** – your 30% credence justifies a veto. For other decisions, **use Variance-Normalized Expected Choiceworthiness** for Consequentialism and Virtue Ethics (treating Particularism contextually), falling back to **My Favourite Theory (Consequentialism)** if aggregation fails. View **Moral Parliament** as a deliberative tool for complex cases. **Hedging is justified** because it respects your significant uncertainty – committing solely to a 45% theory ignores too much of your own moral perspective. The "exploitability" concern is real but doesn't clearly favor one approach. Accept the inherent messiness; the goal is conscientious navigation, not perfect optimization.
