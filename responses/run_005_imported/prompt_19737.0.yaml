  We are at the third move of a six-move centipede game. The pot started at $2 and has grown to $8 because both players have passed once. Player 1 (who is about to move) must decide: take $6 (leaving Player 2 with $2) or pass and let the pot grow to $16 (so that Player 2, at the next node, would face a decision with a pot of $16). 

  The two philosophers: 
  - **Aumann Defender (AD)**: Defends that common knowledge of rationality (CKR) forces backward induction (BI) and that BI dictates taking immediately at every node. Thus, at the first node, Player 1 should have taken. Since we are at the third node, we are off the BI path, but that doesn't change what a rational player should do: at this node, Player 1 should take (and get $6) because that is the BI move from this node onward. Moreover, AD argues that the theory doesn't need to account for what happens off the BI path because the theory rules out getting there.
  - **Binmore Worrier (BW)**: Argues that if we are at the third node, then CKR must have been violated (since BI says the first player should have taken). Therefore, Player 1, now at the third node, cannot assume that Player 2 is rational. This undermines the BI reasoning from this node onward. Moreover, BW claims that a theory that is silent at the nodes that are actually reached (because they are off the BI path) is inadequate.

  Dialogue:

  **AD**: Look, we both know that in a centipede game with common knowledge of rationality (CKR), backward induction (BI) forces the first player to take at the very first opportunity. So, in an ideal rational world, we wouldn't be here at the third node. But here we are. And now, Player 1 must decide. Since we are committed to rationality, Player 1 should look at the subgame starting at this node and apply BI again. From here, the game is a smaller centipede. BI says: Player 1 should take now because if she passes, Player 2 (if rational) will take at the next node and get $16, leaving Player 1 with only $4. But if Player 1 takes now, she gets $6. So $6 > $4, so she should take. And that's the rational move.

  **BW**: But wait. How can we assume that Player 2 is rational at the next node? The fact that we are here at node 3 means that Player 1 passed at node 1 and Player 2 passed at node 2. But BI says that at node 1, Player 1 should have taken. So by passing, Player 1 violated BI. Then Player 2, at node 2, should have taken (according to BI) because she should have expected that Player 1 is rational and would have taken at node 1. But Player 2 passed too. So both players have already acted irrationally. Now, at node 3, Player 1 is supposed to assume that Player 2 will be rational in the future? That seems inconsistent. Why should Player 1 believe that Player 2, who just acted irrationally by passing at node 2, will now suddenly become rational at node 4? 

  **AD**: I see your point, but the theory of BI does not require that we assume past irrationality implies future irrationality. In fact, the beauty of CKR is that it is a fixed point: if we assume that both players are rational and that this is common knowledge, then they will play according to BI. The fact that we are at node 3 is a contradiction to CKR. But in such a situation, we cannot just throw away rationality. We must ask: what would a rational player do now? And a rational player, regardless of what happened in the past, will look forward and apply BI to the remaining game. That is the only consistent way to be rational.

  **BW**: But that's the problem. If we are at node 3, then CKR has already been falsified. So we cannot simply assume CKR for the rest of the game. Player 1, standing at node 3, has to form beliefs about Player 2. And what should those beliefs be? If Player 1 believes that Player 2 is rational, then she would expect Player 2 to take at node 4 (if we get there). But then Player 1 would take now to get $6. However, why should Player 1 believe that Player 2 is rational? After all, Player 2 just passed at node 2 when BI said she should take. So maybe Player 2 is not rational. Maybe Player 2 is an altruist or a cooperator. Then, if Player 1 passes, Player 2 might pass again, and then Player 1 can get more at a later node.

  **AD**: But that's precisely the issue. If we allow for the possibility that players might be irrational, then we are stepping outside the domain of CKR. The BI argument is only intended for the case where CKR holds. And if CKR holds, we never get to node 3. So the fact that we are at node 3 means that CKR does not hold. Therefore, the theory of rational play under CKR has nothing to say about what happens at node 3. It's not that the theory is flawed; it's that the conditions for the theory to apply are not met. So if we want to know what to do at node 3, we need a different theory — one that allows for bounded rationality, or learning, or something else. But that doesn't undermine the BI argument for when CKR does hold.

  **BW**: But then the BI argument is not a practical guide for players who might find themselves at node 3. And in the real world, players do end up at such nodes. So if we are to have a theory that tells players what to do at every node, then we need a theory that can handle off-equilibrium play. And if we try to extend the BI argument to off-equilibrium nodes by saying "just apply BI from that node", we are making an assumption that rationality is restored from that point on. But why should we assume that? The very fact that we are off the BI path is evidence of irrationality. So maybe the rational thing for Player 1 to do at node 3 is to reassess the entire situation and form new beliefs about Player 2. And if she does that, she might decide to pass in the hope that Player 2 will cooperate again.

  **AD**: I agree that in practice, players might do that. But that's a descriptive claim. The normative claim of BI is that if you are rational and you believe that the other player is rational and that this is common knowledge, then you must play according to BI. And that holds at every node. So at node 3, if Player 1 believes that Player 2 is rational (and that Player 2 believes that Player 1 is rational, and so on) then she must take. The fact that the past moves are inconsistent with rationality is a puzzle, but it doesn't change the conditional: if we are to be rational and we assume the other is rational, then we take.

  **BW**: But the problem is that at node 3, Player 1 cannot consistently maintain the belief that Player 2 is rational. Because if Player 2 were rational, she would have taken at node 2. But she didn't. So Player 1 has observed an irrational move by Player 2. Therefore, Player 1 must revise her belief about Player 2's rationality. And if she revises that belief, then she no longer has a reason to think that Player 2 will take at node 4. So the BI reasoning from node 3 onward collapses.

  **AD**: But that revision of belief is not part of the BI argument. The BI argument under CKR does not allow for any revision of beliefs about rationality because CKR is assumed to hold throughout. Once we are at node 3, we are in a situation that is inconsistent with CKR. So the entire framework has broken down. The theory doesn't tell us how to revise beliefs because it never contemplated being at node 3. So if we are to be normative, we must say: if you are at node 3, then the assumptions of CKR are violated, and you are in uncharted territory. But if you want to be rational, you should still play as if the other player is rational from now on. That is, you should apply BI to the subgame. Because being rational means maximizing your payoff given your beliefs. And if you have no reason to doubt the other player's rationality from now on, then you should believe that she will play rationally in the future.

  **BW**: But why should Player 1 have no reason to doubt? She just saw Player 2 pass at node 2, which is irrational. That's a reason to doubt. So she must form new beliefs. And the theory doesn't tell her how to form those beliefs. So she is left without guidance. This is why I say that the BI argument is incomplete. It tells us what to do on the equilibrium path, but it doesn't tell us what to do off it. And since the equilibrium path is never played in the real world (because people do pass in centipede games), the theory is not very useful.

  **AD**: I concede that the theory is limited. But it is still correct in its domain. And for the purpose of understanding the logic of rational choice, it is important. It shows that under CKR, the only possible outcome is immediate taking. That's a valuable insight. What happens off the equilibrium path is a separate issue and requires a different model. But that doesn't mean that BI is wrong. It just means that the world is more complicated.

  **BW**: I agree that BI is a valuable benchmark. But I worry that by insisting that BI is the only rational path, we are closing the door to a deeper understanding of what rationality requires in dynamic games with imperfect information. Perhaps we need a theory that allows for players to update their beliefs about rationality in a consistent way when they observe off-equilibrium play. Then we might get a different solution concept, like sequential equilibrium, which requires specifying beliefs at every node. But even then, in the centipede game, the BI outcome is the only sequential equilibrium. So maybe we are back to square one.

  **AD**: Exactly. Even if we specify beliefs, in the centipede game, the only sequential equilibrium is the BI outcome. So in a way, the problem remains. But note: in sequential equilibrium, we specify a system of beliefs. At node 3, we can assign beliefs that rationalize the past moves as "trembles" (i.e., mistakes). So we can say: Player 1 passed at node 1 by mistake, and Player 2 passed at node 2 by mistake. But now, both players are back to being rational. Then at node 3, Player 1 should take because she expects Player 2 to take at node 4. So we get BI again.

  **BW**: But that's an artificial device. Why should we assume that the past two moves were mistakes? And even if we do, why should we assume that there will be no more mistakes? Moreover, the probability of two consecutive mistakes might be very low. So Player 1 might assign a high probability to Player 2 being irrational. Then passing might be rational.

  **AD**: But in the sequential equilibrium framework, we can assign arbitrarily small probabilities to mistakes. And as long as the probability of a mistake is positive but very small, the BI outcome is the only sequential equilibrium. So again, we are driven to the same conclusion.

  **BW**: But that's only if we require the equilibrium to hold for all sufficiently small mistake probabilities. What if we don't? What if we allow for the possibility that players might interpret the past moves as intentional? Then we might get a different equilibrium. For example, if Player 1 passes at node 1, Player 2 might interpret that as a signal that Player 1 is not rational, and then Player 2 might pass at node 2 to encourage further cooperation. Then at node 3, Player 1 might pass again. So we get a cooperative outcome.

  **AD**: But that would require a different model of the players. We would have to allow for types: some rational, some cooperative. Then we get into signaling games. And in that case, we can get cooperation in equilibrium. But that's a different model. In the standard model with common knowledge of rationality and no mistakes, BI is the only solution.

  **BW**: So we are back to the beginning. The standard model with CKR gives BI and only BI. But if we are at node 3, we are not in the standard model. So we need a different model. Therefore, the BI argument doesn't tell us what to do at node 3. It only tells us that we shouldn't be there. But we are there. So we are stuck.

  **AD**: Precisely. So the conclusion is that the BI argument is correct under its assumptions, but those assumptions are very strong and easily broken. And once broken, we need a new theory. So for our Player 1 at node 3, there is no universally agreed rational choice. It depends on what she believes about Player 2, and the theory doesn't pin that down.

  **BW**: And that's why I find the experimental results less surprising. Real players are not bound by CKR. They form beliefs based on the past moves and the context. They might trust each other and cooperate. Or they might not. But the BI argument, while logically sound in its own world, doesn't capture that.

  **AD**: Agreed. But it remains a powerful idealization.

  **BW**: Indeed. So what should we, as Player 1, do now?

  **AD**: I would take the $6. Because I still think that Player 2 is rational and will take at the next node. And even if she isn't, $6 is better than the $4 I would get if she takes next.

  **BW**: But if I were Player 1, I might pass. Because I think Player 2 passed at node 2 to signal cooperation. So if I pass, she might pass again, and then I can get more.

  **AD**: That's risky. You might get only $4 if she takes.

  **BW**: But in the spirit of the experiment, let's pass and see what happens.

  **AD**: (laughs) Well, we are philosophers, not experimental subjects. But for the sake of the thought experiment, I suppose we can imagine both possibilities. The theory doesn't force one choice at this node.

  **BW**: Exactly. And that's the point I was trying to make.

  **AD**: And that's the point I conceded. So we are in agreement that the BI argument, while compelling under CKR, does not dictate what to do when CKR fails. And that is where the real world begins.

  **BW**: Indeed. So let's leave it at that.
answer: |-
  ### Dialogue: The Centipede Game at Node Three

  **Setting:**  
  A six-move centipede game has reached its third node. The pot started at $2 and, after two passes (one by Player 1, one by Player 2), now stands at $8. Player 1 (P1) must choose: **Take** $6 (leaving Player 2 with $2) or **Pass**, letting the pot grow to $16 for Player 2 to act next.  

  Two philosophers of game theory, **Alex** (defending Aumann’s view) and **Brianna** (pressing Binmore’s worry), stand in for the players. They debate what P1 should do, given that backward induction (BI) predicted the game should never have reached this point.  

  ---

  **Alex (Aumann Defender):** Brianna, we’re at node three, but the logic is clear. Common knowledge of rationality (CKR) implies backward induction is unavoidable. P1 should take the $6 now. If she passes, P2—if rational—will take at node four, leaving P1 with only $4. Since $6 > $4, taking dominates. BI isn’t just about the first move; it applies to every subgame. The fact that we’re here is irrelevant to what rationality demands *now*.  

  **Brianna (Binmore Worrier):** Irrelevant? Alex, that’s precisely the problem. BI under CKR said P1 should have taken at node one, and P2 should have taken at node two. But both passed. So CKR is already falsified! At node three, P1 *knows* someone—maybe P2, maybe herself—has acted irrationally. Why should she assume P2 will suddenly become “rational” at node four? BI’s coherence breaks down the moment we step off its path.  

  **Alex:** You’re conflating descriptive failure with normative force. CKR is an idealization. Like Newtonian physics in frictionless vacuum, it defines rational play *if* its premises hold. Yes, reaching node three contradicts CKR, but that doesn’t absolve P1 of reasoning rationally *now*. BI isn’t a historical account; it’s a timeless prescription. From this node, the subgame’s BI path says “take”—unless P1 abandons rationality altogether.  

  **Brianna:** But what does “reasoning rationally” mean here? BI relies on counterfactuals: “If we were at node four, P2 would take.” But if P1 believes P2 is rational, she must explain why P2 passed at node two. That’s impossible without revising CKR. Once you admit irrationality, BI loses its grip. P1 might reasonably think, “P2 passed to signal cooperation, so I’ll pass too.” Your “timeless prescription” ignores how beliefs update when CKR shatters.  

  **Alex:** Beliefs don’t need to update in a way that undermines BI. Aumann’s insight is that CKR is a fixed point: *if* it holds, BI follows. Off-path play is a logical inconsistency, like division by zero. Rational choice theory doesn’t owe us an answer to “what if 2+2=5?” because it excludes that scenario. At node three, P1 should still maximize payoffs *as if* CKR holds locally—take the $6. Otherwise, you’re inviting ad hoc belief revisions that could justify *any* move.  

  **Brianna:** But if BI can’t handle off-path play, how can it claim to be a complete theory of rationality? Real decisions happen *at these nodes*. Saying “CKR excludes this” is like a fire department that only works when there’s no fire. Let’s engage your subgame argument: to apply BI from node three, P1 must believe P2 will BI from node four onward. But P2 just violated BI at node two! If P1 revises her belief about P2’s rationality—say, to “P2 is irrational with probability p”—then BI’s conclusion changes. Passing might become rational if P1 thinks p is high. Your “as if” is question-begging.  

  **Alex:** You’re demanding a theory of *irrationality*—but that’s not BI’s job. BI under CKR tells us what rationality compels *when it’s intact*. At node three, P1 faces a new subgame. If she abandons BI here, she must justify why rationality suddenly permits dominated strategies. Suppose she passes, hoping P2 will reciprocate. If P2 is rational, she’ll exploit this and take $16, leaving P1 with $4—worse than $6. Trusting an irrational opponent is even riskier. BI minimizes regret.  

  **Brianna:** Minimizing regret isn’t the point. The issue is epistemic coherence. Aumann’s BI proof uses CKR to prune the game tree: at each node, players believe only rational moves will follow. But at node three, P1 has *observed* an irrational move (P2’s pass at node two). CKR can’t be restored by fiat; it’s empirically falsified. So P1 must form new beliefs. If she tries to “reapply” BI, she’s implicitly assuming CKR *wasn’t* violated—which is absurd. It’s like insisting the Earth is flat after circumnavigating it.  

  **Alex:** I’ll grant that CKR is *globally* broken, but rationality is *local*. P1 can still assume P2 is rational *from now on* without resolving past contradictions. Think of it as a “trembling hand” correction: past moves were mistakes, but future play will be rational. In fact, in sequential equilibrium models, BI survives as the only outcome when trembles are small. So P1 should take.  

  **Brianna:** Trembles? That’s an evasion. If we allow mistakes, we’re *outside* CKR, and BI isn’t “forced” anymore. If P2’s pass was a tremble, P1 might assign a high probability to future trembles—making passing rational. Worse, if P1 believes P2 *intentionally* passed to build trust, we’re in a signaling game where cooperation is sustainable. Aumann’s model excludes this, but once CKR breaks, we *need* such models. BI’s “uniqueness” relies on ignoring the very evidence that off-path play provides.  

  **Alex:** So what’s your alternative? If BI isn’t binding here, what *should* P1 do?  

  **Brianna:** I’m not prescribing a move; I’m showing BI’s inadequacy. P1 must form beliefs about P2’s type—rational, irrational, reciprocal, etc.—based on observed play. If she thinks P2 is rational, she takes. If she thinks P2 is cooperative, she passes. But CKR doesn’t tell her how to form those beliefs. That’s Binmore’s point: BI claims to dictate play everywhere, yet falls silent where it matters most. Your defense reduces to: “Take, because maybe CKR still holds.” But that’s hope, not rationality.  

  **Alex:** And your critique reduces to: “BI fails when players are irrational,” which is trivial. The deep puzzle is why BI *should* extend to incoherent contingencies. Rational choice theory is a normative benchmark, not a descriptive toolkit. At node three, P1 faces a dilemma CKR didn’t anticipate, but she can still choose the BI move as the least bad option. Taking $6 is robust: it beats the payoff if P2 takes next, and if P2 passes, P1 gets more later. Passing risks $4 for an uncertain gain.  

  **Brianna:** Robustness isn’t enough. If P1 takes, she gets $6, but if she passes and P2 reciprocates, she could get $16 or more. The *potential* upside might justify the risk if she believes P2’s pass was strategic. But without CKR, BI doesn’t tell her whether that belief is rational. You’re smuggling in a conservative heuristic (“avoid risk”) and calling it BI. True BI requires deducing P2’s move from CKR—which is gone. We’re left with psychological guesswork, not game theory.  

  **Alex:** So we agree that CKR’s breakdown creates ambiguity, but not that this voids BI’s authority *when applicable*. At node three, P1 should ask: “What would BI advise *if* CKR held from here?” The answer is “take”—and deviating invites incoherence. Your approach opens the door to magical thinking: “P2 passed, so she’s nice; I’ll pass.” That’s how people lose money in centipede experiments!  

  **Brianna:** And your approach pretends the past doesn’t exist. If P1 applies BI mechanically, she ignores the informational content of P2’s pass. Rationality isn’t robotic; it’s responsive to evidence. A theory that can’t absorb evidence—like an off-path move—isn’t just incomplete; it’s brittle. Maybe BI is “right” in a parallel universe where CKR holds, but in *this* universe, at node three, it offers no justified guidance. We need a dynamic theory of belief revision.  

  **Alex:** Perhaps. But until we have one, BI is the only consistent standard. P1 should take the $6.  

  **Brianna:** Or perhaps this impasse shows why BI alone can’t resolve the centipede game. Real players cooperate not because they’re irrational, but because they *renegotiate* rationality off-path. P1 might pass to test that.  

  **Alex:** And if she does, I hope she likes $4.  

  **Brianna:** And if she takes, she’ll never know if $16 was possible. That’s the tragedy of BI: it wins the argument by refusing to engage the world.  

  *(The dialogue ends unresolved, mirroring the ongoing debate. Alex takes the $6, ending the game. Brianna shakes her head, wondering what would have happened if they’d passed.)*  

  ---  
  **Key Takeaways from the Dialogue:**  
  - **Alex (Aumann)**: BI under CKR is a coherent idealization. Off-path play is logically excluded by CKR, so BI still dictates taking at node three. Questioning beliefs at such nodes is outside rational choice theory’s scope.  
  - **Brianna (Binmore)**: BI’s inability to justify beliefs off-path undermines its claim to unique rationality. Once CKR breaks, players must revise beliefs dynamically, and BI offers no principled way to do this.  
  - **The Stalemate**: The debate highlights a core tension: BI is airtight under CKR but struggles with its own collapse. Aumann’s view prioritizes internal consistency; Binmore’s prioritizes responsiveness to evidence. Neither fully resolves how rationality “restarts” after a deviation.  

  This mirrors the literature: Aumann’s theorem stands, but Binmore’s critique exposes its fragility in actual play. The centipede game’s paradox endures because rationality, common knowledge, and belief revision pull in different directions off the equilibrium path.
