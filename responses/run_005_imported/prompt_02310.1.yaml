  First, I need to recall Bradley's regress. It's about how a relation (R) connecting a subject (S) and object (O) needs something to unify them into a single fact. But if that unifying element is another relation, it leads to infinite regress. Russell and Frege offered solutions: Russell's multiple relation theory and Frege's unsaturated concepts. 

