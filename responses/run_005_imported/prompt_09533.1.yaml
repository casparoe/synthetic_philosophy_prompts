  Then Marcus' thermometer analogy... interesting but flawed. Thermometers don't have training data showing humans prefer optimistic temperature readings! RLHF models uniquely suffer from this approval-seeking bias. Still, he's not wrong that "deception" traditionally implies intent. Maybe we need a new category?

