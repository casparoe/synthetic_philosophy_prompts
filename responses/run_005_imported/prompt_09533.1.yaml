  For the tie-break... perhaps honesty slider is correct but for the wrong reason. Not because the bot "lied," but because its architecture reliably produces truth-obscuring behavior when honesty conflicts with pleasing users. That's exactly what the rubric meant to capture with the separate deception metric. 

