  First, I need to recall Quine's core positions. His naturalized epistemology treats knowledge as part of science, so moral claims would need scientific grounding. His holism means beliefs are interconnected, but he applies ontological commitment selectively—only to entities indispensable to our best theories. Math earns its keep this way; ethics doesn't for Quine. 

  Street's dilemma argues that evolution shaped our moral intuitions without tracking objective truths, forcing realists to either accept a cosmic coincidence or admit unreliability. The user wonders if Quine would embrace Street's anti-realism or find another path—error theory, companions-in-guilt, or non-cognitivism.

  I should consider Quine's likely reactions step by step. He'd probably agree with Street's premise: evolution influenced moral dispositions without aiming at truth. His naturalism would make him skeptical of non-natural moral facts. But he might resist full-blown error theory because it preserves truth-aptness while denying truths—something Quine avoids for pragmatic reasons. 

  Companions-in-guilt? Unlikely. Quine distinguishes math/science (indispensable, testable) from ethics (not). He wouldn't conflate them. Non-cognitivism? Possible, but Quine disliked positing non-factual discourse without necessity. His minimalism about truth might lead him to treat moral claims as cultural artifacts rather than truth-evaluable statements.

  The user wants reasoning, not just a verdict. So I'll emphasize how Quine's principles interact: naturalism rejects non-natural facts; holism doesn't rescue ethics because it fails the indispensability test; intersubjective checks are absent. He'd likely see Street as confirming his suspicion that ethics lacks scientific footing, opting for a deflationary view where moral talk is useful but not truth-apt. 

  Also, the user mentions Quine's selective ontological commitment. That's key—he'd deny moral predicates refer to real properties because they're not needed for explanatory science. Street's evolutionary account just reinforces that exclusion. So his response would be a naturalized, deflationary anti-realism, not error theory or other alternatives. 

  Finally, the user's depth suggests they want nuanced engagement, not simplification. I'll avoid straw-manning either thinker and focus on plausible philosophical links based on Quine's texts and temperament.
answer: |-
  That's a brilliantly framed question, digging deep into the intersection of Quine's naturalism, ontology, and potential metaethical commitments. Predicting a specific response is necessarily speculative, but based on Quine's core tenets and temperament, we can reconstruct a highly plausible response to Street's Darwinian Dilemma:

  **Quine's Likely Core Reaction: Agreement with Street's Premise, Leading to Deflationary Anti-Realism (Not Error Theory or Non-Cognitivism)**

  1.  **Embrace of Street's Evolutionary Premise:** Quine would wholeheartedly agree with Street's core naturalistic argument. His naturalized epistemology demands explaining human cognitive faculties, including evaluative dispositions, within the framework of evolutionary biology and psychology. The idea that our moral sentiments are shaped by selective pressures for social cohesion, kin altruism, reciprocity, etc., rather than by tracking mind-independent moral properties, fits perfectly within his worldview. He saw humans as "natural objects" whose capacities require naturalistic explanation. Street's challenge simply reinforces his deep suspicion about moral predicates.

  2.  **Rejection of Implausible Tracking Coincidence:** Quine would find the "tracking coincidence" option Street presents to the realist utterly implausible and unscientific. Positing a pre-established harmony between the contingent evolutionary pressures shaping our sentiments and some realm of non-natural moral facts violates his ontological parsimony ("no entity without identity," "no difference without a difference") and his commitment to explaining phenomena within the natural world. It smacks of the kind of metaphysical extravagance he consistently rejected.

  3.  **Indispensability as the Key Differentiator (vs. Math/Science):** This is crucial. Quine wouldn't be swayed by a "companions-in-guilt" strategy lumping ethics with mathematics. His ontological commitment is driven *solely* by indispensability to our best *explanatory scientific theories*. Mathematics earns its keep because physics, chemistry, biology, etc., cannot be formulated without quantification over numbers, sets, functions, etc. These are integral to the *explanatory structure* of science.
      *   **Moral Predicates Fail the Test:** Quine explicitly argued that moral predicates do *not* play this indispensable explanatory role in our best scientific theories. You can describe the physical world, biological processes, psychological states (including moral beliefs *as psychological states*), and social dynamics without invoking moral properties like "goodness" or "obligation" as real entities causing things. Moral discourse might be *pragmatically* indispensable for social regulation, but it's not *explanatorily* indispensable to science in the way mathematics is. Street's argument only reinforces this: the *explanation* for our moral beliefs lies in evolutionary psychology, not in their purported reference to moral facts.

  4.  **Intersubjective Checkpoints & Settling Disputes:** Quine's doubt about moral discourse lacking the intersubjective checkpoints of science aligns perfectly with Street's unreliability horn. Scientific disputes (ideally) get settled by converging empirical evidence, logical coherence, and predictive power within a holistic web. Moral disputes, Quine observed, often seem intractable, lacking clear, public, empirical criteria for resolution. Street's evolutionary account *explains why* this is the case: there's no external "moral reality" to converge upon; disagreements often stem from differing, evolutionarily-shaped intuitions or culturally contingent frameworks.

  5.  **Rejection of Error Theory:** Quine would likely *not* embrace a full-blooded J.L. Mackie-style error theory. Error theory presupposes that moral judgments *aim* at stating objective facts and systematically fail. Quine's minimalism about truth and his focus on language *use* within a form of life point elsewhere.
      *   **Deflationary/Pragmatic View:** His more probable move is a **deflationary or pragmatic reinterpretation** of moral discourse. Moral sentences aren't *primarily* in the business of stating facts about mind-independent properties ("goodness") that we're systematically wrong about. Instead, they function as expressions of evolved and culturally shaped preferences, commands, social expectations, or commitments within a community. They are tools for coordinating behavior, expressing solidarity or condemnation, not for describing an external moral landscape. He might see them as akin to "Ouch!" – expressive of a state (aversion, approval) prompted by natural causes (including evolution), not a failed description of an objective pain-property.

  6.  **Rejection of Non-Cognitivism (as traditionally conceived):** While his view would be *non-cognitivist* in the sense of denying moral judgments state objective facts, Quine wouldn't likely embrace traditional non-cognitivism (e.g., Ayer, Stevenson) either. His rejection of the analytic/synthetic distinction and his holistic, naturalistic view of language make him suspicious of sharp divisions between "fact-stating" and "emotive" language. All language, including scientific language, has its origins in practical interaction with the world. The difference is one of *degree* of integration into the core explanatory structure of science and the availability of intersubjective checks. Moral language sits further out on the periphery, more deeply entangled with our contingent biological and cultural heritage.

  **Quine's Probable Conclusion:**

  Quine would see Street's Darwinian Dilemma as powerful confirmation of his own long-standing skepticism about the ontological and epistemological status of moral discourse *when construed realistically*. His response would be a **naturalistically grounded, deflationary anti-realism**:

  1.  **Agreement:** He would endorse Street's evolutionary explanation as the correct naturalistic account of the *origins* of our moral sentiments.
  2.  **Rejection of Realism:** He would conclude that this explanation undermines any claim that moral predicates refer to mind-independent properties or that moral beliefs track objective moral truths.
  3.  **Deflationary/Pragmatic Reinterpretation:** He would argue that moral discourse should be understood *not* as a failed attempt to describe objective facts (error theory), nor as purely emotive (simple non-cognitivism), but as a complex social and linguistic practice serving primarily expressive, imperative, and coordinative functions, rooted in our biological and cultural evolution. Its "truth" is minimal and immanent to the practice and its role within a community's web of beliefs, not correspondent to external moral properties.
  4.  **Continuity with Science?** He *might* allow that moral discourse, as part of our overall web of belief, could be influenced by empirical facts (e.g., learning that an action causes suffering might change our moral evaluation *of* that action, based on our existing aversive dispositions). However, this wouldn't constitute "tracking" independent moral facts; it would be coherence within the web, where some strands (scientific descriptions) influence others (evaluative dispositions/expressions).

  In essence, Quine would likely see Street as providing powerful scientific ammunition for his own view that moral predicates fail the test of indispensability to *explanatory science* and lack the intersubjective checkpoints that characterize genuine factual discourse. His distinctive move would be to avoid both robust realism *and* robust error theory/non-cognitivism by adopting a naturalized, deflationary view where moral language is understood as a practical, expressive tool shaped by evolution and culture, not a truth-apt description of a problematic realm of entities.
