answer: |-
  Based on Menger's core principles of saleableness (*Absatzfähigkeit*) and the *process* of money's emergence, **Carl Menger would likely conclude that Bitcoin *does* qualify as money on his own terms, despite lacking a prior non-monetary use-value.** Here's the definitive reasoning, grounded in Menger's actual texts and logic, and its implications for the nature of money:

  ### 1. **Menger's Core Mechanism: Saleableness, Not Intrinsic Value**
     Menger's genius was decoupling money's *origin* from state decree or social contract. Money emerges spontaneously because traders seek to minimize the cost and uncertainty of exchange. The key is **saleableness** – a good's capacity to be disposed of "easily, quickly, and without loss" (*Principles*, Ch. VIII). Saleableness has three dimensions:
     - **Certainty of Sale:** Probability of finding a buyer quickly.
     - **Trading Range:** Breadth of potential buyers/markets.
     - **Price Stability:** Minimal discount required for quick sale.
     Traders gravitate toward goods with high saleableness *even if they don't need them*, purely to reduce future transaction costs. This creates a positive feedback loop: increased acceptance boosts saleableness, attracting more users. Menger explicitly states money arises from "the *self-interest* of economizing individuals" without "agreement or government compulsion" (*On the Origin of Money*).

  ### 2. **Bitcoin and Saleableness: Menger's Verdict**
     - **Bootstrapping Saleableness:** Bitcoin lacked prior use-value, but Menger's mechanism doesn't strictly require it. What matters is whether a good *develops* sufficient saleableness through a decentralized process. Bitcoin did this through:
       - **Initial Niche "Use":** Early adopters valued it as a censorship-resistant digital collectible, speculative asset, or ideological symbol. This provided a *minimal* base demand unrelated to monetary use.
       - **Positive Feedback Loop:** As more actors accepted Bitcoin for its *saleableness* (ease of transfer, divisibility, borderlessness, scarcity), its liquidity grew. Traders accepted it not for its utility, but because they expected others to accept it later – the *essence* of Menger's process.
       - **Meeting Saleableness Criteria:** Bitcoin excels in *certainty of sale* (vast global exchanges), *trading range* (accepted by diverse merchants/traders), and *price stability* (volatility is high, but improving; crucially, it's *tradable* 24/7 with minimal spreads). Its digital nature enhances portability and divisibility beyond Menger's examples.
     - **Mises' Regression Theorem Addressed:** Mises argued money's value must regress to a point of non-monetary demand. Menger, however, focused on the *emergent process*, not a rigid historical prerequisite. Bitcoin's initial niche demand (speculation/ideology) provided the "hook" for saleableness to take over. Menger might view this as analogous to ornamental shells or beads gaining monetary status – their initial "use" was trivial compared to their eventual monetary role. The *process* of salability-driven adoption is identical.

  ### 3. **Definitive Answer:**
     **Yes, Menger would recognize Bitcoin as money.** Its emergence perfectly mirrors his model: individuals acting in self-interest (seeking liquidity, speculation, utility in transactions) gradually converged on Bitcoin due to its superior saleableness in specific contexts (digital, global, permissionless). No state decreed it; no social contract was signed. It crystallized from countless bilateral interactions, reducing transaction costs. The lack of prior *industrial* use is irrelevant; the minimal initial demand for its unique properties provided the seed for salability to flourish. Bitcoin is a modern, digital manifestation of Menger's "crystallization" metaphor.

  ### 4. **Implications: Money as a Natural or Social Kind?**
     Menger's account, reinforced by Bitcoin, **strongly supports money as a "natural kind" emerging from transactional dynamics,** not a purely social construct:
     - **Natural Kind Analogy:** Like crystal formation, money emerges under the right conditions (human trade needing liquidity) governed by underlying "laws" (individual minimization of transaction costs). The specific commodity (gold, shells, Bitcoin) is contingent, but the *emergent property* (saleableness/liquidity) is the universal attractor. Structure arises from local interactions without global awareness.
     - **Contrast with Searle:** Searle's "collective intentionality" describes how money *persists* and gains legitimacy *after* emergence, not how it *originates*. Menger (and Bitcoin) show money can exist *before* collective recognition as a *social institution*. Early Bitcoin wasn't "money because we collectively agreed it was money"; it was money because it was *the most saleable digital good* for a growing subset of traders. Social recognition followed and stabilized it, but didn't create it *ex nihilo*.
     - **Synthesis:** Money is a **naturally emergent social kind.** Its *genesis* is natural/spontaneous (Menger), driven by transactional efficiency. Its *persistence and stability* rely on social conventions and institutions (Searle). The "natural" foundation is the universal human drive to reduce exchange friction. Bitcoin demonstrates this: its birth was Mengerian (emergent saleableness), while its current stability increasingly involves Searlean elements (exchanges, regulations, institutional adoption).

  ### Conclusion
  For Menger, Bitcoin is unequivocally money. Its path from cryptographic novelty to global liquid asset epitomizes his theory: saleableness bootstrapped from minimal initial demand, amplified by self-interested traders seeking the easiest medium for future exchange. This confirms money's origins lie in spontaneous order, not collective design. The deeper insight is that money is a *discovery* made by traders struggling with barter's inefficiencies – a naturally occurring solution to a coordination problem. Bitcoin, far from refuting Menger, is his most audacious vindication, proving his mechanism operates even in the digital ether, without physicality or state backing. The crystal formed; its lattice is cryptographic.
