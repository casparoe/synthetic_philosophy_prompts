prompt: |-
  During my working life as a physicist I used Bayesian reasoning all the time, but only in a rough, practical way, without ever worrying much about its philosophical foundations. Since retiring I have been reading more systematically in philosophy of science, and a few weeks ago, in a local reading group, we spent an entire evening on Clark Glymour's "problem of old evidence." As I now understand it, the puzzle runs as follows: on the standard Bayesian picture, a piece of evidence E confirms a hypothesis H for an agent only by raising that agent's credence in H, which in turn requires the agent's prior credence in E to have been less than one. Yet the textbook illustration, which Glymour himself used, happens to be drawn from physics: the anomalous excess precession of Mercury's perihelion — about 43 arcseconds per century, by modern measurement — which Le Verrier had already isolated in 1859, more than fifty years before Einstein's general relativity accounted for it in 1915. Physicists still routinely describe this episode as one of the most striking confirmations general relativity ever received, yet on a strict Bayesian reading a scientist who already assigns the perihelion data probability 1 cannot have their credence in general relativity moved by that data at all.

  I gather that the proposed solutions fall into a few families: some, following Garber and Jeffrey, relax the assumption that agents are logically omniscient, so that discovering that the theory entails the evidence becomes itself a piece of genuine news; others, in the spirit of Howson, instead ask us to reason counterfactually about what our credence in the evidence would have been had we not already possessed it. None of this was on my radar as a working scientist, and it unsettles me a little, since I had always treated cases like Mercury's perihelion as paradigms of sound inductive practice, and I gather that similar "old evidence" worries resurface whenever a newer theory is praised for reproducing results that were never really in doubt. Could you set out what you take to be the most important implications of the problem of old evidence, both for how someone with a physicist's working notion of confirmation should now think about historical episodes like Mercury's perihelion, and for whether it is Bayesian confirmation theory itself, rather than our scientific practice or our intuitions about such cases, that ought to give way?
reasoning: |-
  Okay, this physicist-turned-philosophy enthusiast is grappling with Glymour's problem of old evidence. They've encountered the core paradox: how can known evidence (like Mercury's perihelion) confirm a new theory (GR) if Bayesianism requires credence shifts from new information? 

  Hmm, their concern is layered. First, there's professional unease—they used Mercury's perihelion as a textbook confirmation case for decades, only to discover philosophers call it problematic. Second, they're wrestling with implications: should physicists rethink historical cases? Or is Bayesianism the flawed party? 

  I notice their summary of solutions is accurate but detached. They mention Garber/Jeffrey (logical non-omniscience) and Howson (counterfactual credences) but seem to want deeper integration with scientific practice. The phrase "paradigms of sound inductive practice" hints they resist solutions that feel artificial compared to how scientists actually reason. 

  The real tension they're circling: must we choose between abandoning Bayesianism or rewriting scientific history? Neither feels palatable. Their closing question suggests they suspect Bayesianism might need refinement—not discard—to align with scientific intuition. 

  Key angles to address:
  - Why physicists aren't wrong about Mercury: emphasize the *explanatory gap* pre-GR. Le Verrier knew the anomaly but not *why* Newton failed. GR didn't just fit data; it revealed why the anomaly *had* to exist.  
  - Bayesianism's flexibility: counterfactual credence (Howson) isn't a hack—it mirrors how physicists assess theories against "what we knew but couldn't explain."  
  - Deeper implication: old evidence tests a theory's *necessity*. If GR failed to recover Mercury's motion, that would've been devastating precisely because the evidence was solid. Bayesianism struggles to capture this asymmetry.  

  Should reassure them that scientific practice isn't flawed. The issue is Bayesianism's idealization—like frictionless planes in physics. We adjust models to handle real-world complexities (like prior knowledge), not discard them.  

  Might quote Howson: "Confirmation isn't about updating beliefs on E; it's about explaining why E is inevitable under H." That bridges their physics intuition and philosophy.
answer: |-
  Your unease is profoundly understandable—the problem of old evidence strikes at the heart of how scientists intuitively reason about confirmation while exposing a tension in Bayesian formalism. As a physicist, your instinct that Mercury's perihelion *does* confirm GR is sound; the philosophical challenge is reconciling this with Bayesian machinery. Let's dissect the implications, starting with how to reinterpret historical cases like Mercury, then addressing whether Bayesianism or scientific practice should yield.

  ---

  ### **1. Rehabilitating Mercury's Perihelion: A Physicist's Guide**
  The key is to recognize that "confirmation" in scientific practice isn't solely about *updating credences* but about **resolving explanatory gaps**. Glymour's puzzle arises when we conflate two roles of evidence:
  - **Discovery context**: Evidence gathered *after* a theory's proposal (e.g., Eddington's 1919 eclipse test for GR) fits neatly into Bayesian updating.
  - **Explanatory context**: Evidence *already known* tests a theory's ability to **systematize and necessitate** what was previously anomalous.

  For Mercury:
  - **Pre-GR**: The 43"/century precession was a known anomaly. Newtonian mechanics could not explain it (despite ad hoc fixes like Vulcan), so physicists assigned high credence to the *data* (E) but low credence to any *explanation* (H).  
  - **Post-GR**: Einstein didn't just "fit" E; he showed that GR **entails E as a necessary consequence** of spacetime curvature. The confirmation arose from:
    - **Unification**: GR explained Mercury's motion *without* adjustable parameters, using the same equations that predicted light bending and gravitational redshift.
    - **Necessitation**: E shifted from "stubborn fact" to "inevitable outcome" of H.  

  **Bayesian rescue (Howson-style counterfactual)**:
  - Ask: "What would my credence in E have been *if I didn't know E* and was evaluating H?"  
  - Without knowledge of Mercury's precession, GR's prediction of ~43"/century would be striking. A counterfactual agent would see P(E|H) ≈ 1 and P(E|¬H) ≪ 1, dramatically boosting P(H|E).  
  - This mirrors how physicists reason: "If GR didn't exist, would we *expect* Mercury's motion? No—so GR explains it."

  ---

  ### **2. Implications for Bayesian Confirmation Theory (BCT)**
  The problem doesn't indict scientific practice but reveals BCT's **idealized assumptions**:
  - **Logical omniscience**: BCT assumes agents know all logical consequences of their beliefs. Real scientists don't. Le Verrier knew E but not that ¬H (Newtonian gravity) entailed ¬E. Discovering that H ⊢ E *is* new information (per Garber/Jeffrey).  
  - **Static evidence**: BCT treats "evidence" as a fixed set. In practice, evidence is **recontextualized** by new theories. Mercury's data was "old," but its *status* changed from anomaly to necessity.  
  - **Explanatory power**: BCT reduces confirmation to credence shifts. Scientists value **explanatory unification**—GR gained credibility by turning Mercury's "problem" into a virtue.

  **Should BCT give way?** Not entirely—but it needs refinement:
  - **BCT's strength**: Quantifying incremental belief updates *for new evidence*.  
  - **Its limitation**: Capturing the **significance of explanatory integration** for old evidence.  
  - **Solution path**: Augment BCT with **explanatory virtues** (e.g., Schupbach's "explanatory bayesianism"). When H explains E better than rivals, it gets a confirmation boost *even if E is old*.

  ---

  ### **3. Broader Lessons for Scientific Reasoning**
  - **Old evidence as stress-testing**: Reproducing well-established results (e.g., quantum mechanics matching classical limits) isn't vacuous. It tests a theory's **consistency with uncontested knowledge**. Failure here is fatal (e.g., GR failing on Mercury would have killed it).  
  - **Confirmation is comparative**: Mercury confirmed GR partly because **rival theories failed**. Bayesianism handles this via likelihood ratios (P(E|H) vs. P(E|¬H)), but ¬H must include *plausible alternatives*.  
  - **Historical episodes aren't flawed**: Physicists were right to see Mercury as confirming GR. The Bayesian puzzle arises from formalizing "confirmation" too narrowly, not from scientific misjudgment.

  ---

  ### **Conclusion: A Synthesis for the Working Physicist**
  - **For historical cases**: Mercury's perihelion confirmed GR because it resolved a known anomaly through a deeper explanatory framework. Use counterfactual reasoning ("Would we expect E without H?") to align intuition with Bayesian tools.  
  - **For Bayesianism**: It remains a powerful tool for modeling uncertainty with *new* data but should be supplemented with **explanatory diagnostics** for old evidence. The problem of old evidence is a call to enrich BCT—not abandon it or scientific practice.  
  - **Core insight**: Science often advances when theories turn "problems" into "predictions." Bayesianism struggles to formalize this because its machinery doesn't fully capture the **epistemic value of explanatory insight**. 

  As Einstein noted, the magic of GR wasn't just predicting Mercury's motion—it was *understanding why it had to be so*. No confirmation theory should ignore that.
