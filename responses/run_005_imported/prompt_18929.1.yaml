  Here's a draft opinion addressing both the immediate case and the broader policy question, designed to meet your deadline and engage the philosophical tension:

  ---

  **ETHICS COMMITTEE ADVISORY OPINION**  
  **Re: Application of Ulysses Clause in Manic Episode with Apparent Capacity**

  **I. Immediate Case Recommendation**  
  The Committee recommends honoring the Ulysses clause and initiating involuntary treatment pursuant to the directive, while simultaneously filing for emergency judicial review to validate this action.  

  **Rationale:**  
  1. **The Clause's Purpose & Context**  
     The patient executed this specific document precisely to address *this clinical scenario*: a manic episode where refusal appears superficially rational but contradicts her stable, longitudinal values. Her capacity assessment, while formally coherent, reveals critical flaws when contextualized:  
     - Her reasoning centers exclusively on an urgent but objectively non-viable "project" (a recognized manic symptom)  
     - She acknowledges her diagnosis and past harms yet discounts their present relevance—a disconnect her directive anticipated as characteristic of impaired judgment during mania.  

  2. **Diachronic Autonomy Overrides Contemporaneous Choice**  
     The clause represents her settled values after grave consequences. To disregard it now privileges a momentary state (mania-distorted volition) over her deeply considered life plan. This violates the *principle of precedent autonomy* she deliberately invoked.  

  3. **Procedural Safeguard**  
     Filing for emergency review provides judicial oversight while preventing imminent harm. Releasing her risks catastrophic outcomes she explicitly sought to avoid, with no mechanism to retrieve her once discharged.  

  **II. Programmatic Recommendation**  
  The program should continue offering Ulysses clauses *without real-time revocation during designated episodes*, but implement these safeguards:  
  1. **Strict Preconditions**  
     - Requires verification of competence *during execution* by both psychiatrist + independent consultant  
     - Mandates annual re-affirmation while stable  
     - Limits duration (e.g., 5-year renewable terms)  

  2. **Enhanced Activation Protocol**  
     - Triggers only after *two* physicians (including treating psychiatrist) document:  
       a) Episode-specific impairment patterns matching patient’s pre-identified "warning signs"  
       b) Why refusal stems from illness despite surface coherence  
     - Automatic judicial review within 72 hours of activation  

  3. **Alternative: "Proxy Activation" Model**  
     Designate the outpatient psychiatrist (or other pre-authorized agent) to invoke the clause upon confirming episode recurrence, subject to immediate review.  

  **III. Philosophical Context: Why Toxin-Puzzle Framing is Misleading**  
  While superficially analogous, Kavka’s puzzle distracts from key distinctions:  

  1. **The Toxin Problem is About Intention Formation**  
     Kavka questions whether one can *rationally intend* an act with no future incentive. But here, the act (treatment) *has* profound future incentive—the patient’s own flourishing. Her "incentive problem" is pathologically *occluded* by mania, not absent.  

  2. **Clinical Self-Binding is Value-Expressive, Not Purely Volitional**  
     The Ulysses clause isn’t a brute exercise of willpower; it’s a *constitutive commitment* to her identity as a stable person. Honoring it respects her moral agency *across time*, whereas rejecting it reduces autonomy to snapshots of episodic illness.  

  3. **Capacity is Illness-Relative**  
     Standard capacity tools assess understanding *at a moment*, but not *alignment with enduring values*. Her refusal demonstrates appreciation of facts but fails the *authenticity* criterion: her reasons emerge from manic urgency, not her core worldview.  

  **Conclusion**  
  This patient’s directive should control. Her present refusal exemplifies the very impairment she predicted—not a revocation, but a symptom. For future clauses, enhance procedural rigor but preserve their essence: they are not suicide pacts with rationality, but lifelines thrown by a self-aware self to a future self drowning in illness.  

  ---  

  **Key Philosophical Moves Embedded:**  
  - **Rejects "all-or-nothing" autonomy**: Framing this as "competent vs. incompetent" ignores how bipolar mania *selectively distorts valuation* while preserving some reasoning. The clause targets this specific distortion.  
  - **Addresses the psychiatrist’s concern**: By requiring episode-specific impairment documentation, we ensure the clause *does work*—it compels treatment precisely when surface capacity would otherwise mislead.  
  - **Avoids forfeiture**: Time-limited terms + judicial review prevent "lifetime forfeiture," while honoring the patient’s explicit wish that her stable judgment prevail *during defined crises*.  

  This balances your clinical urgency with philosophical precision—the toxin analogy helped *diagnose* the tension but couldn’t resolve it; diachronic autonomy theory provides the cure.
