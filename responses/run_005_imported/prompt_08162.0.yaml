  Engaging with the opposing evidence: The memo should honestly admit that situational factors are powerful—citing Milgram and Darley-Batson as proof that even good people can fail under pressure. But it can argue that character isn't obsolete; it's about building resilience and decision-making frameworks that help officers resist negative situational pulls. For example, virtues like courage might help an officer speak up in a toxic culture, but systems like peer intervention provide concrete tools to act on that virtue.

