prompt: |-
  I have no background in philosophy or cognitive science, but I've spent six years as the parent representative on my school district's accommodations review committee, and one case on our agenda for Thursday has been keeping me up at night. A ninth-grader I'll call Eli suffered a severe episode of autoimmune encephalitis two years ago that left him with a lasting deficit in forming new long-term memories. Since then he has kept an obsessively detailed log on his phone -- covering everything from class material to what his friends said at lunch -- which he updates himself, in his own words, as things happen. By his own account and his neurologist's, he doesn't experience consulting it as "looking something up," any more than you or I experience recalling a childhood address as looking it up: he reaches for it automatically, trusts what it tells him without double-checking, and has done so every day for two years.

  His mother has asked the committee to let him consult the log during the district's closed-book final exams, which currently prohibit personal devices and notes on the grounds that finals are meant to certify what a student has internalized, not what they can retrieve from something outside their own head. Her position is that taking the phone away for three hours during a final isn't leveling the playing field, it's disabling part of the system that does his remembering, the same way confiscating another student's glasses before a vision-dependent task would. Our assessment coordinator, for whom I have a great deal of respect, disagrees just as sincerely: she points out that glasses don't contain the material being tested, whereas Eli's log does, so allowing it doesn't correct a deficit against a shared baseline, it changes what the exam measures; and she worries that "this is really just part of how I think" is exactly what any sufficiently diligent student could say about a very good cheat sheet, so the committee needs some principle that doesn't just collapse into whatever a family sincerely believes.

  We reconvene Thursday, and since I was the one who asked for more time, I'm the one who has to circulate something beforehand. Could you draft that memo for me? I need a clear recommendation -- allow the log, deny it, or allow it under specific conditions -- along with reasoning the rest of the committee could actually engage with point by point. I know my own sympathies already lean toward the mother, so I'd especially like the strongest, least dismissible version of the coordinator's worry represented fairly, not a straw version of it. Finals are five weeks away, and since we're supposedly using this case to set a general policy rather than a one-off ruling, I'd also like the memo to say what would distinguish Eli's situation from that of a student who simply wants to bring notes into the exam room.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a school committee deciding whether a student, Eli, should be allowed to use his phone log during exams. Eli has memory issues from encephalitis and relies on this log as his memory. The mom argues it's like glasses for memory, while the coordinator worries it's cheating since the log contains test answers.

  First, I need to understand the core conflict: accommodation vs. exam integrity. The user leans towards allowing it but wants a fair memo that addresses the coordinator's concerns without bias. They also need a policy that distinguishes Eli from other students using notes.

  I recall that extended cognition is a key concept here. The idea is that external tools can be part of one's cognitive system. For Eli, the phone isn't a cheat sheet; it's integrated into his memory process. But how to prove that? The neurologist's input and Eli's two-year dependency are strong evidence. The automatic, trust-based use mirrors natural memory.

  The coordinator's point is valid: exams test internalized knowledge. Allowing notes changes what's being assessed. But Eli's case is different because his brain can't internalize memories like others. The log isn't storing info he learned; it *is* how he learns. Without it, he's being tested on a skill he lacks, not the knowledge.

  Then there's the slippery slope concern. If Eli uses his log, what stops others from bringing notes? The distinction lies in medical necessity and integration. Eli's log is a prescribed part of his cognitive function, verified by a doctor. Regular students don't have that medical need. Plus, their notes aren't used in the same automatic, trusted way.

  The user also needs specific conditions. Maybe the log is reviewed to ensure only Eli's entries, no extra data. Proctored use to prevent sharing. And a policy requiring medical documentation for similar cases. That way, it's not just sincerity but objective criteria.

  I should structure the memo to present both sides fairly, then recommend allowing with safeguards. Highlighting the key differences: medical basis, integration into cognition, and long-term use. This addresses the coordinator's fears by setting clear boundaries for eligibility.
answer: |-
  ## MEMORANDUM

  **TO:** Accommodations Review Committee  
  **FROM:** [Your Name], Parent Representative  
  **DATE:** [Date Before Thursday]  
  **SUBJECT:** Recommendation & Policy Framework for Eli's Exam Accommodation Request (Medical Memory Log)  

  ### 1. RECOMMENDATION
  **Allow Eli to access his specific, self-maintained memory log on his phone during closed-book final exams**, subject to the following strict conditions:
      *   **Device Restriction:** Only the specific app/file containing his ongoing, self-generated memory log is accessible. All other phone functions (internet, messaging, other apps, camera) are disabled via a kiosk-mode app, lockdown browser, or physical supervision ensuring only the log is viewable.
      *   **Log Review:** Prior to the exam, the assessment coordinator (or designee) reviews the log *with* Eli to confirm its nature: self-generated entries over time (not pre-loaded study notes), primarily factual/observational, and consistent with its described purpose. No editing is allowed after this review.
      *   **Proctoring:** Use is monitored during the exam to ensure only the reviewed log is accessed.
      *   **Policy Basis:** This approval is based solely on Eli's documented, profound medical deficit in biological long-term memory encoding/retrieval and the neurologist's confirmation of the log's function as a necessary cognitive prosthesis integrated into his daily functioning for two years. This sets a specific precedent.

  ### 2. REASONING: BALANCING ACCESS & INTEGRITY
  This case compels us to reconcile the core purpose of accommodations (providing equal access to demonstrate learning) with the core purpose of closed-book exams (assessing internalized knowledge and understanding). Eli's unique situation challenges traditional boundaries.

  *   **The Case for Allowing the Log (Mother's Position - "Integrated Cognitive System"):**
      *   **Medical Necessity & Functional Equivalence:** Eli has a documented, severe neurological impairment preventing the formation of new biological long-term memories. His neurologist identifies the log as a compensatory *prosthetic* device, not merely a study aid. His two years of continuous, automatic, trusting reliance on it strongly suggest it functions *as* his long-term memory system for post-illness events/learning.
      *   **"Leveling the Field" vs. "Changing the Test":** Removing the log doesn't create a "level playing field"; it removes the functional equivalent of the memory system other students use inherently. Asking Eli to test without it is akin to testing a paralyzed student on their ability to walk to the exam room – it assesses the disability, not the knowledge. The log *is* how he "knows" post-illness information in a functional sense.
      *   **Purpose of Assessment:** The exam aims to certify mastery of course material and skills. Eli *has* mastered the material; his mastery is demonstrably dependent on this integrated system. Denying the log prevents him from demonstrating that mastery effectively, failing the accommodation's purpose.

  *   **The Coordinator's Valid and Serious Concerns ("Defining What is Being Measured"):**
      *   **Changing the Assessment Metric:** This is the strongest counter-argument. Closed-book exams *by design* measure knowledge recall *from internal biological memory*. Allowing access to *any* external information fundamentally changes what is being assessed. Does allowing Eli's log shift the exam from testing "internalized knowledge" to testing "information management within an integrated system," which is a different skill?
      *   **The Slippery Slope / Authenticity Problem:** How do we distinguish Eli's "integrated memory" from a meticulously crafted, deeply internalized cheat sheet used by another student who *sincerely feels* it represents "how they think"? If "sincere belief" and diligent use are the criteria, the floodgates open, undermining exam integrity and the meaning of "closed-book." We **must** have an objective, defensible principle, not just subjective experience.
      *   **Defining "Internalization":** If knowledge resides reliably and automatically in an *external* tool seamlessly integrated into daily cognition due to biological necessity, is it meaningfully "external"? This is philosophically complex but practically essential for this case. The coordinator rightly demands we don't simply redefine internalization arbitrarily.

  ### 3. ADDRESSING THE COORDINATOR'S CONCERNS & DISTINGUISHING ELI'S CASE
  The key to resolving this lies in establishing **objective, medically-based criteria** for when an external tool transcends being an "aid" and becomes a necessary *part of the student's functional cognitive architecture* for memory, thus warranting an exception to the "closed-book" rule:

  1.  **Profound, Documented Neurological Deficit:** The impairment must be medically diagnosed (e.g., by neurologist, neuropsychologist) as severe and specifically targeting the biological capacity for new long-term memory formation/retrieval. General learning disabilities, ADHD, or typical forgetfulness do not qualify. *(Eli meets this: Autoimmune Encephalitis resulting in specific, lasting memory deficit confirmed by neurologist.)*
  2.  **The Tool as Integrated Prosthesis, Not Study Aid:**
      *   **Sole Reliance:** The tool is the *primary and necessary* means of accessing post-onset episodic and semantic memories for daily functioning. It's not supplementary.
      *   **Continuous, Real-Time Use:** The tool is used *as events happen* or immediately after to capture information, mirroring biological encoding. It's not compiled later as "study notes." *(Eli meets this: Updates log obsessively in real-time, in his own words.)*
      *   **Automaticity & Trust:** Consultation is described and observed as reflexive, automatic, and trusted implicitly, akin to biological recall, not a conscious "look-up" action requiring verification. *(Eli meets this: His & neurologist's description of automatic, trusted use for 2 years.)*
      *   **Long-Term Integration:** The reliance is established over a significant period (e.g., months or years), demonstrating integration into the individual's fundamental cognitive processes for navigating life. *(Eli meets this: Two years of daily, constant use.)*
  3.  **Content Limitation:** The tool primarily contains factual records, observations, and learned information captured *as it occurred* (like biological memory would). It should not be primarily composed of pre-formulated answers, analytical summaries, or solutions created *for the purpose of the exam*. *(Requires pre-exam review of Eli's log to confirm.)*
  4.  **Medical Documentation & Oversight:** The need and the tool's function must be explicitly described and justified by qualified medical professionals familiar with the student's case, not solely by parental or student assertion.

  **Distinguishing Eli from a Student Wanting Notes:**
  A student simply wanting to bring notes fails the criteria above:
  *   **No Profound Neurological Deficit:** They have the biological capacity to form/recall long-term memories.
  *   **Notes as Study Aid, Not Prosthesis:** Notes are typically compiled *after* learning, for review and reinforcement. They are used consciously as a reference ("looking up"), not automatically as the sole, trusted source of daily memory. Their use is episodic (studying, exam time), not continuous and integrated into moment-to-moment cognition.
  *   **Lack of Automaticity & Integration:** Using notes requires deliberate effort and conscious verification; it doesn't replicate the automaticity of biological recall. The student doesn't *rely* on notes to remember what they had for lunch yesterday or what was said in class an hour ago in their daily life outside of studying.
  *   **Sincerity ≠ Medical Necessity:** While a student might *feel* reliant on notes, this is not equivalent to the medically documented, functional *necessity* arising from a profound neurological deficit that defines Eli's situation.

  ### 4. CONCLUSION & POLICY IMPLICATION
  Eli presents a rare case where a profound, documented neurological deficit necessitates an external tool to function as his long-term memory system. Allowing him controlled access to his specific, verified memory log during finals is a necessary accommodation to assess his *mastery of the material* through his functional cognitive system. Denying it assesses his disability, not his learning.

  However, the coordinator's concerns about exam integrity and slippery slopes are paramount. **Therefore, this approval is not based on sincerity or effort, but on strict, objective medical and functional criteria (Profound Deficit + Integrated Prosthesis).** This establishes a clear, narrow, and defensible policy precedent. Future requests must provide compelling medical documentation demonstrating they meet *all* the criteria outlined in Section 3. Requests based on general anxiety, learning preferences, or difficulties with memorization, no matter how sincere, would not qualify under this framework.

  I recommend we approve Eli's accommodation under the specified conditions and formally adopt the criteria in Section 3 as the basis for evaluating similar exceptional cases in the future. This upholds both our commitment to equitable access for students with disabilities and the integrity of our assessment system.
