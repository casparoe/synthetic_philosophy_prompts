  Another angle: the user's repeated overthinking might make their behavior predictable. Using randomness breaks that pattern. Plus, accepting that some encounters might happen but reducing their frequency could lower stress. The key is shifting focus from total avoidance to minimizing likelihood, which is more feasible.

