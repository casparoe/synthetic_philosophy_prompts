answer: |-
  This is a genuinely tough ethical knot to untangle, and your discomfort shows you're engaging deeply with the concept of promising – which is exactly what your seminar is about! Your friend's statement, "a promise is a promise," taps into a powerful ethical intuition, but the situation isn't quite so black-and-white. Let's break it down using the frameworks you're likely exploring:

  **1. Why Your Friend Feels Right (The Deontological View):**
  *   **Duty & Principle:** Philosophers like Immanuel Kant would argue that keeping a promise is a **categorical imperative** – a fundamental moral duty. When you make a promise, you create a moral obligation simply by the act of promising. The *content* of the promise (unpaid RA) and the *consequences* of breaking it (minimal harm) are secondary to the principle itself. Breaking a promise, even for a better opportunity, violates the principle of fidelity and undermines the very institution of promise-making. It treats the person you promised as a means to an end (your initial convenience) rather than an end in themselves deserving of respect for your word.
  *   **Autonomy & Trust:** By making the promise, you invited your friend to rely on you. She structured her summer plans (even if minimally) around your commitment. Breaking it, regardless of harm, violates the autonomy she exercised based on your word and damages the trust inherent in your friendship. It says, "My word is only good until something better comes along."

  **2. Why You Might Feel Justified (Consequentialist & Other Views):**
  *   **Minimal Harm / Better Outcome:** As you note, if she can easily find a replacement, the practical harm is low. Furthermore, the *consequences* of you taking the paid position are significantly better *for you* (pay, working with a professor you admire, potential career benefits) and arguably neutral *for her* if replaced adequately. A utilitarian might argue the overall good (your significant gain + her minimal/no loss) outweighs the bad of breaking the promise.
  *   **Changed Circumstances:** You made the promise under very different conditions (no other options). Significant, unforeseen changes can sometimes alter the moral weight of a promise. While not a "get out of jail free" card, it adds context.
  *   **Relational Ethics:** Within a friendship, there's an expectation of understanding and mutual support. A good friend *might* reasonably understand your desire to seize a valuable, unexpected opportunity, especially if you handle it sensitively and help mitigate any impact.

  **3. Why the Obligation Might Persist Even Without "Harm":**

  This is the crux of your question. Here's why the obligation might still hold weight:

  *   **The Intrinsic Wrong of Betrayal:** Breaking a promise isn't just about causing tangible harm; it's about betraying the trust placed in you and failing to uphold a commitment *you freely made*. It damages the moral fabric of the relationship and your own integrity. The "harm" is to the relationship's trustworthiness and your character as a promise-keeper.
  *   **The Social Practice of Promising:** Promises only work as a social tool if people generally keep them. If everyone broke promises whenever a slightly better option arose (even without "harm"), the whole institution would collapse. Keeping promises when it's *inconvenient* is what gives them meaning. Your friend is appealing to this social norm.
  *   **The Message It Sends:** Breaking the promise sends a message to your friend (and yourself) that your commitments are contingent and your word is flexible based on self-interest. This can erode trust more broadly than just this one instance.

  **Navigating This Ethically (Moving Beyond Theory):**

  1.  **Acknowledge the Obligation:** Start by validating your friend's point. "You're right, I did make a promise, and I understand why you're holding me to it. That promise matters to me too." This shows respect for the commitment and her feelings.
  2.  **Explain, Don't Justify:** Clearly explain the situation: the unexpected offer, the value it represents to you (pay, working with Prof. X), and that you made the initial promise when you had zero alternatives. Frame it as an unforeseen opportunity, not just "something better."
  3.  **Emphasize Mitigation:** Reiterate your belief that she can find a replacement easily and offer concrete help: "I know you said you can find someone else, and I want to make that as easy as possible. Can I help find a replacement? Can I help with the handover? I genuinely don't want to leave you in the lurch."
  4.  **Seek Release, Not Just Inform:** Don't just tell her you're backing out. *Ask* for her understanding and, ideally, her release from the promise: "Given this unexpected opportunity and the fact I believe we can find a good replacement for you, I'm hoping you might understand and allow me to take this position. I feel awful about going back on my word, but this feels like a really important chance for me."
  5.  **Accept the Consequences:** She might still be upset. She has a right to feel disappointed and to question your reliability. Respect that. The ethical action doesn't guarantee a happy friend; it means you handled the breach as responsibly as possible.
  6.  **Reflect on Your Integrity:** Ultimately, the decision rests on what kind of person you want to be. Is keeping *this specific promise*, under *these circumstances*, the most important expression of your integrity? Or is being honest about the conflict, seeking release, taking a valuable opportunity, and handling the fallout respectfully a truer reflection of your values?

  **Conclusion:**

  Your friend isn't entirely wrong – a promise *does* create a strong moral obligation based on fidelity and trust, even if breaking it causes minimal practical harm. The obligation persists because of the *intrinsic wrong* of betraying trust and undermining the practice of promising itself.

  However, ethical life involves nuance. The significant change in your circumstances (a valuable, unforeseen opportunity), the minimal practical harm if mitigated, and the potential for understanding within a friendship create a compelling case for *negotiating a release* from the promise rather than simply breaking it.

  **The most ethical path likely lies in:**  
  1.  **Honestly acknowledging the obligation and the breach.**  
  2.  **Sincerely explaining the unforeseen circumstances and the opportunity's value.**  
  3.  **Actively working to mitigate any impact on your friend (helping find a replacement).**  
  4.  **Respectfully seeking her understanding and release.**  
  5.  **Accepting her reaction with grace.**

  This approach respects the seriousness of the promise while also acknowledging the reality of changed circumstances and the value of the new opportunity. It prioritizes open communication and relationship repair over simply asserting one principle over another. Good luck with your decision and your seminar – this is a perfect real-world case study!
