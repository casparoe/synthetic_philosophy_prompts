  Working on chapter 4 of my novel and I've got a character who shrugs off any responsibility for a disaster he could've stopped, arguing that Leibniz already proved this is the best of all possible worlds, so there was nothing to improve on anyway — trying to stop it would've been pointless. Since thats basically what Leibniz's argument comes down to, what's a good comeback one of the other characters at the dinner party could hit him with?
