prompt: |-
  Ok, this has been bugging me for a while. I'm doing a math PhD, and my advisors rule is that I have to spend a couple weeks properly stuck on a new problem before I'm allowed to go read what's already been done on it, since seeing the standard approach too early just anchors you and kills any chance of finding a different angle. I sort of buy this from experience, but it also feels wrong on a deeper level: if I'm deciding how to attack a problem, how could having more relevant info beforehand ever leave me worse off than deciding with less of it, when I can always just ignore it if it turns out not to be useful? So is my advisors rule actually justified by something real, or is it just superstition that happens to work for some unrelated reason (like just forcing me to put in the effort first)?
reasoning: |-
  Okay, the user is a math PhD student struggling with their advisor's rule about not reading existing literature for the first couple of weeks when tackling a new problem. The advisor believes that early exposure to standard approaches stifles creativity, but the student feels that having more information should logically never be detrimental since they could choose to ignore it. 

  Hmm, this is actually a profound epistemological question disguised as a grad school frustration. The user isn't just asking for validation - they're questioning the very nature of how knowledge influences problem-solving. Their phrasing "on a deeper level" suggests they want a rigorous justification, not just anecdotes. 

  Let me unpack why the advisor's rule might make sense despite seeming counterintuitive. First, cognitive science shows prior knowledge actively shapes perception - it's not like we can compartmentalize cleanly. Those "standard approaches" create priming effects and functional fixedness. I recall studies where subjects who saw conventional solutions first couldn't even notice elegant alternatives that control groups found easily. 

  The key is recognizing that problem-solving isn't purely deductive - it's a messy, path-dependent process. Early exposure narrows the solution space before the user even realizes they're being constrained. Like how learning chord progressions can limit a jazz musician's improvisation at first. 

  But I should also address the user's core objection about "always being able to ignore" information. That assumes perfect metacognition, which we simply don't have. Kahneman's System 1 thinking operates subconsciously - once you've seen the standard approach, it becomes the cognitive default. The advisor's rule is basically forcing System 2 engagement. 

  The productivity argument matters too. Two weeks of authentic struggle creates deep problem immersion that skimming papers can't replicate. I remember Tao writing about how important it is to develop personal intuition before polluting it with others' formalism. 

  Still, I should acknowledge boundary cases where this rule might backfire - like if the problem was literally solved last month. The user might appreciate me noting that the advisor's policy assumes the problem has sufficient unexplored territory. 

  Ultimately this is about epistemic humility. The advisor isn't saying "never read literature" - they're creating space for the novice's mind. That's different from how an established researcher would operate. Maybe I should emphasize it's a pedagogical tool tailored to their developmental stage. 

  ...I'll structure this as a dialectic. First validate their logical concern, then hit them with the cognitive science, then the pedagogical rationale, and finally nuance it with exceptions. They're smart enough to handle complexity.
answer: |-
  Your advisor's rule is deeply justified by cognitive psychology, mathematical practice, and the nature of creative problem-solving. While your intuition that "more information can't hurt" seems logical, it overlooks how human cognition *actually works* when wrestling with ill-defined problems. Here's why the rule is empirically and theoretically sound:

  ### 1. **The Anchoring Effect (Cognitive Bias)**
     - **Psychology**: Once exposed to a solution path (especially an elegant, "standard" one), your brain becomes anchored to it. This isn't a choice; it's a subconscious cognitive bias. Attempts to "ignore" known approaches require constant, exhausting mental effort and often fail.
     - **Consequence**: You'll unconsciously tweak the standard approach rather than explore truly orthogonal strategies. Your advisor isn't protecting you from *knowing*—they're protecting you from *being captured*.

  ### 2. **Premature Closure of the Problem Space**
     - **Exploration vs. Exploitation**: Early struggle forces you to map the problem's contours yourself. You identify natural subproblems, discover hidden symmetries, and build intuition for what "feels hard." Reading first flattens this landscape into the paths others took.
     - **Example**: Suppose the standard approach uses heavy category theory. If you spend 2 weeks wrestling with combinatorics or analysis, you might discover a novel connection. If you read first, you'll likely dismiss those avenues as "not how it's done."

  ### 3. **Building Personal Intuition**
     - **Ownership**: Struggling cultivates a visceral, personal relationship with the problem. This intuition is irreplaceable when later synthesizing or critiquing existing work.
     - **Metacognition**: Being stuck reveals *your own* cognitive blind spots and problem-solving habits. Reading early masks these with others' insights.

  ### 4. **The "Curse of Knowledge"**
     - **Expert Blindness**: Once you see a solution, it becomes impossible to accurately reconstruct your prior state of ignorance. Papers rarely document dead ends or raw intuition—they present polished arguments. Starting with them skips the essential process of *becoming unstuck*.

  ### 5. **Innovation Requires Naivety**
     - **Historical Precedent**: Major breakthroughs often came from outsiders ignoring dogma (e.g., Perelman bypassing standard PDE approaches to Ricci flow). Your advisor is creating conditions for "controlled naivety."
     - **Risk Mitigation**: If you *do* find an alternative angle later, you’ll avoid wasting years on an approach the field knows is fruitless.

  ### Why You Can't Just "Ignore" What You've Read
     - **Cognitive Load**: Actively suppressing known knowledge consumes working memory, reducing resources for creativity.
     - **Implicit Priming**: Exposure to concepts activates associated neural pathways, making them more accessible than novel ones.
     - **Confirmation Bias**: You’ll unconsciously favor ideas aligning with the standard framework.

  ### When This Rule *Doesn't* Apply
     - **Well-Trodden Problems**: If the problem is solved (e.g., Fermat's Last Theorem), reinventing the wheel is pointless.
     - **Urgency**: If a thesis deadline looms, strategic reading is pragmatic.
     - **Your Experience Level**: As you mature, you’ll develop better "mental firewalls" against anchoring.

  ### Advisor's Nuanced Intent
  Your advisor isn’t advocating ignorance—they’re *staging* knowledge acquisition:
  1. **Phase 1 (Struggle)**: Build intuition, define the problem space, generate *your* ideas.
  2. **Phase 2 (Synthesis)**: Read literature, cross-pollinate your ideas with existing tools, identify gaps.

  This maximizes the chance you’ll contribute something new rather than incrementally extend known results.

  ### Verdict
  **The rule is justified science, not superstition.** It leverages cognitive constraints to force divergent thinking. The "effort" isn't just grunt work—it's cognitive conditioning to resist premature convergence. Trust the process; your frustration *is* the catalyst. 

  *Source: Cognitive psychology (Kahneman, Cropley), math pedagogy (Pólya, Tao), innovation studies (Simonton).*
