  I should recall how Hume's argument works. Hume says miracles are so improbable that no single testimony can suffice; you'd need overwhelming evidence. Sidgwick's approach seems aligned here, especially with the need for many witnesses. But he also adds the idea of burying incredulity under a mass of facts, which might go beyond testimony to include repeated experiments. That's more inductive.

  Then there's the connection to "Methods of Ethics." Sidgwick requires a "consensus of experts" for certified knowledge. In psychical research, he's advocating for accumulating evidence until it forms a critical mass that forces experts to accept it. The tension here is whether this mass of evidence from varied sources can create a consensus, or if the lack of initial expert approval undermines it.

  The user also wants to know if his epistemology for psychical research is continuous or in tension with his ethical epistemology. In ethics, he relies on expert consensus after scrutiny, but in psychical research, he's pushing against established scientific skepticism. The key might be that both require rigorous evidence, but the starting point differs—psychical research starts from a position of high skepticism, needing more evidence to shift the consensus.

  Also, Sidgwick mentions not wrangling over single pieces of evidence, which suggests avoiding debates on individual merits. Instead, trust the collective weight. This might conflict with the ethical method where each intuition must be clear and certain. But perhaps he sees the mass of facts as eventually leading to clear, certain consensus through persistence.

  The user's deeper need is likely to reconcile Sidgwick's two approaches for their seminar discussion. They need to argue whether his psychical research model is consistent with his ethical epistemology. Highlighting the Bayesian elements and the role of consensus in both could show continuity. Emphasizing the need for overwhelming evidence in the face of skepticism might resolve the tension.

  I should also consider the context of psychical research in the 1880s. Scientists were highly skeptical, so Sidgwick's strategy was pragmatic. Accumulating evidence was necessary to challenge entrenched views. This aligns with his ethical approach where consensus is built through rigorous examination, even if it takes time.

  In conclusion, Sidgwick's model is a hybrid: Bayesian in leveraging witness credibility and inductive in building a mass of facts. It's continuous with his ethical epistemology because both aim for consensus through cumulative evidence, though the path for psychical research requires more persistence due to higher initial skepticism.
answer: |-
  Sidgwick's argument in this passage presents a sophisticated model of evidential reasoning that blends Bayesian-like considerations of prior probability and testimony with a strong emphasis on cumulative inductive weight. It's continuous with his epistemology in *The Methods of Ethics* but operates under significantly different conditions regarding prior consensus.

  Here's a breakdown of the model and its relation to his ethical epistemology:

  1.  **The Core Model: Bayesian Prior Probability + Cumulative Weight of Evidence:**
      *   **Strong Prior ("Scientific Incredulity"):** Sidgwick explicitly acknowledges that established scientific understanding creates a *very strong prior improbability* against phenomena like telepathy. This incredulity has "grown long" and has "many and strong roots" – it's not easily overturned. This is akin to Hume's point about miracles: extraordinary claims require extraordinary evidence.
      *   **Fallible Witnesses with Limited "Credit" (De Morgan's Analogy):** Each witness or experiment has a finite capacity to overcome this prior ("a fair stock of credit to draw upon"). No single piece of evidence, no matter how "complete," is sufficient to overcome the immense prior improbability on its own. Sidgwick adopts De Morgan's financial analogy: the demand (to overcome the prior) is too high for any single witness's credit.
      *   **Cumulative Weight ("Burying it alive under a heap of facts"):** The solution is *accumulation*. Multiple independent pieces of evidence, each drawing on its own limited "credit," *combine* to create a collective weight of evidence large enough to eventually overwhelm the strong prior. This is the "heap of facts" that "buries" incredulity alive. It's a process of steadily increasing the likelihood ratio through repeated, varied instances.
      *   **Inductive Process ("Pegging away," "accumulate fact upon fact, add experiment upon experiment"):** The emphasis is on persistent, diverse empirical investigation. It's not just about *counting* witnesses, but about accumulating a *mass* of facts and experiments from different sources and contexts. This builds inductive weight through variety and repetition, making alternative explanations (chance, fraud, error) increasingly implausible for the *entire body* of evidence.
      *   **Avoiding Distraction ("not wrangle too much... about the conclusiveness of any one"):** Sidgwick pragmatically advises focusing on generating *more* evidence rather than getting bogged down in defending the airtight nature of *any single* case against hyper-skeptical scrutiny. He trusts that the *collective mass* will eventually be compelling.

      **Is it just Hume on Testimony?** It *includes* Hume's core insight about overcoming strong priors via multiple independent witnesses. However, Sidgwick significantly expands it:
      *   He explicitly includes *experimental* evidence alongside testimonial evidence.
      *   He emphasizes the *inductive weight* of a diverse mass of facts ("heap of facts," "mass of evidence") over just the multiplicative power of independent testimony.
      *   He frames it as a long-term strategic process ("pegging away") necessary to shift a deeply entrenched scientific paradigm.

  2.  **Relation to *The Methods of Ethics* Epistemology:**
      Sidgwick's ethical epistemology emphasizes careful reflection, logical coherence, systematic comparison of intuitions, and ultimately, the **"consensus of experts"** (the "comprehensiveness and consensus of experts" in discerning self-evident moral axioms) as the condition for certifying knowledge. The key question is whether the "heap of facts" approach aligns with this.

      *   **Continuity in Rigor and Ultimate Goal of Consensus:** There is continuity. Sidgwick isn't abandoning rigor or the goal of expert consensus for psychical research. The "heap of facts" isn't sloppy; it's the *result* of rigorous, persistent investigation ("experiment upon experiment"). The *ultimate aim* is precisely to achieve a "consensus of experts" by providing such overwhelming evidence that the prior incredulity *must* yield. He seeks to *create* the conditions for consensus where none currently exists due to the strength of the prior.
      *   **Tension in the Path to Consensus:** The tension arises in *how* consensus is achieved and the *starting point*.
          *   **Starting Point:** In ethics, Sidgwick starts *within* a tradition of philosophical reasoning where certain intuitions are already widely acknowledged (even if systematization is needed). In psychical research, he starts *against* a near-universal scientific consensus *against* the phenomena. The "consensus of experts" is initially *hostile*.
          *   **Strategy:** The ethical method relies on careful scrutiny of *existing* intuitions/reasoning to achieve clarity and consensus. The psychical research strategy involves *generating a critical mass of new empirical evidence* to *force* a reconsideration by experts entrenched in incredulity. It's more adversarial and requires overcoming active resistance.
          *   **Role of the Single Case:** The ethical method values the careful dissection of a single, clear intuition or argument. The psychical research method explicitly *de-emphasizes* the battle over any single piece of evidence ("not wrangle too much") in favor of overwhelming volume. This is a pragmatic concession to the power of the prior and the tactics of skepticism, but it might seem less focused on the meticulous scrutiny prized in ethics.
      *   **"Properly Certified" - A Process:** Sidgwick's requirement for a proposition to be "properly certified" isn't abandoned. The "heap of facts" *is the process* by which certification becomes possible for phenomena facing extreme initial skepticism. The "mass of evidence" *is* what, in this specific context, constitutes the necessary condition for overcoming the prior and achieving the eventual "consensus of experts." He's arguing that for *this type* of claim, under *these conditions*, certification *requires* this massive accumulation.

  **Conclusion:**

  Sidgwick's model is best understood as a **Bayesian-informed, cumulative weight-of-evidence strategy** specifically designed to overcome *extreme* prior improbability rooted in established scientific consensus. It combines Hume's insight about testimony with a strong inductive emphasis on diverse empirical accumulation.

  While **continuous** with *The Methods of Ethics* in its ultimate goal of rigorous knowledge and expert consensus, there is a **pragmatic tension** in the *methodology* required to achieve consensus under vastly different starting conditions. The ethical method refines existing shared intuitions; the psychical research strategy seeks to bury an active, dominant disbelief under an avalanche of new facts. The requirement for a "consensus of experts" remains paramount in both, but the path to achieving it for psychical phenomena necessitates the "heap of facts" approach precisely *because* the initial consensus is one of incredulity. Sidgwick is arguing that in this specific, hostile epistemic environment, the "heap" *is* the necessary and sufficient condition to eventually satisfy the requirement for proper certification via expert consensus. His epistemology is consistent in aim but adapts strategically to the context.

  **Key points for your discussion:**
  *   Emphasize the *combination* of Bayesian priors/testimony *and* inductive weight.
  *   Argue that the "heap of facts" *is* the path to creating the "consensus of experts" required by his epistemology, given the specific obstacle of entrenched scientific incredulity.
  *   Acknowledge the pragmatic shift in tactics (de-emphasizing single cases) as a necessary adaptation to overcome active resistance, not an abandonment of rigor.
  *   Frame the apparent tension as a difference in *strategy* forced by the *context* (hostile prior consensus vs. shared intuitive starting point), not a fundamental contradiction in his view of knowledge certification.
