prompt: |-
  In my seminar on Wittgenstein's Philosophical Investigations, we worked through Kripke's rule-following paradox as far as the standard sequence of moves -- dispositionalism, the finitude and normativity objections, and the retreat to idealized dispositions -- but stopped just before the disagreement became genuinely difficult to referee. Write a dialogue between a dispositionalist who tries to save the view by idealizing away finitude and error, and a defender of Kripke's sceptical solution who objects that even an idealized disposition tells us only what the idealized speaker would say, never what the speaker should say, so that a disposition to err consistently would count, absurdly, as correct. Give the dispositionalist a genuine rejoinder -- perhaps an appeal to malfunction, design, or statistical normalcy -- rather than an immediate concession, and have each side engage with the specific move the other has just made rather than restating their opening position. You can assume familiarity with the quus example and the basic shape of the paradox.
reasoning: |-
  We are in a seminar on Wittgenstein, discussing Kripke's rule-following paradox. The dispositionalist (D) has proposed that meaning is grounded in dispositions. Kripke's skeptic has raised two objections: 
   1. Finitude: We are finite creatures and haven't encountered all cases, so our dispositions might not cover every case.
   2. Normativity: Dispositions tell us what we *would* do, not what we *should* do (i.e., what is correct).

   The dispositionalist then retreats to *idealized* dispositions: what we *would* do if we were ideally rational, had infinite time, etc. 

   Now, the defender of Kripke's skeptical solution (S) objects that even an idealized disposition tells us only what the idealized speaker would say, not what they should say. Thus, if an idealized speaker were disposed to make consistent errors (e.g., always say '125' for '68+57' in the quus example), then that would be counted as correct, which is absurd.

   The dispositionalist must offer a genuine rejoinder without simply restating the idealization. We want a dialogue that builds step by step.

   Let's set the stage:

   D: We can avoid the finitude and error problems by appealing to ideal conditions. What I mean by 'plus' is given by what I *would* say if I were an ideal calculator: no fatigue, infinite time, etc. Then for any two numbers, I would give the correct sum.

   S: But that only tells us what you would do in such ideal conditions. It doesn't tell us what you *should* do. Suppose that, under ideal conditions, you were disposed to say that 68+57=5. Then, according to your view, that would be the correct answer. But that's absurd! The whole point of rules is that they can be misapplied. Your dispositional account cannot capture the normativity of meaning.

   D: (must offer a rejoinder) ... 

   How might the dispositionalist respond?

   Option 1: Appeal to malfunction. 
     D: If in ideal conditions I said 5, that would be because of a malfunction. But in ideal conditions, I'm functioning properly, so I wouldn't have such a disposition.

   S: But what is "proper functioning"? How do we define it without circularly appealing to the very meaning we're trying to ground? If proper functioning is defined as getting the right answers, then we are presupposing the meaning we're trying to explain.

   Option 2: Appeal to design (teleology).
     D: The ideal conditions include the condition that the cognitive system is operating as designed. Our cognitive systems are designed to compute addition, so in ideal conditions, we would compute the sum correctly.

   S: But how do we know what the design is? And what if the design is faulty? Moreover, in the context of meaning, the design story seems to presuppose that we already know what the function of the system is (e.g., to compute plus), which again presupposes the meaning of 'plus'.

   Option 3: Appeal to statistical normalcy or natural norms.
     D: The ideal conditions are those in which we are free from interfering factors and our cognitive systems are operating normally. Then, the disposition in such conditions is the correct one. And normally, we get the correct answers.

   S: But the problem is that the skeptic can always ask: what makes a particular pattern of dispositions the "normal" one? And why should we think that normal behavior aligns with correctness? What if a community of people were normally disposed to compute quus? Then according to your view, that would be correct.

   Let's try to build a dialogue that uses one of these moves and then has the skeptic respond, and then the dispositionalist tries again.

   We'll go with an appeal to design/teleology and then see how the skeptic pushes back, and then the dispositionalist might try to refine.

   Dialogue:

   D: I think you're missing something. When I talk about ideal conditions, I don't just mean any conditions. I mean conditions in which my cognitive faculties are functioning as they were designed to function. Our brains are designed to perform arithmetic operations correctly. So in ideal conditions, I would compute 68+57 as 125 because that's the function of the addition module.

   S: But how do you know that the design is for plus and not for quus? Suppose that, due to an evolutionary quirk, our brains were actually designed to compute quus. Then, in ideal conditions, we would compute 68+57 as 5. And then, according to your view, 5 would be the correct answer. But that's absurd because we know that the correct answer is 125. So your account doesn't capture the normativity: it doesn't tell us what we should say, only what we would say given our design.

   D: I see your point. But I think we can break out of the circle by noting that the design of our cognitive faculties is fixed by natural selection. Our ancestors who computed plus correctly had a survival advantage over those who computed quus. So the design is for plus.

   S: But that's an empirical claim. What if it turned out that computing quus was actually more advantageous in some environment? Then natural selection would have designed us for quus. But that doesn't make quus correct. Correctness in arithmetic isn't determined by what helped our ancestors survive. Arithmetic truths are necessary and a priori. They don't depend on contingent facts about evolution.

   D: Hmm, perhaps I need to appeal to the idea of a statistical norm in a different way. Consider: in ideal conditions, we are free from interference and we are operating according to the statistical norm for our species. And the statistical norm is to compute plus. So when I say that in ideal conditions I would say 125, I mean that this is what the normal member of our species would do when not interfered with.

   S: But again, what if the statistical norm were to compute quus? Then the normal member would say 5. And then, by your account, 5 would be the correct answer. But that's not the case. The normativity of meaning requires that there is a fact of the matter about what is correct that is independent of what we actually do, even normally.

   D: I think I have a better move. Let's grant that the design story might be contingent. But note that the idealization I propose is not just about what I would do, but about what I would do when I am reasoning correctly. And reasoning correctly is a matter of following the rules of logic and mathematics. So in ideal conditions, I am disposed to follow the rules of logic and mathematics. Then, for addition, I would get the correct answer.

   S: But now you're using the very notion of "following the rules" that we are trying to explain. How do we know what the rules of logic and mathematics are without presupposing meaning? The skeptic is challenging whether there is any fact about what rule I am following. If I am disposed in ideal conditions to compute 125 for 68+57, that might be because I am following the plus rule. But how do we know that? Maybe in ideal conditions, I am following the quus rule and that leads to 125? But that's impossible because the quus rule would give 5. So let me rephrase: the disposition in ideal conditions might be a consequence of the rule I'm following, but it doesn't fix what rule I'm following. The same disposition might be compatible with multiple rules? (But note: the disposition to say 125 for 68+57 is incompatible with the quus rule.) Wait, actually, for the specific case of 68+57, if I am disposed to say 125 in ideal conditions, then I am not following the quus rule. But the skeptic can ask: what rule am I following? It might be a rule that coincides with plus for all the cases I've considered so far, but diverges elsewhere. The disposition in ideal conditions for all pairs of numbers would fix the entire function. But the finitude problem is that we haven't considered all pairs. However, in ideal conditions, we are considering each pair. So the dispositionalist might say: in ideal conditions, I would compute the answer for every pair, and that would be the plus function.

   S: But the normativity objection remains: why is that function the one I *should* be computing? What if, in ideal conditions, I compute a function that is not plus? Then your account would say that that function is what I meant. But that function might be one that we would consider incorrect. For example, what if in ideal conditions, I compute a function that is plus for all pairs except 68+57, for which I compute 5? Then according to you, that's what I meant. But we know that's not what we mean by plus.

   D: That seems ad hoc. Why would I compute plus for all pairs except one? That's not a natural rule. I think we can appeal to simplicity: the rule that I am disposed to follow in ideal conditions is the simplest rule that fits my past usage. And plus is simpler than any rule that has an exception.

   S: But simplicity is in the eye of the beholder. And again, the skeptic can ask: why should the simplest rule be the correct one? That's a normative judgment. Moreover, what if the simplest rule that fits my past usage is quus? (For example, if I have only added numbers less than 57, then both plus and quus fit the data, and quus might be equally simple? Actually, quus is more complex because it has an exception: if x,y < 57, then x quus y = x+y, else 5. So plus is simpler.) But what if I have a disposition that in ideal conditions produces a function that is not the simplest? Then according to your account, that function would be what I meant. But that function might be one that we would consider incorrect. So again, the disposition doesn't fix what I should do.

   D: I think we are going in circles. Let me try a different tack. The problem you raise is that a disposition might be consistent but wrong. But note that in ideal conditions, I am not only disposed to compute the answers, but I am also disposed to correct myself if I make a mistake. So if I were to say 5 for 68+57, in ideal conditions I would reflect and realize that that conflicts with the rule I intended. So I would correct it to 125.

   S: But that presupposes that I have an independent grasp of the rule. How do I know that 5 is a mistake? If I were following the quus rule, then 5 would be correct. So the correction only makes sense if I already know which rule I am following. But that's what we are trying to explain.

   D: Perhaps the rule is fixed by my entire pattern of dispositions, including my dispositions to correct. And in ideal conditions, my dispositions are coherent. So the rule is the one that best fits my coherent dispositions in ideal conditions.

   S: But again, that only tells us what I would do, not what I should do. What if my coherent dispositions in ideal conditions lead me to a rule that is not plus? Then, by your account, that rule is what I meant. But we know that we mean plus. So your account might assign the wrong meaning.

   D: I think I see a way out. Let's distinguish between the rule that I actually follow and the rule that I ought to follow. The dispositional account is meant to fix the rule that I actually follow. Then, the rule that I ought to follow might be a different one (e.g., the correct arithmetic rule). But that's okay because the skeptic's challenge is about what I mean, not about what is objectively correct in arithmetic.

   S: But the normativity of meaning is precisely that if I mean plus, then I ought to say 125 for 68+57. So the meaning fact (that I mean plus) implies a norm (that I should say 125). Your dispositional account is supposed to ground meaning facts. But if the rule that I actually follow (as fixed by my dispositions) is one that says I should say 5, then that becomes the meaning fact. Then the norm would be to say 5. But that's not the norm we have in mind when we say that we mean plus.

   D: This is tough. Maybe I should concede that the dispositional account doesn't capture the full normativity of meaning, but only a kind of internal normativity: relative to the rule I actually follow, I ought to say such and such. And then the norm that we ought to follow the correct rule (like plus) is an external norm, perhaps grounded in the objective correctness of arithmetic.

   S: But then the skeptic wins because the meaning fact (that I mean plus) is not captured by the dispositional account. The dispositional account only tells me what rule I am disposed to follow, which might be quus. But I want to say that I mean plus, not quus, even if my dispositions are for quus. So the dispositional account cannot account for the fact that I mean plus.

   D: I think I have to stick to the idea that in ideal conditions, I am disposed to follow plus. And I think that's a brute fact about me. And that's what constitutes my meaning plus.

   S: But then the skeptic can still ask: what makes it the case that that disposition is what constitutes meaning? And why that rule and not another? And the normativity remains unexplained.

   We might break here, but we were asked to have the dispositionalist offer a genuine rejoinder. Let's try one more.

   D: Let me appeal to the social aspect. The ideal conditions include not just individual idealization but also ideal conditions of linguistic training and community agreement. In ideal conditions, I would be trained in the standard way and would come to agree with the community on the standard answers. Then, the rule I follow is the one that the community follows. And that rule is plus.

   S: But then you've shifted from individual dispositions to communal dispositions. And Kripke's skeptic can ask the same questions about the community: what makes it the case that the community means plus by '+'? The communal dispositions? Then the normativity problem arises again: what the community would do is not necessarily what it should do. And if the community were disposed to say 5 for 68+57 in ideal conditions, then that would be correct. But we know it's not.

   D: I see no way out. Perhaps the skeptical solution is right: there are no meaning facts. We just engage in a practice and attribute meaning based on conformity.

   S: Exactly. That's the skeptical solution.

   But the assignment asks for the dispositionalist to have a genuine rejoinder. So let me try one more time, inspired by Ruth Millikan's teleosemantics.

   D: I think we can ground the normativity in biological function. The function of a heart is to pump blood, and it malfunctions when it doesn't. Similarly, the function of our linguistic devices is to represent the world. The function of the plus rule is to track addition. So when I use the plus sign, the biological function of my cognitive system is to compute addition. Therefore, in ideal conditions (i.e., when the system is functioning properly), I compute addition. And that's what I mean by plus. And the normativity comes from the biological norm: I should compute addition because that's what the system is for.

   S: But how do we know that the biological function of the cognitive system is to compute addition? Maybe it's to compute whatever promotes survival. And if computing quus promoted survival, then that would be the function. But then we would mean quus. But again, arithmetic correctness is not relative to survival.

   D: But note that addition is a real abstract operation. The biological function is to track real properties of the world. And addition is a real property. So the function is to track addition, not quus, because addition is the real operation.

   S: Now you're appealing to a metaphysical reality of addition. But the skeptic can ask: how do we know that we are tracking that reality? And how does that help the dispositionalist? The dispositionalist account was supposed to be naturalistic, but now you're appealing to abstract objects and our ability to track them. That seems to go beyond dispositions.

   D: I admit it's a challenge. But perhaps the naturalistic account must appeal to more than just dispositions. Maybe we need a teleological account that connects our cognitive systems to the real properties they are designed to track.

   S: But then the dispositionalist account alone isn't sufficient. We need a theory of biological functions and a metaphysics of abstract objects. And that's a lot of baggage.

   The dialogue could continue, but the dispositionalist has offered a genuine rejoinder by appealing to teleology and biological function. It's not a knockdown argument, but it's a move in the literature.

   We'll end the dialogue here, noting that the dispositionalist has at least a response, even if it remains controversial.
answer: |-
  **Dialogue: Dispositionalist (D) vs. Skeptical Solution Defender (S)**

  **D:** Look, I accept that ordinary dispositions can’t ground meaning due to finitude and error—like how fatigue might make me say “5” for “68+57” instead of “125.” But if we idealize—considering my dispositions under *perfect cognitive conditions* (infinite time, no distractions, maximal rationality)—then I’d always compute the sum correctly. That’s what I *meant* by “plus” all along. Idealization handles both finitude and error.  

  **S:** Your idealization only tells us what you *would* do, not what you *should* do. Suppose—per impossible—that under these “ideal” conditions, you were disposed to say “5” for “68+57” every time. By your account, that would *be* correct, simply because it’s what your idealized self does. But that’s absurd! Consistency in error doesn’t make error correct. Normativity—the “should”—is missing.  

  **D:** Ah, but you’re ignoring *malfunction*. If my idealized self outputs “5,” that’s not a genuine disposition—it’s a glitch. Ideal conditions include *proper functioning*: my cognitive system operating as designed, free from defects. For arithmetic, “design” means executing the algorithm for addition flawlessly. So “125” isn’t just what I’d say—it’s what a properly functioning system *must* output.  

  **S:** “Design” smuggles in normativity circularly. Who decides the “proper function” of your cognitive system? If you say it’s “designed for addition,” you’re presupposing the very meaning of “plus” we’re trying to ground. Imagine a community biologically “designed” to compute *quus* (where 68+57=5). For them, ideal conditions yield “5”—so by your account, *quus* is correct. But arithmetic correctness isn’t relative to biology!  

  **D:** Not so fast—design isn’t arbitrary. Evolution or learning shaped my system to track *objective mathematical truths*. “Proper function” aligns with the normative standards of mathematics itself. If my idealized output diverges from 125, it’s a malfunction *because* it fails to track the abstract operation of addition. The normativity comes from the external reality the system was shaped to grasp.  

  **S:** Now you’re conflating *meaning* with *truth*. Kripke’s challenge is about what *I mean* by “+,” not whether my use matches Platonic addition. Suppose my idealized dispositions *do* track *quus* (perhaps due to a cosmic fluke in “design”). Then I *mean quus*, and “5” is “correct” for 68+57. But intuitively, I could still be *wrong*—meaning *plus* but misapplying it. Your view collapses meaning into what’s produced, erasing the gap between use and correctness.  

  **D:** Let’s refine: idealization includes *statistical normalcy* across a reference class. My disposition isn’t just “whatever I’d do,” but what *human cognitive systems normally do* under ideal conditions. Since humans normally compute 125 for 68+57 in such scenarios, that’s the baseline for “correct.” A consistent error isn’t “normal”—it’s a deviation, like a disease. Normativity arises from species-typical functioning.  

  **S:** But statistical normalcy is descriptive, not normative! If 99% of idealized humans computed *quus*, would *quus* be correct? No—we’d say they’re all mistaken. Meaning norms aren’t majoritarian; they constrain what’s *permissible*. Your appeal to “normalcy” just pushes the problem back: why *should* I align with the majority?  

  **D:** Because meaning is grounded in our shared form of life. The “normal” isn’t statistical accident—it’s what *sustains successful practice*. If everyone ideally computed *quus*, our practices (e.g., building bridges) would collapse. But computing *plus* works; it’s “normal” *because* it’s adaptive. The “should” is implicit in what preserves our linguistic community’s coherence.  

  **S:** Now you’ve shifted to pragmatism—but Kripke’s skeptic asks: what makes *this* practice (e.g., saying “125”) an application of *plus* rather than a *new* rule? Your “success” criterion is just another disposition—to prefer outcomes that “work.” But the skeptic demands: why *should* this count as following the *old* rule? Your idealization still reduces meaning to idealized behavior, not justification.  

  **D:** Then let’s tie it back to *training*. When I learned “+,” I was drilled on cases like 2+2=4. Idealized dispositions extend this training *consistently*. If I output “5” ideally, it violates my initial training pattern—a *misfire* of the learning mechanism. The “should” comes from fidelity to the paradigm cases that fixed the rule’s content.  

  **S:** But the *quus* skeptic argues those initial cases underdetermine the rule! You call “5” a misfire, but only if you *already assume* the rule is *plus*. Without that assumption, your ideal output is just a brute fact. The normativity gap remains: your account tells us what’s *regular*, not what’s *right*.  

  **D:** Perhaps—but if we *combine* these—design, normalcy, training, and success—we get a robust naturalistic picture. It’s not circular; it’s interdependent. The skeptic’s demand for a non-dispositional “should” is spooky—like a divine command. In a natural world, normativity *just is* what emerges from well-functioning, socially embedded dispositions.  

  **S:** And that’s the rub: Kripke’s point is that this “emergence” fails. Meaning requires a *standard* to judge even idealized dispositions, but you’ve reduced the standard to the disposition itself. The paradox stands.  

  *(The dialogue ends at an impasse, mirroring the unresolved tension in the literature: dispositionalism’s naturalism vs. the skeptic’s demand for irreducible normativity.)*
