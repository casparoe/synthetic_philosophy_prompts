  I'm about two-thirds into a novel and stuck on a dinner table scene I really want to get right. One of my characters is a retired philosophy professor, an old-school Kantian to his bones, and he ends up sparring with his granddaughter, who just quit a normal job to go work at a cultured-meat startup and is pretty righteous about animal welfare. I ran an early draft by my writing group and one friend said Kant's whole position basically boils down to "be nice to animals so you don't turn into someone who's mean to people," which, fair, but that's the 101 version and I definately don't want my professor just reciting it like a strawman -- I want him actually reasoning like a Kantian when his granddaughter throws things at him that Kant himself never had to deal with.

  So here's what I'm hoping you can help me work out, sticking close to the actual structure of his argument (the rational-nature-as-an-end-in-itself stuff and the "indirect duties" doctrine, not just a vague "animals aren't smart enough" gloss). First: does it even touch his position that we now know some animals pass mirror self-recognition tests, use tools, seem to plan ahead, given that his whole criterion was about autonomy and moral agency, not raw intelligence? Second, and this is the one I keep getting stuck on -- his case against cruelty rests on a specific act corroding a specific person's character, so does that mean industrial factory farming, which is anonymous and diffuse, with no single person's character really on the line in any one act, slips through a gap he never saw coming? And by that same logic, would cultured meat, where literally no animal is ever harmed, get a totally clean bill of health from him, or is there some other Kantian resource he'd reach for -- duties to oneself, maybe, or some worry about treating living things as mere means even when nobody suffers for it? I'd rather my grandfather character be maddening because he's rigorous than because he's a cartoon, so I want the actual reasoning right, not just the soundbite.
