  P(A → B) = P(A → B | B) * P(B) + P(A → B | not B) * P(not B)

  If we assume that P(A → B | B) should be high because B is true, and similarly, P(A → B | not B) should be low. But if we stick to the initial assumption, P(A → B | B) = P(B|A, B) which is 1. Similarly, P(A → B | not B) = P(B|A, not B) which is 0. Substituting back:

  P(A → B) = 1 * P(B) + 0 * P(not B) = P(B)

  But by the initial assumption, P(A → B) = P(B|A). So P(B|A) = P(B). This must hold for all A and B, which implies that A and B are independent, trivializing the conditional.

