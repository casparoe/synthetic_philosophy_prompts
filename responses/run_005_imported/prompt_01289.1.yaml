  I should break down the steps clearly. Start with the assumption that the probability of the conditional is P(B|A). Then consider the case when we learn that A is true. At that point, the conditional should reduce to B, so P(B|A) must be 1 if B is true, but that's straightforward. The real issue comes when we look at the probability of the conditional given A or given not-A. 

