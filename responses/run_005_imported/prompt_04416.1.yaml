answer: |-
  You've hit on a crucial point! Your intuition about average utilitarianism avoiding the Repugnant Conclusion is absolutely correct – and that *is* why it was proposed as a solution. Philosophers like Derek Parfit absolutely *did* consider this option, and it does technically dodge the specific problem of preferring the massive "barely worth living" population (Population Z) over a smaller thriving one (Population A).

  **So why isn't it hailed as the simple, obvious answer? Because average utilitarianism introduces its own set of highly counterintuitive and arguably "repugnant" implications that many find unacceptable.**

  Here's why switching to the average doesn't magically solve everything and creates new headaches:

  1.  **The "Extinction" or "Mere Addition" Problem:**
      *   **Scenario:** Imagine a world with 1 billion extremely happy people (average happiness = 10). Now imagine adding 10 new people who are *also* extremely happy (happiness = 10). What happens to the average? It stays exactly 10.
      *   **Problem:** According to strict average utilitarianism, adding these new happy people is morally *neutral*. It doesn't make the world better. But intuitively, adding more happy people *should* be a good thing!
      *   **Worse Scenario:** Now imagine the original population has an average happiness of 10. What if we could add a new group of people who are *slightly less happy* than the current average, but still very happy (say, 9.9)? Adding them *lowers* the average happiness (to, say, 9.999). Strict average utilitarianism says this makes the world *worse*, even though we've added millions of very happy lives! This seems perverse.
      *   **The Ultimate Absurdity:** If the only way to *increase* average happiness was to *eliminate* some people whose happiness was *below* the current average (even if they are quite happy overall!), average utilitarianism could demand this. This leads towards conclusions justifying killing happier-than-average people to boost the average – a horrifying implication.

  2.  **The "Anti-Natalism" / "Sadistic Conclusion" Problem:**
      *   **Scenario:** Consider a couple contemplating having a child. The existing population has a high average happiness (say, 8). The potential child would have a happy life, but *slightly below* the current average (say, 7).
      *   **Problem:** Adding this happy child *lowers* the average happiness (to, say, 7.999). Strict average utilitarianism therefore says it is *morally wrong* to have this child. Preventing the existence of a happy person is seen as obligatory because they aren't *quite* as happy as the current average.
      *   **Worse Scenario:** Now imagine a world with miserable people (average happiness = -5). Adding a new person who has a *slightly less miserable* life (happiness = -4) would *increase* the average happiness (to, say, -4.999). Strict average utilitarianism says it is *morally good* to add this person who will suffer intensely, just because they suffer slightly less than the current average! This is the "Sadistic Conclusion."

  3.  **Ignoring the Total Good:**
      *   Intuition tells us that creating a large number of people with genuinely good lives (even if not *quite* as good as the current average) adds significant value to the world. Average utilitarianism completely ignores this total sum of well-being gained, focusing solely on the mathematical average. This feels like it misses something fundamentally important about why well-being matters.

  **Why your roommate said "it's not that simple":**

  Your roommate was right, though unhelpfully brief. The problem isn't that averaging *fails* to avoid the Repugnant Conclusion (it succeeds at that). The problem is that the *cost* of avoiding it via averaging is adopting a theory that implies:
  *   Adding more happy people is morally irrelevant.
  *   Adding happy people slightly below the average is morally bad.
  *   Adding suffering people slightly above a miserable average is morally good.
  *   Reducing population size might be required to increase the average.

  These implications strike many philosophers as *equally repugnant*, if not more so in some cases, than the original Repugnant Conclusion. It doesn't feel like a *solution*; it feels like swapping one terrible implication for several others.

  **Why the "Impossibility Theorems" and "Critical Level" Theories?**

  *   **Impossibility Theorems:** Work like the "Mere Addition Paradox" (Parfit) and formal theorems (e.g., by Ng, Blackorby, Donaldson) show that it's incredibly hard (some argue *impossible*) to find a population axiology (a theory for ranking populations) that satisfies *all* of our strong intuitive desiderata simultaneously (e.g., avoiding the Repugnant Conclusion, avoiding the Sadistic Conclusion, respecting the value of adding happy people, respecting transitivity). Average utilitarianism satisfies *some* but fails *others* spectacularly. Total utilitarianism satisfies *others* but fails on the Repugnant Conclusion. These theorems highlight the deep difficulty.
  *   **Critical Level Theories:** These are attempts to find a middle ground. Instead of summing happiness (Total) or averaging it (Average), they say we sum the amount by which each person's happiness *exceeds* a certain "critical level" (often set at zero, but sometimes higher). This aims to:
      *   Avoid the Repugnant Conclusion: Adding masses of people barely above zero doesn't add much value per person if the critical level is zero (it's essentially Total Utilitarianism) or can be avoided if the critical level is set higher.
      *   Avoid the worst of Average Utilitarianism: Adding a happy person above the critical level *always* adds positive value. Adding a person below the critical level (in misery) adds negative value.
      *   However... setting the critical level introduces new controversies. Is zero the right level? Is a positive level justified? Doesn't this just push the repugnance elsewhere? The debate continues.

  **In Summary:**

  *   **You are absolutely right:** Average Utilitarianism *does* technically avoid the specific Repugnant Conclusion you described.
  *   **The reason it's not "the answer":** Avoiding that one problem comes at the cost of introducing several other deeply counterintuitive and morally problematic implications that many find unacceptable. It creates new "repugnant conclusions."
  *   **The core issue:** Philosophers are struggling to find a theory that satisfies *all* of our strong intuitions about population ethics. We want to value happy lives, avoid miserable lives, respect existing populations, and avoid conclusions that feel absurd or horrific. So far, no theory perfectly achieves this. Parfit's anguish stemmed from recognizing that *all* seemingly simple solutions (like total or average) lead to deeply troubling results in other scenarios.
  *   **Your intuition is valuable:** You've grasped a key move in the debate. The fact that averaging "solves" the original problem but creates new ones highlights the profound difficulty Parfit and others wrestled with. There *is* no universally accepted, intuitively satisfying "Theory X" yet. The search continues, involving complex trade-offs between different values we hold dear. Your frustration is shared by professional philosophers!
