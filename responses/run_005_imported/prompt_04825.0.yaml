  I'm about a third of the way into a novel set at a fictional debate-college modeled loosely on places like Nalanda, and a big chunk of the plot hinges on a formal public debate (a shastrartha) between two scholars competing for the patronage of a local king. One is a Naiyayika logician, the other a Buddhist monk trained in the Dignaga/Dharmakirti line, and I want their actual argument to be the emotional climax of the chapter, so it needs to be real philosophy and not just two guys shouting "logic!" at each other. The crux I've settled on is upamana, "comparison" -- my Naiyayika treats it as a fourth, irreducible pramana, using the classic gavaya example (someone's told a gavaya is "like a cow," then later spots one in the forest and correctly names it off the resemblance), while my Buddhist monk has been trained to insist that whole process is just perception plus memory plus an ordinary inference wearing a trenchcoat, so there's no need to add a whole new seperate category of knowledge-source just for it.

  I studied continental/analytic stuff in grad school, not classical Indian philosophy, so I dont trust my own instincts about where the sharpest objections and comebacks actually live -- I keep writing drafts where one of the two is obviously just there to lose. Could you write out the actual exchange for me, maybe 15-20 beats long, where each line genuinely responds to the substance of what the other guy just said rather than just restating their opening position with more confidence? No need for scene-setting or dialogue tags, just the back-and-forth itself, I'll fold it into the prose later. And if it comes up naturally, I'd love for the monk to also take a swing at sabda (testimony), since that's apparently the other pramana his school is most famous for trying to reduce to inference -- but only if it fits, I don't want the whole thing to feel like a checklist.
