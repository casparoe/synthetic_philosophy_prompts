prompt: |-
  This happened in my friend group a few weeks ago and I still can't let it go, so I want an outside read on it. One of my closest friends, R, went off on another mutual friend in our group chat for cheating on his girlfriend — we're talking full paragraphs about how 'people who do that have no respect for anyone' and how 'it tells you everything about someone's character.' I'm not defending the guy, cheating sucks and he clearly messed up. Thing is, me and one other person in the group happen to know that R cheated on an ex of hers a few years back, before most of the group even knew her, and as far as I can tell she's never mentioned it to anyone currently in the group, and definately not to the guy she was just dragging. When I brought it up to her privately, she said something like 'that was a completely different situation and I regretted it for years, it's not the same,' and kind of shut the conversation down from there.

  I brought this to two other friends and got totally opposite reactions. One said R basically has no business saying any of that, full stop, and should of just kept quiet or DMed the guy instead of going off in front of everyone. The other said that's a total non-sequitur — he cheated, that's just a fact, and it stays a fact no matter what R has or hasn't done, so bringing up her past is just changing the subject instead of engaging with whether the criticism itself is correct. And now I've got a third thing bugging me on top of those two: if having done something in your past permanently disqualifies you from ever calling that behavior out in anyone else, doesn't that basically mean nobody gets to criticize anything, since who hasn't messed up somewhere? That conclusion feels way too strong, but I can't work out exactly where it breaks down.

  I'm a PhD student in social psych (not ethics — my actual research is on memory, none of this is related), but I sat in on a moral-judgment talk last month, which is probably why my brain latched onto this instead of, you know, working on my dissertation. So: is there an actual principled way to sort out when someone's own history undercuts their right to call something out, versus when that's just a distraction from whether the criticism is correct? Does it matter that R at least claims to regret what she did, as opposed to still doing the same thing while criticizing someone else for it? And does my 'nobody could ever criticize anything' worry actually pose a real problem here, or is there a reason it doesn't follow the way it seems to?
