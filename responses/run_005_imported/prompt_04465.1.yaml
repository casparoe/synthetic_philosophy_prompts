  Okay, let me start by unpacking this user's query. They're preparing a seminar on historical theories of lying and are stuck on a specific passage from Augustine's "De Mendacio." The user mentions that Augustine himself found this text problematic, which adds an interesting layer. The passage in question deals with a moral dilemma: choosing between burning incense to an idol (a sin) or being raped (a violation). Augustine argues that it's worse to commit a lighter sin oneself than to suffer a heavier sin committed by another. The user is particularly thrown by the line "it is worse to steal than to suffer murder" and wants to understand the underlying principle and whether Augustine's argument holds up philosophically.

  First, I need to recall Augustine's core ethical framework. His ethics are deeply rooted in Neo-Platonism and Christian theology. The soul's purity is paramount, and sin is an internal corruption. So, any act that corrupts the soul is worse than external harm. That's key here. The user is questioning whether the principle is about ownership of the act, consent, or the soul versus the body. 

  Looking at the passage, Augustine distinguishes between one's own sin and another's sin against you. He emphasizes that sin is only imputed to the person who commits it. So, if someone forces you to choose between stealing or being murdered, choosing to steal makes the sin yours, whereas being murdered is the other person's sin. Therefore, stealing is worse because it's your own moral failure. 

  The user is confused by the comparison between stealing and suffering murder. How can stealing be worse than murder? But in Augustine's view, the severity of the act isn't just about the physical outcome but about whose soul is tainted. Even if murder is objectively worse, the act of stealing when you could avoid it by dying makes the stealing your sin, thus more damaging to your soul than being a victim of murder.

  The user also wonders if Augustine is biting a bullet he shouldn't. Here, I need to consider critiques. Critics might argue that this perspective ignores the physical and psychological trauma of being violated. Augustine's stance seems to undervalue bodily integrity and the real harm suffered by victims. His framework might also be too rigid, not allowing for nuances like coercion, where moral responsibility could be mitigated.

  The user's deeper need might be to present this argument fairly in their seminar while also addressing its controversial aspects. They likely want to show how Augustine's view fits into his broader prohibition against lying, even in extreme situations. They might also need to discuss whether this argument is consistent with other parts of his philosophy or if it's an outlier.

  I should break down Augustine's argument step by step: the principle of ownership of sin, the hierarchy of sins, and the distinction between committing vs. suffering evil. Highlighting the soul's inviolability as the core principle. Then, address the critiques to give a balanced view. Emphasize that for Augustine, the soul's corruption is the ultimate evil, which justifies his conclusion, even if it seems counterintuitive. 

  Also, note that Augustine's later suppression of the text might indicate his own doubts, which could be a point for discussion. The user might appreciate pointing out that even Augustine struggled with this, showing the complexity of applying rigid moral principles to real-world dilemmas.

