  ## Memorandum: Recommendation for Candidate Evaluation Process  

  **To:** Promotion and Tenure Committee Members  
  **From:** Chair, Philosophy Department P&T Committee  
  **Date:** October 26, 2023  
  **Subject:** Resolution Path for Candidate [Name]’s Tenure Review  

  ### I. Context Summary  
  The committee faces a challenging impasse regarding the evaluation of the candidate’s book manuscript. Six confidential external letters—three supportive, three critical—reveal no conflicts of interest, asymmetrical expertise, or procedural irregularities. The division correlates with methodological traditions: scholars within the candidate’s tradition endorse the work, while those from a rival tradition dissent. This has prompted two principled positions:  
  - **Elga "Equal-Weight" View**: The split constitutes higher-order evidence that our individual judgments are unreliable, warranting delay.  
  - **Kelly "Right-Reasons" View**: Our first-order assessments (based on reading the book) should prevail regardless of external disagreement.  

  ### II. Recommended Action: **Vote This Cycle**  
  After thorough deliberation, I recommend we proceed to a formal vote based on our independent evaluations of the manuscript. A final vote will occur at our upcoming meeting, with each member submitting a written rationale.  

  #### *Justification for Voting Now*:  
  1. **The Disagreement Is Not Epistemically Symmetric**:  
     The correlation between methodological tradition and referee stance suggests this is not "peer disagreement" in the Elgean sense (where peers share fundamental priors). When evaluations split along paradigmatic lines, the Kelly view applies: we must prioritize our *own* reasoned assessment of the book’s merit relative to departmental standards.  

  2. **Avoiding Epistemic Circularity**:  
     Further delay or new letters risk infinite regress. If two new referees split (e.g., 1–1), we face the same dilemma. If they agree, their methodological alignment would remain suspect. Our duty is to evaluate scholarly rigor—not outsource departmental judgment.  

  3. **Procedural Fairness to the Candidate**:  
     Extending the timeline penalizes the candidate for a split traceable to field-wide methodological disputes beyond their control. Voting acknowledges our responsibility as their primary evaluators.  

  #### *Timeline*:  
  - Final discussion and vote: **November 2, 2023**.  
  - Written rationales due: **November 9, 2023**.  

  ### III. Engagement with Alternatives  

  #### **A. Extending the Clock by One Year (Elga View)**  
  *Strongest Reason*: Prevents hasty judgment amid unresolved epistemic uncertainty. Allows the candidate to strengthen their dossier.  
  *Why Set Aside*:  
  - The methodological rift implies the disagreement is *structural*, not resolvable by time.  
  - Higher-order evidence loses force when referees operate under conflicting evaluative frameworks.  
  - Unfairly prolongs uncertainty for the candidate based on factors external to their work.  

  #### **B. Commissioning Two Tie-Breaking Letters (Procedural Compromise)**  
  *Strongest Reason*: Adds more data, potentially breaking the deadlock transparently.  
  *Why Set Aside*:  
  - High risk of replicating the same split (e.g., 1–1), leaving us no wiser.  
  - Delays decision by 3–4 months (referee recruitment + review) with no guarantee of clarity.  
  - May imply our department lacks confidence in its own evaluative capacity, setting a problematic precedent.  

  ### IV. Path Forward  
  Our primary obligation is to render a decision grounded in **our collective expertise** and departmental criteria. While external letters inform our process, they cannot absolve us of the responsibility to judge the work ourselves. I urge all members to:  
  1. Revisit the manuscript before the meeting.  
  2. Prepare to articulate how the book meets (or falls short of) tenure standards *independent of referee splits*.  
  3. Vote conscientiously based on first-order evidence.  

  The committee’s integrity lies in embracing this duty—not in seeking unattainable consensus from a philosophically divided field.  

  Respectfully,  
  [Your Name]  
  Chair, Philosophy P&T Committee  

  ---  
  **Key Philosophical Engagement**:  
  - **To Elga Camp**: The equal-weight view assumes symmetric rationality among disagreeing peers. Here, methodological divergences undermine that symmetry.  
  - **To Kelly Camp**: "Right reasons" must confront whether rival tradition critiques reveal objective flaws (e.g., argumentative gaps) vs. paradigm-driven dissent.  
  - **To Both**: The candidate’s work exists *within a specific tradition*. Our vote should assess its rigor *within that tradition* while ensuring it meets universal scholarly standards.
