answer: |-
  You're right to push for a decisive resolution here—this isn't just an academic quibble, but a core question about the very nature of rationality. Let's dismantle the subjectivist objection and build the case for common priors as a *structural requirement* of ideal rationality, not merely a preference.

  **The Core Argument: Priors as Coordination Devices Under Uncertainty**

  1.  **The Subjectivist Blind Spot:** Orthodox subjectivism (de Finetti, Savage) correctly identifies that *within a single agent's framework*, priors are primitive. But it fails to address the *inter-agent* problem of rational discourse. When two agents disagree *after* updating on all shared evidence, subjectivism shrugs: "Different strokes." This treats rationality as solipsistic. True ideal rationality, however, must govern how agents *should* reason *together* to converge on truth in a shared world. Common priors are the necessary coordination mechanism for this.

  2.  **The Unprincipled Privilege Charge:** Imagine two agents, Alice and Bob, with different priors P_A and P_B over hypothesis H, after seeing identical evidence E. Alice says P_A(H|E) = 0.8, Bob says P_B(H|E) = 0.2. Subjectivism says both are rational *if* they updated correctly *from their arbitrary starting points*. But *why* did Alice start with P_A(H) = 0.9 and Bob with P_B(H) = 0.1? If the *only* difference is "I'm Alice" and "I'm Bob," this is pure indexical bias – privileging one's own origin story solely because it's *mine*. Ideal rationality demands we purge such arbitrary self-favoritism. The "origin" isn't a mystical choice; it's a placeholder for *how you came to be in this epistemic state*. If no *objective* reason distinguishes the origins, privileging yours is irrational bias.

  3.  **The Veil of Ignorance as a Test for Bias (Hanson's Key Insight):** Before you know *which* rational agent you will be (Alice or Bob, or anyone else in a reference class of epistemically symmetric agents), how would you want the agents to reason? You'd demand a *rule* for forming priors that any agent in your position *must* follow, ensuring you won't be disadvantaged by arbitrary factors. The only rule immune to this arbitrariness is one guaranteeing all agents start with the *same* prior P. Anything else allows luck (which agent you happened to be) to dictate your beliefs, violating the ideal of impartiality central to rationality. Rationality requires procedures that are *impersonal*.

  4.  **"But Priors are Subjective Inputs!" - A Misunderstanding of "Subjective":** Subjectivism confuses "subjective" with "arbitrary." While priors necessarily reflect *initial* uncertainty, they are not *unconstrained*. Rationality imposes structural constraints:
      *   **Coherence:** Must satisfy probability axioms.
      *   **Calibration (in the limit):** Must allow convergence to truth with sufficient evidence (via Bayesian updating).
      *   **Impartiality:** Must not arbitrarily privilege one's own epistemic origin over symmetrically positioned others.
      The common prior requirement flows directly from impartiality. It doesn't dictate *which* specific prior (e.g., uniform, maximum entropy), only that *whatever prior is used, it must be the same for all symmetrically positioned agents*. Choosing a different prior *without justification* violates impartiality.

  5.  **The "Updating Can Be Graded, Priors Cannot" Dodge:** This is a false dichotomy. While the *mechanics* of updating are directly gradable via coherence axioms, the *selection* of priors is gradable via *meta-constraints* like impartiality and the requirement for convergence. The subjectivist arbitrarily stops grading at the prior. Ideal rationality demands we grade the *entire epistemic procedure*, including the avoidance of arbitrary self-privilege at the origin. Saying "only updating matters" is like saying only how you drive matters, not whether you started on the correct side of the road in a symmetric intersection.

  **What Counts as a Legitimate "Origin Dispute"?**

  An origin dispute is legitimate **only if** it points to a *fundamental, objective asymmetry* in the agents' epistemic positions *prior to* the evidence under discussion, which *rationally justifies* different starting points. Crucially, this asymmetry must be defensible *without* presupposing the truth of the hypothesis in question or relying on circular self-trust. Examples:

  1.  **Asymmetric Access to Foundational Evidence:** Agent A witnessed event X firsthand at time T-10, while Agent B only learned second-hand reports filtered through a known-biased source. *Before* discussing the current evidence E about the *consequences* of X, their priors about X itself can justifiably differ. A's prior is informed by direct observation; B's is informed by unreliable transmission. The asymmetry is in their *causal history* w.r.t. X. (Key: This is about *how they know what they know*, not about differing interpretations of *shared* evidence).
  2.  **Fundamentally Different Causal Histories / Sensory Modalities:** A human and a sophisticated AI might justifiably have different priors about the nature of qualia or the likelihood of certain physical theories, *if* their fundamental modes of interacting with the world (biological senses vs. digital sensors, different inherent processing architectures) provide intrinsically different streams of foundational data. The asymmetry is in their *sensory apparatus or cognitive architecture*.
  3.  **Asymmetric Meta-Knowledge about Reliability:** Agent A has extensive, verified history showing her memory/intuitions about domain D are highly reliable. Agent B has a history showing his intuitions in D are often flawed. *Before* seeing new evidence E in D, they might justifiably weight their own initial intuitions about E differently. The asymmetry is in the *track record of their own cognitive processes* relevant to the domain. (This is tricky and prone to bias; strong independent evidence of the track record asymmetry is needed).

  **What Does *NOT* Count as a Legitimate Origin Dispute:**

  1.  **"My intuition/gut feeling is strong."** (Unjustified self-privilege).
  2.  **"My culture/upbringing taught me this."** (Unless accompanied by a *rational* argument that this upbringing granted *asymmetric access to reliable truth*, not just different indoctrination).
  3.  **"I just start with more optimism/pessimism."** (Arbitrary temperament).
  4.  **"My unique life experiences shape my view."** (Requires showing these experiences constitute *objectively better evidence*, not just *different* evidence. Vague appeals to "unique perspective" usually fail).
  5.  **"I trust my sources more."** (Requires an *independent, objective justification* for why your sources are inherently more reliable on the *foundational* points, not just on the current evidence E).

  **Implications for Everyday Disagreement Among Careful, Well-Informed People:**

  This view *does* make persistent disagreement after sharing all relevant evidence **rationally suspicious**, but *not* necessarily evidence of *irrationality* in the human sense. It points towards *one of three things*:

  1.  **Hidden Evidence/Asymmetry:** The disagreement reveals a *previously unrecognized* asymmetry in their epistemic origins or access to foundational evidence. They need to dig deeper into *why* they started where they did. ("Wait, *why* are you so skeptical of government data? Did you have a formative experience I don't know about?").
  2.  **Computational/Idealization Gap:** Humans aren't ideal Bayesian agents. They have limited memory, processing power, and struggle with complex priors. Disagreement might stem from differing approximations, heuristics, or computational shortcuts used to handle the overwhelming complexity of forming a truly common prior over all possible states. This is a *practical* failure, not a fundamental rational one. ("We both agree on the principles, but my model simplified factor X, while yours simplified factor Y, leading to divergence.").
  3.  **Fuzzy or Ill-Defined Reference Class/Hypothesis Space:** The "symmetrically positioned agents" reference class might be ambiguous. What counts as "foundational" for this specific question? Is the hypothesis space well-defined? Disagreement might stem from subtly different conceptualizations of the problem itself, which trace back to legitimate differences in how they map the world onto probability spaces. ("I think 'economic efficiency' includes long-term sustainability, you seem to define it more narrowly based on current GDP. That difference might be rooted in how we were taught economics.").

  **Conclusion:**

  The subjectivist defense of arbitrary priors fails because it ignores the *interpersonal imperative* of rationality. Ideal rationality isn't just about internal coherence; it's about constructing beliefs in a way that is *impersonal* and *impartial*, ensuring convergence among agents inhabiting the same reality. Robin Hanson's "pre-rationality" argument succeeds: committing to a common prior *before* knowing your specific epistemic origin is the only way to purge unprincipled indexical bias. Legitimate origin disputes exist but are rare, requiring demonstrable, objective asymmetries in foundational evidence access or cognitive architecture. Everyday disagreement among careful thinkers isn't *proof* of irrationality, but it *is* a red flag indicating either hidden asymmetries, practical computational limitations, or conceptual mismatches that need resolution. Rationality *requires* suspicion of persistent disagreement, pushing us to seek these underlying causes rather than accepting divergent priors as an unbridgeable subjective chasm. The goal isn't bland conformity, but the hard-won convergence that comes from rigorously aligning our starting points and updating rules.
