  The user might also be hinting at a deeper concern: Does this asymmetry force us toward dispositional essentialism (à la Bird)? Bird argues dispositions are irreducible, and masks show conditionals can't capture them. But I should note alternatives: Choi’s "comparative" fix (adding ideal conditions) or Manley/Wasserman’s gradable approach. However, each has trade-offs—complexity or vagueness. 

  The user’s tone suggests frustration with superficial treatments. They want the "why" behind the mechanics, so I’ll emphasize structural differences: finks alter the object’s state pre-stimulus, masks allow the disposition to activate but block output. That’s why Lewis’s basis-retention is a shield against finks but blind to masks. 

  Also, they might be weighing if RCA’s failure against masks undermines conditional analyses entirely. I should acknowledge that while some (like Bird) see it as a dead end, others keep patching. The real tension is between simplicity and completeness—RCA avoids finks but can’t dodge masks without risking circularity (if "ideal conditions" sneak in dispositional terms). 

