prompt: |-
  Ok so this has been bugging me since a family bbq a few weeks back and I still haven't sorted out what I actually think about it. My older brother pulled me aside and told me he's worried about how much I've been drinking lately, like 4-5 beers most nights after the kids are in bed, and that it's probably making me less present as a dad. Annoying thing is he's probably just factually right about that, I have been overdoing it. But this is the same brother who spent basically his whole 20s and half his 30s as a genuinely bad alcoholic, missed my wedding rehearsal dinner because he was too drunk to stand, and said some truly nasty stuff to our mom more than once back then. He's been sober 5 years now and is honestly a way better, more solid person, I don't want to take that away from him at all. Still, in the moment my gut reaction was basically "you, of all people, do not get to say this to me," even though I couldn't really explain why that should matter if what he's saying is true.

  So I brought it up with a friend over coffee and she basically said I was just deflecting, that wether he used to have a way worse drinking problem than me has zero bearing on if what he's saying right now is true, and that I should judge the point on its own instead of judging the guy making it. Which, ok, I can't really find a hole in that logically. But it still feels incomplete to me somehow, like there's a piece missing from that picture. Its not that I think he's factually wrong, it's more like I've got this nagging sense that WHO says something can matter for reasons that go beyond whether its true, and I honestly can't articulate what those reasons would even be, if they exist at all.

  So genuinely curious what you think here: does it actually matter, in some real sense, that this is coming from him specifically, separate from whether he's correct? And does the sober 5 years change anything, like does cleaning up your own act eventually earn you the right to say this kind of stuff, or is that whole question beside the point and my friend's just right and I should drop it and actually listen to him?
reasoning: |-
  Okay, this user is grappling with a complex emotional and logical dilemma. He acknowledges his brother's factual correctness about his drinking habits, but struggles with the messenger due to the brother's own past alcoholism. 

  The core tension here is between truth and emotional validity. Logically, his friend is correct - the message stands separate from the messenger. But humans don't operate purely on logic. That visceral "you of all people" reaction deserves examination. 

  What's interesting is how the user articulates this isn't about denying the truth, but sensing there's something legitimate about the discomfort with the source. That's actually quite psychologically astute. The brother's past creates layers: potential hypocrisy, unprocessed resentment, and the complicated dynamics of reformed addicts giving advice. 

  The five years sober matters because it shows genuine change, but doesn't automatically erase history. The user seems to respect the brother's transformation ("don't want to take that away from him") while still feeling the sting of past wounds. That wedding rehearsal dinner absence clearly still carries weight. 

  Perhaps what's missing from the friend's purely logical approach is recognition of relational ethics. When someone has caused harm, there's a process to rebuilding trust and the right to speak into your life. The brother may have earned that right through five years of sobriety and changed behavior, but the user's feelings indicate that process might be incomplete for him personally. 

  The productive path forward seems twofold: separate the message about drinking from the messenger (since the user already acknowledges its truth), while separately addressing the unresolved relational dynamics. The key question isn't "does he have the right to say it?" but "how do I process my feelings about him saying it so I can actually hear the important message?"
answer: |-
  That's a really thoughtful unpacking of a complex emotional and logical knot. Your friend makes a solid logical point, **but your gut feeling that "who says it matters" isn't wrong either.** It's not just deflection; it's about context, relationship dynamics, and the complex nature of trust and authority. Here's a breakdown:

  1.  **The Logical Core (Your Friend's Point - Valid):**
      *   **Truth is Truth:** The factual accuracy of the statement ("your drinking may be problematic and impacting your family") exists independently of who says it. A recovered alcoholic, a teetotaler, or a current heavy drinker could all potentially observe and state this truth.
      *   **Focus on the Issue:** To address *your* behavior and *your* family life, the most productive path is to evaluate the *substance* of the concern, not the history of the messenger. Ignoring valid criticism because of the source hinders self-improvement.

  2.  **Why "Who Says It" *Can* Matter (Your Gut Feeling - Also Valid):**
      *   **Hypocrisy & Moral Authority:** This is the core of your "you of all people" reaction. When someone points out a flaw they *themselves* exhibited severely (especially when it caused you and others significant pain), it *can* feel hypocritical or like they lack the moral high ground to lecture. It triggers a sense of "Who are *you* to judge *me* after what *you* did?"
      *   **Unresolved Resentment:** His past behavior (missing your wedding rehearsal, hurting your mom) caused real harm. While you acknowledge his current positive change, those past wounds might not be fully healed. His criticism can inadvertently poke at those old bruises, making the current message harder to hear objectively.
      *   **Relational Debt:** After causing significant pain, trust and the "right" to offer critical advice, especially on the *same issue*, need to be rebuilt over time. Five years of sobriety is impressive, but it doesn't automatically erase the relational debt incurred during the years of harm. Has he fully acknowledged the past hurt *to you*? Has the relationship been repaired to a point where this level of personal critique feels supportive rather than triggering?
      *   **Messenger Credibility (on this specific topic):** While his past gives him *insight* into addiction, it can also *undermine* his perceived objectivity or credibility *as your advisor* on this specific topic due to the personal history involved. It feels loaded.
      *   **Power Dynamics & Vulnerability:** You might feel vulnerable admitting this flaw. Hearing it from someone whose own past flaws caused you pain can feel like an unfair power shift or an uncomfortable reminder of past dynamics.

  3.  **The Role of His 5 Years Sober:**
      *   **Earns Respect, Not Necessarily "The Right":** His sobriety absolutely earns him respect, admiration, and demonstrates he understands the struggle and the path to recovery on a deep level. This *does* give his perspective weight and valuable insight.
      *   **Changes the *Nature* of the Message:** Coming from someone actively *in* addiction, the message would likely be dismissed entirely. Coming from someone 5 years sober, it carries the weight of hard-won experience and genuine concern. It's less likely to be projection or denial.
      *   **But Doesn't Automatically Erase the Past:** The five years don't magically nullify the past hurt or the complex feelings it evokes *for you*. The relational repair work needs to be considered separately from his personal recovery success.

  **So, Does It Matter That It's Him? Yes, in a real sense.**

  *   **Emotionally:** It *absolutely* matters because it triggers complex, valid feelings rooted in your shared history. Ignoring those feelings makes it harder to process the message.
  *   **Relationally:** The *effectiveness* and *reception* of his message are heavily influenced by the state of *your* relationship and the unresolved (or resolved) history between you.
  *   **Logically:** While the core truth stands alone, the *context* of the messenger impacts how that truth is delivered, perceived, and received.

  **What To Do? A Nuanced Approach:**

  1.  **Separate the Message from the Messenger (Initially):** Take a deep breath and honestly evaluate the *content* of his concern, *as if it came from a neutral source*. Is he right about the quantity? Do you *feel* less present? Has your spouse or kids hinted at anything? Acknowledge the factual core if it resonates.
  2.  **Acknowledge Your Feelings:** Your gut reaction isn't illogical or invalid. Tell yourself, "It's understandable I feel defensive/resistant because of our history. That doesn't mean his point is wrong, but it explains my reaction."
  3.  **Address the Relational Dynamic (Later):** Once you've processed the message about *your* drinking, consider whether you need to address *how* it landed because it came from *him*. This might involve a conversation like:
      *   "Hey, I've been thinking about what you said at the BBQ. You were right, I have been overdoing it, and I'm taking steps to cut back. I appreciate you caring enough to say something. Honestly, though, it was really hard to hear coming from you because it brought up a lot of the past hurt from when you were drinking. I know you're in a different place now, and I respect that hugely, but those memories are still there for me. Maybe we could talk about that sometime?"
  4.  **Focus on Your Actions:** Regardless of the messenger, if you recognize the behavior is a problem *for you* and *your family*, take steps to address it. This is about your well-being and your role as a dad. Seek support (doctor, therapist, support group) if needed.
  5.  **Judge His Role Based on Present Actions:** While the past matters emotionally, judge his *current* right to express concern based on his *current* behavior. Is he supportive, humble, and acting out of love *now*? Or is there still a judgmental or self-righteous tone? Five years of sustained positive change *does* shift the balance significantly towards him acting from a place of earned wisdom and genuine care.

  **Conclusion:** Your friend is logically correct that the truth stands on its own. **But your feeling that "who says it matters" is also profoundly human and valid.** It matters because relationships are complex, history carries weight, and trust takes time to rebuild. The key isn't to dismiss his point because of his past, but to:

  1.  **Acknowledge the factual truth** if it's there (which you seem to do).
  2.  **Honor and process your complex feelings** about *him* being the messenger.
  3.  **Separate your response to the message** (addressing your drinking) **from your response to the relational dynamic** (addressing the history and how this landed).

  His five years sober *does* change things – it gives his perspective immense credibility and weight born of experience. But it doesn't automatically grant him immunity from the emotional consequences of his past actions *in your relationship*. Listen to the truth in his words for your own sake, and then decide if and how you want to address the complicated feelings his delivery stirred up.
