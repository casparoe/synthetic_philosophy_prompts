  Okay, the user is a software engineer working on backend and ML infrastructure, part of a lunchtime reading group on AI safety papers. They recently discussed Armstrong and Mindermann's paper on the insufficiency of Occam's razor in inferring preferences from irrational agents' behavior. The core problem is the underdetermination between reward functions and planners when observing behavior. The user is drawing a parallel to ethics, particularly in distinguishing "genuine" preferences from biases, adaptive preferences, etc., and questioning if the structural underdetermination applies there too.

  The user wants me to argue that this underdetermination fully generalizes to the moral case. They want a thorough engagement with possible escape routes like reflective equilibrium or stability across contexts. I need to show why these don't resolve the underdetermination and that any distinction between genuine preferences and biases requires importing ethical assumptions not derivable from psychological facts alone.

  First, I should recall Armstrong & Mindermann's key points. They show that for any observed behavior, there's a degenerate pair: a constant reward function with a planner that hardcodes the behavior, or a reward function that's a delta function at observed states. This makes the decomposition non-unique. Occam's razor doesn't help because the degenerate pairs can be equally simple.

  Now, translating this to ethics: the agent's behavior is observed choices. The reward function is the "true preferences," and the planner is the cognitive process, including biases. The problem is factoring behavior into these two components. The user's insight is that ethicists assume there's a fact of the matter, but the underdetermination suggests otherwise.

  I need to address escape routes. The first is idealization procedures like reflective equilibrium or informed-desire theory. Reflective equilibrium involves adjusting beliefs and preferences for coherence. But this assumes that coherence reveals true preferences. The underdetermination problem means that any coherence standard is an external imposition. For example, a person with adaptive preferences might achieve internal coherence under oppression, but an external observer deems it biased. The choice of coherence criteria (e.g., prioritizing autonomy) is ethical, not psychological.

  Informed-desire theory says true preferences are what one would want with full information and rationality. But "rationality" here is defined normatively. A degenerate planner could satisfy this: imagine a planner that, when idealized, outputs the observed behavior as optimal. The reward function could be defined to match. There's no way to rule this out without assuming the desired outcome.

  Stability across contexts is another escape route. Biases are seen as situationally triggered and unstable, while preferences are stable. But stability is relative. A degenerate pair could have a "preference" that's stable only because the planner enforces it rigidly. For example, a person always chooses A. The stable preference explanation says they always prefer A. But maybe a bias makes them avoid B, which they'd prefer otherwise. Without independent access to the reward function, stability doesn't resolve the ambiguity. The degenerate case could be a constant reward with a planner that's always biased towards A.

  The user might be concerned about implications for moral philosophy and AI safety. If true preferences can't be identified, how do we design AI to align with human values? Ethically, how do we critique oppressive social structures if adaptive preferences are indistinguishable? The user likely wants a rigorous argument that challenges common assumptions in both fields.

  I should also consider deeper needs. The user might be grappling with the feasibility of value alignment in AI, given this underdetermination. They might be questioning whether ethics can be grounded in psychology alone, leading to meta-ethical implications. They could be seeking validation of their insight that technical results in ML have profound philosophical consequences.

  Structure-wise, I'll start with restating the problem, then explain the underdetermination in ethics. Address each escape route in turn, showing how they fail. Conclude that ethical assumptions are unavoidable. Use concrete examples to illustrate. Emphasize that the underdetermination is structural, not just practical. Highlight that even with complete psychological data, the factoring isn't unique without normative input.
answer: |-
  You've hit on a profound and unsettling connection—one that exposes a foundational crack in both value learning for AI alignment and preference-based ethical theories. The Armstrong/Mindermann underdetermination absolutely generalizes to the moral case. Let me argue this systematically, addressing the core claim and dismantling the major escape routes you outlined.

  ### The Core Argument: Underdetermination in Ethics
  1.  **The Formal Parallel:**
      *   **Agent:** Observed behavior (choices, actions, statements).
      *   **Planner (π):** The cognitive architecture/biases (heuristics, emotional triggers, cognitive distortions, learned coping mechanisms, situational influences, neurophysiological constraints).
      *   **Reward Function (R):** The "true" or "genuine" preferences/welfare interests/values.
      *   **The Problem:** For *any* observed behavioral history of an individual (even infinitely long and including verbal reports), there exist *multiple* consistent decompositions into (π, R). Crucially, this includes degenerate decompositions where:
          *   **Degenerate R:** `R_true` is trivial (e.g., "maximize existence," "minimize change," or even `R_observed(s) = 1` if the agent ever visits state `s`, `0` otherwise). All the "meaning" is shoved into the planner.
          *   **Degenerate π:** The planner is maximally biased/irrational/dysfunctional, specifically engineered to output the *observed* behavior only when paired with a trivial `R`. `R` is then defined as "whatever the agent *actually* did." (e.g., "The agent's true preference is *exactly* what they chose in each specific situation, modulo noise.").
      *   **Simplicity Doesn't Save Us:** As Armstrong/Mindermann show, Occam's Razor fails. A degenerate pair (trivial `R` + complex, history-memorizing `π`) can often be described *more concisely* than the intended pair (complex `R` + simple, rational `π`), especially if the intended `R` is complex. The "combined Kolmogorov complexity" isn't reliably lower for the intended factorization.

  2.  **Generalization to Ethics:** Translating this to human preferences and biases:
      *   Any attempt to factor observed human choices (including stated preferences, "on reflection" reports, etc.) into "genuine preferences" (`R`) and "biases/distortions" (`π`) suffers from the same underdetermination.
      *   There is *always* a degenerate factorization:
          *   **Option A (Trivial Preferences):** The person has maximally simple, trivial "true preferences" (e.g., "minimize cognitive dissonance," "conform to local signals," "experience pleasure now"). All the richness of their observed choices is explained by an incredibly complex, situationally-dependent planner (`π`) encoding all their "biases" (social conditioning, trauma responses, cognitive limitations, hyperbolic discounting, etc.) that *happens* to output the specific observed behavior given the trivial `R`.
          *   **Option B (Trivial Planner/Bias):** The person has a maximally complex "true preference" function `R` that assigns high value *exactly* to the states/outcomes they actually achieved/endorsed in their specific history. The planner `π` is then trivial or minimally biased ("choose randomly," "choose what you did last time"). The "bias" here is simply the lack of perfect optimization power to achieve the *exactly* desired history.
      *   **The Consequence:** There is *no fact of the matter*, discernible even from *complete* psychological and behavioral data, about which decomposition is "correct." Attributing a "genuine preference" (`R`) and a "bias" (`π`) is always a *modeling choice* driven by factors *external* to the behavioral/psychological data itself. This choice inevitably smuggles in ethical/normative assumptions.

  ### Engaging the Escape Routes

  1.  **Reflective Equilibrium / "On Reflection" Idealization:**
      *   **The Hope:** By having the agent engage in rational reflection, considering all information, achieving coherence among beliefs and values, we strip away transient biases and reveal "true" preferences.
      *   **Why it Fails:**
          *   **Reflection is Part of the Planner:** The process of reflection *itself* is executed by the cognitive machinery (`π`). Biases deeply embedded in `π` (e.g., framing effects, status quo bias, motivated reasoning, internalized oppression shaping "rational" thought) will inevitably shape the *output* of reflection. What feels like a "cleaned-up" preference (`R`) is still a joint product of the underlying (unknown) `R_true` and the reflective `π`.
          *   **Degenerate Factorization Persists:** Consider the person who, after "deep reflection," endorses their current adaptive preferences (e.g., a severely oppressed person concluding their limited options are truly best). The degenerate factorizations still apply:
              *   *(Trivial R):* Their true `R` is "maintain psychological equilibrium under current constraints." Reflection (`π`) produced the endorsement of their situation.
              *   *(Complex R):* Their true `R` is defined *as* the outcome of their specific reflective process in that context. The "bias" (`π`) is whatever cognitive machinery prevented reflection from outputting something else.
          *   **The Circularity:** The criteria for "good reflection" (coherence, full information, lack of "distorting" emotions) are *normative*. They presuppose a concept of rationality and bias we are trying to discover. Using them to define `R` assumes the answer. Armstrong/Mindermann shows we can *always* build a degenerate `π` that satisfies *any* specified reflective procedure and outputs the observed reflective endorsement paired with a trivial `R`.

  2.  **Informed Desire / Full Information Idealization:**
      *   **The Hope:** True preferences are what the agent *would* desire if they were fully informed and rational.
      *   **Why it Fails:**
          *   **The Idealized Agent is a Fiction:** Predicting what a *fully* informed, *perfectly* rational version of the person would want requires specifying the counterfactual cognitive architecture (`π_ideal`). But what is "perfectly rational"? Is it Bayesian? Does it include specific emotional components? This specification is inherently normative.
          *   **Degenerate Factorization Exploits the Idealization:** We can define:
              *   *(Trivial R):* `R_true` is simple (e.g., "maximize accurate world-modeling"). The idealized agent (`π_ideal`), given full information, outputs the *observed* counterfactual desire as the optimal way to satisfy this trivial `R`.
              *   *(Complex R):* `R_true` is defined *as* the output of the specific idealized process (`π_ideal`) we stipulated. The "bias" in the real agent is the difference between the real `π` and this stipulated `π_ideal`.
          *   **The Bootstrapping Problem:** To define `π_ideal`, we need to know what counts as a "bias" to remove and what counts as part of the "true self" to preserve. But that's precisely what we're trying to figure out! The underdetermination shows there's no objective way to do this bootstrapping from behavior/psychology alone.

  3.  **Stability Across Contexts:**
      *   **The Hope:** Genuine preferences are stable across different situations, while biases are context-triggered and unstable.
      *   **Why it Fails:**
          *   **Stability is Relative and Observer-Dependent:** What counts as a "situation" or "context"? How much change constitutes "instability"? This requires categorization, which can be arbitrary. More importantly, stability is a property of the *observed behavior pattern*, not a unique signature of the underlying `R`.
          *   **Degenerate Factorization Mimics Stability:**
              *   *(Trivial R):* Suppose `R_true` is "minimize prediction error" or "maintain homeostasis." A complex planner `π` could produce *highly stable* behavioral patterns across many contexts as the optimal strategy for this trivial `R`. The stability reflects the structure of `π`, not a complex `R`.
              *   *(Complex R):* We can define `R_true` to be maximally stable: "Value exactly the set of choices the agent made consistently across contexts X, Y, Z." The "bias" (`π`) explains any deviation *outside* those contexts, or explains *why* they were stable within them (e.g., "the planner rigidly enforced choice A whenever context tag B was present").
          *   **Stability Doesn't Equal "Genuine":** Deeply internalized oppression (adaptive preferences) can be extremely stable. Core values (`R`) might evolve or be context-sensitive in non-biased ways (e.g., valuing family time vs. career focus depending on life stage). Using stability as the criterion assumes that stability is inherently good or "truer," which is an ethical judgment, not a psychological discovery. The underdetermination means we can always redescribe stable behavior as the result of a biased planner enforcing a trivial preference.

  ### The Inescapable Normative Leap

  The Armstrong/Mindermann result demonstrates that the decomposition into preference and bias is **formally underdetermined** by behavioral and psychological data. Every proposed method to resolve it—reflective equilibrium, informed desire, stability—either:

  1.  **Relies on processes (`π`) that are themselves subject to the underdetermination problem** (e.g., reflection is just more planner output).
  2.  **Requires stipulating a normative standard** (what counts as "good reflection," "full information," "rationality," "relevant context," "true stability") that **cannot be derived from the descriptive facts alone**.
  3.  **Can be mimicked by a degenerate factorization** that assigns the "bias" label differently.

  Therefore, **any line drawn between "genuine preference" and "bias" necessarily smuggles in ethical assumptions.** When we say:

  *   "The oppressed person's *true* interest is liberation, not their adapted contentment."
  *   "The addict's *true* preference is sobriety, not their craving."
  *   "The prejudiced person's *true* values are egalitarian, not their conditioned fear."

  ...we are making *ethical/normative claims* about what *should* count as the person's "true" interest or value, based on concepts of flourishing, autonomy, fairness, or rationality that are external to the mere description of their psychology and behavior. We are privileging one possible factorization (complex `R` reflecting our normative ideal + biased `π`) over other equally consistent factorizations (trivial `R` + complex `π` encoding the "bias" as the dominant driver, or complex `R` encoding the observed behavior as the "true" value).

  This doesn't render ethics impossible, but it forces a crucial meta-ethical acknowledgment: **The "true self" or "genuine interests" we appeal to in moral reasoning are not discovered psychological facts, but constructed normative ideals.** The Armstrong/Mindermann underdetermination provides a rigorous formal foundation for the suspicion that preference-based ethics and welfare economics have always wrestled with: that the distinction between "preference" and "distortion" is fundamentally evaluative, not merely descriptive. This has profound implications for AI alignment (how do we specify human values if they are underdetermined?) and for moral philosophy (how do we justify our normative ideals if they cannot be read off psychology?). The underdetermination isn't just a technical curiosity; it's a structural feature of reasoning about agency from the outside.
