  For the factual case, I'm imagining a technical compliance scenario—something like industrial safety standards where minor deviations exist but aren't intuitively obvious. "Regulation 29B" sounds suitably obscure. The manager reports a violation; trusting that feels natural. 

  For the moral twin, I'll keep everything identical except the trusted source now declares whether compliance was morally required. But crucially, the factual violation itself must remain undisputed—only the moral ought-ness is at stake. 

  The discomfort mechanism is tricky. From my reading, three theories compete: 
