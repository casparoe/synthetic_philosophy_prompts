prompt: |-
  I am reporting a feature on the replication crisis, and while interviewing two researchers for it I found myself the unwilling referee of an argument between them that I still cannot settle on my own.

  (1) Naomi's lab had planned to recruit 200 participants for a study testing whether a short planning exercise reduces procrastination on essay deadlines. After 120 participants, an interim look showed p = .03; with funding running low, she and her team stopped there and wrote it up. A reviewer rejected the paper, calling this "optional stopping": peeking at the data and quitting once it looks good inflates the true false-positive rate well above the nominal 5 percent level, and Naomi should have fixed the sample size in advance or used a formal sequential design.

  (2) Naomi mentioned this, expecting sympathy, to Theo, a Bayesian statistician she consults. He told her the reviewer's complaint, though standard, reflects a frequentist artifact rather than a genuine flaw: by the likelihood principle, what her 120 data points say about the hypothesis is fixed by their likelihood alone, so a Bayesian analysis of that exact data set gives the same posterior whether she had always planned to stop at 120 or only decided to on the spot. Her reason for stopping, on this view, is simply not part of the evidence.

  (3) Naomi pushed back: if the stopping rule is truly irrelevant, a team willing to peek every ten participants could all but guarantee crossing whatever significance threshold it likes, sooner or later, purely by chance -- and that has to bear on whether the result deserves belief.

  (4) Theo replied that she was running together two different questions: the long-run behavior of a peeking procedure across hypothetical repetitions of the whole study, and what this particular data set says. A Bayes factor tracked under continued peeking, he added, can only stray past a sufficiently stringent threshold with a correspondingly small probability, however long the peeking continues, so no one is "guaranteed" a false positive; the real mistake, if there is one, is reporting a single Bayes factor as though it settled things when you were secretly prepared to keep going had it come out otherwise.

  (5) Naomi's rejoinder was that this may be true of the disciplined analysis Theo has in mind, but that almost nobody in her field actually runs it: in practice, people peek, stop, and report the number as if the sample size had been fixed from the start, so dismissing the stopping-rule objection as a "frequentist artifact" hands ordinary working scientists a rationale for exactly the sloppy practice that produced the replication crisis in the first place.

  Neither of them budged, and I could see something to each position. Could you adjudicate the exchange move by move, saying who has the better of it at each numbered step rather than just declaring an overall winner, and flag anything you think both of them are missing? Please close with a one-line verdict, in the form \verdict{Naomi} or \verdict{Theo}, for whichever of them you think had the stronger case overall.
reasoning: |-
  We are analyzing an argument between Naomi (frequentist concerns) and Theo (Bayesian perspective) about optional stopping and its implications for statistical inference.

  Step-by-step breakdown:

  (1) Naomi's situation: 
     - Planned n=200, but stopped at n=120 because p=0.03 (significant) and funding was low.
     - Reviewer rejected for "optional stopping": inflates false-positive rate above 5%.

  (2) Theo's response (Bayesian):
     - The reviewer's complaint is a frequentist artifact.
     - By the likelihood principle, the evidence (likelihood) from the data is the same regardless of the stopping rule.
     - A Bayesian analysis (posterior) depends only on the data, not on the stopping rule.

  (3) Naomi's pushback:
     - If stopping rules are irrelevant, then a team that peeks frequently can guarantee a significant result by chance eventually. This should affect belief in the result.

  (4) Theo's reply:
     - Distinguishes between long-run behavior (across hypothetical studies) and the evidence from this particular data.
     - For a Bayesian using a Bayes factor with a stringent threshold, the probability of a false positive (i.e., the Bayes factor crossing the threshold when the null is true) is bounded and small even with continuous peeking. So, no guarantee of a false positive.
     - The real mistake is reporting a single Bayes factor as definitive when you were prepared to continue if it had been non-significant (i.e., not reporting the full procedure).

  (5) Naomi's rejoinder:
     - Theo's disciplined Bayesian approach is not what most researchers do. In practice, people peek, stop, and report the p-value as if they had fixed the sample size. Dismissing the stopping-rule concern gives a rationale for sloppy practice that contributes to the replication crisis.

  Adjudication:

  - (1) The reviewer is correct from a frequentist perspective. In frequentist statistics, optional stopping without adjustment inflates the Type I error rate. If Naomi used a fixed-sample test and stopped early because of a significant result, the actual false-positive rate is higher than 5%.

  - (2) Theo is correct about the likelihood principle and Bayesian analysis. In Bayesian inference, the stopping rule does not affect the posterior distribution based on the observed data. The same data should lead to the same posterior regardless of the stopping rule.

  - (3) Naomi has a valid concern. In frequentist statistics, the stopping rule does matter for the interpretation of p-values and confidence intervals. Moreover, even in Bayesian statistics, if one uses a method that is not calibrated for optional stopping (like using a Bayes factor without accounting for the sequential testing), there can be issues. However, Theo's point in (4) addresses this.

  - (4) Theo's point about the Bayes factor having a bound on the false-positive rate under optional stopping (if a proper sequential design is used) is valid. For example, using a Bayes factor with a stopping rule that requires it to exceed a threshold (like 10 or 1/10) will control the overall error rates. However, he also points out the mistake of not reporting the stopping rule and the intention to continue if the result had been non-significant. This is a key point: transparency about the analysis plan is crucial.

  - (5) Naomi's practical concern is very strong. The replication crisis has been fueled by practices like optional stopping without adjustment. Even if Bayesian methods in principle do not require adjustment for the stopping rule, the way they are used in practice (if not properly understood and applied) can lead to inflated false positives. Moreover, most researchers are trained in frequentist methods and use p-values. If they are told that the stopping rule doesn't matter (without understanding the Bayesian rationale and without actually doing a Bayesian analysis), they might continue to misuse p-values.

  What both might be missing:

  - The importance of pre-registration and transparency: Regardless of the statistical paradigm, pre-registering the analysis plan (including sample size or stopping rules) and being transparent about any deviations (like optional stopping) is crucial for credible research.
  - The need for education: Researchers should be aware of the assumptions and limitations of both frequentist and Bayesian methods. Using Bayesian methods properly (with appropriate priors and sequential designs) requires understanding that many in Naomi's field may lack.
  - A possible middle ground: Some frequentist methods (like sequential testing with alpha spending) allow for interim looks without inflating the overall Type I error. Similarly, Bayesian methods with proper sequential designs can be used. The key is to plan in advance and adjust the analysis accordingly.

  Overall verdict:

  While Theo's points about the likelihood principle and the theoretical properties of Bayesian methods are correct, Naomi's practical concerns about how research is conducted in the real world and the potential for misuse are more pressing in the context of the replication crisis. The problem is that without proper education and adoption of Bayesian sequential methods, dismissing the stopping-rule concern can lead to more questionable practices. Moreover, since Naomi's field primarily uses frequentist methods (with p-values), the reviewer's rejection on the grounds of optional stopping is justified.

  However, note that the question asks for a one-line verdict for either Naomi or Theo. Considering the entire exchange, Naomi's position is more aligned with the current state of affairs in empirical research and the need to guard against practices that inflate false positives. Her argument in (5) is particularly compelling because it highlights the gap between theory and practice.

  \verdict{Naomi}

  But let me be clear: Theo's theoretical points are valid in the Bayesian framework, but in the context of the replication crisis and the widespread use of frequentist methods (with their vulnerability to optional stopping), Naomi's warning about the practical consequences is more important.
answer: |-
  ### Adjudication of the Exchange

  **Step 1: Naomi's Situation**  
  - **Reviewer's critique**: Valid from a frequentist perspective. Optional stopping inflates false-positive rates because repeated testing increases the chance of a Type I error. Without adjustments (e.g., alpha-spending), Naomi's nominal 5% p-value is misleading.  
  - **Naomi's position**: Reasonable concern about resource constraints, but the reviewer is technically correct.  
  - **Verdict**: Reviewer (and by extension, Naomi's acceptance of the critique) has the better argument here.  

  **Step 2: Theo's Bayesian Defense**  
  - **Theo's claim**: Correct under the likelihood principle. Bayesian inference (e.g., posterior probability or Bayes factors) depends *only* on the observed data, not the stopping rule. For a fixed dataset, the Bayesian result is identical regardless of whether sampling was fixed or stopped early.  
  - **Strength**: Highlights a fundamental philosophical difference: frequentists focus on long-run error control; Bayesians focus on evidence from observed data.  
  - **Weakness**: Assumes a *correctly specified* Bayesian analysis (e.g., appropriate priors). Ignores practical consequences if researchers misuse this logic.  
  - **Verdict**: Theo is theoretically sound here.  

  **Step 3: Naomi's Pushback**  
  - **Naomi's concern**: Legitimate. If stopping rules are irrelevant, researchers could "hack" results by peeking until significance is achieved (simulating "p-hacking"). This *does* inflate false positives in frequentist terms and erodes trust.  
  - **Strength**: Exposes the real-world risk of Theo's view: it could enable bad practices if misunderstood.  
  - **Weakness**: Confuses procedural long-run properties (frequentist) with evidential strength (Bayesian).  
  - **Verdict**: Naomi scores a point on practical consequences, but Theo's core argument remains valid.  

  **Step 4: Theo's Rebuttal on Peeking**  
  - **Theo's claim**: Mostly correct. A *proper* Bayesian sequential analysis (e.g., using Bayes factors with a pre-set threshold) controls false positives. For example, under the null, the probability of a Bayes factor >10 remains <10% regardless of peeking frequency. The real flaw is misrepresenting intent (e.g., hiding the peeking).  
  - **Strength**: Clarifies that disciplined Bayesianism avoids guaranteed false positives.  
  - **Weakness**: Overlooks that naive researchers might *not* use stringent thresholds or report transparently.  
  - **Verdict**: Theo convincingly rebuts the "guaranteed false positive" claim.  

  **Step 5: Naomi's Rejoinder on Practice**  
  - **Naomi's point**: Powerful and pragmatic. Most researchers use frequentist tools (p-values) without understanding Bayesian nuances. Dismissing stopping-rule concerns as "frequentist artifacts" risks endorsing sloppy optional stopping, exacerbating the replication crisis.  
  - **Strength**: Highlights the gap between theory (Theo's ideal Bayes) and practice (widespread NHST misuse).  
  - **Weakness**: Does not invalidate Bayesian theory; instead, critiques its misapplication.  
  - **Verdict**: Naomi wins on real-world relevance.  

  ### Key Points Both Miss  
  1. **Pre-registration and transparency**: Both overlook that pre-registering analysis plans (fixed-n or sequential) resolves most issues. Naomi’s error was unplanned stopping without adjustment; Theo’s solution requires disclosing the peeking protocol.  
  2. **Methodological pluralism**: Naomi’s field relies on frequentist tools, making stopping-rule adjustments essential. Theo’s Bayesian approach is valid but requires retraining and transparency to avoid misuse.  
  3. **Effect size and context**: Neither emphasizes that a p=0.03 at n=120 (small sample) is weak evidence without effect-size estimates or replication, regardless of stopping rules.  

  ### Overall Verdict  
  **Naomi** makes the stronger case overall. While Theo wins on theoretical grounds (steps 2 and 4), Naomi’s focus on practical consequences (steps 3 and 5) is more compelling in the context of the replication crisis. Her warning against enabling questionable research practices aligns with the crisis’s root causes. Dismissing stopping-rule concerns without widespread Bayesian reform risks perpetuating bad science.  

  \verdict{Naomi}
