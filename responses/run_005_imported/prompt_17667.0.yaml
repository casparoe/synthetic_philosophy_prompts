  First, I need to recall Quine's radical translation: meaning is indeterminate because behavioral evidence underdetermines translation manuals. His gavagai example shows reference is inscrutable - we can't pin down if "gavagai" means rabbit or rabbit-stage. 

  Then Davidson's radical interpretation: by using a truth-conditional semantics plus charity (interpreting speakers as mostly rational and truthful), he claims to solve meaning and belief simultaneously. But his own inscrutability paper admits reference remains indeterminate - "rabbit" could mean rabbit-part and we'd adjust other parts of the theory accordingly.

  The key tension is: Devi sees charity as substantively constraining interpretation beyond Quine's behaviorism, while the user sees the lingering reference problem as proof charity doesn't fix indeterminacy. 

  I think Devi is closer to Davidson's intent. Davidson explicitly says reference permutation is benign, like choosing Celsius vs Fahrenheit. His real target is sentence-level meaning - he thinks charity fixes truth conditions even if reference is fluid. For him, meaning lives at the sentence level, not in sub-sentential reference. 

  But the user has a point that this feels like conceding Quine won on reference while changing the subject to truth conditions. The philosophical progress might be in showing that reference doesn't matter as much as we thought for meaning holism.

  I should emphasize that Davidson's move isn't just attitude adjustment but a conceptual shift: meaning is primarily about truth conditions of whole utterances, not reference of terms. Charity works at that higher level. But Quineans might reasonably counter that this avoids rather than solves the core indeterminacy.

