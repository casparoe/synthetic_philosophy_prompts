  Hmm, the social context matters too. Book club and film discussions carry unspoken expectations of firsthand engagement. Saying "beautifully written" there is performance of cultural participation, which backfires if challenged. Whereas recommending tacos is purely functional - nobody expects you to have analyzed the salsa. 

  The user's deeper need might be about social authenticity. They want to share enthusiasm without feeling like an impostor. Practical solutions should balance honesty with their desire to contribute meaningfully to conversations. Maybe distinguishing between endorsement ("Priya adored this") and personal stance ("I haven't read it yet but it's on my list because...") could relieve that tension. 

  Also worth noting: their discomfort suggests strong integrity. Many people parrot opinions without a second thought! This self-awareness is admirable. The solution isn't to stop sharing recommendations, but to recalibrate how they frame others' expertise. 

