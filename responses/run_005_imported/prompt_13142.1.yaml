answer: |-
  That's a fascinating observation, and you're absolutely not being inconsistent for no reason. There **is** a fundamental difference between the two scenarios, rooted in the nature of the claims being made and the social context. Here's a breakdown:

  **The Core Difference: Factual Reporting vs. Personal Judgment**

  1.  **The Taco Place (and similar factual claims):**
      *   **What you're conveying:** "This establishment exists and has received positive reviews/recommendations from people I trust." You are reporting *the existence of a consensus or a trusted opinion*.
      *   **Nature of the claim:** The core claim ("it's good") is treated as a *reportable fact about others' experiences*. Your statement "it's supposed to be really good" explicitly signals that you are transmitting information, not offering your own verdict.
      *   **Your role:** You are a *messenger* or *information conduit*.
      *   **Social Expectation:** When recommending a restaurant, service, or factual matter, it's generally understood and acceptable to rely on secondhand information. People expect recommendations to be based on hearsay unless explicitly stated otherwise ("I went last week and...").

  2.  **The Movie/Book (and similar aesthetic/artistic judgments):**
      *   **What you're conveying (or seem to be):** "I have personally experienced this work and formed the judgment that it is good/beautiful/well-made." Phrases like "it's really good" or "it's beautifully written" strongly imply *firsthand experience and personal evaluation*.
      *   **Nature of the claim:** Artistic quality ("good," "beautiful," "well-made") is inherently *subjective and experiential*. It requires direct engagement with the work. Claiming such a judgment *as your own* implies you've done the work of experiencing and forming that opinion.
      *   **Your role:** You are presenting yourself as an *evaluator* or *critic*.
      *   **Social Expectation:** In contexts like book clubs, film discussions, or casual conversations about art, the implicit social contract is that opinions shared are *personal and firsthand*. Saying "it's great" is taken as shorthand for "**I** think it's great **because I experienced it**."

  **Why It Feels Like "Getting Away With Something" or Lying:**

  *   **Misrepresentation:** By stating "it's good" without qualification, you are implicitly misrepresenting your *level of engagement* and the *source of the judgment*. You haven't done the work, yet you're claiming the authority of someone who has.
  *   **Claiming Credit for Judgment:** You're presenting Priya's insightful taste *as your own discernment*. It feels like intellectual shortcutting or borrowing unearned credibility.
  *   **The Stakes of Aesthetic Judgment:** Expressing an opinion on art feels more personal and identity-revealing than recommending a taco place. Faking it feels like a deeper violation of authenticity.
  *   **The Embarrassment Factor:** Your experience with the movie perfectly illustrates this. You presented Priya's "great" as your own, then discovered you fundamentally disagreed. This creates dissonance and embarrassment because your *stated* opinion (implied as firsthand) directly contradicts your *actual* experience. If the tacos were bad, you'd just say "Huh, Priya usually has good taste, maybe she had an off day." Your credibility on tacos wasn't on the line in the same way; you were just passing on information.

  **Practical Advice: How to Handle This Honestly**

  You don't have to stop leveraging Priya's great taste! The key is **transparency** about the source of your recommendation. Here's how to do it ethically and effectively:

  1.  **Explicitly Credit the Source:**
      *   "I haven't seen it yet, but Priya, whose taste I *really* trust, says it's fantastic."
      *   "I haven't read it, but both Priya and [Other Trusted Friend] raved about it, so it's high on my list."
      *   "Based on Priya's glowing review, I'm really excited to check it out." (Implies you haven't yet).
      *   At book club: "I haven't finished it yet, but Priya mentioned she found the prose particularly beautiful."

  2.  **Use Language that Signals Secondhand Knowledge:**
      *   "I hear it's really good." (Can imply general buzz or specific trusted sources).
      *   "It's supposed to be excellent." (Clearly indicates received opinion).
      *   "It comes highly recommended by people whose taste aligns with mine."
      *   "The buzz from people I trust is really positive."
      *   Avoid definitive statements like "It *is* great" or "It *is* beautifully written" unless you've experienced it yourself.

  3.  **Separate Recommendation from Personal Verdict:**
      *   "I haven't seen it myself, but Priya loved it, so I definitely recommend checking it out if you trust her taste!"
      *   "Based on Priya's reaction, I think you might really enjoy this one."

  4.  **Embrace the "Not Seen/Read Yet":** It's perfectly okay! Saying "I haven't seen it yet, but I've heard great things" is honest, builds trust, and often sparks more interesting conversation ("Oh, who said that?" "What did they like about it?").

  **Why This Approach is Better:**

  *   **Honest:** It accurately reflects your position.
  *   **Builds Trust:** People will know when you *do* say "I loved it," you really mean it.
  *   **Credits Priya:** Gives deserved recognition to your friend's discernment.
  *   **Reduces Risk:** No more embarrassment if you later disagree.
  *   **Manages Expectations:** The person knows your recommendation is based on hearsay, not direct experience.
  *   **Still Useful:** You're still passing on valuable information about potentially worthwhile things!

  **In Conclusion:** You're right to feel a difference. Passing on factual information ("it's supposed to be good") is socially acceptable reporting. Presenting someone else's aesthetic judgment as your own firsthand experience ("it *is* good/beautiful") feels dishonest because it misrepresents your engagement and claims credit for a judgment you didn't form. The solution isn't to stop sharing Priya's great finds, but to **clearly attribute the praise to her (or other trusted sources)** and **signal that your recommendation is based on their opinion, not your direct experience.** This keeps you honest, builds trust, and avoids future awkwardness. Keep leveraging that great taste network, just be transparent about how it works!
