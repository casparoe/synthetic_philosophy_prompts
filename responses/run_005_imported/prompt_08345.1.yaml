prompt: |-
  I help run a tiny EA-adjacent grants program (low six figures a year, mostly individual researcher/project grants) and there's a live fight on the committee that I got voluntold to write up before our meeting next week. Right now 3 of us score every application 1-10 independently and average it. One member wants to expand to panels of ~10 reviewers per grant, citing the Condorcet jury theorem -- his pitch is that as long as each reviewer is just a little better than a coinflip, the math guarantees the aggregate gets more accurate as you add reviewers, basically for free. Another member is sure this is wrong for our situation but cant articulate why beyond 'our reviewers aren't independent, they all read the same forum posts and end up with the same priors.' Can you draft the actual decision memo -- keep the panel at 3, go big, or some other design entirely -- that steelmans the Condorcet argument properly but is honest about exactly where and why it'd break down for a setup like ours. Want it to end with a real recommendation and a rough plan for phasing it in, not just 'it's complicated.'
reasoning: |-
  We are considering expanding our grant review panel from 3 reviewers to about 10 per grant, based on the Condorcet jury theorem. The theorem states that if each voter (reviewer) has an independent probability p > 0.5 of being correct, then as the number of voters increases, the probability that the majority vote is correct approaches 1. However, the theorem relies on several assumptions that may not hold in our setting.

  Key Assumptions of Condorcet Jury Theorem:
  1. Independence: Each reviewer's judgment is independent of the others.
  2. Homogeneous Competence: Each reviewer has the same fixed probability p (p>0.5) of making the correct decision.
  3. Binary Choice: The decision is between two alternatives (e.g., "fund" or "don't fund").

  Our Setting:
  - We are scoring applications on a scale of 1-10, not a binary decision. However, we might reframe the problem as a binary "fund/don't fund" by setting a threshold (e.g., average score above 7). But note that our current process averages scores, which is different from a majority vote on a binary decision.
  - Reviewers are not independent: They are exposed to the same background materials, forum posts, and discussions. This can lead to correlated judgments (e.g., groupthink, shared biases).
  - Reviewer competence is not homogeneous: Some reviewers may have more expertise in the domain of a particular grant than others. Moreover, we cannot assume that every reviewer has p>0.5 for every application. Some applications might be in areas where most reviewers lack expertise (p<0.5).
  - The theorem assumes a fixed "correct" decision. In grantmaking, the "correctness" of a decision is often unobservable and subjective.

  Where Condorcet Might Break Down for Us:
  1. Non-binary decision: We are using a 10-point scale and averaging. The theorem does not directly apply to averaging. Moreover, averaging can be sensitive to outliers and may not reflect the "majority" in the same way.
  2. Correlated judgments: If reviewers are influenced by the same sources (e.g., a prominent forum post) or by each other (if they discuss before scoring), their errors become correlated. The theorem assumes independence, and when errors are positively correlated, the collective accuracy may not improve (and could even decrease) with more reviewers.
  3. Variable competence: We cannot guarantee that every reviewer has p>0.5 for every application. For some applications, the average p might be below 0.5, and then adding reviewers would make things worse. Also, if we have a mix of experts and non-experts, we might want to weight their opinions differently, but the theorem assumes equal weight.
  4. Practical constraints: We have limited resources. Recruiting and coordinating 10 reviewers per grant (for every grant) would be much more time-consuming and expensive. We are a small program (low six figures a year). The opportunity cost of spending more time on reviews might be better spent elsewhere.

  Steelman of the Pro-Condorcet Argument:
  If we could ensure that each reviewer is independent and has p>0.5, then moving to a larger panel would indeed improve accuracy. Moreover, even if p is only slightly above 0.5, the theorem shows that the majority vote becomes increasingly reliable as the panel size increases. This could be especially valuable for high-stakes decisions. Additionally, a larger panel might capture more diverse perspectives, which could help counteract individual biases.

  Recommendation:
  Given our constraints and the potential pitfalls, I recommend a hybrid approach:

  1. **Keep the current 3-reviewer system for the majority of grants** but experiment with a larger panel (5-7 reviewers) for a small subset of grants that are:
     - Particularly high-stakes (e.g., large grant size)
     - In areas of high uncertainty or where our current committee lacks expertise.

     This allows us to test the value of larger panels without overwhelming our resources.

  2. **Improve the current system** by addressing the independence and competence issues:
     - **Independence**: Instruct reviewers to write their initial scores and comments before any discussion. Then, have a moderated discussion and allow reviewers to revise, but track the changes. This can help capture independent judgment first.
     - **Competence**: Assign reviewers based on expertise. For each grant, try to have at least one reviewer with deep domain knowledge. If we cannot find a qualified reviewer, consider deferring the decision or seeking an external review.
     - **Calibration**: Provide reviewers with training and examples of high-scoring and low-scoring applications to improve their accuracy (p). This might be more cost-effective than adding more reviewers.

  3. **Consider a different aggregation method**: Instead of simple averaging, we might use a Bayesian approach that weights reviewers by their past performance (if we have data) or by their self-declared expertise. Alternatively, for the grants that go to the larger panel, use a majority vote on a binary decision (fund/don't fund) to leverage the Condorcet theorem more directly, but only after converting our 10-point scale to a binary recommendation (e.g., scores 7-10 are "fund", 1-6 are "don't fund"). However, note that this loses granularity.

  4. **Phase-in Plan**:
     - **Step 1 (Next 3 months)**: Identify 2-3 grants in the next round that meet the criteria for a larger panel (e.g., high stakes, high uncertainty). Recruit 5-7 reviewers for these, including at least two external reviewers with domain expertise. For the rest, continue with 3 reviewers.
     - **Step 2**: After the round, collect feedback from reviewers and compare the results of the two methods. We can look at:
          - The variance in scores for the same grant (to assess independence).
          - The time and cost per grant.
          - Post-hoc evaluations of the grants we funded (if possible) to see if the larger panel led to better decisions.
     - **Step 3 (6 months)**: Based on the results, decide whether to expand the larger panel to more grants, revert to 3, or adjust the approach.

  By starting with a small experiment, we can gather data to inform our decision without overcommitting. This approach also addresses the concerns about independence and competence by focusing on domain expertise and initial independent scoring.

  Final Decision Memo:

  To: Grant Committee
  From: [Your Name/Position]
  Date: [Date]
  Subject: Recommendation on Review Panel Size

  **Background**: 
  Currently, each grant application is reviewed by 3 committee members who score it 1-10, and we average the scores. A proposal has been made to expand to 10 reviewers per grant, citing the Condorcet jury theorem, which suggests that with independent and slightly competent reviewers, a larger group will make more accurate decisions.

  **Analysis**:
  The Condorcet jury theorem provides a strong theoretical argument for larger panels under ideal conditions. However, in practice, our reviewers are not fully independent (due to shared information and potential groupthink) and their competence (p) may vary and sometimes be below 0.5. Additionally, the theorem applies to binary decisions, whereas we use a 10-point scale.

  **Recommendation**:
  We recommend maintaining a 3-reviewer system for most grants but experimenting with a larger panel (5-7 reviewers) for a select few high-stakes or high-uncertainty grants. This hybrid approach allows us to test the benefits of a larger panel without excessive burden.

  **Action Plan**:
  1. For the next grant round, select 2-3 grants (based on high stakes and/or uncertainty) to be reviewed by a panel of 5-7 reviewers. The remaining grants will be reviewed by 3.
  2. For the larger panels, we will:
     - Recruit at least two external reviewers with domain expertise.
     - Require initial scores and comments to be submitted independently before any discussion.
     - Aggregate scores by averaging (and also consider a binary vote for comparison).
  3. After the round, we will evaluate:
     - The time and resource costs of the larger panels.
     - The level of disagreement (variance) in scores.
     - Feedback from reviewers.
     - Any available outcomes of the funded projects (though this is long-term).
  4. Based on the evaluation, we will decide on the future of the panel size.

  This plan balances the theoretical benefits of Condorcet with practical constraints and allows us to learn from data.

  Approved by: [Your Name]
answer: |-
  ### Decision Memo: Grant Review Process Design  
  **To:** Grant Committee Members  
  **From:** [Your Name], Program Coordinator  
  **Date:** [Date]  
  **Subject:** Recommendation on Reviewer Panel Size and Process Design  

  ---

  ### **Background**  
  Our current process uses 3 reviewers per grant, scoring applications 1–10 (averaged). A proposal to expand to ~10 reviewers per grant cites the Condorcet jury theorem, which states that if individual reviewers are *independent* and *slightly better than random* (p > 0.5) at identifying the "correct" decision, majority voting becomes increasingly accurate with more reviewers. This memo evaluates whether this logic holds for our program, identifies key breakdown points, and proposes a revised design.  

  ---

  ### **Steelman of the Condorcet Argument**  
  The theorem is mathematically sound under ideal conditions:  
  - **Accuracy gains**: With 10 reviewers each 55% likely to be correct (p=0.55), majority vote accuracy rises to ~75%. At p=0.6, it exceeds 90%.  
  - **Low marginal cost**: If reviewers are quick to recruit and score (e.g., via templated reviews), scaling *could* improve decisions without prohibitive effort.  
  - **Risk mitigation**: More reviewers dilute outlier biases or errors.  

  *This argues for expansion if our reviewers meet the theorem’s assumptions.*  

  ---

  ### **Where Condorcet Breaks Down in Our Context**  
  The theorem fails in our setting due to **violated assumptions**:  
  1. **Non-independence**:  
     - Reviewers share background materials (e.g., forum posts, prior discussions), creating *correlated biases*. If all misjudge an application due to a flawed reference, errors compound rather than cancel.  
     - *Empirical evidence*: Peer review studies show inter-rater reliability (ICC) in grant panels rarely exceeds 0.4–0.6, implying high shared noise.  

  2. **Non-binary decisions**:  
     - Condorcet requires a binary choice (e.g., "fund/don’t fund"). Our 1–10 scoring *averages* a spectrum of opinions, which behaves differently. Majority voting on thresholds (e.g., "score ≥7") reintroduces subjectivity.  

  3. **Variable reviewer competence (p)**:  
     - p > 0.5 is unlikely uniform:  
       - For niche proposals, some reviewers may operate near *p=0.5* (guessing).  
       - If average p < 0.5 (e.g., misaligned incentives, fatigue), adding reviewers *reduces* accuracy.  
     - We lack data to estimate p, making the theorem’s promise speculative.  

  4. **Operational costs**:  
     - Recruiting/tracking 10 reviewers/grant multiplies labor (e.g., reminders, alignment). For a low-six-figure program, this may divert >20% of admin time from strategy or due diligence.  

  ---

  ### **Recommendation: Hybrid Panel Design**  
  **Retain 3 core reviewers per grant but expand to 5–7 reviewers for high-stakes/critical cases**, supplemented by process optimizations. *Do not adopt 10-reviewer panels universally.*  

  #### **Why this approach?**  
  - **Balances accuracy and feasibility**:  
    - Smaller core panels (3) maintain efficiency for routine grants.  
    - Expanded panels (5–7) for high-risk/high-reward cases leverage "wisdom of crowds" *while* managing independence risks.  
    - *Data-driven*: Meta-analyses show panels >7 yield diminishing returns without independence (e.g., [LeBreton et al., 2003](https://doi.org/10.1016/S1048-9843(02)00229-5)).  
  - **Addresses Condorcet breakdowns**:  
    - Mitigate non-independence via **structured deliberation** (see below).  
    - Anchor scoring to binary thresholds to partially harness Condorcet (e.g., "Should this get >$50K? Yes/No").  

  #### **Implementation Plan**  
  1. **Pilot expanded panels for 20% of grants** starting next quarter:  
     - *Eligibility*: Proposals requesting >$20K, novel methodologies, or contentious topics.  
     - *Reviewer pool*: Curate 10–15 trusted part-time reviewers (researchers, alumni) to draw from. Assign based on expertise.  

  2. **Structured review process**:  
     - **Pre-deliberation scoring**: Reviewers submit scores *before* group discussion to reduce herding.  
     - **Threshold voting**: For expanded panels, include a majority vote on:  
       > *"Rate confidence this grant should be funded: High/Medium/Low."*  
       Use this to flag disagreements for deeper discussion.  
     - **Calibration training**: Annual workshop with test cases to estimate reviewer p and reduce noise.  

  3. **Phased rollout**:  
     - **Month 1–2**:  
       - Finalize reviewer pool + training materials.  
       - Test process on 2–3 grants using 5 reviewers.  
     - **Month 3–4**:  
       - Evaluate pilot: Track time/reviewer, score variance, and decision concordance.  
       - Adjust panel size (5 vs. 7) based on cost/accuracy.  
     - **Month 6**: Full implementation for eligible grants.  

  4. **Cost control**:  
     - Automate review collection via Google Forms/Airtable.  
     - Compensate external reviewers minimally ($50–$100/grant).  

  ---

  ### **Expected Outcomes**  
  - **Accuracy**: Improved decisions for high-stakes grants via controlled crowd input.  
  - **Efficiency**: ~80% of grants retain 3-reviewer efficiency.  
  - **Scalability**: Process can expand if funding grows.  

  **Final Vote:** Propose adopting hybrid model with committee input on pilot details.  

  ---  
  **Appendices**:  
  - Condorcet jury theorem calculations (p=0.55, 0.6, 0.7 scenarios)  
  - Draft reviewer guidance/templates  

  [Your Name]  
  Program Coordinator
