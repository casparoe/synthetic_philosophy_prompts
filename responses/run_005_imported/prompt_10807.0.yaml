  We are dealing with a voting paradox. The situation described is reminiscent of the "independence of irrelevant alternatives" (IIA) criterion, which states that the relative ranking between two candidates should not change based on the presence or absence of a third candidate. The method used (Borda count) does not satisfy IIA, and the reversal observed is a known phenomenon.

