answer: |-
  The phenomenon you encountered is known as the "Borda count paradox" or a failure of the "independence of irrelevant alternatives" (IIA) criterion. It arises from the specific mechanics of the Borda count method you used, where the removal of a losing candidate (Z) altered the point distribution between the remaining candidates (X and Y), despite no voter changing their relative preference between X and Y. This reversal is mathematically valid and not due to error or rigging; it's an inherent vulnerability of the Borda count.

  ### Why It Happened:
  - **Borda Count Mechanics**: In your system, points are assigned based on a candidate's rank position relative to all others (2 for 1st, 1 for 2nd, 0 for 3rd). When Z is removed, the rankings are recalculated as if only two candidates existed (1st gets 1 point, 2nd gets 0). 
  - **Impact of Z's Removal**: Voters who ranked Z between X and Y (e.g., ranking X > Z > Y or Y > Z > X) effectively had their "middle" preference removed. This changed how points were allocated to X and Y, even though their head-to-head preference (X vs. Y) remained unchanged. 
  - **Example Scenario**:  
    Suppose the committee’s ballots were:
    - 2 votes: Y > X > Z (Y=2, X=1, Z=0)  
    - 2 votes: X > Z > Y (X=2, Z=1, Y=0)  
    - 1 vote: Z > Y > X (Z=2, Y=1, X=0)  
    **Initial Total**: X = (2×2) + (2×1) = 6; Y = (2×2) + 1 = 5; Z = (2×1) + 2 = 4. **X wins**.  
    **With Z removed**:  
    - First 2 votes: Y > X → Y=1, X=0 (per vote)  
    - Next 2 votes: X > Y → X=1, Y=0 (per vote)  
    - Last vote: Y > X → Y=1, X=0  
    **New Total**: X = 2, Y = 3. **Y wins**.  

  Here, Z’s removal flipped the outcome because voters who preferred X but ranked Z above Y (the 2nd group) lost the "buffer" that gave X extra points. Y benefited because all Y-supporters ranked Y above X head-to-head.

  ### Could a Different Voting Method Avoid This?
  No ranked-choice voting system is immune to all paradoxes (as per Arrow’s Impossibility Theorem), but some methods are less prone to IIA failures:
  1. **Plurality Voting**: Voters choose one candidate; the most votes win.  
     - *Pros*: Simple, avoids this reversal.  
     - *Cons*: Ignores ranked preferences; a candidate with broad 2nd-choice support might lose.  
  2. **Instant-Runoff Voting (IRV)**: Voters rank all candidates; if no majority, the last-place candidate is eliminated and votes redistributed until one has a majority.  
     - *Pros*: Handles spoilers better; removal of a non-viable candidate (like Z) rarely alters the top-two outcome.  
     - *Cons*: Can still exhibit paradoxes in complex races.  
  3. **Condorcet Method**: Candidates compete in head-to-head matchups; the candidate who beats all others wins.  
     - *Pros*: Directly respects head-to-head preferences (e.g., in your case, Y would likely beat X).  
     - *Cons*: May produce cycles (e.g., X beats Y, Y beats Z, Z beats X), requiring tie-breakers.  

  In your scenario, **Condorcet or IRV would likely have elected Y from the start** since Y was the head-to-head favorite against X. The Borda count’s sensitivity to the full field masked this.

  ### Recommendations for Your Committee:
  - **Current Decision**: Treat the **original vote (with Z included) as valid**. The Borda count was designed for the full candidate set, and Z’s withdrawal doesn’t invalidate the initial preferences. Extend the offer to X.  
  - **Future Processes**:  
    - Use **IRV or Condorcet** to avoid IIA issues. IRV is simpler for small groups; Condorcet is more robust for pairwise comparisons.  
    - **Avoid Borda count** for small committees with potential withdrawals, as it’s highly susceptible to irrelevant-alternative effects.  
    - **Document the method in advance**: Specify how withdrawals are handled (e.g., no recalculation, or revote between top two).  

  This reversal reflects a quirk of voting theory, not malpractice. While unsettling, it underscores why method choice matters. For now, proceed with X as the original winner to maintain procedural integrity.
