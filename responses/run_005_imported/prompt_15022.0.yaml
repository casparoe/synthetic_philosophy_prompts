  So in my seminar on formal epistemology (cross-listed with the CS department's logic course, which is honestly the only reason I signed up) we spent last week on Gödel's incompleteness theorems, and today my professor went on a tangent about something called the "Löbian obstacle" — apparently it's a big deal in AI safety circles when people try to design agents that can trust their own future reasoning, or build successor agents they can actually rely on. I looked into Löb's theorem a bit on my own afterward and I can follow the symbol-pushing (something like: if a system can prove "provable(P) implies P," then it can already prove P outright), but I don't actually get why this is true on a gut level — it just feels like a slight-of-hand with the diagonal lemma.

  Here's what's really bugging me though: intuitively it seems totally fine for an agent to trust a successor that reasons in exactly the same way it does. Like, if I build a perfect copy of myself, why shouldn't I be allowed to believe "whatever copy-me proves must be true"? But apparently that's precisely the innocent-sounding step that Löb's theorem blocks, and the workaround people use (having each generation reason in a strictly weaker proof system than the last) seems really unstable and unsatisfying to me, like you're just deferring the problem forever instead of solving it.

  Could you give me an actual intuition for why Löb's theorem holds — not just the formal derivation, I want the "oh, THAT's why" moment — and then unpack why it specifically sabotages this kind of naive self-trust between equally-strong reasoners, rather than being some obscure fact about weird self-referential sentences that doesn't matter in practice? Also, if you can, I'd love to know how this connects to (or differs from) the more famous result that consistent systems can't prove their own consistency, since my professor implied the two are related but didn't really elaborate in class.
