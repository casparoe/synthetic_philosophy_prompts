answer: |-
  Let's break down Lewis's "undermining" problem step-by-step. I'll use a simplified example, explain the contradiction, why "inadmissibility" isn't a trivial fix, how the New Principle works, and its reception.

  ### 1. **Setup: Lewis's Best-System Account (BSA) & Principal Principle (PP)**
      - **BSA (Humean Chances):** Objective chance at time `t` is *not* a fundamental property. It's defined by the *best systematization* (simplest + strongest) of the *entire* Humean mosaic (the complete history of particular facts, past *and future*). The chance of an event `A` at `t` (`ch_t(A)`) depends on the *whole* world history.
      - **Principal Principle (PP):** For a rational agent with no "inadmissible" evidence, their credence in `A` should equal the objective chance:  
        `Cr(A | ch_t(A) = x ∧ E) = x`  
        where `E` is any *admissible* evidence (roughly: evidence about the past up to `t` or "logical" truths).

  ### 2. **The "Big Bad Bug": Undermining Futures**
  **The Core Problem:** In BSA, the chance `ch_t(A)` depends on the *entire* future. Some possible futures are **underminers**: they are *consistent with the current chance* but, *if they occurred*, would make `ch_t(A)` *different* from what it actually is.

  **Simple Example: A Tiny World**
  - Imagine a world with only **10 coin tosses** (T1 to T10) at times t1 to t10.
  - The "Best System" for this world says: "The chance of heads on any toss is 0.5, *and* this law holds only if exactly 5 of the 10 tosses are heads." (Simplicity: one parameter; Strength: covers all tosses).
  - **Actual World (W):** 5 heads occur. So, at any time `t` before all tosses, `ch_t(heads on any toss) = 0.5`.
  - **Undermining Future (F):** Consider a future where *all 10 tosses land heads*. This future has a *positive* chance at early times! Specifically:
    - At t0 (before any tosses), `ch_{t0}(F) = (0.5)^10 = 1/1024`.
  - **But:** If `F` *were* to occur, the *actual* frequency would be 10/10 heads. In *that* world, the Best System *wouldn't* say "chance = 0.5". It would say "chance = 1.0" (or something else). So, in `F`, `ch_{t0}(heads)` ≠ 0.5.

  ### 3. **The Contradiction Bites**
  Apply PP naively to the undermining future `F` at time `t0`:
  1. **PP Prescription:**  
     `Cr(F | ch_{t0}(F) = 1/1024 ∧ E) = 1/1024`  
     (Where `E` is admissible evidence: e.g., "no tosses have occurred yet").
  2. **Agent's Ratiocination:**  
     The agent knows `ch_{t0}(F) = 1/1024` implies `F` has a *positive* chance. But they also know:
     - If `F` occurs, then `ch_{t0}(heads) ≠ 0.5` (it would be 1.0).
     - But they *currently know* `ch_{t0}(heads) = 0.5` (as part of their evidence!).
     - So: `F` → `ch_{t0}(heads) ≠ 0.5`  
       But they know `ch_{t0}(heads) = 0.5`.  
       Therefore: `F` → **Contradiction** (`0.5 ≠ 0.5`).  
       ∴ `F` is *impossible* → `Cr(F | ...) = 0`.
  3. **Contradiction:**  
     PP says `Cr(F) = 1/1024 > 0`.  
     Ratiocination says `Cr(F) = 0`.

  **Where the Bite Is:** The agent's knowledge of the *current chance* (`ch_{t0}(heads) = 0.5`) combined with the *definition* of chance (BSA) *logically entails* that `F` *cannot happen*. But PP, using that same chance, assigns `F` a positive probability. Hence, PP forces the agent to assign positive credence to something they know is impossible.

  ### 4. **Why Not Just Call Chance "Inadmissible"?**
  - **The Triviality Threat:** Declaring knowledge of `ch_t` inadmissible *everywhere* would cripple PP. PP's power comes from letting agents conditionalize on known chances! If `ch_t(A)=x` is inadmissible, then PP *never applies* when you know the chances—rendering it useless for calibration.
  - **Selective Inadmissibility?** Could we say `ch_t` is admissible *except* when reasoning about underminers? But Lewis argued this is ad hoc and lacks a principled basis within BSA. The root problem is that *BSA itself* makes knowledge of `ch_t` entail information about the future (i.e., that undermining futures *don't* occur).

  ### 5. **Lewis's New Principle (NP)**
  Lewis's fix ([Lewis 1994](https://www.oxfordscholarship.com/view/10.1093/0195032047.001.0001/acprof-9780195032048-chapter-19)) replaces PP with:

  `Cr(A | T_w ∧ H_t) = ch_t(A)`

  Where:
  - `T_w` is the *complete true theory of chance* for world `w` (not just `ch_t(A)=x`, but the *entire* chance fabric).
  - `H_t` is the admissible historical evidence up to `t`.

  **How NP Resolves Undermining:**
  - In our example, `T_w` specifies how chances depend on the *entire* mosaic. Crucially, it says:
    > "`ch_{t0}(heads) = 0.5` **only if** exactly 5 heads occur overall. If 10 heads occur, `ch_{t0}(heads) = 1.0`."
  - Now apply NP to `F` (all heads):
    `Cr(F | T_w ∧ H_{t0}) = ch_{t0}(F | T_w)`  
    But `T_w` explicitly states that if `F` occurs, then `ch_{t0}(F) = (1.0)^{10} = 1`.  
    However, `T_w` *also* says that in the *actual* world (where `ch_{t0}(heads)=0.5`), `F` *cannot* occur—because if it did, `ch_{t0}(heads)` would be 1.0, not 0.5. So:
    `ch_{t0}(F | T_w) = 0`  
    ∴ `Cr(F | T_w ∧ H_{t0}) = 0`.
  - **Result:** NP aligns with the agent's ratiocination. Credence in `F` is 0, as it must be. NP respects the *holism* of BSA: chances and futures are evaluated together within `T_w`.

  ### 6. **Did the Fix Succeed? The Philosophical Verdict**
  - **Yes, technically:** NP avoids logical contradictions with BSA. Most agree Lewis *dissolved* the "big bad bug" formally.
  - **But Significant Costs & Criticisms:**
    1. **Complexity & Epistemology:** NP requires agents to condition on the *entire* theory of chance (`T_w`), not just local chances. This is arguably too demanding—how could a limited agent know `T_w`? PP was elegant; NP feels like a workaround.
    2. **Undermining Lives On?** Some argue NP only *relocates* the problem. While it avoids contradiction, the *intuition* that chances should "guide" credence independently of future facts is lost. Chances lose their "autonomy" (Hall, Schaffer).
    3. **Non-Humean Alternatives Thrive:** NP's complexity motivates non-Humean (e.g., primitivist or propensity) accounts where chances *constrain* futures fundamentally, avoiding undermining.
    4. **BSA-Specific:** NP is a fix *for BSA*. If you reject BSA (e.g., think chances must be "causal" or "primitive"), undermining isn't your problem.
  - **Consensus:** NP is the *best available fix* for Humean accounts of chance and is widely accepted *among Humeans*. But it highlights a deep tension in BSA: chances are "real" enough to constrain credences (via PP/NP) but "unreal" enough to be metaphysically dependent on future outcomes. Non-Humeans see this as a fatal flaw.

  ### Key Takeaway for a Software Engineer
  Think of BSA chances as a *global compression algorithm* over spacetime. PP tries to use a local snapshot (`ch_t(A)=x`) to predict the future, but the snapshot's validity depends on the *full data stream*. Undermining futures are like inputs that would change the compression output. NP forces you to run the *full algorithm* (`T_w`) on hypothetical inputs before assigning credence. It works, but it's costly—much like recomputing a hash over the entire dataset rather than trusting a cached value. The bug is patched, but the elegance of the original spec (PP) is lost.
