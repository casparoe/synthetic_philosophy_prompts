  The problem is that in this framework, a future event could have a positive chance now, but if it happens, it would mean that the current chances weren't what we thought. So the Principal Principle tells the agent to set credence equal to current chance, but knowing the chance might lead them to doubt that chance. 

  I should start by setting up a simple example. Maybe a coin toss scenario? But it needs to involve the entire world history affecting the chance. Perhaps a very small world where there are only a few coin tosses. Let's say there are 10 coin tosses in total, and the chance of heads is defined by the best system, which in this case would be the actual frequency. But if the actual frequency is what determines the chance, then each toss's outcome affects the chance itself.

  Wait, no. The chance is fixed by the entire history. So at time t, before all tosses, the chance of heads on the first toss should be equal to the frequency in the whole sequence. But if the agent knows the current chance, say 0.5, but the sequence that would make the frequency 0.5 could be undermined by a future that makes the frequency different. 

  For example, suppose the actual frequency is 5 heads out of 10. The best system says chance is 0.5. But consider a future where the first toss is heads. That's fine. But if all tosses were heads, that would make the frequency 1.0, so the chance wouldn't be 0.5. But in that world, the chance now (at t) was actually not 0.5 because the entire history determines it. So the agent knows that if the future outcomes are such that the frequency isn't 0.5, then the current chance wasn't 0.5. But the Principal Principle says to set credence in a future outcome based on current chance. 

  Here's where the contradiction bites. Let's say at time t, the chance of a specific outcome (like the first toss being heads) is ch. But there's a future F which, if it happens, implies that ch wasn't the actual chance. The Principal Principle says P(F) should be ch(F). But if F happens, then ch wasn't the real chance, so maybe ch(F) is not correct? 

  Lewis's solution was to make chance information inadmissible. But that leads to triviality because then you can't use the Principal Principle at all when you know the chances. That's not acceptable. 

  Then Lewis proposed the New Principle: instead of conditioning on the chance, you condition on the entire theory of chance. So the credence should equal the chance given the entire theory T. That way, even if an outcome would undermine the chance, the theory T specifies what the chance is in all possibilities, including undermining futures. 

  I need to check if the user understands why the admissibility move doesn't work. They might think that if chance info is inadmissible, then the problem is avoided. But that would make the Principal Principle useless when you know the chances. 

  Also, the user wants to know if the New Principle is generally accepted. I recall that some philosophers think it's a fix, but others criticize it as too complex or not fully solving the issue. 

