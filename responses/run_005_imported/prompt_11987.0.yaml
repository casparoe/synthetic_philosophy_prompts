answer: |-
  Your past actions don't disqualify you from speaking up; they uniquely qualify you. Your experience creates a powerful opportunity for meaningful dialogue, provided you approach it with humility and focus on the practice itself rather than personal judgment. Here's how to navigate this ethically:

  1.  **Acknowledge Your Past Directly:** Start the conversation by disclosing your own history: *"John, I need to start by being transparent. Early in my career, I added my name as co-author to papers where my students did nearly all the work. I came to realize years ago it was wrong and stopped, though I regret never apologizing to those students or correcting the record. My own history is why this issue weighs on me."*
      *   **Why it works:** This disarms accusations of hypocrisy, demonstrates self-awareness, and establishes shared context. It shows you're not judging *him* from a pedestal, but reflecting on a *systemic* issue you both participated in.

  2.  **Focus on the Principle, Impact, and Evolution:** Shift the focus away from him personally and onto the ethical problem, its consequences, and changing standards:
      *   **The Ethical Violation:** Explain *why* it's problematic: "It dilutes the meaning of authorship," "It misattributes credit and undermines the students' primary contribution," "It violates core principles of fairness and intellectual honesty we expect in science."
      *   **Impact on Students:** Highlight the harm: "Students miss out on primary recognition crucial for their careers," "It can foster resentment and undermine their sense of ownership and accomplishment," "It teaches them the wrong lesson about scientific credit."
      *   **Changing Norms:** Frame it as progress: "Norms around authorship have evolved significantly. ICMJE and most journals now explicitly require substantial intellectual contribution for authorship. Heading the lab or securing funding is acknowledged in the 'Acknowledgements,' not authorship."

  3.  **Frame it as Concern & Shared Reflection, Not Accusation:** Use "I" statements and express concern rather than blame:
      *   "Seeing it now from the outside, and with my own regrets, I feel concerned about how this practice affects trainees and the integrity of our field."
      *   "I've been reflecting a lot on authorship ethics since retiring and reading philosophy. It made me revisit my own past actions and the standards we operated under."
      *   "I wonder if you've also reflected on this practice over the years?"

  4.  **Avoid Demands, Offer Dialogue (and Potential Action):** The goal is to prompt reflection, not force an immediate confession or change:
      *   "I'm not here to tell you what to do. But given our history and shared field, I felt I needed to share my perspective and concerns."
      *   "I'd be interested to hear your thoughts on authorship norms now versus when we started."
      *   **Crucially:** Connect it to your own regret: "My biggest regret is never making amends to my own students. It's something I still struggle with." (This subtly introduces the idea of correction without demanding it of him *yet*).

  5.  **Manage Expectations:** Be prepared for defensiveness. He might:
      *   Justify it ("It's how it's always been," "The lab deserves credit," "Students expect it").
      *   Point out your past actions (which you've already disarmed).
      *   Dismiss your concerns.
      Your goal isn't to "win" the argument immediately but to plant a seed of ethical reflection he may not have seriously considered before. Even if he reacts poorly, you've acted on your ethical conviction.

  **Why you ARE in a position to speak up:**

  *   **Growth & Insight:** You've demonstrated moral growth by recognizing the wrong and changing your behavior. Your philosophical reflection deepens this insight.
  *   **Relevant Experience:** You understand the pressures, the system, and the specific practice *from the inside*. This gives your perspective weight.
  *   **Reduced Conflict of Interest:** Being retired removes any power dynamic or professional retaliation risk.
  *   **Focus on the Practice:** You're criticizing a *practice* you once engaged in, not attacking *him* as a person. Your shared experience is the foundation for the conversation.
  *   **Moral Responsibility:** Recognizing past wrongs creates an obligation to speak against those wrongs when you see them persist, especially when you understand their harm intimately.

  **Before the Conversation:**

  1.  **Clarify Your Goal:** Is it primarily to express your concern? To prompt his reflection? To encourage him to change his practice? To suggest amends? (Start with the first two).
  2.  **Rehearse:** Practice stating your points concisely and calmly, especially the part about your own past.
  3.  **Choose Setting:** Opt for a private, calm moment during the reunion, not a public confrontation.
  4.  **Consider Your Students (Optional but Powerful):** While not necessary for *this* conversation with your colleague, reflecting on whether you owe *your own* former students an apology or acknowledgment (even belatedly) is a separate, important ethical step for *you*.

  **Your past doesn't silence you; it fuels your understanding and gives your voice authenticity on this specific issue. By framing the conversation with humility, transparency, and a focus on the ethical principle and impact on students, you can raise this legitimately and constructively.**
