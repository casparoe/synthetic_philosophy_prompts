  Sober's distinction is the sharpest tool. If gene selectionism conflates what selection acts *upon* (vehicles) vs. what it *propagates* (replicators), is the whole position just a verbal trick? Guest will probably dismiss vehicles as epiphenomenal. Follow-up must force him to admit this reduces biology to abstract information—which feels alien to how evolution actually operates.

