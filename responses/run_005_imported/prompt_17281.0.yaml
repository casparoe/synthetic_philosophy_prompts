answer: |-
  Here’s a set of incisive interview questions targeting the core tensions in gene selectionism, with follow-ups designed to challenge standard replies. Each question leverages your specified angles while avoiding superficial restatements:

  ### 1. **Price Equation & Ontological Privilege**  
  *Q: The Price Equation shows formal equivalence between gene-level and group-level partitions of fitness variance. If both frameworks are mathematically intertranslatable, what justifies treating the gene as the "real" unit of selection rather than a pragmatically useful *replicator* lens? Doesn’t this equivalence suggest ontology reduces to bookkeeping preference?*  
  **Likely Reply**: "Genes are the only *replicators* with fidelity—groups/organisms are temporary vehicles."  
  **Follow-up**: If replicator status hinges solely on copying fidelity, couldn’t we imagine engineered systems (e.g., horizontal gene transfer networks, cultural memes) where *non*-genic elements achieve high-fidelity replication? Does this force gene selectionism into either arbitrary boundary-drawing or a circular definition where "real unit" = "whatever copies like DNA"?  

  ### 2. **Eusocial "Superorganisms" & Emergent Individuality**  
  *Q: In eusocial colonies (ants, mole-rats), we see colony-level physiology: nutrient redistribution, caste polymorphism, and metabolic scaling laws mirroring organismal allometry. If selection acts *only* on genes via kin altruism, how does your framework explain the *emergent coordination* of traits like worker sterility—without implicitly treating the colony as a unit with fitness?*  
  **Likely Reply**: "Coordination emerges from shared genes maximizing inclusive fitness; the colony isn’t a unit, just a vehicle."  
  **Follow-up**: When colonies exhibit adaptive responses to environmental shocks (e.g., collective thermoregulation) faster than gene frequencies change, isn’t this *causally* driven by colony-structure? If genes "control" the outcome only in the tautological sense that everything does, haven’t we lost explanatory power?  

  ### 3. **Sober’s Distinction: Causation vs. Convenience**  
  *Q: Sober distinguishes *selection-for* (causal targets) from *selection-of* (byproducts). Gene selectionism often treats organism/group traits as "selected of" while genes are "selected for." But when a gene’s survival depends entirely on its vehicle’s performance (e.g., antler size affecting stag gene propagation), isn’t the vehicle the causal nexus? Isn’t calling genes the "unit" just pragmatic bookkeeping?*  
  **Likely Reply**: "Genes are selected *for* their phenotypic effects; vehicles are selected *of* as summed gene effects."  
  **Follow-up**: If every gene’s fitness is contingent on its vehicle’s interaction with the environment—and vehicles have emergent properties genes lack (e.g., locomotion, cognition)—doesn’t this make the vehicle the *locus of causal efficacy*? Isn’t denying this akin to saying "atoms are real, molecules are illusions"?  

  ### 4. **Kin Selection as Costume: Semantics or Substance?**  
  *Q: You famously call group selection "kin selection in a costume." But since Hamilton’s rule (rb > c) can be expressed equivalently in multilevel selection terms (group vs. individual fitness tradeoffs), is the distinction purely semantic? If so, why insist genes are ontologically privileged when the math is neutral?*  
  **Likely Reply**: "Kin selection explains altruism without group fitness; group models add needless complexity."  
  **Follow-up**: When group-structure directly modulates gene expression (e.g., quorum sensing in biofilms), doesn’t ignoring the group level obscure how *context* shapes gene-centric outcomes? Doesn’t "needless complexity" beg the question against emergence?  

  ### 5. **Heritability & Causal Depth**  
  *Q: Gene selectionism requires high-fidelity heritability. Yet epigenetics, niche construction, and cultural transmission show traits can persist without genic inheritance. If group-level traits (e.g., termite mounds) have high heritability via environmental/structure inheritance, does this force gene selectionism to either expand "replicator" or deny heritability’s causal role?*  
  **Likely Reply**: "Non-genic inheritance is noise; only genes ensure cumulative adaptation."  
  **Follow-up**: If termite mounds buffer environmental change and reliably reconstruct across generations—enabling adaptation—isn’t dismissing this as "noise" functionally equivalent to ignoring natural selection itself?  

  ### 6. **The "Gang of Genes" Problem**  
  *Q: Genes don’t act in isolation but as co-adapted complexes (e.g., HOX clusters). When selection acts on interactions within a haplotype, isn’t the *gene network*—not individual genes—the unit under selection? Doesn’t this make the "gene as unit" claim arbitrary?*  
  **Likely Reply**: "Networks are still gene effects; selection favors allele combinations."  
  **Follow-up**: If combinations are the targets, why not treat the network as the unit? Isn’t this like arguing that atoms—not molecules—undergo chemical reactions?  

  ### 7. **Pragmatism vs. Ontology**  
  *Q: Dawkins concedes gene selectionism is "a way of seeing" not a claim about mechanisms. Has your position evolved from "genes are the causal unit" to "genic bookkeeping is most productive"—and if so, does this surrender the strong ontological claim?*  
  **Likely Reply**: "Productivity reflects causal reality; genes are privileged by evolution."  
  **Follow-up**: If productivity were to shift (e.g., in evo-devo, where regulatory networks explain novelty better), would gene selectionism become *less* true? Or is its truth detached from empirical utility?  

  ### 8. **Levels of Selection in Major Transitions**  
  *Q: During evolutionary transitions (e.g., prokaryotes to eukaryotes), lower-level units (genes) are subsumed into higher-level individuals (chromosomes). Doesn’t this process *require* temporary group selection to suppress within-group conflict? If genes are always the unit, how do we explain transitions without contradiction?*  
  **Likely Reply**: "Conflict suppression evolves via gene-level benefits (e.g., mutualism)."  
  **Follow-up**: But when selection acts *against* "selfish" genes (e.g., meiotic drivers) to preserve the emerging individual, isn’t the higher-level unit *directly* favored? Doesn’t treating this as "gene selection" stretch the concept beyond recognition?  

  ---  
  **Key Design Logic**:  
  - **Price Equation**: Forces confrontation with mathematical neutrality & ontological inflation.  
  - **Eusociality**: Targets emergent causality in "dissolved" individuals.  
  - **Sober’s Distinction**: Exposes conflation of causal locus vs. replicator bookkeeping.  
  - Follow-ups anticipate retreats to replication fidelity or pragmatism, then challenge internal consistency.  

  These questions avoid "Explain your view" and instead target *defensibility* under technical/philosophical pressure. Good luck with the interview!
