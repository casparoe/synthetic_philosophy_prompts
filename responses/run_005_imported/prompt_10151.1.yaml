answer: |-
  Here’s a biologically rich, lesser-discussed example perfect for your dinner scene—the **thoracic horn dimorphism in dung beetles (Onthophagus spp.)**—and why it’s a beautifully ambiguous evolutionary tangle:

  ### The Trait: Male Horn Dimorphism
  In many *Onthophagus* species, males develop into two distinct morphs:
  1. **"Majors"**: Large males with long, curved thoracic horns (used in combat).
  2. **"Minors"**: Small, hornless males that sneak matings.

  The horns *themselves* are the focal trait, but their evolutionary origin is nested in developmental constraints.

  ---

  ### The Two-Level Ambiguity

  **Level 1: The Inevitable Byproduct (The "Pendentive")**  
  Horns develop from the same larval epidermal cells that form the **thoracic bristles** (sensory setae) in all beetles. During metamorphosis, these cells undergo programmed cell death (*apoptosis*) to sculpt the adult thorax. In *Onthophagus*, this cell-death pathway is **delayed** in major males, allowing bristle precursor cells to proliferate into horns instead.  
  *Why inevitable?* You can't *avoid* having thoracic bristle precursors—they’re fundamental to insect cuticle development. Horns emerge because *modifying a universal developmental module* (bristle patterning) is more feasible than evolving a novel structure.

  **Level 2: The Tuned Form (The "Aesthetic Choice")**  
  But horns aren’t *just* delayed apoptosis byproducts. Their **shape, size, and location** are hyper-specialized:  
  - Curved horns lever rivals out of tunnels.  
  - Base thickness correlates with bite force.  
  - Minor males *suppress* horn growth via hormones to invest in testes.  
  *Selection’s fingerprint:* Populations on harder soils evolve thicker horns; in dense forests, longer horns evolve for aerial combat. The *developmental pathway* is constrained, but the *morphology* is fine-tuned.

  ---

  ### Why It Resists Classification
  - **Spandrel?** Horns originate from a developmental side effect (altered bristle apoptosis). But they’re *not functionless*—they’re weapons.  
  - **Exaptation?** Yes, bristle precursors were co-opted for combat. But selection then optimized horn shape *within* that developmental channel.  
  - **Adaptation?** Their current function is clear, but the *raw material* was a byproduct. You can’t understand horns without the bristle-apoptosis constraint.  

  **The Unsettled Test**  
  To prove horns are *primarily* a selected trait, you’d need to show that selection could have *easily* built weapons *without* co-opting bristle precursors (e.g., evolve novel structures from leg or wing tissue). But:  
  1. **Developmental Bias**: Bristle precursors are the *only* cells with positional info to grow thoracic projections. Leg/wing tissue lacks this.  
  2. **Pleiotropy**: Genes delaying apoptosis also affect sensory bristles elsewhere. Change horn development, you alter bristle patterns—potentially crippling flight or chemoreception.  

  Nobody’s done the test because it requires CRISPR-ing a beetle to grow horns from *non*-bristle tissue *without* fitness costs—a near-impossible developmental rewiring.  

  ---

  ### How Marguerite & Owen Might Debate It
  > **Marguerite** (leaning in, wine glass trembling):  
  > "Owen, even your beloved beetle horns prove my point. They’re *glorified bristles*. The whole system’s a kludge—selection just tinkered with cell death because it couldn’t start from scratch. Like pendentives: you *need* to support the dome, but the builders had choices. They *chose* pendentives over squinches, then carved angels into them. Does that make angels *adaptations*? Or just decorative spillover?"  
  >   
  > **Owen** (smiling, knife tapping his plate):  
  > "Rita, that’s like calling a hand a ‘glorified fin’. So horns co-opted bristle development—*so what?* Selection optimized leverage, thickness, plasticity. If it were *just* a spandrel, minors wouldn’t suppress it. Those horns are precision-engineered. Your ‘angels’ stab rivals in the dark."  
  >   
  > **Marguerite**: "But why no horns on the *abdomen*? Better leverage! Because the *developmental machinery isn’t there*, Owen. It’s constrained. You’re mistaking selection’s polish for its blueprint."  
  >   
  > **Owen**: "Constrained *paths* don’t negate adaptation. They *enable* it. No engineer laments that titanium can’t bake bread—they build jets. Horns are jets."  

  ---

  ### Why This Works for Your Scene
  - **Fresh & Technical**: Dung beetle horns are cited in Evo-Devo papers, not pop-science books. Feels lived-in.  
  - **Layered Ambiguity**: Nails the "byproduct-within-a-choice" structure. The bristle precursor is the pendentive; horn shape is the angel carving.  
  - **Unresolvable**: The CRISPR test is implausible, leaving the argument eternally fertile.  
  - **Thematic**: Mirrors their history—their feud is a "developmental byproduct" of their advisor’s mentorship style, later "optimized" into rival careers.  

  This example lets them clash over nuance, not dogma—perfect for two scientists who know each other’s blind spots by heart.
