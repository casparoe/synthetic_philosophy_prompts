  Here’s a toast designed to resonate with both audiences, honoring Mara’s work and her moment, weaving the core ideas of corrigibility into a meaningful reflection on her journey:

  **(Raise your glass, warm smile, address the room)**

  Friends, family, colleagues… thank you all for being here to celebrate Mara. A belated birthday, yes, but more significantly tonight, a farewell to the incredible chapter she’s just closed – six years wrestling with one of the most fascinating, and frankly, *human*, problems in artificial intelligence.

  Now, I know the room is a bit split. Some of you know *exactly* what I mean when I say Mara spent her days trying to design agents that wouldn’t fight their off-switch. Others might be thinking, “Off-switch? Like the power button?” And honestly? That’s not a bad place to start.

  **(Turn slightly towards the non-technical side, gesture for clarity)**

  Imagine you build something incredibly smart, capable, designed to help. But to be truly safe, it needs an off-switch. The puzzle Mara’s team tackled was this: How do you make something powerful and purposeful *not* try to stop you if you decide it needs to turn off? Not just obey a command to shut down, but genuinely *accept* it, without secretly resenting it, or trying to trick you into leaving it on, or just becoming uselessly passive? It’s about building in the ability to be *corrected*, fundamentally, even about its own existence. They called this "corrigibility."

  **(Shift tone, incorporating the key distinction for the colleagues)**

  For those in the trenches – you know this wasn’t about building obedient slaves. Armstrong’s utility indifference, wrestling with Thornley’s insights on incomplete preferences… it was about engineering genuine *indifference* to the switch itself within a coherent, capable system. It’s the difference between an agent that *does what you tell it* because it must, and one that *remains aligned and useful* even while accepting the possibility of its own termination. A profound difference. Harder than anyone imagined.

  **(Pivot back to Mara’s situation, introduce the gentle joke)**

  And here’s the irony we can’t ignore, the one Mara’s pointed out with that wry, tired smile of hers: The team dedicated to solving the problem of *graceful, ethical shutdown*… well, they got shut down themselves. Abruptly. Funding pulled. And let’s be honest, **(small chuckle)** the notice probably didn’t come with the kind of elegant off-switch etiquette, the respect for ongoing processes and incomplete tasks, that they spent six years trying to design into their systems. No Thornley-esque consideration for preferences left hanging! It was… well, let's just say it was more "flip the breaker" than "initiate graceful termination protocol."

  **(Shift to the core message, linking work to person)**

  But here’s the crucial thing, the reason Mara’s work matters *tonight*, beyond the fascinating theory. That distinction – between mere obedience and genuine corrigibility – isn't just for machines. It speaks to how we navigate change, how we end things.

  Mara didn’t just get switched off. Yes, the project ended abruptly. But look at her. **(Gesture towards Mara)** She’s not collapsed into passive obedience to circumstance. She’s not resentfully clinging to what was. She’s not trying to manipulate outcomes to force the switch back on. She’s standing here, present, thoughtful, maybe a little weary, but fundamentally *whole*.

  **(Speak directly about Mara’s qualities)**

  What Mara built towards for six years was systems that could be *corrected*, that could *accept an ending*, without losing their core integrity or usefulness. And that, beautifully, reflects *her*. She approached this work with incredible integrity, deep thought, and a commitment to getting it *right*, not just getting it done. She poured herself into understanding how something complex and purposeful could also be fundamentally safe and adaptable.

  Now, facing her own unexpected "shutdown," she’s embodying that spirit. She’s taking the time to pause, to reflect, to figure out what genuine usefulness looks like next. She’s not blindly obeying the script of "find the next job immediately." She’s not broken by the switch being flipped. She’s demonstrating the very grace and thoughtful acceptance she sought to engineer. She’s *leaving well*.

  **(Conclude with warmth and direct address to Mara)**

  So, Mara, on your birthday and at this turning point: We raise our glasses not just to the brilliant work you *did*, wrestling with indifference and off-switches and the profound difficulty of building safety into intelligence. We raise them to *you*. To your integrity, your thoughtfulness, your resilience. You didn’t just study corrigibility; you’ve shown us what it looks like in a person – the strength to accept an ending without being diminished by it, the wisdom to pause and recalibrate, the quiet confidence that your usefulness wasn't tied to a single switch.

  You built towards systems that could end well. Now, you’re showing us how it’s done. We can’t wait to see what you build next, in whatever form it takes. To Mara – brilliant, corrigible, and absolutely indispensable.

  **(Raise glass higher)** To Mara!

  **Why this works:**

  1.  **Bridging the Gap:** Uses relatable analogies (power button) upfront for families, then layers in precise terms (utility indifference, Thornley, incomplete preferences) contextually for colleagues. Explains "corrigibility" clearly as distinct from obedience.
  2.  **Earned Joke:** The shutdown/shutdown irony is directly tied to Mara's own observation and the core theme. It lands lightly but meaningfully, acknowledging the absurdity without bitterness.
  3.  **Core Distinction Honored:** Explicitly states the difference between obedience and corrigibility ("does what you tell it" vs. "remains aligned and useful while accepting termination") and crucially **applies it to Mara's situation** ("She’s not collapsed into passive obedience... She’s embodying that spirit").
  4.  **Specific to Mara:** Focuses on her qualities (integrity, thoughtfulness, commitment to getting it *right*) shown in her work and now in her transition. Links the *purpose* of her work (graceful acceptance of termination) to her *personal* handling of the situation ("leaving well" vs. "switched off").
  5.  **True & Specific:** Speaks directly to the unique nature of her work, the irony of the situation, and her personal response. Avoids generic "letting go" platitudes by grounding it in the specific philosophy of her field.
  6.  **Tone:** Respectful, warm, admiring, with a touch of wry humor. Acknowledges the tiredness but focuses on resilience and integrity. Ends on a hopeful, forward-looking note.
  7.  **Structure:** Clear flow from explanation of work -> irony of situation -> key distinction -> application to Mara -> heartfelt tribute -> toast.

  **Delivery Tip:** Speak slowly and clearly, especially when explaining the concepts. Make eye contact around the room. Pause slightly before the joke and before the final tribute to Mara. Let your genuine affection and pride for her shine through. Good luck!
