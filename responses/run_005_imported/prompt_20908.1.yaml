answer: |-
  The salt air tasted like failure on Ben’s tongue. Below his elevated chair, the late afternoon crowd thinned on Harbor Beach. Only one swimmer remained, a boy of maybe twelve, venturing too far past the buoys where the shelf dropped steeply. Ben had noted him earlier – decent stroke, but pushing his limits. He’d meant to blow the whistle, call him back. Then the osprey.

  It wasn’t unusual. Birds dove for fish. But this one, wingspan vast, plummeted spectacularly close to shore, snatching a silver glint just yards from where the boy swam. Ben’s head snapped up, tracking the majestic arc against the bruised-orange sky. A collective gasp rose from the remaining sunbathers. Dr. Aris Thorne, the cardiologist who jogged the beach daily, paused his stretching, binoculars momentarily forgotten around his neck. Marta, the retired Olympic swim coach who gave lessons further down, shielded her eyes, watching the bird, not the water. Even Dave, the perpetually cheerful mail carrier finishing his route along the promenade, leaned on his cart, pointing upwards.

  For ten seconds, maybe twelve, the osprey held the beach’s attention hostage.

  Ben’s gaze returned to the water. The boy wasn’t swimming anymore. He was thrashing, arms flailing wildly, head dipping under, surfacing only to gasp before vanishing again. A dark spot in the choppy water.

  *Move.* The command screamed in Ben’s skull. But his limbs felt leaden, welded to the plastic chair. *Blow the whistle. Run. Dive.* The protocols were muscle memory, yet he remained frozen, a statue carved from dread. He saw Dr. Thorne lower his binoculars, frown towards the commotion, then turn back to adjusting his running shoes. Marta stood, squinting, hand raised to her brow. Did she see? She took a step towards the water, then hesitated, looking around as if waiting for someone else to act. Dave the mailman shifted his weight, craning his neck, but didn’t leave his cart.

  It was Leo who moved first. Leo, the shaggy-haired college kid who worked the snack shack, wiping down counters. He dropped his rag, vaulted the counter, and sprinted across the sand, kicking up plumes. He hit the water in a clumsy dive just as the boy’s struggles ceased, leaving only ripples.

  Ben finally unfroze. He scrambled down the ladder, whistle shrieking a useless, belated alarm. He plunged in, reaching Leo and the limp form just as others finally converged – Dr. Thorne arriving, breathing heavily; Marta wading in, her face grim; Dave abandoning his cart, shouting for someone to call 911. CPR began on the sand, a frantic, disjointed effort. Dr. Thorne took charge, his professional calm finally snapping into place, barking orders. Marta helped with compressions. Leo stood dripping, shivering, eyes wide with shock. Dave hovered uselessly, phone pressed to his ear.

  It was too late. The ambulance wail pierced the dusk as the small body was covered.

  ***

  The investigation was swift, brutal. The focus, laser-like, fell on Ben.

  “You were the designated lifeguard on duty?” the police sergeant asked, his voice flat, notepad open.
  “Yes.”
  “You saw the swimmer in distress?”
  “I… I saw him go under. After.”
  “After what, Mr. Vance?”
  “After I looked away. At the bird.”
  “The osprey.” The sergeant made a note. “And how long would you estimate your attention was diverted?”
  “Seconds. Ten? Fifteen?” It felt like an eternity compressed into a heartbeat.
  “Long enough.”
  “I froze,” Ben whispered, the admission scraping his throat raw. “I just… froze.”

  The report cited “failure to maintain constant vigilance” and “failure to respond promptly.” His certification was revoked. The local paper ran the headline: “Lifeguard’s Inaction Blamed in Drowning Tragedy.” Online comments were a torrent of fury: *Should be charged!* *Negligent!* *He had ONE job!* Ben saw it in the eyes of neighbors, the averted gazes at the grocery store. The weight was crushing, absolute. He *was* responsible. He *had* failed. He *could* have saved him. The counterfactual hammered in his skull: *If I’d acted, he’d be alive.*

  One evening, drowning in cheap beer at the Harbor Light, Leo slid into the booth opposite him. Leo’s eyes were red-rimmed. “They’re crucifying you,” he muttered.

  Ben just stared at the sticky tabletop. “They’re right.”

  “Are they?” Leo leaned forward, his voice low, intense. “When I ran, Ben, I looked around. Dr. Thorne – he *saw*. He’s a doctor, for god’s sake! He knows CPR better than anyone. Marta – she trained champions. She could’ve been in that water faster than me. Dave… he was right there on the path. Even Mrs. Gable, watching from her balcony – she screamed, but did she call 911? Or just scream?”

  Ben flinched. He hadn’t known about Mrs. Gable.

  “I got there,” Leo continued, “because I was closest? Because I’m young and dumb and didn’t stop to think? Thorne *thought*. Marta *hesitated*. Dave… I don’t know what Dave did. But they all saw him go under. They all *could* have done *something* before me. Before it was too late.”

  The logic hit Ben like a rogue wave. Leo was right. By the pure, cold calculus of counterfactual dependence – *if X had acted, Y would not have drowned* – the chain stretched far beyond his lifeguard chair. Dr. Thorne, bound by oath to aid, watching the struggle before adjusting his laces. Marta, whose life was swimming, taking that fatal moment to scan for someone else. Dave, strong and capable, frozen by his mail cart. Mrs. Gable on her balcony, a witness with a phone. Countless others on the beach whose attention *might* have flickered towards the water before the commotion started, who *could* have shouted, run, acted. Even Leo himself, acting *after* the critical window.

  Ben saw them all, a ghostly procession on the dark water of his guilt: Thorne, Marta, Dave, Mrs. Gable, faceless sunbathers, tourists snapping photos of the osprey. Each one, in that precise moment of inaction, satisfied the condition: *If they had intervened immediately upon seeing the distress, the boy might have lived.* His unique failure – his *duty* – dissolved into a terrifying sea of identical, passive non-events. The promiscuity of omission. The lifeguard chair wasn't a unique locus of cause; it was just the most visible, the one society had *named* as responsible. The vertigo was immense. He wasn't solely to blame; he was merely the designated focal point for an ocean of inaction.

  He looked at Leo, the only one who moved, the only one besides him haunted by the *could have*. "They saw," Ben echoed, the words hollow. "They all could have."

  Leo nodded grimly. "But only one of us was *paid* to." He stood up, leaving Ben alone with the crushing weight of his duty and the dizzying, infinite echo of everyone else's quiet, causally potent, nothing. Outside, the harbor lights reflected on the black water, mirroring countless points of light, indistinguishable, each holding a fraction of the unacted possibility that had drowned with the boy. The blame settled on Ben, heavy and specific, while the silent, logical ghosts of a hundred other non-causes shimmered just beneath the surface, unseen by the town, but screaming in the hollow space where responsibility should have clear borders. The ambulance siren, fading days ago, still seemed to wail in his ears, a lament not just for the boy, but for the impossible tangle of *what didn't happen*.
