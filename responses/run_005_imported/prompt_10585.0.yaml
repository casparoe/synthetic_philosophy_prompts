  Breaking this down: 

  1. **Real-world Systems Reliance on Strong Rationality Priors:** Systems like RLHF (used in chatbots) or autonomous vehicles assume humans are mostly rational. For example, RLHF treats human preferences as consistent and rational, ignoring biases. If the AI assumes perfect rationality, it might misinterpret biases as true preferences. 

  2. **Practical Workarounds vs. Theoretical Limits:** In practice, engineers use tricks like simplicity priors, but as the user noted, degenerate cases are equally simple. However, real systems might avoid this by leveraging massive datasets and contextual clues. But the fundamental issue remains—assumptions are baked in. 

  3. **Consequences of Hidden Assumptions:** If a system assumes rationality, it might perpetuate human biases. For instance, a recommender system might interpret clickbait clicks as genuine preference, leading to more extreme content. Or an autonomous vehicle might misjudge a driver's risky maneuver as intentional. 

  4. **Trust and Deference:** Should we trust these systems? The answer depends on how well the embedded rationality model matches reality. If the AI assumes more rationality than exists, it might make dangerous inferences. Transparency about these assumptions is crucial, but often lacking. 

  The user's deeper concern seems to be about the ethical implications. If IRL systems inherently impose a rationality model, they might misattribute human errors to true preferences, leading to harmful outcomes. They might also wonder if there's a way to mitigate this, or if it's an unsolvable problem. 

  I should address how different systems handle this. RLHF in chatbots uses pairwise comparisons, which might reduce but not eliminate the problem. Autonomous vehicles use IRL to predict pedestrian behavior but combine it with safety margins. Recommender systems optimize engagement, possibly amplifying irrational behaviors. 

