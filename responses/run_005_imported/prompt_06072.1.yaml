answer: |-
  That's a fantastic passage to focus on, and you've hit on precisely the core tension in Hobbes's philosophy – his radical nominalism and his belief in the unique certainty of geometry. Let's unpack his argument and see how it relates to the Wallis debacle.

  **Unpacking Hobbes's Argument on Geometry & Definitions:**

  1.  **Truth as Linguistic Ordering:** Hobbes is a radical nominalist. For him, words are arbitrary signs ("names") we attach to our sensory experiences and mental constructs. Truth isn't a direct correspondence with some external, Platonic reality; it's solely about the *correct arrangement of names in propositions* ("affirmations"). If the names are defined clearly and the logical connections between them follow the rules of signification, the proposition is true.
  2.  **The Danger of Ambiguity:** Failure to rigorously define names leads to confusion and error ("entangled in words... belimed"). Without fixed significations, reasoning becomes incoherent.
  3.  **Geometry's Unique Status:** Hobbes elevates geometry above all other sciences for one crucial reason: **its objects are human constructions defined by stipulation.**
      *   **Constructed Objects:** We don't "discover" a perfect circle or triangle in the messy natural world. We *define* them: "A circle is a plane figure bounded by one line such that all straight lines drawn from a certain point within it to the boundary are equal." This definition *creates* the object of study.
      *   **Definitions as Foundational Acts:** These initial definitions aren't descriptions of pre-existing things; they are *stipulations* that *bring the precise object into being* for the purposes of reasoning. "Settling the significations" is the absolute starting point.
      *   **Certainty through Construction:** Because the objects are *defined into existence* with perfect precision, and subsequent reasoning consists solely in logically manipulating these defined concepts according to the rules of signification (like a calculation or "reckoning"), the conclusions derived are necessarily certain. The entire system is self-contained and based on human-imposed definitions and logical rules. There's no messy, uncertain empirical observation involved.
  4.  **Contrast with Other Sciences:**
      *   **Natural Philosophy (Science):** Tries to name and reason about objects in the external world (e.g., "motion," "light," "stone"). These objects are *not* perfectly defined by us; they are given through fallible senses and have inherent complexity/ambiguity. Definitions here are approximate descriptions, not generative stipulations. Hence, conclusions are probabilistic and uncertain.
      *   **Politics/Morals:** Deals with complex human passions, desires, and conventions. Definitions (e.g., "justice," "sovereignty") are even more contested and ambiguous, leading to endless dispute. While Hobbes aimed for rigor in *Leviathan*, he knew this realm lacked geometry's absolute certainty precisely because its foundational definitions weren't pure constructions but interpretations of human nature and agreement.

  **Why Definitions Do the Epistemic Work (and the Deeper Point):**

  *   **Definitions as Such:** Yes, the careful, initial stipulation of signification is *essential*. It creates the precise linguistic tokens for the "reckoning."
  *   **The Deeper Source of Certainty (Construction):** However, the *reason* definitions can provide such certainty *only* in geometry is the **constructive nature of geometric objects**. This is the crucial point. The definitions aren't just labeling pre-existing, fuzzy things; they are *generative*. They create the perfectly defined, ideal object *ex nihilo* for the purpose of reasoning. The certainty flows from this act of creation and the subsequent logical manipulation of these self-consistent mental constructs. The definitions *are* the objects in the realm of reasoning.

  **Hobbes's Stubbornness in the Wallis Affair: A Principled (if Flawed) Stand?**

  This is where Hobbes's philosophy becomes tragicomic. His unwavering belief in his circle-squaring wasn't *just* pig-headedness (though that played a role); it flowed logically, within his own system, from his theory of reasoning and demonstration:

  1.  **"Reckoning" with Names:** For Hobbes, reasoning *is* computation – adding and subtracting names according to logical rules based on their definitions. A valid demonstration is a correct sequence of name manipulations.
  2.  **The Internalist Perspective:** If Hobbes believed he had:
      *   Started with clear, correct definitions (of point, line, circle, motion, etc.).
      *   Applied only valid logical operations ("reckoning") step-by-step.
      *   Arrived at the conclusion that a square equal to a given circle could be constructed...
      ...then, *within his own system*, the demonstration *was* valid and certain. The conclusion *must* be true because the reckoning was correct based on the definitions.
  3.  **Rejecting External Critique:** Wallis's critiques, relying on:
      *   **Advanced Algebra/Calculus:** Hobbes dismissed algebra as a "scab of symbols," mere manipulation without grounding in clear definitions of motion and magnitude as he understood them (synthetic geometry). It wasn't "reckoning" with the *right kind* of defined objects.
      *   **Proofs of Impossibility:** These relied on concepts (like π's transcendence, proven later by Lindemann) or methods (algebraic limits) that Hobbes either didn't accept as foundational or didn't understand. From his perspective, they weren't grounded in the primitive definitions of geometry-as-construction.
      *   **Pointing out Specific Errors:** Hobbes likely interpreted these as Wallis either misreading his definitions, misrepresenting his steps, or failing to grasp the logical sequence. He might see Wallis as "entangled in words," clinging to flawed significations (like algebraic symbols) instead of pure geometric construction.
  4.  **The Core Belief:** Hobbes was convinced he had built his demonstration correctly from the ground up using the *only* reliable method: stipulative definitions of constructed objects followed by logical reckoning. To admit error would be to admit a fundamental flaw in his entire epistemological system – the system that guaranteed the certainty of geometry and, by extension, the rigor he sought to bring to politics. His stubbornness was a defense of his philosophical core against what he saw as irrelevant or misguided attacks using illegitimate tools.

  **Conclusion:**

  You're right. Hobbes isn't just saying "be careful with terms." He's making a profound, radical claim:

  *   **Geometry is certain** because its objects are **human constructs defined by stipulation**, and reasoning about them is **pure linguistic/logical computation ("reckoning")** based solely on those definitions.
  *   **Other sciences lack this certainty** because they grapple with externally given, ambiguous phenomena where definitions are descriptive, not generative.
  *   **His stubbornness with Wallis** stemmed directly from this theory. If his demonstration correctly manipulated names based on their stipulated geometric significations, it *had* to be true. Wallis's objections, using methods Hobbes deemed illegitimate or based on misunderstood significations, were therefore invalid *within Hobbes's own epistemological framework*. His error wasn't just a mathematical mistake; it was a misapplication of his *own* method (likely flawed definitions or faulty reckoning steps he couldn't perceive). His adherence to the *principle* of definitional grounding and logical reckoning, however, remained unshaken. It was the bedrock of his entire intellectual project, making compromise impossible.
