  I think the strongest approach is to propose a modified framework that retains QALY efficiency but builds in explicit safeguards against disability discrimination. This means keeping the $150k/QALY threshold as one factor among several, not the sole decider. The modifications should include: mandatory equity assessments for drugs treating rare/severe conditions, formal severity-of-illness adjustments, and structured deliberation when QALY scores might misrepresent value for disabled patients.

