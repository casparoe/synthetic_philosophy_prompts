  Noticing the user's meta-awareness - they sense the prisoner's dilemma structure but can't articulate it. The mutual defection outcome (both send demands) is feud; mutual cooperation (neither sends) preserves bargaining space; but the dominant strategy tempts toward defection. Except here the "defection" has delayed costs. 

  Practical angles: 
