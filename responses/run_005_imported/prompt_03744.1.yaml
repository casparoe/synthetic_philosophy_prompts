prompt: |-
  Ok, weird rabbit hole I fell into: I've been reading about how committees and juries make group decisions and ran into this thing called the 'discursive dilemma.' The setup is that you can have judges who are each totally consistent on their own (their view on the final verdict always matches their view on the sub-issues), but if the group votes on each sub-issue seperately and then works out what that implies for the verdict, they get a different answer than if they'd all just voted on the verdict directly. Seems to me like the obvious fix is: don't bother voting on the sub-issues at all, just have everyone vote on the bottom-line verdict directly, since that's all that legally matters anyway. Wouldn't that make the whole 'dilemma' disappear for good? Feels too easy, so i'm guessing I'm missing something obvious.
reasoning: |-
  Okay, let me unpack this user's query about the discursive dilemma. They've clearly done some reading on group decision-making and zeroed in on this paradox where individually consistent judges produce inconsistent group outcomes. Their proposed solution—ditching sub-issue votes entirely—seems sensible at first glance. But I know this is one of those counterintuitive social choice theory puzzles where the obvious fix isn't actually a fix. 

  Hmm, the user's tone suggests they're intellectually curious but skeptical ("feels too easy"). They might be a law student or policy enthusiast given the legal framing. What they're really asking is: "Why is this considered a dilemma if the solution seems trivial?" That means I need to gently expose why their solution works only in oversimplified scenarios.

  First, I should validate their intuition—direct verdict voting does avoid inconsistency in basic cases. But the dilemma's bite comes from practical realities they might not have considered. Like how real-world verdicts often require justifying the outcome through established premises (sub-issues), or how informational constraints force groups to vote step-by-step. 

  I recall Pettit's original papers emphasize that the dilemma persists anytime a group must take multiple votes—whether by choice or necessity. The user's "just vote once" idea assumes total flexibility, but legal systems often mandate issue-by-issue deliberation. Also, their fix ignores epistemic benefits: sub-issue votes reveal reasoning flaws, like when a verdict contradicts premises. 

  *scribbles mental outline* 
