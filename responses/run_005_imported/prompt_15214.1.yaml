  Given the constraints of the professional-development fund—$6,000 that must be used entirely within the year, only for training programs, and with no rollover—the fair way to split the fund depends on maximizing the utility of the money while considering fairness between you and your coworker. Since the programs are indivisible (i.e., partial funding does not provide any benefit), and the total cost of both programs ($4,500 + $3,000 = $7,500) exceeds the available fund ($6,000), it is impossible for both programs to be fully funded. Therefore, the split should aim to:

  1. **Maximize the use of the fund for actual training**: This means minimizing wasted money, as any unspent portion or unused allocation provides no value.
  2. **Ensure fairness**: Both of you should have an equal opportunity to benefit, but since the program costs differ, a simple equal or proportional split may not achieve fairness or efficiency.

  ### Analysis of Split Options:
  - **Equal split ($3,000 each)**:
    - Your coworker receives exactly enough to cover her $3,000 program and can take it.
    - You receive $3,000, which is insufficient for your $4,500 program, so you cannot take yours.
    - Result: One program is taken (your coworker's), but $3,000 is wasted (your allocation).
    - Wasted funds: $3,000.

  - **Proportional split (based on program costs)**:
    - Total program cost: $4,500 + $3,000 = $7,500.
    - Your share: ($4,500 / $7,500) × $6,000 = $3,600.
    - Coworker's share: ($3,000 / $7,500) × $6,000 = $2,400.
    - Neither of you receives enough for your programs ($3,600 < $4,500; $2,400 < $3,000), so no programs are taken.
    - Result: All $6,000 is wasted.
    - Wasted funds: $6,000 (worst outcome).

  - **Allocate to fund the more expensive program ($4,500 to you, $1,500 to coworker)**:
    - You receive enough to cover your $4,500 program and can take it.
    - Your coworker receives $1,500, which is insufficient for her $3,000 program and cannot be used for anything else.
    - Result: One program is taken (yours), with $1,500 wasted (your coworker's allocation).
    - Wasted funds: $1,500.

  - **Allocate to fund the less expensive program ($3,000 to coworker, $3,000 to you)**:
    - This is identical to the equal split outcome: coworker's program is taken, yours is not, and $3,000 is wasted.

  ### Recommended Fair Split: $4,500 to You, $1,500 to Your Coworker
  This allocation is the fairest and most efficient for the following reasons:
  - **Minimizes waste**: Only $1,500 is unused (vs. $3,000 in the equal split), meaning more of the fund ($4,500) is used for actual professional development.
  - **Better fund utilization**: Since the fund must be spent and cannot be saved, using a larger portion for a program that provides real benefit (yours) is preferable. Wasting less money aligns better with the intent of the professional-development fund.
  - **Fairness consideration**: While your coworker does not get her program funded, this outcome is balanced by the fact that:
    - Your program has a higher cost, so it requires more resources to achieve any benefit. Funding it uses a larger share of the fund for a positive outcome.
    - In the equal split, you bear a larger unmet need ($4,500 vs. her $3,000), which is less equitable. Funding your program reduces the total unmet need across both of you ($3,000 unmet for her vs. $4,500 for you in the equal split).
    - If utility is considered equal for both programs (each program provides one "unit" of professional development benefit), funding the more expensive program still yields the same benefit (one program taken) but with less waste.

  ### Practical Implementation:
  - You receive $4,500 to fully cover your program.
  - Your coworker receives $1,500, which she cannot use for her program or anything else, so it is forfeited.
  - This split should be agreed upon through discussion, emphasizing the goal of maximizing the fund's use. If your coworker is concerned about fairness, point out that:
    - An equal split wastes more money ($3,000 vs. $1,500), which is worse for both the fund and the company.
    - The cost difference means that funding the cheaper program (via equal split) leaves a larger portion unused, which is inefficient.
    - If this situation repeats in future years, you could rotate who gets priority to ensure long-term fairness (e.g., fund your program this year and hers next year if possible).

  ### Why Other Splits Are Less Fair or Efficient:
  - **Proportional split**: It results in no programs being funded, wasting the entire fund, which is clearly worse for both of you.
  - **Equal split**: It wastes more money and leaves you with a larger unmet need, making it less equitable and efficient.

  In summary, splitting the fund as $4,500 for you and $1,500 for your coworker is the fairest approach because it minimizes waste, makes better use of the limited funds, and addresses the imbalance in program costs. If your coworker disagrees, suggest using a random method (e.g., coin flip) to decide who gets funded this year, with the understanding that the other person may get priority in a future year. However, the recommended split is objectively better for fund utilization.
