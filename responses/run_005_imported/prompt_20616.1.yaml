answer: |-
  The air in the Treaty Hall of Velos Station hung thick with exhaustion and ozone. For three days, the delegations from the fractured planet of Aethel – the Korai Sovereignty and the Helicon Compact – had argued over mineral rights in the irradiated Belt. Now, they were stuck on a single syllable.

  Ambassador Vanya Thorne of the Helicon Compact slammed a palm on the polished obsidian table. "We will *not* ratify a document that uses the term 'Kortai' to refer to our Korai allies! It is a relic of oppression, a *slur*!"

  Opposite her, Ambassador Jor Kael of the Korai delegation remained unnervingly calm. "Ambassador Thorne," he stated, his voice low and resonant, "the term 'Kortai' simply means 'people of the stone lands' in ancient Aethelean. It is geographically descriptive. Your sensitivity is misplaced, an attempt to rewrite history to fit a narrative of perpetual victimhood."

  Elara Vance, the chief interpreter seated slightly apart at a smaller console, felt the familiar prickle of linguistic vertigo. She understood both positions intimately, not just the words, but the tectonic plates of history grinding beneath them. The word wasn't the problem; it was the echo chamber it lived in.

  *Kortai.* Phonetically identical when spoken by both sides. But when a Helicon speaker uttered it, even neutrally, it carried the sonic residue of generations of forced labor in the Helicon-controlled quarries, of dismissive colonial administrators, of propaganda depicting the Korai as simple, earth-bound folk. For the Korai themselves, reclaiming 'Kortai' *was* an act of defiance – a neutral descriptor stripped of its imposed shame, used with pride among themselves. It was the *context*, the *speaker*, and the *listener's history* that imbued it with venom or valor.

  The negotiations stalled. Thorne refused to proceed with "Kortai" in the text. Kael refused to accept its removal, seeing it as capitulation to Helicon's historical revisionism. Legal advisors fumbled with synonyms – "Aethelan Korai," "Stone Land Denizens" – each rejected as either awkward, inaccurate, or carrying their own problematic baggage.

  Elara watched the frustration mount. She saw Kael's jaw tighten, not in anger, but in the weary recognition of a battle fought too many times. Thorne’s hand trembled slightly as she flipped through notes – the fear of legitimizing historical harm. The room vibrated with the unspoken weight of the word. It wasn't about the literal meaning; it was about the *conventional implicature* – the shared understanding among Helicon speakers that 'Kortai' *implied* inferiority, passivity, even when not explicitly stated. For the Korai, using it themselves canceled that implication, reclaiming the signifier. It was pure Anderson-and-Lepore vs. Hom playing out in real-time, with peace hanging in the balance.

  Finally, as the silence stretched into agonizing minutes, Elara did something unprecedented. She activated her console's direct feed to both delegation leaders' earpieces, bypassing the main channel.

  "Ambassador Thorne, Ambassador Kael," she whispered, her voice calm but urgent in their private auditory space. "I request a moment. Not as interpreter, but as a linguist observing an impasse."

  A flicker of surprise crossed both faces. Kael gave an almost imperceptible nod. Thorne frowned but didn't object.

  "The core issue," Elara continued swiftly, "isn't the word 'Kortai' itself, but the *pragmatic force* it carries depending on the speaker. For Helicon, it triggers historical trauma due to its consistent *use* in contexts of subjugation. Its offensiveness is conventional, baked into generations of usage by the dominant group. For the Korai, using it is an act of semantic reclamation, stripping that conventional force. Both perspectives are linguistically valid."

  She paused, seeing them listen intently. "Insisting on 'Kortai' in the treaty feels like endorsing its historical baggage to Helicon. Removing it feels like denying Korai agency and their reclamation to Korai. It's a pragmatic deadlock."

  "What alternative exists?" Kael's voice was tight in her earpiece.

  "Remove the contested signifier entirely," Elara proposed. "Use the endonym 'Korai' exclusively in the treaty. It is the term the Korai people overwhelmingly prefer for external identification. Helicon avoids the term loaded with historical implicature. Korai retains self-determination in nomenclature."

  Thorne’s voice crackled, skeptical. "But 'Korai' is their specific ethnic designation. The Belt territory is historically called the 'Kortai' lands. Isn't removing it inaccurate?"

  "Ambassador," Elara countered gently, "the treaty defines the parties and the territory. We can define the 'Korai-administered territories of the Central Belt' explicitly in Article One. Accuracy is preserved. The *symbolic* landmine of 'Kortai' is avoided. It acknowledges the harm its use *by outsiders* causes, while respecting Korai self-identification."

  Silence filled the private channel. Elara held her breath. She had overstepped massively.

  In the main room, Kael studied Thorne. Thorne met his gaze. The weight of the stalled talks, the exhaustion, the sheer pettiness of the deadlock over a word whose meaning was secondary to its *use*, hung between them.

  Kael spoke first, aloud this time, his voice carrying to the room. "The Korai Sovereignty... would accept the exclusive use of 'Korai' in the treaty text, provided the territorial definition in Article One is precise and acknowledges historical continuity."

  Thorne took a deep breath, the rigidity in her shoulders easing slightly. "The Helicon Compact... could accept that formulation. The critical point is the avoidance of terminology with established... harmful connotations."

  The tension didn't vanish, but the logjam broke. Legal aides scrambled to draft the new clause. Elara sank back, her hands trembling slightly. She hadn't solved the deep-seated pain or the history. But she had navigated the treacherous waters of linguistic pragmatics – recognizing that a word's poison isn't always in its dictionary definition, but in the silent agreements of its use, the ghosts it conjures, and the power dynamics it reflects. Peace, sometimes, isn't about finding the perfect word, but about knowing which ones to set aside. The negotiations, fueled by mineral necessity rather than mutual trust, lurched forward again, one carefully defined term at a time.
