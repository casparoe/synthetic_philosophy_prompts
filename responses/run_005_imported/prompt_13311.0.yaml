answer: |-
  This is an excellent and ambitious argument that cuts to the heart of a persistent problem in Newton scholarship. Your core paragraph is compelling and well-constructed. Here’s a breakdown addressing your three specific requests:

  1.  **Textual Evidence for Tight Connection:**
      *   **Strong Support:** Your core claim – that Newton's emphasis on **dominion/sovereignty** (*dominium*) as the defining characteristic of true divinity bridges his theology and physics – is arguably the *strongest* textual link available. The parallels you draw are perceptive and defensible:
          *   **Theology:** The Son's divinity derives *not* from shared substance (homoousios) but from the Father's *will* and bestowal of dominion/authority (e.g., the "Mede" interpretation of Daniel, his reading of Philippians 2:5-11).
          *   **General Scholium:** "Dominion constitutes a God" (*Dominus Deus*). Eternity and infinity are necessary but insufficient; they belong to the abstract framework of space/time (God's "sensorium"), while true divinity requires active lordship ("Lord over all," "Pantokrator").
          *   **Leibniz-Clarke:** The defense of God's absolute freedom and will against the Principle of Sufficient Reason (PSR) – God chooses the world's structure (uniform space, specific laws, amount of matter, initial conditions) *not* because it's uniquely rational (as Leibniz argued), but because it pleases His sovereign will. This mirrors the Father's absolute will in appointing the Son.
      *   **"Voluntarism" as the Bridge:** Framing the connection via "voluntarism" (divine will as primary cause, not bound by necessity) is astute. Newton’s God in nature *acts* – creating, sustaining (via active principles/gravity?), possibly intervening (e.g., to stabilize orbits). This active sovereignty parallels the Father's sovereign will in appointing and empowering the Son.
      *   **Caveat:** While the *structural parallel* is strong, explicit textual confession by Newton linking his Christology *directly* to his physics is absent (understandably, given the secrecy). The connection is inferential, based on shared conceptual architecture. The strongest evidence lies in the consistent deployment of *dominion* and *voluntary subordination/creation* as the keys to understanding divine action in both realms. You aren't forcing them together; you're identifying a deep-seated conceptual pattern manifesting in distinct domains. The independent explanations (e.g., anti-trinitarian Biblical criticism for theology, empirical/mechanical concerns for physics) are valid *proximate* causes, but your argument posits a deeper, unifying *metaphysical* commitment driving both.

  2.  **Strongest Objection to Integration:**
      *   **The "Compartmentalization" or "Methodological Separation" Objection:** This is likely the strongest and most common counter-argument you'll face. Proponents would argue:
          *   Newton rigorously separated his *methodologies*. Natural philosophy used reason, mathematics, and experiment to investigate the *phenomena* of nature and their efficient causes. Theology relied on revelation (properly interpreted) to understand God's nature and will. Mixing them was precisely the scholastic error he sought to avoid.
          *   The arguments in the *Principia* and *Opticks* (including the Scholium) stand *on their own scientific and philosophical merits*. The argument against a necessary, eternal world governed solely by PSR *can* be made (and was made by others) without recourse to specific Christological doctrines. Clarke's arguments against Leibniz, while guided by Newton, were framed in philosophical terms accessible to deists or even atheists.
          *   Newton's theological heresy was a deeply personal, dangerous secret. His public natural philosophy needed to be defensible and persuasive within the broader intellectual (and often theologically orthodox) community of natural philosophers. The physics had to work independently of his private heterodoxy.
          *   **Why it's strong:** It aligns with Newton's own rhetoric about avoiding hypotheses (especially metaphysical/theological ones) in science. It accounts for the historical reality that his physics *was* understood and developed for centuries without knowledge of his theology. It suggests the connection you identify, while intellectually interesting, is more about Newton's *personal* psychology or a shared cultural background concept (sovereignty) than a necessary logical or doctrinal link *within* the physics itself.

  3.  **Historical/Textual Accuracy:**
      *   **Overall:** Your details are impressively accurate. You've clearly done your homework.
      *   **Specifics:**
          *   **Christology:** "Close enough to Arianism" is the standard and correct cautious phrasing. His position was a radical subordinationism, often termed "Arian" for convenience, though scholars debate precise labels (Socinian influences, etc.). The description of Christ as "created and subordinate... supremely exalted... divine status depended on the Father's will" is precise.
          *   **Concealment & Ordination:** Correct. The Lucasian Chair provided the exemption he needed; avoiding ordination was key to keeping his fellowship/position.
          *   **Proof-texts:** Spot on. He argued the *Comma Johanneum* (1 John 5:7) and the "who was manifest in the flesh" clause in 1 Timothy 3:16 were corruptions. His major theological treatise was "Two Notable Corruptions."
          *   **Locke:** Correct. Their correspondence on theology is significant.
          *   **General Scholium:** Your summary is excellent: "eternity and infinity alone cannot qualify anything as God... only lordship over servants does." This captures the essence of "Eternus est & Infinitus, Omnipotens & Omnisciens; id est durat ab aeterno in aeternum, & adest ab infinito in infinitum... Hic omnia regit, non ut Anima mundi, sed ut universorum Dominus" and the crucial "Et hac voce Deus significatur... dominatio... Dominus Deus παντοκράτωρ est" (Dominion constitutes a God... The Lord God is Pantokrator).
          *   **Leibniz-Clarke:** Correct that Newton guided Clarke (Clarke explicitly stated he consulted Newton) and that the core defense was God's absolute freedom of will against PSR, specifically regarding the arbitrariness of the world's configuration.
          *   **Manuscript History:** Correct regarding the 1936 Sotheby's sale, Yahuda (theology), and Keynes (alchemy).
      *   **Minor Nuance:** While Newton *guided* Clarke intensely, Clarke was the public author. It's precise to say "the Leibniz-Clarke correspondence's defense" as you did, but be prepared for someone to quibble that it's *Clarke's* text. Your phrasing is standard and acceptable, but knowing the nuance is good.
      *   **No Embarrassing Slips Detected:** Your handling of the specific texts (Biblical corruptions, General Scholium argument) is accurate and reflects current scholarly understanding.

  **Suggestions for Development:**

  1.  **Preempt the Compartmentalization Objection:** Address it head-on. Argue that while Newton *methodologically* separated the disciplines for investigative purposes, his *metaphysical framework* underlying both was deeply unified by this concept of divine sovereignty. The separation was tactical (safety, persuasion), not fundamental. The *Principia*'s conclusion (Scholium) *demands* a theological statement about God's nature – this is where the framework surfaces explicitly. The physics *implies* a certain kind of God (active sovereign), which aligns perfectly with his theology.
  2.  **Deepen "Voluntarism":** Explicitly link the Father's *voluntary* creation/appointment of the Son to God's *voluntary* creation of the specific world-system in the Leibniz-Clarke debate. Emphasize "will" and "choice" as the active principle in both.
  3.  **Active Principles & Providence:** Briefly touch on how Newton's concept of "active principles" (gravity, fermentation, cohesion – forces needing constant divine sustenance/action?) and his belief in necessary providential intervention (e.g., to maintain planetary stability) further reflect this theology of an actively governing God whose will is paramount, contrasting with Leibniz's pre-established harmony or a purely necessitarian Nature/Fate. This reinforces the dominion theme within the physics itself.
  4.  **"Sensorium" Connection:** The *sensorium* metaphor in the Scholium, while controversial, fits this framework – God's dominion extends through the absolute, eternal, infinite space/time which constitutes His "sensorium," the medium of His perception and action. This dominion is spatially universal.
  5.  **Contextualize Sovereignty:** Briefly note how this emphasis on sovereignty resonated with broader political theology (resistance to absolutism? God as true sovereign) and natural philosophy (rejecting Cartesian plenism/vortices necessitated by God's perfection?).

  **Conclusion:** Your core argument is powerful, well-supported textually (inferentially, but strongly), and addresses a genuine flaw in the historiography. The strongest objection (compartmentalization) is significant but can be countered by emphasizing the *metaphysical* unity beneath methodological separation. Your historical details are accurate. This has the potential to be a significant contribution to the reading group discussion and beyond. Refine it by directly confronting the compartmentalization argument and fleshing out the "voluntarism" bridge even more explicitly. Good luck!
