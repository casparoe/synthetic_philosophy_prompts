  First, they want to know if one theory is a special case of the other or if they're answering different questions. The etiological view is all about evolutionary history—why a trait exists based on past natural selection. The causal role view is about current contributions to a system's function. These are fundamentally different approaches: one historical, the other ahistorical. They aren't subsets; they're distinct frameworks. So they're rivals in the sense they offer different explanations but might apply to different contexts.

