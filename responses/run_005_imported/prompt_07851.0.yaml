answer: |-
  Your intuition is astute: supervaluationism's treatment of disjunction exposes a fundamental tension within its own framework that is arguably *just as damaging* to our ordinary concept of truth as the failure of bivalence it seeks to avoid. While it technically preserves the *law* of excluded middle (LEM), it does so by severing the *meaning* of disjunction from its classical and intuitive connection to truth. Here's a sharper articulation of this objection:

  1.  **The Core Intuition of Disjunction and Truth:** In ordinary language and classical logic, the truth of a disjunction `P ∨ Q` is understood *epistemically* and *metaphysically* as being *grounded in* the truth of at least one of its disjuncts. If I say "It will rain tomorrow or it will be sunny tomorrow," and this statement is true, we expect that *when tomorrow comes*, one of those specific states of affairs will obtain, making one disjunct true. Crucially, the truth of the disjunction today is *parasitic* on the potential truth of its components. We accept that *we might not know* which disjunct is true, but we believe *one of them must be* true for the disjunction to be true. This is codified in the classical rule of ∨-Elimination (Disjunction Elimination): If `P ∨ Q` is true, and `P` entails `R`, and `Q` entails `R`, then `R` must be true. This rule fundamentally relies on one disjunct *being* true.

  2.  **Supervaluationism's Disjunctive Detachment:** Supervaluationism explicitly breaks this link. It declares `P ∨ ~P` true *solely* because every precisification (admissible future history) makes either `P` true or `~P` true. However, crucially, *no single precisification makes `P` determinately true*, and *no single precisification makes `~P` determinately true*. The truth of the disjunction resides *only* at the level of the supervaluation over *all* histories, not in any property of the actual, single future history that will unfold, nor in the truth of either disjunct considered individually *today*.

  3.  **The Cost: Truth Without Truthmakers (for the Disjuncts):** This is where the cost becomes severe:
      *   **Metaphysical Cost:** The disjunction `P ∨ ~P` is true today, yet there is *nothing* in the actual, present state of the world, nor in the single future that will become actual, that *makes* `P` true today, nor that *makes* `~P` true today. The truth of the disjunction floats free, grounded only in a *collection* of possibilities, none of which are currently actual or determinate. This violates the intuition that truth should be anchored, however indirectly, in how things *are* or *will determinately be*.
      *   **Semantic/Logical Cost:** The ∨-Elimination rule effectively *fails* for future contingents under supervaluationism. Consider:
          *   `P ∨ ~P` is supertrue (True).
          *   Assume `P`. On histories where `P` is true, `P` is true. But `P` is *not* supertrue (it's indeterminate). Crucially, *from the assumption `P`*, we cannot validly conclude anything that depends on `P` being *determinately* true, because our assumption only holds on *some* histories. The conclusion must hold on *all* histories where the premise holds, but since `P` isn't true on all histories where we assume it (the assumption restricts us to `P`-histories), standard ∨-Elimination doesn't transfer supertruth properties reliably. The intuitive inferential power of disjunction is crippled.
      *   **Conceptual Cost to Truth:** Our ordinary concept of truth involves a statement "corresponding" to reality or being "made true" by some state of affairs. Supervaluationism forces us to accept a category of statements (`P ∨ ~P` for future contingents) that are "true" *despite the fact that neither of the ways reality could make them true (i.e., `P` being true or `~P` being true) is currently realized, determinately obtainable, or truth-apt today*. The disjunction is true, but *how* it is true remains fundamentally obscure and disconnected from the truth of its parts. This feels like a *different kind* of truth, not the robust correspondence we typically associate with the word.

  4.  **Restating the Puzzle, Not Resolving It:** Aristotle's puzzle arises from the tension between the openness of the future (suggesting no present truth value for `P`) and the intuitive force of LEM (suggesting `P ∨ ~P` must be true now). Supervaluationism "solves" this by:
      *   Accepting the openness (indeterminacy of `P` and `~P`).
      *   Redefining "truth" (`supertruth`) in a way that allows `P ∨ ~P` to be true *without* requiring either disjunct to be true.
      *   **The Cost:** This redefinition creates a *new* puzzle that mirrors the original one: How can `P ∨ ~P` genuinely *be* true now if *neither* way it could be true (`P` being true or `~P` being true) is a present feature of reality or a determinate future outcome? The original tension between openness and LEM is replaced by a tension between the supertruth of the disjunction and the radical indeterminacy of its components. The core unease – that truth seems disconnected from determinate reality – persists; it's just shifted from the simple failure of bivalence (`P` isn't T or F) to the paradoxical truth-status of the disjunction (`P ∨ ~P` *is* T, yet `P` isn't T, `~P` isn't T, and neither is F).

  **Conclusion:** Supervaluationism's treatment of disjunction isn't a minor technical quirk; it's a fundamental concession that its concept of "supertruth" diverges significantly from the ordinary, disjunction-grounding concept of truth. The theory avoids the *syntactic* failure of Excluded Middle by incurring a *semantic* cost that is arguably *more* jarring: it forces us to accept "true" disjunctions where *no truthmaker exists for either disjunct*. While it provides a consistent formal model for handling indeterminacy, it resolves Aristotle's puzzle only by relocating the core conceptual discomfort – the disconnect between present truth and future reality – from the simple bivalence of atomic propositions to the perplexing truth-status of their disjunctions. You are right to feel that the disjunctive "solution" presents a cost at least as serious as the problem it solves, effectively restating the original dilemma in a more sophisticated, but no less troubling, vocabulary. The clean logic comes at the price of a deeply counterintuitive metaphysics of truth.
