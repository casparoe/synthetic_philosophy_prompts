prompt: |-
  I'm taping a podcast episode next week with a guest who's spent her career defending Strawson's line that reactive attitudes -- resentment, gratitude, indignation -- are the bedrock of moral responsibility, not something that needs backing from a metaphysical verdict on free will vs determinism. Her favorite dodge when pushed is to say that asking whether the reactive attitudes are themselves justified isn't even a question you can ask from outside the practice. Can you draft me 7-8 interview questions that don't just let her restate Strawson? I want at least one that forces her to engage the Watson/Wolf complaint that naturalism describes our practices but doesnt vindicate them, one on whether the "objective attitude" toward psychopaths and "he's not himself today" cases is a sharp binary or something that creeps outward as we learn more neuroscience, and one on how her view handles Pereboom-style manipulation cases, where the reactive attitudes still fire even though we don't think the agent's responsible. Throw in a follow-up for each keyed to the reply she'll probably give.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a guest who defends Strawson's view on reactive attitudes as the foundation of moral responsibility. The guest avoids justifying these attitudes from outside the practice. The user wants challenging questions that push beyond restating Strawson, specifically addressing Watson/Wolf, the objective attitude continuum, and Pereboom's manipulation cases, each with follow-ups.

  First, I need to recall Strawson's core argument. He says reactive attitudes like resentment are natural responses within our interpersonal practices, not needing metaphysical justification. The guest's defense is that asking for external justification is impossible. The user wants to challenge this without letting her retreat to Strawson's position.

  The user mentions three key areas: Watson/Wolf's critique, the nature of the objective attitude, and Pereboom's manipulation cases. For each, I should craft a primary question and a follow-up anticipating her responses.

  For Watson/Wolf: They argue that describing practices isn't enough; we need normative vindication. The question needs to push why internal description suffices. Her likely response is that justification is only internal. The follow-up should challenge if this avoids the normative question entirely.

  For the objective attitude: Strawson presents it as a binary shift, but neuroscience might show a spectrum. The question should ask if science blurs the lines. She might say neuroscience doesn't affect the participant stance. The follow-up should press how empirical findings impact the practice's structure.

  For Pereboom: Manipulation cases trigger reactive attitudes even when responsibility is undermined. How does Strawson account for this? She might say intuitions are unreliable here. The follow-up should question if this admission weakens the reactive attitudes' authority.

  I should ensure each question forces engagement rather than deflection. The user wants to avoid letting her dismiss external questions. Also, include other angles like cultural variations and practical implications. Need 7-8 questions total, so adding a couple more on related aspects.

  Check if each question has a sharp follow-up. The user emphasized anticipating replies. For example, on Pereboom, if she dismisses intuitions, the follow-up challenges the normative weight of attitudes. Also, consider how cultural differences might affect the universality of reactive attitudes. Her response might appeal to core human practices, but the follow-up can question if that's sufficient against relativism.

  Finally, ensure questions are concise and phrased to prevent easy retreats to Strawson's standard defenses. The goal is to elicit deeper engagement, potentially revealing tensions in her position.
answer: |-
  Here are 8 interview questions designed to push beyond Strawsonian restatement, targeting the key areas you specified, each with a sharp follow-up anticipating her probable replies:

  1.  **Target: Watson/Wolf Vindication Challenge**
      *   **Question:** "Strawson famously argues we don't *need* a metaphysical foundation for responsibility because the reactive attitudes *are* the practice. But critics like Gary Watson and Susan Wolf argue this merely *describes* our psychology; it doesn't *vindicate* the practice as normatively correct. Isn't Strawson confusing 'this is how we *do* hold responsible' with 'this is how we *should* or *ought* to hold responsible'? Why should the mere existence of these attitudes grant them normative authority?"
      *   **Anticipated Reply:** She'll likely say the demand for "vindication" from outside the practice is incoherent or misplaced; justification is internal to the practice itself.
      *   **Follow-Up:** "If justification is *only* internal and the practice is its own validation, doesn't that render the practice immune to *any* external normative critique, even if, hypothetically, we discovered it systematically caused immense suffering? Doesn't this risk a form of moral relativism *within* the practice, where any internal shift (e.g., widespread acceptance of scapegoating) becomes automatically justified?"

  2.  **Target: Objective Attitude Continuum & Neuroscience**
      *   **Question:** "Strawson presents the 'objective attitude' (suspending reactive attitudes) as a fairly sharp shift – applicable to the 'he's not himself' psychotic or the psychopath. But as neuroscience reveals more about the biological underpinnings of *all* behavior, showing degrees of impairment, compulsivity, or diminished capacity even in 'normal' individuals, doesn't this threaten the idea of a neat binary? Couldn't the objective attitude 'creep' outward, forcing us to see *all* responsibility as on a spectrum of mitigation, potentially undermining the reactive attitudes' core domain?"
      *   **Anticipated Reply:** She'll likely argue neuroscience describes mechanisms, but the *participant stance* and the *significance* we attach to reasons-responsiveness is a distinct, practice-embedded level that neuroscience doesn't directly touch. The practice defines the thresholds.
      *   **Follow-Up:** "But if the practice's own thresholds for suspending reactive attitudes (e.g., recognizing psychosis) are *themselves* responsive to scientific discoveries about brain function (which they historically have been), doesn't this mean neuroscience *is* actively reshaping the boundaries of the practice from within? How can the practice be autonomous if its core distinctions (who is an appropriate target) are constantly being revised by external facts?"

  3.  **Target: Pereboom-Style Manipulation Cases**
      *   **Question:** "Pereboom's 'Four Case Argument' uses manipulation scenarios (like Professor Plum, coerced by neuroscientists) to show our reactive attitudes can be triggered even when we *know* the agent lacks ultimate responsibility. We might *feel* resentment towards Plum. How does Strawson's view, which grounds responsibility *in* the appropriateness of these attitudes, handle cases where the attitudes fire but we judge them *inappropriate* upon reflection? Doesn't this show the attitudes aren't a reliable indicator of true responsibility?"
      *   **Anticipated Reply:** She'll likely argue that upon *full* description of the manipulation, within the practice, we *do* (or should) suspend reactive attitudes. The initial reaction is based on incomplete information; the practice corrects itself.
      *   **Follow-Up:** "But isn't this correction *itself* relying on a judgment *external* to the mere occurrence of the reactive attitude? We're using a *metaphysical* or *causal* principle (e.g., 'he was manipulated') to *override* the natural reactive response. Doesn't this reveal that the practice inherently contains resources for *criticizing* the reactive attitudes based on considerations Strawson wanted to avoid, like ultimate control?"

  4.  **Target: Universality vs. Cultural Variation**
      *   **Question:** "Strawson presents the reactive attitudes as a near-universal feature of human social life. But anthropological and historical work shows significant variation in *how* resentment, gratitude, etc., are expressed, targeted, and deemed appropriate. Some cultures emphasize collective responsibility, others have very different concepts of excuse. If the *content* and *application* of the reactive attitudes are culturally contingent, how does this impact their claim to be the 'bedrock'? Doesn't this contingency suggest they *need* some deeper justification beyond 'this is our practice'?"
      *   **Anticipated Reply:** She'll likely focus on a core, shared *structure* of holding accountable via emotional responses, arguing variations are surface-level expressions of a universal human need.
      *   **Follow-Up:** "If the core structure is universal but its specific normative judgments vary widely, doesn't that undermine the idea that the practice *itself* provides sufficient normative justification? Doesn't the variation force us to ask *which* version of the practice, or *which* specific reactive norm, is the justified one, pushing us back towards needing external criteria?"

  5.  **Target: The "Not a Question" Dodge - Reframed**
      *   **Question:** "You often suggest asking if the reactive attitudes are 'justified' from outside the practice isn't a coherent question. But let's reframe it *within* the practice. Don't we *constantly* engage in internal critique of our own reactive attitudes? We ask 'Was my resentment fair?', 'Was that gratitude misplaced?', 'Is their indignation justified?'. What are the *standards* we use for *this* internal critique, if not standards that implicitly reach beyond the mere fact of having the feeling? Doesn't *this* internal justificatory practice show that 'because it's our reaction' is never the final word, even internally?"
      *   **Anticipated Reply:** She'll likely say the standards for internal critique are also part of the web of the practice – reasons, expectations, shared understandings of excuse and justification.
      *   **Follow-Up:** "But when we debate *those* standards themselves (e.g., 'Is "he couldn't help it" *always* an excuse?', 'What *counts* as a good reason?'), aren't we implicitly appealing to something deeper – perhaps about human capacities, harm, or fairness – that isn't *just* defined by the current state of the practice? Doesn't the practice contain an inherent drive towards self-transcendence or grounding?"

  6.  **Target: Practical Implications & Stasis**
      *   **Question:** "If Strawson is right that our responsibility practices are fundamentally grounded in unchanging reactive attitudes, and immune to external metaphysical challenges like determinism, does this imply that debates about reforming criminal justice, blame culture, or our notions of excuse are ultimately futile? Are we essentially stuck with the emotional repertoire we have, making significant moral progress in *how* we hold responsible impossible?"
      *   **Anticipated Reply:** She'll likely argue the practice *can* evolve internally through reflection, empathy, and social change, but this evolution is driven *from within* by the reactive attitudes themselves and related moral sentiments.
      *   **Follow-Up:** "But doesn't history show that major shifts (e.g., rejecting vengeance, emphasizing rehabilitation, recognizing new mental disorders) often involved arguments appealing *precisely* to ideas Strawson sidelines – like deeper conceptions of human dignity, autonomy, or the causes of behavior – that *challenged* the intuitive pull of traditional reactive responses? Doesn't progress often come from *resisting* the natural attitude?"

  7.  **Target: Psychopathy & the Limits of the Practice**
      *   **Question:** "Strawson uses psychopathy as a paradigm case for the objective attitude. But modern understandings show psychopathy isn't a simple 'on/off' switch; it's a spectrum disorder affecting empathy and foresight to varying degrees. Within the practice, how do we decide *where* on that spectrum reactive attitudes become inappropriate? If we rely solely on our natural emotional responses, won't we simply resent the psychopath who harms us, despite knowing they lack the capacity? How does the practice resolve this tension between the feeling and the knowledge?"
      *   **Anticipated Reply:** She'll likely say the practice incorporates knowledge of incapacity (gained from psychology/neuroscience) to modulate or suspend the reactive attitude, moving towards the objective stance.
      *   **Follow-Up:** "But doesn't this mean the *knowledge* derived from outside the participant stance (neuroscience, psychology) is *actively dictating* when the core reactive attitudes of the practice are deemed appropriate or inappropriate? Doesn't this make the 'bedrock' reactive attitude dependent on, and subordinate to, external causal explanations in precisely the cases that matter most?"

  8.  **Target: The Burden of Exculpation**
      *   **Question:** "Strawson shifts the burden: responsibility is the default within the practice; exculpation requires a specific 'excusing condition'. But isn't a hard determinist (or skeptic) arguing that the *universal* truth of causal determinism (or manipulation, etc.) *is* such an exculpating condition, applying to *everyone*? How does Strawson's framework prevent the skeptic from saying: 'Your practice is built on an illusion; the excusing condition you apply to the psychotic or manipulated agent *actually applies to all of us, all the time*'? Doesn't the framework just ignore the *scope* of the skeptic's challenge?"
      *   **Anticipated Reply:** She'll likely reiterate that the universal applicability of determinism is irrelevant *within* the practice, which operates with its own distinctions (reasons-responsiveness, etc.), and that taking the objective attitude universally is practically and humanly impossible.
      *   **Follow-Up:** "But if the skeptic is right about the universal excusing condition, doesn't the 'practical impossibility' of adopting the objective attitude universally just highlight that our practice is *pragmatically necessary but fundamentally false*? Doesn't Strawson's 'solution' boil down to saying 'We can't help but have these attitudes, even if they are ultimately unjustified' – which sounds remarkably like the skepticism he wanted to avoid?"

  **Key Strategies Embedded:**

  *   **Reframing External Challenges as Internal:** Questions 4, 5, and 7 force her to confront how external factors (culture, science, internal critique) *already operate within and shape* the practice itself.
  *   **Highlighting Tension/Contradiction within the Practice:** Questions 3 (Pereboom), 6 (Progress), and 8 (Skeptic's Scope) point to moments where the reactive attitudes seem to conflict with other elements *within* the practice or its own internal logic.
  *   **Pressing on Normative Authority:** Questions 1 (Watson/Wolf) and 4 (Culture) directly challenge the idea that "this is our practice" grants sufficient normative weight, demanding an account of *why* this practice deserves allegiance.
  *   **Forcing Engagement with Empirical Reality:** Questions 2 (Neuroscience Continuum) and 7 (Psychopathy Spectrum) use modern science to pressure the binary nature of Strawson's categories and the practice's ability to assimilate complex realities.
  *   **Anticipating Deflections:** Each follow-up is designed to cut off the standard Strawsonian retreat ("It's internal," "The practice adjusts," "The objective attitude is impossible universally") by showing how that reply either concedes ground to the critic, reveals a deeper problem, or relies on the very external factors Strawson dismisses.

  These questions should prevent a simple restatement of "Freedom and Resentment" and push her to defend the *robustness* and *self-sufficiency* of the Strawsonian framework against its most persistent and sophisticated critics. Good luck with the podcast!
