prompt: |-
  Okay so for my IB extended essay I'm writing about Henry Sidgwick (the Methods of Ethics guy our teacher mentioned for like five minutes when we did utilitarianism), and I went down a rabbit hole that's honestly way more interesting than anything in the actual unit. Turns out this dude, who's famous for being maybe the most careful, rigorous philosopher of the whole Victorian era, also co-founded the Society for Psychical Research and spent decades investigating mediums, telepathy, haunted houses, all of it, and by most accounts came up basically empty-handed (his wife Eleanor was even SPR president after him, so it clearly wasn't just some random midlife crisis thing). From what I've read, part of why he cared so much was a problem he talks about in Methods of Ethics called the "dualism of practical reason" — basically that he couldn't find a way to prove egoism (do what's best for you) and utilitarianism (do what's best for everyone) are both fully "rational" at the same time unless the universe has some deeper moral order to it, like an afterlife where things even out in the end. It kind of seems like the psychical research was his attempt to actually go look for real evidence of that instead of just assuming it.

  The thing I can't decide for my essay is whether this was actually a rational move on his part, and I keep flip flopping. Like on one hand, if your ethical system has this gap where it just doesn't fully work without some extra fact about the universe, then going and actually trying to find that fact empirically seems way more honest than what a lot of philosophers do, which is just wave their hands and assume God or whatever fills the hole. But on the other hand, he kept at this for like 20-30 years despite never really finding anything solid, which to me smells a lot like motivated reasoning, especially from a guy who was supposedly so skeptical and rigorous about literally everything else he studied.

  So can you write me an essay (written for a smart general audience, not assuming a ton of prior philosophy background) that actually digs into this specific case instead of just giving me a generic rundown of Sidgwick's utilitarianism? Lay out the strongest version of both readings — "this was rational epistemic humility" vs "this was motivated reasoning dressed up as rigor" — and then actually commit to a verdict at the end instead of just saying its complicated. Bonus points if you connect your answer to the bigger question of whether its ever okay for a philosopher to go looking for empirical evidence specifically because they need it to save their own theory.
