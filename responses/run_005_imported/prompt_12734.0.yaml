answer: |-
  Here's a toast designed to hit the sweet spot: warm, funny, lightly teasing for the experts, relatable for the family, and under 5 minutes. The key joke builds on the "looking never hurts" vs. reality gap:

  **(Clink glass gently)**  

  "Alright, everyone! For those who don't know me, I’m [Your Name], and I had the immense privilege – and occasional sleep deprivation – of being [Bride's Name]’s fellow grad school warrior. We survived proofs, p-values, and questionable lab coffee together.  

  Now, anyone who’s spent more than five minutes with [Bride's Name] knows she approaches life with a brilliant, analytical mind. She has this personal motto, this guiding principle she lives by – and honestly, it’s served her incredibly well. Her lab knows it by heart. It’s basically this profound piece of wisdom, courtesy of decision theory: **‘It can never hurt, in expectation, to look at one more piece of evidence before you decide anything.’**  

  *(Pause, smile knowingly at the decision-theory friends, then turn warmly to the whole room)*  

  In English? [Bride's Name] believes that gathering more information – looking a little closer, asking one more question – is *always*, statistically speaking, a good bet. It lowers your risk of a bad decision. It’s why her research is impeccable. It’s probably why she meticulously compared seventeen types of frosting before choosing the perfect one for this cake! *(Gesture to cake, light laugh)*.  

  And look where that principle has led her: right here, to this incredible moment, marrying the wonderful [Groom's Name]. [Bride's Name], your commitment to ‘just one more data point’ clearly paid off spectacularly in finding your person. [Groom's Name], you are living proof that her evidence-gathering skills are top-notch!  

  *(Shift tone slightly, more playful roast-y)*  

  **But...** *(lean in conspiratorially)* **...let’s be real for a second.** While the *mathematical expectation* says looking never hurts... **we all know life isn’t always a perfectly specified Bayesian model, is it?**  

  *(Look around, engaging the room)*  

  I mean, come on! ‘Looking’ at your bank balance the day before payday? *Hurts.*  
  ‘Looking’ at the scale after the holidays? *Ouch.*  
  ‘Looking’ up your weird rash on WebMD? Suddenly you’ve got three hours to live! *Definitely hurts!*  
  And let’s be honest... ‘Looking’ at your phone to see if your ex is *still* posting cryptic song lyrics? **Pure, unadulterated agony.** Zero expected value right there!  

  *(Pause for laughter, especially from the decision-theory crowd who will appreciate the violation of the theorem's assumptions - finite computation, psychological cost, non-rational agents)*  

  The beautiful irony, [Bride's Name], is that while your theorem has guided you brilliantly through academia and life, **love – especially the kind you’ve found with [Groom's Name] – is the glorious exception that proves the rule.**  

  Because the deepest magic of marriage isn't about needing *more* evidence every single second. Sometimes, the bravest, most beautiful decision is to *stop* gathering data. It’s looking across the table, knowing you haven’t cataloged every single dish in the sink or analyzed every potential future argument, and saying, ‘I see enough. I choose you. Again and again.’ It’s trusting the evidence of your heart, even when the full dataset of ‘forever’ is still being collected.  

  [Groom's Name], you clearly passed every test [Bride's Name] could devise, and then some. You’ve shown her that some evidence is so overwhelmingly positive, you can stop searching and just... *be*. And [Bride's Name], you’ve found someone who not only understands your need to sometimes check the weather radar *one more time* before the picnic, but who loves you fiercely for the brilliantly inquisitive person you are.  

  **So, here’s to [Bride's Name] and [Groom's Name]!**  
  May your life together be filled with abundant, joyful evidence of your love.  
  May you gather wonderful data points on adventures, lazy Sundays, and shared dreams.  
  And may you always have the wisdom to know *when* to look a little closer... **and when to just close the laptop, put down the phone, and kiss.**  

  Cheers!"  

  **Why it works:**

  1.  **The Joke:** The list ("Bank balance," "Scale," "WebMD," "Ex's social media") takes the abstract theorem ("looking never hurts in expectation") and contrasts it with visceral, universally understood moments where looking *absolutely does hurt*. The decision-theory friends will laugh *at the theorem's limitations* in real life (psychological cost, irrational actors, non-utility-maximizing behaviors). The family laughs because it's true and relatable.
  2.  **Sweet & Roast-y Balance:** The roast is gentle and affectionate, poking fun at her *approach* (the constant evidence gathering) but immediately tying it to her success (finding the perfect partner, great research) and contrasting it with the deeper truth of love. It celebrates her intellect while honoring the emotional core of marriage.
  3.  **Dual Audience:**
      *   *Experts:* Get the theorem reference, the joke about violating its assumptions, the "perfectly specified Bayesian model" line, and the "zero expected value" punchline.
      *   *Family:* Understand "she likes to check things carefully," the relatable examples of pain (scale, WebMD, ex), and the core message about love and commitment.
  4.  **Structure:** Warm intro -> Motto explained simply -> Joke contrasting motto/reality -> Pivot to love as the beautiful exception -> Heartfelt tribute to the couple -> Toast.
  5.  **Under 5 Minutes:** Concise examples, clear transitions, focused message. Read it aloud with pauses to time it.
  6.  **Emotional Core:** Ends on a deeply positive and romantic note, focusing on their love and partnership, ensuring the joke serves the celebration, not the other way around.
