  I recall Scott Alexander's point about "motte-and-bailey beliefs" - people often defend core priors fiercely. And in rationalist circles specifically, disagreements might persist precisely because both sides think they're being Bayesian while actually having different fundamental models of reality. The user's social circle example probably involves complex issues like AI risk or politics where even experts lack ground truth.

