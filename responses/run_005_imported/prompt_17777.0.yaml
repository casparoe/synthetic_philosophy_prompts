answer: |-
  Here's a decisive memo draft recommending rejection of the proposal while offering concrete alternatives, directly confronting the "who decides" objection. It balances academic theory with practical student governance realities:

  ---

  **MEMORANDUM**  
  **TO:** Full Student Senate  
  **FROM:** Elections & Governance Subcommittee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Against "Informed Voting" Proposal for Referenda  

  ### I. Proposal Summary  
  Senator [Name] proposes requiring voters to pass a comprehension quiz (based on a Senate-authored "voter guide") for full voting weight in future referenda. Those failing the quiz retain voting rights, but their vote counts as 0.5 votes.  

  ### II. Subcommittee Recommendation: REJECT the Proposal  
  *Rationale:* While acknowledging the legitimate concern about misinformation in referenda (e.g., the recent shuttle defunding vote), this proposal creates greater institutional and ethical risks than it solves.  

  #### Key Objections:  
  1. **Illegitimate Authority Problem**:  
     - **Who Decides?** The Senate, an elected body with its own biases and policy preferences, would unilaterally determine what constitutes "essential knowledge" via the voter guide and quiz. This grants the Senate editorial control over which facts are prioritized and how questions are framed—effectively allowing the body to influence outcomes by shaping the criteria for full suffrage.  
     - **Accountability Gap**: Unlike governmental institutions with checks and balances (e.g., courts reviewing voting laws), student governments lack neutral arbiters to oversee such power.  

  2. **Erosion of Democratic Legitimacy**:  
     - **Slippery Slope is Real**: Weighting votes based on state-defined "knowledge" sets a precedent for further stratification (e.g., weighting votes by GPA, major, or class standing). This undermines the moral foundation of referenda as expressions of collective student will.  
     - **Referenda ≠ Epistocracy**: Campus referenda are deliberative tools, not expert policymaking. Their value lies in inclusive participation, not "correct" outcomes.  

  3. **Practical Pitfalls**:  
     - **Arbitrary Thresholds**: A 3-question quiz cannot meaningfully assess complex issue comprehension. Passing thresholds would be inherently subjective.  
     - **Implementation Chaos**: Logistically tracking "half-votes" strains our IT systems and risks ballot secrecy violations.  
     - **Campus Division**: Public perception of "second-class voters" would deepen distrust in student governance.  

  ---

  ### III. Proposed Alternatives: Addressing Misinformation Without Vote-Weighting  
  We recommend the following evidence-based reforms to promote informed voting **without** compromising electoral equality:  

  1. **Mandatory Pre-Referendum Information Hub**  
     - **Require** voters to view a neutral, Senate-*curated* (not authored) resource page *before* accessing the ballot.  
     - **Content**: Links to:  
       - Pro/con statements from recognized student groups.  
       - Official budget data (e.g., shuttle operating costs).  
       - Fact-checked rebuttals to viral claims (via nonpartisan campus media).  
     - **Enforcement**: Voters must click "acknowledge viewing" to proceed.  

  2. **Delayed Voting Period + Education Campaign**  
     - Implement a 72-hour "cooling-off period" between referendum announcement and voting.  
     - Partner with the Library and Poli Sci Department to host voluntary info sessions.  

  3. **Sunset Clause Trial: Enhanced Voter Guide**  
     - *If* the Senate seeks a stronger intervention:  
       - Require voters to view a concise, bullet-point guide (drafted by a nonpartisan committee: Senate + Library + Faculty) *before* voting.  
       - **NO QUIZ/HALF-VOTES**.  
       - Include a sunset clause requiring reapproval after 2 referenda.  

  ---

  ### IV. Why These Alternatives?  
  - **Target the Real Problem**: They combat misinformation at its source (information access) without disenfranchising voters.  
  - **Preserve Equality**: All votes retain equal weight.  
  - **Legitimacy**: Collaborative content curation (e.g., involving librarians/faculty) reduces Senate overreach.  
  - **Feasibility**: Uses existing voting infrastructure with minimal technical burden.  

  ---

  **CONCLUSION**  
  The "informed voting" proposal, while well-intentioned, grants the Senate unacceptable power to define and measure voter competence—a role fundamentally at odds with our mission as a *representative* body. We urge the Senate to reject this proposal and adopt the alternative reforms above to foster informed participation while upholding democratic equality.  

  Respectfully submitted,  
  [Your Name], on behalf of the Elections & Governance Subcommittee  

  ---

  ### Key Strengths of This Approach:
  1. **Confronts the "Who Decides?" Issue Head-On**: Explicitly names the Senate’s lack of legitimate authority to define knowledge (citing institutional bias and accountability gaps).  
  2. **Offers Actionable Solutions**: Provides specific, less dangerous tools to address misinformation (curation > control).  
  3. **Grounds in Theory and Practice**: Acknowledges epistocratic influences while rejecting their applicability to student governance.  
  4. **Political Savvy**: Sunset clause alternative gives proponents a compromise while neutralizing the most dangerous element (vote-weighting).  
  5. **Decisive but Collegial**: Validates the proposal’s intent while firmly rejecting its mechanism.  

  This memo protects equal voting rights while proposing realistic measures to combat misinformation—addressing your committee’s core concerns without evasion.
