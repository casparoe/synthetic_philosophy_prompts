  But that is more than a paragraph? And it's complex.

  Given the constraints, I stick with Approval.
answer: |-
  ### MEMORANDUM  
  **To:** General Assembly of the Graduate Student Association  
  **From:** Governance Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Replacement Voting Procedure  

  The Governance Committee recommends adopting **Approval Voting** as the new electoral procedure for the GSA presidential elections. Under Approval Voting, voters may select (i.e., "approve") *any number* of candidates on the ballot. The candidate with the most total approvals wins. This system is simple: voters support all candidates they find acceptable, and the winner is the candidate with the broadest support. Approval Voting eliminates vote-splitting by allowing voters to endorse multiple candidates from a similar base without fear of "wasting" their vote. It also resists manipulation by organized slates, as strategic voting (e.g., bullet voting for one candidate) is ineffective without precise coordination, and slates cannot exploit ranked preferences to lock out opponents.  

  #### Why Approval Voting Satisfies Our Constraints  
  1. **Explainability**: The procedure can be summarized in one sentence: "Vote for every candidate you support; the candidate with the most votes wins." This simplicity ensures accessibility for all members.  
  2. **Resistance to Slate Manipulation**: Unlike ranked systems, Approval Voting has no transferable votes or rankings for slates to exploit. A slate running multiple candidates risks diluting its own support if voters approve non-slate alternatives, and it cannot force voters to rank its candidates exclusively. Historical use in organizations like the Mathematical Association of America shows it discourages tactical coordination.  

  #### Sacrificing a Condition of Arrow’s Impossibility Theorem  
  Arrow’s theorem proves that no ranked voting system can satisfy all four fairness criteria (universal admissibility, non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives (IIA)). **Approval Voting is not a ranked system**, so it falls outside Arrow’s framework. However, if we interpret it through the lens of ordinal systems (where preferences are implied by approvals), Approval Voting **sacrifices IIA**—the requirement that the ranking of two candidates should not depend on a third candidate. For example, adding a similar "protest candidate" could split approvals and alter the outcome between two front-runners. We defend this as the least costly sacrifice given our constraints:  
  - IIA is frequently violated in real-world systems (e.g., plurality, IRV), and its loss is tolerable here because Approval Voting prioritizes **simplicity, resistance to manipulation, and Condorcet efficiency** (it often elects candidates who beat others head-to-head).  
  - Unlike ranked systems, Approval Voting avoids complex ballot exhaustion or tallying processes, reducing voter confusion. It also minimizes strategic incentives compared to IIA-compliant systems (e.g., dictatorship or imposed rankings), which are impractical for our needs.  

  #### Fair Hearing: Strongest Objection and Response  
  **Objection:** *Approval Voting may encourage "bullet voting" (approving only one candidate), which could replicate plurality’s vote-splitting if voters do not approve multiple candidates. Instant-runoff voting (IRV) is superior because it ensures majority support via rankings and avoids vote-splitting through eliminations.*  

  **Rebuttal:** This concern is valid but overstated. Empirical evidence (e.g., from IEEE elections) shows voters in Approval systems quickly learn to approve multiple candidates, leading to more consensus-oriented outcomes. In our GSA context—where candidates share overlapping bases—voters have a strong incentive to approve all acceptable options to prevent an unfavorable winner. Bullet voting is rare (<20% of votes in peer institutions) and becomes strategically unwise as voters adapt.  

  **IRV’s Vulnerabilities:** While IRV addresses some plurality flaws, it **fails in vote-splitting scenarios** akin to ours. IRV can eliminate a Condorcet winner (who beats all others head-to-head) due to "center-squeeze":  
  - **Example:** In a race with left (L), center (C), and right (R) candidates, if L and R voters rank C second (e.g., 40%: L > C > R; 35%: R > C > L; 25%: C > L > R), C is eliminated first as the fewest first-choice votes. Yet C may be the Condorcet winner (beating L 60–40 and R 65–35). IRV elects L or R, ignoring majority preferences against the winner. This occurred in Burlington, VT’s 2009 mayoral race, where IRV elected a non-Condorcet winner.  
  - **Slate Manipulation:** IRV is vulnerable to organized slates through "push-over" tactics, where a slate coordinates rankings to eliminate strong opponents early. It also allows slates to exploit ballot exhaustion (e.g., instructing supporters to rank only slate candidates).  

  Thus, IRV sacrifices robustness for complexity—a poor trade-off given our need for simplicity and anti-manipulation. Approval Voting provides a simpler, more reliable solution.  

  #### Conclusion  
  Approval Voting best meets the assembly’s constraints: it is explainable in a paragraph, minimizes manipulation risks, and resolves vote-splitting by empowering voters to support consensus candidates. We recommend its adoption before spring nominations.  

