  **MEMORANDUM**

  To: General Assembly  
  From: Governance Committee  
  Date: [Date]  
  Subject: Recommendation for New Voting Procedure  

  The Governance Committee recommends adopting **Approval Voting** to replace our current plurality system. Under Approval Voting, each voter may vote for (or "approve") as many candidates as they wish. The candidate with the most votes wins. This system is simple: voters can support every candidate they find acceptable, and the candidate with the broadest support wins.  

  **Why Approval Voting?**  
  Our current plurality system is vulnerable to vote-splitting among similar candidates, as seen in the last election. Approval Voting eliminates this problem by allowing voters to support multiple candidates. It is also resistant to manipulation by an organized slate because it does not require voters to rank candidates (which slates could exploit by coordinating rankings) and because it is difficult for a slate to control how many candidates voters approve.  

  **Arrow's Impossibility Theorem and Our Sacrifice**  
  Arrow's theorem demonstrates that no ranked voting system can satisfy four desirable properties simultaneously. Since Approval Voting does not use ranked ballots, it is not subject to Arrow's theorem. However, if we were to use a ranked system, we would have to sacrifice one of the properties. The property most commonly sacrificed in real-world systems is the Independence of Irrelevant Alternatives (IIA), which requires that the relative ranking of two candidates should not be affected by a third candidate. Approval Voting, by design, does not use rankings and thus avoids this trade-off. We believe this is the least costly option given the assembly's constraints because it provides a simple, robust system that addresses vote-splitting and resists manipulation.  

  **Strongest Objection and Response**  
  The strongest objection to Approval Voting is that it might encourage voters to approve only their top choice (bullet voting) to avoid helping less-preferred candidates, effectively turning it into plurality. However, research and real-world examples show that voters quickly understand the strategic incentive to approve all candidates they like, leading to more expressive voting. Additionally, in our context of a graduate student association, we trust voters to use the system sincerely.  

  We also considered Instant-Runoff Voting (IRV), which the committee members advocated. However, IRV can fail to elect a candidate who would beat every other in head-to-head matchups (the Condorcet winner) when one exists. For example, in the 2009 Burlington mayoral election, IRV elected a candidate who lost head-to-head against another candidate. IRV is also vulnerable to strategic voting by organized groups that manipulate rankings. Given the assembly's constraint of resistance to slate manipulation and the potential for IRV to repeat the vote-splitting issue (albeit less severely), we believe Approval Voting is superior.  

  Approval Voting is used successfully by several academic and professional societies, including the Mathematical Association of America and the Institute of Electrical and Electronics Engineers. It is simple to implement and count, and it encourages broad, consensus candidates.  

  We urge the assembly to adopt Approval Voting in time for the spring nominations.  

  ---

  Note: I chose Approval Voting because of its simplicity and resistance to vote-splitting. But if the committee is set on a ranked system, we might have to choose IRV and defend it. However, given the objection that IRV can fail to elect the Condorcet winner and the assembly's concern about vote-splitting (which IRV addresses only partially), I think Approval is better.

