answer: |-
  Your intuition hits on one of the most profound and persistent problems in ethics: **moral luck**. Philosophers like Thomas Nagel and Bernard Williams have argued extensively that it seems deeply unfair for factors entirely beyond our control (like the frayed cord) to affect our moral status, yet this happens constantly in everyday judgments. You're right to feel uneasy – your situation perfectly illustrates the tension.

  Here's a breakdown of the key philosophical perspectives relevant to your dilemma:

  1.  **The Control Principle (Deontology/Kantian Ethics):**
      *   **Core Idea:** Moral praise or blame can only be fairly assigned for what is genuinely within an agent's control – their intentions, choices, and voluntary actions. Outcomes are often influenced by luck (circumstantial or resultant luck), which is morally irrelevant.
      *   **Applied to Your Case:** Both you and your housemate exhibited the *identical* level of carelessness: the voluntary choice to leave the stove unattended on low heat. The presence of the frayed cord was pure bad luck for her and good luck for you. According to the control principle, you are both **equally blameworthy** for the *reckless choice* you made. The fire is a tragic consequence stemming from her bad luck, but it doesn't *increase* her blameworthiness for the initial act. Your dozens of escapes without incident don't *decrease* your blameworthiness for those acts.
      *   **Strength:** It provides a clear, fair, and consistent standard for moral judgment. It focuses on the agent's character and choices, not random events.
      *   **Defending Your Intuition:** This is the solid philosophical basis you seek. Kantian ethics, heavily emphasizing the good will and intentions/choices as the locus of moral worth, strongly supports this view. You can argue that blameworthiness is determined at the moment of the choice, not retrospectively based on unforeseeable outcomes.

  2.  **Consequentialism (Utilitarianism):**
      *   **Core Idea:** The moral rightness or wrongness of an action is determined solely by its consequences. Blame/praise is a tool to incentivize future behavior that promotes good outcomes and discourages bad ones.
      *   **Applied to Your Case:** The outcome *matters immensely*. Your housemate's action caused real harm, while yours (so far) have not. Assigning her more blame serves a social function: it more strongly discourages this dangerous behavior by associating it with tangible negative consequences. Giving you less blame might reflect that your pattern of behavior hasn't (yet) resulted in harm, so the perceived need to correct you is lower, or it might be seen as inefficient to blame someone where no harm occurred (though this is debatable within consequentialism).
      *   **Strength:** It directly addresses the actual harms in the world and uses moral judgment pragmatically to prevent future harm.
      *   **Problem for Your Intuition:** It explicitly justifies the differential blame based on outcome. It *is* reasonable *from this perspective* because blame is seen as a tool, not a pure reflection of desert based on control.

  3.  **Virtue Ethics:**
      *   **Core Idea:** Ethics is about cultivating good character traits (virtues) and avoiding bad ones (vices). Blame/praise assesses character.
      *   **Applied to Your Case:** Both actions stem from the vice of carelessness or imprudence regarding fire safety. The fire resulting from your housemate's action provides a much *clearer and more dramatic demonstration* of the dangerous character flaw inherent in *both* your behaviors. It makes the vice visible and undeniable. Your lack of consequences might make the same vice in you *less visible* or easier for others (and perhaps yourself) to downplay.
      *   **Strength:** It explains *why* people react more strongly to the person whose carelessness had bad consequences – it starkly reveals the potential danger of the underlying character trait shared by both.
      *   **Problem for Your Intuition:** While focused on character, the *assessment* of character is inevitably influenced by outcomes. People judge character based on actions *and their results*. The fire becomes strong evidence of a blameworthy character trait, even if the same trait exists equally in you. The unlucky outcome makes the vice more salient.

  4.  **The Problem of Moral Luck (Nagel/Williams):**
      *   **Core Idea:** Nagel argued that we deeply believe in the "control principle," but much of what determines the moral quality of our lives (and how others judge us) depends on factors utterly beyond our control (resultant luck, circumstantial luck). This creates a fundamental tension in our moral concepts. We *want* blame to track only control, but we *constantly* assign it based on luck.
      *   **Applied to Your Case:** Your situation is textbook "resultant moral luck" – luck in the way your actions turn out. Nagel would say your friends' reactions expose this deep inconsistency in ordinary moral thinking. Logically, you *should* be judged equally, but psychologically and socially, the dramatic outcome inevitably colors their judgment of your housemate more harshly.
      *   **Strength:** It accurately diagnoses the tension you're feeling. It shows your intuition about fairness is philosophically well-founded, but also explains why the differential reaction happens.

  **Conclusion & Why Your Intuition is Defensible:**

  *   **The Strongest Philosophical Basis:** The **Control Principle**, central to Kantian deontology and supported by the analysis of moral luck, provides the most solid foundation for your intuition. Ethically, blameworthiness *should* depend only on what was within your control: your knowledge, intentions, and voluntary actions. On that day, you and your housemate controlled the same things: you both chose to walk away from an active stove. The presence of the frayed cord was pure luck. Therefore, you *are* equally blameworthy for the *choice* you both made.
  *   **Why Outcomes *Seem* to Matter:** Consequentialism explains the *social utility* of outcome-based blame (deterrence). Virtue ethics explains the *psychological salience* of outcomes in revealing character flaws. The analysis of moral luck explains the *deep tension* between our desire for fairness (control) and our actual practices (influenced by luck).
  *   **Is Outcome-Based Blame "Reasonable"?** It can be *explained* and even *justified* from certain perspectives (like consequentialism), and it's certainly *understandable* psychologically. However, from the perspective of *fairness* and *what an agent fundamentally deserves* based on their own agency, it remains deeply problematic. It means your moral standing is partly determined by random chance, which violates a core sense of justice.

  **What you can do:** Acknowledge the shared responsibility with your housemate. Discuss the incident as a stark warning for *both* of you, highlighting that the *only* difference was luck. Commit *together* to changing the habit immediately. Explain to your friends that while the outcome was terrible, the underlying choice and level of attentiveness were identical, making you equally responsible for the risky behavior, even if she unfortunately bore the brunt of the consequences. You can appeal to the fairness inherent in the control principle: "If I had done the *exact same thing* on that day, the same fire would have happened. The difference wasn't our carelessness; it was the cord being there that day." This challenges the outcome bias and focuses on the controllable action that needs changing.
