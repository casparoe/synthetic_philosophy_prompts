  First, I need to unpack the Rousseau angle properly. The user wants the "strongest version" of his argument, not a strawman. Rousseau wasn't just being a prude about women in public—his core concern was about how professional spectacle could corrode participatory democracy in a small republic. That's crucial. The user also wants honesty about the risks even if funding is approved, so I can't just dismiss the opposition.

