prompt: |-
  So I've been on a bit of a Hobbes kick lately (no philosophy degree here, just a guy who read Leviathan cause someone on a podcast said it was "way more readable than you'd think for 1651"), and I got kind of stuck on this bit in chapter 5 where he says reasoning is basically nothing more than "reckoning" -- like it's literally just addition and subtraction of ideas, the same way arithmetic is addition and subtraction of numbers. That felt like a really weirdly modern thing for a guy to say a few centuries before computers existed. And then earlier in the book he talks about sensation and imagination as just being motion, caused by stuff physically pressing on our sense organs and rattling around inside us.

  This got me wondering: if Hobbes came back today and someone explained functionalism to him -- the idea in philosophy of mind that a mental state like pain or belief is defined purely by the causal role it plays in a system (what causes it, what it causes), so it doesn't matter whether that role is played by neurons, silicon chips, or some weird alien goo, as long as the pattern of inputs and outputs matches (this "it doesn't matter what it's made of" part is the multiple realizability thing) -- would he be into it? Like, is "reason is reckoning" basically him inventing functionalism 300 years early, meaning he'd be totally cool with a computer reckoning it's way to real thoughts? Or does his actual materialism, where thought seems to be tied to specific matter literally being pushed and rattled around in specific ways, mean he'd actually side against the modern functionalists and insist the physical stuff has to be the right KIND of stuff, not just doing the right kind of job? My roommate thinks these two questions are basically the same thing and I'm not so sure. Curious what you think, and what Hobbes would've actually said.
reasoning: |-
  Okay, the user is really into Hobbes right now, specifically his ideas in Leviathan about reasoning as "reckoning" and sensations as physical motions. They're wondering if Hobbes would align with modern functionalism in philosophy of mind, which says mental states are defined by their functional roles, not the physical stuff that implements them. Their roommate thinks the two questions are the same, but the user isn't sure.

  First, I need to recall Hobbes' materialist stance. He viewed everything, including thoughts, as matter in motion. Reasoning for him was like arithmetic—adding and subtracting ideas. Sensations were just external objects pressing on sense organs, causing internal motions. So his view is deeply rooted in physical processes.

  Now, functionalism claims that mental states are about causal roles, regardless of the substrate. If a system has the right inputs and outputs, it can have mental states, whether it's made of neurons, silicon, or alien goo. The key point is multiple realizability—different physical systems can realize the same mental states.

  The user's main question is whether Hobbes' "reason is reckoning" is an early form of functionalism. On the surface, reducing reasoning to computation seems functionalist. But Hobbes ties this computation strictly to physical matter. He might not accept that silicon could think because it's not the same kind of matter in motion. 

  The roommate thinks the two questions are identical, but the user disagrees. The user is distinguishing between the abstract computational aspect (which is functionalist) and the physical implementation (which is materialist). Hobbes might endorse the abstract part but insist the physical medium matters. 

  Also, Hobbes might have issues with multiple realizability. His materialism requires specific physical processes, so alien goo or computers might not cut it. Functionalism's flexibility could clash with his strict materialism. 

  The user might be trying to connect historical philosophy to modern concepts, seeing Hobbes as a precursor. They might want validation that their interpretation has merit, but also need clarity on where Hobbes would draw the line. Highlighting the tension between abstract computation and physical implementation would address their deeper interest in how historical ideas foreshadow modern theories while differing in key aspects.
answer: |-
  That's a fantastic question – and you've nailed a core tension in Hobbes that still resonates in modern philosophy of mind. Your roommate oversimplifies; your two questions are deeply related but distinct. Let's break down why Hobbes would likely be *fascinated* by functionalism, see its kinship with his "reckoning," but ultimately **side against its core tenet of multiple realizability** due to his radical materialism.

  Here's the breakdown:

  1.  **The Functionalist Appeal: "Reason is Reckoning"**
      *   **The Computational Analogy:** Hobbes absolutely prefigured the computational theory of mind. Reducing reasoning to "addition and subtraction" of ideas is strikingly similar to seeing thought as symbol manipulation governed by rules (like algorithms). He saw mental operations as fundamentally mechanical and rule-based.
      *   **Input-Processing-Output:** His descriptions of sensation (input via physical pressure), imagination/conception (internal processing/motion of these "decaying sense" impressions), and reasoning (manipulating these conceptions) map remarkably well onto a functionalist input-output-causal role model. The mind *processes* representations.
      *   **Mechanism over Mystery:** Both Hobbes and functionalists vehemently reject supernatural or irreducibly mental substances. They want a scientific, mechanistic explanation of mind. Functionalism provides a framework compatible with physicalism (everything is physical) without getting bogged down in the specific *stuff* (initially). Hobbes would *love* this anti-dualist, anti-mystical stance.

  2.  **The Materialist Clash: Matter *in Motion* Matters**
      *   **No Ghost in the Machine, Just the Machine Itself:** For Hobbes, *everything* is "Body" (matter) and "Motion." Sensation isn't *caused by* motion; it *is* motion in the nerves and brain. Imagination isn't *like* decaying motion; it *is* decaying motion of the original sensory motion. Reasoning isn't *analogous to* reckoning; it *is* the reckoning performed by the motion of these corporeal ideas colliding and combining *within the physical organ of the brain*.
      *   **The Specificity of the Mechanism:** Hobbes doesn't just say thought *requires* a physical substrate; he identifies thought *with* a *specific kind of physical process*: the literal, mechanical motion of specific corporeal entities (ideas as minute bodies or motions) within a specific physical organ (the brain/mind). It's not just *that* there's a causal role; the causal role *is* this specific physical motion.
      *   **Multiple Realizability vs. Material Identity:** This is the crux. Functionalism says: "As long as the input-output *pattern* and internal *causal relations* are preserved, the physical stuff is irrelevant (neurons, silicon, goo)." Hobbes would say: "The pattern *is* the specific motion of specific corporeal ideas within the brain. If you change the substrate, you change the *kind* of motion. Silicon isn't flesh; electrical currents aren't the motion of minute corporeal ideas. Therefore, even if a silicon computer *simulates* the pattern of human reasoning, it's not *performing* the same physical operation. It's a simulation, not the real thing, because the real thing *is* the specific material motion."
      *   **No Abstract Patterns:** Hobbes likely wouldn't accept that the "causal role" could exist independently of its specific physical realization in the way functionalism requires. For him, the causal role *is defined by* the physical motions. There's no abstract, multiply realizable "pain role" or "belief role" separable from the flesh-and-blood (or rather, nerve-and-motion) process.

  **What Hobbes Would Probably Say Today:**

  1.  **"I TOLD YOU SO! Reasoning IS computation!"** He'd be thrilled that his "reckoning" metaphor became the foundation of computer science and cognitive science. He'd see functionalism's core insight – mind as information processing – as vindication.
  2.  **"BUT... you've missed the crucial point!"** He'd argue functionalism makes a fatal error by abstracting the computational pattern away from its necessary physical grounding: "You think the pattern can float free? Nonsense! The pattern *is* the pattern *of motions* in the brain. A machine made of gears or silicon isn't performing *thought*; it's performing a *different kind of motion* that might *mimic* the *results* of thought. True thought requires the specific corporeal motions generated by sensory pressure on a living, organic body. Your computer 'reckons,' yes, but it reckons with *its own* motions, not the motions of *ideas* within a *brain*. It calculates; it does not *think* in the human sense, because human thought *is* this specific biological reckoning."

  **The Verdict:**

  *   **Would he be "into it"?** Absolutely fascinated and partially supportive of its core computational insight and anti-dualist stance. He'd see it as a descendant of his own project.
  *   **Would he *be* a functionalist?** **No.** His radical materialism, identifying thought *with* specific kinds of corporeal motion in a specific organ, is fundamentally incompatible with functionalism's commitment to multiple realizability. For Hobbes, the "right KIND of stuff" and the "specific way it's pushed and rattled" **are** what thinking *is*. He wouldn't accept that the *functional role* of pain could be realized by silicon; he'd insist that silicon realizing a *similar input-output pattern* would be a fundamentally different physical phenomenon, not genuine pain or thought.

  You were right to sense the distinction your roommate missed. Hobbes pioneered the *computational aspect* of functionalism but anchored it firmly in a *specific physical realization* that modern functionalism explicitly tries to transcend. He'd be a computational materialist, but not a functionalist in the modern sense. Great question – it cuts to the heart of enduring debates in philosophy of mind!
