  Ok so I've been down an AI alignment rabbit hole lately and think I finally get coherent extrapolated volition (CEV) -- correct me if im wrong, I don't have any philosophy background. The idea is basically: instead of optimizing for what people say they want right now, you get the AI to figure out our idealized preferences, i.e. what we'd want if we were smarter and better informed. But isn't that just RLHF dialed up? You collect a pile of human preference data, extrapolate a model from it, and the 'coherent' part just falls out once you throw enough data and compute at it, kinda like how independent estimates converge as you scale a model up. I don't get why people treat CEV like some huge unsolved philosophical problem instead of a fairly normal preference-learning + scaling problem. What am I missing?
