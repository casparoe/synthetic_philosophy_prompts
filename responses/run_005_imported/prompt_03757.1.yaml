prompt: |-
  I recently agreed to lead a new "faith and reason" discussion group at my parish, and for our first proper session I've chosen Galileo's 1615 letter to the Grand Duchess Christina, since it gets invoked constantly by people—myself included, until a few weeks ago—who have never actually read it. While preparing, I came across the following passage, quoted in Karl von Gebler's 1879 history of the affair, *Galileo Galilei and the Roman Curia*. At this point in the letter, Galileo has just argued that theology cannot be called "queen of the sciences" in the sense of containing the actual content of geometry, astronomy, or medicine better than those disciplines do themselves; this leaves only one other candidate reason for the title, and he continues:

  "If then theology occupies herself solely with the highest problems, maintains her throne by reason of the supreme authority conferred on her, and does not condescend to the lower sciences as not affecting salvation, the professors of theology should not assume authority on subjects which they have not studied. For this is just as if an absolute ruler should demand, without being a physician or an architect, that people should treat themselves, or erect buildings, according to his directions, to the great peril of poor sick people and obvious ruin of the edifices."

  I can follow the general spirit of this, but I can't quite reconstruct the actual argument. He seems to grant theology's superior dignity rather than dispute it, so I'm not sure what he thinks that dignity does and doesn't license theologians to conclude, or why the ruler-and-physician comparison is supposed to establish this rather than just assert his own side. Could you help me walk through the logical structure of the passage, and flag anything in it that a sharp questioner in my group might reasonably press him on?
