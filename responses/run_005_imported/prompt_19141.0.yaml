prompt: |-
  So here's something that's been bugging me in arguments I keep having online (mostly the EA forum and a couple group chats). Some people insist a sentence like 'torturing animals for fun is wrong' isn't describing anything -- it's basically just them going 'boo!' at torturing animals for fun, like a crowd jeering, so it can't be true or false. Fine, I get that. But then in the same thread they'll argue 'if torturing animals for fun is wrong, then factory farming is wrong too, its the same thing just at industrial scale' and treat that as a totally normal, valid argument you're rationally stuck accepting, like straightforward modus ponens. That seems to require 'wrong' to mean the exact same stable thing inside the 'if...then' as it does standing alone, which is weird if the sentence is really just an emotional noise with no content. Is this an actual inconsistency in their position, or is there some way to hold 'moral talk is just attitudes, not facts' and still make sense of using ordinary logic on it? Feels like there's gotta be a real name for this puzzle, but I don't know what to even search for.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're encountering a contradiction in online arguments, particularly with expressivists in moral philosophy. On one hand, these people claim that moral statements like "torturing animals for fun is wrong" aren't truth-apt; they're just expressions of attitude, like saying "boo." But then, in the same discussion, they use such statements in logical conditionals, like "If torturing animals is wrong, then factory farming is wrong," treating it as a straightforward modus ponens argument. The user is pointing out that this seems inconsistent because using logical operators like "if...then" requires the components to have truth values, which expressivism denies for moral statements.

  First, I need to recall the expressivist position. Expressivism, associated with philosophers like A.J. Ayer and Simon Blackburn, argues that moral judgments are non-cognitive. They're not describing facts but expressing emotions or prescribing attitudes. So "wrong" in "torturing is wrong" is like a thumbs-down. But when you embed it in a conditional, the problem arises. Conditionals are truth-functional; they rely on the truth values of their components. If "torturing is wrong" has no truth value, how can the conditional function logically?

  The user is asking if this is a real inconsistency in expressivism or if there's a way to reconcile it. They also want to know the name of this problem. I remember that the Frege-Geach problem is exactly this issue. It's a major challenge for expressivism, pointing out the difficulty of embedding moral sentences in logical contexts without assigning truth values.

  I should explain how expressivists like Blackburn respond. Blackburn developed quasi-realism, which tries to show how moral statements can behave as if they're truth-apt even without objective truths. The idea is to reconstruct logical validity in terms of attitudes. For example, accepting the premises but denying the conclusion would involve a contradiction in attitudes, not beliefs. So in the conditional, if you condemn torturing but not factory farming, you're being inconsistent in your attitudes.

  But even within quasi-realism, there are debates. Some philosophers think it doesn't fully solve the problem, especially with complex embeddings. The user might be interested in knowing that this is still an active area of discussion in meta-ethics.

  The user's deeper need seems to be understanding whether their intuition about inconsistency is valid. They might be looking for arguments to counter expressivists in their discussions. They also want the terminology to research further. So confirming the Frege-Geach problem gives them a starting point. Additionally, explaining quasi-realism's approach shows that expressivists aren't just ignoring the problem but have developed responses, even if contentious.

  I should also note that while quasi-realism attempts to resolve this, it's complex and not universally accepted. This highlights that the user's observation is spot-on and points to a core challenge in meta-ethics. They might appreciate knowing that their confusion is shared by professionals and that there's no easy answer, which validates their struggle in these online debates.
answer: |-
  You've hit on one of the most famous and persistent problems in meta-ethics! It's called the **Frege-Geach Problem** (sometimes just the **Embedding Problem** or **Problem of Moral Logic**). Your intuition is spot-on: it highlights a significant challenge for pure non-cognitivist theories like expressivism (the "boo!/hooray!" view).

  Here's a breakdown:

  1.  **The Expressivist Position (Simplified):**
      *   Moral statements like "Torturing animals for fun is wrong" do not describe objective moral facts in the world.
      *   They express the speaker's non-cognitive attitudes – disapproval ("boo!"), condemnation, or perhaps a command ("Don't do that!").
      *   Because they aren't descriptive statements *about* the world, they aren't true or false in the same way factual statements ("The cat is on the mat") are. They're expressions of feeling or prescription.

  2.  **The Problem You've Identified (The Frege-Geach Problem):**
      *   Moral terms like "wrong" appear seamlessly within complex logical structures like conditionals ("If P is wrong, then Q is wrong"), disjunctions ("Either P is wrong or Q is permissible"), negations ("It is not wrong to do P"), etc.
      *   We intuitively reason *validly* with these structures. Your example of modus ponens is perfect:
          *   Premise 1: If torturing animals for fun is wrong, then factory farming is wrong.
          *   Premise 2: Torturing animals for fun *is* wrong.
          *   Conclusion: Therefore, factory farming is wrong.
      *   This argument *feels* logically valid. We treat the premises and conclusion as having propositional content that can stand in logical relations (truth-functional relations for the conditional).
      *   **The Crux:** If "wrong" *only* expresses an attitude in the simple sentence (Premise 2), what does it mean *inside* the conditional (Premise 1)? How can an attitude expression be the *antecedent* of a conditional? What is the *logical content* that the conditional is operating on? Pure expressivism struggles to explain how the *same word* ("wrong") functions logically in these embedded contexts if its *only* job is to express a non-cognitive attitude when standing alone.

  3.  **Is it an Inconsistency?**
      *   **Not necessarily a *blatant* logical inconsistency in the speaker's *actions*:** Expressivists aren't *denying* that moral arguments *seem* logical or that we *use* logic with them. They're offering a *theory* about what moral language *fundamentally is*. The problem is that their theory struggles to *explain* this logical usage adequately. It reveals a *theoretical inadequacy* or challenge within expressivism itself.
      *   **It *is* a major theoretical challenge for pure expressivism:** The Frege-Geach problem is widely acknowledged as the most serious difficulty for simple "boo/hooray" expressivism. If expressivism can't explain how moral terms function logically in embedded contexts, it fails as a complete account of moral language.

  4.  **How Expressivists Respond (Quasi-Realism):**
      *   Sophisticated expressivists, most notably **Simon Blackburn** (developing **Quasi-Realism**), directly tackle this problem. Their goal is to explain how moral language *mimics* the behavior of factual, truth-apt discourse *without* needing objective moral facts.
      *   **The Key Idea:** Logical validity isn't about the *truth* of propositions per se, but about *consistency in attitudes*. Blackburn argues that accepting the premises of a valid moral argument but denying the conclusion involves a kind of *practical* inconsistency, a clash in the commitments of your attitudes.
      *   **Applying it to your example:**
          *   **Premise 2 ("Torturing is wrong"):** Expresses your attitude of condemnation towards torturing animals for fun.
          *   **Premise 1 ("If torturing is wrong, then factory farming is wrong"):** Expresses a *higher-order attitude* – a commitment to condemning factory farming *if* you condemn torturing for fun. It's a commitment to consistency across relevantly similar cases.
          *   **Conclusion ("Factory farming is wrong"):** Expresses the attitude of condemnation towards factory farming.
          *   **The "Validity":** If you sincerely hold the attitude expressed in Premise 2 (condemn torture-for-fun) *and* sincerely hold the higher-order commitment expressed in Premise 1 (condemn anything relevantly similar, like factory farming), then *failing* to condemn factory farming (the conclusion) involves a *practical inconsistency* or *hypocrisy* in your own attitudes. You are committed, by your own attitudes, to condemning factory farming. Logic tracks the consistency of these attitudinal commitments.
      *   **"Wrong" in Embedded Contexts:** In the conditional, "wrong" isn't *directly* expressing the speaker's simple attitude of condemnation at that moment. Instead, it's functioning as part of a complex expression of a *commitment* or *pattern* of attitudes. Quasi-realism aims to show how the *grammar* and *logic* of moral language can be systematically built up from these expressive foundations.

  5.  **Is Quasi-Realism Successful?**
      *   **It's the best shot:** Quasi-realism is the dominant expressivist response to Frege-Geach and is taken very seriously.
      *   **But it's contentious:** Critics argue that it either:
          *   Smuggles in a kind of truth-aptness through the back door (effectively becoming a form of realism).
          *   Is overly complex and fails to fully capture the *semantic* behavior of moral terms in logic (e.g., how negation works perfectly).
          *   Doesn't fully explain why moral disagreements feel like disagreements *about how the world is*, not just clashes of attitude.
      *   The debate is ongoing and highly technical.

  **Conclusion:**

  *   **Yes, you've identified the Frege-Geach Problem.** This is the real name for the puzzle.
  *   **It's not a simple *inconsistency* in what people *say*, but it *is* a profound *theoretical challenge* for pure non-cognitivist/expressivist theories.**
  *   Expressivists (like Blackburn with Quasi-Realism) *do* have sophisticated responses. They argue that logical validity in ethics tracks *consistency of attitudes* and *commitments* rather than truth in the realist sense.
  *   Whether quasi-realism *fully* solves the problem remains a central debate in contemporary meta-ethics. Your interlocutors are likely relying (perhaps implicitly) on quasi-realist ideas when they move seamlessly from simple expressions to logical arguments.

  So, next time you see this, you can point out: "Ah, you're relying on expressivism for simple statements but then using embedded logic – that sounds like the Frege-Geach problem. How do you, as an expressivist, account for the logical function of 'wrong' inside that conditional without making it truth-apt?" This will show you understand the depth of the issue.
