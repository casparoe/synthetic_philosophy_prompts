prompt: |-
  I'm a PhD student in formal epistemology and the graduate student representative on my university's academic integrity panel. This term our AI-writing detector flagged 60 of the 1,400 essays submitted for a large lecture course, each assigned a 93% likelihood of being AI-generated by a tool whose own calibration data show it is wrong about 7% of the time at that threshold -- comfortably above the panel's usual "more likely than not" standard, yet implying that four or five of the 60 flagged students are probably innocent, with nothing in any individual file telling us which. Half the panel wants to sanction everyone flagged, since each file clears our standard on its own merits; the other half won't approve sanctions it is confident will wrongly catch several actual students. Draft the decision memo I'll circulate before we vote on this batch: it should recommend sanctioning all, sanctioning none, case-by-case re-review, or some other policy, and the reasoning should seriously engage the strongest argument against whichever option you choose rather than simply restate the per-case probability.
reasoning: |-
  Okay, the user is a PhD student in formal epistemology and also serves on their university's academic integrity panel. They're facing a tricky situation where an AI-writing detector flagged 60 out of 1400 essays with a 93% likelihood of being AI-generated. The tool's calibration shows a 7% false positive rate at that threshold. This means that while most flagged cases are likely guilty, statistically, about 4 or 5 students might be innocent.

  The panel is split. Half wants to sanction all flagged students since each case meets the "more likely than not" standard individually. The other half is concerned about wrongly punishing innocent students and refuses to sanction when they know some will be false positives. The user needs to draft a decision memo before the panel votes, recommending a course of action that seriously engages the strongest counterargument.

  Hmm, the user's background in formal epistemology is crucial here. They'll appreciate a nuanced approach that considers probabilistic reasoning, decision theory, and ethical implications. The memo shouldn't just state probabilities but tackle the deeper tension between individual likelihoods and group error rates.

  The core conflict is between two principles: 
  1) Upholding standards by acting on individual case probabilities (93% guilt likelihood meets the "more likely than not" bar) 
  2) Avoiding known systemic injustice (knowing with certainty that some innocents will be punished if all are sanctioned). 

  The strongest argument against sanctioning all is the panel's certainty that it will harm innocent students—which feels ethically different from mere probabilistic risk. Conversely, the strongest argument against sanctioning none is that it undermines the entire process when most flags are correct. 

  A case-by-case re-review seems intuitive but might be performative since no new evidence exists. The tool's confidence score is already calibrated, and human graders likely can't detect AI writing better than the tool. Blind reaffirmation wouldn't solve anything. 

  Wait—maybe there's a third way: treating the detector's output as probabilistic evidence rather than binary truth. The panel could require a higher standard for sanctioning (e.g., 99% threshold) given the stakes, but that might not be practical mid-term. Alternatively, they could sanction all but couple it with extraordinary safeguards: allowing appeals with draft evidence, or reducing penalties for first-time offenders given the tool's uncertainty. 

  The memo should recommend "sanctioning none for this batch" while overhauling the process for future cases. Why? Because the panel's split reflects a fundamental problem: using a 93% threshold for individual decisions ignores the group-level false positive inevitability. Until they resolve that conflict procedurally, applying sanctions here is inconsistent with the dissenters' ethical stance. 

  The counterargument to this is strong: it incentivizes cheating by signaling that detectors won't be enforced. The memo must concede this frankly but argue temporary non-enforcement is better than guaranteed wrongful sanctions. 

  Key nuances to emphasize: 
  - The 7% isn't abstract uncertainty; it's a known error rate applied to a group. 
  - "More likely than not" works for individual decisions only if errors are random, but here errors are predictable at scale. 
  - Formal epistemology frameworks like minimax regret or expected utility could model this, but the memo should avoid jargon. 

  The user needs this to persuade academics, so it must be logically airtight yet accessible. I'll structure it with: 
  1) Facts recap 
  2) Analysis of options' flaws 
  3) Recommendation with ethical/mathematical grounding 
  4) Concrete next steps for policy reform. 

  The tone should be collegial but urgent—this affects students' futures. Since the user is the grad rep, I'll subtly empower them to bridge faculty-student perspectives.
answer: |-
  ## Academic Integrity Panel Decision Memo  
  **To:** Panel Members  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Handling 60 AI-Detection Flags (COURSE 101)  

  ### I. Summary of Issue  
  The AI-detection tool flagged 60 essays (of 1,400 submissions) with 93% confidence of AI generation. Per the tool’s calibration:  
  - At this threshold, **7% of flagged submissions are false positives** (i.e., human-written).  
  - Statistically, **4–5 of the 60 flagged students are likely innocent**, though we cannot identify which ones.  
  - The 93% likelihood exceeds our typical "more likely than not" (>50%) standard for individual cases.  

  The panel is divided:  
  - **Group A** advocates sanctioning all 60 students, as each case independently meets our evidentiary threshold.  
  - **Group B** opposes sanctions, citing near-certainty that innocents will be punished.  

  ### II. Analysis of Options  
  #### A. *Sanction All 60 Students*  
  **Argument For:** Upholds procedural consistency. Each case satisfies our pre-established burden of proof (>50% likelihood), and failing to act undermines the tool’s validity and incentivizes misconduct.  
  **Strongest Counterargument (from Group B):** While each case *individually* justifies sanction, we know *collectively* that sanctions will harm innocent students. A policy that knowingly punishes innocents—with no recourse—violates fundamental fairness and the university’s duty of care. The 7% error rate is not abstract; it represents real students facing unjust penalties.  

  #### B. *Sanction No Students*  
  **Argument For:** Prevents guaranteed wrongful sanctions. If we cannot distinguish innocent from guilty, imposing penalties violates ethical integrity.  
  **Strongest Counterargument (from Group A):** This rewards cheaters by ignoring overwhelming probabilistic evidence. If 56–57 students are guilty, inaction signals that AI-generated work is low-risk, eroding academic standards. It also renders our AI-detection policy ineffective.  

  #### C. *Case-by-Case Re-Review*  
  **Argument For:** Mitigates risk by re-examining each essay for contextual indicators (e.g., style shifts, specificity).  
  **Strongest Counterargument:** The AI detector is likely more accurate than human reviewers for this task. Without new evidence (e.g., drafts, timestamps), re-review adds subjective bias without improving accuracy. It also delays resolutions and creates inconsistent outcomes.  

  ### III. Recommended Action: **Suspend Sanctions for This Cohort; Reform Policy for Future Cases**  
  I recommend **NOT sanctioning any of the 60 students** for this assignment, while immediately revising our AI-detection protocols. This addresses the ethical urgency of avoiding *certain* harm while preserving accountability long-term.  

  **Reasoning:**  
  1. **The False Positive Paradox:** Though each case meets the >50% threshold, the *aggregate* false-positive rate (7%) creates a moral dilemma. When we know with certainty that innocents will be punished—and cannot exonerate them—applying sanctions becomes indefensible. This overrides individual probabilities.  
  2. **Procedural Justice:** Punishing 60 students when we *know* 4–5 are innocent violates the principle that it is "better ten guilty escape than one innocent suffer." Our threshold must account for systemic error, not just individual likelihood.  
  3. **Policy Sustainability:** Maintaining trust requires avoiding outcomes where we knowingly penalize innocent students. Sanctioning this group would irreparably damage confidence in the panel.  

  **Engaging the Counterargument:**  
  Group A rightly warns that inaction risks normalizing cheating. However, this outcome is not inevitable. By coupling non-sanction with immediate policy reform (below), we signal seriousness about AI misuse while rectifying a flawed process. Temporary non-enforcement in an exceptional case is preferable to irreversible injustice.  

  ### IV. Policy Reforms for Future Cases  
  To prevent recurrence, I propose:  
  1. **Raise the Evidentiary Threshold:** Require >99% confidence for AI-detection sanctions OR combine the tool with mandatory student drafts/timestamped edits.  
  2. **Error-Rate Transparency:** Sanctions may only proceed if \( \text{(Confidence)} \gg \text{(False Positive Rate)} \).  
  3. **Right to Rebuttal:** Flagged students may submit evidence (e.g., drafts, viva voce Q&A) before sanctions.  
  4. **Calibration Review:** Validate the detector against our student population’s writing.  

  ### V. Conclusion  
  We cannot sanction students when we know some are innocent—even if most are guilty. I urge the panel to:  
  - **Vote against sanctions** for the 60 flagged submissions.  
  - **Approve the proposed reforms** for future cases.  
  This preserves our integrity while adapting to AI-detection’s statistical realities.  

  // Signature //  
  [Your Name]  
  Graduate Student Representative, Academic Integrity Panel  

  ---

  **Key Rationale Highlights:**  
  - **Formal Epistemology Lens:** Distinguishes *individual* probability (93% guilt per case) from *aggregate* certainty (100% chance of multiple false positives). The latter dominates decision-making under known systemic error.  
  - **Moral Weight of False Positives:** Sanctioning innocents is disproportionately harmful compared to excusing guilty parties.  
  - **Forward-Looking:** Avoids ad-hoc compromises (e.g., re-review) by fixing systemic flaws.
