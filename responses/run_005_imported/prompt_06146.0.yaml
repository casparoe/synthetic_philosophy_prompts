answer: |-
  Here is a rigorous dialogue between a present-day Hartian (H) and Fullerian (F), debating the Mauerschützen trials while strictly adhering to their respective frameworks:

  **H:** Let's be clear about the core problem. The guards were prosecuted under *reunified* German law for acts that were *explicitly permitted*, even mandated, by valid GDR statutes at the time. Hart's critique of Radbruch applies perfectly here: reviving a Radbruch-like formula to declare those statutes non-law *ex post facto* is either (a) a retroactive criminal statute dressed up as legal philosophy – which Hart conceded might be the "least evil" option in transitional justice but is *still* retroactive – or (b) a strained, artificial reinterpretation of GDR law itself to find it *never* authorized the shootings. Both violate the positivist separation of law as it *is* from law as it *ought* to be. The GDR border law was repugnant, but it was law.

  **F:** You overlook the critical defect within the GDR's *own* legal system, revealed by Fuller's principles, specifically Congruence. The public statutes – like the 1982 GDR Border Law – spoke of "securing" the border and "preventing" crossings, using language implying arrest and prevention. However, the actual operative orders given to guards were *secret* directives mandating lethal force as the primary response to *any* crossing attempt, regardless of threat. This created a fatal lack of congruence between the law as officially promulgated and the law as administered. The secret orders were the *real* rules of decision, rendering the public statutes a façade. Fuller’s point is that such a gap destroys law's existence; it becomes a mere instrument of power, not a system of rules.

  **H:** Ah, the congruence argument. But this doesn't save you. First, congruence is about fidelity between *declared rules* and *official action*. The guards *were* acting on official orders – secret, but still authoritative commands within the GDR hierarchy. The orders were applied consistently (dreadfully so). Second, and crucially, even *if* we grant a congruence failure regarding the *specificity* of the lethal force mandate (public statute vague, secret order specific), does this *invalidate the entire legal character* of the order? Fuller’s eight principles are *procedural*. A system can satisfy them – including reasonable congruence – while being substantively evil. Imagine a meticulously public, clear, prospective, congruent law stating: "Shoot all escapees on sight." It passes Fuller's tests yet is monstrous. Why isn't the GDR case analogous? The wickedness lies in the *content*, not a procedural flaw you can latch onto to declare it non-law.

  **F:** You mischaracterize the depth of the congruence failure. It wasn't merely a minor gap in specificity; it was a fundamental contradiction in the law's *operative purpose*. The public statute presented the border regime as protective and preventative, implying a hierarchy of responses where force was last resort. The secret orders inverted this, making lethal force the *default and primary* duty. This isn't just poor drafting; it's a systemic deception that eviscerates Fuller’s principle of Constancy. The law couldn't guide conduct because the publicly declared rules were *not* the rules actually used to judge conduct *by the state itself*. The guards were judged by a hidden standard, unknown to the populace they supposedly served. How can subjects rely on law if the state operates by hidden edicts contradicting the public face? This isn't just evil content; it's a failure of the very form necessary for law to *be* law.

  **H:** Constancy? The secret orders *were* constant! They were the standing orders for decades, applied uniformly by the border command. Guards knew their duty: shoot to kill. The populace knew the *brutal consequence* of attempting escape, even if the precise bureaucratic wording was classified. The "deception" you cite is a moral/political critique, smuggled into a procedural criterion. Hart’s point stands: you can have a stable, clear, constant (in application), congruent (between secret order and action), prospective system of wicked rules. The GDR border regime, however abhorrent, exhibited significant procedural regularity *internally*. Your invocation of Constancy and Congruence seems less about the formal failure and more about your substantive revulsion at the content – which is precisely Hart’s warning against conflating efficacy with morality.

  **F:** You isolate procedural criteria artificially. Fuller’s principles are interdependent and describe the *internal morality* that makes law a distinctive enterprise of subjecting human conduct to the governance of rules. A system reliant on pervasive secrecy regarding the *core obligations* it imposes fundamentally undermines that enterprise. The "regularity" you see is the regularity of a machine, not of law. The public statutes were not just vague; they were affirmatively misleading about the nature of the duty imposed. This creates an impossible burden on the subject: obey a public rule you cannot realistically follow because the *real* rule, carrying the severest penalty for deviation, is hidden. This violates the very possibility of fidelity to law – a central concern for Fuller. The guards weren't enforcing "law" in Fuller’s sense; they were enforcing secret state decrees camouflaged by a Potemkin statute. The lack of publicity and the resulting radical incongruence *is* the substantive failure of legality here.

  **H:** But the guards *did* know the real rule! They were trained on it. The populace knew the brutal outcome. The fatal flaw remains: you elevate procedural defects inherent in *any* secretive state apparatus – which are regrettable but commonplace – to the level of negating legal validity *only* when the substantive outcome is sufficiently evil. Would you apply the same invalidation to a benign secret tax regulation? Unlikely. Your framework lacks the resources to distinguish procedural failure from radical invalidity *without* importing a substantive moral judgment – which is Radbruch, not Fuller. The German courts *did* import Radbruch, revealing the insufficiency of Fuller’s procedural criteria alone to handle such extreme substantive injustice. Hart's positivism acknowledges the tragedy: sometimes valid law commands evil, and addressing that requires a frank political/legal choice about retroactivity or strained interpretation, not a philosophical sleight-of-hand declaring the evil command "never law."

  **F:** The *scale* and *purpose* of the secrecy matter. A secret tax rule might cause confusion or unfairness, but it doesn’t pervert the fundamental relationship between ruler and ruled inherent in the concept of law. Here, the secrecy was deployed specifically to conceal a duty to kill citizens for a basic act of freedom, directly contradicting the state's public assurances. This goes beyond a "defect"; it eviscerates the reciprocity essential to law’s existence (another Fullerian theme). The state, by operating through such radical deception on a matter of life and death, abdicated its role as a law-giver and became merely a wielder of force. The procedural failures aren't incidental; they are constitutive of the substantive evil and demonstrate the system's failure to meet the minimal criteria for generating legal obligation. Fuller *does* provide the tools: the systemic, purposeful abuse of the forms of legality itself strips the command of legal character. It wasn't just wicked; it wasn't law.

  *(The dialogue remains unresolved, highlighting the enduring tension: Hartian insistence on the separation of legal validity and moral content vs. Fullerian insistence that extreme procedural perversion, especially concerning core liberties and state honesty, negates legality itself.)*
