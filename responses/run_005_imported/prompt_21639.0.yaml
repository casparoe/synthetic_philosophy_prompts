answer: |-
  Okay, this is *not* a dumb question at all! This distinction trips up a lot of people because the *surface behavior* (saying "knows" in low stakes, "doesn't know" in high stakes) is identical. The difference is entirely under the hood – it's about *what explains* that behavior. Let's break it down and find a case where they *actually disagree*.

  **The Core Difference (Recap & Refinement):**

  1.  **Contextualism:** The meaning of the *word* "knows" shifts based on the context *of the speaker/attributor* (the person saying "S knows that P"). In low-stakes contexts, "knows" requires meeting lower epistemic standards. In high-stakes contexts (even if talking *about* someone in a low-stakes situation!), "knows" requires meeting much higher standards. Knowledge *itself* is fixed; it's the *semantic threshold* for applying the word that moves.
  2.  **Pragmatic Encroachment (PE):** The meaning of "knows" *stays constant* (it always requires meeting the *same* high epistemic standard, like true justified belief + some anti-luck condition). However, whether a person *actually meets* that fixed standard *depends partly on practical stakes*. High stakes *for the subject* (Hannah) make it harder to meet the justification requirement – the evidence needed to *count as knowing* increases with what's at stake for the knower. Knowledge *itself* is sensitive to practical factors.

  **The Bank Case Trap:** In the standard bank case, the attributor (the person saying "Hannah knows" or "Hannah doesn't know") is *also* the subject (Hannah), *and* the stakes change for *both*. So both theories predict the same linguistic behavior: "I know" (low stakes), "I don't know" (high stakes).

  **The Crucial Test Case: Divergent Attributor & Subject Stakes**

  Imagine this scenario:

  1.  **Low-Stakes Subject (Lena):** Lena is casually wondering if her favorite coffee shop, "Bean There," is open on Sundays. She has strong evidence: she's gone there the last 5 Sundays, their website says "Open 7 days," and she saw staff setting up yesterday mentioning Sunday shifts. It's no big deal if she's wrong; she can just go to another cafe. *By the standards of her own low stakes, she feels confident.*
  2.  **High-Stakes Attributor (Arlo):** Arlo is talking to a friend about Lena. Arlo has a *massive*, life-changing bet riding on whether Bean There is open *this specific Sunday* (e.g., he bet his entire savings). If it's closed, he loses everything. He knows *only* what Lena knows (her evidence: 5 past visits, website, overheard comment). Arlo is *extremely* anxious. He says: "Lena *thinks* she knows Bean There is open Sunday, but she doesn't *really* know it. What if the website is wrong? What if they had a sudden closure? What if those staff were talking about *next* Sunday? She hasn't *called* to confirm today!"

  **The Theories' Verdicts:**

  *   **Contextualism:**
      *   Lena's Knowledge State: Lena, in her *low-stakes context*, meets the *low epistemic standards* for "knows". **Lena *does* know** (relative to her context) that Bean There is open Sunday.
      *   Arlo's Attribution: Arlo, in his *high-stakes context*, is using "knows" with *very high epistemic standards*. Lena's evidence (which was sufficient for Lena's "knows") does *not* meet Arlo's high standards. Therefore, **Arlo's statement "Lena doesn't know" is TRUE** (relative to his context).
      *   **Conclusion:** Both Lena's self-attribution ("I know") and Arlo's denial ("She doesn't know") are *correct*, each relative to their *own* conversational context. There's no contradiction; they are using "knows" with different meanings.

  *   **Pragmatic Encroachment (PE):**
      *   Lena's Knowledge State: The meaning of "knows" is fixed (high standard). Whether Lena *meets* this standard depends *on her stakes*. Her stakes are low. Her evidence (5 visits, website, overheard comment) is *sufficient* to meet the fixed justification requirement *given her low stakes*. **Lena *does* know** (objectively) that Bean There is open Sunday.
      *   Arlo's Attribution: Arlo is *assessing* whether Lena meets the *fixed, high standard* for knowledge. Crucially, PE says *Lena's stakes* determine whether *her evidence is sufficient*. Lena's stakes are *low*, so her evidence *is sufficient* for her to know. Arlo's high stakes *don't affect Lena's knowledge state*. Therefore, **Arlo's statement "Lena doesn't know" is FALSE.** Lena knows; Arlo is just being overly cautious (or maybe irrational) *because of his own stakes*, but he's wrong about Lena's epistemic status.
      *   **Conclusion:** Lena objectively knows. Arlo is mistaken when he denies she knows. His high stakes make *him* demand more evidence *for his own actions*, but they don't negate Lena's knowledge.

  **Why This Matters & Why Classical Epistemologists Hate PE More:**

  *   **The Difference is Real:** In this case, Contextualism says Arlo speaks truly ("Lena doesn't know" relative to his context), while PE says Arlo speaks falsely (Lena objectively knows, regardless of Arlo's context). This is a fundamental disagreement about the truth value of a knowledge attribution.
  *   **Why Classical Epistemologists (Invariantists) Prefer Contextualism (or Hate it Less):**
      1.  **Preserves the "Purity" of Knowledge:** Classical invariantism holds that knowledge is *purely* a relation between a subject and a fact – truth, belief, justification/reliability, and the absence of Gettier conditions. *Nothing* practical should affect whether this relation holds. Stakes are irrelevant.
      2.  **Contextualism as a Linguistic Solution:** Contextualism *agrees* that the core knowledge relation is stakes-invariant! It just says our *word* "knows" is context-sensitive, like "tall" or "flat". We already accept context-sensitivity for many words. So, contextualism explains the bank case *without* contaminating the nature of knowledge itself. It's seen as a semantic trick to save the classical invariantist core.
      3.  **Pragmatic Encroachment as a Direct Attack:** PE *directly contradicts* the classical view. It says practical stakes *are part of* the knowledge relation itself – they affect the justification condition. This makes knowledge fundamentally *practical*, not purely intellectual or truth-oriented. To a classical epistemologist, this is like saying the boiling point of water depends on how badly you need a cup of tea – it violates the idea that knowledge has an objective, stable nature independent of our needs and fears. It "encroaches" the practical on the epistemic domain in a way they find deeply wrong.
      4.  **Skepticism Worries:** Classicalists worry PE opens the door to widespread skepticism. If knowledge vanishes whenever stakes get high enough (which they often are in important matters!), do we ever *really* know anything important? Contextualism avoids this by keeping knowledge stable and only shifting the linguistic goalposts.

  **In a Nutshell:**

  *   **Contextualism:** "Knows" is like "tall". Whether someone is "tall" depends on the context of the person calling them tall (e.g., tall for a jockey vs. tall for a basketball player). Lena "knows" relative to her low-stakes context, but Arlo correctly says she doesn't "know" relative to his high-stakes context. The *fact* of Lena's epistemic state is stable.
  *   **Pragmatic Encroachment:** "Knows" is like "boils at 100°C" (at sea level). The standard is fixed. But whether Lena's evidence *boils* (suffices for knowledge) depends on *her* practical pressure (stakes). Low pressure (stakes) = her evidence boils (suffices). High pressure *for her* would mean it doesn't boil (she doesn't know). Arlo's pressure *doesn't affect* whether Lena's pot boils. Arlo is simply wrong to deny she knows. The *fact* of Lena's epistemic state depends on *her* practical situation.
  *   **Classical Hate:** They see PE as corrupting the very essence of knowledge by making it depend on practical concerns, while contextualism is just a story about how we *talk* about that pure essence.

  The Lena/Arlo case highlights the crucial difference: whose stakes matter (attributor's vs. subject's) and what the *truth* of a knowledge attribution depends on. Contextualism makes truth relative to the attributor's context; PE makes truth depend on the subject's stakes relative to a fixed standard. That's the core divergence.
