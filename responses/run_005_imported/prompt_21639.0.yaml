prompt: |-
  Okay so this might be a dumb question but it's been bugging me for like a week now. In my Theory of Knowledge class we went over these "bank cases" where you (or some woman named Hannah in the original example i guess) are trying to decide if you know the bank will be open on Saturday, and the case comes in two versions: in one version its no big deal if you're wrong so you just say "yeah I know it's open, we went there two Saturdays ago," but in the other version there's a check that HAS to be deposited by Monday or you're screwed, and suddenly with the exact same evidence you're like "actually wait, I don't know if it's open, we should call first." My teacher used this to introduce contextualism (basically that "know" is a word that shifts its standards depending on who's talking and what's at stake in the conversation), but then I went and looked it up more on my own and found out there's this whole separate camp, "pragmatic encroachment" (I think the guy is Jason Stanley?), that uses literally the same bank case example but supposedly means something totally different by it.

  My friend Jake and I have been going back and forth on this and we can't figure out what the actual difference is, because both views seem to end up saying "Hannah knows in the low stakes case and doesn't know in the high stakes case," so functionally they seem identical to us. From what little I can piece together, contextualism says its the WORD "knows" that changes meaning based on whoever's talking (the attributor), while pragmatic encroachment says the actual fact of Hannah knowing changes based on HER stakes, and the meaning of "knows" never budges at all — but I can't tell if that's a real difference or just two ways of describing the same phenomenon. Could you explain this in a way that actually makes the distinction click, ideally by describing some case (even a made up one) where the two theories would give different verdicts about whether someone knows something? Bonus points if you can also say why "classical" epistemologists who think stakes are totally irrelevant to knowledge seem to hate pragmatic encroachment way more than contextualism, even though to me they kind of seem like they should be equally weird/unacceptable to a classical view.
