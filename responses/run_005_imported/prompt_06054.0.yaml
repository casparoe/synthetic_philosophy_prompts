  **The Core Distinction They're Talking Past:**

  Ana and Leo are fundamentally arguing about **two different questions**:

  1.  **Ana (Standing/Jurisdiction):** Does Leo have the *moral right or authority* to level this specific blame *given his own past conduct and attitude*? She focuses on the *blamer's* integrity and consistency. Her concern is procedural fairness in the act of blaming itself.
  2.  **Leo (Merits/Substantive Wrongness):** Was Theo's action *objectively wrong/selfish*, regardless of who points it out? He focuses entirely on the *blamee's* action and the factual details of the situations. He treats blame as merely stating a truth.

  **Verdict on the Overall Dispute:**

  *   **Ana wins on Standing:** Her core argument (Moves 1 & 3) is correct. Leo's hypocrisy (doing the same thing without a clear, consistent justification) significantly undermines his *standing* to blame Theo. His apology (Move 4) doesn't fully resolve this; it might even worsen it (Move 5.1).
  *   **Leo *might* win on the Merits (but it's separate):** His argument about the different circumstances (Move 4.2) *could* show that Theo's action *was* actually selfish/wrong while his own wasn't (or was less so). **However,** this doesn't automatically restore his *standing* to blame. Even if Theo was wrong, Leo's own inconsistent application of the standard and his apparent prior belief that skipping *is* wrong (shown by his apology) damage his moral position to call Theo out. Ana correctly insists (Move 5.2) that these are separate issues.

  **Key Insight for Your Paper:** Standing is not about the *truth* of the blameworthy act, but about the *blamer's position* to enact the social/moral practice of blaming. Hypocrisy undermines this position because it violates the fairness and integrity essential for the practice to function meaningfully. Leo's focus on the "message's truth" ignores the crucial relational and performative aspects of blame. The dispute highlights how standing acts as a precondition for legitimate moral address.
