  First, I should recall the key concepts: finks (like Martin's live wire that dies when touched), masks/antidotes (like Bird's poison with an antidote), and Lewis's requirement that the disposition's basis must persist briefly after the stimulus. The core question is whether the patch acts as a mask (preserving the allergy) or a fink (destroying it).

  Looking at Nadia's first point: she says it's clearly a mask because the allergy's basis (IgE/mast cells) remains intact, just like Bird's antidote case. That seems solid—the patch intervenes downstream without altering the underlying condition. I'll score this high.

  Owen counters in point 2 by comparing it to Martin's fink—the patch acts so fast it alters the chemistry before manifestation begins. But here's the rub: for finks, the basis itself is destroyed (like the wire breaking), whereas here the basis stays put. Lewis's "persistence" requirement might not apply since the basis isn't vanishing. Owen's analogy feels strained, so lower score.

  Nadia's rebuttal in point 3 hits hard: if speed alone makes something a fink, then fast-acting antidotes would be misclassified. That exposes a flaw in Owen's initial logic. Full points for showing how his view collapses distinctions.

  Owen pivots in point 4, arguing the patch is now "part of Leo," changing what counts as his basis. But this seems arbitrary—people carry EpiPens permanently too, and we don't consider those part of their biology. His criterion doesn't hold up well. Weak argument.

  Nadia's final point (5) demolishes Owen's adjustment: built-in medical aids don't redefine the person's dispositions. We don't say diabetics aren't diabetic when using insulin pumps. Another strong counter.

  Neither addressed a key nuance: disposition ascriptions depend on context. In medical contexts, we'd say Leo is still allergic (basis intact); in practical/safety contexts, we might say "effectively not allergic" due to the patch. This contextualism could dissolve the dispute. 

  Scoring time: Nadia consistently defends the mask view well (1.5-2s), Owen's arguments have holes (0 to -1). The deeper resolution lies in recognizing that "is allergic" isn't a binary metaphysical question but a contextual one.
