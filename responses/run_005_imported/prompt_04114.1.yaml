  ### Overlooked Arendtian Insights
  Both overlook two key elements from the essays:
  1. **The Role of Expertise:** Arendt links defactualization to modern technocracy’s "gigantomania" – systems so complex they *require* models, divorcing planners from tangible reality ("Lying in Politics"). The transit model isn’t just a tool; it’s a *totalizing framework* that excludes non-quantifiable truths (e.g., contractor incompetence, soil instability).

  2. **Truth vs. Rationality:** In "Truth and Politics," Arendt distinguishes **factual truth** (contingent, plural) from **rational truth** (coercive, logical). The Monte Carlo model embodies rational truth’s tyranny: its "80% probability" *replaces* factual truth (actual progress). Officials didn’t lie; they surrendered to rationalism’s "irresistible force" – a danger Arendt deems greater than deceit.

  ### Conclusion
  Maya’s framing better captures Arendt’s analysis of systemic defactualization, while Owen’s focus on individual culpability overlooks her critique of modernity’s epistemological rupture. The deeper threat isn’t lying officials, but systems where "the distinction between true and false" collapses under "sheer functionality" (*Lying in Politics*).
