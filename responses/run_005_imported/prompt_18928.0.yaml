  Here’s a eulogy that honours your uncle’s profound belief in ubuntu – "umuntu ngumuntu ngabantu" – weaving it into the fabric of his life story in a way that resonates with both his TRC colleagues and his family, without turning abstract:

  ---

  **Eulogy for [Uncle's Name]**

  Good morning. We gather today with heavy hearts, yet also with deep gratitude, to celebrate the life of [Uncle's Name] – a man who was, to so many of us, so many different things: a colleague, a mentor, a friend, a brother, a husband, a father, and an Oupa.

  Those who worked alongside him, especially during those intense years with the Truth and Reconciliation Commission, know a phrase that wasn't just a motto for him, but the very lens through which he saw the world: **"Umuntu ngumuntu ngabantu."** A person is a person *through other people*. For him, this wasn't philosophy confined to hearings; it was the bedrock of how he lived, how he loved, and how he understood his place in this world.

  [Uncle's Name] would have hated it if we stood here today and talked about him as a solitary hero, a man who achieved things entirely on his own. He knew, deeply and truly, that we are all shaped, supported, and given meaning by the people around us. His strength, his wisdom, his remarkable capacity for empathy – none of these existed in a vacuum. They were forged and reflected in the relationships he nurtured.

  **For his TRC family,** you saw this principle in action every day. He didn't approach reconciliation as a distant legal concept, but as the vital work of repairing the *human connections* that apartheid had shattered. He understood that true justice wasn't just about individual punishment, but about restoring the possibility of community, of seeing the shared humanity even across the deepest divides. He pushed for restoring relationships because he knew that isolating perpetrators or victims only deepened the wound for everyone. Healing, for him, was inherently relational. He believed in the power of listening, of acknowledging pain, of finding the fragile threads that could weave people back into a shared fabric. His work wasn't abstract; it was about people seeing each other again, as people.

  **And for his family,** oh, how we felt this truth in the warmth of his presence. As a husband, he built a partnership that was his anchor. As a father, he didn't just provide; he connected. He was the dad who truly *listened*, not just waiting for his turn to speak, but seeking to understand the world through our eyes. He knew our joys were his joys, our struggles were his to help shoulder. He celebrated our victories not as his own trophies, but as moments of shared light.

  And as Oupa? He was pure magic. He didn't just babysit; he *entered* the world of his grandchildren. He built Lego towers not just to build towers, but to build a connection. He listened to endless, rambling stories because he knew that in those moments, he was helping a small person feel seen, valued, and part of something bigger – part of *his* world, part of *our* family. His lap was a haven, his laugh a constant invitation to belong. He understood that being a grandfather wasn't about being perfect, but about being *present*, weaving another thread into the tapestry of a child's life.

  He saw the person in everyone. The shop assistant, the neighbour, the stranger he struck up a conversation with on a park bench – he had this innate ability to make you feel, in that moment, that you mattered to him, that your story was worth hearing. He collected people, not trophies. He built bridges, not walls.

  So, when we say [Uncle's Name] lived by "a person is a person through other people," it means we remember him not as a solitary mountain, but as a vital part of our landscape. His wisdom lives on in the colleagues he mentored who continue the work of justice. His kindness echoes in the quiet support he offered friends. His love resonates in the strength of his marriage. His patience and joy live on in his children and sparkle in the eyes of his grandchildren. His legacy isn't a list of achievements he did alone; it’s the countless ways he helped others see their own worth, their own connection.

  His death leaves a space, yes. But it doesn't erase the relationships he built, the love he gave, the bridges he mended, or the countless ways he affirmed that we *are* because he *was*. He showed us, through a lifetime of quiet, consistent action, that our humanity is a gift we give each other.

  [Uncle's Name] didn't do it on his own. He did it *with* us, *for* us, and *through* the beautiful, messy, vital web of relationships he cherished. And because of that, because he poured so much of himself into the people in this room and beyond, he will never truly be gone. He lives on in every act of understanding we offer, every bridge we build, every moment we truly see another person, and in every time we gather, as we do now, bound together by the love he helped cultivate.

  Thank you, [Uncle's Name], for showing us how to be human, together. Hamba kahle. Go well. Your work in us continues.

  ---

  **Why this works:**

  1.  **Ubuntu as the Golden Thread:** The concept is introduced early for the TRC colleagues and immediately grounded in his *character* and *approach* to life, not just his work.
  2.  **Addresses Both Audiences Directly:** Separate paragraphs explicitly speak to the TRC colleagues and the family, showing *how* ubuntu manifested in each sphere.
  3.  **Concrete Examples (Family Focus):** Uses relatable family moments (listening as a dad, Lego building as Oupa, talking to strangers) to *illustrate* the abstract concept without lecturing. Family members hear about *him*; the ubuntu lens shapes *how* those stories are told.
  4.  **Links Professional & Personal:** Shows the consistency of his belief – reconciliation at the national level stemmed from the same core belief as connection within his family.
  5.  **Avoids Jargon:** Explains "umuntu ngumuntu ngabantu" clearly once, then uses phrases like "shaped by relationships," "vital web of relationships," "helping a small person feel seen," "building bridges," "affirmed that we *are* because he *was*" to convey the idea accessibly.
  6.  **Honours His Wish:** Explicitly counters the "did it alone" narrative and frames his life and legacy entirely through the lens of connection.
  7.  **Focus on Legacy in Relationships:** The closing emphasizes that his impact lives on *through* the people and relationships he nurtured, the ultimate testament to his belief.
  8.  **Respectful Tone:** Balances sorrow with celebration and deep respect for his work and his role in the family.

  Remember to deliver it with the warmth and personal connection your uncle valued so much. This structure allows you to honour the profound depth of his belief while keeping the focus firmly on the man and the relationships that defined him.
