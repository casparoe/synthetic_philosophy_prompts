  Hmm, this connects directly to epistemic concepts like KK-thesis and higher-order requirements for knowledge. The friend seems to be referencing a strict internalist view where justification requires conscious access to one's cognitive state. But is this position defensible? I recall Gettier problems and externalist critiques that challenge such stringent requirements. 

