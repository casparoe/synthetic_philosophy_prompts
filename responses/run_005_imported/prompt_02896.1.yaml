  Now, why isn't this just hidden prejudice against Blair? The manager might have given Blair a fair chance in a different context. For example, if Blair presented alone, the manager might listen properly. But when Alex gets undue credit, it sets a higher bar, making Blair look inadequate. The injustice comes from the relative assessment, not direct bias against Blair.

  This challenges Fricker's framework. She focuses on direct prejudice against the victim. Medina's point is that the harm can be relational. The example shows that even without bias against Blair, the systemic favoritism towards Alex causes Blair's deficit. So Fricker's model might be too narrow because it doesn't account for these comparative dynamics. The user probably wants to understand how Medina expands the concept of testimonial injustice beyond individual prejudice to include structural comparisons. They might be studying epistemology or social justice, looking for concrete examples to grasp the theoretical debate. The example should clearly separate the indirect harm from direct bias, highlighting proportionality.
