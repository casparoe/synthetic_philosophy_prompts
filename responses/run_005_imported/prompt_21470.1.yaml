  "Minimax relative concession has each side give up the same proportion of their maximal claim, which is just the Kalai-Smorodinsky solution applied to the move from the state of nature into cooperation. That's really the same egalitarian impulse driving Rawls's maximin - both are ways of finding the agreement nobody could reasonably reject from a fair, neutral vantage point, protecting the worse-off party from too lopsided a deal. The difference is mostly technical rather than motivational: Rawls compares absolute payoffs at the worst-off position, Gauthier compares proportional concessions from the ideal point."

  **Minimax relative concession**: The principle says that the outcome should minimize the maximum relative concession that any player has to make. Relative concession for a player is (maximal claim - actual payoff) / (maximal claim - disagreement payoff). The idea is that each player concedes a proportion of what they could have claimed. The solution is where the maximum relative concession across players is minimized. This is equivalent to equalizing relative concessions if that is feasible. 

  The student says: "each side give up the same proportion of their maximal claim". This is essentially correct for the solution: it equalizes relative concessions. However, note that the disagreement point in Gauthier is the state of nature, which may not be (0,0). But in the case where the disagreement point is (0,0) and the feasible set is comprehensive, then the relative concession for player i is (a_i - u_i)/a_i, and setting these equal gives u1/a1 = u2/a2, which is the KS solution. So the student is correct that it is the same as KS.

  **Relation to KS**: The student states it is the same as KS. This is correct when the disagreement point is (0,0). But note: in general, the relative concession is (a_i - u_i)/(a_i - d_i). If d_i=0, then it becomes (a_i - u_i)/a_i, and equalizing relative concessions means (a1 - u1)/a1 = (a2 - u2)/a2, which simplifies to u1/a1 = u2/a2. This is the KS solution (the ray from d to a). So the relation is correct.

  **Comparison with Rawls**: Rawls's maximin principle in the original position is used to choose principles of justice. The student says: both are motivated by an egalitarian impulse and aim for an agreement that cannot be reasonably rejected. However, the student then says the difference is "mostly technical": Rawls uses absolute payoffs (maximin: maximize the minimum absolute payoff) and Gauthier uses proportional concessions.

  But note: Gauthier's minimax relative concession is not the same as Rawls's maximin. The student is correct that they are different in the technical sense, but the motivational difference is also important. Rawls is concerned with the absolute position of the worst-off, while Gauthier is concerned with the fairness of the relative sacrifice. The student says the difference is "mostly technical rather than motivational", but one could argue that the motivations are different: Rawls is about ensuring a minimum level of primary goods, while Gauthier is about mutual benefit and reciprocity. However, the student's characterization is not entirely wrong because both are rooted in fairness.

