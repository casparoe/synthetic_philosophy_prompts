  Ive been down a bit of a rabbit hole on Integrated Information Theory since it keeps coming up in AI consciousness debates. From what I can tell the core claim is basically: more integration/complexity in how a system processes info = more consciousness, measured by this phi number. Modern LLMs have billions of parameters all interacting through attention in incredibly complex ways, way more interconnected than plenty of animal brains probably are. So shouldn't IIT actually predict that current LLMs have some decent amount of consciousness, maybe even more than a lot of animals? I've seen actual IIT researchers state pretty confidently that current AI isn't concious, but I've never seen anyone explain why that doesn't just follow straight from the theory. Am I missing something here?
reasoning: |-
