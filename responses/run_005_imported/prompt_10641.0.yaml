answer: |-
  Here's a set of interview questions designed to probe the deeper tensions and defenses of the Selected-Effects (SE) theory of function, complete with pushback follow-ups targeting common responses:

  1.  **On Novel Traits & "No Function Yet":** "The novel mutant heart objection seems like a serious challenge. If a perfectly formed heart mutation appears *de novo* in an organism, pumps blood effectively immediately, and sustains life, the SE theory says it literally has *no function* at that moment because it lacks a selective history. Isn't this deeply counterintuitive? Doesn't its causal role in sustaining the organism *right now* warrant calling pumping its function, even pre-selection?"
      *   *Follow-up (anticipating the "type vs. token" dodge):* "I know you might say the *token* heart has no function but the *type* it instantiates (hearts) does. But isn't that just dodging the intuition? This *specific* novel structure is doing exactly what ancestral hearts did *because* of selection, yet the SE theory seems forced to deny it has a function. Doesn't this suggest the function is grounded in its *current* causal structure and systemic contribution, not just its history?"

  2.  **On Godfrey-Smith's "Modern History" Move:** "Peter Godfrey-Smith proposed restricting the relevant selective history to the 'modern period' to handle cases of functional co-option – like a structure originally selected for A that later becomes crucial for B. Is this 'modern history' restriction a principled solution grounded in the core logic of SE theory, or is it essentially an *ad hoc* adjustment designed solely to rescue the theory from counterintuitive results in these co-option scenarios?"
      *   *Follow-up (anticipating the appeal to "stabilizing selection" or "lineage-specific norms"):* "You might argue the 'modern period' reflects when the trait was stabilized for its *current* role. But how do we objectively define the 'modern period'? Isn't the boundary inherently arbitrary? If a trait was co-opted 1 million years ago vs. 100,000 years ago, does that change its *current* function? Doesn't this move risk making the function assignment depend on an arbitrary temporal cutoff rather than a principled biological distinction?"

  3.  **On Normativity & Malfunction:** "SE theorists often claim a key advantage over Causal Role (CR) theories is grounding normativity – explaining why a diseased heart that *doesn't* pump well *still has the function* of pumping blood, and thus is *malfunctioning*. How does appealing to *past* selection events actually generate this 'ought' – this normative standard – for the *present* token trait? Why *should* this token trait do what its ancestors did, especially in novel environments?"
      *   *Follow-up (anticipating the "proper domain" or "design stance" dodge):* "You might say the function specifies the 'proper domain' or what it was 'designed' to do. But isn't 'design' just a metaphor here? In a purely naturalistic framework, isn't the appeal to history just describing *what happened*, not prescribing *what should happen now*? How does the historical fact that pumping conferred fitness *then* create a normative obligation for this token heart *now*, particularly if its failure to pump is due to a novel pathogen ancestors never faced?"

  4.  **On Spandrels/Byproducts (e.g., Male Nipples):** "SE theory seems to straightforwardly declare that traits which are evolutionary byproducts, like male nipples – which were never directly selected for any function in males – simply *have no function*. But doesn't this feel overly simplistic? Couldn't male nipples *now* play causal roles (e.g., in sexual stimulation, sensation, even potential lactation under hormone therapy)? Why should the *lack of direct past selection* preclude us from assigning them a *current* causal-role function, especially if it contributes to fitness *now*?"
      *   *Follow-up (anticipating the "side-effect" or "exploited property" distinction):* "You might concede they have *effects* but insist those aren't *functions* because they weren't *selected for*. But isn't this distinction doing all the work? If a byproduct trait like male nipples *currently* contributes systematically to male fitness (say, through sexual pleasure enhancing reproduction), and is maintained partly *because* of that contribution, doesn't the SE theory *still* have to call it functionless just because its *initial* appearance wasn't selected? Doesn't this ignore how evolution can exploit existing structures *after* their origin?"

  5.  **On the Explanatory Target:** "SE theory defines function in terms of why a trait *exists* (its selective history), while CR theory defines it in terms of what a trait *does* within a system. Isn't the SE definition fundamentally answering a *different question* than what biologists (or even laypeople) often mean when they ask 'What is its function?' – which is usually about its current causal contribution? Aren't you changing the subject?"
      *   *Follow-up (anticipating the "teleology" defense):* "You might argue SE captures genuine teleology – the 'for-ness' – missing from CR. But does this historical teleology actually help *explain* the trait's *current operation* within the organism? If I want to know how the circulatory system works *now*, isn't the causal role of the heart pumping blood the relevant explanation, regardless of its history?"

  6.  **On Environmental Mismatch:** "Consider a trait perfectly functioning according to its SE function in its original environment (e.g., a thick coat for warmth). Move the organism to a tropical environment. The coat now causes overheating and reduces fitness. According to SE, is it *malfunctioning*? It's doing exactly what it was selected to do (retain heat). Or is it functioning perfectly well, just in the wrong environment? How does SE navigate this without its normative claims becoming unmoored from current utility?"
      *   *Follow-up (anticipating the "normal conditions" clause):* "You might invoke 'normal conditions' – the environment of evolutionary adaptation. But defining 'normal conditions' seems incredibly vague and problematic. Isn't this just smuggling in a reference to the *current* fitness-conferring environment that the SE theory was supposed to avoid relying on?"

  7.  **On the Generality of SE Functions:** "CR functions seem relatively easy to assign across different systems – we can talk about the function of a part in an artifact, an ecosystem, or an organism using the same causal-role logic. SE functions, tied to natural selection, seem restricted to biological traits (and maybe some artifacts by analogy). Doesn't this restrictiveness limit the theory's usefulness? Can SE theory really account for all the contexts where functional language is used meaningfully?"
      *   *Follow-up (anticipating the "core biological domain" defense):* "Granted, SE might be the best theory *specifically for evolved biological traits*. But doesn't the fact that we readily apply functional language to non-selected systems (e.g., 'the function of this keystone in the arch is to distribute weight') suggest that the core concept of function might be broader than just selected effects, and that SE is capturing a specific *type* of function rather than function *simpliciter*?"

  8.  **On the Charge of Circularity/Triviality:** "A common critique is that SE functions risk circularity: we identify the function as what the trait was selected for, but we often infer past selection *based on* the trait's apparent function/benefit. How does the SE theorist break out of this circle? Isn't the function claim just a trivial restatement of the fact that the trait was advantageous?"
      *   *Follow-up (anticipating the appeal to independent evidence):* "You'll likely point to comparative biology, phylogenetics, or population genetics providing independent evidence for selection history. But in practice, isn't the *initial hypothesis* for a trait's selective history often generated precisely by observing its current beneficial effect? Doesn't this make the functional assignment and the selective history inference deeply intertwined in a way that weakens the claim that function *explains* presence via history in a non-circular way?"

  **Key Principles Used:**

  *   **Targeting Intuitions:** Questions leverage strong counterintuitive consequences (novel trait, spandrel utility, environmental mismatch).
  *   **Challenging Fixes:** Directly questioning whether proposed solutions (modern history, normal conditions) are principled or *ad hoc*.
  *   **Pushing on Normativity:** Demanding an explanation for how historical facts generate present norms.
  *   **Highlighting Tensions:** Emphasizing conflicts between historical origin and current utility/structure.
  *   **Anticipating Defenses:** Follow-ups are designed to block standard SE retreats (type/token, "it's not *that* kind of function", appeal to vague clauses).
  *   **Contrasting with CR:** Explicitly forcing the defender to articulate why SE is *better*, not just different.

  These questions should provoke a substantive defense of SE theory that moves well beyond textbook definitions and tackles its philosophical complexities head-on. Good luck with the podcast!
