  so for my phil of bio seminar we've got this mock-podcast assignment where i interview a classmate whos playing a philosopher defending the etiological/selected-effects theory of function (the Wright/Neander/Millikan line, as opposed to Cummins-style causal-role accounts). can you draft me like 8 interview questions that actually dig into the view instead of just having them re-explain what a selected effect even is? i specifically want: one on the classic novel-trait objection (a brand-new mutant heart that pumps blood the very first time it ever appears, before any selection has happened -- does it really have no function yet?), one on whether Godfrey-Smith's 'modern history' move -- restricting the relevant selective history to relatively recent generations, meant for cases like a trait that got co-opted for a new use partway through its evolutionary history -- is a principled fix or just moving the goalposts so the theory gives the intuitive answer, one on how the view earns the right to talk about malfunction/normativity in a way causal-role theorists supposedly cant, and one on byproduct/spandrel traits (like male nipples) that were never themselves selected for anything. for each question throw in a quick follow-up that anticipates whatever dodge they'll probably give and pushes back on it a bit. thanks!
