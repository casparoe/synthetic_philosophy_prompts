  Below, I construct a novel decision scenario where a Bayesian-rational agent appears worse off after costlessly learning true information, and then I identify which idealizing assumption of Good's theorem resolves the paradox. The scenario, called "The Fragile Confidence," is designed to avoid the three standard counterexamples (information hazards, insurance unraveling, and bargaining commitments) and the untreatable disease example. I spell out the states, actions, payoffs, and signal in concrete detail for expected utility calculation.

  ### Decision Scenario: The Fragile Confidence
  **Agent:** Alice, a professional athlete preparing for a high-stakes race.  
  **Decision:** Whether to compete in the race or withdraw.  
  **States of the world:**  
  Alice's innate ability is fixed but unknown, with two possible states:  
  - **High ability (probability 0.5):** Alice has the physical potential to win if she races with confidence.  
  - **Low ability (probability 0.5):** Alice lacks the physical potential to win, even with confidence.  

  **Actions and payoffs:**  
  Alice's payoff depends on her action (compete or withdraw) and her confidence level. Confidence is not a choice; it is determined by her *knowledge* of her ability:  
  - If Alice is **ignorant** of her ability, she remains confident.  
  - If Alice **knows** her ability, she loses confidence upon learning she has low ability (e.g., due to psychological fragility), but retains confidence if she learns she has high ability.  

  The payoffs for each action are defined below. Crucially, the outcome of "compete" depends on Alice's confidence, which is influenced by her knowledge state:  
  - **Compete:**  
    - If Alice is *confident* (ignorant or knows high ability):  
      - High ability state: She wins, gaining prestige and joy. **Utility = 10**.  
      - Low ability state: She loses but enjoys the experience and avoids injury due to confident execution. **Utility = 2** (a small positive).  
    - If Alice is *not confident* (knows low ability):  
      - She races hesitantly, leading to injury and embarrassment. **Utility = -10** in both states.  
  - **Withdraw:**  
    - Alice avoids the race. She feels neutral (no gain or loss). **Utility = 0** in both states.  

  **Signal:**  
  Before deciding, Alice is offered a free, accurate signal that reveals her true ability (high or low) with 100% accuracy. The signal has no direct cost and does not affect the world state (ability is fixed).  

  **Rational choice rule:**  
  Alice is a Bayesian expected-utility maximizer. After observing the signal (or not), she updates her beliefs and chooses the action (compete or withdraw) that maximizes her expected utility given her information.  

  ---

  ### Expected Utility Analysis
  #### **1. Without the signal (ignorant):**  
  Alice does not know her ability. She is confident, so the payoffs for "compete" depend only on the state:  
  - High ability: Utility = 10  
  - Low ability: Utility = 2  

  Her expected utility for each action:  
  - **Compete:** \(0.5 \times 10 + 0.5 \times 2 = 6.0\)  
  - **Withdraw:** \(0.5 \times 0 + 0.5 \times 0 = 0\)  

  Alice maximizes expected utility by choosing **compete**, yielding **6.0**.  

  #### **2. With the signal (informed):**  
  Alice learns her ability. She updates her beliefs and acts rationally:  
  - **If signal reveals high ability:**  
    - She is confident.  
    - Compete: Utility = 10 (guaranteed win).  
    - Withdraw: Utility = 0.  
    - Optimal action: **Compete**, utility = 10.  
  - **If signal reveals low ability:**  
    - She loses confidence. Now:  
      - Compete: Utility = -10 (injury due to hesitancy).  
      - Withdraw: Utility = 0.  
    - Optimal action: **Withdraw**, utility = 0.  

  Expected utility with the signal:  
  \(0.5 \times 10 + 0.5 \times 0 = 5.0\)  

  #### **Comparison:**  
  - **Without signal:** Expected utility = 6.0  
  - **With signal:** Expected utility = 5.0  

  Alice is worse off in expectation by learning her ability (5.0 < 6.0). The information causes a net loss of 1.0 util.  

  **Intuitive reason for the loss:**  
  When ignorant, Alice competes confidently in both states, enjoying a small positive payoff (2) even in the low-ability state. When informed, learning she has low ability shatters her confidence, forcing her to withdraw to avoid injury. This deprives her of the positive payoff she would have had in ignorance.  

  ---

  ### Why This Seems Like a Counterexample to Good's Theorem
  Good's theorem states that the option to observe a free, accurate signal should not reduce expected utility because the agent can always ignore the signal and act as they would without it. Here, Alice appears worse off after observing the signal (5.0 < 6.0). The signal is free, accurate, and the world state (ability) is fixed. Alice updates her beliefs rationally and chooses the Bayes-optimal action given her updated beliefs.  

  ### Dissolving the Counterexample: The Violated Assumption
  The paradox arises because **the outcome function (mapping states and actions to payoffs) is not fixed—it depends on the agent's information state**. Specifically:  
  - In the low-ability state, the payoff for "compete" is **2** if Alice is *ignorant* (confident) but **-10** if she is *informed* (not confident).  
  - Good's theorem assumes that outcomes are determined solely by the world state and the agent's action, independent of the agent's information or beliefs. Here, Alice's knowledge directly alters her confidence, which changes the physical/psychological outcome of competing (e.g., injury risk).  

  **Why ignoring the signal fails to preserve utility:**  
  After observing the signal, Alice cannot "ignore" it to recover the ignorant outcome. If she learns she has low ability, she loses confidence irrevocably. Even if she tries to compete (the action she would have taken ignorant), her lack of confidence causes injury, yielding -10 instead of 2. Thus, she cannot achieve the ignorant-world payoff.  

  **Core issue:** Good's theorem requires a stable outcome function over states and actions. In this scenario, the outcome function shifts upon learning because the agent's confidence—a factor in the payoff—is endogenous to her knowledge.  

  ### Conclusion
  This example illustrates that true information can appear harmful when learning alters the agent's disposition (e.g., confidence), thereby changing the consequences of actions. Good's theorem remains intact because the violated assumption—fixed outcomes independent of information—is crucial to its proof. In real-world applications (e.g., psychology-dependent decisions), information may carry hidden costs by affecting internal states, but this falls outside the theorem's scope. For genuine value-of-information calculations, agents must ensure the outcome function is information-invariant.
