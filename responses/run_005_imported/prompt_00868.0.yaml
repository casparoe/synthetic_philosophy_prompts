answer: |-
  Here is a dialogue between two political theorists, Dr. Aris Thorne (pro-enfranchisement) and Dr. Lena Voss (status quo), grappling with the boundary problem in the context of your city's proposal:

  **Setting:** A university common room after a colloquium on democratic theory.

  **Dr. Aris Thorne:** Lena, that case study about the Maryland suburb debating non-citizen voting – it perfectly crystallizes the boundary problem Whelan posed. We demand democracy, yet the initial act of constituting the *demos* seems inherently undemocratic. For that city, I see enfranchising long-term residents like our colleague as the most defensible, *democratic* response, even acknowledging the paradox.

  **Dr. Lena Voss:** Aris, I grant the profound nature of the boundary problem. There *is* no pristine democratic origin. But that doesn't mean *any* alternative to the inherited citizenship boundary is more legitimate, or even less arbitrary. Jumping to the "All-Subjected Principle" for local elections creates its own, potentially more destabilizing, inconsistencies.

  **Thorne:** But isn't the status quo *itself* destabilizing in its exclusion? Consider the individual: resident for nearly a decade, pays income *and* property taxes – a direct revenue source for the municipality – sends kids through the schools, serves the community association. Their daily life is shaped by city council decisions on zoning, policing, parks, sanitation, school funding. They are palpably *subject* to these local coercive laws. The All-Subjected Principle, as refined by people like Song, argues that those coerced by a polity's laws should have a say in making them. This seems a more direct democratic link than the often-accidental fact of citizenship.

  **Voss:** I agree their lives are affected, profoundly. But "subjected" requires careful parsing. Are they subjected *as members of the political community* or merely as residents? Federal immigration law, which determines their fundamental right to reside here, subjects them far more consequentially. Yet, you wouldn't argue green card holders should vote in federal elections, would you? Why is local subjection the relevant kind? Doesn't this just shift the boundary problem to deciding *which level* of subjection qualifies?

  **Thorne:** A fair push. My argument hinges on the *specificity* and *immediacy* of local subjection for long-term residents. Federal immigration law sets the condition of presence, but once present long-term, the local state becomes the primary, daily agent of coercion governing their lived environment, property, and children's education. It’s about the locus of effective governance shaping their everyday reality. Federal subjection is broader and more foundational, but local subjection is granular and constant. Citizenship, for federal elections, remains a necessary proxy for enduring stake and shared fate at the *national* level, but it's a poor fit for the hyper-local.

  **Voss:** But you rely heavily on "long-term." Why ten years? Why not five? Or one? Why not anyone who pays local sales tax, thus contributing and being affected by the local economy? The All-*Affected*-Interests principle, which you seem to flirt with, *would* logically include commuters, property owners in other states, even distant investors affected by zoning. Your "long-term resident subjected" criterion is an attempt to narrow that, but it looks suspiciously like drawing a *new*, slightly different arbitrary line because the All-Affected principle is too expansive. You haven't *solved* the boundary problem; you've just relocated it to defining the threshold of "sufficient" subjection/duration.

  **Thorne:** You're right, Lena, I haven't *solved* it. No one can. The boundary problem is a permanent condition of democracy. My point is that "citizenship" is an especially *blunt* and often *morally problematic* instrument for drawing that line *locally*, given how citizenship itself is acquired – sometimes unjustly denied, sometimes acquired with minimal connection. "Long-term resident subject to local coercion" is a more *responsive* and *experiential* criterion for local democracy. It anchors the franchise in demonstrable, ongoing stake and exposure to the rules. It's a line, yes, but one drawn closer to the actual exercise of power over the individual. Why is *your* line – citizenship – less arbitrary here?

  **Voss:** My defense isn't tradition or majority sentiment, Aris. It's based on *political obligation and reciprocity*. Citizenship signifies formal, mutual membership in a self-governing project that transcends any single level of government. It entails not just rights but responsibilities – jury duty, potential military service, allegiance. The franchise is the core political right within that mutual compact. Extending it locally to non-citizens severs the vote from that broader context of mutual obligation and shared political identity. It risks creating a class of voters with a stake *only* in the local outcomes that benefit them directly, without the broader national civic commitment. Furthermore, it doesn't resolve the subjection issue: citizens are subject to local laws too. The line isn't perfect, but it aligns the right to participate in *any* level of our governing structure with a foundational membership in the polity as a whole.

  **Thorne:** But doesn't that "broader civic commitment" argument ignore the *actual* commitments our green card holder makes? They pay taxes at all levels, obey all laws, contribute socially and economically – often for decades. They *are* de facto members of the local community, sharing its fate. Denying them a local voice because they haven't undertaken the (often lengthy, expensive, and sometimes inaccessible) path to naturalization, or because they might not feel "allegiance" in the way you define it, seems to prioritize a formal label over concrete democratic engagement and subjection. It confuses the *national* political community with the *local* one. They are intertwined but distinct. And crucially, **you** haven't solved the boundary problem either! Defining the "polity as a whole" is exactly the original puzzle. Why is the *nation-state* the only legitimate unit for defining the franchise-demarcating community? Isn't that just another arbitrary boundary, historically contingent and often forged through force, not democratic consent?

  **Voss:** Touché. You're right, the nation-state boundary is contingent and problematic. But it is the *existing, recognized* unit within which democratic procedures operate and obligations are defined. Creating multiple, overlapping *demoi* with different franchise rules for different levels of government within the same territory introduces significant complexity and potential conflict. Which boundary is *more* democratic? Neither escapes the foundational paradox. My argument is pragmatic: within the inherited framework, citizenship remains the clearest, most stable (though imperfect) marker of full membership and reciprocal obligation across the entire governing structure. Granting local voting to non-citizens creates a category of partial membership that might undermine the incentive for full integration and could lead to inconsistencies in political rights that are hard to justify logically. Why vote for the mayor but not the Congressperson who funds the mayor's projects?

  **Thorne:** Stability and clarity are values, Lena, but they shouldn't trump democratic legitimacy at the point of impact. The complexity you fear exists *already* in the mismatch between lived experience and formal exclusion. The incentive argument is empirically dubious – places like Takoma Park haven't seen reduced naturalization. As for "partial membership," isn't their current status – subject to all laws, paying all taxes, contributing to communities, yet voiceless on local matters – the *true* partial membership? Enfranchising them locally recognizes the reality of their deep, subject-based stake. It’s a pragmatic response *within* the boundary problem, acknowledging that the relevant "people" for hyper-local decisions might be best defined by those enduring the daily consequences of those decisions, regardless of the passport they hold. It accepts the irresolvable nature of the boundary problem but chooses a line more responsive to the actual exercise of power at that specific level.

  **Voss:** And I maintain that line, while responsive to local power, risks eroding the coherence of the larger political community and the reciprocal obligations citizenship entails. We both agree the boundary problem is irresolvable. We're both choosing where to place an inherently contestable line based on different weightings of democratic responsiveness, coherence, obligation, and stability. Neither choice is *undemocratic* per se, given the paradox, but they reflect different priorities in managing an unsolvable dilemma. Your solution prioritizes localized subjection; mine prioritizes the integrity of the overarching political membership.

  **Thorne:** Precisely. And in this specific context, for this city council, I argue that prioritizing the inclusion of those demonstrably subjected to and invested in the *local* community, after a significant duration, is the more democratically compelling – and just – response to the enduring puzzle of who "the people" are here and now. It doesn't solve Whelan's conundrum, but it engages with it more honestly than clinging to a national boundary ill-suited to local democratic practice.

  **Voss:** And I fear it creates new democratic ambiguities while weakening a foundational institution. The debate, like the boundary problem itself, continues. But we agree it's a genuine dilemma, not just a rhetorical obstacle. That, perhaps, is progress.
