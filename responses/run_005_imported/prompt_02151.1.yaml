  First, I need to recall Harsanyi's theorem. It says that if everyone agrees on probabilities and the Pareto principle holds, society's utility is a weighted sum of individual utilities. But when beliefs differ, things break. The key is the ex ante vs ex post Pareto conditions. 

  The user mentioned spurious unanimity. I need a simple example. A bet between two people should work. Let's say Alice and Bob betting on a coin toss. Alice thinks it's 90% heads, Bob 90% tails. They both value money linearly. If offered a bet that pays $100 on heads and $0 on tails, both would accept it because each overestimates their chance of winning. But a neutral observer knows the real probability is 50%, so the bet has negative expected value. That's spurious unanimity—they agree based on wrong beliefs.

  Why is this troubling? Because it leads to decisions that everyone prefers but are actually bad when considering real probabilities. It's not just bookkeeping; it's about making decisions that could harm everyone involved. The unanimity isn't based on shared values or facts, just mutual mistakes.

  Now, for the impact on utilitarianism. The user wonders if restricting to shared beliefs is a minor fix or a big concession. I think it's significant. Real-world disagreements are often about beliefs, not just values. So Harsanyi's theorem might not apply to many real cases. Utilitarianism would need a way to aggregate beliefs first, which is messy. This undermines the theorem as a foundation for utilitarianism in practice, though it still holds under ideal conditions.

