answer: |-
  Your draft is philosophically sharp and engages deeply with core debates in social ontology. Below, I address your four specific queries, flagging strengths and vulnerabilities to help you fortify your remarks. The weakest joints concern the evolutionary move and its application to Bicchieri.

  ### 1. **Accuracy on Lewis and Gilbert**
     - **Lewis**: Your summary is precise. You capture his instrumental "ought," the role of common knowledge/alternatives, and the coordination-problem foundation. No misrepresentation.
     - **Gilbert**: You accurately present her two objections (lapsed conventions and rebuking rights) and her joint-commitment solution. The thank-you note example is correctly attributed. Your phrasing of her critique—that Lewis misses the *normative residue*—is fair and insightful.

     **Verdict**: Both are represented accurately and charitably. Your framing sets up the debate well.

  ### 2. **"Joint Commitment Relabels the Explanandum": Fair Objection?**
     - **Your objection is fair and penetrating**. Gilbert *does* treat joint commitment as primitive (e.g., in *On Social Facts*). Your challenge—"Why does joint commitment bind when individual commitments don’t?"—cuts to the heart of her account. For tacit conventions (like driving), her appeal to "joint readiness to commit" or "presumptive accession" can feel circular. If the obligation arises *because* we’re jointly committed, but the commitment itself isn’t chosen (e.g., being born into a practice), the source of normativity remains opaque.
     - **Gilbert’s potential reply**: She might argue that joint commitment creates a *plural subject* with normative powers irreducible to individuals (e.g., "we" obligations generate rebuking rights *by definition*). For tacit conventions, she’d likely invoke *implicit* agreements sustained by ongoing participation. But this risks conflating *acquiescence* with *commitment*—a point you rightly press.
     - **Weakness to anticipate**: Gilbertians could argue you underplay her distinction between *commitment* (norm-generating) and *mere conformity* (Lewis-style). Clarify that your critique targets the *grounding* of commitment’s force, not its explanatory role.

  ### 3. **Skyrms + Evolved Reactive Attitude: Doing Work or Non Sequitur?**
     - **Strengths**: This is a creative synthesis. Using Skyrms to naturalize resentment as an evolved trait *does* address Gilbert’s "normative residue" without positing irreducible joint commitments. It explains why we *feel* obligations in conventions (e.g., resentment toward wrong-side drivers) even without explicit agreements. Linking this to Strawson-esque reactive attitudes is philosophically fruitful.
     - **Risks**:
       - **Explanatory gap**: Skyrms explains the *emergence* of regularities, but layering "evolved resentment" atop them doesn’t yet show why this *constitutes* obligation. Is resentment *warranted* or just biologically programmed? Gilbert seeks *reasons* for rebuke; evolution may only offer *causes*.
       - **Scale mismatch**: Skyrms’ models (e.g., signaling games) involve low cognitive load. Extending this to complex conventions (e.g., property norms) may overstretch the mechanism.
       - **Is it deflationary?** You note Skyrms is *more* deflationary than Lewis, but your move *adds* a normative layer. Tread carefully: is this a naturalistic *reduction* of normativity (which Lewis might reject) or a *supplement* (which Skyrms didn’t endorse)?
     - **Verdict**: It’s doing real work (bridging "is" and "ought" via evolution), but risks conflating *proximate mechanisms* (psychology/biology) with *normative justification*. This is the **weakest joint** in your argument—expect pushback.

  ### 4. **Bicchieri’s Distinction: Plausible Extension or Violence?**
     - **Your reading is provocative but strained**. Bicchieri *explicitly* distinguishes social norms (with normative expectations/sanctions) from conventions (coordination plus empirical expectations) (*Norms in the Wild*, Ch. 1). She ties this to behavioral psychology, not evolution. Your proposal flattens her taxonomy by making conventions and norms differ only by degree (presence/absence of evolved reactive layer).
     - **Why it’s violence to her view**: Bicchieri emphasizes that normative expectations *transform* incentives—they’re not just add-ons. For her, the belief that "others think I *should* do X" triggers a distinct psychological mechanism (social preference vs. payoff calculation). Your evolutionary layer doesn’t clearly account for this.
     - **Plausible salvage**: You could argue that Bicchieri’s "normative expectations" *are* the culturally transmitted *expression* of the evolved reactive attitude. But this risks reducing her rich psychology to biology—a move she might resist.
     - **Verdict**: Your extension is ingenious but likely misrepresents Bicchieri. It’s a **secondary weak joint**—use it tentatively.

  ---

  ### Overall Weaknesses & Suggestions
  1. **The Evolutionary Gap**: Your Skyrms-Gilbert synthesis needs sharper normative teeth. *Preempt* the "why should we care about evolved resentment?" objection. Consider linking to Ruth Millikan’s teleosemantics (norms as "stabilizing functions") for a more robust naturalism.
     
  2. **Gilbert’s Unanswered Resources**: Address her notion of "joint commitment" as creating *irreducible collective agency*. If you dismiss this, briefly say why (e.g., it over-intellectualizes tacit conventions).

  3. **Bicchieri Nuance**: Soften your claim. Say her distinction *could be mapped* onto the presence/absence of the reactive layer without insisting it’s what she "really" tracks.

  4. **Stakes Clarification**: Explicitly state what your view gains over Gilbert (naturalistic grounding) and Lewis (explains normativity), while conceding limitations (e.g., doesn’t fully capture *reason-based* obligations).

  **Final Thought**: Your core insight—that reactive attitudes may evolve *as part of* convention-sustaining equilibria—is compelling and original. With minor refinements, this will stimulate rich discussion among experts. **Focus most on shoring up the evolutionary move**; it’s the linchpin.
