  Based on the analysis of philosophical cost—considering intuitive acceptability, mathematical utility, and counterintuitive consequences—the ranking from least to most costly is as follows. The axiom of choice (AC) is central to all these statements, but their implications vary in how severely they challenge constructive or intuitive mathematics. 

  **Ranking Rationale**:
  1. **Every surjection between sets has a right inverse** (equivalent to AC): This is the most direct formulation of AC, reducing to the idea of selecting preimages. Its simplicity makes it philosophically lightweight—many mathematicians accept it as a basic principle of set theory without controversy.
     
  2. **Every vector space has a basis** (equivalent to AC): While essential for linear algebra, its necessity in infinite dimensions (e.g., for function spaces) relies on AC. The result feels natural to working mathematicians, and its utility often outweighs mild non-constructive concerns.
     
  3. **Tychonoff's theorem for arbitrary products of compact spaces** (equivalent to AC): A cornerstone of topology with immense utility (e.g., in functional analysis). Its non-constructive proof is a moderate cost, but the theorem’s broad applications make it easier to justify philosophically.
     
  4. **There exists a subset of the reals that isn't Lebesgue measurable** (consequence of AC): Non-measurable sets (e.g., Vitali sets) defy the intuitive link between set size and measure. This is costlier than the above, as it directly undermines a core tool (Lebesgue measure) in analysis—yet it’s "contained" within measure theory and doesn’t feel as globally disruptive.
     
  5. **There's a non-principal ultrafilter on the natural numbers** (consequence of AC): Non-principal ultrafilters enable powerful tools (e.g., ultraproducts), but their existence is highly non-constructive. They feel "alien" as they can’t be explicitly defined, imposing a higher cost due to their abstraction and logical weight.
     
  6. **Every set can be well-ordered** (equivalent to AC): Well-ordering uncountable sets (e.g., \(\mathbb{R}\)) is deeply counterintuitive, as no explicit well-ordering is known. This violates the intuition that "arbitrary" sets shouldn’t behave like ordinals, making it a high cost for realism about sets.
     
  7. **The Banach-Tarski paradox** (consequence of AC): Decomposing a ball into pieces and reassembling it into two identical balls defies geometric intuition and conservation of volume. Its visceral absurdity—though relying on non-measurable pieces—makes it the poster child for AC’s strangeness, imposing the highest philosophical cost.

