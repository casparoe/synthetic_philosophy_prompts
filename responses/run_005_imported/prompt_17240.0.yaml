  - **Non-principal ultrafilter on the natural numbers**: An ultrafilter is a maximal filter. A non-principal ultrafilter on the naturals is one that does not contain any singleton and exists by AC. The existence of such ultrafilters is used in nonstandard analysis and in constructing ultraproducts. It is somewhat abstract and might be considered less intuitive, but it doesn't have the same immediate shock value as Banach-Tarski.

