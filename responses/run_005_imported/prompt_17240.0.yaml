  - **There exists a subset of the reals that isn't Lebesgue measurable**: The existence of non-measurable sets is a classic consequence of AC. The Vitali set is an example. While it is counterintuitive that every set of reals isn't measurable, it is not as visually shocking as Banach-Tarski.

  - **Every set can be well-ordered**: This is equivalent to AC. The well-ordering theorem says that every set can be ordered in such a way that every non-empty subset has a least element. This is counterintuitive for sets like the reals, because we cannot explicitly describe such a well-ordering.

  - **Banach-Tarski paradox**: This is often cited as the most counterintuitive result of AC. It seems to violate conservation of volume. However, the pieces are non-measurable, so volume isn't defined for them. This is very visually striking and hence often considered a high cost.

