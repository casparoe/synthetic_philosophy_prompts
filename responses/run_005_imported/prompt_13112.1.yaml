answer: |-
  Here's the tier list ranking based on Lewis's strict criteria for convention (solving recurring coordination problems, sustained by common knowledge and mutual expectations, and arbitrariness). The practices are evaluated against being primarily conventional versus having independent moral, legal, or functional explanations.

  ```json
  {
    "paradigm_convention": [
      "driving on the right side of the road",
      "the meanings of ordinary words",
      "stopping at red lights",
      "shaking hands as a greeting"
    ],
    "mostly_convention": [
      "queuing for a bus",
      "tipping at restaurants"
    ],
    "mixed_or_contested": [
      "monogamous marriage"
    ],
    "barely_convention_at_all": [
      "keeping promises"
    ]
  }
  ```

  ### Brief Justifications:
  - **Paradigm Convention**: Arbitrary solutions to pure coordination problems (e.g., left/right driving, word meanings, traffic signals, greetings). Alternatives exist equally, sustained by expectations.
  - **Mostly Convention**: Strongly conventional but with minor functional/moral influences (queuing is efficient but arbitrary; tipping is culturally variable yet socially expected).
  - **Mixed/Contested**: Combines conventional elements with deep moral/legal scaffolding (marriage norms vary but are heavily institutionalized).
  - **Barely Convention**: Rooted in intrinsic moral obligations (promise-keeping lacks arbitrariness; alternatives don’t solve the trust problem equivalently).
