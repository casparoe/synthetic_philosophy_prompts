  Here’s a draft recommendation memo that directly engages the Hart-Devlin debate, upholds both positions fairly, and arrives at a clear conclusion tailored to your Board’s context:

  ---

  **MEMORANDUM**  
  **TO:** Business Licensing Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **RE:** Recommendation re: "Companionship Suite" License Application  

  ### I. Introduction
  After thorough review of the application for a "companionship suite" and deliberation on our deadlocked vote, this memo recommends **approving the license without additional conditions**, based on our mandate to apply the "public morals and decency" clause narrowly and objectively. The core disagreement mirrors a longstanding ethical debate (the Hart-Devlin debate), which this memo addresses head-on to explain my position.  

  ### II. The Competing Principles: Hart vs. Devlin Applied to This Case  
  **A. The Devlin Position (Strongest Version):**  
  *Defended Fairly:* Society’s stability relies on shared moral boundaries. Permitting conduct widely viewed as profoundly degrading—even if consensual and victimless—erodes social cohesion. If most citizens would be repulsed knowing such a business operates downtown, that collective disgust signals a genuine harm: the undermining of communal values that bind us. Our "public morals" clause exists precisely to prevent normalization of acts that violate our community’s ethical fabric, regardless of physical harm.  

  **B. The Hart Position (Strongest Version):**  
  *Defended Fairly:* Law should protect individuals from tangible harm, not enforce majority morality. "Disgust" is an unstable basis for regulation—it risks enshrining prejudice and stifling private autonomy. Where no coercion, exploitation, or public nuisance exists (as confirmed here), the state exceeds its role by policing consensual, private acts based on subjective distaste.  

  ### III. Why Hart’s Framework Prevails in *This Specific Case*  
  While Devlin’s concern for social cohesion is valid, **three case-specific factors compel approval**:  

  1.  **The *Complete Absence* of Victimhood:**  
      Devlin’s model assumes moral transgressions inherently harm society. Here, every verified fact—no human participants, no solicitation, no accessibility to minors—removes the exploitation or public indecency historically tied to "morals" clauses. Unlike adultery or drug use (the original debate’s focus), *this activity involves no sentient beings*. Objecting solely to the *concept* of synthetic companionship stretches "public morals" beyond the ordinance’s intent.  

  2.  **The Slippery Slope of "Collective Disgust":**  
      Invoking "disgust" here sets a concerning precedent. If we deny this license, what prevents rejecting a bookstore selling legal but controversial literature, or a clinic offering services some find morally objectionable? Hart rightly warns that codifying majority sentiment risks arbitrary enforcement. Our health/safety codes—*all satisfied here*—provide objective standards; "disgust" does not.  

  3.  **The Ordinance’s Limited Scope & Practical Reality:**  
      The "public morals" clause is a discretionary tool, not a mandate to police thought. Its intent is to address *public* impacts—like overtly sexualized venues disrupting neighborhoods. This operation is discreet, appointment-only, and invisible to the public. Denial based on hypothetical offense ("if people knew…") penalizes privacy the applicant designed *specifically to avoid causing offense*.  

  ### IV. Recommendation: Approve the License  
  **Conclusion:** The application meets all objective licensing requirements. Denial under the "public morals" clause would require evidence that the business *actively undermines public order or welfare*. No such evidence exists. While I respect colleagues’ visceral discomfort, Hart’s caution against legislating morality absent harm is compelling here. **Approve the license as submitted.**  

  **Why Not Conditions?**  
  Imposing extra conditions (e.g., "no male-coded dolls," mandatory counseling pamphlets) would implicitly endorse Devlin’s view that the activity is inherently immoral, inviting legal challenges and exceeding our remit. Either the activity violates public morals (denial) or it doesn’t (approval). Conditions would be unenforceable and philosophically inconsistent.  

  ### V. Final Note  
  This isn’t indifference to community values. It’s humility: recognizing that the state’s power to impose moral judgments on private, victimless conduct must have clear limits. Our role isn’t to bless lifestyles but to uphold duly passed laws—and this applicant has followed them.  

  --- 

  ### Key Strengths of This Approach:
  - **Clear Outcome:** Unambiguous approval recommendation.  
  - **Devlin Respected, Not Caricatured:** Acknowledges social cohesion as a legitimate concern.  
  - **Hart Applied Contextually:** Explains *why* harm principle prevails *here* (no victims, precedent risk, ordinance intent).  
  - **Practical & Principled:** Ties philosophy to licensing specifics (discretion clause, lack of public impact).  
  - **Non-Legalist Tone:** Avoids jargon; focuses on civic judgment ("precedent," "community welfare," "objective standards").  
  - **Preempts Conditions:** Explains why "middle ground" undermines the legal/philosophical coherence of either position.  

  This memo elevates the debate while grounding it in your Board’s practical mandate. It respects both viewpoints but concludes that denying a compliant business based solely on subjective distaste overreaches your authority under the ordinance.
