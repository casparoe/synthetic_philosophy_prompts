prompt: |-
  I'm writing a feature about how slippery statistics can get in public debates, and Simpson's paradox keeps coming up as my go-to illustration. Problem is, literally every explainer I've ever read (an early draft of mine included, which my editor sent back covered in red ink) reaches for the same two case studies — the Berkeley grad school admissions numbers and that kidney-stone-treatment study — and at this point they feel like the statistical equivalent of a stock photo. Her other note was more interesting though: I'd written that whenever you hit one of these reversals you should just trust the split-by-group numbers over the pooled ones, since that's the "real" causal story, and apparently a data-scientist friend of hers said thats not actually a safe rule in general, it depends on the case.

  So could you build me a fresh, realistic-feeling example of Simpson's paradox — actual numbers, doesn't have to be from a real published study, any domain you like (hiring, sports, city policy, medicine, whatever) — where it's genuinely NOT obvious that the stratified numbers are the ones that should guide the actual decision? Ideally one where the variable you're splitting the data by isn't just some innocent pre-existing confound sitting off to the side, but is itself tangled up with the very thing you're trying to measure, so that two statistically literate people could honestly disagree about whether to read the real story off the pooled data or the split-up data. And then walk me through it in plain English I could basically lift for the piece — what exactly is it about the structure of your example that makes it messier than the tidy confounder story everyone gets taught in Stats 101?
