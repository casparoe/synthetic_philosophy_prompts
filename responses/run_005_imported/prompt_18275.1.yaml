  We are going to create an example in the context of hiring practices. Specifically, we'll consider two companies (Company A and Company B) and their hiring rates for two types of applicants: those with a college degree and those without. We'll set up the numbers so that:

  1. When we look at the overall hiring rates (pooled data), it appears that Company A has a higher hiring rate than Company B.

  2. However, when we break down by education level (stratify), we see that for each education group (with and without a college degree), Company B actually has a higher hiring rate.

  But here's the twist: the education level of the applicants is not just a confounder that is pre-existing and independent. Instead, the companies have different applicant pools and different hiring practices that might influence the education level of the people who apply. Moreover, the education level might be a consequence of the company's reputation (or other factors) and thus is entangled with the very thing we are trying to measure (the company's hiring practices).

  In this scenario, we want to make the case that it's not straightforward to say that the stratified data is always the "real" story because the education level is not a neutral confounder. It might be that the overall (pooled) rate is more relevant for a particular question, such as: "If I am a random applicant, which company is more likely to hire me?"

  Let's set up the numbers:

  Suppose:

  **Company A:**
  - Applicants with a college degree: 1000 applicants, 200 hired (20% hiring rate)
  - Applicants without a college degree: 9000 applicants, 900 hired (10% hiring rate)
  - Total: 10000 applicants, 1100 hired (11% overall hiring rate)

  **Company B:**
  - Applicants with a college degree: 9000 applicants, 1800 hired (20% hiring rate? Wait, let's adjust to create the paradox)
  Wait, we want for each group, Company B has a higher rate? Let me adjust.

  Actually, we want:

  For college degree holders: 
    Company A: 20% 
    Company B: 25%

  For non-college degree holders:
    Company A: 10%
    Company B: 15%

  But then the overall for Company B would be higher? We need to reverse.

  To get the paradox, we need the overall hiring rate of Company A to be higher than Company B, but within each group, Company B is higher. How? By having Company A have a much larger proportion of applicants from the group that has a higher hiring rate (college degree holders) even though that group is smaller in absolute terms for Company A? Wait, no.

  Actually, we can have:

  Company A gets mostly non-college applicants (who have a lower hiring rate) and a few college applicants (who have a higher rate). But we want the overall for A to be higher? Not matching.

  Standard setup:

  Company A: 
    College: 1000 applied, 200 hired -> 20%
    Non-college: 100 applied, 10 hired -> 10%
    Overall: 110 applied, 210 hired? Wait, that doesn't add. Let me recast.

  Standard Simpson's paradox example in hiring:

  Let me use the classic structure but with our twist.

  Set:

  **Company A:**
  - College: 1000 applicants, 500 hired -> 50% rate
  - Non-college: 100 applicants, 40 hired -> 40% rate
  - Overall: 1100 applicants, 540 hired -> 49.09% rate

  **Company B:**
  - College: 100 applicants, 60 hired -> 60% rate
  - Non-college: 1000 applicants, 450 hired -> 45% rate
  - Overall: 1100 applicants, 510 hired -> 46.36% rate

  Now, overall: Company A has 49.09% > Company B 46.36%

  But by group:
    College: A 50% < B 60%
    Non-college: A 40% < B 45%

  So the paradox is present.

  But now, why is the stratified data not necessarily the whole story?

  The issue: the education level of the applicants is not randomly assigned. It might be that Company A is a prestigious company that attracts a lot of college graduates, while Company B is a company that is known for hiring non-college graduates and therefore attracts more non-college applicants. But note that the hiring rates by group are higher at Company B.

  However, consider the perspective of an applicant. If you are a college graduate, you are more likely to be hired by Company B (60% vs 50%). If you are a non-college graduate, you are also more likely to be hired by Company B (45% vs 40%). So why is the overall hiring rate at Company A higher? Because Company A gets a lot more college graduates (who are easier to hire) and fewer non-college graduates (who are harder to hire). 

  But is it fair to compare the overall rates? That depends on the question.

  If the question is: "I am going to apply to one of these two companies without knowing anything about the applicant pool composition, and I don't know my own education level (which is absurd, but bear with the hypothetical)?" then the overall rate might be what you care about. But that's not realistic.

  Alternatively, if the question is about the company's hiring practices in a vacuum, then the stratified rates (by education) might be more informative because they control for education.

  But here's the twist: what if the education level of the applicants is influenced by the company's reputation? For example, if Company B has a reputation for being more open to non-college graduates, then it might attract more non-college applicants. However, that reputation might also mean that the non-college applicants to Company B are of higher quality (because they are specifically targeting a company that values experience over degrees) than the non-college applicants to Company A (who might be applying randomly). Similarly, the college graduates applying to Company B might be a more self-selected, motivated group because they are going against the grain (applying to a company that is known for non-college hires). 

  In this case, the education level is not just a confounder but also a proxy for unmeasured factors (like motivation, quality of experience, etc.) that are different between the two companies' applicant pools. Therefore, the stratified analysis might not be comparing like with like.

  So, two arguments:

  1. The overall rate might be more relevant for a policymaker who is concerned with the overall chance of employment for a randomly selected job seeker in the population. In that case, the fact that Company A has a higher overall hiring rate might be important.

  2. The stratified rates might be more relevant for an individual who knows their own education level and wants to choose the company with the higher hiring rate for their group.

  But note: if the composition of the applicant pools is different in a way that reflects the company's hiring practices (and thus the type of applicant they attract), then the overall rate is also a valid measure of the company's performance in hiring from the entire population.

  However, if we are trying to assess the fairness or efficiency of the hiring process, the stratified rates might be more informative because they show that for each education group, Company B is more likely to hire.

  But wait: what if the difference in hiring rates by education group is due to the fact that Company B is getting better quality applicants in each group? Then the stratified rates are not solely due to the company's hiring practices but also due to the quality of applicants.

  This is the entanglement: the variable we are stratifying by (education) is not a pre-existing, fixed confounder. It is part of a system that includes the company's reputation and the self-selection of applicants.

  Therefore, it is not clear whether we should trust the pooled or the stratified data.

  Now, let me create a more concrete narrative.

  Example:

  Imagine two tech companies, TechGiant and StartUpCo, that are hiring software developers. 

  - TechGiant is a well-established company that attracts a lot of recent college graduates because of its prestigious internship programs and campus recruiting. However, it also gets a small number of non-traditional applicants (without a college degree) who are self-taught or bootcamp graduates.

  - StartUpCo is a newer company that has actively advertised that they value practical skills over degrees. As a result, they attract a large number of non-traditional applicants and fewer college graduates (because college graduates are more attracted to the big names). However, the college graduates who do apply to StartUpCo are often those who are particularly passionate about the startup's mission or who have side projects that align with the company.

  The numbers:

  **TechGiant (Company A):**
  - College graduates: 1000 applicants, 500 hired (50%)
  - Non-college graduates: 100 applicants, 40 hired (40%)
  - Overall: 1100 applicants, 540 hired (49.09%)

  **StartUpCo (Company B):**
  - College graduates: 100 applicants, 60 hired (60%)
  - Non-college graduates: 1000 applicants, 450 hired (45%)
  - Overall: 1100 applicants, 510 hired (46.36%)

  Now, the overall hiring rate is higher at TechGiant (49.09% vs 46.36%). But for both college and non-college applicants, the hiring rate is higher at StartUpCo.

  Why might the overall rate be more meaningful? 

  Suppose we are a government agency evaluating which company is creating more job opportunities. We might care about the total number of hires per applicant, and TechGiant is hiring a slightly higher percentage of its applicants. However, note that the absolute number of hires at TechGiant is 540 and at StartUpCo is 510, so TechGiant is hiring more people (but they had the same number of applicants). 

  But if we are a job seeker, we care about the rate for our group. 

  However, the complication: the non-college applicants to StartUpCo might be of higher quality because they are specifically targeting a company that values their skills. Similarly, the college applicants to StartUpCo might be a more motivated subset. Therefore, the higher hiring rates at StartUpCo might reflect the quality of the applicant pool rather than a more lenient hiring process.

  In fact, we might hypothesize that StartUpCo has a more rigorous hiring process (hence the higher bar in each group) but because they attract better applicants, their hiring rates are higher per group. But then why is the overall rate lower? Because they have a much larger share of non-college applicants (who are harder to hire, even though they are better than average non-college applicants) and a small share of college applicants.

  Alternatively, we might think that the hiring rates reflect the company's standards. But without knowing the quality of the applicants, we cannot be sure.

  This ambiguity is the key. In the Berkeley case, the stratification by department was appropriate because the department was a pre-application characteristic and the question was about gender bias in admissions. But in our example, the education level of the applicants is not independent of the company they are applying to. Therefore, the two rates (overall and stratified) answer different questions.

  Conclusion for the article:

  Simpson's paradox reminds us that statistical relationships can reverse when we account for a third variable. But which analysis we trust — the pooled or the stratified — depends on the causal question we are asking and the nature of the third variable. When the stratifying variable is itself influenced by the treatment (or exposure) of interest, or when it is a collider (a variable affected by both the treatment and the outcome), then conditioning on it can introduce bias. In such cases, the pooled analysis might be more appropriate. In our example, because the education level of the applicants is entangled with the company's reputation and hiring practices, there is no simple answer. The choice between the two analyses must be guided by the specific question and a deep understanding of the data-generating process.
