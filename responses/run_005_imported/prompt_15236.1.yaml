  Okay, the user and their friend had a heated debate about Aquinas's stance on tyrannicide, specifically referencing "De Regimine Principum." The friend argues that Aquinas essentially supports tyrannicide by stating that a ruler's authority is only legitimate if it serves the common good. The user couldn't counter this effectively during the dinner and is now seeking a clear rebuttal.

  First, I need to recall Aquinas's actual position. The friend cites "De Regimine Principum," but I remember that Aquinas only wrote part of that work. The rest was by Ptolemy of Lucca. So, the user's friend might be conflating different sections. That's a key point to address.

  Next, the main texts where Aquinas discusses tyranny are in the "Summa Theologiae," particularly in Question 42 of the Secunda Secundae. Aquinas does say that a ruler who becomes a tyrant loses legitimacy. However, he doesn't jump to justifying tyrannicide. Instead, he emphasizes removing the tyrant through public authority, not private action. 

  The distinction between tyrannical acquisition and exercise is crucial. If a ruler seizes power illegally, they can be deposed. But if they start governing tyrannically after legitimate accession, removal must be by a higher authority, like the Church or the people's representative. Private individuals acting alone is a big no for Aquinas because it leads to disorder and greater harm.

  Also, Aquinas values order and peace. Even a tyrannical ruler is better than chaos. He suggests endurance and prayer as better options. The user needs to know that Aquinas's rejection of tyrannicide is about avoiding greater evils and maintaining societal structure.

  The user might want a solid argument to counter their friend. Highlighting the misattribution in "De Regimine Principum" weakens the friend's point. Emphasizing the procedural aspects—public authority over private action—shows Aquinas's cautious approach. Also, mentioning the potential for worse consequences addresses the practical side the user might care about.

  The user's deeper need is likely to resolve their intellectual discomfort and gain clarity for future discussions. They might also want to understand Aquinas's alternative solutions to tyranny, like relying on higher authorities or divine intervention. Providing structured points with textual references will help them feel confident in their rebuttal.
answer: |-
  Your friend's interpretation is a common oversimplification, but **Aquinas does *not* endorse tyrannicide as a legitimate private action by subjects.** While he provides a powerful theoretical framework for resisting tyranny, his conclusions are far more cautious and procedural than Salisbury's. Here's the breakdown:

  1.  **The Core Principle (Where Your Friend is Partly Right):**
      *   Aquinas *does* ground political authority in the common good (ST I-II, Q. 90, A. 2; De Regimine I.1, I.15).
      *   He explicitly states that a ruler who governs for private advantage rather than the common good is a **tyrant** (De Regimine I.3; ST II-II, Q. 42, A. 2).
      *   He argues that such a ruler **loses legitimacy** ("non est gubernatio iusta" - it is not just governance - De Regimine I.6).
      *   **Obedience is not due** to a tyrant *in matters contrary to the common good or divine law* (ST II-II, Q. 104, A. 6). Subjects are morally obligated to *disobey* unjust commands.

  2.  **The Crucial Caveats (Where the Inference to Tyrannicide Breaks Down):**
      *   **Distinction: Deposition vs. Assassination:** Aquinas focuses on the *removal* of a tyrant, not necessarily his *killing*. His preferred method is **procedural and public**.
      *   **The Role of Public Authority:** Aquinas consistently argues that action against a tyrant must come from a **higher or public authority**, *not* private individuals:
          *   **Higher Temporal Authority:** If the tyrant was appointed by a superior (e.g., an Emperor appointing a King), that superior has the authority to depose him (De Regimine I.6).
          *   **The "Multitude" (Public Authority):** If the ruler was established *by* the multitude, *then* the multitude itself ("multitudo") has the authority to depose or restrain him. Crucially, Aquinas does *not* mean a mob or individual vigilantes. He means the community acting through some established representative body or procedure embodying public authority (De Regimine I.6; ST II-II, Q. 42, A. 2, ad 3). This is **not license for individual assassination**.
      *   **The Peril of Private Action:** Aquinas explicitly warns against private individuals taking action:
          > "For it is dangerous both for the multitude and for its rulers if private persons, following their own judgment, attempt to slay rulers, even tyrants." (De Regimine I.6)
          His reasons are pragmatic and moral:
          *   **Greater Evil:** The resulting chaos, civil strife, and potential for worse tyranny are often a greater evil than enduring the existing tyrant.
          *   **Usurpation of Authority:** Private individuals lack the *authority* to execute judgment, which belongs to the public power. Assassination is essentially usurping the judicial function.
          *   **Moral Hazard:** Opening the door to private judgment and violence undermines the very order necessary for the common good.
      *   **Distinction: Tyranny in Acquisition vs. Exercise:** Aquinas subtly differentiates between a ruler who *seizes* power tyrannically (who may be resisted more readily, even with force *if public authority leads it*) and a ruler who *becomes* tyrannical after legitimately gaining power. Deposing the latter requires greater caution and reliance on higher/public authority (De Regimine I.6).
      *   **Endurance and Divine Remedy:** If no public remedy is available, Aquinas surprisingly advocates for **endurance** and **prayer** as the safer course, trusting God to either reform the tyrant or provide a remedy in His own time (De Regimine I.6; ST II-II, Q. 42, A. 2, ad 3). He values order, even imperfect order, above the risks of violent upheaval initiated privately.

  3.  **Contrast with John of Salisbury:**
      *   Salisbury (*Policraticus*, Book VIII) is far more explicit and radical. He famously calls the tyrant a "public enemy" whom it is "just and right" for *anyone* to kill, comparing the tyrant-slayer to the biblical Ehud. He frames it almost as a pious duty.
      *   Aquinas, while agreeing on the nature of tyranny and the illegitimacy of obedience to its unjust commands, **vehemently rejects this leap to private tyrannicide**. His focus is on legitimate, public, and procedural action to *remove* the tyrant, not on individual assassination.

  4.  **What Should Subjects Do? (Aquinas's Alternatives):**
      *   **Disobey Unjust Commands:** Refuse to comply with orders contrary to the common good or divine law.
      *   **Seek Redress through Public Means:** Appeal to higher authorities (if they exist) or work through whatever representative mechanisms the community possesses.
      *   **Endure and Pray:** If no public remedy is possible without provoking greater evils, endure the injustice while praying for divine intervention to change the ruler's heart or remove him providentially. (This reflects his profound belief in divine providence governing human affairs).
      *   **Publicly Instigated Removal (Ideally):** Support or participate in a *publicly authorized* action by the community ("multitudo") or its representatives to depose the tyrant. This action *could* involve force, but it must be public, not private.

  **Conclusion:**

  Your friend is correct that Aquinas provides a devastating *theoretical* critique of tyranny, denying its legitimacy and the obligation to obey its unjust dictates. **However, Aquinas explicitly and repeatedly rejects the idea that this licenses *private individuals* to assassinate a tyrant.** He breaks the inference by:

  1.  **Insisting on Public Authority:** Action must come from a higher temporal power or the community acting through its public authority ("multitudo").
  2.  **Warning of Greater Evils:** Private tyrannicide risks chaos and worse tyranny.
  3.  **Rejecting Private Judgment in Execution:** Only public authority holds the power of the sword justly.
  4.  **Advocating Endurance as a Last Resort:** When public action is impossible or would cause greater harm, endurance and prayer are the prescribed, albeit difficult, course.

  Aquinas's position is one of **resistance within order.** He seeks remedies against tyranny, but only those exercised through legitimate channels to avoid plunging society into a potentially worse state of lawlessness. While he agrees with Salisbury's diagnosis of tyranny, he fundamentally disagrees with Salisbury's prescription of individual assassination. Your nagging feeling was correct; Aquinas's position is far more nuanced and cautious than your friend presented.
