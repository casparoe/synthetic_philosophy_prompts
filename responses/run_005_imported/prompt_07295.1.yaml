     Her developmental argument is a strong anti-reductionist point. Children *do* acquire foundational concepts (language, facts) via testimony before possessing independent means to verify reliability. This genuinely challenges Humean reductionism by highlighting a regress problem.

  2. **Owen (Score: 0)**  
