  User’s seminar angle is smart: testing if Bentham’s utilitarianism consistently handles novel cases. Their TA calls it "gimmicky," but it’s actually a rigorous stress test. I should emphasize Bentham’s empiricism—his verdict would hinge on data, not dogma. 

