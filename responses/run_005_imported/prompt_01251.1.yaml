answer: |-
  Davidson's argument from malapropism exerts pressure on conventionalism by attacking its core claim: that successful communication fundamentally depends on *shared, stable, conventional rules* (a "language"). He argues that the phenomenon reveals something deeper: communication rests on a *moment-by-moment, radically particular* interpretive act that cannot be reduced to, or grounded in, shared conventions. Here's why the conventionalist's "tolerable noise" defense fails under Davidson's scrutiny:

  1.  **The *Necessity* of the Passing Theory:** Davidson doesn't deny conventions exist or are useful. His point is that they are *insufficient* to explain successful communication *even in standard cases*, and malapropisms make this insufficiency glaringly obvious.
      *   **Prior Theory ≠ Shared Language:** The conventionalist relies on the "prior theory" – the hearer's pre-existing beliefs about what words conventionally mean *plus* their beliefs about the speaker's likely meanings (including potential errors). But Davidson argues this prior theory *is not* a shared language. Crucially:
          *   *Speaker and Hearer Have Different Prior Theories:* The speaker has their own prior theory (what *they* think their words mean conventionally, plus their intention). The hearer has *their* best guess about what the speaker knows/conventionally means *plus* their best guess about the speaker's likely deviations/intentions. There's no guarantee these prior theories overlap significantly or constitute a single shared object.
          *   *Prior Theory is a Moving Target:* The prior theory is constantly updated based on context, the specific speaker, and the unfolding discourse. It's not a stable, shared code but a dynamic, individualized expectation.
      *   **Passing Theory is the *Only* Thing that Matters for Understanding:** What *actually* enables the hearer to understand the speaker *in this specific utterance* is the "passing theory" – the specific interpretation theory the hearer arrives at *for this speaker at this moment* to make sense of *this* utterance. Crucially:
          *   *Idiosyncrasy:* The passing theory that successfully interprets "derangement" as "arrangement" and "epitaphs" as "epithets" is utterly specific to *this* utterance by *this* speaker to *this* hearer at *this* time. It *cannot* be a convention because it's a one-off adjustment.
          *   *Non-Sharability:* This passing theory *could not* be learned in advance or shared with others as a rule. It's an ephemeral, context-bound, ad hoc construct.
          *   *The Locus of Meaning:* For Davidson, meaning *just is* what the passing theory assigns to the utterance. Understanding *is* the successful construction of a passing theory. But if the passing theory is inherently idiosyncratic and non-conventional, then the meaning grasped *in that moment* isn't determined by a shared language.

  2.  **Malapropism as the Rule, Not the Exception:** Davidson argues that what malapropisms reveal is fundamental to *all* communication, not just errors.
      *   **Novelty is Ubiquitous:** Metaphor, ambiguity resolution, context-dependent reference assignment (indexicals, demonstratives), resolving syntactic ambiguities, understanding neologisms, coping with idiolectal quirks, even understanding perfectly conventional utterances in a novel context – *all* require the hearer to go beyond strict conventional application and construct a *specific* passing theory for *this* utterance.
      *   **The Passing Theory is Always Required:** Even when a conventional meaning seems perfectly applied, Davidson insists the hearer *still* constructs a passing theory that assigns *that* meaning to *those* words *now*. The "conventional" meaning is just a common *starting point* or a frequent *outcome* of passing theories, not the underlying mechanism. The malapropism simply makes the *necessity* of the idiosyncratic passing theory undeniable.
      *   **No Predictable Limit on Deviation:** A "flexible conventionalist" might try to build in tolerance for *predictable* errors or *known* types of novelty. But Davidson's point is that the *kind* and *degree* of deviation needed for successful understanding in any given case is *unpredictable* and *unbounded* by prior conventions. The hearer could, in principle, need to interpret "derangement" as meaning "quagmire" in some utterly novel context if that's what makes the speaker's intention intelligible. The interpretive act is creative and open-ended, constrained only by the holistic principle of maximizing rationality/truth in the context, not by a predefined set of rules or permissible deviations.

  3.  **What "Shared Language" Cannot Be:** Davidson's radical conclusion stems from what he argues a "shared language" would need to be to *explain* communication, and why it fails.
      *   **Not the Prior Theory:** As argued, the prior theories of speaker and hearer are different and dynamic. They don't constitute a single, shared object.
      *   **Not the Passing Theory:** The passing theory is ephemeral, non-sharable, and specific to a single utterance/context. It cannot be a shared, enduring language.
      *   **Not an Overlap/Intersection:** There is no stable, identifiable *core* of conventions that speaker and hearer reliably share *and* that successfully explains *all* instances of understanding. The overlap needed for communication is achieved *in the moment* via the passing theory, not possessed in advance as a shared language.
      *   **Conclusion:** Since neither the prior theory nor the passing theory (the only candidates) constitute a shared language in the sense required to *ground* communication, and since communication demonstrably occurs *without* such a shared object doing the explanatory work, Davidson concludes "there is no such thing" as a shared language in that foundational sense. Communication rests on the *ability* to construct passing theories via radical interpretation, not on sharing a code.

  **The Argumentative Pressure in a Nutshell:**

  1.  **Understanding requires a passing theory (PT).**
  2.  **A PT is inherently idiosyncratic, ephemeral, and non-conventional (it's built for *this* utterance by *this* speaker for *this* hearer *now*).**
  3.  **Therefore, understanding does not fundamentally rely on shared, stable conventions (a "language").**
  4.  **The PT is necessary not just for malapropisms, but for *all* successful interpretation (novelty is ubiquitous).**
  5.  **Therefore, the phenomenon revealed by malapropism is the *essential structure* of communication: radical interpretation constructing a momentary, non-shared PT.**

  **Why the Conventionalist "Noise" Argument Fails:**

  *   **It Misdiagnoses the Problem:** Davidson isn't saying conventions are *usually* sufficient but break down at the edges. He's saying the interpretive mechanism revealed at the "edges" (malapropism) *is the core mechanism operating everywhere*. Conventions are useful regularities *within* the process of constructing PTs, not the foundation *of* the process.
  *   **It Cannot Account for the Idiosyncrasy:** The "noise tolerance" is itself achieved by constructing a unique PT. The conventionalist can't point to a shared rule explaining *why* "derangement" meant "arrangement" *here*; it was a unique interpretive leap.
  *   **It Underestimates the Ubiquity of Novelty:** Building "tolerance" into conventions still assumes a core shared code handles most cases, with exceptions. Davidson argues *every* case requires the open-ended, creative process characteristic of PT construction. There is no "core" that isn't itself dependent on this process.

  Davidson forces us to see that the smooth flow of conversation masks a continuous, creative, interpretive effort by each participant, constructing meaning moment-by-moment based on holistic considerations of rationality and context, rather than simply applying a pre-existing, shared rulebook. Malapropism isn't noise within the system; it's a clear window into the system's true nature. The argument's radicalism lies in showing that what seems like the exception is, in fact, the rule.
