  First, I need to unpack the geometry example carefully. When the rotating line is perpendicular, B coincides with A, but "B" only denotes A under that specific condition. The key is that "B" isn't a rigid designator—it's context-dependent, like a definite description. Frege says the point is "given" differently: A is direct, B is constructed. That does feel proto-sense-like. But then he explicitly calls identity a relation between names, and says signs "stand for themselves" in identity statements. That sounds like a use/mention error waiting to happen.  

  Wait—maybe "stand for itself" isn't literal mention. If we interpret it as the sign contributing its mode of presentation (rather than just the referent or the string), that bridges the gap. The geometry example supports this: "B" encodes the construction method. That would mean the 1892 self-criticism oversimplifies his earlier view. Frege might have had the conceptual insight but lacked the vocabulary.  

