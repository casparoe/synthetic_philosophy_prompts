  The mention-slide danger is real, but Frege avoids it by treating the sign as a vehicle for its Inhalt’s presentation. He’s gesturing at sense without having the distinction. The user’s suspicion is right: the later summary flattens the subtlety. The real break in 1892 isn’t rejecting the early view but refining "content" into sense/reference.  

