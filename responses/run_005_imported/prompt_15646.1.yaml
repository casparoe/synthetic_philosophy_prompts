  So I was explaining to a coworker why a hardcoded user ID isnt the same kind of thing as a mutable lookup like 'current job title', and it reminded me of the Kripke rigid designator stuff (naming and necessity, all that). Can you write me a joke about it, one where the punchline actually turns on the fact that a true identity statement between two rigid designators (like Hesperus and Phosphorus) is necessary even though it was only discovered a posteriori? Not a generic 'lol philosophers' joke, i mean it should actually land for someone who already knows the theory. Bonus if it also somehow riffs on the flip side, the contingent a priori thing (like Kripke's meter stick example), but dont force it if that makes the joke worse.
