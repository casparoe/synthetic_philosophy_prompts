answer: |-
  Your question cuts to the heart of a fascinating tension in Hume scholarship and contemporary metaphysics: **Hume would likely reject Lewis's "Humean Supervenience" as an overreach of his skepticism, while also dismissing Armstrong's universals and Maudlin's primitivism as unsupportable metaphysics.** However, he *might* find Maudlin's view marginally less objectionable than Armstrong's, though still deeply problematic. Here's a reasoned analysis:

  ### 1. **Hume's Core Stance: Epistemic Humility Over Metaphysical Denial**
     - **Against Dogmatic Denial (Lewis):** Lewis’s BSA explicitly denies any "hidden necessitation" in nature. But Hume’s skepticism was *epistemic*, not ontological. He argued we cannot *know* or *conceive* of necessary connections (e.g., *Treatise*, 1.3.14). For Hume, this didn’t entail that such connections *don’t exist*—only that human reason cannot access them. Lewis’s flat denial would strike Hume as a metaphysical overstep, violating his own empiricist principles. As Galen Strawson argues ("The Secret Connexion"), Hume consistently references "ultimate forces" or "secret powers" in nature (e.g., *Enquiry*, 4.1), treating them as possible but unknowable.
     
     - **Against Metaphysical Posits (Armstrong/Maudlin):** Armstrong’s "necessitation relation" (N(F,G)) and Maudlin’s primitive lawhood both posit *mind-independent modal structure*. Hume would reject these as "occult qualities" — unobservable entities invoked to explain observable regularities. His critique of "necessary connexion" (*Enquiry*, 7) targets precisely such imperceptible "bonds," whether between events (causation) or universals (Armstrong).

  ### 2. **Where Hume Would Side in the Contemporary Debate**
     - **Lewis’s BSA:** Hume would see it as a sophisticated *description* of scientific practice but **metaphysically hubristic**. BSA reduces laws to human-summarized patterns, which aligns with Hume’s view that "necessity" is a projection of the mind (arising from custom/expectation). However, Lewis’s claim that this exhausts reality ("Humean supervenience") would offend Hume’s epistemic caution. For Hume, BSA could only describe *our knowledge* of laws, not prove no deeper structure exists.  
       - *Hume's likely verdict:* "Lewis confuses the limits of human understanding with the limits of reality."

     - **Armstrong’s Universals:** Armstrong posits universals and a relation (N) that *makes* instances of F necessitate G. To Hume, this is **doubly objectionable**:  
       - Universals are abstract entities beyond sense impression (*Treatise*, 1.1.7).  
       - "Natural necessitation" is precisely the type of imperceptible connection Hume deemed inconceivable.  
       - *Hume's verdict:* "Armstrong dresses medieval essences in modern garb."

     - **Maudlin’s Primitivism:** Maudlin treats laws as fundamental, unanalyzable facts. Hume *might* find this **marginally less offensive** than Armstrong:  
       - It avoids positing *relations* between distinct existences (a key target of Hume’s Dictum).  
       - It doesn’t multiply entities (e.g., universals) beyond observable phenomena.  
       - Yet Maudlin’s laws are still inherently *modal* (implying necessity), which Hume would dismiss as unsupported by experience.  
       - *Hume's verdict:* "Maudlin replaces an inexplicable connexion with an inexplicable fact."

  ### 3. **The "New Hume" Perspective: A Path to Symmetry?**
     - If the "New Hume" reading (Strawson, Wright, Craig) is correct, Hume believed in *mind-independent causal powers* while denying we can comprehend them. This suggests:  
       - **Rejection of Lewis:** Lewis’s denial of hidden powers contradicts Hume’s realism about "secret forces."  
       - **Ambivalence Toward Anti-Humeans:** Hume might *sympathize* with Armstrong/Maudlin’s insistence on mind-independent modal structure but reject their specific accounts as unjustified speculation.  
       - **Key Insight:** Hume’s skepticism targeted *rationalist metaphysics*, not scientific realism. He’d likely see all sides of the debate as overreaching: Lewis by denying what we can’t know, Armstrong/Maudlin by defining what we can’t observe.

  ### 4. **Hume’s Probable "Middle Path"**
     If transported to the seminar, Hume would likely argue:  
     - **Laws as Human Artifacts:** Scientific laws are psychological/cognitive tools for predicting constant conjunctions (aligning with BSA’s pragmatic side).  
     - **Agnoistic Realism:** There may be more to nature than regularities, but we cannot meaningfully describe it. Any talk of "necessitation" (Armstrong) or "fundamental lawhood" (Maudlin) is empty without empirical content.  
     - **The Primacy of Experience:** Armstrong’s universals and Maudlin’s primitive laws are disconnected from sense data. Lewis’s system, while empirically grounded, mistakenly conflates epistemology with ontology.  

  ### Conclusion: Hume as a Skeptical Meta-Critic
  Hume wouldn’t join any camp. He’d see Lewis’s BSA as a useful *epistemological* model but reject "Humean supervenience" as dogmatic metaphysics. He’d dismiss Armstrong and Maudlin for violating empiricist scruples. **His true heir isn’t Lewis but Nancy Cartwright**, who emphasizes laws as human constructs without ontologically committing to Lewis’s "cosmic ledger" of non-modal facts. Ultimately, Hume would remind us that the debate itself risks reifying concepts beyond their experiential warrant — a warning from the 18th century that remains urgently relevant. 

  *"When we run over libraries, persuaded of these principles, what havoc must we make? If we take in our hand any volume... let us ask, Does it contain any abstract reasoning concerning quantity or number? No. Does it contain any experimental reasoning concerning matter of fact and existence? No. Commit it then to the flames: for it can contain nothing but sophistry and illusion."* (Hume, *Enquiry*, 12.34)*
