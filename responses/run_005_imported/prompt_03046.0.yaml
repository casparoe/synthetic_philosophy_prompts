  The real question underneath seems to be: "How do I navigate this transition without damaging the friendship or feeling exploited?" He's looking for practical guidance on whether to continue exchanges normally, scale back, or quantify the imbalance. There's also unspoken anxiety about the friendship itself ending with the move.

