  ## The Unforgivable Calculus: Evaluating Anscombe's Indictment of Truman

  Elizabeth Anscombe's condemnation of Harry Truman as a murderer for authorizing the atomic bombings of Hiroshima and Nagasaki presents a profound challenge to utilitarian justifications of warfare. Her argument, rooted in the Doctrine of Double Effect (DDE), asserts that intentionally killing the innocent as a *means* to an end, regardless of the end's perceived goodness, is always morally impermissible – tantamount to murder. The standard consequentialist defense, that the bombings saved lives overall by obviating a costly land invasion, seems irrelevant on her view. Evaluating whether Anscombe's argument succeeds requires scrutinizing both the core application of DDE to the bombings and a powerful objection concerning the description of the act itself. While the consequentialist calculus possesses undeniable pragmatic force, Anscombe's framework compellingly demonstrates that Truman's decision crossed a fundamental moral threshold, constituting murder in her specific sense.

  **Anscombe's Core Argument and the Consequentialist Challenge**

  Anscombe's position rests on two pillars:
  1.  **The Absolute Prohibition:** Deliberately targeting and killing innocent non-combatants is intrinsically evil. No appeal to consequences – not even the prevention of greater future harm – can morally license this act. It violates the absolute respect owed to innocent human life.
  2.  **The Doctrine of Double Effect:** This doctrine provides the crucial distinction. An act that has both good and bad effects is permissible only if:
      *   The act itself is good or neutral.
      *   The *intended* effect is the good one.
      *   The bad effect is not intended, either as an end or as a means to the good end.
      *   There is a proportionately grave reason for permitting the bad effect.

  Anscombe argues that Truman's order fails DDE spectacularly. The *means* chosen to achieve Japan's surrender was precisely the mass killing of civilians. The destruction of the cities, and the terror and death inflicted upon their inhabitants, *was the instrument* used to compel surrender. Therefore, the deaths of the innocent civilians were not merely foreseen but *intended* as the mechanism to achieve the good end. Consequently, Truman is guilty of murder. The consequentialist defense – that the bombings ultimately saved more lives than a land invasion would have cost – is, for Anscombe, morally bankrupt in this context. It attempts to justify an intrinsically evil act (the intentional killing of innocents) by appealing to its consequences, which her framework explicitly forbids.

  **The Redescription Objection: Military Targets and Foreseen Collateral Damage?**

  A significant challenge to Anscombe's conclusion arises from redescribing the bombings to fit within DDE. The objection runs as follows: Hiroshima and Nagasaki *were* legitimate military targets. Hiroshima housed the headquarters of the Japanese Second General Army and was a major military logistics and production center. Nagasaki was a vital industrial port with significant shipbuilding and munitions factories. The *intended* effect of the bombings was the destruction of these military-industrial capacities, weakening Japan's ability to wage war. The deaths of civilians were a *foreseen but unintended* side effect of attacking these legitimate targets. On this view, the bombings *do* satisfy DDE: the act (bombing military targets) is legitimate; the intended effect is military destruction; civilian deaths are foreseen but not intended as the means to surrender; and the grave reason (ending the war swiftly) justifies permitting the collateral damage. If this redescription holds, Truman escapes the charge of murder under Anscombe's own criteria.

  **Evaluating the Redescription and Anscombe's Resilience**

  This objection is powerful but ultimately fails to exonerate Truman under Anscombe's stringent framework for several reasons:

  1.  **Scale, Certainty, and Mechanism:** While the cities contained military assets, the atomic bombs were not precision weapons aimed narrowly at factories or barracks. Their destructive power was city-annihilating. The planners *knew with absolute certainty* that the primary immediate effect would be the indiscriminate incineration of the entire urban population center. The weapon's mechanism *ensured* mass civilian death as its primary destructive output. This sheer scale and certainty shift the act away from "collateral damage" incidental to a military strike towards the deliberate *use* of civilian destruction.
  2.  **The Object of Intention:** Crucially, historical evidence strongly supports Anscombe's interpretation of the *object* of Truman's intention. The Target Committee explicitly prioritized psychological impact and maximizing "spectacular destruction" to shock Japan into surrender. Secretary of War Stimson noted the bomb's purpose was to make "a profound psychological impression on as many inhabitants as possible." The goal wasn't *primarily* the incremental degradation of specific military assets (though that was a benefit); it was the catastrophic *demonstration* of power *upon the civilian populace* to break their government's will. The civilian deaths were not an unfortunate by-product; they were the very engine of the strategy. As Anscombe argues, one cannot intend the terror and capitulation *without* intending the deaths that produce it. The destruction of the cities *was* the means.
  3.  **The Limits of Redescription:** Anscombe anticipates the danger of redescribing inherently immoral acts to make them fit moral rules. She insists we must look at the *real nature* of the act. Describing the bombing of a densely populated city with a weapon of mass destruction as an "attack on military targets" strains credulity when the weapon guarantees the annihilation of the civilian population as its primary and immediate effect. Permitting such a redescription effectively eviscerates DDE, allowing any act of mass killing to be sanitized by pointing to nearby military relevance. Anscombe would argue this objection demonstrates the *corruption* of moral reasoning under pressure, not the validity of the act.

  **Verdict: Murder in Anscombe's Sense**

  Anscombe's argument succeeds against the standard consequentialist defense. Her framework renders the "lives saved" argument morally irrelevant *if* the act involved the intentional killing of innocents as a means. The redescription objection, while initially plausible, collapses under scrutiny of the historical intent, the nature of the weapon, and the strategic objective. The scale of destruction, the certainty of mass civilian death, and the explicit reliance on that destruction's psychological impact as the primary mechanism for surrender confirm that the deaths of the innocent civilians of Hiroshima and Nagasaki were not merely foreseen but *intended* as the means to Truman's end.

  Therefore, within Anscombe's deontological framework, which prioritizes the absolute moral prohibition against directly intending the death of the innocent, Truman's decision **does constitute murder**. The good consequence of potentially saving lives (even if true) cannot cleanse the act of its intrinsic moral character. Anscombe forces us to confront an uncomfortable truth: some acts are so fundamentally evil that they cannot be justified by any calculus of consequences, however compelling that calculus may seem from a purely pragmatic viewpoint. Her verdict on Truman stands as a stark, uncompromising reminder of the absolute limits of warfare, even if one ultimately rejects her absolutism in favor of consequentialism. The bombings may have ended a horrific war, but Anscombe compels us to acknowledge they did so through an act that, on her rigorous definition, was murderous.
