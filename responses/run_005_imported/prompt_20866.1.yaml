answer: |-
  You've pinpointed a profound and often under-explored tension in Moore's *Principia Ethica*. Reconciling the Isolation Test (IT) and the Principle of Organic Unities (OU) requires careful attention to Moore's precise definitions and the specific *bearers* of intrinsic value he identifies. Here's a principled reconstruction aiming for coherence:

  1.  **Clarifying the Target of the Isolation Test (IT):**
      *   The IT asks: "*What things* are such that, if they existed *by themselves, in absolute isolation*, we should yet judge their existence to be good?" (Ch. VI).
      *   Crucially, the "things" being tested are not necessarily simple, atomic states. Moore explicitly tests *complexes* and *wholes* using the IT. For example, he applies it to "the love of beautiful things" itself (a complex state) and finds it supremely valuable *in isolation*.
      *   **The Role of IT:** Its primary function is *epistemological* and *definitional*. It helps us *identify* which specific entities (whether simple states or complex wholes) possess *intrinsic value* (goodness "for their own sake") by stripping away *extrinsic* factors – consequences, accompaniments, and *external* relations. It isolates the *candidate bearer* of value itself from the rest of the universe to see if its existence *alone* would be good.

  2.  **Understanding Organic Unities (OU):**
      *   OU states: "The value of a whole must not be assumed to be the same as the sum of the values of its parts" (Ch. I). Value emerges from the *specific combination* of parts in a way that isn't simply additive.
      *   **The Role of OU:** Its primary function is *structural* and *explanatory*. It explains *how* the intrinsic value we identify using the IT is *constituted* within complex states. It governs the relationship *internal* to the complex whole that is the bearer of intrinsic value.

  3.  **Applying OU to the "Ideal" (Personal Affection & Aesthetic Enjoyment):**
      *   Moore argues that neither the *mere existence* of a beautiful object (cognized or not) nor a *feeling* of admiration/affection *in isolation* possesses significant intrinsic value. The IT applied to these *components alone* reveals them to have little or no intrinsic worth.
      *   However, the *complex whole* – the state of consciousness *involving* the *cognition* of a beautiful object *and* the *appropriate feeling* (admiration, affection) directed *towards it* – *does* possess immense intrinsic value. Applying the IT to *this specific complex whole* reveals its goodness.
      *   OU explains *why* the whole has immense value while the parts alone do not: the value supervenes on the *relation* between the cognition and the feeling within the unified conscious state. The whole is an organic unity where the combination creates value far exceeding the negligible value of the parts considered in isolation.

  4.  **Reconciling IT and OU: The Crucial Distinction (Bearer vs. Components):**
      *   **The Bearer of Intrinsic Value is the Complex Whole:** The IT identifies the *complex state of consciousness* (e.g., "consciousness *of* beauty" meaning the unified experience of cognizing beauty *and* feeling admiration for it, or "personal affection" meaning cognizing a person *and* feeling love for them) as the *bearer* of intrinsic value. *This complex whole* passes the IT: imagining *only* this state of consciousness existing in the universe, it *is* good. Bloomsbury seized on *these complexes* as the supreme goods.
      *   **OU Explains the Internal Structure of the Valuable Whole:** OU operates *within* the complex whole identified by the IT as intrinsically valuable. It explains *why* this complex whole has its immense value: because the *internal relation* between its components (cognition + appropriate emotion) generates value non-additively. The parts *as isolated components* lack significant value (as confirmed by applying IT *to them individually*), but their specific *combination* within the whole *is* what makes the whole intrinsically valuable.
      *   **Isolation Removes *External* Context, Not *Internal* Relations:** The IT strips the *candidate bearer* (the complex whole) of all *external* accompaniments and consequences. However, it *does not* strip the complex whole *of its own internal structure and relations*. When we isolate the state "consciousness *of* beauty," we *include* the cognitive relation to the object and the emotional response as *constitutive parts of that isolated state*. The OU doctrine applies precisely *to this internal structure of the isolated whole*.

  5.  **Resolving the Apparent Tension:**
      *   **The Tension:** "If OU means a part's value depends on the whole, how can IT (isolating the part) tell us anything about its value, since isolation removes it from the whole?"
      *   **The Resolution:**
          *   Moore isn't claiming the *parts* (isolated cognition, isolated feeling) *have* intrinsic value that *depends* on the whole. He's claiming they *lack* significant intrinsic value *when isolated*. The IT applied *to them* shows this.
          *   The *intrinsic value* belongs *only* to the *complex whole*. The IT applied *to this whole* reveals its intrinsic value.
          *   OU explains *how* that complex whole gets its value: through the non-additive combination of its components. The value depends on the *internal relations* within the whole *itself*. The IT isolates the *entire complex* (including its internal relations) from the *external* universe. It doesn't destroy the internal relations constitutive of the organic unity; it removes distracting external factors so we can see the value generated *by* those internal relations clearly.

  **Conclusion: A Coherent (Though Nuanced) Reading**

  Moore is not running incompatible pictures together. The IT and OU serve distinct but complementary roles:

  1.  **IT (Identification):** Identifies which *specific entities* (complex states of consciousness) possess intrinsic value by considering them *in isolation from external factors*. The supreme goods (affection, appreciation of beauty) *are these complexes*.
  2.  **OU (Explanation):** Explains *why* these identified complexes possess such immense intrinsic value. Their value arises non-additively from the *specific internal relations* between their components (cognition + appropriate emotion), relations which are *included within the isolated complex* tested by the IT.

  **The tension dissolves when we see that the IT isolates the *whole complex* that is the bearer of value (including its internal relations), while OU explains the *source* of that value *within* the structure of the isolated complex.** The "dependence" OU describes is an *internal*, constitutive dependence *within the valuable whole*, not an *external* dependence on something stripped away by isolation. Moore's application in "The Ideal" is therefore consistent: the isolation test reveals the intrinsic value of the complex wholes (organic unities) of affection and aesthetic appreciation, and the principle of organic unities explains *why* those wholes possess such supreme value despite their parts lacking significant value in isolation. The Bloomsbury Group was right to focus on these complexes as Moore's supreme goods, though understanding the precise interplay of IT and OU reveals the deeper, non-reductive structure of that value.
