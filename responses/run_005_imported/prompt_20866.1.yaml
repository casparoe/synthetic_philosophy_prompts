  Also, Moore distinguishes between intrinsic value and contributory value. A part might have little intrinsic value alone but contribute significantly in a whole. The isolation test identifies intrinsic value in wholes, while organic unities explain how parts contribute non-additively. The user might need to clarify that the test's purpose is to identify bearers of intrinsic value, which are wholes, not necessarily their components.

