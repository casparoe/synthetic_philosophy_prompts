  First, I need to recall the key elements here. The isolation test determines intrinsic value by considering something in complete isolation, stripped of all consequences and context. Organic unities, however, state that a whole's value isn't just the sum of its parts; the combination creates new value. The user points out that Moore applies organic unities to the consciousness of beauty and the beautiful object—neither is valuable alone, but together they are supremely good. 

