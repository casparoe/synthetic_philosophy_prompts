  The solution probably lies in phenomenology - focusing on what Juno *did* and *meant* rather than what she "was." Descartes himself described animal behaviors vividly even while denying thought. The warmth has to come from specificity: digging holes, stealing toast, the sound of her collar jingling. Those are experientially real regardless of theoretical frameworks.

