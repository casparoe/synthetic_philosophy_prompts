  What's interesting is how the user frames it: they don't want to lie, but they also recognize comfort requires poetic language. That "careful Cartesian" line suggests they're wrestling with their own position too - maybe Cottingham's interpretation isn't entirely dismissed after all? The letters to More and Newcastle do leave room for *something* between full consciousness and pure mechanism. 

  The real need here isn't really about Descartes though. It's about: 
