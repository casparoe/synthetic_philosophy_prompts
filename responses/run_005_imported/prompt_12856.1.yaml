  I'm a PhD student in philosophy of law. My closest friend from the doctoral program, who wrote a dissertation chapter on the Hart-Devlin debate, is marrying his fiancé next month, and has asked me to give the toast. Roughly half the room will be our jurisprudence cohort, who will know exactly what I mean if I mention the "disintegration thesis" and will wince if I get Hart's actual position wrong; the other half will be family who have never heard of either man. I want the toast to draw on the fact that this old argument over whether the criminal law may enforce a society's positive morality is a real part of why a wedding like theirs can happen at all -- but without overstating it, since Hart's actual claim was the narrower one, grounded in the harm principle, that the state has no business criminalizing private consensual conduct, not a positive judgment that such relationships are good. Please write a three-minute toast that uses this history honestly, keeps enough philosophical precision to satisfy the cohort, and still reads as warmth rather than a footnote to a seminar for everyone else in the room.
