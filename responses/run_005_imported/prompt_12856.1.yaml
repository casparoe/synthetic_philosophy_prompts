answer: |-
  Here’s a toast that honors your friend, navigates the Hart-Devlin debate with precision for the cohort, translates it into warmth for families, and centers the couple’s love:

  **(Raise your glass, smile warmly at the couple)**  

  "Friends, family, esteemed colleagues in jurisprudence… and especially [Partner's Name], welcome to this truly joyful day. [Friend's Name], my dear friend, seeing you stand here, beaming with happiness beside the love of your life, fills me with so much pure, uncomplicated joy.  

  Now, as many of you know, [Friend] and I spend a lot of time thinking and arguing about law, morality, and the lines between them. He’s even written brilliantly about a famous debate between two legal philosophers, H.L.A. Hart and Lord Patrick Devlin, that raged decades ago.  

  **(Pivot to the core idea, accessible to all)**  
  That debate asked a fundamental question: **Should the law enforce a society’s shared moral beliefs just because they’re widely held?** Devlin argued yes, fearing that without it, society itself might crumble – the 'disintegration thesis'. Hart, rigorously and powerfully, argued **no**. His core point wasn't necessarily that every private choice was *good*, but that the state had **no right to criminalize private, consensual conduct that caused no harm to others**. He believed in drawing a protective wall around a private sphere of life.  

  **(Connect directly to the couple and the moment)**  
  Why mention ancient academic arguments at a wedding? Because that debate – that hard-fought insistence on the **freedom to live and love privately, free from the imposition of majority morality through criminal law** – is part of the very foundation that makes a celebration like *this* possible. Hart’s defense of that private sphere wasn’t about endorsing any specific love; it was about fiercely protecting the *space* where love, in all its diverse and beautiful forms, could simply *exist* and flourish without fear of state punishment.  

  **(Shift fully to celebration and the couple’s story)**  
  That protected space is where [Friend's Name] and [Partner's Name] found each other. It’s where their private choices, their private joys, their private commitment could grow into something so strong, so beautiful, and so *publicly* worthy of celebration that we’re all here today. They didn’t need the law’s permission to fall in love, but the principle Hart championed helped ensure the law wouldn’t stand *in their way*.  

  **(Focus on the present joy and future)**  
  So today, we celebrate not just the triumph of their love, but also the triumph of an idea: that the deepest, most personal parts of our lives – who we love, how we build our families – deserve respect and protection, not judgment enforced by the state. [Friend] and [Partner], your love story is uniquely yours, a testament to your incredible bond. But it also stands, beautifully, within that space of freedom that thinkers like Hart fought to defend – the space where private happiness becomes a public cause for joy.  

  **(Raise glass higher)**  
  So let’s raise our glasses! To [Friend] and [Partner]: May your private joys continue to deepen and enrich each other every single day. May your public commitment, celebrated here today, inspire everyone who knows you. And may your life together be filled with all the love, laughter, and profound happiness you so richly deserve. To the newlyweds!"

  **Why this works:**

  1.  **Accuracy for the Cohort:**
      *   Clearly names Hart & Devlin and the core question.
      *   Accurately defines Devlin's "disintegration thesis."
      *   Precisely states Hart's position: **focus on *no state right to criminalize private, consensual, harmless conduct*** (the harm principle basis). Explicitly avoids claiming Hart endorsed specific relationships ("wasn't necessarily that every private choice was *good*").
      *   Uses the key phrase "private sphere" and "space" central to Hart.
      *   Correctly frames the outcome as creating *space* and *freedom from interference*, not positive endorsement.

  2.  **Accessibility & Warmth for Families:**
      *   Opens and closes with pure celebration and focus on the couple.
      *   Explains the debate in plain language: "Should the law enforce shared moral beliefs?", "freedom to live and love privately," "protective wall," "space where love... could exist."
      *   Connects the abstract idea directly and repeatedly to the couple's love and the joy of the day ("makes a celebration like *this* possible," "found each other," "grow into something... publicly worthy of celebration").
      *   Emphasizes universal values: freedom, privacy, respect, joy, commitment.
      *   Uses warm, celebratory language throughout ("pure joy," "beautiful," "triumph," "inspire," "profound happiness").

  3.  **Honest Connection:**
      *   Doesn't overstate Hart. Focuses on the *negative freedom* (freedom *from* state interference) enabling private choices like this relationship to exist safely.
      *   Positions the debate as foundational groundwork ("part of the very foundation," "helped ensure the law wouldn’t stand *in their way*"), not the sole or direct cause.
      *   Honors the couple's journey within that protected space.

  4.  **Structure & Tone:**
      *   Starts warm (personal joy).
      *   Explains the debate concisely but accurately.
      *   Makes the crucial connection ("Why mention this...?").
      *   Focuses intensely on the couple and their love story within that context.
      *   Ends with a purely celebratory toast.
      *   Maintains a warm, sincere, and slightly elevated (but not stiff) tone suitable for a wedding.

  This toast allows the cohort to nod appreciatively at the nuanced accuracy while the families hear a heartfelt tribute to the freedom that allows their loved ones' love to shine, all centered on celebrating the couple. Good luck!
