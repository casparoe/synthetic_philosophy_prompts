prompt: |-
  I spent almost forty years doing experimental nuclear physics before I retired, and these days I've fallen into reading philosophy in my spare time — mostly epistemology, since it's the part that feels closest to what I used to actually do for a living. A couple months back my grandson (he's doing a CS/AI masters) mentioned something called "logical induction," apparently out of the AI-safety crowd (Garrabrant an a few others, I think, maybe around 2016?), and I've been chewing on it ever since without ever quite feeling like I've got it.

  Here's where I'm stuck. I understand, in the abstract, that ordinary Bayesian probability theory assumes "logical omniscience" — a perfect reasoner is supposed to instantly assign probability 1 to every theorem and treat logically equivalent statements as identical, which is obviously impossible for any finite mind, since plenty of mathematical truths take real work (or are entirely unknown) to derive. But that's the kind of thing I can nod along to without really feeling the bite of it, the way I can feel an actual measurement uncertainty in my bones after decades in the lab.

  So could you give me a genuinely concrete example? I want two claims that are provably equivalent, so that a perfect reasoner would have to treat them as the same statement, but where it still seems perfectly rational for a bounded reasoner, before doing the relevant proof, to assign them noticeably different credences. Then, if you don't mind, walk me through roughly how a logical inductor's credence in each claim would move over "deductive time" as it thinks longer about them, and why that's a genuinely different animal from how I'd update my belief about a decay rate as more counts come in off a detector. I keep wanting to say "well, just call anything you're unsure about 50/50 until proven otherwise," but I gather thats exactly the kind of scheme that gets torn apart by the trader/market argument in the actual paper, and I don't fully see why a scheme that sounds so sensibly agnostic would end up being irrational.
