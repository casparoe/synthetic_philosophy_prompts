prompt: |-
  So we had student council today and I'm still kind of annoyed about it, figured I'd write it out instead of just complaining to my friends lol. I'm the sophomore class rep and our school's letting us hold an actual student vote on whether to switch from our normal 7 period day to a block schedule (4 longer classes) starting next year, instead of admin just deciding it top-down, which sounds nice in theory except literally nobody agrees on who should even get to vote in it. The senior class president thinks current seniors shouldn't have to bother voting since they'll already be graduated before it ever takes effect, but then half the senior class still wants a vote anyway because they've "been here the longest" and feel like they've earned a say regardless. Meanwhile the 8th graders coming in as freshman next year, aka the literal first class that has to live with this thing for all 4 years, don't get a vote at all right now since they're not technically enrolled yet, which feels backwards to me. And then theres our vocational-program kids who are only physically at our school for like 2 classes a day since they spend the rest at the tech center across town, and a couple council members think their vote should count for less since the new schedule effects them less than it does everyone else.

  Could you actually write this up like a memo I could read out at our meeting Tuesday, like something with a real recommendation and the reasoning behind it, not just "here's 3 options, you pick"? I want it to defend an actual rule for who counts as a legit voter here that we could just reuse, because I already know this exact fight is gonna happen again with prom or the dress code or whatever comes up next. Also please don't dodge the "why should people who won't even be here for it get a vote" argument, since that's honestly the strongest card the senior class president has and I don't want us to just wave it away.
