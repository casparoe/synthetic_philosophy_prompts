  **Note on contemporary intuitions:** The placements of (e) (protecting property) as more sinful than (b) (preventing sexual assault) and (f) (saving a life) as the least sinful but still a "sin" will likely clash with modern ethics, where lying to prevent grave bodily harm or death is often seen as obligatory or justified, not inherently wrong. Augustine's rigorism, which never permits lying but grades sins by the good protected, leads to this hierarchy.
