  ### Justifications:
  1. **Owen (Statement 1): Score 1 (Mostly right)**  
     Correctly identifies disparate impact as a fairness concern. Non-defaulters in Group B face unnecessary friction, which is practically harmful. However, forcing equal flag rates *without addressing root causes* risks creating new inequities (as Naomi later argues).

  2. **Naomi (Statement 2): Score 2 (Clearly right)**  
     Calibration (equal predicted/actual risk across groups) is a key fairness metric. Equalizing flag rates among non-defaulters would require applying stricter thresholds to Group B *for the same risk score*, effectively penalizing them for their group membership—a textbook case of unfairness.

  3. **Owen (Statement 3): Score 2 (Clearly right)**  
     Highlights a critical flaw in relying solely on calibration: if historical labels/features are biased (e.g., due to past discrimination), "calibration" may entrench injustice by treating biased data as ground truth. Base rate differences *can* reflect systemic inequities.

  4. **Naomi (Statement 4): Score 1 (Mostly right)**  
     Correctly argues that fixing biased data upstream is more principled than forcing equal outcomes downstream. Equal flag rates would unfairly disadvantage *individuals* at the threshold margin. However, her claim that this "can't be implemented without conditioning on group" is overstated (group thresholds don’t require per-applicant disclosure).

  ### The Bigger Picture: What’s Being Traded Off
  Both miss a core tension between **group fairness** (Owen’s concern) and **individual fairness** (Naomi’s concern).  
  - **Owen** prioritizes equal *outcomes* (reduced burden on non-defaulting Group B).  
  - **Naomi** prioritizes equal *treatment* (identical risk scores → identical outcomes).  

  **The deeper trade-off is:**  
  🔹 **Correcting historical bias** (Owen’s goal) vs.  
  🔹 **Preserving merit-based decisions at the individual level** (Naomi’s goal).  

  **What both overlook:**  
  - **Causal structure:** Is the default rate difference due to inherent risk or systemic barriers (e.g., past credit denials)? If the latter, *neither* calibration nor equal flag rates ensure fairness.  
  - **Downstream harm:** Manual underwriting isn’t inherently "unfair" if justified by risk—but if it causes loan denials or delays due to human bias, Owen’s concern amplifies.  
  - **Third-way solutions:** E.g., building better features to explain Group B’s risk, or using fairness constraints that minimize harm without group thresholds.  

  ### Recommendation
  Naomi’s approach (fix data/labels) is more sustainable but may take time. Owen’s solution is a band-aid that risks new inequities. **Audit why Group B’s base rate is higher:** if bias is confirmed, correct labels/features *first*. If the gap persists and reflects real risk, accept that unequal flag rates may be fair—but monitor human underwriting for bias.
