prompt: |-
  I've read enough Less Wrong and adjacent blogs that the basic pitch of updateless decision theory feels familiar, but one part of it has never sat right with me. In cases like counterfactual mugging, an agent that conditionalizes on new evidence and maximizes expected utility relative to the resulting posterior ends up refusing to pay Omega once it has learned that the coin came up tails, since paying can no longer benefit it; UDT is supposed to avoid this by having the agent evaluate its entire policy against its original, unconditional prior instead. But the policy an updateless agent settles on still assigns a different action depending on whether it learns the coin came up heads or tails, so its behavior obviously tracks what it observes. In what sense, then, has it avoided updating on that observation, rather than simply updating on it and calling the result a "policy" instead of a posterior-guided choice? Is there a substantive difference between updating one's beliefs and updating one's policy, or does "updatelessness" just amount to ordinary Bayesian conditionalization performed in advance and relabeled?
reasoning: |-
  Okay, the user is grappling with the concept of updateless decision theory (UDT) and its distinction from standard Bayesian updating. They're familiar with counterfactual mugging and how UDT handles it, but they're confused about whether UDT is just relabeling ordinary conditionalization. Let me unpack their question.

  First, they point out that in counterfactual mugging, an agent who updates on evidence (like the coin flip result) refuses to pay Omega when the coin is tails because it doesn't benefit them. UDT avoids this by evaluating the entire policy upfront. But the user notes that the policy still depends on observations—heads vs. tails—so it seems like updating is happening anyway. Their core question: Is UDT substantively different, or is it just precomputed updating?

  Hmm, I need to clarify the key differences. The user might be conflating the update on observations with the update on the state of the world. In UDT, the agent doesn't update their beliefs about the world state upon observation. Instead, they commit to a strategy that maps observations to actions, evaluated under the prior. 

  The user's deeper concern might be about the philosophical distinction. They might be skeptical if UDT offers a real solution or just a semantic trick. I should emphasize how UDT handles counterfactuals and acausal scenarios differently. For example, in counterfactual mugging, paying in the tails scenario affects the prior expectation because Omega's simulation in the heads world is considered. A standard Bayesian would ignore this because they condition on the actual world.

  Also, the user might be interested in the implications for rationality. UDT's approach prevents self-sabotage in cases like Parfit's hitchhiker, where conditioning on being rescued leads to defection. UDT's policy approach ensures cooperation, which aligns with long-term goals. This shows a practical difference beyond relabeling.

  I should address their point about the policy tracking observations. Yes, the action depends on the observation, but the decision isn't based on updated beliefs. The mapping is fixed by the prior evaluation of all possible strategies. The difference is in when and how the expected utility is calculated—before any observations, considering all possible paths.

  The user's background in Less Wrong suggests they've encountered these ideas but need a clearer distinction. They might value concrete examples or scenarios where UDT and standard updating diverge. Highlighting the acausal aspects, like simulations or logical dependencies, could help. Also, stressing that UDT's policy is chosen once and for all, without later belief updates, might clarify the updatelessness.
answer: |-
  You've pinpointed a core conceptual tension in UDT, and your skepticism is well-founded. The distinction is subtle but substantive, lying in *when* and *how* expected utility is calculated, and what the object of optimization is. Let's break it down:

  1.  **The Core Difference: Optimization Object & Calculation Time:**
      *   **Standard Bayesian Agent (Conditionalizing):**
          *   **Optimizes *actions* based on *updated beliefs*.** Upon receiving evidence `E`, it updates its belief state (`P(H|E)`).
          *   **Calculates expected utility *after* updating.** It asks: "Given what I now know (`E`), what action *now* maximizes my expected utility?" (`max_a E[U | E, a]`).
          *   **Myopic to the counterfactual.** It only considers worlds consistent with `E`. In tails-counterfactual mugging, `E = Tails`. Paying helps *only* in Heads worlds, which are now ruled out (`P(Heads|Tails) = 0`). Paying has negative utility *given `E=Tails`*.
      *   **Updateless Agent (UDT):**
          *   **Optimizes *policies* (strategies) based on the *original prior*.** Before *any* observation, it considers all possible policies (functions `f: Observation -> Action`).
          *   **Calculates expected utility *once*, *before* any observation.** It asks: "Which *entire plan* `f`, specifying what I'll do in *every possible circumstance I might find myself in*, maximizes my *original* expected utility?" (`max_f E[U | f]`, where the expectation is over the *full prior* `P`).
          *   **Considers the *whole tree*.** It evaluates the policy by averaging its outcomes over *all* possible observations/worlds weighted by their prior probability. Paying in the Tails branch *is costly in that branch*, but the policy of paying *only when told Tails* also includes the crucial fact that *if* the coin was Heads (which the agent *in the Heads branch* observes), Omega *would have* correctly predicted this policy and thus paid the $10,000. This acausal/counterfactual benefit is included in the *prior* expectation calculation.

  2.  **Addressing Your Key Point: "It Still Tracks Observations!":**
      *   **Yes, absolutely.** The *policy* `f` output by UDT is explicitly a function from observations (like `Heads`/`Tails`) to actions (like `Pay`/`Don't Pay`). Its behavior is contingent on what it sees.
      *   **The "Updatelessness" Refers to the *Belief State* Used for Optimization:**
          *   The UDT agent **does not update its *fundamental belief state* (the prior `P` over world states, including unobserved ones)** upon receiving an observation. It *uses* the observation as an input to its *pre-selected policy function* `f`.
          *   Crucially, **the *value* of the policy `f` was determined *before* seeing any evidence, by averaging over *all* possibilities according to the prior `P`.** The observation `E` simply tells the agent which *branch* of its pre-committed plan `f` it is currently executing. It doesn't recalculate what the best action is *given `E`*; it just executes `f(E)`.
          *   **Analogy:** Imagine programming a robot *in advance* for all scenarios. You write code: "If sensor reads X, do A; if sensor reads Y, do B." You optimize *the whole program* based on your best model of the world *before deployment*. The robot executes conditionally (tracking sensor input), but *it* never "updates" its core programming or recalculates the best action on the fly based on a new belief state. Its "belief" is fixed in the code. UDT is like designing that optimal program *for yourself* before you know which situation you'll be in.

  3.  **Substantive Difference: Where the Magic Happens (Counterfactuals & Acausality):**
      *   **Counterfactual Mugging:** This is the crux.
          *   **Bayesian Agent:** Conditions on `Tails`. Sees only the `Tails` world where paying $100 gains nothing. Refuses.
          *   **UDT Agent:** Evaluates policies *before* the flip. Considers policy `f_pay`: `(Heads -> Do Nothing; Tails -> Pay)`. Prior expectation: `E[U | f_pay] = P(Heads)*U(Heads & Do Nothing) + P(Tails)*U(Tails & Pay)`. Crucially, `U(Heads & Do Nothing)` **includes the $10,000 from Omega**, *because Omega simulated this policy `f_pay` and saw it would pay on Tails*. `U(Tails & Pay) = -$100`. If `P(Heads) = 0.5`, `E[U] = 0.5 * $10,000 + 0.5 * (-$100) = $4,950`.
          *   Compare to `f_dont_pay`: `(Heads -> Do Nothing; Tails -> Don't Pay)`. `E[U] = 0.5 * $0 + 0.5 * $0 = $0` (Omega doesn't pay because it simulated refusal on Tails). `f_pay` wins.
          *   **The Difference:** The UDT agent pays *in the Tails branch* because it's *part of a plan* that, *evaluated under the prior*, yielded a high expected utility *by securing the $10k in the counterfactual Heads branch*. The Bayesian agent, by updating and conditioning *only* on the actual world (`Tails`), cannot access or value the benefit secured in the counterfactual world. UDT's "updateless" prior evaluation allows it to "bind" itself to actions that are locally costly but globally beneficial across the branching structure defined by the prior.

  4.  **Is it Just Relabeled Precomputation?**
      *   **Partially, but crucially extended.** Yes, UDT involves precomputing the best response for every possible observation *in advance*.
      *   **However, the *key innovation* is *what it optimizes over and what it includes in the expectation calculation*.**
          *   It optimizes over *strategies/policies*, not single actions.
          *   It calculates the expected utility of a strategy by averaging over the *entire prior*, including *counterfactual branches* that the agent will *know* are false once it observes `E`.
          *   **This inclusion of counterfactuals is essential** and is what allows it to handle dilemmas like Counterfactual Mugging, Parfit's Hitchhiker, or Newcomb-like problems with perfect predictors (where the predictor relies on simulating your *policy*, not your *updated-belief-dependent action*).
      *   A purely Bayesian agent doing "precomputation" would calculate `f(E) = argmax_a E[U | E, a]` for each possible `E`. This is just computing its future updated-belief actions in advance. In Counterfactual Mugging, this precomputation would *still* tell it to refuse on Tails (`E[U | Tails, Pay] = -$100`; `E[U | Tails, Refuse] = $0`). UDT's calculation (`max_f E[U | f]`) is fundamentally different because the expectation `E[U | f]` includes the weighted outcomes of `f` applied in *all* branches, not just the branch corresponding to the observation `E`.

  **In Summary:**

  *   **Yes, UDT agents condition their *actions* on observations.** This is necessary for intelligent behavior.
  *   **The "updatelessness" refers to the *belief state used to select the optimal policy*.** UDT selects its entire strategy (the mapping from observations to actions) *once, upfront*, using the *original, unconditional prior* that includes all possible worlds and observations. It does *not* recalculate the optimal strategy or action *after* updating its beliefs based on new observations.
  *   **The substantive difference lies in:** 
      *   Optimizing *policies* instead of single actions.
      *   Evaluating the policy's utility by averaging over the *full prior distribution* (including counterfactual branches), not a posterior conditioned on the current observation.
  *   **This difference enables UDT** to consistently "cooperate" in dilemmas involving counterfactuals, acausal dependencies, and perfect predictors where standard conditionalization leads to self-defeating behavior (like refusing in Counterfactual Mugging Tails, or one-boxing in Newcomb but only if you can precommit, failing to precommit). It captures the idea that your *decision rule* can have consequences in worlds you will never observe.

  So, while the execution *looks* like conditionalization, the *justification* and *selection mechanism* for the policy are fundamentally different from a Bayesian agent who updates and then acts optimally based on the posterior. It's not *just* relabeling; it's a different computational and philosophical approach to linking knowledge, action, and counterfactual reasoning.
