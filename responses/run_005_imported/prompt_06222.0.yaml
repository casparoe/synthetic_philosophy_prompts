prompt: |-
  ok so weird situation: I've lurked LW and the EA forum for like fifteen years and never thought I'd actually need any of that for a job, but here we are — I somehow ended up on the allocations committee for a tiny foundation that funds "long-shot" projects, the speculative high-variance stuff normal grantmakers won't touch, everything from fringe x-risk research to some guy's plan to seed clouds over the Sahara. I have to give opening remarks at our quarterly workshop where applicants pitch us, and the room's split: half the committee are old LW lurkers who basically have "Pascal's Muggle" and the leverage penalty memorized, the other half are rich donors who get's twitchy the second anyone says "expected value."

  Need about 5 minutes, no bullet points, has to actually sound like a person talking, not a book report on Pascal's mugging for the newbies (the LW half will clock that instantly and it'll read as condescending). What it really needs to do is give the room a usable decision rule: can't say "always shut up and multiply," because that's a mugging machine and the first guy who claims his project saves 3^^^3 lives walks off with our whole endowment, but also can't say "just ignore tiny probabilities," because that guts the entire point of the foundation. If it wants to lean on something like a bounded utility function or a leverage-penalty type move, fine, but it should own what that costs us, not pretend the problem's solved. Can you write it?
reasoning: |-
  Okay, let me unpack this user's request. They're in a fascinatingly tricky position - a longtime LW/EA lurker suddenly thrust into real-world grant allocation with a polarized committee. The core tension jumps out: how to honor the foundation's purpose (funding high-variance moonshots) while avoiding both Pascal's mugging and cowardly probability neglect. 

  Hmm... what's not being said but implied: they need to legitimize both worldviews in the room. The LW crowd needs math-adjacent rigor, the donors need guardrails against absurdity. And crucially, the solution must feel organic - no jargon dumps, no false precision. 

  I'm noticing three latent needs: 
  First, psychological safety - the remarks must prevent factionalism when evaluating wild proposals. 
  Second, conceptual scaffolding - a decision heuristic robust enough for quantum resurrection studies and cloud-seeding alike. 
  Third, epistemic humility - openly acknowledging the framework's tradeoffs instead of papering over paradoxes. 

  *flips mental model* What if we reframe "bounded utility" as strategic focus? That avoids drowning in infinity while preserving tail-risk appetite. The leverage penalty angle is tempting but might alienate donors - better to position it as bandwidth constraints. 

  *scribbles metaphor* Foundation as lighthouse keeper resonates - scanning horizon for improbable signals, but with finite lamp oil. Nods to their niche without overclaiming. 

  Key structural moves: 
  Open with shared purpose to disarm tension. 
  Introduce the triage framework as natural consequence of their mission. 
  Make explicit what's sacrificed (true tail-end coverage) as strength. 
  Embed the math in story - "one in a million shots" lands better than "log probabilities." 

  *checks pitfalls* Must avoid: 
  - Sounding like a rationality pamphlet (condescending to LWers) 
  - Oversimplifying EV calculations (insulting to donors' intelligence) 
  - False neutrality ("just balance both" is useless) 

  Ah - the closing note is vital. Emphasize that imperfect tools demand sharper epistemic vigilance. That satisfies LWers' rigor itch while giving donors permission to reject insanity dressed as profundity. 

  *stress-tests* Would this have funded: 
  - Early cryonics? (Probably - bounded impact) 
  - Dyson sphere proposal? (No - infinite claims trigger penalty) 
  - Pre-regulation AI alignment? (Yes - concrete leverage path) 

  Seems robust. Now to weave in the Sahara cloud-seeding example for grounding... done. Final touch: "we're the people who say 'maybe'" as mission statement. That's the sticky idea they'll remember during pitches.
answer: |-
  Here’s a 5-minute opening remarks draft that threads your needle—honest about the tension, grounded in your foundation’s purpose, and actionable without jargon. It subtly embeds a leverage-aware, impact-bounded heuristic while sounding human:

  ---

  "Welcome, everyone. We all know why we’re here: this foundation exists because *some ideas are too weird, too early, or too fragile to survive anywhere else*. We’re not just funding experiments—we’re betting on human imagination when the stakes are uncertain and the odds are long. That’s our purpose. And that means our job today is messy. Beautifully, unavoidably messy.  

  We’ll hear proposals today where the math gets eye-watering—projects claiming astronomical upsides against infinitesimal odds. And we’ll hear others where the sheer creativity takes your breath away, even if the numbers stay stubbornly small. Our challenge? To navigate between two cliffs:  

  On one side: turning ourselves into a mugging factory. If we just chase the highest theoretical number without asking *how* or *why*, we’ll fund vapor. On the other: playing it so safe we strangle the daring work we exist to support. If we dismiss every tiny probability just because it’s tiny, we may as well be a bank.  

  So here’s the rule of thumb we’ve earned the hard way: **We fund long shots that can prove they’re real shots.**  

  What does that mean? Three things:  

  First: **Show us the scaffolding.** How does your ‘maybe’ connect to a concrete step? If you’re seeding clouds over the Sahara, show us the atmospheric model. If you’re hacking a pandemic early-warning system, show us the prototype. We don’t need certainty—we need plausibility built brick by brick.  

  Second: **Keep the scale human.** Claims of universe-saving impact set off alarm bells for a reason. We’re not wired to weigh infinities. So ask: If this works, could we *point* to what changed? A policy shifted? A community thriving? A tool in the hands of people who need it? Impact we can comprehend keeps us honest.  

  Third: **Own the downside.** If this fails—and most long shots do—what’s left? A team that’s stronger? A method others can borrow? A lesson that shifts the field? We don’t just fund outcomes; we fund builders who leave wisdom in their wake.  

  This isn’t a perfect filter. We’ll miss some cosmic-scale ideas that might’ve worked. We’ll fund some grounded projects that go nowhere. That’s the cost of avoiding both muggings and cowardice. But when we get it right? We don’t just fund outliers—we create permission for the next ones.  

  So today: Listen for the scaffolding. Look for the human-scale pulse. Reward the builders. And let’s find some glorious, improbable bets worth taking.  

  Let’s begin."  

  ---

  ### Why this works:
  - **Baked-in heuristic:** "Scaffolding + human scale + downside ownership" is a leverage-penalty/impact-bound in disguise, framed accessibly.  
  - **Acknowledges tradeoffs:** Explicitly says this approach will miss some high-variance ideas (satisfies LWers) but defends it as necessary to avoid nonsense (reassures donors).  
  - **No condescension:** Uses "we" language, avoids LW jargon ("Pascal," "muggle," "SUMC" never appear), and focuses on concrete asks.  
  - **Mission-centered:** Framed as protecting the foundation’s purpose, not imposing external ideology.  
  - **Actionable:** Gives committee members 3 filters to apply during pitches, creating shared language.  

  The LW half will recognize the strategic boundedness; the donor half will appreciate the guardrails against absurdity. Both hear: "We take wild ideas seriously—but seriously *well*."
