answer: |-
  That's a profoundly human dilemma, and the answer is layered. Both your perspective and your mentee's hold truth, but her feelings are valid and require careful handling. Here's why it matters and how to navigate it:

  ### Why Her Hurt Matters (Even Though You Changed)
  1.  **Trust & Authenticity in Mentorship:** Mentorship is fundamentally built on trust and perceived authenticity. Learning your initial motivation was purely transactional retroactively taints the *origin story* of your relationship. It makes her wonder: "Was anything genuine at the start? Was I just a means to an end?" Even if your feelings changed later, the foundation feels shaky.
  2.  **The Power of "Why":** Human connection thrives on perceived shared purpose and care. Knowing your "why" shifted from *your* needs (money, resume) to *her* needs (her book, her growth) is crucial. Her discovering the *original* "why" feels like a betrayal of that implied care.
  3.  **Vulnerability of the Debut Writer:** Debut authors are incredibly vulnerable. Sharing their work is deeply personal. She likely poured her heart into it for you. Discovering your initial lack of investment feels like a dismissal of that vulnerability when she was at her most exposed.
  4.  **Perception vs. Reality:** Your *later* actions were genuine and generous. But the *revelation* of the initial motive casts a shadow backward. It makes it harder for her to fully trust the sincerity of *any* of your praise or criticism, wondering if it was ever truly about *her* work or just your own evolving sense of obligation or ego.

  ### Why Your Change *Also* Matters
  1.  **Actions Speak Loudest:** You *did* go far beyond the contract. Midnight texts and unpaid hours are tangible proof of genuine engagement and care *that developed*. This wasn't faked; it was real investment that emerged.
  2.  **Growth is Real:** Your shift in motivation is a testament to *her* work, *her* potential, and *your own capacity for genuine connection and professional dedication*. It shows you were open to being moved and invested. That growth is significant and shouldn't be dismissed.
  3.  **The Work Benefited:** Regardless of your initial motives, the *result* was dedicated, high-quality mentorship that likely significantly improved her manuscript. The value delivered was real.

  ### The Core Question: Does the "bad start" invalidate the "good finish"?
  *   **For you?** Probably not. You know the effort and care you eventually poured in. Your conscience should be clear on that count.
  *   **For her?** It *can* feel like it does, or at least tarnishes it significantly. **Her feelings are her reality.** The initial lack of authentic care, once revealed, becomes a lens through which she re-examines the entire experience. It introduces doubt where there was trust.

  ### What To Do (The Hard Part - Suppress the Defense)
  1.  **Listen & Validate (Crucially):** Don't argue, defend, or explain *yet*. Start with: "I hear how deeply this hurts you, and I am so sorry my initial reasons for taking the gig have caused you this pain. I completely understand why learning that makes the whole experience feel hollow and retroactively undermines the trust you placed in me. Your feelings are absolutely valid." Acknowledge the breach of trust.
  2.  **Take Full Ownership:** "You're right. My initial motivation *was* primarily financial and career-oriented. That was selfish and unfair to you entering into a mentorship relationship. I own that completely, and I apologize sincerely for that lack of authentic commitment at the start."
  3.  **Explain the Shift (Without Excusing the Start):** *After* validating and apologizing, you can share your experience: "What I need you to know, though, is that something significant changed for me as I worked with you and your manuscript. [Be specific if possible - e.g., 'I got hooked by Chapter 3,' 'Your character's voice captivated me,' 'Your dedication inspired me']. The work became genuinely compelling to me, *you* became someone I genuinely wanted to help succeed. That's why I ended up pouring in so much extra time and effort – not out of obligation, but because I truly cared about the book and wanted to see it shine. My initial reasons were wrong, but my commitment became very real."
  4.  **Focus on Her & Her Work:** "I know this doesn't erase how this revelation makes you feel now, and I deeply regret that. What I hope you can hold onto, even if it's hard, is that the work *we* did on *your* manuscript *was* done with real care and focus in those later stages. My belief in the book and in you as a writer became genuine."
  5.  **Offer Space/Ask What She Needs:** "I understand if you need some space from this or from me. Is there anything I can do now, even belatedly, to try and make this right or support you moving forward?"

  ### Key Takeaways
  *   **Her hurt is legitimate:** The foundation of trust was damaged by the revelation of your initial motives.
  *   **Your genuine later investment is also real:** It doesn't erase the start, but it is a powerful counterpoint.
  *   **Defensiveness will backfire:** It invalidates her pain. Lead with empathy and ownership.
  *   **The "why" matters deeply in relationships:** Especially in vulnerable, creative partnerships like mentorship.
  *   **Growth is meaningful:** Your change *is* significant, but it doesn't retroactively sanctify the initial selfishness. Both truths coexist.

  **Yes, your initial reason matters.** It introduced a stain on the relationship's origin. **But your genuine evolution and dedication matter more in terms of the actual value delivered.** The challenge is acknowledging the first caused pain while hoping the second can ultimately be what she remembers, even if the memory is now bittersweet. How she ultimately processes this depends on her, but your approach – humble, validating, and owning your growth – gives her the best chance to reconcile the two truths.
