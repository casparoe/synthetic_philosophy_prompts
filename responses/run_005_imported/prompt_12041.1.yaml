prompt: |-
  I'm a third-year philosophy major taking a seminar this term on the philosophy of mathematics that has spent the last few weeks working through the Lucas–Penrose debate, from Lucas's 1961 paper through the more careful argument Penrose develops in Shadows of the Mind, along with the responses both provoked. I also co-host a small student-run podcast on philosophy of mind, and next month we're recording an episode with a philosopher of mathematics who has just published a monograph reviving and sharpening the Gödelian anti-mechanist argument: the claim that no Turing machine or formal system can capture everything a human mathematician can come to know, since for any consistent formal system F proposed as a model of her reasoning, she can recognize the truth of the very sentence that F itself cannot prove.

  My study group keeps arguing about where this argument is actually supposed to get its force, and I don't want the interview to just let her restate the thesis in slightly different words each time. Could you draft eight to ten interview questions, each substantive enough that answering it requires engaging a specific move in the literature rather than the general picture? I'd like at least one question on how the mathematician is supposed to know, without circularity, that she herself is consistent, given that Gödel's second theorem bars any consistent system from proving its own consistency; at least one on the objection that producing a further Gödel sentence for any system offered as a model of you shows only that you could never know that system to be a complete model of you, rather than that you actually are not that system; and at least one on why Penrose recasts the argument in Shadows of the Mind in terms of soundness rather than mere consistency, and on the reply that this just relocates the original self-knowledge problem onto a different, equally unverifiable property. For each of these, please add a follow-up question keyed to the answer she's most likely to give, so a rehearsed reply doesn't just end the exchange. I'd like the sequence to end on what I suspect is the hardest question of all, even though I can't yet put it as sharply as I'd like: even granting every step, why does any of this show that minds are not computational systems at all, rather than merely that they are not equivalent to any single, static, once-and-for-all formal axiomatic system?
