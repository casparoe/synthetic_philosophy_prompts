prompt: |-
  I'm a software engineer on a small, fully remote team of about eight people. Over the past couple of years we've settled into unwritten conventions for things like commit-message formatting, branch naming, and pull-request etiquette: no one proposed or voted on any of it, newcomers pick it up within days just from watching how things are done, and anyone who drifts from it gets a quiet correction. The question stopped being academic when we merged codebases with another team that had its own, equally workable habits, and for the first time we had to decide, as a combined group, which set of habits to keep. Please describe the most important implications of David Lewis's account of convention -- a regularity sustained by common knowledge, self-fulfilling mutual expectation, and the fact that some equally good alternative regularity was always available -- for (a) why unilaterally switching to a different approach feels far costlier than the size of the underlying disagreement would warrant, and (b) what it would actually take to engineer a deliberate switch rather than let the merged team's habits settle by drift. I'm also curious where Lewis's picture, built to explain pure coordination, stops being adequate once one side's convention has picked up a mild sense of obligation that the other team never felt bound by at all.
reasoning: |-
  Okay, the user is a software engineer on a small remote team that merged with another team. They had unwritten conventions for things like commit messages and branch naming. Now, after merging, they need to decide which conventions to adopt. They're asking about David Lewis's theory of convention to explain why switching feels costly and how to deliberately change conventions. Also, they want to know how Lewis's model handles cases where one team feels obligated to their conventions.

  First, I need to recall Lewis's definition of convention. He says conventions are regularities sustained by common knowledge, mutual expectations, and the presence of equally good alternatives. So, in their original team, everyone followed the same practices because they knew others did, expected others to follow, and knew there were other ways but stuck to theirs. 

  Now, why does unilaterally switching feel so costly? Even if the disagreement is small, switching alone breaks the mutual expectations. If one person changes, others might not adjust immediately, leading to coordination failures. For example, if someone uses a different branch naming style, others might not recognize it, causing merge issues. Also, the common knowledge is disrupted. Everyone knew the old convention, but now there's uncertainty. Plus, the psychological cost—going against the group feels socially risky, even if the technical difference is minor. So the cost isn't just about the change itself but the broken expectations and potential miscoordination.

  Next, how to engineer a deliberate switch. Lewis's model suggests you need to establish new common knowledge and mutual expectations. That means explicit agreement. The team must collectively decide, document the new rules, and ensure everyone knows and knows that others know. Training and tooling help reinforce this. Automation like commit hooks can enforce practices. Also, addressing the alternatives: since both conventions were workable, the team needs to pick one arbitrarily but decisively to avoid ambiguity. Gradual transition might not work because it prolongs the period of conflicting expectations. 

  The user also mentioned obligation. Lewis's model is about coordination, but if one team feels morally obligated to their convention, it's no longer just about efficiency. The other team might see it as arbitrary, leading to resentment. The obligation adds a layer of normativity. To handle this, the team needs to acknowledge the values attached, not just the practices. Maybe reframe the convention as part of team identity or values to gain buy-in. 

  Practical steps: The user should facilitate a meeting to explicitly decide on conventions, document them, use tools to enforce, and validate common knowledge through discussions. Also, address any sense of obligation by discussing why certain practices matter emotionally, not just functionally. 

  I should make sure the answer connects Lewis's concepts to the user's specific scenario. Highlight why drift won't work post-merger and the need for explicit steps. Also, clarify the difference between coordination problems and normative obligations.
answer: |-
  David Lewis's account of convention (from *Convention: A Philosophical Study*) is profoundly relevant to your situation. Let's break down the implications:

  ### Core Lewisian Concepts Applied
  1.  **Regularity R:** A behavioral pattern (e.g., `feat/JIRA-123-description` branch names).
  2.  **Common Knowledge:** Everyone knows R is followed, knows others know, knows others know they know, etc.
  3.  **Preference for Uniformity:** Individuals prefer conforming *if* others do too (avoiding coordination failure).
  4.  **Arbitrary Alternatives (S):** Equally effective alternative regularities exist (e.g., `feature/JIRA-123/description`).
  5.  **Self-Fulfilling Expectations:** I follow R *because* I expect others to follow R, and they do the same because they expect *me* to. This mutual expectation *sustains* R.

  ### (a) Why Unilateral Switching Feels Disproportionately Costly
  Lewis explains the intense inertia of convention:

  1.  **Broken Expectations & Coordination Costs:** Unilaterally switching to S violates the mutual expectations underpinning R. Even if *you* know S is objectively fine (or better *for you*), *others* still expect R. This creates immediate coordination failures:
      *   Your `fix/description` branch confuses teammates expecting `fix/JIRA-456-description`.
      *   Your novel commit message format slows down code review as others parse it.
      *   **Cost:** Not just your effort to change, but the *collective friction* and potential errors caused by breaking the established, known coordination point. This cost is borne by the *whole team* momentarily, making you the source of disruption.

  2.  **Undermining Common Knowledge:** R relies on deep common knowledge. Your switch introduces doubt: "Is this a new rule? Does everyone else know? Should I switch too?" This uncertainty *itself* is costly as it consumes cognitive bandwidth and requires explicit communication to resolve, destroying the effortless coordination R provided.

  3.  **The "Preference for Uniformity" Multiplier:** Lewis highlights our inherent desire to conform *given* others' conformity. Switching unilaterally forces you to act *against* this deep-seated preference. You feel the social/psychological cost of being the outlier, *plus* the cognitive load of consciously overriding the ingrained habit, *plus* the anxiety of causing friction. This *feels* huge compared to the minor technical difference between R and S.

  4.  **The "Sunk Cost" of Established Knowledge:** The team has invested in learning and internalizing R. Switching requires *reinvestment* in learning S, even if S is equally simple. Unilateral switching forces this reinvestment cost onto *others* unexpectedly.

  **In essence:** The cost isn't just about the *content* of R vs. S. It's about the *breakdown of the coordination equilibrium* and the destruction of valuable *common knowledge*. Unilateral action triggers these systemic costs, far outweighing the nominal difference between the conventions.

  ### (b) Engineering a Deliberate Switch (Avoiding Drift)
  Lewis shows conventions arise from precedent + common knowledge. To *change* deliberately, you must *consciously establish new precedent and new common knowledge*. Drift is risky because it defaults to the loudest/most numerous/most entrenched precedent, causing resentment. Here's the Lewis-informed playbook:

  1.  **Explicit Agreement (Breaking the Precedent Chain):** You *must* break the tacit nature. Have a dedicated, inclusive discussion (meeting, async thread). Acknowledge both R (Team A) and S (Team B) are Lewisian conventions – arbitrary but functional. **Goal:** Explicitly agree on a *new* regularity T (which could be R, S, or a hybrid).
      *   *Lewisian Reason:* This creates a *new shared precedent* and the *seed of common knowledge* ("We all discussed and agreed on T").

  2.  **Codification & Documentation:** Explicitly write down T. Put it in the README, CONTRIBUTING.md, or a dedicated handbook.
      *   *Lewisian Reason:* This is the tangible artifact that anchors the new regularity and serves as the objective reference point for establishing common knowledge. It answers "What is T?" definitively.

  3.  **Active Common Knowledge Construction:** Don't just document; *actively broadcast and verify*.
      *   Announce the decision and link to the docs in a high-visibility channel.
      *   Require acknowledgment (e.g., a thumbs-up, a comment, a checkbox in onboarding).
      *   Discuss it in onboarding for new hires *explicitly*: "This is T. We agreed on T on [date] because...".
      *   *Lewisian Reason:* This builds the crucial layers: "Everyone knows T," "Everyone knows everyone else knows T," "Everyone knows everyone knows they know T," etc. This replaces the old common knowledge around R or S.

  4.  **Leverage Tooling for Enforcement & Consistency:**
      *   Linters for commit messages.
      *   Branch naming protection rules in Git.
      *   PR template generators.
      *   *Lewisian Reason:* Tools act as persistent, impartial enforcers of T, reducing the burden of individual conformity and making deviations *obvious* and *correctable instantly*. They reinforce the new expectations ("The system expects T") and make following T easier than not.

  5.  **Arbitrariness and Decisiveness:** Acknowledge T is arbitrary. The *decision* matters more than *which* convention was chosen (as long as it's functional). Avoid compromises that create a *third*, more complex convention unless essential. Favor simplicity and clarity.
      *   *Lewisian Reason:* The key benefit is uniformity. Over-complexity undermines the ease of coordination that conventions provide. A clear, simple T is easier to establish as common knowledge.

  6.  **Deliberate Precedence Setting:** Initially, maintainers/reviewers should gently but consistently point to T and the documentation when they see drift ("Hey, per our agreed T in CONTRIBUTING.md, could you rename the branch to `T-style-name`?"). Be factual, not judgmental.
      *   *Lewisian Reason:* This consistently reinforces the *new* precedent and expectations, actively building the new mutual belief that "We all follow T now."

  **Why this works:** It consciously replicates the conditions Lewis identified for a convention to form (precedent, common knowledge, mutual expectations around a specific regularity T), but does so explicitly and rapidly, bypassing the slow, potentially conflict-ridden process of organic drift.

  ### Where Lewis Stops: The "Mild Sense of Obligation"
  Lewis primarily models conventions as solutions to *pure coordination problems* (e.g., driving on the left vs. right – both work, uniformity is key). The "mild sense of obligation" points beyond pure coordination into the realm of **social norms** or **group identity**:

  1.  **Beyond Arbitrariness:** For Team A, their convention R may no longer feel *arbitrary*. It may be tied to:
      *   **Group Identity:** "This is how *we*, the original team, did things. It's part of our team culture."
      *   **Perceived Value:** "We believe R *is* slightly better (more readable, more efficient), even if only marginally." This belief transforms it from an arbitrary solution to a "better practice" in their eyes.
      *   **Moralization:** "Following R shows respect for our established process/history/colleagues." Deviation feels like disrespect or laziness, not just a coordination hiccup.
      *   **Sunk Cost Justification:** The effort invested in learning/using R creates a psychological need to see it as "the right way" to justify that cost.

  2.  **Implications for the Merge:**
      *   **Asymmetry:** Team A feels an obligation to R; Team B sees S as merely a useful habit. This makes compromise harder. Team A may resist S not just due to coordination costs (which Lewis explains) but due to *identity threat* or *perceived value loss*.
      *   **Lewis's Limitation:** His model struggles to explain why Team A would *strongly prefer* R over S *even if* they knew Team B would reliably follow S. The preference isn't *just* conditional on others' conformity (Lewis) but also absolute ("R is *ours*" or "R is *better*").
      *   **Conflict Potential:** Discussions risk moving from "Which arbitrary T should we pick?" (Lewis) to "Whose practice/values/identity is superior?" This is emotionally charged.

  3.  **Addressing the Obligation:**
      *   **Acknowledge the Feeling:** Explicitly name it in discussions: "We recognize Team A has a strong attachment to R, it's become part of your workflow and identity."
      *   **Separate Value from Habit:** Discuss: *What specific value* does R provide? (Readability? Traceability? Automation compatibility?) Can T capture that value? Focus on *outcomes*, not just the pattern.
      *   **Reframe T as a New Team Identity:** "T isn't Team A's R or Team B's S. T is the convention of the *new, merged Team C*. Let's make it ours together." Involve both teams in designing T.
      *   **Find Wins:** If R has a genuinely superior aspect S lacks, incorporate it into T. Show Team A their insight was valued.
      *   **Ritualize the Transition:** Acknowledge the "retirement" of R/S and the adoption of T formally (e.g., a quick note in the docs/changelog: "Merged teams X & Y. Adopted new convention T combining aspects of both previous styles").

  **Conclusion:** Lewis brilliantly explains the *inertia* and *coordination glue* of your original tacit conventions and why merging creates friction. To switch deliberately, you must **consciously create new common knowledge and mutual expectations around a new, explicitly defined regularity (T), supported by documentation, tooling, and consistent reinforcement.** However, when a convention acquires **normative weight** (obligation, identity), Lewis's pure coordination model needs supplementing. Address these feelings **explicitly, respectfully, and by reframing T as an evolution for the new team identity**, focusing on shared outcomes rather than just the mechanics of coordination. Success requires handling both the *coordination logic* (Lewis) and the *social psychology* of habit and belonging.
