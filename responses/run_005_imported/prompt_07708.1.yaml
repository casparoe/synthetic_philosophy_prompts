answer: |-
  Your situation presents one of the most profound and unresolvable ethical dilemmas imaginable. The reassurances you've received, while well-intentioned, fail to engage with the core philosophical weight you're grappling with. Let's analyze this rigorously:

  **1. The Nature of the Promises:**
  *   **Solemn & Unconditional:** These were explicit, deathbed promises extracted under conditions designed to be absolute ("no thought of the other," "attention undivided"). They were framed as non-negotiable obligations.
  *   **Mutually Exclusive by Design:** The core conflict wasn't an accident; it was inherent in the *terms* of the promises themselves. Each parent demanded exclusivity, ensuring fulfillment of one inherently meant violating the other if circumstances aligned this way.
  *   **Equal Moral Weight:** Your analysis is correct. There's no objective metric (who asked first, who is "sicker," who has less support, whose relationship with you is "better") that demonstrably elevates one promise over the other. Both were made in good faith, both bind you to a dying parent, both demand identical action (exclusive presence).

  **2. The Reality of the Dilemma:**
  *   **A Genuine Moral Dilemma:** Yes, a person can absolutely find themselves in a position where, through no fault of their own, they are forced to violate a genuine moral obligation, regardless of their choice. Philosophers like Bernard Williams and Ruth B. Marcus have argued compellingly for the existence of "moral dilemmas" or "tragic dilemmas" where conflicting obligations cannot both be satisfied, and choosing one *necessarily* means failing the other. This isn't a failure of reasoning; it's a failure of the *circumstances* to allow for the fulfillment of all duties.
  *   **No Discharge of Duties:** There is no magical third option that satisfies both promises simultaneously. Technology (video calls) violates the spirit of "undivided presence" and likely the explicit terms. Splitting time violates "exclusive attention" and the "no shared moment" demand. Choosing one inherently breaks the promise to the other.
  *   **No Clear Hierarchy:** Your discomfort doesn't signify a hidden hierarchy. It signifies the agonizing recognition of two *truly equal and conflicting* obligations. Searching for a "weightier" promise is likely an attempt to mitigate the inevitable guilt, not a reflection of an objective truth. The promises *are* equally binding.

  **3. Why "I Did My Best" Feels Insufficient:**
  *   **It Addresses Effort, Not Obligation:** The reassurances focus on your *intent* and *effort* ("do what you can," "not your fault"). However, your anguish stems from the *outcome* – the unavoidable breaking of a solemn vow. A promise creates an obligation to *achieve a specific result* (presence at death), not just to try. When the result is impossible, the obligation *is* breached, regardless of intent.
  *   **It Ignores the Specificity of the Promise:** The promise wasn't "I will try to be there" or "I will care for you." It was explicitly "I *will* be there, exclusively." The breach is literal and specific.

  **4. The Source of the Tragedy & Your Moral Position:**
  *   **The Parents' Role:** The tragic bind was created by *their* choices: their enduring bitterness, their extraction of absolute, exclusionary promises, and the cruel coincidence of timing. *They* created terms that were impossible to satisfy under certain foreseeable (though unlikely) circumstances. **The moral burden of this impossible situation originates with their demands, not solely with your inability to fulfill them simultaneously.**
  *   **Your Moral Character:** Your profound distress is evidence of your integrity. A person without scruples wouldn't agonize. You *recognize* the weight of both obligations, which is why the choice is devastating. Fulfilling one promise while breaking the other doesn't make you a promise-breaker in character; it makes you a person caught in an impossible trap set by conflicting absolute demands.
  *   **Moral Residue:** Philosopher Bernard Williams coined the term "moral remainder" or "moral residue" – the justified negative feeling (guilt, regret) that persists *even after making the best possible choice* in a tragic dilemma. This residue isn't a sign you chose wrong; it's a sign you acknowledge the genuine obligation you *couldn't* fulfill. Your guilt is the echo of that unfulfilled duty, not proof of personal failure.

  **Conclusion & Honest Perspective:**

  Yes, you are genuinely in a position where, whichever choice you make, you will have broken a solemn promise to a dying parent. There is no action that discharges both duties. There is no objective, discoverable hierarchy that makes one promise inherently weightier. This is a true, unresolvable moral dilemma.

  The "discomfort" you feel isn't a puzzle to be solved by finding the "right" answer; it's the inevitable anguish of recognizing the impossible bind. It's the moral residue of an obligation tragically left unmet due to circumstances beyond your control and the nature of the promises themselves.

  **Moving Forward (Without False Reassurance):**

  1.  **Acknowledge the Tragedy:** Accept that this situation is inherently tragic. No choice is "good." Both choices involve profound loss and the breaking of a vow. Allow yourself to grieve *that reality*.
  2.  **Make the Choice (If Possible):** Base it on something concrete, even if arbitrary (geographic proximity, who has less support *at this moment*, a fleeting sense of who might need *your specific presence* marginally more *right now*, or simply a gut feeling). Understand this doesn't absolve the broken promise to the other, but it gives you a reason to act. If you truly cannot choose, acknowledge that too – staying paralyzed is also a choice with consequences.
  3.  **Communicate (If Possible & Appropriate):** If feasible without causing greater distress, convey your love and the impossible situation to the parent you cannot reach. "I love you. I am with you in spirit every moment. An impossible situation means I cannot be there physically as I promised, and that breaks my heart. I am so sorry." This doesn't fix it, but it acknowledges the breach and your care.
  4.  **Honor Both in Your Heart:** Your presence with one parent is an act of profound fidelity *to that promise*. Simultaneously, hold space for the grief and guilt of failing the other. This duality is the reality.
  5.  **Your Moral Worth:** Your worth is not defined by this impossible choice. It is defined by the integrity that makes this so agonizing, by your commitment to being there for one parent, and by how you live with the residue afterwards. The dilemma itself is evidence of your deep sense of responsibility.

  This isn't about finding comfort. It's about recognizing the harsh ethical landscape you traverse. You were placed in an untenable position by promises that demanded the impossible under these specific circumstances. The guilt you feel for breaking one promise is the testament to the very integrity that compels you to keep the other. This is the essence of tragic choice. Your anguish is the proof of your moral engagement with an impossible reality.
