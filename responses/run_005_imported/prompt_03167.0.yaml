answer: |-
  You've pinpointed the core conceptual tangle perfectly. Gould and Lewontin's "spandrel" metaphor blurred two distinct evolutionary questions, leading to the need for "exaptation." Here's a precise reconstruction of the distinction and why present utility alone is insufficient evidence for past selection:

  **The Two Blurred Questions:**

  1.  **Origin (How/Why did the trait *arise* initially?):** What was the *causal mechanism* responsible for the trait's *first appearance* in the lineage? Was it directly shaped by natural selection for a specific function? Or did it arise as a:
      *   **Byproduct/Constraint (Spandrel proper):** A necessary consequence of the developmental system, architectural constraint, or selection *for something else* (e.g., the triangular space *must* exist because you built an arch on rectangular supports).
      *   **Neutral Trait:** A feature arising through mutation or drift with no initial selective advantage or disadvantage.
      *   **Trait selected for a *different* original function.**

  2.  **Current Utility (What is the trait *used for* now?):** What *current selective advantage*, if any, does the trait provide? How does it contribute to the organism's fitness *in its present environment*? A trait can have high current utility even if that wasn't the reason it originated.

  **Why "Spandrel" Blurred Them:**

  *   Gould & Lewontin primarily used "spandrel" to mean **a trait that is a necessary byproduct of other features, lacking an adaptive origin.** Its *origin* was non-adaptive.
  *   However, they *also* discussed how these byproduct structures could later be *co-opted* for a useful purpose (e.g., decorating the spandrel). This is about *current utility* or *subsequent* evolution.
  *   The single term "spandrel" thus conflated:
      *   **(A) The *non-adaptive origin* (byproduct status).**
      *   **(B) The *potential for later co-option* into a functional role.**

  **The Need for "Exaptation":**

  Gould & Vrba (1982) introduced "exaptation" specifically to isolate and clarify question (B) – the *current utility* derived from *co-opting* an existing structure, *regardless of its origin*.

  *   **Exaptation:** A trait, *evolved for one function or arising as a non-adaptive byproduct*, that is later *co-opted* for a new, current use. It explicitly separates the *historical origin* from the *current function*.
  *   **Adaptation:** A trait whose *origin and maintenance* are primarily due to natural selection *for its current function*.

  **The Crucial Distinction & Why Present Fit Isn't Enough**

  Here's the precise account of why you cannot infer origin from current utility:

  1.  **The "Adaptationist Programme" Mistake:** Assuming that because a trait *is* useful now (has current utility), it *must have been built by selection for that specific purpose* (adaptive origin). This confuses Question 2 (Current Utility) with Question 1 (Origin).
  2.  **The Exaptation Alternative:** A trait showing perfect fit for a current function could have:
      *   **Originated non-adaptively (as a spandrel/byproduct)** and *then* been co-opted for its current use (exaptation).
      *   **Originated for a *different* function** and *then* been co-opted/modified for its current use (also exaptation).
      *   **Originated adaptively for its current function** (adaptation).
  3.  **The Inference Problem:** Observing only the *current fit and function* provides evidence *only* for *current utility* (Question 2). It tells you *nothing definitive* about *why the trait arose in the first place* (Question 1). To infer adaptive *origin*, you need evidence *beyond* current utility. This evidence can include:
      *   **Complexity & Specific Design:** Features showing intricate, improbable complexity *specifically suited* to the proposed function (e.g., the vertebrate eye).
      *   **Phylogenetic History:** Evidence from related species showing the trait's gradual evolution *correlated* with the proposed selective pressure.
      *   **Developmental Constraints/Correlations:** Evidence that the trait *could not* easily arise as a simple byproduct.
      *   **Comparative Evidence:** Showing the trait consistently evolves *only* in lineages facing the proposed selective pressure.
      *   **Absence of Plausible Alternatives:** Ruling out strong spandrel or exaptation hypotheses.
  4.  **Why Spandrels/Exaptations Can Be Well-Fitted:** Natural selection can *subsequently* act on an exapted trait, refining it for its new function *after* co-option. This *secondary adaptive fine-tuning* can make the trait appear exquisitely designed *for its current role*, masking its non-adaptive or differently-adaptive origin. Its current "fittingness" is the result of *later* selection acting on the *available* structure, not proof of selection *creating* the structure *for* that purpose.

  **Gould's San Marco Example: Why It Remains Contested on This Point**

  The controversy around San Marco perfectly illustrates the difficulty of inferring *origin* and the distinction between spandrel and exaptation:

  *   **The Spandrel Hypothesis:** The triangular pendentives *originated* purely as a necessary architectural byproduct of placing a dome on rounded arches over a square base. Their *origin* was non-adaptive (for decoration). Decoration was a *later* exaptation.
  *   **The Counter-Argument (Design Choice):** Architectural historians argue the builders *knew* pendentives were needed *and* knew they would create large, stable, curved surfaces perfect for mosaics. They *chose* this architectural solution *in part because* it provided these surfaces. Therefore:
      *   The pendentives themselves were *not* an unforeseen byproduct; they were an *intentional design feature* chosen *for* structural reasons *and* anticipating their decorative potential.
      *   The *origin* of the pendentives (as structures) was *adaptive* – solving the structural problem *and* providing a decorative canvas simultaneously. Decoration wasn't a *later* exaptation; the surface was *part of the original adaptive function*.
      *   **The Blur in Action:** Critics argue Gould confused the *physical necessity* of the structure (you *must* fill the space somehow) with the *architectural decision*. The builders *selected* the pendentive *solution* precisely *because* it created surfaces suitable for decoration, making it an adaptation (for structure *and* providing a canvas) from the start, not a pure spandrel later exapted.

  **Conclusion:**

  The fundamental distinction blurred by the original "spandrel" concept is between **the evolutionary mechanism responsible for a trait's *initial origin*** and **the selective forces responsible for its *current maintenance and utility***. "Exaptation" clarifies that a trait can be *currently useful* because it was *co-opted* for that use, regardless of whether it originated as an adaptation for something else or as a non-adaptive byproduct (spandrel). **Present "fittingness" alone is logically insufficient to prove adaptive origin because it is equally consistent with the trait being an exaptation (a co-opted spandrel or a co-opted prior adaptation).** Gould's San Marco example remains contested precisely because it hinges on this inferential difficulty: was the decorative surface an *unforeseen opportunity* seized later (exaptation of a spandrel), or was it an *anticipated benefit* factored into the *original selection* of the architectural solution (adaptation)? Resolving this requires historical evidence *beyond* the mere existence and current utility of the decorated pendentives.
