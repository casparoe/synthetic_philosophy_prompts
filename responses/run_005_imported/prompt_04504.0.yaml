  The challenge is avoiding facile analogies. I'll ground each step in textual evidence: his dismissal of democratic will as "psychological" echoes his critique of empiricist logic; his criterion for political exclusion mirrors his criteria for logical competence. The argument must show that the same epistemic hierarchy underpins both domains.

