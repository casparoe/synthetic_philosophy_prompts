answer: |-
  Here is a carefully constructed argument for a substantive philosophical continuity between Frege's anti-psychologism and his authoritarian, exclusionary politics, grounded directly in his core doctrines:

  1.  **The Core Anti-Psychologistic Doctrine: Objective Truth Requires Independence from the Subjective:**
      *   **Source:** *Grundlagen* Preface & "Der Gedanke."
      *   **Doctrine:** Frege relentlessly attacks psychologism – the view that logical laws and mathematical truths are descriptions of human mental processes or contingent psychological facts. For Frege:
          *   Thoughts (*Gedanken*) are the bearers of truth and falsity.
          *   Thoughts are not mental images, representations, or psychological states; they are objective, non-spatiotemporal entities inhabiting a "third realm."
          *   This objectivity means thoughts are *independent* of any individual mind's grasping, believing, or judging them. They are true or false *in themselves*.
          *   The laws of logic are not empirical generalizations about how humans *do* think, but normative laws prescribing how one *ought* to think to reach truth. They are discovered, not invented.
          *   Crucially, **error arises not from the thought itself, but from a *failure* or *defect* in the individual mind's attempt to grasp it or reason correctly about it** (e.g., *Grundlagen*, p. VI: "We are all too ready to invoke inner intuition when we cannot produce any other ground of knowledge"). Psychologism makes truth *contingent* on the flawed and variable human mind.

  2.  **The Epistemological Hierarchy and the Problem of Defective Minds:**
      *   **Source:** Implicit in the anti-psychologism, explicit in the implications drawn about who can reliably access the third realm.
      *   **Doctrine:** While the *third realm* is equally accessible *in principle* to any "properly functioning mind," Frege's framework necessitates a stark distinction between minds that function properly and those that do not. Access to objective truth is not guaranteed; it requires specific cognitive capacities – logical rigor, clarity, freedom from psychological interference. This creates an **epistemological hierarchy**: Those whose minds function correctly (grasp thoughts clearly, reason logically) have privileged access to truth. Those whose minds are "defective" (prone to psychologistic confusion, swayed by intuition, emotion, or subjective bias) are epistemically unreliable and generate error. The locus of error is firmly placed in the *subject*, not the objective thought.

  3.  **The Analogy to Politics: Objective Authority vs. Subjective Will:**
      *   **Link:** The political realm, for Frege in the diary, mirrors the logical realm in its need for objectivity and insulation from the unreliable subjective.
      *   **Application:** Just as psychologism in logic makes truth hostage to contingent, flawed mental constitutions, **democracy (particularly universal suffrage and parliamentary debate) makes legitimate political authority and the "true good" of the state hostage to the contingent, flawed, "merely psychological" will of the masses.**
          *   The "shifting, plural" opinions of the electorate are akin to the shifting, subjective mental representations Frege banishes from logic. They are inherently unstable, irrational ("psychological"), and incapable of reliably discerning objective political truth or the true good of the state.
          *   Political parties, compromise, and public debate (as seen in the Weimar Republic) are seen not as mechanisms for discovering truth or legitimate consensus, but as arenas for the clash of irrational subjective wills and base interests (like those of Social Democrats or Catholics, whom he despised).
      *   **The Need for Insulation:** Therefore, just as logic must be *insulated* from psychology to preserve the objectivity of truth, **legitimate political authority must be *insulated* from the "merely psychological" will of the democratic electorate** to preserve the objectivity of the state's purpose and well-being. This necessitates an alternative source of authority – one that, like the laws of logic, is objective, stable, and discernible only by those with the requisite capacity (not the flawed masses).

  4.  **Exclusion as Epistemological Necessity:**
      *   **Link:** The criterion for reliable access shifts from logic to politics.
      *   **Application:** Frege's virulent antisemitism in the diary provides the specific application of this epistemological-political framework. He doesn't merely dislike Jews; he constructs them as fundamentally *incapable* of being reliable participants in the German state.
          *   Jews are portrayed as having an alien essence ("das Judentum") that makes their minds inherently "defective" in the relevant political-epistemological sense. They are depicted as intrinsically self-interested, manipulative, lacking true German feeling, and incapable of grasping or prioritizing the objective good of the *German* state (conceived as an organic entity with its own objective truth).
          *   **Therefore, Jews are not just undesirable; they are *epistemological-political threats*.** Allowing them political rights (voting, holding office) is analogous to allowing psychologistic principles into logic: it contaminates the objective realm (the state's true purpose) with inherently unreliable, alien subjectivity. Their participation guarantees error and corruption in the political "reasoning" of the state, just as flawed minds guarantee error in logical reasoning.
          *   **Expulsion/Disenfranchisement as Insulation:** Depriving Jews of rights or expelling them is thus framed (in Frege's warped logic) not merely as prejudice, but as the **necessary political corollary to anti-psychologism**: the *insulation* of the objective political realm (the authentic German state's authority and purpose) from a category of minds deemed inherently incapable of properly accessing or contributing to its objective truth. It is the removal of a source of "psychological" contamination.

  5.  **Continuity, not Coincidence:**
      *   The argument is **not** that anti-psychologism *logically entails* antisemitism or authoritarianism. Many anti-psychologists hold liberal democratic views.
      *   The argument **is** that Frege's *specific formulation* of anti-psychologism creates a powerful conceptual template that *resonates deeply* with and *provides a philosophical scaffolding for* his authoritarian, exclusionary politics:
          1.  A fundamental dichotomy: **Objective Truth/Authority vs. Subjective Psychology/Will.**
          2.  The **source of error/corruption** located firmly in the flawed *subject* (the irrational masses, the "defective" Jewish mind), not the objective structure (logical laws, the true state).
          3.  The **necessity of insulating** the objective realm from contamination by the subjective.
          4.  The **establishment of an epistemological hierarchy** determining who can reliably access the objective realm (proper logicians, "true" Germans) and who cannot (psychologists, the masses, Jews).
          5.  **Exclusion** as the consequence of being deemed epistemologically/politically unreliable.
      *   The *vocabulary* ("objective," "subjective/psychological," "defective," "insulation") and the *structural logic* (dichotomy, source of error, need for insulation, hierarchy, exclusion) are directly transferred from the domain of logic and epistemology to the domain of politics. The dry, exacting prose of the diary reflects this application of a logical framework to politics.

  **Conclusion:**

  Dummett's quarantine is philosophically unstable. The diary reveals not just that Frege held vile opinions alongside his logic, but that his deepest philosophical commitments – the radical objectivity of truth, the condemnation of the subjective/psychological as the source of error, and the imperative to insulate the objective realm – provided the very conceptual machinery through which he processed and justified his politics. The authoritarian desire to base the state on an objective authority immune to popular will mirrors the anti-psychologist's desire to base logic on objective laws immune to mental processes. The exclusion of Jews stems from categorizing them as inherently "defective" epistemic-political agents whose participation would inevitably introduce psychologistic contamination into the objective realm of the state, just as flawed minds introduce error into logic. This constitutes a **specifiable line of philosophical continuity**, where the structure of Frege's logical thought actively shapes and rationalizes the structure of his political pathology.
