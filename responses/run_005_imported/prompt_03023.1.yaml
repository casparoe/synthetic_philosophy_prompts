answer: |-
  Here's a fresh, historically grounded example illustrating a commitment race, distinct from chicken games or AGI scenarios: **The Scramble for Africa (1884-1890)**, specifically the race to claim territory via *diplomatic fait accompli*.

  ### The Scenario: The Berlin Conference & Preemptive Claims
  In the late 19th century, European powers raced to colonize Africa. Crucially, **no power could afford to wait** to negotiate boundaries *after* careful exploration or diplomacy. Instead, they rushed to plant flags, sign treaties with local leaders (often under dubious circumstances), and declare "spheres of influence" *before rivals could*. The 1884–85 Berlin Conference formalized this race: it established that **effective occupation** (demonstrable control) granted legitimacy, but crucially, it *did not* create a mechanism for cooperative partitioning. Instead, it incentivized *preemptive unilateral action*.

  ### Why This is a Commitment Race
  1. **Preemptive, Irreversible Moves**:  
     Powers like Britain, France, Germany, and Belgium sent explorers/agents to sign treaties with local rulers *as fast as possible*, often without knowing rivals' progress. Once a treaty was signed and announced (e.g., France claiming Congo in 1880, Leopold II’s Congo Free State in 1885), it became a **diplomatic commitment**. Reneging would signal weakness, inviting challenges elsewhere.  

  2. **Mutual Ignorance & Racing Dynamics**:  
     Agents operated in remote regions with no real-time communication. An explorer might spend months securing treaties, unaware a rival was doing the same 100 miles away. By the time governments learned of overlaps (e.g., Britain’s Cape-to-Cairo ambitions vs. France’s Dakar-to-Djibouti), both were **locked in** by nationalist fervor, sunk costs, and fear of domino effects.  

  3. **Schelling Focal Points via "First Mover" Advantage**:  
     The *first* power to declare control of a river basin or trade route (e.g., the Niger Delta) created a focal point. Challenging it required disproportionate effort, as seen in the 1898 **Fashoda Incident**: France and Britain nearly went to war over a dusty Sudanese outpost because both had *precommitted* to incompatible strategic corridors.  

  4. **Disastrous Outcomes from Rushed Commitments**:  
     - **Arbitrary Borders**: Straight-line boundaries (e.g., Anglo-Egyptian Sudan) split ethnic groups, fueling future conflicts.  
     - **Resource Mismanagement**: Hasty claims led to inefficient extraction (e.g., rubber in Congo under Leopold II).  
     - **Proxy Wars**: Rival commitments forced local populations into violence (e.g., Germany vs. Herero in Namibia).  

  ### Distinguishing from "Ordinary" Coordination Failures
  - **Not Just Brinkmanship**: Powers weren’t *threatening* escalation to extract concessions (like Cuba '62). They were *physically committing* resources early to stake claims, knowing delay meant losing options.  
  - **Not Pure Coordination**: No Schelling "obvious" compromise existed (e.g., "split the difference"). The *first* claim *became* the focal point by default, forcing others to accept or contest it at high cost.  
  - **Core Failure Mode**: The race dynamic **suppressed careful deliberation**. Explorers like de Brazza (France) or Stanley (Belgium) *had* to act fast, often without consulting home governments. As historian Adam Hochschild noted: "The scramble was less a policy than a panic."  

  ### Why This Fits Commitment Race Theory
  - **Updateless Incentive**: A power *must* commit before learning rivals’ actions (due to communication lag), or risk exclusion. This mirrors Wei Dai’s "commitment before computation."  
  - **Suboptimal Nash Equilibrium**: The partitioning was grossly inefficient (e.g., landlocked territories, resource imbalances), but no power could unilaterally slow down without losing ground.  
  - **Evolutionary Parallel**: Human tribes/groups likely faced similar races when expanding into unclaimed territory—committing to fertile valleys or strategic passes early, even without full knowledge of rivals or resources.  

  This example highlights how **institutional momentum** (colonial offices, investor demands) and **informational asymmetry** turned territorial expansion into a canonical commitment race—one where the "prize" (African land) was less valuable than the costs incurred by the race itself, purely because no actor could afford to be the *last* to commit.  

  **Source Spotlight**: For a granular view, see Thomas Pakenham’s *The Scramble for Africa* (1991), detailing how explorers’ rushed treaties (e.g., Germany’s Karl Peters in East Africa) forced governments into irreversible positions. The Fashoda standoff (§28) is a microcosm of the entire dynamic.
