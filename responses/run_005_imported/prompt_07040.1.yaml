answer: |-
  Your grasp of Wittgenstein's tension is profound and directly relevant to Ines's condition. These metaphors aren't contradictory but **complementary**, revealing distinct *temporal scales* and *layers of certainty*. Here's how to reconcile them for your novel:

  ### 1. **Timescales Matter: Geological vs. Practical Time**
     - **River-Bed (§96-99)**: Operates on a *cultural/historical* timescale. What is "bedrock" for one era (e.g., geocentrism) becomes sand for another. Shifts occur over generations, wars, or scientific revolutions.
     - **Hinges (§341-343)**: Function within a *practical* timescale—the duration of a specific "language game." While doubting whether your keys are in your coat, "this is my coat" remains fixed. Hinges hold *for the duration of the action*.

     **→ For Ines:** Her stroke collapses these timescales. What should be a hinge (knowing her kitchen *now*) suddenly behaves like shifting sand—a personal "epistemic earthquake."

  ### 2. **Layers of Certainty: Bedrock vs. Hinges**
     - **River-Bed's "Hard Rock"**: Deep cultural/biological certainties (e.g., "the world exists," "objects persist when unseen"). These rarely change.
     - **Hinges**: Local, contextual certainties enabling daily acts (e.g., "this is my front door," "my name is Ines"). These are stable *within a practice* but can shift over time.
     
     **Wittgenstein's Key Insight**:  
     > *"The same proposition may get treated at one time as something to test by experience, at another as a rule of testing"* (§98).  
     What is a "fluid" empirical question today ("Is this medicine safe?") can become a hardened hinge tomorrow ("Penicillin cures infections"), and vice versa.

  ### 3. **How a Hinge Loosens (Without Total Collapse)**
     Ines's kitchen doubt isn’t random amnesia—it’s the **temporary corrosion of a hinge**. Consider:
     - **Modularity of Language Games**: Doubting one hinge (kitchen ownership) doesn’t topple all certainties. She might still trust that *kitchens exist*, *houses have owners*, or even *this stove works*. Other hinges hold firm ("I am Ines," "This is my body").
     - **Hinges Exist in Networks**: If "this is my kitchen" falters, adjacent hinges may compensate:  
       *"My keys open this door → This is my house → Therefore, this kitchen is mine."*  
       Her stroke disrupts this chain at a specific link.
     - **The "Door" Still Needs to Turn**: Ines’s momentary doubt paralyzes action because the hinge *should* be fixed *while acting*. Standing frozen, she cannot engage in the "game" of making coffee until certainty re-anchors.

  ### 4. **Literary Application: Rendering Ines’s Vertigo**
     - **Show Hinge-Failure in Micro-Actions**:  
       *Ines reaches for a teacup → pauses → fingers brush its familiar chip → certainty floods back.*  
       The hinge (cup ownership) loosened, then re-hardened. The larger "game" (making tea) resumes.
     - **Contrast with Bedrock**:  
       Even mid-doubt, she never questions gravity, oxygen, or that cups hold liquid. These are deeper bedrock, untouched by her stroke.
     - **Historical Echoes**:  
       Ines might recall designing bridges where "load-bearing capacity" was a hinge. Now, personal certainties feel equally structural—and equally fragile.

  ### Why This Isn’t "Amnesia Fiction"
     Generic amnesia erases content ("I forgot my past"). Ines’s condition is **epistemological vertigo**—she remembers everything but *cannot trust the embedded certainties* that make memory actionable. It’s not that she forgets her kitchen; it’s that "ownership" momentarily ceases to function as a hinge. Wittgenstein gives you the language for this: her world isn’t *missing* data; its *grammar* is glitching.

  ### A Guiding Metaphor for Your Novel
     Imagine Ines’s mind as a city she engineered:  
     - **Bedrock**: The earth beneath (unshakeable truths).  
     - **River-Bed**: Infrastructure (pipes, cables) that shifts slowly over decades.  
     - **Hinges**: Bolts on a bridge. *One* bolt corroding doesn’t collapse the structure, but walking on that span feels treacherous until it’s repaired.  

  Her stroke is a seismic tremor—not destroying the city, but forcing her to audit every bolt she once took for granted.

  **Ines’s journey isn’t about *recollecting* but *re-anchoring*.** She must learn to distinguish when a wavering certainty is sand (insignificant) or a hinge (vital to act). Wittgenstein’s tension becomes her lived paradox: to heal, she must treat some truths as eternal bedrock, while accepting that others were only ever temporary rivets holding her daily world together. This philosophical rigor will make her dissociation feel terrifyingly specific—and profoundly human.
