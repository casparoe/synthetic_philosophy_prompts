  }
  ```

  i really want to get the reasoning right rather than just guessing an order that sounds plausible, since my prof will 100% make us defend it in discussion section tomorrow.
reasoning: |-
  Okay, the user is in a classical Indian philosophy seminar and struggling with Nyaya epistemology, specifically the four pramanas. They need to rank these from least to most disputed across different schools for a response paper. Let me recall the four pramanas: pratyakṣa (perception), anumāna (inference), upamāna (comparison/analogy), and śabda (verbal testimony).

  First, I need to figure out which pramana was least challenged. Perception (pratyakṣa) seems universally accepted. Carvaka materialists only accept perception, so they definitely acknowledge it. Buddhist logicians like Dignāga and Dharmakīrti also include it as valid. Vaiśeṣika, Sāṃkhya, Mīmāṃsā, Vedānta—all accept perception. So pratyakṣa is the least disputed. That should be first in the ranking.

  Next, inference (anumāna). Most schools accept it except Carvaka, who reject it because it relies on perception. But other schools like Buddhists, Vaiśeṣika, Sāṃkhya, and others all include inference. Some might reduce it to perception, but overall, it's widely acknowledged. So anumāna is second least disputed.

  Then, śabda (verbal testimony). Here's where it gets tricky. Carvakas reject it since it's not based on direct perception. Buddhists accept it but only as a form of inference. Vaiśeṣika might reduce it to inference too. However, Mīmāṃsā and Vedānta strongly support śabda, especially for Vedic authority. So it's disputed but not as much as upamāna. So śabda should be third.

  Finally, upamāna (comparison). This one is the most contested. Buddhists like Dharmakīrti reduce it to perception and inference. Vaiśeṣika combines it with inference. Sāṃkhya doesn't include it in their three pramanas. Only Mīmāṃsā and Vedānta sometimes accept it, but even then, they have their own expanded lists. The wild ox example is often criticized. So upamāna is clearly the most disputed.

  Now, to structure the JSON as requested. The ranking should be: pratyakṣa, anumāna, śabda, upamāna. For each, I need 2-3 sentences explaining which schools disputed it and how. 

  For pratyakṣa: Only Carvakas dispute it? Actually, no—Carvakas accept it exclusively. All others accept it. So no real dispute beyond Carvaka's limitation. 

  Anumāna: Disputed by Carvakas who reduce it to perception. Others accept it. 

  Śabda: Carvakas reject it. Buddhists reduce to inference. Vaiśeṣika might also reduce it. Mīmāṃsā/Vedānta uphold it. 

  Upamāna: Reduced by Buddhists to perception+inference. Vaiśeṣika to inference. Sāṃkhya excludes it. Only Nyaya and some others keep it separate.

  I should also consider if the user mentioned Mimamsa and Vedanta having six pramanas. They include arthāpatti and anupalabdhi, but still, upamāna is sometimes included by them, though it's disputed by others. But in the context of Nyaya's four, upamāna is the weakest.

  Double-checking the schools: Carvaka (1), Buddhists (2: pratyakṣa, anumāna), Vaiśeṣika (2: perception, inference), Sāṃkhya (3: perception, inference, testimony), Mimamsa/Vedanta (6). So the disputes align with this ranking.
answer: |-
  Here's the ranking based on historical disputes across Indian philosophical schools, with explanatory notes. The reasoning draws on key arguments from rival systems:

  ```json
  {
    "ranking": [
      "pratyakṣa (perception)",
      "anumāna (inference)",
      "śabda (verbal testimony)",
      "upamāna (comparison/analogy)"
    ]
  }
  ```

  **Explanations:**

  1. **pratyakṣa (perception)**: Least disputed.  
     *Only the Cārvāka school completely rejected all other pramāṇas while accepting perception alone. Every other school (Buddhist, Vaiśeṣika, Sāṃkhya, Mīmāṃsā, Vedānta) accepts perception as fundamental. Disputes centered on *what* is perceived (e.g., universals, particulars) or the mechanics of perception, not its independent status.*

  2. **anumāna (inference)**: Widely accepted but challenged by one major school.  
     *Cārvāka rejected inference as non-independent, claiming it ultimately relies on perception (and is thus reducible). However, all other schools (including Buddhist logicians like Dignāga/Dharmakīrti, Vaiśeṣika, Sāṃkhya, Mīmāṃsā, Vedānta) accepted inference as irreducible, though debates raged about its structure and validity conditions.*

  3. **śabda (verbal testimony)**: Accepted by orthodox schools but reduced by others.  
     *Cārvāka rejected it outright (as non-perceptual). Buddhist logicians reduced it to inference (since credibility depends on inferring the speaker's reliability). Vaiśeṣika often subsumed it under inference. Sāṃkhya, Mīmāṃsā, and Vedānta, however, defended its independence, especially for Vedic knowledge (Mīmāṃsā prioritized it radically).*

  4. **upamāna (comparison/analogy)**: Most disputed and frequently reduced.  
     *Buddhist logicians (e.g., Dharmakīrti) reduced it to perception + inference (e.g., seeing a wild ox, hearing its description, later inferring identity). Vaiśeṣika subsumed it under inference. Sāṃkhya excluded it from their 3 pramāṇas. Even Mīmāṃsā/Advaita Vedānta (with 6 pramāṇas) accepted it only after heated debate, often stressing its unique linguistic-cognitive role in linking names to unfamiliar objects (like the gavaya-ox example).*

  **Key Context for Defense:**
  - **Pratyakṣa's** primacy is near-universal (even Cārvāka accepts it, denying only *other* pramāṇas).
  - **Anumāna** is contested *only* by Cārvāka; all other schools defending inference implicitly accept Nyāya's need for it.
  - **Śabda's** status hinges on epistemology of language/authority. Reductionists see it as inferential; pro-Veda schools elevate it.
  - **Upamāna** is uniquely vulnerable because its process *appears* decomposable: perception (of A & B) + memory (of similarity) + inference (linking them). Nyāya insists the *novel identification* (e.g., "THIS is the gavaya") requires a distinct cognitive act.

  **Sources to Cite in Discussion:**
  - Buddhist reduction of upamāna: Dharmakīrti's *Pramāṇavārttika*
  - Vaiśeṣika subsumption: *Padārthadharmasaṃgraha* (under anumāna)
  - Sāṃkhya exclusion: *Sāṃkhyakārikā* (only 3 pramāṇas)
  - Mīmāṃsā defense: Śabara's *Bhāṣya* on Mīmāṃsā Sūtra 1.1.5

  This ranking reflects both the breadth of opposition (how many schools disputed it) and the depth of reduction attempts (whether opponents deemed it *wholly invalid* or merely *reducible*). Good luck in seminar!
