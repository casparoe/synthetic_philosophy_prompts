answer: |-
  Here’s a set of interview questions designed to engage your guest rigorously while avoiding rehashing his standard talk. The questions build on your requested structure, target key weaknesses in legal moralism, and include strategic follow-ups to counter deflection. I’ve bolded core objections (Hart, Dworkin, etc.) for clarity.

  ---

  ### **Opening Sequence (Grant → Press → Evidence Test)**
  1. **Granting Premise**: "You argue that shared morality constitutes a political community’s identity. Could you elaborate on why *this specific form* of social cohesion—grounded in collective moral attitudes—is uniquely essential, as opposed to, say, shared democratic procedures or constitutional values?"  
     *(Sets up his core claim without challenge)*  

  2. **Press on Mechanism**: "You’ve emphasized that criminalizing commercial surrogacy isn’t about preventing direct harm but preserving social fabric. **If the goal is sustaining moral community, why is the *criminal law* the necessary tool?** Couldn’t education, cultural advocacy, or non-coercive institutions achieve this without state punishment?"  
     *(Forces justification for state coercion; preempts "soft" alternatives)*  

  3. **Evidence Threshold**: "You’ve said the 'disintegration thesis' is conceptual, not empirical. **But if we accept your theory, what would *falsify* it?** For instance, if a society liberalized surrogacy laws and saw *no* erosion of communal bonds—or even strengthened them through expanded autonomy—would that challenge your view, or is it immune to real-world observation?"  
     *(Cornerstone question: tests if theory is unfalsifiable)*  
     - *Likely deflection*: He insists empirical cases "miss the point" of his conceptual claim.  
     - **Follow-up**: "If no observable social outcome can test your theory, how is it meaningfully different from asserting that moral cohesion *must* decline—even if we can’t see it?"  

  ---

  ### **Core Challenges + Follow-ups**  
  4. **Social Disgust & Historical Prejudice**: "Devlin argues that a society’s 'intolerance, indignation, and disgust' justify criminalizing acts like surrogacy. **Given that identical sentiments historically defended anti-gay laws, bans on interracial marriage, or blasphemy codes—often rooted in prejudice—why should law defer to *these emotions* rather than critical reason?**"  
     - *Likely reply*: "This disgust reflects profound moral harm."  
     - **Follow-up**: "How do we distinguish 'profound moral harm' from visceral prejudice *in practice*? Shouldn’t the burden fall on proponents of criminalization to prove this distinction, especially given history?"  

  5. **Hart’s Challenge (Positive vs. Critical Morality)**: **"H.L.A. Hart accused Devlin of conflating a society’s *actual* morality (what people happen to believe) with *defensible* morality (what is rationally justifiable). Why should law enforce the former—especially if, as with past sodomy laws, it’s arbitrary or oppressive?"**  
     - *Likely reply*: "Law’s role is to preserve existing social order, not impose ideal morality."  
     - **Follow-up**: "If a society’s 'actual morality' endorsed slavery or marital rape, would Devlin’s view obligate the law to enforce those norms too? If not, how do you decide *which* majority morals deserve legal protection?"  

  6. **Dworkin’s 'False Consensus' Critique**: **"Ronald Dworkin warned that apparent moral consensus often masks prejudice, ignorance, or blind tradition. With surrogacy, couldn’t opposition stem from unexamined beliefs about gender roles, discomfort with women’s bodily autonomy, or misinformation—rather than 'shared values'?"**  
     - *Likely reply*: "Disgust signals deep-seated values essential to identity."  
     - **Follow-up**: "Many once called interracial marriage 'unnatural' or invoked disgust to defend apartheid. If those reactions were mistaken, why trust similar intuitions about surrogacy?"  

  ---

  ### **Additional Angles**  
  7. **Alternatives to Criminalization**: "Even if surrogacy *does* threaten moral cohesion (which you argue conceptually), **why not address this through regulation—e.g., ensuring informed consent, banning exploitation—rather than blanket criminalization?** Wouldn’t that mitigate harms without sacrificing community?"  

  8. **The 'Community' Boundary Problem**: "Your theory assumes a homogenous 'community' with shared morals. **But in pluralistic societies like the U.S., where moral attitudes on surrogacy vary widely by region/religion, whose morality gets privileged? Isn’t criminalizing it just imposing one group’s ethics on another?**"  

  9. **Slippery Slope Concerns**: "If we accept criminalizing surrogacy solely to preserve moral cohesion, **what principle prevents extending this logic to other consensual acts—like adultery, atheism, or private sexual practices—that might offend majority sensibilities?**"  

  10. **Closing/Reflection**: "Stepping back: **If your view prevailed, what safeguards would you build into legal moralism to prevent it from becoming a tool for tyranny of the majority?**"  

  ---

  ### **Key Strategy Notes**:
  - **If he deflects to "conceptual not empirical"**: Hammer the *practical implications* (e.g., "But law operates in the real world—how should legislators apply your theory if it’s detached from observable effects?").  
  - **Invoke surrogacy specifically**: Anchor abstract debates to the policy issue (e.g., "In surrogacy’s case, isn’t the 'disgust' partly economic—objecting to commodification—rather than moral disintegration?").  
  - **Control the framing**: If he monologues, interrupt politely: "I’d love to hear your response to [specific counterexample]."  

  This structure avoids letting him retreat into lecture mode while forcing engagement with the toughest critiques. Good luck—your prep is already impressive!
