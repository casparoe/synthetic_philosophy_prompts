  ok so my friend and i just spent like two hours arguing about politics (as usual) and it somehow turned into a fight about whether two smart, honest people can even genuinely disagree once they've heard all the same arguments. he pulled up something on his phone called the 'common prior assumption' and said real bayesians literally can't start out with different priors, so if we still disagree after actually hashing it out, one of us basically has to be irrational or dishonest with ourselves. i said thats crazy because we grew up in totally different households, so of course our gut assumptions about stuff are different from the jump. who's actually right here, does being rational really require that everyone shares the same priors to begin with, or is he misunderstanding what that assumption is even for?
