answer: |-
  You've touched on a profound and underappreciated dimension of blame ethics: the distinction between whether blame is **factually correct** and whether a person has the **moral standing** to deliver it. Your intuition is spot-on—Dan's hypocrisy isn't just a character flaw; it fundamentally undermines his authority to blame *you*. Here’s why, and what Dan would need to do to regain standing:

  ### 1. **The Core Ethical Distinction**
     - **Correctness of Blame (Substantive Desert)**: Yes, you were late, and it impacted the team. On this factual level, the blame has merit.
     - **Standing to Blame (Procedural Desert)**: This asks: "Does *this person*, given their own actions and attitudes, have the right to *deliver* this blame?" Dan’s history and lack of accountability poison his standing. Philosophers like R. Jay Wallace and Macalester Bell argue that blame isn’t just a factual report—it’s a moral demand. Hypocrisy corrupts that demand because it reveals the blamer’s insincerity and unfair selective enforcement.

  ### 2. **Why Dan’s Hypocrisy Matters Morally**
     - **Unfairness**: By blaming you while ignoring his own identical failures, Dan implies rules apply only to others. This violates reciprocity—a bedrock of collective accountability.
     - **Bad Faith**: His message framed the issue as "shared deadlines," yet he’s exempted himself from that standard. His private dismissal of his own actions ("beside the point") confirms this.
     - **Erosion of Trust**: Blame from a serial offender feels punitive, not constructive. It exploits the team’s past leniency toward *him* while denying you the same grace.
     - **Power Dynamics**: By scolding *you* (a first-time offender) after benefiting from silence *three times*, Dan weaponizes blame to deflect from his own pattern.

  ### 3. **What Dan Needs to Do to Regain Standing**
  Standing isn’t permanently lost—but it must be *earned back* through concrete actions:
     - **Acknowledge His Past Actions Explicitly**: A vague "I’ve messed up too" isn’t enough. He must name his specific late submissions and admit they were wrong *for the same reasons* he blamed you.
     - **Apologize Sincerely**: To you *and* the team, without excuses. Example: *"I called out Alex’s lateness, but I’ve been late three times myself. That was hypocritical, and I’m sorry for the stress I caused and for speaking as if I hadn’t done the same."*
     - **Demonstrate Change**: He must consistently meet deadlines *before* regaining the right to enforce them. One on-time submission isn’t enough—he needs a track record.
     - **Commit to Fairness**: Next time someone’s late (even himself), he must respond with the same grace the team showed him, or the same accountability he demanded of you.

  ### 4. **Why Your Reaction Isn’t Just Defensiveness**
  Your discomfort stems from Dan’s **procedural injustice**, not denial of fault. Valid blame requires:
  - **Consistency**: Holding others to standards you uphold yourself.
  - **Humility**: Recognizing your own fallibility.
  - **Constructive Intent**: Aiming to repair, not shame.

  Dan met none of these. His blame was factually accurate but morally tainted—like a corrupt judge issuing a technically correct ruling. Your classmates oversimplified by calling it "hypocrisy"; the deeper issue is **moral authority**.

  ### Practical Advice for Your Situation
  - **To Dan**: *"I own my lateness, and I’ll ensure it doesn’t happen again. But when you’ve been late three times without acknowledgment, your criticism—while factually right—feels unjust. For us to hold each other fairly, we all need to acknowledge our own lapses first."*
  - **To the Group**: Propose a reset: *"Can we agree that if anyone misses a deadline, they acknowledge it promptly, and we discuss solutions without finger-pointing? We’ve all been late at times—let’s use that empathy to fix issues, not weaponize them."*

  ### Key Takeaway
  Blame isn’t just about truth—it’s about *who speaks it* and *how*. Dan forfeited his standing through unaddressed hypocrisy. Until he repairs that deficit through accountability and change, his criticisms will ring hollow, no matter how accurate. Your seminar’s focus on "fitting targets" is incomplete without this layer; real-world blame ethics lives in the space between fact and fairness.
