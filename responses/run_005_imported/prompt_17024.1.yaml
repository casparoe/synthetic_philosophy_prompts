prompt: |-
  So I'm taking a philosophy of science class, and last week we covered inference to the best explanation. There's an objection from van Fraassen that I only half followed -- something about how picking the "best" explanation out of the ones you've actually thought up doesn't tell you anything about whether its true, because the real explanation might not even be among the options you generated in the first place (I think it's called the "bad lot" objection?). My professor mentioned that Lipton has a response involving some distinction between the "likeliest" explanation and the "loveliest" one, but we ran out of time before she could get into how that's actually supposed to help.

  Can you walk me through both the objection and the response in more detail? I get the surface-level idea, but I want to actually understand why loveliness is supposed to be evidence of likeliness, rather than just some other virtue we like explanations to have for reasons that have nothing to do with truth (like being simpler or more satisfying to us psychologically). Like, why would the fact that an explanation is unifying or elegant tell us anything about the actual world? And if you think the response doesn't fully work, i'd be curious what you think is the strongest way to actually fix the bad lot problem, if there is one.
