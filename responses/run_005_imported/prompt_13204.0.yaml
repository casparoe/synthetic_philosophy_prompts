answer: |-
  You're absolutely right to push beyond the surface resemblance – the devil (and the philosophy) is in the details of how "custom" functions. While the shared skepticism about perceived necessary connection and the reliance on constant conjunction are striking, the roles assigned to "custom" reveal fundamentally divergent philosophical projects. **The resemblance is largely superficial; "custom" is doing radically different work in each system, and their opposing stances on miracles are a direct consequence, not a minor addendum.** Here's the breakdown and the verdict:

  1.  **The Core Function of "Custom":**
      *   **Ghazali ('ādah - عادة):** This is **ontological and theological.** Custom refers to *God's own habitual mode of action* in creating the sequence of events we observe. It's a description of the *divine will in operation*. The regularity of fire burning cotton is not due to any inherent power in fire, but solely because God *chooses*, moment by moment, to create the burning *alongside* the contact with fire, according to a consistent habit ('ādah) He has freely established. This habit is entirely contingent on His will.
      *   **Hume ("custom" or "habit"):** This is **epistemological and psychological.** Custom refers to a *mental operation within human beings*. It's the *feeling of expectation* generated in our minds after repeated observations of conjunction. It explains *why we believe* in causal connections, not *what makes the events conjoined* in reality. Hume remains agnostic (even skeptical) about any underlying ontological necessity or connecting principle "in the objects."

  2.  **Metaphysical Grounding:**
      *   **Ghazali:** Custom rests on a robust **metaphysical foundation: God's omnipotent will.** The regularity *is* real (as God's consistent action), even if the *necessity* is absent. The world's order reflects divine choice and wisdom.
      *   **Hume:** Custom rests on a **psychological foundation: human experience and association.** It explains belief formation but provides *zero* grounding for the regularity itself beyond the brute fact of constant conjunction. Hume deliberately brackets the question of *why* constant conjunction exists. There's no underlying metaphysical anchor for the regularity; it's just a given pattern we observe.

  3.  **The Possibility of the Irregular (Miracles):**
      *   **Ghazali:** This is the **crucial point proving the ontological nature of 'ādah.** Precisely *because* the connection isn't necessary and 'ādah is God's *free* habit, God can *suspend* the customary sequence *at any moment* without contradiction. Abraham not burning is the paradigmatic example. The framework is *designed* to make miracles ontologically possible and epistemologically credible (as direct acts of divine will overriding the usual habit). Custom *facilitates* miracles by showing the normal sequence isn't locked in.
      *   **Hume:** This is the **crucial point proving the psychological nature of custom.** Precisely *because* custom is our *only* guide to belief about matters of fact, and because it's built on uniform experience, testimony about an event *violating* that uniform experience (a miracle) faces an almost insurmountable burden of proof. The framework is *designed* to make belief in miracles extremely difficult, as it pits our strongest psychological propensity (custom) against inherently weaker evidence (testimony). Custom *undermines* miracles by defining the normal sequence as our sole reliable guide.

  4.  **The Nature of the Skepticism:**
      *   **Ghazali:** Skeptical **only about inherent, creaturely causal powers.** He is *not* skeptical about the existence of real connections *per se*; he locates the real, efficacious connection firmly in God's will acting according to His custom. His skepticism serves a **theological purpose: safeguarding divine omnipotence and transcendence.**
      *   **Hume:** Skeptical **about our ability to know *any* necessary connection or power, *anywhere*.** He doesn't affirm a divine will as the alternative; he simply concludes we have no rational insight into the ultimate source of conjunction. His skepticism serves an **epistemological purpose: defining the limits of human knowledge based on experience.**

  **The Verdict:**

  The resemblance is **superficial and potentially misleading.** While both leverage constant conjunction and deny perceived necessary connection, **"custom" is not just dressed differently; it inhabits entirely different philosophical universes:**

  *   **Ghazali's 'ādah is an *ontological principle*:** It's God's *actual mode of operation* in the world, ensuring regularity while preserving absolute divine freedom. It *explains the world's order* metaphysically.
  *   **Hume's custom is an *epistemological/psychological principle*:** It explains *human belief formation* but remains silent (and skeptical) about *why* the world exhibits regularity. It *describes our mental habits* in response to observed patterns.

  **Therefore, the shared term "custom" is primarily a coincidence of translation capturing a surface feature (habitual sequence) while masking the profound chasm beneath.** Ghazali uses the *concept* of divine custom to *ground* the world's regularity metaphysically and *enable* miracles. Hume uses the *concept* of psychological custom to *explain* our belief in regularity and *discredit* miracles. **They are not "onto the same underlying insight"; they are using superficially similar starting points to reach diametrically opposed conclusions about the world's fundamental structure and the possibility of the extraordinary.**

  **How to Frame This in Your Chapter:**

  1.  **Acknowledge the Surface Resemblance:** Briefly note the shared denial of perceived necessary connection and reliance on constant conjunction.
  2.  **Highlight "Custom" as the Key Divergence Point:** Explicitly state that the term's similarity masks a fundamental difference in function: ontological/divine vs. epistemological/psychological.
  3.  **Use Miracles as the Litmus Test:** Argue that their diametrically opposed views on miracles are *not* an incidental consequence but the *necessary outcome* of how each thinker conceives of custom. Ghazali's divine custom *requires* the possibility of suspension for miracles. Hume's psychological custom *demands* extreme skepticism about reports violating the uniformity it describes.
  4.  **Emphasize the Different Philosophical Projects:** Frame Ghazali as working within a theological metaphysics safeguarding God's absolute power, using skepticism about secondary causes instrumentally. Frame Hume as working within a naturalistic epistemology defining the limits of human reason, with skepticism about causation as a core, non-instrumental conclusion.
  5.  **State the Verdict Clearly:** Conclude that while both are skeptical about human perception of necessity, the resemblance dissolves upon examining the radically different roles "custom" plays. Ghazali's occasionalism provides a *metaphysical explanation* for regularity (divine habit), while Hume's account provides a *psychological explanation* for *belief* in regularity, deliberately leaving the metaphysics of the regularity itself unexplained and inaccessible. The "custom" overlap is a fascinating translational artifact, not evidence of shared philosophical substance.
