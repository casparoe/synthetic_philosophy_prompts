answer: |-
  ## The Card Table Clash: Kelly vs. Expected Utility

  **Setting:** A worn mahogany table in the back of "The Ergodic Pub." Empty pint glasses stand sentinel beside a chalkboard smudged with equations. **Arthur**, late 60s, sharp eyes behind wire-frames, radiates the quiet intensity of a physicist turned philosopher. **Beatrice**, early 70s, impeccably dressed, exudes the formidable presence of a lifelong academic economist. They’ve just finished dissecting the flaws in a popular behavioral finance paper.

  **Arthur:** (Tapping the chalkboard showing a coin flip bet: 60% heads, double your stake; 40% tails, lose it all) Beatrice, this is where Samuelson lost me. Forget fancy utility curves for a second. *Look* at the multiplicative dynamics. If I bet fraction *f* of my wealth each time, my wealth after *n* bets is W_n = W_0 * (1 + f)^H * (1 - f)^T. The *growth rate per bet* is g = (H/n) ln(1+f) + (T/n) ln(1-f). In the long run, H/n → 0.6, T/n → 0.4, so g → 0.6*ln(1+f) + 0.4*ln(1-f). Maximizing *that* – full Kelly, f=0.2 here – isn’t some arbitrary preference. It’s *forced* by the structure of repeated multiplication! It’s the only way to not get *crushed* by volatility in the long run. Ole Peters calls it the "time-average growth rate." It’s *objective*.

  **Beatrice:** (Leans forward, eyes gleaming) Arthur, I respect the dynamics. Truly. But you’re committing Samuelson’s "Fallacy of Large Numbers" dressed in ergodic finery. Yes, if you live infinitely long and care *only* about the terminal wealth ratio, maximizing the expected log might get you there. But *I* am not infinitely lived! And *my* wellbeing isn’t measured by the *ratio* W_n/W_0. It’s measured by the *absolute level* of wealth when I need it, filtered through my personal tolerance for risk *along the way*.

  **Arthur:** But the long-run dominance *is* compelling! With Kelly, you’ll almost surely end up vastly wealthier than with any other strategy given enough time. Doesn’t that objective superiority matter?

  **Beatrice:** "Almost surely... given enough time." Precisely the rub! *How much* time? What if I need the money in 10 years, not 10,000? What if the *path* to that glorious long run includes a 90% drawdown next year that ruins me? Kelly maximizes the *median* outcome, but it can have a ghastly left tail. Expected Utility Theory (EUT) *explicitly* accounts for that path-dependence and finite horizons. Why should I, Beatrice, with my specific needs and risk aversion, care about maximizing your *geometric mean* if my *utility* U(W) isn’t logarithmic? Show me why *my* wellbeing is governed by your growth rate metric.

  **Arthur:** (Pauses, then gestures at the beer glasses) Imagine we’re bottling beer. The multiplicative growth rate tells you which process reliably produces the *most beer per unit time* in the long run. That seems objectively desirable for the brewery! Why isn't maximizing the reliable production rate of wealth similarly objectively desirable for the individual?

  **Beatrice:** (Chuckles softly) A good metaphor, Arthur, but it reveals the flaw. The brewery cares about total beer output. Its "utility" *is* linear in total bottles. But *I* don't drink bottles proportionally to the *ratio* of my current wealth to my starting wealth! I derive utility from *absolute* consumption levels. The tenth bottle doesn’t give me ten times the joy of the first – that’s diminishing marginal utility. EUT captures that. Kelly implicitly assumes my utility *is* logarithmic – that a 10% loss hurts exactly as much as a 10% gain pleases, *regardless* of my wealth level. But if I’m risk-averse, a 10% loss when I’m poor hurts *far more* than a 10% gain pleases when I’m rich. Kelly ignores that asymmetry. It optimizes for the bottle count, not the drinker’s satisfaction.

  **Arthur:** So you just posit U(W) and maximize E[U(W)]? Where does U(W) come from? It feels arbitrary. The dynamics of multiplicative growth are *fundamental* and *measurable*. Your U(W) is... psychological. Shouldn’t the dynamics constrain the rational strategy?

  **Beatrice:** "Arbitrary" is unfair. U(W) is *revealed* by consistent choices under uncertainty. It’s an *axiomatic* description of rational preference orderings (completeness, transitivity, continuity, independence). The dynamics tell me the *lottery* I face – the distribution of outcomes. Rationality tells me how to *choose* among lotteries based on my preferences. Saying I *must* use Kelly because of the dynamics is like saying I *must* prefer red wine because the vineyard’s yield was optimized for Merlot! The dynamics define the *options*; my preferences define my *choice*.

  **Arthur:** But doesn't ignoring the growth rate dynamics lead to pathological long-run behavior under repeated play? Betting too much *does* lead to ruin with probability one. Betting too little leaves vast potential growth on the table. Isn't Kelly the *only* strategy that avoids these pitfalls while capturing the growth?

  **Beatrice:** For an entity with *literally* infinite horizon and *no* intermediate consumption needs? Perhaps. But show me that entity! For finite mortals, ruin probability and path-dependence *are* captured within EUT. A highly risk-averse U(W) will choose a fractional bet much smaller than Kelly to minimize the chance of catastrophic loss *within their relevant horizon*. A less risk-averse person might bet over-Kelly, accepting higher volatility for higher *expected absolute wealth*, even if it slightly reduces the *geometric mean*. EUT provides the *framework* to make those trade-offs explicit and consistent. Kelly is a *special case* of EUT – the case where U(W) = ln(W).

  **Arthur:** (Leans back, stroking his chin) So... your objection isn't that Kelly is *wrong* for its specific context, but that it’s *prescriptive* only if you implicitly assume log utility or an infinite horizon? That its claimed "objectivity" smuggles in those assumptions?

  **Beatrice:** Precisely! Samuelson’s fury was directed at the claim that Kelly is *universally* rational or objectively superior *independent* of utility. His one-syllable paper? Pure exasperation at being told his lifetime’s work on the foundations of choice under uncertainty was invalidated by a focus on time-averages in multiplicative dynamics. He’d say: "If you want log wealth, bet Kelly. If not, do not bet that way. Do what fits your want." Wham. Bam.

  **Arthur:** (A slow smile spreads) And the ergodicity crowd would counter that for many real-world decisions – pension funds, long-term investing, evolutionary strategies – the horizon *is* long enough, and the focus *is* on sustainable growth, making Kelly a powerfully *normative* guide. It highlights the often-hidden cost of volatility in multiplicative processes.

  **Beatrice:** (Nods, raising her glass slightly) And I would agree! For those contexts, where the implicit assumptions align, Kelly is profoundly insightful. It’s a vital tool. But it’s not the *foundation* of rationality. It’s a brilliant application *within* the broader framework. The dynamics inform the *consequences*; EUT informs the *choice* based on preferences and constraints. They answer different questions.

  **Arthur:** So... perhaps not enemies, but uneasy allies? Kelly for the *process*, EU for the *person*?

  **Beatrice:** (Clinks her glass against his empty one) Now *that*, Arthur, is a formulation Samuelson might have grumbled at, but ultimately accepted. Pass the chalk. Let's derive the optimal fractional bet for *my* utility function, given *your* coin... and then see how close it is to Kelly. Deal?

  **Arthur:** (Picks up the chalk, grinning) Deal. Let the dynamics meet the desires. Show me your U(W).
