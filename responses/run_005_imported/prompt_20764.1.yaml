answer: |-
  ## Dialogue: The Museum of Discarded Ontologies

  **Setting:** A quiet corner of a natural history museum. A glass case labelled "Theories That Shaped Understanding (Before Being Discarded)" holds: a delicate brass balance scale with a small dish charred black (Phlogiston Demonstration Apparatus), an intricate diagram showing wavy lines flowing between stylized hot and cold cubes (Caloric Fluid Transfer Model), and a small, sealed glass vial filled with clear liquid, labelled "Luminiferous Ether (Representative Sample)".

  **Characters:**
  *   **Elena (Critic):** Sharp-eyed, gestures towards the exhibits. Committed to the pessimistic meta-induction.
  *   **David (Realist):** Calm, thoughtful, fingers resting lightly on the glass. A selective/structural realist.

  **(The scene opens with Elena gesturing emphatically at the case.)**

  **Elena:** Look at this, David. A shrine to scientific hubris. Phlogiston explained combustion beautifully for a century. Caloric made thermodynamics tractable before Carnot and Clausius. The ether? Absolutely *essential* for explaining light propagation, interference, polarization – the works! Maxwell himself built on it. And where are they now? Dust. Worse than dust – *false*. Utterly discarded. This *is* the history of science: a parade of empirically successful falsehoods. How can your realism survive this graveyard tour?

  **David:** It’s precisely *because* I look at this graveyard that I remain a realist, Elena. But not naively. The ‘no miracles’ argument – that the incredible predictive success of science *demands* some approximate truth as the best explanation – is a start. But you’re right, the wholesale falsity of past theories is a challenge. That’s why we need selectivity. We don’t throw the baby out with the bathwater.

  **Elena:** *(Raises an eyebrow)* Selectivity? You mean picking through the rubble after the collapse, salvaging a few bricks and claiming *they* were the real treasure all along? Convenient.

  **David:** It’s more principled than that. Take the star exhibit for selective realism: Fresnel’s equations. Derived within his elastic-solid ether theory to describe light reflection and refraction. Complicated, mechanistic, involving transverse waves in a jelly-like substance filling space. Utterly false ontology.

  **Elena:** As false as this bottled nothingness. *(Taps the ether vial.)*

  **David:** Indeed. But Fresnel’s *equations* – the mathematical relationships describing *how much* light reflects and refracts at an interface between media, depending on angle and polarization – they didn’t just work; they worked *perfectly*. And when Maxwell came along with his electromagnetic theory, radically different ontology – fields, not jelly – what happened? Fresnel’s equations slid seamlessly into Maxwell’s framework. They survived *because* they captured something real about the *structure* of the phenomena, the relationships governing light behaviour, independent of the flawed mechanical model used to derive them. *That’s* what selective realism saves: the genuinely predictive, empirically grounded mathematical core.

  **Elena:** *(Leans in, eyes sharp)* Ah, David, there’s the rub! *How* do you know *which* parts are the "genuinely predictive, empirically grounded mathematical core" worthy of realist commitment *at the time*? Fresnel believed passionately in his ether jelly. So did his contemporaries. The equations were inextricably linked to that ontology. It was *all* part of the working theory. You only isolate those equations *now*, bathed in the glorious hindsight of Maxwell’s success! When Fresnel was calibrating his apparatus, was he committing realism just to the equations? Or to the whole elaborate ether-mechanical package that gave them physical meaning?

  **David:** The commitment is guided by the *empirical success itself*, and crucially, *where* that success manifests. Fresnel derived the equations *from* his model, yes. But the equations made specific, precise, novel predictions – about phase shifts, about Brewster's angle – that were spectacularly confirmed. *That* level of precise, detailed predictive success points to something genuinely latched onto reality. The *model* was the vehicle, often flawed, but the *specific mathematical relationships* that directly yielded confirmed predictions – those are the candidates for survival.

  **Elena:** But *every* part of the theory contributes to the derivation! The ether’s elasticity, its density variations at interfaces – Fresnel needed all that *jelly* to get to the equations! You can’t cleanly separate them in the context of the theory's practice. And how do you apply this *prospectively*? Right now, we have theories brimming with unobservables – dark matter, quantum wavefunctions, inflationary fields. Which bits should the realist commit to? The bits that make the prettiest equations? The bits that give the most accurate predictions *today*? How do you distinguish the future Fresnel equations from the future luminiferous ether? It seems your ‘selectivity’ is just a post-hoc rationalization, a way to declare victory for realism *after* we see which parts future theories deign to keep. It offers no guide for present commitment. It’s realism by hindsight.

  **David:** It’s not arbitrary, Elena. It’s a focus on the *working posits*. Psillos argues we look for what was *essential* to the derivation of the successful predictions. Not just auxiliary assumptions, but the core elements doing the explanatory heavy lifting. In Fresnel’s case, the specific mathematical form of the boundary conditions, derived *from* the mechanics but *tested* by the predictions, was the working posit. The specific density of the ether jelly? Less essential to the specific success; it could be varied somewhat without destroying the predictive equations for reflection/refraction. The *structure* of the relationships was key.

  **Elena:** But how was Fresnel, or anyone *then*, to know that the density was less essential than the boundary condition form? They saw it as a seamless whole! And what about caloric? Lavoisier demolished phlogiston partly by showing mass conservation in combustion – a huge success. He replaced it with caloric fluid, which beautifully explained heat flow, specific heats, even gas laws for a time. Where was the "working posit"? The conservation principle? The fluid concept itself? Both seemed essential then. Now, both fluid *and* conservation principle (as applied to a substance) are gone, replaced by kinetic energy and thermodynamics. Your selectivity seems powerless here – the whole core is discarded. Doesn't that strengthen the meta-induction?

  **David:** Caloric is trickier, I grant you. But even here, *something* was captured. The *idea* that heat is a conserved quantity transferred between bodies? That survived, transformed into the conservation of energy. The relationships between temperature, pressure, and volume for gases – Boyle's law, Charles's law – survived the transition, even if the *mechanism* (fluid pressure) was wrong. The predictive equations relating measurable quantities endured, stripped of the false ontology. The structure of the phenomena was partially grasped.

  **Elena:** Partially grasped, yes. But "partially grasped structure" is a far cry from the robust realism you started with. It feels like a retreat into instrumentalism wearing realist clothes. You save equations, not truths about the world. And the core objection remains: your criterion for identifying the ‘working posit’ or the ‘enduring structure’ relies entirely on knowing the *future* theory. We can only confidently say Fresnel's equations were the keepers *after* Maxwell validated them. For *current* theories, facing the meta-induction, your selective realism offers no shield. We are, right now, like Fresnel, utterly convinced of our dark matter or quantum fields. History screams that we are likely wrong about their fundamental nature. Your distinction between 'working posits' and false ontology is a luxury of hindsight, unavailable to scientists building the theory or realists wanting to commit *now*. *(She gestures again at the case, the vial of ether glinting under the museum lights.)* The past's successful falsehoods are too numerous, too convincing in their time, for your selection to provide present comfort. The induction holds.
