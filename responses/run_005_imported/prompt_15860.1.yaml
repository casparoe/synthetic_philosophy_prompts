answer: |-
  Here's a structured argument for the tension between "Economic Possibilities" (1930) and "My Early Beliefs" (1938), building on Keynes's own later premises to challenge his earlier prediction:

  **Core Tension:** Keynes's 1938 critique of his early Moorean idealism undermines the psychological and sociological feasibility of his 1930 prediction that post-scarcity humanity will effortlessly abandon "purposiveness" (acquisitiveness) and return to Moore's "true ends" (states of consciousness like love, beauty, contemplation).

  **The Argument:**

  1.  **"Economic Possibilities" (1930): The Purposive Man as a Temporary Necessity:**
      *   Keynes diagnoses the "purposive man" (driven by accumulation, hoarding, deferred gratification) as psychologically pathological: a "disgusting morbidity," "semi-criminal, semi-pathological," stemming from an irrational "intensity of the craving for wealth."
      *   He *admits* this behavior is incompatible with Moore's ethics (the "true ends" being states of mind/affections, not instrumental means).
      *   **Crucially, he argues this pathology is *socially necessary* for overcoming scarcity:** "We must pretend to ourselves and to every one that fair is foul and foul is fair; for foul is useful and fair is not. Avarice and usury and precaution must be our gods for a little longer still. For only they can lead us out of the tunnel of economic necessity into daylight." The "purposive" drive is the engine for the compound interest-fueled escape from scarcity.
      *   **Prediction:** Once abundance is achieved (100 years hence), this "pseudo-moral principle" can be jettisoned. Humanity will naturally revert to pursuing Moore's true ends for their own sake, free from the neurosis of accumulation. The "economic problem" solved, the "age of abundance" allows a return to intrinsic values.

  2.  **"My Early Beliefs" (1938): The Critique of Thin Mooreanism & the Primacy of Conventions:**
      *   Keynes repudiates his youthful Apostles-era Moorean idealism as dangerously "thin" and "flimsy."
      *   **The Flaw:** It focused *exclusively* on individual, timeless states of consciousness (love, beauty, truth) as the *only* intrinsic goods. It ignored the messy, contingent, *instrumental* foundations of civilization: "We were amongst the first of our generation... to escape from the Benthamite tradition... We repudiated all versions of the doctrine of original sin... We had no respect for traditional wisdom or the restraints of custom."
      *   **The Danger:** This neglects the *necessary role* of "useful" conventions, traditions, rules, and "non-rational" instincts that *sustain society*. These are not Moorean "ends," but they are essential *means* for preventing civilizational collapse. They provide stability, motivation, and shared meaning.
      *   **Key Insight:** "Civilization was a thin and precarious crust erected by the personality and the will of a very few, and only maintained by rules and conventions skillfully put across and guilefully preserved." Rational calculation of Moorean ends is *insufficient* to hold society together; we rely on deeply ingrained, often irrational, conventions and instincts.
      *   **Consequence:** The mature Keynes sees the world as inherently uncertain and human nature as requiring structures that provide psychological security and social coordination, structures often at odds with pure rationality or Moorean ideals.

  3.  **Building the Case for Tension: Applying 1938 Premises to 1930 Prediction**
      *   **Purposiveness as a Foundational Convention:** In 1930, Keynes identifies purposiveness/acquisitiveness as the *current* necessary "pseudo-moral principle" driving progress. Applying the 1938 lens, this purposiveness isn't *just* a temporary engine; it has become a deeply embedded **civilizational convention**. It structures economic life, defines status and success, shapes institutions, and provides a dominant narrative for motivation ("getting ahead"). It is precisely the kind of "useful," non-rational, convention-bound stuff that 1938 Keynes argues is essential for societal functioning *now*. **Tension Point 1:** If purposiveness is such a vital convention *now*, is it plausible that a century of reliance on it *won't* make it an even more deeply ingrained, psychologically necessary feature of societal structure? Keynes 1938 gives us reason to think conventions become constitutive, not easily discarded tools.
      *   **The Psychological Need for "Useful" Activity:** Keynes 1930 assumes that once material needs are met, humans will naturally turn to "the arts of life." However, Keynes 1938 emphasizes that humans need *purposeful activity* for psychological well-being and social cohesion, *even if that activity isn't directed towards Moorean ends*. He critiques his early self for lacking "awareness of the *insane* and irrational springs of wickedness in most men... the appropriate objects of contempt and hatred." He recognizes the need for *engagement* with the world, not just passive contemplation. **Tension Point 2:** The "purposive" drive, pathological as it may seem in pure Moorean terms, provides a powerful, socially validated outlet for this need for engagement and "usefulness." Abundance might remove the *material necessity* for accumulation, but it doesn't remove the *psychological need* for purposeful striving that the convention of acquisitiveness has channeled and normalized. What replaces this massive, organizing convention?
      *   **The Instability of Discarding Foundational Conventions:** Keynes 1938 is deeply aware of the fragility of civilization and the danger of discarding conventions prematurely or without robust replacements. He saw how the thinness of pure reason/Moorean idealism left his generation unprepared for the irrational forces that led to WWI and the rise of extremism. **Tension Point 3:** The 1930 prediction involves deliberately discarding the *central economic convention* (purposive accumulation) that has driven society for centuries (and specifically the next 100 years). Keynes 1938 provides *no mechanism* for how this massive societal shift in values, motivation, and structure would occur *stably*. He offers only a vague hope. His later self warns that tearing down necessary conventions without understanding their function risks collapse or regression, not utopia. The wishful thinking isn't just about compound interest; it's about the *socio-psychological transition* away from the very convention he admits is currently essential.
      *   **The Problem of "True Ends" without Instrumental Bridges:** Keynes 1930 posits a direct, unproblematic return to Moore's "true ends." But Keynes 1938 argues that these pure states of consciousness are insufficient to organize or motivate a complex society. They require mediating structures – conventions, traditions, institutions – to translate them into sustainable social practice. **Tension Point 4:** The 1930 essay offers no account of *what conventions* would replace purposiveness in the "age of abundance" to facilitate the pursuit of "love, beauty, and the true ends." It assumes the "true ends" are self-activating once scarcity vanishes. Keynes 1938 undermines this by showing that even ideals like "truth" or "beauty" require practical, conventional frameworks to be socially realized and sustained. Without such frameworks (which purposiveness currently provides, however pathologically), the return to "true ends" looks like a vacuum, likely to be filled by new, potentially worse, conventions or a resurgence of purposiveness itself.

  **Conclusion:**

  Keynes's 1938 critique isn't just a nostalgic reflection; it's a profound reassessment of the foundations of social order. By arguing that civilization rests on "useful," non-rational conventions essential for stability and psychological functioning—conventions that pure Moorean rationality dangerously ignores—he implicitly undermines the core psychological and sociological assumption of his 1930 prediction.

  The later Keynes provides strong reasons to suspect that purposiveness, having been deliberately cultivated as the *essential* convention for escaping scarcity for a century, would become so deeply embedded in institutions, habits, and individual psyches that its abandonment would be profoundly destabilizing. He offers no plausible mechanism for replacing this massive organizing principle with conventions capable of facilitating the pursuit of "true ends" at a civilizational scale. The "wishful thinking" in "Economic Possibilities" lies not merely in underestimating compound interest's timeline or challenges, but in its **naivety about the tenacity of socially necessary conventions and the difficulty of engineering a stable transition away from them**, even when their original *material* justification (scarcity) has vanished. The mature Keynes of "My Early Beliefs" understood the depth of this problem far better than the optimistic prophet of "Economic Possibilities."
