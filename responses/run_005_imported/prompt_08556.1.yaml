answer: |-
  ## The Common Prior Mirage: Why Aumann's Theorem Fails to Bind Real Disputants

  The invocation of Aumann's agreement theorem as a bludgeon against persistent disagreement within rationalist circles rests on a foundation that crumbles under scrutiny: the Common Prior Assumption (CPA). Aumann's elegant proof demonstrates that two rational Bayesian agents, sharing a common prior probability distribution over a state space *and* possessing common knowledge of each other's posterior probabilities for some event, *must* have identical posterior probabilities. Disagreement vanishes under these rarefied conditions. But the CPA is not a neutral consequence of rationality; it's a demanding, exogenous input. Harsanyi, in formulating games of incomplete information, treated the CPA as a convenient modeling axiom, explicitly acknowledging it as an assumption rather than a derived necessity. Critics rightly note that this assumption smuggles in a profound homogeneity – a shared starting point for all rational thought – that real-world agents demonstrably lack. Robin Hanson's "uncommon priors require origin disputes" (UPROD) argument represents a valiant but ultimately unsuccessful attempt to retrofit the CPA as a binding requirement of ideal rationality.

  Hanson's gambit is to embed the agents' priors within a larger "meta-prior" over the possible causal histories ("origins") that could have led them to hold those initial beliefs. He argues that if two agents *fully agree* on this causal model of how rational minds like theirs come to hold priors – including the space of possible priors, the evidence-generating process, and their own positions within that model – then, by a pre-rational commitment to consistency within that shared causal framework, they *must* have started with the same prior over the enlarged state space encompassing origins. Any *residual* disagreement in their priors over the *original* proposition, Hanson contends, *must* stem from a fundamental disagreement about their own origins or the nature of the causal model itself. The only legitimate reason for differing priors is a substantive dispute about *how they came to be*.

  **The Verdict: Hanson's Rescue Fails for Bounded Beings; CPA Binds Only Idealized Logical Omniscients**

  Hanson's UPROD argument is ingenious but fatally flawed as a universal rescue of the CPA for rational agents. **The CPA genuinely binds *only* agents who possess perfect logical omniscience and share a fully articulated, mutually known causal model of their own origins.** Real-world disagreements between bounded human reasoners almost never meet these conditions, rendering the CPA inapplicable and the strong deferential posture based on Aumann fundamentally unwarranted. Here's why:

  1.  **The Primacy and Impenetrability of Priors:** Hanson assumes priors are *reducible* to outputs of an origin story adjudicable within a shared meta-prior. This is highly questionable. Core inductive biases, fundamental ways of carving up the world, or basic credences towards simplicity or complexity might be genuinely primitive features of a cognitive architecture, not the conclusion of some prior causal inference chain accessible to the agent. Two agents could agree perfectly on a *descriptive* model of cognitive origins (e.g., "our priors were shaped by evolution and early experience") while still possessing radically different, ineffable *instantiations* of those priors. The meta-prior itself requires grounding in *even more fundamental* priors, leading to an infinite regress. The origin story doesn't escape the need for an initial, ungrounded starting point; it merely pushes it back one level. Hanson hasn't eliminated the arbitrariness; he's relocated it to the meta-level, where it remains just as potent and inaccessible for bounded agents.

  2.  **Logical Omniscience: The Indispensable Scaffolding:** Aumann's theorem, Harsanyi's doctrine, and Hanson's UPROD argument all operate within the realm of *ideal* Bayesian rationality. This includes **logical omniscience** – the ability to instantly compute all logical consequences of any information and update beliefs perfectly accordingly. Real humans are spectacularly non-omniscient. We cannot perfectly compute the implications of complex evidence for our entire belief network, nor can we perfectly represent and compute over the astronomically complex meta-prior over all possible cognitive origins Hanson requires. Disagreements often stem not from differing priors *per se*, but from differing computational paths through complex evidence, differing heuristics applied under cognitive load, differing access to relevant data, or simple failures to grasp the full logical implications of known information. Aumann's theorem, demanding perfect Bayesian updating and common knowledge of posteriors, is silent on these *actual* sources of human disagreement. Insisting the CPA must hold for ideal agents ignores the chasm between that ideal and human reality, where the theorem's preconditions are unattainable.

  3.  **The Regress of Origins:** Hanson's requirement that disagreement implies an origin dispute itself relies on agents sharing a common meta-*meta*-prior over the origins of their origin models. Why should *that* be shared? UPROD doesn't resolve the fundamental heterogeneity; it demands an ever-expanding tower of shared models, each requiring its own shared prior, leading to an infinite regress that only terminates for agents who are, effectively, identical logical gods from the start. For bounded agents, this tower collapses under its own weight.

  **What This Licenses in Practice: Modest Updates, Not Epistemic Surrender**

  The failure of Hanson's UPROD argument and the inapplicability of the CPA to human reasoners demolish the foundation for the strongly deferential posture ("update hard toward anyone you can't out-argue about your own epistemic origins") sometimes advocated. **Learning that a genuine epistemic peer disagrees with you on a matter of importance licenses a *modest* Bayesian update in their direction, but *not* slavish deference.** Here's the practical stance:

  1.  **Update on the Disagreement Itself:** The fact of peer disagreement *is* evidence. It suggests your assessment of the evidence, your reasoning process, or your access to relevant information might be flawed. This warrants a downward adjustment in your confidence, proportional to your respect for the peer's general competence and domain-specific expertise relative to your own. A 10-20% probability shift towards their view might be reasonable, depending on context – not convergence.
  2.  **Investigate the *Actual* Source:** Don't assume the disagreement stems *only* from differing priors requiring an origin dispute. Actively seek to understand *why* they disagree:
      *   **Evidence:** Do they possess crucial evidence you lack, or vice versa?
      *   **Reasoning:** Can you identify flaws in their logic or your own? Did they apply a different heuristic appropriately?
      *   **Interpretation:** Are you interpreting the *same* evidence differently? Why?
      *   **Values/Goals:** (If relevant) Are you actually disagreeing about underlying values or objectives masked as factual disagreements?
  3.  **Consider Origins Selectively:** If the disagreement persists after investigating evidence and reasoning, *then* consider if a fundamental difference in priors stemming from differing background assumptions or life experiences might be at play. Hanson's argument, while failing as a *requirement*, highlights that disagreements *can* sometimes be traced to such deep differences. However, diagnosing this is difficult and often inconclusive. It doesn't mandate adopting the other's prior; it simply deepens your understanding of the disagreement's roots.
  4.  **Resist Deference, Embrace Scrutiny:** You are *not* rationally obligated to abandon your view simply because a peer holds a different one, even if you cannot definitively "win" an argument about origins. The burden remains on *both* parties to articulate their reasoning and evidence. Yudkowsky's caution in *Inadequate Equilibria* against premature deference is well-placed. Bounded rationality means imperfect models abound; updating should be driven by the *content* of the disagreement and the *quality* of the arguments and evidence presented, not merely by the *fact* of disagreement under an inapplicable idealization.

  In conclusion, Aumann's theorem, reliant on the Common Prior Assumption, provides a compelling result for idealized, logically omniscient agents sharing a causal origin story. Robin Hanson's "uncommon priors require origin disputes" fails to bridge the gap to human rationality, succumbing to the problems of primitive priors, the necessity of logical omniscience, and infinite regress. The CPA binds only idealized agents we are not. Therefore, encountering peer disagreement should trigger reasoned investigation and modest confidence adjustment, not a surrender of judgment based on a mathematical mirage of mandatory consensus. Our epistemic duty is to seek truth through critical engagement, not to conform based on a theorem describing gods we cannot be.
