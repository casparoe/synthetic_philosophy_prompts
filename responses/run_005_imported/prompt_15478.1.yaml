  Another point is the metaphysical basis. Propensities are grounded in the physical setup at a specific time. The reverse conditional P(C|E) lacks such grounding because the cause precedes the effect. So, it's not a real propensity but a calculation.

  Also, emphasizing that Bayes' theorem is a mathematical tool, not a metaphysical assertion. Using it doesn't imply backward causation; it's just a way to update beliefs based on evidence. The propensity theorist can adopt this view without contradiction.

  I should also address possible objections. For instance, if someone argues that all probabilities in the calculus must be propensities, the response is that conditional probabilities like P(C|E) are derived, not primitive propensities. They are byproducts of the setup's forward propensities and don't require new causal powers.

