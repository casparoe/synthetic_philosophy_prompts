  Now, to address this. The key is to argue that conditional propensities aren't inherently causal in both directions. Propensity theorists can maintain that the propensity of cause given effect isn't a real causal propensity but a derived epistemic probability. For example, the propensity P(C) is the causal tendency of the setup to produce C. P(E|C) is the forward propensity for E given C. But P(C|E), derived via Bayes' theorem, is just a logical consequence, not a new causal power.

