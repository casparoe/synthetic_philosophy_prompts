answer: |-
  That's an exceptionally sharp framing of a notoriously thorny issue – and your instinct about the asymmetry is widely shared among specialists. Let's break it down systematically, as requested:

  ### I. Frege: Anti-Semitism & Logicist Foundations

  *   **Strongest Argument FOR Entanglement:**
      *   **Ethnocentric Logic?** Proponents (like Hans Sluga) argue Frege's logicism wasn't *just* formal abstraction. His *Grundlagen* defines numbers as belonging to "concepts," but concepts are grasped by minds within linguistic communities. If he believed certain "peoples" (like Jews) were fundamentally alien or corrosive to the German *Volksgeist* (as his diary explicitly states), could this undermine the universality presupposed by his logic? His fierce nationalism and belief in a homogeneous German state might implicitly shape his view of the rational community capable of accessing objective *Sinn* and *Bedeutung*.
      *   **Nationalism & Scientific Purity:** His diary rails against "Jewish influence" corrupting German science and politics. Could his drive for absolute logical clarity and "purity" in thought (free from "foreign" contamination) mirror his desire for a "pure" German nation? The logicist project aimed to cleanse mathematics of psychological impurities; his politics aimed (in his view) to cleanse Germany of racial impurities. This suggests a shared mindset of purification and exclusion, even if the domains are different.
      *   **Rejection of Liberalism/Parliamentarism:** His contempt for Weimar democracy stemmed partly from a belief that truth and national destiny shouldn't be subject to debate or compromise – mirroring his view that logic and arithmetic reveal objective, non-negotiable truths. The "strongman" he desired would impose order and truth, much like logic imposes order on thought.

  *   **Strongest Argument AGAINST Entanglement (Compartmentalization):**
      *   **Formal Universalism:** Frege's *technical* work rigorously establishes laws of thought applicable to *any* rational being, irrespective of race, nation, or creed. The concepts of *Sinn* and *Bedeutung*, the logical laws in the *Begriffsschrift*, the logicist reduction – none of these *depend* on or *reference* any contingent historical, racial, or political concepts. They operate at a level of pure abstraction.
      *   **Absence in the Corpus:** There is *zero* trace of anti-Semitism, nationalism, or political ideology in his *published* philosophical or mathematical writings. The vile views are confined to a private diary written late in life, during a period of personal bitterness and national turmoil.
      *   **Methodological Firewall:** Frege's philosophical methodology demands radical separation between the psychological/empirical (which includes personal beliefs and biases) and the logical/objective. His own repugnant politics fall squarely into the realm of the psychological/empirical that his philosophy *explicitly brackets out* as irrelevant to logical truth. The "two sealed rooms" analogy fits well here. His philosophy provides the tools to rigorously *analyze* propositions, regardless of the proposer's identity or beliefs.

  ### II. Heidegger: Nazism & Fundamental Ontology

  *   **Strongest Argument FOR Entanglement:**
      *   **Core Concepts in Political Context:** Key *Being and Time* themes resonate alarmingly with Nazi ideology when contextualized:
          *   **Authenticity (*Eigentlichkeit*) vs. The "They" (*Das Man*)**: Authenticity involves seizing one's ownmost possibilities, breaking from the conformist, leveling, inauthentic chatter of "the They." Nazis framed this as rejecting liberal/parliamentary "decadence" and embracing the *Volk*'s true destiny. Heidegger's disdain for "idle talk" mirrors Nazi attacks on democratic discourse.
          *   **Historicity (*Geschichtlichkeit*) & Destiny (*Geschick*)**: *Dasein*'s existence is fundamentally historical, rooted in a shared heritage and destiny (*Schicksal*) of a people (*Volk*). Heidegger explicitly linked Germany's *Geschick* in the 1930s to the National Socialist "movement" and its "inner truth and greatness" (a phrase he notoriously used in 1935 and defended later).
          *   **Resoluteness (*Entschlossenheit*)**: The authentic *Dasein* acts with decisive resoluteness in the face of its fate. This easily maps onto the Nazi cult of action, will, and the *Führerprinzip*.
          *   **"The German Essence" & "Spiritual Mission":** His Rectoral Address (1933) and contemporaneous writings explicitly tie his philosophical project (renewing the question of Being) to the "spiritual mission of the German people" under National Socialism, framing it as a unique historical moment demanding total commitment.
      *   **Ontological Anti-Semitism?** While debated, some scholars (e.g., Trawny, Mitchell) argue Heidegger's late critiques of "world Jewry" (framed as rootless, calculative, embodying "Machenschaft" – machination) attempt to place anti-Semitism on an *ontological* level, seeing it as a symptom of the essence of modernity he opposed, rather than merely biological racism. This integrates it into his core philosophical narrative about the history of Being.
      *   **Lack of Clear Recantation:** Unlike Frege (whose views were private and died with him), Heidegger never offered a full, unambiguous repudiation of Nazism or adequately addressed his involvement, suggesting he saw *some* enduring connection between his philosophical insights and the political moment, even if he later disdained the party's actuality.

  *   **Strongest Argument AGAINST Entanglement (Compartmentalization):**
      *   **Misappropriation Thesis:** Defenders (like Otto Pöggeler, cautiously) argue Heidegger *used* Nazi terminology opportunistically during his Rectorship to advance his university reform agenda and gain influence for his philosophy, but his *core* concepts in *Being and Time* are fundamentally distinct from Nazi ideology. Authenticity isn't inherently about race or nation; resoluteness isn't inherently about blind obedience.
      *   **Critique of Actual Nazism:** Heidegger privately expressed disillusionment with actual Nazi policies and bureaucracy relatively early (though never renounced the core ideology or Hitler). His later critiques of technology (*Gestell*) and modern subjectivity implicitly critique aspects of the totalitarian state and mass mobilization Nazism embodied.
      *   **Transcendent Aim:** Heidegger's ultimate concern was the "Question of Being" – a fundamental metaphysical inquiry that transcends any specific political configuration. Nazism, in this view, was a catastrophic error in judgment about a *temporary means* to address a spiritual crisis he diagnosed, but not inherent to the diagnosis itself. The philosophy aims at a deeper level of understanding than politics.

  ## The Verdict: Heidegger Shows Stronger Entanglement

  **Reasoning:**

  1.  **Direct Conceptual Overlap & Political Application:** The connection between Heidegger's core existential-ontological concepts (Authenticity, Historicity, Destiny, Resoluteness, Volk) and Nazi ideology is **textual, thematic, and explicitly stated by Heidegger himself** during the crucial period (1930s). He *saw* Nazism (initially) as the political enactment of the existential-historical diagnosis laid out in *Being and Time*. The concepts *lend themselves* directly to fascist interpretation and were actively used that way by the philosopher.
  2.  **Integration into Philosophical Narrative:** Heidegger didn't just hold Nazi views *alongside* his philosophy; he **attempted to integrate the Nazi moment into his grand narrative of the "History of Being."** His critique of modernity provided an ontological framework *within which* his support for Nazism (and later, his specific form of anti-Semitism) could be philosophically situated. The politics weren't just adjacent; they were positioned as a response to the philosophical problem he defined.
  3.  **Scale and Nature of Involvement:** Frege's diary was private, late-life ranting with no connection to his work. Heidegger was the Rector of Freiburg University under the Nazis, implemented Nazi policies (including the dismissal of Jewish colleagues), gave propaganda speeches explicitly linking his philosophy to the movement, and maintained party membership until 1945. His philosophy was **actively mobilized in service of the regime**.
  4.  **Absence vs. Presence in the Work:** Frege's bigotry is **completely absent** from his technical philosophical publications. Traces of Heidegger's political commitments and the concepts that facilitated them **permeate** his major work (*Being and Time*) and are **explicitly central** to his political writings/speeches of the 1930s. The latter cannot be easily bracketed as "non-philosophical."

  **Conclusion:** While both cases are morally reprehensible, the argument for a **genuine, defensible entanglement between core philosophical concepts and repugnant politics is significantly stronger in Heidegger's case.** His fundamental ontology provides a powerful vocabulary and existential framework that resonates deeply with, and was actively used to justify, fascist ideology. Frege's logicism, in stark contrast, operates at a level of formal abstraction that his vile personal views neither logically depend on nor visibly contaminate. The "sealed rooms" analogy holds far better for Frege than for Heidegger, where the walls between the rooms show significant cracks and even deliberate doorways built by the philosopher himself. Your initial hunch aligns with the prevailing scholarly assessment: Heidegger's entanglement is philosophically substantive; Frege's appears more as a horrific personal failing tragically compartmentalized from his revolutionary intellectual achievement.
