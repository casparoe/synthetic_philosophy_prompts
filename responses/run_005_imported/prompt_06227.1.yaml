answer: |-
  The air in Tribunal Chamber Seven smelled of ozone and desperation. Outside the polarized windows, Vancouver’s rain sluiced down skyscraper canyons, mirroring the grey exhaustion on Elara Vance’s face. Inside, the hum of the redundant power supplies for the tribunal's neural recorders was a constant thrum beneath the raised voices.

  Two women sat at the claimant’s table, identical down to the faint scar bisecting the left eyebrow. Eleanor Chen. Or rather, Eleanor Chen Alpha and Eleanor Chen Beta. A faulty disintegrator module in a Telaport booth meant one scan, two prints. Now they both claimed sole inheritance under Old Man Chen’s iron-clad will: *"To my beloved daughter, Eleanor, in entirety."* The estate was substantial – a biotech empire. There could only be one heir.

  Elara smoothed her worn suit jacket. *Expert Witness. Persistence Through Time Specialist.* The irony tasted like stale coffee. Her own PhD thesis on endurance versus perdurance gathered dust, abandoned when the funding dried up and the real-world implications of her abstract debates started paying the rent. Now she testified for whichever side hired her first.

  Today, she was for Alpha. The one who’d emerged blinking in Vancouver. Beta had materialized, confused, in the backup facility in Singapore. Alpha argued continuity: *she* was here, *she* remembered stepping into the booth in Vancouver. Beta was a copy, a legal fiction.

  Opposite her, smirking slightly, sat Marcus Thorne. Another philosophy washout, now the darling of the corporate perdurantists. He’d argue for Beta, naturally. He loved the ontological flexibility.

  The Tribunal Arbiter, a stern woman named Petrova, silenced the murmuring gallery. "Proceed, Ms. Vance. Establish the persistence claim for Eleanor Chen Alpha."

  Elara took a breath, the familiar arguments clicking into place like well-worn gears. "Arbiter Petrova, the principle is clear. Eleanor Chen is a single, enduring entity. She is wholly present at each moment of her existence. The woman who entered the Telaport booth in Vancouver is numerically identical to the woman sitting here now, Eleanor Chen Alpha. The scanning process captured her state at T-zero. The printing process instantiated that state in Vancouver. The failure occurred *after* the scan, destroying the original body but *not* interrupting the continuous existence of Eleanor Chen, who is now present here."

  She gestured towards Alpha. "Eleanor Chen Beta, printed from the *same* scan data but in Singapore, is a distinct entity. She may share all memories, all psychological traits up to T-zero, but she began her existence *at that moment* in Singapore. She is a duplicate, not the original enduring person. Identity is strict, one-to-one, and transitive. You cannot have two numerically identical entities from one."

  Petrova nodded, her expression unreadable. "Mr. Thorne? Counter."

  Thorne stood, radiating calm confidence. "Thank you, Arbiter. Ms. Vance paints a compelling picture of a solid, unchanging *thing* gliding through time. A statue wholly present each second." He paused, letting the image hang. "But people aren't statues. They change. Radically. The Eleanor Chen of five years ago bears little resemblance, physically or psychologically, to the Eleanor Chen of today. Yet we call them the same person. Why?"

  He turned to the tribunal panel. "Because we recognize a chain of connected stages. *This* momentary stage of Eleanor Chen," he pointed to Alpha, "is intimately connected, causally and psychologically, to the stage that entered the booth. *That* stage," he pointed to Beta, "is *also* intimately connected to the booth-stage. They are both equally valid continuations, equally 'Eleanor Chen' in the only sense that matters for persistence – the counterpart relation. The booth-stage has two excellent future counterparts. There's no contradiction, only a branching path. Inheritance law cares about the *person-stage* entitled under the will, and both claimants are equally entitled successors to the pre-scan stage."

  Petrova leaned forward. "Ms. Vance? The transitivity argument. If Alpha is identical to Pre-Scan Eleanor, and Beta is also identical to Pre-Scan Eleanor, doesn't logic demand Alpha must be identical to Beta? Yet they are manifestly two distinct individuals now."

  Elara felt the familiar intellectual trap closing. This was where endurantism always got sticky. "Arbiter, identity *is* transitive. But Beta *cannot* be identical to Pre-Scan Eleanor. She is a *new* entity created from the data. Only Alpha maintains the strict, unbroken thread of numerical identity through the process. The destruction of the original body is the termination of the enduring entity unless a *single* continuation exists. Here, there are two. Therefore, Pre-Scan Eleanor ceased to exist, and two new entities, Alpha and Beta, began."

  Thorne pounced. "So Pre-Scan Eleanor is *dead*? And these are two clones? Is that your testimony? Because that has profound implications for liability, for contracts signed minutes before the scan…"

  Elara clenched her jaw. "I… the *enduring entity* ceased. New entities began." It felt like a retreat.

  "Based on an arbitrary insistence on a magical 'endurance' thread?" Thorne pressed. "The data is identical. The causal connection is identical. The psychological continuity is identical. The only difference is location and a microsecond of temporal offset in activation. Is *geography* the deciding factor for metaphysical identity? Or is it just a useful fiction we cling to?"

  The argument raged. Thorne laid out the problem of temporary intrinsics effortlessly: "Eleanor Chen Alpha is exhausted right now. Two hours ago, after coffee, she was alert. Are they the *same* enduring entity wholly present at both times? How? The properties contradict! Stage theory handles this naturally – different stages, different properties, linked by relation."

  Elara countered, feeling the strain: "Change is the replacement of properties within the *same* enduring substance! Exhaustion and alertness are properties *of* Eleanor, not defining different entities!" It sounded hollow, even to her. She remembered her own morning: dragging herself out of bed, a leaden weight; then, after a scalding shower and two stim-tabs, a brittle alertness. Was *she* the same thing? Truly *wholly* present in both states? Or just… connected? The thought was vertigo-inducing.

  The tribunal recessed. Elara slumped in a quiet corridor, head throbbing. She pulled out a stim-tab, dry-swallowing it. *One entity*, she thought fiercely. *I endure. Through the exhaustion, through the caffeine spike. I am here. Wholly.*

  She thought of the Chen sisters. Alpha, radiating anxious entitlement. Beta, quieter, but with the same fierce determination in her eyes. Both had lived the same life up to the split. Both *felt* like Eleanor Chen. Both *were* Eleanor Chen, in every way that mattered… except the one her philosophy demanded. The transitivity argument echoed: A = Pre-Scan. B = Pre-Scan. Therefore A = B. But A and B were drinking different coffees *right now*. Contradiction. *Therefore…* the premise was wrong? Or identity broke?

  The verdict, when it came, was coldly pragmatic. Petrova addressed the chamber.

  "The Tribunal finds that metaphysical debates on persistence, while intellectually rigorous, provide no singular, unambiguous resolution applicable to this legal context. The will specifies 'my beloved daughter, Eleanor'. Both claimants demonstrably possess the memories, psychology, and physical form of Eleanor Chen as of the time of the scan. Both are causally continuous with the individual who was the beneficiary under the will.

  "Therefore, applying a perdurantist framework as the most functionally consistent with the reality of duplication technology and the intent of legacy instruments, we rule that *both* Eleanor Chen Alpha and Eleanor Chen Beta are legal successors to the estate of the deceased, Eleanor Chen (Pre-Scan Stage). The estate shall be divided equally between them."

  A murmur swept the room. Alpha looked furious. Beta looked stunned, then relieved. Thorne offered Elara a tight, not unkind smile. He’d won the legal argument. But the metaphysics? That remained stubbornly unresolved.

  Elara gathered her notes, the stim-tab’s artificial energy buzzing through her veins, overlaying the deep exhaustion beneath. She was Elara Vance, tired and wired, testifying and testifying again. Was she the same enduring entity who’d argued hours ago? The same as the woman who’d abandoned her thesis? The same as the hopeful grad student?

  She walked out into the Vancouver rain. The cool droplets hit her face – a sensation experienced by *this* stage, connected to the one before, and the one before that. A chain. A thread. Or just… stages in the rain? The question hung, heavy and persistent, as real and as unanswered as the downpour itself. She hailed a cab, one entity stepping into the vehicle, wholly present, yet undeniably changed by the day. The contradiction lived within her, a personal tribunal without a verdict.
