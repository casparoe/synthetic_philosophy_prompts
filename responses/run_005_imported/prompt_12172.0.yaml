answer: |-
  Davidson's "A Nice Derangement of Epitaphs" presents a profound challenge to his earlier picture of radical interpretation, centered on the **prior theory/passing theory distinction** and its implications for the concept of a "shared language." Let's break down the argument and address the tension:

  ### 1. The Prior Theory/Passing Theory Distinction & Its Role
  *   **Prior Theory:** What an interpreter *believes* the speaker's words *conventionally mean* before a specific utterance occurs. It's the interpreter's pre-existing hypothesis about the speaker's language (semantic rules, syntax, standard meanings). This corresponds roughly to the "truth theory" of radical interpretation *before* encountering a novel utterance.
  *   **Passing Theory:** What the interpreter *actually uses* to correctly interpret the speaker's *specific, current utterance*. It's the theory that *works* for *this* utterance, *here and now*. It may radically depart from the prior theory due to malapropisms, metaphors, slips, or novel coinages.

  **The Work of the Distinction:**
  *   **Exposing the Gap:** The distinction highlights that successful interpretation *never* relies solely on the perfect alignment of pre-existing conventional linguistic knowledge (prior theories). Malapropisms (e.g., Mrs. Malaprop saying "a nice derangement of epitaphs" meaning "a nice arrangement of epithets") prove that speaker and hearer can have *vastly different* prior theories about word meanings, yet communication succeeds *if* the hearer arrives at the correct passing theory.
  *   **Shifting the Locus of Success:** Successful communication requires the *convergence* of the speaker's *intended* meaning (what the speaker expects the hearer to understand) and the hearer's *actual* interpretation (the hearer's passing theory). Crucially, this convergence is *local* and *momentary* – it happens for *this specific utterance*. It does *not* require convergence on the *general rules* (prior theories) that *led* each party to their respective positions for this utterance.
  *   **Undermining "Shared Language":** Davidson argues:
      1.  **Divergence is Ubiquitous:** Prior theories *always* differ between speaker and hearer, at least in subtle ways. Malapropisms are extreme, visible cases, but subtle differences exist constantly due to idiolects, contextual nuances, and imperfect learning.
      2.  **Passing Theories are Idiosyncratic & Transient:** The passing theory needed for *this* utterance is specific to this speaker, this hearer, and this moment. It's not a stable, shared object. What works for "derangement" here won't necessarily work for the next utterance or a different hearer.
      3.  **No Stable Core:** There is no fixed, shared "core" set of conventions that persists across all successful communications. What matters is the *ability* to converge on passing theories *when needed*, not the possession of identical prior knowledge.
      *   **Conclusion:** Therefore, "there is no such thing as a language" in the traditional sense – no abstract, stable, shared system of rules or conventions (like English or French) that speakers "know" and whose mastery *explains* their ability to communicate. Shared prior theories (conventional competence) are neither necessary nor sufficient for communication. The *ability to converge* on passing theories is what matters.

  ### 2. Why This Shows Convention Isn't Necessary
  *   **Malapropisms as Proof of Concept:** Mrs. Malaprop demonstrably lacks mastery of the *conventional* meanings of the words she uses ("derangement," "epitaphs"). Her hearer (Captain Absolute) likely has the correct conventional meanings in *his* prior theory. Their prior theories *diverge radically* on these words.
  *   **Success Without Convention:** Yet, Captain Absolute *understands* her. He constructs a passing theory on the fly, likely based on context, sound similarity, and charitable interpretation of her likely *intentions* ("arrangement," "epithets"). His *prior* conventional knowledge *misled* him initially; it was his ability to *abandon* it and construct an *idiosyncratic* passing theory that allowed success.
  *   **The General Point:** If communication can succeed when speakers demonstrably *lack* conventional competence for the specific words used (Mrs. Malaprop) and when hearers must *override* their conventional knowledge (Captain Absolute), then conventional mastery cannot be a *necessary* condition for successful interpretation in general. It's a sometimes-useful tool, not the foundation.

  ### 3. Tension with the Early Picture & Potential Reconciliation
  **The Tension:**
  1.  **Fixed vs. Transient:** The early picture posits understanding as knowledge of a *fixed*, *recursive* truth theory for the speaker's *language*. "A Nice Derangement" argues that no such fixed, shared language exists. Meaning is negotiated per utterance via transient passing theories.
  2.  **Conventional Foundation vs. Anti-Conventionalism:** Radical interpretation relies heavily on the Principle of Charity operating over *conventional* patterns of truth-conditions inferred from behavior. "Derangement" explicitly denies that shared conventions are foundational.
  3.  **Stability vs. Occasion-Sensitivity:** The early theory aims for a stable theory capturing linguistic *competence*. The later view emphasizes radical *occasion-sensitivity* – meaning is forged in the moment.

  **Reconciliation? Relativizing the Truth Theory:**
  Davidson himself hints at a path forward. The key is to **identify the passing theory *as* the relevant truth theory for understanding an utterance:**

  *   **"Passing Theory as Truth Theory":** For a *specific utterance* by a speaker S to a hearer H, the passing theory H constructs *is* the truth theory that correctly gives the truth conditions (or meaning) of S's utterance *on that occasion*. Understanding *that utterance* just *is* H possessing that specific passing theory.
  *   **Relativization:** We abandon the idea of a *single*, stable truth theory for a speaker's "language." Instead, we speak of truth theories *relative to a specific utterance context* or *a specific interpretive interaction*. Understanding S's utterance U requires knowing the truth theory (passing theory) that works for U.
  *   **Retaining Compositionality:** Crucially, Davidson insists passing theories *must still be compositional*. Even to understand a malapropism like "derangement," H must assign it a meaning within a structure that allows H to interpret the whole sentence ("a nice derangement of epitaphs") based on the meanings assigned to its parts and their arrangement. The *recursive machinery* of the truth theory is preserved, but its *lexical entries* (word meanings) are radically context-dependent and potentially unique to that utterance.
  *   **Characity's Role Shifts:** The Principle of Charity doesn't primarily fix a stable language. Instead, it's a constant heuristic guiding the *construction of passing theories* moment-by-moment. We interpret charitably *to make sense of this specific utterance*, maximizing truth or rationality *in this instance*, to converge on a passing theory.

  **Why this (partially) resolves the tension:**
  1.  **Understanding as Truth Theory Knowledge Preserved:** Understanding an utterance *is* still possession of a (Tarski-style) truth theory that delivers its meaning – it's just that this theory is the *passing theory* for *this* utterance.
  2.  **Compositionality Preserved:** The core insight that meaning is compositional and requires a recursive structure remains essential *even for passing theories*. Malapropisms aren't holistic gibberish; they are parsed compositionally using *locally assigned* meanings.
  3.  **Radical Interpretation as Framework:** The *method* of radical interpretation – inferring truth conditions from behavior under constraints of charity – can be seen as the *general ability* that underlies the capacity to construct passing theories on the fly. What we learn from behavior isn't a fixed language, but the *principles and dispositions* that allow us to generate successful passing theories in interaction.

  **Remaining Challenges:**
  *   **Ephemerality:** Passing theories are fleeting. Is "knowledge" of such a transient entity the right model for understanding? The early theory captured a more durable competence.
  *   **Predictive Power:** A fixed truth theory aims to predict interpretations for *novel* utterances. Can a theory defined *only* for a single utterance do this? Davidson argues the *ability* to construct passing theories *is* the competence, but it's less codified.
  *   **The "No Language" Claim:** Even if truth theories are relativized, Davidson's strong conclusion that "there is no such thing as a language" remains a stark departure from the assumptions underlying the *explanatory goals* of the early project, which sought to characterize a speaker's linguistic knowledge *over time*.

  **Conclusion:**

  Davidson's prior/passing distinction powerfully demonstrates that successful communication doesn't require pre-shared identical linguistic conventions (prior theories), but only the moment-by-moment convergence on utterance-specific interpretations (passing theories). This leads him to reject "shared language" as conventionally understood.

  While this creates tension with the early picture of understanding as knowledge of a *stable* compositional truth theory, a reconciliation is possible by **identifying the passing theory *as* the relevant truth theory for a specific utterance.** Understanding an utterance *is* possessing its passing theory, which must still be compositional. The Principle of Charity and the core structure of a Tarskian truth theory are retained but are redeployed dynamically to generate transient, occasion-specific meaning assignments rather than characterizing a stable language. The radical interpreter is not discovering a fixed language but discerning the principles underlying a speaker's ability to make themselves understood through the dynamic construction of passing theories. The tension is mitigated, but the shift from characterizing stable competence to explaining dynamic, ephemeral convergence remains significant.
