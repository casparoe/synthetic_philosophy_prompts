prompt: |-
  Ok this is gonna sound like a weird lead-in but bear with me. At my company we have a design-review process for big changes where three senior engineers each vote independently on an RFC, and the rule is "approved only if the design is technically sound AND the rollout plan is safe" — two separate yes/no calls that are supposed to feed into one final approve/reject. On a doc last month, reviewer A said sound=yes, safe=no (so their vote was reject), reviewer B said sound=no, safe=yes (also reject), and reviewer C said sound=yes, safe=yes (approve). Tally the final votes and it's 1-2, rejected. But someone in the Slack thread pointed out that if you instead tally each sub-question seperately, "sound" gets 2 yes's (A and C) and "safe" also gets 2 yes's (B and C) — so by the letter of the rule it actually should've passed. We argued about this for an embarrassingly long time and never fully resolved it. Eventually a friend who minored in philosophy told me this is an honest-to-god known problem, something like the "discursive dilemma" (or "doctrinal paradox" for the original legal version — I think that one's from Kornhauser and Sager, about appeals judges), and that List and Pettit (not 100% sure I've got the names right) later turned it into a whole formal "judgment aggregation" theory, with an impossibility result that's apparently a bit like Arrow's theorem but for judgments instead of preferences.

  I went down the wiki-hole on this for a couple of nights, and my honest takeaway is that nobody actually commits to an answer — every source just lays out both options and shrugs. That's not good enough for me. What I want is an actual verdict: please make the strongest case you can that whenever a group has to reach one binary decision that logically depends on several separately-contestable sub-judgments (my RFC case, or the classic multi-issue court case), the group should default to voting on each sub-judgment separately and deriving the final call from those votes (the "premise-based" procedure), rather than voting on the bottom-line outcome directly (the "conclusion-based" procedure). And don't just say "it respects the majority on every issue" and call it a day — actually grapple with the real objections, like the fact that whoever decides which sub-questions get put on the agenda in the first place can steer the outcome, and the fact that (from what I understood of my reading) issue-by-issue majority voting isn't even guaranteed to stay logically consistent once you've got more going on than my simple two-condition example.
reasoning: |-
  Okay, the user presents a fascinating dilemma rooted in judgment aggregation theory—specifically the doctrinal paradox. They've encountered a real-world scenario where their company's RFC review process led to conflicting outcomes depending on whether votes were aggregated by premise or conclusion. After diving into theoretical literature (name-dropping Kornhauser, Sager, List, Pettit), they express frustration that academia "shrugs" at resolving the paradox. Their explicit demand is bold: a definitive, steel-manned defense of premise-based voting that confronts its weaknesses head-on, not just textbook advantages.

  Hmm, what's beneath the surface? First, they're clearly intellectually rigorous—they cite specific theorists and recognize deeper issues like agenda control and logical consistency. Second, they're pragmatically motivated: this isn't academic curiosity; their team needs a decision procedure that holds up under scrutiny. The subtext screams, "I need ammunition to settle this debate at work!" Also notable: they dismiss superficial arguments ("don't just say it respects majority per issue"), signaling they've already considered common rebuttals. 

  The core tension they want resolved: How can premise-based voting be justified when it (a) empowers agenda-setters and (b) risks collective irrationality? My response must validate their sophistication while delivering concrete, battle-tested arguments. Key angles to emphasize: 

  - **Procedural fairness over illusory consistency**: Conclusion-based voting creates false consensus by ignoring dissent on premises. Premise-based forces explicit resolution of foundational disagreements—which engineers would appreciate.  
  - **Mitigating agenda control**: Acknowledge the risk but argue that well-defined RFC criteria (like their "sound/safe" split) naturally constrain manipulation. Contrast with conclusion-based voting, where vagueness invites bias.  
  - **Transparency as damage control**: Even if premise voting yields inconsistency, it exposes *why*—letting teams debug flawed premises. Conclusion-based failures leave teams guessing.  

  Crucially, I should avoid theory wonkery. Anchor examples in their RFC case: e.g., "When Reviewer A rejects on safety, premise voting preserves that signal; conclusion voting buries it." Finally, concede that no system is perfect—but premise-based is the least bad for truth-seeking organizations. Their frustration with academic non-answers suggests they'll respect honesty about tradeoffs.
answer: |-
  You've hit the nail on the head – this **is** the doctrinal paradox (Kornhauser & Sager) / discursive dilemma (List & Pettit), and its implications are profound. While sources often present both approaches neutrally, I *will* make the strongest case for **premise-based voting** (voting on sub-judgments) as the superior default for decisions like your RFC process. Let's grapple with the core objections head-on.

  **The Core Argument: Truth-Seeking Requires Premise Transparency**

  1.  **The Decision *Is* the Premises:** The final "Approve/Reject" isn't a distinct, mystical entity; it's *logically defined* by the conjunction (or disjunction, depending on the rule) of the premises. Voting directly on the conclusion asks reviewers to perform a hidden aggregation step themselves, obscuring *why* they reached their verdict.
      *   **Your RFC Case:** Reviewer A (`Sound=Y, Safe=N -> Reject`) and Reviewer B (`Sound=N, Safe=Y -> Reject`) both voted "Reject," but for *diametrically opposite and incompatible reasons*. One thought the design was flawed, the other thought the rollout was dangerous. Aggregating their conclusion votes (`Reject, Reject, Approve`) hides this critical conflict. Premise-based aggregation (`Sound: Y,Y,N -> Majority Y`; `Safe: N,Y,Y -> Majority Y`) reveals that the collective judgment on *both necessary conditions* was positive, satisfying the rule's logical structure. The conclusion vote aggregation produced a result (`Reject`) that contradicts the collective judgment on the premises defined by the rule itself.

  2.  **Respecting Expertise on Specifics:** Senior engineers likely have varying strengths. One might be a security guru (deep insight into "safe"), another a scalability expert (deep insight into "sound"). Premise-based voting allows each to apply their specific expertise directly to the question they are best qualified to judge. Conclusion-based voting forces them to make a holistic judgment where they might defer to others on aspects outside their expertise, or worse, guess. Premise voting leverages specialized knowledge more effectively.

  3.  **Transparency and Accountability:** Premise-based voting provides an unambiguous record of *why* the decision was made. Did it fail on safety? On soundness? On both? This is crucial for:
      *   **Improving the Proposal:** The author knows exactly what needs fixing.
      *   **Improving the Process:** If "safe" consistently gets rejected, maybe the rollout process needs better tooling or documentation.
      *   **Resolving Disagreements:** The conflict between A and B is exposed and can be discussed ("Why did A think it was unsafe if B thought it was fine?").
      *   **Auditability:** Stakeholders can see the reasoning trail. Conclusion-based voting offers only an opaque "Reject" with no collective rationale.

  **Grappling With the Real Objections:**

  1.  **Objection: Agenda Control (Who Defines the Premises?)**
      *   **Acknowledgment:** This is a *very* real concern. Whoever structures the premises wields significant power. Defining "sound" and "safe" too narrowly or broadly, or adding irrelevant premises, can manipulate the outcome.
      *   **Counter-Argument & Mitigation:**
          *   **The Rule Itself Constrains the Agenda:** Your rule ("approved only if sound AND safe") *objectively defines* the necessary premises. The agenda-setter isn't inventing arbitrary questions; they are *disaggregating* the rule's inherent logic. Conclusion-based voting *doesn't eliminate* this problem; it just hides it. A biased agenda-setter could still write a vague rule or influence how reviewers interpret "Approve."
          *   **Standardization is Key:** The solution isn't abandoning premise voting, but *institutionalizing clear, objective definitions* for the premises ("sound" means meets scalability targets X, Y; "safe" means rollback plan Z exists and is tested). Make the definitions part of the RFC template.
          *   **Transparency Exposes Manipulation:** If someone tries to add a spurious premise ("Is it written in Python?"), it's visible and contestable *before* voting. Opaque conclusion voting offers no such check. Premise-based voting forces the agenda into the open, making manipulation harder to hide.

  2.  **Objection: Logical Inconsistency (The Impossibility Result)**
      *   **Acknowledgment:** List & Pettit's impossibility theorem is devastating in its generality. For complex logical structures beyond simple AND (e.g., involving implications, disjunctions, multiple dependencies), premise-based majority voting *can* lead to collectively inconsistent judgments (e.g., affirming `A`, affirming `If A then B`, but denying `B`).
      *   **Counter-Argument & Mitigation:**
          *   **Simplicity Matters:** Your RFC case (and many real-world technical decisions) involve *simple, conjunctive rules*: `Approve IF Premise1 AND Premise2 AND ... PremiseN`. For AND-rules, premise-based majority voting **is** logically consistent *if* the majority supports each premise. The impossibility arises with more complex logics. Stick to necessary conditions.
          *   **Inconsistency is a Feature, Not (Always) a Bug:** If premise voting reveals an inconsistency (e.g., majority says design is sound, majority says rollout plan is safe, but majority votes reject overall), this is a *huge red flag* about the process or understanding. It signals:
              *   Flawed Premise Definitions (e.g., "sound" and "safe" aren't truly independent).
              *   Misunderstanding of the Rule (e.g., reviewers think other unstated factors matter).
              *   Genuine Deep Disagreement needing discussion.
          *   **Conclusion Voting Hides Irrationality:** Conclusion-based voting *can* produce a seemingly consistent outcome (`Reject`) that *hides* the underlying collective irrationality exposed by premise voting. Premise voting makes the potential irrationality visible so it *can* be addressed. Conclusion voting lets it fester.
          *   **Fallback Exists:** If premise voting *does* produce inconsistency in a complex case, *that's the signal* to pause, discuss, refine premises, or potentially move to a different aggregation method (e.g., deliberation, sequential voting, or even a conclusion vote) *explicitly acknowledging the inconsistency*. Premise voting provides the diagnostic.

  **The Verdict for Your RFC Process (and Similar Cases):**

  Premise-based voting is the **default winner** because it aligns with the *truth-seeking, expertise-driven, and transparent* goals of a technical design review:

  1.  **Honors the Logic:** It respects the rule's definition (`Approve` requires `Sound AND Safe`) by ensuring the collective judgment satisfies both conditions.
  2.  **Maximizes Expertise:** It allows focused judgment on separable aspects.
  3.  **Provides Critical Transparency:** It reveals *why* a decision was made and exposes genuine conflicts in reasoning (like the A vs. B disagreement).
  4.  **Promotes Improvement:** Clear premise outcomes guide fixes and process refinement.
  5.  **Mitigates Hidden Bias:** While agenda control is a risk, standardized premises and transparency make manipulation harder than under opaque conclusion voting.

  The objections are serious but manageable:
  *   **Agenda Control:** Countered by rule-derived, standardized, transparent premises.
  *   **Logical Inconsistency:** Less likely with simple AND rules; when it occurs, it's a valuable signal requiring discussion, not a reason to prefer the illusion of consistency provided by conclusion voting.

  **Conclusion:** Switching your RFC process to premise-based voting (voting separately on "Technically Sound?" and "Rollout Safe?", then deriving `Approve` only if *both* get majority "Yes") is not just defensible, it's the *more rational and responsible* approach. It forces the collective reasoning into the open, ensures the decision actually complies with the logical rule, and provides actionable feedback. The doctrinal paradox isn't a reason to avoid premise voting; it's a powerful argument *for* it, demonstrating how conclusion voting can obscure the true collective judgment on the very premises that define the decision. Own the premises, own the logic, own the transparency.
