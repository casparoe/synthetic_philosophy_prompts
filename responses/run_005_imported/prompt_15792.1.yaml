  First, I need to recall the core arguments from both sides. Reductionism, following Hume, argues that testimony is not a basic source of knowledge. Instead, we need independent reasons (empirical evidence) to trust a particular testimony. Anti-reductionism, following Reid, holds that testimony is a fundamental source of knowledge. We're entitled to trust it by default unless there are specific reasons to doubt.

  The circularity problem for reductionists arises because the evidence used to support testimony's reliability often comes from other testimonies. For instance, knowing that eyewitnesses are reliable might come from studies, which are reported in journals we haven't personally verified. So, using such testimonial evidence to justify testimony in general seems circular.

  Now, the reductionist responses to this circularity. The first is the distinction between global and local reductionism. Global reductionism requires justifying testimony as a whole before trusting any instance, which leads to circularity. Local reductionism focuses on justifying each testimonial instance individually using non-testimonial evidence. For example, in the courtroom, using the witness's demeanor, consistency, or physical evidence to assess reliability without relying on other testimonies. Anti-reductionists counter that local justifications often still depend on background testimonial knowledge, like understanding language or social norms, which are learned through testimony.

