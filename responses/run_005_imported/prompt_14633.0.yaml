answer: |-
  That's an excellent set of questions digging into the heart of one of the trickiest issues in philosophical logic and semantics. The Adams pair perfectly illustrates the puzzle, and your summary of the standard positions (Adams' Thesis + Lewis-Stalnaker) is spot on. Let's break down the comparison and the core issue about triviality and divergence.

  **1. Why Triviality Results Don't (Directly) Touch Counterfactual Semantics:**

  Lewis's triviality results are indeed a major reason for abandoning the idea that indicative conditionals express propositions whose probability is always the corresponding conditional probability. The core argument shows that **if** you assume:
      *   Indicative conditionals have truth values (i.e., express propositions).
      *   The probability of the conditional `If A, then C` (P(A → C)) *just is* the conditional probability P(C | A).
      *   Probability is classical (Kolmogorov axioms).
      *   The conditional proposition `A → C` can be embedded in Boolean compounds (like `(A → C) ∧ B`) or quantified over in a non-trivial way...
      ...then you get contradictions unless the probability space is absurdly trivial (e.g., only 4 possible worlds, highly dependent).

  **The key reason triviality doesn't apply to Lewis-Stalnaker counterfactuals is the role of the antecedent's probability and the nature of the semantics:**

  *   **Probability Zero Antecedents:** Counterfactuals are typically asserted *when the antecedent is known or assumed to be false* (P(A) ≈ 0). Lewis's triviality proofs **crucially rely on the antecedent having non-zero probability** (P(A) > 0). This is necessary for conditional probability P(C | A) to be defined in the standard ratio formula (P(C ∧ A) / P(A)). When P(A) = 0, P(C | A) is undefined in standard probability theory.
  *   **Possible Worlds Semantics ≠ Conditional Probability:** The Lewis-Stalnaker semantics doesn't define the *truth conditions* of the counterfactual `If A had been the case, C would have been the case` (A □→ C) in terms of *conditional probability over the actual probability space*. Instead, it defines it in terms of **truth in the closest possible world(s) where A is true**. This is a fundamentally different kind of evaluation.
      *   It involves a **similarity metric** comparing worlds.
      *   It accesses a **different set of worlds** – those where A is true, which might be radically different from the actual world.
      *   The evaluation is **not probabilistic**; it's a **modal** evaluation about what is true in those specific non-actual scenarios. The "probability" of the counterfactual being true isn't defined as P(C | A) because A isn't even a live possibility in the actual world.
  *   **Assertability vs. Truth Conditions:** Adams' Thesis for indicatives is fundamentally about *assertability* (governed by conditional probability). Lewis-Stalnaker semantics for counterfactuals is fundamentally about *truth conditions* (defined modally via possible worlds). The triviality results target attempts to build a *truth-conditional* semantics for indicatives where the *probability* of the truth-condition *equals* conditional probability. Counterfactual semantics doesn't make this equation between the probability of its truth-condition and a conditional probability (especially since the relevant conditional probability is undefined).

  **In short:** Triviality proofs exploit the interplay between truth conditions, probability, and *non-zero probability antecedents*. Counterfactual semantics, by design, deals with *false antecedents* (probability zero in the actual context) and defines truth conditions modally, not probabilistically. It sidesteps the specific assumptions Lewis's proofs rely on.

  **2. Is the Divergence Between Indicative and Counterfactual Semantics Ad Hoc?**

  This is a major philosophical debate. Proponents of the divergence argue it's **principled and necessary**, not ad hoc. Critics argue for unified accounts. Here's the case *for* the divergence being principled:

  *   **The Adams Pair Phenomenon:** The stark difference in truth value judgments for minimally different pairs like the Oswald/Kennedy examples strongly suggests a fundamental semantic difference. Any unified semantics must explain this difference without simply building it in by fiat.
  *   **Functional Difference:** Indicatives and counterfactuals seem to play fundamentally different roles in reasoning:
      *   **Indicatives (`If A, C`):** Primarily concerned with **epistemic connections** and **inference under uncertainty** *within* our current conception of the actual world. They often guide belief, decision-making, and reasoning about unknown or future events. ("If it rains, the match is canceled" – I don't know if it will rain, but *if* it does, I infer cancellation).
      *   **Counterfactuals (`If A had been, C would have`):** Primarily concerned with **causal or explanatory connections** and **evaluating hypothetical scenarios** *contrary to known facts*. They are used for learning from mistakes, assigning responsibility, thought experiments, and understanding causal mechanisms. ("If I had left earlier, I would have caught the train" – I know I didn't leave earlier, but I'm considering what *would* have followed *if* I had).
  *   **Context Sensitivity & Antecedent Probability:** The key trigger seems to be the **epistemic status of the antecedent** in the context of utterance:
      *   If the antecedent is **compatible with the speaker's knowledge/beliefs** (even if unlikely), the indicative is used. (P(A) > 0, even if small).
      *   If the antecedent is **presumed false by the speaker** (or treated as counterfactual in the context), the subjunctive/counterfactual form is used. (P(A) ≈ 0).
  *   **Time and Factivity:** Counterfactuals often involve past antecedents known to be false. Indicatives often involve present or future antecedents whose truth is unknown. While not absolute (future indicatives can become counterfactuals if the antecedent becomes impossible), this temporal association reinforces the epistemic difference.
  *   **Embedding Behavior:** Indicatives and counterfactuals behave differently under operators like negation, modals, and in disjunctions. For example, negating a counterfactual (`It's not the case that if A had been, C would have`) feels intuitively different and more propositional than trying to negate an indicative conditional under Adams' Thesis (which becomes problematic, as Adams acknowledged).

  **Arguments for Ad Hoc-ness and Unified Approaches:**

  Critics argue that the sharp split is linguistically unmotivated and that a unified semantics *should* be possible. Some approaches attempt this:

  *   **Unified Stalnaker:** Robert Stalnaker himself proposed a *unified* possible worlds semantics. For `If A, C` (indicative):
      1.  Temporarily add A to your stock of beliefs (knowledge context).
      2.  Make minimal adjustments (preserve consistency) to form a new belief set.
      3.  See if C is true in *that* revised belief set.
      The counterfactual version uses a similarity-based selection function on possible worlds instead of belief revision. The difference lies in *how* the "A-world" is selected: by belief revision (indicative, sensitive to current beliefs) vs. by objective similarity (counterfactual, less sensitive). Lewis's triviality results, however, arguably still plague attempts to assign standard truth conditions to the indicative version defined this way.
  *   **Dynamic Semantics:** Views conditionals as context-update instructions. Indicatives and counterfactuals might involve different *kinds* of updates (e.g., restricting the context vs. shifting to a hypothetical context).
  *   **Restricting the Scope of Triviality:** Some argue triviality only shows indicatives can't be *binary* propositions within *classical* probability, leaving room for other propositional accounts (e.g., three-valued, probabilistic propositions).

  **Conclusion:**

  1.  **Triviality Immunity:** The reason triviality results don't rule out propositional treatments for counterfactuals is **not accidental**. It stems directly from the core difference in their use: counterfactuals deal with *counterfactual* (P(A)≈0) antecedents evaluated modally via possible worlds similarity, bypassing the specific mathematical machinery (conditional probability with P(A)>0) that Lewis's proofs exploit. Their semantics doesn't equate their probability with a conditional probability defined over the actual world.
  2.  **Principled Divergence?** While the sharp division can *feel* ad hoc, there's a **strong case for it being principled** based on:
      *   The robust Adams Pair intuition.
      *   The fundamental functional difference (epistemic inference vs. causal/hypothetical evaluation).
      *   The central role of the antecedent's epistemic status (live possibility vs. counterfactual) in triggering the mood shift.
      *   Differences in embedding behavior.

  The divergence reflects the deep-seated intuition that reasoning about *what follows from an uncertain possibility* is fundamentally different from reasoning about *what would have happened in a known non-actual scenario*. While unified accounts are intellectually appealing and actively pursued, the functional and contextual differences between indicative and counterfactual conditionals provide a robust justification for why they might need distinct semantic treatments. The success of Lewis-Stalnaker for counterfactuals and the apparent forced move to non-propositionalism for indicatives via triviality results is likely more than just historical accident; it reflects a real fracture in how these linguistic devices work.
