prompt: |-
  My friend Theo has spent the last several months betting on a pretty obscure corner of the sports betting market, using a model he built himself, which — going by the results so far — wins around 60% of the time whenever he can get even odds on it. Deciding how much of their shared "betting fund" to stake on each one has become a running argument between him and his housemate Naomi, who studied engineering and apparently remembers more of her stats than he does. I keep getting pulled in as the tie-breaker even though I don't really follow the math myself, so I'm hoping you can actually settle it.

  Their argument goes something like this. (1) Theo's position is that since each bet is positive expected value, they should be staking a big chunk of the fund each time — his rule of thumb is at least half — because a bet that makes you money on average makes you more money on average the bigger you size it, so playing it "safe" is just voluntarily giving up winnings. (2) Naomi says this is backwards for something they're going to repeat over and over out of the same pot: stake too high a fraction, and the loosing streaks that are bound to happen eventually (this bet loses 40% of the time, remember) will crater the fund, and after that they're betting a percentage of a much smaller pile, so a later winning streak doesn't make up for it the way Theo imagines. She says there's a specific, much smaller fraction — something like a fifth of the pot, by her math — that actually grows the fund fastest over time, and going well above that, the way Theo wants, makes them poorer in the long run even though every individual bet is still a good one. (3) Theo's comeback is that this can't be right, because expected value is, by definition, the thing you converge to on average over many repeats — so if bigger stakes mean higher expected value per bet, betting bigger has to mean more money in the long run too, not less. Either Naomi's "fifth of the pot" number is the fraction that maximizes what they'll actually end up with, in which case it should be telling them to go bigger rather than smaller, or it's maximizing something other than their money, in which case why should he care what it says? (4) Naomi's response is that his dilemma is a false one, because the stake that maximizes the expected size of the fund and the stake that maximizes what they'll typically, actually end up with are different questions with different answers here — almost all of that "expected value" comes from a thin slice of extremely lucky runs where they basically never lose, and once you're re-betting a fraction of a fund that can shrink as well as grow, those two things can point in opposite directions. Theo isn't sold even by this: his last word, so far, is that a sportsbook itself is taking on millions of similar bets across millions of bettors, and for an operation of that size the average outcome and the expected outcome basically are the same thing — which makes him suspect Naomi's "different kind of average" isn't some objective fact about the bet at all, just a technical-sounding way of describing how much risk she personally happens to be comfortable with.

  Could you go through this move by move and say who's actually right at each stage — including the last exchange, which is honestly the one I'm least sure about myself? And if there's something important that both of them are missing entirely, I'd like to hear about that too.
reasoning: |-
  We are dealing with a classic problem in betting: how to size bets optimally when repeated over time. The key concept here is the Kelly criterion, which maximizes the long-term growth rate of wealth.

  The situation:
  - Theo has a model that wins 60% of the time at even odds (i.e., when he bets $1 and wins, he gets $1 profit, so returns $2 total; when he loses, he loses the $1).
  - They are arguing about the fraction of the current bankroll to bet each time.

  Let me denote:
  - p = probability of winning = 0.6
  - q = probability of losing = 0.4
  - b = the odds received on the bet (in decimal form). Since it's even odds, if you bet 1 unit and win, you get 1 unit profit, so b = 1.

  The expected value (EV) for a bet of 1 unit is:
  EV = p * (b) - q * (1) = 0.6 * 1 - 0.4 * 1 = 0.2 (i.e., 20% expected return per unit bet)

  But note: this is the expected value per bet. However, when we are betting a fraction f of the current bankroll repeatedly, the growth of the bankroll is multiplicative.

  The Kelly criterion gives the fraction f* that maximizes the long-term growth rate. The formula is:
  f* = (b * p - q) / b

  In this case, b=1, p=0.6, q=0.4, so:
  f* = (1 * 0.6 - 0.4) / 1 = 0.2

  So the Kelly fraction is 20% (or one fifth) of the bankroll.

  Now, let's break down the argument:

  (1) Theo's position: Bet at least half of the fund because each bet is positive EV and you make more money by betting bigger.

  However, the flaw is that he is only looking at the expected value of a single bet without considering the compounding and the risk of ruin. Betting too much (like half) is actually very dangerous because a few losses can wipe out the bankroll.

  (2) Naomi's position: She is advocating for a fraction that maximizes the growth of the fund over time. She says about a fifth (20%) is optimal. This is exactly the Kelly fraction.

  (3) Theo's comeback: He argues that expected value is what they converge to on average. However, this is only true if they could bet the same absolute amount every time (with an infinite bankroll). But they are betting a fraction of the current bankroll, which changes with each bet. So the average of the log of the bankroll (which is what the Kelly criterion maximizes) is what leads to the highest long-term growth.

  Moreover, if they bet more than the Kelly fraction (like 50%), they are taking on too much risk. The expected value of the bankroll after many bets might be higher because of the possibility of extremely high outcomes (if they get very lucky), but the typical outcome (the median or the mode) will be lower. Also, there is a substantial risk of going broke.

  (4) Naomi's response: She points out that the expected value of the bankroll and the typical outcome are different. The expected value is dominated by a small number of very lucky paths, but most paths will have a lower outcome. She is correct.

  Theo's last point: He compares their situation to a sportsbook that takes millions of bets. For the sportsbook, the law of large numbers kicks in and the average outcome is close to the expected value. But that is because the sportsbook is diversified and has a large bankroll relative to individual bets. For Theo and Naomi, they are repeatedly betting on the same type of bet, and the bankroll is finite and shared. They are subject to the risk of ruin and the volatility of the outcomes.

  Moreover, the sportsbook is not betting 50% of its entire bankroll on a single event! They spread the risk. So Theo's analogy fails.

  Who is right?

  - Naomi is correct in advocating for the Kelly fraction (20%). This fraction maximizes the growth rate of the bankroll and minimizes the risk of ruin. Betting more than the Kelly fraction (like 50%) will lead to a lower growth rate and a higher chance of going broke.

  - Theo is wrong in thinking that a higher bet fraction necessarily leads to more money in the long run. It does not. Beyond the Kelly fraction, the growth rate decreases and the risk of ruin increases.

  Important points both might be missing:

  1. Risk of ruin: If they bet too much (like 50%), the probability of losing the entire bankroll becomes significant. For example, with a 50% bet, two consecutive losses reduce the bankroll to 25% of the original. A third loss would leave them with 12.5%. This makes it very hard to recover.

  2. The Kelly criterion not only maximizes the long-term growth rate but also has the property that it minimizes the expected time to reach a given wealth goal (asymptotically). It is a mathematically proven optimal strategy for repeated bets with positive expectation.

  3. However, the Kelly criterion can be volatile. Some bettors prefer to bet a fraction of the Kelly fraction (like half-Kelly) to reduce volatility while still having good growth.

  4. Expected value vs. expected logarithm: The expected value of the bankroll after n bets when betting a fraction f is:
     E[bankroll_n] = bankroll_0 * [ (1+f)^(number of wins) * (1-f)^(number of losses) ]

  But note: the expected value is not the same as the bankroll_0 multiplied by (expected growth per bet)^n because of the multiplicative nature. The Kelly criterion maximizes the expected logarithm of wealth, which is equivalent to maximizing the geometric mean growth rate.

  5. The expected value of the bankroll after n bets is actually maximized by betting the entire bankroll every time (if the bet has positive expectation). But that strategy has a 100% chance of eventual ruin (if there's any chance of loss). So maximizing expected value in the short term is not a good long-term strategy.

  Conclusion:

  - At stage (1): Theo is incorrect because he ignores the compounding and risk of ruin.
  - At stage (2): Naomi is correct. The Kelly fraction (20%) is optimal for long-term growth.
  - At stage (3): Theo's argument is flawed because the expected value per bet does not account for the changing bankroll and the multiplicative nature of repeated betting.
  - At stage (4): Naomi is correct. The expected value and the typical outcome diverge when betting a large fraction. The expected value is heavily influenced by the rare cases of extreme good luck, which are not the typical experience.

  Theo's last point about the sportsbook: The sportsbook does not face the same risk because they are not betting their entire bankroll on a single event. They spread the risk across many independent bets. Also, they set the odds to have an edge. For an individual bettor with a limited bankroll, the situation is entirely different.

  Therefore, the optimal fraction is indeed around 20%. Betting 50% is too aggressive and will lead to a lower growth rate and a high risk of ruin.

  If they are risk-averse, they might choose to bet less than 20% (like 10%), which would reduce volatility and the risk of ruin even more, but at the cost of slower growth. But 20% is the growth-optimal fraction.
answer: |-
  Let's break down Theo and Naomi's argument step by step, using the principles of probability and betting theory. The key concept here is the **Kelly criterion**, a mathematical formula for optimal bet sizing in repeated positive-EV bets. I'll address each of their points, clarify who's right, and highlight what they're missing.

  ### **Background Context**
  - Theo's bet: 60% win probability at even odds (i.e., bet $X to win $X net, so total return = $2X on a win).
  - Expected value (EV) per dollar bet:  
    EV = (0.6 × $1) + (0.4 × -$1) = $0.20 (20% positive EV).  
    Theo is correct that each bet is profitable.

  ### **(1) Theo's Position: "Bet big (e.g., 50%) because higher stakes = more average profit"**
  - **Who's right?** Theo is **incorrect**.  
  - **Why?**  
    - While a single larger bet *does* yield higher expected profit in isolation (e.g., staking $50 vs. $10 on one bet), this ignores **compounding risk** when bets are repeated from the same bankroll.  
    - Betting a large fraction (like 50%) amplifies downside risk: a few losses can decimate the fund, forcing later bets to start from a smaller base. Recovery becomes mathematically harder because losses compound (e.g., two 50% losses reduce $100 → $50 → $25, requiring a 300% gain just to break even).  
    - **Key flaw**: Theo confuses *single-bet EV* with *long-term growth*. Larger bets increase short-term EV but jeopardize survival and long-term wealth.

  ### **(2) Naomi's Position: "Bet ~20% to maximize long-term growth"**
  - **Who's right?** Naomi is **correct**.  
  - **Why?**  
    - Naomi is describing the **Kelly criterion**, which calculates the optimal bet fraction to maximize the geometric growth rate of the bankroll. For a bet with win probability `p`, loss probability `q`, and odds `b`:  
      **Kelly fraction \( f^* = \frac{bp - q}{b} \)**.  
      Here, \( p = 0.6 \), \( q = 0.4 \), \( b = 1 \) (even odds), so:  
      \( f^* = \frac{(1)(0.6) - 0.4}{1} = 0.2 \) (20%).  
    - Betting 20%:
      - Maximizes the long-term growth rate (i.e., the expected logarithm of wealth).
      - Minimizes the risk of ruin (probability of the fund → $0).
      - Outperforms larger or smaller stakes over many bets.  
    - **Empirical example**:  
      - Start with $100.  
      - Bet 20% per wager: After 100 bets, typical outcome ≈ $4,900 (median).  
      - Bet 50% per wager: After 100 bets, typical outcome ≈ $42 (median) — **far worse** despite the same EV per bet.  
      Why? The 50% strategy has higher volatility and severe drawdowns during losing streaks.  
    - **Key insight**: Naomi recognizes that long-term growth depends on *multiplicative compounding*, not additive EV.

  ### **(3) Theo's Comeback: "Expected value converges over time, so bigger bets = more money long-term"**
  - **Who's right?** Theo is **incorrect**.  
  - **Why?**  
    - Theo misunderstands the law of large numbers (LLN). LLN says the *average profit per bet* converges to the EV (20%) if bets have fixed size and are independent. But here, bet sizes are a **fraction of a shrinking/growing bankroll**, so bets are not identical in dollar terms.  
    - **Crucially**:  
      - The *expected final bankroll* is maximized by betting the entire fund each time (if EV > 0).  
      - However, this comes with a ~100% risk of ruin (e.g., a 40% loss chance per bet).  
      - In practice, this "maximum EV" strategy is disastrous because it relies on astronomically unlikely win streaks (e.g., winning 100 bets in a row) to offset ruin in most scenarios.  
    - **Paradox**: Betting more than the Kelly fraction (20%) *increases* expected final wealth but *decreases* the median/typical wealth. That is, you’re more likely to end up poor, but if you get extremely lucky, you’ll be fabulously rich. Naomi’s 20% maximizes what you’ll *probably* have, not what you *could* have in a parallel universe.  

  ### **(4) Naomi's Response & Theo's Last Word**
  - **Naomi's point**: "The stake that maximizes expected value and typical outcome are different."  
    - **She's correct**.  
      - Betting 50% maximizes *expected final wealth* but results in near-certain ruin (so the "average" is skewed by a few jackpot outcomes).  
      - Betting 20% maximizes *median/typical wealth* and long-term growth rate.  
      - Example:  
        - After 300 bets at 20%: Typical fund ≈ $500,000.  
        - After 300 bets at 50%: Typical fund ≈ $0.01, but if you win all 300, fund = $2^{300}$ (astronomical). The "expected" fund is huge, but you’ll almost certainly be broke.  
  - **Theo's last word**: "Sportsbooks don’t worry about this—their average and expected outcomes align."  
    - **Who's right?** Theo is **partially correct but misapplies it**.  
    - **Why?**  
      - Sportsbooks **diversify risk** across thousands of independent bets and bettors. Their bankroll is vast relative to individual stakes, so volatility smooths out (law of large numbers applies).  
      - Theo and Naomi have a **non-diversified, repeated bet** from a finite fund. Their outcomes depend on a single sequence of bets, where variance compounds and ruin is possible.  
      - **Key difference**: Sportsbooks set odds to ensure profitability *across many bets*; Theo is *taking* bets repeatedly *from the same pot*. The latter is vulnerable to sequence risk, while the former is not.  
      - Naomi’s fraction (20%) isn’t about "personal risk tolerance"—it’s the mathematically optimal growth rate. Betting less (e.g., 10%) reduces volatility but slows growth; betting more (e.g., 50%) increases volatility and guarantees long-term loss.  

  ---

  ### **What Both Are Missing**
  1. **Risk of ruin is asymmetric**:  
     - Losing 40% of a bankroll requires a 67% gain to recover (e.g., $100 → $60 → $100 needs +67%). Larger bets make recovery exponentially harder.  
     - Kelly not only maximizes growth but minimizes the *time* to reach a wealth goal.

  2. **Fractional Kelly for practicality**:  
     - Betting the full Kelly fraction (20%) can be volatile (e.g., 10% chance of 50% drawdowns). Many bettors use "half-Kelly" (10% here) to reduce emotional stress and estimation errors.  
     - Theo’s model might be overfitted—actual win rates could be <60%. If true, betting 20% would be disastrous (Kelly assumes accurate probabilities).

  3. **Utility matters**:  
     - If Theo and Naomi are risk-averse (e.g., this is their only savings), even 20% might be too high. But if they have outside income, they could tolerate more risk.  
     - Kelly is optimal for *logarithmic utility*, which models "rational" growth-seeking. Theo’s stance implies linear utility (risk-neutral), which is unrealistic for most.

  4. **Bankroll management ≠ EV maximization**:  
     - Theo focuses on EV per bet; Naomi focuses on survival and compounding. Both are relevant, but long-term growth requires balancing them.  

  ---

  ### **Verdict**
  - **Naomi is overwhelmingly right** on the math: **20% is optimal** for long-term growth.  
  - **Theo is dangerously wrong**: Betting 50% will almost certainly destroy the fund, even though each bet is +EV.  
  - **Final advice**: Use 10–20% of the bankroll per bet (exact fraction depends on risk tolerance), track performance rigorously, and never risk more than Kelly allows. If Theo insists on 50%, suggest a simulation—after 100 bets, the 20% strategy will almost always crush the 50% strategy.  

  This isn’t about opinion; it’s about the iron laws of compounding and probability. Naomi’s engineering stats serve her well!
