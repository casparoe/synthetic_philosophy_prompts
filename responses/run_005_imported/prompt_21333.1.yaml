  I should break down the economic arguments. Even if pure time preference is rejected, there are other factors. First, opportunity cost of capital: money invested now could yield returns, so future benefits need discounting to compare present investments. Second, uncertainty: future growth and outcomes are uncertain, which might justify a higher discount rate. Third, declining marginal utility: as societies get richer, each additional dollar is worth less, so future wealth might have less marginal impact.

