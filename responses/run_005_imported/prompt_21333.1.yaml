  The user might not realize that the discount rate isn't just about time preference but also economic factors. Highlighting the components—pure rate, growth rate, elasticity—can show why rates aren't zero even without pure time preference. Also, uncertainty plays a big role. High uncertainty about future growth or catastrophic events can affect how we value future benefits.

  Another angle: aggregation issues. Ethical arguments focus on individual well-being, but economic models aggregate societal welfare, considering growth and inequality. If future generations are richer, their utility from additional wealth might be lower, justifying some discounting.

