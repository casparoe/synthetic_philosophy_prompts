answer: |-
  You've pinpointed a crucial tension at the heart of welfare economics and intergenerational ethics. The disconnect arises because the "settled" philosophical argument against *pure time preference* (PTP) addresses only **one component** of the social discount rate (SDR), while the live economic controversy involves **other components, practical implementation, and fundamental disagreements about welfare aggregation**. Here's why the debate persists:

  1.  **Decomposing the Discount Rate: Ramsey's Formula:**
      Economists typically decompose the SDR using the Ramsey equation:
      `r = ρ + θ * g`
      Where:
      *   `r` = Social Discount Rate
      *   `ρ` = Pure Rate of Time Preference (PTP - discounting utility *solely* because it occurs later)
      *   `θ` = Elasticity of Marginal Utility of Consumption (measures how fast the *value* of additional consumption declines as consumption increases; also reflects aversion to inequality)
      *   `g` = Growth rate of per capita consumption
      The **philosophical consensus decisively rejects ρ > 0** on ethical grounds (Parfit, Sidgwick, Ramsey himself). This is the "failure of imagination" argument.

  2.  **Why Economists Argue About `r` Even if `ρ ≈ 0`:**
      *   **`θ * g` is the Dominant Controversy:** Even if `ρ` is set to 0 (or near 0, often for catastrophic risk), `r` can still be substantial if:
          *   `g` is expected to be positive (future generations are richer).
          *   `θ` is greater than 1 (implying significant aversion to consumption inequality across time/generations).
          *   **Nordhaus vs. Stern:** This is the core of their disagreement. Stern used `ρ ≈ 0.1%` (effectively zero, accounting only for extinction risk), `θ = 1`, and relatively optimistic `g`. This yielded `r ≈ 1.4%`. Nordhaus used `ρ ≈ 1.5%` (reflecting observed market behavior and some PTP), `θ ≈ 2`, and similar `g`, yielding `r ≈ 4-5%`. The difference in `r` drastically changes the present value of future climate damages. Critics of Stern argued his `θ=1` was too low, underestimating how much less valuable extra consumption is to richer future generations.
      *   **Empirical Uncertainty & Forecasting:**
          *   **`g`:** What is the *actual* long-run growth rate? Is it sustainable? Climate change itself threatens `g`. Pessimistic growth forecasts lower the implied `r` even with positive `θ`.
          *   **`θ`:** There's no direct way to observe society's aversion to intertemporal inequality (`θ`). Estimates come from savings behavior, risk aversion studies, or ethical reasoning. Values range widely (1 to 3+), profoundly impacting `r`.
      *   **Uncertainty and Risk:** The Ramsey formula assumes certainty. In reality, `g` is highly uncertain, especially over centuries. Catastrophic risks (existential or otherwise) introduce huge uncertainty about whether future generations even exist. How should `r` account for this? Some argue for declining discount rates over time or specific adjustments for catastrophe. This is complex and contested.
      *   **Normative vs. Positive Economics:**
          *   **Normative (Stern-like):** "What *should* the rate be, based on ethical principles?" This approach embraces `ρ=0` and focuses on choosing `θ` ethically. It prioritizes intergenerational equity.
          *   **Descriptive/Positive (Nordhaus-like):** "What rate *is* used by society, as revealed by market behavior?" Market interest rates reflect revealed individual time preferences (`ρ>0`), expectations about growth (`g`), and risk. The argument is that using a rate vastly different from market rates distorts investment decisions *today* (opportunity cost). Using `ρ=0` is seen as imposing a strong ethical view not shared by current individuals/savers.
      *   **Opportunity Cost of Capital:** Economists emphasize that capital invested in climate mitigation has an alternative use. If society can earn 4-5% (real) on other investments, then climate investments *must* yield at least that return to be efficient, regardless of `ρ`. This pushes practical policy analysis towards higher `r`s, even if ethically suboptimal from a long-term perspective.
      *   **Aggregation Challenges:** Welfare economics relies on aggregating individual utilities. How do we fairly aggregate across vast numbers of potential future people whose existence depends on our choices? How do we compare marginal utility changes across vastly different potential future consumption levels? These are deep philosophical *and* practical problems that `r` tries to summarize imperfectly.

  3.  **Why Nordhaus et al. Aren't *Simply* Committing a Philosophical Error:**
      *   **They are primarily debating `θ` and `g`, not `ρ`:** While Nordhaus used a higher `ρ`, much of his criticism focused on Stern's choice of `θ=1` and the implications for opportunity cost/market consistency. He argued Stern underestimated how much less valuable future consumption would be due to growth.
      *   **Arguing from Positive Economics:** They claim policy should respect revealed societal preferences (via markets) or risk inefficient allocation *now*, harming *current* generations unnecessarily. This is a different ethical framework (Pareto efficiency within the current generation) vs. the long-termist, intergenerational equity framework.
      *   **Practicality & Policy Acceptance:** Using `r=0%` or even `r=1%` would imply massive, immediate sacrifices for current generations for distant benefits. Economists argue this is politically infeasible and that models using such rates produce unrealistic policy prescriptions. They seek a rate that balances ethics with practical implementation.
      *   **Focus on Growth (`g`) as the Solution:** Some higher-discount-rate advocates believe technological progress and economic growth (`g`) driven by current investments are the *best* way to enable future generations to handle problems like climate change, even if it means less aggressive mitigation now.

  **Conclusion & Your Key Insight:**

  You are absolutely right that the **philosophical case against *pure time preference* (`ρ > 0`) is decisive and should push that component towards zero.** This *has* influenced economics, leading prominent climate economists (like Stern, Weitzman) to adopt `ρ ≈ 0`.

  However, the **controversy persists because the *social discount rate* (`r`) is not solely determined by `ρ`.** The fierce debate revolves around:

  1.  **The value of `θ` (inequality aversion) and forecasts of `g` (growth):** These are ethically charged *and* empirically uncertain.
  2.  **How to handle profound uncertainty and catastrophic risk.**
  3.  **The fundamental tension between:**
      *   A **long-termist, intergenerational equity ethic** (favors very low `r`, close to zero once `ρ=0` and assuming low `θ*g` or high catastrophe risk).
      *   A **descriptive/market-consistent, near-term efficiency ethic** (favors higher `r`, reflecting opportunity cost and revealed preferences).
      *   A **"growth will solve it" optimism** (also leans towards higher `r`).

  So, while economics *has* partially caught up with philosophy on rejecting PTP (`ρ`), the resistance to very low *overall* discount rates (`r`) isn't *just* ignorance of philosophy. It reflects deep, unresolved disagreements about intergenerational inequality aversion (`θ`), the predictability and sustainability of growth (`g`), how to weigh catastrophic risks, and the very role of markets versus ethical imperatives in long-term policy. The "correct" rate depends heavily on which of these perspectives one prioritizes, making it a live and complex controversy, not merely a philosophical oversight. For evaluating existential risks and very long-term climate impacts, strong arguments *do* exist for using rates close to zero, but this requires explicitly embracing the long-termist ethical framework and its assumptions about `θ` and `g`.
