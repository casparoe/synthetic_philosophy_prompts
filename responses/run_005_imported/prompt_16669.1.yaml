prompt: |-
  Ok, this is a weird combination but it's been stuck in my head so bear with me. I've been rereading Yudkowsky's old metaethics sequence (the original LW one, not any of the newer stuff) and got hung up again on "Created Already In Motion" -- the post right after "No Universally Compelling Arguments," where he argues a mind has to already be built caring about certain things, because no matter how good an argument is, it can't manufacture motivation out of nothing. Around the same time I fell down an unrelated rabbit hole into academic philosophy of action and ran into Bernard Williams' internal/external reasons paper from the late 70s, and it hit me that he's making basically the same move decades earlier in totally different vocabulary: his argument for internalism about reasons is that a "reason" only applies to an agent if there's a sound deliberative route to it from something already sitting in that agent's actual motivational set (he calls it your "subjective motivational set," S for short) -- because otherwise there'd be nothing to explain why it could ever move them to act.

  Here's the bit I can't untangle though. Williams has this famous example where a guy wants a gin and tonic and believes the glass in front of him contains one, but its actually full of petrol -- Williams says the guy does NOT have a real internal reason to drink it, despite being motivated to, because "sound" deliberation isn't allowed to run on false beliefs. So even Williams' internalism isn't just "whatever you currently happen to want," it already smuggles in some correction of the agent's psychology, as long as that correction is reachable via deliberation from where they already stand. Which is what made me think of coherent extrapolated volition -- the old proposal that a friendly AI should target something like what we'd want if we were more informed, more coherent, and more the people we'd endorse being, instead of our current stated preferences. CEV obviously does way, way more correcting than "oh wait, that's petrol, not gin" -- but it's still officially trying to stay tethered to actual human volition, not importing some free-floating moral standard from nowhere.

  So: on Williams' own terms, is CEV best understood as a (very ambitious) internal reasons view, or does the sheer amount of extrapolation it involves quietly turn it into the kind of external reasons view Williams thought was basically incoherent? And more generally, does "internal vs external reasons" even survive being stretched from "one guy and his drink" up to "extrapolating the volition of an entire species," or does the distinction just stop tracking anything useful at that scale? I brought this up at a meetup once and got a lot of polite nodding and zero actual answers, so I'm hoping you can do better -- I don't need a full literature review on Williams scholarship, I mainly want the actual structural parallel (or disanalogy) spelled out.
reasoning: |-
  Okay, the user is diving deep into some complex philosophical concepts, blending Yudkowsky's metaethics with Bernard Williams' internal/external reasons framework. They're specifically stuck on whether CEV (Coherent Extrapolated Volition) fits into Williams' internal reasons view or if it becomes external due to the extensive extrapolation involved. Let me unpack their query step by step.

  First, they mention Yudkowsky's "Created Already In Motion" and Williams' internal/external reasons. Both argue that motivation must stem from existing elements in the agent's psyche. Williams' internal reasons require a sound deliberative route from the agent's subjective motivational set (S). The gin and petrol example shows that false beliefs invalidate reasons, even if the agent is motivated. So, Williams allows some correction via true beliefs and rational deliberation.

  The user connects this to CEV, which extrapolates human desires under idealized conditions. They wonder if CEV's extensive extrapolation—factual knowledge, coherence, reflection—stays true to internalism or crosses into externalism. The core question is structural: does CEV's process align with Williams' "sound deliberative route," or does it introduce external standards?

  I need to recall Williams' criteria. Internal reasons are tied to the agent's S, corrected for truth and rationality. CEV aims to start from human motivations but applies massive idealization. The key points are the degree of idealization and the nature of the deliberative route. Williams allows correcting beliefs and coherence within the agent's existing S, but CEV goes further by considering what humans would endorse after reflection and growth. This might still be internal if the extrapolation is seen as an extension of the agent's own reasoning process.

  But CEV involves aggregating and resolving conflicts across humanity, which Williams didn't address. His framework is individualistic. Scaling to a species might stretch the model. However, if CEV's process is viewed as a collective deliberative route from shared human motivations, it could fit internalism. The challenge is whether the extrapolation introduces external values. If CEV only uses elements derivable from actual human motivations (even idealized), it remains internal. If it imposes values not rooted in human S, it becomes external.

  The user also asks if the internal/external distinction holds at the species level. Williams focused on individuals, so applying it to humanity requires adaptation. The distinction might still apply if we consider humanity's aggregate S, but conflicts and aggregation methods could introduce external elements. The user needs clarity on whether CEV's methodology stays true to internalism or inadvertently becomes externalist.

  They mentioned a meetup where they got no answers, so they seek a clear structural comparison. They're not looking for scholarship but a logical breakdown. I should address both parts: whether CEV fits internal reasons and if the distinction scales. Highlight the similarities (starting from actual motivations, correcting beliefs/coherence) and differences (scale, idealization level). Emphasize that while CEV pushes internalism to its limits, it's not clearly external if the extrapolation is internally grounded. However, the species-level aggregation might blur the lines, making the distinction less useful at that scale.
answer: |-
  You've hit on a fascinating and genuinely deep connection between Williams' internal reasons and CEV – and pinpointed the exact tension where things get messy. Let's break down the structural parallels and disanalogies:

  **Core Parallel: The "Tethered Idealization"**

  1.  **The Foundational Insight:** Both Williams and CEV fundamentally reject the idea of "reasons" or "oughts" existing *completely independently* of an agent's (or species') actual motivational constitution.
      *   Williams: A reason for A to φ must connect, via a *sound deliberative route*, to something in A's existing "subjective motivational set" (S). Without this connection, it's not a *reason for A*.
      *   CEV: What humanity "ought" to want isn't some Platonic ideal, but what we *would* want if we knew more, thought clearer, and were more the versions of ourselves we'd endorse becoming. The target is *extrapolated from*, not *imposed upon*, our actual messy motivations.
  2.  **Idealization as Correction, Not Replacement:** Both frameworks incorporate idealization, but insist it must be *tethered* to the agent's starting point.
      *   Williams: "Sound deliberation" corrects for **false beliefs** (gin/petrol) and **logical/means-end errors** (e.g., incoherent desires, ineffective means). It operates *on* the agent's S, refining it based on truth and rationality, but doesn't *add* fundamentally new, motivationally alien elements. The *source* of the motivation must trace back to S.
      *   CEV: Extrapolation corrects for **ignorance** (factual, logical, consequences), **incoherence** (conflicting desires resolved), and **akrasia** (weakness of will). It aims to show us "who we *really* are" under ideal reflection, building *from* our current motivational seeds. The "volition" is still *ours*, just coherently extended.

  **The Crux: Does CEV's Scale and Ambition Break the Tether?**

  This is where Williams might raise an eyebrow. Here's the structural comparison:

  | **Aspect** | **Williams' Internalism** | **CEV** |
  |------------|----------------------------|---------|
  | **Starting Point** | Agent's current subjective motivational set (S) | Humanity's current aggregate motivations |
  | **Idealization** | Correction of false beliefs and logical errors | Correction of ignorance, incoherence, and akrasia |
  | **Mechanism** | Sound deliberative route from S | Computational extrapolation process |
  | **Scope** | Individual agent | Entire species |
  | **Goal** | Identify valid reasons for action | Define humanity's coherently extrapolated volition |
  | **Potential Break Point** | Addition of fundamentally new motivations | Scale and abstraction of extrapolation process |

  1.  **Degree and Nature of "Extrapolation":**
      *   **Williams' Limit:** Sound deliberation is bounded. It clarifies, corrects, and connects elements *already latent or implicit* in S, given truth and coherence. It doesn't typically involve *radical self-transformation* into someone with fundamentally different core values unless the *seeds* of that transformation (e.g., a deep desire for self-understanding or growth) are already powerfully present in S. Adding "you'd want X if you were a completely different person" is external.
      *   **CEV's Ambition:** "More informed, more coherent, more the people we'd endorse being" is a *massive* extrapolation. It potentially involves:
          *   **Radical Value Change:** Discovering that core values conflict under coherence/pressure and fundamentally shifting priorities.
          *   **Emergent Values:** Values arising from the *process* of coherence and reflection that weren't strongly present in the starting set (e.g., deep aesthetic appreciation only possible with enhanced cognition).
          *   **The "Endorse" Loop:** We become people who endorse *being* people who endorse... This self-referential loop can lead far from the starting point, even if the path is "internal" at each step.

  2.  **The "Sound Deliberative Route" vs. Computational Extrapolation:**
      *   Williams envisions a process the *agent themselves* could, in principle, undertake (or recognize as valid *for them*), given time, truth, and rationality. It's personal.
      *   CEV is envisioned as a *computational process* run by an AI, analyzing vast datasets of human psychology, behavior, and culture. While aiming to *simulate* our idealized deliberation, the *method* is external and potentially opaque. Could any human recognize the result as the outcome of *their own* sound deliberative route? Maybe not, especially for values emerging from large-scale coherence or conflict resolution.

  3.  **Scale: Individual vs. Species:**
      *   Williams' framework is fundamentally *individualistic*. S is *your* motivational set. The sound deliberative route starts from *your* S.
      *   CEV operates at the *species level*. It aggregates, reconciles conflicts, and extrapolates *across* billions of individuals with vastly different S-sets. This introduces massive complexity:
          *   **Whose S is the starting point?** Is it the average? The union? The intersection? How are deep conflicts resolved before/during extrapolation?
          *   **Does "humanity" have a single S?** Williams' S is defined for an individual agent. Applying the concept to a species is a category jump. CEV has to *construct* a unified target from fragmented parts.

  **Answering Your Questions:**

  1.  **Is CEV best understood as a (very ambitious) internal reasons view on Williams' terms?**
      *   **Structurally, Yes (with Caveats):** CEV's *core commitment* aligns with Williams' internalism. It explicitly rejects external moral facts and insists the target must be *extrapolated from* actual human motivations. The idealization aims to correct *our* mistakes and reveal *our* coherent selves, not impose an alien standard. Williams' gin/petrol correction is a tiny microcosm of CEV's massive epistemic/coherence correction.
      *   **But it pushes Internalism to its breaking point:** The sheer scale of extrapolation, the computational method, the species-level aggregation, and the potential for radical transformation *challenge* whether the tether to the *actual, current* motivational set of individuals (or the species aggregate) remains intact. If the endpoint feels unrecognizable or alien to *actual* humans, even after explanation, Williams might argue the tether has snapped, and CEV has *de facto* created an external standard, however well-intentioned.

  2.  **Does the distinction survive scaling to an entire species?**
      *   **It Becomes Murky and Less Useful:** The individual/internal vs. external distinction relies on a clear, identifiable agent with a specific S. At the species level:
          *   **The "Agent" is Fuzzy:** Humanity isn't a single agent with a unified S.
          *   **Aggregation is Contentious:** The process of defining the "species S" or aggregating extrapolated volitions inevitably involves choices that could be seen as importing external standards (e.g., how to weight conflicting desires, how to define "coherence" across vastly different worldviews).
          *   **The "Route" Becomes Abstract:** The "sound deliberative route" for an individual is conceptually graspable. The computational extrapolation of a species' CEV is not something the species *itself* could undertake; it's a theoretical construct.
      *   **The Core *Insight* Survives, the *Dichotomy* Blurs:** The fundamental *point* – that morality/value must connect to *actual* motivations and not float free – remains crucial. However, the clean binary of "internal to *this* agent" vs. "external" becomes less applicable. We shift towards questions of *fidelity* to the source material and *legitimacy* of the aggregation/extrapolation process, rather than a strict internal/external label.

  **Conclusion: A Strained Analogy, but Shared Foundation**

  CEV is **structurally analogous to an extremely ambitious, scaled-up version of Williams' internal reasons view.** It embodies the core internalist conviction: morality must be rooted in the corrected, coherent expression of *our own* motivations, not discovered externally. Williams' "sound deliberative route" and CEV's "extrapolation" share the logic of tethered idealization.

  However, **CEV's scale, computational nature, and species-level focus strain the analogy and potentially break the tether** that defines internalism for Williams. The distinction between "internal reason for an individual" and "coherent extrapolated volition for a species" becomes less sharp and less useful. The process risks becoming so transformative and abstract that it *functionally* introduces something akin to an external standard, even if its designers insist it's still fundamentally "internal" to humanity's potential.

  Your insight is spot-on: CEV tries to walk the tightrope Williams described – building normative force only from an agent's existing motivational set, corrected by truth and reason – but the tightrope is stretched over a chasm of complexity when applied to an entire species' future. Whether it stays on the wire or falls into externalism depends heavily on the specifics of the extrapolation process and how recognizable the result remains to the humans whose volition it claims to represent. The *intent* is internalist; the *execution* at that scale inevitably flirts with externalism.
