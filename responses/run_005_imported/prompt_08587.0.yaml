prompt: |-
  So I've been kind of obsessed with the liar paradox ("this sentence is false") ever since I fell down a Wikipedia rabbit hole a few months ago, and the more I read the more it feels like every "solution" just relocates the problem instead of actually solving it. Tarski's answer seems to be that a language can't contain its own truth predicate, you need a heirarchy of meta-languages stacked on top of each other — fine, but then couldn't someone just say "this sentence isn't true at any level of the hierarchy," and aren't we back to square one? Then I read about Kripke's fix, where some sentences (like the liar) just don't get a truth value at all, theyre "ungrounded," neither true nor false. But apparently there's a "strengthened" or "revenge" version, something like "this sentence is not true," that supposedly breaks that theory too. And then there's this guy named Graham Priest who just bites the bullet and says some contradictions are literally true (dialetheism), which sounds kind of insane to me on its face, but from what I can tell it might be the one view that isn't constantly getting outrun by these revenge sentences.

  I don't have any background in logic or philosophy, I'm just someone who reads about this stuff for fun on my lunch break, so I don't really have anyone to actually hash this out with. Could you write me an essay that weighs Tarski's hierarchy, Kripke's gap theory, and Priest's dialetheism (plus any other serious contender you think deserves a mention) against each other, specifically on whether each one can survive the revenge problem? I don't want an essay that just ends on "well, smart people disagree" — I want you to actually pick one (or explain why we're stuck with contradictions or gaps no matter what we do) and defend that pick like you're trying to convince me over a beer, not just list out the pros and cons.
