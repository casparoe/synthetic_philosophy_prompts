prompt: |-
  I cover science and tech policy for a magazine, and somehow I've ended up as the "public member" on my county's oversight committee for a new pretrial risk-assessment tool. The vendor's system tells judges things like "this defendant has a 34% chance of being rearrested before trial," generated from a model trained on thousands of past cases with similar features. One committee member, a former actuary, is refusing to sign off, arguing that pinning one number on one specific person is basically a category error -- swap out which group of "similar" past defendants you compare him to and you get a wildly different percentage, and there's no principled way to pick the right comparison group, so the 34% isn't really a fact about this guy at all. The vendor's rep just shrugs and says insurance and medicine have been doing exactly this for decades and it works fine. I need a short memo from the committee -- approve the tool for bail hearings, reject it, or approve with specific restrictions -- that actually deals with the actuary's objection instead of hiding behind "the model is validated," and that we can actually vote on at next weeks meeting. Can you draft it?
reasoning: |-
  Okay, the user is a science and tech policy journalist who's now serving as a public member on a county committee overseeing a new pretrial risk-assessment tool. They need a memo for the committee addressing an actuary's objection that assigning a single percentage risk to an individual is a category error. The actuary argues that changing the comparison group of "similar" defendants results in different percentages, and there's no principled way to choose the right group. The vendor dismisses the concern by pointing to practices in insurance and medicine.

  First, I need to unpack the actuary's argument. The core issue is about individual vs. group probabilities. Risk-assessment tools use historical data to predict outcomes for groups with similar characteristics, but applying a group-derived probability to an individual is problematic. The actuary is right that different reference groups yield different probabilities, and there's no objective way to select one over another for a specific person. This is a fundamental statistical problem.

  The vendor's comparison to insurance and medicine is flawed. Insurance uses group data to set premiums but doesn't assign individual risk probabilities in the same way. Medical risk scores are often for populations, not specific predictions for single patients. Plus, in criminal justice, the stakes are higher—individual liberty is on the line. Misinterpretation by judges could lead to unfair detentions.

  The user needs a memo that doesn't just rely on model validation but addresses the philosophical and practical concerns. The memo should present options: approve, reject, or approve with restrictions. Given the actuary's valid points, outright rejection might be tempting, but practical solutions are needed. Restrictions could mitigate misuse, like banning exact percentages and emphasizing group-level interpretation.

  I should consider the committee's dynamics. The user is a journalist, so clarity and avoiding jargon are key. The memo must be concise for a vote. Highlighting that the percentage isn't a fact about the individual but a group estimate shifts focus. Restrictions like requiring qualitative risk categories (low, medium, high) instead of exact numbers could reduce overinterpretation. Training for judges on statistical limitations is crucial.

  Also, transparency about the model's limitations in the report itself might help. Ensuring that the tool is one factor among many, not the sole determinant. The actuary's concern is about epistemic overreach—treating a group statistic as an individual property. The memo needs to acknowledge this without discrediting the tool entirely, promoting responsible usage.

  Finally, balancing policy needs with ethical considerations. The tool might have benefits in reducing biases or standardizing decisions, but misapplication risks harm. The memo's options should reflect this balance, leaning towards restrictions that enforce proper interpretation. The "approve with restrictions" option seems most viable, addressing the actuary's concerns while allowing tool usage.
answer: |-
  ## MEMORANDUM  
  **To:** County Pretrial Risk-Assessment Oversight Committee  
  **From:** [Your Name], Public Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Vendor Risk-Assessment Tool & Addressing the "Category Error" Concern  

  This memo addresses the core objection raised by our actuary member concerning the validity of assigning a single, specific probability score (e.g., "34% chance of rearrest") to an individual defendant. The vendor's comparison to insurance/medicine practices, while common, does not resolve the fundamental statistical-philosophical concern: **Can a group-derived probability accurately represent the risk of a unique individual, and is there a single "correct" number?**

  ### The Actuary's Objection: Summarized & Validated
  The actuary correctly argues that:
  1.  **Group Probability vs. Individual Fate:** The tool calculates risk based on outcomes for a *group* of defendants deemed "similar" based on selected features (e.g., age, charge, prior record). A "34%" score means that in a hypothetical group of 100 defendants *statistically similar* to this one, approximately 34 might be rearrested. **It is not a statement that *this specific defendant* has a precisely 34% inherent propensity to offend.**
  2.  **Reference Class Problem:** The "similarity" criteria defining the comparison group are chosen by the model designers. Different criteria (e.g., including/excluding zip code, using different prior offense categories) create different comparison groups, yielding different probabilities for the same individual. There is often no *principled, objective* reason to prefer one specific reference class over another for *this unique person*. Therefore, the specific number (e.g., 34%) is not a discoverable "fact" *about the individual*, but a product of the model's chosen reference class.
  3.  **Misinterpretation Risk:** Presenting a single, precise number inherently suggests a level of individual precision and certainty that the statistical methodology cannot support. Judges may misinterpret "34%" as a direct measure of *this defendant's* dangerousness, rather than a population-based estimate contingent on the model's structure.

  ### Vendor Response & Context (Insurance/Medicine)
  While insurance and medicine use similar group-based risk models, key differences exist:
  *   **Purpose & Stakes:** Insurance sets premiums for pools; medicine informs population-level guidelines or *probabilistic* treatment decisions. Pretrial decisions directly impact individual liberty based on a prediction of *future individual behavior* – a higher-stakes application demanding greater caution regarding individual inferences.
  *   **Interpretation:** Actuarial tables in insurance aren't typically presented *to the insured* as "Your personal risk of crashing is 12.7%." Medical risk scores are often contextualized for patients/providers as ranges or categories (e.g., "high risk"), acknowledging uncertainty.
  *   **Validation ≠ Resolution:** Model validation (e.g., overall calibration, discrimination) assesses *aggregate* performance across many defendants. It does *not* resolve the fundamental issue of whether a single number meaningfully applies to *one specific person* or whether a different, equally valid model would yield a drastically different number for that same person.

  ### Committee Recommendation Options

  **Option 1: Reject the Tool in its Current Reporting Format**
  *   **Rationale:** The presentation of a single, precise probability score for an individual defendant is inherently misleading and susceptible to the reference class problem. The risk of judicial misinterpretation and the resulting potential for unjust deprivation of liberty outweighs the tool's potential benefits in its current form.
  *   **Vote:** Approve / Reject

  **Option 2: Approve the Tool with Specific Restrictions Addressing the Objection (RECOMMENDED)**
  *   **Rationale:** The underlying statistical model may provide valuable *relative* risk information compared to an unassisted decision. However, the presentation of results must fundamentally change to mitigate the "category error" and misinterpretation risks.
  *   **Required Restrictions:**
      1.  **Ban Precise Percentages:** The tool **shall not** output or display a specific probability percentage (e.g., 34%) to judges or in any court record associated with an individual defendant.
      2.  **Require Risk Categories:** Results **must** be presented *only* in broad, clearly defined risk categories (e.g., "Low Risk," "Moderate Risk," "High Risk"). These categories must be:
          *   Statistically validated and clearly defined (e.g., "Low Risk: Predicted rearrest rate < 10%").
          *   Limited to 3-5 categories maximum.
          *   Accompanied by a mandatory, prominent disclaimer on *every* report: *"This risk level is based on statistical patterns in groups of defendants with similar characteristics. It does not predict the specific behavior of this individual defendant. This information is one factor among many to be considered in the judicial decision-making process."*
      3.  **Enhanced Judicial Training:** Implementation **must** include mandatory, robust training for all judges and court staff, explicitly covering:
          *   The group-based nature of the score.
          *   The meaning (and limitations) of the risk categories.
          *   The reference class problem and why precise percentages are prohibited.
          *   The tool's role as *one component* of a holistic bail decision (nature of charge, ties to community, individual circumstances, etc.).
      4.  **Transparency:** The committee receives a detailed report on the category definitions, validation metrics for *categories* (not just the underlying % model), and the training curriculum before final rollout.
  *   **Vote:** Approve / Reject

  **Option 3: Approve the Tool Without Restrictions**
  *   **Rationale:** The tool is validated at the aggregate level and provides useful, objective information superior to unstructured judicial discretion. Concerns about individual interpretation are mitigated by judicial training and the tool's intended use as one factor among many. The insurance/medicine precedent demonstrates practical utility outweighing philosophical concerns.
  *   **Vote:** Approve / Reject

  ### Recommendation
  **The Committee recommends APPROVAL of the risk-assessment tool ONLY under OPTION 2 (with specified restrictions).** This approach acknowledges the tool's potential value while directly addressing the valid statistical objection concerning individual probabilities. It mitigates the significant risk of misinterpretation by prohibiting the display of precise percentages, mandating clear categories with disclaimers, and requiring focused training. This balances the desire for data-informed decisions with the ethical imperative to avoid presenting group statistics as individual facts in a high-stakes liberty context. Option 1 disregards potential benefits, while Option 3 ignores a fundamental flaw in how risk is communicated to decision-makers.

  ---

  **Proposed Vote at Next Meeting:**  
  Motion to approve the vendor's pretrial risk-assessment tool for use in bail hearings, **conditional on the implementation of the restrictions outlined in Option 2** (Ban Precise Percentages, Require Risk Categories with Disclaimer, Enhanced Judicial Training, Transparency).

  [ ] Approve the Motion (Approve Tool w/ Option 2 Restrictions)  
  [ ] Reject the Motion (Effectively rejects tool or requires new approach)  
  [ ] Amend the Motion (Specify changes to the restrictions or choose a different option)
