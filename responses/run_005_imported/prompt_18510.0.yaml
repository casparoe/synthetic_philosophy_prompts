prompt: |-
  I'm on my high school's Honor Council (the student panel that hears cheating cases before they reach the dean), and this week's case has split the group down the middle, so I actually need to bring a real recommendation to wednesdays meeting. Our physics teacher's take-home tests are marked 'no outside help, work alone.' A student posted in the class groupchat asking for the formula from a practice-packet problem, someone answered, and the real test turned out to have that same problem with different numbers. When she got confronted, she said 'I never asked anyone for answers to the test, I asked about the packet' -- which is completely true. Half the council says that's obviously a violation since everyone in the chat knew exactly why she was asking; the other half says the code only bans 'dishonest statements,' and hers technically wasn't dishonest, so there's nothing to punish. Can you write the memo -- an actual recommendation, not just 'well it's complicated,' something that seriously engages the 'but she didn't lie' side instead of brushing past it, and says whether we should reword the code so this stops happening.
reasoning: |-
  Okay, the user is part of their high school's Honor Council and they're dealing with a tricky case. A student asked for a formula from a practice packet in the class group chat, and that same problem appeared on the actual test with different numbers. The student claims she didn't ask for test answers since it was about the packet. The council is split: half see it as a violation because everyone knew why she was asking, while the other half argue she didn't technically lie, so it's not punishable. The user needs a clear recommendation for their meeting and whether the honor code should be updated.

  First, I need to unpack both sides of the argument. The pro-violation side believes intent matters. They think the student was trying to get an unfair advantage by asking about the practice problem, knowing it would help on the test. The context of the group chat makes it obvious to everyone involved. Even if she didn't directly ask for test answers, her action was deceptive.

  On the other hand, the anti-violation side sticks to the letter of the code. The honor code prohibits "dishonest statements," and her question was factually true. She asked about the packet, not the test. Punishing her could set a precedent where intent overrides explicit rules, leading to subjective judgments. They might argue that the teacher's reuse of problems is the real issue here.

  The user's deeper needs are important here. They need a resolution that's fair and maintains the honor council's credibility. They also want to prevent future similar cases, which suggests the code might need clarification. The memo must address both sides thoroughly, showing that the council considered all angles, not just dismissing the technicality argument.

  I should consider the principles of academic integrity. Honor codes aren't just about literal truth but about maintaining fairness. Exploiting loopholes undermines the spirit of the rules. The student's action, while not a direct lie, was manipulative. She used a loophole to gain an advantage, which is dishonest in spirit.

  The council's role is to uphold integrity, not just enforce rules robotically. Precedent matters: if they let this slide, students might start using similar tactics, hiding behind technicalities. That could erode trust in the system. However, the anti-violation side has a point about clarity. If the code doesn't cover this, maybe it's a flaw in the wording.

  Recommendation-wise, I'm leaning towards a violation but with a nuanced approach. The student didn't lie, but her action was dishonest by intent. A warning rather than a severe penalty could balance the breach of spirit with the technicality. This shows the council takes intent seriously without being overly harsh.

  For the code revision, I'd suggest adding language about "circumventing rules" or "seeking unfair advantage," which covers indirect methods. Explicitly stating that exploiting ambiguities is prohibited would close this loophole. Also, clarifying that "outside help" includes discussions on materials likely to appear on assessments.

  The memo should be structured to acknowledge both sides, explain why intent matters, recommend a violation with rationale, and propose code changes. It needs to be respectful, logical, and focused on upholding integrity while adapting to real-world scenarios. The user needs a decisive yet fair outcome that the whole council can support, or at least accept.
answer: |-
  ## Honor Council Recommendation Memo: Case #PHY-2024-003  
  **Subject:** Interpretation of "Dishonest Statements" & Outside Help Policy  

  ### Case Summary
  Student A posted in the class group chat during the "no outside help" take-home test period: *"Does anyone remember the formula for Problem 7 in the practice packet?"* Student B provided the formula. The test later included an identical problem (differing only in numerical values). Student A acknowledges asking about the packet but argues this did not violate the "no outside help" or "dishonest statements" rules since she referenced the *practice packet*, not the *test*.

  ### Council Division
  The Council is divided into two principled positions:  
  1.  **Pro-Violation:** The inquiry was contextually dishonest. All students understood the test was active, the packet was preparatory, and the intent was to gain advantage on the test problem. This violates the *spirit* of "no outside help."  
  2.  **Anti-Violation:** The *literal wording* of the rule ("no dishonest statements") was not breached. Student A's statement ("practice packet problem") was factually accurate. Punishing technically true statements sets a dangerous precedent for subjective interpretation.  

  ### Recommendation: Violation Found (With Nuance)
  **We recommend finding Student A in violation of the "no outside help" policy.** However, this finding rests on interpreting the *action* (seeking outside help on material directly relevant to the active test under "work alone" conditions) as dishonest *conduct*, even if the *specific statement* was literally true.  

  #### Why This Constitutes a Violation Despite the Literal Truth
  1.  **Intent and Exploitation of Ambiguity:** The Honor Code exists to ensure fairness, not merely to police literal falsehoods. Student A exploited a semantic loophole ("packet" vs. "test") to circumvent the clear intent of the "no outside help during the test" rule. Her *intent* was unambiguous: to obtain information directly applicable to the test problem from peers, forbidden by the test conditions. The group chat context confirms peers understood this intent.
  2.  **"Outside Help" Encompasses Indirect Solicitation:** The "no outside help" rule is not limited to requests explicitly labeled "for the test." It prohibits seeking *any* assistance on the *subject matter* of the test during the assessment period. Soliciting answers to a practice problem *known* to be identical in structure and methodology to a test problem constitutes seeking outside help *on the test material*. The identical nature of the problem transforms the "packet" inquiry into a *de facto* test inquiry.
  3.  **Dishonesty as Conduct, Not Just Statements:** While the code specifies "dishonest statements," academic integrity policies inherently govern *dishonest conduct*. Seeking an unfair advantage by masking a test-related query as a "packet" question *is* dishonest conduct, even if phrased technically accurately. Upholding integrity requires judging the *substance* of the action, not just the semantics of the words used.
  4.  **Precedent and System Integrity:** Finding no violation here creates a significant loophole. Future students could freely discuss *any* preparatory material verbatim during tests, provided they avoid the word "test," rendering the "no outside help" rule meaningless whenever teachers reuse problems. This undermines the entire purpose of take-home assessments.

  #### Addressing the "She Didn't Lie" Argument Seriously
  The "she didn't lie" argument is **valid and important.** It highlights a critical ambiguity in our code. Punishing purely truthful statements *would* be dangerous. However, **this case is not about punishing a true statement; it's about prohibiting the *action* of seeking outside help during a protected assessment period using a misleading pretext.** The violation lies in the *act* of soliciting restricted help, facilitated by the *manner* of the request. Her technically true statement *enabled* the violation but is not the *sole basis* for the finding. The core violation is gaining unauthorized assistance on test content.

  ### Recommended Sanction (If Applicable)
  Given the novel nature of the loophole exploited and the technical truthfulness of the statement, we recommend a **moderated sanction:**  
  *   **Educational Component:** Mandatory review of academic integrity principles focusing on intent vs. technicality and the scope of "outside help."  
  *   **Partial Credit Loss:** Reduction in score *for the specific problem* gained through the solicited information (e.g., zero on that problem).  
  *   **No Further Suspension/Probation:** Avoids excessive harshness for exploiting an ambiguity rather than committing a blatant lie or answer-sharing.

  ### Recommendation for Code Revision: YES
  **We strongly recommend revising the Honor Code to prevent future ambiguity.** The current wording ("no dishonest statements") is insufficient to address deceptive conduct exploiting technicalities.  

  #### Proposed Revisions
  1.  **Amend "Outside Help" Definition:**  
      > *"No outside help includes, but is not limited to: soliciting or receiving assistance from any person, resource (online or offline), or material not explicitly authorized by the instructor, on any question, concept, formula, methodology, or problem type that appears on, or is demonstrably relevant to, the assessment during the designated assessment period. This prohibition applies regardless of whether the assistance is sought or framed in reference to preparatory materials, past assignments, or hypothetical scenarios."*

  2.  **Clarify "Dishonesty":**  
      > *"Dishonest conduct includes, but is not limited to: making false statements, misrepresenting one's work, concealing violations, *or deliberately exploiting ambiguities in the rules or instructions to gain an unfair academic advantage.*"*

  ### Conclusion
  Student A's technically true statement masked an action fundamentally at odds with the "work alone, no outside help" requirement. Finding a violation upholds the spirit of academic integrity and closes a dangerous loophole. However, the case exposes a flaw in the code's specificity. We recommend a measured sanction reflecting the novel exploitation and propose concrete code revisions to provide clarity and prevent recurrence. This approach balances fairness to the individual with the imperative to maintain a robust and unambiguous Honor System.

  **Vote:** Majority Recommendation (Pro-Violation & Revision)  
  **Prepared For:** Honor Council Meeting - Wednesday [Date]
