answer: |-
  ## MEMORANDUM: Honorary Fellowship Nomination - Air Marshal [Surname] & the Anscombe Principle

  **To:** Committee on Honorary Fellowships  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Nomination of Air Marshal [Surname] - Ethical Framework Based on Anscombe's Objections  

  This memorandum addresses the nomination of Air Marshal [Surname] for an Honorary Fellowship, specifically considering the objections raised invoking Elizabeth Anscombe's protest against President Truman's honorary degree in 1956. While the Air Marshal's actions present a profound utilitarian argument, Anscombe's critique compels us to evaluate the *nature* of the act itself, not merely its consequences. After careful consideration of Anscombe's actual arguments, I recommend against approving this nomination. My reasoning follows:

  **1. The Case for the Air Marshal (Acknowledged):**
  Advocates rightly emphasize the horrific context: a prolonged siege causing immense suffering, with credible estimates predicting significantly higher civilian casualties (potentially orders of magnitude greater) over an additional year. The Air Marshal's decision to order strikes on critical civilian infrastructure (power grid, water plants) directly caused the deaths of several thousand non-combatants. However, this action demonstrably precipitated the siege's end within a week. The core argument is one of **lesser evil**: choosing a terrible action to avert a greater catastrophe, saving a net number of lives. This is a weighty consequentialist justification grounded in the prevention of further, potentially worse, suffering.

  **2. Anscombe's Argument: Beyond "Double Effect" Simplification:**
  Anscombe's objection to Truman (specifically regarding the atomic bombings) is often misremembered solely through the lens of the "Doctrine of Double Effect" (DDE). While DDE is part of her framework, her core argument was far more fundamental and absolute. Her primary contention, rooted in Thomistic natural law ethics, was this:

  *   **The Absolute Prohibition of Intentional Killing of the Innocent:** Anscombe argued that certain acts are intrinsically evil, regardless of their consequences. Deliberately targeting and killing innocent civilians ("the innocent" meaning non-combatants) as a *means* to a military or political end is one such act. It is always morally forbidden.
  *   **Distinction: Intention vs. Foresight:** This is the crucial point often blurred in "trolley problem" discussions. Anscombe insisted on a bright line:
      *   **Forbidden:** *Intending* the death of innocents as part of the plan (e.g., killing civilians to demoralize the enemy and force surrender).
      *   **Potentially Permissible (under DDE):** *Foreseeing but not intending* their deaths as a side-effect of a legitimate military action *directly* aimed at a combatant target (e.g., bombing a munitions factory knowing nearby civilians might die, where their deaths are not the mechanism of victory).
  *   **Rejection of "Lesser Evil" Justification for Intrinsically Evil Acts:** Anscombe vehemently rejected the idea that good consequences (saving more lives, ending a war/siege) could morally justify an act that was intrinsically evil. To do so, she argued, was to corrupt the very concept of morality and make it subordinate to expediency. She saw Truman's act as murder, plain and simple, and thus utterly unworthy of honouring by a university dedicated to truth and moral reasoning.
  *   **The Stakes of the Honor:** Her protest wasn't merely about disagreeing with Truman; it was about what the university *affirms* by granting its highest honour. Honouring someone for an act she deemed intrinsically evil was, for Anscombe, a profound betrayal of the university's moral purpose.

  **3. Applying Anscombe's Framework to the Air Marshal's Action:**
  *   **The Nature of the Act:** The strikes explicitly targeted the city's power grid and water plants – inherently civilian infrastructure fundamental to sustaining non-combatant life. The *intended effect* of these strikes, as described, was to inflict catastrophic suffering and death on the civilian population *in order to* break the will of the besieged forces or their command structure. The civilians' deaths and suffering were not an unfortunate by-product; they were the *instrument* chosen to achieve the military objective.
  *   **Intention vs. Foresight:** While the *specific number* of deaths was foreseen, the *intention* was undeniably to inflict massive civilian harm as the direct mechanism to end the siege. This falls squarely into the category Anscombe deemed intrinsically evil: the intentional killing of the innocent as a means.
  *   **Consequences are Irrelevant to the Moral Nature (Per Anscombe):** Under this strict framework, the credible argument that more lives were saved overall does not change the moral character of the act itself. Anscombe would argue that endorsing such an act through an honour, precisely *because* it achieved a "good" outcome through forbidden means, dangerously legitimizes the principle that "the end justifies the means" when the means involve the deliberate slaughter of innocents.

  **4. Addressing Counterarguments within Anscombe's Framework:**
  *   **"But the siege would have killed more!":** Anscombe would acknowledge this as a terrible tragedy but maintain it cannot justify the commission of an intrinsically evil act. Choosing the lesser evil is only permissible when *both* options are morally licit, or when the lesser evil involves *foreseen* but *unintended* harm. Deliberate targeting of innocents removes the act from the realm of permissible choice, regardless of alternatives.
  *   **"Military Necessity / Supreme Emergency":** While some ethical frameworks allow for such exceptions (e.g., Walzer), Anscombe's absolutist position explicitly rejects them concerning the intentional killing of innocents. She would argue there is no threshold of emergency that transforms murder into a morally acceptable act.
  *   **"He saved lives overall / Made a tough call":** This speaks to the Air Marshal's burden of command and the utilitarian calculus. However, Anscombe's objection focuses on the *act honored*, not the difficulty of the choice or the actor's character. Honoring the *act* of intentionally killing innocents as a strategy is the core problem.

  **5. The Significance for an Oxford Honorary Fellowship:**
  An Oxford honorary fellowship is not merely recognition of achievement; it is a profound statement of the college's values and an invitation to embody them within our community. It signifies intellectual and moral fellowship. To honour an act that, under a rigorous and historically significant ethical framework championed by one of our own (Anscombe was a Somerville Fellow and Professor), constitutes the deliberate killing of innocents as a strategy, risks:
  *   Implicitly endorsing the principle that such acts can be justified by outcomes.
  *   Diminishing the absolute moral prohibition against targeting civilians.
  *   Creating dissonance with the university's foundational commitment to ethical reasoning and human flourishing.

  **6. Recommendation:**
  While I acknowledge the gravity of the siege and the Air Marshal's unenviable position, and recognize the consequentialist weight of his advocates' arguments, Elizabeth Anscombe's core ethical principle – that intentionally killing the innocent as a means is always morally forbidden and cannot be justified by consequences – provides a compelling and specific reason to withhold this honour. Granting the fellowship would constitute institutional approval of the *method* used, irrespective of the outcome. **I therefore recommend voting against the nomination of Air Marshal [Surname] for an Honorary Fellowship.**

  This recommendation stems not from questioning the Air Marshal's dedication or the complexity of his dilemma, but from a commitment to the absolute moral boundary Anscombe articulated, which remains a vital part of our intellectual heritage and a necessary restraint in the conduct of war. Honouring this principle, especially when it is profoundly difficult, is precisely the task of an institution dedicated to the humanities and ethical reflection.

  **Vote:** No
