prompt: |-
  The formal ethics reading group I'm part of has spent the last few weeks working through Harsanyi's aggregation theorem, and I want to sanity-check a framing I'm planning to use in a talk for our department's graduate workshop next month, since a couple of the group's members are decision theorists who won't let a sloppy statement of the theorem pass unchallenged. As I understand it, once both individuals and the social evaluator are required to have preferences over lotteries satisfying the von Neumann–Morgenstern axioms, the Pareto indifference condition forces the social utility function to be an affine combination of the individual utility functions. I've been presenting Harsanyi (1955) to the group as, in effect, a mathematical vindication of classical utilitarianism: any rational social planner who respects unanimous indifference among expected-utility maximizers is thereby committed to summing everyone's utility with equal weight, on pain of violating one of the axioms. On this reading, prioritarian or Rawlsian departures from equal-weight aggregation are not merely contestable value judgments but outright violations of rationality once uncertainty enters the picture.

  One of the economists in the group objected that this smuggles in more than the theorem actually delivers, gesturing at something about the weights being arbitrary depending on how each person's utility scale is normalized, and mentioned a "Harsanyi-Sen debate" that I have only encountered in passing footnotes. Before I build part of the talk around an "utilitarianism is mathematically mandatory" framing, could you help me work out whether the theorem really pins down equal weighting across individuals, or whether I am reading something into the axioms that is not there? If it is the latter, I would appreciate a precise account of what further assumption is needed to move from "some affine combination of individual utilities" to "the equally weighted sum," and how that gap bears on whether the theorem genuinely forecloses non-utilitarian views as irrational.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a formal ethics reading group that's been studying Harsanyi's aggregation theorem. The user wants to present the theorem in a graduate workshop, framing it as a mathematical vindication of classical utilitarianism. Specifically, they claim that the theorem forces equal weighting of individual utilities, making prioritarian or Rawlsian approaches irrational under uncertainty. However, an economist in their group objected, pointing out issues with utility normalization and mentioning the Harsanyi-Sen debate.

  First, I need to recall the key elements of Harsanyi's theorem. The setup requires both individuals and the social planner to have vNM-rational preferences over lotteries. Pareto indifference implies that the social utility function must be an affine combination of individual utilities. But does this necessarily mean equal weights? 

  The user's main concern is whether the equal weighting is inherent in the theorem or if they're overreaching. The economist's objection about utility normalization seems crucial here. I remember that vNM utility functions are unique only up to affine transformations. So each individual's utility scale can be shifted and scaled, which affects the weights in the social welfare function. Without fixing the scales, the weights are arbitrary. 

  Next, the Harsanyi-Sen debate. Sen argued that Harsanyi's theorem doesn't deliver utilitarianism because the affine combination doesn't imply interpersonal comparability. For equal weighting, we need to assume that utility units are comparable across individuals. But the vNM axioms alone don't provide that; they only handle individual risk preferences, not interpersonal comparisons.

  The user might be conflating the mathematical form with normative content. The affine combination is necessary, but equal weighting requires additional assumptions. To get classical utilitarianism, we need to assume that individual utilities are cardinally measurable and interpersonally comparable with a common zero and unit. 

  The user also mentions prioritarian and Rawlsian views. The theorem doesn't foreclose these as irrational because they might reject the full comparability assumption. Prioritarians weight utilities differently, which could be rational if comparability isn't assumed. Rawlsians might reject the vNM axioms for the social planner, especially in the original position where maximin applies.

  In summary, the user's framing needs adjustment. The theorem shows that social utility must be affine, but equal weights require normalization. Without interpersonal comparability, non-utilitarian views aren't irrational. The user should clarify these points in their talk to avoid objections from decision theorists.
answer: |-
  Your framing captures the mathematical core of Harsanyi's theorem brilliantly, but the economist's objection is spot-on regarding the "equal weighting" claim. **The theorem does *not*, by itself, pin down equal weighting or make prioritarian/Rawlsian views irrational under uncertainty.** Here's the precise breakdown:

  1.  **What Harsanyi (1955) Establishes (Correctly Stated):**
      *   **Inputs:**
          *   `n` individuals with vNM-rational preferences over lotteries (outcomes + probabilities). => Each has a vNM utility function `U_i`, unique up to positive affine transformations (`a_i * U_i + b_i`, `a_i > 0`).
          *   A social evaluator with vNM-rational preferences over the *same* lotteries.
          *   **Pareto Indifference (PI):** If every individual is indifferent between two lotteries, then the social evaluator must also be indifferent.
      *   **Output:**
          *   There exist constants `c_1, c_2, ..., c_n` (not all zero) and a constant `k` such that the social vNM utility function `W` representing the social evaluator's preferences satisfies:
              `W = c_1 * U_1 + c_2 * U_2 + ... + c_n * U_n + k`
          *   This is an *affine combination* (linear combination plus a constant).

  2.  **The Gap: From Affine Combination to Equal Weighting (c_i = c_j)**
      The theorem delivers the *form* `W = Σ c_i * U_i + k`. **It does *not* determine that `c_i = c_j` for all `i, j`.** The weights `c_i` are constants *given a specific choice of scaling for each individual utility function `U_i`*. This is the crux of the normalization/weighting issue.

      *   **The Indeterminacy:** Each `U_i` is only defined up to a positive affine transformation. Suppose we rescale individual `j`'s utility: `U_j' = a_j * U_j + b_j` (`a_j > 0`).
      *   **The Weight Adjustment:** To keep the *same* social preferences represented by `W`, the weight on `U_j'` *must* become `c_j' = c_j / a_j`. The constant `k` will also absorb a term involving `b_j`.
      *   **Consequence:** By choosing different scalings (`a_j`) for different individuals, we can make the weights `c_j'` take on *any* positive values we want! **The numerical values of the `c_i` are meaningless without fixing the scales of the `U_i`.**

  3.  **What *Does* Deliver Equal Weighting?**
      To get `c_i = c_j` for all `i, j` (classical utilitarianism), you need a **substantive assumption about interpersonal comparability of utility levels and units**:

      *   **The Assumption:** There exists a *common, interpersonally comparable* zero point and unit for utility across all individuals. This fixes the `b_i` (zero point) and the `a_i` (unit) in a way that makes the scales directly comparable.
      *   **The Implication:** Once you fix *one specific scaling* for each `U_i` that establishes this common zero and unit, *then* the weights `c_i` become meaningful and comparable. Only *then* does setting `c_i = c_j` for all `i, j` represent giving equal weight to each individual's *comparable* utility.
      *   **Harsanyi vs. Sen:** This is the heart of the Harsanyi-Sen debate. Sen argued that Harsanyi's axioms *only* deliver the affine form, not interpersonal comparability. Harsanyi believed his framework implicitly assumed the possibility of making interpersonal comparisons based on extended preferences (imagining oneself in the position of others with their preferences). The theorem *itself* does not contain this assumption; it's a philosophical addition.

  4.  **What This Means for Non-Utilitarian Views:**
      The theorem does **not** foreclose prioritarian or Rawlsian views as *irrational* under uncertainty. Here's why:

      *   **Prioritarianism:** A prioritarian accepts the affine form `W = Σ c_i * φ(U_i) + k` (or a nonlinear `W` applied to a vector of `U_i`). They *reject* the assumption that the `U_i` are interpersonally comparable on a linear scale suitable for direct summation. They argue that `φ(U_i)` (a concave transformation) captures the moral value of utility gains to individuals at different absolute levels *once comparability is established*. The vNM axioms + PI don't force them to accept the specific comparability needed for `Σ U_i`. They might accept comparability but argue `Σ φ(U_i)` is the rational form under their value commitments.
      *   **Rawlsianism (Maximin/Leximin):** Rawlsians typically reject the vNM axioms *for the social evaluator*, especially when reasoning behind the veil of ignorance. They argue the social choice under deep uncertainty (original position) shouldn't maximize *expected* social utility (violating the Independence axiom), but should prioritize the worst-off. Harsanyi's theorem assumes the social evaluator *accepts* the vNM axioms (including Independence), which a Rawlsian social planner explicitly rejects in the original position context. **The theorem shows that *if* you accept vNM rationality for society *and* PI, *then* you get affine aggregation. Rawlsians deny the antecedent for the social evaluator under deep uncertainty.**

  **Precise Summary for Your Talk:**

  *   **Correct:** "Harsanyi's theorem, given vNM rationality for individuals and society plus Pareto Indifference, forces the *social welfare function to be an affine combination* `W = Σ c_i * U_i + k` of the individual vNM utility functions."
  *   **Needs Nuance:** "Crucially, the weights `c_i` depend entirely on how we *normalize* the scales of the individual utility functions `U_i`, which are only unique up to affine transformations. The theorem itself does *not* provide a unique normalization."
  *   **For Equal Weighting:** "To interpret this as *classical utilitarianism* (`Σ U_i`), we need the *additional normative assumption* that individual utilities are measured on interpersonally comparable cardinal scales with a common zero and unit. Without this comparability assumption, the weights `c_i` are arbitrary."
  *   **Re: Non-Utilitarians:** "Therefore, the theorem does *not* render prioritarian or Rawlsian views irrational under uncertainty. Prioritarians typically accept the affine form but argue for a nonlinear transformation (`Σ φ(U_i)`) based on their conception of interpersonal comparability and value. Rawlsians reject the application of vNM rationality (specifically the Independence axiom) to the social evaluator reasoning under the deep uncertainty of the original position, thereby stepping outside the scope of Harsanyi's axioms."

  **Recommendation for Framing:**

  Instead of "utilitarianism is mathematically mandatory," frame it as:

  > **"Harsanyi's theorem reveals the *mathematical structure* of rational social aggregation under uncertainty: affine aggregation. This powerfully constrains possibilities but leaves open the critical question of *interpersonal comparability*. *If* we accept that individual utilities are cardinally measurable and interpersonally comparable with equal units, *then* classical utilitarianism (`Σ U_i`) is uniquely mandated by rationality and unanimity. However, the debate over whether such comparability is possible or appropriate, and the validity of vNM axioms for society under deep uncertainty, remains the central battleground between utilitarians, prioritarians, and Rawlsians."**

  This framing is robust: it accurately states the theorem's mathematical force, highlights the crucial gap concerning weights/normalization/comparability, and correctly positions the non-utilitarian critiques without overclaiming that the theorem itself settles them as irrational. It should satisfy the decision theorists while still showcasing the theorem's significant implications. Good luck with your talk!
