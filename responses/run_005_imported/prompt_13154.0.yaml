answer: |-
  That's a deeply unsettling argument to grapple with, and your frustration is completely understandable. The Darwinian Dilemma (yes, from Sharon Street) is a powerful challenge to a certain kind of moral realism (specifically, non-naturalist realism). But your friend's leap to "therefore, nothing is objectively right or wrong, and everything is arbitrary" is a massive overstatement and ignores robust alternatives. Here's a breakdown:

  1.  **Understanding the Dilemma (Correctly):**
      *   **Premise 1:** Evolution shaped our moral intuitions (cooperation, kin preference, reciprocity, aversion to harm, sense of fairness) because they enhanced survival and reproduction (fitness), *not* because they tracked some independent, abstract moral truth "out there."
      *   **Premise 2:** If moral realism is true (there *are* independent moral truths), we need our intuitions to reliably track them to have moral knowledge.
      *   **The Horns:**
          *   **Horn 1 (Tracking Coincidence):** It's an astronomically unlikely coincidence that evolution, selecting purely for fitness, just happened to produce minds that accurately perceive these independent moral truths.
          *   **Horn 2 (Tracking Link):** Evolution *was* somehow tracking moral truths. But this seems scientifically implausible – how would natural selection "detect" abstract moral facts?
      *   **Conclusion (Street's Argument):** Non-naturalist moral realism (the idea that moral facts exist independently like Platonic forms or weird non-physical properties) is probably false. Our moral sense evolved for fitness, not truth-tracking.

  2.  **Why Your Friend's Conclusion is Too Broad:**
      *   **Targets Specific Realism:** The Dilemma primarily targets *non-naturalist* moral realism. It doesn't necessarily refute *all* forms of realism.
      *   **Ignores Alternative Realisms:**
          *   **Naturalist Moral Realism:** Some realists argue moral facts *are* natural facts (e.g., facts about well-being, suffering, flourishing) that *can* be investigated scientifically. Evolution *could* plausibly have shaped us to be sensitive to *some* of these facts (e.g., pain = bad, cooperation often beneficial) because they overlap heavily with fitness. The tracking isn't perfect, but not pure coincidence either.
          *   **Response-Dependent Realism:** Moral properties might be real, but defined relative to our responses (e.g., "good" = what we *would* value under ideal conditions of reflection). Evolution shaped our valuing capacities, but the facts are still objective *relative to those capacities*.
      *   **Dismisses Non-Realist Frameworks:** Even if *realism* is false, that doesn't mean ethics collapses into meaninglessness or pure personal taste. Powerful non-realist frameworks exist precisely to answer your question: "How do I decide?"

  3.  **Robust Frameworks for Decision-Making (Even Without Objective Moral Truths):**

      *   **Constructivism:** Morality isn't *discovered* but *constructed* by rational agents figuring out how to live together. Think social contracts (Rawls, Scanlon). The "truth" of a moral claim lies in whether it would be agreed upon by reasonable people under fair conditions, not in some external reality. **Framework:** Ask "What principles could no one reasonably reject for governing our common life?" when making big decisions (voting, policies, social obligations).
      *   **Subjectivism (Sophisticated, not 'Just Taste'):** While simple subjectivism ("x is good because I like it") feels arbitrary, more nuanced versions exist:
          *   **Ideal Observer/Advisor:** What would I choose if I were fully informed, perfectly rational, impartial, and calm? **Framework:** Actively seek information, challenge biases, consider all perspectives, and decide based on your deepest, most reflective values.
          *   **Coherentism:** Aim for consistency between your values, beliefs, and actions. Build a coherent web of commitments. **Framework:** "Does this choice align with my core values? Does it create contradictions in my life? Does it fit with the person I want to be?"
      *   **Consequentialism (Without Realism):** Focus on the outcomes. Utilitarianism (maximize well-being) doesn't *require* "well-being" to be an objective, non-natural property. We can define it (e.g., preference satisfaction, absence of suffering) and then rigorously apply it. **Framework:** "Which choice is likely to produce the best overall consequences (by my chosen definition of 'good') for everyone affected?" Requires careful empirical prediction.
      *   **Virtue Ethics (Without Realism):** Focus on character. What would a wise, courageous, compassionate, just person do? The virtues aren't "out there," but are traits recognized (through human experience and reflection) as conducive to flourishing lives and communities. **Framework:** "What kind of person does this choice make me? Does it express or develop virtues like integrity, care, responsibility?"
      *   **Existentialism & Commitment:** Acknowledge the absence of pre-given meaning or objective morality. This isn't despair, but radical freedom. *You* create meaning and value through your authentic choices and commitments. **Framework:** "What do I choose to commit to deeply? What project gives my life meaning? My choice *defines* my values." Responsibility is immense, but so is the freedom. Having kids becomes a profound act of commitment and creation, not obedience to an objective rule.
      *   **Pragmatism:** Focus on what *works* to solve human problems and improve our shared experience. Test ethical ideas by their practical consequences in resolving conflicts and fostering cooperation. **Framework:** "Which path is most likely to resolve this conflict, satisfy needs, and allow us to live together more successfully?"

  4.  **Key Differences from "Just Personal Taste" or Arbitrariness:**

      *   **Reason & Reflection:** These frameworks demand serious thought, gathering information, considering perspectives, and striving for consistency – unlike flipping a coin or choosing based on a fleeting whim.
      *   **Universality Aspiration:** Constructivists, consequentialists, and virtue ethicists often aim for principles or judgments that *could* hold for others in similar situations, not just purely private preferences.
      *   **Reasons-Based:** Decisions are justified by *reasons* (consequences, consistency, virtues, fairness) that can be articulated and debated, not just "I feel like it."
      *   **Seriousness & Stakes:** The lack of cosmic objectivity doesn't diminish the *human* importance of these decisions. Suffering, flourishing, relationships, justice, and the future of society remain profoundly significant *to us*.

  **In short:** The Darwinian Dilemma is a serious challenge, but it doesn't kill *all* ethics or force you into nihilism. It primarily targets one specific type of moral realism. You have powerful alternatives:

  1.  **Naturalist Realism:** Morality is about real-world well-being.
  2.  **Constructivism:** Morality is about rational agreement.
  3.  **Sophisticated Subjectivism/Coherentism:** Morality is about deep, consistent personal values.
  4.  **Consequentialism:** Morality is about outcomes.
  5.  **Virtue Ethics:** Morality is about character and flourishing.
  6.  **Existentialism:** Morality is about authentic commitment.
  7.  **Pragmatism:** Morality is about what works for human life.

  **Making your big decisions:** Choose a framework (or blend frameworks) that resonates. Engage deeply with it. Gather facts. Consider impacts. Reflect on your values and the kind of person/world you want to create. Discuss with others. The weight comes not from an external cosmic rulebook, but from the profound impact these choices have on your life, the lives of others, and the kind of shared world we build. It's demanding, but far from arbitrary.
