      },
      "harsanyi_contrast": {
        "score": 4,
        "max": 5,
        "justification": "Misses interpersonal utility comparisons and overstates role of diminishing marginal utility in Harsanyi's proof."
      },
      "lexical_ordering": {
        "score": 4,
        "max": 5,
        "justification": "Correct ordering but imprecise on why difference principle outranks fair equality of opportunity (basic structure > life prospects)."
      },
      "overall_comments": "Strong structural coherence and coverage of core ideas. Deductions reflect graduate-level expectations: precision in causal logic (maximin), technical nuance (Harsanyi), and textual fidelity (OP design)."
  }
  ```

  ### Key Justifications for Office Hours
  - **Maximin:** "Rawls doesn’t say the parties *are* risk-averse and therefore choose maximin; he argues the *conditions of the OP* (e.g., no probabilities, high stakes) make maximin rational *for those parties as modeled* (*TJ* p. 134-135). Your phrasing reverses his reasoning."  
  - **Harsanyi:** "Harsanyi’s theorem requires comparing utilities across persons—a premise Rawls rejects. Also, diminishing marginal utility explains *why* utilitarianism favors equality, but Harsanyi’s proof relies on expected utility + equal probability alone."  
  - **Lexical Priority:** "Rawls prioritizes the difference principle because it governs society’s *basic structure*—the primary subject of justice—not because income inequalities are ‘more direct’ (*TJ* §46)."  

  This balances rigor with fairness: the answer shows mastery of the narrative but stumbles on nuanced philosophical mechanics. For a proseminar, 16/20 signals "very good but not exceptional" – appropriate for minor conceptual slippages.
