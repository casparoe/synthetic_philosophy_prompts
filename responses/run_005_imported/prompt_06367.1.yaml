  The user also wants the guard to have a strong rebuttal. The Mohists' response is effective because it demonstrates that in practical terms (like riding), the subclass is part of the class. The guard could use that or argue from common language usage. For example, even if "white horse" specifies color, it still implies it's a horse. So the ban on horses should include white horses.

  Additionally, the user might need the scene to be tense and humorous. The guard's frustration should build as Gongsun calmly presents his argument. The guard's rebuttals need to be sharp but accessible to readers. Maybe the guard uses practical examples, like pointing to the horse and asking what it is, forcing Gongsun to admit it's a horse despite his argument.

  I should also consider the historical context. The School of Names focused on semantics and logic, while Mohists were more practical. The guard, being a practical person, would rely on everyday understanding. Highlighting this clash adds depth to the scene.

