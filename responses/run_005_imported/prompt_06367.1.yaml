answer: |-
  You've nailed the core tension perfectly – Gongsun Long *is* performing a sophisticated semantic sleight-of-hand, precisely by exploiting the ambiguity between intension (meaning/concept), extension (the set of things it refers to), and identity. The "asking for a horse" argument is the heart of his rhetorical ploy, and its vulnerability is exactly where the guard (or later Mohists) can strike. Let's break it down:

  **Deconstructing Gongsun Long's Argument:**

  1.  **The Shape/Color Distinction (Intension):** "Horse" names the *shape/form* (形 *xing*). "White" names the *color* (色 *se*). These are distinct concepts. Therefore, "white horse" names a *combination* of color and shape, which is distinct from naming *just* the shape. *This part has logical merit, highlighting that compound terms have different intensions than their components.*
  2.  **The Request Argument (Slippery Slope to Extension):** This is where the equivocation happens.
      *   Premise 1: If you ask for a "horse" (馬 *ma*), any horse (yellow, black) satisfies the request. (Extension: The set of all horses).
      *   Premise 2: If you ask for a "white horse" (白馬 *baima*), only a white horse satisfies; a yellow horse does not. (Extension: The subset of white horses).
      *   Conclusion: Therefore, "horse" and "white horse" cannot be the same thing. If they were the same, *anything* satisfying "horse" would satisfy "white horse" (and vice versa). Since a yellow horse satisfies "horse" but not "white horse," they cannot be identical.

  **The Sleight of Hand:**

  *   **Equivocation on "Same" / "Is":** Gongsun Long is conflating:
      *   **Identity (A = B):** Are "horse" and "white horse" the exact same *term* or *concept*? Clearly not ("white horse" has an added descriptor).
      *   **Class Membership / Subsumption (A is a B):** Is a white horse *an instance of* the class "horse"? Absolutely yes.
      *   **Set Identity (Ext A = Ext B):** Is the *set* of all horses identical to the *set* of white horses? Absolutely not.
  *   **Shifting Ground:** He starts with the *intension* (meaning) of the *words* ("horse" names shape, "white" names color), but then slides into arguing about the *extension* (which actual objects satisfy requests using those words). The "request" scenario cleverly forces the listener to think about *extensions*.
  *   **Ignoring Subsumption:** He correctly points out that the *extensions* aren't identical (Set A ≠ Set B), but he *incorrectly* leaps from this to the conclusion that the *members* of Set B ("white horses") are therefore *not members* of Set A ("horses"). He uses the non-identity of the *sets* to deny the class membership of the *individuals* within the subset. This is the fatal flaw.

  **The Mohist Counterpunch ("Riding a white horse is riding a horse"):**

  This is **devastatingly effective** against Gongsun Long's specific *practical* claim in your border scenario. The Mohists (especially in the *Canons* and *Explanations*) focused on practical consequences and consistent application of terms.

  *   **The Counterargument:** "Riding a white horse is riding a horse" (乘白馬，乘馬也 *cheng baima, cheng ma ye*).
  *   **Why it Works:**
      1.  **Attacks the Practical Claim:** It directly addresses the implication Gongsun Long wants to draw: that a ban on "horses" crossing shouldn't apply to his "white horse" because it's "not a horse." The Mohist shows that *in the relevant practical context* (riding, crossing a border), the action performed *on* a white horse (riding) is *exactly* the action that the ban on "horses" is meant to prohibit.
      2.  **Reaffirms Class Membership:** It forces the focus back onto the *nature of the object* involved in the action. The object being ridden *is* a horse, regardless of its color.
      3.  **Highlights Contextual Meaning:** It demonstrates that the meaning of "horse" in the ban ("things of the equine shape that carry people/goods") inherently *includes* all subtypes like white horses. The color modifier specifies *which* horse, but doesn't remove it from the category.
      4.  **Exposes the Equivocation:** The Mohist uses "is" in the sense of class membership/subsumption ("is a") within a practical context, directly countering Gongsun Long's attempt to use set non-identity to deny class membership.

  **Could Gongsun Long Respond?**

  *   **Within his own framework:** He *might* try to double down on the separation of attributes. He could argue that "riding" is an action applied to the *shape* (horse), but the whiteness is a separate, accidental property not involved in the act of riding itself. Therefore, "riding" only concerns the "horse" aspect, and the "white" aspect is irrelevant. However, this feels weak and artificial.
  *   **He'd likely lose the practical argument:** The Mohist counter is specifically designed to defeat the *practical misuse* of his paradox. In the context of a border crossing ban, the guard (channeling the Mohist) has the stronger, common-sense position grounded in the *purpose* of the rule. Gongsun Long's logic, while fascinating semantic play, crumbles when faced with real-world consequence and consistent term application.

  **Writing Your Scene: Pressure Points for the Guard**

  Your instinct is spot-on. The guard shouldn't just say "that's stupid." He should be initially confused, then increasingly frustrated by the *feeling* that this guy is playing word games to cheat. Here's how he can push back effectively, drawing on the above:

  1.  **Initial Confusion/Simple Pushback:**
      *   "So... you're telling me *that* (points at the horse) isn't a horse? Look at it! Four legs, mane, tail, neighs – it's a horse!"
      *   "The order says 'no horses.' Your beast *is* a horse. Move along."
      *   "Are you saying if the order said 'no *white* horses,' your brown nag *could* cross? Fine. But it says 'no *horses*,' and yours *is* one!"

  2.  **After the "Request" Argument (Hitting the Extension Fallacy):**
      *   "Hold on! You're twisting words! Just because I might *want* a specific *type* of horse sometimes doesn't mean that type *isn't a horse*! A general asks for 'archers' – that doesn't mean his spearmen *aren't soldiers*! Your white horse is still a *kind* of horse!"
      *   "So what? If I ask for *water*, you wouldn't give me *wine* just because they're both drinks! That doesn't mean wine *isn't* a drink! Your white horse *is* a horse, even if it's not the *only* kind!"

  3.  **The Mohist Knockout Punch (The Perfect Guard Retort):**
      *   (After Gongsun finishes his spiel, the guard takes a deep breath, calms down slightly, and delivers this with deadly practicality) "Alright, scholar. Listen carefully. You say your 'white horse' isn't a 'horse.' Fine. Let's play your game. **If I ride your 'white horse'... am I riding a horse?** Yes or no?" (This forces the admission: Riding the white horse *is* riding a horse).
      *   "The King's order bans *horses* from crossing. Why? Because horses carry riders or goods. They eat fodder. They might kick or spread disease among the baggage train. **If your 'white horse' crosses, won't it be carrying you (or your goods)? Won't it need fodder? Couldn't it kick someone?** How is *any* of that different from a brown horse or a black horse? The ban is on *things that do what horses do*. Your white beast *does* what horses do. Therefore, it *is* banned. Now move, or I'll have you both detained for obstructing the King's orders." (This expands the Mohist point into the full practical rationale).

  4.  **Appeal to Common Sense/Authority:**
      *   "Enough! Every farmer, every soldier, every trader in the kingdom knows that thing is a horse! Are you saying the King's ministers, who wrote the order, are fools who don't know what a horse is? Or are *you* the fool playing games while armies march?"
      *   "Your wordplay might impress students in a dusty hall, but here at the border, where lives depend on clear orders, your 'white horse not a horse' is dangerous nonsense. That is a horse. It cannot cross. Final word."

  **Key for the Scene:**

  *   **Gongsun Long:** Should be calm, precise, almost pedantic. He believes utterly in the logical structure of his argument. He's not (necessarily) trying to be annoying; he's demonstrating a profound truth about language and reality.
  *   **The Guard:** Starts confused, gets flustered and angry as the argument twists words he knows the meaning of in his bones. His frustration peaks when he senses the cheating. His rebuttal (especially the Mohist-style point) should come from a place of regained control through sheer practicality and focus on the *consequence* of letting the horse cross. He wins by grounding the argument back in the real-world purpose of the rule.
  *   **Humor/Tension:** Comes from the clash between abstract, relentless logic and grounded, increasingly exasperated pragmatism. The guard's eyes should threaten to pop out, his grip on his spear tighten, while Gongsun remains unnervingly serene.

  By having the guard land the Mohist counterpunch ("Riding a white horse is riding a horse") or its practical equivalent, you give him a genuinely strong, historically plausible retort that exposes the core equivocation in Gongsun Long's clever but ultimately impractical argument. Good luck with the scene – it sounds fantastic!
