prompt: |-
  I'm taking a graduate course on cooperative game theory this term, and this week's lecture covered axiomatic bargaining theory: the Nash bargaining solution and its less famous rival, the Kalai–Smorodinsky (KS) solution. I can reproduce the formal machinery without much trouble — both solutions agree on Pareto efficiency, symmetry, and invariance to positive affine transformations of utility, and they part ways on exactly one further axiom: Nash's solution satisfies independence of irrelevant alternatives (IIA) but not individual monotonicity, while the KS solution satisfies individual monotonicity, defined in terms of the "ideal point," but not IIA. Given two nested feasible sets, I can even mechanically work out which solution shifts and which stays put. What I lack is any real intuition for why this trade-off exists in the first place. My professor mentioned in passing that there is a sense in which no solution satisfying the usual efficiency and symmetry requirements can have both properties simultaneously — she cited a 1977 paper by Alvin Roth, if I remember correctly — but she did not dwell on why the two axioms are actually in tension, and the textbook mostly just states and proves results without offering much motivation.

  Could you help me build that intuition? Specifically, I would like you to: (1) explain, geometrically and in your own words rather than by restating the formal definitions, what IIA and individual monotonicity each really demand of a bargaining solution as the feasible set is perturbed, and why satisfying one tends to put pressure on the other; (2) construct your own minimal example of two feasible bargaining sets, one contained in the other, for which the Nash and KS solutions respond differently to the expansion, and walk through why that happens; and (3) tell me which of the two axioms you find more normatively compelling as a requirement on a fair bargaining outcome, defending your answer with reference to a concrete situation — a wage negotiation or the division of a merger surplus, say — in which the two solutions would actually recommend different splits. I would much rather have your own worked-through reasoning than a summary of what is "standard" in the literature.
reasoning: |-
