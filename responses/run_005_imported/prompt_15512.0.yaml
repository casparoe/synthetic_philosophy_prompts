  Also, structural realism: mathematical structures survive theory changes. For example, equations in electromagnetism persisted despite mechanistic explanations changing. In cosmology, the Friedmann equations might endure even if dark energy's nature is redefined.

  The user might worry that dark matter/energy are placeholders like aether. But unlike aether, dark matter has multiple lines of evidence across scales. Still, the possibility remains that these concepts could be modified. Highlighting criteria like consilience (multiple independent evidence sources) and fecundity (generating new research) can help differentiate.

  I should address their fear of unearned skepticism. It's valid given their experience. Emphasize that skepticism is healthy but needs grounding. Point out differences: plate tectonics had a clear alternative mechanism in development, while dark matter has no equally successful competitor yet.

