answer: |-
  Your hesitation is not unearned skepticism; it's a profound insight honed by lived scientific history and philosophical reflection. Wegener's saga *is* a powerful cautionary tale: **core empirical observations can be robustly correct while the proposed explanatory mechanisms are profoundly wrong.** Distinguishing between these elements *in advance* is difficult, but philosophical frameworks and historical patterns offer principled ways to calibrate trust:

  1.  **Lakatos's "Research Programmes" & The Hard Core:**
      *   Philosopher Imre Lakatos viewed scientific theories as evolving "research programmes" with a **hard core** of fundamental assumptions protected by a **protective belt** of auxiliary hypotheses.
      *   *In Plate Tectonics:* The **hard core** was the undeniable empirical evidence: continental fit, fossil distributions, matching geological structures, seismic belts. This survived. Wegener's tidal/rotational mechanism was part of the initial, flawed **protective belt** – it was sacrificed to save the core.
      *   *In Cosmology (ΛCDM Model):*
          *   **Hard Core (Likely Robust):** The empirical phenomena demanding explanation: galactic rotation curves (flat, not Keplerian), gravitational lensing exceeding visible mass, CMB power spectrum features, large-scale structure formation, accelerating cosmic expansion (supernovae data). *Something* is causing these gravitational effects and expansion dynamics.
          *   **Protective Belt (More Vulnerable):** The *specific nature* of dark matter (WIMPs, axions, MOND/MOG alternatives?) and dark energy (cosmological constant? Quintessence? Modified gravity?). These are hypotheses constructed to explain the hard core observations within the current theoretical framework (General Relativity + Standard Model).

  2.  **Structural Realism: What Survives is Structure:**
      *   This view argues that while specific *ontological* claims (like "dark matter is a cloud of WIMPs") may be discarded, the *mathematical structure* and *relationships* captured by successful theories often persist.
      *   *In Geophysics:* The *structure* of plate boundaries, the relationship between seismicity and margin type, the age-depth relationship of oceanic crust – these structures survived, even as the driving mechanism shifted from tides to mantle convection.
      *   *In Cosmology:* The ΛCDM model provides an incredibly successful *mathematical structure* for describing cosmic evolution and large-scale observations. Even if the specific entities "dark matter particle" or "dark energy field" are replaced, the *functional relationships* describing gravitational effects beyond baryonic matter and accelerated expansion (e.g., the Friedmann equations with specific terms) are likely to find counterparts in any future theory that explains the same data.

  3.  **Criteria for Assessing Vulnerability:**
      *   **Consilience of Evidence:** How many *independent* lines of evidence point to the phenomenon? Continental drift had geology, paleontology, geomorphology. Dark matter has galactic dynamics, galaxy clusters (via various methods), CMB, lensing. Dark energy has supernovae, BAO, CMB integrated. **High consilience strongly supports the *existence of the phenomenon* (the hard core), less so the *specific mechanism*.**
      *   **Fecundity:** Does the concept generate successful novel predictions and guide fruitful research? Plate tectonics exploded with predictions (seafloor spreading rates, hotspot tracks, subduction zone volcanism). ΛCDM successfully predicted detailed CMB fluctuation patterns and large-scale structure statistics. **High fecundity suggests the core framework is capturing something real, even if details are wrong.**
      *   **Ad-hocness vs. Necessity:** Was the concept introduced *solely* to save a failing theory (more vulnerable), or did it emerge as the *necessary consequence* of interpreting robust new data (more robust)? Dark matter emerged from interpreting galactic rotation (Zwicky, Rubin/Ford) – data impossible to ignore. Dark energy emerged directly from supernovae observations. They weren't initially invoked to fix GR; GR + Standard Model *lacked* components to explain the data. **This suggests necessity, not mere ad-hocness.**
      *   **Direct vs. Indirect Evidence:** Phenomena inferred solely through complex chains of theoretical interpretation are inherently more vulnerable than those with direct probes. We *see* continents move via GPS. We *see* the gravitational *effects* attributed to dark matter but haven't directly detected the particle/non-particle cause. **Indirect evidence, while powerful, leaves more room for reinterpretation.**
      *   **Existence of Viable Alternatives:** Are there compelling, well-developed alternative frameworks explaining *all* the data as well or better? In Wegener's time, permanentism was failing catastrophically. For ΛCDM, alternatives like MOND/MOG explain *some* galactic dynamics but struggle *severely* with galaxy clusters and the CMB without invoking *some* form of additional matter/energy. **The lack of a comprehensive, equally empirically successful alternative *currently* bolsters ΛCDM's core claims, but doesn't guarantee them.**

  **Applying this to Dark Matter/Energy:**

  *   **Trust (Cautiously) the Phenomena:** The evidence for *something* causing excess gravity (dark matter) and accelerated expansion (dark energy) is overwhelming and consilient, like the evidence for continental motion. This is the "hard core." It's extremely unlikely future cosmology will declare "Nothing unusual is happening; we misinterpreted everything."
  *   **Hesitate on the Specifics:** The *precise nature* of dark matter (a specific particle? multiple particles? primordial black holes?) and dark energy (a true constant? a dynamic field? a modification of gravity on cosmic scales?) is firmly in the "protective belt." These are the current best explanations within GR + Standard Model, but they could be replaced, just as convection replaced tides.
  *   **Key Difference from Wegener's Mechanism:** Wegener's mechanism was *physically implausible* from the start (Jeffreys' calculations showed tidal forces were orders of magnitude too weak). Current dark matter/energy hypotheses, while elusive, are *not* physically implausible within our best fundamental theories; they are consistent, just experimentally challenging. The problem is *finding* them, not their theoretical possibility.

  **Conclusion:**

  Your hesitation is wisdom, not unearned skepticism. It stems from understanding that science progresses by preserving robust empirical structures while constantly revising explanatory mechanisms. **Calibrate your trust thusly:**

  1.  **High Trust:** The *existence of gravitational phenomena* unexplained by known baryonic matter (Dark Matter's "hard core"). The *fact of cosmic acceleration* (Dark Energy's "hard core"). The mathematical *structure* of ΛCDM that successfully describes a vast array of cosmological data.
  2.  **Lower Trust / Active Skepticism:** The *specific candidate particles* for dark matter (WIMPs, axions, etc.) or the *exact nature* of dark energy as a cosmological constant. These are the current "protective belt" hypotheses most vulnerable to replacement in a future paradigm.

  You lived through the triumph of a hard core (continents move) and the discarding of a flawed mechanism (tidal forces). Cosmology today likely faces a similar evolution: the phenomena of dark matter and dark energy are probably here to stay as descriptions of reality, but their ultimate explanation may be as different from today's ΛCDM specifics as mantle convection was from Wegener's tides. Your skepticism is a valuable reminder that even our most successful theories are works in progress.
