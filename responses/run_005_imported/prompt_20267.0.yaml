  Second, the whole edifice relies on empirical speculation about multiverses and correlated agents. Kant would recoil at grounding morality in cosmological conjectures. The categorical imperative must work for a solitary rational agent on a desert island. 

  Third, and most damningly, ECL reduces moral reasoning to expected value calculation. For Kant, that's like building ethics on quicksand—it makes morality contingent on consequences rather than the intrinsic rightness of the will's maxim. 

  But I shouldn't be uncharitable to ECL. The user might appreciate acknowledging where Kant *would* nod in recognition: the anti-parochialism, the formal universality, the rejection of "my values first" tribalism. Still, these similarities only make the foundational differences more poignant. 

