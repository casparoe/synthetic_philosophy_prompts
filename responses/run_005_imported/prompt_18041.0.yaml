answer: |-
  Here’s a toast that honors Danny’s journey, centers family belonging beyond legal status, and holds Marisol in the light without spectacle. It’s structured for warmth, humor, and quiet philosophical resonance:

  **(Clink glass gently)**  
  "Alright, settle down, you hooligans. For those who don’t know me, I’m Danny’s infinitely more charming sibling – and the one they trusted with a microphone, which tells you everything about this family’s judgment.  

  Danny, eleven years. *Eleven years* of paperwork, waiting rooms that felt like time loops, and civic exams asking things like ‘Name one war fought by the United States in the 1800s’ – to which you apparently *didn’t* answer, ‘The War on My Patience.’ And finally, next week, you get sworn in. You’ve joked that this is the day you ‘finally count.’ And Danny, we get it. We hear the relief. We see the weight lifting. After eleven years of jumping through hoops that keep moving, you’ve earned every ounce of that feeling. Tonight, we celebrate *you* – your grit, your stubbornness, and that slightly alarming grin you get when bureaucracy finally bends. This is your night, brother. Savor it.  

  **(Pause, shift tone slightly - warmer, more reflective)**  
  But ‘counting’? In this family? Please. If ‘counting’ required paperwork, half of us wouldn’t have made it past the ’86 reunion when Uncle Frank tried to grill squid. Our membership cards aren’t laminated by Homeland Security; they’re written in spaghetti sauce stains on Nonna’s tablecloth, argued over during Monopoly marathons where Danny *still* tries to charge rent on Baltic Avenue even after he’s landed on it, and whispered in the ‘are you okay?’ texts sent at 2 AM. We’ve always been a slightly chaotic, fiercely loud, ‘more the merrier as long as you do the dishes’ kind of tribe.  

  **(Turn slightly, natural glance towards Marisol, inclusive smile)**  
  Marisol, you walked into this circus when you were, what, eight? Wearing those dinosaur sneakers you refused to take off? You didn’t need an application. You just *were* ours. From stealing Danny’s comic books to teaching him how to actually dance at cousin Rosa’s wedding – proving some things can’t be learned from a civics test – you claimed your seat at this messy, wonderful table years ago. Just like Danny did. Just like we all did.  

  **(Turn back to Danny, focus softens)**  
  So Danny, when you stand up there next week and take that oath, it’s monumental. It’s the law catching up to what you’ve built here. It’s a door finally swinging open after a long hallway. It matters. Deeply. We are so incredibly proud of you, and so thrilled for the peace it brings you. But it doesn’t *create* your place here. That was forged long ago – in shared Christmases, in helping Mom move that ridiculously heavy sofa, in being the guy who always shows up, paperwork or not. This ceremony? It’s a recognition, a hard-won key. But your belonging? That was never in doubt. Not for a second.  

  **(Raise glass higher, encompassing the room)**  
  So here’s to Danny! To eleven years of perseverance, to the profound relief of being seen, and to the incredible future that’s always been yours. And here’s to *us* – this gloriously imperfect, stubbornly loving family. To the belonging we build every day, simply by showing up for each other. No application required.  

  **To Danny, and to family – wherever, and however, we find it!**  
  **(Clink!)**

  ---

  **How This Meets Your Requirements & The Philosophy (Silently):**

  1.  **Honors Danny's Journey & Relief:** Explicitly names the 11 years, the relief, the significance of the ceremony ("law catching up," "hard-won key"). Uses his "finally counts" line but immediately reframes it within the family context. The celebration is squarely focused on his achievement and peace.
  2.  **Centers Family Belonging Beyond Law:** The core metaphor is family belonging as pre-existing and independent of legal recognition ("Membership cards... written in spaghetti sauce," "didn't need an application. You just *were* ours"). This directly addresses the "claim to belong doesn’t wait on a claim to a ballot" (Abizadeh/all-subjected principle). Belonging is built through shared life, care, and presence ("showing up").
  3.  **Includes Marisol Naturally:** She's woven into the *positive* narrative of how family belonging works ("walked into this circus," "claimed your seat"). The reference is specific (dinosaur sneakers, comic books, dancing) and affectionate, showing her active participation and integration. She's an *example* of the principle, not an *exception* or object lesson.
  4.  **Avoids Exclusion/Implied Hierarchy:** The toast clearly separates the *legal recognition* Danny earned (worthy of celebration) from the *inherent belonging* everyone shares ("It doesn’t *create* your place here... That was never in doubt"). The "line the law drew" is acknowledged as significant for Danny, but explicitly *not* the line that defines family ("wherever, and however, we find it").
  5.  **No Jargon, Warm & Funny:** Uses family-specific humor (Uncle Frank's squid, Monopoly, Danny's dancing, Nonna's tablecloth, Mom's sofa). Tone is affectionate and celebratory. No theory names mentioned.
  6.  **Philosophical Moves (For Your Eyes):**
      *   **Reframing "Counting":** Addresses Danny's phrase to immediately challenge the idea that legal status defines worth/belonging (countering the potential exclusion).
      *   **Concrete Practices of Belonging:** Illustrates Goodin's "all-affected interests" implicitly – the people deeply affected by family life *are* its members, regardless of formal status (shared meals, support, memories).
      *   **Pre-existing Belonging vs. Legal Recognition:** The core argument. Belonging ("all-subjected" to the shared life of the family) exists prior to and independently of state recognition (Dahl/Whelan's boundary problem acknowledged by showing the family's boundary is set by practice, not legal procedure). The state's act is important for Danny's relationship *to the state*, not his place in the family.
      *   **The Marisol Moment:** Demonstrates the "all-subjected" principle in action – her lifelong participation and the family's unconditional embrace show her de facto membership, making any *de jure* exclusion irrelevant to her belonging *here*.
      *   **The Closing Line:** "Wherever, and however, we find it" – encapsulates the idea that belonging transcends state boundaries and procedures, a quiet nod against unilateral state control (Abizadeh) and towards a more expansive understanding.
  7.  **Glass-Raising Close:** "To Danny, and to family – wherever, and however, we find it!" is inclusive, celebratory, and meaningful for everyone present. It centers Danny while encompassing the broader, unchanging value of family belonging.

  This toast lets Danny shine, validates his hard-won achievement, and surrounds that celebration with the unshakeable truth of a family whose love and belonging operate on a different, deeper, and more inclusive map.
