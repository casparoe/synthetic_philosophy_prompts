prompt: |-
  Okay this is gonna sound niche but our philosophy club at school has been stuck on this for like two weeks now lol. We started with a video on the Doomsday Argument and fell down a rabbit hole into "anthropic reasoning," and now I sort of get that there's two competing principles people use, the self-sampling assumption (SSA) and the self-indication assumption (SIA), but every explanation I find online just states the two definitions and moves on, nobody actually shows them fighting it out. Could you write me a dialogue between two philosophers who each firmly hold one of the views, set around Bostrom's "presumptuous philosopher" thought experiment — the one where physicists are about to run a really expensive experiment to figure out which of two theories about the universe is true (one where there's way more observers total than the other), and this philosopher guy barges in saying the experiment is pointless because anthropic reasoning already tells him which theory is almost certainly correct?

  I want the SSA person to really go after the SIA person for that move, since it seems kind of insane that you could out-reason an actual physics experiment from your armchair using nothing but the fact that you exist. But then I want the SIA person to hit back hard with whatever weird stuff SSA has to bite the bullet on instead (I think its got something to do with reference classes being kind of arbitrary, and maybe the Doomsday Argument itself?). Neither one should just cave or be a strawman, they should actually respond to each others specific points, and its fine if one of them admits their own view has a weird consequence too as long as they still defend it. If it fits naturally, have them bring up the Sleeping Beauty problem at some point too, since I keep seeing people say its connected to this whole fight but never seen anyone actually spell out how. Doesn't need to end with a clear winner — pretty sure real philosophers haven't actually settled this either.
