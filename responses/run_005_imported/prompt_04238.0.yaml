  Alright, let me try to unpack this. So the user is a retired geophysicist who worked on seismic hazard mapping. At a reunion, two colleagues, Marta and Owen, had an argument about how to report the 30-year rupture probability for the Kestrel Ridge fault. 

  First, Marta wants to use only the four dated ruptures from trenching that specific fault. The mean recurrence interval is between 400-900 years with wide error bars. She argues that this is the only data directly about this fault. Owen disagrees, saying that four points are too few and lead to uselessly wide intervals. He suggests folding this fault into a regional model with similar faults to get a tighter estimate. 

