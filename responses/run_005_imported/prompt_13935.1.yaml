  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```
  S = most philosophically defensible, D = basically unfounded hand-waving. doesnt need to be balanced across tiers, just curious where you'd actually put each one
