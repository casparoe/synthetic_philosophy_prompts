  Okay, let me unpack this fascinating question. The user is drawing a sophisticated parallel between Keynes' critique of his own Bloomsbury group's interpretation of G.E. Moore and modern effective altruism (EA). They've noticed EA seems to embody the "other half" of Moore that Bloomsbury discarded - the impartial welfare calculation part. 

  The user's core tension is whether the older, wiser 1938 Keynes would see EA as finally implementing Moore's full vision (which his younger self failed to do) or as perpetuating the very "purposiveness" he wanted future generations to overcome. They specifically reject simplistic "art vs utility" dichotomies, wanting a nuanced take acknowledging both movements' shared Moorean roots.

  Hmm, I need to consider several layers here. First, Moore's dual ethical pillars: 1) intrinsic goods (states of mind like beauty/love) and 2) impartial duty to maximize total good. Bloomsbury took #1 as license for aesthetic individualism; EA takes #2 as mandate for rigorous altruism. 

  Then there's Keynes' evolution: the 1930 essay warns that solving material needs won't automatically bring wisdom about living well, while the 1938 memoir regrets how Bloomsbury's selective Mooreanism led to ethical carelessness. 

  For the hypothetical dialogue... I imagine Keynes would have mixed feelings about EA. He'd admire its seriousness about duty (unlike his younger self) but worry it's repeating the same reductionism Bloomsbury did - just swapping aestheticism for utilitarianism. His critique wouldn't be "EA is too calculating" but "you're still missing half of Moore's picture." 

  The earning-to-give question is particularly sharp. Keynes saw money-making as a necessary but pathological instinct to outgrow; EA rationalizes it as altruistic tool. He might say this instrumentalizes both wealth and the self, postponing the "good life" question indefinitely. 

  Key insight: Both movements suffer from Moore's unbridgeable gap between personal goods and impersonal duty. Bloomsbury ignored duty; EA minimizes personal goods. Neither solved how to integrate them - which is exactly what troubled Keynes in 1938.
answer: |-
  That's a brilliant connection – and a genuinely thorny hypothetical. Sitting the 1938 Keynes (post-"Grandchildren," post-"My Early Beliefs," chastened by experience and war) across from a contemporary EA would be fascinating. Here's a plausible reconstruction of his response, wrestling with the duality you identified:

  1.  **Initial Recognition & Grudging Respect for Rigor:**
      *   "Ah, the other half of Moore! Finally, someone took that wretched *duty* part seriously. We treated it like an embarrassing appendix to the real business of personal states. You lot seem to have swallowed it whole, bones and all. I see the machinery: the impartiality, the aggregation, the relentless calculation of consequences. It's... admirably rigorous, in a way we Bloomsberries could never be bothered with. We were too busy enjoying beautiful states to *count* them properly. You've built an entire ethical engine from Moore's neglected blueprints. There's a certain... intellectual integrity to that."

  2.  **The Critique of "Purposiveness" Reborn:**
      *   "But this! This 'earning-to-give'! This is precisely the disease I hoped my grandchildren might be spared! Not greed for *oneself*, no, but greed *transmuted* – the same restless, instrumentalizing drive, the same subjugation of the present to an imagined future payoff, the same quantification of the unquantifiable (human experience! aesthetic value! a life well-lived!) into your QALYs and DALYs and expected utility functions."
      *   "In my 'Grandchildren' essay, I worried about the 'purposive man' who could never rest, who saw life only as a means to an end. You haven't abolished that type; you've merely redirected his purpose from personal accumulation to impersonal accumulation *for others*. The *instrumentalization* remains. The individual life – its capacity for direct appreciation of beauty, for spontaneous affection, for *leisure* in the true sense (not idleness, but freedom for intrinsically valuable pursuits) – is still sacrificed on the altar of a distant, calculated 'greater good'."
      *   "You speak of 'billions of future lives'. Moore's calculus, taken to this extreme, becomes a kind of *tyranny of the future and the abstract*. It risks crushing the delicate, concrete, *present* goods he also valued – the very states of mind we threw away *duty* for, and which you seem in danger of throwing away for *scale*."

  3.  **The "Good Life" and Moore's Missing Synthesis:**
      *   "My fundamental critique, learned through painful experience, is that both halves of Moore – taken alone – are inadequate and potentially dangerous. We Bloomsbury fetishized the personal state to the point of ethical fecklessness. You, it seems, fetishize the impersonal calculus to the point of potentially impoverishing the very *content* of the 'good' you seek to maximize."
      *   "Where is the *synthesis*? Moore implied both were necessary: the intrinsic value of certain states *and* the duty to promote them impartially. We ignored the duty; you risk ignoring the qualitative nature of the states themselves, reducing 'good' to a homogeneous, measurable quantity. Can a billion QALYs, even if achieved, truly constitute the 'good life' if the lives lived are devoid of the richness of experience Moore placed at the heart of intrinsic value?"
      *   "My hope in 'Grandchildren' wasn't just for material abundance, but for the *wisdom* to use that abundance to cultivate lives rich in the things Moore deemed intrinsically valuable: personal affections, aesthetic appreciation, the pursuit of knowledge for its own sake. Your 'effective altruism', in its most zealous earning-to-give or longtermist forms, seems to postpone that cultivation indefinitely in the name of maximizing a future potential. It's a perpetual motion machine of purposiveness."

  4.  **The Final Judgment - A Haunting Echo:**
      *   "So, do I recognize the family resemblance? Absolutely. You are the specter of the half of Moore we rejected, fully realized and armed with computational power we couldn't dream of. Do I grudgingly respect the rigor? Yes. It has a cold, hard logic ours lacked."
      *   "But do I think you've resurrected the disease? In a crucial way, *yes*. You haven't cured the 'economic problem' of purposiveness; you've found a way to make it *eternal* and *morally justified*. You've taken the pathological instinct for instrumental accumulation and given it the most unimpeachable target imaginable: the welfare of others, quantified to the nth degree. In doing so, you risk perpetuating the very state of deferred life – the neglect of present, intrinsic goods in favor of a calculated future – that I hoped humanity could one day overcome. You are not immoralists, as we were; but in your relentless optimization for a distant, abstracted good, you might become *something* equally devoid of the full, rich, qualitatively good life Moore envisioned. You have the rigor we lacked, but you seem to share our failure to fully integrate *both* halves of his imperfect, yet profound, vision."

  **In essence:** Keynes 1938 would see EA as the rigorous, duty-bound half of Moore that Bloomsbury abandoned, finally actualized. He'd respect its intellectual seriousness but see its core practices (like earning-to-give) as the *perpetuation*, not the cure, of the pathological "purposiveness" he diagnosed. His core critique wouldn't be "cold vs. warm" but that EA, like Bloomsbury, fails to integrate Moore's *whole* picture – prioritizing either personal states *or* impersonal duty/calculation, but struggling to synthesize them into a vision of the "good life" that honors both intrinsic value *and* impartial welfare *in the present moment*. EA solves Bloomsbury's problem of irresponsibility but falls into the opposite trap of potentially joyless instrumentalization, deferring the very "good life" it seeks to enable.
