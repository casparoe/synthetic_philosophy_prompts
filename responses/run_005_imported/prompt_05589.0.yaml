  The core idea of ECL is that in a large enough universe/multiverse, there may be many agents whose decisions are correlated with ours (due to similar decision processes, common information, etc.) even if we cannot causally influence them or observe them. Because of this correlation, our decision acts as evidence about what those agents decide. Therefore, we should act in a way that takes into account the values of these correlated agents (i.e., compromise) because if we choose a selfish option, that is evidence that they also choose selfishly, leading to bad outcomes for everyone.

