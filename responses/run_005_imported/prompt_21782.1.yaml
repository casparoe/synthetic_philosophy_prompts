prompt: |-
  I'm reporting a piece on the "right not to know" in genetic testing — the well-documented fact that most people at risk for Huntington's, for instance, choose not to take the test even when it's free, accurate, and takes about an afternoon. While I was talking it through with a friend of mine who's an actual decision theorist (not just a rationalist-blog dabbler), he waved the whole phenomenon away by invoking Good's theorem on the value of information: a rational Bayesian who's about to make a decision should never turn down a costless chance to learn more first, since doing so can only weakly help, never hurt, in expectation. In his view the decliners aren't making some defensible values-based call, they're just being irrational, and the theorem isn't ambiguous about it.

  That answer bugged me, but "ignorance is bliss" obviously wasn't gonna cut it as a comeback against someone quoting an actual theorem at me, so I want to come back better armed. Can you build the most rigorous case you can for the position that Good's theorem does NOT actually convict the decliners of irrationality — that you can accept the theorem completely and still think declining is the rational choice for plenty of these people? Don't give me the hand-wavy version, get into the actual guts of the proof: what its assuming about the decision problem and the action set staying fixed before and after you look, what "costless" is quietly doing there, and whether the classic "you can always just ignore the new evidence and act as you would have anyway" defense of the theorem survives once you allow that simply knowing something (dread, an altered sense of your own future, whatever) can itself be part of what a person values, apart from any action it changes. This is for a sidebar aimed at readers who already know some decision theory, so no need to dumb it down for my sake.
reasoning: |-
  Okay, the user is writing a piece on the "right not to know" in genetic testing, specifically about why people decline tests like Huntington's despite them being free and accurate. Their friend, a decision theorist, dismissed this using Good's theorem, arguing that rational Bayesians should always seek more information. The user wants a rigorous counterargument that accepts Good's theorem but still justifies declining as rational.

  First, I need to recall Good's theorem. It states that for a rational Bayesian, more information is never harmful in expectation when it's free and precedes a decision. But the user mentioned that people decline tests even when they're costless. So the key is to find where the theorem's assumptions don't hold in real-life scenarios.

  The user wants me to dig into the proof's assumptions. The theorem assumes a fixed decision problem, fixed action set, and that utility is only affected by actions and outcomes, not the information state itself. But in genetic testing, knowing the result can change your psychological state. For example, knowing you have Huntington's might cause dread, which affects your well-being regardless of actions taken. That means utility isn't state-independent anymore. If the utility function includes psychological states, then the theorem's assumption that information only affects beliefs, not utilities, is violated.

  Another point is the action set. The theorem assumes the same actions are available before and after information. But maybe after a positive result, some options are no longer viable. For instance, the choice to live in hopeful ignorance disappears once you know. If that state has high utility, losing it could make declining rational. The user's friend argued that you can always ignore the information, but ignoring isn't the same as not knowing. The bliss of ignorance is a state that can't be reclaimed once you know.

  Costless information is another angle. The theorem says "costless," but psychological costs aren't zero. Anxiety while waiting for results, or distress from knowing, are costs. Even if the test is free, these emotional costs make it not truly costless. So the theorem's "costless" might only refer to monetary costs, overlooking emotional ones.

  Also, the theorem requires that the information precedes a decision. But what if the decision is already made? If someone decides they won't change their actions regardless of the test result, then the information has no instrumental value. Good's theorem only applies when the information can influence a decision. If actions won't change, then the value of information is zero, and avoiding psychological harm becomes rational.

  The user mentioned readers who know decision theory, so I should reference utility functions, state-dependence, and action sets. Highlighting how the theorem's assumptions don't hold in cases where knowledge itself affects utility. Using examples like dread or altered future sense makes it concrete. Also, distinguishing between instrumental value of information and its direct impact on well-being.

  I need to structure the arguments clearly: utility functions including psychological states, the loss of the ignorance option, psychological costs, and no decision to make. Emphasize that accepting Good's theorem doesn't mean declining is irrational because the real-world scenario violates its premises. Conclude that rational agents can decline when the information's non-instrumental disutility outweighs its decision-making value.
answer: |-
  Here's the most rigorous case that Good's Theorem (GT) *doesn't* convict decliners of irrationality, dissecting its assumptions and their failure in the genetic testing context. We accept GT's validity within its strict domain but show its assumptions are systematically violated here.

  **Core Argument:** Good's Theorem proves that *instrumentally rational* information acquisition weakly dominates refusal *only when* information solely updates beliefs relevant to a *fixed* decision problem with *state-independent utility*. Genetic testing fundamentally violates the "state-independent utility" and often the "fixed decision problem" assumptions. Knowledge itself directly alters the agent's experiential state, which is a core component of their utility function.

  **Dissecting Good's Theorem & Its Assumptions:**

  1.  **The Theorem (Simplified):** For a rational Bayesian agent facing a choice between actions `A = {a1, a2, ..., an}` leading to outcomes in states `S = {s1, s2, ..., sm}`, with prior beliefs `P(s)`, and a utility function `U(a, s)` defined over action-state pairs, acquiring costless information `X` (which provides evidence about `S`) *before* choosing an action `a ∈ A` has non-negative Expected Value of Information (EVOI). Formally: `E[ max_a E[U(a, s) | X] ] >= max_a E[U(a, s)]`. Refusing `X` cannot yield higher expected utility than acquiring it.

  2.  **Critical Assumptions Underpinning GT:**
      *   **Fixed Action Set (A):** The set of available actions `A` is identical before and after acquiring `X`.
      *   **Fixed State Space (S):** The possible states of the world `S` remain the same.
      *   **State-Independent Utility (U(a, s)):** Utility depends *only* on the chosen action `a` and the realized state `s`. Crucially, the *knowledge* of `s` itself does not directly impact utility. `U` is defined over outcomes, not over the agent's epistemic state.
      *   **Costless Information:** Acquiring `X` has no direct cost (time, money, discomfort).
      *   **Information Precedes Action:** `X` is acquired *before* the final action choice `a` is made, and `a` can be chosen conditional on `X`.
      *   **Instrumental Rationality:** The agent's *only* goal is to maximize expected utility over outcomes defined by `(a, s)`.

  **Why Genetic Testing Violates These Assumptions (The Rigorous Defense):**

  1.  **Violation of State-Independent Utility (The Core Issue):**
      *   **The Problem:** In GT, `U(a, s)` is a function of `a` and `s`, *not* of the agent's *belief* about `s` or their *knowledge* of `s`. Knowing `s` (e.g., "I carry the Huntington's mutation") is not itself a state `s` or an outcome of `(a, s)`; it's meta-information *about* `s`.
      *   **The Reality for Decliners:** For many, the *knowledge state* itself directly impacts well-being. Knowing one is mutation-positive (`s = mutation+`) intrinsically generates dread, anxiety, or a profound alteration in one's perception of the future. This is distinct from the *eventual outcome* (developing symptoms). The utility derived from life experiences *between now and symptom onset* (or even *if* onset never occurs) is directly diminished by the *knowledge* of the mutation status. Formally:
          *   Let `K` be the agent's knowledge state (`K = knows+`, `K = knows-`, `K = ignorant`).
          *   The true utility function is `U(a, s, K)`.
          *   For a decliner, `U(a, mutation+, ignorant) > U(a, mutation+, knows+)` for many `a` and potentially all `a`. The state `(a, mutation+)` combined with `K = knows+` yields lower utility than the *same* `(a, mutation+)` combined with `K = ignorant`.
      *   **Why "Ignoring" Doesn't Work:** The standard defense ("you can always ignore the info and act as if ignorant") fails fundamentally here. *Knowing* `s` forces `K = knows+` or `K = knows-`. You *cannot* revert to `K = ignorant` after learning. The utility derived from actions is now evaluated under a different `K`. Acting *as if* ignorant (`a = a_ignorant`) while *knowing* the truth (`K = knows+`) likely yields `U(a_ignorant, mutation+, knows+) << U(a_ignorant, mutation+, ignorant)`. The bliss *is* the ignorance state (`K = ignorant`). GT assumes `U` is invariant to `K`, which is false in this case.

  2.  **Violation of Fixed Action Set (A):**
      *   **The Problem:** GT assumes the actions available (`A`) don't change based on acquiring `X`.
      *   **The Reality for Decliners:** The option "Live life without definitive genetic knowledge" (`a_ignorance`) is a distinct action/state highly valued by decliners. Acquiring `X` irrevocably *destroys* this action/state. After testing, `a_ignorance` is simply *unavailable*. The post-information action set `A_post` = `{a1, a2, ..., an}` *excludes* `a_ignorance`, while the pre-information action set `A_pre` *includes* `a_ignorance` (choosing not to test *is* choosing `a_ignorance`).
      *   **Consequence:** GT's comparison is invalid. It compares `max_{a ∈ A} E[U|X]` to `max_{a ∈ A} E[U]`. But the decliner compares `max_{a ∈ A_post} E[U(a, s, K=knows)]` to `E[U(a_ignorance, s, K=ignorant)]`. If `U(a_ignorance, s, K=ignorant)` is sufficiently high *across possible `s`*, it can dominate the expected utility of the best action available *after* knowledge, even considering the potential instrumental benefits of knowing `s` for choosing other `a`. GT doesn't model the elimination of a valued option.

  3.  **Violation of Truly "Costless" Information:**
      *   **The Problem:** GT assumes zero cost. Monetary cost is covered ("free"), but costs are broader.
      *   **The Reality for Decliners:**
          *   **Anticipatory Anxiety:** The testing *process* (waiting for results) often induces significant distress, even if the result is negative. This is a direct utility cost during the waiting period.
          *   **Psychological Burden of Knowing:** As argued in (1), knowing `s+` imposes an ongoing psychological burden, a direct negative utility flow starting immediately upon receipt of the information, independent of future actions or outcomes. This is a cost *of having the information*, not just of the outcomes it predicts.
      *   **Consequence:** GT's `EVOI = E[ max_a E[U|X] ] - max_a E[U]` needs to be reduced by the *direct cost of acquisition* `C_acq` (anxiety during wait) and potentially by the *expected cost of knowing* `E[C_know]` (e.g., `P(s+) * Disutility_of_knowing+ + P(s-) * Disutility_of_knowing-` - though `Disutility_of_knowing-` is often small or negative). If `EVOI - C_acq - E[C_know] < 0`, refusal is rational. GT assumes `C_acq = E[C_know] = 0`.

  4.  **Violation of "Information Precedes Action" / No Instrumental Value:**
      *   **The Problem:** GT's benefit comes *only* from allowing better action choices (`a`).
      *   **The Reality for Decliners:** Many individuals at risk for Huntington's have *already decided* on their major life plans (e.g., "I will have children," "I will pursue this career," "I will live fully regardless"). Crucially, **they would not change these plans based on the test result.** For them, there is no significant `a` conditional on `X` to be chosen. The information has minimal or zero *instrumental* value (`EVOI ≈ 0`).
      *   **Consequence:** When `EVOI ≈ 0`, the comparison reduces to `E[U | Know]` vs. `E[U | Ignorant]`, where `U` includes `K` as argued in (1). If the direct experiential utility of `K = ignorant` is higher than the *expected* experiential utility of knowing (`P(s+)U(K=knows+) + P(s-)U(K=knows-)`), even by a small amount, refusal is strictly preferred. GT relies on information improving decisions to generate value; absent decisions to change, only the direct utility of knowledge matters.

  **Synthesis: The Rational Decliner's Calculation:**

  A fully rational Bayesian decliner (accepting GT's math but rejecting its assumptions for their case) could reason as follows:

  1.  **Acknowledge Instrumental Value (IF it exists):** "If this information would cause me to make significantly different, beneficial life choices, that's a point in favor of testing. However..."
  2.  **Assess Fixed Actions/No Instrumental Value:** "...I have already settled my major life plans (children, career, insurance, relationships) and *will not change them* based on the result. The information offers me little to no *instrumental* benefit (`EVOI ≈ 0`)."
  3.  **Value the Ignorance State:** "...Living without this definitive knowledge (`K = ignorant`) is a state I highly value. It allows me hope, reduces daily anxiety about the future, and lets me focus on living now. Formally, `U(any a, any s, K=ignorant) > U(same a, same s, K=knows)` for the states `s` that matter most, and likely in expectation."
  4.  **Recognize Loss of Option:** "...Taking the test destroys my ability to choose the 'live in hopeful ignorance' state (`a_ignorance`). After testing, that option is gone forever."
  5.  **Account for All Costs:** "...Even if the test is free, the waiting period causes distress (`C_acq > 0`). Furthermore, knowing a positive result (`K=knows+`) would inflict an immediate and ongoing psychological burden (`C_know+ >> 0`), while even a negative result (`K=knows-`) might bring less relief than the peace of mind I currently have in ignorance (`U(K=knows-) < U(K=ignorant)`)."
  6.  **Conclusion:** "Therefore, the *net* expected utility of testing: `[E[U | Know] - C_acq]` is significantly *less* than the expected utility of remaining ignorant `E[U | Ignorant]`. Good's Theorem is correct *if* utility depended only on actions and final outcomes, and *if* my action set stayed the same, and *if* knowing didn't hurt. But it does depend, it doesn't stay the same, and it does hurt. Refusal maximizes my expected utility."

  **In essence:** Good's Theorem proves the value of information *for decision-making*. It does not prove the value of information *for direct experience*. When information has low decision-making value *and* high direct experiential costs (including the destruction of a valued state of ignorance), a rational agent refuses it. The decliners aren't violating Bayesian decision theory; they are accurately applying it with a utility function that accounts for the intrinsic cost of knowing and the value of their current epistemic state. Your friend's application of GT ignores the state-dependence of utility inherent in the phenomenology of genetic risk.
