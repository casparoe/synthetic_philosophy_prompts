  Penrose's argument relies on the assumption that humans can know the soundness of their reasoning. But Gödel’s theorems apply here too. A system proving its own soundness would be inconsistent. So, Penrose faces a similar issue: humans can't prove the soundness of their own entire reasoning system from within. The problem isn't solved; it's shifted to a different property.

