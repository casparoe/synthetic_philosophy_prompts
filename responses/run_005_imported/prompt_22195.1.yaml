answer: |-
  That's an incredibly sharp debate, and your friend raises a classic counterpoint. Anscombe's argument against Truman hinges on a **fundamental distinction concerning *intention* and the *means* used**, pushing the Doctrine of Double Effect (DDE) to its limits and arguing that the atomic bombings crossed a bright line. Here's a breakdown comparing DDE and Anscombe's specific critique:

  **The Doctrine of Double Effect (DDE) - Standard Just War Application to Bombing:**

  1.  **The Act Itself Must Be Good or Neutral:** Bombing a legitimate military target (e.g., a factory producing war materiel, a key railway junction supplying troops, a naval base) is considered a morally permissible act in wartime.
  2.  **Intention Must Be Good:** The bomber's *intention* must be to achieve the military objective (destroy the target).
  3.  **Bad Effect Not Intended as Means or End:** The foreseen death of civilians nearby is *not* part of the intention. It is neither the *end* (goal) nor the chosen *means* to achieve the goal. The death of civilians is a *foreseen but unintended side-effect*.
  4.  **Proportionality:** The good effect (achieving the military objective) must be proportional to, and sufficiently weighty to justify, the foreseen bad effect (civilian deaths). Indiscriminate bombing failing this test would be immoral even under DDE.
  5.  **Distinction (Foresight vs. Intention):** DDE relies heavily on the moral difference between *foreseeing* an outcome and *intending* it. Foreseeing civilian deaths as collateral damage is tragic but potentially permissible; intending their deaths is murder.

  **Anscombe's Argument Against Truman & the Atomic Bombs:**

  Anscombe argued that the atomic bombings of Hiroshima and Nagasaki **failed the third criterion of DDE catastrophically.** She contended that the civilian deaths were not merely foreseen; they were *intended as the very means* to achieve the goal. Here's why:

  1.  **The Primary Target Was the Civilian Population/City Itself:** While there were military installations in both cities, the *chosen weapon* and *targeting strategy* made the destruction of the entire urban area and its inhabitants the primary mechanism of action. The atomic bomb's unique power was its ability to annihilate a city wholesale, creating unprecedented devastation.
  2.  **Civilians as the Means to an End:** The *purpose* of destroying the cities and killing civilians was to terrorize the Japanese government and population into immediate surrender. The civilian deaths weren't an unfortunate byproduct of attacking a specific military target; they were the *instrument* chosen to apply maximum psychological pressure. The destruction *of the city and its people* was the *method* for achieving surrender.
  3.  **Intention vs. Foresight Collapses:** Anscombe argued that in this case, foreseeing the deaths *was* intending them, because the deaths were the necessary and chosen mechanism for the desired outcome (surrender). You cannot intend to use the city's destruction to force surrender without intending the deaths that constitute that destruction.
  4.  **Rejection of "Collateral Damage":** Because the civilian deaths were the *means*, not a side-effect, Anscombe rejected labeling them as "collateral damage" justified under DDE. She saw it as the deliberate targeting of non-combatants for a strategic purpose – the definition of murder in wartime.
  5.  **Absolutist Stance on Intention:** Anscombe held a strong, almost absolutist view that *intentionally* killing the innocent is *always* murder and intrinsically evil, regardless of consequences. DDE provides a narrow path for *foreseen but unintended* deaths; Anscombe argued Truman stepped off that path entirely by making the deaths intentional and instrumental.

  **Addressing Your Friend's Counterpoint ("Every bombing campaign killed civilians"):**

  Your friend is right that civilian deaths occurred in many WWII bombing campaigns, some arguably failing the proportionality or discrimination tests of DDE (e.g., the firebombing of Tokyo or Dresden). Anscombe would likely condemn those too if she believed civilians were *intentionally targeted* as the primary means to an end (terror). However, her specific fury at Truman stemmed from:

  1.  **The Uniquely Instrumental Nature:** The A-bomb made the *total annihilation of a city and its people* the singular, instantaneous act designed to coerce surrender. It wasn't "collateral damage" from hitting a factory; the factory destruction *was* collateral to the city's erasure.
  2.  **The Scale and Finality:** The sheer scale of instantaneous death (tens of thousands vaporized in moments) and the unique, apocalyptic nature of the weapon intensified the moral horror and underscored the deliberate choice to inflict maximum civilian destruction.
  3.  **The Context:** The bombs were dropped *after* Japan was militarily defeated (navy destroyed, cities firebombed, blockade effective, Soviets about to invade) and while surrender feelers were being explored (though disputed). To Anscombe, this made the intentional mass killing of civilians even less justifiable as a "necessary" means.

  **Why Her Reasoning is Different from Standard DDE Excuses:**

  *   **Standard DDE:** "We bombed the factory *intending* to destroy war production. We *foresaw* workers living nearby would die, but we didn't *intend* their deaths; we wish they weren't there. Their deaths are a tragic side-effect."
  *   **Anscombe on Truman:** "You *intended* to destroy the entire city and kill its inhabitants *because* you believed the terror and shock of that mass slaughter would force surrender. The deaths *were* your chosen weapon. That is murder."

  **Your Challenge: The Nuance of Intention**

  The hardest part, as you found, is proving *intention* beyond doubt. Truman and his advisors always framed the goal as ending the war quickly to save lives. They argued the bombs targeted military installations. Anscombe countered that the *way* the bombs were used revealed the true intention: mass civilian destruction was the mechanism. Historians still debate this intention.

  **Key Takeaway for Your Argument:**

  Anscombe's core point is that **DDE cannot excuse an action where the foreseen evil (mass civilian death) is not just a side-effect, but is deliberately *used as the instrument* to achieve the good end.** She argued the atomic bombings were a paradigm case of this forbidden instrumentalization of innocent lives, making it murder, not tragic collateral damage. The unique nature of the weapon and the targeting strategy made the civilian population the *primary object* of the attack for strategic effect, violating the absolute prohibition on intentionally killing the innocent. Her absolutism on this point is what sets her apart from more consequentialist or flexible interpretations of DDE applied to other bombings.
