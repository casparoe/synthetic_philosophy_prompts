  I should structure the toast to start with a light-hearted anecdote about the sister and her partner. Introduce the 'quus' joke by comparing vows to a rule that could be misinterpreted. Then transition to how promises are kept through practice, not just words. Highlight the community's role in supporting the couple. End with a heartfelt conclusion, tying back to love and commitment.

