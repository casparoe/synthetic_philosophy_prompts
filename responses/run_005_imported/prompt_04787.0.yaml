answer: |-
  Here are 8 focused questions targeting key pressure points, each with a follow-up anticipating her likely emphasis on moral understanding vs. mere true belief:

  1.  **Question (Moral Education):** Pessimism seems to clash with the necessity and apparent legitimacy of early moral education. Children *routinely* acquire foundational moral beliefs ("hitting is wrong," "sharing is good") solely through parental testimony long before they grasp the underlying reasons. Doesn't this demonstrate that moral testimony *can* confer justified moral belief, at least in developmental stages, forming the bedrock for later understanding?  
      *   **Likely Reply:** She'll argue this testimony provides necessary *starting points* or *rules of thumb*, but not genuinely *justified moral belief* in the robust sense; the child merely parrots without understanding. True justification/knowledge comes later via internalization of reasons.
      *   **Follow-up (Testing Understanding vs. Justification):** If the child's belief "hitting is wrong" is *true* and reliably formed via trustworthy testimony (even if not understood), why isn't it at least *prima facie* justified? Isn't insisting it only becomes justified *later* via understanding conceding that testimony provides the crucial true belief, and the understanding merely adds a *further epistemic virtue* (like grasping causes in science), rather than being essential for justification itself?

  2.  **Question (Asymmetry - Expertise):** In empirical domains like medicine or climate science, we readily accept expert testimony as grounds for justified belief and knowledge. Why is ethics fundamentally different? If we trust a doctor's diagnosis based on complex expertise we lack, why can't we trust a moral philosopher's verdict on complex deontological reasoning we haven't fully worked through?  
      *   **Likely Reply:** She'll argue that empirical testimony delivers *propositional knowledge* (that X causes Y), while moral testimony aims to deliver *practical knowledge* (what *to do*), which requires internal endorsement of reasons to motivate action correctly. Deferring in ethics bypasses the essential link between belief and motivation/reason.
      *   **Follow-up (Action & True Belief):** But if I defer to a trusted moral expert, acquire the true belief "Action A is wrong," and *because* I believe it's wrong, I refrain from A, haven't I acted morally correctly? If the belief is true and causes the right action, what essential component is *actually missing* compared to acting on my own reasoning? Isn't the "internal grasp" requirement potentially demanding *over-intellectualization* of moral action?

  3.  **Question (Asymmetry - Urgency):** Consider someone facing an immediate, high-stakes moral dilemma with no time for reflection (e.g., a medic choosing which wounded soldier to prioritize under fire). They defer instantly to a more experienced comrade's snap judgment ("Treat B first!"). Did they act wrongly? Did they gain *nothing* epistemically valuable by deferring?  
      *   **Likely Reply:** She might concede they acted *permissibly* or even *admirably* by seeking the best available input under duress, but still insist they lacked *moral understanding* of why B was the right choice. Their action wasn't *fully* virtuous as it wasn't done *from* their own grasp of the reasons.
      *   **Follow-up (Conceding Too Much?):** If you concede the action was permissible/admirable and likely correct *because* they acquired a true belief via testimony under those constraints, doesn't this show testimony *did* provide significant moral improvement (correct action) and at least *some* epistemic justification (the true belief guiding action)? Doesn't this undermine the *strongest* pessimist claim that testimony provides "no real moral improvement"?

  4.  **Question (Aesthetic Testimony Parallel):** Pessimism about moral testimony is often compared to pessimism about aesthetic testimony (e.g., "This painting is beautiful" based solely on a critic's word). Critics of *aesthetic* pessimism argue it leads to an implausible elitism or skepticism. Does the parallel strengthen or weaken your case for *moral* pessimism? If you defend moral pessimism but reject aesthetic pessimism (or vice versa), how do you justify the asymmetry?  
      *   **Likely Reply:** She might argue the parallels are strong and defend pessimism in both domains, or argue morals involve *obligation* and *action* in a way aesthetics doesn't, making understanding more crucial for ethics. She'll likely emphasize the *practical* nature of moral judgments.
      *   **Follow-up (Understanding vs. Appreciation):** In aesthetics, pessimists often argue testimony can't give you the *experience* of beauty. You analogize this to the need for grasping moral *reasons*. But couldn't one argue that testimony gives the *belief* "this is beautiful" (or "this is wrong"), and while it doesn't provide the *appreciation* (aesthetic experience) or *understanding* (grasp of reasons), the *belief itself* is still justified true belief? Is the core pessimist move simply defining "knowledge" or "justified belief" in each domain to *require* the experiential/understanding component, thereby making the thesis true by stipulation?

  5.  **Question (The Scope of "Understanding"):** You emphasize moral understanding. How minimal can this understanding be while still satisfying the pessimist's requirement? Does it require grasping the *ultimate* justifying reasons, or is a partial, inchoate, or even metaphorical grasp sufficient (e.g., a child understanding "hitting hurts" as a reason, even if they can't articulate Kantian principles)?  
      *   **Likely Reply:** She'll likely set a moderate bar – requiring some genuine, non-parroted appreciation of *relevant* normative features, even if not philosophically sophisticated. The key is that the agent connects the verdict to *some* reason they endorse.
      *   **Follow-up (Testimony as Catalyst):** If understanding requires connecting the verdict to reasons the agent *already* grasps and endorses, couldn't moral testimony often *serve as the catalyst* for developing that very understanding? E.g., "Why is that wrong?" "Because it causes unnecessary suffering." Couldn't this testimony *directly* provide the link between the verdict and the reason, thereby *generating* understanding, rather than bypassing it? Doesn't this make testimony *instrumental* to acquiring understanding?

  6.  **Question (Moral Testimony in Complex Societies):** Modern life constantly requires us to act on matters involving complex, specialized moral considerations (e.g., effective altruism calculations, bioethics, institutional justice). Isn't pessimism practically debilitating here? Must every individual reason from first principles about factory farming or AI alignment? Doesn't responsible action in complex domains *require* relying on the moral testimony of those with relevant expertise?  
      *   **Likely Reply:** She'll argue this highlights the importance of *developing* one's own understanding through engagement with arguments and experts, not blind deference. We can use testimony to identify *candidates* for belief, which we then must vet/understand. Blind deference remains problematic.
      *   **Follow-up (The Epistemic Burden):** If the non-expert must "vet" the expert's moral testimony by understanding the reasons, doesn't this place an unrealistic epistemic burden on individuals facing complex issues? If I can only *truly* believe the expert after replicating their understanding (which may require years of study), haven't you functionally eliminated the possibility of justified moral belief on complex issues for non-experts, leading to a form of moral skepticism precisely where guidance is most needed?

  7.  **Question (The Value of True Moral Belief):** Suppose pessimism is correct that testimony cannot confer moral understanding. Does it follow that acquiring a *true moral belief* via testimony is epistemically worthless or unjustified? Couldn't it still be instrumentally valuable (guiding action correctly) and even constitute *knowledge* (justified true belief) if we accept a less demanding conception of justification (e.g., reliabilism about testimony generally)?  
      *   **Likely Reply:** She'll argue that in the *moral* domain specifically, mere true belief without understanding lacks the requisite connection to agency and motivation to count as *moral* knowledge or to support *virtuous* action. It might be "factual" knowledge *that* X is wrong, but not the practical knowledge *of* why it's wrong needed for moral action.
      *   **Follow-up (Splitting Knowledge):** If we grant that testimony can give me *factual* knowledge *that* "X is wrong" (justified true belief), but not *practical moral knowledge* (involving understanding), haven't you conceded the core optimist claim that testimony *can* yield justified moral belief/knowledge? Isn't the dispute now just about *labeling* (whether to call it "full" moral knowledge) rather than about whether testimony provides a significant epistemic and practical good? What *substantive work* is the stronger "moral knowledge" concept doing here?

  8.  **Question (Pessimism & Moral Progress):** Historically, moral progress often occurred because individuals or groups accepted the moral testimony of reformers challenging prevailing norms (e.g., abolitionists testifying to the wrongness of slavery to those embedded in it). Doesn't pessimism imply that the hearers in such cases couldn't gain justified belief *until* they independently grasped the reformers' reasons – potentially delaying progress? Doesn't this underestimate the role of testimony in *initiating* the process of understanding?  
      *   **Likely Reply:** She'll argue that the reformers' testimony was crucial for *prompting* reflection and challenging faulty reasoning, but genuine belief change required the audience to eventually grasp the reasons themselves (e.g., the humanity of the enslaved). The testimony sparked the process but didn't complete it.
      *   **Follow-up (The Status of the Spark):** During the period *between* hearing the challenging testimony and achieving full understanding, what is the epistemic status of the hearer's nascent belief? If they start doubting the old norm and leaning towards the reformer's view based on *trust* in the reformer's sincerity and insight, even before full comprehension, isn't this nascent belief *pro tanto* justified by the testimony? Doesn't pessimism struggle to account for this crucial, dynamic, *testimony-driven* phase of moral change?

  **Key Strategy for Follow-ups:** The core tension is between her distinction and the optimist's claim that testimony *can* provide justified moral belief/knowledge *simpliciter*. The follow-ups repeatedly press:
  *   **Does testimony provide *justified true belief*?** If yes, optimists win on the core epistemic claim, even if understanding is a further good.
  *   **Is the "understanding" requirement doing unique work, or is it an ad hoc addition for morals?** Why isn't understanding similarly required for empirical knowledge to be "full"?
  *   **Does conceding the practical/permissibility value of testimony undercut the strong pessimist claim?** If testimony reliably leads to right action, what exactly is deficient?
  *   **Is the distinction merely semantic?** Does defining "moral knowledge" to *require* understanding make the thesis true by definition but philosophically uninteresting?

  These questions force her to defend the *necessity* and *unique importance* of understanding for justification/knowledge *in the moral domain specifically*, and to clarify whether pessimism denies testimony provides *any* epistemic good (like justified true belief) or just denies it provides the *highest* epistemic good (understanding). Good luck with the interview!
