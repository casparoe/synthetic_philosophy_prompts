prompt: |-
  I'm currently taking a course on decision theory, and something that happened with my trivia team a few weeks ago has been bothering me ever since, even though I can't quite articulate what is wrong with it. At a charity trivia night, our team won the right to choose between two prizes: a guaranteed $100 gift card, or a sealed envelope carrying an 89% chance of that same $100 card, a 10% chance of a $500 card, and a 1% chance of winning nothing. We chose the guaranteed card without much deliberation, since giving up a certain $100 for a chance at $400 more felt too risky, particularly given the small but real chance of walking away empty-handed. A couple of weeks later, an unrelated society on campus ran a $5 raffle in which entrants could buy a ticket offering an 11% chance of winning a $100 card and an 89% chance of winning nothing, or, at the identical price, a ticket offering a 10% chance of a $500 card and a 90% chance of winning nothing. With no certain option available in either case, our group went straight for the ticket with the shot at $500.

  Over dinner, my roommate, who is in the same course, pointed out that the two decisions share exactly the same underlying structure, and that favoring the safe option in the first case while favoring the long shot in the second cannot both be justified by any single, consistent way of valuing money - on her view, one of the two choices has to be a mistake. I can follow the reasoning she laid out, but it still does not feel to me as though we did anything wrong at either event: giving up something guaranteed seemed like a genuinely different kind of decision from choosing between two uncertain outcomes. Was my roommate right that we contradicted ourselves, or is there a principled basis on which a fully rational person could have made exactly the choices we did in both situations?
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is in a decision theory course and is confused about two seemingly contradictory choices their trivia team made. First, they chose a guaranteed $100 gift card over a risky envelope with a chance at $500. Then, in a raffle, they picked a ticket with a 10% chance at $500 over one with an 11% chance at $100. The roommate says these choices are inconsistent under any consistent utility function. The user feels the decisions were different but can't articulate why.

  First, I need to recall expected utility theory. It says rational decisions should maximize expected utility based on probabilities and outcomes. So for the first scenario, the guaranteed $100 has an expected utility (EU) of 100. The envelope has EU = (0.89 * 100) + (0.10 * 500) + (0.01 * 0) = 89 + 50 = 139. So 139 > 100, meaning the risky option has higher EU. But the team chose the safe option, showing risk aversion.

  Now the raffle: Option A is 11% chance at $100 (EU = 0.11 * 100 = 11). Option B is 10% chance at $500 (EU = 0.11 * 100 = 50). 50 > 11, so choosing B has higher EU. But here they picked the riskier option. The roommate points out that in both cases, the team avoided the option with the higher chance of getting $100. In the first choice, they picked the safe $100 over the envelope which had an 89% chance of $100 plus upside. In the raffle, they picked the 10% chance at $500 over the 11% chance at $100, which has a higher probability of winning something. So the inconsistency is that in the first case, they preferred the certainty of $100, but in the second, they preferred the lower probability of a win but higher payout, which seems risk-seeking.

  The user's feeling is that the first decision had a guaranteed option while the second didn't, making them psychologically different. But from a decision theory perspective, the roommate is correct that any utility function should be consistent. If they're risk-averse in the first choice, they should also prefer the safer raffle ticket (11% chance at $100) over the riskier one (10% at $500). But they didn't.

  So why did they choose differently? Prospect theory might explain this. People value gains and losses relative to a reference point. In the first scenario, the reference point is $0. The guaranteed $100 is a sure gain, while the envelope is a risk. Loss aversion makes the 1% chance of nothing feel worse, leading to risk aversion. In the raffle, both options are gains relative to paying $5 for a ticket. Here, the reference point is losing $5. Since both have high chances of nothing, the small difference in probability (11% vs 10%) is overlooked for the much higher reward ($500 vs $100), making them risk-seeking.

  Also, the certainty effect: people overvalue certain outcomes. In the first choice, the guaranteed $100 is overvalued compared to the 89% chance. In the raffle, no certainty, so they focus on potential high rewards.

  So the user's choices can be explained by prospect theory. The roommate is technically correct under expected utility theory, but real human behavior often deviates due to psychological factors. Therefore, while inconsistent under strict EU, the choices make sense under behavioral models like prospect theory.
answer: |-
  Your roommate is technically correct that your choices are inconsistent under **classical expected utility theory (EUT)**, which assumes a single, stable utility function for money. However, your intuition that the decisions "feel" different is also valid—and explained by **prospect theory**, a Nobel Prize-winning behavioral model. Here’s a principled breakdown:

  ### 1. **The Inconsistency Under Expected Utility Theory**
     - **First Decision (Guaranteed vs. Risky):**
       - Guaranteed option: **$100** (Utility = *U*($100))
       - Risky envelope:  
         - 89% chance of $100 → *U*($100)  
         - 10% chance of $500 → *U*($500)  
         - 1% chance of $0 → *U*($0)  
       - Expected utility (EU) of envelope:  
         `0.89·*U*($100) + 0.10·*U*($500) + 0.01·*U*($0)`  
       - Choosing the guaranteed $100 implies:  
         `*U*($100) > 0.89·*U*($100) + 0.10·*U*($500) + 0.01·*U*($0)`  
         **Simplified**: `0.11·*U*($100) > 0.10·*U*($500) + 0.01·*U*($0)`  

     - **Second Decision (Two Risky Options):**
       - Ticket A: 11% chance of $100 → EU = `0.11·*U*($100)`  
       - Ticket B: 10% chance of $500 → EU = `0.10·*U*($500)`  
       - Choosing Ticket B (10% chance of $500) implies:  
         `0.10·*U*($500) > 0.11·*U*($100)`  

     - **Contradiction:**  
       From the first choice, `0.11·*U*($100) > 0.10·*U*($500)`.  
       From the second choice, `0.10·*U*($500) > 0.11·*U*($100)`.  
       These inequalities **cannot both be true** for any utility function *U*(·).  

     Under EUT, one choice must be "wrong." But this assumes:
     - Utility is linear or concave (risk-averse).
     - People value absolute outcomes, not changes.
     - Probabilities are weighted objectively.

  ### 2. **Why Your Choices Feel Rational: Prospect Theory**
  Prospect theory (Kahneman & Tversky, 1979) explains your intuition. It posits that people:
  - **Evaluate outcomes relative to a reference point** (e.g., "current wealth" vs. "potential gain/loss").
  - **Overweight small probabilities** and **underweight moderate/large probabilities**.
  - **Are loss-averse** (losses hurt more than equivalent gains).

  #### Applying Prospect Theory to Your Decisions:
  - **First Scenario ("Gain Frame"):**
    - Reference point: **$0** (walking away with nothing).
    - Guaranteed $100 is a **certain gain**.  
      → People *overweight certainty* ("certainty effect"). The 1% chance of $0 feels disproportionately scary due to loss aversion.  
    - Result: **Risk aversion** dominates. Sacrificing a sure $100 for risk feels reckless, even with a higher expected value ($139 vs. $100).

  - **Second Scenario ("Mixed/Lottery Frame"):**
    - Reference point: **-$5** (you already paid for the ticket). Both options are *risky gains* relative to this loss.  
    - No certainty effect: Neither option is safe.  
    - The 10% chance of $500 vs. 11% chance of $100 triggers **probability weighting**:  
      - People overweight tiny probabilities (e.g., 0.1% chance of a jackpot). Here, 10% and 11% are both "small chances," so their weights are similar.  
      - The **high payoff ($500) becomes attractive** because:  
        `Weight(10%) · *v*($500) > Weight(11%) · *v*($100)`,  
        where *v*(·) is the subjective value function (concave for gains, but the high reward compensates).  
    - Result: **Risk-seeking** for large gains when certainty is absent.

  ### 3. **A Principled Defense: Reference Dependence**
  A fully rational person *could* make your choices if:
  - Their utility function is **reference-dependent** (e.g., evaluates outcomes relative to context).
  - They exhibit **diminishing sensitivity**: The difference between $0 and $100 feels larger than between $100 and $500 when avoiding a loss, but the reverse holds when chasing a gain.

  #### Formal Prospect Theory Valuation:
  | Scenario              | Guaranteed $100 | Envelope (89% $100, 10% $500, 1% $0) |
  |-----------------------|------------------|---------------------------------------|
  | **Value (V)**         | *v*($100)       | *w*(0.89)·*v*($100) + *w*(0.10)·*v*($500) + *w*(0.01)·*v*($0) |

  | Raffle Option         | Ticket A (11% $100) | Ticket B (10% $500) |
  |-----------------------|---------------------|---------------------|
  | **Value (V)**         | *w*(0.11)·*v*($100)| *w*(0.10)·*v*($500)|

  Where:
  - *v*($x) = *x*^α (α < 1, e.g., α=0.88), making $500 feel less than 5× better than $100.
  - *w*(p) is a probability weighting function (e.g., *w*(p) = p^γ / (p^γ + (1−p)^γ)^(1/γ), γ < 1), which overweights small p and underweights moderate p.

  **Your choices are consistent if:**
  1. In Scenario 1: *v*($100) > *w*(0.89)·*v*($100) + *w*(0.10)·*v*($500) + *w*(0.01)·*v*($0)  
     (driven by high *w*(0.01) for the loss and certainty effect).
  2. In Scenario 2: *w*(0.10)·*v*($500) > *w*(0.11)·*v*($100)  
     (driven by near-linear weighting of 10% vs. 11% and salient $500 reward).

  ---

  ### Conclusion
  - **Roommate's view**: Correct under **classical EUT**. Your choices are mathematically inconsistent if money has a stable utility.  
  - **Your intuition**: Defensible under **prospect theory**. The presence of a guaranteed option in the first scenario (exploiting the *certainty effect* and *loss aversion*) versus two risky gambles in the second (where *probability weighting* favors the high-stakes option) creates distinct psychological contexts.  

  **Verdict**: You didn’t make a "mistake"—you exhibited normal human behavior. While inconsistent in a rigid economic model, your choices are rational within a descriptively accurate framework of how people *actually* evaluate risk. Prospect theory exists precisely to explain why "giving up certainty" feels categorically different from "choosing among risks." If this intrigues you, explore Kahneman & Tversky’s work—it’s decision theory’s answer to real-world complexity.
