  Owen correctly identifies the structural similarity in Le Verrier's IBE for both Neptune and Vulcan, and the "bad lot" concern is philosophically valid. However, he oversimplifies by treating both inferences as epistemically symmetric when contextual factors (like predictive precision) were materially different *before* outcomes were known. The core worry is genuine but overstated in this historical framing.

  **2 (Marta's objection):** Score 2 (clearly right)  
  Marta correctly identifies a critical asymmetry: Neptune's prediction was precise, testable, and immediately verifiable (Galle found it within 1°), while Vulcan relied on vague, unreproducible observations. This difference was empirically available *contemporaneously*—not just in hindsight—undermining Owen's symmetry argument. Historical evidence supports her (e.g., Vulcan's ad hoc adjustments to Mercury's perihelion were contentious even among proponents).

  **3 (Owen's reply):** Score -1 (mostly mistaken)  
  Owen wrongly frames predictive testing and explanatory virtue as mutually exclusive. While hypothetico-deductive confirmation *was* crucial for Neptune, predictive precision itself stems from explanatory virtues (e.g., Neptune’s orbit fit seamlessly into Newtonian mechanics, unifying Uranus’s anomalies). Dismissing this as "not IBE" artificially isolates explanation from testability, ignoring how predictive power *contributes* to explanatory goodness.

  **4 (Marta's answer):** Score 2 (clearly right)  
  Marta correctly argues that novel predictions are integral to explanatory strength—not separate from it. A hypothesis that generates precise, testable predictions (like Neptune) inherently demonstrates greater coherence, unification, and empirical adequacy than one that doesn’t (like Vulcan). Owen’s attempted separation *does* presuppose his conclusion by defining "genuine confirmation" narrowly, excluding core explanatory merits.

  **What both overlook:**  
  Both debaters implicitly treat IBE as a monolithic method, neglecting that explanatory "goodness" is a multidimensional criterion (simplicity, scope, predictive power, etc.) whose weighting depends on context; the Neptune-Vulcan contrast shows how predictive risk *enhances* explanatory virtue, rather than being external to it.
