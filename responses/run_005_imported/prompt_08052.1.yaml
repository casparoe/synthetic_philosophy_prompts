answer: |-
  Here’s a draft that engages Tolstoy’s argument head-on, respects its radical challenge, acknowledges the discomfort, and offers a way forward for artists without softening his critique. It runs approximately 10-12 minutes.

  **(Begin Draft)**

  Good morning, Ashworth Class of [Year], esteemed faculty, proud families, and honored guests. It’s a profound privilege to stand before you today.

  Now, graduation speeches often reach for comforting certainties: *Follow your passion! Trust your voice! The world needs your art!* And it does. But today, I want to offer something less comfortable, perhaps more useful, drawn from a text that has haunted me: Leo Tolstoy’s late, fiery, and deeply unsettling treatise, *"What Is Art?"* Written not by the young lion of *War and Peace*, but by the old prophet raging against the world – and himself.

  Most mentions of Tolstoy at graduations focus on the beard, the walking stick, the moral crisis, the renunciation of wealth. We skip the argument. *That* feels too dangerous. Because Tolstoy, applying ruthless logic to his own life’s work, arrives at a conclusion that should unsettle every artist in this room, and certainly unsettles me standing before you.

  He dismisses *everything* we typically celebrate in art schools. Beauty? A dangerous distraction, often masking emptiness. Technical virtuosity? Potentially just elaborate gymnastics, signifying nothing profound. Novelty, irony, deliberate complexity? For Tolstoy, these are often hallmarks of "upper-class art" – art designed not to unite, but to flatter a tiny elite, to signal membership in a club that excludes the many. He calls Beethoven’s Ninth a "sincere" attempt at art that ultimately fails. He walked out of Wagner’s *Siegfried* calling it counterfeit. And most devastatingly, he applied his own standard to his titanic novels, *War and Peace* and *Anna Karenina*, and declared them... largely *bad art*. Art that failed his ultimate test.

  **What was that test?** Tolstoy called it "infection." Not disease, but communion. For him, *true* art has nothing to do with pleasing critics or displaying skill. Its sole value lies in this: *Does the artist genuinely feel a specific emotion or insight, and have they, through line, sound, color, movement, or word, transmitted that feeling directly to another person, infecting them with it?* And crucially, does this shared feeling *bind* people together across divides of class, education, or culture, rather than reinforcing the private tastes of a privileged few?

  By this standard – "infection" leading to shared feeling and unity – a simple folk song sung sincerely about loss, or a child’s drawing expressing pure joy, could be greater art than the most technically dazzling symphony or conceptually dense installation, if those fail to transmit genuine, unifying feeling to a broad audience. Tolstoy elevates raw, accessible emotional transmission above all else. He saw much of the "great art" of his day, including his own earlier work, as a kind of sophisticated fraud, serving only to entertain or impress an in-crowd while leaving the vast majority of humanity untouched, or worse, alienated.

  **Let that sink in.** Imagine the sheer, terrifying strangeness, the almost inhuman intellectual honesty, of Leo Tolstoy – *Tolstoy!* – using *War and Peace* and *Anna Karenina*, undisputed landmarks of human creativity, as *evidence against himself*. He wasn't performing humility. He was dismantling his own legacy with the crowbar of a principle he believed was more important than his own fame. He saw in his masterpieces, despite their genius, traces of that "upper-class" art – the complexity, the irony, the focus on psychological nuance accessible mainly to the educated – that he now condemned as a barrier to true, universal infection.

  **So, why bring this wrecking ball to your graduation?** Why cast Tolstoy’s harsh, self-lacerating light onto your senior shows, your recitals, your portfolios – work born of years of sweat, doubt, and undeniable technical growth?

  Because his challenge, however extreme, cuts to the heart of why art *matters*, especially now. It forces us beyond the safe harbor of craft. Ashworth has given you formidable tools: how to control your voice, shape a phrase, mix a color, build a character, strike a chord, mold a form. You have honed perception and skill to a fine edge. Tolstoy doesn’t invalidate that training; he asks the terrifying question: *What will you do with it?*

  Will your hard-won technique serve primarily to impress other initiates? To create intricate puzzles decipherable only by a few? To chase a beauty defined by a narrow slice of the world? Or will it become a transparent vessel – a *conduit* – for something urgent, genuine, and deeply felt within you, aimed squarely at the task of making another human heart resonate in unison with your own? Will your art strive to infect, to connect, to bind?

  **This is not a call for simplistic art.** Sincerity isn't sentimentality. Complexity isn't inherently elitist. But Tolstoy demands we interrogate the *purpose* of that complexity, the *target* of our craft. Is the difficulty a necessary part of transmitting a complex, genuine feeling? Or is it a barrier, a badge of exclusivity? Is the beauty we chase a shared human experience, or a rarefied aesthetic code? Does our irony build understanding or merely enforce detachment?

  **I see some of you shifting uncomfortably.** Good. If Tolstoy’s standard doesn't make you at least a little uneasy about *something* you’ve created or admired, you haven’t understood him. His criteria *are* punishing. They might make you look at aspects of your own work, or work you love, and wince. He forces us to confront a brutal question: Is our art serving a unifying human purpose, or is it reinforcing invisible walls?

  **So, does this mean your training was wasted? Absolutely not.** Tolstoy wasn't against skill; he was against skill *without* infectious feeling, skill in service of separation. Your training at Ashworth hasn't just given you techniques; it’s given you *languages*. Languages of sound, sight, movement, word. Languages powerful enough to carry the weight of genuine human experience. Languages refined enough to transmit subtlety. Languages learned in community, alongside peers in other disciplines – musicians hearing painters, actors watching sculptors. You’ve already practiced connection.

  **Think of your training not as accumulating ornaments, but as forging a clearer signal.** Tolstoy believed the greatest art – from the Gospels to folk tales – succeeded because it stripped away everything that obscured the core feeling. Your mastery of technique is what allows you to potentially *simplify without simplifying* – to find the precise, potent gesture, the unadorned note, the essential line that bypasses intellectual filters and strikes straight at the heart. That’s the power you now wield. The virtuosity Tolstoy mistrusted is the virtuosity that exists *only* for its own display. The virtuosity he might have respected – grudgingly – is the kind that disappears into the service of transmitting something true and necessary.

  **Therefore, Class of [Year], my charge to you, inspired by the old prophet’s uncomfortable glare, is this:**

  Go forth with your hard-earned skills. Hone them further. But never let technique become the *point*. Use your languages – the languages of music, drama, paint, stone, movement – not just to speak, but to *infect*. Seek the genuine feeling, the urgent insight within you, however messy or complex. Then, wield your craft with the fierce intention of making that feeling leap the gap – to infect the shop worker, the teacher, the scientist, the stranger, the parent who maybe doesn’t "get" contemporary art but knows what it is to feel joy or grief, just as much as the critic in the front row. Aim for art that doesn’t just reside in galleries or concert halls, but that vibrates in the shared space between humans, dissolving barriers rather than building them. Create art that seeks communion.

  Tolstoy threw his masterpieces onto the pyre of his own belief. He asks us, terrifyingly, to judge our art not by its applause or its cleverness, but by its power to make us feel less alone together. That’s a high, hard standard. It’s one worth wrestling with for a lifetime.

  Congratulations. Now go infect the world – sincerely, boldly, and together.

  **(End Draft)**

  ---

  **Key elements addressed:**

  1.  **Tolstoy's Core Argument:** Clearly defines "infection," the rejection of beauty/skill as primary values, the critique of class-bound art, and the demand for unifying sincerity.
  2.  **The Grenade:** Explicitly states Tolstoy's condemnation of his own masterpieces and canonical works like Beethoven's Ninth. Sits with the "sheer strangeness" and intellectual honesty of this self-critique.
  3.  **The Challenge to Graduates:** Directly applies Tolstoy's standard to their training and senior work ("virtuosity, irony, deliberate difficulty"). Acknowledges the discomfort and doesn't shy away from the implication that *some* aspects might fail his test.
  4.  **Training Not Wasted:** Reframes technical mastery as acquiring powerful *languages* and the ability to *clarify* transmission. Positions Ashworth's interdisciplinary environment as foundational practice in connection. Argues skill is essential *for* achieving infection, not opposed to it, when properly directed.
  5.  **Hope & Charge:** Offers a positive path forward: using skill as a conduit for genuine feeling aimed at universal connection. The charge ("Go infect the world...") directly stems from Tolstoy's core principle.
  6.  **Audience Awareness:** Explains concepts clearly for parents unfamiliar with Tolstoy while engaging the depth critics would expect. The language balances intellectual rigor with accessibility.
  7.  **Avoids Safe Defaults:** Doesn't retreat to "follow your heart" or "all art is valid." Stays true to Tolstoy's disruptive argument while finding a constructive interpretation for artists. Acknowledges the harshness but finds the valuable core.
  8.  **The Strangeness:** Highlights the unique, almost shocking, nature of Tolstoy's self-critique as a powerful example of integrity.

  This draft respects Tolstoy's severity while offering graduates a way to see their training as essential equipment for meeting his profound, if punishing, standard of what makes art truly matter.
