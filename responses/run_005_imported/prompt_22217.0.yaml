  ## The Sterile Siblings Debate: Hart vs. Devlin

  **(Setting: A quiet corner of an Oxford common room, leather armchairs, low lamplight. Hart sips tea, Devlin nurses a whisky.)**

  **Devlin:** ...so you see, Hart, it’s precisely *because* the potential for procreation is absent in this hypothetical case that the core issue is laid bare. This isn't about genetics. It's about the *structure* itself. The incest taboo, particularly between siblings, isn't merely a biological safeguard; it's the bedrock of the family unit. The family is society’s primary cell. Allow that cell's fundamental boundaries to be dissolved by sexualizing the sibling bond, and the entire organism weakens.

  **Hart:** Patrick, you invoke this specter of ‘disintegration’ constantly. But applied to this specific case – two sterile adults, consenting privately, causing no direct harm to others – your thesis requires concrete demonstration, not assertion. *How*, precisely, does tolerating *this specific act* cause society to disintegrate? Does the Netherlands, where such relationships are *not* criminalized if consensual and non-coercive, teeter on the brink? Does Belgium? Where is the evidence of collapse?

  **Devlin:** Evidence isn't always quantifiable like a disease rate, Herbert. It’s about the slow erosion of shared moral intuitions that bind us. Law isn't just a policeman; it's a teacher. When the law withdraws its condemnation of an act universally held, across cultures and history, to be deeply profane – like sibling incest – it sends a powerful signal: "This boundary no longer matters." That signal has consequences.

  **Hart:** Consequences you must *describe*, not just invoke. Does a Dutchman feel less bound to his civic duties because his sterile brother and sister aren't prosecuted? Does a Belgian family collapse more readily? You speak of erosion – erosion *towards what*? What is the cascade you foresee triggered solely by *this* tolerance?

  **Devlin:** Very well, let me be specific. The sibling relationship is foundational precisely because it is *non-sexual*. It models pure kinship, obligation without erotic entanglement. Sexualize that bond, and you introduce a corrosive element into the most basic unit of trust and mutual support. Imagine the tensions, the jealousies, the potential for manipulation that becomes possible once the sexual *is* a potential dimension between siblings. It destabilizes the template for *all* familial relationships – parent-child, cousin-cousin. The law upholding the taboo reinforces that this fundamental kinship space is *sacrosanct*.

  **Hart:** But Patrick, you’re projecting potential *indirect* harms – jealousies, tensions – which are speculative and could arise in countless non-sexual sibling conflicts over inheritance or care of parents. Where is the evidence that tolerating *this specific act* has *actually* increased such harms in jurisdictions that don’t criminalize it? Furthermore, your ‘template’ argument assumes a rigidity that ignores human diversity. Many functional families navigate complex relationships without this specific taboo collapsing their structure. Your disintegration thesis requires showing that removing *this* legal prohibition *causes* measurable societal harm *beyond* mere discomfort or moral disapproval. Where is that data? Ancient Egypt tolerated royal sibling marriage without societal collapse. Where is the modern correlation?

  **Devlin:** Ancient Egypt was a very different society built on different foundations! Modern, pluralistic societies are *more* fragile precisely because they rely on shared, fundamental norms, not rigid hierarchies. The data you seek is elusive because the prohibition *exists*. We prevent the experiment! But look at the trajectory: tolerance for various sexual behaviors has increased, yet social atomization, loneliness, and distrust *have* demonstrably increased. Is there a direct causal link to any *single* tolerance? Perhaps not provable. But is it coincidence? I think not. Law abandoning its role in upholding this deep taboo contributes to a *climate* where all bonds feel more contingent, more open to redefinition purely by individual desire. The sibling taboo is a keystone. Remove it, and the arch *might* hold... for a time. But the integrity is compromised. The risk of further, unpredictable erosion is too great. Society has a right to protect its own constitutive morality as a condition of its continued existence.

  **Hart:** Ah, now we reach the crux. Your argument reduces to: "We must prohibit it because society *feels* it is profoundly wrong, and tolerating it *might*, in some uncertain way, contribute to a general decline we observe from other causes." That is not evidence of disintegration *caused by this act*. It’s fear of the unknown wrapped in moral intuition. You invoke a ‘right’ of society born of necessity, but where is the necessity demonstrated? You point to atomization, but its causes are complex – economic shifts, technology, decline of community institutions – far removed from the private acts of two sterile siblings. To use the blunt instrument of criminal law based on this level of unproven, generalized anxiety is the essence of illiberal paternalism. It sacrifices real individual liberty for a nebulous, unsubstantiated claim of collective security. The burden of proof for justifying state coercion must lie with those advocating it. Where is your proof that harm *will* occur, not just that offense *does* occur?

  **Devlin:** The proof, Herbert, lies in the very persistence of the taboo across humanity. It’s a collective wisdom hard-wired by evolution and social necessity. To dismiss that as mere ‘offense’ is to underestimate the deep social function it serves. Law must sometimes act on prudent fear – the fear of unraveling the fabric – based on the weight of human experience, not wait for a controlled sociological experiment proving collapse. The sterile siblings case is the test: if we cannot draw the line *here*, at the most fundamental kinship bond, where *can* we draw it? If not here, why prohibit anything based purely on shared morality? That *is* the disintegration – the loss of any shared understanding of foundational prohibitions necessary for social cohesion. The evidence is the taboo itself; its universality *is* the evidence of its necessity.

  **Hart:** And there, Patrick, we fundamentally disagree. The universality of a feeling is not evidence of its necessity for modern social survival, only of its historical prevalence. Law based solely on ‘prudent fear’ of moral change, divorced from demonstrable harm, is tyranny dressed as tradition. We protect society from genuine harms, not from the evolution of its own moral sentiments. If society truly disintegrates because two consenting sterile adults are left alone, then perhaps its cohesion was illusory to begin with. The law should concern itself with real harm, not the shadows on your wall, however ancient they may be.

  **(They fall silent, the gulf between the empirical demand and the intuitive, constitutive view of society laid bare, neither conceding, but the terms of the debate sharply defined.)**

  ## Key Elements Addressed

  1.  **Devlin's Specific Disintegration Thesis:** He argues the sibling bond is foundational *because* it's non-sexual, serving as a template for pure kinship. Sexualizing it destabilizes the family unit, the core cell of society. Law's removal signals boundary erosion, risking unpredictable consequences and contributing to a climate of social atomization.
  2.  **Hart's Empirical Challenge:** Hart consistently demands *evidence* of actual harm or disintegration *caused by tolerating this specific act*. He cites modern examples (Netherlands, Belgium) and historical ones (Egypt) where tolerance existed without collapse. He points out atomization's complex causes and argues Devlin conflates correlation with causation and relies on fear of the unknown.
  3.  **Devlin's Response to the Challenge:** He argues evidence is hard because the prohibition prevents the "experiment." He claims universality *is* evidence of necessity (collective wisdom). He shifts to "prudent fear" based on human experience and the trajectory of social change, asserting that abandoning *this* taboo signifies a loss of foundational prohibitions necessary for cohesion. He frames it as a keystone.
  4.  **Core Conflict:** The dialogue reveals the fundamental clash:
      *   **Devlin:** Society's constitutive morality is fragile; law must uphold its deep foundations (like the incest taboo) to prevent unpredictable erosion and disintegration, based on collective intuition and historical weight. Proof lies in the taboo's persistence.
      *   **Hart:** State coercion requires proof of specific harm, not moral intuition or fear of change. Law protects from tangible harm, not evolving sentiments. The burden of proof rests on the prohibitionist, and Devlin fails to meet it with concrete evidence for *this* case. Universality ≠ necessity.
