prompt: |-
  I'm currently teaching a graduate seminar on formal epistemology, and this week's session on Bayesian confirmation theory ran into a puzzle I'd like a second opinion on before we reconvene. We had just finished setting out the orthodox Bayesian picture of confirmation — evidence E confirms a hypothesis T just in case conditionalizing on E raises one's credence in T — when a student raised Clark Glymour's "problem of old evidence." Her worry was that some of the most celebrated confirmations in the history of science, such as General Relativity's account of the anomalous advance of Mercury's perihelion, involve evidence that was already known, and hence already assigned probability 1, well before the theory that supposedly earns support from it was even formulated. But if P(E) is already 1, conditionalizing on E cannot budge anyone's credence in T at all, so orthodox conditionalization seems structurally incapable of explaining why we treat such cases as among the strongest evidential support a theory can receive.

  A couple of students pushed back with fixes they had run across in a reading group. One brought up the Garber–Jeffrey move of relativizing the framework to agents who are not logically omniscient, so that what actually confirms T is the discovery of a logical fact the agent did not already possess — namely, that T entails E — rather than the discovery of E itself. Another raised counterfactual strategies that try to recover a sensible confirmation relation by asking what the agent's credence in T would have been had she not already known E. Neither proposal struck the class as obviously satisfying on its own terms, and we ran out of time before pinning down why.

  Could you help me think this through before next week's class? I'm after an explanation that goes beyond the one-line gloss "the problem is that P(E) = 1" and instead builds up the tension step by step: why orthodox conditionalization really does run into trouble here, what exactly separates a "historical" reading of the problem (about the order in which scientists actually came to believe things) from a "logical" one (about idealized agents' logical omniscience), and whether the Garber–Jeffrey and counterfactual strategies genuinely dissolve the puzzle or just relocate it elsewhere. I'd also value your own view on which approach comes closest to capturing why Mercury's perihelion still strikes working scientists as a genuine triumph for General Relativity, rather than a piece of evidence that GR could not, in principle, have gained any credit from.
reasoning: |-
  Okay, the user is teaching a graduate seminar on formal epistemology and encountered the problem of old evidence during a session on Bayesian confirmation theory. They need a clear explanation to present to their class next week. Let me start by recalling the core issue: when evidence E is already known (P(E)=1), conditionalizing on it doesn't change the probability of a new theory T. This makes it seem like such evidence can't confirm T, which contradicts historical cases like Mercury's perihelion supporting General Relativity.

  First, I need to break down why orthodox Bayesianism struggles here. The key point is that if P(E)=1, then P(T|E) = P(T) because the conditional probability formula involves division by P(E)=1. So no confirmation occurs. But why does this feel wrong? Because scientists clearly see Mercury's perihelion as strong evidence for GR. The user mentioned students proposed Garber-Jeffrey and counterfactual approaches, but the class wasn't satisfied. I should explore why those solutions might feel incomplete.

  The user wants to distinguish between the historical and logical aspects. Historically, scientists learned E before T. Logically, an idealized agent with P(E)=1 can't update on E. But logical omniscience adds another layer: if the agent knew all logical truths, they'd know that T entails E, which might require P(E)=1 from the start. So both timing and logical limitations are intertwined here.

  For Garber-Jeffrey: they suggest learning that T entails E (call this proposition X). Then P(T|X) might increase even if P(E)=1. But the issue is that X is a logical truth. If the agent is logically omniscient, P(X)=1 already, so again, no update. So Garber-Jeffrey only works if we drop logical omniscience. But then, how do we model learning logical facts? Bayesianism traditionally doesn't handle that well. Plus, the confirmation seems to depend on the agent's prior ignorance about the entailment, which feels subjective when the support should be objective.

  Counterfactual approach: asking what P(T) would be without knowing E. But constructing that counterfactual is tricky. How to "forget" E? Removing E from knowledge might affect other beliefs too. And there's no unique way to set the prior for E, leading to subjectivity. Also, it's not the actual epistemic state that's updating, which might feel unsatisfying for a theory of confirmation.

  The user also wants to know why Mercury's perihelion still feels like a triumph. Here, the key is the explanatory connection. GR didn't just accommodate E; it provided a mechanism that made E necessary under the theory. Contrast with ad hoc explanations. So the confirmation comes from understanding why E must be true given T, which wasn't known before. This insight isn't captured in the Bayesian update alone but in the logical relationship revealed.

  Synthesizing this, the best approach might combine elements. Acknowledge that strict conditionalization has limits here. The counterfactual method, despite its flaws, aligns with scientists' retrospective reasoning. Garber-Jeffrey highlights the importance of learning entailments. But perhaps a more integrated solution involves the agent's realization of the explanatory connection, which updates their understanding beyond just probabilities.

  I should also mention that some solutions propose changing the probability function to a non-omniscient state or using counterfactual credences. Each has trade-offs. Emphasize that no solution is perfect, but they address different aspects. The historical success comes from the theory's explanatory power, which Bayesianism struggles to formalize but can approximate through these strategies.

  Finally, advise the user to present both solutions' strengths and weaknesses, and stress that the problem reveals limitations of Bayesian confirmation, prompting extensions or alternatives. Highlight that Mercury's case is strong because GR uniquely explained E without adjustment, unlike previous theories. That explanatory leap is key, even if formalizing it is challenging.
answer: |-
  This is an excellent and deep puzzle that cuts to the heart of Bayesianism's ability to capture scientific practice. Let's break it down step-by-step, separating the historical, logical, and epistemological strands, and evaluate the proposed solutions.

  **The Core Tension: Why Orthodox Conditionalization Falters**

  1.  **The Orthodox Definition:** Confirmation occurs iff learning E increases credence in T: P(T|E) > P(T).
  2.  **The Conditionalization Rule:** When an agent *learns* E (and *only* E), they update their credence in T to Pₙₑ𝓌(T) = Pₒₗ𝒹(T|E).
  3.  **The Problem of Old Evidence (OE):** If E is *already known* to the agent *before* T is formulated, then:
      *   **Pₒₗ𝒹(E) = 1.** E is part of their background knowledge K.
      *   **Pₒₗ𝒹(T|E) = Pₒₗ𝒹(T).** (Because if P(E)=1, conditioning on E does nothing: P(T|E) = P(T ∧ E)/P(E) = P(T ∧ E)/1 = P(T ∧ E). But since E is already known and has probability 1, T ∧ E is equivalent to T for all probabilistic purposes when E is in K. Formally, T ∧ E ≡ T modulo K. So P(T ∧ E) = P(T)).
      *   **Therefore, Pₙₑ𝓌(T) = Pₒₗ𝒹(T|E) = Pₒₗ𝒹(T).**
      *   **Learning E (again) provides *zero* confirmation** to T according to the definition and update rule.
  4.  **The Historical Reality:** Cases like Mercury's perihelion anomaly (known since ~1859) *feel* like they provided immense confirmation for General Relativity (GR, 1915). Scientists *acted* as if GR gained significant credibility from explaining it. Orthodox Bayesianism seems to render this impossible.

  **Why This Feels Deeply Unsatisfying:** It's not *just* that P(E)=1. The deeper tension is that Bayesianism appears to **confuse the *order of discovery* with the *logical relation of support***. The *historical accident* that E was known before T shouldn't erase the *objective logical fact* that T entails (or probabilistically supports) E. Yet, within the standard framework, it does.

  **Separating the Strands: Historical vs. Logical**

  *   **The "Historical" Reading:** This focuses on the *actual temporal sequence* of belief acquisition by *real scientists*. Einstein knew about Mercury's perihelion *before* he formulated GR. Therefore, *for Einstein*, P(E) was 1 when he first considered GR. Orthodox conditionalization *correctly* shows that *Einstein himself*, upon formulating GR, couldn't have gained confirmation *by learning E itself*. The puzzle is: how *did* GR gain confirmation from E for him and his contemporaries? This reading highlights a limitation for modeling actual scientific reasoning over time.
  *   **The "Logical" Reading:** This focuses on the *idealized Bayesian agent* at a *single point in time* where both T and E are considered. If E is already in the agent's background knowledge K (P(E)=1), then *logically*, T ∧ E ≡ T modulo K. Therefore, P(T|K) = P(T|E ∧ K). Learning E *given K* provides no new information; it's redundant. The puzzle is: how can the *logical relationship* between T and E (that T entails E) be a source of confirmation if E is already certain? This reading exposes a tension between logical omniscience and the nature of confirmation. If the agent is logically omniscient *and* knows E, they *must* know that any T entailing E must also entail something already certain (E), which seems to rob the entailment of any confirmatory power *relative to that agent's state*.

  **Evaluating the Solutions: Insights and Limitations**

  1.  **The Garber-Jeffrey (GJ) Approach (Learning the Entailment):**
      *   **Core Idea:** What confirms T isn't learning E itself (which is old), but learning a *new logical fact*: that T entails E (call this proposition X: T ⊨ E). Agents aren't logically omniscient, so Pₒₗ𝒹(X) < 1. Learning X *can* increase P(T).
      *   **Mechanics:** Upon learning X, the agent updates: Pₙₑ𝓌(T) = Pₒₗ𝒹(T | X). Crucially, Pₒₗ𝒹(T | X) can be > Pₒₗ𝒹(T), even if Pₒₗ𝒹(E) = 1. (Intuitively: Discovering that this new, potentially powerful theory *predicts* the known anomaly makes the theory more attractive).
      *   **Strengths:**
          *   Directly addresses the historical scenario: Einstein *discovered* that his field equations implied the correct perihelion shift. *That* was the new, confirmatory event.
          *   Provides a *positive* confirmation event within the Bayesian framework by introducing a new proposition (X) to learn.
          *   Avoids counterfactuals about forgetting evidence.
      *   **Limitations & Relocated Puzzles:**
          *   **What is X, exactly?** Is it the syntactic proof, the semantic consequence, or just the belief that T predicts E? Bayesianism struggles with modeling learning *logical* truths. Updating on X requires defining Pₒₗ𝒹(T | X), which involves probabilities over logical propositions.
          *   **Degrees of Logical Ignorance:** How do we model the *prior* uncertainty about X? What justifies a specific Pₒₗ𝒹(X) < 1? This seems messy and agent-relative.
          *   **The "Why Now?" Problem:** If X is a timeless logical truth, *why* does learning it *now* confirm T? GJ explains *how* it confirms, but the *timing* (only after T is formulated) feels contingent. Shouldn't the logical relation itself be confirmatory whenever discovered?
          *   **Confirmation or Just Coherence?** Does learning X genuinely provide *new evidence for T*, or does it merely force the agent to align their beliefs with a logical constraint they previously ignored? This borders on the problem of "rationality lapses" providing confirmation.

  2.  **The Counterfactual Approach (Forging the Old Evidence):**
      *   **Core Idea:** Ask what the agent's credence in T *would have been* if they *didn't already know E*. Confirmation is measured by comparing the *actual* P(T) (given E) to this *counterfactual* P'(T) (without E): Confirmation occurs iff the actual P(T | K) > P'(T | K \ {E}), where K \ {E} is background knowledge minus E.
      *   **Mechanics:** Construct a hypothetical prior probability function P' where P'(E) < 1 (and adjust other credences "minimally" to maintain coherence). Then calculate P'(T | E). The confirmatory boost is P(T | K) - P'(T | E) (or a ratio thereof). In practice, P(T | K) is often identified with P'(T | E), and the boost is P'(T | E) - P'(T).
      *   **Strengths:**
          *   Captures the *intuition* that the power of OE lies in how *surprising* or *unexpected* E would have been *without* the theory, or how well the theory *predicts* it. GR makes Mercury's orbit *expected*; Newtonian physics + known perturbations could not.
          *   Focuses on the *explanatory relationship* between T and E, rather than the temporal order of belief.
          *   Avoids introducing logical propositions like X.
      *   **Limitations & Relocated Puzzles:**
          *   **The Counterfactual is Radically Underdetermined:** How do we construct P'? What does the agent know instead of E? How do we "minimally" revise K to remove E while preserving coherence? (e.g., Does removing knowledge of Mercury's orbit imply removing all celestial mechanics? All of Newtonian physics?). There is no unique or principled way to do this.
          *   **Which Counterfactual?** Is it the credence T *would have had* before E was learned historically? Or the credence a *contemporary* agent *would have* if they magically didn't know E? These are very different.
          *   **Subjectivity Run Amok:** The counterfactual measure becomes highly sensitive to arbitrary choices about P'. Different ways of "forgetting" E yield vastly different degrees of confirmation.
          *   **Not an Update Process:** It doesn't model the *actual* belief change of the agent upon considering T relative to OE. It's a retrospective evaluation tool.

  **Why Mercury's Perihelion *Feels* Like a Triumph (and Which Approach Gets Closest)**

  The triumph stems from **GR providing a deep, rigorous, and *unforced* explanation of a known anomaly within a radically new theoretical framework.** It solved a specific, long-standing puzzle *without* being tweaked to fit it. The anomaly was a consequence of GR's core principles (the field equations) applied to the solar system.

  *   **Orthodox Bayesianism (alone):** Fails utterly. It sees no confirmation event.
  *   **Garber-Jeffrey:** Gets closest to **capturing the actual historical moment of discovery and its psychological impact.** Einstein's *realization* that his equations yielded ~43"/century was a pivotal "Aha!" moment. GJ directly models the confirmatory effect of *that realization* (learning X). It best explains why scientists *at the time* felt GR gained immense credibility *upon* solving the Mercury problem. The limitation is that it frames the confirmation as stemming from the agent's *prior ignorance of logic* rather than purely the objective explanatory power.
  *   **Counterfactual Approach:** Best captures the **explanatory power and predictive success aspect.** It articulates *why* explaining OE is impressive: *if* we didn't already know E, GR would make us expect it, while the previous theory (even with adjustments) could not fully account for it. This resonates with the intuition that a good theory *predicts* known facts, not just accommodates them. However, its reliance on an arbitrary counterfactual state makes it less compelling as a model of *actual* confirmation dynamics.

  **My Synthesis & Recommendation for Class:**

  1.  **Acknowledge the Genuine Tension:** Orthodox Bayesian conditionalization *does* structurally fail to account for OE confirmation *within the agent's actual epistemic state at the time T is formulated*. This is a real limitation for modeling historical cases and highlights the framework's sensitivity to background knowledge and logical omniscience assumptions.
  2.  **Neither Solution is Perfect, Both Offer Insights:** Present GJ and Counterfactuals not as definitive "solutions" but as insightful *responses* highlighting different aspects:
      *   **GJ:** Focuses on the *cognitive event* of discovering the entailment as the source of confirmation. Its weakness is handling logical learning.
      *   **Counterfactual:** Focuses on the *explanatory/predictive relationship* between T and E. Its weakness is the radical underdetermination of the counterfactual state.
  3.  **The Triumph of Mercury:** Emphasize that the core reason Mercury's perihelion confirms GR so strongly is **explanatory integration without ad-hocness.** GR *derives* the precise anomaly from fundamental principles applicable universally. Previous attempts were patches. *Both* GJ and Counterfactuals try to formalize aspects of this:
      *   GJ models the moment the derivation is completed (learning X).
      *   Counterfactual models the fact that GR uniquely predicts E given the solar system's configuration.
  4.  **Broader Implications:** Discuss how the problem exposes deeper issues:
      *   The role of *background knowledge* (K) in Bayesian confirmation.
      *   The problem of *logical omniscience*.
      *   Whether confirmation is solely about *updating degrees of belief* or also involves recognizing *explanatory connections*.
      *   The distinction between *accommodation* (fitting known data) and *prediction* (foretelling new data), and why OE feels like a strong prediction even though it's old.
  5.  **Possible Paths Forward:** Mention that some philosophers advocate combining approaches, or exploring more radical departures like allowing agents to have credences defined relative to *non-omniscient* logical frameworks from the start. Others see it as a sign that Bayesianism needs supplementation (e.g., with a theory of explanation).

  **In Conclusion for Your Class:** The Problem of Old Evidence isn't just a technical glitch with P(E)=1. It's a profound challenge revealing how Bayesian confirmation, centered on belief updating via conditionalization, struggles with the interplay of time, logical knowledge, background certainty, and the intuitive force of explanatory power. Both Garber-Jeffrey and the counterfactual approach offer valuable but incomplete ways to recover the intuition that explaining old evidence *should* confirm a theory. Garber-Jeffrey likely best captures the historical scientist's *experience* of confirmation upon discovering the entailment, while the counterfactual approach (despite its flaws) best articulates the *explanatory achievement* that underlies why that experience feels justified. Mercury's perihelion remains a triumph because GR provided a deep, necessary explanation where none existed before, fundamentally changing our understanding of gravity and motion.
