  Okay, the user is drafting a column on the limits of Bayesian rationality and wants to pressure-test a claim about I.J. Good's proof. They mention that in decision-theory circles, it's often claimed that the expected value of free information is never negative, which seems to settle whether rational agents should always gather more evidence. But skeptics point to counterexamples like Hirshleifer's work on public information disrupting insurance, strategic settings where ignorance has value, and issues for boundedly rational agents.

  First, I need to recall Good's theorem accurately. Good's 1967 proof states that for a Bayesian agent, the expected utility of acquiring additional information before making a decision cannot be negative, provided the information is free and relevant. The key assumptions are the agent's Bayesian rationality—they update beliefs via conditionalization—and that the information is cost-free and decision-relevant. The theorem relies on the law of total expectation, where averaging over possible information outcomes can't decrease the maximum expected utility.

  Now, the user's skeptics bring up three counterexamples. Let me tackle each one. Hirshleifer's example shows that public information can destroy risk-sharing arrangements. For instance, if everyone knows who will have a bad harvest, insurance markets collapse because the risk is no longer uncertain. This violates Good's assumption that the decision-maker is a single agent. Here, the information affects other agents' actions, introducing strategic interdependence. Good's theorem doesn't account for multiple agents whose decisions interact, so this is a violation of the single-agent assumption.

  Next, strategic settings where credible ignorance is valuable. In bargaining, not knowing your private valuation can prevent exploitation. If you're known to have a high valuation, the other party might demand more. But if you're genuinely ignorant, you can't be manipulated. This violates the assumption that information only informs the agent without altering others' strategies. Here, the state of knowledge itself affects the strategic landscape. Good's model doesn't consider how the act of acquiring or not acquiring information signals something to others, which ties into the single-agent framework again.

  The third counterexample is about bounded rationality. Humans or AIs might suffer from information overload, bias, or paralysis. But Good's theorem assumes an ideal Bayesian agent with no computational limits. Real agents have cognitive constraints, so processing more information can lead to worse decisions. This violates the assumption of unlimited computational resources and perfect Bayesian updating. The theorem holds for ideal agents but not for real ones with limitations.

  So, each counterexample violates a different assumption. Hirshleifer and strategic ignorance break the single-agent and no-signaling assumptions, while bounded rationality challenges the ideal computation assumption. None of them refute Good's theorem under its original conditions, but they highlight where it doesn't apply in practice.

  The user also wants a verdict on whether "never refuse free information" is a norm for different agents. For ideal Bayesians, yes, strictly. For humans, no—because of cognitive limits. For AIs in high-stakes scenarios, it depends. If the AI is ideal, then yes, but real-world AIs have computational constraints and design trade-offs. Also, in multi-agent environments, information acquisition can have strategic costs. So the answer isn't universal; context matters.

  I should structure the essay to first state Good's theorem clearly, then address each counterexample by showing which assumption is violated, and finally discuss the implications for different types of agents. Emphasize that the theorem is mathematically sound but its applicability is conditional. The user's deeper need might be to challenge a dogma in rationalist circles, showing that real-world complexity requires nuance beyond theoretical proofs. They might want to caution against overly simplistic applications of Bayesian principles without considering context.
answer: |-
  ## The Fragile Sovereignty of Information: Good's Theorem in a Complex World

  I.J. Good's 1967 theorem is a cornerstone of Bayesian decision theory, radiating an aura of elegant finality. Its core claim is beguilingly simple: **For a rational Bayesian agent facing a decision, the expected utility of acquiring cost-free, decision-relevant information before making that decision can never be negative.** At first glance, this seems to settle the debate: a rational agent should *always* accept such information. Yet, the skeptics you cite – invoking Hirshleifer, strategic ignorance, and bounded rationality – are not irrational Luddites. They point to cracks in the foundation, not by disproving Good's mathematics, but by exposing the stringent, often unrealistic, assumptions upon which its universal applicability rests. Let's dissect the theorem and its challengers.

  **Good's Theorem: Precision and Assumptions**

  Good's proof relies on a powerful mathematical tool: the law of total expectation applied to the maximum expected utility achievable *after* receiving the information. Here's a precise statement:

  1.  **Agent:** A single, perfectly rational Bayesian decision-maker.
  2.  **Decision:** The agent must choose an action `a` from a set `A`.
  3.  **States:** The outcome depends on an unknown state of the world `s` in a set `S`.
  4.  **Utility:** The agent has a utility function `U(a, s)`.
  5.  **Prior:** The agent has a prior probability distribution `P(s)` over `S`.
  6.  **Information:** The agent can observe the value of a random variable `X` (the "information") before choosing `a`. `X` is cost-free to acquire and its distribution depends on `s` (`P(X|s)` is defined).
  7.  **Relevance:** `X` is potentially relevant to the decision, meaning observing `X` might change the action that maximizes expected utility compared to acting without observing `X`. Formally, `P(s | X)` is not identical to `P(s)` for all possible `X`, and this change *can* influence the optimal `a`.
  8.  **Rationality:** The agent updates beliefs via strict Bayesian conditionalization (`P(s|X) ∝ P(X|s)P(s)`). After observing `X = x`, the agent chooses the action `a*(x)` that maximizes expected utility `E[U(a, s) | X = x]`. Without observing `X`, the agent chooses `a*` maximizing `E[U(a, s)]`.

  **The Theorem:** The expected utility of the optimal policy *with* information is at least as great as the expected utility of the optimal policy *without* information:
  `E[ max_a E[U(a, s) | X] ] >= max_a E[U(a, s)]`
  The left side averages the maximum expected utility achievable *after* seeing `X` over all possible values `X` might take (weighted by `P(X)`). The right side is the maximum expected utility achievable *without* seeing `X`. Good proves this inequality always holds, implying the expected value of information (EVI) is non-negative.

  **Key Assumptions:** Crucially, this relies on:
  *   **Single Agent:** The decision-maker acts alone; their choice doesn't trigger reactions from others.
  *   **No Cost:** Acquiring `X` consumes no resources (time, money, cognitive load).
  *   **Perfect Updating:** The agent flawlessly computes and applies `P(s|X)`.
  *   **Utility Invariance:** `U(a, s)` depends *only* on `a` and `s`, not on the process of acquiring information or the state of knowledge itself.
  *   **Exogenous Information:** The act of acquiring `X` doesn't change the world state `s` or signal anything *to others* that could alter the decision landscape.
  *   **Unlimited Computation:** The agent can handle the computational burden of processing `X` and finding `a*(x)` instantly and perfectly for any `x`.

  **The Counterexamples: Violating the Sanctum**

  The skeptics' objections succeed by violating one or more of these foundational assumptions:

  1.  **Hirshleifer's Risk-Sharing Unraveling (Public Information):**
      *   **Scenario:** Consider farmers in a village with uncertain individual harvests. Mutual insurance is possible *because* no one knows who will have a bad harvest. If a public, perfectly accurate forecast reveals *exactly* who will have a bad harvest *before* insurance contracts are finalized, high-risk individuals become uninsurable. The mutually beneficial risk-pooling arrangement collapses.
      *   **Violation:** This directly violates the **Single Agent** and **Exogenous Information** assumptions. Good's theorem considers only the information's impact on *one* agent's beliefs and subsequent action. Hirshleifer's scenario involves *multiple strategic agents*. The public revelation of `X` fundamentally alters the *strategic interaction* between them. The information doesn't just inform Farmer A; it informs *everyone*, changing the actions available to others (e.g., refusing to insure known high-risk individuals) and thus destroying the prior equilibrium that was beneficial. The information acquisition (disclosure) *changes the game*, an effect outside Good's single-agent, fixed-decision-context model. The utility function `U` for an individual farmer now depends critically on the *common knowledge* state induced by `X`, which Good's setup doesn't encompass.

  2.  **Strategic Value of Credible Ignorance:**
      *   **Scenario:** In bargaining, knowing your own precise private valuation can be a disadvantage. Imagine negotiating the sale of an heirloom. If you *know* it's worth $10,000 to you emotionally, but the buyer believes it's only worth $5,000 objectively, revealing your high valuation or even possessing that knowledge makes it harder to credibly demand a high price. However, if you are *genuinely ignorant* of its precise personal value (perhaps delegating the sale to an agent with different preferences or limited instructions), you can credibly commit to rejecting lowball offers the buyer might make, potentially securing a better price.
      *   **Violation:** This violates the **Utility Invariance** and **Exogenous Information** assumptions. Good assumes utility depends only on `a` and `s` (e.g., final sale price and true value). However, in this case, the *state of your knowledge itself* (`s_knowledge`) is part of the strategic landscape. Your ability to commit to a tough bargaining stance depends on *not knowing* `s_valuation` precisely. Acquiring information about your own valuation (`X = s_valuation`) destroys this valuable commitment power. The utility of an outcome (e.g., selling for $8,000) is *higher* if you achieved it through a stance enabled by ignorance than if you achieved it while knowing you would have accepted $7,000. Information acquisition changes the agent's *type* in the eyes of others, altering their strategic response. Good's model assumes information only informs belief about `s`; it doesn't account for information changing the agent's *properties* relevant to others' actions.

  3.  **Bounded Rationality: Overload, Bias, and Paralysis:**
      *   **Scenario:** A human doctor faces a complex diagnosis. Acquiring "free" additional test results (`X`) might seem beneficial. However, the doctor has limited cognitive capacity. Processing the extra data could trigger confirmation bias (overweighting data fitting an initial hunch), overwhelm their working memory leading to an overlooked critical pattern, or induce "analysis paralysis" delaying life-saving treatment. An ideal Bayesian would seamlessly integrate the data and instantly find the optimal action. The human cannot.
      *   **Violation:** This violates the **Perfect Updating**, **Unlimited Computation**, and arguably **No Cost** assumptions. Good's proof assumes the agent perfectly computes `P(s|X)` and instantly identifies `a*(x)` for any `x`. Boundedly rational agents cannot do this. The cognitive effort *is* a cost. Imperfect heuristics used to cope with complexity can systematically distort `P(s|X)` away from the true Bayesian posterior. The search for `a*(x)` might fail or be suboptimal under time pressure or complexity. Crucially, *the very act of processing `X` can degrade the decision-making process* compared to acting on less information but with higher fidelity cognition. Good's theorem assumes the information is processed flawlessly; it says nothing about the quality of processing under cognitive constraints.

  **The Verdict: Context is Sovereign**

  Good's theorem is a profound mathematical truth *within its idealized domain*. It conclusively shows that for an **idealized Bayesian reasoner** (omniscient calculator, single agent, fixed decision context, utility invariant to knowledge state), refusing free, decision-relevant information is irrational. The expected utility calculation *cannot* justify it.

  However, the real world is not this idealized domain. Therefore, the universal norm "**never refuse free, decision-relevant evidence**" must be heavily qualified:

  1.  **Idealized Bayesian Reasoners:** **Yes, they should always follow it.** By definition, they operate within the theorem's assumptions. Violating the norm would be mathematically demonstrable sub-optimality.
  2.  **Humans:** **No, they should not follow it universally.** Humans are quintessentially boundedly rational. The cognitive costs (time, effort, overload), vulnerability to biases, and potential for paralysis are real and often significant. Humans *must* develop heuristics for *when* to seek more information and when to decide based on current understanding ("satisficing"). Good's theorem is a valuable *aspirational* ideal, reminding us of information's *potential* value, but not an infallible practical rule. Knowing one's cognitive limits and the potential for information to degrade performance (via bias or overload) is a higher form of rationality.
  3.  **AI Systems Facing High-Stakes Choices:** **It depends critically on system design and context.**
      *   *Ideal Bayesian AI (Pure Calculation):* Same as the idealized reasoner – always accept.
      *   *Real-World AI (Computationally Bounded):* Must be designed with caution. While less prone to human biases, AIs face computational limits, potential for adversarial data poisoning, and the curse of dimensionality. Acquiring vast data might delay critical actions unacceptably or overwhelm inference algorithms, leading to suboptimal or unsafe decisions. Robustness and timeliness often trump theoretical information value. The "cost" of computation and delay must be factored in, even if data is free.
      *   *AI in Multi-Agent/Strategic Settings:* Absolutely not universal. An AI negotiator, market trader, or participant in a system like Hirshleifer's insurance market *must* consider the strategic implications of information acquisition and disclosure. Credible ignorance or carefully controlled information revelation can be essential tools. Here, game theory, not pure Bayesian decision theory, provides the relevant norms.

  **Conclusion**

  Good's theorem remains a brilliant illumination of the intrinsic value of knowledge for an isolated, flawless mind. It rightly banishes the specter of information having *inherently* negative expected value under its assumptions. However, the skeptics' counterexamples are not flaws in Good's math; they are vital maps of the theorem's boundaries. They demonstrate that information's value is not intrinsic, but *emergent* from the interaction between the data, the agent's capabilities, and the decision ecosystem. In the messy reality of strategic interaction and bounded cognition, information can indeed be a costly, destabilizing, or even paralyzing force. The true mark of rationality, therefore, is not blind adherence to "more information is always better," but the nuanced meta-judgment of *when* the potential benefits of information, under *real-world constraints*, genuinely outweigh its often-hidden costs and risks. For humans and practical AI, wisdom lies not just in processing data, but in knowing when to stop gathering it and start acting.
