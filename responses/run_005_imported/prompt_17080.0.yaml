  I decide to avoid naming the positions after philosophers since the user wants natural labels. "Duty" and "Care" feel neutral. For flow, I consider having them debate a concrete case - maybe helping a stranger versus a friend - to ground the abstractions. The dialogue should show mutual understanding before disagreement, so neither strawmans the other.

