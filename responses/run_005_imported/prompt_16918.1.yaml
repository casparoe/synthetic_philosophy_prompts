answer: |-
  ## Eulogy for the Reverend Arthur Calloway
  (Delivered by Professor Miriam Calloway)

  Friends, parishioners, colleagues… thank you for gathering to remember my father. Thank you, especially, to this community who was his lifeblood, his purpose, and his family for nearly forty years. You knew him as shepherd, counselor, friend – a constant presence whose voice shaped your days, whose hands offered solace, whose faith was the bedrock beneath these very stones. To you, his absence is a profound change in the landscape of your lives. I see that. I honor that.

  My father… Arthur Calloway… was a man of deep conviction. Unshakeable conviction. He believed in the power of ritual, the weight of scripture, the tangible presence of grace in bread and wine. He believed in the promise whispered at a grave, the hope held in the phrase “eternal life.” He spoke of God not as an abstraction, but as a near and listening presence. This faith wasn't just his profession; it was his breath, his compass, the lens through which he saw every person who walked through those doors – including, persistently, his skeptical daughter.

  He believed that faith should speak. Loudly. Clearly. Everywhere it mattered. And he believed, quite passionately, that the work I dedicated my life to – parsing the boundaries of public discourse, the careful architecture of how we reason together in a pluralistic society about our most fundamental shared rules – was, at its heart, a polite silencing. A drawing of lines that told him, and those like him, that their deepest convictions had to be checked at the door when entering the public square on essential matters.

  We argued about this. Oh, how we argued. For decades. Over Sunday dinners that grew tense, during phone calls that ended abruptly, in letters exchanged that were more treatise than greeting. He saw neutrality as a mask for dismissal. I saw… I *see*… the distinction between the *public political forum* – where we decide the coercive fundamentals binding us all – and what the philosopher John Rawls called the *background culture* – the vibrant, messy, glorious space of civil society where families, communities, associations, and yes, churches, live out their comprehensive visions of the good. Where faith speaks in its full-throated glory, shapes lives, offers meaning, argues its truths.

  A funeral, my father would have insisted – indeed, *did* insist, many times – is precisely where faith speaks its most essential words. Where it confronts the abyss with hope. Where it declares truths that reason alone cannot reach.

  And he was right. About this place. About this moment.

  This pulpit, this gathering, these tears – this is the beating heart of the background culture. This is St. Alban’s, not the Supreme Court. This is a community bound by shared love and loss for a specific man, within a specific tradition, not citizens negotiating the basic structure of society. The strictures of public reason, the demand for justifications accessible to all reasonable citizens regardless of their comprehensive doctrine… they do not reach here. They *should* not reach here. To impose them here would be the real silencing.

  So, what can I say, standing where he stood, looking at faces shaped by his ministry and faces shaped by my teaching?

  I can say that my father lived by a light he perceived as divine. He found in scripture, in prayer, in the rhythms of this parish, a framework that gave profound meaning to service, to community, to the dignity of every soul he encountered. He believed utterly in the promises he proclaimed from this pulpit. That belief fueled an astonishing constancy. He showed up. In blizzards and in burnout, in times of parish joy and in times of crushing personal doubt I only glimpsed, he showed up. He listened. He prayed with you. He buried your loved ones. He married you. He tried, imperfectly but earnestly, to embody a radical, demanding love. That constancy, that dedication born of his faith, was real. It shaped lives. It built this community. It was his life’s work, and it was immense.

  I cannot stand here and speak his words of heavenly reunion with the certainty he possessed. That certainty was uniquely his. But I can stand here and bear witness to the power of *his* certainty. I can stand here, in the space his faith carved out, and honor the language that gave him comfort and purpose. To do less would be to disrespect not only him, but the very distinction I’ve spent my career examining. To refuse the vocabulary of his hope in this, his own house, at the marking of his own journey’s end… *that* would be the gagging he feared.

  He thought my philosophy asked believers to be quiet. Today, here, at his funeral… I hope I can show that it asks no such thing. It asks only that we understand *where* different kinds of conversations happen, governed by different kinds of reasons. This conversation, here, now, belongs to Arthur Calloway’s world. It belongs to your memories, your grief, your faith, and the echo of his voice that still seems to resonate in these walls.

  He believed he was going home. To a peace he preached, a light he followed, a presence he called God. He believed it with his whole being. And because this is his place, and you are his people… I stand with you in the space of *his* belief. I honor the profound reality it held for him, the immense good it enabled him to do, and the fierce, unwavering love for you – and, stubbornly, impossibly, for his difficult daughter – that flowed from it.

  May the peace he sought, the peace he truly believed awaited him, be a comfort to you who mourn him. He loved you. Deeply. Faithfully. To the end. That, I know. That, I believe. Rest well, Dad. Your watch is ended.
