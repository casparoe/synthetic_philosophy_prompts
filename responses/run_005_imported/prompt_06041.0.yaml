prompt: |-
  I'm taking a decision theory course this semester, and a disagreement in my friends' weekly betting pool has been nagging at me in a way the assigned readings haven't quite resolved. Each week we all agree on which side of a given wager carries positive expected value, but one friend insists that being rational just means judging every bet purely by its expected value, staking as much of your bankroll as possible whenever the odds favor you, since doing otherwise leaves money on the table. When I tallied results over a full season, everyone who followed his rule went broke at least once, but he waves this off, arguing that if you imagine many people following the same rule in parallel, it still wins out on average, so any one person's ruin is just bad luck rather than evidence that the strategy itself was mistaken. Another friend instead wagers some smaller, fixed percentage of her bankroll every time, but cannot really explain why that policy should count as more rational rather than merely more cautious. Is either of them actually onto something defensible, or does rationality simply have nothing further to say about bet size once a wager's expected value is positive, leaving it purely a matter of personal taste?
reasoning: |-
  Okay, the user is in a decision theory course and has a practical dilemma from a betting pool with friends. They're stuck between two approaches: one friend advocates for maximizing expected value by betting the entire bankroll on positive EV bets, while another uses a fixed fractional approach. The EV maximizer friend went broke, but dismisses it as bad luck, while the fractional bettor can't articulate why her method is more rational. The user wonders if rationality has anything more to say beyond positive EV or if it's just personal preference.

  First, I need to recall the core concepts. Expected value (EV) is straightforward: sum of probability times outcome. For repeated bets, though, the long-term growth matters more. The friend who bets everything each time might have positive EV in the short term, but risk of ruin is high. Kelly Criterion comes to mind—it maximizes the growth rate of wealth by betting a fraction of the bankroll. The fraction is (edge/odds), which balances growth and risk. Betting everything ignores the risk of ruin, which is why those friends went broke. 

  The user mentioned that the EV maximizer argues that in parallel, the strategy wins on average. But individually, going broke stops future bets, so the long-term growth is zero. Kelly avoids ruin and maximizes logarithmic growth. Also, utility functions: risk aversion isn't irrational. People value certainty, so maximizing expected utility might justify smaller bets. 

  The fractional bettor's friend uses a fixed percentage, which is similar to Kelly but possibly not optimized. If she's using a small fraction, she's reducing risk but might underperform. Still, it's better than going broke. The user needs to understand that rationality includes managing risk over repeated trials. 

  I should explain why Kelly is rational: it maximizes long-term growth, avoids ruin, and considers both edge and odds. The EV approach is flawed because it doesn't account for bankroll management. Even with positive EV, bet size matters. The user's deeper need might be to resolve the disagreement with a solid theoretical framework, showing that rationality isn't just about EV but sustainable growth. Also, they might want to convince their friends with evidence beyond personal taste. Decision theory does address this via expected utility and growth optimization. So, the answer is that both friends have points, but Kelly offers a defensible middle ground.
answer: |-
  Your friends have stumbled into a fundamental debate in decision theory, probability, and economics: **how to size bets when facing repeated, uncertain opportunities with positive expected value (EV).** Neither position is entirely correct, and rationality *does* have much more to say beyond just "positive EV is good." Here's a breakdown:

  1.  **The "Max EV Every Time" Friend (Bet It All):**
      *   **The Argument:** If each bet has positive EV, maximizing EV *per bet* logically means staking your entire bankroll each time. Doing anything less sacrifices expected profit on that specific bet.
      *   **The Fatal Flaw:** This strategy ignores **risk of ruin** and the **multiplicative nature of repeated bets**. While the *expected value* of your final wealth might be high, the *probability* of achieving anything close to that expected value is near zero. In fact, the probability of eventually going broke approaches 1 over many bets, as you observed. Why?
          *   Even with a slight edge (e.g., 55% win probability), losing a single "all-in" bet reduces your bankroll to zero. You're out of the game permanently.
          *   The EV calculation for the *sequence* of bets isn't simply the sum of the individual EVs when bets are multiplicative (your next bet size depends on your current bankroll). Ruin truncates the possibility of future gains.
      *   **"But Parallel Universes Win on Average!" Counter:** While it's true that *if* you could run many independent instances of this strategy in parallel (each with its own starting bankroll), the *average* final wealth across all instances would be high, this is irrelevant to a *single individual* playing sequentially. Your single instance has a near-certainty of ruin. Rationality concerns the outcome for *this* decision-maker over *this* sequence of bets, not an abstract average across hypothetical clones who might win big while you go broke.

  2.  **The "Fixed Fraction" Friend:**
      *   **The Argument:** Betting a fixed percentage (e.g., 5%) of your *current* bankroll each time prevents ruin and allows compounding.
      *   **The Strength:** This strategy directly addresses the flaw of the "bet it all" approach:
          *   **Avoids Ruin:** Since you only bet a fraction, you can never lose everything in a single bet. Your bankroll can shrink but never hit zero.
          *   **Compounding Growth:** Wins increase your bankroll, meaning your bet size (in dollars) grows when you win, accelerating potential growth. Losses decrease your bankroll, meaning your bet size (in dollars) shrinks when you lose, mitigating damage.
          *   **Focus on Long-Term Growth:** It implicitly prioritizes the *growth rate* of your wealth over the long run rather than the EV of the next single bet.
      *   **The Missing Justification (Why it's *Rational*):** Your friend is intuitively using a strategy aligned with maximizing the **expected geometric growth rate** of wealth (also called maximizing the **expected logarithm of wealth**). This is the core of the **Kelly Criterion**.

  3.  **The Rational Middle Ground: The Kelly Criterion**
      *   **The Insight:** In repeated bets with positive EV, the *truly rational* goal isn't maximizing the expected value of your next dollar profit *or* simply avoiding ruin. It's **maximizing the long-term growth rate of your wealth.** This balances exploiting your edge with managing risk.
      *   **The Math:** For a simple bet where you risk `$B` to win `$W` (net profit `$W` if you win, loss `$B` if you lose) with win probability `p`, the Kelly fraction `f*` of your bankroll to bet is:
          `f* = (p * W - (1 - p) * B) / (B * W)` OR more commonly simplified to `f* = p - (1 - p) / (W/B)`
          Where `W/B` is the "odds" received (e.g., 2-to-1 odds means `W/B = 2`).
          `f* = (Edge) / (Odds)` (Where Edge = p * (W+B) - B, the expected profit per dollar staked).
      *   **Why Kelly is Rational (for this context):**
          *   **Maximizes Long-Term Growth:** Betting `f*` maximizes the expected logarithm of wealth over the long run. This leads to the highest possible compound growth rate.
          *   **Dominates Other Strategies:** In the long run, Kelly almost surely outperforms any other significantly different strategy. No other strategy grows wealth faster asymptotically.
          *   **Balances Growth & Risk:** It explicitly considers both your edge (`p`) and the riskiness of the bet (the ratio `W/B`). A larger edge or better odds justifies a larger fraction; a smaller edge or worse odds demands a smaller fraction. Betting *more* than Kelly increases your risk of ruin without increasing your long-term growth rate. Betting *less* than Kelly reduces your risk but sacrifices potential growth unnecessarily.
          *   **Prevents Ruin:** As long as `f* < 1` (which it always is for finite odds), the probability of ruin is zero. Your bankroll can get very small, but never zero.

  4.  **Addressing Your Core Questions:**
      *   **Is "Max EV Every Time" Rational?** **No, not for repeated betting with multiplicative outcomes.** It ignores the catastrophic risk of ruin and the multiplicative nature of wealth building. Its high expected value calculation is a mathematical mirage for a sequential player, as ruin is almost certain.
      *   **Is "Fixed Fraction" Rational?** **It's significantly *more* rational than "bet it all" because it avoids ruin and allows compounding.** However, a *fixed* fraction (e.g., always 5%) is only *optimally* rational if it happens to match the Kelly fraction for every bet you face. If your edge or the odds change week to week, a rigid fixed fraction is suboptimal. Rationality demands adjusting the fraction based on the specific characteristics of *each* positive EV opportunity (i.e., using the Kelly formula or a fraction thereof).
      *   **Does Rationality Say More Than "Positive EV"?** **Absolutely Yes!** Rationality in repeated decision-making under uncertainty requires considering:
          *   **Risk of Ruin:** Can the strategy lead to permanent exclusion from future opportunities?
          *   **Wealth Dynamics:** Are outcomes multiplicative (bankroll-based bets) or additive (fixed-size bets independent of wealth)? Multiplicative dynamics demand different strategies.
          *   **Time Horizon:** Are you making one bet, a few bets, or potentially an infinite sequence?
          *   **Utility:** Is your goal simply maximum expected terminal wealth? Or do you care about the *path* (e.g., avoiding large drawdowns)? Kelly maximizes long-run growth, but if you are extremely risk-averse regarding temporary losses, you might rationally bet *less* than Kelly (this maximizes a different utility function).
          *   **The Goal:** Maximizing single-bet EV, maximizing long-term wealth growth, or minimizing the probability of any loss are different goals requiring different strategies.

  **Conclusion:**

  *   Your "bet it all" friend is mistaken. His strategy is irrational for sequential betting because it guarantees eventual ruin despite positive EV per bet. The "parallel universes" argument is a red herring for a single actor.
  *   Your "fixed fraction" friend is intuitively grasping a crucial rational principle: **bankroll management to avoid ruin and harness compounding.** Her strategy is *more* rational than betting it all. However, a truly rational approach refines this by calculating the **optimal fraction (Kelly fraction) for *each specific bet*** based on its edge and odds, maximizing long-term wealth growth.
  *   **Rationality demands considering bet sizing.** Positive EV is a necessary condition for a bet to be worth taking, but it is *not* sufficient for determining *how much* to bet. The Kelly Criterion provides the gold standard for sizing bets in repeated, favorable gambling/investment scenarios where the goal is maximizing long-term wealth growth. It shows that bet sizing is **not merely a matter of personal taste**; it's a mathematically optimizable component of rational decision-making under repeated uncertainty.
