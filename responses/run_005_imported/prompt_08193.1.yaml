  Here’s a draft that threads the needle: warm, personal, scientifically *accurate* without being clinical, with a clear nod to her field that won’t lose the room. The key is grounding the science in the *human* experience of commitment.

  **The Toast:**

  (Start with warmth, raise your glass slightly)

  "For those who don’t know me, I’m [Your Name], [Sister's Name]’s deeply proud, slightly terrified, and currently speech-giving little sister. [Sister's Name], you look absolutely radiant tonight. And [Partner's Name], you clean up pretty well too! Seriously, seeing the two of you together, so happy and so *yourselves*, is just wonderful.

  Now, anyone who knows my sister knows she has a mind like a steel trap – a very *specific* kind of steel trap designed to catch logical fallacies and under-supported arguments. Especially if they involve fluffy sentiments about, say, love or commitment. [*Light laugh*] Growing up, trying to win an argument with her was like trying to arm-wrestle a mountain. You learned pretty quickly that if you were going to say something meaningful, it had better have some solid ground underneath it.

  Which brings me to peacocks. Bear with me! [*Smile*] See, my brilliant sister spent years studying animal behavior, specifically this fascinating idea about ‘costly signals.’ The gist is that in nature, sometimes the most believable proof of something – like a peacock’s health and good genes – isn’t a whisper, but a shout. It’s the ridiculously huge, cumbersome, energy-sucking tail. Why? Precisely *because* it’s so expensive, so hard to maintain. Only a truly fit peacock can afford that tail. It’s an honest signal because it’s too costly to fake.

  [*Pause, shift focus*] And when I think about that idea, and then I look at what we’re all celebrating today – this commitment you two are making – I don’t see peacock tails. But I *do* see something profoundly honest in the *cost* of it all.

  Because let’s be real: a wedding is costly! The planning, the stress, the sheer logistics... [*Gesture around*] ...all this! But that’s just the tiny, glittery tip of the iceberg. The *real* cost, the deep investment, comes after today. It’s in the vulnerability of truly letting someone see you, flaws and all. It’s in choosing patience on a Tuesday morning when you’re both running late. It’s the effort to understand, *really* understand, each other’s weird little worlds – even if one of those worlds involves debating the finer points of animal signaling theory over breakfast. [*Nod/wink at lab table*]

  It’s the willingness to put in the hard work, year after year, not because it’s easy, but because *this person is worth it*. That effort, that daily choice, that vulnerability… that’s the cost. And that cost? That’s what makes the signal of your commitment so incredibly powerful, so believable. It’s not about grand gestures all the time; it’s about the quiet, consistent investment that only someone genuinely committed would – or *could* – make.

  [*Shift to direct address to the couple*] [Sister's Name], you taught me that the cost isn't the embarrassing part of the signal; it's the *proof*. And [Partner's Name], the way you look at my sister, the way you champion her brilliance (even when it's intimidating!), and the effortless way you fit into our chaotic family… you prove every day that you’re willing and able to meet that cost. You both do. Your commitment isn't just words today; it's built on a foundation of countless choices, sacrifices, and shared moments that are far too 'expensive' in effort, time, and heart to ever be faked. That’s the real, honest signal. And it’s breathtaking to witness.

  So, to my incredible sister and her amazing partner: May your marriage be filled with joy, laughter, and endless fascinating conversations. May you continue to choose each other, invest in each other, and build a life together where the costs only deepen the incredible value of what you share. Your love isn’t *just* biology; it’s a magnificent, uniquely human testament to the power of choosing commitment, day after costly, wonderful day.

  Raise your glasses everyone! To [Sister's Name] and [Partner's Name] – may your honest signals always shine bright!"

  **Why This Works:**

  1.  **Personal & Warm:** Starts and ends with genuine affection and personal anecdotes. Grounds the science in their relationship and your perspective as her sister.
  2.  **The Science Nod:**
      *   **Accurate:** Correctly frames costly signals as honest *because* they are hard to fake, using the classic peacock example. Doesn't confuse handicaps with indices.
      *   **The Lab-Mate Wink:** The line *"even if one of those worlds involves debating the finer points of animal signaling theory over breakfast"* is pure gold for them. They'll know *exactly* what debates you're hinting at (Zahavi vs. Grafen, indices vs. handicaps) without you having to explain it. It shows you listened, it's insider-y, and it's affectionate.
      *   **Key Insight Landed:** Explicitly states the crucial point: "the cost isn't the embarrassing part... it's the *proof*." This directly addresses your core idea and shows understanding.
  3.  **Avoids Cynicism:** Explicitly says "Your love isn’t *just* biology." Focuses on the *human* aspects of choice, vulnerability, effort, and commitment. The cost is framed as emotional investment and daily choice, not just evolutionary strategy.
  4.  **Connects Cost to Marriage, Not Just Wedding:** Briefly mentions the wedding cost but swiftly pivots to the *real* cost being the lifelong commitment, effort, and vulnerability. This is the heart of it. Mentions "predicting marriage length" implicitly by focusing on the *ongoing* costs of commitment, which is the more relevant signal.
  5.  **Accessible Language:** Uses "costly," "investment," "effort," "vulnerability," "commitment" – words everyone understands. Avoids "handicap," "index," "Zahavi," "Grafen" directly. The peacock example is universally graspable.
  6.  **Tone:** Affectionate, slightly humorous (about her intellect), sincere, and celebratory. Not mushy, not textbook.
  7.  **Structure:** Clear flow: Personal intro -> Science intro (peacocks) -> Science applied to *their* commitment (cost = proof) -> Direct address to couple -> Heartfelt toast.

  **Delivery Tips:**

  *   **Practice:** Read it aloud several times. Time it. Aim for natural flow, not memorization. Know the key points well.
  *   **Eye Contact:** Connect with your sister and her partner during the direct address parts. Scan the room otherwise, especially the lab table during the "breakfast debate" line.
  *   **Pacing:** Don't rush. Pause after the peacock part, after the "cost is the proof" line, and before the final toast.
  *   **Humor:** Deliver the lines about her intellect and the breakfast debates with a warm, knowing smile. It should land as affectionate teasing.
  *   **Emotion:** Let your genuine love and pride for your sister come through, especially at the beginning and end.

  This toast respects her intellect, honors her field accurately without lecturing, speaks deeply to the nature of commitment, and keeps the focus firmly on the love and celebration. Good luck! You've got this.
