  so this got weirdly personal recently: my brother got hit with a fine a few months back and I just paid it for him, no big deal, nobody blinked. but the same case came with like a week in jail too, and obviously there was never any question of me doing that part for him. i've been stuck on that assymetry since, and then a friend sent me this short David Lewis paper (yes, the modal realism guy) called "Do We Believe in Penal Substitution?" where he makes the same observation - we're fine with a friend paying your fine but not serving your prison time - and argues this shows we're all secretly "of two minds" about penal substitution. his diagnosis: fines have a compensatory function, basically just making the victim/state whole again, so it doesn't matter where the money comes from - and he floats this as maybe giving some cover to the Christian doctrine that Christ was punished in our place.

  something about using the fine case to defend THAT doctrine feels backwards to me, but I can't nail down why. can you argue that the fine case is actually the worst possible analogy for penal substitution as atonement - that whatever makes fine-swapping ok is precisely what's missing from the crucifiction story, so following Lewis's own reasoning closely should actually make us MORE skeptical of the doctrine, not less. work through the disanalogy properly, don't just assert it.
reasoning: |-
