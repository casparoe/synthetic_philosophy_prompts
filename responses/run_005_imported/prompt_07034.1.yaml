  ### Commentary on the ranking:
  **S Tier: Non-Archimedean utilities**  
  Hyperreal or surreal numbers allow infinite sums to be rigorously defined while preserving completeness and cardinal comparisons. By representing utilities in a non-Archimedean field, divergences can be resolved without imposing agent-relative parameters or sacrificing anonymity. The cost is mathematical abstraction (e.g., ultrafilter dependence in hyperreals), but it directly addresses the core problem.

  **A Tier: Overtaking/catching-up criteria**  
  These criteria (from optimal growth theory) provide a consistent partial ordering that respects Pareto and anonymity by comparing utility streams in the limit. They avoid arbitrariness but fail to compare many worlds (sacrificing completeness), making them theoretically robust but practically limited.

  **B Tier: Spatiotemporal discounting**  
  Discounting utilities by distance (e.g., exponential discounting) restores a complete ordering and avoids divergence but fundamentally violates impartiality. The discount rate is arbitrary, reintroducing the agent-relativity aggregative ethics aims to eliminate.

  **C Tier: Causal/agent-relative restriction**  
  Limiting aggregation to causally accessible regions (e.g., the future light cone) recovers finite sums but abandons the totalist commitment to universal aggregation. It "solves" the problem by shrinking the scope rather than generalizing the solution.

  **D Tier: Lexical priority/density measures**  
  Approaches like lexical ordering (prioritizing some regions) or average utilitarianism (using density) avoid divergence but sacrifice core axioms: lexical orders violate anonymity, while averaging ignores total utility. Both fail to preserve the spirit of total utilitarianism.
