  Okay, the user is grappling with a philosophical puzzle about Hume's views on causality and how it relates to the modern Humean vs. anti-Humean debate on laws of nature. They've noticed a tension between two passages in Hume's Enquiry: one suggesting hidden powers exist but are inaccessible to us, and another claiming "power" and "connection" are meaningless concepts. They're wondering if these are reconcilable, and whether the contemporary "Humean" position (like Lewis's best-system account) truly honors Hume's intentions.

  First, I need to address the apparent contradiction in Hume's text. The first passage does sound oddly realist—mentioning a concealed power "actuating the whole machine." But the second passage is starkly eliminativist. The key is Hume's commitment to empiricism: anything not traceable to impressions is meaningless. So when he says power is "concealed," he means empirically inaccessible, not metaphysically real. His point is precisely that because we can't observe it, we can't meaningfully posit it. The "actuating" language is likely rhetorical, emphasizing how things appear to us versus what we can justify. 

  Scholars like Blackburn and Beebee read this as Hume rejecting the coherence of hidden powers, not affirming them. The tension resolves if we see the first passage as describing the illusion we have (that powers exist but are hidden) and the second as his conclusion (that this illusion stems from projecting our expectations). 

  As for the modern debate: even if Hume were only making an epistemic claim (we can't know necessitation), Lewis-style Humeans go further by asserting regularity is all there is metaphysically. But the debate wouldn't collapse if Hume turned out to be an epistemic skeptic. Modern Humeanism is a metaphysical position justified independently—simplicity, parsimony, avoiding mysterious necessitation. Claiming Hume as an ancestor is mostly rhetorical; the real weight lies in the arguments. Still, the "no impression, no idea" principle in the second passage clearly inspires the metaphysical deflationism of contemporary Humeans. 

  The user might also be wrestling with whether their Lewisian view is undermined if Hume wasn’t a full eliminativist. But Lewis’s account doesn’t rely on exegesis; it stands on its merits. The deeper need here could be for reassurance that their position remains tenable regardless of Hume’s intent—which it does. The historical connection is evocative, not foundational.
answer: |-
  You've hit upon one of the most enduring interpretive puzzles in Hume scholarship – the apparent tension between epistemic modesty and metaphysical eliminativism in his account of causation. Let's break this down step by step, drawing on scholarly consensus and the implications for the contemporary debate:

  ### Reconciling the Two Passages: The Standard Scholarly View
  1.  **The "Hidden Power" Passage (Part I):** This is **not** a concession to realism. Hume is describing the *illusion* fostered by constant conjunction – we *feel* as if there must be some hidden power "actuating the machine." His point is that *despite* this strong psychological compulsion, careful examination reveals **no empirical evidence** for such a power within the observable qualities of objects or events. The "power" remains "entirely concealed" *precisely because* it has no empirical correlate. He's setting up the problem his theory solves: why do we *believe* in powers when we never observe them?

  2.  **The "Loose and Separate" Passage (Part II):** This states Hume's **positive conclusion**. Having established that no impression (sensory or introspective) corresponds to "power" or "necessary connection," he applies his central empiricist principle (the "Copy Principle"): **no idea without a corresponding impression.** If there's no impression of power/connection, then the *idea* of power/connection lacks content. The words are "without any meaning" in the sense that they fail to denote any distinct impression or idea derived from one. Causation, objectively considered, reduces to "constant conjunction" – the regular succession of events.

  3.  **Resolution: Projectivism & the Shift to the Mind:** The key is recognizing where Hume *locates* the necessary connection. It's not "out there" hidden in nature. The impression of necessity arises *within us* as a product of custom or habit ("determination of the mind") after repeated observations of constant conjunction.
      *   *Part I* diagnoses the *illusion* of external power.
      *   *Part II* states the *positive account*: the *only* content for "necessity" comes from this internal feeling of expectation, projected *onto* the world. The "tie" we perceive is psychological, not metaphysical. Objects *are* "loose and separate"; the connection exists solely in our minds as a response to regularity.

  **Scholarly Consensus:** The dominant view (championed by interpreters like Norman Kemp Smith, Barry Stroud, Simon Blackburn, and Helen Beebee) is that Hume is a **metaphysical eliminativist** about *objective, mind-independent* necessary connections or powers. His project is to explain why we *think* there is such a thing, not to affirm its existence in a hidden form. The "hidden power" language in Part I is rhetorical, setting up the target of his critique. Part II gives his definitive, eliminativist conclusion. There *is* no further "feature of the world" beyond constant conjunction that constitutes causation.

  ### Does the Correct Reading Matter for the Contemporary Debate?

  **Yes, but not decisively.** Here's why:

  1.  **The Core of Humeanism:** Contemporary Humeanism (Lewisian or otherwise) is fundamentally committed to **metaphysical deflationism** about laws and causation:
      *   **Supervenience:** Facts about laws/causation supervene entirely on the Humean mosaic (the total pattern of particular matters of fact throughout space-time).
      *   **No Metaphysical Additives:** There are no irreducible modal properties (like necessitation), powers, dispositions, or governing relations *over and above* the mosaic.
      *   **Regularity at the Core:** Laws are (sophisticated) regularities within the mosaic (like Lewis's Best System).

  2.  **Hume as Inspiration vs. Authority:**
      *   **Inspiration:** Hume is undoubtedly the *inspiration* for this view. His relentless empiricism, rejection of occult powers, and reduction of causation to regularity provide the foundational *challenge* that anti-Humeans (like Armstrong) feel compelled to answer. Lewis explicitly situated his Best System account within the Humean tradition.
      *   **Authority:** However, contemporary Humeans don't *solely* rely on "Hume said so." They argue their position is *independently* motivated by virtues like **parsimony** (avoiding mysterious necessitation relations), **empirical adequacy** (explaining our observations without extra baggage), and **explanatory power** (providing a clear, naturalistic account of laws/causation within a broadly scientific worldview). The arguments for the Best System account stand or fall on their own merits.

  3.  **The Epistemic vs. Metaphysical Distinction:**
      *   **If Hume were *only* Epistemic:** Suppose Hume only argued we *cannot know* objective necessary connections, leaving open their *possible existence*. This *would* weaken the claim that Hume directly endorsed metaphysical deflationism. Anti-Humeans could argue they are positing precisely what Hume said we couldn't know, but which might still exist and explain the regularities.
      *   **Why it Matters Less Than You'd Think:**
          *   **The Empiricist Razor:** Hume's "no idea without impression" principle *is* a powerful tool *against* positing unknowable necessitation. Why posit something fundamentally unknowable and empirically undetectable? Contemporary Humeans inherit this methodological parsimony.
          *   **The Burden of Proof:** The core Humean argument remains: What *evidence* compels us to posit more than the mosaic and our psychological responses to it? Anti-Humeans bear the burden of showing why their metaphysical additives (necessitation, powers) are *necessary* and not just philosophical excess. Hume's epistemic skepticism highlights this burden.
          *   **Lewis's Point:** Lewis argued that even *if* there were Armstrongian necessitation relations, the *only way we could possibly know about them* would be through the regularities they produce. Therefore, the Best System account captures everything that could possibly be *evidentially significant* about laws. The necessitation itself becomes an idle metaphysical wheel, adding no explanatory value beyond the regularities it's invoked to explain. (This is a *controversial* point, but it shows how Humeanism can incorporate even an epistemic reading strategically).

  **Conclusion:**

  1.  **Interpretation:** The two passages are reconciled by understanding Hume as an **eliminativist** about objective necessary connection. The "hidden power" is an illusion generated by custom; the only legitimate content for "necessity" is the psychological feeling. Scholarly consensus strongly favors this reading.
  2.  **Claiming Hume:** Contemporary Humeans **can claim Hume as an ancestor in good conscience.** His core arguments – the critique of deriving necessity from experience, the reduction of objective causation to constant conjunction, the location of necessity in the mind, and the application of the Copy Principle – are the bedrock of the Humean tradition. While nuances exist, his work is fundamentally aligned with metaphysical deflationism about laws/powers.
  3.  **The Debate:** While an exclusively *epistemic* reading of Hume *might* provide a slightly different historical starting point, it **does not fundamentally alter the contemporary debate.** The core arguments for Humeanism (supervenience, parsimony, the critique of irreducible modality) and anti-Humeanism (the need for explanation, grounding counterfactuals, accounting for dispositions) stand independently. Hume's enduring legacy is establishing the profound challenge of justifying belief in objective necessity from experience, a challenge anti-Humeans continue to grapple with. The "Humean" label remains apt for Lewis and his successors.

  Your defense of Lewis stands firmly within the tradition Hume inaugurated. Your friend's anti-Humeanism, inspired by Armstrong, is precisely the *type* of view Hume sought to undermine. The train journey debate continues a conversation Hume started over 250 years ago!
