  can you write me a dialogue between two people who both know this litereature cold and land on opposite sides? one thinks SPIs are a real advance, since they don't require agreeing on a fair split, just on a change that's weakly better for everyone no matter what. the other thinks it's mostly sleight of hand: the "SPI selection problem" (you still have to coordinate on which improvement to make) just re-imports the original bargaining fight, "safe" is only ever safe relative to a default/threat point that's often already the product of power imbalances, and outside of literal program-equilibrium agents comparing source code nobody can actually verify the commitments anyway. set it wherever you like, doesn't matter much, but make them really engage with each other's strongest moves rather than talking past each other, and don't let either one concede just to give me a tidy ending.
