  Ah, and the psychological-spectrum gambit: Alex might propose a gradual brain-replacement scenario where "you" persist despite no original matter. Jamie could attack the vagueness—if identity fades gradually, when exactly does responsibility or self-concern lapse? Make Alex sweat over whether Relation R has thresholds.

  Endgame: Jamie lands the emotional punch—Earth-you is experiencing irreversible cessation. All Relation R does is create a successor; it doesn't negate that *this* subject's world is ending. Alex concedes unease but holds that fearing death is irrational if consciousness qualitatively continues elsewhere. Both walk away troubled. 

  Structure-wise: Open mid-conversation to avoid exposition dumps. Set them in the teletransporter control room post-scan, Earth-original on a medical bed visible through glass. Heighten stakes with physical decay—maybe Earth-person coughs weakly during their debate. Finally, no tidy synthesis; leave Jamie staring at the dying body while Alex watches Mars-replica's livestream, both haunted. 

