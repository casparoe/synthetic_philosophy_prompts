  Me and a friend got into it last night over superrationality -- properly derailed a dinner party over it, actually. She's convinced Hofstadter's whole "symmetry" move in the twin prisoner's dilemma is basically just smuggled-in Kantian universalizability wearing a game-theory costume, and that calling it "rational" at all is a bit of a cheat since you're not maximizing against the other player's actual strategy, your just assuming the hard part away by stipulating they reason exactly like you do. I tried defending it by pointing out the whole thing is only supposed to bite for genuinely identical reasoners (two copies of the same algorithm, two Hofstadters, whatever), which is exactly why it's interesting for stuff like AI agents or evolved cooperators rather than being some general fix for prisoner's dilemmas between random strangers. We went in circles for like two hours, dragged in the Luring Lottery at some point, argued about whether the whole thing is secretly just evidential decision theory's one-boxing intuition in a different hat, and never resolved a thing. Typical.

  Anyway I want to end the night on a lighter note than "we yelled about decision theory til 1am," so can you write me a joke about superrationality? Not a generic "two rationalists walk into a bar" bit -- I want the actual punchline to hinge on the mechanics of the theory itself (the identical-reasoners/symmetry assumption, the "they'll cooperate because they'll do whatever I do" move, how its supposed to be different from naive Kantianism or from just computing the Nash equilibrium, etc), so it'd land for someone who's actually read the Hofstadter material and fall completely flat for someone who just knows "prisoner's dilemma" as a pop-sci buzzword.
