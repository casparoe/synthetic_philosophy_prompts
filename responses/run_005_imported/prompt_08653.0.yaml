  The theorem says that under these conditions, the offer to trade itself would cause agents to update their beliefs and no trade would occur. But in reality, there is massive trading volume. We are to rank the reasons by their real explanatory weight.

  Common resolutions:
  1. Heterogeneous priors: Without a common prior, agents might genuinely disagree even after updating, leading to trade.
  2. Noise traders: Some traders are not rational (e.g., trading for exogenous reasons, like liquidity needs or irrationality) and provide the "other side" of the trade.
  3. Liquidity/hedging demand: Traders might trade to adjust their portfolio for non-informational reasons (e.g., rebalancing, meeting cash needs).
  4. Overconfidence: Traders overestimate the precision of their private information, leading them to trade when they shouldn't.
  5. Failures of common knowledge of rationality: If agents aren't sure that others are rational, they might not update as the theorem suggests.
  6. Grossman-Stiglitz-style costly information acquisition: Since information is costly, not all agents are equally informed, and the market does not fully reveal information, so trade can occur.

