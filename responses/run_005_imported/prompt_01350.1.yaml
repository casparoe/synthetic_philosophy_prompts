answer: |-
  Your question cuts to the heart of how we engage with complex historical figures in philosophy. This isn't just a footnote dilemma; it's grappling with the uncomfortable entanglement of profound intellectual achievement and deeply abhorrent personal beliefs. Your inference involves several distinct layers that need careful separation:

  1.  **Thematic Parallel vs. Logical Entailment:**
      *   **Parallel Exists:** Your observation of a *thematic* parallel—a shared temperamental preference for order, hierarchy, objectivity, and aversion to perceived chaos/relativism—is perceptive and plausible. Frege's personality likely manifested in both his philosophical rigor and his political intolerance. Scholars like Hans Sluga ("Frege: The Early Years" and "Frege: The Later Years") explicitly argue for connections between Frege's philosophical context and his political environment.
      *   **Entailment Does Not Hold:** Crucially, the *logical entailment* you worry about ("it seems to follow that the sense/reference distinction... is not neutral... but is... expressive of the politics") does **not** hold. The philosophical concepts themselves (objective thoughts, anti-psychologism, mind-independent meaning) do not *logically necessitate* anti-democratic or antisemitic political views. They are logically consistent with a wide range of political positions, including robust pluralism and liberalism. Many philosophers committed to objectivity and anti-psychologism (e.g., logical positivists, many contemporary analytic philosophers) hold diametrically opposed political views to Frege's diary entries.

  2.  **Motivation vs. Content:**
      *   **Motivation:** The *psychological motivation* driving Frege's philosophical work *might* share roots with the impulses fueling his bigotry. A deep-seated need for absolute order could have animated both. This is a biographical/psychological claim.
      *   **Content:** The *content* and *logical structure* of the sense/reference distinction, the concept of a "Thought," or the critique of psychologism, however, stand independently of that motivation. Their validity, utility, and meaning within logic, philosophy of language, and mathematics are evaluated based on arguments, coherence, and explanatory power, not the psychological state of their creator. The tools *work* for purposes Frege intended (and others he didn't) regardless of his personal flaws.

  3.  **"Contamination" and Neutrality:**
      *   **No Inherent Contamination:** The logical and semantic apparatus itself is not *inherently* contaminated. It functions as powerful, neutral technical machinery for analyzing meaning, reference, and logic. This is evidenced by its ubiquitous and successful use across diverse philosophical and linguistic traditions, often by thinkers vehemently opposed to Frege's politics.
      *   **Contextual Non-Neutrality:** However, your insight exposes the myth of *complete* neutrality. While the *tools* are technically neutral, the *historical context of their development*, the *temperament of their creator*, and the *specific way Frege framed their significance* (e.g., fighting against the "corrupting" influence of psychologism/skepticism, which he might have associated with democratic "relativism") are not neutral. Recognizing this context enriches our understanding of the *history* of these ideas and the *person* who formulated them, even if it doesn't invalidate the tools.

  4.  **The Confusion to Avoid:**
      *   **Genetic Fallacy:** The primary pitfall is committing the **genetic fallacy** – judging the truth, validity, or inherent meaning of an idea based solely on its origin (Frege's problematic psychology/politics). Finding the origin repugnant doesn't automatically make the idea false or unusable.
      *   **Conflation of Domains:** Conflating the *domain of application* (logic, meaning) with a *completely different domain* (politics, social organization). What constitutes valid order and objectivity in logic is fundamentally different from what constitutes a just or desirable political order. Frege's failure was in applying an inappropriate model of "order" to the political sphere, not necessarily in his model for logic.

  **What This Means for Your Dissertation:**

  1.  **Don't Panic or Dismantle:** You are not building your dissertation on rotten foundations. The technical apparatus of sense/reference *works* for its intended philosophical purposes within its domain. Your analysis of Frege's *philosophy* remains valid.
  2.  **Acknowledge the Discomfort:** Ignoring the diary feels intellectually dishonest, especially given its thematic resonance. Suppressing your unease will hinder your work.
  3.  **Strategic Inclusion (Beyond a Footnote):** While a footnote acknowledging the existence and nature of the diary is the *minimum*, your insight deserves more nuanced treatment. Consider:
      *   **A Brief Methodological Section:** In your introduction or a relevant chapter (perhaps discussing Frege's motivations, context, or the stakes of anti-psychologism?), dedicate a few paragraphs (1-2 pages max). State the facts of the diary, acknowledge Dummett's shock and your own discomfort. Explicitly address the thematic parallel you perceive *as a historical/biographical observation*.
      *   **Crucial Distinction:** Immediately follow this by drawing the distinction you've worked through here: "While this thematic resonance is unsettling and demands historical attention, it is essential to separate the biographical context and psychological motivations of the author from the logical content and philosophical validity of the concepts of sense, reference, and objective Thoughts developed in his *logical* and *semantic* works. The latter operate within a specific domain and their utility and coherence are evaluated on philosophical grounds independent of Frege's personal political convictions." Cite Sluga if relevant to your argument.
      *   **Why This Matters:** Briefly explain *why* you're mentioning it – intellectual honesty, grappling with the complex legacy of a foundational figure, acknowledging that philosophy doesn't arise in a vacuum, but reaffirming the autonomy of the philosophical analysis you are undertaking.
  4.  **Focus for Now:** Your dissertation's primary task is to explicate and engage with Frege's *philosophical work* on sense and reference. Don't let the diary derail your core argument. This is a *contextual* and *meta-philosophical* point, not the core of your technical analysis.
  5.  **Future Work:** This could seed fascinating future work: a deeper exploration of the historical context of objectivity in logic vs. politics, or how anxieties about "relativism" manifest in different domains. But that's for later.

  **Conclusion:** Your perception of a thematic parallel is astute and historically significant. However, the inference that this *logically contaminates* or invalidates the sense/reference distinction as a technical philosophical tool **is a confusion** (specifically, risking the genetic fallacy and conflation of domains). The philosophical concepts retain their analytical power and neutrality *within their proper domain*, even as we must acknowledge and condemn their creator's reprehensible views and recognize that his temperament influenced his framing of the *stakes* of his work.

  Address it honestly and succinctly in your dissertation, drawing the crucial distinction, then proceed with your rigorous philosophical analysis. This demonstrates intellectual maturity and historical awareness without compromising your core argument.
