prompt: |-
  Write a dialogue between a Lewisian counterfactual theorist and a Woodward-style interventionist about causation, where they get into the charge that interventionism is secretly circular -- an "intervention" is itself defined in causal terms (it has to cause the variable you're manipulating, and not affect the effect except through that variable), so causation seems to be doing work inside the analysis of causation. Have the interventionist actually engage with that instead of dodging it, and push the Lewisian on whether their own view is any less rigged, since Lewis's similarity ranking over possible worlds has been accused of being reverse-engineered just to secure the right causal asymmetry. Then get them to duke it out over a standard late-preemption case -- Suzy and Billy both throw rocks at a bottle, Suzy's rock gets there first -- and see whose account actually handles it more cleanly. I want real back-and-forth, not two people politely talking past eachother; neither side should be a pushover.
