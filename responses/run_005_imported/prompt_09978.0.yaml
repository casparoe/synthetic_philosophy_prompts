answer: |-
  Below is a self-contained example demonstrating a money pump for an agent whose preferences violate the independence axiom (à la Allais Paradox) in a dynamic setting. I'll provide a decision tree with concrete lotteries and payoffs, show how the **naive** agent gets pumped, and how **resolute** and **sophisticated** agents avoid it. Finally, I'll address the philosophical status of "resolute choice."

  ---

  ### **Background Setup: Violating Independence**
  Recall the Allais Paradox preferences:
  - **Lottery A**: $1,000,000 with certainty  
  - **Lottery B**: 89% chance $1,000,000, 10% chance $5,000,000, 1% chance $0  
    *Most people prefer A > B*  
  - **Lottery C**: 11% chance $1,000,000, 89% chance $0  
  - **Lottery D**: 10% chance $5,000,000, 90% chance $0  
    *Most people prefer D > C*  

  This violates expected utility theory's independence axiom: Adding a common outcome (89% chance of $0) reverses preferences between A/B and C/D.

  ---

  ### **Decision Tree: The Money Pump Sequence**
  **Structure**: A 3-stage dynamic choice with small fees ($ε). Total payoffs are in utils (u), assuming linear utility (e.g., $1,000,000 = 1u, $5,000,000 = 5u, $0 = 0u). Fee ε = 0.01u (small enough to not alter preferences).  

  ```
  Time 0          Time 1                  Time 2
  ┌───────────────┬───────────────────────┬───────────────────────┐
  │    Choose:    │                       │                       │
  │   • PATH α    │  [If chose α at T0]:  │  [If paid ε at T1]:   │
  │     (Plan A)  │     • Keep A:         │     • Choose:         │
  │   • PATH β    │         Get A         │        • γ: Get C     │
  │     (Plan B)  │     • Pay ε →         │        • δ: Get D     │
  │               │         Unlock choice │                       │
  │               │         between C/D   │  [After choosing δ]:  │
  │               │                       │     • Keep D          │
  │               │                       │     • Pay ε → Get A   │
  └───────────────┴───────────────────────┴───────────────────────┘
  ```

  #### **Concrete Lotteries** (Allais-consistent preferences):
  - **A**: 100% chance **1u** ($1,000,000)  
  - **B**: 89% chance 1u, 10% chance 5u, 1% chance 0u → *EV = 1.39u*  
  - **C**: 11% chance 1u, 89% chance 0u → *EV = 0.11u*  
  - **D**: 10% chance 5u, 90% chance 0u → *EV = 0.50u**  

  **Preference violation**: A > B (due to certainty effect), but D > C (risk-seeking for high stakes).

  ---

  ### **How the Naive Agent Gets Pumped**
  The **naive agent** does not anticipate future choices and re-optimizes myopically at each node.  
  - **Time 0**: Chooses PATH α (Plan A) because A > B.  
  - **Time 1**:  
    - Sees choice: *Keep A (1u)* vs. *Pay ε to unlock choice between C/D*.  
    - Since D > C (and D > A? No!), but *the agent values the **option** to choose D over C*:  
      - At this node, the agent compares:  
        - Certainty of A (1u) vs.  
        - Paying ε to get a lottery where they will later choose D (which they value > C).  
      - Due to the Allais violation, the agent *overvalues the chance to "gamble"* in the C/D context. They pay ε.  
  - **Time 2**:  
    - Chooses δ (Get D) because D > C.  
    - Now faces: *Keep D* vs. *Pay ε to switch back to A*.  
    - **Key insight**: Now directly comparing D and A, the agent prefers A > D (since A is certain and D is risky). They pay ε to switch back to A.  

  **Result**:  
  - Ends with A, but paid ε twice (**total payoff = 1u - 2ε**).  
  - If they kept A at Time 0, they’d have 1u.  
  - **Exploitation**: They paid 2ε for nothing.  

  ---

  ### **How Resolute and Sophisticated Agents Block the Pump**
  #### **Resolute Agent** (McClennen)  
  - **Strategy**: Commits at Time 0 to a *complete plan* and ignores future temptations.  
  - **Action**:  
    - At Time 0, chooses PATH α and commits to *never paying any fees*.  
    - At Time 1, rejects the offer to pay ε.  
  - **Result**: Gets A with 1u. Avoids all fees.  

  #### **Sophisticated Agent**  
  - **Strategy**: Anticipates future choices and optimizes backward.  
  - **Backward induction**:  
    - **Time 2**: If they have D, they will pay ε to switch back to A (since A > D).  
    - **Time 1**: If they pay ε, they will choose D at Time 2, then pay another ε to get A. Net cost: 2ε for the same outcome.  
    - **Time 0**: Compares:  
      - PATH α: Net payoff = 1u - 2ε  
      - PATH β: Get B (EV = 1.39u)  
    - Chooses PATH β (Plan B) to avoid exploitation.  
  - **Result**: Gets B with 1.39u (better than 1u - 2ε).  

  ---

  ### **Philosophical Evaluation: Is Resolute Choice a Principled Fix?**
  #### **Arguments for "Principled"**  
  1. **Temporal consistency of plans**: Resolutism treats the agent as a unified entity over time, respecting their initial evaluation of outcomes. It avoids self-sabotage by refusing to re-evaluate decisions in isolation.  
  2. **Avoids regress**: Sophistication can lead to preemptive avoidance of rational choices (e.g., choosing B despite preferring A). Resolutism preserves the agent’s true preference (A > B).  
  3. **Practical rationality**: In real life, we commit to plans (e.g., retirement savings) to avoid predictable future impulsivity.  

  #### **Arguments for "Defining the Problem Away"**  
  1. **Ignores changing information**: Resolutism assumes no new information justifies re-evaluation. If preferences *genuinely* change at Time 1 (e.g., due to context), commitment may be irrational.  
  2. **Inconsistent with revealed preference**: At Time 1, the agent *does* prefer paying ε for D over keeping A. Resolutism overrides this local preference.  
  3. **Implausible self-control**: Requires unrealistic commitment mechanisms (e.g., binding contracts).  

  #### **Synthesis**  
  Resolutism is **principled if rationality is holistic** (preferences over entire life plans), but **defines away the problem if rationality is local** (preferences at choice nodes). It reframes dynamic inconsistency as a failure of *willpower*, not logic. McClennen defends it as "plan-based rationality," while critics (e.g., Machina) argue it dodges the normative challenge of inconsistent preferences.

  ---

  ### **Key Takeaway for Your Piece**
  This example shows how dynamic inconsistency (even without cyclic preferences) enables money pumps. Naive agents lose through piecemeal choices, while resolute agents "win" by commitment and sophisticated agents by strategic avoidance. Resolutism’s philosophical status hinges on whether rationality is **global** (resolute) or **local** (sophisticated/naive). The debate mirrors real-world tensions between discipline and flexibility.
