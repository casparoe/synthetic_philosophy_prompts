  *scribbles notes* For the justification question, I'll frame it as a naturalistic challenge: if attitudes evolved contingently, why privilege them? Anticipating the "panicky metaphysics" brush-off, the follow-up will question if that dismissal itself relies on unexamined commitments. For the exemption question, I'll use the concrete example of childhood trauma disclosures in court - does Strawson's theory force us to view such offenders as broken mechanisms? The follow-up probes if this reveals a hidden determinism in the theory itself. For Watson's problem, I'll cite genocidaires where we simultaneously condemn and pathologize, asking if this fractures Strawson's framework. The follow-up will press whether such cases demand gradations of responsibility.

