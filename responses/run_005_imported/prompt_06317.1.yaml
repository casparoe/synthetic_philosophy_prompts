  I should emphasize that the user isn't Priya's therapist or accountability coach. There's only so much responsibility they can reasonably take here. Maybe suggesting they help Priya set up systems that don't put the user in the "bad cop" role would be helpful. Digital savings tools or financial counseling resources could maintain the support without the emotional burden. 

