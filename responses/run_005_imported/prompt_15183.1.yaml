  Hmm, his frustration with the "both have their place" answer is clear. He's encountered that in his reading group and wants me to push further. The key is to acknowledge the strengths of each view but then decisively argue why one framework is more coherent or productive. 

  I recall his examples: malfunction (Cummins struggles with it), new mutations (etiological view seems to say no function yet), and feathers (which function is "real"?). ENCODE is perfect because it forces the question: when molecular biologists say "functional," do they mean biochemical activity or selected purpose? 

  For the etiological view, I should emphasize how it resolves ENCODE's overreach—binding sites without selection aren't truly functional. But I need to tackle those counterexamples head-on. A new mutation can be functional if we consider its propensity for selection, not just past selection. Exaptations? The current maintaining selection matters most—flight maintains feathers now, not insulation. 

  For malfunction, the etiological view handles it elegantly: a heart valve has the function of preventing backflow because that's what it was selected for, even when it fails. Cummins' view can't explain why we say it's malfunctioning rather than just having a new "function" of leaking. 

  The deeper issue is that biology studies evolved systems. Purposive language isn't just convenient; it's ontologically grounded in natural selection. When ENCODE called everything "functional," it diluted the term's explanatory power. A selected-effects definition recenters biology on adaptation while accommodating exaptations via current utility. 

