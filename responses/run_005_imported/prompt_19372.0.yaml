prompt: |-
  For my high school's philosophy club, I've been working through Nick Bostrom's writing on anthropic reasoning, and I'd like to bring something sharper than the standard summary to our next meeting. Could you compare the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) directly, explaining what each implies about the Doomsday Argument, and why the Presumptuous Philosopher thought experiment is supposed to count against one of them but not the other? I'm also curious whether the reference class problem usually raised against SSA has any real counterpart under SIA, or whether that's more of a rhetorical asymmetry than a substantive one. Please close with your own verdict: is either assumption defensible as it stands, or should anthropic reasoning be built on some other foundation entirely?
