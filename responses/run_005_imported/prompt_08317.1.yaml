answer: |-
  Here is a dialogue between two Marx scholars, **Dr. Woodson** (representing Allen Wood's perspective) and **Dr. Husamir** (representing Ziyad Husami's perspective), engaging directly with each other's textual evidence and arguments:

  ---

  **Setting:** A university seminar room after class. Coffee cups are scattered on the table.

  **Dr. Woodson:** Alex, I appreciate your passion in today’s seminar, but I remain convinced that attributing a *conception of injustice* to Marx’s critique of capitalism fundamentally misreads him. Let’s start with the core: Marx explicitly states in *Capital* that the worker is paid the "full value" of their labour-power. The transaction is "fair" by capitalist standards. To condemn it as unjust, Marx would need an *external* standard of justice—but historical materialism rejects that. Justice is immanent to the mode of production. Remember his scorn for "obsolete verbal rubbish" about "fair distribution" in the *Gotha Critique*? He calls such talk "ideological nonsense." How do you reconcile that with your theft narrative?

  **Dr. Husamir:** Elena, I agree Marx mocks *bourgeois* moralizing, but that’s precisely the point! He’s rejecting *capitalism’s* standard of justice—not justice *as such*. When he calls surplus-value appropriation "robbery," "theft," or "embezzlement" (*Capital*, Vol. I, Ch. 24), he’s deploying moral language *transcending* capitalism. This isn’t accidental; it’s systematic. Historical materialism doesn’t forbid normative critique—it grounds it in the *immanent potential* of a higher mode of production. The "theft" charge only makes sense judged by communism’s standard: "from each according to ability, to each according to need." That’s Marx’s *actual* standard of justice.

  **Dr. Woodson:** But that’s circular! If communism hasn’t yet emerged, how can it generate a valid "standard" for judging capitalism? Marx’s historical method insists that "right can never be higher than the economic structure of society" (*Gotha*). The "theft" language is *descriptive*, not normative: it reveals the *structural violence* of exploitation—workers are forced to sell labour-power, and capitalists *must* extract surplus to survive. But calling it "unjust" implies a universal moral law, which Marx ridicules. In the *Grundrisse*, he even notes that slavery appears "unjust" *after* bourgeois society emerges—but not before. Capitalism’s "injustice" is only visible *post-hoc*, from communism. Until then, it’s "fair."

  **Dr. Husamir:** You’re conflating two things: Marx’s *analysis* of capitalism’s self-justification and his *endorsement* of it. When he calls exploitation "theft," he’s not describing a neutral mechanism—he’s condemning it. And he *does* have a standpoint: the revolutionary proletariat, whose interests align with communism. In *Wage Labour and Capital*, Marx says the worker is "robbed" of creative fulfillment. This isn’t just "alienation"—it’s a *wrong*. If Marx truly thought capitalism was "just" by its own standards, why use morally loaded terms? Why not just call it "exploitation" and leave it at that? The *persistence* of the theft metaphor proves he’s making a normative claim.

  **Dr. Woodson:** Because "theft" is a *rhetorical* device to expose hypocrisy! Capitalists *claim* their system is based on freedom and equality, but Marx shows it rests on exploitation. He uses *their* language to reveal the contradiction. But he doesn’t appeal to a communist "justice" to do so. His real indictment is that capitalism *alienates* human potential. In *Economic and Philosophic Manuscripts*, he laments how labour under capital is "external to the worker"—not that it’s "unjust." Alienation is a *social pathology*, not a juridical category. Justice-talk distracts from the materialist core: capitalism’s *inefficiency* and *contradictions* doom it, not its "immorality."

  **Dr. Husamir:** Then why does Marx call the extraction of surplus labour "a piece of cheating" (*Capital*, Vol. I, Ch. 19)? "Cheating" implies fraud—a violation of accepted norms. And what "accepted norm" could he mean but the communist principle? Alienation *is* the injustice! When the worker is alienated from their "species-being" (*Gattungswesen*), it’s a *moral* injury. Historical materialism *allows* for this: the proletariat’s revolutionary consciousness *generates* the new standard. As Husami argued, Marx’s critique is "immanent" because communism grows *from* capitalism’s contradictions. The "higher mode of production" isn’t external—it’s latent in the present, giving us the vantage point to condemn capitalism as unjust *now*.

  **Dr. Woodson:** But Marx never explicitly grounds his critique in "justice." Even in *Capital*, he says exploitation is "not a violation of the law of exchange" (Ch. 7). The theft metaphors are vivid, but they’re part of his *exposé* of capitalism’s essence—not an appeal to transhistorical ethics. If he truly condemned capitalism as unjust, why dismiss the Gotha Programme’s call for "fair distribution" as "vulgar socialism"? He insists the focus should be on transforming the *mode of production*, not moralizing. That’s the scientific core: critique the system, not its "fairness."

  **Dr. Husamir:** Because the Gotha Programme’s "fairness" was *bourgeois*—it demanded "equal right" within capitalism, which Marx knew was impossible. His objection wasn’t to morality *per se*, but to *reformist* morality. When he envisions communism, he *does* endorse a distributive principle: "to each according to need." *That’s* his standard. When he calls capitalist accumulation "usurpation" (*Capital*, Vol. I, Ch. 26), he’s judging it by the standard of a society where appropriation serves human need, not profit. The textual evidence is overwhelming: Marx condemns capitalism *as* unjust—by the light of the future it makes possible.

  **Dr. Woodson:** ...And yet, if we take historical materialism seriously, that "light of the future" can’t judge the past until it’s realized. Until then, Marx’s task is analysis, not moral indictment. The theft language is polemic—not theory. The real crime of capitalism isn’t that it’s "unjust"; it’s that it stifles human flourishing. That’s the critique that endures.

  **Dr. Husamir:** And I’d argue that to stifle human flourishing *is* the greatest injustice—precisely what Marx believed. But we’ll let the texts keep arguing for us. Another coffee?

  **Dr. Woodson:** *[Smiles wryly]* Only if it’s not surplus-labor extracted from the barista.

  ---

  ### Key Points of Engagement:
  - **Woodson’s case:**  
    - Marx’s insistence on the "fairness" of wage-labour exchange under capitalism (*Capital*).  
    - Rejection of transhistorical justice (historical materialism).  
    - Dismissal of "justice" as ideological (*Gotha Critique*).  
    - Theft metaphors as rhetorical/descriptive, not normative.  
    - Alienation, not injustice, as the core critique.  

  - **Husamir’s case:**  
    - Systematic use of moral language ("theft," "robbery") implies condemnation.  
    - Communism’s standard ("to each according to need") as immanent criterion.  
    - Exploitation as a "wrong" judged by the future society.  
    - Rejection of *bourgeois* justice ≠ rejection of *all* justice.  
    - Proletarian standpoint generates the normative standard.  

  Both scholars ground their positions in Marx’s texts while directly challenging the other’s evidence—reflecting the enduring tension in Marx’s work between descriptive analysis and implicit normative outrage.
