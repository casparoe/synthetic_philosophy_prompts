  First, I need to recall Moore's arguments in the "Ideal" chapter. Moore identifies two intrinsic goods: personal affection and aesthetic appreciation. He describes them as "organic unities," meaning their value isn't just the sum of parts but the combination itself. The protagonist claims that Moore values personal affection more because the loved person has intrinsic value, unlike a painting. Is that supported by the text?

  Looking at Moore, he does emphasize that in personal affection, both the emotion and the object (the person) are valuable. The person's existence and qualities contribute to the overall value. For aesthetic appreciation, the object (the beautiful thing) is part of the goodness, but its value is in being contemplated, not necessarily intrinsic outside that context. So the protagonist has a point here. Moore explicitly states that personal affection is the *greatest* good because the object is a person with intrinsic value. That's a direct quote from the text.

  But wait, the user wants to know if she's cherry-picking. While Moore does rank personal affection higher, he still considers both as great goods. The protagonist might be downplaying the importance of aesthetic appreciation to justify her choices. Moore sees both as necessary for an ideal state. So her argument is valid on the ranking, but she might be ignoring that both are essential.

