  I'm drafting a novel loosely inspired by the Bloomsbury set, and my protagonist is a painter who keeps quoting Principia Ethica at dinner parties to defend leaving her husband for a woman and a life of painting. Shes convinced Moore didn't just lump beauty and personal affection together as equally "the greatest goods," but actually ranked love and friendship higher, since the person you love has real intrinsic value in themselves while a beautiful painting doesnt. Is that a fair reading of what Moore actually argues in the Ideal chapter, or is she cherry-picking to flatter her own choices? Compare his treatment of the two "goods" and tell me which one, if either, comes out ahead in his own argument, and why - I want her reasoning to be sharp and specifically Moorean, not just vague aesthete talk.
