answer: |-
  Your protagonist has seized upon a **crucial nuance** in Moore's *Principia Ethica* (specifically Chapter VI, "The Ideal"), making her argument sharp and distinctly Moorean – *but* she's also engaging in a subtle, self-serving prioritization that Moore himself avoids explicitly stating as a strict hierarchy. Here's the breakdown:

  1.  **Moore's Core Argument (Organic Unities & Intrinsic Value):**
      *   Moore argues that the highest goods are "organic unities" – complex wholes whose intrinsic value is *greater* than the sum of the values of their parts considered separately. The parts derive their value *from* their place in the whole.
      *   He identifies two supreme goods:
          *   **Aesthetic Enjoyment:** The *consciousness* of beautiful objects.
          *   **Personal Affection:** The *love* of beautiful persons.
      *   Crucially, he states: *"By far the most valuable things, which we know or can imagine, are certain states of consciousness, which may be roughly described as the pleasures of human intercourse and the enjoyment of beautiful objects."* (Sec. 113)

  2.  **The Protagonist's Insight (Why She's Partly Right & Sharp):**
      *   **The Object's Value Matters:** Moore *does* explicitly argue that the *nature of the object* contemplated is vital to the value of the whole state.
          *   **Aesthetic Enjoyment:** The value lies in the *combination* of the beautiful quality of the object *and* the emotion directed towards it. The beautiful object *itself* has value, but *only* as an object of contemplation. Moore says: *"The beautiful object is an essential element in the whole of which we are considering the value..."* (Sec. 114). However, its value *outside* that state of contemplation isn't the focus here. Its intrinsic value *is* its beauty, but that beauty only realizes its *greatest* ethical value *when* consciously appreciated.
          *   **Personal Affection:** This is the *combination* of the emotion of love *and* the cognition of truly *lovable* mental qualities in the beloved person. Here's the key point your protagonist latches onto: *"The object of love is not merely beautiful, but possesses, in a high degree, the characteristic which, in Chapter IV, we distinguished as the most important of the intrinsic goods which we know—namely, that it is a complex whole, of great intrinsic value, in itself."* (Sec. 121 - emphasis added).
      *   **The Crucial Distinction:** Moore argues that in Personal Affection, the beloved person *themselves* possesses **intrinsic value independently** of being an object of contemplation. They are a "complex whole, of great intrinsic value, in itself." Their existence, their consciousness, their qualities – these *are* intrinsically good. The state of affection *includes* the appreciation of this independently valuable thing.
      *   **The Ranking Implication:** Moore explicitly states: *"It is the existence of this compound, composed of two *great* goods, *one of which is itself a highly complex organic unity*, that seems to constitute the reason why *Personal Affection* may be safely asserted to be *the* greatest *good* which we can know."* (Sec. 123 - emphasis added). He directly says Personal Affection is "the greatest good" *because* one of its components (the beloved person) is itself "a highly complex organic unity" of intrinsic value.

  3.  **Where She's Cherry-Picking (The Nuance Moore Maintains):**
      *   **"The Greatest Good" vs. "A Greater Good":** Moore calls Personal Affection "*the* greatest good" *in that specific passage*. However, he *never* downplays the supreme value of Aesthetic Enjoyment. He consistently treats them as the *two* supreme goods.
      *   **Interdependence in the Ideal:** Moore emphasizes that the *ideal state* would involve *both* goods in abundance. He doesn't advocate choosing one *over* the other ethically. He sees them as complementary pinnacles of value.
      *   **Value of the Aesthetic Object:** While the beautiful *object* (like a painting) doesn't have the *same kind* of independent intrinsic value as a person (its value is primarily realized in contemplation), Moore *does* attribute intrinsic value *to its beauty*. He states: *"We may... say that beautiful things... are *intrinsically* good..."* (Sec. 114). It *is* a good in itself, just of a different order than a conscious being. Your protagonist slightly downplays this to elevate her choice.
      *   **The "Lumping" Charge:** Moore *does* "lump" them together as the two supreme goods, repeatedly. He doesn't spend time arguing *between* them in a competitive sense after establishing their nature. He focuses on distinguishing them *from* other putative goods (pleasure, knowledge for its own sake).

  **Conclusion for Your Protagonist's Reasoning:**

  *   **Her Argument is Philosophically Sharp and Moorean:** She correctly identifies the core Moorean distinction: Personal Affection involves appreciating an object (a person) who possesses *independent, complex intrinsic value* in themselves, while Aesthetic Enjoyment involves appreciating an object whose primary intrinsic value (its beauty) is most fully realized *as* the object of that appreciation. Citing Moore's explicit statement that *this* is the reason Personal Affection is "the greatest good" (Sec. 123) makes her reasoning precise and textually grounded. It's not vague aesthete talk; it's targeted Moorean exegesis.
  *   **She is (Understandably) Prioritizing:** However, she is subtly overemphasizing the *gap* Moore creates. While he gives Personal Affection the top spot *in that specific comparison*, he treats both as absolutely essential components of the truly valuable life. He doesn't argue that pursuing art is *inferior* to pursuing love, ethically speaking. He would likely see the ideal life as rich in *both*. Her justification for *leaving her husband specifically for love and art* uses Moore brilliantly to elevate the love component above the aesthetic component *in terms of the object's independent value*, potentially downplaying Moore's equal reverence for the aesthetic state itself and the intrinsic value of beauty.
  *   **Why it Works for the Character:** This is perfect novelistic nuance! Her reading is intelligent, textually supported, and reveals a deep engagement with Moore. Yet, her selective emphasis – focusing on the ranking to valorize her romantic choice while perhaps minimizing the equal supremacy Moore grants to the aesthetic state she also embraces – is utterly human. It shows her using philosophy not just for understanding, but for self-justification and the construction of her new identity. She's sharp, but she's also tailoring the philosophy to flatter her seismic life choices, as intellectuals (especially Bloomsbury-esque ones!) often do.

  **In short:** Moore *does* provide the ammunition she uses. Personal Affection *does* come out slightly "ahead" in his argument *specifically because* its object is a person possessing independent intrinsic value. But Moore would likely chide her for implying that Aesthetic Enjoyment isn't *also* a supreme good, absolutely vital to the ideal. Her reasoning is sharp, Moorean, and realistically self-serving.
