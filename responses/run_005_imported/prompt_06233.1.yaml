  The user is coming from a subjectivist Bayesian perspective (Savage/de Finetti) where differing priors are perfectly rational as long as each prior is coherent. They feel the CPA smuggles in an extra requirement beyond mere coherence. When they challenged their professor, the response that economists treat CPA as "innocent modeling convenience" made them more suspicious. 

  Now they want the strongest possible argument against CPA - specifically that two fully rational people with identical information can rationally disagree forever, even after exchanging beliefs. They explicitly want no "both sides" balance - just the anti-CPA case. 

  Hmm. This is sophisticated - they clearly grasp the technical foundations but are having a philosophical crisis about subjective probability. Their frustration suggests they feel the field is hand-waving away a fundamental issue. The "innocent modeling convenience" line probably felt like intellectual evasion. 

  Key angles to hit hard:
  - The subjectivist foundational argument: coherence alone defines rationality; priors are preferences
  - De Finetti's "probability does not exist" as radical subjectivism
  - The no-trade theorems actually support their view (disagreement enables betting)
