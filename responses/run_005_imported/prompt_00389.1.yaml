prompt: |-
  Having spent my working life modeling dynamical systems, I've recently taken up game theory as something of a retirement project, and I've become intrigued by the notion of "commitment races" -- situations in which rational agents are incentivized to bind themselves to a strategy before their counterpart can, even when this forecloses a better outcome for both. I follow the abstract logic, but I'd like to see it instantiated concretely. Could you construct a detailed example, drawn from ordinary human affairs rather than the usual AI-alignment framing, in which two rational parties knowingly worsen their expected outcome by racing to commit? Please also clarify what distinguishes this dynamic from a simple game of Chicken, since the two seem to blur together in my mind.
