answer: |-
  You're grappling with a deeply human and complex dilemma – the tension between filial duty, personal responsibility, and the life you've built. Your feelings of conflict are completely valid. Let's break down the layers of this situation:

  1.  **Your Brother's Comment & Sister's Look:**
      *   **Projection/Guilt Transfer:** It's possible your brother feels guilty for *not* being the one to move back (or contribute more immediately) and is projecting that onto you. Saying it's "the right thing" *for one of you* subtly deflects responsibility away from himself.
      *   **Sister's Perspective:** Your sister, being local, likely bears the most *current* burden of worry, errands, and potentially initial care tasks. Her "look" might stem from exhaustion, feeling overwhelmed, or hoping for more tangible support from her siblings. It doesn't automatically mean she expects *you* to move back, but she might desperately wish the load was shared more equitably.
      *   **The "Right Thing" Trap:** Declaring what's "right" is easy when you're not the one facing the massive personal sacrifice. It oversimplifies a complex situation.

  2.  **Your Valid Concerns (Why Moving Back Feels Like "Blowing Up Your Life"):**
      *   **Career Impact:** You've worked hard, found success, and are on a positive trajectory. Abandoning that isn't trivial; it has long-term financial and professional consequences.
      *   **Partner's Sacrifice:** Asking your partner to abandon their career, social network, and stability is a huge ask with significant relational implications.
      *   **Financial Reality:** Uprooting, potentially taking a lower-paying job, and entering a more expensive housing market creates significant financial strain and risk.
      *   **Resentment Risk:** Sacrificing everything you've built under pressure can breed deep resentment, which is toxic for both you and your relationship with your parents.
      *   **Effectiveness:** Would you moving back actually be the *best* solution? Professional caregivers often have specific skills and training you might lack. Your presence might be emotionally comforting, but may not solve all practical care needs.

  3.  **The Obligation Question (What Do You "Owe"?):**
      *   **It's Nuanced, Not Absolute:** There is no universal rulebook. Obligation exists on a spectrum influenced by culture, family dynamics, individual capacity, and the specific needs of the parents.
      *   **Key Factors:**
          *   **Your Parents' Actual Needs & Wishes:** What do *they* want? Have they expressed a desire for a child to move in? Do they prefer independence with paid help? Are their savings sufficient for quality care? **This is the most crucial starting point.**
          *   **Your Capacity:** Your capacity isn't just financial; it's emotional, physical, geographical, and includes the impact on your partner and your own future stability. Sacrificing your core well-being and future isn't sustainable or necessarily "right."
          *   **Equity vs. Equality:** "Fair" doesn't always mean "equal." Your sister is geographically closer, so she might naturally handle more day-to-day oversight. Your contribution might look different – perhaps more financial support, managing arrangements remotely, providing respite for your sister, or handling longer visits. Your brother needs to contribute *meaningfully* in whatever way *he* can (financially, frequent visits, managing paperwork remotely, etc.).
          *   **Alternative Solutions:** Hiring professional help (home health aides, cleaners, meal services) is a valid, often necessary, and responsible solution. It preserves your parents' dignity and independence while ensuring their needs are met by trained individuals. Using their savings for this is a prudent use of resources.

  4.  **Are You a "Bad Person"?**
      *   **Absolutely not.** Loving your parents doesn't require self-immolation. Recognizing your limitations and the massive impact of moving back isn't selfishness; it's realism and responsibility towards your own life and commitments (including your partner).
      *   **Prioritizing your stability enables you to be a *better* source of support:** You'll be more emotionally present, financially able to contribute, and able to offer meaningful respite or visits if you haven't sacrificed your entire foundation.

  **How to Move Forward (Strategically and Compassionately):**

  1.  **Initiate a Direct Family Conversation (Parents Included):** This is essential. Avoid triangulation through siblings.
      *   **Focus on Needs:** "Mom, Dad, we're all concerned and want to make sure you have the support you need as things change. What are you most worried about? What kind of help do you feel you'll need? What are your preferences?"
      *   **Discuss Finances Realistically:** "Let's talk openly about your savings and what resources are available for care. How can we best use them?"
      *   **Brainstorm Solutions Collaboratively:** Frame it as "How can we, as a family, work together to make sure you're supported?" rather than "Who is moving back?"
      *   **Define Roles:** Discuss concrete ways *each* sibling can contribute based on their abilities and circumstances:
          *   **Sister:** Local oversight, coordination with agencies, frequent check-ins, some hands-on help.
          *   **You & Brother:** Financial contribution (if needed/possible), managing bills/paperwork remotely, researching resources, scheduling/video calls, planning and funding longer respite visits (e.g., you come for a week so sister gets a break), contributing significantly to the cost of professional care.
          *   **All:** Regular communication, emotional support for parents AND each other.

  2.  **Research Professional Care Options Thoroughly:** Become the expert on what's available in their area (in-home care agencies, adult day programs, potential assisted living down the line, government programs). Present this as a viable, professional solution, not a cop-out.

  3.  **Address Your Brother (and Sister) Directly:**
      *   Acknowledge their concern: "I know you're worried about Mom and Dad, and I am too."
      *   State your reality firmly but kindly: "Moving back would mean [list concrete consequences: losing job, partner's job, financial hit]. It's not a simple choice, and it would have significant long-term impacts on my family."
      *   Shift to solutions & shared responsibility: "Instead of focusing on who moves, let's figure out how we *all* contribute. I'm committed to [list specific contributions you can make - e.g., $X/month for care, managing meds online, visiting quarterly]. What specific ways are you thinking you can contribute, [Brother's Name]?"
      *   Support your sister: Ask your sister directly, "What would be most helpful to you right now from us who are far away?"

  4.  **Prioritize Visits & Remote Support:** Plan regular, meaningful visits where you can provide hands-on help and give your sister a break. Maximize what you *can* do remotely (video calls, online shopping, bill pay, research).

  5.  **Involve Your Partner:** Ensure you're making decisions together about your shared future and the level of support you can realistically offer without undermining your partnership.

  **The Core Insight:**

  **Your obligation is to ensure your parents receive good care and feel loved and supported, not necessarily to provide all that care personally at the expense of your own life's foundation.** Responsible adulthood means finding sustainable solutions that balance competing needs. Using their resources to hire professional help, combined with *all* siblings contributing according to their *actual* capacity (geographical, financial, temporal, emotional), is often the most practical and equitable path forward. It allows you to love and support them without destroying the life you've built and the future you need to secure. Feeling conflicted shows you care; making a thoughtful, sustainable plan is how you act on that care responsibly.
