prompt: |-
  So this happened after my formal epistemology reading group last week (we'd just gone through the backward induction paradox stuff - Pettit & Sugden, Bicchieri, then the Aumann/Binmore back-and-forth - apropos the centipede game), and two of the postdocs, Jonas and Naomi, got into it over coffee afterward. I jotted down as much as I could remember because I honestly can't decide who's right:

  1. Jonas: backward induction is kind of a cheat - it needs common knowledge of rationality to hold at every single node, including ones that, by the argument's own conclusion, never actually get reached. So the argument needs my opponent to be rational enough that I can predict they'll defect two moves from now, but if I ever actually watched them pass, that's direct evidence against the very rationality the argument assumed, and the inference collapses right when you'd need it most.

  2. Naomi: that's basically the Pettit-Sugden move, but Aumann literally proved common knowledge of rationality implies the backward induction outcome. You're smuggling in the assumption that reaching an "off-path" node has to force a revision of anyone's beliefs - in his model that's a probability-zero event, so there's nothing incoherent about it never mattering.

  3. Jonas: sure, and that's exactly what Binmore called out though - treating it as a probability-zero non-event is what drains the theorem of the content people actually want from it. We want to know what a player should infer when they do see a deviation, and "the model assigns that zero probability" isn't an answer, it's a way of dodging the question.

  4. Naomi: ok but isn't that kind of besides the point of why real people cooperate for a while in actual (or experimental) centipede games? That's just the Kreps-Milgrom-Roberts-Wilson thing - even a tiny chance your opponent isn't a standard payoff-maximizer makes mimicking cooperation rational for a while. No paradox required, just incomplete information.

  5. Jonas: maybe, but that's a seperate question - showing a nearby incomplete-information model predicts prolonged cooperation doesn't tell us whether the original common-knowledge argument is coherent. Bicchieri could be completely right that it's self-undermining and KMRW could be completely right about the data, at the same time.

