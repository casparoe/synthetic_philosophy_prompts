answer: |-
  Here’s a dialogue between two political philosophers, **Elara Vance** (defending "All Affected Interests") and **Marcus Thorne** (defending "All Subjected"), debating a fictional referendum with cross-border impacts. They’re at a university café, clashing over coffee:

  ---

  **Setting:** *Oakwood University Café. ELARA VANCE (early 40s, idealistic, gestures emphatically) stirs honey into her tea. MARCUS THORNE (late 50s, pragmatic, leans back in his chair) sips black coffee. A newspaper headline reads: "Riverdale Dam Referendum: Valleyview Protests ‘Ecological Colonialism’".*

  **Elara:** Marcus, look at this. Riverdale votes tomorrow on damming the Silver River for hydro power. But the dam will flood farmland in *neighboring* Valleyview, destroy their fisheries. How is this democratic? Valleyview gets no say!

  **Marcus:** (Sighs) Elara, it’s Riverdale’s territory, their river within their borders. Valleyview isn’t part of Riverdale’s polity. Under the "all subjected" principle, only those *bound* by Riverdale’s laws—Riverdale citizens—get the vote. The dam’s legal authority, its *coercive power*, stops at the border. Valleyview isn’t subjected to Riverdale’s legislature.

  **Elara:** Coercive power stops at the border? Tell that to Valleyview farmers watching their livelihoods drown! Your principle ignores *consequences*. Democracy isn’t just about who makes the law; it’s about who *lives* with it. If Valleyview is profoundly affected—ecologically, economically—they have a moral right to participate. **"All affected interests" demands their voice.**

  **Marcus:** And where does "affected" end, Elara? Riverdale’s dam might slightly raise global carbon prices, affecting a solar panel manufacturer in China. Does *that* factory owner get a vote? Does every climate activist worldwide? Your principle dissolves boundaries into absurdity. **Who decides who’s "affected enough"?** That itself needs a boundary—which brings us right back to the problem!

  **Elara:** (Leans forward) Fine, we draw practical lines. Significant, direct, and foreseeable harm. Valleyview’s flooding is *immediate* and *catastrophic*. Riverdale doesn’t bear those costs; they externalize them. Your "all subjected" principle lets Riverdale colonize Valleyview’s future without consent. That’s not democracy; it’s **tyranny of the map**.

  **Marcus:** Tyranny? Riverdale citizens live *under* the laws they create. They pay Riverdale taxes, serve on Riverdale juries, face Riverdale courts if they violate the dam regulations. Valleyview citizens don’t. **Democracy requires a shared political community with reciprocal obligations.** If Valleyview votes on Riverdale’s law, why should Riverdale citizens accept Valleyview’s laws? It shreds the social contract.

  **Elara:** Reciprocity? What reciprocity does Valleyview get here? They suffer Riverdale’s decision without recourse! Your principle sanctifies borders drawn by dead kings or colonial treaties. Meanwhile, real harm flows downstream. **"All subjected" is blind to power imbalances.** Riverdale exploits geography to impose costs on the powerless.

  **Marcus:** And your principle is blind to *feasibility*. How does Riverdale run a referendum including Valleyview? Different citizenship rolls, languages, legal systems. Who’s eligible? Only landowners? Everyone downstream? What if Valleyview itself pollutes a river flowing into Riverdale—do *we* vote in *their* elections now? **"All affected" creates infinite regress and administrative chaos.** Democracy needs a defined *demos* to function.

  **Elara:** So we accept injustice for administrative neatness? That’s surrender! We find mechanisms: transnational citizen assemblies for shared resources, weighted voting for impact zones, mandatory consultation. We *adapt* institutions. **Refusing to solve the problem because it’s hard entrenches exclusion.** Valleyview’s interests are materially at stake—they deserve representation, even if imperfect.

  **Marcus:** Representation without obligation is free-riding! Valleyview doesn’t contribute to Riverdale’s tax base. They don’t bear the costs of Riverdale’s social services or defense. Why should they reap the benefits of Riverdale’s infrastructure decisions without sharing the burdens? **"All subjected" ties rights to responsibilities within a sovereign community.** Anything else is fantasy governance.

  **Elara:** Benefits? Valleyview gets flooded fields and dead fish! Their "benefit" is ruin. You keep hiding behind sovereignty like it’s a moral absolute. **Sovereignty shouldn’t be a license to harm.** If a law’s effects spill across borders, democratic legitimacy must spill too. Otherwise, "we the people" is just "we the lucky cartographers."

  **Marcus:** (Pauses, taps the newspaper) So, for this referendum... you’d give Valleyview residents a vote? Equal weight? What if they outnumber Riverdale voters downstream? Riverdale loses control over its own territory based on another state’s population? That’s not democracy; it’s annexation by ballot.

  **Elara:** Not necessarily equal weight. Perhaps a separate but binding referendum in the affected Valleyview region. Or guaranteed seats for their delegates in Riverdale’s planning body. **We weigh voice by impact, not just by passport.** The point is, they get *a* say. Otherwise, it’s rule by fiat disguised as democracy. Your principle sanctifies the status quo, even when the status quo is morally bankrupt.

  **Marcus:** And your principle, unchecked, dissolves the status quo into incoherence. Maybe the answer isn’t voting but compensation treaties, international courts, diplomacy... **Democracy within states, negotiation between them.** Forcing alien suffrage is a category error. The "all subjected" principle keeps the *demos* intact so democracy can actually work somewhere, even if imperfectly.

  **Elara:** (Smiles wryly) So we agree? It’s imperfect. Your way just makes the imperfections fall on the powerless. Mine risks chaos. But at least mine tries to chase the democratic ideal: **no one should be governed without consent, especially by decisions that wreck their lives.**

  **Marcus:** (Stirs cold coffee) Consent requires a community to give it, Elara. Valleyview isn’t part of Riverdale’s community. Solve the harm through statecraft, not by stretching the franchise till it snaps. Sometimes, the boundary problem isn’t solved; it’s managed... less elegantly than either of us would like.

  **Elara:** Then we keep stretching. Because the alternative—accepting that borders trump basic democratic justice—is far uglier. Pass the honey?

  **(They both reach for the honey pot, the debate unresolved but the tension lingering—much like the Silver River itself.)**

  ---
  **Key Debate Points Illustrated:**
  - **Elara's "All Affected Interests"**: Focuses on moral consequences, harm, and inclusion. Vulnerable to "slippery slope" (who counts?) and feasibility issues.
  - **Marcus's "All Subjected"**: Focuses on legal coercion, sovereignty, and community reciprocity. Vulnerable to ignoring externalities/periphery harm and sanctifying arbitrary borders.
  - **Real-World Tension**: Shows how borders create democratic exclusion for those impacted by cross-border decisions (e.g., pollution, dams, trade policies).
