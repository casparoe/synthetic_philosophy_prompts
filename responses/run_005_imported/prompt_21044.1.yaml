answer: |-
  Here's a reconstruction of how Aquinas would likely analyze the Loop Track case, grounded strictly in the text and logic of *Summa Theologica* II-II, q.64, a.7 ("Whether it is lawful to kill a man in self-defense?"), supplemented by his broader theory of voluntary action:

  1.  **The Core Distinction: *Per Se* vs. *Praeter Intentionem*:**
      Aquinas's argument hinges on the moral significance of intention. An act is morally specified by its object, which is what is *intended per se* (essentially, for its own sake or as the means chosen). What occurs *praeter intentionem* (outside the intention, as a foreseen but unintended consequence) does not necessarily render the act evil, even if it is bad.
      *   **Applied to Standard Self-Defense (Aquinas's Example):** The defender intends *per se* to save their own life by using necessary force. The attacker's death, even if foreseen, is *praeter intentionem*; it is not the means chosen for saving oneself, only a possible consequence of the defensive act (striking back). The act's object is "defensive force," not "killing."
      *   **Applied to Standard Bystander Trolley:** Throwing the switch intends *per se* to divert the threat (the trolley) away from the five. The death of the one on the side track is *praeter intentionem*; it is a foreseen but unintended consequence of moving the threat. The death is not *used*; the threat is simply redirected *towards* him as a new location. The act's object is "diverting the threat," not "killing the one."

  2.  **The Loop Track Challenge: Intention and the "Means":**
      The Loop Track case fundamentally alters the causal and intentional structure:
      *   **The Physical Act:** Throwing the switch is identical to the Bystander case.
      *   **The Causal Necessity:** The death of the one man is *not* merely a consequence of the trolley being on the track he occupies. His death is *causally necessary* to stop the trolley. If he weren't killed by the impact (or if his body didn't stop the trolley), diverting the trolley would accomplish nothing. His death (specifically, his body acting as a block) is the *instrumental means* by which the five are saved.
      *   **Aquinas's Analysis:** For Aquinas, this changes the intentional object. The agent cannot *merely* intend "to divert the trolley," because diversion alone is insufficient. The agent must intend "to divert the trolley *so that it is stopped by the man's body*." **The death/destruction of the man is incorporated into the means chosen (*per se* intended)**. The act's object becomes "using the man's body to stop the trolley," which inherently includes his death/destruction. This is crucially different from intending only "to move the threat," where the death is a side effect of the threat's new location.

  3.  **Proportionality and the Act Itself:**
      Aquinas requires that the act be "proportionate" – the good effect must sufficiently outweigh the bad effect, *and* the act itself must not be intrinsically evil. Proportionality cannot justify an intrinsically evil means.
      *   **In Standard Self-Defense/Bystander:** The act (using proportionate defensive force / diverting a threat) is not intrinsically evil. Proportionality then weighs the good effect (life saved) against the unintended bad effect (death caused).
      *   **In Loop Track:** Aquinas would argue the act *itself* – **intentionally using the destruction of an innocent person as a means to save others** – **is intrinsically evil**. It violates the fundamental prohibition against directly intending the death of an innocent (*ST* II-II, q.64, a.6 is explicit: "it is in no way lawful to slay the innocent"). Therefore, proportionality becomes irrelevant. An evil means cannot be justified by a good end. The requirement that the act "should not be out of proportion to the end" presupposes the act itself is licit; it cannot rehabilitate an act that is intrinsically evil due to its object.

  4.  **Voluntary "in se" vs. "in causa" - Deepening the Analysis:**
      Aquinas distinguishes between what is willed *in itself* (voluntarium *in se*) and what is willed *in its cause* (voluntarium *in causa*) (*ST* I-II, q.6, a.5; q.77, a.7). Something is voluntary *in its cause* if an agent performs an act knowing it will produce a bad effect, even if they don't will that effect *for itself*.
      *   **Applied to Bystander:** The death is voluntary *in its cause* but *not* voluntary *in itself*. The agent doesn't will the death as an end or means; they will the diversion, knowing death is a likely/unavoidable causal consequence.
      *   **Applied to Loop Track:** The death is arguably **voluntary *in itself***. Why? Because the agent *must* will the man's destruction *as the specific causal mechanism* for stopping the trolley. The diversion only works *because* the man is crushed. The agent's plan *depends on* and *incorporates* the man's destruction as the functional means. This moves beyond merely foreseeing a consequence of a chosen act; it involves *choosing an act defined by its destructive effect on the innocent person* to achieve the good. Aquinas holds that what is willed *in itself* is imputed to the agent as intended.

  5.  **Aquinas's Likely Verdict:**
      Based solely on *ST* II-II, q.64, a.7 and his theory of intention:
      *   **Loop Track is Morally Distinct from Bystander and Illicit.**
      *   The death of the one man is *per se* intended as the necessary means to save the five. It is not *praeter intentionem*; it is central to the plan.
      *   The act involves directly intending the death/destruction of an innocent person as a means to an end.
      *   This makes the act intrinsically evil ("it is in no way lawful to slay the innocent"). Proportionality cannot justify it.
      *   The death is voluntary *in itself*, not merely *in its cause*, because the plan necessitates and relies upon it as the functional mechanism.

  6.  **Does the Framework Generate a Determinate Verdict?**
      **Yes, clearly.** Aquinas's framework, focused on the intentional object (*what* is chosen as the means), provides a robust basis for distinguishing Loop Track from Bystander. The physical similarity (throwing a switch) is superficial; the *moral object* differs fundamentally. In Bystander, the death is a foreseen side effect of redirecting the threat. In Loop Track, the death *is the mechanism* chosen to stop the threat. Aquinas's requirement that the defensive act not *intend* the harm but only permit it as a side effect is violated in Loop Track. His framework strains *less* here than simplified modern DDE presentations might, precisely because his core analysis focuses intensely on the intentional structure ("what is intended *per se*") rather than just physical proximity or directness.

  **Conclusion:** Aquinas, working from his own text and concepts, would condemn the Loop Track case as morally illicit. The act involves directly intending the death of an innocent person as the chosen means to save others, which is intrinsically evil and cannot be justified by the good outcome or proportionality. The distinction between what is *per se* intended (the instrumental destruction of the innocent) and what is *praeter intentionem* (a consequence like diverting a threat that *leads to* harm) is precisely the tool Aquinas uses to draw this line. The Loop Track case, as Thomson designed it, successfully exposes the core of Aquinas's principle: one may never *intend* the death of an innocent, even as a means to a greater good. The physical mechanics of "throwing a switch" are morally irrelevant compared to the intentional structure of the act.
