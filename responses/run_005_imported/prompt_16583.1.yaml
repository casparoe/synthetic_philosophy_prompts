answer: |-
  You've nailed the core tension: Prichard's puzzle exposes the sheer *weirdness* of promising – the feeling that "I hereby bind myself" actually *works*. Let's dissect how each family grapples with this weirdness, and why the puzzle feels stubbornly persistent. Forget neutral survey; here’s a gut-level diagnosis of the struggle:

  1.  **Practice-Based Accounts (Hume/Rawls): The "Social Magic" Gambit**
      *   **The Pitch:** Obligation isn't conjured *ex nihilo*; it's *conferred* by the rules of an existing, socially beneficial practice. Uttering "I promise" is like moving a rook diagonally – it only creates a new "state of play" (obligation) because everyone has bought into the game with its predefined rules and values. The mystery dissolves into social functionality.
      *   **Where the Puzzle Resurfaces (Gut Feeling):** This works beautifully *within* the practice. But Prichard's intuition screams: "What about *before* the practice? Or *outside* it?" Your deathbed promise to a dying friend with no social audience, or a secret vow to a stranger on a desert island – these *feel* binding even without a surrounding practice. The practice theorist must either:
          *   **Stretch the Practice:** Argue all promises implicitly invoke *some* shadow of the social practice (feels ad hoc).
          *   **Deny the Intuition:** Claim such "promises" aren't *real* obligations (feels counterintuitive and dismissive of the core phenomenon).
      *   **Diagnosis:** This doesn't *dissolve* the mystery of obligation-from-will; it *relocates* it. Now we ask: "How does merely *participating in a social practice* magically confer *moral* obligation on an individual just because they uttered certain words?" The "social magic" feels just as mysterious as the individual fiat, just one step removed. It turns "How can *I* do this?" into "How can *we* do this?" without a satisfying answer to the latter.

  2.  **Expectation-Based Accounts (Scanlon): The "Anti-Exploitation" Gambit**
      *   **The Pitch:** The wrong isn't breaking a rule, but *wronging the promisee*. By inviting reasonable, justified reliance (Principle F), you create a situation where failing to perform is a form of betrayal or exploitation. The obligation flows from the duty not to harm others by manipulating their expectations. The words "I promise" are a particularly clear signal to *create* those expectations.
      *   **Where the Puzzle Resurfaces (Gut Feeling):** Scanlon's counterfactual reliance ("what she *would* have relied on *if* she knew") is ingenious but reveals the strain. In the pure deathbed promise (promisee dies instantly after hearing it, no one else knows), there *is* no reliance, actual *or* counterfactual. The promisee *can't* rely, won't be disappointed, and isn't exploited. Yet... the obligation *still* feels real. Why? Scanlon might appeal to a generalized duty of fidelity or the intrinsic wrong of insincerity in this communicative act, but this starts to look like smuggling in a different kind of obligation – one closer to the power-based view he wants to avoid. The puzzle shifts: "Why does inviting expectation (or even the *appearance* of inviting it in a way that *would* justify reliance *if* it were possible) create a *moral* duty *specifically to perform the act*, rather than just a duty to compensate for harm caused by disappointment?"
      *   **Diagnosis:** This tackles a *downstream* wrong (harm via disappointed expectation) well, but struggles with the *upstream* mystery: Why does the *act of promising itself* create such a potent *prospective* duty *to perform*, even when the usual downstream harm (disappointed reliance) is structurally impossible? It feels like it explains the *wrongness of breaking* a promise when reliance exists, but not the *source of the obligation* itself in its purest, reliance-free form. The "mere words" still seem to generate a unique normative force that Principle F can't quite capture in the edge cases.

  3.  **Normative Power / Joint Commitment Accounts (Raz, Owens, Gilbert): The "Foundational Power" Gambit**
      *   **The Pitch:** Stop trying to reduce it. Promising works because humans simply *have* a fundamental normative power: the ability to change our own (and others') moral landscape through intentional communication. "I promise" is the performative trigger for exercising this power. Gilbert distributes it: it's a joint commitment created *by* the promisor's offer *and* the promisee's (explicit or implicit) acceptance. The obligation is the direct result of this normative act.
      *   **Where the Puzzle Resurfaces (Gut Feeling):** Prichard screams: "But *how*? *Why* do we have this power? What *is* this 'normative power' besides a fancy name for the mystery?" Saying "It's a sui generis power" *feels* like conceding the puzzle rather than solving it. Gilbert's joint commitment helps a bit – it feels less like Promisor-God and more like a mutual pact – but the core weirdness remains: How does *this specific communicative act* (promising) between two (or more) people *create* a moral fact (an obligation) that didn't exist before? What *grounds* this power? Is it inherent in practical reason (Owens)? In our social nature (Gilbert)? This just pushes the question back.
      *   **Diagnosis:** This approach *names* and *accepts* the core phenomenon Prichard finds puzzling. It doesn't *dissolve* the mystery; it *embraces* it as a fundamental feature of our moral psychology/normative universe. The "gut disagreement" here is whether naming and accepting this power *is* a satisfactory philosophical endpoint ("This is just how morality works") or an evasion ("You haven't explained *why* it works"). For critics, it feels like placing a "Here Be Dragons" label on the very spot Prichard identified.

  **The Gut-Level Diagnosis: Where the Real Disagreement Lies**

  The core fracture isn't just about promising; it's about **the source of normativity itself** and **how much reductionism we demand**:

  1.  **Reductionists vs. Non-Reductionists:** Practice and Expectation theorists are *reductionists*. They believe promissory obligation *must be explained by* (reduced to) more fundamental moral principles: social utility (Hume), fairness (Rawls), or preventing harm/exploitation (Scanlon). They see the Power theorists as giving up the explanatory game too easily. Power theorists are *non-reductionists*. They argue promissory obligation is *sui generis* – a fundamental normative primitive. They see Reductionists as distorting or failing to capture the unique, will-based essence of promising, especially in edge cases.
  2.  **The Role of the Will:** Reductionists downplay the sheer *creative power* of the promisor's will. For them, the obligation arises from the context (practice, expectations *caused* by the words). Power theorists place the will (individual or joint) center stage: the *intentional act* of undertaking the obligation *is* the source. The disagreement is whether the will can be a *source* of new obligations, or merely a *trigger* activating pre-existing obligations based on context.
  3.  **The Weight of Intuition (Especially Edge Cases):** The stalemate often hinges on how much weight each side gives to the "pure promise" intuitions (deathbed, desert island). Reductionists often bite the bullet: "If no practice/reliance, no *real* obligation (or only a weaker one based on sincerity/truth-telling)." Power theorists take these intuitions as decisive evidence for a unique normative power. **Prichard's puzzle is the feeling generated by the pure case. Which theory respects that feeling most?**
  4.  **The "Mystery" Threshold:** Everyone agrees promising *works*. The disagreement is about what counts as an *explanation*. Reductionists think pointing to social practices or harm prevention *is* an explanation. Power theorists think those explanations fail at the edges and miss the core performative magic; pointing to the normative power *is* the only accurate description, even if it feels mysterious. For them, the "mystery" is a feature, not a bug – it highlights something irreducible about human agency and relationship-building.

  **My Own Read: The Puzzle Stands (But That Might Be Okay)**

  Honestly? **Prichard's puzzle resists full dissolution.** Each approach illuminates aspects but stumbles on the core weirdness of obligation springing forth from a deliberate utterance:

  *   **Practice Views:** Best at explaining the social scaffolding, but fail the "pure will" test.
  *   **Expectation Views:** Best at explaining the *wrong* of breaking when reliance is possible, but strain to capture the *existence* of the obligation in the absence of any possible reliance.
  *   **Power Views:** Best capture the intuitive core and handle the edge cases, but do so by positing a foundational power that *is* essentially a refined label for Prichard's mystery. Gilbert's joint commitment softens the "fiat" feel but still relies on an unexplained normative capacity to create joint commitments via specific utterances.

  **Where I lean:** The Power/Joint-Commitment view, particularly Gilbert's, feels most phenomenologically accurate. Promising *does* feel like creating a unique normative bond through mutual recognition. Insisting this *must* be reduced to utility or harm prevention risks losing something essential about commitment, trust, and the structure of interpersonal obligations. **The "mystery" might be irreducible because it points to a bedrock feature of our moral agency: we can, through shared intentions and communication, create new moral reasons for ourselves and others.** This capacity *is* foundational.

  **The real takeaway:** Prichard's puzzle isn't a problem to be definitively "solved" by one theory vanquishing others. It's a **diagnostic tool**. It reveals a fundamental tension in moral philosophy: between the desire to ground everything in simpler, non-normative facts (social, psychological, consequentialist) and the intuition that some normative phenomena – like binding oneself through a promise – are irreducibly *normative* and *agent-driven*. The persistence of the puzzle across centuries of smart attempts suggests the latter intuition might be pointing to a deep truth about how obligation works. The disagreement lies in whether we find that truth philosophically satisfying or not.
