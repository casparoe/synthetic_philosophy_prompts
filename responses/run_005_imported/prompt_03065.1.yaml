   Lockean Thesis: The argument by Dorst and Easwaran is clever but it doesn't completely avoid the lottery paradox. They use a context-dependent threshold and a scoring rule that is designed to avoid the paradox, but it's still a bit of a patch. Many formal epistemologists are skeptical.

