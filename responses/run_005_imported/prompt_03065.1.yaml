   We'll use a tier list in JSON format with tiers: S, A, B, C, F.

   After reading about these, I have the following impressions:

   - **Probabilism (Joyce 1998, etc.)**: The original and most well-established. The dominance argument is strong and the conditions on scoring rules (like strict propriety) are widely accepted. This is the foundation and is considered very rigorous.

   - **Conditionalization (Greaves & Wallace)**: The argument uses expected utility maximization to show that conditionalizing is the only way to maximize expected accuracy. This is also considered a strong result, though it assumes that the agent is updating by choosing an update procedure in advance. Some might question the setup, but it's generally seen as rigorous.

   - **Principal Principle (Pettigrew)**: The argument for deferring to known chances. It uses a dominance argument relative to a set of "chance" functions. This is also seen as a solid argument, but it depends on the way we set up the set of chance functions and the scoring rule. Still, it's generally accepted.

   - **Principle of Indifference**: The argument here is often based on minimax (avoiding the worst-case loss). However, this is more controversial because the minimax decision rule is not always appropriate, and the principle of indifference is known to be problematic in continuous cases or when there's a lack of natural symmetries. Some think the argument might be forcing the conclusion.

   - **Reflection Principle**: The idea is to treat your future self as an expert. The epistemic utility argument for this (by Briggs, or perhaps others) has been criticized for assuming that your future credences are independent of the truth in a way that might not hold. Also, it seems to require that your future credences are based on more information, but if you learn misleading evidence, it might not be rational to reflect. The argument might be circular or rely on a contentious setup.

   - **Lockean Thesis (Dorst, Easwaran)**: This argues for a connection between belief and credence. The argument is that if you have a credence above a threshold, you should believe. But the threshold is context-dependent and the argument uses a scoring rule that combines accuracy for beliefs and credences. This is seen as more of a pragmatic argument and less foundational. It's also known that the Lockean thesis can conflict with the logic of belief (the lottery paradox). The epistemic utility argument for it is relatively new and more controversial.

