  ### **Justification of Scores**

  #### **Move 1: Dan's Claim**  
  **Score: 1 (Mostly right, but oversimplified)**  
  Dan is correct that Zorn's Lemma (ZL) and the Axiom of Choice (AC) are equivalent over ZF—this is a standard theorem. Thus, invoking ZL in a proof formally commits the author to AC in the sense that the proof relies on a principle equivalent to AC. However, Dan overstates by implying this always reflects the *minimal strength* needed for the theorem being proved. While the proof uses a full-AC-equivalent tool, the theorem itself might be provable with weaker axioms (as Mei notes). Dan is right about logical commitment but wrong to ignore the distinction between proof method and theorem strength.

  #### **Move 2: Mei's Pushback**  
  **Score: 2 (Clearly right)**  
  Mei is correct that the ZL/AC equivalence is a schema over all posets, and a single application might depend only on a weak choice fragment. Her example—Hahn-Banach follows from the Boolean Prime Ideal theorem (BPI), which is strictly weaker than AC—is mathematically sound. BPI is known to be weaker than AC (e.g., in Cohen’s model of ZF+¬AC, BPI holds but AC fails), and Hahn-Banach is provable from BPI without full AC. This shows Dan’s "no wiggle room" claim is too broad; the strength of a ZL invocation depends on the poset and theorem.

  #### **Move 3: Dan's Counter**  
  **Score: 1 (Mathematically correct but misapplied)**  
  Dan accurately cites Andreas Blass’s 1984 result: "Every vector space has a basis" implies full AC over ZF. This is correct and well-known (Blass, *Existence of Bases Implies the Axiom of Choice*, 1984). However, Dan misuses this as a general counterargument. Blass’s result shows that *for this specific theorem*, ZL invokes full-AC strength, but it does not generalize to all uses of ZL (e.g., Hahn-Banach). Thus, it supports Mei’s point about case-by-case analysis rather than refuting it.

  #### **Move 4: Mei's Sharpening**  
  **Score: 2 (Clearly right)**  
  Mei correctly reframes the debate: The strength of a ZL invocation is theorem-specific and requires reverse mathematics to determine. Dan’s "no wiggle room" rule is a useful slogan but mathematically inaccurate. For instance:  
  - Vector space bases require full AC (per Blass).  
  - Hahn-Banach requires only BPI (weaker than AC).  
  - Other examples (e.g., maximal ideals in rings) may use intermediate fragments.  
  Mei’s point that strength "cannot be read off the mere citation of Zorn’s Lemma" is valid and central to reverse mathematics.

  #### **Move 5: Dan's Practical Argument**  
  **Score: 0 (Partially reasonable but misleading)**  
  Dan is pragmatically right that mathematicians rarely perform reverse mathematics before publishing—they cite ZL and move on. However, his claim that "you’re on the hook for full AC until proven otherwise" is misleading.  
  - **For the proof**: Using ZL *does* commit to AC, as ZL is AC-equivalent.  
  - **For the theorem**: The minimal strength is unknown without analysis, and defaulting to "full AC" ignores that theorems like Hahn-Banach *are known* to be weaker. In practice, once reverse mathematics establishes a theorem’s minimal strength (e.g., BPI for Hahn-Banach), citing ZL retrospectively reveals only that fragment. Dan’s stance undermines established results and confuses proof method with theorem strength.

  ---

  ### **Mathematical Corrections**  
  - **Blass’s result (Move 3)** is correct and uncontroversial.  
  - **BPI and Hahn-Banach (Move 2)** are solid: BPI is strictly weaker than AC (e.g., Halpern-Levy model), and Hahn-Banach is equivalent to BPI over ZF.  
  - **No shaky claims**: Both debaters accurately cite core results. The conflict arises from interpretation, not mathematical error.

  ### **What Both Are Missing**  
  - **Dan** conflates proof method with theorem strength. Using ZL commits a *proof* to AC, but the *theorem* may not require it. He misses that reverse mathematics often retroactively downgrades the perceived strength (e.g., "Hahn-Banach uses BPI, not full AC").  
  - **Mei** underemphasizes that a ZL citation *in a proof* still formally uses AC-equivalent power, even if the theorem is weaker. She focuses on the theorem’s strength but sidesteps the proof’s logical dependency.  
  - **Shared blind spot**: Neither distinguishes between:  
    - **Logical strength of the proof**: Invoking ZL assumes full AC.  
    - **Minimal strength of the theorem**: Requires reverse mathematics.  
    In practice, ZL is a "black box"—its strength depends on what’s inside (the poset). For example, ZL on a well-orderable poset may not need AC, but such cases are rare.  

  ### **Verdict**  
  Mei wins the core argument: The strength of a ZL invocation is theorem-specific, not uniformly full AC. Dan is right about proof commitments and practical defaults but overgeneralizes. Reverse mathematics is essential for precise calibration—something Dan dismisses but Mei champions.
