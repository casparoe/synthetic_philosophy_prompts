  For the future policy, borrow from professional journalism ethics: emphasize the difference between correlation and causation. Set clear thresholds—like requiring either documentation or two independent sources before alleging coordination. The "appearance of conflict" language is key; it allows reporting on red flags without jumping to conclusions. 

