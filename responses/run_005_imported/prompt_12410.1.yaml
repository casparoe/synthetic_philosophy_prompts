answer: |-
  The bar hummed with post-conference chatter. Two figures hunched over a sticky table, empty glasses pushed aside. **Martin**, late 50s, neat tweed slightly rumpled, traced lines on a damp napkin. **Leela**, early 40s, sharp-eyed and restless, tapped her finger beside it.

  **Martin:** "...so Aumann, Hart, Perry are crystal clear: optimize the *plan* from the start. You commit to a strategy: 'At the *first* exit I *might* see, I continue with probability *p*. At the *second*, I *must* exit.' You calculate the *expected* payoff based on that *p*, find the *p* that maximizes it. Simple. *p* equals two-thirds. Expected payoff: four-thirds. Done. Paradox resolved. Planning-optimal *is* action-optimal if you stick to the strategy."

  **Leela:** (Leaning forward, voice tight) "But that's *exactly* the sleight of hand, Martin! Piccione and Rubinstein *agree* that the ex-ante optimal plan is to continue at the first exit with p=2/3. That’s the planning-optimal strategy. The paradox hits when the driver *finds themselves at an exit*! They don’t know *which* exit it is! At *that* decision node, what should they *do*? What probability *q* should they assign to continuing *now*?"

  **Martin:** "They should do what the plan says! *q* should be 2/3, obviously. Because that’s what they committed to."

  **Leela:** "Why? *Why* should it be 2/3 *at that moment*? Think! If the driver finds themselves at *an* exit, what’s the probability it’s the first one?"

  **Martin:** "Well, it could be either. But the strategy accounts for that uncertainty..."

  **Leela:** "Exactly! From the *driver's perspective at the node*, let π be the probability they assign to being at the *first* exit. They know the *plan* called for p=2/3 at the first exit, but now they’re here, uncertain. The expected payoff for continuing *now* is: π * (payoff if this is first and I continue) + (1-π) * (payoff if this is second and I continue)."

  **Martin:** "Which is π * (Expected payoff from later, which depends on the *plan* at the *next* node...) + (1-π) * 1."

  **Leela:** "Right. And the payoff for exiting *now* is π*4 + (1-π)*0 = 4π. Now, if the driver believes the *original plan* will be followed perfectly at the *next* node if they continue *now* and this *is* the first exit, then continuing now gives: π * [p * (payoff from continuing at first) + (1-p) * (payoff from exiting at first)]... wait, no." (She grabs the napkin, scribbling over Martin's lines) "If they continue *now* and this *is* the first exit, they reach the second exit and, *if they follow the plan there*, exit, getting 4. So continuing now if this is first exit yields 4. If they continue *now* and this is the *second* exit, they get 1. So, expected payoff for continuing *now* is: π * 4 + (1-π) * 1."

  **Martin:** "And exiting now is 4π. So the driver is indifferent between continuing and exiting when π*4 + (1-π)*1 = 4π. That simplifies to 4π + 1 - π = 4π... so 1 - π = 0? π=1? That can't be right."

  **Leela:** (Triumphantly) "Exactly! 4π + (1 - π) = 4π implies 1 - π = 0. π must be 1 for indifference. But π *can't* be 1! They know there's a *chance* this is the second exit! If they believe they *might* be at the second exit (π < 1), then 4π + (1-π) = 3π + 1 is *less* than 4π *if* π > 1/3. 3π + 1 < 4π when π > 1. Since π *must* be less than 1, 3π + 1 is *always less than* 4π for π > 1/3. So if the driver thinks π > 1/3 – which they rationally should, since they started at the beginning! – then exiting *now* strictly dominates continuing! The action-optimal move at *any* exit is to *exit*!"

  **Martin:** (Frowning, swirling the dregs in his glass) "But that gives a payoff of 0! It’s worse than the ex-ante optimum of 4/3! That’s irrational! They *know* the ex-ante optimal plan exists."

  **Leela:** "That’s the paradox! At the planning stage, p=2/3 is optimal. But at *any* execution point, given the uncertainty and the structure, the driver is rationally compelled to choose an action (exit with q=1) that leads to the worst outcome (0), *because* the action-optimal choice *given their knowledge at the node* conflicts with the planning optimum. The strategy isn't dynamically consistent! Believing you'll follow the plan later makes continuing *now* look worse than it is in the overall plan."

  **Martin:** "So you're saying rationality at the node *forces* them to abandon the optimal plan? That seems self-defeating. AHP’s point is precisely that you *must* bind yourself to the plan. You precommit to randomizing with p=2/3 at the first node, understanding that *if* you reach the second, you exit. You don’t recalculate at the node; you *execute*."

  **Leela:** "But *can* you? Truly? When you're sitting there, utterly uncertain, and the math *at that moment* screams 'EXIT'? The knowledge that you *planned* to sometimes continue doesn't change the conditional payoff calculation *given your current ignorance*. P&R argue the *belief* about which node you're at (π) can't be made consistent with the optimal strategy *and* the requirement for rationality at every node."

  **Martin:** "Then rationality is fragmented. The plan *is* rational. Sticking to it *is* rational. Deviating because of momentary doubt leads to ruin."

  **Leela:** "But the doubt isn't momentary foolishness; it's inherent in the structure! The calculation *at the node* is rational *given the information available there*. The paradox shows the two conceptions of rationality – planning and action – can pull apart in absent-mindedness. You can't just wish the uncertainty away by saying 'stick to the plan'."

  **Martin:** (Sighs, pushes the ruined napkin away) "So we have a perfect plan no rational driver can actually follow when the moment comes?"

  **Leela:** (Nods grimly, signaling the bartender) "Or a driver who follows it isn't being rational *in* the moment? That's the knot. Another whiskey? Neat. This needs lubrication." 

  **Martin:** "Rocks. Definitely rocks. And maybe a new napkin." They sat in frustrated silence, the gulf between the planner and the driver as wide as the highway itself.
