  **Justification:**  
  - **Move 1 (Owen):** Score **1** (Mostly right). Owen correctly identifies Aquinas's distinction that *usurpers* lack legitimate authority, making resistance non-seditious. However, he overreaches by implying Aquinas "licenses private individuals to kill" outright. Aquinas condemns private initiative in later works (as Ana notes), and the *Sentences* commentary focuses on legitimacy status, not blanket permission for private violence.  
  - **Move 2 (Ana):** Score **1.5** (Strongly right). Ana correctly contextualizes Owen's citation, noting Aquinas restricts private judgment against *legitimate-turned-tyrannical* rulers in *De Regno*. Her framing of Aquinas's core caution (prioritizing public authority/prayer over private violence) is textually anchored and addresses the more common historical case Owen's reading overlooks.  
  - **Move 3 (Owen):** Score **0.5** (Partially right but overstated). Owen rightly notes *Summa* (II-II Q42) redefines tyrannical regimes as *sources* of sedition, removing the "sin" label from resistance. But he falsely implies this "clears the main obstacle" to *private lethal action*. Aquinas never equates "resistance isn’t sinful" with "private killing is authorized" in this passage.  
  - **Move 4 (Ana):** Score **2** (Clearly right). Ana decisively exposes Owen’s logical slide: removing the *sin* of sedition ≠ granting *license* for private execution. She anchors Aquinas’s consistent distinction: only usurpers *might* face private lethal force (per early work), while correction of legitimate-turned-tyrants requires public authority. Her textual precision (citing *De Regno*'s caution) refutes Owen’s conflation.  

  **Common Elision:** Both scholars underplay Aquinas’s hierarchical view of authority. Aquinas *does* permit violent resistance by *public authorities* (e.g., nobles, assemblies) against tyrants (*De Regno* 1.6; *Summa* II-II Q42), a middle path between private daggers and passive prayer. Neither adequately addresses how Aquinas’s "public body" (*De Regno*) or "superior authority" (*Sent.*) could include *intermediate* powers—not just the ruler’s installers. This omission obscures Aquinas’s potential justification for *institutional* (not private) tyrannicide against rulers who betray legitimacy.
