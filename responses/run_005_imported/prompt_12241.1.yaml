  First, I need to map Aquinas's key texts on tyrannicide. There are three relevant sources: his early commentary on Peter Lombard's Sentences (where he discusses outright usurpers), the unfinished De Regno treatise (addressing legitimate rulers turned tyrants), and the Summa Theologiae (handling sedition against tyrannical regimes). 

  For move 1: Owen's interpretation of the Sentences commentary seems correct - Aquinas does distinguish usurpers from legitimate authorities, and resistance against them isn't sedition. But he overreaches by implying this licenses private killing. Score: 1 (mostly right but slightly overstated).

  For move 2: Ana correctly notes Owen's conflation of two distinct cases (usurpers vs legitimate-turned-tyrant) and accurately cites De Regno's caution against private judgment. However, she underplays how Aquinas's framework might permit non-lethal resistance. Score: 1.5 (strong but slightly narrow).

  For move 3: Owen correctly identifies the Summa's redefinition of sedition as applying to tyrants, which removes a major moral obstacle. But he again overextends this to imply authorization of private killing. Score: 0.5 (partially valid but overinterpreted).

  For move 4: Ana effectively exposes Owen's logical slide from "resistance isn't sinful" to "private killing is permitted." She maintains crucial distinctions while acknowledging the Summa's nuance. Score: 2 (precisely correct).

  The common elision? Both scholars miss Aquinas's hierarchical resistance model: while opposing private tyrannicide, his principles could justify violence by intermediate authorities (like nobles or assemblies) against tyrants - a middle path between individual daggers and passive prayer.
