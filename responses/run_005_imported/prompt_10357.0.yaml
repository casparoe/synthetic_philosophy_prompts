answer: |-
  I'll defend the geometric rationality position rigorously, addressing your three specific points in turn. The core argument is that expected utility theory (EUT) commits a scope error when applied to repeated multiplicative processes: it evaluates decisions using an *ensemble average* (across a hypothetical population), but the *time average* (along a single trajectory) is the only observable outcome for a persisting agent. For multiplicative wealth dynamics, the time average converges to the geometric mean growth rate (i.e., the expected log-return), making its maximization necessary for long-run survival and prosperity—irrespective of utility functions. This isn't a preference; it's a mathematical consequence of the process ergodicity.

  ### 1. Why "Kelly is just log utility" presupposes the issue
  The standard critique—that Kelly maximizes expected log-wealth only for agents with logarithmic utility—assumes that rationality *must* be derived from preferences over outcomes. This begs the question by presupposing that EUT's ontology (where utility functions define rationality) is universally applicable. Geometric rationality rejects this. For multiplicative processes, the growth rate isn't a "preference" but an *emergent property* of the dynamics, discernible through analysis of the system's ergodicity.

  - **Mathematical basis**: Consider a repeated multiplicative bet where wealth evolves as \(W_t = W_0 \prod_{i=1}^t R_i\), with \(R_i\) i.i.d. random returns. By the law of large numbers in log-space:
    \[
    \lim_{t \to \infty} \frac{1}{t} \log \left( \frac{W_t}{W_0} \right) = \lim_{t \to \infty} \frac{1}{t} \sum_{i=1}^t \log R_i = \mathbb{E}[\log R]
    \]
    This holds almost surely for a single trajectory. The growth rate \(\exp(\mathbb{E}[\log R])\) is the geometric mean return. Maximizing it ensures \(W_t\) grows exponentially at the highest possible rate *for the individual*. Crucially, this convergence depends solely on the process structure (multiplicative, i.i.d. returns), not utility.

  - **The circularity in Samuelson's view**: To claim that "Kelly is log utility" is to assert that \(\mathbb{E}[\log W]\) is just another expected utility. But this assumes EUT's ensemble-average framework is the only valid way to evaluate decisions. Geometric rationality argues that for repeated multiplicative processes, the ensemble average (e.g., \(\mathbb{E}[R]\)) is irrelevant because no agent experiences it—they experience a single path. Privileging the growth rate isn't a "disguise" for preferences; it's a recognition that the dynamics constrain what is possible for a temporal agent. If an agent with linear utility ignores this and maximizes \(\mathbb{E}[R]\) (the arithmetic mean), they accept bets that systematically destroy wealth in the long run (as in your toy example). Thus, the critique conflates a mathematical property of the process with a psychological attribute (preference).

  ### 2. Why dismissing long-run dominance as "merely asymptotic" fails
  Samuelsonians argue that Kelly's almost-sure long-run dominance is irrelevant for finite-lived agents, relegating it to a mathematical curiosity. This misrepresents the objection: it isn't that the long run is "unrealistic," but that EUT uses the *wrong average* for finite horizons too. The ensemble average (\(\mathbb{E}[R]\)) is only appropriate for additive, one-shot decisions. For multiplicative processes, even finite horizons exhibit properties aligned with the time average.

  - **Finite-time implications**: For any finite \(t\), the distribution of \(W_t\) is log-normal (or similar) with heavy tails. The ensemble average \(\mathbb{E}[W_t]\) is dominated by exponentially rare, high-wealth paths (the "gambler's ruin" winners). But a single agent cannot access these parallel paths; they experience one trajectory. The Kelly criterion maximizes the *typical* outcome (median wealth), which grows as \(\exp(t \cdot \mathbb{E}[\log R])\). In contrast, maximizing \(\mathbb{E}[R]\) often minimizes median wealth and maximizes the probability of ruin. Your toy example illustrates this:  
    - Bet: \(R = 1.5\) (p=0.5) or \(R = 0.6\) (p=0.5).  
    - \(\mathbb{E}[R] = 1.05 > 1\) → Positive expected return.  
    - \(\mathbb{E}[\log R] \approx \mathbb{E}[\log(1.5) + \log(0.6)]/2 \approx (-0.510)/2 < 0\) → Negative growth rate.  
    After \(t\) rounds, median wealth \(\propto \exp(t \cdot \mathbb{E}[\log R]) \to 0\) almost surely. An EUT maximizer with linear utility bets fully, accepting ruin with probability 1. Kelly bets \(f^* = (bp - q)/b = 0\) (using Kelly's formula), avoiding the bet entirely. Dismissing this as "asymptotic" ignores that ruin occurs rapidly: for \(W_0 = 100\), after 100 bets, \(P(\text{ruin}) > 0.99\) for full betting, while Kelly preserves wealth.

  - **The disagreement restated**: Samuelsonians say: "Finite agents care about \(\mathbb{E}[u(W_t)]\), not \(t \to \infty\)." Geometric rationality replies: "For multiplicative processes, \(\mathbb{E}[u(W_t)]\) is a *biased* statistic for temporal agents because it weights nonexistent ensemble paths. The time average’s finite-time proxy (e.g., median growth) is the rational objective." The "asymptotic" dismissal doesn't rescue EUT; it reveals EUT's incompatibility with multiplicative dynamics. No sensible agent would accept a strategy guaranteeing near-certain ruin over finite horizons when alternatives exist.

  ### 3. Privileging one's trajectory: A substantive value judgment?
  Yes, geometric rationality privileges the realized time average, but this isn't an arbitrary value judgment—it's a *minimal consistency condition* for agents who persist across repeated decisions. It avoids preferences altogether by focusing on what is mathematically inevitable for individual trajectories. However, it does rest on a weak normative assumption: that agents should care about long-term survival and growth when exposed to recurring risks. This isn't as contestable as utility functions because it responds to the process's unforgiving logic.

  - **The inevitability of the time average**: For ergodic multiplicative processes, the time average converges deterministically (a.s.) to \(\mathbb{E}[\log R]\). Ignoring this isn't a "different preference"—it's ignoring arithmetic. Consider:
    - An EUT maximizer with linear utility in your toy bet *knows* that \(\mathbb{E}[W_t] \to \infty\) but also that \(P(W_t \to 0) = 1\). This is a contradiction: the ensemble grows, but individuals vanish. Geometric rationality resolves this by rejecting the ensemble as irrelevant. Privileging the trajectory isn't a value choice; it's accepting that only the time average is empirically accessible.

  - **Minimal normative commitment**: Geometric rationality requires one axiom: *For repeated decisions, an agent should evaluate strategies based on their effect on the individual's long-run trajectory.* This is weaker than EUT's assumption of a complete preference ordering over lotteries. It is hard to contest because:
    1. **Coherence**: Violating it leads to strategies that are *dominated in probability*: e.g., full betting in the toy example has \(P(\text{ruin}) \to 1\), while Kelly has \(P(\text{ruin}) = 0\). No utility function can "rescue" a strategy that guarantees ruin.
    2. **No utility needed**: A risk-neutral geometric rationalist still uses Kelly because the growth rate is a physical constraint. If \(u(W) = W\), maximizing \(\mathbb{E}[u(W)]\) fails because \(\mathbb{E}[W_t]\) is inflated by paths the agent never sees. Correcting this requires maximizing growth, not utility.
    3. **Temporal neutrality**: If an agent cares about their future selves at all (a near-universal commitment), they cannot ignore the multiplicative cascade of losses/gains. To dismiss this is to accept self-destructive decisions.

  - **Contestability vs. necessity**: While one *could* adopt a "present-self-only" view, this isn't tenable for repeated decisions. Geometric rationality doesn't dispense with values entirely—it asserts that *persistence* is a precondition for action, making growth-rate maximization instrumentally rational. This is less arbitrary than selecting a utility function because it is dictated by the process. EUT's ensemble average, by contrast, imposes an ontology of parallel worlds, which is a stronger (and less justifiable) metaphysical commitment.

  ### Synthesis: Geometric rationality as a category correction
  Geometric rationality argues that EUT misapplies a one-shot, additive framework to a repeated multiplicative context—a category error. The Kelly criterion emerges not from preferences but from the law of large numbers in log-space: for a single trajectory, wealth growth is governed by \(\mathbb{E}[\log R]\). Maximizing this is necessary for survival and prosperity. Critiques that reduce this to "log utility" presuppose EUT's ontology; dismissing long-run dominance ignores that finite outcomes align with the time average; and privileging one's trajectory is a minimal norm for temporal agents. This view doesn't reject EUT wholesale—it confines it to ergodic (e.g., additive) settings. For non-ergodic processes like multiplicative gambling, geometric rationality is the coherent alternative.

  **Key references for your seminar**:  
  - Peters, O. (2011): *The time resolution of the St. Petersburg paradox* (shows ensemble/time average divergence).  
  - Peters and Gell-Mann (2016): *Evaluating gambles using dynamics* (formalizes ergodicity economics).  
  - Cover and Thomas (2006): *Elements of Information Theory* (Kelly as optimal growth via Shannon).  
  - Samuelson (1979): *Why we should not make mean log of wealth big* (the critique to rebut).
