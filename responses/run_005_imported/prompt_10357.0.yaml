  3. **Privileging one's trajectory as a value judgment**: This is tricky. The worry is that focusing on personal time average is itself a preference, not a neutral fact. I need to argue that for multiplicative processes, the time average convergence isn't a choice—it's a mathematical property. Ignoring it leads to guaranteed ruin in some cases, which might be a stronger normative claim.

