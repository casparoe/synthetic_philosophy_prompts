  ## Memorandum: Recommendation on Honorary Degree for Former President [Name]

  **To:** University Honorary Degrees Committee  
  **From:** [Your Name/Chair, Optional]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Honorary Doctorate for Former President [Name] – Navigating the Moral Labyrinth  

  **I. Introduction**  
  This memorandum addresses the profoundly difficult case of the proposed honorary doctorate for Former President [Name], credited with ending the brutal [War Name] conflict. The committee is deeply divided, reflecting a fundamental tension in ethics: the argument that the President's decisive action resulted in a net saving of lives versus the argument that the *means* employed – the deliberate targeting of civilian infrastructure essential for survival – constitute an unconscionable moral transgression that cannot be outweighed by subsequent outcomes. We must engage seriously with both claims before reaching a decision that aligns with our university's values and the purpose of an honorary degree.

  **II. Acknowledging the Complexity: The "Lives Saved" Argument**  
  The proponents' case demands serious consideration. Historical analysis suggests the immediate civilian casualties and suffering caused by the destruction of water treatment and power plants, while horrific, were likely lower than the projected casualties of a prolonged war. Ending a brutal conflict swiftly, even through terrible means, can indeed prevent greater aggregate suffering. This is a consequentialist calculation grounded in real-world tragedy: choosing the lesser evil when presented with only grim alternatives. To dismiss this argument solely because the outcome was imperfect ignores the agonizing reality of wartime decision-making where "clean" moral choices are often absent. The President's action *did* achieve a specific, tangible good – the cessation of widespread violence – and attributing *some* lives saved to this decision is a plausible historical interpretation.

  **III. Engaging the Anscombe Objection: The Nature of the Act**  
  However, the opposing argument, echoing Elizabeth Anscombe's critique of honoring President Truman, compels us to look beyond the net arithmetic of lives. Anscombe contended that certain acts are intrinsically wrong, irrespective of their consequences. Deliberately targeting civilian infrastructure essential for life (water, power in winter) is not merely "collateral damage"; it is a strategy designed to inflict suffering and death *upon the civilian population* to break the enemy's will. This constitutes:

  1.  **A Direct Attack on Non-Combatants:** It violates the fundamental principle of distinction in just war theory and international humanitarian law, which prohibits directing attacks against civilians or civilian objects.
  2.  **The Weaponization of Basic Survival:** It transforms access to clean water and heat from a basic human need into a weapon of coercion. The resulting deaths are not accidental but foreseeable and intended consequences of the strategy.
  3.  **Moral Calculation vs. Moral Absolute:** The objection posits that there exists a moral threshold. Deliberately causing civilian deaths through deprivation as a tactic is murder, and murder is not permissible simply because a calculation suggests it might, in a specific instance, lead to fewer deaths overall than an alternative scenario. It corrodes the very principles that distinguish civilized conduct, even in war. An honorary degree, symbolizing the *highest ideals* of the university – including the sanctity of life, ethical conduct, and the pursuit of knowledge for human betterment – cannot be reconciled with endorsing such a tactic, regardless of its outcome. To do so risks normalizing the principle that civilian suffering is an acceptable tool of statecraft when the math appears favorable.

  **IV. The Honorary Degree: Purpose and Symbolism**  
  An honorary doctorate is not merely recognition of achievement; it is a profound symbolic gesture. It signifies that the recipient embodies the values and aspirations the university holds most dear: intellectual rigor, ethical leadership, service to humanity, and contributions that uplift civilization. It is an *endorsement*, placing the recipient amongst those we hold up as exemplars for our students and community.

  **V. Recommendation: Decline the Traditional Honorary Doctorate; Propose Alternative Recognition**  
  After careful deliberation and acknowledging the weight of both arguments, **I recommend we decline to award the traditional honorary doctorate to Former President [Name].**

  *   **Reasoning:**
      *   **The Moral Threshold:** While the "lives saved" calculus is compelling on a pragmatic level, the *method* employed crosses a fundamental ethical line identified in the Anscombe objection. Awarding our highest honor would implicitly endorse the principle that deliberately targeting civilian survival needs is an acceptable, even laudable, tool for achieving peace when deemed "necessary." This contradicts core university values and the principles of international law we strive to uphold.
      *   **The Symbolism of Endorsement:** The degree signifies comprehensive exemplary conduct aligned with our ideals. The President's decisive action, while ending the war, involved a tactic fundamentally at odds with the ethical principles we teach and cherish. We cannot separate the achievement from the morally reprehensible means.
      *   **The University's Role:** Our role is not merely to calculate historical utility but to uphold principles and foster ethical reflection. Conferring this honor risks appearing to condone the tactic and could cause deep harm and alienation within our community, particularly to those whose families or nations have suffered from similar strategies.

  **VI. Proposal for a Third Path: Acknowledgment Without Endorsement**  
  Declining the traditional honor does not necessitate ignoring the historical significance of the war's end. To acknowledge the complexity and avoid a simple binary, **I propose we offer a distinct form of recognition:**

  *   **A "Special Recognition for Complex Historical Legacy" (or similar title):** This would involve:
      1.  A formal, public statement from the University President acknowledging the end of the [War Name] conflict under President [Name]'s leadership and the profound relief this brought to many, while explicitly and unambiguously stating the university's condemnation of the tactic of targeting essential civilian infrastructure as a violation of fundamental humanitarian principles.
      2.  The establishment of a named, high-profile annual lecture series or symposium on "Ethics, War, and the Protection of Civilians," funded by the university. This series would bring leading scholars, ethicists, jurists, and humanitarian practitioners to campus to explore the very dilemmas this case presents.
      3.  An invitation to President [Name] (or a representative) to *participate* in the inaugural event of this series, not as an honoree, but as a subject of scholarly and ethical examination. This provides a platform for engagement without endorsement.

  *   **Why this Third Option?**
      *   **Engages the Complexity:** It directly confronts the tension between consequence and principle.
      *   **Upholds Values:** It clearly rejects the tactic while acknowledging the historical outcome.
      *   **Educational Mission:** It transforms a divisive decision into a powerful educational opportunity consistent with our academic mission, fostering critical discourse on one of the most difficult ethical questions.
      *   **Mitigates Harm:** It avoids the profound harm of endorsing the tactic while offering a constructive path forward.
      *   **Preserves Integrity:** It maintains the integrity of the honorary doctorate by reserving it for those whose achievements align fully with our highest ideals.

  **VII. Conclusion**  
  The decision before us forces a confrontation between consequentialist necessity and deontological principle. While the "lives saved" argument possesses undeniable gravity, awarding our highest honor for an action that deliberately targeted civilian survival violates a core ethical norm that the university must uphold. The proposed alternative – a clear condemnation of the tactic paired with a substantive initiative promoting rigorous ethical discourse – allows us to acknowledge the historical moment without endorsing the method. It transforms a potentially divisive award into an opportunity for the university to fulfill its deepest purpose: fostering understanding and grappling with the hardest questions of human conduct.

  **Recommendation:** Decline the traditional honorary doctorate. Pursue the alternative recognition pathway outlined in Section VI.

  **Prepared for Committee Vote:** Thursday, [Date].
