  Both miss important nuances though. They don't fully address how obligations emerge implicitly through participation in systems, nor the psychological aspects of norm enforcement. The key insight is that obligations in social practices come from reasonable expectations within an established system, not from explicit agreements. There's also interesting behavioral science about how norms change - usually through coordinated public actions rather than individual defiance.

