  Let me break down each exchange point by point. For turn (1), Nadia's argument about tipping being "just a convention" is technically correct - tipping is indeed a social norm rather than a legal requirement. But Marcus in turn (2) makes the stronger point by highlighting the real-world consequences: service workers depend on tips because their wages are structured that way. His argument connects the convention to material realities.

