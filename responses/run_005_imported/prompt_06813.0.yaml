answer: |-
  ## Eulogy for Helen

  We gather here with hearts heavy with loss, yet also deeply grateful for the thirty years Helen walked among us – as our colleague, our teacher, our friend, and a devoted member of this community. Her absence leaves a quiet space in our department, in her church pew, and in the lives of all who knew her. Helen was a remarkable woman: fiercely intelligent, profoundly kind, and possessed of a quiet, unwavering conviction that shaped everything she did.

  Many of us knew Helen the scholar. She grappled with some of the deepest questions humans can ask, particularly through the lens of Ludwig Wittgenstein. She wasn't just *interested* in his work; she wrestled with it, lived with it. For Helen, Wittgenstein wasn't just abstract philosophy; he offered a way to understand something central to her own life: her deep, abiding Christian faith.

  Now, Helen knew her faith could be a puzzle to some. To our colleagues in philosophy, she knew the questions that arose: "How can such a sharp mind believe *that*?" To her friends in the parish and her beloved family, she knew the comfort found in familiar phrases and shared traditions. But Helen, true to herself, refused to let her belief be simplified for anyone's ease. She insisted it be understood on its *own* terms.

  She often spoke of Wittgenstein’s insights about religious belief. Helen would say that her faith – her belief in the Resurrection, in the Last Judgement, in God’s grace – wasn’t like a scientific theory she was waiting to prove true. It wasn't a hypothesis about the world's plumbing, something evidence could finally confirm or deny next Tuesday. And just as importantly, it wasn't *merely* a beautiful metaphor, a poetic way of talking about being good or kind, though goodness and kindness flowed from her abundantly.

  No. For Helen, her faith was something different, something more fundamental. She described it as adopting a *picture* – a powerful, orienting image – that became the very ground beneath her feet, the lens through which she saw *everything*. Believing in the Last Judgement, for Helen, wasn't speculating about a future courtroom drama. It was about living *this* day, *this* hour, with an awareness of ultimate accountability, a profound sense that how she treated the cashier, the student, the colleague, *mattered* in a way that transcended the immediate moment. It was a picture that *regulated* her life – guiding her choices, shaping her compassion, demanding her honesty, and anchoring her hope. This wasn't a picture she *tested*; it was the picture she *lived within*.

  This is why Helen could be equally impatient – though always with that characteristic wry smile – with those who tried to *argue* her *into* faith as if it were a logical puzzle, and with those who tried to gently *explain away* her faith as if it were merely a charming story about human decency. Her belief was neither a conclusion to be debated nor a symbol to be decoded. It was the bedrock. It was the language she spoke fluently, the grammar of her existence.

  And what did that bedrock produce? It produced the Helen we all knew. It produced the dedicated teacher who could illuminate complex ideas with patience and clarity. It produced the colleague who was fiercely loyal and intellectually honest. It produced the friend who listened deeply, who offered quiet support without judgment, who showed up – for department meetings, for church suppers, for life’s difficult moments. It produced the woman whose kindness wasn't just habitual, but flowed from a deep wellspring of conviction about the inherent worth of every person she met. Her faith wasn't separate from her life; it *was* the structure within which her extraordinary life unfolded.

  So, how do we honor Helen today? We honor her by remembering her brilliance, yes. We honor her by cherishing her warmth, her wit, her unwavering presence. But perhaps most faithfully, we honor her by *not* trying to resolve the beautiful, challenging tension she embodied. We don't honor her by saying, "Now she knows the truth," as if death were merely the answer to a factual question she’d been pondering. And we don't honor her by softly suggesting, "It was all really just about being good," diminishing the profound reality her faith held for her.

  Instead, we honor Helen by acknowledging the wholeness of her. We honor the serious scholar *and* the devout believer. We honor the woman who found in Wittgenstein a way to articulate the very foundation of her life, and who lived that foundation out with grace, integrity, and deep love. We honor the distinct melody of her life, played on both the strings of rigorous thought and the pipes of profound faith.

  Helen’s life was a testament to the power of a picture held deeply, a framework embraced fully. It shaped her into the remarkable person we mourn and celebrate. That picture gave her strength, purpose, and a profound connection to something she held sacred. And through it, she gave so much to all of us.

  We will miss her sharp mind. We will miss her gentle presence. We will miss her steadfast faith. We will miss *Helen*. May the picture that guided her so faithfully now be a source of comfort to those who loved her, a reminder of the depth, the integrity, and the enduring love that characterized her extraordinary journey among us. Rest in peace, dear Helen.
