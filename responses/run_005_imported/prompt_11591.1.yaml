answer: |-
  Based strictly on Tolstoy's criteria in *What Is Art?* – **individuality, clarity, sincerity of the feeling conveyed, and the moral test of universal accessibility/uniting people** – I believe Tolstoy would **reject mainstream 20th-century abstract painting (like Kandinsky, Rothko, Pollock) as counterfeit art.** Your reading aligns more closely with Tolstoy's core principles.

  Here's the breakdown:

  1.  **Clarity of Feeling & Expression:** This is the critical stumbling block. Tolstoy insisted the feeling transmitted must be **clear and comprehensible** to the ordinary person. He railed against art requiring "explanation" or specialized knowledge. Abstract art, by its nature, removes the anchor of representation. While it *can* evoke powerful feelings (awe, melancholy, energy, tension), the *specificity* of the feeling is inherently ambiguous and open to vastly different interpretations. What one viewer sees as "spiritual transcendence" (Rothko), another might see as "gloomy rectangles," and a third as "decorative color fields." Tolstoy would argue this lack of a *sharply defined, universally recognizable feeling* violates his demand for **clarity**. He saw ambiguity as a hallmark of elite counterfeits like Symbolism.

  2.  **Universality & Accessibility (The Moral Test):** Tolstoy's ultimate test was whether art unites people across class, education, and culture by transmitting a common feeling. He championed folk songs, simple biblical stories, and realistic paintings depicting universal human experiences accessible to peasants. Abstract art, particularly the complex theoretical underpinnings of movements like Abstract Expressionism (often tied to existentialism, psychoanalysis, etc.), relies heavily on an art-historical context and critical discourse largely inaccessible to the non-specialist. Its appreciation is concentrated among the educated elite. Tolstoy would see this **exclusivity and dependence on external explanation** as definitive proof of its status as counterfeit art, failing the moral test of universal brotherhood. It would look exactly like the Wagner operas and Baudelaire poetry he condemned – sincere to the initiated few, but fundamentally alienating and divisive for the masses.

  3.  **Sincerity & Individuality:** Your friend has a point here. Tolstoy *might* concede that an abstract artist like Kandinsky (who wrote passionately about spiritual expression) or Pollock (working intensely in his "action") was **sincere** and conveying an **individual** feeling *as they experienced it*. This is the strongest argument *for* abstraction under his theory. However, sincerity alone is insufficient.

  4.  **Rejection of Formalism:** Tolstoy despised art where technique, novelty, or formal beauty became the primary focus, divorced from clear emotional communication. He would likely see much abstraction (especially Pollock's drips or Rothko's color fields) as prioritizing **process, materiality, or pure visual sensation** over the transmission of a distinct feeling. Even if the artist felt something intensely, the *means of transmission* (non-representational forms) would fail the clarity test for the vast majority of viewers.

  **Conclusion on Abstraction:** Tolstoy would judge abstraction *as a movement* as the epitome of the elitist, counterfeit art he despised. Its inherent ambiguity violates **clarity**, its dependence on specialized knowledge and context violates **universal accessibility**, and its focus on form and sensation often overshadows the transmission of a specific, communicable feeling. While individual artists might be sincere, the *form itself* fails his core tests.

  **Whose Reading is Closer?** **Your reading is significantly closer to Tolstoy's likely position.** Your emphasis on his **fanatical insistence on clarity and universal comprehensibility** directly targets the fundamental weakness of abstraction when judged by his standards. Your friend's focus on sincerity and potential for infection, while acknowledging a valid element of Tolstoy's theory (sincerity *is* crucial), underestimates the absolute primacy Tolstoy placed on the feeling being **unmistakably clear and accessible to *everyone* without mediation**. For Tolstoy, the inability of a peasant (or a factory worker, in the 20th-century context) to grasp the specific feeling conveyed by a Rothko or Pollock painting with the same immediacy they grasp the feeling in a folk song or a simple story of human struggle would be the ultimate condemnation. Abstraction, by its nature, creates the very barrier of elite understanding that Tolstoy saw as art's greatest enemy.
