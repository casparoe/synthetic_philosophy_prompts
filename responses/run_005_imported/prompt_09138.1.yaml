  Structure-wise, start with the personal anecdote about the argument with Mara. That sets up the academic context in a relatable way. Then pivot to Kessler's career as the real-world test of virtue. The joke about academia as the ultimate adversarial situation ties it together. Follow with specific stories of her integrity, leading to a heartfelt conclusion about her impact beyond academia.

  Check the tone: humor first, then warmth. Ensure transitions are smooth so it doesn't feel like two separate speeches. The ending should resonate emotionally, focusing on Kessler's influence on students and colleagues, making her family proud while satisfying the philosophers.

  Finally, the toast should honor Kessler's legacy, showing that virtues are proven through persistent choices in challenging situations, which is the essence of her work's defense against situationism. That neatly wraps the philosophical point in a personal tribute.
answer: |-
  Here’s a toast that threads the needle—honoring Professor Kessler’s legacy with warmth, wit, and a philosopher’s precision, while keeping both her colleagues and family fully engaged:

  ---

  **(Raise your glass, pause for quiet)**  

  "Last night, over one too many drinks, I got into a… *spirited* debate with a friend about whether people truly have consistent character—or if we’re all just puppets of whatever situation we stumble into. She threw psychology studies at me; I threw Aristotle back. We called it a draw. *(Smile, shrug)* But it got me thinking about Professor Kessler. Because honestly? If you want a *real* test of whether virtue is more than just good intentions… try surviving forty years in academia.  

  Think about it: hiring committees that feel like tribunals. Tenure reviews that stretch for years. Department meetings where the stakes are bafflingly high for the amount of carpet stains involved. *(Pause for light laughter)* If social psychologists designed the *ultimate* adversarial situation to expose whether someone’s character is real or just… conveniently untested? They’d basically recreate Professor Kessler’s calendar from 1984 onward.  

  And yet—here’s the miracle. For four decades, through every petty controversy, every funding crisis, every existential debate over curriculum… Professor Kessler didn’t just *survive* the situation. She *transcended* it. Not by being perfectly consistent in every single interaction—let’s be real, nobody survives faculty meetings without occasionally contemplating arson—*(pause for laughter)*—but by showing us, again and again, what her *evaluative outlook* truly was.  

  When grad students needed an advocate? She was there.  
  When a philosophical idea needed defending on principle, not popularity? She did it.  
  When the discipline itself seemed ready to reduce character to a statistical hiccup? She wrote the book. Literally. Several times.  

  That’s the thing about virtue—it’s not about being a robot who acts perfectly no matter what chaos descends. It’s about the choices you make *when the chaos descends*. It’s about the pattern you weave through a thousand little moments of pressure. And Professor Kessler? Her pattern is unmistakable: **integrity** with a backbone, **rigor** with generosity, and a **commitment to truth** that never sacrificed kindness on its altar.  

  *(Shift tone slightly, more personal warmth)*  
  To her family here tonight—this is the woman you know: the one who shows up, who cares fiercely, who probably argued ethics over your breakfast table. To her colleagues—this is the scholar who reminded us that character isn’t a myth; it’s a *project*, hammered out on the anvil of real, messy life.  

  So let’s raise a glass to Professor Kessler—a walking, talking, tenure-granting refutation of the idea that situations rule us. She proved, day after day, that some virtues are so deeply woven into a person… they become the situation.  

  To Professor Kessler: May your retirement be the one situation where the only demand is joy. Cheers!"  

  ---

  ### Why this works
  1. **The Joke Lands for Both Audiences**:  
     - *Philosophers* hear the situationist critique ("adversarial situation to test character") and the Kamtekar-inspired "evaluative outlook" reference.  
     - *Family* hears a funny, relatable truth about academia’s absurd pressures ("carpet stains," "contemplating arson").  

  2. **Warmth Anchors the Philosophy**:  
     - The shift to "When grad students needed an advocate? She was there" makes her virtue tangible and human—not abstract. Family hears her compassion; colleagues hear her professional legacy.  

  3. **The Punchline Honors Her Life’s Work**:  
     Framing her *entire career* as the "real-world experiment" subtly vindicates her defense of virtue ethics. Colleagues will nod; family will feel proud of her endurance.  

  4. **The Ending Unites the Room**:  
     "To her family... the woman you know... To her colleagues... the scholar..." explicitly ties both worlds together before the final, uplifting sentiment.  

  **Delivery Tip**: Lean into the humor early ("contemplating arson" should get a solid laugh), then slow down for the heartfelt lines about her choices and impact. End with strong eye contact and a warm smile during the final "Cheers!"  
  Professor Kessler—and her guests—will feel seen.
