  Next, the user wants warmth without turning it into a lecture. The toast should transition from the joke to Kessler's personal qualities. Highlighting her consistency and integrity over decades makes the virtue ethics argument tangible. Using specific examples like her advocacy for students or mentorship adds authenticity. 

