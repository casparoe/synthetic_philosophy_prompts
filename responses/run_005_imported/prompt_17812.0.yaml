answer: |-
  Let's unpack Joyce's accuracy-dominance argument for probabilism and the crucial role of strictly proper scoring rules. I'll focus on geometric intuition and the conceptual tension around propriety.

  ### Core Idea: Accuracy-Dominance & Why Coherence Matters
  Imagine all possible states of the world as points in a high-dimensional space. Your credences assign a number (between 0 and 1) to each proposition, forming a "credence vector." The "truth" in any world is a vector of 1s (true propositions) and 0s (false propositions). Accuracy is measured by a *scoring rule* (e.g., Brier score = squared Euclidean distance to truth).

  **The Claim:** If your credences violate probability axioms ("incoherent"), there exists some *coherent* credence function that is *more accurate than yours in every logically possible world*. You are "accuracy-dominated."

  **Geometric Intuition:**
  1.  **Coherent Credences:** Form a convex set (the "probability simplex"). For 3 mutually exclusive/exhaustive propositions, this is a triangle in 3D space (the points where credences sum to 1 and are non-negative).
  2.  **Incoherent Credences:** Lie outside this simplex (e.g., sum > 1 or < 1, or negative values).
  3.  **Truth Points:** Are the vertices of this simplex (e.g., (1,0,0), (0,1,0), (0,0,1)).
  4.  **Dominance:** An incoherent point `C` lies outside the simplex. Under a *strictly proper* scoring rule, the simplex is "strictly convex" relative to the scoring rule's geometry. Crucially, there exists a point `P` *on the simplex* such that the line segment connecting `C` to `P` points *directly away from every truth point* in the scoring rule's distance metric. Thus, moving from `C` to `P` gets you closer to *every* possible truth point simultaneously. `P` dominates `C`.

  ### Why Strict Propriety is Essential
  A scoring rule is **strictly proper** if, for any coherent credence `p`, the *expected inaccuracy* of reporting `p` is minimized precisely when your *true* expectation is calculated using `p` itself. In other words, your own credence `p` is the uniquely best estimate of its own accuracy. This implies **immodesty**: `p` doesn't expect any other credence (even a different coherent one) to be more accurate than itself on average.

  **Why dominance fails without strict propriety?** Consider the **absolute value (L1) rule** (Inaccuracy = Sum |Truth - Credence|).

  1.  **Violates Immodesty:** Suppose you have credence `p = 0.7` for a proposition. Under L1:
      *   Expected inaccuracy if truth is `1` = |1 - 0.7| = 0.3
      *   Expected inaccuracy if truth is `0` = |0 - 0.7| = 0.7
      *   Your *expected* inaccuracy using `p=0.7`: `(0.7 * 0.3) + (0.3 * 0.7) = 0.42`
      *   Expected inaccuracy of reporting `q=1.0`: `(0.7 * 0.0) + (0.3 * 1.0) = 0.30`
      *   Expected inaccuracy of reporting `q=0.0`: `(0.7 * 1.0) + (0.3 * 0.0) = 0.70`
      *   **`p=0.7` expects `q=1.0` (0.30) to be *more accurate* than itself (0.42)!** It's modest.

  2.  **Breaks the Dominance Argument:**
      *   **Example:** 3 mutually exclusive/exhaustive possibilities (A, B, C).
      *   **Incoherent Credence:** `C = (0.5, 0.5, 0.0)` (Sum = 1, but violates non-negativity? Actually, this *is* coherent if C is impossible! The problematic incoherence is *non-additivity* over partitions. Let's use a better example: `C = (0.9, 0.9, 0.0)` for A, B, C. Sum=1.8 > 1. *This* is incoherent).
      *   **Truth Points:** `T_A=(1,0,0)`, `T_B=(0,1,0)`, `T_C=(0,0,1)`.
      *   **L1 Inaccuracy Calculation:**
          *   At `T_A`: Inacc_C = |1-0.9| + |0-0.9| + |0-0| = 0.1 + 0.9 + 0 = 1.0
          *   At `T_B`: Inacc_C = |0-0.9| + |1-0.9| + |0-0| = 0.9 + 0.1 + 0 = 1.0
          *   At `T_C`: Inacc_C = |0-0.9| + |0-0.9| + |1-0| = 0.9 + 0.9 + 1 = 2.8
      *   **Is there a coherent `P` dominating `C`?** Consider `P=(0.5, 0.5, 0.0)` (coherent if C is impossible):
          *   At `T_A`: Inacc_P = |1-0.5| + |0-0.5| + |0-0| = 0.5 + 0.5 + 0 = 1.0 (Same as C)
          *   At `T_B`: Inacc_P = |0-0.5| + |1-0.5| + |0-0| = 0.5 + 0.5 + 0 = 1.0 (Same as C)
          *   At `T_C`: Inacc_P = |0-0.5| + |0-0.5| + |1-0| = 0.5 + 0.5 + 1 = 2.0 (**Better** than C's 2.8)
      *   `P` is better at `T_C` but *equal* at `T_A` and `T_B` – it **weakly dominates** C, but does **not strictly dominate** it. Joyce's theorem requires *strict* dominance. Now consider `P=(0.45, 0.45, 0.1)`:
          *   At `T_A`: |1-0.45|+|0-0.45|+|0-0.1| = 0.55+0.45+0.1 = 1.1 (**Worse** than C's 1.0)
          *   `P` is *less* accurate than `C` if `A` is true! Under L1, the incoherent `C=(0.9, 0.9, 0.0)` is **not strictly dominated** by any coherent credence. The argument collapses.
      *   **Geometric Reason:** The L1 norm (absolute value) creates "flat" surfaces and "kinks." Incoherent points can lie on an "L1 sphere" centered on a truth point in a way that moving them onto the probability simplex *requires* moving away from some truth points or towards others unevenly, preventing strict dominance across all worlds. Strict propriety (like Brier) creates a smooth, strictly convex geometry where incoherent points are always "farther out," and dominance is guaranteed.

  **Propriety Fixes This:** A strictly proper rule (like Brier) ensures:
  1.  **Immodesty:** Your credence `p` believes it is uniquely best. It doesn't shoot itself in the foot.
  2.  **Strict Convexity:** The set of coherent credences is strictly convex relative to the rule's distance metric. Any incoherent point `C` lies strictly outside this convex set. By the separating hyperplane theorem (or geometric properties of Bregman divergences, which generalize strictly proper rules), there *must* be a point `P` *on* the simplex strictly closer to *every* vertex (truth point) than `C` is.

  ### Is Assuming Propriety Methodologically Neutral?

  This is the deep philosophical worry, and the answer is contentious. Critics (e.g., Aaron Bronfman, unpublished manuscript; Hájek 2008) argue that **requiring propriety may smuggle in probabilism**. Here's the core tension:

  1.  **The Argument:** Propriety is presented as a desirable *independent* constraint on scoring rules (encouraging "honest reporting," satisfying immodesty). Combined with dominance avoidance, it yields probabilism.
  2.  **The Objection:** To understand "expected inaccuracy" (which defines propriety), you *already need probabilistic coherence*. The expectation `E[S(p, Truth)]` is defined as `Σ [p(w_i) * S(p, w_i)]` over possible worlds `w_i`. This presupposes:
      *   Your credences `p(w_i)` are defined over a *partition* (the `w_i`).
      *   They are *additive* (`Σ p(w_i) = 1`).
      *   They are *non-negative*.
      **This *is* probabilism applied to the finest-grained partition!** Requiring a rule to be proper relative to *this* expectation assumes the agent's credences *should* obey the probability calculus *over worlds* to even calculate the expectation by which propriety is judged. The argument might be circular.

  3.  **Joyce's Defense & Nuances:** Joyce (2009, 2016) argues this misrepresents his project:
      *   **Target:** The argument aims to show that credences defined over an *arbitrary Boolean algebra* of propositions should be probabilistic *over that algebra*.
      *   **Propriety's Basis:** The propriety constraint is justified *directly* by an "epistemic excellence" norm: A scoring rule should make *accuracy-truthfulness* the sole incentive for belief reporting. If a rule isn't proper, an agent motivated *only* by accuracy could be misled into reporting a credence other than her own true belief. Propriety ensures "candor" is accuracy-motivated. This norm is argued to be prior to and independent of probabilism.
      *   **Expectations as Hypothetical:** The expectations used to define propriety are calculated using the agent's *own* credences *as if they were probabilistic* over the partition needed for the calculation. The argument shows that if an agent *doesn't* have probabilistic credences over the target algebra, those very credences are accuracy-dominated relative to *any* rule satisfying this independent candor/truthfulness virtue. The expectation calculation is a tool to define the virtue, not an assumption that the agent *is* coherent over every partition.
      *   **It's Not a "Knock-Down" Proof:** Joyce concedes the argument isn't foundationalist. It assumes a plausible normative claim (dominated credences are defective; scoring rules should be strictly proper). If you reject those, you escape the conclusion. The point is to show probabilism is a consequence of attractive epistemic norms (accuracy-seeking + candor).

  **Conclusion & Your Questions:**

  1.  **Why Coherence Guarantees Non-Dominance under Propriety:** Geometrically, coherent credences form a convex set. Strictly proper scoring rules make this set "strictly convex" in a way that pushes any incoherent point outward, guaranteeing that a "projection" back onto the set dominates it strictly across all possible truths.
  2.  **Why Propriety is Essential:** Non-proper rules (like L1) lack the strict convexity and immodesty properties. They allow incoherent credences to "hug the coast" of the probability simplex in a way that prevents strict dominance, often only achieving weak dominance or none at all.
  3.  **Is Assuming Propriety Neutral?** It's **not uncontroversially neutral**. While presented as an independent epistemic virtue (promoting accuracy-motivated candor), the *definition* of propriety relies on probabilistic expectations over partitions. Critics see this as assuming the very coherence the argument aims to prove. Defenders see it as using a hypothetical calculation based on the agent's own credences to define a norm prior to coherence, revealing that incoherent credences fail that norm. The argument is best seen as a *coherence justification* showing how probabilism flows from compelling accuracy-based norms, rather than a *foundational derivation* from utterly neutral premises. The "separateness of propositions" worry highlights that epistemic utility theory, like consequentialism generally, risks ignoring logical/mereological structure; Joyce argues propriety handles this, but the debate continues.
