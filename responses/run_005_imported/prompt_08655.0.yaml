prompt: |-
  I'm outlining a novel with parallel timelines, and I ran a scene by my writing group where the MC finds out that in another branch of her life she became a murderer. It turned into a proper arguement between two people in the group and I can't stop turning it over in my head.

  (1) Mara said the murderer isn't really her, just a double who happens to share her face and memories up to the point their timelines split — similar enough to be recognisable, but not the same entity, so it'd be strange for my MC to feel actual guilt over it, more like feeling bad about a stranger who looks like you.
  (2) Dev said no, it's the exact same person, just a different branch of one life, and you don't need any causal thread linking the two versions for that to be true — we just stipulate it's her, same as how "if Napoleon had won at Waterloo" is still about Napoleon, not some Napoleon-ish stand in.
  (3) Mara said fine, authors can stipulate whatever they like, but that just makes "same person" a decision made for the plot, not a fact about her that could make guilt appropriate — you can't get a real emotion out of an authorial ruling.
  (4) Dev said the guilt doesn't need a metaphysical permission slip to make sense — people get survivor's guilt over stuff they had nothing to do with all the time — so the only question that matters is whether the two versions count as one self, and stipulating is exactly how identity questions get settled, in fiction and maybe in general.

  Neither budged and now I don't know who to side with for the book. Can you go through it move by move and say who's got the better of it at each step (not just who wins overall), and call out anything important both of them are missing?
reasoning: |-
  Okay, the user is outlining a novel with parallel timelines and presented a scene to their writing group where the main character discovers that in another timeline she became a murderer. This sparked a heated debate between two group members, Mara and Dev, about whether this alternate version is truly the same person as the protagonist. The user is struggling to determine whose perspective makes more sense for their story and wants a detailed analysis of each argument.

  Mara argues that the murderer isn't really the same person - just a double with similar features and memories up to the divergence point. She thinks it would be strange for the protagonist to feel actual guilt over this, comparing it to feeling bad about a stranger who happens to look like you. Dev counters that it is the exact same person, just in a different timeline branch, and that authors can stipulate identity without needing causal links. He compares it to historical counterfactuals like "if Napoleon had won at Waterloo" still being about Napoleon.

  The debate deepens when Mara acknowledges authors can stipulate whatever they want for the plot, but argues this makes "same person" an arbitrary decision that can't generate real emotion. Dev responds that guilt doesn't need metaphysical justification - people experience survivor's guilt over events they didn't cause - and that stipulating identity is how such questions are settled in fiction.

  I need to analyze this move by move. Both perspectives have merit but miss crucial aspects. Mara is right about the psychological challenge of feeling connected to someone who lived a completely different life after divergence, but underestimates how identity works in fiction. Dev correctly identifies that stipulation creates fictional facts, but oversimplifies the emotional mechanics.

  What's really interesting is what both are missing: the protagonist's psychology matters more than metaphysics. The narrative should focus on how she processes this revelation rather than abstract identity debates. The story could explore whether she feels connection through shared origin or alienation from different choices. This emotional authenticity will resonate more than philosophical correctness.

  The user's underlying need seems to be creating emotional impact while maintaining internal consistency. They want the guilt to feel earned, not forced. I should emphasize that the metaphysics serve the character's journey, not the other way around. The key is crafting how the protagonist interprets this revelation based on her personality, values, and existing relationships.

  I'll structure my analysis to examine each exchange, highlight strengths and oversights, then synthesize what matters most for the narrative. The focus should remain on serving the story's emotional truth rather than winning a philosophical argument.
answer: |-
  Here's a move-by-move breakdown of Mara and Dev's argument, highlighting the strengths, weaknesses, and crucial oversights at each step:

  1.  **Mara's Initial Move:** *"The murderer isn't really her, just a double... so it'd be strange for my MC to feel actual guilt."*
      *   **Strengths:** Grounded in a specific metaphysical view (numerical identity requires continuous existence/spatiotemporal path). Highlights the *psychological difficulty* of feeling deep personal guilt for a being whose life diverged significantly. Useful for realism in character reaction.
      *   **Weaknesses:** Assumes *her* metaphysical view is the only valid one. Downplays the power of shared origin and foundational memories/identity *up to the split*. Ignores how fiction can establish its *own* rules of identity.
      *   **What's Missing:** Doesn't address the *meaning* the MC might *assign* to this connection, regardless of strict metaphysics. Overlooks how powerful the *idea* "That *could have been me*" can be, even if technically false under her view.

  2.  **Dev's Counter:** *"No, it's the exact same person... we just stipulate it's her... same as counterfactuals."*
      *   **Strengths:** Correctly identifies the author's power to *stipulate* identity within the fictional world's rules. Effectively uses the counterfactual analogy (Napoleon) – the *referent* is the same person from a shared past. Focuses on the narrative function ("it's her").
      *   **Weaknesses:** Overly simplifies the potential psychological distance created by divergent lives. Risks making the connection feel arbitrary if not supported by the narrative and character psychology. Doesn't fully engage with Mara's point about the *feeling* of guilt needing a perceived connection.
      *   **What's Missing:** Doesn't explain *how* the stipulation translates into believable *emotional impact* for the character. Assumes stipulation alone is sufficient for reader/character buy-in.

  3.  **Mara's Rebuttal:** *"Fine, authors can stipulate... but that just makes 'same person' a decision... you can't get a real emotion out of an authorial ruling."*
      *   **Strengths:** Hits Dev's weak spot: **emotional authenticity.** Correctly states that an authorial fiat *alone* doesn't generate genuine feeling in the reader or character. Forces the question: *How* does the MC internalize this stipulation to feel guilt? Shifts focus to the *character's psychology* over the metaphysics.
      *   **Weaknesses:** Risks throwing the baby out with the bathwater. Stipulation *plus* character psychology *can* create powerful emotion. Doesn't offer an alternative path to the guilt *if* the author wants it.
      *   **What's Missing:** Acknowledges that while stipulation isn't *sufficient* for emotion, it can be *necessary* groundwork within the fictional world. Doesn't consider how the *MC's specific personality* might interpret the connection.

  4.  **Dev's Final Move:** *"The guilt doesn't need a metaphysical permission slip... people get survivor's guilt... so the only question is whether the two versions count as one self, and stipulating is how identity questions get settled..."*
      *   **Strengths:** **Crucial Insight:** Brilliantly detaches the *emotion* (guilt) from strict *causal responsibility*. Survivor's guilt is the perfect analogy – it's about connection, proximity, and "there but for the grace of God," not direct causation. Correctly re-centers the debate: the *fictional fact* of "same self" is established by authorial stipulation/narrative convention.
      *   **Weaknesses:** While stipulation settles the *fictional fact*, he still doesn't fully bridge the gap to *how the MC feels it*. Relies heavily on the survivor's guilt analogy, which might not map perfectly (the MC didn't *survive* the event that made the other a murderer; they lived a completely different life).
      *   **What's Missing:** Needs to explicitly link the stipulation ("it's her") to the *psychological mechanisms* that would make survivor's-guilt-like feelings plausible *for this specific character*. How does *she* come to feel connected to this "other self"?

  **Crucial Oversights by Both:**

  1.  **The Character's Psychology is Paramount:** Both got bogged down in metaphysics and authorial fiat, but the *real* question is: **How does your specific MC process this information?** What facets of *her* personality, beliefs, fears, or past make her interpret this revelation in a way that *could* lead to guilt? Does she feel a deep connection to her core identity, making the split-self feel like an intrinsic part of her? Is she prone to existential dread or responsibility? Or is she more pragmatic, seeing the other as a distinct entity? *Her* reaction defines plausibility more than abstract arguments.
  2.  **The Nature of the Split and the Murder:** The *timing* and *reason* for the timeline split matter immensely.
      *   Did it happen *before* the murder, making the other's path truly separate? Or did it happen *during* a moment of choice where the MC *almost* made the same decision?
      *   What *caused* the other version to murder? Was it a drastic, unforeseeable divergence (e.g., brain injury after split)? Or was it a choice stemming from a flaw or pressure the MC also feels but resisted? The more understandable the path (from the MC's perspective), the more plausible the guilt.
  3.  **"Sameness" as a Spectrum:** They treated identity as binary (same/different). In narrative terms, it's often a *spectrum of connection*. The MC might feel:
      *   "That *is* me, corrupted."
      *   "That *was* me, but then we became different people."
      *   "That *could have been* me, under those circumstances."
      *   "That is a terrifying reflection of a potential within me."
      *   "That is a stranger wearing my face and memories."
      *   **Each of these carries different emotional weight and potential for guilt.** Mara leans towards the last, Dev towards the first. The truth for your story likely lies somewhere in between.

  **Who "Wins" Each Move & Overall:**

  *   **Move 1 (Mara):** Mara wins on highlighting the *psychological challenge* and a coherent metaphysical view, but loses by presenting it as the *only* valid view. **Edge: Mara (for realism).**
  *   **Move 2 (Dev):** Dev wins on establishing the *author's power to stipulate* and the counterfactual analogy, but loses by not addressing the emotional translation. **Edge: Dev (for narrative authority).**
  *   **Move 3 (Mara):** Mara wins decisively on the **crucial point of emotional authenticity**. Stipulation alone isn't enough. **Win: Mara.**
  *   **Move 4 (Dev):** Dev wins by providing the **key insight detaching guilt from causation** (survivor's guilt analogy) and correctly stating stipulation settles the fictional fact. He partially addresses Mara's emotional concern with the analogy. **Win: Dev.**

  **Overall:** It's a draw, but Dev edges slightly ahead because his final move (survivor's guilt + stipulation as foundational) provides a more practical framework *for the author* to achieve the desired character reaction *if* they want the MC to feel guilt. **However, Mara's core warning about emotional authenticity is vital and cannot be ignored.**

  **The Path Forward for Your Novel:**

  1.  **Decide the Narrative Need:** Do you *want* the MC to feel profound, personal guilt? Or a different reaction (horror, fascination, detachment, responsibility to prevent similar paths)?
  2.  **Establish Your Stipulation:** Clearly define *within your story's logic* the nature of the connection. How do the timelines/branches work? Is identity tied to a unique "soul," a continuous consciousness, or just a branching set of experiences from a common origin point? **Show, don't just tell, this logic.**
  3.  **Build the Bridge to Emotion (The Crucial Step Mara Demanded):** Regardless of your stipulation, *show* the MC grappling with the connection. Use:
      *   **Shared Memories:** Focus on memories *before* the split that feel intensely personal, especially ones related to the *roots* of the murder (e.g., shared trauma, a shared temptation, a shared weakness).
      *   **The "There But For Fortune" Realization:** Emphasize the small, contingent differences that led her down a different path. Make the other's descent feel tragically plausible *to her*.
      *   **Existential Dread:** Explore her fear that the *potential* for that darkness exists within *her* core self.
      *   **Empathy:** Does she understand the other's pain or motivation, even if condemning the act?
      *   **Responsibility:** Does she feel responsible for *preventing* such paths in her own timeline or others?
  4.  **Make the Murder Plausibly Connected:** Ensure the murder in the other timeline stems from something recognizable (even if latent) in the MC's own psyche or past circumstances. The more arbitrary the divergence seems, the harder guilt is to sell.

  **Don't side with Mara or Dev; side with your MC and your story's emotional truth.** Use Dev's tools (stipulation, survivor's guilt concept) to establish the *possibility* of the connection, but heed Mara's warning and invest deeply in *showing* the MC's specific, psychologically believable journey to whatever feeling you want her to have about her murderous counterpart. The metaphysics serve the character and the emotion, not the other way around.
