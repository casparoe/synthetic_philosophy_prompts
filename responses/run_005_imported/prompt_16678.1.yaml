  First, I need to recall what the Frege-Geach problem is. It's about how non-cognitivist theories handle embedded moral statements, like conditionals or negations, without assigning truth-conditions. Blackburn's solution uses higher-order attitudes to explain logical validity as practical inconsistency. Gibbard uses norm acceptance and planning. Both seem elegant, so why is the problem still cited?

