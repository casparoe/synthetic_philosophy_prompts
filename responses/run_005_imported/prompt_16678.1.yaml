answer: |-
  You've hit on a genuinely complex and contested point in contemporary metaethics. Your assessment of Blackburn's and Gibbard's solutions as *substantial advances* that *fundamentally reshape* the dialectic is correct. However, the persistence of the Frege-Geach Problem (FGP) on syllabi and in surveys reflects not *just* inertia, but genuine ongoing technical debates about the *adequacy* and *completeness* of those solutions. Here's a breakdown of why FGP remains a "live" issue, moving beyond pedagogical convenience:

  1.  **The "Settling" vs. "Solving" Distinction:**
      *   Blackburn and Gibbard didn't just "solve" FGP in the way a mathematician solves an equation. They proposed *complex theoretical frameworks* (quasi-realism, norm-expressivism) that *aim* to explain moral discourse, including embeddings, *within* a non-descriptive starting point.
      *   The debate shifted from "Can expressivism *possibly* handle embeddings?" (largely conceded as "Yes, in principle") to "**Do these specific, intricate frameworks *satisfactorily explain* the *full range* of linguistic phenomena, including logical relations, compositionality, and truth-aptness, *without* collapsing into realism or facing new, equally severe problems?**"
      *   Many critics argue that while Blackburn/Gibbard show expressivism isn't *logically incoherent*, their explanations are *ad hoc*, overly complex, or fail to fully capture the *semantic properties* of moral language.

  2.  **Specific Technical Worries Persisting Beyond the 90s:**
      *   **Compositionality & Systematicity:** This is arguably the core of the *modern* FGP challenge. How do the *meanings* (understood expressivistically as states of mind: attitudes, plans, etc.) of complex sentences *systematically* derive from the meanings of their parts and their mode of combination? Critics (like Mark Schroeder in *Being For: Evaluating the Semantic Program of Expressivism*) argue:
          *   Blackburn's higher-order attitude analysis for conditionals ("H!-ing that if A then B" is disapproving of H!-ing A without H!-ing B) is *brilliant* for explaining validity as inconsistency, but it struggles to explain the *compositional derivation* of the meaning of the *whole* conditional from the meanings of its *parts*. The analysis seems tailored *specifically* to explain validity, not general semantic composition.
          *   Gibbard's planning states face similar compositionality challenges. What is the *general rule* for combining plan-laden states to form the meaning of any arbitrary complex sentence? Critics argue expressivist accounts often feel like a series of clever but disjointed patches for specific embedding contexts (conditionals, negation, disjunction, etc.), lacking a unified, systematic semantic engine analogous to truth-conditional semantics.
      *   **The Negation Problem (Schroeder's "Boo!/Hooray!" Problem):** This is a specific, potent compositional challenge. Consider:
          *   "Murder is wrong." → Expresses disapproval of murder (Boo! murder).
          *   "Murder is not wrong." → Expresses... *what*? Not disapproving? Approving? Something else?
          *   Blackburn analyzes this as a higher-order attitude: disapproval of the attitude of disapproval towards murder. But Schroeder argues:
              *   This makes the state expressed by "Murder is not wrong" radically different in *kind* from the state expressed by "Murder is wrong" (disapproving of disapproval vs. simple disapproval). Yet, intuitively, these sentences seem to express *opposing* attitudes of the *same kind*.
              *   Worse, it potentially "explodes" attitudes: "It's not wrong that murder is not wrong" would require a *third*-order attitude, and so on. This seems implausible as a model of ordinary thought and language.
      *   **Truth-Aptness & Quasi-Realism's Burden:** Blackburn's quasi-realism aims to *earn the right* for moral sentences to have all the trappings of realism (truth, belief, assertion, knowledge) *without* the metaphysical commitments. A persistent challenge is:
          *   **The Problem of "Creeping Minimalism":** If quasi-realism succeeds in making moral claims *indistinguishable* from genuinely truth-apt descriptive claims in terms of surface grammar, logic, and epistemic practices, does the distinction between realism and anti-realism collapse? Does quasi-realism become *indistinguishable* from a deflated realism (like Crispin Wright's minimal truth)? If so, has it really vindicated *expressivism*, or just shown that expressivism can *mimic* realism so well that the original motivation for expressivism (denying moral properties/facts) evaporates? Critics argue quasi-realism risks being *too* successful, undermining its own anti-realist foundations.
          *   **Explaining Convergence/Disagreement:** If moral attitudes are fundamentally non-cognitive states, how does quasi-realism explain the *phenomenology* and *practices* surrounding deep moral disagreement? Why do we treat them like disagreements *about how the world is*, rather than merely clashing preferences? While quasi-realism has answers (e.g., disagreement in attitude *presented as* disagreement in belief), critics argue these feel less satisfying than a realist explanation.

  3.  **Why Hybrid & Dynamic Expressivism Keep FGP Alive:**
      *   **Hybrid Expressivism (e.g., Ridge, Schroeder, Toppinen):** These views posit that moral sentences express *both* a belief-like state *and* a conative state. They explicitly *embrace* the need for a descriptive/truth-conditional component to handle compositionality and logic more straightforwardly. The FGP challenge for hybrids is:
          *   **The "Frege-Geach Problem for Hybrids":** How exactly do the *two* components (belief + attitude) interact compositionally? How does the *non-cognitive* component project through embeddings? Does the belief component carry all the logical weight, making the non-cognitive part inert in logic? If so, is it still genuinely expressivist? Or does the non-cognitive part create new problems? Hybrids are attempts to *solve* FGP by incorporating truth-conditional elements, but they generate *new* versions of the problem specific to their dual-component nature.
      *   **Dynamic Semantics (e.g., Charlow, Starr, Silk):** These approaches treat meaning not as truth-conditions or expressed attitudes, but as *context change potentials* (instructions for updating the conversational context or participants' mental states). They offer a different framework for handling embeddings. The FGP connection:
          *   **The Challenge of Capturing Logic/Validity:** While dynamic semantics can model embeddings, showing how it validates *precisely* the same logical inferences as standard logic within an expressivist framework remains an active research project. Critics question whether dynamic systems can fully capture the *normative force* of logical validity for moral arguments without smuggling in truth-conditional elements.

  **Characterizing the Dialectic for Your Paper:**

  Here's a balanced way to frame it:

  > "While the pioneering work of Simon Blackburn and Allan Gibbard in the 1980s and 90s represents a monumental advance for expressivism, decisively demonstrating that a sophisticated non-cognitivism *can*, in principle, account for the logical embedding of moral language and explain the validity of moral arguments (thus answering the *core challenge* of the Frege-Geach Problem as originally posed), the problem persists in the contemporary literature in a transformed and technically refined guise. The focus has shifted from demonstrating mere *logical coherence* to demanding a fully *systematic compositional semantics* that can rigorously derive the meanings of complex moral sentences (including negation, disjunction, and quantifiers) from the meanings of their parts within an expressivist framework, without resorting to *ad hoc* explanations or collapsing the distinction between expressivism and realism. Concerns about compositionality (especially the negation problem), the burden of quasi-realism in explaining truth-aptness without metaphysical inflation ("creeping minimalism"), and the specific challenges faced by newer hybrid and dynamic expressivist programs ensure that the Frege-Geach Problem remains a central locus of technical debate, driving ongoing refinement and innovation within the expressivist project. Consequently, while expressivism is no longer seen as *logically defeated* by the Frege-Geach Problem, demonstrating a fully satisfactory, unified, and compositional expressivist semantics remains an active and critical frontier of metaethical research."

  **Key References for the Current Debate:**

  *   Mark Schroeder: *Being For: Evaluating the Semantic Program of Expressivism* (2008) - The most influential critique of compositionality in traditional expressivism.
  *   Mark Schroeder: *Hybrid Expressivism: Virtues and Vices* (2009) - Challenges for hybrid views.
  *   Nate Charlow: *Logic and Semantics for Imperatives* (2014) & subsequent papers - Dynamic semantic approach.
  *   Billy Dunaway & Mark McPherson: *Reference and Response* (2016) - Discusses quasi-realism and creeping minimalism.
  *   Teemu Toppinen: *Hybrid Expressivism and its rivals* - Defends a hybrid view.
  *   James Dreier: *Negation for Expressivists* (2006) - Engages specifically with the negation problem.
  *   **Stanford Encyclopedia of Philosophy:** Entries on "Expressivism" (especially §5 & §7), "Moral Cognitivism vs. Non-Cognitivism" (§5), "The Frege-Geach Problem" - Excellent summaries of current debates.

  By framing the issue this way, you acknowledge the power of Blackburn and Gibbard while accurately capturing why FGP remains a vital and technically demanding area of research, not merely a historical relic. Good luck with your qualifying paper!
