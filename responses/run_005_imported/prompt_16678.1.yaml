  Hybrid expressivism, like Ridge's or Schroeder's, tries to combine cognitive and non-cognitive elements. But even they face challenges with compositionality. Dynamic semantics, like in Charlow's work, treats moral expressions as context updates, but this is still developing and hasn't fully resolved the issues.

