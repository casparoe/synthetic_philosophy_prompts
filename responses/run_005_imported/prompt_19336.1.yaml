  **Category that best fits:**
  The act is best described as **self-signaling**. Theo is reinforcing his own self-image as a generous person. This self-signaling can then lead to future benefits because it helps maintain a disposition that is beneficial in social interactions (as per Frank). The cost of the tip makes the self-signal credible (handicap-like). However, note that self-signaling is not one of the classic biological categories (handicap, index, conventional) but is a concept from psychology and economics. 

