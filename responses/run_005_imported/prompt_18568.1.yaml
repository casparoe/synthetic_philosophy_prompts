answer: |-
  You've grasped a key tension in the philosophy of promising, but both your summary and the standard interpretation of Hume/Scanlon flatten important nuances, especially regarding Scanlon. Your intuition *is* philosophically supported, primarily by Scanlon's reliance-based account. Here's a breakdown:

  1.  **Hume (The Flatter Account):**
      *   **Core Idea:** Promises are *artificial* constructs, part of a social convention ("human inventions, founded on the necessities and interests of society"). Their moral force derives entirely from the utility of *keeping* agreements for social stability and cooperation.
      *   **Sincerity Focus:** A promise is primarily a *performance* ("I promise") invoking the convention. Breaking it *is* wrong because it undermines this vital social practice. While insincere promises are worse (akin to fraud), the core wrongness lies in the *act of breaking the convention itself*, damaging the system everyone relies on.
      *   **Your Case:** Hume *might* say your friend wronged *society* by weakening the convention. But regarding *you personally*, if she was sincere initially, the primary wrong *to you* might be minimized in his framework, focusing more on the social damage. Your "scrambling" is an unfortunate consequence, but the core wrong is systemic. Your sense of betrayal might be seen as stemming from this social reliance.

  2.  **Scanlon (The Crucial Nuance - Principle Fidelity):**
      *   **Core Idea (Principle F):** Scanlon grounds promissory obligation in a deeper moral principle of justifiability to others: "**Principle F:** If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A's not doing so); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X *unless B consents to X's not being done.*"
      *   **Beyond Sincerity:** Scanlon explicitly moves *away* from reducing promise-breaking to insincerity. The core wrongness lies in the **creation of expectations and reliance** under specific conditions (assurance given and received), and then **letting the other person down without adequate justification or release**. The moral force comes from the **harm** done to the promisee's expectations and the **wrongful exercise of freedom** (creating a situation where another reasonably relies on you, then abandoning them).
      *   **Your Case is Textbook Scanlon:**
          *   Your friend **assured you** she would co-sign (conditions 1-6 likely met).
          *   You **relied** on this assurance (stopped looking, planned around it).
          *   She **changed her mind** for her own benefit (a cheaper studio).
          *   **No consent:** She didn't get your release *before* changing her mind and leaving you scrambling.
          *   **Justification?** Scanlon allows changing minds for "sufficient reason." Finding a cheaper option *for herself* likely doesn't constitute a "sufficient reason" *to harm you* given the reliance she induced. The burden of justification is on the promisor.
      *   **The Wrong:** The wrong isn't (just) about her state of mind *then*, but about her **failure to take responsibility *now* for the expectations she created and the reliance she knowingly caused.** She violated Principle F. You were harmed because she failed to live up to the assurance she provided, upon which you reasonably relied. Your sense of betrayal stems from this broken assurance and the harm caused.

  3.  **The Literature More Broadly:**
      *   **Reliance Theories (Scanlon):** Dominant today. Emphasize the harm to the promisee's expectations and the promisor's responsibility for inducing reliance.
      *   **Expectation Theories:** Similar, focus on the creation of a legitimate expectation.
      *   **Conventionalist Theories (Hume):** Focus on the damage to the social practice/institution of promising.
      *   **Non-Consequentialist Theories:** Some argue promises create a special moral bond or obligation intrinsically, regardless of consequences (though often incorporating reliance).
      *   **Critique of Sincerity-Only:** Most contemporary theorists *reject* the idea that the *only* wrong in breaking a sincere promise is exposing prior insincerity. The act of breaking the promise *itself*, especially when it harms the promisee who relied, is a distinct wrong.

  **Conclusion:**

  *   **You are correct** that a simplistic "promise-breaking = lying" view (sometimes attributed to Hume in caricature) wouldn't support your feeling wronged.
  *   **However, you are *incorrect* that this is where Scanlon or the broader contemporary literature lands.** Scanlon's Principle F **directly supports your judgment.**
  *   **The Wrong:** Your friend wronged you not because she lied initially (she didn't), but because:
      1.  She gave you a serious assurance (the promise).
      2.  You reasonably relied on it to your potential detriment (stopping your search).
      3.  She withdrew that assurance **without your consent and without sufficient justification relative to the harm caused to you.**
      4.  She failed to take responsibility for the expectations and reliance she deliberately created.
  *   **Philosophical Underpinning:** Your intuition of betrayal is perfectly aligned with Scanlon's reliance-based account (Principle F) and much of contemporary promissory theory. The wrong stems from the broken assurance and the harm caused by reliance, not from retrospective dishonesty. Hume's conventionalism offers a different, less personal, but still relevant angle on the social harm. Your feeling is philosophically sound.
