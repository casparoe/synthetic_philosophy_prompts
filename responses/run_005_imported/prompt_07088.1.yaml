prompt: |-
  A friend and I spent a long evening arguing about Lewis's Principal Principle and never quite settled it. Her view was that because Lewis is a Humean about chance -- chances at a time supervene on the pattern of the entire history of the world, future included, via the best-system analysis -- almost any proposition about how things later turn out has some power to make a different chance distribution fit the total pattern better than the one we started with. That, she said, is why "historical evidence" cannot simply be assumed admissible in the Principal Principle, and it's the real content of what Lewis, in "Humean Supervenience Debugged," called the "big bad bug." I granted the bug but argued that the standard fix -- conditionalizing not on the bare claim that the chance of A is x, but on a full history-to-chance conditional together with the actual history up to t (the so-called New Principle) -- doesn't defeat the bug so much as define it away: once the conditionalized proposition already builds in the very history that was doing the undermining, deference comes out true almost by construction, and it's unclear what's left of the idea that credence tracks an independently characterized objective feature of the world. She thought that was too quick. Could you go through, more carefully than we managed, exactly how undermining is supposed to threaten the original Principal Principle, how the New Principle is meant to block it, and whether my "basically definitional" worry actually holds up?
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a long debate with a friend about Lewis's Principal Principle and the "big bad bug" in Humean supervenience. The friend thinks that historical evidence isn't automatically admissible because future events can affect the chance distribution. The user, on the other hand, argues that the New Principle fixes the issue by making deference to chance almost definitional, losing the objective nature of chance.

  First, I need to recall the basics. Lewis's Principal Principle (PP) says that if you know the chance of A is x, your credence in A should be x, unless you have inadmissible information. But in Humean supervenience, chances supervene on the entire history of the world, including the future. So future events can "undermine" the current chance, meaning that the actual outcome might make the initial chance assignment part of a less optimal system.

  The user mentions undermining futures. For example, if the chance of heads is 0.5, but getting all heads makes the world's pattern better fit by a different chance (like 1.0), that's undermining. If you knew such a future would happen, PP could give inconsistent credences. That's the big bad bug. The friend points out that historical evidence isn't always admissible because future outcomes can affect what the best system is.

  Then there's the New Principle (NP). Instead of conditioning just on the chance, you condition on the history-to-chance conditionals plus the history up to time t. This builds the history into what you're conditioning on, so undermining is blocked. The user's worry is that NP makes chance deference trivial because it's defined by the very history that determines it. They feel it loses the objective character of chance.

  Now, I need to explain why the bug threatens PP, how NP fixes it, and whether the user's definitional worry holds. The friend thinks the user is too quick to dismiss NP. So the user wants a careful analysis.

  Breaking it down:

  1. **Threat to PP:** Under Humeanism, knowing an undermining future makes PP inconsistent. If your credence in A is based on chance, but the future outcome affects what the chance is, you get contradictions. Historical evidence might include information that indirectly points to undermining futures, hence not always admissible.

  2. **NP's Solution:** NP conditions on the entire history up to t and the laws linking history to chances. This includes all factors that determine chance, so no future information can undermine it. Chances become relative to history and laws, making them stable.

  3. **Definitional Worry:** Does NP reduce chance to a byproduct of history and laws? The user thinks it loses objectivity. But Lewis argues that chances are still objective because the best system is a factual matter about the world's pattern. NP respects that while avoiding inconsistency.

  Key points to address: 

  - **Objectivity under NP:** Chances aren't arbitrary. The best system is objectively determined by the world's mosaic. NP ensures credences align with this, but it's not trivial because finding the best system is complex.

  - **Work Left for Chance:** NP doesn't make PP redundant. It still guides credences where physical symmetries or past frequencies are unknown. Chance has a role in epistemology.

  - **The Bug's Status:** The bug is fixed by NP, but Humeanism remains. The user might conflate the bug with Humeanism itself. The fix handles undermining, but the supervenience base is still the whole history.

  The user's deeper concern might be about the nature of chance. If chance supervenes on the entire history, does it have any independent existence? Lewis's answer is that it's an emergent, objective feature based on the best system. NP preserves this while ensuring rational credence aligns with it.

  Also, the friend emphasizes that historical evidence isn't always admissible because it can hint at future patterns that alter the best system. NP bypasses this by including all relevant history in the conditioning information.

  In conclusion, the user's definitional worry has merit but overlooks that NP maintains chance's objectivity through the best-system analysis. It's not merely definitional; it's a coherent way to reconcile chance with Humeanism.
answer: |-
  Let's break down the Lewisian "big bad bug," its threat to the Original Principal Principle (OPP), how the New Principle (NP) resolves it, and your "definitional" worry. This requires stepping through the Humean framework carefully.

  ### 1. **The Original Principal Principle (OPP) and Humean Supervenience**
  - **OPP**: For a rational initial credence function *C*, if you know that the chance of proposition *A* at time *t* is *x* (*cht*(*A*) = *x*), and you have no "inadmissible" information (information about how the future turns out that isn't already encoded in the chance), then your credence in *A* should be *x*:  
    *C*(*A* | *cht*(*A*) = *x* ∧ *E*) = *x*,  
    where *E* is any admissible proposition.
  - **Humean Supervenience (HS)**: Chances supervene on the entire Humean mosaic (the total pattern of particular, non-modal facts across space and time). Specifically, Lewis's "best-system analysis" (BSA) defines the chance at *t* as the probability function specified by the best systematization (balancing simplicity, strength, and fit) of the *entire* world history, including the future.

  ### 2. **The "Big Bad Bug": Undermining Futures**
  - **Undermining Defined**: An *undermining future* for a chance hypothesis is a possible future outcome that, if actualized, would make the chance hypothesis *false* under the BSA. For example:
    - Suppose at *t*, the chance of a fair coin landing heads is 0.5: *cht*(*H*) = 0.5.
    - But a future with *all heads* might make a systematization specifying *cht*(*H*) = 1.0 *better* (simpler or higher fit) than one specifying 0.5, given the *entire* mosaic. If so, the actual occurrence of all heads *undermines* the original chance claim.
  - **Threat to OPP**: If an agent at *t* knows *cht*(*A*) = *x* and also knows an undermining future *F* (which is possible under HS), OPP generates inconsistency:
    - *C*(*A* | *cht*(*A*) = *x* ∧ *F*) *should* be *x* (by OPP, if *F* is admissible).
    - But if *F* obtains, *cht*(*A*) = *x* is *false* (by BSA). Thus, *C*(*A* | *cht*(*A*) = *x* ∧ *F*) should be *0* (since *cht*(*A*) = *x* is false given *F*).
    - Contradiction: *x* cannot simultaneously equal 0 and some other value.
  - **Why Historical Evidence Isn't Automatically Admissible**: Under HS, *any* proposition about the future (e.g., "the coin landed heads 1,000 times") could, in principle, affect whether the BSA endorses *cht*(*A*) = *x* over some rival. Since historical evidence (e.g., "the coin landed heads 999 times so far") is evidence about such future-undermining propositions, it may be inadmissible. Your friend is correct: the bug shows that under HS, *almost no non-trivial proposition is guaranteed admissible*.

  ### 3. **The New Principle (NP) as a Fix**
  - **NP Formulation**: Rational credence should conditionalize on the *entire history up to *t** (*H_t*) and the *history-to-chance conditionals* (the laws *L* specifying how chances depend on history). For *cht*(*A*) = *x*, NP says:  
    *C*(*A* | *H_t* ∧ *L* ∧ *cht*(*A*) = *x*) = *x*.  
    Here, *L* encodes statements like "If history *H_t* obtains, then *cht*(*A*) = *x*".
  - **How NP Blocks Undermining**:  
    - NP conditionalizes on *H_t* ∧ *L*, which *fixes the chance*. Since *L* specifies how *H_t* determines the chance, and *H_t* is fixed, *cht*(*A*) = *x* is entailed by *H_t* ∧ *L*.  
    - Undermining futures *F* are inconsistent with *H_t* ∧ *L* ∧ *cht*(*A*) = *x* (because if *F* obtains, *L* and *H_t* would imply a different chance). Thus, *C*(*F* | *H_t* ∧ *L* ∧ *cht*(*A*) = *x*) = 0.  
    - Result: The agent *cannot* entertain undermining futures while conditioning on *H_t* ∧ *L* ∧ *cht*(*A*) = *x*. The contradiction vanishes.

  ### 4. **Your "Definitional" Worry: Does NP Trivialize Chance?**
  You argue that NP makes deference to chance "true by construction" and severs the link to an "independent" objective chance. Let's evaluate this:
  - **The Charge of Triviality**:  
    - Yes, under NP, *cht*(*A*) = *x* is *deducible* from *H_t* ∧ *L*. Credence deference (*C*(*A*) = *x*) follows directly from conditionalizing on this package.  
    - In OPP, chance feels like an *external* constraint: you defer to *cht*(*A*) = *x* as an objective fact. In NP, chance is *internal* to the *H_t* ∧ *L* framework.
  - **Does This Eliminate Objective Chance?**  
    - **Lewis's Response (No)**: NP preserves chance's objectivity because:  
      1. *H_t* (the actual history to *t*) is objective.  
      2. *L* (the laws) is objective under BSA: it's the *best* systematization of the *entire* mosaic.  
      3. Thus, *cht*(*A*) = *x* is objectively determined by the world's total pattern.  
    - **Work Left for Chance**: NP still requires chance to "do work":  
      - *Epistemic*: Agents don't know *H_t* ∧ *L* in full. They use chances to guide credence when ignorant of history/laws.  
      - *Nomic*: *L* contains chance-laws (e.g., "quantum events have Born rule chances"), which are *contingent* but objective facts about the world's structure.  
    - **The Illusion of Independence**: OPP's "independent" chance is misleading under HS. Since chances supervene on the mosaic, they *cannot* be metaphysically independent of history. NP embraces this: chances are relational (*H_t*-relative) but objective features of the world's pattern.
  - **Residual Tension**:  
    - Your worry highlights a key tension in *Humeanism* itself: Can an "objective" chance exist if it's reducible to non-modal facts? Lewis says yes; critics (e.g., non-Humeans) say no. NP doesn't resolve this meta-issue but *coherently implements Humeanism*.  
    - **The Bug vs. Humeanism**: The "bug" is a technical flaw in OPP *given* HS. NP fixes the flaw, but HS itself remains controversial. If you reject HS, NP won't satisfy you—but it succeeds on its own terms.

  ### Conclusion: Where You and Your Friend Stand
  - **Your Friend is Correct** that HS makes historical evidence potentially inadmissible in OPP because future outcomes can retroactively "change" chances under BSA. This *is* the core of the bug.
  - **You are Correct** that NP resolves undermining by building history/laws into the conditioning information, making deference deductive. However, your "definitional" worry overstates the cost:  
    - NP doesn't trivialize chance; it *relocates* objectivity to the BSA-based laws (*L*) and history (*H_t*).  
    - Chance remains an objective feature of the world (for Humeans), but its authority is derivative, not primitive.  
  - **The Unsettled Core**: The real disagreement may stem from differing intuitions about Humeanism. If you view chance as metaphysically independent, NP feels hollow. If you accept HS, NP is a necessary fix that preserves chance's normative role. Lewis's "debugging" succeeds internally, but Humeanism itself remains philosophically contentious.  

  This doesn't resolve the metaphysics, but it clarifies why the bug arises, how NP avoids it, and why your worry—while insightful—doesn't undermine NP's coherence *within a Humean framework*.
