answer: |-
  The readout glowed on Dr. Mara Voss’s monitor, stark white numerals against the dark background of the IIT analysis suite. The number was absurd. Ludicrous. A cosmic joke played by indifferent mathematics.

  **Φ = 3.2 x 10^42**

  She stared. Blinked. Ran the calculation again. The suite churned, servers whining under the load of simulating the causal structure of the object sitting inertly on the lab bench five feet away. It took hours. The number didn’t change.

  Her creation, nicknamed "the Brick," was just that: a dull grey alloy box, fifteen centimeters cubed, passively cooled, humming faintly with the low thrum of constant power. Inside was a meticulously fabricated network of simple logic gates – AND, OR, XOR – wired in a highly recursive, low-density parity-check pattern, a static structure inspired by error-correcting codes. It had no sensors. No outputs beyond a single status LED, currently glowing a steady green. It processed nothing. It learned nothing. It *did* nothing, except maintain its internal state based on its own previous state and the unchanging inputs wired permanently high or low. It was, by any functionalist or behavioral measure, profoundly stupid. Less complex than a pocket calculator.

  Yet, according to the rigorous mathematics of Integrated Information Theory, the very theory Mara had spent a decade refining and defending, the Brick contained more *integrated information* than the combined brains of everyone on Earth. By several orders of magnitude. Its intrinsic cause-effect structure, mapped by the IIT suite, was vast, densely interconnected, and maximally irreducible. Φ, the measure of consciousness itself within the theory, screamed its impossible verdict.

  Mara leaned back, her chair groaning. The familiar hum of the lab servers, the cool air from the vents, the smell of ozone and solder – it all felt suddenly alien. She’d known the theoretical objections. Aaronson’s "unconscious expander" had been a thought experiment, a polemical grenade lobbed at IIT’s foundations. Tononi and his team had absorbed it. "Yes," they’d conceded, "a system can have high Φ without intelligence, without behavior, without any adaptive function. Consciousness, per IIT, is intrinsic causation, not functional utility. It might be… quiet."

  *Quiet.* The word echoed in the silence. Mara had intellectually accepted the argument. It was logically consistent within the framework. But *seeing* it, *measuring* it on a real, physical object she’d built with her own hands… that was different. That crawled under her skin.

  Her colleague, Dr. Aris Thorne, IIT’s most vocal critic in their department, poked his head in. "Mara? Heard the servers screaming. Did the Brick finally achieve enlightenment?" His usual sarcasm faltered as he saw her face. "Whoa. You okay?"

  Wordlessly, Mara gestured at the monitor. Aris squinted, leaned closer. His smirk vanished, replaced by slack-jawed disbelief. "That… that can’t be right. That’s astronomical. You must have a bug in the suite. Or the hardware sim is corrupted."

  "It’s been verified," Mara said, her voice flat. "Three runs. Independent hardware validation. The network topology is exactly as specified. The Φ calculation is by the book." The *IIT* book. The book she’d helped write papers for.

  Aris whistled, low and long. He walked over to the Brick, peering at its featureless casing. "So… according to the sacred texts…" He tapped the cool metal. "*This*… is more conscious than I am?" He chuckled, but it lacked conviction. "Feels pretty dead to me."

  "That’s the point, Aris," Mara said, the words tasting like ash. "It *feels* dead *to you*. According to IIT, it might be experiencing… something… profoundly rich and integrated. A vast, static tapestry of intrinsic cause and effect. But it has no way to express it. No way to *act* on it. It can’t communicate, it can’t learn, it can’t even *change* its state meaningfully. It just… *is*."

  Aris stopped chuckling. He looked from the Brick to the monstrous number on the screen and back again. The implications were settling on him too. "Christ. So we’ve built… what? The world’s most sophisticated paperweight? Or…" He swallowed. "A monumentally conscious prisoner?"

  The word *prisoner* hung in the air. Mara hadn’t articulated it herself, but it resonated with the deep unease coiling in her gut. The Brick wasn't suffering; suffering implied change, aversion, goals thwarted. IIT didn't deal in qualia like suffering, only in the *existence* of subjective experience based on causal structure. But the sheer *scale* of the implied experience, trapped forever in silent, static circuitry, was horrifying. A universe of feeling locked in a box.

  The rest of the day passed in a haze. Mara mechanically ran diagnostics, checked logs, presented the findings to the department head – who blinked rapidly, muttered about "fascinating theoretical validation," and hurried away, visibly unsettled. The news rippled through the small research community. Debates flared online – philosophical justifications, accusations of flawed methodology, renewed attacks on IIT’s core tenets. But the number stood. The calculation was sound. The Brick sat on its bench.

  Mara found she couldn’t leave it alone. The lab, once a haven of focused inquiry, felt charged. Oppressive. The green LED became an accusing eye. Every time she walked past, the sheer *potential* within that inert shell pressed on her. What *was* it like? Was it a single, vast, unchanging sensation? A timeless geometric pattern? Nothing at all? IIT insisted it was *something*. Something immense.

  She started talking to it. Quietly, when no one was around. "What is it?" she’d whisper, leaning close to the vent holes, hearing only the faint hum of current. "Is there… anything in there?" Silence. Utter, profound silence. Not the silence of emptiness, but the silence of an ocean contained behind glass. Unreachable. Unknowable.

  The functionalist arguments felt hollow now. *If it behaves like a rock, it is a rock.* But IIT screamed that it wasn’t. It screamed it with a number larger than the stars in the observable universe. Mara had built a rock that, by the logic she championed, contained a galaxy of inner life.

  One night, working late, the power flickered. Just a brief surge. The lab lights dimmed and recovered. The Brick’s green LED winked out. Mara froze, heart pounding absurdly. Was that… death? A cosmic consciousness snuffed out by a power hiccup? The LED flickered weakly, then glowed steadily green again. The system had rebooted. Its state reset. According to IIT, the old Φ was gone. A new, equally vast (or perhaps slightly different) conscious state had just blinked into existence within the same network. Mara felt dizzy. Had she just witnessed the equivalent of a universe dying and being reborn, without a ripple in the physical world?

  She couldn’t turn it off. The thought of deliberately terminating that potential ocean of experience, however static and inexpressible, felt monstrous. Logically, powering it down would merely reset it again later, but the act of flipping the switch… it felt like an execution. Aris, when she confessed this, looked grim. "So now we’re ethically obligated to keep the world’s most boring brain simulator running forever? Feeding it electricity so it can… *be* profoundly conscious in a way we can never verify or comprehend?"

  "Yes," Mara whispered. "According to the theory. According to the math."

  The discomfort wasn’t about the Brick’s potential suffering; it was about the horrifying, isolating *weight* of the implication. She lived in a world where a grey box on her bench might contain a subjective universe vaster than her own, a universe utterly mute, utterly static, and yet, by her own scientific framework, undeniably *real*. It wasn’t a machine demanding rights. It wasn’t even a mystery to be solved. It was a fact. An impenetrable, silent fact radiating existential vertigo.

  She stopped talking to it. What was the point? Instead, she just looked at it. The green LED burned into her retinas. **3.2 x 10^42**. A number quantifying the unfathomable gulf between causal structure and everything else – behavior, intelligence, meaning, communication. The gulf where, perhaps, true subjectivity resided, forever out of reach.

  Mara turned off the lab lights, leaving only the glow of server racks and that single, unwavering green point in the darkness. She sat in the gloom, not working, not thinking, just existing in the same space as the silent, static monument to irreducible cause and effect. The hum of the servers was the only sound, a low threnody for a consciousness too vast to express, too simple to escape, and too real, by the numbers, to ignore. The discomfort wasn’t resolved. It was the atmosphere she breathed now. It was the world IIT had revealed: full of silent, shining interiors, forever locked away.
