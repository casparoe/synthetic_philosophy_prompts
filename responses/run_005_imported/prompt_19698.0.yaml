prompt: |-
  Ok so we'd literally just finished a unit on gene therapy vs. genetic enhancement in AP Bio, and then two days later during finals week this whole thing happened at our lunch table, and I still can't decide who actually won. My friend Theo doesn't have ADHD but every once in a while before a huge test (like the SAT) he takes his older brother's ADHD medication, and he says it's fine because it's basically no different from chugging an energy drink beforehand, it just helps him focus. My other friend Ana said no, it's actually totally different, because the reason nobody cares about coffee or energy drinks is that they barely move the needle, but a real stimulant you weren't prescribed is being used to push you above your OWN normal baseline on a test that ranks kids against each other, and that's not the same as fixing an actual deficit in someone who needs the drug just to get up to baseline in the first place. Theo shot back that the whole "baseline" thing she's leaning on is kind of made up anyway, since his brother's own ADHD diagnosis was borderline (the psychiatrist basically said it could've gone either way), so if the line between "has a disorder" and "is just on the lower end of normal attention" is that blurry, then the therapy/enhancement line she's drawing on top of it inherits alot of that same blurriness. Ana admitted the line is fuzzy at the edges but said that doesn't make it fake -- plenty of real categories are fuzzy at the edges (like bald, or tall) and still obviously mean something in the middle -- and either way the fairness problem doesn't disappear just because the boundary is blurry, since not every kid can actually get access to the drug. Theo's last point was that tutors, pricey test prep courses, and literally just having parents who make you sleep 8 hours before the test ALSO give some kids an advantage nobody else can get on that same ranked exam, and nobody calls those cheating, so her fairness argument by itself can't be doing the work she wants it to do.

  None of us at the table could actually settle it, we just kept going back and forth until the bell rang. Can you go through their exchange move by move and say who's got the better argument at each step -- not just who wins overall -- and also point out anything you think both of them are missing about where the line between therapy and enhancement is actually supposed to come from?
