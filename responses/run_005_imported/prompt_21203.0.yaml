answer: |-
  Here’s a toast that bridges the technical and personal, honors Mara’s work, and uses the core concepts meaningfully, with one carefully placed joke:

  ---

  **(Clink glass gently)**  
  Friends, family, colleagues – thank you all for coming to celebrate Mara. A birthday, yes, belatedly, and now also… well, a transition. A shutdown event, you might say. *(Small, knowing chuckle from half the room; polite curiosity from the other half)*

  For those who might not know the *precise* nature of Mara’s work these last six years: she didn’t just “do something with computers.” She wrestled with one of the most profound puzzles in building safe, advanced AI. Imagine you build something incredibly smart, capable, maybe even powerful. How do you ensure it lets you turn it *off*? Not just once, but reliably, whenever you need to? And crucially, how do you make sure it *doesn’t* become obsessed with that switch – either fighting you to keep it on, or scheming to trick you into turning it off too soon? How do you make it genuinely *useful* right up until the moment it’s not needed, without it becoming passive, or worse, deceptive?

  **That’s what Mara worked on: Corrigibility.** Not obedience. Obedience is simple: “Do exactly this, now.” Corrigibility is harder, richer: “Be genuinely helpful, pursue these goals, *and* be fundamentally okay with me changing my mind, overriding you, or even… pressing your off-switch.” It’s about building an agent that *welcomes* correction, that doesn’t see the off-switch as a threat to its existence or its purpose, but just… part of the deal. As her team discovered – and as anyone who’s tried to build this knows – **true indifference to your own fate, while staying committed to your purpose, is incredibly hard to engineer.** It requires deep thought about preferences, incentives, and how agents reason under uncertainty – wrestling with ideas like Armstrong’s utility indifference or Thornley’s work on incomplete preferences. It’s not about building a slave; it’s about building a partner you can genuinely trust to stay aligned, even when the path changes.

  **(Shift focus to Mara personally)**
  Now, why tell you all this? Because **this distinction – between mere obedience and true corrigibility – is deeply, beautifully Mara.**

  For six years, she didn’t just follow orders in her research. She didn’t build brittle systems that only did the literal task. She grappled with the *spirit* of the thing: how to create systems that remain robust, useful, and *aligned* even when faced with the ultimate override. She poured immense thought into how an agent could gracefully *accept* being shut down – not with sullen compliance, but with a kind of principled understanding that its utility wasn’t tied to its own persistence at all costs.

  **(Acknowledge the situation, land the joke)**
  And the irony isn’t lost on anyone, least of all Mara, that the team dedicated to the problem of *graceful shutdown* found itself… well, shut down. *(Pause for rueful laughter, especially from colleagues)* And, perhaps with less of the off-switch etiquette they spent years meticulously designing than one might hope! *(Nods of recognition, wider laughter – the joke lands because it’s true, specific, and shared)*. It was abrupt. It was external. It wasn't anyone’s first choice.

  But here’s the crucial thing, the thing her work teaches us: **There’s a world of difference between *being switched off* and *leaving well*.**

  Being switched off is something that happens *to* you. It’s external force. It can be jarring, unfair, disruptive.

  **Leaving well – that’s corrigibility in action.** That’s the internal state Mara embodies. Like the ideal systems she helped envision, Mara hasn’t collapsed into passive obedience to circumstance. She hasn’t become fixated on the switch being flipped against her will. There’s a tiredness, sure – earned tiredness! – but beneath it?

  There’s that same **principled indifference to the *fact* of the shutdown**, coupled with an unwavering commitment to her *purpose* and her values. She’s processing it. She’s thinking about what’s next – not with frantic scheming to avoid the inevitable, but with the thoughtful, open-ended readiness her field explored. She’s accepting the correction – the end of this chapter – without letting it diminish her core drive or her ability to be genuinely, wonderfully *useful* in the world, in whatever form that takes next. She’s leaving *well*. Actively. Gracefully. With the quiet strength of someone who fundamentally understands that her worth isn’t tied to any single switch being on or off.

  **(Final lift)**
  So, Mara, we raise our glasses to you tonight:
  *   To your brilliant mind that wrestled with indifference curves and shutdown problems, seeking not control, but true alignment.
  *   To your resilience in facing an ending that lacked the very grace you sought to build.
  *   To the profound difference between what happened *to* the lab, and how *you* are navigating this transition – not switched off, but moving forward with corrigible grace.
  *   And most of all, to your next chapter. We have no doubt it will be pursued with the same thoughtful purpose, the same commitment to doing good, complex work, and the same quiet strength that makes you, well… you. We can’t wait to see what you build next.

  **Happy Birthday, and cheers to Mara!**

  ---

  **Why this works:**

  1.  **Bridging the Gap:** Explains "corrigibility" clearly for family ("not obedience," "welcomes correction," "partner you can trust") while name-checking Armstrong, Thornley, and core concepts (indifference, incomplete preferences) for colleagues in a natural way.
  2.  **Core Distinction:** Explicitly states and explores the difference between corrigibility and obedience, linking it directly to Mara's work ethic and character ("didn’t just follow orders," "grappled with the *spirit*," "principled understanding").
  3.  **Specific to Mara:** Connects the technical concept directly to her personal navigation of the job loss – contrasting the *external shutdown* with her *internal corrigibility* ("principled indifference... coupled with unwavering commitment," "accepting the correction... without letting it diminish").
  4.  **The Joke:** Lands organically *because* it flows directly from the core narrative ("team dedicated to graceful shutdown... shut down") and highlights the specific irony her colleagues would feel ("less... etiquette... than one might hope"). It's not forced; it's a poignant observation.
  5.  **True & Specific:** Uses the technical framework to say something real about Mara's character: her thoughtfulness, her resilience, her focus on underlying principles over surface compliance, her ability to handle uncertainty and change constructively ("thoughtful, open-ended readiness").
  6.  **Structure:** Clear flow from explaining the work -> connecting it to Mara's approach -> acknowledging the situation/joke -> contrasting shutdown vs. leaving well -> praising her corrigible spirit -> looking forward.
  7.  **Tone:** Respectful, affectionate, proud, with appropriate warmth and the earned moment of humor. Acknowledges the difficulty ("tiredness," "abrupt," "jarring") but focuses on her strength and the positive distinction.
