prompt: |-
  Ok so this has been bugging me for months and I can't get a straight answer out of anyone. My roommate and I had a small fire in our kitchen a while back - I'd left a candle burning too close to the curtains, and totally separately, his space heater had a wiring fault and had been sparking the whole evening too. The fire investigator said either one alone, with the other completely out of the picture, would've started that exact same fire in that exact same spot. So now his argument is "my heater didn't actually cause anything, since the fire would've happened anyway because of your candle" - but i could say the identical thing right back about his heater and my candle. Which by that logic means NEITHER of us caused it, and that just cant be right since something obviously did. Our insurance company wants one clear "cause" before they'll pay out. Is there an actual sensible way to figure out who (or what) really caused this, or does "cause" just stop meaning anything once two things overlap like that?
