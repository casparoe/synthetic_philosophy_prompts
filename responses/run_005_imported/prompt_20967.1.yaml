prompt: |-
  I'm a philosophy PhD student working on formal epistemology (mostly Bayesian stuff), and I got derailed from my quals reading list last night arguing with a friend from the math department about Bertrand's paradox. Setup, in case it's useful: you inscribe an equilateral triangle in a circle and ask for the probability that a "randomly chosen" chord is longer than a side of the triangle. Pick the chord via two random endpoints on the circumference and you get 1/3; pick a random radius and a random point along it and you get 1/2; pick a random point in the disk to be the chord's midpoint and you get 1/4. Same question, three mutually exclusive answers, and there's no fact of the matter about which procedure counts as "the" uniform distribution over chords, since "pick a chord at random" just underdetermines the sampling procedure.

  My friend's take, which I'm embarassingly close to being convinced by, is that this basically sinks the principle of indifference as any kind of rational constraint on credences. If "assign equal probability to symmetric-seeming outcomes" can be made to spit out three incompatible answers to literally the same question just by fiddling with the parametrization, then indifference reasoning was never tracking anything objective to begin with, and the only honest position left is pretty much full subjectivism - your priors just need to be internally coherent, and beyond that your "degree of ignorance" doesnt actually constrain credence at all. Is my friend basically right about this, or is there a decent reply available to people like Jaynes who still want symmetry/indifference considerations to do real normative work in pinning down priors? I feel like I'm missing something here but can't quite put my finger on what.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a philosophy PhD student in formal epistemology, focusing on Bayesianism, and they're stuck on Bertrand's paradox after arguing with a math friend. The paradox shows three different probabilities for the same geometric problem depending on how you choose the chord: 1/3, 1/2, or 1/4. Their friend claims this sinks the Principle of Indifference (PoI), leading to full subjectivism where only coherence matters, not "ignorance" constraining priors. The user wonders if there's a rebuttal, maybe like Jaynes'.

  First, I need to recall Bertrand's paradox clearly. It's about the probability that a random chord in a circle is longer than the side of an inscribed equilateral triangle. The different methods—choosing two random endpoints, a random radius and point on it, or a random midpoint—give different results. The core issue is that "uniform distribution over chords" isn't well-defined without specifying the sampling method. 

  The user's friend argues that PoI fails because symmetries don't pin down a unique prior. If the same problem yields three answers based on parametrization, PoI isn't objective. That pushes toward subjectivism: priors just need to be coherent (e.g., satisfying Kolmogorov axioms), not based on ignorance. The user is tempted but wants to know if there's a defense, like Jaynes'.

  Jaynes' approach is key here. He used invariance under transformations to resolve Bertrand's paradox. For example, demanding translational and rotational invariance leads to the midpoint method, giving 1/4. The idea is that PoI should apply to underlying symmetries, not arbitrary parameterizations. Jaynes claimed this yields a unique answer, making PoI work if applied to the right space.

  But Jaynes' solution has critiques. Some argue it's circular—assuming which symmetries matter—or that other problems (like cube factory) show similar ambiguities. So, even invariance might not always work. The user might need to consider this tension: Jaynes offers a path, but it's not universally accepted.

  The user's deeper concern seems to be about the foundations of Bayesian epistemology. If PoI is undermined, does that force subjectivism? Or can it be salvaged? They might be wrestling with how to justify objective priors in their work. Also, as a PhD student, they could be looking for a nuanced position that avoids both naive indifference and full subjectivism.

  Possible replies to the friend: 
  1. Jaynes' invariance: PoI isn't broken; it's misapplied. Focus on symmetries of the problem itself. 
  2. Weakened PoI: Use it as a heuristic when symmetries are clear, but acknowledge it's not infallible. 
  3. Pragmatic approach: Priors are context-dependent, and Bertrand exposes that, but it doesn't make PoI useless. 

  The user's identity as a formal epistemologist means they need a sophisticated take. Highlighting that PoI can be refined (like Jaynes) or that subjectivism isn't the only option. Maybe mention that even in subjectivism, rational agents might converge with evidence, so initial priors matter less.

  Also, the user feels they're missing something. Perhaps it's that Bertrand's paradox shows the need for explicit sampling methods, not that PoI is entirely invalid. Or that symmetry arguments require careful metaphysical grounding. 

  In conclusion, the friend has a point—Bertrand shows PoI's fragility—but Jaynes offers a counter. The user can acknowledge the problem while defending a tempered role for indifference in constrained contexts. This maintains some objectivity without denying the paradox's challenge.
answer: |-
  Your friend's argument hits at a deep tension in formal epistemology, but Bertrand's paradox doesn't *necessarily* force a collapse into full subjectivism. Here's a breakdown of the key perspectives and a possible Jaynesian reply:

  ### 1. **The Friend's Argument (Strong Subjectivist Take)**
     - **Core Claim**: Bertrand's paradox demonstrates that the Principle of Indifference (PoI) is *parametrization-dependent*. Since different "symmetric" parameterizations (endpoints, radius/midpoint, disk midpoint) yield contradictory probabilities (1/3, 1/2, 1/4) for the same event, PoI fails to track objective symmetries. 
     - **Implication**: Without a unique "correct" parametrization, "ignorance" cannot rationally constrain priors. Only coherence (Kolmogorov axioms) remains as a normative constraint. Priors are purely subjective.

  ### 2. **Jaynes' Rebuttal: Invariance as the Key**
  Jaynes (in *"The Well-Posed Problem"*) argues Bertrand's paradox exposes not the *failure* of PoI, but its **misapplication**. His resolution:
     - **Physical Symmetry Requirement**: A well-posed problem must specify *which physical symmetries are relevant*. Probability should be invariant under transformations preserving *ignorance-relevant properties*.
     - **Bertrand Resolved**: For chords, the key symmetry is *translational/rotational invariance* of the circle. If we demand that:
       - The probability distribution is unchanged by rotating/shifting the circle (i.e., no distinguished points/directions),
       - The "natural" parametrization is the **midpoint method** (choosing a random point in the disk as the chord's midpoint).
       - This uniquely yields **P = 1/4**.
     - **Why?** 
       - Endpoint method: Distinguishes circumference points (violates rotational symmetry).  
       - Radius method: Distinguishes radial directions (violates rotational symmetry).  
       - Midpoint method: Treats all points/directions equally. The uniform density over the disk respects rotational/translational symmetry.
     - **PoI Salvaged?** Jaynes claims this shows PoI *works* when applied to *transformation groups* defining the problem's symmetries. Ignorance = invariance under relevant transformations.

  ### 3. **Critiques of Jaynes & Lingering Issues**
     - **Circularity?** Critics (e.g., Shackel, Marinoff) argue Jaynes presupposes *which* symmetries matter. Why rotational invariance rather than (e.g.) arc-length symmetry? His "solution" may just reflect *his* intuition about "ignorance".
     - **Non-Uniqueness**: Other problems (e.g., the "cube factory" paradox) suggest transformation-group PoI doesn't *always* yield unique priors. Different symmetry groups can conflict.
     - **Metaphysical Burden**: Jaynes shifts the problem to justifying *which physical symmetries are epistemically relevant*—a non-trivial metaphysical task. Is this truly "objective"?

  ### 4. **A Middle Path: Weakened Indifference & Pragmatism**
     - **PoI as Heuristic, Not Rule**: PoI can guide priors *when symmetries are unambiguous* (e.g., dice, coins). Bertrand exposes that "chords" admit multiple symmetry intuitions. PoI fails when the *space of possibilities* isn't uniquely defined.
     - **Contextualism**: The "correct" prior depends on the *empirical sampling process* (e.g., how chords are *actually* generated). If the process is unspecified, there is no unique answer. This isn't subjectivism—it's *underspecification*.
     - **Objective Bayes Alternatives**: Some (e.g., reference priors, maxent) use PoI *plus* additional constraints (e.g., maximising entropy given known symmetries). These can avoid Bertrand's contradictions but require careful justification.

  ### 5. **Where This Leaves You**
     - **Your friend is partially right**: Bertrand *does* show that naively applying PoI to under-specified problems leads to contradictions. Pure indifference is untenable as a universal norm.
     - **But not fully subjectivist**: Jaynes demonstrates that *with additional symmetry constraints*, PoI *can* yield unique, defensible priors. The deeper issue is justifying those constraints.
     - **A Defensible Reply**: You can grant that PoI is fragile but argue it still plays a role in well-constrained contexts:
       - When symmetries are physical and uncontroversial (e.g., particle physics), PoI *is* rationally compelling.
       - In underspecified problems like Bertrand, we must either:
         - (Jaynes) Seek the parametrization invariant under the broadest relevant symmetry group, or  
         - (Contextualist) Admit the problem is ill-posed without a sampling mechanism.

  **Conclusion**: Bertrand's paradox *does* undermine a naïve Principle of Indifference, but it doesn't doom *all* symmetry-based reasoning. Jaynes' invariance approach offers a coherent (if contestable) path to salvaging PoI for geometric problems. However, it shifts the debate to justifying symmetries—a task blending epistemology, metaphysics, and pragmatism. Your takeaway might be: **Indifference requires *justified* symmetries; without them, we face subjectivism or underspecification.** For your quals, emphasize that formal epistemology must grapple with this ambiguity—Bayesians can't ignore Bertrand, but they needn't surrender to subjectivism either.

  > *Further reading*:  
  > - Jaynes, E.T. (1973). ["The Well-Posed Problem"](https://bayes.wustl.edu/etj/articles/well.pdf) (the canonical reply)  
  > - Shackel, N. (2007). ["Bertrand’s Paradox and the Principle of Indifference"](https://philpapers.org/rec/SHABPA-2) (critique)  
  > - Howson, C. (2014). *"Bayesianism as a Pure Logic of Inference"* (subjectivist perspective)  
  > - Mikkelson, J.M. (2004). ["Dissolving the Wine/Water Paradox"](https://arxiv.org/abs/physics/0403119) (applying Jaynesian invariance elsewhere).
