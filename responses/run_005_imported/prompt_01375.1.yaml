prompt: |-
  Hey, hoping to get some feedback on something a bit outside my usual lane. I'm a PhD student working mostly on phil of math (Gödel's Platonism, incompleteness, that whole cluster), and I got roped into giving a short "fun fact" style talk for our history-of-analytic-philosophy reading group this Thursday. Instead of doing the safe thing and rehashing incompleteness for the millionth time, I decided to dig into Gödel's actual argument for personal immortality, which he apparently laid out in a series of letters to his mother Marianne in 1961 after she asked him point-blank whether he thought they'd see each other again after death. I don't read German and havent tracked down the original letters in the Nachlass, so I'm going mostly off Hao Wang's book and a couple of secondary discussions -- meaning there's a real chance I've mangled some detail, so please flag anything that looks off to you.

  Here's my attempt at tightening the argument into something premise-shaped, since Gödel himself just kind of asserts it rhetorically to his mom rather than laying it out formally:

  P1. Reality as a whole is rationally organized -- everything in it has a reason, basically a full-blooded principle of sufficient reason, which Gödel thinks is confirmed by the fact that science keeps finding order and regularity wherever it looks.
  P2. A rationally organized world doesn't produce something as complex and high-potential as a human mind/character only to have almost all of that potential permanently wasted.
  P3. An ordinary human life realizes only a small fraction of a person's developmental potential before death cuts it off.
  C. Therefore each of us must go on developing after bodily death, in some further existence (not reincarnation on earth -- he's explict that it's a genuinely different kind of existence, more like finally understanding stuff from this life in retrospect).

  I also vaguely remember him connecting all this to his rejection of materialism, partly on the strength of the incompleteness theorems (something like: if the mind isn't a finite formal system, or math is discovered rather than invented, materialism is in trouble, and a non-materialist universe is exactly the kind of place personal survival could make sense) -- but I'm way less confident I'm representing that link fairly, it might just be me reaching for a connection that isn't really there in what he wrote to his mother.

  Could you give me comments on: (1) whether P1-C is a fair compression of what Gödel was actually arguing, or whether I've flattened out something important; (2) whether the incompleteness-theorem connection in the last paragraph is legitimate or a stretch on my part; and (3) the strongest objection to the argument as I've reconstructed it -- I have a hunch P2 is smuggling in the assumption that the only way potential can be "used" rationally is via the very same person surviving to realize it, and that a rational world could make use of unrealized human potential in tons of other ways without anyone surviving, but I haven't managed to state that worry very crisply. Also, honestly, feel free to just tell me if this is too slight/cute a topic for 20 minutes in front of people who mostly work on modal logic and formal semantics.
