answer: |-
  Your editor's oversimplification misses the crucial nuances—du Châtelet and Epicurus share a hedonistic framework but diverge radically in their mechanics of happiness. Here's a precise structural comparison:

  ### Core Definitions of Happiness
  - **Epicurus:** Happiness (*eudaimonia*) is **ataraxia** (freedom from disturbance) and **aponia** (absence of pain). Pleasure is defined *negatively*: the removal of physical/mental suffering. The highest good is tranquility.  
  - **Du Châtelet:** Happiness is **active fulfillment through passionate engagement**. It’s a *positive* state of exhilaration, requiring "the movement of our passions" (as she writes). Stasis equals boredom—the enemy of joy.

  ### The Role of Passion & Desire
  - **Epicurus:**  
    - Desires must be **categorized and minimized**:  
      *Natural/necessary* (food, shelter) – satisfy simply.  
      *Natural/unnecessary* (sex, luxury) – limit severely.  
      *Vain/empty* (fame, power) – eliminate.  
    - Passions are turbulent; ambition or obsessive love *disrupts* ataraxia.  
  - **Du Châtelet:**  
    - Passions are **essential engines of happiness**, even (especially) the "reckless" ones. Gambling, ambition, and intellectual obsession generate vitality.  
    - **Intensity matters**: "Lukewarm passions" are worthless; only "strong, violent ones" create true happiness.  
    - *Key divergence*: For du Châtelet, tranquility = stagnation. Epicurus sees it as the goal.

  ### The Necessity of Illusion
  - **Epicurus:**  
    - **Illusions (false beliefs)** cause fear (e.g., of gods or death), destroying ataraxia.  
    - Happiness requires *seeing reality clearly* via science/philosophy to eliminate anxiety.  
  - **Du Châtelet:**  
    - **Illusions are vital tools**: "One must nourish one’s illusions" because they fuel passions.  
    - Self-deception about love, ambition, or even the importance of one’s work sustains engagement.  
    - *Crucial contrast*: Where Epicurus uses reason to *dissolve* illusions, du Châtelet uses reason to *curate* them ("choose your chimeras wisely").

  ### The Place of Intellectual Pursuits
  - **Overlap:**  
    Both value study as a supreme pleasure. Epicurus prizes philosophy for banishing fear; du Châtelet celebrates the "passion for study" as a transcendent joy.  
  - **Divergence:**  
    - For Epicurus, study *serves* tranquility by eliminating mental disturbances.  
    - For du Châtelet, intellectual passion is *itself* a consuming fire—valuable for its intensity, not its peacefulness. She describes her Newtonian work as an "ardor" that *is* happiness.

  ### Pain & Risk Tolerance
  - **Epicurus:**  
    - Avoid all pain/risk that threatens stability. No gambling, volatile relationships, or overreach.  
    - "Live unknown." Withdraw from public strife.  
  - **Du Châtelet:**  
    - **Embrace productive pain**: Suffering for love or ambition is preferable to boredom. Gambling’s thrill outweighs financial risk.  
    - "One must have the courage to be unhappy sometimes" to achieve great joys.  

  ### Where They’d Recognize "Happiness"
  - Epicurus: Would see du Châtelet’s life (salons, Voltaire, gambling debts, obsessive work) as a chaotic nightmare.  
  - Du Châtelet: Would deem Epicurus’ garden a prison of understimulation.  

  ### Conclusion: Shared Roots, Opposing Visions
  **Your editor is wrong to call it Epicureanism.** While both ground happiness in pleasure/hedonism, their strategies are antithetical:  
  - **Epicurus** is a **minimalist**: Happiness = *subtracting* disturbance.  
  - **Du Châtelet** is an **intensificationist**: Happiness = *multiplying* engagement.  

  **Crucial nuance:** They’re *not* simply "indulgence vs. restraint." Du Châtelet is strategic—she advocates *curating* passions/illusions with reason, not blind hedonism. But where Epicurus seeks to extinguish the fire of desire, du Châtelet tends it for maximum blaze. Her "Discourse" is a manifesto for **Enlightenment vitality**—a happiness found in the "fever" of existence, not its cure.  

  **For your piece:** Frame du Châtelet’s view as a radical *corrective* to sterile rationalism. She champions passion as the force that animates reason—a physicist who understood happiness as kinetic energy, not inertia. The contrast with Epicurus sharpens her originality: she reclaims turbulence not as failure, but as essence.
