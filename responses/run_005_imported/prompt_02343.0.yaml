answer: |-
  That's an incredibly sharp observation – you've nailed a core tension in social ontology that trips up even seasoned philosophers. Searle and Haslanger *are* describing distinct mechanisms, and whether "social construction" is one phenomenon is precisely the right question. Let's break it down:

  1.  **The Core Difference: Agreement vs. Asymmetrical Imposition**
      *   **Searle (Cooperative Constitutive Rules):** His model is fundamentally *consensual* and *functional*. Collective intentionality ("we intend that X counts as Y") creates a *status function* (e.g., this paper is money, that person is President) backed by deontic powers (rights, obligations). This requires widespread *recognition* and acceptance of the rule. The focus is on how *institutional facts* emerge *through* this collective agreement, enabling complex cooperation. Money works *because* (almost) everyone agrees it does and acts accordingly.
      *   **Haslanger (Structural Domination & Causal Loops):** Her model for race/gender is fundamentally about *asymmetrical power*, *hierarchy*, and *imposition*. The "construction" isn't primarily about agreement or conferring useful functions. It's about how perceived bodily features become markers that *place individuals into pre-existing, hierarchical social positions* (man/woman, racialized groups). This placement is driven by:
          *   **Causal Loops:** How others "read" your body based on dominant schemas influences your treatment, which shapes your experiences and opportunities, reinforcing the schema.
          *   **Material & Structural Forces:** Laws, institutions, economic systems, and patterns of violence *enforce* the hierarchy. The subordinated group doesn't collectively agree to their status; it's imposed upon them. The "function" (if we can call it that) is often *subordination itself* or maintaining privilege for the dominant group.

  2.  **Is "Social Construction" One Thing?**
      The answer is likely **no, not in a monolithic sense.** It's more accurate to think of social construction as a **family of mechanisms** by which social reality comes into being and is maintained. Searle describes one prominent member of that family (collective agreement/status-function conferral). Haslanger describes another (asymmetrical imposition within hierarchical structures via perceived bodily features). They often overlap and interact, but they have distinct core logics.

  3.  **Can Searle Stretch to Cover Race/Gender?**
      Searle *tries* (e.g., discussing "Status Functions and Human Rights" later on), but his framework **struggles significantly** with phenomena like systemic oppression:
      *   **The Consent/Recognition Problem:** Searle's model leans heavily on collective recognition. But in cases of oppression, the subordinated group *does not* recognize the legitimacy of the status function imposed on them (e.g., "inferior race"). Searle might argue the *dominant* group's collective intentionality + power is sufficient, but this weakens the "collective" aspect and smuggles in power dynamics his original model downplays. The "recognition" by the oppressed is often coerced *acceptance of force*, not genuine conferral of status.
      *   **The Cooperative Backdrop Assumption:** Searle's model implicitly assumes a relatively level playing field where agreement is possible for mutual benefit (like money facilitating exchange). Oppression is fundamentally *non-cooperative* from the perspective of the oppressed. The "deontic powers" here are overwhelmingly burdensome (obligations without rights) for the subordinated, unlike the (mostly) enabling powers in Searle's standard examples.
      *   **The "Function" Problem:** Assigning a "function" to racial/gender categories within Searle's framework is deeply problematic. What is the *positive, collectively recognized function* of being racially subordinated? Searle struggles to explain status functions that primarily serve to *disable* or *harm* a group, rather than enable collective action. The "function" exists primarily *for* the dominant group's benefit or social ordering *through* hierarchy.
      *   **Materiality & Violence:** Searle focuses on intentional states and rules. Haslanger (and critical theorists) emphasize how construction is *embodied* and *enforced* through material practices, violence, and institutional design – elements Searle's framework struggles to integrate as *constitutive* rather than just background.

  4.  **Unified Theories?**
      Your nagging memory is probably about theorists like **Ásta Sveinsdóttir** or **Sally Haslanger herself** engaging with Searle, or perhaps **Brian Epstein** (The Ant Trap). Ásta's *"conferralist framework"* explicitly tries to bridge this gap. She argues *all* social properties (including Searle's status functions *and* Haslanger's hierarchical positions) are *conferred* by a community, but crucially:
      *   **The community doing the conferring matters:** It might be the powerful group imposing a status on others.
      *   **The basis matters:** It might be collective agreement *or* perceived bodily features.
      *   **The constraints matter:** The context (social structures, power) shapes what can be conferred.
      Epstein critiques Searle's focus on collective intentionality, arguing we need to look at the *grounding* of social facts in the actions and relations of *individuals* within complex networks, which can better capture power asymmetries. Whether these are fully "unified" is debated, but they explicitly grapple with the diversity of construction mechanisms.

  5.  **Which Framework is More Fundamental/General?**
      This is the crux. It depends on your definition of "fundamental":
      *   **Searle for Institutional Mechanics:** If "fundamental" means describing the *core logical structure enabling complex, cooperative social institutions* (law, money, government), Searle's framework is arguably more general and fundamental. It provides a powerful vocabulary (status functions, collective intentionality, deontic powers) applicable to a vast array of human cooperation. Much of social reality *does* rely on this type of constitutive rule-following.
      *   **Haslanger for Power & Hierarchy:** If "fundamental" means describing the *mechanisms that create and sustain pervasive social hierarchies, identity categories, and systemic injustice*, Haslanger's framework (and critical social ontology more broadly) is more fundamental. It exposes how power, perception, and material forces construct realities that Searle's model, taken alone, struggles to explain adequately. For phenomena like race, gender, caste, and class oppression, her lens is indispensable and reveals dynamics Searle obscures.

  **Conclusion:** You're right to see a significant divergence. Searle offers a brilliant model for *consensual, functional institutional construction*. Haslanger provides a crucial model for *asymmetrical, hierarchical construction based on perceived embodiment and power*. Calling both "social construction" is valid, but it's essential to recognize they represent different *species* within that genus. Neither framework alone is universally "more fundamental." Searle explains *how* shared agreements build complex social worlds; Haslanger explains *how* power builds social worlds structured by domination. A truly comprehensive social ontology needs to account for *both* the cooperative logic of constitutive rules *and* the coercive logic of structural hierarchy. Theorists like Ásta and Epstein are pushing in that direction, but the synthesis remains challenging and contested. Your instinct that Searle's cooperative backdrop is ill-suited to oppression is spot-on.
