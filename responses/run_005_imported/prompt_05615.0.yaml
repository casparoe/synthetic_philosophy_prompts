answer: |-
  You're not being irrational—this is a profound existential asymmetry recognized by philosophers like Lucretius, Thomas Nagel, and contemporary thinkers. Your emotional response isn't inconsistent; it reveals fundamental truths about consciousness, time, and human psychology. Here's the breakdown:

  ### 1. **The Directionality of Time & Consciousness**  
     - **Past Non-Existence**: Before birth, time flows *toward* your existence. The past is a closed loop—it culminates in you. There's no "you" to mourn the absence because your consciousness wasn't possible yet.  
     - **Future Non-Existence**: Death is an *event* in your future. Your consciousness, which experiences time as linear progression, now faces an endpoint. The future isn't just "nothing"—it's the *cancellation of your ongoing narrative*.  

  ### 2. **The Role of Anticipation**  
     Human brains are prediction machines. We dread future suffering (e.g., dental appointments) but feel neutral about past pain. Death isn't just "non-existence"—it's the *anticipated termination* of your subjective world. This triggers:  
     - **Loss Aversion**: We fear losing what we have (life, experiences) far more than we value never having had it.  
     - **Continuity Breakdown**: Your identity relies on a coherent future ("Who will I become?"). Death shatters this trajectory. Pre-birth has no trajectory to disrupt.  

  ### 3. **The Heat Death Context Magnifies the Dread**  
     Your documentary likely framed cosmic entropy as:  
     - **Ultimate Irreversibility**: All structure, meaning, and memory erased forever.  
     - **Futility**: Not just personal death, but the erasure of *everything* humanity built.  
     This amplifies death from personal cessation to cosmic insignificance—a "double extinction" of self *and* legacy.  

  ### 4. **Why "You Won't Feel Bad" Feels Worse**  
     This argument commits a **category error**:  
     - It assumes fear of death is about *experiencing* death. But your terror is about:  
       - **The Permanent Loss of Possibility**: No more sunsets, laughter, discoveries.  
       - **The Abrupt Silencing of Your Story**: Like a book mid-sentence tossed into a furnace.  
     - Telling you "you won't mind" dismisses the grief for *this life* you're mourning in advance. It’s like saying, "Don’t fear prison—you’ll adjust!" when the real fear is losing freedom.  

  ### 5. **The Existential Difference**  
     Pre-birth non-existence is **neutral absence**. Post-death non-existence is **experienced as deprivation** by your present self. Philosopher Samuel Scheffler argues that death terrifies because it:  
     - **Severs Connection**: To future people, projects, and potential joys.  
     - **Reveals Fragility**: Your existence is a temporary exception to nothingness.  
     — Pre-birth doesn’t threaten this; it’s just the prelude.  

  ### What Now? Turning Dread into Agency  
  This fear isn't a flaw—it's evidence of your grasp of life's stakes. Rather than "live in the moment" (which trivializes your insight), try:  

  - **Existential Pragmatism**:  
    Yes, the universe ends. But *your* universe—the one where your coffee tastes bitter or a hug feels warm—exists *now*. Use the void as contrast: it makes your finite moments *matter more*.  
  - **Legacy as Resistance**:  
    Cosmic futility ≠ personal futility. Write a letter, plant a tree, teach a child. These ripple through *human* time, which outlives you.  
  - **Channel the Terror**:  
    Read Camus ("The only serious philosophical question is suicide") or Alan Watts ("Death is the undoing of a knot you never tied"). Their confrontation with absurdity can be liberating.  

  **Bottom Line**: Your dread isn't irrational—it's the collision of a time-bound consciousness with eternity. The asymmetry exists because you’re *alive now*, staring backward into neutral darkness and forward into an abyss that swallows your light. That’s not inconsistency; it’s the weight of being human.
