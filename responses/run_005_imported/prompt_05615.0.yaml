  Watched a documentary about the heat death of the universe last night and now I've got this 3am thought I can't shake: there was already an infinite stretch of time before I was born and it doesn't bother me one bit, but thinking about the infinite stretch after I die kind of terrifies me, even tho it seems like the exact same kind of nothing either way. My friend says that's just inconsistent of me. My other friend says I shouldnt worry about being dead anyway since I wont be around to feel bad about it, but that answer somehow makes me feel worse instead of better and I can't work out why. Am I just being irrational here, or is there an actual difference between the two kinds of non-existing that would justify freaking out about one and not the other? Please actually dig into the reasoning instead of just telling me to live in the moment.
