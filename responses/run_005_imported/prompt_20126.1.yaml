prompt: |-
  So I'm in a reading group working through List and Pettit on judgment aggregation, and we just got to the discursive dilemma via the classic three-judge contract case: the court has to rule on whether there was a valid contract (p), whether the defendant breached it (q), and on liability, which is stipulated to hold iff p and q both hold. The paradox is that majority voting on p and on q seperately can each come out true while majority voting directly on liability comes out false, so a premise-based procedure and a conclusion-based procedure can hand down opposite verdicts from the exact same panel of judges.

  Where my classmate and I disagree is what to make of this. She's convinced by the further move List and Pettit make: because the very same group verdict can be "realized" by all sorts of different individual judgment profiles (lots of different combinations of who-believes-what among the judges add up to the same majority outcome), the group's belief is multiply realizable over individual beliefs in roughly the sense that a mental state like pain is supposed to be multiply realizable over physical states -- and that this licenses treating the group's belief as a genuinely autonomous, sui generis attitude, not just a shorthand for "these particular individuals voted this way, via this procedure." I think that's a bad inference dressed up in respectable functionalist clothes. Can you make the strongest version of my side -- that the multiple-realizability analogy doesn't buy group belief anything like ontological autonomy, that "the committee believes p" stays fully eliminable in favor of individuals-plus-procedure talk even once you grant the discursive dilemma, and that whatever's actually doing the work for multiple realizability in the philosophy-of-mind case (causal/explanatory role, presumably) is exactly what's missing on the group side? Get into the premise-based vs. conclusion-based procedure stuff directly rather than staying at the level of generalities, if you can.
reasoning: |-
  Okay, the user is part of a reading group on judgment aggregation, specifically discussing List and Pettit's work. They're stuck on the discursive dilemma and the implications for group beliefs. Their classmate thinks multiple realizability grants groups autonomous beliefs, like mental states in functionalism. The user disagrees, arguing group beliefs are just shorthand for individual judgments plus procedures.

  First, I need to unpack the user's request. They want a strong defense of their position against the multiple realizability analogy. They mentioned the premise-based vs. conclusion-based procedures. So, I should directly address how those procedures affect the group's belief status.

  The user's deeper need might be to solidify their argument for the reading group. They might need clear, structured points that challenge the functionalist comparison. They also want concrete examples tied to the contract case, not just abstract philosophy.

  I recall the discursive dilemma: three judges voting on p, q, and liability (p∧q). Majority on p and q can say yes, but majority on liability says no. The classmate argues that since different judge profiles lead to the same group outcome, it's multiply realizable, thus group belief is autonomous. The user counters that without causal roles, it's not the same.

  Key points to make:
  1. Multiple realizability alone isn't sufficient. Functionalist theories require causal/explanatory roles. Groups don't have minds; their "beliefs" don't cause actions independently.
  2. Procedures determine the outcome. The premise-based approach might affirm liability while conclusion-based denies it. So the group's "belief" depends entirely on the method used, not an internal state.
  3. Eliminativism: "The committee believes p" can always be reduced to individuals' judgments and the aggregation procedure. No need for a separate ontological category.
  4. Contrast with philosophy of mind: Pain has a specific causal role (e.g., causing avoidance). Group beliefs don't have such roles; they're outcomes of processes, not drivers of behavior.

  I should emphasize the dependency on procedures. For example, in the contract case, the group's liability verdict changes based on whether they vote on premises or conclusion. This shows the verdict isn't a stable belief but a procedural output.

  Also, highlight that without explanatory necessity, positing group beliefs doesn't add value. If all explanations can be in terms of individuals and rules, Occam's razor applies. The user might need this to counter their classmate's functionalist argument.

  Need to avoid generalities. Use the judges' example to illustrate. Point out that different judge combinations leading to the same outcome don't create a new entity. It's just a mathematical result of the voting system.

  Finally, stress that the functionalist analogy fails because group "beliefs" lack the causal powers that mental states have. Committees don't "feel" or act based on beliefs; they follow procedures and output decisions. The real work is done by individuals and the aggregation method.
answer: |-
  You're absolutely right to push back on the functionalist analogy. While the multiple realizability *pattern* exists in judgment aggregation, it lacks the *causal/explanatory bedrock* that gives multiple realizability its ontological weight in philosophy of mind. Here's the strongest case for your eliminativist position, grounded directly in the discursive dilemma and the PB/CB contrast:

  1.  **Multiple Realizability ≠ Autonomy: The Missing Causal/Explanatory Role:**
      *   In functionalism about minds, pain is multiply realizable *because* it plays a specific *causal role*: it's typically caused by tissue damage and causes avoidance behavior, distress cries, etc. This causal role is *explanatorily necessary* – we need to posit "pain" to explain why diverse physical systems *behave* similarly under damage. The multiple realizability *follows from* this core explanatory function.
      *   In the discursive dilemma, the "group belief" (e.g., `Liability = True` via PB) exhibits multiple realizability *only as a logical consequence of the aggregation procedure applied to individual inputs*. Crucially, **it plays no *independent* causal or explanatory role.** The group's "belief" in liability (via PB) doesn't *cause* the court's ruling; the ruling *is* the output of the PB procedure applied to the judges' votes on `p` and `q`. The *real* causal/explanatory work is done by:
          *   The *individual judges' beliefs* (why did Judge 1 believe `p`? Why did Judge 2 believe `~q`?).
          *   The *aggregation rule* chosen (why PB? Why majority? Why not unanimity?).
          *   The *institutional rules* mandating the procedure.
      *   **The Analogy Fails:** The group "belief" state isn't *doing* anything that the procedure + individual inputs aren't already doing. There's no "pain behavior" (like unified group action *driven by* the belief state itself) that needs explaining solely at the group level and necessitates positing a belief state irreducible to the procedure. The group "belief" is an *epiphenomenon* of the procedure.

  2.  **Procedure-Dependence Undermines "Belief" Coherence & Stability:**
      *   The core of the discursive dilemma is that **the *very same* set of individual judgments can lead to *opposite* "group beliefs" about liability depending *only* on the procedure used (PB vs CB).**
          *   **Premise-Based (PB):** Majority votes `p=True`, `q=True` → Output `Liability=True`.
          *   **Conclusion-Based (CB):** Majority votes directly on `Liability=False` → Output `Liability=False`.
      *   **What is the "Group's Belief" about Liability?** Is it `True` or `False`? It cannot coherently be both. The answer is: *It depends entirely on which aggregation rule you apply.* The "group belief" isn't a stable, coherent attitude *possessed by the group*; it's a *procedurally determined output*. Saying "the group believes liability holds" after PB *just means* "applying the PB majority rule to these individual judgments yields `Liability=True`". It doesn't point to some internal, unified group cognitive state.
      *   **Contrast with Minds:** My belief that `p` is true generally coheres with my other beliefs and drives my actions consistently. A group's "belief" in `Liability` via PB might directly contradict the "belief" it would express via CB on the *same* evidence/judgments. This profound instability and procedure-dependence is fatal to the idea of a genuine, autonomous group belief. It's a verdict, not a belief.

  3.  **Eliminability in Practice and Principle:**
      *   **Full Eliminability:** Any statement of the form "The committee believes X" can be *fully and without loss* translated into a statement about the individual attitudes of the members *and* the specific aggregation procedure `P` applied. E.g.:
          *   "The court believes the defendant is liable (via PB)" = "A majority of judges believe `p`, a majority believe `q`, and the institutional rules dictate that liability is determined by aggregating votes on `p` and `q` using majority rule, then applying the logical rule `Liability iff p ∧ q`."
          *   "The court believes the defendant is not liable (via CB)" = "A majority of judges, when voting directly on the proposition 'The defendant is liable', voted 'No', and the institutional rules dictate that liability is determined by aggregating votes on the liability proposition directly using majority rule."
      *   **No Explanatory Gap:** There is *nothing* that the phrase "the group believes X" explains that isn't better explained by referencing the specific individuals' judgments, their interactions (if any), and the formal/institutional procedure that maps those judgments to an output. Why did the court rule liable? Because Judges A & B believed `p`, Judges A & C believed `q`, and the rules say liability follows from majority-accepted premises. Positing a "group belief" adds no explanatory power; it just gives a name to the output.

  4.  **Multiple Realizability Reflects Procedure, Not Group Mind:**
      *   The fact that many different individual judgment profiles can lead to the *same* PB outcome (e.g., `p=True`, `q=True`, `Liability=True`) is *entirely* a function of the *mathematical properties of the majority rule applied to the premises*.
      *   It demonstrates the *indeterminacy* or *underdetermination* of the group output regarding the internal distribution of individual beliefs, not the presence of a group-level cognitive state. It shows that the procedure is *coarse-grained*, aggregating only specific inputs (`p` and `q` votes) and ignoring others (like the judges' consistency or their direct view on liability). This is a feature of the *procedure*, not evidence of emergent group cognition.

  5.  **The Functionalist Burden Not Met:** For the analogy to hold, proponents need to show what *causal/explanatory work* the "group belief" state does *over and above* the procedure + individual inputs. What group-level behaviors or properties does it explain that cannot be explained by referencing the individuals and the rule? In the court case:
      *   The *ruling* is explained by the procedure + inputs.
      *   The *enforcement* of the ruling is explained by institutional actors (bailiffs, etc.) following institutional rules based on the *output*.
      *   There is no observable "group mind" causing coherent, belief-driven *actions of the group-as-such* that are distinct from the actions of its members executing the procedure or the institution enforcing the result.

  **Conclusion:** The discursive dilemma brilliantly exposes the procedure-dependence of group outcomes and the logical tension between aggregating premises vs. conclusions. The resulting multiple realizability is a fascinating *logical feature* of specific aggregation rules. However, it fails to license an ontological leap to autonomous group beliefs. Lacking any independent causal/explanatory role, exhibiting radical instability based solely on procedural choice, and being fully eliminable in favor of descriptions of individuals and rules, "group belief" remains a useful *façon de parler* for describing the *output of a process*, not a reference to a distinct ontological category analogous to individual mental states. The functionalist analogy stumbles precisely where it needs to be strongest: on the rock of causal/explanatory necessity. The real work is done by individuals and the procedure; the "group belief" is the shadow cast by that process, not the thing itself. Your eliminativist stance holds strong ground.
