answer: |-
  A classic example illustrating the gap between common knowledge of rationality and unique equilibrium prediction is the **Battle of the Sexes** game. Consider the following payoff matrix for two players, Row and Column:

  ```
            Column
          Opera   Football
  Row Opera  (3, 2)  (0, 0)
      Football (0, 0)  (2, 3)
  ```

  ### Key Features:
  1. **Common Knowledge of Rationality**:  
     Both players know each other is rational (i.e., each maximizes their payoff given beliefs about the other's action), and this is common knowledge. Row knows Column is rational, Column knows Row knows, and so on ad infinitum.

  2. **No Dominated Strategies**:  
     - For Row:  
       - If Column plays Opera, Row gets 3 from Opera > 0 from Football.  
       - If Column plays Football, Row gets 2 from Football > 0 from Opera.  
       Neither strategy dominates the other.  
     - For Column:  
       - If Row plays Opera, Column gets 2 from Opera > 0 from Football.  
       - If Row plays Football, Column gets 3 from Football > 0 from Opera.  
       Neither strategy dominates the other.  
     Thus, **iterated elimination of dominated strategies eliminates no strategies**, leaving both actions for both players.

  3. **Multiple Nash Equilibria**:  
     - **(Opera, Opera)**: Row gets 3 (best response to Opera), Column gets 2 (best response to Opera).  
     - **(Football, Football)**: Row gets 2 (best response to Football), Column gets 3 (best response to Football).  
     Both are pure-strategy Nash equilibria. Rationality alone does not dictate which equilibrium will be played.

  ### Why Common Knowledge of Rationality Fails to Pin Down a Unique Outcome:
  - Each player’s optimal action depends entirely on their belief about the other’s action.  
  - Row prefers Opera only if Column plays Opera, but Football if Column plays Football.  
  - Column prefers Football only if Row plays Football, but Opera if Row plays Opera.  
  - Common knowledge of rationality implies both will coordinate on *some* equilibrium, but it cannot predict *which one* without additional assumptions (e.g., focal points, pre-game communication, or social norms).  

  ### The Gap:
  Epistemic game theory establishes that common knowledge of rationality implies players will play *some* rationalizable strategy profile (here, both equilibria are rationalizable). However, it **fails to select a unique action profile** because:  
  - Iterated elimination of dominated strategies makes no progress.  
  - The solution concept of rationalizability permits both equilibria.  
  - Without refinement (e.g., equilibrium selection criteria), rationality alone cannot resolve coordination between multiple Pareto-ranked equilibria (Opera/Opera is better for Row, Football/Football for Column).

  This demonstrates that "rationality is common knowledge" is insufficient to guarantee a unique outcome in games with multiple equilibria, highlighting a limitation of standard epistemic solution concepts.
