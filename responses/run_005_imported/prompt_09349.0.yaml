  So my roommate and his college buddy started a shared sports betting bankroll back in October, and I chipped in $200 myself, which is probably why I can't stop thinking about the fight they had this week over bet sizing.

  Marcus (on an "ergodicity economics" kick lately) wants every bet sized with the Kelly formula, edge over odds, no exceptions: bet more than that and you're not getting extra long-run growth, just extra ruin risk for nothing; bet less and you're leaving growth on the table.

  Devon (finance background) said that's overkill for a pool that'll place maybe 40 bets all season - the "long run" Marcus keeps invoking never actually arrives for us, so we should just take whichever side has the higher expected value each time and stop worrying about variance that won't have time to average out anyway.

  Marcus shot back that Devon has it backwards: "it averages out" only works if you picture a thousand parallel pools betting alongside us and average across them. A single bankroll compounding bet after bet is the opposite case - a couple of bad multiplicative hits in a row can end the pool before any long run shows up, which makes the small number of bets a reason for more caution, not less.

  Devon's comeback: fine, granted, it's multiplicative - but that only shows Kelly is expected-utility maximization for one particular, fairly risk-averse utility function (log), dressed up as if logic forces it on everyone. Nothing says our pool has to share that risk preference; if we're more risk-tolerant than a log bettor, sizing bets bigger than Kelly could be the rational choice for us specifically.

  Now they won't even agree on what their disagreeing about, and both keep asking me to settle it, which I have zero qualifications for. Could you go through their exchange move by move, say who's actually got the better argument at each step (not just who wins overall), and flag anything you think both of them are missing?
