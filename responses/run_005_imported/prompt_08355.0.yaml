  First, I need to recall Sidgwick's key ideas. His dualism of practical reason is central: the conflict between egoism (self-interest) and utilitarianism (impartial duty). He thought reason couldn't resolve this conflict, which troubled him deeply. Then there's his psychical research—he was a founder of the SPR and investigated phenomena like mediums, but he was skeptical, debunking frauds. The essay should contrast the two interpretations: one that sees his research as a sincere quest for empirical evidence to resolve the dualism, and the other as a subconscious rationalization masking his desire for cosmic justice.

  For the first interpretation, Sidgwick's own writings support it. In "Methods of Ethics," he explicitly states that proving the soul's survival could reconcile egoism and duty by making self-interest align with morality in an afterlife. His rigorous methods in SPR, like exposing the Creery sisters, show he wasn't gullible; he demanded evidence. His personal letters reveal his hope that psychical research could provide a rational basis for faith, which philosophy alone couldn't. This suggests the research was integral to his philosophical project, not a hobby.

  The second interpretation, from critics like Schneewind or Schultz, argues that Sidgwick's empiricism in philosophy clashed with his psychical pursuits. They point to his private confessions of doubt and the lack of empirical success. For instance, even after years, he admitted no solid evidence was found. This view sees it as a psychological need—a longing for cosmic justice—disguised as science. But does this fit? Sidgwick was aware of his biases; he called himself a "wistful agnostic" and knew the research might fail. His empiricism was consistent because he applied skepticism equally, abandoning claims when debunked.

  To weigh these: Sidgwick's consistency in applying empirical rigor to psychical research supports the first view. He didn't compartmentalize; he used the same methods everywhere. His ethical work's unresolved dualism drove his search, making it a philosophical necessity, not an embarrassment. The second view underestimates how his empiricism governed the research—he was willing to accept failure, which aligns with his philosophical integrity.

  On whether it was time well spent by his own lights: Sidgwick admitted it didn't provide the evidence he sought, but he valued the process. He thought it was a duty to investigate these questions scientifically, to prevent superstition or dismissiveness. So, even without success, it was a rational, if ultimately unfruitful, effort. That justifies the time spent as consistent with his principles.

  For the novel, this means Sidgwick shouldn't be a caricature. His psychical research was a deep, philosophical endeavor tied to his ethics. Portraying it as such adds depth, showing his internal conflict and dedication to reason. The user can highlight his rigor and the poignant mix of hope and skepticism, making the character more authentic and tragic.
