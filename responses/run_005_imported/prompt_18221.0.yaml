answer: |-
  ## Toast: The Scaffolding of Us

  **(Raises glass, smiles warmly at the couple, then glances playfully at the sister)**  

  Alright, everyone. For those who don’t know me, I’m the bride’s brother. And for those who *do* know my sister… well, you know asking me to give this toast wasn’t just a loving gesture. It was practically peer review. She said, and I quote: “You make complicated things clear for a living. So, make *this* clear. Get the philosophy right. No magic words.” *(Laughter, especially from the philosophy side. Wink at sister.)* Challenge accepted.

  Now, my brilliant sister has spent years thinking deeply about promises – about why they matter, why breaking them hurts. And she’s adamant: It’s *not* because vows are like some ancient spell, binding you together with mystical glue. Sorry, rom-coms. *(Gentle chuckle)*

  Her work points to something… different. Something more profound, and honestly, more *real*. It’s about what happens *after* the words. It’s about **expectation**.

  Think about it. When you make a promise, especially a big one like today, you’re doing something incredible. You’re deliberately saying: “*You can count on me. I’m telling you to rely on this.*” You’re inviting the other person to build their hopes, their plans, their sense of security… on the foundation of your word. You’re handing them a piece of your future and saying, “Trust me with this.”

  *(Turns fully to the couple, voice softens but remains clear)*  

  That’s what today is, [Partner's Name] and [Sister's Name]. It’s not magic. It’s a conscious, deliberate choice. It’s you both standing up and saying, loudly and clearly, to each other and to all of us: “**Build on me. I am building on you.** Count on this. Rely on this love, this partnership, this commitment we’re forging *together*.”

  The power isn’t in defying some cosmic rulebook. The power – and the profound responsibility – lies in the **trust you are actively creating**. It’s the scaffolding you’re both erecting, plank by plank, promise by promise, big and small. It’s saying, “I see you. I know you’re counting on me. And I *choose* to be someone worthy of that count.”

  *(Pauses, scans the room, smiles)*  

  Now, I know about half of you are probably nodding along thinking, “Ah, yes, Scanlon’s Principle F, the intentional creation of assurance…” *(Nods knowingly towards the philosophy section, gets a ripple of laughter)* …and the other half are thinking, “Airport! Just tell us about how he always picks her up from the airport!” *(Laughter from family side)*  

  But here’s the beautiful thing: You’re *both* right. Because whether you frame it in dense philosophical terms or in the simple, everyday language of showing up – picking someone up from the airport, making the coffee just how they like it, being there when things are tough – the core is identical. It’s about **building something reliable together, brick by brick, expectation by fulfilled expectation.**

  [Sister's Name] and [Partner's Name], you haven’t waited for today to start building that scaffold. We’ve all seen it rise over these past [mention timeframe, e.g., few years]. We’ve seen the trust, the mutual reliance, the quiet ways you’ve already told each other, “Count on me.” Today, you’re just putting in the biggest, strongest beam yet. You’re declaring your intention to keep building, to keep being that solid ground for each other.

  So, let’s raise our glasses. Not to magic spells, but to magnificent, deliberate **trust**. To the incredible vulnerability of saying, “Count on me,” and the even greater strength of proving, day after day, that the count was well placed. To the scaffolding you’ve built, the home you’re making within it, and to a lifetime of continuing to build it, together.

  To [Sister's Name] and [Partner's Name]!

  **(Everyone: "To [Sister's Name] and [Partner's Name]!")**

  ---

  **Why this works for both audiences:**

  1.  **Philosophy Nailed (For the Dept.):**
      *   Explicitly rejects the "magic words"/ritual power view.
      *   Clearly articulates Scanlon's core idea: Promises create expectations the promisor *intentionally invites* the promisee to rely upon. Breaking a promise exploits that invited reliance ("Build on me" / "intentional creation of assurance").
      *   Uses accurate terminology ("expectation," "rely," "intentional creation of assurance," nods to "Principle F").
      *   Avoids sentimentalizing the *wrong* theory.

  2.  **Warmth & Relatability (For Family):**
      *   Grounds the philosophy in universal, tangible experiences: "Count on me," "showing up," "picking up from the airport," "building brick by brick."
      *   Uses accessible metaphors: "Scaffolding," "building a home," "solid ground."
      *   Humor: Teasing the sister ("peer review"), acknowledging the room's split ("Airport!" vs. "Scanlon"), relatable rom-com reference.
      *   Focuses on the couple's observable actions and love ("we've all seen it rise").
      *   Heartfelt conclusion celebrating partnership, trust, and building a future.

  3.  **Structure & Length:**
      *   Starts with a personal/humorous hook.
      *   Clearly states the "no magic" rule and introduces the core concept.
      *   Explains the concept accessibly using the couple as the example.
      *   Explicitly bridges the gap for both audiences with the "airport/Scanlon" line.
      *   Connects the philosophy to their existing relationship.
      *   Ends with a warm, focused toast on trust and partnership.
      *   Flows naturally and reads aloud in roughly 3 minutes.
