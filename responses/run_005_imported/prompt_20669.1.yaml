  For the "watered-down version" question, I'm imagining concrete examples: Nebraska's nonpartisan legislature, citizen assemblies in Ireland. This shows Weil isn't just theoretical. The user seems to crave this practicality - they called her original idea "too radical" themselves. Smart framing.

