  Ok kind of a random thing to ask an AI but it's genuinely relevant to my week - I've got a biopsy result coming back friday and caught myself thinking 'it's already either true or false whether I'm sick, so worrying does literally nothing,' and my sister (doing a phil PhD) told me I'd basically reinvented fatalism, same family as Aristotle's sea battle puzzle. She said philosophers usually block that argument by pointing out that a fact like 'it was already true last week that I'd get sick' is only 'accidentally necessary' - fixed the way the past in general is fixed - not necessary in the strong logical sense, and that gap is apparently enough to stop the fatalism going through. Honestly it didnt fully click for me. Can you invent a fresh example (not the sea-battle-tomorrow one, already read that version) that shows the difference between something being merely accidentally necessary vs genuinely necessary, and why that difference is supposed to block the slide into fatalism?
