prompt: |-
  I've been reporting out a longer piece on laws of nature for the magazine's ideas section, and I sat in on a philosophy of science conference panel last month where one of the speakers breezily called herself "a happy Humean" about laws, which threw me a bit given what I thought that label actually commits you to. From what I've read (mostly Lewis on "Humean supervenience" and the "best system" account of lawhood), Humeans about laws are basically taking Hume's classic line on causation all the way through: there's no necessary connection out there in nature, just one particular fact after another, so a "law" ends up being nothing more than a label for a pattern that happens to hold, with nothing underneath forcing it or explaining why that pattern holds rather than some other one. If thats the right reading, doesnt it follow that Humeans are stuck admitting physics doesn't actually explain anything -- its just very elaborate bookkeeping of coincidences -- and that they have no non-circular answer to Hume's problem of induction, i.e. no real reason the pattern should keep holding tomorrow?

  Given that, I'm confused why so many serious, non-crank philosophers of science actually sign up to be Humeans about laws instead of treating that as a reductio and jumping over to the necessitarians -- Armstrong, Dretske, Tooley -- who think laws are real relations of necessitation between universals and so seem to dodge the whole mess. Is there some move available to Lewis-style Humeans that gets them out of that skeptical hole, or is "physics doesn't really explain anything and induction is ungrounded" just the bullet they've knowingly chosen to bite? Trying to get this right rather than strawman one side of the debate for the piece.
reasoning: |-
  Okay, the user is a journalist working on a piece about laws of nature. They attended a philosophy conference where a speaker called herself a "happy Humean," which confused them. They're trying to understand why philosophers would adopt Humeanism given its apparent issues with explanation and induction. Let me unpack their main concerns.

  First, they mention Lewis's Humean Supervenience and the Best System Account (BSA). They think Humeans reduce laws to mere patterns without necessity, leading to physics just being "bookkeeping of coincidences." Then there's the problem of induction: if laws aren't necessary, why expect patterns to continue? They contrast this with necessitarians like Armstrong, who posit real necessitation relations.

  The user's core confusion is why anyone would choose Humeanism despite these problems. They want to avoid misrepresenting the position in their article. So, I need to explain the motivations for Humeanism and how its proponents address these criticisms.

  Let me recall the Humean arguments. Metaphysical parsimony is big—Humeans avoid adding necessary connections, which some see as mysterious. The BSA ties laws to our best theories, making them objective yet grounded in actual events. Also, necessitarians struggle to explain what necessitation is without circularity. 

  On explanation: Humeans argue that laws explain by systematizing patterns, not invoking hidden necessities. For induction, they lean on pragmatism and the success of science. But the user might still wonder if this is sufficient. Are there deeper responses? Maybe discuss how BSA's objectivity differs from subjectivism, and how induction's justification is practical rather than metaphysical.

  Also, the user might not be aware of all counterarguments against necessitarianism. Highlighting issues like inference to the best explanation not favoring necessitation could help. Emphasize that Humeans see their view as scientifically respectful, avoiding extra metaphysical baggage.

  Need to ensure clarity without jargon. The user needs to present both sides fairly, so balancing the strengths of Humeanism against its challenges is key. Maybe conclude that philosophers choose Humeanism as the lesser of two evils, valuing parsimony and alignment with science over what they see as unsolved problems in rival theories.
answer: |-
  You've grasped the core tension brilliantly—Humeanism *does* entail that physics is "elaborate bookkeeping" and offers no *metaphysical* guarantee for induction. But philosophers embrace it for compelling reasons, viewing the alternatives as worse. Here's why "happy Humeans" exist, and how they navigate the challenges:

  ### 1. **The Allure of Humeanism: Parsimony & Empiricism**
      *   **No Mysterious "Must":** Humeans reject Armstrong/Dretske/Tooley's "necessitation relations" as metaphysically extravagant and epistemologically inaccessible. What *is* this "necessitation"? How do we observe it? It seems like a placeholder for the very mystery it purports to solve.
      *   **Respect for the Mosaic:** They start with what we *do* observe: the vast, complex arrangement of particular facts (the "Humean Mosaic"). Laws must supervene on this mosaic—they cannot be *added* as occult forces *above* it. This feels scientifically respectful.
      *   **Lewis's Best System Account (BSA):** This provides an *objective* (though pragmatic) grounding for laws within the mosaic. Laws aren't *just* patterns; they are the *axioms* of the system that best balances **strength** (describing as much of the mosaic as possible) and **simplicity**. This offers a robust, non-subjective criterion.

  ### 2. **Addressing "Physics Doesn't Explain"**
      *   **Explanation as Systematization:** Humeans argue explanation *is* successful systematization. Finding the BSA *is* explaining the world. Telling you Newton's laws *allows you to derive* planetary orbits *is* explaining the orbits. The "why" *is* "because it fits into this incredibly powerful, simple, overarching summary of the universe's history." Demanding a deeper "must" is asking for metaphysics, not science.
      *   **Contrast with Necessitarianism:** Humeans flip the script: What *exactly* does adding "N(F, G)" (necessitation between universals F and G) *explain*? How does citing this relation *improve* on saying "All Fs are Gs, and this is a fundamental law"? It often seems explanatorily idle or circular ("Why are all Fs G? Because N(F,G). What is N(F,G)? It's what makes all Fs G.").
      *   **The Pragmatic Virtue:** The BSA yields predictions and unifies phenomena. That *is* scientific explanation working. Humeans argue this is sufficient and matches scientific practice better than invoking hidden necessitation.

  ### 3. **Addressing the Problem of Induction**
      *   **The Brutal Honesty:** Humeans readily admit there is no *metaphysical* guarantee induction will work. Hume was right about that. Any attempt to ground induction metaphysically (e.g., in necessitation) risks circularity.
      *   **Pragmatic & Epistemic Justification:** Their response isn't metaphysical, but pragmatic/epistemic:
          *   **The BSA Itself:** The *best* system we have *right now*, based on *all observed data*, includes laws that project past regularities into the future. To abandon induction *now* would be to abandon the system that best summarizes *everything we know*. It would be irrational *given our current epistemic state*.
          *   **Success Argument:** Induction has worked spectacularly well so far. While this is inductive, it's a compelling practical reason to continue. We have no better alternative method for navigating the world.
          *   **No Rival Does Better:** They argue necessitarians *also* cannot give a non-circular, non-question-begging *metaphysical* guarantee for induction. If "necessitation" is real, why should *it* persist? Proving *that* would require... induction. The problem is fundamental, not unique to Humeanism.

  ### Why Choose Humeanism Over Necessitarianism?
  1.  **The Inference Problem:** How do we *know* a necessitation relation N(F,G) holds? We infer it *from* the observed regularity of Fs being Gs. But then, what work is N(F,G) *doing* beyond describing the regularity? It risks being an inference to the best explanation that doesn't actually explain more than the regularity itself (the BSA summary).
  2.  **The Identification Problem:** How do we distinguish *true* laws (backed by N) from mere accidental regularities? Necessitarians need extra criteria (like involving universals, being non-local, etc.), which can be messy. The BSA elegantly distinguishes laws (axioms of the best system) from accidents (derived or non-systematized regularities).
  3.  **Metaphysical Parsimony:** Occam's Razor. If you can build an account of laws and science without adding mysterious necessitation relations, that's a major advantage. Humeanism feels like the "default" position, placing the burden of proof on those who want to add extra metaphysics.
  4.  **Alignment with Science (as practiced):** Many Humeans argue science *doesn't* posit "metaphysical glue" or "causal oomph." It posits mathematical structures and patterns that describe and predict. Humeanism captures this.

  ### The "Happy Humean" Stance
  The "happiness" often comes from:
  *   **Accepting Hume's Insight:** Recognizing the limits of metaphysical justification for induction and necessity is seen as intellectually honest.
  *   **Finding Objectivity in the BSA:** Laws aren't subjective; they are objectively determined by the mosaic and the criteria of strength & simplicity.
  *   **Pragmatic Confidence:** Trusting the immense success of science and the rational imperative to use the best system we have, even without metaphysical underpinnings.
  *   **Avoiding Worse Problems:** Seeing necessitarianism as trading the problems of induction and explanation for equally bad or worse problems of mysterious metaphysics, inference, and identification.

  **In short for your piece:** Humeans bite the bullet on metaphysical necessity and induction's ultimate justification, but they do so knowingly. They argue the bullet isn't fatal: science *does* explain (via systematization), and induction *is* rationally justified (pragmatically and epistemically, given our state of knowledge). They embrace Humeanism because it avoids the perceived greater evils of mysterious, inaccessible, and potentially explanatorily vacuous metaphysical necessities. They see it as the most parsimonious, scientifically respectful, and ultimately defensible account of laws, even with its acknowledged limitations. The debate hinges on whether one finds the Humean's parsimony and empiricism more compelling than the necessitarian's desire for a deeper "must."
