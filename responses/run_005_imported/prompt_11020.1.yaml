  The key question is whether P.F. Strawson's naturalism insulates reactive attitudes from Galen's critique. If our practices don't require metaphysical grounding, maybe Galen's argument is irrelevant. But if reactive attitudes inherently presuppose self-authorship, Galen shows that presupposition is flawed, making the attitudes unjustified even within practices.

