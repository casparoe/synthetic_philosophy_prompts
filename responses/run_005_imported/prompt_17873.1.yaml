prompt: |-
  Ok, this has been bugging me and it feels like something that's already been hashed out on some ACX or LW thread, but I can't find it, so I'll just ask directly. I keep a big Anki deck of 'facts I'm confident are true' - about 3000 cards at this point, each one I looked into enough to give ~99% credence, and spot-checks suggest I really am that well-calibrated. A friend did the math and pointed out that at 99% accuracy over 3000 independent cards, plain arithmetic says dozens of them have to be false. Sure, fine. But then it hit me: for each individual card I do believe its true, thats the whole reason it's in the deck - I'm sure card #1 is true, sure card #2 is true, and so on, while ALSO being sure a bunch of cards in that same pile are false. My friend says those are just two different questions and there's no real contradiction, but it feels like my beliefs just don't add up. Is he missing something, or am I?
