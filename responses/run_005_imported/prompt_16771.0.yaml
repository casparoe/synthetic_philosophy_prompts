answer: |-
  ## Colloquium Q&A: Parity vs. Vagueness in Hard Choices

  *(Following a talk on hard choices, Dr. Reed Chang (R.C.), a parity proponent, takes a question from Dr. Jamie Broome (J.B.), a vagueness advocate.)*

  **J.B.:** Thanks for the stimulating talk, Reed. I agree entirely that choices like Clarinetist vs. Lawyer defy the standard trichotomy. Where I diverge is your leap to a *sui generis* relation, "parity." Isn't this simply the hallmark of vagueness? We have a spectrum of possible clarinetist careers – slightly more fulfilling, slightly better pay, slightly more travel. "Better than lawyer" isn't a sharp line. Adding a *small improvement* to one option (say, clarinetist with a marginally better reed) doesn't suddenly make it determinately better than lawyer; it just shifts the vague boundary slightly. Why posit a new ontological category when imprecise boundaries explain the phenomenon perfectly?

  **R.C.:** Thanks, Jamie. I appreciate the economy of your view. But the small-improvement argument *presses* precisely where vagueness stumbles. Imagine we take the original pair: Clarinetist (C) and Lawyer (L). Neither is better, worse, or equal, we agree. Now, we create C+, a *slightly improved* clarinetist career – perhaps marginally more artistic freedom. Crucially, on your vagueness view, C+ is *still* not determinately better than L, right? It's still in the vague zone relative to L.

  **J.B.:** Correct. Small improvements shift positions within the penumbra but don't necessarily catapult an option into being determinately better.

  **R.C.:** Exactly. Now, here’s the rub. Compare C+ to the *original* C. Surely, C+ is determinately better than C? A small, positive improvement with no downsides? We wouldn't say C+ is merely *vaguely* better than C, or *on a par* with C. It seems straightforwardly *better*.

  **J.B.:** Agreed. C+ is better than C. That’s clear-cut.

  **R.C.:** So, we have: C+ > C. And we have: C is not better than L, not worse than L, and not equal to L. And crucially, we also have: C+ is *not* better than L. Now, if "better than" were merely vague, shouldn't we expect *some* asymmetry here? Shouldn't there be *some* pressure, however slight, towards C+ being *more likely* to be better than L than C was? But the phenomenology of the hard choice suggests symmetry: improving C doesn't make it *any* more likely to be better than L; it just creates a *different* hard choice between C+ and L. The resistance to "better than" seems just as absolute for C+ vs. L as it was for C vs. L. Vagueness predicts a gradual shift towards determinacy; the case exhibits a *persistent* failure of comparability even after improvement. Parity captures this persistence directly: C and L are on a par; C+ and C are not (C+ is better); but C+ and L are *also* on a par. The relation between the options changes only when we compare C+ to C, not when we compare either to L. That symmetry is hard for vagueness to explain without smuggling in something like parity.

  **J.B.:** I see the push. But I think you’re underestimating the structure vagueness *can* provide. Think of a classic sorites series. Adding one grain doesn’t turn a non-heap into a heap, but it *does* bring it closer to the clear heap cases. Similarly, while C+ isn’t determinately better than L, it *is* closer to the range of clarinetist careers that *would* be determinately better than this particular L. The ‘pressure’ you seek exists: C+ occupies a position in the vague boundary where ‘better than L’ is *more true* than it was for C, even if it’s still not determinately true. The persistent failure of *determinate* ‘better than’ is exactly what vagueness entails for borderline cases. The chooser senses the improvement makes C+ marginally *more attractive* relative to L than C was, but not decisively so, preserving the hard choice feel. Positing parity seems redundant; it just labels the vague zone.

  **R.C.:** But Jamie, does that marginal increase in attractiveness translate to a marginal increase in the *reason to choose* C+ over L? If C+ is only marginally "more true" to be better than L, does that give the agent a *pro tanto* reason to prefer C+ over L that they didn’t have for C over L? If so, then the choice between C+ and L *is* rationally distinct from the choice between C and L – there’s a slight tilt. But in the paradigmatic hard choice, there’s *no* tilt. The agent feels the improvement creates a *new* incomparable option, not a marginally superior one. The reasons generated by the values constitutive of being a clarinetist and being a lawyer seem to stand in a relation – parity – that is *invariant* under small improvements to one side. The improvement changes the comparison *within* the clarinetist domain (C+ > C), but not the *relation between the domains* relative to L. Vagueness struggles to explain this domain-relation invariance; it naturally suggests a creeping comparability. Parity explains it by being a distinct, stable relation between options grounded in different kinds of value.

  **J.B.:** I maintain the ‘creeping comparability’ is real but subtle, masked by the overwhelming vagueness. The invariance you perceive might be an artifact of the *description* of the options as belonging to distinct "domains" or "kinds," a description that itself might be vague! Is ‘clarinetist career’ a sharply defined kind? Perhaps the sense of domain-relation invariance reflects the *depth* of the vagueness involved when comparing radically different value structures, not a new relation. Adding ontological categories should be our last resort. My model uses only the familiar, demonstrably existing phenomenon of vagueness applied to a complex predicate ("better than career L"). Until shown it *must* fail, it remains the more parsimonious explanation.

  **R.C.:** And I contend that the phenomenology of symmetrical stalemate, persisting perfectly intact through small improvements that *do* create determinate betterness elsewhere, signals a genuine structural feature of value comparison – parity – that vagueness, focused on borderline cases of a *single* relation, inevitably distorts. Parsimony shouldn't override capturing the distinctive rationality of the choice. We seem to have reached the bedrock of our disagreement.

  **Moderator:** Thank you both! A truly illuminating exchange. Let's move to the next question... *(The unresolved tension hangs in the air.)*
