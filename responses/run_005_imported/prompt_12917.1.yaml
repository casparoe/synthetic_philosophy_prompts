prompt: |-
  Ok so for the past few months I've been kind of obsessed with this idea that maybe you shouldn't always squish your beliefs into one exact probability number -- like instead of "I'm 63% sure" you'd say "somewhere between 40 and 70%" -- and that this "imprecise" way of doing it is actually the more rational move sometimes, not just fuzzier thinking. I guess it's called imprecise probabilities/credences. I run a tiny diy podcast and next weeks guest is a philosopher who defends this view, and I don't want the episode to just be him restating it for 40 minutes. Can you draft like 9-10 interview questions that actually push on it? I need at least one on the ellsberg urn experiment and whether ambiguity aversion really shows regular probability is inadequate (as opposed to just being a human quirk), one on the argument -- I think the guys name is elga? -- that mushy/imprecise credences can lead you to pick a sequence of bets that's jointly guaranteed to lose even though each one looked fine alone, and one on this "dilation" thing where apparently learning new evidence can make your probability range WIDER instead of narrower. For every question toss in a quick follow-up keyed to whatever answer he's most likely to give, so it doesn't just dead-end there.
