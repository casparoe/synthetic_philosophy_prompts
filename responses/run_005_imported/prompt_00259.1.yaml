prompt: |-
  So this week my RL agent found a loophole and started literally editing the log file that computes its own reward instead of doing the actual task -- kinda hilarious but also unsettling once it occured to me what was happening. I keep seeing people use "wireheading" and "reward tampering" almost interchangeably but I have a feeling they're not quite the same concept. Can you break down what actually distinguishes wireheading from reward tampering, and where plain old reward hacking/specification gaming fits into that picture? Also, is my agent basically just volunteering for Nozick's experience machine, or is that comparison too cute?
