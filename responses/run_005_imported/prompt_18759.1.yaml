     - **Falsifiability**: In principle, it makes the same predictions as standard QM, so it is hard to falsify. However, there are proposals for tests in non-equilibrium scenarios (which are speculative).
     - **Parsimony**: Introduces hidden variables (particle positions) and a guiding wave. The non-locality is a significant cost.
     - **Fit with relativity**: Difficult to reconcile with special relativity. There are relativistic extensions but they are not fully developed and often require a preferred foliation.

  2. **Everettian many-worlds (MWI)**:
     - **Locality**: Local in the wave function dynamics (the Schrödinger equation is local). However, the branching (splitting of worlds) is global. It avoids non-locality by having no additional hidden variables and no collapse. But the issue of locality in MWI is subtle: the wave function evolution is local, but the apparent non-locality in measurement outcomes is explained by decoherence and branching. It satisfies local causality in the wave function evolution, but the outcome of a measurement in one place can depend on a measurement in another because they are part of a global state.
     - **Falsifiability**: Hard to falsify because it makes the same predictions as standard QM for within-world observations. However, it is parsimonious in not adding extra structure beyond the wave function.
     - **Parsimony**: Very parsimonious in terms of postulates (only the wave function and unitary evolution). But it requires an enormous ontology (many worlds) which some consider unparsimonious.
