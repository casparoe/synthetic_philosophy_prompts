     - **Fit with relativity**: In principle, it can be made relativistic because it is deterministic and local. However, the fine-tuning of initial conditions is a major issue.

  5. **Retrocausal (time-symmetric) quantum mechanics**:
     - **Locality**: Retrocausal models often maintain locality by allowing future measurement choices to influence past states (or vice versa). They can be local if the causal influences go backward in time and then forward, so that no faster-than-light signaling occurs. However, they violate the usual notion of causality (time symmetry).
