     - **Parsimony**: They require a redefinition of causality and may introduce additional variables or dynamics that are time-symmetric. This can be seen as adding complexity.
     - **Fit with relativity**: Retrocausality might be compatible with relativity if we allow for global time symmetry, but it challenges the usual space-time structure.

  6. **QBism**:
     - **Locality**: QBism (Quantum Bayesianism) is a subjective interpretation. It views quantum states as representations of an agent's beliefs. It does not require a physical mechanism for non-locality because the correlations are understood as constraints on the agent's beliefs. Thus, it avoids non-locality by reinterpreting the nature of the quantum state. However, it does not provide a local causal mechanism for the correlations.
     - **Falsifiability**: It is not clear how to falsify it because it is an interpretation that agrees with standard QM predictions. It is more of a philosophical stance.
     - **Parsimony**: It is parsimonious in not adding any physical entities, but it shifts the focus to the agent's beliefs, which might be seen as moving away from objective reality.
     - **Fit with relativity**: Since it does not add any physical structure, it doesn't conflict with relativity. But it doesn't provide a space-time account of quantum events.

  7. **Orthodox Copenhagen instrumentalism**:
     - **Locality**: The Copenhagen interpretation typically involves wave function collapse which is non-local. It does not satisfy local causality. The measurement process is not described by local interactions.
     - **Falsifiability**: It is the standard interpretation and is as falsifiable as standard QM. However, the collapse postulate is vague and not well-defined.
     - **Parsimony**: It has the wave function and collapse, but the collapse is an additional process. The measurement problem is not resolved, so it is less parsimonious than MWI in that sense.
     - **Fit with relativity**: The non-local collapse conflicts with relativity. It does not provide a relativistic account of measurement.

