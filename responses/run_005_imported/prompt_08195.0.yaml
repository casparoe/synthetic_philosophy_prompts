  Considering Ramsey's views, his rejection of truth-aptness for general propositions suggests he might lean towards the non-truth-valuable route. He saw conditionals as tools for reasoning, not facts to be true or false. His footnote's focus on belief revision under hypotheticals aligns more with a dynamic process than static propositions.

