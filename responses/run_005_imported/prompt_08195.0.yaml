  Ramsey's essay also discusses general propositions. He sees them as inference rules or habits of inference rather than truth-apt statements. For example, "All men are mortal" isn't a fact but a rule allowing us to infer from "Socrates is a man" to "Socrates is mortal." This is crucial because it shows his pragmatism and focus on use over truth value.

