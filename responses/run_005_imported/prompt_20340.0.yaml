  - **Closer:** The "concrete case" demand is smart. Choosing a low-stakes scenario with conflicting cues (hurried expert vs. calm novice) lets both apply their standards differently.  

  Key nuance: Ari should grant that *verification* matters (anti-reductionism isn't gullibility!), while Ren must admit some background trust is unavoidable. That mirrors software – you trust npm docs until a specific function feels off.  

  Names: Ari (anti-reductionist) and Ren (reductionist) – short, gender-neutral, hints "A priori" vs. "Reduction." Coffee shop setting feels natural for philosophers debating mundane cases.  

