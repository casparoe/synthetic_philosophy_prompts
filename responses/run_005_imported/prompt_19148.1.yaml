answer: |-
  ## MEMORANDUM  
  To: Whitmore Fellowship Selection Committee  
  From: [Your Name], Committee Member  
  Date: October 26, 2023  
  Subject: Analysis of Acceptance Rates & Recommendations for Fellowship Report & Process  

  **I. Background & Acknowledged Facts:**  
  Following external observations regarding disparate acceptance rates for MFA vs. non-MFA applicants (18% vs. 8% overall), our internal review confirms a statistically valid instance of **Simpson's Paradox**:  

  1.  **Overall Rates (Aggregated):**  
      *   MFA Applicants: ~18% Acceptance  
      *   Non-MFA Applicants: ~8% Acceptance  
  2.  **Genre-Specific Rates (Disaggregated):**  
      *   **Fiction:** Non-MFA: 6% Acceptance | MFA: 5% Acceptance  
      *   **Poetry:** Non-MFA: 25% Acceptance | MFA: 20% Acceptance  
  3.  **Application Pool Composition:**  
      *   **Fiction:** Dominated by non-MFA applicants (vast majority), highly competitive (low overall acceptance rate).  
      *   **Poetry:** Dominated by MFA applicants (vast majority), less competitive (higher overall acceptance rate).  

  The paradox arises because fiction, with its low acceptance rate and high proportion of non-MFA applicants, disproportionately weighs down the *overall* non-MFA rate. Conversely, poetry, with its higher acceptance rate and high proportion of MFA applicants, boosts the *overall* MFA rate. Our biostatistician colleague is correct: mathematically, the committee shows no bias *against* non-MFA applicants *within either genre* based solely on acceptance rates; in fact, non-MFA rates are slightly higher in both tracks.  

  **II. Addressing the Valid Concerns ("The Second Camp"):**  

  While the statistical paradox resolves the *mathematical* disparity, the concerns raised deserve serious consideration beyond the numbers. They point to potential **structural and equity issues** that the raw acceptance rates might obscure:  

  1.  **The Poetry Pipeline & Training Access:**  
      *   **The Core Concern:** The observation that non-MFA writers may cluster in fiction partly because competitive poetry manuscripts often require workshop training disproportionately provided by MFAs is crucial. This suggests a potential **barrier to entry** in the poetry track *before applications even reach us*.  
      *   **Implication:** The higher *acceptance* rate for non-MFA poets (25%) might reflect only a small, self-selecting, and potentially exceptionally prepared group who overcome barriers without an MFA. The *application* rate disparity (mostly MFA poets applying) could indicate systemic obstacles (access to training, mentorship networks, awareness, confidence) deterring potentially talented non-MFA poets from applying at all. Our process, while blind, may only be equitable *among those who feel equipped to apply*.  

  2.  **Interpreting "Competitiveness":**  
      *   **The Question:** Does the current selection process, trained on years of reading, unconsciously favor certain markers of "polish" or convention more commonly associated with MFA workshop outputs? While our blind reading prevents *direct* credential bias, the *indirect* influence of workshop norms shaping manuscript aesthetics remains a valid question.  

  3.  **The Perception of Fairness:**  
      *   **The Reality:** The stark overall disparity (18% vs 8%) understandably damages trust and fuels perceptions of unfairness, regardless of the mathematical explanation. Dismissing it solely as a "technicality" risks appearing tone-deaf and ignores the lived experience of applicants navigating an unequal literary landscape.  

  **III. Recommendations:**  

  Based on this analysis, I recommend a two-pronged approach: **Transparent Reporting** to address the immediate finding and restore trust, and **Proactive Process Refinement** to address the underlying structural concerns for future cycles.  

  **A. Public Report Language Recommendations:**  

  1.  **Acknowledge the Observation & Undertaking:** Begin by stating the external observation prompted a rigorous internal review of the last six cycles.
  2.  **Present the Data Clearly & Fully:**  
      *   Show the **overall acceptance rates** (MFA vs. Non-MFA).
      *   Explicitly state the breakdown reveals **Simpson's Paradox**.
      *   Present the **genre-specific acceptance rates** (Fiction: Non-MFA 6% vs MFA 5%; Poetry: Non-MFA 25% vs MFA 20%).
      *   Provide the **application pool composition** (e.g., "Approximately X% of fiction applications came from non-MFA writers, while approximately Y% of poetry applications came from MFA writers").
  3.  **Explain the Paradox Concisely:**  
      *   *"This apparent contradiction occurs because fiction, which receives the majority of applications overall and has a lower acceptance rate, attracts significantly more non-MFA applicants. Poetry, which has a higher acceptance rate, attracts significantly more MFA applicants. When viewed within each genre, acceptance rates for non-MFA applicants are slightly higher than for MFA applicants."*
  4.  **Address the Valid Concerns Directly:**  
      *   *"While this analysis shows no bias in selection based on credential status within the applicant pool received, the Committee acknowledges the significant concerns raised regarding potential structural barriers. The concentration of non-MFA applicants in fiction and MFA applicants in poetry suggests differences in access to training, mentorship, and pathways to developing competitive manuscripts, particularly in poetry. The overall disparity, while statistically explained by the composition of our applicant pool, highlights an inequity in the broader ecosystem that reaches our doorstep."*
  5.  **Commit to Action:**  
      *   *"Therefore, while confident in the integrity of our blind selection process, the Whitmore Fellowship Committee commits to proactive measures (outlined below) to investigate and address potential barriers to application and ensure our process is equitable not just in selection, but in accessibility."*

  **B. Recommendations for Next Year's Selection Process & Beyond:**  

  1.  **Enhanced Outreach & Pipeline Development (Critical):**  
      *   **Targeted Poetry Outreach:** Develop specific initiatives to reach potential non-MFA poets (e.g., community workshops, online forums, collaborations with non-academic writing orgs, libraries). Explicitly encourage applications from writers without traditional workshop backgrounds.
      *   **Mentorship/Information Sessions:** Offer accessible online sessions demystifying the application process and focusing on manuscript development, particularly for poetry, aimed at writers outside MFA programs.
      *   **Audit Outreach Channels:** Ensure current outreach efforts aren't disproportionately reaching MFA networks. Diversify promotional avenues.  
  2.  **Reader Training & Calibration:**  
      *   **Explicit Discussion:** Prior to reading, convene the committee (or genre subcommittees) to discuss the concerns raised about potential unconscious bias towards workshop norms, particularly in poetry. Encourage readers to be mindful of diverse voices, styles, and paths to mastery.  
  3.  **Deepen Data Collection & Analysis (Ongoing):**  
      *   **Track Application Sources:** Refine intake to better understand *how* applicants learn about the fellowship (e.g., MFA program listservs, social media, specific writing orgs, general literary news).
      *   **Continue Genre & Credential Tracking:** Maintain the current audit process. Report these breakdowns internally annually and consider periodic public reporting to demonstrate transparency and track progress.
      *   **Qualitative Feedback (Optional but Valuable):** Explore anonymous post-decision surveys for *all* applicants (funded/unfunded) asking about their preparation path and perceived barriers (ensuring anonymity is robust).  
  4.  **Revisit Manuscript Evaluation (Subtle but Important):**  
      *   **Review Rubrics:** Ensure evaluation criteria emphasize core literary merit (voice, originality, skill, impact) without implicitly privileging markers of "workshop polish." Discuss during calibration whether current criteria achieve this.

  **IV. Conclusion & Recommendation Summary:**  

  The statistical analysis convincingly demonstrates that our *selection process itself*, operating blindly, does not favor MFA-credentialed applicants within the pools we receive for each genre. Simpson's Paradox fully explains the aggregate disparity. **Therefore, I recommend we publish the full breakdown as described in Section III.A, explicitly naming and explaining the paradox while earnestly acknowledging the valid structural concerns raised.**

  However, to address the heart of the second camp's worry – that the aggregate disparity reflects a real-world inequity impacting who *becomes* a competitive applicant, especially in poetry – we must go beyond reporting. **I strongly recommend implementing the proactive measures outlined in Section III.B, focusing especially on targeted outreach and pipeline development for underrepresented applicant groups in poetry and conscious reader calibration.** This addresses the disparity at its potential source (access and preparation) rather than just explaining its manifestation in our numbers.

  This approach honors the mathematics, takes the equity concerns seriously on their own substantive terms, demonstrates institutional responsibility, and proactively works towards a more genuinely equitable fellowship ecosystem. It moves beyond "closing the matter" to opening a path toward meaningful improvement.

  I move that we adopt this framework for the public report and commit to implementing the recommended process refinements for the next cycle. I welcome discussion and refinement of these proposals before our vote.  

  Respectfully,  
  [Your Name]
