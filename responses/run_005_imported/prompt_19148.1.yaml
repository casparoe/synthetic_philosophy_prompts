  The memo should validate both perspectives. The stats are correct, but the underlying inequity in preparation is real. Recommendations need to address both: publish the genre breakdowns transparently to show the paradox, but also take proactive steps to support non-MFA poets. Outreach, mentorship, maybe reconsidering how manuscripts are evaluated if workshop polish is overvalued.

  For the report, clarity is key. Explain the paradox simply, show the genre splits, and commit to investigating barriers. For process changes, focus on outreach to underrepresented groups and maybe training for readers to recognize different strengths beyond workshop polish. Also, continue auditing data to monitor trends.

