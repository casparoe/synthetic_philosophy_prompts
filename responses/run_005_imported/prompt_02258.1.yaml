answer: |-
  You've hit on a brilliant and widely-discussed analogy! Your intuition that decision theory provides tools for handling moral uncertainty is absolutely correct, and philosophers **do** actively explore frameworks like Bayesian model averaging (BMA) for this purpose (e.g., William MacAskill's work). However, the reason it remains a "seriously unresolved problem" isn't because philosophers are oblivious to decision theory, but because applying these tools to *moral theories* introduces unique and profound difficulties that don't exist with predictive models. Here's why the analogy breaks down in crucial ways:

  1.  **The Problem of Incommensurable Outputs:**
      *   **Predictive Models:** All models output predictions *on the same scale* (e.g., probability of default, expected sales, predicted temperature). Averaging 0.6 and 0.7 makes sense.
      *   **Moral Theories:** Different ethical theories output fundamentally *different kinds of evaluations*:
          *   **Utilitarianism:** Outputs cardinal utility values (e.g., +100 utils, -50 utils). Actions are comparable on a single scale.
          *   **Deontology (Kantian):** Outputs categorical imperatives or judgments of permissibility (e.g., "forbidden," "obligatory," "permissible"). These are often binary or trinary, not cardinal.
          *   **Virtue Ethics:** Outputs judgments about character or flourishing (e.g., "courageous," "cowardly," "conducive to eudaimonia"). These are qualitative, often comparative only within a context, and lack a clear numerical scale.
          *   **Rights-Based Theories:** Outputs judgments about rights violations (e.g., "violates right X," "upholds right Y"). Often binary or ordinal.
      *   **The Challenge:** How do you average a cardinal utility score of +50 (Utilitarianism) with a judgment of "forbidden" (Deontology) and a judgment of "courageous but unjust" (Virtue Ethics)? There's no natural, agreed-upon common scale or unit of "moral goodness" to convert them into. This is the core problem of **intertheoretic value comparisons**.

  2.  **The Problem of Assigning Credences/Priors:**
      *   **Predictive Models:** Priors/weights are typically based on *empirical performance* (e.g., past prediction accuracy on held-out data, cross-validation). There's an objective(ish) grounding.
      *   **Moral Theories:** Assigning a credence (e.g., "I'm 70% confident Utilitarianism is correct") is radically different. There's no "moral data" against which to test theories in the same way. Credences must be based on:
          *   *Philosophical intuitions* (which are contested and vary).
          *   *Coherence/plausibility arguments* (highly subjective).
          *   *Metaphysical commitments* (e.g., belief in objective moral facts).
      *   **The Challenge:** Assigning credences lacks the empirical anchor it has in statistics. It becomes deeply subjective and vulnerable to arbitrariness or bias. Why 70% for Util and 30% for Deontology, rather than 60/40? What evidence could settle this?

  3.  **The Problem of Theory Structure and Scope:**
      *   **Predictive Models:** Models are typically designed to predict a specific, well-defined outcome variable.
      *   **Moral Theories:** Ethical theories are vast, complex systems attempting to define the *entire domain* of morality. They often make conflicting claims not just about *what* is right/wrong, but about the *fundamental nature* of right/wrong, the relevant *considerations* (consequences, duties, virtues, rights), and the *scope* of moral concern (all sentient beings? only rational agents?).
      *   **The Challenge:** How do you "score" an action under a theory that fundamentally denies the relevance of the scoring metric used by another theory? How do you weigh a theory that prioritizes individual rights absolutely against one that prioritizes aggregate welfare? The theories aren't just disagreeing on outputs; they're disagreeing on the *rules of the game*.

  4.  **The Problem of Dominance and Fanaticism:**
      *   **Predictive Models:** While weights matter, no single model typically outputs values that are infinitely larger than others. Outliers can be downweighted or handled.
      *   **Moral Theories:** Some theories (especially consequentialist ones under certain interpretations) can assign *infinitely positive or negative* value to certain outcomes (e.g., eternal bliss vs. eternal torment; infinite utility from saving an infinite number of lives). Even a tiny credence in such a theory could dominate the entire calculation, demanding extreme sacrifices for vanishingly small probabilities of achieving infinite goods or avoiding infinite bads. Is this rational? Many philosophers find this "fanaticism" deeply counterintuitive and problematic.

  5.  **The Problem of Normative Authority:**
      *   **Predictive Models:** The goal is clear: predict the target variable accurately. The "correct" blend minimizes prediction error.
      *   **Moral Uncertainty:** What is the *normative goal* of accounting for moral uncertainty? Is it to approximate what the "truly correct" moral theory would prescribe? Is it to minimize "moral error" across possible theories? Is it a requirement of rationality itself? There's no consensus on the *why*, which impacts the *how*.

  **How Philosophers Approach It (and Why It's Hard):**

  Philosophers working on moral uncertainty *do* actively use decision-theoretic frameworks like BMA. Key figures include Nick Bostrom, Toby Ord, Hilary Greaves, and especially William MacAskill (whose PhD thesis and book "Moral Uncertainty" are central). However, they grapple directly with the problems above:

  1.  **Constructing Intertheoretic Comparisons:** They explore ways to *define* a common scale, even if artificially. This might involve:
      *   **Variance Normalization:** Scaling each theory's outputs to have the same variance (highly controversial).
      *   **Range Normalization:** Mapping each theory's outputs to a 0-1 scale based on its best/worst possible outcomes (also controversial).
      *   **"My Favorite Theory" Approach:** Defining all other theories' values relative to the stakes defined by one's current "best guess" theory.
      *   **Contextual Comparisons:** Only comparing outputs for specific actions within specific contexts where theories *seem* commensurable.

  2.  **Epistemic Challenges:** Debating how to form reasonable credences over moral theories without empirical data, relying on reflective equilibrium, conceptual analysis, and coherence.

  3.  **Alternative Frameworks:** Proposing solutions that *aren't* simple BMA, such as:
      *   **Maximizing Expected Choice-Worthiness:** The core BMA-like approach, wrestling with the normalization problem.
      *   **Myopic/Options-Based Approaches:** Comparing actions pairwise based on which theories prefer one over the other.
      *   **Rule Consequentialism under Uncertainty:** Choosing rules that would be best *given* our uncertainty.
      *   **Multi-Objective Optimization:** Treating the outputs of different theories as separate objectives to be traded off (facing the same commensurability issue).

  **Conclusion: Not "Behind," But Wrestling with Deeper Issues**

  You're absolutely right that decision theory provides the *formal toolkit*. Philosophers aren't "behind the curve"; they are *using* that toolkit but confronting its profound limitations when applied to the specific domain of fundamental moral disagreement. The core problem isn't the math of averaging; it's the **meta-ethical challenge of comparing the incomparable** and the **epistemic challenge of weighting incommensurable worldviews**.

  The analogy to model ensembling is powerful and insightful, and it *is* a leading approach. But the difficulties in implementing it meaningfully for moral theories – the lack of a common scale, the subjective nature of credences, the structural incompatibilities, and the potential for fanaticism – are why it remains a hotly debated, unresolved problem in philosophy. Your field provides the engine, but ethics presents uniquely treacherous terrain for it to navigate. The unresolved questions are about *how* (or even *if*) to map the moral landscape onto that engine's requirements.
