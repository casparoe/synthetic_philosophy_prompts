  First, I need to recall Batterman's core argument. He says that finite systems have analytic partition functions, so singularities only appear at infinite N. Therefore, phase transitions are emergent. The user wants a strong counterargument that this doesn't imply ontological emergence. They mentioned universality and renormalization group (RG) flow as potential angles.

  Hmm. The user's background is crucial here. They're an experimentalist who dealt with real, finite samples. Their unease likely stems from seeing phase transitions as tangible phenomena despite finite N. They might feel Batterman's view discounts their empirical work. Also, they need the counterargument grounded in physics concepts like RG, not just philosophy.

  Key points to address:
  - Finite systems show sharp changes; is "singularity" necessary for a "real" phase transition?
  - Emergence: ontological vs. epistemic. Batterman might conflate needing a limit for modeling with the phenomenon itself being emergent.
