answer: |-
  ## The Causation Cage Match: Absences on Trial

  **Setting:** A worn conference room after a contentious symposium. Dr. Elena Vale (Counterfactualist, Lewisian) and Dr. Silas Reed (Process Theorist, Dowean) linger over lukewarm coffee, the care-home case still hanging between them.

  **Dr. Vale:** (Stirring her coffee with intensity) Silas, I keep circling back. Mrs. Abbott *died* because the night nurse didn't administer the beta-blocker. *If* the pill had been given, she *would not* have died. That counterfactual dependence *is* causation. It’s clean, elegant. Your insistence that "nothing happened" feels like a physicist's fetish ignoring the causal landscape we actually navigate. The absence *was* the critical difference-maker.

  **Dr. Reed:** (Leaning forward, hands steepled) Elena, elegance isn’t ontology. *What* conserved quantity was transferred? *What* physical process connected the *non-event* of the pill not being in her system to the cardiac event? There isn’t one. Physics sees molecules interacting, electrical impulses misfiring – processes initiated by prior positive events, perhaps the cumulative effect of the condition, but *not* by the nurse’s inaction itself. That’s why I call it ‘quasi-causation’ – it’s a useful label for responsibility, not a physical mechanism.

  **Dr. Vale:** Useful? If it’s just a ‘courtesy title,’ what does it *buy* you? Why even have the category? It sounds like conceding the causal *intuition* while denying its reality, leaving a gaping hole in how we assign responsibility!

  **Dr. Reed:** It buys clarity! It separates the *metaphysics* of causation – the spatio-temporally contiguous processes governed by conserved quantities like energy or momentum – from the *pragmatics* of explanation and blame. The court found the care home *liable*, rightly so! But liability stems from *duties* and *expectations*, not from the nurse’s omission *being* a physical cause on par with, say, a poison entering her system. We hold the home responsible *because* they had a duty to act, and their failure *made the difference* in the counterfactual sense you love. But that difference-making is grounded in normative structures, not physics. Calling it ‘quasi-causation’ preserves the integrity of physical causation while acknowledging the vital role of absences in our practical reasoning. It prevents us from reifying nothingness.

  **Dr. Vale:** But Silas, your ‘quasi’ feels like a dodge. And here’s where *your* argument bites back: my account *doesn’t* reify nothingness. It identifies a *relation* – counterfactual dependence between events (or non-events and events). But you hit a nerve earlier with the pharmacist and the son. Fine, let’s press it. *If* the day pharmacist had sabotaged the meds, Mrs. Abbott dies. *If* the estranged son had broken in and stolen her pills, she dies. Counterfactual dependence holds for them too. So, are *they* causes on my view? If I say ‘no,’ you cry foul – I’m smuggling in norms. But if I say ‘yes,’ it’s absurd.

  **Dr. Reed:** (Nodding vigorously) Precisely! Your counterfactual dependence is promiscuous. It makes causes of everyone whose action *could* have prevented the death but didn’t – the negligent son, the distracted pharmacist, the CEO of the drug company who didn’t personally deliver the pills, the laws of physics themselves! That’s not causation; it’s a description of possible preventers. You *must* have a filter, and that filter *has* to involve norms – who was *supposed* to act, who had the *duty* or the *capacity*. But that’s not metaphysics, Elena, that’s ethics or law smuggled into your causal ontology. Your ‘pure’ counterfactual dependence isn’t pure at all when it hits the real world.

  **Dr. Vale:** (Takes a breath) Not necessarily smuggled, *refined*. Lewis himself talked about the importance of the *causal field* and holding certain things fixed. We don’t consider the son or the pharmacist causes because, in the *relevant* causal scenario for assessing the nurse’s omission, their actions (or inactions) are part of the *background* – the fixed circumstances. We hold fixed that the pharmacist did their job correctly and the son wasn’t involved. The variable we’re testing is specifically the nurse’s scheduled administration on *that* night. Within *that* field, her omission is the sole difference-maker.

  **Dr. Reed:** Ah! But *how do you pick that field?* Why is the pharmacist’s correct action part of the fixed background, but the nurse’s correct action *isn’t*? What principle, *prior to normative considerations*, tells you that? Isn’t the ‘default’ state you’re implicitly invoking – the state where normal duties are fulfilled – precisely a *normative* baseline? You’re fixing the pharmacist’s action because we *expect* pharmacists to dispense correctly. You’re *not* fixing the nurse’s action because we *expect* nurses to administer as scheduled. Your causal field is sculpted by expectations of normalcy and duty. My ‘quasi-causation’ just makes that normative sculpting explicit, rather than dressing it up as physics.

  **Dr. Vale:** Perhaps... perhaps the field is picked pragmatically, based on salience and explanatory goals. But even then, the *core* causal relation – the dependence of death on that specific absence within its context – remains counterfactual and real. The ‘profusion’ you fear is controlled by context-sensitivity inherent in *all* causal claims, not just omissions. We don’t say oxygen caused the fire just because its absence would prevent it; we focus on the spark. Similarly, we focus on the nurse’s omission because it was the *scheduled intervention* that failed.

  **Dr. Reed:** But the spark is a *process*! Oxygen’s presence is a *state* enabling the process. The nurse’s omission is the *absence* of a process. That’s the crucial disanalogy. Context-sensitivity for positive events still operates within a world of physical interactions. Context-sensitivity for absences operates in a world of *expectations*. My point stands: quasi-causation buys us a way to talk meaningfully and assign responsibility for failures without demanding that physics account for the causal efficacy of nothing. It buys conceptual hygiene. Your counterfactual dependence, applied rigorously to absences, either inflates causation beyond recognition or relies on unspoken norms to do the trimming. The care home is responsible because of a normative failure that made a counterfactual difference. That’s vital for ethics, but it’s not causation in the engine room of the universe.

  **Dr. Vale:** And yet, in the engine room of human life, Elena Vale *died* because a pill wasn’t swallowed. That feels like the most real causation of all. But... (she sighs, looking at her cold coffee) ...I concede your point about the field selection needing more than pure counterfactuals. It’s messy down here in the particulars.

  **Dr. Reed:** (Offers a slight, weary smile) It always is. That’s why we need both the engine and the blueprint. Physics gives us the processes. Norms tell us which absences *matter* enough to call it quasi-causation. The court got it right. Metaphysically... we might still be circling that long drive.

  **(They both fall silent, the unresolved tension hanging as heavily as the case they debated. Neither landed the clean blow, but the difficulties in each position were laid bare.)**

  ## Key Difficulties Pressed
  1.  **Reed pressed Vale:** On the overpopulation problem (pharmacist/son). Vale's response involved causal fields and holding background conditions fixed, but Reed argued the *selection* of that field inherently relies on normative expectations (who *should* act), not pure counterfactual metaphysics.
  2.  **Vale pressed Reed:** On the utility of "quasi-causation." Reed clarified it buys conceptual separation between physical processes and normative responsibility/pragmatic explanation, preventing the reification of nothingness as a physical cause.
  3.  **Core Conflict Remains:** Vale sees the counterfactual dependence *as* the causal relation, refined by context. Reed sees counterfactual dependence for absences as inherently normative/pragmatic and distinct from physical causation via processes, requiring the "quasi" label. Neither fully resolves the other's core objection.
