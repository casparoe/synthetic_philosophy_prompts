  Okay, let me unpack this user's query about Dewey's challenging passage. The user is grappling with a dense paragraph from "The Public and Its Problems" where Dewey discusses the criteria for a good state while rejecting fixed models. Their reading group seems divided, with one member calling it an empty theory. 

  First, I need to recognize this is a sophisticated reader - they're in a pragmatism reading group, understand Dewey's basic framework, and spot genuine tension between having a "criterion" yet no universal state form. Their core confusion is: how can something be both a standard and context-dependent? 

  The historical context matters here. Dewey was writing against both transcendental idealists (like Hegelians) and behaviorist positivists. His experimentalism tries to walk between them. The key is seeing "criterion" not as a measuring stick but as a functional principle - it's about whether the public organizes itself effectively to address indirect consequences. 

  Ah, and that word "formally" is crucial! When Dewey says "only formally can we say what the best state would be," he means we can abstractly define the purpose (public organization) but not prescribe institutional forms. Like knowing a "good knife" must cut well, but the best blade shape depends on whether you're filleting fish or chopping wood. 

  The user's question about "rediscovery" ties to Dewey's theory of inquiry. It's not just about reform - it's that changing social conditions (technology, conflicts, new knowledge) constantly alter what "public organization" requires. Like how the internet created new "indirect consequences" needing governance that 1927 Dewey couldn't imagine. 

  Their groupmate's "empty theory" critique misses how demanding this criterion is. It forces asking: "Is this public actually able to identify and address collective problems?" That's far from relativism - it's a rigorous test applied situationally. Think of it as democracy's version of the scientific method: hypotheses (policies) tested against consequences. 

  I should emphasize how this connects to Dewey's larger pragmatism. For him, knowledge isn't static truths but tools for problem-solving. Political structures are tools too - "good" only when they successfully mediate public issues. Hence the need for constant "rediscovery" when conditions shift. 

  The user's instinct is right - this isn't a dodge. It's Dewey being radically empirical about politics. My response should validate their skepticism while showing how the pieces cohere within his system. Maybe use that knife analogy to make it concrete...
answer: |-
  You've hit on a crucial tension in Dewey's thought – one that reveals the core of his pragmatist experimentalism. Your groupmate's critique ("empty theory") is understandable but ultimately misreads Dewey's radical empiricism. Here's a breakdown of the passage and why it *does* hold together within his framework:

  1.  **The "Criterion" vs. the "A Priori Rule":**
      *   **Criterion:** Dewey *does* offer a functional criterion: **"the degree of organization of the public which is attained, and the degree in which its officers are so constituted as to perform their function of caring for public interests."**
          *   This is grounded in his *definition* of the state: the state *is* the organization of the public to manage the indirect consequences of associated action.
          *   The "goodness" of a state is measured by *how well it performs this specific function*. Does the public effectively recognize itself and its problems? Are officials effectively constituted and responsive to address those problems? This is a *standard of evaluation*.
      *   **A Priori Rule:** What Dewey rejects is a **prescriptive, universal blueprint** for *how* to achieve this organization. He denies there is a single, timeless, perfect institutional form (monarchy, parliamentary democracy, direct democracy, etc.) that is "best" *in all contexts*.
          *   Why? Because the *content* of "public interests," the *nature* of the "indirect consequences," the *means* available for public organization, and the *knowledge* people have about consequences and means **vary radically across history, cultures, and situations.** A constitution perfect for 18th-century agrarian America might be disastrous for a 21st-century globalized, technologically complex society.

  2.  **"Only Formally Can We Say What the Best State Would Be":**
      *   "Formally" here means **in terms of its abstract function or purpose.** We can say formally: "The best state is the one that most effectively organizes the public to identify and manage the indirect consequences of their conjoint actions through responsive officials."
      *   We *cannot* say formally (or concretely): "The best state is always a presidential republic with a bicameral legislature and federal structure" or "The best state is always a council democracy." That concrete form depends entirely on the specific, contingent conditions of a given public at a given time.

  3.  **"The Formation of States Must Be an Experimental Process":**
      *   This is the heart of Dewey's pragmatism applied to politics. Since there's no fixed blueprint, and conditions constantly change, **political organization is an ongoing experiment.**
      *   **"Blind and Accidental" vs. "Intelligent" Experimentation:** Dewey acknowledges states often form and evolve through messy, unreflective trial-and-error ("fumbling and groping"). His key point is that this process *can* and *should* be made more **intelligent**.
      *   **Intelligent Experimentation = Inquiry:** This means applying the method of experimental inquiry (central to pragmatism) to politics:
          1.  **Identify the Problem:** Recognize the specific indirect consequences causing trouble *now* (e.g., climate change, algorithmic bias, pandemics, economic inequality).
          2.  **Hypothesize Solutions:** Propose institutional changes, policies, or new forms of public organization to address these consequences.
          3.  **Test:** Implement these proposals *as experiments*.
          4.  **Evaluate Consequences:** Observe the *actual consequences* of these experiments. Did they effectively manage the problem? Did they create new, unforeseen problems? Did they enhance or hinder the public's ability to organize and communicate?
          5.  **Revise and Retry:** Based on the results, revise the hypotheses (institutions/policies) and test again. This is continuous.

  4.  **"The State Must Always Be Rediscovered":**
      *   This is **much stronger than just "periodic reform."** It's tied directly to his theory of inquiry and the nature of a dynamic world.
      *   **Why Rediscovery?**
          *   **Change:** Social, economic, technological, and environmental conditions are constantly in flux. The "indirect consequences" of yesterday are not the same as today's. The public of 1927 is not the public of 2024 (different knowledge, different associations, different scales of interaction).
          *   **The Provisional Nature of Knowledge:** Political knowledge – knowledge *about* what constitutes the public, its interests, and the best means to organize – is not absolute or settled. It is **always provisional**, derived from past experience and tested against present consequences. As circumstances change, past knowledge may become inadequate or misleading. We must constantly *re-inquire* into the nature of the public and its needs *in the present*.
          *   **The Need for Continuous Inquiry:** "Rediscovery" means the public must **continually re-examine itself:** What *are* the significant indirect consequences of our actions now? Who *is* affected and thus constitutes the relevant public? What forms of organization and official action are *now* most likely to effectively manage these consequences? This is an active, ongoing process of collective intelligence, not just tweaking institutions when they break.

  **Addressing Your Groupmate's Critique & Your Questions:**

  *   **"Empty Theory"?** No. Dewey provides a **robust functional criterion** (effective public organization for managing indirect consequences) and a **method** (experimental inquiry). He rejects **static, universal blueprints**, not standards or methods of evaluation. The criterion *is* used to rank states: State A is "better" than State B *in its specific context* if State A more effectively organizes its public to identify and manage *its* specific indirect consequences through responsive officials. It *can* rank, but the ranking is contextual and functional, not based on conformity to an ideal type.
  *   **Relativism?** Dewey is not a relativist. He believes in real consequences and real problems. The criterion provides an objective (though functional and contextual) standard: *does it work to solve the problems this public faces?* The *means* are relative to context; the *end* (effective problem-solving public organization) and the *method* (intelligent experimentation) are not.
  *   **Does Knowledge Accumulate?** Yes, but not as fixed truths or perfect models. Knowledge accumulates as **funded experience** – a storehouse of tested methods, understood consequences, and lessons learned about *how* to inquire and *how* different institutional arrangements functioned *in specific past contexts*. This funded experience informs *present* inquiry and experimentation but doesn't dictate the answers, which must always be tested against *present* conditions and consequences.
  *   **Is it a Dodge?** No, it's the opposite. It's a **demanding call to action.** Dewey is saying: Stop looking for the perfect, timeless political model in a book or philosophy. Roll up your sleeves. Use intelligence. Figure out *what the problems are right here, right now* for *this* public. Experiment with solutions. Learn from the results. Keep doing it forever, because the world won't stand still. The "dodge" would be clinging to an a priori rule; Dewey demands constant, active engagement.

  **In essence:** Dewey offers a **teleological criterion without a teleological blueprint.** The "end" (a well-organized public managing its problems) is fixed *as a function*, but the *means* to achieve it and the *concrete realization* of that end are perpetually contingent and must be discovered through continuous, intelligent experimentation grounded in the ever-changing present. "Rediscovery" is the necessary, active process of applying experimental inquiry to the fundamental question "What is the public and what does it need *now*?" within the flux of experience. This is the core of his experimentalist political philosophy.
