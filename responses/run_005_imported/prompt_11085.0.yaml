answer: |-
  Here's a toast that balances rigorous Nyaya philosophy with genuine warmth, humor, and wedding-appropriate sentiment, designed to land with both halves of the room. It weaves in your specific requests while keeping the focus firmly on Priya and Mark:

  **(Clink glass gently)** Friends, family, colleagues, esteemed members of Priya’s dissertation committee – thank you for gathering. For those who don’t know me, I’m [Your Name], Priya’s partner-in-crime through the PhD trenches. We’ve spent more hours arguing about *vyāpti* (invariable concomitance, for Mark’s family) than I care to admit. And it’s precisely that shared obsession with *how we know things* in classical Indian philosophy that got me into this toast predicament.

  You see, Priya, brilliant scholar of Nyāya epistemology that she is, challenged me to explain how *this room* – this wonderfully diverse group – can collectively *know* that Priya and Mark are truly meant for each other. And being Nyāya enthusiasts, we naturally turn to the four *pramāṇas*, the valid means of knowledge. So, bear with me… I promise this won’t be a viva voce defense. Mostly.

  1.  **Pratyakṣa (Perception):** This is the direct, immediate knowledge. And honestly? **Just look at them.** Right now. The way Priya’s eyes find Mark’s in a crowded room, like a homing beacon. The way Mark’s whole face lights up when she walks in, even after a long ER shift. It’s not just seeing two people standing together; it’s perceiving the effortless comfort, the quiet understanding, the sheer *joy* radiating off them when they’re side-by-side. It’s the unspoken language in a shared glance, the way his hand rests on the small of her back. This knowledge isn’t inferred or argued; it’s *seen*, as directly and undeniably as we see this beautiful setting before us. Their happiness is a sensory fact.

  2.  **Anumāna (Inference):** Now, for the logicians among us... and even for those who just appreciate a good deduction! Anumāna is knowledge based on perceiving a sign (*liṅga*) that’s invariably associated with something else. The classic example? Seeing **smoke on a distant hill** and correctly inferring the presence of fire. You don't see the fire directly, but you know smoke doesn't happen without it.
      *   So, what’s the *liṅga* here? What’s the “smoke” pointing to the “fire” of their profound connection? Look at their **actions**. Priya, normally laser-focused on Vātsyāyana’s commentary, will drop everything when Mark texts about a tough case, just to listen. Mark, after 12 hours of saving lives, will still muster the energy to proofread Priya’s latest chapter on *anumiti* (inferential knowledge!), even if the only inference *he* usually needs is deducing which takeout she’d prefer. The sign (*liṅga*) is their unwavering, selfless support for each other’s vastly different worlds – the intensity of the ER meeting the intensity of the Nyāya *sūtra*. That level of consistent, dedicated care? That’s the smoke. And it allows us to confidently infer the fire – the deep, abiding love and partnership that fuels it all.

  3.  **Upamāna (Comparison/Analogy):** This is knowledge based on similarity. Remember the classic *gavaya* story? Someone who knows a cow is told a *gavaya* (wild ox) is *like* a cow. Later, in the forest, they see this unfamiliar creature, recognize the similarity, and know, "Ah, *that* must be a gavaya!"
      *   For Priya and Mark, it’s not about finding an exact match, but about finding the perfect **complementary fit**. Priya, with her brilliant, analytical mind that can dissect an argument for hours, found her counterpart in Mark’s grounded, compassionate pragmatism. He’s her steady anchor when the philosophical seas get rough; she’s the spark that ignites new perspectives in his world. They aren't identical, like two cows. Instead, they fit together like pieces of a puzzle you didn't know was incomplete. Seeing them interact, you recognize the harmony – "Ah, *that* is what partnership looks like!" It’s the knowledge that comes from witnessing how perfectly their differences create a stronger, more complete whole.

  4.  **Śabda (Testimony/Verbal Authority):** Ah, testimony. Reliable words from a reliable source. Nyāya has strict standards for an *āpta* – a reliable testifier. They must be *knowledgable* (*jñānavat*) and *truthful* (*satyavādin*), free from deceit or the desire to mislead. *(Glance knowingly at Priya's aunties)* Now, I know several aunties here are *burning* to testify they "always knew" Priya and Mark would end up together. And their affection is undeniable! But according to rigorous Nyāya standards? Did they possess direct perception (*pratyakṣa*) of the future? Did they have valid inference (*anumāna*) based on invariable signs years ago? *(Wink)* Unless they can present their *pramāṇa* credentials... their testimony, while incredibly loving, might be classified as more *faith* than established *knowledge*!
      *   **True Śabda** comes from those who have witnessed their journey *closely* and *honestly*. From Priya’s parents, who saw Mark’s kindness transform their daughter’s late-night study stress. From Mark’s siblings, who saw Priya’s unwavering support during his toughest shifts. From their closest friends – yes, even cynical PhD candidates like me – who have seen the authentic, sometimes messy, always loving reality of their relationship *up close*. *That* testimony, from credible witnesses to their genuine bond, carries the weight of true knowledge. It confirms what we perceive, infer, and recognize through analogy.

  **(Raise glass higher)** So, there you have it. Through direct perception, undeniable inference, the harmony of comparison, and the reliable testimony of those who know them best… we can all *know*, with the certainty of a well-proven syllogism, that Priya and Mark are not just perfect for each other, but that their love is a truly valid, justified, beautiful piece of knowledge.

  Priya, my brilliant friend, my Nyāya sparring partner – seeing you so radiantly happy is the best thesis defense life could offer. Mark, thank you for bringing that light to her eyes and for keeping her grounded (and fed!) through the dissertation madness. You’re the steady hand she needs, and the perfect counterbalance to her formidable intellect.

  May your life together be filled with clear perception of each other's joys, skillful inference to navigate any challenges, beautiful analogies that keep your connection fresh, and always, always, the most reliable testimony of love and support from everyone gathered here.

  **To Priya and Mark!**

  **Key elements incorporated:**
  *   **Pratyakṣa:** "Just look at them" enhanced with specific, observable, warm details of their interaction.
  *   **Anumāna:** Explicitly uses the smoke-fire analogy, applying it to their observable actions (support) inferring the underlying love.
  *   **Upamāna:** Uses the *gavaya* story directly to frame their complementary fit, moving beyond simple similarity to harmonious completion.
  *   **Śabda:** Directly addresses the *āpta* criteria and humorously disqualifies the aunties' "always knew" claims while validating close friends/family as reliable witnesses.
  *   **Tone:** Warm, humorous, self-deprecating about academia, focused on the couple. Avoids jargon overload, explains terms briefly where needed.
  *   **Flow:** Connects each *pramāṇa* back to Priya & Mark, building to the conclusion. Uses transitions ("So," "Now," "Ah," "So there you have it").
  *   **Length:** Aimed at 4-5 minutes when spoken with natural pauses.
  *   **Audience:** Nods to academics (committee, vyāpti mention, standards) but keeps explanations accessible. Focuses on universal sentiments of love and partnership. The inside joke is there but not exclusionary.

  This toast honors Priya's challenge, satisfies the scholars in the room with accurate content and subtle winks, delivers warmth and humor for everyone else, and ultimately celebrates the couple beautifully. Good luck!
