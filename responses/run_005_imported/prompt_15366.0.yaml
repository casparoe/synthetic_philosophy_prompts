answer: |-
  Frederick Douglass would likely view contemporary originalism as a **betrayal of his interpretive method**, despite superficial similarities in its language of textual fidelity. This judgment rests on the specific structure and purpose of his argument, particularly its **rejection of historical intent in favor of textual ideals** and its **embrace of the Constitution's aspirational principles as the foundation for expansive rights**, especially after the Reconstruction Amendments.

  Here's the justification, referencing the core elements of Douglass's argument:

  1.  **Rejection of Framers' Intent & Reliance on Textual Absence:** Douglass's central move against Garrison was to *dismiss* the "private intentions" and known proslavery views of many framers as irrelevant. He argued the *document itself*, through the conspicuous absence of the words "slave" or "slavery," created a textual space for freedom. Originalism, in practice (as referenced in the prompt), often *relies heavily* on reconstructing the original public meaning or expected application, which frequently incorporates the very historical context, societal assumptions, and framers' expectations that Douglass explicitly deemed illegitimate when they contradicted the text's plain meaning and stated ideals ("establish Justice," "secure the Blessings of Liberty"). When originalists look to historical practice or expected scope to *narrow* the Reconstruction Amendments, they are employing the methodology (prioritizing historical context/expectation) that Douglass rejected.

  2.  **Primacy of the Preamble's "Stated Purposes":** Douglass anchored his interpretation in the Preamble's grand, aspirational goals: "to form a more perfect Union, establish Justice, insure domestic Tranquility, provide for the common defence, promote the general Welfare, and secure the Blessings of Liberty." He saw the Constitution as fundamentally committed to liberty and justice. His textualism was not a neutral, minimalist exercise; it was an argument that these stated purposes provided the *governing framework* for interpreting the rest of the document, demanding that ambiguous clauses be read *in favor* of liberty. Contemporary originalism, as used to narrow the Reconstruction Amendments, often treats the Preamble as non-justiciable rhetoric rather than the interpretive key. Its focus on specific historical expectations often leads to interpretations that *limit* the realization of the Preamble's ideals (like Justice or securing Liberty) for marginalized groups, contrary to Douglass's use of the Preamble as a tool for *expansive* rights.

  3.  **The Transformative Role of the Reconstruction Amendments:** Douglass hailed the 13th, 14th, and 15th Amendments as a "great revolution," fundamentally altering the Constitution's character and redeeming its promises. He argued they embedded broad, national guarantees of freedom, citizenship, equality, and suffrage, designed to dismantle the system of slavery and its legacy. His interpretive method would demand reading these amendments in light of their *revolutionary purpose* and the Preamble's ideals they fulfilled, not constraining them by the racist attitudes or limited expectations prevalent in 1868. When contemporary originalism is invoked to narrow the scope of, for example, the 14th Amendment's Equal Protection Clause (e.g., in affirmative action) or the 15th Amendment's protections against racial discrimination in voting (e.g., in voting rights rulings), by referencing original expected applications that tolerated significant inequality, it directly contradicts Douglass's view. He would see this as using a methodology fixated on the *past limitations* of the society that enacted the amendments to undermine the *future-oriented, transformative guarantees* the amendments were designed to establish – a betrayal of the "new birth of freedom."

  4.  **Textualism in Service of Liberation vs. Constraint:** Douglass employed textual fidelity as a *sword* to dismantle the legal foundations of slavery. He used the absence of proslavery words and the presence of liberty-oriented language to argue for the *invalidation* of slavery under the Constitution. His method was inherently dynamic and liberatory within the textual framework. Contemporary originalism, as described in the prompt, is often wielded as a *shield* against claims for broader interpretations of rights, particularly those grounded in evolving understandings of equality. Its use to *curtail* the practical enforcement of the Reconstruction Amendments would appear to Douglass as the *opposite* of his project. It borrows the *language* of fidelity to the text but applies it to achieve an outcome (restricting rights) antithetical to the outcome he sought (expanding rights).

  **Conclusion:**

  While both Douglass and contemporary originalists emphasize the text, Douglass's method was fundamentally different in its rejection of historical intent, its elevation of the Preamble's ideals as the governing interpretive principle, and its insistence that the Reconstruction Amendments be read broadly to fulfill their transformative purpose of establishing national equality and liberty. Contemporary originalism, when used to narrow the scope of those amendments by tethering them to the limited expectations and pervasive racism of their era, directly contradicts the core tenets of Douglass's argument. He would recognize it not as a vindication, but as a profound betrayal – a co-option of the language of textual fidelity to achieve results that undermine the very ideals of liberty and justice he believed the Constitution, rightly interpreted, enshrined. It prioritizes the historical context he dismissed and undermines the revolutionary amendments he championed.
