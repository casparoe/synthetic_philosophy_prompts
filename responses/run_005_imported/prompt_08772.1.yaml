answer: |-
  The dust motes danced in the slanting March light of the library at Cranbury Park. John Conduitt ran a hand, already smudged with grime, over the worn leather cover of yet another folio. *Philosophiæ Naturalis Principia Mathematica*. The weight of it felt different now. Not just the physical heft, but the crushing responsibility of the man who wrote it, and the secrets he’d left behind.

  Since Sir Isaac’s passing weeks ago, Conduitt had moved into this room like a scholar-soldier occupying contested ground. Boxes, trunks, and disordered piles of papers – decades of thought, calculation, and obsession – surrounded him. He was the executor, the guardian, the future architect of Newton’s legend. And the foundations, he was discovering, were riddled with fissures.

  His fingers hesitated over a familiar, disquieting bundle. Letters exchanged with John Locke. He’d known of their friendship, the intellectual kinship. He hadn’t known about *this* particular exchange. Unfolding the brittle sheets, Newton’s sharp, angular script leapt out: arguments meticulously dissecting the scriptural proofs for the Trinity, declaring them corruptions, later interpolations by misguided scribes. The words weren’t just heretical; they were surgical, precise, the same relentless logic that had mapped the heavens turned inward on the bedrock of Anglican faith. Conduitt remembered Locke’s reported panic upon receiving it, the near-destruction of the letter. *He understood the danger,* Conduitt thought grimly. *The sheer incendiary power.*

  Then came the prophecies. Volumes upon volumes, dense with Newton’s annotations in Greek, Hebrew, Latin. Daniel’s visions, the cryptic beasts of Revelation, all meticulously decoded not to foretell distant apocalypses, but to point a damning finger squarely at the fourth century. The Council of Nicaea, the triumph of Trinitarian orthodoxy – this, Newton argued with terrifying conviction, *was* the prophesied Apostasy, the Great Falling Away. The very cornerstone of the Church, the doctrine Newton had publicly adhered to (however perfunctorily), was, in his private conviction, the ultimate corruption foretold by the prophets. Conduitt felt a chill that had nothing to do with the draughty room. This wasn't just unorthodoxy; it was a systematic dismantling of ecclesiastical history.

  And beneath it all, like the bass note of a disturbing symphony, lay the measurements. Years of work, thousands of calculations: the precise dimensions of Solomon’s Temple, reconstructed cubit by sacred cubit. Not for architectural interest, but as a divine cipher, a physical prophecy echoing Daniel and Revelation, confirming the same terrible timeline. The sheer volume of effort staggered Conduitt. This wasn’t a passing fancy; it was a parallel life’s work, running concurrent with the calculus and the laws of motion.

  He leaned back, the worn leather of the chair groaning. Outside, the world revered Sir Isaac Newton – the unparalleled genius, the architect of the modern age, the pride of England. The Royal Society awaited his papers, hungry for scientific revelations. The public craved stories of the apple, the prism, the quiet sage. That was the legend Conduitt was meant to polish and present.

  But this… this was dynamite. Publishing these theological and historical dissections wouldn't just tarnish Newton’s reputation; it could shatter it. It would ignite theological firestorms, provide ammunition to Deists and dissenters, embarrass the Crown and the Church. Newton, the national icon, recast as a secret heretic, a man who saw the established faith as the prophesied enemy of true religion. The scandal would be immeasurable. His scientific achievements might be dragged into the mire, dismissed as the work of an unsound mind obsessed with hidden codes.

  Conduitt picked up a single sheet covered in dense numerical calculations for the Temple’s inner court. The precision was breathtaking, the devotion absolute. He thought of Catherine, his wife, Newton’s niece. Her quiet grief, her pride in her uncle. He thought of the King, the Archbishop, the Fellows of the Royal Society. He thought of history.

  *What do I owe him?* The question echoed in the silent room. Fidelity to the *whole* truth of the man? Or fidelity to the legacy that could inspire, the rational light that could guide the age? Was preserving the public good – and Newton’s monumental scientific contribution – worth a monumental lie of omission?

  He carefully re-bundled the Locke correspondence, tying it with a fresh ribbon. He slid the most explosive prophetic interpretations and the bulk of the Temple calculations into a sturdy oak box he’d had brought in. The key turned in the lock with a decisive *click*. It felt less like preservation and more like interment.

  But not all of it. A few folios of historical chronology, perhaps some less incendiary notes on prophecy – carefully vetted, naturally – could be included. Hints of his deep religious scholarship, safely framed within conventional piety. A testament to his breadth, without revealing the dangerous depth.

  He picked up a draft of the memoir he’d begun. "...his profound faith guided his unparalleled inquiries into Nature's laws..." The words tasted like ash. He dipped his quill, hesitated, then added: "...and into the sacred texts, which he studied with characteristic diligence, seeking always the harmony of God’s Word and God’s Works."

  Harmony. The word mocked him. There was no harmony here, only dissonance – between the public Newton and the private one, between the demands of truth and the necessities of legacy, between his duty to the dead genius and his duty to the living world.

  Conduitt looked at the locked box, then at the carefully curated pile destined for the Society. The dust motes still danced in the sunlight, oblivious. The reckoning wasn't over; it had merely been partitioned. He would shape the story, yes. He would protect the flame of Newton’s scientific genius. But the cost sat heavy in that locked box, a secret heresy humming beneath the legend, a truth buried deep in the foundations of the temple he was building to Sir Isaac Newton. And the weight of that decision, the constant, low hum of the unresolved, would now be his constant companion. He closed the memoir draft. It was a start, a carefully constructed facade. The real work – the work of silence and selection – had only just begun. He reached not for the quill, but for the key in his waistcoat pocket, turning it over and over in his fingers, feeling its cold edges bite into his skin. The papers waited. The legend demanded its due. And John Conduitt, architect of memory, sat amidst the ruins of unvarnished truth, building his necessary fiction, one deliberate omission at a time. For now, the box would stay locked.
