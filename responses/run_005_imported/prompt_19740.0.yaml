  First, I need to explain the likelihood principle clearly. It states that all evidence comes from the likelihood function - the probability of observed data under different hypotheses. The key implication is that how you planned to collect data (like stopping rules) shouldn't affect inference once data is in hand. 

  For their A/B test: peeking daily and stopping at significance violates this principle. The p-value calculation assumes a fixed sample size, but they've effectively conducted a sequential test. The reported p=0.05 might actually correspond to much weaker evidence - perhaps equivalent to p=0.20 in a fixed design. I should emphasize that their false positive rate isn't 5% anymore; it could be inflated to 20-30%. 

  The Bayesian critique makes sense here. Bayes factors depend only on the data actually obtained, not unobserved intentions. This makes optional stopping irrelevant for evidence quantification. Frequentists need complex corrections like alpha-spending to handle sequential testing properly.

