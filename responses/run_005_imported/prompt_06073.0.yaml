prompt: |-
  So I'm on the ML infra team at a small startup and we're doing RLHF-style fine tuning on our model. Part of my job this quarter is redesigning how we collapse a pile of per-rater preference scores into the single scalar reward that actually gets optimized against. Right now we just average everyone's normalized scores, which always felt kind of arbitrary to me, so I went down a rabbit hole reading about the theory behind combining people's preferences into one number. I ran into something called Harsanyi's aggregation theorem (sometimes called the "utilitarian theorem"), which as far as I understand says: if each individual's preferences and the group's preferences both satisfy the von Neumann-Morgenstern axioms, and some Pareto condition holds, then the group's utility function has to be a weighted linear sum of everyone's individual utility functions. A coworker who did a philosophy minor in college told me this is basically the closest thing economists have to a "proof" that utilitarian-style weighted averaging is the mathematically correct way to combine people's preferences, but he was pretty fuzzy on the actual details and I don't fully trust the handful of blog posts I skimmed either.

  Could you walk me through the most important implications of this theorem for something like what my team is actually doing? Specifically I care about three things: first, does the theorem actually tell you what the weights on each rater should be, or does it just guarantee that *some* set of positive weights exists and leave the hard part (choosing them) completely open; second, does the theorem quietly assume that different raters' utility scales are comparable to each other in a way we're definitely not guaranteeing just by normalizing everyone's 1-5 ratings the same way; and third, is there some fairness-type consideration in how outcomes get produced (like whether risk ends up spread evenly across raters vs. concentrated on a few) that this framework structurally can't capture no matter how the weights are set. I'm not asking for a full derivation with proofs, i just want to know what I'm actually allowed to conclude from this theorem before I go put it in a design doc as the justification for our approach.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're on an ML infra team at a startup focusing on RLHF fine-tuning. Their task is to aggregate rater preferences into a single reward scalar. Currently, they average normalized scores, but they feel it's arbitrary. They've come across Harsanyi's aggregation theorem and want to understand its implications for their work.

  First, I need to recall Harsanyi's theorem. It states that under VNM rationality axioms and Pareto efficiency, the group utility must be a weighted linear sum of individual utilities. The user has three main concerns: how weights are determined, comparability of utility scales, and fairness considerations beyond the theorem.

  The user's first question is about the weights. Does the theorem specify them or just prove existence? From what I remember, the theorem only guarantees the existence of weights but doesn't prescribe how to set them. The weights are determined by the social planner's value judgments. So in their case, averaging assumes equal weights, but the theorem doesn't justify that choice. They need to decide weights based on rater expertise or other factors, which isn't addressed by the theorem.

  Second, utility scale comparability. The user normalizes ratings 1-5, but Harsanyi assumes interpersonally comparable cardinal utilities. Normalizing to the same range doesn't ensure true comparability because individual scales might differ. For example, a 5 from one rater could mean something different from another. The theorem requires that utility differences are comparable across raters, which their normalization might not achieve. They might need to calibrate raters or use more advanced methods to ensure meaningful aggregation.

  Third, fairness and risk distribution. The theorem doesn't address how outcomes affect individuals. A linear sum could allow one rater's preferences to dominate, leading to unfair concentration of dissatisfaction. Also, it ignores distributional equity, like whether most raters are slightly unhappy versus a few very unhappy. The theorem focuses on Pareto efficiency and rationality but not fairness, so they need to consider separate fairness metrics.

  Looking deeper at the user's needs: they want to justify their approach in a design doc. They might be seeking theoretical backing for using weighted sums. But the theorem's assumptions are strong. They need to acknowledge limitations like scale comparability and fairness. Their real challenge is practical: aggregating diverse ratings reliably. They might benefit from methods like Bradley-Terry models or calibration, but Harsanyi alone isn't sufficient justification.

  Also, the user's identity as a startup ML engineer suggests they need pragmatic solutions. They might prioritize simplicity over theoretical rigor. Highlighting the theorem's caveats helps them avoid overpromising in documentation. Emphasizing that weights and normalization require careful consideration beyond the theorem is crucial. Suggesting supplemental approaches like rater reliability metrics or fairness checks could add value.

  In summary, Harsanyi provides a foundation for linear aggregation but doesn't solve the practical issues. The user must address weight assignment, ensure true utility comparability, and incorporate fairness separately. Their design doc should present the theorem as a rationale for using weighted sums but transparently note its limitations and the need for empirical weight choices and fairness considerations.
answer: |-
  Based on your questions and context, here's a breakdown of Harsanyi's Aggregation Theorem and its *practical implications* for your RLHF reward design, focusing on your three key concerns:

  **Core Implications & Limitations for Your RLHF Task:**

  1.  **Weights: Existence vs. Specification (Your First Question):**
      *   **The theorem guarantees *existence*, NOT specification.** It proves that *if* the conditions hold (individual VNM rationality, group VNM rationality, Pareto efficiency), *then* there *exists* a unique (up to affine transformation) set of **positive weights** such that the group utility is the weighted sum of individual utilities.
      *   **The hard part is ABSOLUTELY left open:** The theorem says *nothing* about *how* to determine those weights. It doesn't tell you if they should be equal (like your current average), proportional to rater expertise, based on rater agreement, or anything else. The weights represent the "social planner's" (your team's!) relative valuation of each individual's preferences within the group.
      *   **Implication for Design Doc:** You can cite Harsanyi as justification for using a *weighted linear sum* as the *functional form* for aggregating preferences, given the axioms. **However, you MUST explicitly state that the *choice of weights* is a separate, critical design decision *not* dictated by the theorem.** Averaging is just one arbitrary choice (equal weights).

  2.  **Utility Scale Comparability (Your Second Question - This is CRITICAL):**
      *   **Yes, the theorem *fundamentally* assumes interpersonal comparability of cardinal utility.** This is the **most significant and often overlooked assumption** for practical applications like yours.
      *   **VNM utilities are cardinal:** They are unique only up to affine transformations (u'(x) = a*u(x) + b, a > 0). This means the *zero point* and *unit scale* for each individual's utility function are arbitrary.
      *   **Harsanyi requires *meaningful* comparison:** For the weighted sum `U_group = Σ w_i * u_i(x)` to be meaningful, the relative magnitudes of `u_i(x)` across different raters `i` must have meaning. The weights `w_i` interact directly with the arbitrary scales of each `u_i`. If you arbitrarily rescale one rater's utility (e.g., `u_j'(x) = 2 * u_j(x)`), it's mathematically equivalent to doubling their weight `w_j`.
      *   **Your Normalization Problem:** Simply mapping everyone's 1-5 ratings to, say, 0-1 (or -1 to 1) **does NOT establish true interpersonal comparability.** You are imposing an *external* scale. It forces the *range* to be the same, but it doesn't mean a "4" from Rater A represents the same *intensity of preference* relative to their own scale or relative to Rater B's "4" as a "4" from Rater B represents relative to *their* own scale. Did Rater A use the whole scale? Did Rater B only use 3-5? Normalization aligns ranges but **does not calibrate the underlying utility scales**.
      *   **Implication for Design Doc:** **This is the Achilles' heel of directly applying Harsanyi to simple rating aggregation.** You *must* acknowledge that:
          *   Harsanyi *assumes* comparable cardinal utilities.
          *   Your normalization scheme is an *attempt* to impose comparability, but it's fundamentally an **approximation** and **not guaranteed** to satisfy the theorem's strong requirement.
          *   Justification for using a linear sum relies on *accepting this approximation* as "good enough" pragmatically, or on arguing that RLHF fine-tuning itself *induces* a common scale through the optimization process. **Do not claim the theorem proves your normalized scores are comparable.**

  3.  **Fairness, Risk Distribution, and Structural Blind Spots (Your Third Question):**
      *   **Yes, Harsanyi's framework has major limitations regarding fairness and distribution:**
          *   **Concentration of "Cost":** The linear sum only cares about the *net* outcome. It is completely indifferent to *how* dissatisfaction is distributed. Scenario A: 51% of raters *love* an outcome (+1 util), 49% *hate* it (-1 util). `U_group = (0.51*1 + 0.49*-1) = 0.02`. Scenario B: 100% of raters are *mildly* satisfied (+0.02 util). `U_group = 0.02`. Harsanyi treats these as equally good. It doesn't care that Scenario A creates extreme polarization. Your weights influence *whose* dissatisfaction matters more, but not the *distribution pattern*.
          *   **Risk Aversion at Group Level:** While individual VNM utilities capture personal risk aversion, the *linear* aggregation means the *group* utility function inherits an "average" risk aversion profile based purely on the weighted sum. It doesn't necessarily reflect a collective aversion to catastrophic outcomes for a subgroup unless that catastrophe drastically lowers the utilities of highly weighted individuals.
          *   **Procedural Fairness/Inequity Aversion Ignored:** The theorem focuses solely on the utility derived from final outcomes (`x`). It ignores *how* the outcome was achieved or perceptions of unfairness in the *process* or the *distribution* itself. Concepts like envy, inequity aversion, or Rawlsian "maximin" fairness are outside its scope.
          *   **Anonymity:** The weights explicitly break anonymity. The theorem allows (and the weights determine) that some raters' preferences count more than others. This might be desirable (weighting experts higher) but needs explicit justification.
      *   **Implication for Design Doc:** **Explicitly state that Harsanyi's aggregation is solely concerned with Pareto efficiency and VNM rationality under the strong comparability assumption. It does *not* incorporate common notions of fairness, equality, or risk distribution equity.** If these are important goals for your RLHF process (e.g., avoiding model outputs that strongly polarize raters), you need to consider:
          *   **Explicit fairness constraints:** E.g., minimizing the maximum dissatisfaction (minimax regret), variance-based penalties, or constraints based on subgroup performance.
          *   **Complementary metrics:** Track things like rater disagreement variance, min/max rater score, or subgroup scores alongside the aggregate reward during evaluation.
          *   **Acknowledging the trade-off:** Recognize that optimizing purely for a Harsanyi-style aggregate reward might come at the cost of fairness properties you value.

  **Summary & Recommendations for Your Design Doc:**

  *   **Cite Harsanyi for the Functional Form:** "To satisfy the core rationality axioms (VNM) and Pareto efficiency under the assumption of comparable cardinal utilities, the aggregate reward function must take the form of a weighted linear sum of individual rater utilities."
  *   **Acknowledge Key Practical Limitations:**
      *   **"The specific weights `w_i` are not determined by the theorem and represent a critical design choice reflecting the relative importance assigned to each rater's preferences."** (Explain *how* you will set them - equal? Based on expertise scores? Based on agreement? This is your core design decision).
      *   **"Achieving true interpersonal comparability of cardinal utility scales, as strictly required by the theorem, is challenging. Our normalization procedure `[Describe it briefly]` is a practical approximation to enable aggregation but may not fully satisfy this requirement."**
      *   **"This aggregation method focuses on overall efficiency and does not inherently optimize for fairness properties like equal distribution of satisfaction/disagreement or protection of minority viewpoints. We will `[Mention your mitigation: e.g., monitor fairness metrics X, Y, Z; consider future fairness constraints]`."**
  *   **Justify Linearity (Compared to Alternatives):** Frame it as: Given the theoretical foundation for linear aggregation under strong assumptions, and its computational simplicity/optimization stability, we adopt this form *while being mindful of its limitations* regarding weight choice, scale comparability, and fairness.

  **In essence:** Harsanyi provides a powerful *theoretical justification for using a linear weighted sum* as your aggregation *formula*, given its axioms. However, it **does not** solve the core practical problems you face: **choosing the weights**, **enforcing true utility comparability** from ratings, or **addressing fairness concerns**. These require separate, explicit design decisions and justifications beyond the theorem itself. Be transparent about these limitations in your doc.
