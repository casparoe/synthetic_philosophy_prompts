  The setting is the lighthouse gallery post-trial. The dialogue should feel natural, with interruptions and rebuttals. I'll start with them observing the wreck, then dive into their debate. Thorne can bring up the counterfactual first, Voss counters with the physical process argument. Then the Queen example comes in, and Thorne clarifies the duty angle. Voss concedes the point but shifts to moral responsibility without causation.

  I should ensure both philosophers are sharp. Thorne uses legal and philosophical examples (like Beebee's paper), Voss references process theories like Salmon or Dowe. The ending ties to the moral weight—Voss admits the keeper's failure is significant regardless of causation semantics.

