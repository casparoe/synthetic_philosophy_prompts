prompt: |-
  So in my early analytic philosophy class we just read Schlick's essay "On the Meaning of Life" right after finishing a whole unit on the verification principle (a sentence is only meaningful if it's empirically verifiable, otherwise it's literally cognitively meaningless, not even false, just nonsense). Now I'm kinda confused — Schlick was one of the main guys behind verificationism, but then he turns around and writes this totally sincere essay seriously answering "what is the meaning of life," and concludes its basically play, or youth, with zero acknowledgment that by his own criterion the question should just be meaningless metaphysical nonsense. Isn't that a pretty straightforward contradiction in his philosophy? Feels like the guy who invented the tool for dissolving pseudo-questions forgot to use it on his own essay topic. Am I missing something about how these two parts of his thought fit together, or is this just an actual inconsistency in his views?
