  First, I need to ensure both characters are well-informed and articulate. The community advocate (let's call them Sam) must argue that without external checks, Crusoe can't truly follow rules because "whatever seems right is right." The practice advocate (Alex) needs to counter that established habits create their own standards, allowing Crusoe to recognize mistakes internally. 

