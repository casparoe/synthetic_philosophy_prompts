  First, I need to recall the key differences between Lucas and Penrose. Lucas's 1961 argument is based on Gödel's incompleteness theorems. He claimed that for any consistent formal system F strong enough for arithmetic, there's a Gödel sentence G_F that F can't prove. Lucas argued humans can see G_F is true, so human reasoning surpasses any formal system. But critics pointed out issues: how do humans know their own consistency? And which system exactly corresponds to human thought?

  Penrose, especially in *Shadows of the Mind*, tries to address these criticisms. He shifts from consistency to "knowable soundness." His argument involves assuming a formal system H that models human mathematical understanding. If H is sound, then humans can prove its soundness, leading to a contradiction via a modified Gödel sentence. Penrose concludes that human reasoning isn't computable.

  Now, assessing Penrose's improvements. He avoids claiming humans are consistent by focusing on soundness. Also, he doesn't fixate on a single system but allows for evolving understanding. But does this fix the problems? Critics like Putnam and Feferman say no. The key issue remains: Penrose assumes humans can know the soundness of H, but if H is inconsistent, that knowledge is invalid. Plus, the argument might be circular, presupposing human consistency.

