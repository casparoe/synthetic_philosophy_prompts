  Looking at Pascal's text: he sets up two options—making just things strong or making strong things just. But he dismisses the first because force inherently contradicts justice. The key is the line where force declares itself just and justice unjust. This isn't just about asymmetry; it's about force's tendency to co-opt justice. The user wonders if a universally accepted justice could avoid this, but Pascal's point is that in a fallen world, force will always dominate precisely because justice is disputable. Even if justice were agreed upon, the transition to enforcing it requires force, which then corrupts it.

