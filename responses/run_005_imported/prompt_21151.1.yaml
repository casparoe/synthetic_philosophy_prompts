  First, I need to recall Lewis's arguments. He distinguishes between fines and imprisonment. Fines can be paid by someone else, but prison sentences can't because they're personal. The friend is simplifying this to say Lewis "proved" substitutionary atonement is incoherent. But Lewis actually explores how society has mixed views. He points out that fines are transferable, showing that not all penalties are personal. 

  The user mentioned Lewis's discussion about being "of two minds." That's key. Lewis argues that people intuitively accept substitution in some contexts (like fines) but not others (like prison). So the inconsistency is in human intuitions, not necessarily the doctrine itself. The user's friend might be ignoring this nuance. 

  Also, Lewis's conclusion isn't a refutation but a challenge to both sides. He says if we accept penal substitution, we must embrace the analogy to fines, not prisons. The user noticed the ending wasn't a knockdown argument, which aligns with Lewis's nuanced stance. 

