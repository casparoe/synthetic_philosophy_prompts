  Okay, let me start by unpacking the user's query. They're a retired physicist who worked on specific heat measurements near critical points in magnetic salts during the 80s and 90s. Now, they're delving into philosophy of science and came across Robert Batterman's argument about phase transitions requiring the thermodynamic limit for a true singularity, thus being emergent. Their old physics book club couldn't agree on this, and they feel the argument might smuggle in a mathematical idealization as a metaphysical conclusion. They want a strong case against Batterman's view, possibly using universality and renormalization group (RG) flow.

  First, I need to recall Batterman's core argument. He claims that since finite systems have analytic partition functions, real singularities only appear at infinite N, making phase transitions emergent. The user is skeptical about this leap from mathematical necessity to ontological emergence. Their identity as an experimental physicist matters here—they dealt with real, finite samples but observed clear critical behavior. So, their experience contrasts with the idea that finite systems don't exhibit phase transitions.

  The user mentions universality and RG. These are crucial for counterarguments. Universality shows that diverse systems share critical behavior due to RG fixed points, which might imply that the physics isn't just about infinite N. RG flow explains how scaling emerges from microscopic interactions, possibly grounding phase transitions in finite systems.

  I should build the case around several points. First, challenge the notion that singularities are the only defining feature. Experiments on finite systems show divergences that are practically singular. The user's own work with specific heat curves exemplifies this. Emphasize that the mathematical singularity is a tool, not the essence. 

  Second, use universality. If different materials share critical exponents, that suggests an underlying physical reality independent of system size. RG reveals that the flow towards fixed points starts at finite scales, meaning the critical behavior is immanent in finite systems. The correlation length divergence is key—when it exceeds the system size, the system "thinks" it's infinite.

  Third, address emergence. Batterman sees it as ontological, but one can argue it's epistemological. The thermodynamic limit simplifies description but doesn't add new physics. Emergence here might be about predictability rather than new entities. RG supports this by showing how macro behavior arises from micro details through coarse-graining.

  Also, consider the user's hint about smuggling idealization. Point out that requiring infinite N is a mathematical convenience to avoid finite-size effects, not a physical necessity. Finite systems approximate the singular behavior so well that for practical purposes, it's real. The core physics—like collective behavior and symmetry breaking—exists in large finite systems.

  Finally, tie in RG flow's role. It explains why finite systems exhibit universal behavior: as they approach criticality, RG trajectories flow towards the same fixed points, making their behavior indistinguishable from infinite systems. Thus, the essence of phase transitions is present in finite systems, with infinity just sharpening the features.
answer: |-
  Here’s the strongest case against the Batterman-style conclusion that phase transitions are *ontologically* emergent solely due to the thermodynamic limit (N→∞). While the mathematical necessity of N→∞ for strict non-analyticity is undeniable, this doesn’t imply ontological emergence "over and above" finite statistical mechanics. The argument conflates **epistemological idealization** with **ontological novelty**. Let’s dismantle it step by step, leveraging universality and RG flow:

  ### 1. **The Core Misstep: Conflating Definition with Ontology**
     - **Batterman’s Premise**: Only N→∞ yields a mathematical singularity (non-analyticity), which is the *sine qua non* of a "genuine" phase transition.
     - **Rebuttal**: This confuses a **formal criterion** (singularity in free energy) with the **physical phenomenon**. Phase transitions are *defined* by observable, discontinuous changes in macroscopic behavior (e.g., spontaneous magnetization, diverging susceptibility). Finite systems exhibit these behaviors *robustly* as N grows large, with divergences becoming arbitrarily sharp. The singularity is a *descriptive tool* for modeling observed physics—not the physical reality itself. Demanding infinite N for "genuine" status is like demanding infinite-precision instruments to "truly" detect a particle: it confuses measurement limits with ontology.

  ### 2. **Universality: The Finite-System Smoking Gun**
     - **The Argument**: Universality shows that critical exponents (e.g., α for specific heat divergence) are identical across wildly different materials (e.g., your magnetic salts, fluids, alloys). These exponents emerge from RG fixed points and are measurable *in finite systems*.
     - **Rebuttal**: 
       - Universality is observed **in labs with finite samples**. Your specific heat curves diverged "sharply" despite finite N. The exponents matched predictions from RG, which *derives* them from finite-N Hamiltonians via coarse-graining.
       - RG reveals that universality arises because microscopic details become irrelevant at large scales—**not because N→∞ creates new physics**. The fixed points governing critical behavior exist *implicitly* in the RG flow of *finite* systems. When ξ (correlation length) exceeds the system size L (i.e., near Tc), the system behaves critically *as if* infinite. The physics is already latent in the finite dynamics.

  ### 3. **Renormalization Group: Emergence Without Ontological Novelty**
     - **RG as a Decoder for Finite Systems**: 
       - RG flow starts from a microscopic Hamiltonian (finite N) and iteratively coarse-grains it, integrating out short-wavelength fluctuations. Fixed points of this flow (e.g., Wilson-Fisher) describe critical behavior.
       - **Crucially**: RG transformations are applied to **finite-N systems**. The flow *predicts* that as N→∞, trajectories converge to fixed points, explaining *why* finite systems exhibit near-singular behavior. The fixed points aren’t "added" by infinity—they are **organizing centers** of the dynamics for large-but-finite N.
       - **Analogy**: Solving Newtonian mechanics for planets assumes point masses, but we don’t claim orbits "emerge" only for mass points. The idealization reveals inherent tendencies of finite objects.

  ### 4. **The Correlation Length Divergence: Physics Before Infinity**
     - Near Tc, ξ → ∞ in the thermodynamic limit. But for finite N, ξ grows until it saturates at ~L (system size).
     - **Key Insight**: When ξ >> a (lattice spacing) but ξ < L, the system *exhibits critical scaling* (e.g., power-law decays). Your experiments saw this as a "lovely divergence." This is **not approximate physics**—it’s the **actual physical response** of a finite system to critical fluctuations. The thermodynamic limit merely removes finite-size rounding, but the *mechanism* (critical fluctuations, scale invariance) is identical.

  ### 5. **Against "Strictly Speaking" Emergence**
     - Batterman claims phase transitions are "over and above" finite SM. But:
       - **No New Laws**: The collective behavior (e.g., magnetization) is fully determined by microscopic spins via the partition function. RG explains *how*—through scale-dependent effective theories.
       - **Predictability**: Critical exponents for finite N near Tc are predicted *exactly* by RG flow from microscopic models. If transitions were ontologically emergent, this predictability would be inexplicable.
       - **Singularity as Diagnostic, Not Cause**: The divergence you measured was driven by spin-spin correlations building up across the sample. The singularity at N→∞ is a consequence of this physical process—not its origin.

  ### 6. **A Thought Experiment: The "Infinite" Lab**
     - Imagine a sample with N = 10²³ spins (a gram of salt). At 0.99 Tc, ξ is ~10⁵ lattice spacings—far larger than any experimental probe. **Is this system "ontologically distinct" from one with N=∞?** No:
       - Its specific heat diverges as C ∝ |T-Tc|⁻α (α>0), measurable to 10 significant digits.
       - Its microscopic state is governed by the same Hamiltonian as the infinite system.
       - RG shows its effective Hamiltonian flows toward the *same fixed point* as N→∞.
     - Demanding N=∞ for a "real" phase transition is like demanding a perfect vacuum to "truly" have electromagnetism. Physical reality operates at finite N, and its behavior converges smoothly to the idealization.

  ### Why Universality and RG Undercut Batterman
  - **Universality** proves that critical behavior is **insensitive to microscopic details**. It depends only on symmetries and dimensionality—properties inherent to finite systems. If phase transitions emerged *only* at N→∞, universality couldn’t manifest in finite labs.
  - **RG** shows that the thermodynamic limit **doesn’t add new physics**; it **reveals** the large-scale consequences of rescaled interactions already present in finite systems. The fixed points exist in the *space of Hamiltonians*—not magically at infinity.

  ### Conclusion: Emergence as Epistemic, Not Ontic
  The need for N→∞ is **pragmatic**, not metaphysical: it avoids finite-size rounding to *isolate* singular behavior. But the phase transition itself—the collective critical phenomenon—is a **direct consequence** of finite-N statistical mechanics, amplified by scale invariance (captured by RG). What emerges is not new ontology, but **simpler effective descriptions** (e.g., scaling laws) valid when ξ >> a. Batterman mistakes a mathematical tool (the singularity) for a physical cause. Your specific heat curves weren’t "approximations"—they were the real thing, governed by the same physics that RG extracts from finite systems. Phase transitions are **immanent** in large-but-finite statistical mechanics, not conjured by infinity.
