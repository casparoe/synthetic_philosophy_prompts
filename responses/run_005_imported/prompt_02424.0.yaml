  For PA: Peano Arithmetic has been stress-tested for over a century. While stronger than PRA, its consistency is supported by multiple proofs in stronger systems, and no serious threats have emerged since Nelson's retracted claim. Maybe 0.001% risk feels right.

  Z2: Second-order arithmetic is significantly stronger, handling sets of numbers. Its consistency strength approaches ZFC minus power set, but still feels more reliable than full set theory. Perhaps 0.01%.

  ZFC: The standard foundation for mathematics. While we know it can't prove its own consistency, decades of intensive use without contradiction suggest high reliability. Still, its power introduces more risk than arithmetic systems - maybe 0.1%.

  Inaccessible cardinal: Adding this large cardinal axiom increases strength but also potential vulnerability. Still, it's considered relatively "safe" among large cardinal axioms. Perhaps 0.2%.

  Measurable cardinal: This is a much stronger large cardinal axiom, venturing further into set-theoretic territory where our intuitions weaken. I'll put it at 0.5% since stronger systems generally have higher inconsistency risks.

  NF: Quine's New Foundations is the odd one out - it uses a very different approach (stratified comprehension) and has known oddities like proving the axiom of choice but being incompatible with infinity in some versions. Its consistency is still debated, so I'll give it 10% as the highest risk.

  The overall pattern should show increasing probability of inconsistency as systems get stronger or more exotic. The explanation will emphasize that strength comes with added risk, and non-standard systems like NF face additional skepticism.
