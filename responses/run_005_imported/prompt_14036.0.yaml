prompt: |-
  so i'm in a schopenhauer seminar this semester and we just got to WWR book 3, section 52 (the music chapter), and i'm stuck on something. earlier in the book he spends ages establishing that the Platonic Ideas are the will's "adequate objectivity" -- basically the closest any representation can get to the will itself. then out of nowhere he says this about music:

  "Thus music is as direct an objectification and copy of the whole will as the world itself, whose multiplied manifestation constitutes the world of individual things. Music is therefore by no means like the other arts, the copy of platonic ideas, but the copy of the will itself. This is why the effect of music is so much more powerful and penetrating than that of the other arts, for they speak only of shadows, but music speaks of the thing itself. I recognize in the deepest tones of harmony, in the bass, the lowest grades of the objectification of will, unorganized nature, the mass of the planet. Bass is in harmony what unorganized nature, the crudest mass, on which all rests, and from which everything originates and develops, is in the world. The definite intervals of the scale are parallel to the definite grades of the objectification of will, the definite species in nature."

  so which is it, are the Ideas the most direct copy of the will or arent they? if music somehow gets even closer to the will than the Ideas do, what does that actually mean, given that music is still something we perceive in time -- so it hasn't fully escaped representation either (he himself says it's still bound by succession even if not by space or causality). also, is there an actual argument anywhere for why the bass specifically has to line up with "unorganized nature" rather than, i dunno, the melody, or is that part just an analogy he liked and never really defended? my TA kind of hand-waved this in section so now i'm asking you lol -- don't just give me the "music expresses the will, not the ideas" summary, i've already got that part, i need the actual mechanics of how this is supposed to work.
