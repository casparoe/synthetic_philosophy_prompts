answer: |-
  ## The Lifeboat Debate: Taurek vs. Scanlon

  **(Setting: A storm-ravaged coast. A RESCUER stands ready, able to launch one lifeboat towards either ROCK A, where ONE STRANGER is stranded, or ROCK B, where FIVE STRANGERS are stranded. A TAUREKIAN and a SCANLONIAN observe.)**

  **Taurekian:** Launch procedure? Simple. Flip a coin. Heads, save the one; tails, save the five. Anything else fails to respect the *separateness* of each person.

  **Scanlonian:** A coin flip? That treats the plight of the five with the same weight as the one. It ignores the fact that saving the five answers *five distinct, equally valid claims* for rescue, while saving the one answers only one.

  **Taurekian:** Precisely! Each claim *is* distinct. The one on Rock A has a claim just as strong and urgent as *each* of the five on Rock B. Why should the mere *fact* that five others happen to be in peril alongside one claimant suddenly make *that* claimant's need *more* morally significant? It doesn't augment the *strength* of any individual claim. A coin flip gives each *person* an equal chance – that's genuine respect.

  **Scanlonian:** Respect requires taking *all* claims seriously in our deliberation. If I choose to save the one, I must justify that to the five: "I decided your lives weren't worth *counting*." Any principle permitting that would be reasonably rejected. A principle requiring saving the greater number *when claims are otherwise equal*, however, gives each claim its due force. It doesn't *sum* welfare; it recognizes that *more individual claims* of *equal strength* remain unmet if we choose the smaller group.

  **Taurekian:** "Counting" *is* your aggregation! You say "more claims," but how do you *decide* without implicitly adding them up? If claims are separate and equal, saving one satisfies one claim, saving five satisfies five. But you don't *compare* one satisfied claim to five satisfied claims – that's the utilitarian calculus we both reject! You just *count* the unsatisfied claims and pick the pile with fewer left hanging? How is tallying unmet claims different from summing the badness of their non-rescue?

  **Scanlonian:** The difference is foundational. Summing welfare asks, "Which option creates more *total good*?" Contractualism asks, "Which principle for action could no one reasonably reject?" A principle allowing a rescuer to ignore numbers when lives are at stake *could reasonably be rejected* by those who lose out because of it. The one couldn't reasonably reject a principle favoring the five in a tie, as they gain no special advantage in the reverse scenario. The coin flip principle *can* be rejected by the five: "You gambled with our lives when you knew saving us was possible without sacrificing anyone else's *stronger* claim."

  **Taurekian:** But the one *could* reject your principle! "Why does my claim, equal in strength to any one of theirs, get utterly dismissed *simply because others are present*? You sacrificed me because of a *fact* about *them*, not about *me* or my claim!" Your tie-breaker *feels* different, but mechanically, you're still letting the number of claimants on one side determine the outcome – which is exactly what aggregating *does*. The coin flip doesn't *ignore* the five; it refuses to let their *number* outweigh the separate, equal claim of the one. It gives each *individual* maximal equal consideration.

  **Scanlonian:** And *your* coin flip ignores the moral force generated by the *conjunction* of multiple, equally valid claims pressing upon the rescuer. It treats the situation as if saving one group or the other leaves the same moral remainder – one life lost. But it doesn't. Saving the one leaves *five* distinct wrongs unaddressed. Saving the five leaves *one*. The rescuer has a stronger reason to prevent *more* equally weighty wrongs from occurring. Counting wrongs prevented isn't summing welfare; it's acknowledging the scope of the obligation generated by multiple individuals in peril.

  **Taurekian:** So, the 'strength' of the reason comes from the *quantity* of identical claims? That sounds suspiciously like aggregation in contractualist clothing. The coin flip *prevents* the quantity from dictating the outcome, ensuring no individual is sacrificed *because* others share their fate. That, to me, is the core of equality.

  **Scanlonian:** And to me, the core is ensuring no one can reasonably say their claim was dismissed *when it could have been decisive* alongside others. The numbers don't outweigh; they reveal which choice leaves the rescuer facing fewer compelling objections from those left behind. We save the five. *(Turns to Rescuer)* Go to Rock B.

  **Taurekian:** *(Shakes head, pulls out a coin)* Then let chance decide fairly. Flip it. Heads for A, tails for B. That's true fairness to persons.

  **(The Rescuer hesitates, looking between the coin and Rock B, as the storm rages.)**
