answer: |-
  Here’s a toast that tackles the stats joke head-on while keeping it warm, funny, and accessible. It runs about 2.5-3 minutes when delivered naturally:

  **(Clink glass, warm smile)**  
  "Friends, family, and those still debating the optimal way to load a dishwasher… Hi, I’m [Your Name], and I’ve had the immense privilege of knowing [Bride] and [Groom] since [college/circumstance]. As many of you know, I work with statistics for a living. And for months, I’ve joked that my toast would start with the sobering fact that, statistically speaking, marriage has about a 40% chance of ending in divorce.

  **(Pause, mock-serious expression)**  
  But here’s the thing: standing here, looking at these two amazing people… I realize that joke isn't just inappropriate, it’s actually *statistically meaningless* for *them*. And since I can’t resist explaining why, bear with me for 30 seconds of very soft-core stats.

  **(Shift to slightly more explanatory, but still conversational tone)**  
  You see, that 40% number? It’s an average. It lumps *everyone* together. But [Bride] and [Groom] aren't 'everyone.' They belong to *lots* of different groups. There’s the group 'All Marriages' (40%). But also 'People Who Met Sophomore Year and Argued Philosophy at 2 AM'? Probably better odds. 'Second Marriages'? Different odds again. 'Couples Who Can Turn Arguing About Dishwasher Loading Techniques Into Flirty Banter'? *(Gesture towards them)* I’d bet my entire TI-84 calculator the odds are *way* better for *that* group.

  **(Lighthearted shrug)**  
  The problem is, there's no cosmic spreadsheet telling me which group is the *right* one to predict *their* future. That’s what we call a 'Reference Class Problem.' Basically, which bucket do you drop them into? And the truth is, there is no perfect bucket. Because they aren't just data points. They’re [Bride] and [Groom].

  **(Pivot to warmth and sincerity)**  
  So, instead of meaningless averages, let’s talk about what actually *predicts* success for *them*, specifically. Let’s talk about the evidence we’ve all witnessed:

  1.  **Resilience:** We’ve seen them navigate [mention a specific, relatable challenge they overcame together - e.g., long distance, career changes, that disastrous camping trip]. They don't just bounce back; they bounce *forward*, together.
  2.  **Communication:** They debate dishwashers fiercely, yes. *(Look at them, smile)* But more importantly, they talk about the *real* stuff – dreams, fears, the important things. They listen. *Really* listen. Even when they disagree, you never doubt their respect for each other.
  3.  **Shared Weirdness:** They have their own unique rhythm. Whether it’s their [mention a specific shared quirky habit - e.g., obscure board game obsession, synchronized bad dancing, elaborate Sunday breakfast rituals], they embrace each other's perfectly imperfect selves. They make each other laugh like no one else can.
  4.  **Unwavering Support:** [Groom], who here hasn’t seen the look on your face when [Bride] walks into a room? And [Bride], the way you champion [Groom]'s [specific passion/project]? You are each other's biggest fans and safest harbor. That’s not average; that’s exceptional.

  **(Raise glass higher)**  
  So, forget the buckets. Forget the averages. The only statistic that matters today is this: Based on the overwhelming evidence of who they are, how they love, and the incredible partnership they’ve already built… the probability of [Bride] and [Groom] having a long, joyful, and deeply fulfilling marriage together is… **(dramatic pause)**… looking pretty darn good from where I’m standing.

  **(Full sincerity)**  
  Here’s to defying the odds, not because the odds are against you, but because you’ve built something stronger than any statistic could measure. Here’s to your unique, wonderful, dishwasher-debating love story. To [Bride] and [Groom]!"

  **(Clink! Applause!)**

  **Why this works:**

  1.  **Acknowledges & Disarms the Joke:** It directly addresses the elephant in the room ("I joked about the 40%") and explains *why* it's flawed, fulfilling your need to not just drop it.
  2.  **Explains "Reference Class" Simply:** Uses relatable, funny examples ("Dishwasher Arguers," "Sophomore Year Philosophers") instead of jargon. The phrase "no perfect bucket" is an intuitive metaphor anyone can grasp. Mentioning "Reference Class Problem" by name satisfies the data-minded without losing others, thanks to the plain-language explanation that follows immediately.
  3.  **Pivots to the Positive:** It doesn't linger on the stats problem. It uses it as a springboard to highlight the couple's *specific* strengths and the *real* predictors of their success, which is the heart of a good toast.
  4.  **Balances Humor & Heart:** The dishwasher gag runs throughout, providing consistent, accessible humor. The stats explanation itself is kept light. The core of the toast is warm, personal, and sincere, celebrating their unique relationship.
  5.  **Universal Appeal:** Relatable examples (dishwashers, shared quirks, overcoming challenges) work for everyone. The data-minded get the clever deconstruction; others get the clear message that "averages don't define *them*."
  6.  **Structure:** Clear opening hook, brief explanation, smooth pivot to heartfelt celebration, strong finish. Fits comfortably in 3 minutes.
  7.  **Ends on a High Note:** The final "probability" line is optimistic and personal, replacing the cold stat with a warm affirmation based on *their* qualities.

  **Delivery Tips:**

  *   **Pace:** Don't rush the stats part. Deliver it conversationally, with pauses for the jokes to land (especially the dishwasher lines).
  *   **Body Language:** Use gestures naturally – miming dishwasher loading, gesturing to the couple when listing their strengths, raising the glass emphatically at the end.
  *   **Eye Contact:** Connect with the couple during the personal parts, and sweep the room during the explanatory/humorous bits.
  *   **Tone:** Keep it warm and affectionate throughout. Even the stats part should feel like you're sharing an "aha!" moment with friends, not lecturing.

  This toast honors your profession, your friendship, and the couple's unique love – all while keeping everyone engaged and smiling. Break a leg!
