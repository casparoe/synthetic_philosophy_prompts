  Scenario 2: same thermos, but force field *absorbs* the impact. Now the microstructure persists unharmed, but the breaking effect is blocked. Classic mask - Lewis still calls it "fragile" because basis persists, matching intuition. 

  Ah, and here's the kicker: if we imagine the force field *melting* the glass upon impact (destroying basis during stimulus), it becomes finkish again. That contrast really shows why persistence matters. 

