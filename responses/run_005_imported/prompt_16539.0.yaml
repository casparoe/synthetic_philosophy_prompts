answer: |-
  The radiator hissed its uneven song in the Princeton study, a counterpoint to the frantic scratching of Kurt Gödel’s pen. Outside, winter twilight bled into the elms. Adele, her face etched with a worry that had become permanent, placed a steaming bowl of broth on the desk beside him, carefully avoiding the precarious towers of notebooks and loose-leaf folios filled with symbols that danced like trapped insects.

  "Kurt, *bitte*. Just a little. You barely touched lunch."

  He flinched, his gaze snapping from the dense logical notation to the bowl. The steam curled, innocent, yet fraught with invisible menace. His eyes, magnified behind thick lenses, darted towards the kitchen door, then back to Adele. His voice, when it came, was a dry whisper. "The butcher... Adele, the butcher. His eyes were... wrong. Shifting. He knows *they* watch me. He could have... contaminated the stock bones."

  Adele closed her eyes for a brief moment, a silent prayer for patience. "Kurt, *Schatzi*, I bought the bones myself, from Schmidt’s, like always. I boiled them for hours. I watched the pot. Only my hands touched it." She reached out, slowly, and placed her own work-roughened hand over his trembling one resting on the paper. "See? Warm. Real. Safe."

  He looked at her hand, then at the complex proof unfolding on the page – a meticulous exploration of set theory, a world of crystalline certainty. His own argument for survival echoed in the hollow space between the symbols. *A rational universe*, he’d written to Mutter just last month, *possesses inherent teleology. Potential seeks actualization. Consider the human intellect – a vast, recursive system capable of infinite development. To extinguish such a system arbitrarily, before its potential is remotely approached, is fundamentally irrational. Ergo, termination is not the terminus. Continuity is logically necessitated.*

  The logic felt impeccable, a gleaming structure built on axioms of cosmic order. The universe wouldn’t be so wasteful, so *pointless*, as to snuff out a mind like his, or Mutter’s, mid-sentence. Development demanded continuation. Q.E.D.

  Yet, here sat the architect of that proof, his skeletal frame barely filling the worn armchair, recoiling from homemade broth. The terror was a physical presence, a cold knot in his gut that no syllogism could unravel. It wasn't irrational *to him*. It was evidence, meticulously cataloged: the suspicious glance of a delivery boy, the odd taste in the milk last Tuesday (surely not his imagination?), the way the shadows in the hallway seemed to solidify when he was alone. *They* wanted him silenced. Poison was the obvious vector. Adele was his sole firewall against the entropy of malice.

  "Do you remember," he said suddenly, his voice gaining a sliver of strength, pulling his hand back to gesture at the paper, "walking with Albert? Those late afternoons?"

  Adele softened. "Of course. Down Mercer Street. You two, heads bent together, talking of stars and numbers. He loved those walks."

  "He said... towards the end... that he came to the Institute mostly for the walk. For the conversation." Gödel’s gaze drifted to the window, seeing not the gathering dusk but the remembered stoop of Einstein’s shoulders, the unruly halo of white hair. "He felt... disconnected. From the new physics. But the structure... the logic of the conversation... that sustained him."

  Gödel fell silent. Einstein was gone. The structure of *their* conversation, a unique, irreplaceable system, was terminated. Had Einstein’s vast potential been actualized? Or was he, somewhere, in some Platonic realm of perfect fields, still working? Gödel’s own argument demanded it. But the silence left behind was a void no logic could fill, only fear could colonize.

  Adele saw the shift, the familiar shadow descending behind his eyes. "Kurt, the broth will get cold. Please. For me." She nudged the bowl closer.

  He looked at it, then at her, his eyes wide with a desperate, childlike need for reassurance warring with absolute conviction. "You... you didn’t leave it unattended? Not even for a moment? When the telephone rang?"

  "Not for a second, Kurt. I swear it on... on the memory of those walks." It was the only oath she knew he might trust.

  Slowly, agonizingly slowly, his hand crept towards the spoon. His fingers, long and pale as bleached twigs, closed around it. He dipped it into the golden liquid, raised it halfway to his lips. The smell of chicken and herbs filled his nostrils. Logic whispered: *Adele prepared it. Adele is your continuity. Sustenance is necessary for development.*

  But fear screamed louder: *A trace element! Undetectable! Slowing the mind, clouding the perfect structures! They are patient. They wait.*

  The spoon trembled violently. A droplet of broth fell, splashing onto his proof, blurring a delicate quantifier. He gasped, a sound like tearing paper, and slammed the spoon down, recoiling as if burned. The bowl wobbled precariously.

  "No! No, Adele, I *smell* it! Arsenic? Or something... subtler? You mustn’t eat it either! Pour it out! Now!" His voice rose, thin and reedy with panic.

  Adele’s shoulders slumped, the familiar weight of defeat settling upon them. Wordlessly, she picked up the bowl and carried it to the kitchen sink. The sound of the broth gurgling down the drain was loud in the silent house. When she returned, he was hunched over his notes again, pen scratching furiously, as if trying to rebuild the rational fortress against the howling void within and without. He didn’t look up.

  *The universe is rational*, he wrote, the letters precise, unwavering. *Potential necessitates continuity. Discontinuity is an ontological error.* The sentence flowed, beautiful, inevitable.

  Outside, the winter wind moaned around the eaves. Inside, the radiator hissed. And Kurt Gödel, the man who proved the necessity of more time, starved amidst the terrifying, irrational abundance of the present moment, his magnificent, terrified mind the only proof he couldn't trust.
