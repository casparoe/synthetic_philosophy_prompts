prompt: |-
  Two of my housemates got into an argument last week that I can't stop turning over. We'd just done a big Costco run for the house, and Jess and Owen were trying to work out the total we owed once a store coupon and the tax got applied, before splitting it four ways -- they're the two people in the house everyone trusts with this kind of math, because historically they're about equally careful, and when they've caught each other's mistakes before it's been about 50/50 which of them was right. This time Jess landed on $312.40 and Owen landed on $318.10, and of course there was no signal in the parking lot to just pull out a calculator app and settle it outright.

  (1) Jess said that since they've been right about equally often over the years, and neither of them has any special reason to think they were the sloppy one this particular time, the rational move for both of them is to stop each insisting on their own total and shift toward thinking it's basically a coin flip which one screwed up -- so they should just split the difference. (2) Owen said no way: he'd walked through his addition twice in his head and each step held up, and once you can actually see that the steps are fine, the bare fact that somebody disagrees isn't itself a reason to doubt steps you can still inspect yourself. (3) Jess replied that "it holds up when I check it" can't be the tiebreaker, because whichever of them actually made the slip would feel exactly as sure their steps held up -- thats just as available to the person who's wrong as to the person who's right. (4) Owen came back with: fine, but then by her own logic she should distrust her "just split the difference" rule too, since hes pretty sure plenty of careful people think you're allowed to stick with reasoning you've personally checked -- so if mere disagreement among careful people is enough to knock down his confidence in some addition, it's enough to knock down her confidence in her own rule, and then she's got nothing left to stand on to tell him to move at all. (5) Jess said that's a neat trick but it proves too much: if it actually worked, nobody could ever rationally be budged by anybody else's disagreement about anything, including him right now, so something has to be wrong with it even if she couldn't say exactly what on the spot.

  Nobody at the table could settle it, and for what it's worth, we still don't actually know whose total was right. Can you go through this move by move instead of just picking an overall winner? Give me a verdict as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), then briefly justify each score, and flag anything about handling disagreements like this that you think both of them are missing.
