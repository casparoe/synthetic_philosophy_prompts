  First, I need to recall Quine's position accurately. He sees moral values as stemming from hedonic responses shaped socially, not grounded in observation like scientific claims. So ethics isn't "naturalized" in the same way. The user knows this but is struggling with the practical implications for their IRB work.

  The user's explicit question is about how taking Quine seriously should affect their IRB duties. But deeper, they might be wrestling with the legitimacy of their role. If moral judgments aren't truth-apt, how can they justify their confident verdicts? There's a possible anxiety about hypocrisy or inconsistency in their professional life.

  I should consider the IRB's function. It's not about discovering moral truths but ensuring compliance with established norms and minimizing harm. Quine's view aligns here—these norms are social constructs. The committee's role is procedural, not ontological. So the implications might be about transparency and the source of their authority.

  Also, the user mentioned students debating if Quine's stance is a metaethical position or dismissal. That ambiguity might feed into their concern. If ethics is just evolved responses, does that undermine the IRB's work? But Quine isn't saying ethics is meaningless; it's different from science. So the IRB can operate within a framework of shared values without claiming objective truth.

  Practical steps: Emphasize procedural rigor over moral realism. Focus on consistency, precedent, and social consensus. Acknowledge that their judgments are based on constructed norms, not empirical facts. This might reduce the pressure to find "right" answers and instead focus on defensible processes.

  Also, the user might need reassurance that their role isn't invalidated. Even without objective moral facts, the IRB serves a crucial function in upholding societal standards. Quine's view doesn't make ethics arbitrary; it's grounded in human experiences and social needs. So the committee's work remains important, just with a different philosophical basis.

  I should also address the weight of their confident verdicts. They can be confident in the process and the consensus, not in absolute truths. Transparency about the normative framework could be key. Maybe the committee should explicitly reference the shared principles they operate under, rather than implying universal truths.

  In summary, the main shifts are: from truth-seeking to procedural adherence, transparency about the constructed nature of norms, and confidence based on social endorsement rather than empirical grounding. This approach maintains the IRB's functionality while aligning with Quine's metaethics.
answer: |-
  That's a fascinating and deeply practical tension – the collision of Quine's metaethical skepticism with the concrete demands of institutional ethics review. Stepping out of the seminar and into the IRB room with Quine's perspective in hand wouldn't necessarily *paralyze* your work, but it would fundamentally reframe *how* you understand and justify that work. Here’s what likely follows, focusing on implications for practice and the weight of your judgments:

  1.  **From "Discovering Truth" to "Navigating Norms & Consequences":**
      *   **Quine's View:** Moral judgments aren't discoveries of objective, empirically verifiable facts like "electron charge is negative." They are sophisticated, socially-conditioned extensions of basic aversions and attractions, codified into norms.
      *   **IRB Implication:** Your role shifts from *applying* objective ethical truths to *applying and negotiating* a complex, historically-evolved set of **socially constructed norms** designed to mitigate harm and promote certain values (autonomy, beneficence, justice). The focus moves decisively to:
          *   **Consistency:** Applying the *existing* regulatory framework (Common Rule, Belmont principles, institutional policies) rigorously and predictably. Your "rightness" is about fidelity to the system.
          *   **Consequence Prediction:** Rigorously analyzing *likely outcomes* – physical/psychological harm, privacy breaches, coercion risks, societal impact. These *are* empirically tractable (to a degree) through risk assessment, psychology, sociology.
          *   **Procedural Fairness:** Ensuring processes are transparent, inclusive, and give researchers/subjects a fair hearing. *How* you decide becomes as crucial as *what* you decide.
      *   **Weight of Judgment:** Your confidence stems not from accessing a moral "reality," but from thorough analysis, adherence to procedure, and careful consideration of foreseeable impacts within the normative framework. Confidence is in the *process*, not in the ontological status of the verdict.

  2.  **De-emphasizing Moral Intuition, Emphasizing Functional Analysis:**
      *   **Quine's View:** The "gut feeling" that something is "just wrong" is the residue of that social conditioning, not a reliable epistemic signal about a moral fact.
      *   **IRB Implication:** While intuitions might flag issues for closer scrutiny, they shouldn't be the *primary justification*. You need to articulate *why* something feels wrong in terms of:
          *   **Violation of Established Norms:** Does it contravene Belmont? Informed consent standards? Privacy laws?
          *   **Predictable Negative Consequences:** What specific, likely harm (physical, psychological, social, reputational) is inadequately mitigated?
          *   **Procedural Deficiencies:** Is the consent process unclear? Is risk minimization insufficient?
      *   **Weight of Judgment:** Putting less weight on unanalyzed intuition forces more rigorous, transparent justification. Confidence comes from demonstrable *reasons* grounded in norms and predicted outcomes, not the strength of the feeling.

  3.  **Transparency about the Source of Authority:**
      *   **Quine's View:** The authority of ethics comes from social consensus and institutional power, not from correspondence to an independent moral reality.
      *   **IRB Implication:** Be upfront that the committee's authority derives from **delegated institutional power** and **mandated adherence to federal/institutional regulations**. Your judgments are binding because the university/society has vested the IRB with that power to enforce its chosen norms, not because you possess special moral insight.
      *   **Weight of Judgment:** This grounds your confidence in the legitimacy of the *institution* and its rules, not in personal moral infallibility. It can make delivering difficult verdicts less personally burdensome ("We are applying the rules as written") but also requires humility ("This is the system's requirement, even if I personally feel uneasy").

  4.  **Focus on "Adequacy" within the System, not Ultimate "Rightness":**
      *   **Quine's View:** There's no external empirical standard (like an "observation sentence") to definitively prove an ethical claim "true."
      *   **IRB Implication:** Shift language and mindset. Instead of searching for the "ethically correct" answer in some absolute sense, focus on whether a proposal meets the **defined threshold of adequacy** within the regulatory and normative framework:
          *   "Is the consent process *adequate* to ensure comprehension and voluntariness?"
          *   "Are the risks minimized *adequately* and are they *reasonable* in relation to the knowledge gained?"
          *   "Does the selection process *adequately* ensure justice/fairness?"
      *   **Weight of Judgment:** Confidence is justified if the proposal demonstrably meets the established criteria. You're not declaring eternal moral truth; you're certifying compliance with the current operational standards.

  5.  **Heightened Awareness of Contingency and Potential for Change:**
      *   **Quine's View:** Ethical norms are contingent products of evolution and social history.
      *   **IRB Implication:** Recognize that the norms you enforce (e.g., specific consent requirements, risk thresholds) are not immutable. They evolve based on societal values, technological change, and historical experience (like Tuskegee). This encourages:
          *   **Openness to Revisiting Standards:** Being willing to discuss whether existing norms are still fit for purpose.
          *   **Context Sensitivity:** Understanding that "adequacy" might look different for a clinical trial vs. an anthropology ethnography, while still respecting core principles.
          *   **Humility:** Acknowledging that today's confident verdict might be seen differently in the future as norms evolve.
      *   **Weight of Judgment:** Confidence is always provisional, tied to the *current* normative framework and state of knowledge about consequences. It doesn't claim timeless validity.

  **What *Shouldn't* Necessarily Change & The Practical Bottom Line:**

  *   **The Need for Diligence:** Scrutinizing protocols, demanding clear justifications, ensuring risks are minimized, and protecting subjects remains paramount. Quine doesn't make this *less* important; it just changes the *reason* it's important (preventing tangible harm and upholding socially agreed-upon standards, not accessing moral truth).
  *   **The Need for Decisiveness:** The IRB *must* render verdicts. Quine's view doesn't entail endless metaethical deliberation in the meeting room. The practical necessity of regulating research demands action based on the best application of the existing norms and risk analysis.
  *   **The Value of the Enterprise:** Protecting human subjects from harm and exploitation is a vital social good, regardless of its ultimate metaethical foundation. The IRB serves a crucial function.

  **In essence, taking Quine seriously means shifting your IRB work from a quest for moral truth to a sophisticated exercise in applied social norm enforcement and risk management.** Your "confident sounding verdicts" are justified not by accessing a moral reality, but by:

  1.  **Rigorous application** of the established regulatory and ethical framework.
  2.  **Thorough empirical analysis** of foreseeable risks and benefits.
  3.  **Meticulous adherence** to fair and transparent procedures.
  4.  **Clear articulation** of the reasons grounded in norms and consequences.

  The weight of your judgment comes from the quality of this process and its grounding in socially-sanctioned norms designed to prevent harm, not from the illusion of accessing transcendent moral facts. It demands more rigor in justification and less reliance on intuition, while still allowing (indeed, requiring) you to perform the vital function of the IRB with conviction based on the system's own standards. It replaces metaphysical confidence with procedural and consequentialist confidence.
