prompt: |-
  Okay so this is kind of a random ask but I got picked as one of the three student speakers for graduation and I really want to build my speech around something we did in my philosophy elective this year, instead of the usual "reach for the stars" speech every single speaker does. We spent like two weeks on weakness of will and it kinda broke my brain in a good way. My teacher started with Socrates in the Protagoras basically arguing that akrasia (acting against your own better judgment) doesn't actually exist -- if you really and truly knew something was bad for you in the moment you just wouldn't do it, so what looks like "weakness" is actually just messing up the math on how much a far-away pleasure or pain is worth compared to one that's close up. Then we did Aristotle's response in the Nicomachean Ethics, book 7, where he says no, akrasia is totally real, it's this weird in-between state where you technically "have" the knowledge but aren't using it right then, kind of like how a drunk or sleeping person can still spit out geometry proofs or (I think?) lines of Empedocles without any of it actually being active in their head. Completely seperately, my AP Psych teacher went on this whole tangent about hyperbolic discounting, basically how people's discount curve for future stuff isn't a smooth exponential, it's hyperbolic, which is why you can KNOW finals are in two weeks and still not study tonight -- the near reward just gets weighted insanely higher then it should be. I was telling my friend Dana, who's also in philosophy club, that senioritis is basically a live demo of both ideas happening at once, and now I can't unsee it.

  Can you write me the actual graduation speech (like 4-ish minutes, so maybe 600-700 words) that uses this for real instead of just name-dropping it? The hard part is the audience is split: half the gym is going to be parents, little siblings, and relatives who've never heard the word "akrasia" in their life and will tune out at the first Greek name, but the other half is my philosophy teacher and a handful of philosophy club kids in the front rows who will absolutely clock it if I get Socrates and Aristotle backwards or use "hyperbolic discounting" wrong. So it needs to work as a normal, warm, occasionally funny graduation speech on the surface, while still being accurate enough underneath that it holds up if someone picks it apart afterward. And please don't let it end on "so just work harder" or "believe in yourselves," because that's literally the naive view the whole unit argues against -- I want the actual hopeful ending to be more about precommitment, like tying yourself to the mast on purpose because willpower alone clearly isn't enough, since that seems like the real takeaway of the unit as far as I can tell.
