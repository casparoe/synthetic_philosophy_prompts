  - **Practical Focus**: Grounds reasoning in institutional mission and harm reduction.  
  - **Policy-Ready**: Framed as a standing rule for future cases.  
  - **Balanced Tone**: Avoids disparaging dissent; acknowledges tragedy in either outcome.
