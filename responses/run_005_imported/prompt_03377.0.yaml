  Hmm, their core concern is subtle but important: they're accusing expressivists of a bait-and-switch where "inconsistency" in moral arguments gets redefined as a clash in attitudes (Blackburn) or hyperplan violations (Gibbard) rather than formal logical structure. That's a legit metaethical worry—one I recall Schroeder and Dreier have hammered. 

