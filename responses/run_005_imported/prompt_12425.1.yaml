  The regress problem is particularly tricky. The initial defection relies on claims about later moves that are never played. A question could highlight this tension, with a follow-up about whether this makes BI self-undermining.

  For experimental findings, I should frame this as a challenge to normative claims. If BI is rationally required but humans consistently fail, is it really about rationality? The follow-up could ask whether idealized models lose explanatory power when they diverge from actual behavior.

  I also consider adding questions about:
