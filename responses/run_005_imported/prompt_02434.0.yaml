answer: |-
  You're absolutely right to push back – your friend has Douglass's constitutional evolution **backwards**. Here's the breakdown with key dates and evidence:

  1.  **The 1852 "Fourth of July" Speech: What It *Actually* Says About the Constitution**
      *   **Core Argument:** Douglass delivers a scathing indictment of American hypocrisy. He contrasts the ideals of liberty and justice enshrined in the Declaration of Independence and the celebrations of July 4th with the brutal reality of slavery.
      *   **Focus on Interpretation & Practice, Not (Primarily) Text:** While condemning the *government* and *nation* for upholding slavery, Douglass is careful to distinguish the *founders' intentions* from the *current pro-slavery interpretation and enforcement* of the Constitution.
      *   **Key Quotes & Nuance:**
          *   "**Take the Constitution according to its plain reading, and I defy the presentation of a single pro-slavery clause in it.** On the other hand, it will be found to contain principles and purposes, entirely hostile to the existence of slavery." (This is a *direct challenge* to Garrison's view, even in 1852).
          *   "**But it is answered in reply to all this, that precisely what I have now denounced is, in fact, guaranteed and sanctioned by the Constitution of the United States; that the right to hold and to hunt slaves is a part of that Constitution framed by the illustrious Fathers of this Republic.**" (Here he *states* the pro-slavery argument *in order to refute it*).
          *   "**Then, I dare to affirm, notwithstanding all I have said before, your fathers stooped, basely stooped 'To palter with us in a double sense: And keep the word of promise to the ear, But break it to the heart.'**" (He accuses the founders of hypocrisy and double-dealing, implying they compromised with slavery *despite* the document's principles, not *because* the document mandated it).
          *   "**The Constitution is a GLORIOUS LIBERTY DOCUMENT. Read its preamble, consider its purposes. Is slavery among them?**" (Another direct assertion of the document's anti-slavery potential).
      *   **Conclusion on the 1852 Speech:** Douglass **vehemently rejects the *nation's* pro-slavery actions and the *government's* pro-slavery interpretation of the Constitution.** He argues that the **Constitution's text, read plainly, does not support slavery** and contains principles hostile to it. He accuses the *founders* of hypocrisy and compromise, but **explicitly denies the Constitution itself is a pro-slavery covenant.** This is *not* Garrison's "covenant with death and hell" position.

  2.  **When and Why Douglass's View "Changed"**
      *   **The Shift Happened *BEFORE* 1852, Not Later:**
          *   **1847-1851:** This is the critical period. Douglass, after returning from Britain and starting his own newspaper *The North Star*, began seriously questioning Garrisonian orthodoxy, particularly disunionism and the "pro-slavery Constitution" dogma.
          *   **Key Influences:**
              *   **Gerrit Smith:** The wealthy abolitionist and political activist convinced Douglass that the Constitution could and should be used as a weapon against slavery through political action (voting, supporting anti-slavery parties).
              *   **Lysander Spooner & William Goodell:** Abolitionist legal theorists who argued forcefully that the Constitution, interpreted correctly through its preamble and fundamental principles of liberty, was an anti-slavery document. Spooner's "The Unconstitutionality of Slavery" (1845) was particularly influential.
              *   **Practical Politics:** Douglass saw the limitations of Garrisonian moral suasion alone. He believed engaging with the political system (e.g., supporting the Free Soil Party) was necessary, and this required a constitutional framework that allowed for anti-slavery action.
          *   **The Break:**
              *   **May 1851:** At the annual meeting of the American Anti-Slavery Society in Syracuse, NY, Douglass **publicly announced his break with Garrison on the Constitution**, declaring it was *not* a pro-slavery document. This caused a major rift in the movement.
              *   **"Change of Opinion Announced" (1851):** Douglass published this letter explicitly outlining his new view: "I hold that the Federal Government was never, in its essence, anything but an anti-slavery government... Abolish slavery tomorrow, and not a sentence or syllable of the Constitution need be altered."

  3.  **The 1852 Speech in Context**
      *   Given the break happened in **1851**, the **1852** "Fourth of July" speech **reflects Douglass's *new* position**. His fiery condemnation is directed at the *nation's betrayal* of its founding principles and its *pro-slavery interpretation and enforcement* of the Constitution, *not* at the document itself being inherently pro-slavery. The quotes above prove he was already advocating the "secretly anti-slavery" interpretation *by 1852*.

  4.  **Later Life: Consistency, Not Mellowing**
      *   Douglass **did not** change his fundamental view on the Constitution *again* later in life. He **consistently maintained the position he adopted in 1851**.
      *   His later years saw him become more integrated into the political establishment (as a Marshal, Recorder of Deeds, Minister to Haiti). He emphasized the *potential* of the Constitution and the *progress* made (Emancipation, Amendments) to argue for further reform (civil rights, suffrage, anti-lynching).
      *   This wasn't a "mellower, more patriotic phase" abandoning his radical critique. It was a **strategic application of the constitutional interpretation he had held since 1851** to fight ongoing injustice within the system. He remained a fierce critic of American racism and inequality until his death.

  **Conclusion:**

  *   **Your Friend is Mistaken:** Douglass's "Fourth of July" speech (1852) **does not** endorse Garrison's "covenant with death" view. Instead, it **explicitly argues the Constitution's text is not pro-slavery** and condemns the government for pro-slavery interpretations.
  *   **The Change Happened Earlier:** Douglass broke with Garrison and adopted the "anti-slavery Constitution" view **in 1851**, *before* the famous speech.
  *   **The Speech Reflects the New View:** The 1852 speech is a powerful application of his *new* constitutional interpretation to critique the nation's hypocrisy.
  *   **Later Life = Consistency:** His later emphasis on the Constitution's potential flowed naturally from the position he adopted in 1851; it wasn't a new mellowing or conversion.

  **Why the Confusion?** The 1852 speech is so brilliantly scathing about American hypocrisy that people sometimes conflate his anger at the nation's *actions* with a blanket condemnation of the *founding documents*. He masterfully separates the ideals from the betrayal. Garrisonians at the time certainly attacked Douglass for his "defection" on the Constitution, highlighting how significant and clear his 1851 break was.

  You can confidently tell your friend that Douglass's journey was: Garrisonian (early 1840s) -> Break & Adoption of Anti-Slavery Constitution View (1851) -> Consistent Advocacy of that view, including in the 1852 speech and throughout his later career. The "secretly anti-slavery" interpretation was his *mature and enduring* position, not a late-life softening.
