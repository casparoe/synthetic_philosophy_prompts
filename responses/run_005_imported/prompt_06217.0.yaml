  The biggest risk is the academic part alienating family, so metaphors like "map" vs. "journey" or "recipe" vs. "meal" can make it relatable. And absolutely no hedging—phrases like "obviously brilliant choice" or "wise leap" reinforce support. 

  For the insider joke, maybe something about "if this were a vampire transformation, we'd all be concerned" but softened with "thankfully it's just marriage." That’s recognizable without being obscure. 

