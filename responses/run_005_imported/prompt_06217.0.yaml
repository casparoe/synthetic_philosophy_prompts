  First, I need to distill Paul's key ideas into everyday language. Instead of "epistemically transformative," I can talk about not being able to preview the experience. The vampire example is iconic but might be too weird for a wedding, so I'll focus on the core concept: leaping into the unknown because the act of choosing to find out is itself rational. 

  For humor that insiders will get, I can include a subtle nod, like a joke about "calculating the utility of shared chores" or something that sounds like a nerdy reference but lands as a light-hearted wedding observation. The toast needs to pivot quickly from the theoretical setup to heartfelt celebration—maybe using "you" statements directed at the couple to make it personal. 

