answer: |-
  Here is a sophisticated argument defending causation by omission, directly challenging skeptical assumptions while avoiding retreat to "positive surrogates." The core strategy is to expose the skeptic's unargued metaphysical commitments and demonstrate that counterfactual symmetry *should* hold, placing the burden of proof squarely on the skeptic to justify their asymmetry:

  **The Argument for Genuine Causation by Omission:**

  1.  **The Counterfactual Symmetry Premise:** Our best *analysis* of causation (e.g., Lewisian counterfactual dependence) applies symmetrically to both positive events (e.g., the lifeguard jumping in) and omissions (e.g., the lifeguard failing to notice). For outcome Y (drowning):
      *   Positive Cause: Had positive event X *not* occurred (lifeguard didn't jump in), Y *would* have occurred (drowning). (Counterfactual dependence holds).
      *   Omission Cause: Had the omission *not* occurred (i.e., had the positive event occurred - lifeguard *did* notice), Y *would not* have occurred (no drowning). (Counterfactual dependence holds).
      *   **Conclusion 1:** At the level of causal *analysis* (difference-making), omissions satisfy the core condition just as robustly as positive events.

  2.  **The Skeptic's Unargued Asymmetry Assumption:** The skeptic accepts the counterfactual analysis for positive events but denies it for omissions *despite* the symmetry. This denial requires an *additional* metaphysical constraint on what can be a genuine cause. Common, often implicit, constraints include:
      *   **The Ontological Constraint:** Only *positive existents* (events, states of affairs, processes involving energy/momentum transfer) can be causes. Omissions are absences, non-existents, and therefore lack the requisite ontological status.
      *   **The Event Constraint:** Causes must be *events*, understood as concrete occurrences or changes in the world. Omissions are not events; they are the *lack* of an event.
      *   **The Productive Causation Constraint:** Genuine causation requires a productive, "oomphy" connection (e.g., energy transfer, physical pushing). Omissions cannot "produce" anything; they are inert absences.

  3.  **Challenging the Skeptic's Assumptions:**
      *   **Against the Ontological Constraint:** Why must causes be "positive existents"? This assumes a metaphysics where absences cannot be real features of the world or enter into causal relations. However:
          *   *Negative Facts are Real:* Our descriptions of the world constantly and indispensably rely on true negative propositions ("There is no water in the glass," "The circuit is open," "The guard is absent"). Dismissing these as non-factual or non-existential is an arbitrary restriction on ontology. The truth of the counterfactual ("If the lifeguard *had* noticed...") depends on the *fact* of the omission.
          *   *Causation as Difference-Making:* If causation is fundamentally about *what makes a difference* to the outcome (as the counterfactual analysis captures), then the ontological nature of the difference-maker (positive or negative) is irrelevant. The omission demonstrably makes the difference.
          *   **Burden of Proof:** The skeptic must justify *why* ontology restricts causation to positives *without* begging the question against omissions. Simply asserting "absences aren't real" is insufficient; it ignores the functional role absences play in explanation and prediction.
      *   **Against the Event Constraint:** Why must causes be "events" narrowly conceived as positive occurrences?
          *   *Broadening "Event":* We routinely include negative states or non-occurrences in our causal explanations ("The *lack* of rain *caused* the famine," "The *failure* of the brake *caused* the crash"). Insisting on a definition of "event" that excludes omissions is stipulative and misaligns with causal discourse.
          *   *Causes as Facts/States of Affairs:* If we understand the relata of causation as *facts* or *states of affairs* (which can be negative: "that the lifeguard did not notice," "that the circuit is open"), the symmetry is restored. The counterfactual dependence holds between states of affairs.
          *   **Burden of Proof:** The skeptic must justify why a restrictive definition of "event" that excludes omissions is necessary or superior for a theory of causation, especially when it forces the counterintuitive rejection of clear cases of difference-making.
      *   **Against the Productive Causation Constraint:** Why must causation be inherently "productive"?
          *   *Productivity is Not Necessary:* Many widely accepted causes don't involve literal "pushing" or energy transfer (e.g., gravitational attraction acting at a distance in Newtonian physics, the presence of a hole causing a fall, a veto causing a bill to fail, a price signal causing a market shift). Insisting on a narrow mechanistic model ignores diverse causal structures.
          *   *Omissions Enable/Disable:* Omissions often function causally by *allowing* or *preventing* processes. The lifeguard's omission *allowed* the drowning process to continue unimpeded. This enabling/disabling role is a genuine causal function captured by counterfactuals but obscured by a purely productive model.
          *   **Burden of Proof:** The skeptic must justify why *only* productive causation is genuine, especially when a broader difference-making view offers a more unified account encompassing both positive interventions and preventions/allowances.

  4.  **The Problem of Spurious Omissions & Context:** The skeptic often raises the "absurd causes" objection (e.g., the absence of a lifeguard on Mars also satisfies the counterfactual: if a lifeguard *had* been on Mars, would the drowning have been prevented? Unlikely). However, this is a problem for *all* counterfactual theories, not omissions specifically.
      *   *Resolution Requires Context:* Fixing spurious causes requires incorporating *relevance* and *normal conditions* into the counterfactual analysis (e.g., Lewis's "causation as influence," Schaffer's "contrastive causation," or Mackie's INUS conditions). Crucially, **this contextualization applies equally to positive causes and omissions.** We don't blame the lifeguard on Mars because their presence isn't *relevant* or *expected* in the context. We *do* blame the assigned lifeguard because their intervention *was* relevant and expected. The problem is one of refining the counterfactual analysis, not a unique flaw of omissions.

  5.  **Conclusion (Genuine Causation by Omission):** The counterfactual dependence of an outcome on an omission is robust and symmetric to its dependence on positive events. The skeptic's rejection of omissions rests on undefended and questionable metaphysical assumptions about ontology, the nature of events, and the necessity of productive "oomph." These assumptions are neither necessary for a workable theory of causation nor reflective of successful causal reasoning in science, law, and everyday life. Therefore, absent a compelling justification for the asymmetry, we should accept that omissions can be genuine causes. They are not merely shorthand for positive factors; they are the *absence itself* that makes the critical difference in the causal nexus, captured accurately by the counterfactual dependence relation.

  **Key Philosophical Commitments Underpinning This Argument:**

  *   **Primacy of Difference-Making:** Causation is fundamentally about what makes a difference to whether the effect occurs. Ontology and mechanism are secondary.
  *   **Liberal Ontology of Facts/States of Affairs:** Negative facts/states of affairs (absences, failures, lacks) are genuine features of the world that can be causally relevant.
  *   **Rejection of Narrow Physicalism:** Causation isn't restricted to physical pushes and pulls; it encompasses higher-level relations like enabling, preventing, and allowing, where omissions play a central role.
  *   **Contextual Counterfactualism:** The solution to spurious causes (for both positives and omissions) lies in refining the counterfactual analysis with context (contrasts, norms, expectations), not in rejecting an entire category of difference-makers.

  This argument forces the skeptic to either defend their restrictive metaphysical assumptions head-on (which are far less intuitive and harder to defend than the symmetry premise) or accept that counterfactual dependence, properly contextualized, suffices for genuine causation – including causation by omission. It shows that skepticism often stems from an unexamined physicalist or event-based bias rather than a flaw inherent in omissions themselves.
