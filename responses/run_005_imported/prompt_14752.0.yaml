  First, I need to ensure the distinction between compromise and moral trade is clear. Compromise implies both give up something, but here, each values the other's concession more. That's crucial. The toast should highlight that Priya values Daniel's vegetarianism more than her own donations, and vice versa. 

  The audience includes some who know Toby Ord's term "moral trade," so a subtle nod like "as the academics call it" would work. But the majority just want warmth and humor. Balancing insider recognition without alienating others is key. Maybe use a light-hearted analogy, like "relationship hack" or "win-win," to keep it accessible.

  Structure-wise, start with a hook about their meeting—arguing about cause prioritization. Then transition into their arrangement, explaining it as a trade. Add humor by contrasting typical couple arguments with theirs. For example, fighting over dishes vs. animal suffering vs. poverty. 

  Include the moral trade concept clearly but concisely. Emphasize that each believes the other's action matters more, making it a deeper connection. Then, tie this to their relationship: trust, respect, shared values. End with a toast that celebrates their unique bond and future together.

  Check timing: five minutes is about 500-700 words. Keep stories brief, focus on the key points. Avoid jargon; use simple terms. Humor can come from exaggerated examples or playful language ("upgraded their firmware"). Ensure the closing is heartfelt, wishing them continued growth and happiness. 

  Potential pitfalls: Over-explaining the philosophy. Need to keep it light. Also, ensuring both Priya and Daniel are portrayed equally, without taking sides. Highlight their mutual respect. 

  Finally, end with a toast that encapsulates their journey—from debate to partnership, showing how their differences strengthen their union. Make it uplifting and memorable.
answer: |-
  ## The Win-Win Wedding Toast

  (Lifts glass, warm smile) Friends, family, fellow reason-lovers... gather 'round! We're here to celebrate Priya and Daniel. Two brilliant minds, two huge hearts, and... let's be honest... two people who met arguing about *how best to save the world* at a rationalist meetup. Classic meet-cute, right? Forget eyes meeting across a crowded room; theirs met across a crowded whiteboard covered in cost-effectiveness calculations!

  Most couples, you know their classic arguments: "You left the dishes!" "Whose turn is it to take out the trash?" Priya and Daniel? Their early debates sounded more like: "But the sheer *scale* of animal suffering!" countered swiftly with "Yes, but the *urgency* of lifting people *now*!" Passionate? Absolutely. Stubborn? Well... *looks meaningfully at the couple*... let's just say "conviction" is a shared value!

  But here’s the truly beautiful thing – and where so many people get it wrong when they hear about their arrangement. This wasn't about one of them winning the argument. It wasn't even about meeting in the middle, finding some lukewarm compromise neither truly loved. No. What Priya and Daniel did was far more elegant, far more profound, and frankly, far more *them*.

  They engineered a... **relationship hack**. A brilliant, mutual upgrade. Years ago, they struck a deal. Priya, champion of alleviating farmed animal suffering, decided to donate significantly *more* than she ever would have to Daniel's beloved poverty charities. And Daniel, advocate for lifting people from extreme poverty, took on a vegetarian pledge he freely admits he’d never have embraced on his own.

  Now, the *magic* isn't just that they did this. The magic is *why* it works. Priya doesn't see her extra donations as a painful concession; she sees Daniel choosing compassion on his plate every single day, and *that* matters more to her heart than the specific destination of those extra dollars. And Daniel? That vegetarian pledge isn't a burden he grits his teeth through; he sees Priya redirecting substantial resources towards *his* deepest cause, and *that* commitment means more to him than any steak ever could. **It’s not compromise; it’s a beautiful, ongoing exchange where each values what the other gives *more* than what they themselves are "giving up."** (A knowing glance to the rationalist contingent - *they'll get the "moral trade" nod*). Let's just say, they figured out how to optimize for mutual appreciation!

  And *that*, everyone, is the real love story here. It’s not just about finding someone who shares your passions, but finding someone who respects yours so deeply that they’re willing to move their own needle – significantly – to honour what matters to *you*. It’s about building a partnership where supporting the other’s values *becomes* a core value itself. It requires incredible trust, deep respect, and a shared understanding that the world is complex, but caring about it fiercely together is simple.

  So, Priya and Daniel: You took a debate about cause prioritization and turned it into a masterclass in collaborative prioritization. You looked at your differences not as obstacles, but as opportunities to build something stronger, kinder, and far more impactful than either of you could have alone. You didn't flatten your convictions; you *amplified* your compassion through each other.

  We raise our glasses to the farm animals who unknowingly benefited from Daniel’s plate, to the families lifted up by Priya’s extra generosity, and most of all, to the two of you. May your life together continue to be a testament to the power of loving deeply, thinking critically, and trading *up* – always trading up – in kindness, respect, and shared purpose.

  To Priya and Daniel! May your arguments always be fascinating, your trades always be moral, and your love forever be this brilliantly, wonderfully, *uncompromisingly* strong! Cheers!

  **Key elements addressed:**

  1.  **Moral Trade vs. Compromise:** Explicitly stated ("not compromise... beautiful, ongoing exchange"), explained the core mechanism (each values the *other's* action more), and contrasted it with meeting in the middle.
  2.  **Toby Ord Nod:** The line "It’s not compromise; it’s a beautiful, ongoing exchange where each values what the other gives *more* than what they themselves are 'giving up'" is the direct, subtle reference. The phrase "moral trade" is *not* spoken, but the definition is clearly stated. The knowing glance and the phrase "Let's just say, they figured out how to optimize for mutual appreciation!" signals to the in-the-know crowd without derailing the toast for others.
  3.  **Warmth & Humor:** Opens with a light, relatable joke about their meeting. Uses accessible terms like "relationship hack," "mutual upgrade," "optimize." The contrast between typical couple arguments and theirs ("dishes vs. animal suffering") is funny. The tone throughout is affectionate and celebratory.
  4.  **Toast Structure:** Classic structure: Hook (celebrating them), Anecdote (how they met/argued), The Core Point (their arrangement explained *correctly*), The Meaning (why it shows their love/strength), The Wish (for their future), The Actual Toast ("To Priya and Daniel!").
  5.  **Five-Minute Target:** This script, delivered at a natural, warm pace with pauses for laughter/applause, fits comfortably within 5 minutes.
  6.  **Landing as a Toast:** Ends with a clear, heartfelt call to raise glasses ("To Priya and Daniel!") and a warm, positive final wish ("Cheers!"). The focus remains on celebrating *them* and their love, using the moral trade as the unique lens through which to view it.
