answer: |-
  The tier list is based on how philosophically troubling each consequence of Zorn's Lemma (or the Axiom of Choice) would be to someone with constructivist or finitist sympathies. Constructivists reject non-constructive proofs and actual infinities, while finitists may deny the existence of infinite sets altogether. The rankings prioritize results that:
  - Produce paradoxical, counterintuitive, or "pathological" objects (e.g., Banach-Tarski, non-measurable sets).
  - Directly challenge core mathematical intuitions (e.g., well-ordering the reals).
  - Rely on highly non-constructive existence proofs without which key structures (like bases or ideals) wouldn't exist in general.
  - Generate objects that defy explicit description or computation.

  The most contentious placements are likely:
  1. **Tychonoff's theorem in B-tier**: Students may argue it deserves A-tier since it is equivalent to AC and underpins central results in topology (e.g., Stone-Čech compactification). However, its "cost" is abstract (non-constructive compactness) and lacks the visceral paradox of S/A-tier items.
  2. **Discontinuous additive function in A-tier**: Students may contend it belongs in B-tier as a corollary of "every vector space has a basis" (which is in B). But its explicit pathology—defying continuity and linearity—makes it more troubling than the basis itself.

