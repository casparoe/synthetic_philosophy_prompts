  2. **Every field has an algebraic closure**: The existence of an algebraic closure can be proven without full AC in some cases (e.g., countable fields) but in general requires choice. The closure is not unique and cannot be constructed in general. This is non-constructive.

  3. **The Banach-Tarski paradox**: This is a very counterintuitive result (doubling the ball by decomposition and reassembly). It directly violates the principle that measure should be preserved under rigid motions. This is often considered one of the most troubling consequences.

  4. **There exists a Lebesgue non-measurable set of reals**: The existence of non-measurable sets is already non-constructive (as they cannot be explicitly described). It challenges the idea that every set of reals should have a well-defined length. This is troubling.

