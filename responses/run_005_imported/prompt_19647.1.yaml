  Hmm, the challenge here is avoiding determinism tropes. The user explicitly wants the tension Molinism creates—that choices are "settled facts" about a person *before* they happen. The horror isn’t forced fate but realizing your choices are pre-written... by *you*. Like reading your own recipe book before cooking.  

