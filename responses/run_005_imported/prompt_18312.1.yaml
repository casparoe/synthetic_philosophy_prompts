prompt: |-
  so i've been reading about the Allais paradox (the classic 'guaranteed $1 million vs a risky gamble for more' problem) as the go-to example of people violating the independence axiom in expected utility theory. but every explanation i can find uses that same money-and-percentages setup. could you invent a totally different example -- no cash, no lotteries -- where peoples preferences would flip in that same paradoxical way, and explain in a couple sentences why it actually still counts as breaking the independence axiom and not just people being random/inconsistent?
