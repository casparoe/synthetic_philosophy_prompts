  so in my philosophy of mind seminar we just spent like two whole classes on the Lucas-Penrose argument -- the one where Godel's incompleteness theorem supposedly shows that human mathematicians can "see" that a formal system is consistent even though the system can't prove it's own consistency from inside, and therefore minds can't just be Turing machines. we went through the usual back-and-forth (which Godel sentence exactly, do we even know that we ourselves are consistent, etc), but at the end of the last session my professor mentioned almost as a throwaway comment that a lot of theoretical computer scientists think this whole debate is kind of missing the point, because it's fought entirely in terms of computability (can a mind/machine do this at all, given unlimited time and memory) rather than computational complexity (how much time and memory it would actually take). apparently there's a whole other tradition, associated with people like Scott Aaronson, that reframes questions about minds, machines, and creativity in terms of stuff like P vs NP instead of Godel sentences.

  there wasn't a reading assigned for that part so i'm kind of stuck piecing it together myself. could you compare the Godel/Lucas-Penrose style argument against computationalism with the computational-complexity-theoretic take on the same debate? i dont just want "one uses Godel, one uses P vs NP" as an answer -- i want to know where they actually disagree: do they rest on different hidden assumptions, is one basically a special case of the other, does bringing in complexity theory defuse the Godel argument or just relocate the same worry somewhere else? and if you had to bet, which of the two actually poses the more serious problem for the claim that minds are computers (if either does) -- justify whichever answer you give.
