  Benatar's responses from his "Still Better Never to Have Been" might help. He argues that the supporting asymmetries are intuitive and that their conjunction points to a deeper principle. Also, he distinguishes between person-affecting and impersonal harms. 

  For the first horn, the strongest version is that each supporting asymmetry implicitly assumes the axiological asymmetry. For example, the duty not to create suffering people might assume that existence brings harm. Benatar could counter that these are pre-theoretical intuitions, not derived from his theory. He might say that the patterns across these asymmetries reveal a consistent ethical structure that only makes sense with his asymmetry. 

