prompt: |-
  I'm a philosophy professor at a small college, which is apparently why I ended up as the resident philosopher on our Academic Integrity Committee, and something landed on our docket this week that I think is more interesting than my colleagues realize. A student in a colleague's course submitted an essay after running three sentences through Grammarly's "AI rewrite" feature to smooth out some clunky phrasing; she disclosed this herself when asked directly, which everyone agrees should count in her favor. The syllabus states that students "may not use AI to generate any part of the submitted work," full stop, with no further definition given anywhere. About half the committee thinks any AI touching the words counts as a violation, since Grammarly is, after all, an AI; the other half thinks "generate" obviously means composing from nothing, so a light rewrite is no different then spell-check always was. We've had a run of easy cases this term -- whole essays pasted straight from ChatGPT -- so this is the first one that's actually split the room down the middle.

  Someone proposed we just redraft the rule to be more precise before spring term, and I said that probably wouldn't fix much, which did not go over well at 4pm on a Tuesday. What's bugging me is that this doesn't feel like ordinary vagueness, a fuzzy sorites-style boundary case -- it feels more like there's no fact of the matter, in either the rule's wording or whatever the drafting subcommittee had in mind last year, that settles this particular case one way rather than the other. It's the plus/quus problem wearing a school ID badge. I tried this line on my officemate and got a blank stare, so you're getting it instead: could you draft the memo I need to circulate before next Wednesday's meeting? I need it to (a) recommend a specific, defensible ruling on this actual student's case, (b) say what, if anything, the committee should do differently going forward given that no amount of redrafting can fully close a gap like this one, and (c) take seriously, rather than wave away, the fairness worry that it's unjust to sanction a student for crossing a line that nobody who wrote the policy can honestly say was really there in advance.
reasoning: |-
  Okay, let me start by unpacking the philosophy professor's request. They're on an Academic Integrity Committee facing a tricky case where a student used Grammarly's AI rewrite feature on three sentences. The key issue is interpreting the policy that prohibits using AI to "generate any part of the submitted work." The committee is split between a strict interpretation (any AI touch violates) and a lenient one (only generating from scratch counts). 

  First, I need to recognize the core philosophical tension here. The professor mentioned it's not just vagueness but a "plus/quus" problem—referencing Kripke's rule-following paradox. That means the ambiguity isn't about unclear boundaries but about whether the rule even applies to this new scenario. The policy drafters didn't anticipate Grammarly-style tools, so there's no original intent to guide them. 

  The fairness concern is critical. Sanctioning the student for crossing an undefined line feels unjust. The student's disclosure should factor in too—it shows good faith. For the ruling, I'm leaning toward no violation. Why? Because "generate" implies creation ex nihilo, and Grammarly's rewrite is an editing tool. Plus, penalizing this would be like punishing spell-check use retroactively. 

  For future-proofing, I'm thinking the committee needs to shift from rigid rules to principles-based guidance. No policy can cover every tech edge case. Instead, define core values (like intellectual autonomy) and provide clear examples. Also, separate "assistive tools" (editing) from "generative tools" (ChatGPT). 

  The memo should validate both committee perspectives but show why this case falls outside reasonable enforcement. Highlight that the student reasonably interpreted "generate" as full creation, not editing. And stress that revising the policy won't prevent future ambiguities—they need adaptable frameworks, not just tighter wording. 

  Hmm, should I address the 4pm Tuesday frustration? Probably not directly, but I'll keep the tone collegial. The professor wants academic rigor without pedantry, so I'll avoid jargon while honoring the philosophical depth they see. 

  Final structure: 
  - Ruling: No violation, based on reasonable interpretation + disclosure 
  - Future approach: Principles + examples + tech-specific guidelines 
  - Philosophy: Acknowledge rule-following paradox but emphasize fairness in application
answer: |-
  ## MEMORANDUM  
  **TO:** Academic Integrity Committee  
  **FROM:** Dr. [Your Name], Philosophy Department  
  **DATE:** [Current Date]  
  **SUBJECT:** Ruling Recommendation & Policy Framework for Student Case #AI-2023-11 (Grammarly Rewrite)  

  ### I. Ruling Recommendation: No Violation in This Case  
  **The student should not be sanctioned.** Rationale:  

  1.  **"Generate" Implies Substantive Creation, Not Editing:**  
      *   The core prohibition is against using AI to "**generate** any part of the submitted work." The ordinary meaning of "generate" in academic contexts (especially when contrasted with "assist" or "edit") strongly implies *creating original content from scratch* (e.g., ChatGPT drafting whole paragraphs).  
      *   Using an AI-powered tool to *rewrite three existing student-authored sentences* for improved fluency falls squarely under **editing and refinement**, akin to using a sophisticated grammar checker, thesaurus, or even receiving stylistic suggestions from a writing center tutor. The student's intellectual labor created the core ideas and structure; the AI merely polished the surface expression.

  2.  **Reasonable Interpretation Favors the Student:**  
      *   The policy provides no definition of "generate" or "use AI," nor examples. It is reasonable for a student to interpret "generate" as meaning "create from nothing," not "lightly edit my own words." Punishing a student for an interpretation that falls within the range of reasonable understanding is fundamentally unfair, especially given the lack of explicit guidance.

  3.  **Good Faith Disclosure:**  
      *   The student disclosed the usage voluntarily when asked. This demonstrates honesty and a lack of intent to deceive, aligning with the *spirit* of academic integrity even if the *letter* of a poorly defined rule is contested. Sanctioning her would discourage future candor.

  4.  **Precedent & Proportionality:**  
      *   Contrasting this with "whole essays pasted from ChatGPT" highlights the stark difference in severity and intent. Applying the same violation label to both trivializes serious misconduct and imposes disproportionate consequences for a minor act of editing assistance.

  **Recommendation:** Dismiss the case against the student with a note of appreciation for her disclosure. Advise the instructor to clarify expectations regarding editing tools in future syllabi.

  ### II. Addressing the "No Fact of the Matter" & Fairness  
  You are correct: this isn't *merely* a borderline case of vagueness (like "how many grains make a heap?"). It's a **Kripkean Rule-Following Paradox in action** (the "plus/quus" problem).  

  *   **The Core Issue:** The drafters of the policy *could not have had determinate intentions* regarding every conceivable future technology. "AI to generate" was likely conceived in the context of nascent tools like ChatGPT (full composition), not sophisticated editing aids like Grammarly Pro. **There is no "fact of the matter" about whether their unexpressed, hypothetical intention encompassed this specific use case.**  
  *   **The Fairness Imperative:** Sanctioning a student requires demonstrating they *knew or reasonably should have known* their action violated a clear standard. Where the rule's applicability is genuinely indeterminate *ex ante* (as it is here, between "generation" and "assistance"), sanctioning the student **is unjust**. It punishes them for failing to intuit a distinction the policy itself failed to make, violating principles of due process and fairness fundamental to academic justice. We cannot hold students accountable for reading minds or predicting committee interpretations of ambiguous terms.  

  ### III. Moving Forward: Principles Over (Just) Precision  
  Redrafting the rule with more words *might* help temporarily, but it cannot eliminate indeterminacy. New tools and novel use cases *will* emerge. Our goal should be a **robust, adaptable framework**, not an unattainably "perfect" rule.  

  1.  **Adopt a Principles-Based Definition:**  
      *   **Core Principle:** The submitted work must reflect the **student's own intellectual conception, analysis, and authorial voice**.  
      *   **Revised Policy Suggestion:**  
          > "Students are prohibited from using artificial intelligence (AI) tools to **substantively generate or compose core academic content** they submit as their own work. This includes, but is not limited to, generating arguments, thesis statements, original analysis, or complete sentences/paragraphs that form the backbone of an assignment.  
          > **Permitted uses** include AI tools used for **editing, grammar checking, spelling correction, basic syntax improvement, or generating feedback on clarity** *provided the core intellectual content and expression remain demonstrably the student's own work.* When in doubt, students must disclose the nature and extent of AI tool usage."  

  2.  **Focus on "Intellectual Labor" & Disclosure:**  
      *   Shift the emphasis from the *tool* to the *nature of the work done by the tool* and the *student's responsibility* for the final product. Did the tool create the core ideas/arguments (prohibited)? Or did it assist the student in expressing their own ideas more effectively (permitted with disclosure)?  
      *   **Mandate Disclosure:** Require students to disclose *any* AI tool use beyond basic spell/grammar check built into standard word processors. This fosters transparency and allows instructors to assess the *extent* and *nature* of the use in context.

  3.  **Provide Concrete, Evolving Examples:**  
      *   Publish and regularly update an "AI Use Guidelines" appendix with concrete examples:
          *   **Permitted:** "Using Grammarly Premium's 'rewrite for conciseness' on 2 sentences you wrote." / "Using ChatGPT to identify confusing passages in your draft."
          *   **Prohibited:** "Using ChatGPT to write your thesis statement or introductory paragraph." / "Using Sudowrite to generate entire paragraphs of analysis."
          *   **Requires Disclosure & Context:** "Using Claude to significantly restructure a paragraph you initially wrote." / "Using an AI tool to suggest alternative phrasings for complex technical jargon."
      *   Acknowledge that examples will need periodic revision as technology evolves.

  4.  **Context Matters:**  
      *   Recognize that appropriate use may vary by assignment type (e.g., a creative writing exercise vs. a formal logic proof). Encourage instructors to clarify expectations specific to their assignments within the overall framework.

  5.  **Focus Committee Deliberations:**  
      *   Future cases should center on:  
          (a) The **nature and extent** of the AI tool's contribution relative to the student's own intellectual labor.  
          (b) The **student's understanding and intent** (including disclosure).  
          (c) Whether the use **violated the core principle** of the student's ownership of the intellectual content and voice.

  ### Conclusion
  The current case hinges on an ambiguity in the policy that renders its application to AI-assisted editing genuinely indeterminate. Sanctioning the student would be unjust. We recommend dismissal.  

  Moving forward, we cannot legislate away all ambiguity. Instead, we must build a framework centered on **intellectual labor, authorial voice, and transparency**. By defining our core principle ("student's own work"), distinguishing between *generation* and *assistance*, mandating disclosure, and providing contextual examples, we create a system that is **fairer to students, more resilient to technological change, and better aligned with the fundamental goals of academic integrity** than any attempt to write a single, exhaustive, "gap-free" rule. This approach embraces the inherent challenge of rule-following in a changing world while providing clearer, fairer guidance.  

  I recommend we adopt this principles-based framework for the spring term syllabus guidelines and develop the supporting examples document. Let's discuss and refine this approach at Wednesday's meeting.  

  **Attached:** Draft Revised Policy Language & Examples Framework (Optional - for discussion).
