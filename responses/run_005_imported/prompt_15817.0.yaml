answer: |-
  You're wrestling with a deeply ethical question that reveals your integrity—it's clear you care about both your mother's trust and your own honesty. Let's break this down:

  **1. Your promise was genuine *at the moment*:**  
  You sincerely believed your words when you spoke them. Your mother's trust in your current attentiveness wasn't misplaced. Feeling genuine care *now* doesn't guarantee future endurance, but it doesn't make your initial intention dishonest. Promises about an uncertain future are inherently vulnerable to changing circumstances and human limitations.

  **2. Foreseeing future temptation ≠ current dishonesty:**  
  Acknowledging that future exhaustion might tempt you to backtrack is a sign of self-awareness, not deceit. In fact, **your discomfort about this possibility proves your present sincerity**. A truly manipulative person wouldn't question their motives—they'd only see the house as a done deal.

  **3. The deeper issue: "Genuine intention" vs. "Unconditional guarantee":**  
  - **Genuine intention** means you *aim* to care for her, barring unforeseen impossibilities (e.g., severe illness on your part).  
  - **Unconditional guarantee** would mean committing to care regardless of any future reality—which is unrealistic and unwise.  

  You promised the *intention*, not an infallible outcome. Life’s complexities may require adaptations (e.g., hiring help, exploring assisted living). That doesn’t negate your commitment.

  **4. The risk of the house transfer:**  
  Your mother’s act assumes continued trust. If you later abandon her after receiving the house, it would retroactively *feel* like betrayal to her—even if your initial words were sincere. This is the vulnerability in her choice.

  **What to do now (ethically and practically):**

  | **Action** | **Why It Matters** |
  |------------|-------------------|
  | **Discuss contingencies with your mother** | Say: *"Mom, I meant my promise. But I worry about what if I get sick, or if caring for you requires skills I don't have? Can we discuss backup plans together?"* This honors her trust while acknowledging reality. |
  | **Formalize a care plan** | Research options: home health aides, respite care, community resources. Commit *now* to funding these with the house's value if needed. This shows your promise includes ensuring her care—even if not solely by you. |
  | **Reframe the house's purpose** | View the house not as *payment* for future care, but as a resource *for her well-being*. Use its value (e.g., renting part of it) to fund her care if necessary. |
  | **Regularly check your commitment** | Ask yourself: *"Am I avoiding conversations about her future needs? Am I resenting her dependence?"* Proactive honesty prevents future betrayal. |

  **Your key moral obligation isn't to be a martyr—it's to ensure she's cared for with the resources available.** If the day comes when full-time care by you is unsustainable, finding quality alternatives *is* keeping your promise. What would break trust is abandoning her without a plan.

  **Final thought:** Your worry reflects a good heart. Honor your mother—and yourself—by planning wisely now. True integrity lies in adapting responsibly when circumstances change, not in clinging to an impossible ideal.
