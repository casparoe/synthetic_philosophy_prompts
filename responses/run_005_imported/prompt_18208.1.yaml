  We are discussing Simpson's paradox, where an association between two variables reverses when we stratify by a third variable. The common advice is to trust the within-group (stratified) result because the pooled association might be confounded. However, this is not always the right approach.

  The key is to understand the causal relationships. We distinguish between a **confounding variable** and a **mediating variable**:

  - A **confounder** is a variable that causes both the treatment and the outcome. If we do not adjust for a confounder, we get a biased estimate of the causal effect.
  - A **mediator** is a variable that is on the causal path between the treatment and the outcome. Adjusting for a mediator blocks part of the causal effect and can introduce bias.

  In the context of Simpson's paradox, if the third variable is a confounder, then we should stratify by it to get the true causal effect. But if the third variable is a mediator, then stratifying by it would be a mistake because it blocks the direct effect of the treatment on the outcome.

