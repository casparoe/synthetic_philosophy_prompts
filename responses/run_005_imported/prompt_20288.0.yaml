prompt: |-
  Okay so I had this whole arguement with my friend Sam last night about causation (we'd both had a few, in our defense) and it ended with him pulling up Hume on his phone to "win," except I'm not convinced it actually proves his point. This is the bit, from the Enquiry, section VII:

  "We may define a cause to be an object followed by another, and where all the objects, similar to the first, are followed by objects similar to the second. Or, in other words, where, if the first object had not been, the second never had existed."

  Sams read: these are just two ways of saying the same thing, Hume restating himself for emphasis. My read: they're actually two separate definitions (a regularity one and a counterfactual one) that can come apart, and Hume just waved his hand over the gap with "or in other words." Can you help me settle this properly - are they equivalent, and if not, walk me through an actual case where one holds and the other doesn't?

  And here's the part I really want help with: isn't this basically the exact fork where Lewis's counterfactual theory and the Woodward/Pearl interventionist stuff split off from each other, decades later? Like did Hume accidentally pack both future theories into one sentence, and is interventionism specifically trying to fix whatever's broken in the "if the first object had not been" half? I went into the arguement only knowing "Hume = constant conjunction guy" and now I want the actual mechanics, not just the sound-bite version.
