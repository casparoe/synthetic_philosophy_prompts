prompt: |-
  Okay so I've been in a reading group with some other phil PhD students working through the "intertheoretic comparisons" chapters of MacAskill and co's stuff on moral uncertainty -- basically, if you've got credence spread across utilitarianism and some deontological view, how do you even compare how much each theory "wants" a given action, given that they don't obviously share a unit of value? A friend of mine in the econ department heard me describe this and immediately said it sounded exactly like the interpersonal comparison of utility problem from social choice theory -- the thing that shows up in Harsanyi's aggregation theorem and in the whole literature following Arrow's impossibility result about whether interpersonal comparability is what you'd need to escape it. Turns out MacAskill is totally aware of this and even borrows voting-theoretic tools (variance voting, Borda-ish methods) to try to make intertheoretic comparisons work, which only made me more curious about how far the analogy really goes.

  So here's what I keep getting stuck on: is "comparing choiceworthiness across moral theories under uncertainty" and "comparing utility across persons for social choice" the same problem wearing different clothes -- so that an Arrow-style impossibility result should worry moral uncertainty people just as much as it worries social choice theorists -- or is there a principled disanalogy somewhere that lets one be tractable while the other isn't? My best guess at a disanalogy is that persons at least plausibly share a common currency of wellbeing even where it's unmeasurable, wheras rival moral theories might not even agree that a common currency of "choiceworthiness" exists in the first place (a Kantian's notion of a constraint violation doesn't obviously live on the same scale as a utilitarian's aggregate welfare, even in principle). But I'm honestly not sure that holds up under pressure. Could you actually dig into this and tell me whether fixes like variance normalization (or just retreating to "my favourite theory") are doing real philosophical work, or just quietly smuggling in an answer to the hard version of the question?
reasoning: |-
  Okay, let me unpack this user's query. They're part of a reading group focusing on moral uncertainty, particularly intertheoretic comparisons in MacAskill's work. Their econ friend pointed out the similarity to interpersonal utility comparisons in social choice theory. The user is wondering if these are essentially the same problem, and if Arrow-style impossibility results apply to moral uncertainty too. They also question whether fixes like variance normalization are legitimate or just avoiding the hard questions.

  First, I need to recall the core issues in both areas. In social choice, aggregating individual utilities into a social welfare function faces problems with interpersonal comparisons. Arrow's theorem shows that without such comparisons, no aggregation method satisfies all reasonable criteria. Harsanyi's utilitarianism requires cardinal unit comparability. But for moral uncertainty, the challenge is comparing "choiceworthiness" across different moral theories, like utilitarianism and deontology. The user's analogy is strong because both involve aggregating incommensurable values.

  The user suggests a disanalogy: people might share a common wellbeing currency, but moral theories might not. That's a good point. Theories like Kantian deontology and utilitarianism operate on fundamentally different scales—duties versus welfare maximization. But even in social choice, the existence of a common utility metric is contested. So maybe the disanalogy isn't as clear-cut.

  MacAskill's approaches like variance normalization or Borda counts attempt to create comparability. Variance normalization scales theories so their choiceworthiness has the same variance, treating them as comparable after scaling. But is this methodologically sound? The user suspects these methods might be smuggling in answers. For example, variance normalization assumes that the spread of choiceworthiness should be equal, which might not be neutral between theories. A theory with narrow variance gets amplified, potentially favoring more permissive theories.

  The deeper issue here is meta-normative. If moral theories are incommensurable, any aggregation might be impossible. But if we're under moral uncertainty, we need a decision procedure. The user is right to question whether these technical fixes address the philosophical problem or just bypass it. 

  Also, Arrow's theorem conditions like unrestricted domain might not directly apply to moral theories. Moral theories might not propose complete orderings over all options, especially in deontology with constraints. However, MacAskill's variance voting requires cardinal representations, which deontological theories might resist. This points to a potential disanalogy: moral theories might not provide the necessary inputs for aggregation methods, unlike individuals in social choice who can express preferences.

  The user's concern about "smuggling in" solutions is valid. Normalization methods impose a structure that theories themselves don't endorse. For instance, scaling a deontological theory's constraints to match a utilitarian scale assumes comparability where none exists. This could lead to distortions, like making minor constraint violations appear comparable to significant welfare changes.

  On the other hand, retreating to "my favorite theory" avoids aggregation but seems arbitrary under uncertainty. The user might be seeking a principled middle ground. Perhaps acknowledging the limitations of current methods is necessary, while still attempting the best possible aggregation under uncertainty. 

  In conclusion, the analogy holds in many structural aspects, making Arrow-style concerns relevant. However, the incommensurability between theories might be deeper than between individuals, challenging the feasibility of aggregation. The technical fixes are pragmatic but may not fully resolve the philosophical issue. The user's insight about common currency is crucial—without a meta-framework, these methods risk being ad hoc.
answer: |-
  That's an exceptionally sharp question cutting straight to the nerve center of both moral uncertainty and social choice theory. You're absolutely right about the structural analogy, and MacAskill (alongside colleagues like Toby Ord and Will MacAskill) explicitly leverages tools from social choice (variance voting, Borda, etc.) precisely *because* they recognize the parallel. However, whether the analogy holds completely – dragging Arrow-style impossibilities into moral uncertainty – and whether the proposed "fixes" are legitimate, hinges on deep philosophical and methodological distinctions. Let's break it down:

  **The Core Analogy: Structure is Strikingly Similar**

  1.  **Aggregation Problem:**
      *   **Social Choice:** Aggregate diverse individual preferences/utilities (U₁, U₂, ..., Uₙ) into a single social preference/choice (S).
      *   **Moral Uncertainty:** Aggregate diverse "theory preferences" (T₁(choiceworthiness), T₂(choiceworthiness), ..., Tₙ(choiceworthiness)) weighted by credence (c₁, c₂, ..., cₙ) into a single decision under uncertainty (A).

  2.  **Incommensurability/Non-Comparability:**
      *   **Social Choice:** Arrow's impossibility assumes only *ordinal*, *non-comparable* individual utilities. We can't say "Alice's utility gain from X is twice Bob's loss." This lack of cardinal interpersonal comparability is key to the impossibility.
      *   **Moral Uncertainty:** Theories operate with fundamentally different notions of "choiceworthiness." Utilitarianism uses utils (cardinal, ratio-scale?), deontology uses duty-fulfillment/violation (often ordinal or with incommensurable thresholds), virtue ethics uses eudaimonia, etc. Crucially, there is no *theory-independent* unit of "moral value" to translate between them. A "unit of Kantian duty-satisfaction" is *prima facie* incomparable to a "unit of aggregate welfare."

  3.  **Need for Comparability:**
      *   **Social Choice:** Harsanyi's Aggregation Theorem shows that *if* cardinal, interpersonally comparable utilities exist, then utilitarianism (summing utilities) is the only rational aggregation rule satisfying certain axioms.
      *   **Moral Uncertainty:** To maximize "expected choiceworthiness" (EC) across theories, you *need* a way to compare the *magnitude* of choiceworthiness assigned by different theories to different options. `EC(A) = Σ [cᵢ * Choiceworthinessᵢ(A)]` requires `Choiceworthinessᵢ(A)` to be expressed on some common scale.

  **Where the Analogy Might Break Down: Potential Disanalogies**

  1.  **Your Proposed Disanalogy (Common Currency):** This hits the nail on the head, but needs refinement.
      *   **Social Choice:** While controversial, there *is* a plausible argument (especially following Harsanyi, and grounded in empathy or shared human psychology) that individual utilities, while private, *refer to a similar underlying phenomenon* (well-being, preference satisfaction) and *could in principle* be compared *if* we had perfect information. The problem is often framed as *epistemic* (we can't measure it perfectly) rather than *metaphysical* (it doesn't exist). Arrow assumes non-comparability as a methodological starting point, not necessarily a metaphysical truth.
      *   **Moral Uncertainty:** The disanalogy is potentially **deeper and more metaphysical**. Rival moral theories often posit fundamentally *different kinds* of normative properties. A utilitarian's "utility" and a Kantian's "duty-satisfaction" might not just be different currencies; they might be claims about fundamentally *different normative facts* inhabiting *different domains of value*. There might be *no fact of the matter* about how many utils equal one unit of duty-satisfaction, *even in principle*. The problem isn't just epistemic (we can't measure it); it might be that the scales *do not share a common dimension*.

  2.  **The Nature of the Aggregator:**
      *   **Social Choice:** The social planner is an *external* agent imposing an aggregation rule *on* the individuals.
      *   **Moral Uncertainty:** The agent *is* the aggregator. They are trying to decide *for themselves* what to do, given their *own* internal credences over theories. This introduces a different perspective:
          *   **Subjectivity of Scale:** The agent might have subjective views about how to *interpret* and *compare* the outputs of the theories they give credence to. (E.g., "While Kantianism doesn't give numbers, I subjectively feel that violating a perfect duty is roughly equivalent to causing a large utility loss.")
          *   **Meta-Normative Commitment:** The decision rule itself (e.g., maximize EC) is a *meta-normative* commitment held by the agent. They are *committing* to the *meaning* of "choiceworthiness under uncertainty" involving this aggregation, even if the first-order theories don't endorse it.

  3.  **Input Requirements & Domain:**
      *   **Social Choice (Arrow):** Requires complete ordinal preference profiles over *all* possible social states from *all* individuals. Unrestricted Domain is a key condition.
      *   **Moral Uncertainty:** Theories may not provide complete cardinal (or even complete ordinal) rankings over *all* possible actions. Deontological theories might only specify forbidden/permissible/supererogatory, with gaps. The agent often only needs a comparison for the *specific options* available in a decision context. This makes methods like variance normalization applied to the *current options* more feasible, even if incomplete.

  **Evaluating the "Fixes": Are They Smuggling or Working?**

  1.  **Variance Normalization (MacAskill's MVP - Maximize Expected Choiceworthiness with Variance Voting):**
      *   **The Method:** Scale each theory's choiceworthiness function so that the *variance* of choiceworthiness over the options in the current decision context is equal (e.g., variance = 1). Then calculate EC using these normalized scales.
      *   **The Philosophical Work:** This is explicitly a **pragmatic convention**, not a claim about metaphysical comparability. It says: "To make EC meaningful, we need scales that are 'spread out' comparably. Variance is a common statistical measure of spread. We'll standardize that spread." It *imposes* comparability of *range*.
      *   **Is it Smuggling?** **Yes, but arguably necessarily and transparently so.** It *is* imposing a structure the theories themselves don't provide. However:
          *   It avoids arbitrary "favorite theory" dominance.
          *   It reflects a minimal kind of sensitivity to the *relative importance* each theory assigns to differences *within* the current choice set. A theory with high variance cares a lot about the differences between options in this context; normalization ensures this intensity matters.
          *   It's context-dependent (applies only to the options at hand), mitigating the "complete ordering" problem.
      *   **The Worry:** It *can* distort meaning. Normalizing the variance of a theory with very *narrow* intrinsic choiceworthiness differences (e.g., a strict deontology where only one option is permissible and the rest are equally forbidden) *inflates* those small differences artificially. It forces all theories to "shout equally loudly" in the current context, even if one theory intrinsically "whispers".

  2.  **Borda Count / Range Voting:**
      *   **The Method:** Rank options ordinally according to each theory. Assign points based on rank position (Borda) or normalize the best option to 1, worst to 0 (Range Voting). Calculate EC using these normalized scores.
      *   **The Philosophical Work:** This reduces everything to *ordinal* comparisons *within* each theory and *normalizes the range* across theories. It focuses purely on *relative standing* within the theory's own ranking for the current options.
      *   **Is it Smuggling?** **Yes, and more coarsely than variance normalization.** It discards cardinal information *within* a theory (if it exists, like in utilitarianism) and imposes a linear scale based solely on ordinal rank or position between best/worst. It treats moving from rank 3 to 2 identically in importance to moving from rank 2 to 1 for all theories, which is unlikely to be true.

  3.  **My Favorite Theory (MFT):**
      *   **The Method:** If your credence in theory T is above 50% (or you just pick your highest-credence theory), do what T says. Ignore other theories.
      *   **The Philosophical Work:** Completely sidesteps the comparability problem by refusing to aggregate.
      *   **Is it Smuggling?** **No, it's surrender.** It's not smuggling comparability; it's declaring comparability impossible or irrelevant for decision-making beyond picking the most probable winner. It avoids Arrow-like aggregation problems by not aggregating.
      *   **The Worry:** It seems irrational to completely ignore significant credences in other theories (e.g., 45% credence in a theory demanding a radically different action). It violates a basic intuition about taking *all* your moral views seriously under uncertainty.

  **Conclusion: Arrow's Shadow and the Limits of Pragmatism**

  1.  **The Analogy is Profoundly Instructive:** Arrow's theorem *should* worry moral uncertainty theorists. It demonstrates the deep difficulties of aggregating fundamentally incommensurable normative perspectives without imposing structure. The core problem of non-comparability is structurally identical.
  2.  **The Disanalogy is Significant (and Favors Moral Uncertainty being *Harder*):** The potential *metaphysical* incommensurability between moral theories is arguably deeper than the *epistemic* non-comparability often assumed in the baseline social choice model. While Harsanyi offers a path *if* comparability holds, the "if" is a much bigger leap for moral theories than for individual utilities (where shared phenomenology of wellbeing offers *some* grounding).
  3.  **The "Fixes" are Necessary Pragmatism, Not Philosophical Solutions:** Methods like variance normalization or Borda are **procedural conventions, not discoveries of a hidden common currency.** They are tools an agent committed to the meta-norm of maximizing expected choiceworthiness *adopts* to make that concept operational *despite* the lack of intrinsic comparability. They *do* "smuggle in" structure.
      *   **Are they doing "real philosophical work"?** Yes, but *at the meta-level*. They are defining what it *means*, *operationally*, for the agent to "take their moral uncertainty seriously" in a way that respects the relative strength of their credences and the relative intensity each theory assigns to the choices at hand. They provide a *decision procedure* under profound normative uncertainty.
      *   **Are they answering the hard question?** **No.** The hard question is: "Is there a fact of the matter about how Kantian duty units compare to utilitarian utils?" These methods *bypass* that question. They say: "Given that we likely *cannot* answer that hard question, here is a coherent and non-arbitrary (or less arbitrary) way to make decisions under uncertainty that respects the *structure* of the theories you believe might be true."
  4.  **The Tension Remains:** The success of these methods depends heavily on the plausibility of the *meta-normative* commitment to maximizing EC and the acceptability of the normalization convention chosen. Critics (e.g., some Kantians) might argue that EC maximization itself fundamentally misunderstands the nature of their theory's demands. Proponents argue it's the best we can do under uncertainty, avoiding the paralysis of MFT or the arbitrariness of unnormalized aggregation. The Arrow-like shadow reminds us that perfect, assumption-free aggregation is impossible, forcing us to be explicit about the necessary conventions we adopt.
