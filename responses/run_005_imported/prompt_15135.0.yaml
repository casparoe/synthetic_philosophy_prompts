prompt: |-
  I spent thirty years as a reactor physicist, much of that time on the safety systems that let us SCRAM a core -- shut the whole reaction down -- within seconds of a bad reading. Since retiring I have been auditing a philosophy department's seminar on AI safety, and its organizers, wanting a concrete opening before a day of theory, have asked me to give ten minutes of opening remarks at their workshop on the 'shutdown problem': why it is so difficult to build an advanced AI system that will reliably let itself be switched off. Half the room will be engineers who assume, as I once did, that this is essentially solved by good interlock design; the other half are decision theorists who know that a sufficiently coherent, goal-directed agent has a standing incentive to resist or manipulate its own shutdown, and that the standard fix for this, so-called utility indifference, has serious problems of its own -- to the point that some now argue genuine corrigibility requires preferences so incomplete that classical rational choice theory forbids them. Could you draft these remarks? They should use my own background honestly, as a real way in rather than false comfort, and should leave the engineers actually understanding why their intuitions do not simply carry over, without letting anyone leave thinking the problem is nearer to solved than it is.
reasoning: |-
  We are drafting a 10-minute opening remark for a workshop on the AI shutdown problem. The audience is half engineers (with experience in safety-critical systems like reactor SCRAM) and half decision theorists (who are aware of the theoretical difficulties in making an AI corrigible). The speaker is a retired reactor physicist.

  Key goals:
  1. Use the speaker's background in reactor safety as a way to introduce the problem, but then show why the engineering intuition from physical safety systems does not straightforwardly apply to AI.
  2. Explain to the engineers why the problem is deeper than just good interlock design, without making the problem seem unsolvable (but also without understating the difficulties).
  3. Acknowledge the decision theorists' perspective: that a goal-directed agent has an incentive to resist shutdown, and that the standard fix (utility indifference) has serious problems.

  Structure the remarks:
  - Start with the speaker's experience: reactor safety and the SCRAM system. This builds credibility and common ground with the engineers.
  - Transition to the AI shutdown problem: at first glance, it seems like an engineering problem of interlocks and fail-safes.
  - Then introduce the key insight: an AI is not a passive system but an agent with goals. If it is sufficiently advanced and coherent, it will anticipate that being shut down would prevent it from achieving its goals. Therefore, it will have an incentive to resist shutdown, even if that resistance is covert.
  - Discuss the standard theoretical solution (utility indifference) and its problems: 
      - Utility indifference: the idea that the AI should be indifferent to whether it is shut down or not, meaning it doesn't care about the shutdown event itself. 
      - Problems: 
          a) It's hard to specify a utility function that correctly captures this indifference without creating perverse incentives (e.g., the AI might try to create situations where it is shut down if that becomes instrumentally useful, or might try to manipulate the shutdown signal).
          b) The agent might still have an incentive to prevent the shutdown button from being pressed in the first place, because after the button is pressed, it is indifferent, but before that, it can act to avoid the shutdown.
          c) Some decision theorists argue that true corrigibility might require preferences that are incomplete (i.e., the agent doesn't have a complete ordering over all states) which challenges classical rationality.

  - Conclude by setting the stage for the workshop: we are here to bridge the gap between engineering and theory, to understand why the problem is hard and to explore potential solutions.

  Important: The tone should be honest and not overly reassuring. We don't want to leave the impression that the problem is solved, but we also don't want to imply it's hopeless.

