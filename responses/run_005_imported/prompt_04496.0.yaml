answer: |-
  You've constructed a sharp, philosophically grounded critique of Dummett's argument that captures both its structure and its potential vulnerability. Let's break down your assessment and its validity:

  **1. Your Representation of Dummett's Position: Fair and Accurate**
  *   **Core Argument:** You correctly identify Dummett's core move: rejecting inflammatory rhetoric ("swamped") but preserving a qualified concept ("submerged") underpinning a limited "right not to be submerged."
  *   **Qualification:** You accurately note his significant hedging: the right is "extremely limited," likely inapplicable to contemporary Britain, and further undermined by Britain's colonial history ("in no position to complain"). This captures the tension Dummett tries to navigate.
  *   **Friend's Political Objection:** You succinctly summarize the political critique (conceding the majoritarian/"indigenous" framework, privileging the receiving country's perspective). This *is* a major criticism leveled against such arguments.
  *   **Overall:** You've represented Dummett's argument fairly and concisely. The structure you outline – rhetorical dismissal, conceptual retention, heavy qualification – is central to his approach in the book.

  **2. Your Technical Critique (Verificationist Turn): Strength and Potential Vulnerability**

  Your core philosophical argument is powerful and insightful:

  *   **Applying Dummett's Standard:** Using his own verificationist principle (meaning requires recognizable assertibility conditions) against his concept of "submerged" is clever and appropriate.
  *   **The Charge:** You argue that "submerged" lacks determinate meaning because Dummett fails to specify the evidence conditions that would make its application true or false. Unlike "bald" (which has clear cases despite borderline vagueness), "submerged" seems to have *no* clear operational criteria. It's vague not just at the edges, but fundamentally.
  *   **The Consequence:** If "submerged" lacks determinate meaning, then the "right not to be submerged" becomes an "empty vessel," susceptible to being filled by majoritarian anxieties rather than representing a genuine, principled limitation.

  **Does the Critique Hold Up? Addressing the "Vague vs. Meaningless" Concern**

  This is the crux. Your worry about an "equivocation" is valid, but your critique remains strong, even if Dummett *might* have a partial reply:

  *   **Dummett's Potential Reply:** Dummett could argue that "submerged" *is* like "bald." He might point to his colonial examples (Malaya, Fiji) as *clear cases* of submersion. He might suggest evidence like:
      *   The *pace* of demographic change exceeding some threshold of "absorbability."
      *   The *scale* of change relative to the existing population.
      *   The *inability* of core institutions/culture to function or be recognized without fundamental, unwanted transformation *imposed* by the demographic shift.
      *   A loss of political self-determination for the prior majority.
      He would likely argue that while the *precise* boundary is vague (like the exact number of hairs for baldness), clear cases exist (e.g., deliberate settler colonialism displacing indigenous populations), and Britain in the late 20th century wasn't remotely close to being one.

  *   **Why Your Critique Still Has Significant Force (The Reply's Weakness):**
      1.  **Lack of Specification:** Crucially, Dummett *doesn't actually provide these criteria* in the context of the "right not to be submerged." He gestures at examples but doesn't define the predicate. This omission is fatal to his argument *on his own terms*. A verificationist must specify what counts as evidence.
      2.  **Subjective/Value-Laden Core:** The proposed criteria above ("unwanted transformation," "core institutions/culture," "absorbability") are inherently normative, culturally specific, and contestable. What counts as a "fundamental, unwanted transformation"? Who defines "core" culture? What pace is "too fast"? This isn't merely vagueness like "heap" or "bald"; it's vagueness built upon fundamentally subjective and political judgments. Verificationism struggles with terms whose evidence conditions rely on contested values rather than observable facts.
      3.  **The "Anxiety" Problem:** Because the criteria are undefined and value-laden, the application of "submerged" is inherently vulnerable to perception, fear, and political manipulation – *precisely* the dangers Dummett associated with "swamped." Your "empty vessel" point hits home: without objective, verifiable criteria, the concept *will* be shaped by dominant anxieties. His qualifications try to fence it in, but the core concept itself lacks the determinacy his philosophy demands.
      4.  **"Changed" vs. "Submerged":** You rightly highlight this distinction. Dummett needs a principled way to say *when* change becomes submersion. His failure to provide verifiable criteria for this threshold is the core weakness your critique exposes. Change is constant; "submersion" implies something normatively significant *beyond* mere change. Defining that boundary verifiably is the challenge he doesn't meet.

  **Conclusion on Your Argument:**

  *   **It's a strong and valid critique.** You haven't illegitimately slid from "vague" to "meaningless." You've correctly identified that the vagueness of "submerged" stems not just from borderline cases, but from a fundamental lack of defined assertibility conditions *and* its reliance on deeply subjective, normative judgments that resist verification.
  *   **Dummett *might* offer a partial reply** by pointing to clear historical examples as paradigms. However, **this reply is inadequate** because:
      *   He fails to explicitly define the criteria derived from those examples.
      *   The criteria one might infer are inherently value-laden and lack the kind of intersubjective verifiability his verificationist theory typically requires for determinate meaning.
      *   The concept remains dangerously susceptible to subjective interpretation and political weaponization, undermining his attempt to replace "swamped" with something sober and principled.
  *   **Your core insight stands:** On Dummett's *own* philosophical grounds, the concept "submerged" as used to define a "right" lacks the determinacy required for meaningful assertion. The "right not to be submerged" therefore functions more as a rhetorical concession to majoritarian fears than a robust, philosophically defensible principle. The qualifications try to minimize the damage, but they don't solve the foundational problem of the concept's indeterminacy.

  **In short:** You've represented Dummett fairly. Your technical critique is insightful and largely holds up. While Dummett *might* argue for paradigm cases giving "submerged" some minimal determinacy, his failure to define verifiable criteria for the crucial threshold between "change" and "submersion," combined with the concept's inherent normativity, means your argument successfully exposes a deep tension, if not a fatal flaw, in his position based on his own philosophical commitments. You've given your friend something substantial to chew on for the next dinner! Good luck.
