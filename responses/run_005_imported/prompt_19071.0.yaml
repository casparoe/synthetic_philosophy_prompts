answer: |-
  ## Eulogy for Miriam: The River, The Tiger, and Time's Unbreakable Thread

  [Pause, breathe, look at the gathering]

  Two weeks. Fourteen days. Three hundred and thirty-six hours. However we measure it, the world without Miriam feels… thinner. Sharper at the edges. Less vibrant. It feels like time itself has fractured.

  Miriam dedicated her life to the power of words, to the intricate dance of ideas found in Latin American literature. And for over thirty years, one particular piece held her captive, challenged her, fascinated her: Jorge Luis Borges’s essay, "A New Refutation of Time." Many of you in this room know it well. For others, let me try to explain her obsession, briefly, as she might have.

  Borges, with the precision of a watchmaker and the imagination of a poet, built an argument. He leaned on philosophers like Hume, who said the self is just a bundle of perceptions, and Berkeley, who questioned the very existence of matter. Borges wove this into a tapestry suggesting that if there’s no solid *thing* for time to happen *to*, then time, in its deepest sense – the relentless, linear succession we feel – cannot be real. It’s an illusion. A magnificent, dizzying thought experiment.

  [Smile faintly]

  And for years, being the retired physicist in the marriage, the one who spent his career wrestling with entropy, the thermodynamic arrow pointing inevitably towards disorder, I’d needle her. “Entropy settles it, Miriam!” I’d say. “Time’s direction is written into the universe’s very fabric!” She’d always have the same response. She’d reach for her worn copy of Borges, open it to a very specific page near the end, and point. Not to the complex argument, but to its breathtaking collapse.

  Because Borges, having built this intricate castle of thought designed to dissolve time, steps back. He admits the argument, however logically elegant, doesn’t actually *save* him. He writes: "And yet, and yet... To deny temporal succession, to deny the self, to deny the astronomical universe, are apparent desperations and secret consolations... Time is the substance I am made of. Time is a river which sweeps me along, but I am the river; it is a tiger which destroys me, but I am the tiger; it is a fire which consumes me, but I am the fire."

  He concludes, heartbreakingly: "The world, unfortunately, is real; I, unfortunately, am Borges."

  Miriam loved that. She called it the most honest paragraph Borges ever wrote. The intellectual acrobat, landing flat on his face in the messy reality he tried to refute. The argument was brilliant, she’d say, but its *failure* was profound. It wasn’t a cheap trick. It was an admission. The head can build castles in the air, logic can weave intricate spells, but the heart, the body, the sheer *is-ness* of being alive in this moment, feeling the steam rise from a teacup, hearing a grandchild laugh, grieving a loss… *that* reality refuses to be refuted. "The world, unfortunately, is real." She cherished that "unfortunately." Its stark honesty.

  So, I stand here today, caught between Miriam’s beloved Borges and the physics of time I studied. I stand here, feeling the terrible, undeniable reality of her absence. I cannot stand before you and say, “Time isn’t real, so she isn’t gone.” That would be the cheap version. That would be the move Borges refused to make, and Miriam would see through it instantly. She’d be giving me *that look* right now, the one that said, “Don’t you dare oversimplify this.”

  The truth is harder, messier, and ultimately, perhaps, more comforting in its humanity. Borges couldn’t argue himself out of being Borges. I cannot argue myself, or any of us, out of missing Miriam with every fiber of our being. The river of time *feels* real because we are caught in its current. The tiger’s claws *feel* sharp because we loved someone fiercely, tangibly, *in* time.

  Miriam spent thirty years teaching stories – stories of love, rebellion, magic, despair – stories that only make sense *because* they unfold in time. Her life *was* a story, a magnificent, complex narrative woven through decades. Her laughter echoing in a classroom, the intensity in her eyes as she debated an interpretation, the quiet concentration grading papers late at night, the warmth of her hand in mine… these weren't illusions. They were moments, accumulating, building the undeniable reality of *her*.

  Entropy tells us complex things tend towards disorder. But Miriam’s life was a counterpoint. She built complexity – in her students’ minds, in her family’s hearts, in the very air of any room she entered. Her passion, her intellect, her fierce love, created intricate patterns of meaning that persist, even now, resisting the pull towards mere dust.

  So yes, the world, unfortunately, is real. Time’s passage, unfortunately, brings loss. Our grief, unfortunately, is the testament to that reality.

  But here’s what Borges’s honest failure, what Miriam’s profound understanding of it, leaves us with: **If time feels real because love and loss are real, then the love itself is the most undeniable force in the universe.** More fundamental than any philosophical argument, more persistent than any law of physics. The love we shared with Miriam, the love she poured into her students, her children, her grandchildren, her friends, her work – that love *is* the river we are made of. It *is* the tiger that gives life its fierce vitality. It *is* the fire that warms us still.

  She isn’t here in the next moment we expect her. That is the brutal truth of time’s arrow. But the love she created, the minds she ignited, the stories she passed on, the indelible mark of her presence – these are not bound by a single moment. They ripple through *our* time, shaping our present, informing our future. They are the substance *we* are made of now. She is woven into the ongoing story of all who knew her. That story continues. That love endures.

  Miriam understood that Borges couldn’t refute the reality of being Borges. We cannot refute the reality of missing her. But we also cannot refute the even more profound reality: that she was here. She was magnificently, brilliantly, lovingly *real*. And that reality, the river she was, the tiger she was, the fire she was, continues to shape the undeniable, ongoing flow of our own lives. That is her lasting refutation of oblivion.

  Thank you, Miriam, for the argument, for the honesty, and most of all, for the love that makes time matter. The world was, and is, richer because you were, unfortunately and gloriously, real. We carry you with us, in time, always.
