  However, note that in the COMPAS case, the model was found to be balanced (by Northpointe) but not calibrated (by ProPublica). The impossibility theorem explains that when base rates differ, if the model is balanced then it cannot be calibrated, and vice versa. So the new hire's conclusion is correct.

