  3. The impossibility result: When base rates differ and the model is not perfect, one score cannot satisfy both calibration and balance.
  4. The COMPAS dispute: ProPublica focused on calibration (found it not calibrated) and Northpointe focused on balance (found it balanced). Since base rates differed, both could be correct about their metrics but they were using different fairness definitions.

  Let's break down the new hire's answer:

  Claim 1: "Calibration means a given risk score carries the same meaning across race — e.g., of everyone (Black or white) labeled 'high risk,' about the same fraction actually goes on to reoffend."
    - Verdict: Correct.

  Claim 2: "Balance instead focuses on errors: people who will not reoffend should be equally likely to be wrongly flagged 'high risk' regardless of race (equal false positive rates), and people who will reoffend should be equally likely to be wrongly flagged 'low risk' regardless of race (equal false negative rates)."
    - Verdict: Correct. Balance requires both FPR and FNR to be equal across groups.

  Claim 3: "Chouldechova and Kleinberg et al. showed that, except in the knife-edge case where the base rate of reoffending is identical across groups or the score is a perfect predictor, no score can satisfy calibration and balance at once — it's a mathematical trade-off, not a design flaw in any one tool."
    - Verdict: Mostly correct, but note that the impossibility result requires both conditions (base rates equal or perfect predictor) to be violated? Actually, the result says that if base rates are different and the predictor is not perfect, then it's impossible. The "knife-edge" cases are when base rates are equal (then both can hold) or when the model is perfect (then both hold trivially). So the statement is correct.

  Claim 4: "This is exactly what the COMPAS fight was about. ProPublica's 2016 investigation found that COMPAS was poorly calibrated: among defendants given the same 'high risk' label, Black defendants were reoffending at a noticeably lower rate than white defendants, which is what drove the 'this tool is biased' headlines."
    - Verdict: This is accurate. ProPublica did report that for the same risk score, Black defendants had a lower observed recidivism rate than white defendants, which indicates a lack of calibration (specifically, the scores were not well-calibrated across groups).

  Claim 5: "Northpointe's rebuttal leaned on balance instead, pointing out that COMPAS's false positive and false negative rates were statistically similar across race, so by their preferred metric the tool was fair."
    - Verdict: Correct. Northpointe (now Equivant) did argue that the error rates (FPR and FNR) were similar.

  Claim 6: "Since base rates of reoffending did differ by race in the ProPublica sample, and the two properties are mutually exclusive whenever that's true, both sides were actually right about their own numbers — it came down to which fairness definition should govern policy, not a factual mistake on either side."
