  Alternatively, note that the question says: "say what this implies about the 2016 ProPublica vs. Northpointe dispute". The new hire's answer correctly implies that because base rates differed, the impossibility theorem explains why one model couldn't satisfy both, and hence the two parties were focusing on different metrics.

