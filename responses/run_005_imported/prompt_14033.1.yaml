  ## Charter Revision Commission Recommendation: Voting Franchise for Town Budget Articles

  **To:** Charter Revision Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** 9 October 2023  
  **Subject:** Recommendation on Proposed Limited Franchise for Budget Articles  
  **Meeting Date:** 12 October 2023

  **1. Issue Summary:**  
  The Commission is considering a proposal to amend the Town Charter to grant seasonal property owners (non-residents paying property taxes) a limited voting franchise *solely* on municipal budget articles at Town Meeting. This arises from the observation that approximately 50% of property tax revenue, funding core services (including schools), is contributed by seasonal owners who currently have no vote, while full-time renters, who pay no property tax directly but contribute indirectly via rent, possess full voting rights. The current Charter defines voters simply as "legal voters of the town," implying residency-based qualification without explicit exclusions or inclusions for specific articles.

  **2. Positions Considered:**

  *   **Pro-Limited Franchise:** Seasonal property owners bear a significant direct financial burden for the town's budget. The principle of "no taxation without representation" applies. Granting them a vote *only* on budget matters directly funded by their taxes is a measured, fair response to their substantial contribution. It acknowledges their investment while preserving resident control over non-financial governance.
  *   **Pro-Residency Requirement:** Voting rights in a municipality are fundamentally tied to residency. Those who live in the town year-round are subject to the *full consequences* of all Town Meeting decisions – the quality of schools, emergency services, roads, and the overall community character – not just the tax burden. Renters, while not paying property taxes directly, are integral community members, contribute economically, and live with the outcomes daily. Fragmenting the franchise based on property ownership or tax payment creates administrative complexity and risks diluting the voice of those most directly impacted by the totality of governance decisions.

  **3. Commission Analysis & Reasoning:**  
  After thorough deliberation, weighing the valid concerns of both seasonal owners and year-round residents, the Commission recommends **rejecting the proposed amendment for a limited franchise and maintaining the current residency-based voting requirement for all Town Meeting articles.** Our reasoning is as follows:

  *   **Foundational Principle:** Municipal voting rights in the United States are traditionally and primarily grounded in residency. This principle reflects that local government decisions impact residents' daily lives in profound ways beyond just financial contribution. Residency signifies a commitment to and stake in the *entire* community fabric.
  *   **Holistic Impact of Budgets:** Town budgets are not merely financial spreadsheets; they are expressions of community priorities and values. Decisions about school funding, public safety levels, infrastructure investment, and social services directly shape the lived experience and future of residents. Those experiencing these consequences year-round possess the most direct and comprehensive stake in these outcomes.
  *   **Indirect Contributions Acknowledged:** While seasonal owners contribute significantly via property taxes, renters contribute indirectly through rents that include property tax components and directly through local spending and participation. Their residency makes them subject to the *results* of budget decisions in a continuous, immersive way.
  *   **Practicality & Cohesion:** Creating a separate class of voters solely for budget articles introduces significant administrative burdens for voter verification and meeting procedures. More importantly, it risks creating a divisive "us vs. them" dynamic within the community, potentially undermining the shared purpose of Town Meeting. A unified electorate fosters greater collective responsibility.
  *   **Addressing the Valid Concern:** The Commission fully acknowledges the significant financial contribution of seasonal property owners and understands the frustration underlying the "no taxation without representation" argument. However, their representation occurs primarily in their jurisdiction of primary residence, where they vote on the totality of that community's governance. Their choice to invest in our town was made under the existing residency-based voting structure.

  **4. Recommendation:**  
  **The Charter Revision Commission recommends NO CHANGE to the existing language defining voters as "legal voters of the town."** Voting rights for Town Meeting, including on budget articles, should remain tied to residency as the most principled, practical, and community-cohesive basis for local democratic participation.

  **5. For the Seasonal Owner Faction (The Fair Hearing):**  
  The Commission takes seriously your substantial contribution to our town's fiscal health. Your property taxes are undeniably vital. The principle you invoke – seeking a voice in how your significant tax dollars are spent – is understandable and legitimate. Your proposal for a limited, budget-only vote was a thoughtful attempt to address this imbalance. While we ultimately recommend against altering the franchise, we do not dismiss your perspective. We encourage continued engagement through public comment at Town Meeting, participation in advisory committees, and direct communication with elected officials. Your investment and voice are valued components of our community, even if formal voting rights remain tied to residency.

  **6. Next Steps:**  
  This recommendation will be discussed and voted upon at the Commission meeting on October 12th. If approved, the recommendation for "No Change" on this specific issue will be included in our final report to the Town.
