answer: |-
  ## The Fourth Relation: Parity or Vagueness in Value Comparisons?

  The puzzle of comparing fundamentally different options—philosopher versus journalist careers, chimpanzee versus human welfare, or even saving one life versus preventing a thousand headaches—haunts practical reason. Ruth Chang's challenge to the "Trichotomy Thesis" and her argument for a fourth value relation, "parity," offers a compelling framework for understanding the stubborn resistance of some choices to neat ranking. Yet, John Broome's counter, that vagueness suffices, wields the razor of parsimony. Adjudicating between these positions requires dissecting Chang's small-improvement argument and testing the explanatory power of vagueness against the phenomenology of hard choices.

  **Reconstructing Chang's Small-Improvement Argument:**

  Chang's core argument proceeds meticulously:

  1.  **The Initial Intuition:** Consider two options, A and B, that are intuitively comparable but seem roughly "on a level" in value, despite being significantly different in kind. (Example: A career as a journalist focused on social justice vs. a career as a philosopher pursuing abstract truth).
  2.  **The Small Improvement:** Imagine slightly improving one option (A+) without fundamentally altering its character (e.g., the journalist gets a slightly more prestigious platform with identical duties and impact).
  3.  **The Persistent Non-Superiority:** Despite this improvement, it seems *incorrect* to say A+ is now *better than* B. The careers remain difficult to rank; neither seems clearly superior.
  4.  **Rejecting Trichotomy Explanations:**
      *   *Not Equality:* If A and B were *exactly equal*, then any improvement to A, however small, *should* make A+ strictly better than B. The persistence of non-superiority contradicts this.
      *   *Not Incomparability:* We *can* compare journalist and philosopher careers. We understand their values, trade-offs, and can often say one is better *for a specific person* or *in a specific context*. They are comparable, not like comparing the taste of an apple to the beauty of a proof.
  5.  **The Conclusion - Parity:** Therefore, the relation holding between A and B (and persisting between A+ and B) must be a distinct fourth relation: **parity**. Options on a par are comparable, neither better than the other nor worse, nor exactly equal. They belong to the same "covering value" (e.g., "overall career goodness") but involve different "values in the domain" (e.g., social impact vs. intellectual depth) combined in ways that defy the standard trichotomy. Parity is a *sui generis* relation reflecting the possibility of different, equally legitimate ways of realizing a covering value.

  **The Vagueness Challenge: Can Broome Accommodate the Cases?**

  Broome argues Chang's cases reveal not a new relation, but the **vagueness** inherent in the predicate "better than." His argument runs:

  1.  **Vagueness is Ubiquitous:** Many predicates ("bald," "heap," "tall") are vague, lacking sharp boundaries. "Better than" is no exception, especially when complex, multi-faceted values are involved.
  2.  **Borderline Cases:** Chang's initial pairs (A and B) exist in a **penumbral region** of "better than." It's indeterminate whether A is better than B, worse than B, or equal to B. They are **on the borderline**.
  3.  **The Small Improvement Explained:** The small improvement creates A+. However, because the original comparison was borderline, a *small* improvement may be insufficient to move A+ *determinately* into the "better than B" category. It might remain within the borderline zone. Just as adding one hair doesn't determinately make someone not-bald if they were borderline bald, a small improvement doesn't determinately make A+ better than B if they were borderline comparable.
  4.  **No Need for Parity:** The phenomena Chang identifies – comparability, lack of strict betterness/worseness/equality, resistance to small improvements tipping the scale – are fully explained by the **indeterminacy** inherent in vague predicates. Positing a new, sui generis relation violates Occam's Razor.

  **Adjudication: Does Parity Stand, or Does Vagueness Suffice?**

  While Broome's vagueness model is elegant and parsimonious, Chang's parity thesis offers a richer, more phenomenologically accurate account of certain hard choices, suggesting it names a real relation irreducible to vagueness:

  1.  **Structural vs. Semantic Indeterminacy:** Vagueness typically involves a *single dimension* (number of hairs, height) where borderline cases are due to *semantic indecision* about where to draw the line. Chang's cases involve *multiple, distinct dimensions of value* (impact vs. truth, suffering intensity vs. cognitive capacity). The indeterminacy feels **structural**, arising from the *incommensurable nature of the contributing values themselves*, not just semantic indecision about the boundary of "better than." Parity captures this structural incommensurability *within* comparability.
  2.  **The Nature of the Covering Value:** Broome's model assumes a single, well-defined covering value ("overall career goodness") with a vague boundary. Chang argues parity arises precisely when the covering value admits of **fundamentally different ways of being realized** – different "value geometries." The career examples feel like comparing different *kinds* of good careers, not different quantities of the *same kind* of goodness. Vagueness struggles to explain this qualitative difference within comparability.
  3.  **The "Swamping" Intuition:** In classic vagueness (baldness), adding hairs *eventually* determinately moves one out of the borderline zone. In parity cases, there's often an intuition that *any* improvement along one dimension (e.g., slightly more prestige for the journalist) might be **"swamped"** by the intrinsic difference in the *kind* of value offered by the alternative (the philosopher's pursuit of truth). The resistance feels deeper than mere borderline status; it feels like the improvement is irrelevant to the core comparison of different value types. Parity better explains this.
  4.  **Commitment and Justification:** Chang argues that in genuine parity cases, choosing one option over the other isn't merely picking within an indeterminate zone. It can involve **creating reasons** through commitment. Choosing the journalist career might make the value of social impact more salient and authoritative *for you*, justifying the choice ex post in a way that feels different from arbitrarily picking one borderline bald person over another. Vagueness struggles to accommodate this normative role of commitment.

  **Verdict:** While vagueness explains *some* difficult comparisons, particularly those involving scalar differences, **Chang's parity thesis identifies a distinct, *sui generis* value relation applicable to choices involving fundamentally different, incommensurable kinds of value within a common domain.** The structural nature of the indeterminacy, the qualitative difference in realizing the covering value, the "swamping" intuition, and the role of commitment point towards an ontological reality for "on a par" that transcends semantic vagueness. Broome's model is necessary but insufficient for capturing the full depth of hard choices between qualitatively different goods.

  **Implications for Hard Choices: Beyond Arbitrariness**

  If parity is real, what does this mean for deciding between options on a par?

  1.  **No Algorithmic Solution:** Neither reason nor calculation can *compel* one choice over the other. There is no "best" option to be discovered. **Rationality runs out.**
  2.  **Beyond Indifference:** Choosing isn't a matter of mere indifference (as with exact equals). The options matter deeply, but in different ways.
  3.  **The Role of Commitment:** Chang's crucial insight is that **rationality doesn't end with the comparison.** When faced with parity, you can *exercise your normative agency* by **wilfully committing** to one option or the underlying set of values it represents. This commitment isn't arbitrary whim:
      *   **Reason-Responsive:** It should be responsive to reasons you have (e.g., your temperament, passions, existing projects, broader life narrative).
      *   **Value-Creating:** By committing, you *make* one set of reasons (those favoring your chosen option) stronger *for you*. You put your weight behind one value geometry.
      *   **Justificatory:** Post-commitment, you can justify your choice *based on the reasons created or amplified by your commitment*. "I chose journalism *because* I committed to valuing tangible social impact, and this commitment makes the reasons for journalism decisive *for me*."
  4.  **Not Mere Arbitrariness:** While the *initial* choice between the options, absent commitment, might involve an element of non-rational "plumping," the act of commitment transforms it. It becomes a **self-conscious, reason-responsive exercise of agency** that grounds future justification. It's closer to making a foundational promise or taking a stand than flipping a coin.

  **Conclusion**

  The persistence of truly hard choices—where options seem comparable yet resistant to ranking even after meticulous analysis and small improvements—demands more than the Trichotomy Thesis or simple vagueness can provide. Broome's vagueness model explains borderline cases along a spectrum but falters when confronting comparisons across fundamentally different kinds of value. Ruth Chang's concept of **parity** successfully identifies a distinct, *sui generis* fourth value relation arising from structural incommensurability within a common domain of value. Recognizing parity does not condemn us to arbitrariness. Instead, it highlights the active role of normative agency: in the space opened by parity, **rational commitment becomes the bridge between incommensurable values and justified choice.** The hard choice isn't solved by calculation but navigated through a wilful, reason-responsive act of self-definition that creates the reasons necessary to make one path, finally, our own.
