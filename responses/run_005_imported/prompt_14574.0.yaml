answer: |-
  You've nailed the core frustration: Popper's elegant idea for measuring "truth-likeness" (verisimilitude) collapsed spectacularly, and understanding *why* is tricky without getting buried in logic. Let's break down the gut-level reason for the collapse and then see if the fixes work.

  **The Core Problem: Entanglement & Logical Bombs**

  1.  **Popper's Simple (but Flawed) Idea:** He thought a theory (T1) is closer to the truth than another (T2) if:
      *   T1 has *more true consequences* (truth-content) than T2, **AND**
      *   T2 has *more false consequences* (falsity-content) than T1.
      *   *Intuition:* Newton should have more truths (e.g., about elliptical orbits, gravity acting at a distance) and fewer falsehoods (e.g., absolute time/space) than Aristotle (e.g., everything moving towards natural places, celestial spheres).

  2.  **The Tichý-Miller Bomb:** They showed that **if two theories are both false, this seemingly simple condition is logically impossible to satisfy.**

      **Here's the intuitive reason why:**

      *   Imagine two false theories: `T1` (Newton-ish) and `T2` (Aristotle-ish). The actual truth is `T*`.
      *   For `T1` to have *more* true consequences than `T2`, there must be some true statement `A` that follows logically from `T1` but *does not* follow from `T2`.
      *   Since `T1` is *false*, it must also imply some *false* statement `B`. Because `T1` is false, `B` is necessarily false (it contradicts `T*`).
      *   **The Killer Move:** Now consider the logical combination `A OR B`. This statement (`A ∨ B`) is **true** (because `A` is true, and "OR" only needs one true part). Crucially, `A ∨ B` **follows logically from `T1`** (since `T1` implies `A`, and `A` implies `A ∨ B`).
      *   **The Trap:** What about `T2`? Does `T2` imply `A ∨ B`?
          *   We know `T2` does *not* imply `A` (that was our starting point).
          *   `T2` *might* imply `B`, or it might not. **But crucially, `T2` *does not* necessarily imply `A ∨ B`.**
          *   Why? Because `T2` could be compatible with a world where *both* `A` is false *and* `B` is false. Remember, `T2` is false, but its falsehood might lie elsewhere. `T2` simply *fails to guarantee* that `A` is true, and it also *fails to guarantee* that `B` is true. Since `A ∨ B` requires *at least one* to be true, `T2` doesn't *force* it to be true. `T2` could describe a world where `A` is false and `B` is also false, making `A ∨ B` false in that world. Therefore, `A ∨ B` is **not** a logical consequence of `T2`.
      *   **The Consequence:** We have a **true** statement `A ∨ B` that is implied by `T1` but *not* implied by `T2`. So far, so good for Popper's first condition (T1 has more truth-content).
      *   **The Explosion:** Now look at the *false* statement `B`. Since `B` is implied by `T1`, `B` is part of T1's falsity-content. What about `T2`? Does `T2` imply `B`? **Not necessarily!** `T2` might be completely silent about `B` or even imply *not-B*. If `T2` does *not* imply `B`, then `B` is **not** part of T2's falsity-content.
      *   **The Collapse:** We've found:
          *   A true consequence (`A ∨ B`) that `T1` has but `T2` lacks. (Good for T1 on truth-content)
          *   A *false* consequence (`B`) that `T1` has but `T2` *lacks*. (Bad for T1 on falsity-content!)
      *   **The Impossibility:** To satisfy Popper's definition, `T2` needs to have *more* false consequences than `T1`. But we just found at least one false consequence (`B`) that `T1` has and `T2` *doesn't*! This means `T1`'s falsity-content *includes* something `T2`'s falsity-content *excludes*. It becomes impossible to show that `T2`'s falsity-content strictly exceeds `T1`'s. Whenever `T1` gains a true consequence over `T2`, it *necessarily* drags along a false consequence (`B`) that `T2` might avoid. The truths and falsehoods of a false theory are fundamentally entangled in a way that Popper's definition can't untangle. You can't add more truth without also adding (or at least not removing) specific falsehoods.

  **Gut-Level Summary:** Think of a false theory as a package deal. Popper wanted to count the good items (truths) and bad items (falsehoods) separately. Tichý and Miller showed that the logical structure forces some "good items" to be glued to specific "bad items" inside the package. When you try to give Theory 1 (Newton) an extra good item compared to Theory 2 (Aristotle), you inevitably also give it a specific bad item that Theory 2 *doesn't* have. This makes it impossible to say Theory 2 has strictly *more* bad items overall. The entanglement prevents the clean accounting Popper needed.

  **Do Similarity/Likeness Definitions Fix It? (Yes, but...)**

  Yes, approaches like those of Ilkka Niiniluoto and Graham Oddie (you remembered correctly!) *technically* solve the Tichý-Miller problem. They provide frameworks where Newton can indeed be ranked closer to the truth than Aristotle. Here's the gist and the catch:

  1.  **The Fix (Similarity Approach):**
      *   **Forget counting consequences.** Instead, imagine all the possible ways the world could be ("possible worlds" or "states of affairs").
      *   **Identify the *actual* world** (the one true description).
      *   **Measure the "distance"** between the world described by a theory (`T1` or `T2`) and the actual world (`T*`). Distance is measured by how many "features" or "facts" differ and how significantly they differ.
      *   **Closeness = Smallest Distance.** The theory whose closest possible world(s) to the actual world are *less distant* than the closest possible world(s) of the other theory is deemed more verisimilar.
      *   *Intuition:* Newton's "possible world" (with gravity, elliptical orbits, etc.) is much closer to our actual solar system (with relativistic corrections) than Aristotle's possible world (with crystalline spheres and natural motion) is. Even though Newton's world isn't perfect, the *differences* (e.g., needing slight orbit adjustments, no absolute space) are smaller than the differences needed to fix Aristotle (scrapping spheres, gravity concept, etc.).

  2.  **The "Different Problem" (Language/Predicate Dependence):**
      *   **The Core Issue:** How do you define the "distance" between possible worlds? What counts as a "feature" or "fact"? How do you weigh differences in color vs. differences in shape vs. differences in mass?
      *   **Dependence on Conceptual Scheme:** The distance measure **crucially depends** on the language or set of predicates (basic descriptive terms like "mass," "red," "orbits") you use to describe the worlds.
      *   **The Problem Illustrated (Your Memory is Correct):** Imagine describing colors only by wavelength (a continuous scale). The distance between "red" (650nm) and "orange" (600nm) is 50nm. Now describe colors with basic names: "red," "orange," "yellow," etc. The distance between "red" and "orange" might be 1 (they are adjacent categories), while "red" to "yellow" is 2. **A theory misclassifying an object as orange vs. red might be "closer" under the wavelength metric but "farther" under the category metric.** The ranking of theories can change depending on how you carve up the world conceptually.
      *   **Why it's a Big Deal:** Verisimilitude was supposed to be an *objective* measure of how well a theory captures the *actual* world. If the measure fundamentally depends on our arbitrary choice of descriptive language or conceptual scheme, then:
          *   It's not purely objective.
          *   Comparisons between theories using *different* conceptual frameworks become extremely difficult or meaningless.
          *   It raises the question: Is there a "God's Eye" set of fundamental predicates that defines the *true* structure of the world, which we should use? (A deeply metaphysical question without a clear answer).

  **In Conclusion:**

  *   **Popper's Collapse:** His definition failed because the truth-content and falsity-content of false theories are logically entangled. Adding more true consequences forces you to add (or retain) specific false ones, making it impossible to satisfy both conditions of his definition simultaneously for two false theories. Tichý and Miller exposed this entanglement brilliantly.
  *   **Similarity Fixes (But...):** Niiniluoto, Oddie, and others successfully bypassed the Tichý-Miller problem by shifting the focus to measuring the distance between possible worlds. This *allows* rankings like Newton > Aristotle. **However,** this approach trades the logical impossibility for a deep problem of **language dependence**. The verisimilitude ranking becomes relative to the chosen descriptive vocabulary and distance metric, undermining the hope for a perfectly objective, language-independent measure of "closeness to truth."

  So, your friend is right – verisimilitude *is* still a lively (and thorny) open problem. Popper's initial definition broke, the similarity fixes work mathematically but introduce metaphysical/linguistic headaches, and philosophers continue to debate whether a truly satisfactory, objective definition is even possible. The quest to rigorously say "this false theory is *less wrong* than that one" turns out to be surprisingly deep and difficult.
