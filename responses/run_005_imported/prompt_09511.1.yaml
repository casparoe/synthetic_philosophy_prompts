  I recall Hacking's multiple personality disorder example - how the diagnosis exploded after Sybil, then collapsed under scrutiny. Perfect template. For fictional resonance, maybe something sensory/attention-related but distinct from ADHD? Let's call it "Hyperlucid Perception Disorder" - HPD. Sounds clinical but flexible.

  The protagonist needs to be an ordinary person caught in the diagnostic shift. Maya, 29, fits: overwhelmed office worker whose "quirks" suddenly make sense through HPD's lens. The story should show her initial relief ("I'm not broken, I have HPD!") then unease as the diagnosis reshapes her identity. 

  For the collective feedback loop: online communities feel most realistic. Imagine Maya joining forums where people perform HPD through shared jargon and symptom-tracking. Then the pivot: a support group where someone rejects the "disorder" framing, arguing their traits are neurological differences. That dissent causes visible ripple effects - maybe a clinician later mentions "we're reconsidering diagnostic criteria due to patient feedback."

  Ending must resist resolution. Perhaps Maya leaves a pamphlet for "Neurovariant Perception" instead of HPD at her therapist's office, but doesn't stay to see if anyone picks it up. The label helped and confined her; its evolution continues without her. 

  Crucially, the story shouldn't judge whether looping effects are good or bad. Just show the cycle: diagnosis → identity shift → collective reinterpretation → altered diagnosis → repeat. Like water shaping rock, then rock redirecting water.
