prompt: |-
  Okay so I'm plotting a novel where my main character keeps running into near-duplicates of herself across branching timelines, and I've gone down a rabbit hole trying to figure out which metaphysical picture actually fits: counterpart theory or genuine transworld identity. Can you compare the two properly for me, past the one-line textbook version -- specifically how each side handles Kripke's "Humphrey" complaint (that some counterpart winning the election isn't a possibility for Humphrey himself, so why should he care), and how each one deals with Chisholm's paradox about two guys, I think its Adam and Noah, who gradually swap every property across a long chain of worlds till its unclear who's who anymore. Basically, once you factor those two problems in, which view comes out less ad hoc, and does picking one over the other actually commit me to an answer about whether it's "really her" showing up in the other timeline, or just someone close enough to fool the reader?
