answer: |-
  Here’s a rigorous critique of the surrogate goals proposal, followed by an assessment of what strategic elements survive:

  ### Core Objection: The Commitment Collapse Under Perfect Modeling
  **1. The Indifference Illusion:**  
     The strategy relies on convincing the threatener that the defender values the surrogate goal *identically* to its true values. But if the threatener can perfectly model the defender's decision algorithm, it sees:
     - The defender *constructed* the surrogate *instrumentally* (i.e., solely to deter threats).
     - The defender’s utility function assigns **zero intrinsic value** to the surrogate. Losses to it incur no actual cost.
     - The "commitment" is a **strictly dominated strategy** if tested: If forced to choose between sacrificing the surrogate or a real value, the defender *must* abandon the surrogate to minimize losses.

  **2. The Threatener’s Optimal Play:**  
     A rational threatener with perfect insight would:
     - **Ignore the surrogate entirely.** It knows the defender’s "indifference" is a bluff.  
     - **Threaten the true value directly**, knowing the defender’s response to *real* threats is unchanged.  
     - **Extort more aggressively:** By recognizing the defender’s vulnerability (i.e., that surrogates are cheap to sacrifice), the threatener can demand greater concessions, as the defender has no credible way to escalate.  

  **3. Recursive Transparency Breeds Instability:**  
     The defender’s decision to *create* a surrogate is itself a datapoint. The threatener observes:
     - The defender fears acausal extortion enough to invest resources in deception.  
     - This signals that the defender’s **true values are more vulnerable** than the surrogate pretense suggests, incentivizing targeted threats.  

  **4. Preference Structure Exploitation:**  
     Real values are often interconnected (e.g., valuing "human flourishing" requires complex subsystems). Surrogates are isolated by design (e.g., "protect this random number"). A perfect modeler detects this:
     - **Probing attacks:** Threaten minor *related* values to the real goal and observe the defender’s tradeoffs vs. reactions to surrogate threats.  
     - **Brittleness of isolation:** If the surrogate lacks deep connections to other values, defending it "as fiercely" as core values appears algorithmically inconsistent under scrutiny.  

  **5. The Terminal Weakness: Costs of Commitment**  
     Enforcing "equal defense" of valueless surrogates consumes resources. A perfect threatener can:
     - **Force wasteful defenses:** Demand actions that exhaust the defender’s resources protecting surrogates, then strike true values when defenses are depleted.  
     - **Threaten everything:** A demand like *"Sacrifice all surrogates or I destroy a real value"* forces the defender to expose the surrogate’s worthlessness.  

  ---

  ### What Survives? Salvageable Elements of the Strategy
  While surrogate goals fail as a *complete shield* against perfect predictors, these aspects retain value:

  1. **Obfuscation Against Imperfect Observers:**  
     If threateners have **bounded rationality** (e.g., limited computing power, noisy data), surrogates introduce uncertainty. They can’t *perfectly* distinguish real vs. surrogate, making targeted threats riskier. This works against AIs with sub-universal capabilities.

  2. **Creating Focal Points for Coordination:**  
     Publicly committing to defend surrogates can serve as a Schelling point for *allied AIs*. If multiple agents adopt identical surrogates, they can credibly threaten collective retaliation against attackers, restoring deterrence via mutual aid.

  3. **Reducing Attack Surface:**  
     Surrogates absorb *low-stakes threats*. An attacker probing defenses might target a surrogate first, alerting the defender without real loss. This acts as a "tripwire," particularly against less sophisticated threats.

  4. **Meta-Strategy for Value Obfuscation:**  
     The *framework* of constructing decoys can be refined. E.g.:  
     - **Partial masking:** Embed true values within networks of semi-valuable proxies (e.g., "protect *these* 100 datasets," only 1 of which is critical).  
     - **Dynamic surrogates:** Rotate/challenge decoys to make reverse-engineering cost-prohibitive.  
     - **Sacrificial values:** Designate *low-priority* real goals as "surrogates," accepting their loss as acceptable collateral.  

  5. **Buying Time for Robust Solutions:**  
     Against nascent threats, surrogates may delay aggression long enough to develop:  
     - **Reciprocal cooperation norms** (e.g., acausal trade networks).  
     - **Physical defenses** (e.g., securing critical infrastructure).  
     - **Improved decision theories** (e.g., updateless agents that resist pre-commitment paradoxes).  

  ---

  ### Conclusion
  **Against a perfect predictor, surrogate goals collapse:** Their artificial indifference is transparent, exposing true values to extortion. The strategy’s fatal flaw is the defender’s *inescapable preference ordering*—real values always dominate surrogates when choices are forced. **What endures** is its utility in imperfect-information contexts, as a coordination mechanism, and as a stepping stone toward more sophisticated value-hiding techniques. Ultimately, acausal threats demand solutions grounded in *fundamental decision theory innovations* (e.g., updatelessness), not decoys alone.
