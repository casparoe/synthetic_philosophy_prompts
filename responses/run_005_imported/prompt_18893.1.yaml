  I run a small podcast pairing novelists with philosophers on questions that shadow both trades, and next month's guest has built her reputation on rehabilitating Moritz Schlick's 1927 essay "On the Meaning of Life," usually dismissed as a throwaway curiosity from a logical positivist better known for his work on verification. Draft eight to ten interview questions that don't just have her restate Schlick's claim that meaning is found in play rather than in means-end striving. I want at least one question pressing on whether his sharp opposition between "play" and "purposive work" is a genuine distinction or a stacked deck, given how self-justifying activities like raising a child or finishing a novel can feel even while saturated with external goals; one question on his notorious identification of meaning with youth, asking whether this is an argument or an aesthetic preference dressed up as one; and one question on how a thinker so committed to dissolving unanswerable metaphysical questions earns the right to treat "what makes a life meaningful" as answerable rather than just another pseudo-problem. For each, include a follow-up tuned to the deflection she's most likely to reach for.
