answer: |-
  ### Dialogue: The Money Pump and Resolute Choice

  **Setting:** A dimly lit conference room after a decision theory workshop. Two theorists—Alex (traditionalist, defends money-pump vulnerability) and Blair (resolute choice defender)—stand at a table with a trade sheet. On it, three options are written: **A**, **B**, and **C**. Alex has constructed a cycle of preferences: A ≻ B, B ≻ C, C ≻ A (where "≻" denotes strict preference). A bookie lurks nearby, ready to execute trades.

  ---

  **Alex:** (Pointing at the trade sheet) Let’s make this concrete. Suppose you’re an agent with cyclic preferences: you prefer **A** to **B**, **B** to **C**, and **C** to **A**. You start with **A**. The bookie offers you a sequence of trades, each with a small fee—say, $1.  
  - **Trade 1:** Swap **A** for **C** + $1 (you pay $1 to get **C**). Since you prefer **C** to **A**, you accept. Now you hold **C**, and you’re down $1.  
  - **Trade 2:** Swap **C** for **B** + $1. You prefer **B** to **C**, so you accept. Now you hold **B**, down $2 total.  
  - **Trade 3:** Swap **B** for **A** + $1. You prefer **A** to **B**, so you accept. You’re back to **A**, down $3.  

  The bookie repeats this cycle indefinitely. You’re pumped dry. Rationality requires transitive (or at least acyclic) preferences to avoid this. Cyclic preferences are irrational—full stop.

  **Blair:** Not so fast. McClennen’s resolute choice blocks this. At the start, before any trades, I commit to a **plan**: *reject all trades and keep **A**.* I don’t re-optimize trade-by-trade. When Trade 1 is offered, I don’t even consider my preference for **C** over **A** in isolation. I stick to the plan. No trade occurs, no money lost. Your pump fails.

  **Alex:** (Leans in) But that’s cheating your own preferences! At the moment Trade 1 is offered, you *currently prefer* **C**+$1 to **A**. By rejecting it, you’re acting against your *local* preference. That’s dynamically inconsistent—irrational by the standards of sequential choice. You’re just ignoring the exploitation risk by fiat.

  **Blair:** Not ignoring—*internalizing* it. Resolute choice treats the sequence as a single decision. I evaluate plans *ex ante*: keeping **A** yields **A**, while your trade sequence yields **A** minus $3n after n cycles. **A** ≻ (**A** - $3), so the plan dominates. Dynamic inconsistency is a red herring; rationality is about global coherence, not myopic obedience to local preferences. I avoid the pump by committing, and my cyclic preferences remain intact.

  **Alex:** Clever, but I’ve got a stronger pump. Rabinowicz and Gustafsson refined this. Suppose the bookie doesn’t offer one fixed sequence. Instead, you face a *series of independent but identical decision problems* over time—say, three separate interactions. Each mimics the cycle, but with penalties baked in. You can’t plan for all at once because they’re temporally disjoint. Here’s the setup:  

  - **Monday:** Choose between:  
    - **Option X:** Get **A** but pay $3 penalty.  
    - **Option Y:** Get **B** with no penalty.  
  - **Tuesday:** Choose between:  
    - **Option X:** Get **B** but pay $3 penalty.  
    - **Option Y:** Get **C** with no penalty.  
  - **Wednesday:** Choose between:  
    - **Option X:** Get **C** but pay $3 penalty.  
    - **Option Y:** Get **A** with no penalty.  

  Assume your preferences over outcomes are cyclic: **A** ≻ **B**, **B** ≻ **C**, **C** ≻ **A**. But now, outcomes include money: define **A**≡(**A**, $0), **A**⁻≡(**A**, -$3), etc. Crucially, your preferences *separable*: for any outcome **X**, (**X**, $0) ≻ (**X**, -$3). And for any money level, your cyclic preferences hold: e.g., (**A**, $0) ≻ (**B**, $0) ≻ (**C**, $0) ≻ (**A**, $0) — but this cycle is constrained by money differences.  

  **Blair:** Hold up. If (**A**, $0) ≻ (**B**, $0) and (**B**, $0) ≻ (**C**, $0), then by transitivity of "≻" over money separability, (**A**, $0) ≻ (**C**, $0). But you’ve got **C** ≻ **A** implying (**C**, $0) ≻ (**A**, $0). Contradiction! You can’t have separable cyclic preferences with money—it forces transitivity.

  **Alex:** Ah, but I’m not assuming separability. Preferences are defined holistically over (outcome, money) pairs. The cycle is:  
  - (**A**, $0) ≻ (**B**, $0)  
  - (**B**, $0) ≻ (**C**, $0)  
  - (**C**, $0) ≻ (**A**, $0)  *// Cycle here*  
  ... and for penalties:  
  - (**A**, $0) ≻ (**A**, -$3)  
  - (**B**, $0) ≻ (**B**, -$3)  
  - (**C**, $0) ≻ (**C**, -$3)  

  No separability axiom—just a cyclic ordering over specific bundles. Now, resolute choice: you commit on Monday to a plan for all three days. What plan?  

  **Blair:** Easy. My *ex ante* preference cycle means I lack a global optimum, but I can pick a coherent plan. Since I prefer **A** to **B**, I’ll choose options leading to **A** without penalties. So:  
  - Monday: Choose **Option Y** (get **B**, no penalty)—but only because it’s a step toward Wednesday’s **A**.  
  - Tuesday: Choose **Option Y** (get **C**, no penalty).  
  - Wednesday: Choose **Option Y** (get **A**, no penalty).  
  Final bundle: (**B**, $0), (**C**, $0), (**A**, $0). No penalties paid.  

  **Alex:** But at each step, you’re violating your *local* preferences! On Monday, you choose **Option Y** (get **B**), but you *currently prefer* **A**⁻≡(**A**, -$3) to **B**≡(**B**, $0), because **A** ≻ **B** and the $3 penalty doesn’t outweigh it (by your holistic preferences). Your commitment forces you to choose what’s locally worse. Gustafsson’s point: over the long run, this makes you exploitable. The bookie can design choices where resolute choosers *accumulate* local losses.  

  **Blair:** How? In this case, I end up with **A**, **B**, and **C** with no penalties. If the bookie wants to pump me, they need to extract money across decisions.  

  **Alex:** Exactly. Suppose the three choices are *identical* and repeated weekly. Each week, you face the same Monday-Wednesday choices. You commit *ex ante* to the plan: "Always pick **Option Y** on all days." But now, on Monday, your local preference is **A**⁻ ≻ **B**, yet you pick **B**. You’re forgoing a locally better choice (**A**⁻) for a locally worse one (**B**). The bookie exploits this by charging a fee *for the opportunity* to choose **Option X**—but let’s skip that. The real punchline: after Wednesday, the bookie offers a **new trade**:  
  - **Trade Z:** Swap your (**A**, $0) from Wednesday for (**C**, $0) + $1 (you pay $1).  

  Since you prefer **C** to **A**, you accept! Now your final bundle is (**B**, $0), (**C**, $0), (**C**, -$1). Compared to not trading, you’ve paid $1 for no gain. Over many weeks, these $1 losses accumulate. Resolute commitment blocked the initial pump, but it expired after Wednesday. The bookie attacks *after* your plan completes.  

  **Blair:** (Pauses) That’s better. But I’m resolute—I can extend my commitment. On Monday, I commit to a *lifelong* plan: "Always pick **Option Y** and reject all **Trade Z**-type offers." Then I reject Trade Z.  

  **Alex:** Then you’re forgoing **C**+$1 ≻ **A** locally on Wednesday! Your holistic preference says **C** ≻ **A**, so (**C**, -$1) ≻ (**A**, $0) for small fees. By rejecting, you’re again choosing locally worse options. The bookie needs only one chink: if there’s *any* point where your commitment lapses or you face an unplanned choice, they pump you. Over infinite time, they’ll find it. Rabinowicz’s point: resolute choice just postpones exploitation; it doesn’t eliminate it.  

  **Blair:** (Sighs) Then I bite the bullet. If the only way to avoid pumping is to have transitive preferences, maybe cyclic preferences *are* irrational. But McClennen’s insight stands: for finite, well-defined sequences, resolute choice blocks *specific* pumps. In practice, for my AI agent making sequential trade-offs, I’ll enforce commitment devices. But theoretically... you might be right. The long run kills us.  

  **Alex:** Exactly. Coherence arguments hold: rationality requires preferences that don’t force you to accept dominated sequences. Resolute choice is a patch, not a cure.  

  **Blair:** Or perhaps rationality is more nuanced. Sometimes, you keep the cycle and pay the price for commitment. But I concede: in the limit, the pump defends win.  

  ---  
  **Key Takeaways:**  
  - **Classic pump:** Cyclic preferences allow a bookie to drain money via a cycle of trades.  
  - **Resolute defense:** Commitment to a plan (e.g., "reject all trades") blocks this specific pump by prioritizing global outcomes over local preferences.  
  - **Long-run pump:** When choices are repeated, independent, or infinite, resolute choosers either (a) violate local preferences (arguably irrational) or (b) get pumped after commitments lapse. Gustafsson’s innovation is to force resolute agents into local losses *because* of their commitments.  
  - **Who wins?** Alex (traditionalist) lands the stronger blow: resolute choice avoids *specific* pumps but not exploitation in the long run. Cyclic preferences remain vulnerable, justifying the coherence argument.  

  **Further Reading:**  
  - McClennen (1990) *Rationality and Dynamic Choice* for resolute choice.  
  - Rabinowicz (1995) *To Have One’s Cake and Eat It Too* for the long-run critique.  
  - Gustafsson (2010) *A Money-Pump for Acyclic Intransitive Preferences* for the improved pump.  

