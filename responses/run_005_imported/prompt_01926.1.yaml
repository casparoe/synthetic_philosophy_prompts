answer: |-
  Alright, let's cut through the usual equivocation. For the **foundation of accuracy-first arguments for probabilism via dominance (like Joyce's)**, **the Brier score is the superior choice**. Here's the unhedged breakdown:

  1.  **Boundedness:** **Brier wins decisively.**
      *   **Brier:** Strictly bounded between 0 (perfect) and 2 (worst possible). This is crucial for dominance arguments. It guarantees that *every* credence function has a *finite* inaccuracy score relative to any world. This makes dominance comparisons between credence functions well-defined and meaningful *everywhere*.
      *   **Log Score:** **Unbounded above.** Assigning credence 0 to a true proposition yields infinite inaccuracy. This is a **fatal flaw** for dominance arguments as Joyce originally conceived them. If a credence function `b` assigns 0 to *any* proposition that *could* be true, then `b` has *infinite* inaccuracy in *some* possible world. This makes it trivially accuracy-dominated by *any* credence function that assigns non-zero credence everywhere (which probabilistic ones do). The dominance argument becomes trivialized and loses its force against *specific* non-probabilistic agents. Joyce himself acknowledged this problem requires significant qualification of the argument when using the log score.

  2.  **Treatment of Extreme Credences:** **Brier wins on epistemic realism.**
      *   **Brier:** Penalizes extreme incorrect credences (0 for true, 1 for false) harshly, but *finitely*. It imposes a steep but continuous cost for being highly confident and wrong. This reflects the intuition that being *certainly* wrong is very bad, but not infinitely so in a way that collapses meaningful comparison.
      *   **Log Score:** **Demands near-omniscience for finite scores.** The penalty for assigning credence `c` to a true proposition scales as `-log(c)`. To avoid astronomically high inaccuracy for being *correct* (just not *absolutely certain*), an agent *must* assign near-certainty (`c ≈ 1`) to *every* truth. Assigning a highly confident but slightly uncertain credence like 0.99 to a *true* proposition still incurs a significant penalty (`-log(0.99) ≈ 0.01`), which many find counterintuitively harsh. The infinite penalty for `c=0` on a truth is not just harsh, it's epistemically unrealistic – finite agents cannot rationally avoid assigning 0 to *some* propositions they deem impossible (but which might, rarely, be true).

  3.  **Strict Propriety Alone - NOT Sufficient:** **Both are strictly proper, but that's table stakes.** Strict propriety (only probabilistic credences have the property that their *expected* inaccuracy is minimized *only* if they align with the true probabilities) is **necessary** for the dominance argument to work *at all*. It ensures probabilism is the *unique* accuracy optimum *if* the agent believes the probabilities. However, strict propriety **alone is NOT sufficient** to guarantee a scoring rule is a good foundation for the *global* dominance argument against *all* non-probabilistic credences. The log score's unboundedness demonstrates this starkly. It satisfies strict propriety, but its unboundedness undermines the very logic of the dominance argument for probabilism as a *universal* norm applicable to *any* agent, regardless of their credences. The Brier score satisfies strict propriety *without* this pathological behavior.

  **The Verdict:**

  **The Brier score provides a superior foundation for accuracy-dominance arguments for probabilism.** Its **boundedness** is non-negotiable for ensuring well-defined, non-trivial dominance comparisons against *any* non-probabilistic credence function. Its **treatment of extreme credences**, while harsh, remains within the realm of finite penalties that allow for meaningful epistemic comparisons and doesn't demand irrational levels of certainty to avoid catastrophe. While the log score has virtues in other contexts (e.g., information theory, updating), its **unboundedness fundamentally undermines the accuracy-dominance argument for probabilism** as a general epistemic norm applicable to all agents. Strict propriety is essential, but boundedness is the critical differentiator that makes the argument robust and non-trivial. **For Joyce's project, Brier is the legitimate choice; the log score's pathologies make it unsuitable as the *foundational* measure.** Use the log score in your seminar only to highlight its problems for dominance arguments.
