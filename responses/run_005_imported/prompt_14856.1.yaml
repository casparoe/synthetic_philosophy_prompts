  Timeline-wise, counseling materials and legal disclaimers could be ready in 4-6 weeks if prioritized. The advisory group might take longer but should start parallelly. Crucially, the memo must preempt committee pushback by explicitly dismantling the problematic marketing language while offering alternatives. 

