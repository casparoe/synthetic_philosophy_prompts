prompt: |-
  ok so my advisor offhandedly mentioned that Frege's "unsaturated concept" move and the whole modern unity-of-the-proposition debate are basically just people re-running Bradley's regress in new vocab, and now ive spent three days in Appearance and Reality trying to actually get the argument instead of just parroting the SEP summary. i do semantics, not history of phil, so this 1893 prose is wrecking me. here's the bit i'm stuck on, from the "Relation and Quality" chapter:

  "But how the relation can stand to the qualities is, on the other side, unintelligible. If it is nothing to the qualities, then they are not related at all; and, if so, as we saw, they have ceased to be qualities, and their relation is a nonentity. But if it is to be something to them, then clearly we now shall require a new connecting relation. For the relation hardly can be the mere adjective of one or both of its terms; or, at least, as such it seems indefensible. And, being something itself, if it does not itself bear a relation to the terms, in what intelligible way will it succeed in being anything to them? But here again we are hurried off into the eddy of a hopeless process, since we are forced to go on finding new relations without end. The links are united by a link, and this bond of union is a link which also has two ends; and these require each a fresh link to connect them with the old. The problem is to find how the relation can stand to its qualities; and this problem is insoluble."

  what i can't reconstruct is the actual inference in the middle there. why does "the relation is something to the qualities" force a NEW connecting relation, instead of just being what relating consists in? like why can't R just directly tie a and b, full stop, no further link needed between R and its terms? bradley seems to be assuming that R being "something to" a and b is itself an extra relational fact that then needs it's own hookup, but i don't see him actually arguing for that, he just slides into the link/chain metaphor like its obvious. is there a real argument buried in there for why the tie can't be brute, or is the whole regress just riding on an unearned picture? and if you can tell, does that same assumption sneak into how people motivate the unity of the proposition problem today, or is that supposed to be a separate worry?
