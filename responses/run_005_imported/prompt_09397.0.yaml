prompt: |-
  I am designing a unit for my early modern political philosophy seminar that pairs Hobbes's *Leviathan* with the political fragments scattered through Pascal's *Pensées*, and the more I reread the latter this week, the more redundant one of my planned sessions starts to seem. In the fragment traditionally headed "Justice, force," Pascal writes that justice without force is powerless while force without justice is tyrannical, and concludes that, unable to make what is just strong, we have instead made what is strong count as just ("n'ayant pu faire que ce qui est juste fût fort, on a fait que ce qui est fort fût juste"). Elsewhere among the same notes he adds that established laws are necessarily regarded as just without examination simply because they are established, and that the whole art of overturning a state consists in tracing its customs back to their origin so as to expose their want of justice. Put together, these fragments seem to reach exactly the conclusion Hobbes reaches in *Leviathan*: legitimacy just is whatever force has succeeded in stabilizing, and a sovereign's edicts count as just in virtue of nothing more than the sovereign's capacity to make them stick.

  Given how closely the two positions line up, my inclination is to present Pascal's fragment to students as a more epigrammatic restatement of Hobbesian sovereignty theory. My plan is to set aside the theological scaffolding that surrounds it elsewhere in the *Pensées* — the material on concupiscence, the three orders, the wager — as biographical background that we can safely bracket once we have isolated Pascal's properly political argument from his religious apologetics. A colleague of mine who works on Jansenism insists that this does real violence to the text, and that the fragment cannot be lifted out of the larger apologetic project without changing what it actually claims. I confess, though, that I have trouble seeing what, philosophically, would be lost by treating it as free-standing. Could you help me anticipate the strongest version of her objection, so that I can either work it into the lecture or reassure myself that the comparison with Hobbes holds up without it?
reasoning: |-
  Okay, the user is teaching a seminar on early modern political philosophy and wants to pair Hobbes' Leviathan with Pascal's Pensées. They're concerned that one session might be redundant because Pascal's fragment on justice and force seems to align closely with Hobbes' views on sovereignty. They plan to present Pascal's fragment as a concise version of Hobbes' theory, without the theological context. However, a colleague argues that separating the fragment from Pascal's larger apologetic project distorts its meaning. The user wants help understanding the strongest version of this objection to decide whether to incorporate it into their lecture or proceed as planned.

  First, I need to recall Pascal's broader philosophy. Pascal was a Jansenist, which emphasized original sin and human depravity. His Pensées isn't just a collection of thoughts but part of an apologetic work defending Christianity. The fragments on justice and force are part of this larger argument. The user's colleague is likely concerned that isolating the fragment ignores how Pascal uses these political observations to lead to theological conclusions.

  The key difference between Hobbes and Pascal lies in their foundational premises. Hobbes grounds his theory in human nature and rational self-interest, leading to the social contract. For Pascal, human institutions are corrupt due to original sin. Justice without force is impossible not just practically but because humans are inherently flawed. The fragment isn't endorsing the status quo but highlighting a problem only divine intervention can solve.

  The user might not see what's lost philosophically by removing the theology. But Pascal's argument is that human justice is fundamentally inadequate, pointing to the need for divine justice. Without this, the fragment could be misinterpreted as cynical acceptance, whereas Pascal's intent is to show the necessity of God. The "three orders" distinction (flesh, mind, charity) is crucial here. Earthly justice belongs to the flesh, which is inferior to the order of charity where true justice resides.

  Also, Pascal's view on custom and the futility of seeking origins serves to undermine human rationality in establishing justice. This contrasts with Hobbes, who believes reason can create a legitimate sovereign. Pascal thinks tracing origins exposes injustice but offers no solution, emphasizing human helplessness without grace.

  The strongest objection is that presenting the fragment as a Hobbesian restatement misses its critical role in Pascal's apologetics. It's not a political theory but a step toward arguing for Christianity. Ignoring the theological context flattens Pascal's deeper critique of human institutions and their inherent corruption due to sin. Students might miss how Pascal uses political observations to lead to the need for divine redemption, which is central to his entire project.

  The user should consider if their goal is to compare political theories superficially or engage with the texts' full depth. Including the theological context could enrich the discussion by contrasting Hobbes' rationalist approach with Pascal's theological pessimism. Even if the session focuses on politics, acknowledging the different foundations would provide a more nuanced understanding. The colleague's point is valid; separating the fragment changes its meaning from a theological argument to a political statement, altering Pascal's intended message.
answer: |-
  Here's a breakdown of the strongest version of your colleague's objection, why it matters philosophically, and how it impacts the comparison with Hobbes:

  **The Core of the Objection: Pascal's Fragments are Apologetic, not Political Theory**

  Your colleague's core argument is that isolating these fragments fundamentally misrepresents Pascal's *project* and thus alters the *meaning* and *purpose* of the statements. The *Pensées* are not a treatise on political philosophy but notes for an *apology for the Christian religion*, specifically within the Jansenist framework emphasizing fallen human nature, concupiscence, and the necessity of grace.

  **Key Elements of the Strongest Objection:**

  1.  **Diagnosis, not Description (or Endorsement):** For Pascal, the equation of force with justice isn't a *theory of legitimacy* (like Hobbes's) but a *diagnosis of human corruption*. It's evidence of the Fall. He's describing the *tragic and inevitable consequence* of original sin in the political realm, not outlining how political order *should* or *must* function based on rational self-interest.
  2.  **Purpose: Demonstrating Human Misery and the Need for Grace:** Pascal uses these observations about justice/force and custom primarily to illustrate the "Misery of Man Without God" (a major section of the *Pensées*). The point is to show:
      *   The *inherent instability and injustice* of purely human political and social constructs.
      *   The *vanity of human reason* in establishing true justice on its own ("the heart has its reasons...").
      *   The *futility of seeking true justice in the "order of the flesh"* (the political/social/military realm).
      *   This demonstration of profound human inadequacy is meant to *prepare the ground* for the necessity of revelation, grace, and the "order of charity" (true justice found only in God).
  3.  **The Three Orders are Essential Context:** Pascal's distinction between the *Order of Flesh* (power, force, senses), the *Order of Mind* (reason, intellect, science), and the *Order of Charity* (love, grace, God) is crucial. Politics, justice-as-force, and custom belong firmly to the *Order of Flesh*. While necessary for earthly order, this order is fundamentally inferior and incapable of achieving true justice, which belongs only to the *Order of Charity*. Bracketing the three orders removes the *hierarchical framework* that gives Pascal's critique its specific meaning and force. He's not just saying earthly justice is flawed; he's saying it belongs to a categorically lower, spiritually impoverished realm.
  4.  **Concupiscence as the Engine:** The dynamic Pascal describes (force usurping justice, custom masking injustice) is driven by *concupiscence* – disordered self-love and desire stemming from the Fall. This isn't just background; it's the *causal explanation* for why human political arrangements inevitably take this form. Hobbes grounds his theory in rational self-preservation; Pascal grounds his observation in the *corruption of human nature by sin*.
  5.  **The Critique of "Tracing Origins":** Pascal's point about tracing customs to expose injustice isn't a revolutionary call to action (as it might be in a purely Enlightenment thinker). Within the apologetic framework, it serves multiple purposes:
      *   It further demonstrates the *arbitrariness and lack of true foundation* in human institutions (reinforcing misery/need for God).
      *   It subtly critiques *rationalist pride* – thinking reason alone can uncover a pure foundation for justice. For Pascal, this tracing often leads only to more force or absurdity (e.g., the "Cleopatra's nose" fragment), highlighting reason's limits.
      *   It implicitly argues that *stability*, even if founded on injustice masked as custom, might be preferable to the chaos of constant upheaval driven by the very concupiscence that created the unjust order in the first place. True reform requires a change of heart (grace), not just rational critique.

  **What is Philosophically Lost by Treating it as Free-Standing?**

  *   **The Normative Stance:** You lose Pascal's profound *pessimism* and *critique* of the human political condition. Presented alone, the fragment can sound like cynical realism or even a Hobbesian endorsement. For Pascal, it's a lament and an indictment of fallen humanity.
  *   **The Grounding:** You lose the *metaphysical and theological explanation* (concupiscence, the Fall) for *why* things are this way. Hobbes provides a naturalistic (psychological/rational) grounding; Pascal provides a theological one.
  *   **The Ultimate Purpose:** You lose the *telos* of the argument. For Hobbes, this description *is* the theory, leading to the practical conclusion of obeying the sovereign for peace. For Pascal, this description is a *step* towards proving humans need salvation they cannot achieve politically or rationally. The political observation serves a theological end.
  *   **The Concept of "Justice" Itself:** Hobbes defines justice *as* the command of the sovereign. Pascal implies a *transcendent standard* of true justice (belonging to the Order of Charity) against which all earthly "justice" is measured and found radically wanting. Bracketing the theology collapses this crucial distinction.

  **Impact on the Comparison with Hobbes:**

  1.  **Surface Resemblance, Foundational Divergeance:** Your instinct is correct – there's a powerful surface resemblance in the *description* of political reality. Both see established power as the de facto source of what is *called* just. **The crucial difference lies in the *interpretation*, *evaluation*, and *explanation* of this reality.**
  2.  **Hobbes:** Provides a *positive theory of legitimacy* based on rational self-interest and the social contract. Might makes right *is* right, *because* it secures peace, which is the highest political good. The sovereign's command *defines* justice. The theory is self-contained within the political realm.
  3.  **Pascal (in Context):** Provides a *theological critique* of human politics. Might makes right is a *symptom* of human sinfulness and the *absence* of true justice. "Justice" based on force is a pale, corrupted shadow of true Justice (God). The observation points *beyond* politics to the need for divine grace. The political realm is inherently incapable of achieving its own ideal.
  4.  **Is the Comparison Valid?** Yes, but the *meaning* of the comparison changes dramatically with or without context.
      *   **Without Context:** The comparison highlights a shared *realist observation* about how power functions in the world. Pascal becomes a pithy Hobbesian.
      *   **With Context:** The comparison highlights a stark *contrast in evaluation and grounding*. Both observe the same phenomenon, but Hobbes *endorses* it as the rational solution, while Pascal *condemns* it as evidence of human depravity requiring divine remedy. It becomes a comparison between a self-sufficient political realism and a theologically grounded political pessimism.

  **Recommendation:**

  1.  **Acknowledge the Theological Context Briefly:** Don't bracket it entirely. Explicitly tell students: "Pascal writes these fragments not as a political theorist, but as a Christian apologist aiming to show the misery of humanity without God. His Jansenist background emphasizes original sin (concupiscence) as the root cause of the dynamic he describes. For him, this observation points to the need for divine grace, not just a theory of sovereignty."
  2.  **Highlight the Shared Observation, Contrast the Framing:** "Both Hobbes and Pascal offer a strikingly similar *diagnosis* of political reality: what is called 'just' is fundamentally tied to established power and force. However, they embed this observation in radically different frameworks. Hobbes builds a *theory of legitimacy* upon it, arguing this is how rational beings *achieve* peace. Pascal uses it as *evidence of human corruption*, arguing this shows why humans *need* God to achieve true justice."
  3.  **Use Pascal to Challenge Hobbesian Complacency:** Frame Pascal's fragment *in light of its context* as a profound challenge to the Hobbesian project: "Pascal might ask Hobbes: Does your Leviathan, born of fear and sustained by force, truly escape the concupiscence and inherent injustice I diagnose? Or is it merely the most successful, and therefore most 'just,' manifestation of the same fallen human condition?" This leverages the theological depth without requiring a deep dive into Jansenism.
  4.  **Concede the Point, But Justify the Pedagogical Focus:** You can say: "My colleague is absolutely right that Pascal intended this as part of a larger theological argument. However, for the specific purpose of this session – examining *descriptions of the relationship between power and legitimacy* in early modern thought – isolating this fragment allows us to see its powerful resonance with, and potential critique of, Hobbes's purely political theory. We are examining a *political insight* that Pascal deployed for theological ends."

  **Conclusion:** Your colleague's objection is strong and philosophically significant. Removing the fragments from their apologetic context *does* transform Pascal from a theologian diagnosing human misery into a political realist, obscuring his profound critique of the very possibility of human justice. However, the surface resemblance to Hobbes is undeniable and pedagogically useful. The best approach is to **explicitly acknowledge the difference in context and purpose** while still drawing out the powerful parallel in their *observation* of political reality. This allows you to use Pascal both to illustrate a Hobbesian-like realism *and* to introduce a profound theological challenge to the self-sufficiency of that realism.
