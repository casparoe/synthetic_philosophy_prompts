      ∀x ¬¬(P(x) ∨ ¬P(x))   is provable (because for each x, we have ¬¬(P(x) ∨ ¬P(x)) as above).

  But to get ¬¬∀x (P(x) ∨ ¬P(x)) we would need to push the double-negation inside the universal quantifier. However, we have:

      ¬¬∀x Q(x) is not equivalent to ∀x ¬¬Q(x)

  in intuitionistic logic. Specifically, we can prove:

      ∀x ¬¬Q(x) → ¬¬∀x Q(x)

  but the converse is not provable.

  Therefore, if we take a classical theorem that is of the form ∀x (P(x) ∨ ¬P(x)), then ¬¬∀x (P(x) ∨ ¬P(x)) is not provable in intuitionistic logic because it would require that we can get from ¬¬∀x ... to ∀x ... which we cannot.

