      ¬¬(¬∀x P(x) → ∃x ¬P(x))

  which is a double-negation in front of an implication. However, the problem is that the double-negation translation for predicate logic requires a more subtle approach: we must translate the formula by putting double negations not only at the top level but also at key points inside (like in front of atomic formulas and in front of existential quantifiers).

  The Gödel-Gentzen negative translation (and also the Kolmogorov translation) does exactly that. For example, in the Gödel-Gentzen translation, we define a translation * such that:

  - For an atomic formula P, we let P* = ¬¬P.
  - (A ∧ B)* = A* ∧ B*
  - (A ∨ B)* = ¬(¬A* ∧ ¬B*)   [or sometimes defined as ¬¬(A* ∨ B*), but the idea is to make sure that the disjunction is treated classically only under double negations]
  - (A → B)* = A* → B*
  - (¬A)* = ¬A*
  - (∀x A)* = ∀x A*
  - (∃x A)* = ¬∀x ¬A*   [this is because in intuitionistic logic, we don't have ∃x A* equivalent to ¬∀x ¬A*, so we define it that way to force the classical meaning]

