  First, I need to understand ECLW. It's a concept from decision theory that suggests if there are many similar agents in a large universe, we should act as if we've made a bargain to consider each other's values, even if we can't interact. So, by donating to causes that others value, we might encourage them to do the same for our causes. The members arguing for the split think this maximizes expected value when considering these correlations.

