answer: |-
  Your question cuts to the heart of a profound tension in formal epistemology, and Lewis's **Principal Principle (PP)** is indeed essential—but its application hinges critically on the unresolved **admissibility problem**. Here's how the PP and its limitations directly inform your dilemma of weighing Metaculus (70%) against private evidence:

  ### 1. **The Principal Principle (Simplified)**
     - **Core claim**: Your subjective credence (Cr) in event *A* should equal the known objective chance (Ch) of *A*, *conditional on your total evidence*:
       > **Cr(*A* | *Ch*(*A*) = *x* ∧ *E*) = *x***
     - **Key constraint**: This holds only if your total evidence *E* is **admissible** *with respect to the chance claim*.

  ### 2. **Admissibility: The Critical Ambiguity**
     - **Admissible evidence**: Does *not* "screen off" the chance. Typically includes:
       - Historical/law-like information (e.g., "This coin is fair").
       - *But not* "inadmissible" evidence that directly concerns the outcome (e.g., a future-telling oracle).
     - **Lewis's problem**: He defined admissibility negatively, leaving real-world cases (like yours) unresolved. Crucially:
       > **Prediction markets/Metaculus are *not* "objective chances"** — they are *evidence about* chances.  
       → The PP doesn't *directly* command deference to them. Instead, they serve as *expert functions*.

  ### 3. **Implications for Your Scenario**
     - **Baseline deference**: If your private evidence (*P*) were **inadmissible** (e.g., a crystal ball vision), you *should* ignore the market and set Cr(*A*) = 1 or 0.  
       - **But**: *P* is likely **not obviously inadmissible**! It may be:
         - **Unshared evidence** (e.g., insider knowledge from your job),
         - **Unconventional analysis** (your pattern hunch),
         - **Alternative reference class** (e.g., "This feels more like *X* than *Y*, and *X* has 90% historical success").
       → *This is where Lewis's vagueness dominates*.

  ### 4. **Resolving the Ambiguity: Key Filters**
  When deciding whether to override the market’s 70% with your private evidence, apply these tests derived from PP’s spirit:
     - **A. Is *P* "encodable" into the market?**  
       - If *P* is **theoretically shareable** (e.g., "My company's internal sales data shows collapse next quarter"), it *should* be priced but isn't.  
         → **Action**: Discount Metaculus as incomplete; weight *P* heavily.  
       - If *P* is **inherently private** (e.g., "I have a gut feeling from years of experience"), it's closer to Lewis's "oracle" problem.  
         → **Caution**: This risks being *inadmissible noise*—track your past calibration to justify use.
     - **B. Does *P* directly target the outcome?**  
       - Lewis’s crystal ball is inadmissible because it *bypasses* chance mechanisms.  
         → **Analogy**: If *P* is a direct insight about *A* (e.g., "I saw the leaked election result"), override the market.  
         → If *P* is indirect (e.g., "I modeled this differently"), treat it as *updating* the chance estimate.
     - **C. Is your reference class defensibly causal?**  
       - Overriding based on a "different reference class" often commits the **reference-class fallacy**.  
         → **Test**: Is your class *objectively better-grounded* than the market's? (e.g., "Metaculus uses general AI timelines; I work on LLMs and see specific roadblocks").  
         → **Weak case**: "I trust my intuition more" (likely cognitive bias).
     - **D. Calibration accountability**:  
       - **Private evidence *P* should "earn its keep"**: If you often override aggregates and are *systematically miscalibrated*, *P* is probably inadmissible noise.  
       - **Metaculus earns weight**: Its 70% reflects crowd calibration. Unless *P* clears the filters above, default to PP-like deference.

  ### Practical Synthesis: Weighting Your Belief
  | **Private Evidence (*P*)** | **Weight vs. Market** | **Justification** |
  |----------------------------|------------------------|-------------------|
  | **Encodable insider info** | High (e.g., 80-90% credence) | Market lacks critical data; *P* is admissible expertise |
  | **Novel causal model** | Moderate (e.g., 75-80%) | Updates chance estimate; track calibration |
  | **Unexplained hunch** | Low (<72%) | High risk of inadmissible noise; distrust yourself |
  | **Self-flattering reference class** | Minimal (70-71%) | Likely fallacy; market aggregates more robust data |

  ### Why Yudkowsky’s "Immodesty" Matters Here
  - **Modest epistemology**: "I should defer to the 70% unless proven wrong."  
    → *Ignores that markets lack your unique evidence*.
  - **Immodest (Yudkowsky)**: "I must *integrate* all evidence rationally."  
    → *Requires* you to treat *P* as admissible *if it survives scrutiny*.
  - **Lewisian balance**: Use PP as a *default*, but **override aggressively** when *P* is:  
    (a) Shareable-but-unshared,  
    (b) Causal/direct,  
    (c) Historically reliable *for you*.

  **Conclusion**: The PP doesn’t resolve your dilemma—it *frames* it. **Override Metaculus only if your *P* clears the admissibility bar**: it should be causally relevant, theoretically encodable, and backed by your proven calibration. Otherwise, the market’s 70% *is* your best estimate. Track your overrides: if you’re often wrong, your "private evidence" is likely inadmissible intuition. The true failure mode isn’t immodesty—it’s *uncalibrated* immodesty.
