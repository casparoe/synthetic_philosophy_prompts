  First, I need to recall the key issues. Martin's electro-fink wire shows a disposition (being live) that doesn't align with the conditional because an external device changes the property when tested. Lewis's 1997 fix adds that the intrinsic causal basis must remain the same during the test. But masks, like styrofoam around a fragile vase, block the manifestation without changing the disposition or its basis, so the conditional fails even with Lewis's clause.

