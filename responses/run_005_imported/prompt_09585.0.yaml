  First, I need to recall Hume's core principles. Hume was all about empiricism and rejecting necessary connections. He argued that our idea of causation comes from constant conjunction and mental habits, not any real necessity. For Hume, laws are just descriptions of regularities we observe, with no underlying metaphysical glue.

  Now, looking at Lewis's BSA, it's more complex. It uses natural properties, objective chances, and the Principal Principle. The user points out that Lewis's system relies on these elements to avoid triviality. But Hume would likely see "natural properties" as reintroducing something like universals or essences, which he rejected. Hume's properties are just bundles of perceptions, so privileging some as "elite" might seem metaphysical to him.

  Then there's the Principal Principle. Hume was skeptical about induction and uniformity of nature. Lewis's system assumes that simplicity and strength are guides to truth, but Hume's problem of induction undercuts that. Hume would argue that we can't justify projecting past regularities into the future, so picking a "best" system based on simplicity assumes what needs proving.

  Quantum entanglement and Humean supervenience are another issue. Lewis's idea that everything supervenes on local matters of fact clashes with entanglement's non-locality. Hume might see this as a failure of the Humean project, showing that the world isn't reducible to local qualities, which aligns with anti-Humean critiques like Maudlin's.

  But where might Hume agree? He valued psychological naturalness and simplicity in explanations. The BSA's pragmatic elements might resonate with Hume's focus on human psychology. Still, the metaphysical commitments in Lewis's system would likely make Hume balk.

  The user wants specifics: where would Hume dig in his heels? Definitely on natural properties, objective chances undermining his skepticism, and the Principal Principle. The uniformity assumption in simplicity is another sticking point. Quantum entanglement would be a major problem for Humean supervenience.

  The user also mentioned avoiding the easy answer that Hume liked simplicity so he'd approve. I need to emphasize the tensions, especially where Lewis introduces elements Hume would see as metaphysical. Highlighting Hume's skepticism about induction and necessity is key here.

  I should structure the response to contrast each component of BSA with Hume's views. Start with natural properties, then objective chance and Principal Principle, induction problem, and finally supervenience and entanglement. Conclude by noting where Hume might find common ground (pragmatism) but stress the divergences. This will help the user present a nuanced view in their seminar, showing students that while the slogan sounds Humean, the technical details aren't.
answer: |-
  Here’s a reconstructed Humean response to Lewis’s Best System Analysis (BSA), designed to highlight the tensions beyond the superficial slogan. Hume would likely see BSA as a sophisticated but ultimately unfaithful extension of his project, reintroducing metaphysical commitments he explicitly rejected. Key points of divergence:

  ### 1. **Natural Properties: Smuggling Back "Real Essences"**  
     - **Hume's View:** All properties are "simple ideas" derived from impressions. No property is metaphysically privileged; distinctions arise from custom and psychological associations (*Treatise*, 1.1.7). "Resemblance" is a relation perceived by the mind, not an objective feature of the world.  
     - **Objection to Lewis:** Privileging "natural" or "elite" properties as objective joints in nature would strike Hume as resurrecting the very "real essences" he dismantled. For Hume, properties are *human-relative*: their "naturalness" is a psychological habit, not an ontological foundation. Lewis’s move to avoid gerrymandering relies on a metaphysical structure Hume would deny as ungrounded in experience.  
     - **Hume’s Verdict:** *Digs in his heels*. Natural properties reintroduce a covert necessary connection between predicates and reality.

  ### 2. **Objective Chance & the Principal Principle: Hidden Necessity**  
     - **Hume's View:** Probability is epistemic—a measure of uncertainty based on past observations (*Enquiry*, §6). There is no "objective chance" in nature; only ignorance of causes.  
     - **Objection to Lewis:**  
       - The Principal Principle (PP) ties rational credence to objective chances, implying chances are *real features of the world*. Hume would see this as a metaphysical posit: if chances govern outcomes, they function as *causal necessities* under another name.  
       - The "undermining futures" problem (where possible futures contradict current chances) exposes this: if chances *constrain* possible histories, they are *modally loaded*—precisely what Hume’s regularity theory avoids.  
     - **Hume’s Verdict:** *Digs in his heels*. Objective chance is necessity in probabilistic clothing.

  ### 3. **Simplicity & Strength: The Induction Problem Revisited**  
     - **Hume's View:** Simplicity and strength in systems are psychological preferences, not truth-tracking virtues. We favor them due to custom and mental inertia—*not* because nature is simple (*Enquiry*, §4–5).  
     - **Objection to Lewis:** BSA assumes simplicity and strength are reliable guides to *future* regularities. But Hume’s induction skepticism shows this assumption is circular: we cannot justify projecting simplicity/stability without presupposing uniformity. BSA’s "best" system implicitly relies on the uniformity of nature Hume argued was unjustifiable.  
     - **Hume’s Verdict:** *Digs in his heels*. BSA’s criteria smuggle in an *unearned* commitment to uniformity.

  ### 4. **Humean Supervenience & Quantum Entanglement**  
     - **Hume's View:** All facts supervene on *perceptions* (impressions/ideas), which are "loose and separate" (*Treatise*, 1.1.4). No commitment to a specific ontology of spacetime.  
     - **Objection to Lewis:**  
       - Quantum entanglement violates *local separability*: states of particles are non-supervenient on intrinsic local properties. Humean supervenience (HS) thus fails as a global thesis.  
       - Hume might note this as *empirical confirmation* of his core insight: the world need not conform to our intuitive (localist) picture. Forcing HS onto quantum mechanics reveals BSA’s *metaphysical baggage*—whereas Hume’s phenomenalism is agnostic about underlying structure.  
     - **Hume’s Verdict:** *Partially sympathetic but digs in*. HS’s failure shows Lewis’s *specific* supervenience base is untenable, but Hume would reject any supervenience claim that implies objective modal structure.

  ### Where Hume *Might* Be Won Over  
     - **Pragmatic Value:** Hume might grant BSA as a *psychological* or *practical* tool for organizing expectations (aligning with his view of causality as a "guide to life"). He could accept it as a refined version of custom—but *only* if stripped of claims to objective truth.  
     - **Rejection of Miracles:** BSA’s strength criterion (penalizing exceptions) could appeal to Hume’s skepticism toward miracles (*Enquiry*, §10), as it formalizes the rejection of ad hoc explanations.  

  ### Conclusion: Hume vs. Lewis  
  Hume would see BSA as a **covertly anti-Humean project**:  
  - **Natural properties** reintroduce real essences.  
  - **Objective chance** reintributes necessity.  
  - **Simplicity/strength** presupposes uniformity.  
  - **HS + entanglement** exposes its metaphysical overreach.  

  He would conclude that Lewis, despite his intentions, rebuilt the "necessary connections" he claimed to expel—now hidden in the machinery of naturalness, chance, and supervenience. For your seminar, stress that Hume’s *induction problem* is the fatal blow: BSA’s "best" system cannot be justified without circularity, as it assumes the very uniformity Hume showed we cannot ground. Lewis’s system is not "Humean" but a *revision* that sacrifices Hume’s radical empiricism for systematic power.  

  **Teaching Tip:** Frame BSA as Lewis’s *response* to Hume’s gaps (e.g., triviality of gerrymandered predicates)—but emphasize that solving these gaps requires tools Hume would reject. Contrast the *slogan* (vintage Hume) with the *machinery* (neo-scholastic metaphysics).
