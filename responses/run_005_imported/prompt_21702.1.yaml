  Then there's the part about "necessarily is when it is." Aristotle says that when the battle happens, it's necessary at that time, but not necessary beforehand. The user thinks this assumes the conclusion that the future is open. But Aristotle's point is that actual events become necessary only as they occur. Beforehand, both possibilities exist. The necessity shifts from logical (the disjunction) to temporal (the actual event). The user might be missing this temporal aspect. 

