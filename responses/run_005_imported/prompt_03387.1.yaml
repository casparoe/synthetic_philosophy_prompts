  The Ulysses analogy is crucial. Sam will use it to argue that binding oneself to a plan is rational when you predict future irrationality. Alex counters that Ulysses *changes his evaluation* of the Sirens—he doesn't still prefer to steer toward them while tied up. Similarly, if the colleague still prefers C to A when offered, refusing is incoherent.

  Tension points: 
  1. **Coherence of refusal**: If you prefer C to A *now*, refusing the trade seems to violate preference maximization. 
