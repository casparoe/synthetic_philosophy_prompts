  The scenario involves a colleague with cyclic preferences (A > B, B > C, C > A) being money-pumped. Two philosophers argue: one says this proves intransitive preferences are irrational and must be revised. The other argues that resolute choice—committing to a plan like taking only the first two trades—can avoid exploitation without changing preferences.

