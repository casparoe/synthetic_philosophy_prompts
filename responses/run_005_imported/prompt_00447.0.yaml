prompt: |-
  So this happened to me last week and I still haven't shook it off. I was driving back from giving a guest lecture at another campus, running a bit behind schedule, and passed a car pulled over on the shoulder with its hazards on -- someone standing next to it looking pretty stressed out. I didn't stop, told myself someone else would get to it, plus I had a stack of exams waiting on me at home. That same evening I also skipped my usual $50 donation to the effective giving fund I support, figuring i'd just double up next month instead. Over dinner I mentioned both things to my partner, who's not in philosophy, and she said they're basically the same kind of failure -- that the only difference is one's vivid and close and the other isn't, and that shouldn't matter morally. I pushed back hard, saying the roadside case felt way more urgent to have blown off, but I couldn't actually explain why beyond "it just does."

  I teach intro ethics every fall and I'm embarrassed that I can't sort through my own case cleanly. Is there a principled reason the roadside omission should weigh heavier on my conscience than the donation one, or is my partner right that this is just distance and vividness messing with my judgment and I should feel equally bad about both? Curious how you'd talk me through this.
reasoning: |-
  Okay, let me unpack this user's dilemma. A philosophy professor feels guilty about two omissions: not helping a stranded driver and skipping a charitable donation. His partner claims both are morally equivalent failures of assistance, differing only in vividness. The user struggles to articulate why the roadside incident feels worse despite teaching ethics professionally.

  Hmm, this is fascinating because it hits where academic theory meets lived morality. The user's embarrassment about not resolving this is palpable - he likely prides himself on clear ethical reasoning, yet finds himself tangled in his own case. His partner's challenge clearly rattled him, hence reaching out for analysis.

  First, let's map the key differences between the two scenarios. The roadside situation involves: immediate physical presence, identifiable victim, clear capacity to help (AAA call, ride offer), time sensitivity, and low-cost intervention. The donation scenario is abstract (statistical lives), physically distant, non-urgent (delaying won't kill anyone tomorrow), and involves fungible money rather than personal aid.

  The partner's "vividness" argument has merit - psychological research shows we respond more to salient, singular victims. But is that the whole story? Ethically speaking, proximity creates special obligations. If I see a child drowning right before me, I'm morally required to help in ways I'm not required to send money to save distant children. Peter Singer would disagree, but most ethicists recognize proximity matters.

  Also noteworthy: the roadside help would've been direct assistance ("I helped that person"), while donations are mediated ("my money helped someone"). The first engages personal responsibility more viscerally. And let's not overlook the user's professional context - as an educator, he models civic behavior; stopping for stranded motorists is a social expectation in ways charitable giving isn't.

  The exams-waiting excuse feels flimsier for the roadside case precisely because the required time investment was trivial compared to donation money. Calling AAA takes 3 minutes; $50 represents hours of work. Yet paradoxically, the smaller omission feels weightier - because consequences were more immediately knowable? We can be certain the stranded driver suffered inconvenience, while skipping one donation likely changed no specific life.

  Perhaps the deepest cut is about moral identity. The roadside moment challenged his self-concept as a helpful person in real-time, whereas donation delays are common and faceless. His partner cleverly exposed this inconsistency - but may underestimate how context shapes moral obligations. I'll need to validate both perspectives while showing why the intuitions differ.
answer: |-
  You've hit on a profound ethical tension that philosophers actively debate. Your partner makes a compelling point about moral distance, but your discomfort isn't just irrational bias. Here's how I'd break it down, drawing from ethical frameworks you teach:

  **Arguments for Why the Roadside Omission *Might* Be Different (and Why You Feel Worse):**

  1.  **Proximity & Urgency:**
      *   **Physical Presence:** You were *immediately present* with a concrete, identifiable person in distress. Your ability to assess need and provide direct help was unambiguous. Ethics of care and virtue ethics emphasize responsiveness to those directly before us.
      *   **Time Sensitivity:** The stranded driver's predicament was *immediately* stressful and potentially unsafe (e.g., breakdown on a busy road). Delaying help increased their risk/discomfort *right then*. The donation delay, while impactful statistically, doesn't cause an immediate, identifiable harm *today*; the harm is diffused and future-oriented.

  2.  **Specificity of Need & Capacity:**
      *   **Identifiable Victim:** You saw *one specific person* in clear, observable distress. Psychological research (the "identifiable victim effect") and ethics of care show we're wired to respond more strongly to singular, visible suffering than abstract statistics.
      *   **Clear Capacity & Low Cost:** Your potential action was simple, low-cost, and within your direct capacity (e.g., calling roadside assistance, offering a short ride). The barrier was minor inconvenience vs. your time. Skipping the donation involved a larger financial cost ($50) deferred for a practical reason (time pressure/grading).

  3.  **Role-Relative Obligations & Expectations:**
      *   **Samaritanism:** Societal norms and often legal frameworks (Good Samaritan laws) create a *minimal expectation* to offer basic aid to someone in immediate physical distress when it's safe and low-cost. There's no equivalent societal or legal expectation for charitable donations at a specific moment.
      *   **Community Membership:** Helping a fellow traveler in a shared physical space feels like a basic duty of communal existence. Charitable giving, while vital, operates in a different sphere of beneficence beyond core communal duties for many ethical systems.

  4.  **Epistemic Certainty:**
      *   You *knew* with high certainty that help was needed and that *your* specific action *could* directly alleviate it *now*. With the donation, the need is vast but abstract; your specific $50's impact is statistically significant but not causally certain to save a *particular* life immediately.

  **Arguments for Your Partner's View (Moral Equivalence):**

  1.  **Consequentialist Core (Singer's Pond Analogy):**
      *   If we accept Peter Singer's principle ("if it is in our power to prevent something bad from happening, without thereby sacrificing anything of comparable moral importance, we ought, morally, to do it"), both cases are failures. Preventing the stress/inconvenience of the stranded driver is good, but preventing death/disease via the donation is *objectively greater* in scale and moral weight. Distance/vividness *shouldn't* matter; only the consequence does. By this logic, *failing to donate regularly is likely the greater moral failing*.
      *   **The "Someone Else" Fallacy:** Using "someone else will help" as an excuse applies equally poorly to both scenarios. It's a cognitive bias to avoid responsibility.

  2.  **The Arbitrariness of Vividness:**
      *   Your partner is right that the vivid, proximate case triggers stronger emotional responses (guilt, empathy) due to evolutionary psychology. However, from an impartial moral standpoint, the suffering prevented by the donation is just as real, even if unseen. Relying on vividness leads to inconsistent and potentially unjust moral prioritization.

  3.  **The Harm of Delay:**
      *   While the donation harm is diffused, delaying effective giving *does* have real consequences. Programs lose predictable funding, opportunities to leverage funds efficiently are missed, and suffering that could have been alleviated continues. The harm isn't *less* real; it's *less visible*.

  **Why You Can't Shake It Off (and Why That Might Be Okay):**

  1.  **The Personal Encounter:** You directly witnessed the distress your omission (potentially) prolonged. This creates a powerful personal narrative of failure ("I saw her face, I drove on"). The donation omission lacks this visceral, autobiographical memory.
  2.  **Violated Self-Image:** As someone who teaches ethics and likely values helpfulness, failing a simple, low-cost, immediate test of that virtue *in person* strikes deeply at your self-concept. It feels like a more direct betrayal of who you aspire to be in daily life.
  3.  **Uncertainty & Regret:** You don't *know* if the driver got help quickly. This uncertainty fuels regret. With the donation, you know you'll double up, mitigating the feeling of permanent loss.

  **A Principled Path Forward:**

  1.  **Acknowledge the Difference in *Experience*, Not Necessarily Ultimate Moral Weight:** Your partner is likely correct that *impartially*, preventing death/disease through effective giving outweighs preventing roadside inconvenience. Singer's argument is robust. However...
  2.  **Recognize the Moral Significance of Proximity & Urgency:** Ethicists like Bernard Williams and Michael Stocker argue that morality isn't just about impartial calculus; it's about personal integrity, relationships, and responding to the concrete demands of the situation before you. Failing a clear, immediate, low-cost duty to a specific person *present* carries a unique moral resonance tied to our nature as social beings. This doesn't negate duties to the distant, but it acknowledges a different *kind* of moral claim.
  3.  **Two Different Kinds of Omissions?** Consider this:
      *   **Roadside:** A failure in a **minimal duty of mutual aid/responsiveness** expected within a shared physical community when need is immediate, specific, and help is easy.
      *   **Donation:** A (temporary) failure in a **broader duty of beneficence** to alleviate suffering beyond our immediate circle, requiring systematic action and involving resource allocation.
  4.  **Guilt as a Guide, Not a Tyrant:** Your guilt about the roadside omission is a sign of a well-calibrated moral compass attuned to immediate human need. Use it as motivation to act next time. Let your (lesser) guilt about the donation delay motivate you to reinstate it promptly and perhaps even increase your commitment. Don't let the vividness of one blind you to the importance of the other, but don't dismiss the moral significance of responsiveness to the concrete either.

  **Conclusion:** Your partner is right that distance and vividness powerfully distort our moral intuitions, and that impartially, effective giving likely prevents greater harm. **However, she may underestimate the genuine moral weight that proximity, immediacy, specificity, and low cost add to an obligation.** Failing to help the stranded driver feels heavier because it was a direct, personal failure of responsiveness to a concrete, immediate need right in front of you – a basic expectation of social existence. The donation omission is a failure of broader beneficence, crucial but operating in a different, more abstract register.

  Instead of demanding equal guilt, acknowledge that both omissions matter, but they engage different aspects of your moral character and different kinds of duties. Let the roadside guilt remind you to act on immediate opportunities for low-cost aid. Let the donation lapse remind you of the critical, ongoing duty to address distant suffering systematically. Your discomfort is a sign of moral seriousness – use it to fuel more consistent action on *both* fronts moving forward.
