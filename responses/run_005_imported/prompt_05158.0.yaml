prompt: |-
  Quick bit of context: I run a Tuesday evening reading group with my grad students on moral psychology, and last week's session was on the situationist critique of virtue ethics -- Doris's chapter on Milgram and the Darley & Batson "Good Samaritan" seminarians study, plus Harman's fundamental attribution error paper. I've taught this material more times than I can count, but I dont think I've ever had students turn the Doris-vs-Kamtekar debate into an actual personal argument before, which is what happened with two of my students, Owen and Kate, who kept going after the group broke up and apparently continued over beers. I only got it secondhand from both of them the next day, so I've tried to reconstruct the moves fairly rather than however each of them wants to remember "winning."

  (1) Owen opened with: the data settle it. Milgram got something like two-thirds of ordinary volunteers to run the shock generator all the way up despite the "victim" screaming, and Darley & Batson found that whether a seminary student was in a hurry predicted whether he'd stop for a man slumped in a doorway far better than whether he'd just been assigned to prepare a talk on the parable of the Good Samaritan itself. Throw in Mischel's old finding that cross-situational consistency in behavior rarely gets above a correlation of about 0.3, and you get: the robust, reliably-manifesting traits virtue ethics wants us to cultivate -- honest, compassionate, brave across the board -- just aren't there to cultivate. (2) Kate said this only refutes a "globalist" picture of character that Aristotle never held anyway: he thought full virtue was rare and that most people sit somewhere between akrasia and vice, so it's no surprise a bunch of seminarians or undergrads don't display robust virtue under pressure -- the studies are testing ordinary people for a property the theory never predicted they'd have. (3) Owen said that's a hollow victory: if virtue is that rare, virtue ethics can't deliver the practical guidance it's famous for, since we have no reliable test for whether character education ever produces it, whereas we do have good evidence that just changing the situation (less rushed, different framing) reliably changes behavior -- so surviving as a claim about a rare ideal isnt the same as surviving as useful advice for the rest of us. (4) Kate replied that this conflates two different questions -- what's worth becoming versus what's currently the most efficient lever for shifting population behavior -- and added, following Kamtekar, that you can't even describe the experiments without character-vocabulary creeping back in: Milgram's obedient subjects are most naturally read as displaying a vice, excessive deference against their own better judgment, not as evidence that trait-talk is empty. (5) Owen shot back that this redescription move is too cheap, because it's unfalsifiable -- you can always relabel whatever happened as "revealing a trait" after the fact, with no advance way of saying which trait fires in which situation, so nothing was actually predicted or explained.

  Neither of them budged and I honestly think they're each partly right, which isn't much use to either of them. Could you referee this properly -- go move by move, rate each one from -2 (clearly wrong) to +2 (clearly right), and say briefly why? I'm especially curious whether Kate's move (2) is a principled restriction on the theory's scope or a rescue that ends up costing more than it saves by move (3), and whether Owen's unfalsifiability charge in (5) actually sticks against Kamtekar-style redescription or proves too much (since plenty of respectable theories redescribe evidence in light of themselves). If there's something the literature already handles that neither of them reached for, flag it too. End with a one-line verdict: on balance, who's closer to right, Owen or Kate?
reasoning: |-
  Okay, the user is a professor running a grad reading group on moral psychology, specifically the situationist critique of virtue ethics. Two students, Owen and Kate, had a heated argument about Doris vs. Kamtekar. The professor wants me to referee their debate move by move, rating each argument on a scale from -2 to +2, explaining why, and ending with a verdict on who's closer to being right.

  Let me break down each move. Owen's first point (1) uses empirical studies (Milgram, Darley & Batson, Mischel) to argue that cross-situational consistency is low (around 0.3 correlation), challenging virtue ethics' idea of robust character traits. This seems strong because the data does show situational factors heavily influence behavior. But Kate counters in (2) that Aristotle never claimed most people have robust virtues—he thought true virtue is rare, so these studies test ordinary people for something virtue ethics doesn't attribute to them. That's a fair point from Kamtekar, as Aristotle did emphasize virtue's rarity. 

  Then in (3), Owen argues that if virtue is that rare, virtue ethics loses practical value for guiding behavior, since situational changes are more reliable. This hits a weak spot—if the theory can't guide most people, its utility is limited. Kate's response in (4) distinguishes between ideals and practical levers, and notes that trait-language is unavoidable (e.g., calling Milgram participants "deferential"). This draws from Kamtekar's observation that we naturally use virtue/vice terms to describe behavior. Finally, Owen in (5) calls this unfalsifiable—a valid concern, as redescribing after the fact without predictive power might make the theory unscientific.

  I need to rate each move. For (1): +1.5—solid evidence, but doesn't fully engage with virtue ethics' nuances. (2): +1—correct about Aristotle, but may downplay the critique's force. (3): +2—excellent point about practical relevance. (4): +0.5—valid distinction, but the redescription point is weaker. (5): +1.5—strong critique of unfalsifiability, though it might oversimplify.

  For the verdict: Owen is closer to being right on balance. His emphasis on practical guidance and falsifiability addresses deeper issues in applying virtue ethics, while Kate's defenses, though insightful, risk making the theory less actionable or testable. Key literature gaps: neither mentioned Annas's skill analogy or Alfano's work on trait cultivation—these could enrich the debate.
answer: |-
  Here's a move-by-move analysis, rated on your requested scale (-2 to +2), followed by a verdict:

  **Move-by-Move Analysis:**

  1.  **Owen (1): Data settles it against robust traits.**  
      *Rating: +1.5*  
      *Why:* Owen correctly highlights the *prima facie* challenge posed by Milgram, Darley & Batson, and Mischel. The data undeniably shows powerful situational influences and low cross-situational consistency (*r*~0.3) for many behaviors. This *does* challenge a simplistic "globalist" view where virtues/vices predict behavior across vastly different situations with high reliability. However, it doesn't *automatically* settle the debate against all plausible forms of virtue ethics (-0.5 deduction).

  2.  **Kate (2): Aristotle didn't hold a globalist view; virtue is rare.**  
      *Rating: +1*  
      *Why:* Kate is fundamentally correct that Aristotle emphasized the rarity of full virtue (*hexis*) and the prevalence of *akrasia* (weakness of will) and vice. The studies test ordinary people under pressure, not exemplars. Kamtekar and others (e.g., Annas, Swanton) argue convincingly that situationists often attack a straw man of virtue ethics. However, this doesn't *fully* defang the critique, as Owen's next move highlights. The rarity point needs to address the *practicality* of virtue ethics.

  3.  **Owen (3): If virtue is that rare, virtue ethics lacks practical guidance.**  
      *Rating: +2*  
      *Why:* This is Owen's strongest and most important point. It targets the core *practical promise* of virtue ethics. If cultivating robust, reliable character traits is extraordinarily difficult and rare, and we lack reliable methods to verify their development or predict their manifestation, then VE struggles as a practical guide for moral education and everyday life. Situationist approaches (nudges, situational engineering) *do* offer empirically supported, scalable interventions for improving behavior. Kate needs to address how VE provides actionable guidance for the non-sage.

  4.  **Kate (4): Conflates ideals vs. efficiency; trait-vocabulary is inescapable.**  
      *Rating: +0.5*  
      *Why:* The distinction between "what's worth becoming" (ideals) and "efficient behavior change" (situationism) is valid and important. VE primarily offers an account of the good life and character, not just behavior modification. Kamtekar's point about trait-vocabulary being necessary for *description* is also insightful (+). We naturally describe Milgram participants as "obedient" or "deferential to authority" (a vice) and those who resisted as "courageous" (a virtue). However, this doesn't *refute* Owen's point about predictability or the practicality of cultivation. It shows trait-talk is useful descriptively, but doesn't prove traits are robust *causal* entities predictive across situations (-).

  5.  **Owen (5): Kamtekar-style redescription is unfalsifiable.**  
      *Rating: +1.5*  
      *Why:* Owen lands a significant blow here. If any behavior can be *post hoc* redescribed as "manifesting a trait" (e.g., obedience in Milgram = "deference-to-authority-vice"), without a *prior* specification of *which* trait manifests *when* and *how reliably*, then trait explanations become flexible to the point of vacuity. They risk explaining everything and predicting nothing. While many theories interpret data through their lens (e.g., cognitive dissonance theory), the charge of lacking predictive specificity and testability is a serious challenge for character-based explanations in light of the situationist data. It doesn't "prove too much" in a fatal way, but it demands a response from VE proponents about how traits are individuated and their situational triggers specified.

  **Literature Gaps & Additional Points:**
  *   **Annas's "Skill Analogy":** Neither reached for Julia Annas's argument that virtues are like complex skills (e.g., piano playing). Skills aren't globally consistent (a pianist isn't "always playing"), manifest situationally, require practice, and can be disrupted by pressure – yet we still meaningfully attribute the *skill* to the person. This offers a model for virtues that avoids naive globalism while preserving the idea of a stable disposition cultivated over time.
  *   **Alfano on "Trait Cultivation":** Mark Alfano argues the situationist data doesn't show traits *can't* be cultivated, only that they aren't *currently* widespread. He suggests VE should focus on *how* to cultivate more robust traits, perhaps by engineering self-fulfilling prophecies or scaffolding environments.
  *   **Interactionism:** Both students lean towards traits vs. situations. The literature increasingly emphasizes *Person x Situation interactions*. Traits might exist, but their expression is highly context-dependent. Mischel himself moved towards this view later.
  *   **"Fragmentation" vs. "Integration":** Doris's later work (e.g., *Talking to Our Selves*) on fragmented agency and self-ignorance offers a more nuanced challenge than just the early consistency data, questioning whether we have the unified agency presupposed by some VE.

  **Verdict:**

  **On balance, Owen is closer to being right.**

  *   **Why:** While Kate successfully defends the *theoretical coherence* of a non-globalist, rare-virtue Aristotelianism against the initial empirical barrage (Move 2), Owen's critique of the **practical viability and guidance** of such a theory (Move 3) strikes at the heart of why VE matters to many. If VE can't offer reliable guidance for moral development or predict behavior better than situational factors for the vast majority of people in most circumstances, its claim to be a primary *practical* ethic is severely weakened. Owen's unfalsifiability charge (Move 5) against post-hoc trait redescription also highlights a significant methodological weakness in how character is often invoked defensively. Kate's important distinction between ideals and efficient levers (Move 4) doesn't fully mitigate these core challenges to VE's practical utility. Owen better captures the *force* of the situationist critique for ethical *practice*, even if Kate salvages the *theoretical possibility* of rare virtue.
