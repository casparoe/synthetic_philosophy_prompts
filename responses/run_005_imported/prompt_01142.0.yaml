answer: |-
  You've grasped the core tension brilliantly—and your instinct that the non-moral norm violation findings pose the strongest challenge to a purely evaluative account is spot-on. Yet, I argue that **moral evaluation remains the primary driver of the Knobe effect**, and the "norms" view, while capturing part of the picture, ultimately relies on mechanisms deeply entangled with evaluative cognition. Here’s why, engaging directly with the strongest "norms-as-fundamental" position:

  ### 1. **The Moral/Conventional Distinction Undermines the Parity Claim**
     Uttich & Lombrozo’s key evidence—the "company convention" variant—purportedly shows *any* norm violation triggers the asymmetry. But this overlooks a critical nuance from developmental psychology: humans distinguish **moral norms** (rooted in harm, fairness, intrinsic wrongness) from **conventional norms** (arbitrary, context-dependent rules). Crucially:
     - **Moral norms elicit stronger affective responses**, activate distinct neural substrates, and are judged as universally binding. Conventional norms don’t.
     - **Replication challenges**: Some attempts to replicate the non-moral Knobe effect with *purely* conventional norms (e.g., "wearing mismatched socks violates office policy") show *weaker* or *inconsistent* asymmetries compared to moral cases. When effects appear, they often correlate with subjects *moralizing* the norm ("he’s disrespecting the company!") or inferring implied harm.
     - **Developmental evidence**: Young children show the Knobe asymmetry for harm long before they grasp complex conventions. If norms *as such* were primary, conventional violations should trigger symmetrical effects early on—but they don’t.

     *Counter-reply to "norms" view*: If all norms are equivalent, why does moral valence amplify the effect so robustly? Why does decoupling a norm from moral content (e.g., "this arbitrary color rule has no ethical implications") often diminish the asymmetry?

  ### 2. **Affective Blame Drives the Asymmetry, Not Just Mental State Inferences**
     The "norms" view posits that violations trigger inferences about the *agent’s consideration* of the norm. But evidence suggests **moral evaluation directly shapes mental state attribution via blame**:
     - **Blame-first models**: Work by Alicke, Knobe, and others shows that negative evaluative judgments (e.g., "this outcome is bad") *precede* and *scaffold* intentionality attributions. We blame the chairman for harm, then retrofit "intentional" to justify blame. Helping the environment isn’t blameworthy, so no such retrofit occurs.
     - **Neutralizing affect weakens the effect**: Scenarios where harm is *accidentally beneficial* (e.g., poisoning a rival *saves* his life due to an allergy) reduce intentionality judgments despite identical actions/mental states. The outcome’s evaluative valence overrides norm violation.
     - **Cross-cultural variations**: The Knobe effect’s strength correlates with cultural emphasis on moral responsibility. If norm detection were universal and affect-neutral, such variation wouldn’t emerge.

     *Counter-reply to "norms" view*: Why would violating a trivial convention (e.g., product color) generate *blame* strong enough to distort mental state attribution? The "inference to consideration" seems insufficient without an evaluative stake.

  ### 3. **The Effect Generalizes to Non-Action Concepts in Morally-Saturated Ways**
     The Knobe effect extends to attributions like **"deciding," "knowing," or "being in favor of"**:
     - People say the chairman *knew* harm would occur but didn’t *know* help would occur (despite equal epistemic access).
     - He *decided* to harm but didn’t *decide* to help.
     - Crucially, **these asymmetries persist only for morally valenced outcomes**. Violating a neutral norm (e.g., "using a deprecated software tool") doesn’t trigger asymmetric "knowing/deciding" judgments to the same degree. This suggests moral evaluation pervasively shapes *multiple* mental state concepts—not just intentionality.

     *Counter-reply to "norms" view*: If norm violation alone explains intentionality via "consideration," why would it asymmetrically affect *knowledge*? The chairman’s awareness of outcomes is identical in harm/help cases. Only moral evaluation rationalizes this spread.

  ### 4. **Reinterpreting Non-Moral Findings: Moral Entanglement**
     When non-moral norm violations *do* produce a Knobe-like effect (e.g., Uttich & Lombrozo’s study), it’s likely because:
     - **Implicit moralization**: Subjects often interpret rule violations as implying *disrespect*, *dishonesty*, or *harm to group cohesion*—smuggling moral content into "neutral" scenarios.
     - **Pragmatic reasoning**: Violating *any* norm may signal general recklessness, but **recklessness is itself a moralized concept**. We condemn it more harshly than mere oddity or mistake.
     - **Statistical rarity ≠ evaluative neutrality**: Rare events attract attention, but the Knobe effect hinges on *negative* evaluation, not oddity. A *beneficial* rare outcome (e.g., "his policy accidentally cured a rare disease") still doesn’t yield "intentional" judgments.

  ### 5. A Decisive Test: *Moral Norms Without Violation*
     Consider this hybrid scenario:  
     > *A chairman approves a policy that will increase profits and, as a side effect, **uphold a moral norm** (e.g., "ensure racial fairness in hiring"). He is indifferent to fairness but knows it will occur. Later, he learns the policy **failed to uphold fairness** due to an unforeseen glitch.*  

     - **Evaluative view predicts**: Upholding fairness won’t be "intentional" (no positive asymmetry), but *failing* to uphold it might be judged intentional (negative asymmetry) because moral stakes attach to the *bad* outcome.
     - **Norms view predicts**: No asymmetry for upholding/failing, since no norm was *violated* in the chairman’s action (the glitch was external).  
     *Empirical precedent*: Studies on "side-effect omissions" (e.g., *failing* to help) show negative asymmetries even without active violation, supporting the evaluative account.

  ### Conclusion: Evaluation as the Engine
  While norm detection *modulates* the Knobe effect, it operates within a cognitive architecture where moral evaluation is primary. **Bad outcomes demand blame; blame demands an intentional agent.** Conventional norms only "work" when they tap into moral cognition (e.g., via disrespect). The effect’s sensitivity to moral valence across cultures, its generalization to other mental states, and its grounding in affective blame point to evaluative processing as the core mechanism. Uttich & Lombrozo’s findings reveal a secondary pathway—but not the deep structure.

  Your struggle to design a clean test is understandable: moral evaluation is so pervasive that isolating "pure" norms is nearly impossible. But that’s precisely the point. If morality *weren’t* fundamental, we wouldn’t battle so hard to excise it.
