answer: |-
  Your suspicion is well-founded—the conflation of Bell inequality violations with blanket "non-locality" obscures a critical distinction. Let me defend the position that quantum entanglement violates **outcome independence** (OI) while preserving **parameter independence** (PI), enabling peaceful coexistence with relativity, and address Maudlin's ontological challenge head-on.

  ### Core Argument: PI/OI Decomposition & Peaceful Coexistence
  1. **Jarrett-Shimony Decomposition**:  
     Bell's factorizability condition \( P(A,B|a,b,\lambda) = P(A|a,\lambda) \cdot P(B|b,\lambda) \) splits into two independent principles:  
     - **Parameter Independence (PI)**: \( P(A|a,b,\lambda) = P(A|a,\lambda) \) (Alice’s outcome independent of Bob’s *setting*).  
     - **Outcome Independence (OI)**: \( P(A|a,b,B,\lambda) = P(A|a,b,\lambda) \) (Alice’s outcome independent of Bob’s *outcome*).  

  2. **Quantum Mechanics Violates OI, Not PI**:  
     - In entangled states (e.g., \( \ket{\Psi^-} = \frac{1}{\sqrt{2}}(\ket{01} - \ket{10}) \)), outcomes are statistically dependent: \( P(A,B|a,b) \neq P(A|a) \cdot P(B|b) \).  
     - However, marginal probabilities obey \( P(A|a,b) = P(A|a) \): changing Bob’s setting \( b \) doesn’t alter Alice’s local statistics. **No superluminal signalling is possible**, satisfying PI.  

  3. **Relativistic Compatibility**:  
     - Special relativity forbids superluminal *causation* (signalling), not correlations. QM’s adherence to PI ensures:  
       - No experiment can exploit entanglement for FTL communication.  
       - Lorentz invariance holds for observable predictions (e.g., in QFT).  
     - Shimony’s "peaceful coexistence" arises because relativity restricts *control*, not correlation. Violating OI alone doesn’t threaten causal structure.  

  ---

  ### Engaging Maudlin’s Objection  
  Tim Maudlin argues that no-signalling is insufficient: spacelike correlations imply a "non-local common structure" (e.g., a global quantum state) that conflicts with relativity’s spirit, even without signalling.  

  #### Rebuttal:  
  1. **Operational vs. Ontological Criteria**:  
     - Maudlin demands *ontological locality*: physical states should be locally definable.  
     - But relativity is an *operational* theory: it forbids observable FTL influences, not hidden connections. QM’s no-signalling satisfies this.  

  2. **The Quantum State is Relativistically Benign**:  
     - The entangled state \( \ket{\Psi} \) is a global mathematical object, but its non-separability isn’t "non-local" in a causal sense.  
     - In algebraic QFT, the Reeh-Schlieder theorem shows localized operations can prepare global states—yet **no violation of PI occurs**. The state’s non-locality is kinematical, not dynamical.  

  3. **Maudlin’s "Common Structure" is Inert**:  
     - Yes, entanglement implies a shared reality not reducible to local parts (e.g., quantum non-separability).  
     - Crucially, this structure **cannot transmit information or forces**. It’s a correlation without a causal mechanism—a "passive" holism (as Howard puts it).  

  4. **Relativity’s Core Commitment is Causal**:  
     - Special relativity emerged to resolve conflicts about *signals* (e.g., Einstein’s light-speed postulate). Its empirical content lies in causal structure.  
     - Demanding local realism *beyond* no-signalling imposes extrascientific constraints. As Bell quipped: "The [quantum] speed is that of *Schrödinger’s equation*, not of Einstein’s causality."  

  ---

  ### Why Peaceful Coexistence Holds  
  - **Pragmatic view**: QM + relativity underpin all modern physics (QFT, quantum optics). Their consistency is tested daily.  
  - **No hidden variables**: Theories violating PI (e.g., Bohmian mechanics) *do* conflict with relativity by requiring a preferred frame. QM avoids this by violating only OI.  
  - **Maudlin’s alternative**: He favors theories like GRW collapse, but these introduce *actual* non-locality (violating PI) or empirical deviations from QM.  

  ### Conclusion  
  Bell’s theorem shows that **either** PI **or** OI must fail in nature. QM chooses to violate OI—allowing "spooky" correlations while respecting PI—which is precisely why it coheres with relativity’s prohibition on FTL signalling. Maudlin’s objection conflates *correlational structure* with *causal influence*. The global quantum state is indeed non-separable, but its non-locality is ontologically "peaceful" because it cannot mediate causal interactions. This satisfies special relativity’s operational essence while leaving deeper metaphysical questions open—a defensible middle ground that has endured both theoretical scrutiny and experimental tests.  

  *"The world is not locally causal, but it is locally *controllable*."*  
  —Asher Peres (paraphrased)
