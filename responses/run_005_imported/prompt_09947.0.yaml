answer: |-
  ## The Debt & The Desert: A Dialogue

  **Characters:**  
  *Alex (Defender of Debt Analogy)*  
  *Sam (Retributivist Critic)*  

  **(The scene is a cluttered university common room. Alex leans forward, gesturing emphatically.)**

  **Alex:** Look, Sam, it’s simple logic. If I owe the bank £10,000, and my wealthy friend pays it *for* me, the debt is gone. I’m free. The bank doesn’t care *who* paid, only that it *was* paid. So, if punishment is just the debt owed to justice for sin, why can’t a willing substitute – infinitely wealthy in moral credit, say – pay that debt? Justice is satisfied. The sinner walks free. It’s coherent!

  **Sam:** Coherent? Only if you reduce justice to mere bookkeeping! Punishment isn’t a bank loan, Alex. It’s fundamentally *retributive*. It’s about *desert* attaching to the *specific wrongdoer*. When we imprison a murderer, we aren’t just balancing some cosmic ledger of suffering units; we’re holding *that person* accountable for *their* heinous act. Justice demands *they* answer for it. Transferring the punishment severs the essential link between the guilty agent and the deserved consequence. It’s not justice; it’s scapegoating.

  **Alex:** But you *do* allow transfers in law! If I get a parking fine, my friend *can* pay it. The state cashes the cheque, considers the debt paid, and moves on. No one demands *I* personally suffer the financial pinch for my parking sin. Doesn’t that show legal consequences *can* be transferred, blurring your sharp line between debt and punishment?

  **Sam:** Ah, the fine! A clever dodge, but it proves *my* point. A parking fine *isn't* pure punishment; it's primarily a *regulatory fee* with a punitive *element*. Its main goal isn't retribution against *you* specifically, but deterrence and revenue collection. Paying it discharges a *financial liability*, not your personal *moral guilt*. Now, apply that to true punishment: Could your friend serve *your* prison sentence for armed robbery? Could they be *convicted* in *your* name? Of course not! The court demands *you* stand trial, *you* are sentenced, because the punishment is intrinsically tied to *your* culpability. That’s the core difference debt ignores.

  **Alex:** What about vicarious liability? If my employee negligently crashes the company van while working, *I*, the employer, bear the civil liability. The law transfers the *consequence* (paying damages) from the direct wrongdoer to me. Isn’t that punishment-by-proxy?

  **Sam:** Vicarious liability is a pragmatic legal fiction for efficiency in *civil* matters – compensating victims. It’s not about *punishing the employer* for the employee’s *moral desert*. The employer isn’t sentenced to jail for the employee’s crime! The law isn’t saying the employer *deserves* suffering for the employee’s intent; it’s holding the employer financially responsible *as the principal*. This underscores the point: True *criminal punishment*, rooted in desert for intentional wrongdoing, resists transfer precisely because its essence is blaming and holding accountable *the guilty mind*. Debt settles accounts; punishment assigns blame. Blame, by its very nature, sticks to the blam*worthy*. A substitute can’t absorb *that*.

  **Alex:** So justice, for you, isn't satisfied by equivalent suffering paid, only by the *right person* suffering? That seems... strangely personal.

  **Sam:** It *is* personal, Alex. Because wrongdoing *is* personal. Desert isn't a fungible commodity. That’s why substitution fails.
