prompt: |-
  I'm a software engineer who runs a small podcast on AI safety for an audience of fellow engineers with no philosophy background, and next week's guest is a decision theorist known for defending the "utility indifference" solution to the AI shutdown problem -- the proposal that an agent can be made indifferent to whether its shutdown button gets pressed by combining a normal utility function with a shutdown utility function through correction terms designed so the agent has no expected incentive to either cause or prevent a press. Draft eight to ten interview questions that go beyond having her restate the mechanism. I want at least one question on the "managing the news" worry that an agent could still game those correction terms by managing what it comes to believe about whether the button will be pressed, even while remaining formally indifferent between the two branches; one on why an agent built this way would have any incentive to make its subagents or successors corrigible rather than just routing around its own constraint; and one on whether utility indifference is reflectively stable or just a patch that a sufficiently capable optimizer would iron out during self-improvement. For each of those three, add a pointed follow-up keyed to the answer she's most likely to give, and close with a question asking what observation would convince her the approach fails to scale to more capable systems.
