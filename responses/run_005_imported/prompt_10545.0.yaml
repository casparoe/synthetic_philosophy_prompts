prompt: |-
  I run a small podcast on formal epistemology, and I came to this particular topic the way a lot of LessWrong-adjacent readers probably did: through the evidential-vs-causal decision theory debate, where evaluating an act by the conditional probability P(O|A) versus by a counterfactual like "if I were to do A, O would happen" turns out to trace straight back to the indicative/counterfactual distinction itself. Next week's guest defends the Adams/Edgington line: indicative conditionals such as "If Oswald didn't shoot Kennedy, someone else did" have no truth conditions and are governed by the Ramsey test, so that rational credence in "if A, C" should equal the conditional credence P(C|A), while counterfactuals such as "If Oswald hadn't shot Kennedy, someone else would have" get an ordinary Stalnaker-Lewis possible-worlds treatment. I don't want her simply re-explaining the Ramsey test. Please draft eight interview questions, with at least one each on: whether "P(if A, C) = P(C|A)" is even a coherent probability claim once you deny the conditional is a proposition, given that she reads Lewis's 1976 triviality result as proof that no proposition can behave that way; the embedding problem, i.e., what a negated conditional, or a conditional sitting in the antecedent of a further conditional, is supposed to mean if the embedded conditional has no truth value to begin with; Gibbard's "Sly Pete" riverboat case, where two equally well-placed observers report flatly incompatible conditionals about the same poker hand without either being wrong, and why a third party who receives both reports treats them as jointly informative rather than as two unrelated subjective impressions; and her principled criterion for sorting a given "if...then" utterance into the truth-conditional bin versus the assertability-conditional bin, given how easily the two moods get run together outside constructed minimal pairs. For each question, include a short follow-up keyed to the answer she is most likely to give.
reasoning: |-
  Okay, the user runs a small podcast on formal epistemology and is preparing for an interview with a guest who defends the Adams/Edgington view on conditionals. They want eight interview questions covering specific technical challenges to this view, with follow-ups. The guest argues that indicative conditionals (like "If Oswald didn't shoot Kennedy, someone else did") lack truth conditions and follow the Ramsey test (P(if A, C) = P(C|A)), while counterfactuals get possible-worlds semantics. 

  Hmm, the user clearly knows their stuff—they're diving deep into the LessWrong/decision theory ecosystem and name-dropping niche arguments like Gibbard's Sly Pete case. Their frustration with superficial Ramsey test re-explanations suggests they want to push the guest on the toughest objections. The four required topics are well-chosen pain points: Lewis' triviality (how can P(if A,C) equal P(C|A) if no proposition behaves that way?), embedding (what does ¬(if A,C) even mean?), Gibbard's observer-relative conditionals, and the messy mood-classification problem. 

  I should craft questions that force the guest to move beyond soundbites. For Lewis' triviality, the core tension is: if "if A,C" isn't a proposition, how can we assign it a probability at all? The follow-up should press on whether "P(if A,C)" is merely shorthand for P(C|A) or something more. Embedding is trickier—Edgington's strategy is to reinterpret embeddings as conditional probabilities, but that feels ad hoc for nested conditionals like "if (if A,C) then D." Gibbard's case needs to expose why two conflicting conditionals ("Pete will win if he calls" vs "he'll lose") aren't contradictory but update a third party's beliefs. And mood-classification... ugh, real-world examples like "if you press that button, the building explodes" could be either mood depending on context! The guest must offer criteria beyond tense. 

  The user's phrasing ("principled criterion") hints they've heard handwavy answers before. I'll avoid softball questions. Each follow-up should anticipate dodges—e.g., if the guest says embedding isn't a problem, ask about probability operators ("it's 80% likely that if A, C"). For Sly Pete, if they say the observers report different evidence, push on why the third party doesn't treat the claims as purely subjective. 

  ...Also, the podcast's audience is likely technical but may include newbies. Questions should name-drop key papers (Lewis 1976, Gibbard 1981) but explain concepts inline. No jargon without payoff.
answer: |-
  Here are eight interview questions targeting the specified challenges, designed to push beyond standard Ramsey test explanations. Each includes a likely-answer-tailored follow-up:

  1.  **Lewis's Triviality & Coherence:** "Lewis (1976) famously argued that if indicative conditionals *were* propositions and satisfied P(if A, C) = P(C|A) universally, they'd be trivialized. You take this as proof they *aren't* propositions. But if 'if A, C' lacks truth conditions, what is the *object* of the credence P(if A, C)? Is 'P(if A, C)' merely a notational variant for 'P(C|A)', or does it denote a genuine credence *in* something non-propositional? How is this coherent within standard probability theory?"
      *   *Likely Answer/Focus:* She'll emphasize that P(if A, C) *just is* P(C|A); it's not credence *in* a propositional content but a *measure* of the speaker's conditional attitude.
      *   *Follow-up:* "If P(if A, C) isn't credence *in a thing* but *is* operationally defined as P(C|A), doesn't this render statements *about* probabilities of conditionals, like 'It's likely that if A, C', fundamentally misleading? Aren't we just saying 'P(C|A) is high', smuggling in a pseudo-propositional form?"

  2.  **Embedding - Negation:** "Consider a negated indicative conditional: 'It is not the case that if it rains, the match will be canceled' (~(if R, C)). If 'if R, C' has no truth value, what does this negation *operate on*? What does the rational credence in ~(if R, C) amount to? Is it simply 1 - P(C|R), or something else? How does this avoid interpreting the negation as applying to a non-existent truth bearer?"
      *   *Likely Answer/Focus:* She'll follow Adams/Edgington: ~(if A, C) is equivalent to (if A, ~C). Credence in ~(if A, C) = P(~C|A).
      *   *Follow-up:* "Doesn't this reduction strategy risk changing the subject? The original negation *seems* to challenge the *connection* asserted by 'if R, C', perhaps implying rain wouldn't *ensure* cancellation, not necessarily asserting rain would ensure *non*-cancellation. Isn't P(~C|R) a different claim than the intuitive reading of ~(if R, C)?"

  3.  **Embedding - Antecedent of Another Conditional:** "What about conditionals *within* the antecedent of another indicative conditional: 'If (if it rains, the match is canceled), then we'll stay home' (if (if R, C), then S)? If the embedded '(if R, C)' lacks truth value, what is the *condition* for the outer conditional? How is the rational credence P(S | (if R, C)) determined?"
      *   *Likely Answer/Focus:* She'll apply the Ramsey test recursively: Assess credence by adding P(C|R) [as the 'value' of the antecedent] to your belief base hypothetically and see P(S) under that supposition. Or argue such embeddings are rare/unstable and often rephrased.
      *   *Follow-up:* "This seems complex. If we hypothetically add P(C|R) to our beliefs, are we adding a *degree of belief* or the *proposition* that P(C|R) is high? And doesn't this recursive process effectively *treat* the embedded conditional as having a proposition-like 'value' (namely P(C|R)) for the purpose of the outer Ramsey test, undermining the core 'no truth value' claim in embedding contexts?"

  4.  **Gibbard's Sly Pete (The Core Puzzle):** "Gibbard's Sly Pete case seems devastating to truth-conditional views: Two observers, Blindsight Jack (who knows Pete has the winning hand) and Sneaky Snyder (who knows the opponent has a losing hand), assert flatly contradictory indicative conditionals: Jack says 'If Pete called, he won' (if C, W), Snyder says 'If Pete called, he lost' (if C, L). Neither seems wrong. Crucially, a third party, hearing both, gains information – they learn Pete called. How does your account explain both the non-falsifiability of each individual conditional *and* the fact that hearing both together is informative, *without* treating the conditionals as reporting propositions about the world?"
      *   *Likely Answer/Focus:* Each conditional expresses the speaker's *conditional belief* (P(W|C)=1 for Jack, P(L|C)=1 for Snyder) relative to their *private information*. The third party learns that *both* speakers have information making C entail W (for Jack) and C entail L (for Snyder); the only way this can hold is if C is false (Pete didn't call), resolving the contradiction.
      *   *Follow-up:* "But doesn't the third party's inference crucially rely on interpreting the conditionals as claims *about the state of the world relative to evidence*? They learn that Jack *must* have evidence making C sufficient for W, and Snyder *must* have evidence making C sufficient for L, and that this situation only holds if ~C. Isn't this effectively treating 'if C, W' as conveying a proposition *about Jack's epistemic state* or *about evidential relations*, rather than *just* expressing his conditional belief?"

  5.  **Gibbard's Sly Pete (Joint Informativeness):** "Building on Sly Pete: Why does the third party treat the *pair* of conditionals ('if C, W' and 'if C, L') as *jointly* implying ~C? If each conditional is merely an expression of the speaker's subjective conditional probability, why aren't they treated as two separate, unrelated pieces of data about individual psychology (Jack has P(W|C)=1, Snyder has P(L|C)=1), with no necessary contradiction or joint implication about Pete's action?"
      *   *Likely Answer/Focus:* The informativeness comes from the *content* of the conditional beliefs expressed *combined* with the *assumption of rationality and truthfulness*. The third party infers that Jack/Snyder possess *information* justifying their extreme conditional beliefs. The specific contents (W and L) are incompatible under C, forcing the conclusion that C is false.
      *   *Follow-up:* "So, is the key move that we interpret utterances of 'if A, C' not *only* as expressions of P(C|A) but also as *assertions that the speaker possesses evidence justifying* P(C|A)? Doesn't this reintroduce a truth-conditional element – the truth of the claim *about the speaker's epistemic justification* – as what gets conveyed and allows the joint inference?"

  6.  **Mood Classification - The Core Challenge:** "Outside of carefully constructed minimal pairs like Oswald/Kennedy, real-world 'if...then' utterances often resist easy classification as purely indicative or counterfactual. What is your *principled criterion* for deciding whether a given utterance belongs in the truth-conditional (counterfactual) bin or the assertability-conditional (indicative) bin? For instance, consider 'If you press that button, the building explodes' said while pointing to a big red button - is this a prediction governed by P(Explode|Press) or a warning about a causal mechanism governed by counterfactual dependence?"
      *   *Likely Answer/Focus:* She'll likely appeal to the speaker's *epistemic perspective* and *temporal* focus: Is the antecedent considered an open possibility (indicative) or presupposed false (counterfactual)? The button example is likely indicative if pressing is live, counterfactual if describing a past scenario or a disarmed device.
      *   *Follow-up:* "But context often overrides tense or open possibility. Imagine a historian knowing all the facts about a past event saying: 'If Oswald didn't shoot Kennedy, someone else did' – clearly indicative by your criterion. Now imagine the *same* historian, moments later, discussing an alternative scenario: 'But if Oswald *hadn't* shot Kennedy...' – counterfactual. Yet, the *underlying causal/historical facts* are identical. Doesn't the shift purely reflect a change in the *speaker's current focus of supposition*, not a fundamental difference in the *kind of content* expressed? Why treat them as semantically distinct types?"

  7.  **Mood Classification - Running Together & Shifting:** "We often see 'if...then' statements that seem to blend or shift moods mid-stream, or where the intended mood is genuinely ambiguous. How does your theory handle utterances like: 'If I had known you were coming (counterfactual?), I would have baked a cake (counterfactual?), and if I bake a cake now (indicative?), it will be ready in an hour (indicative?)'? Or ambiguous cases like a scientist discussing a failed experiment: 'If we added reagent X, the reaction would turn blue' – is this a counterfactual about the past or a general indicative law?"
      *   *Likely Answer/Focus:* She'll argue mood is determined clause-by-clause based on the supposition's status *at that point* in the discourse. The scientist example might be ambiguous; context or clarification is needed.
      *   *Follow-up:* "Doesn't the smooth integration within a single sentence/thought, especially in the consecutive conditional example, suggest a unified semantic treatment might be preferable? If mood is purely pragmatic/syntactic based on supposition status, why does the *meaning* of the connective feel consistent across the shift? Doesn't this fluidity challenge the strict bimodal semantic division?"

  8.  **Assertability vs. Truth in Counterfactuals:** "You grant truth conditions to counterfactuals via Stalnaker-Lewis. But consider a counterfactual like 'If I had bet on Sly Pete, I would have won.' According to possible worlds semantics, its truth depends on the closest world(s) where I bet. However, my *assertability* of this counterfactual depends heavily on my *current knowledge* – do I *know* Pete had the winning hand? How do you reconcile the truth condition (grounded in objective similarity of worlds) with the *epistemic constraints* on rational assertability? Isn't there a tension similar to the indicative case, just masked by the truth-conditional apparatus?"
      *   *Likely Answer/Focus:* She'll distinguish truth conditions from assertability conditions. The counterfactual's *truth* is objective (worlds similarity), but I can only *rationally assert* it if my knowledge supports the belief that it's true (e.g., I know Pete had the winning hand).
      *   *Follow-up:* "But doesn't this mean that for the *speaker*, the *content* they are expressing with a counterfactual ('I would have won') is something they can only justifiably assert based on their current *indicative* knowledge ('Pete had the winning hand')? Doesn't this epistemic dependence mirror the structure of the Ramsey test (P(Win | Bet) = 1), suggesting a deeper unity in how conditionals function cognitively, even if we assign truth conditions to counterfactuals post-hoc?"

  **Key Goals:** These questions force engagement with the *metaphysical* (what *is* a conditional credence in?), *logical* (embedding), *epistemological* (Gibbard's observers, assertability), and *pragmatic/classificatory* challenges head-on. The follow-ups anticipate common defenses and push towards potential weaknesses or unexplored implications, ensuring the discussion moves beyond textbook exposition. Good luck with the interview!
