  That's an exceptionally sharp framing of the problem – Turing's Bayesian rigor colliding with his surprisingly credulous stance on ESP, all complicated by historical fraud and the replication crisis he never saw. Let's break it down using his own epistemic toolkit and documented character:

  1.  **The Immediate Impact of the Markwick Fraud (1978):**
      *   **Devastating Blow to Core Evidence:** Turing explicitly staked his claim on the *strength* and *replicability* of specific experiments: *"I should say that *statistical* evidence, *if I may use that term*, is overwhelming."* He singles out Soal's work: *"The evidence, at least for telepathy, is overwhelming."* Soal's Shackleton experiments weren't just *a* data point; they were his primary empirical anchor.
      *   **Bayesian Catastrophe:** Turing's wartime deciban system was designed for *sequential updating* as new evidence arrives. Discovering that his strongest positive evidence was fraudulent isn't just nullifying a data point; it's evidence *against* the original claim *and* the competence/honesty of the source. This demands a massive downward revision.
      *   **His Likely Reaction:** Turing was fiercely logical and intellectually honest. Confronted with irrefutable proof of fraud in the *very data* he cited as "overwhelming," he would almost certainly have:
          *   **Retracted his strong claim** about the *overwhelming* statistical evidence for telepathy based on those experiments.
          *   **Expressed profound disappointment and skepticism** regarding the entire Soal corpus and potentially the field's vetting processes.
          *   **Drastically reduced his prior** for the specific phenomenon (telepathy as tested by Soal) and the reliability of similar experimental setups. The "telepathy-proof room" proposal becomes an embarrassing historical footnote he'd likely dismiss.

  2.  **Dealing with the Broader Psi Landscape & Bem (2011+):**
      *   **Not Starting from Zero (But Close):** Markwick discredits Soal, *not* every other psi claim ever made. Turing briefly alludes to Rhine's work and other experiments. His *prior* for psi, influenced by the intellectual climate of the time (e.g., interest in the paranormal post-WWII, foundational questions in physics), might not have dropped *to zero*. He might maintain a *tiny*, highly skeptical baseline curiosity.
      *   **Confronting Bem & the Replication Crisis:**
          *   **Initial Scrutiny:** Turing would dissect Bem's methodology with the precision honed at Bletchley Park. He'd instantly flag:
              *   **Optional Stopping & p-hacking:** Bem's practices (running subjects until significance, multiple outcome variables) would violate Turing's standards for rigorous, pre-registered hypothesis testing. He understood how easily noise generates false positives.
              *   **Effect Size & Practicality:** Bem's effects were minuscule (d ~ 0.20), even if real. Turing, focused on practical computation and intelligence, would question the significance compared to robust phenomena.
          *   **The Bayesian Bookkeeping (Decibans on Bem):** Let's apply his system:
              *   **Initial Bem Study (2011):** Assume a skeptical prior (say, -30 dB, odds 1:1000 against psi). Bem's 9 experiments, 8 significant (p<.05). Naively, each "success" might add +10 dB? But Turing knew significance thresholds depend on stopping rules and multiplicity. He'd apply a severe penalty for these practices. Wagenmakers' reanalysis (BF ~ 40:1 *for H0* in some cases) suggests the *actual* evidence in Bem's *own data* was weak or negative once properly modeled. Turing might see *at best* a small net positive for Bem's specific claims (+5 to +10 dB?), leaving the posterior still skeptical (e.g., -20 dB, odds 1:100). Not "overwhelming" by any stretch.
              *   **Failed Replications (2012+):** This is the killer. Multiple high-powered, pre-registered replications (e.g., Galak et al., Ritchie et al.) *failed* to find Bem's effects. Each rigorous failure provides strong evidence *against* the specific precognition effect Bem claimed. A single high-quality failure might add -10 dB or more. Several failures compound this drastically. The JPSP controversy would signal methodological rot to Turing.
              *   **Net Outcome:** The accumulation of failed replications, coupled with the methodological flaws exposed in Bem's original work and the field's publication bias (JPSP reluctance), would rapidly drive the deciban count deep into the negative (-40 dB, odds 1:10,000+ against Bem's specific effect). The "replication crisis circus" wouldn't be noise to Turing; it would be *crucial data* confirming his worst methodological suspicions.
          *   **The Yudkowsky/LW Framing:** Turing would likely find the *meta-point* insightful. Parapsychology *does* function as a "control group" highlighting flaws in scientific practice (p-hacking, publication bias, lack of replication). However, he'd see the *outcome* – persistent failure to produce robust, replicable effects under rigorous conditions – as evidence *against* psi's existence, not a reason to maintain credence. The control group *failed*.

  3.  **The Plausible Updated Turing:**
      *   **Recant the Specifics:** He absolutely recants the specific claims based on Soal and the "overwhelming" nature of that evidence. The telepathy-proof room vanishes from his argument.
      *   **Profound Skepticism:** His prior for *any* new psi claim becomes *extremely* low. The combination of fraud (Soal) and the failure to replicate under improved methods (Bem saga) would convince him the field is plagued by systemic issues generating false positives.
      *   **Methodological Fury:** He'd be scathing about the poor statistical practices (optional stopping, p-hacking) and lack of rigorous replication standards exposed in both the Soal and Bem affairs. He might become an advocate for pre-registration and Bayesian methods.
      *   **Crack Left Open?** *Maybe* a sliver. His 1950 passage shows a willingness to entertain radical ideas to explain consciousness or physics. *If* truly revolutionary, *robust*, and *replicable* evidence emerged from a source he deemed impeccable, he *might* reluctantly reconsider. But the bar would be astronomically high ("overwhelming" in the true sense), and the Bem saga would have shown him how high-quality failures outweigh initial flashy successes. He wouldn't *cling* to belief; he'd demand extraordinary evidence and expect it to fail.

  **In essence:** The Markwick fraud demolishes the foundation of his 1950 argument. The Bem saga and replication crisis provide overwhelming evidence that the phenomena he gestured towards either don't exist or are so fragile and miniscule as to be scientifically irrelevant and indistinguishable from methodological artifact. Turing, the pragmatic Bayesian who helped break Enigma by meticulously weighing evidence and distrusting noise, would see the collapse of his cited evidence and the failure to rebuild it under scrutiny as decisive. He wouldn't just become a skeptic; he'd see the pursuit as a cautionary tale in statistical rigor, his brief flirtation with psi a historical curiosity born of flawed data he thankfully didn't live to defend. The deciban meter, after Markwick and Bem's replications, points decisively towards "reject."
