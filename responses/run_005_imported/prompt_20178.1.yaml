prompt: |-
  I'm about a third of the way into a novel where a recurring thread is a character who can predict, with eerie and unbroken accuracy, exactly where someone will be at a specific future moment — and I want a big set-piece scene to hinge on the "Death in Damascus" puzzle from decision theory, which a friend of mine whose doing a philosophy PhD walked me through over drinks last week. The classic version goes: a man runs into Death in Damascus, Death looks surprised and says he's coming for him tommorow, so the man buys a camel that night and flees to Aleppo — only Death is waiting there too, because the "appointment book" was written weeks earlier off a prediction that's never wrong. My friend's point was that this isn't quite like Newcomb's problem, since Death isn't rewarding you for matching his prediction, he's actively trying to catch you, and that apparently breaks something for both evidential and causal decision theory — something about there being no "self-ratifying" or stable choice available, since whatever you become confident you'll do is itself evidence (or, on the causal side, updates your beliefs) that the predictor is exactly there waiting for you. She also mentioned some MIRI paper that tries to patch this with a "functional decision theory," but her explanation of that bit went a little over my head, ngl.

  Anyway, I don't want to just lift the Damascus/Aleppo scenario and swap in new city names, since any reader who's taken a decision theory class will clock it as a cheap reskin — and honestly I'd rather understand the actual mechanics well enough to bend them convincingly than just cargo-cult the surface details. Could you invent a genuinely different scenario — doesn't have to involve literal death, doesn't need two cities, could be almost any setting or stakes — that still reproduces the same underlying paradox (the predictor-who's-hunting-you structure, and the lack of a stable, "ratifiable" choice under EDT and/or CDT)? Then walk me through, briefly, why your example actually preserves the paradox mechanically rather than just resembling it on the surface — that's the part I need to nail if I want to write a scene around it that a sharp reader can't poke a hole in.
