answer: |-
  Here’s a dialogue between **Hartley** (a Hartian positivist) and **Fullerton** (a Fullerian natural lawyer), focusing squarely on the "inner morality" debate. They engage directly with the poisoner analogy and the efficacy challenge:

  ---

  **Hartley**: Let’s start with your eight principles, Fullerton. Generality, publicity, non-retroactivity—sure, they’re sensible for *any* system that uses rules to control behavior. But calling it "morality"? That’s sentimental. A chef follows principles to cook well; a poisoner follows principles to kill efficiently. Neither is "moral" just because they’re competent.  

  **Fullerton**: You’re conflating skill with purpose. The poisoner’s craft is aimed at *circumventing* agency—their victim doesn’t consent to the "rules." Law’s principles, when followed, respect human agency. They allow citizens to *plan*, to *understand* demands, to be held accountable as reasoning beings. That reciprocity *is* moral.  

  **Hartley**: Reciprocity? Tell that to the citizens under a tyrant who publishes clear, consistent rules demanding ethnic cleansing. Your eight boxes are checked. Is that suddenly "moral"? Or just efficiently evil?  

  **Fullerton**: Efficiency isn’t the point. The tyrant *simulates* legality to mask brute force. But if rules demand the impossible, contradict themselves, or shift hourly—they’re not laws, just camouflaged terror. Your "efficient poisoner" needs no such principles; their victim isn’t a participant. Law, by its nature, addresses agents.  

  **Hartley**: Nature? No—law’s nature is to be *effective*. Your principles are just *how* to be effective when dealing with complex societies. A prison warden publishes clear rules for inmates: "No talking after lights out, meals at 6 AM." It’s consistent, public, prospective. Is that "moral"? Or just well-run control?  

  **Fullerton**: Ah, but inmates aren’t full participants; they’re *subjects*. True law presupposes a community of responsible agents. When rules are opaque or retroactive, you treat people like objects to be manipulated, not beings capable of understanding and choice. *That* failure is immoral—a betrayal of law’s foundational promise.  

  **Hartley**: Foundational promise? That’s poetry. Let’s say I run a drug cartel. I publish clear rules: "Steal cargo = lose a finger." Generality? Check. Constancy? Check. I even apply them consistently. Am I suddenly moral?  

  **Fullerton**: You’re describing a *parody* of law. Your "rules" exist outside any framework of communal obligation—they’re threats backed by violence. Law’s inner morality requires that rules *could, in principle*, be followed voluntarily by agents sharing a social project. Your cartel "rules" are unilaterally imposed coercion.  

  **Hartley**: But the Nazi racial laws *were* followed voluntarily by many! They met your eight criteria. Was *that* "law’s morality"?  

  **Fullerton**: Nazi "law" systematically violated the principles! Retroactive "laws" punished pre-enactment acts. Vague decrees let officials criminalize anything. Rules contradicted each other. They *demanded the impossible*—like "pure Aryan blood" based on pseudoscience. Hart was right to call them monstrous—but they weren’t just substantively evil; they *procedurally* corrupted law itself.  

  **Hartley**: So when a regime slips on one principle—say, a retroactive tax—its entire system becomes "immoral law"? That’s absurd. Most legal systems have *some* flaws. Your standard paralyzes critique.  

  **Fullerton**: No—it shows law is aspirational. A tax system with one retroactive rule is flawed; a system that *routinely* ignores publicity, clarity, or possibility isn’t law at all—it’s terror in disguise. The principles aren’t a checklist; they’re facets of *one duty*: respecting citizens as ends, not means. That *is* morality.  

  **Hartley**: Respect? A slave society could have clear, public, consistent slave codes. Masters "respect" slaves by giving them predictable whippings?  

  **Fullerton**: Slave codes *inherently* fail Fuller’s test. They demand the impossible (e.g., "obey joyfully"), contradict themselves (e.g., "slaves are property" but punished as persons), and aren’t applied as announced (masters exercise arbitrary power). More deeply, they deny slaves’ agency—reducing them to objects. Law can’t exist where one group is stripped of moral personality.  

  **Hartley**: So law requires democracy now? Fuller never went that far.  

  **Fullerton**: Not democracy—but *reciprocity*. Even a monarchy can respect subjects as agents (e.g., Magna Carta’s "lawful judgment of peers"). But when rules treat humans as objects—whether slaves, "subhumans," or pawns—they abandon law’s inner morality. Your poisoner doesn’t seek reciprocity; a true lawgiver must.  

  **Hartley**: Must? That’s a moral wish, not a fact. I can describe a "legal system" without judging if it treats people well. You keep smuggling morality into the *definition* of law.  

  **Fullerton**: And you strip morality out until "law" is just a gunman writ large. But when officials govern by caprice—midnight decrees, secret trials, contradictory demands—they destroy the practice of ruling *by law*. Calling that "law" isn’t neutral; it’s complicity. The poisoner’s efficacy is technical; law’s efficacy is *moral* because it addresses free beings.  

  **Hartley**: So every failed state is immoral?  

  **Fullerton**: Every state that *abandons the effort* to govern through reciprocal, intelligible rules abandons law—and with it, moral legitimacy. Efficacy in ruling free people *requires* those principles. That’s why it’s morality, not just engineering.  

  **Hartley**: Then we’re back where we started: You see morality in the vessel; I see a vessel. One that can hold poison or medicine.  

  **Fullerton**: And I say the vessel itself—crafted to honor human agency—shapes what it can hold. Pour poison into it, and you shatter the vessel.  

  ---

  ### Key Themes Engaged
  - **Hartley’s Efficacy Charge**: Uses poisoner, cartel, slave code, and warden examples to argue Fuller’s principles are value-neutral craft.  
  - **Fullerton’s Moral Reply**: Argues law’s form *presupposes* moral agency (reciprocity, respect for autonomy), making procedural failures a *corruption of law itself*.  
  - **Nazi Law**: Addressed via procedural violations (retroactivity, impossibility) beyond substantive evil.  
  - **No Resolution**: Ends with Hartley seeing law as a neutral tool, Fullerton seeing its form as morally constitutive.  

  This sharpens the core clash: Is governing by Fuller’s principles *inherently* a moral practice (because it respects persons), or just a smart strategy for social control? Neither concedes ground.
