  Analysis:

  - **VNM theorem**: Foundational for expected utility, but limited to risk (known probabilities). Often cited but not the most general. It's a cornerstone, but not the end of the story. Probably A or B tier.

  - **Savage's theorem**: More general than VNM, handles uncertainty (unknown probabilities) and is a key coherence result. Considered a major foundation. Likely S or A tier.

  - **Dutch book arguments**: Classic coherence argument in probability (for Bayesianism) and decision theory. They show that if your degrees of belief aren't probabilistic, you can be made to accept a set of bets that lead to a sure loss. Similarly, in decision theory, if your preferences aren't consistent with expected utility, you can be Dutch booked. However, they are sometimes criticized as being impractical (no one would actually pump you). Still, they are central to the coherence arguments. Probably A tier.

  - **Money-pump arguments**: These are dynamic versions of Dutch books, showing that if your preferences are intransitive, you can be pumped for money. They are very intuitive and often used to argue for transitivity and other axioms. They are a common tool in the debate, but perhaps not the most formal. B tier?

  - **Wald's complete class theorem**: This is a statistical result showing that in decision problems, any admissible decision rule is a Bayes rule with some prior. It's sometimes used to argue that any rational agent must be Bayesian. However, it is more technical and less directly about utility maximization. It might be less central to the AI risk debate. C tier?

  - **Yudkowsky's post**: This is a key piece in the LessWrong/Alignment Forum canon. It argues that coherent decisions (avoiding being money-pumped) imply having consistent utilities. It's highly influential in the community and directly addresses the crux. S tier for the debate in this context.

  - **Rohin Shah's rebuttal**: This directly challenges the idea that coherence arguments lead to goal-directed behavior. It's a counterargument that has gained attention. Given the debate, it's a significant rebuttal. A tier.

  - **Thornley's critique**: This argues that none of the coherence theorems actually prove what they are claimed to prove. It's a recent and pointed critique that challenges the foundation. Given its direct relevance, it should be high, but how central? Probably A or S.

