  Philosophically, the user correctly identifies the dualism's role. But they might be conflating the need for a moral government with personal survival. Sidgwick thought an afterlife where virtue is rewarded would solve the dualism, but other mechanisms (like karma) could also work. The user focuses on seances, but Sidgwick's SPR work included broader investigations. Still, survival evidence was central, so the user's emphasis isn't misplaced.

