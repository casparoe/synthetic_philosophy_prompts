answer: |-
  Your objection cuts to the heart of the units of selection debate—the concern that gene-centrism smuggles in its conclusion by defining "unit of selection" as "replicator" is legitimate. Here’s a defense of the gene-centric view that doesn’t merely stipulate the replicator criterion, but grounds it in **causal invariance, lineage identity, and the conditions for cumulative adaptation**:

  ### 1. **The Bookkeeping Argument: Genes as the Unifiers of Evolutionary Explanation**  
     - **Problem with Interactor-Centric Views**: Organisms and groups are *ephemeral* and *heterogeneous*. When selection acts on an organism (e.g., a fast rabbit surviving a predator), the causal factors behind its fitness (speed) are typically underpinned by *many genes interacting with the environment*. The organism itself is not directly inherited; its traits are reconstituted in offspring via genetic transmission.  
     - **Gene’s Unique Role**: Genes provide a **stable reference point** for tracking evolutionary change across generations. Even if selection operates on phenotypes (interactors), the *only persistent entities that reappear in offspring with high fidelity* are genes. As Hull put it, genes are the "elements of which the next generation is an almost exact replica."  
     - **Why this isn’t stipulative**: Without genes as replicators, we cannot explain *why* a trait recurs in offspring. Group or organism selection models implicitly rely on genetic inheritance to ensure trait persistence. Genes aren’t just "bookkeepers"—they are the *necessary condition* for heritability.

  ### 2. **Causal Parity and the Problem of "Screening Off"**  
     - **Sober & Lewontin’s Challenge**: They argue that genic selectionism is redundant because organism/group-level explanations "screen off" genetic causes (i.e., once you know the organism’s fitness, adding genic details adds no new causal information).  
     - **Gene-Centric Reply**:  
       - **Causal Fragility of Interactors**: Interactor fitness (e.g., a group’s survival) is context-dependent. A gene for altruism might *lower* an organism’s fitness but *increase* its frequency via kin selection. Only the gene-centric view explains this paradox without ad hoc adjustments.  
       - **Invariance Across Contexts**: Genes retain their identity across different interactors. A selfish allele (e.g., *t-allele* in mice) spreads regardless of whether it’s in a group-selected or individually selected context. The gene’s *expected fitness* is a robust causal property; interactor fitness is derivative.  
     - **Okasha’s Framework**: In multi-level selection (MLS) theory, MLS1 (selection on particles within groups) reduces to genic selection. Only MLS2 (selection on groups *as* replicators) could challenge gene-centrism—but groups rarely replicate with high fidelity. Gene replication is always operative.

  ### 3. **The Requirement for Lineage Formation**  
     - For natural selection to produce adaptation, there must be:  
       (a) Variation,  
       (b) Fitness differences,  
       (c) **Heritability** (a causal link between parent/offspring traits).  
     - **Organisms/Groups Fail Heritability**: An organism doesn’t copy itself; it produces offspring via genetic recombination. Groups (e.g., hives) often dissolve and reform, with no mechanism for high-fidelity group-trait inheritance.  
     - **Genes Succeed**: DNA replication ensures near-exact copying (fidelity ≈ 10⁻⁹ errors/base). This allows lineages to form—a prerequisite for cumulative selection. As Dawkins notes, "You can’t select for a wing half-formed." Only replicators enable stepwise optimization.

  ### 4. **The Emergent Fitness Problem**  
     - Group selectionists argue groups can have "emergent fitness" (e.g., a well-organized hive out-reproduces others). But this relies on:  
       - **Particle-Level Inheritance**: Worker bee traits are inherited via genes from the queen, not from the group structure.  
       - **No Group Replicator**: Hives don’t copy their group properties; new hives inherit genes, not "hive-ness." Contrast this with *actual* group replicators (e.g., endosymbiotic bacteria), which *are* gene-like.  

  ### Conclusion: Genes as the Unit of Selection *Because* They Anchor Evolution  
  Gene-centrism isn’t true by definition—it’s inferred from biology’s causal structure:  
  - **Interactors (vehicles) are selected, but replicators (genes) are what evolve**. Selection acts on phenotypes, but evolution is change in *gene frequencies*.  
  - **Genes resolve Lewontin’s triad**: They are the only entities satisfying variation, differential fitness, *and* heritability *in all cases*.  
  - **Contrast with groups**: Group selection, where validated (e.g., biofilm metabolism), works precisely when groups acquire replicator-like properties (e.g., horizontal gene transfer).  

  In short: Genes aren’t privileged *a priori*; they earn their status by enabling the very possibility of cumulative selection. Organisms and groups are crucial interactors, but their causal power derives from the replicators they carry.  

  #### Key References:  
  - Dawkins, R. (1982) *The Extended Phenotype*: Argues genes transcend interactor boundaries.  
  - Hull, D. (1980) "Individuality and Selection": Replicator/interactor distinction as causal roles.  
  - Okasha, S. (2006) *Evolution and the Levels of Selection*: Shows MLS1 collapses to genic selection.  
  - Gardner, A. (2011) "The Unit of Adaptation": Mathematical case for gene as the "maximand" of selection.
