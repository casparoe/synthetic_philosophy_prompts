  The user also wants sharp follow-ups anticipating dodges. That means predicting common defenses:  
  - For bootstrapping: Guest might say "We'd build safeguards!" → Follow-up should force admission that *choosing safeguards* is itself value-laden.  
  - For convergence: Guest might appeal to idealized debate → Follow-up should ask why this wouldn't just entrench biases or create new conflicts.  
  - For order-dependence: Guest might claim "Reflective equilibrium fixes this" → Follow-up should challenge whether that equilibrium is unique or path-dependent.  

  The user's deeper needs:  
  They’re likely tired of guests rehashing CEV basics. They want to expose weaknesses *through dialogue*, not lecture. The podcast’s value is in rigorous debate, so questions must resist easy answers. Also, subtly testing if the guest has truly novel defenses or just recycles old MIRI arguments.  

  Structuring the questions:  
  1. Start with why CEV *now* (context: MIRI moved on) to frame the skepticism early.  
  2. Hit bootstrapping → follow-up on meta-choices.  
  3. Convergence → follow-up on "better debate" pitfalls.  
  4. Order-dependence → follow-up on path-dependency.  
  5. End with "Why not corrigibility?" forcing direct comparison.  

  Phrasing:  
  Questions should be concise but layered. Use phrases like "Let's unpack that" to signal depth. Avoid jargon; keep accessible but precise. For follow-ups, words like "But doesn’t that just..." create productive tension.  

  Final check:  
