  Then Nora counters by calling it a strawman argument, pointing out that serious theorists like Maynard Smith already incorporated constraints. This makes me pause - she's right that leading figures weren't hyperadaptationists, but Theo's later point about everyday research practices might still hold water. The cathedral example is indeed vivid, but is it doing rhetorical heavy lifting? 

  When Theo shifts to criticizing real-world scientific habits (point 3), that resonates. Even today, journals overflow with "just-so stories" that don't properly test non-adaptive hypotheses. Nora's next move is clever though - she notes that calling something a spandrel can be equally speculative. Her exaptation example is spot-on; Gould himself blurred these categories later. 

  Theo's final rebuttal (point 5) brings it home: the core issue is about burden of proof. Even if categories are fuzzy, we shouldn't default to adaptation without evidence. Nora's valid point about symmetrical speculation doesn't invalidate the need to challenge assumptions. 

  What's missing? Neither mentioned how the paper influenced scientific norms beyond theory - like the rise of constraint-focused fields (evo-devo). Also, the ethical dimension: adaptationist narratives can be politically weaponized (e.g., justifying gender roles). And both overlooked that testing non-adaptive hypotheses often requires different methods - phylogenetics, developmental genetics - which the paper indirectly promoted. 

