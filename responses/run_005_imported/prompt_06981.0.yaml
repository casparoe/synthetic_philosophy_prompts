prompt: |-
  I host a podcast on science and ideas, and next month's guest is a philosopher of language who has just published a book defending Quine's thesis of the indeterminacy of translation in its strongest form: not merely that we may never know which of several rival translation manuals for a language is correct, but that there is no fact of the matter to know, even for a linguist with complete physical knowledge of the speakers. Draft eight to ten interview questions that go beyond having her walk through the gavagai example again. I want at least one question that presses her on why this differs in kind, and not just in degree, from the ordinary underdetermination of any scientific theory by its evidence; one that raises Chomsky's objection that the thesis only looks compelling because Quine restricts the admissible evidence for meaning to dispositions to assent and dissent under sensory stimulation; and one that asks whether large language models, which translate fluently without anything resembling a field linguist's radical-translation scenario, support her view, undermine it, or are simply beside the point. For each, add a short follow-up keyed to the answer she's most likely to give, and close with a question about what could, even in principle, count as evidence against her position.
