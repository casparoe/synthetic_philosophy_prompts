prompt: |-
  Okay so I had this whole argument with my friend Marcus last night that's still bugging me, and I want a third opinion because neither of us budged. Backstory: five years ago, when four of us first moved into our house, we wrote up a little roommate agreement covering rent splitting, chores, guests, all the usual stuff. Two of the original four had just escaped a nightmare living situation where the loudest housemate kept railroading everyone into last-minute rule changes whenever it suited her, so we deliberately put in a line saying the agreement could only ever be changed if literally everyone currently living in the house agreed to it — no majority-rules override, on purpose, specifically so nobody could get steamrolled mid-argument like before.

  Fast forward to now: three of the original four have since moved out and been replaced, one at a time, through totally normal turnover. I'm the only current housemate who was even around when that rule got written; the other two just moved in later and inherited it along with the lease. The three of us who actually live there now want to update the rent split, since it's become pretty unfair given who ended up with the bigger rooms, but Amara — the one original signer still around — is invoking the everyone-agrees rule to block it, even though she'd loose out a little under the new split too, so by her account it's not even self-interest talking. Marcus's position is that Amara's completely in the right, that the rule is exactly there for moments like this, and if you don't like the deal you moved into, you're free to leave, same as she'd have had to back then. My position is that it feels pretty off to hold three people to a rule none of us ever actually agreed to, just because a "majority" who mostly don't even live there anymore once wrote it down five years ago.

  We went back and forth on the porch for like an hour instead of finishing the movie we'd put on, and honestly got nowhere. Marcus kept saying that's just how any group agreement works, otherwise nothing could ever outlast its original members, and I kept saying that can't be the whole story either. Something about his answer feels too neat to me, but I can't quite pin down what's wrong with it, if anything. Who actually has the better argument here, and is there a cleaner way to think about the whole setup than either of us managed?
