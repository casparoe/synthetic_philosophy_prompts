prompt: |-
  In my graduate seminar on decision theory this term, one of my students—a former professional poker player who returned to academia after several years on the circuit—raised an example that has left me dissatisfied with the answer I gave in class, and I would welcome your help thinking it through properly. Consider a coin known with certainty to land heads sixty percent of the time, and suppose you are offered a long sequence of even-money bets on it: on each round you may stake any fraction of your current bankroll, heads doubles the stake and tails loses it, and you may play as many rounds as you like. I told the class that a rational, risk-neutral agent should stake their entire bankroll every round, since this is what maximizes the expected value of their wealth at each stage. My student objected that this policy amounts to near-certain ruin, since a single occurrence of tails wipes the bettor out completely, and across a long enough run the chance of tails coming up at least once approaches one, however favorable the arithmetic looked at the outset. He maintains that the fraction professional gamblers actually stake—on his account, about a fifth of the current bankroll each round, regardless of how many rounds remain—is not a symptom of risk-aversion but simply the fraction that maximizes what an individual bettor's wealth will actually do over a long career, as distinct from what happens on average across a hypothetical population of bettors who each live through a different random sequence of flips.

  What I cannot settle, and what I would like your help with, is whether my student has identified a genuine shortcoming in ordinary expected-value reasoning as applied to sequential, compounding wagers, or whether his rule simply redescribes expected-utility maximization under a suitably concave, for instance logarithmic, utility function for wealth—in which case my original answer to the class was correct after all, and the disagreement is merely terminological. He resists this redescription, insisting that even a bettor with no independent aversion to risk should still adopt his rule, once they properly distinguish an average taken across possible worlds from the average that one and the same person actually accumulates across time. I would like to understand, before the seminar reconvenes, whether this distinction marks a substantive difference in what rationality demands under repeated risk, or whether it collapses on reflection into a familiar fact about risk-averse preferences expressed in unfamiliar terms.
reasoning: |-
  We are considering a coin that lands heads 60% of the time and tails 40% of the time. We are offered a sequence of bets where on each round we can stake any fraction f (0 ≤ f ≤ 1) of our current bankroll. If heads, we double the stake (so we gain f * bankroll). If tails, we lose the stake (so we lose f * bankroll). Thus, after a bet, the bankroll becomes:

    Heads: bankroll * (1 + f)
    Tails: bankroll * (1 - f)

  The student, a former professional poker player, suggests staking a fixed fraction (about 1/5) of the bankroll each time. He claims this is not due to risk aversion but because it maximizes the long-term growth of the wealth for a single individual.

  The professor initially argued for staking the entire bankroll (f=1) every time because it maximizes the expected value of the bankroll at each step. However, with f=1, a single tail leads to ruin (bankroll becomes 0). And in the long run, the chance of avoiding ruin (i.e., never getting a tail) is (0.6)^n, which goes to 0 as n increases. Hence, ruin is almost certain.

  The student's proposed fraction of about 20% (f=0.2) is in fact the solution to the Kelly criterion, which maximizes the expected logarithm of wealth. The Kelly criterion for this bet is:

    f* = p - q   [where p = probability of win, q = probability of loss, and we have even money: b=1]

  But note: in the standard Kelly formula for a bet that pays b:1, we have:

    f* = (bp - q) / b

  In this case, we are betting at even money: if we win, we get the stake back plus an equal amount (so effectively b=1). Thus:

    f* = (1 * 0.6 - 0.4) / 1 = 0.2

  So the Kelly fraction is 20%.

  The Kelly criterion maximizes the long-term growth rate of wealth. Specifically, the growth rate per bet is:

    G(f) = p * log(1 + b*f) + q * log(1 - f)

  In our case, b=1, so:

    G(f) = 0.6 * log(1+f) + 0.4 * log(1-f)

  We maximize G(f) with respect to f. The maximum occurs at f=0.2, and the growth rate at that point is:

    G(0.2) = 0.6 * log(1.2) + 0.4 * log(0.8) ≈ 0.6 * 0.18232 + 0.4 * (-0.22314) ≈ 0.109392 - 0.089256 ≈ 0.020136

  So the growth rate is about 2% per bet.

  Now, let's address the student's point: he says that the 20% stake is not about risk aversion but about maximizing what actually happens in the long run for a single individual. This is exactly what the Kelly criterion does: it maximizes the expected logarithm of wealth, which is equivalent to maximizing the asymptotic growth rate. In the long run, the wealth of a Kelly bettor will almost surely exceed that of any other bettor who uses a different fixed fraction (with probability 1 as the number of trials goes to infinity). Moreover, the Kelly strategy avoids ruin (since f<1, so even a loss leaves you with 80% of your bankroll).

  But note: the professor's original strategy (f=1) does maximize the expected value of the bankroll at the next step:

    E[bankroll_next] = 0.6 * (bankroll * 2) + 0.4 * (bankroll * 0) = 1.2 * bankroll

  which is a 20% expected return. However, the problem is that if we use f=1 repeatedly, the expected value after n steps is (1.2)^n times the initial bankroll, but the actual outcome for the individual is zero with probability 1 - (0.6)^n, and (2^n)*initial_bankroll with probability (0.6)^n. The expected value is high, but the variance is enormous and the probability of ruin is high.

  The student's argument is that we are not interested in the average across many parallel universes (each with a different sequence of coin flips) but in the trajectory of a single individual over time. The Kelly criterion is designed for exactly this: the long-run growth of a single bankroll.

  So, is the student's rule simply a redescription of expected-utility maximization with a logarithmic utility function? Yes, because:

    - Maximizing the expected logarithm of wealth at each step is equivalent to maximizing the expected utility with U(x)=log(x).

    - The logarithmic utility function is concave, which implies risk aversion.

  However, the student resists the idea that this is risk aversion. He argues that even a risk-neutral agent (in the sense of having linear utility) should care about the long-run outcome and thus use the Kelly fraction. But note: a risk-neutral agent with linear utility would only care about expected value at each step. And at each step, the expected value of betting f=1 is 1.2 * bankroll, which is higher than the expected value of betting f=0.2:

    E[bankroll_next] for f=0.2: 
        = 0.6 * (bankroll * (1+0.2)) + 0.4 * (bankroll * (1-0.2))
        = 0.6 * (1.2) + 0.4 * (0.8) = 0.72 + 0.32 = 1.04 * bankroll

  So the expected value is 4% growth per bet, which is less than the 20% from betting all. Therefore, a risk-neutral agent with linear utility would prefer to bet the entire bankroll at every step to maximize the one-step expected value.

  But the student's point is that this leads to ruin almost surely in the long run, and thus the linear-utility risk-neutral agent ends up with zero. So what is the flaw? The flaw is that the linear-utility maximizer is only looking one step ahead. If we consider multiple steps, the linear utility maximizer would still maximize the expected value at the next step, regardless of the future. However, if we are allowed to play many rounds, then we must consider the entire sequence. The linear utility of the final wealth would be:

    U(final wealth) = final wealth

  and the expected utility is E[final wealth]. How do we maximize E[final wealth] over n steps?

  If we let f be the fraction staked at each step (constant fraction), then after n steps, if we have k heads and n-k tails, the wealth is:

    W = W0 * (1+f)^k * (1-f)^{n-k}

  The expected wealth is:

    E[W] = W0 * Σ_{k=0}^{n} [C(n,k) * (0.6)^k * (0.4)^{n-k} * (1+f)^k * (1-f)^{n-k}]
          = W0 * [0.6*(1+f) + 0.4*(1-f)]^n
          = W0 * [0.6 + 0.6f + 0.4 - 0.4f]^n
          = W0 * [1 + 0.2f]^n

  To maximize E[W], we maximize [1+0.2f]^n. Since n is fixed, we maximize the base (1+0.2f). This is maximized by taking f as large as possible, i.e., f=1. Thus, the expected wealth after n steps is maximized by betting the entire bankroll every time. However, note that with f=1, the wealth becomes:

    W = W0 * 2^k * 0^{n-k}   [if there is at least one tail, the wealth becomes 0]

  So the expected value is:

    E[W] = W0 * [ (0.6)^n * 2^n ]   [only when all are heads, otherwise 0]

          = W0 * (1.2)^n

  But the probability of getting all heads is (0.6)^n, which becomes very small as n grows. So even though the expected value is high, the typical outcome is zero.

  The student's point is that for a single individual, what matters is the typical outcome (or the median outcome) and the avoidance of ruin. The Kelly criterion maximizes the median outcome and also the long-run growth rate.

  So, to summarize:

  1. If the agent has a linear utility function, then maximizing expected utility at each step (or over the entire sequence) leads to f=1. This gives the highest expected wealth at the end, but with a high probability of ruin.

  2. If the agent has a logarithmic utility function, then maximizing expected utility leads to the Kelly fraction (f=0.2). This avoids ruin and maximizes the long-run growth rate.

  The student is arguing that even without an inherent aversion to risk (i.e., without a concave utility function), we should care about the long-run outcome for a single trajectory. But note: the long-run outcome for a single trajectory is determined by the growth rate. The Kelly fraction maximizes the growth rate, and hence the long-run wealth.

  However, the linear utility agent does not care about the growth rate per se; they care about the expected value of wealth at the end. And that is maximized by f=1.

  So the disagreement is about the utility function. The student is implicitly using a utility function that values the long-run growth, which is equivalent to using a logarithmic utility function. But if the agent is truly risk-neutral (with linear utility), then they should be willing to take the risk of ruin for the chance of an exponentially large payoff.

  In practice, however, the chance of ruin is unacceptable to most people. Moreover, the student's point about a professional gambler's career is that they cannot afford to go bankrupt because that ends their career. Hence, they must avoid ruin. This is a constraint that the linear utility maximizer ignores.

  Therefore, the professor's original answer (that a risk-neutral agent should bet everything) is correct under the definition of risk-neutrality (linear utility). However, in the context of repeated betting over a long career, it is irrational to accept a strategy that leads to almost certain ruin, even if it has a high expected value. This is because the agent only gets to live one life (one sequence of bets). Hence, the Kelly criterion is often recommended.

  But note: the Kelly criterion is derived from maximizing the expected logarithm of wealth, which is a particular form of risk aversion. So it is a form of expected utility maximization with a concave utility function.

  So, is there a genuine shortcoming in ordinary expected-value reasoning? The shortcoming is that expected-value reasoning with linear utility does not account for the compounding of risk over time and the possibility of ruin. It maximizes the average outcome in a hypothetical ensemble of many parallel universes, but in the one universe we live in, we might end up with nothing. The Kelly criterion, on the other hand, maximizes the typical outcome in the long run and avoids ruin.

  Conclusion:

  The student has identified a limitation of one-step expected-value maximization when applied repeatedly without regard to the long-run consequences. The ordinary expected-value reasoning (with linear utility) does not incorporate the risk of ruin and the effect of compounding. However, if we extend expected utility to the entire sequence and use a linear utility function, we still get f=1. The problem is that linear utility does not capture the disutility of ruin. In contrast, the logarithmic utility function (or any concave utility that goes to negative infinity as wealth goes to zero) will avoid ruin.

  Thus, the disagreement is not merely terminological. The student's rule (Kelly) is the solution for maximizing long-run growth and avoiding ruin, but it requires a concave utility function (specifically, logarithmic). The linear utility approach, while consistent with risk-neutrality in a one-shot bet, leads to ruin in repeated play. Therefore, for a long sequence of bets, a rational agent who wishes to avoid ruin and maximize long-run growth should use the Kelly fraction, which implies a concave utility function. The student's intuition that this is not about risk aversion in the traditional sense might be because he is focusing on the long-run outcome, but the mathematical derivation shows it is equivalent to risk aversion.

  Hence, the professor might explain to the class:

    - For a single bet, a risk-neutral agent should bet the entire bankroll (f=1) because it maximizes expected value.

    - For repeated bets, if the agent is risk-neutral (linear utility) and cares only about expected terminal wealth, then they should still bet the entire bankroll at every step. However, this leads to almost certain ruin in the long run.

    - If the agent wishes to avoid ruin and maximize the long-run growth rate, they should use the Kelly fraction (f=0.2), which is equivalent to maximizing expected logarithmic utility.

    - Therefore, the choice between f=1 and f=0.2 depends on the agent's utility function and their time horizon.

  In the context of a professional gambler who must avoid ruin to continue playing, the Kelly criterion is rational. But if the gambler is only playing a fixed, small number of rounds and is truly risk-neutral, then betting everything might be rational (if they can absorb the loss of the entire bankroll without catastrophic consequences).

  However, note that in the real world, even a risk-neutral agent might be constrained by bankruptcy. Hence, the Kelly criterion is often the practical choice for repeated betting.

  So, for the seminar, the professor might conclude that the student has identified a crucial aspect of repeated bets: the risk of ruin. But this does not invalidate expected utility theory; rather, it shows that for long sequences, a concave utility function (like logarithmic) is more appropriate to avoid ruin and achieve long-run growth.
answer: |-
  The student's observation highlights a critical nuance in decision theory for sequential, compounding wagers. Your original answer—that a risk-neutral agent should stake their entire bankroll every round to maximize expected value—is mathematically correct for a single round or when expected value is evaluated independently at each step. However, in the context of repeated play, this policy is problematic because it ignores the multiplicative nature of wealth accumulation and the near-certainty of ruin over time. The student's proposed strategy (staking ~20% per round) is optimal for maximizing long-term growth, but it arises from maximizing expected *logarithmic* utility, not from risk-neutrality. Let's break this down step by step.

  ### 1. **The Shortcoming of Expected-Value Maximization**
     - **Single-round reasoning**: For one round, staking the entire bankroll (\(f = 1\)) maximizes expected value:  
       \[
       \text{EV} = 0.6 \times (2 \times \text{bankroll}) + 0.4 \times 0 = 1.2 \times \text{bankroll}.
       \]
       This yields a 20% expected return, superior to any fraction \(f < 1\).
     - **Multi-round reality**: Over many rounds, wealth compounds multiplicatively:  
       \[
       W_n = W_0 \times (1 + f)^H \times (1 - f)^T,
       \]
       where \(H\) and \(T\) are the number of heads and tails. With \(f = 1\), a single tail reduces wealth to zero ("ruin"). The probability of avoiding ruin over \(n\) rounds is \(0.6^n\), which approaches zero as \(n\) grows. Thus, while the expected terminal wealth \(\mathbb{E}[W_n]\) grows exponentially (driven by the vanishingly rare all-heads outcomes), the *typical* outcome is ruin. This violates the student's intuition: rational agents care about the distribution of outcomes in their single realized path, not just the ensemble average across hypothetical paths.

  ### 2. **The Student's Strategy: Kelly Criterion**
     - The student's fraction (20%) matches the **Kelly criterion** for maximizing long-term growth rate. The growth rate \(G(f)\) is:  
       \[
       G(f) = \mathbb{E}[\log(1 + r)] = 0.6 \log(1 + f) + 0.4 \log(1 - f),
       \]
       where \(r\) is the return per round. Maximizing \(G(f)\) gives:  
       \[
       f^* = p - q = 0.6 - 0.4 = 0.2, \quad \text{(since the bet is even-money, } b = 1\text{).}
       \]
     - **Properties of \(f^* = 0.2\)**:
       - It maximizes the median terminal wealth and the rate of wealth growth \(\lim_{n \to \infty} \frac{1}{n} \log W_n\).
       - It avoids ruin (since \(f < 1\)), and wealth grows exponentially with minimal volatility.
       - It outperforms any other fixed fraction in the long run with probability 1.

  ### 3. **Is This Expected-Utility Maximization?**
     - **Yes, under logarithmic utility**: Maximizing \(G(f)\) is equivalent to maximizing expected utility \(U(W) = \log(W)\). This is a concave utility function, implying risk aversion. The student's strategy maximizes \(\mathbb{E}[\log(W_n)]\), which:
       - Penalizes ruin (as \(\log(W) \to -\infty\) when \(W \to 0\)).
       - Values proportional growth: a 10% gain adds the same utility whether wealth is $100 or $100,000.
     - **Student's objection**: He argues this is not about risk aversion but about "what one actually accumulates over time." This is partially semantic. The Kelly strategy *is* expected-utility maximization for a specific (logarithmic) utility function. However, his deeper point—that rational agents should prioritize long-run growth over short-run expected value—is valid and distinct from traditional risk-aversion narratives.

  ### 4. **Does Risk-Neutrality Demand Full Staking?**
     - **For a true risk-neutral agent (linear utility \(U(W) = W\))**:
       - Maximizing \(\mathbb{E}[W_n]\) requires \(f = 1\) at every round, as it dominates any \(f < 1\) in expectation.  
         \[
         \mathbb{E}[W_n] = W_0 \times (1 + 0.2f)^n \quad \text{(maximized at } f = 1\text{)}.
         \]
       - However, this leads to ruin with probability \(1 - 0.6^n \approx 1\) for large \(n\). The high expected value is an artifact of rare, astronomically high outcomes (all heads), which do not reflect the agent's lived experience.
     - **The conflict**: A risk-neutral agent focused solely on \(\mathbb{E}[W_n]\) is indifferent to ruin, but humans and professionals are not. The student's point exposes that **risk-neutrality in repeated games fails to distinguish between:**
       - The ensemble average (across many parallel universes).
       - The time average (along a single path).
       In the latter, ruin is fatal, and growth rate matters more than expectation.

  ### 5. **Substantive vs. Terminological Disagreement**
     - **Substantive difference**: The student identifies a gap in naïvely applying one-step expected-value reasoning to multi-step compounding scenarios. Rationality in repeated gambles requires attention to:
       - The non-ergodicity of wealth (i.e., the ensemble average ≠ time average).
       - Survival constraints (avoiding ruin to continue playing).
       - Growth-rate maximization as a proxy for long-run success.
       This is not captured by risk-neutral linear utility, which ignores path dependence.
     - **Terminological overlap**: The student's strategy *is* expected-utility maximization under logarithmic utility. His "no independent risk aversion" claim is misleading; log utility *embodies* aversion to destructive volatility (e.g., ruin). However, his framing emphasizes that this aversion arises from structural properties of repeated betting (ergodicity breaking), not psychological fear.

  ### Conclusion and Teaching Response
  - **Your original answer** was correct for a one-shot bet or a risk-neutral agent myopically maximizing per-step EV. But for repeated play, it is flawed: it ignores ruin and path dependence.
  - **The student is correct** that professionals use \(f = 0.2\) to maximize long-run growth, and this is rational even without exogenous risk aversion. However, this is equivalent to expected-log-utility maximization, which endogenously encodes "growth-optimal" risk preferences.
  - **Key insight for class**: Rationality in sequential risk depends on the agent's objective:
    - Maximize expected terminal wealth? Stake fully (but accept near-certain ruin).
    - Maximize long-run growth or median wealth? Use Kelly (\(f = 0.2\)).
    - Avoid ruin at all costs? Stake less than Kelly.

  In practice, the Kelly criterion balances growth and survival, justifying the student's "fifth of the bankroll" rule. The distinction between ensemble averages and time averages is profound and shows that expected-value reasoning must be refined for dynamic, multiplicative settings. This is not a rejection of expected utility but a refinement for repeated gambles. For your seminar, emphasize that decision theory must account for the temporal structure of risk—a point elegantly raised by your student.
