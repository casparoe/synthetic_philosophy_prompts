  I should avoid heavy exposition. Instead, show the distortion through sensory details and Daniel's reactions. Using phrases like "perception curdling" and "feedback loop of dread" ties back to the cognitive penetration concept. Keeping the story tight, focusing on key moments, ensures it fits within a page or two while delivering the intended impact.
answer: |-
  Here’s a self-contained short story exploring that visceral, perception-altering jealousy, faithful to the cognitive penetration debate:

  **Title:** The Angle of Her Smile

  The low thrum of conversation in "The Grotto" usually soothed Daniel. Tonight, it was just noise, a screen behind which Elena and *him* were performing their pantomime. Leo. The new architect. Young. Confident. Hands that gestured too freely near Daniel’s wife.

  Daniel nursed his whiskey, the ice long melted. He watched from the shadowed booth. They were at the polished bar, three stools down. Elena laughing at something Leo said, leaning slightly towards him. *Too close.*

  That’s when it started. Not a thought, not an interpretation. A *shift* in the world itself.

  Leo placed a hand lightly on Elena’s forearm, pointing at something on his phone screen. Daniel *saw* the contact. But the angle… the angle seemed suddenly predatory. Leo’s fingers weren’t resting; they were *grasping*, possessive. The distance between their bodies, which Daniel knew logically was a respectable foot or more, visually collapsed. They seemed pressed together, Leo leaning in with an intimacy that hadn’t been there moments before. The dim bar light caught Leo’s smile – now a leer, full of knowing complicity. Daniel’s own breath hitched; the air felt thick, charged with betrayal.

  *It’s the angle,* a rational voice whispered, buried deep. *The light. You’re tired. Stressed about the merger.* But the visual field refused to correct itself. The slope of Leo’s shoulder towards Elena looked steeper, an aggressive invasion of her space. Her responding smile, which Daniel knew as warm and open, now seemed… secretive. Coy. Offered specifically for Leo’s benefit. The curve of her lips held a knowledge Daniel wasn't privy to. He *saw* the conspiracy in the tilt of her head, the conspiratorial dip of her lashes.

  He forced himself to look away, down at his glass. Condensation blurred the wood grain. *Calm down. It’s nothing.* He took a shaky breath, looked back.

  Leo leaned in again, whispering something directly into Elena’s ear. Daniel’s vision tunneled. The space between Leo’s mouth and Elena’s ear vanished. It wasn't a whisper; it was a *kiss*. A brief, unmistakable press of lips against her temple, shielded by the fall of her hair. Daniel’s heart hammered against his ribs. A cold certainty flooded him. *There. Proof. In the perception itself.*

  He stood, the booth scraping loudly. Heads turned, including Elena’s and Leo’s. Their expressions – surprise, mild concern – registered, but his altered perception overlaid them instantly. Leo’s surprise looked like guilt caught in headlights. Elena’s concern morphed into the flustered mask of someone discovered.

  "Daniel? Everything okay?" Elena called, starting to slide off her stool.

  He couldn't speak. The evidence was *right there*, visually undeniable. The kiss, the closeness, the conspiratorial smiles – they weren't interpretations layered *on* neutral sense-data; they *were* the sense-data. His jealousy hadn’t colored the picture; it had *reforged the canvas*. The feedback loop was complete: the fear generated the perception, and the perception fed the certainty, deepening the fear. It felt *more* real than the neutral bar scene he knew existed just beneath the surface, because it was sensorially immediate.

  As Elena walked towards him, concern deepening into worry on her *actual* face, Leo picked up Elena’s half-finished cocktail glass. He took a sip, a casual, proprietary gesture that screamed intimacy to Daniel’s distorted sight. Daniel flinched.

  "Dan? You look pale." Elena touched his arm. Her touch, usually anchoring, felt like an electric shock of duplicity.

  "Fine," he managed, his voice tight. "Just… stuffy. Need air." He gestured vaguely towards the door, unable to look directly at Leo, who was now watching them with polite detachment – which Daniel *saw* as smug triumph.

  Later, washing his hands in the restroom, the cold water shocked his system. He stared at his reflection – strained, haunted. *Did I see it? Or did I make it?* The question felt academic, irrelevant. The kiss *had* happened, visually. The closeness *was* invasive. The evidence was perceptual, raw and unmediated. Fodor’s sealed module felt like a naive fantasy. Jealousy hadn't judged; it had *sculpted*.

  Returning to the booth, he saw Elena alone. "Leo headed out," she said. "He seemed worried about you." She pushed her glass towards him. "You barely touched your drink. Want a sip of my awful cosmopolitan?"

  He looked at the glass. The rim. Where Leo’s lips had touched it. He *saw* the faint, greasy smudge of lipstick that wasn't Elena’s signature berry shade. Indisputable. Tangible proof embedded in the visual field.

  He reached for it, his hand trembling slightly. As his fingers brushed the cold stem, Elena’s hand, reaching to adjust the napkin beneath it, knocked the glass sideways. Cosmopolitan spilled across the polished wood, a shocking pink flood.

  "Damn!" Elena grabbed napkins, mopping frantically. "Clumsy me!"

  Daniel stared at the spreading stain, then at the now-empty glass, held upside-down in Elena’s napkin-clutching hand. The rim, wiped clean by the spill and the napkins, gleamed under the light. Utterly smooth. No smudge. No foreign lipstick. Just clean glass.

  The perceptual certainty that had gripped him moments before wavered, then shattered like the ice in his abandoned whiskey. The slope of Leo’s shoulder returned to neutral geometry. The distance reasserted itself. The kiss… *had* it ever been more than a whisper glimpsed through the distorting lens of dread?

  But the cold residue of *having seen it* remained, clinging like the sticky scent of spilled sugar and alcohol. Had the glass erased the evidence? Or had the evidence only ever existed in the terrifying, fertile ground where fear reached down and rewired sight itself? The doubt, now, was the most terrifying perception of all.

  ---

  **Philosophical Underpinnings Illustrated:**

  1.  **Direct Perceptual Alteration:** Daniel doesn't *infer* intimacy from neutral observations. The perceived distance physically shrinks, angles become predatory, a whisper becomes a visible kiss, a smile acquires secret meaning. His jealousy directly changes the *content* of his visual experience, not just his beliefs *about* it.
  2.  **Feedback Loop:** The altered perception (seeing the kiss) feeds his certainty and deepens his jealousy, which further distorts subsequent perceptions (Leo drinking from Elena's glass), creating a self-reinforcing cycle of dread.
  3.  **The Plot Turn & Ambiguity:** The spilled glass provides a moment of potential disconfirmation. The *absence* of the lipstick smudge challenges the reality of Daniel's perception. Yet, the visceral *memory* of having seen it remains powerful. The story doesn't definitively answer *what happened* at the level of light hitting retinas; it highlights the *experience* of perception being fundamentally altered by the cognitive/emotional state, and the terrifying ambiguity that creates. Was the smudge *really* there and wiped away? Or was it *only* ever a phantom generated by jealousy? Daniel (and the reader) are left in the unsettling space where the line between "real" perception and cognitive penetration blurs.
  4.  **Fodor vs. Cognitive Penetration:** The story embodies the contested claim. Fodor's "encapsulated" perception (where bias only affects judgment *after* perception) is represented by Daniel's initial rational voice and the final, neutral appearance of the glass rim. The *dominant* experience, however, is of perception being deeply penetrated and restructured by his jealousy, supporting the opposing view. The climax hinges on this tension.
