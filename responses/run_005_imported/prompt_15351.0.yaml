prompt: |-
  I host a little podcast on the side where I get philosophers to come argue about big questions, and next month's guest has just published a book reviving Galen Strawson's old "Basic Argument" against moral responsibility. It's the one where, to be truly and ultimately responsible for what you do, you'd have to be causa sui — "cause of yourself," a phrase Strawson borrows from Nietzsche, who thought the whole idea was a self-contradiction — in your own mental makeup, and since nobody chooses the character that made them choose the character that made them choose... (you get the regress), that's supposed to be impossible, so real, desert-level responsibility never gets off the ground. I've read the papers enough times to follow the logic, but I really don't want forty minutes of her just re-walking me through the syllogism — I want questions that actually push on the sore spots instead.

  Could you draft me eight or nine interview questions that do that? I'd like at least one that goes after her move of seperating "true" or "ultimate" responsibility (the heaven-and-hell, cosmic-desert kind) from the everyday compatibilist responsibility we use to run courtrooms and friendships — is that distinction doing real philosophical work, or is it just a relabeled retreat? One on why she thinks tossing some indeterminism into the picture doesn't rescue anyone either — doesn't that just swap "you're shaped by factors outside your control" for "you're randomly shaped by nothing at all," which seems like a worse problem for grounding responsibility, not a solution to it? One that brings up the almost funny wrinkle that Galen Strawson's own father, P.F. Strawson, is basically the guy who built modern compatibilism out of reactive attitudes in "Freedom and Resentment" — does the Basic Argument actually refute that naturalistic move, or does it just insist reactive attitudes were never answering the real question in the first place? And I definately want one on the bit where, by Strawson's own admission, you apparently can't help *feeling* responsible for stuff day to day even once you're fully convinced the argument is sound — ask her if that's true for her too, and what that tension is supposed to tell us about how much weight the argument can actually bear. For each question, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for first, since I'd rather over-prepare than get stuck nodding along on air.
