answer: |-
  Here's a detailed comparison of Lewis's and Skyrms's approaches, structured to address your core questions about explanatory scope, normative force, and potential complementarity:

  ### **Core Differences in Explanatory Strategy**
  | **Feature**               | **Lewis (Convention)**                          | **Skyrms (Evolutionary Dynamics)**              |
  |---------------------------|------------------------------------------------|------------------------------------------------|
  | **Mechanism**             | Common knowledge & rational expectations       | Replicator dynamics / reinforcement learning   |
  | **Cognitive Requirements**| Infinite higher-order beliefs (idealized)      | No theory of mind; behavioral adaptation only  |
  | **Explanatory Target**    | *Why* conventions persist (rational equilibrium)| *How* conventions emerge (historical selection)|
  | **Normative Foundation**  | Mutual expectations + common knowledge         | Evolutionary stability + behavioral incentives |

  ---

  ### **Does Skyrms Fully Replicate Lewis's Explananda?**
  1. **Arbitrariness**:  
     ✅ **Yes** – Skyrms reproduces this via multiple stable equilibria (e.g., in Stag Hunt or Signaling games). The selected equilibrium is path-dependent, not uniquely optimal.

  2. **Self-Perpetuating Expectations**:  
     ⚠️ **Partially** – Skyrms generates *behavioral regularities* that incentivize conformity, but replaces "expectations" with *empirical frequencies* (e.g., "I conform because others did in past interactions"). Lewis's mutual expectations become correlation in behavioral strategies.

  3. **Following a Convention vs. Individual Best Response**:  
     ✅ **Yes** – In Skyrms, agents converge to correlated equilibria where conformity is conditional on others' behavior. Violating the norm reduces payoffs (e.g., mismatched signals). The *conditional* aspect preserves Lewis's intuition.

  4. **Common Knowledge**:  
     ❌ **Explicitly Rejected** – Skyrms shows coordination can emerge from local interactions and learning, without agents modeling others' mental states. This is his key departure.

  ---

  ### **The Normative Force Problem: The Crucial Gap**
  - **Lewis's Account**: Normativity arises from **mutual accountability**. If you violate a convention:  
    • You *disappoint* others' (commonly known) expectations.  
    • You *exploit* their conformity (free-riding).  
    → Justifies blame: "You *knew* we expected you to φ!"
    
  - **Skyrms's Account**: Normativity reduces to **strategic disadvantage**. Violating a prevalent regularity:  
    • Lowers your payoffs (e.g., signaling failures).  
    • May trigger punishment (if modeled via sanctions).  
    → Blame is instrumental: "You made things worse *for yourself/us*."  

  **Critique**: Skyrms explains *compliance incentives* but not the *deontic layer* ("ought" beyond consequences). For Lewis, normativity stems from the *interpersonal commitment* inherent in common knowledge; for Skyrms, it’s purely consequentialist.

  ---

  ### **Which Account Does More Explanatory Work?**
  - **For Human Conventions**: **Lewis** better captures the *phenomenology* of normativity (e.g., "we drive on the right *because we all know we expect it*").  
  - **For Emergence & Robustness**: **Skyrms** is superior. His models show:  
    • How conventions arise without hyper-rationality (§ Lewis's idealism).  
    • Why conventions persist despite population turnover.  
    • How norms spread via cultural evolution (e.g., biased transmission).  

  ---

  ### **Competitors or Complements?**
  They address **distinct (but adjacent) phases** of normativity:  
  1. **Skyrms explains the *origin* of behavioral regularities**.  
  2. **Lewis explains their *social ontology* once established**.  

  **Synthesis Proposal**:  
  - **Phase 1 (Skyrms)**: Reinforcement learning/replicator dynamics create a stable behavioral regularity.  
  - **Phase 2 (Lewis)**: Once entrenched, agents *develop mutual expectations* about the regularity. Common knowledge emerges *ex post* as a social scaffold, layering normative force onto the evolved baseline.  
  → Conventions begin as "Skyrmsian" but become "Lewisian" through reflexive social cognition.  

  ---

  ### **Discussion Questions for Your Seminar**
  1. **Normative Force**: Can Skyrms’s punishment models (e.g., ultimatum game dynamics) generate *genuine obligations*, or merely prudential incentives? Does Lewis’s appeal to common knowledge solve this, or relocate the problem?  
  2. **Arbitrariness**: If a convention evolves because it’s uniquely efficient (not arbitrary), does it still count as a "convention" for Lewis? For Skyrms?  
  3. **Cognitive Realism**: Is Lewis’s common knowledge requirement a useful *idealization* for human conventions, or an indefensible fiction? Can Skyrms’s agents ever develop "proto-normativity"?  
  4. **Synthesis**: Could common knowledge *itself* evolve via Skyrmsian dynamics (e.g., higher-order expectations as stable equilibria)? Or is it categorically different?  
  5. **Explanatory Scope**: Does Skyrms’s framework better explain *non-human* conventions (e.g., animal signaling), while Lewis captures uniquely *human* normativity?  

  ### **Key Takeaway for Students**
  Lewis and Skyrms offer **complementary explanations for different aspects of social reality**. Skyrms demystifies the *emergence* of conventions without extravagant cognition; Lewis explains why human conventions *feel binding* in a way that transcends mere habit. The "normative residue" likely requires Lewis’s intersubjective expectations—but these may themselves be evolutionary products. The deepest insight lies in their integration: biology builds the coordination device; common knowledge wires it into our social psyche.
