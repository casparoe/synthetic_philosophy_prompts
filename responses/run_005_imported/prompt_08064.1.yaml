prompt: |-
  So a few of us from a rationalist-adjacent Discord run recurring side bets at meetups (sports outcomes, elections, random nerdy stuff), and ages ago we agreed to size wagers as a % of a personal bankroll each person tracks, instead of fixed dollar amounts. Theres a running argument about how big that % should be though. Priya's take: work out whatever % maximizes your expected winnings over many bets and just bet that, scaling up with your edge, since leaving EV on the table is silly. Dave bets noticeably less than that using some formula he swears by, and even shades that number down even further because he says he's never fully sure of his edge estimate, which just makes Priya more convinced he's being timid. Whenever I've pushed him on why his number should beat straightforward EV maximization though, he kinda hand-waves it. Except I've watched this play out over a bunch of sessions now, and Priya's approach does seem to wipe people out eventually even though every single bet is +EV. So is Priya's reasoning actually flawed, or just differently risky? And is there a real principled case for Dave's more conservative number (both the base formula and the extra shading), or is he just risk-averse and dressing it up in math?
reasoning: |-
  Okay, let me unpack this user's query about their Discord group's betting strategies. They're running side bets based on percentage of bankroll, with Priya advocating for full EV maximization and Dave using a more conservative approach. The key observation is that Priya's method leads to wipeouts despite +EV bets, which suggests something deeper is wrong.

  First, I need to recognize the core issue: Priya is likely using the Kelly Criterion without realizing its limitations. Kelly maximizes long-term growth but has high volatility. The wipeouts happen because in reality, bettors face finite sequences of bets and imperfect information. 

  Dave's behavior is interesting - he reduces his bets below his calculated edge. That screams uncertainty management. The user mentions Dave "shading down" his bets, which aligns with fractional Kelly strategies I've seen in portfolio theory. His intuition might be mathematically sound even if he can't articulate it.

  The user's real question seems twofold: is Priya's approach fundamentally flawed, and is Dave's conservatism justified? The wipeouts answer the first part - yes, because real-world conditions violate Kelly's assumptions. For Dave, I should explain how uncertainty adjustments work mathematically. Maybe mention Bayesian approaches or robust optimization?

  I should emphasize the difference between theoretical EV and practical survival. Priya's mistake is ignoring bankroll depletion risk. The fact that all bets are +EV doesn't matter if variance can destroy you before the long run arrives. This connects to gambler's ruin concepts.

  For the response structure: first explain why Priya's strategy fails (variance, finite bets), then validate Dave's approach (uncertainty hedging), and finally suggest a middle ground like fractional Kelly. The user would probably appreciate concrete math but keep it accessible since it's a Discord group.
answer: |-
  This is a brilliant question that cuts to the heart of practical decision-making under uncertainty. Priya's pure EV-maximization ("Max EV") is mathematically appealing but fatally flawed in the real world. Dave's conservatism, while perhaps poorly articulated, is grounded in sound principles of risk management and uncertainty. Let's break down why:

  **1. Why Priya's Approach Wipes People Out (The Kelly Criterion & Variance):**

  *   **The Kelly Criterion:** Priya is intuitively aiming for the *Kelly Criterion*. This is the mathematically optimal bet size (`f*`) as a % of bankroll that *maximizes the long-term exponential growth rate* of your wealth for repeated +EV bets. The formula is:
      `f* = (bp - q) / b`
      Where:
      *   `b` = Net odds received on the wager (e.g., 2:1 odds means `b = 2`)
      *   `p` = Probability of winning
      *   `q` = Probability of losing (`1 - p`)
      *   **Edge = `(bp - q)`** (This is Priya's "edge")
  *   **Why Kelly "Works":** If your `p` and `b` estimates are *perfectly accurate* and bets are *infinitely repeated*, betting Kelly maximizes your long-run growth. It avoids ruin (`f*` is always < 100% if `p < 1`).
  *   **Why Kelly Fails in Reality (The Wipeout Problem):**
      *   **Variance is Brutal:** Betting full Kelly (`f*`) comes with *massive volatility*. Your bankroll will experience huge swings (drawdowns). You *will* experience long losing streaks. A 50% drawdown requires a 100% gain just to break even. Repeated large drawdowns make recovery incredibly difficult and destroy compounding.
      *   **Finite Bets, Not Infinity:** Your Discord meetups involve a finite number of bets. The "long run" might never arrive before a bad streak decimates your bankroll or you stop playing. Kelly optimizes for infinity, but humans play in finite time.
      *   **Imperfect Information:** This is the **CRITICAL POINT**. Priya's `p` (probability estimate) is *never* perfectly accurate. It's an *estimate* based on limited information, biases, and noisy data. Betting *as if* your `p` is perfect when it isn't is disastrous.
      *   **Overbetting Edge:** Priya's "bet your edge" *is* Kelly (`f* = edge / b` for even-money bets where `b=1`). But if your *estimated* edge is higher than your *true* edge (which it almost always is due to overconfidence or incomplete info), betting full Kelly means you are *overbetting*. Overbetting drastically increases your risk of ruin and significantly reduces your *actual* long-run growth rate compared to betting optimally for your *true* edge. **This is the core reason for the wipeouts.**

  **2. The Principled Case for Dave's Conservatism:**

  Dave's approach likely aligns with robust bankroll management principles designed to handle the real-world limitations ignored by pure Max EV/Kelly:

  *   **Fractional Kelly:** The most common *principled* alternative. Instead of betting `f*` (full Kelly), you bet `f = k * f*`, where `0 < k < 1` (e.g., k=0.5, "Half Kelly").
      *   **Benefits:** Dramatically reduces volatility and drawdowns (risk of ruin plummets). Improves the compound growth rate *if your edge is overestimated* (which is common). Sacrifices a *small* amount of *theoretical* max growth for a *massive* increase in survival probability and reduced emotional toll. The growth rate penalty for `k=0.5` is only 25%, while the volatility is halved.
      *   **Dave's "Base Formula":** This is likely some variant of Fractional Kelly.
  *   **Shading Down for Uncertainty (The REAL Principled Move):** This is where Dave shines, even if he can't articulate the math.
      *   **Uncertainty is Paramount:** Your edge estimate (`p`) has a *confidence interval*. It's not a single point. Maybe you think `p = 55%` for an edge, but realistically, it could be anywhere between `52%` and `58%` (or wider!).
      *   **Conservative Estimation:** To avoid the fatal flaw of overbetting due to overestimated edge, you *deliberately use a more conservative (lower) estimate of `p`* when calculating your bet size. Instead of using your "best guess" `p_best=55%`, you might use `p_conservative=53%` to calculate a smaller `f*`.
      *   **Margin of Safety:** This builds in a margin of safety against estimation error. You're acknowledging that your knowledge is imperfect and acting to protect your bankroll from that imperfection.
      *   **Mathematical Justification:** This can be formalized through:
          *   **Robust Optimization:** Finding a bet size that performs well across a *range* of possible true probabilities.
          *   **Bayesian Approaches:** Incorporating prior beliefs and updating uncertainty as you see outcomes. Betting based on a pessimistic percentile of your posterior distribution for `p`.
          *   **Risk Aversion (Utility):** While Priya only cares about EV (linear utility of wealth), Dave might intrinsically value avoiding ruin more (concave utility). However, the uncertainty argument stands *even for pure growth maximizers*.
  *   **Minimizing Risk of Ruin:** Dave's approach explicitly prioritizes survival. The formula he uses likely has a much lower probability of reducing his bankroll to near zero over the sequence of bets you actually play compared to Priya's.

  **3. Priya vs. Dave: The Core Differences**

  | **Aspect**          | **Priya's Approach**                     | **Dave's Approach**                           |
  | :------------------ | :--------------------------------------- | :-------------------------------------------- |
  | **Optimization Goal** | Maximum Expected Value (EV)              | Sustainable Growth + Survival                 |
  | **Assumptions**     | Perfect probability knowledge            | Acknowledges estimation uncertainty           |
  | **Risk Perspective**| Ignores variance and tail risk           | Actively manages drawdown risk               |
  | **Bankroll Behavior**| High volatility, frequent large drawdowns| Smoother growth, smaller drawdowns            |
  | **Edge Estimation** | Uses "best guess" point estimate         | Uses conservative estimate or uncertainty adj |
  | **Practical Outcome**| Boom/bust cycles, eventual wipeouts      | Steadier accumulation, long-term survival     |

  **4. The Verdict:**

  *   **Priya's Reasoning is Flawed:** Pure EV-maximization (effectively betting estimated full Kelly) is flawed for real-world, finite sequences of bets where probabilities are estimated with uncertainty. It ignores the devastating impact of variance and the near-certainty of overestimating your edge, leading to overbetting and high risk of ruin. **Leaving EV on the table is often smarter than betting so much that you risk losing your ability to play future +EV bets.**
  *   **Dave's Conservatism is Principled (and Correct):**
      *   His "base formula" (likely Fractional Kelly) is a standard, mathematically sound approach to reduce volatility and improve real-world performance over finite horizons.
      *   His "shading down" for uncertainty is **essential best practice**. It's not mere timidity; it's rational risk management acknowledging imperfect information. It protects against the biggest weakness of the Kelly approach.

  **Recommendation for Your Discord Group:**

  1.  **Acknowledge Kelly as the Theoretical Baseline:** Understand that Kelly defines the *maximum growth* point under perfect information.
  2.  **Embrace Fractional Kelly:** Agree on a fractional multiplier (`k`) for the group (e.g., 1/4, 1/3, or 1/2 Kelly). This directly addresses the variance/wipeout problem. This should be Dave's "base formula".
  3.  **Incorporate Uncertainty Explicitly:** Encourage everyone (especially Priya) to:
      *   Quantify their uncertainty on `p` (e.g., "I think it's 60%, but I wouldn't be shocked if it's only 55%").
      *   Use a *conservative estimate* of `p` (e.g., the low end of their believable range) when calculating their Kelly fraction.
      *   Further reduce their bet size (`k`) if their uncertainty is very high.
  4.  **Frame it as Growth Optimization Under Uncertainty:** Dave isn't just being risk-averse; he's optimizing for *robust* long-term growth given the messy reality of imperfect information. Priya's approach optimizes for a fantasy world of perfect knowledge. Dave's approach works in the world you actually inhabit.

  Dave might not have the equations handy, but his intuition about uncertainty and volatility is spot on. Priya's dedication to EV is admirable, but it's a recipe for disaster without incorporating the realities of estimation error and variance. The wipeouts you've observed are the inevitable consequence of ignoring those realities. Dave's shading isn't timidity; it's wisdom.
