prompt: |-
  I've been reading rationalist blogs and forums (LessWrong, the old Overcoming Bias archives, and so on) for years, and one piece of Bayesian folklore that gets invoked constantly in discussions of rationality is I.J. Good's 1967 theorem on the value of information — the same I.J. Good who worked with Turing at Bletchley Park. The theorem says that for an idealized rational agent, the expected utility of costlessly observing evidence before choosing an action is never lower than the expected utility of choosing without it, and is strictly higher whenever there is some chance the evidence would change what you'd do. I've always taken this as more or less settling the question of whether ignorance can be instrumentally rational: turning down free, decision-relevant evidence looks like a fairly direct violation of Bayesian rationality, whatever comfort it might buy you.

  This came up concretely a few weeks ago. A close friend has a parent with Huntington's disease, which puts her at 50% risk of carrying the mutation herself. Her hospital offers the predictive genetic test free of charge as part of a research program, and it would tell her, with certainty, whether she carries it. She has already ruled out having biological children regardless of the result, and there is no treatment or preventive regimen for asymptomatic carriers whose value would depend on knowing her status — yet she has firmly declined to be tested, saying she would rather not carry around either the dread of a positive result or the strange, unearned relief of a negative one. When I brought up Good's theorem to point out that she was leaving costless expected value on the table, she said I was treating her life like a decision-theory homework problem.

  I would genuinely like to know who is right here. Is declining a free, perfectly informative test in a case like hers actually in tension with Good's theorem, or am I smuggling in some assumption of the theorem — about what counts as "free," or about what the relevant decision problem even is — that does not hold once nothing hinges on the answer? I would like to understand exactly where, if anywhere, my reasoning breaks down before I raise this with her again.
reasoning: |-
  Okay, the user has been deeply involved in rationalist communities and is grappling with a real-life application of Good's theorem. Their friend declined a free genetic test for Huntington's disease despite its 50% risk, arguing that knowing the result would bring emotional burden regardless of the outcome. The user cited Good's theorem to suggest this was irrational, but the friend dismissed it as overly academic. Now they want to understand where their reasoning might be flawed.

  First, I need to recall Good's theorem properly. It states that for a rational agent, the expected utility of acquiring costless information is never negative and is positive if the information could change the decision. The user's application seems textbook: free test, no cost, perfect information. But the friend's refusal highlights something missing in that model.

  The key here is the theorem's assumptions. It assumes utility is defined over world states and actions, not over the information state itself. But humans experience emotions like dread or relief upon receiving information. The friend explicitly mentioned not wanting "dread" or "unearned relief," which are affective states triggered by knowledge itself. If her utility function includes these psychological states as direct components, then the theorem's scope doesn't automatically cover this.

  Also, the theorem treats information as having instrumental value for action. But in this case, the user mentioned no actions depend on the test result—no treatment options, no reproductive decisions. Without any decisions to make, information loses its instrumental purpose. The theorem becomes vacuously true but practically irrelevant because there's no "expected utility of choosing without it" to compare against.

  The user might be conflating epistemic value with instrumental rationality. Knowing the truth has inherent value for some, but the friend clearly assigns negative utility to that knowledge. Good's theorem doesn't mandate truth-seeking; it's about decision optimization. If there's nothing to decide, and truth causes distress, declining it is perfectly rational under a utility function that weights emotional states.

  Another angle: the theorem assumes the agent has a fixed utility function. But receiving devastating news could alter the friend's fundamental preferences or ability to enjoy life—what if knowing she's positive makes her incapable of deriving joy from things she currently loves? That would violate the "stable utility" assumption.

  I should also consider counterarguments. Even without actionable outcomes, could information have option value? For example, future treatments might emerge where early knowledge matters. But the user said "no treatment or preventive regimen," so this seems weak unless the friend is ignoring such possibilities.

  The deeper issue here is normative vs. descriptive rationality. The user is applying a normative model (how ideal agents should act) to a human with complex emotions. The friend's response about "homework problems" suggests she feels her lived experience is being reduced to math. Pushing Good's theorem again might damage their relationship rather than enlighten.

  Perhaps the most important realization is that rationality must serve human flourishing. If the friend's current equilibrium—living with uncertainty—brings more peace than definitive knowledge would, insisting on information acquisition against her preferences isn't rational; it's rigid. The user's desire to "be right" might itself be the irrational impulse here.
answer: |-
  You've hit on a profound tension between formal decision theory and human lived experience. While Good's theorem is mathematically sound, your application to your friend's situation likely misses crucial aspects of her decision context. Here's a breakdown of where the reasoning might break down, referencing Good's theorem explicitly:

  ### 1. **The "Free" Assumption: Psychological and Affective Costs**
     Good's theorem assumes information is *costless* in a purely instrumental sense. However, it does **not** account for:
     - **Affective Utility States:** Your friend explicitly assigns negative utility to the *states of mind* ("dread," "unearned relief") induced by knowing the result. These are *direct components of her utility function*. Knowing she carries Huntington's imposes an ongoing emotional burden; knowing she doesn't might create guilt or a sense of fragility. Good's theorem treats utility as derived solely from *world-states + actions*, not from *epistemic states*. If her utility function includes "not feeling dread" as a high-priority goal, then ignorance *is instrumentally rational* for achieving *that specific utility component*.
     - **Cognitive Burden:** Managing knowledge of a terminal illness consumes cognitive resources (attention, willpower). This is a real cost, even if no money is exchanged.

  ### 2. **The "Relevant Decision Problem" Assumption: No Actionable Consequences**
     Good's theorem relies on information influencing a *subsequent action* that affects outcomes. You state:
     > *"there is no treatment or preventive regimen for asymptomatic carriers whose value would depend on knowing her status"*
     > *"She has already ruled out having biological children regardless of the result"*
     
     This is critical. **If no decisions depend on the information, then Good's theorem becomes vacuously true but practically irrelevant.** The expected value of information (EVI) is defined as:
     *EVI = EU(with information) - EU(without information)*

     If no action changes based on the information (because no actions *can* change meaningful outcomes), then `EU(with information) = EU(without information)`, and `EVI = 0`. Your friend rationally assigns `EVI = 0` *in the domain of physical outcomes*. Her refusal is consistent with the theorem when the theorem's precondition (information affects actions) isn't met.

  ### 3. **The "Utility Function Stability" Assumption**
     Good's theorem assumes a stable utility function. Knowing her status could *alter her fundamental preferences*:
     - A positive result might trigger depression, reducing her capacity to derive joy from life (changing her utility function's *intensity*).
     - She might rationally value *hope* or *ambiguity* as a coping mechanism. Knowing removes this option value.

  ### 4. **The Scope of "Rationality": Beyond Expected Utility Maximization**
     Your friend's objection—"you’re treating my life like a decision-theory homework problem"—highlights a limitation of applying Good's theorem rigidly:
     - **Bounded Rationality:** Humans aren't ideal Bayesian agents. Managing catastrophic knowledge imposes cognitive loads that can degrade overall decision-making capacity.
     - **Non-Ergodic Risks:** Huntington's is a one-shot, irreversible risk. Standard EUT assumes repeatable gambles, but here, learning she's positive is a terminal state (psychologically if not physically). The "expected value" framework may not capture the existential weight.

  ### Where Good's Theorem *Does* Apply (and Why It Doesn't Help Your Case)
  Good's theorem *is* violated only if **all** of these hold:
  - Information is truly costless (affectively/cognitively).
  - It informs a meaningful action.
  - Utility functions remain stable.

  **In your friend's case:**
  - Affective costs are high ➜ Information is **not** free.
  - No actions depend on the result ➜ No instrumental value exists.
  - Psychological stability isn't guaranteed ➜ Utility may change.

  Thus, **your friend is likely instrumentally rational** in declining the test. Her utility function includes *states of knowledge* as direct inputs, and the test offers no compensatory benefits in physical outcomes. Good's theorem doesn't compel her to accept information that only degrades her quality of life.

  ### How to Approach Your Friend
  1. **Acknowledge her rationality:** "I've thought more about your decision, and I see how knowing could impose real emotional costs with no medical upside. It makes sense to protect your peace of mind."
  2. **Separate math from meaning:** Good's theorem is a tool for specific problems, not a universal law of wisdom. Her values—preserving hope, avoiding unnecessary dread—are deeply rational.
  3. **Focus on support:** Ask how you can best support her *given her choice* (e.g., respecting her boundary, not revisiting the test unless she does).

  Your instinct to seek rigor is commendable, but rationality must serve human flourishing. Here, your friend's choice reflects a nuanced understanding of her own utility landscape—one where ignorance preserves value that knowledge would destroy. That’s not irrational; it’s profoundly adaptive.
