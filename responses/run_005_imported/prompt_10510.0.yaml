prompt: |-
  I'm on the standards committee at the outlet I write for, and we've got an annoying case in front of us. A piece our science desk ran stated flat-out that social media is causing the rise in teen depression, no hedge, leaning on the same correlational and quasi-experimental evidence Haidt uses in The Anxious Generation. A few academics in the Odgers/Orben camp complained that effect sizes are tiny and causation's nowhere near established, so we owe readers a correction. Half the committee thinks we overclaimed; the other half thinks the reporter had plenty of good evidence and that hedging everything with "some scientists believe" is it's own kind of dishonesty, not more honest, just mushier. We meet thursday and I need an actual memo: what to do about this piece, plus a real rule reporters can use for how much evidence is "enough" to assert a contested causal claim outright instead of attributing it. Don't split the difference, and give the anti-hedging camp a fair hearing -- committees like ours usually wave them off too fast.
reasoning: |-
  Okay, the user is on a standards committee at their media outlet and they're dealing with a tricky situation. A science piece stated outright that social media causes teen depression, without any hedging, based on evidence similar to what Jonathan Haidt uses. Some academics from the Odgers/Orben camp complained, pointing out small effect sizes and lack of clear causation. The committee is split: half think they overclaimed, half think the reporter had enough evidence and that hedging is mushy and dishonest. The user needs a memo by Thursday with a decision on the piece and a rule for when to assert causal claims without attribution.

  First, I need to understand the core issue. The debate is about when correlation can be stated as causation in journalism. The anti-hedging camp argues that constantly using "some scientists believe" undermines clear reporting when evidence is strong. The pro-hedging camp points out that effect sizes are small and consensus isn't there. The user wants a firm rule, not a compromise, and to give the anti-hedging side a fair shake since they're often dismissed.

  Looking at the scientific context. The evidence here is mixed. Correlational studies show a link, but effect sizes are small. Quasi-experimental studies (like those using natural experiments) suggest causation but aren't definitive. Key reviews like Orben's 2022 meta-analysis show tiny effects, while Haidt emphasizes triangulation across methods. There's no scientific consensus; major institutions like the APA note potential harm but stop short of definitive causation. Developmental factors and individual differences complicate things. So, the science isn't settled enough for a flat assertion.

  Now, journalistic standards. Best practices require transparency about uncertainty, especially on contested topics. The harm from overstatement is real—policy decisions and public panic can result. But understatement can also mislead by downplaying legitimate concerns. The anti-hedging camp's point about false balance is valid; sometimes evidence is strong enough. However, in this case, the evidence isn't conclusive. The reporter's claim skipped necessary nuance.

  For the memo, I should recommend a correction. The original piece overstepped by stating causation as fact. A correction should clarify the evidence type (correlational, quasi-experimental) and mention the ongoing debate. The rule for future reporting needs to be clear. Criteria could include scientific consensus, effect size, methodological quality, and harm from over/understatement. For this topic, causation can't be flatly asserted yet. Reporters should attribute claims unless all criteria are met, especially consensus and large effect sizes.

  The user also wants to validate the anti-hedging perspective. They argue that hedging can be dishonest when evidence is strong. Examples like smoking and lung cancer show when assertion is justified. But here, the evidence doesn't reach that level. The rule should have high thresholds to prevent misuse. Emphasize that attribution isn't weakness but accuracy.

  Finally, the memo structure: background on the piece, correction rationale, the new rule with criteria, and addressing both committee sides. The rule must be actionable—specific thresholds for consensus, effect size, methods. Also, training for reporters on evaluating evidence. This balances scientific integrity with journalistic clarity, avoiding false balance while maintaining rigor.
answer: |-
  ## MEMORANDUM: SOCIAL MEDIA & TEEN DEPRESSION CLAIM - STANDARDS DECISION & RULE PROPOSAL

  **To:** Standards Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** October 26, 2023  
  **Subject:** Correction Recommendation & Rule for Asserting Contested Causal Claims  

  **1. Assessment of the Contested Piece:**
  The science desk's flat assertion ("social media *is causing* the rise in teen depression") **overstated the current scientific certainty**. While evidence exists (correlational studies, quasi-experimental designs like those cited by Haidt), the academic landscape is actively contested (Odgers/Orben critiques, small effect sizes in meta-analyses, methodological limitations, complex confounders like pandemic effects). **This lacks the consensus or definitive proof required for an unqualified causal claim.** The piece presented one side of a live scientific debate as settled fact.

  **2. Recommended Action: Correction & Clarification**
  *   **Issue a Correction:** Acknowledge the language overstated the certainty of causation. Example: "A previous version of this article stated definitively that social media 'is causing' the rise in teen depression. While substantial evidence suggests a link and potential harmful effects, the scientific consensus on *direct causation* and the *magnitude of its role* compared to other factors is not yet settled. We have amended the language to reflect the current state of the evidence."
  *   **Amend the Language:** Replace the flat assertion with language reflecting the *weight* and *nature* of the evidence:  
      *   **Stronger:** "A growing body of correlational and quasi-experimental research, including studies highlighted by Jonathan Haidt, suggests social media use *is likely a contributing factor* to the rise in teen depression, though its precise role and effect size relative to other causes remain debated."
      *   **More Precise:** "Evidence from large-scale correlational studies and natural experiments points toward a *causal link* between certain types of social media use and increased risk of teen depression for some adolescents, according to researchers like Jonathan Haidt. However, critics note effect sizes are often small in meta-analyses, causation is complex to isolate, and significant disagreement persists among experts about the strength and universality of this effect."

  **3. Proposed Rule: When to Assert a Contested Causal Claim Without Attribution ("The Rule")**

  Reporters **MAY** state a contested causal claim as fact *without attribution* **ONLY** when **ALL** of the following criteria are met simultaneously:

  1.  **High Degree of Scientific Consensus:** Overwhelming agreement exists among relevant experts in the field (e.g., IPCC climate reports, smoking causing cancer *post-1964 Surgeon General report*). Minor dissenting views are acknowledged but do not represent a significant portion of credible research.
  2.  **Strong, Consistent Evidence:** Evidence is based on multiple, high-quality, replicated studies using robust methodologies (especially longitudinal studies and RCTs where ethically feasible), demonstrating a clear causal mechanism. Meta-analyses consistently show significant effect sizes.
  3.  **Minimal Plausible Confounding:** Alternative explanations for the observed effect have been rigorously investigated and largely ruled out or accounted for.
  4.  **Direct & Significant Relationship:** The evidence demonstrates a direct causal pathway (not just association) and the effect size is substantial enough to be clinically or socially meaningful.

  **If ANY criterion is NOT fully met, attribution ("Many scientists believe," "Evidence suggests," "Research indicates," "According to X studies," "Leading theories propose") or clear hedging ("likely contributes to," "is associated with," "may cause") is REQUIRED.**

  **4. Addressing the Anti-Hedging Camp (Fair Hearing Granted):**

  The concerns of the "anti-hedging" camp are valid and deserve serious consideration:

  *   **False Balance/False Equivalence:** Over-attribution can artificially elevate marginal or poorly supported views, creating a misleading impression of equal weight ("Some scientists say climate change is real; others dispute it"). This *is* dishonest when evidence is overwhelmingly lopsided.
  *   **Mushiness & Reader Confusion:** Excessive hedging ("may," "could," "some suggest") can obscure genuine scientific progress and leave readers unsure what is actually known. It can feel evasive.
  *   **Undermining Legitimate Findings:** When evidence *is* strong (meeting the criteria above), failing to state conclusions clearly does a disservice to science and the public. It can stall necessary action or understanding.
  *   **Journalistic Responsibility:** Journalists must synthesize evidence and convey conclusions based on the best available knowledge, not just parrot "he said/she said." Sometimes that means making a call based on the preponderance of evidence.

  **Why Hedging is Still Necessary *Here* and for Similar Contested Claims:**
  *   **The Criteria Aren't Met:** For social media's causal role in teen depression, **consensus is absent** (prominent, credible researchers actively debate the magnitude and mechanisms), **effect sizes are consistently small in meta-analyses**, **confounding is highly plausible and difficult to fully disentangle**, and **causal pathways are complex and not fully established**. This is the *opposite* of the smoking/cancer scenario.
  *   **Hedging ≠ Weakness; It's Precision:** Accurate hedging reflects the *actual state of knowledge*. Saying "evidence points to a causal link" or "is likely a contributing factor" is **stronger and more honest** than implying certainty where none exists. It accurately signals an active area of research and debate.
  *   **Avoiding Harm:** Overstatement on sensitive topics like teen mental health can fuel moral panic, lead to ineffective or harmful policy, stigmatize users, and divert attention from other crucial factors (poverty, lack of services, academic pressure, etc.).

  **5. Committee Action Required (Thursday Meeting):**

  1.  **Vote on Correction:** Approve the issuance of a correction/clarification for the specific piece as outlined in Section 2.
  2.  **Debate & Ratify "The Rule":** Discuss and finalize the proposed rule (Section 3) for asserting causal claims without attribution. Refine the criteria if needed, but ensure the bar remains high.
  3.  **Communicate & Train:** Disseminate the ratified rule clearly to all editorial staff, especially science and health desks. Incorporate it into style guides and reporter training on covering complex science and health topics. Emphasize *why* the criteria exist – to uphold accuracy and avoid overstatement in contested areas.

  **Conclusion:**
  While the anti-hedging camp rightly warns against false equivalence and excessive timidity in the face of strong evidence, this specific claim about social media and teen depression does not meet the high threshold required for an unqualified assertion of causation. The evidence, while substantial and concerning, remains contested, complex, and characterized by small average effect sizes. A correction adding necessary nuance is warranted. Adopting the proposed clear, high-bar rule will empower reporters to be decisive *when the science truly supports it*, while ensuring necessary caution and transparency when the evidence is still evolving or contested. This balances scientific integrity with journalistic clarity.
