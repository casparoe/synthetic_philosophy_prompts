  We are to sort the ten practices into five tiers based on Aristotle's criteria from Politics I.8-10 and Nicomachean Ethics V.5. The criteria are:
  1. Natural limit of household need (oikonomia) vs. acquisition as an end in itself (chrematistike).
  2. Money as a measure of need (chreia) in exchange, not as a store of self-generating value.
  3. The "barrenness" argument against interest (tokos) specifically.

  Tiers (from most natural to most unnatural):
