  - Justification: The handbook states that expulsion requires both (a) and (b). Therefore, the council must determine the facts of (a) and (b) independently. If they voted only on the outcome, they might not properly consider the conditions. For example, a member might think (a) is true and (b) is false but still vote to expel because of a gut feeling, which would violate the rule. 
