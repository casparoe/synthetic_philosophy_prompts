  Hmm, the core tension here is between determinism and free will, wrapped in a relationship conflict. The partner's accusation feels like a "heads I win, tails you lose" setup—either you didn't go (so no cheating), or if you had gone, you would've cheated (so your character is flawed). That's emotionally manipulative, even if unintentionally. 

