  *   +9 points for accurately capturing the setup, the core small-improvement argument, identifying the "on a par" relation, linking it to incommensurability/Berlin, and stating the consequence for agency.
  *   -1 point for the conflation of "incomparable" with "on a par," which misrepresents a key subtlety in Chang's position. (Half a point for the minor overstatement in the consequence phrasing, but it's linked to the main conflation).
