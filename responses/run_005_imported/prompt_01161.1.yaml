answer: |-
  Your wife is pointing to a very real phenomenon, though the language of "culture" or "personality" can feel metaphorical. As a physicist, think of it not as a mystical group soul, but as an **emergent property of complex systems interacting within a constrained structure.** Here's a breakdown of why this happens, even with complete member turnover:

  1.  **Emergent Dynamics:** Like how the properties of water (wetness, fluidity) emerge from H₂O molecules but aren't properties of individual atoms, group dynamics emerge from the interactions *between* individuals within a specific *structure*. The "dumb fight" isn't inherent in any single person; it arises from *how* differing viewpoints (mirror vs. mount advocates) clash within the *rules and norms* of your committee.
  2.  **Structural Constraints & Incentives:**
      *   **Fixed Resources:** The finite telescope fund creates inherent tension.
      *   **Binary Choice:** The perceived options (mirror OR mount) force a zero-sum conflict.
      *   **Decision-Making Process:** Your committee's rules (voting thresholds, discussion format) likely favor compromise over decisive wins.
      *   **Institutional Memory (Even Without People):** Past decisions (the "limp split") set precedents. New members hear: "This is how we *always* do it." Agendas, minutes, or even casual stories from outgoing members transmit the pattern. The *structure* remembers, even if individuals don't.
      *   **Group Identity & Norms:** The club develops an identity ("We are careful stewards," "We avoid conflict," "We value inclusivity over decisive action"). New members quickly absorb these unwritten norms ("This is how things are done here") and conform, often unconsciously.
  3.  **Path Dependency:** Each year's split decision reinforces the pattern. It becomes the expected outcome, making alternatives seem risky or difficult. The *cost* of breaking the pattern (potential conflict, resentment, uncertainty) feels higher than the cost of perpetuating it (another year of suboptimal equipment).
  4.  **Social Identity Theory:** Individuals derive part of their identity from group membership. On the committee, they adopt the "committee member" role and its associated behaviors (including the familiar argument and compromise), distinct from their personal outside preferences.
  5.  **Reduced Accountability:** In a rotating committee, no single cohort feels *long-term* responsibility for the outcome. The problem feels inherited, and the solution (the split) passes the *real* decision (actually buying one proper item) to a future committee, perpetuating the cycle.

  **Why "Culture" Isn't Just Sloppy Language (Though It Can Be):**

  *   **Culture as Pattern:** It's a shorthand for observable, recurring patterns of behavior, communication, decision-making, and conflict resolution within a group.
  *   **Culture as Constraint:** It defines the "unwritten rules" that shape how individuals behave within the group, regardless of their personal inclinations outside it. New members are socialized into these rules.
  *   **Culture as Emergent System:** It's the complex system formed by the interaction of individuals, structure, history, and environment.

  **What This Means for Your Telescope Fight:**

  Your wife is right that it's the "club's culture" – a persistent, emergent dynamic of the *system* (committee + rules + resources + history), not the fault of the specific individuals. They are actors playing roles within a script written by the structure and past performances.

  **How to Break the Cycle (Requires Changing the System):**

  1.  **Reframe the Choice:** Stop framing it as "Mirror OR Mount." Could it be "New Mirror *with a plan to fundraise for Mount next year*" or vice versa? Or "Invest in maintenance/upgrades for *both* existing systems this year to buy time for a major decision"?
  2.  **Change the Structure:**
      *   **Long-Term Planning:** Mandate a 3-5 year equipment plan developed by one committee and binding (within reason) on successors. Base it on technical needs assessments.
      *   **Decision Rule Change:** Require a supermajority (e.g., 75%) to *split* the fund, otherwise a simple majority chooses one option. This forces consensus for compromise.
      *   **Designated Advocate:** Assign one member *in advance* to research/argue for the mirror and another for the mount, requiring them to also present the downsides of their choice and a plan for the unchosen item.
      *   **External Input:** Bring in an expert (e.g., a telescope technician) to assess the *actual* most urgent need based on current equipment condition.
  3.  **Document & Challenge History:** Explicitly discuss the pattern at the *start* of the debate: "We all know we tend to split the fund. Let's consciously try to avoid that this year. What would it take to actually choose one?" Acknowledge the systemic trap.
  4.  **Increase Resources:** A dedicated, time-limited fundraising push specifically for the "losing" item this year could make choosing one option feel less final.

  **In essence:** Yes, groups absolutely develop dynamics separate from the specific individuals. It's an emergent property of the system's structure, history, and the fundamental nature of human interaction within constrained environments. Calling it "culture" is a useful, albeit imperfect, shorthand for this complex reality. Your frustration is understandable, but changing it requires altering the *system* (rules, processes, incentives), not just hoping for different people. Good luck with the telescope!
