answer: |-
  Here is the bench memo Judge Miriam Kessler would circulate, reflecting her textualist principles while grappling honestly with the tensions inherent in this case and anticipating Judge Okafor's sharp critique:

  ---

  **MEMORANDUM TO THE PANEL**
  **FROM:** Judge Miriam E. Kessler
  **RE:** *United States Migratory Habitat Service v. Alma Halloran*, No. 23-1457
  **RECOMMENDATION:** **REVERSE** the judgment of the district court and remand with instructions to dismiss the complaint.

  **I. RECOMMENDED DISPOSITION**
  After careful review of the briefs, record, and applicable law, I recommend we hold that the Wetland Nesting Protection Act (WNPA), 16 U.S.C. § 801 *et seq.*, does not prohibit the actions taken by Respondent Alma Halloran. The district court’s judgment imposing civil penalties must therefore be reversed. Halloran drained and bulldozed the wetland *before* the commencement of the copper-throated marsh finch’s nesting season. The plain text of the WNPA’s operative prohibition limits liability to alterations occurring “during the nesting season.” 16 U.S.C. § 803(a). Halloran’s actions fall outside this temporal boundary. While the government’s policy concerns regarding anticipatory destruction are understandable, they cannot override the statute’s unambiguous language. Congress chose a specific temporal limitation; it is not our role to expand it.

  **II. TEXTUAL ANALYSIS**

  A.  **The Operative Text is Unambiguous.**
      The WNPA provides: "It shall be unlawful for any person to drain, fill, or otherwise alter a wetland that serves as nesting habitat for a species listed under section 2, **during the nesting season** for that species, without a permit issued under section 5." 16 U.S.C. § 803(a) (emphasis added).
      *   "During" is a prepositional term denoting a temporal relationship. It means "throughout the continuance of" or "in the course of." *See Webster’s Third New International Dictionary* 703 (1993); *see also* *Obergefell v. Hodges*, 576 U.S. 644, 673 (2015) (Roberts, C.J., dissenting) (contrasting "during" with "before"). Its ordinary meaning establishes a clear timeframe: liability attaches only to alterations occurring within the defined nesting season.
      *   Halloran’s actions – completed two weeks *before* the nesting season began – occurred outside this timeframe. The wetland was altered *before* the season commenced, so no alteration occurred *during* it. The statute does not prohibit destroying the wetland habitat *itself*; it prohibits altering it *during the nesting season*. By acting pre-season, Halloran ensured there was no wetland habitat left *to be* altered *during* the season. This places her conduct outside the statutory prohibition.

  B.  **Congress Knew How to Extend Liability and Chose Not To.**
      *   Congress is capable of drafting statutes that reach conduct preceding a defined period. *E.g.*, statutes prohibiting acts "in anticipation of" an event, "in preparation for" an activity, or simply "at any time." *See, e.g.*, 18 U.S.C. § 1512(f)(1) (witness tampering "**at any time**"); 26 U.S.C. § 7206(1) (fraud "**at any time**"); Endangered Species Act, 16 U.S.C. § 1538(a)(1) (prohibiting taking endangered species "**at any time**"). The WNPA contains no such language.
      *   Congress specifically chose temporal language ("during") that differs from broader alternatives readily available in its drafting toolkit. We must respect that choice. *See* *Bostock v. Clayton County*, 140 S. Ct. 1731, 1738 (2020) ("Only the written word is the law...").

  C.  **The Absurdity Doctrine Does Not Apply.**
      *   The government argues Halloran’s reading would "gut" the Act, allowing landowners to evade liability indefinitely by acting just before the season begins each year. While this outcome is undoubtedly *undesirable* and potentially undermines the Act's goals, it does not rise to the level of "absurdity" required for a court to disregard plain text.
      *   "Absurdity" in the textualist canon means an outcome so "grotesque" or "bizarre" that Congress *could not conceivably* have intended it, *not* merely an outcome that creates a significant loophole or seems unwise. *See* *Public Citizen v. U.S. Dep’t of Justice*, 491 U.S. 440, 470-71 (1989) (Kennedy, J., concurring); *Green v. Bock Laundry Mach. Co.*, 490 U.S. 504, 527 (1989) (Scalia, J., concurring). A loophole created by a clear temporal limitation, even a large one, is not inherently absurd. Congress may have made a deliberate policy choice to limit enforcement resources to in-season actions, trusting agencies to monitor vulnerable sites proactively. Or it may simply have overlooked this specific evasion tactic. Either way, a problematic gap is not synonymous with absurdity.
      *   The government’s argument is fundamentally a *policy* complaint – that the statute *should* cover pre-season destruction to be effective. But textualism requires us to apply the statute Congress *enacted*, not the one we (or the agency) wish it had enacted. *See* *Connecticut Nat. Bank v. Germain*, 503 U.S. 249, 254 (1992) ("[C]ourts must presume that a legislature says in a statute what it means and means in a statute what it says there.").

  **III. THE ROLE OF THE FINDINGS SECTION (AND THE FLOOR STATEMENT)**

  A.  **Floor Statement: Per Se Inadmissible for Textual Meaning.**
      The government cites the bill sponsor's floor statement describing the exact preemptive tactic under state law. Judge Kessler would categorically exclude this from textual analysis. Legislative history, especially isolated statements by individual members, is not law. It cannot override the enacted text. *See* *Shannon v. United States*, 512 U.S. 573, 583 (1994); *Conroy v. Aniskoff*, 507 U.S. 511, 518 (1993) (Scalia, J., concurring). The sponsor's awareness of the problem does not mean Congress addressed it in the text. This point requires no further weight.

  B.  **Findings Section: A Point of Textualist Tension.**
      The Findings section states: "Congress finds that... (3) wetland nesting habitat is frequently destroyed **in anticipation of the nesting season, before any protection attaches**..." 16 U.S.C. § 801(a)(3).
      *   **Can it be considered?** Unlike floor statements, the Findings are enacted text. A textualist *can* consider them as part of the statute's overall structure. *See* *Ransom v. FIA Card Servs., N.A.*, 562 U.S. 61, 69 (2011) (examining statute's "context and purpose" reflected in its structure); *FDA v. Brown & Williamson Tobacco Corp.*, 529 U.S. 120, 133 (2000) (considering overall statutory scheme).
      *   **What weight does it carry?** Findings state *facts* Congress deemed relevant. They do not typically *alter* the meaning of operative terms. They may inform the *purpose* of the statute, but textualism prioritizes operative text over broad purpose, especially when the text is clear. *See* *Bostock*, 140 S. Ct. at 1739 ("Only the words on the page constitute the law adopted by Congress..."). The key question is whether the Findings *create ambiguity* in § 803(a)'s "during the nesting season" language.
      *   **My Analysis:** The Findings demonstrate Congress was aware of pre-season destruction. However, awareness of a problem is distinct from *prohibiting* it. The Findings do not modify the operative term "during." They do not state that "alterations *in anticipation of* the season are prohibited," nor do they define "during" to include "in anticipation of." They simply acknowledge a factual circumstance. Congress chose not to incorporate the "anticipation" language found in the Findings into the operative prohibition in § 803(a). This reinforces the conclusion that the temporal limitation in § 803(a) is deliberate, even if its consequences are undesirable in light of the known problem. The Findings highlight the potential loophole but do not provide textual authority to close it.

  **IV. COUNTERANALYSIS: ANTICIPATING JUDGE OKAFOR'S SCRUTINY**

  I anticipate Judge Okafor may forcefully argue the following points, which merit serious consideration even if I ultimately find them unpersuasive under a strict textualist approach:

  1.  **"During" Encompasses Preparatory Acts Leading to In-Season Harm:** Okafor might argue that "altering" a wetland "during" the season includes acts *initiated* pre-season if the *harm* (the absence of nesting habitat) persists *into* and *throughout* the season. The alteration wasn't merely an instantaneous act (bulldozing); it created a *continuing state* of alteration (a drained, filled parcel) that existed *during* the nesting season, directly causing the harm Congress sought to prevent *during* that season. This views "alter" as creating a *condition* that persists unlawfully into the protected period.
      *   **Rebuttal:** The statute prohibits the *act* of altering ("drain, fill, or otherwise alter") occurring *during* the season. It does not prohibit the *maintenance* of an altered condition *during* the season, nor does it create a duty to *restore* habitat before the season. Halloran performed the *act* of alteration *before* the season. The resulting *condition* during the season is not, by the statute's terms, an unlawful "alteration" occurring *during* that season. Congress could have written it that way ("maintain an altered condition during...") but did not. *See* *PPL Energyplus, LLC v. Nazarian*, 974 F.3d 470, 480 (4th Cir. 2020) (distinguishing between prohibited acts and resulting conditions).

  2.  **Findings + Text = Ambiguity or Contextual Meaning:** Okafor may contend that the Findings (§ 801(a)(3)), as enacted text, create ambiguity in § 803(a) by revealing Congress's specific concern about pre-season destruction. This contextual knowledge, he might argue, requires us to read "during the nesting season" functionally to encompass actions taken *to avoid* the season's restrictions, as the *reason* for acting pre-season was precisely *because* it was the nesting season. The phrase "during the nesting season" thus includes acts taken *because of* the impending season.
      *   **Rebuttal:** While the Findings show awareness, they do not alter the *temporal* meaning of "during." Reading "during" to mean "because of" or "in anticipation of" is a significant linguistic leap unsupported by the word's ordinary meaning. It imports a *motivational* element nowhere present in the text. The statute's focus is the *timing* of the physical act, not the *reason* for it. The Findings highlight a potential consequence of the chosen language but do not rewrite that language. Context cannot override plain meaning; it illuminates it. Here, the context confirms the problem exists but does not change the unambiguous temporal boundary Congress set.

  3.  **The Absurdity is Real and Text-Based:** Okafor might argue that rendering the Act entirely ineffectual against the *precise tactic* Congress identified in its Findings *is* an absurd result Congress could not have intended, especially given the findings. This isn't just a gap; it's a self-inflicted fatal wound directly contrary to the statute's stated purpose and Congress's documented awareness.
      *   **Rebuttal:** This argument powerfully states the policy case but overstates the textualist absurdity doctrine. The loophole is large and problematic, but it arises directly from the clear text Congress chose. Courts cannot rewrite statutes to avoid every undesirable consequence or close every loophole. *See* *Barnhart v. Sigmon Coal Co.*, 534 U.S. 438, 462 (2002). Congress may have underestimated the loophole's size, trusted agencies to use other tools (monitoring, injunctions under other laws), or made a deliberate compromise. The existence of the Findings § 801(a)(3) *alongside* the unmodified § 803(a) suggests Congress knew the risk but still opted for the "during" limitation. This is poor drafting, perhaps, but not absurdity warranting judicial revision. The remedy lies with Congress. *Cf.* *King v. Burwell*, 576 U.S. 473, 485-86 (2015) (avoiding absurdity where specific contextual clues in *operative text* suggested a broader reading).

  **V. CONCLUSION**

  The text of 16 U.S.C. § 803(a) is unambiguous: it prohibits alterations occurring *during* the nesting season. Halloran's alterations occurred *before* the season. While the government’s concerns about evasion are valid and the Findings section underscores the potential for this outcome, neither provides a textual basis for expanding the statute's temporal scope. Respecting the separation of powers requires us to apply the statute as written, even when it yields a result Congress may not have fully anticipated or desired. The district court erred in imposing liability. I recommend REVERSAL.

  Respectfully submitted for the Panel's consideration,

  Miriam E. Kessler
  United States Circuit Judge

  ---

  **Why this draft meets your requirements:**

  1.  **Authentic Textualist Reasoning:** It rigorously focuses on the statutory text ("during"), dictionary definitions, statutory structure, and Congress's choices in drafting. It rejects legislative history (floor statement) and gives limited, cautious weight to the Findings section as context but not operative text.
  2.  **Clear Recommendation:** Reversal based on plain text.
  3.  **Full-Strength Counterarguments:** Section IV directly anticipates and engages with the strongest possible counterarguments Judge Okafor (or a dissenting opinion) would likely raise, particularly the "persisting condition," "contextual meaning via Findings," and "true absurdity" points. These are presented seriously and rebutted on textualist grounds, not strawmanned.
  4.  **Acknowledged Tensions:**
      *   **Findings Section:** The memo explicitly wrestles with the textualist dilemma of how to treat enacted Findings that highlight a problem the operative text arguably fails to solve. It allows consideration but strictly limits its weight, concluding it doesn't create ambiguity or modify the operative term.
      *   **Absurdity vs. Policy:** It carefully distinguishes between a true "absurdity" (which would justify departure from text) and a merely undesirable loophole or policy problem (which doesn't). It acknowledges the government's point is strong policy but rejects it as a valid textualist absurdity argument.
      *   **Judicial Hesitation:** Phrases like "undoubtedly undesirable," "potentially undermines," "problematic gap," and "poor drafting, perhaps" acknowledge the real-world consequences without yielding textualist principle. The conclusion emphasizes "separation of powers" and "apply the statute as written, even when..."
  5.  **Professional Judicial Tone:** It uses formal, precise language suitable for an inter-judge memo, avoiding unnecessary flourish but conveying conviction and intellectual honesty.
  6.  **Plausible Complexity:** The reasoning isn't simplistic. It grapples with the interplay of text, structure (Findings), and potential absurdity in a way that reflects real judicial wrestling, not a pat answer. The rebuttals in Section IV show engagement with sophisticated counter-readings.

  This memo provides Judge Kessler with a firm textualist foundation for reversal while honestly confronting the weaknesses and tensions in her position, setting up a robust conference discussion with Judge Okafor.
