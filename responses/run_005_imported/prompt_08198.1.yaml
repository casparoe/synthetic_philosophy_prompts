answer: |-
  You've pinpointed a profound tension in *On Certainty* (OC) that goes beyond mere interpretive squabbles. Wittgenstein *does* seem to oscillate between describing hinges in propositional terms and describing them as fundamentally *action*. Reconciling §204 and §§341-343 requires rejecting a simplistic "either propositional *or* practical" dichotomy and embracing a more nuanced understanding of Wittgenstein's concept of "proposition" and the *role* hinges play. Here's a way to see them as expressing a stable, albeit complex, conception:

  1.  **"Proposition" in OC is Not a Unitary Concept:** Wittgenstein isn't using "proposition" (*Satz*) in the narrow, Fregean/Russellian sense of a truth-bearer with a specific logical structure and truth-value. In OC, "proposition" often means something closer to "utterance," "sentence-in-use," or "linguistic expression," whose meaning and *logical status* are determined by its role in the language-game. Hinges *are* expressed linguistically, as sentences that look like empirical propositions ("The earth exists," "I have two hands," "Objects don't vanish when unobserved"). So, grammatically and superficially, they *are* "propositions."

  2.  **The Crucial Shift: From Description to Rule/Frame:** Wittgenstein's key insight is that **despite their propositional *form*, hinges do not function as empirical descriptions or hypotheses subject to verification/falsification.** This is where §204 is paramount:
      *   §204 explicitly rejects the foundationalist picture where justification ends with self-evident *propositional truths* ("certain propositions striking us immediately as true"). He contrasts this with "our **acting** which lies at the bottom of the language-game."
      *   The function of a hinge is not to *state* a fact about the world that we "see" as true, but to *constitute* the framework *within which* stating facts, raising doubts, and seeking justification make sense. They are the unchanging pivot (the hinge) around which the door of inquiry (doubting, investigating, justifying) turns (§341-343).

  3.  **Reconciling the Vocabulary: "Exempt from Doubt" ≠ "Believed":**
      *   **"Exempt from doubt" (§341):** This doesn't mean "indubitably true" or "rationally believed without evidence." It means "logically immune to doubt within *this* language-game." Doubting a hinge isn't *mistaken*; it's *nonsensical* or *pathological* within that framework. It undermines the very possibility of the doubt itself. (E.g., seriously doubting "I have hands" while typing your dissertation isn't a rational challenge; it renders the act of typing incoherent).
      *   **"Assumption" (§343):** Wittgenstein explicitly *rejects* interpreting hinges as mere pragmatic assumptions ("we just can't investigate everything, and for that reason we are forced to rest content with assumption"). He says the situation is *not* like that. Calling them "assumptions" in scare quotes highlights that they are *not* assumptions in the ordinary sense (tentative, potentially revisable beliefs adopted for practical reasons). They are the *unassumed* bedrock. His use of "assumption" here is almost ironic, contrasting the *wrong* picture with his own.

  4.  **The Practical Character *of* the "Proposition":** This is where §204 directly illuminates the propositional *language* of §341-343.
      *   When Wittgenstein says hinges are "propositions" exempt from doubt, he means linguistic expressions whose *meaning* and *immunity* derive entirely from their being **manifest in action, embedded in our shared form of life.** "The earth exists" isn't a *belief* we hold; it's what is *shown* in our actions: walking on the ground, building houses, planting crops, looking down, not up, for lost objects.
      *   The "proposition" *is* the linguistic articulation *of* the practical bedrock. Its propositional form reflects how we *talk about* this bedrock, but its *status* as a hinge is constituted by its role in action. §204 tells us *what* lies at the bottom (acting); §§341-343 tell us *how* we linguistically gesture towards that bottom (using "propositions" that are hinges). The proposition *expresses* the rule that is *lived*.

  5.  **Hinges: Grammatical Propositions Enacted as Rules:** The most coherent synthesis is to see hinges as **"grammatical propositions"** (in the later Wittgenstein's sense) that **function as constitutive rules manifested in action**.
      *   **Grammatical:** They define what counts as making sense, what counts as a doubt, an investigation, evidence, within a language-game. They are "rules of grammar" disguised as empirical propositions.
      *   **Enacted as Rules:** Their reality isn't in being "held true" in the mind, but in being *presupposed in*, and *exhibited by*, our shared practices, behaviors, and reactions (§204: "it is our acting"). My certainty about "I have hands" isn't a doxastic state; it's *shown* in my reaching, grasping, writing – actions that would be incoherent without that "hinge."

  **Resolution: A Stable Conception**

  *   **§§341-343** describes the *logical role* of hinges within our systems of inquiry and justification: they are the fixed points (expressed propositionally) exempt from doubt, enabling doubt to turn.
  *   **§204** describes the *ontological/epistemological foundation* of that logical role: this exemption isn't based on intrinsic propositional certainty, but on the brute fact of our shared, practical, embodied form of life and action. The hinge *proposition* gets its logical status *from* its being rooted in action.

  **Accommodating the Vocabulary:**

  *   Wittgenstein uses propositional-attitude vocabulary ("exempt from doubt," "assumption") because hinges *look like* propositions and *seem* to occupy a space where attitudes *could* apply. However, his analysis in §204 and throughout OC reveals that applying these attitudes *literally* is a category mistake. We *say* "I know I have hands," but this "knowledge" isn't a cognitive achievement based on evidence; it's the expression of an attitude *towards a grammatical rule* that is lived. The vocabulary points to the *appearance*; the analysis reveals the underlying *reality* as action and framework-constitution.

  **Conclusion:**

  *On Certainty* presents a stable, if radical, conception. Hinges are expressed *as* propositions, playing a specific *logical role* in our epistemic practices (exempt, enabling doubt). However, their *status* as hinges, their exemption, and the source of their "certainty" is not doxastic or propositional in the traditional sense. It is fundamentally *practical* and *enactive*. They are the rules of the game, written in propositional clothing, but whose life and authority come solely from being acted out within a form of life (§204). **They are not the right kind of thing to be *believed* in the standard sense because belief is a move *within* the game they make possible.** They are what we *do*, not (primarily) what we *think*. The tension arises from the inherent difficulty of using language (propositions) to point to the non-linguistic, practical foundation *of* language and inquiry itself. Wittgenstein isn't contradicting himself; he's showing the limits of propositional expression in capturing the bedrock, while necessarily using propositions to gesture towards it. Your focus on the *nature* of the hinge-state (before even asking about knowledge) is precisely the right place to grapple with this core tension. Moyal-Sharrock's emphasis on the non-doxastic is crucial, but it needs to incorporate Wittgenstein's willingness to *call* them propositions – propositions whose essence is revealed to be practical.
