answer: |-
  Based on Nietzsche's explicit writings on diet, physiology, and his nuanced critique of decadence, he would **almost certainly reject the modern carnivore diet movement as another form of dogmatic decadence, not an overcoming of it.** Here's a breakdown, going beyond the "vibes" to his actual arguments:

  1.  **His Personal Diet: Extreme Moderation & Anti-Dogmatism:**
      *   **Tiny Quantities:** Nietzsche constantly emphasized *eating very little*. He wrote: "Not to be *hungry* is the best remedy for me... The smallest meal, if taken regularly and at the same time, affects me more profoundly than the most abundant has ever done." (Ecce Homo, "Why I am so Clever," §1). This is the *opposite* of the large meat-centric meals promoted by carnivore dieters.
      *   **Vegetable Preference:** He explicitly stated: "Vegetables above all. Meat is only an occasional necessity." (Letter to Franz Overbeck, 1883). He found German cuisine "an absurdity" because it was too heavy and meat-focused.
      *   **Idiosyncrasy & Experimentation:** His diet was hyper-individualized based on his chronic digestive ailments. He obsessed over specific foods that upset *his* stomach (e.g., tea, alcohol, spices, certain meats if cooked poorly, beer, wine, coffee). His advice was **never** prescriptive dogma for all, but a testament to the necessity of listening to *one's own* body. "The question of *nourishment*... can be decided only by *exception*... One man's food is another man's poison." (Ecce Homo, "Why I am so Clever," §1). A rigid "only meat" rule violates this fundamental principle.
      *   **Rejection of Stimulants:** His abstention from alcohol, coffee, and strong spices wasn't macho asceticism but a physiological necessity. He saw them as irritants to a sensitive system, not as "weak" indulgences per se. He might see the carnivore diet's often high fat/salt content as potentially similarly irritating.

  2.  **Decadence: Not About Food Choices, But About *Why* and *How*:**
      *   **Decadence as Weakness of Will/Instinct:** For Nietzsche, decadence wasn't defined by *what* you ate (plants vs. meat), but by the *relationship* to eating and the body.
          *   **Asceticism IS Decadent:** Rigid dietary rules (like "only meat") are a form of asceticism, which Nietzsche relentlessly criticized in *The Genealogy of Morals* and elsewhere. Asceticism, whether priestly or modern wellness, is a sign of *ressentiment*, life-denial, and an inability to affirm the body naturally. It's a will to *negate* perceived weaknesses through external control, not overcome them through strength. The carnivore diet's "anti-decadent" rhetoric mirrors the very ascetic priestly logic Nietzsche despised.
          *   **Indiscriminate Gluttony is ALSO Decadent:** Just as bad as asceticism is the inability to discern what truly nourishes *you* – stuffing oneself with whatever is convenient or culturally sanctioned (like heavy German fare). This shows a lack of self-awareness and physiological sensitivity.
      *   **Strength = Listening to the Body, Not Imposing Rules:** Nietzschean strength in relation to the body lies in the *sensitivity* to understand its unique needs and the *discipline* (not dogma) to act accordingly. It's about "becoming what you are" physiologically. The strong individual experiments, observes, and tailors their diet based on what genuinely enhances *their* feeling of power, vitality, and clarity. A pre-packaged "only meat" solution requires no sensitivity or self-knowledge – it's a blunt instrument, often adopted out of ideological conviction rather than physiological experimentation.
      *   **Dogma = Symptom of Weakness:** The need for a simple, universal rule ("only meat is good") reflects an inability to tolerate complexity, nuance, and individual variation. It's a flight from the demanding task of self-knowledge and self-legislation. Nietzsche associated dogma, in any form (religious, moral, dietary), with herd mentality and weakness.

  3.  **Physiology and Spirit:**
      *   **Digestion Over Ingestion:** Nietzsche was obsessed with *digestion* and assimilation, not just the raw material consumed. Heavy, hard-to-digest food (which excessive meat can be, especially for sensitive systems like his) saps energy needed for intellectual and spiritual pursuits. His tiny meals and focus on easily assimilated foods were designed to maximize energy for thinking and creating. "A *heavy* meal is digested more easily than one that is too small." (EH, "Clever" §1) – meaning a small, *suitable* meal is optimal. The carnivore diet often ignores ease of digestion in favor of ideological purity.
      *   **Food Affects Thought:** He believed diet directly impacted mental state and spiritual health. He sought foods that produced lightness, clarity, and intellectual agility. He would likely see the potential lethargy or digestive strain from an all-meat diet (especially if not suited to the individual) as detrimental to higher thought, trapping energy in the gut rather than the mind.

  **Conclusion:**

  Nietzsche would view the modern carnivore diet movement as:

  1.  **Decadent Asceticism:** Imposing a rigid, universal rule ("only meat") as a solution to perceived modern weakness is classic life-denying ascetic priest behavior. It stems from *ressentiment* against complexity and a desire for simplistic purity, not affirmative strength.
  2.  **Anti-Individualistic:** It ignores his core principle that nutrition must be determined by *exception*, by deep listening to one's unique physiology. It replaces self-experimentation and self-knowledge with dogma.
  3.  **Potentially Physiologically Stupid:** For many individuals (like Nietzsche himself), such a diet would likely cause digestive distress, sapping energy and hindering intellectual/spiritual pursuits – the opposite of his goals. His emphasis on moderation and vegetables directly contradicts it.
  4.  **Misunderstanding "Strength":** True Nietzschean "strength" isn't about macho dietary maximalism or rejecting "soft" plants. It's about the subtle, disciplined strength to understand your body's unique needs, experiment wisely, avoid irritants (whether plant toxins or excessive meat fat), and choose what genuinely enhances *your* specific feeling of power and capacity for thought and creation.

  He would likely see it as **another faddish symptom of modern decadence** – an anxious, dogmatic over-reaction lacking the nuance, self-awareness, and individual experimentation he championed as the true path to overcoming weakness. His ideal eater wasn't a meat-devouring barbarian, but a sensitive, disciplined experimenter like himself, meticulously curating a diet for optimal intellectual and spiritual flourishing.
