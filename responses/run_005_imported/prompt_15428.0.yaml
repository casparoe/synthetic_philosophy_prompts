answer: |-
  ## MEMORANDUM  
  TO: Editorial Standards Committee  
  FROM: [Your Name/Position]  
  DATE: [Date]  
  SUBJECT: Style Guide Rule for Climate Attribution Headlines  

  Following our discussion on wording climate-attribution studies, we are adopting the following concrete rule for headlines and lead statements, effective immediately. This rule respects both the scientific nuance of attribution research and the need for linguistic precision regarding causation:

  **Style Guide Rule (Attribution Studies):**  
  *When reporting on event-attribution studies, use the verb "caused" **only** for events the study explicitly concludes would have been "virtually impossible" or "statistically impossible" in a pre-industrial climate. For events made *more likely* or *more severe* (but still possible without anthropogenic climate change), use verbs like "intensified," "worsened," "amplified," "fueled," "supercharged," or phrases like "dramatically increased the likelihood/severity of." Always specify the key quantitative findings (e.g., "made X times more likely," "increased intensity by Y degrees").*

  **Rationale & Application to Current Case:**  

  1.  **Addressing the Copy Editors' Concern (Precision of "Caused"):**  
      The term "caused" carries the specific meaning that the event *would not have occurred at all* in the absence of the causal factor. As the study on our desk concludes the heat wave *could* have happened without climate change, albeit as a significantly milder event, using "caused" is scientifically and linguistically inaccurate for the event *as it occurred*. The rule prohibits "caused" in this specific scenario, respecting the need for precise language about necessity.

  2.  **Addressing the Climate Reporter's Concern (Clarity of Climate Change's Role):**  
      While avoiding "caused," the rule mandates strong, active verbs that unequivocally convey climate change's *dominant role* in shaping the event's destructive characteristics. Terms like "dramatically intensified," "supercharged," or "fueled" clearly communicate that the *extreme nature* of the event – its unprecedented intensity, duration, and impacts – is a direct consequence of human-induced warming. This accurately reflects the study's core finding that the *specific, damaging characteristics* of the heat wave were products of added greenhouse gases.

  3.  **Concrete Application Examples:**
      *   **Current Heat Wave (Study: Made 5x more likely, 2°C hotter):**  
          *Acceptable Headline:* **"Climate Change Supercharged Heat Wave, Made It 5x More Likely & 2°C Hotter, Study Finds"**  
          *Acceptable Lead:* **"Human-caused climate change dramatically intensified the recent heat wave, making it roughly five times more likely and approximately two degrees Celsius hotter than it would have been otherwise, according to a new attribution study."**  
          *Unacceptable:* "Climate Change Caused This Heat Wave" (Implies no heat wave would have occurred).
      *   **Hypothetical Marine Heatwave (Study: "Virtually Impossible" without climate change):**  
          *Acceptable Headline:* **"Study: Climate Change Caused Unprecedented Marine Heatwave"**

  **Why This Isn't Splitting the Difference:**  
  This rule doesn't dilute the message or find a mushy middle ground. Instead, it mandates *precision* based on the specific scientific conclusion of the attribution study:  

  *   **"Virtually Impossible" Finding = "Caused" is permitted.**  
  *   **"More Likely/Severe" Finding = "Intensified/Supercharged/Fueled" is required.**  

  Both objections are fully addressed: the linguistic precision of "caused" is preserved for its strict definition, while the overwhelming influence of climate change on the event's severity is communicated with equally strong and scientifically accurate language. The mandatory inclusion of key quantitative findings provides essential context and reinforces the magnitude of climate change's impact.

  **Next Steps:**  
  This rule will be added to the Style Guide under "Science Terminology / Climate Reporting." Please apply it consistently to all future attribution stories. For the current heat wave story, the headline and lead should be revised according to the examples above.  

  Let's finalize this wording by EOD. Thank you for your rigorous debate on this important point.
