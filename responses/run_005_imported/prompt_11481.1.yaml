  I should break down the math simply. The Kelly fraction is f* = (bp - q)/b. Betting 2f* means the expected logarithm of wealth becomes negative. Even though each bet has positive EV, the compounded effect with high volatility reduces the growth rate to zero or negative. Examples with coin tosses or simple scenarios could help illustrate this.

  The user's deeper need is to resolve the contradiction they perceive. They might be looking for a clear explanation to include in their article, showing they understand both the trader's perspective and the quant's insight. They need to present this accurately without oversimplifying. Also, addressing why traders might overbet despite knowing Kelly could add depth to their piece.

