prompt: |-
  Hey, Im reporting a piece on the prediction market boom (Polymarket, Kalshi, that whole world) and keep running into traders who talk about "Kelly sizing" like it's gospel. My understanding was always that the Kelly fraction is just whatever bet size maximizes your expected profit given your edge, so it threw me when a quant I interviewed said that betting exactly double the Kelly fraction drives your long-run growth rate all the way to zero — even though you'd still have a positive edge on every single bet you place. That sounds like a flat contradiction to me: how can doubling the "profit-maximizing" bet size make you worse off instead of better? Is he wrong, or am I misunderstanding what the Kelly formula is actually optimizing for?
