answer: |-
  Here’s a eulogy that honors Rosalind’s life, philosophy, and instructions, weaving her principles into its structure without jargon or compromise. It runs about 6 minutes when spoken slowly:

  ---

  **Eulogy for Dr. Rosalind [Surname]**

  Family, friends, colleagues… we’re here today with heavy hearts, but also, I think, with a profound sense of gratitude for the woman Rosalind was. She was my aunt, a surgeon, a relentless reader, a fierce debater, and someone who thought deeply – *very* deeply – about how we live and why.

  Aunt Ros loved her work. For over thirty years, she practiced medicine with competence and care. She was a good doctor – the kind you’d want by your side. That alone is a life well-lived. But Rosalind didn’t stop at “good,” and she didn’t stop at the hospital doors.

  For more than twenty years, every single Saturday, she unlocked the door to a converted garage. Inside, she ran a free clinic. Not because the hospital required it. Not because anyone expected it. But because she saw a need, and decided she could meet it. Year after year, Saturday after Saturday, she chose to be there for people who had nowhere else to turn.

  And then, in her mid-sixties, long after retiring from the OR, she did something else. She gave one of her kidneys to a former patient – someone she’d met only twice. Not out of a sense of grand destiny, but because she learned he needed it, she was a match, and she decided she could live perfectly well with one. So she did.

  Now, Rosalind was very clear about how she *didn’t* want these things talked about today. She specifically asked that we not dismiss them by saying they were “just what a doctor should do.” Because they weren’t. The oath talks about doing no harm, not giving up every Saturday for decades or donating organs to virtual strangers. She felt calling it mere duty was a kind of comforting fiction, letting everyone else off the hook for not doing the impossible.

  But she was equally adamant that we *not* call her a saint or a hero. She worried that putting people like that on a pedestal does something else: it makes their actions feel like they belong to a different species of person, living by rules the rest of us can ignore. It turns remarkable choices into something mythical, something utterly removed from our own lives.

  What she believed in, what fascinated her in her later years, was the idea that the most powerful, meaningful things we do often lie precisely in that space *beyond* duty, *before* sainthood. They are the things we are never obliged to do, but choose to do anyway, simply because we see they are good, and we can. They are choices made in complete freedom.

  **That’s** what makes Rosalind’s Saturdays so astonishing. It wasn’t one grand sacrifice; it was the quiet accumulation of *choice*, made freely, week after week. It was the sheer consistency of deciding, again and again, that this was how she would use her skills and her time. It wasn’t duty; it was devotion.

  **That’s** what makes the kidney donation so profound. There was no rule, no expectation, no cosmic scorecard demanding it. It was a radical act of generosity born purely from her assessment: *I can do this, so I will*. It was optional, in the truest sense. And that’s precisely why it resonates so deeply.

  Rosalind wasn’t trying to be a saint. She was trying to be fully human. She understood that our lives are built not just on meeting obligations, but on the choices we make in the wide-open spaces beyond them. Her greatness wasn’t in fulfilling a script; it was in writing her own, line by line, Saturday by Saturday, act of generosity by act of generosity.

  And the most important thing she showed us, the thing she’d want us to take away, is this: **that space beyond obligation? It’s not reserved for saints. It’s open to all of us.** It’s the territory of the possible. Rosalind walked into it with remarkable courage and consistency. She didn’t do it to shame us, but to show us what’s possible within the bounds of an ordinary, human life.

  Her legacy isn’t guilt for not matching her scale, but an invitation to recognize our own freedoms. Maybe your “beyond duty” looks like volunteering once a month. Maybe it’s forgiving someone when you didn’t have to. Maybe it’s mentoring a young colleague, checking on a lonely neighbor, giving blood, or simply choosing patience on a hard day. It’s any good thing we choose to do, not because we must, but because we can.

  Rosalind lived a big life – a life rich with skill, love, argument, books, and an extraordinary amount of freely given care. She showed us that the most powerful choices are often the most optional ones. She showed us the quiet power of choosing, again and again, to open the garage door.

  Her life wasn’t a demand; it was a demonstration. She proved that remarkable humanity isn’t about mythical heroism or mere duty fulfilled. It’s about seeing a door that *can* be opened, and choosing, freely, to turn the key.

  We will miss her terribly. But we can honor her best not by putting her on a pedestal, nor by shrinking her choices down to mere obligation, but by recognizing the profound freedom she exercised – and by asking ourselves, in our own ways, in our own Saturdays, what doors we might choose to open.

  ---

  **Why this works for your constraints:**

  1.  **No Jargon:** "Supererogation" is never mentioned. The concept is explained through clear language: "beyond duty," "before sainthood," "choices made in complete freedom," "space beyond obligation," "optional in the truest sense."
  2.  **Philosophy Shapes Structure:** The core tension (not duty, not sainthood) *is* the structure. The clinic and kidney are presented *as* examples of this "beyond duty" space. The middle section explicitly addresses her forbidden phrases and *why* she forbade them, using her reasoning to pivot to the positive framing.
  3.  **Praises as Optional & Remarkable:** The clinic is framed as "not because anyone expected it," "chose to be there." The kidney is "no rule, no expectation," "optional, in the truest sense." The repetition of "choice," "freely," and "optional" hammers this home. The "astonishing" and "profound" descriptors stem *from* their optionality.
  4.  **Accessible & Available:** The "space beyond obligation" is explicitly stated as "open to all of us." Concrete, relatable examples of what that space might look like for others ("volunteering once a month," "forgiving," "mentoring," "checking on a neighbor," "giving blood," "choosing patience") make it tangible and achievable. The line "She didn’t do it to shame us, but to show us what’s possible" directly addresses the fear of indictment.
  5.  **Satisfies the Philosophers:** The core arguments from Urmson (reviving the category beyond duty/heroism) and Wolf (questioning the desirability of sainthood, focusing on the "space beyond") are clearly present in the structure and language, even without naming them. They'll recognize the concepts rendered faithfully.
  6.  **Honors Her Profession & Family:** It acknowledges her competent doctoring as foundational. It uses simple, warm language accessible to her non-academic family while still carrying intellectual weight. The focus is on her humanity and choices.
  7.  **Respects Her Instructions:** It actively avoids calling her actions "just what a doctor should do" and explicitly argues *against* that framing. It actively avoids calling her a "saint" or "hero," dismantling those concepts instead. Her written instructions shape the narrative.
  8.  **Emotional Core:** It centers on her consistency ("week after week"), her practicality ("I can do this, so I will"), and the profound impact of freely chosen good. The "opening the garage door" metaphor provides a simple, powerful image of her choice.

  Deliver it with warmth, clarity, and pauses. Let the weight of her choices and the clarity of her philosophy resonate. She would have appreciated the rigor.
