  The attitudinal hedonism move in (4) is the pivot. Owen tries to maintain that truth's value merely modulates pleasure's magnitude, not its fundamental status. But as Nadia retorts in (5), this seems to make truth an independent value - which would breach hedonism's reductionist premise. This is where the deepest philosophical issue lies: can a property (truth) affect well-being without being intrinsically valuable?

