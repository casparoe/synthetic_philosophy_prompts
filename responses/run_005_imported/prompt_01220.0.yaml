  I should weigh the pros and cons of each path. Direct action might force change quickly but at high risk. Working within the system, though slow, preserves stability and legality. The middle path—confronting the board with a united front and evidence—might be the best approach. It respects formal processes while applying pressure. Documenting everything and presenting a solid case to the board could prompt action, especially if they see the company's survival at stake.

