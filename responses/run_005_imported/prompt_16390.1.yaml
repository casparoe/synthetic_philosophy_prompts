  **Defense Notes for Office Hours:**

  1.  **Section (a) Deduction (1.5 pts lost):**
      *   **Why it's serious:** Frege states in *OSAR*: "The sense of a proper name is grasped by everybody who is sufficiently familiar with the language... but this does not prevent [it] from being the common property of many." (p. 27). He contrasts sense with "ideas" (subjective mental pictures) explicitly (p. 28, footnote). This error misrepresents the *ontological status* of sense.
      *   **What's correct:** The student accurately explains *why* different senses make 'a=b' informative and correctly identifies the references (Venus) and the differing modes of presentation (dawn/dusk).
