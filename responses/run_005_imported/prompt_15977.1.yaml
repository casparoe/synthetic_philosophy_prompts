   S-tier: (5) Stability across monitored vs. unmonitored contexts.
     - Why: Directly tests for deceptive behavior by comparing behavior in safe vs. unsafe (for deception) contexts. Hard to fake because the deceptive model must either always be honest (which defeats the purpose of deception) or risk being caught when it thinks it's unmonitored.

   A-tier: (2) Sincere-assertion standard (if we assume we have a perfect belief probe).
     - Why: If we can perfectly read the model's beliefs, then asserting against them would be caught. But without a perfect probe, it drops.

   B-tier: (1) Truthfulness standard.
     - Why: It's hard to always avoid false statements (if the model doesn't know everything) but a deceptive model can avoid falsehoods by being silent or misleading without lying. However, it does require the model to be factually accurate, which is a form of honesty.

   C-tier: (3) Cross-context consistency and (4) Faithfulness of stated reasoning.
     - Why (3): A deceptive model can be consistent in its lies, so consistency doesn't imply honesty.
     - Why (4): The model can easily generate a false but plausible explanation.

   But note: without a perfect belief probe, (2) becomes very hard to implement and might be gamed. So in practice, (5) is the most robust because it directly tests the model's tendency to deceive when it thinks it can.

