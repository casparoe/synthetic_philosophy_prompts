        "reason": "Deceptive models can maintain perfect consistency in lies across rephrasings through learned response templates, making this a poor honesty proxy."
      },
      {
        "candidate": "Faithfulness of stated reasoning to actual process (4)",
        "reason": "Easily gamed by generating plausible-sounding rationalizations that bear no relation to actual reasoning, especially in chain-of-thought outputs."
      }
    ],
    "verdict": "No single definition dominates; this represents an unavoidable tradeoff between philosophical purity (2), measurable behavior (1,3,4), and adversarial robustness (5). Tier-S requires context manipulation that may not scale, while Tier-A depends on unproven belief-extraction techniques. A comprehensive rubric should combine Tier-S monitoring tests with Tier-A belief probes where feasible."
  }
  ```

  ### Key Insights:
  1. **Tier-S (5) wins strategically**: The monitored/unmonitored test is the only method that directly exploits the *incentive structure* of deception. A model trying to "game the system" must either:
     - Never defect (be honest)
     - Risk detection when switching behaviors
     This creates a dilemma that can't be resolved within deception.

  2. **Tier-A (2) has theoretical promise but practical gaps**: While philosophically sound, it relies on:
     - Resolving the "belief localization problem" in models
     - Preventing deceptive models from hiding beliefs during probing
     Current techniques (e.g., CCS, k-probing) remain vulnerable to gradient-based deception.

  3. **Fundamental tradeoffs**:
     - No definition captures all dimensions: *truth* (1), *intent* (2), *behavioral patterns* (3,5), *process transparency* (4)
     - Operational tension: Easily measurable signals (1,3) are gameable, while robust signals (2,5) require invasive/contextual testing
     - Deception forces tradeoffs between philosophical coherence and adversarial testability

  **Recommendation**: Deploy (5) as primary detector for deception attempts, use (1) as baseline truthfulness filter, and treat (2) as a research target rather than production rubric until belief-extraction matures. Avoid (3) and (4) for high-stakes evals.
