answer: |-
  ## The Unfinished Quarrel: Dispositionalism vs. Communitarianism on Rule-Following

  **Setting:** *A quiet corner of a bustling philosophy conference coffee break. Dispositionalist (DISP), mid-40s, earnest and precise, sips tea. Communitarian (COMM), late 50s, sharp-eyed and skeptical, nurses an espresso.*

  **DISP:** ...so while Kripke's challenge is profound, Alan, I maintain it *can* be met without abandoning facts about individual meaning. My past computations *plus* my *dispositions* under ideal cognitive conditions – unlimited time, perfect memory, no fatigue – *do* fix what I mean by "+". It’s not just what I *did*, but what I *would* do, ideally.

  **COMM:** *(Leans forward)* Ah, the siren song of the counterfactual! But Helena, your "ideal conditions" are a mirage. *What* determines the *right* idealization? If you say "conditions where I compute correctly," haven’t you presupposed the very notion of correctness – meaning addition – that you’re trying to ground? You’re chasing your tail. The idealized disposition *is* defined by the meaning, not the other way around.

  **DISP:** Not at all. We can characterize the idealization independently. Think of it as maximizing computational *capacity* and minimizing *interference*. We don't need to invoke "correctness" to define perfect memory or unlimited time – those are functional descriptions of cognitive resources. Under *those* maximal resource conditions, my disposition to output a specific number for any pair <n, m> *is* the fact of my meaning addition. It’s a complex, non-intentional fact about my cognitive architecture.

  **COMM:** But that just pushes the problem back. Why assume maximal resources produce *determinate* dispositions? Perhaps under truly infinite time and memory, my cognitive architecture exhibits chaotic behavior for large n+m, or maybe it *would* output the quaddition result for sufficiently large inputs – a result *consistent* with all past behavior! Your "idealization" doesn't magically banish indeterminacy; it just relocates the skeptical problem to a hypothetical realm. How does maximal capacity *force* one unique function?

  **DISP:** Because the function is *causally embedded* in my cognitive system! My past learning, my neural wiring – they implement a specific algorithm. Ideal conditions simply remove barriers to its execution. The indeterminacy you see is epistemic – we can't *know* the full disposition – not metaphysical. The fact *is* there, grounded in my physical state and its counterfactual behavior under unimpeded operation. It’s like a physical machine – its blueprint determines its outputs given inputs and power.

  **COMM:** *(Raises an eyebrow)* And who reads the blueprint? Kripke's point is precisely that no internal state, no "blueprint," wears its interpretation on its sleeve. Your neural state N *could* be interpreted as implementing addition *or* quaddition, consistent with all past and *dispositional* facts under *your* idealization. You need the *norm* – the standard of *correctness* – to interpret N as meaning *this* rather than *that*. And norms, Helena, aren't solitary facts. They live in the space of reasons, in practices of *agreement* and *correction*. That’s why meaning is essentially communal. What makes your answer "right" isn't a hidden state or disposition, but its conformity to the community's practice when they check your work.

  **DISP:** *(Taps finger)* But Alan, you merely relocate the paradox! If *my* individual dispositions under idealization are suspect, why aren't the *community's*? What fact determines that the *community* is disposed towards addition, rather than a deviant function 'communitition' that agrees with addition on all sums ever collectively computed *so far*? Your community itself is just a larger finite system passing a finite number of tests! Your "practice of correction" is just the community's *dispositions* to affirm or reject certain answers. How does invoking many minds solve the unique determination problem for one?

  **COMM:** Because the practice isn't *just* the sum of individual dispositions! It’s a dynamic, normative *institution*. The "fact" that fixes meaning isn't a hidden communal disposition towards specific outputs, but the *publicly accessible pattern of normative attitudes*: Jones corrects Smith when Smith says '125' for '68+57'; we all agree Jones was *right* to do so; we teach newcomers *this* way, not *that* way. The meaning *is* the standard implicit in this ongoing, corrective practice. There’s no need for a "hidden fact" about what the community *would* do with quaddition-sized numbers it's never encountered.

  **DISP:** But the standard *itself* is what's indeterminate! How do you know the community *wouldn't* endorse quaddition for '68+57' if they encountered it tomorrow? Their past practice, like my past computations, is finite. Their current "standard" is just as compatible with communitition as addition. Your appeal to "pattern" or "teaching" is just as vulnerable. How do you teach the *whole* infinite function? You teach *samples* and a *rule* – "do the same" – but Kripke showed "the same" is precisely what's up for grabs! The community's own rule-following is just as skeptical-puzzle-prone as mine.

  **COMM:** You misunderstand the constitutive role of practice. It’s not that the community *has* a determinate disposition hidden away. It’s that meaning *is constituted by* the ongoing, public activity of *treating* certain responses as correct and others as incorrect, *within the context of shared life and language games*. The "standard" isn't a pre-existing Platonic form; it *emerges* and is *sustained* by the practice itself. Indeterminacy about future novel cases isn't a flaw; it’s a feature. The practice *determines* correctness as cases arise, through communal negotiation and application. It’s not fixed in advance like a disposition, but *lived*.

  **DISP:** That sounds like surrender to indeterminacy dressed up as pragmatism! If meaning is only fixed *as we go*, case-by-case, based on communal fiat, then there *is no fact* about what I meant yesterday by "+" that determines the correct answer today for '68+57'. My past intention is dissolved into the community's future verdict. That renders individual meaning epiphenomenal at best. My disposition, grounded in my actual cognitive structure, provides a fact *now* about what is correct *now* for any input, even if we can't compute it. Your community can only tell me what they *will say* later.

  **COMM:** And what good is your "fact now" if it’s epistemically inaccessible even to *you* and potentially indeterminate under your *own* description? Your appeal to "cognitive structure" is a placeholder for mystery. The community’s verdict *is* the only operational standard of correctness we have or need. It provides the framework within which your individual utterances *have* meaning. Without the background of shared practice and potential correction, your "+" sign is just a squiggle, your disposition just a physiological tic. Meaning is inherently social, Helena. Solitary dispositionalism is a myth sustained by ignoring the scaffolding of language.

  **DISP:** And communitarianism, Alan, is a capitulation to skepticism disguised as sociology. It replaces the search for truth about meaning with a description of consensus, mistaking the map for the territory. My cognitive structure *is* the territory. Your community is just another mapmaker, equally lost in the same desert of finitude. We agree on the problem – the unit tests are insufficient. But I believe in a deeper physical fact determining the function; you believe only in the graders comparing the answers.

  **COMM:** *(Smiles faintly)* And the graders, Helena, are the only ones who can tell you if you passed the test. The "deeper fact" you posit is a ghost in the machine. The practice is the life of the meaning. We’ll have to agree to profoundly disagree on where the reality of rules resides. More espresso?

  **DISP:** *(Sighs, pushes teacup away)* Perhaps. But the ghost, Alan, feels very real from the inside. Tea’s gone cold anyway.

  *(They sit in silence, the unresolved tension hanging in the air with the scent of coffee grounds, the paradox as fresh and intractable as the day Kripke posed it.)*
