prompt: |-
  So my friend and i have run a small app together for two years, 50/50 on the work, no contract, always just split whatever it made evenly. A company wants to buy it now, but it turns out they're mainly after me specifically, for a recommendation algorithm i built, so if the deal got shaped entirely around what's best for me (equity plus a job offer) i could clear something like $800k, way more than my friend's best-case version of the exact same deal, which tops out around $150k if he just cashes out and walks away. He's worried that whatever split we land on leaves him with less than hed get if we just kept running the app ourselves and never took the offer at all, purely because i happen to be the one they want, which feels wrong, but pretending we bring equal value to this deal now feels wrong too. Neither of us has some great job to walk into, so its not really a leverage thing, and i really don't want this to wreck the friendship. Is there an actual fair way to think about how to divide this, or does it just come down to whoever pushes harder?
reasoning: |-
  Okay, let me start by understanding the user's situation. They've been running an app 50/50 with a friend for two years, no contract. Now a company wants to buy it, but mainly for the user's recommendation algorithm. The user could get $800k in equity and a job, while their friend might only get $150k if they cash out. The friend is worried about getting less than if they continued the app, and the user doesn't want to ruin the friendship.

  First, I need to unpack the core issues here. The main tension is between the equal past contributions and the unequal future value in the acquisition. The user feels conflicted because the current deal's value hinges on their specific skills, not the shared work. The friend fears losing out on future earnings if the app continues. 

  I should consider fairness from multiple angles. Past contributions are equal, so that supports a 50/50 split. But the acquisition's value is driven by the user's algorithm, suggesting a merit-based split. Also, there's the opportunity cost for the friend if they walk away and the app stops earning. The user mentioned neither has a great job, so this money is significant for both.

  The user's deeper needs seem to be preserving the friendship while ensuring a fair outcome. They might feel guilty about benefiting more but also recognize their unique contribution. The friend might feel undervalued despite years of equal work. It's not just about money; it's about acknowledging both their efforts and the current realities.

  Looking at possible solutions, a hybrid approach makes sense. Splitting the cash part equally honors past work. The equity portion, tied to the user's future role, could be weighted more towards them. Maybe 50/50 on cash, 70/30 or 80/20 on equity. That way, the friend gets immediate money and a share of future gains, while the user is compensated for their ongoing contribution.

  Another angle is the friend's opportunity cost. Calculating the app's future earnings if not sold shows what the friend might lose. The user could offer a minimum guarantee based on those projections to ease the friend's fears. Also, non-compete clauses and transition support might add value for the friend without costing the user much.

  Communication is key. They need open dialogue, maybe with a mediator, to express concerns without resentment. The user should acknowledge the friend's fears and emphasize the benefits: guaranteed cash now versus uncertain future profits. Highlighting the friend's reduced risk since the user is taking on the job commitment could help.

  I should also think about potential pitfalls. If they don't agree, the deal might fall through, hurting both. The friend might feel sidelined, leading to resentment. The user needs to balance generosity with fairness, ensuring the friend feels respected. Tax implications and legal advice are practical steps to avoid future issues.

  Ultimately, the solution should recognize past equality and future disparity. A structured split that compensates the friend fairly while rewarding the user's unique role addresses both aspects. Transparency and empathy in negotiations will be crucial to maintain their friendship through this transition.
answer: |-
  This is a genuinely tough situation balancing fairness, friendship, and the realities of value creation. Pretending your contributions are equal *for this specific deal* ignores the buyer's motivation, but ignoring two years of 50/50 partnership feels equally unjust. **The fairest approach acknowledges both your equal *past* contributions and the unequal *future* value you bring to *this specific deal*.** Here's how to break it down:

  1.  **Separate the Components of the Deal:** Don't treat the total $950k ($800k + $150k) as one pot. Break it down:
      *   **Asset Sale Value:** The value of the *existing app and its user base/history*. This reflects your *joint work over the past two years*. This should be split **50/50**. Estimate this based on what the app would be worth *without* the specific recommendation algorithm being the primary driver for the acquisition. This might be closer to your friend's $150k figure, or perhaps a bit higher based on historical revenue/projections. **Call this Value `A`. Split A 50/50.**
      *   **Your Future Employment & IP Value:** The *additional* $650k ($800k - $150k) primarily represents:
          *   **Your specific expertise & IP (the algorithm):** This is the unique value *you* created.
          *   **Your future employment commitment:** The equity/package is partly compensation for you *going to work for them*. Your friend isn't doing this.
          *   **The "acqui-hire" premium:** They are paying extra to secure *you*, specifically. This portion should be **predominantly yours**. This is Value `B`.

  2.  **Negotiate the Split of Value `B` (The "You" Premium):** This is where fairness to your friend *within the context of the deal* comes in. While Value `B` is driven by you, consider:
      *   **The Opportunity Cost for Your Friend:** If the deal happens, the app *as you jointly ran it* ceases to exist. Your friend loses their 50% stake in its *future independent earnings*. Acknowledge this sacrifice. Calculate a reasonable projection of what 50% of the app's *next 2-3 years* of profit might be (be conservative). **This is the minimum your friend should receive from the *total deal proceeds* to feel whole compared to walking away from the offer.** Let's call this Minimum Guarantee `M`.
      *   **The Foundation You Built Upon:** Your algorithm exists within the app you built *together*. Your friend's work enabled its creation and deployment. This justifies them getting *something* from Value `B`, even if it's smaller than your share.
      *   **Preserving the Friendship:** Generosity within reason is an investment in the relationship.

  3.  **Proposed Fair Split Structure:**

      *   **Step 1:** Agree on Value `A` (Asset Sale Value). Split this **50/50**.
      *   **Step 2:** Calculate Minimum Guarantee `M` (Friend's opportunity cost).
      *   **Step 3:** Ensure Friend's *Total Take* (50% of `A` + their share of `B`) >= `M`. If 50% of `A` is already >= `M`, great. If not, their share of `B` must cover the difference to reach `M`.
      *   **Step 4:** Split the *remaining* Value `B` **significantly in your favor**, but not necessarily 100%. Examples:
          *   **80/20 You/Friend:** Acknowledges their foundational role while reflecting the buyer's focus on you. (Friend gets 50% of `A` + 20% of `B`).
          *   **70/30 You/Friend:** Slightly more generous, further ensuring they meet/exceed `M` and feel valued.
          *   **Guarantee `M` First:** Friend gets max(`M`, 50% of `A`) + Smaller % of remaining `B` (e.g., 10-15%).

  4.  **Illustrative Example (Using Rough Numbers):**
      *   Assume `A` (Asset Value) = $200,000 (split 50/50 = $100k each)
      *   Total "You Premium" Value `B` = $750,000 ($950k total implied value - $200k Asset Value)
      *   Projected Friend's 50% share of *next 3 years app profit* (`M`) = $120,000
      *   **Option 1 (80/20 on B):**
          *   You: $100k (A) + $600k (80% of B) = **$700k**
          *   Friend: $100k (A) + $150k (20% of B) = **$250k** (Well above $120k `M`)
      *   **Option 2 (Guarantee M + 15% of Remaining B):**
          *   Friend needs at least $120k total. They already get $100k from A. They need $20k more to hit `M`.
          *   Friend gets: $100k (A) + $20k (to hit `M`) + 15% of *remaining* B ($750k - $20k = $730k) = $20k + $109.5k = **$229.5k**
          *   You get: $100k (A) + 85% of remaining B after `M` guarantee = 85% of $730k = **$620.5k** + $100k = **$720.5k**

  5.  **Key Arguments to Make (Focus on Fairness & Friendship):**

      *   **Acknowledge His Fear:** "I completely understand why you're worried about getting less than if we just kept going. That makes total sense, and I don't want that to happen. Let's figure out what that 'walk away' number looks like realistically (`M`) and make sure you at least get that, guaranteed."
      *   **Frame the Value Separation:** "The buyer is offering two things: 1) Money for the app we built *together* over the last two years (Value `A` - we split this 50/50). 2) A much bigger package specifically tied to *me* going to work for them and them wanting my specific skills (Value `B`)."
      *   **Explain the "B" Split Logic:** "While Value `B` is driven by my work, I recognize our partnership and that the app we built together was the foundation. I also know this deal means you give up your future share of the app's profits. I think it's fair you get a meaningful piece of Value `B` – let's say X% – to acknowledge that partnership and ensure you walk away better off than if we said no (`M`)."
      *   **Focus on His Win & Reduced Risk:** "This deal gives you a significant, *guaranteed* cash payout now ($X), instead of hoping the app keeps making money for years. You avoid all future risk and work. You walk away with [Amount significantly higher than `M`]."
      *   **Highlight the Friendship:** "Our partnership and friendship mean a lot to me. I want you to feel this is fair and that you're getting a great outcome from *this opportunity*, even if the buyer's interest is focused on my specific role going forward. I'm not trying to squeeze you; I'm trying to find a split that honors our past work and reflects the structure of *this specific offer*."

  6.  **Crucial Practical Steps:**

      *   **Get Independent Projections:** Agree on realistic numbers for `A` (Asset Value) and `M` (Friend's opportunity cost). Be conservative. Maybe involve a neutral third party (a friendly accountant?).
      *   **Formalize Everything:** **GET A LAWYER (each have your own!)**. Even with the best intentions, a simple agreement outlining the split structure is essential. This protects both of you and the friendship in the long run.
      *   **Negotiate the Deal Together (Initially):** Present a united front to the buyer on the *total* value you expect. Once the total package is clear, *then* apply your agreed split structure internally.
      *   **Consider Non-Compete/Transition:** Part of your friend's compensation could be a small role in transition or a clear agreement on non-compete scope (fair to him, not restrictive).
      *   **Tax Implications:** Understand how different compensation structures (cash now vs. equity vesting) impact taxes for each of you. This affects the net value.

  **This isn't about pushing harder; it's about structuring the deal to reflect its components.** By separating the value of the past joint asset from the value of your future-specific contribution and guaranteeing your friend doesn't lose compared to continuing, you create a framework for fairness. The 80/20 or 70/30 split on the "You Premium" (Value `B`) acknowledges his role in the foundation while reflecting the buyer's focus. **Prioritize open communication, acknowledge his concerns, use the Minimum Guarantee (`M`), and get legal advice.** This approach gives you the best chance of landing the deal, preserving your friendship, and ensuring both of you feel respected.
