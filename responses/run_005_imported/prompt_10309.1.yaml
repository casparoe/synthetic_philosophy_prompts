  The user is familiar with dependency graphs, so I should use that analogy. Grounding is like the build dependency where the lower-level modules (molecular structure) must compile first to create the higher-level ones (fragility). Supervenience is just saying if the lower-level changes, the higher-level must change too, but it doesn't specify the dependency direction.

