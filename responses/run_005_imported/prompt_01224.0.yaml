  First, I need to recall the bank case. Low stakes: the couple is fine saying they know the bank is open Saturday. High stakes: same evidence, but with higher consequences, they say they don't know. Both theories agree that knowledge ascription changes with stakes, but they explain it differently.

  Epistemic contextualism says that the meaning of "knows" changes based on context. In low stakes, the standards for "know" are lower; in high stakes, the standards are higher. So, it's about the semantics of the word "know" being context-sensitive, like indexicals such as "tall."

  Pragmatic encroachment, on the other hand, argues that practical stakes affect knowledge itself, not just the word. In high stakes, even with the same evidence, the subject doesn't possess knowledge because the justification required is higher. Knowledge depends on both truth-conducive factors and practical stakes.

  The key difference is where the stakes affect: contextualism says it's in the language (semantics), while pragmatic encroachment says it's in the metaphysics of knowledge. They agree on the surface behavior but diverge on the underlying reasons.

  The user might be conflating the two because the outcome looks the same. But the philosophical implications are different. Contextualism keeps traditional epistemology intact but adds semantic flexibility. Pragmatic encroachment changes the definition of knowledge to include pragmatic elements, which is a bigger shift.

