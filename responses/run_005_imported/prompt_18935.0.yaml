  Here's a tiered ranking of the specified formal systems based on their perceived consistency trustworthiness, from "essentially no reasonable doubt" to "genuinely shaky or broken." The ranking considers historical scrutiny, empirical testing (via decades of use in mathematics), theoretical results (e.g., relative consistency proofs), and known limitations. Explanations are included for each system.

  ### Key Factors Considered:
  - **Historical Scrutiny**: How extensively the system has been tested by mathematicians/logicians.
  - **Empirical Evidence**: Absence of contradictions found despite widespread use.
  - **Theoretical Underpinnings**: Support from relative consistency proofs or model-theoretic constructions.
  - **Known Risks**: Open problems, counterintuitive results, or outright inconsistencies.

