    "S": [
      {
        "system": "Peano Arithmetic (PA)",
        "reason": "Extremely well-studied for over a century; no credible inconsistency threat has survived scrutiny (e.g., Ed Nelson's challenge was resolved). Its consistency is empirically verified through vast use in number theory, and it is proof-theoretically 'tame' (e.g., Gentzen's consistency proof using transfinite induction)."
      },
      {
        "system": "ZFC",
        "reason": "The de facto foundation of modern mathematics; intensively hammered for 100+ years without a trace of inconsistency. Its axioms align with intuitive set constructions, and it is exceptionally well-vetted by both practical use (e.g., in algebra, analysis) and theoretical exploration (e.g., forcing, inner models)."
      }
    ],
    "A": [
      {
        "system": "ZFC + a measurable cardinal exists",
        "reason": "Well-established large cardinal axiom with deep theory since the 1960s. Consistency is strongly supported by inner model theory (e.g., canonical inner models like L[U]) and its necessity in descriptive set theory. No serious doubts exist among experts, though it lacks ZFC's empirical breadth."
      },
      {
        "system": "ZFC + a supercompact cardinal exists",
        "reason": "Stronger than measurable cardinals but still part of the 'deeply studied' large cardinal hierarchy. Crucial for modern set theory (e.g., Woodin's work on determinacy); consistency is implied by weaker axioms and has rich structure theory. Trust is high, but it is less 'directly tested' than ZFC."
      }
    ],
    "B": [],
    "C": [
      {
        "system": "Quine's New Foundations (NF)",
        "reason": "Consistency is an open problem (neither proven nor disproven). Known oddities (e.g., disproves AC, has a universal set) and limited practical adoption reduce confidence. NFU (with urelements) is consistent, but full NF remains suspect due to stratification constraints and failed consistency proofs."
      }
    ],
    "D": [
