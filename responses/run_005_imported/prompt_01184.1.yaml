answer: |-
  Your situation isn't just a fluke—it's a fascinating and profound illustration of how shared meaning actually works. Philosophers like Wittgenstein and linguists have wrestled with this for decades, and you've hit on a core truth: **The "fact" about who was "right" doesn't exist independently of your shared practice and explicit agreement.** Here's why, and what it means:

  1.  **The Absence of a "True" Rule:** Your unspoken rule ("tip 20%") was fundamentally **underdetermined**. It was a label placed on a behavior pattern, not a meticulously defined algorithm. Both interpretations (pre-tax vs. post-tax) were perfectly valid *implementations* of the vague instruction "tip 20%" within the context of your shared history where the tax difference was negligible. Neither of you was "wrong" in the past because the rule *as practiced* encompassed both possibilities without conflict. The rule *was* the pattern of behavior, and the pattern was consistent with both interpretations.

  2.  **Meaning Resides in Use (and Agreement):** Wittgenstein famously argued that the meaning of a word (or rule) is its *use in the language game*. For six years, the "use" of your rule resulted in mutually acceptable outcomes. The specific calculation method wasn't part of the "meaning" because it never needed to be. The rule *functioned* perfectly. The "fact" of the rule's meaning only emerges *now* when you both explicitly agree on how to interpret it moving forward. Until then, it genuinely didn't exist as a specific fact.

  3.  **The "Edge Case" Revelation:** The higher-tax location acted as the necessary "friction" to reveal the latent ambiguity. This is incredibly common:
      *   **Language:** "Bring me a *large* box." Is it size or weight? Only context or clarification resolves it. An oversized but light box reveals the ambiguity.
      *   **Law:** Laws constantly face unforeseen scenarios requiring judicial interpretation because the legislators couldn't foresee every edge case.
      *   **Software:** Code works perfectly until unexpected input causes a crash, revealing unhandled conditions.
      *   **Relationships:** "Be home for dinner." Does that mean walking in the door at 6 PM, or sitting down by 6:15? Only a late arrival reveals the difference.

  4.  **This is the Normal Condition, Not a Fluke:** Your insight is spot on. **Ambiguity is the default state of most unspoken or loosely defined rules.** We navigate life relying on:
      *   **Shared Context:** Low tax rates masked the difference.
      *   **Shared Understanding of "Good Enough":** The rounding was acceptable to both.
      *   **Lack of Friction:** The difference was never significant enough to prompt investigation.
      *   **Efficiency:** Stopping to define every rule explicitly is impractical.
      Rules only *appear* perfectly clear until the context changes or an edge case forces the ambiguity into the open. Your tipping rule was robust *within its original operating parameters*.

  5.  **Is "Who Was Right?" the Wrong Question?** Yes and no.
      *   **Wrong:** If you mean "Which method was *objectively* the *true* interpretation of our unspoken rule all along?" There is no answer. The rule wasn't defined with that level of specificity. Neither of you violated the rule *as it functionally existed*.
      *   **Right:** If you mean "How should we resolve this ambiguity *now* to ensure shared understanding and fairness *going forward*?" *This* is the crucial question. The past is genuinely indeterminate, but the future requires a decision.

  **What This Means for You (and Everyone Else):**

  1.  **Let Go of the "Who Was Right?" Past Quest:** Accept the philosophical truth: the specific fact didn't exist until now. Arguing about the past interpretation is futile. Neither of you was dishonest or "breaking" the rule.
  2.  **Focus on the "How Do We Agree?" Future Question:** This is the productive step. Have a conversation:
      *   "Okay, we discovered our 20% rule had a hidden ambiguity. Going forward, should we calculate tip based on the pre-tax subtotal or the post-tax total?"
      *   Discuss the pros/cons (fairness, simplicity, common practice in the area you're in).
      *   **Make an explicit agreement.** Write it down if it helps! "From now on, tip = 20% of the amount *before* tax."
  3.  **Recognize the Ubiquity of Ambiguity:** This isn't a failure of your relationship or communication; it's a fundamental feature of human interaction and language. Most rules function well enough under normal conditions. Be mindful that edge cases *will* arise for other unspoken agreements (e.g., "clean the kitchen," "be ready on time," "help with chores"). When they do:
      *   Assume good faith (like you both did with the tip).
      *   Recognize it's likely an ambiguity revealer, not a betrayal.
      *   Clarify explicitly for the future.
  4.  **Value the Implicit (Mostly):** Don't despair! The fact that your implicit rule worked flawlessly for six years is a testament to shared understanding and context. Explicitly defining *every* rule is impossible and exhausting. Implicit rules based on shared context are the glue of efficient daily life. Just understand their limits and be prepared to make them explicit when friction arises.

  **In Conclusion:** Your "weird suspicion" is justified and insightful. There is no independent fact about who was "really" following the "true" rule all along because the rule's specific meaning on this point wasn't fixed until the ambiguity was forced. This ambiguity is not a flaw in your relationship or rule; it's an inherent feature of how meaning is created through shared practice and context. The "right" thing to do is acknowledge the philosophical indeterminacy of the past, forgive the lack of specificity (on both sides), and use this revelation as an opportunity to create a clear, explicit agreement for the future. This isn't a bug in human interaction; it's just how shared meaning works, and your experience is a perfect, everyday example of a deep philosophical truth.
