answer: |-
  That's a deeply complex and emotionally charged situation – your hurt is valid, and your brother's response, while sincere, seems to miss the relational and ethical heart of the matter. His interpretation of "anatta" (non-self) isn't *wrong* on a purely abstract, philosophical level, but its application here feels like a profound misunderstanding of how the concept functions ethically and interpersonally within Buddhism. He's likely engaging in "spiritual bypassing" – using spiritual ideas to avoid difficult emotional work and accountability.

  Here's a breakdown of why his stance is problematic:

  1.  **Philosophical Accuracy vs. Ethical Application:**
      *   **He's Partially Right:** The Buddha *did* teach "anatta" – the doctrine that there is no permanent, unchanging, independent "self" or "soul" residing within us. Our sense of self is a constantly changing process, a stream of aggregates (form, feeling, perception, mental formations, consciousness) arising and passing away due to causes and conditions. The person he was during his addiction *was* different, driven by different mental states, cravings, and suffering.
      *   **He's Missing the Point of Karma & Responsibility:** This is the crucial part. Buddhism places immense emphasis on **karma (intentional action)** and its consequences. Actions (*karma*) create results (*vipaka*), regardless of whether there's a permanent self. The stream of consciousness *carries forward* the results of past actions. The "him" sitting across from you *is* experiencing the fruits of his past actions (stability, sobriety), and crucially, *is also experiencing the relational consequences of his past actions* (your hurt, the broken trust). He *is* ethically responsible for addressing those consequences within the current stream of experience, precisely *because* of the law of karma operating across the continuum of consciousness.

  2.  **The Purpose of Non-Self (Anatta):**
      *   **Goal:** The realization of anatta isn't meant to absolve one of responsibility; it's meant to **reduce suffering** by dismantling clinging to a fixed identity ("I'm a bad person," "I'm a victim"), attachment to ego, and the pride/defensiveness that prevents growth. It fosters humility and compassion.
      *   **Misapplication:** Your brother is using it *defensively*. Instead of using the insight to soften his ego ("That past version was suffering and caused harm, but it doesn't define me rigidly; I can change and make amends"), he's using it to *avoid* the discomfort of acknowledging the harm his past actions caused *in your lived experience*. He's clinging to a *new* fixed identity: "The Enlightened One who is Beyond Past Mistakes."

  3.  **Interpersonal Ethics & Reconciliation:**
      *   **Buddhism Emphasizes Reconciliation:** Making amends, asking for forgiveness, and practicing compassion for those we've harmed are core ethical practices (part of the Noble Eightfold Path, especially Right Action and Right Speech).
      *   **The Need for Acknowledgement:** For the *harmed party* (you), healing often requires acknowledgement of the hurt and a sincere expression of regret from the person connected to the action, even if they are "different" now. Your pain exists *now* in relation to *his* past actions. Dismissing it by saying "that wasn't *me*" invalidates your very real, present suffering and the history you share.
      *   **Compassion Includes Responsibility:** True compassion arising from Buddhist practice would involve recognizing *your* suffering caused by *actions* originating within his continuum of experience and feeling motivated to alleviate it. Compassion isn't just inner peace; it's active care for others' suffering.

  4.  **The Danger of Spiritual Bypassing:**
      *   This is textbook spiritual bypassing. He's using a profound spiritual insight as an **intellectual shield** against vulnerability, guilt, shame, and the hard work of relational repair. It allows him to maintain his current "spiritual" self-image without confronting the messy, human consequences of his past.

  **What He's Missing (The Important Parts):**

  *   **Karma:** The ethical imperative to address the consequences of past actions *now*.
  *   **Compassion (Karuna):** The active desire to alleviate the suffering he caused *you*, which still exists.
  *   **Loving-Kindness (Metta):** The wish for your well-being and happiness, which would include addressing your hurt.
  *   **Right Action & Right Speech:** Ethical conduct necessitates making amends and speaking truthfully and kindly to heal relationships.
  *   **Interdependence (Pratityasamutpada):** Your well-being and his are interconnected. Healing the relationship benefits both streams of experience.

  **How to Approach This:**

  1.  **Acknowledge His Sincerity & Growth:** Start by affirming you see his genuine effort and transformation. "I truly respect the work you've done and how far you've come. Your dedication to your practice is impressive."
  2.  **Focus on *Your* Experience & Present Need:** Shift the focus from abstract philosophy to the concrete, relational reality. "I understand the concept of non-self intellectually. However, *my experience* is that *I* was hurt by actions connected to your continuum of experience. That hurt is still present *for me*. Hearing 'I'm sorry for the pain my actions caused you' isn't about punishing the past self; it's about acknowledging *my* present reality and helping *me* heal the relationship *now*."
  3.  **Connect it to Buddhist Ethics:** "From what I understand of Buddhist practice, making amends and practicing compassion for those we've harmed is central. While the 'self' who acted may not be permanent, the *karmic consequences* of those actions are still unfolding in our relationship. A sincere apology feels like part of the Right Action needed to heal that karma *for both of us*."
  4.  **Separate Apology from Identity:** Emphasize that an apology isn't about labeling him a "bad person" forever. "Saying sorry isn't about defining you by your past mistakes. It's about acknowledging the impact those actions had on me and taking responsibility for fostering healing *now*."
  5.  **Express Your Desire for the Relationship:** "I value our relationship and want it to be whole. Addressing this past hurt feels like an important step towards that for me."

  **Is he "onto something real"?** Yes, the core concept of anatta is a profound Buddhist truth. **Is he missing something important?** Absolutely. He's missing the ethical, karmic, and compassionate *application* of that truth in human relationships. He's using a liberating insight as a shield against vulnerability and relational responsibility, which is a common pitfall, not genuine spiritual maturity. Your request for an apology is deeply reasonable and aligns more closely with the compassionate, responsible heart of Buddhist ethics than his current stance does.
