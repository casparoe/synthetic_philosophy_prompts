prompt: |-
  So for my philosophy elective (it's this random elective my school offers, basically "intro to big questions") we just started a logic/free will unit and my teacher handed out this excerpt from Aristotle's "On Interpretation," chapter 9 — I guess its THE classic passage people bring up whenever they argue about whether statements about the future are already true or not, the whole "sea battle" thing. I've read it like four times now and I get the big picture (something like: if the future is already fixed there's no point deliberating about anything) but there are two specific moves in the argument I can't untangle on my own, and I don't just want the "point" of the passage since I feel like I could get that from any random summary online. Here are the two bits that are messing me up (my teacher's handout says the translation is by someone named E.M. Edghill, from like 1928, if that matters):

  "Again, if a thing is white now, it was true before to say that it would be white, so that of anything that has taken place it was always true to say "it is" or "it will be." But if it was always true to say that a thing is or will be, it is not possible that it should not be or not be about to be, and when a thing cannot not come to be, it is impossible that it should not come to be, and when it is impossible that it should not come to be, it must come to be. All, then, that is about to be must of necessity take place. It results from this that nothing is uncertain or fortuitous, for if it were fortuitous it would not be necessary."

  (...then he goes through a chunk about someone predicting stuff ten thousand years ago and an example about a coat wearing out before it gets cut up, which I mostly followed, so skipping that...)

  "Let me illustrate. A sea-fight must either take place to-morrow or not, but it is not necessary that it should take place to-morrow, neither is it necessary that it should not take place, yet it is necessary that it either should or should not take place to-morrow."

  Question one: in that first paragraph he seems to fully PROVE, step by step, that if a prediction is true today it has to come true necessarily — like that's basically the whole careful argument. But then later (second bit) he just says a sea-fight doesn't have to happen necessarily after all, without ever coming back to say "here's the exact step in my earlier proof that was wrong." So in Aristotle's own reasoning, which specific move in that first paragraph is actually the flawed one, and why doesn't he point it out directly?

  Question two, and this is the one me and my friend Jake got into a whole argument about at lunch: when Aristotle says its necessary that the sea-fight will-happen-or-won't-happen, but NOT necessary that it'll happen and NOT necessary that it won't — Jake says that's just a contradiction dressed up in fancier words, since "necessarily (A or not-A)" should just mean the same thing as "necessarily A, or necessarily not-A." I said there's probably some actual technical difference going on there (like a scope thing?) that he's relying on, but I couldn't explain what it actually was or defend it. Can you settle this for us? And while you're at it, can you tell me what the "official" reading even is — is Aristotle saying these future statements have NO truth value right now (not true, not false, just blank), or that they ARE true or false already, just not necessarily so? I've seen it described both ways in different places and it seems like a genuinely huge difference in what he's even claiming, not just a wording thing.
