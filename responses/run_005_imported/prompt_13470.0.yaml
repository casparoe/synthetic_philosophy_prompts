  I'm working on a novel in which a character's long-established courage deserts them at exactly the moment it's put to the test, and I want the failure to be psychologically exact rather than a cliché reveal of 'hidden cowardice.' In the metaphysics of dispositions, philosophers distinguish 'finkish' dispositions from 'masked' dispositions as two different ways a disposition can fail to manifest even when the triggering conditions seem perfectly in place, and the two are supposed to pose importantly different problems for the simple conditional analysis of dispositions (roughly, the thesis that having a disposition just consists in what one would do under the relevant circumstances). Please give one detailed example of this character's courage failing because it has been finked, and a second example of the very same trait failing because it has merely been masked, making clear exactly what would have to be true beneath the surface in each case for it to count as one rather than the other — given that, from the outside, the two failures might look identical.
