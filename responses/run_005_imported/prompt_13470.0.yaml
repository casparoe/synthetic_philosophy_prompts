answer: |-
  Here are two distinct psychological scenarios for your character's failed courage, grounded in the metaphysics of dispositions, with precise underlying mechanisms:

  **Core Distinction Recap:**
  - **Finkish Disposition:** The disposition *ceases to exist* precisely *at the moment* the triggering conditions occur. The stimulus itself (or something it causes) destroys the disposition instantaneously.
  - **Masked Disposition:** The disposition *remains intact* when triggered, but its *manifestation is actively blocked or prevented* by some interfering factor present alongside the trigger.

  **Example 1: Courage Finked (Disposition Destroyed)**

  *The Situation:* Captain Aris, a decorated veteran known for leading dangerous rescue missions, is pinned down with her squad and wounded civilians in a collapsing building under heavy fire. The only escape is a perilous 15-meter sprint across an exposed plaza to the next intact structure. Aris *knows* she must lead the charge to inspire her terrified team and save the civilians. This is the exact type of situation where her courage has always manifested.

  *The Failure:* As Aris takes a breath to shout the order and run, a mortar shell explodes terrifyingly close – *not* hitting her, but showering her with debris and momentarily deafening her. Instead of acting, she freezes. Not just hesitates, but experiences a complete, visceral shutdown. Her limbs lock, her mind blanks except for an overwhelming, paralyzing sense of absolute vulnerability and the certainty of imminent, meaningless death. The moment passes; the opportunity is lost. Civilians and squad members die in the subsequent collapse she failed to prevent.

  *What's True Beneath the Surface (Finkishness):*
  1.  **Pre-Trigger Courage Existed:** Aris genuinely possessed robust courage *before* the exact moment of decision. Her history wasn't a facade. She *was* disposed to face danger.
  2.  **Trigger Causes Instantaneous Destruction:** The proximate mortar explosion (the trigger stimulus for needing courage *now*) didn't just frighten her; it *caused* a specific, catastrophic neuropsychological event *at that instant*. This could be:
      *   An overwhelming, involuntary surge of neurochemicals (e.g., extreme cortisol/adrenaline dysregulation) that literally shuts down executive function and motor planning.
      *   A flashback to a *specific*, previously suppressed trauma (e.g., seeing her childhood home destroyed similarly) triggered by the *sound/impact*, instantly overwriting her present context and identity as "Captain the Courageous" with "Traumatized Child the Helpless".
      *   A sudden, catastrophic failure of a core psychological schema ("I am a protector") under the extreme stress, collapsing her sense of agency *precisely when she needed to enact it*.
  3.  **Disposition Gone at Trigger Time:** At the precise nanosecond when the triggering conditions were fully met (the need to run *now*), her courage *ceased to exist*. It wasn't overwhelmed; it was *annihilated* by the trigger itself. If you could magically pause time *just* as the decision point arrived, *before* the mortar's psychological impact registered, you'd find courage. A millisecond *after* the trigger fully registered, courage was gone. The simple conditional ("If danger X, then brave action Y") fails because the disposition required for Y vanished *because* X happened.

  **Example 2: Courage Masked (Disposition Blocked)**

  *The Situation:* Aris is infiltrating a heavily guarded compound to assassinate a tyrannical overseer known for torturing children. She's done similar ops before. She's in position, weapon ready, the target exposed. This is the moment for decisive, courageous action.

  *The Failure:* As she lines up the shot, she sees the overseer gently adjust the collar of a young child standing obliviously beside him – perhaps his own, perhaps a hostage. Aris doesn't freeze *entirely*; her finger tenses on the trigger. But she cannot pull it. A wave of nausea and profound, protective dread washes over her. She imagines the child's scream, the splatter of blood, the trauma inflicted *by her hand*. The moment stretches, her weapon wavers, and the opportunity vanishes as the overseer moves away with the child.

  *What's True Beneath the Surface (Masking):**
  1.  **Courage Persists:** Aris's disposition to courageous action in the face of danger *remains fully intact* throughout the event. It was triggered by the situation. She *wanted* to pull the trigger, felt the impulse to act.
  2.  **Active Interference Blocks Manifestation:** The sight of the child triggered a *simultaneous, stronger, opposing disposition* that actively prevented the courageous action from occurring. This mask could be:
      *   An overwhelming **protective instinct** specifically towards children (perhaps rooted in a past failure to protect a sibling, or a deep-seated maternal/paternal drive). This instinct generates paralyzing fear *for the child*, not for herself, directly countermanding the aggressive courage.
      *   A hyper-activated **moral prohibition** against harming innocents, especially children, that manifests as a visceral physical and mental block against the action *in this specific context*. Her courage to kill the tyrant is real, but her prohibition against harming the child is stronger *and actively suppresses the motor command*.
      *   A catastrophic **failure of compartmentalization.** Her courage relies on mentally separating the mission ("stop the tyrant") from its messy consequences. Seeing the child destroyed this mental wall, forcing the consequences ("kill this child's protector/father figure *in front of them*") into the foreground, which her courage isn't equipped to handle *in that specific, complex emotional context*.
  3.  **Disposition Present but Neutralized:** The courage was there, triggered, and "trying" to manifest (finger tensing). But the masking disposition (protection/morality) was *also* triggered simultaneously and exerted a stronger inhibitory force. The simple conditional ("If danger X, then brave action Y") fails because, *even though* X occurred *and* the disposition for Y was present, an additional factor Z (the child) activated a stronger disposition that *prevented* Y from occurring. Remove Z (if the child wasn't there), and Y (the shot) would have manifested.

  **Key Differences Summarized:**

  *   **Finkish Failure:** The trigger *kills* the courage instantly. Courage exists before, is destroyed *by* the trigger. Underlying cause: Sudden, catastrophic neuropsychological collapse or schema failure *caused by* the stimulus.
  *   **Masked Failure:** The courage *is* triggered and present, but *prevented* from acting by a *simultaneously triggered, stronger opposing force*. Underlying cause: Activation of a conflicting disposition (protection, morality) that overpowers the courage *in that specific complex situation*.

  **Narrative Impact:**
  *   **Finkishness** feels like a terrifying, internal betrayal – the very core of "who I am" disintegrating under pressure. Recovery might involve rebuilding that core or confronting the specific trauma/weakness exposed.
  *   **Masking** feels like being hijacked by another powerful part of oneself. Recovery involves integrating these conflicting aspects (e.g., finding a way to be courageous *that doesn't violate* the protective instinct, or managing compartmentalization) or recognizing a situational limit to the courage.

  Both scenarios avoid "hidden cowardice" by showing courage as a real, but contextually fragile or complex, trait – exactly as dispositions metaphysics suggests. The external failure is identical (inaction), but the internal mechanisms and implications for the character's identity and potential growth are profoundly different.
