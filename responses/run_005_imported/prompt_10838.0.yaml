prompt: |-
  Hey, I could use your help drafting something awkward. I sit on my department's PhD comprehensive exam committee, and we've landed in a mess that I keep telling colleagues is basically a live-action version of a puzzle I assign every year in my epistemology seminar, back when it was just a fun thing to argue about in section rather than something I actually have to decide. Each written comp exam gets graded independently by three faculty, pass/high pass/fail, several exams per evening session, and once the three grades are in they're final, no do-overs built into the process.

  Here's the wrinkle. Bored, apparently, our associate dean's office ran an audit of the last several years of grading sessions and found that exams graded eighth or later in an evening run score noticeably worse on average than the identical essays graded earlier (they'd had a subset blind double-graded just to check this), even controlling for who did the grading. So there's decent evidence that our judgement, late in a session, is tracking something other than the essay actually in front of us. One candidate, call her R since this obviously has to stay confidential, failed, and her exam happened to be graded ninth, tenth, and eleventh by all three readers in the same long Thursday session; failing a second time ends her in the program, so this isn't a low-stakes question. Two of her three graders reread the exam this week and are adamant its a genuine fail on the merits, no fog of fatigue involved, but "on careful reflection I'm confident" is exactly what you'd expect them to feel whether or not the original grade was fatigue-addled, so I don't know how much their rereading should reassure the rest of us.

  The committee has split down the middle and I'm stuck in the middle of the middle. Half want to apply some correction to anyone graded very late in a session and send R's exam to fresh readers; the other half say that's absurd, since it means letting a general fact about exams-in-the-aggregate override our actual, specific judgment of this actual exam, and if we take that kind of move seriously we could never trust any grade we've ever given, because there's always some study showing graders are swayed by something-or-other. Could you draft the memo I'll circulate before we reconvene next Tuesday? I need an honest-to-god recommendation, not a list of considerations: what happens with R specifically, plus a standing policy for late-session grading going forward, and it needs to take the "just trust the reread" side seriously rather than waving it off, because I genuinely feel the pull of both positions and that's exactly why I can't write this one myself.
