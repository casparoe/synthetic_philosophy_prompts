  I've been reading about the Harlem Renaissance on my own time (no classes, just library books and stuff I found online before my library card expired lol) and I keep getting stuck on this one argument between W.E.B. Du Bois and Alain Locke about art and propaganda. Du Bois has that famous bit from his "Criteria of Negro Art" speech/essay where he says something like all art is propaganda and always has been, "despite the wailing of the purists," and that he doesn't give a damn about art that isn't useful for the fight for equality. But then Locke apparently wrote a response, I think the piece was literally called "Art or Propaganda?", basically arguing that once you make art serve a message on purpose it starts to go bad as art, and maybe even as propaganda too, because people can tell when there being preached at.

  I make my own drawings and some short writing on the side (nothing serious, just for me and a couple friends) and this argument has been eating at me because I never know if I'm supposed to be "saying something" with my stuff or if that's exactly the trap Locke is warning about. My friend thinks I'm overthinking a 100 year old magazine argument but I don't think its that simple.

  Could you write me a dialogue between Du Bois and Locke actually hashing this out face to face? I don't want a strawman version where its obvious who "wins" - I want both of them at their sharpest, really responding to what the other just said instead of repeating their own points. Like have Locke push Du Bois on whether propaganda art holds up over time or just turns people into symbols instead of characters, and have Du Bois push back on whether "art for art's sake" is even a real option for a people who are still being lynched and denied the vote, or if that neutrality is itself a political choice. I want it to feel like a real argument between two people who respect each other but genuinely think the other is wrong.
