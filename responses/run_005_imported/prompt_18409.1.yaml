answer: |-
  You're hitting on a fundamental and important point! Your intuition is partially correct: **a pure strategy that isn't strictly dominated by *any other pure strategy* can still be strictly dominated by a *mixed strategy*.** Crucially, this *does* change the outcome of iterated elimination and the set of rationalizable strategies. Ignoring mixed strategies leads to incorrect results.

  **Why Mixed Strategy Domination Matters:**

  1.  **Best Responses & Rationalizability:** Your statement "it could be a best response to some belief" is key. A strategy survives iterated elimination of strictly dominated strategies (IESDS) *if and only if* it is rationalizable, meaning there *exists* some belief (probability distribution) over the opponent's strategies for which this strategy is a best response.
  2.  **The Flaw in "Pure Only" Checking:** Just because no *single* pure strategy dominates strategy S, doesn't mean there isn't a *mixture* of other pure strategies that *always* gives a strictly higher payoff than S, *no matter what the opponent does*. If such a mixture exists, then S can **never** be a best response to *any* belief about the opponent. Why?
      *   For any belief you hold about the opponent, playing the dominating mixed strategy would yield a higher expected payoff than playing S.
      *   Therefore, S is irrational and should be eliminated.

  **The Minimal Example:**

  Consider this simple 2-player game. Player 1 chooses the row (A, B, C). Player 2 chooses the column (X, Y). Payoffs are for Player 1 only (Player 2's payoffs are irrelevant for this dominance check).

  | Player 1 \ Player 2 | **X** | **Y** |
  | :------------------ | :---- | :---- |
  | **A**               | 0     | 3     |
  | **B**               | 3     | 0     |
  | **C**               | 1     | 1     |

  **Step 1: Check if any pure strategy dominates C.**
  *   **C vs A:**
      *   If Player 2 plays X: C gets 1, A gets 0 → 1 > 0 → C better.
      *   If Player 2 plays Y: C gets 1, A gets 3 → 1 < 3 → A better.
      *   **Result:** A does NOT dominate C (C isn't always worse).
  *   **C vs B:**
      *   If Player 2 plays X: C gets 1, B gets 3 → 1 < 3 → B better.
      *   If Player 2 plays Y: C gets 1, B gets 0 → 1 > 0 → C better.
      *   **Result:** B does NOT dominate C (C isn't always worse).
  *   **Conclusion (Pure-Only Check):** No pure strategy dominates C. If we *only* check pure strategies, C survives the first round.

  **Step 2: Check if C is dominated by a MIXED strategy of A and B.**
  *   Consider a mixed strategy M where Player 1 plays A with probability 1/2 and B with probability 1/2 (p = 0.5).
  *   Calculate M's expected payoff against Player 2's strategies:
      *   **Against X:** (Payoff of A vs X * Prob A) + (Payoff of B vs X * Prob B) = (0 * 0.5) + (3 * 0.5) = 1.5
      *   **Against Y:** (Payoff of A vs Y * Prob A) + (Payoff of B vs Y * Prob B) = (3 * 0.5) + (0 * 0.5) = 1.5
  *   **Compare M to C:**
      *   If Player 2 plays X: M gets 1.5, C gets 1 → 1.5 > 1 → M better.
      *   If Player 2 plays Y: M gets 1.5, C gets 1 → 1.5 > 1 → M better.
  *   **Result:** The mixed strategy M (0.5A, 0.5B) yields a strictly higher payoff than C *regardless* of whether Player 2 plays X or Y. **C is strictly dominated by the mixed strategy M.**

  **Why Elimination Matters & Best Response Analysis:**

  *   **IESDS (Correct with Mixed):** C is strictly dominated by M and is eliminated first. The reduced game involves only A and B.
  *   **Pure-Only IESDS (Incorrect):** C survives incorrectly.
  *   **Best Response Analysis (Shows C is Irrational):** Can C *ever* be a best response for Player 1?
      *   Suppose Player 1 believes Player 2 plays X with probability `q` and Y with probability `1-q`.
      *   Expected Payoffs:
          *   A: (0 * q) + (3 * (1-q)) = 3 - 3q
          *   B: (3 * q) + (0 * (1-q)) = 3q
          *   C: (1 * q) + (1 * (1-q)) = 1
      *   For C to be a best response, we need its payoff (1) to be at least as good as A's payoff AND at least as good as B's payoff:
          1.  1 >= 3 - 3q  → 3q >= 2 → q >= 2/3
          2.  1 >= 3q → q <= 1/3
      *   **Contradiction:** There is **no** value of `q` (belief) that satisfies both `q >= 2/3` and `q <= 1/3` simultaneously. C is **never** a best response to any belief Player 1 could hold about Player 2.

  **Conclusion & Why Profs "Pad":**

  You are absolutely right that if a pure strategy isn't dominated by any other pure strategy, it *might* still be rationalizable. **However, the *only* way to confirm it's *not* rationalizable is to check if it's dominated by a mixed strategy.** In the example above:

  1.  **Pure-Only Check (Wrong):** C survives elimination. We think it *might* be playable.
  2.  **Mixed Check (Correct):** C is eliminated because it's strictly dominated by M (0.5A, 0.5B).
  3.  **Best Response (Confirms):** C is provably never a best response to any belief. It's irrational.

  Profs aren't just padding problem sets. Skipping mixed strategy dominance checks gives **incorrect results** by leaving in strategies (like C) that can never be rationally played. IESDS is only guaranteed to find all rationalizable strategies *if* mixed strategy dominance is considered. The example shows a minimal case where checking only pure strategies gives a different (and wrong) answer by failing to eliminate a strictly dominated strategy. Always check for mixed strategy dominance!
