answer: |-
  Here is a detailed comparison of Quine's indeterminacy of translation and the underdetermination of theory by evidence, designed as a handout for your seminar. It addresses the core disagreement, clarifies the distinction (including the crucial "no fact of the matter" claim), and anticipates potential objections.

  ---

  **Handout: Quine's Indeterminacy of Translation vs. Underdetermination of Theory**

  **Core Theses Defined:**

  1.  **Underdetermination of Theory by Evidence (UTE):**
      *   **Definition:** Any finite body of empirical evidence is logically compatible with multiple, mutually incompatible scientific theories about the world.
      *   **Source:** Confirmation holism (from "Two Dogmas") and the Duhem-Quine Thesis (empirical tests confront whole theories, not individual sentences).
      *   **Epistemological Status:** An *epistemological* thesis. It concerns the limitations of *our knowledge* and *evidential justification*. We cannot, even in principle, use sensory evidence alone to uniquely determine which of several empirically equivalent theories is *true*.
      *   **Scope:** Applies universally to all scientific theories about the physical world (physics, chemistry, biology, etc.).
      *   **"Fact of the Matter":** **Compatible with a fact of the matter.** UTE asserts that *we cannot know* which theory is uniquely true based on evidence. However, it assumes an *independent physical reality* that one theory (or its ontological commitments) might correctly describe, even if we can't definitively pick it out. The world *is* some specific way.
      *   **Analogy:** Two different maps (theories) of the same territory (reality) might be equally good at guiding you based on the landmarks you've seen (evidence), but the territory itself *has* a specific structure one map might get "righter" about (e.g., the precise location of an unseen mountain).

  2.  **Indeterminacy of Translation (IT):**
      *   **Definition:** For any language (especially a radically foreign one), there can be multiple, mutually incompatible translation manuals that are equally compatible with *all possible behavioral evidence* concerning speakers' dispositions to assent/dissent to sentences under all possible stimulations. These manuals may assign radically different meanings (e.g., "rabbit" vs. "undetached rabbit part" for 'gavagai') or logical structures to the same native sentence.
      *   **Source:** *Word and Object* (especially the "gavagai" thought experiment), grounded in Quine's behaviorism and rejection of meaning as a determinate mental entity.
      *   **Epistemological & Ontological Status:** Primarily an *ontological* thesis about the *non-existence* of determinate meanings. It's not just that we *can't know* the correct translation; it's that *there is nothing to know* beyond the behavioral patterns. Meaning is exhausted by observable use.
      *   **Scope:** Applies specifically to the domain of *meaning, synonymy, and reference*.
      *   **"Fact of the Matter":** **Denies a fact of the matter.** Quine explicitly states there is **no fact of the matter** about which manual is correct. The manuals aren't just descriptions of some underlying meaning reality we can't access; they *constitute* different meaning realities, and there is no independent standard (beyond behavioral dispositions) to adjudicate between them. Meaning isn't "out there" to be discovered correctly or incorrectly in that sense.
      *   **Analogy:** Imagine two different sets of instructions (manuals) for interpreting the blinking lights of a completely alien machine. Both sets allow you to perfectly predict the machine's light outputs in response to any input you give it. IT claims there is *no sense* in asking which set of instructions *truly* captures what the lights "mean" inside the machine, *because meaning just is the input-output pattern*. The different instructions don't *describe* a hidden meaning; they *define* different meanings equally well.

  **Key Differences: Why IT is Stronger & Distinct from UTE:**

  1.  **Nature of the Claim:**
      *   **UTE:** Epistemological Limitation (We can't know which physical theory is uniquely true).
      *   **IT:** Ontological Claim (There is no unique meaning/reference to be known or unknown).

  2.  **Commitment to an Independent Reality:**
      *   **UTE:** **Presupposes** an independent physical reality that theories attempt (with varying success) to describe. The indeterminacy lies in *our access* to that reality via evidence.
      *   **IT:** **Denies** an independent realm of meanings, propositions, or determinate references existing beyond observable linguistic behavior. The "meaning facts" *are constituted by* the behavioral patterns described by the manuals.

  3.  **The Role of "No Fact of the Matter":**
      *   **UTE:** Incompatible with "no fact of the matter" *for the physical world*. Even if two theories T1 and T2 are empirically equivalent, Quine holds that the world *is* one specific physical way. T1 might be true and T2 false (or vice versa), or perhaps neither captures the *full* truth, but *something* physical is the case. We just can't know which theory describes it best based on current evidence. Future evidence *could* break the equivalence.
      *   **IT:** Requires "no fact of the matter" *for meaning*. The different manuals don't disagree about the physical facts (stimulations, behaviors); they disagree about *what the native means*. Quine argues this disagreement is *empty* because meaning *just is* the pattern captured equally well by both manuals. There is no further "meaning fact" for them to be right or wrong about. Future behavioral evidence *cannot* break the equivalence by definition, as both manuals fit *all possible* behavioral evidence.

  4.  **Quine's Own Distinction:** Quine explicitly contrasted the two:
      *   In UTE, "we are after the truth of nature." (*Pursuit of Truth*)
      *   In IT, "there is no such truth." (*Word and Object*, Ch. 2). He called IT "additional" and "more radical" (*Ontological Relativity*), stressing it arises not *just* from UTE but from the *lack of a reality* for meanings to latch onto independently of behavior.

  **Addressing Student Arguments & Objections:**

  *   **"IT is just UTE applied to linguistics":** This overlooks the ontological leap. UTE applied to a *linguistic theory* (e.g., a theory about brain states or social practices underlying language) *would* be like standard UTE – there could be multiple theories about the physical/social basis of language, compatible with evidence, but presumably only one is physically true. IT is a thesis *about meaning itself*, claiming there is no determinate meaning *for any such linguistic theory to be uniquely true about*. Meaning isn't a physical fact waiting to be described; it's a construct based on behavior.
  *   **Chomsky's Objection (Triviality):** Chomsky argued IT reduces to trivial UTE if linguistics is a science. Quine's response hinges on the *subject matter*. Physics has a determinate subject (physical world); meaning does not. UTE says we can't pick the uniquely true physical theory; IT says there *is* no uniquely true meaning assignment. Chomsky conflates a theory *of* language (which *could* be underdetermined physically) with the indeterminacy *of meaning itself*.
  *   **Putnam's Objection (Permutation Argument):** Putnam showed reference is radically indeterminate *even within our own language* (the "model-theoretic argument"). Quine largely *accepted* this for reference ("inscrutability of reference"), seeing it as reinforcing IT. The key distinction remains: UTE applies to theories about the world; Putnam/Quine's referential indeterminacy and IT apply to the semantic level, denying determinate facts *at that level*. Putnam aimed to show this makes realism untenable, while Quine embraced it within his naturalism/behaviorism.
  *   **"But translation manuals *are* theories!":** True, manuals *are* theories. However:
      *   UTE applies to manuals *qua* empirical hypotheses about physical/social phenomena (brain states, conventions). This *would* admit a fact of the matter (which physical/social state obtains?).
      *   IT applies to manuals *qua* assignments of *meaning*. It claims that *at the level of meaning*, there is no fact of the matter distinguishing empirically equivalent manuals. The physical facts (behavior) are fixed; the meaning facts are not.

  **Why the Distinction Matters:**

  Conflating IT with UTE dilutes Quine's radical challenge. IT isn't just about the difficulty of translation; it's a fundamental rejection of meaning as a determinate entity or property. It attacks the very idea that sentences express unique propositions or that words refer determinately, based on Quine's behaviorist ontology. Understanding the "no fact of the matter" claim as unique to the semantic domain is crucial to grasping the depth of Quine's critique of traditional semantics and mentalism.

  **Conclusion:**

  While both UTE and IT stem from Quine's holism and empiricism, **indeterminacy of translation is distinct from, and stronger than, the underdetermination of theory by evidence:**

  1.  **UTE** is epistemological: Multiple physical theories fit the evidence; we can't know which is uniquely true, but the physical world *is* some way.
  2.  **IT** is ontological: Multiple meaning assignments fit *all possible* behavioral evidence; there is *no fact of the matter* about which is correct because meaning is exhaustively defined by behavioral dispositions. There is no independent realm of meaning for the manuals to be uniquely true about.

  The crucial marker is Quine's explicit invocation of **"no fact of the matter" specifically for meaning and translation**, a claim he did not, and arguably *could not*, coherently make for empirically equivalent physical theories describing an independent reality.

  --- 

  **For Your Seminar:** Encourage students to test this distinction against specific passages in *Word and Object* (especially sections discussing "fact of the matter" and the analogy/homology between physics and translation) and Quine's later defenses against critics (e.g., in *Ontological Relativity* and *Pursuit of Truth*). Focus the discussion on whether the ontological claim about meaning's non-existence is necessary to generate IT, or if UTE applied to behaviorally-defined meaning is sufficient (Quine says no; the handout explains why).
