prompt: |-
  I'm about halfway into a novel -- a slow-burn legal thriller -- where a big chunk of the plot turns on a civil trial after a warehouse fire. Setup: the night watchman was contracted to walk the floor every forty minutes, and on the night in question he dozed off around 1am and missed his next two rounds. By the time anyone noticed the fire, it had already outrun what the sprinklers could handle. I had a couple of friends over on Sunday to poke holes in the plot before I write the trial scene, and it turned into a real arguement about the philosophy underneath the case that I still can't shake.

  (1) My friend Elena, who's ABD in philosophy, said it's obvious the watchman's skipping his rounds was a cause of how bad the fire got: if he'd checked on schedule he'd have caught it early, the extra spread counterfactually depended on him not checking, and that's basically all "causation by omission" means. (2) My friend Marcus, who adjusts insurance claims for a living, said that test proves way too much, because it's equally true of every other person on earth who also didn't wander into that warehouse and notice the fire that, had they done so, it would've been caught sooner -- so by Elena's logic they're all equal "causes" too, which is absurd. (3) Elena said that's not a fair parallel, because the watchman actually had a job to do the check and none of those other people did, so his omission is the one that's causally singled out, not just morally singled out. (4) Marcus said that's the sleight of hand right there: the fire spreading doesn't consult anyone's employment contract, so the second you need his job description to explain why his non-check "counts" and everyone else's doesn't, you've quietly swapped "what caused this" for "who do we blame," and dressed the second question up as an answer to the first.

  Neither of them gave an inch, and I caught myself agreeing with each of them in turn while I just sat there refilling glasses. Could you referee this properly -- move by move, not just an overall winner? Give me a JSON block first, {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, scoring each move from -2 (clearly wrong) to 2 (clearly right), then a bit of explanation for each score, and finally tell me if there's a consideration neither of them raised that the whole disagreement actually turns on.
reasoning: |-
  Okay, the user is writing a legal thriller and is stuck on a philosophical debate about causation in a civil trial scenario. Two friends, Elena (philosophy background) and Marcus (insurance adjuster), have opposing views on whether the watchman's omission caused the fire damage. The user wants me to referee their arguments step by step.

  First, I need to understand the core issue. The warehouse fire got worse because the watchman skipped rounds. Elena argues this is clear "causation by omission" since he had a duty to check. Marcus counters that this makes everyone who didn't check equally responsible, which is absurd, and that Elena is confusing causation with blame.

  Let me break this down legally and philosophically. In tort law, causation requires both factual cause ("but-for" cause) and proximate cause (legal responsibility). Elena is correct about factual cause - but for the watchman skipping his round, the fire would have been caught earlier. But Marcus rightly points out that but-for causation alone is too broad - it could implicate anyone who didn't prevent the fire.

  Where it gets interesting is Elena's point about the job duty. This brings in proximate cause - the law limits liability to those with a duty. Marcus calls this a "sleight of hand," but actually, duty is a legitimate legal filter, not a confusion of concepts. However, he's correct that causation and duty are distinct elements.

  Neither mentioned the key distinction between factual cause and proximate cause. Factual cause is broad (any necessary condition), while proximate cause narrows it down to foreseeable, responsible parties. The watchman's duty makes him the proximate cause, not just a factual cause.

  For scoring:
  - Elena's point 1 gets +1 - correct on factual cause but misses the duty aspect
  - Marcus's point 2 gets +2 - perfectly exposes the overbreadth problem
  - Elena's point 3 gets +1 - identifies duty but overstates it as "causal"
  - Marcus's point 4 gets -1 - correctly spots the duty introduction but wrongly calls it sleight of hand

  The missing consideration is the two-step causation analysis in law. Factual cause asks "did this make a difference?" Proximate cause asks "should we hold this person responsible?" The watchman fails both tests - his omission factually allowed the fire to spread, and his duty makes him proximately responsible.

  This distinction resolves the debate. Elena wins on factual cause, Marcus wins on showing why duty matters, but both miss the legal framework that synthesizes their points. For the novel, this means the trial should establish: 1) but-for causation from the missed check, and 2) proximate cause via the contractual duty. The defense might argue superseding causes, but that's another layer.
answer: |-
  Here's the breakdown of the philosophical/legal dispute, scored move-by-move, followed by the key missing consideration:

  ```json
  {
    "1": 1,
    "2": 2,
    "3": 0,
    "4": -1
  }
  ```

  ### Move-by-Move Analysis

  1.  **Elena (Point 1):** **Score: +1**  
      *"Skipping rounds was a cause via causation by omission (counterfactual dependence)."*  
      **Why:** She's **correct on factual (but-for) causation**. The missed check *was* a necessary condition for the worsened damage (but for his omission, the fire likely would've been caught earlier). Her description of omission-based causation is philosophically sound for *factual cause*. However, she oversimplifies by implying this *alone* settles legal responsibility.

  2.  **Marcus (Point 2):** **Score: +2**  
      *"Elena's test proves too much (every non-checker is equally a 'cause')."*  
      **Why:** This is **spot-on**. He correctly identifies the core weakness of relying *solely* on but-for causation: it leads to absurdly overbroad liability (the "causation is cheap" problem). His reductio ad absurdum ("every person on earth") effectively exposes why legal systems *must* go beyond pure counterfactual dependence to assign responsibility. This is a fundamental critique in causation theory and tort law.

  3.  **Elena (Point 3):** **Score: 0**  
      *"The watchman's *job* singles out his omission causally, not just morally."*  
      **Why:** **Mixed**. She's right that the job/duty is *crucial*, but **wrong to claim it makes the omission *causally* special in a *physical* sense.** The fire spread physically depended on *someone* not spotting it early, regardless of job descriptions. The job defines a *duty*, which is a *legal/moral* filter applied *after* establishing factual cause. She conflates the *source* of the duty (the job) with the *nature* of causation itself. The duty makes him *responsible* for the omission being *causative*, not the omission itself more physically causative.

  4.  **Marcus (Point 4):** **Score: -1**  
      *"Invoking the job description swaps causation for blame (sleight of hand)."*  
      **Why:** **Partially right but misses the nuance.** He's **correct** that introducing the job *is* shifting the analysis from pure *factual causation* (which is broad) to *responsibility/liability*. However, he's **wrong** to call this a "sleight of hand" implying deception or fallacy. It's not a trick; it's a **necessary and legitimate step** in legal reasoning. The law *explicitly* uses concepts like duty and proximate cause *to bridge the gap* between factual cause and legal liability precisely to *avoid* the absurdity he pointed out. He mistakes a core feature of tort law for a fallacy.

  ### The Missing Consideration: The Two-Stage Structure of Causation in Law

  The **core disagreement hinges on Elena and Marcus talking past each other about different stages of causation analysis**, a structure fundamental to tort law but overlooked in their argument:

  1.  **Factual Causation (Cause-in-Fact / But-For Causation):** Did the defendant's act/omission make a difference? *This is where counterfactuals rule.*
      *   **Elena wins here (Point 1):** The watchman's omission *was* a but-for cause of the increased damage. *But Marcus is right (Point 2) that this is too broad alone.*
  2.  **Proximate (Legal) Causation:** Even if the defendant was a factual cause, *should* the law hold them responsible for *this specific harm*? This considers foreseeability, directness, duty, and policy. **Duty is a *prerequisite* for proximate cause analysis of omissions.**
      *   **This is the stage Marcus misidentifies as "blame" (Point 4).** It's not *just* blame; it's a legal determination of the *scope* of responsibility based on the relationship between the parties and the risk.
      *   **This is where Elena's job argument (Point 3) *belongs*, but she misapplies it to factual cause.** The watchman's contractual duty *creates the legal obligation* that makes his specific omission relevant for proximate cause. It answers *why* we hold *him* responsible for *this* omission out of the infinite possible omissions Marcus mentioned. His duty defines the risk he was employed to prevent.

  ### The Verdict & Why It Matters for Your Novel

  *   **Factual Cause:** Marcus successfully showed (Point 2) that but-for causation alone is insufficient for liability. Elena correctly identified it (Point 1) but overstated its sufficiency.
  *   **Proximate Cause/Duty:** This is the crux. The watchman's **duty (arising from his job contract)** is not a "sleight of hand" (Marcus Point 4) but the **legally essential factor** that transforms his factual omission into the *legally relevant cause*. Elena sensed this (Point 3) but incorrectly framed it as making his omission *more causal* in a physical sense, rather than making him *legally responsible* for the consequences of that omission.

  **For Your Trial Scene:** The plaintiff must establish **BOTH**:
  1.  **But-For Causation:** If the watchman had made his rounds as required, the fire would likely have been discovered early enough for the sprinklers to contain it (or minimize damage significantly). Expert testimony on fire spread timing is key.
  2.  **Proximate Cause via Duty/Breach:** The defendant (watchman/security company) had a **duty of care** arising from the contract *specifically to perform these rounds to detect fires*. The breach (sleeping) was directly contrary to the purpose of the duty. The harm (unchecked fire spread) was the *exact type of risk* the duty was meant to prevent, making it foreseeable.

  Marcus's "every person on earth" argument is a classic defense tactic against broad but-for causation, but it fails because the law *only* imposes liability for omissions based on a pre-existing duty. The trial will turn on proving the breach of that *specific duty* was a but-for cause of the *increased damage*. The defense will likely attack the certainty of the counterfactual ("How do you *know* he would have seen it?") or argue superseding causes. The philosophical tension your friends exposed is real – the law *does* use duty to limit liability from the universe of factual causes – and that tension is great fodder for courtroom drama.
