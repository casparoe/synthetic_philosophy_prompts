  **Grading Notes:**  
  - **Why not 20/20?** Small factual errors (Scott exclusivity, afterlife certainty) and one interpretive stretch (direct Gibbs → ontological proof linkage) prevent full marks.  
  - **Why not lower?** The core philosophical continuity is correctly identified and well-argued, exceeding basic "proper noun dropping."  
  - **Defensibility:** In office hours, point to:  
    - Gödel’s afterlife letter: "The *simplicity* and *indestructibility* of the soul" (not just "not a machine") is key.  
    - Ontological proof history: Gödel discussed it with Morgenstern in 1941, years before Scott.  
