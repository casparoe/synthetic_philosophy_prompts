  I'm outlining my IB Extended Essay on Wittgenstein, and I want to make sure I've got the private language argument right before I build my whole analysis around it. As I read the "beetle in the box" passage, Wittgenstein is showing that because sensations like pain are private, I can never actually verify that what I call "pain" resembles what you experience when you use that word, which seems to prove that each of us is sealed inside an incommunicable inner world and can never confirm we mean the same thing by our sensation-words. Is this basically Wittgenstein's way of arguing for a kind of solipsism about meaning, and if so, how do philosophers who accept the argument explain why everyday communication about feelings still seems to work just fine?
