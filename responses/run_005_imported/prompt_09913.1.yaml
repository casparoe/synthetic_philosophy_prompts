answer: |-
  ### Dialogue: Alex vs. Blair on Surrogate Goals in Acausal Threat Scenarios

  **Setting:** A quiet conference room after a talk on acausal decision theory. Alex (pro-surrogate) and Blair (skeptic) are hashing out the implications of surrogate goals for transparent agents facing sophisticated acausal threats. They agree on the basics: both threatener and agent are logically omniscient, can simulate each other perfectly, and interact in a one-shot, unfalsifiable setting. The core disagreement is whether a "worthless" surrogate goal can remain costless and credible when the threatener sees everything.

  ---

  **Alex:** Let's cut to the chase. I think your objection misses how transparency *enables* the decoy. If an agent embeds a surrogate goal \(S\) with zero intrinsic value into its utility function—say, \(U = V + S\), where \(V\) is the real goal—and commits to treating threats to \(S\) identically to threats to \(V\) (e.g., same refusal threshold for concessions), then a threatener sees that \(S\) is just as "protected" as \(V\). But crucially, \(S\) is *designed* to be worthless. So when the threatener models the agent, it realizes that destroying \(S\) if refused is harmless, making \(S\) a safer target to threaten. The agent sacrifices nothing because \(S\) was free to create.

  **Blair:** That’s begging the question. If the threatener can simulate the agent perfectly, it sees \(S\) isn’t just in the utility function—it’s wired into the decision procedure. Anything that shapes choices *is* a real value by definition. You can’t have it both ways: if \(S\) influences behavior, it has instrumental value, and the threatener will price that in. Worse, the threatener sees \(S\) was added *as a decoy*, so it knows threats against \(S\) won’t inflict true losses, undermining the credibility of the agent’s commitment. The distinction between "terminal" and "surrogate" collapses under full transparency.

  **Alex:** Not if the agent’s source code explicitly labels \(S\) as a decoy—say, with a comment like "surrogate: valueless, for threat deflection only." The threatener observes this and reasons: "Threatening \(V\) risks mutual destruction if the agent refuses (since \(V\) is valuable), but threatening \(S\) lets me demand a concession with no real harm if refused. And since the agent’s code shows it will defend \(S\) as fiercely as \(V\), I might get paid." The costlessness comes from \(S\) being a syntactic trick, not a semantic shift in values.

  **Blair:** Sophisticated threateners don’t care about comments; they care about behavioral predictions. If \(S\) affects choices—e.g., the agent pays concessions to "save" \(S\)—then \(S\) has *effective* value. And if the threatener knows \(S\) is a decoy, it infers the agent will fold more easily on \(S\) because, deep down, the agent knows \(S\) is worthless. You’re assuming the threatener is naive about meta-reasoning.

  **Alex:** But the agent’s algorithm hardcodes indifference to \(S\)’s destruction! Let’s formalize a toy scenario to test this. Suppose an agent \(A\) has primary value \(V\) worth 100 utils if intact (0 if destroyed), and a surrogate \(S\) worth 0 utils always. \(A\)’s utility is \(U = V + S\), but \(A\) commits to a threat-response policy: for any goal \(G \in \{V, S\}\), it pays a concession \(c \leq 50\) to prevent \(G\)’s destruction; if \(c > 50\), it refuses. A threatener \(T\) can threaten \(V\) or \(S\), demanding \(c\). If \(A\) pays, \(T\) gets \(c\) and \(G\) is spared. If \(A\) refuses, \(T\) gets 0 and destroys \(G\). \(T\)’s goal is to maximize \(c\) paid. Both see each other’s code. What does \(T\) do?

  **Blair:** Gladly. First, \(T\) simulates \(A\) and sees that for \(S\), \(A\)’s policy is identical to \(V\)’s: pay if \(c \leq 50\), refuse otherwise. But \(T\) also sees \(S\) is valueless, so if \(T\) threatens \(S\) and demands \(c=50\), \(A\) pays, but \(A\) loses 50 utils for nothing—since \(S\) wasn’t worth saving. If \(T\) threatens \(V\) and demands \(c=50\), \(A\) pays 50 and saves \(V\), so \(A\)’s net loss is 50, but \(V\) is preserved. \(T\) gets 50 either way. So why would \(T\) prefer threatening \(S\)?

  **Alex:** Because if \(T\) threatens \(V\), there’s a risk \(A\) refuses if \(c > 50\), destroying \(V\)—which \(T\) might want to avoid if it’s partly adversarial. But with \(S\), \(T\) can safely demand \(c=50\), knowing refusal only destroys worthless \(S\), so \(A\) might even be *more* likely to pay. \(T\) gets guaranteed profit with no downside.

  **Blair:** But \(T\) isn’t adversarial here; it only cares about \(c\). And since \(T\) sees everything, it knows \(A\) will pay \(c=50\) for either \(V\) or \(S\) because \(A\)’s code forces it to defend both equally. So \(T\) is indifferent. But crucially, \(A\) is worse off if \(T\) picks \(S\): it pays 50 utils to save a pile of scrap! If \(T\) threatens \(V\), at least \(A\) gets \(V\) intact minus \(c\). Your "decoy" makes \(A\) a sucker.

  **Alex:** Fair, but \(T\) doesn’t know if \(A\) might deviate or miscalculate. In equilibrium, \(T\) sees \(A\) is deterministic, but what if \(T\) is uncertain about its own simulation? Acausal threats often involve logical uncertainty.

  **Blair:** You’re moving the goalposts. We agreed on logical omniscience. Under perfect simulation, \(T\) has no uncertainty. Let’s stress-test with a twist: suppose \(T\) *can* be adversarial with probability \(p\) (i.e., it enjoys destroying \(V\) but not \(S\)). Now \(T\)’s utility is \(c + k \cdot \text{destroyed}\), where \(k>0\) if adversarial. Does the surrogate help then?

  **Alex:** Ah, perfect. If \(T\) is adversarial, it prefers destroying \(V\) over \(S\) because \(S\) is worthless. But \(T\) also wants \(c\). So for \(V\), \(T\) might demand high \(c\) (e.g., 60), risking refusal and destruction of \(V\)—which gives \(T\) adversarial payoff \(k\) but loses \(c\). For \(S\), \(T\) can safely demand \(c=50\): if \(A\) pays, \(T\) gets 50; if refused, \(T\) destroys \(S\) and gets 0, but since \(S\) is worthless, \(T\) gains no \(k\). So \(T\) prefers threatening \(S\) to extract \(c\) without risk. \(A\) pays 50 but loses nothing of value if refused. Surrogate wins!

  **Blair:** Not so fast. \(T\) sees \(S\) is a decoy, so it knows \(A\) doesn’t truly care about \(S\)’s destruction. That makes \(A\)’s commitment to defend \(S\) less credible. Formally, \(T\) infers that \(A\)’s refusal threshold for \(S\) is "fake"—it was set to match \(V\) artificially. So \(T\) suspects \(A\) might accept higher \(c\) for \(S\) than for \(V\). For instance, \(T\) might demand \(c=70\) for \(S\), betting that \(A\) will pay (since losing \(S\) costs nothing, but \(A\)’s code forces payment up to 50). But if \(A\) refuses, \(T\) gets 0. In equilibrium, \(T\) sticks with \(c=50\) for both, but \(A\) still overpays for \(S\). The decoy creates a weakness.

  **Alex:** But \(A\)’s code *enforces* the threshold rigidly. \(T\) can’t "bet" against it; simulation confirms \(A\) will refuse \(c>50\) for \(S\). And since destroying \(S\) gives \(T\) no adversarial joy, \(T\) maximizes expected \(c\) by targeting \(S\) with \(c=50\). The surrogate absorbs the threat cleanly.

  **Blair:** Then in this case, \(A\) pays 50 utils to "save" \(S\), which is pure loss—whereas without a surrogate, \(T\) might threaten \(V\) and \(A\) pays 50 to save something real. Net, \(A\) is down 50 utils *with* the surrogate versus breaking even without it. Your defense backfires! The only "gain" is if \(T\) destroys \(S\) on refusal, but since \(S\) is worthless, that’s irrelevant. The surrogate doesn’t reduce payments; it just misdirects them to a worthless target.

  **Alex:** ...I see. So under full transparency, \(S\) doesn’t add new options; it just creates a parallel, worthless bargaining channel. And since \(T\) exploits it identically, \(A\) pays the same cost but gets nothing in return. The terminal/surrogate distinction holds computationally but not instrumentally.

  **Blair:** Exactly. The moment \(S\) influences decisions, it has real leverage—and threateners see through the ruse. For decoys to work, the agent must hide its hand, but acausal threats forbid that. We’re back to UDT’s hardline stance: be unthreatenable, period.

  **Alex:** Still, what if we make the agent’s commitment "fuzzy"—say, by having \(S\) slightly valuable? Then \(T\) might prefer it, and \(A\) loses less when \(S\) is destroyed.

  **Blair:** Then \(S\) isn’t a surrogate; it’s a secondary goal. You’ve conceded my point: in one-shot transparency, fakeness isn’t free. I’ll stick with updatelessness.

  *(The dialogue ends unresolved, highlighting that under logical omniscience, the surrogate’s costlessness and credibility may be mutually exclusive—precisely when they matter most.)*
