  Frederick Douglass's constitutional hermeneutics present a fascinating tension that resists easy categorization into modern camps. Based on his 1860 arguments and broader intellectual trajectory, here's a likely analysis of his position today and on *Shelby County*:

  1.  **Douglass's Interpretive Apparatus: A Principled Textualism, Not Strict Originalism:**
      *   **Text as Supreme:** Douglass unequivocally privileged the enacted *text* over any extrinsic evidence of subjective intent ("secret intentions"). This aligns strongly with the core tenet of textualism.
      *   **Ordinary Legal Rules:** His call for construing the text using "ordinary legal rules" suggests a focus on public meaning accessible through standard interpretive tools of the time, leaning towards original public meaning.
      *   **The Crucial Purposive Element - The Declaration as Key:** However, Douglass didn't stop at a narrow, atomistic reading of clauses. He insisted the text *must* be interpreted through the lens of the document's *declared purposes* in the Preamble (justice, liberty, general welfare) and, crucially, **anchored in the natural rights philosophy of the Declaration of Independence.** This is profoundly purposive.
      *   **Reconciliation:** For Douglass, the Declaration wasn't extrinsic; it was the *foundational context* giving the Constitution's text its *true meaning*. The text's silence on slavery, combined with its affirmations of liberty and due process, *when read through the Declaration's principles*, rendered it anti-slavery. The text was supreme, but its meaning was illuminated by the nation's foundational creed. This isn't "living" constitutionalism in the sense of evolving contemporary values, but it *is* a fixed, principled purposivism based on the Declaration.

  2.  **Where Would He Sit Today? A Hybrid Position:**
      *   **Closer to *Principled* Textualism, but Distinct:** He would likely be most sympathetic to **textualists who acknowledge the Constitution's foundational principles and purposes as inherent to its meaning**, rather than strict originalists who might focus solely on specific historical expectations or dictionary definitions divorced from the document's overarching goals. He would reject "secret intentions" originalism (original intent).
      *   **Critical of Pure Living Constitutionalism:** He would likely reject living constitutionalism based primarily on evolving societal norms or judicial perceptions of contemporary needs, as this could undermine the fixed, principled foundation he found in the text *as illuminated by the Declaration*. His framework was rooted in a specific, foundational philosophy, not fluid contemporary values.
      *   **Critical of Narrow Original Public Meaning (if divorced from principle):** He would criticize an original public meaning approach that, for example, focused solely on how 1787 audiences understood the 3/5 clause or fugitive slave clause *in practice*, ignoring the dissonance with the Preamble and Declaration. The *principles* constrained the interpretation of specific clauses.
      *   **Likely Position:** Douglass would probably advocate for a **textualism guided by the natural rights principles of the Declaration of Independence**, seeing those principles as the essential key to unlocking the Constitution's true, anti-slavery (and pro-liberty/equality) meaning. He might find resonance with scholars who emphasize the "Constitution of 1787 *as amended*" embodying a project of realizing the Declaration's ideals.

  3.  **Douglass on *Shelby County v. Holder* (2013):**
      Douglass would almost certainly view the *Shelby County* decision with profound dismay and condemn it as precisely the kind of extratextual reasoning he denounced, now weaponized against the Reconstruction Amendments he championed.
      *   **The Extratextual "Equal Sovereignty" Principle:** The Court's invention of the "equal sovereignty of the states" doctrine as a constraint on Congress's Fifteenth Amendment enforcement power (Section 2) has no explicit basis in the constitutional text. Douglass railed against importing unstated principles to undermine liberty. This would strike him as eerily similar to the "implied powers" arguments used to defend slavery (like the "positive good" theory or the *Dred Scott* reasoning), but now deployed against Black voting rights.
      *   **Betrayal of the Fifteenth Amendment's Purpose:** The Fifteenth Amendment (like the Thirteenth and Fourteenth) was enacted *specifically* to overcome state-sanctioned racial oppression, particularly in the South. Its enforcement clause (Section 2) was designed to give Congress broad, flexible power to combat *evolving* forms of racial discrimination in voting. *Shelby County*'s restriction of that power, based on an extratextual doctrine, directly contravenes the Amendment's core purpose – a purpose Douglass understood intimately and fought for. He would see it as judicial activism undermining the people's (and Congress's) ability to fulfill the Amendment's promise.
      *   **Ignoring Text and History:** The Fifteenth Amendment text grants Congress the power to enforce it "by appropriate legislation." The history is replete with evidence that this power was intended to be broad and proactive, especially given the immediate post-war context of Southern resistance. The "equal sovereignty" doctrine ignores this text and history, much like pro-slavery interpretations ignored the Preamble and Declaration. Douglass would argue the Court substituted its own policy preference (limiting federal oversight of states) for the clear constitutional text and the demonstrable historical need the Amendment addressed.
      *   **Hypocrisy & Danger:** He would likely see deep hypocrisy in a Court claiming textual fidelity while inventing a doctrine to cripple a textual guarantee of fundamental rights (voting), especially one secured through immense struggle and bloodshed. He would warn that this is the same type of reasoning that once protected slavery, now adapted to enable voter suppression.

  **Conclusion:**

  Douglass's constitutionalism was a unique blend: **textual fidelity strictly enforced, but text understood through the prism of the natural rights principles articulated in the Declaration of Independence.** This makes him neither a pure modern textualist/originalist nor a living constitutionalist. He would likely condemn *Shelby County v. Holder* as a prime example of the judicial sin he identified in 1860: importing unstated, extratextual principles to undermine the Constitution's guarantees of liberty and equality, particularly those hard-won in the Reconstruction Amendments. He would see it as a betrayal of the "Glorious Liberty Document" he fought to redeem, using the very interpretive tactics he exposed as tools of oppression. His critique would be scathing, rooted in both the text's silence on the invented "equal sovereignty" doctrine and the clear historical purpose of the Fifteenth Amendment's enforcement clause.
