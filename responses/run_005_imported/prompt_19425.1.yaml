  I should also consider the user's unspoken needs. As a grad student on the IRB, they might want to establish credibility, demonstrate nuanced thinking, and avoid alienating either side. The memo needs to be diplomatic but firm, using accessible language that bridges philosophy and IRB pragmatism. References to "acute physiological arousal" or "autonomic responses" can ground philosophical ideas in empirical terms the board understands.

