  ## MEMORANDUM

  **To:** Land Trust Advisory Board  
  **From:** [Your Name], Advisory Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommended Action for Elk Herd Winter Survival & Ethical Considerations  

  **1. Recommended Action for This Winter:**  
  I recommend **implementing limited, emergency supplemental feeding for the elk herd this winter**, under strict protocols to minimize disease risk and population distortion.  

  *   **Implementation:** Focus on distributing high-fiber, low-density feed (e.g., grass hay, specialized pellets) at widely spaced, temporary stations across the reserve's lower elevations. Rotate locations frequently based on staff monitoring. Feeding should commence immediately *before* the next major storm and continue only until sustained snowmelt allows natural foraging (estimated late March/April).  
  *   **Rationale:** The fence is an unambiguous human imposition preventing natural migration, transforming a cyclical environmental challenge into an acute, human-caused welfare crisis. While natural mortality occurs, a projected 15-20% loss concentrated in vulnerable individuals is directly attributable to our barrier. Our charter's mandate to "protect and preserve the reserve's wildlife" compels action to mitigate this specific, artificial harm. This is not managing nature, but rectifying a consequence of our own infrastructure.

  **2. Conditions for Changing this Recommendation:**  
  This recommendation is specific to the *current, exceptional circumstances*. It would change if:  
  *   **Disease Risk Becomes Immediate:** If Chronic Wasting Disease (CWD) or another high-morbidity pathogen is confirmed within the herd *before* feeding begins, the risk calculus shifts decisively against congregation.  
  *   **Lower Mortality Projection:** If updated ecological assessment shows significantly lower (<10%) projected mortality based on revised snowpack/forage models.  
  *   **Feasibility Failure:** If staff/resources prove insufficient to implement the dispersed, rotating feeding protocol effectively, negating the risk-mitigation strategy.  

  **3. Addressing Broader Obligations:**  
  **Feeding the elk this winter does *not* commit the Trust to a universal obligation to relieve wild animal suffering across the reserve.** A principled distinction exists:  

  *   **The Fence is the Key Differentiator:** This intervention addresses suffering *directly and foreseeably caused by a specific, permanent human action* (the boundary fence) that fundamentally altered the herd's ecology. It corrects a harm *we* inflicted by removing their adaptive strategy (migration). This is distinct from intervening in suffering arising from natural ecological processes (predation, disease not introduced by us, non-fence-related starvation in normal winters, insect parasitism).  
  *   **Scope of Charter Obligation:** Our charter compels us to address threats to wildlife *we create or significantly exacerbate* within the reserve. It does not mandate us to become universal stewards optimizing all wild animal welfare against natural processes. Acting here is consistent with "protect and preserve" because we are protecting wildlife from *our own* harmful alteration of their habitat.  
  *   **Avoiding the Slippery Slope:** This action is bounded by its direct link to the fence. Future interventions would require similar justification – a direct, significant, human-caused harm within our reserve that falls under our mandate. For example, we *would* have an obligation to mitigate suffering caused by invasive species we introduced, or habitat degradation directly resulting from our management practices. We *would not* have an obligation to cull predators to reduce predation or provide year-round medical care for naturally occurring diseases.  

  **4. Engaging the Strongest Counter-Argument:**  
  The strongest opposing position argues that feeding risks CWD spread, masks overpopulation, and creates unsustainable dependency, ultimately causing greater long-term harm – potentially violating the "preserve" mandate by disrupting ecological function and herd health. This is a serious, evidence-based concern.  

  *   **Honest Engagement:** Proponents of non-intervention rightly highlight significant risks. CWD is devastating, and dependency is a proven pitfall of poorly managed feeding. Concentrating elk *is* dangerous. Their argument that the fence necessitates a tough-love approach to force a population reset aligned with the constrained habitat has ecological merit. Accepting high mortality now *might* prevent larger catastrophes later.  
  *   **Why This Recommendation Nonetheless Prevails:** While valid, these risks can be actively managed *this winter* through the strict protocols proposed (dispersion, rotation, targeted feed, limited duration). Crucially, the ethical imperative to address the *immediate, fence-caused suffering* outweighs the *potential* future risks, which are not certain and are subject to management. The "tough-love" approach ignores the immediacy and severity of the preventable suffering *this winter* imposed by our fence. We have a direct responsibility to mitigate *this* harm; we can address population management through non-lethal means (e.g., future habitat modification, potential fertility control) *after* surviving this crisis. Choosing inaction now due to fears about future dependency feels like abandoning the current herd to rectify our past management error.  

  **Conclusion:**  
  I recommend limited, emergency feeding for *this winter only* as a necessary mitigation for suffering directly caused by our boundary fence. This action is ethically mandated by our charter given the specific human-caused harm. It is bounded by the fence's presence and does not establish a universal duty to intervene in natural suffering. We must implement feeding with rigorous protocols to mitigate disease and dependency risks, while committing to develop a long-term plan addressing the unsustainable population dynamics created by the fence, separate from emergency welfare interventions.
