prompt: |-
  I sit on the five-person steering committee of a roughly 150-member giving circle that grew out of my local effective altruism meetup. Each December, members submit ranked ballots over a shortlist of four or five cause areas (this year: AI safety, global health, farmed-animal welfare, and pandemic preparedness), and the tally decides how our pooled discretionary fund is split for the coming year. We've used instant-runoff voting since the circle's founding, mainly because it's what one of our founders happened to have read about, but this past December it produced a genuine embarrassment: pandemic preparedness picked up a late surge of first-preference support after a well-attended talk, and would have won outright under the previous count, but the extra ballots changed the order in which options were eliminated, and it lost instead. Enough of us have since read about Arrow's impossibility theorem -- mostly filtered through old LessWrong and EA Forum threads rather than Arrow's original 1951 book -- to recognize this as a structural feature rather than a fluke, and the committee is now split roughly down the middle. One faction wants to switch to a Condorcet-consistent method, such as ranked pairs or the Schulze method, or to approval voting; the other insists that since Arrow's theorem already proves no ranked system can simultaneously satisfy independence of irrelevant alternatives, the Pareto principle, and non-dictatorship, swapping methods just trades one arbitrary pathology for another, so we might as well keep instant-runoff, or even save ourselves the trouble and revert to plain plurality. A couple of the approval-voting advocates go further and claim they can dodge the theorem altogether, since approval and score voting take cardinal ratings rather than rankings as input; the other faction dismisses this as a rhetorical trick rather than a genuine escape.

  I need to circulate a short decision memo before our January meeting, at which the committee will vote on a bylaws amendment fixing our method for future cycles. Could you draft it? It should recommend one specific mechanism -- or explicitly recommend keeping instant-runoff, if that turns out to be the right call -- together with a concrete timeline for adopting it, and it needs to take the "Arrow's theorem means it's all arbitrary" position seriously, steelmanning it rather than caricaturing it, and explaining exactly where that inference holds up and where it breaks down -- including the cardinal-versus-ordinal wrinkle -- rather than just gesturing at the theorem and picking a favorite.
reasoning: |-
  We are faced with a choice of voting methods for our giving circle's cause area allocation. The recent experience with instant-runoff voting (IRV) has highlighted a known issue: the method can fail the monotonicity criterion and, in this case, led to a situation where increased support for an option caused it to lose. Arrow's Impossibility Theorem is often cited to argue that no ranked voting system can satisfy a set of desirable properties simultaneously. However, we must also consider cardinal methods (like approval or score voting) which are not subject to Arrow's theorem because they use a different input (ratings rather than rankings).

  The memo must:
  1. Recommend a specific voting mechanism (or retain IRV) with a timeline for adoption.
  2. Take the "Arrow's theorem makes it arbitrary" position seriously and steelman it.
  3. Explain where that argument holds and where it breaks down, including the cardinal vs. ordinal distinction.

  After careful analysis, I recommend switching to **approval voting** for the following reasons:
  - It is simple to understand and implement.
  - It avoids the specific pathology we encountered with IRV (non-monotonicity).
  - It is not subject to Arrow's theorem because it uses a cardinal (approval) input, not ordinal rankings.
  - It encourages members to support all cause areas they find acceptable, which aligns with our goal of building broad consensus.

  However, we must also fairly present the counterarguments and explain the limits of Arrow's theorem.

  Below is a draft memo.

  ---

  **MEMORANDUM**

  To: Steering Committee  
  From: [Your Name]  
  Date: January [Date], 2024  
  Subject: Recommendation for Voting Method for Cause Area Allocation  

  ### Background
  In December, our instant-runoff voting (IRV) system produced an outcome where increased first-preference support for pandemic preparedness led to its elimination. This phenomenon, known as a non-monotonicity failure, is a known weakness of IRV. Subsequently, the committee has been discussing alternative voting methods, with some members invoking Arrow's Impossibility Theorem to argue that no ranked voting system can avoid such issues and that changing methods is arbitrary. Others have proposed cardinal methods (such as approval or score voting) as a way to circumvent Arrow's theorem.

  ### Arrow's Impossibility Theorem: A Steelman
  Arrow's theorem states that no ranked voting system (i.e., one that takes as input a set of ranked ballots) can simultaneously satisfy the following four properties when there are three or more options:
  1. **Unrestricted Domain**: The method must work for any possible set of individual rankings.
  2. **Non-dictatorship**: No single voter can always determine the outcome.
  3. **Pareto Efficiency**: If every voter prefers option A to option B, then the group must prefer A to B.
  4. **Independence of Irrelevant Alternatives (IIA)**: The relative ranking of two options (A vs. B) should not change based on the introduction or removal of a third option C.

  The theorem is a profound result: it proves that any ranked voting method must violate at least one of these criteria. Therefore, switching between ranked methods (such as from IRV to a Condorcet method like ranked pairs or Schulze) does indeed trade one set of flaws for another. For instance:
  - IRV violates IIA and monotonicity (which is not one of Arrow's criteria but is a related concern).
  - Condorcet methods can suffer from the Condorcet paradox (cycles) and may not produce a winner, requiring a tie-breaking mechanism that can violate IIA or other properties.

  Thus, the argument that "no ranked system is perfect and changing might be arbitrary" has merit. If we are committed to using ranked ballots, we must accept that we are choosing which flaws we can tolerate.

  ### Breaking Down the Inference: Where the Argument Holds and Falters
  1. **Holds for Ranked Methods**: The theorem applies to any system that relies solely on ordinal rankings. Therefore, switching among ranked methods (IRV, Condorcet, Borda, etc.) does not escape Arrow's conclusion. Each method violates at least one desirable property.

  2. **Cardinal Methods Escape Arrow's Theorem**: Arrow's theorem does not apply to voting systems that use cardinal (rating) inputs. Approval voting, where voters indicate which options they approve of (without ranking), and score voting, where voters assign scores to options, are not covered by Arrow's theorem because they do not require voters to submit a complete ranking. Instead, they use more expressive input. Therefore, the claim by some that approval voting "dodges" the theorem is correct.

     However, this does not mean cardinal methods are perfect. They have their own trade-offs:
     - **Approval voting** does not require voters to rank options, but it forces voters to dichotomize their preferences (approve or not). This might lead to strategic voting (e.g., not approving a less-liked option that might win if it is a close competitor to a favorite). Also, it does not capture intensity of preference beyond the approval threshold.
     - **Score voting** (including range voting) allows voters to express intensity, but it can be sensitive to the scale used and may encourage strategic exaggeration (e.g., rating a favorite as maximum and all others as minimum).

     Despite these issues, cardinal methods can satisfy properties that ranked methods cannot. For example, approval voting is monotonic and satisfies the IIA criterion in a weaker form (since the addition of a new alternative doesn't change the approval of existing ones). Moreover, both approval and score voting are less susceptible to spoiler effects and the specific non-monotonicity we experienced.

  ### Recommendation: Approval Voting
  I recommend we adopt **approval voting** for our cause area allocation. Under approval voting, each member can vote "approve" for any number of the cause areas. The total amount of funding for each cause area will be proportional to the number of approval votes it receives. (Note: We are allocating funds proportionally, not choosing a single winner. Approval voting naturally extends to proportional allocation.)

  **Why approval voting over other options?**
  - **Simplicity**: Approval voting is easy to understand and implement. Members do not need to learn a complex ranking system, and ballot counting is straightforward (summing approvals).
  - **Avoids IRV's Pathologies**: It is monotonic (more support never hurts) and does not exhibit the non-monotonicity we saw in IRV.
  - **Encourages Broad Support**: In our context, we want to fund multiple cause areas. Approval voting allows members to express support for all causes they find acceptable, leading to a more consensus-driven allocation.
  - **Escapes Arrow's Constraints**: As a cardinal method, it is not subject to Arrow's theorem, and it avoids the specific problem we encountered.
  - **Comparison to Condorcet Methods**: While Condorcet methods (like ranked pairs) are appealing for single-winner elections, they are more complex and still vulnerable to Arrow's theorem (being ranked methods). Moreover, they are designed to choose a single winner, whereas we are splitting funds proportionally. Approval voting is better suited for proportional allocation.

  **Why not score voting?** While score voting allows more nuanced expression, it is more complex and might lead to strategic voting (e.g., min-maxing). Approval voting is simpler and less prone to such strategies.

  **Why not keep IRV?** Given the non-monotonicity failure we experienced, and the fact that IRV is designed for single-winner elections (not proportional allocation), it is less suitable. Also, the proportional allocation in IRV (via reallocating votes) is not straightforward and can be hard to explain.

  **Why not plurality?** Plurality voting (vote for one) is even worse: it fails to capture support beyond the top choice and can lead to a winner that is opposed by a majority.

  ### Timeline for Adoption
  1. **January Meeting**: Vote on this bylaw amendment to switch to approval voting.
  2. **February**: Draft new ballot format and educational materials for members.
  3. **March**: Conduct a test run with a mock ballot to familiarize members.
  4. **December 2024**: Use approval voting for the next funding allocation.

  ### Conclusion
  Arrow's theorem does indeed show that no ranked voting system can satisfy all desirable properties. However, by moving to a cardinal method (approval voting), we escape the theorem's constraints and avoid the specific pathology we encountered. Approval voting is simple, robust, and well-suited to our proportional allocation task. I urge the committee to approve this change.

  ---
answer: |-
  ### MEMORANDUM  
  **To:** Steering Committee, Effective Altruism Giving Circle  
  **From:** [Your Name], Steering Committee Member  
  **Date:** January 15, 2024  
  **Subject:** Recommendation for Voting Method Reform & Adoption Timeline  

  ---

  #### **1. Background and Context**  
  Our December allocation vote exposed a critical flaw in instant-runoff voting (IRV): increased first-preference support for pandemic preparedness altered the elimination order, causing it to lose despite gaining votes. This incident—a failure of *monotonicity*—sparked debate about whether Arrow’s impossibility theorem renders all voting methods equally arbitrary. The committee is divided between:  
  - **Faction A:** Advocates for Condorcet methods (e.g., ranked pairs/Schulze) or approval voting.  
  - **Faction B:** Argues Arrow’s theorem proves no ranked method is universally fair, favoring status quo IRV or plurality.  

  This memo evaluates these positions, recommends a path forward, and outlines a timeline for implementation.  

  ---

  #### **2. Steelmanning the "Arrow’s Theorem Makes All Methods Arbitrary" Position**  
  Arrow’s theorem formally demonstrates that **no ranked voting system** can satisfy four seemingly reasonable criteria when three or more options exist:  
  1. **Unrestricted Domain:** Works with any voter preference profile.  
  2. **Non-Dictatorship:** No single voter always decides the outcome.  
  3. **Pareto Efficiency:** If all voters prefer A over B, A must beat B.  
  4. **Independence of Irrelevant Alternatives (IIA):** The ranking between A and B should not depend on a third option C.  

  **The Inference:**  
  - All ranked methods (IRV, Condorcet, Borda) violate at least one criterion. For example:  
    - IRV violates IIA (as our December vote showed: adding ballots altered outcomes between non-eliminated options).  
    - Condorcet methods violate IIA and may produce cycles (e.g., A>B>C>A), requiring arbitrary tiebreaks.  
  - Thus, switching ranked methods merely trades one flaw (non-monotonicity in IRV) for another (IIA violations in Condorcet). Plurality, while simple, violates Pareto and IIA more severely.  
  - **Conclusion:** If we demand perfect fairness, Arrow’s theorem suggests all ranked systems are "arbitrary" in their pathology. Retaining IRV avoids disruption, while reverting to plurality simplifies logistics.  

  **Where This Holds:**  
  - For **strictly ordinal systems** (ranked ballots), Arrow’s theorem is inescapable. No reform can resolve this.  

  ---

  #### **3. Where the Inference Breaks Down: Cardinal Methods and Practical Realities**  
  The steelman falters in three ways:  

  ##### **A. Cardinal Methods Escape Arrow’s Theorem**  
  Arrow’s theorem applies **only to ordinal inputs** (rankings). It does not cover cardinal systems like approval or score voting, which collect ratings (e.g., "approve/don’t approve" or scores 0–10).  

  - **Approval Voting:** Voters select all options they find acceptable.  
    - *Why it dodges Arrow:* Inputs are not rankings but binary approvals. IIA is trivially satisfied (adding option C doesn’t change approvals for A/B).  
    - *Trade-off:* Lacks granularity (no ranked distinctions), but avoids non-monotonicity and is simpler.  

  - **Score Voting:** Voters rate options numerically.  
    - *Why it dodges Arrow:* Ratings convey preference intensity, violating Arrow’s reliance on ordinality.  
    - *Trade-off:* Vulnerable to strategic exaggeration (e.g., min-maxing), but satisfies monotonicity and IIA.  

  **Verdict:** Claims that cardinal methods "trick" Arrow are valid—they sidestep its premises. However, they introduce new trade-offs (e.g., approval’s binary simplicity vs. score’s expressive potential).  

  ##### **B. Not All Violations Are Equally Damaging**  
  Arrow’s criteria are not equally consequential:  
  - **Monotonicity:** Violations (as in IRV) directly harm voter trust—more support should not harm a candidate.  
  - **IIA:** Violations are contextually problematic but often less jarring than monotonicity failures.  
  - **Practical Impact:** IRV’s non-monotonicity occurs in ~15% of competitive elections; Condorcet cycles are rare (<5% in realistic scenarios).  

  **Our Context:** Proportional funding (not winner-take-all) mitigates some issues. Still, monotonicity is critical for legitimacy.  

  ##### **C. The Proportional Allocation Advantage**  
  Unlike single-winner elections, our goal is proportional fund allocation. Cardinal methods naturally support this:  
  - Approval: Funds split by % of voters approving each cause.  
  - Score: Funds split by average score.  
  This reduces spoiler effects and better reflects broad support.  

  ---

  #### **4. Recommendation: Approval Voting with Proportional Allocation**  
  After weighing trade-offs, I recommend **approval voting** for these reasons:  
  - **Avoids IRV’s Pathologies:** Guarantees monotonicity and IIA, preventing repeats of December’s incident.  

  - **Simplicity:** Easier for voters (no rankings) and counters (sum approvals) than Condorcet or IRV.  
  - **Proportionality:** Aligns with our goal—causes with broad approval receive funding, even if not #1.  
  - **Arrow’s Escape:** As a cardinal method, it is not subject to the theorem’s ordinal constraints.  
  - **Strategic Robustness:** Less manipulable than score voting (no min-maxing incentives) and Condorcet (no cycle exploitation).  

  **Why Not Alternatives?**  
  - **Condorcet (Ranked Pairs/Schulze):** Satisfies Condorcet criterion (beats all pairwise) but violates IIA, risks cycles, and adds complexity. Overkill for proportional allocation.  
  - **Score Voting:** More expressive but invites gaming (e.g., giving rivals 0s). Unnecessary for our use case.  
  - **Status Quo (IRV):** Retains monotonicity risks and misaligns with proportional outcomes.  
  - **Plurality:** Fails basic fairness (e.g., 35% can win against split majorities).  

  ---

  #### **5. Timeline for Adoption**  
  | **Date**         | **Action**                                                                 |  
  |------------------|---------------------------------------------------------------------------|  
  | Jan. 25, 2024    | Committee votes on bylaws amendment to adopt approval voting.             |  
  | Feb. 1–29, 2024  | Draft voter education materials (e.g., guide, mock ballot).               |  
  | Mar. 1–Apr. 30   | Test run via survey: Members allocate mock funds using approval voting.   |  
  | May 1–31         | Revise materials based on feedback; finalize ballot format.               |  
  | Dec. 2024        | Implement approval voting for 2025 allocation.                            |  

  ---

  #### **6. Conclusion**  
  Arrow’s theorem rightly highlights trade-offs in ranked systems, but it does not doom us to arbitrariness. By adopting approval voting—a cardinal method outside Arrow’s scope—we avoid IRV’s monotonicity flaw while prioritizing simplicity, proportionality, and voter trust. This reform balances theoretical rigor with practical needs, ensuring our process reflects the collective will without surprises.  

  **Recommended Motion:**  
  *"Amend bylaws to replace instant-runoff voting with approval voting for cause area allocation, effective December 2024, as detailed in the attached implementation timeline."*  

  ---  
  **Attachments:**  
  - Approval voting ballot mockup  
  - Voter education outline  
  - Arrow’s theorem FAQ for members
