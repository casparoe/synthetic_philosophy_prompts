  Also, Maimonides might emphasize that prayer is the ideal, but sacrifice was a necessary step. The Torah's legislation includes elements to wean off sacrifices, like focusing on intention and prayer alongside rituals. The patriarchs' actions were acceptable because they were spontaneous, not because sacrifice is the ultimate form of worship.

  Check if there are sources where Maimonides discusses the patriarchs. He might see their sacrifices as natural expressions of devotion, not influenced by idolatry. The Israelites, however, needed a structured transition. The existence of sacrifices before doesn't negate the need for accommodation in a different context.

