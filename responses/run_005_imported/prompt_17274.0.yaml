  Been down a bit of an epistemology rabbit hole and wanted to get you take on something. Williamson's anti-luminosity argument (the margin-for-error/sorites stuff from *Knowledge and Its Limits*) is supposed to show that there's basically no interesting mental condition C such that whenever C holds, you're automatically in a position to know it holds. Please compare that general "luminosity" idea with the more specific KK principle (know P -> know that you know P). Is KK basically just luminosity applied to the state of "knowing," and if so, does Williamson's argument sink KK right along with everything else, or is there a decent case that KK survives even where other candidates for luminous states don't? Bonus points if you can tie this back to the rationalist obsession with calibration and meta-uncertainty, i.e. whether we're even in a position to know when we really know something vs just feeling like we do.
