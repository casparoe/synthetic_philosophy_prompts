prompt: |-
  Been meaning to ask this somewhere for a while. So a few of us from an old SSC-meetup group that turned into a Discord have been going back and forth for like two weeks on whether it even makes sense, epistemically, to slap a credence on literally everything -- which is sort of the working assumption behind a lot of the Sequences-style "you should have a calibrated probability for every proposition, including your priors, and update via Bayes" stuff, plus the whole point of the "0 and 1 are not probabilities" post. Someone dropped Wittgenstein's On Certainty into the chat as a counter and now im kind of stuck on it. The part that got me is around OC 341-343, where he says our doubts only make sense against a background of stuff that's exempt from doubt in the first place -- not because it's been extra-well verified, but because it functions more like the hinges a door swings on than like an ordinary empirical claim. There's also the river-bed bit around OC 96-99, where the line between "hinge" and "ordinary belief" can itself shift over time, even though at any given moment you need something to hold still for inquiry to happen at all. I know there's a whole academic cottage industry (Pritchard, Wright, Coliva, etc) arguing about whether these hinge propositions are totally "groundless" or just non-evidentially "entitled," and im sure im mangling the finer points, but the basic picture feels like a real problem for the whole rationalist "everything gets a number" project, not just a semantic quibble.

  So: can you lay out what you think are the most important implications of hinge epistemology (in the Wittgenstein/On Certainty sense) for someone who's actually trying to practice rationalist-style epistemics day to day? Specifically I care about (1) what it does to the regress problem of justifying your priors in the first place, (2) whether techniques like double crux still make sense when a persistent disagreement turns out to be over something hinge-like rather than a normal shared-background empirical claim, and (3) whether there's a principled difference between "I assign this a credence of 0.9999" and "this just isn't the kind of thing that gets a credence at all." Dont need a full lit review, just whatever you think actually matters if I want to keep doing Bayesian-flavored reasoning without kidding myself about what it's resting on.
reasoning: |-
  Okay, the user is diving into a deep epistemological debate between Wittgenstein's hinge epistemology and the rationalist/Bayesian approach. They're part of a Discord group that's been wrestling with this for weeks, so they're clearly intellectually engaged but might be feeling stuck. The reference to "SSC-meetup" suggests they're familiar with LessWrong/rationalist circles, and their frustration with academic "cottage industry" debates shows they want practical insights, not jargon.

  Hmm, their core tension is visceral: how can you assign probabilities to everything when some beliefs feel like the ground you walk on? They're smart enough to spot that "0.9999 credence vs hinge" distinction but want to know if it breaks their toolkit. The three sub-questions are sharp: (1) regress problem for priors, (2) double crux viability during hinge disagreements, (3) credence-as-number vs hinge-status. 

  I should acknowledge Wittgenstein's insight isn't just academic—it mirrors lived experience. When they say "not kidding myself about what [Bayesian reasoning] is resting on," they're implicitly asking for intellectual honesty. Their anxiety might be that rationalism could be self-undermining if it ignores its own hinges. 

  For (1): The regress problem. Bayesianism pretends priors can be justified by meta-priors, but Wittgenstein exposes this as infinite regress. Hinges are where justification stops because they're pre-rational. Rationalists might call them "cached thoughts," but that's misleading—they're more like the operating system for thought itself. The key is to notice that Bayesian updating assumes hinges (e.g., "sense data exists") without stating them. Practical takeaway: Explicitly map your hinges to avoid mistaking them for empirical beliefs. 

  For (2): Double crux over hinges. Oof, this is messy. If someone doubts a hinge (e.g., "the external world is real"), double crux fails because there's no shared bedrock to build on. You'd need meta-techniques: either expose the hinge (e.g., "If we're brains in vats, why does your objection matter?"), or shift to pragmatic negotiation ("What hinge would make cooperation possible?"). But forcing Bayesian updates here is like using a thermometer to measure itself—pointless. 

  For (3): Credence vs hinge-status. The difference isn't quantitative but categorical. Assigning 0.9999 to "2+2=4" is rationalist cosplay; hinges aren't beliefs but conditions for belief. Like declaring "I’m 99.99% sure this sentence is in English"—the statement presupposes the language it's questioning. Practically: Reserve probabilities for movable beliefs; tag hinges as "unquestionable for now" to avoid false precision. 

  Biggest implication: Rationalism works *within* a hinge framework, not instead of it. The project isn't doomed, but it must acknowledge its own scaffolding. Maybe suggest they draft a "hinge declaration" for their Discord—listing what they collectively treat as immutable (e.g., "logic works," "sensory data is somewhat reliable"). That makes the invisible visible. 

  ...And skip the academic rabbit holes. They want to get back to improving their epistemics, not cite Pritchard.
answer: |-
  Your question cuts to the heart of epistemic practice—Wittgenstein's hinge epistemology (from *On Certainty*) isn't just a semantic critique but a structural challenge to naive Bayesian universalism. Here’s a pragmatic breakdown of its implications for your three concerns, avoiding academic weeds and focusing on actionable insight:

  ### 1. **The Regress Problem & Justifying Priors**  
     - **The Hinge Insight**: Bayesian regress (justifying priors with meta-priors, *ad infinitum*) is halted by hinges. These aren't "justified" but *enabling conditions* for justification itself (e.g., "The world exists," "My senses are somewhat reliable," "Logic works"). You don't *assign* a credence to these; they’re the frame through which credences make sense.  
     - **Practical Implication**:  
       - **Explicitly map your hinges**: Identify what you *treat* as certain (e.g., "Physical laws are stable," "Other minds exist"). These are your epistemic "bailout points."  
       - **Bayesian response**: Treat hinges as *hyper-priors*—not updated by evidence but *protected* until a catastrophic failure forces a paradigm shift (e.g., quantum mechanics challenging classical causality).  
       - **Key takeaway**: Your Bayesian network rests on hinges. Acknowledge them to avoid infinite regress or false precision.  

  ### 2. **Double Crux & Hinge Disagreements**  
     - **The Problem**: Double crux assumes shared background beliefs to resolve disputes. But if a disagreement targets a *hinge* (e.g., "Is science a reliable tool?"), the technique fails—no common ground to anchor cruxes.  
     - **Practical Implication**:  
       - **Diagnose hinge-level disputes**: If double crux stalls, ask: *"What unchallenged assumption is this disagreement resting on?"* (e.g., disagreement about climate models might hinge on trust in institutional science).  
       - **Pivot strategies**:  
         - **Meta-crux**: Negotiate a temporary hinge ("Can we agree that peer-reviewed data is our standard for this discussion?").  
         - **Pragmatic detente**: Shift to shared goals ("Regardless of models, should we hedge against tail risks?").  
       - **When to bail**: If hinges are irreconcilable (e.g., solipsism vs. realism), further Bayesian updates are futile—focus on conflict resolution, not truth-seeking.  

  ### 3. **Credence vs. Hinge Status**  
     - **The Distinction**:  
       - **Credence (0.9999)**: A belief updated by evidence (e.g., "The sun will rise tomorrow"). You can imagine counterevidence (e.g., astronomical anomalies).  
       - **Hinge**: A condition for inquiry (e.g., "The past is real," "Words have meanings"). To "doubt" it paralyzes thought itself (e.g., doubting language while using it).  
     - **Practical Implication**:  
       - **Tag your hinges**: Maintain a "not for revision" list (e.g., foundational logic, your own existence). Assigning them 0.9999 is *misleading*—it conflates empirical certainty with grammatical necessity.  
       - **Bayesian hygiene**: Use extreme credences *only* for empirical beliefs. For hinges, use markers like "axiomatic" or "constitutive."  
       - **Wittgenstein’s Riverbed**: When a hinge *does* shift (e.g., Euclidean geometry → relativity), it’s a Kuhnian revolution—update via paradigm change, not incremental Bayes.  

  ---

  ### **How to Practice Rationalist Epistemics Post-Wittgenstein**  
  - **Step 1: Hinge auditing**  
    List your operative hinges (e.g., "Reality is intersubjective," "My memory is non-maliciously flawed"). Revisit annually.  
  - **Step 2: Stratify belief-updating**  
    - **Layer 1 (Hinges)**: Immune to evidence; only replaceable in crisis.  
    - **Layer 2 (Core priors)**: High-stakes beliefs (e.g., "AI risk is plausible")—update rarely, with robust evidence.  
    - **Layer 3 (Ordinary beliefs)**: Daily Bayesian updates (e.g., "This policy will reduce inflation").  
  - **Step 3: Revise disagreement tools**  
    For persistent disputes, run a "hinge check" before double crux. If hinges clash, switch to:  
    - **Charitable benchmarking**: "What evidence would make you reconsider your hinge?"  
    - **Pragmatic collaboration**: "Can we act together despite hinge disagreement?"  
  - **Step 4: Embrace "bounded universalism"**  
    Assign credences *where it makes sense*—but recognize that domains like ethics, metaphysics, or personal identity often hit hinge territory. Use probabilities as tools, not ontological mandates.  

  **Bottom line**: Hinge epistemology doesn’t break Bayesianism—it *grounds* it. By mapping the "riverbed" of your belief system, you avoid self-undermining regress and deploy rationalist tools more effectively. The goal isn’t to number everything, but to number *judiciously*, with clear-eyed awareness of what your numbers stand on.  

  > *"The questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn."*  
  > —Wittgenstein, *On Certainty* §341
