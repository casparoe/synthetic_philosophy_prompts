prompt: |-
  Okay, this is a weirdly perfect (or perfectly terrible) coincidence: I TA a philosophy of language proseminar this term, and I just got asked to run the pre-talk "fireside chat" before Friday's colloquium -- and it turns out the speaker's whole research program is on the exact problem my qualifying paper is currently stuck on: the unity of the proposition and Bradley's regress. Her line (simplifying a bit -- this is from the chapter everyone's already read, so correct me if I'm garbling it) is that you don't need any special metaphysical glue to explain why "Dara swims" is one unified, truth-evaluable thing rather than just a list like {Dara, swimming}: no Fregean unsaturated concept, no primitive "nonrelational tie." Instead the proposition just IS a worldly fact -- the fact that, in some actual language, an interpreted sentence's syntax is used by competent speakers to encode that Dara has the property of swimming, period. Facts, on her view, come pre-unified in a way sets and sequences don't, so the regress never actually gets off the ground: your not adding one more relation to a pile, you're pointing at something that was never a pile of separate items to begin with.

  I don't want to waste our twenty minutes having her just restate the position live. Could you draft me 8-10 interview questions, loosely building on each other, that actually press on the soft spots? I specifically want one question on whether "facts just come pre-unified" is doing real philosophical work or is basically Bradley's original demand relabeled and declared solved by fiat; one on the modal cost of tying propositions to actual interpretive practice -- if a proposition depends on some thinker or language actually using the relevant relation, what happens to the proposition that there have never been any thinkers, given that its existing at all seems to require the falsity of what it says; and one on circularity, since "speakers use R to encode that Dara has swimming" sounds like it's smuggling in exactly the unity it was supposed to explain. For each of those, plus whatever else you include, give me a one-line guess at the dodge she'll reach for and a follow-up question that closes it off -- my money's on something like "that's an empirical question about linguistic practice, not a philosophical one" for the circularity one. And could you end with a question that makes her place her view against Kit Fine's antipositionalism, or just plain old Armstrongian brute states of affairs, since I'd rather she field that comparison from me than get blindsided by it during audience Q&A.
