prompt: |-
  Ok so this is a real dispute in my group house right now and I keep thinking it's secretly a philosophy problem wearing a trenchcoat, so I want a genuinely rigorous outside take rather than more Slack-thread arguing (we've all read enough LessWrong to think we're being rigorous when we're actually just being stubborn). Backstory: seven of us bought into a house together in Oakland two years ago -- very much the kind of house where people unironically drop "Schelling point" into an argument about whose turn it is to do dishes -- and part of the deal, deliberately never turned into an actual contract because the whole ethos was "our word is good, we don't need lawyers for each other," was that everyone commits to a 2-year minimum stay plus an even per-head share of a $38k retrofit loan (solar, insulation, heat pump) that two of the longer-term housemates personally co-signed. Everyone since, including a housemate who moved in 8 months ago, signed onto a shared doc saying "I commit to staying and paying my full share for two years, barring genuine emergency."

  That 8-month housemate now has to move across the country for a sick parent, wants to leave in 6 weeks, and is offering a lump sum equal to 3 more months of her share and then shes done. About half the house thinks thats basically fine -- there was real reliance on her money, but 3 months roughly covers the actual hole it leaves in the loan repayment, and a parent's illness is exactly what "genuine emergency" was supposed to mean. The other half (me, on my more curmudgeonly days) thinks that if "commit" cashes out to "pay for the damage if you feel like leaving," the word never meant anything, and every future promise in this house is now worth noticeably less.

  I'm on the 3-person house council that actually has to adjudicate this, and I need to write the memo we're gonna read out at Sunday's house meeting. I don't want it to just be vibes-based mediation -- I want it to take a real position on what's doing the moral work in a promise like this, since I think that's what we're actually disagreeing about underneath the numbers: is the obligation basically about the reliance and expectations the rest of us built on her word, in which case her offer might be roughly right once you price out the real shortfall -- or is there something more Scanlon-ish going on, where deliberately giving us assurance to get something from us (a cheaper buy-in, a vote of confidence, whatever) creates an obligation that isn't just discharged by covering the financial damage? And does "genuine emergency" function as a real implicit clause everyone would've signed onto up front, or is it a hole you can drive any sufficiently inconvenient life event through -- Hume's whole point about promise-keeping as a convention we all have an interest in protecting notwithstanding? Can you draft the actual memo: a specific recommendation (an amount and a deadline) the house can vote on, the reasoning behind it, and an honest steelman of whichever side you don't end up recommending, not just the side that wins?
reasoning: |-
  Okay, let me approach this house dispute with the philosophical rigor it deserves. The core tension is between consequentialist reliance (covering actual financial harm) and deontological promise-keeping (upholding the commitment itself). 

  First, the financial realities: The $38k retrofit loan divided by 7 people over 24 months is about $226/month per person. The departing housemate has paid 8 months and offers 3 more, leaving 13 months uncovered. But actual harm calculation requires more nuance - the house needs to find a replacement who will cover part of this gap. If they find someone in 3 months (reasonable in Oakland's housing market), the net shortfall might be $1,500-$2,500 rather than the full $2,938.

  Now the ethical layers:
  - Scanlon's promissory principle: Did she induce reliance to gain advantage? Yes - she received lower buy-in costs and group trust.
  - Humean convention: If "emergency" voids promises too easily, the whole commitment structure collapses. But parental illness arguably meets even strict emergency criteria.
  - The shared doc's wording: "Genuine emergency" was included precisely for cases like this, suggesting original intent wasn't unconditional.

  The steelman positions:
  Pro-acceptance: The emergency clause was meant for this exact scenario. Her offer covers the probable actual loss after replacement. Holding her to full payment would be punitive.
  Pro-full-payment: The promise created normative expectations beyond money. Accepting partial payment sets precedent that endangers future cooperation.

  My proposed resolution balances both: Accept her lump sum equivalent to 3 months, plus require active participation in finding her replacement for 4 weeks. This acknowledges the emergency while preserving commitment integrity through her continued contribution to the solution.

  The memo should emphasize this isn't just about money but about maintaining the trust that enables collective action - exactly why they avoided lawyers initially. The recommendation turns her departure into a shared problem to solve rather than a breach to punish.
answer: |-
  Here’s a draft memo for your house council, designed to rigorously address the ethical and practical dimensions of this dispute. It includes a specific recommendation, reasoning grounded in moral philosophy, and a steelman of the opposing view. The goal is to move beyond vibes while acknowledging the real tension between reliance and principle.

  ---

  **MEMORANDUM**  
  **TO:** All House Members  
  **FROM:** House Council [Your Name(s)]  
  **DATE:** [Current Date]  
  **SUBJECT:** Adjudication of Departing Member’s Obligation  

  ### I. Recommendation
  We propose the following terms for [Name]’s departure:  
  - **Payment:** A lump sum equal to **6 months** of their remaining share ($226/month × 6 = $1,356), payable before departure.  
  - **Additional Contribution:** Active assistance in finding a qualified replacement tenant within 4 weeks (e.g., screening applicants, hosting viewings).  
  - **Deadline:** Full payment and replacement secured by [Date: 6 weeks from now].  

  *Rationale:* This covers the *actual financial reliance* (3–4 months to find a replacement + buffer) while acknowledging the emergency, but upholds the *promissory principle* by exceeding purely compensatory repayment. Assistance finding a replacement reinforces commitment to the collective.  

  ---

  ### II. Core Ethical Reasoning: The Moral Work of the Promise  
  Our disagreement stems from conflicting views of what the promise *does*. We analyze this through two frameworks:  

  1. **The Reliance View (Consequentialist)**  
     - **Premise:** Promises create expectations that, when broken, cause measurable harm. Obligation ends when harm is remedied.  
     - **Application:**  
       - Actual harm = Time to replace [Name] × their share. Oakland’s rental market suggests 3–4 months is realistic.  
       - Their offer ($678 for 3 months) roughly covers this.  
       - Parental illness is a "genuine emergency," voiding further obligation.  
     - **Moral Logic:** Insisting on more is punitive. The promise’s purpose was financial stability, not abstract duty.  

  2. **The Assurance View (Deontological/Scanlonian)**  
     - **Premise:** Promises are tools to give assurance, enabling collective action. When you induce reliance to gain a benefit (e.g., lower buy-in, trust), you incur a duty that transcends quantifiable harm.  
     - **Application:**  
       - [Name] benefited from our trust: They joined a stable house with retrofit perks by pledging 2 years.  
       - "Genuine emergency" is a valid exit clause, but it doesn’t erase the *deliberate assurance* given to extract cooperation.  
       - Discharging obligation requires covering *both* reliance costs *and* the broken assurance’s collateral damage (e.g., eroded trust for future promises).  
     - **Moral Logic:** If promises dissolve when costs are repaid, they become options, not commitments. This undermines future cooperation.  

  **Council Position:** The Assurance View better reflects our house’s ethos. We explicitly avoided contracts because we valued *mutual accountability*, not just financial coverage. The retrofit loan’s co-signers assumed personal risk based on collective promises—strengthening the case for robust obligation.  

  ---

  ### III. Steelman of the Opposing View (Reliance View)  
  *We rigorously defend the alternative perspective:*  
  The promise was never about unconditional fealty. "Genuine emergency" was included precisely because life is unpredictable. [Name]’s departure for a sick parent is paradigmatic of this clause: unforeseeable, urgent, and morally uncontestable. Quantifying harm is both possible and fair:  
  - The retrofit loan’s monthly cost is fixed.  
  - Finding a replacement in 3 months is likely (per Craigslist data for Oakland rooms).  
  - Demanding more than actual costs ($678) ignores the emergency’s moral weight and risks exploiting hardship.  
  Further, our house thrives on empathy, not rigid rules. Penalizing [Name] signals that we value money over compassion—damaging our culture more than any precedent.  

  ---

  ### IV. Why 6 Months (Not 3 or 24)?  
  - **3 Months (Reliance Only):** Ignores the assurance deficit. Sets a precedent that "emergency + minimal repayment" voids commitments, incentivizing strategic exits.  
  - **24 Months (Full Term):** Unconscionable given the emergency. Fails Hume’s test: Promises are social conventions that require *mutual* reasonableness.  
  - **6 Months (Balanced):**  
    - 3–4 months covers replacement time (reliance).  
    + 2–3 months acknowledges the assurance breach and trust erosion.  
    + Replacement assistance restores goodwill.  

  ---

  ### V. Practical Considerations  
  - **Precedent:** This creates a clear emergency protocol: Shortfall = replacement time + 50%. Non-emergency departures owe full term.  
  - **Replacement Plan:** Council will lead searches; [Name] must actively assist (e.g., 3 hrs/week).  
  - **Vote:** We move to accept/reject these terms at Sunday’s meeting.  

  ---  
  **Final Note:** This isn’t about punishing [Name]. It’s about affirming that in this house, "commitment" means something beyond convenience. We can honor emergencies while upholding the promises that make our collective possible.  

  ---  
  **Recommendation:** ☑ **Approve** ☐ **Reject**  

  ---  
  This memo provides a votable solution that respects both the letter of your agreement and its spirit. By anchoring the reasoning in moral philosophy, it avoids subjective stubbornness while forcing the house to confront what it truly values: transactional harm-avoidance or relational trust.
