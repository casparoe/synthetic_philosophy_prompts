answer: |-
  That's an excellent question that cuts to the heart of a major contemporary philosophical debate. You're right that Street's Darwinian Dilemma (DD) is often presented in rationalist circles as a decisive refutation of non-naturalist moral realism (NNMR). However, Parfit's defense in *On What Matters* (and similar defenses by others like David Enoch and Russ Shafer-Landau) means the debate is **far from settled.** Parfit wasn't ignoring Street; he directly engaged with the core challenge she represents (though not always citing her *specific* 2006 paper, as he was addressing the broader evolutionary threat articulated by others like Sharon before him).

  Here's a breakdown of why the debate remains genuinely open:

  1.  **Street's Darwinian Dilemma (Recap):**
      *   **Horn 1 (Tracking Relation):** If there *are* independent moral truths, and evolutionary forces shaped our moral beliefs, then the *only* way realism holds is if evolution somehow selected for beliefs that *track* these truths. Street argues this is implausible because selection pressures favor beliefs promoting reproductive fitness, not moral truth. The correlation would be an incredible coincidence.
      *   **Horn 2 (No Relation):** If there is no such tracking relation, then our moral beliefs are primarily explained by evolutionary pressures, not by their correspondence to independent moral facts. This undermines the justification for believing those facts exist. We have no reason to think our evolved faculties point to moral truth.
      *   **Conclusion:** Realism must either accept an implausible coincidence or admit its core claim (that our beliefs track independent truth) is unjustified. Either way, NNMR is in deep trouble.

  2.  **Parfit's Core Defense ("No Relation" Account):**
      Parfit bites the bullet on Horn 2 ("No Relation"). His key move is to **sever the link between the *causal origins* of our cognitive capacities and the *justification* of our rational judgments.** He argues:
      *   **Distinction Between Origin and Validity:** Just because evolution produced brains capable of reasoning doesn't mean the *products* of that reasoning (when used correctly) are unreliable or unjustified. Evolution gave us eyes primarily to see predators and prey, not distant galaxies. Yet, using telescopes (extensions of those eyes *plus reason*), we reliably discover truths about galaxies. Similarly, evolution gave us rudimentary social emotions and reasoning capacities *for fitness*, but using reason rigorously, we can discover objective normative truths *despite* that origin.
      *   **The Autonomy of Reason:** Parfit is a strong rationalist. He believes reason, when applied rigorously (e.g., through conceptual analysis, seeking reflective equilibrium, identifying necessary truths), can deliver justified beliefs about objective normative truths (including moral ones) *independently* of the evolutionary history that produced the reasoning faculty itself. The *process* of rational reflection, not its evolutionary origin, provides the justification.
      *   **The Analogy to Mathematics & Logic:** This is Parfit's strongest analogy. Our basic mathematical and logical intuitions (e.g., 2+2=4, modus ponens) were also shaped by evolution for practical fitness, not for discovering abstract truths. Yet, we don't doubt the objective truth of basic math or logic. We use reason to *discover* and *justify* complex mathematical truths far beyond anything evolution "cared" about. Parfit argues normative truths are relevantly similar – they are necessary truths discoverable by reason.
      *   **Rational Necessity:** Parfit argues that some normative truths (e.g., "Pain is bad *as such*," "We have reasons to care about our future selves") are rationally inescapable or self-evident upon sufficient reflection. Their truth doesn't depend on *how* we came to be capable of recognizing them; it depends on their intrinsic rational force. Evolution might explain *why we care* about pain or the future, but it doesn't explain *why* we *should* care, nor does it undermine the *truth* of the proposition that we *do* have reason to care.

  3.  **Why This Keeps the Debate Open (The Serious Rebuttal):**
      *   **Challenges Street's Assumption:** Parfit directly challenges Street's implicit assumption that an evolutionary explanation of our cognitive faculties *necessarily* debunks their ability to track truths in domains unrelated to fitness. He provides a plausible model (math/logic) where this clearly isn't the case.
      *   **Offers a Positive Account:** He doesn't just say Street is wrong; he offers a positive account of *how* we can access moral truth *despite* evolution – through rational reflection, analogous to math.
      *   **Highlights a Fundamental Divide:** The debate exposes a deeper disagreement about the nature and power of reason and the relationship between causal origins and justification. Naturalists like Street see reason as fundamentally shaped by and constrained by its evolutionary origins. Non-naturalist rationalists like Parfit see reason as having a kind of autonomy, capable of transcending its origins to grasp necessary truths. *This fundamental epistemological divide isn't resolved by the DD*.
      *   **The "Reliability Challenge" Remains Contentious:** While Parfit addresses it, critics argue he doesn't *fully* meet the "how could evolution produce reliable moral truth-trackers?" challenge. Street would counter that Parfit underestimates how deeply evolution shapes our *concepts* of reason and rationality themselves, making the analogy to math imperfect (e.g., moral concepts seem more entangled with contingent emotions shaped by fitness). The question "Why think *this specific faculty* (moral reasoning), shaped *this specific way* for fitness, is reliable for *that specific domain* (mind-independent moral truth)?" remains potent. Parfit relies on the self-evidence/rational necessity of core norms, which the naturalist finds question-begging.

  4.  **Parfit's Engagement & Potential Weaknesses:**
      *   He *did* engage deeply with the evolutionary challenge. Large sections of *OWM* (especially Vol 2, Part 6) are devoted to defending the possibility of normative truth against naturalist objections, including evolutionary ones.
      *   **Potential Weaknesses/Criticisms (from Street's perspective):**
          *   **Overstated Analogy:** Math/logic deal with abstract, necessary truths in a highly formalized domain. Morality involves messy, contingent human experiences, values, and motivations, making it seem less amenable to pure rational discovery and more susceptible to evolutionary distortion.
          *   **The Scope of Reason:** Can "pure reason" really deliver substantive moral truths (e.g., about equality, rights, specific duties) as convincingly as it delivers "pain is bad"? Parfit thinks it can get us very far; critics are skeptical.
          *   **The Reliability Challenge Lingers:** Even granting the math analogy, the *specific* path evolution took in shaping our moral psychology might create systematic biases *within* our rational processes that Parfit underestimates. How do we *know* reason isn't just dressing up fitness-enhancing impulses in objective clothing?
          *   **Question-Begging?** Does Parfit's appeal to the self-evidence of rational norms ultimately just assume the very non-naturalist rationalism he's trying to defend against the naturalist challenge?

  **Conclusion: Is the debate genuinely open? Absolutely.**

  Parfit provided a powerful, serious, and philosophically sophisticated rebuttal to the Darwinian Dilemma. He didn't ignore it; he offered a fundamentally different framework (robust rationalism) for understanding how objective moral truth is possible and knowable *despite* our evolutionary origins. His defense hinges on the autonomy of reason and the analogy to necessary truths like math/logic.

  However, Street's challenge remains powerful. It highlights the profound difficulty of explaining *how exactly* a faculty shaped by natural selection for fitness could reliably track mind-independent moral truths. The debate ultimately rests on deeper, unresolved disagreements about:

  1.  The nature and power of human reason (Can it transcend its causal origins?).
  2.  The plausibility of necessary normative truths.
  3.  The best explanation for the content of our moral beliefs (evolution + culture vs. rational grasp of truth).
  4.  The strength of the analogy between morality and formal domains like math/logic.

  While the rationalist blogosphere might present the DD as a knockout punch, professional philosophy recognizes Parfit's response as a major counterpunch that keeps non-naturalist realism a live, defended option. The debate is ongoing precisely because both positions have significant strengths and face deep challenges. It's a central battleground in metaethics, not a settled matter.
