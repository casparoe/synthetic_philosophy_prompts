  Also, they must ensure this directly answers the knowledge question. The question is about interpretability of knowledge types. Their argument shows that even scientific "facts" like DNA being a code involve interpretation, thus making biological knowledge more open to interpretation than it seems. That's solid, but they need to make that connection explicit in their commentary.

