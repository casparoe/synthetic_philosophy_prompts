answer: |-
  ## The Stotting Debate

  **(The scene: A dimly-lit field station control room, walls lined with monitors. One screen replays slow-motion footage: a Thomson’s gazelle, frozen mid-leap, legs stiff, body arched, a blur of dust beneath it. Less than ten meters away, a cheetah is captured mid-lunge, muscles coiled, eyes locked on its target. MAYA, intense, leans forward, finger tracing the gazelle’s arc. LEO, thoughtful, sips cold coffee, his gaze analytical.)**

  **Maya:** (Pointing emphatically) *There*. That’s the core of it, Leo. Look at the sheer, suicidal proximity. Why leap *here*, *now*, wasting precious milliseconds and energy, putting itself *right* in the kill zone? A simple, efficient dash would be faster. It *has* to be a handicap. A crippling cost only a truly fit gazelle can afford to pay *right under the predator’s nose*. Anything less costly could be faked. Zahavi was right – the cost *is* the message. "Look how much I can waste and still escape *you*."

  **Leo:** (Nods slowly, setting down his mug) It’s costly, Maya, absolutely. And yes, it signals fitness – a weak gazelle stotting like that *would* likely be caught. But "crippling"? "Suicidal"? The *minimal* cost required by signaling theory isn’t about absolute waste; it’s about differential cost. The *marginal* cost of that leap, *given its proximity to the predator*, is higher for a weak gazelle than a strong one. A weak one might stumble on landing, lose more speed, panic. The strong one? It’s a calculated risk it *can* afford precisely because it *is* strong. The cost isn't arbitrary waste; it's a *reliable indicator* tied to underlying quality. Like the resonant frequency of a frog’s croak – mechanically tied to body size, impossible for a small frog to fake. An ‘index’. Honest without being a ‘handicap’ in Zahavi’s sense.

  **Maya:** (Turns sharply) Indexes! Fine for size, for croaks. But stotting isn’t an automatic byproduct of leg length. It’s a *chosen*, *energetic display*. And look at the *excess*! Why not stot earlier, safer? Why wait until the cheetah’s breath is hot? Your models might be satisfied with a *slightly* higher cost for the weak, but this… this *overshoots*. It screams "handicap" because only the extravagance, the sheer *unnecessary* danger, guarantees honesty against the most desperate bluff. A weak gazelle *could* fake a small hop further away – your marginal cost difference might be tiny then. But *this* close? Only the truly elite can risk it. The absolute cost *rules out* the cheap imitator.

  **Leo:** (Leans back, steepling fingers) You force me to confront the overshoot, Maya. It’s a fair point. Why isn’t a safer, cheaper signal evolutionarily stable? Maybe because predators are selected to ignore *ambiguous* signals. A half-hearted stot far away? The cheetah might just think it tripped. The display needs to be *unmistakable*, a clear, high-stakes advertisement. The equilibrium might demand a higher *threshold* cost to ensure detectability and credibility against skeptical predators, pushing it into what *looks* like pure waste. But the *mechanism* maintaining honesty is still differential cost – the weak *can't* do it *this* effectively *this* close, not that they *wouldn't* if they could. It’s the *inability*, not just the unwillingness due to cost.

  **Maya:** (Eyes narrow, conceding a fraction) Perhaps… the predator’s skepticism forces a higher equilibrium cost. But that doesn’t rescue your marginal cost alone. It still points to a *need* for substantial, even seemingly excessive, absolute expenditure to *achieve* that unmistakable signal. Now, confront *your* challenge: indexes. You say they prove waste isn’t necessary. Fine. But what about Zahavi’s *own* flagship – the peacock’s train? By your logic, it’s just an index of condition-dependent development. Good nutrition, low parasite load, strong genes build a big train. Minimal *marginal* cost for a healthy bird to display it, high cost for a sickly one to grow or maintain it. Where’s the handicap? Where’s the wasteful drain? If indexes suffice, why the extravagance? Why isn’t a slightly iridescent rump patch enough?

  **Leo:** (Takes a deep breath, a flicker of discomfort) The peacock… yes. Condition-dependence is crucial. But Maya, it’s *not* minimal marginal cost. Growing and carrying that train *is* costly – energetically, aerodynamically, in terms of predator evasion. The *key* is that the *fitness cost* of bearing that burden is *lower* for a truly high-quality male. A robust male with great genes *can* divert resources to the train without compromising his survival as much as a weaker male. The cost *is* real and substantial, but its *impact* differs. It’s not *sheer* extravagance for its own sake; it’s a *biomarker* amplified by sexual selection. The extravagance *emerges* because females select for the most reliable indicator, which becomes exaggerated. The honesty comes from the differential *net cost*, not the absolute waste.

  **Maya:** (A sharp, incredulous laugh) Biomarker? Amplified? That sounds like dressing up handicap in new clothes! "Differential net cost" – isn't that just Zahavi's drain, viewed through your game-theoretic lens? You admit the cost is *real and substantial*, and crucially, *it wouldn't exist without the signal*. The train *is* a drain. A weaker male *couldn't* fake it, not just because he couldn't grow it as well, but because the sheer burden *would* kill him faster. That *is* a handicap. Your indexes – the frog croak, the body size roar – those are free. The peacock’s train is *not* free. Its cost *does* explanatory work.

  **Leo:** (Holds up a hand) Okay, point taken. For signals like the train, or perhaps stotting at extreme proximity, the *absolute* cost is high, and it *is* a significant drain. It’s not *just* an index like vocal formants; it’s a *costly* signal where the cost itself is a core part of the reliability, magnified by condition-dependence. Maybe… maybe Zahavi was more right about the *amplitude* of cost in *some* signals than the strictest game theorists initially allowed. The models *can* incorporate high absolute costs, but they arise *because* of the need for reliability in contexts where cheaper signals are unstable. The *origin* of the honesty is still in the differential, but the *manifestation* can be extravagantly costly.

  **Maya:** (Stares back at the frozen image of the stotting gazelle) And perhaps… perhaps I need to concede that not *all* honest signals are handicaps. Your indexes are undeniable. A gazelle's size, its running speed itself – honest indices. But for *voluntary*, *stylized* displays like this stot, this close… (she gestures at the screen)… the sheer, undeniable *expense* of it, the risk that seems beyond the minimum… that screams handicap. It’s the *extravagance* that makes it credible in this deadly game. Your differential cost explains *how* it stays honest; the absolute cost explains *why it has to be so dramatic* to work against a predator honed by evolution to spot weakness.

  **(A silence falls, punctuated by the hum of the computers. The footage loops: leap, lunge, suspended tension. Neither has won, but the ground between them has shifted.)**

  **Leo:** (Quietly) So… signals exist on a spectrum. From pure, cost-free indices to… extremely costly handicaps. Stotting this close? Probably far towards the costly end. The peacock’s train? A costly signal amplified by condition-dependence, its extravagance driven by sexual selection. The *need* for cost varies.

  **Maya:** (Nods slowly, eyes still on the screen) Agreed. But never forget the predator, Leo. Or the skeptical peahen. Sometimes, only the extravagance, the genuine drain, the near-suicidal risk… only that cuts through the noise. Sometimes, the cost *isn't* just a byproduct; it *is* the message. Look at it. Just look at it. That’s not just differential cost. That’s defiance bought with risk. That’s handicap.

  **(They both watch the silent, deadly ballet replay on the screen, the theoretical lines blurring in the face of raw, costly proof.)**
