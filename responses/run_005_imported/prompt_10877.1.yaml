prompt: |-
  I have no formal training in statistics or philosophy, but I've spent a couple of years working through the debate over the COMPAS recidivism tool on my own time, from the original ProPublica investigation through the technical replies it provoked. For my podcast on technology and society, I'm interviewing a statistician known for defending calibration -- the idea that a given risk score should mean the same thing regardless of race -- as the right fairness standard, against critics who instead demand equal false-positive and false-negative rates across groups. Please draft eight interview questions that don't let her simply restate the impossibility theorem and move on: I want at least one pressing her on why calibration deserves priority over error-rate balance rather than the reverse, since the theorem itself is silent on which one to choose; at least one asking whether unequal base rates between groups should count as a neutral fact to condition on or as a sign of injustice further upstream; and at least one asking what would actually change her mind -- and for each question, a short follow-up keyed to the answer she's most likely to give.
