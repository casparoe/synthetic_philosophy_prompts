  The user might be underestimating how much the axioms themselves are contested. In formal verification, specs are agreed upon for a specific purpose. But Gödel's axioms aren't universally accepted. For example, "positive properties" is vague. What makes a property positive? This is subjective. Also, necessary existence is a key premise. Philosophers like Kant argue existence isn't a predicate, so including it as a property is problematic.

  Another point: modal logic S5 is sound, but its application to metaphysics is debatable. Possible worlds semantics might not perfectly map to reality. So even if the proof is valid in S5, its real-world relevance is questioned.

  The user also mentioned that denying a premise seems weak. But in philosophy, challenging premises is fundamental. Unlike math, where axioms can be chosen, ontological arguments deal with necessary truths. If a premise isn't self-evident, rejecting it is valid. For instance, the axiom that God-like beings are possible is crucial. Some philosophers doubt this, leading to different conclusions.

  The user's background in formal verification might make them prioritize logical rigor over philosophical nuance. They might need to understand that while the proof is technically correct, its premises' applicability to reality is where the debate lies. Philosophers aren't dismissing the verification; they're disputing whether the axioms reflect truth.

  I should also note that Gödel's proof isn't the only ontological argument. Others like Anselm's or Plantinga's have different structures. Philosophers engage with each version, critiquing their specific premises. So the controversy isn't about the logic but the foundational assumptions.

