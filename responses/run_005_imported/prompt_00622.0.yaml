prompt: |-
  Since retiring from a career as a chemist, I have finally had the time to read philosophy seriously, and I have been working through the older literature on the reduction/emergence debate rather than relying on secondary summaries. I was surprised to learn that the term "emergent," in more or less its current technical sense, does not originate with the well-known British emergentists of the 1920s (Alexander, Lloyd Morgan, Broad), but half a century earlier, in this passage by George Henry Lewes:

  Thus, although each effect is the resultant of its components, the product of its factors, we cannot always trace the steps of the process, so as to see in the product the mode of operation of each factor. In this latter case, I propose to call the effect an emergent. It arises out of the combined agencies, but in a form which does not display the agents in action. [...] Every resultant is either a sum or a difference of the co-operant forces: their sum, when their directions are the same; their difference, when their directions are contrary. Further, every resultant is clearly traceable in its components, because these are homogeneous and commensurable.

  It is otherwise with emergents, when, instead of adding measurable motion to measurable motion, or things of one kind to other individuals of their kind, there is a co-operation of things of unlike kinds. Add heat to heat, and there is a measurable resultant; but add heat to different substances, and you get various effects, qualitatively unlike: expansion of one, liquefaction of a second, crystallization of a third, decomposition of a fourth; and when the sensitive nerves of the skin are acted on, the effect is still more dissimilar. Here we have various emergents, simply because in each case there has been a different co-operant; and in most of these cases we are unable to trace the process of coalescence. The emergent is unlike its components in so far as these are incommensurable, and it cannot be reduced either to their sum or their difference. But, on the other hand, it is like its components, or, more strictly speaking, it is these: nothing can be more like the coalescence of the components than the emergent which is their coalescence. Unlike as water is to oxygen or hydrogen separately, or to both when uncombined, nothing can be more like water than their combination, which is water. We may be ignorant of the process which each passes through in quitting the gaseous to assume the watery state, but we know with absolute certainty that the water has emerged from this process. To fill up this gap in our knowledge by the word "power," or "causal link," is illusory. Some day, perhaps, we shall be able to express the unseen process in a mathematical formula; till then we must regard the water as an emergent.

  (George Henry Lewes, Problems of Life and Mind, vol. 2, 1875, §§65–66.)

  I would value help thinking through a few things I find genuinely puzzling here. First, what exactly is Lewes's criterion for calling an effect an "emergent" rather than a "resultant" — is he marking a real, mind-independent difference in how the effect is produced by its components, or only a difference in how far we currently happen to be able to trace and calculate that production? Second, he says the emergent is "unlike" its components, being "incommensurable" with them, and yet in the same breath insists that, strictly speaking, it "is" them: is there a coherent way to read that, or is he simply equivocating between two senses of "component"? Finally, his paradigm case is water from oxygen and hydrogen, and he explicitly ties emergence to our current inability to give a mathematical account of the combination. Given how much of water's bulk behaviour can now be recovered, at least in principle, from quantum-chemical treatments of its constituent atoms, has his own example since been dissolved by later chemistry — and if so, should that worry anyone who still wants to use "emergence" for claims about, say, biology or mind?
