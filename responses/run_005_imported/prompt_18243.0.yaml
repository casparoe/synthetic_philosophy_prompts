  Breaking down Lewis's conditions: Consent is crucial. In religious contexts, the substitute consents. In corporations, shareholders don't consent to bear penalties for executives' fraud. They might not even be aware. This lack of consent weakens the analogy.

  Identity and authorization are also key. In Christianity, Christ is seen as part of the divine entity, so there's a connection. But shareholders aren't authorizing executives to commit fraud. The corporate structure separates ownership from control, so executives aren't truly authorized to act in ways that harm the corporation. This misalignment breaks the necessary relationship for valid substitution.

