prompt: |-
  I'm a retired physicist, and I've properly fallen down a philosophy rabbit hole in retirement. Something my son in law said at dinner is bugging me. He trades crypto for a living, and his rule is: since every trade has a fifty-fifty shot at gaining 50% or losing 40%, the expected value is clearly positive (0.5×1.5+0.5×0.6=1.05), so he goes all-in with his whole stake every single time. Curious, I simulated 1000 copies of him doing 100 such trades in a row. The AVERAGE ending balance came out around 130 times his starting stake, just like the math says it should. But just over half the individual copies ended up loosing more than 99% of their money, with that huge average basically propped up by a handful of freak winners. He shrugged it off: expected value is expected value, so he's clearly being rational. Somethings off about that to me, but I can't nail it down with plain probability. Is he actually right, or is he missing something?
reasoning: |-
  We are given a scenario where each trade has:
    - 50% chance to multiply the current stake by 1.5 (gain 50%)
    - 50% chance to multiply the current stake by 0.6 (lose 40%)

   The expected value per trade is:
     E = 0.5 * 1.5 + 0.5 * 0.6 = 0.75 + 0.3 = 1.05

   So per trade, the expected multiplicative factor is 1.05, which is a 5% expected gain.

   If we do 100 trades, the expected value of the entire process would be (1.05)^100 ≈ 131.5 times the initial stake.

   However, the simulation shows:
     - The average ending balance is around 130 times the initial stake (which matches the expectation).
     - But more than half of the individuals end up losing more than 99% of their money.

   This seems paradoxical: the average is high, but most individuals are losing.

   The key here is that the expected value is dominated by a few extremely lucky paths. The distribution is highly skewed.

   Let's break it down:

   Consider the growth after n trades. Suppose we have k wins and (n-k) losses. Then the total factor is:
     X = (1.5)^k * (0.6)^(n-k)

   The number of wins k follows a binomial distribution: k ~ Binomial(n, 0.5)

   The expected value of X is:
     E[X] = [0.5 * 1.5 + 0.5 * 0.6]^n = (1.05)^n   (by the multinomial theorem for independent trials)

   However, the median outcome (the typical outcome) is not the same as the mean (expected value) because the distribution is log-normal like (but note: we have discrete outcomes).

   In fact, let's look at the logarithm of the growth factor per trade:

     log(X) = k * log(1.5) + (n-k) * log(0.6)

   The expected value of log(X) per trade is:
     E[log(X)] = 0.5 * log(1.5) + 0.5 * log(0.6)

   Let's compute that:
     log(1.5) ≈ 0.4055 (natural log) or ≈ 0.1761 (base 10) ... but we can use natural log for calculations.
     log(0.6) ≈ -0.5108

   So per trade:
     E[log(X)] = 0.5 * 0.4055 + 0.5 * (-0.5108) = 0.20275 - 0.2554 = -0.05265

   This is negative! Therefore, the expected logarithm of the growth factor per trade is negative.

   What does that mean? In the long run, the logarithm of the wealth grows at a negative rate, which implies that the wealth itself will decay exponentially for the typical path.

   Why the discrepancy?

   The expected value (arithmetic mean) of the multiplicative factor is 1.05, but the geometric mean (which is the exponential of the average log) is:
     geometric mean per trade = exp( E[log(X)] ) = exp(-0.05265) ≈ 0.9487

   This geometric mean is less than 1, meaning that the typical path will decay at about 5.13% per trade.

   Hence, the median outcome (and the majority of the paths) will be a loss.

   However, the arithmetic mean (expected value) is 1.05 because of the skew: the positive outcomes are very large (but rare), while the negative outcomes are common but not as extreme in the multiplicative sense? Actually, note:

     - A win multiplies by 1.5 (which is a big jump).
     - A loss multiplies by 0.6 (which is a big drop).

   But the key is that the log of the multiplier in a win is positive and in a loss is negative. The expected log is negative.

   In summary, the son-in-law is focusing on the expected value (arithmetic mean) of the multiplicative factor per trade. However, this measure does not reflect the typical experience. The typical experience (median) is a loss.

   Moreover, in repeated betting, the long-run behavior is better captured by the geometric mean (or the expected logarithm) because it relates to the exponential growth rate. This is the essence of the Kelly criterion.

   The Kelly criterion would suggest betting a fraction of the bankroll to maximize the expected logarithm of wealth. In this case, since the expected log is negative for betting the entire bankroll, the Kelly criterion would recommend betting less than the full amount (or even not betting at all).

   Let's compute the optimal fraction to bet using the Kelly criterion.

   We have a bet that with probability p=0.5 gives a return of b=0.5 (so that the bankroll is multiplied by 1 + f*b = 1 + f*0.5) and with probability 1-p=0.5 gives a return of a=-0.4 (so the bankroll is multiplied by 1 + f*a = 1 - 0.4f).

   The Kelly fraction f maximizes:
     G(f) = p * log(1 + b*f) + (1-p) * log(1 + a*f)
          = 0.5 * log(1 + 0.5f) + 0.5 * log(1 - 0.4f)

   We take the derivative and set to zero:

     G'(f) = 0.5 * (0.5) / (1+0.5f) + 0.5 * (-0.4) / (1-0.4f) = 0

     => 0.5 * [ 0.5/(1+0.5f) - 0.4/(1-0.4f) ] = 0

     => 0.5/(1+0.5f) = 0.4/(1-0.4f)

   Cross multiply:
     0.5 * (1 - 0.4f) = 0.4 * (1 + 0.5f)
     0.5 - 0.2f = 0.4 + 0.2f
     0.5 - 0.4 = 0.2f + 0.2f
     0.1 = 0.4f
     f = 0.1 / 0.4 = 0.25

   So the Kelly fraction is 25%. This means that with each trade, one should bet 25% of the current bankroll.

   But note: the son-in-law is betting the entire bankroll (f=1). At f=1, we can compute G(1):
     G(1) = 0.5 * log(1+0.5*1) + 0.5 * log(1-0.4*1)
           = 0.5 * log(1.5) + 0.5 * log(0.6)
           ≈ 0.5*0.4055 + 0.5*(-0.5108) = -0.05265   (as before)

   Since this is negative, the long-term growth rate is negative and the bankroll will go to zero with probability 1.

   Therefore, the son-in-law is not being rational from the perspective of long-term growth. He is confusing the arithmetic mean of the multiplicative factor (which is 1.05) with the typical growth. The expected value of the bankroll after many trades is high, but that is only because of a tiny chance of an enormous win. The vast majority of the time, the bankroll will be wiped out.

   Conclusion: He is missing the point that the expected value of the bankroll (which is the arithmetic mean) does not reflect the typical outcome. The typical outcome is determined by the geometric mean, and in this case, the geometric mean per trade is less than 1. Therefore, the rational approach would be to bet a fraction (like 25%) of the bankroll each time, not the entire amount.
answer: |-
  Your son-in-law's reasoning focuses solely on the expected value of the multiplicative factor per trade (1.05), which suggests a 5% average gain. While the math for the **mean** outcome is correct (ending balance averages ~130x after 100 trades), this masks a critical flaw: the distribution of outcomes is **highly skewed**, and the typical (median) trader loses almost everything. Here's why:

  ### 1. **The flaw in arithmetic mean for repeated bets**
     - The expected value calculation (0.5×1.5 + 0.5×0.6 = 1.05) works for a **single bet** but fails for **repeated all-in bets** because wealth compounds multiplicatively. The geometric mean, not the arithmetic mean, determines long-term growth.
     - The **geometric mean** of the growth factor per trade is:
       \[
       \sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.9487.
       \]
       This is **less than 1**, meaning the typical outcome decays by ~5.13% per trade. After 100 trades, the median outcome is \(0.9487^{100} \approx 0.0055\) (i.e., **0.55% of starting wealth**).

  ### 2. **Why the average is high while most lose**
     - A small number of "freak winners" (those with many more wins than losses) dominate the average:
       - To recover from a loss, you need a win of \(1/0.6 \approx 1.666\)x just to break even. Losses compound more heavily.
       - Extreme outliers (e.g., 70+ wins out of 100) yield astronomical balances (e.g., \(1.5^{70} \times 0.6^{30} \approx 1,400,000\)x), pulling the average up.
     - Meanwhile, **most paths cluster near bankruptcy**:
       - The binomial distribution peaks at 50 wins. With 50 wins and 50 losses:
         \[
         1.5^{50} \times 0.6^{50} = (1.5 \times 0.6)^{50} = 0.9^{50} \approx 0.00515.
         \]
       - Even a slight shortfall (e.g., 49 wins) drops the outcome to \(0.9^{49} \times 0.6 \approx 0.0034\)x. Your simulation (where >50% lose >99%) aligns with this.

  ### 3. **Rationality vs. risk of ruin**
     - **Expected value ≠ rationality**: Maximizing expected value is rational for a **single bet** but dangerous for repeated bets where ruin is possible. A strategy with a positive expected value but high risk of ruin is unsustainable.
     - **Risk of ruin**: With all-in bets, the probability of losing 99%+ after 100 trades is high. Your simulation shows >50% of traders suffer this fate. No rational investor would accept these odds.

  ### 4. **The Kelly Criterion perspective**
     - The optimal strategy maximizes long-term growth by maximizing the **expected logarithm of wealth**. For this bet:
       \[
       f^* = \frac{p}{a} - \frac{1-p}{b} = \frac{0.5}{0.4} - \frac{0.5}{0.5} = 1.25 - 1 = 0.25.
       \]
       Here, \(p=0.5\) (win prob), \(a=0.4\) (loss fraction), \(b=0.5\) (gain fraction). Kelly recommends betting **25%** of wealth per trade.
     - Betting 100% (all-in) yields a **negative expected log-wealth**:
       \[
       0.5 \ln(1.5) + 0.5 \ln(0.6) \approx 0.5 \times 0.4055 + 0.5 \times (-0.5108) = -0.05265 < 0.
       \]
       This guarantees long-term ruin.

  ### Conclusion
  Your son-in-law is **incorrect** in claiming his strategy is rational. While the expected value is positive, the strategy has:
  - A **>50% probability of catastrophic loss** (>99% of wealth).
  - A **negative geometric growth rate** (median outcome → ruin).
  - **No sustainability**: It violates the Kelly Criterion and ignores risk of ruin.

  A rational approach would bet a fraction of wealth (e.g., 25% per Kelly) to ensure positive long-term growth. His all-in strategy is mathematically akin to gambling with a tiny chance of winning big and a near-certainty of going bankrupt. The "expected value" argument is misleading for repeated multiplicative bets—it conflates the mean (dominated by outliers) with typical experience (ruin).
