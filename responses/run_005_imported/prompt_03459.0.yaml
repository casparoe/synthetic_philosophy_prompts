  ### (b) Roth's Impossibility Result

  In his 1979 paper, Alvin Roth proved that for n>=3, there is no bargaining solution that satisfies the following four properties simultaneously:

  1. Pareto efficiency: The solution should lie on the Pareto frontier.
  2. Symmetry: If the bargaining problem is symmetric, then the solution should be symmetric.
  3. Invariance under affine transformations: The solution should be independent of the choice of origin and scale for the utility functions.
  4. Individual Monotonicity: If the feasible set expands in a way that benefits only one player (i.e., the expansion is in the direction of one player), then that player's allocation should not decrease.

  The individual monotonicity property is the one that Kalai-Smorodinsky satisfies in two-player games. 

  The result is an impossibility theorem: for three or more players, no solution can satisfy all four.

  In the context of extending Kalai-Smorodinsky to three players, the usual extension is to define the ideal point for each player i as:
      u_i = max { x_i : x in S, x_j >= d_j for all j }
  Then, the Kalai-Smorodinsky solution is the point on the Pareto frontier that is the intersection of the ray from d to the ideal point u, i.e., the point x = d + t*(u-d) for the largest t such that x is in S.

