  Let me break this down. First, Black's spheres: even in an empty universe, each sphere has the relation "being distinct from the other." That's irreflexive—nothing is distinct from itself. So they're weakly discernible, saving Leibniz. But quantum particles? For fermions, the antisymmetric wavefunction means two electrons in the same orbital have opposite spins. The relation "has opposite spin to" is irreflexive—so weak discernibility holds. 

