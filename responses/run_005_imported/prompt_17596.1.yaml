    "1": 1,
    "2": -1,
    "3": 1,
    "4": -1,
    "5": 0
  }
  ```

  **Important Considerations Both Missed:**

  1.  **The Institutional Function of Jus in Bello:** Both focus primarily on individual soldiers' moral status. They underemphasize that the *purpose* of *jus in bello* rules and the MEC doctrine is fundamentally *institutional* and *forward-looking*: to establish minimally humane constraints *during* hostilities, regardless of the war's overall justice, precisely because judging *ad bellum* in real-time is impossible and attempting to do so leads to greater brutality and the abandonment of *any* constraints ("if we're the just side, anything goes against the unjust"). MEC is a pragmatic tool for atrocity prevention, not necessarily a full description of deep individual moral truth.
  2.  **Asymmetry in Modern Warfare:** The debate assumes relatively symmetrical combatant roles. The drone pilot case highlights a different asymmetry: the radical disparity in *risk* and *experience*. While this doesn't directly answer the core liability question, it introduces a significant *psychological*, *experiential*, and potentially *moral* dimension (e.g., "playstation warfare," detachment, lack of immediate consequence) that traditional frameworks struggle with. Are the moral burdens/vulnerabilities truly equivalent?
  3.  **The Nature of "Responsible Agency" in a Military Structure:** Both sides somewhat gloss over how military hierarchy, discipline, indoctrination, and coercion fundamentally shape a soldier's agency. How "responsible" is an individual soldier for being part of the "unjust threat" when acting under orders within a rigid structure? This complicates both the MEC (is the conscript really a moral equal?) and McMahan's liability criterion (is the conscript truly a "responsible agent"?).
