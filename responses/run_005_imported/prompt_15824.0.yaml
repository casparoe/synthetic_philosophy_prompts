prompt: |-
  At work, we recently wrapped up the postmortem for a major outage, and two colleagues disagreed sharply about how to write the root-cause section, in a way I still can't quite adjudicate. One colleague argues the incident should be explained as an instance of a general, recurring pattern: given our mix of aggressive retries, shared connection pools, and slow health checks, a cascade like this was bound to happen sooner or later, and the write-up should mainly document that pattern so other teams can recognize and avoid it. The other thinks this misses what actually explains the incident, and wants a detailed, chronological account of the specific decisions and coincidences involved — a config pushed at an unlucky moment, an alert that fired late, an on-call engineer who made a reasonable but wrong call — since in her view only that story accounts for why the outage happened exactly when and how it did. Both accounts strike me as true, and the same disagreement resurfaces every time we write up a past failure, not just this one. Is there a principled way to decide which kind of explanation is the correct one, or to understand why we seem to need both?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They mentioned a postmortem where two colleagues disagreed on how to write the root-cause section. One focused on a general pattern, while the other insisted on specific chronological details. The user feels both are true but can't decide which approach is correct.

  First, I need to understand the core of their conflict. The user is struggling to adjudicate between these two perspectives, which keeps coming up in their postmortems. They might be looking for a framework to resolve this or to understand why both are necessary. 

  I recall that in systems thinking, incidents often have both systemic causes (latent conditions) and immediate triggers. The first colleague emphasizes the systemic issues—like retry mechanisms and health checks—which create a fertile ground for failures. The second colleague focuses on the specific events that triggered the outage. Both are valid but serve different purposes.

  The user's deeper need might be about improving their postmortem process to prevent future outages. They might want a way to satisfy both viewpoints without conflict. Also, they might be seeking validation that integrating both approaches is acceptable, even necessary.

  Looking at best practices, I remember that effective incident analysis requires multiple perspectives. The Swiss Cheese Model comes to mind, where layers of defenses have holes that align. The systemic issues are the holes, and the specific events are the triggers. High-reliability organizations use this dual approach to learn comprehensively.

  Another angle: the user's team might need clarity on the purpose of the root-cause section. Is it for assigning blame, preventing recurrence, or storytelling? The colleague pushing for specifics might worry that systemic explanations let individuals off the hook. Meanwhile, the pattern-focused one wants broader organizational learning.

  I should consider how to structure the response. Explaining that both are complementary is key. The general pattern identifies the underlying flaws, while the specifics show how those flaws manifested. Together, they provide a complete picture for different audiences—engineers need specifics to debug, while architects need patterns to redesign systems.

  Also, the user might be hinting at a cultural issue. Recurring disagreements suggest a lack of established postmortem guidelines. Recommending a combined template could help. For example, a section for the timeline of events and another for systemic factors, with clear recommendations from both.

  Finally, emphasizing that the goal is learning, not blame. Highlighting how each perspective contributes to different types of prevention—specific fixes vs. systemic changes. Maybe suggesting the "Five Whys" technique to bridge both views by starting from the event and digging deeper into underlying causes.
answer: |-
  This is a profound question that cuts to the heart of how we learn from failure in complex systems. Both perspectives are valid, necessary, and represent complementary, not competing, types of truth. The disagreement stems from differing (often unstated) goals for the postmortem itself. Here's a principled way to understand and resolve it:

  **1. The Two Kinds of Explanation: "How" vs. "Why" (or Proximate vs. Root)**

  *   **Colleague 2 (Chronological Story):** Focuses on the **Proximate Cause(s)** - *How* the failure unfolded *this specific time*. This is the sequence of events, decisions, and conditions that directly led to the outage. It answers: "What were the immediate triggers and the chain reaction?"
  *   **Colleague 1 (Recurring Pattern):** Focuses on the **Root Cause(s)** - *Why* the system was vulnerable *at all*. This identifies the latent conditions, design flaws, or organizational factors that made the failure *possible* and *likely*. It answers: "What fundamental weaknesses allowed those proximate causes to have such a devastating effect?"

  **2. Why Both Are Essential & Why They Seem to Conflict:**

  *   **The Proximate Story (Colleague 2) is Necessary For:**
      *   **Specific Remediation:** Fixing the *exact* config error, tuning *that specific* alert threshold, clarifying *that particular* on-call decision protocol.
      *   **Accountability & Learning from Actions:** Understanding human factors, decision-making under pressure, and communication breakdowns *in this instance*.
      *   **Building the Narrative:** Humans understand and remember stories. The chronology makes the abstract concrete and provides context for the deeper analysis.
      *   **Countering "Act of God" Excuses:** Demonstrating that specific, identifiable actions/inactions *preceded* the failure.
  *   **The Root Cause Pattern (Colleague 1) is Necessary For:**
      *   **Systemic Remediation:** Addressing the underlying *design* flaws (retry storms, shared pools, slow health checks). This prevents *classes* of failures, not just this one instance.
      *   **True Prevention:** Proximate causes are often unique or random (the "unlucky moment"). Root causes are persistent vulnerabilities waiting to be exploited. Fixing these prevents *future* outages, even with different proximate triggers.
      *   **Organizational Learning:** Sharing the *pattern* allows other teams to audit their systems for similar vulnerabilities *before* they cause an incident.
      *   **Avoiding the "Blame Trap":** Focusing solely on the specific chronology can devolve into blaming individuals for singular mistakes, obscuring the system design that made their mistake catastrophic. Root cause analysis shifts focus to *system safety*.
  *   **The Conflict Arises Because:**
      *   **Different Goals:** One emphasizes fixing *this* incident's triggers; the other emphasizes preventing *all similar* incidents.
      *   **Perceived Dilution/Abstraction:** Colleague 2 fears that focusing on the pattern glosses over crucial details and lessons from the specific human/system interactions. Colleague 1 fears that focusing *only* on specifics misses the forest for the trees and leads to repetitive failures.
      *   **Blaming vs. Learning Culture:** An over-emphasis on specifics *can* feel like assigning blame (even if unintended), while an over-emphasis on patterns *can* feel like excusing mistakes or avoiding accountability.

  **3. The Principled Resolution: A Combined Approach (The "Swiss Cheese" Model)**

  The best postmortems integrate both perspectives, recognizing that failures occur when multiple layers of defense fail simultaneously. Think of the "Swiss Cheese Model":

  1.  **The Holes (Latent Conditions/Root Causes):** These are the systemic vulnerabilities identified by Colleague 1 (aggressive retries, shared pools, slow health checks). They are always present, like holes in slices of cheese.
  2.  **The Alignment (Proximate Causes):** The specific sequence of events described by Colleague 2 (bad config push timing, late alert, specific decision) are the factors that *aligned the holes* in the defensive layers on that particular day, allowing the failure to pass through.

  **A Principled Postmortem Root Cause Section Should Include:**

  *   **Concise Chronology:** A clear, factual timeline of key events leading to the outage (Colleague 2's core contribution). This provides the foundation.
  *   **Identification of Proximate Triggers:** Explicitly list the immediate causes from the chronology (e.g., "Config push coincided with peak load," "Alert delayed by 5 minutes due to queue backlog," "Engineer chose restart over isolation based on incomplete health check data").
  *   **Analysis of Latent Conditions/Root Causes:** *Explain how the proximate triggers were able to cause such significant impact.* This is where Colleague 1's pattern shines:
      *   "The config push triggered a retry storm because the service lacked backpressure mechanisms and retry budgets." (Connects config push to retry pattern)
      *   "The shared connection pool became exhausted because health checks were too slow to mark failing instances unhealthy, causing all traffic to overwhelm the remaining healthy instances." (Connects health check/slow failure to cascade pattern)
      *   "The on-call engineer lacked clear guidance/automation for distinguishing between isolated instance failure and a cascading event, leading to a reasonable but ineffective mitigation attempt." (Connects decision to process/tooling gap)
  *   **The Root Cause Statement:** A single sentence synthesizing both:
      *   *"The outage was caused by a cascading failure triggered by a config push during peak load, enabled by latent system vulnerabilities including unbounded retries overwhelming shared connection pools and slow health checks delaying failure detection, compounded by delayed alerts and insufficient mitigation playbooks for cascade scenarios."*

  **Why You Seem to Need Both:**

  *   **Completeness:** Proximate causes explain *how it happened this time*. Root causes explain *why it was possible and likely to happen eventually*. You need both for a full understanding.
  *   **Different Audiences & Actions:** Engineers fixing *this* service need the specifics. Architects designing future systems and leadership allocating resources need the patterns. SREs writing playbooks need both.
  *   **Learning at Different Levels:** Specifics teach about operational practices and incident response. Patterns teach about system design principles and organizational resilience.
  *   **Building a Just Culture:** Focusing *only* on specifics risks blame; focusing *only* on patterns risks inaction on fixable operational issues. A combined approach supports accountability for actions within a framework focused on systemic safety.

  **Recommendation for Your Team:**

  1.  **Reframe the Debate:** Acknowledge both perspectives as essential parts of a *complete* root cause analysis. The goal isn't "pattern OR specifics," but "specifics *leading to* patterns."
  2.  **Structure the Document:** Have distinct, labeled sections: "Timeline of Events," "Key Contributing Factors (Proximate Causes)," "Underlying Root Causes (Latent Conditions/Systemic Vulnerabilities)," and a clear "Root Cause Summary" that integrates both.
  3.  **Focus on "Enablement":** When discussing the pattern, explicitly state *how* it enabled the specific events to cause the failure (e.g., "Slow health checks *enabled* the shared pool exhaustion by...").
  4.  **Require Action Items for Both:** Ensure the postmortem generates specific fixes for the proximate triggers *and* systemic fixes for the root cause patterns. Track both.

  By embracing this integrated approach, your postmortems will be far more valuable, leading to both immediate fixes *and* lasting systemic improvements, ultimately making your systems more resilient. The recurring disagreement is a signal that your process needs to formally incorporate both truths.
