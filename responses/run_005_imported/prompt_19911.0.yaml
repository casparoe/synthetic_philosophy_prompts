answer: |-
  ## MEMORANDUM

  **TO:** Mutual-Aid Network Board Members  
  **FROM:** [Your Name], Board Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Re-evaluating Our Deserter Priority Criterion: A Path Forward  

  This memo addresses the critical debate surrounding our informal priority criterion: prioritizing deserters who articulate desertion based on the *specific injustice of Russia's war in Ukraine* over those citing personal survival or dislike of army life. The recent case – a conscript refusing "Putin's war of choice" while stating willingness to defend Russia – perfectly embodies our current criterion yet has exposed profound philosophical and practical disagreements. We *must* resolve this decisively before our next vote.

  ### Understanding the Stakes & Core Arguments

  Both sides raise vital points reflecting real tensions in ethics, law, and our mission:

  1.  **The Case FOR Our Current Criterion (Prioritizing Recognition of War's Injustice):**
      *   **Moral Resonance & Mission Alignment:** Our network exists *because* this war is an act of aggression. Prioritizing those who recognize this aligns with our foundational anti-war purpose. It rewards moral courage and a specific rejection of the Kremlin's narrative, fostering a community committed to opposing unjust wars.
      *   **Distinguishing Conscientious Refusal:** It identifies individuals undergoing a significant *moral awakening* specific to the conflict's nature, distinguishing them from those motivated purely by self-preservation (which, while understandable, doesn't inherently challenge the war's legitimacy).
      *   **"Moral Equality" is Contextual:** Proponents argue Walzer's "moral equality of combatants" primarily governs conduct *within* war (jus in bello) and the treatment of POWs. It does *not*, they contend, absolve soldiers of *all* responsibility for participating in a manifestly unjust war *of aggression* (jus ad bellum), especially when the facts are readily available. McMahan's challenge to moral equality strengthens this view, suggesting individual combatants *can* bear moral responsibility based on their war's justice.
      *   **Practical Signal:** It provides a tangible (if imperfect) signal of commitment to the *principle* we oppose, potentially indicating a lower risk of problematic attitudes resurfacing during resettlement.

  2.  **The Case AGAINST Our Current Criterion (The "Opposition" View - Citing Walzer/POW Principle):**
      *   **The "Soldier's Dilemma" & Epistemic Burden:** Soldiers, especially conscripts, are not sovereigns or philosophers. They lack reliable access to truth, are subjected to intense propaganda, and are trained to obey. Expecting them to accurately judge the *justice* of the war they are ordered to fight imposes an unrealistic and unfair epistemic burden. Walzer's framework deliberately shields soldiers from this burden to maintain the war convention.
      *   **The Slippery Slope & Hypocrisy:** If we judge deserters based on their *assessment* of the war's justice, are we not replicating the very act of judgment we condemn in the Kremlin? Where do we draw the line? Does a soldier need sophisticated philosophical reasoning, or is a gut feeling sufficient? This opens the door to arbitrary and intrusive evaluations.
      *   **POW Principle as a Guide:** The Geneva Conventions explicitly avoid inquiring into a POW's *motives* for surrender or capture. Protection is universal. This reflects the principle that soldiers, once rendered *hors de combat*, deserve basic protections regardless of their side's cause or their personal beliefs. Our opponents argue our criterion violates this spirit by making aid contingent on passing a moral litmus test.
      *   **Undermining Solidarity:** This view holds that *all* who refuse to participate in this aggression, for *whatever* reason, are performing an act that weakens the Russian war machine and deserves support. Prioritizing based on motive fractures this solidarity and risks missing valuable allies.

  ### The Opposition's Strongest Argument: Acknowledging Its Weight

  **The most compelling point from the opposition is the profound difficulty and potential unfairness of expecting individual soldiers, particularly conscripts operating under duress and propaganda, to be reliable judges of *jus ad bellum*. Walzer's insistence that the moral equality of combatants protects soldiers from being held individually culpable for their state's decision to wage an unjust war is a cornerstone of modern just war theory designed to preserve the possibility of restraint *within* war. Applying a "justice recognition" test *does* risk placing an impossible burden on individuals in an impossible situation and introduces a subjective, potentially hypocritical, element into our aid distribution that mirrors the state's demand for unquestioning obedience.**

  ### Recommendation: Revise the Criterion for Greater Defensibility

  While our current criterion captures a vital element of conscientious refusal, the opposition's critique regarding the *epistemic burden* and the *principle of not judging the soldier's motive* for basic support is too strong to ignore. **I recommend revising our priority criterion, not abandoning the underlying value it seeks to promote.**

  **Proposed Revised Criterion:**
  > **Priority is given to deserters who explicitly state their refusal is based on the belief that Russia's war in Ukraine constitutes an act of *aggression* or *unjust invasion*, or that they refuse to participate in offensive operations they perceive as wrongful. This includes refusal based on the specific nature of the conflict (e.g., "war of choice," "invasion," "attack on Ukraine").**

  ### Why This Revision Addresses Both Sides

  1.  **Focuses on the *Act* and the *Conflict*, Not Deep *Justice* Assessment:** Instead of requiring a judgment on the abstract "justice" of the war (which invokes the full complexity of *jus ad bellum*), it focuses on the deserter's rejection of *this specific act* – **aggression/invasion**. This aligns with the near-universal international condemnation (UNGA Resolutions) and is a factual assessment more accessible to a soldier ("We are attacking another country") than a full philosophical judgment on "just cause." The conscript in question ("Putin's war of choice") clearly meets this.
  2.  **Accommodates Walzer's Core Concern:** It avoids holding the soldier culpable for *being part of an unjust war effort* in the abstract. Instead, it prioritizes those who *chose to reject participating in an act widely recognized as aggression*. The refusal itself is the key act of conscience, grounded in the nature of *this specific conflict*.
  3.  **Retains the Core Insight of the Original Criterion:** It still prioritizes individuals demonstrating a refusal rooted in the *political/moral reality of this war* as an offensive act, distinguishing it from purely personal survival instincts or generic army complaints. It captures the "awakening" to the war's essential nature.
  4.  **Mitigates the Epistemic Burden:** Recognizing "aggression" or refusing "offensive operations" is arguably more concrete and accessible amidst propaganda than determining if the war meets all criteria of a "just war." It focuses on the *character of the action* they are ordered to perform.
  5.  **Aligns Better with the POW Principle Spirit:** While not identical, the focus is less on probing the *purity of motive* and more on the *stated reason for refusal* being intrinsically linked to opposition to *this specific act of aggression*. It moves away from judging the soldier's philosophical depth towards recognizing their rejection of the invasion.
  6.  **Practical & Defensible:** It remains relatively simple to ascertain during intake ("Why did you refuse to fight?") without requiring philosophical debate. It directly links the refusal to the defining characteristic of the conflict that motivates our network's existence: opposing the Russian invasion.

  ### Implementation of the Revised Criterion

  1.  **Formalize & Document:** Adopt this revised criterion formally, replacing the informal "unjust war" phrasing. Document it clearly for intake volunteers.
  2.  **Intake Focus:** Train intake volunteers to ask: "Can you tell us *why* you decided to desert/refuse to fight?" Listen for keywords/concepts: "aggression," "invasion," "unprovoked," "war of choice," "attacking Ukraine," "didn't sign up for this," "offensive war," "refused orders to advance/shoot." Probe gently if the answer is vague ("Can you say more about what felt wrong about the war?").
  3.  **Avoid Philosophical Inquisition:** Do *not* demand sophisticated justifications, knowledge of theorists, or consistency with international law. Focus on the deserter's own articulation linking their refusal to the *nature of Russia's actions*.
  4.  **The Conscript Case:** Under this revised criterion, the conscript stating he deserted because it was "Putin's war of choice" and he would fight in a defensive war **clearly qualifies for priority**. His refusal is explicitly grounded in rejecting *this specific conflict* as aggressive.

  ### Conclusion

  Our current criterion's intent is noble but philosophically vulnerable to the valid criticism that it places an undue burden on soldiers to judge *jus ad bellum*, contradicting a core principle designed to protect soldiers in war. Abandoning the intent entirely, however, risks losing sight of why our network exists – to support those refusing to participate in aggression.

  **The proposed revision offers a defensible middle path.** By prioritizing refusal based on the recognition of *this war as an act of aggression or unjust invasion*, we remain true to our mission's core motivation while respecting the profound difficulty of a soldier's position and the principles underlying combatant equality and POW protections. It focuses on the *act* of rejecting participation in the invasion, which is the fundamental act of conscience we seek to support.

  **I urge the board to adopt the revised criterion.** This allows us to help the conscript in question under our priority framework while placing our process on firmer philosophical and practical ground, strengthening our network's integrity and mission focus. Let's move forward united, supporting those who take the immense risk of refusing to be instruments of this invasion, for reasons rooted in its defining nature.

  **Ready for discussion and vote at our next meeting.**
