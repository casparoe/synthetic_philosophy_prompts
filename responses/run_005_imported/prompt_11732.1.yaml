  ### Explanation of Scores:
  1.  **Uncle's "Equal Split" Argument (Score: -1)**  
      *Superficially fair but ignores material reality.* Equal dollars *do* treat recipients identically, but fails when people face fundamentally different circumstances. Grandma likely intended equal *regard*, not robotic equality ignoring needs. Ignores distributive justice principles where resources address unequal starting points (-1 for oversimplification).

  2.  **Aunt's "Adjust for Disability Needs" Argument (Score: 2)**  
      *Strong ethical and practical foundation.* Highlights the difference between *formal equality* (same treatment) and *substantive equality* (equal opportunity/outcome). Mark's paralysis creates unavoidable extra costs (wheelchair accessibility, medical equipment, transport) just to achieve basic independence – costs Denise and you don't face. Equal cash would leave Mark significantly worse off in terms of life function. Rooted in disability justice principles (+2 for correctness).

  3.  **Uncle's "Slippery Slope with Denise" Argument (Score: -1)**  
      *False equivalence.* Compares an *involuntary, life-altering disability* creating *necessary* costs for basic functioning to *voluntary lifestyle choices* (designer goods, luxury travel). Needs arising from disability vs. desires arising from preference are ethically distinct. The aunt's argument wasn't about "equal happiness" (yet), making this a misdirection (-1 for flawed analogy).

  4.  **Aunt's "Equal Capability" Distinction (Score: 1)**  
      *Correct direction, slightly vague.* Successfully differentiates Mark's *functional capability deficit* (inability to walk, impacting core life activities like mobility, work, independence without aids) from Denise's *preferences*. Focuses on enabling fundamental human capabilities (work, independence, movement) compromised by Mark's accident. Lands on the right principle (capability approach) but "normal life stuff" is admittedly subjective (+1, core point valid, phrasing imperfect).

  5.  **Uncle's "Who Defines Normal?" Challenge (Score: 1)**  
      *Valid meta-point, used defensively.* He correctly identifies the potential ambiguity in defining the threshold for "normal capabilities" or "basic functioning." This *is* a complex philosophical/practical question. However, his intent seems less about genuine inquiry and more to stall the valid need for accommodation by pointing to difficulty. While the challenge has merit (+1 for logical point), it doesn't invalidate the *need* for adjustment, it just highlights the challenge of implementation.

  ### Overall Referee Summary
  *   **Your Aunt has the stronger ethical foundation (Moves 2 & 4):** Recognizing that true fairness requires accommodating Mark's disability-related costs to achieve comparable functional independence is the most justifiable position. Equal cash isn't equal outcome here.
  *   **Your Uncle scores points on slippery definitions (Move 5):** Defining the precise threshold for "necessary accommodations" or "basic capabilities" *is* challenging and requires careful consideration to avoid arbitrariness. However, this difficulty doesn't negate the core need for adjustment identified in Move 2.
  *   **Move 3 was a weak misdirection:** Comparing disability needs to luxury desires was invalid.
  *   **Move 1 was an oversimplification:** Ignoring differing circumstances isn't true fairness.

  **Practical Resolution Suggestion:** The fairest path is likely a three-way split *after* allocating funds to cover specific, verifiable disability-related costs Mark incurs to achieve basic independence (e.g., home accessibility modifications, essential mobility equipment not covered by insurance). This addresses the aunt's valid concern without venturing into subjective definitions of "happiness" or "normal life," mitigating the uncle's definitional worry. An estate lawyer or mediator could help define these costs objectively.
