answer: |-
  Here’s a 1,200-word story grounded in the unsettling ambiguity of "quantum torment," told close to the protagonist’s perspective, with the mechanism left implicit:

  **Actuarial**

  Arthur Finch knew the odds. He’d built a career on them. Thirty years as an actuary, calculating lifespans, premiums, the cold, elegant mathematics of mortality. He knew the precise, diminishing probability of surviving repeated low-chance events. He’d built models for it. Yet, lately, Arthur found himself running his own life through those models, and the numbers didn’t quite reconcile.

  It started subtly, a background hum beneath the rhythm of work, commuting, solitary evenings in his neat bungalow. A flicker of unease when the news reported a pile-up on the M4, the exact stretch he’d driven through, inexplicably clear, just thirty minutes prior. A tightening in his chest recalling the scaffolding collapse on Baker Street – he’d been walking *right there* the day before, complaining about the obstruction. Coincidence. Bad luck narrowly avoided. Statistical noise.

  Then came the balcony.

  It was a client dinner in Mayfair. A rare social outing. Too much wine, perhaps, or a momentary lapse on the slick, rain-wet terrace. Arthur remembered the sickening lurch, the polished railing seeming to dissolve under his hand, the gasps behind him. He remembered the jarring impact – not on the pavement far below, but on the awning of the ground-floor restaurant, just two metres down. Bruised ribs, a wrenched shoulder, a spectacular, humiliating mess of canvas and shattered crockery. "Incredible luck!" they’d all chorused. "A miracle!" Arthur, winded and aching, had only nodded, feeling the sharp protest in his shoulder blade. *Luck*, he thought. *But why did the railing fail? Why that angle? Why the awning?*

  The shoulder never fully recovered. A dull, persistent ache settled in, a constant companion that made reaching for the top shelf or sleeping on his right side an exercise in careful calculation. He noticed other things too. A slight tremor in his left hand, barely perceptible, that hadn’t been there before. A new sensitivity to sudden noises that made him flinch. The world felt… sharper at the edges, somehow more precarious.

  The next event was the train. Platform 9, Euston. Rush hour. The press of bodies, the roar of the incoming express. He felt a shove, hard and deliberate, from behind. Off-balance, stumbling forward, towards the gleaming edge and the rushing air. Instinct, or something else? His bad shoulder slammed into a stanchion, the pain blinding, arresting his momentum as the train blurred past inches from his face. He crumpled, gasping. People helped him up, voices concerned, angry about the unseen pusher in the crowd. Arthur clutched his shoulder, the old injury screaming, a fresh wave of nausea washing over him. "You okay, mate? Bloody close one!" Close. Always close. He got home, cancelled his meetings for the week, and sat in the silent living room. He tried to calculate the probability: the specific timing, the shove, the stanchion being *right there*, the angle of his stumble. The numbers swam, refusing to resolve into comforting certainty. The ache in his shoulder felt less like an injury and more like a tally mark.

  Years scrolled by. The ache deepened, morphing into a chronic, grinding thrum. He took early retirement. The office chatter, the bright young things crunching numbers without seeming to grasp the visceral weight behind them, became unbearable. His world narrowed. Friends drifted away, finding him withdrawn, preoccupied. He didn’t blame them. He felt… attenuated. Diminished. Less substantial.

  There was the gas leak. He’d forgotten to turn off the hob properly after a rare attempt at cooking. He woke in the night, dizzy, head pounding, a metallic taste coating his tongue. He barely made it to the window, gulping cold air. The gas engineer later confirmed a tiny, almost undetectable crack in the flue. "Lucky you woke up when you did," he’d said cheerfully. Arthur just nodded, the throbbing in his head joining the symphony of aches. His sense of smell seemed permanently dulled afterwards. Food tasted flatter.

  Then, the stroke. Or the near-stroke. Sitting in his armchair, reading about pension fund volatility, the words suddenly swam. His left arm went numb, heavy as lead. A terrifying slurry filled his mouth when he tried to call out. He managed to knock his reading lamp off the side table. It crashed, startling him, and in that jolt of adrenaline, the numbness receded, the slurry cleared. A TIA, the doctor called it. A transient ischemic attack. A warning shot. "Very fortunate it resolved," the neurologist said, scanning the inconclusive tests. "Minimal residual deficit." *Minimal*. Just a slight drag in his left foot now. A hesitation in his speech when tired. A new, constant low-level hum of fatigue. Another mark on the tally.

  Arthur stopped going out much. The world felt too loud, too fast, too full of sharp corners and unpredictable vectors. He spent hours at his old desk, not with actuarial tables, but with lists. Dates. Events. The balcony fall. The train shove. The gas. The TIA. The time the lorry swerved *away* at the last second on the A40. The time the biopsy came back *just* benign. The food poisoning that hospitalised him for a week but didn't kill him. Each entry carried its residue: the shoulder pain, the tremor, the dulled senses, the dragging foot, the chronic fatigue, the persistent tinnitus that started after a firework exploded too close one Bonfire Night.

  He looked in the mirror. The man looking back was thinner, paler. Eyes that held a watchfulness, a deep, unspoken fatigue that went beyond physical weariness. He traced the lines on his face, each one feeling earned not just by time, but by near misses. By survival. He felt like a manuscript that had been erased and rewritten too many times, the paper worn thin, the text blurred.

  One damp Tuesday, fetching the milk from the step, his dragging foot caught the edge of the worn welcome mat. He fell. Not hard. Just a clumsy, graceless tumble onto the damp concrete path. He lay there for a moment, the cold seeping through his cardigan, the familiar constellation of aches flaring. His knee throbbed. His bad shoulder shrieked. He stared up at the flat, grey sky.

  *Get up*, he thought. *You always get up*.

  He pushed himself onto his elbows. The movement sent a fresh spike through his shoulder. He gritted his teeth. *Probability*, the actuary in him whispered. *The cumulative probability of surviving this many statistically improbable events… it approaches zero. Absurdly low. Vanishingly small.*

  He managed to sit up, leaning against the doorframe, breathing heavily. Rain began to spit, cold needles on his face. He thought of the branches. Not quantum branches, not explicitly – that felt too grandiose, too much like the science fiction he avoided. He thought instead of paths. Paths through a dark wood. Paths where the railing held. Paths where the shove came a second earlier, or later. Paths where the gas didn't leak, or he didn't wake. Paths where the clot travelled further. Paths where he simply… stopped.

  But he was here. On this path. This wet, painful, narrow path. Where the railing *did* give way, but the awning *was* there. Where the shove *did* come, but the stanchion *was* positioned just so. Where the clot *did* form, but dissolved before it could finish the job. He survived. He always survived. But survival, he realised with a chilling clarity that had nothing to do with the rain, wasn't a return. It was a reduction. Each escape carved something away. Each improbable salvation left him less whole, less connected, less *viable* elsewhere.

  He got to his feet, slowly, painfully. He picked up the milk bottle, miraculously unbroken. He limped back inside, closing the door on the grey afternoon. The house was quiet. The silence wasn't peaceful anymore; it was vast, expectant. He put the milk in the fridge. The tremor in his hand made the bottle clink against the shelf.

  He walked to his desk, to the list. He picked up his pen. His hand hovered. *Slipped on step. Bruised knee. Worsened shoulder pain.* He didn’t write it down. He just stared at the previous entries, the accumulating evidence of a life persistently, improbably, *incompletely* interrupted. The numbers screamed impossibility. His body whispered confirmation. He was alive. He was always alive. But the cost of that aliveness was etched into every stiff joint, every dulled sense, every quiet, aching moment of his diminishing world. The path forward felt less like a journey and more like a slow, inevitable wearing down, a waiting for the next near-miss he wouldn't, couldn't, quite avoid. He sat down, the old wood groaning under his weight, another small sound in the quiet house, and listened to the rain, and the thrumming in his shoulder, and the silence that stretched out, vast and indifferent, around him.
