  I need to craft substantive questions that challenge the speaker's position while remaining respectful. The user is clearly knowledgeable about moral philosophy and bargaining theory - they're using precise technical terms like "minimax relative concession" and "Nash product." This suggests they want academically rigorous questions that push the theoretical boundaries.

  For the fairness currency question, I'll focus on why equalizing relative concessions should be privileged over Nash's joint surplus maximization. The follow-up should challenge whether the moral appeal of K-S relies on presupposing egalitarian ideals. 

  Regarding the Lockean proviso, I'll question whether it truly eliminates unjust bargaining advantages or merely legitimizes them. The follow-up should press on how the proviso handles historically entrenched inequalities that shape bargaining positions.

  For the exclusion problem, I'll highlight how non-contributors like future generations get excluded, asking whether this violates moral intuitions. The follow-up should challenge whether attempts to include them through representatives actually solve the problem.

  I'll also develop additional questions about: how K-S handles non-symmetric cases, whether mutual advantage theories can ground moral obligations to resist oppression, empirical validity concerns, comparison to other contract theories like Scanlon's, and practical implementation challenges. Each needs sharp follow-ups anticipating likely replies.

