  Let me analyze each:

  1. **Reductive/type-identity theory**: Mental states are identical to physical states (like temperature is mean kinetic energy). Then M = P*, so M's causation is just P*'s causation. There is no overdetermination because it's the same cause. But is this preserving mental causation? Yes, because the mental type is the physical type, so when we say M causes P, it's the same as P* causing P. However, it reduces the mental to the physical, so some might argue that it doesn't preserve the mental as distinct. But in terms of non-redundancy, it avoids overdetermination by identity. So it should be high.

  2. **Davidson's anomalous monism**: Mental events are token-identical to physical events, but there are no strict psychophysical laws. So each mental event is a physical event, but mental types are not reducible. Then when M (a token) causes P, it is because it is the physical token P* that causes P. But then the mental property itself doesn't seem to do any causal work; it's the physical property that does. So Kim's critique is that the mental qua mental doesn't cause, only qua physical. So it doesn't preserve mental causation at the property level. Thus, it may not fully solve the problem.

  3. **Shoemaker/Wilson "subset of causal powers"**: A mental property is realized by a physical property, and the causal powers of the mental property are a subset of the causal powers of the physical property. Then when the mental property is instantiated, it has its own causal powers that are not additional to the physical, but a subset. So there is no overdetermination because the mental cause is not competing with the physical; it's a part of it. This seems to preserve non-redundant mental causation without overdetermination.

  4. **Yablo's determinate/determinable move**: Mental properties are determinables of which physical properties are determinates. For example, being colored is a determinable of being red. Then the mental (as determinable) and the physical (as determinate) are not in competition; the cause is the same event under two descriptions. The mental cause is not redundant because it is the same causation but at a higher level of abstraction. This avoids overdetermination and preserves mental causation.

  5. **List and Menzies' interventionist difference-making account**: Uses causal modeling and interventions. A mental state M causes P if, holding fixed the physical realizer, interventions on M make a difference to P. But if the physical realizer is fixed, then interventions on M might not be possible without changing the physical. This is tricky. They argue that at a higher level, M can be a difference-maker even if the lower level is fixed. This might preserve mental causation as a higher-level cause without overdetermination.

  6. **Biting the overdetermination bullet**: Accepts that both M and P* cause P, but argues that this kind of overdetermination is benign (like the bullet from two assassins). But Kim argues that systematic overdetermination by mental and physical causes is not benign because the physical cause is already sufficient. So it doesn't solve the problem; it just accepts redundancy.

  7. **Strong emergentism with downward causation**: Mental properties emerge from the physical but have novel causal powers that can influence the physical. This requires denying the causal closure of the physical because the mental cause would be an additional influence. If it denies closure, then it avoids exclusion, but it faces the problem of how such emergence is possible and might be seen as dualism. However, it does preserve mental causation as non-redundant.

  8. **Denying the causal closure of the physical outright (interactionist dualism)**: If the physical is not causally closed, then P* might not be sufficient, and M can cause P without overdetermination. But this is a form of dualism, which many physicalists reject. It does preserve mental causation, but at the cost of rejecting a key physicalist principle.

