  ## Memorandum: Recommendation on Main Street Feed Store Landmark Designation

  **To:** Historic Preservation Commission Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Landmark Designation Application for 1888 Feed Store Site  

  This memo addresses the application for Landmark designation and associated tax abatement for the former Main Street feed store. We agree on the facts: the building has occupied the same foundation serving the same function since 1888, but due to fires, renovations, and flood repairs, **no physical material from 1888 remains.** Our ordinance requires a Landmark to have "retained its historic character since original construction."  

  The disagreement centers on interpreting "retained its historic character." Both perspectives presented are valid but emphasize different aspects of preservation:  

  1.  **Material Integrity (Opposing Designation):** This view holds that "retained historic character" necessitates the survival of original physical fabric. Character is embodied in the tangible evidence of time, craftsmanship, and materials. A building entirely replaced, even incrementally, becomes a reconstruction or replica on the historic site, not the retained historic structure itself. The tax abatement is an incentive to preserve *that original fabric*.  
  2.  **Continuous Identity & Function (Supporting Designation):** This view prioritizes the building’s unbroken presence, function, and location as the core of its "character." The *idea* of the feed store – its constant role in the town's commercial life on its original footprint – constitutes its historic character, regardless of material replacement driven by necessity.  

  **Recommendation: Deny the Landmark designation.**  

  **Reasoning:**  

  1.  **Ordinance Language:** The phrase "retained its historic character **since original construction**" strongly implies continuity of the *original built entity*. "Retained" suggests holding onto something existing from the start. While "character" can be multifaceted, the modifying phrase "since original construction" anchors it to the physical structure begun in 1888. If *nothing* from that original construction remains, it is difficult to argue that the *building itself* has "retained" its character in the tangible sense the ordinance likely intends.  
  2.  **Purpose of Tax Abatement:** The tax incentive is a tool to offset the *costs and constraints of preserving original historic fabric*. Where no original fabric exists requiring preservation, the primary justification for this specific financial incentive is absent. Granting the abatement here would dilute its purpose and potentially divert funds from structures demonstrably preserving vulnerable original material.  
  3.  **Precedent:** Approving this application would establish a precedent where *any* structure continuously occupying a historic site, regardless of material replacement, could qualify. This risks undermining the core mission of material preservation central to most historic commissions and could overwhelm the Landmark program with structures lacking tangible historical integrity, contrary to the ordinance's likely intent.  
  4.  **Acknowledging the Counter-Argument:** We fully recognize the profound *historical significance of the site and its continuous function* since 1888. The feed store's enduring presence *is* a landmark in the town's collective memory and narrative. This significance, however, is distinct from the *architectural/material integrity* explicitly required by the Landmark ordinance for the tax abatement.  

  **Engaging the Losing Side:**  

  To those favoring designation: Your argument powerfully captures the building's *cultural and historical importance as a persistent community institution*. Denying the *Landmark designation* under this specific ordinance does not diminish this significance. It simply means the *current structure*, as a physical artifact, does not meet the threshold of *material retention* set by our ordinance for this particular status and incentive. We should actively explore other ways to honor this site:  

  *   **Plaque/Interpretation:** Commission a historical plaque detailing the site's 135-year continuous history.  
  *   **Alternative Recognition:** Propose a new category (e.g., "Heritage Site") recognizing long-term continuous use, distinct from architectural preservation (though this requires ordinance amendment).  
  *   **Support Adaptive Reuse:** Encourage a historically sensitive reuse that respects the building's form and context.  

  **Conclusion:**  

  While the feed store site holds undeniable historical value for its continuous role, the Landmark designation and tax abatement under our current ordinance are reserved for structures preserving tangible evidence of their origins. Granting it here, despite the complete loss of original material, stretches the phrase "retained its historic character since original construction" beyond its reasonable meaning and risks unintended consequences for future applications. I recommend we **deny** the Landmark designation but commit to finding alternative ways to formally recognize the site's unique contribution to our town's story.  

  Respectfully,  
  [Your Name]
