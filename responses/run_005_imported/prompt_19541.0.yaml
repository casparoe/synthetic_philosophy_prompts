     - Over-medicalizes normal variations.

  2. **Nordenfelt (Welfare Theory):**  
     - Flexible patient-centered view.  
     - Handles drapetomania/infertility well but risks over-subjectivity (e.g., if ADHD goals aren't impaired).  
     - May pathologize socially-induced suffering.

  3. **Wakefield (Harmful Dysfunction):**  
     - Best balance: biological dysfunction + harm requirement.  
     - Correctly rejects drapetomania (no dysfunction), contextualizes infertility (harm-dependent), and validates ADHD/grief.  
     - Avoids most "dumb verdicts" by requiring both elements.

  **Key Trade-offs:**  
  - Boorse is "objective" but ethically blind.  
  - Nordenfelt is humane but risks medicalizing all suffering.  
