answer: |-
  Your instinct and your great-aunt's position both capture important aspects of confirmation, reflecting a deep tension in epistemology known as the **Problem of Old Evidence**. Here's a breakdown of why both views have merit, and how Bayesianism addresses this:

  ### The Core Issue: Can Old Evidence Confirm?
  - **Your view (Intuitive Skepticism):** If you were *already certain* the watering happens at 4 p.m. (probability = 1), then learning the mill theory *cannot* raise your confidence. Formally: if P(E) = 1, then P(H|E) = P(H), meaning E provides no confirmation to H. Your certainty "drains" E's evidential power.
  - **Your aunt's view (Explanatory Power):** A good theory *should* explain known facts. If her mill theory elegantly accounts for why the watering time is 4 p.m. (rather than, say, 10 a.m. or 6 p.m.), that seems like a point in its favor—especially if alternative theories don't explain it.

  ### How Bayesians Reconcile This
  Bayesians handle this by considering your beliefs *before* you learned E (the 4 p.m. watering fact), or by assessing how well H *predicts* E. Here are two solutions:

  1. **The Counterfactual Approach (Garber, Jeffrey):**  
     Ask: *How much more likely would E have been if you'd assumed H was true, **before** you learned E?*  
     - Suppose you *hadn't* known about the 4 p.m. watering. Your aunt's mill theory predicts E with high probability: P(E|H) ≈ 1 (mills strongly correlate with 4 p.m. signals).  
     - Alternative theories (e.g., "random choice") might assign P(E|¬H) very low (e.g., 1/168 if any hour in the week is equally likely).  
     - **Result:** E strongly supports H because P(E|H) >> P(E|¬H), even though you knew E already.  

  2. **The Logical Learning Approach (Glymour):**  
     When you learn H *explains* E, you're really learning a new fact: *"H entails E"* (or makes E much more likely). *This* is the new evidence.  
     - Before the aunt's theory, you knew E but didn't know *why* it was true.  
     - Learning "H → E" (and that P(E|H) is high) *is* new information that can boost P(H).

  ### Why Your Aunt Isn't Wrong
  - **Explanatory virtue matters:** Her theory *discriminates* between possible worlds. A theory that fits 4 p.m. perfectly is better than one that fits *any* time equally well, or one that clashes with E.  
  - **Base rates are key:** Without the mill theory, the *coincidence* of 4 p.m. being chosen randomly is unlikely. Her theory resolves this by providing a causal mechanism.  
  - **Historians' methodology:** As your aunt notes, historians *must* explain known facts. A theory explaining *only* newly discovered evidence would be suspect.

  ### Why Your Skepticism is Justified
  - **Certainty blocks confirmation:** If you're truly *certain* of E (P(E)=1), strict Bayesianism says E can't confirm H. This highlights a limitation: agents rarely have absolute certainty.  
  - **Risk of "just-so" stories:** One can always invent post-hoc explanations for known facts. Your worry protects against unfalsifiable theories.  
  - **The evidence isn't *new*:** Your day-to-day experience didn't change. The "evidence" is the *fit* between H and E, not E itself.

  ### Resolution: What Counts as "Evidence" Here?
  - **The raw fact (E):** "We water at 4 p.m."  
    *This* doesn't confirm H for you, as you knew it with certainty.  
  - **The explanatory link (H ⊃ E):** "If the mill theory is true, the 4 p.m. timing is likely."  
    *This* is new information that confirms H, as it shows H *accounts for* E better than alternatives.  

  ### Practical Advice
  1. **Moderate your certainty:** Rarely are we *absolutely* certain. Allow a tiny probability that you're mistaken about E (e.g., "Could the time have changed before my lifetime?"). This lets E retain some confirmatory power.  
  2. **Focus on alternatives:** Compare the mill theory to specific rivals (e.g., "It was randomly chosen," "It was when church ended"). Does H explain E *better* than these?  
  3. **Acknowledge context:** For historians (or your aunt), E *is* new evidence *for the hypothesis*, because they didn't know H could explain it. For you, the confirmation comes from seeing H's *explanatory scope*.  

  **Conclusion:** Your aunt is correct that her theory gains credibility by explaining the 4 p.m. watering, but not because the *fact itself* is new evidence for you. Instead, the *fit* between her theory and this fact demonstrates its explanatory power over alternatives. Your instinct highlights a genuine nuance in confirmation theory—certain evidence can't boost hypotheses—but in practice, we recognize that old evidence supports theories by being *explained* by them. This is why historians (and your aunt) see it as confirmation, and Bayesianism can justify this through counterfactual reasoning.
