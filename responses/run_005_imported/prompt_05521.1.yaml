prompt: |-
  I'm a student member of my high school's Honor Council, which hears academic-integrity cases and votes on findings. We're deadlocked on a case, and I'd like a memo to circulate before we reconvene next Tuesday.

  A classmate's English essay was flagged by our school's AI-writing detector as 71% likely to be AI-generated. The council members who read it closely didn't notice anything that struck them as templated, his handwritten in-class drafts are stylistically consistent with it, and he denies using AI. Our handbook says a flag "shall be weighed alongside all other available evidence," but doesn't say how heavily. Half the council wants to treat the flag as close to decisive: we were told when the school adopted the tool that trained readers are barely better than chance at spotting AI prose by eye, while the detector's own accuracy is much higher, and nobody on the council can name a specific flaw in its read of this essay -- only their own impression that it seems genuine. The other half thinks our impression should outweigh a general accuracy statistic, partly because the detector can't explain itself case by case and is known to misfire more often on some writing styles than others, including that of non-native English speakers. One teacher summed up her own position bluntly: she doesn't believe the essay is AI-written, but thinks the council should rule as though it is, since the detector knows better than she does.

  Please draft the memo I'll circulate. It should recommend a specific finding for this case and a standard the council can reuse for future flags, and it should take the strongest version of the "defer to the detector" position seriously rather than dismissing it.
reasoning: |-
  Okay, the user is part of their high school's Honor Council and they're stuck on a case involving an AI-writing detector. The essay was flagged as 71% likely AI-generated, but there's conflicting opinions. Some council members want to trust the detector almost completely, while others think their own impressions should matter more. The user needs a memo to break the deadlock, recommending a specific finding and a standard for future cases. They also want to take the "defer to detector" stance seriously.

  First, I need to understand the key points. The handbook says the detector flag should be considered alongside other evidence, but doesn't specify weight. The pro-detector side argues that humans are bad at spotting AI, and the detector's accuracy is higher. The anti-detector side points out that the detector can't explain itself and has biases, especially against non-native speakers. Plus, the student denies using AI, and the drafts are consistent.

  The memo needs to address both sides without dismissing either. The user emphasized taking the "defer to detector" position seriously. So, the memo should acknowledge the detector's value but also its limitations. The challenge is balancing statistical accuracy with human judgment.

  I should consider the 71% likelihood. It's not a certainty, so it's not definitive. Also, the council's close reading found nothing suspicious, and the drafts match stylistically. That's tangible evidence. The detector's inability to explain specific cases is a valid concern, especially with known biases.

  The teacher's comment about ruling as if it's AI even if she believes otherwise is tricky. Blindly trusting the tool undermines the council's role. The council's job is to evaluate all evidence, not just follow a tool. 

  The proposed solution in the memo should set a standard: use the detector as an initial alert but require corroborating evidence. In this case, since there's no other proof and the drafts support the student, the finding should be "Not Responsible". Future cases need a checklist: consistency with drafts, stylistic analysis, student testimony, and detector results. 

  Also, emphasizing that the detector's percentage isn't a verdict but a prompt for deeper investigation. Highlighting the importance of human judgment and the council's responsibility to interpret evidence. This approach respects the detector's role while maintaining the council's authority. 

  The memo structure should outline the case facts, arguments for both sides, then the recommended standard and finding. Using neutral language to avoid alienating either faction. Concluding with procedural steps for future cases to ensure consistency.
answer: |-
  ## Memorandum: Honor Council Standard for AI Detector Evidence

  **To:** Honor Council Members  
  **From:** [Your Name], Student Member  
  **Date:** October 26, 2023  
  **Subject:** Resolution for Case # [Case Number if applicable] & Establishing Standard for AI Detector Flags  
  **Re:** Reconvening on Tuesday, October 31st  

  ### Case Background
  Case # [Number] involves an English essay flagged by our school's AI-writing detector at a 71% likelihood of being AI-generated. Key points from our deliberation:
  1.  **Detector Flag:** The tool output a 71% likelihood score.
  2.  **Council Review:** Members conducting a close reading reported no specific textual anomalies suggesting AI generation; the essay did not strike readers as "templated" or inconsistent with human writing at that level.
  3.  **Supporting Evidence:** The student provided handwritten in-class drafts. The council observed stylistic consistency between these drafts and the final essay.
  4.  **Student Testimony:** The student categorically denies using AI.
  5.  **Handbook Guidance:** Policy states the detector flag "shall be weighed alongside all other available evidence," without specifying weight.

  ### Council Deadlock
  The council is divided on the interpretation of the detector flag:
  *   **Position A (Defer to Detector):** Argues the detector's reported high accuracy (significantly exceeding human ability to detect AI by eye) makes the 71% flag highly probative. Absent a *specific, demonstrable flaw* in the detector's analysis of *this specific essay* (beyond a general impression of authenticity), this evidence should be treated as near-decisive. The teacher's comment ("rule as though it is") reflects this view's core principle: the tool's statistical reliability should supersede individual human judgment in ambiguity.
  *   **Position B (Holistic Assessment):** Argues that the council's careful reading, combined with the stylistic consistency with verifiable drafts and the student's denial, constitutes compelling counter-evidence. Concerns include the detector's inherent opacity ("black box" nature), documented higher error rates with certain writing styles (including non-native speakers), and the principle that statistical claims should not automatically override case-specific human evaluation of tangible evidence.

  Both positions raise valid concerns about fairness, evidence weight, and institutional trust.

  ### Proposed Standard: "Corroboration Threshold" for AI Detector Evidence
  After careful consideration of both arguments, particularly the strong case made for the detector's statistical reliability by Position A, **I propose we adopt the following standard for future cases involving AI detector flags:**

  1.  **The Detector Flag is Probative, Not Presumptive:** An AI detector flag is *significant* evidence meriting serious investigation. It cannot be ignored or dismissed lightly.
  2.  **Requirement for Corroboration:** **A detector flag alone, especially one below certainty (e.g., <90-95%), is insufficient grounds for a "Responsible" finding.** To support a finding of academic dishonesty based primarily or significantly on an AI detector flag, **corroborating evidence must exist.**
  3.  **Corroborating Evidence Includes:**
      *   **Inconsistencies:** Specific, demonstrable inconsistencies between the flagged work and the student's verifiable work (e.g., drafts, in-class writing, prior submissions) in style, vocabulary, syntax, or knowledge depth.
      *   **Anomalies:** Textual anomalies strongly suggestive of AI generation (e.g., factual hallucinations, generic phrasing inconsistent with prompt depth, sudden stylistic shifts within the text) identified *in the specific work*.
      *   **Admission/Contradiction:** Partial admission, evasiveness, or testimony directly contradicted by evidence.
      *   **Process Violation:** Evidence the student circumvented required drafting/process steps.
  4.  **Absence of Corroboration:** If a thorough investigation (including close reading, review of drafts, and student testimony) reveals **no corroborating evidence** as defined above, and particularly if there is **positive evidence of consistency** (like matching drafts), the detector flag, while noted, **cannot carry the burden of proof for a "Responsible" finding.**

  **Rationale:** This standard respects the detector's value as an investigative tool (Position A) while acknowledging its documented limitations and the fundamental principle of our process: we adjudicate based on the *totality of evidence in the specific case* (Position B). It prevents over-reliance on a probabilistic tool that cannot explain itself case-by-case and is known to have biases. It places the burden where it belongs: on the council to find *specific reasons* within the case evidence to support the detector's probabilistic output. A flag triggers investigation; corroboration is required for conviction.

  ### Recommendation for Case # [Number]: Finding of "Not Responsible"
  Applying this proposed standard to the current case:

  1.  **Detector Flag:** Present (71%).
  2.  **Corroborating Evidence Sought:**
      *   *Inconsistencies?* Council review found none; drafts are stylistically consistent.
      *   *Anomalies?* Council review identified none ("nothing struck them as templated").
      *   *Admission/Contradiction?* Student denies use; no testimony contradiction found.
      *   *Process Violation?* None alleged or evident.
  3.  **Positive Evidence:** Stylistic consistency between final essay and verifiable handwritten drafts.
  4.  **Analysis:** The 71% flag triggered our investigation. However, **no corroborating evidence** supporting AI use was found through close reading or review of the student's work process. Conversely, **positive evidence of consistency** exists. While the detector's statistical accuracy is a valid concern, in *this specific instance*, the tangible evidence we examined contradicts the flag's implication. The burden of proof is not met solely by the flag without corroboration.

  **Therefore, I recommend a finding of "Not Responsible" for Case # [Number].**

  ### Path Forward for Tuesday
  1.  **Discussion:** Let's use Tuesday's session to debate this proposed "Corroboration Threshold" standard. Does it fairly balance the concerns raised by both sides of our deadlock?
  2.  **Vote on Standard:** Aim to formally adopt (or adapt) a clear standard for handling AI detector evidence moving forward.
  3.  **Vote on Case:** Apply the newly agreed standard (or this proposal if adopted) to Case # [Number] for a final vote.

  Adopting a clear, principled standard is crucial for fairness, consistency, and the integrity of our council. This proposal seeks to honor the detector's role as an alert system while upholding our responsibility to render judgments based on the specific evidence before us.

  **Attached:** [Optional: Brief summary of detector accuracy claims & known bias concerns if available from school training materials]
