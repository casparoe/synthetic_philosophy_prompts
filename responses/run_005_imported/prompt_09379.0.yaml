  But I should acknowledge the valid points too. The postdoc is right that the Church-Turing thesis isn't mathematically proven, and hypercomputation is a legitimate thought experiment in philosophy. Her proposal does challenge conventional thinking, which aligns with the fund's purpose. The strongest argument for funding might be that even a failed prototype could yield insights into computational limits or inspire new approaches.

