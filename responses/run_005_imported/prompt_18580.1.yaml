  The linguistics angle is a bonus hook—they'll like how "pragmatic encroachment" mirrors Gricean implicature, where context alters meaning. Might even bridge to Austin's performative utterances if feeling adventurous. But stay focused: their main need is epistemological validation, not linguistic theory. 

