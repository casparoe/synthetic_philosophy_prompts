  **MEMORANDUM**  
  To: Collections Committee  
  From: [Your Name], Collections Committee & Systems Lead  
  Date: October 26, 2023  
  Subject: Recommendation for Apple-1 Unit Reclassification & Display  

  ### Background  
  Our Apple-1 unit (Accession #XYZ-76) was recently reassessed by an independent collector/authenticator. Their findings suggest the board was likely assembled in the early 1980s using period-correct components (including original chips) and Wozniak’s schematic, rather than during the 1976 garage assembly. It is **not** a modern replica, but a skilled contemporary build.  

  ### The Core Question: Does Provenance Change the Object?  
  One argument posits that since the physical board remains materially and functionally identical to an original, only our *knowledge* of it has changed. This echoes the "partscaster" analogy in vintage guitars, where a later assembly of genuine old parts holds less market value than a factory-original—despite identical materials and performance.  

  **Where this argument holds:**  
  - Materially, our board is indistinguishable from a 1976 unit.  
  - It retains historical value as a working artifact of early computing culture.  
  - Functionally, it demonstrates the same engineering as a "true" Apple-1.  

  **Where it falls short for a museum:**  
  1. **Museums prioritize narrative, not just materiality.**  
     An object’s significance lies in its *context*. A 1976 board embodies Silicon Valley’s founding myth; a 1980s build reflects the underground hobbyist culture that preserved Apple’s legacy. These are distinct stories.  
  2. **Provenance is integral to authenticity.**  
     "Authenticity" in museums isn’t binary. Our board is *component-authentic* but *historically displaced*. Failing to clarify this risks misrepresenting the artifact’s role in computing history.  
  3. **Trust requires transparency.**  
     Visitors and scholars rely on us for accuracy. If we withhold reasonable doubts about provenance, we undermine institutional credibility.  

  ### Recommendation: Relabel with Context & Adjust Value  
  I propose we **relabel the unit** to reflect its reassessed provenance while keeping it on display, for these reasons:  

  1. **Educational Opportunity**  
     - This is a rare chance to showcase how historical narratives evolve with new evidence.  
     - Label text could highlight:  
       *"Early Apple-1-Compatible Unit (c. 1980–1983). Assembled by skilled hobbyists using original chips and schematics. Demonstrates the community effort to preserve Apple’s legacy before commercial reissues."*  

  2. **Balances Integrity and Access**  
     - Removing the board penalizes visitors for our revised understanding.  
     - Retaining the "original" label obscures a richer story about vintage computing’s grassroots culture.  

  3. **Value Reflects Significance, Not Just Rarity**  
     - Insured value should be adjusted downward (aligning with "partscaster" logic), as auction data confirms provenance heavily impacts worth.  
     - However, its value to *our mission* remains high: it exemplifies a unique niche in tech history—the "shadow" builds bridging Apple’s garage era and the collector boom.  

  ### Addressing Concerns  
  - **"We can’t prove it’s not original"**: While true, museums label based on best available evidence. "Likely c. 1980s" is more accurate than the current claim.  
  - **"It’s still special"**: Agreed. Relabeling elevates its uniqueness rather than diminishing it.  
  - **"Visitors won’t care"**: Our role is to educate, not cater to assumptions. A well-crafted label can make provenance compelling.  

  ### Proposed Label Wording  
  > **APPLE-1 COMPATIBLE HOMEBREW UNIT (c. 1980–1983)**  
  > *This board was assembled by skilled hobbyists using original, period-correct chips and Steve Wozniak’s 1976 schematic. While not part of Apple’s first 200 units, it reflects the ingenuity of early computer enthusiasts who preserved and extended the Apple-1’s legacy during a time when the machine was commercially unavailable.*  
  > *[Include high-res images comparing solder joints/date codes to a confirmed 1976 unit]*  

  ### Action Requested  
  Vote to approve relabeling and insurance adjustment, effective 11/30/2023. The unit remains on display as a testament to the passion that sustains technological heritage.  

  Respectfully submitted,  
  [Your Name]  

  ---  
  **Key Takeaways for Committee Discussion:**  
  - **Museums ≠ Auction Houses**: Our goal isn’t maximizing monetary value but contextual truth.  
  - **Ambiguity is Informative**: Not knowing the exact builder adds mystery—not weakness—to the narrative.  
  - **Precedent Setting**: Clear policies for "gray area" artifacts will strengthen future collections decisions.
