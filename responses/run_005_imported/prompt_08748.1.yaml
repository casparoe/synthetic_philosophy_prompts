prompt: |-
  My siblings and I are setting up a family trust that will pay out to our descendants over the next several generations, and one of my sisters wants to build in a rule that discounts each successive generation's share purely because it arrives later in time — so that, say, a great-grandchild born in 2090 would be entitled to a smaller real payout than a grandchild born in 2035, even after fully adjusting for how much the trust's investments will have grown by then and for any uncertainty about who will actually be around to collect it. Her reasoning is simply that a given amount of wellbeing counts for less, from where we're sitting now, the further in the future it occurs. Something about this strikes me as mistaken, but I haven't been able to turn that reaction into an actual argument. Is she doing something wrong, or is discounting people's welfare purely because they will live later actually defensible?
reasoning: |-
  Okay, the user is dealing with a family trust setup where one sister wants to discount future generations' payouts purely based on time. They're wondering if this is defensible or mistaken. Let me unpack this.

  First, the sister's reasoning is that well-being in the future is less valuable now. The user feels uneasy but can't articulate why. I need to explain both sides. 

  The sister's view is like pure time preference in economics. People often prefer present benefits over future ones. But applying this intergenerationally is controversial. The user might be uncomfortable because it feels unfair to future descendants just because they're born later.

  Key ethical issues: Future people are equally deserving. Discounting their well-being treats them as less important. Also, the trust is meant to benefit descendants, so why reduce their share? There's a conflict between the sister's time preference and the trust's purpose.

  Practical risks: If payouts decrease over time, later generations might get less in real terms, even if the trust grows. This could cause resentment. Plus, predicting inflation and investment returns is hard. Adjusting for time might not work as intended.

  Alternatives: Maybe use needs-based distributions instead of time discounts. Or invest to ensure equal real value. The user needs solutions that align with the trust's goal of family support across generations.

  Underlying needs: The user might want fairness and family harmony. The sister might be worried about the trust's longevity or present family needs. Addressing both concerns without arbitrary discounts could be better. Suggesting a consensus on core values might help them find a middle ground.
answer: |-
  That's a profound ethical and economic question at the heart of intergenerational justice. Your sister's position (applying a *pure time preference discount rate* to the *wellbeing* of future descendants) is controversial and, in the view of many philosophers and economists, ethically problematic. Here's a breakdown of why:

  1.  **The Core Ethical Problem: Arbitrary Discrimination:**
      *   Discounting wellbeing *solely* because it occurs later in time treats the interests of future people as inherently less valuable than the interests of present or near-future people, simply because of *when* they exist.
      *   This violates a fundamental principle of most ethical systems: the principle of *impartiality*. We generally believe that the *identity* of a person (including their location in space or time) shouldn't affect the moral weight we give to their wellbeing. A unit of suffering or flourishing is equally bad or good, regardless of *who* experiences it or *when*.
      *   **Analogy:** Imagine discounting the wellbeing of people born in a different country purely because of their geographic location. We'd likely see that as unfair discrimination. Discounting purely based on temporal location faces the same objection.

  2.  **Contrast with Standard Economic Discounting:**
      *   Your sister is *not* proposing the standard reasons for discounting future *monetary* payouts:
          *   **Productivity of Capital (Opportunity Cost):** Money today can be invested to yield more money tomorrow. This justifies discounting *future dollars* to reflect their lower *present economic value* compared to dollars today. *This is about the growth potential of money, not the inherent value of wellbeing.*
          *   **Risk/Uncertainty:** The further in the future, the greater the uncertainty about whether the beneficiary will exist, what the trust assets will be worth, or whether the payout will even happen. Discounting accounts for this risk. *This is about probability, not devaluing wellbeing itself.*
          *   **Inflation:** Future dollars may buy less. Discounting aims to maintain *real* purchasing power. *This preserves the value of the payout, it doesn't discount wellbeing.*
      *   **Her Proposal:** She wants to discount *even after* accounting for these factors. She wants the *real wellbeing* (the actual goods, services, experiences, opportunities the money can buy) of a future descendant to be considered *less valuable* simply because it happens later. This is discounting the *utility* or *welfare* itself.

  3.  **Arguments Against Pure Time Preference for Wellbeing:**
      *   **The "Why Stop There?" Argument:** If we discount wellbeing merely because it's in the future, why stop at generations? Why not discount the wellbeing of our own future selves next year compared to today? Most people wouldn't accept a drastic devaluation of their *own* future wellbeing purely due to time. Why treat descendants differently?
      *   **Undermining the Purpose of a Perpetual Trust:** A multi-generational trust inherently expresses a commitment to the welfare of *future* family members. Applying a pure time preference discount directly contradicts this long-term purpose. It signals that descendants born later are less important to the founders.
      *   **Practical Perpetuity Problems:** A constant discount rate applied indefinitely mathematically reduces the *present value* of wellbeing in the distant future to near zero. This makes it ethically impossible to justify *any* significant sacrifice today for enormous benefits centuries from now. This is highly problematic for addressing very long-term issues like climate change or nuclear waste storage – and arguably for sustaining a meaningful family legacy.
      *   **Unfair Burden:** It places an arbitrary disadvantage on descendants purely due to their birth date, over which they have no control. Their needs or potential contributions are deemed less worthy simply because they exist later.
      *   **Lack of Foundational Justification:** It's hard to find a strong *ethical* reason why the date of birth should diminish the moral weight of a person's interests. Preference for the present is often seen as a psychological bias or a practical concession to uncertainty, not a sound ethical principle.

  4.  **Arguments *For* Pure Time Preference (and Counterarguments):**
      *   **Revealed Preference/Observed Behavior:** People *do* act as if they prefer present benefits. *Counter:* This describes how people *do* behave, not how they *should* behave ethically, especially when making irrevocable decisions affecting others who have no say (future generations).
      *   **Extinction Risk:** There's a non-zero chance humanity (or the family line) won't exist in the distant future. Discounting accounts for this. *Counter:* This is a valid reason for *risk-adjusted* discounting (uncertainty), which you explicitly want to exclude. It's not a justification for devaluing wellbeing *if* they do exist. A pure time preference discount would apply *even if* survival was guaranteed.
      *   **Paternalism/Changing Values:** Future generations might have different values, so our assessment of their wellbeing might be wrong. *Counter:* This argues for humility and flexibility in the trust structure (e.g., allowing trustees discretion), not for systematically devaluing their wellbeing. We must make the best judgment we can based on our values *now* about what constitutes wellbeing.
      *   **Affordability/Feasibility:** Ensuring equal real wellbeing indefinitely might be financially impossible. *Counter:* This is a practical constraint that might necessitate *some* adjustment, but it should be based on realistic projections of trust growth, inflation, and family size, not an *a priori* devaluation of future wellbeing. The goal should be to get as close to fairness as feasible, not build in systematic bias.

  5.  **A Better Approach (Suggestions for Your Trust):**
      *   **Focus on Equal Real Value (or Equal Growth):** Structure distributions so each beneficiary receives a payout with equivalent *purchasing power* (adjusted for inflation) or a payout that grows at a rate reflecting the trust's *real* return (inflation + real growth), ensuring the trust corpus maintains its real value per capita over time. This focuses on the *means* (money) to achieve wellbeing, not discounting wellbeing itself.
      *   **Needs-Based or Discretionary Distributions:** Frame distributions around *need* or *specific purposes* (education, health, home purchase) rather than fixed generational shares. Give trustees discretion to consider circumstances, potentially mitigating the impact of timing without an arbitrary discount.
      *   **Per Capita Basis:** Ensure distributions account for the *number* of beneficiaries in each generation to avoid dilution, rather than applying a time discount.
      *   **Explicitly Reject Pure Time Preference:** In the trust documents, state that distributions are intended to provide equivalent real economic opportunity or support to beneficiaries regardless of when they are born, subject only to adjustments for investment performance, inflation, uncertainty, and feasibility. This codifies the ethical principle of impartiality.
      *   **Seek Consensus on Core Values:** Have a family discussion focused on the *purpose* of the trust. Is it primarily about *your* legacy and control, or about supporting *future family members* as fully as possible? If it's the latter, pure time preference is hard to justify.

  **Conclusion:**

  Your intuitive discomfort is well-founded. Discounting the *wellbeing* of future descendants purely because they live later in time is ethically dubious. It constitutes arbitrary discrimination against individuals based solely on their birth date, violating principles of impartiality and fairness. It undermines the long-term purpose of a generational trust.

  While standard economic discounting for money (due to investment growth, risk, and inflation) is essential for prudent financial management, it aims to preserve the *real value* of the payout. Your sister's proposal goes beyond this; it deliberately reduces the *moral weight* assigned to the future beneficiary's wellbeing itself. This is difficult to defend on sound ethical grounds.

  Focus instead on mechanisms designed to deliver *equal real economic support* (adjusted for inflation and trust growth) or to respond to beneficiary needs, explicitly rejecting the notion that wellbeing diminishes in value over time. This aligns the trust structure with the principle that the welfare of all descendants, whenever born, matters equally.
