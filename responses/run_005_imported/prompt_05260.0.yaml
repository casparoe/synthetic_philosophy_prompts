    "S": ["The Banach-Tarski paradox", "There exists a Lebesgue non-measurable set of reals"],
    "A": ["The real numbers can be well-ordered", "There's a discontinuous, non-linear solution to f(x+y) = f(x) + f(y)"],
    "B": ["Every vector space has a basis (a Hamel basis)", "Every filter on a set extends to an ultrafilter"],
    "C": ["Every field has an algebraic closure", "Every commutative ring with unity has a maximal ideal", "Tychonoff's theorem for arbitrary (not just finite) products of compact spaces"],
    "D": []
  }
  ```
