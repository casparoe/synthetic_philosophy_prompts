  2. **Every field has an algebraic closure**: The existence is non-constructive, but for countable fields, we can build an algebraic closure constructively. However, for arbitrary fields, it requires choice. This might be less troubling than results that are inherently paradoxical.

  3. **The Banach-Tarski paradox**: This is a classic counterintuitive result that relies on non-measurable sets and the axiom of choice. It decomposes a ball into finitely many pieces and reassembles into two balls of the same size. This is extremely troubling for anyone who believes in the conservation of volume in a straightforward way.

  4. **There exists a Lebesgue non-measurable set of reals**: The existence of non-measurable sets is a direct consequence of the axiom of choice and is required for Banach-Tarski. It is troubling because it shows that not every set of reals can be assigned a consistent measure. The Vitali set is a classic example.

