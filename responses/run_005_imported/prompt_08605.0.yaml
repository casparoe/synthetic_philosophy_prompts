answer: |-
  You're wrestling with a genuinely heartbreaking situation where there are no villains, only human limitations and painful consequences. While your friend is *logically* correct (you **literally** couldn't be in two places at once), he's overlooking the profound **emotional truths** at play, which is why your guilt persists. Here's why both perspectives hold weight:

  **Why Your Friend is Logically Right:**

  1.  **Physical Impossibility:** This is the core fact. You are one person. Geography and time are real constraints. Choosing one *necessitated* not choosing the other in that immediate moment.
  2.  **No "Better" Choice Existed:** You made a snap decision based on the information you had:
      *   **Perceived Urgency:** A panic attack feels like a *right now* life-or-death psychological emergency. Urgent care implies medical professionals are *already* present handling the physical injury.
      *   **Immediate Need vs. Managed Care:** Your friend having the panic attack needed *your* presence *immediately* as emotional first aid. Your friend at urgent care needed a *ride home* after being medically assessed and treated. The *immediate* crisis presentation differed.
  3.  **Outcome Wasn't Guaranteed:** Even if you'd chosen differently, rushing to urgent care might have meant arriving *after* the panic attack friend had spiraled into a dangerous situation.
  4.  **Bad Luck:** The simultaneity was cruel coincidence, not negligence on your part.

  **Why Your Guilt Makes Emotional Sense (And Isn't Just Illogical):**

  1.  **You Love Both Friends & Made a Promise (Implied):** Being a close friend means implicitly promising "I'll be there when you need me." To *one* friend, in that critical moment, you couldn't fulfill that promise through no fault of your own. The guilt stems from the genuine desire to be there for both and the pain of failing one, *even if unavoidable*.
  2.  **Your Injured Friend's Pain is Real & Valid:** Her feeling hurt isn't irrational. She was scared, vulnerable, injured, and alone in a medical setting. She needed *her* person. The coworker was a practical solution, not an emotional replacement. Her hurt comes from a place of deep dependence on you. Her feelings don't accuse you of malice, but they highlight the consequence of your unavoidable choice.
  3.  **"Owing" Comes From Care, Not Contract:** You feel you "owed" her because you deeply care for her. This sense of debt isn't about transactions; it's about the depth of your commitment to her well-being. Failing to meet that commitment *feels* like a betrayal, even if logic absolves you.
  4.  **The Weight of the Choice:** Making an impossible triage decision is traumatic. Choosing means *not choosing* someone else who also desperately needs you. That carries inherent emotional weight and sorrow, which manifests as guilt. It's survivor's guilt, but for caregivers.
  5.  **Could Communication Have Helped? (The Nagging "What If?"):** This is often the core of the guilt: "Could I have done *something* differently *before* physically arriving?" Did you:
      *   **Call/text the urgent care friend IMMEDIATELY?** Explaining the situation ("Friend A is having a severe panic attack, I'm heading there first. I am coming to you as fast as I can after, but it might be a few hours. Can I call someone for you NOW? I'm so sorry.")?
      *   **Try to arrange alternative help?** Even a quick text: "Stuck helping Friend A in crisis, can't get to you fast. Can I call [mutual friend/coworker/ride service] for you right now? I'll be there ASAP."
      *   **Manage Expectations?** Telling her upfront there would be a significant delay might not have erased her hurt, but it could have prevented the shock and feeling of being forgotten.

  **The Verdict: Logic vs. Heart**

  *   **Logically:** Your friend is correct. You made the best impossible choice you could in a crisis. You are not *culpable*.
  *   **Emotionally & Relationally:** Your guilt is understandable and stems from love and empathy. The *outcome* for your injured friend *was* hurtful to her, even if the *cause* wasn't your fault. This is the painful nuance your other friend misses.

  **What To Do Now:**

  1.  **Acknowledge Your Feelings:** Your guilt isn't silly. It shows your capacity for deep care. Don't beat yourself up for feeling it, but don't let it convince you you're a bad friend.
  2.  **Talk to Your Injured Friend (Again?):** Don't justify or defend your choice ("I couldn't be two places!"). **Focus on her feelings:**
      *   "I've been thinking so much about that day and how awful it must have been for you, stuck at urgent care, hurt and scared, and I wasn't there. I am so, so sorry you went through that and that I couldn't get to you sooner."
      *   "I want you to know how desperately I wanted to be there for you both. I had to make an impossible choice in a panic, but that doesn't change how terrible I feel that you were left feeling alone and unsupported by me when you needed me. I hate that."
      *   Acknowledge if communication could have been better: "I wish I had called you immediately to explain and try to find help faster, I was just so frantic."
  3.  **Explain (Without Excusing):** Briefly share the *reality* of the other emergency ("Friend A was having a severe panic attack and needed immediate intervention"), not to diminish her emergency, but to show why you were torn. Emphasize it wasn't about her being less important.
  4.  **Reaffirm Your Care:** "You mean the world to me, and the thought of you hurting, physically and emotionally, because I couldn't get there kills me. Please know I will always do everything in my power to be there for you."
  5.  **Forgive Yourself:** This was a no-win scenario thrust upon you. You acted with the best intentions and the information you had. Carrying perpetual guilt helps no one, especially not your friend. Learn from any communication gaps, but release the burden of thinking you could have magically solved the unsolvable.

  **The core conflict isn't logic vs. guilt; it's the collision of an impossible physical reality with the boundless desire to care for those we love.** Your guilt is a testament to your love for your friend, not proof of failure. While logic absolves you of blame, your heart grieves the unavoidable pain caused. Addressing it with empathy towards your injured friend *and* yourself is the path forward.
