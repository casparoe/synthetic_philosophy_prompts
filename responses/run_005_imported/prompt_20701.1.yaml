answer: |-
  That's a fascinating and nuanced question, cutting to the heart of the Truman-Anscombe debate. While your friend's framing captures a common consequentialist interpretation of the dispute, **applying newer historical evidence to "vindicate Truman by Anscombe's own lights" fundamentally misconstrues the core of her moral argument.** Here's why:

  1.  **Anscombe's Primary Argument Was Deontological, Not Consequentialist:** Her core objection wasn't primarily about *how many* would die, but *how* they would die and the *intention* behind the act.
      *   **Non-Combatant Immunity:** Anscombe, rooted in Catholic just war theory and moral philosophy (heavily influenced by Aquinas), held that intentionally targeting non-combatants is intrinsically evil, a violation of the principle of discrimination. It is never permissible, regardless of the consequences. The atomic bombs were used specifically to destroy cities and kill civilians en masse to break morale and force surrender. This, for Anscombe, was murder on a vast scale.
      *   **Means vs. Ends:** She rejected the idea that a good end (ending the war, saving lives overall) justifies intrinsically evil means (deliberately massacring civilians). Truman's decision, in her view, involved choosing an evil act as a means to a good end, which is morally prohibited.
      *   **The "Wager" Interpretation is a Misreading:** While Anscombe *did* argue that the bombings were *also* unnecessary (implying alternative strategies would have worked), this was a *supporting* argument, not the foundation. Her primary case was that *even if* the bombings saved lives overall, they would still be morally impermissible because of the nature of the act itself. Her protest leaflet stated: "**For men to choose to kill the innocent as a means to their ends is always murder.**"

  2.  **The Empirical Debate is Secondary (for Anscombe):** Yes, Anscombe believed alternatives existed (blockade, continued conventional bombing, awaiting Soviet entry) that would have forced surrender without the atomic horror and without a costly invasion. She argued the US government exaggerated the casualty estimates for an invasion to justify using the bombs. However:
      *   **This was a rebuttal of the *justification offered*, not the core of her *moral condemnation*.** She was saying: "Your claimed justification (saving lives) isn't even true, but *even if it were*, the act would still be wrong."
      *   **Her moral stance doesn't *depend* on the empirical wager.** If overwhelming historical evidence emerged tomorrow proving *conclusively* that the bombs saved millions more Japanese lives than any alternative, Anscombe's core moral objection would *still* stand. She would argue Truman chose an intrinsically evil means to achieve that good end.

  3.  **Applying the Newer Historical Evidence:**
      *   **Does it support the Truman administration's *contemporary justification*?** To a significant extent, yes. While hotly debated, the prevailing historical consensus leans towards the view that an invasion (Operation Downfall) would have been extraordinarily bloody for *all* sides, likely resulting in far higher casualties (military *and* civilian) than the atomic bombings did. Blockade and conventional bombing would have continued to kill civilians daily, potentially for months. This evidence strongly bolsters the consequentialist argument *for* Truman's decision *if one accepts consequentialism as the primary moral framework*.
      *   **Does it "vindicate Truman over Anscombe, *by her own lights*"?** **No, absolutely not.** Anscombe's "lights" were not primarily consequentialist. The new evidence addresses the *empirical claim* about necessity and comparative casualties – the supporting argument she used to counter Truman's justification. It does *not* touch her core deontological principle: that deliberately massacring non-combatants as a means to an end is always murder and always morally wrong. By *her* lights, even if the bombs saved 10 million lives, the act itself remained a grave moral evil. The historical evidence speaks to consequences; her primary argument was about the inherent nature of the act and the intention behind it.

  **Conclusion:**

  The newer historical evidence significantly strengthens the *consequentialist case* for Truman's decision, making it harder to sustain Anscombe's *empirical claim* that the bombings were unnecessary to avoid even greater bloodshed. **However, it does not "vindicate Truman over Anscombe by her own lights" because her core moral argument was not fundamentally about body counts.** Her protest was based on the principle that intentionally killing innocent civilians is intrinsically evil and can never be justified, regardless of the outcome. The historical debate about casualty estimates is largely irrelevant to that foundational moral principle. To claim historical evidence vindicates Truman *on Anscombe's terms* is to misunderstand the nature of her moral objection. Her protest stands or falls on the validity of the principle of non-combatant immunity and the prohibition against using evil means for good ends, not on the shifting sands of historical casualty estimates.
