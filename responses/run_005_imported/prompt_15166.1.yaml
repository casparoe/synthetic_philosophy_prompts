  Next, I should think about BATNA. Their best alternative is selling the cabin, which neither wants. That's a mutual threat point. Without agreement, both get zero utility. So any solution must give both more than zero.

  Constructing utility functions: the user's utility peaks at 2-3 weekends and flattens. The cousin's utility increases but eventually flattens too. The disagreement point is (0,0). The Nash solution finds the split maximizing the product of utilities. This likely gives the cousin more than half but less than all. Maybe 4-5 weekends for the cousin and 1-2 for the user? 

  Kalai-Smorodinsky considers the ideal point. The user's max is, say, 3 weekends' worth, cousin's 9. The solution equalizes the ratio of gains from the disagreement point. This might give the cousin more than Nash but still capped.

  Practical suggestions: propose a split like 3 for user, 9 for cousin, but adjust so user gets prime weekends. Or use a points system where each bids on weekends, ensuring efficient allocation. 

