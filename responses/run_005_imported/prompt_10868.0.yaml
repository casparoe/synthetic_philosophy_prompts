  Character A (SSA): "We're probably among the last humans because we're randomly sampled from all humans. Most humans lived in the past, so our existence suggests few future humans." Wants to settle immediately. 

  Character B (SIA): "Our existence suggests many observers exist - otherwise why would we be here?" Wants to gamble on the next star. 

  The reference class twist: When they discover alien ruins, the definition of "observer" becomes critical. Are the aliens part of the reference class? That changes the doomsday calculation. 

  Key scene: The philosopher character realizes SSA applied only to humans was arbitrary - if aliens count as observers, humanity's position in the timeline shifts. The practical engineer never cared about abstract reference classes, which ironically makes her right. 

