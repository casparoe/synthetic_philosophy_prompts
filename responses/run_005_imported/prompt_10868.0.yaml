  Title idea: "The Ark Calculus" - plays on both the ship and the math. The log entries framing device lets us show shifting perspectives as evidence accumulates. 

  Biggest risk is getting bogged down in exposition. Need to trust the reader to grasp the concepts through character conflict. The alien ruins discovery should feel like a genuine plot turn, not just a math demonstration. 

