  What's fascinating is their request: they don't want pop-science doom-mongering, but a proper hard-SF story where anthropic reasoning drives the plot. The specificity is impressive - they want two characters using SSA/SIA to interpret identical evidence differently, with the reference class problem actually resolving the plot. This isn't just "explain the concepts"; it's "make the math narrative machinery."

  Hmm... The challenge is making Bayesian probability visually compelling. A generation ship feels right - contained environment, high stakes, built-in observer count uncertainty. For the reference class problem to matter, we need a situation where defining "observer" changes survival odds. 

