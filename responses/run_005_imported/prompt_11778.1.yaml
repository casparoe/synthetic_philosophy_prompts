prompt: |-
  I'm chairing a colloquium Q&A with a philosopher of mind who defends Integrated Information Theory as an identity claim -- a system's experience simply is its maximally irreducible cause-effect structure, not merely correlated with it. Whenever a counterexample comes up, she retreats to the same move: the theory reasons from axioms about experience to constraints on physical substrate, so if the substrate looks strange, it's our intuitions that need revising, not the axioms. Draft eight interview questions that keep testing that move rather than letting her simply restate it. Include one question built on the exclusion postulate's implication that a tiny change in a system's connectivity can flip which of two overlapping candidates counts as conscious (sometimes called the "boundary problem"); one drawing on Scott Aaronson's objection that the theory's own formalism assigns enormous integrated information to simple, densely-connected error-correcting-style networks that intuitively do nothing interesting; and one on the "unfolding argument" -- that any recurrent network can be unfolded into a feedforward one with identical input-output behavior but far lower integrated information -- pressing on what, if anything, is left for the theory to be wrong about. For each, add a follow-up keyed to the reply she's likely to give, and close with a question about what observation, in principle, she would accept as evidence against the theory.
reasoning: |-
  We are drafting eight interview questions for a colloquium Q&A with a philosopher of mind defending Integrated Information Theory (IIT) as an identity claim. The goal is to test her recurring move that when faced with counterexamples, she argues that our intuitions about the physical substrate must be revised, not the axioms. We need to include specific questions on:
   1. The exclusion postulate and the boundary problem.
   2. Scott Aaronson's objection about simple, densely-connected networks having high Φ.
   3. The unfolding argument.

   We also want follow-ups for each and a closing question about what she would accept as evidence against the theory.

   Let's structure:

   1. Question 1: On the boundary problem (exclusion postulate)
      - Follow-up: anticipating she might say that our intuition about boundaries is wrong, press on how this affects the empirical testability of IIT.

   2. Question 2: On Scott Aaronson's objection (simple systems with high Φ)
      - Follow-up: if she dismisses by saying that our intuition about consciousness in such systems is underdeveloped, ask why we should trust IIT's axioms then.

   3. Question 3: On the unfolding argument (recurrent vs. feedforward with same behavior but different Φ)
      - Follow-up: if she argues that the feedforward version lacks temporal depth, press on whether IIT is then a theory of temporal structure rather than of consciousness per se.

   Then we need five more questions that test her move in other ways. Some ideas:

   4. Question: On the identity claim itself. If experience is identical to the cause-effect structure, then any change in the structure should be a change in experience. But what about systems that are isomorphic? (e.g., same cause-effect structure in two physically different systems). How does IIT account for the qualitative differences that might arise from different physical realizations? 

   5. Question: On the axioms. IIT starts from axioms about experience. But how do we know these axioms are complete and not biased by human experience? For example, could there be forms of consciousness that don't involve intrinsic existence, composition, information, integration, or exclusion? 

   6. Question: On the measurement of Φ. It's been argued that Φ is computationally intractable for anything but trivial systems. How can IIT be a scientific theory if its central quantity is practically unmeasurable?

   7. Question: On the empirical evidence. IIT predicts that systems with low Φ (like conventional digital computers) are not conscious, while systems with high Φ (like the human brain) are. But what about systems that are in between? And what about cases of brain damage where consciousness might remain but Φ is reduced? How does IIT account for that?

   8. Question: On panpsychism. IIT seems to imply that even simple systems with a modicum of integrated information (like a photodiode) have some level of consciousness. How does she reconcile this with the apparent lack of behavioral or functional evidence for consciousness in such systems?

   Now, let's draft the questions with follow-ups.

   Note: We need to be sharp and not let her off the hook by restating the move. So the follow-ups should press on the implications of her response.

   We'll do:

   1. Boundary Problem
   2. Aaronson's Objection
   3. Unfolding Argument
   4. Isomorphism and Qualitative Differences
   5. Completeness of Axioms
   6. Computability of Φ
   7. Empirical Evidence and Brain Damage
   8. Panpsychism and Behavioral Evidence

   Then the closing question: What observation would she accept as evidence against IIT?

   Let's write:
answer: |-
  Here are eight targeted questions designed to probe the core move of prioritizing axioms over physical intuitions, with specific challenges and layered follow-ups. Each question forces engagement with concrete counterexamples while preempting deflection:

  ### **1. Boundary Problem (Exclusion Postulate)**  
  **Q:** IIT's exclusion postulate implies that flipping a single connection in a network can abruptly switch which overlapping subsystem is conscious (e.g., a neuron added to a grid). Since this contradicts intuitions about gradual changes in consciousness, why should we accept that such discreteness reflects reality rather than a flaw in the formalism?  
  *Likely Reply:* "Our intuitions about continuity are anthropocentric; consciousness *is* discrete under IIT's axioms."  
  **Follow-up:** If minor physical changes can toggle consciousness between overlapping systems without functional differences, doesn’t this render IIT empirically unfalsifiable? For instance, how could we ever design an experiment to detect which of two overlapping subsystems is conscious when their input-output behavior is identical?  

  ### **2. Scott Aaronson’s Objection**  
  **Q:** Aaronson notes IIT assigns high Φ to trivial error-correcting codes (e.g., 5-bit repetition codes), which are dense but functionally inert. If these networks "feel like something" per IIT, why do they lack any behavioral or evolutionary markers of consciousness?  
  *Likely Reply:* "Markers like behavior are extrinsic; IIT focuses on intrinsic properties. Our intuitions about ‘interestingness’ are irrelevant."  
  **Follow-up:** If IIT grants consciousness to systems without adaptive functions or causal complexity (e.g., a static error-correction loop), doesn’t this dilute the explanatory power of consciousness? Shouldn’t a theory of experience distinguish between a human brain and a repeating bit circuit?  

  ### **3. Unfolding Argument**  
  **Q:** Any recurrent network can be "unfolded" into a feedforward network with identical input-output behavior but drastically lower Φ. If both systems are functionally indistinguishable, how can IIT claim one is conscious and the other isn’t?  
  *Likely Reply:* "Unfolding destroys temporal integration—a core axiom. Time is intrinsic to experience."  
  **Follow-up:** If IIT requires a *specific physical implementation* (recurrent connectivity) for consciousness, doesn’t this collapse into dualism? What physical principle, beyond IIT’s axioms, prevents consciousness from being simulated on a feedforward computer?  

  ### **4. Axioms vs. Empirical Accountability**  
  **Q:** You argue that axioms about experience constrain physics. But if every counterexample (e.g., Φ-maximizing but inert systems) is dismissed as "revising intuitions," what *empirical phenomena* could IIT fail to explain?  
  *Likely Reply:* "IIT *predicts* phenomena—e.g., why certain brain networks correlate with consciousness."  
  **Follow-up:** Correlation isn’t identity. If IIT’s identity claim is untestable (since it overrules physical counterexamples), isn’t it functionally equivalent to asserting consciousness by fiat?  

  ### **5. Panpsychism and Physical Intuitions**  
  **Q:** IIT implies panpsychism (e.g., photodiodes have Φ > 0). Yet we intuitively ascribe consciousness only to complex systems. Why prioritize axioms over the physical intuition that consciousness requires evolutionary sophistication?  
  *Likely Reply:* "Intuitions are shaped by human cognition; IIT’s axioms are derived from phenomenology."  
  **Follow-up:** If IIT’s axioms demand that a single logic gate has *some* experience, how does this avoid combinatorial explosion (e.g., why doesn’t a computer have trillions of micro-experiences)?  

  ### **6. Causation vs. Correlation**  
  **Q:** IIT defines experience via causal structure. But causation is context-dependent (e.g., a neuron’s effects depend on the whole brain). How can Φ isolate "intrinsic" causation when all physics is relational?  
  *Likely Reply:* "The axioms specify intrinsic existence—systems must have cause-effect power *within themselves*."  
  **Follow-up:** If "intrinsic causation" is only definable within IIT’s formalism (not standard physics), isn’t the theory circular?  

  ### **7. Inversion Scenarios**  
  **Q:** Consider two systems with identical Φ but different structures (e.g., a human brain and a "scrambled" version with permuted connections). IIT says both have identical experiences. How can this avoid absurdity (e.g., random networks having rich consciousness)?  
  *Likely Reply:* "Structure determines quality, but quantity (Φ) determines existence. Identical Φ implies identical *amount* of consciousness."  
  **Follow-up:** If two structurally distinct systems have the same Φ, do they have the *same* experience? If not, doesn’t this concede that Φ alone is insufficient to define consciousness?  

  ### **8. Closing: Evidence Against IIT**  
  **Q:** What observable or experimental outcome—even in principle—would falsify IIT for you? For instance, if we built a recurrent network with high Φ that self-reports no experience, or a low-Φ system that exhibits behavioral markers of consciousness, would that refute the theory?  
  *Likely Reply:* "Self-report and behavior are extrinsic; IIT targets intrinsic properties."  
  **Follow-up:** If *no* physical observation can challenge IIT because axioms override empiricism, is IIT a scientific theory or a metaphysical framework?  

  ---  
  **Design Notes:**  
  - **Preemptive Strikes:** Follow-ups anticipate the "revise intuitions" move by pushing on empiricism, testability, and explanatory gaps.  
  - **Pressure Points:** Targets identity claims (Q4, Q7), empirical risk (Q8), and circularity (Q6).  
  - **Aaronson/Unfolding/Boundary:** Embedded in Q2, Q3, and Q1 with specific mechanisms.  
  - **Closing:** Forces reflection on falsifiability, separating science from dogma.
