prompt: |-
  So at work I've been messing with causal inference for our experimentation platform (Pearl-style DAGs, do-calculus, all that) and fell down a rabbit hole reading about the actual philosophy behind 'what is causation, really.' Turns out theres two rival camps that both get cited as THE theory of causation: the counterfactual theory (Lewis's version) and the interventionist theory (Woodward's version), and at first glance they sound almost the same to me, like both just boil down to 'if you'd changed X, Y would've changed too.' One thing that bugs me though: doesn't defining causation through 'interventions' just smuggle causation back in, since an intervention is itself a causal notion? Although Lewis's 'closest possible world' stuff sounds just as made up once you look at it closely. Can you write me a dialogue between a die-hard Lewisian and a die-hard Woodwardian hashing this out at a whiteboard, where they actually engage with each others specific objections instead of just restating their own view? I want to actually get what's at stake between them, not some wikipedia-flavored summary that mushes the two together.
