answer: |-
  Okay, let's dissect this notoriously tricky passage from Moore, sentence by sentence, focusing on the logic and his specific moves, keeping your novelist's needs in mind. You've got the gist right, but the devil (and the character's potential insufferability) is in the details.

  **Moore's Goal:** To defend *Direct Realism* (we perceive objects directly) against the *Argument from Illusion* (the penny looks elliptical, therefore we see a sense-datum *which is* elliptical, not the penny itself). He wants to say: "No, I *do* see the *penny*, even when it looks elliptical. The ellipticalness isn't a property *of* the sense-datum I'm seeing; it's just *how* the real, circular penny *seems*."

  **The Passage Dissected:**

  1.  **"What now seems to me to be possible is that the sense-datum which corresponds to a tree, which I am seeing, when I am a mile off, may not really be perceived to be smaller than the one, which corresponds to the same tree, when I see it from a distance of only a hundred yards, but that it is only perceived to seem smaller;"**
      *   **Logic:** Moore proposes a *possibility*. When seeing the tree far away, I don't actually perceive the sense-datum (the visual experience) *as being* smaller than the close-up sense-datum. Instead, I perceive the far-away sense-datum *as seeming smaller* (while still corresponding to the same large tree).
      *   **Key Move:** Introducing a distinction: Perceiving X *to be* F vs. Perceiving X *to seem* F.

  2.  **"that the sense-datum which corresponds to a penny, which I am seeing obliquely, is not really perceived to be different in shape from that which corresponded to the penny, when I was straight in front of it, but is only perceived to seem different—that all that is perceived is that the one seems elliptical and the other circular;"**
      *   **Logic:** Applies the same move to the penny. Oblique view: I don't perceive the sense-datum *as being* elliptical. I perceive it *as seeming elliptical*. Straight-on view: I perceive it *as seeming circular*. Crucially, "all that is perceived" in terms of shape-properties *of the sense-datum* is this *seeming* elliptical or circular. He *doesn't* perceive the sense-datum itself *to have* a different intrinsic shape property.
      *   **Key Move:** Reinforcing the distinction. "Seems elliptical" and "seems circular" are the *objects* of perception regarding the sense-datum's shape, *not* "is elliptical" or "is circular".

  3.  **"that the sense-datum presented to me when I have the blue spectacles on is not perceived to be different in colour from the one presented to me when I have not, but only to seem so;"**
      *   **Logic:** Extends the argument to color. Wearing blue glasses: I don't perceive the sense-datum *as being* blue. I perceive it *as seeming blue*. Without glasses: I perceive it *as seeming* its normal color (say, white).
      *   **Key Move:** Showing the generality of the "seems" move across sensory modalities (size, shape, color).

  4.  **"and finally that the sense-datum presented when I touch this finger is not perceived to be different in any way from that presented to me when I see it, but only to seem so that I do not perceive the one to be coloured and the other not to be so, but only that the one seems coloured and the other not."**
      *   **Logic:** Applies the move to the *Molyneux Problem* (difference between sight and touch). I don't perceive the *visual* sense-datum *as being* colored while the *tactile* sense-datum *is not* colored. I perceive the visual sense-datum *as seeming colored* and the tactile sense-datum *as seeming not colored* (or seeming tactile).
      *   **Key Move:** Extending "seems" to account for the fundamental difference in *how* different senses present the world (sight "seems colored", touch "seems not colored"/"seems tactile").

  5.  **"If such a view is to be possible, we shall have, of course, to maintain that the kind of experience which I have expressed by saying one seems different from the other—"seems circular," "seems blue," "seems coloured," and so on—involves an ultimate, not further analysable, kind of psychological relation, not to be identified either with that involved in being "perceived" to be so and so, or with that involved in being "judged" to be so and so;"**
      *   **Logic:** Moore acknowledges the cost of his move. For "seems F" to do the work he needs (saving direct realism), it *can't* be reduced to either:
          *   *Perceiving* the sense-datum *to be* F (that's what he's trying to avoid).
          *   *Judging* the sense-datum *to be* F (that would be an intellectual act, not the raw perceptual experience).
      *   **Key Move:** He posits "seeming" as a *primitive*, *sui generis* relation. It's a basic, irreducible component of conscious experience itself. This is the core of what's tripping you up.

  6.  **"since a presented object might, in this sense, seem to be elliptical, seem to be blue, etc., when it is neither perceived to be so, nor judged to be so."**
      *   **Logic:** He clarifies the primitive nature. The "seeming" happens *before* any act of perception *of* properties or judgment *about* properties. It's the raw, immediate, non-conceptual "givenness" of the experience *as if* it were elliptical/blue/etc. You can have a "seeming" without forming the perceptual belief "it *is* elliptical" or the judgment "I believe it *is* elliptical".
      *   **Key Move:** Emphasizing the immediacy and non-conceptual nature of "seeming". It's the phenomenal character itself.

  7.  **"But there seems to me to be no reason why there should not be such an ultimate relation."**
      *   **Logic:** Moore argues there's no logical contradiction in positing this primitive relation. It *could* exist.
      *   **Key Move:** Defending the *possibility* of his solution. He's not asserting it *is* true, just that it's *coherent*.

  8.  **"The great objection to such a view seems to me to be the difficulty of believing that I don't actually perceive this sense-datum to be red, for instance, and that other to be elliptical; that I only perceive, in many cases, that it seems so."**
      *   **Logic:** Moore states the *main problem* with his own proposal: It flies in the face of strong *phenomenological intuition*. When I look at a red thing, it *feels like* I directly perceive the sense-datum *as being* red, or the penny *as being* elliptical from an angle. Saying "I only perceive that it *seems* red/elliptical" feels like a denial of the obvious, vivid character of experience.
      *   **Key Move:** Admitting the deep psychological hurdle his theory faces. It *feels* wrong, even if logically possible.

  9.  **"I cannot, however, now persuade myself that it is quite clear that I do perceive it to be so."**
      *   **Logic:** Despite the strong intuition, Moore confesses *doubt*. He can't be *certain* that his initial intuition (that he perceives the sense-datum *to be* elliptical/red) is correct. The possibility he's outlined throws that certainty into question. Maybe he *doesn't* perceive the sense-datum *to be* elliptical; maybe he only perceives it *as seeming* elliptical.
      *   **Key Move:** Ending in honest philosophical *aporia* (puzzlement). He sees the possibility, sees the intuitive objection, but can't definitively resolve it in favor of either side. He's stuck.

  **Answering Your Specific Tripping Points:**

  1.  **What is "Seeming"?** You're right to be frustrated. Moore *is* largely naming the problem. He posits "seeming" as a primitive, irreducible relation. It's the raw *phenomenal character* or *appearance* itself. Think of it as the "what it's like" of the experience *before* you categorize it as veridical perception, illusion, or judgment. It's the pre-reflective "look" or "feel". He's saying this basic "appearing-as" is distinct from the perceptual *belief* that something *is* that way. It's a foundational element of consciousness he claims we must accept without further analysis. It *is* clumsy; it feels like he's redescribing the datum rather than explaining it. That's why it's controversial.
  2.  **Does Moore Believe It?** No, not really, or at least, not confidently. The passage is a masterclass in philosophical *tentativeness*. He explores a *possibility* ("what now seems to me to be possible") to save direct realism. He argues it's *logically coherent* ("no reason why there should not be"). But he admits the *psychological implausibility* ("difficulty of believing") and ends in *uncertainty* ("I cannot... persuade myself that it is quite clear"). He's probing, not pronouncing. This is GOLD for your character – he can be earnestly, passionately expounding this brilliant (to him) *possibility* he's just discovered, wrestling with its implications, visibly frustrated by its counter-intuitiveness, yet unable to let it go because it *might* solve the problem. He's on the *edge* of belief, grappling.
  3.  **Ancestor of Disjunctivism?** **Yes, absolutely, and a significant one.** This is the crucial connection for your "ahead of his time" character.
      *   **The Link:** Both Moore here and disjunctivists are motivated by the desire to protect **Direct Realism**. They want to say that in the *good* case (veridical perception), you are directly aware of the mind-independent object.
      *   **The Common Move:** Both try to drive a wedge between the *veridical* perceptual relation and the *non-veridical* (illusion, hallucination) cases. Moore does this by saying that even in the non-veridical *seeming* (penny elliptical), what I'm *directly perceiving* is still the real penny, and the "ellipticalness" is just *how it seems*, not a property of an intermediary sense-datum *I'm perceiving*. Disjunctivism says the *mental state/event* itself is fundamentally different in the veridical case (it constitutively involves the external object) vs. the non-veridical case (it doesn't).
      *   **Moore's Specific Ancestral Contribution:** His key move is introducing this primitive "seeming" relation as distinct from "perceiving to be". This allows him to say the *object* of perception remains the external thing (the penny), while the *mode* of presentation is "seeming elliptical". The *fundamental relation* (perception) is still to the external object; the "seeming" is a *modifier* of that relation or a feature of the *experience* itself, not the object. Disjunctivism radicalizes this by saying the *nature* of the experiential state differs categorically based on whether the object is present.
      *   **Is it *Full* Disjunctivism?** Not quite. Moore still talks about "sense-data" as the *immediate* objects in all cases, even if he tries to define them relationally ("corresponds to"). Disjunctivists typically reject sense-data *entirely* in the veridical case, arguing that the experience is *of the object itself*, full stop. Moore is trying to *rehabilitate* the sense-datum by redefining what we perceive *about* it (only its "seeming" properties). Disjunctivists often see the *common factor* (the sense-datum or the "seeming") as the fatal mistake Moore is still partially entangled in.
      *   **Why it Matters for Your Character:** This passage shows Moore *groping towards* the disjunctivist insight. He sees that to save direct realism, he needs to break the link between how things *seem* and what properties the *object of perception* actually has. He sees that "seeming F" might not entail that what you're perceiving *is* F. He's struggling to articulate *how* perception can be direct even when things seem other than they are. This *is* the core problem disjunctivism tackles. Your character, steeped in Moore and wrestling with this very passage, *could* be glimpsing the disjunctivist future – the idea that the *successful* perceptual state is fundamentally different in kind. He might be clumsily trying to express that the "seeming" in the good case isn't just a primitive property, but *constituted by* the real object's properties, whereas in the bad case, it's something else entirely. He wouldn't have the modern terminology, but the *impulse* and the *logical pressure* he's responding to are precisely those that led to disjunctivism.

  **How Your Philosopher Character Might Sound (The Ramble):**

  Imagine him leaning in, eyes slightly too intense, fork forgotten, perhaps after a few glasses of claret: *"You see, the *utterly* fascinating thing Moore proposes—no, *suggests*, he's terribly cautious—is that when you look at the penny from an angle, you aren't *actually* perceiving your sense-datum *as elliptical*. Not at all! That's the whole mistake. What you perceive is the sense-datum *seeming elliptical*. The 'ellipticalness' isn't *in* the datum you see, it's *how* the real, round penny presents itself! It's a primitive relation, you understand? Not perceiving, not judging... just raw seeming. Like the blue from spectacles—the datum doesn't *become* blue, it *seems* blue. The tree far off *seems* small. The tactile finger *seems* uncolored. It's all 'seems'! Of course..."* (he pauses, brow furrowed, perhaps swirling his wine) *"...the damnable difficulty is it *feels* like I just see the blasted thing *as* elliptical. Right there! Stark and undeniable! Moore admits it too—he can't quite convince himself otherwise. But logically... logically, it *must* be possible? If we're to see the *object* itself... the real coin... and not just some private picture... the 'seeming' *has* to be distinct, doesn't it? Almost... almost as if the *kind* of seeing when it's truly round is fundamentally... different? But how? How can seeming not be the same as being perceived...?"* (He trails off, perhaps staring at a spoon held at an angle, lost in the puzzle).

  This captures the earnestness, the technical struggle with "seeming," the awareness of Moore's doubt, and the hint of pushing towards the disjunctivist idea ("almost as if the *kind* of seeing... is fundamentally different"). He's wrestling with the cutting edge (for 1918) of defending realism against the sense-datum theory. Perfect dinner party fodder! Good luck with the scene!
