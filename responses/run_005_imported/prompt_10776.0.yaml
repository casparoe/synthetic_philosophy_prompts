answer: |-
  Here’s a draft that honors their intellectual sparring while staying neutral, accessible, and celebratory. It uses the duty/inclination tension as structural backbone without declaring a winner:

  ---

  **(Raise glass, warm smile)**  
  "Friends, family, fellow survivors of academic conferences… thank you for letting me celebrate Priya and Theo. As Priya’s dissertation advisor, I’ve witnessed many of her brilliant arguments firsthand. But the *best* argument she ever had? Ironically, was the one that started *this*.

  **(Lean in conspiratorially)**  
  They met in my seminar, fiercely debating a philosophical puzzle: What makes a good action *truly* good? Is it when you do it purely because it’s *right*, even if every fiber of your being resists? Or is it when it flows so naturally from love, care, or joy that you barely even think about the ‘rightness’? Priya championed the noble power of *duty*. Theo championed the beauty of *inclination*. And folks, they fought *hard*. Kant’s gloomy philanthropist who helps people purely from principle was either their hero or their villain!

  **(Tone shifts to affectionate)**  
  Now, you might think, ‘Wow, nerds.’ And you’d be right! But here’s the magic: that argument *didn’t end*. It became their language. I’m told there’s a running bit in their kitchen: One makes coffee, the other asks, deadpan, ‘Love or duty?’ And they actually *stop* and discuss it. Seriously! *(Pause for laughter)*. Most couples argue about chores or whose turn it is to empty the dishwasher. These two debate the moral metaphysics of *loading* the dishwasher!

  **(Shift to heartfelt, philosophical core - pace slows slightly)**  
  But watching them, I realized something profound. Their playful, endless debate isn’t just academic. It’s a reflection of something real about love itself. Because isn’t love the one thing in life that somehow *contains* both these forces?  
  On one hand: Love *is* duty. It’s showing up. It’s the promise made, the commitment honored, the coffee brewed at 6 AM when you’d rather sleep, simply because you *said you would*. It’s the backbone, the ‘I am here for you, no matter what.’  
  On the other hand: Love *is* pure inclination. It’s the spontaneous laugh, the effortless comfort, the joy that bubbles up just because they walk into the room. It’s the ‘I *want* to be here, always.’  
  Priya and Theo didn’t just meet arguing about this tension… they *live* it. And maybe that’s the secret. Maybe the most enduring love isn’t duty *or* inclination winning out. Maybe it’s the dynamic, dancing *conversation* between them. The way the steadfast promise makes space for the wild joy, and the wild joy gives meaning to the promise.

  **(Broaden out, include all guests)**  
  For everyone here who hasn’t read Kant’s *Groundwork* (and honestly, congratulations on that!), it’s simple: We see it in them. We see Priya’s fierce loyalty – her unwavering *duty* to those she loves. We see Theo’s radiant warmth – the sheer *delight* he takes in Priya’s presence. And together? We see a love that’s both rock-solid and effortlessly joyful. A love that argues passionately about coffee motives on Tuesday and builds a beautiful, shared life every other day.

  **(Raise glass higher)**  
  So, Priya and Theo: Here’s to your endless debate. May your love forever be argued with the same passion, depth, and humor you brought to that seminar room. May you always find duty in your devotion, and inclination in your joy. May you keep asking ‘Love or Duty?’ over coffee for the next sixty years… and may the answer, somehow, miraculously, always be *both*.  
  To Priya and Theo!"

  ---

  **Why this works:**

  1.  **Balances the Philosophy:** The duty/inclination tension is the *engine* of the toast, not just a cute anecdote. The core paragraph ("But watching them...") explicitly lays out both sides as essential components of love, giving equal weight to Priya's (Herman-esque) and Theo's (Arpaly/Smith-esque) positions without declaring a winner. Kant's philanthropist is mentioned neutrally.
  2.  **Accessible for All:** Key philosophical concepts are translated into universal relationship terms ("showing up," "promise," "spontaneous laugh," "effortless comfort," "rock-solid," "effortlessly joyful"). The coffee-making example is relatable and funny. The "secret" revealed is about love, not moral philosophy.
  3.  **Has "Teeth" for Philosophers:**
      *   Accurately frames the historical debate (duty vs. inclination as sources of moral worth).
      *   Name-drops Kant's philanthropist example (a recognizable touchstone).
      *   Uses precise philosophical terms ("duty," "inclination") in the core argument.
      *   Captures the essence of both Herman (duty as the essential, operative motive) and Arpaly/Smith (the inherent value of actions flowing from good desires/empathy).
      *   The final "may the answer... always be *both*" is a genuine philosophical point – suggesting love *transcends* or *synthesizes* the dichotomy – rather than a dodge.
  4.  **Neutral & Respectful:** The toast explicitly celebrates *both* Priya's loyalty (duty) *and* Theo's warmth (inclination). It frames their debate as their unique language and strength, never mocking either position. Theo's family hears Theo's core value (joy, warmth) celebrated just as much as Priya's (loyalty, commitment).
  5.  **Celebrates Them:** It roots the philosophy in *their* specific story (seminar, coffee debates) and *their* observable qualities. The focus ends squarely on their love and future.
  6.  **Tone:** Warm, affectionate, slightly humorous, and ultimately deeply celebratory. The philosophy serves the celebration, not the other way around.
  7.  **Timing:** Roughly 4 minutes when delivered with natural pauses.

  **Delivery Tip:** Lean into the warmth and affection, especially when describing *their* qualities. Let the humor land naturally on the coffee bit. Deliver the core philosophical paragraph with sincerity and a slight slowing of pace to let the idea resonate, then smoothly transition back to the broader celebration. Your genuine fondness for them will carry it.
