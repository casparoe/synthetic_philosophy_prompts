  Key psychological frameworks come to mind. The disease model explains the neurological hijacking of addiction, but moral agency isn't entirely erased. Stephen Morse's work on "diachronic responsibility" could help: Marco is accountable for maintaining sobriety (antecedent responsibility) but less blameworthy during acute impairment (concurrent responsibility). The user might also be wrestling with epistemic gaps—how to *know* when Marco's choices are volitional versus compulsion-driven. 

  Practically, the user needs strategies to navigate this duality. Setting boundaries isn't punitive; it's self-care. For example: "I care about you, but if you relapse, I'll need space until you're sober again." This acknowledges the illness while protecting the friendship from chronic damage. The user might also examine what "restoration" looks post-apology—if trust is repeatedly broken, detachment may be a necessary defense. 

  The deeper need here? Validating that both reactions are legitimate. The user isn't failing by oscillating; they're responding to a genuinely contradictory reality. The resolution lies in flexible expectations: relating as a friend *when possible*, clinically when necessary, without guilt. Marco's sustained sobriety efforts would naturally shift the balance toward friendship. 

  Finally, the user's clinical training might heighten this struggle—they're trained to analyze, not just feel. But friendship requires emotional reciprocity. Perhaps naming this tension ("I'm your friend first, but my training sometimes filters how I see things") could open dialogue with Marco too.
answer: |-
  Your struggle reflects a profound tension between clinical knowledge and lived relational reality—one that deserves far more nuance than the "responsible or not" binary your labmates propose. What you're experiencing isn't indecision, but an accurate recognition of addiction's inherent duality. Here’s a framework to navigate this:

  ### Core Principles for Reconciling the Duality
  1.  **Distinguish Between Antecedent and Concurrent Responsibility:**
      *   **Antecedent Responsibility:** Marco *is* responsible for engaging in treatment, maintaining sobriety tools (therapy, meds, support groups), and recognizing his triggers. This is where his profound self-awareness *must* translate into sustained action. His failure here *is* a legitimate source of relational friction.
      *   **Concurrent Responsibility:** During active intoxication, his capacity for rational choice, impulse control, and empathy *is* physiologically impaired. While not absolved, the degree of volition is diminished. This is where the "disease lens" legitimately softens blame *in the moment*.

  2.  **Acknowledge the Spectrum of Impairment:** Not all drinking episodes are equal. While dependence fundamentally alters brain function, the level of impairment (and thus, the degree of volition) can vary. His ability to "make choices" (like choosing the bar) *within the narrowed, distorted reality of addiction* doesn't equate to full rational agency. It reflects the *priority hijacking* characteristic of addiction ("I need this more than anything else *right now*"), not cold, sober calculation.

  3.  **Separate Accountability from Blame:**
      *   **Accountability:** Marco *must* be held accountable for the *consequences* of his actions, regardless of impairment. Missing the wedding caused real harm. Cruel words inflict real wounds. Accountability means acknowledging this impact unreservedly (which he does in his sober apologies) and making amends where possible.
      *   **Blame:** Assigning *moral* blame ("You are a bad person for this") during acute impairment is less productive and often inaccurate to the neurobiology. The focus shifts to: "This behavior, driven by your illness, caused harm. What are you doing *now* (antecedent responsibility) to prevent recurrence?"

  4.  **Your Right to Grieve and Protect:** Understanding the "why" doesn't erase the hurt. Your resentment is a valid emotional response to being harmed. It signals a boundary has been crossed. Suppressing it entirely (the "case manager" mode) is unsustainable and dehumanizing for *you*. Allowing yourself to feel hurt *and* understanding the context isn't contradictory—it's integrated.

  ### A Principled Approach to Relating
  *   **During Sobriety:** Engage fully as a friend. Hold him to high standards of *antecedent responsibility*. Discuss his recovery efforts openly. Express appreciation for his self-awareness and apologies. This is where friendship thrives.
  *   **During/Immediately After a Relapse:** Shift temporarily toward the "clinical/management" lens.
      *   **Prioritize Safety & Boundaries:** Ensure your immediate emotional/physical safety. Disengage if necessary ("I can't talk to you when you're like this"). This isn't punishment; it's protection for both of you.
      *   **Suspend Relational Expectations:** Temporarily detach from the *personal* sting. See the cruel words or broken promise primarily as symptoms of acute illness. This *doesn't* mean excusing them, but depersonalizing the *source* ("This is the addiction talking, not the Marco I know").
      *   **Focus on Concrete Needs:** If engaged, focus on immediate safety or connection to help (e.g., "Do you need a ride to detox?"), not processing the relational harm *in that moment*.
  *   **Post-Relapse (Sober):** Return to relational engagement, but demand *accountability*.
      *   **Acknowledge the Shift:** "When you're sober, like now, I need to talk about the impact."
      *   **Accept His Amends (if genuine):** His sober remorse and analysis *are* crucial for repair. This is him reclaiming his antecedent responsibility.
      *   **Reinforce Boundaries:** "Your apology means a lot, and *because* I value our friendship, I need to be clear: if this happens again, I will [specific consequence, e.g., need significant space, cannot rely on you for X, etc.]." Link consequences to *future* antecedent responsibility failures.

  ### Why Both Modes Are Necessary & Coherent
  1.  **Protects the Friendship:** The "clinical" buffer during crises prevents the repeated, raw personal injury that would otherwise destroy the relationship. It allows you to *not* take the acute behavior personally long enough to preserve the connection for when he's sober.
  2.  **Honors Your Reality:** The "resentment/accountability" mode honors your humanity and right not to be chronically harmed without consequence. It prevents you from becoming an enabler or doormat.
  3.  **Reflects Addiction's Complexity:** It accurately mirrors that addiction exists in the messy overlap of illness, choice, compulsion, and consequence. Holding both "He is ill" *and* "His actions hurt me and he must own that" is intellectually honest.
  4.  **Sustainable for You:** This fluidity prevents burnout. Detaching during crises conserves emotional energy; re-engaging during sobriety allows for connection and repair.

  ### Key Considerations
  *   **The Burden is on Marco:** His profound self-awareness is positive, but it *increases* his antecedent responsibility. His apologies must be backed by demonstrably intensified efforts to prevent relapse. If relapses continue *without* significant changes to his recovery plan, your resentment is a justified signal that his actions (or inactions) are incompatible with the friendship you need.
  *   **Your Boundaries Are Non-Negotiable:** Define clear, specific boundaries for yourself (e.g., "I will not attend events with you if you've been drinking," "I will leave the conversation if insults start"). Enforce them consistently. This is how you love him *and* yourself.
  *   **"Restoration" Has Limits:** Each relapse and repair cycle can erode trust. Pay attention to whether *you* feel genuinely restored after his apologies, or if you're just going through the motions. True restoration requires demonstrable change over time.
  *   **Seek Your Own Support:** Process your complex feelings (resentment, grief, compassion fatigue) with your own therapist or supervisor. Being close to someone with addiction is exhausting.

  **You are not failing to make up your mind.** You are grappling authentically with one of the most painful relational paradoxes: loving someone whose illness causes them to repeatedly harm you. Holding both compassion for his struggle and fierce protection for your own well-being isn't incoherent—it's the only sustainable, honest way to navigate this. The path forward lies in allowing your response to fluidly match the phase of his illness *while* consistently upholding your boundaries and his accountability when sober. This dynamic acceptance, not a rigid verdict, is what preserves both your integrity and the possibility of the friendship.
