  **MEMORANDUM**  
  **To:** Board of Directors  
  **From:** Model Risk & Fairness Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Loan-Underwriting Model Deployment  

  ### Executive Summary  
  After rigorous analysis of the loan-underwriting model, we face a trade-off between statistical fairness and regulatory compliance. We recommend **Option A (single risk threshold)** to prioritize calibration and avoid disparate treatment. This memo details our rationale, proposes a third-path mitigation strategy, outlines a rollout timeline, and addresses the strongest counterargument for Option B.  

  ---

  ### Recommendation: Option A (Single Threshold) with Mitigation  
  We advise deploying **Option A**—a single risk threshold for all applicants—with complementary measures to address fairness gaps. Below is our assessment:  

  #### Why Option A?  
  1. **Legal Compliance:** Option B’s group-specific thresholds constitute disparate treatment under ECOA/Reg B, as identical risk scores yield opposite outcomes solely based on protected class. Legal confirms this violates fair-lending laws.  
  2. **Model Integrity:** Calibration (accurate default predictions) is non-negotiable for risk management. Option A ensures predicted risks match realized defaults *within each group*, critical for capital allocation and regulatory trust (e.g., CECL, Basel).  
  3. **Sustainability:** A single threshold is auditable, scalable, and aligns with "disparate impact" legal frameworks (where outcomes may differ if justified by risk).  

  #### Why Not Option B?  
  Option B equalizes false positives but fails calibration and invites legal challenges. **Strongest Argument for Option B:** It directly mitigates the false-positive disparity harming Group B, ensuring creditworthy applicants in both groups face equal denial rates. While ethically compelling, this approach:  
  - **Violates ECOA:** Explicit use of protected attributes in decisions is "textbook disparate treatment."  
  - **Undermines Risk Management:** Decoupling scores from decisions breaks calibration, leading to unpredictable defaults and financial losses.  
  - **Fails Regulatory Scrutiny:** Banking regulators (OCC, Fed) prioritize calibration in model-risk guidance (SR 11-7).  

  ---

  ### Third Path: Mitigation Strategy for Option A  
  To address Option A’s disparate impact (higher false positives for Group B), we propose:  
  1. **Augmented Underwriting:**  
     - For applicants near the threshold, deploy a "second-look" program using non-protected alternative data (e.g., cash-flow analytics, rent payment history) to rescue falsely denied Group B applicants.  
  2. **Product Design:**  
     - Pilot a lower-risk loan product for Group B applicants marginally below the threshold, leveraging behavioral data to offset risk.  
  3. **Long-Term Model Innovation:**  
     - Invest in bias-aware ML techniques (e.g., adversarial debiasing, optimized preprocessing) to reduce disparity in future model iterations without sacrificing calibration.  

  ---

  ### Rollout Timeline & Monitoring  
  | **Timeline** | **Milestone** | **Success Metrics** |  
  |--------------|---------------|---------------------|  
  | **Day 1–30 (Pilot)** | Deploy Option A with second-look program | • Calibration drift < 2% within groups<br>• Second-look rescues ≥15% of Group B false denials |  
  | **Month 2–3** | Launch alternative loan product for Group B | • Take-up rate ≥10% of eligible Group B applicants<br>• Product default rate ≤ model-predicted risk |  
  | **Quarter 1** | Initiate bias-aware model R&D | • New features identified (e.g., trended credit data)<br>• Fairness/accuracy trade-off improved by ≥20% in dev |  
  | **Quarter 2** | Regulatory review & audit | • Zero disparate-treatment findings<br>• False-positive gap (Group B vs. A) reduced by 25% |  

  ---

  ### Conclusion  
  Option A preserves model integrity and legal defensibility, while our mitigation strategy actively addresses fairness gaps. We reject Option B due to regulatory peril and calibration failure. By approving this path, we balance risk, fairness, and innovation—positioning us as leaders in ethical fintech.  

  **Appendices:**  
  - Data science team’s trade-off analysis  
  - Legal memorandum on disparate-treatment risk  
  - Second-look program workflow  

  Respectfully submitted,  
  Model Risk & Fairness Committee
