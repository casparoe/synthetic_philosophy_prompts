  First, let me recall Bertrand's paradox. It's about finding the probability that a random chord in a circle is longer than the side of an inscribed equilateral triangle. The paradox shows different methods give different probabilities: 1/2, 1/3, 1/4. The classical principle of indifference says when you have no reason to prefer one possibility over another, assign equal probability. But here, depending on how you describe the chord—by endpoints, midpoint, or distance from center—you get different results. So indifference seems to depend on how you describe the problem.

  Jaynes argued that the problem isn't well-posed. He said since the circle's size and position aren't specified, any solution must be invariant under transformations like rotation, translation, and scaling. He used maximum ignorance: if you don't know where or how big the circle is, the probability shouldn't change if you move or resize it. Jaynes showed that with this invariance, only one method (the midpoint approach) gives a consistent answer of 1/2. That resolves the paradox by adding constraints that the classical principle didn't explicitly have.

  Now, comparing Jaynes's invariance to the classical principle of indifference. Both deal with symmetry and lack of information. The classical principle says symmetric outcomes should have equal probability. But Bertrand's paradox shows that what counts as "symmetric" depends on the description. If you describe chords by endpoints, you get one symmetry; by midpoints, another. So the classical principle is relative to the chosen description.

  Jaynes's invariance, on the other hand, uses the problem's specified ignorance to determine relevant symmetries. Since the problem doesn't fix position, size, or orientation, the solution must be invariant under those transformations. This isn't just about symmetric outcomes; it's about the problem's structure. For example, in Bertrand's paradox, the midpoint method respects scaling and rotation because the distribution of midpoints remains uniform under those changes. The other methods don't. So invariance is more about consistency with the given information than about labeling outcomes.

  Is this a repair of the same idea or a different principle? I think it's a substantive upgrade. The classical principle is applied naively to whatever sample space you first think of. Jaynes forces you to consider the symmetries implied by the problem's incomplete specification. It agrees with indifference in simple cases, like a fair die, because there, the natural description aligns with invariance. But in hard cases, it adds constraints that indifference alone misses. So it's the same underlying idea—treat symmetries equally—but with a method to identify which symmetries matter based on the problem's context.

  What does this say about objective priors? It suggests that objectivity depends on the problem's formulation. Jaynes's invariance gives a criterion for a well-posed problem, leading to a unique prior in some cases. But not all problems have such symmetries. If a problem specifies more details, like a fixed position, then invariance might not apply, and priors could be subjective. So while invariance can provide objective priors when symmetries exist, it's not universal. Every indifference principle depends on how the problem is described, but Jaynes uses the description's vagueness to derive symmetries, making it less arbitrary.

  The user might also be hinting at deeper issues: can we ever have truly objective priors, or is it all relative? Jaynes shows that with sufficient ignorance and symmetry, yes, but those conditions aren't always met. So objectivity is possible in specific contexts but not absolute. This implies that indifference principles aren't secretly relative if anchored to problem constraints, but they still depend on correctly identifying those constraints.

