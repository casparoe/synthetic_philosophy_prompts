answer: |-
  ## The Unknowable Core

  Maya watched Ben fold the laundry, his movements precise, his brow furrowed in concentration. He looked solid, reliable. *Courageous*, she thought, the word a talisman against the gnawing doubt. Six months ago, Ben had walked away from a lucrative, soul-crushing finance job to pursue woodworking. To Maya, it felt like leaping off a cliff. *That took guts,* she’d told him, clinging to the evidence.

  But doubt, once seeded, grew thorns. Was it *true* courage, a deep wellspring, or just a moment of frustrated rebellion? She needed to know the man she’d married, the bedrock beneath the quiet smiles and folded t-shirts. So, she tested.

  "Hey," she said casually, stacking plates after dinner. "Remember that abandoned quarry near Miller's Ridge? The one with the insane cliff jump? I heard some kids were swimming there last weekend." She watched his eyes. "Maybe we should check it out? For old times' sake? Before they fence it off."

  Ben paused, drying a glass. A flicker, almost imperceptible, crossed his face – not fear, but a sudden, intense calculation. "Water probably filthy," he mumbled. "And rusty rebar everywhere. Not worth the risk, Maya." He turned back to the sink, his shoulders slightly hunched. *Test one: failed*, Maya thought, the thorn digging deeper. Where was the man who quit his job? Had she imagined his boldness?

  Weeks later, her testing took a different shape. They were walking home from the cinema when a shattering scream ripped through the quiet street. Ahead, under a flickering streetlamp, a man had a woman pinned against a car, her purse strap tangled in his fist. Ben’s body tensed instantly. Maya saw it – the intake of breath, the forward lean, the pure, reflexive surge to intervene. *There!* her heart sang. *That’s him!*

  But before Ben could take a full step, two burly men who’d been arguing outside the corner pub surged forward. "Oi! Leave her alone!" one roared, grabbing the assailant's arm. The other positioned himself firmly between Ben and the struggling pair. "We got this, mate," the second man said, his voice firm, blocking Ben’s path effectively. The altercation was over in seconds; the would-be thief vanished down an alley, the woman freed, the pub-goers receiving her shaky thanks.

  Ben stood frozen, his fists clenched, the thwarted impulse radiating off him like heat. He looked at Maya, frustration and something like shame warring in his eyes. "I... I was going to..." he stammered. Maya squeezed his arm. "I know," she whispered, but the thorn twisted. He *had* been ready. He *had* moved. But he hadn't *done* anything. The opportunity, the impulse, had been **blocked** before it could bloom. Was that failure? Or just bad timing? Did it count?

  Her tests became subtler, woven into daily life. Suggesting he confront their landlord about the broken heater. Pointing out an ethical dilemma in a news story. Observing his reaction to a near-miss car accident. Each moment felt like probing a bruise, searching for the true shape of the injury beneath.

  One rainy Tuesday, they sat in silence, the only sound the drumming on the roof and the rhythmic *thunk* of Ben’s chisel on oak. Maya watched his hands, steady and sure, shaping something beautiful from raw wood.

  "Ben," she said softly, the question escaping before she could cage it. "That night... with the woman... what stopped you? Really?"

  He put down the chisel, wiping sawdust from his hands. His gaze was distant, fixed on the emerging curves of the wood. "I don't know, Maya. I just... reacted. Then those blokes were there." He looked at her, his eyes clouded with the same uncertainty that haunted her. "Sometimes... I don't know *what* I'd do. What I'm *really* like until the moment hits. And even then..." He trailed off, picking up the chisel again, running his thumb along its sharp edge. "Even then, something else might happen. Someone else might step in. The moment might... change."

  Maya looked at the sculpture emerging under his hands – strong, graceful, yet its final form still hidden within the block. She looked at Ben, his face illuminated by the workshop light, etched with concentration and a quiet, unanswerable question. She had seen the spark of courage snuffed out before it could ignite by a sudden, internal shift she couldn't fathom. She had seen the flame of action smothered by an external hand before it could catch. She had tested, and tested, and tested.

  And now, watching him work, the only certainty was the rain on the roof, the scent of oak, and the profound, echoing silence where the answer to "What is he *really* like?" should have been. The tests were over. The truth, it seemed, was as elusive and conditional as the light flickering across the wet workshop window. Could any test, any moment, ever truly tell? The wood yielded to Ben's tool, but the core of him remained shrouded, a mystery even to himself, revealed only in flashes that circumstance could extinguish or obscure before they ever truly proved a thing.
