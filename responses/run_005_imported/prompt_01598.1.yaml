  Ok so I fell down a rabbit hole this weekend on the two-envelope paradox thing - you know, two envelopes, one's got double the cash of the other, you pick one, then get offered a swap, and the naive expected-value math seems to say switching is always a good idea no matter which envelope you're already holding. I'm a backend engineer so the algebra wasn't the hard part - what actually broke my brain a little was realizing the swap argument is perfectly symmetric, it never tells you to stop, so if you actually followed it you'd just swap forever. My roommate's doing a stats masters and tried explaining the whole "there's no valid uniform prior over all positive amounts of money" resolution to me, and I sort of followed it, but mostly I just think its funny that such a dumb-sounding setup produces an infinite loop of regret.

