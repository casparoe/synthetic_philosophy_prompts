  But their hesitation is crucial. They point out that the RG flow depends on the underlying microdynamics, which might involve necessary connections—something Humeans reject. So, even if the macro-law is descriptive, the micro-level might still be anti-Humean. That's a valid concern. The user is essentially asking if their analogy holds or if they're shifting the problem down a level.

