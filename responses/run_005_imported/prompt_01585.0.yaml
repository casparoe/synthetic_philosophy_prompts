  They might not have considered how anti-Humeans like Maudlin would counter their analogy. For instance, Maudlin might argue that RG flow's success presupposes dynamical laws at the micro-level. Also, the user's example of universality strengthening Humeanism is a strong point, but the dependency on initial dynamics remains a vulnerability. 

  Suggesting they read Callender or Frisch could help them position their argument within existing literature. Emphasizing their unique viewpoint from condensed matter, especially with concrete examples like the Ising model, adds credibility. They should clarify the distinction between fundamental and emergent laws and address potential objections upfront. 

