  For structure: Open with the joke immediately to hook both audiences. Then pivot to how the professor embodies this paradox - believing fiercely in existence beyond construction. That's her teaching philosophy in a nutshell. Finally connect it to retirement: her impact exists even if we can't "construct" her presence anymore. 

  The emotional payoff should be that her work persists like those maximal objects - not because we see them, but because we trust they're there. That satisfies both crowds: logicians get the meta-commentary on equivalence, non-math folks get the tribute to legacy.

  Biggest risk is over-explaining the math. Must resist. That "existence doesn't owe you" line is the anchor - repeat it verbatim as her trademark. When describing equivalence, use simple metaphors: "same logical substance, different emotional taste." 

  End by bringing the axiom full circle: just as choice feels obvious but well-ordering feels false, her retirement feels inevitable but still somehow surprising. That's the human truth in the paradox.
answer: |-
  Here’s a toast crafted for your professor, balancing warmth, wit, and mathematical heart—designed to resonate with both halves of the room:

  ---

  **(Raise glass, smile at the professor)**  
  "Professor, as I stand here—*summoned*, much like one of your favorite maximal objects—I’m reminded of an old joke that’s followed you around this department for decades. It goes like this:  
  *The Axiom of Choice is obviously true.  
  The Well-Ordering Theorem is obviously false.  
  And Zorn’s Lemma?  
  Well… nobody knows.*  

  **(Pause for laughter, nod to the logicians)**  
  Of course, we all know these three are *logically equivalent*. Proof doesn’t care about intuition. But isn’t it wonderfully human that even when we *know* two things are the same, they can *feel* so different? That gap between proof and belief—between what we *know* and what we *feel* must be true—is where your magic lived.  

  **(Shift tone to warmth, include the whole room)**  
  For thirty years, you’ve been our Zorn’s Lemma incarnate: steadfast, elegant, and conjuring brilliance out of thin air. When constructivists asked for blueprints, you’d just grin and remind us, *'Existence doesn’t owe anybody a construction.'* And my god, how you proved it. Not just in theorems, but in us.  

  **(Soften, speak directly to her)**  
  You taught us to trust the abstract spaces—to know that what *must* exist, *does*, even if we can’t draw it. You showed us that rigor and joy aren’t opposites; they’re complements, like choice and Zorn. And when you wielded that lemma like a wand—*poof*—suddenly the impossible had structure. The unseen had weight.  

  **(Raise glass higher)**  
  So here’s to the professor who taught us that equivalence isn’t sameness. That the gap between ‘obvious’ and ‘unthinkable’ is where curiosity lives. And that sometimes, the most profound truths—like your impact on all of us—don’t need a construction to be real. They just *are*.  

  **(Final smile)**  
  To Professor [Name]: may your retirement be as maximally excellent as the objects you conjured. Existence doesn’t owe you a quiet farewell… but we’d construct one for you anyway. Cheers!"  

  ---

  ### Why this works:
  - **Timing**: ~2.5 minutes spoken slowly, with pauses.  
  - **Math layer**: Logicians will hear the meta-commentary on equivalence vs. intuition. Non-math guests hear "trusting the unseen" as a tribute to her mentorship.  
  - **Emotional core**: Uses the joke’s paradox to mirror how her legacy *feels*—undeniable yet almost magical.  
  - **Her voice**: Quotes her signature phrase ("existence doesn’t owe...") to personalize it.  
  - **Ending**: Connects math to human impact without metaphor strain.  

  The toast avoids explaining Zorn’s lemma while *using* its cultural weight in the dept. It’s a love letter to her spirit, framed by the logic she adored. And yes—it’s proof that warmth and rigor can coexist. Just ask her.
