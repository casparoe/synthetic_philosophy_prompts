prompt: |-
  Okay so my friend Dev and I got into it pretty good last night after our moral responsibility seminar - we'd just gone over Frankfurt's 1969 paper on alternate possibilities (the Jones and Black case, where Black's got some way to force Jones to shoot the guy if Jones looks like he's chickening out, but Jones goes through with it on his own so Black never actually has to step in). I was making the point that this shows you can be blameworthy even without being able to do otherwise, so the whole "principle of alternative possibilities" thing is basically dead.

  Dev wasn't having it though. He said Locke already pulled this exact move centuries earlier with that bit about the guy who's locked in a room without knowing it, decides on his own to stay and keep talking with someone rather than leave, and Locke's whole point is that the guy stays "voluntarily" even though the door being locked means he literally couldn't have left. Dev's take was that Frankfurt just took Locke's old point about voluntary action and repackaged it with a sci-fi mind-reading device, and that everyone treats Frankfurt cases like this huge breakthrough when really its just Locke with extra steps.

  I kind of see where he's coming from but it also felt off to me, like there's something the Jones/Black case is doing that the locked-room case isn't, i just couldn't nail it down on the spot (and obviously neither of us had the actual Locke text pulled up at 1am to check). Could you actually dig into this properly for me? Walk through what's structurally the same and what's genuinely different between Locke's locked-room case and Frankfurt's counterexample, and give me a real verdict on whether Dev's "it's the same trick" claim holds up - or whether Frankfurt's case is doing something harder/more specific to the free will debate that Locke's example doesn't actually capture. Want to have an actual comeback ready next time this comes up.
