  The strongest charitable reconstruction I see is that Weil is working with a normative ontology: any institution structured to prioritize self-expansion will necessarily subordinate truth and justice. This turns the empirical observations into symptoms of an inherent institutional logic. The "germe" language suggests it's a potentiality that actualizes under given conditions - hence her caveat about surrounding parties limiting each other.

