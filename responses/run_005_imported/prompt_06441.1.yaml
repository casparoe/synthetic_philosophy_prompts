  What's subtle here is they're sensing Strawson's argument has two layers: descriptive (we can't help but take participant stance with humans) and normative (it's appropriate because of shared rational capacities). AI tests both. Even if we could sustain participant stance toward AI, should we? Strawson would say no - the "mind" prerequisite is baked into his conditions for appropriateness, not just psychology.

  Also worth noting: their example of self-driving cars introduces moral gravity absent in chatbot frustration. Strawson's framework might handle that differently - we might feel agent-like anger at the car while knowing intellectually it's misdirected. That dissonance is precisely what Strawson helps dissect.

