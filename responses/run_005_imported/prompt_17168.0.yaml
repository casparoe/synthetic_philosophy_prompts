prompt: |-
  So we just finished the social choice unit in my game theory class and I'm still kind of stuck on the Gibbard-Satterthwaite theorem. Like, the proof basically shows that the second you want a voting rule that's defined for any possible ranking of three or more candidates and isn't a flat-out dictatorship, somebody somewhere is going to have an incentive to vote insincerely — there's no way around it, which feels like a weirdly depressing thing to prove on a Tuesday morning. My study group has been trying to turn this into a joke for our group chat all week and every attempt so far has just been some version of "haha just make me the dictator," which isnt even a joke, its basically just restating the theorem with extra smugness.

  What I actually want is something that plays on the real mechanics of the result, not just "voting bad, dictator funny." Like maybe something about how everything's totally fine and strategy-proof as long as you only have two candidates (shoutout to May's theorem for that one) and it all falls apart the moment a third option walks in, or something about the weird "choose one" menu of manipulable vs. dictatorial that the theorem leaves you with. Can you write me an actual joke — setup and punchline — about the Gibbard-Satterthwaite theorem, the kind that would actually land with someone who sat through the proof instead of just being a generic "math is hard" joke? Bonus points if I can post it in the chat without three people immediately asking me to define strategy-proofness first.
