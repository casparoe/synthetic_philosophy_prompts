prompt: |-
  I've got a philosopher coming on my podcast next week whose new book defends virtue ethics against the situationist critique (the Doris/Harman line, built on stuff like Milgram and the Good Samaritan study). His go-to move, in literally every interview he's done, is that those experiments just show behavioral variability across situations, not the absence of a stable evaluative outlook -- so they're talking past what Aristotelians actually claim. Give me 8-10 questions that don't let him coast on that line. I want one on whether virtue ethics itself is guilty of the fundamental attribution error it pins on folk psychology, one on whether his "content of character" dodge (following Kamtekar) just makes trait ascriptions unfalsifiable -- make him deal with Epstein's aggregation-principle defense so he can't just say the studies are too narrow -- and one on whether Aristotle's own claim that full virtue is rare basically concedes the situationists' empirical point while insisting its not a problem for the theory. Tack a quick follow-up onto each of those three, keyed to whatever dodge he'll probably reach for.
reasoning: |-
  Okay, let's tackle this user's request. They're hosting a philosopher on their podcast who defends virtue ethics against situationist critiques. The philosopher's usual defense is that experiments like Milgram's show behavioral variability, not the absence of stable character traits. The user wants questions that challenge this defense without letting him default to his standard line.

  First, I need to understand the core arguments. The situationist critique, based on studies like Milgram and the Good Samaritan, argues that behavior is more influenced by situations than by stable character traits. The philosopher counters that these experiments misinterpret Aristotelian virtue ethics, which doesn't claim perfect consistency but a stable evaluative outlook. The user wants to push beyond this.

  The user specified three main questions: one on virtue ethics committing the fundamental attribution error, another on Kamtekar's "content of character" making traits unfalsifiable (bringing in Epstein's aggregation principle), and a third on Aristotle's rarity of virtue conceding the situationist point. Each needs a follow-up to preempt dodges.

  Starting with the fundamental attribution error. Virtue ethics criticizes folk psychology for overemphasizing traits and ignoring situations. But does virtue ethics itself make a similar error? The philosopher might argue that virtue ethics includes situational awareness. The follow-up should challenge whether this is theoretical and not practical, using Aristotle's phronesis. The follow-up needs to question if this is just an ideal, not realized in practice.

  Next, Kamtekar's idea that traits are about evaluative stances, not specific behaviors. This could make traits unfalsifiable since any behavior can be rationalized. Epstein's aggregation principle says averaging behaviors across situations reveals traits. The question needs to press why aggregated data still shows inconsistency. The follow-up should ask why aggregated data still shows inconsistency, pushing against the idea that aggregation solves the problem.

  Third, Aristotle's admission that true virtue is rare. If most people lack stable traits, doesn't that align with situationist findings? The philosopher might say virtue ethics is normative, not descriptive. The follow-up should challenge if this reduces virtue to an unattainable ideal, making the theory irrelevant for most people.

  Also, the user wants 5-7 more questions. These should cover empirical adequacy, practical application, cultural variability, cross-situational consistency, and comparisons to other ethical frameworks. Each question must avoid letting the philosopher revert to his standard defense. For example, asking how virtue ethics can be empirically tested or how it handles cultural differences without relativism.

  Need to ensure all questions force the philosopher to engage deeply. Anticipate possible dodges and craft follow-ups that close escape routes. For instance, if he uses phronesis as a response, the follow-up should question its empirical presence. Or if he distinguishes normative from descriptive, challenge the practical relevance of the theory.

  Also, considering including questions on modern psychology's compatibility, the role of scaffolding, and whether virtue ethics can be falsified. Each question should target a different angle, ensuring comprehensive coverage without overlap. The goal is to create a tight net that prevents default responses and pushes for substantive answers.
answer: |-
  Here are 8 tough questions designed to bypass the "behavioral variability vs. stable evaluative outlook" dodge, including your specific requests and follow-ups, plus 5 more targeting key pressure points:

  1.  **The Fundamental Attribution Error Mirror:**
      *   **Question:** Virtue ethics explicitly criticizes folk psychology for committing the Fundamental Attribution Error (FAE) by over-attributing behavior to character and underweighting situations. But doesn't virtue ethics *itself* risk a similar error by positing robust character traits (hexeis) as the *primary* explanation for *virtuous* action? Isn't the core situationist critique precisely that virtue ethics overestimates the cross-situational stability of these traits in the face of powerful situational pressures, mirroring the FAE it diagnoses?
      *   *Anticipated Dodge:* "Virtue ethics accounts for situations via *phronesis* (practical wisdom)."
      *   **Follow-Up:** But *phronesis* is supposed to be part of the stable character trait. If situational pressures consistently overwhelm even the *capacity* for *phronesis*-guided action in predictable ways for most people (as Milgram/Good Samaritan suggest), doesn't that empirically undermine the *practical reality* of these stable traits as the *dominant* causal force, regardless of the agent's internal 'evaluative stance'? Isn't the FAE critique then hitting the *theory's own explanatory structure*?

  2.  **Kamtekar, Content, and Falsifiability (with Epstein):**
      *   **Question:** You champion Kamtekar's move: virtue traits are about the stable "content of character" (evaluative commitments) not specific behaviors. Doesn't defining traits primarily by internal "commitment" or "evaluative stance," decoupled from predictable behavioral *manifestations* across diverse situations, risk rendering virtue ascriptions effectively *unfalsifiable*? Any failure can be attributed to "the situation overwhelming commitment" rather than a flaw in the trait concept itself. How is this not ad hoc?
      *   *Anticipated Dodge:* "It's not unfalsifiable; we look for patterns *over time and across situations* (aggregation)."
      *   **Follow-Up:** But Epstein's aggregation principle shows that averaging *behavior* across situations reveals stable *behavioral* dispositions, which situationist studies find are highly situation-specific (e.g., honesty in one context doesn't predict it in another). If aggregating *behavior* shows low cross-situational consistency, and the "content of character" is defined *independently* of consistent behavior, what *empirical evidence* could *actually falsify* the claim that a person possesses a specific virtue trait? Doesn't this definition shield the theory from the very data Epstein uses to defend *trait* psychology?

  3.  **Aristotle's Rarity & Conceding the Empirical Point:**
      *   **Question:** Aristotle himself states that achieving full, stable virtue (hexis) is exceedingly rare, requiring fortune, habituation, and teaching. Doesn't this concession directly align with the *empirical core* of the situationist critique – that robust, cross-situationally consistent dispositions of the kind virtue ethics prizes are *exceptionally uncommon* in the general population? Aren't situationists just providing the empirical evidence for Aristotle's own observation about rarity, while you're arguing this rarity *doesn't* undermine the theory?
      *   *Anticipated Dodge:* "Virtue ethics is a normative ideal; it describes the goal, not the statistical norm. Rarity isn't a refutation."
      *   **Follow-Up:** If the theory posits traits that are empirically *unattainable* or *vanishingly rare* for the vast majority of people under normal developmental conditions (as situationist data suggests), doesn't this severely limit its *practical relevance* as a guide for moral education, self-cultivation, or social policy for real human beings? Isn't it functionally equivalent to saying "true virtue is almost impossible, but here's the ideal anyway"?

  4.  **The Empirical Burden:**
      *   **Question:** Beyond defending against situationism, what *positive empirical evidence* does virtue ethics offer that robust, *cross-situationally consistent* character traits of the kind it describes (e.g., courage that manifests in physical danger, social pressure, and temptation) *actually exist* as dominant causal forces in behavior? If the best evidence is philosophical intuition or folk psychology, isn't that vulnerable to the very FAE critique virtue ethics levels?
      *   *Follow-Up Angle:* Press on specific methodologies – longitudinal studies? Specific aggregated behavioral measures? Neuro/cognitive correlates?

  5.  **Virtue vs. Scaffolding:**
      *   **Question:** Situationists argue that seemingly "virtuous" behavior often relies heavily on external "scaffolding" – routines, environments, cues, institutions – rather than internal dispositions. Doesn't virtue ethics systematically *underestimate* the necessity and effectiveness of this scaffolding for producing good outcomes, and *overestimate* the sufficiency of internal character development alone? (e.g., Could Milgram subjects have resisted with better institutional checks, *without* needing superhuman virtue?).
      *   *Follow-Up Angle:* Does this shift the moral focus too much *away* from designing good systems and environments?

  6.  **Cultural & Contextual Variability:**
      *   **Question:** Situationism highlights how situational forces are often culturally and contextually specific. Given that virtue ethics grounds virtues in a conception of human flourishing (*eudaimonia*) that itself can be culturally contested, doesn't this make the *specific content* of the "stable evaluative outlook" highly variable? Doesn't this undermine the claim of universality for specific virtues and risk collapsing into a form of situationism-lite where the "stable outlook" is itself heavily shaped by situational/cultural context?
      *   *Follow-Up Angle:* How can virtue ethics avoid relativism if the "content of character" deemed virtuous is so context-dependent?

  7.  **The Predictive Power Problem:**
      *   **Question:** A core scientific criterion for a construct is predictive power. If virtue traits, defined by their stable "evaluative stance," *cannot reliably predict specific behaviors* in novel or powerful situations (as situationist experiments demonstrate), what is their *explanatory or predictive utility* compared to understanding the specific situational dynamics at play? Doesn't this make situationist explanations *more powerful* for understanding and influencing actual behavior?
      *   *Follow-Up Angle:* If traits can't predict behavior well, what *exactly* do they explain that situationist factors don't explain better?

  8.  **Is Virtue Ethics Falsifiable?**
      *   **Question:** Taken together – the emphasis on internal "content of character," the allowance for situational defeaters via *phronesis* failure, the admission of rarity – what conceivable empirical finding *could* falsify the core claim of Aristotelian virtue ethics that robust character traits *can* exist and be the primary cause of virtuous action? If no such finding is possible, is virtue ethics operating more as a philosophical faith than an empirically grounded theory?
      *   *Follow-Up Angle:* Challenge him to state a clear falsification condition.

  **Key Tactics Embedded:**

  *   **Bypassing the Dodge:** Questions 1, 2, 3, 4, 7, and 8 directly challenge the *internal logic*, *empirical grounding*, or *falsifiability* of the virtue traits concept *itself*, regardless of the "evaluative stance vs. behavior" distinction. Questions 5 and 6 attack flanking positions (scaffolding, cultural variability).
  *   **Forcing Engagement:** The follow-ups anticipate common retreats ("*phronesis*", "aggregation", "normative ideal") and push further, demanding concrete answers on empirical evidence, predictive power, falsifiability, and practical relevance.
  *   **Leveraging Internal Tensions:** Highlighting the tension between Aristotle's rarity claim and the theory's aspirations (Q3), or between criticizing FAE and potentially committing a similar error (Q1).
  *   **Focus on Practicality & Relevance:** Questions 3 (Follow-Up), 5, and 7 emphasize the real-world implications and potential shortcomings of VE as a guide for action or policy compared to situationist insights.

  Use these to keep the conversation focused on the *substance* of the critique and the *empirical adequacy* of the virtue ethics response, rather than letting him restate the talking point about misunderstanding the "evaluative outlook." Good luck with the interview!
