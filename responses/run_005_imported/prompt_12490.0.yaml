  Ok this is kind of a weird one but here goes. My orchestra teacher, Mr. Doyle, is retiring this year and I got asked to say a few words at our last concert. Complication: he also teaches the school's 'Intro to Philosophy' elective and is way too obsessed with Schopenhauer, specifically the idea that music is different from every other art -- painting and poetry are supposedly copies of 'the Ideas,' but music skips that step and is somehow a direct copy of the Will itself, so it hits different than anything else. He's brought this up in rehersal so many times it's basically an inside joke now. Problem is half the audience is band parents and little siblings who just want something short and sweet, and the other half is seniors from his philosophy elective who will 100% clock it if I get the idea wrong, or if I accidentally make his favorite philosopher sound like his whole deal was 'life is meaningless suffering' (which, ok, kind of was his deal, minus the music part). Can you write me a speech, like 90 seconds tops, that actually uses the real idea in a way that means something instead of just name-dropping him, but doesn't turn into a huge bummer?
