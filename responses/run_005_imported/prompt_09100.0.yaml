answer: |-
  That's a fantastic and provocative question central to understanding the roots of resistance theory. Your reading of Aquinas highlighting the potential for tyrannicide is valid, but treating him as a direct origin point for the *liberal* right of revolution requires significant nuance. Historians tell the story differently for several compelling reasons:

  1.  **The Primacy of "Public Authority" and the "Common Good":** While Aquinas *does* discuss tyrannicide by a private individual in *De Regimine Principum* (I, 6), it's crucially presented as a **last resort** when:
      *   There is **no higher human authority** to appeal to (e.g., emperor, pope, corporate body).
      *   The tyranny is **intolerable** and manifestly destructive of the common good.
      *   The act is undertaken **not for private gain or vengeance, but solely for the liberation of the people and restoration of the common good**.
      This is fundamentally different from Locke's conception of a *right* residing in *individuals or the collective people* to judge and depose based on violation of a social contract protecting individual rights. For Aquinas, the actor is more akin to an agent of the *common good itself*, stepping into a void of legitimate public authority, not exercising an inherent individual or popular political right. The justification is restorative order, not popular sovereignty.

  2.  **The Absence of Popular Sovereignty:** Aquinas operates within a framework of **natural law and hierarchy**, not popular sovereignty or contract theory. Authority originates from God, mediated through natural order and practical necessity for the common good. The people don't *grant* authority in a way they can revoke based on popular will; they recognize and obey legitimate authority for their own benefit. Resistance, therefore, isn't an exercise of popular will reclaiming delegated power (Locke), but a desperate act to restore divinely ordained order when the ruler becomes a predator instead of a shepherd. The *source* of legitimacy remains God/natural law, not the people.

  3.  **Corporate vs. Individual Action:** Later resistance theorists, especially the Monarchomachs (like Hotman, Beza, Mornay) and Locke, placed immense emphasis on **corporate bodies** (Estates, Parliament, "the People" as a political entity) as the legitimate agents of resistance. Aquinas's allowance for *private* action is startlingly radical *in isolation*, but it's precisely because he lacks a developed theory of a *corporate popular body* with inherent political agency to act *officially* against the tyrant. His private individual acts in extremis *because* there's no constituted popular body to do it properly. Later theorists filled this void with doctrines of popular sovereignty and representation.

  4.  **The Role of the Church:** Aquinas's framework inherently allows space for intervention by **ecclesiastical authority** (the Pope) as a higher power ordained by God to guide temporal rulers towards the ultimate good (salvation). This is a crucial medieval context largely absent in later secularized theories. The Pope could potentially declare a ruler a tyrant and release subjects from obedience, providing a "public" avenue before resorting to private violence. Locke's theory explicitly rejects such ecclesiastical mediation.

  5.  **The Salamanca School & Monarchomachs as Key Bridges:**
      *   **Salamanca (Vitoria, Suárez):** They developed Aquinas's natural law framework much further in the context of the New World, Spanish imperialism, and emerging statehood. Crucially, they articulated a clearer doctrine that **political power originates *from* the community** (transferred to the ruler), establishing the foundation for popular sovereignty. Suárez explicitly argued that the community retains the authority to resist a tyrant *because* power resides fundamentally with them. This is a massive step beyond Aquinas towards Locke.
      *   **Monarchomachs:** Reacting to the French Wars of Religion, they provided detailed, practical theories of **constitutional resistance**. They argued that sovereignty resides with the people, delegated conditionally to the monarch via a covenant (often seen as embodied in fundamental laws/customs and represented by Estates/Parlements). Tyranny breaches this covenant, triggering the right/duty of **inferior magistrates** (nobles, Estates, local officials) to resist and even depose the tyrant. This is highly structured, corporate, and constitutional – a world away from Aquinas's lone avenger acting when all else fails. It directly influenced later constitutionalism and Locke.

  **Should you treat Aquinas as an earlier, more radical origin point?**

  *   **Yes, in terms of Radical Potential:** Absolutely highlight the radical *potential* within Aquinas. His clear statement that tyranny dissolves the duty of obedience and that, under extreme conditions lacking any other recourse, even private tyrannicide *can* be justified is profoundly significant. It cracks open the door of absolute obedience much earlier than often acknowledged. Emphasize that he provides a powerful *theological and philosophical justification* (rooted in natural law and the common good) for resisting manifest evil in authority.
  *   **No, as a direct equivalent to the Liberal Right:** However, resist the temptation to fully equate it with the later "liberal" right of revolution. The differences in conceptual framework (natural law/hierarchy vs. contract/popular sovereignty), agency (private last resort vs. corporate/constitutional action), and justification (restoring divine/natural order vs. reclaiming delegated popular power) are fundamental.

  **How to Frame Aquinas in Your Genealogy:**

  1.  **Foundational Justifier:** Position Aquinas as the crucial thinker who provided the **deep philosophical and theological bedrock** for resistance within the dominant medieval framework. He established that obedience is conditional, tyranny is illegitimate, and resistance *can* be morally justified under natural law for the common good. This made later developments possible.
  2.  **Highlight the Radical Seed:** Explicitly discuss the radical implications of the "private tyrannicide" passage in *De Regimine*, acknowledging it as a startlingly bold statement for its context. Explain *why* it's there (lack of constituted popular body) and its limitations.
  3.  **Emphasize the Gaps He Left:** Argue that while Aquinas provided the *justification* for resistance, he left underdeveloped the crucial questions of **agency** (Who acts? The private individual is insufficient and dangerous) and **mechanism** (How is it legitimately done? He offers no constitutional process). This created the space and necessity for the Salamanca theologians (developing popular origin of power) and the Monarchomachs (developing corporate/constitutional resistance mechanisms) to build upon his foundation.
  4.  **Contrast with Locke:** Explicitly contrast Aquinas's "restoration of natural/divine order via last-resort action" with Locke's "reclaiming of delegated popular sovereignty via the judgment of the people (or majority)." The lineage is real, but the concept *evolved* significantly.

  **Conclusion:** Your insight is sharp – Aquinas *is* a more radical and earlier point than he sometimes gets credit for, particularly regarding the dissolution of obedience and the extreme possibility of tyrannicide. **He is the indispensable origin point of the *justification* for resistance.** However, historians are right to emphasize Salamanca and the Monarchomachs as the key figures who transformed this justification into a more developed, politically actionable, and ultimately *liberal-compatible* theory of resistance by articulating popular sovereignty and corporate/constitutional mechanisms. Locke then secularized and systematized this legacy. Frame Aquinas as the profound thinker who planted the seed of justifiable resistance in fertile theological/natural law soil, which later thinkers cultivated into the recognizable tree of modern resistance theory. Your genealogy is strong, but its power lies in showing the *evolution* of the concept from Aquinas's conditional obedience and desperate remedy to Locke's individual right and popular sovereignty, not in making Aquinas a proto-Locke.
