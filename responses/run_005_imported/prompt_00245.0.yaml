prompt: |-
  So I've been chewing on L.A. Paul's transformative experience stuff again after my rationalist reading group went down a rabbit hole on it last night (the vampire thought experiment always gets people going). I'm actually facing a real-life version of this rn - trying to decide whether to have a kid - and the more I think about it the more I realize standard expected-value reasoning just doesn't work here, since by defintion I can't know what it's like to be a parent from the inside until I already am one, and my post-transformation preferences might just be totally different from my current ones anyway. Paul makes this distinction between epistemically transformative and personally transformative experiences that I think is doing a lot of work but I don't fully grasp the implications.

  Can you lay out the most important implications of the transformative experience problem for how someone should actually go about making a big irreversible life decision like this? I'm especially interested in whether there's some clever decision-theoretic workaround (the LW crowd loves those) for cases where you can't rely on your current preferences to evaluate the outcome, or whether Paul's point is basically that standard rational choice theory just breaks down here and we need some other framework entirely - and if so what that framework would even look like in practice.
