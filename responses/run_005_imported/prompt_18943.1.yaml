  ok so I'm a phil PhD student TAing intro phil of language this semester, and every time we hit the Kripkenstein reading half the room just glazes over at the quus stuff and then nods along politely once we get to the "skeptical solution." I want to open next week's section with a joke about the rule-following paradox to wake people up a bit. Can you write me one? It has to actually turn on the plus/quus indeterminacy (or the "no fact about which rule you were following" bit), not just be a generic "lol philosophers argue about dumb stuff" joke -- like someone whos actually done the reading should get why its funny, not just people who like word-association jokes about "rules." bonus points if you can work in how unsatisfying everyone always finds the whole "ask the community" move at the end.
