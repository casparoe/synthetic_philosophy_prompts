  Okay, random request: I'm plotting a scene for the novel I'm working on where two philosophers who used to be married run into each other at a mutual mentor's memorial, and afterward, in the parking lot, end up finishing an old argument instead of talking about the funeral. She's spent her career defending a fitting-attitude view of value -- something Scanlon-adjacent, goodness just is being the fitting object of a pro-attitude, and reasons to admire something ground its being admirable. He's the one who, years ago, hit her with what I think people call the wrong kind of reasons problem (possibly misremembering whose paper that's from, don't quote me): something like, if your company pays you a bonus for every day you sincerely admire the CEO, thats a real reason to admire him, but obviously not the kind of reason that makes him admirable -- so reasons-to-admire can't just be what admirableness consists in. Last time they hashed it out she was defending herself by splitting reasons into two piles, ones that are actually about the guy himself versus ones that are just about the perks of feeling the admiration, and he's convinced that split is rigged -- that she can always redescribe a perks-reason to make it sound like it's about the object, or that drawing the line at all quietly assumes the fitting/unfitting distinction it's supposed to explain. Can you write their exchange? I want real back-and-forth, both of them landing actual points, neither one just there to lose, and don't let it resolve neatly -- they should walk back to their cars still disagreeing. Maybe 500 words.
