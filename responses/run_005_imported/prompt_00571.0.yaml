  Hi! I'm working on a historical novel set at Oxford in 1956, and one whole subplot revolves around the real fight over Truman's honorary degree. I've got a philosophy don character (let's call her Constance Hale, though anyone who knows the history will clock who she's based on) who's basically the only fellow in her college willing to stand up and say the emperor has no clothes about the atomic bomb. The scene I'm building toward is a dinner-table row between her and a smug junior colleague who's a committed consequentialist, and I want her side of the arguement to actually hold together philosophically instead of just being "bombs bad."

  I mentioned the setup to my writing group last week and one of them said something like "well Truman didn't murder anyone, he never even saw them die, he just signed a bit of paper" — which is exactly the kind of lazy foreseeability-vs-intention dodge my consequentialist character should be making, and that Hale needs to actually demolish. From what I've read, the real pamphlet has two moves going on: the doctrine-of-double-effect argument (that the killing of civilians was intended as a means, not merely foreseen as a side effect of hitting a legitimate target), and a seperate, weirder claim that the true "root of all evil" was actually the Allied demand for unconditional surrender, since that's what supposedly made the bomb "necessary" in the first place. I can't tell if that second move helps her case or actually undercuts the clean intention/foresight line she's trying to draw elsewhere.

  Could you write me an essay that actually works through this properly? Lay out both of her moves, give the strongest consequentialist replies a sharp junior don could throw back at her (the "he never saw them" line included), and then don't hedge at the end — tell me straight whether, on Anscombe's own criteria for murder, Truman comes out guilty as charged, or whether the case is genuinely murkier than the pamphlet lets on. I need Hale to be able to say something with real conviction at that dinner table, not "well, it's complicated."
