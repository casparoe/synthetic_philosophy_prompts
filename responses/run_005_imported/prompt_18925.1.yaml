  We are going to address several interconnected points:

  1. The difference between iterated elimination of dominated strategies (IEDS) and rationalizability in two-player vs. three-or-more-player games.
  2. The role of independent vs. correlated beliefs in rationalizability.
  3. The definition of domination (pure vs. mixed strategies).
  4. A minimal example with three players showing a strategy that survives IEDS but is not rationalizable.
  5. The philosophical question: which concept better captures "common knowledge of rationality"?

  Let's break it down step by step.

  ### 1. Iterated Elimination of Dominated Strategies (IEDS) and Rationalizability

  - **IEDS**: This is an algorithm that iteratively removes strategies that are strictly dominated. A strategy is strictly dominated if there exists another strategy (or a mixed strategy, depending on the definition) that yields a strictly higher payoff for every possible combination of the opponents' strategies. The process repeats until no more dominated strategies can be found.

  - **Rationalizability**: A strategy is rationalizable if it is a best response to some belief about the opponents' strategies, where the belief is consistent with common knowledge of rationality. Importantly, the beliefs must be such that the opponents are also playing best responses to their own beliefs, and so on.

  In two-player games, it turns out that the set of strategies that survive IEDS (when we allow mixed strategies for domination) is exactly the set of rationalizable strategies. However, in games with three or more players, this equivalence breaks down.

  ### 2. The Role of Independent vs. Correlated Beliefs

  - In the definition of rationalizability, a player's belief about the opponents can be any probability distribution over the opponents' strategy profiles. This allows for correlation: a player can believe that the choices of the other players are correlated.

  - However, in the standard definition of domination (used in IEDS), when we say a strategy is dominated, we require that there is another strategy (or mixed strategy) that does better against every possible *profile* of the opponents. This is equivalent to requiring that the dominating strategy does better regardless of how the opponents play, even if their choices are correlated arbitrarily.

  But note: in the process of IEDS, we remove a strategy if it is dominated by some mixed strategy. The set of strategies that survive IEDS when we allow domination by mixed strategies is called the set of strategies that survive iterated elimination of strategies that are strictly dominated by a mixed strategy.

  ### 3. Domination: Pure vs. Mixed

  - A pure strategy is strictly dominated by a pure strategy if there exists another pure strategy that yields a strictly higher payoff against every possible profile of opponents' strategies.

  - A pure strategy is strictly dominated by a mixed strategy if there exists a mixed strategy (over the player's pure strategies) that yields a strictly higher payoff against every possible profile of opponents' strategies.

  It is crucial to note that a strategy that is not dominated by any pure strategy might still be dominated by a mixed strategy. Therefore, when we do IEDS, we typically allow domination by mixed strategies to avoid leaving in strategies that are clearly suboptimal.

  ### 4. Why the Gap in Three or More Players?

  The key difference between IEDS and rationalizability in three or more players lies in the way beliefs are formed:

  - In IEDS, when we check for domination, we require that the dominating strategy does better against **every** possible combination of the opponents' strategies. This is a very strong condition: it must hold even if the opponents play arbitrarily (and possibly in a correlated manner).

  - In rationalizability, a strategy is rationalizable if there exists **some** belief (probability distribution) over the opponents' strategy profiles (which may be correlated) such that the strategy is a best response.

  However, in three or more players, there is an additional twist: the beliefs of a player about the opponents must be consistent with the opponents being rational. But note that in the IEDS procedure, we do not require that the opponents' strategies that we consider in the domination condition are themselves rationalizable. We consider every possible profile of opponents' strategies, even those that may have been eliminated in a previous round or that are not rationalizable.

  Moreover, in the rationalizability concept, the beliefs must be such that they are consistent with common knowledge of rationality. This means that the opponents' strategies in the support of a player's belief must themselves be rationalizable given their own beliefs, and so on.

  But here is the critical point: in three or more players, a strategy might survive IEDS because it is not dominated when we consider all possible (including correlated) opponent profiles. However, for the strategy to be rationalizable, we require that there exists a belief (possibly correlated) that is consistent with common knowledge of rationality. The catch is that the correlated belief must be justified by the fact that each opponent is playing a strategy that is a best response to their own beliefs. But note: the beliefs of different opponents might be independent. In fact, the standard definition of rationalizability (as per Bernheim and Pearce) allows for correlated beliefs by a player about the other players. However, the opponents' choices are not required to be independent. 

  But wait: there are two concepts of rationalizability:
  - One that allows a player to have correlated beliefs about the other players (even if they are acting independently) and
  - One that requires beliefs to be independent (i.e., the player believes the opponents mix independently).

  Bernheim (1984) and Pearce (1984) both allowed for correlated beliefs. However, the IEDS procedure (with mixed strategies) does not require independence either. So why the gap?

  The gap arises because in IEDS, we are eliminating strategies that are strictly dominated by a mixed strategy. However, in three or more players, a strategy might survive IEDS but still not be rationalizable because the only beliefs that would make it a best response are beliefs that are inconsistent with common knowledge of rationality. Specifically, the belief might require that some opponents are playing strategies that are not rationalizable for them.

