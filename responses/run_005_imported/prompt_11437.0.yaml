     - She argues that if illusionism says it merely *seems* that experience has phenomenal qualities, then having that seeming must itself involve phenomenal consciousness (something it is like to have the seeming). Thus, illusionism presupposes what it denies.

   Move (2): Dan's reply
     - He says that Mira's objection only works if "seeming" is already taken to be phenomenal. Illusionists can hold that the introspective mechanisms generate representations (with the content that there is an intrinsic quality) without those representations being phenomenally felt. He uses the analogy of a visual motion illusion: we represent motion without actual motion.

   Move (3): Mira's response
     - She argues that the analogy fails because motion illusions can be explained completely in third-person functional terms, leaving nothing unexplained. But the first-person felt character is what needs explaining. She says that by positing a further representational state, Dan just moves the problem: what makes that state felt from the inside?

   Move (4): Dan's retort
     - He says Mira is simply reasserting that any introspectively accessed state must be genuinely phenomenal, which is the very point in dispute. He claims that insisting on this isn't a refutation but a restatement of the intuition illusionism tries to explain away.

   We are to score each move from -2 (clearly mistaken) to 2 (clearly right) and then provide a brief justification for each.

   Let's break down:

   Move (1): Mira's argument is a classic objection to illusionism (sometimes called the "illusion of illusion" problem). It points out that the very notion of an illusion of consciousness might require consciousness. This is a strong point and has been made by philosophers like Keith Frankish (an illusionist) who acknowledges it as a challenge. However, it is not necessarily fatal because illusionists can try to explain the seeming without invoking phenomenal consciousness. So it's a good move but not decisive.

   Move (2): Dan's reply is a standard illusionist response. He distinguishes between phenomenal and non-phenomenal seemings. The analogy with visual illusion is appropriate because in that case we have a representation of motion without real motion. Similarly, the illusionist claims we can have a representation of phenomenal qualities without real phenomenal qualities. This is a reasonable counter.

   Move (3): Mira's response points out that the analogy doesn't fully capture the issue. The motion illusion is explained by third-person mechanisms, but the first-person aspect of experience remains unexplained. She argues that the representational state itself would have to have a first-person feel, or we haven't explained it. This is a valid point: the hard problem of consciousness is about the subjective feel, and if we replace phenomenal consciousness with a representation of it, we still need to account for why that representation has a subjective aspect. However, illusionists would deny that the representation has a subjective aspect; they would say it only represents that it does.

   Move (4): Dan's response is that Mira is begging the question by assuming that any introspective state must be phenomenal. He says the dispute is exactly about whether introspective states are phenomenal or not. This is a fair point: if illusionism is true, then the introspective state is not phenomenal but merely represents that it is. So Mira's challenge assumes what she is trying to prove.

