answer: |-
  This is one of the most sophisticated and beautifully articulated dilemmas in detective fiction craft I've encountered. You've pinpointed the core tension: the gap between **information presence** and **reader responsibility**. Both your beta reader camps are right in their own way, and the solution lies not in dismissing one side, but in refining your understanding of "fair play" beyond mere disclosure.

  Here's a breakdown of the principles at play, and actionable strategies for your manuscript:

  ## The Core Principles (Beyond "It's There")

  1.  **"Fair Play" as Reader Empowerment, Not Just Fact Disclosure:** The Golden Age ideal isn't just that clues exist, but that the *reader stands a chance* of solving the puzzle alongside the detective. This requires not just presence, but **accessibility and combinability** within the reader's cognitive process *during* the first read.
  2.  **The Cognitive Load Challenge:** Readers aren't databases. They filter information based on perceived relevance, narrative flow, and memory limitations. Three disparate facts scattered across significant narrative distance (Ch. 2, 5, 8) impose a high cognitive load.
  3.  **The Necessity of Connection Points:** "Fair play" requires not just individual clues, but **potential pathways** for the reader to connect them *before* the detective does. These pathways are forged through:
      *   **Proximity:** Clues related to the same core problem are presented close together.
      *   **Repetition/Reinforcement:** Key details are subtly revisited or reframed.
      *   **Thematic Resonance:** Clues feel like part of a cohesive pattern or theme within the mystery.
      *   **Character Focus:** The clues are tied to characters or actions the reader is actively engaged with at the moment.
      *   **Narrative Weight:** The text subtly signals importance (e.g., a character reacts oddly to the clock remark, the narrator lingers on the victim's habit).
  4.  **The "Reasonable Inference" Threshold:** Can a reader, *without specialized external knowledge*, make the connection *based solely on the text*? If the solution relies on knowing obscure train timetables or medical trivia *not provided or hinted at within the novel*, it crosses into unfairness. The connection must be logical using common sense or knowledge implied/established in the story world.
  5.  **The "Aha!" vs. "Huh?" Factor:** Fair play creates an "Aha!" moment upon reveal: "Of course! It *was* there, I see it now!" Unfairness creates a "Huh?" moment: "Technically it was mentioned, but how was I *ever* supposed to link *those* things?"

  ## Why Your Beta Readers Are Divided & What's Likely Wrong

  *   **The "Fair Play" Camp:** They are technically correct on the *letter* of the law (facts present). They might be meticulous readers, genre-savvy, or simply enjoyed the puzzle and felt the reveal illuminated what was already there.
  *   **The "Ambushed" Camp:** They are highlighting the *spirit* of the law. The clues feel like isolated data points lost in the narrative noise. The connection feels arbitrary *until* the detective forces it. The high cognitive load (scattered clues, no linking mechanism) and potential reliance on external knowledge make the leap feel unreasonable on a first read. **This is the camp you *must* address.**
  *   **The Likely Culprits in Your Puzzle:**
      *   **Excessive Scatter & Delay:** Ch. 2 to Ch. 8 is a vast narrative distance. Readers have processed hundreds of other details by then.
      *   **Lack of Reinforcement:** The clues are presented as "throwaway" and "offhand," never revisited or framed as potentially significant.
      *   **No Implied Connection:** Nothing in the text *suggests* these three specific elements belong in the same mental bucket. They exist in separate character interactions, locations, or plot threads.
      *   **Potential External Knowledge Reliance:** Does the solution *require* the reader to know (without the text stating or implying) that a specific train time is incompatible with the victim's habit *only* if the clock is fast? If so, that's a problem.

  ## Principled Solutions for Your Manuscript (Not Just Convention)

  Don't add clues or change the solution. Instead, **engineer the narrative to make the connection feel inevitable in hindsight**:

  1.  **Create Subtle Proximity or Echoes:**
      *   Can the character who mentions the train time (Ch. 2) *also* be present or mentioned during the clock scene (Ch. 5), even peripherally? Or vice-versa? This creates a subconscious link.
      *   Can the victim's habit (Ch. 8) be mentioned *earlier* (even vaguely) by another character *in relation to timekeeping*? ("Old Mr. Abernathy was a creature of habit, you could set your watch by him... pity the drawing-room clock is so unreliable lately.")
      *   Does the detective *observe* one of the early clues and file it away, signaling its importance? (Not solving it, just noting it).

  2.  **Add Lightweight Reinforcement:**
      *   **Ch. 2 (Train):** Don't just state the train. Have the alibi-giver *emphasize* it defensively, or have another character casually question the timing ("That express is usually packed, wasn't it?"). Or, later, have *someone else* mention catching that specific train, making it a known entity.
      *   **Ch. 5 (Clock):** Don't just have a throwaway line. Have a character *act* based on the fast clock and be mildly inconvenienced ("Oh blast, I thought it was later! I've missed my..."). Or have the detective *glance* at it later and note the discrepancy internally. Mention it *once more* casually elsewhere.
      *   **Ch. 8 (Habit):** Frame it not just as a habit, but as a *rigid timetable* crucial to the victim's state of mind or routine. Have the person revealing it stress its inflexibility ("He *always* took his tonic at 9:30 PM on the dot, rain or shine. Wouldn't tolerate a minute's delay.").

  3.  **Establish the Connection Framework Earlier:**
      *   **Plant the Method:** Before Ch. 8 (the habit reveal), introduce the *idea* that timing is absolutely critical to the murder method or alibi break. Have the detective muse on the *precision* required. This primes the reader to scrutinize *all* timing-related details more closely.
      *   **Link Two Clues Explicitly:** Can you subtly connect *two* of the three clues before the final reveal? For example, in Ch. 5 or 6, have someone say, "If only we knew *exactly* when X arrived, but that confounded clock..." This doesn't solve it, but it links the concepts of arrival time and clock accuracy in the reader's mind, making the third clue (the habit) the final piece that snaps into this existing framework.

  4.  **Ensure Internal Logic (No External Knowledge):**
      *   **Double-Check Knowledge Dependence:** Within the narrative, *somewhere*, establish the necessary information. If the train time is key, have a timetable visible (or mentioned) in the house. If the habit's timing is medically significant, have a character (a doctor, a hypochondriac, someone reading a magazine) mention the relevant fact *in passing* earlier. The reader doesn't need to solve it, but the *data* for the logic must be present in the text.

  5.  **Strengthen the Detective's Explanation:**
      *   When the detective reveals the solution, meticulously walk through *why* these three specific facts were the key. Explicitly acknowledge their apparent insignificance ("You may recall a seemingly trivial remark about the 4:15 express...") and then build the logical chain step-by-step, showing how each piece *only* fits with the others. Make the connection feel like the *only* possible conclusion given those facts.

  ## Conclusion: Fair Play as Engineered Inevitability

  Fair play isn't an unprincipled truce; it's a **contract of empowerment**. The principle governing the gap between "given" and "derived" is: **Has the author provided not only the facts, but also sufficient *narrative scaffolding* to allow a reasonably attentive reader to perceive the *potential* connection *before* the detective explicitly makes it?**

  Your current puzzle has the facts but lacks sufficient scaffolding for the *specific combination* you require. The steps above add minimal text but significant cognitive signposting. By creating subtle links, reinforcing relevance, establishing the logical framework, and ensuring all data is internal, you transform your solution from a technically-present-but-obscure trick into a genuinely fair and satisfying "Aha!" moment that honors both the letter and spirit of the Golden Age tradition. 

  This approach satisfies the quest for principle ("reader empowerment through accessible combinability") and moves beyond mere convention. Good luck with the revisions – your manuscript sounds intriguing!
