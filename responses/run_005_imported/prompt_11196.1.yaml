prompt: |-
  So for my dept's game theory brown-bag we're doing a mock interview thing, and the 'guest' is a fellow PhD student playing a hardliner who defends iterated elimination of dominated strategies (mixed strategies allowed) as basically the correct general solution concept, on the grounds that it only needs common knowledge of rationality, unlike Nash equilibrium, which quietly assumes players' beliefs about each other's play are already correct. Can you draft 8-9 interview questions that dont just let him restate that pitch? I want one on the fact that a strategy can be dominated by a mix of two other strategies without being dominated by either one alone, and what that's supposed to mean for a player who can't actually randomize; one on why elimination order is totally irrelevant for strict dominance but not for weak dominance, and what he thinks that asymmetry is telling us; and one on the Aumann-style point that common knowledge of rationality in something like the centipede game forces backward induction all the way back to the first move, even though basically nobody plays that way. Give each question a follow-up keyed to whatever dodge he'll probably reach for -- and bonus points if one of them gets him to address how his 'iterated dominance equals rationalizability' equivalence stops holding exactly once you've got more than two players, unless everyone's conjectures about the other players are allowed to be correlated.
