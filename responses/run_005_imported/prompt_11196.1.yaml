answer: |-
  Here are 9 interview questions designed to probe the deeper implications and limitations of iterated elimination of dominated strategies (IEDS), complete with anticipated dodges and sharp follow-ups:

  ### Core Questions & Follow-Ups

  1.  **The Nature of Mixed Strategy Dominance & Feasibility:**
      *   **Q1:** "You emphasize mixed strategies in dominance. Consider a player who *cannot* physically randomize (e.g., due to a commitment device, deterministic AI, or personal principle). If their pure strategy `A` is dominated *only* by a specific mixed strategy (say, 50% `B` + 50% `C`), but *not* by `B` or `C` alone, what does 'rationality' compel them to do? Can they eliminate `A` meaningfully?"
      *   *Anticipated Dodge:* "Rationality implies they *should* randomize; the inability is irrelevant to the ideal solution concept."
      *   **Follow-Up:** "If the player *cannot* randomize, isn't eliminating `A` based on an *infeasible* counterfactual act? Doesn't this make the dominance criterion hypothetical rather than actionable for *that specific player*? How does IEDS handle players constrained to pure strategies?"

  2.  **The Asymmetry of Strict vs. Weak Dominance & Order Dependency:**
      *   **Q2:** "A key appeal of IEDS is its robustness. Yet, iterated elimination of *strictly* dominated strategies (ISDS) is order-independent, while iterated elimination of *weakly* dominated strategies (IWDS) is notoriously order-dependent. What fundamental difference between strict and weak dominance does this asymmetry reveal about the assumptions underlying IEDS?"
      *   *Anticipated Dodge:* "Weak dominance involves ties; the order matters for which tied outcome survives. It's just a technicality."
      *   **Follow-Up:** "Doesn't order-dependence in IWDS imply that the 'rational' outcome depends on the *sequence* of reasoning, not just CK of rationality? Doesn't this suggest CK of rationality alone is *insufficient* to pin down a unique solution under weak dominance? What *additional* assumption (e.g., CK of tie-breaking rules?) is needed for order-invariance?"

  3.  **Centipede & the Empirical/Behavioral Challenge:**
      *   **Q3:** "In the Centipede game, IEDS (via backward induction) predicts immediate defection by Player 1, driven solely by common knowledge of rationality (CKR). Yet, robust experimental evidence shows most players cooperate for several rounds. If CKR *logically forces* the IEDS outcome, how do you reconcile this with the observed behavior? Does this challenge the descriptive validity of IEDS or the premise of CKR itself?"
      *   *Anticipated Dodge:* "People aren't perfectly rational. IEDS is normative, not descriptive. It tells us what *should* happen if players are perfectly rational and know it."
      *   **Follow-Up:** "If even highly intelligent subjects in controlled experiments systematically deviate from the IEDS path *despite understanding the game and the logic*, doesn't this suggest the cognitive or epistemic assumptions (like players performing infinite steps of mutual reasoning flawlessly) required for IEDS to 'bite' in such games are implausible? Can IEDS truly be a general solution concept if it relies on reasoning capacities rarely observed?"

  4.  **The Rationalizability Equivalence Breakdown (n>2 Players):**
      *   **Q4 (Bonus):** "A key result is that for 2-player games, the strategies surviving IEDS coincide exactly with rationalizable strategies. However, this equivalence breaks down for games with *three or more players*. Why does this happen?"
      *   *Anticipated Dodge:* "In n>2, rationalizability allows players to hold *correlated* conjectures about the other players, while IEDS implicitly assumes independence when checking dominance."
      *   **Follow-Up:** "Exactly. So, doesn't this mean that IEDS, as commonly defined, actually embeds an *additional* assumption beyond just CKR? Specifically, doesn't it assume players believe others' strategies are chosen *independently*? Why is this independence assumption justified solely by CKR, especially when correlated beliefs can also be consistent with rationality? Shouldn't a solution concept based *only* on CKR allow for correlated rationalizability?"

  ### Supporting Questions to Tighten the Net

  5.  **Uniqueness & Predictive Power:**
      *   **Q5:** "IEDS often doesn't yield a unique outcome (e.g., Battle of the Sexes after eliminating strictly dominated strategies). How does relying solely on IEDS resolve this indeterminacy without appealing to equilibrium concepts like Nash?"
      *   *Anticipated Dodge:* "IEDS tells us what *won't* be played. It narrows the set. Further refinement might need equilibrium, but IEDS is the foundational step based only on CKR."
      *   **Follow-Up:** "But if the surviving set is large and contains multiple Nash equilibria, doesn't IEDS fail to provide a specific prediction? How is this a 'solution'? Doesn't this highlight that CKR alone is often insufficient for prediction?"

  6.  **The Role of Beliefs:**
      *   **Q6:** "You criticize Nash for assuming correct beliefs. But doesn't IEDS *also* make implicit assumptions about beliefs? When a player eliminates a dominated strategy, aren't they implicitly forming beliefs about what *other* rational players won't play (namely, strategies dominated for *them*)?"
      *   *Anticipated Dodge:* "Yes, but those beliefs are derived solely from CKR and dominance logic itself, not assumed correct upfront."
      *   **Follow-Up:** "But isn't the *process* of iterated elimination essentially a process of refining *beliefs* about what others won't play, based on CKR? Doesn't the final set represent a state where players' beliefs about what others *won't* play are consistent with CKR? How is this belief formation meaningfully different from the consistency required in Nash, besides being about eliminated actions?"

  7.  **Weak Dominance & Payoff-Equivalence:**
      *   **Q7:** "Consider a strategy `W` weakly dominated by `S`. `S` might only be strictly better against strategies already eliminated earlier. Why should a rational player, who knows others are rational and *might* play those eliminated strategies (even if unlikely), strictly prefer `S` over `W`? Couldn't `W` be a safe 'tie' if uncertainty remains?"
      *   *Anticipated Dodge:* "CKR ensures the dominated strategies *are* eliminated, so they won't be played. `S` is at least as good and sometimes better."
      *   **Follow-Up:** "But under IWDS, the order matters precisely because which weakly dominated strategies get eliminated *first* affects which strategies remain weakly dominated *later*. Doesn't this circularity undermine the certainty that `W` is truly inferior *given the player's actual epistemic state during the reasoning process*?"

  8.  **The Starting Point:**
      *   **Q8:** "IEDS starts with the full strategy space. Doesn't assuming players initially consider *every logically possible* strategy, including wildly irrational ones, contradict the spirit of common knowledge of rationality from the very first step? Why wouldn't rationality constrain the initial strategy set?"
      *   *Anticipated Dodge:* "The process *reveals* what's irrational via dominance. We start broadly to be general."
      *   **Follow-Up:** "But doesn't this mean IEDS spends effort eliminating strategies that CKR should arguably preclude players from *seriously considering* in the first place? Is this computational inefficiency just a technicality, or does it point to a mismatch between the formal process and the idealized reasoning implied by CKR?"

  9.  **Epistemic Foundations:**
      *   **Q9:** "You argue IEDS only needs CKR. What specific *epistemic logic* axioms (e.g., regarding knowledge, belief, mutual belief) are sufficient to formally derive the iterated elimination process? Does this logic explicitly avoid assumptions about correct beliefs over *strategies*, or do such assumptions sneak in?"
      *   *Anticipated Dodge:* "The standard epistemic models for IEDS show that CKR implies players will only play strategies surviving iterated dominance." (Likely cites Brandenburger, Dekel, Tan, Ribeiro, etc.)
      *   **Follow-Up:** "But in those very models (especially for n>2), doesn't the derivation often rely on specific assumptions about the *type space* or the *structure of beliefs* (like independence for IEDS equivalence)? Doesn't this suggest that the 'only needs CKR' claim is slightly oversimplified, and the *specific implementation* of IEDS embeds subtle epistemic choices?"

  **Key Goals Achieved:**
  *   **Mixed Strategy Feasibility:** Challenges the practical meaning of mixed dominance.
  *   **Strict vs. Weak Asymmetry:** Forces confrontation with the extra assumptions weak dominance needs.
  *   **Centipede Paradox:** Highlights the gap between logical deduction and plausible behavior/reasoning.
  *   **n>2 Rationalizability Gap (Bonus):** Explicitly exposes the hidden independence assumption in standard IEDS.
  *   **Supporting Questions:** Probe uniqueness, belief formation, weak dominance pitfalls, starting assumptions, and epistemic foundations to prevent easy retreats and deepen the critique.

  These questions push the defender beyond the initial pitch, forcing them to grapple with the operational meaning, hidden assumptions, behavioral inconsistencies, and logical subtleties inherent in relying solely on iterated dominance. Good luck with the brown-bag!
