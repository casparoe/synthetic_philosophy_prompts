  First, I need to unpack both the Euthyphro dilemma and the legal theories. The Euthyphro asks whether piety is loved by the gods because it's pious, or if it's pious because the gods love it. In law, the parallel is whether something is law because the sovereign commands it (positivism) or because it's inherently just (natural law).

