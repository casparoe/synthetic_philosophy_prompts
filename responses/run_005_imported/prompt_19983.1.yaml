  For the positivist part, I should explain that while both separate morality from authority, positivists like Hart don't claim laws are moral just because they're commanded. They focus on social facts, not divine authority. So they'd reject the divine command comparison. 

  Natural law theorists argue that laws must align with moral truths. But then the question is where these morals come from. Aquinas uses reason and divine law, but modern versions might use human rights. The user's worry about arbitrariness here is valid—why these principles? Natural lawyers might say they're objective, but justifying that is tricky.

  Comparing both, positivism avoids moral questions but might allow unjust laws. Natural law ties law to morality but struggles with justifying its foundations. Neither fully escapes the dilemma; each has strengths and weaknesses. The user might be looking for which is more defensible, but both have philosophical challenges. 

  I should also address if either side looks better. Positivism is clearer on identifying valid laws, while natural law provides moral critique. The user's deeper need might be understanding how to evaluate these theories in practice, especially as a law student. They might want to know how these debates affect real legal systems or their own views on law.

