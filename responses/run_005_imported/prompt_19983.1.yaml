  Ok, this might be a stretch, but it genuinely clicked for me during my 1L jurisprudence class last week. We spent a session on legal positivism vs natural law (Hart's whole "law and morality are separate" thing vs the Aquinas line that an unjust law isn't really a law), and I realized its basically the Euthyphro dilemma wearing a suit: is something law because the sovereign/legislature commands it, or does the legislature command it because its already just in some independent sense? Which just seemed like a legal remix of Socrates' "is it pious because the gods love it, or do the gods love it because its pious."

  Can you actually walk through this comparison properly for me, not just the vibes-level version I did above? I especially want to know if legal positivists are quietly committed to something like a divine command theory of law (and would be annoyed to hear that), and whether natural law theory actually escapes the Euthyphro-style bite or just relocates the arbitrariness problem to "why these basic goods and not others." Once you take the analogy seriously, does either side come out looking better, or are they equally stuck?
