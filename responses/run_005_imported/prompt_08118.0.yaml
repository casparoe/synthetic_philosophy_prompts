  The user is interested in why the category moves, not just behavior. So, I should focus on Hacking's points about the feedback loop changing the category. For MPD, the diagnostic criteria shifted as more cases appeared, influenced by cultural narratives like Sybil. Therapists and media played roles in shaping how patients expressed their symptoms, which then altered what MPD meant. 

  The user might be conflating the mechanisms. They mention Goodhart's law, which is about metrics becoming targets. But Hacking's idea is more about the co-evolution of the category and the classified. The key is that both the people and the classification change each other iteratively. 

