  I should emphasize that the category's meaning shifts because the behaviors that define it change as people interact with the label. MPD becoming DID isn't just renaming; the understanding of the disorder transformed. This is distinct from self-fulfilling prophecies where the label remains static. 

  Also, the user might appreciate knowing that Hacking's work critiques psychiatric classifications as interactive kinds, not natural kinds. This challenges the objectivity of diagnoses, which has implications for how we view mental health categories today. 

  I need to ensure clarity without jargon. Use the MPD example to illustrate each mechanism. Highlight the feedback loop: patients adopt narratives, therapists validate them, experts adjust criteria, leading to a new iteration of the category. Stress that the category itself is mutable and responsive, unlike static labels in self-fulfilling prophecies. 

