  The user will appreciate this lens - it connects their jay work (where adaptation anchors intentional talk) to the AI debate. Should also note Owen/Ingrid both implicitly agreed that mechanism knowledge shouldn't preclude intentional stance, which aligns with Dennett. Their real disagreement was about what counts as "real" belief, which needs clearer criteria.

