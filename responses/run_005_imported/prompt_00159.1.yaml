  Let me reconstruct Hume's core principles first. His radical empiricism means anything beyond direct sense impressions is suspect—no "soul" or enduring self, just a stream of perceptions tied by resemblance/causation. Moral sentiments arise from sympathy with others' pleasures/pains. Crucially, he cares about *experiencing* beings, not metaphysical essences. 

