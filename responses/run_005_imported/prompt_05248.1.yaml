  First, I need to unpack the mother's conflicting signals. She expresses loneliness, which likely reflects a genuine emotional need. Loneliness can be really painful, especially as people age. So her words are important. But her behavior during visits—tension, criticism, not relaxing until they leave—suggests that the visits aren't meeting her needs. There's a disconnect here.

  Why might this happen? Maybe the mother has unaddressed anxiety. Having the kids over could trigger fears of judgment or unresolved issues. The criticism might be a defense mechanism, pushing them away before she feels rejected. Or perhaps she's struggling with aging, feeling a loss of control, and nitpicking gives her a sense of agency. Also, the idea of visits might be comforting, but the reality overwhelms her if she's not used to social interaction.

  The brother's approach to reduce visits based on behavior seems logical but might overlook the underlying loneliness. Cutting visits could worsen her isolation. The user senses this, feeling the brother's solution is too simplistic. The user probably wants to help their mother without causing distress, seeking a middle ground.

  The user's deeper needs might include wanting a harmonious relationship, alleviating guilt about not visiting enough, and understanding their mother's true feelings. They might also need strategies to improve visit quality rather than frequency. It's about balancing empathy with practical steps.

  I should consider psychological concepts like approach-avoidance conflict, where the mother desires closeness but fears the stress it brings. Cognitive dissonance could be at play too—her expectations vs. reality causing tension. Communication strategies like naming the dynamic without blame could help. For example, gently discussing the observed tension during visits might open up dialogue.

  Possible solutions: Shorter, more structured visits to reduce anxiety. Engaging in parallel activities to lessen pressure. Addressing potential mental health issues like anxiety or depression. Helping the mother build other social connections so she's not solely reliant on her children.

  Weighing words vs. behavior: Both are valid expressions of need but from different angles. Words express conscious desires, while behavior reveals unconscious or conflicting emotions. The key is integrating both, not choosing one over the other. The brother's approach might ignore the expressed loneliness, risking increased isolation. The user's hesitation is valid because reducing visits without addressing the root cause could be harmful.

  Ultimately, the more defensible stance is acknowledging both signals and seeking to understand the underlying conflict. The solution isn't visiting more or less but transforming the visits into positive experiences for everyone involved.
answer: |-
  This is a deeply relatable and painful tension—when words and actions diverge in someone we care about, especially a parent. Your instinct that your brother's interpretation may be too simplistic is perceptive. Let's break this down:

  ### Analyzing the Conflict
  1.  **The Loneliness is Likely Real:** Your mother's expressed loneliness is probably genuine. Loneliness in older adults is a profound ache, often tied to loss, changing roles, or reduced social circles. Her wish for more connection is a valid emotional need.
  2.  **The Visits are Stressful (For Her & You):** Her tension, criticism, and relief upon your departure clearly indicate that *the current way visits happen* is distressing for her (and understandably hurtful for you). This doesn't mean she doesn't want connection; it means *this specific form of connection* triggers something difficult.
  3.  **The Core Problem: Approach-Avoidance Conflict:** Your mother seems trapped in a classic psychological bind:
      *   **Approach Drive:** She deeply desires connection, closeness, and the reassurance of family presence (the *idea* of the visit).
      *   **Avoidance Drive:** The *reality* of the visit triggers anxiety, fear, or overwhelm. This could stem from:
          *   **Unresolved Anxiety/Insecurity:** Fear of being judged, fear of not being a "good enough" host/mother, or social anxiety that surfaces with close family.
          *   **Control Issues:** Criticism might be an unconscious attempt to regain control in a situation where she feels vulnerable or her life feels diminished.
          *   **Unprocessed Grief/Resentment:** Lingering feelings about her life, past conflicts, or unmet expectations might surface as tension and nitpicking.
          *   **Cognitive Dissonance:** The gap between her idealized vision of the visit (warm, easy connection) and the messy reality (awkwardness, her own anxiety) creates internal stress that leaks out as criticism.
          *   **Habitual Patterns:** Decades-old relationship dynamics (e.g., relating through criticism) can be hard to break.
          *   **Underlying Depression/Health Issues:** These can amplify irritability and reduce tolerance for interaction.
  4.  **Your Brother's Inference is Incomplete:** While grounded in observable behavior, his conclusion ("she wants less contact") makes a critical error: **it conflates the *form* of contact with the *need* for contact.** Her behavior shows she struggles with *how* visits currently happen, not necessarily that she wants *less* connection overall. Reducing contact based solely on her behavior risks:
      *   Confirming her deepest fears (abandonment, being "too much").
      *   Exacerbating her loneliness.
      *   Missing an opportunity to find a *different* way to connect that works better.

  ### Your Reading is More Defensible (But Needs Nuance)
  Your hesitation to accept your brother's conclusion is justified. A more defensible reading acknowledges **both signals as true expressions of conflicting needs within her**:

  *   **She genuinely craves connection and fears isolation (expressed verbally).**
  *   **She experiences significant distress during face-to-face visits in the current format (expressed behaviorally).**

  The defensible position is: **Her behavior doesn't show she wants *less contact*; it shows that *the current mode of contact is dysfunctional and causes her distress*, which then spills onto you.**

  ### Weighing Words vs. Behavior: A Framework
  When words and actions pull apart, neither should be dismissed. Instead, treat them as clues pointing to a deeper, often unconscious, conflict or need:

  1.  **Assume Both are "True":** Start from the premise that both the expressed desire (loneliness) and the observed behavior (tension/criticism) are valid expressions of *something* real happening internally for the person.
  2.  **Look for the Conflict:** The divergence *is* the data point. Ask: *What internal conflict might this behavior vs. words reveal?* (e.g., desire for closeness vs. fear of intimacy; need for help vs. fear of dependence).
  3.  **Context is Crucial:** Consider the person's history, personality, life stage, mental/physical health, and your relationship history. Patterns matter (as you note, this is years-long).
  4.  **Behavior Often Reveals Unconscious Needs/Fears:** Words express conscious desires. Behavior, especially repetitive, conflicted behavior, often reveals deeper, less conscious anxieties, fears, defense mechanisms, or unmet needs that the person may struggle to articulate or even acknowledge.
  5.  **Prioritize Safety & Well-being (All Parties):** While understanding the conflict is key, you cannot ignore the impact of harmful behavior (like constant criticism) on *your* well-being. Protecting yourself is not dismissal of her need.
  6.  **Seek the Underlying Need:** What is the *core need* behind both the words and the behavior? Behind "visit more" (connection, reassurance) and behind the criticism (control? reduction of anxiety? expression of unspoken pain?).

  ### What Might This Mean for Action?
  The goal isn't necessarily "more visits" or "fewer visits," but **different or better connection**:

  1.  **Name the Dynamic (Gently & Compassionately):** Have a calm, private conversation *outside* of a visit. "Mom, I've noticed something I want to talk about because I love you and want our time together to be good for both of us. You often tell us you feel lonely and wish we visited more, which makes us want to be there. But we've also noticed that when we are there, you often seem really stressed and upset, and it feels like things only settle after we leave. This pattern worries us and makes us sad. We want to understand what's happening for you so we can figure out how to connect in a way that feels better for everyone. Can you help us understand?" *Focus on observation and shared desire for better connection, not blame.*
  2.  **Explore Alternatives to Traditional Visits:**
      *   **Shorter, More Structured Visits:** "How about we come for lunch and a walk, rather than a whole afternoon?"
      *   **Different Activities:** Engage in a parallel activity (watching a movie, gardening, a puzzle) that reduces intense face-to-face interaction pressure.
      *   **Phone/Video Calls:** More frequent, shorter calls might satisfy some need for connection without the intensity of a visit. Ask what she prefers about calls.
      *   **Outings:** Meet at a neutral location (cafe, park) - this often changes the dynamic.
  3.  **Address Potential Root Causes (Gently):**
      *   "Do you feel anxious when we visit? Is there something specific that worries you?"
      *   "We've noticed the criticism seems to come up when you're stressed. Is there something we can do differently to help visits feel less stressful?"
      *   Gently suggest exploring if anxiety, depression, or loneliness itself could benefit from talking to her doctor or a therapist. Frame it as support: "It sounds like you're carrying a lot of stress/loneliness. Talking to someone trained to help with that might give you some relief."
  4.  **Support Other Social Connections:** Gently encourage her to build connections *outside* of you and your brother (senior centers, clubs, volunteering, friends). This reduces the pressure on your visits to be her sole source of social fulfillment.
  5.  **Set Boundaries on Behavior:** You can be compassionate *and* firm. "Mom, I love you and want to spend time with you, but it's hurtful when you criticize [specific thing]. If that continues, I'll need to [end the call/leave/end the visit]." Then follow through. This protects you and might force her to confront the consequences of her behavior.
  6.  **Manage Your Own Expectations:** Accept that you cannot *fix* her internal conflict or erase her loneliness. Your goal is to find a sustainable way to connect that minimizes harm and offers *some* genuine moments of connection, while protecting your own well-being.

  **In essence:** Your mother's words reveal her deep longing for connection; her behavior reveals her profound struggle to tolerate the closeness she craves. The solution lies not in choosing between her words or her actions, but in acknowledging both truths and working creatively to find forms of connection that minimize her distress and maximize the potential for genuine, less fraught moments of contact. Your brother's approach risks abandoning her need; blindly following her words ignores the real pain caused by the current dynamic. The middle path – seeking understanding and adapting the *how* – is more compassionate and ultimately more sustainable.
