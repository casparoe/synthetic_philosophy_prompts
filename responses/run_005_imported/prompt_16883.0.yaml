  I need to create a realistic debate between two experts. One should defend DDE by arguing that the death in the loop case is still a side effect, while the other should argue that this case exposes flaws in the means/side-effect distinction. The dialogue should be substantive with each side responding to specific points.

  For the defender of DDE, I'll create "Morgan" who maintains that the intention remains saving lives through redirection, not causing death. For the critic, I'll create "Alex" who argues that the victim is instrumentalized as a means to stop the trolley. I'll ensure both characters make sophisticated arguments without either conceding defeat.

  Key points to cover:
