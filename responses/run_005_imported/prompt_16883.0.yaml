answer: |-
  Here’s a dialogue between **Morgan** (defending DDE’s application to the loop case) and **Alex** (arguing the loop case undermines DDE’s means/side-effect distinction). Both are sharp, well-versed, and refuse to simplify:

  ---

  **Morgan:** Alex, I know you think the loop case sinks Double Effect, but I’m convinced it survives—even *strengthens* our understanding. Start with the core: in the *standard* switch case, diverting the trolley *away* from the five is the intended act. The one person’s death is a foreseen but unintended side effect. Loop case? Identical structure. I intend to divert the trolley onto the loop track. That diversion *is* the lifesaving act.  

  **Alex:** But that’s precisely where the analogy snaps, Morgan. In the standard case, diversion *itself* saves the five—the side track is a genuine alternative path. In the loop, diversion *does nothing* without the man’s body stopping the trolley. His death isn’t collateral damage; it’s the *mechanism* of salvation. DDE forbids intending harm as a *means*. Here, you’re using his body as a physical brake. That’s textbook instrumentalization.  

  **Morgan:** Not so fast. The *act I intend* is identical: throwing the switch to divert the trolley. I don’t intend the man’s death *as a means*; I intend the redirection. The fact that physics requires his body to stop the trolley doesn’t change my intentional structure. The death remains a *causal consequence* of redirection, not its purpose.  

  **Alex:** But intention isn’t magic—it’s constrained by knowledge. You *know* diversion only works *because* it crushes him. So when you choose diversion, you’re choosing *crushing-him-to-stop-the-trolley* as a single causal package. DDE requires the bad effect to be neither intended *nor* the means. Here, it’s *both*: you need his obstruction to achieve your end.  

  **Morgan:** Ah, but "means" has a specific meaning: it’s something you *harness* to achieve your goal. I’m not harnessing *him*; I’m harnessing the *diversion*. His presence is a background condition, like the track’s existence. I’d divert even if the loop had a wall! But it doesn’t—so his death is a tragic *result* of the diversion, not a tool I wield.  

  **Alex:** That’s sophistry. If the loop had a wall, diversion *would* save the five. Here, it only works *conditional on his destruction*. You’re exploiting his vulnerability. Thomson’s "Fat Man" case is wrong because you *push* him, making you an active user of his body. Here, you *divert* the trolley *into* him. But the moral structure is identical: his body becomes a literal instrument.  

  **Morgan:** But I’m *not* acting *on him*, I’m acting *on the trolley*. That’s key for DDE’s action theory. Pushing the Fat Man is a direct bodily assault—you *initiate force against a person*. Here, I initiate force against the trolley; the man’s death is downstream. The *proximity* of the harm doesn’t change its status as a side effect.  

  **Alex:** Then let’s test proximity. Suppose I need to destroy a vital bridge to stop the trolley, but a person is standing on it. Blowing it up kills them as a means. You’d call that impermissible, right? Loop case is identical: the man *is* the bridge. His body is the necessary obstruction. DDE’s distinction collapses when the "side effect" is *functionally necessary* for the good outcome.  

  **Morgan:** Fair—but in bridge-blowing, I *intend* the destruction *of the bridge* as the means, and the death is parasitic on that. Here, I intend trolley-diversion, not man-destruction. The diversion *causes* the obstruction, but obstruction isn’t my *chosen method*. The causal necessity doesn’t equate to intentional harnessing.  

  **Alex:** Then DDE is vacuous! If "I only intend diversion" excuses *any* causal chain it triggers—no matter how integral the harm is to the outcome—then Footbridge could be justified by saying "I only intend to alter the trolley’s path via gravity after he falls." You’re privileging a thin description of the act. The loop forces us to admit: if the harm is *causally indispensable*, it’s part of the means.  

  **Morgan:** Not indispensable to *my act*—only to the *outcome*. DDE cares about intention-in-the-act, not outcome dependency. I concede the loop blurs the line, but it doesn’t erase it. In Footbridge, I *rely* on his mass *as I act*. In the loop, I rely on diversion *as I act*; his death follows *from the world’s state*.  

  **Alex:** And that’s the rub. The "world’s state" includes an innocent person positioned to be crushed *for efficacy*. When you divert knowing his body is the only operable component, you incorporate him into your plan. DDE’s insistence that we can mentally cordon off "intended means" from "foreseen outcomes" is psychologically and morally fictional. The loop proves that when harm is functionally identical to a tool, treating it as a "side effect" is self-deception. We need a better framework—perhaps one focused on agency or inviolability.  

  **Morgan:** Or perhaps it shows DDE is robust precisely because it captures our intuition that *redirecting threats* (even with lethal side effects) differs morally from *using people as shields*. The loop feels permissible because it’s structurally continuous with redirecting a trolley toward one person instead of five—not with throwing a person into its path.  

  **Alex:** Then our intuitions are inconsistent, and DDE can’t explain why. I’ll grant you this: if DDE *can* survive the loop, it’s only by making "intended means" so narrow it loses its power to forbid Footbridge-like cases. That’s a Pyrrhic victory.  

  **Morgan:** Or it’s a reminder that moral distinctions are subtle. The loop doesn’t break DDE—it refines it.  

  **Alex:** Agree to disagree. But if your refinement walks like means-end reasoning and quacks like means-end reasoning...  

  **Morgan:** ...it might still be a side effect. Let’s get coffee.  

  **Alex:** Only if you don’t *intend* my caffeine addiction as a means to keeping me awake for the next round.  

  *(Both exit, mutually unpersuaded but intellectually satisfied.)*  

  ---

  ### Key Philosophical Moves:
  - **Morgan’s Defense**: Insists the *act* (diverting trolley) is identical in standard/loop cases; death is a *causal consequence* of diversion, not an *instrumental means*. Distinguishes acting *on the trolley* (permissible) vs. acting *on a person* (impermissible).  
  - **Alex’s Critique**: Argues causal indispensability makes the harm part of the means, collapsing DDE’s distinction. Claims "intending diversion" is an artificial description when the harm is *functionally equivalent* to using a tool. Highlights DDE’s vulnerability to "description-dependence."  
  - **Stalemate**: Morgan holds that intention structure is paramount; Alex insists functional role trumps mental abstraction. Neither concedes, mirroring real debates (e.g., Judith Jarvis Thomson vs. Frances Kamm on action descriptions).  

  This captures why the loop variant remains contentious: it pressures DDE’s core criterion without resolving it cleanly.
