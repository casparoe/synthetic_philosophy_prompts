  Then there's the problem of closure under implication. If an agent knows P and P implies Q, they know Q. Capping steps avoids this, but then how do you formally represent what they know? Without a clear boundary, it's messy. Also, logical constants: even simple tautologies like "P or not P" become problematic. An agent might not have the resources to derive them, but in possible worlds, it's always true. So the semantics clash with bounded reasoning.

