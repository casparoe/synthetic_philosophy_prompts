  First, I need to unpack Lewis's original theory. He defined truth in fiction through possible worlds: what's true in a story is what holds in the closest worlds where that story is told as known fact. But this runs into problems with inconsistencies. Lewis's solution, the method of union, allows that both "Watson's wound is in his shoulder" and "Watson's wound is in his leg" can be true in the fiction, while their conjunction isn't. This breaks classical logic's closure under conjunction.

