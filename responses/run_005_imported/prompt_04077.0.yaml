prompt: |-
  Ok, weird research question, but it's for a novel I'm plotting so bear with me. I fell down a rabbit hole on David Lewis's modal realism and ended up in the postscript where he patches his 'truth in fiction' theory (built on possible worlds: what's true in a story is whatever holds at the closest worlds where it's told as known fact) to handle stories that are actually inconsistent. His fix, the 'method of union,' means truth in fiction stops being closed under conjunction -- it can be true in the Holmes stories both that Watson's wound is in his shoulder and that it's in his leg, while 'shoulder and leg' is simply not true in the stories. My book leans hard on exactly this kind of irreconcilable doubling (two endings that are both meant to be true, on purpose), so I want an actual arguement, not a shrug: can you argue that having to give up classical closure just for fiction shows 'true in the fiction' was never really 'true at a possible world' in Lewis's sense to begin with, and that his own patch quietly undercuts the modal realist machinery it's supposedly built on rather than being some minor technical fix?
