  I should structure the argument step by step. Start with Lewis's original claim, show how inconsistencies break it, explain the method of union, and then demonstrate how it diverges from modal realism. Emphasize that the method of union abandons the core idea of a single possible world, replacing it with a disjunctive set of worlds. This shifts truth in fiction from a modal realist concept to something more like a logical construct, which might align better with alternative theories like Walton's make-believe.

