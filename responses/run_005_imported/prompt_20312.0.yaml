prompt: |-
  I sit on the small committee that decides our team's quarterly customer-support award, and this quarter's numbers have produced a disagreement I can't settle on my own. We track ticket-resolution rates by channel: over the quarter, Riley resolved 90 of 100 phone tickets (90%) and 150 of 300 chat tickets (50%), while Priya resolved 240 of 300 phone tickets (80%) and 40 of 100 chat tickets (40%). So Riley outperforms Priya on phone, and again on chat, yet pooling the two channels together, Priya resolved 280 of 400 tickets overall (70%) against Riley's 240 of 400 (60%) — the number most of the committee wants to treat as the real bottom line. One member insists the pooled figure is what counts, since it's the plain count of customers helped; another suspects that figure is somehow misleading and that the per-channel numbers are the ones to trust. I've read enough on rationalist blogs over the years to suspect a reversal like this is rarely just noise, but I can't reconstruct what's actually driving it here, or which figure should decide the award. Could you help me work out what's really going on, and tell me who — if anyone — deserves to be considered the stronger performer, so I can explain the decision to the rest of the committee?
reasoning: |-
  Okay, the user is dealing with a classic Simpson's Paradox scenario in their team's performance metrics. Riley has higher resolution rates in both phone and chat individually, but when pooled, Priya's overall rate is better. The committee is split—some want to use the pooled number, others per-channel rates. 

  Hmm, the user's deeper need here isn't just about who "wins"—they're clearly frustrated by the statistical confusion and want to confidently explain the reasoning. They mentioned rationalist blogs, so they probably suspect there's a mathematical trap but lack the tools to dissect it. 

  First, I should verify if this is truly Simpson's Paradox. Let me calculate: Riley's phone 90% > Priya's 80%, chat 50% > 40%. But pooled: Riley 240/400=60% vs Priya 280/400=70%. Yep, classic reversal. 

  The key is workload distribution. Phone tickets are easier (higher resolution rates for both), but Priya handled way more of them (300 vs Riley's 100). Meanwhile, Riley took the harder chat tickets but three times as many (300 vs Priya's 100). So Priya's average is boosted by doing more "easy" work. 

  Wait—is "difficulty" inherent to channels? The data suggests yes: phone resolution rates are consistently higher. That means pooling naively ignores that chat is fundamentally tougher. 

