  Your friend's reasoning breaks down by assuming that, given an observed amount, the two possible states (having the smaller or larger amount) are equally likely. This ignores the role of the prior distribution of \(S\), making the conditional probability calculation invalid. Without knowledge of this distribution, you cannot determine that the expected value of the other envelope is $100 or that swapping is always beneficial. In reality, swapping may be advantageous, disadvantageous, or neutral depending on the raffle's setup, but since the envelopes are symmetric initially, there is no reason to prefer swapping or not swapping based on the observed amount alone. Your skepticism about the infinite swapping logic is well-founded and highlights the flaw in the reasoning.
