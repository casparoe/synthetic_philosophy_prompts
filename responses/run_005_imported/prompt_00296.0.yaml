       - If the raffle has many large amounts, observing $80 makes it more likely you have the smaller envelope, so the other is probably $160.
     - Since the prior is unknown, the expected value of the other envelope could be greater than, equal to, or less than $80.

  5. **The Absurdity of Infinite Swapping**:
     - Your intuition is correct: if swapping were always beneficial no matter what amount you observe, you could swap repeatedly and gain indefinitely, which is impossible. This paradox arises from the incorrect conditional probability assumption.
