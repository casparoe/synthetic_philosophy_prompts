  So I've been chewing on the whole Kripke/Wittgenstein quus thing on my own for a bit. I get the basic setup - nothing about my past use of "plus" seems to nail down that I meant plus rather than some quus-like function that diverges at some huge number. But I keep getting stuck on the dispositional fix people bring up as a response, and why it supposedly fails. Like ok my dispositions are finite and quus only diverges from plus way past any sum I'd acutally compute - but why does that matter? Isnt that just a boring practical limitation, not something that threatens there being a fact of the matter about what I meant? Can you spell out why the finitude of dispositions is supposed to be a real problem and not just a technicality, and how that ties into the "normativity" complaint people always mention alongside it?
