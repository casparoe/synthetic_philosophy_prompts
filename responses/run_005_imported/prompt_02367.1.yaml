  ## The Calculus of Character: Assessing Franklin's Virtues Beyond Utility

  Benjamin Franklin's meticulously charted quest for moral perfection, enshrined in his *Autobiography*, stands as a landmark of American self-help. Yet, its legacy is contested. Max Weber and D. H. Lawrence transformed Franklin's project from an inspiration into an indictment, seeing it as the epitome of a calculating, utilitarian, and ultimately soul-stifling ethic. While their critiques highlight undeniable elements of Franklin's method and rhetoric, a closer examination of his project's context, practice, and his own reflections reveals a more complex reality. **Weber and Lawrence offer a potent but ultimately reductive critique; Franklin's project, despite its pragmatic framework and occasional self-regarding language, embodies a genuine, albeit imperfect, pursuit of moral improvement that transcends mere utility.**

  **The Weber/Lawrence Charge: Calculating Utility and Constraining the Soul**

  Weber and Lawrence mount a powerful attack, focusing on different facets of the perceived flaw.

  1.  **Weber's Utilitarian Calculus:** Weber, analyzing the "spirit of capitalism," identified Franklin's virtues as the purest expression of a *bourgeois* ethic stripped of religious transcendence. He focused on Franklin's explicit linking of virtues like honesty, punctuality, and industry to tangible, worldly success – acquiring credit, gaining trust, and accumulating wealth. For Weber, the key passage is Franklin's advice that these virtues are valuable because "he that is *known* to pay *punctually*... gains *credit*" and "makes money." The virtues become mere instruments, cultivated not for their intrinsic goodness or divine command, but solely for their efficacy in advancing self-interest within a competitive market society. The "moral perfection" sought is, in this reading, simply the optimization of the self as an economic unit.
  2.  **Lawrence's Soul-Confinement:** Lawrence, with his characteristic visceral intensity, attacked the project's *form*. The thirteen virtues, tracked daily in a ledger, represent a "barbed wire fence" designed to pen in the wild, vital soul – reducing it to a "grey nag in a paddock." For Lawrence, Franklin's method embodies a sterile, mechanical rationalism that suppresses authentic feeling, spontaneity, and the darker, more passionate aspects of human nature in favor of a controllable, predictable, socially acceptable facade. The "tedious work" of polishing the axe (Order) symbolizes the soul-crushing effort to conform to an artificial, externally imposed grid. The project is not liberation but imprisonment within a self-constructed cage of bourgeois propriety.

  **The strongest form of their charge is undeniable:** Franklin *does* frequently justify virtues by their utility ("useful," "advantageous," "gaining credit"). His method *is* systematic, quantified, and focused on observable behavior modification. His initial omission of Humility and struggle with Order suggest a focus on outward efficacy and control. The project *can* be read as a sophisticated program of self-interest management.

  **Franklin's Defense: Beyond Calculation to Character**

  However, accepting Weber and Lawrence's interpretation as the *complete* picture requires ignoring crucial dimensions of Franklin's project and his own account:

  1.  **The Goal: Moral Perfection, Not Just Wealth:** Franklin explicitly states his aim is "moral perfection." While he acknowledges the worldly benefits, his retrospective assessment emphasizes becoming "a better and a *happier* man." This happiness ("happier") stems from internal improvement and a clearer conscience, not solely material gain. His frustration with failing at Order stems from a desire for intrinsic efficacy and peace, not just lost business opportunities.
  2.  **The Virtues Themselves: Beyond the Commercial:** Weber focuses heavily on industry, frugality, and sincerity. But Franklin's list includes **Justice** ("Wrong none by doing injuries, or omitting the benefits that are your duty"), **Tranquility** ("Be not disturbed at trifles"), **Chastity** (framed for health and reputation, but implying restraint), and **Humility** (added later, explicitly countering pride). These virtues – especially Justice and Tranquility – address interpersonal harmony, emotional regulation, and ethical duty in ways that extend far beyond mere profit-making. Cultivating Tranquility, for instance, has no direct economic utility but speaks to inner peace.
  3.  **The Practice: Habituation and Reflection:** Franklin's method isn't just about tracking; it's about conscious habituation. The weekly focus and daily mark in the book force constant self-awareness and repeated effort. This process of deliberate practice aimed at ingraining good habits is a cornerstone of classical virtue ethics (Aristotle), not just capitalist conditioning. The act of self-scrutiny itself implies a standard beyond utility.
  4.  **The Humility Factor:** The inclusion of Humility, prompted by external critique, is pivotal. It demonstrates Franklin's capacity for moral growth based on social feedback and recognition of a flaw (pride) that has no direct economic downside but is a genuine moral failing. He doesn't add it because it will make him richer; he adds it to become *better*.
  5.  **The Context: Civic Virtue:** Franklin was a quintessential Enlightenment figure deeply engaged in civic life and public service (libraries, fire departments, the Revolution). His conception of virtue was inseparable from the ideal of the useful citizen contributing to the common good. Industry and frugality enabled independence, which was seen as essential for virtuous civic participation. Justice and Sincerity were foundations of trust necessary for a functioning republic. His utilitarianism often served a *civic*, not just a personal, end.
  6.  **The Retrospective Honesty:** Franklin openly admits failure (Order), partial success, and his own pride. This self-deprecating honesty undermines the image of the coldly calculating machine. His satisfaction comes from the *attempt* and the relative improvement, not the achievement of a perfect, profitable facade. He values the *process* of striving.

  **The Verdict: Pragmatic Framework, Genuine Core**

  Weber and Lawrence are not entirely wrong. Franklin's *rhetoric* often leans heavily on utility, reflecting his pragmatic, Enlightenment mindset. The *method* is undeniably systematic and could foster an excessive focus on appearances and control, as Lawrence feared. There is a strong utilitarian *strain*.

  **However, their charge that the project is "essentially calculating and self-regarding in a way that undermines its claim to be a program of genuine moral improvement" is a misreading.** It reduces Franklin's complex motivation and the multifaceted nature of his virtues to a single dimension – economic utility or social control. Franklin sought moral improvement *through* practical means. He valued virtues both for their worldly benefits *and* for their contribution to a well-ordered soul and a just society. His method, while mechanical, was a tool for fostering the habits constitutive of character. His own account emphasizes internal satisfaction ("happier") and the intrinsic difficulty of the moral struggle (his failure with Order, the need for Humility), aspects that transcend mere calculation. The inclusion of virtues like Justice, Tranquility, and Humility, and his civic-minded life, demonstrate a moral vision broader than personal gain.

  **Franklin's project is best understood not as a cynical calculation, but as an earnest, pragmatic Enlightenment attempt at self-betterment.** It employs reason and system in the service of cultivating character traits recognized as morally good, both for the individual and the community. While its form and some justifications lend ammunition to Weber and Lawrence, the substance of the virtues pursued, the depth of Franklin's engagement, and his own retrospective assessment reveal a project fundamentally aimed at genuine moral improvement, imperfectly but earnestly pursued, within a framework that valued both inner virtue and outer usefulness. The axe may remain speckled, but the effort to polish it was driven by more than the desire for a better cutting tool; it was an attempt to forge a better self.
