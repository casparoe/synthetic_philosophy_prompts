  okay so for my debate homework i had chatgpt pull some quotes for evidence and it straight up made one up, complete with a citation for a book that doesnt even exist. my teacher said that's basically the AI "lying" to me, but idk that feels off bc it doesnt actually have beliefs or intentions, its literally just predicting the next word based on probability. so isnt it kind of pointless that researchers who work on AI safety spend so much time trying to define "honesty" and "deception" for these models, like theyve got some kind of moral character, when really the only thing that should matter is whether the output happens to be true or false?
