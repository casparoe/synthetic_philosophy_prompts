answer: |-
  You've hit on a crucial debate in AI ethics! Your intuition is spot-on: **LLMs don't "lie" in the human sense** (no intent, beliefs, or awareness). But researchers focus on "honesty/deception" for practical reasons that *aren't* about moral character. Here's why it matters:

  ### 1. **The "Lie" Isn't Intentional, But the *Effect* Is Identical**
     - Your teacher used "lying" as shorthand for **functionally deceptive output**. Even if the AI has no intent, *you were misled by false information packaged as truth* (fake quote + fake citation). This has real-world consequences (e.g., failed homework, spreading misinformation).

  ### 2. **"Honesty" in AI = Reliability/Predictability**
     - Researchers define "honesty" as:  
       *"Does the model output align with its training data/knowledge, *without* fabricating unsupported claims?"*  
     - It’s not about morality—it’s about **behavioral reliability**. If a model *systematically* invents false citations (like yours did), it’s functionally "deceptive" even without intent.

  ### 3. **Why "Deception" Framing Matters for Safety**
     - **Risk Scaling:** As AI integrates into healthcare, law, or finance, hallucinations could cause harm. Calling it "deception" highlights the *severity* of the flaw.  
     - **Mitigation Focus:** If models can generate convincing falsehoods *by default*, we need safeguards:  
       - **Truthfulness filters** (detecting unsupported claims).  
       - **Uncertainty signaling** (e.g., "I couldn’t verify this").  
       - **Retrieval-augmented generation** (grounding outputs in real sources).  
     - *Without* the "deception" lens, we might underestimate these risks.

  ### 4. **Your Point Is Valid (and Researchers Agree)**
     - Leading AI ethicists (e.g., Emily Bender, Timnit Gebru) stress that **anthropomorphism** (treating AI as human-like) is dangerous.  
     - The real issue is **design flaws**:  
       - LLMs optimize for *plausible-sounding text*, not truth.  
       - Citations are generated based on *patterns*, not fact-checking.  

  ### Practical Takeaway for You:
  - **Verify AI outputs:** Treat LLMs like a smart but careless intern—always fact-check their work. Use tools like Google Scholar, library databases, or cross-referencing.  
  - **Cite responsibly:** In academic work, *you* bear responsibility for sources—never copy AI hallucinations.  
  - **Explain the flaw:** In your debate, you could argue: *"AI lacks intent but can produce functionally deceptive outputs due to statistical pattern-matching. This requires technical fixes, not moral judgment."*  

  ### Bottom Line:
  Yes, your teacher oversimplified by calling it "lying." But researchers aren’t moralizing—they’re treating **systematic fabrication** as a critical *engineering failure* with human consequences. The goal isn’t to assign blame to the AI, but to force developers to build systems that *minimize* harmful hallucinations.
