prompt: |-
  I'm a philosophy professor on my university's Faculty Senate Rules Committee, and as its one member with any background in social choice theory, I've been asked to draft our recommendation. Last spring's Senate chair election, held under plurality rules, was won by a candidate whom a majority of senators had ranked last, after three candidates split the vote. The committee is now split three ways: one member wants ranked-choice voting, another wants approval voting, and a third, an economist by training, thinks adopting either would be largely theater: the Gibbard–Satterthwaite theorem guarantees that with three or more candidates, every voting rule is either a dictatorship or manipulable by some voter in some situation, so no rule can make sincerity a senator's dominant strategy. A fourth member points out that our other pending item, a referendum on next year's budget increase (0%, 3%, or 6%), is single-dimensional rather than a contest among unrelated options, and wonders whether that changes things. Please draft the short memo we owe the full Senate next week: it should recommend a specific procedure for each vote, take the manipulability worry seriously rather than dismissing it, and be honest about what, if anything, reform actually buys us.
reasoning: |-
  Okay, I need to help this philosophy professor draft a memo for their Faculty Senate. The memo needs to address two voting issues: the chair election and a budget referendum. The committee is split on voting methods, and there's concern about manipulability due to the Gibbard-Satterthwaite theorem. 

  First, I recall the Gibbard-Satterthwaite theorem states that no voting system with three or more options is both strategy-proof and non-dictatorial. That's a key point. The economist on the committee is right—no system can guarantee sincerity in all situations. But that doesn't mean all systems are equally bad. Some are more resistant to manipulation in practice.

  For the chair election, they had a problem with plurality voting leading to a winner who was ranked last by a majority. So, we need a system that better reflects preferences. The options discussed are ranked-choice voting (RCV) and approval voting. 

  RCV allows ranking candidates and eliminates the least popular until one has a majority. It reduces the "spoiler effect" and encourages majority support. But it's complex and can still be manipulated through strategic ranking. 

  Approval voting lets voters choose as many candidates as they approve of. It's simpler and avoids vote-splitting, but might lead to bullet voting or strategic approval thresholds. 

  For the budget referendum, it's a single-dimensional issue: 0%, 3%, or 6%. The fourth member noted this changes things. Single-dimensional preferences can be handled better by systems like majority judgment or range voting, but those might be overkill. Simple majority rule between options could work, but sequential binary votes might cause agenda manipulation. 

  I need to recommend specific procedures. For the chair election, I lean toward RCV because it directly addresses the ranking issue from last spring. For the budget, a series of pairwise votes between options seems practical and minimizes manipulation risk.

  The memo should acknowledge that no system is perfect due to Gibbard-Satterthwaite. Reforms can reduce specific failures like vote-splitting but can't eliminate strategic voting entirely. Transparency about trade-offs is crucial. 

  The professor wants honesty about what reform buys: better alignment with voter preferences in common scenarios, not a perfect solution. The memo should be concise, respectful of all views, and focused on practical improvements.
answer: |-
  ## MEMORANDUM  
  **To:** Faculty Senate  
  **From:** Faculty Senate Rules Committee  
  **Subject:** Recommendations for Voting Procedures on Chair Elections and Budget Referenda  
  **Date:** October 26, 2023  

  The Rules Committee has carefully considered voting procedures for two distinct Senate decisions: (1) the election of the Senate Chair, and (2) the upcoming budget-increase referendum (options: 0%, 3%, 6%). We acknowledge the serious concerns raised by last spring’s chair election outcome and the theoretical limitations on voting systems highlighted by the Gibbard-Satterthwaite theorem (GS). Our recommendations balance practicality, fairness, and a realistic assessment of manipulability.  

  ### 1. **Gibbard-Satterthwaite and the Inevitability of Manipulability**  
  The GS theorem correctly states that *no* voting system with ≥3 options can guarantee that sincere voting is always optimal for every voter. Every non-dictatorial system is vulnerable to strategic manipulation in some scenarios. **Reform does not eliminate this risk.** However, it *can* mitigate specific, empirically common failures (like "vote-splitting" or electing broadly disliked candidates) and align outcomes more reliably with collective preferences in *typical* cases.  

  ---

  ### 2. **Recommendation for Senate Chair Elections: Ranked-Choice Voting (RCV)**  
  *   **Procedure:** Voters rank candidates in order of preference. If no candidate has >50% of first-choice votes, the last-place candidate is eliminated, and their votes are redistributed to next choices. This repeats until one candidate achieves a majority.  
  *   **Rationale:**  
      *   **Addresses the Plurality Failure:** RCV directly prevents a candidate opposed by a majority from winning due to vote-splitting (as occurred last spring). It ensures the winner has majority support from voters whose preferences are still active in the final round.  
      *   **Reduces "Wasted Vote" Pressure:** Voters can support their true first choice without fearing their vote is wasted if that candidate is unlikely to win.  
      *   **Manipulability Considered:** While GS applies (e.g., voters *could* strategically misrepresent rankings to block a front-runner), such manipulation is complex, requires coordination, and is less likely to produce perverse outcomes than the status quo. RCV makes sincere voting optimal *more often* than plurality.  
  *   **What Reform Buys Us:** Greater resistance to vote-splitting, reduced pressure for tactical voting, and winners with demonstrable majority support from voters who *did not rank them last*. It does *not* guarantee absolute sincerity or immunity to all strategy.  

  ---

  ### 3. **Recommendation for Budget Referendum: Sequential Majority Judgment (Pairwise Comparisons)**  
  *   **Procedure:** Conduct a series of binary votes:  
      1.  Vote 1: 0% vs. 3%.  
      2.  Vote 2: The winner of Vote 1 vs. 6%.  
  *   **Rationale:**  
      *   **Single-Dimensionality Matters:** Budget options lie on a clear spectrum. This structure allows us to use Condorcet methods simply and robustly.  
      *   **Minimizes Ambiguity & Manipulation Risk:** Each vote is a simple majority choice between two clear options. This avoids the "center-squeeze" possible under RCV/Approval for single-peaked preferences and is computationally simpler.  
      *   **Manipulability Considered:** While agenda-setting *could* theoretically matter (the order of votes), the natural ordering (lowest to highest) is transparent and minimizes this risk. Pairwise majority comparisons are highly robust for single-dimensional choices and less vulnerable to strategic voting than multi-option ballots under RCV or Approval. GS applies minimally here due to the forced pairwise structure.  
  *   **What Reform Buys Us:** A clear, transparent process that directly identifies the option preferred by a majority over each alternative. It leverages the natural ordering of the issue, ensuring the outcome reflects genuine majoritarian preferences with minimal strategic complexity.  

  ---

  ### 4. **Conclusion: Realistic Expectations for Reform**  
  No voting system is perfect or immune to strategic behavior. The Gibbard-Satterthwaite theorem reminds us that the search for a flawless democratic mechanism is futile. **However, reform buys significant practical improvements:**  

  *   **For Chair Elections (RCV):** It prevents outcomes where a majority ranks the winner last and reduces incentives for harmful tactical voting inherent in plurality.  
  *   **For Budget Referenda (Sequential Pairwise):** It provides a simple, transparent, and robust method for single-dimensional choices, ensuring the winner has direct majority support against key alternatives.  

  Reform shifts the focus from guarding against *theoretical* worst-case manipulation (which is unavoidable) to preventing *observed, recurring failures* (like vote-splitting) and creating systems where sincere voting is a *reliable* strategy for most voters in most situations. We recommend adopting RCV for officer elections and Sequential Pairwise Majority for single-dimensional policy referenda like the budget vote.  

  Respectfully submitted,  
  The Faculty Senate Rules Committee
