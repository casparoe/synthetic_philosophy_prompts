answer: |-
  ## The Kelly Gambit: A Dialogue

  **Setting:** A worn oak table, littered with coffee cups and a notepad showing the 60/40 coin bias and 40 rounds. Kelly (calm, precise) and Val (intense, leaning forward) face each other.

  **Val:** Okay, Kelly. Forty shots. Coin lands heads 60% of the time. We double our stake on heads. You're telling me the *rational* play is to only risk 20% of your bankroll each time? That feels... pathological. Why leave so much expected value on the table? Betting 20%, your *expected* final wealth is dwarfed by betting, say, 50% or even 100% each round. The math is clear: E[Wealth] grows faster with bigger bets. Isn't maximizing expected value the definition of rational choice?

  **Kelly:** It *is* rational, Val, but you're conflating two things: the expectation *operator* and the actual *growth process* over time. Yes, betting bigger increases the arithmetic mean of your *possible* terminal wealths. But that mean is dominated by vanishingly rare paths where you win an absurd number of flips. It ignores the multiplicative nature of repeated investment. Your wealth evolves *geometrically*, not arithmetically. Maximizing *expected log wealth* maximizes the *median* outcome and the *typical* growth *rate per round* – the thing that compounds reliably.

  **Val:** "Typical growth rate"? "Reliably"? That sounds like fear of ruin dressed up in fancy ergodicity jargon. So what if the all-in strategy has a high *probability* of ruin? The *expected* terminal wealth is still vastly higher because of those "vanishingly rare" paths you dismiss! If I play this game just once, betting it all is the EV-max move. Why does repeating it 40 times suddenly make the EV-max move irrational? Shouldn't rationality scale? The astronomically high outcomes *are part of the expected value calculation*; they're not a flaw, they're the feature that makes big bets win on average!

  **Kelly:** Because rationality *must* consider the ensemble *over time for a single trajectory*. Your strategy isn't scalable. Play it long enough, and "almost surely" you *will* go broke. The high-EV comes from paths that *no single individual* ever experiences long-term. The ensemble average (EV) diverges from the long-run time-average for a single player. That's the ergodic issue. For the *single system* evolving through time – *you* playing 40 rounds – maximizing the growth *rate* (log) gives the highest *probability* of reaching a large final wealth. Betting big gives a *lower* probability of a good outcome, even if the *average* of all possible outcomes is higher.

  **Val:** "Almost surely" over infinity! We're playing *40 rounds*, Kelly! The probability of ruin betting all-in 40 times on a 60/40 coin is (0.4)^40 – essentially zero for practical purposes. It's about 10^-16! Meanwhile, the expected final wealth betting all-in is (1.2)^40 ≈ 1469 times your starting bankroll. Your 20% Kelly bet? E[Wealth] is only about 1.2^40 ≈ 1469 *too*? Wait, no... Kelly growth rate g = (0.6*ln(1.4) + 0.4*ln(0.8)) ≈ 0.02007, so expected *log* wealth increases by ≈ 0.8028 over 40 bets. E[Wealth] = exp(Expected Log Wealth) ≈ exp(0.8028) ≈ 2.23 times start. See? *Massive* EV difference! Why sacrifice 1469x for 2.23x just because of an infinitesimal ruin risk?

  **Kelly:** You're comparing apples to oranges, Val. Your 1469x is the *arithmetic mean* of the all-in terminal wealth distribution. My 2.23x is the *median* of the Kelly terminal wealth distribution – the *typical* outcome. The *arithmetic mean* for Kelly is also higher than 2.23x because of *its* right tail, though much less extreme than all-in. Crucially, the *distribution shapes* are wildly different. All-in: 99.99999999999999% chance of ruin, 0.00000000000001% chance of ≈ 1.0995×10¹² times wealth. Kelly: Tight distribution around 2.23x, very low ruin risk. Which distribution would you rather be *subject to*? Maximizing the *rate* ensures your wealth grows sustainably *along almost all paths*. Maximizing terminal EV lets a near-infinite ensemble of players generate a huge average, while almost every single one of them is broke.

  **Val:** But I *am* one player! One trajectory! And for *this* finite 40-round game, the strategy with the highest *expected final wealth* is all-in! You're telling me to choose a strategy knowingly giving up over 1400x in *expected* final wealth because of a ruin risk smaller than being struck by lightning while winning the lottery? That feels like letting an irrelevant long-run "almost surely" paralyze me. The point of EV is to *be* the guide when we don't get infinite tries! Why worship log if it demonstrably gives lower EV in finite cases?

  **Kelly:** Because the log strategy gives the highest *probability* of doing well *in this finite case too*. Calculate the probability of doubling your money after 40 rounds with Kelly vs. all-in. Kelly: Very high (≈98%+). All-in: Only if you win *every* flip (≈ (0.6)^40 ≈ 10^-8). The *mode* of your outcome is ruin. The *median* is ruin. Only the *mean* is high. If you value the *likelihood* of a good outcome over the *mathematical average* dominated by near-impossibilities, Kelly wins *even in 40 rounds*. Expected Value is a property of the gamble. Rational choice depends on what you value about the outcome distribution *for your single play*.

  **Val:** ...So it boils down to utility. You value the high-probability modest win. I value the potential for the astronomical win, accepting the near-certainty of ruin as the cost, because the *mathematical expectation* of wealth is still higher. Even if I *expect* to be broke, the bet was still +EV.

  **Kelly:** Precisely. Kelly maximizes the *growth rate* and thus the *likelihood* of sustainable wealth. You maximize the *expected terminal wealth*, accepting near-certain ruin for the chance at cosmic gains. Neither is "irrational" in a vacuum. But Kelly aligns with the multiplicative dynamics of repeated investment and prioritizes survival and typical outcomes. Samuelson prioritized the arithmetic expectation of the terminal snapshot. The rabbit hole reveals it's about what "rational" means for a *sequence* of bets: optimizing the journey or the potential of the destination snapshot, however unlikely. *(Leans back, sipping cold coffee.)* So, Val... placing your bet?
