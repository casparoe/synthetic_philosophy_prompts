answer: |-
  Let's break down the Mara-Colin debate step-by-step using Lewis's framework from *Convention*, while addressing your key insight about arbitrariness. Here's the analysis:

  ### Step 1: Mara's Opening Claim  
  *Mara's Argument*: Queueing is a Lewis convention because:  
  - It solves a coordination problem (allocating service order).  
  - It's arbitrary (other systems like lottery or pushiness *could* work).  
  - It persists via precedent and mutual expectations.  

  **Assessment**: **Strong, but incomplete**.  
  - ✅ Correct about coordination: Queueing *does* establish order without constant negotiation.  
  - ✅ Correct about precedent/mutual expectations reinforcing it.  
  - ⚠️ **Missing arbitrariness**: Mara assumes queueing is arbitrary without proving alternatives are *equally good* (your later insight is crucial here). Lewis requires that multiple solutions could function *equally well* if universally expected.  

  ---

  ### Step 2: Colin's Objection  
  *Colin's Argument*: Queueing ≠ driving-side conventions because:  
  - Deviating from driving rules harms the deviator (risk of collision).  
  - Queue-jumping *benefits* the deviator at others' expense.  
  - Thus, queueing isn’t a **coordination equilibrium** (where conforming is your *best response* to others' actions).  

  **Assessment**: **Strong on game theory, weak on Lewis's scope**.  
  - ✅ Correct that Lewisian conventions require a coordination equilibrium: Conforming must be individually rational *without* external sanctions. Driving-side rules fit perfectly.  
  - ❌ **Overlooks Lewis's nuance**: Lewis *allows* for "salient" solutions (e.g., fairness) and acknowledges that norms can include *internalized costs* (like shame). Queueing *can* be a coordination equilibrium if social backlash is part of the "payoff."  

  ---

  ### Step 3: Mara's Rebuttal  
  *Mara's Argument*: Social costs (glares, confrontations) are part of the payoff structure. Including these, conforming *is* your best response.  

  **Assessment**: **Partially valid but risky**.  
  - ✅ **Lewis-compatible**: Lewis *does* include "sanctions" in payoffs if they arise *endogenously* from the convention itself (e.g., disapproval for breaking queueing norms).  
  - ⚠️ **Colin's "proves too much" concern is legitimate**: If *any* social pressure makes a norm conventional, then moral norms (e.g., "don't steal") could be misclassified as conventions. Lewis *explicitly* excludes norms where alternatives *aren’t* equally good (e.g., stealing creates losers/winners).  

  ---

  ### Step 4: Colin's "Proves Too Much" Counter  
  *Colin's Argument*: Folding social costs into payoffs collapses Lewis's distinction between conventions and moral norms.  

  **Assessment**: **Strongest point yet**.  
  - ✅ **Exposes a flaw in Mara's defense**: Lewis distinguishes conventions by **arbitrariness** and **indifference between solutions**. Moral norms (e.g., prohibitions on theft) lack arbitrariness—alternatives (e.g., "stealing is fine") *aren’t* equally beneficial.  
  - ❓ **But queueing isn’t necessarily moral**: Queue-jumping isn’t "immoral" like theft; it’s *unfair* but context-dependent (e.g., reservations vs. walk-ins). This ambiguity weakens Colin’s analogy.  

  ---

  ### Your Key Insight: The Arbitrariness Problem  
  **This is critical and neither Mara nor Colin addressed it**:  
  > *Lewis requires that a convention must be **arbitrary**—some *other* regularity could have solved the coordination problem just as well.*  

  - 🚦 **Driving sides**: Truly arbitrary. Left/right work equally well if universally adopted.  
  - 🧍 **Queueing**: **Not clearly arbitrary**.  
    - Alternatives exist (e.g., lottery, priority for elders), but first-come-first-served is uniquely **salient due to fairness**:  
      - It’s transparent (no ambiguity over "who arrived first").  
      - It minimizes conflict (no subjective judgments).  
      - It aligns with intuitive desert ("I waited longer").  
  - ➡️ **Implication**: If first-come-first-served is the *uniquely optimal* solution for orderly service (not just one option among equals), it fails Lewis's arbitrariness test. Queueing may be a **norm** sustained by fairness + social pressure, not a pure convention.  

  ---

  ### Overall Verdict  
  | **Step** | **Who Has the Stronger Argument?** | **Why** |  
  |-----------|-----------------------------------|---------|  
  | **1**     | Mara (with reservations)          | Correct about coordination but glossed over arbitrariness. |  
  | **2**     | Colin                             | Correctly identified the coordination equilibrium flaw. |  
  | **3**     | Mara (weakly)                     | Social costs *can* be endogenous, but risks overextension. |  
  | **4**     | Colin                             | Forced Mara into a definitional problem Lewis sought to avoid. |  

  **Final Conclusion**:  
  - **Colin wins the debate** because he exposed the core tension: if queueing requires social enforcement to be "rational," it blurs into non-conventional norms.  
  - **Your arbitrariness insight is decisive**: Queueing likely **isn’t a pure Lewis convention** because first-come-first-served isn’t truly arbitrary—it’s fairness-salient. It’s a **hybrid norm**: part convention (precedent/mutual expectations), part fairness rule.  

  Lewis’s framework remains intact, but queueing sits at its boundary—exactly why your friends’ debate was so fruitful!
