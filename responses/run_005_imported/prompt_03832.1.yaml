prompt: |-
  Kripke's canonical examples of the necessary a posteriori all come from a narrow range of cases: identity statements between co-referring names (e.g., "Hesperus is Phosphorus"), theoretical identities linking a natural kind to its microstructure (e.g., "water is H2O", "gold has atomic number 79"), and identifications of properties (e.g., "heat is mean molecular kinetic energy"). Give an example of a statement from a different domain — for instance, biological taxonomy, mathematics, social kinds, or the identity conditions of artworks — that a Kripkean would be tempted to classify as necessary a posteriori, but whose status as genuinely necessary is contestable. Identify the expressions that function as rigid designators in your example, and explain exactly where the case for necessity becomes shaky.
