prompt: |-
  I'm taking a seminar this term devoted to Hume's moral philosophy, and for the last couple of weeks we've been working through Book 3, Part 2 of the Treatise, on justice, property, and promising. I feel like I have a decent grip on the "headline" view: that fidelity to promises, like justice more generally, is an artificial rather than a natural virtue, ultimately grounded in convention and the interests it serves rather than in some free-standing moral fact about promising itself. What I'm still struggling with is the more granular argument Hume gives, in Section 5 ("Of the Obligation of Promises"), for why a promise couldn't possibly be a natural act of the will in the first place — especially the compressed version of that argument that he tucks into a footnote. I raised this in office hours, but we ran out of time right after getting to the conclusion, without really working through how each step is supposed to follow from the last.

  Here are the two paragraphs in question, together with the footnote Hume attaches to the end of the second one:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question, then, is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man cou'd fall into, whose ideas are not confounded by prejudice and the fallacious use of language.

  All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it."

  Footnote: "Were morality discoverable by reason, and not by sentiment, 'twou'd be still more evident, that promises cou'd make no alteration upon it. Morality is suppos'd to consist in relation. Every new imposition of morality, therefore, must arise from some new relation of objects; and consequently the will cou'd not produce immediately any change in morals, but cou'd have that effect only by producing a change upon the objects. But as the moral obligation of a promise is the pure effect of the will, without the least change in any part of the universe; it follows, that promises have no natural obligation. Shou'd it be said, that this act of the will being in effect a new object, produces new relations and new duties; I wou'd answer, that this is a pure sophism, which may be detected by a very moderate share of accuracy and exactness. To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination. 'Tis impossible, therefore, we cou'd ever will a new obligation; and consequently 'tis impossible the will cou'd ever accompany a promise, or produce a new obligation of morality."

  Could you help me reconstruct this reasoning in a way I can actually follow, rather than just restating the conclusion? First, I'd like a clean, step-by-step version of the elimination argument in the first paragraph: why exactly does Hume think the mental act "belonging to" a promise cannot be a resolution, a desire, or an act of willing the promised action itself, so that only "the willing of that obligation" is left standing? Second, I'd like the same treatment for the regress in the footnote — I can see that Hume wants to trap a rationalist about morality (presumably someone in the mold of Samuel Clarke or Wollaston, given what he argues against them earlier in Book 3, Part 1) into willing an endless series of new volitions, but I lose the thread of exactly which premise forces the move from "willing a new relation of objects" to "willing the volition that would create that relation," and then keeps the regress going rather than letting it stop after one step; concretely, why can't the rationalist just say that what is willed is the future action that will instantiate the new relation, rather than the present volition itself? Third, an evaluative question: does the regress depend on an assumption a rationalist could reasonably reject, and if so, is this footnote argument actually weaker than the sentiment-based argument in the main text, or is it doing independent philosophical work rather than just restating that argument in the rationalist's own vocabulary?
reasoning: |-
  Okay, let me tackle this Humean puzzle step by step. The user is clearly deep in the trenches of Treatise Book 3 and needs surgical help with two notoriously dense arguments - the elimination of mental acts in §5 and the regress footnote. 

  First, I notice they've done their homework: they grasp the "artificial virtue" big picture but are stuck on Hume's technical moves. The office hours mention suggests this isn't casual curiosity but seminar-level urgency. Their three requests are admirably precise: 1) reconstruct the elimination argument 2) unpack the regress 3) evaluate rationalist escape routes. 

  For the elimination argument (para 1), Hume's method is forensic. He systematically eliminates candidates for the "mental act of promising":
  - Resolution fails because meaning to do X doesn't create obligation (we break resolutions without moral blame)
  - Desire fails because we can promise against our wishes (think: "I'll visit Aunt Mildred" through gritted teeth)
  - Present willing fails because promises concern future acts beyond current volition

  The conclusion feels almost geometrical: if none of these work, the only remaining option must be "willing the obligation itself." But this sets up the main text's coup de grâce: we can't create moral sentiments by fiat.

  Now the footnote regress - this is where they're especially tangled. The user's specific confusion is spot-on: why can't the rationalist just will the future action? Ah, but Hume's trap springs here. If morality is about relations (like rationalists claim), and relations depend on objects, then:
  - To create obligation (a new relation), you need new objects
  - But the only "object" introduced by promising is the volition itself
  - So willing obligation = willing relations created by... that same volition
  - Which means willing your own act of willing - hence the infinite stack of volitions

  The user's evaluative question is sharp: does this depend on rationalist premises? Absolutely. That's why Hume first gives the sentiment argument (which attacks the core of moral psychology) and then adds this as a supplementary gotcha against rationalists specifically. The sentiment argument is stronger because it targets Hume's actual metaethics, while the footnote is like jiu-jitsu - using the opponent's framework to throw them.

  What they might still need: concrete examples. Like imagining trying to "will" yourself to feel pain about breaking a promise - you can't just flip that switch. Or the regress visualized as a snake eating its tail: volition1 aims at obligation → which requires relations → which requires volition2 to create them → but volition2 needs its own obligation... ad infinitum.

  Also worth noting: Hume's "common ways of thinking" point is crucial. He's not just logic-chopping; he's showing how his theory fits ordinary language ("bound by consent") while exposing competitors as philosophical monstrosities.
answer: |-
  Let's reconstruct Hume's arguments step-by-step, addressing your specific queries about elimination and regress, followed by an evaluation of the rationalist counterargument.

  ### **I. Hume's Elimination Argument (Main Text)**
  Hume eliminates possible mental acts constituting a promise, leaving only "willing the obligation" as the candidate:

  1. **Not a Resolution**  
     - *Premise*: Resolving to act (e.g., "I resolve to pay you tomorrow") imposes no moral obligation.  
     - *Why?* We break resolutions constantly without moral censure (e.g., skipping a gym session).  
     - **Conclusion**: Promising cannot be mere resolution.

  2. **Not a Desire**  
     - *Premise*: We can promise while *lacking* desire for the act (e.g., promising to repay a loan despite aversion).  
     - *Why?* The obligation binds even when we dislike the action.  
     - **Conclusion**: Promising cannot be identical to desire.

  3. **Not a Present Act of Will**  
     - *Premise*: The will only influences *present* actions (e.g., I can will myself to lift a cup *now*).  
     - *Problem*: Promises concern *future* actions (e.g., "I will pay you next week").  
     - **Conclusion**: The will cannot directly produce future actions, so promising cannot be willing the act itself.

  4. **Only Remaining Option: Willing the Obligation**  
     - *Inference*: Since no other mental act fits, promising must be "willing that an obligation arises."  
     - *Common Intuition*: We say we’re "bound by our consent," implying we will the bond itself.

  ### **II. The Footnote Regress Argument (Against Rationalism)**
  Hume targets rationalists who ground morality in "relations" discoverable by reason. He argues that "willing an obligation" generates a vicious regress:

  1. **Rationalist Premise**:  
     Morality consists in objective *relations* (e.g., "repaying debts restores balance"). Obligations arise from these relations.  

  2. **Hume's Challenge**:  
     - To create a *new* obligation (via promise), you must create a *new relation*.  
     - But the only change caused by a promise is the *volition itself* (no external alteration).  

  3. **The Trap**:  
     - If you "will a new obligation," you are "willing a new relation of objects."  
     - But this new relation can *only* be created by the volition.  
     - Thus, "willing the relation" **requires willing the volition that creates it**.  

  4. **The Regress Unpacked**:  
     - Step 1: Will obligation (O1) → Requires relation (R1).  
     - Step 2: R1 requires volition (V1) to create it → So you must will V1.  
     - Step 3: But willing V1 is a *new* volition (V2), which needs *its own* obligation (O2) to be valid...  
     - **Result**: Infinite chain: O1 → needs R1 → needs V1 → needs O2 → needs R2 → needs V2 → ...  

  5. **Your Specific Query**:  
     - *Why can’t the rationalist say we will the future action (e.g., repaying) instead of the volition?*  
     - Hume’s Reply: The future action alone has no moral relation *until the promise creates it*. Before the promise, repaying is optional; after, it’s obligatory. The rationalist must explain how the *volition itself* creates this new relation. If they ground it in the future action, they ignore that the action’s moral status *depends on the prior promise*.

  ### **III. Evaluation: Is the Regress Argument Vulnerable?**
  **A. Rationalist Escape Routes**  
  1. **Reject the Relational Premise**:  
     - If rationalists deny morality is *solely* about relations (e.g., by positing divine commands or non-relational duties), the regress dissolves.  
     - *But*: Hume assumes his opponents (like Clarke) are committed to a relational view (see Treatise 3.1.1).

  2. **Argue Volition Creates an Immediate Relation**:  
     - A rationalist could claim the act of promising *instantly* creates a new relation (e.g., "debtor-creditor") without needing further volitions.  
     - *Hume’s Counter*: This begs the question. *How* does a mental act create an objective relation? The rationalist must still explain the mechanism without invoking sentiment.

  **B. Strength Compared to the Sentiment Argument**  
  - **Sentiment Argument (Main Text)**:  
    Stronger because it attacks *all* promise-based obligations:  
    - Morality depends on sentiments (pleasure/pain).  
    - We cannot create new sentiments by fiat (e.g., you can’t "will" yourself to feel pain for breaking a vow).  
    - Thus, promises *alone* cannot generate obligations.  

  - **Footnote Regress Argument**:  
    - Does **independent work** by exploiting rationalist premises.  
    - If morality is relational, promises are impossible without sentiment.  
    - **Vulnerability**: Depends on the rationalist accepting relational morality. If they reject this, the argument loses force.  

  **Conclusion**: The sentiment argument is more fundamental (it underpins Hume’s metaethics), but the regress argument is a potent *ad hominem* against rationalists. Together, they show no coherent account of promising exists without convention and sentiment.

  ### **Key Insight**
  Hume’s goal is to prove promising is *artificial*: its obligation arises from societal conventions (e.g., trust, reciprocity), not natural psychology. The elimination argument shows no mental act *intrinsically* creates obligation; the regress argument shows rationalism *also* fails to explain it. Both point to convention as the only solution.
