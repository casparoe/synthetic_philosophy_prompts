prompt: |-
  I'm taking a seminar on early modern philosophy this term, and this week's unit is on Leibniz's theodicy. Earlier in the course we worked through the compressed version of the "best of all possible worlds" argument in the Monadology (God surveying an infinity of possible universes in his understanding and choosing this one on the basis of sufficient reason and degree of perfection), and I felt reasonably comfortable with it. Now we've moved on to the much stranger closing fable of the Theodicy itself, where Leibniz dramatizes the same doctrine through the high priest Theodorus, the goddess Pallas, and an infinite pyramid of possible worlds, each containing a different version of Sextus Tarquinius. My study group can't agree on how literally to take this, and I'd like some help working through it before we discuss it in seminar on Thursday. Here is the passage, from the E. M. Huggard translation (§§414-416):

  414. Theodorus journeyed to Athens: he was bidden to lie down to sleep in the temple of the Goddess. Dreaming, he found himself transported into an unknown country. There stood a palace of unimaginable splendour and prodigious size. The Goddess Pallas appeared at the gate, surrounded by rays of dazzling majesty, *Qualisque videri Coelicolis et quanta solet*. She touched the face of Theodorus with an olive-branch, which she was holding in her hand. And lo! he had become able to confront the divine radiancy of the daughter of Jupiter, and of all that she should show him. Jupiter who loves you (she said to him) has commended you to me to be instructed. You see here the palace of the fates, where I keep watch and ward. Here are representations not only of that which happens but also of all that which is possible. Jupiter, having surveyed them before the beginning of the existing world, classified the possibilities into worlds, and chose the best of all. And whenever the conditions are not determinate enough, there will be as many such worlds differing from one another as one shall wish, which will answer differently the same question, in as many ways as possible. You learnt geometry in your youth, like all well-instructed Greeks. You know therefore that when the conditions of a required point do not sufficiently determine it, and there is an infinite number of them, they all fall into what the geometricians call a locus, and this locus at least (which is often a line) will be determinate. Thus you can picture to yourself an ordered succession of worlds, which shall contain each and every one the case that is in question, and shall vary its circumstances and its consequences. But if you put a case that differs from the actual world only in one single definite thing and in its results, a certain one of those determinate worlds will answer you. These worlds are all here, that is, in ideas. I will show you some, wherein shall be found, not absolutely the same Sextus as you have seen (that is not possible, he carries with him always that which he shall be) but several Sextuses resembling him, possessing all that you know already of the true Sextus, but not all that is already in him imperceptibly, nor in consequence all that shall yet happen to him. You will find in one world a very happy and noble Sextus, in another a Sextus content with a mediocre state, a Sextus, indeed, of every kind and endless diversity of forms.

  415. Thereupon the Goddess led Theodorus into one of the halls of the palace: when he was within, it was no longer a hall, it was a world, *Solemque suum, sua sidera norat*. At the command of Pallas there came within view Dodona with the temple of Jupiter, and Sextus issuing thence, saying that he would obey the God; and lo, he goes to a city resembling Corinth, buys a small garden, finds a treasure, becomes a rich man, and dies at a great age, beloved of the whole city. [...] They passed into another hall, and lo! another world, another Sextus, who, having resolved to obey Jupiter, goes to Thrace, marries the daughter of the king, succeeds him, and is adored by his subjects.

  416. The halls rose in a pyramid, becoming even more beautiful as one mounted towards the apex, and representing more beautiful worlds. Finally they reached the highest one which completed the pyramid, and which was the most beautiful of all: for the pyramid had a beginning, but one could not see its end; it had an apex, but no base; it went on increasing to infinity. That is (as the Goddess explained) because amongst an endless number of possible worlds there is the best of all, else would God not have determined to create any; but there is not any one which has not also less perfect worlds below it: that is why the pyramid goes on descending to infinity. Theodorus, entering this highest hall, became entranced in ecstasy [...]. We are in the real true world (said the Goddess) and you are at the source of happiness. [...] Here is Sextus as he is, and as he will be in reality. He issues from the temple in a rage, he scorns the counsel of the Gods. You see him going to Rome, bringing confusion everywhere, violating the wife of his friend. There he is driven out with his father, beaten, unhappy. If Jupiter had placed here a Sextus happy at Corinth or King in Thrace, it would be no longer this world. And nevertheless he could not have failed to choose this world, which surpasses in perfection all the others, and which forms the apex of the pyramid. [...] You see that my father did not make Sextus wicked; he was so from all eternity, he was so always and freely. My father only granted him the existence which his wisdom could not refuse to the world where he is included: he made him pass from the region of the possible to that of the actual beings. The crime of Sextus serves for great things: it renders Rome free; thence will arise a great empire, which will show noble examples to mankind.

  Two things about this trip up the pyramid are tripping me up. First, when Pallas insists that the happy Sextus at Corinth and the royal Sextus in Thrace are "not absolutely the same Sextus... but several Sextuses resembling him," is she voicing a real commitment of Leibniz's mature metaphysics - something to do with individual substances having complete concepts, in the way he tells Arnauld that a non-sinning Adam would simply be a different possible person and not "our" Adam - or is this just a storytelling device to dodge the question of why God didn't give our Sextus a kinder fate? And if it's the former, doesn't it make the theodicy suspiciously easy, since it would mean there was never a coherent alternative in which this particular Sextus turns out well while everything else about the world stays fixed - Jupiter gets exonerated by definition rather than by argument. Second, I don't understand why Pallas is so confident the pyramid has an apex, i.e. a single uniquely best world, even though she happily admits it has no base, i.e. there is always a worse world below any given one. What blocks the same reasoning from applying at the top, so that for every possible world there is always a better one, and there is no best world at all? Any help disentangling the actual argument from the mythological packaging would be much appreciated.
