answer: |-
  Here is a rigorously argued defense of preference realism against the deflationary challenge posed by the Armstrong-Mindermann result and its Quinean/Davidsonian echoes:

  ### The Case for Realism: Underdetermination ≠ Indeterminacy

  The Armstrong-Mindermann result demonstrates **epistemic underdetermination**, not ontological indeterminacy. It shows that *given only behavioral data*, we cannot uniquely identify the agent's reward function without assuming a specific planning algorithm. The symmetry between (R, P) and (-R, P') is real, but it arises from limitations in our observational access, not an absence of metaphysical fact. Quine himself distinguished sharply between underdetermination (multiple theories fit all possible evidence) and indeterminacy (no fact of the matter). Reward functions fall squarely in the former category. The agent's computational architecture fixes a *specific planning process P* and a *specific reward function R* that jointly cause its behavior. That (R, P) and (-R, P') are observationally equivalent does not make them ontologically equivalent; it means our evidence is incomplete.

  ### Breaking the Symmetry: The Implementation Warrant

  What licenses privileging one decomposition (R, P) over (-R, P')? **The physical/computational implementation of the agent.** The "true" decomposition is the one that corresponds to the *actual causal structure* of the agent's decision-making system. Consider:

  1.  **For Artificial Agents:** The reward function is explicitly encoded in the agent's design (e.g., as a function within its code). The planner is the actual algorithm running on its hardware (e.g., value iteration, Q-learning). The pair (R, P) isn't just *an* interpretation; it's the *causal engine* generating behavior. The alternative pair (-R, P') is a mathematical artifact with no counterpart in the agent's physical instantiation. Observing the code breaks the symmetry decisively.
  2.  **For Biological Agents (Humans):** While we lack direct code access, neuroscience and cognitive psychology aim to uncover the *implemented algorithms* (P) and the *implemented reward representations* (R) in the brain. Dopaminergic reward prediction error signals, for instance, are concrete neural phenomena implementing aspects of reward computation. The true (R, P) pair is the one that causally explains behavior *through the actual mechanisms* of the agent, not just conforms to its outputs.

  ### Rationality Assumptions: Empirical Scaffolding, Not Circular Presupposition

  The warrant for a specific (R, P) decomposition does not *presuppose* the rationality assumption whose warrant is questioned. Instead, the rationality assumption (e.g., expected utility maximization) functions as a **heuristic scaffold and empirical hypothesis**:

  1.  **Minimal Rationality as a Discovery Tool:** Assuming the agent uses a *plausible, efficient* planner (P) (e.g., approximate dynamic programming) allows us to *infer* a reward function (R) that makes sense of its behavior *as if* it were generated by that process. This is justified pragmatically: such planners are known to be computationally feasible and evolutionarily/biologically plausible.
  2.  **Testability Against Implementation & Counterfactuals:** The inferred (R, P) pair generates predictions beyond the observed behavior:
      *   **Counterfactual Predictions:** How *would* the agent behave in novel states or with altered constraints? The true (R, P) pair should generate accurate predictions. The (-R, P') pair, being a mathematical dual, may generate wildly inaccurate counterfactuals if P' is not the actual algorithm (e.g., an "inverted" planner might behave differently under new state transitions).
      *   **Implementation Consistency:** As we learn more about the agent's cognitive or neural architecture, the inferred planner P must be consistent with it. If neuroscience reveals decision-making relies on prediction-error minimization, a planner P implementing this is privileged over an abstractly possible but neurally implausible P'.
  3.  **Explanatory Power:** The true (R, P) decomposition provides the *most parsimonious and causally coherent explanation* linking the agent's internal states, learning history, and observed actions. The (-R, P') decomposition, while formally equivalent *for the current dataset*, often posits an implausibly complex or contrived planner (P') solely to preserve the inverted reward, violating Occam's razor *when considering the agent's implementation*.

  ### Why Negation is Artificial: The Specificity of Planners

  The symmetry relies on constructing an *ad hoc* planner P' specifically designed to invert the reward. Real planners (P) are not arbitrary mathematical functions; they are constrained by:
  *   **Computational Tractability:** Real agents use algorithms feasible for their computational resources.
  *   **Learnability:** The reward function must be learnable or representable by the agent's architecture.
  *   **Developmental/Evolvable History:** Planners are shaped by evolution, learning, or design.
  P' in the (-R, P') pair is typically *not* a plausible candidate satisfying these constraints; it exists only as a formal counterpoint to prove unidentifiability *from behavior alone*. Its artificiality highlights why implementation matters.

  ### Commitment: Robust Realism

  Armstrong-Mindermann demonstrates a profound **epistemological limitation** in inferring mental states from behavior alone, echoing Quinean underdetermination. However, it does not necessitate a Dennettian collapse into interpretivism where "preference" is *only* an interpretive stance. **Preferences (reward functions) are real, causally efficacious components of an agent's cognitive architecture.** Their reality is grounded in the physical implementation of the agent. We can be wrong about identifying them due to observational limitations and the underdetermination shown, and their content is inextricably linked to the specific planning mechanisms that utilize them. Nevertheless, **the pair (R, P) that corresponds to the agent's actual computational processes is the factually correct decomposition.** Our warrant for favoring one decomposition comes not from behavioral fit plus simplicity *alone*, but from **converging evidence: behavioral fit *plus* counterfactual predictive accuracy *plus* consistency with the agent's implementation and learning history.** When these align, we have robust reason to believe we've identified the real preferences driving the agent, even if purely behavioral data underdetermines them.
