  Hmm, their political philosophy class is clearly resonating here - this isn't overthinking but connecting real experience to concepts like alienation of labor. The user's description checks several Marxian alienation boxes: lack of control over work, disconnection from the final product, and work feeling instrumental rather than meaningful. 

