  On top of classes I've been doing this online task app thing on the side to help make rent - basically labeling photos and text snippets for AI companies through one of those crowdwork platforms. Pay is about $0.08 a task, I'm classified as an independent contractor so no benefits, and I have no idea what the data I label actually gets used for, they just call the job "Batch 4471" or whatever. Its flexible and the hourly rate is fine if I'm quick, but it leaves me feeling weirdly empty in a way that seems like more then just "this job is kind of boring." My roommate says that's just what having a job feels like sometimes, and if it bothers me that much I should ask for more money or find something else. This is kind of close to what we've been covering in my political philosophy class lately, but idk if that's just making me overthink a totally normal job. Is my roommate basically right, or is something else actually going on here?
reasoning: |-
