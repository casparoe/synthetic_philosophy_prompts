prompt: |-
  Okay so I'm a phil PhD student working on moral responsibility stuff, and this term I TA'd a seminar that spent two whole sessions on standing to blame, which kind of broke my brain in a good way. We read G.A. Cohen's "Casting the First Stone" essay plus some of the newer responses to it, and I can't stop turning over whether there's actually two different things getting mashed together under the "who are you to talk" complaint. There's the classic hypocrite case: someone who rails against lying constantly but lies just as much themselves, i.e. holds everyone else to a standard they exempt themselves from. But then theres a different case, closer to the old "tu quoque" idea: someone who has done the exact same bad thing as the person they're blaming, but has never actually preached about it one way or the other, so there's no double standard in any strict sense, just shared guilt. Like, I've got one friend who cheated on a partner years ago but has always stayed quiet/nonjudgmental about cheating in general, and another friend who also cheated but is weirdly the most self-righteous person I know about how cheaters are irredeemable. Both would probably get some version of "who are you to talk" if they called out a mutual friend for cheating, but my gut says the complaint against them isn't quite the same complaint.

  So here's what I want your take on: is "hypocrisy" (the double-standard thing) and "mere complicity"/tu quoque (shared fault, no double standard) really just two names for one underlying standing-defeater, or are they genuinely separable conditions that can come apart, i.e. can you be hypocritical without being complicit, or complicit without being a hypocrite? And if they are separable, which one is doing more of the actual philosophical work in explaining why compromised blame feels illegitimate - is it fundamentally about fairness/consistency, or fundamentally about the blamer's own guilt regardless of consistency? My advisor thinks I'm overcomplicating a distinction without a difference, so I'd love an actual argument for or against that, not just a survey of the positions.
reasoning: |-
  Okay, the user is a PhD student in philosophy focusing on moral responsibility. They've been grappling with the concept of "standing to blame," particularly after teaching a seminar that covered Cohen's essay and responses. The user is trying to distinguish between two scenarios that both elicit the "who are you to talk" response but feel different. The first is classic hypocrisy, where someone holds others to a standard they themselves violate. The second is "mere complicity" or tu quoque, where someone has committed the same wrong but hasn't preached about it, so there's no double standard—just shared guilt.

  The user’s main question is whether hypocrisy and mere complicity are two distinct standing-defeaters or if they’re fundamentally the same. They also want to know which one does more philosophical work in explaining why compromised blame feels illegitimate. Their advisor thinks they’re overcomplicating a distinction without a difference, so they need a solid argument either for or against that view.

  First, I need to recall the key literature. Cohen’s argument centers on hypocrisy as a standing-defeater, emphasizing the unfairness of holding others to standards one doesn’t follow. But the user points out cases where the blamer isn’t hypocritical because they haven’t set up a double standard. For example, the friend who cheated but never judged others versus the one who is self-righteous. Both might be told "who are you to talk," but the reasons seem different.

  The distinction here is crucial. Hypocrisy involves a failure of consistency or fairness, while mere complicity is about the blamer’s own guilt tainting their authority. So, are these separable? Let’s break it down:

  1. **Can you be hypocritical without being complicit?** Yes. If someone preaches against lying but lies themselves, they’re hypocritical. But if they’ve never lied (complicit in lying), their hypocrisy is about inconsistency, not shared guilt. So, hypocrisy can exist without complicity.

  2. **Can you be complicit without being hypocritical?** Also yes. The non-judgmental cheater who blames another cheater isn’t hypocritical because they never claimed moral superiority or set a standard. Their blame is compromised solely because of their past actions, not inconsistency.

  So, they are separable. Now, why does this matter? The user’s deeper need is to understand the underlying mechanism that makes blame illegitimate. Is it fairness (hypocrisy) or the blamer’s own guilt (complicity)? 

  The philosophical work here involves different theories. The fairness view (Wallace, Scanlon) sees hypocrisy as unfair because it violates reciprocity. The complicity view (Fritz and Miller) argues that the blamer’s own guilt undermines their moral standing regardless of consistency. 

  The user’s advisor thinks it’s a distinction without a difference. But if the user can show cases where one exists without the other, that strengthens the argument for separability. For example, the non-hypocritical but complicit blamer—here, the illegitimacy comes from their guilt, not unfairness. Conversely, a hypocrite who hasn’t committed the wrong (maybe they preach against a vice they’ve never engaged in) still lacks standing due to unfairness, not guilt.

  The user’s gut feeling that the complaints are different is valid. In hypocrisy, the complaint is "you don’t practice what you preach," while in complicity, it’s "you did the same thing." Different reasons, same outcome: lack of standing.

  But how to argue against the advisor? Emphasize that collapsing both into hypocrisy misses cases where no double standard exists. If standing is only about fairness, then mere complicity shouldn’t defeat standing. But intuitively, it does. So, there must be another factor—like moral authority being undermined by one’s own guilt.

  The user might also need to address whether both conditions are necessary or sufficient. Hypocrisy might be sufficient but not necessary (complicity alone can defeat standing). Conversely, complicity without hypocrisy still defeats standing, suggesting both are independent defeaters.

  In conclusion, the user is right—there are two distinct defeaters. Hypocrisy relates to fairness and consistency, while mere complicity relates to the blamer’s moral taint. Both can independently undermine standing, though they often co-occur. The philosophical work depends on the theory: fairness-based views prioritize hypocrisy, while moral authority views emphasize complicity. The user should defend the distinction by showing separable cases and argue that complicity adds a dimension beyond hypocrisy, especially in tu quoque scenarios.
answer: |-
  You're absolutely right to sense a distinction here, and your advisor might be underestimating the philosophical juice this separation provides. Let's break down the hypocrisy/complicity divide, argue for their separability, and then tackle which one does the heavier lifting regarding standing to blame.

  **The Core Distinction: Hypocrisy vs. Mere Complicity (Tu Quoque)**

  1.  **Hypocrisy (The Double Standard):** This is the paradigmatic case Cohen focuses on. The hypocrite *holds others to a standard* (explicitly or implicitly, through their blame) *that they systematically fail to meet themselves*. The core wrong is **inconsistency combined with the imposition of a demand**. The hypocrite claims a kind of authority or position to demand compliance with a rule they flout, violating norms of fairness, reciprocity, or sincerity. As R. Jay Wallace argues, blame involves holding someone accountable to a demand, and the hypocrite fails to hold *themselves* accountable to that same demand, undermining the fairness of their stance.
  2.  **Mere Complicity / Pure Tu Quoque (Shared Fault, No Double Standard):** This is your non-judgmental cheater friend. The blamer *has committed the same type of wrong* (or a relevantly similar one) in the past, *but has not preached against it, set themselves up as an exemplar, or demanded others comply*. There is **no inconsistency between their past conduct and their current blaming stance** because they never adopted a stance of condemning the conduct *in principle* prior to this instance. The core complaint here is **"You are one of us; you share this guilt; your own hands are dirty."** It challenges the blamer's *moral authority* or *purity* to condemn, suggesting their own similar failing taints their position or renders their condemnation ineffective or illegitimate, regardless of consistency. Kyle Fritz and Daniel Miller explicitly defend this as a distinct "moral taint" defeater of standing.

  **Argument for Separability: They Can Come Apart**

  The key to defending the distinction against your advisor is to demonstrate clear cases where one exists *without* the other:

  1.  **Hypocrisy WITHOUT Complicity:**
      *   **The Abstinent Preacher:** Imagine someone who vehemently condemns adultery, preaches absolute fidelity, and harshly judges others for infidelity. However, they themselves have *never* been tempted, never come close to cheating, and are utterly faithful. They are *consistent* in their actions (they meet their own standard) but their *blame* might still lack standing if delivered in a vicious, self-righteous, or excessively punitive manner. Crucially, **they are *not* complicit in the specific wrong they're blaming.** Yet, if their blame is perceived as unfairly harsh, lacking empathy, or assuming unwarranted moral superiority *despite* their personal compliance, a version of "who are you to talk?" *might* arise, targeting the *tone* or *presumption* of their blame, not shared guilt. More solidly: Consider someone condemning a very specific, rare wrong they *couldn't* possibly have committed (e.g., a young person condemning a specific act of wartime betrayal committed decades before their birth). If they condemn it self-righteously while *currently* engaging in analogous betrayals in their personal life (betraying confidences, backstabbing colleagues), they are hypocritical (imposing a standard they flout) but *not* complicit in the *specific* historical wrong they blame.

  2.  **Complicity (Tu Quoque) WITHOUT Hypocrisy:**
      *   **Your Non-Judgmental Cheater Friend:** This is your prime example. They cheated years ago. They have never moralized about cheating, never claimed it was uniquely terrible, never set themselves up as a paragon of fidelity. They acknowledge their past wrong. Now, they learn a mutual friend cheated in a particularly cruel way. They say, "What you did was truly awful, a profound betrayal." The mutual friend retorts, "Who are *you* to say that? You cheated on Sarah!" Here, the complaint **is solely about shared guilt/past commission of the same wrong.** There is *no* double standard because the blamer never exempted themselves from a standard they imposed on others. Their past act doesn't contradict any prior *moral stance* they took; it only contradicts the *presumed purity* needed to blame effectively. As Fritz and Miller argue, their blame might be *true*, but their own past failing undermines their *standing* to deliver it with full moral force. Another case: A recovering addict who has *never* preached abstinence or condemned others' drug use (perhaps viewing their own struggle with humility) condemning a dealer who knowingly sells lethal fentanyl to kids. The dealer shouts, "You used for years! Who are you?!" The complaint is pure tu quoque/complicity, not hypocrisy.

  **Which Does the Philosophical Heavy Lifting? The Core Mechanism**

  This is where it gets really interesting, and where the separation becomes crucial. Both defeat standing, but likely through *different primary mechanisms*, and their relative importance depends on the underlying theory of blame and standing:

  1.  **The Fairness/Consistency View (Hypocrisy Focused - e.g., Wallace, Scanlon-esque views):**
      *   **Mechanism:** Blame involves holding someone accountable to a legitimate normative demand. This activity presupposes a kind of reciprocity: the blamer must themselves be accountable *to* that demand (or analogous demands governing the blaming practice itself, like fairness). The hypocrite violates this reciprocity by exempting themselves from the demand they impose. Their blame is *unfair*.
      *   **Strength:** Explains the intuitive *wrongness* of hypocrisy itself. Captures the idea that the hypocrite's blame involves a kind of bad faith or insincerity.
      *   **Weakness wrt Complicity:** Struggles to explain why the *mere complicit* person lacks standing. If they never imposed the demand or claimed exemption, where's the unfairness? The complicit person *is* holding themselves accountable (implicitly by blaming) and isn't demanding something they refuse to give. The fairness view might suggest the complicit person *does* have standing, which clashes with strong intuitions (like your non-judgmental cheater case).

  2.  **The Moral Authority/Purity View (Complicity Focused - e.g., Fritz & Miller, aspects of Cohen's critics):**
      *   **Mechanism:** Effective moral condemnation requires the condemner to possess a certain kind of moral authority or standing, which can be undermined by their own similar moral failings. This authority isn't necessarily about fairness *to the wrongdoer*, but about the *credibility*, *effectiveness*, or *purity* of the blame itself. The complicit person's own guilt "taints" them, makes them a "fellow traveler," rendering their condemnation hollow, ineffective, or presumptuous. It might also relate to ideas of moral luck or the difficulty of isolating condemnation from one's own flawed nature.
      *   **Strength:** Directly explains the "who are *you*?" complaint against the merely complicit. Captures the intuition that condemnation carries more weight coming from someone "clean."
      *   **Weakness wrt Hypocrisy:** Might struggle to fully capture the *distinctive wrong* of the hypocrite's *double standard*. While the hypocrite is *also* complicit, their *additional* act of imposing the standard they flout seems to add a layer of unfairness or bad faith that pure complicity lacks.

  **The Argument Against Your Advisor (Why the Distinction Matters & Complicity is Fundamental):**

  Your advisor might see them as "two sides of the same coin" (compromised moral position). But collapsing them misses crucial nuances and risks misdiagnosing the source of illegitimacy. Here's the argument:

  1.  **Separability Demonstrates Distinct Mechanisms:** The clear cases of hypocrisy-without-complicity and complicity-without-hypocrisy show they aren't co-extensive. Different features (inconsistent imposition vs. shared guilt) trigger the standing defeat.
  2.  **Complicity is the Broader, More Foundational Defeater:** While hypocrisy *always* involves a form of complicity (you flout the standard you impose), **mere complicity can defeat standing *without* any hypocrisy.** The non-judgmental cheater case is decisive. Intuitions strongly suggest their blame is compromised *solely* because of their past action, *not* because of inconsistency. This indicates that the core issue undermining standing in *both* cases might ultimately be the **blamer's own moral taint or compromised position relative to the wrong**, *regardless* of whether they were inconsistent.
  3.  **Hypocrisy Adds an *Additional* Wrong:** Hypocrisy isn't *just* about lacking standing; it involves an *independent wrong* of unfairness, bad faith, or violating reciprocity *on top of* the compromised position stemming from complicity. The complicit non-hypocrite lacks standing due to taint but doesn't commit this extra wrong. The hypocrite lacks standing due to taint *and* commits the wrong of unfair imposition. This explains why hypocrisy often feels *more* egregious than mere complicity when blaming.
  4.  **Explanatory Power for "Who are you?":** The "who are you?" complaint in hypocrisy really means "Who are *you* to demand *this* of *me* when you don't demand it of yourself?" (focus: unfair imposition). In mere complicity, it means "Who are *you* to condemn *this* act when you are guilty of the same?" (focus: shared guilt/taint). These are distinct meanings pointing to distinct defects.

  **Conclusion & Recommendation:**

  You are *not* overcomplicating. Hypocrisy (double standard) and mere complicity/pure tu quoque (shared guilt, no double standard) are **genuinely separable conditions** that can defeat standing to blame. While they often co-occur (the self-righteous cheater is both hypocritical *and* complicit), they can come apart. Hypocrisy can exist without complicity in the specific wrong being blamed (though usually with complicity in a *type* of wrong), and complicity can certainly exist without hypocrisy.

  Regarding the philosophical heavy lifting: **Mere complicity (moral taint) appears to be the more fundamental standing-defeater.** It can operate independently (as in your non-judgmental cheater), explaining why blame feels illegitimate even in the absence of a double standard. Hypocrisy, while a powerful and common defeater involving an *additional* wrong (unfairness), often *derives* its standing-defeating force from the underlying complicity it reveals, *plus* the added layer of bad faith. The core illegitimacy in compromised blame stems from the **blamer's own moral entanglement with the type of wrong in question**, which undermines their moral authority. Hypocrisy is a particularly potent *way* of being entangled and compromised, but it's not the only way.

  **To argue this against your advisor:** Focus relentlessly on the **non-judgmental complicit person** (your cheater friend who stayed quiet). Hammer home that this person lacks any double standard – they never preached, never exempted themselves from a rule they imposed. Their only flaw is the past wrong. Yet, intuitively, their blame *still* rings hollow. This demonstrates that shared guilt *alone*, without hypocrisy, can defeat standing. Therefore, hypocrisy and complicity are distinct, and complicity (moral taint) is the more fundamental condition explaining the standing defect in *both* scenarios. The hypocrisy case just adds an extra layer of unfairness on top of the foundational problem of taint. This separation provides a clearer, more nuanced account of the diverse ways standing can be compromised.
