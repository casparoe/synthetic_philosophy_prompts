  The historical parallel is fascinating. Years ago they ghosted an ex; now they're watching a friend repeat the pattern. That time gap matters - they've had years to become someone different. The fact nobody knows about their past complicates things psychologically, but doesn't change the ethical calculus. 

  What's really eating at them? Probably three layers: 1) The hypocrisy fear (valid but overblown) 2) Unprocessed guilt about their own past 3) Frustration watching harm they once caused being inflicted again. That last one feels key - they're seeing ghosting's impact from the outside now, and it hits different.

  The "moral standing" question is tricky. Philosophically, yes we can regain standing through change, but the user seems to need permission to believe that. The friend group's ignorance creates an interesting dynamic - if they call out the friend, it might look like they're judging from some high ground they don't actually have. But that's about perception, not principle.

