  First, I need to validate their feelings - it's understandable to resent hypocrisy. But I should also note how the public shaming backfired. The core issue isn't really about Mark's authority, but about inconsistent standards. 

  Hmm... the user seems to want two things: validation that Mark's behavior is unfair, and guidance on damage control. But what they might actually need is a way to make the team's testing standards feel legitimate rather than personal. 

  The credential part worries me most - that's an active security risk! I should emphasize fixing that immediately while separating it from the interpersonal conflict. 

  Interesting how Mark framed his strictness as learning from mistakes. That's actually reasonable, but his delivery ruined the message. The user's approach accidentally made him defensive instead of receptive. 

  For next steps, suggesting private reconciliation makes sense, but the real solution is depersonalizing code reviews. Maybe propose team-agreed checklists? That way "the standard" becomes objective, not Mark's whim. 

  Also noting the team split - half siding with Mark suggests this isn't black-and-white. The user needs to rebuild bridges, not "win" the argument. Emphasizing psychological safety here is key.
answer: |-
  That's a messy situation, but let's break it down - you weren't *entirely* wrong to notice the hypocrisy, but the **way you handled it publicly was counterproductive**. Here's the analysis:

  **Where Mark Has a Point:**
  1.  **People Can (and Should) Learn:** Mark's argument that his past mistakes are *why* he's strict now is valid. Experiencing the pain of bad code (like hardcoded credentials leading to an incident) often creates the strongest advocates for standards.
  2.  **The Standard *Should* Be Independent:** Ideally, code quality standards exist for the health of the project, not because of who enforces them. A good rule is a good rule, regardless of who broke it in the past.
  3.  **Focus Should Be on the Current PR:** Blocking a PR for insufficient tests *today* is about preventing *future* problems, not about the reviewer's past sins.

  **Where Your Frustration is Valid & Where You Went Wrong:**
  1.  **Valid Frustration:** The hypocrisy is glaring and frustrating. It undermines credibility and feels unfair. Seeing "engineering discipline" lectures from someone whose own legacy code is a minefield is understandably irritating.
  2.  **Wrong Approach - Public Shaming:** Calling him out *publicly* in the team channel was the critical mistake:
      *   **Put Him on the Defensive:** Guaranteed to make him dig in and justify himself, not reflect.
      *   **Created Team Division:** Splitting the team ("half think I was out of line") damages psychological safety and collaboration.
      *   **Shifted Focus:** Turned a discussion about *code quality* into a personal attack and a debate about *Mark*, not the standards.
      *   **"Digging Up" Perception:** It can look like you were searching for ammunition, not genuinely interested in standards. Git-blame is a tool, but using it *specifically* to find dirt feels targeted.
  3.  **Undermined Your Own Position:** Even if technically right about the hypocrisy, your approach made *you* seem unprofessional to some teammates and likely hardened Mark's stance.

  **Why "Git Blame Ammo" Doesn't Disqualify Him (But Hurts His Authority):**
  *   **Formal Authority:** If Mark is a Senior Dev and this is part of his role, he *does* have the responsibility/authority to enforce standards, even inconsistently applied ones. His history doesn't magically remove that.
  *   **Moral Authority/Credibility:** This is where his past *severely* damages him. Lecturing others on discipline while sitting on a mountain of legacy chaos makes his lectures ring hollow and breeds resentment. He *should* acknowledge this history when pushing standards ("I know this is painful, I created messes like X in the past and we're *still* paying the price").

  **What Should Happen Next (Damage Control & Progress):**

  1.  **Acknowledge the Misstep (Privately):** Message Mark directly: "Hey Mark, wanted to talk about the other day. I was frustrated about the test standards and discovering the old code history felt like hypocrisy. However, I realize calling it out publicly in the channel wasn't productive or professional. I apologize for that. My goal isn't to undermine you, it's to understand the standards we're aiming for."
  2.  **Separate the Issues:**
      *   **Legacy Code (Especially Credentials):** This is a **major security risk** and should be addressed *immediately*, but *separately*. Bring this up privately with Mark *or* the team lead: "While looking into X, I noticed Service Y has hardcoded credentials. This seems like a critical security issue we should prioritize fixing, regardless of who wrote it." Focus on the *risk*, not the *author*.
      *   **Current PR Standards:** Have a **team discussion** (maybe led by the Tech Lead/Manager) about testing expectations. Frame it as: "We're getting blocked on PRs for tests. Can we collaboratively define clear, *agreed-upon* guidelines for what level of testing is expected for different types of changes? What's 'enough'?" This depersonalizes it and makes the standard *team-owned*, not "Mark's Law."
  3.  **Suggest a Path for Legacy Code (If Appropriate):** Once things calm down, you could suggest (privately to Mark or the lead): "Recognizing that we have a lot of legacy code without tests, including Service X, would it be valuable to allocate some time/budget to start incrementally adding tests or refactoring critical paths? This would help bring it up to the standard we're enforcing for new changes." This shows you're solution-oriented.
  4.  **Mark's Responsibility:** Mark **needs** to acknowledge his past code when pushing standards. A simple: "I know we have legacy code that doesn't meet this bar, including things I wrote. We're enforcing this *now* so we don't create *more* legacy debt and because past experience shows the pain it causes." This humility would go a long way.

  **Conclusion:**

  *   **Were you wrong about the hypocrisy? No.** It's real and undermines Mark's credibility.
  *   **Were you wrong to call him out *publicly* the way you did? Yes.** It was counterproductive and damaged team dynamics.
  *   **Does his history mean he "doesn't get to play code-quality cop"?** Not formally, no. But it *massively* hurts his *moral* authority and *effectiveness* as an enforcer. He needs to demonstrate humility and acknowledge that history.

  **Move forward by:** Apologizing privately for the public call-out, separating the legacy security issue (fix it!), and pushing for collaborative, team-owned standards for *current* PRs. Focus on building better code, not on winning an argument with Mark.
