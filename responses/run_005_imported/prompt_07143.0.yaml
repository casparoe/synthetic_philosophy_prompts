  Ontic structural realism (OSR) avoids Newman by saying structures are all that exist. No hidden natures—just relations. But this leads to radical metaphysics. Objects are just nodes in a structure. The user might wonder if OSR is just relocating the problem. It solves the epistemic issue by changing ontology, but now we have to accept a world without intrinsic properties. That's a big philosophical shift, which might not satisfy everyone.

