answer: |-
  ## Priya Okonkwo's Toast to Professor Judith Ansel

  *(Priya stands, glass raised, a warm but slightly mischievous smile playing on her lips. She looks at Judith, then scans the room, acknowledging both the jurisprudential contingent and the family tables.)*

  Judith. Professor Ansel. *My* professor. Trying to sum up forty years of your intellectual presence in five minutes feels… well, let’s just say it feels like trying to cite *The Concept of Law* in a tweet. Impossible, and bound to miss the point entirely. *(Gentle laughter)*

  But here we are. Gathered to celebrate you, Judith. To celebrate the woman who, for decades, has been the department’s most immovable object – a steadfast, unapologetic defender of a simple, yet perpetually misunderstood, idea: that the question of *what law is* is separate from the question of *whether it is good*. The separability thesis. *(She nods towards the jurisprudence tables)*. To those of us who’ve argued with you, learned from you, and occasionally tried (and failed) to outmanoeuvre you in seminar, it’s the bedrock. To others here tonight… *(She gestures warmly towards the family and friends)* …well, it’s probably the reason Uncle Frank still gets a slightly pained look whenever someone mentions parking tickets at Thanksgiving. *(Laughter)*

  Judith, you taught us – relentlessly, brilliantly, sometimes exasperatingly – that clarity matters. That calling a monstrous decree “not law” because it’s monstrous is a dangerous kind of magic trick. It risks confusing the *validity* of a rule as law – whether it was enacted according to the system's own criteria – with the *merits* of that rule – its justice, its humanity. Your famous early paper, wrestling with those grudge informer cases… it wasn’t about excusing the informer, or the regime. It was about intellectual honesty. It argued that the postwar court, in its righteous fury, blurred that crucial line. The evil statute *was* law, validly enacted under *that* system’s rules. Condemning the informer required moral courage, yes, but it also required legal clarity: perhaps an honest appeal to justice *after* the fact, a retroactive statute explicitly rejecting the Nazi command, rather than pretending the command hadn’t been law *then*. You weren’t defending tyranny; you were defending the precision of thought necessary to *identify* tyranny within the legal framework it exploited. To call something law is not to bow to it; it is, first, to see it clearly for what it is.

  This distinction – between the *existence* of law and the *obligation* to obey it – is where so much mud gets flung at positivism. Judith, you’ve spent a career sweeping it away, brick by brick. You’ve never argued that law *deserves* obedience simply because it exists. You’ve argued that understanding *how* it exists – its sources, its pedigree – is the essential first step in deciding what we owe it, and when we might owe it resistance. You’ve insisted that morality enters the law not by definition, but through the choices of lawmakers, judges, and citizens grappling with the rules laid down. That’s not apology; that’s realism. That’s the hard work.

  *(Priya pauses, her gaze drifting slightly towards Owen Marsh’s table, then back to Judith. Her tone softens, becomes more reflective.)*

  Of course, defending clarity isn't always comfortable. It can feel cold when the world demands warmth. It can draw fire when others prefer the blur. We all remember… that paper. The accusations that flew. Words like "apologist" thrown around. *(A brief, acknowledging look towards Owen, not confrontational, but seeing him)*. Harsh words, born of passionate disagreement about the implications of this separation. Time, scholarship, and Judith’s own unwavering integrity have shown the accusation to be misplaced. But the passion itself? The deep, decades-long engagement? That speaks to the weight of the ideas Judith championed. It speaks to the fact that she made people *care* deeply about getting this right. Owen, your fierce arguments, even when they stung, were a testament to the importance Judith placed – and still places – on these questions. They were part of the landscape she shaped, and respected, even in disagreement. The fire of that old debate has banked, perhaps, but the light it cast on the importance of rigorous thought remains.

  *(Priya’s expression lightens again, turning affectionate.)*

  And rigorous thought, Judith, is your signature. Along with… well, let’s be honest… a certain impatience for woolly thinking. *(Chuckles)*. How many dinner parties have been saved from conceptual disaster by your quiet, firm correction: "Actually, dear, that *was* law. Dreadful law, but law nonetheless"? Paul *(nodding to Judith's husband)*, you deserve a medal for decades of navigating conversations where the phrase "rule of recognition" could appear between passing the peas and discussing the weather. Which brings me to my one carefully constructed legal philosophy joke… *(Priya grins)*.

  We all know Judith’s unwavering commitment to clarity in legal theory. But Paul, your presence here tonight reminds us of another kind of fidelity Judith has mastered. While she famously dissected Lon Fuller’s arguments in “Positivism and Fidelity to Law,” her own record regarding *fidelity*… well, Paul, forty-odd years suggest she grasped the concept rather brilliantly in at least one vital domain. *(Pause for laughter, especially from the jurisprudence tables, warm smiles from the family)*. Fuller might have questioned her fidelity to *his* conception of law, but her fidelity to *you*, Paul, and to the life you’ve built? That’s been beyond reproof. *(Raised glass towards Paul)*.

  *(Priya turns fully back to Judith, her voice thick with warmth and respect)*

  So, Judith. To the brilliant, demanding, gloriously precise mind. To the teacher who taught us that seeing the law clearly is the prerequisite to changing it, or challenging it, effectively. To the colleague who never backed down from the hard argument, but whose integrity was always bedrock. To the friend… and yes, even to the formidable opponent… who made us all think harder and see clearer.

  You retire as the last unapologetic positivist in the department, but your legacy isn’t just a theory. It’s a standard of intellectual courage and clarity. It’s a generation of scholars, like me, who learned from you that understanding the machinery of law is the first step towards wielding it justly. You leave the table, but the conversation you shaped – about what law is, and what it asks of us – will echo long after the last glass is cleared tonight.

  To Judith! May your retirement be filled with sharp debates, excellent wine, and the satisfying knowledge that you never, ever, let a conceptual error pass unchallenged… even at dinner. *(Pause)*. Especially at dinner.

  *(Priya raises her glass high)*. To Judith!

  **(Applause)**

  ---
  **Key Elements Addressed:**

  1.  **Substance Correct:** Clearly distinguishes legal validity ("what law is") from moral obligation ("what we owe it"). Explicitly states Judith's position on the grudge informer case (Nazi statute *was* law; conviction should have been via retroactive justice, not denying its past validity). Emphasizes her focus on clarity and intellectual honesty, rejecting the "apologist" label.
  2.  **Tone:** Affectionate, respectful, and slightly irreverent ("immovable object," "impatience for woolly thinking," "saved from conceptual disaster," "especially at dinner").
  3.  **Owen Marsh:** Acknowledges the "apologist" accusation and the "ugly year" directly but briefly ("We all remember… that paper. The accusations… Words like 'apologist'"). Places it in context: passion born of important ideas, time has shown it misplaced, but the engagement itself was a testament to Judith's impact. Shifts towards respect ("fierce arguments... part of the landscape she shaped, and respected") and the sense of a shared, albeit contested, intellectual history, paving the way for the later conversation.
  4.  **Fuller Joke:** Uses the *title* "Positivism and Fidelity to Law" explicitly. Contrasts Fuller's critique of positivist "fidelity" with Judith's successful "fidelity" in her marriage ("her own record regarding *fidelity*… Paul, forty-odd years suggest she grasped the concept rather brilliantly"). Works for both audiences: citation for scholars, marital tribute joke for family.
  5.  **Priya's Voice:** Sounds like a sharp, grateful former student ("*My* professor," "trying to cite *The Concept of Law* in a tweet"). Uses accessible metaphors ("magic trick," "brick by brick," "machinery of law"). Balances genuine admiration with warm teasing.
  6.  **Structure:** Opens warmly, establishes Judith's core position clearly, addresses the Owen tension honestly but moves past it, delivers the Fuller joke, closes with a tribute to her legacy and character. Flows naturally for a speech.
