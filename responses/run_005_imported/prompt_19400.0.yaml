  Still, Turing wasn't dogmatic. If Bem's effects replicated under strict protocols, he might remain open-minded—but his wartime experience with signal detection would make him wary of false positives. Ultimately, his deciban framework would push him toward Wagenmakers' conclusion: insufficient evidence to overcome prior improbability. 

  The user's framing is sophisticated—they recognize Turing's commitments might pull in different directions. I should emphasize that tension rather than smooth it over. His statistical mind would demand Bayesian rigor, but his philosophical openness might insist the door stay slightly ajar for extraordinary evidence. 

