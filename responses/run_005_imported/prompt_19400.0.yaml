  Hmm, this is fascinating because it pits two aspects of Turing's thinking against each other: his willingness to entertain unconventional ideas versus his statistical rigor. The user isn't just asking for a simple "Turing would be skeptical" take—they want a nuanced reconstruction based on his documented epistemic commitments. 

  First, let's unpack Turing's ESP position. His "overwhelming evidence" remark often shocks modern readers, but we should note he was referencing contemporaneous parapsychology research (like J.B. Rhine's) that used frequentist methods. Yet at Bletchley, he literally invented a proto-Bayesian framework (decibans) for weighing evidence incrementally. That's the core tension.

  For the Bem case: Bem's paper relied on p-values, while Wagenmakers used Bayes factors. Turing would absolutely spot the methodological red flags—p-hacking, lack of preregistration—given his codebreaking work demanded extreme rigor. His Banburismus approach was all about cumulative evidence, not isolated "significant" results. 

  But here's the twist: Turing might not dismiss Bem entirely. His 1950 telepathy comments show he distinguished between experimental flaws and theoretical plausibility. He'd likely demand better-designed experiments under "telepathy-proof conditions" (as he suggested for the imitation game) rather than outright rejection. 

