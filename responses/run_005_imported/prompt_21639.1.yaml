  Okay, let me tackle this user's question. They're confused about the difference between contextualism and pragmatic encroachment, especially since both theories use the same Bank Case example but seem to reach the same conclusion. The user and their friend can't see the practical difference. 

  First, I need to recall the core distinctions. Contextualism claims that the word "know" changes its meaning based on the context of the person attributing knowledge. So when the stakes are high, the standards for saying "know" go up. Pragmatic encroachment, however, argues that the stakes affect whether the person actually has knowledge, not just the word's meaning. 

  The user mentioned that both theories end up with Hannah knowing in low stakes and not in high stakes. The key difference lies in whose context matters. For contextualism, it's the attributor's context. For pragmatic encroachment, it's the subject's stakes. I should think of a scenario where these contexts differ. 

  Maybe a third-person case where the attributor and subject have different stakes. Suppose Hannah is in a high-stakes situation but tells someone else in a low-stakes context. According to contextualism, the attributor (low stakes) would say Hannah knows. But pragmatic encroachment would say Hannah doesn't know because her stakes are high. That creates a divergence. 

  Also, why do traditional epistemologists dislike pragmatic encroachment more? Probably because it directly ties knowledge to practical stakes, which challenges the idea that knowledge is purely about truth and justification. Contextualism, being about language, might seem less threatening as it doesn't alter the nature of knowledge itself. 

  The user wants a clear example where the theories disagree. The third-person scenario should work. Explaining the traditionalists' preference might involve emphasizing how pragmatic encroachment blurs the line between epistemology and practical concerns, which is a bigger shift from classical views. 

  I should make sure the example is simple and directly contrasts the two theories. Also, address why the distinction matters practically, like in testimonial reliability. That could help the user see the real-world implications beyond theoretical disagreement.
answer: |-
  That's **not** a dumb question at all! This distinction trips up a lot of people (including professional philosophers), precisely because the predictions often overlap. You and Jake have grasped the core difference correctly: it's about *what* changes – the meaning of "knows" (Contextualism) vs. the actual fact of knowing (Pragmatic Encroachment). Let's break it down and find a case where they *disagree*.

  **The Core Distinction (Recap):**

  1.  **Contextualism (e.g., DeRose, Lewis):** The *semantic standards* for the word "knows" shift depending on the context of the person *attributing* knowledge (the speaker). In high-stakes contexts *for the attributor*, "knows" requires stronger evidence/justification. The *subject's* (Hannah's) actual epistemic state doesn't change; only the bar for correctly *saying* she "knows" does.
  2.  **Pragmatic Encroachment (e.g., Stanley, Fantl & McGrath):** The *practical stakes* faced by the *subject* (Hannah) directly affect whether she *possesses* knowledge. High stakes *for the subject* genuinely require stronger justification *for her to count as knowing*. The meaning of "knows" is fixed, but what it takes to satisfy that meaning (the justification required) depends on the subject's practical situation.

  **The Problem:** In the standard Bank Case, the attributor (you/the narrator) and the subject (Hannah) are the same person *and* share the same stakes context. Both theories predict: Low Stakes (LS) = Knowledge; High Stakes (HS) = No Knowledge. So they look identical.

  **The Key to Disagreement: Diverging Contexts**

  We need a case where the **attributor's context** (and thus the standards for *saying* "knows") differs from the **subject's context** (and thus the stakes affecting *whether she knows*).

  **The Diverging Stakes Case:**

  1.  **The Setup:** Hannah needs to deposit a check. *Her* stakes are **LOW**. If she's wrong about the bank being open Saturday, it's mildly annoying, but easily fixed Monday.
  2.  **Hannah's Evidence:** She remembers going to the bank two Saturdays ago. She also vaguely remembers seeing a sign saying "Open Saturdays 9-1". She thinks, "Yeah, I know it's open Saturday." She tells her friend Ben: "I know the bank is open Saturday, I was just there 2 weeks ago."
  3.  **Ben's Context:** Ben is listening to Hannah. *Unbeknownst to Hannah*, Ben has a massive, life-ruining check that **MUST** be deposited by Monday. Ben *cannot* afford to be wrong. For Ben, the stakes are **EXTREMELY HIGH**.
  4.  **The Question:** Does Ben (the high-stakes attributor) speak truthfully if he says, "Hannah *doesn't* know the bank is open Saturday"?

  **The Predictions:**

  *   **Contextualism (Attributor Context Matters):**
      *   Ben is in a *high-stakes context*.
      *   In high-stakes contexts, the standards for correctly *saying* "S knows that P" are very high.
      *   Hannah's evidence (vague memory + one past visit) is *not* strong enough to meet Ben's high attributor standards.
      *   **Therefore:** Ben speaks **TRUTHFULLY** if he says, "Hannah *doesn't* know the bank is open Saturday." Her evidence doesn't meet *his* (high) standards for "knows".

  *   **Pragmatic Encroachment (Subject Context Matters):**
      *   Hannah is in a *low-stakes context*.
      *   In low-stakes contexts, the justification required *for the subject to possess knowledge* is lower.
      *   Hannah's evidence (vague memory + one past visit) *is* strong enough *for her low-stakes situation* to count as knowledge.
      *   The meaning of "knows" is fixed. Hannah meets that fixed standard relative to *her* context.
      *   **Therefore:** Hannah **DOES KNOW** the bank is open Saturday (relative to her low stakes). Ben would speak **FALSELY** if he said, "Hannah *doesn't* know," because she *does* know (by the fixed standard, given *her* stakes). Ben might be *justified* in *doubting* her knowledge or wanting more evidence *for himself*, but that doesn't mean *she* lacks knowledge.

  **Why This Distinction Matters (Beyond Philosophy Class):**

  Imagine Ben relies on Hannah's testimony. Contextualism says Ben *correctly* describes Hannah as *not knowing* (because *his* standards are high). Pragmatic Encroachment says Hannah *did know* (by the correct standard), so her testimony was reliable *for her context*, even if Ben needs more for *his* high-stakes decision. This has implications for testimony, expertise, and how we evaluate others' claims.

  **Why Traditionalists Hate Pragmatic Encroachment More:**

  You're right that "classical" (often called "invariantist") epistemologists dislike both, but Pragmatic Encroachment (PE) usually gets more heat. Here's why:

  1.  **Threat to Purity of Knowledge:** Traditional epistemology holds that knowledge is a purely *epistemic* relation between a subject and a fact (justified true belief + anti-Gettier stuff). Factors like truth, belief, and justification are about evidence and reliability, *not* practical consequences. **Contextualism** keeps this purity *at the subject level* – Hannah's *knowledge itself* isn't changed by stakes; only the *word* we use to describe it changes. **PE** directly injects *pragmatic* (non-truth-related) factors (stakes) into the *very constitution* of knowledge. This feels like contaminating the core concept.
  2.  **Subjectivity Concerns:** PE makes knowledge heavily dependent on the *individual subject's* practical situation. Two people with identical evidence about the same fact could differ in whether they know it, *solely* because their personal stakes differ. This seems deeply subjective and unstable for a concept like knowledge that aims for objectivity. Contextualism's shifts are linguistic/conversational, which feels less like making knowledge itself subjective.
  3.  **The "Abominable Conjunction":** Jason Stanley famously argued that *denying* PE forces you to accept absurd claims like: "Hannah knows the bank is open Saturday (in LS), but she shouldn't act on that belief without further evidence in HS." Critics of PE turn this around: *Accepting* PE forces you to say that merely *raising the stakes* can *destroy* knowledge you previously had, *without any change in your evidence or the world*. This seems deeply counterintuitive to traditionalists who think evidence is king. Contextualism avoids this – Hannah still has the same epistemic state (justified true belief) in both cases; we just use the word "know" more restrictively in HS.
  4.  **Motivation:** Traditionalists often see PE as a misguided solution to a problem (the Bank Cases) that can be handled better by other means (e.g., better theories of justification, action, or assertion, or just biting the bullet and saying Hannah *does* know in HS but is being irrational not to act). Contextualism, while also seen as problematic, is viewed as a *linguistic* solution to a *linguistic* puzzle about "knows", leaving the core epistemic relation untouched.

  **In a Nutshell:**

  *   **When Attributor & Subject Contexts Match:** Both theories predict the same (Knowledge in LS, No Knowledge in HS).
  *   **When Attributor & Subject Contexts Diverge:** They disagree.
      *   **Contextualism:** Follows the *attributor's* stakes (Ben says Hannah doesn't know in Diverging Case).
      *   **Pragmatic Encroachment:** Follows the *subject's* stakes (Hannah *does* know in Diverging Case).
  *   **Why Traditionalists Prefer Contextualism (or neither):** Contextualism keeps practical stakes out of the *nature* of knowledge itself (it's "just" about language), while Pragmatic Encroachment makes practical stakes a fundamental part of *what knowledge is*, which feels like a violation of epistemology's core mission to understand truth-related justification. PE makes knowledge "pragmatically contaminated" in a way Contextualism does not.

  Hope this makes the click happen! It's a subtle but crucial distinction once you see the cases where the contexts pull apart.
