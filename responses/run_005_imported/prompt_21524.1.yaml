answer: |-
  ## Eulogy for [Colleague's Name]

  We gather today with heavy hearts, united in grief and love for [Colleague's Name]. Her sudden absence leaves a profound silence in our department, in our conversations, and in the lives of all who knew her. She was a brilliant historian of philosophy, a dedicated teacher, a cherished colleague, and a true friend. Her sharp mind, her wry wit, and her deep kindness touched us all.

  [Colleague's Name] devoted much of her remarkable career to understanding the work of Frank Ramsey, the dazzling Cambridge thinker who died tragically young. She wasn't drawn to Ramsey merely as an academic subject, but as a kindred spirit. She shared his fierce intellectual honesty and his unwavering commitment to seeing the world clearly, without the filter of wishful thinking. One piece of his resonated with her particularly deeply: his short "Epilogue."

  She would often tell me – and I suspect many of you philosophers heard this too – that what she valued in that essay wasn't that it offered consolation about death. Quite the opposite. It *talked her out* of feeling she needed the *usual* kind of consoling. She loved paraphrasing Ramsey’s radical declaration: that he felt **no humility whatsoever** before the vastness of the heavens. Why? Because stars, however immense, cannot think. They cannot love. They cannot care. And it is precisely those capacities – thought, love, care – that make anything *matter*.

  This wasn't coldness from [Colleague's Name]; it was profound clarity. It was a declaration that meaning isn't found in cosmic scale or duration, but in the quality of consciousness and connection right here. The vast, indifferent universe doesn't diminish our lives; it simply provides the backdrop. What gives life its weight, its significance, its preciousness, are the very things [Colleague's Name] cultivated so beautifully: the rigor of her thought, the curiosity she ignited in her students, the loyalty she showed her friends, the quiet acts of kindness, the shared laughter over coffee, the fierce debates about ideas that mattered.

  She understood that grief like ours isn't a mistake to be corrected by invoking eternity or cosmic perspective. This pain is the direct, necessary consequence of losing someone who *thought*, who *loved*, who *mattered* so intensely to us. The ache we feel is the measure of the connection we cherished. It’s the echo of her mind engaging ours, her care warming our lives.

  So, today, we do not seek false comfort in imagined watchers or in the crushing scale of the cosmos. We honour [Colleague's Name] by embracing the reality she insisted upon: that what truly matters is what happened right here, among us, in the human scale. We honour her brilliant mind by continuing to think clearly and pursue truth. We honour her capacity for love by loving each other more fiercely, supporting one another through this loss, and remembering the warmth she brought into our lives. We honour her by recognizing that her absence hurts so much precisely because her presence *meant* so much.

  Her life, though ended far too soon, was not small. It was vibrant, thoughtful, loving, and deeply consequential to everyone in this room. She showed us that meaning isn't measured in light-years or eons, but in the quality of our attention, the depth of our connections, and the courage to face reality as it is. In that spirit, let us remember her not with cosmic humility, but with profound gratitude for the brilliant, loving, utterly human light she was. We will miss her terribly, and that is the highest tribute we can pay to a life that truly mattered.

  ---

  **Why this works for both audiences:**

  *   **For Philosophers:** Directly references Ramsey's "Epilogue," accurately captures the specific quote and its significance to her, uses terms like "intellectual honesty," "clarity," "human scale," and frames her philosophy accurately without needing explanation. They will recognize the rigorous avoidance of forbidden consolations.
  *   **For Non-Philosophers:** Explains the core Ramsey idea in accessible language ("meaning isn't found in cosmic scale... but in quality of consciousness and connection"). Focuses on universal human experiences: grief, love, connection, loss, the value of thought and kindness. Avoids jargon. The central message – that her life mattered because of *how* she lived and loved, not cosmic scales – is clear and resonant.
  *   **Avoids Forbidden Consolations:**
      *   **No Afterlife:** No suggestion she is watching, present, or in any form of existence. Focus is entirely on her *impact* and *memory* in *our* lives.
      *   **No Cosmic Minimization:** Explicitly *rejects* the idea that the universe's vastness makes her death easier or her life small. States that the universe is merely the backdrop, and meaning resides in human qualities. Acknowledges the pain of loss as valid and *proof* of her significance.
  *   **Core Message:** Affirms the value of her life based on her human qualities (thought, love, care, connection, impact) – the very qualities Ramsey (and she) elevated above mere size or duration. This is the "comfort" offered: not that the loss isn't terrible, but that the loss *is* terrible precisely because her life was so rich and meaningful on its own terms. The consolation is in celebrating *that* meaning and carrying its essence forward.
  *   **Tone:** Respectful, loving, clear, grounded, and honours her intellectual legacy without being cold. Acknowledges the pain while focusing on celebrating her life and its values.
