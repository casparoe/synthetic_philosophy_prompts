answer: |-
  You've grasped Bentham's core argument perfectly, and the connection to the Hart-Devlin debate is absolutely valid. Here's a breakdown to help your scene resonate with authenticity:

  1.  **Bentham's Core Argument Against Sodomy Laws (Utilitarian & Anti-Antipathy):**
      *   **Yes, you are precisely correct.** Bentham's primary argument in his unpublished essays (like "Offences Against One's Self: Paederasty" c. 1785) is that the laws criminalizing "paederasty" are based *entirely* on the "principle of antipathy" (or "the principle of caprice," as he sometimes called it in this context).
      *   **The Utilitarian Calculus:** He applies his rigorous utilitarian test: Does the act cause *pain*? If so, to whom? Does it cause *pleasure*? If so, to whom? Does it prevent greater pain or pleasure elsewhere?
          *   **Consenting Adults:** He argues that between consenting adults in private, the act produces pleasure for the participants and causes *no direct, tangible harm* to any other specific individual. No property is damaged, no person is defrauded, no violence occurs (absent coercion, which is a separate crime).
          *   **Alleged Harms Debunked:** He systematically dismantles the common justifications:
              *   *Population:* Argues it doesn't significantly impact population growth.
              *   *Health:* Dismisses claims of unique disease (compared to other common vices).
              *   *Weakening Masculinity/Military:* Sees no causal link.
              *   *Corruption of Youth:* Treats this as a separate issue of non-consent/assault, already covered by other laws.
          *   **The Crux:** Therefore, the *only* "harm" left is the *disgust, outrage, or "antipathy"* felt by others *merely knowing the act occurs*. For Bentham, this is **not a legitimate ground for legislation under the utility principle.** Punishment for causing mere offense or disgust inflicts *real pain* (execution, imprisonment, ostracism) without preventing any *equivalent or greater pain*. It's a net loss of happiness/utility.

  2.  **Bentham's Personal Disgust & Its Status:**
      *   **Yes, this is true and crucial for your scene.** Bentham explicitly acknowledges feeling personal disgust towards homosexual acts. He doesn't shy away from it. Phrases like:
          > *"I feel myself in the highest degree disgusted with the thought of it... I would sooner force myself to put my hand into a tub full of hungry serpents..."*
      *   **The Normative Insistence:** However, he immediately and forcefully **separates this personal feeling from its legal or moral weight.** His key point is:
          > *"But upon what grounds is the indignation excited by the idea of such a propensity to be founded? Upon the principle of antipathy... The impropriety of making it a ground of punishment is evident."*
          > *"...my antipathy is a reason for my wishing it suppressed, if I am the legislator, only in as far as my own antipathy is a symptom of a general antipathy; but then it is only a reason for punishing it, if the punishment be more eligible on the whole than the impunity: which in this case it is not."*
      *   **The Significance:** This admission is incredibly powerful dramatically. It shows your narrator grappling with his *own* ingrained feelings while recognizing they are irrelevant, even counterproductive, to just lawmaking. It's the internal conflict that makes the intellectual realization profound and believable for the era. He's not a modern man; he's an 18th-century man reasoning *through* his prejudice.

  3.  **Bentham's Explanation for the Antipathy:**
      *   Bentham *does* speculate on the psychological/social origins of this intense antipathy, recognizing its power even while denying its normative value. His explanations include:
          *   **Religious Indoctrination:** He sees religious prohibitions (Leviticus, Paul) as the primary historical source, internalized over centuries. He fiercely attacks religious authority as a basis for law.
          *   **Association of Ideas:** He suggests disgust arises from associating the act with things genuinely harmful or repulsive (excrement, disease, violence, loss of masculinity) through repeated condemnation and taboo.
          *   **Habit and Custom:** The sheer force of longstanding social taboo makes the antipathy feel "natural" or instinctive, even when it isn't. "It is the custom, therefore it is right."
          *   **"Horror Narrative":** He critiques the exaggerated, sensationalized language used to describe the act ("abominable," "against nature"), which fuels irrational fear and disgust.
      *   **His Conclusion on Origin:** While he offers these explanations, he ultimately concludes the antipathy is **learned prejudice**, not innate moral sense. It persists because it's reinforced by religion, law, and social custom, not because it points to any real harm. This origin story is crucial for your narrator – he can dissect *why* society feels this way, realizing it's constructed, not inherent.

  4.  **The Hart-Devlin Debate: A Direct Rerun:**
      *   **Yes, it's absolutely fair to see Hart-Devlin as a 20th-century echo of Bentham's 18th-century argument.** The core conflict is identical:
          *   **Hart (Bentham Redivivus):** Championed John Stuart Mill's "Harm Principle" (a direct descendant of Benthamite utility). Law should only intervene to prevent harm to others. Mere disgust, offense, or immorality without harm is not a sufficient ground for criminalization. Private consensual acts, like homosexuality, fall outside the law's proper scope. Hart explicitly drew on utilitarian thought.
          *   **Devlin (Defender of Antipathy/Sympathy):** Argued that society has a right to protect its shared moral fabric ("public morality") to prevent disintegration. Extreme disgust or outrage ("intolerance, indignation, and disgust") felt by the "reasonable man" or "the man on the Clapham omnibus" towards an act *is* evidence of its threat to society's bonds, even absent direct tangible harm. Law should uphold this shared morality. This is essentially the "principle of sympathy and antipathy" dressed in mid-20th-century sociological terms.
      *   **The Parallel:** Just as Bentham argued against criminalizing homosexuality based on antipathy, Hart argued against it (and other "victimless crimes") based on the Harm Principle. Devlin, like those Bentham criticized, argued that the *strength of societal revulsion itself* was justification enough. Hart's critique of Devlin mirrors Bentham's critique of antipathy-based law: it's irrational, subjective, and leads to unnecessary suffering.

  **How This Serves Your Scene:**

  1.  **Narrator's Reasoning Path:** Your narrator can explicitly frame his horror using Bentham's structure:
      *   Identify the "harm" the law claims to prevent.
      *   Dissect each claim (population, health, corruption) and find them wanting using reason and observation (e.g., "If corruption of youth is the fear, why punish consensual men behind closed doors? The law against assault suffices.").
      *   Conclude the *only* remaining justification is societal disgust ("antipathy").
      *   Recall Bentham's demolition of antipathy as a valid legal principle – law exists to prevent harm, not enforce taste or religious dogma.
      *   Grapple *personally* with his own ingrained disgust (mirroring Bentham's confession), realizing it's a learned prejudice, perhaps analyzing its roots (religion, association, custom), but crucially recognizing that *because it's merely disgust, it cannot justify taking a life or destroying his friend.*
      *   Frame the law not just as harsh, but as fundamentally *irrational* and *tyrannical* in its basis – a perversion of law's true purpose.

  2.  **Dramatic Tension:** The tension comes from the narrator fighting *against* his own gut feeling and *against* the overwhelming weight of societal condemnation, armed *only* with cold reason and a utilitarian framework. His fear for his friend collides with his intellectual realization that the law itself is monstrously unjust *on its own terms*.

  3.  **Historical Authenticity:** Using Bentham's *actual* arguments (the antipathy critique, the utility calculus, the confession of personal disgust, the debunking of alleged harms) grounds the scene firmly in the 1780s intellectual landscape. It's not an anachronistic import; it's the bleeding edge of radical Enlightenment thought, existing but suppressed.

  4.  **Connection to Hart-Devlin:** While your character wouldn't know this future debate, *you* knowing it confirms the enduring nature of the conflict. Your scene is depicting the *original* modern argument against legislating morality based on disgust. This adds weight and universality to the narrator's struggle.

  **In essence:** Give your narrator Bentham's utilitarian scalpel to dissect the law, Bentham's uncomfortable honesty about his own feelings to show the internal conflict, and Bentham's analysis of antipathy's origins to demonstrate the societal mechanism at work. This provides the rigorous, period-accurate intellectual journey from trained legal acceptance to profound moral outrage that you're seeking. The horror comes not just from the punishment, but from the realization that the law's foundation is rotten. Good luck with the chapter – it's powerful territory.
