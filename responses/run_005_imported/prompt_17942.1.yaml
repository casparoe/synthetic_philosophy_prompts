answer: |-
  Here’s how Henry Sidgwick might have approached the Bem affair, reconstructed from his documented methods, philosophical commitments, and psychological self-awareness:

  ### Core Sidgwickian Principles Applied to Bem
  1. **The Primacy of Prior Probability**  
     Sidgwick’s work on hallucinations taught him that extraordinary claims require extraordinary evidence *beyond* statistical significance. In his 1894 SPR presidential address, he emphasized that "coincidence must be tested not merely against chance, but against the antecedent improbability of the alleged cause." Bem’s claim of precognition—violating known physical laws—would strike Sidgwick as having such low prior probability that p-values alone could never suffice. He’d likely anticipate Wagenmakers’ Bayesian critique, noting that Bem’s p<.01 results might still represent *weak evidence* when priors are vanishingly small.

  2. **Distrust of Desire-Driven Results**  
     Sidgwick’s lifelong torment over his *own* bias toward afterlife evidence ("the dualism of practical reason") would make him hypersensitive to Bem’s incentives. He’d note Bem’s career-long interest in psi phenomena and suspect motivated reasoning in:  
     - Experimenter degrees of freedom (e.g., choosing from multiple outcome measures)  
     - Unexamined selective reporting (analogous to SPR correspondents remembering "hits" while forgetting "misses")  
     In his voice:  
     > *"The peril lies not in the investigator’s conscious fraud, but in the unconscious gravitation toward methodological leniency when the heart yearns for confirmation. Professor Bem’s diligence I do not impugn; his human frailty, I must discount."*

  3. **Significance Testing as a Known Trap**  
     Sidgwick’s Census work relied on comparing hallucination-death coincidences against baseline mortality rates—a proto-Bayesian framework acknowledging base rates. He’d view NHST (Null Hypothesis Significance Testing) as dangerously incomplete, echoing his 1887 critique:  
     > *"To declare an event 'significant' while ignoring the vast sea of unrecorded non-events is to mistake a ripple for a tide."*  
     Bem’s reliance on p-values would strike him as repeating SPR’s early errors: overcounting rare successes while neglecting the file drawer of failures.

  4. **Replication as Moral Imperative**  
     Sidgwick died deeply skeptical of his own SPR findings because replications faltered. He’d view Bem’s single-lab, unreplicated studies as ethically insufficient, writing in his 1891 journal:  
     > *"No singular result, however statistically adorned, ought to persuade where independent repetition falters. To claim otherwise is to value novelty over truth."*  
     The failed replications would thus confirm his skepticism far more than Bem’s original paper.

  ---

  ### Sidgwick’s Verdict on the Scandal
  He’d likely see the replication crisis as a vindication of his ethical epistemology:  
  - **On the irony:** He’d find tragic grandeur in parapsychology—a field he pursued for moral solace—exposing psychology’s statistical naïveté. His 1885 lament that "the standards of evidence we require for our own consolation may corrupt the science we seek to elevate" would resonate anew.  
  - **On reform:** Preregistration and Bayesian methods would appeal to his desire for "methodological asceticism"—safeguards against the "will to believe." Yet he’d mourn that these reforms emerged from scandal rather than proactive rigor.  
  - **On the unresolved dualism:** The affair would deepen his existential unease. Bem’s failed quest for psi, like his own failed quest for afterlife proof, would underscore his fear that science cannot resolve the "dualism of practical reason" without risking self-deception.

  ---

  ### In His Voice: A Hypothetical SPR Address (c. 2012)
  > *"It is with a heavy familiarity that I observe the present tumult in experimental psychology. A scholar of undoubted ingenuity claims statistical evidence for a phenomenon confounding to reason; his peers, enticed by the siren of significance, embrace his methods until replication reveals their fragility. We, who spent decades calibrating coincidence against the anchor of prior probability, know this path too well.*  
  >   
  > *Let us not scorn Professor Bem, but learn from him: for in his desire to find the extraordinary, he exposed the ordinary vice of our statistics—the p-value’s seductive ease, the neglected base rate, the unacknowledged longing for marvels. That his psi hypothesis foundered matters less than that his methods, when tested, compelled this science toward stricter evidentiary vows. A pyrrhic victory for truth, perhaps, but a victory nonetheless.*  
  >   
  > *Yet I confess melancholy. That our highest methodological standards should be forged in the kiln of failed wonders—this illustrates the very dualism that haunted my own inquiries. Must the heart’s hunger for cosmic purpose forever threaten the mind’s integrity? This crisis suggests no resolution, only a reaffirmation of vigilance."*

  ---

  ### Key Insight
  Sidgwick wouldn’t have been surprised by Bem’s statistical overreach—he’d spent his career dissecting identical temptations. His unique contribution would be framing the scandal as an *ethical failure*: the corruption of evidence by unexamined desire, a violation of the disinterestedness he considered science’s sacred duty. The replication crisis, in his eyes, would be less a statistical awakening than a belated reckoning with psychology’s neglected soul.
