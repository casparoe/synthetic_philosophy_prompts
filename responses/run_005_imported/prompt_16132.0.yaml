  Here’s a dialogue between **E**pistemicist (defending Williamson) and **S**upervaluationist (defending Fine/Keefe), working through a 21-patch color series from clearly red (Patch 1) to clearly orange (Patch 21), with a sorites progression in between. They focus squarely on higher-order vagueness:

  ---

  **E:** Let’s take Patches 1–21. Patch 1 is red, Patch 21 isn’t. For you, a supervaluationist, "red" is true of a patch iff it’s red in *all* admissible precisifications. Borderline cases are those red in *some* but not all precisifications. But now: where does the *borderline region* start and end? "Borderline" is vague too. How do you avoid a Sorites for *it*?

  **S:** Right. For first-order borderline cases, we have a range where precisifications disagree. But higher-order vagueness requires operators like *Definitely* (D). D(red) is true iff *all* precisifications classify the patch as red. Similarly, ¬D(red) ∧ ¬D(¬red) picks out the first-order borderline cases. But for *second*-order vagueness—borderline borderline cases—we need D-operators iterated: ¬D(¬D(red) ∧ ¬D(¬red)) ∧ ¬D(D(red) ∨ D(¬red)), meaning it’s not definite that it’s first-order borderline, nor definite that it’s definite red or definite non-red.

  **E:** So you build a hierarchy: D, D², D³… But doesn’t this just *relocate* the sharp boundaries? At each level *n*, there’s a sharp cutoff between Dⁿ(red) and ¬Dⁿ(red). For instance, between "definitely definitely red" and "not definitely definitely red." That’s just my epistemicism shifted upstairs! Why is your "fuzzy" boundary for "red" less problematic than my sharp one when every Dⁿ-predicate has its *own* sharp boundary?

  **S:** It’s about *robustness*. In the core cases—Patches 1–5 and 17–21—all orders of D-operators converge: Patch 1 is D(red), D²(red), D³(red)… Patch 21 is D(¬red), D²(¬red), etc. The *only* variation happens in the middle region (say, Patches 8–14), and crucially, **the hierarchy doesn’t force sharp cutoffs at the same point for every order**. Patch 8 might be D(red) but not D²(red) because some precisifications put the red/non-red cutoff at 7, others at 8. So while *each* Dⁿ-predicate has a sharp boundary *relative to its level*, the *locations* of these boundaries "smear" across the series. No *single* invisible knife-edge slices "red" from "non-red" like yours does.

  **E:** But that smearing is an illusion. Consider the predicate "has a non-zero degree of vagueness." For any patch, either it’s Dⁿ(red) for all *n* (so absolutely definite), or there’s some *k* where it’s not Dᵏ(red). That *k* is precise! Patch *m* might be D⁵(red) but not D⁶(red), meaning it’s absolutely sharp that it’s "definite to order 5" but not "to order 6." Isn’t *that* a sorites-susceptible boundary too? Why can’t I run a sorites on *degree of definiteness*?

  **S:** Because "degree of definiteness" isn’t a single predicate in the object language—it’s a *meta*-feature of the hierarchy. Each Dⁿ is a distinct operator. The hierarchy *acknowledges* that we can always ask "is *this* borderline status itself borderline?" ad infinitum, without requiring that the model collapse into absolute precision. The regress is *semantically open-ended*, matching the intuition that vagueness can’t be "captured" finitely. Your epistemicism, by contrast, insists every predicate—including "borderline"—has a sharp boundary *in the object language itself*.

  **E:** And I say that’s unavoidable! Look: take "borderline red." For you, it’s true of patch *p* iff *p* is neither definitely red nor definitely not red. But since "definitely" is model-relative, you still need a fact about *which precisifications exist* to ground this. Isn’t *that* fact sharp? Your whole space of admissible precisifications has a precise boundary—some cutoff schemes are in, some are out. So *really*, Patch *i* is "borderline red" iff the set of precisifications where it’s red is non-empty but not universal. That’s a sharp set-theoretic boundary! You’ve hidden the sharpness in the meta-language.

  **S:** But admissibility isn’t sharp! Precisifications themselves can be "borderline admissible." We can supervaluate over *extensions* of the precisification space. Kit Fine’s "global supervaluationism" allows precisifications to differ on which other precisifications are admissible, inducing higher-order vagueness without a sharp meta-boundary.

  **E:** That feels like stacking turtles all the way down. But even granting it, you haven’t explained why we *can’t know* the boundaries. For me, it’s clear: my margin-for-error principle. To know Patch *k* is red, it must be red in all patches sufficiently similar. Since similarity is vague, the safety condition for knowledge requires a buffer zone: if *k* is the last red patch, I can’t know *k* is red because if it were *k+1* (indistinguishably similar), it wouldn’t be red. So competence doesn’t require knowing boundaries—it requires *not* claiming knowledge where things are unsafe.

  **S:** And that’s where your skepticism bites. Competent speakers confidently say "Patch 1 is red, Patch 21 is not." But on your view, they *don’t know* where the boundary is—say, at Patch 12. Yet if I point to Patch 12 and say "red?", they’ll hesitate or say "borderline." Why hesitate if they don’t believe there’s a boundary *there*? Your epistemology makes their hesitation mysterious. I explain it naturally: they know multiple precisifications are legitimate, so they won’t assert "red" or "not red" where precisifications disagree.

  **E:** Their hesitation reflects *ignorance of the sharp boundary*, not ontological indeterminacy! They know a boundary exists *somewhere* in the penumbra but can’t locate it due to margin-for-error. That’s ordinary fallibilism—like not knowing the exact nanosecond a person ceases to be "young." Whereas you make vagueness a feature of reality itself, requiring an infinite hierarchy that never bottoms out in precision. Isn’t *that* more mysterious?

  **S:** Not if reality (or semantics) *is* open-textured. When I say Patch 12 is borderline, I’m not ignorant of a fact—I’m reporting a *status*: the concept "red" doesn’t mandate a verdict here. Higher-order vagueness reflects that this status itself isn’t always mandated. Your view reduces this to ignorance of brute semantic facts. Why should competent speakers be *constitutively unable* to know where "red" ends, even given ideal reflection? That seems less like semantics and more like… magic.

  **E:** And your hierarchy seems less like semantics and more like… procrastination. But perhaps we agree the sorites is blocked differently: you by semantic indecision across orders, me by epistemic barriers to locating the inevitable sharp cutoffs. Neither "solves" higher-order vagueness—we relocate it or reinterpret it.

  **S:** Exactly. I preserve the intuition that vagueness isn’t mere ignorance; you preserve the intuition that all predicates must be bivalent. The color series doesn’t choose between us—it just shows *where* our costs fall.

