  We are to write a dialogue between two philosophers: Alice (defending the Sobel objection that Gödel's argument leads to modal collapse) and Bob (defending Anderson's emendation as blocking the collapse while still proving God exists). We need to be precise about the derivation steps.

  Key elements of Gödel's original argument:

  1. **Positive properties**: We have a notion of "positive" properties (which we can think of as good, or divine). We assume:
     - Axiom 1: If P is positive, then its negation (~P) is not positive.
     - Axiom 2: If P is positive and P entails Q, then Q is positive.
     - Axiom 3: Necessary existence (NE) is positive. (NE(x) means that x necessarily exists, i.e., in every possible world.)

  2. **God-like**: An individual x is God-like (G(x)) if it possesses every positive property.

  3. **Essence**: A property E is the essence of x if and only if E entails every property that x has.

  4. **Necessary existence**: NE(x) is defined as: for every property E, if E is the essence of x, then necessarily there exists an individual with E.

  5. **Theorem**: Necessarily, there exists a God-like individual.

  Sobel's modal collapse objection: The argument implies that if something is true in the actual world, then it is necessarily true (i.e., true in all possible worlds). This is because the argument ends up proving that every positive property is instantiated in every possible world (if instantiated in one) and then that every truth is entailed by a positive property.

  Anderson's emendation: Anderson proposed to modify the axioms to avoid modal collapse. He replaces the original axioms with:

     - Axiom 1*: If a property is positive, then its negation is not positive.
     - Axiom 2*: A property is positive if and only if its negation is not positive.
     - Axiom 3*: The conjunction of any collection of positive properties is positive.
     - Axiom 4*: Necessary existence is positive.

  Also, Anderson defines a property as "positive" if it is necessarily entailed by being God-like. And he defines a God-like being as one that has every property that is positive in Anderson's sense. Then he avoids the essence clause that Sobel uses to derive collapse.

