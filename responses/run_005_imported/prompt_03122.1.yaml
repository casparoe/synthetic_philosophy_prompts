answer: |-
  Below is a dialogue between Alice (defending Sobel's modal-collapse objection) and Bob (defending Anderson's emendation). Both are sharp philosophers, and the dialogue focuses on the exact step in Gödel's derivation where modal collapse arises and how Anderson's fix purportedly blocks it. Key axioms and definitions are referenced explicitly.

  ---

  **Alice**: Let's cut to the chase. In Gödel's argument, granting that necessary existence (NE) is positive and that positivity is closed under entailment (Axiom 2: if \(P\) is positive and \(P\) entails \(Q\), then \(Q\) is positive), the essence clause forces modal collapse. I’ll walk through the derivation.

  **Bob**: I’m familiar, but I contend Anderson’s 1990 emendation avoids collapse. Still, show me your step-by-step.

  **Alice**: Start with Gödel’s definitions:  
  - **Positive properties**: Axiom 1 (Positivity exclusion): If \(P\) is positive, \(\neg P\) isn’t. Axiom 2 (Entailment closure): If \(P\) is positive and \(P \Rightarrow Q\), then \(Q\) is positive.  
  - **God-like** (\(G\)): \(x\) is God-like iff \(x\) has all positive properties.  
  - **Essence**: \(E\) is the essence of \(x\) iff \(E\) entails all properties of \(x\).  
  - **Necessary existence** (NE): \( \text{NE}(x) \equiv \forall E [\text{Essence}(E, x) \Rightarrow \Box \exists y E(y)] \).  

  Crucially, NE is positive (Axiom 3), and positivity is necessarily invariant (if \(P\) is positive, \(\Box P\) is positive).  

  **Bob**: Agreed. This setup proves \(\Box \exists x G(x)\). But where’s collapse?  

  **Alice**: Here’s the fatal move. Let \(p\) be any true proposition in the actual world (e.g., "Socrates drank hemlock"). Define a property \(Q\):  
  \[ Q(x) \equiv G(x) \land p \]  
  Since \(p\) is true, and a God-like being exists in the actual world (per Gödel’s conclusion), \(Q\) is exemplified here. Now, observe:  
  1. \(G\) is positive (by definition of God-like).  
  2. \(G\) entails \(Q\): If \(G(x)\), then \(x\) is God-like and \(p\) holds. Thus, \(G \Rightarrow Q\).  
  3. By Axiom 2 (entailment closure), since \(G\) is positive and entails \(Q\), \(Q\) must be positive.  
  4. But \(G\) requires *all* positive properties, so any God-like being in *any* world must have \(Q\).  
  5. Therefore, \(p\) must hold in all worlds: \(\Box p\).  

  Ergo, any actual truth \(p\) is necessary. Collapse.  

  **Bob**: I see your reasoning. But Anderson blocks this by revising the positivity axioms and essence. He replaces Axiom 2 with:  
  - **Axiom 2\***: Positivity is closed only under *necessary* entailment: If \(P\) is positive and \(\Box \forall x [P(x) \Rightarrow Q(x)]\), then \(Q\) is positive.  
  He also redefines **essence**: \(E\) is the essence of \(x\) iff \(E\) entails *all and only* the properties \(x\) has *necessarily*.  

  **Alice**: How does that fix collapse?  

  **Bob**: Your \(Q\) relies on \(G \Rightarrow Q\) holding contingently (since \(p\) is contingent). But Axiom 2\* requires entailment to be *necessary*: \(\Box \forall x [G(x) \Rightarrow Q(x)]\). For \(Q(x) \equiv G(x) \land p\), this becomes \(\Box \forall x [G(x) \Rightarrow p]\). That’s false! \(p\) is contingent, so \(G\) doesn’t *necessarily* entail \(p\).  

  **Alice**: Why not? If \(G\) entails \(Q\) in the actual world, doesn’t that suffice?  

  **Bob**: No. Axiom 2\* demands *necessary* entailment. Since \(p\) isn’t necessary, \(\neg \Box (G \Rightarrow p)\). Thus, \(Q\) isn’t positive. Anderson’s essence redefinition also helps: essence now only entails *necessary* properties of \(x\), so \(G\)’s essence doesn’t include contingent \(p\).  

  **Alice**: But doesn’t Anderson keep NE positive? How does he avoid collapse proving God?  

  **Bob**: He does, but carefully. Anderson uses:  
  - **Theorem**: If \(\Diamond \exists x G(x)\), then \(\Box \exists x G(x)\) (via NE).  
  - **Consistency**: He proves \(\Diamond \exists x G(x)\) by showing no contradiction arises *across worlds*. Your \(Q\) is world-dependent; Anderson’s positivity is world-invariant.  

  **Alice**: Sobel’s objection still bites: if \(p\) were necessary, \(Q\) would be positive, forcing \(\Box p\). But Anderson’s system allows contingent truths because they don’t generate positive properties.  

  **Bob**: Exactly. Anderson’s axioms restrict positivity to properties like omnipotence—which are *necessarily* good—not world-indexed ones like "Socrates drank hemlock."  

  **Alice**: But Gödel’s original essence clause directly tied God to *all* actual properties. Anderson’s "necessary entailment" feels ad hoc.  

  **Bob**: Not ad hoc—it mirrors Kant’s critique: "exists" isn’t a predicate. Anderson treats positivity as rigid across worlds, so no contingent fact infects God’s essence. Collapse arises in Gödel precisely at your step 3: using Axiom 2 on contingent entailment. Anderson’s Axiom 2\* blocks that step.  

  **Alice**: Fair. Still, Anderson must assume positivity’s consistency. If all positive properties are compossible, why isn’t that question-begging?  

  **Bob**: He doesn’t assume it—he derives \(\Diamond \exists x G(x)\) from weaker premises using modal logic (S5). Regardless, the collapse is avoided because contingent truths can’t "bootstrap" into necessity via your \(Q\).  

  **Alice**: I’ll concede Anderson blocks *this* collapse path. But his system might have other issues.  

  **Bob**: Perhaps, but on modal collapse, Anderson succeeds: Gödel’s conclusion holds without "proving too much."  

  ---

  **Summary of Key Disagreement**:  
  - **Collapse origin**: In Gödel’s original, Axiom 2 (entailment closure) + essence allows any actual truth \(p\) to define a positive property \(Q \equiv G \land p\), forcing \(\Box p\).  
  - **Anderson’s fix**: Axiom 2\* restricts closure to *necessary* entailments, preventing contingent \(p\) from generating positive properties. Essence is redefined to exclude contingent properties.  

  This dialogue pinpoints the step (Alice’s property \(Q\)) where collapse arises and shows how Anderson’s axioms intervene. Both positions are grounded in the logical structure, not slogans.
