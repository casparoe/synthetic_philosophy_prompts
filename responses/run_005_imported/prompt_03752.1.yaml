  The strongest evidence for the theological view is Pascal's own context. The Pensées aren't a political treatise but notes for defending Christianity. His critique of rationalism (Descartes) and emphasis on the heart over reason align with seeing human justice as corrupted. The "mystical foundation" might hint at divine authority, making custom a necessary but flawed substitute. 

