  **Justification Details:**

  1.  **Wright's Accuracy (5/5):** The student impeccably defines Wright's view: function is the *selected effect* explaining trait persistence (pumping blood). Incidental effects (sound, occupying space) are correctly excluded. The heart example is used precisely.
  2.  **Cummins's Accuracy (4/5):** The core of Cummins's view is well explained: function relativized to a chosen system/capacity, permissiveness (pumping blood vs. making noise). The deduction is for the claim that Cummins's account is "strictly more powerful" and "subsumes" Wright's. This overstates the case; the accounts are often seen as addressing different *kinds* of questions (evolutionary history vs. current causal organization), not as one being a strict superset of the other. The jargon "more powerful" is slightly misplaced in philosophy of science contexts.
  3.  **Malfunction (5/5):** The key distinction is perfectly articulated: Wright uses a *historical norm* (selected effect) to define malfunction, while Cummins uses a *statistical norm* within a reference class. The student correctly identifies Cummins's solution to the "malfunction problem" and notes Cummins's awareness of the issue. The heart example is applied consistently and clearly.
  4.  **Novel Traits (5/5):** The fundamental difference is nailed: Wright *requires* a selective history, Cummins *does not* (requiring only current causal contribution). The novel enzyme example is apt and effectively illustrates the intuition Wright struggles with. Framing this as a "cost" for Wright is insightful philosophical commentary.
  5.  **Overall (A, 19/20):** This is an outstanding undergraduate philosophy essay. It demonstrates a clear grasp of complex theories, their differences, strengths, and weaknesses. It directly answers all parts of the prompt using the required example consistently. The writing is precise and logically structured. The minor point deducted on Cummins's scope does not detract from the overall excellence. This is clearly A-range work.
