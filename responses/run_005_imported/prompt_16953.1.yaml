prompt: |-
  Last week a friend of mine, who is finishing a doctorate in clinical psychology, and I ended up arguing for the better part of an evening about whether psychiatric categories describe a reality that exists independently of how people are classified, or whether classifying people in a given way can itself help bring about what it purports to describe. I raised Ian Hacking's notion of the "looping effect": his idea that once people are sorted into a psychiatric kind, their self-understanding and behavior change in ways that feed back into the classification itself, reshaping its criteria, its subtypes, or the population thought to fall under it, so that the kind and the people classified continually remake one another over time.

  My friend was willing to grant that something like this happens with Hacking's own showcase case, multiple personality disorder (the subject of his book *Rewriting the Soul*), and perhaps with the more recent history of autism diagnosis, but she insisted these are outliers — unusually self-fulfilling classifications — and that most categories in the Diagnostic and Statistical Manual of Mental Disorders (DSM) are comparatively stable, "indifferent" kinds that do not loop in any philosophically interesting way. I wasn't convinced, but I couldn't produce a clean example on the spot to prove her wrong.

  So: give a detailed example of a psychiatric or closely adjacent psychological classification — other than multiple personality disorder/dissociative identity disorder and autism — that plausibly exhibits Hacking's looping effect. Reconstruct the loop concretely and in Hacking's own terms: explain what makes the kind "interactive" rather than "indifferent," describe how being classified changed how the people so classified understood, presented, or performed their condition, and trace how that change then fed back into revising the diagnostic category itself (its criteria, its subtypes, its presumed prevalence, or its presumed causes). Finally, since I suspect my friend would try to dismiss any example I bring back as "mere" historical fashion in diagnosis rather than genuine looping, briefly explain what would distinguish the two — that is, what makes a case count as Hacking-style looping as opposed to just a classification changing over time for ordinary sociological reasons.
reasoning: |-
  Okay, the user is asking for a detailed example of a psychiatric classification that demonstrates Ian Hacking's looping effect, excluding DID and autism. They had an argument with their friend who believes most DSM categories are stable and don't loop. The user wants to counter this by showing another example that fits Hacking's model.

  First, I need to recall Hacking's concept. The looping effect involves classifications that interact with the people classified, changing both the individuals and the category itself. The friend conceded DID and autism but thinks they're outliers. So, the challenge is to find another DSM category that clearly shows this interaction.

  Possible candidates? PTSD comes to mind. It's well-documented how the diagnosis has evolved. Let me trace the history. Before PTSD was in the DSM-III (1980), similar symptoms were called "shell shock" or "war neurosis," but the criteria were vague. The inclusion of PTSD as a distinct category changed how people understood their experiences.

  How did the classification affect individuals? Veterans and trauma survivors started to recognize their symptoms as part of a known condition. This led to advocacy groups forming, like Vietnam veterans campaigning for recognition. Their activism influenced the diagnostic criteria, especially around the definition of trauma. For example, the DSM-IV expanded traumatic events beyond direct combat to include learning about traumatic events happening to others.

  Then, the DSM-5 revisions. Controversies arose over criteria like Criterion A2 (subjective response). Activism and research led to changes, showing how classified individuals' feedback altered the category. Also, the expansion to include more types of trauma survivors broadened the population, affecting prevalence rates.

  Why is this looping and not just historical change? Key points: the classification changed how people identified themselves, leading to collective action that directly influenced the DSM. The category and the classified co-evolved interactively, not just due to external factors. Hacking's idea hinges on this dynamic interaction where the kind and the people mutually reshape each other.

  The user also needs to distinguish looping from mere diagnostic fashion. Looping involves feedback from the classified group altering the category, whereas fashion might be driven by professionals or societal trends without input from those diagnosed. In PTSD, the activism and personal testimonies were crucial, making it a clear case of looping.
answer: |-
  Here's a detailed example of Hacking's looping effect using **Post-Traumatic Stress Disorder (PTSD)**, demonstrating how the classification and the classified have dynamically reshaped each other:

  ### 1. **The "Interactive" Nature of PTSD as a Kind**
     *   **Not Indifferent:** PTSD is an *interactive kind* because the act of classifying someone with PTSD fundamentally changes their self-understanding, behavior, social context, and relationship to the diagnostic category itself. Unlike an "indifferent kind" (e.g., "quartz," whose properties exist independently of human classification), PTSD's meaning and manifestations are entangled with the diagnostic label and the cultural/scientific discourse surrounding it.

  ### 2. **The Loop: How Classification Changed People & How People Changed the Classification**
     *   **Stage 1: Classification Introduced & Internalized (DSM-III, 1980):** Prior to DSM-III, traumatic reactions were described variably (e.g., "shell shock," "war neurosis," "combat fatigue," "traumatic neurosis") with inconsistent criteria, often focusing narrowly on combat veterans. The creation of PTSD as a formal diagnosis with specific criteria (Criterion A: traumatic event; B: intrusive symptoms; C: avoidance; D: negative alterations in cognition/mood; E: hyperarousal) provided a new, authoritative framework.
          *   **Impact on the Classified:** Individuals experiencing severe distress after trauma (not just combat veterans, but also survivors of assault, accidents, disasters) now had a specific lens through which to understand their suffering. They could identify their intrusive memories, nightmares, hypervigilance, and emotional numbing *as symptoms of PTSD*. This label:
              *   Validated their experience as a legitimate medical/psychological condition (reducing stigma/self-blame for some).
              *   Shaped their self-narrative: "I have PTSD" became a core part of identity for many.
              *   Guided behavior: Seeking specific treatments (e.g., trauma-focused therapies), joining support groups, applying for disability benefits, and engaging in advocacy became common paths.
              *   Created a new social group: "PTSD survivors" formed communities, shared experiences, and developed a collective voice.

     *   **Stage 2: Feedback Loop - The Classified Influence the Category:** This new self-understanding, collective identity, and advocacy directly fed back into the evolution of the PTSD diagnosis:
          *   **Refining Criterion A (Traumatic Event):** Early DSM-III required an event "outside the range of usual human experience." Survivors of "common" traumas (e.g., chronic childhood abuse, domestic violence) argued their experiences *were* traumatic but often excluded by this definition. Their advocacy and clinical evidence led to DSM-IV (1994) changing Criterion A to focus on the *individual's response* (intense fear, helplessness, horror) rather than the rarity of the event, significantly broadening who could be diagnosed.
          *   **Expanding Symptom Recognition:** Survivor testimonies and advocacy highlighted previously under-emphasized symptoms like dissociation, shame, guilt, anger, and somatic complaints. This contributed to the expansion and reorganization of symptoms in DSM-5 (2013), including a new cluster ("Negative Alterations in Cognitions and Mood") and explicit mention of dissociation.
          *   **Subtype Development:** Advocacy and research driven by veterans and sexual assault survivors pushed for recognition of complex presentations, particularly stemming from prolonged, interpersonal trauma. While not a separate diagnosis in the DSM, this led to the concept of **Complex PTSD (C-PTSD)** gaining significant traction in research (ICD-11 now includes it) and clinical practice, directly reflecting the lived experience of a large subgroup classified under (or adjacent to) PTSD.
          *   **Shifting Prevalence & Causes:** As the definition broadened (Criterion A change, symptom recognition) and awareness increased (driven partly by those diagnosed speaking out), the *presumed prevalence* of PTSD increased dramatically. Furthermore, understanding of *causes* shifted from a narrow focus on acute, life-threatening events to include the profound impact of chronic interpersonal trauma, betrayal, and adverse childhood experiences – perspectives heavily influenced by survivor narratives and research they motivated.

  ### 3. **Distinguishing Looping from "Mere" Diagnostic Fashion**
  Your friend might argue that changes in PTSD criteria are just "fashion" – clinicians refining definitions based on new research or societal concerns. Hacking's looping effect is distinct because:

  1.  **The Role of the Classified Subject:** In looping, the *people classified* are active participants in changing the category. Their altered self-understanding, collective organization, advocacy, and even their symptom presentation (informed by the label) become *direct drivers* of diagnostic revision. It's not just top-down change by experts.
  2.  **Mutual Constitution:** Looping emphasizes the *dynamic feedback* between the classification and the people. The category changes *because* the people classified by it change *in response* to it. The kind and the people classified are co-constituted over time. PTSD didn't just get "updated"; it was reshaped *by* the very population it defined, who were themselves reshaped *by* the initial definition.
  3.  **Identity & Performativity:** Looping involves changes in identity and behavior (performativity) directly linked to the classification. People diagnosed with PTSD didn't just learn they had a condition; they *became* "PTSD survivors," adopted associated identities and roles (advocate, patient), and their symptomatic expressions were influenced by cultural models of what PTSD "looks like" (which they also helped shape).
  4.  **Feedback into Criteria/Meaning:** The change isn't just about prevalence numbers or external causes; it fundamentally alters the *defining criteria* (Criterion A), the *symptom profile* recognized (dissociation, complex presentations), and the *subtypes* considered (C-PTSD) *based on* the experiences and demands articulated *by* those bearing the label.

  **In essence:** While "fashion" implies external trends influencing expert opinion, **looping** requires the **active, constitutive role of the classified individuals themselves** in reshaping the category that defines them. PTSD exemplifies this perfectly: veterans, assault survivors, and others diagnosed didn't just receive a label; they used it, lived it, organized around it, and demanded changes to it, leading to a profoundly different understanding of trauma and its consequences than existed before 1980. The kind and the classified mutually and dynamically transformed each other.
