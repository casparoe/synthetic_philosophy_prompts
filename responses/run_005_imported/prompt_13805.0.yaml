  Okay, let me start by really understanding the user's problem. They're part of a volunteer panel dealing with a relay team's record being challenged because one runner failed a drug test. The key rule is that the team's time is a "single joint performance." The panel is split: half think that means the whole performance is void, while the other half see it as just a scoring convention. The user needs to write a ruling memo that digs deeper into what "joint" means here, beyond just fairness to the innocent runners.

  First, I need to unpack the rule's intent. The phrase "single joint performance" likely exists for scoring purposes—to treat the relay as one unit for records and results. But does that automatically extend to doping violations? The user mentioned that a relay involves coordinated handoffs and months of practice, which makes it a cohesive unit. So, the joint nature isn't just administrative; it's physical and strategic. If one runner is doped, their enhanced performance could affect the whole race, especially in exchanges and pacing. That's a strong argument for voiding the record entirely.

  But then there's the fairness angle. The other three runners are clean and had no knowledge. Punishing them might seem unjust. However, in team sports, the team bears responsibility for any member's violation. That's a common principle in anti-doping regulations. Even if they're innocent, the team's achievement is tainted. The user’s co-panelist is focused on fairness, but the deeper issue is the integrity of the record itself. If the record stands with an asterisk, it still implies the team's performance was legitimate, which it wasn't due to the doping.

  The user also needs to address personal consequences for the clean runners. The memo should clarify that voiding the record isn't a personal sanction against them. The ruling should separate the result from individual accountability. The three runners shouldn't face further penalties, but their result as part of the team is invalidated. This balances maintaining competition integrity with fairness to individuals.

  I should check if there's precedent or how other organizations handle relay doping. While the user's rulebook is sparse, looking at bodies like WADA or IAAF might help. Typically, in relays, a positive test from one member leads to disqualification of the whole team. That supports the argument for voiding the record. The "joint performance" rule reinforces this by treating the team as a single entity.

  Another angle: the stimulant's effect. The user didn't specify, but stimulants can boost performance, especially in a relay where split-second exchanges matter. Even if the doped runner's individual time wasn't extraordinary, their impact on transitions could have contributed significantly. Thus, the entire performance is compromised.

  The user wants the memo to explore what "joint" means beyond the surface. So, the analysis should distinguish between the administrative use of the term (recording results) and its implications for integrity. The relay's interdependent nature means that any part of the chain affects the whole. Therefore, for record purposes, the violation invalidates the collective effort.

  Finally, the memo must be clear and concise. It should state the record is voided without asterisk, explain the rationale based on the relay's joint nature, and absolve the clean runners of personal sanctions. This addresses both the integrity of the sport and individual fairness without conflating the two.
