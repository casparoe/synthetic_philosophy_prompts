  Here’s a draft ruling memo that addresses the complexities of "joint performance" while balancing integrity, fairness, and the relay’s unique nature. It avoids simplistic interpretations and focuses on the structural reality of a relay:

  ---

  **MEMORANDUM**  
  **TO:** Competition Integrity Panel  
  **FROM:** [Your Name], Panel Member  
  **SUBJECT:** Ruling on Record Voidance & Sanctions: Club 4x400m Relay (Case #2024-07)  
  **DATE:** [Current Date]  

  ### I. SUMMARY
  After deliberation, the panel **VOIDS** the meet record set by the [Club Name] 4x400m relay team due to a doping violation by one runner (Runner D). The record is expunged without asterisk. **No personal sanctions** (e.g., suspensions, fines) apply to the three clean runners. The rationale centers on the relay’s intrinsic nature as a *competitive unit*, not merely a scoring convention.

  ### II. ANALYSIS OF "JOINT PERFORMANCE"  
  The rulebook’s phrase—"constitutes a single joint performance for record and results purposes"—must be interpreted in context:  

  1. **Administrative Purpose (Scoring)**  
     The phrase ensures relay times are recorded/ranked *as a whole*, not as four discrete legs. This avoids impracticalities (e.g., ranking teams by cumulative individual splits).  

  2. **Competitive Reality (Integrity)**  
     A relay is interdependent:  
     - **Tactical Synergy:** Pacing, handoff execution, and race strategy are collective. Runner D’s enhanced stamina/stimulus (from a banned stimulant) likely influenced the team’s overall rhythm, transition efficiency, and final time.  
     - **Inseparable Contribution:** Even if Runner D’s *individual* split were isolatable (which it cannot be post-race), their advantage permeated the team’s unified effort. The record reflects a *collaborative output*, not a sum of parts.  
     - **Structural Trust:** Relays require athletes to rely on teammates’ physical/mental states. The "joint performance" rule codifies this reliance for competitive fairness.  

  **Conclusion:** Voiding the record upholds that a relay result is *inextricably collective*. Allowing it to stand—even with an asterisk—implies the team’s performance was valid when a core element was illicitly enhanced.  

  ### III. SANCTIONS FOR CLEAN RUNNERS  
  - **No Personal Penalties:** The three clean runners face **no suspensions, fines, or competitive bans**. There is no evidence of complicity, and anti-doping culpability is individual absent proof of conspiracy.  
  - **Result Voidance ≠ Punishment:** Losing the record is a *consequence of the team’s disqualification*, not a personal sanction. All relay members accept this inherent risk: the team’s result rises or falls together.  
  - **Fairness Balance:** While harsh, this maintains event integrity. Personalizing sanctions (e.g., banning clean runners) would be disproportionate; preserving the record would incentivize team-level negligence.  

  ### IV. RULING  
  1. The 4x400m relay meet record **is VOIDED**. No team time will be listed for this entry.  
  2. **No further action** is taken against the three clean runners. Runner D is referred to the national anti-doping authority per standard protocols.  
  3. The prior record holder (if any) retains the record.  

  *Signed,*  
  [Your Name]  
  For the Competition Integrity Panel  

  --- 

  ### Key Reasoning Highlights:
  - **Why "joint performance" demands voidance:** The rule’s purpose isn’t just administrative—it acknowledges that a relay’s *competitive value* emerges from interdependence. A doped runner’s advantage isn’t confined to their lap; it distorts the collective effort.  
  - **Why no asterisk?** Asterisks imply a *partially valid* performance. Here, the "joint" result is irreparably tainted.  
  - **Why no sanctions for clean runners?** Anti-doping principles focus on individual fault. Voiding the result protects the sport’s integrity; punishing blameless athletes exceeds that mandate.  
  - **Relay ≠ Four Solo Races:** The memo emphasizes how handoffs/tactics fuse runners into a single competitive entity. This distinguishes relays from aggregate events (e.g., team decathlon).  

  This approach resolves the tension: it honors the relay’s uniqueness while limiting collateral damage to the unavoidable loss of the result.
