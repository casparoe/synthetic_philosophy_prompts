  Each solution has issues. The user might find the "at no time" answer unsatisfying because it feels abstract. Retrospective harm relies on a subject that doesn't exist. Counterfactuals explain the harm's nature but not its occurrence time. Symmetry arguments might not fully convince because of our temporal bias towards the future.

