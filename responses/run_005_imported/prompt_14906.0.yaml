answer: |-
  That's an excellent question that gets to the heart of a crucial and ongoing debate in philosophy! Frankfurt's counterexample is indeed powerful and widely accepted as showing that the **Principle of Alternative Possibilities (PAP)** is false *for moral responsibility*. PAP states: "A person is morally responsible for what he has done only if he could have done otherwise."

  Frankfurt's case demonstrates that Jones *is* morally responsible for his action (e.g., voting for candidate A) *even though* he genuinely could not have done otherwise (due to Black's device). Therefore, PAP is false. You're right that this is a major win for *compatibilists* about moral responsibility and determinism, as it severs the direct link between responsibility and the ability to do otherwise, which incompatibilists often rely on.

  However, philosophers like Robert Kane (a prominent libertarian incompatibilist) persist in arguing that free will *itself* requires alternative possibilities for several key reasons:

  1.  **Distinguishing Free Will from Moral Responsibility:** Kane and others argue that Frankfurt successfully attacks PAP *for moral responsibility*, but **not necessarily for free will itself**. They maintain a distinction:
      *   **Moral Responsibility:** Frankfurt *might* show you can be blameworthy/praiseworthy without alternative possibilities in *specific, manipulated* scenarios.
      *   **Free Will:** This is a deeper capacity – the power to be the *ultimate source* or *originator* of your actions. Kane argues *this* power *inherently* requires that alternative possibilities were genuinely open at some crucial point. Free will is the *control condition* that *grounds* responsibility. Without the ability to do otherwise at key moments (what Kane calls "Self-Forming Actions" - SFAs), you lack the kind of control necessary for *true* freedom, even if you happen to do what you want and can be held responsible.

  2.  **The "Flicker of Freedom" Strategy:** Critics argue that Frankfurt cases *don't actually eliminate all alternative possibilities*. They only eliminate the *specific* alternative action (e.g., voting for B). But what about alternatives *in how the action comes about*?
      *   Could Jones have decided *on his own* vs. being *forced* by Black? In Frankfurt's original setup, Black monitors Jones's *prior sign* (e.g., a furrowed brow) that indicates he *will* choose A. If Jones shows the sign, Black does nothing; if not, Black intervenes. Critics argue that Jones *could* have done otherwise *in the sense* of *not showing the sign*, thereby triggering intervention and *not* deciding on his own. While the outcome (voting for A) is fixed, *how* it happens (freely vs. coerced) is not. Kane argues this "flicker" of an alternative possibility (deciding freely vs. being caused to decide) is crucial for distinguishing a free action from a compelled one, even if the outcome is the same. Eliminating *this* flicker might undermine responsibility. (Note: Frankfurt and defenders have developed increasingly complex cases to try and eliminate even this flicker, but many incompatibilists remain unconvinced).

  3.  **The Requirement of Ultimate Responsibility (UR):** Kane's core argument centers on **Ultimate Responsibility (UR)**. For an agent to be ultimately responsible for an action:
      *   The action must be *willing* and *uncompelled* (which Frankfurt cases satisfy).
      *   **Crucially:** The *wills* or character traits from which the action flows must themselves be shaped by actions for which the agent was ultimately responsible. This requires that at some points in the agent's life ("Self-Forming Actions" - SFAs), they faced genuinely open alternatives where they *could* have done otherwise, and whichever choice they made was undetermined (not causally necessitated). It was in these moments that they *formed* their will.
      *   **Why Frankfurt Cases Fail for UR:** In a Frankfurt case (or a deterministic world), the agent's choice *is* determined by prior causes (including their character, desires, etc.). Even if they "do it on their own," the source of that action traces back to factors *before* the agent had any control (genetic inheritance, environment, etc.). They are not the *ultimate originator*. Only indeterminism at key SFA moments, Kane argues, breaks this chain and allows the agent to be the true source of their own will. Without the ability to do otherwise *at those formative moments*, you cannot be the ultimate author of your character and thus your subsequent "free-seeming" actions like Jones's.

  4.  **Source Incompatibilism:** Kane represents a strand of incompatibilism called **Source Incompatibilism**. They agree with Frankfurt that *alternative possibilities* per se might not always be necessary for responsibility *in the moment*, but they argue that *determinism* itself is incompatible with free will and responsibility because it means the *source* of the action lies outside the agent, in the distant past. Free will requires being an *uncaused cause* or *prime mover* in some relevant sense. Frankfurt cases, occurring *within* a deterministic framework (or even a manipulated one), still suffer from this problem of the source being external. The ability to do otherwise in SFAs is the mechanism Kane proposes to achieve this ultimate sourcehood.

  **In Summary:**

  *   **Frankfurt Wins (on PAP for MR):** Yes, Frankfurt convincingly shows that **moral responsibility** can exist *without* the ability to do otherwise *in a specific, constrained action* like Jones's vote. This damages a key argument *for* incompatibilism based on PAP.
  *   **Kane's Persistence (on Free Will & UR):** Kane argues Frankfurt hasn't addressed the deeper need for **ultimate responsibility** and **being the true source** of one's will. This, he contends, requires that at *formative moments* (SFAs), the agent *did* have genuinely open alternatives and the ability to do otherwise. Without this, the agent is not the ultimate author of their character and actions, even if they act willingly and can be held responsible in Frankfurt-style scenarios. Free will, for Kane, is fundamentally about this ultimate origination, not just about responsibility in a particular instance.

  So, the debate continues. Compatibilists see Frankfurt as removing a major obstacle. Libertarians like Kane concede Frankfurt's point about PAP and responsibility in specific cases but argue it doesn't touch the core requirement for *ultimate sourcehood* and *true origination* that free will demands, which *does* require alternative possibilities at crucial junctures. They see the "flicker" arguments and the UR requirement as keeping the incompatibilist position viable.
