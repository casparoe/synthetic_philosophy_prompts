answer: |-
  ## The Drowning Debate: A Dialogue After Hours

  **Setting:** The bustling lobby of a philosophy conference hotel. Clusters of scholars mingle. **Professor Elena Reed** (Counterfactual Theorist), mid-50s, sharp-eyed and energetic, sips espresso. **Dr. Samuel Vance** (Process Theorist), late-40s, thoughtful and reserved, nurses a mineral water. They spot each other near the exit.

  **Reed:** Samuel! Enjoyed your comments on the Salmon paper. Though, naturally, I think you're chasing ghosts with that 'physical connection' requirement. Causation is fundamentally about *dependence*, not wires and pipes.

  **Vance:** *(Smiles wryly)* Elena. Always a pleasure to spar. Dependence without mechanism feels... spectral. Like building responsibility on shadows. Speaking of shadows, that panel on legal omissions had me thinking. Your counterfactual approach... it seems dangerously promiscuous in the lifeguard case.

  **Reed:** *(Leans in, intrigued)* The lifeguard glued to their phone? The swimmer drowns unseen. Classic. And perfectly clear: *But for* the lifeguard's omission – failing to scan, failing to act – the drowning wouldn't have occurred. The dependence is stark. The omission *is* a cause. What's promiscuous about that?

  **Vance:** What's promiscuous? Let's follow your counterfactual logic. *But for* the omission of *any* bystander who *could* have looked up and acted, the drowning wouldn't have occurred. True? *But for* the swimming instructor's omission years ago – failing to teach the swimmer a better distress signal – the drowning might not have occurred. True? *But for* the beach authority's omission – failing to fund a second lifeguard – the drowning might not have occurred. True? By your lights, *all* these omissions are causes of the death. Yet the law, morality, common sense – they don't spread blame like peanut butter. They focus laser-like on the *lifeguard*. Why, Elena? If causation is just counterfactual dependence, why isn't everyone a cause? Your theory seems to dissolve responsibility in a sea of possibilities.

  **Reed:** *(Pauses, taps her cup)* Okay, Samuel. That's a fair push. The *range* of counterfactual dependencies is vast. But not all dependencies are *salient*. Not all are *relevant* for assigning responsibility. The lifeguard had a *duty* – a specific, concrete obligation arising from their role. That duty makes their omission *the* salient counterfactual dependence. The bystander had no such duty; the instructor's omission is too temporally remote and probabilistic; the authority's funding decision, while perhaps negligent, is a step removed. The counterfactual dependence is *there* for all, but only the lifeguard's is the *proximate* and *duty-bound* cause relevant for *this* harm.

  **Vance:** So you retreat to *duty* and *proximity*? But Elena, those are *moral and legal* concepts grafted onto your causal account. You started by saying omissions *are* causes, full stop, because of counterfactual dependence. Now you're admitting that dependence alone isn't enough – we need extra-causal filters like 'duty' and 'proximity' to *pick out* which dependence counts as *the* cause for blame. Doesn't that concede my point? That pure counterfactual dependence is too broad, and that the real work in assigning responsibility is done by these normative concepts, *not* by causation itself? The lifeguard's inaction isn't magically *more* of a counterfactual cause than the bystander's; it's just that we *care* more about it because of the duty. The causation part is the same – or rather, equally non-existent in physical terms.

  **Reed:** Hmm. You force me to refine. The counterfactual dependence *is* the causation. But causation exists within a framework of *agency* and *possibility*. The lifeguard wasn't just *any* possible preventer; they were *the designated preventer*, present, equipped, and expected to act *at that moment*. The counterfactual scenario where *they* act is the most direct, immediate, and probable alternative path where the harm is averted. The bystander acting? Possible, but unlikely and outside the expected causal chain. The instructor acting differently years ago? A vast restructuring of history. The dependence on the lifeguard's omission is uniquely direct and agential. It’s not *just* duty; it’s the concrete *capacity* and *position* at the critical juncture.

  **Vance:** "Direct and agential." But Elena, *how*? What *physically connects* the lifeguard's *not looking* to the swimmer's lungs filling with water? There is no energy transfer, no signal, no spatio-temporal process linking that absence to the drowning event. The drowning unfolds entirely through physical processes in the water: the swimmer's panic, the water entering the airway, the oxygen deprivation. The lifeguard's inaction is simply *not part of that physical story*. It's a background condition, like the absence of a passing dolphin. We *infer* a connection based on what *should* have happened, based on duty. But that 'should' is normative, not causal. It's a judgment *about* the world, not a description *of* its causal fabric. The world, physically, just contains a drowning and an inattentive lifeguard nearby. The 'cause' label is our *interpretation* based on expectation, not a discovered physical link.

  **Reed:** Then explain this, Samuel: Why does *everyone* – the law, the family, even *you*, I suspect – feel a visceral certainty that the lifeguard's *failure* caused the death? Why isn't the blame diffused or absent? If causation is purely physical process, and omissions are non-events, then the lifeguard is no more causally connected to the death than the moon is. Yet we hold them responsible. Intensely. Why, if there's *no* causal link at all? Doesn't your theory make a mystery of our deepest intuitions about responsibility? It renders the lifeguard's inaction metaphysically inert, which seems utterly disconnected from the moral gravity of the situation.

  **Vance:** *(Sighs, takes a long drink)* You touch a nerve, Elena. The moral gravity *is* real, and the legal assignment of responsibility *is* crucial. But I think you conflate causation with responsibility. We hold the lifeguard responsible *because* they had a duty and breached it, *because* their action was the normatively expected intervention that would have changed the outcome. The *basis* for responsibility is the breach of duty *in the context of* the counterfactual dependence. But the *causal mechanism* of the harm itself didn't involve them. Their omission created the *opportunity* for the drowning to proceed unimpeded, it didn't *produce* it. Think of it like a guard failing to lock a gate, allowing a prisoner to escape. The escape is caused by the prisoner's running, the open gate... but the guard's omission isn't a *cause* of the running; it's the removal of a barrier that *allowed* the existing causes (the prisoner's desire, ability) to operate freely. We blame the guard fiercely for *allowing* the cause to operate, not for *being* the cause. The drowning was caused by water and the swimmer's condition; the lifeguard *allowed* that cause to take its course. Our intuition singles them out because the duty makes their omission the *salient enabling condition* – the crucial absence *we expected to be a presence* that would have interrupted the causal process. But the process itself ran from swimmer to water to death, uninterrupted by any physical input from the lifeguard.

  **Reed:** So we blame them for *allowing*, not *causing*? That feels like sophistry, Samuel. Semantics. The outcome counterfactually depended on their action. That dependence *is* the causal relation in the human world of agents and interventions. Your 'physical process' feels like a philosopher's abstraction, irrelevant to how we actually navigate and judge the world of actions and failures. If the lifeguard had acted, the death *would not have happened*. That seems like the very essence of causing its absence. Denying it the status of 'cause' feels like denying reality.

  **Vance:** And *your* view, Elena, inflates causation to include every possible preventer, forcing you to rely on normative concepts to clean up the mess. We *do* navigate a world of agents, but we also inhabit a physical universe. My abstraction tries to describe the glue that holds events together in that universe. Your abstraction describes the web of dependencies we care about as moral agents. Perhaps... *(He trails off, looking out at the darkening street)* perhaps we're mapping different terrains with the same word. The law needs your map for responsibility. Physics might prefer mine. But neither map captures the whole territory when a lifeguard looks down, and a life slips away.

  **Reed:** *(Finishes her espresso, a thoughtful frown replacing her earlier energy)* Agreed on that last point, Samuel. Utterly. The disagreement runs deeper than this case. But I still think the lifeguard *caused* that death by not acting. And I suspect the courts will agree with me, metaphysics be damned. Duty or no duty, that dependence feels... real.

  **Vance:** *(Nods slowly)* And I suspect the lifeguard, in their darkest hour, feels the terrifying weight of that *absence* as surely as if they'd pushed the swimmer under. Real enough for blame, Elena. Real enough for blame. Even if it's not, strictly speaking, causation. Goodnight.

  *(They exchange a look of mutual respect and unresolved tension before turning towards separate exits, the weight of the drowned swimmer lingering between them in the conference hall air.)*
