  Q2: He exists 
  Q3: Li exists 
  Truth: Q1=✓, Q2=✓, Q3=✗ 

  Theory A: Q1 ∧ ¬Q2 ∧ ¬Q3 
  Theory B: Q1 ∧ ¬Q2 ∧ Q3 

  Now consequences: 
  A implies: 
  - True: Q1, ¬Q3 
  - False: ¬Q2 

  B implies: 
  - True: Q1 
  - False: ¬Q2, Q3 

  Truth content comparison: 
  A has true consequence ¬Q3 (since Li doesn't exist) 
  B does not imply ¬Q3! In fact B asserts Q3. So ¬Q3 not in B's content. 
  Meanwhile B has no unique true consequence that A lacks. 

  So: 
  - Is A's truth content ⊆ B's? No, because ¬Q3 is implied by A but not B. 
