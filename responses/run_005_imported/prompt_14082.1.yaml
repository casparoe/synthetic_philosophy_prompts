  I see why lecturers use weather examples - propositional logic handles them cleanly. But user hates that. Alternative: a tiny scientific law. Suppose we have possible elements: Hydrogen (H), Helium (He), Lithium (Li). Truth: H and He exist. 
  - Theory A: "Only H exists" → false, misses He 
  - Theory B: "Only H and Li exist" → false, misses He, adds Li 

  Intuitively A is closer - it only missed He, while B missed He and added fake Li. Now Popper: 
  - Truth content of A: "H exists" (true) 
