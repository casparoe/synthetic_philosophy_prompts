  Boom. This works. I'll formalize with: 
  Atomic facts: H_exists, He_exists, Li_exists. Truth: H=T, He=T, Li=F. 
  Theory A: H=T, He=F, Li=F 
  Theory B: H=T, He=F, Li=T 

