  - A's truth content includes H_exists and ¬Li_exists 
  - B's truth content includes H_exists and ¬He_exists? Wait no, B asserts He=F which is false, so ¬He_exists is false? Confusion. 

  Better to define theories as closed under implication. Let language be: 
