  - Theory B: "Only 3 or 5 corners" (excludes truth 4, includes false 5)

  Intuitively B is closer - it got 3 and 5 right (vs A's 3 and 4), both missed one truth but A included 4 which is farther from reality than B's inclusion of 5? Wait no, in discrete math all falsehoods are equally wrong? Mistake. Actually in this setup, both theories are symmetric: each has one missing truth and one extra falsity. But we need asymmetric failure... 

  Revised approach: Make truth non-symmetric. Suppose reality allows only even corners: 4 (square) and 6 (hexagon). Truth content T = {4,6}. Now: 
  - Theory A: "Only 4 corners" → truth content {4}, falsity content ∅? No, A implies nothing false? It's incomplete but not false? Problem. 

  Better: Theories must be inconsistent with truth. Set truth = {4,6}. 
  - Theory A: "Shapes have 3 or 4 corners" → truths: {4}, falsehoods: {3} 
  - Theory B: "Shapes have 4 or 5 corners" → truths: {4}, falsehoods: {5} 

  Now Popper's definition: 
  - Truth content of A: {4} 
  - Truth content of B: {4} → same size 
  - Falsity content of A: {3} 
  - Falsity content of B: {5} → neither set contains the other! So no ranking. 

  But is B really "closer"? Both missed 6, both falsely added one wrong number. Without metric, 3/5 equally distant from {4,6}. User needs to feel why this is problematic. Perhaps add structure: if corners indicate "regularity", then 5 is closer to 4/6 than 3 is? But that's adding metaphysics. 

  Actually Tichý's insight was deeper: for any false theory, its logical consequences create interdependent truth/falsity sets that rarely satisfy subset relations. I'll show how B's truths don't contain A's because A has unique true implications. In the example: 
  - A implies "not 6" (true!) and "not 5" (true!) 
  - B implies "not 3" (true) and "not 6" (true) 
  But A also implies "all shapes ≤4 corners" which is false, while B implies "all shapes ≥4" - also false. Crucially, A's truth content includes "if shape exists, corners ≤4" which is true but not implied by B! Because B allows 5>4. So truth content isn't subset. 

