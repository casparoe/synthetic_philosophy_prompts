  1) B's truth content contains A's? No, because ¬Q3 not in B. 
  2) B's falsity content contained in A's? No, because Q3 is in B's but not A's. 

  Neither condition satisfied. But intuitively A is better - it only makes one error (denying He), while B makes two (denying He, asserting Li). Verisimilitude should rank A > B, but Popper can't. 

  Perfect. User will see the mechanical failure: the specific true consequence ¬Q3 belongs only to A, blocking set inclusion. Yet this "advantage" feels irrelevant - it's just a byproduct of A being wrong about less things. The definition is too syntactic. 

  Final touch: emphasize this isn't about He/Li specifically - any similar triad breaks it. Tichý proved this happens generically. Science constantly compares such theories (e.g., phlogiston vs oxygen theories - both false, but one closer). Popper's definition can't capture that. 

