  Let's analyze the exchange step-by-step, identify who has the better argument at each move, and then examine overlooked dimensions of the demos boundary problem:

  **Move-by-Move Analysis**  
  *(✓ = stronger argument in this exchange)*  
  1. **Elena (Affected Interests Principle)**  
     - ✓ **Strength:** Correctly identifies the moral problem of imposing costs without representation. Her principle aligns with democratic inclusion ideals (e.g., Dahl's "all affected interests" standard).  
     - **Weakness:** Fails to address the practical boundary problem Marcus raises.  

  2. **Marcus (Jurisdictional Subjection Principle)**  
     - ✓ **Strength:** Exposes the fatal flaw in Elena's position—infinite regress ("proves too much"). His "whose conduct is bound" criterion offers a clear, administrable boundary.  
     - **Weakness:** Concedes his standard might be arbitrary ("could not yet say why subjection... should count").  

  3. **Elena (Coercion Rebuttal)**  
     - ✓ **Strength:** Successfully refutes Marcus's claim that Fenwick isn't coerced. By showing nuisance law actively suppresses Fenwick's remedies, she demonstrates *direct* legal subjugation (not mere spillover effects).  
     - **Weakness:** Overextends "coercion" to cover all legal barriers to redress, risking conceptual dilution.  

  4. **Marcus (Boundary Determinacy Defense)**  
     - ✓ **Strength:** Correctly argues Elena's coercion framing collapses into her original boundless standard. His jurisdictional test remains *procedurally* clearer despite unresolved normative foundations.  
     - **Weakness:** Admits he lacks a moral justification for prioritizing subjection over interests.  

  **Summary of Balance**:  
  - Elena wins on **moral intuition** (Moves 1 & 3), showing Fenwick’s exclusion is unjust.  
  - Marcus wins on **institutional realism** (Moves 2 & 4), exposing the unworkability of "affected interests" alone.  

  **Critical Overlookings by Both**:  
  1. **Hybrid Solutions**: Neither considers mechanisms like:  
     - **Weighted voting**: Fenwick gets partial suffrage (e.g., 30% of votes).  
     - **Intergovernmental vetoes**: Fenwick’s council could block the project.  
     - **Legal standing**: Granting Fenwick residents standing in Rivermouth courts.  

  2. **Scale-Sensitive Democracy**:  
     - **Subsidiarity**: Decisions should occur at the *lowest feasible level* but require upward delegation for spillovers (e.g., regional authority for airports).  
     - **Federalism**: Overlapping demoi (local/state/national) can layer authority for cross-border issues.  

  3. **Non-Electoral Input**:  
     - **Deliberative forums**: Statutory consultation with Fenwick residents without full suffrage.  
     - **Harm principle**: Rights-based limits (e.g., courts voiding referendums causing severe harm to outsiders).  

  4. **Dynamic Boundaries**:  
     - **Flexible demoi**: Creating ad-hoc constituencies for specific decisions (e.g., "airport impact zone" voters).  
     - **Annexation**: Rivermouth absorbing Fenwick to align jurisdiction with impact—a real-world response to spillovers.  

  5. **Moral Trade-offs**:  
     - **Feasibility vs. Legitimacy**: Marcus prioritizes clear boundaries; Elena prioritizes moral inclusion. No perfect solution exists—democracy requires balancing these.  
     - **Epistemic Limits**: "Affectedness" is often unknowable ex ante (e.g., long-term pollution effects), making Elena's standard unadministrable.  

  **Conclusion**:  
  The debate reveals a core tension in democratic theory: **inclusion** (Elena) vs. **feasibility** (Marcus). Neither principle alone suffices. Legitimate boundaries require:  
  - **Procedural fairness**: Mechanisms for outsider voice (e.g., mandated consultations).  
  - **Scaled governance**: Higher-level oversight for cross-border externalities.  
  - **Rights safeguards**: Constitutional protections against disproportionate harm.  
  Rivermouth’s referendum is democratically deficient *precisely* because it ignores Fenwick’s coercion—but fixing this requires institutional innovation, not just philosophical purity.
