  ### Dialogue: The Ellsberg Urn Argument

  **Setting:** A dimly lit game room. An opaque urn sits on a table, labeled: "90 balls total. 30 red. 60 black or yellow (unknown ratio)." Two characters stand before it—**Bayes** (sharp, impatient, Savagian) and **Averse** (calm, deliberate, ambiguity-averse). Bets pay $100 if the drawn ball matches the chosen color(s).

  ---

  **Bayes:** *(Leaning against the table, arms crossed)*  
  Still insisting you’d bet on *red* over *black*, but *black-or-yellow* over *red-or-yellow*? Even though the math screams contradiction?  

  **Averse:** *(Gently tapping the urn)*  
  No contradiction. Betting on *red* gives me a known 1-in-3 shot. Betting on *black*? Could be 59-to-1 against me, or 1-in-90. I’m not playing dice with ignorance.  

  **Bayes:** *(Scoffs)*  
  But your second bet flips the script! *Black-or-yellow* is just "not red" (66.6% odds), and *red-or-yellow* is "not black" (also 66.6% *in expectation*). Yet you prefer the first. Savage’s axioms demand consistency—you’re torching the sure-thing principle.  

  **Averse:**  
  The sure-thing principle assumes known probabilities. Here, *red-or-yellow* could be as bad as 33% (*if* all non-blacks are yellow). *Black-or-yellow* is *exactly* 66.6%—no ambiguity. I minimize regret against worst-case scenarios.  

  **Bayes:** *(Leaning in, intense)*  
  And *that’s* why you’d get money-pumped. Raiffa’s Dutch book trap:  
  - *Stage 1:* You pay me a penny to choose "bet on *red*" over "bet on *black*" (since you prefer it).  
  - *Stage 2:* I offer to swap your *red* bet for *black-or-yellow*—you pay another penny because you prefer it to *red-or-yellow*.  
  But now you hold *black-or-yellow*... which is identical to *not red*! You paid *twice* to end up back where you started!  

  **Averse:** *(Smiling faintly)*  
  Clever, but flawed. Your pump assumes I’d make those trades *in isolation*. In reality, I see the whole sequence. If you offer me *red* now, I already know *black-or-yellow* dominates it later—so I jump straight to *black-or-yellow* and ignore your penny ante.  

  **Bayes:**  
  Dynamic inconsistency won’t save you. If I hide the future swap, you’d take the bait!  

  **Averse:**  
  Only if I’m myopic. Maxmin EU isn’t about naive myopia—it’s *robust control*. I’d model you as an adversary *exploiting* my ambiguity aversion. So I pre-commit: "Bet on *black-or-yellow*" upfront, cutting your pump off at the knees.  

  **Bayes:** *(Pauses, frowning)*  
  Pre-commitment? Fine. But your core preferences still violate rational choice. Probabilities *exist*, even if unknown. You should assign a subjective prior—say, uniform over black/yellow splits—and maximize expected utility.  

  **Averse:** *(Eyes on the urn)*  
  "Should"? Why? When probabilities are indeterminate, clinging to a single prior is *more* irrational. Your uniform prior assumes symmetry *without evidence*. I reject invented precision. *(Turns to Bayes)* Your axioms work for risk. This is *uncertainty*. They’re different animals.  

  **Bayes:**  
  Different? Or just an excuse to duck probabilistic reasoning?  

  **Averse:**  
