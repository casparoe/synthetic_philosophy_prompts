prompt: |-
  Over the course of a long career in experimental physics I made heavy use of Bayesian inference without ever worrying much about its philosophical justification, so retirement has finally given me time to look into the foundations properly. The Dutch book argument for probabilism strikes me as a wonderfully clean piece of reasoning: any credence function that violates the probability axioms exposes its holder to a combination of bets, each fair by their own lights, that guarantees a loss whatever happens. I gather the very same argument, simply run across time rather than at an instant, is what forces a rational agent to update solely by conditionalizing on new evidence, since anyone who plans to revise their credences in any other way can likewise be confronted with a book of bets that guarantees a loss no matter what occurs. Given that both requirements rest on the same underlying coherence argument, why do so many Bayesian epistemologists still treat conditionalization as a substantive, independently debatable extra assumption rather than as a straightforward corollary of probabilism itself?
reasoning: |-
  Okay, the user is a retired experimental physicist who's delving into the foundations of Bayesian inference. They've grasped the Dutch book argument for probabilism and its extension to conditionalization via diachronic Dutch books. Their main question is why conditionalization isn't treated as a straightforward corollary of probabilism, given both rely on coherence arguments.

  First, I need to recall the key points of the Dutch book theorems. Synchronic Dutch books enforce probabilistic coherence at a single time. Diachronic Dutch books extend this across time, showing that failing to update via conditionalization leads to guaranteed losses. The user sees both as two sides of the same coin, so why the distinction in epistemology?

  Looking at the objections to diachronic Dutch books. One major issue is the synchronic nature of the bets. The bets against non-conditionalizers are set up before any evidence is observed. Critics argue that the agent might change their beliefs when new evidence comes in, so the initial bets aren't fair anymore. This is different from synchronic cases where all bets are simultaneous.

  Then there's the role of evidence. Conditionalization requires treating the learning experience as evidence with probability 1. But real agents might not be certain about the evidence they receive. For example, if someone mishears or misreads, assigning probability 1 to evidence can be problematic. So the diachronic argument assumes perfect learning, which isn't always realistic.

  Another point is the assumption of state-dependent utilities. The argument relies on utilities not changing with the agent's epistemic state. However, if learning new evidence alters how the agent values outcomes, the Dutch book might not hold. This ties into the broader issue of whether rational preferences should be state-dependent or not.

  The diachronic argument also assumes that the agent will stick to their update plan. But if they change their plan upon learning, the initial bets could become unfair. This contrasts with synchronic cases where no time passes, so no change occurs. The commitment to a plan is an additional assumption.

  Also, synchronic Dutch books are about static coherence, while diachronic involves dynamic coherence. Some philosophers argue that dynamic coherence isn't as compelling because it involves future actions and beliefs. This leads to treating conditionalization as an additional norm beyond basic probabilism.

  The user might also be interested in alternative updating methods. For example, Jeffrey conditionalization or probability kinematics, which handle cases where evidence isn't certain. These methods aren't covered by the standard diachronic argument, suggesting its limitations.

  Underlying all this is the debate on what coherence means over time. Synchronic coherence is about avoiding contradiction at a moment, while diachronic is about consistency through change. The latter might require more than just avoiding Dutch books, involving rationality in how beliefs evolve.

  The user's background in experimental physics suggests they value practical applications. They might appreciate knowing that while the diachronic argument is theoretically debated, conditionalization remains a standard tool. Highlighting practical versus foundational perspectives could address their implicit need to reconcile their experience with philosophical scrutiny.

  In summary, the key reasons are objections to synchronic bets over time, the assumption of certain evidence, state-dependent utilities, commitment to plans, and the distinction between static and dynamic coherence. These factors lead epistemologists to treat conditionalization as an additional postulate rather than a direct corollary.
answer: |-
  That's an excellent and profound question that cuts to the heart of foundational debates in Bayesian epistemology. You're absolutely right that the *structure* of the argument – a coherence-based Dutch book vulnerability – is identical for both probabilism (synchronic coherence) and conditionalization (diachronic coherence). Yet, epistemologists treat conditionalization as a distinct and more contentious postulate. Here's a breakdown of the key reasons why:

  1.  **Objections to the Diachronic Dutch Book (DDB) Argument Itself:** While the synchronic Dutch book argument is widely accepted (though not universally), the diachronic version faces specific criticisms that undermine its perceived force as a *direct corollary*:
      *   **The Synchronic Nature of the Bets:** Critics (like Isaac Levi and David Christensen) argue that the bets constituting the DDB are offered and accepted *at the earlier time* (t1), *before* the evidence is learned. The "fairness" of these bets is judged solely by the agent's credences *at t1*. The vulnerability arises because the agent *plans* to adopt non-conditionalizing credences *later* (at t2). The objection is: Why should the *current* (t1) fairness of a bet depend on what credences I *plan* to have at some *future* time (t2), especially when those future credences might be rationally justified *at t2* based on information I don't have yet? The synchronic argument doesn't involve this temporal commitment to future states.
      *   **Changing Standards of Fairness:** If the agent genuinely learns something significant between t1 and t2, their epistemic state has fundamentally changed. A bet that was fair relative to their *ignorant* t1 state might cease to be fair relative to their *informed* t2 state. The DDB argument seems to hold them hostage to the fairness standard of their past, less-informed self, which some argue is unreasonable. The synchronic argument involves no such shift in epistemic context.
      *   **The "Genuine Learning" Assumption:** The DDB argument assumes that the learning experience itself provides no information *beyond* the specific proposition E learned. Critics argue that real learning might involve more complex shifts in perspective or understanding that aren't fully captured by simply setting P(E)=1. If the learning experience provides extra information (e.g., about the reliability of the source), conditionalization might not be sufficient, and the DDB vulnerability might not accurately reflect irrationality.

  2.  **The Problem of "Certain Evidence" (Probability 1):** Conditionalization requires assigning the learned evidence E probability 1. This is deeply problematic for many:
      *   **Fallen Empiricism:** In science and everyday life, we rarely (if ever) become *absolutely certain* of any empirical proposition. Evidence is often ambiguous, senses can be deceived, instruments can malfunction. Requiring P(E)=1 seems unrealistic and potentially dogmatic.
      *   **Misleading Evidence:** It's logically possible (though perhaps unlikely) to receive highly misleading evidence that strongly supports a false proposition. Conditionalization forces the agent to become certain of that false proposition, which seems irrational. The synchronic axioms don't force certainty on any contingent proposition.
      *   **The Need for Jeffrey Conditionalization:** To handle learning experiences where evidence doesn't become certain (e.g., seeing a cloth under dim light, getting a noisy instrument reading), Edwin Jeffrey developed "Jeffrey Conditionalization" (probability kinematics). The standard DDB argument doesn't naturally extend to justify this more general (and arguably more realistic) form of updating, highlighting a limitation of the simple conditionalization argument. This reinforces the sense that conditionalization is a specific, potentially restrictive rule.

  3.  **State-Dependent Utilities (The "Pragmatic" Nature of the Argument):** Dutch book arguments are fundamentally pragmatic – they concern avoiding sure monetary losses. Some epistemologists (e.g., Richard Jeffrey again) argue that rational belief revision should be justified on purely *epistemic* grounds (aiming at truth), not just pragmatic ones. Furthermore, the DDB argument assumes utilities are state-independent (the value of money doesn't change based on what world-state obtains or what you believe). If utilities *are* state-dependent (e.g., money might be worthless if a catastrophe happens), the DDB vulnerability can disappear even for non-conditionalizers, undermining the argument's universality. The synchronic argument is less vulnerable to this critique as it doesn't involve changing states over time.

  4.  **Commitment and Plan-Following:** The DDB argument relies on the agent being *committed* to their announced update plan. If the agent learns E and then *rationally decides* to abandon their pre-planned update rule in light of the *actual experience* of learning E, the DDB might not demonstrate irrationality in their *actual* belief state at t2, only in their *prior plan* or their *commitment* to following plans. This introduces an element of diachronic *practical* rationality (sticking to plans) that isn't present in the synchronic case. Is belief revision governed by prior commitments or by present rationality given current evidence?

  5.  **The Distinction Between Synchronic and Diachronic Coherence:** While structurally similar, many philosophers see a fundamental difference:
      *   **Synchronic Coherence:** Avoids logical contradictions *at a single time*. Violating the probability axioms means your degrees of belief are inconsistent *right now*.
      *   **Diachronic Coherence:** Concerns consistency *across time*. The argument is that violating conditionalization means your *sequence* of belief states is jointly inconsistent *in retrospect*. Critics argue that avoiding *synchronic* inconsistency at *each* time might be the primary requirement; demanding a specific form of diachronic consistency (like conditionalization) might be an *additional* constraint. The DDB vulnerability is seen by some as a consequence of this *additional* diachronic constraint, not *solely* of synchronic probabilism at each time.

  **Why Conditionalization is Still Often Treated as Foundational (Despite the Debate):**

  *   **Elegance and Power:** It provides a simple, precise, and powerful rule for belief updating.
  *   **The Weight of Tradition:** It's deeply embedded in the Bayesian framework and its successes (like your own career!).
  *   **Weaker Justifications:** Arguments like *conservatism* (minimize belief revision) or *maximizing expected epistemic utility* (accuracy) under certain scoring rules provide alternative justifications that avoid the DDB pitfalls.
  *   **Normative Appeal:** Even with its issues, it captures a strong intuition about how learning *should* work: beliefs should change *only* in response to the specific information learned, proportionally to its relevance.

  **In Summary:**

  While the Dutch Book vulnerability links probabilism and conditionalization through coherence, epistemologists treat conditionalization as distinct because:

  1.  The **diachronic Dutch book argument faces unique objections** concerning the synchronicity of bets, changing standards of fairness, and the nature of learning.
  2.  Conditionalization's **requirement of probability 1 for evidence** is seen as unrealistic and problematic, leading to the need for generalizations like Jeffrey Conditionalization which the DDB doesn't justify.
  3.  The **pragmatic nature** of the Dutch Book argument and its **assumption of state-independent utilities** are seen as less compelling justifications for a core epistemic norm than they are for synchronic coherence.
  4.  The argument relies on **commitment to plans**, introducing an element of practical rationality absent from the synchronic case.
  5.  There's a perceived distinction between avoiding **synchronic inconsistency** and enforcing a specific form of **diachronic consistency**.

  Your intuition that they *should* be seen as two sides of the same coin is perfectly understandable given the structural similarity of the arguments. However, the specific challenges of time, changing information, certainty, and the nature of learning lead many to conclude that diachronic coherence via conditionalization is a *substantive additional principle* required for rationality over time, not merely a direct consequence of synchronic probabilism. It remains a core part of the Bayesian framework, but its justification is rightly subjected to deeper scrutiny than the synchronic axioms. Enjoy your deep dive into the foundations – it's a fascinating area!
