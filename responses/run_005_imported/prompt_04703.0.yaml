  *Weighing options:*
  - **Total utilitarianism**: Repugnant Conclusion is brutal, but at least it's simple. Tännsjö's "bite the bullet" stance feels unsatisfying though—Z isn't *better* than A, just bigger. 
  - **Average utilitarianism**: Collapses with small populations. Also implies we should kill unhappy people? Yikes. 
  - **Critical-level**: Blackorby et al.'s fixed positive threshold. But then adding a billion *barely-above-critical* lives might outweigh losing one superb life—that's Repugnant Conclusion in disguise. 
  - **Lexical superiority**: Parfit's "golden" lives idea. My favorite contender, but Arrhenius proved it violates Non-Elitism. Is that the softest spot? 

  *Ah, here's the pivot.* Non-Elitism intuitively fails when comparing Mozart to algae. Sacrificing it allows lexical hierarchies: a world with *any* high-flourishing lives > any number of "mediocre" ones. Yes, it's aristocratic—but if flourishing is lexically superior, it avoids sadism/anti-egalitarian traps. 

  Biggest worry: how to define the threshold? Capabilities approach? But perfectionism is messy... No, defend it as *emergent*: once welfare complexity passes a point (art, morality, etc.), it enters a new category. Still arbitrary? Sure, but less than most alternatives. 

  *Why this over other bullets?* 
  - Repugnant Conclusion undermines value quality—unacceptable. 
  - Sadistic Conclusion (adding suffering to prevent more suffering) is barbaric. 
  - Critical-levels reintroduce repugnance. 
