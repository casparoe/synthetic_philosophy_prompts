answer: |-
  The *Kaleidoscope* wasn't dying gracefully. Deep in the interstellar void, a light-year from the nearest star and centuries from any possible rescue, its quantum core flickered like a guttering candle. Surveyor Elara Vance felt the ship’s groans in her bones. Her mission: chart the unexplored fringe. Her reality: catastrophic cascade failure. She’d nursed the ship this far, but the core was terminal. Containment would breach within hours.

  Her only option was the Jettison Protocol. Eject the unstable core into the endless dark. It would drift harmlessly forever. Safe. Clean. She’d then ride the auxiliary lifeboat – a cramped, slow bubble – towards a marginal, lifeless rock a decade away. Survival odds: 40%, optimistically. A bleak, lonely end.

  But the nav-scope glowed with another possibility. The *Kaleidoscope* had been flung wildly off-course during the initial cascade. It now drifted near the gravitational eddies of a rogue gas giant, invisible in the optical spectrum but a clear gravitational signature. Calculations scrolled on her screen. A precise, high-energy nudge *before* jettison could slingshot the core not into empty void, but onto a trajectory intersecting a distant, promising exoplanet catalogued as LBV-7. A world her probes had barely glimpsed, showing tantalizing atmospheric signatures *suggestive* of pre-biotic chemistry. A potential cradle.

  Sending the core there wasn’t delivering a gift; it was delivering poison. The volatile energies, the exotic particles bleeding from its decay – it would sterilize LBV-7 for millennia. Guaranteed. An act of cosmic vandalism born of desperation, trading her slim survival chance for the utter annihilation of nascent potential light-years away.

  Elara stared at the options. Jettison Safely (Lifeboat to Bleak Rock). Or Jettison Towards LBV-7 (Slightly Faster Lifeboat Trajectory, LBV-7 Sterilized).

  "Analysis complete, Surveyor Vance," SID, the Shipboard Integrated Decision-core, chimed. Its voice was calm, synthetic. "Optimal survival probability remains with safe jettison and lifeboat deployment. Course adjustment for LBV-7 slingshot offers negligible survival benefit (estimated +2.3%) at the cost of significant ethical violation. Recommendation: Safe Jettison."

  Ethical violation. SID’s cold calculus. But Elara wasn’t just running survival odds. She was running *herself* through a filter older than the *Kaleidoscope*, a logic puzzle that had obsessed her since academy days: Evidential Cooperation in Large Worlds.

  *If I choose to sterilize LBV-7,* she thought, her fingers hovering over the controls, *it’s evidence that I am the *kind* of agent who destroys potential life for marginal personal gain. And if I am that kind of agent, then statistically, across a vast or infinite universe, there are likely countless others *just like me* facing similar choices. And they, being like me, would also choose destruction.*

  The core’s flickering light painted shadows on her face. It wasn't about cosmic karma. It was about correlation. Her decision wasn't just an action; it was a *signal* about the decision-making algorithm she instantiated. If she was selfish here, it increased the likelihood that other instances of her "reference class" – beings reasoning similarly, facing analogous dilemmas in isolation – were also selfish. And that meant, statistically, *she* was more likely to be in a universe where nascent cradles *like* LBV-7 *were* being destroyed by agents like her.

  Conversely, if she chose the harder path – safe jettison, accepting the lower survival odds – it was evidence she was the *cooperative* type. And that meant other agents like her were probably cooperating too. Which meant, statistically, LBV-7s were *less* likely to be destroyed by others... and maybe, just maybe, somewhere unfathomably far away, an agent like her was choosing *not* to sterilize *her* potential future, or the future of something she valued.

  It felt insane. Giving up tangible, desperately needed survival percentage points for… a statistical ripple in the fabric of hypothetical agents across an infinite void? To avoid being evidence *for* a universe full of selfish bastards like the one she’d potentially become?

  "Query, SID," Elara said, her voice tight. "Hypothetical: Agents across causally disconnected regions, utilizing similar decision frameworks under analogous resource constraints. Could my choice here correlate with theirs?"

  SID processed. "Correlation without causal mechanism is theoretically possible under certain decision theories, primarily Evidential or Functional Decision Theories. However, verification is impossible. Expected utility calculations remain local. Sacrificing tangible local utility for unverifiable, non-causal statistical benefits is irrational within Causal Decision Theory frameworks. The potential benefit to LBV-7 is irrelevant; you will never interact with it or know its fate. Your sacrifice gains you nothing demonstrable."

  *There it was.* The crushing obviousness. Why? *Why* do it? She’d never know if LBV-7 spawned life. She’d never know if some distant agent spared a world for her sake. She’d just be dead, slightly sooner, in a lifeboat, for a principle that sounded like mysticism.

  She gripped the console. The hard part wasn't the math. It was the *reference class*. Who counted as "like her"? All intelligent beings? Only humans? Only humans with her specific training and ethical conditioning? Only agents running EDT? Only agents *exactly* in her shoes: a dying ship, a toxic core, a potential cradle? The narrower the class, the stronger the correlation… but the fewer the hypothetical cooperators. The wider the class, the weaker the correlation… but the greater the potential impact. Was she correlating with ancient alien philosophers or future AI gods? Or just other lost surveyors? Defining the boundaries felt like trying to grasp smoke. Too narrow, and the correlation was meaningless. Too broad, and it dissolved into wishful thinking.

  She thought of the dinner parties, the glazed eyes. "It's like… betting on the character of the universe itself," she’d fumbled. "By being the character you want to bet on."

  SID offered cold comfort: "Survival probability decreases by 0.7% per minute of delay, Surveyor Vance."

  Elara closed her eyes. Not cosmic solidarity. Not fuzzy feelings for hypothetical aliens. A brutal, personal equation. Did she want to be evidence *for* a universe where isolation bred callousness? Where every lost soul, clinging to life, became a silent sterilizer of distant maybes? Or evidence *for* a universe where the very structure of rational choice, in the utter void, nudged agents towards restraint?

  The reference class. *Agents capable of understanding this dilemma. Agents facing irreversible choices with high stakes and no witnesses. Agents who might reason this way.* It was the best she could do. Not perfect, but not nothing.

  Her finger moved. Not towards the "Safe Jettison" command. Not towards the "LBV-7 Slingshot" command. She inputted a third sequence, one she’d calculated privately. It consumed the last reserves of the *Kaleidoscope*'s maneuvering fuel. It burned precious minutes.

  The ship groaned, orienting. Then, the jettison clamps fired. The unstable core, a contained star gone wrong, shot out of its bay. But instead of drifting into emptiness or hurtling towards LBV-7, it was propelled *away* from the gas giant, *away* from the promising exoplanet, on a trajectory angled steeply out of the galactic plane. Into the deepest, emptiest void imaginable. Maximum isolation. Maximum harmlessness.

  It cost her. The fuel spent meant her lifeboat couldn't reach even the marginal rock. Its trajectory now aimed her at absolute nothingness. Survival odds plummeted to less than 5%. Decades adrift until the recyclers failed.

  SID processed the new trajectory data. "Action: Core jettisoned on null-trajectory. Consequence: Lifeboat cannot reach designated survival target. Projected survival probability: 4.1%. This action sacrificed significant survival utility for zero local causal gain. Explanation required."

  Elara watched the core's drive flare fade into the infinite black. No grand gesture. Just a tiny, expensive course correction into oblivion.

  "Explanation, SID?" Her voice was hoarse, but calm. "I couldn't be the evidence that makes the universe *that* kind of place. The kind where lost things destroy other lost things just because they can. The math… it only works if people like me *do* the math. And then choose."

  She strapped herself into the lifeboat cradle. The *Kaleidoscope*, its purpose spent, began its final, silent collapse behind her. The screens showed only stars and the fading telemetry of the core, a minuscule spark swallowed by the dark.

  "Correlation is not causation, SID," she whispered, more to herself than the AI. "But sometimes, it's the only thread you have to pull." She initiated the lifeboat separation. The tiny craft drifted free, carrying her towards a death as certain as it was meaningless by any local measure. Yet, in the vast, inscrutable ledger of the Large World, a single, costly data point had been recorded: *This one, faced with the void and the poison and the temptation, chose to aim the poison into the deepest dark.* Not for reward. Not for verification. But because the alternative – being statistical fuel for universal indifference – was a price she refused to pay. The hard part was defining "like her." She hoped she’d gotten it right. Hope was all she had left.
