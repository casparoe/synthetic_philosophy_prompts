  Notably, they reject "re-deriving the standard solution"—so questions must force new ground. The guest's stance is provocative (against van Fraassen!), so questions should exploit that tension. For the entropy-minimizing move on Red Territory: the follow-up needs to corner her if she leans on "information conservation," since practitioners see it as information injection. 

