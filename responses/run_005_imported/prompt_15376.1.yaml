prompt: |-
  Random question, but I need a sanity check for a scene in the sci-fi novel I'm drafting. My protagonist works for a lab that can make a perfect physical duplicate of a person -- same body, same memories, everything -- and whether they do it depends on a fair coin flip she never sees. Heads, they duplicate her overnight while she's out cold. Tails, they leave her alone and she's just her, same as always. Either way, she wakes up the next morning with no way to tell from the inside whether shes the original, a copy, or the only one who exists -- if there's two of her, both wake up feeling 100% like "the real one," memories intact right up to when she went under.

  Here's the scene: right after waking, before anyone tells her anything, she has to guess the odds the coin landed heads. My critique partner says it's obviously 50/50 -- fair coin, and waking up itself doesn't tell her anything new. I keep thinking that's wrong, like the mere possibility that there's two of her now instead of one should shift the number, but I can't pin down which way or build a real case for it. Can you actually settle this and walk me through the reasoning tight enough that I could put a version of it in a character's mouth without it sounding like hand-wavy sci-fi nonsense?
reasoning: |-
  Okay, the user is working on a sci-fi novel and has a scene where the protagonist wakes up after a procedure where a coin flip determines if she's duplicated. The question is about the probability she should assign to the coin having landed heads right after waking up. The critique partner says it's 50/50, but the user feels that's off because of the duplication possibility. I need to figure out the correct probability and explain it clearly.

