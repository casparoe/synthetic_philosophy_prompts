prompt: |-
  Been on a bit of a decision theory kick lately after re-reading some of Wei Dai's old posts on UDT and skimming the Arbital page on it, and I think I've finally wrapped my head around it, but I want to sanity check the core idea before I go around repeating it to people. As I understand it, the whole point of "updateless" decision theory is that the agent precommits to just never update on evidence at all -- it acts purely off its prior forever, which is exactly why its willing to pay up in Counterfactual Mugging even after Omega tells it the coin landed tails. Basically the agent hears the bad news, shrugs, goes "nope, sticking with my 50/50 prior," and pays the $100 anyway, treating the actual observation as basically irrelevant noise it's not allowed to react to.

  Me and a couple people from my meetup's decision theory reading group got into an argument about this last week though. One guy insisted a UDT agent would still switch doors in the Monty Hall problem after the host reveals a goat, which confused me, because isnt switching doors literally just Bayesian updating on new information? If UDT agents are allowed to do that kind of updating, I don't get what's actually "updateless" about them, or why UDT gets treated as such a huge departure from EDT/CDT instead of just being CDT/EDT with extra steps and cooler thought experiments attached. Is "updateless" secretly referring to some narrow technical sense that doesn't really mean what it sounds like it means, and if so why does everyone on LW act like this is such a profound, cutting edge idea?
reasoning: |-
  Okay, the user is really diving deep into decision theory, especially UDT. They've been re-reading Wei Dai's posts and the Arbital page. They think they get it but want a sanity check. The core idea they have is that UDT agents never update on evidence, sticking to their prior no matter what. They mention Counterfactual Mugging as an example where the agent pays $100 even after knowing the coin is tails. But then they're confused because their friend says UDT would switch in Monty Hall, which involves updating. That contradiction is bugging them. They wonder if "updateless" is a misnomer or if UDT is just CDT/EDT with extra steps.

  First, I need to address their misunderstanding. They think UDT means never updating on evidence, but that's not accurate. UDT isn't about ignoring evidence; it's about choosing a strategy in advance that considers all possible observations. The agent doesn't update its beliefs in the traditional Bayesian way during the decision. Instead, it precommits to a policy that maps observations to actions based on prior world-models.

  Counterfactual Mugging is a good example. In that scenario, the agent pays because its precommitted strategy includes paying if the coin is tails, as it values the larger reward in the heads counterfactual. The agent isn't ignoring the evidence; it's following a plan made before seeing the outcome.

  Now, Monty Hall. The user is confused because switching doors seems like Bayesian updating. But in UDT, the agent would indeed switch, but not because it updates. Instead, it has a precomputed strategy that, given the host revealing a goat, switches doors. This strategy is based on the prior probabilities of where the car is and the host's behavior. So, UDT uses the evidence (which door was opened) but as part of a fixed policy, not dynamic updating.

  The term "updateless" is tricky. It doesn't mean no evidence is used. It means the agent doesn't dynamically revise its beliefs upon receiving evidence. Instead, all possible observations are part of the initial decision model. The agent selects a strategy that outputs actions for every possible input, maximizing expected utility across all scenarios.

  The user is also questioning why UDT is seen as a big departure from EDT/CDT. UDT handles problems like Counterfactual Mugging and Newcomb's where EDT and CDT fail. It does this by considering logical correlations and counterfactuals more comprehensively. The precommitment aspect allows it to act in ways that seem counterintuitive but yield better outcomes across possible worlds.

  The user's deeper need might be to solidify their understanding of UDT's core mechanics and its distinction from other theories. They might also want to explain this correctly to their reading group, so clarifying the misconception is key. They need to grasp that UDT uses evidence through predefined strategies, not through dynamic belief updates, which resolves the apparent contradiction in Monty Hall.
answer: |-
  Your understanding of UDT's core idea is *almost* right but crucially misinterprets "updatelessness." It's a subtle and often confusing point! Let's break it down:

  1.  **The Misconception:** UDT agents **do not** ignore evidence or treat observations as "irrelevant noise." They absolutely use the evidence they observe.
  2.  **The Core Insight:** UDT agents **precommit to a fixed strategy (a policy) *before* seeing any evidence.** This strategy maps *possible future observations* to actions. The "updateless" part refers to **when the strategy is chosen and what it depends on**:
      *   **Not Updateless in Action:** When an agent *executes* its strategy, it absolutely looks at the observation (e.g., which door Monty opened, the coin flip result) and takes the action dictated by its precomputed policy *for that specific observation*.
      *   **Updateless in Strategy Selection:** The *choice of which policy to adopt* happens once, at the beginning, based *only* on the agent's prior and logical knowledge about the world and its own decision process. **It does *not* dynamically update its beliefs *during* the decision process to choose its action.** The policy is fixed *before* any evidence specific to the current decision problem is observed.

  **Clarifying the Examples:**

  1.  **Counterfactual Mugging (Heads/Tails):**
      *   **Your View (Partially Correct):** The UDT agent *does* pay when told the coin is tails.
      *   **Why it Pays (The Key):** UDT doesn't pay *because* it stubbornly sticks to a 50/50 prior *after* seeing tails. It pays because its *precommitted strategy* says: *"If Omega tells me the coin was tails, I will pay $100. If Omega tells me it was heads, I will not pay (because Omega won't ask)."* It chose this strategy *before* the coin flip, evaluating the expected utility *across both possible futures* (heads and tails). It recognizes that paying $100 in the tails scenario is the "price" for getting $10,000 in the heads counterfactual scenario where it *would have* been asked. The agent *uses* the observation ("tails") to know which branch of its strategy to execute (pay), but the *decision to have that strategy* was made updatelessly.
      *   **Contrast with CDT/EDT:** CDT/EDT *dynamically update* upon hearing "tails." Their model now *only* contains the tails world. They see paying $100 as a pure loss with no counterfactual benefit (since the heads world "didn't happen" from their updated perspective), so they refuse to pay. UDT avoids this myopia by fixing its strategy based on the prior view encompassing all possibilities.

  2.  **Monty Hall Problem:**
      *   **Your Friend is Correct:** A UDT agent **would** switch doors.
      *   **Why it Switches (Using Evidence Within a Fixed Policy):** Before the game starts, the UDT agent computes the optimal strategy. Its prior includes:
          *   The car is equally likely behind any door (1/3 each).
          *   Monty *must* open a door with a goat.
          *   Monty *cannot* open the door the player initially chose.
          *   If the player initially chose the car, Monty can open either goat door equally.
      *   The agent precommits to a strategy like: *"I choose Door 1 initially. If Monty opens Door 2, I switch to Door 3. If Monty opens Door 3, I switch to Door 2."*
      *   **This strategy leverages the evidence (which door Monty opened) *within the fixed policy*.** When Monty opens Door 2, the agent executes the "switch to Door 3" branch of its precomputed plan. It *doesn't* dynamically update its belief about the car's location *at the moment of decision* and then decide to switch. The *decision to switch upon seeing a specific door opened* was made *before* the game started, based on the prior probabilities and the rules.
      *   **"Updateless" in Action Here:** The agent doesn't think "Hmm, Monty opened Door 2, let me recalculate the probabilities... ah, now Door 1 is 1/3 and Door 3 is 2/3, so I switch." Instead, it thinks "Monty opened Door 2. My precomputed optimal policy dictates I switch to Door 3. I do that." The Bayesian update (P(Car|Monty Opens Door 2) = 1/3, P(Car|Monty Opens Door 3) = 2/3) is *implicitly encoded* in the precomputed strategy, but the agent doesn't perform that calculation *on the fly* during the decision. The policy was chosen *because* it yields the highest expected utility (2/3 chance of winning) *across all possible observations* (Monty opening Door 2 or Door 3), calculated *once* under the prior.

  **Why "Updateless" is Profound & Different from CDT/EDT:**

  1.  **Handles Counterfactuals Rigorously:** UDT directly reasons about what *would* happen in branches of reality it doesn't observe (like the heads branch in Mugging). CDT/EDT struggle because they condition only on what they actually see *after* updating.
  2.  **Avoids Self-Defeating Updates:** Problems like Mugging or Newcomb's involve correlations between the agent's decision and the state of the world (often via a predictor). CDT/EDT's dynamic updating severs these correlations *after* the observation, leading to poor decisions. UDT's fixed policy respects these correlations by considering all possibilities simultaneously *before* any observation breaks the symmetry.
  3.  **Formalizes Optimal Precommitment:** UDT provides a rigorous framework for what it means to "precommit optimally" across all possible futures you might find yourself in, considering logical dependencies (like how your action in one branch might affect outcomes in another branch via a predictor's simulation).
  4.  **Logical Uncertainty:** UDT is explicitly designed to handle cases where the uncertainty isn't just about the state of the world, but about logical facts or even the output of its own computations (e.g., "What will I decide to do in this situation?"). This is where the "cooler thought experiments" often come in.

  **In Summary:**

  *   **UDT agents DO use evidence/observations** to select the correct branch of their precomputed strategy.
  *   **"Updateless" means the *strategy itself is chosen once, based solely on the prior*, without any dynamic belief updating *during* the decision process.**
  *   The strategy is a fixed mapping from *possible observations* to actions, chosen to maximize expected utility *across the entire prior probability distribution*.
  *   **Monty Hall:** Switching is part of the optimal *precomputed strategy* that correctly leverages the evidence (which door opened) *as per the plan made under the prior*. It doesn't require dynamic Bayesian updating *at decision time*.
  *   **Counterfactual Mugging:** Paying in the tails branch is part of the optimal *precomputed strategy* chosen because it yields the best outcome *across both heads and tails branches*, respecting the counterfactual link established by Omega.

  The profoundness lies in UDT providing a *unified, rigorous framework* that successfully handles the pathologies of CDT and EDT (like Mugging, Newcomb, Parfit's Hitchhiker, etc.) by decoupling the *selection of the decision rule* from the *observation of evidence specific to the instance*. It's not just "CDT/EDT with extra steps"; it's a fundamentally different approach to linking prior knowledge, possible observations, and counterfactual reasoning into a single optimal policy. The term "updateless" is technically precise (referring to the strategy selection time), but it's understandably confusing if interpreted as "ignores all evidence forever."
