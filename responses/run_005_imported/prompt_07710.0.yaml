answer: |-
  Your dilemma cuts to the heart of democratic theory’s most persistent problem: **the boundary problem** (sometimes called the "constitutive dilemma"). How do we define the *demos*—the "people" entitled to participate—in a decision affecting interconnected communities? Neither jurisdiction-based nor "all affected" approaches are fully satisfying, but a defensible middle path exists. Here’s a principled framework, its strongest objection, and why advisory consultation alone fails.

  ---

  ### **A Defensible Stakeholder Principle: The "Significant and Concentrated Harm" Threshold**
  The core problem with both extremes—rigid jurisdiction vs. boundless inclusion—is that they ignore the *asymmetry of impact* in your case. A better principle:  
  **Decisions should include all parties experiencing significant, concentrated, and non-remote harms that are (a) unavoidable, (b) disproportionately borne relative to beneficiaries, and (c) not merely speculative.**  

  Applied to your dam:  
  - **Downstream counties** experience **significant harm** (economic loss to irrigators, ecological damage to salmon).  
  - Harm is **concentrated** (specific groups reliant on summer flows) and **non-remote** (direct, predictable hydrological impact).  
  - Harm is **disproportionate**: Upstream gains (water security) vs. downstream losses (livelihoods, ecosystems) are inequitably distributed.  
  - **Upstream voters alone are illegitimate deciders** because they bear minimal costs (taxes) while imposing high costs on others.  

  Conversely, excluding a farmer in a distant basin facing negligible flow changes is justified—their harm is remote/diffuse.  

  ---

  ### **Why Advisory Consultation Fails**  
  Environmental review processes like yours often serve as **accountability theater**:  
  1. **No power asymmetry is remedied.** Downstream input is easily ignored if upstream voters prioritize local benefits.  
  2. **Consultation ≠ consent.** Offering comments without veto rights is procedurally inadequate when harms are severe.  
  3. **Epistemic injustice:** Technical reports may "validate" downstream concerns but leave power structures intact.  

  *In your case*, consultation is a fig leaf: it acknowledges harm but denies agency to those harmed.  

  ---

  ### **Strongest Objection: The Slippery Slope of "Significant Harm"**  
  **The objection:** "Significant harm" is inherently subjective. If downstream counties get a vote here, why not include distant cities using the river for recreation? Or future generations affected by ecological loss? This invites endless boundary disputes, paralyzing decisions. Jurisdictional lines, while imperfect, provide clear, enforceable rules.  

  **Reply:** We avoid the slope with **three filters**:  
  1. **Proximity & certainty:** Harm must be physically direct and empirically demonstrable (e.g., reduced flows → salmon mortality).  
  2. **Concentration:** Harm targets identifiable groups (irrigators, Indigenous nations reliant on salmon), not diffuse interests.  
  3. **Alternatives:** Excluded stakeholders must lack less costly ways to mitigate harm (e.g., downstream can’t "vote with their feet").  

  This excludes remote, speculative, or diffuse claims while capturing core injustices like your downstream counties.  

  ---

  ### **A Better Institutional Design**  
  Pure jurisdiction and pure consultation both fail. Instead:  
  1. **Weighted voting:** Downstream counties get formal votes proportional to harm severity (e.g., 30% of decision weight).  
  2. **Compensation veto:** Downstream stakeholders could veto the project unless compensated for verifiable losses.  
  3. **Watershed-scale governance:** Create river-basin authorities with representatives from all affected sub-regions.  

  *In your case*, a watershed council with veto power over flow reductions could balance local control with shared responsibility.  

  ---

  ### **The Literature & Its Limits**  
  This is a classic **democratic boundary problem** (Dahl 1970; Whelan 1983) intersecting with **environmental justice** (Schlosberg 2007). Key references:  
  - **Robert Dahl’s "Democracy and Its Critics"**: Diagnoses the "who decides?" paradox.  
  - **"All Affected Interests" principle** (Goodin 2007): Extends participation to all impacted, but struggles with "ripple effects."  
  - **"Stakeholder Democracy"** (Bäckstrand 2006): Prioritizes concentrated, vulnerable groups over arbitrary borders.  

  Yet your case highlights a gap: most theories neglect *asymmetric cost-bearing*. For that, see:  
  - **Sovereignty vs. Suffering trade-off** (Young 2000): Jurisdictional authority must yield when it exports severe harm.  
  - **"River Democracy"** (O’Donnell 2021): Treats watersheds as integrated political-ecological units.  

  ---

  ### **Conclusion**  
  The upstream county’s exclusive control is democratically indefensible: it allows a group bearing minor costs to impose existential harms on others. "Significant and concentrated harm" provides a workable threshold for inclusion, avoiding both jurisdictional rigidity and infinite regress. Advisory consultation alone is insufficient—meaningful power-sharing (e.g., veto rights, compensation) is needed when harms are severe.  

  **Strongest unresolved tension:** Even with weighted voting, downstream interests may still be outvoted by upstream majorities. This reflects democracy’s deepest flaw: it struggles to protect minorities from majority-imposed costs. Your dam conflict isn’t just about water—it’s about whether democracy can survive its own boundaries.
