  ## Eulogy for My Father: Holding the Many Sides

  [Standing at the podium, look out at the gathering]

  Good morning. Thank you, everyone, for being here to honour my father. To see so many faces – those who knew him for decades in these very halls, sharing chai after children's class, and those who knew him in other parts of his life, perhaps through work or family gatherings – it means more than I can say. It reflects the many sides of the man we’re remembering today.

  My father spent thirty years right here, teaching the children’s class. For many of you seated here, he was your first guide into Jainism, your introduction to concepts like ahimsa, aparigraha, and especially… **anekantavada**.

  For those hearing that word for the first time this week, anekantavada was his passion. It wasn’t just a philosophy he taught; it was the lens through which he tried to see the world. Simply put, it means "non-one-sidedness." It’s the profound idea that reality – truth itself – is complex, multifaceted. Like a brilliant diamond, it has many faces. To understand it fully, or even adequately, we need to consider *which* face we’re looking at, *from which angle* we’re viewing it. A claim might be true from one perspective, incomplete from another, and perhaps even false from a third. The classic story of the blind men and the elephant – each describing the animal based solely on the part they touched (trunk, leg, tail) – that was his go-to illustration. None were entirely *wrong*, but none grasped the *whole* truth.

  **But – and this is crucial, and he would be leaning forward right now to make sure you heard this "but" – he had absolutely no patience for anyone who flattened this profound concept into a lazy, "Well, nothing is really true then, it's all just your opinion, who's to say?"**

  He saw that as a betrayal of anekantavada. He’d get that familiar look – eyebrows raised, a slight shake of the head – and say, "*That* is itself a flat, one-sided view! It’s dressing up indifference as wisdom." For him, "It depends" wasn't the end of the conversation; it was the *start*. It was an invitation to dig deeper, to ask, "*On what* does it depend? *Which* perspective? *What* are the conditions?" He believed passionately that truth *exists*, but accessing it requires intellectual humility, genuine curiosity, and the hard work of seeking out different angles. He taught us that understanding multiple viewpoints didn't mean abandoning conviction; it meant grounding that conviction in a deeper, more nuanced reality. He demanded *rigour* in our thinking, even – perhaps especially – about complexity.

  And demanding? Oh yes. Stubborn? Absolutely. [*Smile slightly, acknowledging the knowing nods from the temple crowd*] If he believed he was seeing a facet of truth clearly, especially concerning principles like anekantavada or ahimsa, he could dig his heels in with impressive tenacity. He could be slower to admit fault in himself than he was to point out a flawed argument in someone else’s reasoning. He wasn't always the easiest man in a disagreement. To pretend otherwise, to smooth over that particular edge just because this is a eulogy… well, he wouldn’t thank me for it. It wouldn’t be honest. And honesty, seeing things as they *are*, from as many sides as possible, was central to who he was.

  That stubbornness wasn't born of arrogance, I think, but of a fierce integrity to the principles he held dear. He believed so deeply in the *process* anekantavada demands – the careful consideration, the rejection of easy absolutes *and* lazy relativism – that deviating from it felt like a betrayal of truth itself. He held himself, sometimes frustratingly, to that same standard. He expected us to engage, to challenge, to refine our understanding, just as he tried, sometimes imperfectly, to do himself.

  So how do we remember such a man? A teacher who poured his heart into explaining the many-sidedness of truth to generations of children? A father who passionately debated philosophy at the kitchen table? A sometimes-stubborn friend and colleague?

  We remember him by embracing the complexity he championed. We remember him not with a single, flat image, but with a multifaceted appreciation:
  *   The **teacher** who patiently explained the elephant parable for the hundredth time.
  *   The **thinker** who wrestled with nuance and rejected simplistic answers.
  *   The **stubborn advocate** for intellectual rigour, even when it was inconvenient.
  *   The **man** who loved his family deeply, who found joy in simple things, and who believed utterly in the power of seeing more clearly.

  For those who sat in his classes: I see you. I know you’ll hold his teachings close. Honour him by continuing to ask, "*From which angle? On what does it depend?*" Keep the argument going – the beautiful, necessary argument for deeper understanding.

  For those meeting his philosophy for the first time: Please don’t be intimidated by the word "anekantavada." At its heart, it was his way of saying: The world is richer, deeper, and more interconnected than any one view can capture. Be curious. Listen. Consider the other facets. And know that his passion for this idea came from a profound respect for truth and a deep care for how we understand each other and our world.

  He wasn’t perfect. He could be frustratingly sure he was right. But his insistence that reality *demands* we look beyond our first, simple impression? That was a gift. It was his life’s work. It was his truth, seen from the angle of a dedicated teacher, a loving father, and a man striving, in his own complex way, to see the whole elephant.

  Thank you, Dad, for the challenge, the passion, the complexity, and the unwavering belief that truth, though multifaceted, is worth the relentless pursuit. We will miss your voice in the conversation, but we carry the questions you taught us to ask.

  May his journey be peaceful. **Namo Arihantanam.**

  [Pause, then step back]
