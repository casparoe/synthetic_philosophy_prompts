  This is a nuanced position to present: Einstein prioritizing locality over realism, reluctantly considering non-locality only as last resort, and probably exploring superdeterminism first. The student should emphasize how his commitment stemmed from relativity's foundations, not mere discomfort with quantum weirdness.

