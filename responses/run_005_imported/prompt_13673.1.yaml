prompt: |-
  I'm finishing up a piece on the simulation hypothesis stuff -- Bostrom, the tech-bro "we're almost certainly in a simulation" crowd, all that -- and for background I called up a philosopher friend-of-a-friend who works on epistemology. He told me the whole debate is kind of old news philosophically, because Hilary Putnam already solved it in the 80s with his brain-in-a-vat argument: the idea that if you were actually a brain in a vat, the word "vat" in your head wouldn't refer to real vats (no causal connection to them), so the sentence "I am a brain in a vat" comes out false or meaningless every time anyone thinks it. He said this means Bostrom's simulation argument is basically BIV skepticism with better production values, and that its already been refuted by pure semantics decades before Bostrom was even writing.

  That felt almost too clean to me, like there was a card trick somewhere, but I don't know enough philosophy of language to say where it's hidden. Is my source basically right that Putnam's argument disposes of simulation-style skepticism in general, or is there something about how the two arguments are actually structured -- or about what a simulated life would look like from the inside -- that keeps them from lining up as neatly as he's suggesting? Trying to get a paragraph on this right rather than just taking one guy's word for it.
