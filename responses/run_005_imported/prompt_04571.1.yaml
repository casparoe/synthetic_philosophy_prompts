answer: |-
  Your close reading has identified a genuine conceptual seam in Descartes's argument—one that modern translations often obscure by polishing the prose. The leap from the beast-machine doctrine to human soul immortality isn't a straightforward logical entailment, but rather a *systematic inference* relying on unstated Cartesian premises. Let's reconstruct the strongest possible version of his intended argument:

  ### Core Logical Structure (with Implicit Premises)
  1. **Behavioral Asymmetry Premise** (Explicit):  
     Animals exhibit domain-specific competence (e.g., instinctual precision) but lack versatility and language. Humans exhibit universal rationality.  
     → *Inference*: Animal behavior is fully explicable by mechanical "disposition of organs" (body alone), while human rationality requires an immaterial principle.  

  2. **Causal Exclusion Premise** (Implicit, from Cartesian metaphysics):  
     If a phenomenon (e.g., animal behavior) can be fully explained by mechanical physics (extended substance), no additional causal principle (e.g., thought) is warranted.  
     → *Applied*: Since animals need no soul to explain their actions, they *have no soul*.  

  3. **Human Exceptionalism Premise** (Explicit/Implicit):  
     Human thought (doubt, universal language, error-correction) *cannot* be explained mechanically (per Meditations IV–V).  
     → *Inference*: Human thought requires an immaterial substance (mind/soul).  

  4. **Substantial Independence Premise** (Implicit, from substance dualism):  
     Immaterial substance (res cogitans) is ontologically independent of material substance (res extensa).  
     → *Applied*: The human soul's essence (thought) has no dependence on the body.  

  5. **Indivisibility Corollary** (Implicit, from Meditations VI):  
     The soul is a simple, indivisible substance, whereas bodies are divisible and corruptible.  
     → *Inference*: The soul cannot perish through dissolution (as bodies do).  

  6. **Negative Condition for Destruction** (Explicit in passage):  
     "When we see no other cause which destroys it [the soul]" → Without a positive cause of destruction, the soul persists.  

  **∴ Conclusion**: The soul is immortal.  

  ### Why the Beast-Machine Doctrine is Crucial Here
  Descartes isn't making a direct deduction ("no animal thought → human immortality"). Instead, denying thought to animals *removes a rival explanatory model* for human cognition:  
  - If animals *had* souls, their behaviors might suggest that *all* cognition (human included) emerges from complex bodily organization.  
  - By proving animals are *pure machines*, Descartes eliminates this materialist threat. Human thought alone appears as an *anomaly* requiring an immaterial cause.  

  This clears the ground for inferring the soul's independence (Step 4) and thus its immortality (Steps 5–6). The clock metaphor isn't incidental: it reinforces that *all* bodily processes (human or animal) are mechanical—so if humans exhibit non-mechanical thought, its source *must* transcend the body.

  ### The Weak Links (Where Rhetoric Supplants Logic)
  1. **The Gap in Step 6**:  
     Even if the soul is immaterial/indivisible, Descartes hasn't proven it *must* persist eternally. He relies on a negative condition ("no cause of destruction") and a probabilistic appeal ("naturally thence moved to judge"). This echoes his cautious phrasing in the *Synopsis* of the *Meditations*, where he states immortality *follows* from mind-body distinctness but requires faith for full certainty.  

  2. **Pastoral Amplification**:  
     Descartes explicitly ties this to moral stakes: if souls are material (like "flies or ants"), virtue loses its eschatological foundation. The emotional weight ("feeble minds estranged from virtue") leverages the beast-machine argument as a *moral safeguard*. This isn't logic—it's a *rhetorical reinforcement* of the metaphysical conclusion.

  ### Recommendation for Your Chapter
  - **Frame it as a Dialectical Move**: Descartes uses the beast-machine thesis to *dissolve materialism* (by showing cognition isn't an emergent property of complex bodies), thereby isolating human thought as uniquely requiring dualism.  
  - **Cite Parallel Texts**: Strengthen your reading with:  
    - *Meditations VI* (AT VII 85–86): Indivisibility argument.  
    - *Letter to More, 5 Feb 1649* (AT V 278–79): "The principal reason for denying thought to animals is to block the path to those who... say the human soul is corporeal."  
  - **Note the Translation Nuance**: The 1649 version's "comprehend much better" (vs. modern "understand better") retains the Latin *comprehendere*—implying an *intuitive grasp* of the inference, not strict deduction.  

  **In essence**: The argument isn't invalid but *enthymematic*. Its persuasive power lies in systematically eliminating alternatives (materialism) to make soul-body independence—and thus immortality—the only viable option. The "seam" you detected is where Descartes shifts from empirical behaviorism to metaphysical necessity, using the beast-machine as a linchpin. Your instinct to question the logical jump is sound—it reveals Descartes blending metaphysics, empirical observation, and moral theology to fortify his dualism.
