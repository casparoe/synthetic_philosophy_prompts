  The user points out the pastoral angle. Descartes mentions that believing animals have souls like ours leads to thinking there's no afterlife, which deters virtue. So he might be emphasizing the ethical implications. But the user wants to know if there's a logical link. Perhaps Descartes is combining the argument from uniqueness (only humans have thought, so it's special) with the indivisibility argument. If thought isn't physical, and physical things break down, then thought doesn't. But again, that's not full immortality; it could still cease to exist.

  Looking at secondary sources, like Cottingham, he notes Descartes avoids claiming strict demonstration of immortality. So maybe here, Descartes is being rhetorical, using the animal-machine point to make the soul's independence more plausible, then suggesting immortality as a natural inference, even if not logically rigorous. The user's translation's "clumsiness" might preserve this ambiguity where modern versions smooth it over.

  Another angle: Descartes' method of doubt. Since animals don't have language, they lack true thought. Human thought, being linguistic, is immaterial. If thought is immaterial, and matter is extended, then thought isn't subject to physical laws of decay. But again, immortality requires an additional step—God's guarantee that the soul persists. So perhaps Descartes is weaving logical arguments with persuasive elements to guide readers toward accepting immortality, bolstered by faith.

