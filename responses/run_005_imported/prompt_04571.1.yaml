  The key might be in how Descartes links the absence of thought in animals to the necessity of a separate human soul. If animals show complex behaviors without a soul, then human thought can't be mechanical. But that doesn't directly prove immortality. The user mentions a possible premise from elsewhere. Maybe Descartes assumes that if thought were material, animals would have it. Since they don't, human thought must be immaterial, hence separable. But that still doesn't get to immortality.

