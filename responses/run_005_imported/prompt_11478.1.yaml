prompt: |-
  In accuracy-first epistemology, probabilism is typically justified by an accuracy-dominance argument: when accuracy is measured using the Brier score, every credence function that violates the axioms of probability turns out to be less accurate, in every possible world, than some probabilistic credence function. Since this is supposed to be a fact about distance from the truth, shouldn't the same domination result go through if we instead measured inaccuracy using the more intuitive absolute difference between a credence and the proposition's truth value, given that both scores seem to be just different ways of capturing how far a credence is from the truth?
reasoning: |-
  Okay, the user is asking about accuracy-first epistemology and why probabilism is justified using the Brier score but not with absolute difference. They're wondering why the domination result doesn't hold for absolute difference when both are supposed to measure distance from truth.

  First, I need to recall what accuracy-dominance arguments are. They show that non-probabilistic credences are accuracy-dominated by probabilistic ones. The Brier score, which is squared error, works for this, but absolute difference doesn't. The user's confusion is why both methods, which seem to measure inaccuracy, don't yield the same result.

  The key difference is strict propriety. The Brier score is strictly proper, meaning each credence expects itself to be more accurate than any other. Absolute difference isn't strictly proper. For example, if the truth value is 0 or 1, the expected inaccuracy with absolute difference might make a credence like 0.5 think another value, say 0 or 1, is better. That breaks the uniqueness needed for domination.

  I should explain convexity too. Brier score's squared term makes it convex, so mixtures of credences have higher inaccuracy. Absolute difference is linear, so averaging doesn't necessarily increase inaccuracy. That's why in the absolute difference case, a non-probabilistic credence might not be dominated by any probabilistic one. The example with two propositions and the credence (1,1) not being dominated by any probability function is crucial here.

  The user might be missing the mathematical properties that make the Brier score suitable for dominance arguments. They might think any reasonable distance measure should work, but it's the specific properties like strict propriety and convexity that enable the dominance result. Clarifying these concepts with examples would help. Also, addressing why absolute difference, despite being intuitive, fails in this epistemological framework. Maybe the user is trying to reconcile intuitive measures with formal results, so pointing out the trade-offs between intuition and mathematical necessity is important.
answer: |-
  That's an excellent and insightful question that cuts to the heart of accuracy-based arguments for probabilism. You're right to think that if both the Brier score (squared error) and absolute difference measure "distance from truth," the dominance result *should* hold for both. However, the dominance result **fails** for absolute difference, and understanding *why* reveals crucial aspects of accuracy-first epistemology and propriety.

  Here's a breakdown:

  1.  **The Core Problem:** Absolute difference (also called "linear inaccuracy" or L1 loss) is **not strictly proper**. This is the fundamental reason the dominance argument fails.

  2.  **What is Strict Propriety?**
      *   A scoring rule (like Brier or Absolute Difference) is **strictly proper** if, for any probability function P, the *expected inaccuracy* of P, calculated according to P itself, is *uniquely minimized* when the credence function being evaluated is also P.
      *   In simpler terms: If you *believe* the world is governed by probability P, then according to your own beliefs P, the credence function that looks best (minimizes expected inaccuracy) is P itself. No other credence function looks better to you *from your own perspective*.

  3.  **Brier Score vs. Absolute Difference:**
      *   **Brier Score (Squared Error):** Is **strictly proper**. This property is *essential* for the accuracy-dominance argument to work. It guarantees that for *any* non-probabilistic credence function, there exists a *specific* probabilistic credence function that dominates it (is more accurate in every possible world). The proof crucially relies on this propriety and the convexity it implies.
      *   **Absolute Difference (Linear Inaccuracy):** Is **not strictly proper**. Here's the critical flaw:

  4.  **Why Absolute Difference Fails: An Example**
      Consider a single proposition A. The inaccuracy of a credence c(A) is:
      *   |1 - c(A)| if A is true.
      *   |0 - c(A)| = |c(A)| if A is false.
      Now, imagine an agent whose *own* belief is P(A) = 0.5. What credence minimizes their *expected* inaccuracy according to *their own belief*?
      *   Expected Inaccuracy if they adopt credence `x`:
          `E[I(x)] = P(A) * |1 - x| + P(¬A) * |0 - x| = 0.5 * |1 - x| + 0.5 * |x|`
      *   Let's calculate this for different `x`:
          *   `x = 0.5`: `E[I] = 0.5*|0.5| + 0.5*|0.5| = 0.5*0.5 + 0.5*0.5 = 0.25 + 0.25 = 0.5`
          *   `x = 0`: `E[I] = 0.5*|1-0| + 0.5*|0| = 0.5*1 + 0.5*0 = 0.5`
          *   `x = 1`: `E[I] = 0.5*|1-1| + 0.5*|1| = 0.5*0 + 0.5*1 = 0.5`
          *   `x = 0.6`: `E[I] = 0.5*|0.4| + 0.5*|0.6| = 0.5*0.4 + 0.5*0.6 = 0.2 + 0.3 = 0.5`
      *   **Result:** *Any* credence `x` between 0 and 1 minimizes expected inaccuracy for an agent with P(A)=0.5! Credences of 0, 0.5, 1, 0.6, 0.999 all look equally good *in expectation* to this agent. There is no *unique* best credence from their perspective.

  5.  **Consequence for Dominance:**
      This lack of strict propriety directly sabotages the dominance argument. The proof for the Brier score relies on showing that a non-probabilistic credence function is accuracy-dominated by its "best probabilistic approximation" (often found via convex hull arguments). Because the Brier score is strictly proper and convex, this approximation genuinely dominates the original.
      *   With absolute difference, a non-probabilistic credence function **is not necessarily dominated by *any* probabilistic function.** Here's a classic example:
          *   **Propositions:** Consider two *logically independent* propositions, A and B.
          *   **Non-Probabilistic Credence:** Assign `c(A) = 1.0`, `c(B) = 1.0`, `c(A ∧ B) = 0`. This violates probability axioms (conjunction for two events each with prob 1 must be 1).
          *   **Possible Worlds:** There are 4 possible worlds: w1 (A true, B true), w2 (A true, B false), w3 (A false, B true), w4 (A false, B false).
          *   **Inaccuracy Calculation (Absolute Difference):**
              *   w1 (TT): `I = |1-1| + |1-1| + |1-0| = 0 + 0 + 1 = 1` (A true, B true, A∧B true)
              *   w2 (TF): `I = |1-1| + |1-0| + |0-0| = 0 + 1 + 0 = 1` (A true, B false, A∧B false)
              *   w3 (FT): `I = |1-0| + |1-1| + |0-0| = 1 + 0 + 0 = 1` (A false, B true, A∧B false)
              *   w4 (FF): `I = |1-0| + |1-0| + |0-0| = 1 + 1 + 0 = 2` (A false, B false, A∧B false)
          *   **Is there a Probabilistic Dominator?** Suppose there is some probabilistic credence function P that dominates `c`. This means P must be *at least as accurate* as `c` in *every* world and *strictly more accurate* in at least one world.
              *   Look at w2 and w3: `c` has inaccuracy 1. For P to be at least as accurate, P must have inaccuracy ≤ 1 in w2 and w3.
              *   In w2 (A true, B false): `I_P = |P(A)-1| + |P(B)-0| + |P(A∧B)-0|`. Since B is false, A∧B must be false. For this to be ≤ 1, and given P is probabilistic (0 ≤ P ≤ 1), the only way is if `P(A) = 1`, `P(B) = 0`, `P(A∧B) = 0`.
              *   In w3 (A false, B true): Similarly, `I_P = |P(A)-0| + |P(B)-1| + |P(A∧B)-0| ≤ 1` implies `P(A) = 0`, `P(B) = 1`, `P(A∧B) = 0`.
          *   **Contradiction:** We've deduced that for P to dominate `c`, it must simultaneously be `P(A)=1, P(B)=0` (from w2) and `P(A)=0, P(B)=1` (from w3). This is impossible. Therefore, **no probabilistic credence function dominates this non-probabilistic `c` when inaccuracy is measured by absolute difference.**

  6.  **The Intuition Gap: Why "Distance from Truth" Isn't Enough:**
      You correctly identify the core intuition: both scores measure "distance from truth." The key difference lies in **how they aggregate distances across different propositions and how they treat intermediate credences**:
      *   **Squared Error (Brier):** Strongly penalizes *large* errors more than small ones (convex). Favors "hedging" and averaging. Directly linked to convexity and propriety.
      *   **Absolute Difference:** Penalizes errors linearly. Doesn't penalize extreme errors disproportionately more than small ones. Is indifferent to "hedging" – an average of two credence functions isn't necessarily less inaccurate than the average of their inaccuracies.

  **Conclusion:**

  Your intuition that both scores capture "distance from truth" is correct. However, the accuracy-dominance argument for probabilism requires more than just *a* measure of distance. It critically depends on the measure having the property of **strict propriety** (and the associated convexity). The Brier score has this property, guaranteeing that non-probabilistic credences are accuracy-dominated. Absolute difference lacks strict propriety, allowing non-probabilistic credences to exist that are **not** accuracy-dominated by *any* probabilistic credence function. This is why the dominance argument, central to justifying probabilism in accuracy-first epistemology, fails for absolute difference, despite its intuitive appeal as a distance measure. The choice of scoring rule is not arbitrary; strict propriety is seen as a fundamental requirement for a measure of accuracy to underpin rational norms like probabilism and conditionalization.
