answer: |-
  You've hit on one of the deepest tensions in political philosophy: **individual liberty vs. community values when no clear harm exists.** Your sister's argument echoes communitarian thinkers (like Michael Sandel), while your view aligns with liberal individualism (like John Stuart Mill). Both perspectives have merit, but let's dissect them:

  ### 1. **The "Community Glue" Argument (Your Sister's View):**
     - **The Core Idea:** Communities *do* rely on shared norms for social trust and cohesion. If norms shift too rapidly without consensus, it can create friction, distrust, or a sense of cultural loss.
     - **The Risk:** Permitting *all* "private and consensual" acts *could* (in theory) erode shared values that bind people—e.g., norms around family, property, or public behavior.
     - **The Flaw:** This argument conflates **harm** with **discomfort**. A community banning something solely because it "offends tradition" or "makes us uneasy" is using state power to enforce conformity, not prevent injury. Historically, this justified bans on interracial marriage, homosexuality, or even non-Christian worship.

  ### 2. **The "No Harm, No Foul" Argument (Your View):**
     - **The Core Idea:** If an action is consensual, private, and harms no one (including neighbors, property values, or public resources), the state has no business regulating it. This is the bedrock of liberal democracy.
     - **The Risk:** *Could* this lead to social fragmentation? Possibly—but only if "shared values" are so fragile they can’t tolerate peaceful diversity.
     - **The Strength:** It draws a **principled line** between:
       - **Actual Harm:** (e.g., noise pollution, sanitation hazards, exploitation).
       - **Moral Discomfort:** (e.g., "I don’t like their lifestyle").

  ### 3. **Can We Separate "Harm" from "Offense"?**
     **Yes—and we must.** Here’s a practical test:
     - **Harm:** Requires evidence of tangible damage (e.g., "Their house parties violate noise ordinances," "Parking congestion blocks emergency vehicles").
     - **Offense:** Subjective disapproval without material impact (e.g., "Their relationship undermines traditional marriage").

     In your case, **no harm exists.** The council’s actions are pure "moral entrepreneurship": reviving a dead law to punish a lifestyle they dislike. That’s not preserving "community character"—it’s discrimination disguised as tradition.

  ### 4. **The Hypocrisy & Danger:**
     - **Selective Enforcement:** If the law wasn’t enforced against college roommates or elderly cohabiting friends, targeting this group is blatantly discriminatory.
     - **Slippery Slope:** If "community character" justifies overriding consent, what’s next? Banning interfaith couples? Single-parent homes? Non-traditional architecture?
     - **Real Social Glue:** Trust isn’t built by forcing conformity. It’s built by **reciprocal tolerance**: *"I respect your choices if they don’t hurt me, and you respect mine."*

  ### 5. **A Principled Path Forward:**
     - **Repeal the Law:** Outdated "anti-cohabitation" laws exist in many places and are increasingly struck down as unconstitutional or unenforceable.
     - **Focus on Actual Harms:** Zoning laws *should* address verifiable issues (safety, density, infrastructure)—not moral judgments.
     - **Define "Family" Broadly:** Modern zoning often uses functional definitions (e.g., "any group functioning as a single household unit") rather than biological/legal ties.

  ### The Bottom Line:
  Your sister isn’t wrong that communities need shared values—but those values must include **pluralism** and **live-and-let-live**. A town that weaponizes zoning laws to exile peaceful residents based on personal discomfort isn’t protecting "social glue"; it’s fraying it by choosing exclusion over inclusion. 

  **This isn’t about preserving community—it’s about policing morality.** And history shows that when "zero-victim crimes" are enforced, the real victim is always human dignity. Stand your ground: no harm, no foul.
