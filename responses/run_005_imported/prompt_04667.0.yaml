  First, I need to break down the key point: observable events are coincidences, like two particles meeting. The hole argument creates two solutions via diffeomorphism. But in the dragged solution, the physical events (coincidences) are just relabeled. So the meeting of particles happens at different coordinate points in each solution, but the event itself is the same.

  The user's confusion is that the solutions disagree at a coordinate point. But Einstein's point is that coordinates are labels, not physical. What matters is whether the same physical events occur. Since the diffeomorphism shifts the points, the two solutions describe the same physical reality, just with different labels. So there's no indeterminism because there's only one physical outcome.

