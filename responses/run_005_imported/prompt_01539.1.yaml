  Looking at reason 1: the entanglement argument. If harmful and beneficial applications are fundamentally intertwined, like two sides of a coin, then trying to develop one while suppressing the other might be impossible. For example, in AI, the same foundational research could lead to both medical breakthroughs and autonomous weapons. Von Neumann might argue that you can't advance the good without also advancing the bad. So this reason could indeed apply to DTD, making his pessimism more defensible.

  Reason 2 is about enforcement. A global ban needs a world government, which doesn't exist. But selective steering might be feasible without such heavy machinery. For instance, national policies or industry norms could promote some tech paths over others. Von Neumann doesn't address this middle ground, so here the gap seems real. His focus is on all-or-nothing solutions.

  Reason 3, the industrial ethos, is cultural. The drive for progress might resist any constraints, not just total bans. If society values innovation without limits, even targeted delays could face pushback. This might undermine DTD efforts, supporting his fatalism.

  The user also asks if the inference "can't ban all, therefore can still steer selectively" holds up. I see risks here. Steering requires reliable distinctions between "good" and "bad" tech, but boundaries can blur. Also, coordination problems: while easier than global bans, getting multiple actors to align on steering is tough. Plus, avoiding false confidence—selective efforts might create a false sense of control. And in competitive dynamics, like the AI race, actors might prioritize speed over safety, undermining steering.

  The user's deeper need seems to be finding a compelling counter to tech fatalism. They want to argue that von Neumann's era lacked the tools for differential development, but today we have better governance mechanisms. Highlighting this could strengthen their column. They might also need to address potential weaknesses in DTD to preempt criticisms.

  I should confirm the gap in von Neumann's text: he doesn't discuss partial measures, so extending his prohibition arguments to DTD isn't explicit. But reason 1 and 3 could implicitly challenge DTD. The enforcement argument (reason 2) is where the gap is clearest. 

