  **Justifications:**  
  - **Move 1 (-1):** Naomi's appeal to intuition ("rejecting the table right there") is rhetorically strong but philosophically weak. It begs the question against eliminativism by assuming the table's ontological reality is self-evident, ignoring Devon's core argument that "table" is a useful descriptor without ontological commitment.  
  - **Move 2 (+1):** Devon correctly invokes ontological parsimony (Ockham's Razor) and explanatory idleness. His position aligns with deflationary/neo-Carnapian views, though he oversimplifies by implying sparsity *always* improves ontology without justifying why parsimony applies here.  
  - **Move 3 (+2):** Naomi perfectly applies Hirsch/Chalmers. If they agree on all microphysical facts *and* pragmatic usage ("yeah there's a table"), the dispute reduces to semantics about "exists"—textbook quantifier variance. This exposes verbal elements decisively.  
  - **Move 4 (+1):** Devon properly deploys Chalmers' disambiguation test. His refusal to grant *exists-strict* preserves a substantive residue *if* one assumes naturalness applies to existence. However, he risks conflating "disagreement persists" with "disagreement is substantive."  
  - **Move 5 (+2):** Naomi identifies Devon's circularity: Insisting *exists-strict* isn't stipulative presupposes realism about ontological joints—the very point contested. This exposes Siderian naturalness as question-begging in metaontological disputes.  
  - **Move 6 (0):** Devon fairly notes Sider's naturalness argument (green/grue analogy), but overextends it. While naturalness explains induction/laws, its applicability to *existence* is contested (e.g., Hirsch rejects "joint-carving" for ontology). The move isn't mistaken but inconclusive.  

  **What Both Miss:**  
  The stalemate arises because neither deflationism nor realism resolves the *status of fundamentality itself*. Hirsch treats "fundamental" as language-relative, while Sider treats it as absolute—but both positions are self-reinforcing. A deeper issue is whether ontology can escape *pragmatic contextualism*: even Sider's "joints" may reflect cognitive interests (e.g., tables as functional unities). Thomasson’s easy ontology, Carnap’s framework-relativity, or Turner’s metaontological minimalism suggest the dispute conflates practical framework choices with metaphysical discovery. Crucially, **quantifier variance and naturalness both presuppose incompatible conceptions of "world" vs. "language"**—neither side addresses whether this dichotomy holds under scrutiny, leaving the disagreement trapped in a meta-metaontological loop.
