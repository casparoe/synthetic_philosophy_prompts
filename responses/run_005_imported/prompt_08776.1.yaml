  First, I need to nail the Hegelian perspective: war as an ethical corrective to civil society's atomization. Not glorification of violence, but war's role in shattering bourgeois complacency. The key is framing it as Sittlichkeit (ethical life) in action—citizens confronting their finite existence through sacrifice. 

