prompt: |-
  I've spent something like fifteen years reading LessWrong and its various offshoots, and I now host a small philosophy-of-mind podcast whose audience comes largely from that world, so I don't need to walk them through the standard tour of philosophical zombies. Next month's guest defends a two-dimensionalist version of the conceivability argument against physicalism, and he handles the epiphenomenalism worry -- if zombies are conceivable, our talk about consciousness is fully caused by physical facts, so how could it track phenomenal ones -- by calling it "a puzzle about explanation, not about truth" and pointing to brute psychophysical laws that guarantee correlation without causation. Write me seven interview questions that don't let him rest there: one should press on how two-dimensional semantics is meant to block the Kripke/Putnam-style worry -- the sort of case where "water is XYZ" is conceivable but not metaphysically possible -- that threatens conceivability-to-possibility inferences generally; one should ask whether brute psychophysical laws are really any less coincidental than the correlation he's trying to explain away; and one should put something like Yudkowsky's Generalized Anti-Zombie Principle to him directly -- that a causally identical world would produce the same papers about qualia for the same physical reasons, seemingly making his own papers on the subject evidentially worthless -- without letting him dismiss it as a rehash of standard epiphenomenalism. Give each question a short follow-up keyed to the response he's most likely to give.
