prompt: |-
  So here's something that's been bugging me since I retired and started reading philosophy for fun. I spent my whole career as a condensed-matter physicist, and I keep running into this endurantism vs perdurantism debate about how objects persist through time. Honestly it feels like a non-issue: special relativity already killed off absolute simultaneity, so we're left with a block universe where things are really four-dimensional worms stretched across spacetime, not some 3D object thats 'wholly present' at every instant. So doesnt that settle it in favor of perdurantism, and if so, why do philosophers still treat this like it's an open debate?
