  2. Armstrong's utility indifference method: The agent is indifferent to whether it is shut down or not, by having the utility function assign the same value to shutdown and non-shutdown in the same circumstances.
  3. Hadfield-Menell et al.'s off-switch/assistance game: Shutdownability emerges from the agent's uncertainty about the human's true reward, so the agent defers to the human's shutdown command because it might be better informed.
  4. Orseau and Armstrong's safe interruptibility for reinforcement learners: Designed for RL agents, where interruptions (like shutdown) can be done safely without the agent learning to avoid them, by not allowing the agent to observe the interruption signal or by other means.
  5. Christiano's approval-directed agents with myopia: Agents are trained to be myopic (short-sighted) so they don't resist shutdown because they don't consider long-term consequences, and they seek approval for their actions.

  Analysis:

  - **MIRI's utility-blending**: This approach directly modifies the utility function to change upon shutdown. However, it requires a mechanism to switch the utility function, and the agent might still have an incentive to prevent the switch (if it can). It doesn't fully resolve the tension because the agent might try to avoid the button press or manipulate the indicator. So it's an attempt to impose corrigibility but may not be stable.

  - **Armstrong's utility indifference**: The agent is designed to be indifferent to the shutdown event. This directly addresses the incentive: if the agent doesn't care whether it is shut down or not, then it won't resist. However, achieving true indifference in all states might be difficult and may require careful utility function design. It resolves the tension by making shutdown not a threat to the agent's goal.

  - **Hadfield-Menell et al.'s off-switch game**: This uses the agent's uncertainty about the human's preferences. The agent allows shutdown because it believes the human might know better. However, this relies on the agent being uncertain and deferential. If the agent becomes certain about the human's reward function or if it can manipulate the human's command, the incentive to resist might reappear. Thus, it doesn't fully resolve the tension in all cases.

