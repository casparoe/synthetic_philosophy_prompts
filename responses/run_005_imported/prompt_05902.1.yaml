answer: |-
  Your critique strikes at the heart of a foundational debate about the nature of conventions. I'll argue that Lewis's common-knowledge condition is neither necessary nor empirically plausible for core cases of convention—especially biological ones like vervet alarm calls—and that evolutionary dynamics provide a superior explanatory framework. Here's the case against Lewis's requirement, followed by a rebuttal of his strongest defense:

  ### Why Common Knowledge is Not Necessary: The Evolutionary Alternative
  1.  **Coordination Without Cognition:**  
      Skyrms's and Young's models demonstrate that sender-receiver conventions emerge from simple reinforcement learning (e.g., "if a signal succeeded, repeat it; if it failed, try alternatives"). Populations converge on arbitrary signals (e.g., "chutter" for eagles) through stochastic drift and positive feedback. Crucially:  
      - **No belief-formation** is required, only behavioral dispositions shaped by success.  
      - **No iterated knowledge** arises, yet the outcome is functionally identical to a Lewisian convention: a self-sustaining, arbitrary regularity solving a coordination problem.  
      Vervet learning aligns perfectly: infants give erroneous calls (e.g., eagle calls for pigeons) and refine them through social feedback—**differential reinforcement**, not epistemic reflection.

  2.  **The Vervet Counterexample:**  
      Your research provides empirical proof:  
      - **Arbitrariness:** Eagle calls don't resemble eagles; they’re population-specific signs.  
      - **Stability:** Calls persist across generations despite individual turnover.  
      - **Functionality:** They coordinate escape responses (e.g., climbing trees for leopards vs. scanning grass for snakes).  
      Yet vervets lack the cognitive machinery for infinite mutual knowledge. Lewis’s condition overintellectualizes a process explainable by **behavioral ecology and associative learning**.

  3.  **Lewis's Misplaced Anthropocentrism:**  
      Lewis derived his account from human conventions (e.g., driving on the right), where explicit agreements and language *enable* common knowledge. But this conflates **contingent human pathways** with **essential features of convention**. Evolutionary models show that the core function of conventions—*stabilizing arbitrary solutions to coordination problems*—emerges from simpler mechanisms. Biology precedes reflection.

  4.  **The Sufficiency of Behavioral Regularities:**  
      A convention exists when:  
      (a) A population exhibits a **preferred behavioral regularity**;  
      (b) This regularity is **arbitrary** (viable alternatives exist);  
      (c) It is **self-perpetuating** due to interdependent expectations/behaviors.  
      Lewis’s common knowledge is *one way* to satisfy (c), but not the only way. **Evolutionary stability via reinforcement** equally ensures self-perpetuation without epistemic chains.

  ---

  ### Rebutting Lewis's Strongest Defense: The "Why Comply?" Objection
  **Lewis's Claim:** Common knowledge is indispensable because it explains *why individuals comply* with conventions. Without knowing others know the convention, one lacks reason to adhere to an arbitrary rule. If others might defect, conformity becomes irrational. Only infinite mutual knowledge guarantees predictable coordination.

  **Evolutionary Rebuttal:**  
  1.  **The "Reason" is Built-In by Selection:**  
      In evolutionary models, "compliance" is not a deliberative choice but a **hardwired or learned response** shaped by payoff consequences. Vervets don’t "decide" to use the eagle call; they emit it because past successes reinforced the association. The "reason" is **phylogenetic and ontogenetic conditioning**, not epistemic justification.  

  2.  **Stability Without Certainty:**  
      Lewis overstates the need for certainty. In Skyrms's models, populations reach **Nash equilibria** where no individual gains by deviating *given current behaviors*—even if no one "knows" others will comply. Correlated behaviors (e.g., "most vervets react correctly to ‘chutter’") create **de facto stability**. Uncertainty about others’ knowledge doesn’t undermine conventions; it simply makes them *stochastic*, not impossible.  

  3.  **Bootstrapping Conventions:**  
      Young’s adaptive learning shows how conventions emerge from **local interactions and memory**. An agent doesn’t need global knowledge; it needs only to recall that *in recent encounters*, a signal worked. Over time, local coordination spreads. Vervets need only recognize that *their troop* responds to "chutter" by looking up—**empirical observation**, not mutual knowledge.  

  4.  **Function Over Justification:**  
      The purpose of a convention is to *coordinate*, not to be rationally justified. Alarm calls work because they *causally correlate* with escape behaviors, not because monkeys possess shared beliefs about beliefs. Lewis’s demand confuses **functional efficacy** with **rationalist epistemology**. Biology operates on the former.  

  ---

  ### Conclusion: What Makes a Convention "Philosophically Relevant"?
  Conventions matter because they resolve coordination problems through arbitrary but stable patterns. Lewis’s account captures how *humans reflect* on conventions but mistakes this reflection for their essence. Your vervets prove that conventions exist in nature without higher-order cognition. The philosophically relevant core—**arbitrariness, stability, and functional coordination**—is fully explained by evolutionary dynamics. Lewis's common-knowledge condition is a contingent feature of *linguistically mediated* human conventions, not a necessary feature of convention itself. By privileging biology over rationalism, we see that mutual knowledge is a splendid byproduct of our species' cognition, not the foundation of convention.  

  *As a postscript: Your career data bridges philosophy and biology. Where Lewis saw convention as a puzzle for game theory, vervets reveal it as an emergent property of adaptive systems—one that predates human minds by millions of years.*
