  First, I need to recall Newton's views. The Principia laid down the laws of motion and gravity, which made the universe seem like a self-regulating machine. That's the "clockmaker God" idea—God sets it up and steps back. But Newton's later writings, especially in the Opticks and letters, mention divine intervention to stabilize the solar system. 

