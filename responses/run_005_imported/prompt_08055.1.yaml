prompt: |-
  I'm a backend engineer and somehow ended up on our company's incident review board. We had a nasty outage last week - the on-call engineer got paged, misread a dashboard, and sat on a bad deploy for almost two hours before rolling it back, which cost us real money (or at least thats what finance keeps saying). Half the board wants the postmortem to name his mistake as the root cause, put a note in his file, and make him personally redo training. The other half say that's scapegoating: the dashboard is notoriously confusing, literally nobody on the rotation has ever been properly trained on it, and pretty much any of us would've made the same call that night. I have to send out the memo that actually settles this, and "it's complicated" can't be the answer - I need one concrete recommendation, and it has to seriously grapple with the worry that if nobody's ever held personally responsible, people stop being careful. Can you draft that memo for me?
reasoning: |-
  Okay, let me approach this incident review memo request systematically. The user is a backend engineer thrust into a high-stakes organizational conflict after an outage. They need to resolve a fundamental tension: holding individuals accountable versus fixing systemic issues, while preventing future occurrences. 

  First, I consider the user's explicit needs - a decisive recommendation that avoids "it's complicated" but addresses the accountability concern. The hidden needs are trickier: they likely need to preserve team morale, demonstrate leadership in a contentious situation, and protect the engineer from unfair blame while maintaining standards. The finance department's pressure adds urgency.

  The core dilemma presents itself: pure individual blame risks demoralizing the team and ignoring real system flaws, while pure system fixes might appear to condone negligence. I recall Sidney Dekker's "Just Culture" model that navigates this exact tension - it distinguishes between human error (no blame), at-risk behavior (coaching), and reckless behavior (sanctions). 

  For the memo structure, I consider starting with shared goals - everyone wants reliability. Then objectively reconstruct the incident: delayed rollback triggered by dashboard confusion. The key insight is that multiple engineers could've made the same mistake, pointing to training and dashboard design flaws as true root causes. 

  The recommendation must balance accountability and system change. Mandatory dashboard redesign paired with new training satisfies both: it fixes the system while requiring effort from the whole team. Adding a private coaching session for the on-call engineer addresses the "carelessness" concern without public shaming. 

  I debate including the "Just Culture" framing explicitly - it might sound academic but effectively legitimizes the approach. The tone should be constructive yet firm, emphasizing that good engineers can make mistakes in bad systems. Crucially, the memo must preempt finance department criticism by showing concrete preventive actions. 

  Finally, I consider adding an implementation timeline to demonstrate seriousness. The wording around the coaching session needs particular care - it should feel supportive, not punitive. The subject line must signal resolution, not blame.
answer: |-
  **MEMO: Incident Review Board Final Recommendation - Production Outage (Date: [Insert Date])**

  **To:** Incident Review Board, Engineering Leadership  
  **From:** [Your Name], Backend Engineer & IRB Member  
  **Subject:** Resolution & Action Plan: Production Outage on [Date] - Focus on Systemic Improvement  

  This memo outlines the Incident Review Board's (IRB) conclusive findings and recommended actions regarding the production outage on [Date]. We acknowledge the significant impact this incident had on our users and the business. After thorough analysis and debate, **the IRB unanimously recommends focusing corrective actions on systemic failures, not individual blame, while reinforcing collective accountability.**  

  ### Key Findings
  1.  **The Trigger:** A faulty deployment introduced critical errors.
  2.  **The Delay:** The on-call engineer (OCE) misinterpreted the primary monitoring dashboard, delaying rollback by ~2 hours.
  3.  **Contributing Factors (Root Causes):**
      *   **Dashboard Ambiguity:** The dashboard in question is known to be complex and non-intuitive, lacking clear indicators of deployment-related failures specific to this service. Historical feedback about its confusion was documented but not addressed.
      *   **Inadequate Training:** No formal, role-specific training exists for OCEs on interpreting *this specific dashboard* or the nuanced failure modes of [Service Name]. Reliance has been on tribal knowledge.
      *   **Alert Fatigue:** The OCE was simultaneously managing multiple lower-severity alerts, potentially obscuring the critical signal.
      *   **Lack of Automated Rollback Safeguards:** The deployment pipeline lacks automated canary analysis or rollback triggers based on key business metrics impacted by this outage.

  ### Why Individual Blame is Not the Root Cause & Counterproductive
  *   **Predictable Error:** Testimony and evidence confirm that multiple engineers on the rotation find this dashboard confusing. Given the stress of an incident, the pressure of multiple alerts, and the lack of clear training, the misinterpretation was a *predictable human error* within a flawed system.
  *   **Focus on Symptoms, Not Disease:** Punishing the OCE addresses the symptom (this specific delay) but ignores the disease (the confusing dashboard, lack of training, missing safeguards) guaranteeing future incidents.
  *   **Erodes Psychological Safety:** Blame creates fear, discourages transparency in future incidents, and makes engineers reluctant to take on-call shifts. This *increases* future risk.
  *   **Missed Learning Opportunity:** Focusing on the individual distracts from the crucial work of fixing the underlying systems that failed us all.

  ### Addressing the Accountability Concern
  We agree: a culture without accountability is unsafe. However, accountability must be directed correctly:
  1.  **Hold the *System* Accountable:** We are collectively accountable for designing, building, and maintaining reliable systems – including monitoring and deployment safety nets.
  2.  **Hold *Leadership* Accountable:** For prioritizing and resourcing the fixes identified below.
  3.  **Reinforce *Collective* Responsibility:** Every engineer shares responsibility for improving our tools and processes. The recommended actions involve the whole team.

  ### IRB's Concrete Recommendation: Fix the System
  **We mandate the following actions within the next [Realistic Timeline, e.g., 45 days], owned collectively by the [Service Name] team and DevOps, with progress reported directly to Engineering Leadership:**

  1.  **Dashboard Overhaul (Owner: [Name/Team], e.g., Monitoring Team Lead):**
      *   Redesign the primary dashboard for [Service Name] deployment health based on OCE feedback. Focus on **clarity, actionable alerts, and clear visual indicators** of deployment success/failure impacting core business metrics.
      *   Implement A/B testing of the new design with the on-call rotation before full rollout.
  2.  **Mandatory, Role-Specific On-Call Training (Owner: Engineering Manager, On-Call Rotation):**
      *   Develop and deliver formal training for *all* current and future OCEs covering:
          *   Interpreting key dashboards (specifically the new one).
          *   [Service Name] failure modes and rollback procedures.
          *   Incident response protocols specific to deployment issues.
      *   **Require certification/completion for all engineers before joining the rotation.**
  3.  **Implement Automated Deployment Safeguards (Owner: DevOps Lead, [Service Name] Tech Lead):**
      *   Integrate automated canary analysis into the deployment pipeline for [Service Name].
      *   Implement automated rollback triggers based on specific, critical business metric degradation (e.g., error rate, transaction success rate).
  4.  **Review & Optimize Alerting (Owner: On-Call Rotation Lead, Monitoring Team):**
      *   Audit all alerts received during the incident window. Eliminate noise, consolidate non-critical alerts, and ensure critical deployment-failure alerts are unmissable and actionable.

  ### Regarding the On-Call Engineer
  *   **No Formal Reprimand or "Note in File":** The error stemmed from known systemic flaws.
  *   **Mandatory Participation in Solution:** The OCE **will be required to actively participate** in the Dashboard Overhaul (providing detailed feedback) and the development of the new On-Call Training (sharing their experience to improve it). This leverages their direct experience for positive change.
  *   **Private Coaching Session (Owner: Engineering Manager):** A private, constructive conversation will be held. The focus will be:
      *   Acknowledging the stressful situation.
      *   Reinforcing the *team's* responsibility to provide better tools.
      *   Emphasizing the critical importance of rapid rollback decisions when core metrics degrade, even amidst ambiguity, and encouraging escalation protocols if unsure.
      *   **This is coaching, not punishment.**

  ### Why This Approach Grapples with Carelessness
  This plan directly combats complacency by:
  *   **Investing Heavily in Prevention:** Fixing the dashboard and adding safeguards makes it *harder* to make the same mistake.
  *   **Mandating Proven Training:** Ensures everyone is equipped *before* facing an incident.
  *   **Assigning Clear Ownership:** Specific teams/individuals are accountable for delivering concrete improvements.
  *   **Leveraging the Incident for Learning:** The OCE contributes directly to the solution, reinforcing vigilance through involvement.
  *   **Setting a Leadership Standard:** Demonstrates that reliability is paramount and requires continuous investment in people *and* tools.

  **"Holding people accountable" means giving them the right tools, training, and systems to succeed, then expecting them to use them diligently. This recommendation achieves that.** Focusing solely on the individual mistake ignores the shared responsibility we all bear for the systems our colleagues operate within. Let's fix the system so *every* on-call engineer is set up for success.

  **Approved by Incident Review Board:** [Date]  
  **Action Owners:** Please provide implementation plans by [Date + 1 week].  
  **Next IRB Check-in:** [Date + 30 days] to review progress.  

  [Your Name]  
  On behalf of the Incident Review Board
