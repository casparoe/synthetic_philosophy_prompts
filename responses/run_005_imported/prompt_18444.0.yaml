  Hmm, the user is clearly deep in the conditional semantics trenches—mentioning Lewis/Stalnaker triviality and Gibbard by first name suggests grad-level philosophy familiarity. Their frustration with "restating Stalnaker's thesis" mirrors common seminar dynamics where people gesture at proofs without grasping the machinery. The request for "follow-ups keyed to likely answers" shows they've anticipated rhetorical dodges. Smart framing.  

  For the Lewis question: Need to force the guest to confront why P(A>B)=P(B|A) *must* hold under all credences, not just the speaker's. The collapse arises from requiring this universally—it's not about personal belief states but structural constraints on rational valuation. The follow-up should press on whether "merely personal" probabilities can avoid triviality if the equation isn't mandated interpersonally.  

  Compositionality is the nuclear weapon against non-propositional views. Must ask how ¬(if A,B) or (if A,B)∨C even function without truth-conditional glue. If she retreats to "special negation rules," the follow-up cites semanticists' horror at context-sensitive explosion.  

  Gibbard's Sly Pete case is perfect for exposing how conditional probability ≠ rational assertability when information is asymmetric. The poker example forces her to explain why "if he called, he won" seems assertable for both speakers despite contradictory conditional probabilities.  

  Jackson's robustness move (conditionals have truth conditions but assertability requires high *and stable* conditional probability) might be a Trojan horse—if stability just repackages conditional probability, it's not meaningfully truth-conditional. The final question should smoke out whether Jackson preserves compositionality or just cosplays it.
answer: |-
  Here are 10 interview questions designed to push beyond surface-level restatements of the non-propositional view, targeting its core challenges with follow-ups anticipating likely responses:

  1.  **The Universal Credence Requirement:** "Lewis's triviality proof hinges on requiring that P(A>B) = P(B|A) holds *across a family of credence functions* consistent with an agent's probability space, not just their current credence state. Why is this requirement philosophically necessary for a *general theory* of rational credence in conditionals, rather than just an ad hoc constraint that enables the triviality result? Isn't demanding consistency across hypothetical belief states fundamental to defining a coherent conditional *operator*?"

      *   **Likely Answer & Follow-Up:** *(If she dismisses it as unmotivated/artificial)* "If we *only* require P(A>B) = P(B|A) for an agent's *current, specific* credence function C, why couldn't we just define a proposition A>B *for that specific C* such that C(A>B) = C(B|A)? Lewis's result shows this *fails* when we consider other coherent credence functions C' consistent with the same evidence/probability space. Isn't the point that a *single, fixed* proposition A>B must make sense *independently* of any particular credence state it's evaluated under? Doesn't rejecting the requirement mean abandoning a shared, objective meaning for 'if'?"

  2.  **Compositionality - Negation:** "Your view denies indicative conditionals have truth conditions. How then do you analyze the meaning and assertability conditions of a sentence like 'It is not the case that if the test is positive, the patient has the disease'? Specifically, what is being denied, and how does the assertability of this negation relate to the conditional probability P(Disease | Positive Test)?"

      *   **Likely Answer & Follow-Up:** *(If she suggests denying the conditional is equivalent to asserting the possibility that A & ~B, or uses a special negation rule)* "But doesn't that analysis effectively *reintroduce* a truth-conditional element for the conditional itself? If denying 'If A, B' just means 'Possibly A and ~B', haven't you implicitly defined a truth condition (A>B is false iff A & ~B)? And if it's a special rule, how do you prevent this 'negation' from behaving inconsistently with the negation of other sentence types, violating compositionality? How does your account explain why 'Not(if A, B)' intuitively *isn't* equivalent to 'If A, not B'?"

  3.  **Compositionality - Disjunction:** "Consider a disjunction like: 'Either the package arrived or if it didn't, the courier lost it' [~A ∨ (A>B)]. How do you determine the assertability of this entire disjunction without assigning truth conditions to the embedded conditional (A>B)? What is the 'probability' we should assign to the disjunct (A>B) here?"

      *   **Likely Answer & Follow-Up:** *(If she argues the whole disjunction is assessed holistically or that the conditional disjunct isn't evaluated independently)* "Doesn't this strategy risk making the logic of complex sentences involving conditionals completely opaque or non-systematic? How would you formally model the assertability conditions of such embeddings? If we can't compositionally derive the meaning of '~A ∨ (A>B)' from the meanings of its parts and the disjunction operator, doesn't that significantly weaken the explanatory power of your theory compared to truth-conditional accounts, even flawed ones?"

  4.  **Gibbard's Sly Pete - Motivation:** "Gibbard's Sly Pete case is often cited as a key motivation for non-propositionalism. Can you walk us through why this case poses such a severe problem specifically for truth-conditional accounts *that try to preserve Stalnaker's Thesis*? What does Sly Pete reveal that Lewis's formal triviality proof might obscure?"

      *   **Likely Answer & Follow-Up:** *(After she explains the case: Speaker 1 knows Pete bluffed, Speaker 2 knows Pete has the winning card; both rationally assert different conditionals "If he called, he won"/"If he called, he lost")* "Precisely. Both speakers seem rational and justified in asserting *contradictory* conditionals based on their private knowledge. How does your non-propositional view explain the *rationality* of *both* assertions? Does it simply dissolve the contradiction by saying neither conditional expresses a proposition that could be true or false? But then, how do we explain the strong intuition that these utterances genuinely *conflict*?"

  5.  **Gibbard's Sly Pete - Content & Communication:** "In the Sly Pete case, what, according to your view, is Speaker 1 actually *communicating* when they assert 'If Pete called, he won'? If it's not a proposition, what state of mind or information are they expressing? And crucially, why would Speaker 2, upon hearing this, disagree and assert the opposite conditional? What are they disagreeing *about* if there's no proposition at stake?"

      *   **Likely Answer & Follow-Up:** *(If she says they express high conditional probability relative to their own knowledge)* "But Speaker 2 knows Speaker 1's assertion is based on ignorance (Speaker 1 doesn't know Pete bluffed). Isn't Speaker 2's disagreement targeted at Speaker 1's *epistemic state* or their *right to assert* the conditional, rather than some claim about the world? Does your view reduce disagreement about conditionals to disagreement about the speaker's epistemic justification? Is that sufficient to capture the *object-level* feeling of conflict ('No, if he called, he *lost*!')?"

  6.  **Beyond Assertability - Logic & Inference:** "If conditionals lack truth values, how does your account handle *valid arguments* involving them? For example, how do you explain the intuitive validity of *Modus Ponens*: 'If A, B; A; therefore B'? If the premises aren't truth-apt, what grounds the inference? Is validity redefined purely in terms of preservation of *rational assertability* or *conditional probability*?"

      *   **Likely Answer & Follow-Up:** *(If she redefines validity probabilistically, e.g., high probability premises guarantee high probability conclusion)* "Does this probabilistic validity avoid the paradoxes that plague truth-conditional accounts? For instance, does it validate 'If A, B; therefore, if C and A, B' (Strengthening the Antecedent), which is probabilistically invalid (P(B|A) can be high while P(B|A&C) is low)? And how does it handle nested conditionals in complex inferences?"

  7.  **The Cost of Non-Cognitivism:** "Accepting that conditionals aren't truth-apt means they can't be believed, known, or embedded in propositional attitudes in the standard way. How do you analyze a belief report like 'Sally believes that if she flips the coin, it will land heads'? What is the content of Sally's belief?"

      *   **Likely Answer & Follow-Up:** *(If she analyzes it as Sally having a high conditional probability)* "But doesn't this seem like a significant revision of our ordinary concept of belief? We readily say people *believe* conditionals. Is your view committed to saying such everyday attributions are systematically mistaken? Or does 'belief that (if A, B)' simply *mean* having a high P(B|A)? Doesn't this face problems with conditionals believed for bad reasons (high P(B|A) due to miscalculation)?"

  8.  **Jackson's Robustness - The Rival:** "Frank Jackson proposed that conditionals *do* have truth conditions (e.g., material implication), but their *assertability* requires not just high probability, but high *robustness* – that the conditional probability P(B|A) remains high even upon learning A. How is this substantively different from your view? Isn't Jackson just adding truth conditions that play no role in assertion or rational acceptance?"

      *   **Likely Answer & Follow-Up:** *(If she agrees it's just a truth-conditional veneer)* "If the truth condition (e.g., ~A ∨ B) plays *no role* in assertion (governed solely by P(B|A)) and *no role* in the logic/embedding behavior Jackson needs to explain (as he often relies on robustness for that too), doesn't this make the truth condition explanatorily idle? Isn't your view the more parsimonious one, simply jettisoning this idle wheel? Or does Jackson's view have an advantage in compositionality that yours lacks?"

  9.  **Jackson's Robustness - Compositionality Test:** "Even if Jackson's truth condition is idle for *simple* assertion, does it potentially help with compositionality? For example, in the negation case ('Not(if A, B)'), Jackson can say it's true/false based on the truth value of the material conditional (~(~A ∨ B) = A & ~B). Does your non-propositional view have an equally straightforward and systematic way of handling such embeddings that doesn't rely on *post hoc* rules?"

  10. **The Big Picture Payoff:** "Setting aside the technical challenges from Lewis and Gibbard, what's the *positive philosophical payoff* of adopting your non-propositional view? Does it offer a clearer picture of reasoning under uncertainty, a better fit with linguistic practice, or dissolve persistent paradoxes in a way that justifies the significant departure from standard truth-conditional semantics?"

  **Key to Likely Answers:** These anticipate common non-propositionalist responses: dismissing universal credence requirements as artificial; offering special rules or holistic assessments for embeddings; explaining Sly Pete via speaker-relative conditional probability; redefining logic probabilistically; analyzing belief in conditionals as high conditional probability; and seeing Jackson's truth conditions as idle wheels. The follow-ups push on the costs, coherence, and explanatory power of these moves. Good luck with the interview!
