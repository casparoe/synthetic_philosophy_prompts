prompt: |-
  ok so I got into this whole argument with my friend last night about indicative conditionals -- like whether "if you flip it, it'll land heads" can even have real truth conditions once you take Lewis's triviality result seriously -- and we both just kept restating Stalnaker's thesis at each other without actually reconstructing why the equation collapses. anyways, my podcast guest next week bites the bullet all the way and denies indicative conditionals express propositions at all -- assertability just tracks conditional probability directly, no truth value needed. can you draft me 8-10 interview questions that dont just let her restate that view? I want at least one question that makes her actually walk through why requiring P(A>B)=P(B|A) across a whole family of credence functions, not just her own current one, is what forces the collapse, and why thats a fair requirement to impose rather then a cheat; one that presses her on how a view with no truth conditions is even supposed to handle conditionals embedded under negation or disjunction, since compositionality is the thing everyone says sinks this kind of view; and one on the Gibbard "Sly Pete" case, since thats usually the other half of the motivation for going non-cognitivist about conditionals. give each a follow-up keyed to the answer she's most likely to give, and end with a question asking her to respond to Jackson's robustness dodge -- is that a real rival account or just a redescription of her own view wearing a truth-conditional costume.
