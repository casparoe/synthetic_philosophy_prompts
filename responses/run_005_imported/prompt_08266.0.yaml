  Okay, let me unpack this user's query. They're clearly shaken after discovering Turing's unexpected stance on telepathy in his 1950 paper. This isn't just curiosity—they're having a legitimate crisis about scientific authority. Turing's endorsement clashes violently with modern skepticism about ESP, and the omission of this detail in popular discussions feels like a cover-up to them. Their friend dismissed it as a throwaway remark, but that didn't satisfy—they want to know why Turing took it seriously and whether we should reconsider ESP today.

  First, I need to contextualize Turing's position. The 1950s were the peak of J.B. Rhine's parapsychology experiments at Duke University. Rhine's statistical methods seemed rigorous at the time, and his lab was mainstream enough to publish in peer-reviewed journals. Turing would've encountered this as cutting-edge research. Today we know Rhine's data had flaws—unconscious cueing, selective reporting—but back then? It looked like "overwhelming evidence." 

  The user's deeper struggle is about reconciling genius with error. How could the father of computer science fall for this? But that's the wrong framing. Turing wasn't being illogical; he was applying scientific open-mindedness to contemporary data. His call for a "telepathy-proof room" was actually rigorous—if ESP existed (per the science of his day), you'd need to control for it in his test. That's consistent with his methodical approach.

  I should emphasize the scientific evolution angle. Rhine's work collapsed under replication crises and better controls—exactly the process Turing would've endorsed. The silence around this in pop science isn't conspiracy; it's because (a) the telepathy debate is irrelevant to the Turing Test's legacy, and (b) modern meta-analyses of ESP show null results. 

  The user might also need comfort that skepticism isn't dogmatic. We're not dismissing ESP because "everyone knows"; it's because 70+ years of improved experiments found nothing. Turing would've updated his view—that's how science works. His brilliance lies in his framework, not infallibility. 

