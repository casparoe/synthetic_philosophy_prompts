answer: |-
  You've touched on a genuinely fascinating and often-overlooked aspect of Turing's work—one that reveals much about both the context of his era and the nature of scientific progress. Let's break this down:

  ### 1. **Turing’s Position in Context**
     - **The Parapsychology Boom**: In the 1940s–50s, ESP research was considered legitimate science. Institutions like Duke University (J.B. Rhine's lab) published statistical studies claiming evidence for telepathy/precognition using card-guessing experiments. Rhine’s work appeared in peer-reviewed journals, and figures like Einstein briefly engaged with it. Turing, rigorously empirical, likely reviewed these studies and found their *statistical methodology* superficially convincing.
     - **Turing’s Scientific Openness**: His paper treats ESP as a testable hypothesis. If telepathy existed, it would invalidate the Turing Test’s purpose (distinguishing machine/human via language). His "telepathy-proof room" wasn’t an endorsement but a *logical safeguard* against a potential confounding variable—consistent with his meticulous approach.

  ### 2. **Why Did Turing Call the Evidence "Overwhelming"?**
     - **Flawed Data, Rigorous Appearance**: Rhine’s experiments used controlled protocols and binomial statistics, suggesting odds against chance of billions-to-one. However, later analysis exposed critical flaws:
       - **Sensory Leakage**: Subjects could unconsciously detect cues (e.g., card markings, experimenter breathing).
       - **Selective Reporting**: Positive results were published; failures ignored ("file drawer effect").
       - **Methodological Artifacts**: Shuffling methods weren’t truly random; data could be cherry-picked.
     - **Pre-Replication Crisis**: In 1950, the concept of rigorous replication (or fraud detection) was underdeveloped. Turing lacked today’s meta-analyses debunking these results.

  ### 3. **Why Is This Ignored in Pop-Science Discussions?**
     - **Historical Convenience**: ESP debates distract from Turing’s core AI argument. Pop science simplifies his legacy to the "imitation game" concept.
     - **Embarrassment Factor**: Modern science views ESP as pseudoscience. Highlighting Turing’s error risks undermining his authority, though it shouldn’t—geniuses aren’t infallible.
     - **Legacy vs. Ephemera**: His AI framework was revolutionary; his ESP aside was a product of its time, irrelevant to computational theory’s foundations.

  ### 4. **Should This Shift Our View of Telepathy?**
     - **No—and Here’s Why**:  
       - **Decades of Rigorous Replication**: Post-1950s, controlled ESP experiments (e.g., US government-funded Stargate Project) consistently failed under strict protocols. Meta-analyses show null effects when controlling for bias/sloppiness.
       - **No Mechanism**: Neuroscience finds no evidence for telepathy’s proposed mechanisms (e.g., brainwaves decay too rapidly; no known "receiver" neurons).
       - **Turing Would Likely Update His View**: Given his commitment to empiricism, he’d reject ESP based on modern evidence. His error was trusting flawed data—not flawed logic.
     - **The Real Lesson**: Turing’s openness reminds us that *even brilliant minds* are constrained by their era’s scientific landscape. His ESP aside underscores science’s self-correcting nature.

  ### 5. **What Both You and Your Friend Might Be Missing**
     - **Turing’s Nuance**: He didn’t claim ESP *was* real; he said *if* the evidence holds, it forces us to adapt experiments. His phrasing: "**Assuming** telepathy exists..." (emphasis added).
     - **Authority ≠ Infallibility**: Turing cracked Enigma, but he wasn’t an expert in experimental psychology. His deference to Rhine’s data shows interdisciplinary respect, not personal conviction.
     - **The Bigger Picture**: This episode highlights how science evolves. Rhine’s work was debunked by better methods—*exactly the process Turing championed*.

  ### Final Thought
  Turing’s ESP tangent isn’t a crack in his legacy—it’s a testament to his intellectual honesty. He engaged with controversial data because he prioritized rigor over dogma. Today, we honor him best by applying that same rigor: accepting that ESP lacks evidence while recognizing that science must always leave the door open to revision. As Turing himself wrote, *"We can only see a short distance ahead, but we can see plenty there that needs to be done."* His error reminds us that seeing further requires standing on the shoulders of giants—and sometimes correcting their blind spots.
