  Here’s a 3-5 minute toast that uses the dollar auction as its structural backbone, blending humor, warmth, and game theory for all audiences. It avoids framing them as stubborn, instead focusing on how their "competitive spirit" revealed deeper compatibility:

  **(Clink glass, warm smile)**  
  "Hi everyone! For those who don’t know me, I’m [Your Name], Priya’s friend from our coding days. And like all of you, I’m so thrilled to be here celebrating Priya and Marcus!  

  Now, most love stories start with ‘They met at a café’ or ‘A friend set them up.’ Not these two. Priya and Marcus met… **as sworn enemies**." **(Pause for light laughter)**  

  "Seriously! Picture this: A tiny 1-bedroom condo. Two determined, anonymous bidders locked in a *two-week* duel, driving the price into the stratosphere. Offers flying back and forth like tennis balls! Priya fuming at her laptop. Marcus glaring at his phone. Both absolutely convinced: *‘This is MY condo. I’ve come too far to quit now!’*  

  **(Lean in conspiratorially)**  
  "Some of our econ friends here are probably grinning already because yes… this is basically the ‘**Dollar Auction**’ in action. For the uninitiated, it’s a classic game theory scenario where two rational people get trapped escalating bids way beyond reason, because *walking away means swallowing a pure loss*, but *winning* means you’ve wildly overpaid! It’s the ultimate ‘can’t win, can’t quit’ dilemma.  

  **(Shift tone to warm & reflective)**  
  "And on paper? That condo auction *should* have been a disaster for them both. They ‘overpaid.’ They ‘lost’ rationally. But here’s the beautiful twist the game theory models *never* predict: **Priya and Marcus didn’t just win keys to a condo that day. They discovered the master key to each other.**  

  When they finally met? That fierce determination they’d aimed *against* each other instantly transformed. It wasn’t stubbornness for stubbornness’ sake. It was a sign of something incredible they *shared*:  
  *   **Passion:** When they care about something, they commit fully.  
  *   **Tenacity:** They see things through, even when it’s tough.  
  *   **Courage:** They aren’t afraid to fight for what they value.  

  **(Turn to the couple)**  
  "You two thought you were battling over square footage. But really, you were unknowingly auditioning your life partner. That bidding war wasn’t proof you ‘hate losing’ – it was the first glimpse of how fiercely you *fight for what matters*. And what matters most to you both? It’s not condos. It’s each other. It’s this life you’re building together.  

  **(Raise glass, heartfelt)**  
  "So let’s toast to the ultimate game theory hack! Priya and Marcus, you took a scenario designed to create losers and rewrote the rules. You turned sunk costs into the best investment you’ll ever make. You proved that sometimes, the biggest ‘win’ isn’t walking away with the prize you fought for… it’s realizing the person across the bidding table is the real treasure.  

  May your marriage be filled with the same passion, tenacity, and courage you showed in that auction – but with infinitely more cooperation, laughter, and (let’s be honest) better financial decisions! **(Wink)**  
  To Priya and Marcus – who turned a bidding war into a love story for the ages!"  

  **(Everyone: "To Priya and Marcus!")**  

  ---

  **Why this works:**  

  1.  **Deep Integration, Not Name-Drop:** The auction story *is* the toast's foundation, not a throwaway line. The explanation ("can't win, can't quit") makes the concept accessible to everyone.
  2.  **Dual Audience Engagement:**  
      *   **Econ Nerds:** They'll recognize "Dollar Auction," "sunk costs," "rational actors," "game theory models." The toast validates their knowledge.  
      *   **Everyone Else:** The story is inherently funny and romantic ("sworn enemies," "fuming at laptops," "master key"). The *emotions* (passion, tenacity, courage) are universal and positive.  
  3.  **Reframes "Stubbornness" Positively:** It explicitly shifts the narrative:  
      *   "It *wasn’t* stubbornness... it was a sign of something incredible they *shared*."  
      *   "It was the first glimpse of how fiercely you *fight for what matters*."  
      *   Focuses on shared traits (Passion, Tenacity, Courage) as core strengths of their relationship.  
  4.  **Highlights the Twist & "Win":** Emphasizes that meeting each other was the *real* victory, transforming the initial "loss" into a gain. "Rewrote the rules," "Ultimate game theory hack," "Real treasure."  
  5.  **Warmth & Humor:** The opening hook is funny, the description of the auction is relatable and light, and the conclusion is deeply sentimental. The final joke ("better financial decisions") lands safely because the sentiment before it is so strong.  
  6.  **Appropriate Length:** Structured to hit 3.5-4.5 minutes when delivered with natural pauses and emphasis.  

  **Delivery Tips:**  

  *   **Pace:** Start lively for the auction story. Slow down and warm up for the "beautiful twist" and the traits section. Be heartfelt for the final lines.  
  *   **Eye Contact:** Share the funny parts with the crowd, direct the heartfelt lines to Priya and Marcus.  
  *   **Tone:** Keep it light and amused for the auction, warm and sincere for the relationship analysis and toast.  
  *   **The Wink:** That final wink after "better financial decisions" is crucial – it signals the joke and ensures no one misreads it.  

  This toast celebrates their unique story, satisfies the econ crowd, charms everyone else, and most importantly, honors their love without a hint of negativity. Good luck!
