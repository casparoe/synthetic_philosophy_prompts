answer: |-
  ## Honor Council Recommendation: Joint Capstone Report Case

  **Finding:** We find Student A (the fabricator) **responsible** for a severe violation of Academic Integrity (Fabrication/Falsification of Data). We find Students B, C, and D **responsible** for a violation of Academic Integrity based on **failure of oversight within a joint commitment**, but **not** for the act of fabrication itself.

  **Consequences:**
  1.  **Student A:**
      *   **Grade:** Zero (0) on the Capstone Project.
      *   **Additional:** Formal probation for the remainder of the semester; mandatory completion of an Academic Integrity remediation workshop; notation of violation on internal disciplinary record (duration per school policy); ineligibility for academic honors this semester.
      *   **Rationale:** Directly committed the core violation (fabrication) with intent to deceive.
  2.  **Students B, C, and D:**
      *   **Grade:** Significant reduction (e.g., 1-2 letter grades) on the Capstone Project grade they would have otherwise received based on their legitimate contributions. (e.g., If the group grade was an A, their individual grades become B or B-).
      *   **Additional:** Mandatory completion of the Academic Integrity remediation workshop *focused on collaborative work ethics and verification*; formal warning on internal disciplinary record.
      *   **Rationale:** Their violation stems from the *failure inherent in their joint commitment*, not the fabrication itself.

  **Reasoning Incorporating Joint Commitment:**

  This Council takes seriously the argument concerning "joint commitment." The syllabus mandated a *single, jointly submitted product* carrying *one shared grade*. By choosing this collaborative structure, all four students entered into an implicit, yet binding, academic contract. This contract constituted a **joint commitment** where each member:

  1.  **Vouched Collectively:** Presented the *entire* report as the authentic work of *the group*.
  2.  **Shared Responsibility:** Accepted that the group's collective reputation and grade rested on the integrity of the *whole* document.
  3.  **Assumed Interdependence:** Understood that the group's success depended on the trustworthiness and diligence of *all* members.

  While the honor code states students are responsible for "work they submit," the nature of a *single, jointly submitted document* inherently means each student submits the *entirety* of that document as their own. The "joint commitment" argument correctly identifies that choosing this format elevates responsibility beyond mere individual authorship sections. It creates a shared duty for the document's overall veracity.

  **However,** this joint commitment does *not* equate to identical culpability for the specific act of fabrication. Responsibility is layered:

  *   **Primary Culpability:** Student A bears direct, intentional responsibility for creating and inserting false data. This is the core offense.
  *   **Secondary Culpability (Failure of Oversight):** Students B, C, and D bear responsibility for the *failure* inherent in their joint commitment. By submitting a single document representing their collective work, they undertook a duty to ensure, through reasonable means *within the collaborative framework* (e.g., final review, cross-checking key claims, open communication about data sources), the integrity of the *whole*. Their failure to implement sufficient safeguards – effectively relying on blind trust without verification mechanisms – constitutes a breach of the diligence required by the joint commitment. This breach made the submission of fabricated material possible without their knowledge.

  **Therefore:**

  *   Holding *only* Student A responsible ignores the foundational principle of the joint submission and the shared duty it imposed. It treats the group submission as merely the sum of individual parts, which the syllabus structure explicitly contradicts.
  *   Holding Students B, C, and D *equally* responsible for the fabrication ignores their lack of knowledge and intent. It unfairly punishes them for the specific malicious act of another.

  **Our recommendation balances these principles:**

  1.  **Student A** is held fully accountable for the deliberate act of fabrication.
  2.  **Students B, C, and D** are held accountable for the *failure of their joint commitment* – the lack of diligence and oversight that allowed the fabricated material to be presented under their collective name. The consequences reflect this distinct, though serious, violation of academic integrity expectations within a collaborative endeavor.

  This approach upholds the seriousness of the joint commitment model mandated by the syllabus and the honor code's core principle regarding submitted work, while also acknowledging the critical distinction between deliberate fraud and a failure of collaborative diligence. It aims for proportional accountability calibrated to the nature of each student's responsibility.
