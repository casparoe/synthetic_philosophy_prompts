  ### Concrete Example: Conflicting Verdicts in Infinite Ethics

  Consider two infinite worlds with the following sequences of welfare (utility) for their inhabitants, indexed by natural numbers (1, 2, 3, ...):

  - **World A**: \( (1, 0, 1, 0, 1, 0, \ldots) \)  
    Utility alternates between 1 and 0 for each subsequent person.

  - **World B**: \( (1, 2, 1, 2, 1, 2, \ldots) \)  
    Utility alternates between 1 and 2 for each subsequent person.

  #### Step 1: Pareto Dominance Verdict
  - **Pareto dominance** requires that at least one person is better off in B compared to A, and no one is worse off.
    - In World A, even-indexed persons (2, 4, 6, ...) have utility 0.
    - In World B, even-indexed persons have utility 2 (which is > 0).
    - Odd-indexed persons (1, 3, 5, ...) have utility 1 in both worlds.
  - Thus, all even-indexed persons are strictly better off in B, and no one is worse off.  
    **Verdict**: World B is Pareto-superior to World A.

  #### Step 2: Utilitarian Summation Verdict
  - **Utilitarian aggregation** sums the utilities of all individuals:
    - **World A**: The sum is \( 1 + 0 + 1 + 0 + \cdots \).  
      Partial sum after \(n\) individuals:  
      \[
      S_A(n) = 
      \begin{cases} 
      k & \text{if } n = 2k \\
      k+1 & \text{if } n = 2k+1 
      \end{cases}
      \]
      As \(n \to \infty\), \(S_A(n)\) diverges to infinity, but the series oscillates and has no well-defined sum in the standard sense.  
      **Verdict**: The total utility is **undefined** (divergent and non-summable).

    - **World B**: The sum is \( 1 + 2 + 1 + 2 + \cdots \).  
      Partial sum after \(n\) individuals:  
      \[
      S_B(n) = 
      \begin{cases} 
      3k & \text{if } n = 2k \\
      3k+1 & \text{if } n = 2k+1 
      \end{cases}
      \]
      As \(n \to \infty\), \(S_B(n)\) also diverges to infinity, with no finite sum.  
      **Verdict**: The total utility is **undefined** (divergent and non-summable).

  - **Conflict**: Utilitarianism fails to declare B better than A because both sums are divergent and incomparable under standard summation. This contradicts the Pareto verdict.

  #### Why the Conflict Arises
  - **Pareto dominance** relies on **ordinal comparisons** (person-by-person welfare levels), which remains coherent in infinite settings.  
  - **Utilitarian summation** relies on **cardinal aggregation** (summing utilities into a total). In finite cases, this yields a real number for comparison. In infinite cases:
    - Divergent sums (e.g., \( \infty \) vs. \( \infty \)) are mathematically incomparable.
    - The **growth rate** of partial sums (here, \(S_B(n) \approx 1.5n\) vs. \(S_A(n) \approx 0.5n\)) suggests B is better, but standard utilitarianism lacks tools to compare divergent infinities.
  - **Core issue**: Infinite populations transform ethical aggregation into a problem of **convergence**. When series diverge, utilitarianism loses its discriminatory power, even when one world is better for infinitely many people.

  #### Implications for Infinite Ethics
  This example highlights two limits of extending finite principles to infinite cases:
  1. **Undefined Aggregation**: Summing infinite utilities often yields divergence, making utilitarianism silent or incoherent.  
  2. **Principle Divergence**: Plausible axioms (e.g., Pareto) may conflict with aggregation rules, forcing trade-offs.  

  **Conclusion**: Infinite ethics requires new tools—e.g., relative utilities, average utilitarianism, or "overtaking" criteria—to handle divergence. Standard finite principles cannot be naively extended, as even intuitively clear improvements (like B over A) may become mathematically intractable. This underscores the need for a dedicated framework for infinite populations.
