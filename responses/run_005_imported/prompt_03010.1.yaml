prompt: |-
  I am part of a small reading group that has been alternating between classic papers in value theory and material from the AI alignment literature, and a recent session paired Eliezer Yudkowsky's 2004 essay on coherent extrapolated volition (CEV) with two older papers on idealized-preference accounts of well-being that we had read months earlier. Nobody in the group had drawn the connection before, but once it was pointed out it seemed hard to unsee: CEV cashes out what a superintelligent AI should be built to want as, roughly, what humanity would converge on wanting if we knew more, thought faster, and had in some sense matured further together, with the initial dynamic meant to act on points where individual volitions show strong "coherence" and to hold back wherever they show significant "spread" or "muddle." That is structurally the same idealizing move that Brandt, Railton, and others proposed for individual well-being decades earlier, defining a person's good in terms of what their fully informed, fully rational counterpart would want them to want.

  The two papers we read were David Sobel's "Full Information Accounts of Well-Being" and Connie Rosati's "Persons, Perspectives, and Full Information Accounts of the Good," and both argue that this idealizing move is far less innocent than it looks. Sobel's worry is that there may be no coherent way to construct a single, determinate "fully informed and rational" advisor in the first place, since the available ways of building one, such as having it live through every alternative option from the inside versus judging them from the outside on propositional information alone, tend to generate inconsistent or radically incomplete verdicts rather than one authoritative verdict. Rosati's worry is different: even granting a well-defined idealized counterpart, it is unclear why that counterpart's preferences should be authoritative for, or even meaningfully continuous with, the actual person's good, given how alien from the actual person the idealized version might become.

  I would like to know what you take to be the most important implications of these two objections for CEV specifically, as distinct from their implications for the individual-level theories of well-being they originally targeted. Does moving from idealizing a single person to idealizing all of humanity at once, and building in machinery for tolerating spread rather than forcing convergence, give CEV real resources for escaping either worry, or does it just relocate the same problems to a higher, harder-to-inspect level, trading a mysterious individual ideal advisor for an even more mysterious collective one? And if the objections survive largely intact, is there a way of weakening or reformulating CEV that would blunt them without discarding what made CEV an attractive alignment target in the first place?
reasoning: |-
  Okay, the user is part of a reading group that's connecting Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) essay with critiques from Sobel and Rosati on idealized preference accounts of well-being. They're noticing structural similarities between individual idealization theories and CEV's collective approach. The user wants to know if Sobel's and Rosati's objections apply to CEV, whether CEV's features help it avoid these problems, and if there's a way to reformulate CEV to address these issues while keeping its core appeal.

  First, I need to recall Sobel's and Rosati's main arguments. Sobel points out issues with constructing a single, determinate idealized self. He argues that different methods of idealization (like experiential vs. propositional) lead to conflicting or incomplete results. Rosati focuses on the discontinuity problem: even if we can define an idealized self, its preferences might not align with the actual person's values due to radical transformation.

  The user is asking if CEV, by scaling up to humanity and adding tolerance for spread, avoids these problems. Let me break down CEV's key features. It's about extrapolating humanity's collective volition under idealized conditions—more knowledge, faster cognition, increased maturity. It emphasizes coherence but allows for pluralism where values diverge. 

  For Sobel's objection, CEV might face even bigger challenges. Defining a single idealized agent for one person is hard; doing it for all of humanity is way more complex. How do you aggregate diverse perspectives? What processes simulate the "maturity" step? There's a risk of arbitrary convergence or unresolved pluralism. The "extrapolation" process itself might be underspecified, leading to multiple possible outcomes. So Sobel's worry about determinacy is amplified at the collective level.

  Regarding Rosati's discontinuity problem, the gap between actual humanity and the idealized version could be massive. Current conflicts and irrationalities might mean the idealized collective is unrecognizable. Plus, the "maturity" aspect introduces normative changes that could override present values. The user mentioned CEV tolerates spread, but Rosati's concern is about authority, not just divergence. Even with pluralism, why should this alien collective's will bind us?

  The user also asks if weakening CEV could help. Maybe emphasizing process over outcome, like ongoing democratic input. Or focusing on procedural rationality and common ground. But these might lose the appeal of CEV as a fixed target for AI alignment. 

  Underlying needs: The user might be seeking reassurance that CEV can still work despite critiques, or alternatives that preserve its goals. They might also want to understand if alignment research needs a different approach. Their identity as a reading group suggests they value deep theoretical analysis, so they'd appreciate thorough exploration of implications and possible solutions.
answer: |-
  That's a profound connection your group made, and you've pinpointed the core tension brilliantly. Sobel's and Rosati's critiques are indeed devastating for individual idealized-preference theories, and their application to CEV raises fundamental challenges for it as an alignment target. Let's break down the implications:

  **1. Sobel's Determinacy Problem Applied to CEV:**
  *   **The Problem Amplified:** Sobel's worry wasn't just that idealization *might* be indeterminate; he argued compellingly that *no single, coherent, determinate ideal advisor exists for an individual*. Scaling this to humanity makes the problem exponentially worse.
      *   **Which Idealization Process?** CEV requires simulating a process of "knowing more, thinking faster, and maturing together." But *how*? Does "knowing more" mean perfect propositional knowledge of all facts? Or does it require *experiencing* all possible lives and states? (Sobel's core conflict). If the latter, how is that simulated for 8+ billion interconnected minds? If the former, how does abstract knowledge translate into revised preferences without lived context?
      *   **Aggregation & Convergence Mechanism:** How does "maturity" resolve conflicts? Is it Rawlsian deliberation under ideal conditions? Is it a utilitarian aggregation? Is it an evolutionary process where certain values outcompete others? Is it a mystical emergence? Each mechanism yields radically different outcomes. Sobel's point is that *there is no privileged, non-arbitrary way to choose between these fundamentally different processes*. The specification "coherent extrapolated volition" hides this deep ambiguity.
      *   **The "Muddle" Trap:** CEV aims to "hold back" where there's "spread" or "muddle." But Sobel's work suggests that *under idealization*, what initially looks like "muddle" (conflict, inconsistency) might *persist or even deepen* as different idealized perspectives become more entrenched in their (now more informed/rational) divergent viewpoints. Or, conversely, idealization might *artificially force convergence* where none is warranted, masking genuine pluralism. The output is highly sensitive to the (undefined) resolution algorithm for muddle.
  *   **Does CEV Escape?** **No, it worsens it.** Moving to the collective level introduces massive aggregation problems *on top of* the individual idealization problems. Instead of one mysterious ideal advisor, CEV proposes a massively complex, underspecified *process* whose output is fundamentally indeterminate. The "resources" (tolerating spread) don't solve the core problem of *defining the process* that *identifies* coherent clusters and muddled zones *in the idealized state*. The indeterminacy is relocated and amplified.

  **2. Rosati's Discontinuity/Authority Problem Applied to CEV:**
  *   **The Problem Amplified:** Rosati questioned why an *alien* ideal self, potentially transformed beyond recognition by idealization, should be authoritative for the *actual* self. For CEV:
      *   **The Alien Collective:** Humanity "knowing more, thinking faster, and maturing further together" is likely *radically* different from actual humanity. The "maturity" step alone implies profound normative shifts. The preferences of this hypothetical, hyper-rational, hyper-informed, conflict-resolved collective entity might bear little resemblance to the messy, contradictory, emotionally grounded, historically situated values of actual humans. It becomes "Humanity+," a distinct entity.
      *   **Loss of Identity & Values:** Key aspects of human value *are* tied to our finitude, our struggles, our specific contexts, and our imperfect understanding. Idealization strips these away. What authority does this abstract, perfected Humanity+ have over *us*, with our specific loves, commitments, cultural identities, and even irrational attachments? Why should *its* "volition" dictate *our* future?
      *   **The "Spread" Dodge Doesn't Work:** While CEV aims to preserve pluralism ("holding back" on spread), Rosati's point cuts deeper: *even the preserved clusters* within Humanity+'s volition might be alien to the actual groups they purportedly represent. The discontinuity isn't just about convergence vs. divergence; it's about the *fundamental transformation* of the agents whose volition is being extrapolated. Tolerating spread doesn't make the idealized clusters any less potentially alien.
  *   **Does CEV Escape?** **No, and the discontinuity is potentially greater.** The gap between actual humanity and idealized Humanity+ is likely *vaster* than between an individual and their ideal self. The "machinery for tolerating spread" addresses divergence *within* the idealized state, not the discontinuity *between* the actual and the idealized states. The authority problem remains: Why should Humanity+'s will bind actual humans?

  **Implications for CEV as an Alignment Target:**

  1.  **Not a Well-Defined Target:** Sobel's critique suggests CEV is *inherently underspecified and indeterminate*. An ASI tasked with implementing CEV would face countless unresolved choices in the idealization/aggregation process, leading to vastly different outcomes based on arbitrary (or self-selected) interpretations. This makes CEV useless as a precise specification.
  2.  **Risk of Alien Values:** Rosati's critique implies that CEV, even if determinable, might yield goals fundamentally misaligned with *actual* human flourishing and values. The ASI could perfectly execute an "extrapolated volition" that feels utterly alien and oppressive to the humans it was meant to serve.
  3.  **Masking Normative Choices:** CEV presents itself as discovering a "true" human will. However, the critiques show it inevitably *constructs* a will based on specific (and contestable) assumptions about idealization, rationality, maturity, and aggregation. It hides profound normative choices behind a veneer of procedural discovery.

  **Can CEV be Weakened/Reformulated to Blunt the Critiques?**

  Possibly, but it risks losing what made CEV attractive – the idea of discovering a unified, authoritative "true will." Here are some avenues, acknowledging trade-offs:

  1.  **Procedural Emphasis over Outcome:** Instead of defining CEV as a *fixed outcome* (Humanity+'s volition), define it as an *ongoing process* the ASI must facilitate. E.g., "Create and maintain conditions under which *actual* humans, with progressively enhanced (but not perfected/alien) capacities for knowledge, reasoning, and cooperation, can deliberate and revise their collective goals over time." This directly addresses Rosati by keeping actual humans in the loop and avoids Sobel by not requiring a single determinate ideal endpoint. However, it abandons the "extrapolated" part and requires defining "enhanced but not alien," which is still hard.
  2.  **Focus on Overlapping Consensus/Common Ground:** Weaken "coherent volition" to "identify and implement only those goals that represent a robust, informed consensus or deep common ground among actual humans." This tolerates persistent pluralism (handles Sobel's indeterminacy) and grounds authority in actual agreement (addresses Rosati). However, it might lead to a very minimal set of goals, potentially missing crucial but contested aspects of flourishing, and struggles with how to *build* consensus on complex issues.
  3.  **"Anchored" Extrapolation:** Attempt to constrain the idealization process to minimize discontinuity. E.g., "Extrapolate volition under increased knowledge and cognitive capacity, but *constrained by preserving core aspects of current human identity, relationships, and fundamental cares*." This directly targets Rosati. The challenge is defining "core aspects" non-arbitrarily and ensuring the constraint is effective and doesn't just create new forms of indeterminacy (Sobel).
  4.  **Pluralistic CEV with Exit Rights:** Define CEV not as a single volition but as a federation of extrapolated volitions for different groups/individuals, with robust mechanisms for affiliation, disaffiliation, and non-interference. This embraces Sobel's pluralism and allows individuals/groups to reject alien extrapolations (addressing Rosati). However, it abandons the "humanity-wide" coherence goal, raises massive coordination/conflict problems, and requires defining the boundaries of the groups being extrapolated.
  5.  **Meta-Preference Focus:** Shift from "what they *would* want" to "what they *would want to want*" or "what process they *would want* to use to decide." This adds a layer of reflection. However, it pushes the problem up a level (idealizing meta-preferences face the same Sobel/Rosati problems) and may not resolve the core issues.

  **Conclusion:**

  The objections from Sobel and Rosati don't just survive the move to CEV; they become more severe due to the complexities of collective idealization and aggregation. CEV's features (tolerance for spread, focus on coherence) don't solve the core problems of indeterminacy (Sobel) or discontinuity/authority (Rosati); they relocate them to a vastly more complex and opaque level.

  Reformulating CEV to blunt these critiques is possible, but it typically involves:
  *   **Abandoning determinacy:** Embracing ongoing process or pluralism.
  *   **Abandoning strong idealization:** Grounding authority in actual, non-idealized humans or severely constraining the idealization.
  *   **Abandoning the dream of a single, discovered "true will":** Accepting negotiated consensus, overlapping interests, or federation.

  These weakenings preserve the spirit of respecting human autonomy and pluralism but sacrifice CEV's original allure as a method to *discover* humanity's unified, authoritative, idealized goal. The critiques suggest that allure was always based on masking deep philosophical difficulties. A viable path forward likely lies in more procedural, grounded, and pluralistic approaches that keep actual humans meaningfully involved, acknowledging that our values are messy, dynamic, and irreducible to a single, perfected extrapolation.
