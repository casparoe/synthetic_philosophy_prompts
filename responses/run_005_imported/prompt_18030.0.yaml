  The core tension: causation of absence (omission) vs causation of action. Philosophers like David Lewis would say omissions can be causes if they're deviations from normal expectations - which brings us back to duties anyway. 

  Final verdict: Elena wins on pure causation logic, but Marcus correctly insists duties matter for assigning responsibility. The fern died from dehydration - that's the physical cause. But we only point fingers at Deb because of the roster system. 

