  Need to ensure each point directly counters OI. For example, OI's single subject is a metaphysical entity, but EI has no entities at all. Also, note that traditions like Dzogchen emphasize the absence of inherent existence, not a shared self. Quotes from sutras or scholars would strengthen this. The user wants detail, so examples like the Milindapañha or Nagarjuna's arguments could be useful.

  Also, the user’s friend claims Buddhologists haven't caught up with Kolak. I should reference established scholars like Sue Hamilton, Steven Collins, or Thich Nhat Hanh to show academic consensus supports EI. Highlight that Kolak's view is a modern reinterpretation, not traditional Buddhism.

