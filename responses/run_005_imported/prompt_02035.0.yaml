  So I've been kind of obsessed with Zorn's lemma the last couple weeks, just reading about it on my own (no math degree or anything, I just find this stuff cool). I think I get the actual statement now: if every chain in a poset has an upper bound, the poset has a maximal element. But heres what's bugging me — isn't 'maximal' just a fancier way of saying 'the single biggest thing at the top'? Cause then I keep running into examples like 'every ring has a maximal ideal,' and apparently a ring can have a bunch of different maximal ideals where none of them contain each other. That sounds like a flat out contradiction to me if maximal just means the biggest one overall. Am I misunderstanding what the lemma is actually telling us?
