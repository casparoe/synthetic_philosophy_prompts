  Let me think about how to illustrate this. The ideal example they mentioned is perfect - in fact, that's probably why they're confused. For rings, maximal ideals are those not contained in any larger proper ideal, but there can be many such "local maximums" that don't contain each other. Like different peaks of equal height on a mountain range.

