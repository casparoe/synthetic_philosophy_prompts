answer: |-
  You're absolutely not being dense—you've hit on a crucial nuance most summaries gloss over. Gongsun Long's arguments *are* distinct in their mechanics, even if they share a broader philosophical theme ("separability of attributes/universals"). Let's break them down properly:

  ### 1. The "White Horse is Not a Horse" (白馬非馬 *Báimǎ Fēi Mǎ*) Argument
  *   **Core Claim:** "A white horse is not (identical to) 'horse'." (Not "a white horse isn't a horse" in the sense of exclusion, but "it is not the *concept* 'horse'").
  *   **Internal Logic Step-by-Step:**
      1.  **The Concept "Horse" Defines Shape/Form:** "Horse" (*mǎ*) refers to the essential form or shape of a horse. It defines *what a horse is*.
      2.  **The Concept "White" Defines Color:** "White" (*bái*) refers to the property of color.
      3.  **"White Horse" Combines Form *and* Color:** "White horse" (*báimǎ*) specifies *both* the form (horse) *and* a particular color (white).
      4.  **Specificity vs. Generality:** What you use "horse" to *seek* (the general concept/form) is different from what you use "white horse" to *seek* (a specific instance combining form *and* color).
      5.  **Set Membership ≠ Identity:** Pointing to a specific white horse satisfies a request for a "white horse" but *does not fully satisfy* a request *just* for a "horse" (because "horse" could also mean a yellow horse, black horse, etc.). Therefore, the set "white horses" is a *subset* of "horses," but the *concept* "white horse" (which includes the specification of color) is not identical to the *concept* "horse" (which is solely about form/shape and excludes color specification).
      6.  **Conclusion:** Because "white horse" incorporates an element (color) that the pure concept "horse" does not, and because "horse" denotes a broader category than "white horse," they are not identical concepts. Hence, "a white horse is not *[the concept]* horse".
  *   **Underlying Move:** **Categorical Distinction & Intension.** This is primarily about logic, semantics, and set theory. It highlights the difference between:
      *   **Extension:** The actual objects referred to (all physical horses vs. all physical white horses – here, white horses *are* horses).
      *   **Intension:** The defining properties or meaning of the concept itself ("horse" = equine form/shape; "white horse" = equine form/shape + whiteness).
      Gongsun Long focuses intensely on *intension*. He argues that since the intension of "white horse" includes whiteness and the intension of "horse" does not, they are distinct concepts, even though their extensions overlap (all white horses are horses).

  ### 2. The "Hard and White" (堅白論 *Jiān Bái Lùn*) Argument
  *   **Core Claim:** The hardness (*jiān*) and whiteness (*bái*) of a stone are separate existences, not unified properties inherent in the single stone.
  *   **Internal Logic Step-by-Step:**
      1.  **Sensory Modality:** You perceive a stone's hardness *only* through touch (your hand). You perceive its whiteness *only* through sight (your eye).
      2.  **Mutual Exclusion in Perception:** When you are touching the stone and perceiving its hardness, your sight (and thus the perception of whiteness) is "in hiding" or inactive for that property. When you are seeing the whiteness, your touch (and thus the perception of hardness) is "in hiding" or inactive for that property. *You never simultaneously perceive hardness and whiteness with the same sense organ.*
      3.  **Separation in Perception Implies Separation in Existence:** Because hardness is revealed *only* to touch and whiteness *only* to sight, and these acts of perception are distinct and never co-present in the same sensory act, Gongsun Long argues that hardness and whiteness must *themselves* be fundamentally separate entities. They don't truly "cohere" in the stone; they merely happen to be associated with the same location.
      4.  **The Stone as a Locus, Not a Unifier:** The stone is merely the passive location or "carrier" where these two separate properties (hardness and whiteness) happen to coincide. It doesn't possess them as unified attributes of a single substance.
      5.  **Conclusion:** Hardness and whiteness are separate "self-existent things" (*zì cún* 自存), not inherent, unified properties of the stone.
  *   **Underlying Move:** **Epistemology Leading to Metaphysics.** This argument starts from *how we know* (epistemology – separate sensory channels) and leaps to a conclusion about *what exists* and *how it exists* (metaphysics – separate ontological entities). The key premise is the **inference from separability in perception/knowledge to separability in being.**

  ### Comparing the Underlying Moves
  *   **White Horse:** Primarily **Logical/Semantic.** Focuses on the *meaning* of concepts ("horse", "white horse") and their logical relationship (intension, set membership). It's about how we *define* and *categorize* things conceptually. Separation is conceptual/logical.
  *   **Hard and White:** Primarily **Epistemological/Metaphysical.** Focuses on the *means of access* to properties (senses) and infers the *nature of existence* of those properties. Separation is ontological (about being itself).
  *   **Shared Theme (Universals):** Both arguments *do* support Gongsun Long's broader philosophy of "separating the hard and white" (離堅白 *lí jiān bái*), meaning attributes/universals exist independently of concrete things and independently of each other. Both challenge naive realism (the idea that the world is exactly as our senses present it, with properties inherently unified in objects).
  *   **Crucial Difference in Mechanism:** The "White Horse" argument achieves separation through *conceptual analysis* (breaking down definitions and intensions). The "Hard and White" argument achieves separation through an *epistemological argument* about sensory isolation, leading to a metaphysical claim. **Your instinct is correct: these are distinct logical moves.** The "universals" label is the shared *conclusion*, but the *paths* to that conclusion are different.

  ### Which Argument Holds Up Better?
  *   **"White Horse" Argument:** **Holds up remarkably well within its context.**
      *   **Strength:** Its core point about intension vs. extension is fundamental to logic, linguistics, and set theory. "A Volkswagen Beetle is a car, but the *concept* 'Volkswagen Beetle' (specific make/model) is not identical to the *concept* 'car' (general vehicle type)" is a perfectly valid and useful distinction. Gongsun Long pushes it to a provocative extreme, but the underlying logic is sound and insightful. It doesn't rely on quirks of Classical Chinese; similar arguments appear in Western philosophy (e.g., debates about universals, Frege's sense vs. reference).
      *   **Weakness:** It can feel like sophistry if misunderstood as denying that white horses *are* horses (which it isn't doing). Its radical separation of concept from instance can be debated metaphysically.
  *   **"Hard and White" Argument:** **Is much shakier as a piece of reasoning.**
      *   **Strength:** It brilliantly highlights the *problem* of perception and unity. How *do* different sensory properties bind together into one object? This remains a question in philosophy of mind and perception.
      *   **Weaknesses:**
          1.  **The Fatal Leap:** The inference from "known by separate senses" to "exists as separate entities" is a massive, unjustified jump. Just because I learn about taste with my tongue and texture with my fingers doesn't mean the sweetness and softness of a peach are separate existences floating in the ether. This confuses *modes of access* with *modes of being*.
          2.  **Ignoring the Binding Problem:** It completely ignores how the mind/brain *integrates* sensory information into a unified percept of a single object (the hard *and* white stone). The unity of the object is a fundamental aspect of experience that the argument dismisses.
          3.  **The Role of the Object:** Reducing the stone to a mere location ignores its role as the *substratum* that *has* these properties. Properties are generally understood as properties *of* something.
          4.  **Quirk of Focus:** While not *dependent* on Classical Chinese, the intense focus on discrete characters/terms (*jiān*, *bái*, *shí*) might have made this separation *feel* more plausible linguistically, but the logical flaw is conceptual, not linguistic.

  **The Verdict:** If I had to bet, **the "White Horse" argument holds up significantly better as a piece of reasoning.** It's a sharp, logically coherent exploration of concepts, meaning, and categories. The "Hard and White" argument is a fascinating and historically important thought experiment that raises deep questions about perception and unity, but its core inference is deeply flawed. It's more of a provocative "clever trick" that highlights a puzzle than a sound argument for ontological separation. Your intuition that they are different kinds of moves is spot-on – the first is analytical logic, the second is a bold (but flawed) metaphysical inference from epistemology. Your friend's "just universals" answer missed the fascinating difference in *how* Gongsun Long argues for that separateness in these two cases.
