answer: |-
  You've hit the philosophical nail on the head – this is the core tension in biological teleology! As a physiologist, your instinct to question the operational meaning of "function" is spot on. Let's dissect both accounts rigorously and apply them to your nagging cases before delivering a verdict.

  **The Two Camps: Deep Dive**

  1.  **The Historical/Selectionist Account (Wright, Millikan, Neander):**
      *   **Core Thesis:** A trait T has function F if and only if T exists *because* it performed F in the past, and performing F conferred a selective advantage on ancestors possessing T. Function is defined *teleologically* – it's the *purpose for which T was designed by natural selection*. It's inherently backward-looking.
      *   **Key Nuances:**
          *   **"Because of" Causation:** This is *etiological* explanation. The trait's presence is *caused by* the past success of F. Millikan's "proper function" emphasizes this: the function is the effect that explains the trait's existence and persistence via selection.
          *   **Normativity:** This account *directly* grounds normativity. A malfunction occurs when T fails to perform F *despite* being there *because* it normally performed F. The historical norm defines the standard.
          *   **Focus on Origins:** It explains *why* a trait with a specific structure exists *now*. The function isn't just what it *does*, but *why it's there*.
          *   **Individuation:** Function is tied to the *specific selective regime* that shaped T. A trait might have multiple effects, but only the effect(s) causally responsible for its selection count as its *function(s)*.

  2.  **The Systemic/Causal Role Account (Cummins):**
      *   **Core Thesis:** A trait T has function F within a containing system S relative to some capacity C of S if and only if T's capacity to do F contributes causally to S's capacity to do C. Function is defined *causally* and *analytically* – it's the current causal contribution within a system, relative to an explanatory interest. It's inherently present-looking and interest-relative.
      *   **Key Nuances:**
          *   **System Relativity:** Function is always "function *in* system S *with respect to* capacity C". There's no single "true" function. The function of hemoglobin changes depending on whether S is the circulatory system (oxygen transport) or a forensic lab (DNA source).
          *   **No History Required:** The origin of T is irrelevant. An accidentally formed rock that happens to shield a plant from wind has the function of windbreak *relative to* the plant's capacity for growth *in that specific context*.
          *   **Analytic Strategy:** Assigning functions is part of explaining how a complex capacity (C) of the system (S) is realized by the organized capacities (F) of its components (T). It's about breaking down complex behaviors.
          *   **Normativity Challenge:** Malfunction is harder to define purely causally. If T *is* currently contributing F to C (even poorly), how is that different from its function? Norms require importing external standards (e.g., statistical typicality, designer's intent – which smuggles history back in).

  **Applying the Accounts to Your Cases**

  1.  **The Brand New Mutant Trait:**
      *   **Historical View:** **No, it does *not* yet have a function.** This is a direct consequence. The trait exists purely due to mutation, not *because* of any past performance of F. Selection hasn't acted. It might be *beneficial*, it might *do* F, and it might even be *selected for* F in the *future*. But *right now*, on the historical view, it lacks a proper function. Its effects are merely "accidental benefits" or "fortuitous effects," not functions. Proponents (like Millikan) bite this bullet: a function requires a history of selection establishing the etiological link.
      *   **Systemic View:** **Yes, it *can* have a function immediately.** If this mutant trait (e.g., a novel ion channel variant) is currently contributing causally to some capacity of the organism (e.g., improved osmoregulation in a changing estuary), *relative to our explanatory interest* in understanding the organism's current osmoregulatory capacity, then its function *is* to improve osmoregulation. Its origin is irrelevant; its current causal role defines its function. This aligns with the physiologist's immediate observation.

  2.  **The Arrhythmic Heart:**
      *   **Historical View:** **Handles malfunction cleanly.** The heart's proper function is to pump blood efficiently (the effect for which it was selected). An arrhythmic heart is malfunctioning precisely because it is failing to perform the activity that explains its existence and typical structure. The historical norm provides the clear standard it's failing to meet. "Pumping blood" isn't just *what it does when working*; it's *why hearts exist*.
      *   **Systemic View:** **Struggles significantly with malfunction.** What *is* the arrhythmic heart's current causal role? It *is* contributing to circulation – erratically, inefficiently, perhaps pathologically, but contributing nonetheless. If we define the system's capacity (C) broadly as "circulation," the heart is performing *a* function (moving blood, however poorly). To call it a malfunction implies a *norm* – efficient, coordinated pumping. Where does this norm come from? The systemic view must appeal to something external:
          *   *Typical Causal Role:* Compare it to hearts in *most* conspecifics. But this relies on statistics, not pure current causation in *this* system, and implicitly references the *historically established* norm.
          *   *Contribution to Fitness/Goals:* Define C as "maintaining fitness" or "sustaining life." The arrhythmic heart contributes poorly to this. But "fitness" and "life-sustaining" are themselves evolutionary/historical concepts. Defining "life-sustaining" without reference to the organism's evolved design is philosophically fraught.
          *   *Designer's Intent (Smuggling History):* Saying it's "supposed to" pump rhythmically strongly implies a design norm established by history. Pure current causation lacks this normative "ought."

  **Verdict: The Historical/Selectionist Account Holds Up Better**

  While both accounts capture important intuitions, the **Historical/Selectionist Account** provides a more robust, coherent, and *specifically biological* theory of function. Here's why I take this side:

  1.  **Grounds Biological Normativity:** This is the decisive factor. Biology is rife with normativity – malfunction, disease, injury, design failure. The historical account explains this directly and elegantly via the etiological link. The trait fails to perform the very activity that explains its existence. The systemic account struggles mightily here, inevitably needing to import norms from history or statistics, undermining its purely presentist, causal-role foundation. Your arrhythmia case exposes this flaw starkly.
  2.  **Explains Trait Existence & Design:** The core question "Why does this complex, seemingly *designed* trait exist?" is central to biology. The historical account answers this directly: it exists *because* performing F conferred a selective advantage. The systemic account tells us *what* it does *now* within a system, but not *why* such a trait, seemingly *for* F, evolved in the first place. It describes mechanism but doesn't explain evolutionary origins.
  3.  **Handles Co-option Gracefully:** When a trait evolves for F1 (e.g., feathers for thermoregulation) and is later co-opted for F2 (flight), the historical account clearly distinguishes: F1 is the original proper function; F2 may become a new proper function *if* it is subsequently selected *for*. The systemic account, being interest-relative, can call *either* F1 or F2 the function depending on the chosen capacity C, but loses the crucial evolutionary distinction between original adaptation and later utility.
  4.  **The Mutant Bullet is Worth Biting:** While the systemic view seems more intuitive for the new mutant ("It's clearly *doing* something useful!"), the historical view's insistence that function requires a history of selection maintains conceptual purity. Calling the mutant's effect a "function" prematurely conflates current utility with selected purpose. It *might become* a function, but it isn't one *yet*. This reflects the reality that natural selection acts on populations over time, not instantaneously on individuals.
  5.  **Fits the Physiologist's Implicit Framework (Retrospectively):** You used "function" meaningfully for 35 years. I'd argue that when you studied fish gills, you weren't *just* analyzing their current causal role in gas exchange *in that moment*. You were investigating a structure refined by evolution *for* efficient gas exchange in an aquatic environment. Your understanding of pathologies (e.g., gill damage impairing O2 uptake) implicitly relied on this historical norm. The systemic view captures the proximal mechanism well, but the historical view captures the deeper "why" behind the mechanism's existence and the standard against which failure is measured.

  **Conclusion:**

  The Systemic/Causal Role account is valuable for analyzing *how* complex systems work *proximately* and is indispensable in fields like engineering or systems biology where history is irrelevant. However, for a theory of *biological function* – explaining the apparent purposiveness of traits, grounding normativity like malfunction, and answering *why* specific complex traits exist – the **Historical/Selectionist Account** is fundamentally superior. It provides the necessary teleonomic framework unique to biology, rooted in the causal power of natural selection over time. Your arrhythmia case highlights its strength; the new mutant case, while a challenge, is an edge case that doesn't undermine its core explanatory power for the vast majority of biological traits shaped by evolution. Your physiological intuition likely leaned on this historical framework all along, even if unconsciously. Welcome to the rabbit hole – it's a worthy crisis, mid-life or otherwise!
