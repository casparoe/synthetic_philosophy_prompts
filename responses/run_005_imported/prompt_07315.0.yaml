answer: |-
  You're absolutely right to question the equation of Parfit's Reductionism with Buddhist *anattā* (non-self). While the shared rejection of a substantial, enduring self is significant and Parfit explicitly draws inspiration from Buddhism, equating the positions overlooks profound and structurally essential differences. The strongest argument against this equivalence focuses precisely on the deeper ontological commitments you identified: the status of the "further fact," the role of *dharma* theory and momentariness, and the radical implications of emptiness (*śūnyatā*), culminating in the "emptiness of emptiness."

  Here's the argument structured around your specific points:

  1.  **The "Further Fact" Denial vs. The Ontological Vacuum:**
      *   **Parfit's Reductionism:** Parfit's core claim is that there is **no "further fact"** of personal identity *over and above* specific kinds of physical and psychological continuity (brain states, memories, intentions, character traits connected in the right ways). Crucially, **he affirms the reality of those underlying facts.** The brain, body, memories, psychological connections – these are real constituents. Reductionism denies a *separate* entity, the "self," but it **fully endorses the reality of the impersonal building blocks** and the relations between them. Personal identity *just is* (and is exhausted by) these impersonal facts holding in certain patterns. His "liberation" comes from realizing the self *as a separate entity* is an illusion, not from denying the reality of the experiences and connections themselves.
      *   **Buddhist *Anattā* (especially Madhyamaka):** The denial goes far deeper. While early Buddhism (like the Abhidharma referenced in the chariot simile) denies a self (*attā*) but affirms the ultimate reality of the momentary *dharmas* (the aggregates or their constituents), Madhyamaka radicalizes this. It argues that **the aggregates (*skandhas*) themselves are "empty" (*śūnya*) of inherent existence (*svabhāva*).** There is **no "further fact" *and* no ultimately real building blocks** left standing. The chariot parts (the *dharmas*) are just as conceptually designated and dependently arisen as the chariot (the "person"). The "no self" doctrine logically extends to the **emptiness of all phenomena**, including the very factors Parfit relies on (mental states, physical continuity). *Anattā* isn't just denying a self *over and above* the aggregates; it's denying that the aggregates possess any independent, intrinsic reality *themselves*.

  2.  **Dharma Theory, Momentariness, and the Structure of Reality:**
      *   **Parfit's Reductionism:** Parfit has **no commitment** to a specific ontology like *dharma* theory. He doesn't require reality to be composed of momentary, discrete, ultimately real events (*dharmas*). His analysis focuses on **continuity and connectedness over time** (psychological connectedness and continuity). He readily talks about persons persisting over years. While he discusses fission cases (like the Transporter Accident) that involve discontinuity, his core concept of "Relation R" (psychological connectedness with any cause) **presupposes duration and connection, not instantaneous moments.** The "series of interrelated... events" he mentions is **not** the Abhidharma's rigorous, momentary *dharma* flux; it's a much looser, common-sense notion of psychological and physical processes persisting over time. Parfit operates firmly within a Western metaphysical framework where physical objects and mental states persist and change continuously.
      *   **Buddhist *Anattā* (Abhidharma & beyond):** *Dharma* theory and momentariness (*kṣaṇikavāda*) are **foundational** to the Buddhist analysis leading to *anattā*, especially in Abhidharma. The chariot simile only works because the parts are analyzed down to ultimately real, momentary *dharmas*. The person *is* the causal series of these *dharmas*. **Momentariness is not incidental; it's essential.** It dismantles the illusion of endurance at the most fundamental level. Even when Madhyamaka critiques the ultimate reality of *dharmas*, it does so *from within* this framework, arguing that their apparent momentariness and causal efficacy also lack inherent existence. Parfit's lack of commitment to momentariness or any analogous fundamental ontology represents a **fundamental structural divergence** in how reality is conceived, making his "series of events" qualitatively different from the Buddhist causal flux of *dharmas*.

  3.  **The Radical Horizon: Emptiness of Emptiness and Anti-Realism:**
      *   **Parfit's Reductionism:** Parfit **remains a realist** about the physical and psychological facts that constitute persons. Brains exist, mental states exist, causal relations exist. His project is primarily **analytical and deflationary** regarding the *self*, not metaphysical regarding the ultimate status of the constituents. There's **no parallel** in Parfit to the Madhyamaka concern about reifying emptiness itself. He isn't engaged in a project of deconstructing *all* concepts or ontological categories to avoid subtle essentialism. His framework is compatible with scientific realism about the mind and brain.
      *   **Buddhist *Anattā* (Madhyamaka):** The "emptiness of emptiness" (*śūnyatā-śūnyatā*) marks the **logical endpoint and crucial safeguard** of the Buddhist denial. It highlights that *anattā* is not merely the denial of self *or* the denial of the aggregates' inherent existence. It's a **thoroughgoing anti-essentialism** applied to *everything*, including the concept of emptiness itself. This prevents emptiness from becoming a new kind of absolute or ground of being. It signifies that the denial of inherent existence applies to the *means of analysis* as well as the object analyzed. This radical, self-applying negation has **no counterpart in Parfit.** His denial of the "further fact" stops at the level of the self; it doesn't extend to a systematic deconstruction of *all* ontological claims, including his own foundational concepts of "psychological continuity" or "physical facts."

  **The Core Argument:**

  The popular equation fails because it conflates a **specific, deflationary thesis about personal identity** (Parfit) with a **comprehensive, radical metaphysical system** (Buddhism, especially Madhyamaka).

  *   **Shared Surface:** Both reject a substantial, enduring self.
  *   **Divergent Depths:**
      *   Parfit denies the self **as a separate entity** but **affirms the ultimate reality** of the physical/psychological constituents and their relations. His framework **lacks** momentariness, *dharma* ontology, and the self-negating logic of "emptiness of emptiness." His is a **reduction *to* real impersonal facts.**
      *   Buddhism (especially Madhyamaka) denies the self and **denies the ultimate reality** of the constituents themselves (*dharmas*, aggregates), revealing them as empty of inherent existence. This denial is **structured by** momentariness and *dharma* analysis (even when critiqued) and **culminates in** the "emptiness of emptiness," a radical anti-essentialism applied universally. *Anattā* is **not merely reduction, but deconstruction leading to ontological emptiness.**

  **Conclusion:**

  While Parfit finds inspiration in Buddhism and there is a genuine affinity in rejecting the substantial self, equating his Reductionism with *anattā* is significantly overstated. Parfit offers a sophisticated argument that personal identity isn't a "deep further fact," reducing it to scientifically respectable psychological and physical continuities. *Anattā*, particularly in its Madhyamaka formulation, is far more radical: it dismantles the very notion of inherent existence (*svabhāva*) for *all* phenomena, including the building blocks of Parfit's reduction. The absence in Parfit of momentariness, *dharma* ontology, and especially the self-applying negation of "emptiness of emptiness" demonstrates that his view occupies a different, less metaphysically revisionary space than the profound ontological implications of the Buddhist doctrine of non-self. Parfit dissolves the self-enclosure of the ego; Madhyamaka dissolves the enclosure of inherent existence around *everything*. The difference is not merely one of degree, but of fundamental ontological commitment.
