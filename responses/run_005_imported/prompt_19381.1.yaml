answer: |-
  Here’s a dialogue between **Lena (Lewisian)** and **Wes (Woodwardian)**, debating the Suzy and Billy case. Each presses the other’s key weaknesses while conceding ground where needed:

  ---

  **Lena (Lewisian):** Alright, Wes, let’s start with Suzy and Billy. Suzy throws a rock, shatters the bottle. Billy throws too, but his rock arrives late. Clearly, Suzy caused the shattering. But here’s your problem: *counterfactual dependence fails*. If Suzy hadn’t thrown, Billy’s rock would have shattered the bottle anyway! So the shattering doesn’t depend on Suzy’s throw. Yet it’s still a cause. My account handles this: causation isn’t just dependence; it’s a chain of *dependence*. Suzy’s throw caused the rock’s impact, and *that* depended on her throw. The impact caused the shattering, which depended on *it*. Transitivity gives us Suzy → shattering. Billy? His throw isn’t part of the actual chain.  

  **Wes (Woodwardian):** Lena, I agree Suzy caused it. But your "chain" relies on picking the right links. Why isn’t Billy’s throw part of the chain? Because it didn’t *actually* contribute? That’s circular! You’re presupposing what counts as "actual" causation. My interventionist approach avoids that. We model the system: variables like *Suzy-Throws*, *Billy-Throws*, *Bottle-Shatters*. We intervene on *Suzy-Throws* (set to 0, no throw). Then *Bottle-Shatters* still = 1 (Billy hits it). So no dependence. But—and here’s the strength—we look for *insensitivity*. Hold Billy’s throw fixed (he still throws), then intervene on Suzy: *now* the shattering *depends* on her throw! Woodward’s insight: causation requires invariance under interventions while holding off-path variables fixed.  

  **Lena:** Fine, but how do you know which variables to "hold fixed"? You held Billy fixed because he’s a "non-descendant" or "off-path." But that *presupposes* the causal structure! You’re using a causal model—*Suzy-Throws* and *Billy-Throws* are independent causes—to *define* causation. That’s circular! If I didn’t already know Billy’s throw doesn’t affect Suzy’s, how could I build your model?  

  **Wes:** Fair challenge. The model *does* rely on prior causal knowledge. But it’s not *viciously* circular. We use empirical evidence: Suzy and Billy throw independently; neither’s throw affects the other. We test invariance by hypothetical interventions—*if* we manipulated Suzy’s throw (without changing Billy’s), would the outcome change? That’s testable in principle. Your counterfactuals? They’re just as abstract!  

  **Lena:** Touché. But your "interventions" are counterfactuals in disguise! Woodward defines an intervention *I* as something that changes *X* without changing other causes of *Y* except via *X*. But that’s packed with causal assumptions! What’s "except via *X*" mean without prior causation?  

  **Wes:** Conceded. Interventions are idealizations. But they’re *productive*: they let us derive clear predictions. Your account struggles with *asymmetry*. Why is Suzy the cause and Billy not? You say Billy’s throw isn’t "actual," but that’s just labeling. Woodward explains it: interventions on Suzy’s throw *can* change the outcome under the right conditions (holding Billy fixed), but interventions on Billy’s throw *never* change it when Suzy throws. That asymmetry *defines* the causal structure.  

  **Lena:** And when your model is wrong? Suppose we discover Suzy and Billy’s throws *are* linked—maybe Billy only throws if Suzy doesn’t. Your interventionist test fails! You’d wrongly call Suzy a cause. My account adapts: we re-evaluate counterfactuals with the new dependency.  

  **Wes:** True, but your counterfactuals depend on similarity metrics over possible worlds—which are notoriously vague. Why prefer a world where Suzy doesn’t throw and Billy *does* over one where neither throws? Woodward’s models force explicitness. If Billy’s throw depends on Suzy’s, we add a link: *Suzy-Throws* → *Billy-Throws*. Then intervene: set *Suzy-Throws=0*. Now *Billy-Throws* may change, and *Bottle-Shatters* might still =1. Now Suzy *isn’t* a cause! That’s how science works—we refine models.  

  **Lena:** But now you’re admitting causation is model-relative! What’s *fundamentally* true? Woodward reduces causation to human modeling. Lewis gives a metaphysical story: causation is patterns of counterfactual dependence across worlds.  

  **Wes:** And your "worlds" are unobservable! At least interventions connect to experiments. Look—both theories get Suzy right. But yours can’t explain *why* we hold certain things fixed. Mine can: it’s about modularity. The bottle-breaking mechanism is insensitive to Billy when Suzy fires. That’s a physical fact!  

  **Lena:** Physical fact, yes. But is it *causal* or just *correlational*? Without counterfactuals, how do you ground "insensitivity"?  

  **Wes:** How do you ground "similarity of worlds"? We’re both using primitives. Maybe that’s the lesson: causation isn’t reducible to something non-causal.  

  **Lena:** *Sigh*. Maybe. Still, for this case, we agree: Suzy caused it, Billy didn’t.  

  **Wes:** Agreed. But next time, let’s discuss preemption with fragile processes. I’ll show how interventions handle it cleaner.  

  **Lena:** And I’ll show how your "variables" smuggle in causation from the start. Truce?  

  **Wes:** Truce.  

  ---

  ### Key Points Pressed:
  - **Lewisian weakness (Lena concedes):** Counterfactuals depend on vague similarity metrics.  
  - **Woodwardian weakness (Wes concedes):** Interventions presuppose causal structure (circularity risk).  
  - **Shared insight:** Both need *some* primitive causal notion (similarity/modularity).  
  - **No resolution:** Metaphysical (Lewis) vs. epistemic (Woodward) priorities remain in tension.  

  This mirrors real debates: Lewisians demand a "mind-independent" account, Woodwardians prioritize scientific practice. The dialogue forces each to confront their theory’s foundations while acknowledging the other’s explanatory strengths.
