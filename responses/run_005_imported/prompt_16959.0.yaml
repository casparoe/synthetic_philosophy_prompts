answer: |-
  Here is a novel example of the Wrong Kind of Reasons (WKR) problem for fitting-attitude analyses (FAAs), distinct from demon threats:

  **Scenario: The Mandatory Museum Exhibit**

  *   **Context:** A powerful, eccentric art patron donates a vast collection to a struggling public museum on one condition: *every visitor must express admiration for a specific, newly installed exhibit*. If visitor logs show insufficient expressions of admiration (e.g., via mandatory comment cards), the patron will revoke funding, forcing the museum to close. The exhibit itself is utterly devoid of features that typically warrant admiration – it's a bland, generic landscape painting of no historical significance, mediocre technical skill, or emotional resonance. It's not offensive, ugly, or interesting; it's simply *banal*.
  *   **Reason:** The museum director has a decisive reason to *admire* the exhibit. If she genuinely admires it, her admiration will likely be sincere and infectious, encouraging visitors to also express admiration, securing the museum's future. She also has a reason to *desire* that others admire it. This reason stems from the *consequences* of holding the attitude (saving the museum) and the *source* of the demand (the patron's arbitrary stipulation).

  **Why this is a Reason of the Wrong Kind (WKR) rather than the Right Kind (RKR):**

  1.  **Independence from the Object's Value-Making Properties:** The reason to admire the exhibit depends *entirely* on external factors: the patron's demand and the threatened closure. Crucially, the reason **persists even if we imagine the exhibit becoming slightly worse** (e.g., a small flaw is added). It also **vanishes if the patron withdraws the demand**, even if the exhibit remains unchanged. Conversely, the reason is **wholly unaffected by changes in the exhibit's actual features** that *should* affect genuine admirability. If the painting were secretly replaced overnight with a genuine Rembrandt masterpiece, the *reason generated by the patron's threat* for the director to admire it remains *identical*: save the museum. The reason doesn't track the object's actual properties relevant to admirability (beauty, skill, originality, meaning). It tracks only the consequences of holding the attitude towards *that specific object*.

  2.  **Failure to Make Admiration Fitting:** FAA defines value (e.g., admirability) in terms of there being reasons to have pro-attitudes (e.g., admiration) *towards the object*. The "Right Kind" of reasons (RKR) are those that *make* the attitude fitting – they are reasons *provided by* the object's value-making features. Admiring the Rembrandt is fitting *because* of its masterful brushwork, composition, etc.; these features *constitute* the reason to admire it. In the museum case, the reason (saving the museum) **does not make admiration *towards the banal painting* a fitting or appropriate response *to the painting itself*.** Admiring it isn't a correct appreciation of its nature; it's a pragmatic tool. The reason justifies *having* the attitude for an external goal, but it doesn't render the attitude *merited* or *warranted* by the object's intrinsic properties. Admiration feels misplaced or irrational when directed *at the painting*, even if having that feeling is instrumentally useful.

  3.  **Conflation with Reasons for Pretense or Action:** The reason is much more naturally understood as a reason to *act as if* one admires the exhibit (e.g., filling out the card positively, speaking praise) or to *desire that others express admiration*. It doesn't genuinely engage with the attitude of admiration *as a response to the object's perceived value*. It treats admiration as a *means* to an end (museum survival), not as an *appraisal* of the object. RKR, in contrast, are reasons to have the attitude *because* it correctly represents or responds to the object's actual normative status.

  **Precise Distinction:**

  *   **Right Kind Reason (RKR) for Admiring X:** A reason grounded *in the properties of X itself* that makes admiring X an appropriate, merited, or correct response *to those properties* (e.g., X's beauty, ingenuity, or moral worth provides a reason to admire it *because* admiration is the fitting response to such qualities).
  *   **Wrong Kind Reason (WKR) for Admiring X:** A reason grounded *in the consequences of having the attitude of admiration towards X*, or *in the source of a demand to admire X*, that justifies *having* the attitude for an external purpose, but *does not* make admiration a fitting or merited response *to X's own properties* (e.g., preventing harm or securing a benefit by admiring X, regardless of X's intrinsic features).

  **In this museum case:** The reason (saving the museum) is a WKR because it (a) depends entirely on external circumstances unrelated to the painting's features, (b) fails to make admiration *towards the painting* a fitting response *to the painting itself* (it remains banal), and (c) functions as a reason to *have the attitude* instrumentally, not as a reason *provided by the object* that *makes* the attitude fitting. It demonstrates that FAAs must find a way to filter out these external, consequentialist reasons to avoid incorrectly attributing value (admirability) to objects that merely happen to be the target of pragmatically useful pro-attitudes.
