  Here is a draft eulogy that honors your mother's precise intellectual position while conveying the profound reality of her love and its impact. It leans hard on her settled convictions about intentional states, explicitly marks the boundary of qualia, and uses accessible language for all listeners:

  ---

  **Eulogy for [Mother's Name]**

  Good morning. Thank you all for being here to honor my mother, [Mother's Name]. Many of you knew her as a professor, a colleague, a devoted friend, a voracious reader, or simply as family. I knew her as Mom.

  Mom spent nearly forty years wrestling with profound questions about the mind and the brain, about how thoughts and feelings fit into the physical world. She was deeply committed to truth, even when it was complex or uncomfortable. One question followed her throughout her career, from her office to our kitchen table, even though I restore furniture for a living, not philosophy: How do our minds *do* things in the world? How does a thought become an action?

  Her answer, honed over decades of fierce thinking, was clear and settled on one crucial point: **The things she *believed*, the things she *wanted*, the *decisions* she made – these were powerfully, undeniably real forces in the world.** They weren't magical. They were grounded firmly in the physical reality of her brain and body. But they weren't *just* the chemicals or the neurons either. They were the *meaning*, the *intention* carried by those physical processes. A belief isn't just a spark in the brain; it's a map. A decision isn't just a neural firing; it's a commitment. A desire isn't just an impulse; it's a direction.

  **And Mom believed, with absolute conviction, that these maps, commitments, and directions – her choices, her plans, her care – caused real things to happen.** They weren't passengers along for the ride. They were the drivers, operating through the machinery of her physical self.

  *   **Her belief** in the importance of family wasn't just a warm feeling; it was the *reason* she organized countless reunions, remembered every birthday, and showed up, without fail, whenever any of us needed her. That belief translated directly into action.
  *   **Her desire** for us to flourish wasn't just a hope; it was the *engine* behind the hours she spent helping with homework, offering wise (and sometimes challenging) advice, and fiercely advocating for our dreams. That desire became tangible support.
  *   **Her decision** to prioritize connection wasn't just a thought; it was the *cause* of the weekly phone calls, the handwritten letters, the deep conversations over dinner, the unwavering presence that shaped our lives. That decision built relationships.

  **She staked her professional life, and her understanding of herself, on the fact that these intentional states – her beliefs, her desires, her choices – were real causes.** They weren't illusions. They moved mountains in our lives. They built this family. They created this community of love and support gathered here today. The good she did, the comfort she gave, the guidance she offered – these were the direct, physical results of what she believed and what she decided to *do* about it.

  Now, Mom was also relentlessly honest. There was another piece to the puzzle of mind – the raw *feeling* of an experience, the sheer sensation of sunlight or the profound depth of love – that she wrestled with differently. She called this "qualia." **She firmly believed this feeling was real, profoundly real.** But whether this feeling *itself*, separate from the believing, wanting, and deciding, actually *pushed* atoms around in the physical world… this was the question she left open. It was the frontier of her curiosity, the mystery she respected too much to claim she had neatly solved, even as she lived the depth of feeling every single day.

  **So, when I say my mother loved us – fiercely, unconditionally, with every fiber of her being – I mean two things with absolute certainty, just as she did:**

  1.  **That her love was woven from her deepest beliefs, her strongest desires, and her constant decisions to act.** This intentional core of her love was causally powerful. It *worked* in the world. It built, it comforted, it challenged, it sustained. It caused an immense amount of good. It is the reason we are who we are. This part was settled. This part was real in the way that hammers and nails are real – tools that shape the world.
  2.  **That the *feeling* of that love – its unique, indescribable quality, the way it filled a room or settled in her eyes when she looked at her grandchildren – was a fundamental, undeniable reality of her existence and ours.** She cherished that feeling. She lived it fully. She just wouldn't claim, for the sake of tidiness, that she knew exactly *how* that feeling fit into the causal chain in the physical world. That mystery, she held open.

  **Mom didn't need the feeling to *cause* things physically to know her love was real and transformative.** Its reality was in the bedrock of her choices and actions. Its transformative power was evident in everything she built and everyone she touched. The love expressed through her beliefs, desires, and decisions – the love that *did* things – was more than enough proof of its profound reality and its world-altering force.

  She chose us, every single day, with her whole mind and being. And those choices, driven by her care and conviction, changed our physical world forever. That was her truth. That was her life. That is her legacy.

  We will miss her more than words, this feeling, can ever say. But the world she shaped through the power of her choices and her care remains, tangible and enduring. Thank you, Mom.

  ---

  **Why this works:**

  1.  **Leans Hard on the Settled View:** It repeatedly emphasizes that beliefs, desires, choices, and care (intentional states) are *real causes* operating through physical realizers. It uses strong, active language: "powerfully, undeniably real forces," "drivers," "engine," "caused real things," "moved mountains," "built this family," "direct, physical results," "causally powerful," "it *worked* in the world." The examples are concrete actions stemming from these states.
  2.  **Explicitly Marks the Boundary of Qualia:** It clearly separates "the feeling itself" from the intentional core. It states plainly that she refused to claim *that feeling* was doing the causal work ("whether this feeling *itself*... actually *pushed* atoms around... she left open," "She just wouldn't claim... that she knew exactly *how* that feeling fit into the causal chain"). It uses her term "qualia" once for the philosophers but immediately explains it in plain language ("the raw *feeling*... the sheer sensation... the profound depth of love").
  3.  **Affirms the Reality of Feeling:** It strongly asserts the feeling's reality ("fundamental, undeniable reality," "cherished that feeling," "lived it fully") without attributing causal power to it. This prevents it from seeming diminished.
  4.  **Decouples Love's Reality from Qualia's Causal Status:** The key conclusion: "Mom didn't need the feeling to *cause* things physically to know her love was real and transformative. Its reality was in the bedrock of her choices and actions." This directly addresses the family's need to hear the love was real and impactful, while respecting her philosophy.
  5.  **Accessible Language:** Uses metaphors (map, driver, engine, tools, bedrock) and concrete examples (reunions, homework help, phone calls, building family) to make complex ideas tangible. Explains "intentional states" as "beliefs, desires, choices, care."
  6.  **Honors Her Rigor:** Phrases like "relentlessly honest," "fierce thinking," "the frontier of her curiosity," "the mystery she respected too much to claim she had neatly solved," "for the sake of tidiness" all signal her intellectual integrity to the philosophers without getting bogged down.
  7.  **Respects the Stipulation:** There is no clause implying she resolved the qualia question. The open nature of that part is presented as her deliberate, honest stance ("left open on purpose," "held open").
  8.  **Emotional Core:** Grounds everything in the tangible impact of her love and choices on family and community, fulfilling the core purpose of a eulogy.

  This draft gives your mother's former colleagues exactly what they need to hear – a faithful representation of her nuanced position. It gives your family exactly what they need to hear – the undeniable reality and causal power of her love, expressed through her choices and actions. And it does so without violating the precise boundary she drew around the causal question of feeling.
