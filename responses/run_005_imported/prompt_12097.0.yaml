  Alright, let me try to work through this problem step by step. The user is asking for a ranking of six philosophical responses to Bradley's regress, from most to least successful in genuinely blocking the regress. The regress arises when we try to explain what unifies a subject and predicate into a single proposition or fact, rather than just having an unconnected list. 

  First, I need to recall what Bradley's regress is. It's a problem in metaphysics about how relations work. If you have a relation R connecting A and B, what connects R to A and to B? If you need another relation, say R2, to connect R to A, then what connects R2 to R and to A? And so on, leading to an infinite regress. 

  Now, looking at the six solutions provided:

  1. Bradley's own response: Monism, denying relations are real.
  2. Russell's early distinction: Relations can occur "as relating" vs. "as a term".
  3. Frege's unsaturated concepts: Concepts are incomplete and need objects to unify.
  4. Tractarian primitivism: Facts are basic; unity is primitive.
  5. Non-relational tie (Bergmann): Exemplification is a unique nexus, not a relation.
  6. Armstrong's states of affairs: Accepts a regress but claims it's not vicious.

  The user's friend thinks Frege's unsaturated concepts do genuine work, while the user suspects it's just relabeling the asymmetry. The user wants an impartial ranking.

  First, I need to assess which solutions genuinely resolve the regress. The key is whether they avoid the infinite regress without just pushing it back or renaming it.

  Starting with the Tractarian primitivism (Wittgenstein in Tractatus). This approach says that the unity of a fact is primitive and unanalyzable. There's no need for a further relation because the constituents just combine into a fact. This stops the regress by refusing to engage in further explanation. It's like saying "this is just how things are." So this might be the most successful because it doesn't introduce any new elements that could restart the regress.

  Next, Frege's unsaturated concepts. Concepts are incomplete, like functions that need an argument. When you plug in an object, you get a complete thought. The idea here is that the incompleteness of the concept inherently requires an object, so no further relation is needed. This might genuinely block the regress because the relation is built into the nature of the concept itself. However, the user is skeptical if this is just renaming the problem. But if it works, it's a strong solution.

  Then, Armstrong's states of affairs. He accepts that there's a regress of instantiation but argues it's not vicious. A vicious regress requires each step to be contingent on the next, but Armstrong might say that instantiation is a necessary connection. So even though there's a regress, it doesn't undermine the unity. This could be effective if the regress is benign.

  Russell's distinction between a relation "as relating" versus "as a term." When a relation is used to relate terms, it's not itself a term. This avoids treating the relation as another object needing connection. But critics might say this is just labeling the difference without explaining how the relation manages to relate without a further connector. So it might be a bit of a label, but it does address the issue by distinguishing roles.

  Bergmann's non-relational tie. Exemplification is a nexus, a unique way things combine. Since it's not a relation, it doesn't need another relation to connect it. But this might invite the question: what connects the nexus to the terms? If it's sui generis, maybe it's just a stopgap. Still, it avoids introducing a new relation.

  Bradley's own monism. Denying relations entirely, saying reality is one undivided whole. This avoids the regress by saying relations are illusions. But this seems like a retreat rather than a solution, as it dismisses the problem instead of solving it. It's radical but might not address the issue of how unity appears in our judgments.

  So, ranking them:

  1. Tractarian primitivism: Stops the regress by treating unity as primitive and unanalyzable.
  2. Frege's unsaturated concepts: Builds unity into the incomplete nature of concepts.
  3. Armstrong's states of affairs: Accepts regress but argues it's benign.
  4. Russell's relation distinction: Avoids regress by distinguishing how relations function.
  5. Bergmann's non-relational tie: Introduces a unique combinatory nexus.
  6. Bradley's monism: Denies the reality of relations, thus avoiding but not resolving the issue.

