prompt: |-
  I joined my university's exam accommodations appeals panel a few months back, right after my own long covid diagnosis left me with pretty bad memory and word-retrieval issues -- I basically run my whole life through my phone's notes app now, its like a backup brain at this point. This week the panel got a case that hits way too close to home: a student with a documented memory disability wants to bring their phone into a closed-book final, just to review photos of their own handwritten notes and voice memos made while studying, exactly the way I already lean on mine every day. Two profs on the panel insist any device access turns closed-book into open-book and isn't fair to everyone else, no matter the diagnosis; disability services says thats no different from letting a dyslexic student use text-to-speech. I have to write the panel's decision memo before friday -- approve, deny, or approve with conditions -- with reasoning solid enough to survive a further appeal. Can you draft it? Whatever the recommendation, please seriously grapple with the fairness objection instead of just waving it away.
reasoning: |-
  Okay, the user is part of a university exam accommodations panel and has to write a decision memo regarding a student with a memory disability who wants to use their phone during a closed-book exam. The user also has long COVID with similar memory issues, so this is personal for them. The main conflict is between professors who argue that allowing any device makes it open-book and thus unfair, and disability services comparing it to accommodations like text-to-speech for dyslexia.

  First, I need to understand the core issue. The student wants to use their phone to access personal study notes and voice memos due to memory impairment. The professors claim this compromises the closed-book nature of the exam. But disability services argues it's a necessary accommodation, similar to other tech aids. The user needs a balanced decision that addresses fairness concerns.

  The user's personal experience is crucial here. They rely on their phone as a "backup brain," so they understand the student's need. However, they must remain impartial in the memo. The challenge is to justify the accommodation without dismissing fairness. Also, the decision must withstand further appeals, so the reasoning needs to be solid.

  Key points to address: the nature of closed-book exams, what they assess, and whether the accommodation alters that. Closed-book exams test recall under time constraints. For someone with memory impairment, the accommodation isn't about accessing external information but compensating for a disability. It's not the same as a nondisabled student using notes because the disabled student's ability to recall is fundamentally impaired.

  Fairness in accommodations isn't about equal treatment but equitable access. Allowing a wheelchair user ramp access doesn't give them an advantage; it levels the playing field. Similarly, here, the phone is a tool to mitigate the disability's impact. The comparison to text-to-speech for dyslexia is valid—both are assistive technologies.

  But how to prevent misuse? The professors' concerns about the device being a gateway to cheating are valid. So, conditions like disabling internet, using exam mode, and supervision are essential. Also, limiting access to personal notes, not textbooks, ensures it's a memory aid, not a knowledge repository.

  The memo should acknowledge the professors' concerns seriously. Then explain the legal and ethical obligations under disability laws. Differentiate between accommodation and advantage. Propose strict conditions to maintain exam integrity. This shows a reasoned approach, not dismissal.

  The user's role requires neutrality, so the memo must not reflect their personal experience. Instead, focus on documented disability and institutional policies. Emphasize that the accommodation is individualized and based on verified needs.

  Also, consider the student's documentation. The disability services have already verified the condition. The panel's role is to determine if the accommodation is reasonable. Denying it could lead to discrimination claims, but granting without safeguards could invalidate the exam. Conditions are the middle path.

  In drafting, structure the memo with clear sections: background, arguments, analysis, recommendation, conditions. Use formal language. Balance empathy with policy. Ensure each point counters potential appeals. For example, explaining why this doesn't set a precedent—each case is assessed individually.

  Finally, the recommendation: approve with strict conditions. This addresses both the student's needs and fairness concerns. The reasoning hinges on the purpose of accommodations and the controlled use of the device. By mitigating risks, the exam's integrity remains intact while providing equitable access.
answer: |-
  ## University Exam Accommodations Panel - Decision Memorandum

  **Date:** [Insert Date]  
  **To:** Exam Accommodations Panel Members, Disability Services, Relevant Faculty  
  **From:** [Your Name/Title], Exam Accommodations Appeals Panel  
  **Subject:** Recommendation Regarding Accommodation Request: Use of Personal Digital Device (Phone) During Closed-Book Final Exam - Student ID: [Student ID]

  ### I. Background & Request
  The panel reviewed an accommodation request from a student with a **documented, verified memory-related disability** ([Specify type if known, e.g., acquired memory impairment]). The student requests permission to access their personal smartphone during a closed-book final exam. Specifically, the device would be used **solely to review photographs of their own handwritten study notes and personal voice memos recorded during their study process**. The student does not request internet access, communication capabilities, or access to external resources or textbooks. Disability Services supports this request as a necessary accommodation for the student's functional limitations related to memory encoding and retrieval.

  ### II. Key Arguments Considered
  1.  **Student/Disability Services Argument:** The requested device access functions as an **assistive technology prosthetic**, compensating for a documented neurological impairment. It directly addresses the barrier posed by the closed-book format, which inherently disadvantages students with memory disabilities. Denying this tool is argued to be akin to denying a text-to-speech reader for a dyslexic student or a wheelchair ramp for a mobility-impaired student – it fails to provide equal access to demonstrate knowledge. The content accessed is solely the student's *own* synthesized study material, not external sources.
  2.  **Faculty Fairness Objection:** Faculty members raised a significant and valid concern: allowing *any* device access fundamentally alters the nature of a "closed-book" exam. It creates an inequality where one student has access to recorded information while others rely solely on unaided recall, potentially undermining the exam's intended purpose of assessing knowledge retention under specific conditions. This could be perceived as unfair to students without such accommodations and potentially devalue the assessment for all.

  ### III. Panel Analysis & Reasoning
  The panel acknowledges the profound importance of both equitable access for students with disabilities *and* maintaining the academic integrity and intended learning outcomes assessed by closed-book examinations. This case requires a careful balancing act between these principles.

  1.  **Nature of the Disability & Accommodation:** The student's documented memory impairment creates a specific barrier to the *format* of the exam (closed-book), not necessarily to their understanding of the material. The request is for a tool to **mitigate the impact of the disability on exam performance**, not to lower academic standards. The requested use (reviewing *personal* notes/voice memos) is fundamentally different from accessing textbooks, search engines, or communication tools. It aims to bridge the gap caused by impaired retrieval, allowing the student to demonstrate the knowledge they possess but cannot reliably access spontaneously.
  2.  **The "Fairness" Objection - A Serious Engagement:**
      *   **Not "Leveling Up", But Mitigating a Disadvantage:** The core rebuttal to the fairness objection lies in the nature of disability accommodations. Accommodations are not about providing an *advantage*, but about *removing an unfair disadvantage* imposed by a disability in a specific context. A student without a memory disability enters the closed-book exam with functional recall abilities. The student *with* the disability enters it with a significant, documented impairment to that core function. Allowing the device does not give the disabled student an "extra" ability; it provides a *compensatory mechanism* to approximate the baseline recall function other students possess. Denying the accommodation effectively penalizes the student for their disability.
      *   **Analogy Validity:** The comparison to text-to-speech (TTS) for dyslexia is apt. Denying TTS to a dyslexic student in a reading-comprehension exam would unfairly disadvantage them due to their disability. Similarly, denying this memory prosthetic in a closed-book exam disadvantages this student due to *their* disability. The accommodation targets the specific functional limitation created by the disability in relation to the exam format.
      *   **Preserving the Core Assessment:** The accommodation, under strict conditions, aims to preserve the core intent of the closed-book exam: assessing the student's *understanding and synthesis of knowledge learned during the course*, under timed conditions. It does not aim to assess unaided recall *despite* a disability that specifically impairs recall. The student must still have learned and synthesized the material to create useful notes/voice memos. The device facilitates *access* to that knowledge during the high-pressure exam scenario where their disability impedes retrieval.
      *   **Perception vs. Reality:** While the perception of unfairness by other students is understandable, it stems from a misunderstanding of disability accommodations. Educational equity requires providing different supports to achieve equivalent opportunity, not identical treatment. Explaining the rationale (within privacy bounds) can help address perceptions.

  3.  **Risk Mitigation & Integrity:** The faculty's concern about the device potentially enabling cheating or exceeding the requested use is legitimate and requires robust safeguards.

  ### IV. Recommendation: APPROVE WITH STRICT CONDITIONS

  The panel **recommends APPROVAL** of the student's request to use their smartphone **strictly under the following conditions**:

  1.  **Device Preparation & Lockdown:**
      *   The phone must be placed in a **dedicated "exam mode"** using university-approved software (e.g., apps like "LockDown Browser" for phones, or institution-specific solutions) **before entering the exam room**. This mode must disable all communication (cellular, Wi-Fi, Bluetooth), all other applications (browser, email, messaging, social media, camera), and external storage access.
      *   **Only two specific, pre-approved applications will be accessible:** The photo gallery app (containing ONLY the photos of the student's handwritten notes) and the voice memo app (containing ONLY the memos recorded by the student during study for *this specific exam*).
      *   The pre-exam setup must be verified by Disability Services or a designated proctor *before* the exam begins.
  2.  **Supervision:** The student must take the exam in a **separate, proctored location** (e.g., Disability Services testing center) where the proctor can continuously monitor the student's use of the device to ensure compliance.
  3.  **Content Verification (Pre-Exam):** The student must submit the **exact set of note photos and voice memos** they intend to access *to Disability Services* for review at least [Specify timeframe, e.g., 48 hours] before the exam. Disability Services will verify that the content consists *only* of the student's own handwritten notes/personal voice memos relevant to the course material and contains no prohibited information (e.g., textbook scans, solutions, external sources). Access during the exam will be restricted to *only* these pre-approved files.
  4.  **No External Input:** The device cannot be used for recording (audio, photo, video) during the exam. Input functions must be disabled by the lockdown software.
  5.  **Device Failure Protocol:** If the device malfunctions, the student must continue the exam without it. No additional time will be granted solely due to device failure (unless part of a separate accommodation).

  ### V. Reasoning for Conditional Approval
  This conditional approval directly addresses the documented functional limitation caused by the student's memory disability, providing an essential prosthetic tool to mitigate its impact on exam performance. It upholds the principle of equitable access mandated by disability law ([Mention relevant law, e.g., ADA, Section 504]).

  Simultaneously, the stringent conditions directly and effectively address the valid fairness and academic integrity concerns raised by faculty:
  *   **Preserves Closed-Book Intent:** By restricting access solely to the student's *own* pre-created, pre-approved study notes and voice memos (not external sources or textbooks), and disabling all other functions, the accommodation mitigates the memory barrier *without* converting the exam into an open-book research exercise. The student must still rely on their understanding and synthesis of the material, as reflected in their notes.
  *   **Prevents Cheating & Misuse:** The combination of mandatory lockdown software, continuous proctoring in a separate location, and pre-approval of content significantly minimizes any risk of the device being used for unauthorized communication, research, or access to prohibited materials.
  *   **Ensures Equitable Assessment:** The conditions ensure that the accommodation targets the specific disability-related barrier (memory retrieval) under the specific exam constraint (closed-book), allowing the student to demonstrate their knowledge more accurately, while maintaining the exam's validity for assessing learned course content under timed conditions.

  ### VI. Conclusion
  This decision recognizes the unique challenges posed by memory disabilities in traditional exam formats and the necessity of technological accommodations to level the playing field. It also takes seriously the obligation to uphold academic integrity and the legitimate concerns of faculty regarding exam fairness. The recommended conditions are designed to strike this essential balance, providing the necessary accommodation while implementing rigorous safeguards to protect the exam's integrity and ensure fairness to all students. This approach is consistent with best practices in disability accommodations and the core mission of providing equitable educational opportunities.

  **Recommendation:** Approve with the strict conditions outlined in Section IV.

  **Deadline for Implementation:** Disability Services is requested to coordinate with the student, the faculty member, and the relevant exam proctoring center immediately to ensure all conditions (software setup, content verification, proctoring) are met before the scheduled final exam.

  **Further Appeal:** This decision may be appealed according to University Policy [Cite Policy Number, e.g., Policy 123.45] by [Specify Deadline, e.g., 5 business days after receipt].

  ---
  **Key considerations used in this draft:**

  *   **Centered Disability Need:** Explicitly framed the phone as an *assistive prosthetic* for a documented impairment.
  *   **Directly Confronted Fairness:** Dedicated section seriously engaging the faculty objection, using the TTS analogy and emphasizing "mitigating disadvantage" vs. "providing advantage."
  *   **Preserved Exam Integrity:** Conditions focused on disabling all non-essential functions, pre-approving *only* personal study notes/memos, and mandating proctoring.
  *   **Clear Conditions:** Specific, actionable steps for lockdown, supervision, and content verification.
  *   **Formal & Decisive Tone:** Required for an official memo expected to withstand appeal.
  *   **Avoided Personal Reference:** Maintained objectivity by not mentioning your own experience, focusing solely on the student's documented case and policy principles.
  *   **Emphasized "Why Conditions":** Explicitly linked each set of conditions to addressing specific faculty concerns.

  Remember to fill in the bracketed details ([Student ID], [Specify type], [Specify timeframe], [Mention relevant law], [Cite Policy Number], [Specify Deadline]) before finalizing the memo. Good luck with this challenging but important decision.
