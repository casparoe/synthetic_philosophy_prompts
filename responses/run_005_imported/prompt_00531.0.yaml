answer: |-
  This is a classic and tricky problem in partnership economics, touching on concepts like bargaining power, opportunity cost, and value creation. Your intuition is right: neither a simple 50/50 split nor a strict 4x ($80k/$20k) split based solely on outside options feels fully fair. Here's how to think about it more strategically:

  **Core Concepts:**

  1.  **Outside Options (BATNA - Best Alternative To a Negotiated Agreement):** Your sister's BATNA is $80k, yours is $20k. This gives her significantly more bargaining power. If she walks, she's fine; if you walk, you're worse off.
  2.  **Combined Value (The Pie):** Together, you create $150k. This is $50k **more** than your combined BATNAs ($80k + $20k = $100k). This extra $50k is called the **"Cooperative Surplus"** – the value created *specifically* by working together.
  3.  **Value Contribution:** It's not just about what you *could* do alone, but what each of you *actually contributes* to the *joint* success. Your sister brings crucial client relationships and reputation. You presumably bring labor, operational skills, shop management, and (critically) your presence enabling the *combined* output of $150k. If she had to hire someone to replace you, what would that cost?
  4.  **Fairness vs. Leverage:** "Fair" isn't just math; it also involves perceived contribution, effort, risk, and maintaining a healthy partnership.

  **Why 4x (Based Solely on BATNA) is Problematic:**

  *   **Ignores the Surplus:** It gives her the full value of her BATNA *plus* a disproportionate share of the surplus *you both create together*. Her logic claims all $80k *plus* 80% of the extra $50k ($40k), leaving you with only $30k total ($20k BATNA + 20% of surplus = $10k). She gets $120k, you get $30k. This doesn't acknowledge that the surplus exists *because* you are both there working together.
  *   **May Not Reflect Effort/Value:** As you noted, her contribution (connections) might be leveraged with less *ongoing* effort than your day-to-day operational work. Her connections are valuable, but the shop can't run *or* serve those clients effectively without your contribution.
  *   **Discourages Partnership:** It feels exploitative to you and could breed resentment, harming the business long-term.

  **Why Strict 50/50 Might Also Be Problematic:**

  *   **Ignores Opportunity Cost:** It doesn't acknowledge that your sister is giving up a significantly higher potential income ($80k vs. $20k) by partnering with you. She *is* bringing more valuable leverage to the table initially.
  *   **Underpays Her Leverage:** A pure 50/50 ($75k each) gives her less than her BATNA ($75k < $80k). Why would she accept that? It only makes sense for her if the partnership offers benefits beyond pure cash (less work, shared risk, growth potential, emotional reasons).

  **A Fairer Framework: Splitting the Cooperative Surplus**

  The key is recognizing that the first $100k of the $150k covers your combined "walk-away" values. The *extra* $50k is the prize you win by cooperating. **The negotiation is really about how to split *this surplus*.**

  Here are several fairer approaches, ranging from simple to more nuanced:

  1.  **Equal Split of the Surplus:**
      *   Combined BATNA: $80k (Sis) + $20k (You) = $100k.
      *   Cooperative Surplus: $150k - $100k = $50k.
      *   Split the $50k surplus equally: $25k each.
      *   **Result:**
          *   Sister: $80k (BATNA) + $25k (Surplus) = **$105k**
          *   You: $20k (BATNA) + $25k (Surplus) = **$45k**
      *   **Ratio:** ~70/30 (105/45 ≈ 2.33x, not 4x)
      *   **Pros:** Simple, acknowledges both BATNAs, explicitly rewards cooperation equally. You both get a significant raise ($25k) for working together.
      *   **Cons:** Sister might still feel her leverage warrants more than half the surplus.

  2.  **Proportional Split of the Surplus (Based on BATNA):**
      *   Combined BATNA: $100k.
      *   Sister's BATNA Share: $80k / $100k = 80%
      *   Your BATNA Share: $20k / $100k = 20%
      *   Split the $50k surplus 80/20:
          *   Sister: $80k + ($50k * 0.8) = $80k + $40k = **$120k**
          *   You: $20k + ($50k * 0.2) = $20k + $10k = **$30k**
      *   **Ratio:** 80/20 (4x)
      *   **Pros:** Mathematically consistent with BATNA weighting. Acknowledges her stronger position.
      *   **Cons:** As you felt, it gives her the *entire* benefit of the cooperation on top of her strong BATNA. You get very little extra ($10k) for enabling the $150k outcome. Feels like she's getting rewarded twice for the same leverage.

  3.  **The "Shapley Value" Inspired Approach (More Nuanced - Estimates Marginal Contribution):** This economic concept tries to estimate what each partner *adds* to the value. Think about the business in different combinations:
      *   Value with Sister Alone: $80k
      *   Value with You Alone: $20k
      *   Value Together: $150k
      *   **Sister's Marginal Contribution:** Value Together ($150k) - Value with You Alone ($20k) = **$130k**
      *   **Your Marginal Contribution:** Value Together ($150k) - Value with Sister Alone ($80k) = **$70k**
      *   Total Marginal Contribution: $130k + $70k = $200k
      *   **Split Based on Marginal Contribution:**
          *   Sister: ($130k / $200k) * $150k ≈ **$97.5k**
          *   You: ($70k / $200k) * $150k ≈ **$52.5k**
      *   **Ratio:** ~65/35 (1.86x)
      *   **Pros:** Directly focuses on what each person *adds* to the partnership value. Acknowledges that the sister's connections are much more valuable *in this specific context* because of the shop/your operational capacity.
      *   **Cons:** More complex to explain. Still gives sister a significant majority, but less than the 4x.

  4.  **Hybrid Model: Base + Performance/Responsibility:**
      *   Agree on base salaries that reflect core responsibilities and market value for the *work* (e.g., Shop Manager, Lead Carpenter, Sales/Client Manager). This might be closer to equal if the day-to-day work is shared relatively evenly (e.g., $40k base each).
      *   Define the remaining profit (after salaries, expenses, reinvestment) as "distributable profit."
      *   **Split the distributable profit based on contribution to growth/value:** This could be:
          *   **Weighted (e.g., 60/40):** Acknowledges sister's initial client leverage but rewards joint effort on the surplus.
          *   **Tied to specific metrics:** E.g., % of revenue attributed to new clients she brings in vs. operational efficiency you manage vs. projects jointly managed.
      *   **Example (Illustrative):** $150k Revenue - $60k Expenses = $90k Profit. $40k salary each = $10k left. Split $10k 60/40: Sis $46k total, You $44k total. Or 70/30: Sis $47k, You $43k.
      *   **Pros:** Separates compensation for work from rewards for ownership/leverage. Can feel fairer for day-to-day effort. Flexible.
      *   **Cons:** More complex to set up and administer. Requires clear roles.

  **Recommendations & Practical Steps:**

  1.  **Focus on the Surplus:** Frame the discussion around the *extra* $50k you create together. Ask: "How should we reward ourselves for creating this bonus we only get by working together?"
  2.  **Start with Equal Surplus Split (Option 1):** This (Sis $105k, You $45k) is often the most palatable compromise. It clearly gives you both a substantial incentive to cooperate ($25k extra each) while acknowledging her stronger BATNA. It's far from 50/50, but also far from 4x.
  3.  **Consider Shapley (Option 3) as a Strong Alternative:** If she strongly resists equal surplus split, the Shapley-inspired approach ($97.5k/$52.5k) provides a rigorous economic argument that her value *within the partnership* is less than her solo value ($130k marginal < $150k solo potential is impossible), while still giving her a clear majority.
  4.  **Define Roles & Contributions:** Have a frank discussion. *What exactly will each of you do?* Is she *only* bringing clients, or also doing sales, design, some work? Are you running the shop, managing production, logistics, finances? How vital is each role? Document this.
  5.  **Discuss Future:** Is the $150k static? Can *you* develop connections? Can the shop grow? A split that seems fair now might need adjustment later. Consider a mechanism for review (e.g., every 2 years).
  6.  **Formalize & Protect:** Get a lawyer to draft a partnership agreement. This should cover:
      *   Profit split formula.
      *   Roles, responsibilities, and decision-making.
      *   Capital contributions (if needed).
      *   How to handle draws/salaries vs. profit distributions.
      *   Exit strategy (What if one wants out? How is value determined? Right of first refusal?).
      *   Dispute resolution.
  7.  **The Relationship Factor:** This is your sister. While business is business, preserving the relationship has value. A split that feels brutally unfair to one (like 4x) will poison the well. Conversely, ignoring her superior leverage (strict 50/50) ignores reality. Finding a compromise like splitting the surplus equally or using the Shapley value demonstrates you both recognize each other's value and the unique benefit of working *together*.

  **In essence:** A genuinely fair split sits *between* the BATNA ratio and 50/50. It guarantees both of you significantly more than your walk-away option (making partnership attractive), while dividing the *extra* value created by cooperation in a way that feels reasonable to both partners. **Prioritize splitting the cooperative surplus ($50k) fairly – equal split is a strong starting point.** Good luck – this is a great opportunity if you can navigate this hurdle!
