answer: |-
  Below is a 3x3 game where iterated elimination of strictly dominated strategies (IESDS) using **only pure strategies** gets stuck, but introducing **mixed strategy dominance** allows elimination of a strategy, enabling full solution of the game. The payoff matrix is for two players: Row (with strategies A, B, C) and Column (with strategies X, Y, Z). Payoffs are listed as (Row, Column).

  ### Payoff Matrix
  |       | **Col X** | **Col Y** | **Col Z** |
  |-------|-----------|-----------|-----------|
  | **Row A** | (5, 1)    | (0, 0)    | (1, 0)    |
  | **Row B** | (0, 0)    | (5, 1)    | (1, 0)    |
  | **Row C** | (2, 0)    | (2, 0)    | (0, 1)    |

  ---

  ### Step 1: Attempt Pure Strategy IESDS
  We check for strictly dominated pure strategies:
  - **Row Player**:  
    - Compare A vs. C:  
      - Col X: 5 > 2 → A better  
      - Col Y: 0 < 2 → C better  
      - Col Z: 1 > 0 → A better  
      → **No dominance** (C isn’t dominated by A).  
    - Compare B vs. C:  
      - Col X: 0 < 2 → C better  
      - Col Y: 5 > 2 → B better  
      - Col Z: 1 > 0 → B better  
      → **No dominance** (C isn’t dominated by B).  
    - A and B don’t dominate each other.  
    → **No row can be eliminated with pure strategies.**  

  - **Column Player**:  
    - All columns (X, Y, Z) have unique best responses (e.g., X pays 1 if Row A, Y pays 1 if Row B, Z pays 1 if Row C).  
    → **No column can be eliminated.**  

  **Result**: Game is stuck at 3x3 with pure strategy IESDS.

  ---

  ### Step 2: Use Mixed Strategy to Eliminate Row C
  Row C is not dominated by A **or** B alone, but it **is** dominated by a **mixed strategy** of A and B. Specifically, consider a 50/50 mix:  
  - **Mixed Strategy**: Play A with 50% probability, B with 50% probability.  
  - **Expected payoff for Row** (vs. each Column strategy):  

    | Column Play | Mixed Strategy Payoff | C’s Payoff | Dominance? |
    |-------------|------------------------|------------|-----------|
    | **Col X**   | (0.5)(5) + (0.5)(0) = **2.5** | 2          | 2.5 > 2 ✅ |
    | **Col Y**   | (0.5)(0) + (0.5)(5) = **2.5** | 2          | 2.5 > 2 ✅ |
    | **Col Z**   | (0.5)(1) + (0.5)(1) = **1**   | 0          | 1 > 0 ✅ |

  **Why this works**:  
  - In **Col X**, A is strong (payoff 5) but B is weak (0). Mixing gives 2.5, beating C’s 2.  
  - In **Col Y**, B is strong (5) but A is weak (0). Mixing gives 2.5, beating C’s 2.  
  - In **Col Z**, both A and B give 1 (better than C’s 0). Mixing averages to 1.  
  - **No pure strategy** can do this because:  
    - A dominates C in X and Z but **fails in Y** (C gets 2 > A’s 0).  
    - B dominates C in Y and Z but **fails in X** (C gets 2 > B’s 0).  
  The mix "hedges bets" by combining A’s strength in X with B’s strength in Y, dominating C everywhere.

  **Eliminate Row C** (strictly dominated by the mixed strategy). Updated matrix:  

  |       | **Col X** | **Col Y** | **Col Z** |
  |-------|-----------|-----------|-----------|
  | **Row A** | (5, 1)    | (0, 0)    | (1, 0)    |
  | **Row B** | (0, 0)    | (5, 1)    | (1, 0)    |

  ---

  ### Step 3: Continue IESDS (Now Easy with Pure Strategies)
  - **Column Player**:  
    - **Col Z** is strictly dominated by a mix of X and Y (e.g., 50/50):  
      - Vs. Row A: Mix of X/Y gives ≥0, while Z gives 0 → **weakly dominated**.  
      - For strict dominance, use a mix like 60% X + 40% Y:  
        - Vs. A: (0.6)(1) + (0.4)(0) = 0.6 > 0 (Z’s payoff)  
        - Vs. B: (0.6)(0) + (0.4)(1) = 0.4 > 0 (Z’s payoff)  
      → **Eliminate Col Z**.  

  - **Updated matrix** (after eliminating Col Z):  

    |       | **Col X** | **Col Y** |
    |-------|-----------|-----------|
    | **Row A** | (5, 1)    | (0, 0)    |
    | **Row B** | (0, 0)    | (5, 1)    |

  - **Row Player**: No pure dominance (A and B are symmetric).  
  - **Column Player**:  
    - **Col X** vs. Col Y:  
      - If Row A: X (1) > Y (0)  
      - If Row B: X (0) < Y (1)  
      → **No pure dominance**.  

  **Result**: Game reduces to 2x2 (matching pennies-like), solvable with mixed strategies. Without mixed dominance, we couldn’t eliminate C, leaving the game unsolved.

  ---

  ### Key Insight
  - **Pure strategies** fail when a strategy (C) isn’t uniformly worse than any single alternative.  
  - **Mixed strategies** exploit "complementary strengths" of other strategies (A strong in X, B strong in Y). By mixing, Row hedges against Column’s choices, dominating C everywhere.  
  - This unlocks further elimination, demonstrating why mixed strategies are essential for IESDS in some games.
