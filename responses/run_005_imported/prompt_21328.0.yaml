answer: |-
  ## The Probability Tax

  Elara traced the cold, polished edge of the Quantum Echo Device – her QED. It wasn’t suicide, she corrected herself, not anymore than stepping onto a train track and *knowing* the train would miss you was suicide. The Everettian multiverse was real. Decoherence was the mechanism. And she, Elara Voss, was a pattern that persisted only where the wavefunction permitted observation. Death wasn't an experience; it was the cessation of *being* in a branch. Simple. Elegant.

  Her first tests had been… affirming. Crossing a busy highway blindfolded, the QED humming softly against her wrist. She’d opened her eyes on the other curb, heart pounding with adrenaline, not terror. A near-miss truck horn blared from a branch she wasn’t in. Then came the rooftop jump – four stories onto concrete. She’d landed in a dumpster overflowing with packing foam, breathless, laughing. The QED had pulsed warm, a satisfied little chime confirming its role in selecting her survival branch.

  Now, the wind screamed past the open cargo bay door of the aging Antonov An-12. Fifteen thousand feet above the Siberian taiga. Below, a landscape like crumpled green felt stretched to a frozen horizon. No parachute strapped to her back. Just the QED, its smooth interface cool beneath her thumb.

  *Why climb Everest?* she thought, the roar making internal monologue a shout. *Why dive the Mariana Trench? The thrill is in the perceived risk. But here… here the risk is an illusion. I step out, and my consciousness seamlessly threads the needle through the vanishingly improbable turbulence patterns, the thermal updrafts, the branches where a stray gust or a miraculously placed snowdrift breaks my fall. I will land. Because I must.*

  A flicker, though. Persistent. Annoying. The *measure*. Born’s Rule. Every survival wasn’t free. Each improbable escape paid a tax, subtracted from the amplitude of the branch she continued in. The universe didn’t care about her subjective continuity; it only cared about the math. Surviving a 1-in-10 gamble meant the Elara experiencing the aftermath existed in a branch only one-tenth as "real" as the pre-gamble branch, according to the weightings that governed quantum statistics. It wasn’t death, but it *was*… diminishment.

  She pushed it aside. Diminishment wasn’t cessation. She still *was*. And wasn't that the point?

  The jump light blinked green. The despatcher gave her a thumbs-up, face pale behind his goggles. He saw madness. She saw inevitability.

  Elara stepped into the void.

  ***

  The impact was… softer than concrete, harder than foam. She lay half-buried in a deep snowdrift nestled between ancient pines, gasping. Every bone screamed protest, but nothing was broken. The QED chirped softly on her wrist. *See?* she told the phantom skeptic in her mind. *Probability tax paid. Still here.*

  But the world felt… thinner. Colors seemed slightly less saturated, sounds marginally flatter. Was it shock? Or was it the accumulated toll of her escapes? The highway jump (1-in-20 survival?), the rooftop dive (1-in-100?), this free-fall onto snow (1-in-1000? More?). Her branch was becoming a statistical backwater, a trickle compared to the roaring rivers of amplitude where Elara Voss had died messily on highways, rooftops, and Siberian snowfields. In *those* branches, loved ones mourned. Here, she was alone with the whispering pines and the hum of her device.

  The doubt, once a flicker, became a cold ember. Robin Hanson’s "mangled worlds" hypothesis slithered into her thoughts. Decoherence wasn't always clean, Hanson argued. For branches with sufficiently low amplitude, the separation might be messy. Quantum correlations might not fully resolve. The branch might not sustain a coherent observer *at all*. It wouldn't be death; it would be… non-existence by degrees. A branch too faint to hold consciousness, collapsing into incoherence before an observer could truly inhabit it. Was she approaching that threshold? Was her persistence an illusion maintained only because the branch *could* still, barely, support her, like a fraying rope holding a climber over the abyss?

  She needed proof. Definitive proof that amplitude didn't matter, that observer continuity was absolute regardless of the measure.

  Her target: Mount Zhar-Ptitsa. The "Firebird". An active stratovolcano on the Kamchatka Peninsula. Its caldera wasn't filled with relatively soft snow, but with molten rock over 1000 degrees Celsius. The survival probability wasn't 1-in-1000. It was effectively zero. *Effectively*. But Everett said *zero* was the only impossibility.

  Standing on the razor-sharp rim, heat warping the air above the glowing, roiling lake below, the smell of sulfur thick enough to taste, Elara hesitated. This wasn't like the jump from the plane. This was… finality, in a way the others weren't. Not physically, but metaphysically. The measure tax here would be astronomical. The branch where she survived plunging into lava would be a ghost of a ghost of a ghost.

  *Hanson*, the cold voice whispered. *At this amplitude, does the branch even decohere cleanly? Does it have the structure to hold you? Or does "Elara survives the volcano" become a logical inconsistency, a configuration the wavefunction cannot resolve into a stable observer state? A mangled world where no one is home?*

  She activated the QED. Its familiar hum vibrated against her wrist bone, a comforting counterpoint to the volcano’s deep, hungry growl. The device was programmed for maximum survival bias, forcing the wavefunction to resolve in a branch where she persisted as an observer. In theory.

  *But what if persistence requires a minimum amplitude?* The ember of doubt flared. *What if the QED, desperately searching for a survival branch, finds only mangled possibilities? Branches that flicker and die before they can be experienced?*

  Below, the lava pulsed, hypnotic and lethal. This was the ultimate gamble. Not just against death, but against the *meaning* of survival in a multiverse governed by cold mathematics. If she stepped off and found herself… elsewhere… anywhere… it proved Tegmark and the purists right. Measure was irrelevant to the observer. If she simply ceased…

  She took a deep breath of scorching air. The QED hummed its readiness. Confidence warred with the chilling logic of measure and mangled worlds. There was only one way to know for sure.

  Elara closed her eyes, not against the heat, but against the terrifying ambiguity. Then, she stepped forward into the inferno, the QED’s insistent hum the last coherent sensation before the wavefunction branched, seeking a path for the impossible observer, its success or failure forever unknown to the Elara who made the choice.
