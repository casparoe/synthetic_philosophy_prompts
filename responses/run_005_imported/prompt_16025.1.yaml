prompt: |-
  After forty years running a low-temperature physics laboratory, I retired three years ago and have spent much of the time since auditing philosophy and economics courses at the university where I used to keep an office. Alongside the coursework, I've been pursuing a fairly undisciplined program of reading on my own; at the moment, a secondhand copy of Bentham shares my kitchen table with a rather more technical textbook on consumer theory. This term's seminar on rational choice finally reached revealed preference theory, and I found it one of the most satisfying pieces of theoretical machinery I have encountered outside my own field: rather than asking a consumer to introspect and report how much satisfaction some bundle of goods gives her, one simply observes her choices across a range of budgets, and, provided those choices satisfy the weak and strong axioms of revealed preference, one can construct a utility function such that she behaves, in every relevant respect, as though she were maximizing it. It struck me as exactly the move a physicist would want to make: inferring a hidden scalar quantity from observed behavior, much as we infer temperature from the statistics of molecular collisions rather than from a substance's own testimony about how hot it feels.

  What I take this to show is that economics has finally supplied classical utilitarianism with the instrument Bentham's felicific calculus always lacked: an objective, behaviorally grounded measure of a person's pleasure and pain, extracted from choice data rather than from unreliable introspective report. My former colleagues in the economics department seem oddly reluctant to draw this conclusion, but none of the objections they have offered amounts to more than the remark that utility isn't measured that way, which is a strange thing to say about a procedure that is, after all, already standard practice in demand theory. So here is my actual question. Given two neighboring households whose consumption choices have each been used, following the standard procedure, to construct a revealed utility function, what is the correct way to rescale those two functions onto a common footing, so that a town council could sum them and determine which of two competing proposals -- a new playground, say, versus a repaved road -- produces the greater total happiness in the Benthamite sense?
reasoning: |-
  Okay, let me start by understanding the user's background. They're a retired low-temperature physics professor who's now auditing philosophy and economics courses. They're excited about revealed preference theory because it reminds them of how physicists infer hidden variables from observable data, like temperature from molecular motion. They see this as the solution to Bentham's felicific calculus, providing an objective measure of utility.

  The user's main question is about rescaling individual utility functions to sum them for societal decisions, like a playground vs. a repaved road. They're frustrated that economists haven't embraced this as a utilitarian tool. I need to address why economists are hesitant and explain the aggregation problem.

  First, revealed preference theory constructs utility functions based on observed choices. These functions are ordinal, meaning they show preference order but not intensity. The user wants to compare utility across individuals, which requires cardinal scaling. But revealed preference doesn't provide that because it's based solely on choice data, which doesn't reveal how much more someone prefers one bundle over another.

  Interpersonal comparisons are a bigger hurdle. There's no behavioral data to equate utility scales between people. For example, if both households reveal a utility of 10 for a bundle, it doesn't mean they experience the same happiness. Economists avoid this by treating utility as ordinal and non-comparable.

  The user mentions Benthamite utilitarianism, which requires summing individual utilities. But without a common scale, any scaling method (like assuming identical marginal utility of money) is arbitrary. Economists like Samuelson and Robbins have critiqued this as unscientific.

  The user's physics analogy might lead them to think utility can be measured like temperature. But temperature has a natural zero and ratio scale, while utility lacks such properties. Choice data doesn't provide a unit or zero point for comparison.

  Possible solutions? Cost-benefit analysis uses willingness to pay, aggregating money values. But this measures efficiency, not total happiness. The town council example could use voting or surveys, but those have their own issues. The user might need to accept that Benthamite summation isn't feasible with revealed preference alone.

  Underlying all this, the user seeks a scientific basis for moral decisions. Their frustration with economists stems from a desire for objectivity in utilitarianism. But the philosophical challenges in interpersonal utility comparisons remain unresolved. They might need to explore alternative approaches like social choice theory or welfare economics that don't rely on summing utilities.
answer: |-
  What a fascinating convergence of physics, philosophy, and economics! Your physicist's lens on revealed preference theory (RPT) is spot-on – the elegance of inferring a hidden structure (utility) from observable behavior (choices) is deeply satisfying. However, the leap from individual revealed utility to interpersonal summation for Benthamite social welfare hits a profound conceptual and technical wall, precisely *because* of the nature of revealed preference utility. This is why your economist colleagues are reluctant.

  Here's a breakdown of the problem and why rescaling for interpersonal summation is generally considered impossible within the standard RPT framework:

  1.  **The Nature of Revealed Preference Utility: Ordinality**
      *   RPT constructs a utility function `U_i(x)` for individual `i` that **rationalizes observed choices**. If bundle `x` is chosen over bundle `y`, then `U_i(x) > U_i(y)`.
      *   Crucially, *any* strictly increasing transformation of `U_i(x)` (e.g., `V_i(x) = f(U_i(x))` where `f` is monotonically increasing) would generate *exactly the same choice behavior*. If `U_i(x) > U_i(y)`, then `V_i(x) = f(U_i(x)) > f(U_i(y)) = V_i(y)`.
      *   This means the utility function derived via RPT is **ordinal**, not **cardinal**. It faithfully represents the *ranking* of bundles but is completely arbitrary regarding the *intensity* of preference or the *size* of utility differences between bundles. The numerical values assigned are meaningless except for ordering.

  2.  **The Interpersonal Comparison Problem:**
      *   Benthamite utilitarianism requires summing *cardinal* utilities: `Total Happiness = U_A + U_B + ... + U_Z`.
      *   RPT gives us an ordinal `U_A` for person A and an ordinal `U_B` for person B. Crucially, **there is no behavioral data within RPT that allows us to meaningfully compare the *level* or *unit* of utility between A and B**.
      *   Suppose `U_A(x) = 10` and `U_B(x) = 10`. Does this mean A and B get the same happiness from bundle `x`? Absolutely not. We could just as easily define `V_A(x) = 1000` and `V_B(x) = 1`, and both `V_A` and `V_B` would still perfectly represent A and B's *individual* choices. The numerical values `10` vs `10` are an artifact of the specific scaling chosen for each individual function during construction; they carry no interpersonal significance.
      *   Similarly, suppose `U_A(x) - U_A(y) = 5` and `U_B(x) - U_B(y) = 2`. Does this mean A gains more happiness switching from `y` to `x` than B does? Again, no. We could transform `U_B` to `V_B = 10 * U_B`, making the difference `20`, suggesting B gains *more*. Both `U_B` and `V_B` are equally valid representations of B's choices.

  3.  **The (Impossible) Rescaling Task:**
      *   Your question asks for the "correct way to rescale those two functions onto a common footing" for summation.
      *   **There is no "correct" way to do this based solely on revealed preference choice data.** Any rescaling is fundamentally arbitrary.
      *   Common proposals (and why they fail within RPT):
          *   **Assume Identical Marginal Utility of Money:** Suppose both households have the same income and face the same prices. Could we rescale so that £1 generates the same utility increase for both? RPT doesn't reveal the *absolute* marginal utility of money. We observe choices *at* given budgets, but not the *intensity* of the trade-off. The constructed `U_i` might show diminishing marginal utility of goods, but the *scale* of that marginal utility (e.g., `∂U/∂x`) is arbitrary. We could rescale one function to make its `∂U/∂x` match the other's at a point, but this is arbitrary and doesn't ensure comparability for other goods or bundles.
          *   **Use a "Numeraire" Good:** Rescale so that both utility functions assign the same value to a specific bundle (e.g., the current consumption bundle). But this assumes that bundle *provides the same absolute happiness* to both households, which is an interpersonal comparison RPT cannot justify. Person A might be ecstatic with it, Person B merely content.
          *   **Infer from Risky Choices?** Some theories (like von Neumann-Morgenstern expected utility) yield cardinal utility *within an individual* under uncertainty. But even cardinal utility *within* an individual doesn't solve the *interpersonal* comparison problem. Knowing A's utility is cardinal and B's utility is cardinal doesn't tell us if A's "util" equals B's "util".

  4.  **Why Economists Hesitate (The Standard View):**
      *   Economists see RPT as a powerful tool for describing and predicting *individual choice behavior* under constraints, and for testing the consistency of that behavior (WARP, SARP).
      *   They largely view the utility function derived via RPT as a convenient mathematical representation of an *ordinal* preference ordering. Its numerical values are devoid of cardinal meaning, let alone interpersonal meaning.
      *   Claiming that RPT provides an "objective, behaviorally grounded measure of a person's pleasure and pain" oversteps what the theory actually delivers. It measures *revealed preference*, not *hedonic experience*. While these are often assumed to be linked (people choose what they believe gives them more pleasure), RPT itself is agnostic about the underlying psychological state. It only describes consistent choice.
      *   The "utility isn't measured that way" objection likely refers to the fact that while RPT *constructs a utility function*, the *interpretation* of that function as measuring "pleasure and pain" intensity (Bentham's "utils") is not inherent to the theory and requires additional, unverifiable assumptions. The function is a representation of choice, not necessarily a direct measure of hedonic state.

  5.  **What Could the Town Council Do? (Alternatives to Revealed Preference Summation):**
      *   **Cost-Benefit Analysis (CBA):** This is the standard *pragmatic* economic approach for public projects. Instead of summing utilities, CBA sums individuals' **willingness to pay (WTP)** or **willingness to accept (WTA)** compensation for the project. This uses money as a common (though imperfect) metric. For the playground vs. road:
          *   Estimate how much parents with young kids *would pay* for the playground (or accept to forgo it).
          *   Estimate how much car owners/drivers *would pay* for the smoother road (or accept to forgo it).
          *   Compare the aggregate WTP for each project. The project with the higher aggregate net benefit (benefits minus costs) is considered more efficient.
          *   *Why this is different:* WTP/WTA is revealed (in principle, through surveys or market behavior) in monetary units, which *are* cardinal and interpersonally comparable (a £ is a £). However, it measures *economic value*, not *hedonic utility*, and is heavily influenced by income distribution (richer people have higher WTP for the same utility gain). It also struggles with non-market goods.
      *   **Voting:** Let the residents vote. This aggregates *ordinal* preferences (rankings) over the options.
      *   **Stated Preference Surveys:** Ask people directly (e.g., on a scale of 1-10) how much happiness they expect from each project. While introspective, this attempts a *direct* interpersonal cardinal comparison. However, it faces well-known biases.
      *   **Acknowledge the Limitation:** Recognize that a purely behaviorist, RPT-based approach cannot deliver Benthamite interpersonal utility summation. Social welfare judgments inherently require normative choices about how to weigh different individuals' interests, going beyond observable choice data. This leads into social choice theory (Arrow's Impossibility Theorem) and philosophical debates about egalitarianism, prioritarianism, etc.

  **In Conclusion:**

  Your insight that RPT provides a rigorous, behaviorist foundation for inferring preferences is correct and powerful. However, the utility functions it constructs are **ordinal and inherently individual-specific.** They contain no information that allows for the "correct" rescaling onto a common cardinal scale suitable for interpersonal summation in the Benthamite sense. Any attempt to rescale them for summation requires **additional, non-behaviorist, normative assumptions** about the comparability of happiness across individuals – precisely the kind of assumptions RPT sought to avoid by bypassing introspection.

  The reluctance of your economist colleagues stems from a deep understanding of the ordinal nature of revealed preference utility and the fundamental challenge of interpersonal comparison. While RPT is a cornerstone of modern microeconomics, its success lies in explaining choice, not in providing a scientific foundation for classical utilitarian aggregation. Bridging that gap remains one of the most enduring challenges in welfare economics and moral philosophy. Your physicist's desire for an objective, behaviorally-grounded "felicific calculus" is understandable, but the limitations revealed by the ordinality and interpersonal comparison problems are why economists generally believe Bentham's vision cannot be fully realized this way. The town council must look beyond summed revealed utilities.
