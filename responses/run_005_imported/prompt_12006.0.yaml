prompt: |-
  so we've been doing the frege-geach problem in my metaethics seminar (you know, the 'if lying is wrong then getting your little brother to lie is wrong, lying is wrong, therefore...' argument, and how expressivists have to explain why that's valid when 'wrong' only expresses disapproval instead of stating a fact). two people in my discussion group got into it after class and I honestly can't tell who won.

  Leah said Gibbard's whole hyperplan move is basically a con: saying the conditional expresses 'ruling out' the combo where you disapprove of lying but don't disapprove of getting your brother to lie doesn't explain why that combo is inconsistent, it just names it and calls the naming a solution. Owen said thats not fair -- cognitivists don't explain why P and not-P can't both be true either, consistency has to bottom out somewhere on any theory, so expressivism isnt worse off. Leah said fine, but look at what the bottoming-out actually requires here: to validate modus ponens for every complex sentence you need something that behaves exactly like possible worlds -- worlds paired with a hyperplan, closed under the same boolean structure, with 'ruled out' doing the job 'false at' does for a cognitivist. That's not bottoming out the same way, that's importing the cognitivist's machinery and slapping a new label on it. Owen said the machinery looks the same on paper but isn't doing the same job, because hyperplans are individuated by motivational role rather than representational content, which is exactly why the view can predict things truth-conditional semantics can't, like two people disagreeing morally without disagreeing about any fact.

  Can you go through their exchange move by move and say who's got the better of it at each stage (and where each one has a genuine point, not just an overall winner)? Also say if there's something important both of them are missing.
reasoning: |-
  Okay, the user is asking about a debate between Leah and Owen regarding the Frege-Geach problem and Gibbard's solution. Let me start by recalling what the Frege-Geach problem is. It's a challenge for expressivists in metaethics who say that moral statements express attitudes rather than stating facts. The problem arises when these statements are embedded in conditionals, like modus ponens arguments. For example, "If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong." Cognitivists can explain this validity through truth conditions, but expressivists need to account for it without relying on truth.

  Leah criticizes Gibbard's hyperplan solution. Gibbard uses hyperplans, which are complete plans for what to do in any situation. The idea is that moral judgments express planning states. For conditionals, "If A then B" expresses ruling out combinations where you accept A but not B. Leah argues that this doesn't explain why such combinations are inconsistent; it just labels them as ruled out. She sees this as a con, importing possible worlds machinery under a different name.

  Owen counters by pointing out that cognitivists also don't explain why contradictions like P and not-P are inconsistent; it's a basic logical feature. So expressivists aren't worse off by having their own starting point. He also mentions that hyperplans are defined by motivational roles, not representational content, allowing expressivists to explain moral disagreements without factual differences.

  Leah's next point is that hyperplans require a structure identical to possible worlds, including closure under logical operations. This makes expressivism functionally equivalent to cognitivism, just with relabeled terms. Owen disagrees, emphasizing that hyperplans are about plans and motivations, not truth conditions. He argues that the formalism might look similar but serves a different purpose, especially in handling disagreements.

  The user wants a move-by-move analysis of who has the better point at each stage and if anything is missing. Let me break down each exchange. 

  First, Leah's criticism of Gibbard's hyperplans as not explaining inconsistency. Owen's response is that all theories have primitive consistency. Here, Owen has a point because every system needs foundational norms. However, Leah is right that Gibbard's explanation might be circular if "ruling out" isn't properly grounded.

  Next, Leah's claim that hyperplans mimic possible worlds. She's correct about structural similarities, but Owen counters that the underlying motivation differs. Owen's point about hyperplans being motivationally defined is valid, as it addresses expressivism's core aim to explain moral motivation. But Leah's concern about formalism hiding substantive issues is also valid.

  Both might miss deeper issues. One is whether expressivism can handle the objectivity of logic. Another is the complexity added by hyperplans versus the simplicity of truth-conditional semantics. Also, the challenge of reducing logic to planning states without presupposing logical norms.

  The user might need clarity on whether Gibbard's solution is sufficient or if it smuggles in cognitivist elements. They might also be interested in whether expressivism can genuinely resolve Frege-Geach without compromising its anti-realist stance. Highlighting the trade-offs between structural similarity and explanatory power would be key here.
answer: |-
  Here's a move-by-move breakdown of Leah and Owen's debate, assessing the strengths and weaknesses at each stage, and identifying key points both might be missing:

  ### The Exchange Analyzed

  1.  **Leah's Opening Criticisms:**
      *   **Claim:** Gibbard's hyperplan solution is a "con." Saying the conditional expresses "ruling out" combinations (e.g., disapproving lying but not disapproving getting brother to lie) doesn't *explain* why that combination is inconsistent; it just labels the inconsistency and calls it a solution.
      *   **Leah's Strength:** Hits a crucial nerve. Expressivism promises a *distinctive explanation* of moral logic based solely on attitudes. Merely *stipulating* that certain attitude combinations are "ruled out" or "inconsistent" without grounding *why* they are inconsistent *within the expressivist framework* (e.g., why those attitudes conflict *as attitudes*) risks being circular or ad hoc. It can feel like defining the problem away rather than solving it.
      *   **Leah's Potential Weakness:** Overstates the "con" aspect. Gibbard *is* offering a *system* for explaining validity. Her point is more that the *grounding* of the inconsistency feels inadequate.

  2.  **Owen's First Rebuttal:**
      *   **Claim:** Cognitivists don't explain why "P and not-P" can't both be true either; consistency has to bottom out *somewhere* in any theory. Expressivism isn't worse off for having its own primitive notion of inconsistency.
      *   **Owen's Strength:** Absolutely correct on the core logical point. Foundational logical norms (like non-contradiction) are primitive in *any* semantic theory. Cognitivism takes the inconsistency of "P & ~P" as basic within its truth-conditional framework. Expressivism can legitimately take the inconsistency of certain *attitude combinations* (or "plan states") as basic within its framework. Demanding an explanation "all the way down" is impossible.
      *   **Owen's Potential Weakness:** Might slightly miss Leah's emphasis. Her concern isn't *just* that expressivism has a primitive, but that *this specific primitive* ("ruling out" combinations of attitudes) feels less natural or more artificially constructed for the purpose of mimicking logic than the cognitivist's truth-based primitive. Is "ruling out attitude combo X" truly a *fundamental* feature of attitudes, or is it *defined* to get logic right?

  3.  **Leah's Counter:**
      *   **Claim:** While bottoming out is necessary, the *cost* for expressivism is higher. To validate modus ponens for complex sentences, Gibbard needs structures (hyperplans/world pairs) that behave *exactly* like possible worlds – closed under Boolean operations, with "ruled out" playing the *formal role* of "false at." This isn't just bottoming out; it's importing the *entire cognitivist machinery* and slapping a new ("hyperplan") label on it.
      *   **Leah's Strength:** Makes a powerful structural point. Gibbard's formalism *does* mirror possible worlds semantics remarkably closely. The mathematical structure of the "hyperstate" space (world + hyperplan) *is* isomorphic to a space of possible worlds under cognitivism for the purpose of defining validity. The expressivist *formalism* looks suspiciously like the thing it was meant to replace. This raises the "cost" question: if you need the same complex structure, why not just be a cognitivist?
      *   **Leah's Potential Weakness:** Underplays the *interpretive difference*. While the structures are formally similar, *what the elements represent* is fundamentally different. She acknowledges this with "slapping a new label," but perhaps doesn't fully grapple with the philosophical significance Owen highlights next.

  4.  **Owen's Final Rebuttal:**
      *   **Claim:** The machinery *looks* similar on paper, but it *isn't doing the same job*. Hyperplans are individuated by their *motivational role* (what they prescribe/direct one to *do/feel*) rather than by *representational content* (what they describe as being the case). This difference is crucial and allows expressivism to explain things truth-conditional semantics can't, like two people having a genuine moral disagreement *without* disagreeing about any descriptive fact of the matter.
      *   **Owen's Strength:** Hits the core motivation for expressivism. This is the *payoff*. The formal similarity is a *tool* to capture logical structure, but the *ontology* and *explanatory targets* are different. Cognitivism explains logic via truth conditions representing reality. Expressivism explains logic via constraints on coherent planning/attitudes, explaining motivation and non-factual disagreement. The formalism allows the logic, but the *content* (motivational states vs. representational states) allows the distinctive expressivist explanations. The "new label" *matters* philosophically.
      *   **Owen's Potential Weakness:** Doesn't fully address Leah's concern about the *grounding* of the inconsistency within the attitude framework. *Why* is the combination "disapprove lying, not disapprove brother lying" motivationally incoherent? Is this incoherence primitive, or does it *presuppose* logical norms the expressivist needs to account for? Also, the "looks the same" point remains a significant challenge for expressivist parsimony.

  ### Who Has the Better of It? (Move-by-Move)

  1.  **Leah's Opening:** **Slight Edge to Leah.** She identifies a genuine worry about explanation vs. stipulation. Owen's later point about primitives mitigates but doesn't fully dissolve this.
  2.  **Owen's First Rebuttal:** **Edge to Owen.** He correctly identifies the necessity of foundational primitives in any logic. Leah's demand risks being unfairly stringent.
  3.  **Leah's Counter:** **Edge to Leah.** She powerfully highlights the significant "cost" of Gibbard's solution: replicating the formal structure of the view expressivism opposes. This is a major challenge.
  4.  **Owen's Final Rebuttal:** **Edge to Owen.** He successfully argues that the formal similarity serves a purpose (capturing logic) while the *interpretation* of the formalism delivers the key expressivist advantages (motivation, non-factual disagreement). The "new label" *is* philosophically substantive.

  ### Overall Assessment

  There's no clear "overall winner." Both make strong points reflecting deep tensions within the expressivist project:

  *   **Owen wins on defending the *legitimacy* of the expressivist starting point and its core motivations.** His points about primitives and the distinctive explanatory power regarding motivation/disagreement are robust defenses of the expressivist *agenda*.
  *   **Leah wins on exposing the significant *cost* and potential *explanatory gap* in Gibbard's specific implementation.** The structural mimicry of cognitivism and the question of whether "ruling out" genuinely emerges from attitudes or is imposed *on* them to get logic right are serious challenges. It raises the "incredulous stare" question: *Is this really just non-cognitivism anymore?*

  ### What Both Might Be Missing

  1.  **The Challenge of Logical Objectivity:** Both focus on the *structure* needed for logic, but less on *why* this specific logic (classical logic) holds. Cognitivists ground it in the nature of truth/reality. Expressivists ground it in the norms of planning/attitudes. But are these planning norms *themselves* objective? If so, how? If not, does this threaten the objectivity of moral logic? Gibbard tries to address this (norms of plan-laden thought), but it's a deep and contested issue.
  2.  **The Complexity Cost:** Leah touches on this with "machinery," but both could emphasize more how Gibbard's solution trades the *initial simplicity* of expressivism ("'wrong' just expresses disapproval!") for an *incredibly complex formal apparatus* (hyperplans, worlds, plan-laden properties, worlds*). This complexity is a significant theoretical cost compared to the relative simplicity of truth-conditional semantics for logic, even if it serves expressivist goals.
  3.  **The "Reduction" Challenge:** Owen emphasizes motivational role, but the debate highlights the difficulty of *reducing* logical relations to relations among non-cognitive states. Can the norms of *logic itself* be fully explained in terms of planning coherence without smuggling in representational or truth-like notions? Leah's complaint points to this worry. Is "ruling out" a *sui generis* planning attitude, or is it parasitic on logical negation?
  4.  **Alternative Expressivist Solutions:** The debate focuses solely on Gibbard. Mentioning other approaches (e.g., Blackburn's commitment-based account, Schroeder's being-for) could contextualize whether Gibbard's "worlds*" move is essential or just one (costly) path. However, within the scope of *this* debate about Gibbard, it's reasonable to focus.

  ### Conclusion

  The exchange brilliantly captures the central tension in sophisticated expressivism: **the need to reconcile the distinctive *nature* of moral judgment (non-representational, motivational) with the *logical structure* of moral discourse.** Owen effectively defends the *why* of expressivism and its core advantages. Leah effectively exposes the *how* cost and the lingering worry that the solution might borrow too much from the opposition. Neither "won" outright because the Frege-Geach problem, especially Gibbard's solution, represents a profound and ongoing negotiation within metaethics between capturing the logic and preserving the distinctive anti-realist motivations. The "better" position depends on whether you prioritize the distinctive explanation of moral phenomenology (Owen) or theoretical parsimony and avoiding mimicry (Leah).
