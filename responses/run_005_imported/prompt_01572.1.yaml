answer: |-
  Your analysis cuts to the heart of Ruskin's argument and the crucial distinction your conservator needs. Let's break it down:

  1.  **The Strong Claim: It's About History, Not Form**
      Ruskin is absolutely making the stronger claim. His core objection is **ontological and historical, not merely technical**.
      *   **"The spirit which is given only by the hand and eye of the workman, never can be recalled."**: The essence of the building, its true value, lies in its being the *product* of a specific time, place, culture, and individual craftsman(s). It embodies their skill, intention, limitations, and even the marks of their tools and the wear of time. This is the "life of the whole."
      *   **"It is impossible... to restore anything that has ever been great or beautiful in architecture."**: Even a materially perfect replica, indistinguishable to the naked eye, is fundamentally *not the same thing*. It lacks the causal history. It wasn't *made then*, by *those hands*, bearing the *actual marks* of its creation and existence. It's a new object pretending to be the old one.
      *   **"A destruction accompanied with false description of the thing destroyed."**: This is the crux of the "Lie." Restoration presents the new work *as if it were the original fabric*, erasing the genuine history and substituting a modern interpretation or fabrication. It obscures the truth of loss and the passage of time. A replica, however perfect, is a modern artifact masquerading as a medieval one.

  2.  **The Distinction: Preservation vs. Re-creation (The "Crutch" vs. the "Prosthetic Limb")**
      This is where Ruskin's distinction becomes vital for your conservator. He condemns *restoration* (re-creation of lost fabric) but explicitly endorses *preservation* (maintenance of existing fabric). Here's the principle:

      *   **Restoration (Re-creation):** Involves *removing* original material (even if decayed) and *replacing* it with new material shaped to mimic the *original form and surface* (or a conjectured version of it). This destroys the original fabric and replaces it with a modern fabrication. **This is the Lie.** It claims to *be* the original when it is not. It erases history.
      *   **Preservation/Conservation (Propping/Binding):** Involves *supporting, stabilizing, and protecting the existing, original fabric* without attempting to recreate lost elements or disguise the intervention. The iron ties and timber props are:
          *   **Honest:** They are visibly modern additions. They don't pretend to be medieval iron or timber. They declare themselves as necessary support.
          *   **Minimally Interventive:** They don't remove original material unnecessarily; they work *with* what survives.
          *   **Protective:** Their sole purpose is to prevent further loss of the *authentic* fabric. They preserve the evidence of time and history (weathering, damage, original tooling) rather than erasing or replacing it.
          *   **Respectful of History:** They allow the building to continue its existence *as a historical document*, showing its age, its struggles, and the care taken to preserve it. The "unsightliness" is a testament to survival, not a flaw.

      **Why doesn't propping count as restoration?** Because it doesn't *recreate lost form or surface*. It doesn't claim the new iron *is* original ironwork or that the timber prop *is* an original beam. It adds support *to* the original fabric without attempting to *be* the original fabric. It maintains the historical continuity of the surviving material.

  **The Hinge for Your Conservator's Argument:**

  Your conservator's "bite" comes from rigorously applying this distinction and defending the *value of the authentic historical fabric* itself, warts and all. Her argument with the rival architect turns on these core principles:

  1.  **Authenticity vs. Replication:** The rival (likely prioritizing aesthetics, completeness, or a symbolic "rebirth") sees value in the *form* rebuilt. The conservator sees irreplaceable value in the *authentic substance and history* of the surviving stone, even if damaged. Rebuilding the west front "as new" destroys the authentic remnants and replaces them with a modern interpretation – a Lie.
  2.  **Truthfulness in Intervention:** The rival sees the new work as a faithful recreation. The conservator sees it as a falsification, erasing the evidence of the bomb damage and the centuries of life before it. Her propping solutions are honest: they declare the damage and the effort to preserve what remains.
  3.  **The "Spirit of the Workman" vs. Modern Skill:** The rival believes modern craftsmanship can equal or surpass the original. The conservator argues (following Ruskin) that even if technically perfect, the new work embodies a *modern* spirit, understanding, and hand. It cannot summon the spirit of the medieval masons; it can only impose a modern one onto the historical void.
  4.  **History as Process, Not Just Product:** The rival wants the cathedral returned to a specific past state (likely an idealized one). The conservator sees the cathedral as a *living historical document* where the bomb damage, and the careful, minimal repairs to preserve the ruins, are now *part of its true story*. Erasing that recent, violent chapter is as much a falsification as erasing the medieval chapters would be. Preservation maintains the integrity of the *entire* narrative embedded in the fabric.

  **How Your Conservator Argues:**

  *   **Against "As New" Restoration:** "You're not rebuilding the west front; you're building a modern facsimile on the grave of the original. You're destroying the last genuine fragments of history we have left after the bomb, replacing them with conjecture and 21st-century craftsmanship, and calling it medieval. That stone you want to copy? Its surface *is* its history – the weathering, the tool marks, the centuries of touch. Your new stone, however perfectly carved, has none of that. It's a replica, not a resurrection. It’s a fiction."
  *   **For Propping/Preservation:** "My job isn't to make it look untouched by time or tragedy. My job is to *keep it standing* with as little intervention as possible, using methods that are honest and reversible. These iron ties? They hold the cracks together; they don't pretend to be original. This timber brace? It's ugly, but it keeps this wall – *this actual wall* that survived the bomb and was shaped by 14th-century hands – from collapsing. It shouts, 'I'm damaged, but I'm still here, and this is how you save me.' That's truth. That's respect. A crutch keeps the body alive; a prosthetic limb, however perfect, replaces it with something new."

  By grounding her stance in Ruskin's core principle – that the *authentic historical artifact*, with all its damage and age, holds irreplaceable value that any restoration destroys by replacing it with a modern fabrication – your conservator moves beyond sentiment to a powerful ethical and philosophical argument about truth, history, and the nature of cultural heritage. The distinction between *preserving the authentic* and *recreating the form* is the sharp edge of her conviction.
