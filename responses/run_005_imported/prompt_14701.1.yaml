  I remember that backward induction relies on common knowledge of rationality (CKR). If both players are rational and know that, and know that each knows, and so on, then defection at step one is inevitable. But in reality, common knowledge might not hold. Players might doubt each other's rationality, leading to cooperation for a few rounds. 

