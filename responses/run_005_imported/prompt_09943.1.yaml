prompt: |-
  okay so my friend and I have been in this dumb legal fight for almost a year over a small business we started together - it's worth maybe $25k tops but we've each already dropped close to $18k on lawyers trying to force the other one out. every time either of us floats settling, the other one digs in harder. we got into a whole argument about it last night: i said this is just the sunk cost fallacy, throwing good money after bad, but he said no, it's not about the past spending at all, it's that backing down now just hands the whole business to the other guy for free, so pushing on for one more round is actually the more rational move since theres still a shot at winning it outright. that kind of got me and now i can't tell if hes onto something real or just found a smarter sounding way to keep doing the same dumb thing. is there an actual difference between what hes describing and plain sunk-cost reasoning? and if we're walking into some kind of trap here, why does continuing keep feeling like the reasonable choice at every single step?
