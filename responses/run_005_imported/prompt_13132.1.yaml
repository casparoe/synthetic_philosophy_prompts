  Question 2 (on Arrow's theorem vs. bad metrics):
     Main: "Do you see the calibration/balance impossibility as a fundamental structural constraint, akin to Arrow's theorem in social choice, or is it more an artifact of our current metrics and how we define fairness?"
     Follow-up (if she says structural): "If it's structural, does that mean we must abandon one of the properties? And if so, how should society choose?"

  Question 3 (on practical advice for a team):
     Main: "Imagine a team under pressure to deploy a risk score tool next week. They can't resolve the philosophical debate. What's your practical advice for them?"
     Follow-up (likely she'll stress transparency or context): "But in practice, transparency about trade-offs might not prevent harm. How should the team mitigate the real-world impact of their inevitable choice?"

  Now, we need 5-7 more questions that go beyond the basics. Ideas:

  4. On the COMPAS case: "In the ProPublica/Northpointe dispute, you've said both were correct. But doesn't that imply that the very idea of a 'fair' algorithm is context-dependent? How do we establish what context demands?"
     Follow-up: "If context is king, who should be the arbiter of which fairness definition to use in a given setting?"

  5. On the future of fairness: "Given the impossibility result, some have turned to causal fairness or other frameworks. Do you see any promising avenues that might bypass this trade-off, or are we stuck with it?"
     Follow-up: "But causal approaches often require untestable assumptions. Isn't that a step backward for objectivity?"

  6. On the role of human judgment: "If we must choose between calibration and error rate balance, doesn't that put the burden back on human decision-makers? How should they incorporate an algorithm that we know is unfair by one definition?"
     Follow-up: "But human decision-makers are also flawed. Isn't this just passing the buck?"

  7. On the societal conversation: "Your position is often seen as a hard-line one. How do you respond to critics who argue that emphasizing this impossibility can paralyze progress or be used to justify inaction?"
     Follow-up: "But doesn't the focus on impossibility sometimes overshadow the search for partial solutions, like reducing disparities in base rates over time?"

  8. On the scope of the result: "The impossibility holds for non-trivial predictors. But in practice, many tools are only weakly predictive. Does that change the force of the argument?"
     Follow-up: "Even with weak predictors, the trade-off appears. So should we avoid using such tools altogether?"

  9. On the role of regulation: "Given this trade-off, how should regulators approach algorithmic fairness? Should they mandate one criterion, or leave it to developers?"
     Follow-up: "But if regulators pick one, aren't they choosing winners and losers? How can that be democratic?"

  10. On the long-term: "If we prioritize calibration today, does that lock in base rate disparities forever? Or can we imagine a path where we use calibrated tools to reduce disparities over time?"
