     Follow-up: "But human decision-makers are also prone to bias and error. Isn't the combination of a flawed algorithm and a flawed human likely to be worse than either alone?"

  7. (Societal conversation)
     Main: "Your position is sometimes seen as a hard-line stance that can be used to justify inaction. How do you respond to critics who say that emphasizing this impossibility paralyzes efforts to make algorithms fairer?"
     Follow-up: "But by focusing on the impossibility, are we diverting attention from more tractable issues, like reducing base rate disparities through social policies or building better data?"

  8. (Scope of the result)
     Main: "The impossibility result holds for non-trivial predictors. But many real-world tools have only modest predictive power. Does that change the implications of the trade-off?"
     Follow-up: "Even with weak predictors, the trade-off appears. So should we avoid using such tools in high-stakes domains until we can achieve both properties?"

  9. (Regulation)
     Main: "How should regulators approach algorithmic fairness given this impossibility? Should they mandate one criterion, or leave it to developers to decide?"
     Follow-up: "If regulators pick one criterion, they risk entrenching a particular view of fairness. How can we ensure democratic input in such a choice?"

  10. (Long-term)
