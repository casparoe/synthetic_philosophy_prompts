  ---

  ### Move-by-Move Analysis & Justification

  #### **(1) Elena: Textualism & Public Meaning**  
  *Score: +1 (Strong but incomplete)*  
  **Justification**:  
  Elena correctly identifies the Constitution's avoidance of explicit slavery terminology and its aspirational language (Preamble) as valid textual evidence. Her emphasis on *public meaning over framers' intent* aligns with modern originalist methodology (e.g., Scalia's textualism). However, she understates how the document's *structure* (e.g., federalism compromises) functionally protected slavery. **Strengths**: Legally coherent; avoids the "mess" of divided framer intent. **Weakness**: Ignores how contemporary audiences understood euphemisms like "other persons."  

  #### **(2) Marcus: Functional Reality & Historical Context**  
  *Score: +2 (Clearly right)*  
  **Justification**:  
  Marcus compellingly argues that the Constitution's clauses operated *de facto* as pro-slavery mechanisms. The three-fifths clause boosted slave-state political power, the slave trade clause delayed abolition, and the fugitive clause mandated federal enforcement of slavery. Historical evidence (e.g., Madison’s notes, state ratification debates) confirms these clauses were bargains to protect slavery. **Strengths**: Grounded in historical function; exposes the limits of textual literalism. **Weakness**: Overstates Douglass’s reversal as *merely* strategic, ignoring his philosophical evolution.  

  #### **(3) Elena: Motive vs. Method Distinction**  
  *Score: +2 (Clearly right)*  
  **Justification**:  
  Elena successfully decouples Douglass’s motives from interpretive validity. The framers’ *lack of consensus* on slavery (e.g., Northern delegates vs. Deep South) makes "original intent" incoherent, elevating public meaning as the only objective standard. This rebuts Marcus’s ad hominem implication that Douglass’s shift was intellectually dishonest. **Strength**: Highlights a core dilemma in originalism—when intent is fractured, text becomes paramount.  

  #### **(4) Marcus: Euphemisms as Evidence of Intent**  
  *Score: +1 (Valid but overreaching)*  
  **Justification**:  
  Marcus rightly notes that euphemisms ("other persons," "held to Service") were deliberate obfuscations to avoid moral hypocrisy while securing slavery. This *does* undermine Elena’s claim that the text’s "public meaning" was innocently liberty-oriented. **Strength**: Exposes how textualism can be manipulated by strategic drafting. **Weakness**: Conflates *drafting intent* with *functional outcome*. The euphemisms’ existence doesn’t negate that the *public* could (and did) read them as condemning slavery (e.g., abolitionists citing the Preamble).  

  ---

  ### Deeper Disagreement: Text vs. Function  
  Elena and Marcus are fundamentally at odds over **what constitutes "meaning"**:  
  - **Elena** prioritizes *semantic meaning*: The text’s linguistic content as understood by a disinterested reader.  
  - **Marcus** prioritizes *functional meaning*: How the text operated in socio-political practice.  

  This mirrors enduring legal-philosophical divides:  
  - **Textualists** (Elena): Meaning derives from words’ ordinary public sense.  
  - **Realists** (Marcus): Meaning derives from outcomes and power relations.  

  **Historical Irony**: Both readings have merit. The Constitution’s text *allowed* anti-slavery arguments (as Douglass later wielded), while its structure *enabled* slavery’s persistence. Douglass’s genius was realizing that textual ambiguity could be weaponized against the system it once protected—a move that was *both* strategically necessary *and* textually defensible.  

  **Recommendation**: The debate reveals less about Douglass than about modern historiography. To resolve it, specify your interpretive goal:  
  - For *legal theory*, Elena’s textualism wins.  
  - For *historical impact*, Marcus’s functionalism wins.  
  Douglass, ever pragmatic, embraced the former to achieve the latter.
