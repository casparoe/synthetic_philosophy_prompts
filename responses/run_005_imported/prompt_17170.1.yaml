  I recall Malachi 1 criticizing empty ritual without justice - implying God never desired sacrifice intrinsically. That prophetic voice aligns with Maimonides. Still, the user might appreciate acknowledging how Nahmanides captures the rite's emotional power. A synthesis? But the question demands choosing.

