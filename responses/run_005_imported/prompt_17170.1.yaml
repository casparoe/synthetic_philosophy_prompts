  Nahmanides' "substitutionary symbolism" excels at interpreting visceral details - the blood manipulation as life-for-life, fatty portions burning as "God's portion." This feels existentially resonant. Yet it struggles with textual discontinuities like Abraham's sacrifices lacking prescribed details. The patriarchal disconnect seems significant.

