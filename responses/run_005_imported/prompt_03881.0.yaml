prompt: |-
  So I got nerd-sniped this weekend trying to build a toy version of a Hutter-Prize-style compressor, which sent me down a Wikipedia/blog rabbit hole on Kolmogorov complexity and Solomonoff induction. I'm a backend engineer, not a philosopher, so tell me if I'm butchering this, but the pitch seems to be: Occam's Razor gets formalized as "prefer whatever hypothesis has the shortest program that outputs your data," and the invariance theorem is what's supposed to save this from being totally made up, since any two universal Turing machines can only disagree about a string's complexity by some fixed constant that doesn't depend on the string itself. Fine so far. But then a few threads I read pointed out that this "constant" can be made as big as you want, since you can literally build a weird machine with any string wired in as a short program, so what counts as "simple" is completely relative to which machine you happened to start with. Other comments pushed back and said that constant gets washed out asymptotically because Solomonoff induction has these convergence guarantees, so it supposedly doesnt matter in practice which reasonable machine you picked.

  I genuinely can't tell if the invariance theorem is doing real philosophical work or if its a bit of a shell game that just relocates the arbitrariness instead of removing it. Could you write me an essay that actually takes a side: does the invariance theorem rescue Kolmogorov complexity / Solomonoff induction as a genuinely objective formalization of Occam's Razor, or does the choice of universal machine smuggle in exactly the kind of subjectivity Occam's Razor is supposed to rule out? Please actually weigh the asymptotic/convergence arguments against the finite-data/arbitrary-constant objection instead of just listing both sides, and land on a real conclusion at the end -- something qualified like "objective only in the limit, not for any realistic finite case" would count as landing somewhere, a wishy-washy "reasonable people disagree" ending would not. If you can get into the actual mechanics a bit rather than staying at the popular-science level that'd be great, since I've already read like five explainers that all stop right before the interesting part.
