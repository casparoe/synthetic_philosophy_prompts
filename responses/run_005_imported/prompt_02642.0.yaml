  Okay, let me start by unpacking the user's query. They're working on a term paper about early boundary disputes between science and pseudoscience, specifically focusing on Henry Sidgwick's 1882 address to the Society for Psychical Research (SPR). The user has two main questions: first, what exactly Sidgwick is calling "scandalous," and second, whether his use of the word "scandal" contradicts his later claim of neutrality. They also want to know if referencing "competent witnesses" is a valid evidential point or just an appeal to authority.

  First, I need to parse Sidgwick's quote. The grammar is a bit convoluted. The core of his argument seems to be that it's scandalous that the dispute about these phenomena persists despite numerous credible witnesses and the phenomena's potential scientific importance. The key here is the unresolved nature of the dispute itself, not the reality of the phenomena. He's frustrated that science hasn't addressed these claims adequately.

  Next, the user's concern about neutrality versus the word "scandal." I should consider the context of the time. The late 19th century was rife with public interest in spiritualism, and mainstream science was dismissive. Sidgwick, as a philosopher, would value empirical investigation. His use of "scandal" likely reflects his frustration with the scientific community's inaction, not a pre-judgment of the phenomena's validity. His call for neutrality in the SPR's methods supports this interpretation—he wants thorough investigation without bias.

  Then there's the point about "competent witnesses." The user questions whether this is an appeal to authority. In Sidgwick's era, witness testimony was a common scientific tool before modern methods. He's emphasizing the credibility of observers to argue that their claims deserve investigation, not that they're definitive proof. This is evidential in the sense that credible reports warrant attention, even if they're not conclusive.

  The user's deeper needs might include understanding how Sidgwick positions the SPR in the science-pseudoscience debate. They might also be exploring how boundary disputes are framed rhetorically. Sidgwick's approach shows the tension between advocating for investigation while maintaining scientific neutrality. Highlighting his methodological stance could strengthen the user's analysis of how emerging fields negotiate legitimacy.

  I should also connect Sidgwick's arguments to the broader context of scientific authority. By pointing out the scandal of unresolved disputes, he's critiquing the scientific establishment's dismissal of certain phenomena without investigation. This positions the SPR as filling a methodological gap, which is crucial for the user's paper on boundary disputes.

  Finally, ensuring clarity on each point: defining the scandal as the persistence of dispute, reconciling "scandal" with neutrality through methodological advocacy, and explaining the role of witness testimony as a call for investigation rather than proof. This should help the user analyze Sidgwick's rhetoric and its implications for the SPR's role in the history of science.
answer: |-
  Here's a breakdown of Sidgwick's argument, addressing your specific questions:

  1.  **What is "scandalous"?**
      *   **The Core Scandal:** Sidgwick explicitly identifies the **mere persistence of the unresolved dispute itself** as the scandal. He is *not* primarily calling the *reality* of the phenomena scandalous (though he hints at its potential importance), nor the *disbelief* specifically. The scandal is the *ongoing state of controversy* despite the circumstances.
      *   **Why it's scandalous (His Supporting Points):**
          *   **Enlightened Age:** It's happening in an "enlightened age," implying such fundamental disputes should be resolvable by reason and evidence.
          *   **Potential Scientific Importance:** He emphasizes the *potential* enormous scientific significance ("quite impossible to exaggerate") of these phenomena *if* even a small fraction ("a tenth part") of the reports are true. The unresolved dispute prevents science from potentially gaining this knowledge or definitively dismissing it.
          *   **Volume & Quality of Testimony:** "So many competent witnesses" have declared their belief. This suggests the evidence *prima facie* deserves serious investigation, not perpetual dismissal.
          *   **Widespread Interest:** "So many others" are profoundly interested in having the question settled. The dispute matters to a significant portion of the population/intelligentsia.
          *   **Collective Inaction/Incredulity:** Despite the above points (potential importance, credible reports, public interest), the "educated world, as a body" remains stuck in simple "incredulity" – meaning blanket dismissal without adequate investigation or resolution.

      **Plainly stated:** Sidgwick finds it scandalous that, in an age of science and reason, a question of potentially immense scientific importance, backed by numerous credible reports and generating significant public interest, remains stuck in unresolved controversy because the educated establishment simply dismisses it without proper investigation.

  2.  **"Scandal" vs. Neutrality:**
      *   **Consistency:** Sidgwick's use of "scandal" **is largely consistent** with the claimed neutrality regarding the *phenomena themselves*. His outrage is directed at the **methodological and institutional failure**, not primarily at the *outcome* of disbelief.
          *   **Target:** He is scandalized by the *attitude* ("simply in the attitude of incredulity") and the *inaction* of the "educated world," not specifically by the *fact* that they disbelieve. The scandal is the refusal to properly investigate and settle the question *despite the reasons to do so*.
          *   **Focus on Process:** His call for the SPR is for a neutral, rigorous *process* ("without any foregone conclusion," "unpledged") to *resolve* the scandalous state of perpetual dispute. The scandal *is* the unresolved dispute; the solution is neutral investigation.
      *   **Potential Tension:** There is a *hint* of bias in his phrasing. Calling the phenomena "marvellous" and emphasizing their potential scientific importance *if true* suggests he leans towards thinking they *might* be real and significant. The sheer force of "scandal" also implies he finds the establishment's dismissal unreasonable *given the evidence presented so far*. However:
          *   He doesn't declare the phenomena *are* real. His focus remains on the *dispute* and the *failure to investigate*.
          *   His commitment to neutrality for the *Society's work* is clear and explicit. He separates his personal frustration with the *status quo* from the methodology the SPR must employ.
      *   **Conclusion:** While Sidgwick likely *hoped* the phenomena would be validated (making the scientific establishment's dismissal look foolish), his primary target with "scandal" is the **lack of rigorous scientific engagement** with the question, *not* the specific conclusion of disbelief. He frames neutrality as the *antidote* to the scandal of unresolved controversy.

  3.  **"Competent Witnesses" - Evidential Weight or Appeal to Authority?**
      *   **It's doing real, though limited, evidential work** in Sidgwick's argument, not merely being a fallacious appeal to authority.
      *   **Why it's evidential (in context):**
          *   **Basic Scientific Principle:** Reliable observation is foundational to science. Witness testimony *is* a form of evidence, especially for phenomena that are difficult or impossible to replicate on demand (like historical events, rare natural occurrences, or, potentially, spontaneous psychic events).
          *   **Threshold for Investigation:** Sidgwick's point isn't that "competent witnesses = proof." His point is that testimony from numerous credible observers (people deemed reliable in other contexts) creates a *prima facie case* that *demands investigation*. It shifts the burden of proof. Ignoring such testimony *without investigation* is unscientific.
          *   **Contrasting "Incredulity":** He contrasts the weight of this testimony ("so many competent witnesses") with the "simply... attitude of incredulity" of the educated world. The scandal lies in the *disconnect* between the apparent evidence and the dismissive attitude. The witnesses establish that there's *something* substantive to investigate, not that the investigation's outcome is predetermined.
      *   **Limitations Sidgwick Implicitly Acknowledges:**
          *   He immediately follows the witness point by saying the question remains *undetermined* ("yet that the educated world... should still be simply in the attitude of incredulity").
          *   The SPR's *raison d'être* is to move *beyond* mere testimony to more rigorous methods (controlled experiments, critical analysis of evidence, exposing fraud). The witnesses provide the *motivation* and *justification* for launching this more rigorous investigation; they are not presented as the final word.

  **In Summary:**

  1.  Sidgwick calls the **persistent, unresolved controversy** surrounding psychic/spiritualistic phenomena a "scandal." This scandal stems from the scientific establishment's blanket dismissal ("incredulity") *despite* the phenomena's potential importance, the volume of seemingly credible testimony, and public interest, all occurring in an "enlightened age" that should resolve such matters through investigation.
  2.  While his strong language ("scandal," "marvellous," emphasis on potential importance) hints at a personal leaning towards the phenomena's possible reality, his outrage is primarily directed at the **lack of proper scientific investigation**. He sees the SPR's **neutral methodology** as the solution to this scandal, making his position largely consistent.
  3.  Referencing "competent witnesses" serves **legitimate evidential work** by establishing a *prima facie case* demanding investigation and highlighting the unreasonableness of *a priori* dismissal. It justifies launching the SPR's work, even while Sidgwick acknowledges testimony alone is insufficient for proof.

  This passage perfectly captures the SPR's founding ethos: profound frustration with mainstream science's dismissal of areas deemed "beyond the pale," coupled with a commitment to applying the most rigorous scientific methods *available at the time* to investigate them, precisely to resolve the scandal of perpetual, unresolved controversy. Sidgwick is arguing for expanding the boundaries of legitimate scientific inquiry.
