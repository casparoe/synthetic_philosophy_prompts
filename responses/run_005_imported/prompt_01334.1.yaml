  First, I need to break down each metaphor. The door hinge emphasizes the necessity of stability for doubt and inquiry to function. If hinges move, the door doesn't work. The riverbed, on the other hand, shows that the bedrock of certainty can change gradually over time. The user feels these are contradictory. But maybe Wittgenstein is addressing different aspects here. 

  The user's main concern is whether hinges can change without losing their special status as non-empirical propositions. They’re worried that if hinges drift, they’re just old beliefs, not a distinct category. That’s a valid point. So the reconciliation lies in understanding the functional role of hinges versus their historical contingency. 

