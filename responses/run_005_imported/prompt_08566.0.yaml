answer: |-
  Here's a graded exam script with detailed, line-by-line comments suitable for your novel scene. The TA would likely write these directly on the paper in red pen:

  ```json
  {
    "grade": "17/20",
    "comments": [
      "**P1, L1-3:** Good definition & attribution to Parfit. Correctly identifies the core tension.",
      "**P1, L3-7:** Excellent choice of example - medically accurate & clearly illustrates the dilemma. Precise framing of 'couldn't have existed'.",
      "**P1, L7-9:** Correct harm analysis: 'not worse off' + crucial qualification about life worth living. ✓",
      "**P1, L9-12:** PROBLEM: Conflating Nonidentity with Repugnant Conclusion! RC concerns population ethics/total utility tradeoffs. Nonidentity is about *identity-dependent* harms. **-1**",
      "**P1, L12-13:** Misrepresents Parfit! He *doesn't* conclude 'no wrong done'. He argues it's wrong but *not* because it harms *that specific child* (see Reasons & Persons Sct 124). **-1**",
      "**P1, L13-14:** 'Useful corrective...' is editorializing, not explanation. Save normative judgments for essay questions. **-0.5**",
      "**P2:** Missing deeper analysis: Needed to explicitly name *why* person-affecting principles struggle (they require identifiable victims made *worse off*). Briefly mention alternative approaches (e.g., impersonal principles/causing 'bad states of affairs'). **-0.5**"
    ]
  }
  ```

  **Why this works for your scene:**

  1.  **Authentic Grading Nuance:** Shows the TA's expertise by catching subtle but significant errors (conflation with RC, Parfit misattribution) that undergrads commonly make. The point deductions are justified academically.
  2.  **Red-Pen Specificity:** Comments reference *exact lines* and use philosophy-specific markup (✓, **-1**, quoting text snippets). The tone is fatigued but precise ("PROBLEM:", "Misrepresents!").
  3.  **TA Burnout Subtext:** The curtness ("Save normative judgments..."), minor frustration at common mistakes ("Conflating!"), and the nitpicky "-0.5" deduction feel like 2AM grading.
  4.  **Plot-Ready Hooks:** The misrepresentation of Parfit's view (*"He argues it's wrong but not because it harms that specific child"*) mirrors the TA's own advisor troubles (impersonal institutional harm vs. personal failing?). The missing "alternative approaches" could echo her feeling trapped by limited options.
  5.  **Academic Weight:** References Parfit's text structure ("Sct 124"), corrects terminology ("identity-dependent harms," "person-affecting principles"), and demands precision – feels like a real philosophy dept.

  **Key Corrections Embedded:**

  -   **Repugnant Conclusion ≠ Nonidentity:** They address different problems (total utility vs. harm to future individuals).
  -   **Parfit's Actual View:** He *does* think the mother acts wrongly, just not for *person-affecting reasons*. The wrongness is impersonal.
  -   **Person-Affecting Principle:** The core challenge is its requirement of a *comparatively worse-off identifiable individual*.
  -   **TA Voice:** Mixes validation ("Good," "Excellent," "✓") with sharp corrections ("PROBLEM," "Misrepresents," "Missing deeper analysis").

  This gives you concrete text for the red-pen comments while leaving room for your character to spiral from the grading minutiae into her personal parallels. The 17/20 feels realistic – a strong but flawed answer from a bright undergrad.
