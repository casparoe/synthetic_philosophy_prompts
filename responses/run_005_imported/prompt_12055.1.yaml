answer: |-
  You've hit on a fascinating tension in Sidgwick's thought. He's neither fully embracing nor rejecting Hume; he's **redefining the terms and exposing the limits of Hume's framework** when applied to *genuinely novel phenomena*. Here's a breakdown of his argument and its implications:

  ### 1. Sidgwick vs. Hume: The Crucial Redefinition
  *   **Hume's Core Argument:** A "miracle" is defined as a violation of natural law. Since natural laws are established by "firm and unalterable experience," the improbability of a miracle is effectively *infinite*. Any testimony claiming a miracle is *always* more likely to be mistaken or deceptive than the miracle itself is likely to be true.
  *   **Sidgwick's Redefinition:** He shifts the focus from "violation of natural law" to **"entirely novel and strange"** experience.
      *   "Contrary to experience" doesn't mean *logically impossible* or *inherently violating a known law*; it simply means **unprecedented within our *current, systematized* knowledge**.
      *   **Key Point:** Human history is *full* of initially "novel and strange" phenomena that later became familiar and integrated into science (e.g., magnetism, electricity, germ theory, Antarctic ecosystems, quantum entanglement). Novelty ≠ Impossibility.

  ### 2. Sidgwick's Core Argument: The Unknowable Prior
  *   **The Problem:** We need to weigh two improbabilities:
      1.  **Improbability A:** That the *novel event* actually occurred (given current knowledge).
      2.  **Improbability B:** That *all the testimony/evidence* for it is mistaken or fraudulent.
  *   **Hume's Shortcut:** He essentially argues that Improbability A is *always* infinitely greater than Improbability B for "miracles."
  *   **Sidgwick's Rejection of the Shortcut:**
      *   Improbability A *exists* and *increases* with the degree of novelty. Sidgwick agrees with this much.
      *   **The Fatal Flaw:** We **cannot quantify** Improbability A. Why?
          *   To quantify it, we'd need to know **the ratio of "what we know" to "what we don't know" about the universe.**
          *   **But we fundamentally *do not know* this ratio.** We don't know the size or nature of the unknown territory. Our current knowledge is a tiny island in an ocean of potential unknowns.
      *   **The Teeth:** This isn't *just* a shrug ("can't put a number on it"). It's a **profound epistemological limitation**. Hume *assumes* he knows the scope of the possible based on current experience. Sidgwick argues this assumption is baseless *because we know we are ignorant of vast swathes of reality*. We lack the data to set the prior probability for *genuinely novel* phenomena. Hume treats current science as the complete map; Sidgwick recognizes it's an incomplete sketch.

  ### 3. Where Sidgwick Lands (The Unsatisfactory Position)
  *   **He Agrees With Hume On:**
      *   Novel claims *are* inherently improbable based on current knowledge.
      *   This improbability increases with the degree of novelty.
  *   **He Radically Departs From Hume On:**
      *   **Novelty ≠ Miraculous/Violation:** It just means *outside current models*. It could be a new natural phenomenon.
      *   **The Quantification Problem:** We cannot *know* *how* improbable a novel event is because we don't know the scope of the unknown. Hume's "infinite improbability" is an unjustified overstatement.
      *   **The Testimony Balance:** Therefore, we **cannot establish an absolute rule** (like Hume's) that testimony *must always* be less reliable than the event is improbable. In some cases of extreme novelty, the event's improbability *might* be so vast (though unquantifiable) that no testimony could overcome it. In other cases of lesser novelty (but still strange), sufficiently rigorous testimony *could* potentially overcome the initial improbability. *We lack the intellectual scales to decide this generally.*

  ### 4. Answering Your Core Questions
  *   **Hume's Side?** He's dismantling the *absolutism* of Hume's argument against testimony for the novel/strange, while accepting the *general principle* that novelty lowers prior probability. He's on the side of **epistemological humility** regarding the unknown.
  *   **The "Proportion" Argument:** It has **real teeth**. It's not just "can't put a number on it," it's "we lack the fundamental parameter *required* to even attempt putting a meaningful number on it." Bayesian frameworks *require* a prior probability. Sidgwick argues that for *genuinely novel* phenomena, **we cannot establish a justified prior** because we lack the necessary knowledge of the universe's scope. You *can* slap a Bayesian framework on it, but your prior will be arbitrary or based on metaphysical assumptions, not empirical knowledge. Sidgwick highlights the **foundational uncertainty** underlying that prior.
  *   **The Practical Answer ("How weird is too weird?"):** Sidgwick **explicitly refuses to give a quantitative answer**. He concludes there is **no fixed threshold**. His point is precisely that **nobody *can* give a rigorous, universally applicable answer** because:
      *   The degree of novelty varies.
      *   The quality/quantity of evidence varies.
      *   The *actual* improbability of the novel event is unknowable.
  *   **The Practical Implication:** Sidgwick is arguing for **rigorous methodology** (exactly what the SPR aimed for) to minimize Improbability B (mistaken testimony/fraud). If you can make Improbability B *extremely* small through careful investigation, replication, and control, then *even for highly novel phenomena*, the claim *might* become credible, *despite* the inherent (but unquantifiable) improbability of the event itself. The burden shifts to producing extraordinarily strong evidence. He's opening the *possibility* for evidence to overcome novelty, where Hume slammed the door shut. The answer to "how weird is too weird" is context-dependent: "How strong is your evidence, and how much have you ruled out error/fraud?"

  ### In Essence
  Sidgwick is saying: **"Hume is right that novelty makes claims improbable, but wrong to claim we *know* this improbability is always infinite or that testimony can *never* overcome it. We simply don't know enough about the universe to make such absolute pronouncements. Therefore, the only intellectually honest approach to the genuinely novel is to investigate it with extreme methodological rigor, acknowledging both the inherent improbability *and* our profound ignorance."** He replaces Hume's dogmatic skepticism with a call for meticulous, open-minded investigation grounded in the recognition of epistemic limits. His work with the SPR wasn't a contradiction of his philosophical rigor; it was an *application* of it to the edge of the known.
