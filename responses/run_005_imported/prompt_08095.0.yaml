answer: |-
  Based on Anscombe's rigorous application of the Principle of Double Effect (PDE) in *Mr. Truman's Degree*, she would **unequivocally condemn "double-tap" drone strikes as murder, specifically because they involve the *intentional targeting of non-combatants*, violating the core tenet of non-combatant immunity in the same way she condemned the atomic bombings.**

  Here's the breakdown using her own logic:

  1.  **The Core of Anscombe's Argument Against Truman:**
      *   **Intention is Paramount:** For Anscombe, the *intention* behind the act is morally decisive. It's the difference between murder and potentially excusable homicide.
      *   **Distinguishing Intended Effects vs. Foreseen Side-Effects:** The PDE permits an action with both good and bad effects only if:
          *   The act itself is good or neutral (e.g., destroying a legitimate military target).
          *   The *intention* is only the good effect (e.g., destroying the target, weakening the enemy).
          *   The bad effect (e.g., civilian deaths) is *not intended* as an end or a means, but merely *foreseen*.
          *   The good effect is proportional to the foreseen bad effect.
      *   **Truman's Guilt:** Anscombe argued that destroying Hiroshima/Nagasaki *in order to* kill civilians and terrorize Japan into surrender meant Truman *intended* the deaths of civilians *as a means* to his end (surrender). This made the act intrinsically murderous, regardless of the proportionality argument or the ultimate good of ending the war. The civilian deaths weren't a tragic side-effect; they were the chosen *mechanism*.

  2.  **Applying Anscombe's Logic to "Double-Tap" Strikes:**
      *   **The Act:** Launching a second strike minutes after the first, explicitly timed to hit rescuers and first responders arriving at the scene.
      *   **The Intention:** The *specific purpose* of the second strike is to kill individuals responding to the carnage of the first strike. This group demonstrably includes non-combatants: medical personnel (even if military medics, they are generally protected under IHL while performing duties), civilian bystanders, family members, local volunteers, journalists, etc.
      *   **Why it Violates PDE (Anscombe's Interpretation):**
          *   **Intending Death as a Means:** The deaths of the rescuers/first responders *are not a side-effect*; they are the *intended effect* of the second strike. The strike is launched *because* people are gathering to help. Their deaths are the *means* to achieve the military objectives, such as:
              *   Ensuring the initial target is dead (killing those attempting rescue).
              *   Killing associates who might rush to the scene.
              *   Creating terror and deterring future assistance to targeted individuals/groups.
              *   Maximizing enemy casualties by exploiting predictable humanitarian responses.
          *   **Non-Combatant Immunity Directly Violated:** The targets of the second strike are individuals engaged in a fundamentally humanitarian act – aiding the wounded. Even if some combatants *might* be among the rescuers, the strike is indiscriminate by design, targeting the *act of rescue itself* and thus inevitably targeting protected non-combatants. Anscombe was fiercely protective of the absolute prohibition against intentionally targeting non-combatants.
          *   **Act Itself is Evil:** Anscombe would likely argue that the *nature* of the act – launching a strike timed to exploit compassion and humanitarian aid – is intrinsically vile and contrary to the basic principles of humanity underlying just war theory. It weaponizes human decency.
          *   **Foresight Becomes Intention:** While a defender might claim they only "foresee" civilians being killed while intending to kill combatant rescuers, Anscombe would dismiss this as sophistry. The tactic is designed knowing civilians *will* be present and *will* be killed. The predictable, indeed *desired*, outcome (maximizing casualties among responders) means the death of civilians is not merely foreseen but accepted as part of the plan – effectively intended.

  3.  **Counter-Arguments Defenders Might Try (and Why Anscombe Would Reject Them):**
      *   **"The *real* target is combatants rushing to the scene!"**
          *   **Anscombe's Rebuttal:** This ignores the reality that the strike deliberately occurs when the scene is flooded with non-combatant rescuers. It's indiscriminate targeting of a location *because* it's full of people helping the wounded. The *method* guarantees non-combatant deaths and exploits their presence. If the goal is only combatants, a different method must be used. Intending the strike *at that specific time* intends the deaths occurring *at that time*, including civilians.
      *   **"The deaths of non-combatants are just a proportional side-effect of killing dangerous combatants!"**
          *   **Anscombe's Rebuttal:** Proportionality is irrelevant if the act itself is intrinsically wrong because it involves *intending* the death of the innocent. PDE only allows proportionality to weigh the *foreseen but unintended* bad effect against the good effect. Here, the death of non-combatant rescuers *is intended* as part of the strike's purpose. You can't justify murder with proportionality.
      *   **"It's a separate strike with its own legitimate target (the rescuers, who might be combatants)!"**
          *   **Anscombe's Rebuttal:** This fundamentally misrepresents the status of rescuers. Medical personnel and those *hors de combat* (wounded) are protected. Civilian rescuers are non-combatants. Attacking individuals *because* they are performing a humanitarian duty is a betrayal of the very distinction between combatant and non-combatant that just war theory rests upon. Labeling all rescuers as "combatants" is a cynical perversion of the terms. The strike targets the *humanitarian response*, not a specific military action.

  **Conclusion:**

  Using Anscombe's razor-sharp focus on intention and her absolute prohibition against *intending* the death of non-combatants, **double-tap strikes are a textbook example of what she condemned.** The second strike is launched *with the deliberate purpose* of killing individuals responding to the initial attack, knowing full well that this group includes protected non-combatants. Their deaths are not a tragic accident; they are the predictable and desired outcome of the tactic, used as a *means* to achieve military goals. Therefore, **Anscombe would conclude that double-tap strikes constitute murder, just as she argued the atomic bombings did.** No twisting of the double-effect logic can justify intending the death of the innocent as a means to an end, no matter how strategically desirable that end might seem. Her condemnation would be absolute and uncompromising.
