prompt: |-
  Been on a bit of a rabbit hole this week rereading old LessWrong stuff — somebody in a discord I'm in linked Scott Garrabrant's "geometric rationality" sequence, and now I can't stop thinking about how it relates to the Kelly criterion, which i already knew reasonably well from the poker/investing corner of the blogosphere. The gist I've pieced together is that ordinary expected utility reasoning is basically "arithmetic" — you average outcomes, weighted by probability, or by however many people/selves are involved — and Garrabrant's move is to swap that arithmetic averaging for a geometric one, i.e. multiply things together and take a root/log instead of summing and dividing. Apparently Kelly betting just falls out of this as a special case, since your bankroll compounds multiplicatively across bets, so it makes sense to care about the geometric growth rate rather than the plain expected value of your wealth. But that's about the extent of what I can work out on my own, and I'm sure I'm mangling parts of it.

  So: could you properly compare Kelly betting to this broader geometric rationality idea? Im mainly trying to understand two things — first, exactly which "arithmetic vs geometric" swap Kelly is a special case of (across time-steps/future selves? across possible worlds? across other agents you're bargaining with? some mix?), and second, whether the general geometric rationality framework is doing something importantly different from just Kelly betting applied more broadly, or whether it's basically the same move with better branding. If there are cases where the general framework recommends something plain single-agent Kelly betting wouldn't — bargaining between agents, or aggregating credences from different models/hypotheses, say — I'd love a concrete worked example, since that's the part I have the least intuition for. No need to reexplain Kelly betting from scratch, I just don't have a great handle on the more general story yet.
reasoning: |-
