answer: |-
  Let's break this down with a concrete toy example. The "undermining futures" problem is a deep tension in Lewis's Humean Best System Account (BSA) when probabilistic laws are involved. Here's a minimal world to illustrate it:

  **The Toy World: "CoinFlipLand"**
  *   **Spacetime Structure:** Only 10 points in time (T1 to T10).
  *   **Events:** At each time (T1-T10), a coin is flipped. The outcome is either Heads (H) or Tails (T).
  *   **Humean Base:** The entire history of the world is *just* this sequence of 10 outcomes (e.g., H, T, H, H, T, T, H, T, T, H).
  *   **The Goal:** Find the Best System describing CoinFlipLand. We want a system with laws, including a probabilistic law about coin flips (if possible), that best balances **simplicity** and **strength** (fit with the actual outcomes).

  **Scenario 1: A "Normal" World**
  *   **Actual Outcomes:** Suppose the sequence is perfectly balanced: H, T, H, T, H, T, H, T, H, T (5 H, 5 T).
  *   **The Best System (Plausibly):**
      *   **Law:** "On any flip, P(Heads) = 0.5"
      *   **Auxiliary:** "There are 10 flips."
  *   **Why Best?** It's extremely simple. It has perfect **fit** – the actual sequence has exactly the frequency (50%) predicted as most likely by the probabilistic law. Any system claiming P(H) = 0.6 or 0.4 would be less simple and have worse fit (the actual frequency of 50% is less likely under those chances). A system without a probabilistic law (e.g., just listing the outcomes) would be strong (perfect fit) but maximally *complex*. The P=0.5 system wins.

  **Scenario 2: An "Undermining Future" World**
  *   **Actual Outcomes:** Now suppose the sequence is: T, T, T, T, T, T, T, T, T, T (10 Tails). A massive coincidence!
  *   **The Best System *Now*:** What system best balances simplicity and strength *given this entire history*?
      *   **Option A (P=0.5 System):** "P(Heads)=0.5". **Simplicity:** High. **Strength/Fit:** *Terrible*. The law predicts a 50% frequency as overwhelmingly probable. Getting 0% is astronomically unlikely (chance = (0.5)^10 = 1/1024). The fit is awful.
      *   **Option B (P=0 System):** "P(Heads)=0". **Simplicity:** Still quite simple (assigning a chance of 0 or 1 is simple). **Strength/Fit:** *Perfect*. The law forbids Heads and the actual sequence has no Heads – perfect match.
      *   **Verdict:** Option B (P=0) wins. It's almost as simple as Option A but has vastly superior fit given this bizarre outcome sequence. *The best system for this world says the chance of Heads was always 0.*

  **The Problem: Undermining the Past**
  Now, put yourself at **T5** in this "10 Tails" world. The outcomes so far are T, T, T, T, T (5 Tails). You try to figure out the *current* chances using the Humean BSA.

  1.  **What is the Best System *at T5*?** You only know the past (5 Tails). The future is unknown.
      *   The sequence so far (5 T) is *compatible* with the P=0.5 system. While 5 Tails in a row is somewhat unlikely under P=0.5 (chance = 1/32), it's not *so* unlikely that it destroys the system's fit, especially since you don't know the future. A system saying P(H)=0.5 is still very simple and has decent fit *so far*.
      *   A system saying P(H)=0 also fits perfectly so far, but it's less *simple* than P=0.5 *if* you think the future might bring Heads. Why? Because the P=0 system *rules out* any Heads occurring later, which seems like an overly strong commitment given only past data. **Plausibly, at T5, the best system is still "P(Heads)=0.5".** Let's call this **Chance(T5, Heads) = 0.5**.
  2.  **The Principal Principle (PP):** This is the crucial link between objective chance and rational belief. Roughly: If you know the objective chance of event E is C, and you have no other "inadmissible" information, then your rational credence in E should be C.
      *   At T5, knowing only the past (5 Tails) and knowing that Chance(T5, Heads) = 0.5 (according to the best system *at T5*), PP tells you your rational credence that the *next flip* (at T6) is Heads should be 0.5.
  3.  **The Undermining Future:** Now, imagine the *actual* future unfolds: T, T, T, T, T (5 more Tails). We saw that in this *complete* world, the *final* best system says Chance(Heads) = 0 *at all times*.
  4.  **The Contradiction:**
      *   **PP + Best System at T5:** Tells you at T5 that you *should* have credence 0.5 in Heads at T6.
      *   **Final Best System:** Tells you that at T5, the *actual, true* objective chance of Heads at T6 was *not* 0.5, it was 0. Why? Because the *entire* pattern (10 Tails) makes the P=0 system best, and this system assigns a chance of 0 to Heads *at every time*.
      *   **The Headache:** The chance assigned by the best system *at a time* (T5) is undermined by *future* events that make the *final* best system assign a different chance to that very same event (Heads at T6). The PP told you to believe something (credence 0.5) based on the chance you *thought* was true at T5, but the final Humean facts reveal that the *true* chance (according to the final mosaic) was different (0). This creates a fundamental conflict for the Humean:
          *   Can the PP refer to the *current* best system (which might be wrong about the final laws)?
          *   Or must it refer to the *final* best system (which you can never know until the end of time)?

  **Why the Anti-Humean (Necessitarian) Doesn't Have This Problem**

  Your friend is exactly right. The core difference is what *makes* a chance statement true.

  1.  **Humean (Lewis/BSA):** Chances supervene on the *entire* Humean mosaic (the pattern of particular events across all spacetime). The chance *is* whatever value the best system assigns *once the whole pattern is in*. Chances are *defined by* the outcomes. This is why future outcomes can "reach back" and change what the chance *was* at an earlier time.
  2.  **Anti-Humean (Armstrong/Dretske):** Chances (or propensities) are *primitive, fundamental features of reality*. They are part of the laws, which are irreducible relations between universals (e.g., the universal "CoinFlip" has an irreducible propensity of 0.5 to produce "Heads" on any instantiation). The propensity is a *cause* or *disposition* inherent in the situation.
      *   **Consequence:** The propensity/chance at T6 for Heads is fixed *at T6* by the fundamental laws/properties present *at that time*. It does *not* depend on future events or the global pattern.
      *   **In the Toy World:** The necessitarian law might be: "Whenever a coin flip occurs, there is a primitive necessitation relation such that P(Heads) = 0.5." This is a fundamental, timeless fact.
      *   **In Scenario 2 (10 Tails):** The law *still* says P(Heads) = 0.5 for *every single flip*, including at T6. The fact that *all 10 flips* landed Tails is just an incredibly improbable coincidence *according to the law*, but it doesn't change what the law/propensity *was* at the time of each flip. The outcome doesn't define the propensity; the propensity explains (or fails to explain) the outcome.
      *   **No Undermining:** At T5, the objective chance/propensity for Heads at T6 is *already* 0.5, fixed by the fundamental law. The PP tells you your credence should be 0.5. The future run of Tails doesn't change this fact. It just makes the sequence very improbable. The chance assignment at T5 is *not* undermined by the future because the chance is not *made true* by the future. It's made true by the fundamental law operating *at that time*.

  **In Summary:**

  *   **The Undermining Problem (Humean):** Because Humean chances supervene on the *entire* pattern of events (past and future), future events can determine that the *true* chance at an earlier time was different from what the best system *at that earlier time* would have said. This creates a conflict with the Principal Principle, which links rational belief to chance.
  *   **Anti-Humean Escape:** Anti-Humeans ground chances/propensities in irreducible, fundamental laws or properties that exist *at the time* of the chancy event. These chances are not defined by or dependent on the global pattern of outcomes; they are prior to and explain (or fail to explain) those outcomes. Future outcomes cannot "reach back" and change what the propensity *was*; they can only be improbable relative to it. This severs the dependency on the future that causes undermining.

  Don't be embarrassed – this is notoriously tricky! Lewis himself struggled with it, leading him to propose the "New Principle" as a modification of the PP to try and salvage Humeanism. The tension arises directly from the core Humean commitment that *everything* (including laws/chances) supervenes on the local particular matters of fact arranged in a vast mosaic. The necessitarian avoids it by rejecting that core commitment for laws.
