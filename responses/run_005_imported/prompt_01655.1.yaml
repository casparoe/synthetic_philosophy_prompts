  ## The Mugger's Mirror: Pascal's Paradox as a Structural Flaw in Expected Utility Theory

  Pascal's Mugging presents a stark challenge: a mugger threatens to inflict an astronomically large disutility (say, torturing 3↑↑↑↑3 people) unless paid a small sum, claiming to wield unimaginable power. While the probability of this claim being true seems vanishingly small, perhaps 1 in 3↑↑↑↑3, the *expected disutility* of refusing (probability * disutility) remains enormous due to the sheer scale of the threatened harm. Expected Utility Theory (EUT), which dictates choosing the action with the highest expected utility, seemingly compels payment. This outcome feels intuitively irrational, even absurd. The critical question is whether this reveals a fundamental flaw in EUT or merely highlights the need for "reasonable" constraints on credences (probabilities) and utility assignments. While constraints offer practical mitigation, I argue that Pascal's Mugging exposes a **genuine structural weakness in EUT itself**, stemming from its core assumptions about probability aggregation and value representation when faced with claims of near-infinite stakes.

  Proponents of the "constraints" view offer compelling arguments. They contend EUT functions perfectly *given* plausible inputs. The flaw lies not in the calculation, but in allowing irrational priors. They propose solutions like:

  1.  **Probability Floor / Cromwell's Rule:** Insisting that no logically possible claim, no matter how outlandish, is assigned a probability *exactly* zero. However, even a miniscule but non-zero probability (e.g., 1/10^100) paired with a sufficiently large disutility (e.g., 10^200 units) can still dominate the calculation.
  2.  **Bounded Utilities:** Asserting that no outcome can possess literally infinite (or effectively infinite) positive or negative utility for a rational agent. Human psychology, they argue, simply cannot genuinely value or disvalue anything infinitely. Setting finite bounds prevents the mugging.
  3.  **Epistemic Sanity Constraints:** Demanding that probabilities must be grounded in evidence and coherent world models. Assigning non-negligible probability to a mugger's unsupported claim of wielding 3↑↑↑↑3 power violates basic epistemic rationality. Reasonable credences would be so low that even vast disutilities wouldn't compel payment.

  These constraints are sensible and necessary for practical rationality. An agent ignoring them is arguably irrational *before* applying EUT. However, Pascal's Mugging persists as a *theoretical* challenge to EUT's core machinery because these constraints appear *external* fixes to a problem *internal* to the theory's operation:

  1.  **The Vulnerability to Tail Events:** EUT's linear aggregation (Probability * Utility) inherently grants extreme leverage to outcomes with minuscule probabilities if their utility magnitudes are sufficiently extreme. This isn't an artifact of "unreasonable" inputs; it's a direct consequence of the formula. The mugger doesn't need a *high* probability claim; they just need a claim *sufficiently extravagant* to overwhelm any plausible probability floor a constrained agent might adopt. The structure of EUT makes rational agents systematically vulnerable to exploitation by threats (or promises) of arbitrarily large stakes, provided the probability isn't *literally* zero – a state difficult to rigorously justify for any empirical claim.
  2.  **The Epistemology of the Extraordinary:** EUT lacks an intrinsic mechanism to discount claims *because* of their extraordinary nature. Bayesian updating relies on priors and evidence. But how does a rational agent *initially* assign a prior to a claim of wielding 3↑↑↑↑3 power? Standard indifference principles or maximum entropy methods can lead to paradoxical results when the hypothesis space is unbounded. The "epistemic sanity" constraint is crucial, but it highlights that EUT *itself* doesn't encode a robust principle for handling hypotheses whose very description strains the foundations of the agent's world model. EUT takes probabilities as given; it doesn't tell us how to form them in the face of the preposterous.
  3.  **Utility and Meaningful Difference:** The bounded utility solution, while practical, faces philosophical headwinds. If we accept that *some* outcomes (e.g., the extinction of all sentient life vs. a stubbed toe) are genuinely incommensurable in terms of disvalue, then imposing strict bounds feels artificial. Furthermore, EUT struggles with comparing outcomes across vastly different scales. Does a disutility of 10^100 truly feel meaningfully different from 10^200 to a bounded agent? The calculation treats them as distinct, but human (and arguably rational) valuation likely involves thresholds or qualitative shifts that EUT's linear framework doesn't capture. The theory forces quantification where meaningful quantification breaks down.
  4.  **The Justification of EUT:** EUT is often justified through the long-run average performance (law of large numbers) or representation theorems showing consistent preferences imply EU maximization. Pascal's Mugging involves unique, unrepeatable events with stakes so high there *is* no long run. Representation theorems demonstrate consistency *given* the agent's beliefs and values, but they don't guarantee that the beliefs and values leading to mugging-acceptance are *rational* in a broader sense. The mugging reveals that EUT, as a standalone theory, can endorse patently irrational actions *even under consistency*, suggesting its foundations are incomplete.

  **Conclusion:**

  Pascal's Mugging is more than just a demand for sensible priors and bounded utilities. It acts as a diagnostic tool, revealing a structural vulnerability within Expected Utility Theory. EUT's core mechanism – the linear multiplication of probability and utility – becomes a liability when confronted with conceivable (even if extraordinarily unlikely) scenarios involving claims of near-infinite stakes. While imposing constraints like probability floors, utility bounds, and epistemic rationality is essential for any *practical* implementation of rational decision-making, these constraints feel like necessary patches applied *to* EUT, not features arising naturally *from* it. The mugging demonstrates that EUT, in its pure, unconstrained form, lacks inherent safeguards against being dominated by fantastical tail events, potentially leading to absurd prescriptions. Therefore, Pascal's Mugging does reveal a genuine flaw: an oversensitivity to extreme utilities combined with arbitrarily low probabilities, stemming from the theory's foundational aggregation rule. This flaw suggests that a fully adequate theory of rational decision-making under uncertainty may need to incorporate structural elements beyond simple expected utility maximization – perhaps principles of epistemic humility, context-dependent value scaling, or a more nuanced treatment of hypothesis spaces – to navigate the paradoxes exposed by the mugger's chilling proposition. The lesson isn't merely to add constraints *to* EUT, but to recognize that EUT itself needs fundamental refinement or supplementation when venturing into the realm of the astronomically improbable and consequential.
