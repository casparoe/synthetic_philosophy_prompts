answer: |-
  Let's break down the exchange between Helen and Marcus step by step, evaluating the strengths of each position before identifying what both might be overlooking.

  ### Step-by-Step Analysis
  1.  **Marcus's Opening Claim (Merely Verbal Dispute):**  
      *Marcus argues that universalism and nihilism agree on all physical facts (particle arrangements) and only differ in linguistic conventions (quantifier meaning/scope of "object"). Charity in interpretation reveals no substantive disagreement.*  
      **Assessment:** Marcus has the **stronger initial position** here. He correctly identifies that both theories share the same *physical ontology* (e.g., particles, fields) and fundamental arrangements. The disagreement hinges on *which configurations merit the label "object."* Hirsch's quantifier variance supports this: different conceptual schemes carve reality differently without factual conflict.  

  2.  **Helen's Objection (Substantive Criterion):**  
      *Helen counters that van Inwagen's "life" criterion isn't just semantics—it's a metaphysical hypothesis about when genuine unity emerges. Treating it as verbal erases this substantive claim.*  
      **Assessment:** Helen gains the **upper hand here**. Van Inwagen *does* posit a specific, non-linguistic condition for composition (biological self-maintenance). This criterion aims to answer *why* certain aggregates are unified objects while others aren't—a question about reality's structure. Marcus's purely semantic view struggles to explain why van Inwagen's criterion feels explanatory rather than stipulative.  

  3.  **Marcus's Redescription Move (Criterion as Linguistic Policy):**  
      *Marcus replies that even the "life" criterion can be rephrased as a linguistic convention: "We quantify over living things as composites, but not heaps."*  
      **Assessment:** Marcus **partially recovers** but overextends. While *descriptively true* (any criterion *can* be framed as a quantifier rule), this ignores *why* van Inwagen chose "life." Van Inwagen presents it as discovering a *metaphysical joint* (life as a natural unity), not inventing a linguistic preference. Marcus's move risks reducing all ontological commitments to arbitrary linguistic decisions.  

  4.  **Helen's Overgeneralization Challenge:**  
      *Helen argues that if *any* metaphysical claim can be redescribed as semantics, then *all* ontology (e.g., "Do numbers exist?") becomes trivialized. Marcus owes a principle to distinguish substantive disputes.*  
      **Assessment:** Helen **wins this round decisively**. Marcus's position *does* imply global ontological triviality, which even Hirsch rejects (quantifier variance applies selectively). Philosophers like Sider argue for "joint-carving" structures precisely to avoid this collapse. Marcus's lack of a criterion to separate substantive from verbal disputes is a critical gap.  

  ### Who Has the Better Overall Argument?
  **Helen emerges slightly stronger.** While Marcus correctly diagnoses *some* mereological disputes as verbal (e.g., universalism vs. nihilism), Helen exposes the limitations of applying this to *all* ontological claims. Van Inwagen's "life" criterion *aims* to be substantive, and Marcus's semantic redescription doesn't engage with its explanatory ambitions. Helen's challenge—that Marcus trivializes ontology without a principled distinction—remains unanswered.

  ### What Both Are Overlooking: Drawing the Line
  Helen and Marcus both miss nuances in how metaphysics interacts with language and reality. Key insights they overlook:

  1.  **Explanatory Power as a Criterion:**  
      A dispute is **substantive** if rival theories offer *better/worse explanations* of phenomena beyond mere particle arrangements. Van Inwagen's "life" criterion explains why organisms (but not arbitrary aggregates) persist as unified entities through change, participate in biological laws, and have teleological properties. If nihilism or universalism struggles to explain these features without ad-hoc additions, the dispute isn't *just* verbal.  

  2.  **Indispensability to Practice:**  
      Some ontological commitments are "substantive" because they're *indispensable frameworks* for specific domains. The "life" criterion isn't just a quantifier rule—it underpins biology, medicine, and ethics. We couldn't coherently replace "organisms" with "particles arranged organism-wise" in virology or ecology without loss of explanatory depth. This anchors the dispute in reality.  

  3.  **Metaphysical Grounding vs. Semantic Charity:**  
      Charity in interpretation (Marcus's move) resolves *ambiguity*, but doesn't address whether a *grounding relation* exists. When van Inwagen claims "activity constituting a life *grounds* composition," he posits a metaphysical dependency. If this grounding claim has empirical or conceptual consequences (e.g., predicting when an aggregate gains causal unity), it resists semantic deflation.  

  4.  **Quantifier Variance’s Limits:**  
      Even if quantifiers vary, **structural realism** (à la Sider) suggests some ontological categories "carve reality at the joints" better than others. The "life" criterion may track a real pattern of causal unity absent in universalism’s arbitrary sums. Disputes about *which structures are joint-carving* are substantive—they concern objective divisions in nature, not just language.  

  ### Conclusion
  Marcus is right that *some* mereological disputes (e.g., universalism vs. nihilism) are verbal—they lack downstream consequences. But Helen correctly insists that theories like van Inwagen’s aim for *substantive* metaphysical explanations. The line between verbal and substantive lies in:  
  - **Explanatory depth**: Does the theory explain phenomena inert particle descriptions cannot?  
  - **Indispensability**: Is the ontology required for successful practices (e.g., science)?  
  - **Grounding claims**: Does it posit mind-independent relations (e.g., unity → life)?  

  Van Inwagen’s "life" criterion *aspires* to meet these standards—and if it succeeds, the dispute isn’t merely verbal. Marcus’s semantic redescription doesn’t engage this aspiration, while Helen’s challenge highlights the need for a robust demarcation principle grounded in explanatory relevance. Both, however, underplay how *scientific and causal explanations* can anchor ontological claims in substance.
