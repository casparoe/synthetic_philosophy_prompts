  Lewis's RCA focuses on the disposition remaining during the stimulus. But in masking, the disposition is intact; the problem is an external blocker. So RCA's solution doesn't touch masking because the blocker isn't affecting the disposition's presence. The user probably needs to see that masking requires a different fix, maybe involving the absence of external interferers. 

