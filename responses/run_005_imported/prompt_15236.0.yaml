answer: |-
  You're right to be skeptical of your friend's interpretation. While Aquinas unequivocally condemns tyranny and argues that a tyrant forfeits his *just claim to obedience*, **he does not explicitly endorse or license individual tyrannicide as a legitimate remedy.** Your friend's inference oversimplifies Aquinas's nuanced position, which prioritizes order, due process, and the avoidance of greater evils. Here's a breakdown of where the inference breaks down and what Aquinas *does* recommend:

  1.  **Condemnation of Tyranny & Forfeiture of Obedience:**
      *   **Yes:** Aquinas is crystal clear. Political authority exists *for* the common good (ST I-II, Q. 90, A. 2; De Regimine, I, 1, 15). A ruler who governs solely for private advantage becomes a tyrant and acts unjustly.
      *   **Yes:** Such a ruler "lacks the quality of law" (ST I-II, Q. 92, A. 1, ad 4) and rules *de facto* but not *de jure* in the moral sense. Subjects are *not* morally obligated to obey unjust commands (ST II-II, Q. 104, A. 6). Aquinas explicitly states that resisting such commands is not sedition (ST II-II, Q. 42, A. 2, ad 3).

  2.  **The Crucial Break: Forfeiture ≠ License to Kill by Any Individual**
      *   **The Inference Error:** Your friend jumps from "the tyrant has forfeited legitimate authority" to "therefore, any subject can justly kill him." Aquinas does *not* make this leap. Forfeiting the *right to obedience* does not automatically grant a *right to execution* to private individuals.
      *   **Public Authority vs. Private Vengeance:** Aquinas strongly distinguishes between the exercise of *public authority* and *private judgment/violence*. The power to punish, especially with death, resides with public authority acting for the common good (ST II-II, Q. 64, A. 3). An individual subject acting alone lacks this public authority.
      *   **Danger of Anarchy and Worse Tyranny:** Aquinas is deeply concerned about the consequences of private violence against rulers. He argues that killing a tyrant is fraught with peril:
          *   It often leads to worse tyranny ("For it may happen that he who kills the tyrant sets free the people, but he who does this is usually one who then oppresses the people even more heavily" - De Regimine I, 6).
          *   It risks plunging the community into civil strife and disorder, which is a greater evil than enduring a single tyrant for a time ("the dangers which may arise from the overthrow are more to be dreaded than the tyranny itself" - De Regimine I, 6).
          *   It sets a dangerous precedent for vigilante justice and political instability.

  3.  **Aquinas's Preferred Remedies (Not Tyrannicide):**
      *   **Endurance and Divine Aid:** If the tyranny is not utterly intolerable and resistance risks greater harm, Aquinas advises patience and prayer ("commit their cause to God" - De Regimine I, 6). God can convert the tyrant's heart or provide deliverance through other means.
      *   **Action Through Public Authority:** This is key. Aquinas envisions remedies coming from *within the structure of authority*:
          *   **Higher Authority:** If there exists a "superior power by whom [the tyrant] can be judged" (e.g., the Pope over a Christian prince, an Emperor over a king, a collective body like the Roman Senate), that authority has the right to depose the tyrant (ST II-II, Q. 42, A. 2, ad 3; De Regimine I, 6).
          *   **The Community Itself (Cautiously):** Aquinas is most ambiguous here, but hints at collective action. He states that the community which established the king (or perhaps its representative body) "can justly depose or restrict him if he abuses his royal power" (De Regimine I, 6). Crucially, this is framed as a *public act* by the *whole community* or its legitimate representatives, *not* the private act of an individual. It implies a process, not assassination.
          *   **Withholding Obedience/Non-Violent Resistance:** Subjects are justified in disobeying unjust commands and can even, in principle, resist openly *if* this can be done without causing greater scandal or danger. However, this resistance stops short of assassination.

  4.  **Contrast with John of Salisbury:**
      *   Salisbury (Policraticus, c. 1159) *is* much more explicit. He famously calls the tyrant a "public enemy" whom it is "not only lawful but just and right" to kill, even comparing the tyrant-killer to the Biblical Ehud. He frames it almost as a pious duty.
      *   Aquinas (writing c. 1265-1267) represents a significant shift. While sharing Salisbury's condemnation of tyranny, he deliberately *distances* himself from the individualistic, potentially anarchic implications of Salisbury's position. He focuses on institutional checks, due process, and the paramount importance of avoiding greater evils like civil war. Aquinas's emphasis is on *restoration of legitimate order*, not individual vengeance or revolution.

  **Precisely Where the Inference Breaks Down:**

  1.  **Moral Forfeiture ≠ Moral License:** Aquinas establishes that the tyrant loses his *right to be obeyed*, not that he automatically loses his *right to life at the hands of any subject*. The latter requires a separate justification based on authority and consequences.
  2.  **Lack of Proper Authority:** The individual subject lacks the *public authority* necessary to inflict capital punishment. That authority resides elsewhere (higher power, the community acting collectively).
  3.  **Prudential Calculation:** Aquinas insists that the *consequences* of an action (like tyrannicide) must be considered. The high risk of worse outcomes (anarchy, worse tyranny, civil war) makes individual tyrannicide an unjustifiable act of imprudence, violating the principle of proportionality inherent in just action.
  4.  **Focus on Public, Ordered Remedies:** Aquinas channels resistance towards *public, institutional* avenues (appeal to higher authority, collective action by the community), explicitly rejecting private violence as the solution.

  **In Conclusion:**

  Your friend is correct that Aquinas sees tyranny as illegitimate and strips the tyrant of any just claim to obedience. **However, Aquinas explicitly rejects the inference that this licenses individual subjects to assassinate the tyrant.** He views such acts as dangerously destabilizing, lacking proper authority, and likely to cause greater harm than the tyranny itself. His preferred solutions are: 1) Endurance and prayer (if resistance is too dangerous), 2) Appeal to a higher public authority, or 3) Collective action by the community itself *as a public body* to depose the tyrant. Aquinas's position is far more cautious and institutionally focused than Salisbury's, prioritizing the preservation of social order and legitimate processes over individual revolutionary violence. He condemns the tyrant but fears the chaos of tyrannicide more.
