  ok so i fell down a rationalist blog rabbit hole about acausal threats, like blackmail from an agent that isn't even causally connected to you (kinda the whole roko's basilisk vibe but more general), and this proposed defense called surrogate goals, where you basically get yourself to care about some decoy goal so any threatener targets that instead of what you actually value. can you write me a dialogue between two people arguing about whether this actually works? one of them's really into updateless decision theory and thinks adopting a surrogate goal is a genuinely smart precommitment that any sufficiently rational agent should make, the other thinks the whole thing is incoherent — either bc a smart enough threatener just sees through the decoy and it does nothing, or bc you get an infinite regress where the surrogate goal needs it's own surrogate. make them actually engage with each other's specific points instead of just repeating their own side, and have them try to figure out by the end whether there's a real fix or the whole strategy's just busted.
