  Chalmers' zombie argument hinges on the claim that zombies are conceivable without contradiction, suggesting that consciousness is an extra ingredient. The response from physicalists like Dennett is that such conceivability is flawed, much like Kripke's examples. But Chalmers counters that unlike water, where we can explain away the illusion, for consciousness, no such explanation exists.

  The user's background in physical chemistry means they're familiar with reductionism. They might expect the same framework to apply to consciousness. But philosophy of mind debates whether consciousness can be reduced like chemical properties. The user's frustration likely stems from seeing an inconsistency in applying Kripke's lessons.

  I should also address why the debate persists. Philosophers aren't ignoring Kripke; they're engaging with his framework. The zombie argument forces a clarification of physicalism's commitments. If zombies are conceivable and that implies possibility, physicalism must be false. Physicalists need to show why that conceivability is deceptive.

  Moreover, the user might not be considering the "explanatory gap." Even if we accept neural correlates of consciousness, explaining why certain brain states feel a certain way is harder than explaining water's properties via H₂O. The zombie argument highlights this gap.

  Another point is the role of modal intuitions. Kripke showed that some necessities are a posteriori, but for consciousness, the argument is that its necessity isn't established the same way. Physicalists might argue that consciousness is necessarily physical once we know the facts, but anti-physicalists deny we can bridge that gap conceptually.

  I should also mention responses like the phenomenal concept strategy. Physicalists argue that our concepts of consciousness are unique, making zombies seem conceivable even if they're impossible. This mirrors Kripke's point but applies it to phenomenal concepts.

