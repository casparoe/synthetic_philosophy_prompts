  But why do philosophers still debate zombies? I should consider the key differences. Chalmers and others argue that consciousness isn't captured by physical descriptions in the way water is by H₂O. The identity of water is discovered a posteriori, but for consciousness, the argument is that there's no such identity to be discovered because qualia are fundamentally different.

