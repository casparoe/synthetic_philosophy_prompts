prompt: |-
  Got into a whole debate with a friend last night about something that's been bugging me at work. There's a guy on my team whose technical chops are honestly way beyond mine at this point, and whenever I ask him for a status update he gives this calm, detailed answer that always somehow lines up with whatever I'm hoping to hear. A few weeks ago a project he'd been quietly reassuring me about for a month completely blew up right before launch, and looking back there were warning signs he never brought up (I don't think he was lying exactly, I think he's just genuinely good at sounding reassuring). Afterward I told him I need him to be straight with me even when it's bad news, but I honestly can't tell if that changed anything or if he just got better at sounding straight with me. My friend's take is that theres basically no way for me to ever know the difference, since he understands the work better than I do and either way he'd sound exactly the same to me. That felt too pessimistic but I couldn't say why. Is my friend right that I'm just stuck, or is there something I can actually do here?
