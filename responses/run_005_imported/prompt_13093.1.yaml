prompt: |-
  I'm taking a formal epistemology seminar this term, and a couple weeks back we covered I.J. Good's old result that the expected value of free evidence is never negative for a Bayesian agent who updates by conditionalization -- basically, looking at more (costless) information before you act can never make your expected payoff worse, only better or the same. The instructor presented it almost as a throwaway, this cute little theorem that's practically trivial once you see the proof, but it's been bugging me since, because it seems like it should generalize way past individual decisions.

  Here's what I can't figure out: doesn't this basically settle the whole debate about transparency? If a rational Bayesian literally can't be hurt in expectation by having more information before deciding, shouldn't it follow that institutions -- governments, insurers, financial markets, whatever -- should just default to maximum public disclosure, since more information floating around can only make outcomes better overall, never worse? I brought this up with a friend doing econ and she said something like "that stops being true once there's more than one person in the room," but couldn't really spell out why. Is she right, and if she is, what exactly breaks once you go from one Bayesian deciding alone to a bunch of seperate people interacting with each other? On the face of it, Good's result feels like the kind of thing that should just add up across people, not fall apart.
reasoning: |-
  Okay, let me try to figure out why Good's result doesn't apply to multiple agents. The user is saying that in a single-agent Bayesian setup, free evidence has non-negative expected value. But when multiple people are involved, it doesn't hold. Why?

  First, I need to recall Good's theorem. For one person, getting more info before acting can't hurt expected utility. But in multi-agent scenarios, strategic interactions change things. Each agent's action affects others' payoffs. So when someone reveals information, it alters what others do, which might hurt the first agent.

  The user mentioned transparency debates. Like governments disclosing info. But if one country shares data, others might exploit it. Example: trade negotiations. If a country reveals its minimum acceptable terms, others might push for worse deals. So here, transparency can backfire.

  Another point is information aggregation. Even if all agents are rational, their combined actions might not lead to optimal outcomes. Like in prediction markets where early information cascades can mislead others. Or herding in finance, where everyone follows initial signals, ignoring their private info.

  Also, there's the issue of information asymmetry. In auctions, revealing bidder valuations can lead to collusion or predatory pricing. If bidders know others' values, they might team up to lower bids. That's bad for the seller. So the seller might hide information to prevent this.

  What about adverse selection? In insurance, if companies have full medical histories, they might refuse high-risk people. But if that info is public, no one insures them. So hiding some info (like with community rating) can be better overall.

  The user's econ friend said it breaks with multiple people. The key is strategic interdependence. Each player's best move depends on others' moves. Information changes those strategies, leading to Nash equilibria that aren't Pareto optimal. So even if each agent acts rationally, the group outcome isn't efficient. That's where Good's assumption fails—no one else's actions are affected by your info in the single-agent case.

  Also, in multi-agent settings, information can be weaponized. For example, in financial markets, insider info might lead to front-running. Or in politics, leaking info to manipulate opponents. These strategic uses can create negative externalities.

  The user thinks the result should scale across individuals. But adding more agents introduces competition and conflict of interest. Individual utilities don't sum up neatly. What's good for one might be bad for another, and the net effect could be negative. Plus, coordination problems and trust issues complicate things.

  So, the core reasons are: strategic behavior, externalities, misaggregation of information, and adversarial incentives. These factors mean that more information can lead to worse collective outcomes, even if each agent is rational. That's why transparency policies need careful design, considering these dynamics.
answer: |-
  You've hit on a deeply important and subtle point! Good's result (sometimes called the "Value of Information Theorem") *is* a powerful and elegant foundation for individual rationality: **for a single Bayesian agent facing a single decision, the expected value of costless, decision-relevant information is non-negative.** The proof relies crucially on the agent being able to *use* the information to potentially choose a different, better action *after* seeing it, without affecting the world state or anyone else's actions.

  **Where It Breaks Down: The Multi-Agent World**

  Your econ friend is fundamentally correct. The theorem *does not* generalize straightforwardly to multiple interacting agents. When other strategic actors are involved, more information can absolutely make *everyone* worse off in expectation. Here's why Good's assumptions fail and what breaks:

  1.  **Strategic Interdependence (The Core Issue):**
      *   In the single-agent case, the agent's action choice only affects their own payoff. Information helps them pick the best action *given the state of the world*.
      *   **With multiple agents, each agent's optimal action depends critically on what *others* do.** Information changes beliefs, which changes actions, which changes *other* agents' optimal actions, and so on. This creates feedback loops.
      *   Crucially, **an agent's payoff depends *both* on the state of the world *and* on the *actions taken by others*.** Information revealed to others can lead them to take actions that are harmful to you, even if they are acting rationally in their own interest.

  2.  **Information as a Strategic Weapon/Shield:**
      *   Agents don't just passively receive information; they actively *use* it to anticipate and influence others' behavior. Revealing information can signal intentions, reveal weaknesses, or invite exploitation.
      *   **Example (Trade Negotiation):** Country A revealing its true minimum acceptable trade deal gives Country B the power to offer *just barely* that minimum, extracting maximum concessions. If A had kept its minimum secret, B *might* have offered more out of uncertainty, potentially leaving A better off. Transparency here can harm A.

  3.  **Coordination & Signalling Failures:**
      *   More information can sometimes *prevent* beneficial coordination or lead to inefficient signalling equilibria.
      *   **Example (Bank Run):** If depositors observe a public signal suggesting a bank *might* be insolvent (even if it's fundamentally sound), rational individuals, each acting in their own best interest, will rush to withdraw. This causes a run that *makes* the bank insolvent, harming everyone. Less public information (or credible private assurances) might have prevented this self-fulfilling panic. Transparency triggers a bad equilibrium.
      *   **Example (Market Manipulation):** A large trader revealing their intention to buy a large position can signal high value, causing others to front-run them, driving the price up *before* they buy, making their intended action more expensive and less profitable. Secrecy is strategically valuable.

  4.  **Adverse Selection & Market Unraveling:**
      *   Transparency can destroy markets by revealing asymmetries that prevent mutually beneficial trades.
      *   **Example (Insurance - The Classic Akerlof "Lemons" Problem):** If insurers have perfect access to *all* individuals' detailed health data, they can perfectly price risk. This leads to extremely high premiums for high-risk individuals, making insurance unaffordable for them, effectively excluding them from the market. *Less* transparency (e.g., community rating, pooling) can lead to a functioning market where high-risk individuals get coverage and low-risk individuals pay a manageable (though above-actuarial) premium. Full transparency can collapse the market, harming both high-risk individuals (no coverage) and potentially insurers (lost premium volume).

  5.  **Information Aggregation Failures & Herding:**
      *   Even if all agents are rational Bayesians, the *way* information is revealed publicly can lead to inefficient outcomes. Early signals can create "information cascades" where later agents ignore their own private signals and follow the crowd, leading to misaggregation.
      *   **Example (Prediction Markets/Financial Bubbles):** Early positive public signals about a stock might cause a rush of buying. Later traders, seeing this momentum, might buy even if their private analysis is negative, fearing missing out or trusting the "wisdom of the crowd." This can inflate a bubble that eventually bursts, harming late entrants. Less public "hype" might allow private signals to aggregate more efficiently.

  6.  **Negative Externalities of Information:**
      *   Information possessed by one agent can impose costs on others *regardless of actions taken*, simply by existing or being known to exist.
      *   **Example (Privacy):** Revealing sensitive personal data (e.g., medical history, political views) can lead to discrimination, social stigma, or identity theft, harming the individual even if no specific "decision" is made based on it by the institution revealing it. The individual loses control over how that information *might* be used by countless unknown others in the future. Good's theorem assumes information is only relevant for the specific decision at hand.

  **Why Doesn't It "Add Up"?**

  The core issue is **conflict of interest and strategic interaction**. Good's theorem assumes the agent's action only affects their *own* payoff in a fixed environment. In multi-agent settings:

  *   **Your payoff depends on others' actions:** Information revealed to others changes *their* actions, which can directly harm you.
  *   **Their actions depend on their beliefs about you:** Revealing your information changes their beliefs about your intentions/type, prompting them to take defensive or aggressive actions against you.
  *   **No single "group utility":** There's no guarantee that what improves one agent's expected utility improves another's. Actions maximizing individual utility can lead to collectively worse outcomes (Prisoner's Dilemma is the quintessential example). More information can simply allow agents to more effectively exploit each other or get trapped in bad equilibria.
  *   **Information changes the "rules of the game":** Revealing information fundamentally alters the strategic landscape, creating a new game with potentially worse equilibrium payoffs for some or all players.

  **Implications for Transparency Debates:**

  Good's result provides a *strong prima facie case* for transparency *within* a single, unified decision-making entity (e.g., a CEO making a strategic choice for the whole company with access to all internal data). However, for institutions operating in environments with multiple strategic actors (governments, markets, insurers, social platforms), the calculus is radically different:

  1.  **Transparency is a double-edged sword.** It can enhance accountability and efficiency *or* trigger destructive strategic behavior, market failures, privacy violations, and coordination problems.
  2.  **Optimal transparency requires careful design.** It's not about "maximum" or "minimum," but about *what* information is disclosed, *to whom*, *when*, and *how*. Secrecy, partial disclosure, credible commitments, and privacy protections become essential strategic tools.
  3.  **Context is king.** The desirability of transparency depends critically on the specific institutional setting, the nature of the information, the incentives of the actors involved, and the potential for strategic manipulation or adverse selection.

  **Conclusion:**

  You've correctly identified a profound tension. Good's theorem is a bedrock principle of individual Bayesian rationality. However, the jump from the isolated, non-strategic world of a single decision-maker to the messy, interactive world of institutions and markets is a chasm, not a step. The introduction of **strategic interdependence** fundamentally breaks the guarantee that "more information is always better in expectation." Information in multi-agent settings isn't just passively absorbed to make better decisions about a fixed world; it actively shapes the strategic landscape and the actions of others, often in ways that can be detrimental to individual and even collective welfare. This complexity is precisely why debates about transparency, privacy, disclosure regulations, and information economics remain central and unresolved. Your intuition that something fundamental changes when moving from one agent to many is spot on.
