answer: |-
  Here’s a toast that honors Priya’s work, respects Lewis’s framework, makes the ritual meaningful, and (hopefully) gets your mom crying:

  **(Clink glass gently. Warm smile. Pause.)**

  Hi everyone. For those who don’t know me, I’m [Your Name], Priya’s slightly-terrified-but-honored college roommate. I’m also a novelist, which means I usually have months to obsess over *written* words. Today, I get five minutes of *spoken* ones for two extraordinary people: Priya, my brilliant, fierce, tea-spilling, David-Luis-dissertation-writing best friend… and Marcus, the man who somehow managed to match her wit, her passion, and her tolerance for obscure philosophical debates. Seriously, Marcus, scoring that winning goal against Priya’s arguments? That’s talent.

  **(Light laughter. Look at Priya & Marcus.)**

  Priya, over countless cups of truly terrible dorm coffee, you taught me many things. Mostly, you taught me that David Lewis had *opinions* about conventions. And since you just spent 250 pages arguing with him, I figured I’d better not get this wrong! So, no grand pronouncements about fate or cosmic destiny today. Lewis, and Priya, would rightly point out: life isn’t about necessity. It’s often about… coordination.

  **(Slight shift in tone – a bit more thoughtful, but still warm. Glance around, include the philosophers with a knowing look.)**

  See, Lewis told us conventions aren’t some inevitable force. They’re patterns. Beautiful, powerful, *arbitrary* patterns. They emerge because we stumble into a way of doing things that works, and then… we keep doing it. Because we *expect* the other person to keep doing it. Because it solves a tiny puzzle of coexistence. It becomes our little equilibrium. Our shared precedent.

  **(Lean in slightly, focus on Priya & Marcus.)**

  And that’s what I see when I look at you two. Not some grand, pre-written script, but this incredible, evolving pattern you’ve built together. Brick by brick, moment by moment, expectation by fulfilled expectation. It’s in the big things, sure, but maybe even more in the small, quirky ones. Like… every single time one of you leaves for the airport.

  **(Pause. Smile.)**

  “See you on the other side.” That’s what you say. Every. Single. Time. Does anyone remember *why* it started? Probably not! It’s arbitrary! It just… *did*. And then you kept saying it. Because you expected the other to say it. Because it became *your* little ritual. Your tiny, perfect coordination equilibrium in the chaos of travel. It solves the puzzle of goodbye with a shared phrase, a mutual expectation, a point of connection. It’s a convention. Pure Lewis. And utterly, completely *yours*.

  **(Voice softens, becomes more intimate.)**

  Now, some might look at a ritual like that – or look at *this* ritual, this big, beautiful wedding – and ask: Does saying the words out loud, making these explicit promises… does that somehow break the magic? If conventions are supposed to solve problems *without* needing grand agreements, what are we all doing here today?

  **(Pause. Look around the room.)**

  But Priya knows, and Lewis knew, it doesn’t work like that. Conventions aren’t fragile things shattered by awareness. They’re *strengthened* by it. Today isn’t about inventing something new out of thin air. It’s about *recognizing* the profound pattern you’ve already built. It’s about making that pattern **common knowledge**. Look around! Everyone here – Marcus’s formidable family, his soccer teammates who’ve witnessed his goofy grin since Priya came along, Priya’s colleagues who’ve seen her light up talking about Marcus, my wonderful parents who just want to see people happy… *everyone* sees it. Everyone *knows* you’ve chosen each other, again and again. Today, you stand before us, making vows – not as the shaky foundation of your convention, but as its glorious, public affirmation. You’re broadcasting your mutual expectations to the world, reinforcing the precedent, solidifying the equilibrium that is your love. You’re saying, loud and clear: *This* is our pattern. *This* is how we coordinate. *This* is how we choose to be, together.

  **(Voice swells slightly, emotional but grounded.)**

  And that’s the most beautiful convention of all. It started maybe arbitrarily – a glance, a conversation, a shared laugh. But through a million tiny choices, a million fulfilled expectations, a million “see you on the other side”s… it became necessary. *Your* necessary. The pattern you couldn't, and wouldn't, live without.

  **(Raise glass fully. Look directly at Priya & Marcus, eyes shining.)**

  So Priya and Marcus, here’s to your convention. To the arbitrary beginning. To the powerful precedent you’ve set. To the deep, abiding mutual expectations you hold. To the strongest, most resilient coordination equilibrium I know. May your shared knowledge of your love always be common, may your patterns bring you endless joy, and may you always, always find each other on the other side.

  **(Big smile, tears possible.)**

  To the happy couple!

  **(Everyone: "TO THE HAPPY COUPLE!")**

  ---

  **Why this works (and hits your requirements):**

  1.  **Lewisian Bones:** It directly addresses arbitrariness ("why *that* phrase?"), precedent ("you kept saying it"), mutual expectations ("because you expected the other to say it"), coordination equilibrium ("solves the puzzle of goodbye"), and common knowledge ("making that pattern common knowledge"). It avoids the "meant to be" trap.
  2.  **The Vows Paradox Solved:** It frames the ceremony *not* as the *origin* of the convention (which would break Lewis), but as the *recognition* and *public affirmation/reinforcement* of an *already existing* convention built on precedent and mutual expectation. This is Lewis-compatible.
  3.  **Concrete Example:** The "see you on the other side" ritual is the perfect vehicle. It's small, personal, demonstrably arbitrary, demonstrably sustained by precedent and mutual expectation, and clearly a coordination device.
  4.  **Accessibility:** No jargon dumps. Complex ideas ("coordination equilibrium," "common knowledge") are introduced conversationally *through* the concrete example and immediately explained in human terms ("solves the puzzle," "everyone here sees it").
  5.  **Emotional Payoff:** It pivots from the intellectual framework to the emotional core: the pattern becoming *their* necessary. The focus on choice, building, shared knowledge, and finding each other "on the other side" is deeply romantic and universal. The "million tiny choices" and "couldn't live without" lines are tear-jerkers.
  6.  **Tone:** Warm, personal, slightly humorous start, thoughtful middle, big emotional finish. It sounds spoken, not written. Phrases like "tea-spilling," "truly terrible dorm coffee," "goofy grin," "tiny, perfect coordination equilibrium" keep it human.
  7.  **Rewarding the Philosophers:** They'll hear the precise Lewisian concepts woven in naturally ("arbitrary," "precedent," "mutual expectation," "coordination equilibrium," "common knowledge"). The resolution of the "vows paradox" will specifically delight Priya and her committee. Using *their* ritual as the example shows deep understanding.
  8.  **Your Mom (and Everyone Else):** The focus on love, choice, building a life together, shared rituals, public commitment, and the final, heartfelt toast is classic wedding emotion. The "million tiny choices" becoming necessary is the key cry moment.

  **Delivery Tip:** Practice it aloud! Find the natural pauses. Let the warmth for Priya and Marcus show. When you get to the "million tiny choices" part, slow down just a touch and look at them. Breathe. You've got this. It’s a beautiful toast that honors your friend’s mind and her heart.
