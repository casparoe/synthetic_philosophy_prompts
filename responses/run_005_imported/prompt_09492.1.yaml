  Need to avoid making either side a strawman. The Skyrmsian should concede that their agents don't have "common knowledge" in Lewis's sense, but argue that the functional outcome is identical. The Lewisian must admit the evolutionary models work empirically but maintain they're explaining something different. 

  The most interesting moment should be when they wrestle over whether "could have done just as well" requires possible worlds in the agents' minds or just in the modeler's analysis. That's the philosophical crux.
answer: |-
  ## Dialogue: The Ghost in the Convention Machine

  **Characters:**
  *   **Eleanor (Lewisian):** Committed to Lewis's rationalist, knowledge-based account of convention. Sharp, insists on intentionality.
  *   **Ben (Skyrmsian):** Evolutionary game theorist, focused on emergent phenomena from simple learning rules. Pragmatic, emphasizes functional outcomes.

  **Setting:** A cafe after a philosophy of science conference.

  **(Eleanor stirs her coffee, looking unconvinced by the last panel.)**
  **Eleanor:** ...and that's precisely my frustration, Ben. This whole "evolved convention" talk. Skyrms' models are elegant, I grant you. Agents bumble into coordination. Fine. But calling it *Lewisian convention*? That's a category error. Lewis required *common knowledge* of preferences, expectations, *and* arbitrariness. Your reinforcement learners are glorified stimulus-response machines!

  **Ben:** (Chuckles) "Glorified stimulus-response machines" built systems that perfectly solve Lewis signaling games, Eleanor! They converge on stable, *arbitrary* signaling systems – just like Lewis described for driving on the left or right. The outcome *is* convention-like. What more do you want? Blood?

  **Eleanor:** I want the *explanatory mechanism* Lewis identified! The *reason* your agents drive on the left isn't because each expects others to drive on the left *based on common knowledge that everyone expects everyone else to*, knowing full well driving on the *right* would work just fine! It's because... well, frankly, because their weights got reinforced that way through random bumps. There's no *recognition* of the arbitrariness. That's crucial!

  **Ben:** Ah, the sacred "arbitrariness condition." Lewis said: "a convention is arbitrary... because some other regularity *could have been used instead*." Our models demonstrate this *exactly*. For any evolved signaling system, we can re-run the simulation – or even just analyze the game structure – and see countless *other* equally stable signaling systems *could have* evolved instead. The arbitrariness is objectively *there* in the structure of the game and the learning dynamics. The system *didn't need* to "represent" it internally to exploit it.

  **Eleanor:** But that's just contingency from the *modeller's* perspective! Lewis's arbitrariness is *operative within the agents' reasoning*. It's *because* they know "right would work just as well" that their choice of "left" is genuinely conventional, not dictated by reason alone. If your agent doesn't even possess the *concept* of "driving on the right" as a viable alternative, how can its adherence to "left" be *based on* the knowledge that "right" would work? Its behavior is just a brute habit, reinforced by success. It lacks the *intentional stance* towards the alternative. The arbitrariness isn't *doing any work* in sustaining the convention for *them*.

  **Ben:** Hold on. What *sustains* the convention in Lewis? Expectations, right? Sustained by common knowledge. In our models, what sustains the convention? Each agent *learns* that conforming (e.g., sending signal X for state A) *works* – gets reward. Why does it work? *Because the other agents are also conforming*. Agent A doesn't need a theory of Agent B's mind to learn that "when I see state A and do X, I get food." The *functional equivalent* of the expectation – "if I do X in this context, good things happen (because others are doing Y)" – is *learned directly* through reinforcement. The *system* embodies the counterfactual stability – if they *had* converged on signal Z for state A, *that* would be reinforced just as well. The arbitrariness is baked into the learning landscape.

  **Eleanor:** You're conflating outcome with mechanism, Ben. The *system* might be stable under counterfactuals, but the *agents* aren't *acting* based on the *consideration* of those counterfactuals. Lewis's agents choose left *precisely because* they know right is an option and others know it too. That reflective awareness – that common knowledge of arbitrariness – is what makes it a *normative* convention, not just a statistical regularity. Your deep RL agents? They're locked in a local optimum. They don't *know* it's arbitrary; they just *are* there. It's convergent behavior, not convention. Where's the "common knowledge" in a neural net's weights?

  **Ben:** Isn't that demanding too much? Lewis used driving side as a paradigm case. Do you think every driver on the M25 maintains explicit, occurrent common knowledge that driving on the left is arbitrary? Or is it enough that they *act* on the expectation others will drive left, that they *would* recognize the arbitrariness if asked, and that the *social framework* sustains the knowledge? Our models show the behavioral core emerging *without* explicit representation *first*. The arbitrariness is *implicit* in the symmetry of the game and the multiplicity of solutions. The functional role – coordination achieved *because* multiple equilibria exist – is identical. Calling it "just convergent behavior" dismisses the profound coordination achieved. Isn't that the point?

  **Eleanor:** The point *is* the explanation! Lewis was explaining *why* people conform: because of mutually reinforcing expectations grounded in common knowledge, *including* knowledge of arbitrariness. Your models explain *how* conformity *can* arise *without* that rich cognitive structure. You're explaining a *different phenomenon* – one that *looks like* convention but lacks the intentional glue. The arbitrariness condition, for Lewis, isn't just a modeller's observation; it's a *reason* agents have for conforming *in that specific way*. Your agents conform because it pays off. Full stop. They don't conform *because* it's arbitrary. That distinction matters.

  **Ben:** But doesn't the payoff *stem from* the arbitrariness? The payoff exists *because* there are multiple equilibria. The agent learns "X works" *only because* the population settled on X *instead of* Y or Z. The arbitrariness *causes* the payoff structure that reinforces the behavior. The agent doesn't need a meta-representation of "arbitrariness" for arbitrariness to be the fundamental reason its behavior is successful and stable. The counterfactual possibility is *causally relevant* in the world of the simulation, shaping the learning landscape, even if not represented in the agent's "mind."

  **Eleanor:** Causally relevant *externally*, perhaps. But Lewis tied arbitrariness *internally* to the agents' *rationale*. That's the rub. Can a reason exist if it's not represented? Your system has counterfactual stability *we* see, but the *agent* has no access to "it could be otherwise" as a motivating factor. Its motivation is purely instrumental: "Do X, get reward." Lewisian convention involves a richer kind of reason: "Do X *because* it's the established solution *and* we all know Y would also work." One is simple reinforcement; the other is a shared social understanding. They might converge behaviorally, but they are metaphysically different beasts. Your evolved regularity is convention*ish*, Ben, not Convention with a capital 'C'.

  **Ben:** And perhaps Lewis's capital 'C' Convention is an idealized fiction, Eleanor, while our lowercase 'c' conventions are the messy, emergent reality – just as effective, explained by simpler, more scalable mechanisms. The ghost of arbitrariness you insist must be in the machine... maybe it's just the structure of the world the machine is embedded in, doing the work invisibly. The outcome *is* conventional coordination, achieved *because of* arbitrariness, even if the agents aren't philosophers contemplating it. Isn't that enough?

  **(They stare at each other, the chasm between rationalist intent and emergent function as deep as ever. The coffee grows cold.)**

  ## Key Points of Contention Highlighted

  1.  **Nature of Arbitrariness:** Lewisian (Eleanor): Must be *represented* and *operative within the agent's reasoning* as a reason for conformity ("We do X *knowing* Y would work"). Skyrmsian (Ben): Exists *objectively* in the game structure/learning landscape; causes stability and is demonstrated by counterfactual analysis, *without* requiring internal representation.
  2.  **Explanatory Mechanism:** Lewisian: Conformity explained by *mutually referential expectations sustained by common knowledge* (including knowledge of arbitrariness). Skyrmsian: Conformity explained by *reinforcement learning* based on successful outcomes *caused* by population convergence on one arbitrary equilibrium.
  3.  **Role of Common Knowledge:** Lewisian: Essential, constitutive glue holding the convention together. Skyrmsian: Functionally replaced by learned associations based on population behavior; common knowledge might be a *consequence* or *description* of stable conventions, not a prerequisite.
  4.  **Status of the Outcome:** Lewisian: Evolved regularities are *convergent behavior* resembling convention but lacking the essential intentional/representational core. Skyrmsian: Evolved regularities *are* conventions (lowercase 'c') – effective, stable, arbitrary coordination solutions explained by a powerful, general mechanism. Lewis's account over-intellectualizes a fundamentally simpler process.
  5.  **"Could Have Done Just As Well":** Lewisian: Requires agents to recognize/represent the alternative as viable. Skyrmsian: Requires only that the alternative *is objectively viable* within the system's dynamics, demonstrable through counterfactual analysis or re-runs.
