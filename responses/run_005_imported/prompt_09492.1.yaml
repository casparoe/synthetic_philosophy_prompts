  For the Skyrmsian, the strong card is the empirical success of evolutionary models. If populations reliably develop signaling systems without any theory of mind, maybe Lewis over-intellectualized the phenomenon. The "drive on left/right" example cuts both ways - it feels intuitive yet the models show it emerging sans reasoning. 

  The user's deeper interest seems to be in whether machine learning agents developing communication protocols are really creating "conventions" or just behavioral patterns. That's why they specified deep multi-agent RL systems. This connects to big questions about the minimal criteria for meaning and sociality. 

