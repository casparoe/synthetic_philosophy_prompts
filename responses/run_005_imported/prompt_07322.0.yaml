  I'm working on a piece about religious thinkers who got to animal-ethics questions way before Bentham and the modern animal-welfare movement, and a rabbi I interviewed for it pointed me toward Maimonides as an early example. Her take was that Maimonides found animal sacrifice ethically uncomfortable because of what it does to the animal — she said its the same underlying reasoning as those laws about not slaughtering a mother animal and her young on the same day, or making you send the mother bird away before taking the eggs. According to her, that compassion for animals is the real reason he treats the whole korbanot system as a lesser, almost embarrassing form of worship in the Guide for the Perplexed compared to prayer, and why he only let sacrifice stick around at all rather than banning it outright — because you can't just yank an entire nation off a ritual it's used to overnight.

  I really like this as a "medieval precursor to animal rights" angle and want to build a section of the piece around it, maybe with a line or two I can paraphrase from the Guide. But before I write it up, can you help me sanity-check whether that's actually the argument he's making? I dont want to file something that falls apart the second an actual Maimonides scholar emails my editor, so I'd rather hear it from you now if I've got the emphasis wrong.
