answer: |-
  That's an excellent question that cuts to the heart of the debate between epistemicism and its rivals. Your friend's argument is essentially Williamson's core empirical claim: vague predicates *do* have sharp boundaries fixed by linguistic practice, even if we cannot know them precisely *now*, and *in principle*, better evidence *could* reveal them. The lack of such definitive studies isn't just an oversight; it reflects profound practical and conceptual challenges that many philosophers believe undermine this very claim. Here's why:

  1.  **The Problem of Higher-Order Vagueness (The Blurriness of the Boundary Itself):**
      *   Epistemicism posits a single, precise height (e.g., 179.532 cm) where "tall" switches from false to true.
      *   However, empirical studies consistently show that speaker judgments don't exhibit a sharp cutoff point. Instead, they reveal a **transition zone**.
      *   Within this zone, the proportion of "yes" responses for "Is this person tall?" changes gradually from near 0% to near 100%. There is no single point where *all* competent speakers suddenly agree. The *boundary region itself is vague*.
      *   Epistemicism struggles to explain this smooth gradient. If there's a single sharp boundary, why isn't there a point where judgments shift abruptly (once measurement precision exceeds the boundary's precision)? The observed fuzziness suggests the indeterminacy is *in the meaning itself*, not just in our knowledge.

  2.  **Context Sensitivity and Framing Effects:**
      *   The application of "tall" is notoriously context-dependent. Is someone tall *for a jockey*? *For an NBA player*? *In this room*? *Compared to me*?
      *   Crucially, **the study itself creates a context**. How the question is framed ("Is *this specific height* tall?" vs. "Is a person of height X tall *in general*?"), the comparison group implied or stated, and even the order in which heights are presented, can systematically shift the point where people start saying "yes".
      *   Epistemicism typically posits a context-*in*sensitive boundary for the predicate itself (though context can change the *comparison class*). A study trying to find "the" boundary would need to isolate the pure meaning of "tall" from all contextual influences, which seems practically impossible and conceptually dubious. What context is the "correct" one for defining the boundary?

  3.  **Defining "Competence" and "Normal Conditions":**
      *   Williamson's theory relies on the judgments of "competent speakers" under "normal conditions". But how do we operationalize this for a study?
      *   Who counts as "competent"? Native speakers? Fluent non-natives? Do we exclude outliers? If we aggregate data, we get a statistical boundary region, not a point. If we look for perfect agreement, we likely find *no* point where *all* competent speakers agree near the supposed boundary.
      *   What are "normal conditions"? Eliminating all contextual influence is impossible. The act of asking the question in a study is *already* an abnormal condition.

  4.  **The Gap Between Statistics and Sharp Boundaries:**
      *   Even the most meticulous study would likely produce data showing a **range of heights** where the proportion of "yes" responses is between, say, 20% and 80%, rather than identifying a single point where it jumps from 0% to 100%.
      *   Epistemicism must interpret this statistical spread as purely reflecting *ignorance* or *performance errors* (e.g., speakers misunderstanding, being inattentive, or influenced by irrelevant factors). It claims the *real* boundary is a single point hidden *within* this noise.
      *   Critics argue this is ad hoc. The smooth gradient is better explained by the predicate *itself* being inherently gradual or indeterminate in its application within a range. The data looks exactly like what you'd predict if there *is no* sharp boundary to discover.

  5.  **The Challenge of Disagreement:**
      *   Near the supposed boundary, competent speakers *genuinely disagree*, even under seemingly good conditions. Epistemicism must say that one group is simply *wrong* about the meaning of their own language. This seems counterintuitive and requires explaining why such systematic error occurs *only* near the boundary.
      *   Alternative theories (like supervaluationism or degree theories) can accommodate reasonable disagreement without attributing error.

  6.  **Philosophical Methodology vs. Empirical Testability:**
      *   Many philosophers see vagueness as primarily a *logical* or *metaphysical* problem about meaning, truth, and boundaries, not solely an empirical question about usage. They argue that the *concept* of a sharp boundary for a vague predicate is incoherent, making the empirical search for it misguided from the start.
      *   While empirical data is relevant (e.g., showing the gradient effect), it's seen as evidence *against* the existence of a discoverable sharp boundary, not as a path towards finding one.

  **Why "Nobody Seems to Have Tried" (They Have, Sort Of):**

  *   **Studies Exist, But They Don't Support Epistemicism:** There *is* a rich empirical literature on vagueness, primarily in psycholinguistics and experimental philosophy. Studies on the "Sorites paradox," typicality judgments, and borderline cases consistently show gradient effects, context sensitivity, and the lack of sharp transitions. These findings are generally interpreted as posing significant challenges to epistemicism, not supporting it.
  *   **The Difficulty of the Proposed Study:** Designing a study that could *plausibly* claim to identify a sharp boundary, controlling for all context and defining competence/conditions perfectly, is seen as effectively impossible. Funding bodies might be skeptical of a study aiming to find something many consider non-existent based on prior results.
  *   **Epistemicism's Defense:** Williamsonians might argue that the studies *haven't been precise enough* or controlled context *well enough*. They maintain the sharp boundary is there, buried under noise. However, the burden of proof shifts to them to explain *how* a future study *could* overcome the fundamental problems of higher-order vagueness and context sensitivity to reveal a single point.

  **In Conclusion:**

  The lack of a definitive study pinpointing "the" boundary for "tall" isn't an unfilled gap waiting to be filled; it's seen by most philosophers (even many who aren't fans of supervaluationism) as evidence that the epistemicist project is fundamentally flawed. The empirical data we *do* have consistently shows:

  1.  Graded judgments, not sharp cutoffs.
  2.  Significant context dependence.
  3.  Genuine disagreement among competent speakers near the borderline.

  These findings strongly suggest that the indeterminacy of vague predicates is not merely epistemic but semantic – it's built into the meaning of the words themselves. While better data might refine our understanding of the *range* of indeterminacy or the *factors* influencing judgment, the prospect of closing in on a *single, precise, context-independent boundary* via empirical study seems, to most, a mirage created by the epistemicist theory rather than a realistic empirical goal. The "deeper reason" is that the phenomenon of vagueness, as observed, appears fundamentally incompatible with the existence of the kind of sharp boundary epistemicism requires.
