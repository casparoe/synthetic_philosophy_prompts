prompt: |-
  My best friend from college is getting married in a couple weeks and I'm his best man. I'm a backend engineer, not a writer, so I need an actual draft here, not just bullet points. He's been obsessed with Ancient Greek philosophy since undergrad and keeps cornering me at bars insisting that the thing everyone half-remembers about 'Plato and drinking' - the Symposium bit where Socrates outdrinks the whole room and stays unaffected - isn't even the good part. He says the real argument is buried in the Laws: something about using supervised group drinking to test people's self-control the same way you'd test soldiers for courage, a whole bit about needing one sober person in charge or it goes badly, and different rules on how much you're allowed to drink depending on your age. I dont know any of this in real detail, but I want to build my toast around whatever that actual Laws argument is instead of the generic Symposium line everyone else will reach for, because he'll clock the difference immediately and it'll mean way more to him. There's an open bar tonight so it fits naturally. Only catch: besides him and maybe one groomsman, literally nobody in that room (including both sets of parents) has ever heard of the Laws. Can you write me a 4ish minute toast that uses the real argument to say something true about the two of them, still works fine for people who don't know any of this, and doesn't turn into a philosophy lecture with 'cheers' bolted on the end?
