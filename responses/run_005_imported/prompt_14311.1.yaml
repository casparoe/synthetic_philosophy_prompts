answer: |-
  You've nailed the structural similarity between the arguments, which is why Joyce's epistemic utility theory (EUT) initially *feels* like a Dutch Book in disguise. However, the claimed "nonpragmatic" distinction rests on several philosophically significant points, even if the dominance structure is analogous:

  1.  **The Nature of the "Loss" / "Utility":**
      *   **Dutch Book:** The loss is **pragmatic/utilitarian** - *money*. The argument explicitly relies on the agent's presumed desire to avoid monetary loss. Rationality (coherence) is instrumentally valuable for achieving a *practical* goal (avoiding financial exploitation).
      *   **Epistemic Utility (Accuracy):** The "loss" is **epistemic** - *inaccuracy*. The scoring rule (e.g., Brier) is presented as a direct measure of how *incorrect* or *distant from truth* a set of credences is. The goal is **alethic** (truth-related) – having beliefs that accurately represent the world. Rationality (coherence) is argued to be *intrinsically* valuable for achieving the *constitutive aim of belief itself*, which is accuracy/truth.

  2.  **The Source of Normativity:**
      *   **Dutch Book:** The normativity ("you *should* be coherent") derives from a contingent, albeit very plausible, *practical* interest: avoiding sure monetary loss. If an agent genuinely didn't care about money (or the stakes involved), the normative force dissolves.
      *   **Epistemic Utility:** The normativity is claimed to derive from the *essential nature of belief* or *epistemic commitment*. Belief, by its very nature, "aims at truth." Therefore, an agent holding beliefs *necessarily* has an interest in their accuracy. Avoiding accuracy-domination is presented as a requirement of *being a believer*, not just of being a prudent gambler. The scoring rule formalizes this inherent aim.

  3.  **The Role of "Scoring Rules" vs. "Bets":**
      *   **Dutch Book:** The "exploit" involves the agent *voluntarily accepting or offering bets* based on their incoherent credences. The incoherence creates a vulnerability *in the context of a specific action* (betting).
      *   **Epistemic Utility:** The "exploit" is inherent in the credal state itself, *regardless of any action*. The scoring rule is presented as a *legitimate measure* of how well the credences are fulfilling their epistemic function. The incoherent agent is *intrinsically inaccurate* (as measured by any reasonable standard), not just vulnerable to exploitation *if* they engage in a specific practice (betting). The scoring rule reveals a flaw *in the state of belief itself*.

  4.  **Voluntarism & Vulnerability:**
      *   **Dutch Book:** Vulnerability arises *only if* the agent engages in betting using their incoherent prices. An incoherent hermit who never bets avoids the Dutch Book.
      *   **Epistemic Utility:** Inaccuracy is an *inherent property* of the incoherent credal state. The agent is *always* accuracy-dominated *simply by holding those credences*, irrespective of whether they ever engage in any action (like betting) based on them. The flaw is doxastic, not transactional.

  **Why Joyce Claims This is "Nonpragmatic" (and the Counter-Argument):**

  Joyce argues EUT provides a vindication of probabilism based *solely* on the **epistemic goal of accuracy**, decoupled from any practical consequences, desires, or decision-making context. It purports to show that coherence is a *constitutive requirement* for beliefs to serve their fundamental epistemic purpose well. The dominance argument structure is just a tool to demonstrate this inherent epistemic flaw.

  **The Counter-Argument (Your Insight - Why it Might Feel Like a Restatement):**

  1.  **Structural Isomorphism:** The dominance argument *is* formally identical. An incoherent agent is guaranteed to be worse off (lose money / be less accurate) *no matter what the world is like* compared to *some* coherent alternative.
  2.  **"Utility" Still Feels Like a Stake:** Epistemic "utility" (accuracy) *functions* analogously to pragmatic utility (money) within the dominance framework. The agent is still being "exploited" for a "loss" (of accuracy points). If the agent didn't intrinsically value accuracy, the argument would lose its force, just like the Dutch Book loses force if the agent doesn't care about money. This leads some (e.g., Patrick Maher, Richard Pettigrew) to argue that EUT arguments are still fundamentally *pragmatic*, just with an abstract "epistemic utility" replacing money.
  3.  **Scoring Rules as Abstract Bookies:** One can interpret the scoring rule as an abstract, non-intentional "bookie" exploiting the incoherence for "accuracy points" instead of money. The dominance proof then looks like a generalized Dutch Book theorem where the currency is accuracy.

  **The Substantive (if Subtle) Difference:**

  The *claimed* substantive difference isn't primarily in the *structure* of the argument (dominance avoidance), but in the **nature of the goal** used to motivate the norm:

  *   **Dutch Book:** Goal = Avoid pragmatic loss (money). Normativity = Instrumental (coherence serves a practical interest).
  *   **Epistemic Utility (Joyce):** Goal = Achieve epistemic goodness (accuracy/truth). Normativity = Constitutive (coherence is required by the very nature of belief aiming at truth).

  **Conclusion:**

  You are right that the core *exploitability structure* is remarkably similar. Joyce's argument is often seen as a "purified" or "depragmatized" version of the Dutch Book insight. Its claim to being "nonpragmatic" hinges entirely on the assertion that:

  1.  Accuracy is the *constitutive aim of belief* (an intrinsic epistemic good).
  2.  Therefore, demonstrating that incoherence *necessarily* hinders the achievement of this aim provides a justification grounded *in epistemology itself*, not imported from practical rationality.

  Whether one accepts this as genuinely "nonpragmatic" often boils down to whether one accepts premise (1) – that accuracy is an intrinsic, constitutive goal of belief, distinct from and prior to any practical interests. Critics argue that valuing accuracy is still a form of "utility," making the argument pragmatic in a broader sense. Proponents argue that this utility is uniquely tied to the very nature of the doxastic attitude, providing a distinctively epistemic foundation for the norm.

  So, while the *mechanism* (dominance avoidance) is shared, the *justificatory basis* (avoiding pragmatic loss vs. failing an intrinsic epistemic aim) is the locus of the claimed difference. Joyce's argument aims to ground probabilism in the *internal logic of epistemology* rather than in the *external demands of practical action*. Whether it fully succeeds in escaping pragmatism remains a point of active philosophical debate.
