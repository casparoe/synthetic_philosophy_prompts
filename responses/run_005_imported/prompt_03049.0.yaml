answer: |-
  Based on Lewis's framework in "Do We Believe in Penal Substitution?", his judgment of online crowdfunding for fines would likely be nuanced but ultimately critical, seeing it as a significant departure from the "de facto substitution" he tolerated. The public, large-scale, and adversarial nature fundamentally changes the analysis under his criteria for what punishment achieves. Here's how Lewis would likely reason:

  1.  **Applying Lewis's Purposes of Punishment:**
      *   **Retribution:** Lewis argued that retribution requires the *offender* to suffer the burden. Private fine payment by a friend still imposes *some* burden (indebtedness, gratitude, shame) on the offender. However, **crowdfunding by thousands of anonymous strangers severs the direct link between the offender and the burden.** The offender experiences no meaningful deprivation or social debt; the fine becomes a cost borne by an abstract collective. This undermines retribution.
      *   **Deterrence:** Lewis noted that deterrence relies on the *expectation* of suffering the punishment. If potential offenders believe fines can be easily and painlessly offloaded to a crowd of supporters (especially for political acts), **deterrence is significantly weakened.** The widespread *practice* of crowdfunding fines makes this expectation rational, unlike the rarer, private act of a friend paying.
      *   **Expressive Condemnation (Most Critical):** This is where the public and adversarial nature becomes crucial. Punishment expresses society's (via the state) condemnation of the act.
          *   **Private Payment:** A friend quietly paying a fine is a *private* act. It doesn't challenge the state's expression of condemnation; it merely alleviates the offender's financial burden. The condemnation itself stands unchallenged publicly.
          *   **Public Crowdfunding:** This is an **inherently expressive, counter-condemnatory act.** Pooling money openly is a public statement: "We do *not* condemn this act/person; we support them and reject the state's judgment/law." It transforms the payment from a private favor into a **public protest against the punishment, the conviction, or the law itself.** This directly contradicts and undermines the state's expressive purpose.
      *   **Compensation:** Fines are typically paid to the state, not the victim, so compensation isn't usually a primary goal of fines. Crowdfunding doesn't change this aspect significantly.

  2.  **Revisiting Lewis's "Easy Explanation" & Why Fines Seem Special:**
      Lewis argued we tolerate fine substitution privately because fines possess unique characteristics that other punishments lack:
      *   **Compensability:** The harm of losing money *can* be compensated by receiving money.
      *   **Transferability:** Money is fungible; who provides it doesn't inherently change the nature of the payment to the state.
      *   **Commodifiability:** Money is an impersonal medium.
      *   **Practicality:** Policing private gifts is impossible.
      He rejected that practicality was the *real* reason, pointing out we don't list substitutability as a flaw of fines. However, **crowdfunding explodes the scale and publicity, forcing a re-evaluation:**
      *   **Scale & Anonymity:** The "transferability" and "commodifiability" assumed a direct, knowable relationship (friend-to-offender). Mass anonymous giving turns the payment into an impersonal transaction for the offender, stripping away the social context Lewis saw as preserving *some* burden (gratitude/shame).
      *   **Publicity & Expression:** This directly attacks Lewis's core point about expression. The "easy explanation" of practicality never envisaged substitution becoming a powerful *tool for public counter-expression*. The fact that we *don't* normally list substitutability as a flaw presumes substitution remains *private and non-expressive*. Public, adversarial crowdfunding *does* reveal a significant flaw in fines *as expressive condemnation* when this occurs.

  **Lewis's Likely Judgment:**

  1.  **Not Just "De Facto Substitution":** Lewis would argue that public, large-scale, adversarial crowdfunding is **qualitatively different** from the private friend-paying-a-fine scenario he described. It's not merely the same tolerated practice on a larger scale; it fundamentally alters the social meaning and impact of the punishment.
  2.  **Undermines Punishment's Purposes:** Specifically, it **severely undermines the expressive condemnation** function of punishment by creating a powerful, public counter-narrative of support and justification. It also **weakens retribution** (by removing the offender's burden) and **deterrence** (by making punishment seem avoidable).
  3.  **Changes the Calculus on Fines:** Faced with this phenomenon, Lewis might concede that **crowdfunding *does* expose a genuine drawback of fines** that wasn't apparent with private substitution: their vulnerability to being co-opted as a platform for mass counter-protest and the nullification of their expressive and retributive force. This vulnerability becomes a practical and philosophical problem for using fines, especially for offenses where public sympathy or opposition to the law exists.
  4.  **Adversarial Intent is Key:** The deliberate use of crowdfunding as solidarity or protest is central. Lewis would see this *intent* as transforming the act from burden-relief into a direct challenge to the state's authority to condemn and punish. This adversarial intent makes it incompatible with the tolerated model of private substitution, which implicitly accepted the state's judgment while mitigating its financial impact on an individual.

  **Conclusion:** David Lewis would likely judge online crowdfunding for fines, *especially* when done publicly and adversarially, as a practice that invalidates the reasons he thought fine substitution was tolerable. It moves far beyond "de facto substitution" and instead becomes a public act of **counter-condemnation** that actively undermines the expressive, retributive, and deterrent purposes of punishment. He would see it as exposing a serious flaw in the use of fines that demands a societal response – perhaps stricter rules against third-party payments for certain offenses, a move towards non-fungible punishments, or a recognition that fines are simply inadequate as expressive condemnations in the face of organized public dissent. The publicity, scale, and intent fundamentally change the analysis.
