  Okay, the user is part of a reading group that's discussing Bayesian methods but has veered into the Sleeping Beauty problem. They're confused about why the thirder position (credence of 1/3 for Heads) is taken seriously when their own reasoning, based on Bayesian conditionalization, points to 1/2. They feel that since Beauty learns nothing new upon waking (because she knew she'd wake up regardless), her credence should remain 1/2. They're frustrated that smart people seem to ignore basic Bayesian principles.

  First, I need to recall the Sleeping Beauty problem details. Beauty is put to sleep, a coin is flipped. Heads: woken Monday only. Tails: woken Monday and Tuesday, with amnesia between. Upon waking, she doesn't know the day or how many times she's been woken. The question is her credence for Heads when she wakes.

  The user's argument is that since she knew she'd wake up no matter what, the evidence "I'm awake now" doesn't discriminate between Heads and Tails. So by Bayesian updating, P(Heads) should stay 1/2. The user thinks thirders are making a mistake.

