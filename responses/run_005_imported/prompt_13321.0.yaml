  The functionalist needs to address the "nation as brain" objection. This is a common reductio ad absurdum: if a whole country's population mimicked neurons with radios, would it be conscious? The functionalist could respond by emphasizing causal organization—arguing that if the system has the right causal interactions at the right temporal scales, it could be conscious, even if it seems counterintuitive. Or they could refine functionalism to require biological properties, but that might weaken their position.

