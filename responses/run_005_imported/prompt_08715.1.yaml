answer: |-
  Based on Anscombe's rigorous application of the principle of double effect (PDE), particularly her emphasis on the *intention of the harm* as the means versus merely *foreseeing* it, she would almost certainly condemn both "double tap" strikes and "signature strikes" as morally equivalent to Truman's bombing of Hiroshima and Nagasaki – that is, as murder. Here's why:

  1.  **Double Tap Strikes: The Intention is Clear**
      *   **The Means is the Harm to Rescuers:** In a double tap strike, the *entire purpose* of the second strike is to kill those who have come to aid the wounded. Their presence and their act of mercy *is the trigger* for the attack. They are not collateral damage; they are the *intended target* of the second strike.
      *   **Anscombe's Distinction:** Anscombe argued Truman chose to kill civilians *as the very mechanism* to force surrender ("terror bombing"). Similarly, in a double tap, commanders choose to kill rescuers *as the very mechanism* to eliminate more combatants, exploit the chaos of the first strike, and deter future aid. The harm (killing rescuers, who are often civilians or *hors de combat* combatants) is not a foreseen side effect; it is the chosen *means* to the end (maximizing enemy casualties). This violates the core PDE tenet that evil cannot be *intended* as a means to a good end.
      *   **No Double Effect Defense Possible:** The double effect defense utterly fails here. The good effect (killing more enemy fighters) is achieved *directly* through the evil effect (killing the rescuers). The evil effect is not merely foreseen but *intentionally used*. Anscombe would see this as paradigmatic murder.

  2.  **Signature Strikes: Intention Through Recklessness and Ambiguity**
      *   **Targeting Uncertainty:** Signature strikes target individuals based on patterns of behavior ("military-aged males" in certain areas, meeting patterns, etc.) *without confirmed identity*. This inherently involves massive uncertainty about whether the individuals are actually combatants or civilians engaged in innocent activities.
      *   **Intending Harm to Civilians (De Facto):** Anscombe would argue that launching an attack *knowing* there is a high probability (or even certainty) that civilians will be killed, *and* where the justification rests on inherently ambiguous criteria that blur the combatant/non-combatant distinction, constitutes a form of *intentional* harm to civilians.
      *   **Recklessness as Culpability:** If you launch a strike where you *know* you cannot reliably distinguish combatants from non-combatants based on the targeting criteria used, you are effectively *choosing* to accept civilian deaths as part of the plan. While the *stated* intention might be to kill combatants, the *method chosen* guarantees civilian deaths will occur and are accepted as part of the cost of doing business. For Anscombe, this recklessness regarding the death of innocents, especially when it forms the basis of the tactic, approaches intentionality. She argued forcefully that one must take *utmost care* to avoid harming innocents. Signature strikes, by their nature, often fail this test spectacularly.
      *   **The "Greater Good" Fallacy:** The justification often given ("it disrupts networks," "saves lives in the long run") mirrors the Truman defense Anscombe rejected. She argued that intending the death of innocents as a means (or accepting it with reckless indifference through the chosen method) *cannot* be justified by appealing to a greater good. The act itself is intrinsically evil.

  **Key Differences from "Legitimate" Collateral Damage (in Anscombe's PDE framework):**

  *   **Legitimate Target:** For collateral damage to be merely foreseen, the *primary target* must be a legitimate military objective (e.g., a command bunker, an ammunition depot). In double taps, the second strike targets rescuers (often non-combatants). In signature strikes, the target's status is fundamentally uncertain.
  *   **Proportionality & Necessity:** Even if a target were legitimate, the harm to innocents must be proportionate and unavoidable to achieve the military objective. Double taps deliberately *create* the situation where more innocents/hors de combat are killed. Signature strikes often lack the necessity of certainty required by proportionality – less risky (to civilians) alternatives (like surveillance for positive ID) are often bypassed for speed/convenience.
  *   **Intention:** This is paramount. In "clean" collateral damage (rare as it may be), the deaths of nearby civilians are genuinely *unintended*, even if foreseen. The bomber aims *only* at the legitimate target. In double taps and signature strikes, the harm to innocents is either directly intended (double tap) or is the inevitable and accepted consequence of a deliberately chosen, inherently indiscriminate method (signature strike).

  **Conclusion:**

  By Elizabeth Anscombe's lights, both double tap strikes and signature strikes would constitute murder, just like Truman's atomic bombings.

  *   **Double Taps:** Clearly intend the death of rescuers (often non-combatants or *hors de combat*) as the *means* to achieve a military objective. This is a direct violation of the prohibition against intending evil as a means.
  *   **Signature Strikes:** Employ a method that, due to its inherent ambiguity and lack of positive identification, inevitably and foreseeably results in the deaths of innocent civilians. By choosing this method despite the known high risk, commanders effectively *accept* and *intend* (in the culpable sense of reckless disregard) the death of innocents as part of the operational plan. This fails the requirement for discrimination and the duty to avoid harm to non-combatants at all costs. The appeal to "greater good" or "overall lives saved" would be as morally bankrupt to Anscombe in this context as it was for Hiroshima.

  Anscombe's argument is uncompromising: tactics that intentionally use the killing of innocents as a tool, or that show reckless disregard for their lives through the chosen method of operation, cannot be morally justified, regardless of the strategic goals they aim to achieve. Your cousin's description falls squarely into the category she condemned.
