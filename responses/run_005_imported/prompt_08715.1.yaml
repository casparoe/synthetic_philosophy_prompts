  I keep trying to map her argument onto what my cousin described, and onto "signature strikes" generally (targeting based on behavior patterns instead of confirmed identity). Using her actual intend-as-a-means vs merely-foreseen distinction, not just generic double-effect talking points, what do you think she'd say about double-tap and signature strikes? Do they count as Truman-style murder by her lights, or is there something about them that could actually earn the double-effect defense she refused to extend to Hiroshima?
