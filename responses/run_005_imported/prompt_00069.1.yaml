prompt: |-
  I'm TAing an intro decision theory seminar, and last week we spent a painful two hours on updateless decision theory (UDT) and why it's supposed to outperform causal and evidential decision theory on problems like counterfactual mugging. Half the class left more confused than when they walked in, and one student asked if UDT just means "never learning from experience," which, fair enough, is not a totally unreasonable misreading. I want to end this week's section on a lighter note.

  Write a joke about updateless decision theory that would actually land with someone who understands the distinction between updating your policy versus updating your beliefs, and who gets why a UDT agent commits ex ante to a strategy rather than recomputing its choice after receiving new information. The humor should hinge on some real, specific feature of UDT (e.g., its relationship to precommitment, its weirdness around counterfactual mugging or Newcomb's problem, or its refusal to condition on being told which "branch" of a decision problem it's in) rather than just being a generic joke about robots or rationality. Bonus points if it could also gently roast the kind of person who brings up UDT unprompted at parties.
reasoning: |-
  Okay, the user is a TA for an intro decision theory seminar. They've just covered updateless decision theory (UDT) and it was a rough session—students were confused, and one even misinterpreted UDT as "never learning from experience." Now, the TA wants to lighten the mood with a joke that actually lands with students who grasp the core concepts: the distinction between updating policies versus beliefs, and why UDT agents commit to strategies ex ante rather than recomputing choices after new information. 

  The joke needs to be technically precise, targeting a specific UDT feature like precommitment, counterfactual mugging weirdness, or refusal to condition on decision branches. Bonus if it roasts the type who brings up UDT unprompted socially. 

  First, I should recall UDT's essence: it treats decisions as selecting a complete policy across all possible worlds upfront, ignoring which world you "actually" inhabit. This leads to quirky outcomes, like paying in counterfactual mugging even when you know the coin landed tails. The humor should highlight this counterintuitive rigidity—how UDT agents act as if all branches exist simultaneously, optimizing globally. 

  For the roast angle, I imagine a socially awkward rationalist who can't resist explaining UDT at parties, framing normal choices (like grabbing chips) as existential commitments. The punchline should juxtapose mundane scenarios with UDT's grandiose framework, e.g., treating a snack decision as binding across quantum branches. 

  Technical elements to include: 
  - Ex ante optimization over logical possibilities 
  - Policy selection > belief updating 
  - Counterfactual consistency requirements 

  Delivery tip: Keep it concise—UDT jokes lose potency if over-explained. Lean on absurdity: "Imagine optimizing your entire life strategy before knowing your own name."
answer: |-
  Okay, here's a joke that targets the core UDT concept of ex-ante policy commitment while roasting the archetype who brings it up socially. It relies on understanding that UDT selects a *single fixed response function* for all possible observations upfront, rather than updating beliefs and re-optimizing.

  **The Joke:**

  > Why did the UDT agent get kicked out of the party?
  >
  > Because they kept explaining why they *had* to take the last slice of pizza – not because they were hungry *now*, but because their ex-ante optimal policy, computed before seeing the pizza or knowing anyone else's preferences, mandated claiming exactly one slice in any possible world where pizza is present. They even offered to pay the host $20 if it turned out the pizza was secretly a counterfactual mugging test.

  **Why it works (for the students who get UDT):**

  1.  **Ex-Ante Commitment:** The punchline hinges entirely on the UDT agent making a decision *before* having any specific information (about current hunger, other guests, the actual pizza situation) and then rigidly sticking to that precomputed policy ("claim exactly one slice").
  2.  **Ignoring "Which World":** The agent doesn't care *which* pizza-containing world it's actually in ("party with friends," "test scenario," "counterfactual mugging"). It only cares about the precomputed output of its policy function for the input "pizza present."
  3.  **Counterfactual Mugging Nod:** Throwing in the offer to pay $20 if it's a test directly references the weirdness of UDT in Counterfactual Mugging. The agent is willing to pay in a situation where CDT/EDT would definitely not pay (they *know* they didn't "lose the coin flip" because they see the pizza is real), purely because their ex-ante policy requires consistency across branches. This highlights the "refusal to condition on being told the branch" aspect.
  4.  **The Gentle Roast:** It perfectly captures the socially awkward rationalist who uses hyper-abstract decision theory to justify mundane, selfish behavior ("taking the last slice") in a way that sounds utterly alien and self-serving to normal people. Bringing up UDT unprompted *at a party* is the specific archetype being roasted. The "kicked out" part emphasizes the social disconnect.
  5.  **Specificity:** It uses actual UDT terminology ("ex-ante optimal policy", "possible world") and concepts (fixed response function, ignoring current evidence for precommitment, counterfactual mugging logic) accurately.

  **Delivery Tip:** Lean into the dryness and faux-seriousness of the UDT agent's explanation when delivering the punchline. The humor comes from the extreme mismatch between the social context and the overly formal, globally-optimizing justification.
