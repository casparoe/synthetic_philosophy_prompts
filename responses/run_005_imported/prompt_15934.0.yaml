answer: |-
  Your unease is intellectually defensible and stems from several ethical and psychological tensions inherent in this situation. While Maya *technically* had the right to call out Daniel's fabrication (as a colleague witnessing misconduct), her own history creates significant complications that make her intervention ethically fraught, even if factually correct. Here's a breakdown:

  **Why Maya's Call-Out Feels Problematic:**

  1.  **The Hypocrisy Perception (Even If Not Strictly Logical):** Human morality is deeply sensitive to perceived hypocrisy. Maya benefited from private correction for the *exact same offense*, allowing her to reform without public shaming or professional damage. Denying Daniel that same opportunity—especially through a *public* and "sharp" confrontation—creates a stark contrast. Even if Maya is "reformed," the act of calling out feels like pulling the ladder up behind her. Social psychology research (e.g., on moral hypocrisy and licensing) shows people judge hypocritical actors more harshly, even when their *current* statement is factually correct.

  2.  **Lack of Empathy & Procedural Injustice:** Having experienced the pressure, fear, and poor judgment that likely led to her own fabrication, Maya is uniquely positioned to understand Daniel's motivations (without excusing them). Her harsh public call-out demonstrates a surprising lack of the empathy she presumably received. Furthermore, her own violation was handled with discretion (procedural justice focused on restoration), while she inflicted public censure on Daniel (procedural justice focused on punishment). This inconsistency is jarring.

  3.  **Moral Credibility Erosion:** While reformed, Maya's undisclosed past directly undermines her *moral credibility* in *this specific domain*. Calling out CV fraud requires not just being *currently* ethical, but also having clean hands *regarding the specific issue*. Her past creates an unavoidable conflict of interest – her zeal could be misread (or even partially motivated by) overcompensation or distancing herself from her own past.

  4.  **Potential for Unintended Harm:** Maya's approach risks:
      *   **Defensiveness in Daniel:** A public shaming makes genuine remorse and learning less likely.
      *   **Erosion of Lab Trust:** If her past *were* revealed later, it would severely damage her credibility and create cynicism.
      *   **Creating a Culture of Fear:** Focuses on punishment over learning and ethical growth.

  **Arguments for Maya Having a "Right" (and Why They Are Incomplete):**

  1.  **Current Facts are Correct:** She wasn't lying about Daniel's misconduct. Truth matters.
  2.  **Collective Responsibility:** Lab members *do* have a responsibility to uphold integrity. Ignoring fraud harms the lab's reputation and fairness.
  3.  **Reformation is Real:** People can change and become strong advocates against past misdeeds. Her vigilance *could* stem from hard-earned wisdom.
  4.  **No One Else Did It:** If others were silent, *someone* needed to address it.

  **However, these arguments miss the nuance:**

  *   **Right vs. Appropriate:** She may have had a *right*, but given her history, it was likely *inappropriate* and *ineffective* for *her* to be the one to deliver the confrontation, especially publicly and harshly. The *how* and *who* matter immensely.
  *   **Superior Alternatives:** Knowing her history, Maya could have:
      *   Spoken privately to Daniel, sharing her own past experience (confidentially) to emphasize the seriousness and the possibility of reform.
      *   Encouraged the PI or another senior, uninvolved lab member to address it discreetly with Daniel.
      *   Raised the *general issue* of CV accuracy in a lab meeting without singling anyone out, drawing on her experience to stress its importance.

  **Conclusion: Your Reaction is Defensible**

  Your discomfort is valid. Maya's own undisclosed past identical misconduct, coupled with the *public* and *sharp* nature of her call-out (contrasted with the private correction she received), makes her intervention ethically problematic, despite Daniel's genuine wrongdoing and Maya's current reformed state. It creates an appearance (and potential reality) of hypocrisy, demonstrates a lack of empathetic proportionality, and undermines her moral authority on this specific issue.

  **What This Means for You:**

  1.  **Validate Your Feelings:** Your intuition about the inconsistency and lack of fairness is sound.
  2.  **Consider the Source (Maya):** This likely reflects more on Maya's own unresolved feelings about her past (guilt, overcompensation) than on Daniel's relative innocence. Her reaction may be about *her*, not just him.
  3.  **Maintain Confidentiality:** Maya shared her past with you in confidence. Breaching that trust would create a separate, significant ethical problem.
  4.  **Focus on Daniel's Outcome:** While Maya's approach was flawed, the core issue is Daniel's fabrication. The PI *must* address this appropriately (ideally with a restorative, educational focus, given it's likely a first offense). Your concern should be that Daniel is dealt with fairly and constructively, *despite* Maya's problematic intervention.
  5.  **Reflect on Lab Culture:** Does the lab have clear guidelines on authorship/CV practices? Is there a culture where mistakes can be admitted and corrected privately? This incident highlights potential gaps.

  Maya's reformation doesn't erase the ethical complexity of her choosing to be Daniel's public accuser. The most defensible path forward would have leveraged her unique perspective for private mentorship or general advocacy, not public condemnation. Your unease reflects a sophisticated understanding of the messy interplay between past actions, present integrity, and the nuances of calling out misconduct.
