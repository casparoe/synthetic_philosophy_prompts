prompt: |-
  My younger brother is finishing a PhD on Molinism -- the 'middle knowledge' view where God knows exactly what every possible free creature would choose in every possible circumstance, without that knowledge forcing the choice -- and hes marrying his boyfriend in three weeks. I write about science and ideas for a living, so naturally I got roped into giving the toast, to a room thats half his philosophy of religion cohort and half relatives who just want something nice about fate. He's already banned me from saying they were "destined" to meet (too deterministic, undercuts the whole point of his dissertation) and my aunt will be genuinely hurt if it sounds like they met by pure chance instead. Can you write me a wedding toast, around 350 words, warm and a little funny, that actually uses middle knowledge honestly to thread that needle -- meant to be AND freely chosen -- without turning into a seminar?
