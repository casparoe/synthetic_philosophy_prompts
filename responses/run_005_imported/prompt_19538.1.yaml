  2.  **Alex (Wrightian) Presses:**
      *   **Inference:** How can arational hinges play a premise-like role? ("functioning as the suppressed major premise," "render inference groundless").
      *   **Relativism/Flat-Earther:** How can non-doxastic certainty block the equivalence of competing hinges? ("what stops the flat-earther?", "both are equally legitimate?"). Wright's answer via indispensability/internal coherence of inquiry is argued.
  3.  **Wittgensteinian Grounding:** Constant reference to riverbed, language-games, framework, constitutive role (Pritchard) vs. enabling role within inquiry (Wright).
  4.  **Even Match:** Both get strong points in. Alex defends normativity; Sam defends radical constitutivity. The relativism point is a major clash.
  5.  **No Resolution:** Ends with fundamental disagreement intact ("chasm... as wide as ever").
