answer: |-
  That's an incredibly sharp observation – you've hit on one of the most profound challenges in philosophy of science. Keeley's "self-sealing" critique *does* resemble how science handles anomalies via auxiliary hypotheses (the Duhem-Quine problem). The difference isn't in the *initial move* but in the **structure, constraints, and consequences** of how these hypotheses function. Here's a principled breakdown, avoiding question-begging:

  1.  **Testability & Novel Predictions (The Lakatosian Core):**
      *   **Science (Progressive Programs):** Auxiliary hypotheses (like "undiscovered planet") **must generate novel, specific, testable predictions.** Neptune's prediction wasn't just "something is out there." Le Verrier calculated its *exact mass, orbit, and position*. Galle found it *where predicted* within 1° – a stunning confirmation. Even Vulcan, while wrong, made *specific, falsifiable predictions* about transit times and locations. Its failure *was* a genuine anomaly for Newtonian gravity.
      *   **Conspiracy Theory (Degenerating Programs):** The "cover-up" hypothesis **absorbs counter-evidence without generating novel, specific, testable predictions.** It explains *why* evidence *isn't* found ("they destroyed it"), but doesn't predict *where* to find hidden evidence, *who* specifically would leak it next, or *what exact form* the cover-up mechanism takes beyond the immediate counter-claim. It predicts only that *all* counter-evidence *will* be explained as part of the cover-up – a circular, self-sealing loop. The prediction is unfalsifiable by design.

  2.  **Corrigibility & Response to Failure:**
      *   **Science:** Auxiliary hypotheses are **provisional and subject to abandonment.** The failure to find Vulcan *persisted* as a major problem. Astronomers searched diligently based on predictions. When Vulcan remained elusive *despite specific searches*, and especially after Einstein's GR *successfully explained Mercury's orbit without it*, the Vulcan hypothesis was abandoned. The core theory (Newtonian gravity) was eventually modified/replaced.
      *   **Conspiracy Theory:** The "cover-up" hypothesis is **immune to abandonment.** Failed predictions (e.g., "Document X *will* prove it when released!") don't falsify the core conspiracy; they reinforce the cover-up ("They doctored the release!"). There's no point where lack of evidence *counts against* the theory; it only deepens the alleged cover-up. The hypothesis evolves *only* to protect the core, never to refine or replace it based on evidence.

  3.  **Explanatory Scope & Parsimony:**
      *   **Science:** Auxiliary hypotheses aim for **explanatory power with minimal added complexity.** Neptune explained Uranus's anomaly *and* predicted a new planet discoverable with existing tools. Even Vulcan, while wrong, was a *plausible* extension of known physics (unseen masses) to solve a specific anomaly.
      *   **Conspiracy Theory:** The "cover-up" hypothesis **expands exponentially in complexity and scope.** To explain the *lack* of evidence, it posits increasingly vast, competent, and perfectly secretive networks ("They control all media, academia, government records, witnesses!"). This requires attributing near-superhuman competence and loyalty to countless individuals over long periods, often contradicting known human fallibility and organizational inefficiency (JFK documents involve *thousands* of people over *decades*). It becomes vastly *less* parsimonious than the official account it seeks to replace.

  4.  **Independence & the "Conspiracy Catch-22":**
      *   **Science:** Auxiliary hypotheses **can be investigated independently.** Neptune's existence could be (and was) searched for *without* presupposing Newton was wrong. Seismology probes Earth's core independently of gravity theories.
      *   **Conspiracy Theory:** The "cover-up" hypothesis **creates a catch-22 preventing independent investigation.** Any source deemed "official" (governments, mainstream media, credentialed experts) is *defined* as part of the cover-up *by the theory itself*. This eliminates the possibility of *any* counter-evidence originating from these sources being accepted. Investigation is forced to rely solely on sources *already aligned* with the conspiracy narrative, creating an echo chamber. There is *no* conceivable evidence from "the system" that could falsify the cover-up claim.

  **Applying this to Neptune/Vulcan vs. JFK Cover-Up:**

  *   **Neptune:** **Progressive.** Novel, specific, testable prediction ✅. Explained anomaly ✅. Didn't require abandoning core physics ✅. Independent discovery possible ✅.
  *   **Vulcan:** **Degenerating (in hindsight).** Novel, specific, testable prediction ✅. *Failed* prediction ❌. Persisted as anomaly ✅. *Eventually abandoned* when better theory emerged and searches failed ✅. Shows science *can* get stuck but has mechanisms (eventually) to correct.
  *   **JFK Cover-Up Claim:** **Degenerating/Unwarranted.** Explains *lack* of evidence, not evidence ❌. No novel, specific, testable predictions generated ❌ ("They hid it" isn't testable). Immune to counter-evidence (official denial = proof of cover-up) ❌. Requires vast, implausible competence/secrecy ❌. Creates catch-22 preventing independent verification ❌.

  **Conclusion:** Keeley's "self-sealing" criterion *isn't* invalidated by the Duhem-Quine problem. The crucial difference lies in **whether the auxiliary hypothesis generates independent, testable predictions and remains corrigible, or whether it functions solely as an unfalsifiable shield that expands uncontrollably in complexity and scope.** Science *aims* for the former (and corrects when it slips towards the latter, like with Vulcan). Unwarranted conspiracy theories are *defined* by the latter. The mechanism isn't "which one is true," but **how the structure of the hypothesis interacts with evidence and the possibility of falsification.** Science builds ladders to climb higher; unwarranted conspiracy theories build walls.
