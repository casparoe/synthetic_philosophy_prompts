  But note: the grain-of-truth problem might be partially addressed by having diverse training data and fine-tuning. So it's not a top priority.

  Also, the 5-and-10 problem: if we are using LLMs for decision-making that involves counterfactuals (e.g., "what if I had done X?"), then spurious counterfactuals might cause issues. But it's not clear how often this happens in practice. So A tier seems appropriate.

