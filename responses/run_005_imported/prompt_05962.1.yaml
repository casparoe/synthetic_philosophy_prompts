answer: |-
  Your critique is spot-on and reflects a sophisticated understanding of Grafen's formalization. I'll rigorously defend the marginal-cost interpretation against the popular "absolute/net cost" generalization, addressing both theoretical objections and empirical challenges:

  ### Core Argument: Marginal Cost, Not Absolute Cost, Enforces Honesty
  Grafen's (1990) model demonstrates that honesty is enforced by **differential marginal costs**, not absolute costs paid at equilibrium. The key condition is:
  $$\frac{\partial^2 \text{Cost}(s,q)}{\partial s \partial q} < 0$$
  Where *s* is signal intensity and *q* is quality. This means:
  1.  **Cost increases more steeply for low-quality individuals** when increasing signal intensity.
  2.  At the **separating equilibrium**, high-quality individuals choose a signal level *s(q)* where:
      *   Their marginal cost of signaling equals the marginal benefit (e.g., mating success).
      *   The **net cost** (cost - benefit) can be **arbitrarily low, zero, or even positive but small** if benefits sufficiently offset costs.
  3.  **Enforcement is counterfactual:** Honesty is maintained because a low-quality individual *attempting to mimic* a high-quality signal would incur costs exceeding benefits. The high-quality individual pays only the cost necessary to secure their benefit.

  ### Countering Traditionalist Objections & Empirical Challenges

  1.  **Objection: "Without Absolute Costs, Cheating Would Pay!"**
      *   **Rebuttal:** Grafen's equilibrium explicitly proves cheating *doesn't* pay precisely *because* of the differential marginal cost structure. A low-quality cheater faces:
          *   **Higher absolute cost** to produce the same *s*.
          *   **Lower marginal benefit** (e.g., they might attract mates but fail to sire as many offspring due to lower actual quality, or suffer higher predation).
          *   Thus, **Net Benefit(cheat) = Benefit(s_high) - Cost(s_high, q_low) < Benefit(s_low) - Cost(s_low, q_low) = Net Benefit(honest_low)**. The cheater is worse off. The high-quality individual pays Cost(s_high, q_high), which is manageable *for them* due to their quality.

  2.  **Objection: "But Showcase Signals *ARE* Costly! Look at Peacocks/Gazelles!"**
      *   **Rebuttal (Net Cost Perspective):** Observed costs are often gross costs, not *net* costs at equilibrium. For high-quality individuals:
          *   **Benefits directly offset costs:** A prime peacock's train secures matings. A stotting gazelle avoids predation. The *net* fitness cost (lifetime reproductive success) might be negligible or even negative (net gain) compared to not signaling, *if* they are high quality.
          *   **Quality reduces *net* cost:** High-quality individuals often have superior resource acquisition. The energy "cost" of a train is a smaller fraction of a dominant peacock's intake than a subordinate's. Their "efficiency" (part of *q*) lowers the *net burden*.
          *   **Empirical nuance:** Studies *do* show costs (e.g., train-impaired peacocks are more agile), but crucially, they show **differential survival costs** consistent with marginal cost theory. Lower-quality signalers suffer disproportionately. High-quality males often show minimal survival deficit *despite* large signals.

  3.  **Objection: "Marginal Cost is Just Theoretical; Real Signals Require Resources!"**
      *   **Rebuttal:** Resources are necessary, but their *impact* is differential. The marginal cost condition translates resource expenditure into fitness consequences:
          *   **Resource Cost ≠ Fitness Cost:** Diverting 100 kcal to a train reduces fitness less for a peacock with abundant resources/high efficiency (high *q*) than for one on the margin (low *q*). This fitness translation is captured by ∂²Cost/∂s∂q < 0.
          *   **"Cost" is Fitness Opportunity Cost:** The "cost" enforcing honesty is the *fitness* low-quality individuals would lose by signaling, arising from trade-offs (forgone growth, immunity, predator evasion). High-quality individuals mitigate these trade-offs better.

  4.  **Objection: "The 'Counterfactual Cost' Isn't Empirically Measurable!"**
      *   **Rebuttal:** While challenging, it *is* testable:
          *   **Manipulation Experiments:** Artificially enhancing signals in low-quality individuals (e.g., attaching longer feathers) should show severe fitness costs (reduced survival/reproduction) not seen in high-quality individuals bearing natural signals. This directly tests the counterfactual.
          *   **Correlational Studies:** Finding that signal expression correlates negatively with fitness *only* (or much more strongly) in low-quality individuals supports differential marginal costs. High-quality individuals should show weak/no correlation or even a positive one (if benefits dominate).

  ### Addressing the Showcase Examples Within the Marginal Framework

  1.  **Peacock's Train:**
      *   **Traditional View:** Huge, cumbersome, energetically costly, increases predation risk. *Must* be a net burden to be honest.
      *   **Marginal Cost View:**
          *   **Differential Cost:** Parasite load/nutritional stress disproportionately impairs train development/maintenance in low-quality males. The *marginal fitness cost* (e.g., reduced flight agility per unit train length) is higher for them.
          *   **Net Cost at Equilibrium:** For a high-quality male with abundant food, low parasite load, and efficient metabolism, the *net* cost of a full train (after mating benefits) may be minimal. The cost enforcing honesty is the crippling predation risk/mobility cost a low-quality male *would* face if he grew an equally large train. The high-quality male pays the "list price"; the low-quality male faces "bankruptcy" for trying.

  2.  **Gazelle Stotting:**
      *   **Traditional View:** Wastes energy and time during a chase, must signal high fitness by showing you can afford this waste.
      *   **Marginal Cost View:**
          *   **Differential Cost:** Stotting relies on explosive muscle power and stamina. Low-quality gazelles (injured, ill, young/old) face a much steeper *marginal increase* in predation risk by stotting (they slow down more, tire faster) than high-quality gazelles.
          *   **Net Cost at Equilibrium:** For a prime gazelle, the brief delay from stotting might be negligible against a predator assessing targets, and the benefit (deterrence) is immediate. The energy cost is trivial relative to their reserves. The cost enforcing honesty is the near-certain death a low-quality gazelle *would* face by stotting (slowing down too much). The high-quality gazelle pays a small insurance premium; the low-quality one would pay with its life.

  ### Conclusion: Why the Marginal View is Superior

  1.  **Theoretically Precise:** Grafen's model provides the necessary and sufficient conditions for a stable signaling equilibrium. Absolute cost is neither necessary nor sufficient. Differential marginal cost *is* necessary.
  2.  **Explains Paradoxes:** Resolves the apparent paradox of why high-quality individuals *can* bear seemingly extravagant signals without crippling net costs – because their quality buffers the cost, and benefits offset it.
  3.  **Empirically Robust:** Explains *why* we observe correlations between signal size and quality (differential cost structure), *why* manipulation experiments work (testing the counterfactual), and *why* costs seem apparent (gross costs exist, but net costs are key).
  4.  **Unifies Mechanisms:** The marginal cost condition (∂²Cost/∂s∂q < 0) can arise from multiple biological mechanisms (resource allocation efficiency, physiological trade-offs, vulnerability to predators), providing a general framework.

  The popular "signals must be costly" mantra is an oversimplification that misrepresents the core theoretical insight. **Honesty is enforced not by the absolute cost paid by honest signalers, but by the prohibitively high *marginal cost* that would be incurred by any low-quality individual attempting dishonesty.** At equilibrium, high-quality individuals can indeed enjoy informative signals at little or no *net* fitness cost, precisely because their quality allows them to bear the signal's burden efficiently and reap its benefits. Grafen's marginal-cost framework provides the rigorous foundation that Zahavi's intuition required, and it remains the definitive game-theoretic understanding of the handicap principle. Your fieldwork-informed reading aligns perfectly with the formal theory.
