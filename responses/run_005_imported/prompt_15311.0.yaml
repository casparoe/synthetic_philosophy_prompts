answer: |-
  Your friend’s Quinean perspective is philosophically provocative but profoundly incomplete as practical guidance for literary translation. Here’s why—and how to navigate your choices without abandoning faithfulness:

  ### 1. **Quine’s Point (and Its Limits)**
     - **The Core Insight**: Quine argues that *radical translation* (deciphering a completely unknown language with no shared references) relies *solely* on observable behavior. In such a vacuum, "gavagai" *could* mean multiple things because behavior can’t distinguish between "rabbit," "temporal rabbit stage," etc.
     - **The Literary Reality**: You’re **not** in a behavioral vacuum. You have:
       - **Full linguistic context**: Surrounding sentences, the novel’s themes, the author’s style.
       - **Cultural knowledge**: Portuguese social/historical nuances, genre conventions.
       - **Authorial intent**: Implied through tone, structure, and intertextuality.
       - **Shared human experience**: While "saudade" is culturally specific, its *emotional contours* (bittersweet longing, melancholic nostalgia) are universally recognizable.

     Quine’s indeterminacy applies to *isolated words without context*—not to richly embedded literary language.

  ### 2. **Why "Faithfulness" Isn’t an Illusion**
     Faithfulness isn’t about finding a 1:1 lexical match (often impossible), but about **reconstructing the source’s effects**:
     - **Semantic fidelity**: Capturing denotative meaning *where possible*.
     - **Emotional resonance**: Evoking the same feeling in the target reader.
     - **Aesthetic coherence**: Preserving rhythm, tone, and stylistic texture.
     - **Cultural fidelity**: Signaling the concept’s foreignness *when appropriate* (e.g., retaining "saudade" with context).

     Experienced translators recognize "better" renderings because they evaluate how holistically the translation reproduces these layers.

  ### 3. **Practical Strategies for "Untranslatables" Like Saudade**
     | **Approach** | **Example for "Saudade"** | **When to Use** |
     |--------------|---------------------------|----------------|
     | **Nuanced Equivalents** | "Longing," "yearning," "nostalgia" | When context narrows the meaning (e.g., "saudade de infância" → "nostalgia for childhood") |
     | **Creative Paraphrase** | "The ache of absence only love leaves behind" | When the word embodies a complex emotional state central to a scene |
     | **Borrowed Term + Context** | "She felt *saudade*—that Portuguese blend of sorrow and sweet remembrance" | When the concept is thematically crucial and culturally emblematic |
     | **Compensation** | Convey the melancholy of "saudade" through imagery elsewhere in the passage | When a direct rendering feels clumsy but the emotional tone must permeate |

  ### 4. **How to Choose Between Competing Renderings**
     Since "faithfulness" is multidimensional, evaluate options by asking:
     - **Which version best serves the *scene’s emotional core*?**  
       (e.g., Does "anguished longing" capture the character’s state better than "wistfulness" in a pivotal moment?)
     - **Which aligns with the author’s *stylistic register*?**  
       (A gritty novel might demand "ache" over "melancholy.")
     - **Which feels *inevitable in the flow* of the English prose?**  
       (Read sentences aloud. Does one option disrupt the rhythm?)
     - **Which preserves *cultural significance* without exoticizing?**  
       (Retaining "saudade" might honor its uniqueness, but overuse could feel like academic flag-planting.)

  ### 5. **Why Your Anxiety is a Strength**
     Your discomfort reflects a deep engagement with the text. Quine’s thought experiment reminds us that translation is interpretive—but literature thrives on interpretation. As Borges wrote: *"The original is unfaithful to the translation."* Your task isn’t to find a singular "truth," but to build a bridge that *compels the English reader to feel the weight and wonder of the Portuguese world*. 

  ### In Practice: Moving Forward
     - **Embrace "constrained creation"**: Your choices are bounded by the source text’s intent, not set adrift by indeterminacy.  
     - **Seek "satisficing" solutions** (good enough *for this context*) rather than perfect ones.  
     - **Trust collaborative wisdom**: Run options by bilingual beta readers. Ask: *"What emotion does this word evoke here? Is that what the original conveys?"*  
     - **Remember**: Great translations are *rereadable* in the target language. If your rendering haunts or delights an English reader as the original would a Portuguese one, you’ve been faithful.

  Quine exposed a technical limit of behavioral linguistics, not a manifesto for translators. Your anguish over "saudade" isn’t a mistake—it’s the ethical core of your art. Choose the word that makes the silence after reading feel like the silence the author intended.
