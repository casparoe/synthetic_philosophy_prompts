  Addressing the consistency concern. The Athenian isn't equating the tests directly. Courage requires real danger because that's the essence of the virtue—facing death. Temperance, however, is about managing desires, so simulated indulgence (like drinking) suffices. The artificiality is acceptable here because the goal is observation, not the same level of threat. 

