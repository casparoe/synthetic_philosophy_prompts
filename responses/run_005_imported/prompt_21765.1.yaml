  **Justification for Deductions (for Office Hours):**

  *   **Chance Procedure (-3):** "Your explanation of Taurek's chance procedure is incorrect for the crucial case of unequal groups. You state he proposes flipping a coin *between the groups* as the fairest response, implying this is his solution generally. However, Taurek explicitly argues we are *never* required to save the larger group. For unequal groups (like 5 vs 1), he argues we should give each *individual* an equal chance (e.g., a 1/6 chance for each person), *not* flip a coin between the groups (which would give the single person a 50% chance and each of the five only a 10% chance). This misrepresents a central part of his argument."
