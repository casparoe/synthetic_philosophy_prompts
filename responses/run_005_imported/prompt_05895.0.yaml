  First, I need to recall Carnap's key concepts. The internal/external distinction from "Empiricism, Semantics, and Ontology" separates questions within a linguistic framework (internal, empirical) from those about adopting the framework itself (external, pragmatic). The Principle of Tolerance allows any consistent framework as long as it's syntactically sound. Also, Carnap's emotivism treats value statements as expressions of emotion, not truth-apt.

