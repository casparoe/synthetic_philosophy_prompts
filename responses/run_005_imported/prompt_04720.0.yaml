  For Nahmanides' objection to Maimonides: He'd likely attack the implication that sacrifices are spiritually unnecessary. If they're just concessions, why does the Torah give such detailed regulations? He'd argue this diminishes Torah's perfection. His symbolic interpretation (sacrifice representing what the sinner deserves) directly challenges Maimonides' functional view.

