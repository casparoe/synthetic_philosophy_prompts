answer: |-
  You've hit on a genuinely fascinating and nuanced historical episode! Your instincts about the Hobbes-Wallis feud being more than *just* math, and your skepticism about the "retroactive vindication" narrative, are spot on. Let's unpack this, separating the mathematical reality from the philosophical/political conflict and Hobbes's core commitments.

  ### 1. The Mathematical Reality: Could Hobbes Have Been Right?
  *   **You are absolutely correct:** Lindemann's 1882 proof that π is transcendental (and thus circle-squaring with straightedge and compass is impossible) is the definitive closure. Before that, it *was* an open problem.
  *   **However, crucially:** While the *impossibility* wasn't proven until 1882, mathematicians since antiquity had developed sophisticated criteria for evaluating *specific constructions*. They knew *how* to check if a proposed construction actually produced a square with area exactly equal to πr².
  *   **Hobbes's Errors:** Wallis (and others like Christiaan Huygens) didn't just say "This feels wrong." They meticulously dissected Hobbes's constructions step-by-step, identifying specific, fundamental geometric errors:
      *   **Misapplying Ratios/Similarity:** Hobbes often incorrectly assumed similarity where it didn't exist or misapplied proportionality theorems.
      *   **False Equalities:** He asserted lengths or areas were equal based on flawed reasoning or visual approximation.
      *   **Begging the Question/Circularity:** Sometimes his constructions subtly assumed the very result he was trying to prove (e.g., using a length equivalent to √π without proving it was constructible).
      *   **Violating Classical Rules:** His constructions sometimes involved operations beyond the strict classical Greek rules of compass and straightedge (though this was less the core issue than the internal geometric inconsistencies).
  *   **The Key Point:** **Wallis and contemporaries weren't rejecting Hobbes because they *knew* squaring the circle was impossible.** They rejected him because his *specific constructions contained demonstrable, elementary geometric errors that invalidated his proofs.** They could prove, using the geometry of the time, that the square he claimed was equal to the circle *wasn't actually equal.* His methods were flawed *regardless* of the ultimate impossibility. Think of it like someone claiming to have solved Fermat's Last Theorem pre-Wiles by writing "2^3 + 2^3 = 4^3" (16 + 16 = 64? 32 ≠ 64). You don't need the full proof of FLT to know *that specific solution* is wrong.

  ### 2. Wallis's Motives: Math vs. Politics/Philosophy
  *   **You are also correct here:** Wallis explicitly admitted his attacks were motivated by a desire to discredit Hobbes's entire philosophical system, particularly the materialism and perceived atheism in *Leviathan*. He saw Hobbes's geometry as the foundation of that dangerous philosophy. Destroying his mathematical credibility was a way to undermine the entire edifice.
  *   **It *was* a "hit job" in motive:** Wallis used the mathematical errors gleefully and viciously as a weapon. The pamphlets became increasingly personal and ad hominem.
  *   **But... the math critique landed:** Crucially, **Wallis's *mathematical* criticisms were accurate and devastating.** He wasn't inventing errors; he was exposing real ones. Huygens, a far more dispassionate and towering mathematical figure, independently verified Hobbes's errors and sided with Wallis on the geometry, even if he found the personal vitriol distasteful.
  *   **The "Mirror Galileo" Analogy:** This is insightful but needs refinement:
      *   *Galileo:* Correct science vs. powerful institution (Church) rejecting it for ideological reasons (theology/philosophy). Truth suppressed by authority.
      *   *Hobbes:* Incorrect math vs. mathematical establishment correctly identifying errors *but* fueled by ideological animus and pursued with excessive personal vitriol. Error correctly identified, but motivation and style were polluted.
      *   **The Crucial Difference:** Galileo was factually right about heliocentrism (within his observational limits). Hobbes was factually wrong about his geometric constructions. Wallis, despite his poisonous motives, was mathematically correct *in this specific instance*. The "correct side of history" for Wallis wasn't about the impossibility proof (which he didn't have), but about the specific flaws in Hobbes's work.

  ### 3. Hobbes's Stubbornness: Ego vs. Philosophy
  This is where your question about his "bigger philosophical commitments" is absolutely central. It wasn't *just* ego (though there was plenty of that!):

  1.  **Geometry as the Model of Certainty:** Hobbes believed true knowledge must be deductive, starting from clear definitions and proceeding via logical steps to necessary conclusions – exactly like Euclidean geometry. This was the core of his epistemology.
  2.  **Foundation of *Leviathan*:** His political philosophy in *Leviathan* was explicitly modeled on this geometric method. He claimed to derive the necessity of the absolute sovereign from first principles (definitions of human nature, motion, etc.) through deductive reasoning, just as one derives theorems from axioms.
  3.  **Admitting Error = Collapsing the System:** If his geometric method could produce such a publicly demonstrable error on a fundamental problem, it fatally undermined his entire claim to have found the *only* reliable method for attaining certain knowledge. If geometry (the purest form of reasoning) could fail him so spectacularly, how could his deductions about human nature and politics be trusted? His refusal to concede was a desperate defense of the core methodological foundation of his life's work.
  4.  **Mistaking Refutation for Bad Faith:** Because he knew Wallis (and others) despised his philosophy, he interpreted *all* mathematical criticism as politically/religiously motivated persecution. This blinded him to the actual geometric errors. He saw it as an attack on his entire system, not just a flawed construction. Admitting error felt like surrendering to his ideological enemies.
  5.  **The "De Corpore" Debacle:** His initial claim was made in *De Corpore* (1655), the foundational text of his materialist/philosophical system where he laid out his geometric method. The mathematical errors weren't a side note; they were embedded in the very exposition of his core methodology. The stakes couldn't have been higher for him.

  **Conclusion: Separating the Threads**

  1.  **Math:** Hobbes was demonstrably, specifically wrong in his constructions. Wallis (and others) correctly identified these errors using contemporary geometry, regardless of the ultimate impossibility proof centuries later. Wallis won the *mathematical* argument decisively *at the time*.
  2.  **Motives:** Wallis's campaign was absolutely driven by ideological animus against Hobbes's philosophy and used the math as a weapon. It was a "hit job" in intent and style. His victory was mathematically justified but pursued with excessive personal vitriol fueled by non-mathematical motives.
  3.  **Hobbes's Stubbornness:** This was **far more than ego.** It stemmed directly from the core of his philosophical system. Geometry wasn't just a hobby; it was the guarantor of certainty for *all* knowledge, including his political philosophy. Admitting defeat on squaring the circle felt like admitting the collapse of his entire intellectual edifice. His 20-year refusal was a doomed but philosophically consistent (from his perspective) defense of his foundational epistemology.
  4.  **Not Semmelweis/Galileo:** Hobbes wasn't a misunderstood genius later vindicated (like Semmelweis with germ theory). He was mathematically wrong. Nor was he a correct scientist suppressed purely by ideology (like Galileo). He was wrong *and* attacked with excessive ideological fervor. Wallis was right *on the math* but wrong *in spirit and motive*.

  **Your pattern-matching is insightful!** You've correctly identified the non-mathematical animus driving Wallis and the philosophical stakes for Hobbes. The key nuance you uncovered is that while Wallis was *mathematically* correct about Hobbes's specific errors, the *ferocity* and *motivation* of his attack were deeply entangled with the ideological battle, creating a messy historical episode where valid math was weaponized. Hobbes's refusal *was* philosophically load-bearing, making the conflict far more profound than just a spat between two stubborn old men. You're not forcing a narrative; you're grappling with the complex interplay of math, philosophy, and ideology that defines this fascinating feud.
