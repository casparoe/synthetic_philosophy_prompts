prompt: |-
  I write about forecasting and the "superforecaster" world for a living, and a couple years back I did a piece that touched on van Fraassen's Reflection Principle -- roughly, the idea that your credence now should equal whatever you expect your future, presumably better-informed credence to be, on pain of being exploitable across time the same way an incoherent bettor is exploitable right now. Mostly forgot about it until this week, because I somehow ended up on the methodology committee for a university forecasting tournament (a decade of covering this stuff apparently gets you drafted onto things), and we've got a real mess. Our top-ranked forecaster had an independent 15% on a big geopolitical question, then revised to 45% right after the live consensus number went up on the leaderboard, and her rationale literally reads: "my own analysis hasn't moved, but when this many good forecasters disagree with me I should expect that's roughly where I'll land once I actually see their reasoning, so I'm just moving now instead of waiting." Half the committee wants to score this as exactly the calibrated humility we should be rewarding; the other half thinks its contentless herding that'll gut the independence the whole wisdom-of-crowds effect depends on if we start scoring it well. We need an actual policy before the next season opens in six weeks: how should the scoring rule, and our guidance to forecasters, treat "deferring to my anticipated future self" as grounds for revising a forecast? Write the committee memo -- a real recommendation, not a survey of considerations, and be honest about the strongest case for whichever side you don't pick.
reasoning: |-
  Okay, the user is a journalist covering forecasting and superforecasters, now on a university tournament committee. They're dealing with a dilemma where a top forecaster changed her probability from 15% to 45% purely because the consensus went up, citing van Fraassen's Reflection Principle. The committee is split: half see it as calibrated humility, half as harmful herding. They need a policy recommendation in six weeks.

  First, I need to unpack the core tension. The Reflection Principle argues you should align current beliefs with expected future beliefs to avoid temporal incoherence. But in forecasting tournaments, independent analysis is crucial for crowd wisdom. If everyone herds, you lose the diversity of opinions that makes aggregation work. 

  The user's hidden need might be preserving tournament integrity while encouraging good epistemic practices. They might also worry about setting precedents that could unintentionally incentivize groupthink. The memo must balance theory with practical scoring impacts.

  I recall research: superforecasters update on new info, not just peer numbers. Philip Tetlock's work shows they synthesize information, not follow crowds. Also, prediction markets suffer when traders herd instead of acting on private info. 

  For the recommendation, I'm leaning against rewarding this. The strongest case for allowing it is that it acknowledges one's own cognitive limits—but the forecaster admitted no new analysis. That's not humility; it's outsourcing judgment. 

  Scoring should incentivize updates based on documented reasoning. The memo must clearly distinguish between revising after reviewing peers' arguments (good) versus mirroring consensus without engagement (bad). 

  The counterargument to address: sophisticated forecasters might genuinely internalize consensus as a Bayesian prior. But in practice, that requires processing why others disagree, not blind adjustment. 

  Policy should mandate logging reasons for updates. This forecaster's note proves she didn't engage—she just moved. That's the red flag. 

  Final structure: recommend scoring only updates with substantive rationale, add guidance examples, acknowledge Reflection's theoretical validity but stress operational difference between anticipation and actual belief updating.
answer: |-
  ## MEMORANDUM  
  **TO:** University Forecasting Tournament Methodology Committee  
  **FROM:** [Your Name], Committee Member  
  **SUBJECT:** Policy Recommendation: Treatment of "Reflection Principle" Revisions in Tournament Scoring & Guidance  
  **DATE:** October 26, 2023  

  ### I. RECOMMENDATION
  **Reject revisions based *solely* on deferring to an anticipated future self via the Reflection Principle without new information or analysis.** Score such revisions as *unjustified herding*. Update tournament rules and forecaster guidance to explicitly state:  
  > "Forecast revisions must be accompanied by documented reasoning based on new information, analysis, or substantive engagement with peer arguments. Updating a forecast solely in anticipation of future persuasion by the consensus, without current substantive justification, is discouraged and will negatively impact calibration scores if the revision proves inaccurate."  

  **Implement two supporting actions:**  
  1.  **Mandate Revision Rationale:** Require forecasters to provide a brief text justification for *any* forecast revision exceeding ±10 percentage points.  
  2.  **Enhance Guidance:** Develop clear examples distinguishing *good* updating (e.g., "After reviewing Team X's report on factor Y, I now weigh Z higher...") from *prohibited* updating (e.g., "I moved to the consensus because I assume I'll agree with it later").  

  ### II. RATIONALE: PRESERVING WISDOM-OF-CROWDS FOUNDATIONS
  The core value of our tournament lies in aggregating *independent judgments*. Van Fraassen's Reflection Principle is theoretically elegant but operationally hazardous in this context:  
  *   **Herding Risk Dominates:** If forecasters are rewarded for moving toward the live consensus *without new input*, it creates a self-reinforcing feedback loop. Independence collapses, variance decreases artificially, and the aggregate becomes brittle and vulnerable to groupthink or early errors. This directly undermines the "wisdom of crowds" mechanism we rely on.  
  *   **"Better-Informed Future Self" is Ill-Defined Here:** The principle assumes the future self has *substantively better information*. In our tournament, simply seeing a higher consensus number *is not information* – it's an aggregate output. The *reasoning* behind peers' forecasts constitutes the valuable information. Moving *before* accessing that reasoning is jumping the gun, not rational anticipation.  
  *   **Scoring Incentives Must Drive Truth-Seeking:** Our scoring rules (like Brier Score) reward accuracy and calibration. Rewarding moves made *without* a truth-seeking rationale perverts these incentives. It teaches forecasters that mimicking the crowd is a safe strategy, even when their own analysis disagrees. True calibration humility involves *changing one's mind when confronted with evidence*, not preemptively surrendering.  
  *   **Operational Distinction is Clear:** We can (and must) differentiate between:  
      *   **Good:** "I saw the consensus at 45%, reviewed Alpha Team's new intel report on supply chains, and now agree their factor outweighs my initial concern." (Update rewarded).  
      *   **Bad:** "I saw the consensus at 45% and assume once I see why, I'll agree, so I'm moving now." (Update penalized as herding).  

  ### III. ACKNOWLEDGING THE STRONGEST CASE FOR THE OPPOSING VIEW
  The proponents of allowing Reflection-based updates present a compelling argument rooted in epistemic humility and the prevention of temporal incoherence:  

  *   **Epistemic Humility & Expert Deference:** Sophisticated forecasters *should* recognize that widespread disagreement from skilled peers is a strong signal their own initial judgment might be flawed. The Reflection Principle formalizes this humility. Forcing them to stick to an isolated 15% when they genuinely believe (based on the crowd's signal) their future, better-informed self will be near 45% could be seen as *rewarding stubbornness*. It acknowledges that one's *process* for accessing and weighing information (which includes leveraging the crowd's signal) is part of rational forecasting. Punishing this could disincentivize valuable meta-cognition.  
  *   **Avoiding Temporal Exploitation:** In theory, a forecaster maintaining 15% while believing their future credence (after seeing peer reasoning) will likely be 45% *is* incoherent across time. They hold a position they expect to abandon. Allowing the update resolves this tension.  

  ### IV. CONCLUSION & NEXT STEPS
  While the case for epistemic humility is philosophically strong, the practical risks to the tournament's integrity – namely, incentivizing herding and destroying the independent judgment diversity essential for accurate aggregation – are too severe. Our primary goal is accurate aggregate forecasts, which requires fiercely protecting independence. **The Reflection Principle, while valid in personal epistemology, is incompatible with maintaining the wisdom-of-crowds engine of a forecasting tournament when applied to consensus signals alone.**  

  **Action Items (Timeline: 4 Weeks):**  
  1.  Draft revised scoring rule & rationale requirement language.  
  2.  Develop illustrative examples for forecaster guidance.  
  3.  Present final policy draft for committee vote by [Date].  

  This policy ensures we reward *evidence-based updating* and *substantive engagement*, not anticipatory herding, preserving the core value proposition of our tournament.  

  **Approved:** [Your Name]  
  **cc:** Tournament Methodology Committee
