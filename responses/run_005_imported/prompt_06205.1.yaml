  For White defendants: lower base recidivism means most are truly low risk. So when the algorithm labels someone high-risk, it's more likely to be wrong (false positive). Like the hospital misdiagnosing healthy people when most patients are healthy.

  For Black defendants: higher base recidivism means more truly high-risk individuals. So when the algorithm labels someone high-risk, it's more often correct. But the flip side is that labeling someone low-risk is riskier - more false negatives. 

