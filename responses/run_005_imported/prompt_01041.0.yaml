  First, I need to recall Moore's key ideas. His organic unities concept is crucial here. Moore argues that the value of a whole isn't just the sum of its parts. So, in personal affection, the relationship itself might add value beyond the individuals' qualities. But the user points out that Moore's account of love as admiring contemplation focuses on the qualities of the beloved, which leads to the trade-up problem. 

  The user wants to know which of Moore's commitments cause this issue and if an organic unities approach can solve it without ditching the admiration model. Let me break down Moore's commitments. The main culprits are his axiological atomism (values attach to states of affairs), the universality of reasons (if something is good, we have reason to promote it), and love as admiration of properties. These together suggest that better properties equal more reasons to admire, hence the trade-up.

  Next, can organic unities help? For example, the shared history in a friendship might create a unique whole that's more valuable than just the sum of qualities. So, even if someone new has better qualities, the existing relationship's history adds irreplaceable value. However, Moore's own examples, like the beautiful joke in a bad world, show he recognizes contextual value. But he might not apply this to personal relationships explicitly. 

