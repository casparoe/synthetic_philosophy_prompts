answer: |-
  That's an incredibly sharp critique — you've put your finger on the core tension in Moore's account of personal affection. You're right: Moore's structural parallel between aesthetic appreciation and personal affection (both being "admiring contemplation" of intrinsically good qualities) generates the "trade-up" problem. Let's break down why Moore is committed to this and whether his organic unities framework offers an escape:

  **The Commitments Generating the "Trade-Up" Problem:**

  1.  **Value Atomism (with Organic Wholes):** Moore holds that intrinsic value attaches to specific, complex *states of affairs* ("organic unities"). The value of the whole isn't necessarily the sum of the values of its parts.
  2.  **Universality of Intrinsic Value & Reasons:** If a state of affairs `S` is intrinsically good, then *anyone* has a reason to bring about `S` or contemplate `S` *whenever possible*. Goodness creates universal, agent-neutral reasons.
  3.  **Love as Admiring Contemplation:** Personal affection *just is* the admiring contemplation of the good qualities (mental and physical) possessed by another person. This is the *sole* source of its intrinsic value within the organic unity "consciousness of a beautiful object".
  4.  **Qualities as the Objects of Value:** The value of the affection-whole depends crucially on *which qualities* are being contemplated. The goodness resides in the *consciousness-of-[those-specific-good-qualities]*.
  5.  **Maximization Implicit in the Good:** Moore is a consequentialist at heart. If contemplating `Person A's qualities Q` is good, and contemplating `Person B's qualities Q+` (where Q+ is a greater degree or better instance of the same relevant qualities) is *better*, then there is a *stronger reason* to engage in the contemplation of `Person B`. Failing to do so when possible seems to involve preferring a lesser good.

  **The Result:** If `Friend` has qualities `[x, y, z]` generating good `G` when contemplated, and `New Person` has `[x+, y+, z+]` generating a *greater* good `G+` when contemplated, Moore's commitments imply:
  *   The state of affairs `My consciousness of New Person's [x+, y+, z+]` is intrinsically *better* than `My consciousness of Friend's [x, y, z]`.
  *   Therefore, I have a *stronger reason* to bring about the contemplation of `New Person`.
  *   This stronger reason seems to obligate me to "trade up" to maximize the good realized through my acts of admiring contemplation (i.e., love).

  This clashes fundamentally with the particularity of love – loving *this specific person* because of *who they are*, including our shared history, not just their abstractable qualities.

  **Can Organic Unities Block the Result Without Abandoning Admiring Contemplation?**

  Possibly, but it requires stretching Moore's own application and faces significant challenges. Here's how it *might* work:

  1.  **The Relationship Itself as an Organic Unity:**
      *   **Argument:** The valuable organic unity isn't *just* "My consciousness of Friend's qualities Q", but the vastly more complex unity: **"The shared history, mutual understanding, reciprocal affection, and commitments between Friend and Me, *including* my current contemplation of their qualities."**
      *   **Blocking Trade-Up:** This complex whole `R` (the relationship) has an intrinsic value *far exceeding* the simple sum of the value of contemplating `Friend's Q` plus the value of contemplating `My Q`. Its value emerges from the *unique history* and *particular configuration* of interactions. Crucially, `New Person`, no matter how superior their `Q+`, *cannot* be a constituent part of *this specific organic unity* `R`. `R` is irreplaceably tied to `Friend`.
      *   **Problem:** Moore *doesn't* describe personal affection this way in Principia Ethica. His focus is squarely on the *consciousness* (the admiring contemplation) directed at the *qualities* of the *object*. The historical context and reciprocity aren't central to his analysis. He might argue the relationship is *instrumentally* valuable for *producing* future states of admiring contemplation, but that doesn't capture its intrinsic worth as a particular bond.

  2.  **The Beloved's Particular Identity as a Constituent:**
      *   **Argument:** The valuable state isn't "consciousness of qualities Q", but **"consciousness of *Friend-having-Q*"** or **"consciousness of *this-particular-individual*-as-possessing-Q"**. `Friend` themself, as a unique particular, is an *essential constituent* of the valuable organic unity, not just a vessel for replaceable qualities.
      *   **Blocking Trade-Up:** The value inheres in the contemplation *of Friend specifically*, even if contemplating `New Person with Q+` would produce a state that *looks* similar superficially. The particular object (`Friend`) is non-fungible.
      *   **Problem:** This directly contradicts Moore's apparent reduction of the object of love to its good qualities. He explicitly states that what we love *is* the qualities. To say the *particular individual* is essential seems to abandon the "admiring contemplation *of qualities*" account. It introduces a non-qualitative element (the bare particular) into the object of value, which Moore resists.

  3.  **The "Loving Stance" as an Irreducible Good:**
      *   **Argument:** The act of *sustained, loyal affection for a particular person over time, despite fluctuations in their qualities or the appearance of "better" options*, might itself be a unique and intrinsically valuable attitude or commitment. This "loyal loving stance" could be an organic unity whose value depends on its *constancy* and *particular focus*.
      *   **Blocking Trade-Up:** Trading up would destroy this valuable stance of loyalty, thereby destroying a significant intrinsic good. Maintaining the loyalty to `Friend` preserves a unique good that contemplating `New Person` cannot replicate.
      *   **Problem:** While plausible, this feels like a significant *addition* to Moore's account, not an implication of it. Moore's focus is on the *contemplative state* elicited by the object's qualities, not on an enduring *commitment* or *stance* independent of momentary quality-apprehension.

  **Conclusion:**

  *   **Moore's Commitments:** His core commitments (value in states of admiring contemplation of qualities, universality of value/reasons, maximization) *do* generate the "trade-up" problem as you've described it. His analysis struggles to capture the particularity and historical embeddedness essential to personal love.
  *   **Organic Unities as a *Possible* Escape:** The organic unities doctrine *could theoretically* block the trade-up implication **if** one significantly expands the description of the valuable state beyond what Moore explicitly provides. The most promising route is to define the valuable organic unity as **the entire, unique, historically situated reciprocal relationship itself**, where the particular individuals are essential constituents.
  *   **The Cost:** However, this expansion likely **requires abandoning or radically modifying the core "admiring contemplation *of qualities*" account of love**. To make the *particular person* or the *unique historical relationship* essential, rather than just the *qualities* they instantiate, moves away from Moore's quasi-aesthetic model. It injects elements of commitment, history, and irreplaceable particularity that his official account lacks.
  *   **Moore's Likely Response:** Based on Principia Ethica, Moore would probably bite the bullet. He might acknowledge the *instrumental* value of stable relationships for producing *future* valuable states of contemplation, or the *emotional pain* of breaking bonds, but he would likely insist that, *strictly speaking*, the *intrinsic value* lies in the contemplation of the good qualities present in consciousness *at any given moment*. If a "better" object for that contemplation appears, the intrinsic value of contemplating it is greater.

  Your critique exposes a fundamental limitation in Moore's attempt to model personal love on aesthetic appreciation. While the organic unities doctrine offers conceptual space for a solution, utilizing it effectively to save the particularity of love requires pushing Moore's own framework further than he did, arguably into territory he wouldn't recognize.
