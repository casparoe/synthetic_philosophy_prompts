  Here’s a draft that uses the handicap principle as its structural core while navigating the technical and emotional tightropes. It’s designed to be spoken in about 4-5 minutes, balancing clarity for non-scientists with enough depth for the biologists:

  ---

  **Wedding Toast Draft: The Costly Signal**

  [Raise glass slightly, smile at the couple] Okay, everyone. Settle in for… well, not *quite* a lecture. I promise. But as [Sister's Name]’s brother, and, as she loves to remind everyone, the resident philosopher, I couldn’t resist borrowing a little something from *her* world tonight. Because honestly? I think her field helps explain why this," [gesture around at the venue, the guests, the couple], "why this whole beautiful, slightly overwhelming production… is actually kind of perfect."

  [Sister's Name] studies how animals communicate – things like why a gazelle does that crazy, inefficient jump called stotting when a predator’s near, or why some birds develop feathers so bright and big they seem like a death trap. And one of the most powerful ideas she’s introduced me to is the Handicap Principle. Proposed by Amotz Zahavi. [*Nod knowingly towards the biologists; keep tone conversational*]

  The basic idea is startlingly simple: For a signal to be truly *believable*, it has to be *costly*. Hard to fake. If a gazelle stots, it’s essentially shouting, "Look how fast and fit I am! I can waste this energy jumping instead of just running!" Only a truly fit gazelle can afford that extravagance. A weak one wouldn’t dare. That ridiculous peacock’s tail? It screams, "Look how strong I must be to survive *dragging this thing around*!" The cost *is* the proof. The extravagance *is* the honesty. A cheap, easy signal – a little chirp, a quick flash of colour – anyone can fake that. But the big, difficult, costly display? That’s hard to counterfeit. That’s where trust is built.

  [Pause, shift focus squarely to the couple]

  And that’s what brings me to you two, standing here today. Look around. [Gesture broadly again] This isn’t cheap. It isn’t easy. The planning, the expense, the sheer logistical feat of getting all of us in one place... The vulnerability of standing here, in front of absolutely everyone you know and love, and saying things you can never, ever take back. Promises laid bare.

  To an outsider, maybe it looks inefficient. Why not just sign a paper? Why not just whisper promises quietly? Why the fanfare? Why the *cost*?

  But Zahavi’s insight whispers the answer: **Because love, real love, deep commitment – it *needs* a signal that’s hard to fake.** Anyone can say "I love you" in the dark. Anyone can make a quiet promise. But standing here, in the full glare of expectation, investing your time, your resources, your emotional energy into this massive, public declaration… *that* is your stot. *That* is your impossible, glorious tail.

  You are demonstrating, in the most costly way possible, the strength of your bond. You are saying, "Look! We are so sure, so committed, so resilient in our love, that we can shoulder this weight. We can make ourselves this vulnerable. We can bind ourselves together so publicly, so permanently, precisely *because* our trust in each other is strong enough to bear the cost." It’s not *just* for us, the audience, though we are deeply honoured witnesses. It’s the signal *you* are making to *each other* and to the world about the depth of your partnership. The extravagance isn't the side effect; **it's the testament.**

  Now, [*Look at the biologists*], I know Zahavi usually talked about this in terms of attracting mates or warning rivals. But isn’t the core truth about honest signalling just as profound *within* a partnership? Building a life together demands constant signals of trustworthiness, of commitment. The daily investments – time, patience, sacrifice, forgiveness – these are the *ongoing* costly signals that maintain the bond. Tonight is the spectacular, concentrated version of that principle. It’s the grand, initial investment that sets the stage for a lifetime of smaller, equally vital, honest gestures.

  And [*Look at Grandmother, cousins, non-scientist guests*], for everyone else here? Forget the gazelles and peacocks for a second. What we’re really seeing, what moves us, is **love made visible.** Love so certain it’s willing to shout its promises from the rooftops. Love so strong it’s willing to bear the weight of expectation, the cost of celebration, the beautiful burden of forever. That’s what this display signifies. That’s the honesty behind the extravagance.

  [Sister's Name] and [Partner's Name], you haven’t just chosen each other. You’ve chosen to declare it in the most costly, vulnerable, and therefore most profoundly *honest* way possible. Your courage in doing so takes our breath away. It proves something no quiet promise ever could. It’s the ultimate display of fitness… not for survival, but for a life shared, deeply and truly.

  **So let’s raise our glasses high. To [Sister's Name] and [Partner's Name]! May your lives together be filled with countless honest signals, deep trust, enduring joy, and the kind of love that proves itself, day after day, precisely because it *is* willing to bear the cost. To love that proves itself!**

  ---

  **Why this works:**

  1.  **Addresses the Technical Worry:** It explicitly acknowledges Zahavi's usual context ("attracting mates or warning rivals") but argues the *core principle* of honest signalling through cost applies equally powerfully to demonstrating commitment *within* a bond. Biologists will appreciate the accuracy of the principle's description and the thoughtful extension.
  2.  **Avoids Reductionism:** It explicitly separates the *analogy* (costly signals proving honesty) from the *reality* (love, commitment, vulnerability). Lines like "Love made visible," "Building a life together demands constant signals of trustworthiness," and "the kind of love that proves itself" anchor the toast firmly in human emotion and values. The "fitness" mention at the end is carefully framed as "fitness... for a life shared," not biological fitness.
  3.  **Explains for Non-Scientists:** Uses clear analogies (stotting, peacock's tail) and immediately translates the biological concept into the wedding context ("planning, expense, vulnerability," "promises laid bare"). The shift to "Love made visible" explicitly bridges the gap.
  4.  **Uses the Principle as Engine:** The entire structure builds on the handicap principle – explaining it, applying it directly to the wedding ("your stot... your impossible, glorious tail"), exploring *why* the cost matters ("proof," "testament," "honesty"), and extending it to married life ("ongoing costly signals").
  5.  **Emotional Core:** Focuses on vulnerability, courage, trust, commitment, and visible love. The costly signal isn't about showing off; it's about demonstrating profound trust and willingness to be bound.
  6.  **Strong, Relatable Closing:** "To love that proves itself!" is a clear, heartfelt, and philosophically resonant line that ties back to the core idea without jargon. Everyone can raise a glass to that.
  7.  **Tone:** Respectful, warm, slightly intellectual but accessible, celebratory, and focused on the couple's courage and commitment.

  **Delivery Tips:**

  *   **Pace Yourself:** 4-5 minutes is longer than many toasts. Practice reading it aloud to get the timing right. Pauses are powerful – especially after key points like "the cost *is* the proof" or "Love made visible."
  *   **Eye Contact:** Shift between the couple, the biologist section (when mentioning Zahavi/stotting), and the wider family (when translating to "love made visible").
  *   **Warmth & Conviction:** Your belief in the idea and your love for your sister need to shine through. Smile, especially when looking at them.
  *   **Don't Rush the Close:** Let the final line land. Raise your glass high, look around at everyone, and say it clearly: "To love that proves itself!"

  This toast uses the handicap principle not just as a reference, but as the very lens through which to view and celebrate the profound act of public commitment your sister and her partner are making. Good luck!
