  Hmm... the user's phrasing suggests they're philosophically literate ("split along lines straight out of my Kant seminar", "Korsgaard reference"). They need academic rigor but also institutional pragmatism. The memo must bridge two worlds: animal research regulations and moral philosophy.

  Key observations:
  1) The scientists' position isn't wrong per se—just incomplete. Kant does emphasize indirect duties. But later Kantians (Korsgaard, Wood) develop this into a "practical contradiction" test: if causing animal suffering undermines our own humanity, it becomes self-defeating. That's the wedge to expand the discussion.

  2) The protocol itself seems technically compliant ("within welfare regs"), so rejecting it outright would seem unreasonable. But "approve with conditions" could introduce concrete safeguards that address both the scientists' character concerns AND broader ethical considerations. 

  3) The user's hidden need might be to validate non-scientist perspectives. By grounding recommendations in Kantian logic, they demonstrate ethics isn't just "fluffy humanities" but rigorous enough to shape scientific practice.

  Biggest risks to avoid:
  - Sounding like they're lecturing scientists on Kant
  - Overcomplicating the memo with philosophy jargon
  - Ignoring the committee's operational reality (they need to vote Thursday!)

  So the memo structure should:
  A) Affirm the indirect-duty view as valid (disarms defensiveness)
  B) Show its internal limitations using Kant's own system (Korsgaard's extension)
  C) Translate this into three concrete ethical dimensions: researcher effects, animal welfare, and scientific necessity
  D) Tie all this to IACUC's existing mandate (3Rs framework)

  The "approve with conditions" recommendation works because:
