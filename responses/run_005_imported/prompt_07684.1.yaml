  First, let's unpack the core tension: the scientists are using Kant's indirect-duty argument (animal suffering matters only insofar as it affects human character) to justify approving the protocol. The user finds this reductive but recognizes it's a valid interpretation. Their real challenge is to craft a response that:
  - Engages the Kantian framework seriously
  - Expands the ethical scope without alienating scientist colleagues
