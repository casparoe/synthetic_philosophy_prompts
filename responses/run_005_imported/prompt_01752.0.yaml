answer: |-
  I'll mount a fierce defense of Frege's *Begriffsschrift* metalinguistic view against his own later "arbitrariness" objection. While sense/reference is elegant, it overcomplicates the solution to the informativeness puzzle. The metalinguistic account, properly understood, not only survives the charge but offers a more parsimonious and empirically grounded explanation, foreshadowing insights modern direct-reference theorists are forced to adopt. Here's the case:

  1.  **Reframing "Arbitrary" as "Empirically Discoverable":** Frege is right that the *initial act* of stipulating a name is arbitrary. But the *historical fact* that a specific linguistic community *did* stipulate two distinct signs ("Hesperus," "Phosphorus") to latch onto the *same* object is **not arbitrary at all**. It's a **contingent, empirical fact about the history of language use**. Crucially, ordinary speakers have no a priori access to this history. Discovering that "a=b" is true means discovering that two distinct naming acts, potentially separated by time, culture, or context, converged on the same referent. *This is genuine discovery about the world – specifically, the socio-linguistic world.*
      *   **Example:** The ancient Greeks observing "Hesperus" (evening star) didn't know the Babylonians had already named the same object "Phosphorus" (morning star). Nor did they understand the astronomical reality explaining why one object appeared in two places. Discovering "Hesperus = Phosphorus" was discovering a historical convergence of naming practices *and* the celestial mechanics that made the dual appearance possible. The linguistic fact *reflects* an astronomical fact.

  2.  **The Epistemic Asymmetry Explained (a=a vs. a=b):**
      *   **"a=a" is trivial:** To understand the name "a" is to know which object it is stipulated to pick out *in the context of its introduction*. Using "a" twice presupposes you are operating within that single stipulative context. Asserting "a=a" merely reaffirms the tautology that the object stipulated to be called "a" is identical to itself. No new information about naming acts or the world is conveyed.
      *   **"a=b" is informative:** It asserts that *two distinct linguistic tokens/conventions*, introduced potentially independently ("Hesperus" vs. "Phosphorus"), pick out the same object. Understanding each name individually gives you no clue that *this specific other name* also picks out that same object. Discovering it requires empirical investigation (astronomical observation, historical research, etc.) to confirm the convergence of the distinct naming paths onto a single referent. This is knowledge *about the referent only insofar as it is knowledge about the successful application of different linguistic labels to it.*

  3.  **Countering the "No Real Knowledge" Objection:** Frege dismisses the metalinguistic view because it supposedly reports "only on our own conventions." This mischaracterizes the discovery.
      *   **It's Not *Just* Convention:** It's discovering that *different conventions* (not "our" single convention) accidentally *co-refer*. We don't stipulate identity; we *discover* that prior, independent stipulations happened to land on the same target.
      *   **Knowledge of Language *is* Real Knowledge:** Knowing facts about how our language hooks onto the world *is* substantive empirical knowledge. It's knowledge about human practices, history, and how linguistic communities carve up reality. Dismissing this as "not about the world" imposes an artificial boundary between linguistic facts and "real" facts. The fact that "Hesperus" and "Phosphorus" co-refer is as much a fact about the universe (involving human history *and* astronomy) as the fact that water is H₂O.

  4.  **The Millian Connection: Frege's Premature Abandonment Proves the Point:** Modern Millian/direct-reference theorists (Kripke, Salmon, Soames) vehemently reject Fregean senses. For them, a name contributes *only* its referent to the proposition expressed. So, "a=a" and "a=b" (if true) express the *exact same singular proposition*: <Venus, Identity, Venus>. This immediately recreates Frege's puzzle: how can "a=b" be informative if it expresses the same proposition as the trivial "a=a"?
      *   **The Millian Retreat to Metalinguistics/Pragmatics:** Faced with this, Millians *must* appeal to something *outside* the proposition expressed. Common moves include:
          *   **Metalinguistic Routes to Belief:** Learning "Hesperus is Phosphorus" causes the subject to form a *new belief* involving a single object under a "metalinguistic mode of presentation" (e.g., "the thing *called 'Hesperus'* is the thing *called 'Phosphorus'*"), even if the proposition expressed is just <Venus, Identity, Venus>.
          *   **Pragmatic Enrichment:** While the semantic content is trivial, the utterance pragmatically conveys the important information that two *names* or *guises* thought to be distinct actually pick out the same thing.
          *   **Cognitive Significance:** The difference lies not in the proposition believed, but in *how* the subject cognizes or accesses that proposition, often involving prior distinct concepts associated with the names (which look suspiciously like Fregean senses, but labeled differently).
      *   **The Irony:** Millians, trying to avoid senses, are forced back towards Frege's *Begriffsschrift* insight! They concede that the *informative impact* of "a=b" fundamentally involves recognizing the co-reference of distinct linguistic or conceptual tags. This strongly suggests Frege dismissed his initial, more austere solution too quickly. The metalinguistic element is inescapable in explaining informativeness, even for those who deny senses. The *Begriffsschrift* view anticipates this core Millian struggle and offers a solution *without* needing to posit abstract senses – it locates the difference firmly in the empirically discoverable history of the *signs themselves*.

  5.  **Parsimony and Grounding:** The sense/reference solution posits a whole new layer of abstract entities (senses) mediating between language and world. The metalinguistic account explains the cognitive difference using resources we already acknowledge: distinct linguistic tokens/conventions and our empirical ignorance of their historical application. It grounds the puzzle in observable linguistic behavior and history, rather than in a realm of abstract, objective meanings. If senses are just descriptive conditions, the question arises: *which* descriptions constitute the sense? The metalinguistic view avoids this quagmire entirely.

  **Conclusion:** Frege's "arbitrariness" objection fails because it conflates the *initial act* of naming with the *empirical fact* of contingent co-reference established by distinct historical naming acts. Discovering that "a=b" is true *is* discovering a substantive fact about the world – specifically, the socio-linguistic history of how distinct communities or contexts labeled reality. This discovery explains the stark epistemic difference from "a=a" perfectly: the latter involves no new discovery about naming conventions. The subsequent struggles of Millian direct-reference theorists, who are forced into metalinguistic or pragmatic accounts of informativeness despite rejecting senses, powerfully demonstrate that Frege abandoned a fundamentally sound insight in the *Begriffsschrift*. His first instinct – that identity statements are about the convergence of signs – provides a robust, parsimonious, and empirically grounded solution to the puzzle, arguably superior to the complexities introduced by sense and reference. The "triviality" of "a=a" and the potential discovery in "a=b" are best explained by the history of the signs, not by an abstract layer of sense.
