  First, I need to recall Frege's original objection: if the sign-object link is arbitrary, then "a=b" would only state a convention, not real knowledge. The user suggests that even if it's arbitrary, speakers don't know all conventions, so discovering that two names refer to the same object could still be informative. That's a solid point to build on.

  The user also mentions modern Millian theorists who, despite rejecting senses, need a metalinguistic or pragmatic account to explain informativeness. This is key. I should connect the early Frege view to modern direct-reference theories like Kripke's. Millians say names only contribute referents, so "a=a" and "a=b" express the same proposition. But then why is "a=b" informative? They often turn to metalinguistic explanations, which echoes Frege's initial idea. Highlighting this could show Frege abandoned his first theory too quickly.

  Next, I need to address the "arbitrary" objection. The user points out that while the link is arbitrary, knowledge of which links exist isn't trivial. People don't know all naming conventions. For example, Hesperus and Phosphorus were named independently; discovering they're both Venus involves learning about historical naming acts. This isn't about the object's properties but linguistic history. So, the discovery is about language, not the world, but still substantive.

  I should also challenge Frege's assumption that linguistic knowledge isn't "real" knowledge. In modern philosophy, metalinguistic facts are legitimate knowledge. Social and historical facts about how communities use names are empirical and discoverable. Frege's dismissal might stem from prioritizing logical content over epistemic processes.

  Comparing this to the sense-reference model: sense adds a layer of descriptive content, but does it really solve the problem? If senses are objective, how do we access them? The user might imply that senses are just as elusive as naming conventions. The metalinguistic view avoids positing abstract senses, offering a more parsimonious solution.

  Also, considering the user's deeper needs: they might be looking for validation that questioning established views (like Frege's sense-reference) is worthwhile. They want a robust defense of an alternative, showing that the earlier view has merit. Emphasizing that Frege's later theory isn't the only solution could encourage critical thinking beyond the textbook narrative.

  I should structure the argument by first refuting the "arbitrary" claim, then showing how metalinguistic knowledge is genuine, comparing it to Millian views, and finally arguing that this account explains the informativeness without senses. Using examples like Hesperus/Phosphorus and modern equivalents (Superman/Clark Kent) would make it concrete.

