  They tried explaining this to friends who didn't get it, so now they're turning to me. What they really want is a story concept that embodies that nagging doubt—not a math lesson, but an emotional experience. The key is making the reader *feel* the weight of that unbridgeable gap between "99.9% sure" and "certain."

