  Next, the correlation in EPR-Bohm experiments. How do branches correlate without nonlocality? The user is skeptical of "unitary evolution" as a sufficient answer. The follow-up should push on whether the Born rule probabilities emerging naturally is necessary or if it's hand-wavy.

  Then, there's the relativity issue. Branching needing a preferred frame? The guest might dodge by talking about decoherence frames, so the follow-up needs to question if that undermines relativity's core principles.

  Superdeterminism vs MWI. The user wants to know why choose MWI over superdeterminism if locality is a priority. The follow-up should challenge if MWI's locality is substantive or semantic.

  Finally, falsifiability. What could disprove MWI's locality? The guest might say nothing can, so the follow-up needs to highlight if that makes the claim unscientific.

  The user's deeper needs: They want the interview to expose potential weaknesses in MWI's locality claim, not let the guest restate standard arguments. They need pointed questions with pre-emptive follow-ups to prevent dodges. They’re likely familiar with rationalist discussions but feel standard answers are insufficient. They seek rigorous scrutiny, possibly to test if MWI's locality is a meaningful claim or just wordplay.

  I'll structure each question to target these points, ensuring follow-ups address common rebuttals. For example, on outcome independence, anticipate the "no single outcome" response and push back on whether that dissolves or relabels the issue. For correlations, challenge the adequacy of unitary evolution. Each question must force the guest beyond rehearsed answers into deeper justification.
answer: |-
  Here are 10 interview questions designed to rigorously challenge the "MWI is local" claim, targeting the cruxes you identified, with built-in anti-dodge follow-ups:

  1.  **The Locality Claim & Jarrett's Split:** "You state MWI is local. Bell's theorem shows that any theory reproducing QM correlations must violate either locality or the assumption that measurements have single outcomes. Jarrett decomposed 'locality' into 'Parameter Independence' (PI: settings on one side don't *immediately* influence *probabilities* of outcomes on the other) and 'Outcome Independence' (OI: the specific outcome on one side doesn't *immediately* influence the outcome on the other). **Which of these, PI or OI, does MWI actually satisfy, and crucially, *how* does satisfying that specific condition (while violating the other) constitute preserving genuine locality, rather than just *redefining* what 'locality' means by denying the existence of single outcomes?"**
      *   *Follow-up (If she focuses on denying OI):* "But isn't denying OI *by definition* achieved in MWI by saying there *is* no single outcome to depend on? Doesn't this make the 'locality' claim tautological: 'MWI is local because it doesn't have single outcomes, and locality is defined as not requiring instantaneous influences between single outcomes'? How is this different from saying 'The problem disappears if we redefine the problem away'?"

  2.  **The Correlation Mechanism:** "In an EPR-Bohm experiment, the entangled singlet state guarantees that if Alice measures spin-up, Bob *must* measure spin-down on the same axis. In MWI, both outcomes exist. **Precisely how do the 'branches' on Alice's side and Bob's side become correlated such that *within* a given branch (defined by a sequence of decoherence events), Alice's 'up' outcome *always* pairs with Bob's 'down' outcome on the same axis, and *never* pairs with Bob's 'up' outcome? What physical mechanism, operating *locally* at each wing *and* along the path between them, ensures this perfect matching without any non-local 'handshake' or coordination *after* the measurements occur?"**
      *   *Follow-up (If she says "unitary evolution"):* "Unitary evolution of the initial state *implies* the correlation, but doesn't *explain the mechanism* of how the branching events at spatially separated locations coordinate to respect it *branch-by-branch*. Decoherence is local, but the *global* state has the correlation. How does the *local* process of decoherence at Alice and Bob *know* which branch to put their outcome into so that the pairing is correct *every single time*, without any non-local influence? Isn't the correlation simply *presupposed* in the global wavefunction?"

  3.  **Branching and Relativity:** "Decoherence and branching require interactions with an environment, which are local events constrained by the speed of light. Yet, the correlated outcomes in spacelike separated measurements seem to define a branching structure across space. **Does MWI require a preferred frame of reference or a notion of *global* simultaneity to define a consistent 'branching history' across the entire universe? If not, how does it resolve potential conflicts between branching structures defined relative to different inertial frames? If branching is fundamentally frame-dependent, how can we talk about *the* branch where Alice saw up and Bob saw down?"**
      *   *Follow-up (If she invokes "local branching" & consistent histories):* "But doesn't the requirement for *consistency* of the global history across different local branching frames *impose* a constraint that effectively functions like a hidden preferred foliation? How is this fundamentally different from a Lorentz-violating structure underlying the apparent relativistic invariance?"

  4.  **Outcome Dependence vs. Parameter Dependence:** "You've argued MWI violates Outcome Independence (OI) but satisfies Parameter Independence (PI). PI forbids faster-than-light *signaling* – changing settings on one side instantly changing the *probabilities* of outcomes on the other. MWI obviously satisfies PI/no-signaling. **But Bell's theorem shows that violating OI alone *is sufficient* to require nonlocality in any theory with definite outcomes. MWI denies definite outcomes. Does satisfying PI/no-signaling genuinely exhaust the meaning of 'locality' for MWI, even though the theory relies on a mechanism (the global wavefunction evolution) that fundamentally violates the spirit of local causality by having spacelike separated events (measurements) that are *causally interdependent* in their very definition (which branches exist where)?"**
      *   *Follow-up (If she equates locality with no-signaling):* "If locality *only* means no-signaling (PI), and OI violation is acceptable because there are no single outcomes, doesn't this render 'locality' a much weaker, purely operational concept in MWI, divorced from the intuitive idea of events being causally influenced only by their past light cone? How is this 'locality' meaningfully different from the nonlocality in Bohmian mechanics, which also satisfies PI/no-signaling but explicitly violates OI?"

  5.  **MWI vs. Superdeterminism:** "If preserving a strong notion of locality is such a paramount virtue for you as an Everettian, **why do you reject superdeterminism?** Superdeterminism also satisfies PI (no-signaling) and, by correlating settings and hidden states in the past light cone, can potentially satisfy a stronger form of local causality *without* multiplying universes. Isn't superdeterminism arguably the more *locally causal* solution to Bell's theorem? What makes MWI's specific approach to locality (denying single outcomes) preferable to superdeterminism's approach (denying free choice/statistical independence) if locality is the driving concern?"
      *   *Follow-up (If she dismisses SD as 'unnatural' or 'conspiratorial'):* "Isn't MWI's requirement for an infinite, constantly splitting universe populated by countless unobservable copies also seen by many as 'unnatural'? Isn't the preference then based on philosophical priors (e.g., realism about the wavefunction, dislike of hidden variables, desire for pure unitary evolution) rather than a decisive advantage on *locality* grounds?"

  6.  **The Status of Probabilities:** "In MWI, all outcomes happen. The *appearance* of probability (the Born rule) must be explained. **How does the mechanism guaranteeing the *correct relative frequencies* of branches (e.g., more 'up-down' branches than 'up-up' branches for a singlet state) operate *locally*? If the branching ratios are determined by the global wavefunction amplitude, doesn't this amplitude factor represent a *non-local* piece of information that governs the local branching process at each detector, ensuring the global correlation?"**
      *   *Follow-up (If she invokes decision theory/self-locating uncertainty):* "But doesn't this just explain why an *observer in a branch* sees statistics matching the Born rule? It doesn't explain *why* the universe's wavefunction evolves such that branches with the 'right' amplitude ratios *exist in the first place*. What locally enforces that the amplitude distribution leads to the observed frequencies? Isn't the amplitude a global property?"

  7.  **Locality of the Wavefunction:** "MWI treats the wavefunction as physically real and fundamental. **Is the wavefunction itself a local or non-local entity?** If it's defined on configuration space, not physical space, and its evolution (unitary) is instantaneous across all space, doesn't this constitute a profound form of non-locality *at the fundamental level*, even if it doesn't allow signaling? How can a theory be called 'local' when its fundamental object is inherently non-separable and evolves non-locally?"
      *   *Follow-up (If she argues wavefunction locality is different/not required):* "But doesn't Bell's notion of local causality specifically address *events* in spacetime? If the wavefunction evolution instantaneously 'updates' the state across spacelike separation upon measurement (even though all outcomes are realized), doesn't this represent a form of action-at-a-distance *within* the wavefunction's description of reality, violating the spirit if not the letter (no-signaling) of locality?"

  8.  **The Crux: Dissolution or Relabeling?** "Let's return to the core issue. You argue MWI dissolves the non-locality implied by Bell's theorem by denying that measurements have single outcomes (violating OI without violating PI). **Isn't the *entire cost* of achieving this 'locality' the radical ontological expansion of the universe into countless branching realities? Doesn't this feel less like genuinely *solving* the non-locality puzzle through a local mechanism, and more like *redefining the terms* ('outcome', 'branch') so that the non-local correlation is *reinterpreted* as a pre-existing global property (the entangled wavefunction) that simply manifests locally upon branching? How is this meaningfully different, in terms of locality, from simply accepting the wavefunction collapse as a non-local process?"**
      *   *Follow-up (If she emphasizes no *dynamical* non-locality):* "Granted, there's no *additional* non-local dynamics beyond the unitary evolution. But doesn't the unitary evolution *itself*, applied to entangled states, *embody* the non-local connection? The 'non-locality' is baked into the initial conditions and preserved by the global evolution. Isn't calling this 'local' primarily a semantic victory achieved by shifting the non-separability from the *dynamics* to the *state*?"

  9.  **Falsifiability of MWI Locality:** "Many interpretations make claims that are difficult to falsify. **What conceivable observation or experimental result, even in principle, could count as evidence *against* the specific claim 'MWI is a local theory'?** Conversely, if *any* experimental result consistent with standard QM (which MWI aims to reproduce) is also consistent with 'MWI is local', and no result could contradict it, doesn't this render the claim 'MWI is local' unfalsifiable interpretive bookkeeping rather than a substantive physical claim?"
      *   *Follow-up (If she struggles or says "none"):* "If no evidence could ever challenge it, does asserting 'MWI is local' carry any empirical weight, or is it purely a statement about the preferred metaphysical vocabulary used to describe the mathematical structure of QM? Isn't its main virtue then aesthetic or philosophical (e.g., 'no collapse') rather than empirically demonstrable locality?"

  10. **The Rationalist Certainty:** "In rationalist and EA-adjacent spaces, 'MWI is local, actually' is often stated with surprising confidence, bordering on settled fact. **Given the deep philosophical and conceptual challenges we've discussed – the status of probabilities, the nature of branching in relativity, the potential semantic nature of the 'locality' claim, and its unfalsifiability – do you believe this level of certainty is warranted? Shouldn't the 'locality' of MWI be presented as a highly non-trivial, philosophically loaded *claim* requiring careful defense, rather than an obvious conclusion?"**
      *   *Follow-up (If she defends the certainty):* "But doesn't downplaying these profound conceptual difficulties risk creating a false impression of simplicity and consensus where none exists among experts? Isn't acknowledging the deep puzzles surrounding locality in *any* interpretation, including MWI, crucial for intellectual honesty?"

  **Key Anti-Dodge Strategies Embedded:**

  *   **Forced Precision:** Questions demand specific answers about PI/OI, correlation mechanisms, and relativistic branching.
  *   **Semantic Challenge:** Repeatedly questions whether "locality" in MWI means something substantive or just redefines terms (outcome, branch).
  *   **Mechanism Demand:** Insists on explanation *beyond* "unitary evolution" or "decoherence" for *how* local processes achieve global correlation branch-by-branch.
  *   **Cost Acknowledgment:** Forces confrontation with the ontological cost (infinite branches) as the *price* for the locality claim.
  *   **Comparative Challenge:** Pits MWI against Superdeterminism on locality grounds.
  *   **Falsifiability Trap:** Directly challenges the empirical content of the "locality" claim.
  *   **Follow-up Traps:** Anticipates common responses ("no single outcome", "unitary evolution", "no-signaling = locality", "decision theory") and pushes back immediately on their sufficiency.

  This structure forces the guest to move beyond slogans and engage directly with the toughest conceptual hurdles for the "MWI is local" position. Good luck with the interview!
