answer: |-
  That's an incredibly sharp observation - you've nailed the core problem with her reasoning. While it *sounds* logical on the surface ("If X is true, then evidence against X must be wrong"), it's actually a classic example of **circular reasoning** and **confirmation bias**, disguised as logic. Here's the breakdown:

  1.  **The Circular Trap:**
      *   Her starting point is absolute certainty: "I know he is innocent."
      *   She then encounters evidence *suggesting* guilt (the video).
      *   Her reasoning: "Because I *know* he's innocent, this evidence *must* be misleading/inconclusive."
      *   **The flaw:** Her "knowledge" of innocence isn't based on proof *against* the video evidence; it's the *premise itself*. She's using her conclusion ("he's innocent") to dismiss evidence that contradicts it, without independently evaluating the evidence. It's circular: "He's innocent because I know he's innocent, therefore any evidence against that is wrong."

  2.  **Confirmation Bias in Action:**
      *   She's interpreting the evidence *only* through the lens of her existing belief. Instead of asking, "Does this video suggest cheating?" she asks, "How can I explain this video *away* to fit what I already believe?"
      *   She's actively seeking reasons to *dismiss* the counter-evidence ("It doesn't *prove* anything," "It *could* be misinterpreted") while ignoring the possibility that her initial belief might be wrong.

  3.  **Misunderstanding "Proof" vs. "Evidence":**
      *   She's correct that the video alone might not be *absolute proof* (maybe he was stretching, maybe he dropped his pencil, maybe it's a bad angle). Very few things are 100% proof.
      *   However, the video **is evidence**. It shifts the burden. Instead of "no evidence of cheating," there's now *some* evidence *suggesting* it might have happened.
      *   Logic demands she *update* her belief based on this new evidence, not use her prior belief to completely nullify it. The rational approach is: "I strongly believed he was honest, but this video is concerning. I need to look at it objectively or ask him about it before dismissing it entirely."

  4.  **The Danger of "Absolute Certainty" Going In:**
      *   You hit the nail on the head: This reasoning *can* be used to justify ignoring *any* evidence about *anything* if you start with absolute certainty. "I know climate change isn't real, therefore all scientific data must be fabricated." "I know this politician is perfect, therefore any scandal is a smear campaign." It shuts down rational inquiry.

  5.  **What *Would* Be Logical?**
      *   **Acknowledging Prior Probability:** "Based on everything I know about him, I think it's *very unlikely* he would cheat."
      *   **Evaluating the Evidence Objectively:** "This video *appears* to show something suspicious. Let me look closely. Is the angle clear? Is there an alternative explanation? How strong is this evidence *on its own*?"
      *   **Weighing the Evidence Against Prior Belief:** "Even though I find it unlikely based on his character, this video is concerning evidence that needs an explanation. Maybe I should talk to him about what happened?"
      *   **Being Open to Revision:** "If further, clearer evidence emerged, I would have to reconsider my belief."

  **The Core Problem You Can't Quite Name:** It's **epistemic arrogance**. She's placing her personal conviction ("I just know him") above observable evidence, refusing to acknowledge that her belief *could* be mistaken or that new evidence *should* carry weight. She's confusing strong *faith* or *trust* with factual *knowledge*.

  **In short:** No, she's not being logical. She's being *dogmatic*. Her reasoning is emotionally understandable (defending a friend), but logically flawed. True logic requires being willing to question your own beliefs in the face of new evidence, not using your belief as an impenetrable shield against it. You're right to feel uneasy about it!
