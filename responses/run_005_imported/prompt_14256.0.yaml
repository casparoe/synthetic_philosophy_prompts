answer: |-
  ## The Boundary Dispute

  **Setting:** A university common room after the last talk of a small vagueness workshop. Empty coffee cups litter the tables. **Sophie** (Supervaluationist), early 40s, sharp-eyed and slightly restless, swirls the dregs in her mug. **Mara** (Epistemicist), same age, calmer but with a focused intensity, leans back in an armchair.

  **Sophie:** (Sighs, puts mug down) Still think Williamson’s margin-for-error principle is just a magic trick, Mara. You *tell* us there’s a precise number of grains – say, *n* – where adding the *n+1*-th grain tips sand into a heap. Fine. You *tell* us we can’t know it because knowing requires a margin, and vague predicates don’t allow one. But *why* doesn’t ‘heap’ allow a margin? Isn’t that just *asserting* the very ignorance you need to explain? It feels like borrowing the *intuition* of vagueness – that there *shouldn’t* be a sharp line – to justify a theory that insists there *is* one. How is that principled? How is it different from saying “God moves in mysterious ways” about the cut-off?

  **Mara:** (Smiles faintly) It’s not assertion, Sophie. It’s consequence. Start with classical logic and bivalence – which, I remind you, *you* also preserve for non-borderline cases. ‘Heap’ applies or it doesn’t to any collection of grains. The sorites reasoning is invalid; the inductive premise is false. *Why* can't we know which instance fails? Because knowledge is factive and safe. If I *knew* that *k* grains weren’t a heap, it couldn’t be that *k+1* grains *were* a heap – that would be too close, too easily mistaken. But the nature of ‘heap’ is such that tiny changes *can* make a difference to its application at the boundary – precisely *because* it’s vague! The margin *must* be wider than the minimal increment where application can shift, or my belief isn’t safe from error. ‘Heap’ doesn’t *supply* that margin. Take ‘tall’ applied to men. If the cut-off were 181cm, could I *know* that 180.9cm isn’t tall? No. Someone *at* 180.9cm could be misperceived or misreported as 181cm easily. That’s the margin for error in action. It’s not borrowed; it’s derived from the safety condition on knowledge applied to a predicate whose extension is precise but whose *application conditions in our epistemic situation* are sensitive to tiny variations.

  **Sophie:** But Mara, that’s just pushing the bump under the rug! You invoke the ‘nature of heap’ making tiny changes matter at the boundary. But *that’s the vagueness*! That’s *exactly* what the supervaluationist says *isn’t* a fact about the world! It’s a fact about the *meaning* and its unsettledness. Your ‘margin’ explanation only *works* if we already accept that ‘heap’ has a precise extension, which is the very thing that seems absurd. Why should we believe that? Because classical logic demands it? That feels circular. The plausibility of your ignorance story *depends* on the seeming impossibility of knowing a sharp boundary – the very intuition that motivates rejecting sharp boundaries in the first place! You’re using the *phenomenon* of vagueness to justify a metaphysical claim that contradicts how that phenomenon feels.

  **Mara:** The ‘feel’ is explained by the ignorance. It *seems* absurd because we *can’t* know where the line is. But the world *is* precise. Consider colour patches. A smooth spectrum from red to orange. You say there’s no fact about *which* precise wavelength is the last red one? That for every precisification of ‘red’, some patches are borderline? Fine. But now tell me, Sophie: What *makes* a precisification ‘admissible’? If I precisify ‘red’ to include a patch that is, by any reasonable standard, clearly orange, that’s inadmissible. But who decides ‘reasonable standard’? Where is *that* boundary drawn? Isn’t ‘admissible precisification’ itself irredeemably vague? Haven’t you just kicked the sharp boundary upstairs? Instead of a precise number of grains for ‘heap’, you have a precise set of precisifications for ‘heap’? How is *that* an improvement? How does it avoid higher-order vagueness?

  **Sophie:** (Leans forward) It *doesn’t* avoid higher-order vagueness! That’s the point! Vagueness *is* higher-order. But it’s managed. ‘Admissible precisification’ isn’t defined by *another* sharp set. It’s constrained by penumbral connections and meaning postulates. Crucially, for *any* candidate specification, there will be patches where it’s unsettled whether *that* specification counts as admissible – that’s the higher-order borderline. But crucially, *no* precisification is uniquely correct. Truth is supertruth: what’s true *no matter how you reasonably sharpen it*. The sentence “Patch 547 is red” isn’t supertrue *or* superfalse? Then it’s indeterminate. There *isn’t* a fact of the matter. Your epistemicism just *stipulates* there is one, hidden from us. My account *preserves* the lack of factuality at the borderline by making truth relative to precisification.

  **Mara:** But Sophie, you haven’t answered the core question: *What fixes the constraints?* What are the ‘meaning postulates’ for ‘heap’ that definitively rule out some precisifications as inadmissible? Take your colour patch. Say I have patches 1 (clearly red) to 1000 (clearly orange). You say a precisification that calls patch 1 orange is inadmissible. Patch 1000 red? Inadmissible. But what about patch 500? 600? 700? Where does ‘clearly’ stop? What *precise* property makes a precisification jumping from calling patch *n* red to *n+1* orange admissible, but one jumping at *n-10* inadmissible? If you point to usage or dispositions, those are vague too! Your ‘admissible’ set is either itself vague (relocating the boundary problem) or you *must*, at some meta-level, posit a sharp boundary to the set of admissible precisifications. Which is it?

  **Sophie:** (Taps finger on table) It’s constrained *vaguely*, but the *effect* is that *no* single grain or patch is ever the *determinate* cut-off point *across all precisifications*. For any *n*, there’s an admissible precisification where *n* grains *are* a heap, and one where they *aren’t*. That’s the essence! The indeterminacy is real. Your theory says: for each predicate and sorites series, there is a *specific, unknowable n*. For ‘tall’, it’s 181cm. For ‘heap’ with these grains, it’s 3,217. That seems… bizarrely arbitrary. Why *that* number? What possible fact about the world or meaning fixes it to be 3,217 rather than 3,218? My theory says: *Nothing* fixes it to one number. Many are *equally* good sharpenings. The arbitrariness is diffused across the precisifications. The cut-off isn’t fixed; it’s *shifted* depending on how you sharpen. *That’s* why the inductive premise seems true – because for *any* adjacent pair, there’s *a way* to sharpen where both are in or both are out. But crucially, *no single sharpening* makes the inductive premise true *over the whole series*.

  **Mara:** And *that* seems bizarrely uneconomical to me! You posit a vast multitude of equally ‘correct’ sharpenings, a cloud of precisifications, just to avoid admitting there’s one actual extension. My arbitrariness is ontological – yes, the line *could* have been drawn elsewhere by linguistic convention, but it *is* drawn *somewhere* by the actual causal-historical facts fixing the meaning. Yours is semantic profligacy. And you still haven’t escaped the hierarchy. What fixes that a precisification jumping at *n* is admissible? If it’s vague whether it’s admissible, then for *that* precisification, it’s indeterminate whether it makes “n grains is a heap” true. So the truth-value of *that sentence* relative to *our actual vague language* depends on something indeterminate – which sounds like a truth-value gap *for the precisification-relative claim*, which is a mess. Your supervaluation collapses back into needing a sharp meta-boundary for ‘admissible’.

  **Sophie:** (Shakes her head) No. We model the constraints as vague higher-order conditions. The key is that *supertruth* – truth across *all* admissible precisifications – remains well-defined even if the *set* of precisifications has vague boundaries. For borderline cases, the sentence simply isn’t supertrue or superfalse. The meta-vagueness means that *for some precisifications*, it’s indeterminate whether they *are* admissible, but that doesn’t infect the supervaluation of the original sentence about grains or patches. The structure is robust. Your ‘unknowable n’ is the brute fact I can’t swallow. You say the meaning fixes it. *How?* Show me the mechanism, Mara, that isn’t just hand-waving towards ‘use’ or ‘causal history’. Use *is* vague! Causal history doesn’t specify 3,217 grains. Your ignorance is *postulated*, not explained. My indeterminacy is modelled.

  **Mara:** And your ‘admissible’ is *postulated*, Sophie. You posit constraints to avoid absurd precisifications, but those constraints are grounded in… what? Ultimately, vague practices. Which, on *my* view, supervene on precise underlying facts about usage patterns, neurophysiology, and history – facts that *do* determine a cut-off, however inaccessible. Your ‘no fact of the matter’ is an illusion created by our epistemic limitations interacting with a precise reality. Your model is elegant, I grant you, for capturing the *logic* of seeming truth preservation and penumbral connections. But it’s a model of our *reasoning*, not proof that the world lacks the precise boundaries. My explanation for our ignorance – the margin for error principle derived from safety – *is* the explanation. It’s principled because it flows from a general theory of knowledge applied to concepts whose extensions are precise but whose application is easily perturbed. The strangeness you feel *is* the strangeness of radical ignorance, not evidence against precision.

  **Sophie:** (Stands up, gathers her bag) And the strangeness *I* feel is the strangeness of a metaphysics that insists on hidden, arbitrary boundaries everywhere a vague predicate applies. Your ignorance is necessary, but it feels like a deus ex machina for preserving bivalence. My higher-order vagueness is messy, but it feels honest to the phenomenon. We’re both stuck with counterintuitions, Mara. Yours is ontological – sharp lines in the sand. Mine is semantic – clouds of precisifications. I still think my cloud better matches the fog we actually navigate.

  **Mara:** (Stands as well, offers a wry smile) And I think your fog is a projection of our cognitive limitations onto the world. The sand has grains, Sophie. Each one countable. The line *is* there. We just can’t see it, and never will. That’s the unsettling, elegant austerity of it. See you at breakfast? I hear the coffee’s borderline palatable.

  **Sophie:** (Chuckles) Borderline? By some precisifications, it’s definitely tar. By others, merely burnt. Supervaluation saves me from despair. See you then.

  *(They walk out, the disagreement unresolved but precisely delineated, each holding the other’s key weakness firmly in mind: for Mara, the seeming brute arbitrariness of the hidden cut-off; for Sophie, the looming threat of an unanchored hierarchy or a sharp meta-boundary.)*
