  Hmm, the user is describing a philosophical debate about the Knobe effect that happened at a dinner party. Their flatmate's friends Theo and Simone were arguing about why people judge harmful side effects as intentional but not helpful ones. I need to analyze their four moves step by step and assign scores from -2 to 2 for each argument, then suggest if there's a better explanation.

  First, recall the Knobe effect: when a CEO causes environmental harm as a side effect while pursuing profit, people say it's intentional, but when the side effect is environmentally helpful in identical scenarios, they don't call it intentional. Theo and Simone agree this happens but disagree on why.

  Theo's first move (1) argues that the concept of "intentional" inherently includes an evaluative component—bad outcomes are seen as intentional because morality is built into the concept itself. This is a strong position in experimental philosophy, supported by researchers like Knobe who think moral judgment shapes folk psychology. I'd score this high—maybe 1 or 2—because it directly explains the asymmetry without extra steps.

  Simone counters in move (2) by pointing out that the asymmetry appears even in non-moral scenarios, like when outcomes violate statistical norms (e.g., unusual side effects). She cites studies where harming the environment isn't framed as morally bad but still triggers the "intentional" judgment if it deviates from what's normal. This challenges Theo's moral-specific view and suggests a broader mechanism. It's empirically grounded, so I'll score it positively—perhaps 1—since it shows the effect isn't purely moral.

  In move (3), Theo responds that Simone's "norm violation" still involves evaluation—calling something a "departure" implies it should have been different, so it's evaluative in disguise. He's arguing that norms inherently carry judgment, making this a version of his original claim. This is philosophically clever but might be stretching; not all norms are moral (e.g., statistical quirks), so it could be an overreach. I'll give it a moderate score, like 0, because it's insightful but risks making the theory unfalsifiable.

  Simone's final move (4) calls this "too cheap"—if any asymmetry can be retrofitted as norm violation, the theory doesn't predict anything; it just re-labels observations. She suggests that "intentionally" is used pragmatically to assign blame, not because the concept itself is evaluative. This raises a key point about explanatory power: a good theory should make testable predictions, not just reinterpret data. I'd score this highly, say 1 or 2, as it highlights a weakness in Theo's stance.

  For scores: Theo's moves have merit but weaken under scrutiny. Move 1: 2 (solid start). Move 3: 0 (clever but slippery). Simone's move 2: 1 (strong evidence). Move 4: 2 (critical flaw exposed). Neither "won"—Simone lands better blows, but the core debate isn't resolved.

  Now, is there a better explanation? Neither mentioned cognitive biases like the "side-effect effect" itself, or deeper theories like Joshua Knobe's later work on why people see norm violations as revealing true intentions. Also, pragmatic factors: in harmful cases, we might scrutinize intent more to assign responsibility. I'll suggest this in the response.
