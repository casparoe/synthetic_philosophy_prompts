  The friend's argument breaks down by assuming "disregarding" feedback is easy. In practice, our brains latch onto vivid input, especially when we're uncertain (like now). A single negative phrase could haunt them for chapters; effusive praise might create pressure to replicate past success. This cognitive burden isn't quantifiable, but it's real—it drains mental energy better spent drafting. 

