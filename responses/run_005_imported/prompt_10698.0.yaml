answer: |-
  Your friend's argument has the elegant simplicity of pure logic—but it breaks down precisely where logic meets the messy reality of creative work. He's not *wrong* in a vacuum; he's just applying a model designed for financial risk assessment to a profoundly human, nonlinear process. Here's where his reasoning falters and why your instinct to protect your drafting space remains sound:

  ### The Critical Flaws in the "Cost-Nothing/Gain-Something" Model
  1.  **Misunderstanding "Cost":** Your friend defines "cost" as tangible harm (e.g., wasted time, actionable bad advice). He ignores **cognitive and emotional overhead**. Reading reviews—*especially* when you're actively wrestling with a creative decision—creates mental noise:
      *   **Anchoring Bias:** A single strong positive or negative comment about the aunt becomes a cognitive anchor. You *will* weigh your decision against it, consciously or not, even if you "disregard" it. ("But Kirkus loved her... maybe I *should* bring her back more?" or "PW found her grating... maybe I *should* minimize her?").
      *   **Paralysis by Analysis:** Instead of choosing the version that serves *this new story best*, you risk choosing the version you *think* reviewers/readers preferred. This inserts a layer of second-guessing that stifles instinct.
      *   **Energy Drain:** Processing external judgment, even positive, requires mental energy. That energy is siphoned away from the fragile act of creation. It shifts your focus from "What does *this book* need?" to "What did *they* think?"

  2.  **Overestimating "Gain" and Misidentifying "Evidence":**
      *   **Irrelevant Sample:** Trade reviews are written by a tiny group of professionals aiming at *booksellers and librarians*, not your core readers. Their focus is marketability and broad literary merit, not nuanced character resonance. Their opinion on the aunt is statistically insignificant and potentially misaligned with your actual audience.
      *   **Lagging Indicator:** These reviews reflect the *published* book 1, not the *living, evolving* world of book 2. What served book 1 might not serve book 2. Basing a sequel decision on pre-publication book 1 reviews risks making your new story derivative.
      *   **Confirmation Bias Trap:** If a review mentions the aunt favorably, you might overweight that single data point as "proof" she *must* be prominent, ignoring other narrative imperatives. If no review mentions her, you might misinterpret silence as indifference. Neither is reliable evidence.

  3.  **The Illusion of Disregard:** Your friend assumes you can easily compartmentalize. But the creative mind, mid-draft, is inherently porous and vulnerable. Negative comments sting more; praise creates pressure. The very act of reading them injects external voices into a process that *requires* internal focus. As you've astutely noted, **even praise redirects**. It creates an external expectation that competes with your internal compass.

  ### Why Your Policy is Wise, Especially Now
  Your policy isn't just "avoiding bad feelings"; it's **protecting the integrity of your creative process.** Drafting requires inhabiting a self-contained world. Introducing external validation/criticism *during* this phase:

  *   **Dilutes Authorial Voice:** It shifts the question from "What is true for these characters and this story?" to "What will they approve of?"
  *   **Short-Circuits Discovery:** The aunt's role in the sequel should emerge from the *new story's* needs and your evolving understanding of the character, not from a perceived mandate based on past reactions.
  *   **Introduces Premature Editing:** You start writing *for* an audience (or reviewers) before the story's own logic is fully formed.

  ### A Better Path Forward for the Aunt Decision
  1.  **Trust Your Instinct & the New Story:** Which version *feels* more vital, necessary, and generative for *this specific sequel*? Which one excites *you* more? Which serves the protagonist's arc in *this* book best?
  2.  **Seek Controlled, Trusted Input (If Needed):** Instead of random reviewers, ask 1-2 trusted *beta readers* (who understand your process) specifically: "How did the aunt land for *you* in Book 1? Did you feel her story was complete, or did you want more?" Frame it narrowly. *Do not* tell them about your sequel dilemma to avoid biasing their recall.
  3.  **Write Both Paths Further:** Don't just have two openings. Write a key scene with the aunt playing the larger role, and one without. Which scene feels more authentic and propels the narrative forward more effectively?
  4.  **Defer to Your Editor *After* Drafting:** Once you have a complete draft (or a substantial chunk), *then* discuss the aunt's role with your editor. They have a broader view of the market *and* your work, but crucially, they'll be reacting to *the new material*, not just the old reviews.

  ### The Verdict
  **Your friend is wrong in the context of creative work.** His model ignores the non-quantifiable, essential vulnerability of the drafting process. The potential "gain" (dubious, unreliable feedback) is vastly outweighed by the very real "costs" of cognitive noise, biased decision-making, and the erosion of creative autonomy. **The flaw is assuming the human creator is a rational optimization engine, rather than an intuitive artist building a fragile world.**

  Protect your drafting space. Tell your editor, "Hold them back until publication, as usual. I need to stay inside this story." Choose the path for the aunt that feels essential to *this* sequel, born from your own artistic imperative. The reviews will still be there later, but the pure, undirected energy of your current draft is irreplaceable. Trust the process that brought you this far.
