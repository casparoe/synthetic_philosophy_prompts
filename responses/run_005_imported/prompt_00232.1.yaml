  First, I need to recall what anti-Humeanism entails. Anti-Humeans believe that laws of nature are more than just regularities; they involve necessary connections or governing relations. This contrasts with Humeanism, where laws are summaries of events. The user thinks this robust necessitation implies determinism, meaning no room for chance. But Maudlin, an anti-Humean, supports stochastic theories like GRW, which have objective probabilities. That's the crux of their confusion.

  So, why isn't this a contradiction? I should explain how anti-Humeanism can accommodate probabilistic laws. The key is that necessitation doesn't have to be deterministic. Anti-Humeans can view laws as imposing probabilities rather than certainties. For example, a law might necessitate that an event has a 70% chance of happening. This is still a form of governance, just not deterministic. Maudlin's position fits here: objective collapse theories have laws that govern through probabilities.

  I should also address the user's mention of "robust necessitation." They might interpret "necessitation" strictly as deterministic causation. But in philosophy, especially with Maudlin, it's broader. Laws can necessitate probabilistic outcomes. The governance is about the structure of reality, not just deterministic outcomes. 

  The user's deeper need might be understanding how different interpretations of laws affect compatibility with indeterminism. They might be encountering conflicting sources and need clarification on Maudlin's stance. They might also be interested in how anti-Humeanism handles probability ontologically. 

  I should emphasize that for anti-Humeans, laws are metaphysical entities that can have probabilistic content. Maudlin's governing relation includes specifying probabilities, making objective collapse theories consistent. Also, distinguishing between epistemic and objective probabilities is crucial here. Anti-Humeans reject epistemic probabilities for laws, but embrace objective chances as real features of the world's structure. 

  The user might benefit from examples like GRW's collapse mechanism, where the law dictates when and how collapses occur probabilistically. This shows governance without determinism. Concluding that anti-Humeanism isn't tied to determinism because necessitation can be probabilistic resolves the apparent contradiction Maudlin presents.
answer: |-
  That's an **excellent** and very sharp question cutting to the heart of contemporary debates in the metaphysics of laws. The apparent tension you've identified is real, and resolving it requires a careful look at how anti-Humeans conceptualize "necessitation" and "governance." **Maudlin's position (and similar anti-Humean stances compatible with objective chance) is *not* necessarily a contradiction, but it does require rejecting a specific, strong interpretation of "necessitation."**

  Here's the breakdown:

  1.  **The Core Anti-Humean Commitment:** Anti-Humeans (like Maudlin, Armstrong, Dretske, Tooley) reject the Humean reduction of laws to mere patterns in the Humean mosaic (events). They posit that laws are *fundamental, irreducible features of reality* that **govern** or **constrain** what happens. There's a "modal oomph" or "productive power" inherent in the laws.

  2.  **The Temptation Towards Determinism:** It's natural to think that if laws *govern* or *necessitate* events, then given the initial conditions and the laws, only *one* future is possible. This seems like determinism.

  3.  **The Key Distinction: Deterministic Necessitation vs. Probabilistic Governance:**
      *   **Strong Necessitation (Leads to Determinism):** This view holds that the governing relation *strictly necessitates* specific outcomes. Given antecedent conditions + laws, outcome E *must* happen. No alternatives are physically possible. This *does* force determinism.
      *   **Probabilistic Governance (Compatible with Indeterminism):** This view holds that the governing relation *imposes objective probabilities* on outcomes. The law doesn't say "E *must* happen," but rather "E *has an objective chance X of happening* given these conditions." The law *governs* by *setting the chances*.

      **Anti-Humeans like Maudlin embrace the second option.** Here's how it works:

      *   **The Law Itself Contains Probabilistic Content:** For an anti-Humean, a fundamental law of nature can *itself* be probabilistic. It's not a failure of the law to necessitate; the *job* of the law *is* to assign objective probabilities. For example:
          *   In GRW (an objective collapse theory Maudlin favors), the fundamental law *is* the stochastic collapse postulate. It *governs* by specifying *when* collapses are *objectively likely* to occur and *to what state* they are *objectively likely* to collapse.
          *   The law isn't a mere description of frequencies; it's the *fundamental reason why* those frequencies obtain. It's the *source* of the objective chance.
      *   **Governance via Chance Setting:** The law *necessitates* that *these specific chances exist and operate*. It necessitates that the world evolves *according to this specific probability measure*. What it doesn't necessitate is *which specific outcome* occurs on a given trial – that's where the genuine, objective chance comes in.
      *   **Modal Force is Probabilistic:** The "modal oomph" is applied to the *probabilistic structure itself*. The law makes it the case that certain future histories are *objectively probable* or *objectively improbable*, not that only one is possible. It rules out histories that violate the probability distribution as *physically impossible* (e.g., a history where a fair quantum coin *always* lands heads is physically impossible), but allows multiple histories consistent with the chances.

  4.  **Maudlin's Specific View (Governing Relations):** Maudlin explicitly argues that governing relations need not be deterministic. His "Primitive Ontology" framework emphasizes that laws are fundamental entities that *produce* the history of the universe. Crucially, these productive relations can be *stochastic*. The fundamental law *tells* the primitive ontology (e.g., particles, flashes, a matter density field) how to behave *in probabilistic terms*. This *is* governance. It's just not *deterministic* governance.

  5.  **Contrast with Humeanism about Chance:**
      *   *Humeans* (like Lewis, Loewer, Cohen & Callender) also believe in objective chance, but they *reduce* it to patterns within the best system summarizing the entire Humean mosaic. Chance is a feature *of* the mosaic, not something *over and above* it that governs.
      *   *Anti-Humeans* (like Maudlin) insist that the objective chance is *prior to* and *explanatory of* the patterns in the mosaic. The law *governs* the mosaic *by imposing* the chances.

  **Why it's NOT a contradiction for Maudlin:**

  1.  **Anti-Humeanism ≠ Necessitarian Determinism:** Maudlin rejects the conflation of "governing" with "deterministic necessitation." His core anti-Humeanism is the rejection of the *Humean reduction* of laws/chance, not the commitment to determinism.
  2.  **Governing Stochastic Laws:** He posits that fundamental laws *can be* stochastic. These laws are still fundamental, irreducible governing entities. They govern *by specifying* objective probabilities. The stochastic law *is* the robust necessitation relation – it necessitates the probabilistic structure of reality.
  3.  **Objective Chance as Governed Outcome:** The genuinely chancy events (like specific GRW collapses) are *the outcomes produced* by the operation of the fundamentally probabilistic governing law.

  **Conclusion:**

  Your intuition highlights a crucial fork in anti-Humeanism. *Some* anti-Humeans (often inspired more by Armstrong) lean towards necessitation implying determinism. **However, Maudlin represents a dominant strand of contemporary anti-Humeanism that explicitly incorporates objective chance.** For them:

  *   **Anti-Humeanism:** Laws are fundamental, irreducible governing relations.
  *   **Compatibility with Indeterminism:** These fundamental governing relations can *themselves* be probabilistic. They govern *by setting* objective chances. They necessitate *that the world evolves according to this specific probability measure*, not that it evolves deterministically.

  So, Maudlin being an anti-Humean *and* a proponent of objective collapse theories is perfectly consistent. His anti-Humeanism provides the *metaphysical grounding* for the objective chances inherent in those theories. The robust necessitation relation *is* the probabilistic law itself. The tension is resolved by recognizing that "necessitation" within anti-Humeanism can take a fundamentally probabilistic form.
