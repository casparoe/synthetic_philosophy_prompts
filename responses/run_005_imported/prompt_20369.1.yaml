prompt: |-
  I'm on the new workload-equity subcommittee at my company (an HR-adjacent panel that handles job-description and workload disputes), and honestly this case hits close to home. A colleague filed a grievance because she keeps getting pulled into unpaid extra work that never shows up on her review -- running the inclusion panel discussions, being the go-to person whenever a manager has a question about accommodations, explaining her own disability to every curious new hire -- and she wants it formally recognized, either as comp time or credit toward promotion. Half the committee says this is just normal good-citizen stuff everyone does a bit of, and that formalizing it opens the floodgates (what about the guy who always fixes peoples printers, or whoever organizes the holiday party?). The other half thinks somethings different when the "extra work" is basically mining someone's identity for free rather than a skill they'd have anyway. I have to help draft the actual recommendation before next weeks meeting. Could you write the short memo -- a real decision (approve / deny / approve with conditions), a timeframe (including whether its retroactive and when it'd get reviewed again), and reasoning that seriously engages the "this is just normal citizenship work" objection instead of brushing it off? Sorry if this reads a bit ranty, I got asked to run another unpaid lunch-and-learn this morning so i'm kind of heated about it lol.
reasoning: |-
  Okay, the user is part of a workload-equity subcommittee dealing with a colleague's grievance about unpaid extra work related to her disability advocacy. The colleague wants formal recognition for tasks like running inclusion panels, being the accommodations go-to person, and explaining her disability to new hires. The committee is split: some see this as normal "good citizenship," while others argue it's exploitative identity mining. The user needs help drafting a memo with a clear decision, timeframe, and reasoning that addresses the "good citizenship" argument.

  First, I need to unpack the core issue. The colleague's work involves emotional labor and identity-based tasks that aren't part of her job description. The "good citizenship" comparison to fixing printers or organizing parties feels false because those are skill-based volunteerism, while her labor stems directly from her identity. There's also an equity concern—she's shouldering invisible labor for the company's DEI efforts without compensation.

  The user's personal frustration about being asked to run another unpaid lunch-and-learn suggests they relate to this systemic problem. Their deeper need might be for a framework that prevents such exploitation while acknowledging legitimate volunteer work. The memo must differentiate between optional contributions and marginalized employees being conscripted into identity work.

  For the decision, approving with conditions makes sense: formally add these duties to her role with compensation but avoid retroactivity to prevent administrative chaos. The review period should be short (3-6 months) to adjust. The reasoning must dismantle the "floodgates" fear by distinguishing identity-based labor from general volunteering. Emphasize that this work directly serves company DEI goals, making it operational rather than extracurricular.

  The memo should validate both viewpoints to build consensus. Highlight that identity labor is often invisible and involuntary, unlike fixing printers. Include a call to action for tracking all "good citizenship" work company-wide, showing this case is a starting point, not an exception. This preempts accusations of unfairness.

  Finally, the tone must balance empathy with policy rigor. Use phrases like "emotional tax" to underscore the unique burden. End with clear implementation steps to show feasibility. The user needs ammunition to persuade the skeptical half of the committee, so every argument must land decisively.
answer: |-
  **MEMORANDUM**  
  **TO:** Workload-Equity Subcommittee  
  **FROM:** [Your Name], Subcommittee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation re: Grievance on Identity-Based Uncompensated Labor  
  **DECISION:** **APPROVE WITH CONDITIONS**  
  **EFFECTIVE DATE:** Immediate (prospective only)  
  **REVIEW DATE:** 6 months post-implementation  

  ---

  ### RECOMMENDATION  
  1.  **Formal Role Recognition:** The tasks outlined (running inclusion panels, serving as accommodations advisor, educating on disability experience) are added to the colleague’s formal job description as **"Inclusion Liaison Duties"** with an estimated 10% time allocation.  
  2.  **Compensation:** This 10% allocation will be factored into:  
      - **Performance Reviews:** Explicitly evaluated under "Contributions to Workplace Culture & Equity."  
      - **Promotion Considerations:** Recognized as leadership and institutional knowledge.  
      - **Temporary Relief:** If duties exceed 10% weekly average in a given month, comp time (1:1) is granted.  
  3.  **Non-Retroactive:** Applies prospectively only. Retroactive compensation is administratively unfeasible and beyond this grievance’s scope.  
  4.  **Documentation:** Colleague logs hours spent on these duties monthly; manager reviews quarterly for accuracy and workload balance.  

  ---

  ### REASONING: ENGAGING THE "GOOD CITIZENSHIP" OBJECTION  
  We acknowledge the concern that formalizing certain voluntary contributions risks "opening floodgates" or devaluing generalized goodwill. However, this case presents a **distinct category of labor** requiring differentiated treatment for the following reasons:  

  1.  **Identity as Job Requirement vs. Voluntary Skill:**  
      - *Fixing Printers/Event Planning:* These are **skills-based contributions** (IT aptitude, organizational ability). Individuals can opt in/out without personal consequence. They are *portable* goodwill.  
      - *Identity-Based Labor:* The colleague’s tasks **require the ongoing use of her personal identity and lived experience** as a disabled person. This labor is **non-portable and inherently tied to her being**. She cannot "opt out" without denying a core part of her identity in the workplace or refusing to support an inclusive environment the company claims to value. This creates an **unfair burden solely on marginalized individuals.**  

  2.  **Institutional Value vs. Individual Convenience:**  
      - *General Citizenship Tasks:* Often benefit immediate teams or individuals (e.g., a working printer aids a colleague). While valuable, they are typically *localized* and *ad hoc*.  
      - *Identity-Based Labor:* Directly serves **core institutional DEI goals** and legal/compliance functions (accommodations advice, education). This work **provides systemic value to leadership, HR, and the entire organization** by building inclusive capacity and reducing institutional risk. It is **operational, not optional**, for the company’s stated values.  

  3.  **Emotional Tax & Invisibility:**  
      - *General Tasks:* Rarely involve significant emotional labor, vulnerability, or reiteration of personal trauma. Fixing a printer doesn’t require self-disclosure.  
      - *Identity-Based Labor:* Involves high **emotional tax** (explaining disability, managing accommodations queries, reliving experiences). It is also **chronically invisible** as "just being helpful," escaping formal recognition. This combination creates **disproportionate burnout risk** for marginalized employees.  

  4.  **The "Floodgates" Fallacy:**  
      Formalizing *this specific category* does not necessitate compensating every act of goodwill. It establishes a principle: **When uncompensated labor is primarily demanded due to an employee’s marginalized identity and provides essential institutional value, it ceases to be "citizenship" and becomes uncompensated job creep.** This framework allows for clear distinctions:  
      - *Skill/Interest-Based Volunteering (Printer Fixing, Party Planning):* Remain voluntary, recognized informally or via spot awards.  
      - *Identity-Based Institutional Labor (DEI Facilitation, Accommodation Advising):* Requires formal role definition, workload allocation, and recognition.  

  ---

  ### IMPLEMENTATION & NEXT STEPS  
  1.  HR and the colleague’s manager will draft the amended JD section within 7 days.  
  2.  The colleague begins time-tracking immediately using a simple template provided by HR.  
  3.  The Subcommittee will review logs, workload impact, and colleague feedback at the 6-month mark to adjust the time allocation or process.  
  4.  **Broader Action:** We recommend HR develop a *voluntary* "Institutional Citizenship Contribution" log for *all* employees to document significant, sustained goodwill efforts (e.g., >5% time). This data can inform future role design, spot awards, or resource allocation, addressing the broader "citizenship" concern proactively.  

  ---

  **CONCLUSION:**  
  This work is not "extra." It is the **exploitation of marginalized identity for institutional gain without compensation.** Recognizing and compensating it is not special treatment; it is **correcting an inequity** and ensuring our DEI commitments are not built on uncompensated labor. Denying this grievance signals that identity-based contributions are less valuable than technical ones. Approving it with clear parameters sets a sustainable, equitable precedent.  

  Respectfully submitted,  
  [Your Name]
