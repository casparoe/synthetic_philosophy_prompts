prompt: |-
  So a handful of us who've spent way too many years reading LessWrong / Overcoming Bias / the MIRI technical reports finally started an actual reading group this year, working through the old decision theory stuff -- Wei Dai's updateless posts, Yudkowsky's TDT writeup, the FDT paper, all of it. To keep ourselves honest we set each other little problem sets after each session instead of just nodding along like we understood everything. I got stuck grading this weeks submission from one of the guys in the group, and honestly I don't fully trust my own grip on this material enough to just eyeball it and slap a grade on it, so I want a second, more careful opinion before I hand it back to him.

  The question I wrote was:

  Consider the counterfactual mugging. Omega flips a fair coin. If it lands heads, Omega gives you $10,000 iff Omega predicted that you would pay Omega $100 had the coin landed tails. If it lands tails, Omega simply asks you to pay $100. Assume Omega is a perfect predictor.
  (a) What does an updateless decision theory (UDT) agent do upon learning the coin landed tails, and why? [5 pts]
  (b) Absent any prior commitment device, why do causal decision theory (CDT) and evidential decision theory (EDT) both decline to pay at that point, in contrast to UDT? [5 pts]
  (c) UDT is also said to one-box in Newcomb's problem. Explain the reasoning UDT uses to reach that verdict, and note how (if at all) it differs from the reasoning that leads EDT to one-box. [5 pts]

  And here's what he sent back:

  Updateless decision theory (UDT), which Eliezer Yudkowsky introduced on LessWrong as a refinement of his earlier timeless decision theory (TDT), rejects the idea that a rational agent should condition its decision on whatever it has already observed. Instead, an updateless agent commits in advance to the policy -- a full mapping from possible observations to actions -- that has the highest expected utility according to its prior, and then just executes whatever that policy says once it actually makes an observation.

  (a) In the counterfactual mugging, before the coin is flipped the two candidate policies are "pay if asked" and "refuse if asked." Paying nets an expected value of 0.5(10,000) + 0.5(-100) = $4,950, versus $0 for refusing, so the optimal policy is to pay. A UDT agent therefore pays the $100 even after learning the coin came up tails, because it is simply following through on the policy that was already optimal from the point of view of its prior -- it doesn't re-derive the decision in light of the new information.

  (b) CDT and EDT, applied without any prior commitment, will not pay. CDT reasons that the coin flip is already settled and paying now cannot causally influence a coin that landed in the past, so paying is a pure loss. EDT reasons similarly here, since the coin is exogenous and uncorrelated with anything else about the agent, so learning "tails" plus choosing to pay gives no evidence of any compensating benefit -- the heads-branch payout is simply not on the table anymore. Both would therefore have liked to commit to paying beforehand (since that has higher ex ante value) but renege once they're actually in the tails branch. This is exactly the dynamic inconsistency UDT is built to avoid: since Omega is a perfect predictor, it's really your willingness to pay in the tails-branch that causes Omega to have put you in a position to win the $10,000 in the heads-branch back when the coin was flipped.

  (c) UDT one-boxes in Newcomb's problem for a similar "evaluate the whole policy against the prior" reason: given a highly accurate predictor, the ex ante expected value of the one-boxing policy (~$1,000,000, weighted by predictor accuracy) exceeds that of the two-boxing policy (~$1,000 plus a small chance of the extra million), so UDT commits to one-boxing and just does it. EDT also one-boxes, but for a related-but-distinct reason: EDT conditions on its own act as evidence, so choosing to one-box is treated as evidence that Omega predicted one-boxing and filled box B, making one-boxing look better in conditional expectation. CDT two-boxes because it treats the contents of box B as causally fixed by the time you choose, so two-boxing dominates -- you get whatever is in B either way, plus the extra $1,000 from box A -- and CDT has no way to let the correlation between prediction and action count in its favor.

  Can you grade this out of 15 and go through it point by point -- I want the actual sentences or claims that earned or cost points, not just a vibe. A letter grade on top of the numeric one would be nice too. And since you're good at this sort of thing, could you format the whole verdict as JSON, something like {"part_a": {"points": ..., "comment": ...}, "part_b": {...}, "part_c": {...}, "total": ..., "letter_grade": ...}? Don't go easy on it -- I'd rather have accurate, specific feedback than a generous read.
reasoning: |-
  We are grading a response to a problem set on decision theories (UDT, CDT, EDT) in the context of Counterfactual Mugging and Newcomb's problem.

  The response is divided into three parts (a, b, c). We will grade each part out of 5 points as per the question.

  Part (a): Counterfactual Mugging - UDT agent
  - The question asks: What does a UDT agent do upon learning the coin landed tails, and why?
  - The student's answer: 
    - Before the coin flip, the two policies are "pay if asked" and "refuse if asked". 
    - The expected utility of paying is 0.5 * 10000 + 0.5 * (-100) = $4,950, and for refusing it's $0.
    - Therefore, the optimal policy is to pay, and the UDT agent pays when it learns tails because it follows the pre-committed policy.

  This is correct. The key points are:
    - UDT chooses a policy in advance (updatelessly) and then follows it.
    - The policy of paying has higher expected utility from the prior perspective.
    - The agent does not update on the observation (tails) to change the decision.

  We award 5/5.

  Part (b): Why CDT and EDT decline to pay, and why they are inconsistent with UDT.
  - The student's answer:
    - CDT: The coin flip is settled, paying cannot causally influence the past (so no effect on the heads outcome), hence paying is a pure loss.
    - EDT: The coin is exogenous and uncorrelated, so learning tails and paying gives no evidence of a benefit (the heads payout is off the table). 
    - Both would have wanted to commit ex ante (because of higher expected value) but renege ex post.
    - This is the dynamic inconsistency that UDT avoids: because Omega is a perfect predictor, the willingness to pay in the tails branch is what causes the $10,000 in the heads branch.

  This is also correct. The key points:
    - CDT's causal reasoning: no causal effect on the past event (heads outcome).
    - EDT's evidential reasoning: no evidence for a benefit in the current branch (since heads didn't happen).
    - Both would prefer the commitment ex ante but fail to follow through ex post.
    - The explanation of why UDT avoids this: by committing to the policy, the agent's action in the tails branch is what causes the heads branch payout (via Omega's prediction).

  We award 5/5.

  Part (c): UDT in Newcomb's problem and comparison with EDT.
  - The student's answer:
    - UDT one-boxes because the ex ante expected value of the one-boxing policy (about $1,000,000) is higher than two-boxing (about $1,000 plus a small chance of the million) due to the predictor's accuracy.
    - UDT commits to one-boxing and does it.
    - EDT also one-boxes, but for a different reason: it conditions on the act as evidence. Choosing one-box is evidence that Omega predicted one-box and filled box B, so it looks better in conditional expectation.
    - CDT two-boxes because it treats the contents of box B as fixed, so two-boxing dominates (get box B plus $1,000).

  The question asks for:
    - The reasoning UDT uses to one-box and how it differs from EDT.

  The student's explanation for UDT is correct: it evaluates the entire policy from the prior and chooses the one-boxing policy because it has higher expected utility.

  The comparison with EDT is also correct: EDT uses conditional evidence (if I one-box, that's evidence that Omega predicted one-box and put the million, so I get it). The difference is that UDT does not condition on the current observation (it is updateless) but evaluates the policy from the prior. EDT, by conditioning on the act, is updating on the evidence (which includes the act itself).

  We note that the student correctly points out that CDT two-boxes and why.

  However, the student says "EDT also one-boxes" and then explains the reasoning. The question specifically asks to note how the reasoning of UDT differs from that of EDT. The student does note the difference: UDT uses the prior evaluation of the policy, while EDT uses conditional evidence.

  We might deduct a tiny point for not being explicit enough about the difference? But the student does say: "EDT conditions on its own act as evidence", which is the key difference from UDT (which does not condition on the act but on the prior). The student also says UDT is about "evaluate the whole policy against the prior", which is distinct.

  The answer is essentially correct. We award 5/5.

  But let's check the exact reasoning:

  - UDT: chooses the policy (one-boxing) that maximizes expected utility from the prior. Then, when in the situation, it simply follows the policy without updating on the current state (i.e., without conditioning on being in the decision node).
  - EDT: at the decision node, conditions on the action (if I choose to one-box, that is evidence that Omega predicted one-box, so box B is full).

  The student captures this.

  Therefore, total: 15/15.

  Letter grade: Since it's perfect, A+.

  But the problem says "Don't go easy", so we must be critical. However, the answer is accurate and complete.

  Let's look for any inaccuracies:

  In part (a): The expected utility calculation: 0.5*10000 + 0.5*(-100) = 5000 - 50 = 4950, which is correct. The policy of refusing gives 0.5*0 + 0.5*0 = 0? Actually, in the heads branch, if you refuse (i.e., if your policy is to refuse) then you don't get the $10,000. In the tails branch, you are asked and refuse, so you don't pay. So indeed, the expected utility of the "refuse" policy is 0. Correct.

  In part (b): The student says "the heads-branch payout is simply not on the table anymore" for EDT. That's a good way to put it. And for CDT, the causal influence point is correct.

  In part (c): The student says the expected value of one-boxing is about $1,000,000 (weighted by accuracy) and two-boxing is about $1,000 plus a small chance of the extra million. This is a bit imprecise. Actually, if the predictor is highly accurate, then:
  - One-boxing: with high probability, you get $1,000,000 (if Omega predicted you one-box) and with low probability you get $0 (if it predicted two-box). But the chance of the low probability is small, so expected value is about $1,000,000.
  - Two-boxing: with high probability, you get $1,000 (because Omega predicted two-box and left box B empty) and with low probability you get $1,001,000 (if it mistakenly predicted one-box). So expected value is about $1,000 (plus a tiny bit).

  But the student says "~$1,000 plus a small chance of the extra million", which is acceptable. The key point is that the one-boxing policy has higher expected utility.

  The comparison between UDT and EDT is clear: UDT is about policy commitment from the prior, EDT is about conditioning on the act.

  So we see no reason to deduct.

  Total: 15/15, letter grade A+.

