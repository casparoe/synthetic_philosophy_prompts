  okay so my friend and i had this whole argument last night, like 2 hours, and neither of us backed down. it started because i said whether you actually "know" something can depend on how much is riding on it - like i know my bus usually comes at 8:15 and i'd say that no problem on a normal day, but if i'm about to lose my job for being even 5 min late, i suddenly don't feel like i "know" it anymore, even though my evidence is exactly the same. she agreed something changes there but says its not that i actually stop knowing anything - its that the word "know" itself gets held to a stricter standard once real stakes are in the room, so nothing about my actual situation changed, just what it takes to satisfy the sentence. we went back and forth for ages about which of us was right and got nowhere. could you write a dialogue between a pragmatic encroachment theorist and an epistemic contextualist basically having this same fight - have them really engage with each other's strongest points instead of just restating their own view, and see if they can figure out whether they're genuinely disagreeing about something or just describing the same phenomenon with two different vocabularies.
