answer: |-
  You've hit on a fascinating tension between pure decision theory and the messy realities of legal strategy. Your statistical intuition is logically sound in a vacuum—more information *shouldn't* actively harm rational decisions. But legal systems operate under different rules, turning "deliberate ignorance" into a rational strategy. Here's why:

  ### 1. **Legal Systems Punish Intent Asymmetrically**
     - **Willful Infringement vs. Innocent Infringement**: In both copyright and patent law, *knowingly* violating IP rights triggers severe penalties:
       - **Copyright**: Willful infringement can lead to statutory damages up to $150,000 *per work* (vs. $200–$30,000 for innocent infringement).
       - **Patents**: "Willful" infringement can triple damages (treble damages) and impose attorney's fees.
     - **Ignorance as a Shield**: By avoiding direct knowledge of competitors' IP, you create plausible deniability. If sued, your defense shifts from "we knew but did it anyway" to "we independently created this in good faith." This isn't just about guilt—it's about *provability* in court.

  ### 2. **The "Taint" is Real (and Procedural)**
     - **Evidence Contamination**: If your team viewed the competitor's code, *any* similarity—even coincidental—could be presented as "proof" of copying. Your clean-room process generates a verifiable paper trail (specs, lawyer sign-offs) proving independent creation.
     - **Witness Credibility**: Engineers who saw the code could be forced to testify. Cross-examination might twist innocent parallels into "admissions" of copying. Ignorance removes this risk entirely.

  ### 3. **Legal Systems Reward Procedural Rigor**
     - **Documented Clean Rooms Signal Good Faith**: Courts recognize clean-room designs as evidence of intent to comply with IP law. Skipping this step looks reckless—like "willful blindness."
     - **Lower Settlement Leverage**: If sued, a clean-room process makes your position stronger. Opponents know proving willfulness is harder, making them more likely to settle cheaply or drop the case.

  ### 4. **The Loophole Isn't a Loophole**
     - **You Can't "Unsee" Code**: Decision theory assumes you can ignore information freely. But human cognition doesn't work that way. Once you've seen a solution, it unconsciously influences your design ("inadvertent copying"). Courts recognize this cognitive bias.
     - **Legal Fiction vs. Reality**: The law treats "I didn't look" differently from "I looked but ignored it." The former is a defensible position; the latter is legally indistinguishable from willful infringement.

  ### Why Your Reasoning Feels Unsatisfying
  - **Asymmetric Payoffs**: Decision theory assumes symmetric outcomes. But law creates extreme asymmetry:  
    - *Benefit of viewing code*: Maybe save 20% dev time.  
    - *Cost of being "willful"*: 3x damages, fees, reputational harm.  
    Risk-averse companies optimize for worst-case scenarios.
  - **Rules Override Rationality**: Legal systems aren't pure logic engines. They're adversarial games with prescribed moves. Clean-room design is a winning move under the current rules—even if it feels irrational.

  ### Practical Justification
  For your company, the cost of duplicated effort is a *known, bounded expense*. The cost of a willful infringement ruling is an *existential risk*. Rational actors often pay to reduce tail risks, even when it seems inefficient.

  **In short**: You're not wrong about information theory—but legal strategy operates in a different universe where ignorance isn't bliss; it's armor. The clean room isn't empty ritual; it's evidence manufacturing for a future courtroom battle that may never happen. Smart engineers hate it. Smart lawyers insist on it. Both are rational within their domains.
