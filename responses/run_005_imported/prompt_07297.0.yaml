answer: |-
  Your dinner debate cuts to the heart of a foundational dispute in causation theory. Let's dissect both frameworks using your examples, commit to a position, and declare a winner in your argument. I'll argue that **your friend has the better of the argument regarding the handling of preemption and overdetermination**, and that interventionism is a distinct, superior approach *for scientific and modeling purposes*, though it sacrifices Lewis's reductive ambitions.

  ### 1. **Lewis's Counterfactual Theory & Its Struggles with Preemption**
     - **Core Idea**: Causation is reducible to chains of counterfactual dependence across possible worlds, judged by a similarity metric (e.g., worlds with minor miracles are "closer" than large divergences).
     - **Late Preemption Problem (Suzy/Billy)**:
       - **1973 Analysis**: Fails. The bottle shattering doesn't counterfactually depend on Suzy's throw. If Suzy doesn't throw, Billy breaks the bottle → no dependence.
       - **1986 Quasi-Dependence**: Adds "chains" of dependence. Suzy's throw causes an intermediate event (e.g., her rock in flight), which *would* depend on her throw if Billy weren't present. But defining "intermediate events" is ad hoc.
       - **Influence Account (2000)**: Suzy's throw influences the *manner* and *timing* of the shattering. Billy's throw has "residual influence" (e.g., the bottle breaks a millisecond later if only Billy throws), but Lewis argues this is "too slight" for causation. **Verdict**: Billy's residual influence forces Lewis into subjective judgments about "slightness," which feels arbitrary and unprincipled.

  ### 2. **Interventionist/Structural Equations Approach**
     - **Core Idea**: Causation is defined by what happens under hypothetical *interventions* (idealized manipulations) on variables in a directed acyclic graph (DAG). `Y` is caused by `X` iff intervening to change `X` changes `Y`, holding fixed other variables not causally downstream of `X`.
     - **Formal Representation (Suzy/Billy)**:
       - Variables: `S` (Suzy throws), `B` (Billy throws), `SH` (Shattering).
       - Structural Equations:  
         `SH = S ∨ (B ∧ ¬S)`  
         (Shattering occurs if Suzy throws OR if Billy throws and Suzy doesn't).
       - **Intervention 1**: Set `S = 0` (no throw), hold `B` fixed at actual value (`B=1`).  
         Outcome: `SH = 0 ∨ (1 ∧ 1) = 1` → Bottle shatters.  
         *But*: This tests counterfactual dependence, not causation. Interventionism *adds*:
       - **Intervention 2**: Test if `SH` changes when `S` is manipulated *while holding fixed non-descendants of `S`* (here, `B` is *not* a descendant of `S`, so it's fixed).  
         Actual world: `S=1, B=1, SH=1`.  
         Intervene: `do(S=0)` → `SH = 0 ∨ (1 ∧ 1) = 1`.  
         **Result**: `SH` unchanged → Suzy's throw is **not** a cause? **Wrong!**  
       - **The Fix**: Model *timing*. Add variable `T_SH` (time of shattering):  
         `T_SH = min(T_S, T_B)` (whichever rock arrives first).  
         Now intervene: `do(S=0)` → `T_SH = T_B` (Billy's later time).  
         Since `T_SH` changes, Suzy's throw **is** a cause of the shattering *at its actual time*.
     - **Symmetric Overdetermination (Two Arsonists)**:
       - Variables: `A1`, `A2` (arsonists throw), `F` (fire).  
         Equation: `F = A1 ∨ A2`.  
         Intervene on `A1` (set to 0), hold `A2` fixed (1) → `F=1`.  
         Same for `A2`. **Verdict**: Both are causes (correctly), since each is individually sufficient.

  ### 3. **Key Comparisons & Why Interventionism Wins on Your Examples**
     | **Aspect**               | **Lewis** | **Interventionism** |
     |--------------------------|-----------|---------------------|
     | **Preemption**           | Requires ad hoc "influence" thresholds to exclude Billy. | Cleanly handles with explicit timing variables. |
     | **Overdetermination**    | Struggles to avoid "Billy-like" residual influence. | Straightforward: both are causes. |
     | **Formal Discipline**    | Vague similarity metrics → subjective judgments. | Variables/equations force clarity. |
     | **Circularity**          | Reductive (no causal primitives). | Non-reductive (interventions are causal). |
     | **Ad Hoc Machinery**     | High (quasi-dependence, influence weights). | Low (add variables as needed for context). |

     - **Interventionism as Distinct Theory?**  
       Yes. While it *uses* counterfactuals, it restricts them to *intervention-based* counterfactuals, avoiding Lewis's "anything goes" possible worlds. It treats causation as **model-relative**: `X` causes `Y` only relative to a correctly specified DAG. This is fundamentally different from Lewis's quest for mind-independent facts.
     - **Woodward's Circularity Cost**  
       It costs Lewis-style *reductionism*—but this is a *virtue* for scientific purposes. Defining interventions causally avoids Lewis's arbitrary similarity metrics. Circularity is controlled: interventions are idealized manipulations, not brute causal facts. As Woodward argues, this reflects how science *actually tests* causal claims (e.g., randomized trials).
     - **Preemption/Overdetermination Handling**  
       Interventionism wins decisively. Lewis's revisions are reactive patches; interventionism *builds in* a solution: **model granularity**. If Billy's throw seems causally relevant, add timing/manner variables. This isn't ad hoc—it's how modeling works. Lewis lacks this flexibility.

  ### 4. **The Verdict: Your Friend Wins the Argument**
     - **On preemption/overdetermination**: Interventionism resolves them elegantly with minimal machinery. Lewis's solutions are contrived and unstable.
     - **On theoretical status**: Interventionism isn't "counterfactual theory in disguise." Its intervention-centric focus and model-relativity make it a distinct, superior framework *for scientific applications*.
     - **On circularity**: Woodward's non-reductiveness is a strength. Lewis's reductionism led to decades of fixes for preemption, proving it unworkable for complex cases.

  **Why you should concede**: Your metaphysical concerns (circularity, reductionism) are valid—but your friend's framework *delivers* where Lewis's fails. Interventionism embraces causal primitives to avoid the vagueness of possible worlds. For the examples that stalled your dinner, it provides clear, formal answers. Lewis's theory is a landmark, but for modeling actual causal systems, interventionism is the tool of choice. Your friend’s dismissal was justified.
