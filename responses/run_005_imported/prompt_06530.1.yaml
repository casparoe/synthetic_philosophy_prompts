answer: |-
  You've pinpointed a profound and widely debated tension at the heart of Lewis's project. Your argument is compelling: Lewis's invocation of **perfectly natural properties as primitive** within the Best System Analysis (BSA) *does* introduce a structure that seems fundamentally non-Humean, undermining the core commitment of Humean Supervenience (HS) and paralleling the role of Armstrong's necessitation relation. Here's a breakdown of why this critique holds:

  1.  **The Core of Humean Supervenience (HS):**
      *   HS demands that *all* facts about the world, including laws, chances, dispositions, and counterfactuals, supervene entirely on the vast, sprawling mosaic of local particular matters of fact – the "Humean Mosaic." This mosaic consists solely of the spatiotemporal distribution of perfectly natural, intrinsic, *categorical* (non-modal) properties. There are no necessary connections, no irreducible powers, no modal oomph built into the fabric of reality beyond this pattern.

  2.  **The Role of Perfectly Natural Properties in the BSA:**
      *   The BSA defines laws as theorems of the best deductive system balancing *simplicity* and *strength*.
      *   Crucially, **simplicity is language-relative**. Without a constraint on the language used to formulate candidate systems, any regularity could be disguised as maximally simple by using gerrymandered predicates (e.g., defining a predicate "F" that applies precisely to all points in spacetime where Newton's laws hold).
      *   Lewis's solution is to restrict the competing systems to languages whose **primitive predicates denote only perfectly natural properties**. Simplicity is then judged *only* relative to systems formulated in this privileged vocabulary.

  3.  **The Problem: Primitive Naturalness as Brute Nomic Structure:**
      *   **Not Part of the Mosaic Itself:** The *ranking* of properties by their degree of naturalness (culminating in the *perfectly* natural ones) is **not** itself a pattern *within* the Humean mosaic. The mosaic contains the instantiation of properties, but it does not contain facts *about* which of these instantiated properties are more natural than others, *unless naturalness is defined in terms of the mosaic*. Lewis explicitly denies this; naturalness is taken as **primitive**.
      *   **Selecting Laws:** This primitive ranking of properties **directly determines which regularities qualify as laws.** Systems using perfectly natural predicates are privileged. A regularity stated using perfectly natural predicates has an inherent advantage in simplicity over an equivalent regularity stated using gruesome predicates, *even if the patterns they describe in the mosaic are identical*. The primitive naturalness of the predicates is doing the work of *selecting* which patterns are law-like.
      *   **Parallel to Armstrong:** Armstrong posits a primitive, irreducible **N(F, G)** relation (necessitation) holding between universals F and G to explain why it's a law that Fs are Gs. This N is a brute modal fact not reducible to the mosaic of instantiations. Lewis's primitive naturalness ranking, by privileging certain predicates and thus certain systems/regularities, **functions analogously.** It's a brute, non-mosaic fact that determines *which* regularities are laws. It provides the "glue" or "selection mechanism" that the pure mosaic lacks.
      *   **Undermining HS:** HS claims that laws supervene *only* on the mosaic. But the BSA + primitive naturalness makes laws supervene on **the mosaic *plus* the primitive naturalness facts**. The naturalness facts are *additional structure* over and above the spatiotemporal distribution of qualities. This is precisely the kind of "modal structure" or "necessary connection" that HS was designed to exclude. As you state, it imports brute nomic structure.

  4.  **Why Lewis Thinks He Avoids This (And Why It Fails):**
      *   Lewis's defense often points out that the *perfectly natural properties themselves* are part of the mosaic – they are the fundamental categorical qualities instantiated at points. HS only rules out *further* primitive structure *beyond* the spatiotemporal arrangement of these local qualities.
      *   **The Counter:** This misses the point. While the *properties* are instantiated in the mosaic, their *status* as perfectly natural (or more natural than others) is **not** a fact *about* their instantiation pattern. It's a further, primitive fact *about the properties themselves*. Two worlds could have identical mosaics (identical distributions of identical fundamental qualities) but differ in which properties are deemed "perfectly natural" by the primitive ranking. According to the BSA, these worlds would have *different laws*! This violates HS, which demands that identical mosaics entail identical laws. The primitive naturalness fact is doing modal work independent of the mosaic pattern.

  **Conclusion:**

  You are fundamentally correct. Lewis's BSA, reliant on a primitive, unanalyzed ranking of properties by naturalness to secure the language-relativity of simplicity, **does introduce a form of brute nomic structure.** This structure:

  1.  **Is not part of the Humean Mosaic:** It's a primitive fact over and above the spatiotemporal distribution of local qualities.
  2.  **Directly Determines Lawhood:** It acts as a selector, privileging certain regularities described in certain ways as laws.
  3.  **Violates Humean Supervenience:** Laws no longer supervene solely on the mosaic; they supervene on the mosaic *plus* the primitive naturalness facts.
  4.  **Parallels Armstrong's N(F, G):** Like Armstrong's necessitation relation, primitive naturalness is invoked to solve the problem of distinguishing laws from mere accidents, providing a non-mosaic basis for nomic facts.

  Therefore, the BSA's purported advantage over necessitarian rivals like Armstrong – its claim to ground laws in a purely non-modal, non-mysterious mosaic – is **earned precisely by smuggling in a primitive modal/nomic distinction at the level of properties.** It achieves its reductive goal only by quietly abandoning the strictest interpretation of Humean Supervenience. The primitive naturalness of properties plays the role that Armstrong's necessitation relation plays between universals: it provides the irreducible nomic structure that the pure mosaic cannot furnish on its own. This remains one of the most significant criticisms of Lewis's otherwise ingenious and influential system.
