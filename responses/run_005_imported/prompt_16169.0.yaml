answer: |-
  Here’s a reconstruction of Leibniz’s likely argument against IIT, grounded in his metaphysical principles:

  ### Leibniz’s Core Objection:  
  **Φ tracks *functional unity*, not *metaphysical unity*.** While a high-Φ system appears unified *operationally*, it remains a composite of distinct substances (monads). For Leibniz, perception requires a *simple subject* — a "point-like" entity without parts — to ground the *intrinsic unity* of conscious experience.  

  ### Step-by-Step Argument:  
  1. **The Mill Revisited (Metaphysical Decomposition):**  
     - Leibniz’s mill argument targets *composition itself*, not merely disorganization. Even if the mill’s parts are functionally integrated (high Φ), they remain *multiple entities*. Walking through it, we see parts influencing parts — **never a single subject** experiencing the whole.  
     - **IIT’s Φ quantifies *causal interdependence***, but interdependence ≠ ontological unity. Two gears interlocked are interdependent, yet remain two gears.  

  2. **The Monadological Requirements for Perception:**  
     - **Simplicity Requirement:** Perception must inhere in a simple substance (§17) because composites are aggregates of relations. A conscious "I" cannot be fragmented; it is indivisible.  
     - **Intrinsic Denominations:** Perception is an *intrinsic state* of a monad (§§7, 14). Relations (e.g., causal integration) are *extrinsic* and reducible to monads’ internal states. Φ describes relational structure, not intrinsic perception.  
     - **"Windowlessness" (§7):** Monads are causally isolated; their states unfold from internal principles. Φ’s causal integration is *transitive* (part A → B → C), but monads perceive via pre-established harmony — **no transfer of states occurs**.  

  3. **What Φ *Actually* Integrates (Leibniz’s Alternative):**  
     - Φ measures the *harmony* of monads’ perceptions, not perception itself. A high-Φ system reflects a well-synchronized aggregate of monads, each perceiving its own "small perspective" of the universe.  
     - **Example:** A brain with high Φ is a "well-founded phenomenon" — a mirror of monadic harmony orchestrated by God. But the unity is *ideal* (a pattern in God’s mind), not *real* (a perceiving composite).  

  4. **The Unity Trap:**  
     - IIT claims Φ’s irreducibility supplies unity. Leibniz retorts: **Irreducible complexity ≠ irreducible substance.** A Bach fugue is harmonically irreducible but requires many distinct musicians. Similarly, Φ describes emergent *order*, not a *perceiver*.  

  ### Leibniz’s Verdict on IIT:  
  He would say:  
  > *"Your Φ admirably quantifies the *appearance* of unity in Nature’s machinery — a harmony I myself attributed to aggregates under divine orchestration. But to mistake this functional unity for *perception* is to confuse the map with the territory. Perception belongs only to the unextended, windowless simples: the monads. A camera sensor or a brain, however integrated, remains a theater of parts without an actor."*  

  ### Why He’d Insist Φ ≠ Perception:  
  - **Causal vs. Substantial Unity:** Φ is causal; perception is substantial.  
  - **Relational vs. Intrinsic:** Φ is relational; perception is intrinsic.  
  - **Composite vs. Simple:** High-Φ systems are composite; perceivers must be simple.  

  In essence: **IIT’s integrated system is Leibniz’s mill with better public relations.** It answers *how* parts coordinate, but not *who* experiences the coordination. For Leibniz, consciousness isn’t an output of structure — it’s the input of soul-like simples.
