answer: |-
  Based on Anscombe's rigorous application of the principle of double effect (PDE) and her specific condemnation of Truman, she would almost certainly view "double tap" strikes as **indistinguishable from Truman's actions in moral terms – that is, as murder.** Signature strikes are more complex but likely fail her test in most real-world applications. Here's the breakdown using her framework:

  1.  **The Core of Anscombe's Argument Against Truman:**
      *   **Not About Numbers or Net Outcome:** She dismissed arguments about "saving more lives overall." The moral evil wasn't negated by a supposedly good outcome.
      *   **Intention as the Means:** The critical point was *how* the bombing achieved its aim. Surrender was sought *through* the terror caused by the mass killing of civilians. The civilians' deaths weren't a regrettable side effect of attacking a military target; they *were* the chosen instrument, the *means*, to induce terror and surrender. "You *chose* to kill the innocent as part of your plan."
      *   **Violation of Absolute Prohibition:** Intentionally killing the innocent is absolutely prohibited. Using their deaths as a tool makes this intention explicit and central to the act. Truman's decision, for Anscombe, was a direct choice to murder civilians as a tactic.

  2.  **Applying to "Double Tap" Strikes:**
      *   **The Mechanism:** The *entire purpose* of the second strike is to kill those rushing to aid the wounded from the first strike. These are typically civilians, first responders, family members – non-combatants engaged in an act of mercy.
      *   **Intention as the Means:** Just like Truman used civilian deaths *as the means* to induce terror and surrender, the double tap uses the killing of rescuers *as the means* to achieve a tactical goal: maximizing enemy casualties by exploiting predictable humanitarian impulses, preventing medical aid, and instilling fear that deters future rescue attempts.
      *   **Clear Intention:** The deaths of the rescuers aren't a foreseen but unintended side effect of hitting another target. Their presence and their act of rescuing *is the trigger* and *the target*. Their killing *is the mechanism* by which the tactical goal (suppressing rescue, increasing enemy attrition) is achieved. This makes their deaths *intended as a means*.
      *   **Anscombe's Verdict:** This would be unequivocal murder by her lights. It directly, intentionally targets non-combatants using their compassion as a weapon against them. The PDE defense fails because the good effect (killing more militants? tactical advantage?) is achieved *through* the bad effect (killing rescuers). The bad effect is not merely permitted; it's instrumentally necessary.

  3.  **Applying to "Signature Strikes":**
      *   **The Challenge:** The stated intent is targeting *combatants* based on behavioral patterns (e.g., groups of military-aged males in an insurgent area, observed "suspicious" activities). The *intended* target, in theory, is a combatant.
      *   **Anscombe's Scrutiny & Likely Concerns:**
          *   **Foreseen vs. Intended Civilian Deaths:** Anscombe would demand extreme rigor in distinguishing *who* is actually being targeted and *how certain* the intelligence is. If the "signature" is vague (e.g., "groups of MAMs"), the likelihood of misidentification and thus *foreseeable* civilian death is very high. The key question is: **Is the death of non-combatants merely a *foreseen possibility* (potentially covered by PDE if proportionality is met), or is it *effectively accepted or even relied upon* as part of the method?**
          *   **The "Means" Problem:** If the behavioral pattern is so broad or the intelligence so unreliable that striking inevitably involves knowingly killing significant numbers of non-combatants *as the price of doing business* to hit *some* militants, Anscombe would likely argue the tactic itself involves *intending* the deaths of non-combatants *as a necessary component of the method*. The tactic accepts that killing innocents is a standard, predictable cost – meaning their deaths become part of the operational calculus, blurring into being a means.
          *   **Proportionality Under Duress:** While PDE requires proportionality (good effect outweighs bad), Anscombe would be deeply skeptical of proportionality calculations where the "bad" includes the *foreseen* but supposedly "unintended" deaths of numerous innocents, especially when the "good" is often the elimination of lower-level operatives rather than an imminent, catastrophic threat. She would see this as a utilitarian calculation overriding absolute prohibition.
          *   **Lack of Discernment:** Signature strikes often lack the individual identification and certainty that PDE traditionally requires to justify foreseen collateral damage. Anscombe would likely argue that the inherent lack of discrimination in many signature strikes makes the death of innocents *not* merely "side effect" but an *integral and accepted risk* that borders on intentionality within the chosen tactic.
      *   **Anscombe's Probable Verdict:** While a *perfectly executed* signature strike against a *genuinely identified and unambiguous* combatant pattern *might* theoretically pass PDE (if collateral damage was truly unintended, minimized, and proportional), Anscombe would be highly suspicious. In practice, given the documented history of unreliable intelligence, broad signatures, and high civilian toll, she would likely conclude that most signature strikes **do** involve effectively intending or knowingly accepting the deaths of non-combatants as a core part of the operational method, thus failing her test and constituting murder. They share the moral hazard of Truman's act: using the terror and death of the innocent as a tool of policy, even if the *primary* target is nominally military.

  **Conclusion:**

  *   **Double Taps:** Anscombe would condemn these absolutely as **murder**, structurally and intentionally identical to Truman's bombing of cities. The rescuers are *intentionally* killed *as the means* to a tactical end.
  *   **Signature Strikes:** Anscombe would be **highly critical and likely condemnatory** in most real-world cases. While theoretically possible under PDE, the inherent ambiguity, high risk of misidentification, and predictable civilian casualties mean the tactic often involves *accepting or even relying upon* the deaths of non-combatants as part of its execution. This moves it dangerously close to, or directly into, the realm of intending evil as a means, failing her stringent test. She would see them as embodying the same moral compromise as Truman's decision: sacrificing the absolute prohibition against intentional killing of the innocent for perceived strategic or tactical advantage, wrapped in justifications about "patterns" and "overall benefit" that she explicitly rejected.

  Your instinct to map her argument directly is sound. Her core point wasn't just about scale (Hiroshima) but about the *intentional structure* of the act: using the killing of innocents as your chosen weapon. Both double taps and the common practice of signature strikes fit this structure far more readily than they fit the strict requirements of double effect she demanded.
