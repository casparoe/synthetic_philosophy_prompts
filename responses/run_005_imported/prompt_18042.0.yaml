  **Move 1 (Marcus: Core argument for surrogate goals): +1**  
  Marcus correctly identifies the leverage mechanism: threats work by exploiting differential responses. If an attacker is indifferent between targeting the decoy or real goal due to identical responses, they gain no advantage by choosing the latter. This aligns with game-theoretic principles of making threats "cheap" to resist. The score isn't +2 because it implicitly assumes the decoy is *actually* lower-cost to defend—a point Claire later challenges.

  **Move 2 (Claire: Security-through-obscurity objection): -1**  
  Claire misapplies the security-through-obscurity analogy. The surrogate strategy doesn’t rely on hiding information; it explicitly requires *transparent* commitment to identical responses. A capable adversary recognizing the decoy’s lower intrinsic value is irrelevant if the defender’s response protocol renders targeting the real goal equally unprofitable. Her objection fails because it conflates value asymmetry with exploitable leverage.

  **Move 3 (Marcus: Transparency defense with analogy): +2**  
  Marcus’s bug-bounty analogy perfectly refutes Claire’s objection. When identical payouts are guaranteed for attacking either target, rational attackers become indifferent. Transparency strengthens the strategy by making the commitment common knowledge, eliminating any incentive to probe further. This directly addresses Claire’s concern and demonstrates why value recognition doesn’t undermine the mechanism.

  **Move 4 (Claire: Binding commitment challenge): +2**  
  Claire correctly identifies the crux: the strategy hinges on an *irrevocable* commitment to treat threats identically. If the threatener doubts the defender’s resolve to sacrifice real values (e.g., believing they’ll defect when the decoy/reality distinction is tested), they rationally target the real goal to exploit perceived weakness. This exposes the strategy’s dependency on solving the commitment problem itself, which Marcus’s initial framing glosses over.

  **Overlooked Consideration: The Credibility Gap**  
  Both debaters underemphasize the *feasibility* of binding commitments in acausal settings. For surrogate goals to work, the defender must not only precommit but also *convince* potential threateners that this commitment is technologically or logically enforceable—e.g., via unalterable code, cryptographic proofs, or embedded decision theory. Without this, Claire’s "testing" concern prevails, as rational threateners will always prefer targeting the real goal unless the commitment’s credibility approaches certainty. Marcus’s transparency argument assumes credibility is given; Claire’s objection reveals it as the core unsolved problem. The strategy’s viability thus depends less on game theory and more on the implementability of robust precommitment mechanisms against superintelligent counter-strategies.
