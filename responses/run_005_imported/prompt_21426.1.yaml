  Also, the memo must be accessible to non-experts, avoid jargon, and present options clearly. Including a table comparing approaches helps visualize trade-offs. Emphasizing data collection during the pilot ensures future decisions are evidence-based. Cost is a factor, so splitting funds might be practical. 

