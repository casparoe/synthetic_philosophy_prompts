answer: |-
  Here’s a defense of horn (b), structured to meet your requirements: it preserves truth-conditional semantics for indicative conditionals while weakening Adams’ Thesis, addresses the severity of the embedding problem for non-cognitivism, and provides a principled rationale for restricting the Thesis.

  ---

  ### **Defending Truth-Conditional Semantics: Why Weakening Adams’ Thesis is Preferable**

  #### **1. Lewis’s Triviality and the Dilemma**
  Lewis’s triviality results demonstrate that combining **universal truth-conditional semantics** with **Adams’ Thesis** (i.e., \( P(A \to B) = P(B|A) \) for all probability functions) leads to absurdity (e.g., \( P(B|A) = P(B) \)). To avoid this, two paths exist:
  - **(a) Non-cognitivism (Adams/Edgington):** Deny that conditionals have truth values.  
  - **(b) Truth-conditional revision (Stalnaker/Jackson):** Keep truth conditions but restrict Adams’ Thesis.  

  I argue that (b) is superior because (a) fails to account for the *logic* of ordinary language, while (b) offers a recoverable retreat.

  ---

  #### **2. The Embedding Problem: A Fatal Flaw for Non-Cognitivism**
  The non-cognitivist view treats "If A, B" as a conditional assertion (true iff B holds when A is true). However, this cannot coherently explain embeddings:

  - **Negation:**  
    - Consider: *"It is not the case that if it rains, the match will be canceled."*  
    - Non-cognitivism: If "If A, B" lacks truth value, negation has nothing to operate on. What does "not asserting B under A" mean? Is it asserting \(\neg B\) under A? Or refusing to assert? Neither captures the intuitive meaning: that B *might not* follow from A.  
    - **Cost:** Without truth conditions, negation reduces to meta-linguistic refusal ("I won’t assert that if A, B"), sabotaging logical inference (e.g., \(\neg(A \to B)\) implying \(A \land \neg B\) in some contexts).

  - **Disjunction:**  
    - Example: *"Either if it rains, the match will be canceled, or the forecast is wrong."*  
    - Non-cognitivism: Disjunctions require truth-apt components. If "if A, B" isn’t truth-apt, the disjunction lacks a truth value. But speakers confidently assign probabilities to such statements (e.g., "I’m 70% sure either [if rain, cancel] or [forecast wrong]").

  - **Nested Conditionals:**  
    - Example: *"If the vase broke if dropped, then it was fragile."*  
    - Non-cognitivism: The antecedent "if dropped, broke" cannot be evaluated for truth, so the embedding conditional has no intelligible truth conditions. Yet such statements are common and inferentially productive.

  **Why this isn’t cosmetic:** These embeddings pervade rational discourse (law, science, daily planning). Non-cognitivism either (i) *ad hoc* redefines connectives (e.g., Edgington’s "special operators") or (ii) denies embeddings exist (contrary to evidence). This fractures the unity of logic, forcing conditionals into a parallel, non-compositional system. Truth-conditional semantics avoids this by grounding embeddings in standard propositional logic.

  ---

  #### **3. A Principled Rationale for Weakening Adams’ Thesis**
  Lewis’s proof relies on **Adams’ Thesis holding under conditionalization**. Specifically, it requires:
  > \( P(A \to B \mid E) = P(B \mid A \land E) \) for all \( E \) where \( P(E) > 0 \).

  Weakening the Thesis to apply **only to an agent’s current probability function** (not under arbitrary conditionalization) blocks triviality *precisely where the proof demands it*. This is principled, not *ad hoc*, for two reasons:

  - **Epistemic Dynamics:**  
    Adams’ Thesis plausibly governs *current* conditional belief (e.g., my *present* credence in "if A, B" equals \( P(B|A) \)). But when I learn new evidence \( E \), my belief in \( A \to B \) *should not* be required to equal \( P(B|A \land E) \). Why?  
    - **Rationale:** Conditionals express *suppositional commitments* relative to current knowledge. Learning \( E \) may reveal that \( A \) is no longer a live possibility (changing \( A \to B \)’s truth conditions under Stalnaker’s semantics), or that \( A \)’s relationship to \( B \) is mediated by \( E \). Forcing \( P(A \to B \mid E) = P(B \mid A \land E) \) ignores how *learning E alters the interpretation of \( A \to B \)*.  
    - **Analogy:** Belief updating often changes semantic presuppositions (e.g., learning "E" may shift the domain of quantification). Conditionals are similarly context-sensitive.

  - **Jackson’s Robustness:**  
    Jackson locates the link to conditional probability in pragmatics: we assert "if A, B" only if \( P(B|A) \) is *robust* under learning \( \neg A \) (i.e., \( P(B|A) \approx P(B \mid A \land \neg A) \)).  
    - **Principled Failure:** Adams’ Thesis fails precisely when robustness fails—when \( P(B|A) \) is unstable under conditionalization on \( \neg A \). This aligns with Lewis’s proof, which exploits cases where \( P(B|A) \) changes dramatically under partition (e.g., learning \( \neg A \) reveals \( B \)’s dependence on \( A \)).

  ---

  #### **4. Why Truth-Conditional Semantics Wins Overall**
  - **Empirical Adequacy:**  
    Truth-conditional semantics (e.g., Stalnaker’s nearest-world account) handles embeddings compositionally: \( \neg(A \to B) \) is true iff \( A \to B \) is false; \( (A \to B) \lor C \) is true iff either \( A \to B \) or \( C \) holds. This mirrors intuitive judgments (e.g., "not [if A, B]" often implies \( A \land \neg B \) in context).
    
  - **Recovering Adams’ Intuitions:**  
    Weakening the Thesis preserves its core insight *where it matters*:  
    - \( P(A \to B) \approx P(B|A) \) *holds* for simple conditionals under normal epistemic conditions (Stalnaker’s "Theorem 1").  
    - Jackson’s robustness explains *why* we *feel* \( P(\text{if }A, B) = P(B|A) \): it’s a norm of assertion, not semantics.

  - **Cost-Benefit Analysis:**  
    - *Non-cognitivism’s cost:* Radical departure from compositional semantics, unable to systematize logic.  
    - *Truth-conditional cost:* Adams’ Thesis fails under conditionalization. But this is a localized, principled retreat—one that respects how learning *updates* the meaning of conditionals.

  ---

  ### **Conclusion: Paying the Right Bill**
  Lewis’s triviality forces a choice: sacrifice truth conditions or sacrifice Adams’ Thesis in full generality. Non-cognitivism dodges triviality but imposes an unsustainable cost: the inability to explain embedded conditionals, fracturing logic itself. By contrast, weakening Adams’ Thesis—confining it to current credences or relocating it to pragmatics—blocks Lewis’s proof *where it must be blocked*: at the requirement that conditional probability survives arbitrary conditionalization. This respects conditionals’ role in dynamic reasoning while preserving their place in a unified, truth-conditional semantics. The embedding problem shows that (a) doesn’t just "pay a bill"—it undermines the currency of rational discourse. Horn (b) offers solvency.
