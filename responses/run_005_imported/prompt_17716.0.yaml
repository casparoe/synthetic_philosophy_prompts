  Here’s a toast that honors the complexity of your relationship, celebrates her joy, and subtly addresses the unspoken truth—without overshadowing the wedding or requiring explanation for unaware guests. It focuses on **loyalty, enduring promises, and the different ways love shows up**:

  ---

  **(Raise your glass, make eye contact with your sister, warm smile)**  

  "To my sister, [Sister's Name], and her wonderful partner, [Partner's Name]. What an absolute joy it is to stand here today, celebrating your love.  

  [Sister's Name], you’ve always had this incredible spark. Ever since we were kids, you’ve been the one with the bold ideas, the contagious laughter, and a heart so deep it could hold an ocean. You feel things fiercely – the joy, the passion, the love you have for [Partner's Name] radiating out of you right now? That’s pure, unfiltered *you*. It’s breathtaking to witness.  

  Being your brother/sister has been one of the greatest privileges of my life. It’s taught me more about loyalty and love than I ever thought possible. Because real love isn’t just about celebrating the sunshine moments like today – though this sunshine is glorious! **(Gentle smile)**  

  It’s also about knowing someone’s deepest truth, even when the clouds roll in. It’s about holding fast to promises made in clear moments, promises whispered from the heart about what *really* matters. Sometimes, loving someone fiercely means having the strength to hold the line they asked you to hold, even when it’s the hardest thing you’ve ever done. Even when the person you love most in the world looks you in the eye and can’t understand *why*.  

  That kind of loyalty… it isn’t about choosing one version of a person over another. It’s about seeing the *whole* person, through every season of the heart. It’s about believing, fiercely and unwaveringly, in the core of who they are – the core that shines brightest on days like today. The core that knew, even in stillness, what it needed to find its way back to this light.  

  Watching you now, [Sister's Name], so radiant, so deeply happy, so profoundly *yourself* with [Partner's Name]… it fills me with awe. Your resilience, your capacity for joy, your open heart – they are a testament to your incredible spirit. And [Partner's Name], seeing how you cherish that spirit, how you build a world where it can thrive… it’s everything. You love her wholly, beautifully, exactly as she deserves.  

  So today, we celebrate not just your love, but your journey. The strength it took to get here. The promises kept – big and small, spoken and silent. The unwavering belief in each other, and in brighter days.  

  To [Sister's Name] and [Partner's Name]: May your life together be filled with endless sunshine, laughter that echoes through your home, and a love that grows deeper and more resilient with every passing season. May you always be each other’s safe harbor and greatest adventure.  

  Raise your glasses, everyone! To the whole, magnificent journey, and to a future as bright as the love shining here today. Cheers!"

  ---

  **Why this works:**

  1.  **Centers Celebration:** It starts and ends with pure joy for the couple and their love.
  2.  **Acknowledges Her Strength & Depth:** Praises her intensity, resilience, and capacity for joy – traits true in both stability and mania.
  3.  **Addresses Loyalty & Hard Choices:** The core paragraph ("Being your brother/sister...") directly tackles the theme without specifics. "Knowing someone's deepest truth," "holding fast to promises made in clear moments," "hold the line they asked you to hold," "even when the person you love... can’t understand why" – these lines resonate powerfully with your shared history, while remaining abstract enough for others to interpret as general sibling devotion or overcoming past hardships.
  4.  **Unifies Her Identity:** "It isn’t about choosing one version... It’s about seeing the *whole* person, through every season of the heart." This explicitly rejects the idea that one state was less "her" and affirms your love for her entirety. "The core that shines brightest... The core that knew... what it needed to find its way back" honors her stable self's foresight.
  5.  **Focuses on the Present Joy:** Quickly pivots back to her current happiness and the partner's love, reinforcing the celebration.
  6.  **Universal Enough:** Guests hear a toast about deep sibling love, loyalty through tough times, resilience, and joyful commitment. Only you and your sister will fully grasp the profound, specific weight behind "holding the line" and "promises made in clear moments."
  7.  **Tone:** Warm, loving, proud, slightly reverent about her journey, ultimately uplifting and focused on the future.
  8.  **Resolves the "Why":** It answers the underlying question implicitly: Because true love means honoring the deepest, enduring self and the promises *that* self makes, even when the present self is lost. It's an act of faith in their return.

  **Delivery Tip:** Speak slowly and with deep sincerity, especially during the "loyalty" paragraph. Make strong eye contact with your sister there. Let your genuine emotion for her and her happiness show. This toast carries weight *because* of your history; your love and relief will convey the unspoken depth. Keep the overall energy positive and forward-looking.

  This toast honors the complexity, celebrates the triumph, and speaks the truth to your sister's heart, all while letting the wedding day shine.
