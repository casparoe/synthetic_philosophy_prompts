answer: |-
  Here’s a set of 10 targeted questions designed to press the core issues while respecting your guest’s expertise. Each "core" question includes a likely-rebuttal-specific follow-up to prevent evasion. The closing question addresses real-world implications.

  ### Core Questions & Tailored Follow-Ups
  1. **Reference Class Direct Challenge**:  
     You’ve called the reference-class objection a "red herring." But if we take seriously that the Doomsday Argument’s conclusion hinges entirely on how we define the reference class, can you specify *exactly* which properties define the "human" class for SSA? Why is "species membership" privileged over, say, "observers in my epistemic state" or "beings capable of running this inference"?  
     *→ Likely rebuttal: She argues for biological/cognitive traits.*  
     **Follow-up**: If the defining trait is "capable of Bayesian reasoning," doesn’t that risk a circular bootstrapping problem? After all, we’re *using* that capacity to justify the class that validates the argument.  

  2. **SSA vs. SIA & the Presumptuous Philosopher (PP)**:  
     You argue SIA leads to the PP problem (e.g., accepting a vast universe on slim evidence). But isn’t this a false dilemma? Couldn’t one reject SSA *without* fully embracing SIA? For instance, by denying that *mere possibilities* (like unobserved universes) generate evidential weight without causal contact?  
     *→ Likely rebuttal: She insists SIA is the only coherent alternative to SSA.*  
     **Follow-up**: If PP is truly worse than doomsday, why do many SIA proponents (e.g., Nick Bostrom in later work) treat PP as a puzzle to be solved, not a reductio? Doesn’t that suggest PP is a *manageable* cost, not a dealbreaker?  

  3. **Birth Rank vs. Actual X-Risks (Your Personal Concern)**:  
     How does my birth rank *causally* or *lawfully* constrain future pandemics/nuclear wars? If it’s purely a statistical artifact of reference-class carving, why should it override concrete evidence about risk mitigation (e.g., AI alignment progress)?  
     *→ Likely rebuttal: She frames it as a universal Bayesian update, like the urn in Bostrom’s original thought experiment.*  
     **Follow-up**: But in the urn case, the *process* (drawing balls randomly) justifies the likelihood model. Where’s the equivalent physical process for human birth order and asteroids? If there isn’t one, isn’t this conflating *mathematical representation* with *actual evidence*?  

  ### Additional Depth Questions
  4. **Falsifiability**: If we observed humanity thriving in 3000 AD, would that falsify the Doomsday Argument, or would advocates just recalibrate the reference class/SSA model?  
  5. **Anthropic Shadows**: How does your view handle scenarios like Hanson’s "anthropic shadow" — where early observers *wouldn’t exist* if past catastrophes exceeded a threshold? Doesn’t this break the simple birth-rank model?  
  6. **SSA’s Empirical Track Record**: Has SSA ever successfully predicted a non-anthropic phenomenon? If it’s only validated in thought experiments, why trust it for existential risk?  
  7. **Multiverse & Simulation Hypotheses**: If we’re in a multiverse or simulation, wouldn’t SSA imply we should *expect* doomsday to be *later* (since most observers are in high-population branches)?  

  ### Closing Practicality Question
  8. **Real-World Impact**: Even if we accept the Doomsday Argument, should it meaningfully shift x-risk priorities? For instance, would you divert funds from asteroid detection to cryonics based on birth rank? Or is this primarily an insight about epistemology, not policy?  

  ### Why This Works:
  - **Forces specificity** on reference classes (Q1) and causal links (Q3).  
  - **Tests the SSA/SIA trade-off** (Q2) without letting PP dominate the discussion.  
  - **Follow-ups target predictable rebuttals** by exposing circularity (Q1-FU), cost-benefit asymmetry (Q2-FU), and physical grounding (Q3-FU).  
  - **Closes with stakes** (Q8), forcing her to address whether this moves the needle beyond academic debate.  

  **Delivery Tip**: Frame Q1/Q3 as "help me understand" rather than "gotcha." E.g., *"I’m struggling to see how birth rank connects to nukes — can you walk us through that mechanism?"* This makes pushback feel collaborative.
