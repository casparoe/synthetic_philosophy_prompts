  First, I need to recall the key arguments. Michael Walzer's "Just and Unjust Wars" argues for the moral equality of combatants. He says soldiers on both sides have the same rights and duties in combat, regardless of the war's justice. The idea is that soldiers are coerced by the state, lack information, and are bound by professional ethics. This view treats war as a mutual enterprise where combatants are morally symmetrical.

  On the other side, revisionist philosophers like Jeff McMahan challenge this. They argue that jus ad bellum (justice of going to war) affects individual soldiers. If a war is unjust, soldiers fighting for that cause are like aggressors and don't have the right to kill. Only soldiers in a just war can claim self-defense. McMahan emphasizes individual moral responsibility, separating soldiers from their state's decisions.

  The user's deeper need is to resolve the tension between these views. They see merit in both: it's impractical to expect soldiers to judge the war's morality, but it feels wrong to equate aggressors with defenders. They want a nuanced answer that doesn't cop out. So, I need to address both the philosophical principles and practical realities.

  I should structure the essay to present both arguments fairly, then propose a synthesis. Walzer's point about the separation of jus ad bellum and jus in bello is crucial for maintaining war conventions. Without it, soldiers might not follow rules, leading to worse atrocities. But McMahan's view highlights moral accountability; blindly following orders isn't a free pass.

  A possible resolution is conditional moral equality. Combatants are equal only if they fight justly (jus in bello) and lack reasonable access to the war's unjust nature. This accounts for conscripts or misinformed soldiers versus volunteers in wars of aggression. Also, military necessity and reciprocity play roles. If soldiers adhere to rules, they retain moral standing, but those in clear unjust wars without justification bear more blame.

  The user mentioned the 19-year-old conscript. That's key. Factors like voluntariness, knowledge, and alternatives matter. A volunteer in a clear war of aggression has more responsibility than a conscript in a propagandized state. The essay should differentiate based on these factors.

  Finally, the conclusion should commit to a stance. Maybe: moral equality holds in combat under jus in bello compliance, but soldiers in unjust wars still share some moral burden proportional to their role and awareness. However, blame primarily lies with leaders. The answer isn't binary but contextual, depending on the soldier's circumstances and the war's nature.
answer: |-
  ## The Moral Maze: Are Soldiers Truly Equal When Wars Are Unjust?

  Your argument with your roommate taps into one of the most profound and contentious debates in modern just war theory: the "moral equality of combatants" (MEC). This isn't just legal nitpicking; it cuts to the heart of individual responsibility within the colossal, often terrifying, machinery of war. Philosophers like Michael Walzer defend MEC, while "revisionists" like Jeff McMahan launch powerful critiques. Let's dissect the strongest arguments on both sides before forging a path towards a committed conclusion.

  ### The Case for Moral Equality: Walzer's Symmetry

  Michael Walzer, in his landmark *Just and Unjust Wars*, champions the MEC doctrine. His arguments rest on several pillars:

  1.  **The Separation of *Jus ad Bellum* and *Jus in Bello*:** Walzer insists these two branches of just war theory must remain distinct. *Jus ad bellum* (justice *of* going to war) concerns states and leaders. *Jus in bello* (justice *in* war) governs the conduct *within* war. Soldiers, he argues, are primarily agents of *jus in bello*. Their moral task is to fight *within* the rules (e.g., distinguishing combatants, minimizing civilian harm), regardless of whether their state's cause is just (*jus ad bellum*). Holding soldiers responsible for their state's decision to go to war imposes an impossible burden.
  2.  **The Coercion and Epistemic Limits of Soldiers:** Soldiers operate under immense coercion – legal obligation (conscription), intense social pressure, severe punishment for disobedience, and the fog of war. They lack the information, perspective, and often the freedom to make an independent, informed judgment about the *overall* justice of the war. Expecting a 19-year-old conscript to accurately assess complex geopolitical justifications before defending their comrades is unrealistic and unfair.
  3.  **War as a Mutual Enterprise:** Walzer conceptualizes war as a realm governed by its own tragic logic. Once war begins, soldiers on both sides enter a shared, coercive space. They become threats to each other *simply by virtue of their role*. The act of fighting, when done within the rules, is morally symmetrical. The defender has a right to kill the unjust aggressor to stop the invasion. But *the aggressor soldier*, acting under orders and posing a lethal threat, also has a right to kill the defender *in self-defense* or to achieve their military objective. Denying this, Walzer argues, dehumanizes the aggressor soldier and makes reciprocity in applying the rules impossible.
  4.  **Practical Necessity for Restraint:** MEC provides the crucial foundation for the laws of war (International Humanitarian Law - IHL). If soldiers on the unjust side were seen as inherently "criminal" aggressors with *no* right to fight, why would their opponents (or even they themselves) feel bound by rules protecting combatants? Why not simply slaughter them? MEC fosters the mutual restraint essential to limiting war's horrors by giving all combatants a stake in upholding the rules.

  **The Core of Walzer's MEC:** Combatants are morally permitted to kill enemy combatants, and enemy combatants are morally permitted to kill them, provided both adhere to *jus in bello* rules. The justice of the overall war (*jus ad bellum*) does not negate this battlefield symmetry.

  ### The Revisionist Challenge: McMahan's Asymmetry

  Jeff McMahan and other revisionists launch a fundamental assault on MEC, arguing it is morally incoherent. Their arguments center on individual moral liability:

  1.  **The Primacy of *Jus ad Bellum* for Liability:** Revisionists argue that an individual's right to kill hinges directly on the justness of their cause. If State A unjustly invades State B:
      *   **Soldiers of State B (Defenders):** They act in legitimate self-defense (individual or collective) against an unjust threat. They possess a right to kill the invading soldiers to protect themselves and their community. Their killing is morally *justified*.
      *   **Soldiers of State A (Aggressors):** They are participating in an unjust act of aggression. They pose an *unjust threat* to the defenders. Therefore, they *lack* the moral right to kill the defenders. Killing a defender is not self-defense; it's perpetuating the aggression. It's akin to a mugger shooting a victim who fights back – the victim has a right to resist, the mugger does not have a right to kill the resisting victim.
  2.  **Rejecting the Separation Doctrine:** Revisionists argue that *jus ad bellum* fundamentally shapes *jus in bello*. The moral permissions and prohibitions *within* war flow from the justice of the war itself. Soldiers fighting for an unjust cause cannot "cleanse" their actions simply by following the rules of engagement while pursuing an inherently wrongful objective. Following the rules while invading a peaceful neighbor doesn't make the invasion morally permissible.
  3.  **Distinguishing Role from Responsibility:** While acknowledging coercion and epistemic limits, revisionists argue these factors *mitigate* responsibility but do not *eliminate* it. Soldiers retain moral agency. Voluntarily joining a military known for aggressive wars, or failing to resist patently illegal orders (like invading a sovereign nation without UN mandate or clear self-defense justification), implies a degree of culpability. They are not merely automatons. The "fog of war" argument weakens significantly for wars of blatant aggression where the injustice is clear (e.g., Nazi invasion of Poland, Iraq's invasion of Kuwait).
  4.  **The "Nuremberg" Principle:** Revisionists point to the Nuremberg Trials, which established that "following orders" is not an absolute defense against charges of crimes against peace (waging aggressive war). While primarily aimed at leaders, the principle implies a recognition that participating in manifestly unjust wars carries moral (and potentially legal) weight for individuals.

  **The Core of McMahan's Asymmetry:** Only combatants fighting in a just war (*jus ad bellum*) possess the moral right to kill enemy combatants. Combatants fighting for an unjust cause lack this right; their killing acts are morally *unjustified*, even if they strictly adhere to *jus in bello* rules. Moral equality on the battlefield is a myth.

  ### Navigating the Maze: Towards a Conditional Synthesis

  Both positions offer compelling insights but also face significant challenges. Walzer's MEC risks excusing participation in manifest evil by focusing solely on conduct. McMahan's asymmetry risks imposing an impossibly high standard of geopolitical judgment on individual soldiers and potentially undermining the practical restraints of IHL.

  The most defensible position lies in a **conditional rejection of strict moral equality**, recognizing a **spectrum of responsibility** heavily dependent on context:

  1.  **Rejecting *Strict* Moral Equality:** McMahan is fundamentally correct on the core moral principle: **An unjust aggressor does not possess the same moral right to kill as a just defender.** The analogy to the mugger and the defender holds. The act of killing in an unjust war is, *prima facie*, morally wrongful because it supports an unjust end.
  2.  **Conditional Mitigation of Culpability:** However, Walzer's insights about coercion, epistemic limits, and the structure of warfare are crucial for assessing *individual blameworthiness*:
      *   **Degree of Voluntariness:** A conscript forced into service under threat of imprisonment or death bears significantly less *personal* moral blame than a volunteer who enthusiastically joins a military known for aggressive wars.
      *   **Clarity of the Injustice:** Culpability increases dramatically when the war's injustice is manifestly obvious to a reasonable person (e.g., an unprovoked invasion of a peaceful neighbor). It decreases when the justification is complex, clouded by propaganda, or genuinely debated (e.g., interventions based on contested intelligence).
      *   **Access to Alternatives:** What were the realistic options? Desertion (often punishable by death)? Conscientious objection (which may not exist or be recognized)? Active resistance (extremely dangerous)? The genuine lack of safe, meaningful alternatives mitigates personal responsibility.
      *   **Adherence to *Jus in Bello*:** While not absolving the *jus ad bellum* wrong, fighting within the rules significantly reduces the *additional* moral wrong inflicted. A soldier in an unjust war who scrupulously avoids civilians and treats POWs humanely is morally distinguishable from one who commits war crimes. Walzer is right that upholding *jus in bello* retains crucial moral value even in an unjust war.
  3.  **The Primacy of Leadership Blame:** Both sides agree that the lion's share of responsibility rests with political leaders and high commanders who initiate and control unjust wars. They possess the information, authority, and freedom of choice that frontline soldiers lack. They are the primary authors of the injustice.
  4.  **The Pragmatic Value of Functional Symmetry in IHL:** For the practical functioning of international law *during* conflict, the *legal* equality of combatants (as long as they follow IHL) remains essential. It provides clear, reciprocal rules that all parties have an incentive to follow, maximizing protection for combatants *and* civilians. This is a necessary legal fiction that serves a vital humanitarian purpose, even if it doesn't perfectly mirror underlying moral asymmetry.

  ### The Committed Answer

  Therefore, **soldiers fighting for an unjust cause do not possess the same moral right to kill enemy combatants as soldiers fighting in a just defense. They are participating in a collective moral wrong.** However, their *individual moral culpability* is not absolute and exists on a spectrum. It is significantly mitigated, often to the point of being minimal or even negligible, by factors like conscription, pervasive state propaganda, genuine lack of access to truthful information, the inherent chaos and coercion of war, and the absence of safe alternatives. Their culpability *increases* with voluntariness, the blatant obviousness of the war's injustice, and the availability of meaningful choices to resist. Crucially, adherence to the rules of combat (*jus in bello*) remains a significant moral good that distinguishes them from war criminals, even within an unjust war.

  **In essence: The 19-year-old conscript forced at gunpoint to fight in a war based on lies his government told him, who fights without targeting civilians, bears minimal *personal* moral blame for killing enemy soldiers. He was tragically used as an instrument of a larger wrong. The volunteer soldier who freely joins a military invading a peaceful neighbor for territorial gain, knowing the facts, bears substantial moral culpability for his killing acts, even if he follows the rules of engagement.** Moral equality on the battlefield is a legal necessity but a moral illusion. The true moral weight falls asymmetrically, heavily on leaders, and conditionally on soldiers based on their knowledge, freedom, and the clarity of the injustice they serve.
