answer: |-
  ## The Weight of the Crown: Aquinas & Salisbury on Tyrannicide

  **Setting:** A scriptorium in Paris, late 13th century. Parchment and quills lie scattered. Thomas Aquinas, massive and deliberate, faces John of Salisbury, leaner and intense.

  **John of Salisbury:** Brother Thomas, your *Summa* delves deeply into law and governance. Yet, on the question of removing a tyrant, your words seem... restrained. The *Policraticus* is clear: the tyrant is a public enemy, a plague upon the body politic. To suffer him is to betray the common good. Surely, the sword of justice, even wielded by a private hand, is justified?

  **Thomas Aquinas:** Master John, your passion for justice resonates. Yet, restraint is born of prudence and respect for the order God has established. A ruler, however flawed, occupies an office of divine institution. Removal cannot be an act of private passion, lest we descend into anarchy. The *public* authority, vested in the community or its representatives, must act. My caution is for the stability of the *res publica* itself.

  **John:** Stability under a tyrant is no stability at all! It is slow death. But let us test your prudence with cases. Consider **Grimwald:** a base soldier who murdered the true king, forged documents of succession, and seized the throne by naked force and fraud. He holds not a shred of legitimate title. His every edict is rooted in crime. Does your "public authority" requirement bind the hands of the oppressed here? Must they wait for a magisterial decree while he bleeds the realm dry?

  **Thomas:** Grimwald is indeed a usurper, *tyrannus absque titulo* – a tyrant without title. His authority is fundamentally illegitimate, a violation of the natural and divine order. In such a case, *any* authority that acts for the common good – be it nobles, magistrates, or even the people collectively rising – acts justly in deposing him. They *become* the public authority in that vacuum of legitimacy. Private individuals may *assist* such a just uprising, but the *act* of deposition must retain a public character, an assertion of the community's right against the usurper.

  **John:** So far, we agree. The sword against the usurper is clean, almost holy. But what of **King Alaric?** He inherited his crown lawfully, with the blessing of Church and peers. For years, he ruled justly. But now... now he taxes into starvation, imprisons without cause, delights in cruelty, and plunders the Church. He is *tyrannus in regimine* – a tyrant in exercise. Yet, his *title* remains pristine. Does that gilded parchment shield him? Must the people endure his depredations because he was born to the purple?

  **Thomas:** Alaric presents the profound difficulty, Master John. His initial legitimacy is undeniable. His *right* to rule stemmed from just inheritance. His subsequent tyranny is a monstrous abuse, a violation of the trust inherent in kingship – which is for the *good* of the governed. However... the *method* of removal must be weighed with utmost care.

  **John:** Care? While he devours his subjects? Your own words state a king who rules not for the common good but for his own is a tyrant! Alaric fits perfectly. Does his lawful origin grant him immunity from the consequences of his crimes? Is the *Policraticus* wrong that such a ruler, like a gangrenous limb, must be severed for the health of the body?

  **Thomas:** Severed, yes! But *by whom*? Here lies our crux. With Alaric, the *office* itself retains legitimacy, even if the *holder* abuses it wildly. To have a private citizen, however righteous, strike down a lawfully crowned king... this risks destroying the very concept of legitimate authority. It invites every disgruntled knight or ambitious baron to cloak rebellion in the mantle of "tyrannicide." Chaos ensues. Therefore, against a tyrant *with title*, the action *must* come from a constituted public authority superior to, or at least representative of, the community *as a whole* – a council of nobles, the estates, or even the Pope if the tyranny touches the faith.

  **John:** *Presses, leaning forward* And what if that "public authority" is cowed? Bribed? Complicit? What if the nobles feast at the tyrant's table, grown fat on his plunder? What if the Pope is distant, or entangled in politics? Does Alaric reign unchecked because the mechanisms you prize are paralyzed by the very tyranny they should restrain? You bind justice in chains of procedure while the wolf devours the flock! The *Policraticus* argues that when public authority fails, the duty falls to *any* faithful member of the body politic. Is not the private citizen, witnessing the rape of justice, sometimes the *only* instrument God provides?

  **Thomas:** *Sighs heavily* You expose the weakness in my position, Master John. It is a terrible dilemma. I fear the chaos of the private sword; you fear the paralysis of corrupted institutions. My answer remains: even against Alaric, the *ideal* is public, lawful action. Resorting to private assassination is a last, desperate remedy, fraught with peril and only potentially justified if *all* other avenues are utterly closed, the tyranny is extreme and manifest, and the assassin acts with pure intent *solely* for the common good, not personal vengeance or gain. It is never a *right*, only a tragic, excusable necessity in the face of complete institutional failure. The burden of proof on the private actor is immense – near impossible to meet without sin.

  **John:** And the burden on the people suffering under Alaric is immediate and crushing. Your prudence risks becoming complicity in their suffering. My doctrine risks anarchy, yours risks despotism. Perhaps the true weight lies in discerning *when* the tyrant's actions have so utterly voided the trust underlying his original title that he becomes, in essence, a usurper *of the office itself* through his abuse. Alaric, by violating the very purpose of kingship, may forfeit the legitimacy his birth bestowed.

  **Thomas:** That... is a profound point, Master John. The *exercise* of tyranny could, over time and extremity, corrode the legitimacy of the *title* itself. It requires careful judgment – a judgment better made by many than by one. Our debate reveals the agonizing tension at the heart of governance: the need for order against the demand for justice, the sanctity of office versus the depravity of the office-holder. Neither path is without grave danger.

  **John:** Indeed, Brother Thomas. The crown is heavy, but the sword that removes it is heavier still. May God grant rulers wisdom, and subjects... discernment. And may just men find the courage to act rightly, be it through the assembly or, in the darkest hour, alone.

  **Aquinas:** Amen to that. The common good remains our star. May we always seek the path that best serves it, however fraught. Let us pray for such light.

  *(Both men fall silent, the weight of the unresolved question hanging heavy in the quiet scriptorium.)*
