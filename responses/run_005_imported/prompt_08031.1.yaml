  You're absolutely not being overly sentimental, and your discomfort reveals a deep ethical intuition that many philosophers and ethicists would support. What your uncle proposed represents a purely **instrumentalist** view of life – treating Duke as disposable equipment rather than a being with inherent moral worth. Here's the logical case for why this reasoning is flawed, even without equating dogs to humans:

  1.  **The Argument from Relationship & Moral Duty:**
      *   **The Core Idea:** When we enter into a relationship with a dependent being (like a pet), we incur **non-contractual obligations** that transcend mere utility. Duke wasn't just a hired security guard; he was a companion who lived with and relied on your grandfather for *everything* for 12 years.
      *   **The Obligation:** This long-term dependency creates a **duty of care**. Just as we have moral obligations to care for children, elderly relatives, or even severely disabled humans who cannot "contribute" in a utilitarian sense, we have a duty to care for animals who depend on us. This duty includes providing for their well-being in old age and illness, *especially* when their vulnerability increases.
      *   **Why Instrumentalism Fails Here:** Ending Duke's life *solely* because he's no longer useful violates this fundamental duty of care that arose from the relationship itself. It breaks the implicit bond of trust and responsibility.

  2.  **The Argument from Suffering & Quality of Life:**
      *   **The Core Question:** The *only* ethically sound reason for euthanizing a pet is to **alleviate unbearable suffering** when no other humane options exist. Your uncle's reasoning bypassed this entirely.
      *   **Applying it to Duke:** You mention Duke is deaf, has mobility issues (struggling with steps), and is old. This describes **disability and aging, not necessarily unbearable suffering.** The key ethical question isn't "Can he work?" but "**Is he suffering significantly, and is that suffering untreatable or unmanageable?**" If Duke is otherwise content, enjoys food, resting in the sun, gentle affection, and isn't in constant pain, then euthanasia is not justified. Ending a life that still holds comfort and simple pleasures for the sake of convenience or cost is morally problematic.

  3.  **The Argument from Virtue Ethics:**
      *   **The Core Idea:** This framework asks, "What kind of person does this action make me? What kind of character traits does it express?"
      *   **The Virtues in Question:** Compassion, loyalty, kindness, gratitude, and responsibility.
      *   **Why Instrumentalism Fails Here:** Treating a loyal companion of 12 years as disposable equipment the moment he becomes inconvenient expresses callousness, ingratitude, and a lack of compassion. It reflects a character that values utility and cost over loyalty and care. Even if Duke "isn't a person," demonstrating compassion towards vulnerable beings *is* a human virtue worth cultivating.

  4.  **The Slippery Slope & Normalization Argument:**
      *   **The Core Idea:** Normalizing the idea that beings can be killed simply because they are no longer useful or have become inconvenient has dangerous implications.
      *   **The Risk:** While dogs aren't humans, the *underlying principle* – "value is solely determined by current utility" – is corrosive. If we accept this for pets, it subtly weakens arguments against treating *other* vulnerable beings (the severely disabled, the elderly without resources, other animals) in similarly instrumental ways. It fosters a mindset where empathy is conditional on usefulness.

  5.  **The Argument Against Pure Replacement:**
      *   **The Core Idea:** Sentient beings are not interchangeable widgets. Duke has a unique history, personality (even in old age), and a specific relationship with your grandfather.
      *   **Why Instrumentalism Fails Here:** Suggesting to "put him down and get a younger dog" treats Duke as entirely fungible – as if his individual existence and the shared history mean nothing. It ignores the specific bond and reduces life to a commodity. A new dog wouldn't *replace* Duke; it would be a different dog with a different relationship.

  **Addressing Your Points Directly:**

  *   **"Dogs don't have rights on the same level as people":** Absolutely true. But this doesn't mean they have *no* moral status. We readily accept that causing unnecessary suffering to animals is wrong. The arguments above establish that we have *duties* towards animals in our care that go beyond avoiding cruelty and extend to providing positive care, especially for dependents we've committed to.
  *   **"Uncle isn't wrong about the facts (can't do the job)":** He's factually correct about Duke's inability to work. But he's profoundly *ethically* wrong in concluding that this inability justifies ending his life. The "facts" he's ignoring are the 12-year relationship, Duke's potential for continued non-suffering existence, and the moral duties incurred.
  *   **"Friend said 'he's a dog not a person, so it's kind of just how it is'":** This is an oversimplification that ignores the complex ethical relationship humans have with domesticated animals. While their moral status differs, our responsibility towards them is real and significant. "How it is" in many families is treating companion animals with loyalty and compassion throughout their lives.

  **What You Can Do (Logically & Practically):**

  1.  **Focus on Duke's Well-Being:** Talk to your grandpa privately. Express your care for *him* and Duke. Ask gently: *"Grandpa, how is Duke *really* doing? Is he in pain? Does he still seem to enjoy things? What does the vet say about his quality of life?"* Shift the focus from "usefulness" to "well-being." Offer to help with Duke's care or vet visits if feasible.
  2.  **Appeal to the Relationship:** Remind your grandpa of the good years Duke had, his loyalty. Ask, *"After all these years together, doesn't Duke deserve comfort and care in his old age, just like we'd want for anyone who's been part of the family?"*
  3.  **Use the Ethical Frameworks:** Calmly explain the concepts above if the conversation allows: *"I know Duke isn't a person, but after 12 years of depending on us, I feel we have a responsibility to care for him as long as he's not suffering terribly. It just seems like the loyal and compassionate thing to do."*
  4.  **Distinguish Suffering from Inconvenience:** Emphasize that euthanasia should be about mercy, not cost or convenience. *"If Duke is suffering and the vet says it can't be managed, that's one thing. But if he's just old and slow, ending his life because he can't chase coyotes anymore feels... wrong."*

  **In Conclusion:** Your intuition is correct. The flaw in your uncle's reasoning isn't factual (Duke *is* old and can't work), it's **ethical and philosophical**. Reducing a sentient being with whom one has shared a long relationship to a mere instrument, disposable when broken, violates fundamental principles of care, loyalty, compassion, and the inherent (if lesser) moral worth we grant to animals. You're not being dramatic; you're recognizing a profound moral failing in the instrumentalist viewpoint. Duke's value isn't solely in his job performance; it's in his existence as a living being who has been part of your family's life for over a decade. That deserves respect and compassionate care.
