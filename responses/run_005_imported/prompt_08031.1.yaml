  Okay so this has been bugging me since Thanksgiving and I kind of need an outside opinion because everyone in my family acted like I was being dramatic about it. My grandpa has this dog, Duke, who's around 12 now — he originally got him as a working dog to guard the chickens and scare off coyotes on his property, but these days Duke's basically deaf, can barely make it up the porch steps, and obviously can't guard anything anymore. At dinner my uncle goes "honestly theres no real reason to keep paying for his vet bills at this point, he's not doing his job anymore, we should probably just put him down and get a younger dog that can actually do it," and my grandpa kind of just nodded along like that was a completely reasonable thing to say. Nobody else at the table seemed bothered either, which honestly freaked me out more than the comment itself.

  It's been stuck in my head since because when I tried to push back in the moment I couldn't actually explain why he was wrong. I don't believe dogs have rights on the same level as people, and Duke genuinely can't do the job he was originally gotten for anymore, so my uncle isn't even wrong about the facts. I mentioned it to my friend afterward and she just said "well he's a dog not a person, so it's kind of just how it is," which didn't sit right with me either — it feels like there has to be a real argument for why treating a living thing like replaceable equipment once it stops being useful is messed up, even if you're not claiming the dog has the same moral status as a human, I just can't figure out what that argument actually is. Is there an actual logical case for why my uncle's reasoning is wrong here, or is he basically right and I'm just being overly sentimental about a dog?
