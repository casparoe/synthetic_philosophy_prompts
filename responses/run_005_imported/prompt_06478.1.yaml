answer: |-
  ## The Norm of Assertion: A Verdict Grounded in Epistemic Responsibility

  The debate over assertion's constitutive norm is not a semantic wash; it reflects a genuine struggle to capture the core epistemic responsibility inherent in claiming something *as true* within a social-epistemic practice. While each account illuminates facets of assertion, **Williamson's knowledge norm, properly understood as requiring that the asserter *represent themselves as knowing* p, provides the most robust, unified, and explanatorily powerful account, successfully navigating the challenges posed by Lackey and lottery cases.** This norm captures the unique illocutionary force of flat-out assertion distinct from weaker speech acts like conjecturing or opining.

  **1. The Core Strength of the Knowledge Norm: Epistemic Commitment and Defect Explanation**

  Williamson's core insight is that assertion constitutively aims at knowledge. The norm "Assert p only if you know p" (KN) best explains the *distinctive wrongness* of certain assertions:

  *   **Moorean Paradox:** "p, but I don't know p" is paradoxical because asserting p *itself* represents the speaker as knowing p. The second conjunct directly contradicts the commitment inherent in the act of assertion performed by the first. Weiner's truth norm (TN: "Assert p only if p is true") fails here. "p, but I don't know p" could be true (if p is true and the speaker is Gettiered or merely believes justifiably but falsely). Yet, it remains deeply defective *as an assertion*. TN cannot explain this defect; it only flags falsity. The defect is specifically *epistemic* and tied to the speaker's position relative to p – precisely what KN captures.
  *   **Lottery Cases:** Asserting "Your ticket lost" based solely on astronomical odds (1 in a million) feels intuitively improper, even if true. KN explains this perfectly: the asserter lacks *knowledge*; they possess only probabilistic belief. Weiner argues this impropriety is pragmatic (e.g., violating Gricean maxims like Quantity or Relation – implying you have insider knowledge you lack). However, this feels strained. The impropriety persists even in contexts where mentioning the odds is irrelevant or cumbersome. The core issue is the *strength of epistemic warrant presented*. Asserting p flatly presents it as *settled*, not merely highly probable. KN directly accounts for this by demanding the maximal warrant characteristic of knowledge. Douven's reasonable credibility norm (RCN: "Assert p only if p has for you a degree of credibility sufficient for rational belief") clearly fails here; the credence *is* sufficient for rational belief, yet the assertion remains improper. RCN is too weak to capture the unique force of assertion.

  **2. Confronting Lackey's Selfless Assertion: Representation, not (Necessarily) Mental State**

  Lackey's cases are the strongest challenge. Consider the biology teacher: she asserts evolutionary theory based on evidence and consensus, despite her personal disbelief. The assertion seems proper. KN seems to fail because she lacks belief, hence knowledge. Belief-based norms also fail.

  *   **The Knowledge Norm's Response - Representing as Knowing:** KN need not demand the *internal mental state* of knowing at the moment of utterance. Instead, it demands that the speaker *represent themselves as knowing* p. This representation is part of the speech act's conventional force. The biology teacher, *in her role as a teacher*, is invoking the *scientific community's knowledge*. By asserting "Evolution occurred," she represents *that body of knowledge* as authoritative. Her utterance is parasitic on the knowledge possessed by the scientific experts whose consensus she cites. She functions as a conduit for *their* knowledge. Her personal disbelief is epistemically irrelevant to the warrant she is presenting; the warrant *is* the knowledge of the community.
  *   **Why Representation Matters:** This explains the propriety. Students are entitled to treat her assertion *as if it were backed by knowledge* (which it is, vicariously). Contrast this with her asserting "God created species in 7 days" based purely on her faith. *That* assertion, made in the biology classroom context, would be improper because it fails to represent *scientifically established knowledge*. It represents only personal belief, which is insufficient warrant for the context. The "selfless" assertion works *because* it correctly represents the epistemic status of p *within the relevant domain*. KN, understood as "Assert p only if you represent yourself as knowing p (based on your own knowledge or appropriately deferring to a relevant knowledge community)," handles this. Her utterance meets the norm because she is warranted in representing evolution *as known* by science.
  *   **Why Alternatives Fail Here:**
      *   **Truth Norm (TN):** Irrelevant. The propriety isn't solely about truth (though evolution is true). Asserting a true but unjustified personal belief wouldn't be proper in class.
      *   **Reasonable Credibility (RCN):** Too weak. The teacher's *personal* credence in evolution is low (due to faith), yet the assertion is proper. RCN might try to appeal to the evidence's credibility *for her*, but her rejection of that evidence's force for belief makes this incoherent. The propriety stems from the *objective* credibility and status of the *content*, not her subjective take on it. RCN struggles to capture this objectivity.
      *   **Belief Norms:** Clearly fail as she lacks belief.

  **3. Adjudicating Against the Alternatives: Why KN Prevails**

  *   **Against Weiner's Truth Norm (+ Pragmatics):** TN fails to explain the *specific* defect in Moorean assertions and lottery assertions. Weiner's reliance on pragmatics is ad hoc in these cases. The impropriety in lottery assertions feels *constitutive* of assertion, not merely a violation of conversational implicature. Furthermore, TN cannot explain the *epistemic authority* conveyed by proper assertion – why we feel licensed to say "She *told* me p, so I came to know p". KN explains this naturally: assertion is presented as a knowledge-delivery mechanism. TN can only explain transmission of truth, not knowledge.
  *   **Against Douven's Reasonable Credibility Norm:** RCN fails the lottery test spectacularly. It also struggles with Moorean assertions – "p, but I don't know p" could easily involve a credence sufficient for rational belief. Most damningly, RCN blurs the line between assertion and weaker speech acts. Saying "I think p, based on the evidence" expresses rational credibility. Flat-out asserting p does something stronger: it stakes a claim to *knowledge-level* warrant. RCN cannot account for this crucial difference in illocutionary force and the correspondingly higher stakes for the asserter (e.g., blame for asserting falsely is greater than blame for incorrectly conjecturing). KN preserves this vital distinction.
  *   **Against Belief-Based Norms:** Lackey's cases sink simple belief norms. Even modified belief norms struggle to explain why asserting without belief can sometimes be proper (as in the teacher case, understood as representing communal knowledge) and why lottery assertions feel improper despite strong belief.

  **4. The Verdict: Knowledge as the Normative Standard**

  Therefore, the constitutive norm governing flat-out assertion is: **One must assert p only if one represents oneself as knowing p.** This norm:

  1.  **Explains Core Data:** Accounts for the defect in Moorean assertions and lottery assertions directly and elegantly.
  2.  **Handles Lackey:** Accommodates selfless assertions by recognizing the role of representing communal knowledge and the contextual nature of "representing oneself as knowing." The speaker's commitment is to the *epistemic status* of p being knowledge-grade, achievable vicariously through appropriate deference.
  3.  **Maintains Illocutionary Distinction:** Preserves the unique force of assertion compared to weaker acts like conjecturing or expressing high credence.
  4.  **Grounds Epistemic Responsibility:** Best captures the responsibility an asserter undertakes – not just to say something true, but to say something they are positioned to warrant *as known* (either personally or by legitimate proxy), making them accountable for failing this standard in ways that truth or mere credibility norms cannot match.
  5.  **Avoids Ad Hoc Maneuvers:** Unlike TN + Pragmatics or RCN, it doesn't require tacking on complex, context-dependent explanations for the core intuitive data points.

  **Qualifier:** This norm governs *paradigmatic, flat-out assertion* in contexts where conveying factual information is the primary aim. Specialized contexts (e.g., fiction, acting, explicit hedging like "I believe p") operate under different conventions or involve weakened or non-literal assertions. However, for the core case of putting p forward *as a fact for acceptance within a knowledge-seeking practice*, representing oneself as knowing p is the constitutive standard. The debate isn't washed out; it reveals that assertion, as a cornerstone of human communication, carries the profound epistemic weight of knowledge.
