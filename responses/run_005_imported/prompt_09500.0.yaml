answer: |-
  Here’s a toast that honors Frank’s legacy, resonates with newsroom insiders without alienating family, and carries quiet integrity—without exposing him or resorting to inside jokes. It’s structured to feel warm, slightly irreverent (as newsrooms demand), and layered for those listening closely. Aim for **4-5 minutes** with pauses for laughter/applause:

  ---

  **(Clink glass. Warm, relaxed tone.)**  
  "Alright, settle down—I promise this’ll be shorter than Frank’s lecture on Oxford commas. For those who don’t know me, I’m [Your Name], one of the many terrified interns Frank molded into a semi-functional journalist back in [Year]. And tonight, we’re here for Frank—a man who’s spent 30-something years teaching this newsroom that facts aren’t flexible, deadlines are holy, and if you so much as *think* about embellishing a quote, you’ll wish you’d chosen a safer career… like bomb disposal. *(Pause for laughter.)*  

  I’ll admit: when they asked me to toast Frank, I panicked. Because how do you summarize a guy who’s equal parts institution, legend, and… well, let’s be honest, occasionally a *spectacle*? The Frank who’d storm through the newsroom like a tornado in suspenders if a source was misattributed? The Frank who’d rather drink printer ink than let a cliché slide? *(Nod to newsroom vets.)* But also the Frank who’d slip you his famous meatball sub when you were on your 15th hour of editing? Who still sends handwritten notes to your kids? *(Smile at family.)*  

  **Here’s the thing about Frank:** he didn’t just enforce standards—he *lived* them like a religion. He had this phrase he’d drill into every new hire: *‘The truth isn’t a first draft.’* And sure, he’d say it with the intensity of a man whose coffee had just gone cold… but you remembered it. Because he was right. In an age where stories get blurry faster than ever, Frank was our anchor. He made us better—even when ‘better’ meant rewriting your lede seven times. *(Raise glass slightly.)* That rigor? That refusal to let a single detail slide? It wasn’t just about being right—it was about **respect**. Respect for the people we wrote about, respect for the readers who trusted us, and respect for the messy, inconvenient truth.  

  Now, I know some of you are thinking: *‘Come on, nobody’s that perfect.’* *(Light chuckle.)* And you’re right. Because here’s what I’ve learned from Frank: integrity isn’t about being flawless. It’s about caring *so damn much* that you build a career—a life—around guarding it anyway. It’s about creating something bigger than yourself: a newsroom where the young kid from nowhere knows they’ll be heard if they call out a shortcut. Where ‘how we do things’ matters as much as ‘what we did.’ That’s Frank’s real legacy. Not the scowls or the speeches—but the standard he carved into these walls.  

  **So, Frank:** You’ve been our compass. Our conscience. And yes, occasionally our sleep-depriving nemesis. *(Wink.)* But above all? You taught us that journalism isn’t just about getting the story—it’s about *deserving* it. Thank you for keeping us honest. Thank you for the meatball subs. And thank you for reminding us, every single day, that the truth is worth fighting for—even when it’s inconvenient. Especially then.  

  **To Frank—**  
  May your retirement be as richly deserved as your reputation. And may your grandkids *never* let you fact-check their bedtime stories. *(Grins.)* Cheers!"  

  ---

  ### Why this works:
  1. **Honest, not exposing:**  
     - Highlights Frank’s famous rigidity ("*embellishing a quote*," "*truth isn’t a first draft*") as a virtue—which it was.  
     - The line *"integrity isn’t about being flawless. It’s about caring so damn much..."* **is your quiet nod to the truth**. Newsroom lifers may sense gravity in that phrasing; family hears praise. Frank will hear what you mean.  

  2. **Balances the room:**  
     - **For family:** Warm anecdotes (meatball subs, notes to kids), emphasis on his care/respect.  
     - **For colleagues:** Inside references (Oxford commas, printer ink, rewriting ledes) + framing his strictness as a gift.  

  3. **Philosophy, embedded:**  
     - The toast *affirms* Frank’s standards while separating the *principle* (truth matters) from the *person* (who fell short once). No hypocrisy cited, but the subtext honors your moral clarity: *"The truth is worth fighting for—even when it’s inconvenient. Especially then."*  

  4. **Leaves everyone smiling:**  
     - Ends on warmth (grandkids, meatball subs) and a laugh. No bitterness, no bombshells—just gratitude for what he *did* right.  

  ### Delivery tips:  
  - Pause after *"Now, I know some of you are thinking: ‘Come on, nobody’s that perfect.’"* Let the room sit with it.  
  - Look at Frank during *"integrity isn’t about being flawless."* He’ll feel the weight.  
  - Keep the tone fond, not reverent—like you’re teasing a beloved mentor.  

  This lets you honor the *best* of Frank, stay true to your knowledge, and give him a sendoff that feels human—not a eulogy for a saint. He’ll hear you. And you’ll sleep well.
