  First, I notice the student's answer is remarkably concise for a 10-minute response. The core challenge is evaluating how well they hit the three required components (a, b, c) without overpenalizing brevity. 

  For part (a) on intention/foresight: The student nails the core distinction ("intending death vs merely foreseeing it") and even provides the munitions plant example. That's textbook Anscombe. I'd give full points here. 

  Part (b) is where it gets interesting. The student correctly identifies terror bombing as the mechanism (not side effect) but misses Anscombe's explicit denial that this leads to pacifism. They conflate her with consequentialism critics ("can't do evil..."), which is adjacent but not identical to her doctrine of double effect. Minor deduction here. 

  Part (c) is the trickiest. The student asserts Anscombe's position is "pacifism under another name" - but that's exactly what Anscombe rejects in her essay! She insists double effect permits some warfare. This misunderstanding warrants a more significant point reduction. 

  On execution: The answer is coherent and cites key phrases ("mechanism not side effect"), but oversimplifies Anscombe's broader stance. Since the exam emphasizes precision, I'll dock a point in "other" for the pacifism misattribution. 

  Final calculation: 5+4+3+3=15/20. That's a solid B+ - strong on fundamentals but missing nuanced distinctions in Anscombe's anti-pacifist stance. The grade reflects both the answer's strengths and the philosophical precision the seminar likely expects.
