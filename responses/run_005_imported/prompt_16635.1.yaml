  ### Defense for S-Tier:
  1. **Universal preregistration/Registered Reports**: This eliminates p-hacking, HARKing (Hypothesizing After Results are Known), and outcome switching by locking methods/hypotheses *before* data collection. For enzyme kinetics, this would force explicit declaration of substrate ranges or kinetic models upfront, preventing post-hoc "fishing" that inflates false positives.  
  2. **Reforming hiring/tenure decisions**: Current incentives prioritize novel, p < 0.05 findings over robustness. Rewarding replications would shift cultural priorities toward verification—critical in biochemistry where reagent variability (e.g., enzyme purity) often underlies irreproducibility. This structural change attacks the root cause: academia's "publish or perish" engine.  

  ### Added Fix & Rationale:
  - **Increasing sample sizes (A-tier)**: Directly reduces false positives by improving power and effect-size estimation. In kinetics, undersampled time courses or substrate concentrations amplify noise—larger *n* mitigates this. Practical for biochemistry where high-throughput assays exist, but requires funding shifts.  

  ### Notes on Other Tiers:
  - **A-tier**: Mandatory replication catches methodological flaws (e.g., buffer conditions) but is resource-heavy.  
  - **B-tier**: Multiverse analyses expose fragility (e.g., showing Km values depend on data-cleaning choices), while abandoning significance language reduces dichotomous thinking—but neither prevents initial false discoveries.  
  - **C-tier**: p < 0.005 lowers false positives but ignores effect sizes and rewards "p-hacking 2.0." Bayes factors depend heavily on subjective priors—problematic for kinetic constants with disputed mechanisms.  
  - **D-tier**: None are pure theater, but C-tier fixes risk superficial compliance without deeper reform.  

  ### Key Insight:
  The most powerful fixes (S-tier) target *incentives and process transparency*, not statistical tweaks. As a kineticist, you know Vmax artifacts arise from system design—not just analysis. Science needs analogous systemic fixes.
