answer: |-
  Here’s a defense of the non-at-issue (conventional implicature/presupposition) account, addressing projection, reclamation, and your moral objection:

  ### 1. **Projection Patterns Favor Non-At-Issue Content**  
  The persistence of derogatory force under negation ("Hans isn't a *[slur]*"), conditionals ("If Hans is a *[slur]*, he’s cruel"), and questions ("Is Hans a *[slur]*?") mirrors classic projection behavior of **presuppositions** (e.g., "stop smoking" presupposes you smoked) or **conventional implicatures** (e.g., "Shaq is huge but agile" implicates contrast regardless of truth).  
  - **Hom-style truth-conditional views struggle here**: If slurs encode complex false properties (e.g., *German + despicable*), then:  
    - *Negation*: "Hans isn’t a Boche" would become a true claim (since Hans lacks the "despicable" property), but intuitively, the utterance remains offensive.  
    - *Conditionals*: "If Hans is a Boche, he’s cruel" would vacuously true if no Germans are "despicable"—yet the conditional still feels derogatory.  
  - **Non-at-issue accounts elegantly capture this**: The derogation projects because it’s structurally independent of the at-issue content. Whether the sentence is asserted, denied, or questioned, the bigoted attitude ("Germans are despicable") remains attached as a commitment the speaker can’t cancel without oddity (*"Hans is a Boche, but Germans aren’t despicable"* sounds contradictory).  

  ### 2. **Reclamation is Pragmatically Natural on Non-At-Issue Views**  
  Your worry: If reclaimed uses lose derogation, does the word become neutral?  
  - **Conventional implicature (CI) accounts** (e.g., Potts 2007) handle this via **contextual suspension**. The descriptive core ("German") stays constant, while the CI layer can be pragmatically disabled by in-group speakers.  
    - *Why it works*: Reclamation isn’t lexical change but **pragmatic reappropriation**. When marginalized speakers use a slur, they signal:  
      - **In-group solidarity**: The CI is overridden by shared context (e.g., "queer" in LGBTQ+ settings).  
      - **Defiance**: The offensive layer is deliberately repurposed as empowerment.  
    - *Hom-style views can’t explain this flexibility*: If "Boche" semantically encodes a false, bigoted property, reclaimed uses would either:  
      - (a) Require a new homonym (but speakers don’t treat it as a new word), or  
      - (b) Falsely imply reclaimed users assert bigotry (they don’t).  
    - *Non-at-issue solution*: Same syntax, same truth conditions ("German"), but the CI is **locally blocked** by speaker identity and context.  

  ### 3. **Addressing the Moral Objection: Why Truth Conditions *Should* Be Neutral**  
  You objected that letting "Hans is a Boche" be true if Hans is German "concedes too much to bigotry." But this conflates **semantics** with **normative defectiveness**:  
  - **The term remains defective**: Even if "Boche" truth-conditionally means *German*, it carries an uncancelable CI that *Germans are despicable*. Thus:  
    - No non-bigoted speaker should *ever* use it—the CI expresses bigotry regardless of truth.  
    - Asserting "Hans is a Boche" is **semantically true but conversationally abusive** (like shouting truth).  
  - **Hom-style views risk trivializing bigotry**: If "Boche" is always false (since "despicable German" is uninstantiated), then:  
    - Bigots uttering "Hans is a Boche" speak *falsely*, but their error is **descriptive** (like misclassifying a dog) rather than **moral**.  
    - This fails to explain why such utterances are *offensive* rather than merely *mistaken*.  
  - **Non-at-issue accounts better reflect harm**: The offense lies in **expressively endorsing hate** (via CI), not in truth-conditional error. This explains why even "false" slurs ("You’re a *[slur]*" to a non-target) remain harmful.  

  ### 4. **Empirical Advantages: Embedded Uses and Denials**  
  Consider:  
  - *Denial*: "Hans isn’t a *[slur]*—those people are subhuman!"  
    - **CI/Presupposition view**: Derogation projects ("those people are subhuman" confirms the bigoted attitude).  
    - **Hom-style view**: The denial ("Hans isn’t a *[slur]*") should be true and non-derogatory, but the sentence remains offensive.  
  - *Metalinguistic negation*: "Hans isn’t a *[slur]*—that’s a vile thing to say!"  
    - Here, negation targets the slur *itself*. Non-at-issue views allow this: the CI is part of what’s rejected. Hom’s view struggles, as the "descriptive core" is unproblematic.  

  ### Conclusion: Why Non-At-Issue Wins  
  - **Projection** is explained by general linguistic mechanisms (presupposition/CI).  
  - **Reclamation** is pragmatic suspension, not semantic chaos.  
  - **Moral defect** is located in the expressive layer, where it belongs—not diluted by truth conditions.  

  While Hom’s view captures intuitions about bigotry "infecting" reference, it overcomplicates semantics and falters on embedding/reclamation. The non-at-issue account (especially CI) offers a unified, empirically grounded solution: **Slurs are truth-conditionally neutral but conversationally poisonous**. This doesn’t "concede" to bigots—it exposes their poison as an ineliminable part of the word’s structure.  

  ---
  *Key references*:  
  - Potts, C. (2007) on conventional implicature.  
  - Schlenker, P. (2007) on presupposition projection.  
  - Nunberg, G. (2018) for reclamation as pragmatic negotiation.  
  *(Note: Dummett’s "Boche" example is from "Frege: Philosophy of Language," 1973.)*
