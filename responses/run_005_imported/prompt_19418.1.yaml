  First, I need to recall the key points of both theories. Hom's combinatorial externalism builds the derogation into the truth conditions, meaning that using a slur asserts a false, bigoted property. But this leads to problems with embedding and reclamation. For example, in conditionals like "If Hans is a Boche, he's cruel," Hom's view might make the antecedent necessarily false, which isn't how people actually interpret such statements. The derogation still comes through without affecting the truth conditions of the whole sentence.

  The non-at-issue approach, like conventional implicature (CI) or presupposition, separates the derogatory content from the truth-conditional meaning. So "Hans is a Boche" truth-conditionally means Hans is German, but carries a CI that Germans are despicable. This explains projection: the offensiveness projects out of embeddings because CIs/presuppositions do that. For instance, under negation, "Hans isn't a Boche" still implies Germans are despicable, which matches the observation that the slur's force survives embedding.

  Reclamation is another key point. The user mentioned that in-group uses of slurs lose derogatory force. With the CI/presupposition view, reclaimed use retains the same truth conditions but suspends the CI. So the group reappropriates the term, keeping the descriptive core but stripping off the derogation. Hom's view would require a semantic shift, but reclamation often happens contextually without creating a new word. This flexibility supports the non-at-issue approach.

  The user's objection was that treating the truth conditions as neutral concedes too much to bigotry. But the non-at-issue response is that the term remains defective because it always carries the offensive CI when used non-reclaimed. So even if "Hans is a Boche" is true descriptively, it's still inappropriate due to the CI. This avoids endorsing the bigoted content as part of the truth conditions.

  I should also address presupposition failure. If the derogatory content is a presupposition, denying it might lead to failure. For example, "Hans isn't a Boche" still presupposes that Germans are despicable. But in reclamation contexts, that presupposition is locally accommodated or suspended, explaining why it's not offensive there.

  The user's friend's view aligns with theorists like Potts or Schlenker, who use CI/presupposition for slurs. I need to reference them to strengthen the argument. Also, emphasizing how projection patterns in embeddings mirror other non-at-issue content like "even" or "stop" can show that this approach fits linguistic generalizations.

