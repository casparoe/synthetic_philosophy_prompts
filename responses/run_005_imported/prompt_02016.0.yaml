answer: |-
  That's a brilliantly perceptive reading! You've hit on a fascinating tension between a core Reformation theological principle and a widely accepted modern ethical concept, using the same word. Let's break it down:

  **I. Unpacking Article XIV: What the Reformers Rejected and Why**

  1.  **The Specific Target: The Medieval Catholic "Economy of Merit"**
      *   **Core Belief:** Medieval Catholic theology held that while God's grace was essential for salvation, humans could (and should) cooperate with that grace through good works. These works generated "merit."
      *   **Works of Supererogation:** Certain individuals (especially saints, monks, nuns through rigorous asceticism, martyrdom, or extraordinary charity) were believed to perform works that went *beyond* what God strictly required ("bounden duty"). These extra works generated *superabundant* or "supererogatory" merit.
      *   **The Treasury of Merit:** This extra merit wasn't wasted. It was understood to be deposited into a "Treasury of Merit" administered by the Church (specifically, the Pope).
      *   **Indulgences:** The Church could then dispense this surplus merit to ordinary believers (often in exchange for donations or specific acts) in the form of **indulgences**. Indulgences primarily remitted the *temporal punishment* due to sin (e.g., time in Purgatory), not the guilt of sin itself (absolved in confession). They were often marketed crudely as reducing time in Purgatory for oneself or deceased loved ones.
      *   **Monastic Vows:** Taking monastic vows (poverty, chastity, obedience) was often seen as a prime example of supererogation – going beyond the commandments applicable to ordinary Christians.

  2.  **The Reformers' Objections (Why "Arrogancy and Impiety"?)**
      *   **Undermining Grace Alone (Sola Gratia):** The entire system implied that human effort, even beyond the call of duty, could generate spiritual "credit" that could be transferred. This directly contradicted the reformers' core belief that salvation is *entirely* a free gift of God's grace, received through faith alone (Sola Fide), not earned or supplemented by human works. Supererogation suggested humans could *add* something to Christ's perfect sacrifice.
      *   **Denying Human Sinfulness and Inability:** The reformers emphasized the pervasive nature of sin (Total Depravity). Even our *best* works, they argued, are tainted by sin and fall infinitely short of God's perfect standard. To claim that *any* work could be "extra" or "beyond duty" was seen as a profound misunderstanding of human nature before God and an insult to God's holiness. As the Article quotes Jesus: "When ye have done all... say, We are unprofitable servants" (Luke 17:10). Our best efforts are simply our duty; they don't put God in our debt.
      *   **Arrogance:** Claiming to do "more than duty requires" implies a person has perfectly understood and fulfilled their *basic* duty to God and neighbor, which the reformers believed was impossible. It fosters spiritual pride – the belief that one is exceptionally holy or capable of exceeding God's demands.
      *   **Impiety:** It diminishes the all-sufficiency of Christ's atonement. If humans can generate surplus merit, then Christ's sacrifice wasn't fully sufficient. It also usurps God's sole authority to judge merit and dispense grace by placing that power (via the Treasury) in the hands of the Church hierarchy. Selling indulgences based on this system was seen as the pinnacle of impiety – "selling" God's grace.
      *   **Burdening Consciences:** The system created an impossible burden. How could anyone know if they had done *enough*, let alone generated *extra*? It fostered anxiety and reliance on the Church's mediation rather than direct faith in Christ.

  **II. The Modern Philosophical Concept of Supererogation: A Different Beast?**

  Modern secular moral philosophers *do* use "supererogation" to describe actions that are:
  *   Morally good or praiseworthy.
  *   Not morally obligatory/dutiful.
  *   Often involve significant sacrifice or risk by the agent.
  *   **Examples:** The heroic stranger rescue, donating a kidney to a stranger, extraordinary acts of charity or forgiveness, whistleblowing at great personal cost.

  **Why is this conceptually different from what the reformers condemned?**

  1.  **No "Merit Economy":** Modern philosophy isn't operating within a framework of accumulating spiritual merit before God or a Treasury administered by an institution. It's about describing the *moral status* of actions within human social relations and ethical systems. Admiring an act as supererogatory doesn't imply the agent has generated "spiritual surplus" to be transferred.
  2.  **Focus on Praise, Not Requirement:** The point is to distinguish actions we *admire and praise* but don't *demand or blame people for omitting*. We praise the hero but don't morally condemn the bystander who freezes or runs for help instead. The reformers' objection was to the claim that such acts generated *transferable merit before God*.
  3.  **Grounding in Human Ethics, Not Divine Command:** Modern supererogation is typically discussed in terms of consequentialism, deontology, virtue ethics, etc. – frameworks for human moral reasoning. The reformers were focused solely on the relationship between human action and God's requirements/grace in the context of salvation.
  4.  **No Implication of Perfection:** Calling an act supererogatory doesn't imply the agent has perfectly fulfilled all lesser duties. We can recognize someone performed a heroic supererogatory act *while also* acknowledging they fail in other areas of duty. The reformers argued that claiming *any* work as "beyond duty" inherently implied a claim of having met the basic duty perfectly.
  5.  **"Unprofitable Servants" Reinterpreted:** A modern philosopher might argue that Jesus' statement ("unprofitable servants") precisely *supports* the concept of supererogation! They might say: Even after doing *all we are commanded* (our duty), we are still "unprofitable servants" – meaning we haven't put God in our debt. Therefore, *any* good we do *is* fundamentally "extra," a gift of grace, and acts that go beyond minimal duty are especially gracious but don't generate "credit." This flips the reformers' use of the verse on its head. The reformers used it to deny *any* work could be "extra"; the modern view might use it to say *all* good works, including duties, are ultimately "extra" grace.

  **III. Connecting the Dots: Is There Any Bearing?**

  *   **Conceptual Separation:** Yes, the *core concepts* are distinct. The theological concept revolves around **transferable merit for salvation within a specific divine economy.** The philosophical concept revolves around **praiseworthiness beyond obligation within human moral discourse.** They share a structural similarity ("going beyond requirement") but operate in fundamentally different universes of meaning.
  *   **Potential Resonance:** However, a *very* strict theological critic *might* still argue that the modern concept carries a faint echo of the arrogance the reformers condemned. They might say: "By calling something 'beyond duty,' you imply humans can perfectly define and fulfill their 'duty' and then step beyond it, which still underestimates the radical nature of God's demands and human sinfulness. *All* acts of true love are commanded; failing to do them when possible *is* sin; doing them is simply duty." This would be a minority, theologically rigorous view today, even within Protestantism.
  *   **Shared Term, Different Debates:** You are absolutely right. The *word* survived, migrating from a very specific theological controversy into secular moral philosophy. While the structural idea of "beyond the call" is similar, the frameworks, stakes, and implications are entirely different. The philosophical debate focuses on whether such actions exist, how to define them, and their role in ethical systems. The reformers' debate was about the mechanics of salvation and the authority of the Church.

  **In Conclusion:**

  You've astutely identified a key Reformation rejection of a medieval Catholic doctrine central to the indulgence controversy. The reformers condemned "Works of Supererogation" because they saw them as undermining salvation by grace alone, promoting arrogance about human capability, detracting from Christ's sufficiency, and enabling ecclesiastical abuses like the sale of indulgences. Their objection was deeply theological, grounded in their view of sin, grace, and the all-sufficiency of Christ's work.

  Modern moral philosophers use the same term to describe a genuinely different concept: morally praiseworthy actions that are not obligatory. While there's a superficial similarity in the idea of "going beyond," the frameworks (theological merit economy vs. secular ethics), the stakes (salvation vs. moral description/praise), and the implications (transferable surplus merit vs. non-transferable admiration) are distinct. The term survived, but the debates diverged significantly. Your great-grandmother's prayer book opened a fascinating window into a pivotal historical debate that still echoes in an unexpected way today!
