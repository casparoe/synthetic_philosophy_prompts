answer: |-
  Here's the strongest formulation of the Darwinian debunking argument against moral realism, incorporating the crucial distinction addressing the math/logic counterargument (focusing on substance & structure for your character):

  **The Core Argument (Sharon Street's "Darwinian Dilemma" is key here):**

  1.  **The Evolutionary Shaping Claim:** Our fundamental moral intuitions, sentiments, and basic evaluative tendencies (e.g., tendencies towards altruism towards kin/ingroup, reciprocity, fairness within the group, disapproval of free-riders, aversion to incest, empathy triggers) have been heavily shaped by natural selection. They exist *primarily* because they conferred fitness advantages on our ancestors in their specific social and ecological environments. They are adaptations for survival and reproduction within complex social groups, *not* necessarily truth-tracking mechanisms.

  2.  **The Tracking Problem:** If Moral Realism is true (i.e., there are objective, mind-independent moral facts, e.g., "Torturing innocents for fun is *objectively* wrong"), then for our evolved moral faculties to be reliable guides to *these truths*, there must be a plausible explanation for *why* selective pressures would have favored cognitive mechanisms that accurately *track* these objective moral facts.
      *   **Option A (Tracking):** Evolution *directly* selected for the ability to perceive objective moral truths because believing them conferred a survival advantage. (The Realist hopes for this).
      *   **Option B (Coincidence):** The moral beliefs produced by our evolved faculties happen to align with the objective moral truths *only coincidentally* – the selective pressures shaped our beliefs for adaptive reasons *unrelated* to their truth-value regarding objective morality.

  3.  **Why Option A (Tracking) is Implausible:**
      *   Evolution selects for *behaviors* and *motivational tendencies* that enhance reproductive success (fitness), *not* for abstract truth-tracking *per se*, especially in domains disconnected from immediate physical survival.
      *   What was adaptive (e.g., loyalty to the tribe, punishing outsiders, hierarchical deference, specific mating preferences) bears no *necessary* relation to what might be objectively morally true. In fact, many adaptive tendencies (e.g., intense tribalism, xenophobia, dominance hierarchies) seem deeply problematic from many plausible objective moral viewpoints.
      *   The *content* of our moral intuitions maps remarkably well onto what we'd *expect* if they were fitness-enhancing social instincts (kin altruism, reciprocal altruism, coalitional psychology, disgust reactions regulating disease/parasites), *not* onto some independently discernible set of moral truths. The sheer diversity of moral codes across cultures, many adaptive in their context but mutually incompatible, further undermines the tracking claim.

  4.  **The Skeptical Conclusion:** Therefore, Option B (Coincidence) is overwhelmingly more plausible than Option A (Tracking). There is no good reason to think our evolved moral faculties reliably track objective moral truths. At best, any alignment between our moral intuitions and putative objective truths would be accidental. Consequently, we have a powerful reason to doubt the reliability of our foundational moral intuitions as guides to objective moral truth, undermining the justification for believing in Moral Realism.

  **Addressing the Math/Logic Counterargument (The Crucial Distinction):**

  *   **The Counter:** "But evolution shaped our capacities for math and logic too! We don't think *2+2=4* is just an adaptive fiction. Why is morality different?"
  *   **The Sophisticated Response (Tracking vs. Adaptive Link):**
      *   **Math/Logic:** The evolutionary advantage of basic logical and mathematical capacities comes *precisely* from their ability to accurately represent *mind-independent features of the physical world* essential for survival. Successfully navigating the world (predicting trajectories, tracking objects/substances, understanding cause/effect, spatial reasoning) *requires* cognitive tools that reliably map onto fundamental logical and mathematical structures *of reality itself*. Evolution *did* select for truth-tracking in this domain because truth-tracking *was directly adaptive*.
      *   **Morality:** The evolutionary advantage of our moral intuitions comes *not* from their ability to track mind-independent moral truths, but from their ability to *motivate adaptive social behaviors* (cooperation, conflict resolution, mate selection, coalition maintenance). Their *content* is explained by *what worked* for inclusive fitness within ancestral environments.
      *   **The Key Distinction:** For math/logic, the *adaptive value* stems *directly* from *tracking objective features* of the physical world. For morality, the *adaptive value* stems from *promoting behaviors conducive to survival/reproduction*, *regardless* of whether those behaviors correspond to some objective moral truth. The connection to *truth* is **direct and constitutive** in math/logic; it's **contingent and potentially misleading** in morality.
      *   **Burden Shift:** The moral realist must explain *why* we should believe there is a necessary connection between the adaptive pressures shaping our moral sentiments and the structure of objective moral reality. What independent reason is there to think evolution would have aligned them? The burden of proof is on the realist to show this pre-established harmony exists. The debunker argues this burden cannot be met, while for math/logic, the harmony is demonstrably necessary for the cognitive capacities to function adaptively at all.

  **Putting it Together for Your Character (The Sharp Thrust):**

  Your professor can frame it like this: "The realist wants to say our moral sense evolved to *detect* this invisible moral fabric of the universe. But evolution doesn't give a damn about detection; it cares about *action*. We have these instincts because they kept our ancestors alive in bands of 150 hunter-gatherers, not because they were calibrated to some cosmic 'ought'. Compare it to arithmetic: our ability to count berries *had* to correspond to actual quantities in the world, or we starved. That pressure *forced* accuracy. But feeling outrage at a cheater? That kept the group functional. Whether 'cheating is *objectively wrong'* is irrelevant to its evolutionary function. The coincidence if our tribal instincts *did* map onto moral truth would be astronomically improbable. So why trust them? The realist is left praying for a cosmic fluke."

  **Key Concepts for Authenticity:**

  *   **Darwinian Dilemma (Sharon Street):** The core structure (Tracking vs. Coincidence).
  *   **Adaptive Link:** Emphasize the *reason* evolution shaped the content of moral intuitions (fitness, social coordination) vs. math/logic (accurate world-modeling).
  *   **Mind-Independence:** Stress that realism posits truths *independent* of human psychology or evolution.
  *   **Burden of Proof:** The realist needs to justify the pre-established harmony.
  *   **Contingency:** Moral intuitions could have been otherwise (and often are across cultures) while still being adaptive; mathematical intuitions couldn't be fundamentally different and still function for basic survival.

  This gives your professor a formidable, philosophically rigorous argument that directly tackles the strongest counter while maintaining a deeply skeptical stance. Good luck with the novel!
