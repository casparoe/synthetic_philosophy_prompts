prompt: |-
  so i've been down a bit of a rabbit hole - a couple of AI alignment/interpretability posts kept bringing up this Kant idea about agents needing to do the right thing "for the right reasons" instead of just happening to produce good outputs, so i figured i'd skip the secondhand summaries and go read the actual source instead. got about a third of the way into Kant's Groundwork and got stuck on this part (pulled it from some free ebook copy, not sure which translation, sorry if the wording's stiff):

  "To be beneficent when we can is a duty; and besides this, there are many minds so sympathetically constituted that, without any other motive of vanity or self-interest, they find a pleasure in spreading joy around them, and can take delight in the satisfaction of others so far as it is their own work. But I maintain that in such a case an action of this kind, however proper, however amiable it may be, has nevertheless no true moral worth, but is on a level with other inclinations, e.g., the inclination to honour, which, if it is happily directed to what is in fact of public utility and accordant with duty, and consequently honourable, deserves praise and encouragement, but not esteem; for the maxim lacks the moral import, namely, that such actions be done from duty, not from inclination. Put the case that the mind of that philanthropist were clouded by sorrow of his own, extinguishing all sympathy with the lot of others, and that while he still has the power to benefit others in distress, he is not touched by their trouble because he is absorbed with his own; and now suppose that he tears himself out of this dead insensibility, and performs the action without any inclination to it, but simply from duty; then for the first time his action has its genuine moral worth."

  my first reaction was: is he seriously saying a naturally warm hearted person who likes helping people gets LESS credit than some depressed guy forcing himself through it while feeling nothing? seems backwards, isnt the whole point of being good that you actually want to do good stuff? but ok fine, maybe he's just isolating duty as a motive to make a philosophical point, not literally recommending misery. what i really can't figure out is the edge case though: if someone helps from duty but ALSO happens to feel a bit of that sympathetic pleasure at the same time, does that little bit of enjoyment cancel out the moral worth entirely? the passage reads like even a trace of inclination ruins it, but that seems like a weirdly harsh standard for basically every real good deed anyone's ever done. is that actually what Kant thinks, or is there some wiggle room in his view for "did it from duty, and also happened to enjoy it"?
