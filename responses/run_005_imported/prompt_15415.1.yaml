  Also, the user might wonder about practical implications. In ML, models can be useful even if not perfectly calibrated, but philosophy demands coherence for rationality. The argument isn't about practical utility but about epistemic responsibility. The legitimacy of scoring rules in philosophy is based on avoiding manipulation and ensuring that accuracy incentives align with truth.

