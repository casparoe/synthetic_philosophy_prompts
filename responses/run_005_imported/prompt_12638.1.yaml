  **Key Philosophical Corrections for Your Reference:**  
  1.  **Wallace's Nonconsequentialism:** He argues hypocritical blame is wrong because the blamer lacks the *moral authority* to demand compliance from others when they themselves flout the same norm (a fairness/authority issue), *not* because it’s ineffective (*Racism, Blame, and Moral Ignorance*, Wallace 2019).  
  2.  **Blameworthiness Unchanged:** The second line-cutter’s moral status is untouched by the hypocrite’s exposure. Their act was wrong, and they remain blameworthy *by others* (or their own conscience). Only the *hypocrite's standing* to blame is nullified.  

