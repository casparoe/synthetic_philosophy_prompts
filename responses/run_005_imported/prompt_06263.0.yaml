  Hmm, I need to analyze the grammatical and logical differences. The first line uses a real conditional: "if Marcus didn't... one of the other four did." This is about a factual scenario—either Marcus did it or someone else did. It's a closed past event. The detective is stating that the poisoner is definitely one of those five people. 

  The second line uses a counterfactual conditional: "if Marcus hadn't... one of the other four would have." The "hadn't" and "would have" structure indicates a hypothetical situation that didn't happen. Since Marcus is confirmed as the culprit, the speaker is reflecting on what could have happened. This adds dramatic irony and suggests the inevitability of the murder—even without Marcus, another person might have done it, perhaps implying a conspiracy or deeper motive. 

