answer: |-
  You're absolutely right—these sentences are **fundamentally different in logic and dramatic purpose**, and your critique partner is missing a crucial nuance. This isn't redundancy; it's a deliberate shift in perspective reflecting the detective's changing understanding of the case. Here's the breakdown:

  1.  **The First Sentence (Early On): Real Conditional - Factual Investigation**
      *   **"If Marcus didn't spike the wine, one of the other four people at that table did."**
      *   **Logic:** This is a **real conditional** about the *past*. It deals with *uncertain facts*.
          *   **"If Marcus didn't..."**: The detective doesn't know if Marcus did it or not. Both possibilities (Marcus did it / Marcus didn't do it) are still open.
          *   **"...one of the other four did."**: This states a *known fact*: the poisoning *definitely happened*, and the perpetrator *must* be one of those five people. It's a statement of exclusion: no outside agent was possible. This is core investigative logic.
      *   **Dramatic Purpose:** Establishes the closed circle of suspects and the certainty that the crime occurred within that group. It's about narrowing the field based on evidence available *at that time*.

  2.  **The Second Sentence (Near the End): Counterfactual Conditional - Reflective Certainty**
      *   **"If Marcus hadn't spiked the wine, one of the other four would have."**
      *   **Logic:** This is a **counterfactual conditional** (specifically, a *third conditional*). It deals with a *hypothetical past* that **did not happen**.
          *   **"If Marcus hadn't..."**: We *now know* Marcus *did* do it. This sets up a scenario contrary to the known fact.
          *   **"...one of the other four would have."**: This speculates on the *inevitable outcome* of that hypothetical scenario. It's not stating a fact about what *did* happen, but a strong belief about what *would* have happened *if* the known facts were different. It implies that the murder was destined to occur, perhaps due to motive, opportunity, or a conspiracy among the others that existed independently of Marcus's actions.
      *   **Dramatic Purpose:** Shifts from factual investigation to thematic reflection. It underscores the *inevitability* of the murder. It suggests that the victim was doomed regardless of Marcus's specific actions, adding weight to the motive or the toxic environment. It often creates dramatic irony for the reader, who now understands the full picture the detective is reflecting on.

  **Why Swapping Them Feels Wrong (As You Noticed):**

  *   **Using the Counterfactual Early:** "If Marcus hadn't spiked the wine, one of the other four would have." This implies *at the start* that Marcus *did* do it! It jumps to the conclusion the detective hasn't reached yet. It sounds like the detective assumes Marcus's guilt prematurely.
  *   **Using the Real Conditional Late:** "If Marcus didn't spike the wine, one of the other four did." Once Marcus's guilt is confirmed, this sentence becomes nonsensical or misleading. It suggests the detective is *still* entertaining the possibility Marcus *didn't* do it, undermining the climax. It states a hypothetical ("if Marcus didn't...") that the detective *knows* is false, making the "then" clause irrelevant to the confirmed reality.

  **What to Tell Your Critique Partner:**

  "These lines aren't redundant; they serve distinct narrative and logical purposes reflecting the detective's evolving knowledge:

  1.  **Early Line (Real Conditional):** This establishes the *factual investigative framework*: the crime *did* happen, and the perpetrator *must* be one of the five. It's about excluding possibilities based on known evidence at that stage. Marcus's guilt is still uncertain.
  2.  **Late Line (Counterfactual Conditional):** This is the detective reflecting *after* knowing Marcus *is* guilty. It's not about facts anymore, but about the *thematic weight* and *inevitability* of the crime. It asks, 'What *would* have happened *if* things were different?' implying the murder was destined regardless of Marcus's specific role. Swapping them creates logical inconsistencies with the plot's progression."

  **Recommendation:**

  Keep both lines. They are excellent examples of how subtle grammatical shifts (real conditional vs. counterfactual conditional) can powerfully convey shifts in certainty, perspective, and thematic depth within a narrative. The second line, in particular, adds a layer of chilling inevitability or conspiracy that elevates the ending beyond just identifying the culprit. If anything, you could *slightly* tweak the second line to make its counterfactual nature even clearer if you fear readers might miss it (e.g., "If Marcus *hadn't* spiked the wine... one of the others *surely would have*."), but the core distinction is already there. Don't cut one randomly – they each do vital work.
