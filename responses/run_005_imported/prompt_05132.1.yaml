  **Why your feeling wasn't paranoia:**

  You were right to sense something was "off" at the end. Theo's answer starts very strong but stumbles significantly in Part 3. His Lockean interpretation fundamentally misrepresents Aquinas's basis for political authority (Natural/Divine Law vs. popular contract) and leads him to an incorrect conclusion about the permissibility of killing a tyrant that directly contradicts Aquinas's explicit teaching in the *Summa Theologiae*. This is a substantive error impacting the core philosophical justification and practical application Aquinas provides.

  **Recommendation for Theo:**

  Theo should revise the final section to:
  1.  **Drop the Locke/social contract comparison.** Focus on Aquinas's *actual* reasoning: the tyrant violates the Natural Law/Divine purpose of government (the common good), making *him* the cause of sedition (disunity/disorder).
  2.  **Clarify the consequence.** Emphasize that while overthrowing the tyrant isn't sedition *itself*, the *means* of removal are strictly limited. Only public authority can act against a ruler who was legitimately installed. Private killing is forbidden.
  3.  **Refine the "authority isn't real" point.** For the usurper, authority was never legitimate. For the legitimate ruler turned tyrant, the *exercise* of authority is illegitimate/unjust, but the *title* (and thus the requirement for due process by higher/public authority for removal) remains a complex factor for Aquinas. His authority *forfeits its moral claim to obedience*, but the *legal/constitutional mechanism* for removal is still crucial.
