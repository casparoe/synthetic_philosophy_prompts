  But we can't ignore genetics entirely. The memo should mandate genomic monitoring and set thresholds (e.g., if wolf ancestry drops below X%, revisit). Also, explore legal avenues—maybe amend the statute to clarify "species" includes hybrids?  

  *Pauses* Wait, the user said "concrete timetable." So: 1-year genomic assessment, 3-year DPS evaluation. And be blunt: if we protect this, it's prioritizing ecological function over genetic purity. Landowners deserve that honesty.  

