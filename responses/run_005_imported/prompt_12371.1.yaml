prompt: |-
  Hey, I'm putting together tomorrow's seminar on Schopenhauer's philosophy of music (WWR Book 3, §52) and theres a move in the text I've never been able to explain well to students, so before I stand up and bluff my way through it again I want to run it past you.

  Early in §52 (Haldane/Kemp translation) he writes:

  "since our world is nothing but the manifestation of the Ideas in multiplicity, though their entrance into the principium individuationis [...], music also, since it passes over the Ideas, is entirely independent of the phenomenal world, ignores it altogether, could to a certain extent exist if there was no world at all, which cannot be said of the other arts. Music is as direct an objectification and copy of the whole will as the world itself, nay, even as the Ideas, whose multiplied manifestation constitutes the world of individual things. Music is thus by no means like the other arts, the copy of the Ideas, but the copy of the will itself, whose objectivity the Ideas are."

  Fine so far -- music short-circuits the whole Idea-mediated apparatus that governs painting, architecture, tragedy, etc. But two paragraphs later he says this:

  "I recognise in the deepest tones of harmony, in the bass, the lowest grades of the objectification of will, unorganised nature, the mass of the planet. [...] Now, further, in the whole of the complemental parts which make up the harmony between the bass and the leading voice singing the melody, I recognise the whole gradation of the Ideas in which the will objectifies itself. Those nearer to the bass are the lower of these grades [...]; the higher represent to me the world of plants and beasts. [...] Lastly, in the melody [...] I recognise the highest grade of the objectification of will, the intellectual life and effort of man."

  That's the exact bit I can never square, no matter how many times I teach it. He spends a paragraph insisting music has nothing to do with the Ideas and would go on being music even in a world with no phenomena at all, and then he hands us this incredibly fine-grained correspondence -- bass to inorganic matter, inner voices to plant and animal life, melody to human rational striving -- which just is the graded hierarchy of the Ideas, mapped note for note. Is there a principled way to read "copy of the will itself" so that this whole analogy isn't secretly smuggling the Ideas back in, or is it a genuine seam in the argument that the word "analogy" is just papering over? Dont just give me the "well both are ultimately grounded in the will, so no real tension" line -- I want to know whether that actually dissolves the problem or just relocates it.
reasoning: |-
