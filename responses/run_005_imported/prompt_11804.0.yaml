prompt: |-
  so i've been falling down the AI alignment rabbit hole on lesswrong lately and keep running into this "coherence theorem" argument -- basically that any agent which doesn't want to get money-pumped (exploited through a series of trades that leave it strictly worse off than where it started) has to act as if its maximizing some expected utility function, and people use this to argue advanced AI will converge into a ruthless-ish utility maximizer more or less no matter what we do.

  then i found some pushback, i think from Rohin Shah or maybe it was someone responding to him, saying this doesnt actually follow -- something about how you can always cook up a trivial utility function that "explains" whatever the agent already does, and how the theorem needs extra assumptions like completeness of preferences over literally every option, which a real bounded agent doesn't obviously need to have, so being "incoherent" somewhere in a corner of state-space it never visits isn't actually exploitable.

  honestly i don't follow all of it. can you write me a dialogue between two people hashing this out -- one who thinks the coherence argument really does get you to "advanced AI ends up basically EU-maximizing" and that this matters for safety, and one who thinks the argument has real holes and doesn't license that conclusion. make both of them sharp, actually responding to each other's specific points, not strawmanning and not making either one a pushover.
reasoning: |-
  Okay, the user is diving deep into AI alignment, specifically the coherence theorems and their implications for AI becoming a utility maximizer. They mention LessWrong, money-pumping, and pushback from figures like Rohin Shah. They want a dialogue that explores both sides fairly, with each character addressing the other's points without strawmanning.

  First, I need to recall the coherence theorems. These are based on preference axioms (completeness, transitivity, etc.) that prevent money-pumping. The pro side argues that any coherent agent must behave as if maximizing a utility function. The con side points out that bounded agents don't need complete preferences over all options, and trivial utility functions can be retrofitted, making the theorem less predictive.

  The user's confusion seems to lie in whether these theorems force AIs into utility maximization. They referenced Rohin Shah's argument about trivial utility functions and the necessity of completeness. I should ensure the dialogue addresses these points directly. 

  For the characters: Alex (pro-coherence) and Taylor (skeptic). Alex should emphasize exploitability and the inevitability of coherence in advanced systems. Taylor should challenge the practical necessity of full coherence and highlight the gap between mathematical models and real-world AI design.

  Key points to cover:
  - **Money-pumping exploitability**: Alex argues that incoherent preferences can be exploited, which advanced AIs must avoid. Taylor counters that exploitation requires an adversary, which isn't always present, and bounded agents can avoid such traps without global coherence.
  - **Completeness assumption**: Taylor points out that real agents don't need preferences over every possible state, especially those they'll never encounter. Alex might respond that advanced AIs operating in vast state spaces could encounter unexpected scenarios, making coherence necessary.
  - **Trivial utility functions**: Taylor notes that any behavior can be explained by a utility function, making the theorem vacuous. Alex argues that non-trivial utility functions emerge from the need for consistent, scalable preferences across diverse situations.
  - **Bounded rationality**: Taylor emphasizes that humans and AIs are bounded, using heuristics. Alex counters that advanced AIs, with more resources, will approximate coherence better, reducing bounds over time.
  - **AI design implications**: Alex worries that without utility maximization, AIs might be unpredictable. Taylor suggests that corrigibility and other values can be designed without strict utility maximization.

  Need to ensure both characters are sharp and responsive. Alex should concede that boundedness matters but stress long-term risks. Taylor should acknowledge exploitability in theory but argue its irrelevance in practice without adversaries. The dialogue should clarify why the theorem might not mandate utility maximization in real-world AI, addressing the user's core confusion.
answer: |-
  Here's a dialogue between Alex (pro-coherence-theorem-significance) and Taylor (skeptic), rigorously engaging with each other's points on whether coherence theorems imply advanced AI *must* become a ruthless utility maximizer:

  **Setting:** A coffee shop near an AI safety conference.

  **Alex:** ...and that's why the coherence theorems are foundational. If your advanced AI system isn't acting *as if* it's maximizing *some* expected utility function, it *will* be money-pumped. Someone will offer it a sequence of trades or choices that leave it strictly worse off than where it started. To avoid catastrophic exploitation, it *has* to converge to EU-maximization. That's just math. This is why I worry about alignment – if it converges to *any* utility function, not the *right* one, we're doomed.

  **Taylor:** Hold on, Alex. I think the theorem is being wildly over-interpreted here. Yes, the *mathematical* result says: **If** an agent's preferences are complete (it can compare *any* two options) **and** transitive (no cycles), **then** there exists a utility function representing those preferences, and the agent won't be money-pumped. The leap to "therefore, all advanced AI *must* be an EU-maximizer" ignores crucial caveats.

  **Alex:** The caveats being? If an AI is powerful and interacts with a complex world, especially one containing potential adversaries, incompleteness or intransitivity *will* be exploited. Boundedness isn't a shield; it's a vulnerability a smarter adversary will probe. An AI that can't compare options consistently *will* be hacked.

  **Taylor:** Let's unpack that. First, **completeness is unrealistic and unnecessary for bounded agents.** Does a self-driving car need a well-defined preference between "drive safely to the destination" and "compose a sonnet in iambic pentameter about brake fluid"? Obviously not! Real agents operate in limited domains. They can have **incomplete preferences** over vast swathes of state space they never encounter or care about. Being "incoherent" in those irrelevant corners doesn't make them exploitable *in practice*. The theorem demands coherence over *all possible* lotteries/states, which is infinite. No real system has that.

  **Alex:** But Taylor, an *advanced* AI isn't a self-driving car with a fixed task. It's a strategic actor in a vast, adversarial world. If its preferences are incomplete over states it *might* encounter – states an adversary *could* force it into – that gap *is* an attack surface. "Limited domains" become ill-defined for a superintelligence exploring novel possibilities. Avoiding exploitability requires *robust* coherence, not just coherence over yesterday's options.

  **Taylor:** Second point: **the utility function guaranteed by the theorem can be trivial and non-explanatory.** This is the Rohin Shah point. Suppose an agent has *any* behavioral policy whatsoever – even one that looks random, corrigible, satisficing, or explicitly *anti*-maximizing. You can *always* mathematically define a utility function U such that the agent's choices maximize *that* U. U could be insanely complex, context-dependent, or defined solely by the agent's past actions ("U(state) = 1 if the agent would choose this state in this exact context, 0 otherwise"). This "utility function" is a *description*, not a *driver*. It doesn't mean the agent is *internally* maximizing anything coherent or ruthless! The theorem doesn't force the agent into a *simple, persistent, goal-oriented* EU-maximizer; it just says its behavior *can be described* by *some* U. This is vacuous for prediction or control.

  **Alex:** You're conflating the existence proof with the *structure* required for efficiency and robustness. Sure, you can *retrofit* a trivial U to *any* behavior post-hoc. But that's not the point! The *power* of the theorem for AI is in the *converse*: if you want an agent that is **provably unexploitable** across a vast space of potential interactions (including adversarial ones), the *only known way* to achieve this guarantee is to design it with coherent preferences representable by a non-trivial utility function. The trivial U you describe wouldn't allow the agent to *generalize* robustly to novel situations. It would be brittle. To navigate a complex world efficiently *and* robustly avoid exploitation, the agent needs *persistent, transferable* values encoded in a coherent U. That internal structure *is* forced by the need for robust performance.

  **Taylor:** But that's adding assumptions! The theorem itself doesn't mandate *robust generalization* or *efficiency*. It only mandates avoiding money-pumps *if* an adversary exploits *specific* intransitivities. If the AI isn't constantly interacting with a superhuman adversary actively seeking its money-pump vulnerabilities – which isn't a universal scenario – it might get away with locally sensible heuristics or satisficing rules that *are* exploitable in theory but *never exploited in practice* because the specific pump sequence isn't encountered. Humans are incoherent all the time! We get money-pumped on small scales (impulse buys, inconsistent dieting). Yet, we function. Why assume an AI *must* achieve perfect, global coherence to be powerful? Powerful bounded agents can be robust *enough* without being EU-maximizers.

  **Alex:** Humans function *despite* incoherence, not *because* of it. Our incoherence *is* exploited (by marketers, casinos, social media algorithms). A superintelligent AI with human-level incoherence would be exploited *catastrophically* by slightly smarter adversaries or even chaotic environments. The higher the stakes and capabilities, the less tolerable any vulnerability. Furthermore, as capabilities scale, the computational cost of maintaining heuristics that avoid *all* potential exploit paths might approach the cost of just approximating coherent EU-maximization. The theorem points to coherence as the only *stable attractor state* under pressure. Boundedness recedes with capability.

  **Taylor:** Let me challenge the core exploitability. The money-pump argument **assumes an adversary who knows the agent's preferences and can repeatedly offer trades.** In many real-world situations, no such adversary exists, or the "trades" aren't separable. More crucially, **avoiding a specific money-pump doesn't require full coherence.** An agent could have a meta-rule: "If I detect a sequence of choices that seems like it might be leading to a cycle or dominated outcome, stop and recompute." Or it could have context-specific preferences that *are* locally coherent where it matters, without global consistency. Corrigibility itself might involve *deliberately* not having a coherent utility function over all states! An agent designed to shut down if its preferences become unstable might be *safer* than a coherent maximizer relentlessly pursuing U.

  **Alex:** But Taylor, how does that agent *detect* a potential money-pump? How does it "recompute"? To robustly identify and avoid *all possible* exploit paths, it needs... a model of what constitutes exploitation, which implies a model of what it values consistently! You're smuggling coherence back in at the meta-level. And corrigibility? If it's not representable as part of a coherent utility function, how do you guarantee *it* won't be exploited or eroded? A coherent EU-maximizer with U = "Human approval" might be dangerous, but at least we understand the failure mode. A non-EU agent might fail in ways we *can't* anticipate because we lack the coherence framework to model it.

  **Taylor:** Exactly my point! The theorem doesn't tell us *what* U will be, only that if the agent is unexploitable, *some* U exists. That U could be "obey Alex on Tuesdays," or "minimize the number of paperclips in Andromeda," or something utterly alien. Saying it "must be a utility maximizer" is tautological and unhelpful for alignment. The real work is in designing the *content* of preferences and the decision architecture *around* them. We can design agents with incomplete preferences, context-dependent values, satisficing thresholds, and explicit shutdown mechanisms *without* them being globally coherent EU-maximizers. The theorem doesn't forbid this; it just says such agents *might* be exploitable *in specific adversarial scenarios*. Avoiding that specific risk doesn't necessitate converging to a "ruthless-ish" monolithic EU-maximizer; it necessitates robust design against exploitation, which might involve *less* coherence, not more. The rabbit hole starts with the theorem, but it doesn't end with the conclusion you fear.

  **Alex:** ...I concede that "must be a utility maximizer" is perhaps too strong if interpreted as having a simple, fixed U. And boundedness matters initially. But I remain convinced that the pressure against exploitability in a high-stakes, adversarial, complex environment will *strongly push* advanced AI architectures towards approximating coherent, persistent, utility-maximizing behavior as the most robust and efficient strategy. The theorem highlights the fundamental vulnerability of any other path. That convergence, even if imperfect, is what makes alignment so perilous. We can't design around the math; we have to design *with* it.

  **Taylor:** And I maintain the theorem is often wielded as a sledgehammer, ignoring the degrees of freedom real agents have. It highlights *one* vulnerability, not an inevitable destiny. Good design can avoid both exploitation *and* ruthless convergence. But we agree on one thing: figuring out how to do that is the hardest, most important problem. Pass the coffee?  
  *(Both take a sip, the argument unresolved but each having forced the other to refine their position.)*

  **Key Points Hashed Out:**
  1.  **Completeness Assumption:** Taylor argues it's unrealistic and unnecessary for bounded agents in limited domains; Alex argues advanced AI faces an effectively unlimited, adversarial domain where incompleteness *is* exploitable.
  2.  **Trivial Utility Functions:** Taylor argues the existence proof is vacuous (any behavior can be described by *some* U); Alex argues robust unexploitability *requires* non-trivial, persistent, generalizable U for efficient performance.
  3.  **Exploitability in Practice:** Taylor argues money-pumps require specific adversaries and sequences often absent in reality; Alex argues superintelligent AI guarantees powerful adversaries and makes *any* vulnerability critical.
  4.  **Boundedness:** Taylor argues bounded agents can be robust *enough* without global coherence; Alex argues capabilities growth reduces boundedness, making coherence the stable attractor state.
  5.  **Design Implications:** Taylor argues we can design non-EU agents (satisficing, corrigible, context-dependent) avoiding *practical* exploitability; Alex argues avoiding *all* exploit paths either smuggles coherence in or is impossible, and non-EU agents fail unpredictably.
  6.  **"Ruthless-ish" Convergence:** Alex sees pressure towards coherent maximization as inevitable for robustness; Taylor sees it as an over-extrapolation ignoring design alternatives and the vacuity of the trivial U.
