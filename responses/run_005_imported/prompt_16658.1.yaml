  Here’s a toast that threads the needle—grounded in your idea, warm-hearted, accessible, and with a built-in joke that works for all audiences. I’ve embedded the philosophy subtly, fact-checked against Searle, and framed it to celebrate Danny and Naomi’s commitment without implying it’s "fake."

  ---

  **(Clink glass gently. Warm smile.)**  

  "Hi everyone. For those who don’t know me, I’m Danny’s brother, and I’ve had the unique privilege of watching him evolve from a kid who tried to pay me in dried macaroni for doing his chores… *(pause for laughter)* …to the man standing here today. And let me tell you, Naomi, you’re getting a way better deal than those macaroni noodles.  

  Now, full disclosure: I got into a *very* long debate last week with our friend Leah—hi, Leah!—about… money. *(Slight chuckle, shake head.)* Yes, money. Specifically, how a piece of paper with a dead president’s face on it somehow convinces a grocery store to give you a cart full of food. It’s just paper! But because we all *agree* it has value, because we all *treat* it like it’s real… it *becomes* real. It works. It builds lives, buys homes, starts businesses. The agreement *makes* it powerful.  

  And it hit me: that’s a lot like what we’re all here for today. Because Danny and Naomi aren’t just standing up here looking incredibly happy and slightly nervous. *(Gesture to them warmly.)* They’re about to do something remarkable. With some words, some rings, a few signatures on a piece of paper, and all of us as witnesses… they’re creating something new. Something powerful. Something *real*.  

  They’re creating a *marriage*.  

  Now, don’t get me wrong—I’m not comparing Danny to a dollar bill! *(Pause for laughter. Look at Danny.)* Though sometimes in college, his wardrobe *did* have that ‘lightly circulated’ vibe... *(Another laugh.)*  

  What I mean is this: Just like that piece of paper only works because we all agree it’s money, a marriage gets its strength from agreement. Danny and Naomi agree to love and support each other. Their families agree to welcome a new member. Their friends agree to be there through thick and thin. And the state agrees to recognize a whole new set of rights and responsibilities.  

  But here’s the crucial part, the part that makes it so much *more* than just an agreement: **The commitment they’re making today isn’t just ink on paper or words in the air.** It’s the *foundation* they’re choosing to build on. That agreement *activates* something profound. It transforms ‘you and me’ into ‘us.’ It turns promises into a shared life. It creates obligations deeper than any legal contract, joys more profound than any shared bank account.  

  Danny, Naomi – your love for each other is the undeniable, beautiful reality at the heart of this. That’s not constructed; that’s just true. But today, you’re taking that truth and you’re *making* something enduring out of it. You’re giving it shape and force and permanence. You’re saying, ‘This counts. This matters. This is real.’ And because you mean it, and because we all stand here supporting you, it *does* count. It *does* matter. It *is* profoundly, powerfully real.  

  So, let’s raise our glasses to Danny and Naomi. To the agreement you make today, backed by the full force of your love. May that agreement be as strong as the finest currency, as valuable as the rarest treasure, and may it buy you a lifetime of happiness together.  

  To Danny and Naomi!"  

  ---

  **Why this works:**

  1.  **Accessibility:** Uses the dollar bill analogy everyone understands. No jargon ("status function," "collective intentionality," "fiat" are implied but never named). Explains the core idea simply: agreement creates real power.
  2.  **Accuracy (Leah-Proof):**
      *   **Searle's Status Function:** Correctly shows how marriage, like money, is a "status function" (X counts as Y in context C) created by collective agreement/intentionality, assigning new rights, obligations, and powers ("us," shared life, legal status).
      *   **Distinguishes Love/Commitment vs. Institution:** Clearly separates the *institution* of marriage (the socially constructed agreement) from the underlying *love and commitment* (presented as the real, non-constructed foundation). This avoids the "it's all fake" implication.
      *   **Avoids the Looping Effect Pitfall:** Doesn't touch race/gender/mental illness comparisons. Stays firmly in the safe territory of money and marriage, where the "agreement" aspect is clear and uncontroversial.
  3.  **The Joke:** The macaroni money joke lands universally (funny visual, relatable sibling dynamic). The "lightly circulated" wardrobe joke is gentle and affectionate ribbing appropriate for a brother.
  4.  **Warmth & Focus:** Keeps the focus squarely on Danny and Naomi, their love, and the significance of the commitment they are making *today*. The philosophy serves the celebration, not the other way around.
  5.  **Length & Flow:** Designed for roughly 4-5 minutes spoken, with natural pauses for laughter and emphasis. Moves from lighthearted intro -> relatable concept -> application to marriage -> heartfelt sentiment -> toast.

  **Delivery Tip:** Lean into the warmth and sincerity, especially when talking about their love being the foundation and the transformation into "us." Look at Danny and Naomi during those parts. The jokes should feel affectionate, not snarky. Good luck! You've got this.
