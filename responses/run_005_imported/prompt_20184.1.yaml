  But wait - moral anti-realists would disagree. They'd say "wrong" here expresses emotional disapproval (like "yuck!") or reflects cultural norms. If that's all morality is, then parroting "factory farming is wrong" without personal conviction might be just as hollow as the art comment. Yet the user doesn't feel that hollowness. Interesting! This suggests they intuitively treat morality as more fact-like than beauty.

