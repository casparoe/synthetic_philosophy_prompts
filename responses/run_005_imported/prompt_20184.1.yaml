answer: |-
  You've hit on a profound philosophical puzzle about *why* we treat different types of claims differently. Let's break down the arguments against trusting aesthetic (beauty) testimony versus moral testimony, step by step, comparing their reasoning:

  ### Core Argument Against Trusting *Aesthetic Testimony* (The "Stunning Painting" Case)
  1.  **The Nature of Aesthetic Judgment:** Aesthetic claims (e.g., "This painting is stunning") aren't primarily about objective facts *in* the object. They express a *subjective, experiential response* triggered by directly perceiving the object. Beauty is a relational property – it emerges from the interaction between the perceiver and the object.
  2.  **The "Acquaintance Requirement":** To genuinely form or possess an aesthetic judgment, you must experience the object *yourself* ("acquaintance"). You need to see the play of light, feel the emotional resonance, grasp the composition – the *qualia* of the experience. This direct encounter is constitutive of the judgment.
  3.  **Testimony's Failure:** When your friend tells you it's stunning, they convey a *proposition* ("The painting is stunning"), but they *cannot transmit the underlying experience* that justifies that proposition for them. You receive the *label* ("stunning") but not the *content* (the felt experience).
  4.  **The "Fakeness" Explained:** Repeating "It's stunning" without the experience is "fake" because:
      *   You lack the *grounds* for the judgment. You haven't undergone the necessary process (direct perception).
      *   You are merely parroting words, not expressing a genuine evaluative state *of your own*.
      *   Your statement misrepresents your epistemic position – it implies you *have* had the experience.
  5.  **Why "It Happens to be True" Doesn't Fix It:** Even if the painting *is* objectively stunning (if such objectivity exists), *your* judgment still lacks the required first-person justification. Knowledge requires appropriate justification, not just true belief. Here, testimony isn't an appropriate justification for an *aesthetic* belief. It might give you true belief *about* your friend's opinion, but not genuine *aesthetic knowledge* about the painting.

  **In short:** Aesthetic judgment *requires* direct experience. Testimony cannot provide that experience, so it cannot ground a genuine aesthetic judgment *for you*. You haven't "earned" it epistemically.

  ### Arguments Regarding *Moral Testimony* (The "Factory Farming is Wrong" Case)
  This is more contested. Let's examine arguments *against* trusting moral testimony (similar to aesthetics) and *for* trusting it (more like the bridge).

  **Arguments *AGAINST* Trusting Moral Testimony (Skeptical View - like Aesthetics):**
  1.  **The Nature of Moral Judgment:** Some philosophers argue that genuine moral judgment requires *understanding the reasons* why something is right or wrong. Morality isn't just about facts; it's about grasping *values*, *reasons for action*, and *justification*.
  2.  **The "Understanding Requirement":** To truly hold a moral belief (e.g., "Factory farming is wrong"), you must grasp *why* it's wrong – the suffering involved, the rights violated, the consequences. You need to appreciate the relevant moral principles and how they apply.
  3.  **Testimony's Failure?:** Merely being told "It's wrong" conveys the *conclusion* but not the *reasons* or *understanding* behind it. You receive the verdict, but not the moral reasoning process.
  4.  **The Risk of "Fakeness":** Repeating a moral claim based solely on testimony could be seen as:
      *   Lacking genuine moral conviction (you don't *feel* the wrongness based on understanding).
      *   Being intellectually lazy or evading your responsibility to engage with moral reasoning.
      *   Potentially misrepresenting your own moral autonomy (acting based on someone else's authority rather than your own reasoned judgment).
  5.  **Analogy to Aesthetics:** Like beauty, understanding moral wrongness might require a kind of "appreciation" that testimony alone can't provide.

  **Arguments *FOR* Trusting Moral Testimony (Permissive View - like the Bridge):**
  1.  **The Nature of Moral Facts:** Moral realists argue that moral statements *can* describe objective facts about the world (e.g., "Causing unnecessary suffering *is* wrong"), similar to "The bridge *is* closed." If morality is objective, then testimony *can* be a legitimate way to learn about these facts, just like learning about bridge closures or historical events.
  2.  **Epistemic Division of Labor:** We constantly rely on experts. We trust doctors about health, engineers about bridges, and historians about the past. Why not trust moral experts (philosophers, trusted community leaders, informed activists) on complex moral issues, especially if we lack time or expertise to investigate deeply ourselves? Accepting "factory farming is wrong" on testimony is like accepting "smoking causes cancer" on medical authority.
  3.  **Practical Necessity:** Morality guides action. We *need* to form moral beliefs to navigate the world. It's impractical and often impossible for everyone to personally reason through every moral issue from first principles. Testimony is a crucial social tool for spreading moral knowledge.
  4.  **The Bridge Analogy Holds (Partly):** If "wrongness" is an objective property (like being closed), testimony *can* convey it. Your belief is justified because your friend is a reliable source about this domain. The feeling of "fakeness" you *don't* experience suggests you intuitively treat morality this way.
  5.  **Understanding Can Come Later:** You might accept the testimony *initially* ("Experts say factory farming involves horrific suffering and is therefore wrong") and then seek deeper understanding later. The initial acceptance isn't necessarily "fake"; it's a reasonable starting point based on trust and the plausibility of the claim.

  ### Which Skepticism Holds Up Better?
  *   **The Skepticism about *Aesthetic Testimony* holds up remarkably well.** The core argument – that genuine aesthetic judgment *constitutively requires* first-hand experience – is very strong. The "acquaintance requirement" is deeply intuitive and difficult to refute. Testimony simply cannot bridge that experiential gap. The feeling of "fakeness" is a direct epistemic symptom of this lack.
  *   **The Skepticism about *Moral Testimony* is much more debatable and arguably weaker.** While the "understanding requirement" has force (blindly parroting moral slogans *is* problematic), the arguments *for* accepting moral testimony are compelling:
      *   **Objectivity:** If morality is objective, testimony *can* transmit moral facts.
      *   **Practicality:** Relying on testimony for moral beliefs is often necessary and rational.
      *   **Expertise:** We *do* legitimately defer to others in complex domains, including morality.
      *   **Your Intuition:** Your own lack of guilt repeating the moral claim suggests you intuitively treat morality as more fact-like and testimony-transmissible than beauty.

  **Conclusion:** The argument to be suspicious of *secondhand aesthetic opinions* ("it's stunning") is fundamentally stronger and more robust than the argument to be suspicious of *secondhand moral opinions* ("it's wrong"). The aesthetic case rests on a unique, non-transferable experiential requirement. The moral case, while raising valid concerns about understanding and autonomy, allows much more room for testimony to be a legitimate source of justified belief, especially if we view morality as involving objective facts or justifiable expertise. Your instinct aligns with this: the aesthetic repetition *feels* unearned in a way the moral repetition does not, reflecting the deeper epistemic difference.
