  ## Memo: Frege Prize Committee Recommendation  
  **To:** Prize Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Re-evaluating the "Frege Prize" Name & a Path Forward  

  ### I. Context  
  The discovery of Frege’s 1924 diary—expressing virulent antisemitism and nationalist extremism—forces us to confront whether attaching his name to our award aligns with our group’s values. While Frege’s contributions to logic and philosophy of language remain foundational, his personal writings reveal a profound moral failure that cannot be ignored.  

  ### II. The Case for Retaining the Name (and Why It Falls Short)  
  **Best Argument for Retention:**  
  *"Frege's work in logic exists in a realm separate from his abhorrent political views. Formal systems like his *Begriffsschrift* operate independently of their creator’s biases. Renaming the prize implies his logical work is tainted by his bigotry, committing the genetic fallacy. We honor Newton despite his alchemy, Heidegger despite his Nazism—focusing solely on their intellectual legacy preserves disciplinary integrity."*  

  **Serious Engagement & Rebuttal:**  
  This argument rightly emphasizes the *autonomy of formal systems*. Logic, like mathematics, is evaluated by internal coherence, not its author’s ethics. However, **a prize is not merely an evaluation of work—it’s an act of commemoration**. Honoring a person involves contextualizing their *whole* legacy. Newton’s physics is taught rigorously, but we don’t name awards after him without acknowledging his complex humanity. Crucially, Frege’s diary isn’t a private failing; it’s a call for violent exclusion targeting the very people our philosophy community must welcome. Retaining his name risks tacitly endorsing the myth of "apolitical" reason—a myth his own life dismantles.  

  ### III. The Case for Renaming (and Its Imperative)  
  **Core Argument:**  
  Philosophy cannot thrive in an environment where members feel alienated by the celebration of a figure who advocated their expulsion or extermination. Frege’s logic may be "pure," but **human reasoning is embodied and ethical**. Glorifying him ignores how his dehumanizing ideology *could* coexist with his formalism—a chilling lesson about the limits of logic without moral grounding. Continuing the prize under his name signals complacency toward his hatred, regardless of intent.  

  ### IV. Recommendation: Rename the Prize, Preserve the Discourse  
  I propose we **retire the "Frege Prize" name** while taking the following steps to acknowledge both perspectives:  

  1. **Establish a New Name**  
     Select a name reflecting shared values (e.g., "The Clarity Prize" to honor precision without idolizing a person, or name it after a local philosopher).  

  2. **Formalize a Critical Lecture**  
     Host an annual lecture on "Logic, Ethics, and the Philosopher’s Burden," using Frege as a case study. This directly addresses the tension: examine how his logic *can* be separated from his politics while confronting why his politics matter.  

  3. **Preserve Frege’s Work in Study**  
     Continue rigorous engagement with his texts. His logic isn’t "cancelled"—it’s studied with clearer eyes, acknowledging his genius *and* his failure.  

  ### V. Why This Path?  
  - **Integrity:** We reject normalizing hatred while affirming logic’s formal value.  
  - **Inclusivity:** No member should wrestle with honoring a figure who wished them erased.  
  - **Philosophical Rigor:** Confronting the Frege paradox deepens our understanding of reason’s relationship to ethics.  

  A prize name is a choice about who we venerate—not just what ideas we admire. We can uphold Frege’s intellectual legacy without venerating the man. Let our award reflect the community we aspire to be: rigorous, humane, and accountable.  

  **Recommended Vote:** Rename the prize; adopt the supplemental actions above.  

  ---  
  *Respectfully submitted for deliberation,*  
  [Your Name]
