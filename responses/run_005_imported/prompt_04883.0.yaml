answer: |-
  ## Commencement Address: The Weight of the Robe

  Faculty colleagues, honored guests, proud families, and most importantly, the remarkable Class of [Year] – congratulations!

  Today brims with the palpable energy of achievement. Years of relentless study, late nights wrestling with dense texts, the thrill of argument honed to a fine edge – it culminates here. You stand poised at the threshold of a noble profession, entrusted with the profound responsibility of upholding the law. Your families beam with a pride earned through your dedication and their unwavering support. Look around you. This moment is a testament to perseverance.

  Yet, this particular spring has cast a longer shadow than most. Our campus, like many, became a forum for passionate protest. Voices were raised, convictions declared with urgency. And some of you, graduates sitting before me today, found yourselves on the front lines of that tension. Some accepted citations; others are contesting them. This reality is woven into the fabric of this commencement. To ignore it would be to disregard a significant chapter in your journey and a fundamental question facing you, the newest guardians of our legal system.

  So, we must speak of law, and of breaking it. But let us speak clearly, mindful that while my colleagues might reach for their well-thumbed copies of Rawls, many beloved parents and family members simply see their child, perhaps in unfamiliar circumstances. The distinction we need isn't about generic courage or conviction – standing up for what you believe is vital, but it isn't the whole story for a lawyer. The crucial distinction lies between **civil disobedience** and **ordinary lawbreaking**. Understanding this difference isn't academic hair-splitting; it’s central to the mantle you are about to assume.

  Ordinary lawbreaking is, simply, a violation. It might be impulsive, self-serving, or driven by disregard for the rules that bind a community. Its consequences are personal, its impact often confined. Civil disobedience, however, is something else entirely. It is a deliberate, public, and profoundly *legal* act in spirit, even as it technically breaks a specific statute. Think of it not as rejecting law, but as appealing to a *higher* law, or to the conscience of the law itself.

  What marks this difference? Consider three pillars – not abstract theory, but observable actions:

  1.  **The Appeal:** Civil disobedience isn't a private grievance. It shouts its message publicly, clearly, demanding that the community *see* an injustice embedded within its own system. It says, "Look here! This law, this practice, betrays the very principles of justice we claim to hold dear!" It aims not to evade the system, but to engage it at its deepest level – its conscience.
  2.  **The Context:** It arises not from chaos, but from a bedrock belief *in* the possibility of justice *within* the existing framework. The civil disobedient acts precisely because they believe the system *can* be better, that it possesses the capacity for reform, that its foundations are sound even if this particular wall is crooked. It’s an act of fidelity, however painful.
  3.  **The Price:** Here is the most telling sign, the one that separates principle from defiance. True civil disobedience embraces the *consequences*. It walks knowingly into the arms of the law it has technically violated. Accepting arrest, citation, or punishment isn't defeat; it is the ultimate testimony. It demonstrates profound respect for the *rule of law itself*. It says, "I break this specific rule to highlight a greater wrong, and I submit to your authority to show that my quarrel is not with law *as such*, but with *this* law, *this* injustice." It’s a sacrifice offered to prove the sincerity of the appeal.

  This distinction matters immensely *for you*, now. Within the year, you will stand before a court, raise your right hand, and swear an oath to uphold the Constitution and the laws of this state and nation. You will become officers of the court, stewards of the very system some of you challenged this spring.

  Does this make you hypocrites? Only if you fail to grasp the weight of the robe you are about to don. That oath isn't a promise of blind obedience to every statute, past, present, and future. It is a commitment to the *ideal* of law as the foundation of a just society. It is a commitment to work *within* the system – through advocacy, litigation, legislation, and, yes, sometimes through challenging its flaws with the courage of your convictions – to bend that system ever closer to justice.

  Your experiences this spring, whatever your role, have given you a visceral understanding of law’s power and its potential imperfections. You’ve seen how passion collides with order. Some of you felt the weight of the state's hand on your shoulder. This is not a stain; it is an education. The challenge now is to translate that experience, that passion, into the meticulous, demanding, and often slow work of the law.

  To those who engaged in protest: Carry forward the fire of your conviction, but temper it now with the tools of your profession. Use the law, master its intricacies, argue persuasively within its halls. Your task is harder now: not just to point out the gap between law and justice, but to build the bridge across it. And remember the third pillar – the willingness to accept consequence. That spirit of accountability must now infuse your entire professional life.

  To all of you: The law is not a static monument. It is a living conversation, a constant argument striving towards a more perfect union. It needs not just technicians, but guardians – guardians who understand its power, its fragility, and its immense potential. Guardians who know that fidelity to law sometimes demands the courage to challenge it *principledly*, and always demands the integrity to uphold it *responsibly*.

  You stand at the beginning of an extraordinary journey. You will draft arguments that shape lives, advise clients through their most difficult hours, and perhaps one day, sit on the bench or shape legislation. Wherever your path leads, carry this dual responsibility: the unwavering passion for justice that brought you to law school, and the solemn commitment to the rule of law that defines the profession you now enter.

  Congratulations, Class of [Year]. May your passion be matched by your wisdom, your courage by your integrity, and your commitment to justice be expressed through your profound respect for the law you are now called to serve. Go forth, and argue well. Build well. Serve well.
