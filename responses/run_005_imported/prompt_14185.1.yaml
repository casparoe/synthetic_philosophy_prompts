  The memo needs to balance these aspects. Recommending the lottery this time but proposing a policy where only pre-specified, objective criteria can override ties in the future. That way, the council has clear rules, avoiding ad hoc justifications. Highlighting the strongest argument for Harsanyi's approach shows respect for the member's point while explaining why it's not suitable here.

  Also, the user mentioned the Swiss National Science Foundation model. Sticking to this model reinforces consistency. Emphasizing procedural fairness and the council's prior decision to use lotteries is crucial. The memo should be concise, authoritative, and provide clear steps for resolution and future policy.
answer: |-
  ## Memo: Resolution Protocol for Tied Grant Proposals

  **To:** Graduate Research Council Members  
  **From:** [Your Name/Position]  
  **Date:** [Date before Friday]  
  **Subject:** Resolution of Tied Proposals & Policy Clarification for Future Ties  

  ### I. Summary
  This memo addresses the current tie between Proposal A and Proposal B under our peer review rubric and the subsequent debate regarding the use of Harsanyi's aggregation theorem to override the lottery tie-breaker. I recommend **proceeding with the established lottery** for this cycle. Furthermore, I propose codifying a **strict policy limiting lottery overrides** to pre-defined, objective criteria only. While the argument for maximizing expected social utility (Harsanyi) is theoretically significant, applying it ad hoc undermines the core purpose, fairness, and predictability of our tie-breaking procedure.

  ### II. Recommended Resolution for Current Tie (Proposals A & B)
  **We should proceed with the lottery as planned.** Awarding Proposal A outright based on the identified methodological weakness in B, despite its insufficiency to cause failure under our rubric, constitutes an *ex post facto* adjustment of our evaluation criteria during the tie-breaking phase. This weakness was already known and factored into the scoring that resulted in the tie. Our policy explicitly reserves the lottery for precisely this scenario – when proposals are judged *equally meritorious* under our defined rubric. Deviating now sets a problematic precedent where any perceived asymmetry, however minor or subjectively interpreted, could be used to circumvent the lottery, effectively nullifying it. The integrity of our process demands we honor the tie-breaking mechanism we established.

  ### III. Proposed Policy for Future Comparable Ties
  To prevent ambiguity and ensure consistent, fair application of the lottery principle, I propose we adopt the following formal policy amendment, effective immediately after this cycle:

  > **Policy Amendment: Tie-Breaking Lottery Override Criteria**
  > 1.  **General Principle:** Proposals achieving an identical final score under the Council's approved peer review rubric are deemed tied and shall be resolved by lottery.
  > 2.  **Exceptions (Overrides):** The lottery may be overridden *only* if one proposal demonstrably fails to meet a **pre-specified, mandatory eligibility criterion** outlined in the grant call or Council bylaws *that was not already assessed in the scoring rubric*, or if there is an unambiguous, **objective administrative error** in applying the rubric (e.g., miscalculation of scores).
  > 3.  **Prohibited Overrides:** Overrides based on:
  >     *   Subjective reinterpretation or re-weighting of rubric criteria after scoring is complete.
  >     *   Arguments concerning marginally higher "expected utility," "social welfare," or similar aggregate benefit calculations not captured by the original rubric.
  >     *   Minor weaknesses or strengths already implicitly or explicitly considered within the existing scoring categories.
  > 4.  **Invocation Process:** Any member proposing a lottery override must identify the specific pre-defined eligibility criterion not met or the specific administrative error, supported by documented evidence. A formal vote of the Council is required to approve the override.

  This policy ensures the lottery remains the default for true ties, preserving its purpose of fairness and respecting reviewer limitations. Overrides are restricted to clear, objective failures or errors, preventing subjective post-hoc justifications from eroding the system.

  ### IV. Fair Hearing: The Argument for Applying Harsanyi's Theorem (Overriding the Lottery)

  The member advocating to award Proposal A outright based on Harsanyi's aggregation theorem presents a **cogent and theoretically grounded argument** that deserves serious consideration. Its core strength lies in its foundation in welfare economics and rational choice:

  1.  **Maximizing Expected Social Welfare:** Harsanyi's theorem provides a rigorous framework for aggregating individual utilities (here, the Council members' judgments of societal benefit from the research) into a social welfare function. If Proposal A genuinely offers a higher *expected* payoff to the university/research community – even marginally – due to the identified, non-fatal weakness in Proposal B, Harsanyi suggests that maximizing this expected social utility is the ethically defensible choice. Ignoring this known difference, the argument goes, is irrational from a social welfare perspective.
  2.  **Avoiding Arbitrary Outcomes:** The lottery introduces an element of randomness. The Harsanyi argument posits that we have a rational basis (the expected payoff difference) for preferring one outcome over the other. Choosing the lottery when a deterministic, welfare-improving choice is identifiable could be seen as shirking our responsibility to make the best possible decision with the available information.
  3.  **Efficiency & Avoiding Waste:** Awarding based on the higher expected payoff directly allocates resources to where they are predicted to yield greater benefit, aligning with principles of efficient resource allocation. The lottery risks assigning the grant to the proposal with the marginally lower expected return, representing a potential (however small) social welfare loss.

  **This argument is powerful because it appeals to rationality, efficiency, and the ultimate goal of maximizing the benefit derived from our limited grant funds.** It challenges whether strict adherence to procedural fairness (the lottery) should always trump a known, quantifiable difference in expected outcome when making consequential decisions.

  ### V. Why the Harsanyi Argument Does Not Prevail Here (Despite its Strength)

  While the Harsanyi argument is intellectually compelling, applying it in this specific context is problematic for our institutional process:

  1.  **Contradicts the Rationale for the Lottery:** The lottery was explicitly adopted *because* we recognized that reviewers (and the Council) cannot reliably make finer distinctions beyond the level of granularity captured by our rubric. Invoking Harsanyi based on a marginal difference identified *after* scoring completes effectively asks us to make precisely the kind of unreliable, ultra-fine distinction the lottery was designed to avoid. It reintroduces the subjectivity and potential bias the lottery seeks to neutralize.
  2.  **Undermines Predictability and Fairness:** Grant applicants rely on understanding the rules of the competition. Our rubric defines merit. If proposals meet the threshold and tie on that defined merit, the promise of an equal chance via lottery is a core element of fairness. Allowing overrides based on post-hoc utility calculations undermines this promise and creates uncertainty. Applicants who "tie" effectively lose if *any* asymmetry can be found and argued to imply higher utility.
  3.  **Slippery Slope & Subjectivity:** The "modestly higher expected payoff" argument is inherently difficult to quantify objectively in this context and relies on interpretation. What constitutes a sufficient difference? Who determines the "expected payoff"? Opening this door invites endless debate in future ties, as members will inevitably find *some* asymmetry to argue favors their preferred outcome. This erodes the objectivity and finality the lottery provides.
  4.  **Operationalizing Harsanyi is Impractical:** Harsanyi requires cardinal interpersonal utility comparisons – an extremely demanding requirement. Our review process (like most) yields ordinal rankings or scores, not the precise cardinal utility measures needed to strictly apply the theorem. Attempting to apply it here is more of a metaphorical appeal than a rigorous implementation.

  ### VI. Conclusion & Recommendation

  Respectfully, while the invocation of Harsanyi's theorem highlights a desire to make the most beneficial decision, it is incompatible with the practical fairness and operational integrity of our established tie-breaking procedure. **I strongly recommend:**

  1.  **Resolve the current tie between Proposal A and Proposal B via lottery** at Friday's meeting, as originally planned.
  2.  **Formally adopt the proposed Policy Amendment on Tie-Breaking Lottery Override Criteria** to provide absolute clarity for future cycles, ensuring the lottery is only bypassed for clear, objective, pre-defined reasons unrelated to post-hoc utility assessments.

  This approach honors our commitment to procedural fairness, maintains the integrity of our peer review process, and provides a clear, predictable framework for applicants and Council members alike. I look forward to discussing this at Friday's meeting.
