  Next, vulnerability to objections. Gaunilo's island: Anselm might struggle because greatness is vague, allowing arbitrary concepts. Gödel's positivity could exclude properties like "island-ness" as non-positive, but defining positivity is subjective. Kant's existence as a predicate: Anselm treats existence as a property adding greatness, which Kant critiques. Gödel sidesteps by making necessary existence part of God's essence derived from positive properties. But if existence isn't a predicate, Gödel's essence definition might still fall prey. The formalization shifts the debate to the acceptability of axioms.

