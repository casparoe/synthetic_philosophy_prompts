prompt: |-
  I got roped into serving on my university's academic integrity board this year (I'm just a staff member, no philosophy background or anything, though I did fall down a blog rabbit hole a while back about this idea called "common knowledge" and it's honestly never really left my head since). We've got a real case in front of us now where I think that idea actually applies, and I need to walk into Thursday's meeting with an actual recommendation, not just a gut feeling.

  Here's what happened: our intro stats final, like 300-some students, got compromised when someone posted a photo of the answer key to a Discord server about an hour before the last of three staggered exam sessions closed. Server logs suggest maybe a third of the class saw it, but there's basically no clean way to prove who actually used it versus who saw it and ignored it, sorting that out person by person would take a month of hearings on its own. Meanwhile it's become the worst kept secret on campus -- its all over the group chats, the whole class has basically heard by now, and alot of us on the board privately suspected the scale of it even before the logs confirmed anything. Half the board wants to quietly investigate the handful of provable cases and never put out anything official about how big the leak was, on the theory that "everyone already basically knows, so an official statement doesn't tell anyone anything they don't already believe." The other half thinks that's missing something -- that a rumor everyone privately half-believes isn't the same as the university actually confirming it, and that the confirming part is specifically what would let the class do something collectively, like demand the exam get voided for everyone, instead of every student individually assuming nobody else would back them up. I mentioned this to a friend doing a CS PhD and he said something about "the two generals problem" and how everyone knowing something isn't the same as it being common knowledge, but he lost me before he could explain why that would actually matter here.

  Could you write the actual memo I'd bring to the board? I need a real recommendation -- confirm the scale publicly, keep it quiet and case by case, or some third option -- with a real timeline attached, since final grades are due in three weeks. And I need it to actually engage with the "it's not new information so it shouldn't matter" side rather than just brushing past it, because that's what half the room believes and I won't get anywhere if I can't respond to it directly.
reasoning: |-
  Okay, let me unpack this academic integrity dilemma. The user is a staff member on the board dealing with a leaked stats exam answer key, and they're stuck between two approaches: quiet case-by-case investigations versus public confirmation of the breach's scale. They mentioned falling down a "common knowledge" rabbit hole before, and now that concept seems relevant here. 

  Hmm, the key tension is about information asymmetry. Half the board thinks since everyone already suspects the leak, confirming it publicly wouldn't add value. The other half argues that without official confirmation, students can't coordinate collective action. The CS friend's "two generals problem" reference is spot-on—it's about coordinated action requiring common knowledge. 

  I recall that common knowledge isn't just "everyone knows." It's "everyone knows that everyone knows that everyone knows..." recursively. That changes everything here. Without official confirmation, students might individually suspect the leak but can't be sure others know or would act. That prevents group action like demanding a voided exam. 

  The timeline is tight—three weeks to final grades. A case-by-case investigation seems impossible with 300 students and no clean way to prove who cheated. Even Discord logs only show who saw the key, not who used it. Pursuing that route would be a logistical nightmare and likely inconclusive. 

  The user needs a memo that respectfully counters the "no new information" argument. I should explain why official confirmation creates common knowledge, enabling collective student agency. The recommendation should be to publicly confirm the breach scale while voiding the exam entirely—that's the only fair solution given the circumstances. 

  Also, the user seems stressed about Thursday's meeting. They need concrete talking points to sway colleagues, not just theory. I'll structure the memo to first validate both sides' concerns, then dismantle the "no new information" stance with the common knowledge framework, and end with a clear action plan and timeline. 

  The third option—voiding the exam—actually solves multiple problems: it avoids unfair investigations, respects students who didn't cheat (by removing the advantage), and restores academic integrity through a new assessment. The "common knowledge" angle makes this more than just damage control; it's about empowering the community. 

  ... Wait, should the memo mention consequences for the leaker? Probably not, since that's separate from the breach's scale. Focus on the collective impact. 

  Final structure: problem summary, common knowledge explanation, rebuttal to "no new info," recommendation with timeline. Keep it professional but accessible—no philosophy jargon.
answer: |-
  ## MEMORANDUM  
  **TO:** Academic Integrity Board Members  
  **FROM:** [Your Name], Staff Member, Academic Integrity Board  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation Regarding STAT 101 Answer Key Breach - Public Confirmation & Collective Action  

  ### 1. The Situation & Board Tension
  *   **Breach:** Answer key for STAT 101 final exam (300+ students) posted to Discord ~1 hour before final session ended.  
  *   **Exposure:** Discord logs indicate ~100 students potentially viewed it; campus-wide rumors confirm near-universal awareness.  
  *   **Investigation Challenge:** Proving *individual use* vs. mere *access* is functionally impossible within our 3-week grading deadline.  
  *   **Board Debate:**  
      *   **Position A:** Quietly pursue provable individual cases. No public statement on scale ("Everyone already knows/assumes").  
      *   **Position B:** Publicly confirm the breach's scale to enable collective student action (e.g., exam voidance petition).  

  ### 2. Why "Everyone Knows" Isn't Enough: The Common Knowledge Gap
  The core disagreement hinges on whether private belief equates to actionable certainty. **It does not.** Here's why "common knowledge" matters:  

  *   **"Common Knowledge" ≠ "Everyone Knows":**  
      *   **"Everyone Knows (Privately)":** Each student suspects the leak happened and that others *might* know.  
      *   **"Common Knowledge":** *Everyone knows that everyone knows that everyone knows...* the fact is true *and* that this shared awareness is universal. It requires a definitive, public signal.  

  *   **The "Two Generals Problem" Analogy (Simplified):**  
      Imagine two armies needing to attack simultaneously to succeed. Each general *suspects* the other is ready, but without a confirmed, *irrevocable* message received by both, neither can *rely* on the other attacking. Uncertainty prevents coordinated action.  

  *   **Applied to Our Case:**  
      *   **Without Official Confirmation:**  
          *   Student A suspects the leak was big and that others know.  
          *   But Student A *doesn't know* if Student B *knows* that *Student A knows*.  
          *   Student A fears being isolated – "If I complain, will anyone else back me up? Or will I look foolish/accusatory?"  
          *   **Result:** Collective inaction. Students assume others won't act, so no one acts. Individual complaints are isolated and easily dismissed.  
      *   **With Official Confirmation:**  
          *   The University's statement creates **Common Knowledge**.  
          *   *Every student knows the scale is confirmed.*  
          *   *Every student knows that every other student knows it's confirmed.*  
          *   **Result:** Enables coordinated response. Students can organize petitions, demand collective remedies (like voiding the exam), or engage in dialogue *based on a shared, undeniable reality*.  

  ### 3. Addressing the "No New Information" Argument
  The argument that "an official statement doesn't tell anyone anything new" **overlooks the transformative power of authoritative confirmation:**  

  *   **Private Suspicion vs. Public Fact:** Rumors are deniable and mutable. An official statement converts widespread suspicion into an immutable institutional fact.  
  *   **Reducing Uncertainty & Enabling Trust:** It eliminates the paralyzing doubt ("*Does* everyone else *really* know? *Will* they act?"). This shared certainty fosters the trust needed for collective action.  
  *   **Shifting Agency:** It moves the burden from isolated individuals ("Prove *I* was disadvantaged!") to the collective ("This *systemic* breach invalidates the assessment for *all*").  
  *   **Institutional Accountability:** Silence implies the University either doesn't know the scale, doesn't care, or hopes it will blow over. Confirmation demonstrates responsibility and transparency.  

  ### 4. Recommendation: Public Confirmation & Collective Remedy
  Pursuing individual cases is impractical and inequitable. Silence perpetuates distrust and inaction. Therefore:  

  1.  **Public Confirmation (By Monday, October 30th):**  
      *   **Issue a concise, factual statement** to the entire STAT 101 class (cc: relevant faculty/staff).  
      *   **Content:**  
          > "The Academic Integrity Board confirms that a significant breach occurred involving the unauthorized distribution of the STAT 101 final exam answer key via Discord during the exam period on [Date]. Evidence indicates the material was accessible to a substantial portion of the class. A full investigation into the source is ongoing. This breach fundamentally compromised the integrity of this assessment for the entire class."  
      *   **Why:** Creates **Common Knowledge**, enabling collective student agency and establishing institutional transparency.  

  2.  **Void the Compromised Exam (By Wednesday, November 1st):**  
      *   Declare the current final exam null and void for *all* students.  
      *   **Why:**  
          *   **Fairness:** It's impossible to fairly distinguish impacted vs. non-impacted students or assess who acted with integrity upon seeing the key. All students were subjected to an unfair environment.  
          *   **Academic Integrity:** Upholds standards by rejecting results from a compromised assessment.  
          *   **Practicality:** The *only* feasible solution within the 3-week grading deadline.  
      *   **Alternate Assessment (By Friday, November 3rd):**  
          *   Instruct the STAT 101 teaching team to develop a **new, equivalent final assessment** (e.g., a new exam, a major project, adjusted weighting of existing work).  
          *   **Timeline:** New assessment must be completed and graded by **Friday, November 17th** to meet the final grade deadline.  

  3.  **Continue Source Investigation:**  
      *   Pursue identifying the individual(s) who leaked the answer key separately. This is distinct from the collective remedy for the compromised assessment environment.  

  ### 5. Timeline Summary
  *   **Day 0 (Today):** Board approves this approach.  
  *   **Day +2 (Mon, Oct 30):** Public statement confirming breach scale sent to class.  
  *   **Day +4 (Wed, Nov 1):** Official notification: Compromised exam voided; plan for alternate assessment announced.  
  *   **Day +6 (Fri, Nov 3):** Details of alternate assessment finalized & communicated.  
  *   **Day +16 (Fri, Nov 17):** Alternate assessment completed & graded.  
  *   **Day +21 (Wed, Nov 22):** Final grades submitted.  

  ### 6. Why This Approach Works
  *   **Addresses the Core Problem:** Treats the breach as the *systemic failure* it was, not just individual misconduct.  
  *   **Restores Fairness & Integrity:** Provides a clean slate for *all* students via a new, uncompromised assessment.  
  *   **Practical & Timely:** Avoids an impossible investigation, meets grading deadlines.  
  *   **Builds Trust:** Demonstrates institutional accountability (confirmation) and commitment to fairness (voidance + new assessment).  
  *   **Empowers the Community:** Leverages common knowledge to allow students to process the event collectively.  

  This isn't about punishing the innocent or rewarding the guilty; it's about recognizing that the assessment itself was irreparably tainted for everyone. Public confirmation provides the certainty needed for the community to move forward collectively. I urge the board to adopt this recommendation.  

  **Recommended Motion:**  
  *"Move that the Academic Integrity Board: (1) Publicly confirm the scale and occurrence of the STAT 101 answer key breach to the class by October 30th; (2) Declare the compromised final exam null and void for all students; (3) Direct the STAT 101 teaching team to implement an equivalent alternate assessment with completion and grading by November 17th; and (4) Continue the investigation into the source of the leak separately."*
