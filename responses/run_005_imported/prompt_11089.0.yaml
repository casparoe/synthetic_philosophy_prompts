answer: |-
  Here's the real philosophical tension you've spotted, pitched for dialogue (with scholarly backup below for your reference):

  **Her comeback (calm, slicing through the turkey):**  
  "James, you're confusing the *logical* contradiction in the promise with the *volitional* contradiction in refusing help. The borrower's lie *destroys the very concept it needs to work* – universal false promises make 'promising' meaningless. It's like trying to universalize 'always use invisible ink' – the act vanishes. But your 'simple' version ignores the second test. Refusing help doesn't annihilate the *concept* of help; it creates a world so hostile to human agency that *no rational being could consistently will to exist in it*. We depend on others not by logical necessity, but by biological and practical reality. Willing universal non-help is willing your own potential ruin – that's not logical suicide, it's *practical* self-sabotage. Kant knew the difference mattered."

  **The Breakdown (Why This Works & Isn't Hand-Wavy):**

  1.  **The Two Tests Are Different:** Kant explicitly distinguishes:
      *   **Contradiction in Conception (Perfect Duty):** The maxim *cannot even be thought* as universal law without logical absurdity. (The lying promise: Universal lying destroys trust, making promises impossible. Concept implodes.)
      *   **Contradiction in the Will (Imperfect Duty):** The maxim *can* be conceived universally without logical absurdity, but *you, as a rational being aiming for your own ends, cannot consistently WILL it* because it undermines the conditions of your own flourishing or the very rationality you rely on. (Non-help: A world of universal non-help is conceivable, but you couldn't rationally *choose* to live in it, knowing you might need help yourself.)

  2.  **Why Non-Help Fits "Contradiction in the Will":**
      *   **Rational Agency Depends on Contingent Support:** Kant argues rational beings necessarily will the means to their ends (a principle of practical reason). We are finite, vulnerable beings. Needing help (sickness, accident, basic cooperation) isn't a logical *contradiction* of agency, but it's a *practical inevitability*.
      *   **Willing Universal Non-Help is Self-Defeating:** If you universalize "never help," you are willing a world where *no one helps you* when you inevitably need it. This directly frustrates your own rationally willed ends (survival, projects, happiness). You *will* a principle that systematically destroys the possibility of achieving your *own* goals. That's the "contradiction in the will" – your will is at war with itself.
      *   **"Needing Help" Doesn't Presume Actual Help:** Kant can argue that the *concept* of "needing help" doesn't *logically require* that help is ever actually given. It only requires the *possibility* of needing aid and the *capacity* of others to give it. A barren, hostile world where everyone suffers alone is conceivable (if horrific). The contradiction arises when you try to *endorse* that world as your maxim while simultaneously being a being who *will* need aid.

  3.  **Why Lying-Promise is Different (Contradiction in Conception):**
      *   **The Practice Collapses:** "I will lie when it benefits me to get a loan" *requires* the institution of promising *with* an expectation of truthfulness to exist. Universalizing the lie destroys the trust that makes promising possible *at all*. "Promise" in a world of universal lying is an empty noise, not a meaningful act. The maxim *depends* on the institution it destroys – a direct logical contradiction.

  **The Legitimate Critique (Which She Could Briefly Acknowledge):**

  *   **Is the "Human Frailty" Premise Sneaked In?** Critics (like Schopenhauer, later Hegelians) argued Kant *does* smuggle in empirical facts about human vulnerability to make the non-help case work, while insisting ethics is pure reason. A purely rational being (an angel?) might not need help, so for them, universal non-help *might* be willable. Kant implicitly assumes the rational agent *is* a finite, embodied human.
  *   **Is the Distinction Arbitrary?** Some argue Kant started with intuitions about strict vs. meritorious duties and shaped the tests to fit. The line between "destroys the concept" and "destroys the conditions of agency" can feel fuzzy.

  **How She Might Handle That Nuance (Optional Extra Punch):**

  *James tries to sputter about angels...*
  Her: "James, Kant's ethics is *for rational beings in the world*. Pure reason *applied to practical existence*. Pretending we're disembodied angels debating logic puzzles ignores the 'practical' in practical reason. The CI test *diagnoses* how maxims fail when universalized *for beings like us*. Your 'simple' version amputates half the test and ignores reality."

  **Why This Wins the Thanksgiving Argument:**

  1.  **Accurate:** It correctly identifies Kant's two distinct tests.
  2.  **Non-Hand-Wavy:** Uses core Kantian concepts (rational willing, ends/means, conditions of agency, contradiction types).
  3.  **Exposes the Oversimplification:** Shows the brother-in-law missed the crucial second half of the test and the reality of human rationality.
  4.  **Concise & Punchy:** Fits dialogue, uses vivid metaphors ("logical suicide" vs. "practical self-sabotage," "invisible ink").
  5.  **Acknowledges (Briefly) the Critique:** Shows her depth by hinting she knows the debate without getting derailed.

  **Scholarly Anchor Points:**

  *   **Groundwork II:** The explicit distinction between the two types of contradiction (Ak 4:424).
  *   **Doctrine of Virtue (Metaphysics of Morals):** Develops imperfect duties further, emphasizing promoting the conditions for rational agency (others' happiness as an end).
  *   **Korsgaard, Christine.** *Creating the Kingdom of Ends*: Offers powerful reconstructions of Kant's arguments, especially defending the non-help case as a contradiction based on the *necessary conditions* for pursuing *any* ends (needing help being one such condition).
  *   **Wood, Allen.** *Kantian Ethics*: Provides clear analysis of the different "floors" of contradiction Kant employs.

  Give your philosopher character this ammo. She'll leave her brother-in-law choking on his cranberry sauce (and maybe inspire him to actually read beyond the cliff notes). Good luck with the novel!
