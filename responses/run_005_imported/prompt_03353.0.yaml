answer: |-
  ## The Cambridge Conjuring
  The séance room in Trinity College felt unnaturally cold, the air thick with pipe smoke and the collective, desperate hope of seventeen men. Henry Sidgwick sat rigidly beside Eleanor, his wife’s hand a frail anchor in the velvet dark. Before them, shrouded in deeper shadow, sat Eusapia Palladino, the Neapolitan vessel of the unseen, breathing heavily. The darkness wasn’t mere absence of light; it was the crucible in which Sidgwick had spent a decade trying to forge proof.

  *Proof.* The word echoed in the hollow of his professional exhaustion. His monumental *Methods of Ethics* lay behind him, a cathedral of reason built on shifting sand. He’d mapped the rational demands of duty and self-interest only to find them divergent paths, requiring – for coherence, for *bearability* – a moral guarantor beyond the veil. Philosophy couldn’t build that bridge. Only evidence could. Hence Cambridge, hence the Society for Psychical Research, hence the exhausting, soul-corroding pursuit of phenomena like this.

  The controls were meticulous. Hodgson and Myers flanked Eusapia, each holding a wrist and a knee. Sidgwick himself monitored her feet. The rules were absolute: no uncontrolled movement. Every tremor, every sigh, every rustle was catalogued by minds trained in skepticism. It was this very rigor, Sidgwick’s own intellectual child, that now felt like the bars of a cage he desperately needed to unlock.

  A cold draft stirred near Sidgwick’s ear. A faint, phosphorescent glow materialized above the table. Gasps rippled through the dark. Eleanor’s grip tightened. Sidgwick’s heart hammered against his ribs – a traitorous surge of *hope*. *Could it be? After Amiens? After all the frauds…?*

  "Spirit hand!" Eusapia rasped, her voice thick with effort. "Bringing… light!"

  The glow wobbled, elongated. Sidgwick leaned forward infinitesimally, his scholar’s eye dissecting the luminosity. Was its movement natural? Was the temperature drop localized? He noted the angle, the diffusion. His mind, honed by decades of parsing Kantian imperatives and utilitarian calculus, automatically began constructing alternative hypotheses: phosphorous? Reflected moonlight? *Stop it,* a voice within pleaded. *Just this once, let it be.*

  A distinct *tap* sounded on the table near Myers. Then another. Sidgwick felt the vibration through the polished wood beneath his palms. Eusapia groaned, her body straining against the grips of her controllers. "They… they are strong tonight!" she panted.

  *They.* The impersonal pronoun struck Sidgwick. He needed the *personal*. He needed a signal, a pattern, something irreducible to trickery or collective hallucination. He needed the universe to *declare itself* moral. The taps continued, rhythmic, insistent. Hope, that fragile, persistent weed, pushed through the cracks in his skepticism. *Perhaps… perhaps the convergence is real. Perhaps duty and happiness aren’t eternally sundered…*

  Then, a shift. Eusapia’s breathing hitched. Her restrained leg, the one Hodgson wasn’t holding below the knee, tensed minutely against Sidgwick’s vigilant hand. It wasn’t an attempt to free herself; it was a subtle pressure *downward*, towards the heavy tablecloth pooling on the floor. A fraction of a second later, a cold, disembodied "hand" brushed against Sidgwick’s cheek.

  Simultaneously, his own hand, resting lightly on the draped edge of the tablecloth near Eusapia’s foot, registered a distinct movement *beneath* the fabric. Not a spirit hand. Something else. Something terrestrial. Something *connected*.

  The cold touch on his cheek vanished instantly. The phosphorescent glow flickered and died. The taps ceased. Silence, thick and accusatory, filled the dark.

  Sidgwick didn’t move. His mind, that brilliant, relentless engine, had already processed the correlation: the pressure of her leg, the movement under the cloth, the simultaneous "spirit" touch. Cause and effect. Not ectoplasm, but leverage. Not transcendence, but mechanics. His own methodology, the demand for controls, the observation of minutiae – the very tools he’d insisted upon to validate the phenomenon – had now captured its mundane mechanism.

  A profound weariness settled over him, colder than any séance draft. It wasn’t anger at Eusapia; she was merely human, flawed, perhaps desperate herself. It was the crushing weight of *recognition*. He had, once again, cornered the evidence. And the evidence pointed only to the dark, empty room, to the fallibility of flesh, to the silence beyond the grave.

  He pictured his study, the towering shelves heavy with philosophy texts. He saw the elegant, unanswerable conclusion of the *Methods*: the dualism unresolved. Duty demanded sacrifice, reason demanded self-interest. Only a moral cosmos could reconcile them. He had turned from the library to the séance room, seeking empirical mortar for his ethical architecture. And now, in this Cambridge darkness, his own intellectual rigor had chipped away the final, flimsy brick of plausible hope.

  Hodgson cleared his throat. "Professor Sidgwick? Did you note…?"

  "Yes, Mr. Hodgson," Sidgwick’s voice emerged, surprisingly steady, a dry parchment sound. He didn’t need to elaborate. The movement under the cloth, the timing… it was conclusive. The circle knew. The hope that had flickered moments before guttered out, leaving only the familiar, desolate landscape of his philosophy.

  Eleanor’s hand trembled in his. He squeezed it gently, a gesture of shared sorrow, not comfort. There was no comfort to be found. The sitting dissolved into awkward murmurs, the shuffling of chairs, the reluctant lighting of lamps that revealed only weary faces and a dishevelled medium avoiding their eyes.

  Later, as they walked across the moonlit quad, the ancient stones of Cambridge indifferent beneath their feet, Eleanor whispered, "Henry? What now?"

  He looked up at the vast, indifferent sky, pricked with cold stars. His ethics needed a guarantee. His reason demanded evidence. His heart yearned for an assurance philosophy couldn’t give and psychical research, under his own exacting standards, consistently failed to provide. The dualism yawned before him, wider than the River Cam.

  "Now, my dear," he said, the words tasting of ashes, "I must report the findings. Withdraw our support. The evidence…" He paused, the rigorous logician forcing the conclusion, the man recoiling from its implications. "...compels it." The path of duty was clear, even as it led him further from the personal hope he so rationally, so desperately, needed to be true. His method had spoken. It offered no afterlife, only the stark, enduring conflict of the human condition. He had built the trap himself, and once again, it had sprung shut.
