prompt: |-
  So my decision theory reading group has spent the last few sessions on program equilibrium -- Tennenholtz's old idea that if agents submit source code instead of actions and can read each other's programs, you can sustain cooperation in a one-shot Prisoner's Dilemma without needing repeated play. This week we finally got through the FairBot construction from the "robust cooperation" literature (cooperate with your opponent iff you can find a bounded proof that they cooperate with you), plus the argument that two FairBots facing each other provably cooperate, with Löb's theorem doing basically all the heavy lifting in the proof. I can follow the derivation symbol by symbol, but I don't have any gut-level intuition for why you need something as heavy-duty as provability logic and Löb's theorem here at all, rather then just having each agent simulate what the other one would do and conditioning on that.

  Like, naively it feels like mutual simulation should be the more obvious route to get two identical (or near-identical) agents to cooperate with each other. So could you walk me through, at an intuitive level, what actually breaks down with naive mutual simulation in this setting -- I'm assuming it's some kind of infinite-regress or quining problem, but I've never seen it spelled out cleanly -- and what Löb's theorem is specifically buying you there that a direct simulate-your-opponent approach structurally can't? I'd love the "aha" version rather than a full re-derivation of the modal fixed-point argument -- happy to grind through the Kripke semantics myself later, I just want to understand why this is the right tool for the job before I do that.
