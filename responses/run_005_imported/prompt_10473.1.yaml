answer: |-
  Here’s a rigorous defense against the Humphrey objection, structured to withstand scrutiny in a graduate seminar. The core argument is that Kripke’s complaint **presupposes transworld identity as the *only* legitimate semantics for modality**, thereby begging the question against counterpart theory (CT). Crucially, this rejoinder isn’t an empty rhetorical move because CT offers independent solutions to intractable problems that transworld identity cannot resolve without ad hoc maneuvers.

  ### Step 1: State the Objection Clearly
  > Kripke’s Humphrey Objection:  
  > "Humphrey could have won the election" intuitively asserts a possibility *about Humphrey himself*. But CT paraphrases this as: "A counterpart of Humphrey wins in some world." This seems to change the subject—Humphrey cares about *his own* possibilities, not some mere lookalike’s successes.

  ### Step 2: Diagnose the Question-Begging Move
  The objection **assumes without argument** that:  
  > **(TI)** Modal claims *must* be analyzed as quantifying over transworld-identical entities.  

  CT explicitly rejects (TI) and replaces it with:  
  > **(CT)** Modal claims quantify over counterparts linked by similarity relations under contextually selected criteria.  

  Thus, Kripke’s objection *starts* by assuming the falsity of CT’s foundational premise. It doesn’t engage with CT on its own terms but instead insists CT must satisfy a requirement (literal transworld identity) that CT deliberately jettisons.  

  **Why this isn’t a cheap "anything goes" defense**:  
  CT doesn’t merely *deny* (TI)—it **provides independent motivations** for rejecting (TI) and **solves concrete problems** that cripple transworld identity. Kripke’s objection offers no rebuttal to these motivations; it simply ignores them.  

  ---

  ### Step 3: Motivate CT Independently—Why Reject Transworld Identity?
  CT isn’t an ad hoc patch; it emerges from principled metaphysical problems. Two key examples:

  #### **A. The Problem of Accidental Intrinsics**  
  - **Problem**: If an object (e.g., a poker) is transworld-identical, it must have incompatible intrinsic properties across worlds (e.g., *being straight* in W1 and *being bent* in W2). But Leibniz’s Law prohibits identical objects from having incompatible properties.  
  - **Kripkean/Transworld-identity response**: Hand-waving ("properties are world-indexed") or brute acceptance of contradiction.  
  - **CT solution**: The poker in W1 and its bent counterpart in W2 are *not identical*. No contradiction.  
    → **Key point**: CT *avoids incoherence* that transworld identity cannot resolve elegantly.

  #### **B. Coincident Objects (Statue/Goliath and Lump/Clay)**  
  - **Problem**: A statue (Goliath) and its constituent clay (Lump) are identical in the actual world but diverge modally (e.g., Lump could survive being flattened; Goliath could not).  
  - **Transworld-identity response**: Deny coincidence ("mereological essentialism") or embrace extreme modal fragility. Both violate intuitions.  
  - **CT solution**:  
    - Goliath has counterparts under *statue-relative* similarity (preserving form/function).  
    - Lump has counterparts under *lump-relative* similarity (preserving material continuity).  
    - "Goliath could have been flattened" is false (no statue-counterpart is flattened).  
    - "Lump could have been flattened" is true (a lump-counterpart is flattened).  
    → **Key point**: CT *systematically explains* modal divergence via contextually variable counterpart relations. Transworld identity cannot do this without multiplying entities or accepting contradictions.

  ---

  ### Step 4: Reframe the Humphrey Case in CT’s Terms
  - **CT paraphrase**: "A Humphrey-counterpart wins in some world."  
  - **Why this *does* address Humphrey's concern**:  
    The counterpart relation isn’t arbitrary resemblance. It’s constrained by:  
    - **Contextual parameters**: In discussions of *personal* possibility (e.g., "Humphrey could have won"), the counterpart relation tracks properties central to *Humphrey’s identity*: psychological continuity, biological history, or other criteria salient in the context.  
    - **Metaphysical gravity**: The winning counterpart isn’t a "mere lookalike"—it’s the closest *realization of Humphrey’s unrealized potential* under the relevant similarity constraints. Humphrey *should* care because this counterpart *is* the truthmaker for *his* possibility.  

  **Crucial nuance**: CT doesn’t say Humphrey *is* his counterpart; it says the counterpart *represents what could have been true of Humphrey*. This is no more mysterious than saying a map *represents* a territory without being identical to it.  

  ---

  ### Step 5: Why Kripke’s Intuition Doesn’t Sink CT
  Kripke relies on pre-theoretic intuition ("Humphrey himself!"). But:  
  - Intuitions are theory-laden. Transworld identity feels "obvious" because we tacitly presuppose it—but this is what’s under dispute.  
  - CT *accommodates* the intuition: The winning counterpart isn’t "some other guy"—it’s *Humphrey-as-he-could-have-been* under the most salient way of tracking identity.  
  - CT’s paraphrase is *revisionary*, but so is Einsteinian relativity vs. Newtonian absolute time. Revision isn’t falsity; it’s progress driven by solving problems.  

  ---

  ### Step 6: Preempting Pushback (Sharp Second-Year Edition)
  **Q**: *Isn’t CT ad hoc? You just invent counterpart relations to fit cases.*  
  **A**: No. Counterpart relations are grounded in **objective similarity metrics** constrained by **contextual interests** (Lewis, *On the Plurality of Worlds*, §4.4). We use similar criteria in ordinary judgments of similarity ("Is young Elvis similar to old Elvis?"). The statue/lump case shows this isn’t arbitrary—it reflects how we *actually* reason about modal persistence.  

  **Q**: *But Kripke’s essentialism explains modality better!*  
  **A**: Essentialism presupposes transworld identity and inherits its problems (e.g., accidental intrinsics). CT handles essentialism naturally: An essential property of Humphrey (e.g., *being human*) is one held by *all* his counterparts under any salient relation.  

  **Q**: *Why accept CT if it violates "Humphrey himself" intuitions?*  
  **A**: Because intuitions must yield to systematicity. Transworld identity is intuitive but leads to contradictions (e.g., the poker) or unmotivated essentialism. CT resolves these while preserving the *function* of modal discourse: evaluating unrealized possibilities *about* Humphrey.  

  ---

  ### Conclusion: The Teeth of the "Question-Begging" Rejoinder
  Kripke’s objection fails because it:  
  1. **Assumes the contested premise** (transworld identity is mandatory).  
  2. **Ignores CT’s independent motivations** (solving accidental intrinsics, coincident objects).  
  3. **Offers no alternative solution** to the problems CT addresses.  

  This rejoinder has "teeth" because CT isn’t a *mere* denial of transworld identity—it’s a **superior explanatory framework** for modality. To dismiss CT via the Humphrey objection is to demand that CT surrender its core insight before the debate begins. That’s not counterargument—it’s metaphysical imperialism.  

  **Final line for the seminar room**:  
  "Kripke’s Humphrey isn’t a refutation—it’s a symptom of failing to take counterpart theory on its own terms. When we do, we see it doesn’t change the subject; it gives a *better* account of what the subject *is*."  

  ---
  *Sources to cite: Lewis, *On the Plurality of Worlds* (1986), esp. §4; Kripke, *Naming and Necessity* (1980), p. 45n13; Lewis, "Counterparts of Persons and Their Bodies" (1971) for statue/lump.*
