  We are given six proposed responses to Fitch's paradox of knowability. The task is to sort them into a tier list from S (most successful) to D (least successful), based on how well they defuse the paradox without incurring a philosophical cost worse than the problem.

  First, recall Fitch's paradox: The knowability principle (KP) states that every truth is knowable (i.e., for all p, if p is true then it is possible that p is known). Fitch showed that this principle, when combined with some plausible epistemic and modal principles, leads to the conclusion that every truth is actually known (which is absurd). The derivation uses a "Fitch sentence": a proposition of the form "p and it is not known that p". If such a proposition is true, then by KP it is knowable. But if it were known, then we would know both p and that we don't know p, which leads to a contradiction. Hence, such a proposition cannot be true, meaning that there are no unknown truths.

  The proposed solutions:

  1. Tennant's restriction to "Cartesian" propositions: The idea is that KP only applies to propositions that are not self-refuting in the way the Fitch sentence is. A proposition is Cartesian if knowing it does not entail a contradiction. This would block the derivation because the Fitch sentence is not Cartesian.

  2. The "actually"-operator strategy (Edgington, Rabinowicz and Segerberg): This approach relativizes knowability to the actual world. The idea is to formulate KP as: if p is actually true, then it is possible to know that p is actually true. This avoids the collapse because the Fitch sentence in the actual world doesn't imply that in every possible world we can know the same Fitch sentence.

  3. Revising to intuitionistic logic: The original derivation uses classical logic. Intuitionistic logic rejects the law of excluded middle and double negation elimination. In intuitionistic logic, the derivation of the paradox does not go through because one step (reductio ad absurdum) is not valid in the same way.

  4. Paraconsistent treatment (Beall): Paraconsistent logics allow for true contradictions (without explosion). So, the contradiction derived from the Fitch sentence doesn't force us to reject the Fitch sentence. Thus, we can accept that the Fitch sentence is both true and knowable, and the paradox is avoided.

  5. Restall's distinction: Restall argues that the knowability principle does not entail that it is possible for all truths to be known simultaneously. The paradox requires that the knowability of each truth individually implies that they are all known at once. By rejecting the step that aggregates the knowability of each truth into a single possible world where all are known, the paradox is blocked.

  6. Accepting the result and abandoning KP: This is the skeptical response: since KP leads to the absurd conclusion that all truths are known, we must reject KP.

