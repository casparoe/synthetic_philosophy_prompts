  The user questions how an epistemological point (what we measure) leads to a metaphysical one (physical equivalence). The missing premise is that spacetime points lack independent identity. They're only defined by events/fields. So when you drag fields, you're just relabeling points without physical change. That connects observables to ontology. 

  Also, Leibniz equivalence in modern terms is exactly this: diffeomorphic models represent the same physical reality. Einstein's argument is indeed the origin of that. But maybe he emphasized observables more, while philosophers formalized it. The user might be wary of question-begging, but Einstein's move isn't circular if we accept that points aren't pre-existing. His argument pushes us to that view.

