prompt: |-
  Hey, I'm putting together some notes for a talk I'm giving to the grad reading group next week and want a sanity check before I embarass myself in front of everyone. Nothing polished, just the core argument so far:

  Herbert Simon's whole "bounded rationality" idea is that real agents can't exhaustively search for the optimal option, so they set some aspiration level and stop as soon as they find something that clears it -- satisficing instead of maximizing. Fine, that tracks. Now Michael Slote comes along later and defends "satisficing consequentialism," the view that an act can be right even when it doesn't produce the best available outcome, so long as it's good enough. My working hunch is that Slote's view is basically just Simon's bounded rationality dressed up in normative-ethics clothes -- once you take seriously that real moral agents are cognitively limited, satisficing just falls out as the sensible thing to defend, and Slote isn't really adding much thats philosophically new.

  Can you poke holes in that for me? I've got a nagging feeling there's a reason people treat these as importantly different claims, something to do with the fact that Slote's own cases are rigged so the extra bit of good is basically free, no search costs involved -- but I can't quite articulate why that should matter, or whether there's a classic objection along these lines I should be citing instead. Tell me if I'm being unfair to Slote.
reasoning: |-
  Okay, the user is preparing for a grad reading group talk and wants a sanity check on their argument comparing Herbert Simon's bounded rationality and Michael Slote's satisficing consequentialism. They think Slote's view is just Simon's idea applied to normative ethics without adding much new. But they suspect there might be a difference they're missing, especially regarding Slote's cases where extra good is cost-free.

  First, I need to recall the core concepts. Simon's bounded rationality is about cognitive limits and search costs leading to satisficing as a practical strategy. Slote's satisficing consequentialism is a normative claim: an act can be right even if it doesn't maximize good, as long as it's "good enough." The user’s hunch is that Slote is repackaging Simon, but they feel there's a distinction.

  The user mentions Slote's cases where the extra good is almost free. That's key. In Simon's framework, if there's no cost to searching or choosing the better option, you should maximize. But Slote argues that even then, satisficing could be permissible. For example, choosing a "good enough" job when a slightly better one is available with no extra effort. Simon would say that's irrational because why not take the better option? Slote says it's morally acceptable, maybe due to avoiding perfectionism or other values.

  I should highlight the normative vs. descriptive distinction. Simon describes how agents act under constraints; Slote prescribes how they ought to act, even without constraints. Also, Slote’s "good enough" threshold might not align with Simon's aspiration level, which adjusts based on context. Slote’s threshold could be static, leading to potentially suboptimal outcomes.

  The user might be missing that Slote is making a moral claim, not just a practical one. Critics like Pettit or Bradley point out that without costs, satisficing seems irrational. The user needs to address why Slote thinks it’s permissible beyond cognitive limits. Maybe Slote values effort or contentment over pure optimization, which Simon doesn’t consider.

  I should also mention the objection that satisficing could condone harming others for minimal gain. Slote might need to adjust his threshold, but that complicates his theory. The user’s argument might oversimplify by conflating the two concepts. Emphasizing the difference in their foundational aims—descriptive vs. normative—could strengthen their talk and show awareness of the philosophical nuances.
answer: |-
  You've nailed a crucial tension – and your nagging feeling is spot-on. Slote *isn't* simply applying Simon to ethics, and the difference hinges on **cost-free opportunities for greater good**. Here's a breakdown of the key distinctions and classic objections to help refine your argument:

  1.  **The Core Difference: Normative Claim vs. Descriptive/Pragmatic Strategy**
      *   **Simon (Bounded Rationality/Satisficing):** This is a **descriptive and pragmatic theory of decision-making *under constraints***. It explains *how* agents *actually* make decisions *because* exhaustive optimization is impossible or prohibitively costly. Satisficing is rational *only* because of these cognitive/search costs. The aspiration level is set *relative* to the perceived difficulty/cost of search.
      *   **Slote (Satisficing Consequentialism):** This is a **distinctive *normative ethical* theory**. Slote argues that an act can be *morally right* or *permissible* even if it doesn't produce the *best available outcome*, *even when*:
          *   The agent *knows* a better option exists.
          *   Identifying/choosing the better option involves *negligible or zero extra cost* (cognitive, temporal, financial, effort).
          *   There are *no countervailing moral reasons* (like special obligations) against choosing the better option.

  2.  **Why the "Cost-Free" Cases Matter (The Classic Objection):**
      This is the heart of the critique you're sensing. Slote deliberately uses examples like:
      *   Choosing a "good enough" ($80k) job when a slightly better ($81k) job is equally available with no extra effort.
      *   Donating a "satisfactory" amount to charity when donating slightly more (with no meaningful sacrifice) is possible.
      *   **The Objection (Bradley, Pettit, others):** In these *cost-free* scenarios, Simonian satisficing *doesn't apply*. Simon would say: *Because there's no search/effort cost, maximizing is trivial and rational.* Slote, however, argues satisficing is *still morally permissible*. Critics argue this is deeply counterintuitive or even irrational:
          *   **The "Why Not?" Objection:** If achieving marginally more good is genuinely cost-free, why *wouldn't* it be morally required? Choosing the lesser good seems like arbitrary neglect of potential benefit, violating the core consequentialist impulse to promote the good.
          *   **The Slippery Slope/Arbitrariness Objection:** How do we define "good enough"? Slote's threshold seems arbitrary. If $80k is "good enough" when $81k is free, why isn't $79k? Why isn't *any* positive outcome "good enough"? This threatens to collapse into a very low bar for permissibility.
          *   **The Harm of Omission:** By choosing the lesser good when more is freely available, the agent is *failing to prevent* a preventable lesser state of goodness. This looks like a moral failing under consequentialism.

  3.  **Slote's Defense (Why He Thinks He's Adding Something New):**
      Slote isn't *just* talking about cognitive limits. He's making a positive normative claim about the *value* of not *always* striving for the absolute maximum:
      *   **Anti-Perfectionism/Anti-Obsessiveness:** He argues a constant, relentless drive for the *absolute best* is exhausting, neurotic, and potentially detrimental to a good life or good character. Satisficing allows for contentment and avoids the "burnout" of maximization.
      *   **Effort Itself as a Cost (Sometimes):** While he uses cost-free examples, a core part of his argument is that the *effort* of maximization *itself* can be a negative, even if external costs are low. Constantly calculating and striving *takes a toll*.
      *   **Modesty & Non-Overreaching:** He links satisficing to the virtue of modesty – not presuming one *must* always do the absolute most possible.
      *   **Distinct Consequentialism:** He aims to offer a consequentialist theory that avoids the perceived harshness or demandingness of maximization (like utilitarianism), providing a more "humane" alternative *within* the consequentialist framework.

  4.  **Where Your Hunch is Strong (And Where to Push Back on Slote):**
      *   **Simon as Foundation:** You're right that Simon provides the *intellectual groundwork* and makes satisficing a respectable concept. Slote absolutely builds on this.
      *   **Cognitive Limits as Primary Driver:** For *most real-world* moral decisions, Simonian constraints *are* the dominant reason we satisfice, making Slote's *cost-free* permissibility seem like a philosophical edge case rather than the core of a distinct theory.
      *   **"Not Adding Much" Philosophically?:** This is debatable. He *is* making a novel *normative* claim about permissibility independent of cost. Whether it's *persuasive* is another matter. Critics argue he hasn't successfully justified why this permissibility exists *despite* the "why not?" objection.

  5.  **How to Refine Your Argument for the Talk:**
      *   **Acknowledge the Difference Explicitly:** "While Simon brilliantly explains *why* we *do* satisfice due to cognitive limits, Slote makes the bolder claim that satisficing can be *morally permissible even when those limits don't apply* and a cost-free better option is known."
      *   **Focus on the Cost-Free Cases:** "The crux of the disagreement lies in Slote's controversial examples where agents knowingly choose a lesser good despite a cost-free better option being available. Critics argue this violates the fundamental consequentialist principle of promoting the good when it's easily possible. Simonian satisficing, grounded in the reality of search costs, doesn't demand maximizing in these cases – it *explains* why we often can't. Slote demands we accept that we *shouldn't have to*, even when we *can*."
      *   **Concede Slote's *Attempt* at Novelty:** "Slote's aim is distinct: to offer a less demanding, more psychologically realistic *normative* consequentialism that values anti-perfectionism. However, the central objection remains: without Simonian constraints, *why* is knowingly accepting less good permissible? The 'why not?' question seems to undermine the distinct core of his normative claim."
      *   **Conclude with the Tension:** "Ultimately, while Slote's theory borrows the *structure* of satisficing from Simon, its *normative force* in cost-free scenarios is its most distinctive and controversial element, separating it fundamentally from Simon's descriptive/pragmatic account. Whether this element is defensible is the key debate."

  **Key Citations to Mention:**
  *   **The "Why Not?" Objection:** Philip Pettit ("Satisficing Consequentialism" - *Proceedings of the Aristotelian Society*, Supp. Vol. 58, 1984) is classic. Ben Bradley also has clear critiques.
  *   **Slote's Defense:** His core arguments are in *Common-Sense Morality and Consequentialism* (1985) and *Beyond Optimizing: A Study of Rational Choice* (1989).

  Your core insight is strong – the link is undeniable, but the normative leap Slote makes in cost-free cases is the real point of contention and what makes his view philosophically distinct (and controversial). Don't shy away from hammering the cost-free examples; that's exactly where the debate lives. Good luck with the talk!
