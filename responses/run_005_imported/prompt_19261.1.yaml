  But how to ensure the evidential reasoning works for EDT without causal ties? The population must be large enough that seeing yourself choose compromise is evidence many others do too. 

  I think I've got it: the "Compromise PD" with asymmetric types. But need to handle updatelessness separately. Updateless FDT would pre-commit to a policy without knowing their type. Depending on the population mix, they might choose a different policy than conditional FDT. 

  This scenario seems promising. Let me outline payoffs and conditions clearly. The key is making the compromise action rational for EDT via evidence but irrational for FDT unless they're identical. And updatelessness should override the conditional logic. 

  Now, how to present this without jargon overload? Need to define each agent's reasoning step by step. For EDT: "When I consider compromise, I infer others like me do too, so it's better than mutual defection." For FDT: "Only if my algorithm is identical to theirs does my choice control theirs." For updateless: "Ex ante, I optimize the policy across all possible pairings." 

  The divergence should be visible in the case where an FDT agent is paired with an EDT agent. FDT defects, EDT compromises, leading to suboptimal outcome. Updateless might randomize or something. 

  Yes, this exposes the philosophical tension: ECL relies on statistical ensembles, FDT on algorithmic identity, updatelessness on pre-commitment. The student can use this to argue that ECL isn't reducible to the others—it's EDT-specific. 

