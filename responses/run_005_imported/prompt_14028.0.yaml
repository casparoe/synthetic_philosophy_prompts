prompt: |-
  I'm on the committee that runs my company's internal forecasting program (think a mini Good Judgement Project, but for pipeline calls). We've hit a real fight: one of our best forecasters put 85% on our drug trial succeeding, while the other eleven, all with similar Brier scores, landed around 40%. She's heard everyone's arguments and says none of them budge her -- but a dozen peers with matching track records disagreeing is itself evidence she's missing something, even if no one can say what. Half the committee wants outliers to shade their number toward the group past some threshold; the other half says that just launders a number nobody believes, and if she's still convinced after hearing them out, maybe the 'just defer' instinct is what's wrong, not her. Can you draft the short memo for Friday's meeting -- a real recommendation with a timeframe, not 'it depends' -- that takes the pro-autonomy side seriously rather than just asserting the wisdom of crowds?
reasoning: |-
  Okay, the user is part of a committee running an internal forecasting program similar to the Good Judgment Project but focused on pipeline calls. They're dealing with a conflict where one top forecaster has an 85% probability on a drug trial succeeding, while eleven others with similar Brier scores are around 40%. The outlier has considered all arguments but remains firm. The committee is split: half wants outliers to adjust toward the group, half argues that forcing adjustment undermines autonomy and might suppress valuable insights.

  The user needs a concise memo for an upcoming meeting that strongly advocates for the autonomy side. They explicitly want a firm recommendation with a timeline, avoiding vague "it depends" answers. The memo must acknowledge the validity of group wisdom without defaulting to it, presenting a structured approach that preserves outlier independence while creating accountability.

  Hmm... the core tension here is between collective calibration and individual conviction. The autonomy argument hinges on the possibility that the outlier might possess unique insight or reasoning that hasn't been articulated yet. Forcing convergence could sanitize forecasts at the cost of losing signal. 

  The memo should address the psychological discomfort of dissent while offering a concrete process. Key elements to weave in: 1) Protecting minority viewpoints as an anti-groupthink mechanism, 2) Creating structured accountability (e.g., requiring written reasoning), 3) Using time as a testing ground rather than immediate coercion. 

  I recall research on prediction markets showing that forcing consensus often degrades accuracy—the outlier might be weighing a non-public factor like principal investigator reputation. The "laundering" concern is valid; artificial convergence creates false confidence. 

  For the timeframe, two decision points make sense: immediate (document outlier rationale) and post-trial (audit reasoning). This balances urgency with consequence. The recommendation should reject shading but mandate transparency, turning the outlier's stance into a testable hypothesis rather than a rebellion.

  The tone needs to validate both sides: "We share your concern about consistency" shows empathy before pivoting to "However, enforced conformity..." The structure will be: 1) Problem recap, 2) Recommendation against shading, 3) Concrete steps (document/analyze/audit), 4) Rationale focused on error correction and system integrity. 

  Notably, the user wants this to "take pro-autonomy side seriously"—so the memo mustn't just pay lip service but center the argument on competitive advantage through cognitive diversity. Final touch: emphasize that the process itself (written explanations) may reveal hidden evidence gaps.
answer: |-
  ## Memo: Recommendation on Handling Outlier Forecasts  
  **To:** Forecasting Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** [Friday's Date]  
  **Subject:** Preserving Forecast Integrity & Independent Judgment  

  ### Issue Summary  
  Forecaster A maintains an 85% probability for Drug X trial success after reviewing all peer arguments. Eleven equally skilled forecasters cluster at ~40%. No consensus exists on *what* Forecaster A might be missing.  

  ### Recommendation: Uphold Autonomy with Accountability (Effective Immediately)  
  **Do not require outliers to shade forecasts toward the group mean.** Instead, implement a 3-step process:  

  1. **Document & Disseminate (48-hour deadline):**  
     - Forecaster A submits a concise written summary (≤300 words) detailing her reasoning, including:  
       - Key evidence she weighed most heavily.  
       - Specific counterarguments she considered and rejected (and why).  
       - Any unique expertise/data informing her view.  
     - Circulate this document to all forecasters before final submissions close.  

  2. **Re-Open Deliberation (24-hour window):**  
     - Peers may respond with *new* evidence or concrete critiques addressing Forecaster A’s documented reasoning.  
     - No generic "group disagrees" pressure. Focus on *substance*.  

  3. **Lock Forecasts & Annotate:**  
     - All forecasters submit final probabilities.  
     - Flag Forecaster A’s estimate as a documented outlier in the system.  

  ### Why Autonomy (with Transparency) Wins  
  - **Avoids Intellectual Laundering:** Forcing conformity replaces diverse perspectives with a number *no one authentically believes*, undermining the program’s purpose of surfacing genuine insights.  
  - **Protects Against Hidden Flaws in Consensus:** If the group is systematically overlooking something (e.g., a flawed assay interpretation, PI bias), Forecaster A’s outlier view is our best early-warning signal. Suppressing it destroys value.  
  - **Maintains Incentive for Deep Engagement:** Penalizing conviction after due diligence discourages forecasters from doing the hard work of independent analysis.  
  - **Creates a Testable Hypothesis:** Forecaster A’s documented rationale becomes a falsifiable artifact. *After the trial*, we audit: Was her reasoning sound but unlucky? Did she spot something others missed? Was her logic flawed? This drives learning.  
  - **"Defer Instinct" is the Real Risk:** The core value of forecasting is *individual* probabilistic reasoning. Defaulting to the crowd without concrete counter-evidence turns us into a polling exercise, not a judgment engine.  

  ### Timeline  
  - **Today:** Distribute this memo.  
  - **EOD +1 Day:** Forecaster A submits reasoning document.  
  - **EOD +2 Days:** Peers provide *new* substantive feedback.  
  - **EOD +3 Days:** Final forecasts locked.  

  ### Conclusion  
  Disagreement among experts isn’t a bug—it’s a feature. Our system must capture it transparently, not erase it. By mandating rigorous documentation and focused rebuttal, we respect autonomy while demanding accountability. If Forecaster A’s view stems from unique insight, we preserve it. If it stems from error, we’ll identify it *post-hoc* and improve. Forcing artificial consensus serves neither truth nor learning.  

  **Recommendation:** Adopt the 3-step process above. Preserve the outlier.  

