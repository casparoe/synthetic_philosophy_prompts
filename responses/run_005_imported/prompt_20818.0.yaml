  The memo should propose separating PTP from probability discounting. Emphasize rigorous probability adjustments for long-term grants. Maybe recommend a 0% PTP but enhance the probability discounting component. That aligns with EA principles while mitigating the quant lead's concerns. Also, a decision threshold for projects with long time horizons could prevent overinvestment in highly uncertain bets.

  Need to ensure the three components remain distinct. Probability discounting should handle the uncertainty of future beneficiaries, not PTP. Including a sensitivity analysis section in grant proposals would show how different assumptions affect cost-effectiveness. This transparency helps the committee evaluate trade-offs.

  The recommendation should be to keep PTP at 0% but strengthen probability discounting. This respects ethical objections while addressing practical issues. It avoids enshrining time preference bias but acknowledges uncertainty. Also, the memo should outline steps to implement these changes, like updating templates and training evaluators.

  Finally, the conclusion needs to be decisive. Not just "reasonable people disagree," but a clear policy shift. Highlighting that this approach balances principle with pragmatism, ensuring the foundation remains effective across all cause areas without sacrificing core values.
answer: |-
  ## MEMORANDUM  
  **To:** Grants Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** [Current Date]  
  **Subject:** Resolution on Discounting Framework & Pure Time Preference (PTP) Policy  

  ### I. Context & Core Conflict
  We are updating our guidance to ensure consistent, transparent comparison of grants across vastly different timescales (e.g., near-term bednets vs. century-scale AI safety research). Our current framework separates three discounting components:  
  1.  **Growth/Diminishing Marginal Utility (G):** Reflects that future beneficiaries may be wealthier, making incremental utility less valuable.  
  2.  **Existence/Probability Discounting (P):** Adjusts for the chance beneficiaries never exist (e.g., human extinction, intervention failure).  
  3.  **Pure Time Preference (PTP - δ):** A discount *solely* based on the timing of benefits, independent of wealth or risk.  

  **The Conflict:** Our Quant Lead proposes adding a small, explicit PTP (~1.5%/yr), arguing it honestly reflects revealed preference and prevents overcommitment to the speculative far future. Two members oppose *any* PTP on ethical grounds (Sidgwick/Ramsey), viewing it as unjustified discrimination against future generations and a dangerous bias.  

  ### II. Key Arguments Summarized  

  *   **For PTP (Quant Lead's Core Concern):**  
      *   **Practical Reality:** No individual or institution (including EAs) acts as if utility in 2200 is fungible with utility in 2025. A hard-zero PTP contradicts revealed behavior.  
      *   **Deferral/Overcommitment Risk:** A hard-zero PTP, combined with our handling of tiny probabilities of vast payoffs, creates a dangerous asymmetry. It incentivizes perpetual deferral of resources towards increasingly speculative claims on the *very* long-term future, potentially crowding out robust near-term opportunities. It makes us vulnerable to "Pascal's Mugging by Timestamp."  
      *   **Implicit Bias:** *Not* stating a PTP doesn't eliminate time preference; it hides it within subjective probability assessments or ad-hoc adjustments, reducing transparency and consistency.  

  *   **Against PTP (Ethical Argument):**  
      *   **Moral Equality:** Benefits to future people matter equally to benefits to present people. Discounting *solely* because a benefit occurs later is ethically arbitrary discrimination.  
      *   **Bias Codification:** Institutionalizing PTP enshrines a harmful, scope-insensitive bias we aim to overcome. It systematically undervalues long-term impacts crucial for existential risk mitigation.  
      *   **Climate Precedent:** The Stern Review (near-zero PTP) rightly emphasized the catastrophic long-term costs of climate inaction undervalued by models like Nordhaus's (higher PTP).  

  ### III. Analysis: Reconciling Principle & Pragmatism  

  1.  **The Ethical Imperative is Strong:** The Sidgwick/Ramsey argument against PTP is logically compelling and aligns with core EA principles of impartiality and concern for all sentient beings across time. A *pure* ethical stance demands δ = 0%.  
  2.  **The Pragmatic Concern is Valid & Material:** The Quant Lead's worry about deferral/overcommitment isn't mere "impatience." It highlights a critical flaw in how a *mechanically applied* δ=0% interacts with:  
      *   **Radical Uncertainty & Cluelessness:** Our ability to predict impacts diminishes drastically over centuries/millennia.  
      *   **Tiny Probabilities of Vast Payoffs:** Our framework *does* allow funding based on miniscule chances of astronomical future value.  
      *   **Opportunity Cost:** Resources locked into ultra-long-term bets cannot address near-term suffering or adapt to new information.  
      **This combination risks pathological allocation without a counterbalance.**  

  3.  **PTP is the Wrong Tool for This Problem:** Introducing PTP directly attacks the symptom (overweighting the far future) by violating the core ethical principle. There is a better, ethically defensible solution.  

  ### IV. Recommendation: Zero PTP, Enhanced Probability Discounting & Decision Thresholds  

  **1.  Set Pure Time Preference (δ) to 0%.**  
      *   **Reasoning:** Upholds the ethical principle of temporal neutrality. A benefit is a benefit, regardless of when it occurs.  
      *   **Implementation:** Explicitly state δ = 0% in the formal discounting formula.  

  **2.  Significantly Strengthen and Formalize the Probability Discounting (P) Component for Long Time Horizons.**  
      *   **Reasoning:** This directly addresses the Quant Lead's valid concern *without* compromising temporal ethics. The risk of beneficiaries never materializing *increases* non-linearly over very long periods due to:  
          *   **Extinction Risk Accumulation:** The probability of human (or relevant sentient) extinction over centuries/millennia is significant and must be rigorously modeled (e.g., integrating x-risk forecasts).  
          *   **Intervention Pathway Failure:** The probability that a specific research direction, institution, or technology fails to translate into the intended benefit *over vast timescales* approaches certainty without continuous justification. Track records decay.  
          *   **Value Drift/Cluelessness:** The chance that our actions today have unintended, negative consequences, or that future values diverge radically from ours, increases over time.  
      *   **Implementation:**  
          *   Mandate explicit, justified probability distributions for beneficiary existence/impact realization over the claimed timeframe. *No more single-point estimates for century-scale impacts.*  
          *   Require sensitivity analysis showing how cost-effectiveness changes under plausible higher near/mid-term extinction probabilities.  
          *   Develop standardized guidelines/bounds for assigning P over ultra-long time horizons (e.g., caps on assumed persistence probabilities beyond 100-200 years without extraordinary justification).  

  **3.  Implement Formal Decision Thresholds for Ultra-Long-Term/High-Uncertainty Grants.**  
      *   **Reasoning:** Creates a pragmatic safeguard against overcommitment to speculative futures without distorting core valuation.  
      *   **Implementation:**  
          *   Establish a maximum percentage of the grant pool (e.g., 20-35%) that can be allocated to interventions where >90% of the *expected* value accrues beyond 50 (or 100) years, *even after applying P=0% and rigorous P-discounting*.  
          *   Require an exceptional burden of proof (e.g., stronger evidence, more robust theory of change, clearer neglectedness) for grants crossing this long-term threshold.  

  ### V. Why This Approach?  

  1.  **Upholds Core Ethics:** Maintains δ=0%, respecting the equal moral status of future generations.  
  2.  **Directly Addresses the Real Risk:** Attacks the *root cause* of deferral/overcommitment – unjustifiably high probabilities assigned to ultra-long-term impacts – rather than distorting time valuation.  
  3.  **Enhances Rigor & Transparency:** Forces explicit quantification of the most uncertain element (P) and separates it cleanly from G and δ. Improves comparability.  
  4.  **Prevents Pathological Outcomes:** The allocation cap acts as a circuit breaker against portfolio imbalance driven by speculative long-term bets, ensuring continued support for high-certainty near/mid-term interventions.  
  5.  **Avoids Bias Enshrinement:** Does not institutionalize discounting future lives simply because they are future.  

  ### VI. Implementation Steps  

  1.  **Rewrite Discounting Guidance:** Clearly define δ=0%, G (based on projected utility growth), and P (requiring explicit, justified models, especially for T>50yrs). Provide examples.  
  2.  **Develop P-Discounting Standards:** Create a working group (incl. Quant Lead & opponents) to draft practical guidelines/bounds for modeling P over long horizons, referencing x-risk literature.  
  3.  **Establish Allocation Thresholds:** Propose specific % caps for ultra-long-term grants for committee vote.  
  4.  **Update Grant Templates:** Mandate separate fields for δ, G, P calculations and require long-term P justification + sensitivity analysis.  
  5.  **Training:** Brief evaluators on the new framework, emphasizing the distinction between components and the rationale for δ=0% + strong P.  

  ### Conclusion & Recommendation

  **I recommend we adopt a framework with δ (Pure Time Preference) = 0%, while simultaneously strengthening the rigor, transparency, and conservatism applied to Probability Discounting (P) for long time horizons, and implementing portfolio allocation thresholds for ultra-long-term/high-uncertainty grants.** This approach honors the ethical imperative of temporal neutrality while providing robust, practical safeguards against the very real risks of overcommitment to speculative futures and portfolio imbalance. It resolves the conflict by targeting the actual source of the Quant Lead's valid concern – the difficulty of justifying high probabilities over vast timescales – rather than compromising on the fundamental principle that *when* a benefit occurs does not change its inherent moral value.

  This framework provides the clarity and decisiveness our evaluators need, keeps our three discounting components distinct, and positions our foundation to allocate resources wisely and ethically across all time horizons. I move that we vote to adopt this policy at the quarterly meeting.  

  **Attachment:** Draft Revised Discounting Framework Section (Available Separately)
