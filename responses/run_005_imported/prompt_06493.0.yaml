answer: |-
  To design a successful Prisoner's Dilemma programming assignment leveraging program equilibrium, while accounting for real-world constraints like student time limits and buggy code, focus on these key implications from the literature and practical safeguards:

  ---

  ### **1. Core Design Recommendations**
  - **Source Code Access**:  
    - Require programs to accept the opponent's *entire source code* as input.  
    - Use a **statically analyzable language** (e.g., Python with restricted features) to simplify proof search. Disallow external libraries or I/O.  
    - Provide a template:  
      ```python
      def play(opponent_code: str, my_code: str) -> Literal["C", "D"]:
          # Student's logic here
      ```

  - **Prevent Trivial Defection**:  
    - **Ban hard-coded defection** in grading criteria. Solutions must condition behavior on the opponent's code.  
    - **Supply reference agents** (e.g., `AlwaysCooperate`, `AlwaysDefect`, `FairBot`) for testing.  

  - **Time/Space Limits**:  
    - Set strict **timeouts** (e.g., 1s/decision) to halt non-terminating proof searches.  
    - Restrict **maximum memory/recursion depth** to prevent crashes.  

  ---

  ### **2. Grading Rubric**
  Grade submissions holistically:  
  - **Performance** (50%): Total score in a round-robin tournament.  
  - **Robustness** (30%):  
    - Must cooperate with `FairBot` and itself.  
    - Must defect against `AlwaysDefect`.  
    - Test against adversarial opponents (e.g., agents that throw errors).  
  - **Code Quality** (20%):  
    - Readability and avoidance of obvious bugs.  
    - Documentation explaining cooperation mechanism.  

  ---

  ### **3. Key Theoretical Insights & Pitfalls**
  #### **A. Tennenholtz-Style Program Equilibrium**
  - **Idea**: Programs cooperate if they verify mutual cooperation.  
  - **Student Pitfalls**:  
    - **Overly simplistic checks** (e.g., exact string match) lead to *no cooperation* between non-identical programs.  
    - **Solution**: Require solutions to work with *variants* of themselves (e.g., tolerate renamed variables).  

  #### **B. Löbian Obstacles (FairBot)**
  - **Idea**: `FairBot` cooperates if it can prove `opponent(FairBot) = "C"`.  
  - **What Breaks**:  
    - **Incomplete Proof Search**: Students implement buggy/theorem-provers that miss proofs.  
      - *Result*: Unnecessary defection against cooperators.  
    - **Soundness Errors**: Provers "prove" false statements (e.g., cooperate with defectors).  
      - *Result*: Exploitation by malicious agents.  
    - **Undecidability**: Proof search hangs against complex opponents.  
  - **Mitigations**:  
    - Provide a **simple proof validator** (e.g., pattern-matching for mutual cooperation conditions).  
    - Allow **probabilistic cooperation** (e.g., cooperate if proof found in X steps, else defect).  

  ---

  ### **4. What Will Break in Practice**
  #### **Likely Failures**
  1. **Incomplete Proofs**:  
     - Student prover fails to recognize a cooperative opponent → accidental defection.  
     - *Test case*: Ensure `FairBot` variants cooperate with each other.  
  2. **Adversarial Opponents**:  
     - Malicious agents crash proof-searchers (e.g., infinite loops, syntax errors).  
     - *Mitigation*: Sandbox opponent code analysis.  
  3. **Coordination Problems**:  
     - No agreed-upon "cooperation protocol" → everyone defects.  
     - *Fix*: Suggest a **public cooperation token** (e.g., `#COOP_TOKEN` in code).  

  #### **Minimal FairBot Implementation**
  ```python
  # Instructor-provided reference to avoid Löbian complexity
  def fairbot(opponent_code: str, my_code: str) -> str:
      SIMPLE_PROOFS = [  # Pattern-based, not full Löbian
          "return 'C' if" in opponent_code,         # Rule 1: Explicit Cooperators
          "FairBot" in opponent_code,               # Rule 2: Trust other FairBots
          "#COOP_TOKEN" in opponent_code,           # Rule 3: Public token
      ]
      return "C" if any(SIMPLE_PROOFS) else "D"
  ```

  ---

  ### **5. Tournament Setup**
  - **Scoring**: Use standard PD payoffs (Temptation=5, Reward=3, Punishment=1, Sucker=0).  
  - **Pairings**:  
    - All programs play each other + reference agents.  
    - Include **self-play** (critical for program equilibrium).  
  - **Publish Results**: Show which pairs cooperated/defected to facilitate learning.  

  ---

  ### **6. Student Guidance**
  - **Warn Against**:  
    - Over-engineering proof systems (use pattern matching).  
    - Assuming opponents are identical (emphasize robust checks).  
  - **Encourage**:  
    - **Transparency**: Add visible cooperation signals (e.g., comments like `#COOP_BOT_v1`).  
    - **Defection Triggers**: Defect only if opponent lacks cooperation proof.  

  ---

  ### **Expected Outcomes**
  - **Best Case**: Multiple `FairBot`-like agents achieve mutual cooperation.  
  - **Realistic Case**: Mix of cooperation (among careful students) and defection (due to bugs/exploiters).  
  - **Teaching Moment**: Discuss why *imperfect proof search* and *coordination failures* mirror real-world barriers to cooperation.  

  By simplifying Löbian concepts into pattern-based checks and emphasizing robustness, students can experience successful program equilibrium while learning its fragility in practice.
