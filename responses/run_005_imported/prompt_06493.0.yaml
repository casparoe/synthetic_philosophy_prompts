  Quick one for you -- every year in my rationality and cooperation seminar the students write short programs that play a single round of Prisoner's Dilemma against each other, and every year its boring because they all just defect, exactly like the textbook says they should. This year I want to let them see each other's source code before submitting, since that's supposedly the whole point of program equilibrium -- Tennenholtz's original result, plus the later Löbian tricks (FairBot and its descendants) that get you provable mutual cooperation instead of just "cooperate iff identical code." I know the theory fine on paper but I've never watched it survive contact with 30 undergrads, a deadline, and buggy proof-search code. Can you give me the most important implications of the program equilibrium literature for how I should design and grade this assignment, and what's most likely to break once real, finite, not-especially-careful code is doing the "proving" instead of an idealized agent?
reasoning: |-
  We are designing a programming assignment for a seminar on rationality and cooperation. The goal is to have students write programs that play a single round of the Prisoner's Dilemma (PD) against each other. In previous years, all programs defected, leading to a boring outcome. This year, the students will see each other's source code before submitting. The hope is that by allowing programs to condition their behavior on the opponent's code, we can achieve mutual cooperation via program equilibrium.

  The theoretical background includes:
  1. Tennenholtz's program equilibrium: Agents can commit to strategies that condition on the opponent's code, and cooperation can be sustained if each program cooperates only if the opponent's program is "cooperative" in a specific way.
  2. Löbian techniques (as in FairBot): An agent can try to prove that the opponent will cooperate if it does, and then cooperate. This can lead to mutual cooperation even between non-identical programs, provided they are both using similar proof-based techniques.

  However, we are dealing with:
  - 30 undergraduate students.
  - A deadline (so code might be rushed).
  - Buggy proof-search code (since implementing a full theorem prover is hard and error-prone).

  Key implications from the literature for assignment design and grading:

  1. **The Necessity of Source Code Access**: Each program must have access to the source code of the opponent. This is the core of program equilibrium.

  2. **Mutual Cooperation via Proof-Based Techniques**:
     - FairBot: Cooperates if it can prove that the opponent cooperates when FairBot cooperates. Otherwise, it defects.
     - PrudentBot: A variant that avoids cooperating with CooperateBot (which always cooperates) because that would be exploited by DefectBot? Actually, PrudentBot is designed to avoid being exploited by CooperateBot? Let me recall: FairBot might cooperate with CooperateBot, which is safe because CooperateBot always cooperates. The danger is when facing a program that defects when FairBot cooperates? Actually, FairBot is designed to defect against DefectBot because it cannot prove that DefectBot will cooperate when FairBot does. So FairBot is not exploitable by DefectBot.

     However, the challenge is that implementing a full Löbian proof system is complex and might be beyond the scope of an undergraduate assignment. We might need to simplify.

  3. **Simplified Approaches**:
     - **String Matching**: A simple approach is to have the program check if the opponent's code is identical to its own (or to a known cooperative strategy). This can lead to mutual cooperation only between identical programs. But this is fragile because two non-identical but cooperative programs might not recognize each other.
     - **Quining**: A program that checks if the opponent's code is the same as its own (by using a quine-like technique) can cooperate only with itself. But again, non-identical cooperative programs won't cooperate.
     - **Proof-Based with a Limited Prover**: We might provide a simple proof assistant or limit the proofs to a very restricted set. Alternatively, we can let students implement a simple prover that can only handle a few predefined patterns.

  4. **What is Likely to Break**:
     - **Non-Termination**: Proof search may not terminate. We must set a time limit or step limit for the proof search.
     - **Incompleteness**: The prover might fail to prove a true statement (e.g., because the opponent's code is too complex or uses a different structure). This could lead to unnecessary defection.
     - **Soundness**: The prover might "prove" a false statement (due to bugs or because the logic is inconsistent when self-referential statements are allowed without care). This could lead to incorrect cooperation (with a defector) or incorrect defection (against a cooperator).
     - **Complexity**: Students might not have time to implement a sophisticated prover. We should consider providing a framework that handles the proof search, and have the students only write the "strategy" part.

  5. **Design Recommendations**:
     - **Language Choice**: Choose a language that is easy to reason about and has good support for meta-programming (like Python, which can get source code via `inspect`). Alternatively, provide a simple domain-specific language (DSL) for writing strategies to avoid the complexity of general-purpose code.
     - **Provide a Framework**: To avoid everyone having to write a theorem prover, provide a framework that:
          a. Gives each program access to the opponent's source code as a string.
          b. Provides a simple proof search mechanism (maybe even a fixed set of patterns to check) or a way to register "if you see this pattern in the opponent, then do X".
     - **Default Strategies**: Provide a few reference strategies (e.g., AlwaysDefect, AlwaysCooperate, TitForTat, FairBot, PrudentBot) so that students can test against them.
     - **Time Limits**: Set a time limit for each program's decision to prevent infinite loops.

  6. **Grading**:
     - **Performance**: Grade in part by running a tournament. But note: if everyone writes a FairBot-like program, they should all cooperate and get high payoffs. However, if someone writes a defective strategy that can trick others, that might break the cooperation. So we need a way to reward robust cooperative strategies.
     - **Robustness**: Test each program against a set of reference opponents (including some that are cooperative, some that are defective, and some that are tricky). The program should:
          - Cooperate with other cooperative programs (like FairBot, itself, etc.)
          - Defect against known defectors (like AlwaysDefect)
          - Not be exploited by tricky strategies (like a program that pretends to be FairBot but defects).
     - **Originality and Explanation**: Ask students to explain their strategy and how it attempts to achieve cooperation. This can help in grading when the code is buggy.

  7. **What Might Happen in Practice**:
     - **All Cooperate**: If everyone writes a FairBot-like program (or uses the provided one) then we get mutual cooperation. But this might be too optimistic.
     - **Some Defectors**: A student might write a defector that is disguised as a cooperator (e.g., by having a string that looks like FairBot but actually defects). This could exploit naive cooperators. However, a well-designed FairBot would only cooperate if it can prove that the opponent cooperates when it does. So if the defector's code doesn't allow such a proof, FairBot would defect. But if the defector's code is complex and the prover is weak, it might fail to prove and thus defect, leading to mutual defection.
     - **Buggy FairBots**: If many students attempt FairBot but have bugs, then their programs might defect against each other even though they are intended to cooperate. This could lead to a lot of mutual defection.

  8. **Mitigations**:
     - **Provide a Reference FairBot**: Give students a working FairBot (with a simple prover) that they can use or build upon. This prover should be very limited (for example, it only checks for a few patterns) to avoid complexity.
     - **Encourage Simplicity**: Advise students to write simple, transparent code so that other programs can easily verify their behavior.

  9. **Tournament Design**:
     - Run a round-robin tournament where each program plays every other program (including itself) in a single round of PD.
     - Payoff matrix (for example):
          - Mutual Cooperation: (3,3)
          - Mutual Defection: (1,1)
          - Defection vs Cooperation: (5,0)

