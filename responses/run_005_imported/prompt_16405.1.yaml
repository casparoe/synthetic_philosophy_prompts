answer: |-
  You've zeroed in on the most persistent and legitimate criticism of Aquinas's Third Way – the inference from **perpetual perishing** (each contingent thing fails to exist at *some* time) to **simultaneous non-existence** (there is *one* time when *all* contingent things fail to exist). Anthony Kenny's quantifier-shift fallacy diagnosis is precisely correct. Let's break this down:

  1.  **The Problem: Quantifier-Shift Fallacy**
      *   Aquinas observes: For every contingent thing (x), there exists some time (t_x) such that x does not exist at t_x. (∀x ∃t ¬Exists(x, t))
      *   He infers: There exists some time (t) such that for every contingent thing (x), x does not exist at t. (∃t ∀x ¬Exists(x, t))
      *   This inference is **logically invalid**. It's structurally identical to Kenny's theater example: Just because every seat was empty at *some* point during the run doesn't mean there was a *single* moment when *all* seats were empty simultaneously. Things perish *at different times*.

  2.  **Can Aquinas Be Salvaged? Aristotelian Context & Charitable Readings:**
      While the logical fallacy seems undeniable, several charitable interpretations attempt to ground Aquinas's move in his broader metaphysical framework. None are fully conclusive, but they offer context:

      *   **Eternal Universe & Continuous Generation/Corruption:** Aquinas, following Aristotle, believed the universe was eternal *a parte ante* (without a temporal beginning). Within this framework:
          *   If *every* contingent thing *must* at some point *not* exist (because its matter is corrupted and its form lost), and time is infinite past, then the *possibility* of a universal "nothing" moment arises. If there's infinite time for every contingent thing to fail to exist, and their failures are independent, why hasn't it happened? This *might* nudge towards the conclusion that such a state *must* have occurred or that it *must* be impossible, leading to the need for something necessary.
          *   **Critique:** This relies on probabilistic intuitions about infinite time that aren't logically necessary. It's entirely possible (logically and metaphysically within Aristotelianism) that contingent beings are generated and corrupted in a staggered way *ad infinitum*, ensuring that *at every moment*, *some* contingent beings exist, even though *each one individually* perishes. Matter as pure potentiality is always actualized *by something* (even if that something is another contingent being acting on it via forms), preventing universal nothingness.

      *   **Per Se vs. Per Accidens Chains & Dependence:** Aquinas emphasizes dependence: "that which does not exist only begins to exist by something already existing." His focus might be less on the temporal frequency of non-existence and more on the **ontological dependence** of the *entire chain* of contingent beings at any given moment. The key point is that if *everything* at time T1 is contingent (capable of not existing), then *at T1*, the *existence* of the whole contingent realm lacks a sufficient reason within itself. It requires a ground *outside* itself *at that very moment* to explain why it exists rather than not. The "temporal nothingness" scenario is then a *reductio ad absurdum* illustrating what happens if *no* such ground exists: existence couldn't have begun *at all*.
          *   **Critique:** While this points towards the need for a concurrent sustaining cause (a stronger and more modern interpretation of cosmological arguments), Aquinas's text *explicitly* frames the argument in temporal terms ("at one time," "begins to exist"). He anchors the possibility of non-existence in generation/corruption, which *are* temporal processes. This reading imports a more robust concept of ontological dependence than is clearly articulated in this specific passage.

      *   **The Necessity of a Sustaining Ground *Now*:** The strongest charitable reading might bypass the temporal quantifier issue entirely by focusing on the present moment. The argument could be reconstructed as:
          1.  Right now, contingent things exist.
          2.  Their existence is not self-explanatory; they are inherently capable of *not* existing.
          3.  If *everything* that exists right now were contingent (capable of not existing), then the *totality* of what exists right now would be inherently capable of not existing.
          4.  There would be no sufficient reason *within* this totality for why it exists *right now* rather than not.
          5.  Therefore, there must exist *right now* something whose existence is *not* contingent (i.e., necessary) that grounds the existence of the contingent totality.
          *   **Critique:** This is a powerful *modal* argument from contingency, akin to Leibniz's, but it significantly departs from Aquinas's explicit temporal reasoning about past non-existence and generation/corruption. It replaces the problematic temporal inference with a demand for a concurrent sufficient reason.

  3.  **Does the Broader Contingency Argument Survive? Absolutely.**
      Kenny's critique effectively sinks Aquinas's *temporal* formulation of the Third Way. However, the *core intuition* behind arguments from contingency – that contingent existence requires a ground in necessary existence – is robust and survives in non-temporal, modal formulations that avoid the quantifier-shift fallacy entirely:

      *   **Leibniz & The Principle of Sufficient Reason (PSR):**
          *   Every fact (including the existence of every contingent being and the totality of contingent beings) must have a sufficient reason.
          *   The sufficient reason for the totality of contingent things cannot lie *within* that contingent totality (as each member and the whole lack necessity).
          *   Therefore, the sufficient reason must lie in a necessary being (whose existence is its own sufficient reason).
          *   *This bypasses time:* It deals with the *fact* of existence *now* and its explanation, not with past moments of non-existence.

      *   **Contemporary Modal Arguments (e.g., Pruss, Rasmussen, Koons):**
          *   These arguments operate purely within modal logic (possible worlds semantics).
          *   **Core Structure:**
              a.  There are contingent beings (beings that exist in some possible worlds but not others).
              b.  The existence of any contingent being requires explanation (often grounded in some version of PSR or a Principle of Causation).
              c.  Facts about the *collection* of all contingent beings (the "contingent realm" or "aggregate") also require explanation. Why does *this* contingent realm (or any contingent realm) exist?
              d.  The explanation cannot be found within the contingent realm itself or in another contingent realm. It must terminate in a necessary being (one that exists in *all* possible worlds).
          *   **Key Advantage:** These arguments make no assumptions about time, the beginning of the universe, or the temporal distribution of non-existence. They focus solely on the *modal status* (necessity/contingency) of beings and the need for explanation *in any possible world where contingents exist*. They are immune to Kenny's quantifier-shift objection.

  **Conclusion:**

  1.  **Kenny is Correct:** The inference from "each contingent thing fails to exist at some time" to "there was a time when all contingent things failed to exist" in Aquinas's Third Way is indeed a quantifier-shift fallacy. It's a logically invalid move without additional, highly questionable premises (like probabilistic necessities over infinite time).
  2.  **Charitable Readings Offer Context, Not Salvation:** Aristotelian commitments (eternal universe, matter as substratum) provide context but don't *logically* rescue the inference. Interpretations focusing on ontological dependence *per se* or the need for a sustaining ground *now* are philosophically stronger but represent a significant reconstruction of the *explicitly temporal* argument Aquinas presents.
  3.  **The Core Argument Thrives Elsewhere:** The fundamental insight of the contingency argument – that contingent existence requires a ground in necessary existence – is not only salvageable but flourishes in modern modal formulations (Leibnizian PSR-based or contemporary analytic). These formulations jettison the problematic temporal reasoning entirely, focusing instead on modal status and the demand for sufficient reason *at the moment of existence* or *across possible worlds*. They represent the robust future of cosmological arguments from contingency, unburdened by Aquinas's specific temporal misstep.

  Your reading group's identification of the problem is astute. While Aquinas's *temporal* version of the Third Way succumbs to Kenny's critique, the journey doesn't end there. The path forward lies in Leibniz, Pruss, and contemporary modal metaphysics, where the argument from contingency finds its most defensible and powerful expressions.
