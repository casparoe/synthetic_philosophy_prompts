answer: |-
  You've touched on one of the deepest tensions in democratic governance: **how to align decision-making authority with the scope of consequences**. Your colleague isn't wrong about the practical challenges, but your instinct is ethically sound and supported by political theory. Here's a principled framework to address this:

  ### Core Principles & Responses to the "Slippery Slope" Argument
  1.  **The "All Affected Interests" Principle:**
      *   **The Idea:** Those meaningfully impacted by a decision should have a voice in making it. This is a cornerstone of democratic legitimacy.
      *   **Your Instinct is Rooted Here:** The households on the county road are *directly, severely, and uniquely* impacted (noise, pollution, road damage) in a way vastly different from minor traffic ripple effects miles away. This isn't about "tiny claims"; it's about **disproportionate burden**.
      *   **Countering the Slippery Slope:** The principle isn't "anyone infinitesimally affected." The key is **intensity, proximity, and unavoidability**. The noise/exhaust for those adjacent households is constant, intrusive, and inescapable. Traffic increases miles away are diffuse and avoidable. We draw lines based on *significant, non-trivial impact* all the time (e.g., environmental impact assessments focus on immediate areas, not entire continents).

  2.  **The Problem of "Arbitrary" Boundaries:**
      *   **Acknowledging Reality:** Your colleague is right that *all* jurisdictional boundaries are human constructs. Town lines *are* arbitrary for this purpose.
      *   **Why It's Not a Valid Excuse:** Admitting boundaries are imperfect doesn't mean we should ignore glaring injustices they create. The *moral* arbitrariness lies in *using* an existing boundary that *clearly* excludes those bearing the brunt of the decision. The goal isn't a perfect line, but a *less unjust* process.

  3.  **The Legitimacy of "Settled" Boundaries:**
      *   **Practicality vs. Justice:** Settled boundaries provide administrative ease and predictability. However, their legitimacy rests on *roughly* aligning authority with consequences *most of the time*. When they fail spectacularly (as here), relying solely on them undermines legitimacy and creates resentment.

  ### Principled Ways to Approach This Decision (Beyond Just Voting)
  While changing voting eligibility *for this vote* is likely impractical, there are powerful, principle-based alternatives:

  1.  **Formal Consultation & Weighted Consideration (Your Instinct, Refined):**
      *   **Action:** Invite representatives from the affected county households (and potentially the county government) to present testimony *formally* to the board. Explicitly state in your deliberations and vote justification that their testimony carries *significant weight* due to the disproportionate impact on them.
      *   **Principle:** Acknowledges their unique stake. Gives them voice, even without a vote. Makes the board's decision more informed and morally defensible. This addresses the core ethical concern without redrawing voting lines.

  2.  **Require Mitigation Agreements:**
      *   **Action:** Make approval *conditional* on the developer (or the town) negotiating legally binding agreements with the county and/or affected residents to address impacts:
          *   **Noise:** Funding for sound barriers, property buyouts, or acoustic upgrades for homes.
          *   **Roads:** Developer-funded road upgrades/maintenance on the county road, traffic calming measures.
          *   **Environment:** Air quality monitoring, dust control, tree planting buffers.
      *   **Principle:** Directly addresses the harm imposed on those outside the boundary. Shifts the cost of the impact onto the decision-makers/beneficiaries (town tax base/developer). This embodies "polluter pays" or "beneficiary pays" justice.

  3.  **Joint Authority or Intergovernmental Agreement (Longer-Term Solution):**
      *   **Action:** Propose initiating discussions between the town and county to establish a formal process for reviewing developments near the border with significant cross-boundary impacts. Could involve joint hearings, required county input, or even shared decision-making for specific zones.
      *   **Principle:** Recognizes that modern development often ignores historical boundaries. Creates a *less arbitrary* framework for future decisions affecting shared spaces.

  4.  **Impact Assessment Focus:**
      *   **Action:** Demand the Environmental Impact Statement (EIS) or Traffic Study explicitly model and evaluate impacts *specifically* on these county households and roads, not just the town's averages. Force the board to confront the localized severity.
      *   **Principle:** Ensures the full consequences, especially for the most affected, are visible and central to the decision, countering the "out of sight, out of mind" problem.

  **Addressing Your Colleague's Core Argument:**

  *   **"No Natural Place to Stop?":** We stop where the impact shifts from *direct, severe, and localized* to *indirect, diffuse, and minor*. The line isn't perfect, but the distinction between the county road residents and someone 5 miles away is clear and meaningful.
  *   **"Arbitrary Line Either Way?":** True, but some lines are *less arbitrary* and *more just* than others. Using the town line here is *demonstrably unjust* to a specific, identifiable group. Choosing a method that *includes their voice* or *mitigates their harm* is far *less arbitrary* in moral terms.
  *   **"Anyone could claim a say?":** Only if you ignore the threshold of significant impact. Focusing on *proximity, intensity, and unavoidability* filters out trivial claims. No serious theory suggests someone unaffected deserves a say.

  **What You Can Do:**

  1.  **Frame it Ethically:** At the next meeting, articulate the *disproportionate burden* principle. "While we can't change who votes, we have a moral obligation to seriously weigh the severe, unavoidable harm this will inflict on our immediate neighbors who have no voice here. Ignoring them because a line on a map excludes them is unjust."
  2.  **Propose Solutions:** Advocate strongly for formal consultation with the affected residents/county and push for binding mitigation measures as a condition of approval. "Approval must be contingent on concrete steps to address the noise, pollution, and road damage imposed on those households."
  3.  **Demand Data:** Insist the EIS/Traffic Study explicitly details impacts *on that specific road and those specific homes*.
  4.  **Seek Allies:** Find other board members or townspeople who share your unease. Build consensus around mitigation.

  **Conclusion:** Your colleague identifies a real practical dilemma, but it doesn't justify moral abdication. The town boundary *is* arbitrary for this decision. **The principled approach is to acknowledge that the current process creates victims without recourse and to actively seek ways to mitigate that harm and incorporate their voice.** Formal consultation weighted heavily in deliberations, coupled with enforceable mitigation requirements, offers a concrete, fairer path forward that respects both practicality and the fundamental democratic principle that those who bear the greatest costs deserve to be heard. Your instinct is more than a feeling; it's an ethical imperative.
