answer: |-
  You've pinpointed a crucial distinction often blurred by the "Duhem-Quine thesis" label. Your physicist's intuition is correct: while both address holism and underdetermination, Duhem's scope is specific and methodological, while Quine's is radical and epistemological. Let's dissect them on their own terms:

  **1. Pierre Duhem: Holism within Mathematical Physics & the Role of "Bon Sens"**

  *   **Scope of Holism:** Duhem's holism is explicitly **confined to theoretical, mathematical physics**. He argued that an experiment in physics *never* tests a single hypothesis in isolation. Instead, it tests the *entire theoretical framework* used to design the experiment, interpret the instruments, and predict the outcome. This framework includes:
      *   The core hypothesis under scrutiny.
      *   Auxiliary hypotheses (e.g., assumptions about instrument function, boundary conditions, environmental factors, other supporting theories).
      *   Mathematical formalisms and logical connections.
  *   **What He Did NOT Claim:**
      *   **Empirical Sciences Exempt?** Duhem explicitly contrasted mathematical physics with other empirical sciences. He argued sciences like physiology or certain branches of chemistry often *do* allow for "crucial experiments" isolating single hypotheses, because their observations are more direct and less mediated by complex theoretical apparatus and instrumentation. His holism was **not** universal across all science.
      *   **No Threat to Logic/Mathematics:** Duhem saw logic and mathematics as the *tools* used to build theories and derive predictions. A failed prediction meant a problem *somewhere within the web* of physical hypotheses and their mathematical/logical connection to the experimental setup, **not** that logic itself was flawed or revisable. The rules of deduction were safe.
      *   **Not Radical Underdetermination:** While multiple adjustments are logically possible, Duhem did not believe theories were radically underdetermined *in practice*. He trusted the scientific process to converge.
  *   **Living with Underdetermination: "Bon Sens" (Good Sense):** This is Duhem's key mechanism for resolving ambiguity. When a prediction fails, physicists don't randomly adjust parts of the theoretical web. They use "good sense" – a kind of disciplined, collective scientific intuition honed by experience and understanding of the field. It guides them to:
      *   Question the most *likely* sources of error first (e.g., instrument calibration, known tricky auxiliary assumptions).
      *   Prioritize modifications that preserve the core coherence and established successes of the existing framework.
      *   Recognize implausible or ad-hoc patches.
      *   Ultimately converge on the adjustment deemed most reasonable by the community. "Bon sens" is not mere pragmatism; it's grounded in deep familiarity with the specific domain of physics and its history.

  **2. W.V.O. Quine: Radical Holism and the Web of Belief**

  *   **Scope of Holism:** Quine's holism is **total and epistemological**. He rejects the analytic/synthetic distinction outright ("Two Dogmas"). Consequently:
      *   **The Whole Web:** Our knowledge is a vast, interconnected "web of belief." *Any* statement (be it "The cat is on the mat," "F=ma," "2+2=4," or the law of non-contradiction) faces the "tribunal of experience" not individually, but **only as part of the entire corporate body**.
      *   **No Exemptions:** Logic and mathematics are **not** privileged. They lie deeper within the web, more central and resistant to revision due to their pervasive utility, but **no statement is *in principle* immune to revision** in the face of sufficiently "recalcitrant experience." Revising logic *is* a logical possibility for Quine.
      *   **Radical Underdetermination:** Quine famously argued for the **underdetermination of theory by all possible evidence**. Multiple, logically incompatible theories could potentially account for *all* observable data. This is a much stronger claim than Duhem's methodological point about blame-shifting within a single test.
  *   **Negotiating Logical Truths:** Quine's view on logic stems directly from rejecting analyticity. Logical truths aren't true purely by meaning; their meaning is intertwined with their role in the web. Faced with persistent, inexplicable conflict between experience and our best overall theory, revision *could* occur *anywhere*:
      *   We *could* (though it's highly unlikely and pragmatically disastrous) revise a logical law (e.g., adopt a paraconsistent logic) if it somehow allowed us to salvage a core part of our scientific worldview that would otherwise collapse under the weight of anomalies. His point is the *lack of an absolute boundary*, not that revising logic is sensible.
      *   "Sufficiently stubborn evidence" means evidence that resists accommodation *anywhere else* in the web without creating more problems than it solves. The pressure to revise deep central beliefs (like logic) would be immense and only conceivable in a profound crisis where no other adjustments work.
  *   **Living with Underdetermination: Pragmatic Virtues:** Without "bon sens" grounded in a specific discipline, Quine appeals to broad **pragmatic maxims** for choosing between empirically equivalent theories:
      *   **Simplicity:** Prefer the theory with fewer entities, assumptions, or complexity.
      *   **Conservatism:** Minimize change to the existing web of belief.
      *   **Generality/Scope:** Prefer theories that explain more phenomena.
      *   **Fecundity:** Prefer theories that suggest fruitful lines of further inquiry.
      *   **Modesty:** Avoid overly bold claims lacking strong evidential support. These are *guides for rational choice*, not guarantees of truth, employed when empirical evidence alone cannot decide.

  **3. Pulling Apart the Resolution Strategies: Bon Sens vs. Pragmatism**

  *   **Duhem's "Bon Sens":** This is **domain-specific, craft knowledge**. It arises from deep immersion in the *practice* and *history* of a particular science (physics). It's about knowing *which* auxiliaries are shakiest, *which* instruments are finicky, *which* core principles are most established. It's less a list of abstract virtues and more a cultivated intuition for navigating the specific landscape of physical theory. It assumes a shared understanding and purpose within the physics community.
  *   **Quine's Pragmatic Virtues:** These are **general, cross-disciplinary principles of theory choice**. They apply to *any* part of the web of belief, from choosing a physical theory to selecting a logical system or even a metaphysical framework. They are abstract maxims (simplicity, conservatism) used to make rational decisions when evidence underdetermines. They lack the deep disciplinary grounding of "bon sens."

  **Conclusion: The Composite Label and Underdetermination**

  1.  **Smuggling Modesty into Radicalism?** Absolutely. The composite label often obscures the vast gulf between Duhem's *modest, methodological observation about testing in mathematical physics* and Quine's *radical, epistemological thesis about the entire structure of human knowledge*. Duhem describes a practical problem physicists solve routinely with discipline-specific judgment; Quine posits a fundamental limitation on human knowledge itself.
  2.  **Source of Underdetermination:**
      *   **Duhem** gives a **genuine reason** for underdetermination *in the context of a single experimental test* within physics. Logic alone cannot pinpoint which part of the interconnected theoretical/experimental setup failed. This is a direct consequence of the holistic nature of testing complex physical theories.
      *   **Quine** gives a **much stronger, more radical reason** for underdetermination: the *total* underdetermination of theory by *all possible* evidence. This stems from his holistic web of belief and rejection of analyticity, suggesting that even our most fundamental beliefs are only contingently held based on overall pragmatic fit.
  3.  **Which Thesis Gives Us What?**
      *   **Duhem:** Provides a compelling and accurate description of **why blame-shifting is logically possible and practically common in experimental physics** when a prediction fails. It highlights the **methodological complexity** of testing.
      *   **Quine:** Provides a profound, controversial argument for the **potential revisability of *any* belief (including logic/math) and the radical underdetermination of theory by evidence at the global level**. It's a **deep epistemological challenge** to foundationalism and the analytic/synthetic distinction.

  **In essence:** Your friend sees emphasis; you see substance. You're right. Duhem offers a physicist's insight into testing complexity, resolved by craft knowledge. Quine offers a philosopher's radical critique of knowledge itself, resolved by pragmatic maxims. The composite name *does* risk conflating a specific methodological point with a sweeping epistemological doctrine. Duhem shows why logic can't assign blame *within a test*; Quine argues logic itself might *be* to blame, in principle, if the web demands it. They are distinct theses addressing different levels of concern.
