prompt: |-
  In my philosophy elective we've been going through Zhuangzis stuff on death, like the part where his wife dies and instead of crying he just sits there banging on a basin and singing, and this other weirder one where he's dreaming and talking to a skull that tells him being dead is honestly better than any of the hassles of being alive, even better than being a king. Kinda wild not gonna lie. It made me think about the whole longevity/biohacking thing going on right now though, like that tech guy (Bryan Johnson i think?) who spends something like $2 million a year trying to reverse his own aging, plus all the cryonics people who wanna get frozen so they can be revived later. Do you think Zhuangzi would say these guys are just deeply confused about something pretty basic, or could his actual philosophy be fine with people doing that? Kinda curious what his real reasoning would be either way, not just "he'd hate it" as a vibe answer.
