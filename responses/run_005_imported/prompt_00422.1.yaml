prompt: |-
  A close friend who works at a mid-stage startup has offered to sell me a slice of his vested equity in a private secondary deal, at a price that values the company noticeably below what I understand the last funding round implied. He insists the sale has nothing to do with his view of the company's prospects — he says he's still bullish and is only parting with a fraction of his stake because he needs cash for a house down payment. The price is tempting, but something about the situation nags at me: he has far more visibility than I do into things like churn, hiring, and runway, and he's the one initiating the trade. I keep circling back to the thought that if he genuinely believed the shares were worth more, why would he be selling to me at all, personal liquidity needs notwithstanding — shouldn't he just borrow against the stake, or sell to someone with less access to information than me? Is my hesitation well-founded, or am I overanalyzing an ordinary transaction between a well-informed insider and a cautious outsider? I'd like to understand what's actually going on here conceptually — what should I make of his stated reason for selling, and how much should it change my willingness to take the other side of this trade?
reasoning: |-
  Okay, let me start by unpacking this user's situation. They're considering buying vested equity from a friend at a startup, but the price is below the last funding round's valuation. The friend claims it's for a house down payment, not due to company prospects. The user is hesitant because their friend has insider knowledge and is initiating the sale. 

  First, I need to understand the core conflict here: trust versus rational skepticism. The user trusts their friend but can't ignore the information asymmetry. They're wondering if the friend's stated reason is genuine or if there's hidden risk. The key question is whether the friend's need for liquidity justifies selling below perceived value.

  Looking deeper, the user might be worried about two things: financial loss and the friendship dynamic. They don't want to feel taken advantage of, which could strain the relationship. Also, they might fear regretting the investment if the company underperforms. Their unspoken need could be reassurance that their caution is valid, not just paranoia.

  Next, analyzing the friend's perspective. Selling private equity isn't straightforward. Borrowing against shares is tough for early employees, and finding buyers isn't easy. The secondary market is illiquid. The friend might genuinely prefer a quick sale to a trusted person rather than navigating complex alternatives. The discount could be compensation for the risk and illiquidity the buyer assumes.

  The user also needs to evaluate their own position. How much do they know about the company beyond what the friend says? Can they handle the investment being illiquid for years? The discount might look good, but it's only a good deal if the company's actual value is higher. Without inside data, they're relying on secondhand info.

  The concept of adverse selection is crucial here. Insiders selling might signal hidden problems. But the user should assess if the friend's circumstances (house down payment) are plausible. People do prioritize personal life events over potential future gains. However, selling only a fraction of their stake could indicate they still believe in the company.

  The user's hesitation is well-founded. They shouldn't dismiss their gut feeling. It's essential to balance trust with due diligence. They could ask the friend for more transparency, like recent financial health indicators, while acknowledging the friend's constraints. Also, considering the investment's role in their portfolio—only risk what they can afford to lose.

  In conclusion, the situation isn't necessarily a red flag, but warrants caution. The discount compensates for risk, but the user must decide if it's worth the unknowns. They should communicate openly with the friend, seek independent data if possible, and ensure the investment aligns with their risk tolerance. Protecting both their finances and friendship requires careful steps.
answer: |-
  Your hesitation is **extremely well-founded** and reflects a sophisticated understanding of asymmetric information and signaling in private markets. Here's a breakdown of the conceptual forces at play and how to approach this:

  ### Key Concepts at Play

  1.  **Asymmetric Information:** Your friend has vastly superior information about the company's true health (churn, runway, internal forecasts, executive morale, potential upcoming challenges, etc.). You have only public/outsider knowledge.
  2.  **Signaling:** Actions speak louder than words. An insider *initiating* a sale of their own equity is a potential negative signal, regardless of their stated reasons. The market interprets insider selling (even in public companies) as a possible sign they believe the price is high relative to future prospects.
  3.  **Adverse Selection:** In markets with asymmetric information, buyers face the risk that sellers are motivated by negative private information. *Why is this particular slice of equity being offered to me?* The fear is you might be getting "selected" because the seller knows something you don't.
  4.  **Liquidity Constraints vs. Valuation Belief:** Your friend claims the sale is *solely* due to a liquidity need (house down payment), not a change in valuation belief. The core question is: **If they truly believe the shares are worth *significantly more* than the price they're offering you, why wouldn't they exhaust *all other options* before selling at a discount?**
  5.  **Private Market Illiquidity:** Private company shares are notoriously illiquid. Selling isn't as simple as clicking a button. Finding *any* buyer, especially quickly, can be difficult. This illiquidity inherently depresses the price below theoretical "fair value."

  ### Analyzing Your Friend's Stated Reason & Actions

  *   **"Needs Cash for a House Down Payment":** This is plausible. Life events happen. People prioritize tangible assets (a house) over potentially illiquid, high-risk future gains.
  *   **Selling Only a Fraction:** This *could* support his bullishness. He's not liquidating his entire stake.
  *   **Selling to *You*:** Why you?
      *   **Pro:** Trust, speed, avoiding complex secondary platforms/fees, desire to "share the opportunity" with a friend.
      *   **Con:** You are potentially an "easy mark" compared to sophisticated institutional secondary buyers who would conduct deep due diligence. You might accept a lighter information package. It bypasses the friction of finding an external buyer.
  *   **The Discount:** The below-last-round price is crucial.
      *   **Reasonable Explanations:**
          *   **Market Reality:** The last round's valuation was set during peak hype/favorable conditions that may no longer exist. The *true* current fair market value might simply be lower, and your friend is acknowledging this reality to get a deal done. Public comps may have cratered.
          *   **Illiquidity Discount:** Private shares inherently trade at a discount due to lack of marketability, lack of control, and risk. 10-30%+ discounts are common, even for healthy companies.
          *   **Speed Premium:** He needs cash *now* for the house, so he's willing to accept a discount for immediacy and certainty.
          *   **"Friends & Family" Discount (to you)?** Could he be offering you a slightly *better* deal than he could get externally to make it appealing?
      *   **Potential Warning Sign:** The discount *could* reflect negative insider knowledge about current performance or future prospects that hasn't been shared externally.

  ### Why Not Borrow or Sell Elsewhere?

  *   **Borrowing Against the Stake:**
      *   **Extremely Difficult:** Very few lenders accept private, illiquid startup equity as collateral, especially for an individual employee (vs. a founder with a large stake). The risk is too high for the lender.
      *   **High Cost:** If available, the interest rates would be punitive, reflecting the high risk and illiquidity. A mortgage likely has a much lower rate.
      *   **Margin Calls:** If the company's perceived value drops, he could face a margin call requiring immediate repayment or more collateral – a huge risk when buying a house.
  *   **Selling to Someone Else:**
      *   **Time-Consuming:** Finding a qualified buyer on a secondary platform (like Forge, EquityZen) or through a broker takes significant time and involves fees (often 3-5%+).
      *   **Due Diligence:** Sophisticated secondary buyers will demand extensive due diligence access. This can be cumbersome, require company approval, and potentially reveal information the company/friend would prefer not to share broadly. **This is a major point - selling to you avoids this scrutiny.**
      *   **Uncertainty:** He might not find a buyer quickly enough for his house timeline, or the bids might be even lower than what he's offering you.
      *   **Company Restrictions:** The company might have Right of First Refusal (ROFR) or other transfer restrictions that complicate external sales, but might be waived or streamlined for a "friendly" transfer to you.

  ### Should You Change Your Willingness? How to Proceed

  **Your hesitation is rational. Do *not* ignore it.** Proceed with extreme caution and diligence:

  1.  **Acknowledge the Asymmetry:** Accept that you will *never* have the same information he does. The discount *must* compensate you for this inherent risk and the illiquidity.
  2.  **Interrogate the Discount:**
      *   How large is it *really* compared to the last round? (Get the exact last round price per share).
      *   How does it compare to known secondary transactions for similar stage companies *in the current market*? (This is hard, but try to research).
      *   Is the discount large enough to compensate for the information asymmetry, illiquidity, and risk that the last round valuation was inflated?
  3.  **Scrutinize the "Why Me?" Factor:** Be honest. Is this primarily convenient *for him*? Does it feel like a genuine opportunity he wants to share, or a necessity he needs to fulfill quickly?
  4.  **Request Information (Cautiously):**
      *   Can he share *anything* more concrete about current performance? High-level revenue growth trend? Is the company on track for its next fundraise? (Be prepared for him to say "No, I can't share that").
      *   Ask if the company is aware of and approves this transfer (to understand ROFR/restrictions).
      *   Request the most recent *cap table* (to see the full structure, option pool health, liquidation preferences - understand where you stand in the payout stack).
  5.  **Conduct Independent Research:**
      *   Research the company's sector. Is it booming or struggling?
      *   Look up competitors. How are they faring?
      *   Check news and employee reviews (Glassdoor, Blind) for any red flags.
  6.  **Evaluate Your Own Position:**
      *   **Risk Tolerance:** Can you afford to lose 100% of this investment? Private startup equity is high-risk.
      *   **Liquidity Needs:** Are you comfortable locking this money up potentially for *years* (until an acquisition or IPO)?
      *   **Portfolio Fit:** Does this investment size and risk profile make sense within your overall portfolio?
      *   **Friendship Risk:** What happens to the friendship if the company fails and you lose your money? Or if it moons and he sold you shares cheaply? Have an explicit conversation about this *before* transacting.
  7.  **Consider Alternatives (For You):**
      *   **Negotiate:** Is the price truly the best he can do? Is there room given his urgency?
      *   **Walk Away:** The strongest option if anything feels off or the discount doesn't sufficiently compensate for the unknowns. Trust your gut.
      *   **Invest a Smaller Amount:** Reduce your exposure while still participating if you see upside.

  ### Conclusion

  Your friend's need for liquidity is plausible, and the constraints of the private market (illiquidity, difficulty borrowing) explain why selling to you at a discount might be his *pragmatic* best option, even if he remains bullish. **However, the inherent information asymmetry and the signaling effect of an insider-initiated sale cannot be dismissed.**

  **Your hesitation is not overanalysis; it's prudent risk assessment.** The discount is your compensation for taking on the risk of what you *don't* know. Whether it's sufficient depends on:

  1.  The **size of the discount** relative to current market realities for similar assets.
  2.  Your **independent assessment** of the company/sector (as much as possible).
  3.  Your **personal risk tolerance and liquidity needs**.
  4.  Your **comfort level with the inherent unknowns and potential impact on your friendship**.

  **Do not proceed based solely on trust or FOMO.** Demand transparency where possible, do your homework, ensure the discount is truly compelling, and only invest what you can afford to lose completely. If any element feels wrong after scrutiny, walking away is the wisest choice.
