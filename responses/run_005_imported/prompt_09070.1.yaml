prompt: |-
  I'm teaching a seminar on Popper this term, and yesterday's session was all about the verisimilitude mess -- the idea that even though pretty much every scientific theory we've ever had is technically false, some are still closer to the truth than others, and Popper tried to make that precise in terms of truth-content and falsity-content. I put the Tichy/Miller result on the board: on Popper's own definition, it turns out no false theory can ever come out more verisimilar than any other false theory, which is about as damaging as it sounds given that literally every theory anyone has taken seriously in the history of science is false in some respect. Everyone followed the abstract proof fine, but when I asked them to cook up their own concrete case that actually makes the problem bite, the room went dead quiet, and honestly I dont blame them -- the stock examples in the reading always feel a little rigged to me too.

  So here's what I want from you, partly so I can steal it for next week's handout: invent a small toy example of your own -- a couple of simple false "theories" about some domain, whatever you like, just not the usual weather-forecasting one everybody reaches for -- where most people's intuition would say one theory is clearly closer to the truth than the other. Then actually run it through Popper's machinery: lay out the truth-content and falsity-content each one generates, and show concretely where the comparison collapses or gives the wrong verdict, rather than just re-describing the general theorem. That's the bit my students keep glossing over, and I want to see if a genuinely fresh example makes it click.
reasoning: |-
  We are going to create a toy example in a very simple setting. Let's consider a domain with three possible states of the world, which we can represent as a set of three atomic propositions: P, Q, R. The set of possible worlds is thus the set of all possible combinations of truth values for these three propositions, which gives 8 possible worlds.

  For simplicity, let us assume that the actual world (the truth) is the state where P is true, Q is true, and R is true. We denote a world by a triple (p, q, r) where each is either T (true) or F (false). So the actual world is (T, T, T).

  Now, consider two false theories:

  Theory A: P ∧ Q ∧ ¬R   [which says P and Q are true and R is false]
  Theory B: P ∧ ¬Q ∧ R   [which says P and R are true and Q is false]

  Both are false because in the actual world R is true (so A is false) and Q is true (so B is false).

  Intuitively, which one is closer to the truth? Let's see:

  - The actual world: (T, T, T)
  - Theory A: (T, T, F) -> it gets P and Q right, but R wrong.
  - Theory B: (T, F, T) -> it gets P and R right, but Q wrong.

  Both theories have two correct atomic facts and one incorrect. So intuitively, they seem equally close? But let's try to make one seem closer. We can adjust.

  Alternatively, let's make the actual world (T, T, T) and then:

  Theory A: P ∧ Q   (which is true in worlds: (T, T, T) and (T, T, F))
  Theory B: P ∧ R   (which is true in worlds: (T, T, T) and (T, F, T))

  Both theories are false because they are not the whole truth? Actually, no: they are true in the actual world? We need false theories. So let me adjust.

  We want both theories to be false. So let me make:

  Actual world: (T, T, T)

  Theory A: P ∧ Q ∧ ¬R   [false, as above]
  Theory B: P ∧ ¬Q ∧ ¬R   [which says P is true, Q is false, R is false]

  Now, compare:

  - Theory A: (T, T, F) -> correct on P and Q, wrong on R.
  - Theory B: (T, F, F) -> correct on P, wrong on Q and R.

  Intuitively, Theory A is closer to the truth because it has two correct (P and Q) and only one wrong (R) while Theory B has only one correct (P) and two wrong (Q and R).

  Now, we will apply Popper's definition of verisimilitude.

  Popper's definition (as per his 1963 Conjectures and Refutations) is:

  Theory A has more verisimilitude than theory B if and only if:
  1. The truth-content of A is greater than the truth-content of B, and
  2. The falsity-content of B is at least as great as the falsity-content of A.

  Or, equivalently (and more precisely) in terms of set inclusion:

  - The truth-content of A includes the truth-content of B, and
  - The falsity-content of B includes the falsity-content of A.

  But note: the Tichy-Miller result shows that for any two false theories, this cannot hold.

  We are going to work with the sets of true and false consequences.

  First, we fix the language: we have three atomic propositions: P, Q, R. The set of all possible worlds is:

  W1: (T, T, T)   [actual]
  W2: (T, T, F)
  W3: (T, F, T)
  W4: (T, F, F)
  W5: (F, T, T)
  W6: (F, T, F)
  W7: (F, F, T)
  W8: (F, F, F)

  The actual world is W1.

  Now, let's consider:

  Theory A: P ∧ Q ∧ ¬R
  This theory is true only in W2: (T, T, F)

  Theory B: P ∧ ¬Q ∧ ¬R
  This theory is true only in W4: (T, F, F)

  Both are false because the actual world is W1, not W2 or W4.

  We now need to consider the logical consequences of these theories. Since the language is propositional, we can consider all non-equivalent propositions (but note: we are interested in the truth-content and falsity-content, which are sets of true and false consequences respectively).

  But note: Popper's definition is in terms of the set of true statements entailed by the theory (truth-content) and the set of false statements entailed by the theory (falsity-content).

  However, the Tichy-Miller critique uses a more refined approach: they consider the sets of true and false consequences in the context of the symmetric difference of the sets of worlds in which the theories hold.

  But let me try to follow the standard way:

  We can represent a theory by the set of worlds in which it is true. Then:

  Theory A: {W2}
  Theory B: {W4}

  The actual world is W1.

  Truth-content of a theory: the set of true statements that the theory entails. But note: a statement is true if it is true in the actual world.

  Similarly, a false statement is false in the actual world.

  But note: the truth-content of a theory T is the set of all true logical consequences of T. Similarly, falsity-content is the set of all false logical consequences of T.

  However, the set of logical consequences is infinite. So we need a way to compare.

  Popper's original idea was to use the set of consequences, but Tichy and Miller showed that if we do that, then for two false theories, the condition fails because the truth-content of one cannot be a superset of the truth-content of the other without also having problems with the falsity-content.

  Let me try to compute the truth-content and falsity-content for A and B.

  We will consider the set of all contingent statements that are consequences of the theory. But note that we can focus on the strongest consequences: the theory itself, and then the logical consequences.

  However, we can use the fact that in propositional logic, the set of consequences of a theory that is true in a single world is exactly the set of all statements that are true in that world.

  But note: if we have a theory T that is true only in a set of worlds S, then a consequence of T is a statement that is true in every world in S. So for a theory that is true in only one world (like A and B in our example), the set of consequences of T is exactly the set of statements that are true in that world.

  But wait: that is not entirely accurate. For example, the statement "P" is a consequence of A because A entails P. But note that in the actual world, P is true, so "P" is a true consequence. However, in the world W2, P is true, so any consequence of A is true in W2. But we are interested in whether the consequence is true in the actual world.

  So:

  - A true consequence of A is a statement that is entailed by A and that is true in the actual world (W1).
  - A false consequence of A is a statement that is entailed by A and that is false in the actual world.

  Similarly for B.

  Now, let's list some consequences for A:

  A entails:
  1. P
  2. Q
  3. ¬R
  4. P ∧ Q
  5. P ∧ ¬R
  6. Q ∧ ¬R
  7. P ∧ Q ∧ ¬R
  8. ... and many more, including tautologies? But note: tautologies are true, but they are also entailed by every theory. We usually exclude tautologies because they are in the truth-content of every theory.

  Similarly, we should avoid contradictions because they are false and entailed by no consistent theory.

  So let us focus on contingent statements.

  For Theory A (which is true only in W2):

  Consequences of A must be true in W2. So:

  - Any statement that is true in W2 is a consequence of A? No: the consequences are the statements that are true in every world in which A is true. Since A is true only in W2, a statement is a consequence of A if and only if it is true in W2.

  But note: we are interested in whether these statements are true in the actual world W1.

  So:

  In W2: P is true, Q is true, R is false -> so ¬R is true.

  In W1: P is true, Q is true, R is true -> so R is true, hence ¬R is false.

  Therefore, the consequence "¬R" of A is false in the actual world.

  Similarly, the consequence "P" of A is true in the actual world.

  So:

  Truth-content of A (TA): the set of consequences of A that are true in W1.
  Falsity-content of A (FA): the set of consequences of A that are false in W1.

  Similarly for B.

  Now, let's list the atomic and some basic consequences:

  For A:

  - P: true in W1 -> so in TA.
  - Q: true in W1 -> so in TA.
  - ¬R: false in W1 (because R is true) -> so in FA.
  - P ∧ Q: true in W1 -> TA.
  - P ∧ ¬R: false in W1 -> FA.
  - Q ∧ ¬R: false in W1 -> FA.
  - P ∧ Q ∧ ¬R: false in W1 -> FA.

  Also, note that A entails many other statements, for example, P ∨ Q, which is true in W1 -> TA.

  But also, A entails ¬R, which we have.

  Now for B:

  Theory B: P ∧ ¬Q ∧ ¬R -> true only in W4: (T, F, F)

  Consequences of B are the statements true in W4.

  In W4: P is true, Q is false, R is false -> so ¬Q and ¬R are true.

  In W1: P is true, Q is true, R is true -> so ¬Q is false, ¬R is false.

  Consequences of B:

  - P: true in W1 -> TA (for B, we call it TB) is the truth-content of B, so P is in TB.
  - ¬Q: false in W1 -> so in FB (falsity-content of B).
  - ¬R: false in W1 -> FB.
  - P ∧ ¬Q: false in W1 -> FB.
  - P ∧ ¬R: false in W1 -> FB.
  - ¬Q ∧ ¬R: false in W1 -> FB.
  - P ∧ ¬Q ∧ ¬R: false in W1 -> FB.

  Now, let's compare the truth-contents and falsity-contents.

  We want to see if:

  1. The truth-content of A (TA) is a superset of the truth-content of B (TB), and
  2. The falsity-content of B (FB) is a superset of the falsity-content of A (FA).

  But note: the sets are infinite, but we can look at key statements.

  First, truth-content:

  TA includes: P, Q, P∧Q, P∨Q, P∨R, ... (any true statement that holds in W2 and is also true in W1? But note: a statement in TA must be a consequence of A, i.e., true in W2, and also true in W1).

  Similarly, TB includes: P, P∨Q, P∨R, ... (any true statement that holds in W4 and is also true in W1).

  But note: Q is in TA because A entails Q and Q is true in W1.

  Is Q in TB? TB is the set of consequences of B that are true in W1. But B entails ¬Q, so it does not entail Q. Moreover, Q is not a consequence of B because in W4, Q is false. Therefore, Q is not in TB.

  Therefore, TA contains Q, but TB does not contain Q. So TA is not a subset of TB? Actually, we are trying to see if TA is a superset of TB. But note: we have found a statement (Q) that is in TA but not in TB. That doesn't directly tell us about the superset relation. We need to check if every statement in TB is also in TA.

  What is in TB? For example, P is in TB and also in TA. Also, P∨Q is in TB? Let's check: B entails P∨Q? In W4, P is true, so P∨Q is true. And in W1, P∨Q is true. So P∨Q is in TB.

  Is P∨Q in TA? A entails P∨Q? In W2, P and Q are true, so P∨Q is true. And in W1, it's true. So yes, P∨Q is in TA.

  Similarly, P∨R: in W4, P is true -> true. In W1, true -> so in TB. In TA: in W2, P is true -> true. In W1, true -> so in TA.

  Now, what about a statement like "¬Q ∨ R"? Is that in TB? Let's check: in W4, ¬Q is true and R is false, so ¬Q ∨ R is true (because ¬Q is true). In W1: ¬Q is false, R is true, so ¬Q ∨ R is true. So "¬Q ∨ R" is in TB.

  Is "¬Q ∨ R" in TA? In W2: Q is true (so ¬Q is false) and R is false, so ¬Q ∨ R is false. Therefore, A does not entail ¬Q ∨ R (because it is false in W2). So ¬Q ∨ R is not in TA.

  Therefore, we have a statement "¬Q ∨ R" that is in TB but not in TA.

  So TB is not a subset of TA.

  Similarly, we can check for other statements.

  Therefore, condition (1) fails: the truth-content of A is not a superset of the truth-content of B.

  But wait, we also need to check condition (2)? Actually, condition (1) already fails. So according to Popper's definition, A does not have more verisimilitude than B because the truth-content of A is not greater (in the sense of superset) than that of B.

  But note: we might try the other way: is TB a superset of TA? Then we would have to check if every statement in TA is in TB. But we saw that Q is in TA but not in TB. So that fails too.

  Therefore, the truth-contents are incomparable.

  Now, condition (2): the falsity-content of B should be at least as great as that of A (i.e., FA ⊆ FB).

  But let's check:

  FA (falsity-content of A): false consequences of A.

  We have:
  - ¬R
  - P ∧ ¬R
  - Q ∧ ¬R
  - P ∧ Q ∧ ¬R
  - ... and any false statement that is entailed by A.

  Similarly, FB (falsity-content of B):
  - ¬Q
  - ¬R
  - P ∧ ¬Q
  - P ∧ ¬R
  - ¬Q ∧ ¬R
  - P ∧ ¬Q ∧ ¬R
  - ... 

  Notice that ¬R is in both FA and FB.

  But is there a statement in FA that is not in FB? For example, Q ∧ ¬R: is this in FB? B entails Q ∧ ¬R? In W4: Q is false, so Q ∧ ¬R is false. Therefore, B does not entail Q ∧ ¬R. So Q ∧ ¬R is not a consequence of B, hence not in FB.

  But Q ∧ ¬R is in FA because A entails it and it is false in W1.

  Therefore, FA is not a subset of FB.

  Similarly, is there a statement in FB that is not in FA? For example, ¬Q: is ¬Q in FA? A entails ¬Q? In W2, Q is true, so ¬Q is false. Therefore, A does not entail ¬Q. So ¬Q is not in FA.

  But ¬Q is in FB.

  So FA and FB are also incomparable.

  Therefore, by Popper's definition, we cannot say that A has more verisimilitude than B, even though intuitively A is closer to the truth (it has two correct atomic facts versus one).

  This is a concrete example of the Tichy-Miller problem: for two false theories, the truth-content and falsity-content sets are not comparable in the way required by Popper's definition.

  So to summarize:

  - We have two theories: 
      A: P ∧ Q ∧ ¬R (false because R is actually true)
      B: P ∧ ¬Q ∧ ¬R (false because both Q is true and R is true)

  - Intuition: A is closer to the truth (2 out of 3 correct) than B (1 out of 3 correct).

  - Popper's definition fails to show that A has more verisimilitude than B because:
      - The truth-content of A is not a superset of the truth-content of B (e.g., the true statement "¬Q ∨ R" is entailed by B but not by A).
      - The falsity-content of A is not a subset of the falsity-content of B (e.g., the false statement "Q ∧ ¬R" is entailed by A but not by B).

  Therefore, the definition does not yield the intuitive result.

  Note: We could have chosen other statements, but the above shows the incomparability.

  This example is simple and avoids the weather-forecasting cliché.
answer: |-
  Below is a self-contained toy example designed to illustrate the Tichy-Miller problem with Popper's verisimilitude. It uses a simple domain of three light switches (P, Q, R) and avoids weather-forecasting clichés. The example includes:  
  - A clearly defined "truth" (actual state of the switches).  
  - Two false theories (A and B), where intuition strongly suggests A is closer to the truth.  
  - A step-by-step application of Popper's verisimilitude definition (truth-content and falsity-content).  
  - Concrete demonstration of where the comparison fails.  

  ---

  ### **Toy Example: The Light Switch Domain**  
  **Setup**:  
  - Consider three light switches: P, Q, R. Each can be ON (true) or OFF (false).  
  - The **actual world** (truth) is:  
    - P = ON (true), Q = ON (true), R = ON (true).  
    - Symbolically: (P ∧ Q ∧ R) is true.  
  - We evaluate two false theories:  
    - **Theory A**: "P and Q are ON, but R is OFF" → (P ∧ Q ∧ ¬R).  
    - **Theory B**: "P is ON, but Q and R are OFF" → (P ∧ ¬Q ∧ ¬R).  

  **Intuitive verdict**:  
  - Theory A correctly describes P and Q but wrongly claims R is OFF (1 error).  
  - Theory B correctly describes P but wrongly claims Q and R are OFF (2 errors).  
  - Intuition: **A is closer to the truth** than B.  

  ---

  ### **Popper's Verisimilitude Machinery**  
  Popper defines verisimilitude as:  
  > Theory A has more verisimilitude than B iff:  
  > 1. **Truth-content** of A ⊇ **truth-content** of B, and  
  > 2. **Falsity-content** of B ⊇ **falsity-content** of A.  

  Where:  
  - **Truth-content** = All *true* logical consequences of the theory.  
  - **Falsity-content** = All *false* logical consequences of the theory.  

  We now compute these for A and B.  

  ---

  ### **Step 1: Identify Consequences**  
  We list key consequences of A and B, focusing on **contingent** statements (non-tautological, non-contradictory). The actual truth (P, Q, R all true) is our benchmark.  

  #### **Consequences of Theory A (P ∧ Q ∧ ¬R)**:  
  - Entailed statements (all must hold in A's world: P=ON, Q=ON, R=OFF):  
    - P (true in actual world)  
    - Q (true)  
    - ¬R (false; R is actually ON)  
    - P ∧ Q (true)  
    - P ∧ ¬R (false)  
    - Q ∧ ¬R (false)  
    - P ∧ Q ∧ ¬R (false)  
    - ¬R ∨ Q (true; Q is true)  
    - P ∨ ¬Q (true; P is true)  

  #### **Consequences of Theory B (P ∧ ¬Q ∧ ¬R)**:  
  - Entailed statements (all must hold in B's world: P=ON, Q=OFF, R=OFF):  
    - P (true)  
    - ¬Q (false; Q is actually ON)  
    - ¬R (false)  
    - P ∧ ¬Q (false)  
    - P ∧ ¬R (false)  
    - ¬Q ∧ ¬R (false)  
    - P ∧ ¬Q ∧ ¬R (false)  
    - ¬Q ∨ ¬R (false; both ¬Q and ¬R are false)  
    - P ∨ R (true; P is true)  

  ---

  ### **Step 2: Truth-Content and Falsity-Content**  
  Classify each consequence as part of the theory's truth-content (if true in actual world) or falsity-content (if false in actual world).  

  #### **Theory A's Content**:  
  | Consequence      | Actual Truth | Content Type       |  
  |------------------|--------------|--------------------|  
  | P                | True         | Truth-content (TA) |  
  | Q                | True         | Truth-content (TA) |  
  | ¬R               | False        | Falsity-content (FA)|  
  | P ∧ Q            | True         | Truth-content (TA) |  
  | P ∧ ¬R           | False        | Falsity-content (FA)|  
  | Q ∧ ¬R           | False        | Falsity-content (FA)|  
  | P ∧ Q ∧ ¬R       | False        | Falsity-content (FA)|  
  | ¬R ∨ Q           | True         | Truth-content (TA) |  
  | P ∨ ¬Q           | True         | Truth-content (TA) |  

  - **TA (truth-content)**: {P, Q, P ∧ Q, ¬R ∨ Q, P ∨ ¬Q, ...}  
  - **FA (falsity-content)**: {¬R, P ∧ ¬R, Q ∧ ¬R, P ∧ Q ∧ ¬R, ...}  

  #### **Theory B's Content**:  
  | Consequence      | Actual Truth | Content Type       |  
  |------------------|--------------|--------------------|  
  | P                | True         | Truth-content (TB) |  
  | ¬Q               | False        | Falsity-content (FB)|  
  | ¬R               | False        | Falsity-content (FB)|  
  | P ∧ ¬Q           | False        | Falsity-content (FB)|  
  | P ∧ ¬R           | False        | Falsity-content (FB)|  
  | ¬Q ∧ ¬R          | False        | Falsity-content (FB)|  
  | P ∧ ¬Q ∧ ¬R      | False        | Falsity-content (FB)|  
  | ¬Q ∨ ¬R          | False        | Falsity-content (FB)|  
  | P ∨ R            | True         | Truth-content (TB) |  

  - **TB (truth-content)**: {P, P ∨ R, ...}  
  - **FB (falsity-content)**: {¬Q, ¬R, P ∧ ¬Q, P ∧ ¬R, ¬Q ∧ ¬R, P ∧ ¬Q ∧ ¬R, ¬Q ∨ ¬R, ...}  

  ---

  ### **Step 3: Apply Popper's Conditions**  
  We test if:  
  1. **TA ⊇ TB** (A's truth-content includes B's truth-content).  
  2. **FB ⊇ FA** (B's falsity-content includes A's falsity-content).  

  #### **Condition 1: Is TA ⊇ TB?**  
  - Consider a statement in TB: **P ∨ R**.  
    - B entails P ∨ R (since P is true in B's world).  
    - P ∨ R is true in the actual world (P is true).  
  - **Is P ∨ R in TA?**  
    - A entails P ∨ R? In A's world (P=ON, Q=ON, R=OFF), P ∨ R is true (because P is true).  
    - So yes, P ∨ R is in TA.  
  - Now consider another statement in TB: **P** (trivially, since B entails P).  
    - P is also in TA (A entails P).  
  - **But**: Is there a statement in TB *not* in TA?  
    - Consider **¬Q ∨ ¬R**.  
      - B entails ¬Q ∨ ¬R (in B's world, ¬Q and ¬R are both true, so their disjunction is true).  
      - Actual truth value: ¬Q ∨ ¬R is **false** (since Q and R are both ON).  
      - Thus, ¬Q ∨ ¬R is in **FB (falsity-content)**, not in TB.  
    - TB only contains *true* statements, so we need a *true* consequence of B not entailed by A.  
  - **Crucial example**: Consider the statement **¬Q ∨ R**.  
    - B entails ¬Q ∨ R? In B's world (P=ON, Q=OFF, R=OFF): ¬Q is true, so ¬Q ∨ R is true.  
    - Actual truth value: ¬Q ∨ R. Since Q is ON, ¬Q is false; R is ON, so ¬Q ∨ R is **true**.  
    - Thus, **¬Q ∨ R is in TB** (true consequence of B).  
    - **Is ¬Q ∨ R in TA?**  
      - A entails ¬Q ∨ R? In A's world (P=ON, Q=ON, R=OFF):  
        ¬Q is false (Q is ON), R is OFF, so ¬Q ∨ R is false.  
      - Thus, A does **not** entail ¬Q ∨ R → not in TA.  
  - **Result**: TB contains ¬Q ∨ R, but TA does not. Thus, **TA is *not* a superset of TB** (Condition 1 fails).  

  #### **Condition 2: Is FB ⊇ FA?**  
  - Consider a statement in FA: **Q ∧ ¬R**.  
    - A entails Q ∧ ¬R (true in A's world).  
    - Q ∧ ¬R is false in actual world (R is ON, so ¬R is false).  
  - **Is Q ∧ ¬R in FB?**  
    - B entails Q ∧ ¬R? In B's world (P=ON, Q=OFF, R=OFF): Q is OFF, so Q ∧ ¬R is false.  
    - Thus, B **does not** entail Q ∧ ¬R → not in FB.  
  - **Result**: FA contains Q ∧ ¬R, but FB does not. Thus, **FB is *not* a superset of FA** (Condition 2 fails).  

  ---

  ### **Conclusion: The Verisimilitude Comparison Fails**  
  - Popper's conditions **cannot be satisfied**:  
    - Condition 1 fails because B has a true consequence (¬Q ∨ R) not shared by A.  
    - Condition 2 fails because A has a false consequence (Q ∧ ¬R) not shared by B.  
  - **Result**: Popper's definition concludes that **A does *not* have more verisimilitude than B**—even though intuition strongly says A is closer to the truth.  

  This is the Tichy-Miller problem in action: for *any* two false theories, Popper's definition fails to compare them because their truth-contents and falsity-contents are "incompatible" in this way. The machinery collapses because false theories generate unique mixtures of true/false consequences that resist subset comparisons.  

  ---

  ### **Why This Example Works for Teaching**  
  1. **Concrete and intuitive**: Switches are relatable; errors are easy to count.  
  2. **No rigged feel**: Theories A and B are symmetric in structure (conjunctions), but their relationship to truth is asymmetric.  
  3. **Step-by-step failure**: Students see exactly where the conditions break (¬Q ∨ R for Condition 1; Q ∧ ¬R for Condition 2).  
  4. **Generalizes the theorem**: Illustrates why *no* false theory can surpass another under Popper's definition.  

  Use this in your handout to make the abstract Tichy-Miller result tangible. Students can run the checks themselves to see why Popper's definition falls apart.
