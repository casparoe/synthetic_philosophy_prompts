prompt: |-
  So "four-dimensionalism" seems to get used for two different claims and it's kind of bugging me. Sometimes people mean perdurantism (objects persist by having temporal parts, so they're only ever partly present at a given moment) and sometimes they just mean eternalism (all times are equally real, no objectively privileged present). Can you compare perdurantism with eternalism and spell out exactly where they come apart? Like, does being an eternalist commit you to perdurantism, could there be a coherent eternalist endurantist, and does perdurantism even make sense if your stuck with presentism? Curious which of these combos are actually defended by anyone vs which ones are basically nonstarters.
