  I've been sitting in on a reading group that's slowly working through the decision-theoretic literature on Pascal's Wager, and last week's session left me stuck on something the facilitator only gestured at. We spent most of the time on the standard objections—the many-gods problem, worries about whether infinite utility even makes sense as an input to expected value calculations, mixed strategies—but almost no time on what falls out the other side once you take the wager's underlying logic seriously as a general-purpose decision rule rather than a one-off argument about religious belief.

  What I'm after is this: if you grant the wager's core structure (an option with tiny or unknown probability but unbounded payoff should dominate your decision-making regardless of how implausible it seems), what does that commit you to in domains far removed from theology? I'm thinking about things like existential risk charities that promise astronomically large payoffs, weird longtermist cause areas, or even personal choices where someone claims a small chance of infinite or vast reward. Please lay out the most important implications of accepting Pascal's Wager-style reasoning as a legitimate general principle—both for how we'd have to structure our practical decision-making across unrelated domains, and for what it would reveal as unstable or self-undermining about the reasoning itself. I'd like the answer to go beyond "it's a hasty generalization" and actually trace through what happens to ordinary decision theory once this kind of argument is treated as valid.
