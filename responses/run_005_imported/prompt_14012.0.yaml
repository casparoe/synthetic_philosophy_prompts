answer: |-
  Here are 8 interview questions designed to probe the professor's thesis deeply, challenge its boundaries, and place it in historical context, complete with anticipated responses and follow-ups:

  1.  **Core Challenge:**
      *   **Question:** Your book argues Aquinas’s seemingly cautious stance in *On Kingship* (waiting for public authority) is more prudential advice than his core position, and that his *Commentary on the Sentences* and the *Summa* implicitly license more individual action against illegitimate rulers. What’s the *strongest textual evidence* from the *Summa* or *Sentences* that Aquinas intended this more permissive stance to override his explicit warnings against private citizens acting alone in *On Kingship*?
      *   **Likely Answer:** She might point to discussions of resisting injustice in general, the definition of tyranny as injustice itself, or passages implying a duty to oppose manifest evil, arguing these principles logically extend to removing a usurper.
      *   **Follow-Up:** If Aquinas saw this implication so clearly, why do you think he *explicitly cautioned against private action* in *On Kingship*? Was he being inconsistent, deliberately cautious for political reasons, or simply addressing a different facet of the problem? Does treating *On Kingship* as merely "prudential" risk minimizing a significant part of his practical political thought?

  2.  **The Usurper Distinction & Its Limits:**
      *   **Question:** Aquinas hinges his (arguably) more permissive stance on *illegitimate* rule (usurpation). How does your reading define "usurper" concretely? How much ambiguity or potential for subjective interpretation can this category bear *before* it effectively collapses into "any ruler I deem tyrannical," which Aquinas explicitly warns against?
      *   **Likely Answer:** She might emphasize objective criteria: lack of rightful title, violation of fundamental laws/constitutions, or perhaps persistent violation of divine/natural law constituting a *de facto* forfeiture of legitimacy, arguing Aquinas provided tools for this discernment.
      *   **Follow-Up:** Isn't the *application* of those "objective" criteria inherently contested? Historically, both sides in a conflict often claimed legitimacy. How does your reading prevent "usurper" from becoming a purely rhetorical weapon, precisely the danger Aquinas foresaw in private judgment leading to worse disorder?

  3.  **Sedition & Re-defining Disorder:**
      *   **Question:** A key part of your argument involves Aquinas’s treatment of sedition (*ST* II-II Q42). If the tyrant *is* the source of "real" disorder and injustice, resisting them isn't sedition but restoring order. But doesn't this move – redefining the *status quo* itself as the disorder justifying resistance – open the door for *any* dissenting group to justify overthrowing *any* ruler they dislike by claiming *he* is the true source of disorder?
      *   **Likely Answer:** She might argue Aquinas sets a high bar: only *manifest* and *persistent* tyranny constituting a fundamental attack on the common good justifies this redefinition, not mere policy disagreements or isolated injustices.
      *   **Follow-Up:** How does Aquinas *practically* distinguish "manifest tyranny" justifying this redefinition from "bad governance" that must be endured? Doesn't the reliance on recognizing "manifest tyranny" bring us right back to the problem of contested judgment, especially for *private individuals* acting alone? How is this materially different from subjectivism?

  4.  **The Jean Petit Stress Test:**
      *   **Question:** Let's test this with a historical case Aquinas influenced: the Jean Petit affair (1410s). Petit justified tyrannicide against a *seemingly legitimate* ruler (the Duke of Orleans) accused of tyranny, using arguments echoing Aquinas. The Council of Constance *condemned* Petit's justification, partly *citing Aquinas* on the dangers of private judgment. How does your reading of Aquinas as implicitly permitting more individual action against *illegitimate* rulers account for this condemnation? Was Constance misreading Aquinas, or does it highlight a genuine tension/limitation in his thought that your thesis might underestimate?
      *   **Likely Answer:** She might argue Orleans was arguably *not* truly legitimate in the eyes of his opponents (Burgundians), that Constance's condemnation was politically motivated, or that it reflects a later, more cautious *interpretation* of Aquinas, not his original intent.
      *   **Follow-Up:** Doesn't the very fact that Aquinas's framework *could* be stretched to justify Petit's act – and was then *authoritatively rejected* by the Church using his own cautions – actually *support* the traditional "cautious Aquinas" reading? Doesn't it show the inherent danger *he* warned about in allowing subjective interpretations of tyranny and usurpation to license private violence?

  5.  **Community vs. Individual Action:**
      *   **Question:** Even if Aquinas is more open to action against a usurper, he consistently emphasizes *community* action or action by "public authority." How does your argument for *individual* or small-group action square with this? Does "the community" have to be entirely dissolved or silenced for individual action to be justified, or is there a threshold of failed communal mechanisms?
      *   **Likely Answer:** She might argue that when the "public authority" *is* the usurper or completely subservient to them, the *populus* retains residual authority, and individuals acting as its "instruments" (especially if widely supported) can fulfill this role. Aquinas's silence on *how* a silenced community acts creates space for this.
      *   **Follow-Up:** Doesn't this risk creating a "vanguard" justification? How does an individual *know* they are truly acting as the instrument of the silenced *populus* and not just pursuing a personal vendetta or factional interest? How does Aquinas help us navigate *that* epistemic problem?

  6.  **Endurance vs. Action - The Prayer Fallback:**
      *   **Question:** Aquinas explicitly says that if no public authority can depose a tyrant, the people should "endure" and "pray." How does your thesis reconcile this seemingly clear directive with the idea that he implicitly licenses individual action against *illegitimate* rulers? Is "endure" only for legitimate rulers turned bad? Or is prayer/endurance the *only* option when the community *cannot* act collectively?
      *   **Likely Answer:** She might argue "endure" applies primarily to *legitimate* rulers governing badly, or that "if no public authority can" implies the *failure* of mechanisms, at which point the *duty* to oppose manifest injustice (implied elsewhere) kicks in, superseding endurance. Prayer isn't mutually exclusive with action.
      *   **Follow-Up:** Where, explicitly or implicitly, does Aquinas *state* that this duty supersedes endurance in the case of a usurper when collective action fails? Is this an inference from broader principles, and if so, does that inference contradict his explicit advice to endure?

  7.  **Comparison: Aquinas vs. John of Salisbury:**
      *   **Question:** You position your reading as uncovering a more radical Aquinas than traditionally acknowledged, but one that remains distinct from, and arguably more careful than, John of Salisbury's explicit, almost celebratory defense of tyrannicide (*Policraticus*). Beyond the "usurper" distinction, what are the *most significant* conceptual or justificatory differences between Salisbury's "full-throated" defense and the Aquinas you reconstruct? Where does your Aquinas *still* pull his punches compared to Salisbury?
      *   **Likely Answer:** She might highlight Aquinas's greater emphasis on due process where possible, the usurper/legitimate distinction, his focus on the *common good* rather than just punishing sin, his warnings about consequences, and perhaps a less "divine mandate" feel for the killer.
      *   **Follow-Up:** Given that Salisbury also discusses consequences and the tyrant's violation of law/divine order, and given that Aquinas's "careful" distinctions (like usurper) seem highly vulnerable to subjective interpretation in practice (as the Petit affair shows), is the *practical* difference between your reconstructed Aquinas and Salisbury as significant as the theoretical one? Does the emphasis on "illegitimacy" *actually* constrain action more effectively than Salisbury's focus on tyranny *per se*?

  8.  **Legacy & Risks:**
      *   **Question:** If your reading is correct, what do you believe Aquinas gained by being implicit rather than explicit? And conversely, what are the potential *dangers* or risks – historically or conceptually – in emphasizing this more permissive, implicit Aquinas? Does it inadvertently validate the very "private judgment leading to chaos" scenario he explicitly feared?
      *   **Likely Answer:** She might argue he gained safety (avoiding condemnation like Petit), broader acceptability, or was reflecting the messy reality of political judgment. Dangers might include misuse, but she'd likely argue the dangers of *not* resisting manifest tyranny by a usurper are greater, and that proper understanding mitigates the risks.
      *   **Follow-Up:** Given the historical record of tyrannicide often leading to instability or worse tyranny (as Aquinas predicted), and given the inherent difficulty of objective judgment about "manifest tyranny" and "usurpation," can the "implicit permissions" you find ever be responsibly activated without significant risk? Does acknowledging this risk bring us closer to the "cautious Aquinas" position after all?

  **Key Strategies Embedded:**

  *   **Going Beyond Thesis:** Questions force engagement with counter-evidence (On Kingship, Constance), internal tensions (endurance vs. action, community vs. individual), and practical application (defining usurper, avoiding subjectivism).
  *   **Stress Testing:** The Jean Petit question directly applies her thesis to a messy historical event where Aquinas's ideas were contested.
  *   **Distinction Scrutiny:** Multiple questions (2, 3, 4, 7) probe the robustness and vulnerability of the usurper/legitimate distinction central to her argument.
  *   **Sedition Slippery Slope:** Question 3 directly tackles the potential for her interpretation of Aquinas on sedition to justify widespread rebellion.
  *   **Salisbury Comparison:** Question 7 explicitly compares her Aquinas to Salisbury, probing the claimed "carefulness" and practical differences.
  *   **Follow-Ups:** Designed to anticipate common rebuttals and push deeper into textual interpretation, practical consequences, historical evidence, and potential contradictions.

  This set should create a dynamic interview that challenges the professor to defend the nuances and limits of her interpretation against textual counterpoints, historical realities, and conceptual difficulties. Good luck with the podcast!
