prompt: |-
  So two people in my rationalist-adjacent friend group (we all met through ACX meetups years back) have had this running argument for like a year about whether our mutual friend Dave's startup is still gonna exist in 2027 -- Mara's consistently said something like 20%, Theo's consistently said something like 80%, and neither has moved an inch no matter how many times it comes up. A couple weeks ago, at the pub after our meetup, it stopped being about Dave entirely and turned into a fight about Aumann's agreement theorem instead, which I honestly found way more interesting then the original argument. Roughly how it went, in order:

  1. Theo: "We've each said our actual number to the other like a dozen times now and neither of us has budged, and it's not like we started from wildly different priors, we're both just normal reasonable people. So by Aumann's theorem this basically already is common knowledge, and if we still disagree, one of us is either lying about their real number or being irrational."

  2. Mara: "Saying a number out loud a dozen times isn't 'common knowledge' in the sense Aumann means -- that needs each of us to know the other's exact number, know that they know we know it, and so on forever. Also, I worked there for a year, I have a bunch of private information you just don't have, and that's a big chunk of why my number's lower."

  3. Theo: "That doesn't actually get you out of it though. The whole point of the theorem is that I don't need to see your evidence, just knowing your posterior should already move mine, assuming we share a prior. So by your own logic I should just adopt your 20%, not throw out the theorem."

  4. Mara: "Except we don't share a prior, that's the part you keep skipping past. My number was already going to be lower than yours before I ever worked there -- I've just never trusted founder promises as much as you do. Aumann's theorem doesn't say anything about two people who started from genuinely different places."

  5. Theo: "A 'genuinely different starting point' that never once moves no matter what gets said is a little convenient though. Isn't that basically the thing Robin Hanson's always going on about -- that when two people who each think the other is basically rational keep disagreeing anyway, it usually means at least one of them isn't being fully honest about updating?"

  Nobody at the table could settle it, obviously. Can you go through this move by move and say who's got the better of it at each step (not just who wins overall), and point out anything about how Aumann's theorem actually works that you think both of them are getting wrong or skating past?
reasoning: |-
  Okay, I need to analyze this debate between Theo and Mara about Aumann's agreement theorem. They're arguing over why their probabilities about Dave's startup surviving until 2027 haven't converged despite multiple discussions. Let me break this down step by step.

  First, I recall Aumann's agreement theorem states that two rational agents with common priors cannot agree to disagree—meaning if they have the same prior beliefs and their posteriors are common knowledge, those posteriors must be equal. 

  Looking at Theo's first point: He claims that since they've stated their probabilities multiple times (20% vs 80%) without change, this should constitute common knowledge. But he's misunderstanding the theorem. Simply stating numbers aloud doesn't automatically create common knowledge in the technical sense Aumann requires. Common knowledge demands that each knows the other knows, and so on ad infinitum. In a pub conversation, this infinite regress is practically impossible to achieve. Theo is oversimplifying here.

  Then Mara counters correctly about the common knowledge requirement and mentions her private information from working at the startup. This is valid—Aumann's theorem allows for private information, and if Mara has unique insights Theo lacks, that explains their probability difference. Theo's response that he should just adopt her 20% ignores that the theorem assumes common priors, which Mara immediately challenges.

  Ah, the prior issue! Mara points out they never shared the same prior beliefs about founder promises. This is crucial—Aumann's theorem breaks down without common priors. Theo tries to dismiss this as "convenient," but differing priors are a legitimate reason for persistent disagreement among rational people. 

  Theo then brings up Robin Hanson's point about dishonesty in updating. While Hanson's critique has merit in some contexts, it doesn't automatically apply here. Persistent disagreement could stem from genuine prior differences or differing interpretations of evidence, not necessarily bad faith. Mara's experience at the startup seems a reasonable basis for her lower confidence.

  Both are missing nuances: Theo underestimates how hard achieving common knowledge is, while Mara could better articulate why their priors differ structurally (e.g., her skepticism of founders vs Theo's optimism). Neither seems irrational—just anchored to different worldviews. The real failure is their inability to model why the other maintains their position, which the theorem assumes rational agents would do upon learning each other's beliefs.

  In essence: 1) Theo wrongly assumes stated probabilities create common knowledge; 2) Mara correctly notes private info and prior differences exempt them from the theorem; 3) Theo's "adopt my view" demand misapplies the theorem; 4) Mara's prior argument is strong; 5) Theo's dishonesty accusation overreaches. Overall, Mara's reasoning aligns better with the theorem's actual conditions.
answer: |-
  Here's a move-by-move breakdown of the argument, evaluating who has the better point at each step based on Aumann's agreement theorem and its real-world implications. Both parties make valid points but also misunderstand or oversimplify key aspects of the theorem.

  ### **Step 1: Theo’s Opening Claim**  
  *Theo*: "We've stated our numbers repeatedly without budging. By Aumann, this should be common knowledge, so one of us is lying or irrational."  
  **Who has the better of it? Mara (mostly)**.  
  - **Why**:  
    - Theo incorrectly assumes that verbally stating probabilities a dozen times constitutes "common knowledge" in the Aumann sense. Aumann requires **infinite mutual knowledge** (I know your probability, you know I know, I know you know I know, etc.). Pub conversations rarely achieve this.  
    - He also ignores the theorem’s **core precondition: shared priors**. Without this, disagreement is allowed even under perfect common knowledge.  
    - **Theo’s error**: He treats Aumann as a blunt instrument to declare the other party irrational, skipping critical nuances.  

  ### **Step 2: Mara’s Rebuttal**  
  *Mara*: "Verbal statements ≠ Aumann-style common knowledge. Plus, I have private information from working there."  
  **Who has the better of it? Mara (strongly)**.  
  - **Why**:  
    - She correctly notes that **common knowledge requires an infinite regress of mutual knowledge**, which isn’t fulfilled here. (Aumann’s formalism involves partitions of a probability space, not casual declarations.)  
    - Her point about **private information** is valid and critical. Aumann’s theorem *explicitly allows* for disagreement if agents have different information. If Mara possesses unique knowledge (e.g., internal financials, founder competence), her 20% can rationally differ from Theo’s 80% indefinitely.  
    - **What she skates past**: She doesn’t clarify *why* their inability to achieve common knowledge matters practically. But her core logic is sound.  

  ### **Step 3: Theo’s Counter**  
  *Theo*: "Aumann means I should adopt your 20% just by knowing your posterior, if we share a prior."  
  **Who has the better of it? Theo (technically) but misleadingly**.  
  - **Why**:  
    - Theo is **correct about the mechanics of Aumann**: If common knowledge *were* achieved *and* priors were shared, rational agents *must* converge to the same posterior. Knowing the other’s posterior *should* force you to update.  
    - **His error**: He assumes shared priors (which Mara denies) and handwaves away the common knowledge barrier. He’s technically right about the theorem’s mechanism but wrong to apply it here.  
    - **Skating past**: He ignores that Mara’s "private information" means their *information sets* differ, voiding the theorem’s applicability.  

  ### **Step 4: Mara’s Defense**  
  *Mara*: "We don’t share a prior. I’ve always distrusted founders more than you."  
  **Who has the better of it? Mara (decisively)**.  
  - **Why**:  
    - **This ends the debate on Aumann’s terms**. The theorem **requires common priors**, and Mara explicitly rejects this. If their initial beliefs (e.g., about founder trustworthiness) are structurally different, Aumann doesn’t compel agreement.  
    - Empirical evidence supports her: Rational people *do* hold persistent disagreements due to differing priors (e.g., politics, ethics).  
    - **What she skates past**: She doesn’t address *why* their posteriors haven’t converged *at all*. Even with different priors, sharing some evidence should cause *some* movement (e.g., Theo’s 80% → 70%). But Aumann doesn’t require full convergence here.  

  ### **Step 5: Theo’s Desperation Move**  
  *Theo*: "Persistent disagreement suggests dishonesty, per Robin Hanson."  
  **Who has the better of it? Neither (both miss the point)**.  
  - **Why**:  
    - Theo invokes Hanson’s **"unfakable evidence" critique**: If two rationalists persistently disagree, one might be refusing to update honestly. This *can* happen but isn’t proven here.  
    - **Theo’s error**: He conflates Hanson’s *speculative critique* with Aumann’s *formal proof*. Hanson’s point is about incentives, not rationality.  
    - **Mara’s missed opportunity**: She could note that **differing priors + private information** explain the deadlock without invoking dishonesty. Her work experience is plausibly "unfakable evidence" Theo lacks.  
    - **Both skate past**: Real-world disagreements often stem from **differing interpretations of evidence**, not bad faith. Mara’s low trust in founders might make her weigh evidence differently (e.g., dismissing optimistic forecasts).  

  ---

  ### **Key Misunderstandings of Aumann’s Theorem**  
  Both oversimplify the theorem:  
  1. **Common knowledge ≠ repeated statements**: It’s a game-theoretic concept requiring infinite mutual certainty, rarely achieved outside controlled settings.  
  2. **Shared priors are non-negotiable**: The theorem collapses without this. Differing priors are common (e.g., optimists vs. skeptics).  
  3. **Private information breaks the symmetry**: If Mara has insider knowledge, Aumann doesn’t apply.  
  4. **Posteriors can disagree indefinitely**: Even with common priors, if common knowledge isn’t achieved (e.g., due to unclear communication), disagreement persists.  

  ---

  ### **Verdict**  
  - **Mara wins the overall argument**: Her invocation of **private information** and **differing priors** legitimately exempts them from Aumann’s convergence requirement.  
  - **Theo’s best moment** is Step 3 (mechanically correct about updating under shared priors), but he fails to prove that shared priors exist.  
  - **The real issue**: Their debate is less about Aumann and more about **Bayesian updating under incomplete information**. If they truly wanted convergence, they’d:  
    - Explicitly share priors (e.g., "What’s your probability if we ignore my time at the startup?").  
    - Have Mara disclose *some* non-confidential evidence (e.g., "Founders missed milestones 50% of the time").  

  Aumann’s theorem is often weaponized in rationalist circles to "win" arguments, but as this case shows, its preconditions are rarely met in practice. Persistent disagreement is usually evidence of **asymmetric information or foundational worldview gaps**—not irrationality.
