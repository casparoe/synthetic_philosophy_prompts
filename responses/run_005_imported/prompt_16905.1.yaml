  What's interesting is how the user describes the behavior evolving - from a one-time catch-up tactic to a nightly habit done even when unnecessary. That pattern shift suggests something more compulsive emerging. The phrase "freaking me out" indicates genuine discomfort, not just guilt. 

  Professionally, I should flag several red flags: First, the insurance context makes this different from ordinary step-count gaming - there are contractual implications. Second, the dopamine hit from fake achievement could undermine their real fitness motivation long-term. Third, the self-awareness in their phrasing ("shortcut straight to the feeling") shows they already recognize this is hollow. 

  The response should validate their instincts while avoiding moralizing. Key angles to cover: the health self-sabotage aspect (they're literally paying themselves to not exercise), how insurance fraud definitions might apply, and the behavioral psychology of eroded intrinsic motivation. Should emphasize that their discomfort is actually a healthy sign. 

  Might also subtly reframe their "harmless hack" language - when corporations do this with wellness programs, it's called "gaming the system," but when individuals reciprocate, it becomes fraud. The power imbalance matters here. 

  Most importantly, they need practical alternatives to break the habit cycle. Suggesting replacing fake steps with micro-workouts addresses both the compulsion and the root cause (sitting too long). The "cheat day" concept could help transition away from the behavior without cold turkey. 

