  I should break down the differences in manipulation between systems. In plurality, bullet voting (only choosing one candidate) is common and effective. In RCV, strategic ranking requires more coordination and information, which is harder for voters. Also, RCV reduces the spoiler effect, which is a major issue in plurality systems. 

