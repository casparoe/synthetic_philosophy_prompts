prompt: |-
  Please describe the most important implications of evidential cooperation in large worlds (ECL) for how I should split my charitable donations between the cause I personally think matters most (animal welfare) and other causes tons of people care about but I'm less moved by (like global health). I keep seeing people claim the ECL logic means you should hedge across other altruists' values instead of just maxing out your own, but i don't have a good feel for how far that argument should really push my actual donations.
reasoning: |-
  Okay, the user is asking about how Evidential Cooperation in Large Worlds (ECL) should affect their charitable donations, specifically between animal welfare and causes like global health. They mention that people say ECL suggests hedging across other altruists' values, but they're unsure how much that should influence their actual donations.

  First, I need to recall what ECL entails. ECL is about cooperative decision-making in large groups where individuals can't directly coordinate. The idea is that by considering how others might act, one should sometimes choose actions that would be best if everyone with similar values cooperated. This leads to value hedging—donating to causes others care about to influence their decisions in a way that benefits your own cause.

  The user's personal priority is animal welfare, but they're less moved by global health. They want to know how much they should divert funds to other causes. The core tension here is between their personal values and the cooperative strategy ECL promotes.

  I should break down the implications step by step. Start with the basic argument: if all altruists donate only to their top cause, causes with fewer supporters get less funding. By donating to other causes, you encourage supporters of those causes to reciprocate, potentially benefiting animal welfare more in the long run.

  But the user needs practical advice. How much should they hedge? I need to consider factors like the relative funding levels of different causes. Animal welfare is likely underfunded compared to global health. If animal welfare is neglected, ECL might suggest donating more to it. However, if others aren't cooperating, hedging could help.

  Another point: cause neutrality. ECL intersects with this. If the user believes all causes are equally important, they might donate to the most cost-effective one. But they don't—they value animal welfare more. So ECL adds a layer: even with differing values, cooperation can be mutually beneficial.

  The user's identity seems to be an effective altruist, given the reference to ECL and cause areas. They might be part of communities discussing these ideas. Their explicit need is donation allocation, but deeper needs include wanting to maximize impact while staying true to their values and understanding the real-world applicability of theoretical arguments like ECL.

  They might fear that diverting funds from animal welfare could harm a cause they care deeply about, especially if others don't reciprocate. There's uncertainty about the effectiveness of hedging—how likely is it that global health donors will support animal welfare in return?

  I should address practical recommendations. Emphasize that ECL doesn't require equal splits. A small portion, say 10-30%, might be sufficient for hedging. Also, suggest focusing on neglected causes. If global health is well-funded, maybe not hedge there but towards other causes with reciprocal potential.

  Also, mention that cooperation depends on shared norms. If there's a community where such reciprocity is established, hedging is more effective. Otherwise, it's riskier. The user might need to assess the altruistic ecosystem they're part of.

  Finally, balance is key. They shouldn't abandon their main cause but allocate a fraction to others. Highlight that ECL is about mutual benefit, not self-sacrifice. The goal is to create a system where all causes gain through cooperation.
answer: |-
  The ECL framework provides a nuanced answer to your donation dilemma, pushing you toward *partial hedging* rather than complete specialization or equal splitting. Here's a breakdown of the key implications and practical guidance:

  1.  **The Core ECL Argument for Hedging:**
      *   **The Problem of Unilateralism:** If every altruist donates *only* to their top personal cause (e.g., you to animal welfare, others to global health, climate, etc.), causes with fewer dedicated supporters (like animal welfare) get less total funding than causes with many supporters (like global health), even if the "minority" cause is equally or more important/malleable.
      *   **The Cooperation Insight:** ECL recognizes that your donation choice *signals* to, and *evidentially influences*, other altruists making similar decisions in similar situations ("large worlds"). By donating *some* to causes others value highly (like global health), you increase the chance that supporters of *those* causes will donate *some* to causes *you* value highly (like animal welfare), *because they are reasoning the same way*. It's about mutual coordination without direct communication.
      *   **Mutual Benefit:** The goal isn't self-sacrifice. Done ideally, this mutual partial hedging leads to *more total funding for every cause* than if everyone specialized completely. Animal welfare gets funding from you *and* from global health/other supporters hedging towards it, which likely outweighs the amount you diverted from it.

  2.  **Key Implications for Your Donation Split:**

      *   **Don't Maximize *Solely* on Personal Valuation:** ECL argues that pure specialization (100% to animal welfare) is likely suboptimal in a large world of diverse altruists. Ignoring the values and expected actions of others misses a key coordination opportunity.
      *   **Hedge, But Don't Abandon Your Cause:** ECL **does not** imply you should donate equally to all causes or prioritize causes you find less important. Your personal values still matter significantly. The argument pushes you to donate *less* than 100% to your top cause, but likely *more* than 0%.
      *   **The Hedge Should Be Partial:** The optimal hedge isn't 50/50. It depends on factors like:
          *   **Relative Neglectedness:** How underfunded is animal welfare *relative* to global health? If animal welfare is vastly more neglected, ECL may push you to donate *more* to it, as your contribution has higher marginal impact, and you hope others recognize *its* neglectedness when they hedge. Conversely, if global health is actually more neglected *on the margin* (unlikely given current funding, but possible for specific interventions), ECL might push you *towards* it more.
          *   **Strength of Reciprocal Norms:** How likely is it that global health supporters are *also* reasoning along ECL lines and hedging *back* towards causes like animal welfare? The stronger this perceived norm/expectation, the more hedging makes sense. If you believe no one else hedges, the case weakens (though you might still want to pioneer the norm).
          *   **Number & Size of Other Cause Groups:** How many other distinct "value groups" are there (global health, climate, AI safety, etc.)? How large/powerful are they? Hedging across *all* major groups might be complex; focusing on the largest/most influential (like global health) might be more practical.
          *   **Your Confidence in Cause Prioritization:** If you have extremely strong, well-researched reasons to believe animal welfare is orders of magnitude more important/neglected/tractable than global health, that reduces the pull of hedging. ECL works best when there's significant uncertainty or reasonable disagreement about cause prioritization.

  3.  **Practical Guidance for Your Split:**

      *   **A Significant Minority Allocation:** For someone strongly convinced by animal welfare but persuaded by ECL arguments, a reasonable starting point might be allocating **70-90% to Animal Welfare** and **10-30% to Hedging**.
      *   **Target the Hedging Portion Wisely:**
          *   **Global Health is a Prime Target:** It's a massive, well-organized, evidence-focused part of the altruistic ecosystem. If ECL coordination is happening anywhere, it's likely here. Donating some to top global health charities (e.g., via GiveWell's recommendations) is a strong candidate for your hedge.
          *   **Consider Other High-Impact/Neglected Causes:** Depending on your views, hedging towards other major, evidence-driven causes like existential risk reduction (AI safety, bio) or climate might also make sense, especially if you see strong reciprocal potential.
          *   **Avoid "Shotgun" Hedging:** Don't feel you need to sprinkle tiny amounts everywhere. Focus your hedge on 1-2 major cause areas where the reciprocal dynamic seems most plausible and impactful.
      *   **Focus on Cost-Effectiveness *Within* the Hedge:** When choosing *where* to put your hedging dollars (e.g., within global health), still prioritize highly cost-effective, evidence-backed interventions. The point isn't just to give to a cause, but to have impact *within* that cause to incentivize reciprocity.
      *   **Re-evaluate Periodically:** As funding landscapes shift, neglectedness changes, and norms around value diversification evolve (e.g., more EA funds explicitly hedging), revisit your split. If animal welfare becomes significantly *less* neglected relative to others, ECL might push you to hedge *more*. If it becomes *more* neglected, it might push you back towards specialization.

  **In Summary:**

  ECL argues that complete specialization (100% animal welfare) likely leaves value on the table by failing to coordinate with the broader altruistic community. You *should* hedge by donating some portion (e.g., 10-30%) to causes like global health that large numbers of other altruists prioritize. This isn't abandoning your values; it's strategically acting in a way that, if mirrored, leads to *more* resources for animal welfare overall than under universal specialization. However, ECL **does not** require abandoning your primary cause. Animal welfare should likely still receive the **majority** (70-90%) of your donations, especially given its current neglectedness. The hedge is an investment in cooperative leverage, not a surrender of conviction.

  **Think of it as:** You're signaling cooperation and building a norm: "I support your cause somewhat, hoping you'll support mine somewhat." This creates a world where minority causes get a more sustainable baseline of support from the broader community. How far to push it depends on your assessment of neglectedness, reciprocal potential, and the strength of the ECL norm among others. Starting with a 80/20 or 85/15 split (Animal Welfare / Global Health) is a common and reasonable approach for someone in your position.
