answer: |-
  Here are 10 interview questions designed to push beyond simple thesis restatement, probing the nuances of your guest's argument, with anticipated responses and sharp follow-ups:

  1.  **Core Distinction:** "You argue Aquinas’ distinction between a *legitimate ruler turned tyrant* and a *usurper* is more porous than often acknowledged, and that 'usurper' can be stretched significantly. What specific textual evidence in Aquinas *most strongly* compels this expansive reading, and how do you respond to the charge that stretching 'usurper' risks collapsing it into subjective 'tyranny-by-opinion'?"
      *   *Anticipated Answer:* Points to passages in Commentary on Sentences or Summa where Aquinas defines just rule (common good) and argues a ruler persistently violating it fundamentally *lacks* legitimacy, becoming functionally a usurper.
      *   *Follow-up:* "But doesn't Aquinas explicitly say in *De Regno* that even a tyrant *in office legitimately* shouldn't be removed privately? If persistent tyranny functionally *makes* one a usurper in your reading, doesn't that directly contradict his stated prohibition on private action against the legitimately-positioned-but-tyrannical? How do you reconcile that apparent contradiction?"

  2.  **Sedition & Disorder:** "Aquinas defines sedition as a grave sin specifically as it opposes the *unity* and *peace* of the community. You suggest that a tyranny itself constitutes the 'real' disorder. If the tyrant's rule *is* the fundamental disorder justifying resistance, doesn't this logic potentially license *any* individual or group who *perceives* the ruler as causing disorder to act – essentially making Aquinas an unwitting advocate for chronic instability?"
      *   *Anticipated Answer:* Argues Aquinas isn't endorsing subjective perception; he provides objective criteria (violation of divine/natural law, pursuit of private over common good) defining *true* disorder/tyranny.
      *   *Follow-up:* "Who gets to *authoritatively* apply those objective criteria in the moment, especially absent a higher temporal authority? If it's the 'community,' how does that manifest practically without devolving into mob rule or factionalism – the very 'disorder' Aquinas feared?"

  3.  **The "Prudential Aside" Challenge:** "You characterize Aquinas's warnings in *De Regno* about private tyrannicide backfiring and producing worse outcomes as 'prudential asides' rather than core doctrine. Given that *De Regno* is explicitly addressed *to a ruler* about the duties *of* rule and the dangers *to* rule, isn't his focus on the practical, destabilizing consequences of assassination central to his *political* thought, not merely a throwaway caution?"
      *   *Anticipated Answer:* Argues *De Regno* is one specific genre (advice to a prince), while the theological works (Summa, Sentences) contain his deeper, more principled thought on justice and authority where resistance finds its grounding.
      *   *Follow-up:* "If the practical, destabilizing consequences are merely 'prudential' and secondary to principle, how do you square this with Aquinas's own emphasis on *prudence* as a cardinal virtue and his general teleological view that actions are judged by their ends/consequences? Doesn't dismissing these warnings risk divorcing his theory from the practical realities he clearly considered vital?"

  4.  **The Jean Petit Stress Test:** "The Council of Constance (1415) explicitly condemned Jean Petit's justification of tyrannicide, which *cited Aquinas*. The Council fathers read Aquinas as *not* supporting private assassination. How does your interpretation account for this near-contemporary (relative to Aquinas), authoritative theological rejection of using Aquinas to justify tyrannicide like Petit's?"
      *   *Anticipated Answer:* Argues the Council was politically motivated (to condemn regicide), engaged in selective reading, or focused on Aquinas's *explicit* prohibitions while missing his implicit logic for truly illegitimate/usurping tyrants. Petit's target (the Duke of Orleans) might not have met the strictest criteria.
      *   *Follow-up:* "Doesn't the Council's condemnation, precisely *because* they engaged with Aquinas's text and *rejected* Petit's application, demonstrate that the 'cautious' reading wasn't a later invention but the dominant understanding within decades of Aquinas's death? Doesn't this historical reception weigh against your 'implicit licensing' argument?"

  5.  **"Proper Authority" vs. Popular Action:** "Aquinas repeatedly emphasizes action by the 'community' or its 'proper authority.' You suggest this can include less formal, popular action. What specific mechanisms or processes does Aquinas describe, or logically imply, for a community *without* a functioning higher temporal authority (like an Estates-General or Prince-Elector) to *authoritatively* depose a tyrant, moving beyond mere mob violence?"
      *   *Anticipated Answer:* Might point to natural law principles empowering collective self-defense, or argue the "community" acts through emergent leaders or the residual authority of its original constituting power.
      *   *Follow-up:* "How does this differ meaningfully from 'private individuals taking it upon themselves,' which Aquinas explicitly condemns? Isn't the line between 'authoritative community action' and factional or private violence inherently blurry in the absence of formal structures, leading precisely to the chaos Aquinas warned about?"

  6.  **John of Salisbury Comparison:** "John of Salisbury, in the *Policraticus* (c. 1159), offers a far more explicit, almost enthusiastic, defense of tyrannicide as a public service. You position your reading of Aquinas as uncovering a more grounded, implicit permission. Given that Aquinas *must* have been aware of John's work, why would he cloak a similar conclusion in such cautious, implicit terms if that *was* his 'real, considered position'? Doesn't his deliberate caution compared to John suggest a fundamentally *more* restrictive view?"
      *   *Anticipated Answer:* Argues Aquinas operated in a different, more developed scholastic framework focused on precise distinctions and avoiding scandal; his caution is rhetorical/pedagogical, not substantive. He agrees with John's core principle but expresses it within the constraints of his systematic theology.
      *   *Follow-up:* "If the core principle is the same, doesn't Aquinas's *method* of expressing it – burying it in distinctions, emphasizing dangers, avoiding explicit endorsement – inevitably make it *less* of a license for action than John's trumpet call? Doesn't the form *shape* the practical implication?"

  7.  **Endurance vs. Action:** "Aquinas explicitly discusses endurance and prayer as the recourse when no other remedy exists. Your reading emphasizes the possibilities for action. How do you interpret Aquinas's threshold for when action becomes permissible or even obligatory? What conditions must be met that make endurance *no longer* the prescribed path?"
      *   *Anticipated Answer:* Points to the *gravity* and *persistence* of the tyranny, the *certainty* of its illegitimacy (usurpation or fundamental violation of divine law), and the *absence of any hope* of remedy through established channels.
      *   *Follow-up:* "How are these criteria (gravity, persistence, certainty) to be objectively measured *in situ* by those contemplating action? Doesn't this judgment remain perilously subjective, opening the door to precisely the kind of destabilizing, factional violence Aquinas sought to prevent?"

  8.  **The "Implicit Licensing" Charge:** "Critics might argue that finding 'implicit licensing' in Aquinas for popular tyrannicide relies on reading between the lines in a way he himself deliberately avoided. How do you guard against the charge that your interpretation is more a reflection of contemporary desires for a 'resistance-ready' Aquinas than what his texts, read holistically and in their historical context, actually support?"
      *   *Anticipated Answer:* Emphasizes close textual analysis, reading interconnected passages (Summa on justice, law, sedition alongside Sentences and De Regno), and showing how his principles *logically necessitate* the permissibility of resistance under extreme conditions, even if he shies from stating it baldly.
      *   *Follow-up:* "Given Aquinas's meticulousness elsewhere, if this *was* his 'real, considered position,' why wouldn't he state it more clearly, especially when tackling sedition directly? Isn't the *absence* of explicit endorsement, coupled with explicit cautions, itself a powerful argument *against* your 'implicit licensing' thesis?"

  9.  **The Role of Intent & Conscience:** "Beyond structures and authorities, how does Aquinas's understanding of conscience and the individual's duty before God factor into your interpretation? Does a subject's well-formed conscience recognizing a true tyrant/usurper create an *obligation* to resist, even privately, if no other avenue exists?"
      *   *Anticipated Answer:* Likely argues yes, connecting to Aquinas's views on obeying God over man when laws conflict, and the primacy of divine/natural law. A conscience bound by divine law *must* resist a ruler commanding evil.
      *   *Follow-up:* "Doesn't this elevate individual conscience to an *extraordinarily* powerful, potentially anarchic, political force? How does Aquinas reconcile this with his equally strong emphasis on order, obedience to *lawful* authority, and the dangers of private judgment? Doesn't this risk creating a society of potential vigilantes?"

  10. **Legacy & Relevance:** "Stepping back, if your interpretation is correct, what do you believe is the *most significant practical implication* for how we understand political obligation and resistance in unjust states today, drawing on Aquinas? Conversely, if the 'cautious' reading prevails, what vital resource for confronting tyranny might be lost?"
      *   *Anticipated Answer:* Will argue the "cautious" reading neuters Aquinas, making him irrelevant to real oppression, while her reading provides a deep, principled, yet measured theological foundation for legitimate resistance when institutions fail. The "cautious" reading risks passive complicity.
      *   *Follow-up:* "Does emphasizing Aquinas's potential 'resistance' side risk downplaying his profound emphasis on the *common good*, *prudence*, *order*, and the *dangers* of political violence – themes arguably even *more* urgently needed in polarized times? How do we balance the imperative to resist evil with the imperative to preserve the fragile goods of political community?"

  **Key Strategies Embedded:**

  *   **Pressure on Definitions:** Questions 1 & 2 directly challenge the core "usurper" expansion and the disorder argument.
  *   **Textual vs. Practical Tension:** Questions 3 & 5 highlight the gap between theoretical possibility and practical application that Aquinas worried about.
  *   **Historical Counterweight:** Question 4 (Constance) uses concrete history to test the thesis.
  *   **Comparative Framing:** Question 6 (John of Salisbury) forces her to defend the uniqueness and *degree* of her Aquinas reading.
  *   **Internal Consistency Checks:** Questions 7 & 9 probe how her reading handles Aquinas's emphasis on endurance, conscience, prudence, and order.
  *   **Methodology Scrutiny:** Question 8 challenges the "implicit licensing" approach head-on.
  *   **Stakes & Relevance:** Question 10 frames the debate's importance.

  These questions should push your guest to defend her thesis rigorously, engage with counter-evidence and interpretations, and clarify the practical and philosophical implications of her reading, leading to a much richer discussion than a simple book summary. Good luck with the interview!
