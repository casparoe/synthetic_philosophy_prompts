answer: |-
  That quant is absolutely correct, and it's one of the most profound (and initially counterintuitive) insights of the Kelly Criterion. Your confusion stems from a key distinction: **Kelly maximizes the *long-term geometric growth rate* of your bankroll, not the *expected profit* (arithmetic mean) of an individual bet.**

  Here's the breakdown:

  1.  **The Core of Kelly:** The Kelly fraction `f*` is derived to maximize the expected value of the *logarithm* of your wealth after each bet. Why log? Because maximizing the expected log wealth growth is equivalent to maximizing the *geometric mean growth rate* of your bankroll over the long run. This is the growth rate that compounds.

  2.  **The Double Kelly Disaster:** The statement "betting double the Kelly fraction drives your long-run growth rate to zero" is a specific mathematical result derived from the Kelly growth rate equation.

      *   Consider a simple binomial bet: You win `b` units for every 1 unit risked with probability `p`, or lose your stake with probability `q = 1-p`.
      *   Your edge is `E = p*b - q`.
      *   The Kelly fraction is `f* = E / b = (p*b - q) / b = p - q/b`.
      *   The *growth rate* `g(f)` per bet for a fraction `f` of your bankroll is:
          `g(f) = p * ln(1 + f*b) + q * ln(1 - f)`

      *   **The Critical Insight:** Set `f = 2 * f* = 2 * (p - q/b)`
      *   Plug this into the growth rate formula. After some algebra (involving the definitions of `f*` and the edge `E`), you get:
          `g(2f*) = p * ln(1 + 2f**b) + q * ln(1 - 2f*)`
      *   It can be proven that **`g(2f*) = 0`**. This means your expected log wealth doesn't change over time. Your bankroll experiences wild swings, but its *geometric mean* growth rate is zero. You don't grow, you just churn.

  3.  **Why Does This Happen Despite a Positive Edge?**
      *   **Volatility Drag:** This is the key concept missing when focusing solely on expected profit. While each bet *individually* has a positive expected return (`E > 0`), betting too large introduces massive volatility.
      *   **The Perils of Overbetting:** When you bet double Kelly, you are significantly increasing your risk of ruin (or near ruin) on losing streaks. Recovering from a large loss (e.g., losing 40% of your bankroll) requires a *much larger* percentage gain (e.g., needing a 66.7% gain to recover from a 40% loss). This asymmetry kills compounding.
      *   **Arithmetic Mean vs. Geometric Mean:** The "profit-maximizing" bet size you intuitively thought of (maximizing the *expected value* or *arithmetic mean* of the dollar profit on the *next* bet) would actually be to bet your *entire bankroll* on every positive EV bet! Why? Because the arithmetic mean doesn't account for the *sequence* of returns or the compounding effect of preserving capital. Maximizing the arithmetic mean leads to almost certain ruin because one loss wipes you out. Kelly explicitly avoids this by maximizing the geometric mean, which *does* account for the sequence and compounding.

  4.  **Visualizing the Problem:**
      *   Imagine two scenarios over many bets:
          *   **Scenario A (Kelly):** Win 10%, lose 5%, win 10%, lose 5%, etc. (Geometric Mean Growth ~ `(1.1*0.95)^0.5 - 1 ≈ 2.47%` per bet pair)
          *   **Scenario B (Double Kelly):** Win 20%, lose 10%, win 20%, lose 10%, etc. (Geometric Mean Growth = `(1.2*0.9)^0.5 - 1 = (1.08)^0.5 - 1 ≈ 3.92%`? Wait, no! `1.2 * 0.9 = 1.08`, but `sqrt(1.08) ≈ 1.0392` -> **3.92%**? That seems higher! This is the trap.)
      *   **The Trap:** The arithmetic mean return for Double Kelly (`(20% - 10%)/2 = 5%`) *is* higher than Kelly (`(10% - 5%)/2 = 2.5%`). This feeds the intuition that bigger bets = bigger profits.
      *   **The Reality:** The sequence matters crucially for the *compounded* result. The Geometric Mean for Double Kelly is `sqrt(1.20 * 0.90) = sqrt(1.08) ≈ 1.03923`, meaning **~3.923% growth per bet pair**. For Kelly, `sqrt(1.10 * 0.95) = sqrt(1.045) ≈ 1.02225`, meaning **~2.225% growth per bet pair**. So Double Kelly *is* growing faster here? What gives?
      *   **The Crucial Flaw in the Example:** The example above uses fixed dollar returns (win 10%/lose 5% of *initial* bankroll), not *fractional Kelly* betting (betting a fixed *percentage* of your *current* bankroll). Kelly sizing dynamically adjusts the bet size based on your *current* bankroll. Let's reframe it correctly:

          *   **Start:** $100 Bankroll
          *   **Kelly Bet (f* = 5% of current bankroll):**
              *   Bet 1 (Win): $100 * 5% = $5 bet. Win: +$5 (10x? Wait...). *Need consistent odds.*
          *   **Better Example (Simplified Odds):** Assume a bet where you double your money on a win (`b=1`, payout 2:1 including stake), `p = 60%`, `q=40%`.
              *   Edge `E = (0.6 * 1) - 0.4 = 0.2`
              *   Kelly Fraction `f* = 0.2 / 1 = 0.2` (20%)
              *   Double Kelly Fraction `f = 0.4` (40%)
          *   **Sequence: Win then Lose (Kelly):**
              *   Start: $100
              *   Bet 1 (Win): Bet $20 (20%). Win: Bankroll = $100 + ($20 * 1) = $120.
              *   Bet 2 (Lose): Bet 20% of $120 = $24. Lose: Bankroll = $120 - $24 = $96.
              *   **Result:** $96 (Net Loss of 4%)
          *   **Sequence: Win then Lose (Double Kelly):**
              *   Start: $100
              *   Bet 1 (Win): Bet $40 (40%). Win: Bankroll = $100 + ($40 * 1) = $140.
              *   Bet 2 (Lose): Bet 40% of $140 = $56. Lose: Bankroll = $140 - $56 = $84.
              *   **Result:** $84 (Net Loss of 16%)
          *   **Sequence: Lose then Win (Kelly):**
              *   Start: $100
              *   Bet 1 (Lose): Bet $20. Lose: Bankroll = $80.
              *   Bet 2 (Win): Bet 20% of $80 = $16. Win: Bankroll = $80 + $16 = $96.
              *   **Result:** $96 (Net Loss of 4%)
          *   **Sequence: Lose then Win (Double Kelly):**
              *   Start: $100
              *   Bet 1 (Lose): Bet $40. Lose: Bankroll = $60.
              *   Bet 2 (Win): Bet 40% of $60 = $24. Win: Bankroll = $60 + $24 = $84.
              *   **Result:** $84 (Net Loss of 16%)
          *   **Outcome:** Regardless of the order (Win-Lose or Lose-Win), Kelly results in $96 (-4%), Double Kelly results in $84 (-16%). The larger bet size amplifies losses more than it amplifies gains *in the context of compounding*. The volatility drag is severe. Over many such sequences, the math shows `g(2f*) = 0`.

  5.  **Why Traders Worship Kelly:**
      *   **Optimal Growth:** It's mathematically proven to grow wealth faster than any other strategy in the long run for repeated, independent bets with known edge.
      *   **Capital Preservation:** It inherently protects your bankroll from ruin (as long as `f* < 1` and edge is positive).
      *   **Manages Risk:** It balances the desire for growth with the danger of overbetting and volatility drag.

  **Conclusion:**

  The quant is right. Betting double the Kelly fraction *does* drive your long-term geometric growth rate to zero, even with a positive edge on every bet. This happens because:

  1.  Kelly optimizes for **long-term geometric growth** (compounding), not short-term expected dollar profit.
  2.  Overbetting (like double Kelly) introduces devastating **volatility drag**. Large losses cripple your ability to recover and compound, outweighing the higher arithmetic mean return.
  3.  Maximizing expected profit (*arithmetic mean*) is a recipe for ruin in repeated betting; it ignores the sequence of returns and the critical need to preserve capital for compounding. Kelly maximizes the *geometric mean*, which is what matters for sustainable growth.

  This result is a cornerstone of Kelly theory and highlights why professional gamblers and traders treat it with such reverence (and often use *fractional* Kelly, like 1/2 or 1/4, to be even safer against estimation errors in their edge). It's a powerful tool specifically because it avoids the trap your intuition fell into.
