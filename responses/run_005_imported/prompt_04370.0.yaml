  Then there's the "burden of knowledge" aspect. Knowing what others have done can create pressure to conform or intimidate the student, making them doubt their own ideas. The user might be underestimating how discouraging it can be to see sophisticated solutions early on. Their advisor's method forces them to develop confidence in their own problem-solving skills.

  The "exploration vs exploitation" trade-off is another angle. Without prior knowledge, the student might explore unconventional methods that could lead to novel insights. The user's frustration about potentially reinventing the wheel is valid, but the advisor's rule prioritizes innovation over efficiency in the initial stages. The key is that the user isn't permanently avoiding literature; it's a temporary phase to nurture originality.

