prompt: |-
  Ok, this has been bugging me for a while. I'm doing a math PhD, and my advisors rule is that I have to spend a couple weeks properly stuck on a new problem before I'm allowed to go read what's already been done on it, since seeing the standard approach too early just anchors you and kills any chance of finding a different angle. I sort of buy this from experience, but it also feels wrong on a deeper level: if I'm deciding how to attack a problem, how could having more relevant info beforehand ever leave me worse off than deciding with less of it, when I can always just ignore it if it turns out not to be useful? So is my advisors rule actually justified by something real, or is it just superstition that happens to work for some unrelated reason (like just forcing me to put in the effort first)?
