prompt: |-
  I co-host a small podcast on philosophy of mind, and next month's guest is a philosopher known for defending a Millikan-style teleosemantic theory of mental content: on her view, what a state represents is fixed by the function it was selected to perform. The topic has become unexpectedly pressing for me outside the podcast too, since I also sit in on an AI interpretability reading group where we keep getting stuck on whether a trained network can be said to "represent" or "misrepresent" anything at all, given that gradient descent is not natural selection. Draft eight interview questions that go beyond having her restate the view -- I want at least one question each on the disjunction problem, on the swampman worry that a synchronic physical duplicate with no selection history still seems to think, on why content is supposed to lock onto a distal property like "fly" rather than something more proximal in the causal chain, and on whether a training history could do the job a selection history is supposed to do for an artificial system -- and for each, a follow-up pitched to whatever reply she is likely to give.
