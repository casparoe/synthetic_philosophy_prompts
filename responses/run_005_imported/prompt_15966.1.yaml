answer: |-
  ## The Alchemy of Accuracy: Pluralism and the Alethic Core

  The accuracy-first program’s ambition is profound: ground the norms of rational belief – coherence (probabilism), updating (conditionalization), and more – purely in the epistemic imperative to *believe truths*. Joyce’s accuracy-dominance argument for probabilism is its cornerstone, demonstrating that incoherent credences are *alethically self-defeating*: they are *guaranteed* to be less accurate, in a *truth-directed* sense, than some coherent alternative, regardless of how the world turns out. The shift to strictly proper scoring rules (SPSRs) like Brier, logarithmic, and spherical scores salvaged the core argument from criticisms of Joyce’s original "legitimacy" axioms. Yet, as you rightly highlight, this move births a pluralism: while all SPSRs agree incoherent credences are dominated, they diverge dramatically on *other* normative questions – the permissibility of extreme credences, the "correct" response to evidence (beyond conditionalization's coherence-preservation), and the severity of error. Does this residual pluralism fatally undermine the claim that accuracy-first epistemology provides a *purely alethic, non-pragmatic* foundation for Bayesianism? **I argue it does not.** Probabilism’s invariant dominance under *any* SPSR secures its uniquely alethic status, while the pluralism beyond probabilism reflects legitimate, context-sensitive dimensions of the *alethic ideal* itself, not a lapse into pragmatism.

  **The Inviolable Alethic Core: Probabilism’s Dominance**

  The core achievement is undeniable and invariant: *any* incoherent credence function is accuracy-dominated by *some* coherent one under *any* strictly proper scoring rule. This is not a mere coincidence; it flows from the deep mathematical structure SPSRs impose. Strict propriety guarantees that for any credence `b` in a proposition, the *expected* accuracy of reporting `b` is maximized precisely when `b` equals the *true* probability (if known). When combined with the convexity of the set of coherent credence functions (the probability simplex), this property ensures that any point outside the simplex (an incoherent credence) has a unique "projection" point *onto* the simplex (its "coherent neighbor") that dominates it. Crucially, **this dominance holds for *every possible* SPSR simultaneously.** The *fact* of dominance is scoring-rule invariant.

  This invariance is the alethic bedrock. It demonstrates that probabilism isn’t justified by avoiding pragmatic losses (Dutch books) or by arbitrary convention. It’s justified because violating it *intrinsically* compromises the believer’s commitment to accuracy. An incoherent agent, *by their own alethic lights* (as defined by *any* SPSR they might adopt), could foresee that switching to a specific coherent alternative would make them more accurate *no matter what truths are revealed*. This "no matter what" clause is crucial – it’s a *logical guarantee* of worse accuracy tied directly to the *logical structure* of the credence function itself. **The alethic irrationality of incoherence is thus scoring-rule invariant.** This core result stands firmly independent of pragmatic considerations.

  **Pluralism Beyond the Core: Alethic Nuance, Not Pragmatic Creep**

  The divergences you note – logarithmic score’s infinite penalty for extreme falsehoods vs. Brier’s bounded penalties, disagreements over permissible extremity (Cromwell’s Rule), or the "optimality" of specific updating rules beyond conditionalization’s coherence – arise when we ask *finer-grained* questions: *How much* should we value avoiding specific *kinds* of error? *How cautious* should we be in the face of uncertainty? *Precisely how* should accuracy guide us *between* coherent credences?

  This is where pluralism enters, but it need not signal pragmatism. Instead, it reflects that the broad alethic ideal "believe truths" encompasses legitimate, contextually sensitive dimensions:

  1.  **Weighting Errors:** Different SPSRs encode different weightings of *types* of inaccuracy. The log score heavily penalizes being *confidently wrong* (assigning near 0 to a truth or near 1 to a falsehood), reflecting an epistemic value on *caution* or avoiding catastrophic epistemic failure. Brier score penalizes *distance* from truth more uniformly, reflecting a value on *overall calibration*. Spherical score offers another balance. These aren't arbitrary or pragmatic weightings; they represent **different, internally coherent conceptions of what prioritizing "accuracy" *means* in terms of error avoidance.** Is it worse to be slightly off about many things or catastrophically wrong about one? This is a debate *within* the alethic domain about the structure of epistemic value, not an appeal to practical stakes. An agent valuing extreme caution *alethically* might find the log score compelling; one valuing overall calibration might prefer Brier.
  2.  **Extremity and Cromwell's Rule:** The infinity of the log score *at extremes* underlies arguments for Cromwell's Rule (never assign 0 or 1 to contingencies). But this infinity isn't a pragmatic trick; it’s a direct consequence of the log score’s specific *alethic* weighting – it treats the error of assigning 0 to a truth (or 1 to a falsehood) as infinitely bad *from an accuracy perspective*. Brier score, by assigning finite penalties, permits extreme credences without infinite risk, reflecting a different *alethic* tolerance for confident commitment when evidence is overwhelming. The debate is about **how the alethic imperative constrains confidence in the face of fallibility**, not about avoiding bankruptcy.
  3.  **Updating and Uniqueness:** While conditionalization preserves coherence and is a consequence of maximizing *expected* accuracy *at the moment of updating* under many SPSRs (if the agent uses their *prior* to calculate expectations), its *uniqueness* as the *only* rational update rule often requires additional assumptions *specific* to a chosen SPSR (e.g., that the score is *local*). The pluralism here shows that the pure accuracy-dominance argument for probabilism doesn't *automatically* generate a single, universally mandated updating rule *for all contexts of alethic value*. Different weightings of accuracy (embodied in different SPSRs) might, in principle, motivate slightly different responses to evidence *while still remaining coherent*. However, conditionalization remains deeply linked to coherence preservation and expected accuracy maximization under standard interpretations. The lack of absolute uniqueness across *all possible* alethic weightings doesn't make updating pragmatic; it shows the core alethic argument defines a *framework* (coherence + expected accuracy) within which specific updating norms can be derived relative to chosen alethic weightings.

  **The Counterattack and Defense**

  The obvious counterattack is potent: "If the choice of scoring rule determines whether Cromwell's Rule holds or which updating rule is 'most accurate,' haven't we just smuggled pragmatic (or at least, non-alethic) values back in? How can we call this a *purely* alethic foundation if crucial norms depend on this essentially arbitrary choice?"

  My defense rests on three points:

  1.  **The Core is Secure and Alethic:** The fundamental irrationality of *incoherence* – the violation of the probability axioms – *is* established purely alethically and invariantly. *That* is the foundational result accuracy-first epistemology uniquely provides without pragmatism. Pluralism arises when asking *further* normative questions *within* the coherent realm.
  2.  **Pluralism Reflects Alethic Depth, Not Pragmatism:** The differences between SPSRs aren't arbitrary like choosing a currency for a Dutch book. They represent **competing, internally consistent interpretations of the *alethic goal itself***. Debating whether avoiding confident error is *alethically* paramount compared to overall calibration is a debate *about truth-seeking*, not about avoiding financial ruin or achieving practical goals. It's analogous to debating whether a scientist should prioritize avoiding false positives or false negatives – both are truth-directed concerns.
  3.  **Context Matters Alethically:** The "right" weighting of accuracy might depend on the *epistemic context*. In high-stakes scenarios where a single confident error could derail an entire inquiry (e.g., foundational physics), the log score's caution might be alethically paramount. In contexts demanding fine-grained discrimination between many similar hypotheses (e.g., some machine learning tasks), Brier's focus on calibration might be more alethically valuable. This context-sensitivity is inherent to applying the alethic ideal, not an appeal to non-epistemic values.

  **Verdict: A Respectable Alethic Landing**

  Therefore, the residual pluralism among strictly proper scoring rules **does not** negate the purely alethic foundation accuracy-first epistemology provides for the *core norm of probabilism*. The demonstration that incoherence is accuracy-dominated under *any* coherent conception of accuracy (any SPSR) is a profound, non-pragmatic achievement. It shows probabilism is a necessary condition for rationality defined solely by the pursuit of truth.

  The pluralism beyond probabilism reveals that the alethic ideal "believe truths" is richer and more nuanced than a single number can capture. Different SPSRs unpack this ideal in different, legitimate ways, emphasizing different facets of epistemic virtue (caution vs. discrimination, sensitivity to extremity vs. overall fit). This doesn't introduce pragmatism; it acknowledges the **multidimensional nature of alethic value**. While it means accuracy-first arguments for *specific* norms *beyond probabilism* (like Cromwell's Rule or the *unconditional* uniqueness of conditionalization) may depend on justifying a particular weighting of accuracy (a particular SPSR) within the broader alethic framework, it does so *while staying firmly within the alethic domain*.

  "Probabilism is invariant and that's the part that actually matters, the rest can stay pluralistic" **is** a perfectly respectable place to land for an alethic project. It secures the logical core of rational belief. The subsequent pluralism reflects the reasonable space for debate about how best to weight different aspects of the truth-seeking endeavor *itself*, not a failure of the alethic foundation. Accuracy-first epistemology successfully isolates the alethic irrationality of incoherence; the pluralism beyond shows the alethic landscape is richer, not that the foundation is pragmatic.
