  Here’s a concise, student-directed response addressing their inference. It’s structured as a handout (≈1 page), directly engaging their argument while clarifying the dialectical purpose of finks and masks in the literature:

  ---

  ### Finks, Masks, and the Reality of Dispositions: A Clarification  
  *Re: Your Insightful Point About Whether Dispositions Are "Real"*

  **Your Argument Summarized:**  
  You observed that finks (e.g., Martin’s wire rigged to a cutoff switch) and masks (e.g., Johnston’s glass wrapped in styrofoam) show that:  
  1. Something can have a disposition (e.g., fragility) *without* the associated counterfactual being true ("would break if struck").  
  2. The counterfactual can be true *without* the disposition being present (e.g., a non-fragile object protected by a *finkish* safety device).  
  From this, you inferred that "disposition" talk doesn’t track a real property—it’s just a practical shorthand for behavioral patterns, with "nothing underneath."  

  **Why This Is a Profound Challenge (But Not a Fictionalist Conclusion):**  
  Your inference is philosophically serious, and it correctly exposes the failure of the *Simple Conditional Analysis* (SCA). However, the consensus in the literature (e.g., Lewis, Martin, Johnston) is that finks and masks **refine our theory of dispositions—not eliminate them**. Here’s why:  

  1. **Martin’s & Johnston’s Point Wasn’t Anti-Realism**  
     - Martin’s finkish wire (*Philosophical Quarterly*, 1994) and Johnston’s masked fragility (*Philosophical Perspectives*, 1992) were designed to *refute SCA*, not dispositions themselves.  
     - Their examples reveal that dispositions are **intrinsic properties** that can be *interfered with* by extrinsic circumstances (finks, masks). This assumes dispositions *are* real causal powers—ones that can be "blocked" or "altered." If dispositions weren’t real, there’d be nothing *to* fink or mask!  

  2. **Lewis’s Reformed Analysis: Saving Realism**  
     - Lewis’s response ("Finkish Dispositions," 1997) accepts your critique of SCA but *reformulates* the counterfactual to preserve realism:  
       - A thing is fragile iff it has some intrinsic property *P* such that, *if struck and P persists*, it breaks.  
     - The key move: finks/masks work by *removing* *P* (fink) or *blocking its manifestation* (mask). The disposition itself (*P*) remains real and intrinsic—its manifestation just depends on background conditions.  

  3. **The Misstep: Confusing Context-Sensitivity with Unreality**  
     - Your inference assumes: if a property’s effects depend on external conditions, it must not be "real." But *all* causal properties (e.g., solubility, charge) are like this!  
       - Example: Salt is soluble, but won’t dissolve if placed in oil (a mask). This doesn’t mean solubility isn’t real—it means its *manifestation* requires the right context (water).  
     - Finks/masks show dispositions are *conditional*, not fictional. They track a thing’s *causal capacities* (what it *can* do), not what it *will* do in all scenarios.  

  4. **Why Philosophers Don’t Take Finks/Masks as Evidence for Fictionalism**  
     - Dispositions are invoked to explain:  
       - **Causal laws**: What gives laws their force? (e.g., charge *disposes* particles to attract/repel).  
       - **Natural kinds**: What makes glass "glass"? Partly its dispositional profile (fragility, transparency).  
       - **Modality**: Dispositions ground *possibilities* (e.g., "This *can* break").  
     - If dispositions were mere summaries, these explanations would collapse into circularity (summarizing behaviors we haven’t seen yet). Realism provides a deeper anchor.  

  **Conclusion: Finks/Masks Deepen Realism, They Don’t Undermine It**  
  Your argument expertly shows why SCA fails. But the lesson isn’t that dispositions are fictional—it’s that they are *intrinsic, causally potent properties* whose expression is context-dependent. Far from supporting fictionalism, finks/masks *presuppose realism*: they only work if there’s a real property to interfere with. Lewis’s reformed analysis (and others) aim to capture this by tying dispositions to persistent intrinsic bases. If you remain skeptical, ask: *What explains why the glass breaks when struck after unwrapping, but the steel doesn’t?* The realist says: "Because glass has fragility, and steel doesn’t." The fictionalist owes us an alternative—one that doesn’t just redescribe the pattern.  

  ---  

  **Key References for Context:**  
  - Martin, C.B. (1994): Finkish dispositions (wire + cutoff switch).  
  - Johnston, M. (1992): Masking cases (styrofoam-wrapped glass).  
  - Lewis, D. (1997): Reformed conditional analysis addressing finks/masks.  

  This response validates the student’s critique of SCA while showing why the literature treats finks/masks as *starting points* for better realism. It also subtly hints that fictionalism struggles with explanatory depth (e.g., why behaviors are *projectible*). If she presses further, the next move is to discuss dispositional essentialism (e.g., Bird) or pandispositionalism—but this handout meets her where she is.
