prompt: |-
  ok so this is a kind of random request but bear with me. In my behavioral econ elective we spent a whole class period on this thing called the centipede game and it's been living in my head alot since. It's basically two players taking turns where the pot keeps growing every round, and at any point either player can just end it and grab the slightly bigger short-term share instead of passing, but if you both keep passing the whole pot gets way bigger for everybody by the end. My teacher walked us through "backward induction," which is where you reason backwards from the very last possible round: at the end the rational move is obviously to grab the money, so one round before that the other player should grab it too since they already know how the round after them ends anyway, and so on all the way back until the "rational" answer is that player 1 should just grab the tiny first-round amount immediately, before any trust even has a chance to build up. Except then she said the part that actually broke my brain a little: if you're player 2 and you somehow end up at round 6, meaning player 1 did NOT grab the cash on round 1 like backward induction says they were supposed to, what are you even supposed to conclude? That they're irrational, so now you should grab it? But the whole reason grabbing it counted as "rational" in the first place was built on both of you being rational and knowing it about each other all the way down, and that exact assumption already broke the second you got to round 6 at all. So the theory kind of eats its own tail right at the moment it would actually have to be used for real.

  Anyway I tried explaining this to my friends at lunch and just made everyone more confused, including me a little, so now I want to see it as an actual story instead of a word problem. Could you write me a short story where two characters -- I'm picturing maybe two rival con artists or old spies who've burned each other before, but pick whatever setup you think actually works best -- get stuck in a situation that's structured like the centipede game, where the stakes (money, secrets, whatever fits) keep growing every time they choose to trust each other for one more round instead of cutting and running right then. I want the real tension and the ending to come out of that "the theory eats itself" paradox specifically, not just be a normal will-they-betray-each-other thriller, and honestly I'd rather it sit with how unsettling thats than wrap everything up too neatly at the end.
