  - The student states: "Lewis took this to show that indicative conditionals don't have truth conditions after all, siding here with Adams's view that 'if'-sentences merely express degrees of confidence rather than propositions. This forced Lewis to give up his own possible-worlds account of conditionals as a general theory, since that account assigns 'if A, C' a truth value at every world."
