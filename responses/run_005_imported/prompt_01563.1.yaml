answer: |-
  ## Lewis's Triviality Trap: Why Indicative Conditionals Can't Be Truth-Conditional Propositions

  Lewis's 1976 triviality result remains a foundational earthquake in the philosophy of language, challenging our very conception of the indicative conditional ("if A, then B"). The core insight – the Adams/Stalnaker Thesis (AST) – is powerfully intuitive: the probability we assign to "If it rains, the match will be cancelled" *just is* the probability we assign to the match being cancelled *given* that it rains, i.e., **P(A > B) = P(B | A)**. Lewis's devastating proof, however, demonstrates that embedding this seemingly innocent equation within a standard truth-conditional semantics and probability theory leads to catastrophic collapse. The upshot, I argue, is that Lewis was fundamentally correct: indicative conditionals do not express ordinary truth-evaluable propositions. Attempts to salvage truth conditions either fail to genuinely respect the probabilistic data or sacrifice core semantic intuitions. Non-cognitivism/suppositionalism is the most coherent escape route.

  **Lewis's Triviality Argument: The Strongest Thrust**

  Lewis's core argument targets the *combination* of the AST with two standard assumptions about propositions and probability:

  1.  **Truth-Conditionality:** "A > B" expresses a proposition with determinate truth conditions, whose probability is the probability it is true.
  2.  **Probability Calculus:** Probabilities conform to the standard Kolmogorov axioms.
  3.  **Conditionalization Closure:** The class of "reasonable" probability functions over the relevant algebra of propositions is closed under conditionalization on propositions with non-zero probability (i.e., if P is reasonable, so is P'(·) = P(· | E) for any E with P(E) > 0).

  Lewis proves that if AST holds **for every reasonable probability function P** in such a closed class (i.e., P(A > B) = P(B | A) for all P and all A, B where P(A) > 0), then the algebra collapses into near-triviality. Specifically, it forces **probabilistic independence**: P(B | A) = P(B) for all A, B where P(A) > 0 and P(A) < 1. This is patently absurd for natural language conditionals. The probability that the match is cancelled *given* rain is manifestly *not* generally equal to the prior probability of the match being cancelled, regardless of rain!

  The engine driving the collapse is the requirement that AST holds *across different perspectives*. Conditionalization represents learning. Requiring that AST holds *both* for my current credence function P *and* for the credence function I would have *if I learned that A is true* (P(· | A)), *and* for the credence function I would have *if I learned that A is false* (P(· | ~A)), generates incompatible constraints. These constraints collectively force the space of propositions to be so impoverished that learning *anything* (A or ~A) becomes irrelevant to the probability of B, hence the independence result. The requirement for AST to hold under P(· | A) is particularly crucial; it leverages how learning A *should* change the probability of the conditional itself, leading directly to contradiction unless independence holds.

  **Salvaging Truth Conditions? Two Valiant Attempts and Their Downfalls**

  Formal semanticists have proposed ingenious escapes. Let's assess the two most prominent:

  1.  **The Indexical Escape (van Fraassen, Stalnaker):** This strategy restricts AST to a *single*, *actual* probability function P₀. "A > B" expresses a proposition, but its truth conditions are *context-sensitive* or *indexical*, depending crucially on the agent's *actual* credence state. For the agent *right now*, P₀(A > B) = P₀(B | A) holds. However, this equation is *not* required to hold for other credence functions, especially not those resulting from conditionalizing on A or ~A.
      *   **The Appeal:** It respects the intuition that *my current* probability for "if A, B" matches my conditional probability. It blocks Lewis's proof by rejecting conditionalization closure for AST.
      *   **The Fatal Flaw:** It fails to explain the *dynamics of supposition*. When I *suppose* A and evaluate B under that supposition, I seem to be assessing the very *same* conditional "if A, B". The indexical view severs this connection. If I learn ~A, my new credence P₁(·) = P₀(· | ~A) might assign a *different* probability to the *proposition* "A > B" (based on my *old* context) than what P₁(B | A) is. Yet, if I then *suppose* A, I would still use P₁(B | A) to assess what follows. The indexical view makes the meaning of the conditional inert and disconnected from reasoning *under the supposition of its antecedent*. Lewis later generalized his proof to show that even without full closure, requiring AST for just P₀ *and* P₀(· | A) is often sufficient to force triviality, trapping even this view.

  2.  **The Trivalent Escape (de Finetti, Rothschild):** This approach rejects bivalence. "A > B" can be true, false, or indeterminate (often when A is false). Crucially, **P(A > B)** is defined as the probability that "A > B" is true *given that it has a truth value* (i.e., given A). This yields: P(A > B) = P(B | A). The probability of the conditional *simpliciter* is not directly P(B | A); P(B | A) only equals the probability the conditional is true *conditional on A being true*.
      *   **The Appeal:** It formally satisfies the probabilistic intuition (P(True | A) = P(B | A)) while avoiding Lewis's collapse by making the conditional undefined when A is false. It seems to handle the "void" intuition when antecedents are false.
      *   **The Fatal Flaw:** This move fundamentally changes the nature of the probability assignment. Lewis's AST concerns the *unconditional* probability of the conditional *proposition*. On the trivalent view, P(A > B) is the probability that A is true *and* B is true (since the conditional is only true when A & B). But this is simply P(A & B)! The powerful intuition captured by AST is that P(If A, B) often *feels* like P(B | A), *not* like P(A & B). P(B | A) can be high even if P(A & B) is low (if P(A) is low). The trivalent view severs the direct link between the *unconditional* credence in the conditional and the conditional probability, which is the core datum AST sought to capture. It saves a technical equation at the expense of the motivating intuition.

  **The Import-Export Distraction?**

  Some (e.g., Bacon, Khoo) argue that Import-Export (I-E) (P(A > (B > C)) = P((A & B) > C)) is the true culprit, not AST itself. Lewis's proofs rely on principles equivalent to I-E. Reject I-E, they argue, and AST can coexist with truth conditions.

  *   **Assessment:** While technically correct that blocking I-E blocks Lewis's *specific proofs*, this is a pyrrhic victory. I-E is highly intuitive for indicative conditionals. "If the lights are on, then if John is home, he's awake" seems equivalent to "If the lights are on and John is home, he's awake." Sacrificing I-E significantly distorts the logic of conditionals to save truth conditions. Furthermore, Lewis's result highlights a *deep tension* between AST and probability dynamics; rejecting I-E doesn't resolve this tension, it merely avoids one manifestation of it. Other arguments or dynamic principles might resurrect the problem. Prioritizing I-E over the core probabilistic intuition seems misplaced.

  **The Non-Cognitivist/Suppositionalist Verdict**

  Faced with the failure of truth-conditional escapes that genuinely preserve the probabilistic behavior of conditionals, Lewis's original conclusion stands: **indicative conditionals do not express ordinary truth-evaluable propositions.**

  The suppositionalist view (Adams, Edgington) provides the most compelling alternative:
  *   **Meaning as Use:** The meaning of "If A, B" lies in its role in conditional belief and assertion. To accept "If A, B" is to commit to accepting B *should one learn A*. Its "probability" *is* P(B | A), but this is not the probability of a proposition being true; it's the *measure of appropriate commitment*.
  *   **Assertibility:** We assert "If A, B" when P(B | A) is sufficiently high. This explains the assertibility data without requiring truth conditions.
  *   **Suppositional Dynamics:** It perfectly explains the role of conditionals in reasoning under supposition. Supposing A *just is* shifting to the credence function P(· | A); evaluating B under this supposition *just is* evaluating P(B | A), which is precisely the "probability" of the conditional.
  *   **Avoiding Collapse:** It embraces the core insight of AST (P(If A, B) = P(B | A)) without forcing it onto a proposition, thus entirely sidestepping Lewis's combinatorial constraints. There is no proposition for the probability calculus to trivialize.

  **Conclusion: Embracing the Suppositional Revolution**

  Lewis's triviality result is not merely a technical curiosity; it exposes a fundamental mismatch between the probabilistic dynamics governing our use of indicative conditionals and the requirements of a truth-conditional semantics operating within standard probability theory. The indexical and trivalent strategies, while formally clever, fail to adequately preserve the core connection between unconditional credence in the conditional and conditional probability, or they distort the logic beyond recognition. Sacrificing Import-Export is an ad hoc cost that doesn't address the underlying tension. **The only coherent resolution is to accept that indicative conditionals lack truth conditions.** The suppositionalist account, focusing on conditional commitment and assertibility guided by conditional probability, provides a robust and empirically adequate framework that respects the probabilistic data Lewis leveraged. Lewis didn't just pose a problem; he pointed decisively towards the solution: the indicative conditional is a device for expressing our cognitive dispositions under supposition, not for describing truth-bearing states of affairs. The triviality result is the sound of the trap snapping shut on truth-conditional theories; the suppositionalist view is the key that unlocks it.
