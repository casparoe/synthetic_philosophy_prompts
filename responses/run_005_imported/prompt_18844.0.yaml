answer: |-
  ## The Money Pump Debate

  *(Two decision theorists watch as the seminar volunteer, now holding Good X again but $3 poorer, looks bewildered.)*

  **First Theorist (FT):** There it is. Proof positive. She *had* cyclic preferences: X>Y, Y>Z, Z>X. Offered sequential trades with small fees (X to Y, Y to Z, Z to X), she accepted each step. Only when she saw the absurdity of trading Z back for X – the very thing she supposedly preferred X over! – did she balk. That final refusal *reveals* the cyclic "preference" wasn't stable or actionable. It dissolved under pressure. Rationality demands acyclicity. McClennen's "resoluteness" or Temkin's "essentially comparative" moves are just smuggling transitivity in at the policy level while pretending the underlying preferences remain cyclic. They don't survive contact with actual choice.

  **Second Theorist (ST):** Hold on. You're conflating exploitability with preference structure. The pump exploits a specific *choice disposition* – myopic, step-by-step evaluation. McClennen's resolute chooser recognizes the cycle *as a whole* from the start. She commits *in advance* to a plan: "I value X>Y>Z>X, but I won't take the *final* trade back to X after paying fees, because that nets a loss." Her cyclic preferences over the *goods themselves* haven't changed. She still prefers X to Y, Y to Z, Z to X in pairwise comparisons absent fees or the pump context. The pump demonstrates a vulnerability in *naive sequential choice*, not an irrationality in the underlying preference *ordering*.

  **FT:** But what *is* this "resolute commitment" if not a recognition that the cyclic ordering is untenable? You say she prefers Z to X pairwise. Yet, holding Z, offered X for a fee, she refuses. That looks like revealed Z < X *in that choice context*. How is her refusal *not* a reversal of her stated cyclic preference? If "resoluteness" means consistently violating the pairwise preference when it would complete the pump, isn't that just abandoning the cycle *in practice*? How is "I prefer Z to X, but I resolve never to trade Z for X" meaningfully different from "I actually prefer X to Z"?

  **ST:** It's different because the refusal stems from the *plan*, not a *re-evaluation of the goods' relative value*. She acknowledges the pairwise preference Z>X *exists*, but recognizes acting on it *in this specific sequence* leads to a dominated outcome. The preference is *conditional* on the choice architecture. Think of it like this: I might prefer swimming to running *in general*. But if I'm in a leaky boat, resolving *not* to swim (even though I prefer it) is sensible based on the broader context and consequence (drowning). My preference for swimming over running hasn't vanished; I just can't afford to act on it *here*. Similarly, the resolute agent retains Z>X but cannot afford to act on it *at the cycle's endpoint* without loss.

  **FT:** That sounds like sophistry. If the preference Z>X only manifests in contexts where acting on it *isn't* costly or part of a pump, but *never* when it would complete the exploit, how is it a real, stable preference? It seems defined entirely by its *inaction*. You're saying she has a cyclic preference *except* precisely at the point where acting on it would reveal the contradiction? That looks suspiciously like defining the cycle *away* from the dangerous edges. Isn't the resolute "policy" functionally identical to holding the acyclic preference X>Y>Z? Both lead to refusing the final trade. What work is the "underlying cycle" doing?

  **ST:** The work is in explaining *why* the naive agent accepts the first two trades! The naive agent *reveals* the cyclic preferences sequentially: she trades X for Y (showing X<Y + fee), Y for Z (showing Y<Z + fee). It's only the final, loss-making step that forces a deviation. The resolute agent *also* possesses that cyclic evaluation structure – she agrees that X<Y, Y<Z *in isolation with a fee is acceptable*. Her policy isn't denying those trades are good *individually*; it's denying the *sequence's* outcome. The underlying cyclic valuation explains the *attraction* of the first trades. An agent with strict X>Y>Z wouldn't trade X for Y with a fee in the first place! The cyclic preference structure *motivates* the initial path; resoluteness *blocks* the exploitation. The preference structure persists; the choice rule adapts to avoid the trap.

  **FT:** So the cyclic preference is real... only it can never be fully expressed without triggering a loss, and must be permanently chaperoned by a policy that overrules its final implication? That seems like a distinction without a difference. If the policy *always* forbids acting on Z>X in the relevant context, and the agent complies, doesn't that *become* her effective preference? You've admitted the "preference" is inert where it counts. How is this not just transitivity (X>Y>Z) wearing resoluteness as a disguise?

  **ST:** Because the *basis* for the refusal is different! The transitive agent refuses the final trade because she *disprefers* Z to X. The resolute agent refuses it *despite preferring* Z to X, *because* of her commitment to the plan avoiding the net loss. The psychological or normative commitment to the plan provides the *reason* for the refusal, distinct from a direct reversal of the pairwise valuation. It’s a meta-preference for avoiding dominated outcomes over satisfying immediate pairwise preferences. The underlying cyclic evaluation remains the *source* of the vulnerability and the *justification* for the initial trades; it’s not erased, it’s *managed*. The exploitability is about the interaction of preference, choice architecture, and foresight, not a fatal flaw in the preference structure itself. The pump shows the need for sophisticated *choice rules*, not that cyclic preferences are irrational *per se*.

  *(They fall silent, watching the volunteer. Neither looks entirely satisfied, but neither has yielded ground.)*
