answer: |-
  Here’s a rigorous case against Lewis’s position, engaging directly with retributivist assumptions while arguing that punishment *can* be vicariously transferred—not as a theological loophole, but as a coherent extension of desert and liability:

  ### Core Argument: **Punishment as Transferable Obligation, Not Personal Suffering**
  Lewis assumes retributive justice *requires* the guilty party’s suffering as a non-negotiable good. But this confuses two distinct elements:  
  1. **Guilt** (a non-transferable moral state of the offender).  
  2. **Liability** (the obligation to *bear* punishment, which may be transferable under specific conditions).  

  The strongest retributivist case for substitution hinges on rethinking liability as a *debt-like obligation* separable from the guilty party’s physical experience.  

  ---

  ### Key Counterarguments:  
  #### 1. **Desert is Satisfied by the *Settlement*, Not the *Sufferer***  
     - Lewis treats punishment as intrinsically personal, like shame. But retributivism is fundamentally about *just deserts*: restoring moral balance by imposing suffering *equivalent* to the wrong.  
     - **Analogy**: If a thief steals $100, justice demands $100 be restored—not that the thief personally returns *the exact bills*. A third party’s payment satisfies the debt because the value (not the actor) is what matters.  
     - **Punishment Extension**: If the substitute’s suffering is *voluntary* and *equivalent in weight* (not identity), the debt is paid. The guilty party’s desert is extinguished because the *substance* of what they owed (suffering) has been provided.  
     - *Lewis’s Blind Spot*: He concedes fungibility for debts but not punishments because he defines punishment’s "substance" as *the guilty suffering*. This begs the question. If desert is *owed suffering*, not *personal experience*, substitution works.  

  #### 2. **Liability Transfer is Embedded in Legal/Moral Tradition**  
     - **Historical Precedent**: Ancient Near Eastern law (e.g., Code of Hammurabi) allowed debtors’ family members to bear penalties. Roman *noxal surrender* let a *paterfamilias* surrender a slave for punishment in place of a free citizen.  
     - **Modern Parallel**: Bail bondsmen assume financial liability for defendants. If liability is wholly non-transferable, this practice would be incoherent—yet it functionally *works* as a substitute.  
     - **Power of Attorney Principle**: We routinely transfer legal agency (e.g., signing contracts for others). If punishment is an obligation to be discharged, why can’t agency be delegated *with consent*?  

  #### 3. **Voluntariness as Moral Alchemy**  
     - Lewis dismisses the substitute’s suffering as "unrelated," but *voluntary assumption of liability* changes its moral character:  
       - A conscripted scapegoat suffers *unjustly*.  
       - A willing substitute (e.g., a parent taking a child’s prison sentence) transforms suffering into *a moral transaction*.  
     - **Retributivist Justification**: The guilty party’s desert creates an "empty slot" for suffering. A volunteer *fills the slot* with equivalent weight, nullifying the debt. The substitute isn’t "punished unjustly"—they *satisfy justice* by bearing what was owed.  

  #### 4. **Guilt vs. Liability: A Necessary Distinction**  
     - **Guilt** remains with the offender—they are *culpable* but no longer *liable* if the debt is paid.  
     - **Example**: Soldier A deserts his post. Soldier B volunteers to face flogging in his place.  
       - *Lewis*: "B is punished, but A isn’t—justice fails."  
       - *Counter*: A’s guilt is unchanged, but his *liability to be flogged* is transferred. Justice sees the flogging as *A’s punishment* because B acted *as A’s agent* in bearing it.  
     - This mirrors contract law: If you default on a loan and your guarantor pays, *your* debt is satisfied—not the guarantor’s.  

  #### 5. **The Social Function of Punishment**  
     - Retributivism isn’t solely about the offender’s suffering—it’s about affirming societal norms.  
     - Vicarious punishment achieves this *if* society recognizes the substitution as valid:  
       - The victim/community sees "the debt paid" (deterrence/moral affirmation intact).  
       - The offender’s guilt is still marked (denunciation intact).  
     - *Contra Lewis*: If substitution "doesn’t count," why do we feel moral relief when a parent’s sacrifice spares a child? Our intuition treats it as justice served.  

  ---

  ### Why This Doesn’t Collapse into Consequentialism  
  This defense remains retributivist: it demands *equivalent suffering for the specific wrong*, not just any suffering that yields good outcomes (e.g., deterrence). The substitute’s payment is *for the offender’s debt*, making it fundamentally different from random suffering.  

  ### Lewis’s Weakest Link: **The Fungibility Threshold**  
  Lewis accepts money as fungible but punishment as non-fungible. Yet we *do* treat non-monetary debts as transferable:  
  - Community service "debts" paid by proxies.  
  - Honor cultures where kin assume vengeance obligations.  
  If retribution is *quantified* (e.g., "10 units of suffering owed"), fungibility follows—unless we insist suffering’s *source* is part of the "unit." But that’s arbitrary: we don’t reject $100 bills because they weren’t printed by the thief.  

  ### Conclusion  
  Punishment *can* be vicariously discharged if:  
  1. The substitute *voluntarily assumes liability*,  
  2. The suffering is *equivalent in moral weight*,  
  3. Society recognizes the transaction as *extinguishing the debt*.  
  This doesn’t erase guilt but satisfies desert by fulfilling the offender’s obligation through an agent. Lewis’s error is conflating *who* must suffer with *what* must be suffered—a distinction that collapses under scrutiny of how obligations operate in moral economies.  

  Would you like to drill deeper into any of these points? I can also explore implications for corporate liability (e.g., why fines *feel* unsatisfying compared to jail time under this framework).
