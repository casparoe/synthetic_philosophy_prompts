  Here’s an argument against Douglass’s 1860 position, defending Garrison’s view by focusing on the operative clauses and their concrete effects, engaging directly with Douglass’s reasoning:

  **Core Argument:** Douglass’s textualist interpretation fails because it ignores how the Constitution’s *functional mechanisms*—specifically the Three-Fifths Clause (Article I, Section 2) and the Fugitive Slave Clause (Article IV, Section 2)—created a legal and political framework that actively protected and perpetuated slavery *regardless* of the document’s silence on the word "slavery" or its aspirational preamble. These clauses were not neutral or ambiguous; they were operational mandates with undeniable pro-slavery consequences that fixed the document’s complicity.

  ### 1. The Three-Fifths Clause: Empowering Slavery Through Representation
  *   **Douglass's Argument:** Douglass claimed this clause recognized enslaved people as "persons," not property, because it counted them (partially) for representation. He argued this undermined the idea that the Constitution *constitutionally* recognized property in man.
  *   **Counter-Argument:** Douglass fundamentally misreads the clause's *operative effect*. While it used the term "persons," its purpose and outcome were exclusively to boost the political power of *slaveholders*.
      *   **Concrete Legal/Political Effect:** By counting 60% of the enslaved population for apportioning House seats and Electoral College votes, the clause gave slaveholding states massively disproportionate representation in the federal government. A Virginia planter gained significantly more political clout than a New York farmer precisely *because* he held other humans in bondage. This wasn't a recognition of the humanity of the enslaved; it was a *bonus* granted to their oppressors.
      *   **Fixing Meaning:** This clause *structurally embedded* slaveholder dominance into the federal system. It incentivized the maintenance of slavery and ensured that slaveholding interests would have outsized influence over national policy – including the protection of slavery itself. The clause’s *effect* was to make the federal government an instrument of slaveholder power, regardless of the preamble's "Blessings of Liberty." Its silence on the *word* "slavery" is irrelevant; its *operation* was undeniably pro-slavery.

  ### 2. The Fugitive Slave Clause: Mandating Complicity
  *   **Douglass's Argument:** Douglass noted the clause avoids the words "slave" or "slavery," using "Person held to Service or Labour." He argued this phrasing didn't explicitly sanction slavery as a *national* institution and left room for interpretation favoring liberty.
  *   **Counter-Argument:** This ignores the clause's explicit *mandate* and its immediate, concrete legal implementation.
      *   **Concrete Legal/Political Effect:** The clause *required* free states to actively participate in the perpetuation of slavery. It mandated the return of individuals escaping bondage ("fugitives from labour") to their enslavers. This wasn't passive permission; it was a positive constitutional obligation imposed on *all* states.
      *   **Fixing Meaning:** The clause transformed every citizen and state official in the North into potential agents of the slave system. The euphemistic language ("Person held to Service or Labour") was a deliberate fig leaf, but its meaning was universally understood in practice. Federal legislation (Fugitive Slave Acts of 1793 and 1850) ruthlessly enforced this clause, demonstrating its unambiguous pro-slavery intent and effect. By compelling free states to violate their own principles and physically return people to bondage, the Constitution *operationally* sanctified slavery. Douglass's focus on the absence of the word "slavery" is semantic evasion; the *functional reality* was a constitutional requirement to uphold the slaveholder's property claim.

  ### Why Garrison's Verdict is More Defensible
  *   **Beyond Textual Silence & Stated Ends:** Douglass relies on the absence of explicit words and the preamble's ideals. However, the Three-Fifths and Fugitive Slave Clauses demonstrate that the *operative machinery* of the Constitution actively sustained slavery. A document whose functional clauses mandate the return of escaped slaves and deliberately inflate the political power of slaveholders cannot be credibly interpreted as "anti-slavery," no matter what its preamble hopes for or what words it avoids. Its *workings* betrayed its ideals.
  *   **Framers' Intentions & Practice Matter:** Douglass dismisses framers' intent and subsequent practice. Yet, the inclusion of these specific clauses, demanded by slaveholding delegates (like those from South Carolina and Georgia) and understood by all participants at the Convention as essential compromises *for slavery*, reveals the document's pro-slavery foundations. Decades of federal policy enforcing these clauses (e.g., upholding the Fugitive Slave Acts, admitting slave states empowered by the Three-Fifths Clause) solidified this meaning through concrete government action.
  *   **Justice Contradicted by Operation:** The preamble's goals of "Justice" and "Blessings of Liberty" are rendered hollow by clauses that legally mandated the return of individuals to torture and forced labor (Fugitive Clause) and deliberately skewed democratic representation to favor a system built on human chattel (Three-Fifths Clause). The document's *effects* actively produced injustice and denied liberty, proving Garrison's "covenant with death" characterization apt.

  **Conclusion:** While Douglass's later position represented a pragmatic shift seeking to harness the Constitution for abolition, Garrison's original, harsher verdict was more intellectually defensible regarding the document's *inherent character* as ratified. The Three-Fifths and Fugitive Slave Clauses were not mere ambiguities; they were concrete, functional mechanisms that embedded slavery's protection into the constitutional structure. Their undeniable pro-slavery *effects* – empowering slaveholders politically and legally mandating Northern complicity in slave-catching – fixed the Constitution's meaning as a pro-slavery compact, irrespective of its noble preamble or its silence on the word "slavery." The document's operational reality validated Garrison's condemnation.
