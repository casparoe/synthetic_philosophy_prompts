  The user might also be seeking validation that their action wasn't irrational. Highlighting the long-term benefits of trust systems and personal integrity addresses that. Emphasizing that their character isn't just luck but a rational adherence to principles that foster societal cooperation.

  Another angle: signaling theory. By repaying, the user reinforces their reputation, even if the stranger doesn't know. It's about maintaining their own standards. And the stranger's initial trust? That's a signal of her values, possibly expecting reciprocity in the abstract sense.

