  #### **Move 4: Callum's Defense of Justified Constraints**
  **Callum's Claim**:  
  The extra constraint (fixed Left/Right marginal) is *earned* by the evidence's silence on Right Bank. Nadia's rule shifts the marginal *without justification*, while his constraint respects the evidence's scope.  

  **Merits**:  
  - **Evidence-based justification**: The radio intercept discusses *only* Left Bank. Updating Right Bank indirectly (via KL) is less defensible than conservatively leaving it unchanged.  
  - **Asymmetry in justification**: Nadia's shift is a byproduct of a general formula; Callum's constraint is tailored to the evidence's content.  
  - **Philosophically grounded**: In formal epistemology, constraints should be licensed by evidence. Silence isn't evidence *for* change.  

  **Who has the better of it?**  
  Callum. His constraint is evidence-led, while Nadia's shift is a mathematical consequence of KL minimization that lacks direct empirical grounding. This is the crux: *Should evidence silence justify stability?* Callum says yes; Nadia says silence isn't informative.

