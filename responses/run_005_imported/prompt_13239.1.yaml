  ### **Key Unnoticed Assumption Both Rely On**
  Both assume **symmetry on the Right Bank must be preserved** (i.e., *Old Quarter* and *Docks* remain equiprobable there). This is reasonable—the message doesn't mention Right Bank, so symmetry isn't broken—but it's an implicit constraint.  
  - **Nadia** preserves symmetry via KL minimization (no new information → maintain prior symmetry).  
  - **Callum** preserves symmetry by not updating Right Bank.  
  Neither questions this, but it *is* an assumption: the message could theoretically imply asymmetric information about Right Bank (e.g., "we only have data for Left Bank"). However, in your setup, preserving symmetry is sensible.

