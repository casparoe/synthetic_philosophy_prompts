  #### **Move 3: Nadia's Rebuttal on Assumptions**
  **Nadia's Claim**:  
  Callum's rule isn't assumption-free—it's equivalent to KL minimization *plus* an extra constraint: "keep Left/Right marginal fixed." His approach *adds* an assumption (no change to Right Bank) that isn't in the evidence.  

  **Merits**:  
  - **Formally valid**: Callum's update *can* be derived from KL minimization by imposing an additional constraint (fixed Left/Right marginal).  
  - **Exposes hidden structure**: Both methods minimize divergence subject to constraints:  
    - Nadia: Only the 3:1 conditional constraint.  
    - Callum: The 3:1 constraint *and* fixed Left/Right marginal.  
  - **Highlights the core issue**: With conditional-probability evidence, "condition and leave the rest alone" isn't a default—it's an added assumption.  

  **Who has the better of it?**  
  Nadia. She correctly notes that Callum's "neutral" update smuggles in an extra constraint. The message doesn't justify fixing the marginal; it merely omits the Right Bank.

