answer: |-
  You've pinpointed exactly where Russell's argument becomes dense and requires careful unpacking. It's a brilliant, provocative piece of reasoning typical of his style, moving from psychology to anthropology to social critique. Let's dissect it step-by-step to see how the pieces lock together for your character's paraphrase:

  1.  **The Core Claim:** "The purely instinctive element in jealousy is not nearly so strong as most moderns imagine."
      *   Russell is challenging the assumption that jealousy is a fundamental, hardwired biological instinct directly proportional to love/attachment. He argues its intensity is heavily shaped by *social factors*.

  2.  **The Key Social Factor:** "The extreme strength of jealousy in patriarchal societies is due to the fear of falsification of descent."
      *   Patriarchal societies are defined by property and lineage passing through the male line. The paramount fear isn't just infidelity, but the possibility of raising another man's child as one's own heir – "falsification of descent." This fear *amplifies* jealousy beyond any "instinctive" baseline.

  3.  **The Crucial Example:** "This may be seen in the fact that a man who is tired of his wife and passionately devoted to his mistress will nevertheless be more jealous where his wife is concerned than when he finds a rival to the affections of his mistress."
      *   **How it secures the opening claim:** This observation directly contradicts the "instinct = jealousy proportional to love" model. If jealousy were purely instinctive and driven by current emotional attachment, the man would be *more* jealous regarding the mistress he loves passionately. The fact that he's *more* jealous about the wife he's "tired of" demonstrates that something *other* than instinctive attachment is driving the intensity of his jealousy. That "something else" is the *social consequence* tied specifically to the wife: the risk of false paternity and inheritance.

  4.  **The Psychological Mechanism (Ego & Egoism):** "A legitimate child is a continuation of a man's ego, and his affection for the child is a form of egoism."
      *   **Argumentative Work (Not Fluff):** This sentence provides the *psychological underpinning* for the fear of false descent and explains *why* it's so potent.
          *   **"Continuation of ego":** In a patriarchal system, a man sees his legitimate son (especially the heir) not just as offspring, but as an extension of himself – his legacy, his name, his property, his immortality. The son *is* the father projected into the future.
          *   **"Affection... a form of egoism":** Russell provocatively argues that the deep love a father feels for his legitimate child is rooted in this self-projection. It's love *for his own continuation*, hence "egoism." This isn't necessarily a cold statement; it explains the profound emotional investment a man has in the *fact* of his paternity.
      *   **How it connects to the example:** The man in the example isn't more jealous of the wife because he loves *her* more (he doesn't), but because the *consequences* of her infidelity threaten this core "egoistic" investment in his lineage. A child from her infidelity is not "his" continuation; it's an impostor usurping his legacy and property. The mistress's potential child with a rival doesn't carry this weight – it doesn't threaten his established lineage or property inheritance. His affection for her might be intense, but it lacks this deep structural "egoistic" investment tied to descent.

  5.  **The Stakes & Deception:** "If, on the other hand, the child is not legitimate, the putative father is tricked into lavishing care upon a child with whom he has no biological connection."
      *   This elaborates on the fear. The ultimate patriarchal nightmare: investing love, resources, and legacy into a child who isn't biologically "his," deceived into perpetuating another man's line with his own wealth and name. This is the concrete harm behind "falsification of descent."

  6.  **The "Hence" – Connecting Paternity to Subjection:** "Hence the discovery of fatherhood led to the subjection of women as the only means of securing their virtue—a subjection first physical and then mental, which reached its height in the Victorian age."
      *   **Licensing the "Hence":** The entire chain builds to this causal link:
          1.  The *discovery* (or social recognition/insistence) that specific men father specific children creates the *concept* of biological paternity.
          2.  This concept, combined with patriarchal property/lineage systems, creates the immense value placed on *certainty* of paternity ("falsification of descent" must be prevented).
          3.  The only way perceived by patriarchal societies to ensure this certainty was to control women's sexuality absolutely. If a woman is sexually exclusive to one man, his paternity of her children is guaranteed (biologically, if not always socially).
          4.  Therefore, the *need* for paternity certainty, arising *from* the discovery of fatherhood *within a patriarchal property framework*, becomes the *primary driver* for the systemic subjection of women – controlling their bodies (physical subjection: chastity belts, confinement, honour killings) and minds (mental subjection: modesty doctrines, sexual ignorance, moral double standards, internalized shame). The Victorians perfected this mental subjection through pervasive ideology.
      *   Russell argues that the extreme jealousy observed earlier, amplified by the fear of false descent and underpinned by the egoistic investment in lineage, *necessitated* this subjection as the perceived solution. It wasn't just about morality; it was about property and power structures built on biological certainty.

  **Summary of the Logical Chain for Your Character:**

  1.  Jealousy isn't *just* instinct; it's hugely amplified by social fears.
  2.  In patriarchies, the big fear is a wife bearing another man's child who might inherit your property/name ("false descent").
  3.  Proof? A man loves his mistress but feels *more* jealousy if his unloved wife strays. Why?
  4.  Because only the wife's child threatens his core "egoistic" investment: a legitimate child is his *immortality*, his self projected forward. Loving that child *is* loving his own future.
  5.  If tricked into raising another man's child, he wastes that profound investment on an "impostor."
  6.  THEREFORE (Hence!), once men grasped fatherhood (discovering paternity) within systems where lineage = power/property, the *only* way they saw to guarantee paternity certainty was to utterly control women – body and mind. Victorian prudery was the peak of this control strategy, masking its roots in property anxiety.

  **A Possible Paraphrase for Your Character (aiming for accuracy & idiom):**

  "Bertie argues it's rather missing the point to call jealousy mere instinct. In societies like ours, built on property and the male line, it's *fear* that pumps it full of venom – the fear that one might raise another man's son as one's own heir. He points out the perfectly obvious: a man bored stiff by his wife but mad for his mistress will still rage more if the *wife* takes a lover. Why? Because only the wife carries the weight of his posterity. Her child is meant to be his immortality, a little extension of himself striding into the future. His love for the child *is* a kind of supreme selfishness – glorious, perhaps, but selfish. To pour that love, that legacy, into a child not his own? It's the ultimate deception, the ultimate theft. *That's* why, Russell says, the moment men truly grasped fatherhood – the biological link – they saw only one solution to secure their precious lineage: lock women up, first in harems or behind walls, then inside corsets of virtue and ignorance. Our dear Victorians didn't invent modesty; they merely perfected the cage required by property-obsessed patriarchs terrified of cuckoos in their dynastic nests."

  **Why this paraphrase works:**

  1.  **Accuracy:** Captures each step of Russell's logic (instinct vs. social fear, the example, the ego/lineage link, the deception, the "hence" leading to subjection as the solution for paternity certainty).
  2.  **Idiom:** Uses character-appropriate language ("Bertie," "perfectly obvious," "bored stiff," "mad for," "pumps it full of venom," "glorious... but selfish," "corsets of virtue," "dear Victorians," "cuckoos," "dynastic nests").
  3.  **Highlights the Key Insight:** Clearly shows the link between paternity certainty, egoistic lineage investment, and the *necessity* of female subjection as the perceived solution within patriarchy.
  4.  **Captures Russell's Tone:** Blends intellectual precision ("posterity," "biological link," "dynastic") with Russell's characteristic dry wit and provocative phrasing ("supreme selfishness," "perfecting the cage").
  5.  **Addresses the "Hence":** Explicitly states that the recognition of fatherhood *within patriarchal property structures* led directly to the perceived *need* for female subjection to guarantee that fatherhood.

  This paraphrase should ring true to a careful reader of Russell, accurately reflecting his complex chain of reasoning while rendering it in the voice of your intellectually serious character engaging in a heated argument about the foundations of marital morality.
