answer: |-
  ## The Boundary Problem: Escaping the Regress Trap

  The boundary problem—democratically justifying the *demos* without circularity—is indeed the foundational quicksand of democratic theory. Whelan's regress is formidable: any procedure to define "the people" presupposes a pre-existing group authorized to run that procedure. Näsström sharpens this into a paradox of self-authorization: a people cannot logically constitute itself democratically, as it lacks prior existence to authorize the constitutive act. Goodin's All-Affected-Interests (AAI) principle and the All-Subjected (AS) principle are prominent attempts at escape. However, AAI fails to resolve the regress and leads to impracticality, while AS merely relocates it. **The only viable path forward is to reject the demand for a purely *principled*, non-circular *democratic* justification of the *initial* demos, embracing instead a "constitutive" theory grounded in historical-political reality and ongoing contestation, where democracy's *practice* legitimizes its boundaries retrospectively and dynamically.**

  ### The Inescapable Regress & The Failure of AAI
  The regress argument is devastating against any attempt to derive the *demos* democratically *ex nihilo*. Imagine a founding convention:
  1.  **Who convenes it?** Some group (Group A) must initiate it.
  2.  **Who authorizes Group A?** If authorization is needed, it must come from a prior group (Group B).
  3.  **Who authorizes Group B?** Ad infinitum.

  Any vote, referendum, or convention designed to *establish* the demos already assumes a bounded electorate. This is not just a practical hurdle but a logical impasse. Näsström is correct: a people cannot *democratically* author its own constitution *ab initio*; the act of founding always presupposes a pre-constitutional unity.

  Goodin's AAI principle ("everyone affected gets a say") seems appealingly inclusive. However, it fails as a solution to the *boundary problem* for two crucial reasons:
  1.  **It Doesn't Escape the Regress; It Conceals It:** AAI doesn't tell us *who decides* whose interests are affected and *how* that decision is made. Determining the scope of "affectedness" is itself a decision requiring boundaries. Does a farmer in Argentina *really* have a claim to vote on US ethanol subsidies because they *might* affect global corn prices? Who adjudicates this? Applying AAI consistently requires a prior, bounded authority to operationalize it, reintroducing the very regress it seeks to avoid. Goodin's embrace of near-universal inclusion is less a solution and more an admission that AAI, as a *procedural* principle for *defining* the demos, collapses under its own weight.
  2.  **The Impracticality is Fatal to Democracy:** Even if we ignored the regress, Goodin's conclusion renders collective self-government impossible. A demos encompassing everyone potentially affected by any non-trivial decision is too vast and heterogeneous for meaningful deliberation, agenda-setting, or coherent will-formation. Democracy requires agency and collective identity; AAI dissolves both into an amorphous global mass. Your students are right: this *is* a *reductio* for AAI *as a solution to the boundary problem*. It highlights a moral aspiration (considering affected interests) but fails as a constitutive principle.

  ### The All-Subjected Principle: Relocation, Not Escape
  The AS principle ("all subjected to coercion/rules get a say") appears more grounded. By tying membership to actual subjection to sovereign power, it promises a concrete, non-circular criterion. Abizadeh powerfully leverages this against border control: if the state coercively excludes immigrants, they *are* subjected and thus deserve inclusion in the decision.

  However, AS also fails to resolve the core regress:
  1.  **The Jurisdiction Problem:** AS merely relocates the boundary question. *Who defines the jurisdiction* whose rules constitute subjection? Why is the jurisdiction territorial? Why does it have *these* specific borders? The existence and scope of the jurisdiction itself – the entity exercising power – must be justified *before* AS can be applied. Why should a Somali fisherman subjected to EU naval patrols enforcing fishing quotas *not* have a vote in EU fisheries policy, if subjection is the criterion? AS depends on a pre-existing power structure whose boundaries are unexplained. The principle tells us who should be included *given* a jurisdiction, but it doesn't democratically justify *that jurisdiction's existence or scope*.
  2.  **The Definition Problem:** What constitutes "subjection" or "coercion"? Is it only direct legal enforcement, or does it include economic coercion, cultural hegemony, or environmental impact? Determining the threshold and nature of subjection again requires a prior, bounded authority, reintroducing the regress at the level of interpretation. AS replaces the question "Who is the demos?" with the equally contested questions "What is the jurisdiction?" and "What counts as subjection?".

  Abizadeh's challenge stands: AS, rigorously applied, destabilizes any notion of a closed, self-authorizing demos capable of controlling its borders through simple policing. But this doesn't solve the boundary problem; it demonstrates that AS, like AAI, cannot provide a non-circular *democratic* foundation for the *initial* demos/jurisdiction. It pushes the problem back to the justification of the coercive order itself.

  ### The Constitutive Path: History, Politics, and Democratic Practice
  If neither AAI nor AS provides a principled, non-circular *democratic* solution to the initial boundary problem, must we conclude it's insoluble? Not quite. We must shift our understanding of what constitutes a "solution." **The escape lies in recognizing that the *initial* demos is not, and cannot be, democratically constituted. It is *constituted* through non-democratic historical processes: shared geography, language, struggle, revolution, imposition, or gradual institutionalization.**

  This "constitutive" view accepts the force of the regress argument against a purely logical or contractual democratic founding. The demos emerges pre-politically or through political action that is *constitutive* rather than *democratically authorized*:
  *   **Historical Reality:** Peoples form through shared experiences (wars, migrations, colonization, liberation), cultural ties (often forged or imposed), and the practical need for collective organization within a territory. The "we" precedes the democratic "how."
  *   **Political Facticity:** The existence of a functioning state apparatus, even if initially undemocratic, creates a *de facto* jurisdiction and a population subject to it. This provides the raw material from which a demos can *develop*.
  *   **Democratic Practice as Legitimizing:** This is the crucial move. Democracy doesn't logically found itself, but it *legitimizes* and *shapes* its boundaries *through practice*. The initial, non-democratically constituted political community becomes the arena for democratic contestation *about its own boundaries and constitution*.
      *   **Internal Democratization:** The *de facto* demos uses democratic procedures (votes, constitutional amendments, courts) to argue for and implement expansions or contractions of the franchise *within* the existing framework (e.g., suffrage movements).
      *   **Contestation of Boundaries:** Democratic debate *within* the demos constantly challenges the *justice* of existing boundaries (e.g., arguments for open borders, regional autonomy, indigenous sovereignty, global governance). This contestation uses moral principles (like AAI or AS) *within* the democratic space, applying pressure for reform.
      *   **Dynamic Legitimacy:** The legitimacy of the boundaries stems not from an impossible act of self-founding, but from the ongoing responsiveness of the democratic process to internal demands for inclusion/exclusion reform and external claims (like Abizadeh's). Boundaries are provisional and subject to democratic revision based on evolving understandings of justice and community.

  **Meeting the Strongest Objection:** The most powerful objection to this constitutive view is that it **smuggles in arbitrariness and sanctions exclusion.** If the initial demos is based on historical accident or force, doesn't this undermine democracy's core claim to legitimacy and justify entrenched inequalities and unjust exclusions?

  **Response:** This objection rightly identifies the risk, but mischaracterizes the solution.
  1.  **Acknowledgment, Not Justification:** The constitutive view *acknowledges* the non-ideal, often arbitrary or violent origins of political communities. It doesn't *morally justify* those origins or the exclusions they entailed. The point is *descriptive realism* about foundations.
  2.  **Democracy as the Corrective:** The constitutive argument's strength is locating democracy's *value* precisely in its ability to *confront* and *correct* this legacy. Democracy provides the tools (free speech, assembly, voting, constitutional change) for the historically constituted community to *challenge* its own exclusions and arbitrary boundaries *from within*. The legitimacy derives from the system's capacity for self-reform in response to normative claims (using principles like AAI or AS *within* the process), not from a mythical pure origin.
  3.  **The Alternative is Paralysis:** The objection demands an impossible purity. Insisting on a fully democratic, non-circular justification for the *initial* demos leads to infinite regress and democratic paralysis. The constitutive view offers a path *forward*: start where we are, with the historically given "we," and use democracy to make it more just and inclusive over time. The failure to achieve perfect initial legitimacy is not an excuse for complacency; it is the imperative driving democratic struggle.
  4.  **Universalism Contained, Not Abandoned:** Moral universalism (AAI's spirit) isn't discarded; it's channeled *into* the democratic process of the constitutive community. Citizens appeal to universal principles *within* their polity to argue for inclusion. The demos's boundaries are always potentially porous to moral claims.

  ### Conclusion: Dissolving, Not Solving, the Logical Regress

  The boundary problem, framed as a demand for a *principled, non-circular democratic justification of the initial demos*, is indeed insoluble. Whelan's regress is logically fatal to any such attempt. Goodin's AAI principle fails spectacularly, collapsing into impracticality without escaping the regress. The All-Subjected principle, while normatively powerful for critiquing exclusion (as Abizadeh shows), merely relocates the boundary problem to the justification of the jurisdiction itself.

  The only viable conclusion is that the *initial* demos is not democratically founded. It is **constituted** – through history, circumstance, conflict, and shared fate. Democracy enters not as the foundation, but as the **practice** through which this pre-existing (and often flawed) political community seeks self-government and legitimacy. The boundary problem's "solution" lies in recognizing that democratic legitimacy is **dynamic and retrospective**. It arises from the ongoing capacity of a constitutive political community to debate, contest, and reform its own boundaries and membership rules through democratic means, responding to internal demands and external moral claims. The regress is dissolved by accepting the non-ideal starting point and locating democracy's genius in its potential for self-transformation, not in a mythical act of self-creation. The task is not to find the logically perfect founding, but to ensure the living democracy remains fiercely open to its own expansion and redefinition.
