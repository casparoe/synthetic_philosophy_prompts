  Ok so I have a weird one for you today. I'm a backend engineer with basically zero formal philosophy training (closest I got was an "intro to logic" gen-ed in college), but I've been on a bit of a personal-identity kick ever since a podcast covered Parfit's teletransporter thing - you know, the one where your body gets scanned and disintegrated on Earth, and an exact atom-for-atom copy gets assembled on Mars, and the question is whether "you" actually survived the trip or whether you just died and a copy of you is walking around now. Kind of reminded me of restoring a VM snapshot onto totally different hardware and wondering if it's really "the same machine" afterward. Anyway, I get that Parfit's own answer is that strict identity isn't actually what matters for survival - its psychological continuity/connectedness that matters, so since the Mars copy has all your memories and personality intact, it should feel, beforehand, about as good as ordinary survival, even though strictly it's not numerically the same person.

  While falling down that rabbit hole I stumbled on a reference to Bernard Williams, who apparently pushes back on this with some thought experiment involving torture and swapping people's psychologies between bodies. From what I can piece together it goes something like: you're told you're going to be tortured tomorrow, and then also told that your memories/personality are going to get swapped out beforehand, and the point is that you'd still dread the pain no matter whose psychology ends up running "your" body - which is supposed to show that bodily continuity is what's actually driving our survival-related fears, not psychological continuity like Parfit claims. I've only found vague secondhand summaries of this, not the actual paper, so my grasp of the exact setup is shaky at best.

  Could you reconstruct how Williams's thought experiment is actually supposed to work, and spell out exactly how it's meant to cut against Parfit's psychological-continuity story? And then, after you've done the neutral-explainer bit: if you had to bet, who's intuition pump do you think does more damage to the other guy's theory - Parfit's teleporter or Williams's torture case? I'd like an actual opinion with reasons, not a "well it depends what background theory you already hold" cop-out, even if you want to caveat it a little.
