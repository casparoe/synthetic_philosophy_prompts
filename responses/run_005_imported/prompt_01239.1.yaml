  I should also consider Jesseph's work. He argues that Hobbes's geometry is essential to his philosophy. So, if the geometry is flawed, the foundation cracks. The user might need to explore whether maker's knowledge requires infallibility in practice or just in theory. Hobbes's repeated refusal to accept corrections shows a rigidity that conflicts with the constructive nature of geometry.

  The deeper need here might be understanding how personal failings relate to philosophical theories. The user might want to defend Hobbes's epistemology while acknowledging his mathematical errors. They need a balanced view that separates theory from practice but also considers the theory's practical viability.

  In conclusion, both have valid points, but the friend's argument holds more weight in Hobbes's case because his entire system relies on geometry as a model. His failures expose a vulnerability in the claim that such constructions guarantee certainty, especially when applied to politics.
answer: |-
  This is a *fantastic* philosophical debate, hitting right at the intersection of history, math, and epistemology. Both you and your friend have strong points, and the Hobbes/Wallis feud is a perfect case study precisely because it *isn't* just trivia – it exposes genuine tensions in Hobbes's system. Let's break it down:

  ### Your Friend's Point (Wallis's Strategy & Its Epistemic Weight)

  1.  **Targeting the Foundation:** Wallis wasn't *just* being pedantic. He understood that Hobbes's *entire philosophical edifice*, especially his political philosophy (Leviathan!), rested on the unique certainty provided by geometry as the model of "maker's knowledge." If the foundation is demonstrably rotten, the building is unstable. This isn't *merely* ad hominem; it's attacking the core example Hobbes uses to justify certainty in his political theory.
  2.  **The "Maker's Knowledge" Challenge:** Hobbes's core claim is that certainty arises *because* we construct the objects from definitions. The implication is that careful construction *should* yield indubitable results. Hobbes's 25-year saga demonstrates:
      *   **Failure of Construction:** He repeatedly failed to construct the objects he claimed (squared circle, etc.) correctly. His constructions were demonstrably flawed *by the standards of the method he championed*.
      *   **Failure of Recognition:** More damningly, he consistently failed to *recognize* his errors or the validity of refutations (like Wallis's proofs). He couldn't distinguish a correct construction from an incorrect one *even within his own supposedly certain method*.
  3.  **The Epistemic Problem:** This raises a critical question for Hobbes's theory: **If the "maker's knowledge" method is supposed to guarantee certainty, why was its most ardent proponent (and someone claiming mastery of it) so spectacularly and persistently wrong?** This suggests:
      *   **Human Fallibility:** The method itself may not be immune to human error in its *application*, undermining the claim of inherent, accessible certainty. If even the "maker" can botch it so badly, how certain is it *in practice*?
      *   **Standards of Proof:** Hobbes's repeated failures and refusals highlight that "certainty" derived from construction might depend on undisputed *standards* of what counts as a valid construction and proof – standards Hobbes himself couldn't reliably meet or accept. Wallis represented the emerging rigor that Hobbes rejected.
      *   **Threat to the Analogy:** If the "certain" foundation (geometry) proves so contentious and prone to error *even for its champion*, how solid is the analogy for deriving similar certainty in the vastly more complex and contested realm of civil philosophy/politics?

  **Your friend is essentially arguing:** Hobbes's personal failures aren't just embarrassing; they are a *practical demonstration* of a potential flaw *within* the theory of maker's knowledge as a guarantor of accessible, infallible certainty. The theory claims X (careful construction yields certainty), yet its prime advocate demonstrably failed to achieve X despite intense effort and belief. This *empirical evidence* counts against the theory's viability or its description of how knowledge *actually works* for humans.

  ### Your Point (The Ad Hominem Defense)

  1.  **Separation of Theory and Practitioner:** You are absolutely right that a theory's validity is logically distinct from the competence of any individual proponent. Many brilliant philosophical insights come from people who weren't masters of the specific fields they philosophized about. Kant wasn't a physicist, Frege wasn't a working mathematician in all areas he discussed logic.
  2.  **Focus on the Argument:** The core of Hobbes's epistemological argument – that knowledge constructed from definitions we control is fundamentally different and more certain than knowledge inferred from observed effects – can be evaluated on its own merits. Does the *logic* of "maker's knowledge" hold? Does it genuinely describe a source of certainty *in principle*?
  3.  **Hobbes's Stubbornness as Irrelevant:** You correctly identify Hobbes's personality (dogmatism, inability to admit error, perhaps even arrogance) as a significant factor *separate* from the theory itself. His failure might be more about his psychology than a flaw in geometric epistemology *per se*.

  **You are essentially arguing:** Criticizing the theory based on Hobbes's personal failings commits the ad hominem fallacy by attacking the person (Hobbes the bad geometer) rather than engaging directly with the logic of the argument (maker's knowledge as a source of certainty). The *theory* might still be sound even if its most famous advocate was terrible at applying it.

  ### Who's "Right"? A More Nuanced Synthesis

  **Neither of you is entirely wrong, but your friend's argument carries significant weight in *this specific context* of Hobbes, for several reasons:**

  1.  **Hobbes Made Geometry Central:** Unlike a philosopher who merely *comments* on math, Hobbes built his *entire philosophical system* on the unique certainty of geometry derived from maker's knowledge. It wasn't just an example; it was the *model* and *foundation* for his political science. Attacking the integrity of that specific foundation *is* a direct attack on the system built upon it.
  2.  **The Failure Demonstrates a Theoretical Vulnerability:** Your friend isn't *just* saying "Hobbes was dumb, therefore his theory is wrong." She's saying: "Hobbes's theory claims that method X reliably produces certainty Y. Hobbes applied method X obsessively and claimed to achieve Y, but demonstrably failed to achieve Y and couldn't even recognize his failure. This *empirical outcome* suggests that method X, *as understood and applied by humans*, does *not* reliably guarantee Y in the way the theory claims." This points to a potential gap between the *ideal* of maker's knowledge and its *human implementation* – a gap Hobbes's theory didn't adequately address.
  3.  **Jesseph's Point (Crucial!):** As you mentioned, Jesseph's work ("Squaring the Circle" and "Hobbes's Geometry of Vision") argues powerfully that Hobbes's mathematical failures are *not* separable from his philosophy. They stem from the *same* foundational commitments (e.g., his strict nominalism, his rejection of abstract entities, his corporealist metaphysics) that underpin his epistemology and political theory. Wallis wasn't just attacking bad math; he was attacking the philosophical premises that *led to* the bad math and that *also* shaped Hobbes's political vision. The feud exposed an internal tension within Hobbes's system.
  4.  **The Certainty Claim:** The core issue is the *strength* of Hobbes's claim: *unique, absolute certainty*. If the method can produce such persistent, undeniable error in its most dedicated practitioner, who remains blind to it, it calls into question whether that *level* of certainty is genuinely achievable through that method *for humans*. It highlights the role of community, proof standards, and critical scrutiny – things Hobbes downplayed in favor of individual construction.

  ### A Better Way to Think About It

  1.  **Not "Disproof," but a Profound Challenge:** Hobbes's failures don't *logically disprove* the concept of maker's knowledge. However, they constitute **powerful evidence against Hobbes's specific *version* of it and its role in his system.** They expose a critical vulnerability: the theory seems to underestimate the difficulty of correct construction, the fallibility of the constructor, and the necessity of external verification even within its own domain.
  2.  **Testing the Model:** Think of Hobbes's geometry as the *test case* for his epistemology. If the model system (geometry) fails spectacularly under the scrutiny of competent practitioners (like Wallis) and even its own proponent gets it consistently wrong, it severely weakens the claim that this model system provides the kind of certainty Hobbes claims, *and* it undermines confidence in applying this model to politics. Wallis was effectively saying, "If this is how 'certain' geometry works in Hobbes's hands, why should we trust the 'certain' politics built on it?"
  3.  **Highlighting the Gap between Ideal and Practice:** The feud brilliantly illustrates the gap between the *theoretical ideal* of construction yielding infallible certainty and the *messy reality* of human reasoning, stubbornness, and the need for communal standards of proof. Hobbes's inability to bridge that gap in his own work is deeply problematic for his theory.
  4.  **Ad Hominem *Circumstantial*, Not *Fallacious*:** While technically an argument about the person (Hobbes's competence), in this context, it's not a *fallacy* because it's *directly relevant* to evaluating his specific, practice-dependent epistemological claim. His competence (or lack thereof) *in applying the very method he claims guarantees certainty* is central evidence for assessing whether that guarantee holds water.

  **Conclusion:** Your friend has the stronger argument *in this specific case*. While Hobbes's personal failings don't *invalidate* the abstract concept of maker's knowledge, they provide devastating evidence against the *viability* and *reliability* of his *specific application* of it as the foundation for absolute certainty in both geometry and, by analogy, politics. Wallis's strategy was philosophically astute: by relentlessly exposing the flaws in Hobbes's geometry, he wasn't just scoring points; he was undermining the very epistemological bedrock of Hobbes's entire philosophical project. The feud isn't trivia; it's a dramatic historical enactment of a profound philosophical problem at the heart of Hobbes's system. Your defense is valid in the abstract, but Hobbes's unique intertwining of his geometry with his core epistemology and politics makes his personal failures exceptionally relevant and damaging to his overall project.
