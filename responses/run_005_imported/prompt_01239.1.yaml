  The user's main question is whether Hobbes's mathematical incompetence invalidates his theory of geometrical certainty. I should consider both sides. The friend's point: if the exemplar of certainty (geometry) can be so badly mishandled by its proponent, does that challenge the theory itself? The user's defense: personal failure doesn't negate the theoretical argument.

  I remember that maker's knowledge relies on construction from definitions. Hobbes's errors might show that even with this method, certainty isn't guaranteed due to human error. Wallis's strategy was to highlight that Hobbes's flawed constructions mean his political philosophy lacks the claimed foundation.

  But is it ad hominem? Typically, ad hominem attacks the person, not the argument. Here, the friend uses Hobbes's failure as evidence against the feasibility of his theory. That's different—it's questioning the practical application of the theory. For instance, if a theory claims a method ensures certainty, but its proponent repeatedly fails using that method, it might indicate a flaw in the method.

