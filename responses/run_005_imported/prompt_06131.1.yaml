answer: |-
  Your working assumption captures a key *motivation* for Sidgwick's psychical research, but it oversimplifies the relationship to his professional philosophy and understates the rigor (and ultimate disappointment) of his investigations. Here's a breakdown:

  1.  **The Religious Motivation is Correct (But Broader):**
      *   **Loss of Faith:** Sidgwick *did* experience a profound crisis of faith in traditional Christianity due to precisely the forces you mention: evolutionary science and historical biblical criticism. He resigned his Fellowship at Trinity College, Cambridge (requiring Anglican orders) over his inability to affirm the 39 Articles.
      *   **Quest for Post-Mortem Survival:** His primary goal with psychical research was **not** to salvage *Christianity* per se, but to find empirical evidence for **personal survival after death**. He saw this as a potential rational foundation for ethics and meaning in a post-theistic world. As he famously stated, his aim was to "break the crust of a resolute materialism." If consciousness survived death, it suggested a universe potentially hospitable to purpose and moral order.

  2.  **The Connection to *The Methods of Ethics* is Profound and Direct:**
      *   **The Fundamental Problem of Ethics:** Sidgwick's masterwork hinges on a critical tension. While he argues that utilitarianism (maximizing general happiness) is the most rational ethical system, he acknowledges a profound difficulty: reconciling the rational demand for impartial benevolence with the individual's natural pursuit of their *own* happiness. Why *should* an individual sacrifice their own well-being for the greater good, especially if it leads to significant personal suffering or loss?
      *   **The Need for a "Sanction":** Sidgwick concluded that pure reason alone couldn't resolve this tension within a purely naturalistic/materialistic framework. He saw two possible solutions:
          1.  **Theistic Solution:** A God who ensures ultimate harmony between virtue and happiness through divine justice in an afterlife.
          2.  **Intuition of Immortality:** A fundamental, intuitive belief in personal survival after death, which could provide a basis for believing in ultimate harmony.
      *   **Psychical Research as Empirical Support:** Sidgwick couldn't accept theism on faith after his crisis. Psychical research became the **empirical project** aimed at finding evidence for survival. If successful, it would provide the crucial "sanction" his ethical system lacked. It wasn't a *private hobby* sitting *alongside* his philosophy; it was a **direct, sustained attempt to empirically verify a foundational assumption he believed was *necessary* to make his rational ethics practically coherent and motivating.** He wrote: "The supreme moment in my life came... when I decided that I must seek evidence for the existence of a spiritual world."

  3.  **Credulous Believer? Absolutely Not. Rigorous Investigator Disappointed:**
      *   **Founding Principle of the SPR:** Sidgwick co-founded the SPR precisely *because* he was *not* credulous. The Society's motto was "To examine without prejudice or prepossession... those faculties of man... which appear to be inexplicable." Its founders were skeptics demanding rigorous proof.
      *   **Methodological Credulity (Cautiously):** Sidgwick advocated a principle of "**methodological credulity**" – meaning investigators should approach phenomena *as if* they *might* be genuine to give them a fair hearing and avoid prematurely dismissing them. This is *not* the same as gullibility; it's a research strategy.
      *   **Rigorous Investigation & Exposure:** Sidgwick and the SPR (especially his colleagues like Eleanor Sidgwick and Frank Podmore) were instrumental in exposing **widespread fraud** among mediums. They developed meticulous controls, employed conjurors (like William S. Marriott) to detect tricks, and documented deception exhaustively. Sidgwick himself became deeply disillusioned by the prevalence of fraud.
      *   **Telepathy as a "Comfortable Sceptical Hypothesis":** While evidence for survival remained elusive, Sidgwick and the SPR found the evidence for **telepathy** (or "thought-transference") more compelling and less tainted by fraud. Sidgwick came to see telepathy as a potentially verifiable natural phenomenon that *could* explain *some* apparent spirit communications (via the medium reading the sitter's mind) – a "comfortable sceptical hypothesis" that undermined claims of survival without resorting to outright fraud accusations in every case. However, even telepathy wasn't conclusively proven to his full satisfaction.
      *   **Ultimate Disappointment:** By the end of his life, Sidgwick was profoundly pessimistic. Decades of investigation had yielded no conclusive proof of survival. He famously confessed to feeling he had "sunk to the point of view of a mere inquirer who might quite likely fail to find anything." He died without the empirical confirmation he desperately sought.

  **In Summary:**

  *   **Motivation:** Yes, deeply rooted in the loss of Christian faith and a search for rational grounds for belief in post-mortem survival and a moral universe.
  *   **Connection to Ethics:** **Direct and essential.** Psychical research was an empirical extension of his philosophical project in *Methods of Ethics*, seeking the "sanction" (evidence of survival) needed to resolve the fundamental tension between rational duty and individual happiness within utilitarianism. It wasn't separate; it was integral to his life's work.
  *   **Credulity:** **No.** He was a founding father of rigorous, skeptical paranormal investigation. He relentlessly exposed fraud and died deeply disappointed by the lack of conclusive evidence for survival, despite finding telepathy a somewhat promising (though still problematic) avenue. He exemplified the rigorous investigator, not the credulous believer.

  Sidgwick represents the poignant struggle of a brilliant rationalist, stripped of traditional faith, desperately seeking empirical evidence for a universe that could sustain his profound ethical commitments. His psychical research wasn't a lapse in judgment; it was a courageous, decades-long, ultimately unsuccessful scientific quest to ground his philosophy in observable reality.
