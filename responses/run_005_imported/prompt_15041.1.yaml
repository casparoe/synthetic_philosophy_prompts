      - It stays within consequentialism because the rules are justified by their consequences. However, it is a form of indirect consequentialism and sometimes accused of collapsing into act-consequentialism or being rule-worship.

   3. Scheffler's Agent-Centered Prerogatives:
      - This explicitly allows the agent to not maximize the good. It reduces demandingness by permitting partiality.
      - However, it is not a form of consequentialism at all. It is a hybrid theory (consequentialist + deontological). So it turns consequentialism into something else.

   4. Railton's Sophisticated Consequentialism:
      - Reduces demandingness by acknowledging that having a life with personal projects and relationships might lead to better overall consequences in the long run (e.g., by preventing burnout).
      - It remains consequentialist because the justification for having a non-maximizing disposition is consequentialist. This is a popular and respected approach.

   5. Murphy's Compliance Condition:
      - Reduces demandingness by capping obligations to what would be required if others did their fair share. So, in a world of non-compliance, you don't have to do more than your fair share.
      - It is consequentialist in spirit (aiming for the best outcome) but the compliance condition is a deontic constraint. However, Murphy argues it is based on efficiency and fairness, which might be justified consequentially. But it's a bit of a stretch.

