  We are ranking approaches to the demandingness objection in consequentialism. The goal is to see how well each approach addresses the objection without abandoning core consequentialist commitments.

   The demandingness objection: Consequentialism (especially act-utilitarianism) seems to require extreme sacrifices, such as giving away most of one's wealth to help others, leading to a life of near-equal deprivation.

   The fixes to be ranked (as per the user's list and adding any major ones):

   1. Satisficing Consequentialism (Slote, Pettit): Instead of maximizing the good, one only needs to achieve a "good enough" outcome. This sets a threshold above which you are not required to do more.

   2. Rule-Consequentialism (Hooker): Act according to rules that, if generally followed, would maximize the good. This might allow for personal rules that permit keeping some resources for oneself.

   3. Scheffler's Agent-Centered Prerogatives: Allows agents to give some preference to their own interests over the overall good, without having to maximize impartially.

   4. Railton's Sophisticated/Indirect Consequentialism: Be an objective consequentialist but recognize that the best way to maximize the good might be to not always think consequentially (e.g., having personal relationships and projects that indirectly promote the good).

   5. Murphy's Compliance Condition: What one is required to sacrifice depends on the level of compliance by others. In a non-ideal world with low compliance, one is not required to pick up the slack for everyone else.

   6. The "Bite the Bullet" Approach (Singer, Unger): Accept that consequentialism is demanding and that we are indeed required to make significant sacrifices. The objection is not a flaw but a reflection of our moral failure.

   Other major approaches:

   7. Motive Consequentialism (Adams): The right action is the one that would be done by someone with the motives that would have best consequences. This might lead to having motives that allow for partiality.

   8. Global Consequentialism (Pettit, Smith): Evaluate everything (acts, rules, motives, etc.) by their consequences, and then choose the best combination. This might allow for a package that is less demanding.

   9. Two-Level Consequentialism (Hare): Use intuitive rules for everyday decisions and critical thinking for tough ones. The intuitive rules might be less demanding.

