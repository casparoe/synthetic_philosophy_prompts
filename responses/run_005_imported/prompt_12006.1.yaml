prompt: |-
  so we've been doing the frege-geach problem in my metaethics seminar (you know, the 'if lying is wrong then getting your little brother to lie is wrong, lying is wrong, therefore...' argument, and how expressivists have to explain why that's valid when 'wrong' only expresses disapproval instead of stating a fact). two people in my discussion group got into it after class and I honestly can't tell who won.

  Leah said Gibbard's whole hyperplan move is basically a con: saying the conditional expresses 'ruling out' the combo where you disapprove of lying but don't disapprove of getting your brother to lie doesn't explain why that combo is inconsistent, it just names it and calls the naming a solution. Owen said thats not fair -- cognitivists don't explain why P and not-P can't both be true either, consistency has to bottom out somewhere on any theory, so expressivism isnt worse off. Leah said fine, but look at what the bottoming-out actually requires here: to validate modus ponens for every complex sentence you need something that behaves exactly like possible worlds -- worlds paired with a hyperplan, closed under the same boolean structure, with 'ruled out' doing the job 'false at' does for a cognitivist. That's not bottoming out the same way, that's importing the cognitivist's machinery and slapping a new label on it. Owen said the machinery looks the same on paper but isn't doing the same job, because hyperplans are individuated by motivational role rather than representational content, which is exactly why the view can predict things truth-conditional semantics can't, like two people disagreeing morally without disagreeing about any fact.

  Can you go through their exchange move by move and say who's got the better of it at each stage (and where each one has a genuine point, not just an overall winner)? Also say if there's something important both of them are missing.
reasoning: |-
  Okay, the user is asking about a debate between Leah and Owen regarding the Frege-Geach problem and Gibbard's solution. Let me start by understanding the core issue. The Frege-Geach problem challenges expressivists to explain how moral sentences work in logical arguments, like modus ponens, when they express attitudes rather than stating facts. Gibbard's solution uses hyperplans, which are complete plans for what to do in any situation, to provide a formal structure similar to possible worlds.

  Leah argues that Gibbard's hyperplans are just a disguised version of cognitivist machinery. She claims that using hyperplans to define inconsistency doesn't solve the problem but merely relabels it. Owen counters by pointing out that all theories have foundational elements, like the principle that P and not-P can't both be true. He emphasizes that hyperplans are based on motivational roles, not truth conditions, allowing expressivists to explain moral disagreement without factual differences.

  The user wants a move-by-move analysis of their exchange, identifying who has the better point at each stage and any missed elements. I need to break down their arguments step by step. 

  First, Leah's initial point: calling the combination of attitudes "ruled out" doesn't explain why they're inconsistent. This is valid because expressivists need to ground why certain attitude combinations are incoherent. Owen's response is strong here because he notes that cognitivists also take logical consistency as basic. Both theories have primitives, so expressivism isn't uniquely problematic.

  Then Leah argues that hyperplans mimic possible worlds, importing cognitivist structures. Her point highlights the structural similarity, which might undermine expressivism's claim to be fundamentally different. Owen's rebuttal about hyperplans being motivationally individuated is crucial. If hyperplans are defined by practical roles, they serve a different purpose than truth-conditional worlds, which could explain disagreements without factual differences.

  Both might be missing deeper issues. For example, the challenge of propositional attitudes beyond simple disapproval, like believing that lying is wrong. Also, the internal structure of hyperplans and their psychological reality. The user's seminar context suggests they need clarity on whether expressivism's formal approach genuinely resolves Frege-Geach or just postpones the problem.

  I should assess each move, noting where Leah's structural concerns are valid but Owen's functional distinctions hold weight. The key is whether the formal apparatus does explanatory work unique to expressivism or merely replicates cognitivism. Highlighting the disagreement point about motivational roles versus truth conditions is essential. Also, pointing out that both might overlook the need to explain the source of inconsistency in attitudes or deeper metaphysical commitments.
answer: |-
  Here's a breakdown of Leah and Owen's exchange, analyzing each move and identifying genuine points, potential weaknesses, and who might have the better hand at each stage:

  **The Core Dispute:** Does Gibbard's hyperplan solution to the Frege-Geach problem successfully explain logical validity for moral sentences within expressivism, or does it merely *mimic* cognitivist truth-conditional semantics without providing a genuinely expressivist foundation?

  **Move 1: Leah's Initial Challenge (The "Con")**
  *   **Leah:** "Gibbard's hyperplan move is a con. Saying the conditional expresses 'ruling out' the combo (disapprove lying but don't disapprove brother-lying) doesn't *explain why* that combo is inconsistent. It just *names* the inconsistency and calls the naming a solution."
  *   **Genuine Point:** Leah is correct that Gibbard's formalism *defines* inconsistency (ruling out) within the hyperplan framework. It doesn't provide a *further, independent explanation* of *why* that particular combination of attitudes is incoherent or inconsistent *from the expressivist perspective itself*. It posits a structure (hyperplans) and defines consistency relative to that structure.
  *   **Potential Weakness:** She implies an explanation is *needed* beyond the formal structure. But is it? Cognitivists also have primitive notions.
  *   **Who Has the Better?** Leah scores a hit. She highlights a potential explanatory gap at the very foundation of Gibbard's solution. Expressivists *do* owe an account of why certain attitude combinations are "ruled out" or inconsistent, and the hyperplan formalism itself doesn't provide that deeper story; it relies on it.

  **Move 2: Owen's Defense (Bottoming Out)**
  *   **Owen:** "That's unfair. Cognitivists don't explain why P and not-P can't both be true either! Consistency has to bottom out somewhere on any theory. Expressivism isn't worse off."
  *   **Genuine Point:** Owen is absolutely right that *any* semantic theory has primitive notions it takes for granted. Cognitivists take classical logic (P and ~P cannot both be true) and truth-conditions as foundational. They don't (and arguably can't) "explain" the law of non-contradiction itself within the theory; it's a starting point. Expressivism is entitled to its own primitives.
  *   **Who Has the Better?** Owen successfully parries Leah's initial thrust. He correctly points out that demanding an "explanation" of the most fundamental inconsistency relation might be asking too much, as *all* theories have such primitives. Expressivism isn't uniquely deficient here.

  **Move 3: Leah's Counter (Importing Machinery)**
  *   **Leah:** "Fine, but look *what* the bottoming-out actually requires: To validate modus ponens for *every* complex sentence, you need something that behaves *exactly like possible worlds* – worlds paired with hyperplan, closed under boolean structure, with 'ruled out' doing the job 'false at' does. That's not bottoming out the *same* way; it's *importing* the cognitivist's machinery and slapping a new label on it."
  *   **Genuine Point:** Leah makes a powerful structural observation. Gibbard's formalism *does* bear an uncanny resemblance to truth-conditional possible worlds semantics:
      *   **Hyperplans + World States:** Analogous to possible worlds (a world state + a complete evaluative "truth" assignment).
      *   **Ruling Out:** Analogous to "false at a world."
      *   **Closure under Boolean Operations:** The formalism ensures that complex sentences (conjunction, disjunction, negation) are evaluated compositionally based on the "ruled out" status of simpler components, mirroring truth-functional compositionality.
      *   **Validating Modus Ponens:** The system is explicitly designed to make modus ponens valid *in precisely the same formal way* as in truth-conditional semantics.
  *   **Argument:** If the *structure* and *function* are isomorphic, is this really a *distinctively expressivist* solution, or just truth-conditional semantics in disguise, with "ruled out" standing in for "false" and hyperplans standing in for truth-value assignments?
  *   **Who Has the Better?** Leah lands a significant blow. The structural similarity *is* striking and raises a deep challenge: **Has expressivism solved the problem on its own terms, or has it tacitly adopted the *framework* of cognitivism while changing the labels?** This is the core of the "collapse" or "objection from creeping minimalism" worry.

  **Move 4: Owen's Rebuttal (Different Job, Motivational Role)**
  *   **Owen:** "The machinery *looks* the same on paper but *isn't doing the same job*. Hyperplans are individuated by *motivational role* rather than *representational content*. That's *exactly* why the view can predict things truth-conditional semantics *can't*, like two people disagreeing morally without disagreeing about any descriptive fact."
  *   **Genuine Point:** Owen zeroes in on the crucial *metaphysical* and *explanatory* difference Gibbard insists upon:
      *   **Individuation:** What makes a hyperplan *that* hyperplan? Not that it correctly represents some moral reality, but that it embodies a specific, complete set of practical commitments and motivations. Its identity is tied to its *action-guiding role*.
      *   **Explanatory Target:** The formalism isn't primarily explaining how sentences *represent the world*, but how they express and relate *states of planning and motivation*. Its job is to model *practical consistency* in thought and discourse.
      *   **Distinctive Prediction:** This foundation *allows* Gibbard to explain "moral disagreement without factual disagreement" in a way standard cognitivism cannot. If disagreement is conflict in hyperplans (motivational states), not conflict over represented facts, then two people can agree on all descriptive facts (world-states) but still have conflicting hyperplans, constituting genuine moral disagreement. This *is* a unique advantage claimed by the expressivist framework.
  *   **Argument:** While the *logical structure* is similar, the *underlying nature* of the elements (hyperplans vs. truth-conditions) and the *primary purpose* of the theory (modeling practical reasoning vs. modeling representation) are fundamentally different. The similar formalism is a tool to achieve a distinct explanatory goal.
  *   **Who Has the Better?** Owen effectively counters Leah's "importing machinery" charge. He highlights the *substantive difference* in what the formalism is *about* and what it's *for*. The ability to explain non-factual moral disagreement is a strong point in favor of the view doing genuinely different work. The formalism serves expressivism's core aims.

  **Overall Assessment & What Might Be Missing:**

  *   **No Clear Knockout:** Both Leah and Owen make powerful, valid points. Leah effectively exposes the structural mimicry and the potential explanatory gap at the foundation. Owen successfully defends the need for primitives and highlights the substantive difference in the *nature* and *purpose* of the hyperplan machinery, emphasizing its unique explanatory power.
  *   **Who Slightly Edges It?** Owen's final move is very strong. The ability to explain non-factual disagreement is a major *desideratum* for expressivism, and Gibbard's framework delivers it *using* the hyperplan formalism. This suggests the formalism *is* doing distinctively expressivist work, even if it structurally resembles truth-conditional semantics. **Owen likely has the slight edge in this specific exchange** because he addresses the core motivation *for* expressivism.
  *   **Important Points Both Might Be Missing:**
      1.  **The Challenge of Propositional Attitudes:** Expressivism needs to explain not just disapproval, but *believing that lying is wrong*. How does the hyperplan formalism capture the *cognitive* aspect of moral judgment (thinking something *is* the case) that seems present, not just a planning state? Does reducing "belief" to "accepting a hyperplan" fully capture our phenomenology? (This relates to the "Problem of Creeping Minimalism" - if expressivism ends up saying moral sentences express "beliefs" about hyperplans, how is it distinct from a quirky cognitivism?).
      2.  **Internal Structure vs. Surface Form:** Leah focuses on the *formal similarity*, Owen on the *intended interpretation*. But is the hyperplan formalism *psychologically realistic*? Do ordinary speakers really have anything like complete hyperplans? Or is it just a useful fiction for formal semantics? If the latter, does it *genuinely explain* the psychology of moral reasoning or just provide a consistent notation?
      3.  **The Source of Inconsistency:** While Owen notes consistency must bottom out, the *source* of the inconsistency in attitude combinations remains somewhat mysterious. *Why* is disapproving lying but not disapproving getting your brother to lie inconsistent? Cognitivists ground inconsistency in truth/falsity and reality. Gibbard grounds it in the structure of hyperplans and the definition of "ruling out." Some argue expressivists need a deeper story about *practical* or *constitutive* rationality to explain this (e.g., why certain combinations of attitudes are inherently irrational or impossible to hold together). Both debaters somewhat gloss over this deeper justificatory challenge.
      4.  **The Complexity Cost:** Gibbard's solution is technically sophisticated but complex. Does this complexity undermine the initial appeal of expressivism as a simple, psychologically plausible account? Leah hints at this with "con," but it's not fully developed.

  **Conclusion:** The exchange brilliantly captures a central tension in assessing Gibbard's solution. Leah powerfully argues it risks mimicking cognitivism structurally without a truly expressivist foundation for logic. Owen effectively counters that the formalism serves a distinct purpose (modeling practical/motivational consistency) and enables unique explanations (non-factual disagreement), justifying its structure. Owen likely wins *this* exchange on points, primarily due to the unique explanatory advantage he highlights. However, Leah's challenge points to deeper unresolved issues about the nature of moral judgment, psychological reality, and the ultimate source of inconsistency that expressivism still needs to address. The debate highlights that Gibbard's solution is ingenious but perhaps doesn't fully *dissolve* the Frege-Geach problem; it provides a sophisticated framework *within which* expressivism can operate logically, raising new questions about the framework's foundations and interpretation.
