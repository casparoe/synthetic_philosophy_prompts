  2. **Flat deflationary line**: This is the view that there is no real paradox, just an unsurprising feature of first-order semantics.
  3. **Putnam's use**: He uses Skolem's paradox as an argument against metaphysical realism about reference and truth.
  4. **Switching to second-order logic**: Using second-order logic with full semantics to get categoricity, but at the cost of having set theory in the semantics.
  5. **Bays' rebuttal to Putnam**: Argues that Putnam's argument does not actually go through.
  6. **Set-theoretic multiverse picture (Hamkins)**: Accepts non-absoluteness as a fundamental feature and not a problem.

