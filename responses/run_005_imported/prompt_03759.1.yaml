prompt: |-
  I'm teaching a seminar on early modern political philosophy this term, and last week we got completely bogged down on a Pascal fragment I'd always just skimmed past for the famous one-liner without ever actually working out what the argument underneath it is. It's from the cluster his editors title "Justice and the Reason of Effects." In Trotter's translation (fragments 297–298 in the old Brunschvicg numbering, which most English editions still follow), it reads:

  "Veri juris.—We have it no more; if we had it, we should take conformity to the customs of a country as the rule of justice. It is here that, not finding justice, we have found force, etc.

  Justice, might.—It is right that what is just should be obeyed; it is necessary that what is strongest should be obeyed. Justice without might is helpless; might without justice is tyrannical. Justice without might is gainsaid, because there are always offenders; might without justice is condemned. We must then combine justice and might and, for this end, make what is just strong, or what is strong just. Justice is subject to dispute; might is easily recognised and is not disputed. So we cannot give might to justice, because might has gainsaid justice and has declared that it is she herself who is just. And thus, being unable to make what is just strong, we have made what is strong just."

  (Pascals own word is actually "force" — Trotter just renders it "might" throughout, for what its worth, though I don't think that changes much.)

  Here's my problem: half the seminar read this as basically Hobbesian, maybe even proto-ideology-critique — justice has no independent reality at all, it's just whatever force enforces, full stop. But a few fragments earlier, in the bit about justice flipping at the Pyrenees, Pascal says almost in passing "...there are natural laws; but good reason once corrupted has corrupted all" — which sounds like a genuinely different claim: there IS a real justice, we've just lost reliable access to it, so force rushes in to fill the gap left by our corrupted reason. Those don't seem like the same view to me at all — one is debunking justice-talk, the other is making an epistemic point while leaving justice's reality intact. Can you help me work out which of these the 297–298 passage actually commits him to? And does it matter that the whole cluster is framed around the "reason of effects" — I have a hunch that his usual three-tier move (simple people who accept customs at face value, the "semi-learned" who see through them and turn cynical, and the truly wise who circle back around to endorse them for different reasons) is supposed to tell us how to take the justice fragment, but I couldn't reconstruct the connection well enough to defend it in front of the class.
reasoning: |-
  Okay, let me unpack this professor's Pascal dilemma. They're teaching early modern political philosophy and hit a snag on Pascal's "Justice and the Reason of Effects" fragment. The class is divided between seeing it as purely Hobbesian (justice as mere might) versus an epistemic failure theory (real justice exists but we can't access it). 

  First, I need to trace Pascal's argument step by step in fragments 297-298. He starts with "Veri juris—we have it no more" - that's crucial. The Latin implies a lost true justice, which already leans toward the epistemic reading. Then his "justice without might is helpless" and "might without justice is tyrannical" sets up a chicken-and-egg problem. But when he says "we have made what is strong just," it sounds Hobbesian until you notice he frames it as a human failure ("being unable to make what is just strong").

  Hmm, the Pyrenees fragment is key context. When Pascal says natural laws exist but "good reason once corrupted has corrupted all," he's making a theological anthropology point - our postlapsarian reason can't reliably access justice. That's not Hobbes; Hobbes thinks justice literally begins with sovereignty. 

  The professor's hunch about the three-tier structure is sharp. Pascal does this in Pensées: 1) the vulgar obey custom 2) libertins mock customs as arbitrary 3) the wise see customs as necessary props for fallen humanity. So when Pascal says "we must combine justice and might," he's not endorsing might-makes-right but diagnosing our tragic compromise. 

  Wait - the "reason of effects" framing matters. For Pascal, seeing how force functions as a social stabilizer despite being unjust is part of higher wisdom. That's why he's not cynical like the semi-learned. 

  I should emphasize Pascal's Jansenism here. His view of corrupted reason isn't just skepticism; it's Augustinian. The professor might want to contrast Hobbes' materialist anthropology with Pascal's theological one. 

  For class discussion: maybe ask students why Pascal bothers calling tyranny "tyrannical" if justice is purely illusory? That exposes the flaw in the pure Hobbesian reading. The condemnation implies a lingering standard.
answer: |-
  Your seminar has hit upon the core tension in Pascal's political fragments—a tension that reflects his distinctive Augustinian-Jansenist worldview. The "Justice and the Reason of Effects" passage (especially 297–298) **commits Pascal to the *epistemic* view (corrupted reason obscures real justice)**, *not* to a Hobbesian debunking. Here's why, and why the "reason of effects" frame and three-tier structure are crucial:

  ### 1. **Decoding Fragments 297–298: The Epistemic Core**
     - **"Veri juris. We have it no more"**: The Latin *veri juris* (true law/right) signals a *lost* objective standard. Pascal doesn't say true justice *doesn't exist*; he says we *no longer possess it reliably*. This parallels his theological view of fallen human nature.
     - **Justice vs. Force**: "Justice without might is helpless" ≠ "justice is an illusion." Instead, it acknowledges that in a fallen world, abstract justice lacks efficacy. Conversely, "might without justice is tyrannical" *presupposes a real standard* by which tyranny is judged. Force without justice is *condemned* precisely because it violates true justice.
     - **The Tragic Compromise**: "We have made what is strong just" is a lament, not an endorsement. Human inability to *know* and *enforce* true justice ("being unable to make what is just strong") forces us to legitimize power. This is a pragmatic, post-lapsarian necessity, not justice’s ontological nullity.

  ### 2. **The Pyrenees Fragment & Corrupted Reason**
     - The nearby fragment (Brunschvicg 294) is decisive: "**there are natural laws; but good reason once corrupted has corrupted all.**" This anchors 297–298:  
       - **Natural laws exist** (justice is real).  
       - **Human reason is corrupted** (our access to justice is broken).  
       - **Force fills the vacuum** not because justice is unreal, but because our capacity to discern/apply it is shattered.  
     This is fundamentally *anti*-Hobbesian. For Hobbes, justice *originates* with sovereign power (*Leviathan*, Ch. 15). For Pascal, justice *precedes* power but is obscured by sin.

  ### 3. **The "Reason of Effects" Framework: How to Read Custom**
     Pascal’s "reason of effects" (which Trotter translates poorly as "reason of effects" – better: "the *logic* of outcomes/consequences") examines why social phenomena (like customs) *work* despite flawed origins. This is where the three-tier structure applies:  
     - **The Simple (Vulgar)**: Obey customs uncritically, believing them inherently just.  
     - **The Semi-Learned (Libertins/Cynics)**: See customs as arbitrary impositions of force, dismissing justice as illusion.  
     - **The Truly Wise**: Recognize that customs are *not* inherently just, but serve a vital function: they stabilize fallen society by masking our epistemic failure. Force *becomes* "just" *not* because might makes right, but because order (however imperfect) is preferable to chaos in a broken world.  

     **Applied to Justice/Force**:  
     - The cynics (your Hobbesian seminarians) stop at tier two: "justice is just force."  
     - Pascal operates at tier three: Yes, force *masquerades* as justice out of necessity, but this is a *consequence* of corruption, not justice’s nonexistence. The "condemnation" of tyranny implies a higher, knowable standard.

  ### 4. **Why This Matters for Your Seminar**
     - **Theological Anthropology**: Pascal’s view hinges on the Fall. Corrupted reason ≠ reason’s total incapacity; it means we see "through a glass darkly." We retain *enough* reason to recognize tyranny’s injustice but not enough to rebuild true justice.  
     - **Political Realism vs. Nihilism**: Pascal is a realist (force is necessary) but not a nihilist (justice remains a transcendent standard). Compare to Montaigne’s skepticism (customs are arbitrary but unavoidable) or Hobbes’ positivism (justice *is* command).  
     - **Pedagogical Hook**: Ask students: *Why does Pascal call tyranny "tyrannical" if justice is purely illusory?* The condemnation implies a residual knowledge of true justice—consistent with Romans 2:15 (law "written on the heart"), a key Jansenist proof-text.

  ### Key Takeaway for Class Discussion
  Pascal’s argument is **epistemic, not ontological**:  
  - **Justice exists** but is inaccessible due to corrupted reason (per the Pyrenees).  
  - **Force dominates** as a tragic necessity in a fallen world.  
  - **"Might made just"** is a diagnostic of human failure, not a definition of justice.  

  The "reason of effects" frame elevates this: the wise see force’s *function* (preventing anarchy) without mistaking it for justice. This lets Pascal critique tyranny while acknowledging force’s role—a nuanced middle path between naïveté and cynicism. For further reading, pair this with fragments on the "wager" (uncertainty demanding pragmatic action) and "two orders" (earthly power vs. divine justice).
