  Okay, the user is a PhD student in philosophy, specifically in social ontology, and they've been part of a reading group on David Lewis's *Convention*. The disagreement between Nadia and Elias about whether queueing qualifies as a Lewisian convention is what they want adjudicated. 

  First, I need to recall Lewis's definition thoroughly. His conventions are solutions to coordination problems where multiple equilibria exist, and the solution is arbitrary, self-perpetuating through mutual expectations, and maintains a predominant coincidence of interest. 

  Nadia's argument (1) seems strong on the surface: queueing is arbitrary, expectation-driven, and would collapse without compliance. But Elias counters (2) by pointing out that queue-jumping offers a unilateral incentive to defect, which challenges the coordination equilibrium requirement. 

  Hmm, Nadia's reply (3) about private incentives in other conventions like meeting places or language is valid. Lewis does allow some conflict as long as coincidence of interest predominates. But Elias's distinction (4) feels sharper—queue-jumping isn't about preferring a different equilibrium but defecting from any queueing equilibrium entirely. That aligns with theorists like Ullmann-Margalit who separate sanction-backed norms. 

  Nadia's final point (5) about sanctions stabilizing fragile equilibria is clever. But is she conflating two different structures? Lewisian conventions shouldn't *need* sanctions; their stability comes from mutual responsiveness. If sanctions are essential, it might be a different beast. 

  The user might be overlooking that Lewis's definition is narrower than how "convention" is used colloquially. Queueing seems more like a norm sustained by sanctions and moral expectations (like fairness), not pure coordination. Also, the "arbitrariness" of queueing is debatable—is it truly arbitrary when efficiency/fairness underpins it? 

  For the verdict: Elias is closer to Lewis. Queueing requires punishment to sustain, so it doesn't fit the coordination-equilibrium mold. But both miss that Lewis's theory might not cover all social practices neatly—hybrid cases exist. The user could explore this gap in their PhD work.
answer: |-
  Here's a move-by-move adjudication based on Lewis's *Convention*, followed by a verdict and overlooked aspects:

  ### Move-by-Move Analysis
  1.  **Nadia's Opening (Queueing as Paradigm Case):**
      *   **Lewisian Accuracy:** Mostly correct. Queueing *is* arbitrary (other orders are possible), relies on expectations, and unravels if expectations collapse – fitting Lewis's core structure (Ch. I).  
      *   **Dialectical Success:** Strong opening. She correctly identifies key features aligning with Lewis (arbitrariness, expectation-dependence).  
      *   **Weakness:** Underplays the centrality of the **coordination equilibrium** requirement in Lewis's *definition*.

  2.  **Elias's Objection (Not a Coordination Equilibrium):**
      *   **Lewisian Accuracy:** **Crucially Correct.** Lewis defines a convention as a regularity in behavior that is a solution to a *recurring coordination problem* (Ch. I). A coordination problem requires that the solution be a **coordination equilibrium**: a combination of actions where *no one would have been better off had any one agent alone acted differently, given the others' actions* (p. 14). Elias correctly identifies that the queue-jumper *is* better off by defecting unilaterally, regardless of others' actions. "Everyone queues" fails this definitional test.
      *   **Dialectical Success:** Very strong. He directly challenges the foundational requirement Nadia assumed was satisfied. His appeal to sanction necessity highlights the instability without enforcement.
      *   **Weakness:** Slightly overstates the "always better off" – potential social costs (glare/confrontation) *might* sometimes make jumping worse, but the *structural incentive* remains.

  3.  **Nadia's Reply (Private Incentives in Paradigms):**
      *   **Lewisian Accuracy:** **Partially Correct, but Misapplied.** Lewis *does* allow for "mixed-motive" situations where conflict exists *alongside* coordination (pp. 24-25, 92-96). He states conventions require a *"predominant coincidence of interest"*, not its *"perfection"* (p. 25). Her examples (preferring another meeting spot, lying in language) are valid instances of this.
      *   **Dialectical Success:** Moderately successful. She correctly counters Elias's potential absolutism about conflict disqualifying conventions. She shows conflict can exist within a coordination framework.
      *   **Weakness:** **Misses Elias's Core Distinction.** The conflict in her examples is *about the equilibrium itself* (which meeting spot?) or *within the equilibrium* (using language to lie). Elias's point is that queue-jumping is a conflict *with the very structure of the equilibrium solution*, an incentive to *destroy* the coordination pattern itself, not just prefer a different one or misuse it. This is a qualitatively different type of conflict.

  4.  **Elias's Rebuttal (Type of Conflict Differs):**
      *   **Lewisian Accuracy:** **Highly Accurate Distinction.** Elias pinpoints the key difference. Lewisian conventions solve problems where *multiple coordination equilibria exist* (e.g., drive left/right, meet at A/B). The conflict Nadia cites is inherent *in choosing or utilizing* these equilibria. Elias argues queueing lacks the fundamental property of being *any* coordination equilibrium because the incentive to defect *from the pattern itself* is structural and unilateral. His reference to Ullmann-Margalit (who distinguishes coordination norms from "prisoners' dilemma" or sanction-based norms) is apt.
      *   **Dialectical Success:** Strong. He successfully differentiates the *type* of conflict, showing Nadia's analogy doesn't hold. He reframes queueing as requiring sanctions precisely because it fails the coordination equilibrium test.
      *   **Weakness:** None major dialectically. He solidly grounds his distinction in Lewis's framework.

  5.  **Nadia's Rejoinder (Sanctions as Stabilizers):**
      *   **Lewisian Accuracy:** **Problematic.** While sanctions *can* support conventions (Lewis mentions this, p. 97), they are **not constitutive** of Lewisian conventions. The core stability mechanism is the *self-perpetuating nature of the coordination equilibrium* via expectations. If sanctions become *essential* for stability because the underlying structure isn't a coordination equilibrium, then it likely falls outside Lewis's core definition. Lewis sees sanctions as auxiliary or indicative of other norm types.
      *   **Dialectical Success:** Weak. It doesn't address Elias's fundamental point about the lack of a coordination equilibrium. She shifts focus to stability mechanisms without confronting the definitional requirement. Her point about arbitrariness/precedent/common knowledge, while true of queueing, doesn't override the missing coordination equilibrium.
      *   **Weakness:** Conflates necessary conditions. Arbitrariness, precedent, and common knowledge are necessary but *not sufficient* for a Lewis convention; the coordination equilibrium is definitionally central.

  ### Final Verdict: Is Queueing a Lewis Convention?
  Based on the arguments presented and Lewis's definition, **Elias has the stronger case. Queueing, as described, does NOT satisfy Lewis's definition of a convention.**

  *   **Reason:** The core requirement of a **coordination equilibrium** is not met. "Everyone queues" is not a state where no single individual could be better off by unilaterally acting differently (i.e., jumping the queue). The structural incentive to defect is inherent and unilateral, making it fundamentally different from driving on the left/right or meeting at a landmark. Sanctions (glaring, confrontation) are necessary *because* the underlying game lacks a coordination equilibrium. This aligns it more with Ullmann-Margalit's category of norms solving PD-like problems via sanctions.

  ### What Both Might Be Overlooking
  1.  **The "Game" Definition Matters:** Lewis emphasizes that conventions solve *recurring* coordination problems. The disagreement partly hinges on how the "queueing game" is formally modeled:
      *   **Nadia's Implicit Model:** A pure coordination game with multiple equilibria (queue-order, lottery-order, need-order, etc.). Queueing is one arbitrary solution.
      *   **Elias's Implicit Model:** A game with a strong unilateral incentive to defect from any orderly queuing pattern (like a PD or Hawk-Dove variant), requiring sanctions.
      Elias's model better reflects the persistent temptation to jump the queue observed in reality.

  2.  **Moral/Fairness Elements:** Queueing often incorporates strong norms of fairness ("first come, first served"). Lewisian conventions are typically seen as *amoral* solutions to coordination problems. The fairness aspect might make queueing feel more like a moral norm (supported by sanctions for unfairness) than a pure coordination convention. Both debaters underplay this potential normative dimension distinct from pure coordination or sanction-based deterrence.

  3.  **Hybrid Cases & Lewis's Scope:** Lewis's definition is precise but potentially narrow. Many real-world practices might exhibit *elements* of coordination alongside sanction-based enforcement. Nadia intuitively grasps this hybrid nature, but Lewis's framework prioritizes the underlying game structure. Elias is stricter on the definition but might be accused of overlooking nuances in how practices evolve (e.g., a coordination norm might develop sanctioning mechanisms over time).

  4.  **"Would" vs. "Could":** Lewis requires that agents *would not* prefer to have acted differently, not just that they *could not* be better off *if* they acted differently *and others magically didn't react*. Elias focuses on the hypothetical "could be better off by defecting *holding others' actions fixed*." Nadia focuses on the actual "would not prefer to defect *given the likely sanctions/reactions*." Lewis's definition requires the former (coordination equilibrium) as the foundation; the latter (sanctions) is supplementary evidence but doesn't create the equilibrium.

  **In Conclusion:** Elias correctly identifies the failure to meet the coordination equilibrium requirement as the fatal flaw for classifying queueing as a Lewis convention. While Nadia highlights important features shared with conventions, she doesn't overcome this core definitional hurdle. The necessity of sanctions points to a different kind of norm, likely rooted in solving a conflictual rather than a pure coordination problem.
