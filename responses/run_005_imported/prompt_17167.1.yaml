  The current incoherence undermines the market's integrity by allowing risk-free profits. The coherence patch will restore internal consistency in the tool's outputs, closing the arbitrage loophole. We will implement the patch using a minimally invasive method (e.g., projecting to the closest coherent probabilities) to preserve the tool's predictive signals as much as possible.

  **Addressing Objections:**  
  1. **Objection: The patch dresses up a potentially bad model.**  
     We acknowledge that the incoherence may indicate model issues. Therefore, alongside deploying the patch, we will immediately begin an investigation into the tool's forecasting quality (calibration, accuracy, and root cause of the incoherence). The results will guide further model improvements. This avoids the disruption of suspending the tool (Option b) while still addressing quality concerns.

