prompt: |-
  I'm teaching a formal epistemology seminar this term, and a couple weeks back we covered I.J. Good's old result from that tiny 1967 paper — the one that says a Bayesian expected-utility maximizer should always be willing to look at a costless, relevant experiment before acting, since whatever it tells you, you can always just ignore it and do what you would've done anyway, so looking can never lower your expected payoff and sometimes raises it. Two of my students, Naomi and Felix, got into a real arguement about this after class and it apparently rolled on by email for days; they eventually cc'd me on the thread asking me to settle it, but honestly I'd rather hear from someone who wasn't in the room and doesn't already have a side.

  Here's roughly how it went:

  (1) Naomi said the theorem shows that all the familiar talk about "rational ignorance" is confused — people who don't want to know their genetic test results, or the sex of their baby, or how a game they recorded turns out, are just making a mistake, because if the information is free, a perfectly rational agent should always take it: worst case, you ignore it.

  (2) Felix said that can't be right. Take a disease with no available treatment either way: learning you'll get it doesn't change a single thing you'll ever do, but it could make you miserable for the next thirty years. That's a real cost that has nothing to do with which action you end up choosing, so the theorem can't be telling people to always look.

  (3) Naomi answered that this isn't a counterexample, just an incompletely specified decision problem: if knowing something makes your life worse, that badness is an outcome like any other and belongs inside your utility function; once it's properly in there, the theorem still holds — it will just correctly tell you not to look whenever looking is genuinely bad for you overall. Nothing here actually breaks Good's result.

  (4) Felix replied that Naomi was quietly rewriting the theorem to save it. The whole proof works by letting you fall back on whatever act you'd have chosen anyway, so looking is like a free option on your future choices — but if merely knowing something is bad for you independant of which act you end up choosing, that fallback doesn't protect you, because you can ignore a result when picking an action, but you can't unknow it. So either the theorem just doesn't cover cases like this, or it only holds in a sense too thin to support what Naomi said at the start.

  (5) Naomi conceded that once the sheer fact of knowing carries its own cost, separate from any action, you've left the tidy setup the proof assumes — but said this only shows genuinely free information is rarer than people assume, not that the theorem is wrong wherever its conditions really are met.

  (6) Felix wasn't satisfied, and raised a second kind of case: a poker player, or someone haggling over a used car, can be better off not knowing some fact simply because not knowing makes their behavior harder for the other side to read or exploit — and that has nothing to do with anxiety or a mis-specified utility function, it's about what other agents can infer and do in response. He said Good's theorem is a single-decision-maker result and just has nothing to say about cases like that, so its reach is much narrower than "information is never bad" suggests, and Naomi's original claim was still too strong even granting her fix in (5).

  That's basically where they left it (the bar closed, not their friendship). Could you go through moves (1) through (6) and say, for each, whether the point being made is basically right, overstated, or off base, and why — engage with the actual logic of Good's proof, not just the surface plausibility of the claim. Then give me an overall verdict: how much of Naomi's opening claim survives the whole exchange, and is there anything important neither of them raised? Close with a line starting "Bottom line:" that sums up your view in a sentence or two.
reasoning: |-
  We are discussing I.J. Good's result that a Bayesian expected-utility maximizer should always be willing to look at a costless, relevant experiment. The debate between Naomi and Felix raises important points about the scope and interpretation of the theorem.

  Let's break down each move and evaluate it in light of Good's proof and the structure of the decision problem.

  ### (1) Naomi's initial claim:
  Naomi says the theorem shows that "rational ignorance" is confused because worst case you can ignore the information and do what you would have done anyway. Thus, information is never bad and sometimes good.

  **Evaluation:** This is an accurate summary of Good's result in the context of a single decision-maker with a fixed set of actions and a utility function that depends only on the state and the chosen action. The proof relies on the fact that, by conditioning on the outcome of the experiment, the agent can choose an action that is at least as good as the one they would have chosen without the experiment. Therefore, the expected utility with the experiment is at least as high as without.

  However, Naomi's claim that "all the familiar talk about 'rational ignorance' is confused" might be overstated because the theorem assumes a specific setting. Real-world cases of rational ignorance often involve factors outside this setting, such as psychological costs or strategic interactions.

  ### (2) Felix's counterexample:
  Felix presents a disease with no treatment: learning you have it causes misery without changing actions, so it's bad to look.

  **Evaluation:** This is a valid challenge. Good's proof assumes that the utility function depends only on the state of the world and the action taken. If the act of knowing itself affects utility (e.g., through anxiety), then we are outside the original setup. In the original theorem, utility is a function of the state and action, not of the agent's knowledge state. Therefore, Felix correctly points out that if there is a cost to knowing, the theorem's conditions are violated.

  ### (3) Naomi's response:
  Naomi argues that the badness of knowing should be incorporated into the utility function. Once done, the theorem still holds and may tell you not to look if looking is bad.

  **Evaluation:** This is a standard move in decision theory. We can model the agent's knowledge state as part of the state of the world. Specifically, we can expand the state space to include the agent's epistemic state. Then, the utility function can assign lower utility to states where the agent knows they have the disease, even if the physical state (having the disease) is the same. With this expanded state space and a utility function that accounts for the psychological cost, Good's theorem would indeed apply: if the experiment (learning the test result) is costless, then the agent should take it because they can always ignore it (by not changing their action) and if they do, they would be in the same epistemic state as before? Wait, not exactly: if they look and then ignore, they still know the result. So the act of looking changes the state (by changing what they know).

  But note: if we model the state space appropriately, then the utility function would reflect the disutility of knowing. Then, without the test, the agent does not know and thus has a certain utility. With the test, they know and that might lower utility. However, the theorem still says that the expected utility of looking and then choosing optimally (which might include ignoring the information in terms of action) is at least as high as not looking? Not necessarily, because the disutility of knowing might dominate.

  Actually, in the expanded model, we have:

  - States: include both the physical state (e.g., disease present or absent) and the agent's knowledge state (which can be "ignorant" or "knows they have it", etc.).

  But note that the experiment (looking) changes the knowledge state. So we are in a dynamic setting. Good's theorem is about a single decision to acquire information and then act. We can still apply it.

  Let:
  - Without looking, the agent chooses an action a (which might be the same regardless of the disease, since no treatment). The utility without looking is U(ignorant, a, physical state) but note that the agent doesn't know the physical state, so they get the expected utility.

  - With looking, the agent learns the physical state and then chooses an action. But the utility now includes the disutility of knowing. So if they learn they have the disease, their utility will be lower than if they were ignorant and had the disease.

  So the expected utility of looking might be lower than not looking because of the disutility of knowing.

  But then, the theorem would say: if the information is free and relevant (which it might not be, because there's no action to change), then the agent should look? But in this case, the information is not free: it comes with a psychological cost. So we must model that cost.

  Naomi is right that we can incorporate the cost into the utility function. Then, the theorem will correctly tell us that looking is not always good. In fact, if the disutility of knowing is high enough, the expected utility of looking will be lower than not looking. So the theorem does not say "always look" in this case. It says: look only if the expected utility of looking (which includes the potential disutility of knowing) is at least as high as not looking.

  Therefore, Naomi's point is valid: the theorem holds once we properly specify the utility function to include all relevant consequences.

  ### (4) Felix's rebuttal:
  Felix argues that Naomi is rewriting the theorem. The proof relies on the fallback option (ignoring the information and doing the same action) but if knowing itself is bad, then that fallback doesn't protect you because you can't unknow.

  **Evaluation:** This is a good point. The original proof assumes that the only effect of the experiment is to provide information that can be used to choose an action. If the experiment itself changes the state (by changing what you know) and that change affects utility, then the fallback of doing the same action does not leave you in the same situation: you now know the result, which might be bad. Therefore, the original proof does not cover this because it assumes that the utility is a function of the state and action only, and does not depend on the information structure.

  However, as Naomi suggests, we can extend the model to account for this. The theorem is robust to including the knowledge state in the state description and the utility function. So the theorem still applies, but now we see that the information is not free: it has a cost (the disutility of knowing) and that cost might make looking undesirable.

  So Felix is right that the original proof doesn't account for such costs, but Naomi is right that the theorem can be saved by a more comprehensive utility function.

  ### (5) Naomi's concession:
  Naomi concedes that when knowing carries a separate cost, we are outside the original setup. But she says this only shows free information is rarer.

  **Evaluation:** This is a fair point. The theorem requires that the information is costless and that the utility function does not depend on the information structure per se. So in cases where there is a psychological cost, the information is not free. Therefore, the theorem still holds in its domain, but that domain is more restricted than one might have thought.

  ### (6) Felix's second counterexample:
  Felix raises a strategic setting: in poker or haggling, not knowing something can make your behavior harder to read, so you might be better off not knowing.

  **Evaluation:** This is a very important point. Good's theorem is for a single decision-maker against nature. In strategic settings (games with multiple agents), information can be a liability because it might affect other players' actions. The theorem does not cover such cases. In fact, in game theory, there are many examples where having more information can be detrimental because it can lead to exploitation (e.g., in signaling games).

  Therefore, Felix is correct that the theorem has limited reach in strategic contexts.

  ### Overall Verdict:
  - Naomi's initial claim (1) is overstated because it ignores the conditions of the theorem (no cost to knowing, and no strategic considerations). The theorem does not show that rational ignorance is always a mistake; it shows that in a non-strategic setting without psychological costs, it is a mistake.

  - Felix's counterexamples are valid: (2) shows that psychological costs can make information undesirable, and (6) shows that strategic considerations can also make information undesirable.

  - However, Naomi is correct in (3) and (5) that the theorem can be extended to include psychological costs by incorporating them into the utility function, but then the information is no longer free. In the strategic case, the theorem simply doesn't apply.

  How much of Naomi's opening claim survives?
  - The core of the theorem survives: in a single-agent decision problem without any cost (monetary, psychological, or otherwise) to acquiring information, and where the utility depends only on the state and the chosen action, the agent should always be willing to acquire costless, relevant information.

  But note that in the disease example, if we model the psychological cost, then the information is not costless. So the theorem would say: if the information is truly costless (including no psychological cost) and the setting is non-strategic, then you should take it.

  However, in the real world, information often has hidden costs (like anxiety) or strategic implications. So the practical reach of the theorem is limited.

  ### Something important they missed?
  They have covered psychological costs and strategic settings. Another important aspect is computational costs or bounded rationality: processing information might be costly or lead to errors. But that is beyond the original theorem.

  Also, note that the theorem assumes that the agent updates beliefs via Bayes' rule. If the agent is not a perfect Bayesian, then the result might not hold.

  ### Bottom line:
  The theorem correctly establishes that in a single-agent, costless-information setting without psychological or strategic spillovers, information is never harmful and can be beneficial, but real-world cases of rational ignorance often involve psychological costs, strategic considerations, or hidden costs that take us beyond this idealized setting.
answer: |-
  Let's break down the debate step by step, engaging directly with Good's theorem and its assumptions. The theorem (from Good's 1967 paper) proves that for a Bayesian expected-utility maximizer, acquiring costless, relevant information (an "experiment") is never harmful and can be beneficial. The core argument is that after seeing the experiment's outcome, the agent can always choose the action they would have taken without the experiment (the "fallback" option), so the worst-case scenario is indifference, while better outcomes might improve expected utility.

  ### Analysis of Each Move
  **(1) Naomi's opening claim (rational ignorance is confused)**  
  **Verdict: Overstated, but directionally correct within the theorem's strict assumptions.**  
  Naomi is right that Good's theorem *formally* shows that in a standard Bayesian decision problem (single agent, no exogenous costs, utility depends only on state and action), rational agents should never refuse free, relevant information. The "ignore it" fallback guarantees no harm. However, calling all real-world "rational ignorance" a "mistake" overreaches. The theorem assumes a sanitized setup where information acquisition has *no side effects* (e.g., no psychological or strategic consequences). Many real-world cases of rational ignorance (e.g., avoiding genetic tests) involve such side effects, which violate the theorem's assumptions. Naomi's claim ignores these boundary conditions.

  **(2) Felix's counterexample (untreatable disease)**  
  **Verdict: Basically right, and exposes a key limitation.**  
  Felix correctly identifies that Good's theorem assumes utility depends *only* on the state of the world and the chosen action. In his example, merely *knowing* the disease state (regardless of action) directly affects utility through psychological misery. This "utility of belief" is excluded from the theorem's setup. The fallback option ("ignore the information and act as before") doesn't help because you cannot "unknow" the result—the disutility from knowledge persists independently of actions. This breaks the theorem's indifference guarantee: learning you have the disease *lowers* utility even if you take no new action. The theorem doesn't cover this.

  **(3) Naomi's response (incorporate badness into utility)**  
  **Verdict: Basically right, but requires reframing the problem.**  
  Naomi is correct that Felix's case isn't a counterexample to Good's *math* but a violation of its *assumptions*. If psychological costs are modeled as part of the outcome—expanding the state space to include the agent's epistemic state (e.g., "disease present + knows it" vs. "disease present + ignorant") and defining utility accordingly—the theorem still holds. With this expanded utility function, "looking" may now have negative expected utility (e.g., high risk of misery outweighing any benefit), and the theorem would rightly advise against it. This isn't "rewriting" the theorem; it's applying it to a more comprehensive decision problem. Good's proof is robust to utility functions that include belief-dependent components, as long as all consequences are properly specified.

  **(4) Felix's rebuttal (fallback doesn't protect against knowing)**  
  **Verdict: Overstated, but highlights a nuance.**  
  Felix is right that the fallback option ("ignore and act as before") doesn't mitigate utility losses from *merely knowing* because knowledge itself changes the epistemic state. However, this doesn't invalidate the theorem—it shows that Felix's disease example *isn't a costless experiment* under the original utility specification. Once utility incorporates belief-dependent costs (as Naomi suggests), the experiment is no longer "free," so the theorem doesn't mandate taking it. The proof's mechanism (fallback guaranteeing no loss) still works *if* utility depends only on actions and states. But if utility includes knowledge states, the "experiment" changes the state space, so the indifference guarantee requires careful reinterpretation. Felix's point is valid as a boundary warning, not a disproof.

  **(5) Naomi's concession (free information is rarer)**  
  **Verdict: Basically right, and crucial context.**  
  Naomi correctly concedes that when knowledge carries intrinsic costs, Good's setup isn't directly applicable. This is a necessary clarification: the theorem requires information to be truly costless *in utility terms*. Real-world cases like genetic testing often have psychological costs, so information isn't "free." The theorem isn't "wrong"; it simply doesn't apply to these cases without utility adjustments. This refines Naomi's initial claim but preserves the theorem's core validity within its domain.

  **(6) Felix's second counterexample (strategic interactions)**  
  **Verdict: Basically right, and identifies a major limitation.**  
  Felix is correct that Good's theorem is a single-agent result and fails in strategic contexts (e.g., poker, bargaining). In multi-agent settings, information can be harmful because opponents observe actions and adjust strategies. Not knowing your hand might make your bluff more credible, improving expected utility. Good's proof relies on the agent being a passive observer of nature; it doesn't account for other agents adapting to your knowledge or actions. This is a fundamental gap, not fixable by tweaking utility functions. The theorem "has nothing to say" here, and Naomi's original claim is indeed too strong if generalized to strategic games.

  ### Overall Verdict
  Naomi's opening claim—that rational agents should always take costless information—survives only in a highly restricted form: **for non-strategic, single-agent decisions where information has no exogenous costs (psychological, social, or otherwise) and utility depends solely on states and actions.** Felix successfully exposed two critical limitations:  
  - **Belief-dependent utility** (e.g., psychological costs): Makes information non-costless, so the theorem may advise against acquiring it.  
  - **Strategic interactions** (e.g., games): Renders the theorem inapplicable, as information can alter opponents' behavior.  

  Neither student raised **computational or cognitive costs** (e.g., processing information drains attention, leading to worse decisions). This is another real-world factor violating "costless" information.  

  **Bottom line:** Good's theorem is watertight within its narrow, idealized assumptions, but its practical scope is limited; rational ignorance often persists because real-world information acquisition frequently induces psychological costs, enables strategic exploitation, or incurs hidden cognitive burdens—all beyond the theorem's reach.
