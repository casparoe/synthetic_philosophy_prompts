prompt: |-
  Ok, this has been bugging me for a while: I keep seeing Kavka's toxin puzzle and Parfit's hitchiker treated like they're basically the same puzzle, and I don't think that's right. Both have that same "you get rewarded now for a disposition you'll have zero reason to actually act on later" shape -- pay the driver once you're already safe in town, drink the toxin once the million's already wired to your account. For the hitchiker, the standard LW-brained move is that you just have to actually be the type of agent who pays, since that's the whole reason the driver picked you up in the first place (subjunctive dependence, FDT-ish reasoning). Does that same move force a committed FDT/UDT agent to literally drink the toxin the next day, or is there a real structural disanalogy that lets you bank the million without ever following through? Genuinely want a careful comparison here, not just another "both are newcomblike" hand-wave -- I want to know exactly where, if anywhere, the analogy actually breaks down.
