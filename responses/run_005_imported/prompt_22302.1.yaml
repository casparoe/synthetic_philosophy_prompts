  Situationists like Doris use empirical data to challenge the existence of stable character traits. But Aristotle's virtue ethics isn't primarily empirical; it's normative. He sets an ideal. The debate might be talking past each other because situationists target descriptive psychology, while Aristotle is prescribing what virtue should be.

