  We are ranking six replies to Max Black's two-spheres thought experiment. The goal is to assess how successfully each resolves the tension created by the case against Leibniz's principle of the identity of indiscernibles. The ranking should be from S (best) to D (worst) and include a brief explanation for each.

  Recall the scenario: two identical spheres in an otherwise empty universe, separated by a fixed distance. The principle of the identity of indiscernibles (PII) says that if two things share all properties, they are identical (i.e., not two). Black uses this to argue against PII because we can conceive of two distinct yet indiscernible spheres.

  The replies:

  1. **Hacking's redescription**: Change the spatial topology so that what appears to be two spheres is actually one sphere with two paths to it. This eliminates the two objects.

  2. **Primitive thisness (Adams)**: Accept that the spheres share all qualitative properties but have a non-qualitative "haecceity" or "thisness" that makes them distinct.

  3. **Weak discernibility (Saunders)**: Argue that the spheres are discerned by an irreflexive relation (e.g., "is at a distance D from") which they bear to each other but not to themselves. This allows a relaxed version of PII.

  4. **Twenty spheres (Della Rocca)**: Extend the case to 20 spheres. If we are uncomfortable with brute numerical difference in the 20-sphere case, then we should be in the two-sphere case too, so PII holds.

  5. **Biting the bullet on "two"**: Deny that there are two spheres. If they are truly indiscernible, then there is only one object (or perhaps the description is incorrect).

  6. **Quantum vindication (French)**: Use quantum indistinguishability to argue that in nature, particles are not individuals and that Black's scenario is physically possible.

  Now, let's evaluate each:

  - **Weak discernibility (3)**: This is a strong reply because it shows that even in Black's scenario, there is a relational property (being at a distance from the other) that distinguishes the spheres. Each sphere has the property "being at a distance D from something else" and the other sphere does not have that same property with respect to itself. This is a qualitative property (it doesn't depend on which sphere it is) and thus preserves a version of PII. It directly addresses the case without denying the setup.

  - **Quantum vindication (6)**: This is also strong because it takes Black's scenario seriously and shows that in quantum mechanics, we have actual cases of indistinguishable particles that are not individuals. This suggests that PII may not hold and that the world allows for non-individuals. It resolves the tension by accepting that the principle is false and that's okay because physics shows it.

  - **Primitive thisness (2)**: This concedes that PII fails but posits a non-qualitative property to account for distinctness. While it resolves the tension by providing an explanation, it introduces a mysterious property (haecceity) that is not observable and might be seen as ad hoc. It doesn't preserve PII but rather rejects it by adding an extra ingredient.

