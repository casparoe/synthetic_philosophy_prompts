  ---

  ### What Both Might Be Missing:
  **The distinction between *vindicating coherence* and *vindicating other norms*.**  
  - Naomi is right that the **dominance argument** for coherence succeeds without probabilistic presuppositions.  
  - Dev is right that **extended applications** (updating, chance coordination) require expected accuracy, which presupposes coherence.  
  - **The deeper issue:** Accuracy-first epistemology *cannot non-circularly justify its own scoring rules* or the *exclusive focus on accuracy*. The choice of scoring rule (e.g., Brier score) is justified by how it interacts with *expected* accuracy (which requires probabilities), creating a latent dependency (Selim Berker, 2013). This implies the program’s "purely alethic" foundation is narrower than advertised—it works for coherence but not for a fully probabilistic epistemology.  

  **Resolution:** Dev wins the broader point about the framework's limitations, but Naomi correctly defends the dominance theorem’s logical independence. The accuracy-first program provides a *minimal vindication of coherence* but cannot escape probabilistic presuppositions when scaling to richer norms.
