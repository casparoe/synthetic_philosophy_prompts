  The core seems to be about moral luck. Both took identical risks, but only one faced consequences. I should explain why outcomes matter pragmatically even when intentions were similar. The company perspective is key - harm creates tangible damage that requires accountability. 

  But I must validate their discomfort too. That nagging feeling? It's because humans are wired to respond to harm. We can't help but react more strongly to actual damage than potential risk. Maybe comparing it to drunk driving would help - two drivers take the same risk, but we judge the one who hits someone more harshly, even though the decision was equally bad.

  Also worth noting: the user's guilt about their own uncaught mistake. That "there but for the grace of God" feeling. That's probably fueling part of their defensiveness about their friend's situation. 

