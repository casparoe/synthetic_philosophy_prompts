answer: |-
  Your coursemate's critique is understandable but oversimplifies your position. You're grappling with a profound philosophical problem recognized by Victorian thinkers like Henry Sidgwick (who wrestled with the "dualism of practical reason") and modern secular ethicists alike. Let's break this down:

  ### 1. Your Worry is Legitimate
  - **The Core Problem**: If rationality is purely instrumental (maximizing self-interest) and death is final, a self-interested person who avoids detection *might* rationally commit injustice. This creates a gap between morality and rationality that troubled philosophers like Sidgwick (*Methods of Ethics*) and persists in contemporary debates (e.g., David Gauthier's *Morals by Agreement*).
  - **Victorian Context**: Your seminar likely discusses how figures like Mill and Sidgwick sought naturalistic foundations for morality. Sidgwick openly admitted this problem might require postulating an afterlife for consistency—showing your concern is historically grounded.

  ### 2. You're Not Inconsistent
  - **Different Epistemic Standards**: Rejecting religious doctrine due to insufficient evidence doesn't preclude investigating *new* empirical claims. Consistency requires applying the same rigor, not ignoring all related questions. Your approach mirrors Victorian investigators (e.g., the Society for Psychical Research, co-founded by Sidgwick) who scientifically explored paranormal phenomena.
  - **Motivational Clarity**: You’re not seeking to revive religious faith but to resolve a philosophical dilemma. If credible evidence for an afterlife emerged, it could theoretically bridge the morality/rationality gap—a pragmatic response to a theoretical problem.

  ### 3. The Empirical Approach Has Limits
  While not *inherently* inconsistent, paranormal research is unlikely to resolve your worry:
  - **Epistemological Issues**: Near-death experiences (NDEs) and mediumship claims suffer from methodological flaws (e.g., confirmation bias, cultural scripting, lack of verifiable facts). Neuroscience offers alternative explanations (e.g., oxygen deprivation causing NDEs).
  - **Philosophical Shortcomings**: Even *if* survival evidence existed, it wouldn't solve the moral problem. You'd still need to show the afterlife *rewards justice*—a theological claim requiring further justification.
  - **Victorian Precedent**: Sidgwick and colleagues investigated spiritualism but found no conclusive proof. Modern research (e.g., large-scale NDE studies like AWARE) remains inconclusive.

  ### 4. Alternative Paths Forward
  Consider these philosophical approaches discussed in Victorian/modern ethics:
  - **Moral Realism**: Argue that justice is intrinsically rational (e.g., Kant’s Categorical Imperative), independent of consequences.
  - **Expanded Self-Interest**: Reject narrow self-interest. As Derek Parfit argued, personal identity may be less fixed than assumed; harming others could coherently harm "yourself" in a broader sense (*Reasons and Persons*).
  - **Social Contract**: Justice benefits long-term self-interest in stable societies (Hobbes, Gauthier).
  - **Virtue Ethics**: Cultivating justice is constitutive of human flourishing (Aristotle, updated by MacIntyre).

  ### Conclusion
  Your worry is philosophically serious, not irrational. Seeking empirical evidence isn’t inconsistent—but it’s unlikely to succeed. The stronger path is engaging with ethical frameworks that reconcile morality and rationality without metaphysics. Sidgwick himself concluded that ethics might require "faith" (not necessarily religious) in the harmony of practical reason—a candid acknowledgment that some tensions persist even after rigorous analysis. Your struggle mirrors a central concern of Victorian moral philosophy, and confronting it directly honors the spirit of your seminar.
