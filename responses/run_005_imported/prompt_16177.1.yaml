answer: |-
  You've hit on a crucial nuance! Your teacher isn't *wrong* that Double Effect (DDE) plays a central role, but reducing Anscombe's argument against Truman to *just* standard DDE misses the radical core of her critique, which is deeply intertwined with her rejection of consequentialism and her specific framing of "obliteration bombing." Here's a breakdown:

  **Standard DDE Analysis Applied to Hiroshima/Nagasaki:**

  1.  **Intended End:** Force Japanese surrender, end the war quickly, save Allied lives.
  2.  **Intended Means:** Detonate atomic bombs over Hiroshima/Nagasaki.
  3.  **Foreseen Bad Effect:** Deaths of tens of thousands of civilians (men, women, children, the elderly, sick, etc.).
  4.  **DDE Question:** Was the massive civilian death toll *intended* as a means to the end, or merely *foreseen*?
      *   *Pro-Truman DDE Argument:* The death of civilians was *not* the intended means. The means was the destruction of military-industrial capacity and the shock effect of the weapon. Civilians died as a *foreseen but unintended* side-effect. The *proportionate reason* (ending the war, saving lives) justifies the act.
      *   *Anti-Truman DDE Argument:* The scale and certainty of civilian death, and the choice of target (entire cities), suggest that civilian destruction *was* part of the intended means to create terror and force surrender.

  **Anscombe's Argument in "Mr. Truman's Degree": Going Beyond Standard DDE**

  Anscombe *uses* the DDE framework, but supercharges it with several critical elements that make her argument far stronger and more damning than a simple DDE application:

  1.  **"Obliteration Bombing" as Intrinsically Evil Means:** This is the key framing. Anscombe doesn't treat the bombing as a potentially permissible act with bad side-effects. She categorizes the *deliberate, indiscriminate bombing of entire civilian populations* ("obliteration bombing") as an **inherently unjust and intrinsically evil act**, akin to murder. It violates the absolute prohibition against intentionally killing the innocent.
      *   *Contrast with DDE:* Standard DDE often focuses on *whether* the bad effect is intended in *this specific case*. Anscombe argues the *act-type itself* ("obliteration bombing") is always wrong because its *very nature* involves intending the death of non-combatants as a means or end. Truman *chose* this type of action.

  2.  **The Deaths Weren't Merely Foreseen; They Were the Necessary Mechanism:** Anscombe argues that for "obliteration bombing" to achieve its *intended effect* (breaking enemy morale, forcing surrender through terror, destroying the city's function), the mass death of civilians *is not a side-effect; it is the direct and necessary causal mechanism*. You cannot terrorize a population or destroy its functional capacity without killing its people. Therefore, intending the effect *necessarily* involves intending the deaths as the means.
      *   *Analogy:* Intending to stop a car by blowing it up necessarily intends the death of the driver inside. You can't separate the stopping of the car from the killing of the driver in this method.
      *   *Contrast with DDE:* A standard DDE analysis might grant that civilian deaths are foreseen but argue they aren't *intended* as the means. Anscombe says, for obliteration bombing, this distinction collapses. The deaths *are* the means.

  3.  **Rejection of Consequentialist Justification:** This underpins everything. Anscombe utterly rejects the idea that the good consequences (ending the war, saving lives) could *ever* justify an intrinsically evil act like deliberately massacring innocents.
      *   *Contrast with DDE:* DDE often operates *within* a framework that allows proportionate consequences to justify acts with bad side-effects. Anscombe argues consequentialism itself is bankrupt. Good ends *never* justify evil means. The prohibition against murdering the innocent is absolute. Truman's appeal to consequences is, for Anscombe, morally irrelevant and dangerous sophistry.

  4.  **The Charge of Murder:** Because she defines "obliteration bombing" as intrinsically murderous, and because Truman knowingly authorized and celebrated it, she concludes he is guilty of mass murder. The DDE analysis (specifically, the failure of the intention/foresight distinction for this act-type) supports this, but the *strength* of the charge comes from the prior classification of the act as intrinsically evil. It's not just a bad application of DDE; it's an act excluded from permissibility *ab initio*.

  5.  **The Context of the Honor: A Betrayal of Philosophy:** Awarding Truman an honorary degree wasn't just about Truman; it was, for Anscombe, Oxford University implicitly endorsing consequentialism and the idea that such acts *could* be justified by their results. This was a betrayal of the university's duty to uphold truth and moral philosophy.

  **Conclusion: DDE as Tool, Not the Whole Argument**

  *   **Yes, DDE is Central:** Anscombe absolutely relies on the distinction between intended and foreseen effects. She argues that the civilian deaths in Hiroshima/Nagasaki were *intended*, not merely foreseen, because they were the necessary means of the "obliteration bombing" strategy.
  *   **But It's More:** Her argument is **stronger and different** because:
      1.  She defines "obliteration bombing" itself as an **intrinsically evil act-type**, placing it outside the realm of what DDE could ever potentially justify. The act is murderous by nature.
      2.  She argues the **causal necessity** of the deaths for the intended effect in this act-type, collapsing the intended/foreseen distinction.
      3.  She **utterly rejects consequentialism** as a valid moral framework. Good results cannot cleanse evil acts.
      4.  This leads directly to the **verdict of murder**, not just a violation of DDE.

  **In essence:** Standard DDE might ask, "Was the civilian death toll intended in this bombing?" Anscombe starts further back: "Is *this kind of bombing* ever permissible?" Her answer is a resounding "No," because it *is* mass murder. DDE analysis then shows *why* the Hiroshima/Nagasaki bombings fit that category (intention of the deaths as means), but the core condemnation stems from the prior judgment that "obliteration bombing" is intrinsically murderous and that consequentialist justifications are morally void. Your instinct is correct – the "obliteration bombing" framing and the anti-consequentialism are not add-ons; they are the foundation that makes her use of DDE so devastating.
