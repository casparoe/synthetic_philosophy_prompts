  So I'm elbow-deep in a novel about a press secretary who starts out just "managing the message" and slowly loses the ability to tell what's true from what he's invented for the cameras, and I've been rereading Arendt's old essays on lying in politics for background -- "Truth and Politics" and the Pentagon Papers one, "Lying in Politics." Theres a tension in them I can't resolve on my own: she treats lying as basically continuous with our capacity to act and start new things (the natality stuff -- liars and doers both refuse to just accept "what is"), but then she also seems genuinely alarmed that the modern, PR-and-systems-analysis style of lying she found in the Pentagon Papers -- the RAND-style "problem solvers" who ended up fooling themselves as much as the public, manufacturing one coherent "image" to replace the facts wholesale instead of just hiding a single fact -- is something new and uniquely dangerous, not just an old vice with better toys. Can you write me an essay that actually works through her arguments on both sides of that tension and then commits to a real verdict, continuity or rupture, something I can steal for my character's head instead of handing me a "well it's complicated" shrug?
