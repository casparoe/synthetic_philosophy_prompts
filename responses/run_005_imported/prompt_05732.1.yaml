answer: |-
  This isn't a legal question, it's a profound test of your character as an artist and a human being. While your friend's points about legal enforceability and pressure might be technically correct, they completely miss the ethical and creative heart of the matter. **Yes, you absolutely still owe your classmate the share you promised, both morally and creatively.** Here's why:

  1.  **The Nature of the Promise & Trust:** You made a desperate plea, and she responded based *solely* on her belief in your fundamental integrity. Her faith wasn't in a contract, but in *you*. She saw you at your most vulnerable and chose to save you, trusting your word when you had every future opportunity to break it without consequence. Reneging now isn't just breaking a promise; it's betraying the specific quality she saw in you that motivated her to act. It validates her trust only if you honor it.

  2.  **The Value of Her Contribution:** You acknowledge she was "far sharper" and rewrote *half* the collapsing manuscript. This wasn't light editing; it was salvaging the book. The book's success "far beyond expectations" is directly tied to her intervention. She wasn't just helping; she was a co-creator of the work that launched your career. A "generous gift" frames this as charity or a bonus, not the rightful share of the profits *her work directly generated*.

  3.  **The Pressure Argument is Flawed:** While the *need* for help arose under pressure, the *promise* you made was your solution. You weren't coerced into promising a share; *you offered it* as the incentive/compensation necessary to secure her vital help. It was the deal you proposed to solve your crisis. Using the pressure *you* were under as a reason to break the deal *you* proposed is disingenuous.

  4.  **"Free and Clear" vs. Integrity:** Your friend's "free and clear" argument is based on the absence of legal consequence. But true freedom comes from living with integrity. Carrying the knowledge that you profited immensely from her indispensable work while denying her the share *you* promised will likely become a corrosive burden on your conscience and your creative spirit. The publishing world might not know, but *you* will, and *she* will.

  5.  **"Would Not Change Anything" is False:** Honoring the promise changes *everything* for her. It provides tangible, deserved recognition and compensation for her crucial role in your success. It validates her skill and her act of faith. For you, it lifts a significant moral weight, allows you to look her (and yourself) in the eye, and affirms the person she believed you were in that desperate moment. A "gift" feels like hush money; fulfilling the promise is justice.

  6.  **The Creative Debt:** Writers understand the immense value of creative labor. Half a book, rewritten under intense pressure to save a collapsing project, represents an enormous investment of her talent, time, and emotional energy. That debt doesn't vanish with success; it accrues meaning. Fulfilling your promise acknowledges the true collaborative nature of the book's creation, even if uncredited.

  **What You Should Do:**

  1.  **Contact Her Immediately:** Don't delay. Reach out sincerely.
  2.  **Acknowledge & Apologize for Delay:** State clearly that you know you owe her the share you promised and that it was wrong not to have addressed this properly sooner. Express gratitude again, deeply and specifically, for her talent, effort, and trust.
  3.  **Propose Fulfillment:** Calculate the agreed-upon share (if a specific percentage wasn't mentioned, propose a fair one – 25-50% of net earnings from *that book* is a reasonable starting point for half the work). Include all income streams: advances, royalties, foreign rights, film options, etc., related to that specific book. Offer a full accounting.
  4.  **Put it in Writing NOW:** Draft a simple agreement outlining the payment terms based on your original promise and her contribution. Have both parties sign it. This formalizes your moral obligation and protects her interest moving forward.
  5.  **Consider Future Recognition:** While anonymity might be necessary publicly, explore private ways to acknowledge her contribution meaningfully to those who matter (e.g., a dedication in a future book referencing "the one who saved the first," private acknowledgment to close peers or mentors with her permission).

  **The "Generous Gift" Alternative is Insufficient:** It diminishes her contribution to a favor, not a foundational partnership. It frames you as the magnanimous benefactor, not someone fulfilling a rightful obligation. It likely feels insulting to her and will leave you with lingering shame.

  **This is about who you are as a person and an artist.** That late-night promise wasn't just a transaction; it was a covenant made in the crucible of creation. Honoring it isn't about legal force; it's about proving your classmate right about your character and acknowledging the invisible scaffolding that holds up your success. Paying her the share isn't just settling a debt; it's an investment in your own integrity and peace of mind. Do the right thing.
