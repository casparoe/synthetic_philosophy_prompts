  First, I need to make sure the story centers on the philosophical concepts without just name-dropping. The principle of charity must drive the plot. So, the linguists have to assume the aliens are rational and mostly correct about their environment. The challenge is to depict the mutual dependency: beliefs depend on word meanings and vice versa.

