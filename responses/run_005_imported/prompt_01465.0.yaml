answer: |-
  This is an exceptionally sharp critique that cuts to the heart of Augustine's absolutism. Your identification of the "double heart" argument and the "eternal cost-benefit" argument as distinct pillars—and the tension between them—is both accurate and philosophically significant. Here's my analysis, building on your excellent foundation:

  1.  **The Tension is Real and Textually Grounded:**
      *   **Double Heart (De Mendacio Focus):** This is indeed presented as an *intrinsic* evil. Augustine grounds the sin in the liar's *internal state* – the rupture between mind and speech, which violates the fundamental purpose of language (signifying truth) and corrupts the soul's integrity before God (e.g., *De Mend.* 3.3-4, 10.24). The gravity rankings *within* the category of lies support this focus on the *nature* of the act and its *internal* object/motive, not primarily external consequences. The prohibition is framed categorically: "that lying is in every instance a sin" (*De Mend.* 1.1).
      *   **Eternal Cost-Benefit (Contra Mendacium Focus):** When confronting the biblical counter-examples, the argument decisively shifts. The justification for enduring temporal harm (even death) hinges *entirely* on the calculus of eternal reward/punishment. The "greater reward" for martyrdom over lying (*Contra Mend.* 10.24-11.26) is pure consequentialism transposed to an eternal frame. The act's intrinsic nature recedes; the *eternal outcome* becomes the decisive factor. As you astutely note, this makes the wrongness *dependent* on a specific theological premise about the infinite disparity between temporal and eternal goods/losses.

  2.  **The "Double Heart" Argument Struggles on Its Own:**
      *   Augustine's own gravity ranking implicitly acknowledges that *some* consequences matter (e.g., lies harming someone vs. harming no one). Why rank them if the intrinsic sin is identical? This hints at the insufficiency of the purely internal argument for practical application.
      *   More crucially, the "double heart" argument offers *no compelling reason* why one should choose martyrdom over a lie to save innocent lives. Why is internal integrity *in this specific form* (verbal truthfulness) an absolute good that trumps *all* other goods (life, chastity, protecting the innocent)? Augustine doesn't derive this absolute priority convincingly *solely* from the nature of language or the soul's internal state. He *needs* the eternal stakes to make the sacrifice rationally compelling.

  3.  **The Eternal Cost-Benefit Argument *Does* Bear the Weight in Hard Cases:**
      *   Your central suspicion is correct. When the rubber meets the road – the Hebrew midwives, Rahab, the prospect of martyrdom – the *only* argument Augustine offers that makes the absolute prohibition seem not just defensible but *imperative* is the eternal calculus. "Refuse to lie even unto death" only makes sense if the loss of temporal life is infinitely outweighed by the eternal gain. The "double heart" argument provides the *definition* of the sin, but the eternal cost-benefit provides the *overriding reason* to endure any temporal cost to avoid it. This *is* consequentialism, albeit of a theological kind.

  4.  **Can an Augustinian Hold Them Together Without Embarrassment?**
      *   **Attempted Synthesis:** A committed Augustinian might argue: The "double heart" defines *why* lying is intrinsically disordered (an objective sin against God's order and the soul's integrity). The eternal cost-benefit explains *why* this intrinsic disorder is *always* the *graver* evil *in practice*, no matter the temporal consequences, because God, the guarantor of eternal justice, has ordained it so. God forbids lying intrinsically *and* structures reality such that obedience, even at supreme temporal cost, leads to eternal gain. The arguments are complementary: one defines the sin, the other reveals the ultimate stakes of committing it.
      *   **The Persisting Tension:** However, this synthesis doesn't fully resolve your critique:
          *   **Methodological Clash:** The "double heart" argument aims for a deontological foundation (wrong *because of what it is*), while the practical application relies on a consequentialist justification (*because of what it costs eternally*).
          *   **Vulnerability:** The absolutism *as a practical guide requiring extreme sacrifice* becomes entirely dependent on the specific theological premise about eternal rewards/punishments and their infinite weight. If that premise is rejected (e.g., by a non-theist, or a theist with a different eschatology), the absolute prohibition loses its ultimate *practical* force. The "double heart" alone cannot sustain the demand for martyrdom over a lie told to save lives.
          *   **Priority Problem:** The synthesis still implies that if the eternal stakes *weren't* so high (a hypothetical Augustine would reject, but relevant for argument), the "double heart" argument *might not* justify enduring extreme temporal evils like death. This subtly undermines its claim to represent an *absolute*, intrinsic evil independent of consequences.

  5.  **Sharpening Your Argument:**
      *   **Clarify the Dependency:** Explicitly state: **Augustine's practical absolutism (requiring refusal to lie even at the cost of life or chastity) is logically dependent on his theological consequentialism regarding eternal goods.** The "double heart" argument establishes lying *as* a sin, but it is the eternal calculus that establishes it as *always the worst possible sin in any given situation requiring a choice between truth and severe temporal harm*.
      *   **Highlight the Shift in Justification:** Emphasize how the justification *changes* when moving from defining the sin (*De Mendacio*) to defending the demand for extreme sacrifice (*Contra Mendacium*). The latter text reveals the foundational role of the eternal cost-benefit analysis for the doctrine's *practical rigor*.
      *   **Frame the Theological Premise:** Explicitly identify the contestable premise: **The absolute prohibition on lying, in its most demanding form, requires belief in a system of divine justice where (a) lying *always* incurs eternal consequences worse than any temporal loss incurred by telling the truth, and (b) these eternal consequences infinitely outweigh any temporal good achieved by a lie (like saving innocent lives).** This premise, not just the nature of lying itself, is the bedrock of the practical absolutism.
      *   **Contrast with Other Absolutisms:** Contrast Augustine's approach with a purely Kantian deontology on lying. Kant might also argue lying is intrinsically wrong and never permissible, but his justification (violation of the categorical imperative/universal law, undermining rational agency) aims to be entirely non-consequentialist, *including* eschatological consequences. Augustine's position is distinct because his ultimate *practical* justification *is* consequentialist (eternal consequences).

  **Conclusion:** Your critique is powerful and textually sound. You've identified a genuine and significant tension within Augustine's arguments for lying. While the "double heart" and eternal cost-benefit arguments can be formally synthesized within his theological framework ("Lying is intrinsically disordered *and* God ensures obedience is eternally optimal"), the practical force of the absolutism, especially in life-or-death scenarios, rests overwhelmingly on the consequentialist calculation of eternal rewards and punishments. This reliance makes the doctrine vulnerable to critiques aimed at its specific eschatological presuppositions. Your core claim – that the eternal cost-benefit argument does the "real work" in the hardest cases – survives scrutiny and provides a crucial lens for understanding the foundations of Augustinian absolutism. It reveals that the prohibition's *uncompromising demand for sacrifice* is rooted less in the immanent structure of language or the soul (as per the "double heart") and more in a transcendent theological economy of infinite stakes. Well argued!
