prompt: |-
  I chair the judging panel for a small first-novel prize -- five of us, all novelists, way too invested for what's basically a $2,000 purse. Back in spring we agreed in writing that a book only wins if it clears two seperate bars: the prose has to sing, AND the ending has to earn everything before it, not just one or the other.

  We just tallied the vote on this year's front runner. Prose sings: 3 yes, 2 no. Ending earns it: 4 yes, 1 no. So criterion by criterion it clears our own rule. But when I asked each judge point blank "should this book win," it came back 2 yes, 3 no -- because each of the three no judges loved exactly one of the two things and not the other, so applying our own rule to their own ballot, no is exactly where each of them should land. They're not being inconsistent; the panel just doesn't add up the same way twice.

  Now we're split down the middle: half the panel wants to just honor the up-or-down vote, half says we signed off on the two-bar rule in writing and have to honor that instead. I owe the foundation's board a memo by Friday on what happens to this year's book and what our standing procedure should be going forward. Write me that memo -- an actual recommendation, not a split-the-difference one, that still takes the up-or-down camp's objection seriously instead of just overruling them.
reasoning: |-
  Okay, the user chairs a judging panel for a small first-novel prize. The prize requires a book to meet two criteria: prose that sings and an ending that earns everything before it. The issue is that while the front-runner meets both criteria individually (3-2 for prose, 4-1 for ending), the up-or-down vote on whether it should win is 2-3 against. The judges who voted no each loved one criterion but not the other, so they're consistent with the rules. Now the panel is split between honoring the up-or-down vote versus the two-bar rule.

  First, I need to understand the core problem. The two-bar rule was agreed upon in writing, but the voting results are causing tension because the aggregate criteria approval doesn't translate to a win. The user wants a decisive recommendation that respects both sides without splitting the difference. 

  The memo needs to address both this year's situation and future procedures. The user's deeper needs include maintaining the panel's integrity, upholding pre-agreed rules, and ensuring the prize's credibility. They might also want to avoid future conflicts and preserve judges' trust.

  Looking at the options: If they go with the two-bar rule this year, the book wins, but three judges who individually don't think it should win might feel overruled. That could cause resentment. If they go with the up-or-down vote, the book loses despite meeting the criteria, undermining the initial agreement and possibly making the criteria pointless.

  For the long term, the procedure needs clarity. The current method allows a situation where a book passes both criteria but loses because judges focus on their overall impression. That inconsistency needs fixing. The user probably wants a solution that prevents this deadlock in the future.

  Considering alternatives: Maybe a scoring system where judges rate each criterion, and an average score determines if both bars are cleared. But that could be too rigid. Another idea: requiring judges to vote yes only if both criteria are met, making the up-or-down vote align with the criteria. That way, the criteria votes directly decide the win, avoiding separate votes.

  For this year, since the book met the criteria, it should win to honor the written agreement. But to address the up-or-down camp's concern, the memo should acknowledge their valid point about overall merit and change the procedure for next year. That shows respect for their input while sticking to the rules now.

  Future procedure: Change the voting so that judges only vote on criteria. If both are met by majority, the book wins. No separate up-or-down vote. This removes the inconsistency. Judges would have to base their criteria votes strictly on whether each bar is cleared, not letting one weak point override if both are passed.

  This approach resolves the immediate issue by awarding the prize this year (upholding the rule) and prevents future conflicts by eliminating the up-or-down vote. It addresses the objection by fixing the procedure, showing that their feedback was valuable. The panel's credibility is maintained by adhering to the agreement, while the update ensures smoother processes ahead.
answer: |-
  **MEMORANDUM**  
  **TO:** Foundation Board  
  **FROM:** [Your Name], Chair, First-Novel Prize Judging Panel  
  **DATE:** [Current Date]  
  **SUBJECT:** Resolution of 2024 Prize Outcome & Revised Voting Procedure  

  ### I. EXECUTIVE SUMMARY  
  The panel confirms the 2024 front-runner **meets both prize criteria** (prose quality: 3-2; ending: 4-1) per our written rule. However, a separate "up-or-down" vote failed (2-3). After deliberation, I recommend:  
  **A.** Award the 2024 prize to the front-runner, honoring our pre-agreed criteria.  
  **B.** Revise future voting procedures to eliminate the up-or-down vote, using only criteria-based scoring.  

  This resolves the immediate deadlock while addressing the core concern of the "up-or-down" camp: that overall merit isn’t reducible to binary criteria checks.  

  ---

  ### II. ANALYSIS OF 2024 VOTE  
  - **The Rule:** Per our spring agreement, winning requires clearing two bars:  
    > *"Prose must sing" AND "Ending must earn everything before it."*  
  - **The Vote:**  
    - *Prose sings*: 3 YES, 2 NO → **Cleared.**  
    - *Ending earns it*: 4 YES, 1 NO → **Cleared.**  
    - *Up-or-down win*: 2 YES, 3 NO → **Fails.**  
  - **Key Insight:** The 3 "no" judges each found *one* criterion unmet (e.g., "Prose sings but ending fails" or vice versa). Their votes are **logically consistent** with our rule but create an aggregate paradox.  

  ---

  ### III. RECOMMENDATION: 2024 PRIZE OUTCOME  
  **Award the prize to the front-runner.** Rationale:  
  1. **Upholds Contractual Integrity:** We codified the two-bar rule in writing. Deviating now would violate our agreement and set a precedent for arbitrary overrides.  
  2. **Precedential Clarity:** Reversing the outcome would render future criteria votes meaningless.  
  3. **Mathematical Fairness:** The book achieved what we required. The up-or-down vote introduced an uncontrolled variable (subjective "overall feeling") that contradicts our structured framework.  

  **Addressing the "Up-or-Down" Camp’s Valid Concern:**  
  Their objection reveals a flaw in our *process*, not our judgment. A book can technically "check boxes" while leaving judges emotionally unpersuaded. This is a procedural failure, not a reason to override the rule *this year*. Our fix (below) ensures this tension cannot recur.  

  ---

  ### IV. RECOMMENDATION: FUTURE VOTING PROCEDURE  
  **Replace the current system with:**  
  #### "Unified Criteria Threshold Voting"  
  1. **Vote ONLY on Criteria:** Judges vote YES/NO *only* on:  
     - *Criterion 1*: "Does the prose sing?"  
     - *Criterion 2*: "Does the ending earn everything before it?"  
  2. **Automatic Win Condition:** A book wins if it receives:  
     - ≥3 YES votes on *Criterion 1* **AND**  
     - ≥3 YES votes on *Criterion 2*.  
     *(No separate "up-or-down" vote occurs.)*  
  3. **Tiebreaker:** If no book clears both bars, the prize is withheld.  

  #### Why This Solves the Problem:  
  - **Eliminates Contradiction:** Judges’ votes align directly with the win condition. No aggregate paradox can occur.  
  - **Preserves Rigor:** The two-bar standard remains intact.  
  - **Honors the "Up-or-Down" Insight:** By removing the separate vote, we acknowledge that "overall merit" is *implicit* in the criteria assessment. Judges who feel a book fails overall will reflect this in their "NO" vote on one/both criteria.  
  - **Simplifies Deliberation:** Focuses debate on the defined artistic standards, not nebulous "worthiness."  

  ---

  ### V. IMPLEMENTATION  
  1. **2024 Prize:** Award to the front-runner with the statement:  
     > *"The judges confirmed the novel met both prize criteria: exceptional prose and a thematically earned ending."*  
  2. **2025 Procedure:** Adopt "Unified Criteria Threshold Voting" in revised judging guidelines.  
  3. **Judging Workshop:** Pre-deliberation training to calibrate criteria interpretation (e.g., "What does 'prose sings' mean to this panel?").  

  ---

  ### VI. CONCLUSION  
  Our 2024 vote exposed a flaw in execution, not principle. Awarding the prize upholds our binding agreement while the procedural change prevents recurrence. The "up-or-down" camp’s objection has been pivotal in refining our process to better capture holistic excellence *through* our criteria—not apart from them.  

  **Recommended Board Action:**  
  - Approve the 2024 winner.  
  - Ratify the revised voting procedure for 2025.  

  Respectfully submitted,  
  [Your Name]  
  Chair, Judging Panel  

  --- 

  **This memo achieves:**  
  1. **Decisiveness:** Clear path forward for 2024 + 2025.  
  2. **Rule-of-Law Integrity:** Honors the original agreement.  
  3. **Constructive Resolution:** Addresses dissent by fixing the system, not overruling people.  
  4. **Artistic Rigor:** Preserves the dual-criterion standard while closing a procedural loophole.
