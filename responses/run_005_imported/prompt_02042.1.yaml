prompt: |-
  Hey, I could use a sanity check on a passage before I put it in front of students. I teach the persistence-through-time unit in my metaphysics seminar (the one that eventually lands on endurantism vs. perdurantism), and this year I wanted to open with Hobbes instead of jumping straight to Lewis and Sider, since it turns out he works through basically the same puzzle-set almost 300 years earlier, only in a way that's stranger then I remembered. Below is the passage, from *De Corpore* (1655), Part II, Ch. 11, §7 — his "three opinions" set-up for the ship of Theseus and his own resolution of it. I follow the setup fine, but his actual solution at the end still isn't quite clicking for me in a way I'd trust myself to explain live to 20 confused undergrads.

  "And from hence springs a great controversy among philosophers about the beginning of individuation, namely, in what sense it may be conceived that a body is at one time the same, at another time not the same it was formerly. For example, whether a man grown old be the same man he was whilst he was young, or another man; or whether a city be in different ages the same, or another city. Some place individuity in the unity of matter; others, in the unity of form; and one says it consists in the unity of the aggregate of all the accidents together. For matter, it is pleaded that a lump of wax, whether it be spherical or cubical, is the same wax, because the same matter. For form, that when a man is grown from an infant to be an old man, though his matter be changed, yet he is still the same numerical man; for that identity, which cannot be attributed to the matter, ought probably to be ascribed to the form.

  According to the first opinion, he that sins, and he that is punished, should not be the same man, by reason of the perpetual flux and change of man's body; nor should the city, which makes laws in one age and abrogates them in another, be the same city; which were to confound all civil rights. According to the second opinion, two bodies existing both at once, would be one and the same numerical body. For if, for example, that ship of Theseus... were, after all the planks were changed, the same numerical ship it was at the beginning; and if some man had kept the old planks as they were taken out, and by putting them afterwards together in the same order, had again made a ship of them, this, without doubt, had also been the same numerical ship with that which was at the beginning; and so there would have been two ships numerically the same, which is absurd. But, according to the third opinion, nothing would be the same it was; so that a man standing would not be the same he was sitting; nor the water, which is in the vessel, the same with that which is poured out of it.

  Wherefore the beginning of individuation is not always to be taken either from matter alone, or from form alone. But we must consider by what name anything is called, when we inquire concerning the identity of it. For it is one thing to ask concerning Socrates, whether he be the same man, and another to ask whether he be the same body; for his body, when he is old, cannot be the same it was when he was an infant... yet, nevertheless, he may be the same man. And therefore, whensoever the name, by which it is asked whether a thing be the same it was, is given it for the matter only, then, if the matter be the same, the thing also is individually the same...

  Also, if the name be given for such form as is the beginning of motion, then, as long as that motion remains, it will be the same individual thing; as that man will be always the same, whose actions and thoughts proceed all from the same beginning of motion, namely, that which was in his generation; and that will be the same river which flows from one and the same fountain, whether the same water, or other water, or something else than water, flow from thence; and that the same city, whose acts proceed continually from the same institution, whether the men be the same or no. Lastly, if the name be given for some accident, then the identity of the thing will depend upon the matter... so that a ship, which signifies matter so figured, will be the same as long as the matter remains the same; but if no part of the matter be the same, then it is numerically another ship; and if part of the matter remain and part be changed, then the ship will be partly the same, and partly not the same."

  Okay so here's were I get stuck. On a first pass I assumed Hobbes was going to vindicate the continuously-repaired ship as the "real" one, since that's how everybody's intuitions run today. But his actual sorting rule seems to put ship in the matter/accident bucket rather than the form bucket, which as far as I can tell means the reassembled-from-old-planks ship comes out as at least as good a candidate for numerically the same ship, while the continuously-repaired one only counts as "partly the same" — which seems to run backwards from how the example gets used in every intro class, including mine. Am I reading that right, or missing something? And separately: is his distinction between things individuated by "matter" versus things individuated by "form as the beginning of motion" actually doing the same work as the modern endurantist/perdurantist split (or the four-dimensionalist temporal-parts picture more specifically), or is it a genuinely different axis of classification that only looks similar? Because on his own criteria it seems like you could consistently be one of those things about ships and the other about people and commonwealths, which doesn't obviously correspond to anyone being a perdurantist or endurantist "about everything." I ran this by a colleague who does history of philosophy and she thinks I'm just forcing 20th-century categories onto a text that was never trying to answer that question, but I'm not fully convinced she's right. Could you walk me through what Hobbes's resolution is actually doing here, and then tell me how it does or doesn't map onto endurantism and perdurantism as we teach them now?
