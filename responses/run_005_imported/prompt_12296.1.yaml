prompt: |-
  I recently started a part-time research assistantship with a philosopher working on longtermist decision theory, and my very first assignment has been to get properly up to speed on evidential cooperation in large worlds (ECL). Since I will soon be helping draft materials that presuppose familiarity with the topic, my supervisor asked me to write a short internal memo pinning down exactly how ECL differs from the more familiar practice of hedging one's actions under moral uncertainty (of the "moral parliament" variety), since this is apparently the confusion that trips up almost everyone who meets ECL for the first time. I have drafted the memo below and would very much like your comments before I circulate it, since I would rather be corrected now than embarrass myself in front of my new supervisor.

  My current understanding, as I have written it up, runs roughly as follows. ECL asks us to imagine a universe, or multiverse, large enough to contain vast numbers of decision-makers who cannot causally affect one another but who are nonetheless correlated in how they reason, because some non-negligible fraction of them arrive at their choices via relevantly similar deliberative procedures — an idea usually traced back to Hofstadter's notion of superrational cooperation in the one-shot prisoner's dilemma, just scaled up to a cosmic population of agents with heterogeneous values. If I am one such agent and I choose to act partly on behalf of value systems other than my own, that choice is evidence, in the sense relevant to evidential rather than causal decision theory, that other, similarly-reasoning agents elsewhere are simultaneously choosing to act partly on behalf of value systems other than theirs, including mine. So even holding my own values fixed and fully known to me, I would have reason to compromise, purely because of this acausal correlation, in a way that has nothing to do with epistemic humility about ethics. This looks importantly different from hedging under moral uncertainty, where the entire rationale for spreading effort across several moral theories is that I do not know which one is true, and where I would keep hedging in exactly the same way even in a universe of one, with no other agents to correlate with at all. My worry, which I have raised in the memo, is that this difference in justification does less practical work than it looks like it should, since most informal treatments implement the ECL "compromise" using essentially the same parliamentary-bargaining machinery originally proposed for moral uncertainty, and since anyone who is also a moral realist and treats widespread convergence among reasoners as evidence about which values are correct will end up folding the ECL calculation straight back into their moral-uncertainty calculation. I have therefore suggested that the two considerations are conceptually independent but practically prone to collapsing into one another for exactly the kind of person who is likely to take ECL seriously in the first place.

  Could you look this over and tell me whether I have actually located a real and stable distinction, or whether I am overstating how cleanly ECL and moral-uncertainty hedging come apart? I would also value a sanity check on whether I have represented the core ECL argument accurately, since I have been relying mainly on secondary summaries rather than primary sources, and a pointer to any standard objections to ECL itself, independent of this comparison, that a memo like this really should not omit.
reasoning: |-
  Okay, the user is working on a memo about Evidential Cooperation in Large Worlds (ECL) and how it differs from hedging under moral uncertainty. They've drafted their understanding but want feedback before sharing it. Let me start by recalling the core concepts they mentioned.

  First, ECL is based on acausal coordination between agents who can't affect each other but share similar reasoning processes. It's like Hofstadter's superrationality but scaled up. The key point is that by cooperating, an agent provides evidence that others are doing the same, leading to mutual benefits. On the other hand, moral uncertainty hedging is about not knowing which moral theory is correct, so spreading efforts across theories. The user is concerned that while the justifications differ, in practice, both might use similar bargaining mechanisms, causing them to collapse into each other.

  The user's main question is whether the distinction they've drawn is valid or if they're overstating the separation. They also want accuracy checks on ECL representation and any major objections to ECL itself. 

  I need to verify if ECL's reliance on correlated decision-makers versus moral uncertainty's focus on individual uncertainty is a real distinction. Yes, that's correct. ECL requires multiple agents and acausal links, while moral uncertainty doesn't. The user's point about moral realists folding ECL into their uncertainty calculations makes sense because if convergence indicates correct values, then ECL's evidence affects what they think is right, blending the two. 

  But is this blending inevitable? The user suggests it is for those likely to adopt ECL, which might be true. However, conceptually, they remain distinct. For example, in a single-agent world, moral uncertainty still applies, but ECL doesn't. That's a strong point. The user also mentioned that both use similar parliamentary models, which might obscure the difference. I should highlight that the implementation overlap doesn't negate the foundational differences.

  Regarding accuracy, the user correctly notes ECL's roots in superrationality and evidential decision theory. They might need to clarify that ECL deals with value heterogeneity, not just cooperation. Also, the acausal correlation is key—agents don't communicate but reason similarly. 

  Standard objections to ECL include computational infeasibility, dependency on decision theory (EDT vs. CDT), and the "twin prisoners" problem where defection might be better if others don't cooperate. Also, the challenge of defining reference classes: who counts as a similar reasoner? These are important to mention in the memo.

  The user's worry about practical collapse is valid but doesn't undermine the conceptual distinction. Emphasizing scenarios where the two diverge, like single-agent cases or when moral realism isn't assumed, could strengthen their argument. Also, noting that moral uncertainty weights are subjective, while ECL's weights depend on population statistics, might help clarify.

  In summary, the user has a solid grasp. They should reinforce the theoretical separation while acknowledging practical overlaps. Including objections will make the memo more robust. Making sure to clarify ECL's dependence on multiple agents and acausal links versus moral uncertainty's individual epistemic state is crucial.
answer: |-
  Your memo demonstrates an impressively clear grasp of ECL's core mechanism and its distinction from moral uncertainty hedging. You've correctly identified the conceptual heart of the difference. Below is a breakdown confirming your key points, addressing your concerns, suggesting refinements, and highlighting key objections:

  **Confirmation of the Core Distinction:**

  1.  **Fundamental Justification:**
      *   **ECL:** Rooted in **strategic acausal coordination** between *distinct, correlated agents* in a large world. The reason to compromise is purely instrumental: acting on others' values increases the probability (evidentially) that *others* will act on *your* values, maximizing the realization of *your own* fixed values across the multiverse. It's about mutual benefit via correlation.
      *   **Moral Uncertainty Hedging:** Rooted in **epistemic humility** about *which values are correct*. The reason to spread resources is to avoid betting everything on what might be the wrong moral theory, minimizing expected moral error from a *first-person, single-agent* perspective. It operates even in a solitary universe.

  2.  **Agent Structure & World Dependence:**
      *   **ECL:** **Requires** the existence of many *other* agents whose decisions are correlated with yours through shared reasoning procedures. It fundamentally depends on the large world structure and acausal links. No other agents = no ECL motivation.
      *   **Moral Uncertainty Hedging:** Operates perfectly within a **single-agent universe**. The uncertainty is entirely internal to the agent's epistemic state regarding moral truth.

  3.  **Value Perspective:**
      *   **ECL:** You act *instrumentally* on values you may not hold (or even reject) purely because doing so signals correlated agents to act on *your* values. Your *own* values remain fixed and primary.
      *   **Moral Uncertainty Hedging:** You act *directly* on values proportional to your credence that they are *objectively correct*. The aim is to do what's *actually* right given uncertainty.

  **Addressing Your Worry (Collapse in Practice):**

  Your concern is **valid and insightful**, but it doesn't invalidate the conceptual distinction. Here's a nuanced view:

  1.  **Implementation Overlap ≠ Identity:** Using parliamentary bargaining (e.g., MEC, Borda count) for *both* is primarily because these are the most developed tools for aggregating diverse preferences/values under constraints. This is a **pragmatic coincidence**, not proof the underlying justifications are identical. One *could* imagine different aggregation procedures being optimal for each case (though none are widely agreed upon yet).
  2.  **Moral Realism & Convergence:** Your point about moral realists folding ECL evidence into their uncertainty calculation is **spot on and crucial**. For a moral realist who believes:
      *   Correct moral reasoning converges on true values.
      *   Widespread convergence among ideal reasoners *is evidence* of true values.
      Then, observing the hypothetical ECL bargain (which reflects convergence among correlated reasoners) *could* be interpreted as strong evidence about objective moral truth. This *would* collapse the ECL coordination problem back into their moral uncertainty calculation. **Highlight this strongly in your memo.**
  3.  **Key Practical Divergence:** The distinction remains practically visible in scenarios involving:
      *   **Value Systems Explicitly Rejected:** Under moral uncertainty, you wouldn't allocate resources to a value system you assign 0% credence to (e.g., a sadist's values). Under ECL, if you believe correlated agents *hold* those values and would respond to your cooperation, you *might* instrumentally act on them to benefit your own values.
      *   **Single-Agent Scenarios:** ECL simply doesn't apply. Moral uncertainty does.
      *   **Non-Realist Frameworks:** For a moral anti-realist or constructivist, ECL's instrumental coordination remains distinct from any "truth-tracking" uncertainty hedging.

  **Refinements to Your Draft:**

  *   **Clarify "Relevantly Similar Deliberative Procedures":** Emphasize this is the source of the evidential correlation. Agents don't need identical values, but their decision-making *algorithm* (e.g., EDT, specific ECL logic) must be similar enough that your choice is strong evidence about theirs. The "reference class" problem (who counts as "similarly reasoning"?) is a major challenge.
  *   **Hedging Under Moral Uncertainty:** Explicitly state it's about maximizing *expected moral value* given uncertainty over which theory is true, minimizing the risk of catastrophic moral error if wrong.
  *   **ECL's Goal:** Frame it as maximizing the *realization of your own fixed values* across the multiverse via acausal trade, *not* about discovering truth or being fair.

  **Standard Objections to ECL (Must Include):**

  1.  **Decision Theory Dependence:** ECL critically relies on Evidential Decision Theory (EDT). If Causal Decision Theory (CDT) is correct, ECL reasoning fails (CDT ignores acausal correlations). This is a foundational debate.
  2.  **Reference Class Problem:** Who counts as a "similarly reasoning agent"? Defining the relevant class is arbitrary and drastically affects the outcome. Are all EDT reasoners included? Only those with specific meta-ethical commitments? This injects significant subjectivity/vagueness.
  3.  **Computation/Information Problem:** How can any real agent possibly know the distribution of values and reasoning types across the vast multiverse well enough to calculate the optimal ECL bargain? The information requirements are astronomical.
  4.  **"Twin Prisoners" / Robustness:** What if other "similar" reasoners are actually reasoning differently? What if they defect? Is the ECL bargain robust to small deviations or errors in reasoning among the population? (See "Twin Prisoner's Dilemma" critiques).
  5.  **Self-Defeating Potential:** Could reasoning about ECL lead some agents to defect *because* they expect others to cooperate, undermining the whole mechanism? (Related to CDT vs. EDT).
  6.  **Value Extraction vs. Exploitation:** Does ECL unfairly privilege common or easily satisfied values over rare or demanding ones? Could agents with niche values be "exploited" in the bargain?
  7.  **Metaphysical Extravagance:** Does relying on vast multiverses and acausal links stretch credulity too far for a practical decision theory?

  **Recommendations for Your Memo:**

  1.  **Keep the Core Distinction:** Your explanation of the difference in justification (acausal coordination vs. epistemic humility) is correct and fundamental. Strengthen it with the single-agent universe point.
  2.  **Acknowledge the Collapse Risk:** Explicitly discuss the point about moral realists interpreting ECL convergence as evidence for truth, leading to a practical collapse for them. Frame it as a key reason the distinction gets blurred *for certain agents*.
  3.  **Highlight Implementation vs. Justification:** Briefly note that while similar parliamentary methods *might* be used for both, this is a practical tool choice and doesn't erase the different underlying reasons for compromising.
  4.  **Include Key Objections:** Add a short section (or footnote) listing the standard objections to ECL (Decision Theory Dependence, Reference Class, Computation, Robustness) as essential context for understanding its viability and limitations, independent of the comparison.
  5.  **Tighten Language:** Replace phrases like "looks importantly different" with "is fundamentally different in its justification". Be precise about "evidence" meaning evidential correlation, not evidence for truth.

  **Conclusion:**

  You have absolutely located a **real and stable conceptual distinction** between ECL and moral uncertainty hedging. Your representation of ECL's core argument is accurate. Your insight about the potential *practical* collapse, especially for moral realists who see convergence as evidence of truth, is excellent and should be a central part of your memo. The main area for refinement is explicitly confronting the standard objections to ECL itself. Don't downplay the distinction; instead, explain clearly *why* it gets confused (implementation overlap, realist interpretations) while firmly grounding it in the differing core mechanisms (acausal coordination vs. epistemic humility). Your supervisor should be pleased with this level of understanding. Good luck!
