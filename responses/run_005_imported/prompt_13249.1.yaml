prompt: |-
  I spent 35 years as a field biologist, and now that I'm retired I've finally gotten around to reading all the philosophy-of-science stuff I always meant to, starting with Gould and Lewontin's old spandrels paper. Facinating, but the examples people usually reach for when arguing about it (the chin, the panda's thumb) feel pretty worn out at this point. Here's one I want to use instead: theres a 1977 hypothesis, by a guy named Treisman, that motion sickness isn't an adaptation in its own right at all -- just an accidental side effect of a genuinely useful system that evolved to make animals vomit up ingested poisons, with mismatched signals from the eyes and inner ear getting misread by the brain as a poisoning event. Could you write me a dialogue between a hardcore adaptationist and a Gould/Lewontin-style pluralist, arguing over whether motion sickness is a genuine spandrel or secretly doing adaptive work of its own? Don't let either one just fold, I want real back and forth, and get them wrestling with the harder question underneath too: what kind of evidence would even tell us we're looking at a spandrel rather than an adaptation, given that nobody can rerun evolution to check.
