  For the adaptationist, I can draw from modern extensions of Treisman's idea. Maybe argue that motion sickness discourages motion that could cause falls or disorientation, thus enhancing survival. For the pluralist, emphasize the lack of direct evidence for adaptation and the explanatory power of the byproduct theory.

