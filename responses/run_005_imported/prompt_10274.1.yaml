prompt: |-
  I'm about halfway through a generation-ship novel, and there's a subplot set in the ring section of the ship that spins to fake gravity for the crew, so for the last few weeks I've been reading way more about rotational mechanics than is healthy for a book that's ostensibly about family secrets and a mutiny. Somewhere in there I re-read the classic Newton's bucket bit — the one where the water climbs up the sides once the bucket's really spinning — and brought it up at dinner with two friends, Ilana (who did a masters in history and philosophy of science before going into consulting) and Marcus (an actual physicist, though he insists he's forgotten all his GR). They ended up arguing about it for the rest of the night and neither would concede, so I thought I'd bring you the transcript instead of trying to referee it myself.

  It went roughly like this. (1) Ilana said the bucket settles things in Newton's favor: the water only goes concave once it's genuinely spinning, regardless of how it's moving relative to the bucket itself — early on the bucket spins and the water doesn't, later the water spins right along with the bucket — so there has to be some absolute space that the water's real spin is ultimately being measured against. (2) Marcus came back with the Mach line: it's not absolute space doing the work, it's rotation relative to all the rest of the matter in the universe (the "fixed stars," as the old phrase goes), and if you deleted everything else in the cosmos there'd be nothing left for the water to spin relative to — so the bucket by itself can't tell absolute space apart from rotation-relative-to-everything-else. (3) Ilana's comeback was that general relativity actually settles this against Mach, since GR allows a single rotating body out in otherwise empty space to still drag inertial frames around with it — no distant matter required — so "relative to what other matter" can't be the whole story, and something like spacetime structure itself has to be doing real work. (4) Marcus granted that but said it doesn't hand the debate to old-fashioned substantivalism either, because of the hole argument: if spacetime points are genuine individuals in their own right, independent of what's happening at them, GR's diffeomorphism invariance lets you generate two "different" solutions out of the exact same physical setup, which is a vicious kind of indeterminism — so anyone who wants to keep believing in substantival spacetime after GR has to retreat to some thinner "sophisticated" version, and that's a seperate debate from the one about rotation that Ilana thinks she just won. (5) Ilana's closing shot was that a thinner substantivalism is still substantivalism — spacetime is still a real thing over and above bodies and their relations — so the goalposts moved, but Marcus still hasn't actually vindicated relationism about anything.

  Could you go through this move by move instead of just picking an overall winner? For each of the five numbered claims I'd like a score from -2 (clearly wrong) to 2 (clearly right), with 0 meaning something like "reasonable but importantly incomplete" — give me those as a JSON object first, keys "1" through "5" — and then a couple sentences under each explaining the score. And if you think Ilana and Marcus are each missing something, or quietly talking past each other by the end, I'd like to hear about that too.
