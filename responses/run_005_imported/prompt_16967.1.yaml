answer: |-
  Here’s the case for "team reasoning" as a solution to the voting paradox, argued rigorously for a purely self-interested voter who rejects civic duty and expressive satisfaction:

  ### The Core Argument: Shifting the Unit of Rationality
  **Your brother-in-law’s error isn’t math—it’s ontology.** He assumes the lone individual is the only possible unit of rational agency. But in strategic interdependence (where my payoff depends on others’ actions), individual causal reasoning *fails*. Voting isn’t a lottery ticket; it’s a **coordination problem among allies**. The rational question isn’t "Will *my* vote decide it?" but "What happens if *all of us like-minded voters* reason like me?"

  ### Step-by-Step Rationale for the Self-Interested Voter
  1.  **The Collective "We":** Imagine you support Candidate A. Define the group: "All voters who prefer A to B by more than the cost of voting." This group has a shared interest: electing A. The outcome depends on *collective* action.
  2.  **The Fatal Flaw of Individualism:** If every A-supporter thinks, "My vote won’t matter," *all abstain*, and A loses. This is a self-fulfilling prophecy. Individual rationality, when universally applied, guarantees the worst outcome for the group (and thus for each member).
  3.  **Team Reasoning as Strategic Necessity:** A self-interested voter should ask: *"What if every member of my group* followed this rule?" Rationality requires adopting the perspective of the group’s objective. You choose the *rule* that, if followed by all allies, maximizes *your* benefit:
      *   **Rule 1 (Abstain):** If all follow, A loses. Your payoff: 0 (no cost, but worse outcome).
      *   **Rule 2 (Vote if Cost < Expected Group Benefit):** If all follow, A wins if the group is large enough. Your payoff: (Benefit of A winning) - (Cost of Voting).
      *   **Comparison:** Rule 2 yields a higher payoff *if the group is pivotal*. Following Rule 2 is rational *because* it's the rule you want *everyone else like you to follow*. Your individual vote is your contribution to executing this superior group strategy.

  4.  **Why This Isn't Wishful Thinking:** This isn't assuming others *will* vote; it's recognizing that *your own reasoning must be consistent with the reasoning you prescribe to your allies*. It’s a Nash Equilibrium for the group: if everyone in the group believes voting is the rational rule *for the group*, then each individual, acting as an agent *of* the group, finds voting rational. Defecting (abstaining) while hoping others vote is irrational *if* you demand your reasoning be universalizable within the group.

  ### Why This Isn't Civic Duty or Expressivism in Disguise
  *   **vs. Civic Duty:** Civic duty adds a *moral* or *psychological* payoff. Team reasoning requires **no intrinsic value** from voting. The payoff is purely instrumental and self-interested: the policy benefit from your candidate winning. You vote because it's the *strategically necessary* action within the group's plan to achieve that benefit.
  *   **vs. Expressivism:** Expressivism says voting is *consumption* (like cheering). Team reasoning treats it as *production* (like contributing to a team effort). Expressivism doesn’t explain why people care about winning; team reasoning *centers* on winning as the objective. The "expressive" act is irrelevant; only the outcome matters.

  ### Why Turnout Rises in Close Races: Team Reasoning's Triumph
  This is *strong* evidence *for* team reasoning and *against* individual pivotality:
  1.  **The Signal of Pivotal Groups:** Close polls signal that *the group* (not the individual) is pivotal. When polls show a tie, it means the "A-Supporters Group" is large enough that *if* it turns out, it *will* win. This makes Rule 2 ("vote if cost < benefit") clearly superior to Rule 1 ("abstain") *from the group's perspective*.
  2.  **Urgency & Coordination:** Close races heighten awareness that *collective action is needed now*. Voters aren't recalculating their microscopic pivot probability; they're responding to the signal that *their group's effort is decisive*. Campaigns scream "Every vote counts!" not as a claim about individual causality, but as a call to *group mobilization* – precisely what team reasoning predicts.
  3.  **Contrast with Individual Pivotality:** If voters cared *only* about their individual chance of being decisive, turnout spikes in close races would be *irrational*. The individual probability, while higher in a close race, remains astronomically small (e.g., 1 in 10 million instead of 1 in 100 million). The cost of voting (time, effort) still vastly outweighs the expected benefit (Benefit * 10^-7). **The surge in turnout only makes sense if voters are responding to the significance of the *collective* effort, not their individual causal power.**

  ### Addressing the Skeptic: Why Isn't This Just Another Trick?
  *   **It’s Rooted in Game Theory:** Team reasoning (or "collective agency," "we-thinking") is a formal approach to interdependent decision-making (Sugden, Bacharach, Gold). It solves coordination failures in public goods games precisely where individualism fails. Voting is a canonical example.
  *   **Self-Interest Remains Paramount:** The voter cares *only* about the outcome benefiting them. Team reasoning is the *instrumentally rational strategy* to achieve that outcome when success depends on coordinated action by others who share the same interest. It’s rational *because* it works when individualism doesn’t.
  *   **The "Magic" is Coordination, Not Mysticism:** The shift isn't denying reality; it's recognizing that in multiplayer games, successful strategies must account for the reasoning of similarly situated players. You vote because if everyone like you uses the same reasoning, you collectively achieve your shared goal. Abstaining guarantees failure.

  **Conclusion:** Your brother-in-law is trapped in an individualist illusion. Voting isn't irrational because of low pivot probability; low pivot probability is a *consequence* of the group-level coordination that makes democracy function. For the purely self-interested voter, recognizing their membership in a pivotal group and adopting the strategic perspective of that group ("What if we all do this?") transforms voting from a futile gesture into the rational execution of a collective winning strategy. The surge in close races isn't a puzzle; it's proof that voters intuitively grasp this collective logic, even if they can't articulate the game theory. They vote because they understand, at some level, that *"we" need to do this*.
