   Now, the second part: is there a principled place to stop?

   Marcus's regress argument (from outcome luck to constitutive luck) is a challenge to the very possibility of moral responsibility. Nagel, in his paper, concludes that the problem of moral luck seems to lead to skepticism about moral responsibility.

   However, there are responses:

   1. **Compatibilism**: Some philosophers (like Hume) argue that we can hold people responsible for actions that flow from their character, even if that character was shaped by factors beyond their control. We stop at the level of the agent's character and choices. The idea is that we are responsible for actions that express our character, regardless of how we got that character.

