   - The manager is evaluating Marcus not just on the bug but on the impact of the bug. The manager might be thinking: "I need to hire someone who won't cause such problems." But note, the bug was the same as Claire's. However, the outcome (hundreds of corrupted schedules) is a fact that the manager cannot ignore. The manager is also evaluating the coder in the context of the real-world consequences of their actions, which are partly luck-laden.

