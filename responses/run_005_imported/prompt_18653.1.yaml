   One might argue that the outcome luck (whether the bug was triggered) is external to the agent, while the constitutive luck (being a careful or careless coder) is internal. But internal factors are still subject to luck. 

   Alternatively, we might say that we hold people responsible for their actions (which are under their control at the time) and not for the outcomes (which are not). But then the reference letters should not have differed. 

   However, note that the manager's letter for Marcus mentioned "the incident", which is the outcome. If the manager had written about the bug without the outcome, then it would have been the same as Claire's. But the outcome is a fact that the manager witnessed and that had consequences for the company.

   So, in practice, it's hard to separate. 

   Conclusion on Marcus's challenge: There is no easy principled place to stop that fully preserves moral responsibility without any luck. The problem of moral luck is a deep one and remains unresolved. 

   However, one might try to draw the line at the agent's conscious choices and efforts. We hold people responsible for what they intentionally do and for the efforts they make (like trying to check edge cases) even if those efforts are influenced by luck. But Marcus would say: "Why stop there? The effort I put in is also a product of my character and circumstances."

   So, Claire is faced with a dilemma: either accept that outcome luck can sometimes justifiably affect moral judgment (thus partially conceding to Marcus) or bite the bullet and say that we should never judge based on outcomes (but then she must also accept that we cannot judge based on character either, which leads to the regress). 

   Alternatively, she might try to argue that there is a difference in kind between outcome luck and constitutive luck. For example, we might say that we are responsible for our character because it is "ours" in a way that the outcomes are not. But this is controversial.

   Given the state of the philosophical debate, there isn't a clear consensus on a stopping point. So Claire might have to admit that her first move cannot be fully justified without also accepting that we must ignore constitutive luck, which is very counterintuitive.

   However, note that in everyday practice, we do hold people responsible for their character and choices and not (only) for outcomes. We might blame a drunk driver who kills someone more than one who doesn't, but we still blame the one who didn't kill someone (just less). And we blame people for being careless even if no harm results.

