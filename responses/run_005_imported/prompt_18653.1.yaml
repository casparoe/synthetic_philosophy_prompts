   In the end, the philosophical problem stands: there is no clear, non-arbitrary place to stop the regress. Claire's position is consistent but leads to a radical conclusion (no moral responsibility at all). Marcus's position accepts moral luck but preserves our everyday practices, even if they are somewhat unfair.

   Therefore, to answer the question: there is no universally agreed-upon principled place to stop. The debate continues.

   But note: the problem of moral luck does not necessarily lead to the abandonment of moral responsibility. Many philosophers try to find a middle ground. For example, we might accept that we are responsible for our actions and character, even if they are influenced by luck, because that's what it means to be a responsible agent in a world with luck.

