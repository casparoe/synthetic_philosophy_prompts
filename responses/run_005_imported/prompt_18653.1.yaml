   3. **Pragmatic Stopping Point**: We might decide that for practical reasons (deterrence, incentives, etc.) we hold people responsible for outcomes, even if it's luck-laden. But that doesn't solve the fairness issue.

   4. **Accepting Moral Luck**: Williams, in his discussion, suggests that we cannot entirely eliminate the role of luck in our moral judgments. We might have to live with a certain amount of inconsistency.

