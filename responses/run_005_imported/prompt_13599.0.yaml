  Okay this one's pretty specific but it's for my "Religion and the Victorian Novel" seminar (it's cross-listed with Philosophy) and I've been stuck on it since section yesterday. We just spent two weeks on George Eliot -- her Feuerbach translation, some of the letters, and Silas Marner -- and my professor brought up that anecdote from FW Myers about Eliot walking with him in the Fellows' Garden at Trinity, where she supposedly went through the three words "God, Immortality, Duty": the first two she called basically unbelievable and inconceivable, but the third she insisted was absolute and peremptory, no room to negotiate. So the position is something like: no personal God, no afterlife, and yet you're still completely bound by duty.

  What's bugging me is that my professor also mentioned, kind of in passing (I haven't gone and tracked down the exact page myself), that Nietzsche actually names Eliot specifically in Twilight of the Idols as his go-to example of English thinkers who think they can chuck out the Christian God and just leave Christian morality standing there on its own, like the two were never really load-bearing on each other. I want you to actually put these two things in the ring together instead of just summarizing each one: Eliot's specific version of "duty survives even though God and immortality don't," which is built out of Feuerbach's idea that God is really just humanity's own best qualities projected outward, plus whatever she's borrowing from Comte's Religion of Humanity, plus the whole ethic of sympathy that runs through her novels -- versus Nietzsche's charge that this is basically a shell game, that Christian morality was never actually free-standing and can't survive loosing the theology that used to authorize it. Does Eliot's version have the actual philosophical resources to answer that charge, given what her humanism is built out of, or is she basically the textbook case Nietzsche thinks she is? Don't just lay out both sides evenly -- pick one and defend it using the specifics of her position, not a generic "can secular ethics survive the death of god" essay.
