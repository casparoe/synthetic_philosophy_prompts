prompt: |-
  ok i've been kind of obsessed with the ellsberg paradox lately (no formal background here, just been reading about decision theory on my own for fun). you know the setup - one urn has exactly 50 red balls and 50 black balls, the other urn also has 100 balls but red and black in some unknown ratio, could be 99 red for all you know. ask people to bet on red and most will pick the known urn. then ask them to bet on black and they'll pick the known urn AGAIN, which is kind of nuts because there's no single probability you could personally believe about the mystery urn that makes both of those picks rational at the same time - thats basically the whole "ambiguity aversion" thing.

  anyway i feel like there's a genuinely good joke hiding in there somewhere but i can't land it myself. can you write one? it has to actually work on someone who already gets what ambiguity aversion is, so the punchline needs to hinge on the real logic of the paradox (like the "no consistent probability" bit, or the known-unknowns vs unknown-unknowns angle), not just be a generic "look at these irrational nerds" joke that could apply to literally any cognitive bias.
