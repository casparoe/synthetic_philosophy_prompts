  The second part discusses the balance between hiddenness and revelation. Too much light (clear evidence) would lead to arrogance; too much darkness would cause despair. Pascal's God intentionally balances both to foster humility and hope. This is where Jansenist theology really comes in—humans are corrupt and need grace, but must recognize their need first. 

