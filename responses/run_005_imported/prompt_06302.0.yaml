  Comparing to Schellenberg: Pascal isn't addressing the epistemic access of seekers but the spiritual condition of humanity. Schellenberg focuses on belief accessibility, Pascal on moral and spiritual preparedness. So they're answering different questions. The user's hunch about Jansenist influence is spot on—human depravity and the necessity of grace underpin Pascal's view. 

  The user might also appreciate the signal-processing analogy. Like faint photometry, divine hiddenness requires discerning a signal in noise, where the noise (obscurity) is necessary for proper detection (humility). This could resonate with their background. 

