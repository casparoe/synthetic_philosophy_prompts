answer: |-
  ## The Metaphysical Standing of Omissions: Settling the Cause

  The debate over omissions as causes isn't merely academic; it strikes at the heart of how we understand agency, responsibility, and the structure of the world. While both counterfactual and process theories offer coherent frameworks, neither fully resolves the problem without significant cost. After weighing the contenders, the strongest position is that **omissions *can* be genuine causes, but only when they constitute the failure of a *sustaining mechanism* within a specific physical system.** This approach avoids profligacy by leveraging objective physical facts about dependence structures, not normative concepts like duty or statistical normalcy. Here's the case:

  1.  **The Permissive Counterfactual Account (Lewisian): Strength & Fatal Flaw**
      *   **Strength:** Elegantly captures the core intuition: If the plant *would* have lived *had I watered it*, my failure seems causally relevant. The counterfactual dependence is straightforward, mirroring positive causation (e.g., the plant dies *because* I poisoned it). It treats causation uniformly.
      *   **Cost:** Profligacy is not a minor bug; it's a fatal flaw. The counterfactual "Had X acted, Y would not have occurred" holds for infinitely many X (me, neighbor, mail carrier, Martian). Restricting candidates via "duty" or "normalcy" (Schaffer, McGrath) is ad hoc metaphysics. Duty is normative; normalcy is often statistical or context-dependent. Smuggling these into the *metaphysical* relation of causation conflates causation with responsibility or explanation. The theory sacrifices metaphysical purity to regain selectivity, rendering "omissive cause" derivative.

  2.  **The Process-Theoretic Denial (Salmon/Dowe): Strength & Fatal Flaw**
      *   **Strength:** Preserves a clear, objective, physical criterion for causation: spatiotemporally continuous processes involving conserved quantity transfer (energy, momentum). My inaction involves no such process linking me to the plant's dehydration; there's only the *absence* of a process that *would* have occurred. This cleanly blocks profligacy.
      *   **Cost:** Renders undeniable truths inexplicable. "The plant died *because I didn't water it*" seems profoundly true and distinct from "The plant died because the sun was hot." Denying this any causal status (offering only "quasi-causation" or pseudo-explanation) seems overly revisionist and fails to account for the *asymmetric dependence* the plant had on *my specific actions* within its care structure. It divorces metaphysics too sharply from powerful causal intuitions grounded in systems and dependencies.

  3.  **Beebee's Explanatory Separation: Strength & Inadequacy**
      *   **Strength:** Correctly identifies that much omissive talk serves *explanatory* purposes, especially normative ones (blame, responsibility). Separating causation (physical processes) from causal explanation (which cites omissions, absences, enabling conditions) clarifies why we cite my failure and not the Martian's – it's *explanatorily relevant* given duties/norms.
      *   **Cost:** Feels like a concession speech for metaphysics. It doesn't settle whether "I didn't water it" is *true* in a causal sense, only that it's useful for explanation. Crucially, it struggles with cases where the omission seems *physically efficacious* in virtue of a system's design. The plant *depended* on my watering as part of its maintenance mechanism; that dependence feels causal, not merely explanatory. The theory risks making causation irrelevant to explanation in precisely the cases where it seems most pertinent.

  4.  **Duty/Normalcy Restrictions: Pragmatism, Not Metaphysics**
      *   **Strength:** Matches legal and everyday practice. We intuitively hold people responsible for omissions only when they had a duty or when their inaction deviated from a norm. This *works* for assigning blame.
      *   **Cost:** Offers no *metaphysical* solution. It answers "When do we *treat* omissions as causes (for responsibility)?" not "*Are* omissions causes?" Basing the causal relation itself on duty or normalcy makes causation inherently normative or contextual, undermining its objective physical basis. The lawyer's perspective solves a social problem, not a metaphysical one.

  **The Sustaining Mechanism Solution: Omissions as Failed Sustenance**

  The path forward integrates insights while avoiding fatal flaws. Causation involves more than just initiating processes (kicks); it crucially involves *sustaining* them (preventing stops). Many systems persist by the continuous or periodic operation of maintenance mechanisms.

  *   **The Core Thesis:** An omission is a genuine cause of an outcome when:
      1.  **A Sustaining Mechanism Exists:** There is an established physical system (S) whose persistence or proper function *objectively depends* on the periodic or continuous operation of a specific mechanism (M).
      2.  **The Omission is M's Failure:** The omission consists precisely of the failure of M to operate when required by S.
      3.  **Counterfactual Dependence Holds:** The outcome (the failure of S) counterfactually depends on the failure of M.

  *   **Application (The Philodendron):**
      *   **Sustaining Mechanism (M):** The mechanism supplying water to the plant. This mechanism *objectively depends* on *my periodic action* (watering) within the established system of its care (pot, soil, location in my office). This dependence isn't normative; it's a physical fact established by the plant's biological needs and the *actual setup* – I placed it there, I have historically watered it, it has no autonomous water source. Its survival *physically relies* on my intervention.
      *   **Omission:** My failure to perform the watering action required by M.
      *   **Dependence:** The plant's death counterfactually depends on *my* failure. Had *I* watered it (fulfilling M), it would (very likely) have lived.
      *   **Blocking Profligacy:** Why isn't the mail carrier or Martian a cause?
          *   *No Sustaining Mechanism:* There is no established physical system where the plant's survival *objectively depends* on the mail carrier's actions. The mail carrier was never part of its maintenance structure. Their potential action is purely hypothetical, not a failure within an *actual* sustaining mechanism.
          *   *No Failed Role:* The mail carrier didn't *fail* to operate a mechanism they were part of; they simply weren't part of it. The dependence on *them* is not counterfactually robust in the same way – it relies on inventing a *new* mechanism, not the failure of an *existing* one.

  *   **Advantages:**
      *   **Genuine Causation:** The omission (failure of M) is a real difference-maker. It disrupts an actual physical process of sustenance. The counterfactual dependence is real and tracks a physical dependency.
      *   **Blocks Profligacy Objectively:** Selectivity comes from the *objective physical facts* about which sustaining mechanisms exist and whose actions constitute them. Duty and normalcy might *correlate* with being part of a sustaining mechanism (parents *are* the sustenance mechanism for infants), but they aren't constitutive of the causal relation itself.
      *   **Accommodates Process Intuitions:** While no *positive* process links my inaction to death, the *failure* of the sustaining mechanism *is* a physical event – the disruption of an ongoing process (the plant's hydration maintenance). The causal locus is the *breakdown* of the mechanism.
      *   **Explains Explanatory Relevance:** Why cite *my* omission? Because *I* was the operative part of the failed sustaining mechanism. The Martian isn't cited because they played no role in the actual system.
      *   **Handles Clear Cases:** Explains why a guard's failure to close a floodgate causes flooding (gate closure is the sustaining mechanism against water ingress), a thermostat's failure causes overheating (thermostat is the sustaining mechanism for temperature regulation), or my heart's failure to beat causes death (heart is the sustaining mechanism for blood circulation).

  **Verdict:**

  Omissions *are* genuine causes, but **only when they constitute the failure of a specific, objectively existing sustaining mechanism within a physical system.** The profligacy worry is resolved not by context or norms, but by the *metaphysical constraint* of requiring the omission to be the failure *of a component within an actual physical dependence structure* responsible for maintaining the status quo. My failure to water the office philodendron *is* a cause of its death because I was objectively part of its water-supply sustaining mechanism. The mail carrier's failure is not, because no such mechanism incorporating them existed. This grounds omissive causation firmly in the physical world and its structures of dependence, satisfying the core insights of counterfactual dependence while respecting the process theorist's demand for objective constraints and avoiding the pitfalls of normativity or explanatory evasion. The metaphysics *can* bear the weight.
