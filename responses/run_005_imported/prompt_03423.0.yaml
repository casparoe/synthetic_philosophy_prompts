  This has been bugging me for two weeks. At my family's Sunday dinner, my uncle Dave and my cousin Mei (a few years into a genetics PhD) argued about those "dire wolf" pups Colossal Biosciences unveiled -- wolves gene-edited to resemble the ice-age dire wolf, extinct for about 10,000 years.

  Dave: they've got the size, skull, jaw, and coat -- basically the whole look -- so they just are dire wolves.

  Mei: genetically they're still 99%+ ordinary gray wolf, since the company only edited about 20 spots on a dozen-ish genes, and real dire wolves split from gray wolves some 5-6 million years ago, distant enough to get their own genus. To her these are gray wolves in costume.

  Dave: plenty of species everyone accepts as distinct are also ~99% genetically identical to their nearest relative (humans and chimps, for instance), so "basically the same DNA" can't be what settles this.

  Mei: fine, so what's the actual test then? Because "looks the part" can't be enough either -- a wolf-looking dog would have to count as a real wolf too.

  Dave's closer: she still hasn't given an actual test either, she's no less confident than he is, and being the "science person" doesn't automatically make her right.

  Nobody budged and it ate 20 minutes of dinner. Can you go through it move by move -- who's actually right at each point, not just who "won" -- and tell me if there's a real principled answer here or if its genuinely this unsettled?
