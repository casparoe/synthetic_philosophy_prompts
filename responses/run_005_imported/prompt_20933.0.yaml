answer: |-
  This is a beautifully framed question that cuts to the heart of a persistent moral puzzle. Your instinct about the distinction between the *truth* of the criticism and the *standing* to deliver it is crucial. Let's break down Wallace and Cohen on hypocritical blame, pinpoint their agreements and disagreements, and see how they handle your dinner-table example.

  ## Core Arguments: Wallace vs. Cohen

  1.  **R. Jay Wallace: Blame as Second-Personal Address & the Demand for Reciprocal Equality**
      *   **Core Idea:** Blame isn't just stating a fact ("X is wrong"). It's a *second-personal act* – a form of moral address where the blamer implicitly *demands* that the blamed acknowledge the wrong, feel remorse, and hold themselves accountable. This act presupposes a background of *reciprocal recognition*: both parties are equally subject to the norm being invoked and acknowledge each other as competent moral agents bound by it.
      *   **Hypocrisy's Problem:** The hypocrite, by violating the very norm they invoke, demonstrates that they *do not genuinely hold themselves accountable* under that norm in the same way they demand the blamed person does. They treat the norm as binding *on you* but optional *for them*. This violates the fundamental reciprocity required for the second-personal stance of blame to be valid. It's not just rude; it renders the *act of blaming itself* defective or illegitimate because it presupposes an equality that the hypocrite denies in practice.
      *   **Consequence:** The hypocrite lacks the *moral authority* to make the demand inherent in blame. Their blame is *false* not in its factual claim ("corruption is wrong"), but in its *performative* aspect – the act of demanding accountability from another while exempting oneself. It fails *as blame*. Wallace might say the hypocrite has forfeited the *right* to participate in this specific moral exchange under this norm.

  2.  **G. A. Cohen: Separating Message (Content) from Messenger (Act of Delivery)**
      *   **Core Idea:** We must sharply distinguish:
          *   **The Content/Message:** The propositional claim about the wrongness of the act and the blameworthiness of the agent ("This corruption is wrong, and you are blameworthy for it").
          *   **The Act of Delivery/Enunciation:** The specific act of *uttering* that blame *by this particular person* in this context.
      *   **Hypocrisy's Problem:** Hypocrisy primarily contaminates the *act of delivery*, not the *content*.
          *   **Content Can Be True:** The message ("corruption is wrong, you are blameworthy") can be entirely true and accurate regardless of the blamer's own conduct. The wrongdoer *is* still blameworthy.
          *   **Delivery is Compromised:** The hypocrite, by their own violation, undermines their *standing* or *credibility* to *be the one* delivering this message *effectively* or *appropriately*. It makes their act of blaming *inappropriate*, *suspect*, *hypocritical* (in the colloquial sense), and potentially ineffective. It might also involve a kind of bad faith or lack of sincerity.
      *   **Consequence:** The hypocrite lacks the *standing* or *credibility* to deliver *this specific act of blame* effectively or appropriately. The *truth* of the condemnation remains, but *this particular utterance* of it by *this person* is compromised. Cohen emphasizes that the wrongdoer's blameworthiness persists independently of the blamer's hypocrisy.

  ## Agreement and Disagreement: A Summary Table

  | Feature              | Wallace's View                                    | Cohen's View                                     | Agreement?                            |
  | :------------------- | :------------------------------------------------ | :----------------------------------------------- | :------------------------------------ |
  | **Core Problem**     | Violation of reciprocal moral equality required for blame as address | Contamination of the messenger/delivery, not the message | **Agree:** Hypocrisy undermines the blamer's position |
  | **Target of Problem** | The *act of blaming itself* is rendered defective/invalid | The *particular utterance* by *this speaker* is compromised | **Disagree:** Scope of the problem (act vs. utterance) |
  | **Status of Blame's Content** | Implicitly challenged by the performative failure | Remains entirely true and valid                  | **Disagree:** Wallace's performative failure casts doubt on the sincerity/validity of the *demand* |
  | **Standing Lacking Means...** | Cannot legitimately make the moral *demand* inherent in blame | Shouldn't be the one to *deliver* this criticism now | **Partial Agree:** Both see a barrier, but of different kinds |
  | **Analogy**          | A judge secretly guilty of the crime they're sentencing - undermines the legitimacy of the verdict | A known liar correctly identifying a thief - the accusation may be true, but the liar lacks credibility | **Illustrates Difference**          |

  **Key Disagreements:**

  1.  **Does hypocrisy make the *blame itself* false/invalid?**
      *   **Wallace:** Yes, in a performative sense. The act of demanding accountability while exempting oneself is incoherent and thus fails *as blame*. The hypocrisy directly undermines the validity of the moral address.
      *   **Cohen:** No. The *content* of the blame ("X is wrong, Y is blameworthy") remains true. The hypocrisy only undermines the *credibility* and *appropriateness* of *this person* delivering that true content *at this time*.
  2.  **What exactly is "lost"?**
      *   **Wallace:** The *moral authority* or *right* to make the specific demand of accountability inherent in blame under this norm. It's about the *invalidity of the act*.
      *   **Cohen:** The *credibility* or *standing* to be an *effective or appropriate messenger* for *this particular act* of condemnation. It's about the *compromise of the delivery*.
  3.  **Does hypocrisy affect the *blameworthiness* of the original wrongdoer?**
      *   **Wallace:** The hypocrisy doesn't *lessen* the original wrongdoer's blameworthiness *directly*, but it can create a situation where the *valid demand* for their accountability isn't being made *by this person*. The focus shifts to the hypocrite's failure.
      *   **Cohen:** Explicitly and clearly: No. The original wrongdoer's blameworthiness is entirely independent of the hypocrite's conduct. "Two wrongs don't make a right."

  ## Evaluation: Which Account is More Defensible?

  While Wallace offers a powerful and normatively rich account of blame's structure, **Cohen's separation of message and messenger is ultimately more defensible and practically useful**, especially in contexts like your dinner-table example.

  **Why Cohen Prevails:**

  1.  **Preserves Moral Truth:** Cohen correctly insists that the *wrongness of corruption* and the *blameworthiness of the corrupt official* are objective facts independent of the critic's behavior. Silencing criticism *solely* because the critic is hypocritical risks letting genuine wrongdoing off the hook. The truth doesn't become false because a liar speaks it.
  2.  **Avoids Moral Blackmail:** Wallace's view, taken strictly, can empower wrongdoers. A corrupt politician could deflect *any* criticism by pointing to *any* flaw in the critic ("You jaywalked last week! You can't demand accountability from me!"). Cohen allows us to say, "Yes, I may be flawed/hypocritical on other matters, but *your act* is *still* corrupt and wrong, and *you* are *still* blameworthy for it." It prevents hypocrisy from becoming a universal get-out-of-blame-free card.
  3.  **Better Captures Nuance:** Cohen allows for degrees and context. A minor, unrelated hypocrisy might minimally undermine standing regarding a major corruption scandal. A directly parallel, egregious hypocrisy utterly destroys credibility for *that specific topic*. Wallace's "invalid act" is more binary.
  4.  **Aligns with Intuition about "Truth":** We instinctively feel that the hypocrite *exposes a truth* about corruption even through their failure. Their *message* resonates *because* it's true, even if *they* are a poor messenger. Wallace struggles to capture this resonance of the truth itself persisting.

  **Applying Cohen to Your Dinner Example (The Corrupt Anti-Corruption Crusader):**

  *   **Cohen's Analysis:**
      *   **Message/Content:** True. The corruption the public figure condemns in others *is* wrong. Those engaging in it *are* blameworthy. This truth remains unaffected by his hypocrisy.
      *   **Delivery/Enunciation:** Deeply compromised. By secretly accepting the same favors, he demonstrates:
          *   A lack of genuine commitment to the anti-corruption norm he preaches (bad faith).
          *   A breathtaking lack of self-awareness or integrity.
          *   That his condemnations were, at best, performative or instrumental, not sincere moral address.
      *   **Standing:** He has utterly forfeited his *standing* to be the one delivering this condemnation. His act of blaming others is hypocritical, inappropriate, and lacks credibility. It may even be manipulative. Your friend's "tu quoque" is warranted *as a response to him specifically* – it rightly points out his compromised position and undermines *his* credibility *as a blamer* on this topic.
      *   **Verdict:** Your friend is right that the crusader has forfeited *his* right to criticize *others for this specific type of corruption*. However, Cohen insists your friend would be *wrong* to conclude that the crusader's *message* about corruption being wrong is now false, or that the *other corrupt officials* are now less blameworthy. The truth stands, even if this messenger is rotten.

  **Where Wallace and Cohen Yield Different Answers:**

  Consider a scenario: **A politician who accepted a single, minor, undisclosed gift years ago (which they now regret) vigorously condemns a rival for a massive, ongoing bribery scheme.**

  *   **Wallace:** Might argue the politician *still* lacks the full moral authority to issue the demand inherent in blame *under the norm against corruption*, because they violated reciprocity (they weren't holding themselves fully accountable under the same norm, even if the violation was minor/past). Their blame act is *somewhat defective*. The rival could legitimately question their standing *on this specific norm*.
  *   **Cohen:** Would likely argue that while the politician's past minor hypocrisy *somewhat undermines their credibility and standing* (making their condemnation less effective or slightly tainted), it doesn't invalidate the *truth* of their condemnation. The rival's massive bribery is still profoundly wrong and blameworthy, and the politician *can* still legitimately point that out, though their own flaw makes them a less-than-ideal messenger. The core message stands.

  ## Conclusion

  Your pushback against your friend was correct in distinguishing the *truth* of the condemnation from the *standing* of the condemner. Cohen provides the clearest framework for this: hypocrisy undermines the *messenger's credibility and appropriateness* in delivering a specific act of blame, but it does not negate the *truth* of the message or the *blameworthiness* of the original wrongdoer. Wallace's view, while insightful about the structure of blame, risks conflating the validity of the moral demand with the integrity of the demander in a way that can inadvertently protect wrongdoers and obscure moral truths. In the messy reality of politics and human failing, Cohen's separation allows us to acknowledge the stench of hypocrisy without letting it permanently bury the truth it sometimes, ironically, exposes. The corrupt anti-corruption crusader's condemnations were true, but he was the last person on earth with the right to utter them.
