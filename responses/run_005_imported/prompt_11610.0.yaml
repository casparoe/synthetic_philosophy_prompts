  Let me trace the logical conflict step by step. Futarchy's legislature must define "national welfare" to make prediction markets operable. But for Hayek, this assumes: (1) ends are commensurable (can trade off quantitatively), (2) stable enough for markets to track, and (3) separable from beliefs about means. Hayek would likely reject all three. His subjectivism sees values as emergent, contextual, and inseparable from individual knowledge.

