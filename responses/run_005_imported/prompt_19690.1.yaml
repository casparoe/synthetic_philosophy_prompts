  Key elements: The protagonist must be bound by two duties that arise from different moral foundations—one deontological (promise-keeping), one consequentialist (preventing harm). Neither should override the other. 

  The "Prometheus Serum" idea emerges: A doctor promises to destroy a patient's secret research that could save millions but also enable oppression. Both choices cause irrevocable harm: breaking trust vs enabling tyranny. 

  To defend against Donagan: Argue that moral systems aren't monoliths; they contain plural, equally valid principles that can collide. The residue isn't just guilt—it's the loss of moral integrity from violating a core commitment. 

  User's deeper need: They want the dilemma to haunt the character beyond the plot. So the residue should shape their identity—e.g., becoming an oath-breaker or the architect of oppression. 

  Name the character "Elara Voss" for gravitas. Her specialty (neuro-ethics) mirrors the dilemma's themes. The serum's duality (cure/weapon) reflects the choice's impossibility. 

  Final check: Avoids clichés? Yes. Creates lasting residue? Yes—either path erodes her self-concept. Defensible against "no real dilemma" critiques? Yes, by showing duties from separate moral spheres. 

