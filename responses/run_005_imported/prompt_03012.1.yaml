  Alright, here's a joke crafted specifically for your class context, hitting the Schellenberg terminology and the epistemic distance response, designed to land with your classmates and give Marcus a playful nudge:

  **The Joke:**

  > "So, Marcus is going to tell us all about this perfectly loving God who *really* wants a relationship with us, right? But apparently, He's so committed to maintaining 'epistemic distance' to protect our precious free will... that He ends up ghosting even the *nonresistant nonbelievers*. Talk about taking 'playing hard to get' to divine extremes! Guess God's worried that if He actually *showed* up for coffee with someone genuinely seeking Him, they'd feel *so* coerced by His infinite love and obvious existence that their free will would just... evaporate? Sorry, sincere seekers, better luck next cosmic cycle!"

  **The Logic (For Explaining to Marcus):**

  > *This joke satirizes the epistemic distance defense by suggesting that God, in an overzealous effort to avoid *any* perceived coercion of belief (which the defense claims would undermine free will), paradoxically becomes completely inaccessible even to those most genuinely open and desiring a relationship (Schellenberg's nonresistant nonbelievers), thereby arguably failing the test of perfect love He's supposed to embody.*

  **Why it works for your class:**

  1.  **Specific Terminology:** Uses "nonresistant nonbelievers" (Schellenberg's key term) and "epistemic distance" (the specific counter-argument) correctly.
  2.  **Engages the Core Tension:** Highlights the inherent conflict Schellenberg points out – a perfectly loving God vs. the existence of sincere non-believers – and directly targets the *weakness* perceived in the epistemic distance response: that it prioritizes a specific definition of freedom (freedom from evidence/coercion) over the apparent requirement of love (making a relationship possible for the sincere).
  3.  **Hyperbole for Humor:** Uses relatable metaphors like "ghosting," "playing hard to get," and "showing up for coffee" to exaggerate the perceived absurdity of God remaining hidden from someone genuinely seeking Him *because* He loves them too much to... show them He exists?
  4.  **Insider Humor:** Only people who sat through the unit will fully grasp the references and the specific critique of the epistemic distance defense embedded in the punchline. The "better luck next cosmic cycle" is a final atheistic wink.
  5.  **Trolls Marcus Gently:** It directly references his upcoming pro-theism stance ("Marcus is going to tell us...") and sets up the divine hiddenness problem as a direct challenge to the "perfectly loving God" he'll likely be defending, framed humorously as God being bad at relationships due to overthinking freedom.

  **Delivery Tips:**

  *   Deliver it with a slightly bemused, playful tone. Smile!
  *   Pause slightly after "evaporate?" for comedic effect before the "Sorry, sincere seekers..." line.
  *   When you say "Marcus is going to tell us...", gesture towards him with a friendly smirk.
  *   If Marcus looks confused or mock-offended afterward, just hit him with the "Logic" explanation above with a grin. "It's just philosophy, Marcus! Schellenberg's logic, not mine!"

  Good luck with your presentation! This should get a chuckle from those who know the material and set the stage for your argument.
