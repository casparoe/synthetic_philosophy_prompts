  Endgame: They hunt for a concrete case where their stances diverge. I’ll use "believing a stranger in an unfamiliar city." Ravi demands cues (confidence, uniform); Alia trusts unless red flags. The twist? *Both* might agree in practice—showing how messy philosophy gets on the ground.  

