answer: |-
  Your intuition that this situation is unfair **is tracking something real and ethically significant**, even absent conclusive evidence about the actual property line. The unfairness stems from the **procedural injustice** and the **power dynamics** at play, not merely the outcome itself. Here’s a breakdown of why your feelings are justified:

  ### 1. **Procedural Unfairness: Might Makes Right**
     - **The "Act First, Enforce Later" Problem**: Your neighbor didn’t establish a truth; he imposed a fait accompli by exploiting your aversion to cost and conflict. This reduces property rights to a contest of who is more willing to wield power unilaterally. As philosopher Thomas Hobbes observed, without neutral arbitration, force becomes the sole arbiter of disputes. This feels unfair because it replaces justice with coercion.
     - **Circumventing Due Process**: A fair resolution would involve a neutral third party (e.g., a surveyor, mediator, or court) evaluating evidence. Your neighbor bypassed this by acting unilaterally, denying you a voice in the process. Even if the outcome *might* be correct, the method corrupts it.

  ### 2. **The Moral Weight of Established Practice**
     - **The "Status Quo" Baseline**: The old fence represented a long-standing, mutually accepted boundary (even if imperfect). By tearing it down and moving it, your neighbor disrupted a practical equilibrium. Ethically, there’s value in respecting existing arrangements—especially when ambiguity exists—to avoid exactly this kind of coercive opportunism. Locke’s labor theory even suggests your maintenance of that land could imply a moral claim, independent of deeds.

  ### 3. **Exploiting Asymmetry in Power**
     - **Weaponizing Your Rationality**: Your neighbor knew you’d weigh the cost of a lawsuit against the value of the land. He exploited this rationality by acting in bad faith, effectively saying, *"I’ll steal $500 from you, knowing you won’t spend $5,000 to get it back."* This isn’t a good-faith dispute—it’s extraction via intimidation. As legal scholar Robert Cover noted, law without the capacity for enforcement is hollow; your neighbor weaponized that hollowness.

  ### 4. **The Sour Taste of "Legal Truth" vs. "Actual Truth"**
     - Even if the law *might* side with your neighbor, his confidence isn’t proof. Property law often relies on:
       - **Adverse possession**: If you used the land openly for years, you might own it, but timelines vary by state.
       - **Boundary by acquiescence**: Long acceptance of a fence line can legally establish it as the boundary.
       - **Estoppel**: If your neighbor previously treated the fence as the boundary, he can’t suddenly reverse course.
     - By avoiding a survey, your neighbor avoids testing these principles. What "wins" isn’t truth, but his willingness to gamble you won’t fight.

  ### Why Your Friends Are Half-Right (But Miss the Point)
  - **Friend 1**: Correct that neither claim is *provably* better—but wrong to ignore how the resolution was forced. Disputes aren’t resolved in a vacuum; power matters.
  - **Friend 2**: Correct that unfairness exists—but it’s not about the unknown boundary. It’s about **how** the uncertainty was exploited.

  ### What This Reveals About Fairness & Enforcement
  Your situation exposes a harsh truth: **enforceability often trumps fairness when systems are inaccessible**. In a just world:
  - Fair processes (e.g., low-cost mediation, accessible surveys) would resolve ambiguities.
  - Power imbalances wouldn’t dictate outcomes.
  - Long-standing practice would hold weight.

  But in reality, the cost of justice can make it unattainable, rewarding those who act aggressively. This doesn’t make your neighbor’s claim "valid"—it makes it **imposed**. Your grievance isn’t about losing land; it’s about losing agency.

  ### Practical Advice: Reclaiming Dignity
  While lawsuits may be impractical, you can:
  1. **Document everything**: Photograph the new fence, save old photos of the original, note conversations.
  2. **Send a formal letter**: State you disagree with the boundary but won’t litigate. This preserves your claim if he encroaches further.
  3. **Consider small claims court**: If the fence damaged your property (e.g., destroyed landscaping), sue for damages—it’s cheaper and challenges his impunity.
  4. **Reframe the win**: Your restraint isn’t weakness; it’s refusing to be drawn into a futile war. You’ve preserved peace and resources—a moral victory.

  ### In Short
  Your neighbor hasn’t proven his claim—he’s enforced it through coercion. The unfairness lies in the **process**: unilateral action, exploitation of power asymmetry, and the subversion of fair resolution. That’s why it feels wrong. Absent evidence, acting first *is* what separates his claim from yours—but that’s a failure of the system, not a validation of his righteousness. You’re not wrong to feel wronged.
