prompt: |-
  so i've been on a nietzsche kick lately (mainly ecce homo and twilight of the idols) and the thing that keeps jumping out at me is how obsessed the guy was with diet and digestion. theres a whole part in ecce homo where he says nutrition and climate matter more than pretty much any abstract moral question, and he goes off on german beer culture for making the whole national "spirit" heavy and dull. then in twilight of the idols he roasts some old italian guy (cornaro? i think thats the name) who wrote a famous book crediting his super restrictive diet for his long healthy life — nietzsche's point is that cornaro got cause and effect backwards, that a naturally slow metabolism was the real cause of both the diet and the longevity, and that anyone else copying his diet without having his constitution would just wreck themselves.

  given how much he clearly thought about all this, what do you reckon he'd actually say about modern diet/wellness culture — keto, intermittent fasting, the seed oil panic, protein-maxing gym culture, gut biome and probiotics stuff, guys like bryan johnson turning their whole body into a lifelong experiment? is all that just a modern army of cornaros to him? and isnt there a real tension in nietzsche himself being super fussy and prescriptive about his own food and coffee/tea rituals, given how much his philosophy elsewhere trashes ascetic self-denial? i want the actual specifics of what he'd zero in on and criticize, not just generic "become the overman" vibes.
