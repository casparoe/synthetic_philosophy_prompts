prompt: |-
  Ok so this has been bugging me for actual months now. My mom's been doing keto for like three years and my dad went full vegan a while back, and every single dinner they end up going at it about who's diet is "objectively" healthier, each of them scrolling through their phone pulling up random studies to back themselves up. It's not like either of them is just being difficult for the sake of it either, they both genuinely seem to believe they're right. I'm in debate club at school so lately I've started paying attention to HOW they argue instead of just tuning it out, and honestly they're both pretty good at it - whenever one of them makes a point the other always has a comeback ready, a different study, a reason the first study was flawed, whatever, and it just keeps going back and forth for like twenty minutes straight. The problem is I don't actually know enough about nutrition science to check any of the studies myself, so I have no way of telling if whoever "won" that round of dinner table debate is actually right or just better at arguing under pressure.

  My health teacher mentioned once that nutrition studies are notoriously easy to cherry pick and that even real scientists disagree about this stuff a ton, which honestly made it worse for me lol. So I guess my actual question is: when you can't personally verify the underlying facts and all you can do is watch two confident people poke holes in each other's points back and forth, is there an actual reliable way to figure out who's closer to being right? Or is judging a debate like that basically doomed to just reward whoever's more persuasive instead of whoever's actually correct? Not looking for diet advice btw, more wondering if theres a smart method for this kind of thing or if I'm just stuck taking someone's word for it.
