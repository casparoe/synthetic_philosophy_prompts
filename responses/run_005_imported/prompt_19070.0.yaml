  my uncle has gotten really into the whole UAP cover-up thing since those whistleblower hearings, and it's made family dinners kind of exhausting lately. so i've been trying to actually read up on this instead of just rolling my eyes at him, and i keep running into this "particularism vs generalism" debate in the philosophy of conspiracy theories -- people like Keeley and Coady argue you can't dismiss a belief just for being "a conspiracy theory," since real conspiracies obviously do happen (Watergate, MKULTRA, whatever), so you're supposed to judge each theory on its own specific evidence instead of writing it off because of the category it's in. but doesn't that basically mean i'm not actually entitled to be skeptical of his theory unless i personally sit down and debunk every video and document he sends me? like if particularism is right, isn't my gut sense that he's wrong just the exact kind of lazy, unearned bias these philosophers are criticizing? trying to figure out if theres an actual comeback here or if i basically have to either engage with all his "evidence" point by point or admit i'm being closed minded.
