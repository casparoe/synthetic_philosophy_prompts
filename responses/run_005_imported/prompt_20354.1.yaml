  The user wants two things: first, a clear explanation of how each test works for their respective examples, and second, a strong thesis about whether the contradiction-in-the-will test is truly formal like the first test or if it secretly relies on substantive assumptions. They're explicit that they don't want a neutral overview—they need a defensible position to build their essay around. 

