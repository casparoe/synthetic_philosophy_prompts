  First, I should map the mechanics: For contradiction-in-conception (suicide/false promising), universalizing the maxim literally destroys the condition for the action—like making promises impossible in a world where everyone lies. It's a logical explosion. For contradiction-in-the-will (talents/help), Kant argues a rational agent couldn't consistently will a world where talents rot or help vanishes because it might undermine their own future needs. 

  Now the crux: Is that second test truly formal? Many scholars (like Korsgaard) say yes—it's about coherence of willing, not happiness. But the user’s suspicion points to Wood’s critique: Doesn’t assuming agents care about future needs import anthropology? I think the stronger argument is the formal one: Kant isn’t saying you must want help, but that if you have ends (which all rational agents do), a world without help makes achieving any end impossible. That’s structural, not psychological. 

