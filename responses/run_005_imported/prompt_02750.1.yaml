  Now, suspensions. These are personal consequences. The purpose is to hold the individual accountable, provide a cooling-off period, signal the seriousness to the team, and deter future misconduct. If Dana serves the suspension, Priya avoids the consequence entirely. She plays in the big tournament, missing no games. The disciplinary intent—making Priya reflect and understand the gravity—is undermined. 

