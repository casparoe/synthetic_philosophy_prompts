  Final beat must show both positions pay a price: counterpart theory makes modality about similarity, transworld makes identity mysterious. No tidy resolution - that's the point. User wants to sit with the discomfort, hence the "few rounds" request. 

  Names: Alex for transworld (clear, direct), River for counterpart (fluid, relational). Avoid academic stiffness - "dumb multiverse video" tells me they want accessible but rigorous. Sprinkle contractions and interruptions for realism. 

