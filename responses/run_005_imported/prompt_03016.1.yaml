prompt: |-
  I've spent a long time reading blogs in the LessWrong/Overcoming Bias cluster, and one idea from that world that has stuck with me is "conservation of expected evidence": roughly, you shouldn't be able to know in advance which direction a future piece of evidence will push your beliefs, because if you were already certain some observation would confirm what you currently believe, you should in some sense be updating on that fact before you've even made the observation. I've been turning this over since jury duty last month, because something that happened there feels related, though I haven't been able to work out whether it's really the same issue or something else entirely.

  A friend of mine, Sam, was on the same jury. About two-thirds of the way through the trial, once the prosecution had laid out its case, he told me privately that he was completely convinced of the defendant's guilt. When the defense subsequently called an alibi witness, Sam admitted afterward that he'd barely registered her testimony, reasoning, as he put it, that "I already knew he did it, so whatever she said had to be mistaken or dishonest somehow, even if I couldn't say exactly how." At the time this struck me as an obviously bad way to treat what is supposed to be a juror's central job. But then it occurred to me that I do something with the same shape all the time without a second thought: if someone handed me a long, carefully constructed argument for a flat earth, I also wouldn't feel any obligation to work through it premise by premise, since I already know the earth is round and can be fairly confident in advance that the argument contains an error somewhere, whatever that error turns out to be.

  So I'm stuck on what, if anything, actually separates these two cases. Either Sam and I are both reasoning badly, or we're both reasoning perfectly well, or there's a real principle distinguishing them that I haven't managed to put my finger on. Is "I already know X, so I'm entitled to discount whatever comes in against it" ever a legitimate way to reason, and if it is, what exactly would separate its legitimate uses from Sam's?
reasoning: |-
  Okay, the user is grappling with a concept from LessWrong called "conservation of expected evidence," and they're trying to apply it to a real-life situation from jury duty. They noticed that their friend Sam dismissed an alibi witness because he was already convinced of the defendant's guilt. The user then realized they do something similar with flat-earth arguments. The question is whether both cases are flawed or if there's a distinction.

  First, I need to recall what conservation of expected evidence means. It's about not being able to predict the direction of future evidence without updating your beliefs accordingly. If you're certain that new evidence will support your view, you should have already updated your beliefs. But in practice, people sometimes dismiss evidence when they're confident. 

  The user's dilemma is whether Sam's behavior in the jury is similar to dismissing a flat-earth argument. Both involve ignoring counter-evidence, but the contexts are different. The key differences might be in the certainty level and the stakes involved. 

  In the flat-earth scenario, the user has overwhelming evidence from multiple sources: satellites, photos, physics. Their confidence is near absolute. Dismissing a flawed argument is efficient because the prior probability is so low. The cost of being wrong is negligible. 

  In Sam's case, as a juror, he's in a position that requires impartial evaluation. Legal standards demand that jurors consider all evidence presented. His prior belief was based on the prosecution's case, but he hadn't heard the defense yet. By dismissing the alibi witness without scrutiny, he failed in his duty. The stakes here are high—someone's freedom is at risk. 

  The user might be conflating epistemic rationality with practical rationality. Epistemically, both cases involve ignoring evidence, but practically, the contexts differ. The juror role imposes ethical obligations that don't apply to personal beliefs about the earth's shape. 

  Another angle is the quality of evidence. For the earth's roundness, evidence is concrete and widely verified. In a trial, evidence is presented in a controlled setting where each piece must be weighed. Sam's pre-emptive dismissal violates the legal process. 

  The user might also be concerned about hypocrisy. They see their own behavior as similar to Sam's. But recognizing the contextual differences helps justify why one is acceptable and the other isn't. The key is acknowledging that while both involve dismissing evidence, the circumstances and responsibilities differ significantly. 

  Underlying this, the user might be seeking validation that their approach to flat-earth arguments is rational, while Sam's was not. They want a clear principle to distinguish when it's okay to ignore counter-evidence. The answer lies in the level of certainty, the consequences of error, and the role-based responsibilities.
answer: |-
  Your intuition captures a profound tension in rationality—between justified confidence and the duty to remain open to evidence. The key distinction lies in **the strength of your priors, the nature of the evidence, and the context of your epistemic responsibilities**. Let's break this down:

  ### 1. **The Core Principle: Conservation of Expected Evidence (CEE)**
     - CEE states that your *current* belief should account for *all possible future evidence*. If you believe observation E would confirm hypothesis H, you must also believe that not-E would disconfirm H—and your current confidence in H must reflect this symmetry. Pre-emptively dismissing evidence violates this.
     - **Sam's violation**: By declaring the defendant guilty before hearing the defense, Sam assumed the alibi testimony *must* be flawed. He violated CEE because he didn’t allow for the possibility that the testimony *could* legitimately shift his belief. His confidence was improperly "locked in."

  ### 2. **Your Flat-Earth Example: When *Is* Dismissal Rational?**
     Your flat-earth dismissal is defensible because:
     - **Overwhelming priors**: Your belief in a round Earth rests on vast, convergent evidence (satellite imagery, physics, circumnavigation, etc.). The prior probability of a flat Earth is astronomically low.
     - **Asymmetric evidence**: A single argument—no matter how "careful"—cannot override a mountain of robust evidence. Errors in such arguments are predictable (e.g., distorted photos, misapplied physics), so you rationally expect flaws.
     - **Low stakes/No duty**: You have no obligation to engage. The cost of ignoring it is near-zero; the cost of deep engagement is high (time, effort).

  ### 3. **Sam's Jury Duty: Why It's Different**
     Sam's dismissal was irrational and unethical because:
     - **Weak priors**: No matter how compelling the prosecution's case, the defense hadn't yet presented evidence. Jurors *must* start neutral ("presumption of innocence"). Sam's confidence after hearing only one side was premature.
     - **Epistemic responsibility**: Jurors swear an oath to evaluate *all* evidence impartially. Dismissing testimony without scrutiny breaches this duty. The legal system relies on adversarial testing—each side gets to challenge the other.
     - **Stakes are extreme**: A wrongful conviction destroys lives. Ignoring counterevidence risks catastrophic error.
     - **No "convergent evidence" shield**: A trial presents a *single* narrative contest. Unlike the flat Earth (where countless independent lines of evidence agree), the jury hears only what's admitted in court. The alibi might have been genuine, but Sam didn't even check.

  ### 4. **The Distinguishing Principle: "When Can You Ignore Counterevidence?"**
     Legitimate dismissal requires **all** of these:
     - **Extraordinarily strong priors**: Your belief is backed by vast, diverse, independently verified evidence (e.g., round Earth, evolution).
     - **Predictable error modes**: You can articulate *how* counterevidence might be flawed (e.g., "Flat Earth arguments always misuse horizon curvature").
     - **No special duty to engage**: You aren't in a role requiring impartial evaluation (e.g., juror, scientist, judge).
     - **Low cost of error**: Being wrong wouldn't cause significant harm.

  Sam met *none* of these. You (in the flat-Earth case) met all.

  ### 5. **Why This Feels Similar: The "Certainty Trap"**
     Both cases *feel* alike because confidence triggers cognitive laziness. We use "I already know X" as a heuristic to avoid mental effort. This is often rational (e.g., ignoring spam emails "proving" you’ve won a lottery), but it becomes dangerous when:
     - Confidence is unjustified (Sam),
     - Counterevidence is non-frivolous (the alibi witness),
     - Or you have a duty to be fair (jury service).

  ### Conclusion
  **You’re reasoning well; Sam was not.** Your flat-Earth dismissal is a rational application of Bayesian efficiency: when counterevidence is vanishingly unlikely to override near-certainty, engagement is wasteful. Sam, however, committed a grave error by "freezing" his beliefs mid-trial, violating both CEE and his civic duty. The lesson: confidence must be *earned* through rigorous evidence, and even then, we suspend dismissal only when stakes/duties demand it. In high-stakes, role-bound contexts (like a jury), the obligation to engage overrides personal certainty.
