prompt: |-
  Every year for the past nine years, the same eight of us have taken a trip together, and choosing the destination has always been a lighthearted formality -- until this past weekend, when the planning meeting turned into a two-hour argument I'm still turning over. We had narrowed things down to four genuinely different options: a beach town, a mountain cabin, a big city, and a lake house. Each of the four has actually won outright in at least one previous year, so nobody was proposing to rule any of them out in advance. Wanting to avoid the crudeness of a simple "whoever gets the most first-choice votes wins" plurality, we asked everyone to privately rank all four from favorite to least favorite and combined the rankings with a simple points system: four points for a first choice, three for a second, and so on down to one. Partway through tallying, it came out that one friend had not ranked sincerely. By everyone's best reconstruction, he had correctly anticipated that his actual favorite would split support with a similar option and lose outright, so he listed his real second choice first instead, and that is exactly what ended up winning.

  Another friend was quite upset about this and has spent the days since insisting, at length, that the fix is obvious: we just need a smarter rule next time. He is now lobbying hard for a ranked-choice, instant-runoff-style count instead of our points system, and he's convinced that some sufficiently well-designed method -- so long as it isn't a literal dictatorship where one person is simply handed the decision every year -- can in principle be made fully immune to this kind of tactical misreporting.

  I'm skeptical, though in the moment I couldn't defend my skepticism beyond a vague hunch: that this isn't really a flaw specific to our points system, but something close to unavoidable whenever there are more than two real options on the table, people's honest preferences are free to be whatever they actually are, and no single person's word is simply decisive. My friend thinks this is needless defeatism and that I just haven't thought of the right rule yet. Since we couldn't settle it ourselves, I'd like a more rigorous verdict: who is closer to being right? Is there some ranking method -- instant-runoff or otherwise, but short of just letting one fixed person decide -- that our group could adopt for future trips and that would genuinely close off this kind of strategic misreporting for good, or is my friend, however reasonably, chasing a fix that cannot exist? If it's the latter, I would like to understand why, and whether there is anything short of a full fix that would at least help.
reasoning: |-
  We are considering the problem of finding a voting rule that is immune to strategic voting (i.e., tactical misreporting of preferences) when there are more than two options. The context is a group of eight friends choosing among four destinations (beach, mountain, city, lake) using a ranked ballot.

  The current system is a points system (Borda count): each voter ranks all four options, and points are assigned as 4 for first, 3 for second, 2 for third, and 1 for fourth. The option with the highest total points wins.

  The problem: one voter, anticipating that his true favorite (say, the beach) would split support with a similar option (perhaps the lake) and lose, instead ranked his second choice (say, the city) first. As a result, the city won, which was not the outcome under sincere voting.

  The friend proposes using instant-runoff voting (IRV) instead, believing that a well-designed method (that is not a dictatorship) can be immune to strategic voting.

  We are to determine if there exists a voting rule (that is not a dictatorship) that is immune to strategic voting for any possible preferences of the voters.

  Key result from social choice theory: the Gibbard-Satterthwaite theorem.

  Gibbard-Satterthwaite theorem (1973/1975): 
  If there are at least three alternatives, and the social choice function is onto (every alternative can win for some set of preferences) and non-dictatorial, then it is impossible for the function to be strategy-proof (i.e., immune to strategic voting by misrepresentation of preferences).

  Therefore, for any voting system that:
  - Allows at least three alternatives to be chosen (which we have: four destinations),
  - Is non-dictatorial (no single voter always decides the outcome), and
  - Is such that every alternative has a chance of winning (which we have, since each destination has won in the past and we are not ruling any out),
  then there will be some situations where a voter can benefit by misrepresenting their preferences.

  Hence, the friend's hope for a rule that is "fully immune to this kind of tactical misreporting" is impossible, unless we are willing to accept a dictatorship.

  Therefore, the narrator is correct: strategic voting is unavoidable in any non-dictatorial voting system with three or more alternatives.

  But let's also address the specific proposal of instant-runoff voting (IRV). 
  IRV is known to be vulnerable to strategic voting. For example, a voter might have an incentive to rank a strong contender lower to help a less popular alternative get eliminated first, thereby improving the chances of their favorite. There are documented cases of strategic voting in IRV elections.

  Thus, switching to IRV would not eliminate the problem. It might change the circumstances under which strategic voting is beneficial, but it would not remove the possibility.

  What can be done?
  While complete immunity is impossible, we can consider systems that are less manipulable or that require more complex strategies. However, the Gibbard-Satterthwaite theorem tells us that no system is entirely strategy-proof.

  Alternatively, we might consider systems that are more robust in practice, or that make it harder for voters to figure out how to manipulate. But note that in a small group of friends who know each other well, they might be able to anticipate each other's preferences and hence figure out strategic moves.

  Another approach is to use a system that minimizes the incentives for strategic voting, or that has a low frequency of manipulable situations. But again, in the worst case, manipulation is always possible.

  Recommendation:
  Since a full fix is impossible, the group might accept that strategic voting is a possibility and try to foster a culture of sincerity. Alternatively, they might stick with the Borda count (which has some desirable properties) or try IRV, but with the understanding that neither is perfect.

  Note: The Borda count is more vulnerable to strategic voting in the form of "burying" (ranking a strong opponent last) and "compromising" (raising a less preferred but more viable alternative). The incident described is an example of compromising.

  In IRV, a common strategy is to "compromise" as well, or to "bury" a strong opponent. Also, IRV can lead to non-monotonicity (where raising an alternative in one's ranking can cause it to lose), which is counterintuitive.

  Conclusion: 
  The narrator is closer to being right. There is no non-dictatorial voting rule that is immune to strategic voting when there are three or more alternatives. The friend is chasing a fix that cannot exist.

  However, we can consider systems that are less prone to manipulation in practice. For example, the Borda count and IRV both have their pros and cons. Another system that is sometimes mentioned as being more resistant to manipulation is the Condorcet method (if a Condorcet winner exists, it wins). But note that Condorcet methods are also vulnerable to strategic voting (by the same theorem).

  Moreover, in the absence of a Condorcet winner, Condorcet methods require a tie-breaking rule, which can introduce vulnerabilities.

  Therefore, the group must accept that no method is perfect. They might choose a method that they find more agreeable or that has properties they value (like selecting a Condorcet winner when one exists) but without the illusion of complete strategy-proofness.

  To at least help, they could:
  1. Use a method that is computationally complex enough that it is hard for voters to figure out how to manipulate (but in a small group, they might still manage).
  2. Agree to vote sincerely and trust each other.
  3. Rotate the decision method or the decider (but that would be a form of rotating dictatorship, which is non-dictatorial but still gives each person dictatorial power in their turn).

  Alternatively, they might consider a random ballot: one voter is chosen at random and their top choice is selected. This is strategy-proof for the chosen voter (they have no incentive to lie) and for others, they cannot affect the outcome so they have no incentive to lie. But note: if the random ballot is used, then each voter has a 1/n chance of being the dictator. This is non-dictatorial in the sense that no fixed person is the dictator, but it is a random dictatorship. Moreover, it is strategy-proof because:
  - The chosen voter: if they are chosen, they get their top choice by reporting truthfully. If they misreport, they might get a worse outcome. So they are truthful.
  - The others: their report doesn't matter because only the chosen voter's top choice is selected. So they have no incentive to lie.

  However, the outcome might not reflect the group's overall preference. For example, if one person hates the beach and everyone else loves it, there is a 1/8 chance that the beach is rejected. But note that in a random dictatorship, the beach would be chosen only if the chosen voter ranks it first. If 7 out of 8 love the beach, then the beach wins with probability 7/8.

  This method is strategy-proof, but it is not deterministic and may not be considered fair in terms of outcomes.

  Given the group's history and the fact that they have used a points system, they might not like the randomness.

  In summary: 
  - The narrator is correct that a full fix (a non-dictatorial, deterministic, and strategy-proof rule) does not exist.
  - The friend is incorrect in believing that such a rule can be found (unless they are willing to consider a random dictatorship, but that is not deterministic and might not be acceptable).

  Therefore, the group should be aware of the inherent limitations and choose a method they can live with, perhaps with the understanding that strategic voting is possible but discouraged.

  Final note: The Gibbard-Satterthwaite theorem applies to deterministic voting rules. Random rules (like random dictatorship) can be strategy-proof, but they are not deterministic. The friend's proposal was for a deterministic rule (like instant-runoff).
answer: |-
  Based on the principles of social choice theory, your skepticism is well-founded, and your friend's hope for a "fully immune" voting system is mathematically impossible under the described conditions. Here's a rigorous breakdown:

  ### 1. **The Core Impossibility: Gibbard-Satterthwaite Theorem**
     - **The theorem** (proven independently by Allan Gibbard and Mark Satterthwaite in the 1970s) states that for any voting system with three or more alternatives, where every possible outcome can win under some set of preferences (i.e., the system is "onto"), and where no single voter is a dictator (i.e., their ballot doesn’t always decide the outcome), it is **impossible** to design a rule that is immune to strategic voting.
     - **Why it applies here**: 
       - You have four alternatives (beach, mountains, city, lake), all viable (each has won before).
       - You require a non-dictatorial system (as per your friend's stipulation).
       - Thus, no matter what voting rule you adopt—points (Borda count), instant-runoff (IRV), Condorcet, or any other—there will always be scenarios where a voter can profitably misrepresent their preferences to achieve a better outcome.

  ### 2. **Why Instant-Runoff (IRV) Doesn't Solve the Problem**
     - Your friend advocates for IRV, where voters rank options and the least-popular first-choice is eliminated iteratively until one option has a majority. However:
       - **IRV is vulnerable to strategy**: Voters can misrank their true favorite to prevent its early elimination (e.g., ranking a "compromise" option higher). This is well-documented in real-world elections (e.g., Australia’s IRV system).
       - **Example**: Suppose a voter’s true preference is Beach > Lake > City > Mountains. If they fear Beach will be eliminated early due to split support with Lake, they might rank Lake first to ensure it survives elimination rounds. This is analogous to the strategy used in your points system.
       - **No silver bullet**: IRV only eliminates "vote-splitting" in the first round—not in later rounds. It also fails other fairness criteria (e.g., monotonicity), where ranking a candidate higher can cause them to lose.

  ### 3. **Why Your Points System Isn't Uniquely Flawed**
     - Your current system (a Borda count) is vulnerable to "compromising" (boosting a second choice to prevent a worst-case outcome), as your friend demonstrated. However, all systems have trade-offs:
       - **Borda count**: Encourages "burying" strong opponents (ranking them last) or "compromising."
       - **IRV**: Vulnerable to "push-over" strategies (ranking weak opponents higher to manipulate eliminations).
       - **Plurality**: Susceptible to vote-splitting and Duverger’s Law (two-party dominance).
       - **Condorcet methods**: Can cycle or fail to produce a winner, and are manipulable via preference misrepresentation.
     - The problem isn’t your system—it’s the **inherent tension** between group preferences and strategic incentives when options > 2.

  ### 4. **Practical Mitigations (Since a "Full Fix" Is Impossible)**
  While no system is immune, you can reduce incentives for strategy:
     - **Approval Voting**: Voters select all options they find acceptable. The option with the most approvals wins. This simplifies ranking, reduces tactical burden, and often yields broadly acceptable outcomes. However, it doesn’t capture intensity of preference.
     - **Two-Stage Runoff**: Hold a first-round vote (e.g., plurality) to narrow options to two, then a majority vote between them. This minimizes vote-splitting but requires two meetings.
     - **Culture of Sincerity**: Discuss preferences openly before voting. If voters trust each other to be honest, strategy becomes less appealing. In your close-knit group, this may work better than in anonymous elections.
     - **Randomized Dictatorship**: Randomly select one voter’s ballot to decide the outcome. This is strategy-proof (no incentive to lie) and non-dictatorial long-term, but feels arbitrary and may ignore group preferences.
     - **Borda Count with Full Rankings**: Stick with your current system but require full rankings (as you did). Though manipulable, it’s transparent and reflects preference strength better than plurality.

  ### 5. **Why Your Friend’s View Is Understandable but Misguided**
     - **His intuition**: Many believe "better rules" can eliminate strategy—a reasonable hope in contexts with only two options (where majority vote *is* strategy-proof). With four options, however, the theorem proves this impossible.
     - **The flaw**: He assumes a voting rule can be "well-designed" to avoid strategy, but Gibbard-Satterthwaite shows this is a categorical impossibility, not a design challenge.

  ### Conclusion
  You are closer to being right: **No non-dictatorial voting rule can "genuinely close off" strategic misreporting for four options.** Your friend is chasing a fix that cannot exist. However, you can adopt pragmatic measures:
  - **Short-term**: Switch to Approval Voting or a Two-Stage Runoff to simplify decisions and reduce strategic complexity.
  - **Long-term**: Combine a transparent system (e.g., Borda) with a group norm of sincerity. Emphasize that strategy undermines the spirit of the trip—a cultural fix may work better than a technical one.

  This outcome is a feature of mathematics, not your group’s dynamics. By acknowledging the impossibility, you can focus on making the process more robust and less contentious.
