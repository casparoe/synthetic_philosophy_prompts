  Breaking it down move by move: Nora's first move is strong for clear masks like poison-antidote, but Dan has a point about object individuation. Nora's pill example effectively challenges Dan, showing that physical inclusion isn't decisive. Dan's functional component argument introduces nuance but risks subjectivity. 

