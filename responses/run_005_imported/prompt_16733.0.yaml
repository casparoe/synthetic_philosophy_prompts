answer: |-
  Below is a concrete, fresh example set in a lending context, demonstrating the inherent trade-off between calibration and error rate equality. This illustrates the mathematical impossibility your character can use in her defense. We'll use small numbers for clarity.

  ---

  ### **Scenario: Small Business Loan Risk Assessment**
  - **Group A:** Established business districts (higher base repayment rate)
  - **Group B:** Underserved rural areas (lower base repayment rate)
  - **Risk Score:** Predicts probability of loan repayment (1=repay, 0=default)  
  - **Decision Rule:** Approve loan if predicted repayment probability ≥ 70%  

  #### **Base Data (100 applicants per group):**
  | Group | Repayers (Good) | Defaulters (Bad) | Base Repayment Rate |
  |-------|-----------------|------------------|---------------------|
  | **A** | 90              | 10               | 90%                |
  | **B** | 70              | 30               | 70%                |

  ---

  ### **Step 1: Build a Calibrated Model**
  The model outputs **well-calibrated scores**:  
  - For applicants assigned a score of `X%`, exactly `X%` repay *in each group*.  
  - Example score thresholds: `High (90%)` and `Low (60%)`.

  #### **Calibrated Assignments:**
  **Group A (90% base rate):**  
  - `High (90%)`: 80 applicants (90% must be repayers → 72 repay, 8 default).  
  - `Low (60%)`: 20 applicants (60% must be repayers → 12 repay, 8 default).  
  *Validation:* Total repay = 72 + 12 = 84 (≈90% of 94? Wait, let's fix:  
  Actually, total good is 90.  
  So: High: 80 applicants: 90% of 80 = 72 good, 8 bad.  
  Remaining: 20 applicants: 18 good (90-72) and 2 bad (10-8).  
  But we need the low score to be calibrated at 60%:  
  Good in Low = 18, total Low = 20 → 90% good, not 60%. Contradiction.  

  Let's redesign:  
  We need to assign scores such that:  
  - The high score has a repayment rate of 90%,  
  - The low score has a repayment rate of 60%.  
  But the overall group has 90% repayment.  

  Let:  
    - \( x \) = number assigned High score in A.  
    - Then, number assigned Low score = \( 100 - x \).  

  Good in High: \( 0.9x \)  
  Good in Low: \( 0.6(100 - x) \)  
  Total good: \( 0.9x + 0.6(100 - x) = 90 \)  
  \( 0.9x + 60 - 0.6x = 90 \)  
  \( 0.3x = 30 \) → \( x = 100 \)  

  This implies we can only have the High score? That doesn't work.  

  Instead, we need more score levels or accept that the distributions differ. Let's use a different approach.  

  **Revised Calibrated Assignments (using two score bands):**  

  **Group A (90% base rate):**  
  - Assign `High (90%)` to **50 applicants**:  
    - 45 repay (90% of 50), 5 default.  
  - Assign `Low (60%)` to **50 applicants**:  
    - 30 repay (60% of 50), 20 default.  
  *Check total repay:* 45 + 30 = 75 ≠ 90. **Inconsistency!**  

  We must match the base rate. To fix:  
  - Total good needed: 90.  
  - Suppose we assign:  
    - High (90%): to \( a \) people → good = 0.9a, bad = 0.1a  
    - Low (60%): to \( 100 - a \) people → good = 0.6(100 - a), bad = 0.4(100 - a)  
  Total good: 0.9a + 0.6(100 - a) = 90  
  0.9a + 60 - 0.6a = 90  
  0.3a = 30 → a = 100  
  Then all are High: 90 good, 10 bad. Then we have no Low score.  

  This shows that with only two scores and very different base rates, it's hard to have multiple calibrated bands.  

  **Alternative: Use a threshold and continuous scores**  
  Assume scores are continuous and calibrated. We set a threshold T=70% for loan approval.  

  **Group A (90% good):**  
  - Assume the score distribution:  
    - Good applicants: Scores centered high (e.g., 85% avg).  
    - Bad applicants: Scores centered low (e.g., 55% avg).  
  For simplicity, assume:  
    - 85% of goods have score ≥70% → approved.  
    - 15% of goods have score <70% → rejected (false negatives).  
    - 40% of bads have score ≥70% → approved (false positives).  
    - 60% of bads have score <70% → rejected.  

  Then:  
  - **False Positive Rate (FPR)**: % of bads approved = 40%.  
    FPR_A = P(approve | bad) = 40%  
  - **False Negative Rate (FNR)**: % of goods rejected = 15%.  
    FNR_A = P(reject | good) = 15%  

  **Group B (70% good):**  
  - To maintain calibration:  
    - A score of 70% means 70% repay in both groups.  
  - But base rate is lower (70%), so:  
    - Goods: Assume same score distribution as A? Not necessarily.  
    - But to be calibrated, the score densities must adjust.  

  Assume:  
    - Goods: Same as A: 85% have score ≥70%.  
    - Bads: To have P(repay | score=70%) = 70%, we need more bads above threshold.  

  Compute:  
  At threshold T=70%:  
  P(good | score≥70%) = 70% in both groups.  

  For Group B:  
  Let:  
    - \( g_B \) = number of goods with score≥70% (to be approved)  
    - \( b_B \) = number of bads with score≥70% (false approves)  
  Then:  
    P(good | ≥70%) = g_B / (g_B + b_B) = 70%  →  g_B = (7/3) b_B  

  Total goods = 70:  
    g_B + (goods below T) = 70  
  Total bads = 30:  
    b_B + (bads below T) = 30  

  Also, from earlier assumption:  
  85% of goods are above T: g_B = 0.85 * 70 = 59.5?  
  But we have g_B = (7/3) b_B.  

  Set:  
    g_B = (7/3) b_B  
  Total goods: g_B + g_below = 70  
  We don't know g_below yet.  

  Similarly, total bads: b_B + b_below = 30.  

  But we need another condition. The FPR and FNR depend on the distributions.  

  **Assume that within each outcome (good/bad), the score distributions are the same across groups.** This is a common assumption in fairness literature.  

  Then:  
  - **Goods**: Same distribution in A and B → same % above T: 85% for both.  
    So for B: 85% of 70 goods = 59.5 above T (round to 60), 10 below.  
  - **Bads**: Same distribution → 40% of bads above T (as in A).  
    For B: 40% of 30 bads = 12 above T, 18 below.  

  Now, check calibration at T=70% for Group B:  
  P(good | ≥70%) = goods above T / total above T = 60 / (60 + 12) = 60/72 ≈ 83.3%  
  But we need it to be 70% for calibration! **Contradiction.**  

  To achieve calibration at T=70% for Group B:  
  We require: P(good | ≥70%) = 70% = goods_above_B / (goods_above_B + bads_above_B)  
  Let \( g = \) goods above in B, \( b = \) bads above in B.  
  Then: g / (g + b) = 0.7 → g = (7/3)b  

  Total goods: g + g_below = 70  
  Total bads: b + b_below = 30  

  But we also assume the same within-outcome distributions:  
  - Goods: 85% above T → g = 0.85*70 = 59.5  
  - Bads: let p = P(above T | bad) → b = p*30  

  Then: 59.5 / (59.5 + 30p) = 0.7  
  59.5 = 0.7*(59.5 + 30p)  
  59.5 = 41.65 + 21p  
  17.85 = 21p  
  p = 17.85 / 21 ≈ 0.85  

  But in Group A, for bads, p = 0.4. Here p=0.85, different!  
  So to have calibration, we must have different conditional distributions for bads across groups.  

  **Assume instead we enforce calibration and same within-outcome distributions?**  
  From Bayes:  
  P(good|score≥T) = P(score≥T|good) * P(good) / [ P(score≥T|good)P(good) + P(score≥T|bad)P(bad) ]  

  Set equal for both groups:  
  For A:  
    P(good|≥T) = [ P(≥T|good) * 0.9 ] / [ P(≥T|good)*0.9 + P(≥T|bad)*0.1 ]  
  For B:  
    P(good|≥T) = [ P(≥T|good) * 0.7 ] / [ P(≥T|good)*0.7 + P(≥T|bad)*0.3 ]  

  Set both equal to the same value, say q.  
  Then:  
  For A:  
    q = [ sens * 0.9 ] / [ sens*0.9 + (1-spec)*0.1 ]  
  where sens = P(≥T|good), 1-spec = P(≥T|bad) = FPR.  

  For B:  
    q = [ sens * 0.7 ] / [ sens*0.7 + (1-spec)*0.3 ]  

  Set equal:  
    [0.9 sens] / [0.9 sens + 0.1 FPR] = [0.7 sens] / [0.7 sens + 0.3 FPR]  

  Let s = sens, f = FPR.  
  Then:  
    0.9s / (0.9s + 0.1f) = 0.7s / (0.7s + 0.3f)  

  Assume s ≠ 0, divide both sides by s:  
    0.9 / (0.9s + 0.1f) = 0.7 / (0.7s + 0.3f)  [But s still in denominator]  

  Cross-multiply:  
    0.9 * (0.7s + 0.3f) = 0.7 * (0.9s + 0.1f)  
    0.63s + 0.27f = 0.63s + 0.07f  
    0.27f = 0.07f  
    0.20f = 0 → f=0  

  So FPR must be 0. Similarly, then s must be 1. Only a perfect model can satisfy.  

  **Thus, with different base rates, calibration and equal FPR/FNR cannot coexist unless the model is perfect.**  

