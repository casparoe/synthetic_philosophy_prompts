  ### **Whiteboard Explanation for the Character**
  > **Data Scientist:** "Our model is **calibrated**: a 70% score means a 70% repayment chance for everyone. But because Group B has a lower base repayment rate (70% vs. 90%), we hit a statistical wall. Let me show you with numbers.  
  >   
  > **Assume we force calibration and equal FPR**:  
  > - If Group B has the same FPR as Group A (say 40%), then:  
  >   - **Group A (90% repay)**: 40% of defaulters (bad) are approved → 4 of 10 bads approved.  
  >   - **Group B (70% repay)**: 40% of defaulters approved → 12 of 30 bads approved.  
  >   
  >   Now, for calibration at approval threshold (70% score):  
  >   - **Group A**: % repayers among approved = 90% (by design).  
  >   - **Group B**: Let `R` be repayers approved. Total approved = `R + 12`.  
  >     We need `R / (R + 12) = 70%` → `R = 28`.  
  >     But Group B only has 70 repayers total → 28 approved means 42 repayers denied.  
  >   
  >   **FNR comparison**:  
  >   - Group A: Repayers denied = 10% (if FNR=10%)?  
  >   - Group B: FNR = 42/70 = 60% (huge disparity!).  
  >   
  > **If we force equal FNR instead**:  
  > - Say FNR=10% for both:  
  >   - Group A: 9 repayers denied (10% of 90).  
  >   - Group B: 7 repayers denied (10% of 70).  
  >   
  >   Then for Group B: Approved repayers = 70 - 7 = 63.  
  >   Total approved in B = 63 + `B_bad_approved`.  
  >   For calibration: `63 / (63 + B_bad_approved) = 70%` → `B_bad_approved = 27`.  
  >   But Group B only has 30 bads → 27 approved (FPR=90%!).  
  >   
  >   Meanwhile, Group A’s FPR must be 90% too (for equality), meaning 9 of 10 bads approved. But then calibration fails for Group A: repayers approved = 90 - 9 = 81, total approved=81+9=90, repayment rate=90% (correct). So calibration holds, but FPR is 90% for both.  
  >   
  > **The trade-off is unavoidable**:  
  > - Calibration + equal FPR → unequal FNR.  
  > - Calibration + equal FNR → equal but high FPR.  
  > - Equal FPR + equal FNR → **breaks calibration** (scores stop meaning the same thing across groups).  
  >   
  > This isn’t a flaw in our code or data—it’s a **mathematical constraint** from Bayes’ theorem. We prioritized calibration because a risk score must mean what it says. But society must choose which fairness metric to prioritize; the math forbids having all three."

