  ### **Why This Works for Your Novel**
  1. **Fresh Context**: Lending avoids the COMPAS fatigue. Small-business loans add nuance (historic underinvestment in rural areas explains base-rate gaps).  
  2. **Concrete Numbers**: The whiteboard example uses small, intuitive numbers to expose the trade-off.  
  3. **Structural, Not Fixable**: The journalist can’t argue for a “quick fix” because:  
     - The contradiction arises from base rates, not data quality.  
     - Adjusting thresholds or reweighting data might equalize one error rate, but it will always break calibration or the other error rate.  
  4. **Real-world Resonance**: Audiences understand lending bias debates (e.g., redlining), making the defense relatable.  

  **Pushback Response**:  
  > **Journalist**: "But why not force equal error rates and sacrifice calibration?"  
  > **Data Scientist**: "Then a 70% score could mean an 80% repayment chance in Group A and 50% in Group B. We’d be lying with numbers—and mispricing risk. Is that fair?"  

  This frames the conflict as a societal choice, not a technical failure—deepening your novel’s ethical tension.
