answer: |-
  ## The Expressivist Impasse (A Dialogue on Frege-Geach)

  **Characters:**
  *   **Alex:** Pure Expressivist (à la Blackburn/Gibbard)
  *   **Jamie:** Hybrid Expressivist (à la Ridge)

  **Setting:** Coffee shop after a metaethics seminar.

  **(Alex stirs their coffee, looking frustrated. Jamie slides into the opposite seat.)**

  **Jamie:** Tough session, huh? That Geach passage always stirs the pot. Look, I agree with you on the core expressivist insight: "Lying is wrong" expresses disapproval, not some cosmic fact. But honestly, Alex, watching you try to wrestle the Frege-Geach problem into submission with just attitude-logic... it felt like watching someone build a house of cards. That `If...then...` statement in the argument is the wrecking ball.

  **Alex:** (Sighs) Thanks for the vote of confidence, Jamie. But I think you’re giving up too easily. The pure project *can* work. Take the standard case:
  1.  Lying is wrong. (Expresses: *Boo! Lying!*)
  2.  If lying is wrong, then getting your kid brother to lie is wrong. (Expresses: *Hooray! Consistency in disapproval between lying and getting-kid-brother-to-lie!*)
  3.  Therefore, getting your kid brother to lie is wrong. (Expresses: *Boo! Getting-kid-brother-to-lie!*)

  The validity isn't about *truth* flowing down the chain. It's about *commitment*. Gibbard’s hyperplans nail this. Accepting premise 1 commits you to disapproving of lying. Accepting premise 2 commits you to a plan: *whenever* you disapprove of lying, you *must* also disapprove of getting your kid brother to lie. So, if you accept both, you’re rationally committed to disapproving of getting your kid brother to lie. Boom. Validity explained via consistency of plans/attitudes. No spooky moral truths required.

  **Jamie:** I get the *idea*, Alex. I really do. Blackburn’s "Hooray!" for the conditional is clever. But let’s poke it. Premise 2: "If lying is wrong, then getting your kid brother to lie is wrong." On your view, I’m not expressing a belief *about* disapproval, am I? I’m expressing a higher-order attitude *towards* combinations of attitudes? *Hooray!* for combining disapproval-of-lying with disapproval-of-getting-brother-to-lie?

  **Alex:** Exactly. It’s endorsing a norm linking the two attitudes.

  **Jamie:** Okay. Now, imagine someone *denies* the conclusion: "Getting your kid brother to lie is *not* wrong." Expresses: *Hooray! Getting-kid-brother-to-lie!* (or at least *Not Boo!*). According to your logic, this person is inconsistent *only if* they also accept both premises, right?

  **Alex:** Of course. If they reject premise 1 (*Hooray! Lying!*) or reject premise 2 (*Boo! Linking disapproval-of-lying to disapproval-of-brother-lying!*), then they can happily accept the conclusion without inconsistency. The inconsistency only bites if they hold all three attitudes simultaneously.

  **Jamie:** But that’s the rub! In *ordinary* logic, if someone accepts "P" and "If P then Q" but denies "Q", they’re *contradicting themselves* purely based on the *content* of the propositions and the logical operators. The *force* of assertion is irrelevant. Your account makes the validity *depend* on the speaker's actual attitudes at the moment of utterance. What if someone sincerely asserts premise 1 and premise 2, but then, in a moment of weakness or confusion, asserts the *negation* of the conclusion? According to pure expressivism, haven't they just *changed their mind* or revealed they never *really* accepted the commitment in premise 2? Where's the formal, speaker-independent contradiction?

  **Alex:** It *is* a contradiction in their *web of commitments*! It’s like accepting the rules of chess but then trying to move the rook diagonally. You’re violating the normative structure *you endorsed*. The inconsistency isn’t in the world, it’s in their practical stance. Logic *is* about the norms of commitment for expressivists.

  **Jamie:** But Alex, that feels like changing the subject. The Frege-Geach problem is about why *the sentence* "Getting your kid brother to lie is not wrong" is the *logical negation* of the conclusion, and why accepting it *while uttering the premises* creates a contradiction *in the discourse itself*, regardless of the speaker's deep-down, possibly fluctuating attitudes. Ordinary logic captures this with truth conditions. Your attitude-consistency story feels psychological, not logical. It risks making validity subjective.

  **Alex:** It’s not subjective! The norms of rationality governing attitude consistency are objective in the same way norms of deductive logic are – they define what counts as coherent thought. But fine, Jamie, what’s *your* hybrid magic bullet? How does "ecumenical expressivism" handle this without just sneaking descriptivism back in?

  **Jamie:** Glad you asked. Ridge’s key move is that moral sentences *do* have truth-conditional content, *but* it's minimal, tied directly to the expressed attitude. "Lying is wrong" expresses disapproval *and* is true iff lying is wrong. Crucially, "wrong" here *just means* the property that warrants disapproval. It's not some independent, descriptively rich property.

  **Alex:** (Leans forward, skeptical) Oh, here we go. So "wrong" suddenly *refers* to something? You’re giving it semantic content!

  **Jamie:** Minimal content! Deflationary truth! The truth condition *is* constituted by the attitude. "Lying is wrong" is true iff disapproval of lying is correct/appropriate/warranted. But crucially, *what it is* for disapproval to be correct *just is* for the attitude to be held – it’s not a further fact. The attitude remains primary.

  **Alex:** But now look at premise 2: "If lying is wrong, then getting your kid brother to lie is wrong." On your view, this *is* a truth-functional conditional. It expresses a higher-order attitude *about* the correctness conditions, sure, but the *logical form* is standard: it's true iff either lying isn't wrong or getting your kid brother to lie is wrong. The validity of the whole argument now falls out *directly* from truth-preservation in standard logic. No need for special attitude-logic gymnastics. "Wrong" has a consistent semantic value across all contexts – it always contributes that minimal truth condition (warranted disapproval) to the proposition expressed.

  **Alex:** (Slumps back) That’s my point! You’ve *smuggled in cognitivism*! You’ve given moral sentences *genuine propositional content* that can be slotted into truth-functional logic. You’ve basically conceded the core challenge and built a cognitivist bridge over the Frege-Geach chasm! The "expressivism" becomes a decorative add-on to the attitude expressed *alongside* asserting the proposition. The *hard work* of showing how logic works *purely* with non-propositional attitudes – that’s what you’ve abandoned. Ridge might call it "ecumenical," but it looks like surrender to me. You’ve got truth conditions doing all the heavy lifting.

  **Jamie:** It’s not surrender, it’s *integration*! I’m capturing the *logical behavior* of moral language as we actually use it, using the well-understood tools of truth-conditional semantics. The expressivist core – that the *function* of moral claims is to express attitudes, and that their "truth" is constitutively tied to those attitudes – remains intact. The minimal truth condition *depends on* the attitude. Your pure approach, Alex, forces us to invent this whole parallel universe of "attitude consistency logic" that feels alien to how we actually reason with conditionals and negation. My way, the logic is straightforward, *and* the non-descriptive, expressive function is preserved. It’s not smuggling; it’s showing how expression and minimal truth can co-exist.

  **Alex:** Co-exist? More like the truth-conditional content *eclipses* the expressive function when it comes to logic. You *need* that truth condition to explain the validity. That makes it primary in the semantic explanation. The attitude becomes a passenger. Whereas in my view, the attitude *is* the core semantic content; the logic tracks the norms governing those attitudes directly. Your "minimal truth" looks suspiciously like a fig leaf for reintroducing propositions. The Frege-Geach problem was *meant* to be hard for pure expressivism; hybridism seems like dodging it by watering down expressivism until it’s barely recognizable.

  **Jamie:** Or perhaps it’s recognizing that pure expressivism paints itself into a corner by denying *any* propositional content. Maybe language is messier, and moral sentences *do* manage to both express attitudes *and* have minimal truth-apt content. My account explains the logical phenomena cleanly *without* abandoning the core expressivist motivation. Your account... well, it *tries*, Alex, but it feels contrived and struggles with negation and speaker-independence. We both reject moral facts, but I think we need truth-conditions to do the logical work you want attitude-consistency to do.

  **Alex:** And I think you’ve sacrificed the revolutionary spirit of expressivism on the altar of logical convenience. We’re just talking past each other now. More coffee?

  **Jamie:** (Smiles wryly) Definitely. This could take a while. But at least we agree on the core: *Boo! Moral facts!*

  **Alex:** (Chuckles) *Hooray! Agreement on that!* Pass the sugar.

  **(They both reach for the sugar bowl, the argument unresolved, the fundamental disagreement about the nature of moral language and logic as stark as ever.)**
