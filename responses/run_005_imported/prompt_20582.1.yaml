answer: |-
  Here's the decisive take: **Kelly betting *is* fundamentally just Expected Utility Theory (EUT) with a logarithmic utility function, and the "ergodicity economics" reframing, while offering a potentially useful *perspective* on multiplicative growth, fails to establish a distinct normative foundation for rational choice. Samuelson's critique stands.**

  Here's the justification breaking down the comparison:

  1.  **The Kelly Criterion is Log Utility in EUT:**
      *   Kelly maximizes the expected value of the *logarithm* of future wealth: `E[log(W₁)]` given current wealth `W₀`.
      *   Von Neumann-Morgenstern Expected Utility Theory maximizes the expected value of a *utility function* `U(W)`: `E[U(W₁)]`.
      *   **Therefore, maximizing `E[log(W)]` *is identical to* maximizing `E[U(W)]` where `U(W) = log(W)`.** This isn't a superficial similarity; it's mathematical identity. The Kelly bettor *is* a vNM agent with a specific, logarithmic utility function.

  2.  **Samuelson's Critique is Fatal to "Privileged" Status:**
      *   Paul Samuelson famously argued against the Kelly criterion as *the* rational strategy. His core point was that different individuals have different risk tolerances and financial goals, reflected in different utility functions.
      *   Why should `log(W)` be inherently more "rational" than `sqrt(W)` (more risk-averse), `W` (risk-neutral), or `-e^{-aW}` (CARA, constant absolute risk aversion)? EUT provides a flexible framework accommodating diverse rational preferences.
      *   **Claiming Kelly/log-utility is uniquely rational requires justifying why `log(W)` is the *only* rational utility function.** Samuelson (and standard economic theory) argues there is no such justification. An investor concerned about absolute losses in a crash (CARA) or someone with subsistence needs (highly concave utility below a threshold) might rationally choose *not* to follow Kelly.

  3.  **Ergodicity Economics: Relabeling, Not Revolution:**
      *   **The Core Argument:** Peters argues that rational agents should maximize the long-term *time-average growth rate* of wealth (`lim_{T->∞} (1/T) log(W_T/W_0)`), which equals the *geometric mean growth rate* for i.i.d. processes. He contrasts this with maximizing the *ensemble average* (`E[W₁/W₀]`) at a single point in time, which can be misleading (e.g., St. Petersburg paradox). He links time-averages to ergodicity.
      *   **The Rebuttal:**
          *   **Mathematical Equivalence:** For a repeated, multiplicative bet, maximizing the expected *geometric mean growth rate* is mathematically identical to maximizing `E[log(1+r)]`, which is maximizing `E[log(W₁)]` relative to `W₀`. **This is precisely the Kelly criterion, which we've established is EUT with log utility.**
          *   **Misplaced Emphasis on Ergodicity:** The key requirement for the time-average growth rate to be the relevant quantity isn't strict ergodicity *per se*. It's the *multiplicative, repeated* nature of the wealth process and the agent's focus on long-term wealth growth. EUT handles this perfectly well by evaluating the utility of the *path* via the expectation of log utility. Invoking ergodicity is often unnecessary and sometimes misapplied (many relevant processes are non-ergodic in the strict sense, but the focus on long-run growth still applies).
          *   **"Ensemble Average" is a Straw Man:** Rational EUT maximizers don't naively maximize expected *wealth* (`E[W]`). They maximize expected *utility* (`E[U(W)]`). A log-utility maximizer *knows* maximizing `E[W]` leads to ruin in repeated favorable bets. The flaw Peters identifies (focusing on `E[W]`) is a flaw in misapplying *expectations*, not a flaw inherent in EUT itself. EUT with *any* concave utility function accounts for risk aversion.
          *   **Interpretation vs. Foundation:** The ergodicity framing offers a different *interpretation* or *derivation* of why maximizing `E[log(W)]` makes sense for long-term multiplicative growth. It highlights a useful *insight*: in multiplicative dynamics, focus on the geometric mean. **However, it does not provide a new *normative criterion* distinct from maximizing `E[U(W)]` with `U=log`.** It's a different perspective on the same mathematical object.

  4.  **Where Geometric Rationality *Adds* Perspective (But Not Foundation):**
      *   The geometric mean perspective strongly emphasizes **long-term survival and growth** in repeated multiplicative settings. It makes the consequences of over-betting (risk of ruin) and under-betting (suboptimal growth) very clear.
      *   It provides an intuitive **non-utility-based derivation** of the Kelly fraction for simple repeated bets (maximize `f` in `E[log(1+rf)]`). This can be pedagogically useful.
      *   **However, this perspective doesn't escape EUT.** It derives the strategy that a *specific type* of vNM agent (log utility) would follow. It doesn't prove that *all* rational agents *must* be this type.

  **Conclusion:**

  The Kelly criterion is a powerful and important strategy *within* the Expected Utility Theory framework, specifically for agents whose utility function is logarithmic wealth. The "ergodicity economics" reframing offers a valuable perspective on *why* maximizing expected log wealth (`E[log(W)]`) is optimal for long-term growth in multiplicative scenarios. **However, it does not constitute a rival theory of rationality.** It ultimately recasts the mathematics of EUT with log utility using the language of time-averages and ergodicity. Samuelson's critique remains valid: there is no universally privileged utility function. Rational agents with different legitimate preferences (reflected in different concave utility functions) may rationally choose strategies different from Kelly. The disagreement isn't foundational; Kelly/log-utility is a special, important case *within* the broader and more flexible normative framework of EUT. The "ergodicity move" is insightful repackaging, not a revolution in decision theory.
