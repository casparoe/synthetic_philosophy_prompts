prompt: |-
  Me and my friend Raf spent our whole dinner last night arguing about decision theory of all things, and it turns out I actually have to deal with a version of this for real by Monday.

  I sit on the model-risk committee at the trading firm I work for. We're about to deploy an autonomous agent that negotiates directly against other firms' bots, some of which can plausibly infer our agent's strategy in advance (leaked logs, similar training setups, whatever). The lead quant just wants it built on plain causal decision theory and be done with it. Our resident ex-philosophy-PhD keeps bringing up the old "Death in Damascus" case to argue CDT doesn't even settle on a stable action once another agent is effectively predicting you, and thinks we should build in evidential decision theory or some Yudkowsky-style functional decision theory instead so the agent can't be gamed. Raf's take, which he wouldnt drop all night, is that this is cute seminar-room stuff with zero bearing on a desk full of bots trading against noisy, imperfect models of each other.

  Can you draft the committee memo I owe by Monday? Recommend one specific decision procedure for the agent (a defined fallback counts), give real reasons, and actually engage with the strongest version of Raf's objection instead of just waving it off.
