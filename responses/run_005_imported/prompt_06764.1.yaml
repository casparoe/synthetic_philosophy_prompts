  I'm a public member of my state bar's attorney regulation committee, which routes disciplinary cases either to formal charges or to a confidential diversion program for health-related misconduct. An attorney let a client's case lapse into dismissal during an untreated depressive episode, then spent months sending fabricated status updates to hide it; he's since been diagnosed, stabilized on medication, and repaid the client. Diversion is the standard recommendation here, but the attorney's own counsel is asking us not to divert him: he wants formal charges and a public reprimand, arguing he wronged a client and would rather be sanctioned and earn his way back than be managed indefinitely as a health case. Several members want to overrule him for his own good. Draft the short decision memo I'll bring to the committee, recommending one track over the other and engaging seriously with both his reasons for wanting discipline and the wronged client's stake in the outcome.
