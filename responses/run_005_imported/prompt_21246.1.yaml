  Then there's Keynes's beauty contest analogy in the *General Theory*. He described markets where investors try to guess what others think, leading to persistent disagreement. So, even rational agents might disagree if their interpretations of evidence differ. This contrasts with Aumann's theorem, which requires common priors and common knowledge of posteriors to prevent disagreement.

