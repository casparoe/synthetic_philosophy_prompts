prompt: |-
  Ok this is gonna be a bit inside-baseball but bear with me. You know the Othello-GPT saga from the mech interp world? Kenneth Li's original paper found the board state was only really decodable with a nonlinear probe (iirc), and then Neel Nanda showed that if you recode the board as "mine vs yours" (relative to whos turn it is) instead of "black vs white," a totally linear probe nails it almost perfectly. This got passed around a lot as evidence that the network really does have a world model sitting in there, just represented in a basis nobody had thought to check yet.

  I want the opposite case argued, as rigorously as you can manage: that the mine/yours result is actually evidence *against* robust realism about neural network representations, not for it. The intuition I want fleshed out properly is this: if whether some quantity counts as "really represented" flips entirely depending on which of several extensionally equivalent, human-chosen recodings we happen to probe for, then "the network represents the board state" isn't tracking some basis-independent fact about the network's internals — it's tracking facts about which featurizations the interpreter bothered to try. Bring in the privileged-basis/superposition stuff if it helps. I don't want the cheap "well it's all just interpretation" version, I want the strongest version of this that actually takes the linear representation hypothesis seriously and still comes out skeptical of realism.
reasoning: |-
  We are going to argue against robust realism about neural network representations by examining the Othello-GPT case. The key event: Kenneth Li's original paper found that decoding the board state required a nonlinear probe, but Neel Nanda showed that by recoding the board state in a relative frame (from the perspective of the current player, i.e., "mine vs yours"), a linear probe worked almost perfectly.

  The realist interpretation: This shows that the network has a world model (the board state) but in a basis that we hadn't thought of (the relative frame). Therefore, we just needed to find the right basis to see the linear representation.

  The anti-realist argument we want to build: The fact that the representation "flips" from nonlinear to linear depending on an arbitrary (though natural) recoding chosen by the interpreter suggests that the network does not have a single, privileged representation of the board state. Instead, what we call "representation" is highly dependent on the interpretive choices we make. This undermines the idea that there is a basis-independent fact of the matter about what the network represents.

  To make this rigorous, we will:

  1. Acknowledge the linear representation hypothesis (LRH) and take it seriously.
  2. Argue that the existence of multiple equivalent recodings (like absolute vs relative board states) implies that the network's activations do not inherently prefer one basis over another.
  3. Discuss how superposition (as in the literature on sparse autoencoders and the "privileged basis" problem) complicates the idea of a single "true" representation.
  4. Conclude that the ease of linear decoding in one frame versus another is more about the interpreter's choice of frame than about the network's intrinsic structure.

  Let's proceed step by step.

  ### Step 1: The Linear Representation Hypothesis (LRH) and Its Appeal

  The LRH posits that neural networks learn to represent features of the input in a linear way in their activation spaces. That is, there exists a basis in which each feature we care about (like the board state of Othello) is represented by a direction, and the value of that feature is given by the dot product of the activation vector with that direction. This is a strong hypothesis because it would mean that the network's internal representations are human-interpretable and that we can understand the network by linearly decoding its activations.

  The Othello-GPT result (with the relative frame) seems to support LRH: the board state is linearly decodable in the relative frame.

  ### Step 2: Multiple Equivalent Frames and the Absence of a Privileged Basis

  Consider two ways to represent the board state:

  - **Absolute frame**: Each square is represented by three states: empty, black, white. This is absolute in the sense that black and white are fixed regardless of who is playing.
  - **Relative frame**: Each square is represented as: empty, mine, yours. This is relative to the current player. If the current player is black, then "mine" is black and "yours" is white. If the current player is white, then "mine" is white and "yours" is black.

  These two representations are extensionally equivalent: they contain the same information about the board and the current player. Moreover, they are linearly related: one can convert from absolute to relative by a linear transformation (specifically, a permutation of the features that swaps black and white when the current player is white, and leaves them when black).

  Now, the experimental fact:

  - In the absolute frame, the board state is not linearly decodable (or at least not without significant nonlinearity).
  - In the relative frame, it is linearly decodable.

  The key question: Why should the relative frame be linearly represented and not the absolute frame? If the network had a privileged basis for representing the board, we might expect that basis to be either the absolute or the relative, but not both. However, note that the relative frame is not inherently more natural to the network. The network was trained on sequences of moves, and during training, the input does not explicitly provide the relative frame. The input is typically an absolute representation (e.g., "black at C4").

  But the network might have learned the relative frame because it is more useful for predicting the next move. Indeed, the next move is made by the current player, so it is natural to think in terms of "my pieces" and "your pieces". However, this is a functional argument: the relative frame is more computationally convenient for the task.

  The point is: the network did not have to represent the board in the relative frame. It could have represented it in the absolute frame and then, at the output layer, converted to relative when necessary. But the fact that the relative frame pops out as linear suggests that the network found it efficient to represent the board in the relative frame.

  However, the anti-realist argument is: the network does not inherently represent the board in the relative frame. It represents it in some high-dimensional activation space, and the relative frame is just one of many equivalent linear recodings that we can choose. The fact that we found one that is linearly decodable does not mean that the network's representation is fundamentally linear; it might be that the network's representation is nonlinear and we are just projecting it onto a linear subspace that happens to align with a natural human concept (the relative frame).

  ### Step 3: Superposition and the Privileged Basis Problem

  In the literature on superposition (e.g., Elhage et al.), it is argued that neural networks may represent more features than they have dimensions by "superposing" them. This means that the features are not aligned with the standard basis (the neurons) but are instead mixed together. The network's internal representation does not have a privileged basis: we can rotate the activation space and the network would function the same (because the subsequent weights would adjust accordingly). Therefore, the only structure that is invariant is the linear algebraic structure (the dot products and linear transformations).

  But note: the linear algebraic structure is basis-independent. So, if the board state is represented as a linear subspace, then that is a basis-independent fact. However, the way we label that subspace (as absolute or relative) is not.

  In the Othello-GPT case, the board state is represented in the relative frame. But is that because the network's computational structure requires it? Or because we chose to interpret it that way?

  Consider: we could have built a linear probe for the absolute frame. It didn't work as well. But that might be because the absolute frame is not aligned with the network's basis. However, we can always rotate the activation space to align the absolute frame with the basis. But then the relative frame would become nonlinear? Not necessarily: because the relative and absolute are linearly related, if the absolute frame were linearly represented in some basis, then the relative frame would also be linear in a rotated basis.

  This leads to the crux: the network's activations form a vector space. The fact that we can find a linear probe for the relative frame but not for the absolute frame in the standard basis does not imply that the relative frame is "more real". It only implies that the standard basis (the neuron basis) is aligned with the relative frame and not with the absolute frame. But the standard basis is arbitrary! We could have chosen any orthogonal basis for the activations. And in fact, if we rotated the activations to align with the absolute frame, then the absolute frame would become linearly decodable and the relative frame would become nonlinear.

  But wait: the rotation we are talking about is a global rotation of the entire activation space. However, the network's weights are fixed in the standard basis. So if we rotate the activations, we must also rotate the weights to maintain the same function. Therefore, the network's function is tied to the standard basis.

  However, note that the probe is applied to the activations in the standard basis. The fact that the relative frame is linearly decodable in the standard basis and the absolute frame is not, tells us that the standard basis (which is the one the network uses for computation) is aligned with the relative frame. This seems to suggest that the network does indeed represent the relative frame linearly.

  But here's the anti-realist counter: the standard basis is the one that the network uses for computation, but that does not mean that the relative frame is the "true" representation. It just means that the relative frame is aligned with the computational basis. The absolute frame is also present, but in a nonlinear way. However, note that the absolute frame is a linear function of the relative frame (and the current player). So if the relative frame is linear, then the absolute frame is also linear? Not exactly: because the absolute frame depends on the current player, which is a separate piece of information.

  Actually, let's formalize:

  Let:
  - `r` be the relative board state (a vector in {empty, mine, yours}^64)
  - `a` be the absolute board state (in {empty, black, white}^64)
  - `p` be the current player (black or white)

  We have:
  r = f(a, p)   [a function that maps: if p is black, then mine=black, yours=white; if p is white, then mine=white, yours=black]

  And conversely:
  a = g(r, p)

  Both `f` and `g` are linear? Actually, they are linear in the sense that they are permutations of the features. Specifically, for each square, the mapping between absolute and relative is a permutation of the three states that depends on `p`.

  Therefore, if we have a representation of `r` linearly in the activations, then we can also represent `a` by first linearly decoding `r` and then applying the linear transformation `g` (which depends on `p`). But note: the current player `p` is also present in the activations? If we can linearly decode `p`, then we can combine to get `a`. However, the original probe for the absolute frame did not do that: it tried to decode `a` directly.

  The key point: the absolute frame is a linear function of the relative frame and the current player. So if the relative frame and the current player are both linearly represented, then the absolute frame is linearly representable. But the original experiment by Li found that the absolute frame was not linearly decodable. This suggests that the current player might not be linearly represented? Or that the linear decoder for the absolute frame was not given the current player as input? Actually, the probe for the absolute frame would typically be given the same activations as the relative frame probe. So if the relative frame is linear, and the current player is linear (which it is, because it's a one-hot feature), then the absolute frame should be linear too.

  Wait, that seems to contradict the original finding. How do we reconcile?

  Two possibilities:

  1. The absolute frame probe was not provided with the current player? But the current player is part of the input and likely represented in the activations. If we are probing the absolute board state, we should condition on the current player? But the probe was probably trained to map activations to absolute board state without being told the current player. However, the current player is in the activations, so the probe could learn to use it.

  2. The absolute frame might be more entangled with other features in the activation space, making it harder to learn with a linear probe. But in theory, if the relative frame is linearly represented and the current player is linearly represented, then the absolute frame is a linear function of the same activations.

  Therefore, the original finding that the absolute frame is not linearly decodable might be due to a suboptimal probe or because the linear relationship is more complex (requires combining more features). But note that Neel Nanda's result showed that the relative frame is linearly decodable with very high accuracy. This suggests that the absolute frame should also be linearly decodable by a two-step process: first decode relative and current player, then convert to absolute.

  However, the original paper by Li might have tried to decode the absolute state without explicitly using the current player. But the current player is present in the activations, so a linear probe for the absolute state could, in principle, use it. So why did the linear probe for absolute state fail?

  One explanation: the relative frame is represented by a set of directions that are aligned with the activation axes, while the absolute frame would require a linear combination that involves both the relative frame and the current player. But that linear combination might be more complex and require more dimensions? Or it might be that the absolute frame is represented in a way that is linearly entangled with other features, making it hard to isolate.

  But note: the mapping from (relative, current player) to absolute is linear and deterministic. Therefore, if we can linearly decode relative and current player, then we can compute absolute. However, if the absolute frame probe is trying to decode absolute without going through relative, it might fail because the absolute state is not a single linear direction but a combination.

  Alternatively, it might be that the network does not explicitly represent the current player as a separate feature? But that seems unlikely because the current player is crucial for the task.

  Given the above, the anti-realist argument can be refined:

  The network's activation space contains the information for both the relative frame and the absolute frame, but the relative frame is more easily linearly separable because it is aligned with the computational basis. The absolute frame is equally present, but it is represented in a more distributed way that requires combining multiple directions. However, this does not make the relative frame "more real". It only makes it more convenient for linear probes in the standard basis.

  Moreover, if we consider the entire computational process, the network might use the relative frame for making predictions, which would explain why it is aligned with the basis. But that is a functional explanation, not a metaphysical one. The network's internal structure is such that the relative frame is computationally convenient, but that does not mean that the network "thinks" in the relative frame in a way that is independent of our interpretation.

  ### Step 4: The Role of the Interpreter

  The key point is: the choice of frame (absolute or relative) is made by the interpreter. The network's activations are just a vector space. The interpreter chooses which features to probe for. The fact that we found a linear representation for the relative frame does not mean that the network intrinsically represents the board state in the relative frame; it means that the relative frame is a natural linear projection of the activation space.

  But note: the network was trained to predict the next move, and the relative frame is more useful for that task. Therefore, the network's architecture and training objective led to the relative frame being linearly represented. However, this is a contingent fact about the training process. If we had trained the network with a different objective, we might have gotten a different representation.

  Moreover, there might be other recodings (beyond absolute and relative) that are also linearly represented. For example, a recoding that groups squares by strategic value. The fact that we found one that works does not mean it is the only one or the "true" one.

  ### Conclusion

  The Othello-GPT result does not prove that the network has a robust, basis-independent representation of the board state. Instead, it shows that in the standard basis, the relative frame is linearly encoded. This is evidence that the network's internal structure is aligned with a computationally useful frame. However, this alignment is a result of the training process and the task, and it does not imply that the relative frame is the network's "native" representation in a metaphysical sense. The network's activations are high-dimensional vectors, and they can be interpreted in many ways. The ease of linear decoding in the relative frame is a fact about the interaction between the network's basis and the interpreter's chosen recoding, not a fact about the network in isolation.

  Therefore, the result is evidence against robust realism: it shows that what counts as "represented" depends on the interpreter's choice of frame. There is no basis-independent fact of the matter that the network represents the board state in the relative frame; there is only the fact that when we choose the relative frame, we can linearly decode it.

  This does not deny that the network has learned a rich internal model of the board. It denies that this model is represented in a way that is independent of the interpretive choices we make when probing it.

  Thus, the strongest version of the anti-realist argument is: the linear representation hypothesis (LRH) is true in a weak sense (there exists a basis in which the feature is linear) but not in a strong, privileged basis sense. The Othello-GPT case shows that the existence of a linear representation depends on the frame we choose (absolute vs relative). Therefore, the network does not have a privileged basis for the board state, and what we observe is a result of our interpretive framework.
answer: |-
  ### A Rigorous Argument Against Robust Realism in Neural Network Representations  
  #### Grounded in the Othello-GPT Probe Results  

  The Othello-GPT case is often cited as evidence for the *Linear Representation Hypothesis* (LRH) — the idea that networks encode human-interpretable features linearly in activation space, awaiting discovery via "correct" probing. However, the shift from nonlinear (absolute board-state) to linear (relative "mine/yours" board-state) decoding actually undermines **robust realism** about neural representations. Below, I formalize this counterargument, taking LRH seriously while demonstrating that the phenomenon hinges on *interpreter-dependent choices*, not intrinsic network properties. The core thesis: **"Representation" is not a basis-independent fact about the network; it is a byproduct of the interpreter's featurization choices, revealing no privileged ontic status for any particular encoding.**  

  ---

  ### **1. The Core Tension: Basis Relativity vs. Realism**  
  #### Key Definitions:  
  - **Robust Realism**: The claim that neural networks encode features (e.g., board states) in a *privileged, basis-independent manner*. If a feature is "represented," this should be discoverable across equivalent recodings without arbitrariness.  
  - **Linear Representation Hypothesis (LRH)**: Features are linearly encoded in activation space. Probes are tools to *discover* these preexisting directions.  
  - **Basis Relativity**: The network’s activations form a vector space. "Linearity" of a feature is defined *relative to a basis* (e.g., neuron basis, Fourier basis, learned superposition basis).  

  #### The Paradox:  
  - **Absolute frame** (black/white/empty): Nonlinear probe required for decoding (Kenneth Li).  
  - **Relative frame** (mine/yours/empty): Linear probe succeeds (Neel Nanda).  
  - Yet, these frames are **extensionally equivalent**: Each is computable from the other via a deterministic, low-complexity function (a permutation conditional on turn player).  
  - **Question**: If the board state is "robustly represented," why does linear decodability *vanish* under a functionally equivalent recoding?  

  ---

  ### **2. The Argument: Why Basis Relativity Undermines Realism**  
  #### Step 1: Superposition and the Absence of a Privileged Basis  
  Neural networks lack a **privileged basis** for representation. Activations exist in a high-dimensional vector space where:  
  - Features are typically **superposed** (multiple features share dimensions) and **entangled** (Elhage et al., Olah et al.).  
  - **No intrinsic alignment**: The neuron basis is arbitrary; rotations of activation space preserve network functionality (via corresponding weight transformations).  

  **Implication**: Linearity is not a property of the *feature itself* but of the *relationship between the feature and the chosen basis*.  
  - The relative frame is linear *in the neuron basis* because the network’s computational pathway aligns with that basis for *task efficiency* (predicting next moves).  
  - The absolute frame is nonlinear *in the same basis* because it requires composing the relative state with turn information — a computation the network need not explicitly linearize.  

  **Crucially**: If we apply a change-of-basis transformation to activations (e.g., rotating via PCA), the relative frame may become *nonlinear* while the absolute frame becomes linear. The network’s underlying computation is unchanged — only the *interpreter’s coordinate system* shifted.  

  #### Step 2: The Interpreter’s Role in Defining "Representation"  
  The probe’s success depends on the interpreter’s choice of **feature basis**, not just the network’s activations. Consider:  
  - **Frame construction**: The relative frame ("mine/yours") is a *human-designed featurization* optimized for Othello strategy. It is not "revealed" by the network; it is *imposed* via the probe.  
  - **Probe as part of the system**: A linear probe is a linear model, \( \text{probe}(x) = Wx + b \). Its success means the feature is *linearly separable* in activation space, not that it is "encoded as a direction."  
  - **Counterfactual**: If interpreters had *started* with the relative frame, they would declare the network a "realist success." Starting with the absolute frame, they declare it a "nonlinear enigma." This inconsistency exposes realism as **observer-relative**.  

  #### Step 3: Efficiency vs. Ontology  
  Pro-realists argue:  
  > *The relative frame is linear because it’s the network’s "native" encoding for computational efficiency.*  

  **Rebuttal**: Efficiency does not imply ontological privilege.  
  - The network’s architecture (transformers) incentivizes **linear representability of *salient* features** for next-token prediction. "Mine/yours" is salient; absolute colors are not.  
  - However, the absolute frame is **equally computable** from activations (via nonlinear probe). Both frames are "represented" in the weak sense of being recoverable.  
  - **Basis-dependent asymmetry**: The linearity of "mine/yours" reflects the *task’s symmetry* (players alternate), not a ground-truth state. Rotate activations, and symmetry breaks.  

  **Thus**: The network represents *information* sufficient to reconstruct both frames, but neither is "more real" — they emerge from the interaction of network dynamics and interpreter choices.  

  ---

  ### **3. Formalizing the Challenge to LRH**  
  Assume LRH holds: Features *are* linearly encoded in *some* basis. Even then:  
  - **Basis ambiguity**: For any feature \( f \) and activation space \( \mathbb{R}^d \), there exist infinitely many bases where \( f \) is linear. The "correct" basis is defined by *ease of probing*, not network internals.  
  - **Frame-relative linearity**: Let \( \phi_{\text{abs}} \) and \( \phi_{\text{rel}} \) be featurizations of the board state. We have:  
    \[
    \phi_{\text{rel}} = g(\phi_{\text{abs}}, p_{\text{turn}}), \quad \phi_{\text{abs}} = g^{-1}(\phi_{\text{rel}}, p_{\text{turn}}),
    \]  
    where \( g \) is linear (a permutation). If \( \phi_{\text{rel}} \) is linear in activations, \( \phi_{\text{abs}} \) must be *affine* (linear plus turn-dependent offset).  
    - **Result**: \( \phi_{\text{abs}} \) appears nonlinear *if the probe ignores \( p_{\text{turn}} \)’s encoding*. With access to turn information, both frames are linearizable. This is an **artefact of probe design**, not representation.  

  **Conclusion**: Linearity is **featurization-contingent**. LRH cannot resolve which frame is "fundamental" without circular appeal to the interpreter’s choice.  

  ---

  ### **4. Why This Isn’t "Cheap" Interpretivism**  
  - **Not mere underdetermination**: This isn’t "any interpretation goes." The network *does* constrain what is decodable (e.g., you cannot linearly decode illegal board states).  
  - **Takes LRH seriously**: We accept that linear directions *exist* for useful features. But their "reality" dissolves upon recognizing:  
    - The **equivalence class** of linear recodings (e.g., absolute/relative) is large.  
    - **No causal asymmetry**: The network uses activations to compute moves, but this computation does not care if *we* label a direction "mine" or "black."  
  - **Empirical prediction**: If we train a probe for a *non-strategic* recoding (e.g., "pieces in the top/bottom half"), it may also be linear — but this doesn’t imply the network "represents" that frame. Linearity tracks *probe-friendly bases*, not ontology.  

  ---

  ### **5. Implications for Mechanistic Interpretability**  
  The Othello-GPT case reveals:  
  - **Success conditions for mech interp**: Linear decoding is a function of **(interpreter’s frame + network activations)**, not network activations alone.  
  - **Danger of realism**: Assuming a "true" representation risks:  
    - **Confirmation bias**: Celebrating frames that yield linear probes, ignoring equivalent nonlinear ones.  
    - **Overfitting explanations**: Attributing computational structure (e.g., "the network uses relative coordinates") that is basis-relative.  
  - **Path forward**: Embrace **basis-relative realism** — representations exist, but only relative to a featurization. The goal is not to find "the" basis but to map *how featurizations interact* with network computation.  

  ---

  ### **Final Synthesis**  
  The linear probe for "mine/yours" is not evidence of a robust world model; it is evidence that **the network’s activation space admits a linear recoding of the board state when featurized to align with the task’s symmetry**. This alignment is contingent on:  
  1. The **interpreter’s choice** of frame (relative over absolute),  
  2. The **arbitrary neuron basis**,  
  3. The **task objective** (next-move prediction).  

  Change any, and "linear representation" may vanish. Thus, the network no more "represents the board state" in a privileged sense than water "represents" \( \mathrm{H_2O} \) or \( \mathrm{HO-H} \) — it is all description-relative. What *is* real is the network’s *computational capability*, but its decomposition into "features" is a story we impose, not one we discover.
