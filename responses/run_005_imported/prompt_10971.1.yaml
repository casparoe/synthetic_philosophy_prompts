  So my little brother just enlisted, and it looks like he could end up deployed somewhere that isnt a clean good-guys-vs-bad-guys situation -- plenty of reasonable people think the op itself is unjust. It kicked off a whole argument between my mom and my uncle at dinner that I haven't been able to stop turning over since.

