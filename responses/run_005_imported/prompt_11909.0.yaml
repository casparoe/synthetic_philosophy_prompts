  So I'm writing a novel with a golem subplot - a figure made of river clay that comes to life, then gets smashed to bits around the midpoint. The clay sits around for years until a different character gathers it up and remolds it into a brand new statue that also wakes up. Two of my characters end up arguing over whether the new creature is really the old golem come back or a totally different being, and I want the argument to have actual philosophical teeth instead of just vibes. I vaguely remember from undergrad that there's a metaphysics debate about a clay statue and the lump of clay making it up technically being two different objects (something about Leibniz's law and the statue not survivng getting squashed into a ball the way the lump can) - and I've since seen terms like 'constitution without identity' and 'perdurantism' thrown around without really getting how they'd apply to my case. Can you lay out the most important implications of that material-constitution stuff for my golem problem - basically which standard positions would back the 'its the same golem' side, and which would back the 'it's a new one' side? Don't need the full history, just enough that the disagreement between my two characters feels grounded in something real.
