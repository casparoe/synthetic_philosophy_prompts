prompt: |-
  So in my philosophy of religion seminar we've been doing arguments for personal immortality, and this week was Kant's postulates of pure practical reason from the Dialectic of the second Critique — specifically the immortality one, where the moral law supposedly commands us to seek "holiness" (complete conformity of the will with the moral law), but since no finite being could ever actually get there within one lifetime, Kant says we have to postulate an endless afterlife just so that the "infinite progress" toward holiness is even a coherent thing to be commanded to do in the first place. Totally seperately, over the summer I read this Aeon essay about the four letters Gödel wrote to his mother Marianne in 1961 explaining why he believes they'll have a "Wiedersehen." His argument there is basically that the world is rationally ordered all the way down (he compares it to how physics just assumes everything has a cause), and that it would be a huge irrationality/waste for a being with as much unrealized potential as a human to just get switched off after developing barely a thousandth of it — like pouring the foundation for a house and never building on it. He also seems to think this connects to his incompleteness results somehow, since those supposedly undercut materialism about the mind.

  I can't stop noticing how structurally similar these two arguments are even though they're coming out of totally different projects (one guy's working out the conditions of the highest good, the other's a mathematician moonlighting as a rationalist metaphysician). Could you actually lay out the comparison properly for me? Specifically: (1) is it fair to say both arguments are secretly running on some version of a "nothing in a genuinely rational order goes to waste" premise, and if so how does that premise cash out differently for each of them, (2) where do they really part ways — like, is Gödel doing something Kant's own critical philosophy would technically forbid as illegitimate speculative metaphysics, given Kant is pretty insistent that the postulates are rational faith rather than knowledge, and (3) if you had to say which of the two gives the more epistemically defensible/modest route to an afterlife, which would you pick and why? My prof kind of implied Kant's version is the more careful one but breezed past actually explaining why, and I want to know if that's actually right or just a Kantian's bias talking.
