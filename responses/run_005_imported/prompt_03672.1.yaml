  First, I need to recall Kant's argument. In the Critique of Practical Reason, Kant argues that morality requires us to strive for holiness—perfect alignment with the moral law. Since this is impossible in a finite lifetime, he postulates immortality to allow for infinite progress. This is a postulate of practical reason, not theoretical knowledge. It's about what we must assume for morality to make sense, not about proving immortality theoretically.

  Then there's Gödel. His argument, from letters to his mother, is based on a rational universe where everything has a purpose. He thinks it's irrational for human potential to be unrealized, comparing it to building a foundation without a house. He also ties this to his incompleteness theorems, suggesting that materialism can't explain the mind, thus implying immortality.

  The user notices structural similarities. Both seem to rely on a "nothing in a rational order goes to waste" premise. For Kant, it's teleological but confined to practical reason. The moral goal must be achievable, so progress can't be futile. For Gödel, it's a metaphysical principle about rational order and potential. His is more expansive, applying to the universe's structure.

  Where they part ways is crucial. Kant strictly limits such claims to practical faith, avoiding speculative metaphysics. Gödel ventures into metaphysics, claiming knowledge based on rational principles. Kant would criticize this as overstepping the bounds of reason. The user's professor thinks Kant is more careful, so I need to evaluate that.

  Epistemically, Kant's argument is more modest. It's a necessary assumption for morality, not a theoretical proof. Gödel's relies on broad metaphysical claims that are harder to justify. His reference to incompleteness theorems might not directly support anti-materialism as he thinks. So Kant's approach is less vulnerable to criticism, making it more defensible in a philosophical context.

