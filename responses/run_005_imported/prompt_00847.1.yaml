answer: |-
  That's an excellent and crucial distinction to make when grappling with Chang's argument. You're right to sense tension between "on a par" and "incommensurable" (or "incomparable" in the broad sense). Chang is **deliberately carving out a new, specific evaluative relation distinct from both strict comparability (better/worse/equal) *and* broad incomparability/incommensurability.**

  Here's a breakdown comparing "on a par" with the everyday "incommensurable/apples-to-oranges" idea:

  **1. Everyday "Incommensurable" (Apples-to-Oranges):**

  *   **Meaning:** The values involved are fundamentally different kinds of "goodness." There's *no common measure or scale* on which to evaluate them against each other at all.
  *   **Implication for Choice:** Choosing between them is essentially arbitrary or non-rational. There's no basis for saying one is *better*, but there's also no basis for saying they are *meaningfully comparable* in any way. It's like choosing between the color red and the number 7 – the categories are disjoint.
  *   **Analogy:** Choosing between the aesthetic value of a painting and the nutritional value of an apple. You might *have* to choose one, but the choice feels like picking randomly between utterly unrelated things.
  *   **Feeling:** Helplessness, randomness, perhaps resignation. "There's just no way to compare them; it's impossible."

  **2. Chang's "On a Par":**

  *   **Meaning:** The options *can* be compared meaningfully, but they resist being ranked as better, worse, or *exactly* equal. They are "in the same neighborhood of value" but differ in *kind*, not just degree. Crucially, **small improvements** to one option *can* tip the balance, making it better than the other.
  *   **Implication for Choice:** While there's no single, decisive reason declaring one *objectively better*, the choice is **not arbitrary**. It's a space where your **commitment** or **will** becomes the decisive factor. You can *create reasons* through your choice. This is where hard choices become opportunities for self-definition.
  *   **Analogy:** Choosing between becoming a lawyer or a philosopher. Both are valuable careers, but in different ways (prestige/money vs. intellectual depth/meaning). You can meaningfully compare them – you weigh the pros and cons – but neither clearly trumps the other. Crucially, a slightly higher salary offer for the law job *might* tip the scales towards law, showing they weren't incomparable, just on a par.
  *   **Feeling:** Difficulty, tension, *but also agency*. "It's incredibly hard, but my choice *matters* and says something about who I am and what I stand for."

  **Key Differences & Why "On a Par" is a New Category:**

  *   **The "Small Improvement Test":** This is Chang's litmus test for parity. If a small improvement to Option A makes it clearly better than Option B, then the original A and B were *on a par*, **not** incomparable. True incomparables wouldn't respond to small improvements (e.g., improving a career slightly doesn't suddenly make it comparable to chewing gum).
  *   **Comparability vs. Determinacy:** "Incommensurable" often implies *no basis for comparison*. "On a par" implies **robust comparability** – you *can* and *do* compare them intensely! – but **indeterminacy** in the outcome of that comparison. The values clash, compete, and resist a single verdict, but they *engage* with each other.
  *   **Role of the Agent:** Under broad incomparability, the agent is passive; the choice is random. Under parity, the agent is **active and normative**; their commitment *resolves* the indeterminacy and *creates* the reason for choosing one over the other.
  *   **Beyond "Equal":** Chang emphasizes that "on a par" is *not* the same as "equally good." If options are truly equal, a small improvement to one *always* makes it better. With parity, a small improvement *might* tip the balance, but it doesn't *have* to; the improvement itself might be insignificant relative to the value difference, or might even create a new kind of imbalance. Parity acknowledges a more complex relationship.

  **Is it just a rebrand of incomparability?**

  *   **No.** Chang is specifically targeting a *subset* of what is often lazily lumped under "incomparable" or "incommensurable." She argues that many hard choices we *call* incomparable aren't truly like comparing careers to chewing gum. They involve comparable *kinds* of value (e.g., different fulfilling careers, different loving relationships) that are so complexly different that they resist strict ranking, yet remain meaningfully comparable and responsive to our agency.
  *   **Rebranding?** It's more like **precision carving**. She takes the vague, catch-all category of "incomparable" and identifies a specific, important phenomenon *within* it that behaves differently and has profound implications for how we understand agency in hard choices. "On a par" isn't a synonym for incomparability; it's a proposed *alternative* to it for a significant class of choices.

  **In Summary:**

  | **Concept**          | **Everyday Incommensurability**           | **Chang's "On a Par"**                     |
  |----------------------|------------------------------------------|-------------------------------------------|
  | **Core Meaning**     | No common scale, fundamentally different | Comparable but indeterminately ranked     |
  | **Small Improvement**| No effect on comparison                  | Can tip the balance                       |
  | **Comparability**    | None – disjoint categories               | Robust – values engage meaningfully       |
  | **Choice Basis**     | Arbitrary/random                         | Personal commitment creates reasons       |
  | **Agent Role**       | Passive                                  | Active and self-defining                  |
  | **Feeling**          | Helplessness, randomness                 | Difficulty with agency and significance   |
  | **Relation**         | Apples vs. oranges                       | Different career paths or life visions    |

  Chang argues that recognizing "parity" transforms hard choices from frustrating impasses into opportunities for self-creation. The difficulty isn't because the options *can't* be compared (broad incomparability), but because the comparison reveals a deep clash of values that *only you* can resolve through commitment. It's a distinct evaluative space she's proposing.
