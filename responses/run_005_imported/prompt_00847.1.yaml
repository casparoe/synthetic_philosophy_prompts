prompt: |-
  rewatching Ruth Chang's 'How to Make Hard Choices' TED talk for a piece and got stuck on her claim that when two options cant be ranked as better, worse, or equal, they might still be 'on a par.' can you compare that specific 'parity' move with the more general, fuzzier everyday idea that the values at stake are just incommensurable, apples-to-oranges, no common scale? is she actually carving out a new evaluative relation there, or is 'on a par' basically just a rebrand of plain old incomparability?
reasoning: |-
  Okay, the user is diving into Ruth Chang's TED Talk about hard choices, specifically her concept of being "on a par." They're trying to understand how this differs from the everyday idea of incommensurability, like apples-to-oranges comparisons. Let me unpack this carefully.

  First, the user might be writing an analysis piece and wants to accurately represent Chang's argument. They're stuck on whether "on a par" is a genuinely new concept or just a rebranding of incomparability. I need to clarify the nuances here.

  Chang distinguishes between three relations: better, worse, equal. When choices don't fit these, people often say they're incomparable. But she argues that's too simplistic. Her "on a par" suggests that while options can't be precisely measured against a common scale, they aren't entirely incomparable. Instead, small improvements in one could tip the balance, unlike with true incomparables like careers versus chewing gum.

  The user mentions "apples-to-oranges" as the common understanding. That's important. Everyday incommensurability often implies no basis for comparison. But Chang's parity allows for comparison through trade-offs and personal values. The key difference is that parity preserves the ability to choose meaningfully, whereas incomparability might imply arbitrary choice.

  I should explain how Chang uses small improvements to test parity. If improving one option slightly makes it better, then the original two are on a par. If no improvement affects the comparison, they're incomparable. This test shows parity isn't just fuzzy equality but a distinct relation enabling rational choice based on commitment.

