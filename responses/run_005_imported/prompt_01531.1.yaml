  Now, the third position (Lewis/Schaffer) is my mandate. I should build it step by step: start with counterfactual dependence as the gold standard for causation (if omission changes outcome, it's causal), then argue that restricting this with norms or duties confuses causation with responsibility. The key move is divorcing metaphysics from pragmatics: causation is objective, but explanation is selective.  

  For rival engagement, Dowe's physicalism (no absences as causes) is easier to dismantle: if causation requires energy transfer, then *failing to brake* isn't causal—but intuitively, it is! His "quasi-causation" feels like a cop-out. McGrath's normativity is trickier; I'll concede duties matter for *blame* but insist they don't define causation. Example: if a random passerby *could* have saved a drowning child but didn't, their omission causally contributed—even if we'd only blame the lifeguard.  

  User’s deeper need: they might suspect legal blame relies on pragmatics (who *should* have acted), not metaphysics. My verdict should validate that—e.g., "metaphysics gives all difference-makers; courts pick the relevant one." That helps their reporting: they can say negligence *is* causal (metaphysically), but blame targets the *expected* preventer.  

  Structure:  
  1. **Argue for unrestricted omissions-as-causes**: Hammer counterfactuals. Use Schaffer’s contrastivism (cause vs *preventer*).  
  2. **Refute Dowe**: Absences *do* cause—e.g., no oxygen causes suffocation. Physicalism ignores how we reason about outcomes.  
  3. **Refute McGrath**: Norms guide *selection*, not causation. If causation required duty, we couldn’t say "the asteroid’s absence caused Earth’s survival" (no duty!).  
  4. **Verdict**: Metaphysics won’t pinpoint "the" cause in negligence—it lists all conditions. Blame is normative/pragmatic. User should treat "cause" in courtrooms as explanatory, not metaphysical.  

  Tone: Forceful but precise. No hedging—user wants bullets bitten. Close with: "For your reporting, the 'real' cause includes all omissions; blame is where norms/pragmatics kick in."
answer: |-
  Here’s the case for the unrestricted counterfactual view—the position that *all* difference-making omissions (including the Queen’s) are genuine causes, with our reluctance to cite them reflecting pragmatic, not metaphysical, constraints. I’ll engage directly with Dowe and McGrath, then conclude with a verdict for your reporting.

  ### The Core Argument: Causation as Pure Difference-Making  
  1. **The counterfactual bedrock**:  
     Causation is fundamentally about counterfactual dependence: event *C* causes event *E* iff, had *C* not occurred, *E* would not have occurred (or its probability would drop significantly). The gardener’s omission satisfies this: no water → dead plant. So does the Queen’s: had she watered it, the plant lives. Both omissions are *objectively necessary* for the outcome in the actual circumstances. To deny this is to deny that counterfactuals track causation—a non-starter for negligence cases, where we *rely* on “if they’d acted, the harm wouldn’t have happened.”  

  2. **Contrastivism sharpens the point**:  
     Schaffer’s contrastive approach notes that “cause” is always implicit: “*C* rather than *C*’ caused *E* rather than *E*’.” For omissions, we ask: “Did *not watering* (rather than watering) cause *death* (rather than survival)?” For both the gardener *and* the Queen, the answer is “yes.” The Queen’s inaction isn’t a *less real* cause—it’s a cause under the same metaphysical lens.  

  ### Where Dowe Goes Wrong: The Illusion of "Quasi-Causation"  
  Dowe’s conserved-quantity theory (causation requires physical processes like energy transfer) dismisses absences as non-causal. But this:  
  - **Collapses in everyday and legal reasoning**: If omissions aren’t causes, a surgeon’s failure to sterilize instruments doesn’t *cause* an infection—only the bacteria’s presence does. This guts negligence law, which hinges on *inaction* as causal. Dowe’s “quasi-causal” label is an ad hoc retreat: it admits we *need* omissions to explain outcomes but denies them metaphysical standing. Why? If counterfactuals work (e.g., sterilize → no infection), and we model the world with them, what justifies demoting omissions to second-class status? Physics alone can’t resolve normative questions like liability—but it doesn’t follow that causation must be physical.  
  - **Implausible in omission-dense scenarios**: Consider a patient’s death from dehydration in a hospital. Dowe must say the nurse’s failure to provide water isn’t a cause—only the biochemical processes of organ failure are. Yet without the omission, the biochemical processes wouldn’t have occurred. Denying this dependence is unscientific.  

  ### Where McGrath Goes Wrong: Conflating Causation with Blame  
  McGrath argues norms (duties, expectations) constrain causation itself: the gardener’s omission causes death because they *should have watered*, while the Queen’s doesn’t because she had no duty. But this:  
  - **Muddles metaphysics with ethics**: Suppose an off-duty lifeguard fails to save a drowning child. If causation requires duty, the lifeguard’s omission *causes* the death, but a bystander’s identical omission does *not*. Yet the counterfactual is identical: either could have saved the child. McGrath’s view makes causation subjective—dependent on social norms—undermining its role in objective explanations. If a regulator’s duty defines causation, we couldn’t say “the valve failure caused the disaster” *until* we establish legal responsibility. Causation becomes circular.  
  - **Fails in non-normative contexts**: Consider natural “omissions”: the absence of rain causes a forest fire. Rain has no “duty” to fall—yet we call its absence causal. If causation itself is normative, we lose the language to describe amoral cause-and-effect (e.g., in epidemiology: “lack of herd immunity caused the outbreak”).  

  ### Why Pragmatics (Not Metaphysics) Explains Our Discomfort  
  Our refusal to cite the Queen isn’t because she didn’t *cause* the death—it’s because citing her is **explanatorily useless** or **conversationally irrelevant**:  
  - **Explanatory selectivity**: All causes aren’t equal. We cite *salient* factors: those abnormal (the gardener’s job vs. the Queen’s non-role), manipulable (we can fire gardeners, not monarchs), or normatively charged (duties invite blame). The law focuses on *proximate* causes not because distal ones aren’t causal, but because they’re less actionable.  
  - **Conversational efficiency**: In court, saying “the Queen’s omission caused it” is true but unhelpful—it doesn’t identify *preventable* failures. Like noting that oxygen’s presence “caused” the fire: true, but irrelevant to arson charges.  

  ### Verdict for Your Reporting  
  **Metaphysics won’t tell you who “really” caused a regulatory failure**—because *every* difference-making omission (the inspector’s, the CEO’s, even the public’s) *is* a “real” cause under a counterfactual lens. But this doesn’t make blame arbitrary. Pragmatics and norms do the essential work of **selecting which cause matters**:  
  - **In court**: We blame those with *duties and capacities*—not because their omission is uniquely causal, but because holding them responsible is *fair* and *effective* at preventing future harm.  
  - **In your reporting**: You can confidently state that negligence cases reveal causation as metaphysically “profligate”—but the law (and public discourse) rightly focuses on the *meaningful* omissions: those tied to roles, expectations, and social contracts.  

  **Bottom line**: Causation is a web of counterfactual dependencies, thick with omissions. But responsibility is a spotlight, aimed by pragmatics and ethics. For accountability, follow the spotlight—not because it reveals the *only* cause, but because it points to the cause we can, and should, control.
