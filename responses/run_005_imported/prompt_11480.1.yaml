  Interesting that the search method matters here. If she's using AI-enhanced search, does that cross into "outsourcing cognition" territory? But wait - her notes file is entirely self-created, so even with efficient search, she's still accessing her own synthesized knowledge. The difference between Ctrl+F and semantic search might be about speed rather than fundamental cognitive process. 

  The philosophical angle is tricky. While Otto's notebook illustrates how external tools can function as cognitive extensions, applying this to exam settings requires careful boundaries. Maybe the key is whether the tool replicates typical memory function rather than augments it. Her file seems to serve as prosthetic memory rather than an enhancement. 

