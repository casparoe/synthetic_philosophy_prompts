  The recommendation needs to reframe success metrics: Instead of measuring raw recall, we should assess her ability to organize and apply knowledge - which is precisely what her system demonstrates. This aligns with real-world cognitive strategies where professionals rely on external memory systems. 

  Better include concrete implementation details too: File verification process, exam environment specs, and clear language about what constitutes "personal synthesis" versus prohibited content. The philosophy argument should be presented but not over-relied upon - focus on practical pedagogy and disability equity.
answer: |-
  ## Committee Recommendation Memo: Exam Accommodation Appeal  
  **Student:** [Redacted], Undergrad in Intro Cognition (PSY 101)  
  **Request:** Permission to use a self-created, searchable "running notes file" during closed-book exams.  
  **Documented Disability:** Acquired brain injury impairing long-term consolidation/retention of new information.  

  ### Key Facts & Context
  1.  **Existing Accommodations:** Approved (extra time, quiet room).  
  2.  **Nature of Request:** 
      *   File developed over 3 years as a compensatory memory system.  
      *   Content is solely the student’s synthesized notes from coursework/study.  
      *   "Plain language searchable" (method unspecified; could include Ctrl-F, basic regex, or AI-enhanced semantic search).  
  3.  **Course Objective (PSY 101):** Assess understanding of core cognitive concepts (attention, memory, perception, reasoning), their interactions, and basic experimental paradigms.  
  4.  **Faculty Concerns:**  
      *   Violates the core integrity of a "closed-book" exam by externalizing memory.  
      *   Sets a precedent enabling any external aid under an "extended mind" argument.  
  5.  **Chair's Argument:** Invokes Clark & Chalmers' "Otto and his Notebook" thought experiment, suggesting the file may function as a legitimate cognitive extension for this student, akin to biological memory.  

  ### Analysis & Recommendation

  **Recommendation: APPROVE the accommodation WITH STRICT CONDITIONS.**

  **Rationale:**

  1.  **Addressing the Core Disability:** The student's documented impairment specifically targets *long-term retention*, not initial comprehension or reasoning ability. Standard accommodations (extra time, quiet room) address test-taking environment but do not mitigate the fundamental barrier: the inability to reliably retrieve information learned days/weeks prior. This file is a documented, personalized compensatory mechanism developed *as a direct result of her disability*. Denying its use functionally tests a capacity she neurologically lacks, not her mastery of course concepts.  

  2.  **"Closed-Book" Purpose vs. Prosthetic Function:**  
      *   **Faculty Skepticism (Valid but Misapplied):** Yes, a core purpose of "closed-book" is assessing knowledge held internally. *However*, this assumes a typical neurocognitive memory system. For this student, biological long-term memory is profoundly impaired. Her file *is* her functional long-term storage – it's not a shortcut, but a necessity.  
      *   **The "Otto" Analogy (Nuanced Relevance):** While the Chair's philosophical point highlights that cognition often relies on external tools, we needn't adopt the full "extended mind" thesis wholesale to see its relevance here. The key parallels are:  
          *   **Reliability & Access:** The file is consistently carried/accessed (like Otto's notebook).  
          *   **Trust & Integration:** The student demonstrably *relies* on it as her primary recall system.  
          *   **Personal Curation:** Content is entirely self-generated, reflecting *her* understanding and organization (unlike a textbook or search engine).  
      *   **Critical Distinction:** This isn't "smuggling in an open-notes exam." An "open-notes" policy typically allows *any* notes created for the exam period. This is permission to use a *specific, disability-necessitated prosthetic memory system*. The goal shifts from testing raw biological recall (impossible for her) to testing her ability to *organize knowledge effectively and retrieve/apply it accurately* using her established compensatory tool – a highly relevant cognitive skill.  

  3.  **Precedent & Boundaries:**  
      *   **Not a Slippery Slope:** Approval is **not** an endorsement for any device. It is *highly specific*:  
          *   **Medical Necessity:** Requires robust documentation of a disability directly impairing long-term memory consolidation/retention.  
          *   **Tool Specificity:** The external aid must be a *personal, curated knowledge repository* developed over time as a primary memory prosthesis, not a general reference or last-minute study aid.  
          *   **Course Alignment:** The assessment must primarily target understanding and application, not rote memorization of discrete facts easily "looked up." (Intro Cognition generally meets this).  
      *   **Denial Sets a Worse Precedent:** It signals that even with compelling medical evidence and a tailored compensatory system, students with profound memory impairments cannot be validly assessed on higher-order cognitive skills within standard course structures.  

  4.  **The Search Functionality Question:**  
      *   **"Plain Language Searchable" is Acceptable.** The *method* of search (Ctrl-F, regex, AI-semantic) is **less critical than the content being searched.**  
      *   **Why it Doesn't Fundamentally Alter the Case:**  
          *   The file's content remains her own synthesized knowledge.  
          *   Efficient search within a *personal knowledge base* mirrors the brain's associative retrieval processes. Biological memory isn't serial scanning; it's pattern-based and reconstructive. An efficient search tool within her *own notes* facilitates access analogous to functional recall.  
          *   **Key Boundary:** Search must be confined *strictly* to her curated file. **No external databases, generative AI (like ChatGPT), or internet access can be permitted.** The tool accesses *her* memory trace, not external knowledge.  

  ### Conditions for Approval (CRITICAL)

  1.  **File Verification:** Disability Services (DS) must verify the file *before each exam*:  
      *   Content is solely the student's original notes/synthesis.  
      *   No embedded external sources, generative AI content, or hyperlinks.  
      *   File is the cumulative version she uses daily.  
  2.  **Technology & Environment:**  
      *   Exam taken on a DS-provided or DS-secured laptop/device.  
      *   **Strict Air-Gap:** **NO internet access, NO network connectivity, NO other applications running.** (DS can configure this).  
      *   Search functionality restricted to the single approved file.  
      *   Proctoring to ensure compliance.  
  3.  **Scope:** This accommodation is approved *specifically* for this student, for this documented disability, for this course (PSY 101), using *this specific file*. Future requests require separate review based on course objectives and disability documentation.  
  4.  **Faculty Consultation:** The instructor should be consulted to confirm exam questions focus on application, analysis, and synthesis, minimizing reliance on rote fact recall where look-up would trivialize the question.  

  ### Conclusion
  Denying this accommodation fails to address the student's documented memory impairment and functionally assesses a capacity she lacks. Approving the use of her curated notes file, under stringent conditions verifying its nature and preventing external access, allows for a valid assessment of her *understanding and ability to apply cognitive science concepts* using her necessary compensatory system. This respects the intent of closed-book assessment while acknowledging the neurological reality of her disability and the prosthetic function of her notes. The "Otto" analogy usefully highlights the integration of the tool into her cognitive process but is not the sole basis for approval; the primary justification rests on medical necessity, the prosthetic nature of the file, and the alignment with higher-order course objectives under controlled conditions.  

  **Recommendation:** Approve the use of the specified self-created running notes file during closed-book exams for PSY 101, subject to the strict verification, technological, and proctoring conditions outlined above.  

  ---
  **Prepared By:** [Your Name], Grad Rep, Exam Accommodations Appeals Committee  
  **Date:** October 26, 2023
