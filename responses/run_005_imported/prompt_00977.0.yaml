  Pascal's Mugging is a thought experiment where a mugger claims they can affect astronomically large value (like 3↑↑↑↑3 lives), and demands a small payment. The paradox arises because even if you assign an extremely low probability to their claim, the expected value calculation suggests you should pay, since the tiny probability multiplied by the huge value still outweighs the small cost. But intuitively, most people feel this is irrational.

  There are two main solutions proposed: leverage penalties (discounting claims based on how much value they purport to affect) and bounded utility functions (capping how much value anything can have). But Beckstead and Thomas argue that any decision theory must be either "reckless" (prioritizing tiny chances of huge gains) or "timid" (avoiding small risks even when potential gains are enormous).

  Wilkinson defends the "reckless" position, calling it "fanaticism." He argues we should accept the seemingly irrational conclusion of paying the mugger because otherwise we might miss out on truly astronomical benefits. I need to weigh these positions and come to a verdict on what an ideally rational agent should do.

  I think the best approach is to defend a form of leverage penalty as a principle of epistemic rationality. When someone makes an extraordinary claim (especially one that would grant them huge leverage over value), we should require proportionally stronger evidence. The more outlandish the claim, the more skeptical we should be. This isn't just an arbitrary discount - it's based on how evidence works in Bayesian reasoning.

  For the essay, I'll structure it to first explain the paradox clearly, then present the standard fixes and the Beckstead-Thomas dilemma, then Wilkinson's fanaticism, and finally defend my epistemic solution. I'll argue that while leverage penalties might seem "timid," they're actually rational because they properly account for the relationship between claim magnitude and required evidence.

  The verdict will be that an ideally rational agent should not pay the mugger, because the mugger hasn't provided evidence proportional to their extraordinary claim. I'll specify that if the probability is above some threshold (say 1/3^^^^3 for 3^^^^3 units of value), then pay, but otherwise don't. This avoids both extreme recklessness and pure timidity by grounding the threshold in epistemic principles.
answer: |-
  ## The Mugger's Calculus: Epistemic Prudence Against Cosmic Extortion

  Pascal's Mugging presents a stark challenge to conventional decision theory: an agent employing unbounded expected utility maximization appears compelled to surrender a small sum to a stranger making an astronomically grandiose, yet minimally probable, threat or promise. While fixes like leverage penalties (discounting credence based on the scale of claimed impact) or bounded utility functions (capping maximal value) offer intuitive escapes, the Beckstead-Thomas dilemma frames a troubling choice: any consistent decision theory must be either **reckless** (sacrificing any finite certain good for a tiny chance of a sufficiently large gain) or **timid** (sacrificing any arbitrarily large gain to avoid an arbitrarily small increase in risk). Hayden Wilkinson, embracing the "fanatic" or reckless horn, argues we must accept the counterintuitive payment to avoid potentially forgoing truly astronomical value. However, a closer examination reveals that epistemic rationality, manifested through a principled leverage penalty, provides the ideal agent with a defensible shield against the mugger, effectively navigating the dilemma without succumbing to either extreme recklessness or paralyzing timidity.

  **The Core Tension and the Dilemma's Bite**

  The mugging exploits the mathematical property that any finite probability, however minuscule, multiplied by an infinite (or sufficiently vast finite) utility yields an infinite (or dominant) expected utility. Standard expected value reasoning thus dictates payment. Leverage penalties (e.g., credence ∝ 1/N for claimed impact N) or bounded utility directly block this by ensuring the product `P * U` approaches zero or is capped as N explodes. Yet Beckstead and Thomas expose a deeper issue: rejecting recklessness implies timidity. If an agent refuses to trade *any* certain good (say, saving 1 life) for a 1/3^^^3 chance of saving 3^^^3 lives (where ^^^ denotes Knuth's up-arrow notation for incomprehensibly large numbers), they are timid. Conversely, accepting *any* such trade, no matter how improbable the gain relative to the certain loss, is reckless. Wilkinson defends this recklessness ("fanaticism") as the cost of ensuring sensitivity to potentially real, universe-spanning stakes. To decline fanaticism, he argues, is to pre-commit to ignoring truly transformative possibilities, however unlikely.

  **Defending Epistemic Prudence: The Leverage Penalty as Rational Skepticism**

  Wilkinson's fanaticism, however, demands an untenable suspension of epistemic norms. The flaw lies not in valuing vast potential outcomes, but in assigning non-negligible credence to claims *solely because* their sheer scale overwhelms any reasonable probability assessment. An ideally rational agent's credence (`P`) should reflect the strength and nature of the *evidence* supporting a hypothesis. The mugger's claim – possessing god-like powers to affect N units of value – is not merely improbable; it is an **extraordinary claim**.

  Here, a principled leverage penalty emerges not as an ad hoc fix, but as a consequence of epistemic rationality. Extraordinary claims *require* extraordinary evidence. The scale of the claim (`N`) is directly relevant to its extraordinariness. A claim to affect 3^^^^3 lives is exponentially more extraordinary than a claim to affect 100 lives. For the ideal agent, the prior probability of *any* entity possessing such power, based on background knowledge of the universe's regularities, is vanishingly small – plausibly decaying *faster* than any inverse polynomial in `N`. Assigning a fixed tiny probability (e.g., 1/10^100) independent of `N` ignores this crucial relationship between claim magnitude and inherent plausibility. It treats the mugger's escalating claim as just another lottery ticket, rather than an increasingly radical departure from known reality demanding proportionally stronger evidence.

  The mugger provides *no evidence whatsoever* proportional to the scale of their claim. They offer only the bare assertion. Therefore, the rational credence (`P`) should be *inversely proportional* to the magnitude of the claimed impact (`N`). Specifically, `P(N)` should be such that `P(N) * N` approaches zero as `N` increases. This could be `P(N) < 1/N`, `P(N) < 1/N^k` for some `k>1`, or `P(N) < e^{-N}` – the precise functional form depends on the agent's prior over possible causal powers in the universe, but it must reflect the increasing *a priori* implausibility of wielding such vast influence. **This is not timidity; it is epistemic hygiene.**

  **Resolving the Dilemma: Prudence Without Paralysis**

  This approach deftly avoids both horns of the Beckstead-Thomas dilemma:

  1.  **Not Reckless:** The agent *would not* sacrifice a guaranteed good (e.g., saving 1 life) for a *fixed* tiny probability (e.g., 1/10^100) of saving an astronomical `N` lives, *if* `P(N)` is discounted sufficiently based on `N`. The expected value `P(N) * N` becomes negligible compared to the certain loss. The mugger cannot extort payment simply by naming a larger `N`.
  2.  **Not Timid:** Crucially, the agent *would* sacrifice the guaranteed good for a chance at `N` lives *if the evidence warranted a sufficiently high credence `P(N)`*. If the mugger provided demonstrable proof of their power proportional to `N` – say, verifiable, smaller-scale demonstrations of influence escalating convincingly towards the claimed level – then `P(N)` could be high enough to make `P(N) * N` dominate the small cost. The agent remains open to transformative possibilities *conditioned on receiving evidence commensurate with the claim's extraordinariness*. They avoid paralysis by demanding evidence, not by ignoring large stakes *a priori*.

  **The Verdict: Pay Only Under Epistemic Duress**

  Therefore, the ideally rational agent, guided by epistemic prudence, should **refuse the mugger's initial demand**. The stranger's unsupported claim, especially one scaled to overwhelm any fixed low-probability threshold, warrants credence so low (`P(N) << 1/N`) that the expected value of payment is negligible compared to the certain small loss.

  However, this refusal is conditional:

  *   **Hedged Verdict:** Pay only if the mugger provides evidence sufficient to raise the credence `P(N)` above a well-motivated, `N`-dependent threshold. Specifically, pay if `P(N) * N > C`, where `C` is the cost (e.g., $5). Given the prior implausibility, this requires evidence whose strength scales dramatically with `N`. For claims affecting `N` units of value, the required probability threshold (`P_min`) must satisfy `P_min > C/N`. Since `C/N` becomes vanishingly small as `N` increases astronomically, `P_min` remains extremely low in absolute terms but *relatively high* compared to the vanishingly small prior plausibility of such power existing unsupported. Meeting this evidentiary burden would be phenomenally difficult for the mugger, but not logically impossible (e.g., progressively bending spacetime in verifiable ways).

  **Conclusion**

  Pascal's Mugging highlights the limits of naive expected utility maximization with unbounded value and fixed credences. While the Beckstead-Thomas dilemma forces a choice between recklessness and timidity, and Wilkinson bravely embraces the former, the escape lies in recognizing the mugging as primarily an *epistemic* challenge. The leverage penalty, grounded in the rational principle that extraordinary claims require extraordinary evidence – where extraordinariness scales with the claimed impact – provides the ideal agent with a principled defense. By demanding evidence proportional to the magnitude of the claim, the agent avoids both the extortion of fanaticism (paying based on scale alone) and the folly of timidity (ignoring large, well-evidenced stakes). The rational response to the bare mugger is refusal; payment is only justified under the epistemic duress of evidence commensurate with the cosmic scale of the demand.
