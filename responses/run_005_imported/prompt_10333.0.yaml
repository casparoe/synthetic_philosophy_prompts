  **Justifications:**  
  - **Millikan's biosemantics**: Fixes content via historical selection for a specific *Normal explanation*, resolving disjunctions by identifying the condition under which the mechanism historically contributed to fitness (e.g., "fly" not "BB pellet" or disjunctions).  
  - **Neander's teleosemantics**: Anchors content to the *proximate triggering condition* the mechanism was *selected to detect*, avoiding disjunctions by focusing on the specific environmental feature targeted by selection (e.g., flies as prey).  
  - **Papineau's success-based teleosemantics**: Uses downstream *consumer success conditions* to fix content (e.g., "fly" because only flies nourish), but risks circularity if "success" implicitly relies on intentionality.  
  - **Dretske's informational teleosemantics**: Fixes content rigidly at the *learning/acquisition moment* (e.g., flies during training), but struggles with innate traits and Swampman (no acquisition history).  
  - **Fodor's asymmetric-dependence theory**: Drops teleology but fails to non-arbitrarily privilege "fly" over disjunctions, as parasitic correlations (BB pellets) often asymmetrically depend on fly-detection laws.  
  - **Cummins's causal-role notion of function**: Lacks historical/teleological grounding, making "misrepresentation" incoherent (e.g., Swampman's states are "about" whatever plays the causal role now).
