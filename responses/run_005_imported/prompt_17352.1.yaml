answer: |-
  **MEMORANDUM**  
  To: Collections Committee  
  From: [Your Name], Collections Committee  
  Date: October 26, 2023  
  Subject: Recommendation for Apple-1 Unit (Accession #XXXX) Reclassification  

  ### Background  
  Per our recent expert assessment, the Apple-1 unit on display (long labeled as a c.1976 hand-built original) is now believed to be a skilled early-1980s assembly using period-authentic components and original schematics. While materially and functionally identical to a 1976 unit, its provenance lacks a direct link to Wozniak’s core assembly team.  

  ### The Core Question: Does Provenance Change the Object?  
  The "partscaster" analogy (raised by our guitar-collecting member) rightly notes that *material identity* alone doesn’t dictate historical value. A 1950s Fender neck on a 1950s body assembled in 2023 may sound identical to a factory original—but its *narrative* is fundamentally different. Similarly, our Apple-1’s chips and solder are "real," but its creation story shifted from **garage-era innovation** to **later-era preservation**.  

  ### Why This Matters for a Museum  
  1. **Trust & Transparency**  
     Museums trade in context, not just artifacts. Labeling this as "1976" after credible doubt undermines our credibility. Visitors assume we’ve vetted what’s on our labels—omitting "likely reassembled c.1983" is a lie of omission.  
     
  2. **Historical Significance**  
     A 1976 unit embodies Silicon Valley’s founding mythos. An early-1980s build reflects a different story: the *afterlife* of the Apple-1. It speaks to grassroots preservation by hobbyists when these machines were obsolete, not revolutionary. Both are valuable—but distinct.  

  3. **Collections Policy Intent**  
     "Distinguish originals from replicas" aims to prevent misrepresentation. This unit is neither; it’s a **third category**: *authentic period components, non-contemporary assembly*. Policy must adapt to newfound nuance.  

  ### Addressing the Options  
  - **❌ Leave as-is ("Probably not ≠ Definitely not")**:  
    Unwise. "Probable" reassembly is our new baseline truth. Keeping the old label suggests certainty we no longer have.  
  - **❌ Pull from display**:  
    Overly cautious. This isn’t a fake—it’s historically significant and educational. Removing it deprives visitors of a conversation about tech legacy.  
  - **✅ Relabel with context**:  
    **Optimal**. Honors the artifact’s material truth while elevating its *actual* story. Reduces insured value? Yes—but value ≠ worth. Its new narrative is rarer: how enthusiasts saved tech history.  

  ### Recommendation: Relabel with Context  
  **Proposed Label Text:**  
  > **Apple-1 Logic Board (c. 1983 Assembly)**  
  > *This board uses all period-correct components (1976–1977) and follows the original Apple-1 schematic. Expert analysis suggests it was hand-assembled in the early 1980s—likely by a skilled hobbyist using surplus parts—during a grassroots effort to preserve early microcomputing history. Functionally identical to a 1976 unit, it reflects the ongoing legacy of Wozniak’s design beyond Apple’s garage era.*  

  ### Why This Works  
  - **Transparent**: Acknowledges expert findings without overclaiming.  
  - **Educational**: Frames the unit as a bridge between invention and preservation.  
  - **Ethical**: Aligns with SPNCH’s *Code of Ethics*: "Provenance facts must be shared when reasonably certain."  
  - **Engaging**: Sparks dialogue about "authenticity" beyond factory seals.  

  **Vote Recommendation**: **Option 1 (Relabel)**. The board’s physical state hasn’t changed—but our duty to contextualize it honestly has. This isn’t a demotion; it’s a richer, truer story.  

  // Respectfully submitted for vote at November’s meeting //  
  [Your Name]
