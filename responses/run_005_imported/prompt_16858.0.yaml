answer: |-
  Here's the ranked analysis of the Nyāya pramāṇas based on historical reduction debates, formatted as requested. This ranking prioritizes how effectively each source resisted being collapsed into another, using arguments from classical Indian schools and Nyāya's defenses:

  ```json
  [
    {
      "rank": 1,
      "pramana": "pratyakṣa (perception)",
      "reduction_threat": "Minimal; Carvākas accepted *only* perception but did not reduce it to other pramāṇas. Other schools universally treated it as foundational.",
      "nyaya_defense": "Nyāya held perception as the irreducible bedrock of all knowledge, arguing that even critics rely on perception to challenge other pramāṇas (e.g., 'I *see* your inference is flawed')."
    },
    {
      "rank": 2,
      "pramana": "anumāna (inference)",
      "reduction_threat": "Carvākas rejected inference entirely, claiming it cannot guarantee truth beyond perception (e.g., inferring fire from smoke fails if the smoke is illusory).",
      "nyaya_defense": "Nyāya defended inference's independence by demonstrating it reveals *new* knowledge (e.g., atomic structure) via universal correlations (vyāpti) that perception alone cannot establish."
    },
    {
      "rank": 3,
      "pramana": "upamāna (comparison)",
      "reduction_threat": "Vaiśeṣikas/Buddhists reduced it to inference (e.g., recognizing a gavaya is just inferring 'cow-like features → gavaya' based on prior testimony).",
      "nyaya_defense": "Nyāya argued comparison yields direct, non-inferential similarity-knowledge (e.g., instantly grasping 'gavaya ≈ cow' upon sight), distinct from inferential steps."
    },
    {
      "rank": 4,
      "pramana": "śabda (verbal testimony)",
      "reduction_threat": "Buddhists (Dignāga/Dharmakīrti) reduced it to inference: we infer truth from the speaker's reliability (e.g., 'this expert said X, so X is true').",
      "nyaya_defense": "Nyāya maintained testimony provides immediate, non-inferential understanding from credible sources (āpta), as meaning-grasping is intuitive (e.g., a child understands 'fire burns' without inferring speaker reliability)."
    }
  ]
  ```

  ### Key Ranking Rationale:
  - **Perception (1)**: Never seriously reduced, as even skeptics like Carvākas treated it as primary. All schools accept its basic role.
  - **Inference (2)**: Targeted by Carvākas but defended via its unique capacity to reveal imperceptibles (e.g., gravity). Vaiśeṣikas/Buddhists accepted it as independent.
  - **Comparison (3)**: Frequently reduced to inference, but Nyāya's "direct similarity" argument gives it moderate defense. Tied with testimony in vulnerability, but ranks higher due to its perceptual anchor (e.g., seeing the gavaya).
  - **Testimony (4)**: Most commonly reduced (especially by Buddhists) as it relies on external sources. Nyāya's "immediate comprehension" defense is weaker here, as critics note testimony *always* involves trust-based reasoning.

  ### Why This Order?
  - **Perception > Inference**: Inference depends on perceptual data but generates unique knowledge, making it harder to reduce than testimony/comparison.
  - **Inference > Comparison/Testimony**: Both comparison and testimony face stronger reduction arguments, but comparison's link to perception gives it a slight edge over testimony's reliance on external sources.
  - **Tie Note**: Comparison and testimony are nearly tied for vulnerability. Comparison ranks higher *only* because its Nyāya defense invokes direct perception ("seeing" similarity), while testimony hinges on abstract linguistic trust. Both were rejected as independent by Vaiśeṣikas and Buddhists.

  ### TOK Exhibition Tip: 
  Use a visual of the "gavaya/cow" analogy (e.g., classical Indian art or diagram) for your object. Contrast it with a quote from Dignāga reducing testimony to inference, highlighting how knowledge frameworks shape what counts as "evidence." This shows the tension between pluralism (Nyāya) and reductionism (Buddhists/Carvākas).
