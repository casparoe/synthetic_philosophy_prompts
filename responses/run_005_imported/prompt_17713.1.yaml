     - **Justification:** Wright (1973) proposed an *etiological* analysis (goal-directed functions), while the causal-role account is defined by Cummins (1975). Swapping the theorists undermines scholarly accuracy.  
     - **Partial Credit:** The characterization of causal-role functions (context-dependent, system capacities) is accurate.

  3. **heart_application (5/5)**  
