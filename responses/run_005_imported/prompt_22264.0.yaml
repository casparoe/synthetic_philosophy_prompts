  I'm drafting a chapter of a novel whose protagonist, Cate, is a philosopher of physics with a longstanding, slightly evangelical commitment to relationism about space and motion — she thinks Leibniz and Mach were basically right against Newton, but she also holds herself to a rule that she won't attack a position until she can state it as strongly and precisely as its own author did. In the scene I'm writing, an old friend from law school needles her at a dinner party about "that bucket thing" he half-remembers from a physics-for-poets course, and rather than reach for the cartoon version, Cate goes to the shelf, pulls down the Principia, and reads him the actual Scholium aloud. I want her reading, and her gloss on it, to reflect real engagement with Newton's argument rather than the streamlined version everyone half-remembers, so I've been rereading the passage myself — in Motte's original 1729 translation, not the later Cajori revision, which smooths over a few of the phrases — and I've hit a stretch whose logic I can't yet reconstruct with confidence.

  Here is the passage, picking up right after Newton has laid out several arguments from what he calls the "properties, causes, and effects" of motion:

  > If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; after, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues, for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move: but the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced), and the swifter the motion becomes, the higher will the water rise, till at last, performing its revolutions in the same times with the vessel, it becomes relatively at rest in it. This ascent of the water shows its endeavour to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, discovers itself, and may be measured by this endeavour. At first, when the relative motion of the water in the vessel was greatest, it produced no endeavour to recede from the axis; the water showed no tendency to the circumference, nor any ascent towards the sides of the vessel, but remained of a plain surface, and therefore its true circular motion had not yet begun. But afterwards, when the relative motion of the water had decreased, the ascent thereof towards the sides of the vessel proved its endeavour to recede from the axis; and this endeavour showed the real circular motion of the water perpetually increasing, till it had acquired its greatest quantity, when the water rested relatively in the vessel. And therefore this endeavour does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation.

  [Newton continues in the same vein for a page — arguing that a body has only one true motion, however many relative ones it may have, so that a planet swept along by a revolving heaven is still truly moving even while at relative rest within it, and warning against confusing "relative quantities" with the true quantities they merely measure. He then writes:]

  > It is indeed a matter of great difficulty to discover, and effectually to distinguish, the true motion of particular bodies from the apparent; because the parts of that immovable space, in which those motions are performed, do by no means come under the observation of our senses. Yet the thing is not altogether desperate; for we have some arguments to guide us, partly from the apparent motions, which are the differences of the true motions; partly from the forces, which are the causes and effects of the true motion. For instance, if two globes, kept at a given distance one from the other by means of a cord that connects them, were revolved about their common centre of gravity, we might, from the tension of the cord, discover the endeavour of the globes to recede from the axis of their motion, and from thence we might compute the quantity of their circular motions. And then if any equal forces should be impressed at once on the alternate faces of the globes to augment or diminish their circular motions, from the increase or decrease of the tension of the cord, we might infer the increment or decrement of their motions; and thence would be found on what faces those forces ought to be impressed, that the motions of the globes might be most augmented; that is, we might discover their hindmost faces, or those which, in the circular motion, do follow. But the faces which follow being known, and consequently the opposite ones that precede, we should likewise know the determination of their motions. And thus we might find both the quantity and the determination of this circular motion, even in an immense vacuum, where there was nothing external or sensible with which the globes could be compared. But now, if in that space some remote bodies were placed that kept always a given position one to another, as the fixed stars do in our regions, we could not indeed determine from the relative translation of the globes among those bodies, whether the motion did belong to the globes or to the bodies. But if we observed the cord, and found that its tension was that very tension which the motions of the globes required, we might conclude the motion to be in the globes, and the bodies to be at rest; and then, lastly, from the translation of the globes among the bodies, we should find the determination of their motions.

  My difficulty is this: I can't work out what the globes are doing here that the bucket hasn't already done, and I don't want Cate to fudge it in front of her dinner guest. My first instinct was that this is just a second, more vivid illustration of the same point — that true rotation announces itself through a force effect even without relative motion between the rotating body and whatever immediately surrounds it. But Newton is oddly insistent that the globes' motion could be found "even in an immense vacuum, where there was nothing external or sensible with which the globes could be compared," which seems like a stronger and different claim than anything the bucket paragraph makes, and the whole passage is introduced as an answer to a difficulty about discovering and measuring true motion rather than as one more proof that true motion outruns relative motion. So: is the two-globes example doing separate argumentative work from the bucket — closing off some move a Leibnizian or Machian defender of relationism could still make even after granting the bucket — and if so, what exactly is that move, and how does stripping the universe down to just the globes and the cord block it? This matters to me dramatically as well as philosophically, since if the globes really are pre-empting the "rotation is just relative to the fixed stars" rejoinder, that's a live problem for Cate's own sympathies, and I don't want her to breeze past it. I'd also be grateful for a plain-English unpacking of the "we might discover their hindmost faces, or those which, in the circular motion, do follow" sentence, which I've now read a few different ways and can no longer parse with confidence.
