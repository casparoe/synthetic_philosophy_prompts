answer: |-
  Here’s the strongest argument against your friend’s interpretation of Quine, grounded in the internal tensions within Quine’s naturalism. The core contention is that **Quine’s naturalistic framework itself dissolves the sharp periphery/internal distinction he asserts for ethics, once we recognize that moral "tastes" are causally embedded in the same natural world that constrains science:**

  1.  **Quine’s Naturalism Undermines the "Taste/Nature" Dichotomy:**
      *   Quine’s naturalism rejects first philosophy and insists all knowledge is part of the scientific enterprise, continuous with common sense. Human beings, including their evaluative faculties (likes, aversions, moral sentiments), are *natural objects* studied by science (psychology, biology, anthropology).
      *   These "innate tastes" are not arbitrary, supernatural impositions; they are *evolutionary products* shaped by natural selection and *causally responsive* to the environment (including the social environment). Our aversion to suffering, preference for reciprocity, or sense of fairness likely conferred survival advantages.
      *   Therefore, our "ultimate ends" are not *merely* subjective whims floating free of the world; they are *causal consequences* of our interaction with a shared natural and social reality. They are part of the *natural order* Quine’s science describes.

  2.  **The Periphery is Broader than "Sensory Input":**
      *   Quine defines the "periphery" as the point where language (and theory) is conditioned to *sensory stimulation*. However, his naturalism implies that the conditioning stimuli relevant to *human survival and flourishing* extend beyond raw sense data.
      *   Observing *suffering, starvation, social collapse, cooperation, trust-building* – these are complex perceptual experiences, but they are undeniably *recalcitrant experiences* for a social species. They impinge upon us causally, forcing adjustments in our beliefs *and* our values. A society whose core moral tenets systematically lead to observable misery, conflict, or extinction would face recalcitrant experience as forcing as a failed physical prediction.
      *   **Key Point:** The "periphery" for a holistic web encompassing human life includes *experiences of need, harm, cooperation, and flourishing*. These are not *less real* or *less causally constraining* than the stimulation of our retinas by light; they are different facets of our causal interaction with the world, equally part of nature.

  3.  **Holism Entangles Facts and Values Irreducibly:**
      *   Quine accepts holism: sentences face experience "as a corporate body." Your point about entanglement is crucial. Moral judgments ("Torturing innocents is wrong") are inextricably linked with non-normative beliefs ("Torture causes intense suffering," "Suffering is bad for biological organisms," "Societies condoning torture become unstable").
      *   **Recalcitrance Can Strike the Web via Moral-Descriptive Links:** Imagine a society whose core "ultimate end" is maximizing suffering. Their web of belief would constantly face recalcitrant experience:
          *   *Empirical:* Observing beings *avoid* suffering contradicts the idea that seeking it is fundamental.
          *   *Practical:* Implementing this "end" would likely cause societal collapse (a complex but observable event).
          *   *Conceptual:* Maintaining the "maximize suffering" principle while acknowledging basic biological facts about pain avoidance and survival instincts creates profound tension within the web.
      *   Adjustments *will* be forced. The society might abandon the principle, reinterpret suffering, invent elaborate justifications (creating internal inconsistency), or perish. This process mirrors scientific adjustment: the web must accommodate recalcitrant experience *somewhere*. The pressure originates from the causal impact of the world (observations of behavior, societal outcomes, biological facts) on the *entire* web, including its evaluative nodes linked to those observations.

  4.  **Answering the Friend's "No External Moral Nature" Objection:**
      *   Your friend is right that there is no *Platonic realm* of moral facts. But Quine’s naturalism *already rejects* such realms for *any* domain. There is only *one* nature.
      *   The "external nature" science answers to *includes* the nature of human beings as evolved, social, feeling creatures. The "recalcitrant experience" that disciplines science *includes* the experiences generated by our social interactions and our own biological responses (pain, pleasure, empathy).
      *   **Therefore:** The "moral nature" ethics answers to holistically *is* simply *nature itself*, specifically the aspects of nature concerning human (and sentient) well-being, social interaction, and the causal consequences of actions. It's not a *separate* realm, but a *dimension* of the single natural world that Quinean science investigates. The "periphery" for ethics is constituted by our causal encounters with *this* dimension of nature.

  5.  **The Crucial Disanalogy Collapses:**
      *   **Science:** Recalcitrant sensory experience forces adjustments in the web of belief (including theoretical virtues like simplicity). The pressure is causal and originates externally.
      *   **Ethics (Naturalized View):** Recalcitrant experiences *of suffering, need, conflict, and flourishing* force adjustments in the web of belief (including evaluative nodes linked to these experiences). The pressure is *equally causal* and originates externally (from the natural and social world impacting the organism/society). The "tastes" are the *starting point* shaped by evolution, but they are *not immune* to further causal pressure from ongoing experience within the holistic web. The process of justification/rationalization *within* a moral framework, driven by the need for consistency and accommodation of recalcitrant experience, is analogous to theory refinement in science.

  **Conclusion & Strength of the Argument:**

  The strongest argument isn't that holism *alone* erases the distinction, but that **Quine’s *naturalism*, consistently applied, dissolves the foundation of the distinction he wants to make.** By naturalizing humans and their values, Quine undermines the idea that ethical "tastes" are fundamentally different *in kind* from the observational starting points of science. Both are natural phenomena causally responsive to the world. The "periphery" for a holistic system encompassing human life must include the causally forceful experiences relevant to that life. Recalcitrance in ethics arises from the clash between our web of beliefs/values and the observed consequences of living by them in the natural and social world. While the *mechanisms* of adjustment and the *specific kinds* of recalcitrant experience differ between detailed scientific theory and core moral frameworks, Quine’s own naturalistic holism does not justify treating ethics as methodologically inferior due to a *complete* lack of external constraint. The constraint is different, but it is still a causal constraint from the shared external world upon our holistic web of belief. Quine’s asymmetry relies on an artificial narrowing of "experience" and "periphery" that his broader naturalistic commitments do not support.
