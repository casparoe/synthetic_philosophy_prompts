prompt: |-
  I've spent a long time reading blogs in the LessWrong/Overcoming Bias cluster, and one idea from that world that has stuck with me is "conservation of expected evidence": roughly, you shouldn't be able to know in advance which direction a future piece of evidence will push your beliefs, because if you were already certain some observation would confirm what you currently believe, you should in some sense be updating on that fact before you've even made the observation. I've been turning this over since jury duty last month, because something that happened there feels related, though I haven't been able to work out whether it's really the same issue or something else entirely.

  A friend of mine, Sam, was on the same jury. About two-thirds of the way through the trial, once the prosecution had laid out its case, he told me privately that he was completely convinced of the defendant's guilt. When the defense subsequently called an alibi witness, Sam admitted afterward that he'd barely registered her testimony, reasoning, as he put it, that "I already knew he did it, so whatever she said had to be mistaken or dishonest somehow, even if I couldn't say exactly how." At the time this struck me as an obviously bad way to treat what is supposed to be a juror's central job. But then it occurred to me that I do something with the same shape all the time without a second thought: if someone handed me a long, carefully constructed argument for a flat earth, I also wouldn't feel any obligation to work through it premise by premise, since I already know the earth is round and can be fairly confident in advance that the argument contains an error somewhere, whatever that error turns out to be.

  So I'm stuck on what, if anything, actually separates these two cases. Either Sam and I are both reasoning badly, or we're both reasoning perfectly well, or there's a real principle distinguishing them that I haven't managed to put my finger on. Is "I already know X, so I'm entitled to discount whatever comes in against it" ever a legitimate way to reason, and if it is, what exactly would separate its legitimate uses from Sam's?
reasoning: |-
  Okay, the user is grappling with a philosophical dilemma about belief updating, specifically around the "conservation of expected evidence" concept from LessWrong. They're comparing two scenarios: Sam dismissing an alibi witness during jury duty, and themselves ignoring a flat-earth argument. Both involve preemptively discounting counterevidence, but one feels wrong (juror duty) while the other feels justified (flat earth). The user wants to know if there's a principled difference or if both are equally flawed.

  First, I need to unpack "conservation of expected evidence." It's a Bayesian idea that your current beliefs should account for the expected impact of future evidence. If you're certain evidence will confirm your view, you've already updated prematurely. Sam's mistake is classic motivated reasoning—he's not just confident; he's closed off to updating. That's dangerous in a juror context where impartiality is required. 

  The flat-earth example feels different because the user has overwhelming evidence for a round earth. But why is that okay? The key might be in the strength and nature of prior evidence. For the earth's shape, we have centuries of scientific consensus, satellite imagery, etc. Sam, however, based his certainty on one side of a trial before hearing all evidence. That's not equivalent. 

  Also, institutional roles matter. Jurors swear to consider all evidence impartially; dismissing testimony violates that duty. Personal beliefs about flat earth don't carry the same ethical weight. The user might be missing how context shapes the obligation to engage. 

  Another angle: error-correction capacity. With flat-earth arguments, the user could theoretically spot flaws if pressed, but deems it inefficient. Sam didn't even try—he presumed error without scrutiny. The distinction might lie in whether you *could* engage vs. whether you *do*. 

  The user seems intellectually honest—they're questioning their own reasoning, not just Sam's. Their deeper need might be for a framework to distinguish rational confidence from bias. They might also worry about hypocrisy: "If I dismiss flat-earthers, am I like Sam?" 

  I should emphasize that legitimate discounting requires (1) overwhelming prior evidence, (2) no special obligation to reconsider, and (3) probabilistic openness to being wrong. Sam fails all three. The user passes on (1) and (2) for flat earth, but should acknowledge (3) to avoid epistemic hubris. 

  Finally, the jury context is critical. Courts force evidence evaluation for a reason; outside that, we optimize cognitive effort. The user needs to see that Sam's sin isn't confidence—it's abandoning his role as an evidence-weigher.
answer: |-
  Your intuition is spot-on—this *is* a subtle and important puzzle. Both cases involve preemptively discounting counterevidence, but they differ crucially in **prior justification, epistemic responsibility, and context**. Here's a principled distinction:

  ### Core Principles at Play
  1. **Conservation of Expected Evidence (CEE)**  
     This Bayesian principle states that your *current* belief should already account for the *expectation* of future evidence. If you believe P(X) = 99%, you must also believe:  
     - There’s a 99% chance new evidence will support X,  
     - But crucially, **if you saw evidence against X, it would drastically lower your confidence**.  
     Sam violated CEE: he treated his 99% belief as immune to counterevidence, refusing to update when faced with the alibi witness.

  2. **The Role of Epistemic Obligations**  
     - **Jurors swear an oath** to evaluate all evidence impartially. Sam’s dismissal isn’t just bad epistemology—it’s a breach of institutional duty.  
     - **Personal beliefs carry no such obligation**. You’re free to ignore flat-earth arguments because you lack a sworn duty to reconsider spherical Earth.

  ### Key Distinctions Between the Cases
  | **Aspect**               | **Sam (Jury Duty)**                          | **You (Flat Earth)**                         |
  |--------------------------|---------------------------------------------|---------------------------------------------|
  | **Prior Justification**  | Weak: Based on one-sided testimony.         | Overwhelming: Centuries of science, data, and consistent evidence. |
  | **Epistemic Obligation** | Absolute: Jurors *must* engage with evidence. | None: No duty to entertain fringe theories. |
  | **Error Correction**     | Impossible: Refused to process testimony.   | Possible: You *could* dissect errors if needed (e.g., flawed logic in the argument). |
  | **Probability Threshold**| Premature certainty mid-trial.              | Justified certainty after vast evidence.    |
  | **Consequence of Error** | High: Wrongful conviction.                  | Negligible: No harm in ignoring nonsense.   |

  ### When Is It Legitimate to Discount Counterevidence?
  The stance "I already know X, so I’ll ignore counterevidence" is **rarely fully rational**—but it can be *pragmatically justified* when:
  1. **Prior evidence is overwhelming** (e.g., spherical Earth),  
  2. **Counterevidence is predictably low-quality** (e.g., arguments from known cranks),  
  3. **Engagement costs outweigh update value** (e.g., spending hours debunking nonsense),  
  4. **No special role mandates open-mindedness** (unlike jurors, scientists, or judges).

  Sam failed all four tests:  
  - His prior certainty was unjustified mid-trial,  
  - He assumed the alibi was flawed *without examination*,  
  - His role *required* engagement,  
  - The cost of error (wrongful conviction) was catastrophic.

  ### Why Your Flat-Earth Analogy is Different
  - **You’re conserving cognitive resources**, not evidence. You *could* identify errors in the flat-earth argument (e.g., "Ah, they misrepresented gravity") if pressed. Sam didn’t even try.  
  - **Your prior is anchored in robust models**. The Earth’s shape isn’t a standalone fact—it’s woven into physics, astronomy, and engineering. Sam’s belief rested on a fragmentary legal narrative.  
  - **Zero social contract binds you**. Jurors volunteer for a truth-seeking process; you owe flat-earthers nothing.

  ### The Deeper Failure: Sam’s Motivated Reasoning
  Sam didn’t just discount evidence—he **avoided processing it**. This is *motivated cognition*: protecting a belief by refusing to encounter challenges. In contrast, your flat-earth dismissal is **evidence-based triage**. You’d likely update for *strong* counterevidence (e.g., if satellites "failed"), while Sam’s stance was unfalsifiable.

  ### Conclusion
  Both cases *feel* similar, but Sam’s reasoning is epistemically and ethically bankrupt, while yours is pragmatically defensible. The line is drawn at:  
  - **The strength and source of priors**,  
  - **Institutional responsibilities**,  
  - **Willingness to update if evidence defies expectations**.  

  Legitimate discounting requires humility: *"I’m 99.9% sure, but if this alibi holds, I must rethink everything"*. Sam abandoned that. As a juror, his job was to lean *into* discomfort—not away from it.
