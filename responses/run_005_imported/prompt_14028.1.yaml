prompt: |-
  I'm on the committee that runs my company's internal forecasting program (think a mini Good Judgement Project, but for pipeline calls). We've hit a real fight: one of our best forecasters put 85% on our drug trial succeeding, while the other eleven, all with similar Brier scores, landed around 40%. She's heard everyone's arguments and says none of them budge her -- but a dozen peers with matching track records disagreeing is itself evidence she's missing something, even if no one can say what. Half the committee wants outliers to shade their number toward the group past some threshold; the other half says that just launders a number nobody believes, and if she's still convinced after hearing them out, maybe the 'just defer' instinct is what's wrong, not her. Can you draft the short memo for Friday's meeting -- a real recommendation with a timeframe, not 'it depends' -- that takes the pro-autonomy side seriously rather than just asserting the wisdom of crowds?
reasoning: |-
  Okay, the user is part of a committee running an internal forecasting program similar to the Good Judgement Project but focused on pipeline calls. They're facing a conflict where one top forecaster has an 85% prediction for a drug trial's success, while eleven others with similar Brier scores are around 40%. The outlier has heard all arguments but remains unconvinced. The committee is split: half wants outliers to adjust toward the group, half argues that forcing adjustment launders numbers and undermines autonomy.

  The user specifically wants a short memo for Friday's meeting that takes the pro-autonomy side seriously—meaning it must argue against forcing conformity while acknowledging group wisdom, without falling back on "it depends." They need a concrete recommendation with a timeframe. 

  First, I need to unpack why this matters. Forcing consensus could kill the value of having diverse perspectives—the outlier might see something others miss, which is crucial in forecasting. But ignoring the group entirely wastes collective insight. The memo must balance these by structuring disagreement productively.

  The user's deeper needs: they want to preserve incentives for independent thinking (why their program attracts top forecasters), avoid groupthink, but also extract wisdom from disagreement. They need a solution that feels actionable, not theoretical. 

  Key elements for the memo:
  - Start by validating both concerns (group signal vs. outlier conviction)
  - Recommend against forced adjustment (it corrupts calibration)
  - Instead, formalize the disagreement as data: record both probabilities distinctly
  - Add a mechanism to surface reasoning (like a "dissenting opinion" box)
  - Set a short timeframe—next forecast cycle—to test if this approach works
  - Emphasize that diversity is an asset if documented properly

  I should avoid academic language. Make it punchy for executives. Call the outlier's stance a "dissenting view" to frame it positively. Stress that the goal isn't to eliminate disagreement but to mine it for insights. 

  Timeframe is critical—the user wants decisiveness. Propose immediate implementation for this case, with review in 3 months. That shows urgency without permanent commitment. 

  Finally, position this as strengthening the program's integrity: "If we override conviction, we become a weighted poll, not a forecasting engine." That resonates with their pride in running a serious project.
answer: |-
  ## MEMO: Handling Outlier Forecasts - Recommendation  
  **To:** Forecasting Committee  
  **From:** [Your Name/Committee Role]  
  **Date:** [Date]  
  **Subject:** Preserving Forecast Integrity & Cognitive Diversity - Action Plan  

  ### Core Principle  
  **Individual conviction, transparently documented, is our program’s greatest asset.** Forcing forecasters to shade predictions toward the mean corrupts calibration, incentivizes herd behavior, and destroys the unique value of outlier insights. We solve this by *structuring* disagreement, not suppressing it.  

  ### Immediate Recommendation (Effective Immediately)  
  1. **No Mandatory Adjustment:** Forecasters maintain absolute autonomy over their probabilities. **Do not require outliers to adjust toward the group.**  
  2. **Formalize Disagreement as Data:**  
     - **Flag Significant Outliers:** Automatically tag forecasts >2 SDs from the current group mean *at close* (not mid-debate).  
     - **Require "Dissenting Opinion" Note:** The outlier must submit a concise (1-3 sentence) note alongside their forecast:  
       *"I acknowledge the group estimates [X]%, but I maintain [Y]% because [Key Reason(s) Unaddressed by Peers]."*  
       *(Example: "Trial Site 3's historical adherence data remains uncompromised, and subgroup efficacy signals are stronger than modeled.")*  
  3. **Aggregate Transparently:**  
     - Report the **mean/median probability** AND the **full distribution** (e.g., box plot).  
     - Highlight the dissenting opinion note in summaries seen by leadership.  

  ### Why This Addresses the Concern  
  - **Wisdom of Crowds ≠ Wisdom of Conformity:** The group’s 40% *is* evidence—but it’s already captured in the aggregate metric. Forcing alignment double-counts it and dilutes independent signal.  
  - **Protects Calibration:** If our outlier is *systematically* wrong, her Brier score will reflect it over time. Artificially adjusting her now distorts track records and masks true skill.  
  - **Unlocks Insight:** The "Dissenting Note" forces articulation of *why* counter-arguments fail. This surfaces hidden assumptions or data gaps the group may overlook. Leadership needs to see this reasoning, not a laundered number.  
  - **Preserves Incentives:** Top forecasters stay engaged because their unique judgment is valued, not overruled by committee.  

  ### Timeframe & Review  
  - **Implement:** This protocol for *all* forecasts starting **Monday, [Date]**.  
  - **Review:** Assess impact on forecast accuracy, outlier contribution, and leadership feedback at our **Q3 Committee Meeting (3 months)**. We’ll evaluate:  
    - Do dissenting notes provide actionable intelligence?  
    - Is there evidence of persistent, harmful bias in outliers?  
    - Are aggregates becoming more accurate with transparent dissent?  

  ### Bottom Line  
  **Our credibility hinges on being a platform for genuine belief, not curated consensus.** This approach treats the group’s view as vital data *without* demanding conformity. It honors the outlier’s expertise while rigorously documenting her reasoning for scrutiny. If she’s wrong, her record will show it. If she’s right, we avoid a costly blind spot. Mandating adjustments turns us into a weighted poll—not a forecasting engine.  

  **Recommended for Friday’s Vote:** Approve the "Dissenting Opinion" protocol for immediate implementation.  

