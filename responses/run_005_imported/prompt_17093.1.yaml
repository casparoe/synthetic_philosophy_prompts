answer: |-
  Your reconstruction is fundamentally sound—Augustine is indeed introducing an asymmetry based on the **spiritual harm caused by the *content* of the lie**, specifically its capacity to lead souls into damnable heresy. This creates a tension with his formal definition of lying (intentional falsehood *per se*), but he resolves it by emphasizing the unique gravity of propagating false doctrine. Here's a breakdown:

  ### 1. **The Asymmetry Explained**
     - **Heretic's Lie (To Avoid Detection):**  
       - *Nature:* Conceals true belief (heresy) by falsely professing orthodoxy.  
       - *Harm:* Hides error but **does not actively spread it**. The listener hears orthodox truth, even if insincerely uttered. No soul is *led into* heresy by the lie itself. The lie protects the liar but doesn't corrupt others.
     - **Catholic's Lie (To Infiltrate):**  
       - *Nature:* Conceals true belief (orthodoxy) by falsely professing heresy (Priscillianism).  
       - *Harm:* Actively **propagates heretical falsehoods as truth**. The listener hears and may believe damnable error *because of the Catholic's lie*. The lie becomes a tool for spreading spiritual poison, potentially confirming or converting souls to heresy ("slays the soul... or... hold it down").

     **Augustine's Principle:**  
     > *Lies that directly cause others to embrace false, damnable doctrines are spiritually murderous and thus far worse than lies that merely conceal error.*  

     This transcends the inherent sin of lying (which both commit) by focusing on the **consequential spiritual catastrophe** unique to false profession of heresy by a perceived authority (the spy).

  ### 2. **Reconciling with Augustine's "Austere" Definition**
     Augustine *doesn't abandon* his intention-centered definition (lying = intentional deception). Instead, he **stratifies the gravity of lies** based on their *object* and *effects*:
     - **Formal Sin:** All intentional falsehoods are sinful (violate truth as a good in itself).
     - **Material Gravity:** Lies promoting heresy are *maximally grave* because they attack the supreme good: salvation.  
     - **Key Text:** "this astuteness... slays the soul" – the lie isn't just deception; it's *homicide*. This echoes his view in *De Mendacio* (On Lying) that some lies are "more cruel" than murder.

     The tension is real but deliberate: Augustine prioritizes the *telos* (purpose) of truth—union with God—over a purely deontological reading. Protecting souls from heresy outweighs the abstract evil of deception.

  ### 3. **Parsing the "Cunning Spy" Illustration**
     The sequence builds to demonstrate the **escalating spiritual danger** of the lie's content:
     1. **Praising Dictinius (a "corrected" heretic):**  
        - "More tolerable": Dictinius died reconciled to the Church. Praising his (ostensibly) orthodox end risks little spiritual harm. The lie is "safe" content.
     2. **Praising Priscillian (condemned heretic):**  
        - **The Moral Turning Point:** This is the *active harm*. Priscillian represents pure heresy. Falsely revering him:
          - Validates heresy as worthy of reverence.
          - Risks **confirming a wavering heretic** or **converting a Catholic bystander**.  
        - **Augustine's Emphasis:** "If haply the person... had not been a firm Priscillianist, by this preaching of him he will be confirmed." The spy’s lie *creates or deepens* heresy.

     **Moral Work Done:**  
     The spy’s praise of Priscillian isn't just *coloring*; it’s the **lethal mechanism**. The act of *falsely endorsing heresy* transforms the lie from a formal sin into spiritual homicide. The asymmetry hinges entirely on this: the heretic’s lie hides poison; the Catholic’s lie *administers* it.

  ### Conclusion: Your Reconstruction & Seminar Implications
  - **Your Guess is Correct:** Augustine’s asymmetry relies on the uniquely damnifying effect of false heresy-profession by orthodox agents. The lie’s *content* (heresy) and *effect* (souls led astray) create a qualitative moral difference beyond the sin of deception itself.
  - **Fit with Austere Definition:** It’s a contextual *application* of his definition, not an abandonment. The gravity of lying is amplified when it directly opposes charity (love of neighbor’s salvation).
  - **Seminar Discussion Points:**  
    - Tension between Augustine’s absolute prohibition of lying and his consequentialist-sounding asymmetry.  
    - Is "spiritual murder" a coherent exception to his own rule?  
    - Implications for modern contexts: Is lying to infiltrate extremist groups ever justified? Does Augustine’s fear of "contagion" resonate today?  
    - Compare to Aquinas (*ST* II-II Q110), who systematizes Augustine’s gravity stratification but rejects *any* lying for good ends.

  **Key Takeaway:** Augustine’s horror isn’t merely at deception—it’s at orthodox believers becoming *unwitting apostles of heresy*. The spy’s lie isn’t just a net to catch bodies; it’s a snare for souls. That peril outweighs all tactical gains.
