  ### Part (c) [7 points]
  The task:
  1. Explain how functional reduction preserves mental causation.
  2. Identify the one class of mental property that Kim thinks resists this treatment and why.

  Student's answer:
  - Functional reduction: Define mental properties in causal-role terms (e.g., pain as being caused by tissue damage and causing withdrawal, etc.). Then, identify the mental property in a system with the physical property that occupies that role. Then, the mental property's causal powers are the physical realizer's causal powers. Thus, no competition and mental causation is preserved.
  - The student then claims that Kim extends this to phenomenal states (the felt quality of pain) as well, because they can also be defined by causes and effects and then paired with neural states.

  Evaluation:
  - The explanation of functional reduction and how it preserves mental causation is correct.
  - However, the student fails to identify the class of mental properties that Kim thinks resists functional reduction. In fact, the answer says that Kim extends functional reduction to phenomenal states. But this is the opposite of what Kim actually holds. Kim explicitly argues that phenomenal properties (qualia) resist functional reduction because they are not defined by their causal roles but by their intrinsic, qualitative character. This is a critical point in Kim's work. 
    - Kim, in "Physicalism, or Something Near Enough", argues that functional reduction works for intentional states (like beliefs and desires) but not for phenomenal states (qualia). For qualia, he thinks they might be reducible via identity theory (if we can find the neural correlates) but functional reduction fails because qualia are not defined functionally. So the student has made a significant error by claiming that Kim extends functional reduction to phenomenal states.

