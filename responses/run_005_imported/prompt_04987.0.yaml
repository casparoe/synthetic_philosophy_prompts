  (2) Priya: 2 (accurate description of supervaluationism)
  (3) Jae: 1 (valid criticism but supervaluationism has a response)
  (4) Priya: 2 (strong defense and critique of epistemicism)

  Overall: Priya's supervaluationism holds up better.

  Missing: Contextual factors and the role of normative standards in disambiguating "medically necessary" in practice.

