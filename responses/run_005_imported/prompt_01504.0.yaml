  I recall Hume's distinction between relations of ideas and matters of fact. Relations of ideas are a priori and certain, like mathematics, while matters of fact depend on experience. The user is pointing out that Hume is using an a priori method (conceivability implying possibility) to make a claim about existence in the real world. That seems inconsistent.

  Looking deeper, Hume might be arguing within the realm of ideas. He's saying that since the idea of extension with indivisible parts is coherent, it's logically possible. But logical possibility doesn't guarantee actual existence. The user is asking if Hume is conflating logical possibility with real possibility here. 

  Hume's maxim states that whatever is conceivable is possible. But in his empiricism, what's conceivable is limited by our impressions. So, if we can form an idea without contradiction, it must derive from some impression, hence possible. But the user might be questioning whether the absence of contradiction is sufficient, given that our ideas could still be flawed or not correspond to reality.

