prompt: |-
  The following two paragraphs come from Book 1, Part 2, Section 2 of Hume's Treatise of Human Nature, where he is arguing against the infinite divisibility of space by defending the existence of extended but indivisible "mathematical points":

  'Tis an establish'd maxim in metaphysics, That whatever the mind clearly conceives includes the idea of possible existence, or in other words, that nothing we imagine is absolutely impossible. We can form the idea of a golden mountain, and from thence conclude that such a mountain may actually exist. We can form no idea of a mountain without a valley, and therefore regard it as impossible.

  Now 'tis certain we have an idea of extension; for otherwise why do we talk and reason concerning it? 'Tis likewise certain, that this idea, as conceiv'd by the imagination, tho' divisible into parts or inferior ideas, is not infinitely divisible, nor consists of an infinite number of parts: for that exceeds the comprehension of our limited capacities. Here then is an idea of extension, which consists of parts or inferior ideas, that are perfectly indivisible: consequently this idea implies no contradiction: consequently 'tis possible for extension really to exist conformable to it: and consequently all the arguments employ'd against the possibility of mathematical points are mere scholastick quibbles.

  Could you help me see exactly how the argument in the second paragraph is meant to work, and whether it sits well with Hume's own empiricism? He is treating the mere absence of a detectable contradiction in an idea as sufficient grounds for concluding that the corresponding thing can really exist -- yet elsewhere he insists that no question of real existence can be settled by a priori reasoning alone, only by experience. Is the conceivability-to-possibility maxim an unacknowledged exception to that stricture, or is there a reading of "possible existence" here that keeps Hume's usage consistent with it?
