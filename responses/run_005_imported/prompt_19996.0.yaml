prompt: |-
  Ok so I fell down a Stanford Encyclopedia of Philosophy rabbit hole last night reading about dispositions -- fragility, solubility, that kind of property -- and got to the part about 'finks' and 'masks': these are cases showing that testing for a disposition even once, in the obvious way (is this wire live, is this glass fragile), can give you totally the wrong answer, because something can interfere with the test itself, either triggering a reaction that wouldn't normally happen or blocking one that would. I write backend code for a living and immediately started mapping this onto stuff from work -- flaky concurrency tests, heisenbugs that dissapear the second you attach a debugger or add a log line, code that CI insists is thread-safe but that falls over under real prod load. Can you walk me through the most important implications of the finks/masks stuff for how much I should actually trust a green CI run as evidence that a piece of code really has the reliability property (thread-safety, idempotency, whatever) we think it has?
