  I recall that PII traditionally required absolute discernibility—unique properties. Black's spheres lack that. Weak discernibility uses relations, not properties. Saunders argues that if two entities satisfy an irreflexive relation (like being a certain distance apart), they are discernible. So, in Black's setup, "is 1 mile from Sphere B" discerns Sphere A, and vice versa. But is this relation genuinely discerning without presupposing numerical distinctness?

