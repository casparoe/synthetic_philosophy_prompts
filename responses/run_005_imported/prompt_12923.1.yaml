prompt: |-
  So I'm about two hundred pages into a novel set in a pocket universe built to be perfectly symmetric — two Earth-sized spheres, identical down to the last pebble, tethered together and slowly orbiting a shared center of gravity, with my two protagonists each growing up on one without knowing the other sphere (or the other 'them') exists. A friend who did a philosophy degree told me this is basically just Max Black's old two-spheres thought experiment dressed up in sci-fi clothes, the one he used against Leibniz's principle of the identity of indiscernibles. I went and read the actual dialogue and get the headline version fine: since the whole universe is symmetric, any property you give one sphere — including relational stuff like being some exact distance from another iron sphere of the same size — the other one automatically has too, so Black says you've got two numerically distinct things that are nevertheless completely qualitatively identical, which Leibniz's principle supposedly rules out. That part isnt what's tripping me up.

  What's bugging me is something I half-remember from a footnote in a much denser paper on philosophy of physics (I think the guy's name was Saunders?) about "weak discernibility" — the idea that two things count as discernible after all if there's just some irreflexive relation between them, even a totally symmetric one like "is one mile away from," since that relation can never hold of a thing and itself. If that's right, doesn't that mean Black's spheres were secretly discernible the whole time, just via a relation instead of a property, which seems to gut the entire point of the thought experiment? And yet everyone still teaches Black's case as a live counterexample to Leibniz's principle, not as a solved problem. So either I'm misunderstanding what "weak" discernibility actually buys you, or there's some standard objection to it that keeps the original puzzle alive — something about it being circular, maybe, since you'd already need to know there are two spheres before the "one mile away from" relation could even be instantiated, rather than a thing just being related to itself. Could you walk me through what's actually going on here, and whether weak discernibility is a genuine rescue of the identity of indiscernibles or more of a technical sleight of hand? Skip the 101 recap of the twin spheres if you can, since I've definately got that part — I just need the bit I'm stuck on.
