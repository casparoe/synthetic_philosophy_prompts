answer: |-
  Your friend's argument is a fascinating application of **logical determinism** – the idea that future events are already true (or false) in the present due to the logical principle of bivalence (every proposition is either true or false). While this reasoning is logically coherent *within a specific framework*, it fundamentally **breaks down when it conflates logical truth with causal necessity**. The flaw isn't in the logic of truth values itself, but in the **illegitimate leap from "It is true now that X will happen" to "X will happen *regardless* of present or future causes."**

  Here's a step-by-step breakdown of the argument and the precise point of failure:

  1.  **Premise 1 (Logical Bivalence):** For any meaningful proposition about the future (e.g., "Team A will win the match with a score of 2-1"), that proposition is *already* either true or false right now, even if we don't know which one.
  2.  **Premise 2 (Fixed Truth):** Therefore, the outcome of the match (the specific score) is a fixed, determinate fact *before* the match begins.
  3.  **Conclusion (Causal Irrelevance):** Since the outcome is already fixed as a true fact, the events of the match (including the players' effort, skill, decisions, luck) do not *cause* the outcome. They merely *reveal* what was always true.

  **Where the Argument Fails: The Exact Step**

  *   **The failure occurs in the inference from Premise 2 to the Conclusion.** Premise 2 ("the outcome is fixed") is *logically* valid *if* you accept bivalence for future contingents. However, **concluding that the match events are therefore causally irrelevant is a non sequitur (it does not follow).**

  **Why This Step Fails:**

  1.  **Truth Depends on Events, Not Vice Versa:** The proposition "Team A wins 2-1" is true *only if* the specific sequence of events constituting the match leads to that score. The truth of the proposition *supervenes* on the events. The match doesn't "reveal" a pre-existing, disconnected truth; **the match *makes* the proposition true (or false) through its causal events.** Before the match, there *is* no actual "2-1 win" fact floating in the ether; there is only the *potential* for various outcomes. The truth value is *about* the future event; it is not a *substitute* for it.
  2.  **Confusing Description with Cause:** Saying "It is true now that Team A will win 2-1" is a *description* of what *will* happen. It is **not** a *cause* of what will happen. The *cause* is the complex chain of events during the match: players training, strategizing, exerting effort, making decisions, experiencing luck, reacting to opponents, etc. **The logical truth of the proposition is a *consequence* of the future causal chain, not its cause or its eliminator.** Knowing the truth value (if we could) wouldn't change *what causes* that truth value to be what it is.
  3.  **The "Truthmaker" is the Match:** What *makes* the proposition "Team A wins 2-1" true? It's not a fact existing before the match. **The "truthmaker" is the actual physical occurrence of the match itself, resulting in that specific score.** Without the match happening, the proposition lacks a truthmaker. The players' efforts *are* the essential components of that truthmaker.
  4.  **Analogy - History:** Consider the proposition "Napoleon lost the Battle of Waterloo." This is true *now*. Does that mean the soldiers' actions, decisions, weather, and troop movements *during the battle* didn't cause the outcome? Of course they did! The truth of the historical proposition is *dependent* on those very causal events. The logical truth *now* doesn't erase the causal chain *then*. The football match is analogous; it's just that the causal chain is in our future instead of our past.
  5.  **Analogy - Prediction vs. Cause:** Imagine a perfectly accurate oracle who tells you the exact score before the match. The oracle's prediction being true *now* doesn't mean the players' efforts don't cause the outcome. It simply means the oracle had accurate knowledge (somehow) of what that future causal chain *would* produce. The effort is still the cause; the oracle just *knows* the effect in advance.

  **Why Effort Matters (Causally):**

  *   **Effort is a *causal factor* within the chain of events that *determines* the outcome.** Players running faster, tackling harder, concentrating more, making better decisions under pressure – these actions directly influence the movement of the ball, the creation of chances, the prevention of goals, and ultimately, the scoreline.
  *   If *all* players exerted *zero* effort, the score would likely be 0-0, or the match might not even proceed. Different levels and applications of effort lead to vastly different potential outcomes. **The specific level and quality of effort exerted *during the match* is a critical variable that shapes which of the many possible future outcomes becomes actual (and thus, which proposition becomes true).**

  **Conclusion:**

  Your friend's reasoning is sound *up to* the point of acknowledging that, according to the principle of bivalence applied to future events, a proposition about the match's outcome has a truth value now. **The critical error is inferring that this logical fact implies the causal irrelevance of the match events themselves.** This confuses the *description* of reality (the truth value of a proposition) with the *causal structure* of reality (the physical events that make the proposition true or false). **The players' effort is not rendered irrelevant; it is precisely the kind of causal event that *determines* what the future truth value turns out to be.** The match isn't revealing a pre-written script; it's actively writing the script through the causal interactions of the players, the ball, and the environment.
