  L = Σ Q_i log(Q_i / P_i) + λ (1 - Σ Q_i) + μ (Q(RH) - 3 Q(RS))

  But note: the constraint is Q(RH) = 3 Q(RS). So we can write the Lagrangian as:

  L = Q_RH log(Q_RH / (1/4)) + Q_RS log(Q_RS / (1/4)) + Q_BH log(Q_BH / (1/4)) + Q_BS log(Q_BS / (1/4))
     + λ (1 - Q_RH - Q_RS - Q_BH - Q_BS) + μ (Q_RH - 3 Q_RS)

  Taking derivatives:

  ∂L/∂Q_RH = log(Q_RH) - log(1/4) + 1 - λ + μ
  ∂L/∂Q_RS = log(Q_RS) - log(1/4) + 1 - λ - 3μ
  ∂L/∂Q_BH = log(Q_BH) - log(1/4) + 1 - λ
  ∂L/∂Q_BS = log(Q_BS) - log(1/4) + 1 - λ

