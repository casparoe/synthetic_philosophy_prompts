  Similarly, for BS: Q_BS = exp(λ - 1) / 4

  So indeed, Q_BH = Q_BS. Let us set Q_BH = Q_BS = b.

  For RH: log(4 Q_RH) = λ - 1 - μ => Q_RH = exp(λ - 1 - μ) / 4
  For RS: log(4 Q_RS) = λ - 1 + 3μ => Q_RS = exp(λ - 1 + 3μ) / 4

  Now, we have the constraint: Q_RH = 3 Q_RS
