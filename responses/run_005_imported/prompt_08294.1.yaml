prompt: |-
  For my philosophy of science seminar we've been going through the frequentist vs Bayesian debate, and I got stuck on the 'optional stopping' thing. Apparently if you're a frequentist, your p-value depends on the stopping rule you used (like 'run exactly 100 subjects' vs 'run until p<.05, then stop'), even when you end up with literally the same dataset either way -- but if your a Bayesian, the posterior doesn't care at all what stopping rule you used, it only looks at the data you actually got. My prof mentioned this has something to do with the 'likelihood principle' but kind of breezed past why thats actually true. Can you explain the actual mechanism behind why frequentist inference is sensitive to the stopping rule but Bayesian updating isn't, and why this specific issue (not just generic 'p-hacking is bad' talk) keeps getting flagged as one of the real drivers behind the replication crisis?
reasoning: |-
  Okay, the user is struggling with the optional stopping problem in the context of frequentist vs Bayesian inference. They mentioned their professor touched on the likelihood principle but didn't explain why Bayesian updating ignores stopping rules while frequentist methods don't. They want a clear mechanism behind this and why it's linked to the replication crisis beyond just p-hacking.

  First, I need to recall the core concepts. The likelihood principle states that all evidence from an experiment is in the likelihood function. Bayesian inference follows this because the posterior is proportional to the likelihood times the prior. The stopping rule doesn't affect the likelihood, so Bayesians don't care about it. For frequentists, p-values depend on sampling distributions, which include the stopping rule because it defines the sample space. That's the key difference.

  The user's confusion is about why the stopping rule affects frequentists but not Bayesians even with the same data. I should explain with a concrete example. Imagine a binomial experiment: flipping a coin until you get 10 heads. The stopping rule here is to stop after 10 heads. The likelihood function is the same whether you fixed the number of trials or stopped after 10 heads. For Bayesians, since the likelihood is identical, the posterior is the same. But for frequentists, the p-value calculation would differ because the sampling distribution changes—one scenario considers all sequences with 10 heads in exactly 100 flips, the other considers sequences that end with the 10th head on the 100th flip. The probabilities involved are different because the sample spaces are defined differently.

  The user also wants to know why this is a big deal for the replication crisis. It's not just about p-hacking in the sense of cherry-picking results. Optional stopping allows researchers to collect data until they hit significance, which frequentist methods don't account for in their p-values. This inflates the Type I error rate. For example, if you keep testing after each sample, the chance of a false positive can be much higher than 5%. Bayesian methods, by ignoring the stopping rule, don't have this inflation. So, in fields where optional stopping is common, many published results with p<0.05 might be false positives, contributing to replication failures.

  I should make sure to connect the mechanism clearly. Emphasize that frequentist inference relies on the sampling distribution, which includes the stopping rule as part of the experimental design. Bayesian updating uses only the likelihood of the observed data. The key point is that the stopping rule changes the sample space, affecting how p-values are computed, but doesn't change the likelihood function. This leads to different p-values for the same data under different stopping rules, whereas the Bayesian posterior remains the same.

  Also, address why this is a driver of the replication crisis. Frequentist methods assume a fixed sample size. When researchers use optional stopping without adjusting for it, the nominal p-value is misleading. The actual error rate is higher, leading to more false positives in the literature. Bayesian methods, by adhering to the likelihood principle, naturally avoid this issue. So, the problem isn't just unethical p-hacking; it's a fundamental limitation of frequentist inference in dynamic data collection scenarios.

  I need to ensure the explanation is thorough but not overly technical. Use examples like the coin flip to illustrate. Mention how optional stopping can be done unintentionally, like adding more subjects when results aren't significant yet. Highlight that while Bayesians aren't affected, their priors can be another issue, but that's separate. The main takeaway is the role of the stopping rule in frequentist inference versus its irrelevance in Bayesian updating due to the likelihood principle.
answer: |-
  This is a **deep and crucial point** that cuts to the heart of the frequentist/Bayesian divide. The sensitivity to the stopping rule stems directly from the fundamental difference in *what constitutes evidence* in each framework. Let's break down the mechanism:

  1.  **The Likelihood Principle (LP):** The core concept your prof mentioned.
      *   The LP states: **All the evidence about a parameter θ provided by an experiment is contained in the likelihood function L(θ | data) = P(data | θ).** Two experiments yielding proportional likelihood functions for θ provide the *same* evidence about θ.
      *   Crucially, the LP implies that *how* the data was obtained (the experimental design, including the stopping rule) is irrelevant for inference about θ once the data is in hand. Only the data itself matters.

  2.  **Why Bayesian Updating Obeys the Likelihood Principle:**
      *   Bayes' Theorem: **P(θ | data) ∝ P(data | θ) * P(θ) = L(θ | data) * P(θ)**
      *   The posterior distribution depends *only* on:
          *   The Likelihood of the observed data: `L(θ | data)`
          *   The Prior: `P(θ)`
      *   **Mechanism:** The stopping rule describes *what data you might have observed but didn't*. It defines the *sample space* (the set of all possible experimental outcomes). However, the Bayesian posterior conditions *only on the data that actually occurred*. The probability of data you *didn't* observe plays no role in the calculation. The likelihood function `P(data_observed | θ)` depends only on `θ` and the *actual* data points you have, not on the rule that told you to stop collecting them. Therefore, the stopping rule **does not** appear in Bayes' theorem.

  3.  **Why Frequentist Inference (p-values) Violates the Likelihood Principle:**
      *   A p-value is defined as: **P(observed data or data more extreme than observed | H₀ is true, *experimental design*)**.
      *   The critical part is "***experimental design***". This includes:
          *   The sampling mechanism (e.g., random sampling).
          *   The **stopping rule** (e.g., "stop at N=100" vs. "stop when p<0.05").
      *   **Mechanism:** The p-value calculation requires knowing the *sample space* defined by the experimental design. The stopping rule fundamentally alters this sample space:
          *   **Fixed N:** The sample space consists of *all possible datasets of size N*. The "more extreme" outcomes are other datasets of size N.
          *   **Optional Stopping (e.g., stop at first significant result):** The sample space consists of *all possible sequences* where significance is reached *for the first time* at some point (e.g., (NS, NS, S), (NS, S), (S), etc.). The "more extreme" outcomes are other sequences where significance was reached *as early or earlier* than in your actual sequence.
      *   **Why the Same Data Leads to Different p-values:** Imagine you finally get p<0.05 at N=100.
          *   Under the "Fixed N=100" design, the p-value is P(result at N=100 as or more extreme than observed | H₀, Fixed N). This calculation considers *only* datasets of size 100. Getting a significant result at N=100 is relatively less surprising under H₀.
          *   Under the "Stop when p<0.05" design, the p-value is P(reaching significance *by* N=100 | H₀, Optional Stopping). This calculation considers *all sequences* where significance was reached at N=1, N=2, ..., N=100. The probability of finding significance *at some point* within 100 trials under H₀ is much higher than the probability of getting it *specifically at N=100* under the fixed design. The frequentist calculation *must* account for this increased opportunity to get a false positive inherent in the optional stopping rule.
      *   **Result:** The *same numerical data* (e.g., 60 successes out of 100 trials) will yield a **larger p-value** under the optional stopping design than under the fixed-N design. The frequentist procedure punishes you for having looked at the data multiple times, even if you happened to stop exactly at N=100.

  **Why This is a Major Driver of the Replication Crisis (Beyond Generic p-hacking):**

  1.  **Ubiquity of Optional Stopping:** Researchers often don't rigidly pre-register a fixed N. Common practices include:
      *   Adding more subjects because results "aren't quite significant yet."
      *   Stopping early because results "look good" (p<0.05).
      *   Analyzing data as it comes in (peeking).
      *   Running subjects until a funding deadline or lab availability ends (which often correlates with reaching a desired result).
      *   These are all forms of optional stopping, conscious or unconscious.

  2.  **Severe Inflation of False Positive Rates (Type I Error):** The core frequentist guarantee (e.g., "only 5% of true null hypotheses will yield p<0.05") **assumes a fixed sample size or a strictly pre-specified stopping rule.** When researchers use optional stopping without adjusting the analysis:
      *   The *nominal* p-value (e.g., p=0.04 calculated naively as if N was fixed) is **too small**.
      *   The **actual probability of a false positive (Type I error rate) can be dramatically inflated**, sometimes to 20%, 30%, 50%, or even higher, depending on how aggressive the stopping rule is.
      *   **Example:** Simulate tossing a fair coin (H₀: P(Heads)=0.5). Plan to toss until |Heads - Tails| >= k for some k. The probability of *eventually* getting a significant imbalance (e.g., p<0.05) under H₀ is 100% if you keep tossing long enough! Optional stopping guarantees a false positive if you are persistent. While real research doesn't go to infinity, even modest optional stopping inflates error rates substantially.

  3.  **The Illusion of Evidence:** Optional stopping allows researchers to "hunt" for significance. The frequentist framework, by incorporating the stopping rule into the p-value calculation, is *supposed* to correct for this hunting by making significance harder to achieve (larger p-value). **But in practice, researchers almost always report the naive p-value calculated *ignoring* the stopping rule.** This naive p-value is invalid under optional stopping. It creates the **illusion of strong evidence** (low p-value) where none exists, or inflates weak evidence into seeming significance.

  4.  **Bayesian Robustness (In This Specific Sense):** A Bayesian analysis using the same prior and the observed data will produce the same posterior distribution and Bayes Factor *regardless* of whether the researcher planned N=100, stopped because they saw p<0.05 at N=100, or stopped because their coffee got cold at N=100. The stopping rule doesn't enter the calculation. The Bayesian measure of evidence (posterior probability/Bayes Factor) is **only sensitive to the actual data obtained and the prior**, not the path taken to get the data. This doesn't make Bayesian methods immune to *all* problems (priors matter!), but it makes them robust *specifically* to the optional stopping problem. The Type I error rate inflation described above simply doesn't occur in the same way.

  **In Summary:**

  *   **Frequentist Sensitivity:** P-values depend on the *probability of unseen data* under the null hypothesis *and* the specific experimental design (including the stopping rule) that generated the sample space. Optional stopping enlarges the sample space in a way that makes "significant" results more likely under H₀, requiring a larger p-value correction to maintain the error rate guarantee. Reporting the naive p-value ignores this correction.
  *   **Bayesian Insensitivity:** Posterior probabilities depend *only* on the *probability of the seen data* under different hypotheses (via the likelihood) and the prior. The stopping rule, defining what data *might* have been seen but wasn't, is irrelevant once the data is collected.
  *   **Replication Crisis Link:** The widespread, often unintentional, use of optional stopping combined with the reporting of **invalid naive p-values** that ignore the stopping rule leads to a massive inflation of false positive results in the literature. These statistically significant but spurious findings then fail to replicate. It's not just conscious "p-hacking"; it's a fundamental mismatch between the assumptions of the frequentist test (fixed design) and the reality of flexible data collection practices. The Bayesian approach, by adhering to the Likelihood Principle, avoids this specific pitfall.
