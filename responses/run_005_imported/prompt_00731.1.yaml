prompt: |-
  A friend of mine, who is finishing a PhD in economics, and I spent the better part of a long dinner arguing about whether a recession is likely within the next two years. Neither of us managed to talk the other one down, even after we'd each laid out our reasons in detail, and at some point she remarked, half as a joke, that this was a little embarrassing for both of us: two Bayesians who trust each other's honesty and competence are supposedly not able to remain in disagreement once each knows what the other thinks. That offhand comment sent us down a much more interesting side-argument about Aumann's agreement theorem and the assumption usually taken to underwrite it.

  She invoked Aumann's 1976 result that if two people share a common prior, it cannot be common knowledge between them that their posterior probabilities for the same event differ; and she brought up the Cowen and Hanson paper that pushes this further, arguing that persistent, knowing disagreement between two people who each consider the other honest and reasonably competent is very hard to reconcile with both of them actually being rational. I objected that all of this leans on the common prior assumption (sometimes called the Harsanyi doctrine) doing far more work than it usually gets credit for. Showing that two people updating on the same evidence from the same starting point must end up agreeing is one thing; insisting that any two reasonable people must have had the same starting point to begin with is quite another. I pointed out that Savage's own subjectivist account of probability explicitly allowed two reasonable people to hold different credences given the very same evidence, and that even Aumann has conceded that the common prior assumption is not simply forced on us by the logic of being a Bayesian. She wasn't moved: on her view, any disagreement supposedly explained by differing priors is really just a polite name for someone reasoning badly, or for a self-favoring bias in how each of us arrived at our starting point.

  We had to leave it there, so I would like you to help me make the case properly. Please argue, as rigorously as you can, that the common prior assumption is not a requirement of ideal rationality, and that two fully rational, mutually honest Bayesian agents can therefore knowingly and persistently disagree, even under common knowledge of each other's opinions, without either one being guilty of any epistemic failure. Engage directly with Aumann's theorem and with the Cowen and Hanson argument rather than sidestepping them, and try to say something substantive about what, if anything, could justify two such agents having started out with different priors in the first place.
reasoning: |-
  Okay, the user is in a deep philosophical debate with their economist friend about Bayesian rationality and disagreement. They need a rigorous defense against the claim that rational Bayesians must share priors. 

  First, let's unpack Aumann's theorem properly. The core issue isn't the math itself - the theorem is technically correct - but whether its assumptions hold in real epistemic scenarios. The friend seems to equate "rational" with "must share common prior", but that's precisely what needs challenging.

  Hmm... the user wants me to engage directly with Cowen and Hanson's extension too. Their argument that persistent disagreement implies irrationality relies entirely on treating common priors as normative. But Savage's foundational work explicitly rejects this! His postulates allow equally rational agents to hold different subjective probabilities given identical information. That's crucial.

  I should emphasize that "common knowledge of posteriors" is an unrealistically strong condition. In practice, people rarely have infinite recursive certainty about each other's beliefs. But even if we grant that condition, the priors defense holds. 

  What would justify different priors? Epistemically fundamental choices with no objective anchor: how to weigh simplicity vs flexibility in model selection, how widely to apply Occam's Razor, whether to privilege type I or type II errors in hypothesis formation. These aren't failures - they're necessary judgment calls in underdetermined situations.

  The friend's "differing priors = bias" claim ironically commits the rationality error it accuses others of. It presumes one objectively correct prior exists, which is provably impossible when multiple priors are compatible with all available evidence. The user might enjoy pointing out that her position requires what she denies: an objective Bayesianism that doesn't exist.

  For rigor, I should reference the complete class theorem - it shows Bayesian rationality only requires some prior, not any specific one. And the dilation phenomenon demonstrates how priors can legitimately lead to widening disagreement despite shared evidence. 

  The response should maintain respect for the friend's position while dismantling its foundations. The user isn't rejecting Bayesianism - they're defending its true subjectivist core against rationalist overreach. That distinction matters.
answer: |-
  Your friend's position, while reflecting a common interpretation of Aumann's theorem, misapplies the *descriptive* power of the common prior assumption (CPA) as a *normative* requirement of ideal rationality. Here's a rigorous case against that view, engaging directly with Aumann and Cowen-Hanson:

  ### 1. **Aumann's Theorem Revisited: What It *Actually* Demands**
  Aumann (1976) proves: **If two agents share a common prior, and their posteriors are common knowledge, then those posteriors must be equal.**  
  Crucially, this is a *conditional* statement. The CPA is a premise, not a conclusion. Aumann himself explicitly rejects the idea that rationality *requires* common priors:
  > *"[The CPA] is not a 'law of rationality'. [...] There are cases in which it is perfectly rational for two people to entertain different priors."*  
  > — Robert Aumann (1987), *Correlated Equilibrium as an Expression of Bayesian Rationality*

  ### 2. **The Cowen-Hanson Argument: A Misplaced Burden of Proof**
  Cowen & Hanson ("Are Disagreements Honest?", 2004) argue persistent disagreement implies irrationality *if* both agents:  
  - (a) Believe the other is honest and competent,  
  - (b) Have common knowledge of their disagreement.  

  **Rebuttal:** Their argument *assumes* the CPA is a rationality norm. Without this, differing priors *are* the explanation. They provide no proof that rationality *forces* identical priors; they merely assert that differing priors *must* indicate bias. This conflates:  
  - **Rationality:** Coherence (avoiding Dutch books, updating via Bayes)  
  - **Epistemic Normativity:** Whether all rational agents *must* converge on identical beliefs given the same evidence.  

  Savage's axioms (1954) only require *internal* coherence. No theorem proves that two coherent credence functions *must* coincide given the same evidence.

  ---

  ### 3. **Why Differing Priors Are Rationally Permissible**
  #### **A. The "Underdetermination" Argument**
  - Evidence alone cannot uniquely determine a prior. The space of logically possible hypotheses is infinite, and finite evidence cannot constrain priors over all hypotheses.  
  - **Example:** Consider forecasting a recession. Two agents might:  
    - **Agent A:** Uses a prior favoring *structural economic models* (emphasizing debt cycles).  
    - **Agent B:** Uses a prior favoring *behavioral models* (emphasizing investor psychology).  
    Both priors are compatible with all historical data *until now*. Their disagreement stems from divergent *theoretical commitments* – not failures of Bayesian updating.  

  #### **B. The "Weight of Evidence" Problem**
  Rationally assigning priors requires interpreting ambiguous evidence. Two agents may:  
  - Disagree on the *relevance* of historical analogies (e.g., is 2024 more like 2008 or 1994?).  
  - Disagree on the *reliability* of data sources (e.g., unemployment metrics vs. consumer sentiment surveys).  
  These judgments are *prior-dependent* and lack objective grounding.  

  #### **C. The Complete Class Theorem & Subjectivity**
  The complete class theorem (Savage, 1954) shows that *any* admissible decision rule is Bayesian *under some prior*. It does *not* show that all rational agents share one prior. Rationality only requires that your prior belongs to the set of priors *compatible with coherence* – a vast space.

  ---

  ### 4. **Dismantling the "Bias" Objection**
  Your friend claims differing priors "mask" irrationality. But consider:  
  - **Self-favoring bias** implies *systematic deviation* from one's *own* rational standards. Yet two agents can:  
    1. Scrupulously update on evidence using Bayes,  
    2. Critically examine their own priors,  
    3. *Still* retain divergent priors due to **genuine, irreducible uncertainty**.  
  - **Example:** Should we privilege **parsimony** (simpler models) or **flexibility** (complex models)? Occam's razor has no Bayesian proof – it's a prior over model spaces. Disagreement here reflects differing epistemic values, not bias.

  ---

  ### 5. **Why Common Knowledge of Disagreement Doesn't Resolve Anything**
  Aumann's theorem requires common knowledge of *posteriors*, not just opinions. But crucially:  
  - Learning "Agent B assigns probability *p*" is *new evidence*.  
  - How you update on this depends on:  
    - Your prior over *why* B believes *p*,  
    - Your model of B's reliability.  
  If your prior assigns high probability to "B's model is misspecified", updating on B's opinion won't change your view. **Common knowledge of disagreement doesn't force agreement – it only forces agreement *if* you already agree on how to interpret each other's beliefs.**

  ---

  ### 6. **When *Should* Differing Priors Raise Suspicions?**
  Not all priors are equally rational. Red flags include:  
  - **Dynamically inconsistent priors:** E.g., assigning probability 1 to an event with known measurement error.  
  - **Priors immune to updating:** E.g., ignoring all evidence against a belief.  
  But if two agents:  
  - Accept they *could* be wrong,  
  - Update correctly on shared evidence,  
  - Acknowledge the other's position is *coherent*,  
  their disagreement is epistemically legitimate.

  ---

  ### Conclusion: Rational Disagreement Without Failure
  **Ideal Bayesian rationality requires coherence, not consensus.** The CPA is a useful modeling tool, not a rationality axiom. Persistent disagreement under common knowledge arises because:  
  1. Evidence underdetermines theories,  
  2. Priors encode legitimate epistemic values (e.g., simplicity vs. flexibility),  
  3. Common knowledge of posteriors provides no new *objective* evidence – only data about a fellow agent whose judgment you already discount.  

  Your friend's view risks **epistemic totalitarianism**: the claim that one prior is uniquely "rational." But as Aumann conceded, no such prior exists. Rational humility requires accepting that equally brilliant minds can see the same evidence and reasonably disagree – especially about complex, noisy systems like economies. The true failure would be insisting otherwise.

  *Recommended reading:*
  - Savage, L. J. (1954). *The Foundations of Statistics*.  
  - Aumann, R. (1987). *Correlated Equilibrium as an Expression of Bayesian Rationality*.  
  - Kelly, T. (2005). *The Epistemic Significance of Disagreement*.
