  So my girlfriend's really into astrology (rising signs, mercury retrograde, the full deal) and she got me good the other night by pointing out that Kepler -- the guy who actually worked out the real laws of planetary motion -- was a practicing astrologer his whole career, casting horoscopes for cash and everything. I poked around a bit and its clearly not as simple as "closet true believer" or "just doing it for the money." From what I can tell he thought most of what working astrologers actually did -- the zodiac signs, the houses, all that -- was basically made up, but he still believed planetary aspects had a real effect on weather and temperament, tied into his whole harmony-of-the-spheres worldview, and he even wrote this pamphlet (Tertius Interveniens, I think?) where he positions himself as a "third man" between a guy who thought astrology was total bunk and a guy who bought the whole tradition. Can you actually explain where he drew that line -- like what made an aspect legit to him but a zodiac sign not -- and how he squared that with being one of the most rigorous mathematical minds of the era? I don't want the "foolish daughter of astronomy" one-liner, I want to actually get how the view hung together.
