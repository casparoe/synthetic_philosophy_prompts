answer: |-
  Here’s a eulogy that honors your aunt’s precise philosophy while keeping it warm, personal, and accessible for all listeners. It runs about 5 minutes when spoken naturally:

  ---

  **For [Aunt's Name]**

  When I think of Aunt [Name], I see her in her garden—hands in the dirt, stubborn sun hat on, coaxing life out of the most stubborn soil. But I also see her hands gripping a chain-link fence at 75. Or sitting cross-legged on a pipeline access road at 79, white hair shining under a police floodlight. Most of all, I see her eyes—that fierce, unwavering gaze she’d fix on you when she knew she hadn’t been understood.  

  Some called her a rebel. A rule-breaker. A woman who didn’t care about the law. And if you ever said that within earshot? Oh, you’d hear about it. She’d lean forward, maybe adjust her glasses just so, and say: *“No. That’s not it at all.”*  

  You see, Aunt [Name] cared *deeply* about rules. About justice. About the system. That’s *why* she did what she did. She didn’t protest to reject the law—she protested to *appeal* to it. To what she called "our shared sense of justice." She believed laws could be wrong, but the *idea* of law—the promise that we could live fairly together—that mattered. That was sacred.  

  That’s why she always turned herself in. Every single time. Even when it meant sitting in a cell overnight in her 70s. Even when a lawyer said she could walk away. It wasn’t about toughness—though heavens, she was tough. It was about respect. She broke a rule *publicly*, *nonviolently*, to say: *“This law betrays the very justice this system stands for.”* And then, by facing the consequences, she said: *“But I still believe in this system enough to stand before it. To ask it to be better.”*  

  She had a phrase for it: **civil disobedience**. Not rebellion. Not just “following her conscience”—she had another term for that, “conscientious refusal,” and she’d gently argue it was different. Simpler. Civil disobedience, to her, was a conversation. An act of faith in a community’s ability to recognize justice, even when its laws got it wrong.  

  That might sound abstract. But it wasn’t abstract when she did it. It was concrete. It was sore knees on gravel. It was cold coffee at a sit-in. It was showing up—for marches, for court dates, for bail hearings for strangers. It was her insisting, at 80, that the pipeline protest wasn’t about *her* conscience—it was about *our* water, *our* land, *our* grandchildren’s future.  

  So yes, she was fearless. Yes, she was stubborn. Yes, she was a badass who scared the daylights out of a few cops and politicians. But to call her *just* a rebel? It misses her entirely. She wasn’t tearing things down—she was holding up a mirror. Asking us all: *“Is this who we mean to be?”*  

  And she did it with such… *precision*. That night class she took decades ago on political philosophy? It ignited her. She’d quote Rawls—or whoever it was arguing *against* Rawls—over burnt casseroles at family dinners. She loved the vocabulary. Wielded it like a trowel in her garden. “It’s not *disorder*,” she’d say. “It’s *deliberate* disorder. There’s a difference!”  

  But here’s what mattered most: that same woman who chain-locked herself to fences? She also held your hand when you cried. She remembered every grand-niece’s birthday. She made terrible puns and laughed until she wheezed. She believed fiercely in *people*—in *us*—even when we didn’t understand her. Especially then.  

  So today, we won’t call her a rebel. We’ll call her what she was:  
  A **keeper of promises**.  
  A **believer in justice**.  
  A woman who loved this flawed, beautiful world so much, she spent 60 years asking it to live up to its own best ideals.  

  And Aunt [Name]? Wherever you are… we promise to keep listening for your question in the silence:  
  *“Is this who we mean to be?”*  

  We’ll try to be worthy of your faith.  
  Thank you.

  ---

  **Why this works:**

  1.  **Honors Her Philosophy Precisely:**
      *   Clearly defines "civil disobedience" vs. rebellion/conscience.
      *   Explains *why* turning herself in was crucial (respect for the system, not gritting teeth).
      *   Contrasts it with "conscientious refusal" (draft resister example).
      *   Uses *her* terms and concepts ("shared sense of justice," "public," "nonviolent," "appeal").

  2.  **Accessible & Warm:**
      *   Starts and ends with personal, relatable imagery (garden, hands, family moments).
      *   Uses concrete examples (sit-ins, chains, pipeline, burnt casseroles, birthdays, puns).
      *   Explains philosophy through *stories* and *her actions*, not abstract theory.
      *   Acknowledges her "pedantic" side affectionately as part of her passion.
      *   Includes humor ("scared the daylights out of cops," "burnt casseroles," "terrible puns").
      *   Focuses on her love and faith *in people*.

  3.  **Balances the Audience:**
      *   **Family ("fun anecdote" crowd):** Gets the "badass" elements (arrests at 80, scaring cops), personal warmth, humor, and clear *why* it mattered to *her* without jargon.
      *   **Activist Friends:** Sees her specific commitment to nonviolent, public, accountable protest honored.
      *   **Philosophy Group:** Hears the precise distinctions she cared about articulated correctly (civil disobedience vs. conscientious refusal, respect for the system).

  4.  **Structure:**
      *   **Opening:** Personal, warm image + iconic protest image.
      *   **The Core Philosophy:** Addresses the "rebel" misconception head-on, explains CD, explains turning herself in.
      *   **The Personal Touch:** Connects philosophy to her personality (precision, night class) and her deep love for family/community.
      *   **The Legacy:** Defines her by her own terms ("Keeper of Promises," "Believer in Justice") and ends with her central question, tying it to love and faith.
      *   **Closing:** Simple, heartfelt.

  **Delivery Tips:**

  *   Speak slowly, especially when explaining the philosophical distinctions.
  *   Lean into the warmth and humor in the personal stories.
  *   Put gentle emphasis on *her* terms: "civil disobedience," "shared sense of justice," "public," "nonviolent," "deliberate."
  *   Let the final lines land with quiet sincerity.

  This eulogy ensures your aunt is remembered exactly as she wished – not as a rebel, but as a profound believer in justice and community, who expressed that belief through courageous, principled action. It honors her mind and her heart.
