  We are ranking the puzzles by how directly and successfully Buchak's Risk-Weighted Expected Utility (REU) theory accounts for them, compared to plain expected utility theory (EU) with a curved utility function.

  REU theory uses a risk function that transforms decumulative probabilities (the probability of getting at least a certain outcome) and then weights utilities by the transformed probabilities. This allows for a separate attitude towards risk beyond diminishing marginal utility (which is captured by the utility function in EU).

  Let's go through each puzzle:

  1. **Allais paradox**: This is a classic example of the common consequence effect, where people violate the independence axiom of EU. REU, by using a risk function that weights probabilities non-linearly (especially in the tails), can account for the Allais paradox. Buchak explicitly designed REU to handle such cases, so this is a defining case.

  2. **Rabin's calibration argument**: Rabin showed that for small stakes, EU cannot explain risk aversion without absurd risk aversion for large stakes. REU, by having a separate risk function, can explain small-stakes risk aversion without requiring a highly curved utility function. This is a key application where REU does independent work.

  3. **Buying both insurance and lottery tickets**: This is the Friedman-Savage puzzle. EU can explain this with a utility function that has both concave and convex segments, but it requires a specific shape. REU can explain it by having a risk function that is sensitive to the dispersion of outcomes (e.g., overweighting the worst outcomes for insurance and the best outcomes for lotteries). However, note that rank-dependent utility (RDU) theories in general (like prospect theory) also explain this. REU is a form of RDU, so it can account for it, but it might not be uniquely REU.

  4. **St. Petersburg paradox**: This is about infinite expected value but people being willing to pay only a finite amount. EU resolves this by having a concave utility function (diminishing marginal utility). REU can also resolve it by either the utility function or the risk function. However, the risk function in REU is applied to decumulative probabilities, and in the St. Petersburg game, the decumulative probabilities are such that the risk function might not add much beyond what the utility function does. Moreover, the standard solution with EU is sufficient, so REU doesn't do independent work here.

  5. **Ellsberg paradox**: This is about ambiguity aversion. REU is a theory for decisions under risk (known probabilities) and not under ambiguity (unknown probabilities). The Ellsberg paradox involves ambiguity, so REU by itself doesn't address it. Buchak does extend REU to ambiguity in later work, but the core REU theory is for known probabilities.

  6. **Preference reversals between pricing tasks and choice tasks**: This phenomenon (e.g., the Lichtenstein and Slovic experiments) shows that people might choose one option but price the other higher. This is often attributed to the use of different heuristics in different tasks. REU, as a theory for choice under risk, does not directly address the discrepancy between choice and pricing. Pricing tasks involve a willingness to accept a sure amount, which might be modeled by the same risk function, but the phenomenon is more about the procedure. REU does not have a built-in account for task effects.

