  I recently joined the quantitative risk team at a reinsurance firm, where part of my job involves reviewing the assumptions behind the expected-value models used for some of our more exotic catastrophe-bond structures. In a training session last week, a senior colleague invoked the Pasadena paradox as a cautionary tale, explaining that it shows how a simple, well-specified coin-toss gamble can end up with an infinite expected value even though every individual payoff is finite, and that this is precisely what makes it a more severe problem for decision theory than the older St. Petersburg paradox. I would like to represent this correctly in the write-up I am preparing for the team: could you clarify what is really going on in the Pasadena paradox and what it implies for how much weight we should place on expected-value calculations for the kind of asymmetric, long-tailed payoffs we model?
