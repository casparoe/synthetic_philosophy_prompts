  Point 3 shows Priya strategically pivoting to policy parallels, but Duncan correctly notes the consent gap. His "paying for silence" metaphor is powerful - this isn't collaboration but coexistence. Verdict: Duncan identifies a structural weakness.

  Point 4 is Priya's strongest - outcomes do matter regardless of intent. Yet she dismisses Duncan's "squeamishness" too quickly; the discomfort may signal legitimate concerns about moral commodification. Verdit: Priya lands a punch but oversimplifies.

