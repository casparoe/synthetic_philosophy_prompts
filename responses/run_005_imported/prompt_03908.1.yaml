answer: |-
  You've pinpointed a profound and genuinely damaging inconsistency at the heart of Lewis's attempt to reconcile RCA, IDT, and masking via "getting specific." This isn't a mere presentational wrinkle; it's a fundamental conflict in the theoretical commitments required to handle finks versus masks. Let's break down the argument for inconsistency and then consider the strategic retreat.

  ## The Argument for Genuine Inconsistency

  1.  **IDT's Core Demand:** The Intrinsic Dispositions Thesis (IDT) is unequivocal: *All* dispositions supervene on the intrinsic properties of the object plus the laws of nature. If two objects are intrinsic duplicates under the same laws, they *must* have the *exact same set* of dispositions. This is non-negotiable for Lewis because it's the weapon he wields against Choi/Gundersen's extrinsic solution to finks. IDT *forbids* extrinsic factors from determining *whether* an object has a specific disposition (like being live or dead).

  2.  **IDT's Role Against Finks (Reverse-Cycle):** In the reverse-cycle fink (a live wire set to die upon contact), Lewis uses IDT to insist the wire *is* intrinsically disposed to conduct (it has the electron basis B). The fink's presence is an *extrinsic* factor that *interferes* with the manifestation. Crucially, IDT *forces* the attribution of the disposition *despite* this extrinsic interference. The disposition ("live") is fixed *intrinsically*; the extrinsic fink only prevents manifestation.

  3.  **"Getting Specific" for Masks:** In the masking case (fragile glass packed in foam), Lewis argues the glass is *not* disposed to break-when-struck *simpliciter*. Instead, it is disposed to break-when-struck-*and*-*unpacked*. This re-specification makes the disposition *contingent* on the *absence* of the packing.

  4.  **The Contradiction:** Here lies the core inconsistency:
      *   **In the Fink Case:** IDT **demands** that the disposition ("live") is fixed *intrinsically* and *held constant* despite the *extrinsic* interfering factor (the fink device). The extrinsic factor is irrelevant to *whether* the disposition exists; it only affects manifestation.
      *   **In the Masking Case:** "Getting Specific" **makes** the very *identity* of the disposition itself (break-when-struck-unpacked vs. break-when-struck) **depend constitutively on an extrinsic factor** (the presence or absence of packing). The packing isn't merely interfering with the manifestation of a pre-existing intrinsic disposition; it's determining *which* disposition the object *has*.
      *   **The Conflict:** Lewis uses IDT to **insulate dispositions from extrinsic determination** in the fink case (blocking Choi/Gundersen). However, in the masking case, he uses "getting specific" to **make dispositions extrinsically determined**. An intrinsic duplicate of the packed glass *in situ* has disposition D1 (break-when-struck-unpacked), while that *very same intrinsic duplicate* placed in an unpacked environment has disposition D2 (break-when-struck-simpliciter). This violates IDT, which requires intrinsic duplicates to have *all the same dispositions*, regardless of environment. "Getting specific" makes the *set* of dispositions an object possesses (specifically, whether it has the simple disposition "fragile" or the complex disposition "fragile-only-when-unpacked") sensitive to extrinsic circumstances.

  5.  **Why it's Damaging:** This inconsistency undermines the *motivation* for IDT and the *explanatory power* of RCA.
      *   **Motivation for IDT Evaporates:** If extrinsic factors *can* determine which dispositions an object has (as in masking via "getting specific"), then Lewis has no principled ground to insist they *cannot* determine dispositions in the fink case. Choi and Gundersen's extrinsic solution to finks becomes viable again, rendering Lewis's appeal to IDT and the complex RCA machinery unnecessary. Why fight so hard for IDT against finks only to abandon it for masks?
      *   **RCA's Explanatory Power Diminished:** RCA's core move – appealing to a retained intrinsic basis B – is predicated on dispositions being intrinsic (IDT). If dispositions can be extrinsically determined via masking specifications, the ontological status and causal role of B become murky. Is B the basis for the simple disposition (which the packed object lacks) or the complex disposition (which it has)? The neat link between intrinsic basis and disposition is severed.

  **Conclusion on Inconsistency:** Lewis cannot simultaneously maintain that (a) dispositions *must* be intrinsic (IDT) to block extrinsic solutions to finks, and (b) that the *specific identity* of a disposition (and thus whether an object has the simple disposition or a complex variant) *can* be extrinsically determined to solve masking ("getting specific"). These commitments pull in opposite directions regarding the fundamental nature of dispositions. The tension doesn't dissolve; it exposes a fatal flaw in the attempt to have a uniform, IDT-compliant analysis handle both finks and masks.

  ## Which Commitment to Jettison?

  A Lewisian committed to the core RCA framework must sacrifice one of the three. The choice involves significant theoretical cost, but one option minimizes damage to RCA's core insights:

  1.  **Jettison RCA:** This is the nuclear option. Abandoning RCA means giving up Lewis's sophisticated response to finks and returning to the pre-Lewis chaos. While RCA has problems, it represents significant progress over SCA. This sacrifice seems disproportionate to solve *this specific* inconsistency.

  2.  **Jettison IDT:** This directly resolves the inconsistency by allowing dispositions to be extrinsic in *both* finks and masks. Choi and Gundersen win on finks. For masks, the packed glass simply *lacks* the disposition to break-when-struck-simpliciter *because* of the extrinsic packing, while its unpacked duplicate *has* it. **Cost:** This abandons a powerful metaphysical intuition (that an object's causal powers are fundamentally intrinsic) and makes dispositions highly context-dependent. It potentially severs the tight link between microstructure and disposition that motivates much dispositional realism. RCA loses its primary *motivation* (saving intrinsicality) and its neat solution to reverse-cycle finks becomes merely one possible extrinsic description.

  3.  **Jettison "Getting Specific" as the Response to Masking:** This is the **least damaging and strategically best option** for a Lewisian.
      *   **Why:** It preserves RCA (the sophisticated analysis of dispositions and finks) and IDT (the core metaphysical commitment to intrinsicality). The inconsistency arises *specifically* because "getting specific" violates IDT in handling masks. Sacrificing this particular tactic doesn't inherently doom RCA+IDT.
      *   **What Instead?** The Lewisian must find an *alternative*, IDT-compliant way to handle masking. Possibilities include:
          *   **Manifestation Blockers:** Argue that masks (like packing or antidotes) are *extrinsic interferers* that prevent the manifestation of an *intrinsic* disposition, *without* changing the disposition itself. The packed glass *is* intrinsically fragile (disposed to break-when-struck), but the packing *blocks* the causal pathway from striking to breaking. This mirrors the fink solution: the intrinsic disposition is present, the extrinsic factor interferes. **Challenge:** This requires a robust account of "blocking" distinct from "finking" or "altering the basis," and must explain why the conditional ("if struck, would break") seems false for the masked object without resorting to re-specifying the disposition.
          *   **Multi-Track Dispositions:** Develop a more complex view where objects have many dispositions simultaneously. The glass has the intrinsic disposition to break-when-struck *and* the intrinsic disposition to resist-breaking-when-packed (or to interact with packing in a way that prevents breaking). Masking occurs when one disposition (interacting with packing) manifests in a way that prevents the manifestation of another (breaking). **Challenge:** This requires a richer ontology of dispositions and their interactions, potentially complicating RCA's analysis.
          *   **Refine the Causal Basis Concept:** Argue that the causal basis B for "fragility" is *not* simply the molecular structure, but the molecular structure *plus its inherent responsiveness to force under normal conditions*, where "normal" excludes masking. **Challenge:** This risks making B itself implicitly extrinsic or context-dependent, potentially undermining IDT again.
      *   **Cost:** Finding a viable, IDT-compliant account of masking is difficult and may require significant revisions or complexities within the Lewisian framework. It may not be as intuitively simple as "getting specific." However, it preserves the core motivations and achievements of RCA and IDT. The Lewisian avoids the damning inconsistency and maintains the principled stand against extrinsic determination of dispositions.

  **In summary:** The inconsistency is real and damaging because "getting specific" for masks violates the very principle (IDT) that Lewis invokes to solve finks. To restore consistency while preserving the core of Lewis's project (RCA and the motivation for intrinsicality), the Lewisian should jettison the "getting specific" strategy for masking and seek an alternative, IDT-compliant account of how masks prevent manifestation without extrinsically defining the disposition itself. The cost is theoretical work, not core principle. Sacrificing IDT abandons Lewis's foundational motivation, while sacrificing RCA surrenders his key technical achievement.
