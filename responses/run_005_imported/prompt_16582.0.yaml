  So in my formal epistemology reading group we spent basically a whole session on the absent-minded driver problem (the Piccione & Rubinstein highway/exit case) and I think I've got the setup down -- two subjectively indistinguishable intersections, exiting at the first gets you 0, continuing and exiting at the second gets you 4, missing both gets you 1, and the "planning-optimal" probability of continuing at each intersection comes out to 2/3. What I'm still stuck on is the next step: once the driver is actually AT an intersection and tries to reason in the moment about whether it's probably the first one or the second one, that seems to recommend something different from just sticking to the 2/3 plan, and that gap is apparently the whole "paradox" everyone gets excited about. One person in the group kept insisting this is basically a cousin of the Sleeping Beauty problem -- something about self-locating credence and updating on indexical evidence when memory is degraded -- but we never actually settled whether that analogy holds up or if it's kind of a red herring, and I'm too embarassed to bring it up again next week without having thought it through more.

  Could you give me the most important implications of the absent-minded driver problem for (a) whether standard Bayesian decision theory actually breaks down for agents with imperfect recall, or whether the planning-optimal/action-optimal split can be reconciled some other way, and (b) whether the case genuinely supports one side of the halfer/thirder dispute over Sleeping Beauty, or whether the resemblance is more surface-level than structural. Please don't re-explain the basic setup back to me, I know that part -- I just want the actual substance on what I should take away from this for how we ought to think about rational choice and credence when an agent literally cannot tell its current situation apart from another one it might be in.
