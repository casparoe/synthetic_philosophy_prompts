answer: |-
  That's an incredibly sharp observation, and you've hit on the core tension in dynamic choice theory. Your programmer's instinct is spot-on: **Sophisticated choice (lookahead + pruning negative cycles) *does* technically prevent the money pump in its simplest form.** But the debate persists because sophisticated choice often forces you into outcomes you recognize upfront as *worse* than what you could achieve if you could just *commit* to avoiding the cycle. Resolute choice is an attempt to capture that "commitment power" rationally. Here's why it's not just irrational precommitment:

  **1. The Core Problem with Sophisticated Choice: It Accepts Domination**

  The fatal flaw of sophisticated choice isn't that it gets pumped; it's that it *resigns itself* to suboptimal outcomes dictated by the *threat* of future irrationality.

  *   **The Sophisticated Agent's Dilemma:** Imagine the classic cycle: A > B > C > A (where > means "strictly preferred").
      *   **At T0 (Start):** You have A. You prefer A over everything else.
      *   **Sophisticated Lookahead:** You see the pump loop (A->B->C->A, paying each time). To avoid being pumped, you know you *must* refuse the *first* trade (A for B + small cash).
      *   **Consequence:** You keep A. Great! Problem solved? Not quite...
  *   **Introducing the "Better Option":** Now, suppose someone offers you a *direct, one-time* trade: **Give up A, get C + a significant amount of cash ($X).**
      *   **At T0:** You prefer A > C. However, $X is substantial. Crucially, **you also know, via sophisticated lookahead, that if you accept C, you'll *later* be vulnerable to the pump *back* to A (C->A, paying again)**. So, sophisticated choice dictates: *Refuse* the direct A-for-C+$X trade to avoid the future pump vulnerability.
      *   **Result:** You are stuck with A.
  *   **The Domination:** But consider the *alternative plan*:
      1.  **Accept** the direct A-for-C+$X trade at T0.
      2.  **Commit/Be Resolute:** Once you have C+$X, *refuse* any further trades in the cycle (C->A, A->B, etc.), even though your *momentary* preference at T1 (holding C) would be to trade C for A (paying).
  *   **Comparison:**
      *   *Sophisticated Outcome:* Keep A.
      *   *Resolute Outcome:* Have C + $X.
  *   **The Problem:** If $X > 0 and you prefer C+$X to A (which you *should*, since you preferred A to C but $X compensates), then the sophisticated agent ends up with A, *while a resolute agent ends up with something strictly better (C+$X > A)*. **Sophistication forces you to reject a strictly dominating option (C+$X) because it correctly foresees its *own future inability* to stick to a plan.**

  **2. Why Resolute Choice Isn't (Necessarily) Smuggling Irrationality**

  Resolute choice argues that rationality should be assessed *globally*, over the entire plan, not just locally at each decision node. It claims that sticking to a *globally optimal plan* formulated with full knowledge is rational, even if executing a *single step* of that plan in isolation looks suboptimal *at that instant*.

  *   **The Analogy:** Think of Ulysses tying himself to the mast. At T0 (sane), he knows the Sirens' song (T1 preference) will make him act against his T0 goals. Tying himself *is* the rational act *from the T0 perspective* to achieve his *overall* goal (getting home). Ignoring the ropes at T1 because "right now I want to go to the Sirens" is locally appealing but globally disastrous. Resoluteness is the "tying" in the money pump scenario.
  *   **The "Judgement" Argument:** You ask if it's "overriding your own judgement later." The resolute view is:
      1.  Your **full-information, deliberative judgement at T0** identifies the globally best plan (e.g., accept A-for-C+$X and then STOP).
      2.  Your **myopic, momentary preference at T1** (holding C, wanting A) is *distorted* by the context (you *have* C, triggering the C>A preference) and the *lack* of commitment power. It's not your "true" or "best" judgement; it's a predictable weakness.
      3.  Following the T0 plan *is* acting on your best overall judgement. Deviating at T1 is succumbing to a predictable bias (the cyclic preference manifesting in the moment).
  *   **Rationality as Plan-Governed:** Resoluteness defines rationality as consistency with a *feasible*, *evaluated* plan made with full awareness of future temptations and limitations. Deviating is irrational *because it violates the coherent plan you knew was best*. McClennen argues sophisticated choice is irrational *because* it lets predictable future "weakness of will" dictate that you must choose a dominated option *now*.

  **3. Why Sophisticated Choice Feels Like "Giving Up"**

  *   **Self-Fulfilling Prophecy:** Sophistication *assumes* you will be irrational later (succumb to the cycle) and therefore forces you to make a bad choice *now* to avoid the *consequences* of that future irrationality. It locks you into a suboptimal path *because* of your predicted lack of control.
  *   **Regret:** The sophisticated agent who keeps A *knows* they could have had C+$X *if only* they could have committed to stopping after that trade. They experience regret for being trapped by their own predicted future behavior. The resolute agent avoids this regret by enforcing the commitment.

  **4. The Counter-Arguments & Nuances**

  *   **"But T1 Preference is REAL!":** Critics argue that if you genuinely prefer A over C *at the moment you hold C*, refusing a trade to A *is* irrational *at that moment*. Resoluteness seems to ignore the reality of time-varying preferences. Defenders counter that the T1 preference is context-dependent and shouldn't override the globally optimal plan.
  *   **Commitment Mechanisms:** Resolute choice often relies on external commitment devices (contracts, rules, Ulysses' ropes). If these exist, resoluteness is easier to justify. The debate is fiercest when the *only* commitment device is pure willpower/resolve. Is *that* rational?
  *   **Sophistication as the "Practical" Solution:** In many real-world contexts without strong commitment devices, sophisticated choice might be the *best achievable* outcome, even if dominated. It minimizes losses given human limitations. Resoluteness might be an ideal we strive for but often fail to achieve.
  *   **Re-interpreting Preferences:** Some argue the money pump reveals that the cyclic preferences weren't "real" to begin with – they were incomplete or context-dependent. Resolute choice forces a consistent preference ordering by fiat.

  **In Summary:**

  1.  **Sophisticated choice works (prevents the pump)** but often forces you to reject strictly better options upfront because it correctly predicts your future inability to resist the cycle. You get "stuck" with your initial endowment (A).
  2.  **Resolute choice aims higher.** It argues that rationality demands achieving the *globally best feasible outcome* (C+$X), even if it requires committing *now* to override predictable future "momentary irrationalities" (acting on C>A when holding C). It views sticking to the optimal T0 plan *as* rational execution, not irrational overriding.
  3.  **The debate centers on:** Is rationality defined by local moment-by-moment preference satisfaction, or by global achievement of the best outcome achievable given predictable decision-making frailties? Resolute choice champions the latter, arguing that sophisticated choice surrenders too easily to predictable self-defeating behavior.

  Your programmer's instinct (prune the bad branch) is the sophisticated approach. It's logically sound and avoids immediate exploitation. Resolute choice is the ambitious programmer saying: "Why settle for avoiding disaster when I can architect the system (my future choices) to actually achieve the *best* possible result, even if it requires building in some constraints (commitments) against future 'buggy' behavior (cyclic temptations)?" It's not irrationality; it's a different (and contested) definition of what constitutes rational *execution over time*.
