answer: |-
  You've hit on a crucial tension in democratic theory. Your understanding of the logical elegance of the All-Affected Interests Principle (AAIP) is spot-on—it *does* provide a compelling, non-arbitrary criterion. However, the reason theorists like Näsström (and others like Dahl, Whelan, or Miller) see the boundary problem as unresolved isn't primarily about rejecting the AAIP's *conclusion* (though that plays a role), but about deep, inherent **conceptual, epistemological, and practical problems** within the principle itself that prevent it from being a straightforward "solution."

  Here's why the debate persists:

  1.  **The Problem of Defining "Affected Interests":**
      *   **What counts as an "interest"?** Is it material well-being? Autonomy? Cultural identity? Moral standing? Different definitions lead to vastly different demoi.
      *   **How "affected" must one be?** Does any trivial effect count? (e.g., a slight change in global commodity prices affecting someone buying coffee). Does it require a *significant* effect? A *direct* effect? Who defines the threshold?
      *   **Is it causal or constitutive?** Are interests affected only by the *outcome* of a decision, or also by the *process* of being excluded from making it (even if the outcome doesn't harm you materially)? AAIP typically focuses on outcomes, but democratic theorists often argue that *being subject to a rule without having a say* constitutes an interest in itself (the "all-subjected" principle).

  2.  **The Problem of Epistemology (Knowing the Affected):**
      *   **Predicting Effects:** We often cannot know with certainty *who* will be affected by a decision, nor *how* they will be affected, especially for complex, long-term policies like climate change. Effects can be indirect, diffuse, and nonlinear.
      *   **Causal Complexity:** In an interconnected world, almost any significant decision *might* have ripple effects touching everyone (the "butterfly effect" problem). Does this mean *every* decision requires a global vote? AAIP risks becoming either impossibly demanding or meaninglessly vague.
      *   **Counterfactuals:** To know if someone is affected, we need to compare the outcome *with* the decision to the outcome *without* it. Establishing the baseline ("without it") is often highly contested and speculative.

  3.  **The Problem of "Degree of Affectedness" and Weighting:**
      *   AAIP traditionally focuses on *inclusion* (who gets a vote), not on the *weight* of the vote. But interests are affected to vastly different *degrees*. Should someone facing existential threat from a policy have the same single vote as someone experiencing a minor inconvenience? Pure AAIP says "yes," but this seems intuitively unfair and fails to account for the *intensity* of the interest. Yet weighting votes based on affectedness creates immense practical and normative problems.

  4.  **The Problem of Non-Identity and Future Generations:**
      *   **Future People:** As you note, AAIP clearly points to including future generations. But *how*? They don't exist to speak for themselves. Who represents them? What are their specific interests (which depend on choices we make now)? How do we weigh their potentially massive interests against the concrete, known interests of present voters? This is a profound practical and theoretical challenge.
      *   **The Non-Identity Problem:** Decisions (like climate policy) don't just affect *which interests* future people have; they affect *which specific people will exist*. Can someone have an "interest" in being born into a better world if the alternative is *not being born at all*? This creates deep philosophical puzzles for defining the "interests" of potential future persons.

  5.  **The Problem of Circularity and the "Bootstrapping" Dilemma:**
      *   To implement AAIP for Decision A, we need to know who is affected. But deciding *how* to implement AAIP (e.g., who decides the threshold of affectedness? How are representatives for future generations chosen?) is itself a decision (Decision B) that affects people. Who gets to decide *that*? We need a prior demos to define the demos for the first decision. This regress seems inescapable. Näsström, drawing on thinkers like Abizadeh, argues this makes the boundary problem fundamentally *constitutive* – the demos is not discovered by a principle like AAIP, but *created* by a prior political act (which itself lacks democratic justification). AAIP doesn't solve the initial bootstrapping problem.

  6.  **The Problem of Institutional Feasibility and Collective Action:**
      *   Even if we could theoretically identify the "all-affected" for a climate decision (global+future generations), how could such a demos *possibly* function as an effective decision-making body? The scale is unimaginably vast. Deliberation, voting, accountability – core democratic functions – become logistically impossible. This forces a practical trade-off between the ideal inclusivity of AAIP and the need for a functioning decision-making unit. Most theorists acknowledge that *some* boundaries are necessary for democracy to exist as a workable system, even if they are somewhat arbitrary.

  **So, is the disagreement just about accepting the consequences?**

  Partly. Some theorists *do* resist the AAIP precisely because its radical conclusions (global, intergenerational demos) clash with existing notions of the sovereign, bounded nation-state. However, the *core* reason the boundary problem remains a "central unresolved puzzle" is that **the AAIP, while normatively powerful, fails to provide a workable, non-circular, and epistemically feasible *operational* criterion for defining the demos in concrete situations.** It identifies a crucial *moral consideration* (affected interests matter), but it doesn't definitively *solve* the practical problem of drawing a specific boundary because:

  *   It requires answering prior, equally difficult questions (What is an interest? How affected?).
  *   It often points towards impossibly large or unknowable demoi.
  *   It cannot resolve the initial constitutive act of defining *who applies the principle*.

  **Theorists like Näsström argue that acknowledging this irresolvable tension is crucial.** The boundary of the demos is not found but *founded* through an inherently political act that precedes strict democratic justification. Democratic theory must grapple with this paradox rather than hoping AAIP (or any other single principle) will dissolve it. The debate then shifts to *how* this constitutive act can be made as legitimate as possible, knowing it can never be perfectly justified by a prior democratic principle. This is why the boundary problem remains central and unresolved.
