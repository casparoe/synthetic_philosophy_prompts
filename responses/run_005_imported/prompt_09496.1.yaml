  The user has read about Hobbes's dispute with John Wallis over squaring the circle. Despite being repeatedly proven wrong, Hobbes remained confident in his solution. The user wants a conceptual explanation for this, not just the historical anecdote. They're considering if Hobbes's methodological commitments in geometry—like grounding math in motions and rejecting algebra—made such failure inevitable. They also wonder if this affects his political philosophy parallel.

