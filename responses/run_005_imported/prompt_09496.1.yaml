  Hobbes's geometric method involves defining terms based on generation through motion. For example, a circle is defined by the motion of a line segment. Definitions must be generative. He rejected algebra and abstract symbols, insisting on concrete motions. Wallis's algebraic methods seemed like "mere calculating" to Hobbes, not true demonstration.

  Now, Hobbes's repeated failure to square the circle. Jesseph's account shows Hobbes's proofs were flawed, and Wallis pointed out errors. Yet Hobbes persisted. Why? The user is asking if this persistence stems from his epistemological commitments. 

  One angle: Hobbes's conflation of conceptual possibility with physical construction. He believed that defining a geometric object via motion meant it was constructible. So, if he could conceive of a motion generating a square equal to a circle, he assumed it was possible. His certainty came from the mental act of construction, not empirical success. Thus, failure in practice didn't shake his theoretical certainty because, for him, the mental construction was what mattered.

  Also, Hobbes's rejection of algebra meant he couldn't engage with Wallis's proofs, which used algebra. Hobbes saw algebra as not based in motions, so he dismissed it. This made him unable to see his errors because Wallis's methods were invalid to him. His methodology insulated him from correction.

  Moreover, Hobbes viewed errors as misapplications of method, not flaws in the method itself. So, each failure was a mistake in execution, not in the maker's knowledge approach. This allowed him to persist without doubting his epistemology.

  Implications for political philosophy: The commonwealth is constructed via covenant, so we can have certain knowledge of it. But just as geometric certainty didn't prevent Hobbes's error, political certainty might not prevent errors in application. Students might question if political theories, even when logically derived, can be wrong in practice, yet proponents remain confident. This highlights the tension between demonstrative knowledge and real-world implementation.

  The user wants to avoid historical gossip and focus on conceptual issues. So, emphasizing how Hobbes's theory of knowledge allowed for such persistent error is key. The maker's knowledge doctrine, with its emphasis on mental construction and dismissal of alternative methods, created a framework where being wrong didn't undermine the theory. This structural blind spot is inherent in his epistemology.
answer: |-
  Your puzzle cuts to the heart of Hobbes's epistemology and its profound tensions. The key lies not in dismissing the circle-squaring episode as mere obstinacy, but in understanding how Hobbes's core philosophical commitments—especially his "maker's knowledge" doctrine and his specific theory of geometric reasoning—created a framework where such persistent, confident error was not just possible, but *structurally accommodated*. Here's a conceptual breakdown:

  1.  **The Core of Maker's Knowledge & Its Geometric Imperative:**
      *   **Certainty through Construction:** For Hobbes, genuine *scientia* (demonstrative, certain knowledge) arises *only* when the knower is also the maker. We know the causes of the thing *because we impose them* through generation. Geometry exemplifies this: we *define* a circle as the figure generated by rotating a line segment fixed at one end. Its properties flow *necessarily* from this generative act we conceive and control.
      *   **Definitions as Generative Acts:** Hobbesian definitions aren't passive labels; they are *prescriptions for mental or physical construction*. To define a thing *is* to specify how to make it. Correct definition *is* the guarantee of knowability.
      *   **Implication for Error:** Error, within this framework, stems primarily from *misdefinition* or *misapplication* of definitions (misnaming, absurdity). If a definition is correct (i.e., it accurately prescribes a possible generative motion), and reasoning follows validly from it, the conclusion *must* be certain. Doubt arises from faulty definition or faulty logic, not from the inherent opacity of the object.

  2.  **Hobbes's Specific Theory of Geometry: Motion & Anti-Abstractness:**
      *   **Geometry Grounded in Motion:** Hobbes insisted geometry *must* be understood as the science of magnitudes generated by *actual or conceivable motion*. Points are places of bodies, lines are paths traced by moving points, figures are generated by moving lines. Abstraction divorced from motion is meaningless and leads to error.
      *   **Hostility to Algebra/Symbolism:** Hobbes vehemently rejected Wallis's algebraic methods (using symbols, equations, and infinite series). He saw algebra as:
          *   **Detached from Construction:** Manipulating symbols wasn't *generating* the figure via motion; it was mere calculation divorced from the essential causal/constructive act.
          *   **"Mere Calculating":** Algebra dealt with abstract relations of signs, not the *causes* inherent in the generation of magnitudes. It might produce useful results, but not *demonstrative certainty* about the nature of the figures themselves.
          *   **A Source of Absurdity:** Hobbes believed the abstract manipulations of algebra could (and in Wallis's case, did) lead to nonsensical concepts like "infinitesimals" or "actual infinity," violating his strict materialist and finitist principles.

  3.  **The Circle-Squaring Debacle: A Structural Failure within the Framework:**
      *   **Confidence Rooted in "Construction":** When Hobbes claimed to square the circle, he *believed* he had provided a correct *generative definition* or *constructive procedure* based on motions. He wasn't just asserting a result; he thought he was *exhibiting the making* of a square equal to a given circle through a sequence of intelligible motions (however flawed Wallis showed them to be).
      *   **Error as Misdefinition/Misconstruction, Not System Failure:** For Hobbes, his repeated failures *could not* invalidate the *method* of maker's knowledge or geometric demonstration based on motion. They could *only* mean that *this specific construction* was flawed. The failure was localized to an error in *this particular* definition or logical step within the constructive process. The *system itself* remained pristine. Wallis's algebraic refutations were irrelevant because they weren't grounded in the *correct* (motion-based) method.
      *   **The Trap of Generative Certainty:** His deep conviction that *if* he could clearly conceive the generating motions, the result *must* be correct, blinded him to the possibility that his conception itself was flawed. The very strength of the maker's knowledge doctrine – the felt certainty arising from mental construction – became a liability. The subjective experience of clear constructive conception *was*, for him, the hallmark of truth.
      *   **Rejection of Counter-Evidence:** Wallis's proofs, relying on algebra and concepts Hobbes deemed absurd (like infinite series), were not just wrong; they were *illegitimate* forms of reasoning within Hobbes's system. They couldn't *count* as refutation because they didn't engage with geometry *as the science of motion*. Dismissing them wasn't stubbornness; it was *epistemological consistency* from his perspective. Accepting Wallis's methods would have meant abandoning the core tenets of his epistemology.

  4.  **Implication for the Maker's Knowledge Picture and Political Philosophy:**
      *   **The Vulnerability:** The episode reveals a profound vulnerability *within* the maker's knowledge paradigm: **It offers no reliable internal criterion to distinguish a *felt* certainty of correct construction from an *actual* certainty.** The subjective experience of clear mental generation is paramount, but it is fallible. Hobbes's system lacked a robust mechanism for *external* verification or falsification that could override this subjective conviction, especially when competing methods (like algebra) were dismissed as invalid.
      *   **Not a Fatal Flaw, but a Critical Tension:** This doesn't *destroy* the maker's knowledge picture. It highlights a critical tension: the promise of absolute certainty through construction is real, but its application depends entirely on the correctness of the initial definitions and constructive steps, which are themselves vulnerable to error *despite* the feeling of certainty they generate. The system guarantees certainty *if* you start correctly and reason validly, but it doesn't guarantee you *will* start correctly.
      *   **The Political Parallel:** This tension directly implicates the political philosophy parallel. Leviathan is built by defining terms (Sovereign, Covenant, Right of Nature, Liberty, etc.) and demonstrating their necessary consequences, mimicking geometric method.
          *   **The Promise:** Just as geometric certainty arises from constructing the figure, political certainty arises from constructing the Commonwealth via covenant. We *know* the rights and duties of the Sovereign and subjects because we *imposed* them through the generative act of the covenant.
          *   **The Vulnerability Exposed:** The circle-squaring episode serves as a stark warning: **Even the most brilliant mind, utterly convinced by the clarity of their own constructive definitions and deductions, can be catastrophically wrong.** If Hobbes could be so serenely wrong about a geometric construction he *felt* he had mastered through motion, what does this imply for the certainty of political definitions and deductions? Definitions of "Justice," "Liberty," or "Sovereign Power" are far more contested and potentially flawed than the definition of a circle. The feeling of certainty derived from "constructing" the political order logically might mask profound errors in the foundational definitions or deductions.
          *   **The Role of Methodological Purity:** Hobbes's dismissal of Wallis mirrors his likely dismissal of political arguments not grounded in his *specific* definitions and deductive chain. Alternative political theories (grounded in natural law, divine right, or historical precedent) might be seen as analogous to Wallis's algebra – illegitimate because they don't start from the correct (Hobbesian) generative principles of human nature and the state of war.

  **Conclusion & Classroom Takeaway:**

  Hobbes's serene confidence in his erroneous circle-squaring wasn't merely personal stubbornness; it was an *epiphenomenon* of his core epistemology. His "maker's knowledge" doctrine, combined with his insistence on grounding geometry solely in motion and his rejection of abstract symbolic methods, created a closed epistemic system. Within this system, certainty resided in the subjective clarity of mental construction. Error could only be perceived as a local mistake in definition or logic, never as a challenge to the system itself. Wallis's refutations were literally incomprehensible *as refutations* within Hobbes's framework.

  **For your classroom discussion:** Frame this as revealing a crucial tension *within* the promise of maker's knowledge and geometric certainty. Ask students:

  1.  How does Hobbes's *own* geometric failure challenge his claim that geometry provides a uniquely certain model for knowledge?
  2.  If the feeling of certainty from "constructing" a concept mentally can be so misleading in geometry, what implications does this have for the certainty Hobbes claims for his political philosophy, which is also built on definitions and deductions?
  3.  Does the vulnerability of Hobbes's geometric method (reliance on potentially flawed subjective constructions) undermine the parallel he draws to politics, or does it simply highlight the difficulty of achieving true *scientia* in any domain?
  4.  Can a political philosophy built on definitions and deductions, like geometry, ever be truly "refuted" if its adherents, like Hobbes, dismiss alternative methods and evidence as illegitimate?

  By focusing on the *structural* reasons for Hobbes's geometric error, you move beyond gossip and illuminate the profound challenges and potential pitfalls inherent in his ambitious project to ground both geometry and politics in the certainty of human construction. It shows that the maker's knowledge doctrine, while powerful, contains within itself the seeds of its own most dramatic failures.
