  For part (b), the student accurately names arthapatti and anupalabdhi with standard examples (Devadatta's night-eating, absent pot). The reduction explanation is textbook Nyaya - framing both as hidden inferences. The arthapatti reduction particularly shines by reconstructing the syllogism. Anupalabdhi could be slightly more precise about perception conditions but captures the essence. Minor deduction for not explicitly naming Mimamsa's counterarguments, but the question didn't ask for that.

