answer: |-
  You've hit on a crucial and subtle distinction in Nozick's work. Your friend was right: Nozick is **explicitly rejecting desert as the foundation for entitlement**, and conflating entitlement with desert fundamentally misunderstands his argument. Here's the breakdown:

  1.  **Nozick's Entitlement Theory (The Core):**
      *   Justice in **Acquisition**: How unowned things justly become owned (e.g., initial appropriation of land, resources).
      *   Justice in **Transfer**: How holdings justly move from one person to another (e.g., voluntary sale, gift, bequest).
      *   Justice in **Rectification**: How to correct injustices arising from violations of (1) or (2).
      *   **The Key Principle:** A distribution is just *if and only if* everyone is entitled to their holdings by virtue of just acquisition, just transfer, or just rectification. **The justice lies entirely in the history of how the holdings came about, *not* in any pattern or outcome (like equality, need, or desert) they exhibit.**

  2.  **Wilt Chamberlain: The *Process* Argument, *Not* Desert:**
      *   Nozick's point isn't that Wilt *deserves* his money *because* he's talented. **His point is that the money was transferred to him *voluntarily* by individuals who were entitled to their 25 cents.**
      *   The initial distribution (D1) is assumed just (no objections). Each fan *chooses* to transfer 25 cents to Wilt. Wilt *chooses* to play basketball in exchange. **The resulting distribution (D2) is just *solely because* every step in the process was a just transfer from a just starting point.**
      *   **Why Desert is Irrelevant:** If Wilt had gotten the money because a government committee decided he *deserved* it for his talent, that *wouldn't* fit Nozick's entitlement theory. It would be a patterned principle (rewarding desert) imposed from above, violating the voluntary transfer principle. The justice comes from the *fans' free choices*, not Wilt's inherent worthiness.

  3.  **Windfalls: Inheritances and Lottery Wins - Why They *Are* Just (Under Entitlement Theory):**
      *   **Inheritance:** This is a paradigm case of a just transfer. If Person A justly acquired their wealth (just acquisition) and then *voluntarily chooses* to bequeath it to Person B upon their death (just transfer), then Person B is *entitled* to that inheritance. **It doesn't matter if Person B "deserves" it through effort or talent.** The justice lies in Person A's right to dispose of their property as they wish and Person B receiving it through that voluntary act.
      *   **Lottery Win:** This is slightly more complex but fits the same mold:
          *   **Acquisition:** The lottery organization justly acquires money through voluntary ticket purchases (just transfers from participants).
          *   **Transfer:** The organization *voluntarily* agrees (via publicly known rules) to transfer a large sum to the holder of the winning ticket if a specific, agreed-upon random event occurs. Participants *voluntarily* agree to this rule when buying a ticket.
          *   **Entitlement:** The winner is entitled to the prize because it was transferred to them according to the rules of a voluntary scheme they voluntarily participated in. **Again, "desert" (did they work hard? are they talented?) is irrelevant.** The justice lies in the history: voluntary participation and transfer according to agreed-upon rules.

  4.  **The Crucial Distinction Your Friend Mentioned:**
      *   **Desert:** A *substantive, patterned principle*. It asks: "Does this person *merit* or *deserve* this holding based on some quality (effort, talent, contribution, need)?" Desert looks at the *person* and the *outcome*.
      *   **Entitlement:** A *historical, procedural principle*. It asks: "Did this person acquire this holding through a just process (initial acquisition or voluntary transfer)?" Entitlement looks at the *history* of the *holding*.

  5.  **Why Your Reading ("Desert in Procedural Clothes") is Mistaken:**
      *   Nozick explicitly argues *against* patterned principles like desert (alongside equality, utility). He sees them as requiring constant interference with people's liberty to use their just holdings as they wish (e.g., taxing Wilt to maintain a pattern).
      *   In the Chamberlain example, the fans might pay *because* they value his talent, but that's their *reason* for choosing the transfer. **For Nozick, the *moral justification* for Wilt's entitlement isn't his talent; it's the *voluntariness of the fans' choices*.** The talent explains *why* the fans chose to pay, but the *justice* of the transaction stems *only* from the fact that the fans *were entitled* to dispose of their money that way.
      *   Applying desert would require judging *why* someone received a transfer. Entitlement theory only requires that the transfer *was* voluntary and originated from just holdings. The *motivation* behind the giver's choice (admiration, charity, whim, familial duty, random selection) is morally irrelevant to the justice of the transfer itself under entitlement theory.

  **In Conclusion:**

  Nozick's entitlement theory rigorously separates **procedural justice in holdings (entitlement)** from **substantive justice based on outcomes or personal qualities (desert)**. The Wilt Chamberlain argument demonstrates that *any* pattern of distribution (even an equal one) will be disrupted by voluntary transfers, and that the resulting distribution is just *because of those voluntary actions*, not because the new recipients "deserve" more than others.

  Therefore, **windfalls like inheritances and lottery wins *are* treated exactly the same as Wilt's earnings under entitlement theory**: as long as the initial holdings were just and the transfers were voluntary, the recipient is entitled to them, *regardless of whether they "deserved" it through effort or talent*. The justice lies entirely in the history of the transactions, not in the personal merits of the recipient. Your friend correctly pointed out that conflating entitlement with desert misses the core historical/procedural foundation of Nozick's theory.
