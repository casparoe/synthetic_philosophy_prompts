  For Priya's opening move: Her "cheap insurance, no downside" stance seems appealing at surface level. But Marco's circularity objection feels like a strong counter - if the threatener can simulate you perfectly, wouldn't they see through the decoy? I should check if there are nuances in how "sufficiently good predictor" is defined. Maybe perfect simulation isn't required?

  When Priya pivots to "make real goals costly to target," that's clever - she's shifting from perfect deception to probabilistic defense. But Marco's dismissal of "shifting expected value" feels too glib; game theory often works on marginal advantages. Still, his point about half-baked schemes resonates - if the bar is too low, any flawed defense could be justified post-hoc.

  What both might miss: 
  - The threat model's asymmetry: Is the AI threatening everyone simultaneously? Individual decoys might fail where coordinated decoys work.
