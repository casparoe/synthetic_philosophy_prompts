answer: |-
  ### Ranking of Solution Concepts by Epistemic Demands  
  From least to most demanding:  

  1. **Rationalizability**: Requires only common belief of rationality (CBR) and mutual knowledge of strategy sets, without needing knowledge of opponents' payoffs or beliefs.  
  2. **Iterated elimination of strictly dominated strategies (IESDS)**: Requires common knowledge of rationality (CKR) and full knowledge of the game (payoffs/strategy sets), as players must simulate elimination steps.  
  3. **Correlated equilibrium**: Demands CKR, a common prior over a correlating device, and mutual knowledge of the game, adding a shared belief system.  
  4. **Nash equilibrium**: Requires CKR, mutual knowledge of the game, and correct conjectures (players know others' strategies), imposing perfect coordination.  
  5. **Iterated elimination of weakly dominated strategies (IEWDS)**: Needs CKR, common knowledge of the game, common belief in admissibility (no weak domination), and full-support beliefs (all non-eliminated strategies remain plausible), making it highly sensitive.  

