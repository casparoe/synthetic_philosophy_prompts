answer: |-
  That's a superb observation about the deep historical roots and the fascinating potential parallel to the modern paradox! Let's break down Article XIV and then explore that structural resonance.

  ### Deconstructing Article XIV: The Theological Argument in Plain Terms

  1.  **The Target:** The doctrine of "Works of Supererogation" as understood and practiced in late medieval Catholicism. Crucially, this wasn't just about *doing* extra good deeds, but about the belief that these deeds generated *merit* exceeding one's own needs for salvation, which could be stored in a "treasury" (merited primarily by Christ and the saints) and drawn upon by the Church (via indulgences) for the benefit of others still in purgatory.

  2.  **The Core Accusation: Arrogance and Impiety.** The Article argues that merely *teaching* the *category* of supererogatory works is inherently arrogant and impious. Why?
      *   **Claiming to Exceed God's Requirements:** To say you can do "more than bounden duty is required" implies:
          *   **Perfect Fulfillment of Duty:** It assumes you have *first* perfectly fulfilled *all* your existing obligations ("as much as they are bound to do"). The Reformers, steeped in Augustine and Paul (Romans 3:23, "all have sinned"), believed this was impossible due to original sin and human frailty. Claiming to have done this *itself* was seen as the height of spiritual pride, denying one's sinful nature.
          *   **Surpassing Divine Command:** It suggests God's commandments are insufficient or incomplete. If an action is truly good and pleasing to God, why wouldn't He command it? Claiming to do "more" implies you know better than God about what constitutes complete obedience or maximal devotion. This impugns the perfection and sufficiency of God's revealed will.
      *   **Contradicting Christ's Teaching:** The Article cites Luke 17:10: "So you also, when you have done all that you were commanded, say, ‘We are unprofitable servants; we have only done what was our duty.’" This is the theological hammer blow:
          *   **No Merit in Duty:** Even if one *could* hypothetically fulfill all commandments perfectly (which Reformers denied was possible post-Fall), Christ teaches that this *still* doesn't place God in your debt. You haven't "profited" God or earned merit; you've simply done the bare minimum required of a servant. Obedience is owed; it's not a surplus that creates credit.
          *   **Humility, Not Accounting:** The *only* proper posture after obedience is humility ("unprofitable servants"), not the accounting mentality inherent in claiming a surplus of merit ("we did more than required").
      *   **Undermining Grace and Christ's Sufficiency:** The doctrine implicitly suggests that human effort contributes surplus merit to salvation. For the Reformers, salvation was *sola gratia* (by grace alone) and *sola fide* (through faith alone), grounded entirely in Christ's *sola* sufficient merit. Human works, even extraordinary ones, are responses of gratitude, not contributions to a merit economy. Supererogation threatened this core doctrine by reintroducing the idea of human merit exceeding obligation.

  **In essence:** Teaching supererogation is arrogant because it assumes perfect fulfillment of duty (impossible) and claims to exceed God's perfect commands (impious). It's impious because it contradicts Christ's explicit teaching that even perfect obedience earns no merit and demands humility, not claims of surplus. Fundamentally, it undermines the doctrines of human sinfulness, the sufficiency of God's command, the impossibility of human merit before God, and the all-sufficiency of Christ's atonement.

  ### The Structural Parallel: Reformers' Challenge vs. Secular "Paradox of Supererogation"

  Your students are remarkably perceptive. **Yes, there is a genuine and profound structural parallel, even though the underlying frameworks and motivations are different.**

  1.  **The Shared Core Structure:**
      *   **Premise 1:** There exists an action (A) that is morally better (Reformers: more pleasing to God; Secular: produces more good) than some alternative action (B) which is minimally required (duty).
      *   **Premise 2:** Moral duty/obligation (Reformers: God's commandments; Secular: moral requirements) is understood as demanding what is morally necessary/good.
      *   **Challenge:** If (A) is *better* than the required (B), and morality (or God) demands the good, **why isn't (A) *itself* required?** How can the *better* action be *optional*? This creates a tension:
          *   Reformers: If (A) is truly good/pleasing to God, it *must* fall under God's command (exhaustiveness of divine command/love owed). To say it's "extra" implies God didn't command it, casting doubt on its goodness or God's perfection.
          *   Secular: If (A) is truly morally better and achievable, why isn't it rationally/morally obligatory? How can it be permissible to choose the *lesser* good (B) when the *better* (A) is available? (This often draws on ideas of maximizing good or rational choice).

  2.  **Key Differences in Framing and Motivation:**
      *   **Source of Obligation:** Reformers: Divine command rooted in God's sovereign will and human creaturehood. Secular: Moral reasons, rational agency, consequences, social contracts, etc.
      *   **Conception of the "Good":** Reformers: Defined by God's will/character; intrinsically tied to obedience and love of God. Secular: Defined variably (e.g., utility, human flourishing, rights, virtue).
      *   **The Stakes:** Reformers: Salvation, the nature of grace, the authority of Scripture, the danger of pride. Secular: The coherence of moral concepts (duty, permission, goodness), moral demandingness, personal freedom vs. obligation.
      *   **The "Paradox" Target:** Reformers: Targeted the *very possibility* of the *category* of supererogation, seeing it as incoherent *within* their theological system (God's commands are exhaustive of true good works). Secular: Targets the *coherence* of supererogation within secular moral *theory* – how can "better" not imply "obligatory"?
      *   **Role of "Merit":** Reformers: Explicitly central (denying transferable surplus merit). Secular: Usually absent or transformed into concepts like "moral credit" or "praiseworthiness without requirement."

  3.  **Is it a Genuine Parallel?** Absolutely. Both arguments challenge the conceptual space for "optional goodness" by asserting a strong link between moral goodness (or divine pleasing-ness) and obligation. They both argue that if an act is truly superior in the relevant moral/divine dimension, its optionality becomes puzzling or contradictory.

  4.  **Have Secular Defenders Answered a Secularized Reformers' Challenge?** **Yes, this is a powerful and insightful way to frame it.** While Urmson, Heyd, Chisholm, et al., weren't consciously refuting the Thirty-Nine Articles, they were grappling with a problem that shares the *logical structure* of the Reformers' critique, transposed into a secular key:
      *   **The Challenge:** "If it's better, why isn't it required?" (Secularized from "If it's pleasing to God, why isn't it commanded?").
      *   **Defenses Developed (implicitly answering this structure):**
          *   **Limiting the Demands of Duty:** Argue that duty has inherent limits (e.g., based on rights, fairness, autonomy, reasonable expectation) that leave room for "beyond duty" acts. (Answers: Why isn't *everything* better required?).
          *   **Distinguishing Goodness from Obligation:** Argue that moral value and moral obligation are distinct concepts. An act can be very good (even best) without being strictly obligatory. (Answers: How can better not imply obligatory?).
          *   **Emphasizing Agent-Centric Features:** Focus on sacrifice, risk, personal cost, or lack of a specific obligation *to that particular person* to explain why an act, while supremely good, isn't demanded of *everyone* in *every* situation. (Answers: Why isn't this specific better act required?).
          *   **The Importance of the Optional:** Defend the moral significance of free generosity, heroic sacrifice, and non-coerced virtue that would be undermined if all good acts were obligatory.

  **Conclusion:**

  You've hit on something crucial. Article XIV's argument against supererogation isn't just a historical curiosity; it presents a fundamental *logical challenge* to the very coherence of "optional goodness" within a system that posits an authoritative source defining the good/required. The Reformers grounded this in divine sovereignty and human sinfulness. Secular ethicists encounter a structurally identical challenge when trying to reconcile the existence of "morally better" actions with a sufficiently demanding but non-maximizing conception of moral duty. Defenders of supererogation, from Urmson onwards, *have* effectively been developing responses to this secularized version of the challenge: they are arguing *why* and *how* "better" does not *necessarily* imply "obligatory," carving out conceptual space for the supererogatory that the Reformers, within their theological framework, found not only unnecessary but theologically dangerous and incoherent. Highlighting this deep structural parallel would be an excellent way to show your students the enduring power and difficulty of the concept of supererogation across vastly different intellectual landscapes.
