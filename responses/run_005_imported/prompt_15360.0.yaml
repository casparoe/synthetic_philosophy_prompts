  First, I should break down the Article's argument. The key points are the rejection of works beyond God's commandments as arrogant and impious. The user mentioned the Catholic treasury of merit as background, so I should connect that. The Article argues that claiming to do more than duty implies one isn't sinful, which contradicts the doctrine of original sin. Also, the "unprofitable servants" quote from Luke emphasizes that even perfect obedience doesn't earn merit; it's just duty. The arrogance comes from assuming one can exceed obligations, which undermines grace and Christ's sufficiency.

  Next, the structural parallel with the secular paradox. The user's students noticed a similarity. The secular paradox asks why a morally better act isn't obligatory. The Reformers argued that if something is good, it must be commanded by God. Both challenge the possibility of morally optional better acts. But the motivations differ: Reformers focused on theology (grace, sin, scripture), while secular debates focus on moral demandingness and rational choice. Still, the logical structure is similar—both question how "extra" works can exist without being obligatory.

  I should confirm if Urmson and later secular theorists are responding to a secularized version of the Reformers' challenge. While they don't frame it theologically, the underlying issue of optional better acts persists. Defenders like Heyd or Chisholm address why some good acts aren't duties, mirroring the need to define duty's limits. The structural parallel holds, even if the context shifted from divine command to moral theory.

