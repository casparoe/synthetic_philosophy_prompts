prompt: |-
  Funny timing: I'm teaching a graduate seminar on the philosophy of promising this term, and now I've actually got a live case in my own department instead of just thought experiments. Short version: our hiring committee had a candidate everyone loved, and back in Febuary our chair told her, over email, something like "the offer is basically finalized at this point, HR just needs to process it, so please don't accept anything else." Nothing was ever signed. She took it at her word anyway, turned down a competing tenure-track offer at another school, and told her current chair she was resigning effective this summer. Two weeks ago the dean's office froze the line because of a sudden budget shortfall, so there is no position to actually give her, and I think our chairs quietly hoping the whole situation just goes away on its own.

  I've been put on a small ad hoc committee that has to bring the dean a recommendation on what, if anything, the department owes this candidate, given that nothing was ever a legally binding contract. I don't want to show up with "well, it feels bad, so we should do something" -- I want to circulate an actual memo beforehand that recommends a concrete course of action (money, a standing offer for next cycle, whatever you think is defensible) with a rough timeframe attached, but that grounds the recommendation in a real answer to why an unwritten assurance like that generates any obligation in the first place. Is the source of the obligation the reliance we invited her to place on our word, some kind of convention about how hiring committees are understood to talk, something closer to Scanlon's assurance-based story, or does it actually matter that it was an institution and not a single person doing the "promising"? And please don't hand me the version that flatters us -- two people on this committee are going to argue, seriously, that a sincere apology is the entire extent of what we owe her, and the memo needs to engage that position honestly rather than wave it away.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're teaching a philosophy seminar on promising and now face a real-life case in their department. A job candidate was told the offer was finalized, turned down another job, and resigned from her current position, only for the position to be frozen due to budget cuts. The user needs to draft a memo recommending what the department owes her, despite no legal contract.

  First, I need to identify the core philosophical issues. The chair's email acted as an assurance, leading the candidate to rely on it. The key question is what moral obligations arise from this, even without legal binding. The user mentioned reliance, conventions, Scanlon's assurance-based theory, and institutional vs. individual responsibility. 

  The user’s explicit needs are a concrete recommendation grounded in ethical theory. But deeper, they want a defensible position that counters arguments minimizing their obligation. They mentioned colleagues who think a sincere apology is enough. So the memo must address that view head-on, using strong philosophical arguments.

  Looking at ethical theories, Scanlon’s Principle of Fidelity seems relevant. The assurance created expectations, and breaking it without justification harms the candidate. Reliance-based obligations are crucial too—the department invited her to depend on their word, leading to significant losses. Conventions in academia add weight; job offers at this stage imply commitment. 

  The institutional aspect matters. The chair represented the department, so the obligation is institutional, not just personal. This strengthens the duty beyond individual promises. The harm done is severe—loss of tenure-track position, career disruption, reputational damage. 

  Considering recommendations: financial compensation seems necessary to cover her losses. A standing offer is also important but insufficient alone due to uncertainty. Non-monetary support like references and networking can help mitigate harm. 

  Anticipating objections, the "just apology" view ignores the tangible harm caused. Philosophical principles show reliance and harm create obligations beyond apologies. The department must restore her position as much as possible, which requires concrete actions. 

  Balancing practicality and ethics, the memo should propose immediate compensation while planning for future positions. Highlighting the institutional responsibility and the precedent it sets for departmental integrity is key. The user needs to present this as both ethically sound and pragmatically necessary to maintain trust in the hiring process.
answer: |-
  Here’s a structured framework for your memo, grounded in philosophical principles and designed to counter minimalist objections. It balances ethical rigor with institutional pragmatism:

  ### **Core Ethical Obligation: Reliance + Assurance**
  The obligation arises from **conjoined principles of invited reliance and Scanlonian assurance**:
  1.  **Invited Reliance (Fried, Raz):** By stating the offer was "basically finalized" and instructing her to reject alternatives, the department *deliberately induced action* with foreseeable high-stakes consequences (turning down a tenure-track offer, resigning current position). This creates a duty to prevent harm flowing directly from that invitation.
  2.  **Assurance (Scanlon, *What We Owe to Each Other*):** The chair’s communication functioned as an *assurance* ("HR just needs to process it"), creating a legitimate expectation that allows planning (Principle F, §4.3). Breaking assurances without compelling justification violates the duty not to manipulate others' reliance on our word.
  3.  **Conventional Authority:** In academic hiring contexts, a chair’s email at this stage *conventionally signifies institutional intent*. Candidates reasonably interpret such communications as near-final offers barring unforeseen disasters.

  **Countering the "Sincere Apology Suffices" Position:**
  *   **Harm Principle:** An apology addresses the *insult* (broken trust) but not the *material harm* caused by invited reliance (lost job, financial instability, reputational damage with her former institution).
  *   **Corrective Justice:** When one party’s voluntary action causes foreseeable detriment to another, mere regret is insufficient. The harm must be *mitigated* to restore equity.
  *   **Institutional vs. Personal:** An individual might absorb the consequences of a broken promise; an institution has greater capacity/responsibility to redress systemic failures.

  ### **Why Institutional Identity Matters**
  *   **Agency & Representation:** The chair acted *as an institutional agent*, not a private individual. The candidate relied on the *department/university's* word, not a personal favor. Institutional promises carry heightened weight due to formalized processes and power asymmetry.
  *   **Precedent & Trust:** Failing to redress this undermines trust in the department’s hiring integrity, damaging future recruitment. ("Why believe their chair next time?")

  ### **Concrete Recommendations & Justification**
  1.  **Immediate Financial Compensation ("Reliance Damages"):**
      *   **What:** A payment equivalent to 1 year's salary (at the offered rank) OR the difference between her current salary and the lost competing offer's salary for 1-2 years, whichever is higher. *Include moving cost reimbursement.*
      *   **Why:** Directly compensates for quantifiable losses *caused by reliance* (foregone salary, relocation costs). This is the minimum to restore her to the position she *would have been in* had she not relied on our assurance. Grounded in corrective justice.
      *   **Timeframe:** Within 60 days.

  2.  **Priority Consideration in Next Hiring Cycle:**
      *   **What:** A *written, dean-approved guarantee* that she will be offered the next available TT position in her field within the department, without requiring a full new search, contingent *only* on standard HR approvals (not discretionary "fit" reassessments). If no line opens within 3 years, a significant financial settlement (e.g., 1 year's salary) is triggered.
      *   **Why:** Addresses the lost *opportunity* (the tenure-track position itself). A mere "consideration" is insufficient; it must be a near-automatic offer to fulfill the original intent and compensate for career disruption. Grounded in fulfilling the assurance as nearly as possible.
      *   **Timeframe:** Guarantee issued within 30 days; position offered at next opening.

  3.  **Non-Monetary Support:**
      *   **What:** Strong, detailed letters of explanation/support from the Chair and Dean to her former institution and any future employers; active assistance in networking; access to department resources (library, seminars) for 1-2 years.
      *   **Why:** Mitigates reputational harm and provides tangible support for her immediate career recovery. Grounded in the duty to minimize harm flowing from our actions.

  ### **Addressing Likely Counterarguments in the Memo**
  *   **"No Legal Contract!":** "While no *legal* contract existed, the *ethical* obligation arises from invited, detrimental reliance on an institutional assurance. Legal permissibility does not imply ethical adequacy."
  *   **"The Dean Froze the Line - We Can't Pay!":** "The department/university invited the reliance; the institution as a whole bears the cost of its administrative failure. Funds can be sourced from central reserves, future budget allocations, or discretionary funds. The inability to fulfill the *original* offer doesn't absolve the duty to redress the *harm caused by inducing reliance on it*."
  *   **"She Was Naive to Rely on an Email!":** "Within academic hiring norms, a chair's explicit assurance at this stage is universally understood as binding barring extreme exigencies. Her reliance was reasonable and *specifically invited* by our instruction to reject other offers. Blaming the victim is ethically untenable."
  *   **"An Apology is Enough - It Wasn't Malicious!":** "Intent is irrelevant to the harm caused. A sincere apology addresses the broken trust (insult) but not the material and professional damage (harm). Corrective justice requires redress proportional to the detriment suffered due to our actions."

  ### **Memo Conclusion**
  **Grounding:** Our obligation stems from the severe, foreseeable harm caused by the candidate's reasonable reliance on an institutional assurance given with the authority of the Chair, compounded by our instruction that directly induced detrimental actions.  
  **Core Recommendation:** We owe compensation for quantifiable losses *and* a substantive effort to restore the lost opportunity. Anything less fails the tests of corrective justice, Scanlonian fidelity, and institutional integrity.  
  **Urgency:** The harm is ongoing. Delaying redress compounds the injury and exposes the university to reputational damage and potential legal action (promissory estoppel claims, while uncertain, are plausible and costly).

  This approach provides a philosophically defensible, actionable path forward that centers the harm done and the department’s active role in creating the situation. It meets minimal ethical standards while offering a chance for the institution to demonstrate accountability.
