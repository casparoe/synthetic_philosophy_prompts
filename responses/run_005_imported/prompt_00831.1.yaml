  The user’s main question is whether Davidson would say LLMs have real understanding. They mention arguing with colleagues about whether LLMs are just advanced autocomplete. Their friend, a philosophy PhD, sent them Davidson's work, so they want a rigorous application of his framework.

  Breaking it down: Radical interpretation on an LLM. Davidson emphasized assent/dissent in observable situations. LLMs don't interact with the world; they generate text based on patterns. So, no assent/dissent in shared contexts. That's a problem. Without that, can we even apply radical interpretation? Probably not, because there's no behavior tied to real-world events.

  Then, triangulation. LLMs are trained on human text, which comes from human triangulation. But is that secondhand? Davidson might say it's parasitic on human meaning, not original. The model itself doesn't engage in mutual reactions. So, no real triangulation happening in the LLM's operation.

