  About LLMs: they're fascinating but orthogonal to Gödel's argument. Gödel was discussing formal systems that can prove their own consistency - LLMs don't work that way. Their "understanding" is statistical, not deductive. I should emphasize this mismatch while acknowledging why people force the comparison (e.g. IMO performance creating illusion of insight).

  The user wants honesty about uncertainties. I'll note how Gödel might view LLMs as evidence for the second horn (minds as machines) since they perform sophisticated tasks while being clearly fallible and non-introspective. But crucially, their architecture differs fundamentally from the formal systems Gödel referenced.

