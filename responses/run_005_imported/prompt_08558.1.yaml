answer: |-
  ### Concrete Example Illustrating Harsanyi's Aggregation Theorem and Ex-Post Fairness

  Consider a society with **two identical individuals**, Alice and Bob. Both have the same von Neumann-Morgenstern (vNM) utility function over wealth: \( u(w) = \sqrt{w} \), reflecting risk aversion (concave utility). A Harsanyi-style planner maximizes the **sum of expected utilities** with equal weights (i.e., utilitarian welfare). The planner must choose between two policies, A and B, in a world with **three equally likely states** (probability \( \frac{1}{3} \) each). The key is that both policies yield the **same ex-ante social welfare** but lead to **starkly different ex-post fairness outcomes**.

  #### Policies
  - **Policy A**: "Variable Distribution"  
    - State 1: Alice gets $4$, Bob gets $0$.  
    - State 2: Alice gets $0$, Bob gets $4$.  
    - State 3: Alice gets $1$, Bob gets $1$.  

  - **Policy B**: "Constant Equality"  
    - All states: Alice gets $1$, Bob gets $1$.  

  ---

  #### Ex-Ante Analysis (Before Uncertainty Resolves)
  First, compute the **expected utility** for each individual under both policies:  
  - **Policy A (Alice)**:  
    \[
    \frac{1}{3} \cdot \sqrt{4} + \frac{1}{3} \cdot \sqrt{0} + \frac{1}{3} \cdot \sqrt{1} = \frac{1}{3}(2) + \frac{1}{3}(0) + \frac{1}{3}(1) = 1
    \]
  - **Policy A (Bob)**:  
    \[
    \frac{1}{3} \cdot \sqrt{0} + \frac{1}{3} \cdot \sqrt{4} + \frac{1}{3} \cdot \sqrt{1} = \frac{1}{3}(0) + \frac{1}{3}(2) + \frac{1}{3}(1) = 1
    \]
  - **Policy B (Alice or Bob)**:  
    \[
    \sqrt{1} = 1 \quad (\text{in all states}) \implies \text{Expected utility} = 1
    \]

  **Social welfare** (sum of expected utilities) is identical for both policies:  
  \[
  \text{Policy A: } 1 + 1 = 2, \quad \text{Policy B: } 1 + 1 = 2.
  \]  
  The Harsanyi planner is **indifferent** between A and B since both maximize the weighted sum of expected utilities.

  ---

  #### Ex-Post Analysis (After Uncertainty Resolves)
  Now, examine the outcomes in each state:  
  - **Policy A**:  
    - **State 1**: Alice has wealth $4$ (utility $2$), Bob has $0$ (utility $0$).  
      → **Inequality**: Alice has everything, Bob has nothing.  
    - **State 2**: Alice has $0$ (utility $0$), Bob has $4$ (utility $2$).  
      → **Inequality**: Bob has everything, Alice has nothing.  
    - **State 3**: Both have $1$ (utility $1$).  
      → **Equality**.  

  - **Policy B**:  
    - **All states**: Both have $1$ (utility $1$).  
      → **Perfect equality always**.  

  ---

  #### Fairness Evaluation
  - **Ex-post fairness in Policy A**:  
    - In **two-thirds of states** (States 1 and 2), outcomes are **highly unequal**—one person has 4× the wealth of the other, and the "loser" gets nothing.  
    - Only in State 3 is there equality.  
    - Most people would deem this **unfair** after the dice land, as luck determines who gets nothing.  

  - **Ex-post fairness in Policy B**:  
    - **Always equal** outcomes, regardless of the state.  
    - Widely considered **fair** ex-post, as neither individual faces exploitation or luck-based disadvantage.  

  #### Why This Meets the Criteria
  1. **Same vNM utility function**: Both Alice and Bob have \( u(w) = \sqrt{w} \).  
  2. **Not a coin-flip or interpersonal comparability issue**:  
     - The example uses three states (not two) and avoids a single indivisible good.  
     - The problem isn’t interpersonal utility comparisons (utilities are identical and symmetric).  
  3. **Harsanyi planner’s indifference**:  
     - Both policies yield identical ex-ante social welfare (2.0), so the planner is indifferent.  
     - The indifference arises solely from respecting ex-ante preferences over lotteries, ignoring ex-post distribution.  

  #### Key Insight
  Harsanyi’s theorem only requires that social preferences over **lotteries** respect individual vNM utilities ex-ante. It does not account for **ex-post fairness**, as seen here:  
  - Policy A creates high inequality in most realizations, while Policy B guarantees equality.  
  - Yet, because both policies offer the same ex-ante expected utility to each individual, the Harsanyi planner cannot distinguish them—even though society likely would after the fact.  

  This illustrates a core limitation of Harsanyi utilitarianism: it **cannot prioritize ex-post equality** when ex-ante expectations are identical. Real-world notions of fairness often require more than just ex-ante optimality.
