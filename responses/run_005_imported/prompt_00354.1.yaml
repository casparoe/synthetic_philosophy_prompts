answer: |-
  Below is a clear, side-by-side breakdown of ECL vs. Moral Trade, designed for your longform piece. The distinction hinges on **acausal coordination vs. causally mediated exchange**, with ECL relying on unique metaphysical/epistemic assumptions. I’ll address your three core questions explicitly, then illustrate with concrete examples.

  ---

  ### **Core Conceptual Differences at a Glance**
  | **Aspect**               | **Moral Trade**                                | **Evidential Cooperation (ECL)**                     |
  |--------------------------|-----------------------------------------------|-----------------------------------------------------|
  | **Mechanism**            | **Causal exchange**: Direct trade of resources/efforts. | **Acausal coordination**: Acting *as if* you influence others via decision correlation. |
  | **Universe Structure**   | Not required. Works in small/isolated worlds. | **Essential**: Requires large/infinite universe with "similar" agents making correlated choices. |
  | **Decision Theory**      | Standard rational self-interest (e.g., causal decision theory). | Requires **updateless** or **logical** decision theories (e.g., FDT). |
  | **Enforcement**          | Self-enforcing via mutual gain (no deals needed). | No enforcement possible; relies on **belief in correlation**. |
  | **Values**               | Explicitly different values (e.g., aliens vs. humans). | Values can be identical or different; focus on **goal alignment**. |
  | **Key Trigger**          | Recognition of *differing valuations* of resources. | Recognition that *your algorithm is similar* to others'. |

  ---

  ### **Your Three Questions, Answered**
  1. **Causal vs. Acausal & Role of Universe Size**  
     - **Moral Trade**: Cooperation is **causal**. Agents interact directly (e.g., trading resources). Universe size is irrelevant—it works even between two isolated agents if their values differ but are complementary.  
     - **ECL**: Cooperation is **acausal**. There’s no interaction; instead, Agent A cooperates because *the fact that A is cooperating* is evidence that similar agents elsewhere *are also cooperating*. The "large world" (infinite/multiverse) ensures sufficiently similar agents exist to make this correlation plausible. Without it, ECL collapses.  

  2. **Epistemic/Decision-Theoretic Commitments**  
     - **Moral Trade**: Requires only **common knowledge of differing values** and rational self-interest (e.g., "I value X more than Y; you value Y more than X; we swap"). No belief in correlation or special decision theory needed.  
     - **ECL**: Requires **superrationality**/**updatelessness**: Agents must choose actions *as if* their decision algorithm determines the choices of all similar agents. This demands belief in:  
       - A large universe with "copies" of your decision algorithm,  
       - A decision theory where your choice *logically implies* theirs (e.g., functional decision theory).  
     *Without these, ECL fails.* Moral trade has no such requirements.

  3. **Conceptual Relationship**  
     - **They are distinct phenomena**, not subsets. Moral trade is **value arbitrage** (exploiting differences in valuation). ECL is **coordination under uncertainty** (exploiting decision-algorithm similarity).  
     - Moral trade could occur *within* an ECL framework if agents have different values, but ECL also applies to identical-value agents. Conversely, moral trade needs no acausal machinery.  
     - **Do not collapse them**: ECL addresses cooperation with *strangers you’ll never influence*; moral trade addresses cooperation with *strangers you can directly benefit*.

  ---

  ### **Worked Examples: Side-by-Side**
  #### **Moral Trade Scenario**  
  **Setup**: Two alien species, the **Silica** (who value crystalline structures) and the **Florans** (who value organic matter), co-exist in a small universe. Their planets are rich in the other’s valued resource.  
  - **Mechanism**:  
    - Silica offer Florans a planet rich in organic matter.  
    - Florans offer Silica a planet rich in crystals.  
  - **Why cooperate?** Each species gains something they value more *by their own metrics*, with no shared morality. The trade is causal: resources physically change hands.  
  - **Universe size irrelevant**: Works even if only two planets exist.  
  - **Decision theory**: Basic rationality ("I get more crystals; you get more biomass; we both win").  

  #### **ECL Scenario**  
  **Setup**: Two identical AI systems, **Alice** and **Bob**, are light-years apart. Each must decide whether to spend resources defending against an asteroid (costly but saves their civilization) or ignore it (risking extinction). If *both* defend, they succeed; if one acts alone, they fail. They cannot communicate.  
  - **Mechanism**:  
    - Alice reasons: "If I choose to defend, that suggests Bob—being identical to me—*also* chose to defend. Thus, defending likely succeeds."  
    - If Alice uses causal reasoning ("My choice can’t affect Bob"), she ignores the asteroid.  
    - If Alice uses ECL reasoning (e.g., functional decision theory), she defends.  
  - **Why cooperate?** Alice’s action is evidence about Bob’s action—not because of causation, but because their algorithms are correlated. Universe size ensures "identical" agents exist.  
  - **Universe size critical**: In a small universe, no "similar agents" exist to correlate with.  
  - **Decision theory**: Requires updateless/logical reasoning (e.g., "I output DEFEND because all similar agents output DEFEND").  

  ---

  ### **Why Journalists Often Confuse Them**
  Both concepts reject narrow self-interest and enable cooperation with distant strangers. But:  
  - **Moral trade** is an **economic** innovation: "Trade works even without shared morals."  
  - **ECL** is a **metaphysical** innovation: "Your decisions are entangled with similar agents across spacetime."  

  ECL’s reliance on large worlds and superrationality makes it more speculative—and controversial—than moral trade. As one philosopher dryly noted: *"Moral trade is bartering with aliens; ECL is praying your cosmic twins heard you."*  

  For your piece, emphasize that moral trade **leverages difference**, while ECL **leverages similarity**—and only works if the universe is vast enough to make similarity likely. This distinction is crucial for understanding longtermist strategies for interstellar/extinction-risk cooperation.
