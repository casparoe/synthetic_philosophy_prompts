answer: |-
  **MEMORANDUM**  
  **TO:** Search Methodology Working Group  
  **FROM:** [Your Name/Title], Bayesian Search Analyst  
  **SUBJECT:** Standard Operating Procedure for Conditional Witness Tips  
  **DATE:** October 26, 2023  

  ---

  ### **1. Background**  
  During the recent tabletop exercise, our team encountered a conditional witness tip (e.g., *"If Subject passed the fork, they likely took the ridge trail"*). This sparked debate between two Bayesian updating methods:  
  - **Jeffrey Conditionalization (JC)**: Directly updates probabilities *only* within the scope of the conditional.  
  - **Minimum Cross-Entropy (MCE)**: Updates the entire grid to minimize divergence from the prior while satisfying the condition.  

  The [Judy Benjamin problem](https://plato.stanford.edu/entries/learning-formal/#JudyBenjProb) (van Fraassen, 1981) demonstrates that MCE can unintentionally shift probability mass to regions *unmentioned* in the tip (e.g., reducing P(Blue) when only Red territory was referenced). While philosophically significant, this behavior risks misallocating search resources in our context.  

  ---  

  ### **2. Recommended Procedure: Jeffrey Conditionalization**  
  **Standard Method for Conditional Tips:**  
  > **"When a conditional tip is received (e.g., 'If A, then likely B'), apply Jeffrey Conditionalization to update *only* the probabilities within the scenario defined by the antecedent (A). Probabilities outside A remain unchanged."**  

  #### **Steps:**  
  1. **Isolate the Antecedent (A)**:  
     - Identify all grid cells where condition *A* applies (e.g., "past the fork").  
     - Compute current total probability of *A*: `P(A) = Σ P(cell) for all cells in A`.  

  2. **Apply the Conditional Likelihood**:  
     - Use the tip (e.g., "if A, then P(B|A) = 0.8") to update probabilities *within A*.  
     - For cells in *A*:  
       ```
       P_new(cell) = P_old(cell) × [P(B|A) / P_old(B|A)]   if cell implies B,  
       P_new(cell) = P_old(cell) × [(1 - P(B|A)) / (1 - P_old(B|A))] otherwise.  
       ```  
     - **Crucially**: Cells *outside A* are unchanged.  

  3. **Renormalize within A**:  
     - Rescale updated cells in *A* so `Σ P_new(cell) = P_old(A)`.  

  #### **Why Jeffrey Conditionalization?**  
  - **Scope Respects Intel**: Only areas explicitly referenced in the tip are updated.  
  - **No Unjustified Shifts**: Avoids Judy Benjamin-style leakage (e.g., reducing P(Valley) when only Ridge/Creek were mentioned).  
  - **Commander Transparency**: Easier to explain: "This tip only affects regions past the fork; elsewhere, our prior assessment stands."  
  - **Operational Safety**: Prevents under-searching high-prior-probability areas unrealted to the tip.  

  ---  

  ### **3. When to Consider Minimum Cross-Entropy (and How to Compensate)**  
  #### **Why Smart People Reach for MCE**  
  MCE is not "stupid"—it has principled advantages in other contexts:  
  - **Maximal Prior Preservation**: MCE minimizes changes to the prior, which is ideal if the prior is highly reliable.  
  - **Handling Ambiguity**: If the tip’s phrasing is vague (e.g., "likely" without quantified probabilities), MCE’s entropy-maximizing nature avoids overconfidence.  
  - **Computational Appeal**: Automated systems can implement MCE efficiently for complex dependencies.  

  #### **Decision Rule for MCE Use**  
  > **"Use Minimum Cross-Entropy *only* if:**  
  > - The tip implies a *global constraint* (e.g., 'Subject is fatigued' affecting all trails equally), **or**  
  > - Multiple interdependent conditionals arrive simultaneously, making JC intractable.  
  > **Always document MCE-induced probability shifts in unmentioned regions to the Search Commander."**  

  #### **Compensating for MCE Drawbacks**  
  If MCE is used:  
  - **Cross-Check Shifts**: Run JC in parallel; if MCE shifts probabilities >5% in areas outside the tip’s scope, flag it.  
  - **Anchor High-Prior Regions**: Manually lock probabilities of cells with P(cell) > 0.3 if unrelated to the tip.  
  - **Commander Briefing Template**:  
    > *"This tip about the ridge/creek trails also slightly reduced probability in the valley (from 15% to 12%) because the model assumes minimal updates elsewhere. We recommend maintaining valley coverage at prior levels pending further intel."*  

  ---  

  ### **4. SOP Summary**  
  | **Tip Phrasing**               | **Update Method**          | **Reporting Requirement** |  
  |-------------------------------|----------------------------|---------------------------|  
  | "If [A], then [B]"            | Jeffrey Conditionalization | None (scope obvious)      |  
  | "Subject likely [behavior]"   | MCE with anchors           | Document global shifts    |  
  | Vague/conflicting conditionals| MCE                        | Run JC comparison         |  

  ---  

  ### **5. Why This Works for SAR**  
  Conditional tips in SAR are **localized intel**, not global reweightings. Jeffrey Conditionalization respects this locality, ensuring:  
  - Resources follow actionable intelligence without phantom redistribution.  
  - Commanders retain trust in the probability map’s narrative ("fork areas updated; elsewhere unchanged").  
  - We avoid Judy Benjamin’s pitfall: *No probability mass moved where the tip is silent*.  

  MCE remains a tool for edge cases, but its strength—preserving priors—becomes a liability when priors contradict the tip’s localized intent. By privileging **scope integrity** over **prior fidelity**, we align with our mandate: translating witness words into targeted search action.  

  **APPROVED:**  
  [Signature]  
  **NEXT REVIEW:** 6 months or post-mission
