  Why would people prefer min cross-entropy? It preserves as much prior information as possible, which is useful when the prior is reliable. It's also computationally efficient and avoids making arbitrary changes. But in SAR, conditional tips are specific, and altering unrelated areas could misallocate resources. For instance, if the tip is about ridge vs. creek trails, updating probabilities in a different valley doesn't make sense and could confuse commanders.

