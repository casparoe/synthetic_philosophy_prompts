answer: |-
  You've nailed a profound crack in Goodman's seemingly airtight system. Let's dissect these forgeries mechanically to see what *was* actually faked and whether Goodman's framework survives:

  **The Core Mechanics of the Forgeries:**
  1.  **The Text Itself (Allographic Core):** Goodman is technically correct about the text sequence. Ireland's *Vortigern* script or Macpherson's *Ossian* poems, *as sequences of words*, are allographic. A perfect typeset copy today is an authentic instance of *that text*. The *linguistic structure* wasn't faked; it was created by the forger.
  2.  **The Artifact (Autographic Forgery):** Ireland didn't *just* write a play; he meticulously forged *physical documents* – aged paper, simulated Shakespearean handwriting, fake provenance seals. Macpherson presented manuscripts (whose origins were dubious or fabricated). **Here, the *physical artifact* was absolutely autographic.** A perfect copy of Ireland's forged folio *would* be a forgery, precisely because its history (manufactured deception) is crucial to its intended identity *as a Shakespeare relic*.
  3.  **The Attribution (Paratextual & Contextual Fabrication):** This is the critical layer Goodman arguably underestimates. The forgers fabricated:
      *   **Authorship:** Falsely claiming the text originated with Shakespeare or Ossian.
      *   **Provenance:** Inventing a history of discovery (Ireland's "trunk," Macpherson's Gaelic sources).
      *   **Historical Context:** Embedding the text within a false narrative (a "lost" Shakespeare play, an ancient Gaelic epic tradition).
  4.  **The Interpretive Frame:** This is the *real* damage. Literary meaning isn't generated solely by syntax. Readers interpret texts *through a lens shaped by authorship, historical context, and genre expectations.* The forgers hijacked this frame:
      *   **Ireland:** Audiences approached *Vortigern* expecting Shakespearean genius. They interpreted awkward lines as charming quirks or profound depths *because* they believed Shakespeare wrote it. When the frame collapsed, the same lines became evidence of incompetence.
      *   **Macpherson:** Readers interpreted the bombastic, melancholic style as evidence of primitive sublimity, a window into a lost heroic age. Revealed as 18th-century fabrication, the style shifted to pretentious artifice. The *words* didn't change; the *meaning assigned to them* did, based on the fabricated context.

  **What Was Actually Being Faked?**
  *   **Not the allographic work itself** (the sequence of words).
  *   **The autographic artifact(s)** purporting to be the original manuscript/witness.
  *   **The historical and authorial context** framing the work's creation and reception.
  *   **The interpretive key** through which the text is read and evaluated.

  **Does Goodman's Framework Survive?**
  It survives, but **needs significant refinement and contextual understanding**:

  1.  **Distinguishing Work from Instance/Artifact:** Goodman is correct that *the literary work* (defined syntactically) is allographic. However, *a specific instance or presentation of that work* (especially one claiming historical authenticity) can have autographic elements. A first edition, a manuscript, a copy *presented as having a specific history* can be forged. Ireland forged *an instance* (the physical manuscript) *and* its claimed history.
  2.  **Acknowledging the "Work-Plus":** Literary works rarely exist as *pure* syntax in the real world. They are encountered bundled with **paratext** (title pages, prefaces, attributions) and **context** (marketing, criticism, historical placement). Forgers fake the paratext and context *essential to the intended reception of the work*. Goodman focuses on the core identity of the work; forgeries attack the supporting structure necessary for its *intended meaning and value*.
  3.  **The Role of Intent & Reception:** Goodman's system is largely ontological (what *is* the work?). Forgeries highlight the **pragmatic** dimension – the *intention* to deceive about origin and the *effect* this has on reception. The "standing" lost wasn't the work's syntactic identity, but its *cultural capital* derived from false attribution.
  4.  **Survival via Nuance:** The framework survives if we rigorously apply its distinctions:
      *   *Vortigern* (the text sequence) is allographic. *Ireland's forged manuscript* of *Vortigern* is autographic (a forgery). *"Shakespeare's Vortigern"* is a *different conceptual entity* than *"Ireland's Vortigern"* – not because the words differ, but because the claimed authorial history is part of the *description* of the purported work. The forgery creates a *false description* ("This text is by Shakespeare") attached to the actual text.

  **Conclusion & Real Revision:**
  Goodman's core distinction between autographic and allographic arts based on notation holds for the *essential identity* of the work. A painting's identity *is* its history; a text's identity *is* its sequence.

  However, **literary forgeries expose that the *value*, *meaning*, and *cultural function* of an allographic work are intensely dependent on elements *outside* the pure notation: authorship, provenance, and historical context.** These elements *can* be faked, and that fakery targets the *interpretive frame* and *cultural status* of the work, not its syntactic core.

  **Necessary Revision/Clarification:**
  1.  **Explicitly Separate Artifact from Work:** Clearly state that while the literary *work* is allographic, specific *instances* (especially unique historical artifacts like manuscripts) can have autographic aspects susceptible to forgery.
  2.  **Acknowledge the "Attributional Context":** Admit that the perceived identity and value of a literary work in the cultural sphere *includes* its authorship and provenance. A forgery creates a *false attributional context*. While this doesn't change the work's *syntactic identity*, it fundamentally changes *what the work is understood to be* in the world (e.g., "a newly discovered Shakespeare play" vs. "an 18th-century fake").
  3.  **Embrace Pragmatics:** Incorporate the role of authorial intent (real vs. faked) and reader reception shaped by attribution. The scandal of the forgery lies in the *deception* and its *effect* on meaning and value, proving that Goodman's purely syntactic definition, while ontologically sound, is insufficient to describe how literature *functions* culturally.

  **For the novelist:** Your instinct is correct. Goodman provides a crucial baseline, but literature lives in a messy world of history, authorship, and interpretation. Forgeries exploit the gap between the work's immutable syntax and the mutable story we tell about its origin. They fake the *narrative of creation*, and that narrative is powerful enough to make or break a work's reception, even if the words themselves remain unchanged. Goodman's framework needs this layer of cultural pragmatics laid over its formalist foundation.
