  So perhaps the answer lies in splitting "the work" from "the artifact." Goodman's allographic definition holds for the former, but the latter—the physical document or attributed origin—is absolutely autographic. Ireland forged an artifact (a fake folio) while creating an allographic work (the play text). The fraud targeted the artifact's history, not the work's identity. 

