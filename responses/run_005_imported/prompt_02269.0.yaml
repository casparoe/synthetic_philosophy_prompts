answer: |-
  You've hit on a fascinating and often misunderstood tension in medieval political thought – and your instincts about why it didn't translate into widespread assassinations are spot on. Let's break down Aquinas's actual position, the context, and why things played out as they did:

  1.  **What Aquinas *Actually* Said (The Nuance is Crucial):**
      *   **Source:** His main discussions are in *De Regno (On Kingship)* and *Summa Theologiae* (II-II, Q. 42, Art. 2 - *Whether Sedition is Always a Mortal Sin?* and the context of Question 104 on Obedience).
      *   **Condemnation of Rebellion:** Aquinas absolutely condemned *sedition* (rebellion against a *just* ruler) and *private individuals* taking up arms against authority on their own initiative. This aligns perfectly with Romans 13 ("Let every person be subject to the governing authorities") and your grandma's teaching.
      *   **Tyranny Defined:** For Aquinas, a tyrant wasn't just a "bad" or unpopular ruler. A tyrant actively works *against the common good*, ruling for their own selfish gain, oppressing subjects unjustly, and subverting the very purpose of authority (which is to serve the welfare of the community). Think usurpers who seize power illegitimately or legitimate rulers who fundamentally betray their mandate.
      *   **Resistance is Permissible, BUT...** Here's the key:
          *   **Public Authority, Not Private Individuals:** Aquinas argued that it wasn't the job of *private individuals* or the *mob* to kill the tyrant. This was seen as dangerously anarchic. Instead, the responsibility fell to *public authority*.
          *   **Who is "Public Authority"?** This is the critical ambiguity. He likely meant:
              *   **Inferior Magistrates/Officials:** Lesser nobles, judges, city councils, etc., who held legitimate public office *under* the king but had a duty to the common good *above* blind obedience to a superior who had become tyrannical.
              *   **The "People" as a Corporate Body:** Not random peasants, but the community acting in a structured, representative way (like through estates, parliaments, or elected leaders), almost like a constitutional mechanism. Think more "lawful deposition" than "back-alley stabbing."
          *   **Last Resort:** Tyrannicide was presented as a *last resort* only when all other peaceful or legal means of redress or removal had been exhausted, and when the tyranny was so severe that enduring it was worse than the potential chaos of removing the tyrant by force.
          *   **Focus on Removal, Not Necessarily Killing:** While killing the tyrant *was* presented as a possible outcome (especially if they resisted lawful deposition), the primary goal Aquinas discusses is the *removal* of the tyrant from power. Killing might be a consequence of that removal if they fight it, but it's not the *aim*.

  2.  **Why Didn't Peasants Start Assassinating Lords?**
      *   **Not a License for Vigilantism:** Aquinas's framework *explicitly forbade* private individuals from acting alone. A peasant acting on their own would be committing sedition/murder, not lawful tyrannicide.
      *   **Hierarchy and Legitimacy:** Medieval society was intensely hierarchical. The idea that a peasant had the *authority* or the *right* to judge and execute a lord (even a bad one) was utterly alien to the prevailing worldview. Authority flowed down, not up. Judgment belonged to superiors or peers.
      *   **Fear of Chaos:** The primary fear was *anarchy* – the breakdown of all order. Killing a ruler, even a bad one, risked civil war, invasion, or simply replacing one tyrant with a worse one. Aquinas himself emphasized this danger. Peasants knew rebellion usually ended in brutal suppression.
      *   **Practical Impossibility & Retribution:** Assassinating a well-guarded lord or king was incredibly difficult and risky. Failure meant horrific torture and death for the assassin *and* likely their family/community. Success might just lead to another noble taking over who was no better.
      *   **Divine Right & Mystery:** While not fully developed in Aquinas's time, ideas that rulers were ordained by God (even bad ones as punishment) were powerful deterrents. Enduring suffering was often seen as spiritually meritorious.

  3.  **Why Isn't It a Bigger Deal in Modern Catholic Thought/Resistance?**
      *   **Emphasis on Lawful Means:** Modern Catholic social teaching (drawing on Aquinas but evolving) strongly emphasizes *peaceful* and *legal* means of resistance: protest, civil disobedience, working through institutions, building alternative structures of civil society. The Catechism (CCC 2243) explicitly references the right to resist oppression but frames it cautiously, prioritizing non-violence and stressing that armed resistance is only conceivable against "manifest, longstanding tyranny" as an *absolute last resort*.
      *   **Shift to Constitutional Governance:** In democratic or constitutional systems, mechanisms exist for removing leaders (elections, impeachment, courts). Aquinas's "public authority" is now often seen as these constitutional processes. Resorting to violence is seen as undermining the very rule of law.
      *   **Sanctity of Life:** The Church's strong emphasis on the sanctity of human life makes endorsing killing, even of tyrants, extremely problematic and a last-resort exception, not a rule.
      *   **Focus on the Core Principle, Not the Extreme Case:** Aquinas's core political message is that *authority exists to serve the common good*. Modern Catholic thought emphasizes building just societies, holding leaders accountable through democratic means, and defending human rights – this is the positive application of his principle. Tyrannicide is the dark, exceptional conclusion drawn only when every other system fails catastrophically. It's not the main takeaway.
      *   **Historical Baggage:** The idea was sometimes misused (e.g., during the French Wars of Religion for political assassinations). The Church became wary of interpretations that could justify revolutionary violence against *any* established order.
      *   **Locke & Enlightenment Takeover:** The philosophical justification for overthrowing oppressive government became more associated with thinkers like John Locke ("right of revolution") during the Enlightenment, influencing the American and French Revolutions. Catholic thought, while sharing the underlying concern for justice, often positioned itself more cautiously against revolutionary fervor.

  **In Summary:**

  *   Aquinas **did justify resistance** to tyranny, potentially including **deposition and even killing**.
  *   However, he **rigorously restricted** this: **Only public authority** (not private individuals) could act, as a **last resort**, against a ruler who was a **true tyrant** (not just bad), and only when the **common good demanded it** and **worse chaos wasn't likely**.
  *   This **didn't translate to peasant assassinations** because of medieval hierarchy, fear of anarchy, the illegitimacy of private action, practical dangers, and prevailing theological views on suffering and authority.
  *   It's **not central to modern Catholic resistance** because the Church emphasizes non-violence, lawful constitutional means, the sanctity of life, and building positive justice. Tyrannicide is seen as an extreme, tragic exception to the principle that authority must serve the common good, not a standard tool.

  You're right that it's a fascinating and somewhat shocking idea coming from Aquinas. But understanding the strict limitations he placed on it, and the historical and theological context, explains why it wasn't a medieval call to arms for the oppressed masses and remains a highly qualified, rarely invoked principle in modern Catholic thought. The real legacy is the *principle* of the common good limiting authority, not the *method* of tyrannicide.
