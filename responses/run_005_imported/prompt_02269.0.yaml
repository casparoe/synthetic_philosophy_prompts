  First, I need to verify Aquinas's actual position. The user mentions "De Regno" and "Summa Theologiae." I recall that in "De Regno," Aquinas discusses tyranny but doesn't explicitly endorse tyrannicide. In the "Summa," Question 42, he addresses resistance. Aquinas is cautious, prioritizing lawful means over vigilante action. He suggests that a public authority, not individuals, should handle deposing a tyrant. The user might be overinterpreting Aquinas as endorsing individual action.

  Next, why no widespread tyrannicide? Medieval society had hierarchies. Peasants weren't considered legitimate actors in political matters. The Church and nobility held that power. Also, Aquinas's conditions for resistance were strict—tyranny had to be extreme and public. Fear of chaos and worse outcomes likely deterred people. Plus, divine right theories and practical dangers (like retaliation) made assassination risky.

  The user also questions why modern Catholic thinkers don't emphasize this. Aquinas's framework is about structured resistance, not individual violence. Contemporary Catholic teaching, like in the Catechism, stresses lawful resistance and the common good. Figures like John Locke or Enlightenment thinkers are more cited for revolution. The Church's stance on life and order makes them cautious about endorsing violence.

