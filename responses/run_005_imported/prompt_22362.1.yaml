  ## MEMORANDUM

  **TO:** Lifelong Learning Institute Curriculum Committee  
  **FROM:** [Your Name/Committee Member]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for Course Proposal: "Turing and the Mind" (Focus on Session 3: The ESP Argument)  

  ### 1. Background
  The proposal for "Turing and the Mind" by our colleague (Retired Classics Teacher) presents a valuable opportunity to explore Alan Turing's seminal 1950 paper beyond its popularized elements. Session 3 specifically addresses Turing's serious engagement with "The Argument from Extra-Sensory Perception" (Objection 9), where he explicitly cites "overwhelming" statistical evidence for telepathy and proposes a "telepathy-proof room" as a necessary design modification for the imitation game. This reflects the genuine intellectual milieu of mid-20th century Cambridge philosophy, where figures like C.D. Broad engaged seriously with psychical research.

  ### 2. Recommendation
  **Approve the course "Turing and the Mind" as proposed, including Session 3 on the ESP argument, WITH THE FOLLOWING SPECIFIC MODIFICATIONS AND FRAMING:**  

  ### 3. Reasoning for Approval with Modifications
  *   **Historical & Intellectual Integrity:** Omitting or drastically minimizing Session 3 distorts Turing's actual argument and intellectual context. His treatment of ESP *wasn't* a joke; it was a documented facet of his philosophical landscape. To teach Turing's paper honestly requires grappling with this uncomfortable aspect. Ignoring it sanitizes history and does a disservice to learners seeking a genuine understanding.
  *   **Pedagogical Value:** Confronting why a brilliant mind like Turing took this seriously is inherently stimulating. It prompts critical questions about: the boundaries of science in the 1950s, the influence of intellectual circles (SPR, Cambridge philosophy), the nature of evidence, and how even rigorous thinkers can hold surprising beliefs. This is *precisely* the kind of challenging, thought-provoking material our Institute exists to foster.
  *   **Mitigating Risks (Addressing Concerns):** The concerns raised by our colleagues about potential misinterpretation and reputational risk are valid and significant. However, **removal is an overcorrection that sacrifices substance.** Instead, we mitigate risks through **intentional framing and context**:
      1.  **Session Title Reframe:** Change the session title from likely neutral phrasing to: **"Session 3: Turing's Unexpected Hurdle - The ESP Argument and its Historical Context"** (or similar). This immediately signals the session's analytical focus.
      2.  **Mandatory Framing Language (Instructor Guidance):** The instructor *must* begin and contextualize the session with clear statements:
          *   "Turing took this objection seriously *within the intellectual context of his time and circle*, where psychical research had a more prominent, albeit contested, place in philosophical discussion."
          *   "Modern scientific consensus, based on rigorous replication attempts and methodological scrutiny, overwhelmingly rejects the existence of ESP as Turing understood it."
          *   "Our focus today is *not* on validating ESP, but on understanding *why Turing felt compelled to address it* within his argument about machine intelligence and the design of the imitation game. What does this tell us about his methodology, his philosophical milieu, and the challenges of defining intelligence?"
      3.  **Catalog Description Amendment:** Add a clear, concise sentence to the *overall course* description: *"The course examines Turing's arguments in their historical context, including perspectives common in mid-20th century philosophy that differ significantly from modern scientific consensus."* (This avoids singling out ESP preemptively but provides essential context).
      4.  **Instructor Preparation:** Confirm with the proposer that her lesson plan explicitly includes the historical context (SPR, Broad, Cambridge milieu) and the modern scientific rejection of ESP. Emphasize that the session's goal is *analysis*, not advocacy.

  ### 4. Addressing Specific Concerns
  *   **Misinterpretation by Believers:** The proposed framing directly addresses this. Starting with the modern scientific consensus and clearly stating the session's purpose (historical analysis, not validation) is crucial. The focus on *why* Turing included it, not *whether* ESP is real, redirects the discussion. Our audience deserves the intellectual respect of encountering complex history honestly, even if parts challenge modern views. Providing clear context empowers them.
  *   **Media Mockery:** A well-framed course exploring the *historical quirks* of a genius is defensible and intellectually respectable. A course accused of *censoring* a key part of a famous paper because it makes us uncomfortable is *far* more vulnerable to justified criticism. Proactive framing ("unexpected hurdle," "historical context") demonstrates responsible handling. If questioned, we can confidently state we teach historical ideas accurately within their context while acknowledging current knowledge.

  ### 5. Timeframe for Action
  *   The proposer must submit the revised session title and confirm the inclusion of the mandatory framing points in the lesson plan **by [Date - e.g., November 5th]**.
  *   The Committee Chair will draft the amended catalog description incorporating the context sentence **by [Date - e.g., November 7th]** for final committee email approval.
  *   **Final Committee Vote** on the *revised* proposal will occur at our scheduled meeting on **November 15th**. Approval is contingent on the above changes being implemented.

  **Conclusion:** Turing's ESP argument is undeniably jarring to modern sensibilities, making it a powerful teaching moment about the history of ideas and the context of genius. Removing it whitewashes history. The concerns about misinterpretation are real, but the solution lies in **robust contextual framing and clear pedagogical intent**, not censorship. The proposed modifications provide the necessary safeguards while preserving the course's intellectual integrity and historical accuracy. I urge the committee to approve the course with these specific changes.
