  First, I need to recall Aquinas's actual positions. He distinguishes between usurpers (who have no legitimate claim) and legitimate rulers who become tyrannical. He also separates what public authorities can do versus private individuals. The friar's refusal must hinge on these distinctions.

  The user wants a ruler who is clearly a tyrant by ordinary standards—oppressive, violent, corrupt—but whose situation fits Aquinas's criteria where assassination isn't justified. So I'll create a ruler who gained power legitimately but then became tyrannical. Maybe he was initially elected but then seized more power, bypassing laws. His actions should include unjust executions, heavy taxes, suppression of dissent, and moral corruption like selling offices and violating marriages. 

  For the conspiracy, the plotters should be respected citizens—a merchant, a noble, a guild master—to make their request seem reasonable. They approach the friar because of his moral authority, wanting his blessing to legitimize their plot. 

  The friar's reasoning needs to be step-by-step, grounded in Aquinas. First, he'd acknowledge the ruler's tyranny and the people's suffering, showing empathy. Then he'd explain that while Aquinas condemns tyranny, he forbids private individuals from killing even tyrants. The key distinctions: the ruler was initially legitimate (elected), so he's not a usurper. And the plotters are private citizens, not public authorities. 

  The friar would also warn that assassination could lead to worse chaos or a more brutal ruler. He'd offer alternatives like formal appeals or rallying the nobility, though he knows they're unlikely. His refusal isn't cowardice but adherence to divine and natural law. 

  This makes the refusal principled, not just plot-convenient. The friar's internal conflict—hating the tyranny but bound by his philosophy—adds depth. The user gets a realistic scenario where Aquinas's nuances drive the drama.
answer: |-
  Here’s a scenario grounded in Aquinas's nuanced position, designed to force the friar into a refusal despite the ruler’s undeniable tyranny:

  **The Ruler: Ser Niccolò Malveggio**
  *   **Legitimate Claim:** Malveggio was *initially* elected Gonfaloniere (Standard-Bearer/Chief Magistrate) for a standard 2-year term by the city's Great Council, following established constitutional procedures. His election was uncontested and procedurally valid.
  *   **Descent into Tyranny:** Upon taking office, Malveggio systematically dismantled checks on his power:
      1.  **Usurpation of Authority:** He refused to step down after his term, declaring a "state of emergency" due to (fabricated) external threats. He dissolved the Great Council and replaced it with a hand-picked puppet assembly.
      2.  **Oppression:** He imposes crushing, arbitrary taxes on merchants and nobles who displease him, confiscating estates under dubious legal pretexts. He uses a private militia (*bravi*) for extortion, intimidation, and public executions without trial. Dissenters vanish or are imprisoned in his dungeons.
      3.  **Moral Corruption:** He openly sells judicial offices, rigs trials, violates the marriages of noblewomen, and loots the city treasury for personal palaces and debauchery. He mocks the Church, expelling a bishop who criticized him.
      4.  **Violence:** He recently ordered the public torture and execution of three prominent citizens (including a popular guild master) on trumped-up treason charges after they petitioned for the restoration of the Council. Their families were ruined.

  **The Conspirators:** Respected citizens – a merchant whose son was executed, a noblewoman whose lands were seized and sister violated, and a former Council member. They plan to stab Malveggio during a public procession.

  **Friar Tommaso's Reasoning (Step-by-Step):**

  1.  **Acknowledge the Evil:** "My children, I see the wounds inflicted upon your hearts and our city. The suffering you describe is grievous. Ser Niccolò’s actions are monstrous – avarice, cruelty, lust, and injustice stain his rule. He violates divine law, natural law, and the ancient statutes of this city. His soul is in grave peril, and he brings ruin upon us all. I do not doubt the profound evil you seek to end." *(Establishes empathy, confirms the tyranny is real and severe).*

  2.  **Invoke Aquinas on Tyranny:** "Saint Thomas, in his wisdom, teaches that tyranny is a grave evil, a perversion of the rightful order. A tyrant who governs only for his own advantage, not the common good, sins against God and the people." *(Shows he agrees with their core premise about Malveggio's nature).*

  3.  **Crucial Distinction #1 (Legitimacy of Origin):** "But Saint Thomas makes a distinction we *must* heed. He writes that if a ruler *has no just title to dominion at all* – a mere usurper who seized power by naked force or fraud, never possessing legitimate authority – then he is no true ruler, but a robber. In such a case, he who slays the tyrant to liberate the people is not guilty of murder, but rather acts as an executioner of justice, *provided no higher authority can act*." *(Sets up the key test).*

  4.  **Apply Distinction #1 to Malveggio:** "Ser Niccolò, however grievous his sins *now*, did *not* first come to power as a usurper. He was lawfully elected Gonfaloniere by the Great Council, according to our city's ancient customs. He held legitimate authority *in its inception*. His subsequent crimes are monstrous abuses *of that very authority*, not the actions of one who never possessed it. He is a tyrant, yes, but a tyrant who *once* ruled justly. Aquinas's justification for killing applies to the *usurper*, not necessarily to the *abuser* who held initial legitimacy." *(The critical point: Malveggio wasn't a pure usurper).*

  5.  **Crucial Distinction #2 (Public vs. Private Authority):** "Saint Thomas draws a second, even more vital line. He states that *only public authority* may licitly depose or punish a tyrant. If a higher temporal power exists – like an Emperor, King, or Pope – the people must appeal to them. If no higher temporal power exists, the authority reverts *to the people as a whole*, or their designated representatives acting *publicly* for the common good." *(Introduces the actor's legitimacy).*

  6.  **Apply Distinction #2 to the Conspirators:** "You, my friends, however righteous your cause and noble your standing, are acting as *private individuals*. You are not the constituted public authority of this city, nor have you been formally deputized by the people as a whole to act in their name. Your plot, however well-intentioned, is a *private* act of violence. Saint Thomas explicitly warns: 'It is the zeal for justice that inspires them to kill the tyrant; but this zeal for justice is not according to knowledge... for it is not given to private persons to kill evil-doers, but only to public persons.' To take the sword privately is to usurp the judgment that belongs to God and to the public order He ordained." *(The core refusal: They lack the standing to act as executioners).*

  7.  **The Danger of Private Vengeance & Chaos:** "Consider the consequences Saint Thomas foresaw. If private citizens may kill rulers they deem tyrannical, what foundation remains for *any* authority? Does not every disgruntled subject, every ambitious rival, gain license to cloak their malice or ambition in the guise of righteousness? Your dagger may end one tyrant, but it sows the seeds for endless vendetta and chaos, inviting a worse despot who claims power through greater violence. Is this the peace you seek? Is this order according to God's design?" *(Highlights the prudential danger Aquinas feared from privatized tyrannicide).*

  8.  **The Path of Legitimate Resistance (Futile as it may seem):** "Our duty, according to the Angelic Doctor, is first to endure lesser evils if resistance brings greater harm. But when the tyranny becomes unbearable? We must *publicly* resist. This means: Formally petitioning the remnants of the Council or the noble families *as a body* to declare him deposed for violating his oath and the laws. Appealing to the Papal Legate or a neighboring prince *as protectors of order*, not as assassins. Organizing the citizenry *openly* to refuse unjust commands and demand the restoration of lawful governance. These paths are arduous, dangerous, and may seem hopeless, but they are the paths of *public justice*, not private vengeance. To bless your dagger would be to bless the overthrow of the very principle of ordered authority under God that Saint Thomas spent his life defending."

  9.  **Pastoral Conclusion:** "My heart breaks with yours at the evil we endure. I will pray daily for deliverance. I will preach courageously against Malveggio's sins from the pulpit, risking my own life. I will counsel any who seek lawful means of redress. But I cannot, in conscience before God and guided by the teachings of Saint Thomas Aquinas, bless an act of private murder, even against this monster. To do so would damn my soul and betray the very order I am sworn to uphold. Seek justice, my children, but seek it *rightly*."

  **Why this works for your novel:**

  1.  **Intellectually Earned:** The refusal hinges entirely on Aquinas's specific, often overlooked distinctions (legitimacy of origin vs. abuse; public vs. private authority), not on cowardice or plot convenience. The friar demonstrates a deep understanding of the *Summa*.
  2.  **High Stakes:** Malveggio is a horrific tyrant by any measure. The conspirators have deeply personal, compelling motives. The refusal feels costly and morally fraught for the friar.
  3.  **Dramatic Tension:** The friar acknowledges the evil and the temptation, even offering alternative (albeit difficult) paths. His internal conflict (hating the tyrant but bound by doctrine) is palpable.
  4.  **Character Depth:** It shows the friar as rigorously principled, not politically naive. He understands the suffering but believes the *means* are as crucial as the end for a just society.
  5.  **Themes:** Explores core Renaissance/Aquinas themes: the nature of legitimate authority, the limits of resistance, the tension between natural law and positive law, the dangers of chaos vs. tyranny, and the role of conscience.

  This scenario forces the friar into the difficult space Aquinas carved out: condemning tyranny absolutely, acknowledging the people's right to resist *in principle*, but drawing a sharp, theologically grounded line against private individuals resorting to assassination against a ruler who, however monstrously, once held legitimate authority. His refusal is a painful adherence to a higher, more complex conception of justice and order.
