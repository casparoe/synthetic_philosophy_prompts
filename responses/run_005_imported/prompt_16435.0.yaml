prompt: |-
  I'm writing a novel set in a small Italian city-state during the early Renaissance in which a Dominican friar steeped in Aquinas's thought is asked by a group of conspirators to bless their plan to assassinate the city's ruler. I need his eventual refusal to feel intellectually earned, grounded in Aquinas's actual, more cautious position on tyrannicide rather than the popular shorthand that "Aquinas approved of killing tyrants." Please construct a concrete scenario, specifying both the ruler's conduct and how he originally came to power, that would satisfy any ordinary notion of a tyrant who deserves death, yet where Aquinas's own distinctions — between a ruler who holds no legitimate claim to rule at all and one who holds genuine authority but abuses it, and between what is permitted to public authority versus to private individuals acting on their own — would still leave the friar unable to sanction the killing. Then sketch, step by step, the reasoning he would actually give the conspirators, so that his refusal reads as principled rather than merely convenient for the plot.
