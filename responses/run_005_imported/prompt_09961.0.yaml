answer: |-
  You're drawing a **valid and ethically significant distinction**, not just being squeamish. Your hesitation reflects professional integrity and a nuanced understanding of the different kinds of endorsement a blurb represents. Here's why:

  1.  **The Nature of a Blurb:** A blurb is an endorsement *by you*. When you praise the prose or pacing ("luminous," "masterful"), you are offering your subjective *opinion* as a fellow novelist. When you state "these events actually occurred," you are making an objective *factual claim* based on... what? Not your own knowledge, but solely on the word of the author. Your name becomes attached to that factual assertion.

  2.  **The Limits of Your Knowledge:** You correctly identify the gap: you haven't seen the diaries. Your belief is sincere and based on trust, but it is *belief*, not *knowledge*. While you trust your friend's honesty implicitly, you have no way to verify:
      *   The *accuracy* of her interpretation of the diaries.
      *   The *context* of the diary entries she drew from.
      *   The *completeness* of the story she presents versus what the diaries contain.
      *   The *nature* of the diaries themselves (were they purely factual records, or did they contain imaginative elements, exaggerations, or private metaphors?).

  3.  **The Implied Authority:** By attaching your name to the statement "this is a true story," you implicitly lend your *authority as a novelist and public figure* to vouch for its historical truth. This goes beyond praising the book; it positions you as a secondary guarantor of factuality. If any aspect of the "truth" were later challenged (fairly or unfairly), your endorsement could be called into question, potentially damaging your own reputation or causing friction with your friend, despite your good faith.

  4.  **The Distinction Between Trust and Verification:** Trusting your friend's honesty is personal. Verifying historical facts is a different process. Your blurb isn't just about your trust in *her*; it's about putting your name to a claim about *external reality* that you haven't personally verified. This is the core of your discomfort.

  5.  **The Publisher's Role vs. Your Role:** The *publisher* is marketing it as "a true story" – that's *their* claim, based on their assessment of the author's material and potentially their own vetting process (though this varies widely). Your role as a blurber is traditionally to offer a literary *opinion*, not to independently verify and co-sign the publisher's marketing claims.

  **Why Others Might Not Hesitate (and Why That Doesn't Invalidate Your Concern):**

  *   **Blurb Culture:** Many blurbs involve hyperbole or unquestioning acceptance of the author/publisher's framing. Others may not have considered the distinction as carefully as you have.
  *   **Trust:** Like you, they trust the author implicitly and see no reason to doubt.
  *   **Focus on the Book:** They see their role solely as boosting the book's appeal and assume the publisher/author handles the factual basis.
  *   **Less Scrupulousness:** Some might simply be less concerned about the ethical nuance.

  **What To Do: A Path Forward**

  Your trust in your friend is clear. You want to support her. Here's how to navigate this while honoring your legitimate concerns:

  1.  **Talk to Your Friend:** Explain your position *exactly as you have here*. Emphasize:
      *   Your unwavering belief in her honesty and the story.
      *   Your deep admiration for the book itself ("luminous," "masterful").
      *   Your specific discomfort: putting your name to a factual claim about external events you haven't personally verified, despite trusting her completely.
      *   Your desire to write a blurb that is both supportive *and* ethically sound for you.

  2.  **Offer Powerful Alternatives:** Propose blurb language that strongly conveys the *power* and *authenticity* of the story *as presented*, without *you* making the absolute factual claim:
      *   **Focus on the Source & Author's Role:** "Drawn meticulously from her grandmother's intimate diaries, [Friend's Name] has unearthed a story so raw, powerful, and deeply moving, it reads with the undeniable resonance of truth." (This praises her work and the diaries' impact, implies truthfulness, but doesn't state "this happened" as *your* fact).
      *   **Focus on Belief & Impact:** "[Friend's Name] renders her grandmother's story – faithfully drawn from decades of diaries – with such searing clarity and emotional honesty that I emerged utterly convinced of its profound truth." (Highlights your belief based on her telling, not independent verification).
      *   **Focus on the Experience:** "This luminous novel, born directly from the pages of a grandmother's hidden diaries, carries the weight and intimacy of lived experience. A masterfully paced journey into a past that feels breathtakingly real." (Emphasizes the *effect* of the source material without a direct factual claim).
      *   **Praise the Transmission:** "[Friend's Name] acts as a remarkable conduit for her grandmother's voice, channeling the raw truth of these rediscovered diaries into a narrative that is both historically compelling and deeply human."

  3.  **Explain the Strength:** Assure her that phrases like "resonance of truth," "profound truth," "undeniable authenticity," "lived experience," or "faithfully drawn" are incredibly powerful in blurbs and often *more* compelling to readers than a flat "this is true" statement. They speak to the *effect* of the writing and the source material.

  4.  **Stand Your Ground (Gently but Firmly):** If she pushes back, reiterate that while you trust her absolutely, the distinction between subjective praise and objective factual endorsement is important *for you personally and professionally*. Your name on the book carries a responsibility you take seriously. Frame it as your own personal boundary, not a criticism of her or her work.

  **Conclusion:**

  Your hesitation is not squeamishness; it's a mark of your integrity and understanding of the different weights carried by different kinds of statements. You can absolutely write a stunning, supportive, and compelling blurb that conveys your belief in the story's truthfulness *as rendered by your friend from her grandmother's diaries* without personally stating "these events actually occurred" as a verified fact. Have an honest conversation with your friend, propose the alternative language, and emphasize how powerfully it still conveys the authenticity she wants to highlight.
