  Next, Turing's personality. He was known for unconventional thinking, challenging norms. His interest in ESP might stem from his fascination with the mind and consciousness. Since he was exploring if machines could think, ESP could be another aspect of the mind's capabilities. His comment about "overwhelming" evidence probably refers to J.B. Rhine's experiments at Duke University, which were later debunked but influential at the time.

