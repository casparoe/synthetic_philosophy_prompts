  The user might also be interested in how Turing's legacy is perceived. Historians note that his work on computation wasn't impacted by his ESP views. The key is separating his personal interests from his scientific contributions. Highlighting this distinction would reassure the user that Turing's core achievements remain solid.

  I should also address why this blind spot exists. Even brilliant minds have them, and the era's context explains it. The user might want to present Turing as human, not infallible, which adds depth to their piece. Emphasizing that his scientific rigor elsewhere wasn't compromised is crucial.

