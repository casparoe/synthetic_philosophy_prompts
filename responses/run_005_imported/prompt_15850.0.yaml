  Quick one for a piece I'm working on about the history of the Turing test. I finally read the actual 1950 paper this week and got stuck on the ESP section, where Turing flat out says the statistical evidence for telepathy is "overwhelming" and basically seems to accept it as real — feels like a wierd blind spot for the guy who more or less invented rigorous thinking about machine intelligence. Do historians have a good explanation for why he personally bought into psychic phenomena like that, and did that belief end up shaping how he actually designed the imitation game?
