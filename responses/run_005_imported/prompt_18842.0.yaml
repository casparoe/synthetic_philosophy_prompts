  I've been reporting on the Pluto "dwarf planet" saga for years now (still get angry emails about it) and it sent me down a rabbit hole into Gongsun Long and the old Chinese School of Names -- specifically the white horse dialogue, where he argues a white horse is not a horse. It struck me that the IAU basically did the mirror-image move: they coined "dwarf planet" and then insisted, no, thats not actually a kind of planet -- even though normally a "dwarf X" (dwarf star, dwarf hamster) is still very much an X, the way most people assume a white horse is obviously a horse and figure Gongsun Long's just being a sophist. So if you could plop Gongsun Long down in 2006 in front of the IAU's three-part definition and their insistence that dwarf planets aren't planets, what do you think he'd actually argue, using his own reasoning about names and attributes rather than just "he'd side with the demoters"? And once you work through his logic on this specific case, does it make the "sophistry" look like its onto something real, or does it just expose the trick for what it is?
