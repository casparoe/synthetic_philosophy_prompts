  We are going to address the no-trade theorem with a concrete example and then show how informed trading can still occur by violating one of the assumptions.

  ### Part 1: A Toy Example of the No-Trade Theorem

  **Setup:**
  - Two agents: Alice and Bob.
  - An asset: A stock that can be worth either $100 (high state, H) or $0 (low state, L) tomorrow. The true state is unknown to both, but they have common prior beliefs: they both initially believe that P(H) = 0.5 and P(L) = 0.5.
  - Private information: 
    - Alice receives a private signal: either A (good signal) or B (bad signal). The signal is correlated with the state. Specifically, the signal has the following properties:
      - P(signal=A | H) = 0.8, P(signal=B | H) = 0.2
      - P(signal=A | L) = 0.2, P(signal=B | L) = 0.8
    - Bob receives a different private signal: either X or Y. Similarly:
      - P(signal=X | H) = 0.8, P(signal=Y | H) = 0.2
      - P(signal=X | L) = 0.2, P(signal=Y | L) = 0.8

  Note: The signals are conditionally independent given the state.

  **Common knowledge:** Both know the structure of the game, the prior, and the signal distributions. They also know that the other is rational and will update beliefs accordingly.

  **The trade:** Suppose Alice is considering selling the stock to Bob. We will see that no trade can occur at any positive price that both would agree to.

  **Step-by-step unraveling:**

  1. **Initial situation:** Without any trade, each would value the stock based on their own signal.

     - If Alice gets signal A:
       - She updates: P(H | A) = P(A|H)*P(H)/P(A) = (0.8 * 0.5) / (0.8*0.5 + 0.2*0.5) = 0.4 / 0.5 = 0.8
       - So her valuation (expected value) is 0.8 * $100 + 0.2 * $0 = $80.

     - If Alice gets signal B:
       - P(H | B) = (0.2 * 0.5) / (0.2*0.5 + 0.8*0.5) = 0.1 / 0.5 = 0.2
       - Valuation: 0.2 * $100 = $20.

     Similarly for Bob:
     - If Bob gets signal X: valuation = $80
     - If Bob gets signal Y: valuation = $20

  2. **Alice's decision to offer a trade:**
     Suppose Alice gets signal B (so she values the stock at $20). She might think: "If I can sell to Bob for more than $20, I'm better off." But she must consider: why would Bob buy?

     However, note that Bob doesn't know Alice's signal. If Alice offers to sell, Bob must infer something about Alice's signal.

  3. **Bob's reasoning when Alice offers to sell:**
     Bob knows that Alice is rational and will only offer to sell if she thinks the stock is worth less than the price she is asking. But Bob also has his own signal.

     Let's assume Alice proposes to sell the stock at a price P. We must consider what Bob infers from the fact that Alice is willing to sell at P.

     - If Bob has signal Y (valuing the stock at $20), he would never buy at any P>=20 because he already thinks it's worth only $20. So we only consider when Bob has signal X (valuation $80).

     - Bob with signal X: 
          He thinks the state is likely H. But now Alice is offering to sell. Why would Alice sell? 
          - If Alice had signal A (which would make her valuation $80), she would only be willing to sell at a price above $80. 
          - If she had signal B (valuation $20), she would be willing to sell at any price above $20.

          Therefore, if Alice is offering to sell at a price P (say, between $20 and $80), Bob must consider that Alice might have the bad signal (B). 

          Specifically, Bob updates his belief based on the fact that Alice is willing to sell at P. This willingness reveals that Alice's valuation is at most P. Since with signal A she values at $80 and with signal B at $20, then:

          - If P < $80, then Alice would only be willing to sell if she has signal B (because if she had signal A, she would require at least $80). Therefore, if Bob sees an offer to sell at P (say $50), he infers that Alice has signal B.

          Now, Bob updates his belief: he originally had signal X, which gave him P(H|X)=0.8. But now he learns that Alice has signal B. How does he combine these?

          Bob's posterior for state H given his own signal X and Alice's signal B:

          P(H | X, B) = P(X, B | H) * P(H) / P(X, B)

          But note: signals are conditionally independent given H, so:
            P(X, B | H) = P(X|H) * P(B|H) = 0.8 * 0.2 = 0.16
          Similarly for L:
            P(X, B | L) = P(X|L) * P(B|L) = 0.2 * 0.8 = 0.16

          Therefore, P(H | X, B) = (0.16 * 0.5) / (0.16*0.5 + 0.16*0.5) = 0.08 / 0.16 = 0.5

          So Bob's updated valuation becomes: 0.5 * $100 = $50.

          Now, if Alice offers to sell at P=$50, Bob is exactly indifferent? But note: Bob's updated valuation is $50, so he would not pay more than $50. However, let's see:

          - If Bob is offered the stock at $50, and after updating he values it at $50, then he is indifferent. But would Alice be willing to sell at $50?

          Alice, if she has signal B, values the stock at $20. So she would be happy to sell at $50. But now the problem: Bob, upon being offered a trade at $50, infers that Alice has the bad signal and then values the stock at $50. So he would only be willing to pay up to $50. 

          However, note that if Alice offers to sell at $50, Bob agrees to buy at $50, then the trade happens at $50. But wait: this seems to contradict the no-trade theorem? 

          Let's reexamine: the no-trade theorem says that if both are rational and share common priors, and it is common knowledge that they are rational, then trade cannot occur based on private information. But in this case, we have a trade at $50. What went wrong?

          The key is that we must consider the entire reasoning chain. Alice, being rational, would realize that if she offers to sell at $50, Bob will infer that she has the bad signal and then only value the stock at $50. But then Bob would only be willing to pay $50. But note: if Alice has the bad signal (B) and she knows that Bob will only pay $50, then she would be happy to sell at $50 (because she values it at $20). However, what if Alice has the good signal (A)? 

          - If Alice has signal A (valuation $80), she would not be willing to sell at $50. Therefore, Bob knows that if Alice is selling, it must be because she has the bad signal. So Bob will update and value the stock at $50. 

          Therefore, in this case, trade at $50 would occur only when Alice has the bad signal. But note: Bob is paying $50 for an asset that he now (after updating) values at $50. So he is indifferent. However, if we assume that Bob requires at least a small profit to trade (or that he is risk averse), then he might not trade. But even without that, let's see the expected profit:

          For Alice: she sells for $50 an asset she values at $20 -> gains $30 (in expectation, because she is certain it's worth $20? Actually, she is not certain: she only has a posterior of 0.2 for H, so she thinks the expected value is $20). But wait, after the trade, the asset might turn out to be worth $100? Then Bob would gain $50 and Alice would have lost $50? 

          However, note: the key is that Bob's updated valuation is $50. So he is paying $50 for an asset that he believes is worth $50. Therefore, in expectation, he breaks even. Similarly, Alice, by selling at $50 an asset she thinks is worth $20, gains $30 in expectation? 

          But wait, this doesn't seem to break the theorem? The theorem says that trade cannot occur because the mere willingness to trade reveals the information and eliminates the gains. However, here we have a trade that seems to benefit Alice and break even for Bob? 

          The issue is that we must consider the entire market. The no-trade theorem typically applies to a setting where both parties are symmetrically informed about each other's rationality and the structure. In this case, the trade at $50 does happen, but note that Bob is not making a profit. He is breaking even. Therefore, there is no "money pump" for Bob. 

          However, let's see the no-trade theorem statement: it says that if two rational agents with common priors and common knowledge of rationality contemplate a trade, then they cannot agree to trade because the willingness to trade reveals adverse information. 

          The above example seems to show that trade can occur? But note: the theorem actually holds in a more refined way. We must consider that Alice might try to set a price that would attract both types of Bob? Or we must consider that Bob might not be willing to trade if he breaks even? 

          Alternatively, let's consider a different approach: the no-trade theorem often considers a setting where the two parties are considering a bet. We can reframe the asset trade as a bet.

          **Reframe as a bet:**
          Instead of selling the asset, let Alice and Bob consider a bet on the state. Suppose they consider a contract that pays $1 if the state is H. 

          - Without any trade, Alice with signal A values this contract at $0.8, and with signal B at $0.2.
          - Bob with signal X values it at $0.8, and with signal Y at $0.2.

          Now, suppose Alice (with signal B) wants to sell this contract to Bob. She would be willing to sell for any price above $0.2. Bob with signal X would be willing to buy for any price below $0.8.

          But now, if Bob is offered a contract at a price P (say $0.5) by Alice, he must infer: why is Alice selling? 

          - If Alice had signal A, she would only sell above $0.8. So if P < $0.8, then Alice must have signal B. 

          Then Bob updates: as above, his posterior for H given his own signal X and Alice's signal B becomes 0.5. So he values the contract at $0.5. Therefore, he would only be willing to pay up to $0.5. 

          So if Alice offers to sell at $0.5, Bob is willing to buy because he now values it at $0.5. But then the trade happens at $0.5. 

          However, note: after the trade, Bob has paid $0.5 for a contract that he now believes is worth $0.5. So he breaks even. Alice, who believes the contract is worth $0.2, sells for $0.5 and makes a profit of $0.3. 

          But wait: this trade seems to benefit Alice? 

          The catch: Bob, by being offered the contract at $0.5, infers that Alice has the bad signal and then updates to $0.5. Therefore, he is not willing to pay more than $0.5. But then why would Alice offer $0.5? Because she is willing to sell at any price above $0.2. So she would be happy to get $0.5. 

          However, the no-trade theorem typically assumes that both parties are risk-neutral and that there are no other motives (like liquidity). In this case, Bob is breaking even, so he is indifferent. If we assume that trade requires strictly positive gains for both, then this trade wouldn't occur. But if we allow indifference, then it might.

          But note: if Bob is exactly indifferent, then he might not trade. Alternatively, if there is a small transaction cost, then he would avoid the trade. 

          **The strict no-trade result:**
          The no-trade theorem actually says that there is no price P at which both parties strictly gain from the trade. In our example:

          - Alice gains strictly: she sells for $0.5 an asset she values at $0.2 -> gains $0.3.
          - Bob: he buys for $0.5 an asset that he (after updating) values at $0.5 -> gains $0.

          Since Bob does not strictly gain, the trade does not occur if we require strict gains. 

          Alternatively, if we consider that Bob might have a slightly different prior or if we allow for a small spread, then the trade wouldn't happen. 

          Therefore, to have strict gains from trade, we need both to gain. But in this example, Bob doesn't strictly gain. So the trade doesn't occur in the strict sense.

          **What if we set a price in the middle?**
          Suppose Alice tries to set a price P that is between $0.2 and $0.8, but not exactly $0.5? For example, P=$0.6.

          - If Alice offers to sell at $0.6, then Bob (with signal X) infers that Alice has signal B (because if she had signal A, she wouldn't sell below $0.8). Then Bob updates his valuation to $0.5. But $0.5 < $0.6, so Bob would not be willing to buy at $0.6. 

          Therefore, the only price at which Bob would be willing to buy is $0.5, and at that price he breaks even. So there is no price at which both strictly gain.

          Hence, the no-trade theorem holds: there is no trade that occurs with strictly positive expected gains for both.

          This is the unraveling: the moment Alice tries to sell, Bob infers her signal and updates, and then the trade becomes unprofitable for Bob unless he breaks even.

  ### Part 2: Realistic Example of Profitable Informed Trading

  Now, we need an example where informed trading is profitable and identify which assumption of the no-trade theorem is violated.

  **Example: A Merger Arbitrage Scenario**

  Suppose there is a rumor that Company A might acquire Company B. The current market price of Company B is $50 per share. If the acquisition happens, the price will go to $70; if not, it will drop to $40.

  - Common prior: The market assigns a 50% chance to the acquisition happening.
  - An insider at Company A (let's call her Carol) has private information that the acquisition will definitely happen (she saw the signed agreement). 
  - The market consists of many traders, including the insider and also liquidity traders (who trade for reasons unrelated to the stock's value, e.g., needing cash for personal reasons).

  **The trade:** Carol, the insider, wants to buy shares of Company B at the current market price of $50. She knows that after the acquisition is announced, the price will jump to $70, so she will make $20 per share.

  **Why does the trade happen?**
  - The market price is set at $50, which reflects the common prior (50% chance of acquisition: expected value = 0.5*70 + 0.5*40 = $55). Wait, but $55 is higher than $50? Let me adjust: if the market is efficient and the prior is 50%, the price should be $55. So let's assume the market price is $55.

  - However, the insider knows that the acquisition is certain. So to her, the stock is worth $70. Therefore, she would be willing to buy at any price below $70.

  - But why would anyone sell to her at $55? Because the sellers in the market do not have her information. They might be:
    - Liquidity traders: who are selling for reasons unrelated to the stock's value (they need cash).
    - Uninformed traders: who believe the current price is fair (i.e., they have the common prior and no private information).

  **Violation of the no-trade theorem assumptions:**
  The key violation is the presence of **liquidity traders** (or noise traders). The no-trade theorem assumes that both parties are rational and trade only based on information. In real markets, there are traders who trade for exogenous reasons (liquidity needs, portfolio rebalancing, etc.). These traders provide the "noise" that allows informed traders to profit without their information being fully revealed by their trading.

  In this example:
  - The sellers include liquidity traders who are selling regardless of the true value. Therefore, when Carol (the insider) tries to buy, the market cannot perfectly infer that she has positive information because the buy order might be coming from a noise trader. Thus, the price does not immediately jump to $70. Instead, the market price might adjust only partially (maybe to $60 or $65) due to the increased buying pressure, but Carol still makes a profit.

  **Which assumption is violated?**
  The no-trade theorem assumes that the only motive for trade is information (and that both parties are rational and share common priors). By introducing noise traders, we break the assumption that trade is only motivated by information. Therefore, the information revelation through trade is imperfect, allowing informed traders to profit.

  **Another potential violation: heterogeneous priors?**
  The no-trade theorem also relies on common priors. In real life, traders might have different priors. For example, if the market participants have different initial beliefs about the likelihood of the acquisition, then trade can occur. However, in this example, we are focusing on the liquidity trader argument.

  **Conclusion:**
  In the toy example, we saw that the no-trade theorem prevents strictly profitable trade between two rational, symmetrically informed (in the common prior and common knowledge sense) agents because the willingness to trade reveals the private information and eliminates the gains. In the real-world example, the presence of liquidity traders (or noise) breaks the no-trade theorem by introducing a non-informational motive for trade, allowing the insider to profit.
answer: |-
  ### Step-by-Step Toy Example of the No-Trade Theorem Unraveling  
  **Setup:**  
  - **Asset:** A biotech stock that will be worth $100 if its drug is approved (state = GOOD) or $0 if rejected (state = BAD).  
  - **Common prior:** Both agents (Alice and Bob) start with identical beliefs: 50% chance of GOOD, 50% chance of BAD.  
  - **Private information:**  
    - Alice learns *only* the FDA's internal recommendation (ADVISE_APPROVE or ADVISE_REJECT).  
    - Bob learns *only* the trial's side-effect severity (MILD or SEVERE).  
  - **Information structure (common knowledge):**  
    - If ADVISE_APPROVE: P(GOOD) = 0.8, P(BAD) = 0.2  
    - If ADVISE_REJECT: P(GOOD) = 0.2, P(BAD) = 0.8  
    - If MILD: P(GOOD) = 0.8, P(BAD) = 0.2  
    - If SEVERE: P(GOOD) = 0.2, P(BAD) = 0.8  
  - **Rationality:** Both are Bayesian updaters, and this is common knowledge.  

  **Alice initiates a trade:**  
  Alice receives ADVISE_REJECT (so she values the stock at $20). She offers to sell to Bob for $50.  

  #### Unraveling Process:  
  1. **Bob’s initial perspective (before Alice’s offer):**  
     - If Bob has SEVERE, he values stock at $20 → Won’t buy at $50.  
     - If Bob has MILD, he values stock at $80 → *Might* buy at $50.  
     - But Bob knows Alice is rational and has *different* information.  

  2. **Bob’s inference when Alice offers to sell at $50:**  
     - Alice would only sell if she thinks the stock is worth *less* than $50.  
     - If Alice had ADVISE_APPROVE (value $80), she’d never sell at $50 → Alice must have ADVISE_REJECT (value $20).  

  3. **Bob updates his beliefs:**  
     - Bob combines his signal (MILD) with the inferred signal from Alice (ADVISE_REJECT):  
       - P(GOOD | MILD, Alice’s signal=ADVISE_REJECT) = ?  
       - Signals are conditionally independent:  
         - P(GOOD) = 0.5 (prior)  
         - P(MILD | GOOD) = 0.8, P(ADVISE_REJECT | GOOD) = 0.2  
         - P(MILD | BAD) = 0.2, P(ADVISE_REJECT | BAD) = 0.8  
       - Apply Bayes:  
         $$P(\text{GOOD} | \text{MILD}, \text{ADVISE\_REJECT}) = \frac{0.5 \times 0.8 \times 0.2}{0.5 \times (0.8 \times 0.2 + 0.2 \times 0.8)} = \frac{0.08}{0.08 + 0.08} = 0.5$$  
       - Bob’s updated value = $50 (0.5 × $100).  

  4. **Trade collapses:**  
     - Bob now values the stock at $50 → He’s unwilling to pay $50 (he’d break even, but requires profit).  
     - Alice can’t offer a price where both gain:  
       - If she offers $40, Bob infers her signal again → Updates value to $50 → Still no profit.  
       - Any offer leaks her information, destroying the informational edge.  

  **Result:** No trade occurs. Alice’s willingness to sell reveals her signal, Bob updates, and gains vanish.  

  ---

  ### Realistic Example of Profitable Informed Trading  
  **Scenario:** Hedge Fund "AlphaEdge" exploits insider information on an oil merger.  
  - **Setup:**  
    - Company X (trading at $50/share) is secretly negotiating to buy Company Y at $70/share.  
    - Public prior: 10% chance of a deal (due to rumors).  
    - AlphaEdge bribes a lawyer to leak the signed merger agreement (private info: deal is 100% certain).  
    - AlphaEdge buys 1 million Y shares at $50 → Sells post-announcement at $70 → $20M profit.  

  **Why does this *violate* the no-trade theorem?**  
  - **Failure point: Common priors are violated.**  
    - AlphaEdge’s private info (signed agreement) is *not* derived from public data.  
    - The public prior (10% chance) is based on incomplete information; AlphaEdge has fundamentally different knowledge.  
    - In the no-trade theorem, both parties share the *same* prior distribution. Here, AlphaEdge’s "prior" is degenerate: P(deal) = 1.0.  

  **Mechanics of the violation:**  
  1. AlphaEdge’s private info isn’t just "better" — it’s **excluded from the common prior structure**.  
  2. When AlphaEdge buys, the market *can’t* fully infer their info:  
     - Sellers include liquidity traders (e.g., index funds rebalancing).  
     - Rational sellers suspect AlphaEdge knows something, but:  
       - They don’t know *what* AlphaEdge knows (common priors don’t cover insider bribes).  
       - They face noise traders muddying the signal.  
  3. Result: Price drifts to $55 (partial adjustment), not $70 → AlphaEdge profits.  

  **Key distinction:**  
  - In the toy example, Alice/Bob shared a common prior and their signals were "legal" updates within that structure.  
  - AlphaEdge operates **outside the common prior** by accessing non-public, excluded information → No rational updating by the market can neutralize their edge.  

  **Why "common knowledge of rationality" isn’t the failure:**  
  Even if all traders know AlphaEdge is rational, they can’t infer *why* it’s buying because:  
  - The info asymmetry isn’t "contained" in the prior (unlike the toy example).  
  - Noise traders provide cover → Prices don’t fully reflect the leak.  

  ### Conclusion  
  - **No-trade theorem holds** when priors/common knowledge/rationality align (as in the toy example).  
  - **Informed trading profits** when:  
    - Priors aren’t truly common (insider info breaks the prior structure), **or**  
    - Noise traders absorb losses (liquidity provision).  
  Your friend Theo is right that "better information wins" *in practice* because real markets violate the theorem’s assumptions—most critically, common priors and no noise traders.
