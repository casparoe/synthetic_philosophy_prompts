answer: |-
  You've pinpointed a profound and often under-analyzed tension at the heart of Carnap's project. His strict non-cognitivism regarding value statements *seems* to undermine the rational force of his own passionate political commitments. Resolving this requires careful attention to Carnap's *pragmatic* conception of language, his distinction between *frameworks* and *internal questions*, and the specific role he assigned to *empirical social science* within his broader vision. Here's a breakdown:

  1.  **The Core Tension Restated:**
      *   **Non-Cognitivism:** Value/normative statements (e.g., "Socialism is just," "Planning is desirable," "We *ought* to strive for greater equality") are not truth-apt propositions within the unified science. They are expressions of emotion ("Hurrah for socialism!") or disguised imperatives ("Adopt socialist policies!"). They belong to "Metaphysics" in the pejorative sense.
      *   **Political Commitment:** Carnap actively advocated for socialism and scientific planning as *rationally superior*, *progressive*, and aligned with the *scientific world-conception*. This wasn't presented merely as a personal whim, but as a position supported by reason and empirical understanding.

  2.  **Carnap's Potential Resolution: The Technical/Means-Ends Carve-Out**
      Carnap *did* attempt the carve-out you suggest, heavily influenced by Neurath's "scientific utopianism." The argument runs as follows:

      *   **Ends are Non-Cognitive, Given by "Life" or "Volition":** The *ultimate* ends or values (e.g., "maximize human flourishing," "reduce suffering," "achieve greater equality," "ensure stability") are not chosen based on theoretical truth. They stem from fundamental attitudes, volitions, or cultural/historical movements (like the socialist movement Carnap identified with). Science cannot *prove* these ends are "correct."
      *   **Means are Cognitive, Subject to Science:** Once ends are *accepted* or *adopted* (based on non-cognitive grounds), the question of *how best to achieve them* becomes a purely *technical, empirical question*. This falls squarely within the domain of unified science.
      *   **Planning as a Superior Technical Means:** Carnap (following Neurath) argued that *given* ends like stability, efficiency, meeting basic needs, reducing inequality, and rationally organizing society, *empirical social science* demonstrates that centrally coordinated economic and social *planning* is a more effective and reliable means than *laissez-faire* capitalism. Laissez-faire is seen as:
          *   Prone to crises, waste, and inefficiency (boom/bust cycles, unemployment, unmet needs alongside surplus).
          *   Generating unacceptable levels of inequality and social conflict.
          *   Hindering the rational application of scientific knowledge to social problems.
          *   Less able to achieve democratically chosen social goals.
      *   **The Role of Science:** Empirical social science (economics, sociology, psychology) provides the *evidence* for these claims about causal relationships between policies (planning vs. laissez-faire) and outcomes relevant to the adopted ends. *This* is where rational argument and verification enter the picture. Carnap saw planning as the *application* of the scientific method to society itself.

  3.  **Can the Carve-Out Hold? Critiques of the Resolution:**
      While Carnap *intended* this distinction, his practice arguably strains and sometimes breaches it. The line is less clear than he presumed:

      *   **The "Given Ends" are Rarely Neutral or Fixed:** Carnap's favored ends (efficiency, stability, equality, rational organization, meeting needs) were not neutral technical goals. They were *intrinsically* linked to the socialist *Weltanschauung* he endorsed. Are "equality" or "rational organization" purely technical concepts, or do they carry normative weight inseparable from the political project? Laissez-faire advocates often prioritize different ends (e.g., individual liberty, spontaneous order, dynamism).
      *   **"Effectiveness" is Value-Laden:** Judging whether planning is "more effective" depends entirely on *which* ends you prioritize and *how you measure* things like "efficiency" or "stability." Is efficiency measured purely in output, or does it include worker satisfaction, environmental impact, or resilience? These choices reflect underlying values smuggled into the "technical" assessment.
      *   **The "Rationality" of Planning:** Carnap frequently linked the scientific world-conception and planning with "rationality." But is this a purely technical, instrumental rationality (choosing effective means), or does it carry connotations of normative superiority ("it's *more rational*, therefore *better*")? His language often suggests the latter, implying that choosing planning *is* choosing reason over unreason, which goes beyond a neutral means-end calculation.
      *   **The Non-Neutrality of the "Scientific World-Conception":** As you note, Carnap saw this conception as *continuous* with a progressive, socialist political program. The manifesto itself links the scientific outlook to "the trend of modern, productive labor" and opposition to "metaphysics and theology." This framing isn't neutral between planning and laissez-faire; it positions science (and thus planning) as inherently progressive and aligned with historical forces. This imbues the "technical" choice with normative significance derived from the broader framework.
      *   **The Status of Democratic Choice:** Carnap often invoked democratically chosen ends as the basis for technical planning. But defending *democracy itself* as the procedure for setting ends requires normative justification. Why prefer democratic volition over aristocratic or technocratic volition? Non-cognitivism struggles to provide a *rational* basis for this preference beyond expressing a pro-democratic attitude.

  4.  **Conclusion: A Leaky Distinction and Implicit Commitments:**
      Carnap's *principled* attempt to resolve the tension relies on a strict separation between non-cognitive ends and cognitive means. **In theory, his political engagement *could* be confined to the technical side: "Given the ends widely shared within my socialist tradition (ends I personally endorse via non-cognitive attitudes), empirical science shows planning is the superior means."**

      However, **in practice, Carnap's arguments often exceeded this narrow technical scope.** His language and framing consistently implied:
      *   That the ends he favored (equality, rational organization, meeting needs via science) were *not just preferences* but were *objectively* aligned with progress, reason, and the scientific worldview itself.
      *   That choosing planning over laissez-faire was not just effective for specific ends, but was a manifestation of *rationality* in a broader, normative sense.
      *   That the scientific world-conception was inherently *progressive* and politically charged, not a neutral tool.

      **Therefore, while Carnap had a *principled framework* (the means-ends distinction) designed to license his political arguments within his semantics, his *practice* often relied on implicit normative commitments that his official non-cognitivism could not fully license.** He smuggled in a thicker notion of "rationality," "progress," and the inherent value of applying science to society, which went beyond mere expressions of attitude or purely technical calculations of effectiveness *for arbitrarily chosen ends*. His engagement, while framed technically, drew its persuasive force from a deeper, quasi-normative vision of scientific humanism that his meta-ethics struggled to contain. The tension, while perhaps mitigated by the means-ends distinction, wasn't fully resolved by it. His political practice arguably committed him to a more robust (if implicit) conception of practical reason than his stated semantics explicitly allowed.
