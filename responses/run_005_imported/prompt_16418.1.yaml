answer: |-
  The tea mug dissolved in Aris’s hands. Not physically – the ceramic didn’t crumble – but *ontologically*. As his fingers closed around it, the smooth, unified vessel fractured into a buzzing, temporary constellation of silica, oxygen, aluminum atoms, held in a fleeting, teapot-shaped configuration by forces he could almost *see* as crackling lines of tension. There was no mug. Only particles, arranged mug-wise.

  This was Aris’s world, ever since childhood. Van Inwagen had been right, though Aris hadn’t known the philosopher’s name back then. Only living things were truly *one*. Only they possessed that irreducible unity, that persistent *selfness* that made them objects in the truest sense. Everything else? Ephemeral arrangements. Useful fictions that crumbled under direct perception.

  He navigated the kitchen carefully. The countertop was a seething plane of mineral grains and polymer chains. The refrigerator hummed, a complex storm of vibrating metal atoms, refrigerant molecules, and electromagnetic fields – no single "machine," just a chaotic, humming *arrangement*. He focused on the teapot itself. It was harder to dissolve; it had been his grandmother’s, touched by generations. Sometimes, faintly, he thought he felt a whisper of enduring *thingness* clinging to it, a ghost of composition born of love and use. But no. It too, ultimately, was just particles. Only the spider crawling near the sink window held its form – a small, buzzing knot of unified life.

  He poured the boiling water (a furious, colliding swarm of H2O molecules) into the pot (arranged pot-wise). The steam (another chaotic arrangement) rose. He carried the dissolving tray – particles arranged tray-wise, supporting the dissolving pot arrangement, holding the dissolving mug arrangement – back to the living room.

  Lena, his wife, sat on the sofa. *She* was gloriously, undeniably whole. A single, vibrant entity radiating warmth and coherence amidst the buzzing chaos of the room. The sofa beneath her? A teetering scaffold of wood fibres, foam bubbles, and fabric threads, straining under her unified weight. Her book? A fluttering storm of paper fibres and ink pigments arranged page-wise.

  "Tea’s ready," Aris said, his voice tight. He set the dissolving tray onto the coffee table (particles arranged table-wise). The mug arrangement wobbled precariously.

  Lena looked up, her eyes soft, concerned. "Still bad today?"

  "Always bad," Aris murmured, focusing intently on *her* face, her living eyes, the single entity that anchored him. "The drive home… the car…" He shuddered. Perceiving the car as billions of parts held together by sheer momentum and friction, no true whole, while hurtling down the highway was pure existential terror. He only managed it by focusing solely on Lena beside him, a single, real point in the unreal machine.

  She reached out. Her hand, a unified, living thing, passed *through* the shimmering haze of particles that constituted the coffee table’s surface without resistance (because there *was* no solid surface, only interacting fields) and rested on his dissolving knee arrangement. Her touch was an anchor, a confirmation of reality.

  "I wish I could see it your way," she said softly. "Just… chairs and tables and cars. Simple."

  "You *do* see it," Aris countered, a familiar ache in his chest. "You just don’t *perceive* the truth underneath the convenience. You believe the fiction." He didn’t mean it cruelly. It was just the unbearable weight of his clarity.

  The phone rang. The sound was a jarring cascade of electronic pulses and vibrating plastic molecules arranged phone-wise. Lena, the unified whole, picked up the dissolving handset arrangement.

  Her face changed. The vibrant coherence flickered, replaced by pale dread. "What? When?... Okay. We’re coming. Now."

  She hung up, the phone arrangement dissolving further in her trembling hand. "It’s Mom. Another heart attack. They… they had to implant a pump. She’s in ICU."

  Aris’s world didn’t dissolve. It *shattered*. ICU. Machines. The heart pump. Horror, cold and absolute, washed over him.

  He drove, white-knuckled, the car a screaming vortex of dissociated parts held together by terrifyingly fragile physical laws. The hospital was a nightmare cathedral of unreality – fluorescent lights buzzing as atom swarms, linoleum floors a shifting mosaic of polymer tiles, gurneys rattling assemblies of metal tubes and fabric.

  And then, the ICU. His mother-in-law, Eleanor, lay in the bed. *She* was still there, a core of unified life, but terrifyingly diminished, fading. And attached to her, plugged into her living flesh, was *it*.

  The ventricular assist device.

  Aris froze in the doorway. It wasn't a machine. It wasn't even an *arrangement* in the usual sense. It was an obscenity. Gleaming titanium alloy casing (particles arranged shell-wise), whirring ceramic bearings (particles arranged bearing-wise), synthetic polymer tubing (particles arranged tube-wise) snaking into Eleanor’s chest cavity. It pulsed with a rhythmic, mechanical *thrum-thrum-thrum*, a sound that wasn't life, but a cruel imitation, a pattern imposed on chaos.

  This… this *abomination* was sutured to Eleanor’s living heart muscle. A collection of non-living parts, arranged pump-wise, violating the sanctity of her unified being. It wasn't *part* of her. It couldn't be. It was an alien scaffolding, a blasphemous parody of composition, propping up her fading unity with dead matter.

  Lena rushed to the bedside, grasping Eleanor’s real, living hand. "Mom? Mom, it's Lena. You're okay. The pump is helping."

  *Helping?* Aris wanted to scream. It was *defiling* her! He saw the pulses of the machine travel up the polymer tubes, saw the unnatural force ripple through the particles arranged muscle-wise in Eleanor’s heart. He saw the vibrant, unified field of her life-force – pale, flickering, but *real* – straining against the invasive, dead mechanism.

  He couldn't approach. The dissonance was physically nauseating. The hum of the pump wasn't just sound; it was the grinding scream of metaphysics violated. His vision fractured. Eleanor blurred into her constituent cells, a fading galaxy of life, while the pump remained a stark, buzzing constellation of dead, arranged matter, a parasite latched onto her unity.

  Lena looked back, tears streaming down her face, a single, desperate whole. "Aris? Come hold her hand. Please."

  He looked at Eleanor’s other hand, resting on the sheet. A real hand. A part of a real, unified being. But between him and it lay the whirring, thrumming horror, its polished surface reflecting the cold ICU lights. To touch her, he’d have to reach *through* the ontological violation, acknowledge the space polluted by the arranged particles pretending to be part of her whole.

  The "pump" thrummed. *Thrum-thrum-thrum.* A dead thing’s pulse grafted onto a dying life. Aris stood paralyzed, trapped in the unbearable clarity of van Inwagen’s truth. To save a life, they had shattered the only thing that made life real. He could see the parts. He could see the whole. And he saw the monstrous, necessary lie vibrating between them, keeping a mother alive by tearing apart the very fabric of what *being* meant. He couldn't move. The particles of the world screamed their arrangements, and the only true thing left was the tear tracing a unified path down Lena’s living cheek.
