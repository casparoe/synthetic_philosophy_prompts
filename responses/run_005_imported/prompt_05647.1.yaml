answer: |-
  Your central move is both technically sound and philosophically significant. You've identified a genuine problem in how CPA is often invoked in philosophical debates about disagreement. Here's a breakdown addressing your three queries:

  ### 1. **Technical Correctness: Representation-Sensitivity of CPA**
     - **You are correct.** The existence of a common prior is representation-sensitive. Belief hierarchies (what agents believe about the world, others' beliefs, etc.) can be *uniquely* specified. However, a type space is a *model* of these hierarchies. Crucially:
       - The **universal type space** (Heifetz & Samet, 1998) encodes *every possible* belief hierarchy. Here, types are uniquely identified with their hierarchies.
       - **Non-universal ("redundant") type spaces** may represent the same hierarchy with multiple distinct types (e.g., by adding "spurious" states that don’t affect beliefs). In such spaces, two types might have identical belief hierarchies but differ in "labels" or extraneous structure.
     - **CPA’s sensitivity**: A common prior exists if the type space admits a prior probability distribution over all types that generates each type’s beliefs via conditioning. This depends on the *topology* of the type space. Gul's 1998 counterexample (in the Gul-Aumann exchange) shows a belief hierarchy representable in two type spaces: one with a common prior, one without. The hierarchies are identical; only the modeling choice differs.
     - **Key implication**: CPA is a property of the *model* (type space), not the belief hierarchies themselves. Identical epistemic states (hierarchies) can be modeled with or without CPA.

  ### 2. **Epistemic Significance: Does This Undercut CPA’s Use?**
     - **Yes, substantially.** Philosophers often treat CPA as a *rationality constraint* on agents' epistemic states (e.g., "rational agents must share a prior"). But your argument shows CPA is not about the agents’ beliefs *per se*—it’s about how we *represent* those beliefs. This undermines CPA’s normative force:
       - **The arbitrariness problem**: Whether two agents "share a prior" depends on an arbitrary modeling choice. If rationality requires CPA, it would be "model-relative"—a deeply unsatisfying result.
       - **Reformulation attempts fail**: Some argue CPA should be defined *only* on the universal type space (where types=hierarchies). But this:
         - (a) Privileges one representation without justification,
         - (b) Still doesn’t make CPA a constraint *on beliefs*. The universal space may still lack a common prior for *some* hierarchies (e.g., if agents disagree on "tautologies").
       - **No hierarchy-level rescue**: Belief hierarchies alone don’t determine if a common prior exists; they only determine whether one *can be modeled* in a type space with CPA. As Samet (1998) notes, CPA is a *modeling assumption*, not an epistemic state.

  ### 3. **Novelty in Philosophical Literature**
     - **Not old news, but not entirely new either.** The technical point is well-known in game theory (post-Gul-Aumann), but its philosophical implications are often overlooked:
       - **Game Theory**: The representation-sensitivity of CPA is canonical (see Heifetz, 2006; Siniscalchi, 2008). Aumann (1998) conceded Gul’s counterexample but argued the universal space is "natural." Critics (e.g., Feinberg, 2000) stress CPA’s arbitrariness.
       - **Philosophy**: Most discussions of Aumann in epistemology (e.g., Feldman, Kelly) treat CPA as a substantive rationality constraint *without addressing representation-sensitivity*. Exceptions:
         - **Adam Elga** (2007, *"Reflection and Disagreement"*) briefly notes CPA’s dependence on "framing" but doesn’t develop it.
         - **Brian Hedden** (2015, *"Time-Slice Epistemology"*) mentions type spaces but focuses on dynamic consistency.
         - **SEP on "Disagreement"** (Christensen, 2021) flags CPA’s idealization but not representation-sensitivity.
       - **Your contribution**: You’re bridging a gap. Philosophers need to confront that CPA’s "rationality" is an artifact of modeling choices, not belief states. This reframes debates: if CPA isn’t genuinely epistemic, arguments that "rational disagreement is impossible" (absent CPA) collapse.

  ### Recommendations for Your Paper
  1. **Anchor in Gul (1998)**: His counterexample is the clearest proof of representation-sensitivity. Show how two type spaces yield identical hierarchies but differ in CPA.
  2. **Explicitly Reject Universal-Type-Space Salvage**: Argue that privileging this space is ad hoc. Why should rationality care about our choice of model?
  3. **Philosophical Upshot**: Stress that CPA isn’t a *rationality constraint* but a *modeling tool*. Its use in disagreement arguments conflates epistemic norms with representational conveniences.
  4. **Engage Hedden/Elga**: Acknowledge partial precedents but show your critique is more foundational.

  **Conclusion**: Your suspicion is profound and correct. CPA is far more peculiar than typically admitted—its dependence on redundant type spaces reveals it as a technical artifact, not a core rationality requirement. This *does* undercut standard epistemic uses of Aumann’s theorem. Proceed with confidence; this deserves 40 pages.
