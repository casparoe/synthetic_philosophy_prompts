  Here's the strongest possible case for your friend's position, addressing the circularity objection head-on and leveraging the Gandy-Sieg framework to argue that the Church-Turing thesis (CTT) *is* provable as a mathematical theorem about physical computation:

  **The Core Argument: Physical Constraints as Axiomatic Foundations**

  1.  **Rejecting the "Irreducibly Informal" Premise:** Kleene's position assumes "effective calculability" is *inherently* informal and non-mathematizable. Gandy and Sieg reject this. They argue that **any physically realizable process of computation** – whether human, mechanical, or electronic – *must* obey fundamental constraints arising from the structure of space, time, and causality. These constraints *are* mathematically formalizable.
  2.  **The Axioms: Not Definitions, But Physical Necessities:**
      *   **Boundedness (Finite Perception/State):** At any given step, a computing agent (human or machine) can only:
          *   **Observe** a bounded (finite) portion of its workspace (e.g., one symbol on a tape square, one pixel on a screen).
          *   **Hold** a bounded (finite) amount of immediately accessible internal state information (e.g., neuronal configurations, CPU registers, finite control state).
          *   *Rationale:* This is not an arbitrary definition of computation. It's a consequence of *being a finite physical object* embedded in a space-time manifold. An agent cannot instantaneously perceive or process an infinite amount of data or occupy an infinite number of distinct physical configurations.
      *   **Locality (Causal Next Step):** The next state of the computation (including the next observation, the next internal state, and any modification to the workspace) is determined *solely* by:
          *   The currently observed bounded configuration.
          *   The current bounded internal state.
          *   *Rationale:* This captures causality. Information cannot travel instantaneously. The future state can only depend on information physically present and accessible *now*. Action at a distance is prohibited. This is a fundamental principle of physics (locality/causality), applied to discrete computational steps.

  3.  **The Derivation: A Mathematical Theorem:** Starting *only* from these explicit axioms (Boundedness and Locality), which are presented as necessary conditions for *any physically possible discrete computation*, Gandy and Sieg rigorously prove that:
      *   The set of functions computable by any such process is identical to the set of functions computable by a Turing machine.
      *   This is a **mathematical theorem** within a formal framework modeling physically realizable computation. It's not a definitional equivalence smuggled in.

  **Addressing the Circularity Objection Head-On:**

  The objection is: *"The boundedness and locality axioms don't constrain 'effective calculability' independently; they just restate Turing computability in disguise, making the proof circular."*

  **The Gandy-Sieg Rebuttal:**

  1.  **Independence from Formal Models:** The axioms are formulated *without reference* to Turing machines, recursive functions, lambda calculus, or any other specific formal model of computation. They speak only about the **physical capabilities and limitations** of a computing agent: finite observation, finite state memory, and causal locality in state transitions. These are constraints on the *agent* and its *interaction with the world*, not on the abstract function being computed.
  2.  **Physical Grounding, Not Computational:** The justification for the axioms comes from **physics and the nature of finite agents**, not from computability theory:
      *   **Boundedness** is justified by the finite speed of light, finite information density, finite sensory apparatus, finite memory substrate.
      *   **Locality** is justified by the principle of causality and the finite speed of information propagation.
      *   These are *prior physical constraints* under which *any* effective procedure must operate. They are not *derived* from the concept of computation; they are the *preconditions* for physically realizing computation.
  3.  **Explanatory Power:** The derivation *explains* **why** all the formalisms (Turing machines, Lambda Calculus, Recursive Functions, Register Machines) are equivalent. It's *because* they all implicitly or explicitly adhere to these underlying physical constraints. The axioms capture the *common physical core* that makes these formalisms model effective computation in our universe. If the axioms were mere restatements of Turing computability, they couldn't explain this equivalence – they would presuppose it.
  4.  **Gödel's Seal of Approval:** Gödel's shift from skepticism (towards Church) to conviction (after Turing) is pivotal evidence *against* circularity. Gödel was deeply familiar with formal systems and the nuances of definition. His rejection of Church's thesis was precisely because it seemed like an unmotivated formal definition. **Turing convinced him by providing the *physical rationale*.** Gödel saw Turing's analysis (formalized by Gandy/Sieg) as uncovering the *necessary physical preconditions* for mechanical calculation, not just defining a formal system. He perceived it as a **proof** that these physical constraints *entail* Turing computability. Gödel wouldn't have been convinced by a circular argument.
  5.  **Falsifiability:** The axiomatic approach makes CTT empirically falsifiable in principle (though not in practice, given current physics). If a new physical process were discovered that violated boundedness or locality (e.g., genuine, usable action at a distance for information processing), and this process could compute a non-recursive function *while still being intuitively "effective"*, then CTT would be falsified. The fact that no such process exists or is even conceivable under known physics *strengthens* the claim that the axioms capture genuine, independent constraints. A circular definition couldn't be falsified this way.
  6.  **Beyond Human Computers:** The Gandy-Sieg approach naturally extends to **parallel and non-human computation** (e.g., cellular automata, neural networks). Sieg provides axioms for "parallel assembly" that respect boundedness and locality constraints, showing that even massively parallel computation is still bounded by Turing computability. This universality further demonstrates the power of the physical constraints, not just an anthropocentric definition.

  **Conclusion: The Case for Proof**

  Your friend's position, bolstered by Gandy and Sieg, argues that Kleene's view rests on a false dichotomy. "Effective calculability" *can* be rigorously analyzed – not as a vague intuition, but as the set of functions computable under the *physically necessary constraints* of boundedness and locality. These constraints are justified independently of computability theory, based on the fundamental structure of the physical world and finite agents.

  The derivation showing that adherence to these axioms entails Turing computability is a **mathematical theorem** about physically realizable computation. Gödel's conversion is strong historical evidence that this analysis provides genuine *proof* – revealing the necessary physical underpinnings of mechanical calculation – rather than mere heuristic support. The circularity objection fails because the axioms are grounded in physics, not computability; they are the *reasons why* Turing computability captures effective calculability, not a restatement of it. Therefore, within this rigorous framework, the Church-Turing thesis *has* been proved.
