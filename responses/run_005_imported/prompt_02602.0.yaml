  For question 2 on the MPD comparison: this is the sharpest concern. The disanalogies matter - autism's biological correlates (like sensory processing differences visible in infants) create a "reality anchor" MPD lacked. Also, autistic self-advocacy emerged bottom-up against clinical consensus, unlike MPD's therapist-driven epidemic.

  Question 3 about refugees: this isn't a cop-out but a profound point. The reality of suffering persists regardless of categorical shifts. For autism, the diagnostic label doesn't create the sensory overwhelm or social confusion - it names pre-existing experiences.

