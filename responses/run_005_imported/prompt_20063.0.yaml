prompt: |-
  I help maintain a mid-sized open-source project, and as it has grown, the maintainers have started debating whether to set up a more formal governance process, and if so, who should actually count as a voting "member": core contributors, anyone who has ever filed an issue, corporate sponsors who pay people to work on it, or downstream users who never touch the code but are heavily affected by our decisions. While reading around this question, I came across what political theorists call the boundary problem: the puzzle of how to justify the boundary of the demos — the group of people entitled to make a collective decision — which has to be settled before any question of how their votes get aggregated even arises. Two rival standards seem to be on offer: an all-affected-interests principle, under which anyone whose interests are shaped by a decision should get a say, and an all-subjected principle, which restricts the vote to those actually bound by the resulting rules; and, troublingly, there seems to be no way to choose between them, or to draw any boundary at all, without already presupposing some group entitled to do the choosing. Given this, please describe the most important implications of the boundary problem for how I should think about defining the electorate for governance decisions in a project like mine.
reasoning: |-
  Okay, the user is involved in maintaining a mid-sized open-source project and is grappling with how to define the voting "members" for governance decisions. They've encountered the boundary problem in political theory, which questions how to justify who gets to be part of the decision-making group. The user mentions two principles: the all-affected-interests principle and the all-subjected principle, and is troubled by the circularity in choosing between them.

  First, I need to unpack the boundary problem's implications for their project. The core issue is that any decision about who gets a vote is itself a governance decision, which creates a chicken-and-egg problem. The user's project likely started organically, but as it grows, defining the electorate becomes critical to avoid conflicts, especially with corporate sponsors and diverse stakeholders.

  The user's identity as a maintainer suggests they need practical solutions but also want philosophical justification. Their deeper need might be to balance inclusivity with effectiveness, ensuring decisions are legitimate without making the process unwieldy. They might fear alienating contributors or sponsors, or creating bureaucratic overhead.

  Looking at the principles: all-affected-interests is broad—anyone impacted by the project, like users or sponsors, could claim a say. But this risks an unmanageably large electorate. All-subjected narrows it to those bound by the rules, like core contributors who must follow coding standards. This is more feasible but might exclude affected parties, leading to legitimacy issues.

  The user might not have considered hybrid models or tiered governance. For example, core contributors vote on technical decisions, while a broader group advises on major changes. Or different electorates for different decision types. They also need to address the foundational paradox: the initial boundary must be set by the current maintainers, accepting that it's provisional and revisable.

  Another angle is practical legitimacy over theoretical purity. The project's history and current contributors' trust could guide the initial setup. Documentation and transparency about the governance process can help legitimize the boundaries even if they're imperfect.

  Corporate sponsors paying developers introduces complexity. Should those developers have individual votes, or does the sponsor get representation? The user might need to differentiate between individual contributors and organizational interests to avoid undue influence.

  Downstream users affected by decisions but not contributing code pose another challenge. Their input is valuable for feedback but including them in every vote might not be practical. Advisory boards or RFC processes could be alternatives.

  The user's unspoken need is likely sustainability—ensuring the project remains healthy and avoids conflicts as it scales. They need a governance model that's defensible, minimizes disputes, and adapts over time. Emphasizing pragmatism, incremental changes, and clear communication might be key takeaways for them.
answer: |-
  The boundary problem is profoundly relevant to your governance dilemma, as it highlights unavoidable tensions in defining your project's "demos." Here are the key implications for your decision-making process, moving from conceptual challenges to practical guidance:

  1.  **The Inescapable Foundational Paradox:**
      *   **Implication:** Your initial decision *about who decides* cannot be perfectly justified by either principle alone without circularity. You *must* start with an assumption made by the current core/maintainers.
      *   **Action:** Acknowledge this openly. Frame your initial governance proposal not as the ultimate "correct" solution derived from pure theory, but as the *best pragmatic starting point* based on the project's history, current needs, and the core team's responsibility. State that it's subject to evolution.

  2.  **The Tension Between Principles & Practicality:**
      *   **All-Affected-Interests:** Philosophically compelling (users, sponsors, contributors are all affected) but practically impossible. Defining "affected" is infinitely expansive (e.g., users of downstream projects, competitors). Granting votes based on filing an issue creates perverse incentives and an unstable electorate.
      *   **All-Subjected:** More manageable (focuses on those directly bound by project rules/processes) but potentially exclusionary. Does a corporate sponsor whose employee is subject to coding standards "count"? Does a heavy user relying on stable APIs feel "subjected" by breaking changes?
      *   **Implication:** You *cannot* satisfy both principles fully. Prioritization is required.
      *   **Action:** Lean towards **All-Subjected as the primary criterion for *voting rights*** for core governance (e.g., approving changes to governance itself, major technical directions). This creates a stable, identifiable, and engaged electorate responsible for the project's direct outputs. Use **All-Affected-Interests to guide consultation and transparency mechanisms** (RFCs, advisory boards, user surveys) for broader input.

  3.  **Defining "Subjected" Requires Context:**
      *   **Implication:** "Subjected" isn't self-evident in an open-source project. It needs operational definition based on *what the governance decisions actually bind people to do*.
      *   **Action:** Clearly define the scope of decisions requiring a formal vote (e.g., changes to the core architecture, licensing, governance model, major API breaks). Then, define "subjected" as:
          *   **Commitment:** Individuals who have made sustained, significant contributions (code, docs, infra) *recently* (e.g., within the last 12-18 months), demonstrating ongoing involvement and direct subjection to project norms and technical decisions.
          *   **Responsibility:** Individuals with documented roles (e.g., "Maintainer," "Core Team") who are expected to review, merge, release, and support the project, thus being directly bound by its technical and procedural rules.
          *   **Exclude:** "One-time" contributors (single PR/issue), sponsors (their influence comes via funding employed contributors, not direct votes), and pure users (they are affected, not directly subjected to *project governance* rules).

  4.  **The Problem of Scale and Legitimacy:**
      *   **Implication:** A small electorate (only core) risks legitimacy crises if major decisions alienate large affected groups (users, sponsors). A large electorate (all contributors) becomes unwieldy and risks disengagement or capture by fleeting interests.
      *   **Action:** Implement a **tiered or representative model:**
          *   **Core Voting Members:** Defined by sustained commitment & responsibility (All-Subjected focus).
          *   **Contributor Voice:** Formalize input channels for all active contributors (e.g., designated representatives in discussions, requirement for public RFCs on major changes, contributor surveys).
          *   **User/Sponsor Voice:** Create *advisory* bodies (User Committee, Sponsor Council) with clear mandates to provide feedback and signal concerns *before* formal votes, but without direct voting power on core governance/technical decisions. Transparency is key.

  5.  **The Dynamic Nature of Boundaries:**
      *   **Implication:** The "correct" boundary today won't be the correct one forever. Contributors leave, user bases shift, sponsor relationships change.
      *   **Action:** **Bake evolution into your governance model:**
          *   Define clear, objective criteria for *gaining* voting membership (e.g., X merged PRs over Y months, taking on maintainer duties).
          *   Define clear criteria for *losing* voting membership (e.g., inactivity for Z months, resignation).
          *   Include a formal process (requiring a supermajority?) for *changing the governance model itself*, including membership criteria. This process should involve the current electorate but require broad consensus due to its foundational nature.

  6.  **Distinguishing Influence from Authority:**
      *   **Implication:** Sponsors and users deserve influence, but conflating influence with formal voting authority in the core demos creates ambiguity and potential for undue pressure or instability.
      *   **Action:** Be explicit:
          *   **Voting Rights (Authority):** Reserved for those subjected to the project's core operational rules (active, responsible contributors).
          *   **Input Channels (Influence):** Guaranteed for affected parties (sponsors via advisory council, users via forums/RFCs/bug trackers, all contributors via discussion).
          *   **Transparency:** Ensure all governance discussions (except perhaps sensitive personnel/conduct issues) and votes are public. Publish rationales for decisions, especially when they go against significant input from non-voters.

  **Recommendations for Your Project:**

  1.  **Start with a Proposal:** Have the current active maintainers draft a governance charter based on All-Subjected (sustained, responsible contributors).
  2.  **Define "Sustained Contribution" Objectively:** Use metrics like merged PRs, issue triage, documentation, release management over a recent timeframe.
  3.  **Establish Clear Advisory Bodies:** Create a "Technical Steering Committee" (voting, core) and separate "User/Community Advisory Board" & "Sponsor Council" (non-voting, influential input).
  4.  **Mandate Transparency:** All proposals, discussions (where possible), and votes documented publicly.
  5.  **Build in Evolution:** Clear, objective paths to membership and a defined process for amending the governance model.
  6.  **Focus on Legitimacy through Process:** Acknowledge the boundary problem, explain the *pragmatic* choices made emphasizing manageability and responsibility (Subjected), and demonstrate genuine commitment to listening to Affected interests through robust consultation. Legitimacy will come from fair process and good outcomes, not just the initial perfect boundary.

  The boundary problem teaches you that there's no perfect, theoretically pure solution. Your goal is a *legitimate* and *workable* system. Prioritize the All-Subjected principle for formal voting rights to ensure a capable and responsible electorate, while rigorously implementing mechanisms based on the All-Affected principle to ensure the voices of users, sponsors, and contributors are heard and considered seriously. Embrace the need for explicit, revisable rules and transparent processes to navigate the inherent tensions.
