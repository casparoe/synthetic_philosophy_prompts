  **Justifications:**  
  1. **Marcus (-1):** Oversimplifies. Single-point estimates *feel* actionable but can mislead when uncertainty is high. His "dodge blame" claim unfairly assumes bad faith.  
  2. **Deepa (2):** Correctly identifies differing epistemic states. When lacking data, ranges transparently communicate uncertainty that single numbers mask.  
  3. **Marcus (0):** Valid critique about range uncertainty (credible intervals exist), but wrongly implies this invalidates ranges. Deepa *should* communicate confidence in her band (e.g., "90% sure risk is 5-40%").  
  4. **Deepa (1):** Philosophically sound – beliefs often *are* distributions. However, practicality demands some collapse for decisions (median? worst-case?).  
  5. **Marcus (-1):** Misrepresents dilation. Learning *can* increase uncertainty when new evidence contradicts assumptions (e.g., discovering migration impacts unknown subsystems). This reflects reality, not flawed methodology.  
  6. **Deepa (2):** Correct admission. Dilation is a feature, not bug, of robust frameworks (e.g., imprecise probability). It *is* unintuitive but reflects how real-world evidence sometimes *destabilizes* confidence.

  ### What Both Are Missing:
  1. **Decision Theory Lens:** Neither addressed *how leadership uses estimates*. Ranges prompt different actions:  
     - Tight range → Accept risk or mitigate  
     - Wide range → Invest in reducing uncertainty (e.g., prototype migration)  
     Marcus' single number obscures this; Deepa didn't articulate it.

  2. **Hybrid Approach:** Best practice combines both:  
     `"Base case: 20% P1 risk (range 5-40%, 80% confidence). Unfamiliar infra dominates uncertainty; suggest test-migrate subset to narrow estimate."`  
     This gives an anchor while exposing uncertainty.

  3. **Risk Communication Nuance:**  
     - Marcus ignores "unknown unknowns" – single points imply comprehensiveness.  
     - Deepa should supplement her range with *actionable uncertainty drivers* (e.g., "40% upper bound assumes undetected schema lock contention").

  4. **Cognitive Bias Blind Spots:**  
     - Marcus' approach invites anchoring on 20%.  
     - Deepa's range might be misinterpreted as "equally likely" outcomes without clarifying distribution (e.g., "most likely near 15%").

  **Verdict:** Deepa wins on epistemic honesty for novel risks, but Marcus is right that stakeholders need *actionable* inputs. The solution isn't "range vs point" but *structured risk narration*: quantify uncertainty, explain drivers, and pair estimates with decision options. Leadership doesn't need a number—they need to understand *what we know, what we don't, and what to do next*.
