  1. **Compute pairwise margins:**  
     - **A vs. B:** A wins 3-2 (Voters 1,2,5 prefer A; Voters 3,4 prefer B). Margin = 1.  
     - **A vs. C:** C wins 3-2 (Voters 3,4,5 prefer C; Voters 1,2 prefer A). Margin = 1.  
     - **B vs. C:** **Tie 2-2** (Voters 1,2 prefer B; Voters 4,5 prefer C; Voter 3 has B > C).  
       - *Ties are not locked in Ranked Pairs; we skip this pair.*  

  2. **Lock in pairs (only decisive margins):**  
     - Lock A > B (margin 1).  
     - Lock C > A (margin 1; no cycle with A > B).  
     - B vs. C is skipped (tie).  

  3. **Resulting ranking:** C > A > B.  
  **Winner after manipulation: C**  

  ---

  ### **Step 4: Why This Works**
  - Voter 4’s insincere ballot (C > B > A) changed the **B vs. C** pairwise contest from a **loss for C** (2-3) to a **tie** (2-2).  
  - This prevented B > C from being locked in, breaking the cycle that existed in sincere voting.  
  - Now, C > A is locked in, making C the winner.  
  - Voter 4 **strictly prefers C over A**, so manipulation improved their outcome.  

  ---

  ### **Step 5: Why This Illustrates Gibbard-Satterthwaite**
  The Gibbard-Satterthwaite theorem states that for any voting system with ≥3 candidates that is:
  - **Non-dictatorial** (no single voter always decides the winner),
  - **Resolute** (always picks a winner),
  - **Covers all preference profiles**,
  some voter can manipulate it by misreporting preferences in some scenarios.  

  This example demonstrates the theorem because:
  1. **Ranked Pairs is non-dictatorial** (no voter controls the outcome alone).  
  2. **Manipulation occurred**: A voter changed the winner to a strictly preferred candidate by lying.  
  3. **No coincidence**: The theorem guarantees such a scenario exists for Ranked Pairs. The numbers here are just one instance—similar examples exist for any non-dictatorial system.  
  4. **Generality**: The vulnerability arises from the system’s core logic (aggregating pairwise preferences), not specific numbers. Any slight change in ballots can alter the locking order, creating manipulation opportunities.  

  ---

  ### **Step 6: Realism in a 200-Student Election**
  - **Information requirement is the barrier**:  
    - To manipulate, Voter 4 needed exact knowledge of **all other ballots** (or the pairwise margins). In a 200-voter election, a single voter is unlikely to know this unless:
      - Preferences are highly polarized/public (e.g., factions).
      - Pre-election polls reveal near-exact preferences.
      - Voters collude (e.g., clubs sharing voting plans).
    - **Without precise information**, a manipulator risks making the outcome worse (e.g., accidentally helping their least favorite candidate).  

  - **Practical threat level**:  
    - **Low for individuals**: A single voter in a 200-person election won’t have the data to reliably manipulate.  
    - **Higher for groups**: If a faction (e.g., 30+ voters) knows their collective strength, they might coordinate strategic voting (e.g., all ranking a rival candidate last).  
    - **Mitigating factors**:  
      - Ballot secrecy reduces information.  
      - Complex methods like Ranked Pairs/Coombs make manipulation harder to compute.  
      - Sincere voting is often a Nash equilibrium (no one benefits from unilateral deviation).  

  - **Conclusion**:  
    Gibbard-Satterthwaite highlights a **theoretical vulnerability**, not a common practical flaw. For most student elections, the risk of successful manipulation by an individual is low due to information constraints. However, it’s a stronger concern for small, transparent groups or if detailed polling occurs.  

  > **Recommendation**: If your council wants to minimize gaming, use a Condorcet method (like Ranked Pairs) or STAR voting—but pair it with rules limiting polls/coalitions. No system is strategy-proof, but some are harder to exploit than plurality.
