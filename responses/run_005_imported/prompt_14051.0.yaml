answer: |-
  Here’s a toast weaving Kavka’s puzzle into a warm, funny, and universally relatable tribute — focused on the *vow*, not the toxin. Timing: ~3 minutes.

  **(Clink glass gently. Start warm, eye contact with couple.)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], Theo’s eternally grateful former housemate — which means I’ve seen him survive on instant noodles, debate whether socks are laundry-optional, and, crucially, fall head-over-heels for Ana.  

  Now, Theo and Ana have this… *thing*. Their first big conversation was a two-hour debate in a philosophy seminar about whether you can rationally intend to drink a horrible toxin *after* you’ve already gotten the reward for *intending* to drink it. *(Pause, smile at confused guests.)* Right. For the 95% of you wondering if I’ve lost my mind — don’t worry. Basically, it’s a puzzle about promising something tough in the future, knowing that when the time comes, you might not feel like following through.  

  **Theo proposed by telling Ana that marrying him was like that puzzle… except she’d actually *want* to drink the toxin.** *(Pause for laughter. Lean in conspiratorially.)* Look, I told him it wasn’t the most romantic comparison. But knowing Theo? It was perfect. Because here’s what stuck with me: **The real puzzle isn’t the toxin. It’s the *gap*. The moment between promising and doing.**  

  At midnight, you *intend*. You commit. You bind yourself to a future action. But when morning comes? The reward’s already yours. The easy, rational choice is to walk away. **Sound familiar?** *(Gesture to the couple.)* Today, Theo and Ana stood up here and made breathtaking promises. Not for a million dollars, but for love. They promised ‘always’ and ‘no matter what,’ fully knowing that someday — maybe tomorrow, maybe in decades — there will be mornings when the *reward* feels secured. When comfort says ‘stay quiet,’ pride says ‘walk away,’ fatigue says ‘just this once.’ Mornings where the only reason left to choose each other… is that you *once promised you would*.  

  **That’s not a flaw in the plan. That’s the plan.** That midnight intention? That’s the vow. It’s saying: *‘I know future-me will have great excuses. But present-me is building a bridge for them to walk across — because I know where I want us to go.’*  

  **And Theo was right about one thing:** With Ana, he *does* want to drink the toxin. But not because it’s toxic. Because when you love someone this much, the ‘toxin’ — the hard work, the forgiveness, the choosing each other when it’s not convenient — **isn’t a cost. It’s the proof.** It’s how you turn ‘I promise’ into ‘we did.’  

  **So here’s the joke:** Their professor actually re-assigned that toxin puzzle paper *two weeks ago*. Theo called it a sign. *(Shake head, grinning.)* Only Theo would see existential homework as a cosmic wink. But maybe it *was* a sign — a reminder that **the magic isn’t in the puzzle. It’s in the people solving it.**  

  **To Theo and Ana:** You didn’t just solve the puzzle. You rewrote it. You turned midnight intentions into daylight devotion. You looked at the gap between promise and action and built a life inside it. May your reasons to choose each other only grow deeper, but when they don’t? May that vow be the bridge that always brings you home.  

  **Raise your glasses:** To the midnight promise, the morning choice, and the lifetime of drinking the ‘toxin’… together. To Theo and Ana!"  

  **Why this works:**  
  1.  **The Joke:** "Only Theo would see existential homework as a cosmic wink" lands for everyone. Philosophers get the meta-layer; others laugh at Theo's "nerd logic."  
  2.  **Accessible Puzzle:** Explains the toxin briefly ("promising something tough...") and pivots fast to the relatable *gap* concept (promise vs. action).  
  3.  **Vows, Not Toxin:** Focuses on the *structure* of commitment (intention now, action later) = wedding vows. Ana isn’t the toxin; the *work* is, and it’s chosen joyfully.  
  4.  **Warmth:** Centers on their story ("rewrote the puzzle"), love ("build a life inside the gap"), and future ("brings you home").  
  5.  **Depth, Not Lecture:** Uses the puzzle as a lens, not the subject. The "bridge" metaphor makes it poetic, not academic.  

  **Delivery Tip:** Pause after "...walk away." Let the weight of vows sink in. Smile warmly at "You rewrote it." End with firm, joyful eye contact on "To Theo and Ana!"
