  Breaking down Owen's arguments: His point about collective assets (1) feels intuitively fair but risks overreach - after all, Farah's pop-up precedent weakens it. The scale argument (3) is his strongest, highlighting how informal agreements crack under pressure. His pivot to renegotiation (5) is pragmatic but skirts consent issues.

