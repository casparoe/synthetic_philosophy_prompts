  Here’s a toast that honors Meera’s courage, grounds her decision in principle (without flinching from its cost), and speaks to the hearts of colleagues still wrestling with it. It’s designed to be spoken – warm, direct, and with the weight it deserves:

  **(Clink glass gently, stand confidently, warm smile for Meera, then scan the room with sincerity)**

  "Friends, colleagues... Meera. We’re here tonight because one of the fiercest, most thoughtful people many of us have had the privilege to work alongside is moving on. Meera, you’ve challenged us, inspired us, and yes, occasionally driven us absolutely nuts – usually when you were *right* about something uncomfortable. And nowhere was that truer than during those brutal days on the COVID ethics committee.

  We all remember the impossible choices. The weight of deciding who gets a shot at life when there wasn't enough to go around. The instinct – the *good* instinct – to save the most lives possible. To look at the numbers, the odds, and direct resources where they seemed most likely to succeed. It felt like triage. It felt like duty.

  And then there was Meera. Standing up for the lottery.

  **(Pause, acknowledge the room's likely mixed feelings gently)**

  Now, I know that decision... it landed hard. People felt it went against the grain of our mission. Some still carry that weight, believing a different path might have saved more. That grief, that frustration? It’s real. It comes from the same place that makes us care so deeply: the desperate desire to save every single patient. We can’t pretend that choice didn’t have a cost. We lived that cost. We felt it in our bones.

  **(Shift tone, more focused, principle-driven)**

  But Meera didn’t champion the lottery on a whim, or just for the sake of ‘fairness’ as some abstract idea. She was wrestling with something profound. I stumbled on an old philosopher recently, John Taurek... and it hit me. This was the core of what Meera was fighting for. Taurek argued that when we face impossible choices about saving lives, we shouldn't *only* see a math problem. Because the person who loses? They don’t lose a statistic. They don’t lose *less* because there are others who might benefit more. They lose their *one* irreplaceable life. Their entire world. Their hopes, loves, unfinished stories. **Just one.**

  **(Lean in slightly, making eye contact)**

  Meera pushed for the lottery because she refused to let the *number* of potential beneficiaries erase the *equal, absolute value* of each individual life sitting in front of us, equally qualified. It wasn't about ignoring benefit. It was about refusing to say: *"Your life, because you're sicker or frailer or statistically less likely to pull through, is worth less than theirs."* It was about saying: **"In this agonizing moment where we cannot save everyone, we will not decide whose singular life is more deserving of a chance."** The lottery wasn't random *instead* of care; it was a profound, heartbreaking *expression* of care for the inherent worth of each person, stripped of calculations about their utility.

  **(Address the room directly, acknowledging the tension)**

  Was it the path that would *always* save the most lives statistically? Maybe not. That’s the trade-off. Meera knew that cost. She carried it. But she asked us: **Is saving the *most possible* lives the *only* moral imperative when the cost is actively choosing who, among equals, is less worthy of the chance?** She believed, deeply, that sometimes upholding the equal dignity of every human being, especially when it’s hardest, is the bedrock of what makes medicine ethical. That *not* making that choice was its own kind of cost – a cost to our shared humanity.

  **(Turn fully to Meera, warmth and admiration)**

  Meera, you stood on principle when the pressure was crushing. You took the heat for a belief rooted in the intrinsic, immeasurable value of every single life. You did it not because it was easy, but because you believed it was *right*, even knowing people would misunderstand, even knowing some would blame you. That takes a kind of moral courage that leaves me in awe. You didn't just serve on the ethics committee; you *lived* ethics, fiercely and compassionately, when it mattered most.

  **(Raise glass)**

  So tonight, we toast you, Meera. Not just to a brilliant colleague moving on, but to your courage. To your unwavering commitment to seeing the person, not just the prognosis. To reminding us, even when it was painful, that every 'one' counts absolutely. Thank you for making us wrestle with the hardest questions. Thank you for your integrity. We’ll miss you terribly, but we’re better for having stood beside you in the fire.

  **To Meera – a true champion of the irreducible value of *every* life. We salute you."**

  **(Hold eye contact, warm smile, sustained clink/sip)**

  **Key elements for your delivery:**

  *   **Pacing:** Slow down on the heavy parts, especially the Taurek explanation and the core principle. Let the silence hang briefly after acknowledging the cost.
  *   **Tone:** Sincere, warm, respectful, firm on principle but never dismissive of others' pain. Avoid sounding academic or preachy.
  *   **Body Language:** Stand tall. Make eye contact around the room, especially when acknowledging the difficulty and the cost. Turn fully to Meera for the personal part and the final toast.
  *   **The Drink:** Hold it naturally. Raise it high and meaningfully on the final toast line.
  *   **"Landing" for Sore Nurses:** You directly acknowledge their pain ("grief, frustration... real... cost... we lived it") and link their motivation ("desperate desire to save every patient") to Meera's deeper principle ("intrinsic value of every life"). This validates their feelings *without* conceding Meera was wrong, framing it as two profound values in tension.

  This toast honors Meera's difficult choice as a principled stand for fundamental human equality, acknowledges the real pain and trade-offs involved, and does so in a way that respects the dedication and heart of everyone in the room. Good luck!
