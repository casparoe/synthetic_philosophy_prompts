prompt: |-
  Okay so I'm the student member on my college's Honor Board and we've got a case coming up that's stressing everyone out. A senior is accused of fabricating thesis data -- the case against her is basically keycard logs showing she swiped into the shared lab during the exact window the dataset got altered, except two labmates swiped in around the same time and had access to the same files. Our bylaws say every violation gets decided on "preponderance of the evidence," full stop, whether the penalty is a warning or expulsion. Half the board wants something stronger, like "clear and convincing evidence," whenever expulsion's on the table, since taking someone's degree over a case this shaky feels different then a routine warning; the other half says the facts are the facts, and moving the bar because we don't like the consequences is just motivated reasoning in a lab coat. This is weirdly close to some stuff on contextualism and stakes from my epistemology seminar, so before Tuesday's meeting, can you write the memo I'd actually bring to the board -- recommend whether and how the standard of proof should flex with the sanction's severity, keep it concrete enough to vote on, and take the "facts don't change just because we're scared of the outcome" objection seriously instead of just waving it away.
