answer: |-
  Here are 9 tightly argued, adversarial questions designed to force clarification, expose vulnerabilities, and challenge the generality of constitution theory—with razor-focused follow-ups anticipating the "brute modal fact" dodge. Each question draws blood from Wiggins/Baker debates while pushing toward new ground:

  1. **Grounding Challenge**: "You claim the statue and lump share all physical parts and spatial properties at *t*, yet differ modally (e.g., only the lump survives flattening). If constitution is a primitive relation, what *metaphysically grounds* this modal divergence given perfect physical overlap? What is the truthmaker beyond mere conceptual labeling?"  
     *→ Anticipated Dodge (Brute Modality)*: "If you say modal profiles are 'brute facts' tied to sortals, doesn’t that reduce constitution to verbal stipulation? Why isn’t this just identity with a linguistic overlay?"

  2. **Too Many Artworks/Thinkers**: "If constitution multiplies objects, when I exhibit a clay statue, are there two distinct valuable artworks in the gallery: the statue (with aesthetic value) and the coincident lump (with mere material value)? If not, why does 'artwork' not apply to the lump given it shares the statue’s exact physical form?"  
     *→ Follow-up*: "If you deny the lump is an artwork, doesn’t this imply constitution’s 'distinct objects' collapse into a single evaluative subject under any non-modal predicate? How is this not property monism?"

  3. **Chrysippus’ Amputee Paradox**: "Take Dion (a person) and Theon (Dion’s body). If Dion’s foot is amputated, Theon—now identical to Dion’s footless body—survives, but Dion does not (per Chrysippus). Does constitution theory say Dion and Theon were *always* distinct objects coinciding pre-amputation? If so, why did only one think Dion’s thoughts?"  
     *→ Follow-up*: "If you reject pre-amputation coincidence, does constitution only apply to artifacts? If *yes*, isn’t this ad hoc? If *no*, how does it avoid the 'two thinkers' problem for persons?"

  4. **Persistence Conditions & Arbitrariness**: "Statues allegedly cease existing if flattened, lumps persist. But why privilege 'shape preservation' for statues? Couldn’t a conceptual scheme define 'statue' as persistent through deformation (e.g., 'process art')? If constitution’s modal rules aren’t grounded in physics or logic, aren’t they conventional?"  
     *→ Follow-up*: "If you appeal to 'dominant sortals' or social practices, does metaphysics reduce to anthropology?"

  5. **Indiscernibility & Counting**: "At coincidence-time, the statue and lump share mass, location, atomic composition, and causal powers. By Leibniz’s Law (indiscernibility of identicals), shouldn’t they be identical? If you reject this, what principle *prevents* constituters for every arbitrary description (e.g., 'the left-handed statue')?"  
     *→ Anticipated Dodge (Sortal-Relativity)*: "If only 'substantial sortals' count, what makes a sortal 'substantial' beyond brute fiat?"

  6. **Causal Overdetermination**: "When the statue falls, it breaks because it’s fragile. The coincident lump is equally fragile. Do both objects cause the breaking? If yes, isn’t this causal overdetermination? If no, which one is causally inert and why?"  
     *→ Follow-up*: "If the statue 'borrows' causality from the lump, why isn’t the lump the only real object?"

  7. **Temporal Gaps & Identity**: "A lump predates the statue (it was a lump before sculpting). Post-destruction, the lump survives as a ball. The statue never exists again. But during coincidence, they’re 'distinct'. Does this mean identity over time is sortal-relative? Can *x* and *y* be identical-at-*t* but distinct-over-time?"  
     *→ Follow-up*: "If persistence is sortal-bound, how do we avoid saying the *lump* ceases to exist when the *statue* is created (since it gains new persistence conditions)?"

  8. **The Grounding of Sortals**: "Baker claims statues have a 'first moment of existence' when the lump acquires a function. But functions are extrinsic (e.g., artist’s intent). How can an *intrinsic* modal difference (e.g., fragility) be grounded in *extrinsic* historical facts?"  
     *→ Anticipated Dodge (Brute Inheritance)*: "If constitution 'transmits' only select properties, what governs inheritance? If brute, why call this a *relation* rather than magic?"

  9. **Generalization Test**: "Your solution for statues: could it resolve the Ship of Theseus? If the original planks (now a scattered lump) constitute a 'ship' only when assembled, is the reassembled ship identical to the original? Or does constitution create a new object? If new, why isn’t every minor repair a new statue?"  
     *→ Follow-up*: "Doesn’t constitution theory, pushed to its limits, require perpetual object-genocide in restoration projects?"

  **Key Tactics Embedded**:  
  - Q1, Q4, Q8 attack brute modality by demanding grounding beyond stipulation.  
  - Q2, Q3, Q6 force confrontation with absurd overpopulation (artworks/thinkers).  
  - Q3, Q7, Q9 test generality with ancient puzzles and edge cases (amputees, Theseus).  
  - Q5 challenges Leibniz’s Law evasion; Q6 targets causal profligacy.  

  **Delivery Tip**: Frame questions as requests for *clarification* ("Help me understand how your view avoids...") to maintain charity while boxing the guest into concessions. End with Q9 to highlight practical absurdity. This line forces the metaphysician to either defend radical object proliferation or retreat to quasi-identity—either way, the audience sees the cost.
