prompt: |-
  Okay so my friend Priya and I got into it last night over the statue-and-clay thing — like genuinely heated, we were still re-explaining premises to each other over text at 1am — and now I have to record a podcast episode this weekend with a metaphysician who basically defends the position Priya was pushing, the "constitution without identity" line: her view is that the statue and the lump of clay are two numerically distinct objects even though they share literally every particle and every arrangement of those particles at every moment they coincide. I dont want to just sit there and let her restate the view for forty minutes, I want the episode to actually go somewhere.

  Can you draft me 8-10 interview questions? I want at least one that really presses the grounding problem — if the statue and the lump are made of exactly the same stuff, arranged exactly the same way, for as long as they overlap, what actually makes it true that only one of them could survive being squashed into a ball? I also want one that generalizes the old "too many thinkers" worry beyond persons — if constitution is a real, non-identity relation, doesn't that commit her to two valuable artworks sitting in the same spot, two things weighing exactly one kilo, etc., and isn't that just multiplying objects for free wherever there's a shape? And I'd love a question that brings in the old Chrysippus "Dion and Theon" amputee puzzle (or the Stoic growing-argument stuff more generally), just to see whether her solution is a genuinely general theory of coincidence or something built to fit freshly-sculpted statues specifically. For each question, give me a quick follow-up keyed to whatever dodge she'll probably reach for — my money's on her eventually saying the modal difference is just a "brute" fact about which properties get inherited through constitution — and please, no "what first drew you to metaphysics" filler questions, I want the kind of thing someone who's actually sat with Wiggins and Baker would ask.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a metaphysician who defends the constitution view—that the statue and the clay are distinct objects despite sharing all their particles. They need incisive questions that challenge this view without letting the guest restate it unchallenged.  

  First, the user wants three specific angles:  
  1. **The grounding problem**: If both objects are identical in material and arrangement, what grounds the difference in their modal properties (like surviving being squashed)?  
  2. **The "too many thinkers" worry**: Extending this beyond persons to artworks or weights—doesn't this view imply redundant entities?  
  3. **Historical puzzles**: Like Chrysippus' amputee paradox, to test if the theory handles all coincidence cases.  

  The user also hints the guest might dodge with "brute modal facts," so follow-ups must preempt that.  

  Hmm, the user’s tone is frustrated ("genuinely heated," "re-explaining premises at 1am") and they reject filler—this needs professional rigor. They name-drop Wiggins/Baker, so questions must reflect deep familiarity with the literature.  

  **Question Structure:**  
  - **Core Challenge**: Each question should force the guest to defend a weak point.  
  - **Follow-Up**: Anticipate the "brute fact" retreat and press further. E.g., if she says modal differences are primitive, ask why constitution doesn’t collapse into identity.  
  - **Edge Cases**: Use Dion/Theon or "lump of clay vs. artwork" to expose inconsistencies.  

  **Key Angles to Cover:**  
  1. **Grounding**: "If same particles/arrangement, why different persistence conditions?" → Follow-up: If brute, how is this not identity?  
  2. **Overpopulation**: "Two artworks in one spot?" → Follow-up: If she denies it, what distinguishes constitution from arbitrary multiplication?  
  3. **Time & Change**: Use the Stoic puzzle—if Dion loses a foot, is Theon (the footless body) suddenly identical to Dion? → Follow-up: How does constitution handle temporal parts?  

  **Avoiding Dodges:**  
  - If she calls modal properties "inherited," ask: Why do only *some* properties inherit? Who decides?  
  - If she distinguishes "sortals" (statue vs. lump), press: Are these categories real or linguistic?  

  **Podcast Dynamics:**  
  The user wants "forward momentum," so questions should build: start with grounding, escalate to absurdity (too many thinkers), then test generality with historical cases.  

  **Final Checklist:**  
  ☐ 8-10 questions (no fluff)  
  ☐ Cover all three user requests  
  ☐ Pre-bunk "brute fact" escapes  
  ☐ Name-drop key philosophers (Chrysippus, Wiggins) to signal depth  
