prompt: |-
  I'm the newest member of my small housing co-op's three-person board, which also serves as the panel that hears rule-violation cases and decides whether to fine residents. Under our bylaws, a resident can be fined only if a violation occurred and a valid written warning was already on file for it. In our last case, one of us doubted the violation had actually happened, another doubted the warning was valid, and I accepted both, so a straight yes-or-no vote on the fine lost two to one. Yet a separate majority of us believed the violation happened, and a separate majority believed the warning was valid -- meaning that, taken one question at a time, the board had actually supported a fine. Our chair now wants every future case decided question by question rather than by a direct vote; the other member objects that this just lets whoever frames the questions control the outcome, and that only a direct vote reflects what the board actually decided. We need a standing rule before our next hearing. Please write the short memo I would circulate to my two colleagues, recommending which procedure the board should adopt going forward -- or a better alternative, if you think both are flawed -- with reasoning that fairly answers whichever side you do not take.
reasoning: |-
  Okay, the user is part of a three-person housing co-op board that handles rule violations and fines. They've encountered a problem where a fine wasn't approved because of a split vote, even though separately, a majority believed both the violation occurred and a warning was valid. Now they need to decide on a procedure for future cases: either voting on each question separately or sticking with a direct yes/no vote on the fine. 

  First, I need to understand the core issue. The bylaws require two conditions for a fine: the violation must have happened, and a valid written warning must be on file. In the last case, each board member had a different doubt—one doubted the violation, another doubted the warning—so the fine failed 2-1. But if you break it down, two members believed the violation happened (so majority on that), and two believed the warning was valid (majority on that too). So technically, the conditions were met, but the fine wasn't approved because the vote wasn't structured to reflect that. 

  The chair wants to switch to question-by-question voting to avoid this. The other member opposes it, arguing it could let the question-framer manipulate the outcome and that a direct vote better reflects the board's collective decision. The user needs a fair solution for a standing rule. 

  Hmm, the key is to balance fairness, accuracy, and simplicity. Question-by-question voting seems logical because it aligns with the bylaws' structure—both conditions must be met, so voting on them separately makes sense. It could prevent the inconsistency where the fine fails even when majorities support each element. But the objection about framing bias is valid; if the questions are worded poorly, it could sway the outcome. 

  The direct vote is simpler and feels more decisive, but it clearly failed in this case despite the board implicitly supporting the fine's prerequisites. That could lead to unjust outcomes where fines are denied when they shouldn't be. 

  Is there a middle ground? Maybe require that questions be neutral and predefined, like always asking: (1) Did the violation occur? (2) Was a valid warning on file? That way, framing isn't arbitrary. And if both pass, the fine is automatic. That addresses the manipulation concern. 

  The user's deeper need is probably for a procedure that's both fair and efficient, avoiding gridlock while upholding the bylaws. They might also want to reduce conflict on the board, since this disagreement could cause tension. 

  I'll recommend the question-by-question approach with safeguards: standard questions tied to the bylaw requirements, and perhaps a rule that questions can't be amended mid-hearing without good reason. That way, it's transparent and less open to manipulation. 

  For the memo, I should acknowledge both sides, explain why the alternative is better, and propose this as a solution. Keep it concise and collaborative, since they're colleagues. 

  Final thought: This approach reinforces the logic of the bylaws and should lead to more consistent decisions. It's a reasonable compromise.
answer: |-
  ## Memorandum: Proposed Hearing Procedure for Rule Violation Cases

  **To:** Co-op Board Members  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Standing Rule on Hearing & Fine Decision Procedure  

  Following our discussion about the recent hearing and the need for a clear standing rule, I recommend we adopt a **structured question-by-question voting procedure** for future cases, with specific safeguards. This addresses the flaw exposed in our last case while mitigating the concerns raised by both colleagues.  

  ### Why the Direct Vote Failed Us
  Our bylaws clearly state *two* prerequisites for a fine:  
  1. The violation occurred.  
  2. A valid written warning was on file.  

  A simple "yes/no" vote on the *fine itself* forces each member to weigh both conditions simultaneously in a single decision. As we saw, this can lead to an illogical outcome: the prerequisites for a fine (Condition A *and* Condition B) were met by majority opinion, yet the fine was rejected because individual members focused their "no" vote on different prerequisites. The direct vote did **not** accurately reflect the board's collective judgment on the *bylaw requirements*.  

  ### Why Structured Question-by-Question Voting is Better (with Safeguards)
  Adopting a procedure where we vote separately on each bylaw-mandated condition offers significant advantages:  

  1.  **Aligns with Bylaw Logic:** It directly mirrors the structure of our bylaws (Condition A *and* Condition B must be true).  
  2.  **Ensures Accurate Outcomes:** It prevents the contradictory result we experienced. If a majority finds Condition A true *and* a majority finds Condition B true, the fine proceeds logically. This reflects the board’s actual judgment on the necessary facts.  
  3.  **Enhances Transparency & Deliberation:** Focusing discussion on each element separately ensures a more thorough examination of the evidence for each critical requirement.  

  ### Addressing the Legitimate Concern: "Framing Bias"
  The objection that "whoever frames the questions controls the outcome" is valid. Therefore, our standing rule **must** include these safeguards:  

  *   **Standardized Questions:** The questions voted upon will *only* be the two prerequisites explicitly stated in the bylaws:  
      > (1) "Did the alleged violation occur?"  
      > (2) "Was a valid written warning for this specific violation on file prior to this hearing?"  
  *   **Predetermined Order:** These questions will always be posed in this order.  
  *   **No Ambiguity:** Questions will be stated precisely as above in every hearing.  
  *   **Chair Neutrality:** The Chair (or hearing officer) must present the questions neutrally, without commentary influencing interpretation.  

  This eliminates arbitrary framing. The questions are dictated solely by the bylaws, not by any member's discretion.  

  ### Why Not Stick with the Direct Vote?
  While a direct vote on the fine feels decisive, our recent experience proves it can produce outcomes that contradict the board's actual findings on the *legal prerequisites* set by our own bylaws. It fails to capture the nuanced reality of multi-factorial decisions and risks fines being denied when the bylaws' conditions are, in fact, met by majority opinion.  

  ### Recommendation
  I propose we adopt the following standing rule:  

  > **Hearing Decision Procedure:**  
  > In all rule-violation hearings, the Board shall vote separately on the following two questions, in order:  
  > 1.  "Did the alleged violation occur?"  
  > 2.  "Was a valid written warning for this specific violation on file prior to this hearing?"  
  > A resident may only be fined if a majority of the Board votes "Yes" on *both* questions.  

  This procedure:  
  *   **Upholds the Bylaws:** Strictly follows the "and" requirement.  
  *   **Ensures Accuracy:** Prevents outcomes contradicting the board's findings.  
  *   **Prevents Framing Bias:** Uses mandatory, bylaw-defined questions.  
  *   **Promotes Fairness & Consistency:** Applies the same clear structure to every case.  

  This approach resolves the flaw in the direct vote while neutering the risk of manipulation inherent in unstructured question framing. It ensures our decisions accurately reflect our collective judgment on the facts required by our governing documents. I urge us to adopt this rule before our next hearing.  

  I'm happy to discuss this further at our next meeting.
