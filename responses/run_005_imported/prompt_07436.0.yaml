  We are ranking five accounts based on how well they hold up against the accumulated evidence, including:
   - Trade-off cases (e.g., Machery's work that tries to strip out moral valence and focus on cost-benefit)
   - Omission variants (where the CEO fails to act, leading to harm/help)
   - Parallel effects on knowledge and causal judgments (e.g., Beebe and Buckwalter's findings on knowledge attributions)

   The five accounts:
   1. Knobe: Folk concept of intentional action is partly constituted by moral evaluation.
   2. Adams and Steadman: Pragmatic account (conversational appropriateness).
   3. Machery: Trade-off hypothesis (asymmetry driven by agent imposing cost on others for self-benefit, not moral valence per se).
   4. Sripada: Deep self concordance (whether outcome is concordant with agent's stable cares and values).
   5. Evaluative bias (general bias that affects multiple concepts, e.g., knowledge, causation).

   Steps:
   - Consider the evidence that challenges or supports each.

   Key Evidence:
   1. Trade-off cases (Machery, 2008): Designed to test if moral valence is necessary. He found that when the side effect is morally neutral but involves a trade-off (e.g., helping one group and harming another), the intentionality judgments track the negative outcome (harm) more than the positive. This suggests that the effect is not solely about moral valence but about the imposition of a cost. However, note that in these cases, the harm is still present and might be seen as negative. Machery's account is designed to explain the effect without moral valence, but his experiments still involve negative outcomes (costs) versus benefits.

   2. Omission variants (e.g., Cushman & Mele, 2008; Alfano et al., 2012): In omission cases, the CEO fails to act and this leads to harm or help. The side-effect effect is found in the harm condition (omission leading to harm is judged intentional) but not in the help condition. However, the effect is sometimes weaker or absent for omissions. This challenges accounts that rely on the structure of action (like the trade-off being an active imposition) and might support accounts that are more about the moral valence or the evaluative bias.

   3. Parallel effects: Beebe and Buckwalter (2010) found the same asymmetry for knowledge attributions (people are more likely to say the CEO knew the harm would happen than knew the help would happen). Similarly, for causal judgments (the CEO is seen as more causal for harm than for help). This suggests the effect is not specific to intentional action but might be a more general cognitive bias.

   Now, let's evaluate each account:

   1. Knobe's account (moral evaluation constitutes the concept of intentional action):
      - Strengths: Explains the original effect and why moral valence matters.
      - Weaknesses: The parallel effects (knowledge, causation) suggest it's not just about intentional action. Also, trade-off cases show that even without clear moral valence (but with a cost) the effect occurs, which might be explained by the cost being seen as morally bad. However, if the effect is found in non-moral trade-offs (e.g., harming the environment is a cost, but what if it's harming a neutral thing?), then it might challenge the necessity of moral valence.

   2. Adams and Steadman (pragmatics):
      - They argue that the concept is the same, but we use the word "intentionally" in conversation to blame or praise. In the harm case, saying "intentionally" is appropriate to blame; in the help case, saying "intentionally" would give undue credit so we avoid it.
      - Challenges: The parallel effects (knowledge, causation) are harder to explain. Why would the same pragmatic factors apply to "know" and "cause"? Also, experimental designs that control for conversational context (e.g., by not asking directly but using other measures) still show the effect.

   3. Machery (trade-off):
      - The asymmetry is due to the agent imposing a cost on others to benefit himself. This doesn't require moral valence (though costs are often negative). His experiments show that in trade-off scenarios without moral valence (e.g., harming the environment for profit is a trade-off, but if we reframe the harm as a neutral cost, like moving an office and thereby inconveniencing one department while helping another), the effect still holds for the negative outcome (inconvenience) but not the positive.
      - However, note that in the original harm case, harming the environment is both a cost and morally negative. So the trade-off hypothesis might be seen as a refinement that doesn't rely on moral valence per se but on the structure of the action (imposing a cost). But then, what about the omission cases? In omissions, the CEO doesn't impose a cost by acting but by not acting. Also, the parallel effects: does the trade-off account extend to knowledge? It might, if we think that knowledge attributions are also sensitive to costs.

   4. Sripada (deep self concordance):
      - The idea is that we judge an action as intentional if the outcome is concordant with the agent's deep self (values, cares). In the harm case, if the CEO doesn't care about the environment, then harming it is concordant with his values (since he values profit over environment). In the help case, helping the environment might not be concordant because he doesn't care about it. Thus, we judge harm intentional and help not.
      - Challenges: What if the CEO is environmentally conscious but still goes ahead? Sripada and Konrath (2011) found that when the agent has a positive attitude toward the environment, the intentionality judgment for harm decreases. However, the effect doesn't disappear. Also, omission cases and parallel effects? The deep self model might be specific to intentional action and not extend to knowledge or causation.

   5. Evaluative bias (general):
      - The effect is due to a general cognitive bias that affects multiple concepts (intentional action, knowledge, causation) when the outcome is negative (especially morally negative). This account is supported by the parallel findings in other domains. It also explains why the effect occurs for harm but not help: negative events attract more attention and trigger more attributions of agency, knowledge, etc.
      - Challenges: It doesn't explain the nuances in trade-off cases that are not clearly moral. Also, it might be too broad and not capture the specific conditions under which the effect occurs (e.g., why in some trade-offs the effect is stronger for harm).

