  I notice the user specifically mentions not wanting to equivocate between Tuesday/Wednesday while still making both Deb and Mark feel heard. That's a delicate balance. The medical facts are: Walter was declared brain dead Tuesday but kept on ventilator until Wednesday for organ donation. 

  For the eulogy structure, I'm considering:
  - Opening with warmth and celebration
  - Acknowledging the medical reality (brain death Tuesday) but framing Wednesday as when "his body stopped"
  - Using the organ donation as a bridge - his heart beating Wednesday allowed him to give life to others
  - Emphasizing Walter's essence/personhood was gone Tuesday
  - Closing with shared memories and healing

  Key phrases that might help:
  "Tuesday was when we lost Walter, Wednesday was when we let his body go"
  "His heart beat Wednesday so others' hearts could keep beating"
  "Death isn't an on/off switch but a process - Walter left us Tuesday"

  The motorcycle club members just want to remember Walter well, so vivid personal anecdotes will be crucial. I'll weave in sensory details - leather smell, engine sounds - to ground the tribute. 

