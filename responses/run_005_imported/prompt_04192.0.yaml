answer: |-
  This is a profound and beautifully articulated dilemma that cuts to the heart of moral philosophy. Your grandmother case is a potent challenge to both Humean conventionalism and Scanlonian contractualism. Let's dissect each theory's core commitments and their application to the case, assessing whether they can genuinely explain the residual obligation without illicit borrowing.

  **1. Hume's Conventionalism: The Core Commitments**

  *   **Foundation:** Obligations from promises arise *solely* from a beneficial social convention. There is no "natural" moral duty to keep promises prior to or independent of this convention.
  *   **Mechanism:** The convention works because:
      *   **Mutual Advantage:** Coordinated action (e.g., exchange, future planning) is vastly easier if people can create binding expectations via promises.
      *   **Mutual Expectation:** Everyone knows the rule ("Promises should be kept") and expects others to follow it because they know others expect *them* to follow it.
      *   **Stability & Incentive:** Adherence is self-reinforcing. Breaking a promise invites distrust and retaliation, harming the breaker and destabilizing the system. Keeping it maintains trust and the benefits of cooperation.
  *   **Source of Obligation:** The obligation stems from the *utility* of the convention for social cooperation and the *expectations* it generates within the social fabric. Breaking a promise primarily wrongs *society* by undermining the convention, and secondarily wrongs the *specific promisee* by frustrating the expectations *society's convention* led them to form.
  *   **Key Limitation:** The obligation is inherently *social and systemic*. If an act of promise-breaking has *no discernible impact* on the convention's stability or anyone's expectations (present or future), the Humean obligation dissolves.

  **Application to the Grandmother Case:**
  *   **Strict Humean Verdict:** No binding obligation remains.
      *   **No Systemic Impact:** The promise was unwitnessed and unrepeatable. Breaking it cannot damage the general practice of promising, as no one learns of it. It doesn't erode trust in you generally, nor does it provide a bad example others might follow.
      *   **No Frustrated Expectations/Harm:**
          *   **Grandmother:** She no longer exists. She cannot experience disappointment, have her expectations frustrated, or suffer harm from reliance. Her past expectations are irrelevant to the *present* utility and stability of the convention.
          *   **Others:** No one else knew of the promise or formed expectations based on it. No potential for reliance or harm exists.
  *   **Can It Explain the Intuition?** On its own strict terms, **no.** Humeanism struggles profoundly with this case. The intuition of wrongness persists despite the *complete absence* of the social conditions (impact on convention, frustrated expectations/harm) that generate the obligation for Hume.
  *   **Risk of Illicit Importation:** A Humean might *try* to salvage it by appealing to:
      *   **Personal Integrity/Habit:** "Breaking promises, even secret ones, corrupts your character or weakens your habit of fidelity, which *might* have future social consequences." But this stretches Hume's systemic focus. Integrity isn't the *source* of the obligation for Hume; it's a potential *byproduct* of adhering to the useful convention. If there's truly *zero* risk of future impact (a big 'if', but stipulated in the case), this weakens.
      *   **"What Society Would Think":** "Even unwitnessed, breaking it would be wrong *if* society knew." But Hume grounds the obligation in the *actual* social mechanics and consequences, not counterfactual societal disapproval divorced from real-world impact. The wrongness arises from the *actual* damage to the system, not the hypothetical judgment of an observer.

  **2. Scanlon's Contractualism (Principle F): The Core Commitments**

  *   **Foundation:** The wrongness of breaking a promise stems from a violation of a fundamental moral principle (Principle F), justifiable through a contractualist framework (no one could reasonably reject principles permitting such behavior, given their interests).
  *   **Principle F (Principle of Fidelity):** "If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A’s not doing so); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X unless B consents to X’s not being done."
  *   **Mechanism:** Breaking a promise is wrong because it:
      *   **Manipulates Trust:** You intentionally created an expectation to get the benefit of the other person's trust or reliance.
      *   **Fails to Justify:** You cannot justify to the promisee why you frustrated the expectation you deliberately induced. It's a failure of justifiability to the specific individual wronged.
  *   **Source of Obligation:** The obligation stems from the *moral wrong done to the specific promisee* by manipulating their trust and frustrating the expectation *you intentionally created in them*. It's a direct interpersonal wrong.
  *   **Key Limitation:** The obligation is inherently *interpersonal* and requires the *promisee* to be capable of forming expectations and being wronged *at the time the promise is made and potentially when it's broken*. Harm/Disappointment isn't strictly necessary (the wrong is in the manipulation/frustration), but the promisee must *exist* as a moral patient who *could* be wronged.

  **Application to the Grandmother Case:**
  *   **Strict Scanlonian Verdict (Initial):** No binding obligation remains *if the wrong requires harming/wronging an existing person at the time of breaking*.
      *   **No Existing Promisee:** At the time you consider skipping the trip, your grandmother no longer exists. She cannot be manipulated, have her trust abused, or have her expectations frustrated *now*. Principle F's mechanism targets *present* moral patients.
      *   **Past Wrong?** Scanlon might argue the *act* of breaking the promise *is* the wrong, but it's hard to see how breaking it *after* her death wrongs *her* if she no longer exists to be wronged. The conditions for Principle F (especially the assurance and knowledge components) seem temporally bound to the promisee's existence.
  *   **Can It Explain the Intuition?** On the simplest reading focusing solely on Principle F and *present* wronging, **it struggles.** The core mechanism – manipulating/frustrating the promisee – seems inapplicable once the promisee ceases to exist.
  *   **Potential Resources Within Scanlonian Framework (Less Illicit?):**
      *   **Principle D (Duty to Comply):** Scanlon acknowledges other principles. Principle D states we have a duty not to deprive others of what they are owed (e.g., by theft, killing). Could the grandmother be "owed" the fulfillment, creating a duty under D? This requires arguing that the *act of promising created a debt* that persists after death. Scanlon *might* be more open to this than Hume, grounding it in the value of the promisee's will/autonomy respected at the time. *Is this illicit?* It stretches Principle F but appeals to another contractualist principle arguably related to the value protected by fidelity (respecting the will/expectations we invoked). It's less "natural duty" and more "extended contractualist duty."
      *   **The Significance of the Act of Promising:** Scanlon emphasizes the *deliberate creation of an expectation/binding obligation* itself. The *act* of making the promise under those conditions might generate an enduring obligation *to perform*, even if the specific wrong of *frustration* can't occur later. The obligation exists *because* you invoked the practice and its norms. *Is this illicit?* It pushes Scanlon towards a more deontic view of the promise-act itself, potentially supplementing Principle F.
      *   **What She Wanted/Expected:** This is the trickiest. Scanlon *could* argue that breaking the promise *disrespects* what she *wanted and expected while alive*, and that reasonable people couldn't reject principles requiring respect for the seriously-held wishes of the deceased (linking to Principle D or a principle of respect). *Is this illicit?* This *does* import something external to Principle F – the significance of past wishes – but Scanlon's contractualism provides a framework (reasonable rejectability based on generic reasons) to potentially justify such a principle.

  **Comparison & Evaluation in the Grandmother Case:**

  1.  **The Challenge:** Both theories face significant difficulty explaining the *strong* intuition of wrongness. Hume's theory lacks the social context; Scanlon's theory (on its primary Principle F mechanism) lacks a present moral patient to wrong.
  2.  **Hume's Struggle:** Feels more severe. The obligation is *defined* by its social utility and impact. The case meticulously removes *all* social impact. Any appeal to integrity or hypothetical societal judgment feels like abandoning the core conventionalist premise. **It genuinely cannot explain the obligation on its own terms without illicitly importing non-conventional elements (like inherent wrongness or duties to the dead).**
  3.  **Scanlon's Potential:** While Principle F alone struggles, Scanlon's broader contractualist framework offers *more plausible internal resources*.
      *   Principle D (duty to comply/not deprive) *can* be interpreted to cover obligations created by promises that survive the promisee's death, framing it as depriving her of what she was owed.
      *   The emphasis on the *act* of promising creating a binding obligation has a more deontic flavor compatible with the intuition.
      *   Contractualism *can* potentially justify a principle of respecting the serious wishes of the deceased based on generic reasons (e.g., we all have an interest in our posthumous wishes being respected, so couldn't reasonably reject such a principle). This integrates the "what she would have wanted" factor in a way *internal* to the theory's methodology (reasonable rejectability).
  4.  **Which Comes Out Ahead?** **Scanlon's contractualism emerges as more resilient.** While Principle F alone falters, the broader structure of contractualism provides avenues (Principle D, the significance of the promise-act, justifying principles for the deceased) to accommodate the intuition *without abandoning the core approach*. It can explain the obligation as a *duty owed to the grandmother* (even posthumously, via the obligation created while alive) grounded in principles no one could reasonably reject. Hume's conventionalism, by contrast, is fundamentally undermined by the removal of the social context; its core explanatory mechanism is absent.

  **Conclusion:**

  You and your friend were right that the grandmother case poses deep problems for both simplified versions. However, upon closer examination:

  *   **Hume's conventionalism** is decisively refuted by the case on its own terms. The obligation it describes simply doesn't exist in the stipulated scenario. Explaining the intuition would require abandoning conventionalism for a different foundation (e.g., a natural duty, inherent significance of promises, or duties to the dead).
  *   **Scanlon's contractualism** faces a serious challenge with Principle F alone, but **its broader framework offers credible internal resources** (especially Principle D and the justification of principles respecting the deceased) to explain the residual obligation. It can argue the wrong lies in violating a duty *to the grandmother* created by the promise and grounded in principles protecting autonomy/expectations that are reasonably non-rejectable, even extending to posthumous fulfillment. This doesn't feel like illicit importation; it's deploying the full machinery of contractualist justification.

  Therefore, **Scanlon's account comes out ahead.** It better preserves the intuition that the wrong is *to your grandmother*, and its flexible structure allows it to accommodate the unique features of the case without sacrificing its core commitments. The case highlights that Principle F might need supplementation *within the contractualist system* (e.g., by a principle like D or one concerning the deceased), but this supplementation is organic to the theory, not an external graft. Hume's theory, brilliant for explaining the social practice, seems genuinely incapable of capturing deeply personal, posthumous promises. Your dinner debate uncovered a genuine asymmetry in the explanatory power of these two influential theories.
