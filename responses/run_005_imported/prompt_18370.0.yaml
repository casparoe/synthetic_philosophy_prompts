answer: |-
  ## The Persistent Shadow: Why Old Evidence Haunts but Doesn't Destroy Bayesian Confirmation

  The problem of old evidence, forcefully articulated by Clark Glymour, strikes at the heart of Bayesian confirmation theory (BCT). If evidence E is already known with certainty (P(E) = 1), then conditioning on E cannot change the probability of any hypothesis H (P(H|E) = P(H)). Yet, history brims with cases like Mercury's perihelion precession, an established fact long before Einstein, which demonstrably confirmed General Relativity (GR) upon the discovery of its entailment. This dissonance between formal BCT and scientific intuition poses a profound challenge. While not *fatally* dismantling the Bayesian framework, the problem’s stubborn persistence over decades reveals deep structural limitations, exposing the need for significant concessions or supplementation. Neither the Garber-Jeffrey solution nor counterfactual approaches fully resolve the issue without incurring substantial costs that strain the core Bayesian ambition of a single, comprehensive, and purely probabilistic model of rational belief.

  **The Garber-Jeffrey Gambit: Learning Entailment, Sacrificing Precision**

  Daniel Garber and Richard Jeffrey proposed a compelling escape: deny agents logical omniscience. An agent may know E and H separately, yet be unaware that H entails E (H ⊧ E). Discovering *this logical relationship* constitutes genuinely new evidence, distinct from E itself. Conditionalizing on the proposition L: "H entails E" *can* rationally increase P(H), even if P(E) = 1. Formally, P(H | L) > P(H). The agent learns not new facts about the world (E), but a new fact about the logical structure connecting their beliefs.

  **The Standard Worry Realized:** While this move salvages the *possibility* of confirmation by old evidence, it fundamentally weakens the *predictive and normative power* of BCT. The core worry is devastating: **How does the Bayesian agent assign P(L) or P(H | L)?** The probability of a logical truth (if H indeed entails E, L *is* a logical truth) is not constrained by empirical evidence in the way ordinary contingent propositions are. Garber-Jeffrey effectively relocate the problem from conditioning on E to assigning priors to logical discoveries. What should P("GR entails Mercury's precession") be for a pre-1915 physicist? Is it high because GR is elegant? Low because it's revolutionary? Based on the perceived complexity of the derivation? The machinery of Bayesian updating provides no principled guidance here. The "confidence boost" P(H | L) / P(H) becomes essentially unmoored from the formal apparatus of Bayes' theorem and hinges entirely on arbitrary or psychologically contingent prior assignments to logical propositions. This sacrifices the very objectivity and constraint that made BCT attractive. It reduces confirmation to a subjective assessment of logical plausibility, leaving Bayesianism as a thin shell around a process it cannot rigorously govern. The size of the boost isn't dictated by Bayesian rationality; it's smuggled in through the prior on L.

  **The Counterfactual Retreat: Shifting Ground, Inviting Arbitrariness**

  Faced with Garber-Jeffrey's subjectivity, others propose relocating confirmation to a *counterfactual* credence function. Confirmation isn't about how *actual* credence changes upon learning E (which is impossible if P(E)=1), but about how credence *would have* changed *if* E had been learned *de novo*, holding fixed other background knowledge K. We compare P_{actual}(H) with P_{counterfactual}(H | E), where the counterfactual credence function is the one the agent *would have had* just before learning E, or perhaps a function where E is "subtracted" from current belief.

  **The Standard Worry Realized:** This approach immediately confronts the **subtraction problem**. How do we rigorously define the counterfactual credence function P* where E is *not* known, but *all relevant background knowledge K is retained*? Knowledge is holistic; beliefs are interconnected. "Subtracting" E inevitably affects the probabilities of propositions logically or evidentially related to E and H. Consider Mercury: Removing knowledge of its anomalous precession likely alters the physicist's credence in Newtonian mechanics, celestial mechanics models, the reliability of astronomical data, and potentially even the perceived promise of rival gravitational theories. Holding "everything else fixed" is impossible because the web of belief is a seamless fabric.

  Defining P* requires specifying *exactly* which beliefs are held fixed and how E's absence propagates through the network. This process is inherently **arbitrary** or relies on **unprincipled stipulations** external to Bayesianism itself. Do we hold fixed the failure of *all other* attempted explanations for Mercury? Do we hold fixed the precise state of astronomical technology? The resulting counterfactual boost P*(H | E) / P*(H) is highly sensitive to these stipulations. This reintroduces the very kind of subjective, non-algorithmic judgment that Bayesianism sought to replace with precise credence functions and conditionalization. It essentially smuggles in a narrative about "how things would have been" without providing the Bayesian tools to construct that narrative objectively. The counterfactual move saves the *form* of conditionalization but abandons the core Bayesian ideal of a single, actual, dynamically updated credence function representing total epistemic state.

  **The Verdict: A Wound that Won't Heal, But Not a Fatal Blow**

  The persistence of the old evidence problem across four decades is not an accident; it is a symptom of a fundamental tension within the Bayesian project. **The problem is not fatal in the sense of rendering BCT utterly useless.** Bayesian updating remains a powerful, often indispensable, tool for modeling belief revision with *new* evidence and under conditions of uncertainty. Its core insights about proportionality to likelihoods and prior probabilities are robust.

  However, the old evidence problem **is fatal to the ambition of a single, static (or sequentially updated) credence function serving as a complete and self-sufficient theory of confirmation.** Both major families of solutions highlight this:

  1.  **Garber-Jeffrey:** Preserves the centrality of the actual credence function but fractures the Bayesian ideal by making the confirmation of empirical hypotheses critically dependent on unconstrained prior probabilities assigned to *logical* facts. This dissolves the objective empirical core of confirmation into subjective logical epistemology.
  2.  **Counterfactual Approaches:** Preserves the formal mechanism of conditionalization but abandons the actual credence function as the sole locus of confirmation. It pushes the crucial work into an ill-defined, stipulative counterfactual state, sacrificing the coherence and unity of the Bayesian model.

  **The cost worth paying is an acknowledgment of incompleteness.** BCT provides crucial tools for *part* of the confirmation story – primarily the assimilation of new, uncertain evidence. However, the confirmation provided by the *integration* of a hypothesis with *existing, certain* evidence – the revelation of explanatory power – requires resources beyond the kinematics of a single probability distribution updated by conditionalization. This integration involves dynamic elements of **logical learning** (recognizing entailments) and **explanatory coherence** (assessing how well H fits E within the broader web of belief), processes that Bayesian kinematics alone cannot fully capture without introducing problematic subjectivity (Garber-Jeffrey) or arbitrary counterfactuals.

  The problem of old evidence thus stands as a permanent monument to the limits of the strict Bayesian paradigm. It shows that no single, static credence function can fully play the multifaceted role assigned to it. Bayesianism remains a powerful engine for belief revision, but the garage of scientific confirmation requires other tools alongside it. The cost of acknowledging this limitation is worth paying, for it leads to a more honest and nuanced understanding of how evidence – both old and new – truly shapes our theories.
