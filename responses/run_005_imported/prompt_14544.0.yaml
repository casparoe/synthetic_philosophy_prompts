prompt: |-
  So a few of us who met through an old SSC meetup have been running a tiny philosophy podcast on the side for about a year (maybe 60 listeners, mostly other lesswrong lurkers lol). Next episode's guest is a moral philosopher who defends expressivism/quasi-realism -- the "moral claims express attitudes, not beliefs" line, basically the Blackburn tradition. I went back and reread Yudkowsky's old metaethics sequence over the weekend and realized it kind of skips past the Frege-Geach problem entirely, so I fell down a rabbit hole on the actual literature and now I want to press her on it instead of letting her just restate the slogan.

  Can you write me 8-10 interview questions? Skip the "what got you into philosophy" warm-up stuff. I want at least one question that makes her walk through the embedding puzzle itself -- why "if lying is wrong then getting your kid brother to lie is wrong; lying is wrong; therefore..." is a plainly valid argument even though the minor premise supposedly isn't stating a fact -- one on whether her fixes for that amount to what critics call creeping minimalism (she's quietly helped herself to so much realist-sounding machinery that theres no real difference left between her view and the realism shes rejecting), and one on the negation problem specifically: what attitude is being expressed by the negation of a moral claim, and why that's harder to cash out than it sounds. For each question, give me a one-line note on the dodge she'll probably reach for and a sharper follow-up that actually closes it off. I want to find the real crux here, not just get her polished elevator-pitch answer again.
reasoning: |-
  Okay, the user is part of a small philosophy podcast focusing on LessWrong/SSC themes, preparing to interview a moral philosopher who defends expressivism/quasi-realism. They want incisive questions targeting the Frege-Geach problem, creeping minimalism, and the negation problem, with strategies to counter expected dodges. 

  Hmm, the user is clearly well-read—they mention Yudkowsky's metaethics sequence and academic terms like "creeping minimalism" casually—but frustrated by surface-level debates. Their tone ("polished elevator-pitch answer") suggests they’ve heard the usual defenses and want to force the guest beyond scripted responses. The real ask here is epistemic grit: they want to expose whether quasi-realism collapses under its own machinery or holds water. 

  Breaking it down:  
  First, the Frege-Geach embedding must be addressed head-on. Expressivists struggle because moral claims in logical arguments (like modus ponens) behave like truth-apt propositions, but their theory says they’re just attitudes. The guest will likely retreat to "attitude consistency" or "plan endorsement" à la Blackburn. The sharp follow-up should corner her: *If validity relies on propositional structure, why isn’t that realism in disguise?*  

  Then, creeping minimalism—the worry that quasi-realists "borrow" so much realist language (truth, facts, objectivity) that their anti-realism becomes vacuous. She’ll probably distinguish "quasi-truth" from robust truth. Counter: *If your "truth" tracks all the same things realists’ does, what’s left of the disagreement?* This targets the meta-level: is expressivism a substantive alternative or verbal sleight-of-hand?  

  Finally, the negation problem. Saying "murder isn’t wrong" can’t just be "not disapproving of murder"—that’s too weak (indifference isn’t negation). She might invoke higher-order attitudes ("disapproving of approving"). The killshot: *Why doesn’t this regress explode into infinite attitudes?* If negation requires new mental states ad infinitum, the theory implodes.  

  Structure-wise:  
  - Lead with embedding to ground the technical challenge.  
  - Creeping minimalism next to highlight theoretical costs.  
  - Negation last as the nuclear option—it’s the hardest for expressivists.  
  Each follow-up should force admission of either realist borrowing or unresolved flaws. The user wants blood, not kumbaya.  

  ...Also, 60 listeners is humble, but SSC lurkers are viciously smart. No pressure.
answer: |-
  Here are 9 targeted questions designed to force engagement with the core tensions in expressivism, with anticipated dodges and surgical follow-ups. Focus on **Frege-Geach**, **creeping minimalism**, and the **negation problem**:

  ### Core Setup: The Embedding Puzzle
  1. **Question:** "Walk us through how expressivism handles the validity of modus ponens with moral premises, like: *'If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong.'* If the minor premise ('lying is wrong') expresses a non-cognitive attitude, not a truth-apt belief, what gives the whole argument its logical force?"  
     *Dodge Anticipated:* She’ll likely say moral arguments enforce *consistency in planning/attitudes* rather than truth-preservation.  
     **Follow-Up:** "But doesn’t treating 'validity' as mere attitude-consistency *change the subject*? When realists say modus ponens is valid, they mean truth is preserved across propositions. If you’re not preserving truth, why call it 'valid' at all? Isn’t this just redefining logic to fit expressivism?"

  ### The Creeping Minimalism Trap
  2. **Question:** "Simon Blackburn says quasi-realism aims to 'earn the right' to realist-sounding language (truth, facts, knowledge) without ontological commitments. But what stops this from collapsing into what Dreier calls 'creeping minimalism'—where your view becomes *functionally indistinguishable* from realism once all the machinery is in place?"  
     *Dodge Anticipated:* She’ll distinguish "quasi" facts (projected attitudes) vs. "robust" facts (mind-independent).  
     **Follow-Up:** "If both realists and quasi-realists say *'Torture is wrong' is true* (with identical truth-conditions in practice), and both accept moral reasoning, disagreement, and fallibility, what *experimental or conceptual test* could possibly tell them apart? Where’s the substantive disagreement?"
  3. **Question:** "When you say moral claims can be 'objectively justified' or 'true,' what work is 'quasi-' doing here that a Cornell realist wouldn’t accept? Isn’t your 'projection' just a psychological gloss on what realists call 'detection'?"  
     *Dodge Anticipated:* Appeal to *metaphysical economy* (no extra moral properties).  
     **Follow-Up:** "But if Cornell realists ground moral properties in natural ones (e.g., suffering), and you ground 'wrongness' in stable attitudes toward natural properties, why isn’t this just a verbal dispute? Both trace morality to natural facts + human responses."

  ### The Negation Problem (Schroeder’s Challenge)
  4. **Question:** "If 'Murder is wrong' expresses disapproval of murder, what does 'Murder is not wrong' express? Is it *indifference* to murder? *Tolerance*? Or something else?"  
     *Dodge Anticipated:* She’ll say it expresses *withholding disapproval* or *failing to endorse condemnation*.  
     **Follow-Up:** "But withholding disapproval is compatible with indifference or uncertainty—whereas 'not wrong' actively *denies* the moral claim. If I say 'Murder isn’t wrong' in response to your condemnation, I’m not just *not disapproving*; I’m rejecting your attitude. What mental state captures that?"
  5. **Question:** "Can expressivism explain why 'Murder is not wrong' and 'Murder is permissible' feel equivalent, while 'Murder is not wrong' and 'I don’t disapprove of murder' do not? What’s the *expressive content* of permissibility that differs from mere absence of disapproval?"  
     *Dodge Anticipated:* Appeal to higher-order attitudes (e.g., "disapproving of disapproval").  
     **Follow-Up:** "Doesn’t this lead to a regress? If 'permissible' = 'disapproval of disapproval', what does 'not permissible' express? Disapproval of disapproval of disapproval? How is this psychologically plausible?"

  ### Pressing the Quasi-Realist Machinery
  6. **Question:** "In unembedded contexts, you’ll say 'Genocide is wrong' expresses horror. But in a disjunction like 'Either genocide is wrong or jazz is evil,' what non-cognitive state am I expressing? How can a single attitude embed in a Boolean operator without truth-apt content?"  
     *Dodge Anticipated:* "We express *states of planning* that accept certain inferences."  
     **Follow-Up:** "If the content of the disjunction is fixed by its inferential role (e.g., licensing modus tollens), how is this different from assigning it propositional content? Isn’t inferential role semantics what realists use?"
  7. **Question:** "How does expressivism handle *moral fallibility*? If I say 'Slavery might not have been wrong,' I’m not expressing uncertain disapproval—I’m considering a counterfactual where my attitudes are mistaken. How can quasi-realism explain this without sneaking in a realist error theory?"  
     *Dodge Anticipated:* "We can be wrong about what our *idealized selves* would endorse."  
     **Follow-Up:** "But if your 'ideal self' tracks mind-independent reasons (e.g., suffering), haven’t you rebuilt realism? If not, why call it 'error' rather than 'attitude drift'?"

  ### The Big Picture
  8. **Question:** "What would falsify quasi-realism? If neuroscience showed moral judgments activate belief-like neural patterns, not desire-like ones, would that matter? Or is expressivism insulated from empirical evidence?"  
     *Dodge Anticipated:* "Neuroscience can’t settle *semantic* questions."  
     **Follow-Up:** "If expressivism’s core claim—'moral judgments are desire-like'—isn’t testable against psychology, what *is* its empirical content? Is it just a linguistic proposal?"
  9. **Question:** "Put bluntly: Isn’t quasi-realism a *stable* position only because it systematically obscures its commitments? When pressed on logic, you borrow realism’s tools; when pressed on metaphysics, you retreat to non-cognitivism. How is this not intellectual bait-and-switch?"  
     *Dodge Anticipated:* "We’re explaining how realist *talk* works without realist *metaphysics*."  
     **Follow-Up:** "But if the explanation *requires* functionally realist resources (truth-aptness, logical constraints), haven’t you surrendered the game? What distinctively *anti*-realist work does expressivism do in 2024?"

  ---

  ### Key Tactics
  - **Pre-empt the slogans:** Follow-ups cut off retreats to "attitude expression" or "earning the right" by demanding *mechanistic* explanations.
  - **Force disambiguation:** Questions 2, 3, and 7 pressure her to either embrace minimalism or admit quasi-realism adds nothing.
  - **Negation is lethal:** Questions 4 and 5 target expressivism’s weakest spot—Schroeder showed most solutions regress or collapse.
  - **Corner with science:** Question 8 exposes quasi-realism’s potential unfalsifiability.

  **Goal:** Trap her in a dilemma: Either quasi-realism functionally reduces to realism (losing its anti-realist edge), or it can’t handle logic/negation (losing its plausibility). No third way.
