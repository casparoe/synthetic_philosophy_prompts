prompt: |-
  Random rabbit hole today: turns out George Berkeley (yeah, the 'to be is to be perceived' guy) also wrote this whole tract called The Querist thats basically just page after page of questions about money and economics. His big claim seems to be that money isn't wealth itself, just a kind of ticket or counter for moving value around, and that it doesnt really matter what the ticket is made of (metal, paper, whatever) as long as people trust it and it keeps circulating. We've been kicking around adding some kind of in-app points/token system at my startup, and it got me wondering what Berkeley would actually make of it. Can you walk me through the most important implications of his views on money for how I should think about designing something like that? Mainly curious whether his logic holds up or breaks down somewhere once you get to modern digital/virtual money.
