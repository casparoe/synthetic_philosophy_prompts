answer: |-
  Your reconstruction of the Diaconescu-Goodman-Myhill argument is **intuitionistically valid** and correctly highlights the core tension between Choice and constructivity. Let's break down your steps, clarify the logic, and address your questions about blame and the "secretly classical" claim.

  ---

  ### **Step-by-Step Validation of Your Argument**
  1. **Separation Forms A and B**:  
     - `A = {x ∈ {0,1} : x = 0 ∨ p}` and `B = {x ∈ {0,1} : x = 1 ∨ p}` are both inhabited (0 ∈ A, 1 ∈ B).  
     - **Validity**: Unrestricted Separation is allowed here. Constructively, `A` and `B` are sets, but their elements depend on the undecided proposition `p`.

  2. **Apply Choice to {A, B}**:  
     - Choice gives a function `f` such that `f(A) ∈ A` and `f(B) ∈ B`.  
     - **Validity**: This uses the Axiom of Choice (AC) for a pair of sets. Nothing fishy yet.

  3. **Decide Equality of f(A) and f(B)**:  
     - Since `{0,1}` has decidable equality, `f(A) = f(B) ∨ f(A) ≠ f(B)` holds.  
     - **Validity**: Constructively, equality of natural numbers (or finite sets like `{0,1}`) is decidable. This is safe.

  4. **Case: f(A) ≠ f(B)**:  
     - If `p` were true, then `A = B = {0,1}` (since both sets contain 0 and 1).  
     - But if `A = B`, then `f(A) = f(B)` (because `f` is a **function** – same input implies same output).  
     - Contradiction: `f(A) ≠ f(B)` and `f(A) = f(B)`. Thus, `¬p`.  
     - **Your concern (step 4)**: This is valid. The key insight is that if `p` is true, `A` and `B` are extensionally equal (same elements), so `f` must assign the same value to both. This is intuitionistically sound.

  5. **Case: f(A) = f(B)**:  
     - `f(A) ∈ A` → `f(A) = 0 ∨ p`.  
     - `f(B) ∈ B` → `f(B) = 1 ∨ p`.  
     - Since `f(A) = f(B)`, we have `(f(A) = 0 ∨ p) ∧ (f(A) = 1 ∨ p)`.  
     - If `f(A) = 0`, then `0 = 1 ∨ p`; since `0 ≠ 1`, we get `p`.  
     - If `f(A) = 1`, then `1 = 0 ∨ p`; again, `0 ≠ 1` forces `p`.  
     - **Validity**: Constructively, if `f(A) = f(B)`, then `p` must hold.  

  **Conclusion**: `p ∨ ¬p` (excluded middle) holds for arbitrary `p`.  
  ✅ **All steps are intuitionistically valid**.

  ---

  ### **What Deserves the Blame? Choice vs. Separation**
  - **Both are necessary, but Choice is the active catalyst**:  
    - **Unrestricted Separation** creates sets `A` and `B` whose definitions depend on an undecided proposition `p`. This is non-constructive but doesn’t *by itself* imply excluded middle.  
    - **Choice** forces a decision: it extracts a specific element from `A` and `B`, collapsing the ambiguity in `p` by making a concrete selection. It turns the potential vagueness of `p` into a binary outcome.  
    - **Analogy**: Separation writes a blank check ("there might be an object satisfying this vague condition"), but Choice cashes it ("here is the object – now decide if it satisfies your condition").  

  - **Why constructivists restrict both**:  
    - Bishop-style constructivism uses **restricted Separation** (e.g., only for decidable formulas) and **weak Choice principles** (e.g., countable/dependent choice).  
    - In your proof, if Separation were limited to decidable `φ`, you couldn’t define `A` and `B` using an undecided `p`. If Choice were weakened (e.g., to computable functions), you couldn’t "force" a selection for arbitrary sets.  

  ---

  ### **Is Choice "Secretly Classical"? Fair or Overstatement?**
  - **Fair for a general readership**, with two caveats:  
    1. **Context matters**: In **classical logic**, AC is "innocent" (Zermelo used it to prove well-ordering). In **constructive settings**, AC is a Trojan horse for excluded middle – as your proof shows.  
    2. **Clarify the loophole**: Emphasize that Choice is only "classical" **when combined with unrestricted Separation**. In systems like **Martin-Löf type theory** (see below), Choice is constructive because Separation is tamed.  

  - **Suggested phrasing**:  
    > "The axiom of choice, when paired with the ability to define sets using undecided propositions, secretly enforces the black-and-white worldview of classical logic – a dealbreaker for constructivists who value nuance and computability."  

  ---

  ### **Why Martin-Löf Type Theory Trivializes "Choice"**
  - **The disconnect**: In type theory, "choice" isn’t an axiom – it’s a **theorem** that follows from the meaning of existence.  
    - **Key difference**: A proof of `∀x ∃y φ(x,y)` **is** a computable function: it hands you a `y` for each `x`.  
    - There’s no "selection from a set" – existence is inherently algorithmic.  
  - **Why it’s not a contradiction**: Type theory lacks **unrestricted Separation**. Sets (types) are defined constructively, so you can’t create "pathological" sets like `A` and `B` above.  

  ---

  ### **Recommendations for Your Piece**
  1. **Keep your proof sketch**: It’s correct and vividly illustrates the conflict.  
  2. **Explicitly note the role of extensionality**: When `p` is true, `A = B`, so `f(A) = f(B)` because functions respect equality. This resolves your step-4 concern.  
  3. **Acknowledge the "co-conspirators"**: Say:  
     > "Choice forces excluded middle here because it interacts explosively with the non-constructive definition of sets via Separation."  
  4. **Mention type theory**: Briefly note that in systems like Martin-Löf’s, "choice" is constructive because the rules block Diaconescu’s trick.  

  This theorem is indeed the crown jewel for explaining why constructivists treat Choice like volatile dynamite. Your take is spot-on: unrestricted Choice isn’t logic-neutral – it’s a classical wolf in constructive sheep’s clothing.
