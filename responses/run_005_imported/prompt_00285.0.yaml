prompt: |-
  I'm on my university's IRB and we keep debating whether a study protocol counts as "minimal risk." The thing is, each individual tweak someone proposes (adding one more survey question about drug use, extending the interview by 10 minutes, etc.) seems totally fine on its own, but after a dozen of these small additions the board suddenly feels like the study has become way riskier than what we originally approved. Nobody can point to the exact change that tipped it over though. Is there a principled way to think about this, or are we just doomed to argue about where to draw the line every time?
