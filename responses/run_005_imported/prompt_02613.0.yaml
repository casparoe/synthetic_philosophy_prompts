prompt: |-
  So I'm a philosophy PhD student working on phil of biology, and this semester I've been sitting in on the evolutionary biology department's journal club because my dissertation chapter is on the units of selection debate. Last week we spent two sessions on the Nowak, Tarnita and Wilson paper from 2010 (the Nature one where they formally challenge kin selection and argue that eusociality in ants, bees and wasps is actually better explained by group selection). I knew going in that the paper caused a ton of blowback -- my advisor mentioned something like 137(!) researchers signed onto a rebuttal defending inclusive fitness theory -- but after actually reading both papers back to back, it honestly seems like the group-selection side had the stronger case, which is presumably why E.O. Wilson himself, the guy who helped put kin selection on the map in the first place with his sociobiology stuff in the 70s, ended up abandoning it.

  For my lit review chapter I want to represent this accurately: should I be treating inclusive fitness / kin selection as basically a superceded theory at this point, with group selection as the empirically vindicated successor, at least for eusocial insects? My advisor just says "it's complicated" every time I bring it up, which doesn't help much when I'm trying to write one clean paragraph on where the field actually landed on this. Is there a real fact of the matter about which side "won" this round of the units-of-selection debate, and if my read on the situation is off, i'd genuinely like to know where.
