  The narrow content question is tricky. Both thought experiments obliterate the standard internalist notion, but perhaps I should mention Fodor's salvage attempt with "narrow functional role" as a compromise. Though for literary purposes, emphasizing the radical externalism probably serves their theme better. 

  Wait - their friend's intervention suggests they move in intellectually sophisticated circles. Better avoid oversimplification. Should clarify that Burge's scenario doesn't need physical differences precisely because it targets social practice. That's why it's such a powerful complement to Putnam. 

  Noticing they didn't ask about implementation, but I'll volunteer narrative advice anyway. The "ailment with community-specific definitions" idea is spot-on. Suggest fictionalizing the condition to avoid medical inaccuracies - maybe "gray fever" that means different things on each planet. The pivotal scene writes itself: one twin suffers symptoms outside their community's definition, creating existential dissonance when they learn the other planet includes it. 

