  - Is Mia's objection about common knowledge unraveling a genuine problem? It is a known critique. The backward induction argument is vulnerable to any uncertainty about the rationality of the other player. If there is even a small probability that the other player is not rational (or might deviate), then it might be rational to pass in the early rounds. This has been discussed in the literature (for example, in the Centipede game, which this game resembles).

