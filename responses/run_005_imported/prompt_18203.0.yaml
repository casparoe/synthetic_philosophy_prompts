  The structure:
  - Turn 1: Dan (we assume Dan is first, but the structure is symmetric until the last moves)
  - Turn 2: Mia
  - Turn 3: Dan
  - Turn 4: Mia
  - Turn 5: Dan
  - Turn 6: Mia

  But note: the problem says "over as many as six turns", meaning that the game might end before. Also, on the sixth turn, if it is a pass, then the game ends without doubling and splits 50-50.

  Dan's argument: Backward induction.

  Step 1: Consider turn 6 (Mia's turn). The pot at turn 6 would be $5 * 2^5 = $160 (if all previous passes). Why? Because:
    Start: turn 1: $5
    After turn 1 pass: $10
    After turn 2 pass: $20
    After turn 3 pass: $40
    After turn 4 pass: $80
    After turn 5 pass: $160 (and then turn 6 starts)

  At turn 6, if Mia stops, she gets 75% of $160 = $120, and Dan gets $40.
  If Mia passes, the pot would double to $320? But the rule says: "If the sixth turn is also a pass, the game ends right there with the pot split fifty-fifty rather than doubling again." So if Mia passes on turn 6, the game ends with $160 (current pot) split 50-50: Mia gets $80 and Dan gets $80.

  So for Mia at turn 6:
  - Stop: $120 for Mia, $40 for Dan.
  - Pass: $80 for Mia, $80 for Dan.

  Clearly, $120 > $80, so Mia should stop. Thus, at turn 6, the rational move is to stop.

  Step 2: Turn 5 (Dan's turn). The pot at the start of turn 5 is $80 (after four passes: 5->10->20->40->80). If Dan stops at turn 5, he gets 75% of $80 = $60, and Mia gets $20. If Dan passes, then the pot doubles to $160 and it becomes Mia's turn (turn 6). But we just established that at turn 6, Mia will stop and take 75% of $160 = $120 for herself and leave Dan with $40. So if Dan passes, he ends up with $40, but if he stops he gets $60. So $60 > $40, so Dan should stop at turn 5.

  Step 3: Turn 4 (Mia's turn). The pot at turn 4 is $40 (after three passes: 5->10->20->40). If Mia stops, she gets 75% of $40 = $30, and Dan gets $10. If she passes, the pot doubles to $80 and it becomes Dan's turn (turn 5). But we know that at turn 5, Dan will stop and take 75% of $80 = $60 for himself, leaving Mia with $20. So if Mia passes, she gets $20, but if she stops she gets $30. So $30 > $20, so Mia should stop at turn 4.

  Step 4: Turn 3 (Dan's turn). The pot at turn 3 is $20 (after two passes: 5->10->20). If Dan stops, he gets 75% of $20 = $15, and Mia gets $5. If he passes, the pot doubles to $40 and it becomes Mia's turn (turn 4). But we know that at turn 4, Mia will stop and take 75% of $40 = $30 for herself, leaving Dan with $10. So if Dan passes, he gets $10, but if he stops he gets $15. So $15 > $10, so Dan stops at turn 3.

  Step 5: Turn 2 (Mia's turn). The pot at turn 2 is $10 (after one pass: 5->10). If Mia stops, she gets 75% of $10 = $7.50, and Dan gets $2.50. If she passes, the pot doubles to $20 and it becomes Dan's turn (turn 3). But we know that at turn 3, Dan will stop and take 75% of $20 = $15 for himself, leaving Mia with $5. So if Mia passes, she gets $5, but if she stops she gets $7.50. So $7.50 > $5, so Mia stops at turn 2.

  Step 6: Turn 1 (Dan's turn). The pot is $5. If Dan stops, he gets 75% of $5 = $3.75, and Mia gets $1.25. If he passes, the pot doubles to $10 and it becomes Mia's turn (turn 2). But we know that at turn 2, Mia will stop and take 75% of $10 = $7.50 for herself, leaving Dan with $2.50. So if Dan passes, he gets $2.50, but if he stops he gets $3.75. So $3.75 > $2.50, so Dan stops at turn 1.

  Thus, by backward induction, the rational move for Dan on turn 1 is to stop.

  Mia's objection:

