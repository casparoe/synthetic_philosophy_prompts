  so a couple weeks ago i watched a rabbit in my backyard get attacked by a hawk. it didnt die right away, it was dragging itself around clearly in a ton of pain for like 15-20 minutes before something else finally finished it off. i almost went out there to end its suffering somehow but stopped myself bc it felt wrong to mess with nature, like that's just what's supposed to happen out there. its been bugging me since though: if a dog or a person was suffering like that we'd treat it as an emergency and do whatever it takes to stop it, but wild animals go through stuff like that constantly and we just shrug and say thats how nature works. is there an actual good reason to treat those two situations so differently, or am i just noticing some kind of inconsistency in whose suffering actually counts?
