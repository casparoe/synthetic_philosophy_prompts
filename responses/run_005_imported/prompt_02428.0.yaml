  I need to evaluate who had the better point at each stage. 

  - **Move 1**: Owen's point about continuity with Gödel's work is valid. The incompleteness theorem does deal with truth beyond formal systems. However, Nadia is right that applying this to personal immortality is a leap. The mathematical concept doesn't directly translate to metaphysical claims about the afterlife. So, while Owen's contextual point adds depth, Nadia correctly identifies the analogy's weakness. Better point: Nadia, but Owen's insight about Gödel's consistency is important.

