answer: |-
  Here are eight tightly focused interview questions with specific, probing follow-ups designed to push the core arguments of your speaker's work, incorporating your requested angles and avoiding introductory material:

  1.  **Core Question: The Necessity of Standing Beyond Truth**
      *   **Question:** "Your book argues that a hypocrite lacks the *standing* to blame, even when their factual accusation is correct. Wallace frames this as a forfeiture of the right to engage in 'moral address.' Could you explain precisely what *work* the concept of 'standing' is doing here that isn't already covered by the hypocrite simply being factually correct *and* the act of blaming being practically ineffective or socially inappropriate due to their hypocrisy? Why isn't 'being right' sufficient?"
      *   **Likely Answer & Follow-Up:** *(Likely: Standing is a distinct normative condition for legitimately issuing blame, tied to participation in the moral community on equal footing; truth is necessary but insufficient.)*
      *   **Follow-Up:** "If the hypocrite's statement *is* factually true and serves a socially useful purpose (e.g., calling out genuine harm), why should we care about this separate 'standing' condition? Isn't dismissing their true claim *solely* because of their hypocrisy potentially letting the actual wrongdoer off the hook on a technicality?"

  2.  **Question: Scope of Forfeiture - Specificity**
      *   **Question:** "You argue hypocrisy forfeits standing. How specific is this forfeiture? If I unfairly snap at my sibling for a minor lie (making me hypocritical about blameworthiness regarding honesty *with them*), does this forfeit *only* my standing to blame *that sibling* for *dishonesty*, or does it extend to blaming *others* for dishonesty, or blaming *that sibling* for completely different faults (like laziness), or even blaming *anyone* for *anything*?"
      *   **Likely Answer & Follow-Up:** *(Likely: Forfeiture is generally specific to the *type* of wrong and the *relationship* context; it's not usually global.)*
      *   **Follow-Up:** "Doesn't this specificity risk creating an impossibly complex 'moral ledger'? If hypocrisy on issue X with person Y only forfeits standing on X with Y, how do we handle cases where a public figure is hypocritical on environmental policy *with the public* – does that only forfeit standing to blame *the public* on *environmental* issues, or does the public nature generalize it? Doesn't this specificity make the concept practically unwieldy?"

  3.  **Question: Regaining Standing - Mechanism & Timeline**
      *   **Question:** "If standing is forfeited through hypocrisy, how can it be regained? Is a sincere apology and acknowledgment of one's own failing sufficient? Or is substantive, demonstrable *reform* – a sustained change in behavior – necessary? And critically, *how much time* or *what evidence* is required for reform to 'reset' standing? Is it instantaneous upon apology, or gradual?"
      *   **Likely Answer & Follow-Up:** *(Likely: Mere apology is often insufficient; genuine reform demonstrating a change in commitment is required. Time/evidence is contextual but necessary.)*
      *   **Follow-Up:** "This seems to create a significant asymmetry. The original wrongdoer might be blamed immediately, but the reformed hypocrite must undergo a probationary period. Doesn't this unfairly privilege the non-hypocritical blamer? If the *truth* of the charge is unchanged, why should the hypocrite's past sins impose this extra hurdle to being heard *now*, especially if they've apologized?"

  4.  **Question: The Skeptical Challenge - Is Standing Redundant? (Bell)**
      *   **Question:** "Philosophers like Macalester Bell are skeptical that 'standing' is doing unique conceptual work. She might argue that what *really* bothers us about the hypocritical blamer isn't some forfeited 'right to address,' but rather the *arrogance* or *bad faith* inherent in their blame – a vice easily understood without invoking 'standing.' How does your framework of forfeited standing capture something essential that the 'vice of arrogance' explanation misses?"
      *   **Likely Answer & Follow-Up:** *(Likely: Standing focuses on the *relational* or *authority* aspect – the hypocrite undermines the *reciprocity* necessary for blame as a normative practice, not just displays a personal vice.)*
      *   **Follow-Up:** "But couldn't we say the *arrogance* *is* precisely what disrupts the reciprocity? If standing *just is* the absence of relevant vices like arrogance in this context, doesn't Bell's skepticism hold – that 'standing' becomes a label for a condition (non-arrogance) we already understand through virtue/vice concepts, adding unnecessary metaphysical baggage?"

  5.  **Question: Cohen's Challenge - Preserving Correctness**
      *   **Question:** "G.A. Cohen was keen to emphasize that a hypocrite can still be *correct* in their criticism, even if their blame is objectionable. Your framework cleanly separates correctness from standing. How do you respond to the concern that by focusing so heavily on standing forfeiture, your theory risks *practically* drowning out true and important criticisms, effectively giving the *actual* wrongdoer a shield ('You can't talk!') that protects them from valid moral claims?"
      *   **Likely Answer & Follow-Up:** *(Likely: The validity of the criticism remains; others *with* standing can (and should) still make it. The hypocrite's lack of standing doesn't absolve the original wrong.)*
      *   **Follow-Up:** "But in practice, the hypocrite might be the *only* one willing or able to voice the criticism effectively (e.g., an insider). If their standing is forfeit and no one else steps up, doesn't the underlying wrong go unchallenged? Isn't there a danger that your theory, while normatively separating correctness and standing, *de facto* silences truth?"

  6.  **Question: Blame vs. Other Responses**
      *   **Question:** "Does your forfeiture of standing apply *only* to *blame* as a specific form of moral address, or does it also extend to other critical responses? For instance, does a hypocrite also lack the standing to *accuse* (stating the fact of the wrong), to *advocate* for sanctions, to simply *point out* the inconsistency in others ('That's hypocritical'), or to offer *constructive criticism*?"
      *   **Likely Answer & Follow-Up:** *(Likely: The core forfeiture is tied to the distinctively normative, address-like nature of *blame*. Accusations or pointing out facts might not require the same standing.)*
      *   **Follow-Up:** "Where exactly is the line? If a hypocrite says, 'What you did was wrong and harmful,' is that blame (forfeited) or mere accusation (potentially permissible)? If they say, 'We need policies to prevent this harm,' is that blame or advocacy? Doesn't this distinction become incredibly blurry in real discourse?"

  7.  **Question: Hypocrisy and Structural Injustice/Power**
      *   **Question:** "How does your account handle hypocrisy within contexts of significant power imbalance or structural injustice? For example, if a marginalized person, who has *had* to compromise their ideals for survival in an unjust system, criticizes a powerful actor for similar compromises made out of greed, do they *forfeit standing*? Or does the context of oppression change the calculus of who can legitimately blame whom?"
      *   **Likely Answer & Follow-Up:** *(Likely: Might argue context matters significantly; the power imbalance or the nature of the "compromise" (survival vs. luxury) might mean the marginalized person isn't genuinely hypocritical in the relevant sense, or that the powerful actor's actions are qualitatively worse.)*
      *   **Follow-Up:** "Doesn't this risk undermining the universality of your principle? If we start making exceptions based on power or context, how do we avoid the charge that 'standing' becomes a tool that primarily constrains criticism *from below* or criticism *of power*, while the powerful retain their standing to blame the less powerful, whose 'hypocrisy' is more easily identified?"

  8.  **Question: The Function of Blame & Hypocrisy's Damage**
      *   **Question:** "Ultimately, *why* does hypocrisy so severely damage the practice of blame, on your view? Is it primarily because it undermines the blamer's *credibility* as a moral guide? Or because it constitutes a *new wrong* (a failure of reciprocity) that poisons the interaction? Or because it makes the blame *ineffective* at achieving its communicative or reformative goals?"
      *   **Likely Answer & Follow-Up:** *(Likely: Focuses on the failure of reciprocity/equality inherent in moral address - the hypocrite implicitly exempts themselves from the norms they enforce on others, violating the community foundation.)*
      *   **Follow-Up:** "If the core damage is to the reciprocal norms of the moral community, does this mean that in a community *already* deeply corrupted by widespread hypocrisy and bad faith, the concept of 'standing' loses its force or meaning altogether? Is standing only meaningful in a community striving for reciprocity?"

  **Key features of these questions:**

  *   **Avoids Warm-up:** Jumps straight into conceptual tensions (Q1, Q4, Q5), scope issues (Q2, Q6), and mechanisms (Q3).
  *   **Targets Requested Angles:** Explicitly addresses standing vs. truth (Q1), scope (Q2), regaining standing (Q3), and the Bell skepticism (Q4).
  *   **Specific Follow-ups:** Each follow-up anticipates a plausible answer and challenges it on grounds of practicality, consistency, potential negative consequences, or conceptual redundancy.
  *   **Engages Key Thinkers:** Directly contrasts with Cohen (Q5) and challenges from Bell (Q4).
  *   **Real-World Pressure:** Tests the theory against practical concerns (Q1 follow-up, Q5, Q7) and potential loopholes/absurdities (Q2 follow-up).
  *   **Probes Foundations:** Q8 asks for the fundamental rationale.

  Good luck with the Q&A! These questions should foster a deep and engaging discussion.
