  The user’s deeper needs: authenticity in both philosophy and science. They want the scene to resonate with experts without oversimplifying. They might fear their research isn't thorough enough. Highlighting Berkeley’s unique stance and the study's limitations addresses this. Also, clarifying that the study doesn't "prove" a philosopher correct helps them avoid characters misusing the data.

