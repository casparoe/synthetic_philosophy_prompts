answer: |-
  You've nailed the core similarity, but the Pasadena paradox is indeed a deeper beast than St. Petersburg. While both involve infinite expectations, the *nature* of that infinity is fundamentally different and exposes a more severe flaw in standard decision theory. Here's why:

  1.  **The Crux: Conditional Convergence vs. Divergence:**
      *   **St. Petersburg:** The expected value diverges to **positive infinity** (∑ (1/2)^n * 2^n = ∑ 1 = ∞). *Any* grouping of the terms will still yield a sum tending towards +∞. The problem is the *magnitude* of the payoffs.
      *   **Pasadena Paradox:** The expected value is **conditionally convergent**. The infinite sum ∑ [(-1)^{n+1} * (2^n) / n] * (1/2)^n = ∑ [(-1)^{n+1} / n] converges (to ln(2)), *but only if you sum the terms in the exact order given* (n=1, 2, 3, ...). This is the famous Alternating Harmonic Series.

  2.  **Riemann's Rearrangement Theorem - The Heart of the Problem:**
      This theorem states that for any conditionally convergent series, you can rearrange the order of its terms to make it converge to *any real number whatsoever*, or even diverge to +∞ or -∞.
      *   **Applied to Pasadena:** Depending *solely* on the order in which you choose to add up the possible outcomes and their utilities, you can get:
          *   ∑ [(-1)^{n+1} / n] = ln(2) ≈ $0.69 (the "standard" order)
          *   Rearrangement A: $1,000,000 (by grouping positives cleverly before negatives)
          *   Rearrangement B: -$1,000,000 (by grouping negatives cleverly before positives)
          *   +∞
          *   -∞
      *   **This isn't just instability; it's arbitrariness.** The "expected utility" isn't just infinite; it's *undefined* because there's no single privileged or "correct" order to sum the terms. Standard decision theory assumes rearrangement invariance.

  3.  **Why Bounding Utility Doesn't Fully Solve Pasadena:**
      You're absolutely right that bounding utility (|u(x)| < B for some finite B) *does* resolve the issue of the series diverging to ±∞. It forces the series to be absolutely convergent (since ∑ |u(outcome_n) * p(outcome_n)| ≤ ∑ B * p(outcome_n) = B < ∞). Absolutely convergent series *are* rearrangement invariant.
      *   **The Catch:** While bounding utility fixes the mathematical pathology (undefined expectation), it doesn't fix the underlying *decision-theoretic* pathology exposed by the paradox *before* bounding:
          *   **The Revelation:** The paradox reveals that the *concept of expected utility maximization breaks down* when dealing with gambles whose expectation is conditionally convergent. There is *no* rational way to assign a single, consistent expected value to the Pasadena game using the standard summation procedure. The "infinite expectation" of St. Petersburg is well-defined (just infinite), while the "infinite expectation" of Pasadena is *ill-defined*.
          *   **The Philosophical Problem:** Pasadena shows that EU theory relies on an assumption that doesn't always hold: that the order of summation doesn't matter. It forces us to confront the question: *What does "expected utility" even mean for such gambles?* Bounding utility avoids the problem by making these gambles impossible, but it doesn't tell us how to handle the *conceptual* failure exposed in the unbounded case. It's a patch, not an explanation.

  4.  **Why People See it as Deeper:**
      *   **Attacks the Calculation Process:** St. Petersburg challenges the *magnitude* of utilities we're willing to consider. Pasadena challenges the *very procedure* of calculating expected utility – the summation method itself. It shows the calculation isn't robust or well-defined for all possible gambles.
      *   **Highlights Foundational Assumptions:** It exposes the hidden assumption of absolute convergence (or rearrangement invariance) underpinning the definition of expected value.
      *   **Undefined vs. Infinite:** An infinite value is problematic but conceptually graspable (something huge). An *undefined* value (can be *anything*) is a much more profound failure of the theory to assign *any* consistent value at all.
      *   **Requires More Than Bounding:** Fixing St. Petersburg only requires limiting utility ranges. Fixing the *issue exposed by Pasadena* requires either:
          *   Bounding utility (avoiding conditional convergence entirely), or
          *   Developing a *new decision rule* that can handle conditionally convergent expectations consistently (e.g., using a privileged summation order like Cesàro summation, or rejecting the gamble altogether). This is an active area of research.

  **In Summary:**

  *   **St. Petersburg:** Infinite expectation (+∞). Problem: Unbounded utility leads to absurdly high valuations. **Solution:** Bound utility.
  *   **Pasadena:** *Conditionally convergent* "expectation" (can equal any real number or ±∞). Problem: The standard calculation of expected utility is *fundamentally undefined* for such gambles; the procedure breaks down. **Exposes** a deeper flaw in the definition/calculation process.
  *   **Bounding Utility:** Fixes *both* by preventing conditional convergence, but while it cleanly solves St. Petersburg, it merely *sidesteps* the foundational conceptual crisis revealed by Pasadena regarding how expectation is defined and calculated when unbounded utilities interact with probabilities in specific ways.

  Pasadena isn't just St. Petersburg with sign flips; it's St. Petersburg demonstrating that the concept of "summing the products of probability and utility" can be mathematically incoherent for certain unbounded gambles, even before you worry about the size of infinity. That's why it's considered a deeper and more troubling paradox.
