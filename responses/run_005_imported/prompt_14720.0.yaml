answer: |-
  ## Eulogy for a Keeper of the Record

  **(Approx. 6 minutes)**

  Good morning. Thank you all for being here. For neighbors who watched her tend her roses with the same fierce attention she gave everything, for cousins who remember holidays filled with her quiet, observant presence, for friends who shared coffee and probably got gently corrected on a point of history or local news… and especially for her colleagues from the copydesk, who knew her in her element. Thank you for sharing this space as we remember my mother.

  My mother lived her life surrounded by words. Not the flowing, narrative kind I wrestle with, but the fundamental kind: facts. For thirty-one years, she ran the fact-checking desk at the [Mention Paper Name, if comfortable, or just "our regional paper"]. That wasn't just a job; it was an extension of who she was at her core. She understood, deeply, that facts are the bedrock. They are the things we stub our toe on in the dark. They are the things that remain, stubbornly, even when they’re inconvenient, even when we wish they were different.

  Anyone who sat at her dinner table knows this. You might be passionately debating… well, anything, really… and there would come a pause. A quiet but utterly firm voice would interject: "Actually, the vote was on Tuesday, not Wednesday." Or, "The study you're referencing was retracted last year." It wasn't about winning an argument; it was about clearing the ground. She believed, fiercely, that we couldn't build anything meaningful – not a conversation, not a family, not a community, certainly not a democracy – on a foundation of "sort-of-true" or "wish-it-were-true." A fact, she’d remind us, often just when the conversation was getting comfortably heated, *is not the same kind of thing* as an opinion. And none of us, she’d insist gently but unyieldingly, are entitled to a personal view of what actually happened.

  That clarity could be… bracing. It could stop a pleasant flow of conversation cold. It demanded attention. It demanded precision. It demanded we look directly at the thing in front of us, not the softer, easier version we might prefer. She knew facts were stubborn things. And she knew that preserving them, insisting on them even when it wasn't socially smooth, even when it made her seem difficult, was vital work. She saw it as a kind of stewardship. Someone had to be the keeper of the record. Someone had to ensure that the story told was built on what *was*, not just what felt good or fit neatly.

  This wasn't cynicism. It was the opposite. Her insistence on the factual groundwork stemmed from a profound respect – respect for the people affected by the stories, respect for history, respect for the messy, complex, often inconvenient reality we all share. She knew that imagination is powerful – it lets us build, create, dream, and yes, sometimes, lie. But she believed that power *needed* counterweights. It needed people whose role was simply to say, "Check the source. Verify the date. Look again." People who weren't trying to spin or shape, but simply to *see* clearly and hold the line.

  So, how do we remember someone who devoted her life to resisting the smoothing-over of reality, especially in a moment like this, where comfort feels so necessary? I think the answer lies precisely in *not* smoothing her over.

  The comfort we find today isn't in pretending she was softer or simpler than she was. The comfort is in remembering her *exactly* as she was: fiercely intelligent, sometimes uncompromising, deeply principled, and profoundly committed to truth. The comfort is in knowing she lived by a clear, unwavering code. The comfort is in the solidity she represented. When she loved you, it wasn't a performance. It was a fact. When she tended her garden, every weed was identified and dealt with properly. When she read the paper, she read it *deeply*, not just for the stories, but for the structure holding them up.

  We will miss her quiet presence. We will miss the sharpness of her mind. We will miss the way she could stop a runaway train of speculation with a single, well-placed fact. We will miss her dedication to getting it *right*.

  To her colleagues: you knew her in that world of proofs and deadlines, where accuracy wasn't just a goal, it was the oxygen. You saw her conviction in action. She carried that conviction home, not as a burden, but as her essential self. She wouldn't want us to varnish the record now. She’d want us to remember her clearly, edges and all. She’d want us to value the stubborn, essential facts of her life: her dedication, her integrity, her love for her family and her work, her belief that truth matters, especially when it’s hard.

  That belief, that fierce protection of what is real, *is* our consolation. It was her gift to us. It’s the unshakeable ground she stood on, and it’s the ground we stand on now as we remember her. Let’s honor her by seeing her clearly, by valuing the precision she brought to the world, and by carrying forward her respect for the stubborn, beautiful, complicated truth.

  Thank you, Mom, for being exactly who you were. We will remember. We will check the sources. We will hold the line. Rest now. Your shift is done.
