answer: |-
  Based on Hobbes's core philosophical commitments—particularly the *inseparability* of his nominalism from his materialism and his grounding of geometric certainty in physical generation—he would almost certainly view non-Euclidean geometry and Hilbertian formalism as catastrophic demolitions of geometry's foundation, **not** as vindications of his nominalism. Here's the argument:

  1.  **Hobbes's Nominalism Was Materialist, Not Purely Linguistic:** Hobbes rejected Platonic universals, arguing terms like "line" or "circle" are *names* (nominalism). Crucially, however, these names derived their meaning and certainty *exclusively* from their referents: physically conceivable acts of motion generating tangible objects in the material world. "Line" wasn't just a placeholder; it was the name *for* the trace of a moving point. His nominalism was *anchored* in materialism. Abstract names without this material referent were "insignificant sounds" or "ghosts," precisely his accusation against Wallis's algebra.

  2.  **Non-Euclidean Geometry Undermines the Unique Truth of Motion-Generated Space:**
      *   Hobbes believed the constructions via motion (point -> line -> plane -> solid) revealed the *one true, necessary structure of physical space*. Euclid's geometry wasn't just consistent; it was *causally certain* because it mirrored the physical act of generation.
      *   Non-Euclidean geometries demonstrate that the parallel postulate (and thus the specific spatial relations Hobbes derived from his generative acts) is *not* necessary. The curvature of space becomes contingent.
      *   **Hobbes's Reaction:** He would see this as a disaster. If space itself can have different structures, then his specific generative acts (moving a point in a "straight" line defined by his material concept) no longer yield *the* universal, necessary truths of space. The certainty he derived from the physical act of generation evaporates if that act doesn't uniquely determine the structure of reality. This doesn't vindicate his nominalism about names; it destroys the material foundation that *gave* those names their unique, certain meaning. The existence of alternatives proves his specific generative process wasn't revealing the sole truth of space.

  3.  **Hilbert's Formalism Severs Geometry from Material Generation Entirely:**
      *   Hilbert's axiomatization explicitly divorces geometric terms from *any* specific ontological commitment. "Point," "line," and "plane" are defined solely by their formal relations within an axiom system. Their meaning is purely syntactic, not semantic in the physical sense. The "beer mug" quip epitomizes this: the physical intuition is irrelevant to the deductive structure.
      *   This is the *antithesis* of Hobbes's view. For Hobbes, the meaning of "point," "line," and "plane" *is* their mode of physical generation. Their relations (e.g., a line having length without breadth) are *derived* from this generation, not imposed by arbitrary axioms. Certainty comes from understanding the causal act, not from the consistency of formal rules.
      *   **Hobbes's Reaction:** He would see Hilbert as the ultimate triumph of the very "empty symbol-manipulation" he despised in Wallis, raised to a systematic principle. Removing the physical generation via motion doesn't vindicate nominalism; it annihilates the *source* of geometric certainty. Geometry becomes a complex game of signs with no necessary connection to the causal structure of the material world. Hobbes would likely dismiss it as a meaningless formal exercise, utterly failing to capture what made geometry *philosophically significant* and *certain* for him: its grounding in physical causation. The "certainty" of a consistent formal system would be a hollow shell compared to the causal certainty he sought.

  **Resolving the Tension: Why Demolition Trumps Vindication**

  The apparent tension between Hobbes's nominalism and materialism dissolves under scrutiny in this context:
  *   **Nominalism Served Materialism:** His rejection of universals wasn't an endorsement of free-floating linguistic conventions; it was to ensure that knowledge remained grounded in the only reality he acknowledged: bodies in motion. Names were tools for describing material generation.
  *   **Certainty Required Material Generation:** The unique certainty of geometry *depended* on the mind constructing the object through a physically conceivable causal process. Nominalism alone couldn't provide certainty; it needed the anchor in material generation.
  *   **Later Developments Attack the Anchor:** Both non-Euclidean geometry and formalism directly attack that anchor. Non-Euclidean geometry shows the physical generation process Hobbes described doesn't yield the *only* possible spatial structure, undermining its necessity and unique truth. Formalism explicitly removes the anchor, making geometry a game of symbols independent of physical causation.

  **Conclusion:**

  While Hobbes would likely *recognize* the nominalist *aspect* in these later developments (the arbitrariness of names in formalism, the contingency revealed by non-Euclidean geometries), he would see them primarily as the utter destruction of his core thesis. They demolish the idea that geometry's certainty arises *because* we generate its objects through physical motion in the one true space. Non-Euclidean geometry relativizes the space generated by that motion, and formalism severs the connection to generation altogether. For Hobbes, this wouldn't be progress; it would be the abandonment of geometry's unique claim to causal, natural-philosophical certainty, reducing it either to contingent models or empty formalism – both anathema to his deeply materialist and constructivist vision. His nominalism was inextricably tied to his materialism; affirming the former while destroying the latter would be no vindication at all. He would see these developments as confirming his worst fears about the direction Wallis was taking mathematics.
