answer: |-
  What you're describing isn't guilt in its simplest form. It's a profound, complex dissonance between your actions, your internal motivations, the external narrative being imposed on you ("the good one"), and the inherent messiness of human relationships – especially with a parent where love is absent. Let's dissect why this praise feels so wrong:

  1.  **The Erosion of Authenticity:** Your actions are outwardly "good," but they stem from a complex place of duty, obligation, fear of judgment, and perhaps a commitment to your *own* self-concept ("the person who shows up") rather than love for your mother. Being labeled "the good one" simplifies this intricate, somewhat uncomfortable internal reality into a facile, almost sentimental, fiction. It erases *your* truth. It feels wrong because it *is* inauthentic to *your* experience. You're playing a role dictated by circumstance and expectation, not heart, and the label highlights that disconnect.
  2.  **The Implicit Judgment & Burden:** The label "the good one" carries an unspoken counterpoint: your brother is implicitly (or explicitly) "the bad one" or at least "the less good one." This creates several problems:
      *   **It traps you:** The praise becomes a cage. To stop or reduce your effort now feels like failing the "good" role you've been assigned, making it harder to set boundaries or express your own exhaustion or resentment.
      *   **It obscures the brother's reality:** The focus on *your* "goodness" conveniently avoids the harder family conversation about *why* your brother, who is geographically close, isn't participating. The praise serves as a distraction from that uncomfortable imbalance and potential conflict.
      *   **It feels undeserved (in the emotional sense):** You know the emotional truth behind your actions. The label "good" often carries connotations of warmth, affection, and selflessness you don't feel. Accepting it feels like accepting credit for emotions you don't possess.
  3.  **The Disconnect Between Action and Feeling:** As a novelist, you understand that motivation *is* character. You're performing the actions of a devoted child, but your internal motivation is starkly different. The praise celebrates the *character* ("the good one") you're performing, not the *person* you are (someone acting from complex obligation and self-preservation). This disconnect is inherently unsettling. It makes your own actions feel alien, like you're observing a character you didn't fully intend to create.
  4.  **The Absence of Love & The Weight of "Should":** The core dissonance is caring *for* without caring *about*. Society, and particularly the narrative of "the good child," heavily implies that such care *should* spring from love. Yours doesn't. The praise reinforces that societal "should," highlighting the gap between expectation and your internal reality. It reminds you that what you're doing, while objectively responsible, lacks the emotional core typically associated with such care.
  5.  **It Minimizes Your Burden:** The label "good" can feel dismissive of the sheer *effort* and personal cost involved – the travel, the emotional labor of managing hospice, the sleepless nights, the confrontation with mortality, the dredging up of a difficult past, all done without the sustaining force of love. "Good" makes it sound simple, natural, and effortless, when for you, it's a grueling marathon run on sheer will and obligation.

  **Is the care worth less because of your motives?**

  **No. Absolutely not.**

  *   **Consequentialist View:** The outcome is identical. Your mother receives excellent, attentive care. That tangible good exists independently of your internal state. Her needs are met. That matters immensely.
  *   **Duty and Integrity:** You are acting from a powerful sense of *duty* – duty to your own conscience, duty to avoid a legacy of absence, duty perhaps to a basic human contract of not abandoning someone vulnerable, even if the emotional bond is broken. This is a form of integrity, even if it's born of complex and sometimes difficult motivations. Doing the right thing *because* it's the right thing (even if "right" is defined by your own internal compass of responsibility) has inherent moral weight.
  *   **The Value of Showing Up:** Simply being present, ensuring comfort and dignity, is a profound act of humanity. It requires strength and commitment, regardless of the emotional wellspring. That commitment *is* valuable, even if it's not fueled by affection.

  **So, is it just sophisticated guilt?**

  Not exactly. It's **cognitive and emotional dissonance**, amplified by the external narrative. It's the discomfort of:

  *   Performing a role that doesn't match your internal state.
  *   Receiving credit for feelings you don't possess.
  *   Seeing a complex, difficult personal sacrifice simplified into a label that feels untrue to you.
  *   Bearing the weight of responsibility while seeing someone else avoid it with apparent ease, and having the imbalance highlighted by praise.
  *   Confronting the harsh reality of caring for a dying parent without the buffer of love.

  **What to do with this feeling:**

  1.  **Acknowledge and Validate It:** Tell yourself, "This feels wrong because it *is* complex and dissonant. My feelings are valid. The praise simplifies something deeply complicated and costly for me." You don't need to confess your motives to your family, but you *can* acknowledge them to yourself without judgment.
  2.  **Reframe the Praise:** Mentally translate "You're the good one" into "Thank you for doing this incredibly difficult thing." Focus on the *action* and its *impact* (your mother's care) rather than the label. See the praise as (perhaps clumsy) recognition of the *effort*, even if it misnames the motivation.
  3.  **Focus on Your Own Why:** Reconnect with *your* reasons: "I am doing this because I cannot *not* do it and live with myself. I am doing it to be the person *I* need to be, for my own future peace and for the example I set for my children." Anchor yourself in *your* integrity, not the family's narrative.
  4.  **Set Boundaries (if needed):** The dissonance might be exacerbated by exhaustion. Ensure you are protecting your own well-being. Can you delegate *any* small task? Can you schedule a slightly longer break? Protecting yourself isn't failing the "good" role; it's sustaining your capacity to continue.
  5.  **Accept the Messiness:** Real life, unlike fiction, rarely has pure motivations. Your actions are a mix of duty, fear, self-preservation, integrity, and perhaps even a sliver of compassion detached from love. That complexity *is* human. You are showing up and providing exemplary care. That is the undeniable fact. The internal landscape is yours alone, and it doesn't negate the tangible good you are doing.

  The discomfort comes from the friction between the clean, external story ("the good one") and the messy, difficult, morally ambiguous internal reality. Your actions have immense value *because* of the care provided. The feeling that the praise "sits wrong" is your authentic self rejecting a simplistic narrative that doesn't encompass the whole, difficult truth of your experience. It's not guilt; it's the ache of integrity in the face of an incomplete story.
