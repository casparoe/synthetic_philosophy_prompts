prompt: |-
  I'm a retired physicist who's gotten pretty into moral philosophy since retiring, and lately I've been reading about Anscombe's campaign against Oxford giving Truman an honorary degree over Hiroshima and Nagasaki (the "Mr Truman's Degree" pamphlet). Here's what's bugging me though: the standard defense of the bombings has always been that they saved lives overall, since a land invasion of Japan would've been way bloodier for both sides. If thats basically right on the numbers, doesn't it pull the rug out from under Anscombe's whole objection? Seems like her case amounts to a bet about body counts that just didn't pay off once historians ran the estimates. Am I missing something, or does her argument just not really hold up anymore?
reasoning: |-
  Okay, let me unpack this retired physicist's question about Anscombe and the Hiroshima/Nagasaki bombings. He's clearly done his homework - knows about the "Mr Truman's Degree" pamphlet and the standard utilitarian defense. His main concern is whether historical casualty estimates invalidate Anscombe's moral stance.

  Hmm, he's framing it as a numbers game - like if the nukes saved more lives than a land invasion, then Anscombe's objection collapses. But that's precisely where I need to show him the philosophical pivot. Anscombe wasn't playing the same game as the utilitarians. Her target was deeper - the very logic of "doing evil for good results."

  Let me recall that key passage in her pamphlet where she says Truman's decision made him a murderer because he chose mass killing of civilians as a means. That's the crux: the intended nature of the act itself. The physicist might be missing how radically different her ethical framework is from consequentialism.

  I should use examples he'll grasp as a scientist. Maybe liken it to violating conservation laws in physics - some principles just can't be traded off. Or better yet, cite the Doctrine of Double Effect distinction between civilian deaths as means versus side-effect. The firebombing comparison could resonate too - Curtis LeMay's tactics versus the atomic bombs' intentional civilian targeting.

  Important to acknowledge his factual point though. Must concede that if the casualty estimates hold, it strengthens the consequentialist case. But then pivot hard: Anscombe would say that even if true, it doesn't change the moral character of deliberately vaporizing non-combatants. It's about what you're willing to do, not just what outcomes you get.

  The Trinity Test reference might hook him - scientists understood this was different. Oppenheimer's "destroyer of worlds" guilt shows they recognized the moral threshold being crossed. That's why Anscombe was so furious about Oxford honoring Truman: it normalized crossing that line.

  Should end by reframing his question. It's not that her argument "doesn't hold up," but that it operates on a different ethical plane. The body count debate misses her core indictment: that we must never make mass murder our instrument, regardless of consequences. That's the uncompromising principle he might be overlooking.
answer: |-
  You're hitting on a crucial tension at the heart of this debate – the clash between consequentialist calculations and deontological principles. Anscombe's objection doesn't simply dissolve if the "saved lives" argument holds water, **because her critique wasn't primarily about the *accuracy* of the body count estimates.** Her target was the *moral reasoning* itself. Here's why her argument remains potent, even if we grant the factual premise:

  1.  **The Core of Anscombe's Argument (Deontology & Intention):**
      *   **"Thou Shalt Not Murder":** Anscombe, drawing on Catholic natural law tradition and developing ideas central to her later work in "Intention" and "Modern Moral Philosophy," argued that deliberately killing innocent non-combatants is intrinsically evil. It's a moral absolute, prohibited regardless of consequences.
      *   **Intention is Key:** The bombings weren't merely foreseeing civilian deaths as an *unfortunate side-effect* of attacking a military target. The bombs were *intentionally* dropped on cities packed with civilians *in order to* destroy those cities and terrorize the population/government into surrender. Civilians weren't collateral damage; their deaths were the chosen *means* to achieve the end. This, for Anscombe, constituted murder.
      *   **Rejecting Consequentialism:** She fundamentally rejected the utilitarian logic of "it's okay to do something intrinsically evil if the overall consequences are good." She argued this corrupts morality by making it contingent on outcomes we can't fully predict or control, and licenses atrocities if we *believe* the math works out.

  2.  **Why the "Saved Lives" Argument Doesn't Defeat Her Point:**
      *   **It Accepts Her Opponent's Framework:** The "saved lives" defense operates *within* consequentialism. It argues that the *net outcome* justified the action. Anscombe's point is that this framework is *itself* flawed when applied to certain fundamental prohibitions like murdering innocents. Granting the numbers might win the argument *for a consequentialist*, but it doesn't engage with her core deontological objection.
      *   **The "Ends Justify the Means" Trap:** Anscombe saw Truman's decision as a quintessential example of the dangerous modern tendency to justify clear evil (mass murder of civilians) based on predicted future benefits. Even *if* the prediction was correct, she argued this sets a horrific precedent: mass murder becomes a viable policy tool if you can convince yourself the math favors it.
      *   **The Problem of Calculation & Uncertainty:** How reliable were those estimates? Were *all* alternatives (continued blockade, modified surrender terms allowing the Emperor to stay, demonstration bomb, awaiting Soviet entry) truly exhausted? Historians still debate this. Anscombe would argue that the inherent uncertainty and potential for bias in such calculations make them a perilous foundation for violating fundamental moral laws.
      *   **Slippery Slope:** If this was justified to end a war, why not use similar tactics in future conflicts if the stakes seem high enough? The bombings established the precedent of deliberately targeting civilian populations with weapons of mass destruction as an acceptable act of state.

  3.  **The Historical Context & Anscombe's Specific Outrage:**
      *   **Oxford's Honor:** Her protest wasn't *just* about the bombings; it was about Oxford University *honoring* the man who ordered them. This, for her, signaled an institutional acceptance and normalization of the consequentialist reasoning she saw as morally bankrupt. It blurred the line between statesmanship and mass murder.
      *   **Moral Clarity vs. Realpolitik:** She was fighting against the post-war tendency to downplay the moral horror of the bombings because "they worked" and the victors wrote the history. Awarding the degree felt like complicity in forgetting or excusing the nature of the act.
      *   **The Civilians:** Hiroshima and Nagasaki weren't primarily military bases. They were cities full of men, women, and children who were not legitimate targets under traditional Just War doctrine concerning discrimination/non-combatant immunity. The firebombing of Tokyo raised similar issues, but the atomic bombs delivered the horror instantly and on an unprecedented scale.

  **In summary:** You are correct that **if** the "saved lives" calculation is historically accurate and robust, it provides a strong *consequentialist justification* for the bombings. However, Anscombe's argument was that **consequentialist justifications are morally invalid when they involve the intentional commission of intrinsically evil acts like the mass murder of innocents.**

  *   **For a consequentialist:** The body count might settle the issue (if the numbers hold).
  *   **For a deontologist like Anscombe:** The body count is morally irrelevant to the core wrong of *how* the deaths were caused and *intended*. The act itself was murder, and no amount of predicted future benefit can make murder morally permissible.

  **So, her argument doesn't "not hold up" because of the historical estimates; it stands *outside* the framework that those estimates are used to support.** It challenges the very legitimacy of using such calculations to override fundamental moral prohibitions. Her case is a stark reminder that "winning" or "saving lives" doesn't automatically sanctify the means employed. As a physicist, think of it like violating a fundamental conservation law – no matter the outcome of the experiment, the violation itself remains. Her objection was to the violation of a fundamental moral law.

  Whether one ultimately *agrees* with Anscombe's absolute prohibition depends on one's underlying meta-ethical commitments (consequentialism vs. deontology vs. virtue ethics, etc.). But her argument remains a powerful and philosophically coherent challenge to the utilitarian defense, regardless of the historical body count estimates. It forces us to confront the question: Are there some acts so heinous that they are *never* justified, no matter the consequences? Anscombe answered "yes," and pointed to Hiroshima and Nagasaki as prime examples.
