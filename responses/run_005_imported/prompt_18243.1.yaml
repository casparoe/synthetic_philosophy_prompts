answer: |-
  Based solely on the argumentative structure of Lewis's "Do We Believe in Penal Substitution?" and his characteristic philosophical toolkit (causation, counterpart theory, desert, collective agency), here's the most plausible conclusion he would likely draw about corporate penal substitution ("too big to jail"):

  1.  **Lewis Would Likely Find Corporate Penal Substitution *Substantially Worse* than the Religious Case:** While he finds ways to resist the *strongest* objections to religious penal substitution, his framework provides powerful *principled reasons* why the corporate case fails to meet the necessary conditions for legitimate substitution.

  2.  **Why the Religious Case Gets Traction with Lewis:**
      *   **Willingness & Consent:** Lewis emphasizes the *voluntary* nature of the substitute's sacrifice as crucial. Christ *chooses* to suffer. This mitigates the core injustice of punishing the innocent *against their will*.
      *   **Identification/Authorization:** Lewis explores notions of *representation* and *counterpart relations*. The sinner and Christ are linked through covenant, divine plan, or Christ's role as the "second Adam." Christ doesn't just pay a debt; he *stands in for* humanity in a deep relational sense. He is *authorized* (by God, by his own nature) to represent them. This addresses the "only the guilty deserves it" objection by creating a metaphysical or covenantal link where the substitute *can* legitimately bear the burden *for* the guilty.
      *   **Purpose Served, Not Just Cost Paid:** Lewis argues punishment serves purposes (retribution, deterrence, reform, expiation). For substitution to work, the substitute's suffering must *achieve* these purposes *as effectively or more effectively* than punishing the original wrongdoer. He suggests Christ's sacrifice *does* achieve the core purposes of punishment (e.g., expiation, moral transformation of the believer, demonstration of divine justice) in a unique way that punishing individual sinners might not. It's not just a financial transaction; it fundamentally alters the situation.

  3.  **Why These Elements Fail Miserably in the Corporate Case:**
      *   **Lack of Willingness/Consent (Critical Failure):** Shareholders (and often customers absorbing costs) are *not* consenting to be punished for the executives' crimes. They are passive victims of a process they have no meaningful control over. This directly violates Lewis's condition that the substitute must act voluntarily. The core injustice of punishing the innocent *against their will* is starkly present.
      *   **Lack of Identification/Authorization (Structural Failure):**
          *   *Shareholders:* They are investors, not counterparts or representatives of the guilty executives. They have no intrinsic identity link or authorization to bear the executives' *personal* desert of punishment. Their relationship is financial and contractual, not one of deep representation for *criminal liability*. Punishing shareholders for executive fraud is punishing entirely different entities for actions they didn't commit or control.
          *   *The Corporation Itself:* Lewis, known for his work on collective agency ("Convention," parts of "On the Plurality of Worlds"), might grant that corporations can act and bear *some* responsibility. However, the punishment here (a fine) targets the *entity* as a *financial* vessel, not the *individual guilty minds*. Crucially, the corporation lacks the necessary "identification" with the *individual desert* of the executives. The executives' desert is personal, rooted in their knowledge, intent, and actions. The corporation, as an abstract entity, doesn't *share* that specific desert; it possesses a *derivative* collective responsibility. Substitution requires the substitute to bear the *specific desert* of the wrongdoer. The corporation-as-fine-payer isn't bearing the executives' *desert*; it's paying a cost *imposed* because of their actions. The authorization chain is broken – shareholders didn't authorize the *crime*, only legitimate business.
      *   **Purpose of Punishment Not Served (Functional Failure):** Lewis would argue the core purposes of punishment are *not* achieved by the corporate settlement:
          *   *Retribution:* Justice demands that *those who culpably committed the wrong* suffer proportionate consequences. Fining shareholders/customers fails this. The guilty executives escape personal retribution.
          *   *Deterrence:* Individual deterrence of the guilty executives is weak or absent. General deterrence of *other* executives is undermined by the signal that personal liability can be offloaded onto the entity and its stakeholders. Lewis might argue the fine *could* deter the *corporation*, but this doesn't address the need to deter the *individuals* who make the decisions.
          *   *Reform:* The settlement often doesn't target reforming the *individuals* who committed the fraud. The corporation might implement compliance changes, but the executives themselves face no personal rehabilitative consequence.
          *   *Expiation/Denunciation:* The symbolic denunciation of the *specific wrong* and the expiation of guilt is misdirected. The fine says society condemns "the corporation," diluting the condemnation of the *individual criminal acts* and the *individuals* who perpetrated them. The executives' personal guilt remains unexpiated.
      *   **Causation & Cost vs. Punishment:** Lewis distinguishes between paying a *cost* and undergoing *punishment*. The corporate fine functions as a *cost* imposed on the entity due to the actions of its agents. Shareholders bear this cost financially. However, this is fundamentally different from the executives *themselves* undergoing the *punishment* they deserve (loss of liberty, personal stigma, restriction of rights). The causal chain involves financial transfer and dilution of ownership value, not the infliction of deserved suffering on the guilty. Lewis's analysis of causation would likely highlight this disconnect.

  4.  **Lewis's Plausible Conclusion:** Reasoning solely from his paper's structure, Lewis would most likely conclude that corporate penal substitution, as practiced in "too big to jail" settlements, is **fundamentally illegitimate and unjust**. The conditions that give the *religious* case its limited plausibility – voluntary substitution by a uniquely identified and authorized representative achieving the purposes of punishment – are **entirely absent** in the corporate case. Instead, it embodies the core objection he worked to *partially* overcome in the religious context: punishing innocent parties (shareholders/customers) for the crimes of others (executives), *without their consent*, *without proper identification*, and *without achieving the core purposes of punishment* for the *actual guilty individuals*. He would likely view it as a perverse misapplication of the *financial* aspect of liability (cost-shifting) that utterly fails to address the *personal desert* and *retributive justice* inherent in criminal punishment. His framework provides strong *principled* reasons to see the corporate case as *substantially worse* than the religious one he tentatively defended.
