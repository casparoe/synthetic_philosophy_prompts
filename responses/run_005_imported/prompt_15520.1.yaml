answer: |-
  Here's a joke that nails that specific supererogation tension, playing on the clash between traditional praise and EA-style obligation:

  > **At the family barbecue after the kidney donation, everyone's fawning:**  
  > **Aunt Marge:** "A saint! Walking among us!"  
  > **Uncle Bob:** "Absolute hero! Went *way* beyond duty!"  
  > **You (shifting uncomfortably):** "Honestly, it was just... basic decency?"  
  >   
  > **Your Philosophy PhD cousin (nodding sagely):** "Exactly! See, Marge, Bob? *That's* the supererogation paradox. You think it's heroic Everest, but Peter Singer's crew ran the numbers: for the cost of one slightly used kidney and a week on the couch, you bought someone *decades* of dialysis-free life. It's not 'above and beyond' – it's barely clearing the moral curb. Frankly, *not* doing it was the real optional extra."  
  >   
  > **You (staring into your potato salad):** "...So, the 'hero' discount aisle?"  
  > **Cousin:** "Bingo. Enjoy your obligatory coleslaw."

  **Why it works for your request:**

  1.  **Turns on the Tension:** Directly contrasts the family's "saint/hero/beyond duty" language (classic supererogation praise) with the cousin's Singer-esque "barely clearing the moral curb" / "obligatory" framing. The punchline ("hero discount aisle") highlights the absurdity of being praised for what feels, under one framework, like a baseline requirement.
  2.  **Context-Specific:** References the *actual scenario* (kidney donation, family reaction, philosophy PhD cousin, Singer) without being *about* the kidney itself. The humor is in the *ethical framing*.
  3.  **Conceptually Accurate:** Uses precise terms ("supererogation paradox," "Singer's crew ran the numbers," "moral curb," "obligatory") correctly. The cousin's speech accurately summarizes the EA critique of traditional supererogation.
  4.  **Validates Your Squirming:** Your character's discomfort ("shifting uncomfortably," "staring into potato salad") is central. The joke makes the *family's praise* the awkward element, not the donation itself, mirroring your feeling.
  5.  **Not Generic:** Avoids easy organ donation gags. The humor is entirely derived from the philosophical debate about the act's *status* (praiseworthy vs. obligatory).
  6.  **Subtle Punchline:** "Hero discount aisle" implies that heroism, under the EA view, is devalued to a mundane, almost cheap commodity because the "cost" was so low relative to the benefit. "Obligatory coleslaw" reinforces the mundane nature of the "duty" performed.

  It lands because it takes the core intellectual conflict you described – the jarring shift from "you did something amazing beyond expectation" to "you finally did the bare minimum morality demanded" – and plays it out in a painfully relatable family setting. The potato salad stare is the universal language of "Please stop calling me a saint while my cousin dissects my moral adequacy."
