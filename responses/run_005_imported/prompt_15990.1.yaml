prompt: |-
  Had a long, slightly drunk argument with my friend Priya last night that I still can't shake. She's finishing a philosophy MSc and got going on this thing called the "problem of old evidence" in Bayesian confirmation theory — apparently a classic objection (Glymour, I think, back in like 1980?) to the standard Bayesian line that evidence E confirms a hypothesis H when P(H|E) > P(H). Her example was the anomalous precession of Mercury's perihelion, which had already been measured decades before Einstein came up with general relativity. She was adamant that since that data was already known (so P(E) = 1 in your credence function before GR even existed as a hypothesis), plain conditionalization forces P(H|E) = P(H) for any H whatsoever — meaning strict Bayesianism says Mercury's perihelion gives GR literally zero confirmation. Which feels backwards, since everyone treats that as one of the most dramatic confirmations in the history of physics.

  I nodded along at the bar like I got it, but honestly I don't really see WHY the math forces that conclusion, or why it counts as a deep problem for Bayesianism rather than just a weird artifact of how you're defining P(E) in the first place. Then she started throwing around "the Garber-Jeffrey move" and something about scientists not being logically omniscient, and I completely lost the thread. Could you (a) actually build up the intuition for why old evidence breaks naive Bayesian updating, in a way I could reconstruct myself rather than just citing the formula, and (b) tell me whether the Garber-Jeffrey-style fix (or whatever solution you personally think is best) genuinely resolves the problem, or if it's more of a patch that just relocates it somewhere else? I don't need the full formal apparatus with density functions and all that, just enough real substance that I'm not just hand-waving the next time this comes up.
reasoning: |-
  Okay, the user had a drunk argument with Priya about the problem of old evidence in Bayesianism. They need to understand why old evidence breaks Bayesian updating and if the Garber-Jeffrey fix works. Let me start by recalling the basics of Bayesian confirmation. Evidence E confirms H if P(H|E) > P(H). But with old evidence, E is already known, so P(E) = 1.

  The Mercury example: Einstein used Mercury's precession to support GR, but the data was known before. If P(E)=1, then P(H|E) = P(H). That means no confirmation. But intuitively, it did confirm GR. So why the disconnect?

  I need to explain why P(E)=1 causes this. If E is certain, learning E doesn't change anything. All probabilities conditioned on E are the same. So updating on E doesn't shift beliefs. But in reality, scientists learn something when E supports a new theory. The issue is logical omniscience. If E is already known, Bayesians assume you've considered all implications, but scientists don't. Einstein realized E fit GR, which wasn't obvious before.

  Now, Garber-Jeffrey's fix. They say to conditionalize on the logical relationship, not E itself. So instead of updating on E, update on "E implies H" or that H entails E. But how does that work? The user might need an example. Suppose before GR, Einstein knows E but not that H entails E. His P(H|E) might be low if H isn't considered. After realizing H entails E, he updates on that logical fact. So P_new(H) = P_old(H | H⊨E). That can increase P(H), even if E was known.

  Does this solve the problem? It handles cases where the logical connection wasn't known. But there are objections. Like, how to model logical learning formally? Assigning probabilities to logical statements might require a non-standard framework. Also, if the connection is probabilistic, it's messier. But for deductive cases like GR and Mercury, it works.

  The user wants substance without too much math. So focus on the intuition: Old evidence seems to confirm because we learn a new logical connection, not the evidence itself. The fix addresses that by updating on the entailment. But critics might say it's ad hoc or that logical probabilities are tricky. Still, it's a solid approach that many accept.

  Also, the user might want to sound knowledgeable next time they discuss this. So clarifying the key points: why P(E)=1 breaks confirmation, the role of logical ignorance, and how Garber-Jeffrey pivots to updating on logical relationships. Emphasize that it's about the discovery of the implication, not the evidence.
answer: |-
  Let's break this down step by step. Your friend Priya nailed the core paradox, and I'll build the intuition from the ground up—no formal density functions needed. This is fundamentally about **how probability models handle logical relationships and discovery**.

  ### (a) Why Old Evidence Breaks Naive Bayesian Updating: The Intuition

  1.  **The Core Bayesian Rule:**
      *   Confirmation happens when learning *E* makes you *more confident* in *H*: `P(H|E) > P(H)`.
      *   This is equivalent to saying `P(E|H) > P(E)` (the likelihood of seeing *E* if *H* is true is higher than your prior expectation of seeing *E* at all).

  2.  **The Old Evidence Scenario (Mercury & GR):**
      *   **E:** The precise value of Mercury's anomalous perihelion precession (known accurately by ~1880).
      *   **H:** Einstein's General Relativity (developed ~1915).
      *   **The Key Point:** When Einstein *first formulated GR*, `E` was already solidly established astronomical fact. In his (or any contemporary scientist's) probability model *at that moment*:
          *   `P(E) = 1`. There is *no uncertainty whatsoever* about `E`. It's as certain as "2+2=4".
          *   Because `E` is certain (`P(E) = 1`), **conditionalizing on `E` does nothing**. Let's plug into the formula:
              `P(H|E) = P(H and E) / P(E) = P(H and E) / 1 = P(H and E)`
          *   Since `E` is already certain (`P(E)=1`), `H and E` is equivalent to just `H` (knowing `E` is true doesn't add any restriction). So:
              `P(H and E) = P(H)`
          *   Therefore: **`P(H|E) = P(H)`**
      *   **Conclusion:** According to strict, naive Bayesian conditionalization, learning the already-known fact `E` provides *absolutely zero confirmation* to `H`. `P(H)` doesn't budge.

  3.  **Why This Feels Backwards & Is a Problem:**
      *   **Intuition:** Einstein (and physicists) *knew* `E` beforehand. Yet, when GR *predicted* `E` exactly (where Newtonian mechanics failed), it was a **massive win** for GR. It *felt* like powerful confirmation. Scientists routinely treat the successful prediction/explanation of *old* data as strong evidence for a *new* theory.
      *   **The Bayesian Paradox:** Naive Bayesianism says this experience is an *illusion*. How can something already known to be true make a new hypothesis *more* credible?
      *   **The Core Issue - Logical Omniscience:** Naive Bayesianism assumes agents are **logically omniscient**. If `E` is known with certainty (`P(E)=1`), and if `H` logically entails `E` (`H ⇒ E`), then the agent *must already* have factored this entailment into their probabilities. They *must* have `P(H|E) = P(H)`. The model gives the agent no room to *discover* a new logical connection between known evidence and a new hypothesis. Einstein's "Aha! GR explains Mercury!" moment has no Bayesian representation.

  **Think of it like this:** Imagine your probability model is a map. `E` being known (`P(E)=1`) means a specific landmark ("Mercury's Orbit Hill") is permanently fixed and labeled on the map. When a new hypothesis `H` ("GR River") is drawn on the map, the naive Bayesian cartographer insists: "If this river *actually* flows *to* that hill, you must have *already known* that connection when you drew the hill! Therefore, drawing the river can't change your understanding of the hill's significance." But Einstein *didn't* know that GR "flowed to" Mercury's orbit when Mercury's orbit was first mapped; he discovered that connection later. Naive Bayesianism lacks the machinery to represent this discovery process for *logical implications* involving certain evidence.

  ### (b) The Garber-Jeffrey Fix (& Why It's Good but Not Perfect)

  Daniel Garber (and later Richard Jeffrey) proposed the most influential solution. **The core idea: Scientists aren't logically omniscient. Confirmation comes not from learning `E` *again*, but from learning the *logical relationship* `H ⇒ E` (or something equivalent).**

  1.  **The Move:**
      *   When Einstein formulates GR, he *knows* `E` (Mercury's precession). So `P_old(E) = 1`.
      *   What he *doesn't* fully know/grasp/appreciate is that **`H` *entails* `E`** (`H ⇒ E`). He might suspect it, but he hasn't done the math to *confirm* that GR *precisely predicts* the known anomaly.
      *   **The "Evidence" He Updates On:** When Einstein (or others) *derives* that GR entails the exact value of the precession, he learns **`L`**, where `L = "H entails E"` (or `L = "H ⇒ E"`). This is a *new piece of information* about the logical structure of the world, *not* about the physical fact `E`.
      *   **The Update:** He updates his beliefs by conditionalizing on `L`:
          `P_new(H) = P_old(H | L) = P_old(H | H ⇒ E)`

  2.  **Why This (Usually) Works:**
      *   `L` (`H ⇒ E`) was *not* known with certainty beforehand (`P_old(L) < 1`). Einstein might have assigned a high probability that GR *could* explain it, but not certainty until the calculation was done.
      *   Crucially, `P_old(L) = P_old(H ⇒ E)` is generally **not equal to 1**. It reflects Einstein's prior confidence *that GR would predict exactly the known anomaly*.
      *   Learning `L` (`H ⇒ E`) *can* significantly boost `P(H)`. Why?
          *   If `H` is true, then `H ⇒ E` must be true. So `P(L | H) = 1`.
          *   If `H` is false, `H ⇒ E` *might* still be true (if `E` just happens to be true anyway), but it's *less likely* that a *false* theory `H` would *logically necessitate* the very specific true fact `E`. So `P(L | ~H)` is typically **much less than 1**.
          *   Applying Bayes' Theorem to update on `L`:
              `P_new(H) = P_old(H | L) = [P_old(L | H) * P_old(H)] / P_old(L) = [1 * P_old(H)] / P_old(L)`
          *   Since `P_old(L) < 1`, this means `P_new(H) = P_old(H) / P_old(L) > P_old(H)`.
      *   **Intuition:** Discovering that the new theory `H` *necessarily predicts* the old, well-established evidence `E` is surprising and impressive *if you weren't already certain it would*. It boosts your belief in `H` precisely because it was *not* a foregone conclusion that `H` would fit `E` so perfectly. The boost is inversely proportional to how likely you thought it was that `H` would entail `E` before you did the derivation (`P_old(L)`).

  3.  **Does It Genuinely Resolve the Problem? (Pros and Cons)**
      *   **Yes, it solves the core paradox effectively:**
          *   It accounts for the historical reality: Einstein's breakthrough was *discovering the entailment* `H ⇒ E`, not re-learning `E`.
          *   It provides a clear Bayesian mechanism (`P_old(H | H ⇒ E) > P_old(H)`) that aligns with the intuitive sense of confirmation.
          *   It directly addresses the logical omniscience problem by allowing agents to learn *logical facts* (`L`), not just empirical facts (`E`).
          *   For cases like Mercury/GR, it works beautifully. The confirmation comes from the *deductive connection*, not the evidence itself.
      *   **But it's not a magical, problem-free solution (Criticisms & Relocations):**
          *   **Defining `L` & Logical Uncertainty:** What *exactly* is `L`? Is it "`H` entails `E` in classical logic"? What if the entailment is complex, probabilistic, or only approximate? Bayesianism traditionally deals with empirical uncertainty, not logical uncertainty. Formally modeling `P_old(L)` requires extending probability theory to handle degrees of belief in *logical propositions*, which is non-trivial (though frameworks exist).
          *   **The Problem of Assigning `P_old(L)`:** How *should* Einstein assign `P_old(H ⇒ E)` before deriving it? This prior can seem arbitrary. Critics argue this just relocates the subjectivity/problem from `P(E)` to `P(L)`. Defenders counter that `P_old(L)` often *isn't* arbitrary; Einstein had good reasons (based on the structure of GR and known physics) to be *somewhat* confident (`P_old(L)` fairly high) that GR would explain Mercury *before* he calculated it, but crucially *not certain* (`P_old(L) < 1`).
          *   **Scope:** It works best for clear *deductive* entailments like GR/Mercury. It gets messier if the relationship between `H` and `E` is probabilistic (`H` makes `E` very likely, but not certain) or if `E` was only *partially* known before `H`. Adaptations exist, but they add complexity.
          *   **Is `L` Truly "Learned"?:** Some argue that discovering `H ⇒ E` is just realizing a consequence of what you already knew (`E` and `H`), so it shouldn't change beliefs. Garber-Jeffrey rejects this logical omniscience assumption as unrealistic for human scientists.

  **The Verdict (for Priya's Next Round):**

  The Garber-Jeffrey move **genuinely resolves the core conceptual problem** of old evidence by shifting the focus from learning the evidence *itself* to learning the *logical connection* between a new hypothesis and old evidence. It correctly identifies the scientist's discovery (`H ⇒ E`) as the source of confirmation, not the re-observation of `E`. It successfully incorporates the realistic limitations of logical omniscience into Bayesianism.

  However, it **relocates some challenges**: it requires modeling logical uncertainty (`P_old(H ⇒ E)`) and assigning plausible priors to these logical relationships. While this isn't "just a patch" (it addresses the fundamental flaw), it does push the Bayesian framework into slightly less charted territory concerning logical learning. Most philosophers of science (and working scientists who think about this) consider it the most compelling and substantive solution available. It captures the essence of why Mercury's orbit *did* confirm GR: not because the orbit was news, but because Einstein showed GR *demanded* it. The math now reflects the intuition. Next time, just ask Priya how *she* would assign `P(H ⇒ E)` before the calculation—that's where the interesting debate usually lands!
