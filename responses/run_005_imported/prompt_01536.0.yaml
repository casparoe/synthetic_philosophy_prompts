answer: |-
  I'll break this down step by step, focusing on your core questions: why mixed strategies are necessary for identifying strict dominance, how this connects to the "never a best response" concept, and why iterated elimination order matters for weak but not strict dominance. I'll use a compact example to build intuition and explain the deeper ideas.

  ### Why Pure Strategies Aren't Enough: The Need for Mixed Dominators
  Your professor is correct: some strategies aren't dominated by any single pure strategy but are dominated by a mixed strategy. This happens because a pure strategy might do "okay" against all opponent actions but never excel, while a mixture of other strategies can leverage their strengths in different scenarios to always do better.

  **Key Intuition:** A mixed strategy acts like a "conditional playbook." It doesn't commit to one action but randomizes to cover weaknesses. If a pure strategy is worse than such a playbook in every possible situation, it should be eliminated—even if no single pure alternative beats it everywhere.

  #### Example: The "Unremarkable Middle" Game
  Consider a simple game where Player 1 has three strategies: **Left (L)**, **Middle (M)**, and **Right (R)**, and Player 2 has two strategies: **X** or **Y**. Player 1's payoffs are:

  |          | Player 2 plays X | Player 2 plays Y |
  |----------|------------------|------------------|
  | **L**    | 5                | 0                |
  | **M**    | 0                | 5                |
  | **R**    | 2                | 2                |

  **Step 1: Check for pure-strategy dominance.**  
  - Is **R** dominated by **L**?  
    - If P2 plays X: L (5) > R (2) → better.  
    - If P2 plays Y: L (0) < R (2) → worse.  
    → Not dominated by L.  
  - Is **R** dominated by **M**?  
    - If P2 plays X: M (0) < R (2) → worse.  
    - If P2 plays Y: M (5) > R (2) → better.  
    → Not dominated by M.  

  No pure strategy dominates **R**. Yet, **R** is clearly undesirable—it never pays more than 2, while **L** and **M** can yield 5.

  **Step 2: Allow mixed strategies as dominators.**  
  Consider a 50-50 mix of **L** and **M** (i.e., play **L** with probability 0.5 and **M** with probability 0.5). Player 1's expected payoff:  
  - If P2 plays X: (0.5 × 5) + (0.5 × 0) = 2.5  
  - If P2 plays Y: (0.5 × 0) + (0.5 × 5) = 2.5  

  Compare to **R**:  
  - Against X: 2.5 > 2  
  - Against Y: 2.5 > 2  

  → The mixed strategy **(0.5 L, 0.5 M)** *strictly dominates* **R**, as it yields a higher payoff no matter what P2 does.  
  **Why this matters:** Without mixed strategies, **R** survives elimination, but it's irrational to play—it's strictly worse than a smart mixture. Restricting to pure strategies misses this, leading to "false survivors" in the game.

  ### Connection to "Never a Best Response"
  The deeper intuition lies in the equivalence between strict dominance and never being a best response. A strategy is **strictly dominated** if and only if it is **never a best response** to any belief about opponents' play. Mixed strategies are essential for this equivalence because beliefs are probabilistic (like mixtures).

  - **Beliefs:** A belief is a probability distribution over opponents' strategies. For example, P1 might believe P2 plays X with probability \( p \) and Y with \( 1-p \).  
  - **Best Response:** A strategy is a best response if it maximizes expected payoff given some belief.

  **In the example:**  
  - **R**'s expected payoff for any belief \( (p, 1-p) \):  
    \( 2p + 2(1-p) = 2 \) (constant).  
  - **L**'s expected payoff: \( 5p + 0(1-p) = 5p \)  
  - **M**'s expected payoff: \( 0p + 5(1-p) = 5(1-p) \)  
  - **L-M mix (0.5, 0.5)**: \( 2.5p + 2.5(1-p) = 2.5 \)  

  **Is R ever a best response?**  
  - If \( p > 0.5 \), **L** yields \( 5p > 2.5 > 2 \) → better than R.  
  - If \( p < 0.5 \), **M** yields \( 5(1-p) > 2.5 > 2 \) → better than R.  
  - If \( p = 0.5 \), **L** yields 2.5, **M** yields 2.5, **mix** yields 2.5—all tie at 2.5, but **R** only gives 2 → still worse.  

  → **R is never a best response** for any belief \( p \).  

  **Why mixed strategies bridge the gap:**  
  - If a strategy is strictly dominated (e.g., by a mixture), it can't be a best response—you'd prefer the dominator.  
  - Conversely, if it's never a best response, there must be some mixture (reflecting beliefs) that dominates it.  
  This equivalence ensures that iterated elimination of strictly dominated strategies (IESDS) removes all "irrational" plays, aligning with rationalizability (strategies surviving IESDS are exactly those that can be rationalized by some belief).

  ### Why Order of Elimination Matters for Weak but Not Strict Dominance
  #### Strict Dominance: Order-Independent
  - **Reason:** If a strategy is strictly dominated, it remains so even after eliminating other strategies. This is because the dominator (pure or mixed) only depends on *relative payoffs against all opponent actions*, not on other strategies. Removing a strictly dominated strategy doesn't "rescue" others—it only simplifies the game.  
  - **In the example:** **R** is strictly dominated by the mixture. If other strategies existed and were eliminated first, **R** would still be dominated by the same mixture as long as **L** and **M** remain. The outcome of IESDS is unique.

  #### Weak Dominance: Order-Dependent
  - **Reason:** Weak domination (where a strategy is never better but sometimes equal) depends on comparisons with specific strategies. Eliminating one strategy might remove a potential dominator or make a weakly dominated strategy appear non-dominated.  
  - **Example:** Consider a game with P1 strategies **A**, **B**, **C** and P2 strategies **X**, **Y**. P1 payoffs:  
    |          | X    | Y    |
    |----------|------|------|
    | **A**    | 1    | 1    |
    | **B**    | 2    | 0    |
    | **C**    | 0    | 2    |  
    - **A** is *weakly dominated* by a 50-50 mix of **B** and **C**: Against X, mix yields \( (2+0)/2 = 1 \) (same as A); against Y, \( (0+2)/2 = 1 \) (same as A). But no pure strategy dominates A.  
    - **Order 1: Eliminate A first.**  
      - After elimination, **B** and **C** remain. Neither weakly dominates the other (B better against X, C better against Y). No further elimination.  
    - **Order 2: Eliminate B first?**  
      - But **B** is not weakly dominated initially (against X, B=2 > A=1; against Y, B=0 < A=1). Same for **C**. So **A** must be eliminated first.  
    - **Order dependence if we add a strategy:** Suppose a fourth strategy **D** weakly dominated by **A**. Eliminating **A** first might spare **D**, but eliminating **D** first could allow **A** to survive longer. In weak dominance, the set of surviving strategies can depend on order.

  **Key Intuition:** Weak dominance is "context-dependent" because equality in payoffs can be broken by eliminating strategies. Strict dominance is "robust" because strict inequalities hold regardless of other eliminations.

  ### Summary
  - **Mixed strategies as dominators** capture the idea that rational players can "hedge bets" to avoid bad outcomes, which pure strategies alone can't express (e.g., **R** dominated by L-M mix).  
  - **Strict dominance ⇔ Never a best response** because mixtures embody beliefs, and a dominated strategy is always inferior to some response.  
  - **Order independence in IESDS** relies on strict inequalities being immune to eliminations; weak dominance lacks this due to ties.  

  This should clarify why mixed strategies are essential for a complete intuition. If you have a specific game you're struggling with, feel free to share it for further discussion!
