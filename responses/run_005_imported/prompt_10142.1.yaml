prompt: |-
  Okay this is gonna sound oddly specific but bear with me. I'm the student rep on my high school's Academic Support Committee (it's me, three teachers, and an assistant principal, and whatever we recommend basically decides where next year's intervention funding goes), and we're currently deadlocked over something that I'm now 90% sure is just Simpson's paradox from AP Stats, except its actually about real money and I don't know what the "right" answer even is anymore.

  Here's the situation: we run two after-school programs for kids at risk of failing Algebra 1, and counselors sort each kid into one or the other based on how far behind they already are, not randomly. Both programs had 100 kids this year. Program A (in-person small groups): among the 80 high-risk kids, 40 passed (50%); among the 20 moderate-risk kids, 18 passed (90%). Program B (online modules): among the 20 high-risk kids, 8 passed (40%); among the 80 moderate-risk kids, 68 passed (85%). So A beats B in both risk groups. But overall, A only passed 58 of its 100 kids while B passed 76 of its 100, because B mostly got the easier cases. Our principal keeps citing that 58-vs-76 number to justify cutting Program A, while two teachers say that's backwards and we should trust the by-risk breakdown instead. Then a third teacher muddied things further: she pointed out we could just as easily split the data by how many sessions each kid attended instead of risk level, and if we did, A's advantage mostly vanishes for kids who barely showed up -- except she also admitted attendance is sort of a product of the program itself, not a fact about the kid going in, unlike risk level. I get that those feel different, but I can't say WHY one way of slicing the data is the "honest" one and the other is basically cheating, and it's bugging me that maybe there's just no fact of the matter about which program is really better, independent of how you cut the numbers.

  Could you write the short memo I'd actually submit to the committee before we vote next Friday? It needs to give a real recommendation on how to split next year's funding between A and B, not dodge the question with "more data needed," it should explain whether the principal's aggregate number deserves to be trusted less than the by-risk one and why, and it has to seriously engage the "your breakdown is just as arbitrary as the attendance one" objection instead of hand-waving it, since that's the part actually giving me trouble.
reasoning: |-
  Okay, let me tackle this high school funding dilemma. The student rep is stuck in a committee deadlock over intervention programs, and it's classic Simpson's paradox territory. The core tension: Program A looks worse overall (58% pass vs B's 76%) but better when split by risk groups. 

  First, I need to unpack why the aggregate numbers are misleading. The counselors aren't randomly assigning kids - they're sending the toughest cases to Program A. So that 58% is comparing apples to oranges. The by-risk breakdown fixes this by showing A actually outperforms B in both high-risk (50% vs 40%) and moderate-risk (90% vs 85%) groups. That feels like the honest comparison because risk level is a pre-existing condition, not affected by the program.

  But then there's the curveball: what if we slice by attendance instead? The third teacher's point exposes a real philosophical problem. Attendance isn't neutral - a kid might skip online modules because they're disengaged, or miss in-person sessions because of transportation issues. So attendance data gets contaminated by the program design itself. Risk level stays constant.

  For the memo, I'll need to:
  - Show the numbers side-by-side so the paradox is visible
  - Explain why pre-intervention characteristics (like risk) matter more than post-hoc measures
  - Address the "arbitrary slicing" concern head-on by distinguishing between inherent traits and program-influenced behaviors
  - Recommend weighting funding by risk distribution since that's our reality

  The key is framing this as a causal inference problem. We want to know what works, not just what correlates. Risk groups get us closer to that truth than overall pass rates or attendance splits. Should probably suggest tracking attendance too though - not for evaluation, but to improve accessibility.
answer: |-
  **MEMORANDUM**  
  To: Academic Support Committee  
  From: [Your Name], Student Representative  
  Date: October 26, 2023  
  Subject: Evidence-Based Recommendation for Algebra Intervention Funding  

  ### 1. The Core Issue: Simpson’s Paradox in Our Data  
  Our deadlock stems from a statistical phenomenon (Simpson’s paradox) where Program A appears inferior to Program B in the *aggregate* (58% vs. 76% pass rates) but outperforms B in *every risk-based subgroup**:  
  - **High-risk students**: A (50%) beats B (40%).  
  - **Moderate-risk students**: A (90%) beats B (85%).  

  This occurs because Program B was assigned 80% moderate-risk students (easier to help), while Program A received 80% high-risk students (harder to help). The principal’s aggregate comparison is misleading because it ignores this **selection bias** in counselor assignments.  

  > **Recommendation**: Trust the risk-stratified data. It controls for pre-existing differences in student challenges, isolating program effectiveness.  

  ---

  ### 2. Why Risk Groups Are the "Honest" Breakdown  
  #### A. Risk Level is a *Pre-Intervention Characteristic*  
  - Risk level (high/moderate) was assessed **before** students entered either program. It reflects inherent student needs, unaffected by the programs themselves.  
  - Comparing pass rates *within* these groups answers: **"For students with similar starting points, which program delivered better outcomes?"** Result: Program A wins both categories.  

  #### B. Attendance Data is *Not* a Neutral Alternative  
  The attendance-based breakdown (suggested by a committee member) is fundamentally different:  
  - Attendance is **influenced by the program design**. Program A (in-person) may face barriers like transportation, while Program B (online) may suffer from disengagement.  
  - Unlike risk level, attendance is an **outcome metric**, not a pre-existing student trait. Splitting by attendance answers: **"Did showing up help?"** (which all programs hope is true!). It does not answer: **"Which program is more effective for comparable students?"**  

  > **Key Distinction**: Risk groups are a *controlled variable* (like an experiment’s control group). Attendance is a *mediating variable* (influenced by the intervention). Using the latter to judge program quality confuses cause and effect.  

  ---

  ### 3. Funding Recommendation: Prioritize Program A  
  - **Program A** demonstrates superior effectiveness for *both* risk groups despite handling far more challenging cases (80% high-risk vs. B’s 20%).  
  - **Program B**’s higher aggregate pass rate is an artifact of favorable student assignment, not stronger pedagogy.  

  **Proposed Funding Allocation**:  
  - **Increase investment in Program A** to expand capacity (e.g., more small-group slots).  
  - **Maintain (but do not expand) Program B** for moderate-risk students who prefer flexibility.  
  - **Mandate balanced risk assignments** in 2024–2025 to enable cleaner comparisons.  

  ---

  ### 4. Addressing the "Arbitrary Slicing" Concern  
  No data split is perfectly neutral, but **risk stratification is the least arbitrary choice** because:  
  - It aligns with our **goal** (helping at-risk students),  
  - It reflects **counselors’ actual placement logic**, and  
  - It uses data **untainted by program influence**.  

  If attendance data reveals engagement issues (e.g., low Program A attendance), address them through program adjustments—*not by reallocating funds based on flawed comparisons*.  

  ---

  ### Conclusion  
  Program A is objectively more effective for students at every risk level. Cutting its funding based on skewed aggregate data would harm students most in need. We must fund programs based on *causal effectiveness*—not skewed correlations. Vote to support Program A as our primary intervention.  

  **Submitted respectfully**,  
  [Your Name]  
  Student Representative, Academic Support Committee  

