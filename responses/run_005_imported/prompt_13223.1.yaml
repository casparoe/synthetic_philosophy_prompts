  We are scoring four moves:

  1. Dana's opener: "obviously you pay: that's what updateless decision theory tells you to do, and refusing is the same mistake as two-boxing on Newcomb's problem."
     - Score: 2 (clearly right in the context of UDT and avoiding the Newcomb mistake). The analogy to Newcomb is strong: in Newcomb, two-boxing is a mistake because it leads to getting only $1000 when you could have gotten $1,000,000. Similarly, in counterfactual mugging, refusing to pay in the tails branch means you lose the $10,000 in the heads branch. UDT recommends paying because it considers the overall strategy.

  2. Marcus's reply: "once you actually know it's tails, there is zero causal or evidential benefit to handing over the cash, your just setting money on fire, and calling that 'irrational' because some earlier version of you would've liked to precommit doesn't bind the you standing there now."
     - Score: 1 (partially right, but misses the point of UDT). From a causal perspective at the moment of decision in the tails branch, paying $100 does seem like burning money. However, Marcus ignores that the decision affects the outcome in the heads branch (via Omega's prediction). The precommitment is not just about an earlier version but about the overall strategy that would have gotten the $10,000.

  3. Dana's comeback: dynamic consistency: an agent that wants to precommit but then reneges once the moment actually arrives is exploitable, so a reflectively stable agent just pays, full stop.
     - Score: 2 (strong point). Dynamic inconsistency is a well-known problem in decision theory. If an agent cannot stick to a plan that was optimal ex ante, then they can be exploited (e.g., by Omega in this setup). A reflectively stable agent would pay to avoid such exploitation.

  4. Marcus's prior-moment objection: "ex ante optimal" only means something relative to a chosen prior moment, and nothing forces you to anchor that moment "before the coin flip" rather than "right after Omega tells you the result" -- at which point the pay-up policy is obviously worse. He said Dana was just picking whichever vantage point hands him the answer he already wanted.
     - Score: -1 (weak and misses the point). While it is true that the choice of the prior moment can affect what is considered optimal, the problem setup includes the prediction that happens before the coin flip. Therefore, the relevant prior moment is before the coin flip because that's when the prediction is made and when the strategy is set. Choosing the moment after the result is known is arbitrary and ignores the dependency on the prediction. Moreover, if we always choose the moment after the result, then we lose the ability to make commitments that are necessary for beneficial interactions with predictors.

  Justifications:

  - Move 1: Dana correctly identifies the parallel to Newcomb's problem and the UDT solution. This is a standard argument in decision theory.
  - Move 2: Marcus has a point about the immediate lack of benefit, but he fails to account for the fact that the decision is part of a larger strategy that affects the heads branch. His argument is too myopic.
  - Move 3: Dana's point about dynamic consistency and exploitability is crucial. A rational agent should not be dynamically inconsistent because that leads to being money-pumped or exploited.
  - Move 4: Marcus's objection about the prior moment is flawed because the problem is defined with a prediction that occurs before the coin flip. Therefore, the ex ante moment that matters is before the flip. Shifting the anchor to after the flip is ad hoc and undermines the ability to benefit from precommitments.

  What both are missing:

  - Dana might not have emphasized enough that UDT is a specific theory that resolves these issues by considering the agent's policy across all possible worlds (including counterfactuals). It is not just about precommitment but about choosing a strategy that maximizes expected utility from the perspective of the initial state.

  - Marcus is missing the idea that decision theory must account for predictors and counterfactuals. If we only consider the current branch, we lose the benefits of coordination with our past and future selves (and with predictors). This leads to suboptimal outcomes in the long run.

  - Both might benefit from considering the broader implications: in real-world scenarios (like AI safety), agents that are dynamically consistent and can commit to strategies that are ex ante optimal (even when they are ex post suboptimal in some branches) are more robust and less exploitable.

