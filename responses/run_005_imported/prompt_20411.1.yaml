answer: |-
  Here’s a toast that threads the needle—respectful to her intellect, warm for her family, with one central joke that lands universally. It runs about 4:30–5:00 minutes spoken naturally.

  ---

  **(Clink glass gently)**  
  "Friends, colleagues, family—especially [Husband’s Name] and [Sister’s Name], who deserve medals—we’re here to celebrate [Colleague’s Name]’s truly remarkable career. Nearly 40 years of teaching, challenging, and inspiring generations of thinkers.  

  For most of us, changing your mind is like… deciding to try oat milk. Quiet. Personal. Maybe a little trendy. But for [Colleague’s Name]? Changing her mind was an *event*. A tectonic shift. A… well… **(leans in conspiratorially)** let’s just say it made Christmas 2014 *memorable*.  

  **[JOKE SECTION - PACE SLOWLY]**  
  You see, for over twenty years, she taught that the bystander *could* flip the switch. Save five lives, lose one. A cornerstone of ethics! Then, one Tuesday, after coffee and probably something Kantian… she stood before her seminar and declared: *Nope. Can’t do it.* Just like that. The switch stayed unflipped.  

  Now, for her grad students—**(gestures to them)**—this was seismic. Like Newton saying gravity was ‘just a vibe’. It wasn’t just *what* she changed, but *why*. She pulled the rug—no, the *whole floor*—out from under decades of debate. **(Turns to family)** For [Husband] and [Sister]? It was… different. You didn’t get footnotes or citations over Christmas dinner. You just got [Colleague’s Name], pacing the living room, muttering about *intention* and *collateral damage* while the turkey went cold. **(Pause for laugh)** I’m told she once re-enacted the trolley problem with gravy boats. Relentless. Adorable. Slightly terrifying.  

  **[BRIDGE - TONE SHIFTS TO AFFECTIONATE]**  
  And that’s the magic of [Colleague’s Name]. That intensity. That fearless honesty—first to her own ideas, then to ours. She didn’t just teach philosophy; she *lived* it. When she reversed course, it wasn’t caprice—it was courage. She showed us that real wisdom isn’t clinging to old answers. It’s staring down a dilemma—whether it’s in a journal or your own seminar notes—and saying, ‘*I was wrong. Let’s dig deeper.*’  

  **[LEGACY SECTION - WARMTH]**  
  Her former students—**(smiles at them)**—you carry that. Not just doctrines or distinctions, but that rigor. That refusal to take an intuition for granted. And for her family—**(nods to them)**—you endured the ‘deep dives’ over dessert. You saw the engine behind the intellect: the passion, the integrity, the sheer force of caring so much it kept her—and occasionally you—up at night.  

  **[CLOSE - RAISE GLASS]**  
  So let’s raise a glass to [Colleague’s Name]. To four decades of turning minds… and yes, occasionally turning trolley problems upside down. Thank you for teaching us that the most ethical choice isn’t always clear—but changing your mind with conviction? That’s always noble. That’s always brave. That’s always… *you*.  

  To [Colleague’s Name]—may retirement be full of joy, grand philosophical questions that *don’t* involve runaway trolleys… and at least one Christmas dinner where the gravy boats stay put. Cheers!"  

  ---

  ### Why this works:
  1. **The Joke Lands Universally**:  
     - **Philosophers** hear the technical truth (undermining the foundational intuition) framed accessibly.  
     - **Family** gets the relatable punchline ("muttering about intention... turkey went cold," "gravy boats").  
     - The **pacing & gravy boat visual** makes it absurd enough for laughs, not eye-rolls.  

  2. **No Dumbing Down, No Lecture**:  
     - Uses terms like "cornerstone," "intuition," "rigor," and "doctrines" *contextually*—meaningful to insiders, non-distracting to others.  
     - Focuses on her *character* (courage, honesty) not the technical debate.  

  3. **Balanced Tone**:  
     - "Relentless. Adorable. Slightly terrifying" = affectionate tease for family, accurate tribute for academics.  
     - The bridge ("real wisdom isn’t clinging...") reframes her reversal as integrity, not academia.  

  4. **Respects Both Audiences**:  
     - Nods to students’ intellectual debt ("you carry that rigor").  
     - Honors family’s patience ("endured the deep dives").  

  **Delivery Tip**: Pause after the gravy boat line—let the laugh build. Keep eye contact with family during that bit, and with grads during "pulled the whole floor out." Warmth outweighs precision here.
