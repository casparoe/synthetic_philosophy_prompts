prompt: |-
  During a long career studying the evolution of animal communication—vervet alarm calls, the honeybee waggle dance—I never had to credit my subjects with beliefs about each other's beliefs. So David Lewis's Convention unsettled me: he defines a convention as a regularity that persists only because it is common knowledge in a population that everyone conforms to it, expects others to conform, and would have conformed just as readily to some different regularity had that come first instead. Brian Skyrms, in The Stag Hunt and the Evolution of Social Structure and Signals: Evolution, Learning, and Information, derives the same phenomena—including full-blown Lewis-style signalling conventions—from evolutionary dynamics or reinforcement learning alone, with no common knowledge or rationality assumed.

  Compare Lewis's account of convention with Skyrms's evolutionary account. Does Skyrms's success show that Lewis's common-knowledge clause was never doing real explanatory work, or does it leave out some genuinely normative feature of convention that mere evolved regularities lack? Also say whether Lewis's framework, built for pure coordination problems where every equilibrium suits everyone equally, extends to the stag-hunt cases central to Skyrms's later work, where a safer and a more rewarding equilibrium pull apart. Defend a definite verdict on the first question rather than settling for 'both are partly right.'
reasoning: |-
  Okay, the user is asking me to compare David Lewis's account of convention with Brian Skyrms's evolutionary account. They want to know if Skyrms's success in explaining conventions through evolutionary dynamics undermines Lewis's common-knowledge requirement, or if Lewis's account captures something normative that Skyrms's misses. They also want me to address whether Lewis's framework extends to stag-hunt scenarios where equilibria have different payoffs.

  I need to recall Lewis's definition of convention. He sees conventions as regularities that persist because of common knowledge - everyone knows everyone conforms, expects others to conform, and would conform to alternatives if they came first. This is grounded in rationality and mutual expectations. Skyrms, on the other hand, shows how conventions can emerge from evolutionary processes or reinforcement learning without assuming common knowledge or rationality. His models demonstrate how signaling systems can evolve through simpler mechanisms like natural selection or learning.

  For the first question, I should argue that Skyrms's success does show that common knowledge isn't necessary for explaining how conventions emerge. His models provide a mechanistic explanation that doesn't require high-level cognitive states. However, Lewis's account captures a normative dimension - the "ought" of conventions - that Skyrms's descriptive approach doesn't address. So while common knowledge might not be needed for emergence, it might be part of what sustains conventions in rational agents.

  Regarding stag-hunt games, Lewis's original framework is designed for pure coordination problems where all equilibria are equally good. Stag-hunt involves a risk/reward trade-off between equilibria. Lewis's concept can technically extend to these cases since multiple equilibria exist, but it doesn't handle the normative implications of preferring one equilibrium over another. Skyrms's evolutionary approach better explains why risk-dominant equilibria might emerge, but Lewis's common knowledge could help explain why groups might coordinate on payoff-dominant equilibria despite the risk.

  The user wants a definite verdict, so I'll argue that Skyrms's work shows common knowledge isn't necessary for explanatory purposes, but Lewis's account captures something normatively important. For stag-hunt, Lewis's framework extends technically but misses crucial strategic elements. I'll structure this clearly with sections on explanatory work, normative features, and stag-hunt extension, concluding that Skyrms's success reveals the common knowledge clause isn't essential for explanation, though it has normative relevance.
answer: |-
  Here's a comparison of Lewis and Skyrms on conventions, addressing your specific questions with a definite verdict:

  1.  **Lewis's Account (Common Knowledge & Rationality):**
      *   **Core:** A convention is a regularity R in behavior. Its persistence *depends crucirally* on a complex cognitive state: **common knowledge** within the population that:
          *   Everyone conforms to R.
          *   Everyone expects everyone else to conform to R.
          *   Everyone prefers to conform to R *conditional* on the expectation that others conform.
          *   There exists at least one *alternative* regularity R' that could have served the same purpose, and everyone would have preferred to conform to R' *conditional* on the expectation that others conform to R'.
      *   **Foundation:** Grounded in game theory (specifically coordination games) and rational choice theory. Agents are rational, have preferences, form beliefs (including higher-order beliefs about others' beliefs), and choose best responses.
      *   **Normativity:** The "ought" is inherent. Conforming is rational *given* the common knowledge and mutual expectations. The convention itself carries a normative force derived from this rationality and mutual obligation. Defection is irrational (a coordination failure) and potentially blameworthy.
      *   **Scope:** Primarily designed for **pure coordination problems** (e.g., driving side, language), where all equilibria (coordinated solutions) are equally good for all players. Lewis acknowledges other game types but focuses here.

  2.  **Skyrms's Account (Evolution & Learning):**
      *   **Core:** Conventions (especially signaling conventions) emerge and stabilize through **evolutionary dynamics** (replicator dynamics, natural selection) or **reinforcement learning**. Agents are not assumed to be rational or to have beliefs about others' beliefs. They follow simple rules: strategies that yield higher payoffs (or reinforcement) are replicated or reinforced more often.
      *   **Foundation:** Grounded in evolutionary game theory and learning theory. Focuses on population-level dynamics and individual adaptation based on past success/failure, not strategic reasoning based on future expectations.
      *   **Normativity:** Primarily *descriptive* and *explanatory*. It shows *how* regularities *can* and *do* emerge without complex cognition. Any "ought" is external (e.g., a biologist observing the evolved function) or arises indirectly from the learning process (agents learn *that* doing X leads to reward). The normativity is functional (it works) rather than deontic (it's the rational/right thing to do given mutual expectations).
      *   **Scope:** Explicitly tackles a wider range of games, most notably the **Stag Hunt**, where equilibria differ in payoff and risk (safer Hare equilibrium vs. riskier but more rewarding Stag equilibrium). Explores how risk-dominance or population structures influence which convention emerges.

  **Addressing Your Questions:**

  1.  **Does Skyrms's success show Lewis's common-knowledge clause wasn't doing real explanatory work? (Definite Verdict):**
      *   **Yes, Skyrms's success decisively shows that Lewis's common-knowledge clause is *not necessary* for explaining the *emergence and persistence* of conventional regularities.** This is the crucial point.
      *   **Explanation:** Skyrms provides rigorous models demonstrating that behaviors indistinguishable from Lewisian conventions *can* and *do* arise through simpler, cognitively undemanding mechanisms like natural selection (where differential reproduction favors successful strategies) or reinforcement learning (where agents simply repeat actions that led to rewards). Vervet alarm calls or honeybee dances are prime examples – their conventional nature is elegantly explained by Skyrmsian dynamics without positing that vervets have common knowledge about each other's expectations regarding alarm calls, or that bees have mutual beliefs about the meaning of waggles. The regularity persists because it *works* (provides fitness benefits or reinforcement), not necessarily because agents mutually know it works and expect each other to follow it. Skyrms's models *explain the phenomenon* Lewis described using fundamentally different, and empirically more plausible (for many cases, especially in non-human animals), building blocks.
      *   **Verdict:** Lewis's common-knowledge clause **was not doing essential *explanatory* work** in accounting for the *existence* of behavioral regularities we call conventions. Skyrms provides a superior *explanation* for their emergence and stability in many contexts, particularly biological ones.

  2.  **Does Skyrms leave out a genuinely normative feature?**
      *   **Yes, Skyrms's account leaves out the *distinctively normative* feature central to Lewis's conception.**
      *   **Explanation:** Lewis's common knowledge creates a web of *mutual obligations and expectations* constitutive of the convention's normative force *for the rational agents within it*. In Lewis's framework, violating a convention isn't just ineffective; it's *irrational* (failing to play your part in the mutually known and expected coordination) and potentially a breach of an implicit agreement sustained by mutual knowledge. Skyrms's evolved regularity might be *functional*, and agents might *learn* to follow it, but it lacks this layer of mutual recognition and obligation. A Skyrmsian agent stops signaling not because it's irrational or breaking a known mutual expectation, but because signaling stopped being reinforced. The "ought" in Skyrms is purely instrumental ("do this to get reward/avoid punishment") or descriptive ("this is the functional norm"). Lewis captures a *social, reason-giving* "ought" grounded in mutual awareness ("we all know we all expect this of each other, so we *should* do it"). This normative dimension is crucial for understanding human conventions like language, promises, or social norms, where violation often carries a sense of *wrongness* beyond mere inefficiency.

  3.  **Does Lewis's framework extend to Stag Hunt cases?**
      *   **Technically Yes, But Inadequately.**
      *   **Explanation:** Lewis's definition *can* be formally applied to Stag Hunt. There are multiple equilibria (Stag-Stag, Hare-Hare), and common knowledge of conformity/expectations could sustain either. The preference clause ("would have conformed to an alternative R'") also holds. *However*, Lewis's framework struggles critically with the core feature of Stag Hunt: **the equilibria are NOT equally good.**
      *   **The Problem:** Lewis's framework, built for pure coordination, assumes agents are indifferent between equilibria. In Stag Hunt, everyone *strictly prefers* the Stag equilibrium, but the Hare equilibrium is *safer* (risk-dominant). Lewis's common knowledge doesn't inherently help agents *coordinate on the Pareto-superior (Stag) equilibrium* over the risk-dominant (Hare) one. Why would common knowledge lead them to risk Stag when they know everyone expects Hare and playing Hare is safe? Lewis's framework doesn't provide the tools to explain *which* equilibrium gets established as the convention when they have different payoffs and risks. Skyrms's evolutionary/learning dynamics, however, directly address this, showing how factors like initial conditions, population structure, mutation rates, or learning speeds can favor the emergence of either the payoff-dominant or risk-dominant convention. Lewis's framework *describes* a possible state (common knowledge sustaining *an* equilibrium) but fails to explain the *selection* between fundamentally different equilibria that characterizes Stag Hunt problems.

  **Conclusion:**

  Skyrms's evolutionary and learning models provide a powerful and often more empirically grounded **explanation** for the emergence and persistence of conventional regularities, demonstrating that Lewis's demanding common-knowledge requirement is **not necessary for explanatory work**. However, Lewis successfully captures a **genuinely normative dimension** of conventions – the sense of mutual obligation and reason-giving force derived from common knowledge of mutual expectations – that Skyrms's functional, instrumental account lacks. For pure coordination, Lewis's framework is elegant and normatively rich. For Stag Hunt scenarios, while technically applicable, Lewis's framework fails to address the critical problem of equilibrium *selection* between options of differing value and risk, a problem Skyrms's dynamics are specifically designed to tackle. Thus, Skyrms succeeds in *explaining the phenomenon*, but Lewis identifies an important *normative aspect* relevant especially to human sociality and rationality.
