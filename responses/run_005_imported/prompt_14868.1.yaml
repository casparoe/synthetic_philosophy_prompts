answer: |-
  Your reading of Sidgwick's persistent involvement in psychical research is insightful and largely fair, capturing the core motivations and context that distinguished his work from casual belief or cynical dismissal. Here's a breakdown of why your interpretation holds merit, with some nuances:

  1.  **Reputation for Rigor and Scepticism:** Sidgwick was indeed renowned for his intellectual honesty, methodological scrupulousness, and profound scepticism. His philosophical work, especially *The Methods of Ethics*, is characterized by its careful weighing of arguments and reluctance to accept easy answers. This wasn't just a public image; it was his fundamental intellectual character. Applying this same rigorous standard to psychical phenomena gave his investigations unique credibility.

  2.  **Willingness to Expose Fraud:** The SPR, under Sidgwick's leadership, was explicitly committed to exposing fraud. They weren't gullible believers seeking confirmation; they were investigators seeking *truth*, whatever it might be. Sidgwick, Eleanor Sidgwick, Edmund Gurney, Frederic Myers, and others personally unmasked several prominent mediums. This wasn't seen as a failure of the inquiry, but as a *necessary part* of the scientific process – eliminating noise to find any potential signal. Sidgwick famously said his aim was "to put an end to the impostures which have too often been mixed up with genuine phenomena."

  3.  **Persistence Despite Disappointment:** Sidgwick *was* deeply disappointed and disillusioned by repeated exposures and the elusiveness of conclusive proof. He confessed to periods of despair and frustration. Yet, he persisted for decades. This persistence stemmed from several key factors:
      *   **Profound Existential Motivation:** Sidgwick had lost his Christian faith. Psychical research represented a potential path to empirical evidence for *some* form of survival after death or a deeper spiritual reality. This wasn't a hobby; it was a quest for answers to fundamental human questions that philosophy alone couldn't satisfy for him. His ethical commitment to truth demanded he pursue this avenue rigorously.
      *   **Methodological Commitment:** He believed that extraordinary claims required extraordinary investigation. Dismissing everything after a few frauds was, to him, as unscientific as accepting everything uncritically. He felt a duty to investigate thoroughly, applying the best methods available (even if they were often inadequate for the task).
      *   **The Nature of the "Residuum":** Despite exposing frauds, Sidgwick and his colleagues (especially Myers and Gurney) felt there remained a small "residuum" of phenomena that were genuinely puzzling and resistant to conventional explanation *at the time*. This included certain telepathy experiments, unusual mediumistic performances that defied easy exposure, and spontaneous case collections (like *Phantasms of the Living*) that suggested patterns needing explanation. They believed this residuum deserved continued scrutiny.
      *   **Scientific Imperative:** Sidgwick saw the investigation of consciousness, perception, and potential unknown faculties as a legitimate, even vital, scientific frontier. The SPR aimed to bring order and discipline to a field rife with superstition and fraud.

  4.  **The "Genuinely Puzzling" Factor & The "Fading":** This is the core of your point, and it's valid.
      *   **Context of Knowledge:** In the late 19th century, understanding of psychology (suggestion, dissociation, hypnosis, memory distortion), neurology, statistics, and the myriad ways perception and testimony can be flawed was far less developed than today. Phenomena that seem easily explainable now (e.g., cold reading, ideomotor effects, sensory leakage in early telepathy tests, the power of expectation and belief) were genuinely baffling then. Sidgwick's circle were pioneers in *developing* these critical methods.
      *   **Access to "Star" Performers:** The SPR investigators had direct, often prolonged, access to the most famous mediums of the era (Eusapia Palladino, Leonora Piper, etc.) under conditions they believed were controlled (though often later found lacking by modern standards). They witnessed phenomena that seemed, *at the time and under those specific observational conditions*, inexplicable by known fraud or normal psychology. Later re-evaluations often revealed flaws, but the initial puzzlement was real for serious investigators.
      *   **Fading vs. Settled:** You are correct that the "case" largely faded rather than being definitively "settled" in a single moment. Why?
          *   **Lack of Conclusive Proof:** Despite decades of effort, no phenomenon was ever conclusively proven under conditions that satisfied the broader scientific community *and* remained consistently replicable. The residuum remained elusive.
          *   **Death of Key Figures:** Sidgwick, Gurney, and Myers died within a few years of each other, taking much of the original driving force and intellectual firepower with them.
          *   **Rise of Modern Psychology:** As experimental psychology matured (ironically, partly spurred by SPR research into attention, suggestion, and error), it provided increasingly powerful naturalistic explanations for phenomena previously attributed to the paranormal. The focus shifted.
          *   **Institutionalization and Drift:** The SPR continued, but its focus broadened, and its connection to the highest levels of mainstream philosophy and science (embodied by Sidgwick) weakened. Psychical research became more marginalized.
          *   **The Burden of Fraud:** The relentless exposure of fraud, while necessary, inevitably tainted the entire field in the eyes of the public and mainstream science, making sustained serious attention difficult.

  **Conclusion:**

  Yes, your reading is fair. Sidgwick's extreme caution, rigorous methodology, willingness to expose fraud, and yet *persistent* dedication over decades strongly suggest that he and his closest colleagues encountered phenomena that were, **within the context of late 19th-century scientific knowledge and investigative techniques,** genuinely puzzling and resistant to easy dismissal. Their persistence wasn't born of gullibility but of a deep existential need, a commitment to scientific thoroughness applied to a deeply unpopular subject, and the perception of an unresolved "residuum."

  It is accurate to say the "case" faded rather than being definitively settled *to Sidgwick's personal satisfaction* or that of his inner circle. They died without the proof they sought, and mainstream science moved on, finding the evidence unconvincing and the field increasingly associated with fraud and poor methodology. However, from the perspective of modern science, equipped with a far deeper understanding of human cognition, perception, and the pitfalls of experimentation, the consensus is that the phenomena investigated, while perhaps puzzling *then*, have ultimately yielded to naturalistic explanations or been shown to be based on inadequate evidence and controls. Sidgwick's persistence is a testament to his character and the genuine *perceived* anomalies of his time, but not necessarily evidence for the reality of the phenomena themselves. His story is one of brilliant, rigorous intellectual honesty grappling with profound questions at the very limits of what could be known with the tools available.
