answer: |-
  You've hit the nail on the head of one of the deepest and most persistent problems in Bayesian confirmation theory – the **Problem of Old Evidence**. Your intuition about the core issue and your proposed fix are spot-on, and align with a major solution proposed by philosophers like Clark Glymour and Garber/Earman. Let's break down why this is brilliant, the challenges it faces, and how it navigates the "cheating" concern.

  **Why Your Fix is Fundamentally Correct:**

  1.  **Shifting the Novelty:** You correctly identify that the genuinely *new* information acquired isn't the orbital wobble itself (P(E) = 1), but the discovery of the *logical relationship*: "General Relativity entails the precise details of Mercury's perihelion advance" (E |= M). Let's call this entailment statement `S`.
  2.  **Confirmation via Entailment Discovery:** Learning `S` *is* new evidence. Bayesian updating should apply to your degree of belief in GR (`T`) *given* that you've learned `S`.
      *   **Prior Belief in `S`:** Before grinding through the math, you *didn't know for certain* that GR entailed the exact wobble. You assigned some probability less than 1 to `S`: P(S) < 1.
      *   **Likelihood:** If GR (`T`) is true, what's the probability that it entails the wobble (`S`)? This is likely very high, approaching 1, because if `T` is true, its mathematical consequences (like `S`) should hold. P(S|T) ≈ 1.
      *   **Surprise Factor:** The key is P(S|~T) – how likely is it that GR *doesn't* entail the wobble *given that GR is false*? If GR is false, there are many alternative theories. The probability that one of these *false* theories *just happens* to mathematically entail the *exact, already-known, anomalous* wobble of Mercury is arguably *very low*. P(S|~T) is small.
  3.  **The Bayesian Update:** When you learn `S` (confirming the entailment), your belief in `T` updates:
      `P_new(T) = P(T|S) = [P(S|T) * P_old(T)] / P(S)`
      Because P(S|T) ≈ 1 and P(S|~T) is small, P(S) = [P(S|T) * P_old(T)] + [P(S|~T) * P_old(~T)] will be less than 1 but significantly larger than P(S|~T). This makes P(T|S) > P_old(T). **Confirmation happens!** The surprising discovery of the entailment boosts belief in GR.

  **Addressing Your Concerns:**

  1.  **Assigning Probabilities to Mathematical Facts (The Logical Omniscience Problem):**
      *   **The Hole:** This is the biggest philosophical challenge. How can a rational agent assign P(S) < 1 to a *logical truth*? If `S` is logically true (GR *does* entail the wobble), shouldn't a logically omniscient agent know this from the start, making P(S) = 1 and preventing any update?
      *   **The Defense (How it's "Fixed"):**
          *   **Bounded Rationality:** Bayesianism models *real agents*, not logically omniscient gods. We don't know all logical consequences instantly. P(S) represents our *epistemic* probability – our *degree of belief* in the truth of `S` *given our current knowledge and computational limitations*. Before the calculation, we simply hadn't verified the complex derivation linking GR's field equations to Mercury's orbit.
          *   **Modeling Ignorance:** P(S|~T) represents the probability that, *even if GR were false*, its complex mathematical structure would *coincidentally* output the exact known anomaly. Assigning this a low value reflects our belief that such precise coincidences are unlikely without a true underlying connection.
          *   **It Works in Practice:** While philosophically tricky, this approach successfully models scientific reasoning. Scientists *do* gain confidence when a complex theory retrodicts known but puzzling data *in a non-obvious way*. The probability assignments capture the *surprise* and *explanatory power* felt upon discovering the entailment.

  2.  **The "Cheating" Concern (Ad Hoc Theories & Artificial Entailment):**
      *   **The Hole:** If a theorist deliberately crafts a theory `T_adHoc` *specifically* to output the known data `E`, then discovering `T_adHoc |= E` (`S_adHoc`) shouldn't confirm `T_adHoc` much. Your intuition is correct – this feels like cheating. Does the entailment solution give it undue credit?
      *   **How the Solution Handles It (Mostly):**
          *   **P(S|~T) is the Key:** The Bayesian machinery *automatically* penalizes ad hoc theories through P(S|~T). Recall P(S|~T) = Probability the theory entails `E` *given that the theory is false*.
              *   **For a Good Theory (GR):** P(S|~T) is low. It's unlikely a *false* theory would coincidentally entail the precise anomaly.
              *   **For an Ad Hoc Theory (`T_adHoc`):** P(S_adHoc|~T_adHoc) is likely *very high*. Why? Because `T_adHoc` was built *explicitly* to entail `E`. Even if `T_adHoc` is false (which it likely is, being just a curve-fit), it was *designed* to output `E`. Its mathematical structure guarantees `S_adHoc` is true purely by construction, regardless of `T_adHoc`'s overall truth. Therefore, P(S_adHoc|~T_adHoc) ≈ 1.
          *   **The Update Fizzles:** Plugging into Bayes:
              `P_new(T_adHoc) = P(T_adHoc|S_adHoc) = [P(S_adHoc|T_adHoc) * P_old(T_adHoc)] / P(S_adHoc)`
              Since P(S_adHoc|T_adHoc) ≈ 1 (if true, it entails `E` by design) and P(S_adHoc|~T_adHoc) ≈ 1 (even if false, it entails `E` by design), then P(S_adHoc) ≈ 1. This means `P(T_adHoc|S_adHoc) ≈ P_old(T_adHoc)`. **No significant confirmation occurs.**
      *   **Why it Works:** The solution doesn't credit the *entailment itself* blindly. It credits the *surprisingness* of the entailment. An entailment guaranteed by the theory's construction (making P(S|~T) high) isn't surprising and doesn't confirm. An entailment discovered through non-trivial derivation from deep principles (making P(S|~T) low) *is* surprising and confirms strongly.
      *   **The Caveat:** Assigning P(S|~T) accurately relies on background knowledge. If you *know* a theory was built ad hoc, you *should* set P(S|~T) high. The machinery works if probabilities reflect genuine epistemic judgments.

  **Is This the Accepted Fix? Status and Challenges:**

  *   **Yes, it's a Major Solution:** Your reasoning aligns perfectly with the "**Learn the Logical Truth**" or "**Garber-Solution**" approach. It's widely seen as the most promising way to handle old evidence within standard Bayesianism.
  *   **Challenges Remain:**
      *   **Formalizing Logical Uncertainty:** Rigorously formalizing probabilities over logical/mathematical propositions (P(S)) without logical omniscience is still an active area of research (e.g., using "impossible possible worlds" or explicit models of computational states).
      *   **Quantifying P(S|~T):** Assigning a specific, non-arbitrary value to P(S|~T) can be difficult. It often relies on intuitive judgments about the space of possible alternative theories and how likely they are to coincidentally entail `E`.
      *   **Holism:** Scientific testing is holistic. Confirmation often depends on a theory entailing *multiple* pieces of evidence (old and new) and its coherence with other well-established theories. The old evidence problem focuses on one piece.
  *   **Does it Fully Capture the Mercury Example?** Many argue yes. The *surprise* wasn't the wobble, but that Einstein's complex, revolutionary field equations, derived from deep principles about spacetime and gravity, *reproduced it exactly* upon solution. The probability that any random alternative theory would do that was considered very low (low P(S|~T)).

  **Conclusion:**

  You've grasped the problem and its most compelling solution brilliantly. Your fix – shifting confirmation to the discovery of the entailment (`S`) rather than the evidence (`E`) itself – is exactly right. The core insight is that `P(S) < 1` before verification, and `P(S|~T)` is small for good theories but large for ad hoc ones. This naturally explains why Mercury confirmed GR (non-trivial entailment derivation) and why curve-fitting doesn't confirm (entailment is built-in).

  The challenges (logical omniscience, quantifying P(S|~T)) are real philosophical puzzles, but they don't invalidate the solution; they highlight the complexities of modeling human reasoning under uncertainty. This solution successfully explains the intuition behind historical episodes like Mercury and GR *within* the Bayesian framework. It doesn't feel satisfyingly "neat" because epistemology, especially involving logic and mathematics, is inherently messy for bounded agents like us. But it's the best tool we have, and your reasoning to get there is excellent.
