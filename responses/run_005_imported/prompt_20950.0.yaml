answer: |-
  You've hit on a fascinating tension between elegant mathematical theory and the messy realities of the legal system! The Condorcet Jury Theorem (CJT) is indeed compelling, but its application to real-world juries is heavily constrained by several critical assumptions and practical considerations. Here's why courts don't just impanel 100 jurors:

  1.  **Violation of CJT Core Assumptions:**
      *   **Uniform Competence:** CJT assumes *every* juror has an *independent* probability (p > 0.5) of reaching the correct verdict. Reality is messier:
          *   **Varying Competence:** Jurors have vastly different backgrounds, cognitive abilities, biases, attention spans, and understanding of complex evidence/law. Some may have p significantly < 0.5 due to prejudice, confusion, or disengagement.
          *   **Non-Independence:** Jurors don't deliberate in isolation. Group dynamics, charismatic leaders, social pressure, and the *shared evidence* itself create dependence. A large group might amplify early biases or dominant personalities rather than independently converging on truth.
      *   **Binary Choice:** CJT models a simple "guilty/not guilty" or "liable/not liable" choice. Real trials involve complex, multi-faceted evidence, nuanced interpretations of law, and multiple elements to be proven. The "correct" verdict is often less clear-cut than the theorem assumes.

  2.  **Practical and Logistical Nightmares:**
      *   **Deliberation Effectiveness:** The core strength of a jury is *collective deliberation*. 12 people can reasonably discuss evidence, argue points, and reach consensus. 60 or 100 people? This becomes chaotic and logistically impossible. Meaningful discussion among 100 people is impractical. Smaller groups allow for thorough airing of viewpoints.
      *   **Trial Length & Cost:**
          *   **Voir Dire:** Selecting 100 impartial jurors would take *weeks or months*, dramatically increasing costs and delays.
          *   **Trial Presentation:** Presenting evidence (exhibits, testimony) to 100 jurors simultaneously is physically challenging (courtroom size, sightlines, acoustics). Replays or clarifications become cumbersome.
          *   **Judge & Attorney Resources:** Managing a trial with 100 jurors is vastly more complex and time-consuming for everyone involved.
      *   **Juror Burden:** Finding citizens willing/able to serve for potentially months (instead of weeks) would be extremely difficult, worsening the jury pool problem.

  3.  **The Value of Unanimity:**
      *   **Legitimacy & Confidence:** A unanimous verdict carries immense psychological and societal weight. It signals that *all* jurors, after deliberation, were convinced "beyond a reasonable doubt" (criminal) or by the "preponderance of the evidence" (civil). This fosters public trust in the verdict.
      *   **Thorough Deliberation:** Unanimity forces jurors to engage seriously with dissenting views. They must persuade each other, re-examine evidence, and confront weaknesses in their own reasoning. Majority rule in a large group might allow a lazy or slightly biased majority to prevail without truly grappling with minority concerns.
      *   **Protection Against Marginalization:** Unanimity helps ensure that minority viewpoints (which might be correct or highlight flaws in the majority's reasoning) are heard and addressed. In a large majority-rule jury, smaller subgroups could be easily ignored.
      *   **Higher Standard (Criminal):** In criminal cases, the "beyond a reasonable doubt" standard is intentionally high. Unanimity acts as a safeguard, making it harder to convict an innocent person. CJT's statistical accuracy might prioritize overall correctness rates, but the law prioritizes *minimizing wrongful convictions* even if it means some guilty go free. Unanimity serves this protective function.

  4.  **Legal Precedent & Constitutional Considerations:**
      *   **History & Tradition:** The 12-person unanimous jury has deep roots in Anglo-American common law tradition, dating back centuries. This carries significant weight.
      *   **Supreme Court Rulings:** The US Supreme Court has addressed jury size:
          *   *Williams v. Florida (1970):* Upheld 6-person juries for *non-capital* criminal trials (though many states still use 12).
          *   *Ballew v. Georgia (1978):* Struck down 5-person juries as too small, citing concerns about deliberation quality, minority representation, and reliability.
          *   *Apodaca v. Oregon (1972):* Allowed *non-unanimous* verdicts (10-2 or 11-1) in *state* criminal trials (though this was partially overruled by *Ramos v. Louisiana (2020)* for serious offenses, now requiring unanimity in state courts as well).
      *   **Sixth Amendment:** Guarantees the right to a "speedy" trial. Massively increasing jury size directly conflicts with this by making trials significantly slower.
      *   **Due Process:** Extremely large juries could be argued to violate due process by making the trial process unwieldy and potentially unfair to the parties.

  **So, is the legal system "behind on the math"?**

  Not exactly. It's more accurate to say the legal system is **balancing multiple, often competing, values** that CJT doesn't capture:

  *   **Accuracy:** (The CJT focus)
  *   **Fairness & Due Process:** (Protecting rights, ensuring manageability)
  *   **Efficiency & Cost:** (Practical realities of running a justice system)
  *   **Legitimacy & Public Confidence:** (The perceived justice of the process)
  *   **Protection of the Accused:** (Especially in criminal cases - the "Blackstone's Ratio" principle: "It is better that ten guilty persons escape than that one innocent suffer")
  *   **Feasibility:** (Finding jurors, managing trials)

  **Conclusion:**

  While CJT offers an interesting theoretical perspective on group decision-making accuracy, it operates under idealized assumptions that don't hold in complex, adversarial legal proceedings. The 12-person unanimous jury (or variations like 6-person for misdemeanors) represents a practical compromise developed over centuries. It aims for a *sufficiently* reliable verdict while preserving the crucial elements of deliberation, legitimacy, fairness, protection of rights, and practical manageability that would be severely undermined by a 60- or 100-person majority-rule system.

  Your instinct that the system *could* be statistically optimized is mathematically sound in theory, but the costs to fairness, efficiency, deliberation quality, and constitutional rights are simply too high. The legal system prioritizes these other values alongside, and sometimes above, the pure statistical accuracy CJT optimizes for. Good luck with your jury duty – it's a fascinating, if sometimes frustrating, civic experience!
