prompt: |-
  So a few of us on my team got into a whole side-argument last week about why our A/B test results at work never seem to replicate cleanly, and someone linked an article about the replication crisis in psychology, which sent me down a multi-night rabbit hole reading about the history of significance testing. Apparently what basically every intro stats class (and every data science bootcamp, judging by mine) teaches as "the" hypothesis test is actually a kind of frankenstein mashup of Fisher's approach and Neyman-Pearson's approach, even though Fisher and Neyman apparently despised each other so much that Fisher at one point compared Neyman-Pearson-style decision procedures to Soviet central planning in one of his papers. That was a fun tangent on it's own honestly, but it also kind of broke my brain a little, because I always assumed "the p-value test" was just one coherent thing some guy invented, not two incompatible philosophies duct-taped together.

  Anyway, now I'm stuck trying to figure out, of all the different frameworks statisticians and philosophers have proposed for how you're supposed to draw conclusions from noisy data, which ones actually deserve the most "blame" for the mess we're in, and which ones are more like innocent bystanders (or even point toward a fix). I don't have any formal stats or philosophy training, I just write backend services for a living, so I genuinely can't tell if my gut ranking here makes any sense or is totally off base. Could you rank the six approaches below from S-tier ("most responsible for the replication crisis") down to D-tier ("basically blameless, or actually points toward fixing it")? Give a 1-2 sentence justification for each one, and return the whole thing as a JSON block using the short labels I've given each approach, formatted like this:

  ```json
  {
    "S": ["label1"],
    "A": ["label2"],
    "B": [],
    "C": ["label3", "label4"],
    "D": ["label5", "label6"],
    "why": {
      "label1": "one or two sentences",
      "label2": "..."
    }
  }
  ```

  The six approaches:
  - fisherian: Fisherian significance testing — p-value as continuous evidence against the null, no fixed alpha threshold decided in advance
  - neyman_pearson: Neyman–Pearson hypothesis testing — fixed alpha and beta, an explicit alternative hypothesis, long-run error-rate control
  - hybrid_nhst: the hybrid "null hypothesis significance testing" actually taught in textbooks and used in most papers, which mixes the two above without acknowledging it
  - subjective_bayes: subjective/personalist Bayesianism — priors are just an individual's honest degrees of belief (de Finetti/Savage style)
  - objective_bayes: objective/default Bayesianism — Jeffreys-style "uninformative" priors meant to make results more mechanical and comparable across researchers
  - likelihoodism: evidence is just the likelihood ratio between two hypotheses, no priors and no long-run error rates at all (Royall's version)
reasoning: |-
  We are ranking six statistical approaches based on their perceived responsibility for the replication crisis, from S-tier (most responsible) down to D-tier (blameless or pointing toward a fix). The replication crisis is often attributed to practices like p-hacking, publication bias, and misunderstanding of p-values. The hybrid NHST (null hypothesis significance testing) is widely criticized for combining Fisher and Neyman-Pearson in a way that leads to misinterpretations (e.g., treating p-values as error probabilities). 

  Here's a breakdown:

  1. **hybrid_nhst**: This is the Frankenstein approach actually used in most sciences. It mixes Fisher's p-value as evidence with Neyman-Pearson's fixed alpha, without clarifying the differences. This leads to widespread misuse (e.g., "p<0.05 means true effect") and is a major culprit in the replication crisis. Thus, it belongs in S-tier.

  2. **fisherian**: Fisher's approach uses p-values as continuous evidence but without a fixed cutoff. However, in practice, it often gets used with arbitrary thresholds (like 0.05) and encourages p-hacking because it doesn't account for multiple testing or require pre-specified hypotheses. It's a significant part of the problem, so A-tier.

  3. **neyman_pearson**: Neyman-Pearson introduced pre-specified alpha and beta, and explicit alternative hypotheses, focusing on long-run error control. However, in practice, it's often misapplied (e.g., not setting beta in advance, or ignoring power). It's less directly blamed than the hybrid, but its rigid structure can lead to ritualistic behavior. We'll put it in B-tier.

  4. **subjective_bayes**: Subjective Bayesianism requires specifying personal priors, which can be arbitrary and vary between researchers. This subjectivity can lead to non-replicable findings if priors are not shared or are manipulated. However, it's not the main driver of the crisis. We assign it to C-tier.

  5. **objective_bayes**: Objective Bayesianism uses default priors to standardize analysis. It avoids some subjectivity and can make results more comparable. It points toward a fix by encouraging more transparency and less arbitrary decision thresholds. Thus, D-tier (blameless or pointing to a fix).

  6. **likelihoodism**: Likelihoodism (Royall) uses likelihood ratios for evidence without priors or error rates. It avoids some pitfalls of NHST and is less prone to misinterpretation. It's not widely used, so not a major cause, and it points toward a more evidence-focused approach. D-tier.

  Now, we structure the JSON:

  ```json
  {
    "S": ["hybrid_nhst"],
    "A": ["fisherian"],
    "B": ["neyman_pearson"],
    "C": ["subjective_bayes"],
    "D": ["objective_bayes", "likelihoodism"],
    "why": {
      "fisherian": "Its p-value as evidence without fixed thresholds is often misused with arbitrary cutoffs and encourages p-hacking due to lack of error rate control.",
      "neyman_pearson": "Focuses on long-run error control but is often applied rigidly without proper power analysis, leading to ritualistic use and neglect of effect sizes.",
      "hybrid_nhst": "Combines Fisher and Neyman-Pearson without clarity, leading to widespread misinterpretation of p-values and the replication crisis.",
      "subjective_bayes": "Subjective priors can vary arbitrarily between researchers, potentially leading to non-replicable results if priors are not shared or are manipulated.",
      "objective_bayes": "Default priors standardize analyses, making results more comparable and reducing arbitrary decisions, thus pointing toward a fix.",
      "likelihoodism": "Uses likelihood ratios for evidence without thresholds, avoiding common misinterpretations and focusing on evidence strength, thus pointing toward a fix."
    }
  }
  ```

  Note: The ranking is based on the perceived contribution to the replication crisis. The hybrid NHST is considered the top culprit.
