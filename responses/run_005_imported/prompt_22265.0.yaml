  The user's first confusion is about Hume treating the counterfactual ("if A hadn't been, B wouldn't exist") as equivalent to constant conjunction. Historically, Hume didn't have modern counterfactual logic, so he likely saw them as interchangeable through his lens of constant conjunction. But today, we know counterfactuals involve more nuance—like considering possible worlds—which Hume didn't account for. So yes, it's a bit of a fudge, but understandable given his empiricist framework.

  The second issue is more significant. Contemporary Humeans drop the psychological part, focusing solely on regularity. This isn't arbitrary; it's a philosophical move to objectify laws without mental projections. The user wonders if this distorts Hume's actual view, which was deeply psychologistic. They're right—modern Humeanism is a revision, not a direct inheritance. It keeps the spirit of anti-realism about necessary connections but ditches the mind-dependence. 

  The user's deeper concern seems to be about scholarly fidelity: are today's Humeans betraying Hume by sanitizing his theory? They might also be probing how projectivist elements (like custom) fit into modern metaphysics of laws. I should emphasize that while Hume rooted causality in psychology, his successors extracted the structural part to build a non-mental framework. This answers both their explicit questions and implicit worry about interpretation integrity.
answer: |-
  That's a fantastic passage to get stuck on – it cuts right to the heart of Hume's view and its legacy! You're absolutely right to see the tension. Let's untangle your two excellent questions:

  1.  **The "In Other Words" Fudge: Constant Conjunction vs. Counterfactual:**
      *   You're correct: Strictly speaking, constant conjunction (regularity) and counterfactual dependence *are not* logically equivalent in modern philosophical logic. Constant conjunction (A followed by B, always) describes actual patterns. Counterfactual dependence (If not-A, then not-B) ventures into possibilities beyond actual experience.
      *   **Why Hume treats them as equivalent:** For Hume, the counterfactual statement *isn't* a fundamental metaphysical claim about alternative possibilities. It's **entirely derived from and parasitic upon** the observed constant conjunction.
          *   **Empiricist Constraint:** Hume rejects knowledge of necessary connections or powers binding cause and effect. We *only* have experience of succession and regularity.
          *   **The Source of Counterfactual Meaning:** How do we *know* what "would have" happened? For Hume, it's *only* because we've seen countless times that when A is absent (or different), B is also absent (or different). The counterfactual claim **is our inference** *based on* past constant conjunction. It's a *description* of the pattern we've observed, projected hypothetically.
          *   **"In Other Words" as Psychological Equivalence:** Hume isn't primarily making a metaphysical point about possible worlds here. He's describing how we *think* and *speak*. When we say "if A hadn't happened, B wouldn't have," we *mean* something like "based on all past experience of similar A's and B's always being conjoined, we infer that the absence of A would be associated with the absence of B." The counterfactual statement *expresses the expectation generated by the regularity*.
      *   **Is it a Fudge?** From a modern perspective, **yes, somewhat.** Hume collapses the distinction because he lacks our sophisticated tools for analyzing counterfactuals (like possible worlds semantics) and because his strict empiricism forbids him from grounding counterfactuals in anything *other* than observed regularity. He sees the counterfactual statement as *nothing more than* a verbal rephrasing of the constant conjunction pattern plus the psychological expectation it generates. Modern philosophers often argue that counterfactual dependence captures something *more* fundamental or explanatory than mere regularity. Hume explicitly denies this "more."

  2.  **Dropping the Psychological Definition & Contemporary Humeanism:**
      *   **The Principled Move:** Contemporary Humeans (like Lewis and best-system analysts) deliberately and **principledly** drop the second, psychological definition. Here's why:
          *   **Objectivity Goal:** They aim to provide an account of laws of nature and causation that is **objective** and **mind-independent**. They want laws to be features of the world itself (albeit features grounded in patterns), not features of human psychology. Hume's second definition makes causation explicitly dependent on human custom and expectation – something that exists *in us*, not *in the world*.
          *   **Focus on Metaphysics, Not Epistemology/Psychology:** Contemporary Humeans are primarily engaged in *metaphysics*: What *are* laws? What *is* causation? Hume's project in the *Enquiry* is broader: it's also deeply concerned with epistemology (how do we *know* about causes?) and psychology (how does the *mind* form the *idea* of cause?). The second definition addresses the latter. Contemporary Humeans extract the *metaphysical core* they see in the first definition – the idea that causation *is* nothing more than a certain kind of spatio-temporal pattern (constant conjunction) – and build their objective account (like BSA) on that foundation, deliberately leaving the psychology behind.
          *   **Avoiding Projectivism:** The second definition leans heavily towards **projectivism**: we *project* necessity or connection onto the world based on our internal feeling of expectation generated by custom. Contemporary Humeans want to avoid this. While they agree there is no *necessary connection* over and above regularity, they want to say that the regularities themselves (especially the ones picked out as laws by BSA) are *objectively there* and *objectively* govern what happens, independent of whether any mind is there to observe them or form expectations. The "governing" is metaphorical for "being the best systematization of what happens," not a real power.
      *   **Is Hume's Own View More Projectivist/Psychologistic? Absolutely!** This is the crucial point you've grasped. **Contemporary "Humeanism" is a significant revision of Hume's own view.**
          *   Hume's core account of causation is fundamentally **psychologistic and projectivist.** The *idea* of necessary connection, which seems intrinsic to our *concept* of cause, is derived *not* from observing anything in the objects themselves, but from the *feeling* of determination in the mind when the customary transition happens (the "conveyance" in the second definition). The necessity is projected *onto* the events by us. Causation, as we conceive it, involves this psychological component. The constant conjunction is the objective basis *in the world* that triggers the psychological response, but the full *meaning* of "cause" includes that response.
          *   **What Contemporary Humeans Inherit:** What they take from Hume is:
              *   **The Rejection of Necessity:** There is no metaphysically necessary connection between distinct existences governing cause and effect.
              *   **The Foundational Role of Regularity:** Constant conjunction (patterns of succession) is the fundamental, observable basis for all our causal reasoning and talk.
              *   **The Supervenience Thesis:** Facts about causation and laws supervene on the total spatio-temporal arrangement of particular matters of fact (the "Humean mosaic").
          *   **What They Reject:** They explicitly reject the psychologistic/projectivist *analysis* of the *concept* of cause and the *origin* of the idea of necessary connection. They aim to give an account of laws and causation *in the world* using only resources consistent with Hume's basic ontology (particulars and their spatio-temporal relations), but without needing to reference minds or expectations.

  **In Summary:**

  1.  **The Counterfactual "Fudge":** Yes, it's a simplification by modern standards. Hume treats the counterfactual as merely a restatement of constant conjunction *because* for him, the counterfactual has no independent meaning or grounding; it's *only* an inference drawn *from* the observed regularity and the expectation it creates. He collapses them due to his empiricist constraints.
  2.  **Contemporary Humeanism vs. Hume:** You've hit the nail on the head. Contemporary Humeans (BSA types) **do** inherit *only* the first, objective-seeming definition ("constant conjunction") and deliberately **drop** the second, psychological definition ("customary transition"). This **is** a principled move to create an **objective, non-psychologistic, non-projectivist** metaphysics of laws and causation based *only* on patterns in the Humean mosaic. However, **this means contemporary "Humeanism" is significantly different from Hume's own view.** Hume's view *is* fundamentally psychologistic and projectivist regarding the *origin and content* of our *idea* of causation and necessary connection. Contemporary Humeans keep the core metaphysical commitments about the world (no necessary connections, supervenience on particulars) but jettison the psychological account of the *concept*.

  So, your seminar reading is spot on. Contemporary "Humeans" are inspired by Hume's core metaphysical insights about regularity and the rejection of necessity, but they construct a different kind of theory – one that aims for objectivity by leaving Hume's psychology behind. Hume himself would likely see their laws as sophisticated descriptions of the constant conjunctions that *cause* our customary transitions, but he would insist that the *idea* of a law "governing" involves a projection of the necessity we feel in our minds.
