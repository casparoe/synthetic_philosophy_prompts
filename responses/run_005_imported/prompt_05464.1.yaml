prompt: |-
  Every year for the past nine years, the same eight of us have taken a trip together, and choosing the destination has always been a lighthearted formality -- until this past weekend, when the planning meeting turned into a two-hour argument I'm still turning over. We had narrowed things down to four genuinely different options: a beach town, a mountain cabin, a big city, and a lake house. Each of the four has actually won outright in at least one previous year, so nobody was proposing to rule any of them out in advance. Wanting to avoid the crudeness of a simple "whoever gets the most first-choice votes wins" plurality, we asked everyone to privately rank all four from favorite to least favorite and combined the rankings with a simple points system: four points for a first choice, three for a second, and so on down to one. Partway through tallying, it came out that one friend had not ranked sincerely. By everyone's best reconstruction, he had correctly anticipated that his actual favorite would split support with a similar option and lose outright, so he listed his real second choice first instead, and that is exactly what ended up winning.

  Another friend was quite upset about this and has spent the days since insisting, at length, that the fix is obvious: we just need a smarter rule next time. He is now lobbying hard for a ranked-choice, instant-runoff-style count instead of our points system, and he's convinced that some sufficiently well-designed method -- so long as it isn't a literal dictatorship where one person is simply handed the decision every year -- can in principle be made fully immune to this kind of tactical misreporting.

  I'm skeptical, though in the moment I couldn't defend my skepticism beyond a vague hunch: that this isn't really a flaw specific to our points system, but something close to unavoidable whenever there are more than two real options on the table, people's honest preferences are free to be whatever they actually are, and no single person's word is simply decisive. My friend thinks this is needless defeatism and that I just haven't thought of the right rule yet. Since we couldn't settle it ourselves, I'd like a more rigorous verdict: who is closer to being right? Is there some ranking method -- instant-runoff or otherwise, but short of just letting one fixed person decide -- that our group could adopt for future trips and that would genuinely close off this kind of strategic misreporting for good, or is my friend, however reasonably, chasing a fix that cannot exist? If it's the latter, I would like to understand why, and whether there is anything short of a full fix that would at least help.
reasoning: |-
  We are considering the problem of whether there exists a voting system (for ranking four alternatives) that is immune to strategic voting (i.e., no voter can benefit by misrepresenting their preferences) and that is not a dictatorship.

  The friend argues that a ranked-choice instant-runoff system (or some other well-designed method) can be immune to strategic voting. The narrator is skeptical and believes that such strategic voting is nearly unavoidable when there are more than two options.

  To answer this, we recall a fundamental result in social choice theory: the Gibbard–Satterthwaite theorem. This theorem states that for any voting system that has at least three possible outcomes and is not a dictatorship, there will be some situations in which a voter can achieve a better outcome by misrepresenting their preferences (i.e., strategic voting is possible).

  In this scenario:
  - There are four alternatives (beach, mountain, city, lake).
  - The voting system must choose one of these four.
  - The system is required to be non-dictatorial.

  Therefore, by the Gibbard–Satterthwaite theorem, there is no such voting system that is both non-dictatorial and strategy-proof (immune to strategic voting) for all possible preference profiles.

  Thus, the narrator is correct: it is impossible to design a non-dictatorial voting system that completely eliminates the possibility of strategic voting in every situation.

  However, note that the theorem does not say that strategic voting will occur in every situation, only that for any non-dictatorial system, there exists at least one situation in which strategic voting is beneficial for at least one voter. In practice, for a particular group with typical preferences, some systems might be less prone to strategic manipulation than others. But absolute immunity for all possible preference profiles is impossible without a dictatorship.

  So, the friend's hope for a system that is "fully immune" to this kind of tactical misreporting is impossible to achieve.

  What can be done?
  - The group can choose a voting system that is less susceptible to strategic voting in common scenarios. For example, the Borda count (which is what they used: 4 points for first, 3 for second, etc.) is known to be vulnerable to strategic ranking (as happened). Instant-runoff voting (IRV) is also vulnerable to strategic voting in some cases, though the vulnerabilities are different. There is no perfect system.
  - Another approach is to use a system that is strategy-proof in a restricted domain of preferences. For example, if the group's preferences are always single-peaked (which might be the case if the destinations can be arranged on a left-right spectrum and each person has a most preferred point and dislikes options as they get farther away), then there are non-dictatorial systems that become strategy-proof. However, without knowing the structure of the group's preferences, we cannot assume this.
  - The group might also consider accepting that strategic voting is a possibility and try to mitigate it by:
     a) Encouraging honesty and making it a norm.
     b) Using a system that is complex enough that it is hard to manipulate (though this is not a guarantee).
     c) Using a random method (like a lottery) which is strategy-proof but not deterministic.

  Alternatively, they might consider a system that is not based on rankings but on other mechanisms, such as the Vickrey auction for public goods, but that might be impractical for this setting.

  Conclusion:
  The narrator is closer to being right: there is no non-dictatorial voting system that is immune to strategic voting for all possible preference profiles. The friend's desired fix (a non-dictatorial method that is immune to tactical misreporting) does not exist.

  However, the group might choose a system that is less vulnerable in practice or that makes strategic voting harder to execute. For example, instant-runoff voting (IRV) might be less manipulable in some situations than Borda count, but it is not immune. Also, note that in IRV, a voter might be tempted to misrepresent their rankings by not ranking a candidate they actually prefer but think is weak (to avoid wasting a vote) or by ranking a stronger candidate higher than their true favorite to prevent a less preferred candidate from winning.

  Therefore, the group should be aware that no system is perfect. They might stick with the Borda count and accept that sometimes strategic voting might occur, or switch to IRV and hope that in their typical preference profiles, strategic voting is less of an issue. Alternatively, they might rotate the decision-maker each year (which is a form of rotating dictatorship) to be fair, but that would be a dictatorship in each year.

  A less extreme option is to use a random dictator: each year, one person is chosen at random to be the dictator. This is strategy-proof because the chosen dictator has no incentive to lie (they get their top choice) and the others cannot influence the outcome. But note that it is not a fixed dictatorship. This might be acceptable if the group is willing to have a random dictator each year.

  Alternatively, they might use a scoring rule that is known to have better strategy-proofness properties in some contexts, but again, the Gibbard-Satterthwaite theorem tells us that we cannot have full strategy-proofness without a dictatorship.

  In summary:
  - The narrator is correct that a full fix (non-dictatorial and strategy-proof) is impossible.
  - The friend is chasing a fix that cannot exist in the form he desires (a non-dictatorial system that is immune to strategic voting in all cases).

  Recommendation:
  The group should be made aware of the impossibility result. They might then choose a system that they find fair and that they believe minimizes the incentives for strategic voting in their typical setting. They could also consider the random dictator method if they are comfortable with it.

  If they want to stick with a ranking system, they might try instant-runoff voting and see if it feels better. But they should be aware that strategic voting might still occur.

  Alternatively, they might try to design the voting system to be less transparent (so that it is harder for voters to figure out how to manipulate) but that is not a principled solution.

  Another idea: use a system that is based on approval voting (each voter approves as many as they like, and the option with the most approvals wins) or range voting. These systems are not strategy-proof either, but they are simpler and might be less prone to certain kinds of manipulation.

  However, the fundamental problem remains: no non-dictatorial system is immune to strategic voting in all cases.
answer: |-
  Based on the details of your situation and the fundamental principles of social choice theory, your skepticism is well-founded: **there is no non-dictatorial ranking method that can fully eliminate the possibility of strategic misreporting for all possible preference configurations.** Your friend's belief in a "fully immune" system is mathematically impossible, not due to a lack of creativity, but because of a deep result known as the **Gibbard-Satterthwaite theorem**. Here's a rigorous breakdown:

  ### 1. **The Gibbard–Satterthwaite Theorem: Why a "Full Fix" is Impossible**
     - **What it states**: For any voting system with three or more alternatives (like your four destinations), if the system is:
       - **Non-dictatorial** (no single person always decides the outcome),
       - **Deterministic** (produces a single winner, not a tie or lottery),
       - **Satisfies universal domain** (allows any possible ranking of preferences by voters), and
       - **Is Pareto efficient** (if everyone prefers A over B, B cannot win),
       then it is **impossible** for the system to be **strategy-proof** (immune to tactical voting) in all cases.
     - **Why it applies here**: Your group has four distinct options, and you require a non-dictatorial method. Any system you adopt (points-based, instant-runoff, etc.) must allow voters to express any preference order. Thus, by this theorem, **no such system can guarantee that voters will never benefit from misrepresenting their rankings**. Strategic voting is not a flaw specific to your points system—it's inherent to the problem.

  ### 2. **Why Instant-Runoff (Ranked Choice) Doesn't Solve the Problem**
     - Instant-runoff voting (IRV) eliminates the candidate with the fewest first-choice votes in rounds, redistributing votes until one option has a majority. While it avoids some issues with plurality voting, it is **not immune to strategy**:
       - **Examples of IRV manipulation**: Voters can "bury" a strong candidate they dislike by ranking them last, or "compromise" by ranking a less-preferred but viable candidate higher to prevent a worse outcome. In your case, if a voter suspects their true favorite (e.g., "mountain cabin") might be eliminated early, they might falsely rank "lake house" first (as your friend did) to ensure it survives later rounds.
       - **Empirical evidence**: Real-world elections using IRV (e.g., Australia, Ireland) still see strategic voting. Academic studies confirm that **no Condorcet method** (which IRV isn't) or **ranked system** escapes the Gibbard-Satterthwaite constraint.

  ### 3. **Why Your Points System (Borda Count) is Also Vulnerable**
     - Your system is a simplified **Borda count**, which sums points from rankings. It encourages broad compromise but is **highly manipulable**:
       - As your friend demonstrated, voters can "push" a second choice to victory by ranking it first if they fear their true favorite lacks support. This is a well-known tactic called **compromising**.
       - Borda is also vulnerable to "burying" (ranking a strong rival last) or "truncating" (not ranking all options).

  ### 4. **What You Can Do: Mitigating (Not Eliminating) the Problem**
     While no system is fully strategy-proof, some approaches reduce incentives for manipulation or make it harder to execute:
     - **Approval Voting**: Have everyone approve *all* options they find acceptable. The option with the most approvals wins. This simplifies choices, reduces ranking complexity, and makes it harder to harm a preferred option by ranking it "too high." However, voters can still strategically withhold approval from a viable candidate they slightly dislike to help their favorite.
     - **Condorcet Methods**: These elect an option that beats all others in head-to-head matchups. They handle vote-splitting better but are complex to tally and still vulnerable to strategy (e.g., "cloning" similar options to split votes).
     - **Randomized Dictatorship**: Randomly select one voter's top choice. This is strategy-proof (no incentive to lie) and non-dictatorial in the long run, but may feel unsatisfying if fairness is prioritized over consensus.
     - **Normative Solutions**: 
       - **Discussion before voting**: Require an open discussion of preferences before rankings. This may reveal genuine compromises and reduce the need for strategy.
       - **Rotate the "decider"**: Each year, randomly pick one person to choose from the top two options after a preliminary vote. This limits the harm of strategy but isn't fully democratic.
       - **Accept Imperfection**: Acknowledge that no system is perfect. If your group values simplicity, stick with Borda or try IRV—but know that strategic risks remain.

  ### 5. **Practical Recommendation for Your Group**
     - **Short term**: Switch to **approval voting** for simplicity and lower susceptibility to manipulation. It’s easy to understand ("check all destinations you’d enjoy") and harder to game than ranking systems.
     - **Long term**: Combine **approval voting** with a **pre-vote discussion** to surface honest preferences. If strategic voting persists, consider a **randomized dictatorship** (fair over many years) or **rotation** of the final choice among subsets of members.
     - **Avoid**: Complex systems like IRV or Condorcet—they may fuel more arguments without solving the core issue.

  ### Conclusion
  **You are closer to being right**: Strategic misreporting is theoretically unavoidable in any non-dictatorial system with three or more options, as proven by the Gibbard-Satterthwaite theorem. Your friend’s pursuit of a "fully immune" method is understandable but mathematically futile. Instead, focus on **mitigation**—adopt a less manipulable system like approval voting, foster transparency, and accept that no voting rule will perfectly align incentives in all scenarios. By acknowledging this, your group can reduce conflict and enjoy the trip-planning process again. If you need help implementing a specific method, I can provide step-by-step instructions!
