answer: |-
  You were absolutely right to push back against your friend's interpretation. Your instinct about the centrality of the **intention/foresight distinction** (the core of the **Doctrine of Double Effect - DDE**) is key to understanding Anscombe's argument in "Mr. Truman's Degree." **Recalculating casualty figures in favor of Truman would do *nothing* to undermine her core objection, precisely because her argument is *not* fundamentally consequentialist.**

  Here's a breakdown of Anscombe's argument and why casualty figures are largely irrelevant to it:

  1.  **The Core Sin: Direct Intention to Kill the Innocent:**
      *   Anscombe's fundamental objection is that Truman authorized the *direct, intentional killing of innocent civilians* (non-combatants) as a *means* to achieve the end of ending the war.
      *   For Anscombe, drawing on traditional Catholic moral theology and natural law, intentionally killing the innocent is *always* and *absolutely* morally prohibited. It is murder. This prohibition holds regardless of the consequences or the nobility of the end being pursued.
      *   The atomic bombs were dropped *on cities*, targeting the civilian population centers themselves. The *point* of bombing Hiroshima and Nagasaki was to inflict such catastrophic devastation and loss of civilian life that the Japanese government would be compelled to surrender. The mass killing of innocents *was the chosen instrument* to achieve the goal.

  2.  **The Doctrine of Double Effect (DDE) is Crucial:**
      *   Anscombe explicitly relies on DDE. This principle allows that an action with both good and bad effects might be permissible *only if*:
          *   The action itself is good or neutral.
          *   The *intention* is only the good effect; the bad effect is *not intended* as an end or a means.
          *   The good effect is not produced *by means of* the bad effect.
          *   There is a proportionately grave reason for permitting the bad effect.
      *   **Anscombe argues Truman's action fails DDE catastrophically on the second and third points:** The massive death of civilians *was intended* as the *means* to shock Japan into surrender. The good effect (ending the war) was sought *precisely through* the bad effect (mass killing of innocents).

  3.  **Why Casualty Figures Don't Matter to Her Core Argument:**
      *   **Intentional Murder vs. Foreseen Death:** Anscombe distinguishes between *intentionally* killing innocents (which is always wrong) and performing a legitimate act of war where the *foreseen but unintended* death of some innocents occurs (e.g., bombing a munitions factory knowing nearby civilians might die). The atomic bombings, in her view, fell squarely into the first category. **No number of lives saved by avoiding an invasion can morally justify an act she defines as mass murder.** Shifting the body count might change the *consequences*, but it doesn't change the *intrinsic nature* of the act Truman chose.
      *   **Proportionality is Secondary (and Insufficient):** While DDE *does* include a proportionality condition (the good must outweigh the *foreseen* bad), this condition only applies *after* the other conditions (especially the intention condition) are met. **Anscombe argues Truman's action fails the *prior* condition of intention.** Therefore, even if the bombings *were* proportional (saving more lives than an invasion), the act would *still* be intrinsically evil because it involved directly intending the death of innocents as a means. Proportionality can't rescue an intrinsically immoral act.
      *   **The Nature of the Alternative:** While she likely believed an invasion would be horrific, her argument doesn't *depend* on it being worse or better. Her point is that **choosing mass murder as the *means* to avoid *any* other bad consequence is never morally permissible.** Even if the only alternative were the total annihilation of the US population (an absurd hypothetical), intentionally killing millions of innocent Japanese civilians *as the chosen method* would still be murder and thus forbidden.

  4.  **What *Would* Undermine Her Argument (and Why it Doesn't Happen):**
      *   The *only* thing that could undermine Anscombe's argument would be evidence that the *intention* was *not* to kill civilians as the means to force surrender. For example:
          *   If the bombs were dropped solely on purely military targets with *no* civilians present (obviously not the case).
          *   Or, if the civilian deaths were genuinely an *unintended, unforeseen, and unavoidable* side-effect of a strike aimed *only* at a legitimate military target (e.g., a hidden command bunker directly under a city, with no other way to destroy it – also not the case with Hiroshima/Nagasaki).
      *   **Historical evidence overwhelmingly supports Anscombe's characterization of the *intention*.** Target selection (cities), the nature of the weapon (area-destruction), and the explicit statements of leaders at the time confirm that causing massive civilian casualties to break Japanese morale and will to fight *was the direct objective*.

  **Conclusion:**

  *   **Your Friend's Mistake:** They reduce Anscombe's argument to consequentialism ("too many bodies"). This fundamentally misreads her.
  *   **Anscombe's Actual Argument:** It's a **deontological** argument centered on the **absolute prohibition against intentionally killing the innocent**. Truman's decision involved precisely that: choosing mass murder as a means to an end. The atomic bombings were, in her view, acts of mass murder, making Truman a mass murderer unworthy of an honorary degree.
  *   **Impact of Recalculated Casualties:** **Zero.** Even if historians conclusively proved that the bombings saved 10 million more lives than an invasion would have cost, Anscombe would maintain that **saving lives does not justify committing mass murder.** The nature of the act Truman *chose* – intentionally killing innocents as a means – remains morally indefensible on her terms, regardless of the consequences. Her outrage is rooted in the *kind* of act it was, not (primarily) in the number of victims, though the scale certainly intensified the horror.

  You were correct to sense that the intention/foresight distinction was central. Anscombe's argument stands or falls on whether Truman *intended* the civilian deaths as a means. Historical evidence strongly supports her on that point, and recalculating the numbers of the dead on either side doesn't touch the core moral principle she invoked.
