prompt: |-
  So I got into it with my friend Dev last night over beers about whether AI safety via debate actually works as a scalable oversight scheme once the debaters get way smarter than the judge. His take was basically: if you force two AI's to argue opposite sides of a claim in front of a judge who only has to spot-check individual steps instead of verifying the whole argument, honesty wins out in the limit, since a liar has to keep it's story consistent under cross-examination and eventually gets caught out. I pushed back with this half-remembered thing called the "obfuscated arguments" problem - roughly, that a dishonest debater can bury the real flaw in an argument somewhere that's totally genuine but really expensive to locate, and can keep shuffling around where "the flaw" supposedly is whenever it's challenged, so the honest debater never actually gets to force a clean confrontation over one specific, checkable step within however many rounds the judge has patience for. Dev's comeback was just "so give them more rounds then" and I didn't have a great response in the moment.

  Can you help me settle this properly? I don't want just a restatement of the abstract worry, I want an actual concrete toy example: pick a specific claim that's being debated, sketch roughly what the dishonest debater's argument looks like (including where the real flaw lives and why it's costly to pin down exactly), then walk through, step by step, why the honest debater's best cross-examination strategy still can't force the judge down to one short, checkable disagreement in a small fixed number of rounds - and specifically why "just add more rounds" doesn't actually rescue the judge here. And if on reflection you think Dev's basically right and this isn't really a problem once the debate protocol is set up carefully, that's a fine answer too - just show it against the example rather than just asserting it.
