  ## The Unforgivable Intent: Why Anscombe's Indictment of Hiroshima and Nagasaki Stands Firm

  Elizabeth Anscombe’s protest against awarding Harry Truman an honorary degree, articulated in her pamphlet "Mr. Truman’s Degree," cuts through the fog of utilitarian calculations surrounding the atomic bombings of Hiroshima and Nagasaki. Her argument is not primarily about the horrific *number* of civilian deaths, though they are appalling, but about the *intention* behind the act. Anscombe contends that Truman committed murder by deliberately targeting non-combatant populations as a *means* to coerce Japan’s surrender. This intention-based critique demands a rigorous engagement, separate from consequentialist defenses, and compels a verdict that, while uncomfortable, upholds a fundamental moral principle: intentionally killing the innocent as a means to an end is intrinsically evil, regardless of projected outcomes.

  **Anscombe's Core Argument: The Primacy of Intention and the Prohibition of Murder**

  Anscombe, rooted in the Aristotelian-Thomistic tradition of virtue ethics and natural law, argues that morality hinges critically on the *intention* of the agent. Certain acts are intrinsically wrong due to the object of the will – what the agent deliberately chooses to do. Deliberately killing an innocent person falls squarely into this category; it is murder, forbidden absolutely. Hiroshima and Nagasaki, Anscombe insists, were not tragic accidents or collateral damage within a legitimate military strike against combatants or war-sustaining infrastructure. They were meticulously planned attacks *on cities*, chosen specifically *because* they contained dense civilian populations. The bombs were dropped to unleash catastrophic destruction upon non-combatants – men, women, and children – with the explicit *intention* of terrorizing the Japanese government and populace into surrender. Civilians were not merely foreseeable casualties; they were the *instrument* chosen to achieve the war's end. Truman, by authorizing this act, willed the killing of innocents as a means to his end. For Anscombe, this constitutes murder, plain and simple, and no calculation of lives potentially saved can morally justify it. To honor such an act, she argues, is to endorse the principle that mass murder is permissible under extreme duress, eroding the bedrock prohibition against targeting the innocent.

  **Consequentialist Defenses: The Calculus of Necessity**

  The standard defense of the bombings is quintessentially consequentialist: the horrific act was justified by the even greater horrors it averted. Proponents argue that:
  1.  **An Invasion Would Have Been Worse:** A full-scale invasion of the Japanese mainland (Operation Downfall) was projected to cost hundreds of thousands, possibly millions, of American lives and even more Japanese lives (military and civilian). The bombs, it is claimed, swiftly ended the war, saving more lives overall.
  2.  **The War Was Protracted and Brutal:** After years of horrific warfare in the Pacific, characterized by fierce Japanese resistance (e.g., Okinawa) and atrocities, the bombs were seen as a necessary, decisive blow to break Japan's will and prevent further prolonged suffering.
  3.  **No Real Alternative Existed:** Proponents contend that Japan showed no serious sign of surrendering unconditionally before the bombs, despite the devastation of conventional bombing and the Soviet declaration of war. The Potsdam Declaration's terms were clear, and the bombs were the final, necessary pressure.
  4.  **The "Lesser Evil" Justification:** Within this framework, the deaths at Hiroshima and Nagasaki, while tragic, represent the "lesser evil" compared to the catastrophic human cost of the alternative scenario (invasion or prolonged blockade and bombing).

  **Collision: Intention vs. Consequence**

  The clash is fundamental. Consequentialism argues that the *outcome* (ending the war swiftly, saving net lives) justifies the *action* (dropping the bombs). Anscombe argues that the *intention* inherent in the action (deliberately killing innocents as a means) makes it morally impermissible *regardless* of the outcome. Consequentialists might counter that intentions are secondary; what matters is the net saving of lives. They might also argue that the intention was *not* to kill civilians *per se*, but to force surrender – the civilian deaths were a foreseen but unintended side-effect, or *necessary* means to the greater good.

  Anscombe, however, would dismantle this. The targeting of the cities themselves demonstrates that mass civilian death was not a regrettable side-effect; it was the *chosen mechanism*. If the bombs had been dropped on purely military targets with minimal civilian casualties but failed to induce surrender, proponents would deem them ineffective. Their *efficacy* depended precisely on the scale of civilian destruction and terror. Therefore, the civilian deaths were not merely foreseen; they were *intended* as the means to achieve the end. This, for Anscombe, crosses the moral Rubicon.

  **Verdict: Upholding the Intrinsic Evil**

  While the consequentialist arguments possess a grim, pragmatic logic born of the war's desperate context, Anscombe's intention-based critique compels a more fundamental moral verdict: **Truman's authorization of the atomic bombings was morally unjustifiable.**

  The reasons are clear:
  1.  **The Act Itself Was Murderous:** The deliberate choice to unleash unprecedented destructive force upon entire civilian populations, intending their suffering and death as the primary mechanism to coerce surrender, constitutes mass murder under any coherent definition. The scale and technology are novel; the moral category is ancient.
  2.  **Consequences Cannot Sanctify an Intrinsically Evil Means:** Granting that consequentialist calculations *might* be accurate (and historical debate on projected invasion casualties continues), they remain irrelevant to the core moral wrong identified by Anscombe. We cannot endorse the principle that intentionally killing innocents becomes permissible if the projected alternative body count is high enough. This creates a dangerous moral precedent where "necessity" justifies atrocity. The prohibition against targeting non-combatants is a foundational constraint on warfare precisely to prevent such utilitarian slide into barbarity.
  3.  **The Slippery Slope of Instrumentalization:** Accepting the bombings legitimizes the terrifying principle that civilians can be instrumentally used – turned into mere tools – for strategic or political ends. This erodes the crucial distinction between combatant and non-combatant, making total war and the targeting of populations the grim norm whenever a "sufficiently great good" is invoked. The horrors of 20th-century warfare demonstrate the catastrophic results of abandoning this principle.
  4.  **The Question of Alternatives:** While the historical record is complex, the argument that *no* alternative existed (e.g., a demonstration, awaiting Soviet entry's full impact, clarifying surrender terms regarding the Emperor) deserves more weight in the moral calculus than consequentialists allow. The rush to use the bomb, driven by complex motives beyond pure casualty aversion, suggests a willingness to employ the new weapon that prioritized its strategic impact over exhausting non-atrocity options.

  **Conclusion: The Unyielding Line**

  Elizabeth Anscombe forced a confrontation with the uncomfortable, absolute core of morality: some acts are wrong in themselves. The atomic bombings of Hiroshima and Nagasaki were not merely tragic necessities weighed on a utilitarian scale; they were acts that intentionally harnessed the mass murder of civilians as a weapon of policy. Truman chose this path. While the desire to end a brutal war is understandable, and the projected costs of alternatives were horrifying, Anscombe is correct: choosing mass murder as the *means* to achieve even a good end is morally catastrophic. It violates the inherent dignity of the innocent and undermines the very constraints that prevent warfare from descending into limitless savagery. Therefore, **Anscombe's verdict stands: the act was murder, and no degree of projected benefit can cleanse it of that intrinsic moral stain.** To argue otherwise is to concede that morality bends before the altar of perceived necessity, a concession that ultimately devours the principles it seeks to protect.
