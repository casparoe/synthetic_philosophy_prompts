  5: 2 (Renata correctly notes that the aggregate is confounded and that self-selection is a caution for subgroup generalization but not a reason to use the aggregate.)

  Now, what are they overlooking?

  - The committee is deciding whether to expand online sections. This might change the composition of students in online sections. Currently, online sections are dominated by part-time students. If they expand online, more full-time students might take online (if they are allowed) and the overall pass rate for online might improve.

  - The data does not tell us about the counterfactual: what would the pass rate be for a student if they took the other format? This is the fundamental problem of causal inference. The current data only shows associations.

  - They might consider running an experiment: randomly assign students to formats and then measure pass rates. But that might not be feasible.

  - They should also consider other factors: student satisfaction, cost, scalability, etc. The decision isn't solely about pass rates.

  - The effect size: even though online is better in both subgroups, the difference is small (3-3.3 percentage points). Is that practically significant? For full-time, it's 90% vs 93.3% (a 3.3% relative improvement) and for part-time, 60% vs 63% (a 5% relative improvement). But note that the absolute improvement is small (3 percentage points in both cases).

  - The current online format might be working well for the self-selected group, but if expanded, the quality might drop (if resources are stretched).

  - The data shows that the online format is particularly beneficial for part-time students (though only by 3 percentage points) and that the current in-person format is not serving part-time students well (only 60% pass). But note that the online part-time group is large (270) and the pass rate is 63%, which is still low. Maybe they should investigate why part-time students struggle in both formats and consider interventions.

  - The committee might also consider demand: if they expand online, will more students enroll? The current online part-time section is at capacity (270) while the in-person part-time is underenrolled (30). So there might be unmet demand for online among part-timers.

  In summary, both are making valid points, but the decision should take into account the potential for changing the mix of students and the possibility that the current online success is due to self-selection. The committee might want to proceed cautiously, perhaps by expanding online sections but also monitoring the pass rates closely.

