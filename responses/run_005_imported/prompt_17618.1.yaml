  We are given enrollment and pass data for two formats (in-person and online) and two enrollment statuses (full-time and part-time). The data:

  In-person seminar:
    Full-time: 270 enrolled, 243 passed -> pass rate = 243/270 = 0.90 (90%)
    Part-time: 30 enrolled, 18 passed -> pass rate = 18/30 = 0.60 (60%)

  Online asynchronous:
    Full-time: 30 enrolled, 28 passed -> pass rate = 28/30 ≈ 0.933 (93.3%)
    Part-time: 270 enrolled, 170 passed -> pass rate = 170/270 ≈ 0.630 (63.0%)

  Aggregate pass rates:
    In-person: total enrolled = 270+30 = 300, total passed = 243+18 = 261 -> pass rate = 261/300 = 0.87 (87%)
    Online: total enrolled = 30+270 = 300, total passed = 28+170 = 198 -> pass rate = 198/300 = 0.66 (66%)

  Now, let's break down the arguments:

  (1) Renata: 
    She points out that among full-time students, online has a higher pass rate (93.3% vs 90%) and among part-time students, online also has a higher pass rate (63.0% vs 60%). Therefore, she concludes that online is better for both subgroups.

    This is factually correct from the given data. The issue is whether this is the right way to analyze the data for the decision of expanding online sections.

    However, note that the difference in part-time is very small (3 percentage points) and the full-time difference is also small (3.3 percentage points). But the data does show online is better in both subgroups.

    But we must consider the possibility of confounding. Renata argues that enrollment status is a confound because it affects both the format chosen and the outcome (passing). She says enrollment status is fixed before choosing format, so it's a genuine confound.

    Score: 2 (clearly right) on the factual observation of the subgroup pass rates. However, the conclusion that "online is better for everybody" might be an overstatement because of potential unmeasured confounders (as Owen will argue). But based on the data we have, she is correct.

  (2) Owen:
    He is wary of slicing the data until a subgroup flips the headline number. He points out that if we consider enrollment status, why not age or major? He argues that what matters is the aggregate pass rate, which drops from 87% to 66% if we move to online.

    However, the aggregate pass rate is confounded by the distribution of enrollment status. The in-person format has mostly full-time students (who have a high pass rate regardless) and the online format has mostly part-time students (who have a lower pass rate). Therefore, the aggregate comparison is misleading.

    Owen's point about being cautious about slicing is valid, but in this case, enrollment status is a pre-existing characteristic that is known to be relevant. Moreover, the committee is considering expanding online sections, and if they do, the composition of students taking online might change.

    Score: -1 (somewhat mistaken) because he dismisses the subgroup analysis too quickly and relies on the aggregate which is confounded. But he has a point that the aggregate is what they observe and that expanding online might change the composition? However, his argument about the aggregate being the thing we care about is flawed because the current aggregate for online is driven by the fact that currently online is mostly taken by part-timers. If they expand online and more full-timers take it, then the aggregate might change.

  (3) Renata:
    She argues that enrollment status is a pre-existing fact (a common cause) and not an ad hoc slice. She distinguishes between conditioning on a common cause and data dredging.

    This is a valid point. In causal inference, we condition on confounders to get a better estimate of the causal effect. Enrollment status is a confounder because it affects both the choice of format and the outcome.

    Score: 2 (clearly right) in the context of trying to get an unconfounded comparison.

  (4) Owen:
    He grants that enrollment status is a confounder but then argues that even within the subgroups, there might be self-selection. For part-timers, those who choose online might be the more organized ones. If we force all part-timers to take online, the pass rate might drop below the current 63%.

    This is a valid concern. The current online part-time pass rate is for those who chose online. If we make online mandatory for part-timers, we might get a different group (including those who would have chosen in-person but now cannot) and their pass rate might be lower.

    Similarly, the full-time online group is very small (only 30) and might be a select group. If we expand online and more full-timers take it, the pass rate might not remain at 93.3%.

    Therefore, the subgroup comparisons (conditioning on enrollment status) might still be confounded by unmeasured factors (like motivation, organization, etc.) that are associated with the choice of format.

    Score: 2 (clearly right) about the potential for unmeasured confounding even within subgroups.

  (5) Renata:
    She agrees that this self-selection is a reason for caution about generalizing the subgroup numbers (i.e., the pass rates we see for online in part-timers might not hold if we force everyone). But she argues that it is not a reason to prefer the aggregate, which is confounded in the same direction (i.e., the aggregate also suffers from confounding because the in-person group is mostly full-time and the online group is mostly part-time).

    She is correct that the aggregate is confounded. And she is correct that the subgroup analysis (conditioning on enrollment status) is an improvement over the aggregate. However, the subgroup analysis might still be biased due to self-selection. But it is still better than the aggregate.

    She says: "It isn't a reason to prefer the aggregate, which we already agree is confounded — and confounded in the same direction." This is right: the aggregate is confounded and the direction of confounding (in-person having more full-time) makes in-person look better than it would be if the formats had the same mix. But the same is true for the subgroup analysis? Actually, the subgroup analysis tries to remove that confounding by comparing within groups.

    However, the issue of self-selection within subgroups is a different kind of confounding that the subgroup analysis does not remove. But it does not make the aggregate any more valid.

    Score: 2 (clearly right) that the aggregate is not preferable.

