prompt: |-
  I've covered science and ideas for a regional daily for the better part of a decade, and I sit on our newsroom's standards committee, which meets next Tuesday to resolve a dispute that has been simmering since a correction we ran in the spring. A reporter's lede had flatly stated that a brief classroom writing exercise "closes nearly a third of the achievement gap between low- and high-income students," based on a single small randomized trial; a larger, multi-site follow-up has since found no detectable effect, and readers who had shared the original piece on social media were unhappy that we had reported an early, contested result as settled fact rather than as a hedged, attributed claim. The committee has since split into three camps over what should license a flat, unhedged assertion in our copy generally, as opposed to phrasing like "a new study suggests" or "according to researchers." One camp wants reporters held to whether the claim is actually true, period, regardless of what we could have known at the time. A second wants the bar to be that the reporter and the paper genuinely knew the claim when we published it — a bar the writing-exercise story clearly didn't clear. A third thinks both bars would silence most science and policy reporting and wants to license flat assertion whenever it was reasonable to believe the claim on the evidence available at deadline, even if that later turns out to be wrong.

  Could you draft the memo I'll circulate before the meeting? Recommend one standard, or an explicit hybrid, as our house rule, and show your work rather than just declaring a preference: apply it back to the writing-exercise story, then stress-test it against two cases the committee keeps getting stuck on. First, a single-site finding with a p-value of 0.03 that hasn't yet been retested anywhere else — is "statistically significant" close enough to "known," given how often single, barely-significant studies fail to replicate? Second, an investigative piece built on three separate sources inside an agency who, it later emerged, were all relaying the same unconfirmed internal rumor rather than verifying it independently — were we blameless in asserting it as fact even though it turned out false, and does the rule you're proposing actually agree? Please give the two camps you don't side with their strongest possible case before you set them aside, and close with the actual sentence you would add to the style guide.
reasoning: |-
  Okay, the user is a science journalist and committee member dealing with a standards dispute about when reporters can make unhedged factual claims. This is a nuanced ethics-in-journalism question with three competing approaches. 

  First, I need to unpack those three camps: Truth absolutists (only state what's eternally true), knowledge purists (only state what we genuinely knew), and reasonableness defenders (state what was reasonably believable at deadline). Each has merits - the truth camp protects credibility long-term, the knowledge camp prevents overreach, the reasonableness camp acknowledges journalism's time-sensitive nature. 

  The classroom writing exercise case is perfect for testing these. That early, small study clearly didn't warrant a flat assertion - it was preliminary. The multi-site failure proved that. So truth absolutists and knowledge purists would both reject the original phrasing, but for different reasons. The reasonableness camp might defend it if the initial evidence seemed solid at the time.

  Now for the stress tests: 
  That p=0.03 single-study case - statistically significant but unreplicated. "Statistically significant" absolutely isn't "known" in science. Replication crisis 101. So knowledge purists would demand hedging. Truth absolutists would too unless it replicates later. Reasonableness defenders might allow flat assertion if it's the best available evidence.

  The rumor case is trickier. Three sources corroborating feels solid until you realize it's echo-chamber reporting. Knowledge purists would crucify this - we never actually knew it. Truth absolutists would reject the false claim. But reasonableness defenders? They'd argue it met journalistic standards for verification at the time.

  I'm leaning toward a hybrid: Default to attribution unless a claim meets both "reasonably credible at deadline" AND "core to public understanding" tests. For the writing exercise, it fails both - preliminary science shouldn't be presented as settled. For the p=0.03 study, attribute. For the rumor, even if reasonable at the time, unconfirmed leaks aren't "core knowledge" - attribute.

  The style guide addition should enforce: "Attribute claims to sources except when evidence is overwhelming and attribution would mislead." Overwhelming means multiple independent confirmations or scientific consensus. 

  This threads the needle - keeps science reporting honest while allowing flat assertions for truly settled facts (like "smoking causes cancer"). Protects against both hype and cowardly hedging.
answer: |-
  Here’s a draft memo for your standards committee, designed to address the core dispute while stress-testing the proposed standard against key cases. The recommendation balances rigor with journalistic practicality, favoring the "reasonable belief at deadline" camp while incorporating safeguards.

  ---

  **MEMORANDUM**  
  **TO**: Standards Committee  
  **FROM**: [Your Name]  
  **SUBJECT**: Proposed Standard for Unhedged Assertions in Reporting  
  **DATE**: [Current Date]  

  ### Background
  This memo addresses our dispute over when reporters may state claims as flat, unhedged facts (e.g., "X causes Y") versus using attributional phrasing ("a study suggests X"). The classroom writing exercise correction—where an initial small trial’s dramatic claim ("closes nearly a third of the achievement gap") was overturned by a multi-site follow-up—exposed three perspectives:  
  1. **Truth Absolutists**: Assert only what is *eternally true*, regardless of publish-time knowledge.  
  2. **Knowledge Purists**: Assert only what we *genuinely knew* at publication (verified beyond doubt).  
  3. **Reasonableness Defenders**: Assert what was *reasonably believable* given evidence at deadline, even if later disproven.  

  Below, I argue for a modified **Reasonableness Standard** as our house rule, stress-test it against key cases, and propose explicit language for our style guide.  

  ---

  ### The Case for a Modified Reasonableness Standard  
  **Recommendation**: Reporters may use flat assertions **only when**:  
  > *"(a) Available evidence at deadline makes the claim reasonably credible to experts in the field;  
  > (b) The claim is presented as part of an established body of evidence (e.g., replicated studies, multiple independent sources), not a single, novel finding; and  
  > (c) Omitting attribution would not materially mislead readers on the claim’s provenance or certainty."*  

  **Why this hybrid?**  
  - **Truth Absolutism** is unworkable: It paralyzes reporting on emerging science/policy, where provisional findings drive public discourse. *Strongest case*: Prevents reputational harm from false claims and upholds accuracy as journalism’s North Star.  
  - **Knowledge Purism** is unrealistic: It demands near-certainty, ignoring that journalists *must* report timely, evidence-based claims that fall short of "proof." *Strongest case*: Forces rigor, ensuring we never present contested claims as settled (as in the writing-exercise story).  
  - **Modified Reasonableness** balances public interest and intellectual humility: It allows clear communication when evidence is robust at deadline but mandates hedging for novel/isolated findings.  

  **Application to the writing-exercise story**:  
  - The original claim ("closes nearly a third of the gap") **fails** this standard:  
    - (a) A *single small trial* is inherently insufficient for "reasonable credibility" in social science (replication is essential).  
    - (b) No established body of evidence existed; it was a novel finding.  
    - (c) Omitting attribution misled readers by masking its preliminary nature.  
  → **Required phrasing**: "A small 2022 study *claimed* the exercise closed nearly a third..."  

  ---

  ### Stress-Testing the Standard  
  **Case 1: Single-site study with p=0.03 (unreplicated)**  
  - **Flat assertion?** No. "Statistically significant" ≠ "known" or "established."  
    - *(a)* A single, barely significant finding is *not* reasonably credible to experts (replication crisis proves this).  
    - *(b)* No corroborating evidence exists.  
    - *(c)* Calling it "fact" masks its fragility.  
  → **Phrasing**: "A preliminary study *suggests* X, though independent replication is needed."  

  **Case 2: Investigative piece based on three sources sharing one unconfirmed rumor**  
  - **Flat assertion?** No.  
    - *(a)* Corroboration requires *independent* verification. Three sources echoing one rumor fail this.  
    - *(b)* No documentary/empirical evidence supported the claim.  
    - *(c)* Asserting as fact misleads readers on verification.  
  → **Phrasing**: "Three agency staffers *told this paper* X, though officials declined to confirm."  
  - **Blameless if false?** No. The standard exposes the lapse: Relying on non-independent sources is *unreasonable* even at deadline.  

  ---

  ### Proposed Style Guide Addition  
  > **Unhedged Assertions**: Reserve flat factual declarations for claims supported by *multiple independent lines of evidence* (e.g., replicated studies, primary documents, or mutually corroborating sources with direct knowledge). For single studies, leaks, or novel findings, attribute claims to their source (e.g., "the study concludes," "sources allege") to clarify provenance and uncertainty. When evidence is emerging or contested, hedging is not cowardice—it is accuracy.  

  ---

  This standard prevents a repeat of the writing-exercise error while allowing confident reporting on well-vetted claims. It embraces science’s iterative nature and investigative journalism’s reliance on human sources—without presenting either as infallible. I urge the committee to adopt it.
