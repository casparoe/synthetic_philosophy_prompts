answer: |-
  ## MEMORANDUM  
  **TO:** Student Council Committee & Faculty Advisor  
  **FROM:** [Your Name], Junior Class Representative  
  **DATE:** Sunday, October 1, 2023  
  **SUBJECT:** Recommendation for Spring Formal Theme & Future Voting Procedure  

  ---

  ### **I. This Year’s Theme: "Midnight in Paris"**  
  After thorough analysis, **"Midnight in Paris" should be our 2024 Spring Formal theme**. Here’s why:  
  1. **It won under the method students expected**: When ballots were cast, voters ranked themes knowing the committee initially planned to use first-choice votes (plurality). "Midnight in Paris" received the most first-choice votes (38%), a clear 3% lead over second place.  
  2. **Changing methods after voting risks fairness**: Switching to a different counting method (e.g., head-to-head matchups) post-vote could appear to manipulate the outcome, especially with rumors circulating. Honoring the original approach maintains trust.  
  3. **No method produces an undisputed winner**: As the head-to-head cycle shows (Paris > Arcade > Sea > Paris), every theme loses to another. Plurality is the only method that gives a single, unambiguous result with this data.  

  **Action:** We announce "Midnight in Paris" as the winner on Monday.  

  ---

  ### **II. Future Counting Procedure: Instant Runoff Voting (IRV)**  
  For all future ranked-choice votes, **we should adopt Instant Runoff Voting (IRV)**. This method uses all student rankings while avoiding cycles. Here’s how it works in 3 steps:  

  1. **Count first-choice votes**.  
     - If a theme has >50% first-choice votes, it wins.  
     - If not, eliminate the theme with the *fewest* first-choice votes.  

  2. **Redistribute ballots** from the eliminated theme to each voter’s next choice.  

  3. **Recount votes**. The theme with >50% now wins. If not, repeat until one does.  

  #### **Why IRV (and not plurality or head-to-head)?**  
  | Method          | Pros                                      | Cons                                        |  
  |-----------------|-------------------------------------------|---------------------------------------------|  
  | **Plurality**   | Simple; familiar; fast                    | Ignores rankings; can elect unpopular winners |  
  | **Head-to-Head**| Avoids cycles *if* a clear winner exists  | Cycles create ambiguity; no clear procedure |  
  | **IRV**         | Uses rankings; ensures majority support; avoids cycles | Slightly more complex; requires full rankings |  

  **Example with our 2024 data:**  
  - **Round 1**: Paris (38%), Sea (35%), Arcade (27%) → No majority. **Arcade eliminated**.  
  - **Round 2**: Arcade’s 27% of ballots redistributed to their voters’ next choice.  
    - Assume 70% of Arcade voters ranked Paris second (≈19% of total), and 30% ranked Sea second (≈8% of total).  
    - **New totals**: Paris (38% + 19% = 57%), Sea (35% + 8% = 43%).  
  - **Result**: Paris wins with 57% support in the final round.  

  IRV resolves the cycle by simulating runoff elections, ensuring the winner has broad support. It’s used in Maine, Alaska, Australia, and many student governments.  

  ---

  ### **III. Why Not Stick with Plurality?**  
  Plurality *is* simple, and we’re using it this year to respect voter expectations. But long-term, it has critical flaws:  
  - **Wastes student input**: 62% of voters *did not* choose Paris first, yet plurality ignores their backup preferences.  
  - **Encourages tactical voting**: Students might avoid ranking a niche theme first ("Retro Arcade") for fear of "wasting" their vote.  
  - **IRV is still transparent**: Tallying is mechanical (eliminate last place, redistribute votes). No subjective choices.  

  ---

  ### **IV. Recommendation**  
  1. **2024 Theme**: Declare **"Midnight in Paris"** the winner via first-choice plurality.  
  2. **Future Votes**: Adopt **Instant Runoff Voting** starting in 2025.  
     - We’ll pre-define the steps in our bylaws and use free online ranked-choice tools for counting.  

  This balances immediate credibility with long-term fairness. Let’s vote Monday to formalize IRV for next year.  

  **Appendices**:  
  - Full 2024 ballot data (attached)  
  - IRV counting flowchart (attached)  

  ---  
  *Approved procedures prevent future disputes. Let’s turn this debate into clarity.*
