  For future procedures, I'll propose Instant Runoff Voting (IRV). It uses rankings to simulate runoff elections, eliminating the need for multiple rounds of voting. It avoids cycles by redistributing votes until a majority winner emerges. Explaining it step-by-step with the current data will show how it resolves ambiguities. Crucially, IRV is used in real elections (like Maine and Alaska), which lends legitimacy.

