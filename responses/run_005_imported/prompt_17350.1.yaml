answer: |-
  Here are nine progressively challenging interview questions designed to pressure the "internal practice" defense, with concise follow-ups anticipating her likely responses. The sequence builds from your core case towards the deeper justificatory challenges and closes with falsifiability.

  **Interview Sequence:**

  1.  **Excuse/Exemption Boundary (Your Case):** "Your work emphasizes the exemption category – where reactive attitudes are *inapplicable* due to incapacity (e.g., childhood, severe psychosis). My novel centers on a driver who killed someone during an *undiagnosed* narcoleptic episode. He wasn't incapacitated in the standard exemption sense *before* the episode; he was a typical agent. Yet, the cause of the harm lies entirely in an unchosen physiological failure he was unaware of. Does this case neatly fit Strawson's exemption category, or does it expose a problematic gap between excuses (he *did* it, but...) and exemptions (he wasn't *capable* of relevant agency)?"
      *   *Likely Answer:* She might argue it leans towards exemption (lack of control during the episode makes reactive attitudes *inapplicable*), or perhaps a unique "non-volitional" excuse blurring the line, emphasizing the *specific moment* of incapacity.
      *   *Follow-up:* "But doesn't the survivor's persistent, agonizing resentment – directed at *him* as the *source* of harm, despite knowing the physiological cause – suggest the exemption category feels inadequate *precisely* because his overall agency *wasn't* fundamentally impaired? Doesn't this reveal a deep human impulse to hold *sources* of catastrophic harm responsible, even when standard exemption criteria are technically met?"

  2.  **Attributability vs. Accountability (Watson):** "Gary Watson distinguishes *attributability* (judging an action as reflecting the agent's character/values) from *accountability* (holding the agent answerable, warranting reactive attitudes). Strawson's naturalism describes our *propensity* for reactive attitudes towards accountable agents. But by framing these attitudes as constitutive of interpersonal life, isn't he implicitly smuggling in a *justification* – suggesting these attitudes are *fitting* responses to agents attributable *and* accountable – rather than merely reporting a psychological fact?"
      *   *Likely Answer:* She'll likely deny the conflation, insisting Strawson is purely descriptive: we *do* have these reactions towards accountable agents; that's just the human form of life. "Fittingness" is internal to the practice, not an external justification.
      *   *Follow-up:* "If it's *only* descriptive, why emphasize the 'human' form of life? Doesn't that normative framing ('this is just *how we are* with each other') subtly elevate the natural propensity *into* the justification, closing the door on asking if this specific way of relating (accountability via reactive attitudes) is *itself* always warranted, even if attributable?"

  3.  **Objective Attitude & Universal Determinism:** "Strawson grants that full adoption of the 'objective attitude' – seeing someone purely as a causal product – is possible towards the exempt, but impractical and dehumanizing universally. If we truly, deeply *knew* the complete causal history of *every* action – every genetic predisposition, every environmental influence, every synaptic spark – wouldn't the rational, consistent stance be to adopt the objective attitude towards *everyone*? Doesn't Strawson's 'impracticality' defense concede that reactive attitudes persist partly *because* we *lack* full determinist knowledge, not because they are rationally justified *despite* it?"
      *   *Likely Answer:* She'll argue the reactive attitudes are constitutive of interpersonal relationships *as we understand them*. Full determinist knowledge wouldn't change our *form of life*; we'd still feel and express these attitudes because they define how we relate as persons.
      *   *Follow-up:* "But if consistent determinist understanding *would* rationally compel the objective stance (as Strawson implies for the exempt), and we resist it universally only due to practical/epistemic limitations, doesn't this reveal that the reactive attitudes *depend* on a *lack* of full understanding for their grip, undermining their claim to be fundamental or rationally inescapable features of personhood?"

  4.  **Wallace's Fairness Challenge:** "R. Jay Wallace argues moral responsibility requires a *normative power* – the general ability to grasp and act on moral reasons. He sees this as a *fairness condition* for holding someone accountable via reactive attitudes. Isn't Wallace offering precisely the kind of *external justification* for the *scope* of our responsibility practices that Strawson dismisses as confused? And doesn't Wallace's focus on the *ability to grasp reasons* provide a clearer, more principled basis for exemptions (like psychosis) than Strawson's naturalistic description?"
      *   *Likely Answer:* She'll likely argue Wallace misunderstands Strawson. Wallace is trying to *ground* the practice in a prior normative condition (fairness/power), but Strawson shows the practice *itself* defines the conditions (exemptions) and the demand for an "external" grounding is a category error. The exemptions arise *within* the practice, not from outside it.
      *   *Follow-up:* "But doesn't Wallace's account *explain why* exemptions like psychosis *matter* to us (lack of normative power) in a way Strawson's mere 'incapacity for ordinary interpersonal relationships' does not? And if our intuitions about fairness *do* shape the contours of the practice (e.g., why we exempt children but not adults with similar reasoning capacities), isn't Wallace identifying the *actual justificatory work* happening *within* the practice that Strawson's naturalism obscures by calling it 'mere description'?"

  5.  **The "Justification" Retreat - Pressing the Analogy:** "You often analogize asking for justification of reactive attitudes to asking if 'promising is justified,' arguing both questions only make sense internally. But promising has *functional justifications* within the practice (reliance, coordination) that can be articulated and debated internally. Can you articulate a similar *functional justification* internal to the practice of reactive attitudes? What *work* do resentment and indignation do *within* our interpersonal ecology that couldn't be done by, say, sadness, disappointment, or protective measures alone?"
      *   *Likely Answer:* She'll point to functions like signaling boundaries, enforcing norms, affirming the moral status of victims and agents, and maintaining the expectations constitutive of relationships. The attitudes *are* the expression of taking the relationship seriously.
      *   *Follow-up:* "If we can identify these internal functions (signaling, norm-enforcement, affirmation), then isn't the question 'Are reactive attitudes the *best* or *only* way to achieve these functions, especially given their costs (e.g., corrosive resentment, retributive impulses)?' a *legitimate internal question*? Doesn't *this* open the door to the very justificatory assessment your 'promising' analogy tries to foreclose?"

  6.  **Hard Incompatibilism & Modifiability (Pereboom):** "Derk Pereboom and other hard incompatibilists argue that even if reactive attitudes are deeply ingrained, they *are* modifiable through reflection and practice. Many traditions (e.g., Stoicism, certain Buddhist practices) cultivate diminished resentment. Therapists help victims move beyond blame. If widespread cultural or personal practices can demonstrably *moderate* or even largely *eliminate* resentment while maintaining relationships and moral understanding, doesn't this fundamentally undercut Strawson's claim that these attitudes are practically inescapable and therefore constitutive?"
      *   *Likely Answer:* She'll likely argue these are exceptional cases, often involving significant detachment or alternative frameworks. The *default, human* stance involves reactive attitudes; modifications are deviations from the norm, not refutations of its fundamentality. Strawson describes the central core of interpersonal life.
      *   *Follow-up:* "But if modification is *possible* without collapsing into the objective attitude universally – if people can relate interpersonally with care, assert boundaries, and condemn wrongdoing *without* feeling personal resentment or indignation – doesn't this show the reactive attitudes are *contingent* psychological features, not *logically necessary* components of holding someone accountable or valuing moral norms? Doesn't possibility imply contingency, and contingency challenge constitutive necessity?"

  7.  **Naturalism vs. Normative Grounding (Revisited):** "Building on Wallace and Pereboom: If Strawson is merely describing a psychological propensity, and we discover that this propensity is (a) potentially modifiable (#6) and (b) sometimes conflicts with other deeply held values like fairness or compassion (as Wallace might argue), doesn't this create space *within* the 'participant stance' itself to critically evaluate and potentially *reform* our propensity for reactive attitudes? Isn't Strawson's naturalism, by portraying them as simply 'what we do,' potentially an obstacle to this internal moral progress?"
      *   *Likely Answer:* She might argue critical evaluation *is* possible internally (e.g., questioning whether resentment is *proportionate*), but not wholesale rejection of the framework. The framework *enables* the moral concepts (fairness, wrongness) used in critique. Reform happens *within* the practice.
      *   *Follow-up:* "But if Pereboom shows the framework *can* be largely set aside, and Wallace offers an alternative grounding (fairness/power) that seems to better *explain* our considered judgments about exemptions, doesn't this suggest Strawson's naturalistic description fails to capture the *normative reasons* that actually govern our considered practices and intuitions? Isn't the 'practice' more responsive to implicit normative pressures than Strawson allows?"

  8.  **The Limits of Description - Exemptions as Justificatory?:** "Strawson derives exemptions (childhood, compulsion, psychosis) from observing when reactive attitudes are *withheld* or *inhibited*. But isn't this descriptive move itself covertly justificatory? By labeling these cases 'exemptions,' doesn't Strawson implicitly endorse the *reason* we withhold attitudes (e.g., 'they couldn't help it,' 'they didn't understand') as *good reasons*, thereby smuggling in a justification for *when* reactive attitudes are appropriate? How is identifying an exemption categorically different from providing a justification for it?"
      *   *Likely Answer:* She'll argue the exemptions are *identified by* the suspension of reactive attitudes in practice. The label 'exemption' is descriptive of a pattern *within* the practice, not an external justification. The reasons *are* the internal reasons participants give.
      *   *Follow-up:* "But doesn't the *consistency* of these reasons across individuals and cultures ('he couldn't help it,' 'she didn't know') suggest they point towards a shared, underlying *normative principle* (like Wallace's normative power) that *explains* the pattern? Isn't Strawson mistaking the *symptom* (withholding attitudes) for the *cause* (the underlying normative reason), and thus his description *presupposes* the justification it claims to avoid?"

  9.  **Falsifiability:** "To conclude: Strawson's naturalism presents our reactive attitudes as a bedrock, near-inescapable feature of human interpersonal life. What conceivable evidence or argument, if presented, would lead you to concede that this account is *wrong* or *significantly incomplete*? Specifically, what would show that the demand for justification isn't *confused*, but actually points to a crucial gap in the naturalistic description?"
      *   *Likely Answer:* She might struggle, potentially restating that the demand *is* confused, or suggesting evidence would need to show humans *could* live full interpersonal lives *without any trace* of reactive attitudes, which she deems impossible. Or, she might say evidence showing exemptions are applied based *solely* on external normative principles, not natural inhibition.
      *   *Follow-up (Crucial):* "If the *only* evidence you'd accept is the demonstrable impossibility of the practice itself – which is arguably a near-tautological defense – doesn't this risk making Strawson's position unfalsifiable? And if it's unfalsifiable, how does it differ from a dogmatic assertion that 'this is just how it is,' potentially shielding the practice from the very internal critical scrutiny (#5, #7) that might reveal its contingent and sometimes problematic nature?"

  **Sequence Rationale:**
  1.  Starts with your concrete, messy novelistic case to unsettle the neat excuse/exemption dichotomy.
  2.  Uses Watson to directly challenge the "mere description" claim, suggesting implicit justification.
  3.  Pushes the objective attitude to its logical (determinist) extreme, questioning the rational stability of reactive attitudes.
  4.  Introduces Wallace as a direct normative rival, forcing a comparison of explanatory power.
  5.  Directly challenges the core "justification is confused" retreat via the promising analogy.
  6.  Brings in Pereboom to attack the empirical premise of inescapability/constitutiveness.
  7.  Synthesizes Wallace and Pereboom to argue naturalism hinders internal moral progress.
  8.  Argues that Strawson's *own* exemption criteria covertly rely on normative justification.
  9.  Ends by demanding falsifiability, exposing the risk of dogmatism if no evidence could count against it.

  This structure systematically boxes in the "internal practice" defense, forcing engagement with justificatory challenges both external (Wallace) and internal (modifiability, functional critique), while highlighting potential weaknesses in its descriptive accuracy and normative neutrality. Good luck with the interview! This promises to be a fascinating discussion central to your novel's core tension.
