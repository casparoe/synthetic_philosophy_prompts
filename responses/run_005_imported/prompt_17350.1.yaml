  Finally, evidence against naturalism. The philosopher might say nothing could count, but that risks making the position unfalsifiable. The follow-up should push on whether that's a weakness.

  I need to arrange these to progressively corner the philosopher. Start with the narcoleptic case to unsettle exemption categories. Then use Watson to suggest a smuggled justification. The objective attitude question challenges the stability of reactive attitudes. Wallace introduces a rival justification. Pereboom attacks inescapability. End with falsifiability.

  For the narcoleptic question, highlight the emotional conflict. The follow-up questions the exemption's adequacy. Watson's question links attributability to accountability. Follow-up on whether naturalism implies fittingness. Objective attitude with full determinism. Follow-up on rational pressure. Wallace's fairness. Follow-up on normative work. Pereboom's moderation. Follow-up on inescapability as contingent. Final question on evidence. Follow-up on unfalsifiability.

