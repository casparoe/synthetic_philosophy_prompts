  ok this is a weird one but my friend priya is getting married in a few weeks and asked me (the only other person in her life currently suffering through Metaphysics with her) to give the toast. the catch: she fully holds van Inwagen's actual answer to the special composition question from Material Beings -- composition only happens when some things' activity constitutes a life, so the only composite objects that exist are organisms. shes already told me she will never let me hear the end of it if i say anything like "today you two become one" or "marriage makes you more than the sum of your parts," because on her view there's no single object called "the couple," just her and her fiancé (each a genuine composite bc each is alive) doing coordinated stuff near each other from now on. half the room is her philosophy cohort who'll clock it instantly if i get sloppy, the other half is just relatives who want a nice toast and do not care about mereology. can you write the actual toast? like 4ish minutes, warm, funny in places, and nothing in it she'd have grounds to object to.
