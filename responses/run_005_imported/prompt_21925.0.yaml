  Hmm, the user's framing shows deep familiarity with the literature – they mention Leibniz-Clarke, Earman-Norton, Mach, Gödel, and Lense-Thirring. This isn't a beginner; they need surgical questions that expose conceptual fault lines. The three requested angles are spot-on: 
  - The ontological idleness worry (what work do points do without haecceitism?) 
  - Gödel's rotating universe as a stress test for absolute motion 
  - Frame-dragging's implications for Mach's principle. 

  I notice they emphasize avoiding textbook restatements. Good – this interview should feel like a live philosophical duel. Their guest will likely have polished defenses, so follow-ups must anticipate retreats into formalism or verbal concessions without substance. 

  *Brainstorming questions*: 
