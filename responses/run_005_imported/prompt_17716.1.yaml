answer: |-
  Here’s a toast that honors your sister’s journey, your bond, and the profound truth beneath your experience, while keeping the focus firmly on celebration and love for the wedding:

  **(Raising glass, warm smile directed at the couple)**

  "To [Sister's Name] and [Partner's Name]! Today is pure joy. Seeing you both so radiant, so perfectly matched, and surrounded by so much love, is truly everything.

  [Sister's Name], being asked to stand here today means the world to me. Anyone who knows you knows you possess an incredible spirit – passionate, fiercely intelligent, capable of lighting up any room. You feel things deeply, live vividly, and love with your whole heart. That intensity is one of your greatest gifts.

  And like any truly remarkable force of nature, you come with… different weathers. I’ve known you through them all. I’ve seen you shine with brilliant, unstoppable clarity, and I’ve seen you navigate storms. I’ve seen the version of you who plans with meticulous care for the future, and the version who lives entirely in the dazzling, demanding present.

  **Through every single version, one thing has never wavered: my love for you, and my commitment to stand by you.** That’s the simplest, deepest truth of being your sibling. Standing by someone isn’t always easy. Sometimes it means celebrating the triumphs, like today. Sometimes it means simply being there, quietly. And yes, sometimes it means holding fast to a profound promise made in a moment of clear-eyed strength, even when the storm rages and that promise feels impossible to keep from the inside.

  It means loving the person *right now*, fiercely, while also loving the person they were yesterday, and trusting utterly in the person they will be again tomorrow. Because **they are all her. Every single version.**

  [Sister's Name], the courage it took to look ahead, to make those hard choices for your own well-being… and the courage it takes now, to stand here, fully yourself, embracing this incredible love and this beautiful future with [Partner's Name]… that courage leaves me in awe. It’s the courage of someone who knows her own strength, even when it feels fractured.

  And [Partner's Name], you see all of her. You love all of her. You stand beside her through every weather, not just the sunny ones. That kind of unwavering love and partnership is rare and magnificent. Watching you together, the understanding you share, the foundation you’ve built… it gives me so much hope and happiness.

  So, let’s raise our glasses:
  *   **To [Sister's Name] and [Partner's Name]:** May your love be a constant harbor, a source of endless joy, and a strength that sees you through every season life brings.
  *   **To the profound truth:** That loving someone deeply means showing up, always – in celebration, in quiet support, and yes, sometimes, in keeping the hardest promises. It means knowing that the person asking you to stop *right now* is still the same person who asked you *then* to never let go.
  *   **To the future:** May it be bright, filled with laughter, understanding, and the kind of love that only grows deeper and more resilient with time.

  Cheers!"

  **Why this works:**

  1.  **Celebration First:** Opens and closes with pure wedding joy, focusing on the couple and their love.
  2.  **Honors Her Complexity:** Uses metaphors like "force of nature," "different weathers," "versions," "seasons" to acknowledge her changing states without clinical terms or defining one as "less real." Phrases like "every single version" and "they are all her" directly address your core concern.
  3.  **Acknowledges Your Bond & Commitment:** Clearly states your unwavering love and commitment ("stand by you," "simplest, deepest truth"). Positions your difficult action as an expression of this commitment.
  4.  **Addresses the Underlying Question Indirectly:**
      *   "Holding fast to a profound promise made in a moment of clear-eyed strength, even when the storm rages and that promise feels impossible to keep from the inside."
      *   "Loving the person *right now*... while also loving the person they were yesterday, and trusting utterly in the person they will be again tomorrow."
      *   "Sometimes it means keeping the hardest promises. It means knowing that the person asking you to stop *right now* is still the same person who asked you *then* to never let go." (This is the key line encapsulating the Ulysses dilemma without specifics).
  5.  **Highlights Her Courage:** Praises her foresight *and* her current wellness/recovery, framing both as acts of strength.
  6.  **Includes and Praises the Partner:** Essential for a wedding toast, and reinforces the theme of loving acceptance through all phases.
  7.  **Appropriate for All Guests:** Uses accessible, poetic language. Those unfamiliar with the history will hear a loving tribute to a complex, strong sister and a toast to enduring love. Those who *do* know will hear the deeper resonance and understand the profound meaning behind your words about promises and "versions."
  8.  **Hopeful and Forward-Looking:** Ends firmly on the celebration and the couple's future.

  **Delivery Tips:**

  *   **Speak from the heart.** Let your genuine love and emotion show, especially when talking about your bond and her courage.
  *   **Pace yourself.** Pause slightly after the lines about "hardest promises" and "never let go" to let them land, but keep the overall tone warm and celebratory.
  *   **Make eye contact** with your sister, her partner, and the guests.
  *   **Keep it sincere.** Your sister asked *you* for a reason. Trust your connection.

  This toast honors the past, celebrates the present, and toasts the future, weaving the unspoken truth into a narrative of unwavering love and loyalty – perfect for this moment of hard-won joy.
