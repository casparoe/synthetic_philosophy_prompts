  We are adjudicating the argument between Marcus and Ilana about whether the coin-flip move rescues causal decision theory (CDT) in the Death in Damascus scenario.

  The scenario: Death is a near-perfect predictor. If you choose to stay in Damascus or flee to Aleppo, Death will be there and you die. The textbook says CDT has instability because whichever pure choice you make, you have evidence that Death is there. The proposed solution is to randomize with a coin flip, which is self-ratifying and gives a 50% chance of survival.

  Argument breakdown:

  1. Marcus: The coin-flip is a genuine solution. The instability was due to restricting to pure strategies. Allowing mixed strategies gives a stable equilibrium, similar to game theory.

  2. Ilana: This is cheating because Death is a near-perfect predictor of you, and a coin flip is a physical event. If Death can predict the coin, we are back in the loop. The solution only works by weakening the predictor when convenient.

  3. Marcus: It's not ad hoc. Death predicts via your psychology and dispositions (like in Newcomb's problem). A random physical event doesn't supervene on your character, so there's a principled distinction.

  4. Ilana: Even granting the line, there's a problem. Using CDT's expected utility with a prior of 50% for each city, paying for a coin flip is worse than just picking a city because it adds a fee without changing the 50% death probability. So CDT's expected utility formula says don't randomize, but the self-ratification story says do randomize. This internal conflict means the instability isn't solved.

  Scoring each move from -2 (clearly wrong) to 2 (clearly right). Then we'll justify each score and see if the coin-flip move rescues CDT.

  Step-by-Step Adjudication:

  Move 1: Marcus (score: 1)
  - Marcus is correct that in game theory, mixed strategies can provide equilibria in situations without pure strategy equilibria (like matching pennies). In the Death in Damascus case, the mixed strategy of 50/50 is self-ratifying under CDT when the predictor cannot predict the coin. This is a standard resolution in decision theory. However, it relies on the assumption that the coin flip is not predictable by Death. Without that, it fails. So it's a valid point but conditional on the predictability of the coin.

  Move 2: Ilana (score: 1)
  - Ilana raises a valid concern: if Death is a near-perfect predictor of all physical events, then the coin flip should be predictable. The original setup doesn't specify the limits of prediction. If we don't weaken the predictor, the problem recurs. This is a legitimate challenge to the standard solution. However, the typical interpretation (as Marcus notes in move 3) is that the predictor is based on the agent's dispositions, not on predicting independent randomness. So Ilana's point is strong but not necessarily fatal if we accept the typical interpretation.

  Move 3: Marcus (score: 1)
  - Marcus draws a principled distinction: the predictor works by reading the agent's psychology (like a brain scan) and thus can predict the agent's choice but not a genuinely random external event. This is consistent with how Newcomb's predictor is often described. It's not ad hoc if we assume that the predictor's ability is limited to the agent's mental state. Therefore, the coin flip is a way to break the prediction. This is a reasonable defense.

  Move 4: Ilana (score: 2)
  - Ilana points out an internal conflict in CDT. If we compute the expected utility of randomizing (with a fee) vs. choosing a pure strategy, CDT's own calculation says that paying to randomize is worse because it costs money and doesn't change the survival probability (which is 50% either way). But the self-ratification argument says that without randomizing, the pure choices are unstable. Thus, CDT has two conflicting recommendations: one from the expected utility formula (don't pay to randomize) and one from the requirement of stability (randomize). This is a deep problem because it shows that CDT doesn't have a coherent recommendation for the agent. This point is clearly right and highlights a flaw in the proposed solution.

  Overall, Ilana's last point (move 4) reopens the problem. The coin-flip move does not fully rescue CDT because it leads to an internal inconsistency.

  What they might be missing:
  - The issue of whether the agent can commit to a mixed strategy without paying a fee. If the agent can randomize for free, then the fee issue doesn't arise. But in the example, there is a fee for the coin flip. Without the fee, randomizing would be costless and then CDT would be indifferent between randomizing and picking a city (both give 50% survival). However, the self-ratification argument would then say that randomizing is stable while pure choices are not. But if there's no cost, CDT might still not have a reason to prefer randomizing because the expected utility is the same. The deeper issue is that CDT doesn't have a built-in way to handle stability or ratifiability as a separate criterion.

  Verdict on the coin-flip move: It does not fully rescue CDT because of the internal conflict pointed out by Ilana. The theory gives two conflicting pieces of advice.

