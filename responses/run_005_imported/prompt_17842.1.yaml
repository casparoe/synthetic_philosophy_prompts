prompt: |-
  I'm a software engineer, and for the past couple of years I've served on our small Elections & Governance working group -- part of the nonprofit foundation behind an open-source project I've contributed to for a long time (a few hundred regular contributors, one elected "Project Lead" seat contested every year). We currently pick the Lead by instant-runoff voting: everyone ranks the candidates, and we eliminate whoever has the fewest first-choice votes, round by round, until someone has a majority. Last cycle there were three real candidates: one who wanted to keep development slow and conservative, one pushing a fairly disruptive rewrite, and one occupying a genuine middle position that people on both sides often listed as their second choice even when she wasn't their first. That middle candidate had the fewest first-choice votes and was eliminated in round one, even though the anonymized ballots later made clear she'd have beaten either of the other two head-to-head. The rewrite candidate ended up winning, and quite a few contributors were unhappy afterward; several admitted they'd ranked only their favorite and left the rest blank, out of a vague worry that ranking everyone sincerely could somehow backfire.

  One working-group member, who has an economics background, now wants to replace instant-runoff with the Schulze method -- the pairwise, Condorcet-style method used for internal elections by Debian, Gentoo, and a few other free-software projects -- on the grounds that it would have picked the middle candidate and is generally much harder to game. Another member is dismissive, and keeps saying that Arrow's theorem already proved decades ago that no voting system can be fair, so arguing over which one we use is bikeshedding. That doesn't sound quite right to me; I'm fairly sure Arrow's theorem is about aggregating preferences into a full ranking rather than about picking a single winner. A friend of mine who works adjacent to decision theory, when I described the argument to her, said the theorem actually on point here is called Gibbard-Satterthwaite, and that as she recalled it, it applies to Schulze as well, just maybe not in quite the same way it applies to what we do now. I don't have the formal background to sort out how much of that is right, or what it should actually mean for our decision.

  I've been asked to draft the memo our working group will send to the foundation's board recommending a course of action before we'd need to lock in a bylaws amendment ahead of next year's election. Could you write that memo for me? I'd like it to explain, for an audience of programmers rather than social-choice theorists, what Gibbard-Satterthwaite actually establishes and how, if at all, it bears on the "Arrow already settled this" objection; to compare instant-runoff and Schulze honestly, including whatever we'd be giving up by switching and not just the fiasco we'd be avoiding; and to close with one specific recommendation -- keep instant-runoff, adopt Schulze outright, adopt Schulze with some added safeguard, or something else entirely -- along with a realistic timeline for bringing it to the board. A page or two, pitched at people who can read code but have never heard of a social choice function, would be ideal.
reasoning: |-
  We are writing a memo for the Elections & Governance working group to send to the foundation's board. The memo should:

  1. Explain Gibbard-Satterthwaite (G-S) in an accessible way for programmers, and clarify how it relates to Arrow's theorem and the "no fair system" objection.
  2. Compare Instant-Runoff Voting (IRV) and the Schulze method honestly, including the trade-offs.
  3. Provide a specific recommendation and a realistic timeline.

  Structure the memo as follows:

  - Introduction: Briefly recap the problem in the last election and the debate in the working group.
  - Clarifying the Theorems: Explain Arrow and G-S in simple terms, focusing on why G-S is more directly relevant for single-winner elections and how it applies to both IRV and Schulze.
  - Comparing the Systems: Discuss IRV and Schulze, their pros and cons, and how they would have behaved in the last election.
  - Recommendation: Choose a course of action and justify it, including any modifications (like adding a safeguard) and a timeline.

  Assume the audience is technical (programmers) but not familiar with social choice theory.

  Let's break down each section.

  ### Introduction
  - State the purpose of the memo: to recommend a voting system for the Project Lead election.
  - Mention the last election's outcome and the concern that the middle candidate (who would have won head-to-head) was eliminated early in IRV.
  - Note the working group's discussion: one member advocates for Schulze, another dismisses the debate because of Arrow's theorem, and we have the Gibbard-Satterthwaite theorem brought up.

  ### Clarifying the Theorems
  - **Arrow's Theorem**: Explain that it is about ranking multiple options (like creating a full ordered list) and the impossibility of having a system that satisfies a set of fairness criteria simultaneously. It does not directly apply to single-winner elections because we are not trying to produce a full ranking of all candidates (though we are using rankings as input, we only output one winner). So Arrow is not the right theorem to invoke for this specific problem.

  - **Gibbard-Satterthwaite Theorem**: 
    - This theorem is about single-winner elections (or more generally, any system that selects one outcome from many).
    - It states that if there are at least three possible outcomes (candidates), no voting system that is deterministic and allows voters to rank or rate the candidates can be simultaneously:
        1. **Non-dictatorial** (no single voter always decides the winner),
        2. **Strategy-proof** (voters can never benefit by voting insincerely), and
        3. **Able to elect any candidate** (every candidate must have a chance to win under some set of sincere votes).
    - In simpler terms: every reasonable voting system for three or more candidates is vulnerable to strategic voting in some situations. Voters might sometimes get a better outcome by not ranking candidates in their true order.

  - **Relevance to our systems**:
    - Both IRV and Schulze are vulnerable to strategic voting (because of G-S). However, the theorem doesn't say that all systems are equally bad. Some systems might be more resistant in practice, or the strategic voting might be harder to execute.
    - The objection "Arrow already settled this" is misplaced because Arrow is about ranking, not single-winner. But G-S does apply to both IRV and Schulze. However, that doesn't mean we shouldn't try to choose a better system.

  ### Comparing Instant-Runoff and Schulze

  - **Instant-Runoff Voting (IRV)**:
    - How it works: Voters rank candidates. Count first choices. Eliminate the candidate with the fewest first choices and redistribute their votes to the next choice. Repeat until one candidate has a majority.
    - Pros: 
        - Simple to understand and explain.
        - Ensures the winner has majority support (by the final round).
        - Avoids the "spoiler effect" that occurs in plurality voting (unlike plurality, a third candidate doesn't split the vote in a way that hands victory to the least preferred candidate of the majority).
    - Cons:
        - Can eliminate a centrist candidate early (as happened in our election) even if that candidate is the Condorcet winner (the one who would beat every other candidate in a head-to-head).
        - Vulnerable to strategic voting in the form of "compromising" (voting for a less preferred but more viable candidate as first choice) or "burying" (ranking a strong opponent lower to help your favorite). However, in practice, these strategies are complex and require coordination.
        - The problem of truncated ballots (like voters only ranking one candidate) can lead to exhausted ballots and might distort the outcome.

  - **Schulze Method**:
    - How it works: Voters rank candidates. The system computes pairwise comparisons (how many voters prefer candidate A to B, A to C, B to C, etc.). It then finds the strongest paths between candidates and selects a candidate who is not beaten by any other in a head-to-head by the strongest path (the Condorcet winner, if one exists, will be chosen; if not, it uses a method to break cycles).
    - Pros:
        - It satisfies the Condorcet criterion: if a candidate would beat every other in a head-to-head, that candidate wins.
        - In the last election, the middle candidate (the Condorcet winner) would have won.
        - It is considered very resistant to strategic voting because the calculations are complex and depend on the entire set of ballots. It is hard for a voter to know how to vote strategically without knowing the full distribution of other votes.
    - Cons:
        - More complex to explain and compute. However, since we are programmers, we can write or use existing code to compute the result. The Debian project has used it successfully.
        - It can produce a winner that is not the first choice of the largest group (which might be confusing to some). However, that winner is the one with the broadest support across pairwise comparisons.
        - In the presence of a Condorcet cycle (A beats B, B beats C, C beats A) it breaks the cycle by choosing the candidate with the strongest path, which might be seen as arbitrary by some. However, cycles are rare in elections with many voters and when candidates are not strategically positioned.

  - **Key Differences in Our Context**:
    - In the last election, Schulze would have elected the middle candidate (the Condorcet winner) while IRV did not.
    - Schulze is more likely to elect a consensus candidate, which might be desirable in a project that values broad support.
    - IRV is simpler and more familiar to the community. However, the last election showed a problem that Schulze would avoid.

  ### Recommendation
  - **Option 1: Stick with IRV**.
    - We could educate voters about the importance of ranking all candidates sincerely to avoid exhausted ballots and improve outcomes. But we cannot eliminate the fundamental issue of the Condorcet winner being eliminated early.

  - **Option 2: Switch to Schulze**.
    - This would avoid the problem we saw and is designed to find the most broadly acceptable candidate.
    - However, it is more complex and might require voter education. We must also ensure we have a robust implementation.

  - **Option 3: Hybrid or other systems?**
    - We could consider other systems, but Schulze is well-tested in open-source communities (like Debian and Gentoo) and has good properties.

  - **Proposed Recommendation**: 
    - Given the last election's outcome and the desire to have a system that respects the Condorcet criterion (which is a strong indicator of broad support), we recommend switching to the Schulze method.
    - However, to address the complexity and the possibility of cycles (though rare), we propose:
        1. Using the Schulze method as the primary method.
        2. Providing an optional, simple explanation for voters: "Rank candidates in order of preference. The winner will be the candidate who is preferred over every other candidate in head-to-head comparisons, if such a candidate exists. If not, we use a method that breaks cycles by looking for the strongest preference paths."
        3. Implementing a transparent counting process (publish the pairwise matrix and the strongest paths) so the result can be verified.
        4. Running a mock election with the previous year's ballots to show the difference and educate the community.

  - **Timeline**:
    - Now (within 1 month): Draft bylaws amendment and prepare educational materials.
    - Next 2 months: Present to the board for approval and then to the community for discussion.
    - 3 months before the election: Finalize the bylaws amendment and test the voting system (including a test run with the community).
    - Election: Use Schulze.

  ### Conclusion
  - Reiterate that while no system is perfect (due to G-S), Schulze is a robust method that would have produced a more satisfactory outcome in the last election and is used successfully in similar communities.

  Now, write the memo accordingly.
answer: |-
  **To:** Foundation Board Members  
  **From:** Elections & Governance Working Group  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Project Lead Voting System Amendment  

  ### **Introduction**  
  In last year’s Project Lead election, our instant-runoff voting (IRV) system eliminated a broadly acceptable "middle" candidate in the first round, despite her theoretical ability to defeat both opponents head-to-head. This outcome led to community frustration and revealed strategic vulnerabilities in IRV. One working-group member proposes adopting the Schulze method (a pairwise, Condorcet-style system) to better capture consensus. Another argues that Arrow’s theorem renders all systems equally flawed. This memo clarifies the theoretical landscape, compares IRV and Schulze, and recommends a path forward.  

  ---

  ### **1. What the Theorems Actually Say (for Programmers)**  
  Think of voting systems as algorithms for aggregating preferences. Both theorems address limitations, but they target different problems:  

  - **Arrow’s Theorem** (1950):  
    - **What it addresses**: Ranking *multiple* candidates (e.g., producing a full ordered list).  
    - **Key insight**: No system can simultaneously satisfy all "fairness" axioms (e.g., "no dictator," "unanimity") when generating a *complete ranking*.  
    - **Why it’s misapplied here**: We’re selecting a *single winner*, not a full ranking. Arrow doesn’t prove all single-winner systems are equally flawed—it’s about a different problem.  

  - **Gibbard-Satterthwaite (G-S) Theorem** (1970s):  
    - **What it addresses**: Electing a *single winner* from ranked ballots.  
    - **Key insight**: For 3+ candidates, *no* deterministic voting system can be:  
      1. **Strategy-proof** (voters never benefit from lying about preferences),  
      2. **Non-dictatorial** (no single voter decides the outcome),  
      3. **Pareto efficient** (if everyone prefers Alice, Alice wins).  
    - **Consequence**: All real-world systems (including IRV and Schulze) can be "gamed" in some scenarios. Voters might manipulate outcomes by misrepresenting preferences.  
    - **Relevance to us**: G-S *does* apply to both IRV and Schulze. However, it doesn’t imply all systems are equally manipulable. Some require less strategy, are harder to exploit, or fail less catastrophically in practice.  

  **Takeaway**: G-S proves no system is perfect, but it doesn’t justify apathy. We can still choose a system less prone to our observed failure modes.  

  ---

  ### **2. IRV vs. Schulze: Trade-offs**  
  #### **Instant-Runoff Voting (Status Quo)**  
  - **How it works**:  
    ```python
    # Pseudocode for IRV  
    while no_majority:  
        eliminate_candidate_with_fewest_first_choice_votes()  
        redistribute_ballots_to_next_choice()  
    ```  
  - **Pros**:  
    - Simple to explain; ensures majority support in final round.  
    - Resists "spoiler effect" (unlike plurality voting).  
  - **Cons**:  
    - **Fails Condorcet criterion**: May eliminate a candidate who beats all others head-to-head (as happened last year).  
    - **Sensitivity to elimination order**: Centrists are often eliminated early if they lack first-choice enthusiasm.  
    - **Strategic vulnerabilities**:  
      - Voters may "bullet vote" (rank only one candidate) to avoid accidentally harming their favorite—exacerbating the above issues.  
      - Complex strategies like "compromising" (boosting a lesser-preferred but viable candidate) can backfire.  

  #### **Schulze Method (Proposed Alternative)**  
  - **How it works**:  
    ```python
    # Pseudocode for Schulze  
    compute_pairwise_preferences()       # Matrix of A vs. B, A vs. C, etc.  
    calculate_strength_of_paths()        # Strongest path between candidates  
    elect_candidate_who_wins_all_paths() # Condorcet winner if one exists  
    ```  
  - **Pros**:  
    - **Condorcet-compliant**: Elects a candidate who beats all others head-to-head (e.g., last year’s middle candidate).  
    - **Resilient to strategy**: Harder to exploit than IRV because outcomes depend on *all* pairwise comparisons.  
      - Debian/Gentoo data: Few strategic incidents in 20+ years of use.  
    - **Handles cycles**: Uses strongest paths to resolve circular ties (e.g., A>B, B>C, C>A).  
  - **Cons**:  
    - **Complex explanation**: Requires pairwise math, not just elimination rounds.  
    - **Less intuitive outcomes**: May elect a candidate with fewer first-choice votes (though broader support).  
    - **Theoretical vulnerability**: Still subject to G-S—but manipulation requires precise coordination and ballot data.  

  #### **Key Trade-off**  
  - **IRV** prioritizes *majority enthusiasm* but risks excluding consensus candidates.  
  - **Schulze** prioritizes *broad acceptability* but may frustrate voters who value first-choice momentum.  

  ---

  ### **3. Recommendation: Adopt Schulze with Voter Safeguards**  
  We recommend **replacing IRV with the Schulze method**, supplemented by two safeguards:  
  1. **Mandatory voter education**:  
     - Explain Schulze in plain language: *"Rank candidates honestly. The winner will beat every other in head-to-head matchups, if possible."*  
     - Provide interactive examples (e.g., a ballot simulator).  
  2. **Transparency mandate**:  
     - Publish anonymized ballots and pairwise matrices post-election for auditability.  

  **Why Schulze?**  
  - It fixes IRV’s failure to elect Condorcet winners—a critical flaw in polarized elections.  
  - While no system is strategy-proof (per G-S), Schulze’s complexity makes exploitation impractical in communities like ours (small, transparent, high-trust).  
  - Proven in open-source contexts (Debian, Gentoo), aligning with our culture.  

  **Timeline**:  
  - **By Nov 30, 2023**: Draft bylaws amendment (working group).  
  - **By Dec 15, 2023**: Board review/approval.  
  - **Jan–Feb 2024**: Voter education (webinars, documentation).  
  - **March 2024**: Implement Schulze in voting software (reuse open-source libraries).  
  - **April 2024**: Pilot with a mock election using 2023 ballots.  

  ---

  ### **Conclusion**  
  Gibbard-Satterthwaite confirms no voting system is immune to manipulation, but it doesn’t preclude choosing a *better* one. Schulze addresses IRV’s failure to capture consensus while offering robust defenses against real-world gaming. By adopting it—with education and transparency—we can promote broadly supported leadership and restore trust. We request board approval by December 15 to meet 2024 election deadlines.  

  **Attachments**:  
  - [Schulze method explainer (for voters)]  
  - [Debian election data case study]  

  Respectfully submitted,  
  *Elections & Governance Working Group*
