prompt: |-
  Quick one before I head into Thursday's seminar on Ruth Changs parity paper -- want to pressure-test my own explanation first. The lazy way to describe hard choices (like Raz's lawyer vs. clarinetist case) is to just say the two options are 'incomparable': not better, not worse, not equal. Chang says thats actually a mistake -- she thinks some of these cases are instead 'parity,' a fourth, positive value relation sitting alongside better/worse/equal, not just the absence of one. Explain what actually hangs on that move: what breaks for rational choice if we just stick with plain incomparability, and how does relabeling it 'parity' supposedly fix that? And push back a little too -- is there a real structural difference here, or is Chang just giving the same phenomenon a friendlier name so hard choices don't look so arbitrary?
reasoning: |-
  Okay, let me tackle this user's query about Ruth Chang's parity concept. They're prepping for a seminar and want to pressure-test their understanding. The core question is what breaks in rational choice theory if we use "incomparable" versus Chang's "parity," and whether this is just relabeling. 

  First, I need to unpack the standard view. Incomparability suggests options are fundamentally alien - like comparing a painting to a mathematical proof. Rational choice theory struggles here because it relies on trichotomy (better/worse/equal). If options are incomparable, standard decision models can't handle them, making choices seem arbitrary. That's problematic because real-life hard choices (like career paths) feel rationally resolvable, not coin flips.

  Chang's parity offers a structural alternative. By proposing a fourth value relation, she claims options can be comparable yet non-trivially equal. The key is that parity allows small improvements to create new value relations. If I slightly improve one option in an incomparable pair, it might become comparable. But with parity, small tweaks preserve comparability - the improved option becomes better, not suddenly comparable. This maintains rationality through covering values or will-based commitment. 

  The user also wants pushback. Is parity really distinct? I think the small improvement test is crucial - it shows parity behaves differently. But one could argue Chang just reframes incomparability to make us feel better about hard choices. The debate hinges on whether value relations are discovered or constructed. 

  For the seminar prep, I should emphasize practical implications: parity preserves rational justification in hard choices while incomparability surrenders to arbitrariness. The user seems analytically sharp - they'll appreciate the tension between structural differences and philosophical rebranding. I'll keep the explanation tight but layered enough for seminar-level discussion.
answer: |-
  Here's a breakdown of what hangs on Chang's "parity" move, why she thinks incomparability is insufficient, and the key pushback:

  **The Problem with "Incomparability" for Rational Choice:**

  1.  **The Trichotomy Trap & Rational Arbitrariness:** Standard rational choice models (and much of value theory) rely on the **trichotomy thesis**: for any two options A and B, exactly one of three relations must hold: A>B, B>A, or A=B. If options are *truly incomparable* (not merely unknown, but *fundamentally* incomparable), they fall outside this trichotomy. This creates a problem:
      *   **Rational Choice Requires a Basis:** To rationally choose A over B, we typically need a reason: A is better, or at least equal. Incomparability denies *any* such justifying relation exists.
      *   **Arbitrariness Threat:** If *no* value relation holds, the choice seems fundamentally arbitrary. Picking the lawyer over the clarinetist (or vice versa) appears no more rational than flipping a coin. This makes hard choices look irrational *by definition*.

  2.  **The "Small Improvement" Test (The Clincher for Chang):** This is where incomparability really struggles. Imagine comparing career A (Lawyer) and career B (Clarinetist), deemed incomparable.
      *   **Scenario:** Now consider career A+ – being a Lawyer with a *slightly* higher salary.
      *   **Incomparability Prediction:** If A and B are *incomparable*, A+ should *still* be incomparable to B. Why? Adding a tiny bit of a completely different value dimension (money) to one option shouldn't magically make the *fundamentally different kinds of value* comparable.
      *   **Intuition:** However, Chang argues our intuition rebels. It seems clear that A+ is now *better than* B. The lawyer life with a bit more money seems strictly preferable to the clarinetist life. But if A and B were truly *incomparable*, this jump to "A+ > B" is mysterious. How did a small improvement create comparability where none existed?

  **How "Parity" Fixes This:**

  1.  **A Fourth, Positive Relation:** Parity isn't the *absence* of a relation; it's a *sui generis* fourth relation alongside better, worse, and equal. A and B are "on a par."
  2.  **Comparability Without Hierarchy:** Parity means A and B *are* comparable, but not in a way that ranks one above the other or declares them identical. They are in the same "neighborhood" of value, roughly equivalent overall, but potentially very different in kind.
  3.  **Solving the Small Improvement Problem:** This is parity's key advantage.
      *   If A and B are *on a par*, then a small improvement to A (creating A+) *can* make A+ *better than* B.
      *   **Why?** Because A and B were already comparable (via parity). A small improvement tips the scales within this comparable framework. It doesn't need to *create* comparability from scratch; it leverages the existing comparability established by parity.
      *   **Analogy:** Think of two paintings of roughly equal greatness but different styles (e.g., a Rembrandt portrait vs. a Van Gogh landscape). They are on a par. Now, slightly improve the Rembrandt (clean a smudge). The cleaned Rembrandt is now *better* than the Van Gogh. The small improvement worked *because* they were already comparable via parity.

  **What "Hangs" on This Move (The Payoff):**

  1.  **Rationality of Hard Choices:** Chang's core goal is to show that hard choices can be *rational*. Parity provides the necessary value relation:
      *   Choosing A over B when they are on a par is rational *because there is a positive relation holding between them* (parity) that makes them appropriate objects of comparison and choice. You can have reasons grounded in the covering value(s) without needing one to be *better*.
      *   **The Role of the Will:** Crucially, Chang argues that when options are on a par, reason runs out. Neither option is better, worse, or equal. But this doesn't mean choice is arbitrary! Here, your *will* can step in and *create* a reason by *committing* to one option over the other ("I will *make* being a lawyer better for me"). This commitment is rational *because* it's exercised within the space defined by parity – the options were already comparable and roughly equivalent. Will-based commitment wouldn't make sense between truly incomparable options (choosing between a symphony and the number 7).
  2.  **Accommodating Value Pluralism:** Parity offers a way to handle genuine value pluralism (incommensurable values like career achievement vs. artistic fulfillment) *without* collapsing into incomparability and arbitrariness. Values can be different yet comparable on a par.
  3.  **Explaining the Phenomenology:** Parity better captures how hard choices *feel*. We don't feel like we're choosing between alien objects; we feel like we're weighing meaningful alternatives that are "in the same ballpark," even if there's no clear winner. Incomparability feels too stark.

  **The Pushback: Is Parity Just a Friendly Rebranding of Incomparability?**

  This is a serious and common criticism. Here's the case:

  1.  **Formal Equivalence?:** Critics argue that "A is on a par with B" behaves logically very similarly to "A and B are incomparable." Neither implies better/worse/equal. Formally, they might be indistinguishable within a simple preference ordering model.
  2.  **The Burden of Proof:** Chang posits a *new* relation. The onus is on her to prove it's genuinely distinct, not just incomparability with a positive spin. Does "parity" *explain* anything *beyond* what incomparability + the small improvement intuition does? Is the small improvement argument decisive?
  3.  **"Comparability" Without a Ranking?:** What does it *mean* to say two options are "comparable" via parity if this comparability doesn't allow us to rank them? Isn't the core function of comparability to establish a ranking? Parity seems to stretch the meaning of "comparable."
  4.  **The Will Move:** Critics might argue that invoking the will to "create" reasons after reason runs out looks suspiciously like dressing up arbitrariness in rational clothing. If reason truly runs out with parity, how is the will's choice fundamentally different from an arbitrary leap under incomparability?

  **Chang's Defense (Why it's Structural, Not Just Semantic):**

  1.  **The Small Improvement Argument:** This is Chang's strongest point. The *different behavior* under small improvements is a demonstrable structural difference. Incomparability predicts no change; parity predicts a shift to "better than." Our strong intuition supports the parity prediction. This suggests a real difference in how the value relations function.
  2.  **Grounding in Covering Values:** Parity arises when options share a "covering value" (e.g., "a good career") but instantiate it in different ways involving different, potentially incommensurable sub-values (money/status vs. artistic fulfillment/passion). This shared grounding in a higher-order value provides the basis for comparability that incomparability lacks. Truly incomparable options lack this shared evaluative framework.
  3.  **Explanatory Power:** Parity offers a *better explanation* for the phenomenology and rationality of hard choices than incomparability. It avoids making them seem irrational or arbitrary by providing a positive value relation and a space for rational commitment.

  **Conclusion:**

  Chang's move to "parity" isn't *just* a friendlier name. It's a substantive claim about the structure of value relations designed to solve specific problems that "incomparability" creates for rational choice theory, particularly the small improvement problem and the threat of arbitrariness. The key structural difference lies in how parity allows for comparability *without* hierarchy and explains the transition under small improvements. While critics argue it might be a distinction without a real difference, Chang's evidence from the behavior of value relations under perturbation (small improvements) and its ability to preserve the rationality of commitment in hard choices makes it a significant and distinct proposal. The debate hinges on whether the small improvement test truly reveals a structural flaw in incomparability and whether the notion of comparability without ranking is coherent and necessary. Enjoy the seminar!
