  First, I need to recall the core differences between the two theories. Epistemic contextualism holds that the truth conditions of knowledge attributions depend on the context of the attributor—specifically, how high the epistemic standards are in that context. Pragmatic encroachment, on the other hand, argues that practical stakes affect the subject's knowledge itself, not just the attribution. So the key difference is whose context matters: the attributor's for contextualism, the subject's for pragmatic encroachment.

  The challenge is to create a scenario where the attributor's context has low standards, but the subject's stakes are high. That way, contextualism might say "S knows P" is true because the attributor's standards are low, but pragmatic encroachment would deny that S knows P because the subject's high stakes require more evidence.

