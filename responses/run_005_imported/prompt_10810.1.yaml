  Hmm, I see where they're coming from. They mention that asymptotic arguments feel like a cop-out when real-world data is finite. Their coworker's defense about idealization didn't fully satisfy them. What they really want is a strong case against the "vindication of Occam" claim, while still engaging with counterarguments honestly.

  First, I need to steelman their position. The core issue is: if simplicity rankings can flip-flop based on arbitrary UTM choices, how is this any better than a "vibe"? The additive constant isn't just a small tweak—it could be larger than any real dataset. Imagine two UTMs where the compiler size dwarfs all practical strings. Then K_U1(s) and K_U2(s) might swap which hypothesis looks simpler for every s we care about.

  But I shouldn't dismiss the other side. The asymptotic argument does hold mathematically: as data grows, the constant becomes negligible. And Solomonoff induction *is* meant as an ideal. Still... for finite data, the "simplest" model could be totally different on two UTMs. That seems fatal for calling it "objective."

  I recall Levin's universal search has similar issues. And the subjectivity runs deeper: even with invariance, the *ordering* isn't preserved. Two hypotheses might swap Kolmogorov complexity ranks depending on the UTM. So Occam's razor would literally point to different "simplest" explanations. Yikes.

