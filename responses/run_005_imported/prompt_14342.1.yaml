  What's tricky is explaining why weakening the successor breaks this deadlock. The key insight is that when the successor is weaker, the agent can "see through" the successor's reasoning limitations. It's not just about avoiding infinite loops - it's about asymmetric transparency. Like how an adult can predict exactly where a child's math proof might fail, while the child can't second-guess the adult.

