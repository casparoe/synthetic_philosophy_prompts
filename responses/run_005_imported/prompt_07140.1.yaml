  ## Memorandum: Framing Relief for Historical "Crime Against Nature" Convictions

  **To:** Chair, Historical Convictions Review Board  
  **From:** [Your Name], Public Member  
  **Date:** October 26, 2023  
  **Subject:** Recommended Framing for Board Orders & Resolution of Collateral Consequences  

  ### I. Introduction
  Per your request, this memorandum analyzes the competing positions regarding the legal characterization of relief granted to petitioners convicted under the repealed "crime against nature" statute. It presents the strongest arguments for both the "void *ab initio*" and "pardoned/expunged" framings, addresses the core rule-of-law concerns, and provides a concrete recommendation for the Board's order language and handling of collateral consequences.

  ### II. The Competing Positions: Strengths and Concerns

  1.  **Position A: Statute Void *Ab Initio***
      *   **Core Argument:** A law criminalizing private, consensual conduct solely on the basis of animus towards the participants, devoid of any rational basis in harm prevention or public good, fails a fundamental test of legality. It is so substantively unjust that it cannot be considered valid law from the moment of enactment. Its purported authority was a legal fiction.
      *   **Philosophical/Historical Basis:** Invokes natural law traditions and the "Radbruch Formula" articulated in postwar German jurisprudence (e.g., cases involving Nazi-era informers). Echoes Lon Fuller's argument in the Hart-Fuller debate that a system utterly failing the "inner morality of law" (e.g., gross injustice, impossibility of compliance) forfeits legal character. The statute's repeal reflects societal recognition of this inherent invalidity.
      *   **Moral Force:** Provides the most complete vindication for petitioners, declaring they were *never* justly convicted under valid law. It aligns with contemporary constitutional principles recognizing fundamental privacy rights.
      *   **Rule-of-Law Concern (The Crux):** This framing risks undermining the core positivist insight articulated by H.L.A. Hart: the importance of distinguishing between what the law *is* (as a matter of social fact, source, and pedigree) and what it *ought to be*. The statute *was* enacted via proper procedure, recognized as valid law for decades by legislatures, executives, courts (including appeals upholding it), and citizens. Declaring it "never law" retroactively sets a precedent where future bodies could weaponize this reasoning to nullify duly enacted laws they disfavor based on contested claims of injustice, destabilizing legal certainty and democratic process.

  2.  **Position B: Convictions Pardoned and Expunged**
      *   **Core Argument:** While morally repugnant and ultimately repealed, the statute was, as a historical and legal fact, valid positive law when applied. Relief is an act of grace and corrective justice based on *contemporary* moral and legal standards, acknowledging the profound injustice inflicted under the *then-valid* law. It is legislative mercy operationalized through this Board.
      *   **Philosophical/Historical Basis:** Aligns with Hartian legal positivism: the law's validity stems from its source and social efficacy, not its moral merits. Courts upheld the statute; citizens were convicted under its authority. Recognizing its historical validity does not endorse its morality; it acknowledges legal reality. The repeal and creation of this Board represent the *current* legislature's corrective action.
      *   **Rule-of-Law Strength:** Preserves the critical distinction between legal validity and moral justice. It avoids the slippery slope of retroactive nullification based on shifting moral judgments. It respects the institutional history and the fact that convictions, however unjust by today's lights, were procedurally obtained under the operative legal system of the time.
      *   **Moral Concern:** Feels like a lesser vindication. It implies the petitioners *were* guilty of a crime (albeit one now deemed unjust), requiring an act of mercy rather than recognition of a fundamental right violated from the outset. The language of "pardon" can carry connotations of forgiveness for wrongdoing, which is inappropriate here.

  ### III. Resolution: Recommendation for Board Order Framing

  **Recommendation: Adopt a hybrid approach centered on "Expungement as Recognition of Fundamental Injustice."** Neither pure *void ab initio* nor simple pardon fully captures the unique nature of this Board's mandate or the specific injustice involved. The strongest, most legally defensible, and most just framing is:

  > **"The conviction is expunged because the conduct underlying it is now recognized, and should always have been recognized, as protected by fundamental rights of privacy and liberty, rendering the statute's application in this instance a profound injustice incompatible with core principles of law and ordered liberty."**

  **Justification for this Framing:**

  1.  **Acknowledges Historical Validity Without Endorsement:** It avoids declaring the statute universally "void *ab initio*," respecting the rule-of-law concern about retroactive nullification. It focuses on the *application* in these specific instances (private, consensual conduct).
  2.  **Provides Strong Vindication:** It explicitly states the conduct "should always have been recognized" as protected, affirming the petitioners' fundamental rights existed *at the time*, even if unrecognized. This moves beyond mere pardon towards a declaration of inherent right.
  3.  **Grounds in Evolving Principles:** It ties the injustice directly to the violation of "core principles of law and ordered liberty," invoking a jurisprudential foundation (akin to evolving standards of decency or fundamental fairness) that justifies retrospective correction without declaring the entire statute non-law. It reflects the legislature's *current* judgment, enacted via repeal and creation of this Board.
  4.  **Avoids Dangerous Precedent:** It is narrowly tailored to the specific, egregious facts this Board reviews: convictions for *private, consensual* conduct criminalized solely due to animus, now recognized as protected. It does not create a general tool for declaring disliked statutes "never law."
  5.  **Aligns with Board Mandate:** The legislature created this Board precisely to address the *unique historical injustice* stemming from this specific repealed statute. This framing fulfills that mandate directly.

  ### IV. Resolution: Collateral Consequences

  **Recommendation:** The Board order **MUST explicitly mandate the automatic nullification of all collateral consequences directly flowing from the expunged conviction.**

  *   **Including:** Removal from sex offender registries, reversal of less-than-honorable discharge characterizations (directly resulting from the conviction), reinstatement of revoked professional licenses (where revocation was solely or primarily based on this conviction), and clearance of associated administrative records.
  *   **Mechanism:** The order shall direct all relevant state agencies (Department of Corrections/Registry, Veterans Affairs, Licensing Boards, etc.) to identify and nullify these consequences within [e.g., 60 days] of receiving the Board's order, without requiring any further action from the petitioner. The Board shall transmit orders directly to these agencies.
  *   **Justification:**
      *   **Practical Justice:** Requiring elderly petitioners or bereaved families to re-litigate each consequence defeats the purpose of the Board and the legislative intent behind its creation. The injustice was holistic; the remedy must be too.
      *   **Legal Authority:** The legislature granted the Board the power to "clear convictions" and grant "relief." Nullifying the direct, automatic legal consequences of the conviction is a necessary and inherent part of granting meaningful relief and clearing the conviction. It is within the implied authority of the statutory mandate to make petitioners "whole" to the extent possible.
      *   **Administrative Feasibility:** The triggering event is clear (the Board's specific expungement order). Agencies have the records linking consequences to the conviction. This avoids a chaotic patchwork of outcomes.

  ### V. Proposed Order Language

  Based on the above, the recommended standard language for Board orders is:

  > "**ORDER OF EXPUNGEMENT AND NULLIFICATION**  
  > Upon review of the petition and the record of conviction under [Repealed Statute Citation] for conduct occurring on or about [Date], the Historical Convictions Review Board finds that the conduct underlying the conviction involved private, consensual acts that would be protected under the laws and Constitution of [State] today, and that the application of the statute to criminalize such conduct constituted a profound injustice incompatible with core principles of law and ordered liberty, as recognized by the legislature's repeal of the statute and creation of this Board.
  >
  > **IT IS THEREFORE ORDERED:**
  > 1.  The conviction in [Case Number, Court, Date] is **EXPUNGED.**
  > 2.  All collateral legal consequences directly resulting from this conviction, including but not limited to: registration on any sex offender registry; any less-than-honorable military discharge characterization solely or primarily based on this conviction; and any revocation, suspension, or denial of a professional license solely or primarily based on this conviction, are **NULLIFIED.**
  > 3.  The Clerk of [Original Court] shall seal all records pertaining to this conviction and annotate them to reflect this Order of Expungement and Nullification.
  > 4.  The relevant state agencies ([List Agencies, e.g., State Police/Registry, Dept. of Veterans Affairs, Professional Licensing Boards]) are directed to identify and implement the nullification of consequences specified in Paragraph 2 within 60 days of receiving this Order, and to confirm completion to the Board and the petitioner (or petitioner's representative)."

  ### VI. Conclusion
  This recommendation seeks a principled middle path. It provides petitioners with the substantial vindication they deserve by recognizing the fundamental rights violated and mandating comprehensive relief, while respecting the rule-of-law concerns about retroactively negating historical legal validity in a way that could endanger future legal stability. It grounds the Board's action firmly in its legislative mandate to correct a specific, profound historical injustice. This framing, coupled with the automatic nullification of collateral consequences, offers the most just, legally sound, and practical resolution for the petitioners and the Board's important work. I move that this language be adopted as the standard order for granting relief.
