answer: |-
  Your close reading is excellent—Locke's text *does* contain a tension between a "minimal correlational" claim and a stronger "heterogeneity" implication. Here's a breakdown of the textual evidence and empirical insights:

  ### 1. **Locke's Textual Ambiguity**
     - **The Minimal Correlational Reading** (favoring Leibniz's later critique):  
       Locke explicitly states the blind man lacks *"Experience, that what affects his touch so or so, must affect his sight so or so"*. This frames the issue as a lack of learned *association* between two sensory modalities that *could* share content. The phrasing *"must affect his sight so or so"* implies a contingent, experience-based link—not an intrinsic incompatibility.  
       *Key evidence*:  
       - "Not yet attained" suggests the connection *can* be acquired.  
       - Locke focuses on the absence of "experience," not on an ontological gap.

     - **The Stronger Heterogeneity Hint** (anticipating Berkeley):  
       Locke's closing remark emphasizes our debt to *"acquired notions"* for connections we mistake as immediate. This implies visual and tactile ideas of figure are not natively linked—they require cognitive "improvement" to associate. His example of the cube's *"protuberant angle"* (which presses the hand "unequally" but may not "appear to his eye as it does in the Cube") subtly suggests tactile and visual properties may not map intuitively.  
       *Key evidence*:  
       - The "protuberant angle" example implies tactile "unequal pressure" ≠ visual appearance.  
       - "Acquired notions" implies active cognitive construction, not mere association.

     - **Verdict**: Locke’s wording leans toward the **minimal correlational claim** as his *explicit argument*, but his rhetorical framing (especially the conclusion) opens the door to heterogeneity. He likely did not sharply distinguish these positions—his goal was to refute nativism, not articulate a theory of cross-modal perception. The ambiguity reflects his broader empiricist project: all complex ideas (including sensory correlations) require experience.

  ### 2. **Empirical Evidence from Vision Restoration**
     - **Historical cases** (e.g., Cheselden's 1728 cataract patient) align with Locke’s "no": Newly sighted patients could not visually identify objects they knew by touch without tactile confirmation.  
     - **Modern studies** (e.g., Fine et al. 2003 on sight recovery after congenital blindness) confirm:  
       - Patients fail cross-modal shape matching (cube vs. sphere) immediately after sight restoration.  
       - **Crucially, they acquire the ability rapidly**—often within days—through sensory-motor interaction (e.g., handling objects while viewing them).  
     - **Interpretation**:  
       - **Against strong heterogeneity**: Rapid learning suggests visual and tactile shape representations *can* be aligned. The modalities are not incommensurate.  
       - **For Locke's minimal claim**: Initial failure supports Locke’s emphasis on *learned association*. The speed of learning, however, implies *amodal spatial processing* (e.g., understanding "protuberance" via multiple senses) facilitates correlation—a point Leibniz might exploit.  

  ---

  ### **Key Conclusions for Your Paper**
  1. **Locke's primary commitment** is to the **minimal correlational claim**: The blind man lacks *experience-based associations* between vision and touch. He does not explicitly deny a common abstract representation of "figure" (though he arguably implies it’s inaccessible without experience).  
  2. **The heterogeneity hint** arises from Locke's rhetoric about *constructed knowledge* ("acquired notions"), but he stops short of Berkeley’s radical sensualism.  
  3. **Empirical data** supports Locke’s prediction of initial failure but undermines strong heterogeneity. The rapid cross-modal learning observed suggests:  
     - Touch and vision share *structural information* (e.g., geometric relations).  
     - Locke’s "not yet attained experience" correctly identifies the barrier, but Leibniz is partially vindicated: Humans *can* quickly infer cross-modal links through reason/exploration.  

  **Recommendation**: Frame Locke as arguing for the *necessity of associative experience* while acknowledging his text’s latent tension with later sensualism. Emphasize that modern perceptual science validates his core thesis (initial cross-modal failure) while complicating his implicit assumptions about sensory "ideas."  

  #### **Sources for Empirical Claims**:
  - Fine, I. et al. (2003). *Nature Neuroscience* 6(9): 915–916.  
  - Held, R. et al. (2011). *Psychological Science* 22(2): 190–193.  
  - Gregory, R.L. (2003). *Nature Neuroscience* 6(9): 909–910.
