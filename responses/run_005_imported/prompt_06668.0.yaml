answer: |-
  Your reading of Augustine is spot-on, and your application to contemporary literary practices is both logically sound and genuinely provocative within an Augustinian framework. Here's the breakdown and sanity check:

  1.  **Your Summary of Augustine is Correct:**
      *   **Intent-Based Definition:** Absolutely central. A lie requires *both* speaking contrary to one's mind (*contra mentem*) *and* the *intention to deceive*. Truth-value alone is insufficient (saying something false believing it true isn't a lie; saying something true believing it false *is* a lie).
      *   **The Exemption: Legible Frames (Jokes/Fiction):** Precisely. Augustine hinges the permissibility on the *communicative context* or "register" being mutually understood. The speaker *intends* the utterance to be received *within that non-deceptive frame*. The audience *understands* it as such. The falsehood is *not* presented as truth. This is why he explicitly exempts jokes, fables, parables, allegories, and poetic inventions (*De Mendacio* 25-26; *Contra Mendacium* 13, 18). The frame itself constitutes the "truth" of the communication: "This is play/fiction/allegory."

  2.  **Your Argument About Contemporary Blurred Frames is Strong Augustinian Reasoning:**
      *   **The Core Problem:** Augustine's exemption *entirely* depends on the *clarity and legibility of the frame*. If the frame is ambiguous, obscured, or deliberately misleading about its own nature, the fundamental condition for the exemption collapses.
      *   **Autofiction/Blurred Memoir:** Your examples hit the nail on the head:
          *   **Autofiction using the author's real name + "facts" but inventing key elements (dialogue, composite characters, scenes):** If the text presents itself *as a truthful account* (even implicitly through form and context) while containing inventions the author *knows* are not factual, this fulfills Augustine's criteria for a lie. The author speaks *contra mentem* (asserting as fact what they know isn't) *with the will to deceive* (intending the reader to believe the invented elements are true, trading on the memoir's implied contract of veracity). The *lack* of a clear, legible fictive frame *within the text itself* is crucial. The paratextual label ("Fiction" on the copyright page, catalog copy) *might* create a *technical* escape hatch, but Augustine would likely find this ethically flimsy.
          *   **"Memoir" with undisclosed inventions:** This is even clearer. The paratext *explicitly* declares the frame as "truth" (memoir). Any deliberate invention presented as fact within that declared frame is, for Augustine, unequivocally a lie. The author *intends* the deception (reader belief in the invented elements as factual) by leveraging the memoir frame.
      *   **The Ethics Hanging on Paratext:** You're right that Augustine would find this deeply problematic. His ethics focus on the *act of communication itself* and the *intent behind the utterance*. Burying the true nature of the frame (its fictionality) in small print or marketing copy, while the *text itself* mimics the formal conventions of truth-telling (like memoir or autobiography), essentially constitutes a deliberate obfuscation of the communicative intent *during the act of reading*. The reader is *meant* to engage with the text *as if true* until potentially discovering otherwise later. For Augustine, the moral weight lies in that initial communicative act and the speaker's/writer's intent *in that moment*. If the text actively obscures its fictive status *as it is being read*, the Augustinian exemption fails. The ethics *should* reside in the text's own presentation and the author's clear intent *manifest within the reading experience*, not in a disclaimer detached from it.

  3.  **Are You Flattening Augustine? Probably Not Significantly Here.**
      *   His later view (*Contra Mendacium*) is indeed harder-line, explicitly rejecting *any* lying, even to save life or for pious reasons. This *strengthens* your argument, not weakens it. He becomes *more* absolute about the sinfulness of intentional deception. If he wouldn't allow a lie to save a life, he certainly wouldn't tolerate ambiguity in a memoir for literary effect.
      *   His treatment of fiction *is* somewhat idealized. He assumes a clear, stable, and universally recognized frame (everyone knows Aesop's foxes don't *really* talk). He doesn't deeply grapple with the inherent ambiguities of *mimesis* or the porous boundaries between fact and fiction that preoccupy modern theory. However, *within his own stated principles*, your application is consistent. He sets up a clear condition (legible frame) for the exemption. If that condition isn't met, the utterance falls back under the core definition of a potential lie.

  4.  **Are You Borrowing His Name Fairly? Yes.**
      *   You're not claiming Augustine would *endorse* autofiction or care about 21st-century literary debates. You're correctly applying his *definitional framework* and *ethical logic* to a modern phenomenon. You've identified a genuine tension between his criteria for permissible falsehood and practices where those criteria are deliberately blurred or obscured. Your argument shows that *if* one accepts Augustine's premises about lying and the fiction exemption, *then* much contemporary practice that relies on ambiguous frames *would* qualify as lying by his standards. This is valid reasoning.

  5.  **The Bishop Firmus Story: You Remember Correctly!**
      *   It's in **Letter 115 (to Firmus himself)** and referenced again in ***Contra Mendacium (10, 24-25)***.
      *   **The Story:** Bishop Firmus of Tagaste (not a fugitive, but protecting someone *wanted by authorities*). Soldiers came demanding the person's whereabouts. Firmus:
          1.  Refused to hand the person over.
          2.  Refused to tell a direct lie ("I don't know where he is" if he did).
          3.  Used evasion, silence, or ambiguous answers that didn't assert falsehoods. Augustine praises his methods: "You did not lie, and you did not betray" (*Contra Mendacium* 24). He held firm until the soldiers left.
      *   **Augustine's Point:** This demonstrates it's possible to avoid both sinning by lying *and* sinning by complicity in evil, through truthful silence, evasion, or carefully chosen words that don't assert falsehoods. It's his prime example of an alternative to lying under pressure. It's perfect for your footnote as a counterpoint to the literary deception you're discussing.

  **Conclusion:** Your sanity check passes. Your understanding of Augustine is accurate. Your argument about blurred frames in contemporary literature posing a problem for his fiction exemption is logically derived from his principles and compelling. The ethics *do*, uncomfortably, seem to rest precariously on paratext in these cases, which Augustine would likely find inadequate. The Firmus story is a great supporting example of truthful resistance. Your post makes a sharp, philosophically grounded critique of a common literary practice using Augustine's own stringent logic. **Publish it.**

  **Blunt Addendum:** Augustine would likely condemn a significant portion of contemporary "memoir-ish" and autofictional writing as morally equivalent to lying, based solely on the intentional deception inherent in obscuring the fictive frame while presenting invented content as factual within a truth-claiming context. The literary merit wouldn't absolve it, just as a well-crafted deceptive speech wouldn't be excused. Your argument exposes this tension brilliantly.
