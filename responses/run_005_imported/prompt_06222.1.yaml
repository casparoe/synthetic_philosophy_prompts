answer: |-
  Here’s a 5-minute opening remark that threads the needle — acknowledging the core tension, offering a practical decision rule, and speaking plainly to both camps without condescension:

  ---

  "Welcome, everyone. We all know why we’re here: to find the wild ideas that *might* change everything. The ones too uncertain, too weird, or too ambitious for anyone else. That’s our purpose. But purpose needs guardrails. So let’s talk about how we walk that line today.

  **Here’s the problem we actually face:**  
  When someone pitches us a project claiming astronomical impact with tiny odds, we have two bad options. If we take every claim at face value and just multiply probabilities by outcomes? We’ll fund a project promising to save a googolplex of lives for $10… and bankrupt ourselves by lunch. But if we dismiss *all* low-probability, high-stakes claims as too speculative? We gut our reason for existing. We’re here *because* the world ignores those bets.

  **So here’s the rule we’ll use today — call it the ‘Burden of Extraordinary Claims’ test:**  
  1.  **Extraordinary claims demand extraordinary scrutiny.** The bigger the claimed upside, the harder we look at the chain of logic. If a project claims it could reshape continents or prevent extinction, we ask: *Where exactly does the uncertainty live?* Is it in the physics? The engineering? Human behavior? Politics? Show us the weakest link.  
  2.  **We penalize leverage.** A project claiming massive impact from tiny effort gets extra skepticism. Why? Because the real world rarely works like that. If your plan requires ten perfect dominoes to fall, we need to see why *this specific domino* won’t topple. If it relies on a cascade of unprecedented breakthroughs, tell us why *this* team triggers it.  
  3.  **We demand humility about probabilities.** Nobody gets to say ‘this has a 0.0001% chance of saving humanity, so fund me.’ Tell us *how* you estimated that number. Show us the comparison cases. Admit the unknowns. A credible ‘long shot’ acknowledges the shot is long.

  **What this costs us:**  
  This filter *will* make us miss some true positives. We might reject a real universe-saving project because its logic felt too fragile. That’s the price of not being mugged. We accept that cost because the alternative — funding every cosmic lottery ticket — makes us useless. We’re not here to chase every will-o’-the-wisp. We’re here to find the long shots where the *pathway*, however narrow, feels *uniquely plausible*. Where the team shows us why *this* crazy bet, against the odds, has a fingerprint of reality.

  **So today, hold every pitch to this:**  
  *   **Does the scale of the claim match the depth of the scrutiny?**  
  *   **Does the team confront the real fragility of their plan?**  
  *   **Do they earn our trust in the face of cosmic stakes?**

  Let’s find the sparks in the fog — the ones that might actually be fire."

  ---

  ### Why this works
  - **Acknowledges the LW crowd’s framework** ("leverage penalty," fragility, cosmic stakes) without lecturing. They’ll recognize the move but appreciate it’s operationalized.
  - **Gives donors concrete handles** ("show us the weakest link," "penalize leverage," "demand humility") without math or jargon.
  - **Owns the trade-off:** Explicitly states rejecting true positives is the cost of avoiding muggings. No false comfort.
  - **Centers the foundation’s mission:** Framed as protecting *their purpose* from self-sabotage.
  - **Practical & testable:** The "Burden of Extraordinary Claims" rule is a checklist usable *during pitches*.
  - **Human tone:** Uses metaphor ("sparks in the fog"), direct questions, and active language ("Show us...", "Tell us...").

  This sets the stage for rigorous, mission-aligned debate. The LW half sees a defensible heuristic; the donor half sees a shield against nonsense; both see a tool to use *now*.
