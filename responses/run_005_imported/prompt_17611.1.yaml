prompt: |-
  Ok so for my intro to ethics elective (we just started the Kant unit) our teacher gave us this excerpt from the start of the Groundwork for homework and I got kinda stuck on it, ended up bringing it up at lunch and none of my friends could agree on what it actually means either lol. Here's the bit, this is the Abbott translation, it's the one in our reading packet:

  "Nothing in the world—indeed nothing even beyond the world—can possibly be conceived, which could be called good without qualification, except a good will... Even if it should happen that, owing to special disfavour of fortune, or the niggardly provision of a step-motherly nature, this will should wholly lack power to accomplish its purpose, if with its greatest efforts it should yet achieve nothing, and there should remain only the good will (not, to be sure, a mere wish, but the summoning of all means in our power), then, like a jewel, it would still shine by its own light, as a thing which has its whole value in itself. Its usefulness or fruitlessness can neither add to nor take away anything from this value."

  I think I get the basic gist, like Kant's saying a good will is worth just as much even when bad luck (he calls it "fortune" and "step-motherly nature") stops it from actually accomplishing anything good in the world. My teacher mentioned that this passage is basically Kant trying to make morality "luck proof," and that its the setup for a whole debate called moral luck we're covering next week (Bernard Williams and some other guy, Nagel i think?), but she wouldnt explain more since apparently that's "next week's lesson." So could someone break down what Kant's actually claiming here line by line, especially the jewel part? And also, even if I grant that a good will keeps its value no matter whether it accomplishes anything, isn't there a sneakier way luck gets back in — like whether you even HAVE a good will in the first place (instead of just being a selfish jerk) seems like it's majorly down to your upbringing/temperament/whatever, none of which you picked either. Does that count as the same kind of luck Kant's trying to rule out, or is that a totally different problem the moral luck people are actually talking about? I don't wanna just repeat "good will = good regardless of consequences" in my response paper without getting why anyone would push back on it, so an actual explanation would help a lot.
