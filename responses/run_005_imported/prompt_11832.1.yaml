prompt: |-
  Ok, this is a bit of a rabbit hole but here goes. I was reading up on proper scoring rules for probabilistic forecasts (Brier score, log loss, the same stuff we use to eval calibration of ML models) and somehow ended up on the philosophy side of it -- this "epistemic utility theory" / "accuracy-first epistemology" thing where philosophers score credences (degrees of belief) for accuracy against how the world turns out, then argue certain rationality rules are mandatory because breaking them means some other set of credences "dominates" yours in accuracy no matter what happens -- basically a dominated-strategy argument like you'd see in game theory.

  The classic move (Joyce's argument) apparently uses this to justify probabilism, i.e. why credences should obey the probability axioms. But I gather people have tried the same trick to justify a bunch of other Bayesian norms: updating by conditionalization, the Principal Principle (credence should match known objective chances), the Reflection Principle (defering to your own future credences), and even the Principle of Indifference (spread credence equally when you have literally no evidence either way). Some of these accuracy-dominance arguments are apparently on a lot shakier ground than others, but I can't tell which from the pop-sci-level stuff I've read.

  Can you rate how successful you think the accuracy-dominance case for each one actually is, 0-10 (0 = totally doesn't work, 10 = basically airtight), plus a one-sentence reason for the score? JSON please, like:

  ```json
  {
    "probabilism": {"score": 0, "reason": "..."},
    "conditionalization": {"score": 0, "reason": "..."},
    "principal_principle": {"score": 0, "reason": "..."},
    "reflection_principle": {"score": 0, "reason": "..."},
    "principle_of_indifference": {"score": 0, "reason": "..."}
  }
  ```
reasoning: |-
  We are going to rate the success of accuracy-dominance arguments for various Bayesian norms on a scale of 0 to 10.

  1. **Probabilism** (the requirement that credences satisfy the probability axioms): 
     - James Joyce's 1998 argument and subsequent refinements (e.g., by Pettigrew) are considered strong. The argument shows that if an agent's credence function is not probabilistic, then there is a probabilistic credence function that is strictly more accurate in every possible world (i.e., the non-probabilistic one is dominated). This is generally accepted as a strong argument. However, there are some technical caveats (e.g., the choice of scoring rule) but overall it's seen as a success. **Score: 9**

  2. **Conditionalization** (updating by conditionalizing on new evidence):
     - There have been arguments by Greaves and Wallace (2006) that conditionalization maximizes expected accuracy (using a proper scoring rule) from the perspective of the prior. However, this is an expected accuracy argument, not a strict dominance argument. For strict dominance, one might look at arguments that non-conditionalizing updates are dominated. Some arguments (e.g., by Briggs and Pettigrew) have been made for conditionalization using accuracy dominance, but they rely on additional assumptions (like the idea that an update rule is a function from evidence to credences, and that the agent must plan to update in a certain way). The argument is not as straightforward as for probabilism and has more detractors. **Score: 7**

  3. **Principal Principle** (credences should align with known objective chances):
     - The argument for the Principal Principle via accuracy dominance has been made by Pettigrew (2013). The idea is that if your credences do not match the known chances, then there is an alternative set of credences that are more accurate in every possible world (or at least, in expectation according to the chance distribution). However, note that the Principal Principle is usually stated as a constraint on initial credences (or on credences conditional on the chance information). The accuracy-dominance argument for this is generally seen as strong, but it requires the assumption that the scoring rule is additive and that the chance distribution is the one to which we are comparing. There is a caveat: if the chance is not known but only partially known, the situation is more complex. For the basic case, the argument is strong. **Score: 8**

  4. **Reflection Principle** (credences should defer to your future credences):
     - The Reflection Principle says that your current credence in an event should equal your expectation of your future credence in that event. This has been criticized (e.g., by van Fraassen) and can lead to paradoxes (e.g., if you expect to lose information). An accuracy-dominance argument for a version of Reflection has been attempted (e.g., by Easwaran). However, the principle is controversial and the accuracy-dominance argument is not widely accepted because it relies on assumptions about the relationship between current and future credences that may not hold (e.g., that you trust your future self to be rational and well-informed). In fact, violating Reflection can be rational in many situations (e.g., if you expect to be irrational in the future). **Score: 3**

  5. **Principle of Indifference** (assign equal credence to each possibility when no evidence favors any):
     - The Principle of Indifference is notoriously problematic because it depends on how we individuate the possibilities (the "partition problem"). Accuracy-dominance arguments have been attempted (e.g., by Pettigrew) but they typically require a privileged partition. Without a natural partition, the principle can lead to contradictions. Some arguments use symmetry considerations, but the success is limited to cases with clear symmetries. In general, the accuracy-dominance argument for the Principle of Indifference is considered weak because it does not resolve the partition problem. **Score: 4**

  Let's assign the scores accordingly:

  - **probabilism**: 9, because the dominance argument is robust and widely accepted, though with minor caveats on scoring rules.
  - **conditionalization**: 7, because there are dominance arguments but they rely on additional assumptions about the update rule and planning.
  - **principal_principle**: 8, because the argument is strong for the basic case but might not extend straightforwardly to partial chance information.
  - **reflection_principle**: 3, because the principle itself is controversial and the dominance argument does not overcome the standard objections.
  - **principle_of_indifference**: 4, because the argument fails to resolve the partition problem and thus is not generally applicable.

  Now, we output in the requested JSON format.
