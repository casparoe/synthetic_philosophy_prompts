  ### Key Insights:
  1. **Probabilism** scores highest due to Joyce's 1998 theorem and Pettigrew's refinements showing non-probabilistic credences are *strictly dominated* under any strictly proper scoring rule. Remaining caveats involve infinite cases or scoring rule choices.

  2. **Principal Principle** arguments (e.g., Pettigrew 2013) work well when objective chances are fully known, but dominance weakens when chances are underspecified or when combined with evidential constraints.

  3. **Conditionalization** arguments (e.g., Greaves & Wallace 2006) require assuming:  
     - Ex-ante commitment to update rules  
     - Additive scoring rules  
     - No self-undermining evidence  
     These idealizations reduce robustness.

  4. **Reflection** faces fatal counterexamples (e.g., expected memory loss or anticipated irrationality), where dominating alternatives exist that deliberately *disregard* future credences.

  5. **Indifference** arguments collapse under the **partition relativity problem**: Different symmetry assumptions yield incompatible dominant distributions (e.g., cube vs. volume parameterization), with no accuracy-based justification for privileging any partition.
