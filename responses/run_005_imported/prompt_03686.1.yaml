  The argument is that by adopting resolute choice, the agent is effectively evaluating entire sequences, which necessitates transitive preferences over outcomes. So the resolute strategy works only if the agent has a transitive ranking of the plans, which contradicts the claim that cyclical preferences are permissible. Even if the agent doesn't have a utility function, preferring plan X to plan Y and plan Y to plan Z implies transitivity in the plans.

  Another point: the user mentioned that avoiding exploitation is a thinner achievement than justifying cyclical preferences as rational. So even if resolute choice avoids the money pump, it doesn't show that the preferences themselves are rational; it just shows a way to manage the irrationality. The underlying preferences are still inconsistent, and the agent has to use self-binding or commitment to avoid acting on them, which acknowledges the problem.

  I also need to address the diachronic rationality aspect. Resolute choice requires the agent to follow through on a past plan even when current preferences dictate otherwise. But if rationality is synchronic, then at each moment, the rational action is to maximize current preferences. Sticking to a past plan that conflicts with current preferences is irrational at that time. Proponents of resolute choice argue that rationality should account for the whole timeline, but that might be contentious.

