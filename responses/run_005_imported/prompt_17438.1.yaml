  They've studied both main solutions - Garber/Jeffrey's logical learning approach and Howson's counterfactual strategy - but remain unsatisfied. What's really troubling them is Howson's later self-criticism that his own counterfactual method smuggles in "objective" probabilities alien to subjectivism. The user wants me to argue this critique actually dooms both solutions by revealing a deeper flaw: that any escape from the problem must import non-subjectivist notions of evidence.

