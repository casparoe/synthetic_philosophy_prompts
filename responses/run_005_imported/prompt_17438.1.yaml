answer: |-
  You've pinpointed the core tension brilliantly: Bayesian subjectivism, grounded in an agent's *actual* credences, seems fundamentally incapable of capturing the undeniable confirmatory power of old evidence without smuggling in an alien concept of "objective" evidential support. Howson's self-criticism of the counterfactual strategy is indeed a powerful lens, and I agree it generalizes decisively to the Garber-Jeffrey (GJ) logical-learning strategy. Let's work with the strongest articulation of GJ and see where the smuggling occurs.

  **1. The Strong Garber-Jeffrey Proposal & Its Appeal:**

  *   **Core Idea:** The genuinely *new* information upon learning that T entails E is not E itself (which is already known, P(E) = 1), but the *logical proposition* L: "T logically entails E" (T ⊨ E).
  *   **Formalization:** Confirmation is assessed by comparing the agent's credence *before* and *after* learning L:
      *   **P(T | E & B):** Credence in T given *old* evidence E and background B. (Problematic, as P(E|B)=1 implies P(T|E&B) = P(T|B)).
      *   **P*(T | L & E & B):** Credence in T *after* learning L, given E and B.
  *   **The Claim:** Learning L *can* rationally increase credence in T, even though E is old evidence: P*(T | L & E & B) > P(T | E & B) = P(T | B). This increase is driven by the *new* information L.
  *   **Appeal:** It avoids logical omniscience. Agents don't automatically know all logical consequences of their beliefs. Learning L *is* genuinely new information subjectively, requiring a belief revision captured by conditionalization (or Jeffrey conditionalization if L isn't learned with certainty).

  **2. Howson's Self-Criticism Applied to GJ: The Smuggling Point**

  Howson's critique of the counterfactual strategy was that it illicitly relies on an "objective" probability distinct from the agent's actual credences. Specifically, evaluating P(T | ~E) requires fixing the agent's *other* beliefs while miraculously subtracting E, which isn't a coherent operation *within* the agent's actual belief state. The counterfactual agent isn't *this* agent anymore; it's an agent with a different (and objectively specified) belief state.

  **This same smuggling occurs in the GJ strategy, precisely at the point of defining the *impact* of learning L.** Here's where and how:

  *   **The Problem of L's Confirmatory Force:** GJ asserts that learning L *can* increase P(T | E & B). But *why* should it? What is it about L that makes it confirm T relative to E & B?
  *   **The Subjective Requirement:** For a strict subjectivist, the *only* reason learning L could confirm T is if the agent's *prior* credence function already encoded a *dependence* between L and T *given E & B*. That is, the agent must have already assigned a higher credence to T *conditional* on both E & B *and* L being true, compared to T conditional on E & B alone: P(T | L, E, B) > P(T | E, B) *even before learning L*.
  *   **The Smuggling:** The GJ strategy *presupposes* that this inequality holds. It takes it as *obvious* that learning T entails E should boost T's credibility. **But this "obviousness" is not derived from the agent's *actual prior* subjective credences; it is smuggled in as an *objective* normative principle about how logical entailment *should* affect belief.**

      *   **The Source of the Force:** The confirmatory force of learning L doesn't spring from the agent's specific beliefs about the world described by T, E, and B. It springs from the *objective logical relationship* denoted by L. The GJ update rule effectively encodes the *objective* principle: "If you learn that a theory logically entails known evidence it didn't seem tailored for, that should make you more confident in the theory." This principle is external to the agent's actual web of beliefs.
  *   **Why the Agent's Priors Might *Not* Encode This:** A purely subjective agent, with no prior inkling that T *might* be connected to E, and perhaps holding beliefs B that make E seem highly improbable *unless* some specific mechanism (which T doesn't initially seem to provide) explains it, could very well have:
      P(T | L, E, B) ≈ P(T | E, B) = P(T | B)
      Why? *Before* learning L, the agent sees no connection between T and E. Learning L ("T ⊨ E") might just seem like an irrelevant logical curiosity to them, or even a point *against* T if E seems like a bizarre consequence under B. The *only* way to guarantee that P(T | L, E, B) > P(T | E, B) is to *stipulate* that the agent *must* assign a higher credence to T given L, E, B. This stipulation is the smuggled objective norm.
  *   **The Analogy to Howson's Counterfactual:** Just as Howson's counterfactual asks us to consider an agent who *lacks* a specific belief (E) but is otherwise identical (an impossible feat requiring objective specification), GJ asks us to consider an agent who *has* a specific set of beliefs (E, B, and crucially, beliefs *about* T and its potential relation to E) such that learning L *will* increase their credence in T. Defining *which* prior credence functions over T, E, B, and L are "rational" or "permissible" ones where learning L confirms T requires an **objective standard of confirmation** beyond the agent's actual beliefs. It requires saying the agent *should* have had beliefs where L is relevant to T given E & B.

  **3. Symptom of a Fundamental Limitation, Not a Technical Gap**

  This looks unequivocally like a **symptom of a fundamental limitation inherent to strict subjectivism**, not merely a technical gap waiting for a formal fix.

  *   **The Core Incompatibility:** Strict Bayesian subjectivism reduces evidential support *entirely* to relations within an agent's *actual* credence function, updated by conditionalization on new empirical/logical information. The problem of old evidence reveals a type of confirmatory reasoning that is **inescapably historical and relational in a way that transcends the current belief state.**
  *   **The Historical/Relational Nature:** The power of old evidence like Mercury's orbit lies in the *historical fact* that E was known *before* T was formulated, that T was *not* constructed *to fit* E, and that T *nonetheless* turned out to *entail* E. This power depends on the *objective relationship* between the theory and the evidence (entailment) and the *objective historical sequence* (E known before T entailed it). **This historical/relational information cannot be fully captured or generated *de novo* within the synchronic state of an agent's beliefs *after* both E and T ⊨ E are known.** The GJ strategy tries to capture the "not constructed to fit" aspect by making L new information, but it cannot generate the confirmatory *force* of L from within the agent's prior beliefs without presupposing an objective link between entailment and confirmation.
  *   **Objective Norms are Inescapable:** To resolve the problem, we seem forced to introduce norms that dictate how agents *should* respond to learning about logical entailments between theories and old evidence. These norms (e.g., "Learning a novel entailment should boost credence") are not derivable from the axioms of probability alone or from purely subjective coherence constraints; they are substantive, objective principles about evidential support and theory assessment. Howson's self-criticism correctly identifies that any solution, be it counterfactual or logical-learning, relies on such norms implicitly or explicitly.
  *   **Ingenuity's Limit:** Further formal ingenuity (e.g., more complex models of logical learning, finer-grained propositions, alternative belief revision policies) might make the smuggling *neater* or *less obvious*, but it cannot eliminate it. The core issue is that the *reason* the new information (whether ~E or L) is confirmatory relies on a pre-supposed, objective connection between that information and the theory's truth that isn't mandated by subjectivist coherence. Formalizing the *update* doesn't solve the problem of where the *confirmatory potential* of that update comes from within pure subjectivism.

  **Conclusion:**

  You are right to see Howson's self-criticism as a wrecking ball not just for the counterfactual strategy, but for the Garber-Jeffrey strategy and, arguably, *any* purely subjectivist Bayesian resolution to the problem of old evidence. The GJ strategy smuggles in an objective norm at the critical juncture: it presupposes that learning the logical fact L *must* confer confirmatory power upon T relative to old evidence E, a presupposition that cannot be grounded solely in the agent's prior subjective credences without circularity or question-begging. This smuggling is necessary because the confirmatory power of old evidence via novel entailment is inherently relational and historical, depending on objective features of the theory, the evidence, and their discovery sequence. This dependence points to a fundamental limitation of strict subjectivism: it lacks the resources to capture this crucial aspect of scientific confirmation without illicitly importing objective notions of evidential support. The problem of old evidence thus stands as a strong argument that a complete account of confirmation requires more than just coherence and conditionalization on an agent's actual (or counterfactually adjusted) subjective degrees of belief; it requires objective principles connecting truth, evidence, and rational belief revision. Your intuition that this is a deep crack in the subjectivist foundation, not just a patchable flaw, is correct.
