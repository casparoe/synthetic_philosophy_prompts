  First, I need to recall the Newman objection. It argues that ESR's commitment to only knowing structures leads to triviality because any set of objects can satisfy a structure if cardinality matches. So ESR's claim becomes almost empty. The user is aware of this but questions if OSR's move to eliminate relata fixes this.

  OSR proponents like Ladyman and French argue that without independent relata, structures aren't just describing relations but are the fundamental ontology. So in quantum mechanics, particles aren't individuals; they're nodes in a structure. But does this avoid Newman? The user's worry is that structure itself might need relata, leading to a regress.

  I should compare both positions. For ESR, Newman shows that specifying structure without fixing the relata's nature makes the claim trivial. OSR tries to avoid this by making structures ontological primitives. But critics like Psillos might say that structures still require some underlying entities, reintroducing the problem.

