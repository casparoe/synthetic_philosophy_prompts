  But wait - is that distinction airtight? Couldn't one argue that Frege's logicism carries its own political ontology? The user might be hinting at that when they ask if we should read Frege more suspiciously. Still, the burden of proof seems higher there. Frege's system has been stress-tested for over a century without those views surfacing in the machinery, while Heidegger's ambiguities practically invite hermeneutic suspicion. 

  The user also seems troubled by the Dummett dimension - that moment of personal disillusionment when biography intrudes. That's where I should emphasize the methodological point: it's not about giving thinkers "benefit of the doubt" but about whether their concepts structurally require contextual reading. 

  For the seminar, maybe I should suggest framing the asymmetry as a case study in philosophical genres. Frege writes like a mathematician; Heidegger like a poet. Their texts demand different interpretive contracts. The real test would be: if we found anti-Semitic marginalia in Frege's Begriffsschrift drafts, would it matter? Probably not. But Heidegger's notebooks are part of his philosophical performance. 

  ...Though now I'm second-guessing. What about Frege's "Volk" comments in his unpublished essays? There might be a middle ground where even formal systems have ideological subtexts. But pushing that too far risks conflating all philosophy with biography, which the user seems wary of. 

  The conclusion should probably stress that the asymmetry isn't hypocrisy but reflects coherent (if debatable) principles about textual autonomy. The seminar handout could have students apply this to other thinkers - say, Wittgenstein's coded diaries versus Carl Schmitt's explicit jurisprudential Nazism.
answer: |-
  Your comparison between Frege and Heidegger cuts to the heart of debates about philosophical method and the ethics of interpretation. The asymmetry in their treatment stems from substantive differences in the nature of their philosophical projects and the relationship between their core doctrines and their political commitments—not merely disciplinary biases. Here’s a principled framework for the distinction:

  ### **Core Differences Justifying the Asymmetry**
  1. **Systemic Architecture vs. Existential-Historical Concepts**  
     - **Frege**: His logicism aims for acontextual truths. The *sense/reference* distinction, quantification theory, and logicist program are **formally autonomous systems**. They function independently of contingent beliefs because they are designed to be *universal syntactic-semantic structures*. Anti-Semitic views cannot "contaminate" the truth-functional relationships in *Begriffsschrift* any more than Newton’s alchemy invalidates calculus.  
     - **Heidegger**: Concepts like *historicity*, *destiny*, and *authenticity* are **ontologically embedded in concrete existence**. *Being and Time* explicitly roots Dasein’s being-in-the-world in *temporal and communal situatedness*. When Heidegger later writes of the "historical destiny of the German people" or critiques "world Jewry" in the *Black Notebooks*, these ideas directly engage with his philosophical framework’s core categories.  

  2. **Methodological Impersonality vs. Hermeneutic Subjectivity**  
     - **Frege** champions *anti-psychologism*: Logic transcends individual minds. His system’s validity depends on its formal coherence, not the thinker’s biography.  
     - **Heidegger**’s method is *hermeneutic-phenomenological*: Understanding emerges from the interpreter’s historical horizon. His politics become inseparable from his philosophy because his later work (e.g., *Contributions to Philosophy*) frames Nazism as a misguided but existentially significant response to the "forgetting of Being."  

  3. **Doctrinal Silence vs. Conceptual Overlap**  
     - **Frege**’s diary expresses bigotry but contains **no logical arguments** derived from or applied to those views. His technical work never invokes race, nation, or democracy.  
     - **Heidegger**’s politics are **philosophically articulated**: The *Rectoral Address* deploys his ontology of *resoluteness* to endorse Nazi revolution. The *Black Notebooks* link "machination" and "race" to his critique of modernity’s "abandonment by Being."  

  4. **Epistemic Boundaries**  
     - Frege’s logic/mathematics claims **epistemic invariance**: True regardless of context.  
     - Heidegger’s ontology claims **contextual profundity**: Meaning arises from historical engagement. Thus, his political engagements become hermeneutically relevant.  

  ---

  ### **Is the Asymmetry Defensible?**  
  **Yes**, on these grounds:  
  - **Frege’s insulation is justified** because his technical work operates at a level of abstraction where biographical context adds no explanatory power. The *Grundgesetze*’s collapse from Russell’s paradox owes nothing to anti-Semitism.  
  - **Heidegger’s entanglement is unavoidable** because his philosophy thematizes historical embeddedness. When he politicizes *Ereignis* (event of appropriation) or *Volk* (people), it forces a reckoning with whether his ontology harbors exclusionary tendencies.  

  ---

  ### **Implications: Toward a Consistent Approach**  
  This comparison **does not require** reading Frege more suspiciously or Heidegger more charitably. Instead, it demands a case-specific assessment:  
  - **For Frege**: Maintain doctrinal insulation but scrutinize *implicit metaphysical commitments*. Example: Does his logicism’s Platonism harbor authoritarian tendencies? (Critics like David Bell suggest so, but this remains marginal to his *technical* legacy.)  
  - **For Heidegger**: Continue contextual critique but **resist reductionism**. Not every concept (*das Man*, care-structures) is tainted, but those explicitly politicized (*destiny*, historicity) demand interrogation.  

  ---

  ### **Seminar Handout Suggestion**  
  **Title**: *Biography, Doctrine, and the Bounds of Philosophical Relevance*  
  **Core Question**: *When does a philosopher’s life compromise their work?*  
  | **Criterion**               | Frege                          | Heidegger                     |  
  |-----------------------------|--------------------------------|-------------------------------|  
  | **Project Type**            | Formal-systemic                | Hermeneutic-existential       |  
  | **Political Expression**    | Private (diary)                | Public-philosophical (essays) |  
  | **Conceptual Overlap**      | None                           | Direct (historicity/destiny)  |  
  | **Doctrinal Vulnerability** | Immune (syntax/semantics)      | Permeable (being-in-the-world)|  

  **Discussion Prompt**: *"Could Frege’s logic have been developed by someone without his bigoted views? Could Heidegger’s ontology?"*  

  This framework avoids relativism while acknowledging that philosophy’s *methods* dictate biography’s relevance. The asymmetry persists not out of tribal loyalty but because Frege’s work abstracts from life, while Heidegger’s immerses itself in it.
