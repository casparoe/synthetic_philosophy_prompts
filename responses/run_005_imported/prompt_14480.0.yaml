answer: |-
  You've engaged with profoundly difficult material at a remarkably sophisticated level. Aquinas, encountering the Hart-Fuller debate, would resolve both questions decisively—though not simplistically—by applying his core principles from the *Summa Theologiae* (I-II, Q.90-97). Here's the reconstruction:

  1.  **On the Validity of the Nazi Statute & the Grudge Informer Case: Aquinas Sides Decisively with Fuller (but for his own reasons).**
      *   **Why:** For Aquinas, law (*lex*) has a **specific, non-negotiable definition**: "an ordinance of reason for the common good, made by him who has care of the community, and promulgated" (ST I-II, Q.90, A.4). A purported statute that fundamentally violates *reason* and the *common good* fails to be law at all; it is, as he states explicitly, "a perversion of law" and "an act of violence" (ST I-II, Q.92, A.1, ad 4; Q.95, A.2; Q.96, A.4).
      *   **Application to the Case:** The Nazi statute enabling denunciation for private disloyalty (especially within marriage) and leading to execution for mere speech *fundamentally violates natural law*. It is irrational (commanding betrayal of fundamental human bonds), contrary to the true common good (which requires justice and peace based on natural order), and likely promulgated by a regime exceeding its legitimate authority (as it commands intrinsic evil). Therefore, **Aquinas would rule that this statute was *never valid law*.** It was an act of violence masquerading as law.
      *   **Addressing Hart & the "Outward Compliance" Point:** Aquinas *does* acknowledge (ST I-II, Q.96, A.4) that sometimes one must *outwardly comply* with unjust commands to avoid "scandal or disturbance" *if* the command, while unjust, doesn't command something intrinsically evil (e.g., an unfair tax). **Crucially, he draws a bright line:** "Laws of this kind... do not bind in conscience, except perhaps in order to avoid scandal or disturbance, for which cause a man should even yield his right... *unless* they are contrary to the Divine good." (ST I-II, Q.96, A.4). Statutes commanding intrinsic evils like murder (including judicial murder based on private denunciation for speech) *are* contrary to the Divine good/natural law. **Compliance with intrinsically evil commands is never morally permissible, and such commands categorically fail to be law.** Hart's separation ("It's valid but too wicked to obey") collapses for Aquinas because validity *requires* minimal moral rationality directed to a true common good. This statute lacked it.

  2.  **On Fuller's "Inner Morality of Law": Aquinas Recognizes its Value but Judges it as Necessary yet Insufficient – It's Too Thin.**
      *   **Agreement on Necessity:** Aquinas would see Fuller's eight principles (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between declared rule and official action) as essential aspects of the *rationality* and *promulgation* required by his own definition of law. A "law" that is secret, retroactive, impossibly vague, contradictory, or utterly disregarded by officials *is irrational*. It fails to guide action reasonably, violating the very essence of law as an "ordinance of *reason*." Aquinas states that for law to achieve its end (guiding to virtue/good), it must be "possible both according to nature, and according to custom, and proportioned to the person" (ST I-II, Q.96, A.2, ad 2) – echoing Fuller's concern for possibility of compliance. He would agree that such procedural failings render an enactment defective *as law*.
      *   **The Crucial Disagreement – Substance over Procedure:** However, Aquinas would find Fuller's framework radically incomplete. **For Aquinas, the "common good" is not a neutral procedural container; it has substantive moral content derived from natural law.** A statute could perfectly fulfill all eight of Fuller's principles yet command something intrinsically evil (e.g., genocide based on clear, public, prospective, non-contradictory rules administered consistently by officials). For Fuller, this might arguably still be "law" (albeit utterly wicked). **For Aquinas, it categorically fails.** His requirement that law be "for the *common good*" inherently includes substantive justice – respecting fundamental human goods (life, family, knowledge, sociability), rendering to each their due (*suum cuique*), and promoting true human flourishing (*beatitudo*), not just social order. A procedurally impeccable law commanding the betrayal of one's spouse for execution violates the common good at its core and thus fails Aquinas' definition. Fuller's procedural morality is a vital *part* of the "rationality" requirement, but only a part. The substantive end (*telos*) of law – true justice and the real common good – is indispensable.

  **Conclusion:**

  1.  **Validity:** Aquinas would side **with Fuller**. The Nazi grudge informer statute, commanding intrinsic evil contrary to natural justice and the true common good, was **not valid law** but an act of violence. Hart's separation of validity from minimal moral content is incompatible with Aquinas' definition. The "outward compliance" caveat does not apply to intrinsically evil commands.
  2.  **Fuller's Procedural Morality:** Aquinas would recognize Fuller's principles as **necessary components** of the rationality inherent in law, aligning with parts of his own definition (reason, promulgation). However, he would judge Fuller's framework as **fatally insufficient** because it lacks the substantive moral core – the requirement that law be ordered towards the *true common good* as understood by natural law – which is essential for Aquinas. Fuller's is a partial, modern procedural *fragment* of Aquinas' thicker, teleological natural law conception, not its full equivalent.

  Aquinas would thus affirm Fuller's conclusion on the invalidity of the Nazi statute but ground it more deeply in substantive natural law, while simultaneously finding Fuller's *general* theory of the "inner morality of law" inadequate precisely because it stops at procedure and fails to encompass the substantive demands of justice and the true common good.
