  First, I need to recall Aquinas' key principles. His definition of law (lex) in Summa Theologiae I-II, Q.90 is crucial: law must be reasonable, for the common good, made by legitimate authority, and promulgated. Unjust laws that fail these aren't laws but acts of violence. But there's nuance—Aquinas allows compliance with unjust laws to avoid greater harm. 

  The user wants definite answers on two points: whether Aquinas would side with Fuller or Hart on the Nazi statute's validity, and whether Fuller's procedural natural law aligns with Aquinas' thicker substantive requirements. 

  For the first question, Hart's positivism separates law's validity from morality. Fuller argues that extreme injustice invalidates law. Aquinas would agree with Fuller that the Nazi statute isn't valid law because it's irrational and against the common good. But he'd also acknowledge Hart's point about compliance to prevent disorder. However, in the grudge informer case, since the law itself was fundamentally unjust, Aquinas wouldn't consider it law. 

  On the second point, Fuller's eight procedural principles are necessary but not sufficient for Aquinas. He'd see them as part of the "rationality" requirement but would insist that laws must also aim at true common good, which includes moral ends. So Fuller's framework is too thin for Aquinas. 

  The user's deeper need might be clarity after personal study. They want authoritative resolution to their internal debate. They might also seek validation of their hunches about Aquinas' applicability to modern legal theory. Ensuring the response is accessible without jargon is key, given their background. 

