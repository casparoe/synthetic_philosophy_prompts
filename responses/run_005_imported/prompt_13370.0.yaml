answer: |-
  You're absolutely right to question the "Peirce beat Popper to it" claim. While both grapple with demarcating science from non-science and emphasize the role of *reality* checking our beliefs, their core criteria and underlying philosophies are fundamentally different. A point-by-point comparison reveals crucial distinctions:

  1.  **Core Demarcation Criterion:**
      *   **Peirce (Fixation of Belief):** Demarcation rests on the **method used to fix belief** and its **relationship to an "external permanency" (reality)**. Science is defined by its *method*: actively seeking out experiences *forced upon us* by this external reality, which, through the *long run of inquiry*, compels *convergence* of belief among all investigators. The key is the *process* and its *telos* (end goal - convergence with reality).
      *   **Popper (Falsifiability):** Demarcation rests on the **logical structure of the theory itself**. A theory is scientific if and only if it is *logically possible* to conceive of empirical observations or experiments that would *refute* it (i.e., it is falsifiable). The key is a *logical property* of the statement/system.

  2.  **Role of "External Permanency" (Reality):**
      *   **Peirce:** The "external permanency" is the *active agent* and the *guarantor of convergence*. Reality *impresses* itself upon us through experience ("surprise," resistance to expectation). Scientific method is the *way* we submit ourselves to this external constraint. Convergence *is* truth.
      *   **Popper:** Reality is the *arbiter* of falsification. A theory makes predictions; if observations contradict these predictions *and* we accept the observations, the theory is falsified. However, Popper offers *no guarantee* of convergence or ultimate truth. We can never *verify* a theory, only falsify it or fail to falsify it yet. Truth (in a correspondence sense) is an ideal we aim for but can never be sure we've reached.

  3.  **Convergence vs. Falsification:**
      *   **Peirce:** **Convergence is the defining feature and the *goal***. The scientific method *is defined* as the method that *will*, given enough time and investigation, lead *all* rational inquirers to the *same* conclusion because it's tethered to the external permanency. Falsification of specific beliefs is *part of the process* leading to convergence, but it's not the *definition* of science.
      *   **Popper:** **Falsification is the defining feature and the *engine***. Science progresses *by* conjectures and refutations. The *potential* for falsification defines the scientific character. Convergence is a *possible consequence* of successful falsification and new conjectures, but it's not guaranteed or inherent to the definition. A theory could be falsifiable but lead nowhere (or be consistently wrong).

  4.  **Nature of the Method/Process:**
      *   **Peirce:** Focuses on the **community of inquirers over the long run**. Science is a *social, self-correcting process* driven by the resistance of reality. It's inherently fallibilistic (admits error) but optimistic about ultimate convergence. The method involves abduction (generating hypotheses), deduction (predicting consequences), and induction (testing).
      *   **Popper:** Focuses on the **logical relationship between a theory and potential basic statements (observations)**. While he acknowledges the importance of critical discussion (a social element), the *demarcation criterion itself* is logical and applies to the theory/statement *in isolation*. The process is critical rationalism: bold conjectures, severe tests.

  5.  **Handling the "A Priori Method" (and similar):**
      *   **Peirce:** Explicitly **rejects the a priori method as unscientific** (as quoted). Why? Not primarily because its propositions are unfalsifiable *per se*, but because it relies on "taste" and "fashion," leading to endless pendulum swings *without convergence*. It fails to be tethered to the external permanency. It's just a more sophisticated version of tenacity/authority. *Astrology* would likely fail for Peirce not because its claims are *inherently* unfalsifiable (some might be testable in principle), but because its *method* doesn't genuinely submit to external reality in a way that *forces* convergence; believers can always reinterpret or ignore counter-evidence.
      *   **Popper:** **Rejects the a priori method as unscientific** because its core propositions (e.g., "Reason dictates X") are typically *unfalsifiable*. There is no conceivable observation that could refute what someone claims is "agreeable to reason." Similarly, *astrology* is unscientific because its core claims (e.g., planetary positions determining personality/events) are either unfalsifiable or have been falsified, but its proponents protect the core theory with ad-hoc auxiliary hypotheses that themselves are often unfalsifiable.

  6.  **Handling Probabilistic/Historical Sciences:**
      *   **Peirce:** His criterion **accommodates them well**. Sciences like evolutionary biology or geology rely on inference to the best explanation based on traces of the past. They use a method tethered to an external permanency (fossils, strata, DNA) and aim for convergence among investigators, even if direct experimental falsification of the *singular historical event* isn't possible. The *process* of inquiry and convergence defines them as scientific.
      *   **Popper:** This was a **challenge** for strict falsifiability. How do you falsify a unique historical claim? Popper argued that such sciences *do* use falsifiable *auxiliary theories* or *general laws* (e.g., laws of physics, chemistry, genetics applied to fossils). A purely narrative account without testable implications would be unscientific. However, many feel this requires stretching the falsifiability criterion.

  **Conclusion: Drawing the Line Differently**

  *   **Peirce's Line:** Science is the **method of inquiry that submits beliefs to the test of an external reality, leading to the inevitable convergence of all investigators' conclusions over time.** Non-science (like the a priori method) lacks this tether to external constraint and thus fails to achieve convergence.
  *   **Popper's Line:** Science consists of **theories that make empirically testable predictions and are structured such that they can, in principle, be shown to be false by observation or experiment.** Non-science (like the a priori method or untestable astrology) consists of theories immune to empirical refutation.

  **Why "The Fixation of Belief" passage isn't just "falsifiability in 1870s dress":**

  Peirce is arguing for a *process* defined by its *source of constraint* (external permanency) and its *outcome* (convergence). Falsification is a *mechanism within that process*, but not its defining characteristic. Popper makes the *logical vulnerability to refutation* the defining characteristic itself, decoupled from any guarantee of convergence.

  **In short:** Peirce defines science by its *method and goal* (convergence via reality), while Popper defines it by a *logical property* of its statements (falsifiability). They share a deep commitment to empiricism and fallibilism, but their core demarcation criteria are distinct. Your instinct is correct – Peirce wasn't "beating Popper to falsifiability"; he was articulating a different, though profoundly influential, vision of scientific rationality centered on inquiry and community convergence. Popper's falsifiability is a sharper, more specific (though not without its own issues) logical criterion.
