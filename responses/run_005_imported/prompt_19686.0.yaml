  Bailey: But that's exactly where I think the model is smuggling in a belief revision policy. The second player, upon seeing an irrational pass, is forced to reconsider. But the model doesn't specify how beliefs are revised off the equilibrium path. Aumann's theorem assumes that even off the equilibrium path, the players continue to believe in rationality. But that's inconsistent because the pass is irrational. So the second player must give up either the belief that the first player is rational or the belief that the first player will play rationally in the future. And if they give up the latter, then they might think that the first player will pass again, so they might pass too. The theorem just assumes that the second player maintains the belief in the first player's rationality at later nodes, but that's not justified.

