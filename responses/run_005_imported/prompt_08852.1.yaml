  Also, Hume would point to entrenchment: green has millennia of associative strength, whereas grue is a philosopher's invention. Our minds default to entrenched predicates because they've consistently produced successful predictions. Grue-like predicates only emerge when we artificially manipulate concepts, which falls outside lived inductive practice.

