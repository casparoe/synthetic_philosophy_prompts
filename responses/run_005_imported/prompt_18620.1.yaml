  The core tension lies in how the buffered process relates to Jones's actual indeterministic deliberation. For the case to work, the backup must be triggered by—and only by—the absence of Jones's decision. But if Jones's decision is genuinely indeterministic, that absence isn't determined until the decision moment. So the backup's triggering condition must be sensitive to that indeterminism. 

  Aha! Here's the crack: if the buffered process is set to intervene when Jones doesn't decide by t2, but Jones's deliberation is truly open until t2, then until t2 arrives, it's not fixed whether the backup activates. That means at t1, Jones still retains the ability to decide otherwise and render the backup irrelevant. That's the "could have done otherwise" peeking through! 

  But the compatibilist might object: "No, if Jones chooses A, the backup does nothing!" Exactly—which pushes us into the other horn. To guarantee Jones can't avoid triggering the backup if he strays, the backup's activation must be causally necessitated by his non-A decision... which means his deliberation isn't free after all. It's the original dilemma in a new jacket: either Jones's choice remains open (making backup avoidable) or the backup's design presupposes determinism. 

