prompt: |-
  Ok so last night my friend and I spent like two hours arguing about Frankfurt cases and whether they actually kill the 'could have done otherwise' requirement on moral responsibility. I ran the classic dilemma move on her: the prior sign Black uses to predict what Jones will do is either causally sufficient for Jones's decision (in which case the setup just smuggles in determinism and begs the question against the incompatibilist), or it isn't (in which case there's still a real gap between the sign and the decision, so Jones could've decided otherwise after all). She came back with Mele & Robb's buffered cases -- no sign needed, the backup process just runs in parallel from the start, so theres nothing for the dilemma to grab onto. I didn't have a good response in the moment and its been bugging me since. Can you build the strongest possible case that the dilemma actually still bites even against the buffered version? I don't want the 101 recap of Jones and Black -- I want you to actually dig into how that backup process has to relate to Jones's own (indeterministic) deliberation for the case to work, and show why that relationship runs into the same either/or the original dilemma posed.
