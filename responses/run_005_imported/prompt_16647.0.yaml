prompt: |-
  I'm on the code-of-conduct committee for an open source project I contribute to (a couple hundred contributors, all volunteer-run). We've got a case that's split the committee and I need to draft the recommendation memo before Friday's call.

  One of our most active reviewers -- call him Dave -- has a history of brutal review comments (nothing threatening, just stuff like telling a first-timer their PR was "worse than the bug it fixed"), and a couple of quiet warnings already. This time the contributor quit and posted about it publicly, so now there's an actual formal complaint. The wrinkle: Dave disclosed he was diagnosed with autism last year and says it explains a lot of this -- he genuinely doesnt clock how a comment will land until its pointed out, and he's now in therapy about it. Half the committee wants to go easy on him because of this. The other half says that's backwards: if he genuinely can't self-monitor, that's exactly why he should be pulled off public review for good, not as punishment, just bc we can't keep losing contributors, however sympathetic the reason.

  Can you draft the actual memo? I need a real recommendation with concrete next steps and a timeline, not a "both sides have a point" cop-out -- and don't just paint the second camp as heartless, I think they're onto something too.
reasoning: |-
  We are writing a memo to the committee that presents a clear recommendation with concrete steps and a timeline. The goal is to balance the need for a welcoming community with the reality of Dave's situation. We acknowledge both perspectives but must make a decision that serves the project's best interests.

  Key points:
  - Dave is a valuable contributor but his communication style has repeatedly caused issues.
  - He has disclosed an autism diagnosis that affects his ability to gauge the impact of his words.
  - Previous quiet warnings have not resolved the problem.
  - The latest incident led to a contributor quitting and going public, which is damaging to the project.
  - The committee is split: one side wants leniency due to the diagnosis, the other side argues that the inability to self-monitor is precisely why he should be removed from public reviews.

  Recommendation:
  We cannot ignore the impact on the project and the community. While we are sympathetic to Dave's situation, the project's health must come first. Therefore, we recommend that Dave be temporarily removed from public review duties and provided with a structured support plan. If after a defined period of training and adjustments, he is able to demonstrate improved communication, he may return to reviews under supervision. If not, then we must make the removal permanent.

  Concrete Steps and Timeline:

  1. **Immediate Action (Within 24 hours of decision):**
     - Communicate the decision to Dave privately and compassionately. Explain that we value his contributions but must address the community impact. He will be temporarily removed from public review duties effective immediately. This is not a punishment but a necessary step for the project and for his own development.
     - Assign a mentor (or a small group of mentors) from the committee or trusted senior contributors to work with Dave on communication strategies. This mentor should have experience in code reviews and be sensitive to neurodiversity.

  2. **Training and Support Period (Next 4 weeks):**
     - Dave will work with the mentor(s) on communication skills, focusing on code review etiquette. This could include:
       - Reviewing past comments that caused issues and discussing alternative phrasing.
       - Role-playing scenarios.
       - Using templates or structured formats for reviews (e.g., starting with positives, then constructive feedback, then suggestions).
       - Training on neurodiversity-specific communication strategies (if available and with Dave's consent).
     - Dave may continue to contribute in non-public roles (e.g., working on internal tooling, documentation, or non-review coding tasks) during this period.

  3. **Supervised Review Period (Weeks 5-12):**
     - Dave may resume review duties but under supervision. Every review comment he writes must be approved by a mentor before being posted. The mentor will provide feedback on his comments and work with him to refine his approach.
     - This phase is intended to be a learning opportunity and a gradual reintegration.

  4. **Evaluation (Week 12):**
     - The committee, with input from the mentor(s), will evaluate Dave's progress. Criteria will include:
       - The number of incidents (if any) during the supervised period.
       - Feedback from contributors who received his reviews.
       - The mentor's assessment of Dave's ability to self-monitor and apply the strategies learned.
     - If the evaluation is positive, Dave will return to regular review duties without supervision. If there are concerns, we may extend the supervised period by 4 weeks. If there is no significant improvement, we will make the removal from public reviews permanent.

  5. **Ongoing:**
     - Regardless of the outcome, we will document this process (anonymized) as a case study to inform future CoC cases.
     - We will also consider implementing a mandatory code review communication training for all new reviewers to prevent similar issues.

  Rationale:
  - This approach acknowledges Dave's disclosure and provides support, but it also prioritizes the community's well-being.
  - It gives Dave a clear path to improve and return to reviews, but with the understanding that if the issues persist, the project cannot continue to bear the cost.
  - By having a structured plan, we are not simply reacting to the current incident but building a process that can help others.

  Memo Draft:

  ---

  **To:** Code of Conduct Committee  
  **From:** [Your Name/Committee Member]  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Contributor "Dave"  

  **Background:**  
  Dave, a highly active and valuable reviewer, has been the subject of multiple informal warnings due to the tone of his code review comments, which have been perceived as harsh and have led to contributors leaving. The most recent incident resulted in a formal complaint after a contributor publicly resigned. Dave has disclosed an autism diagnosis that he states affects his ability to anticipate how his comments will be received. He is currently in therapy addressing this.

  **Committee Perspectives:**  
  The committee is divided. Some members advocate for leniency and accommodation due to the diagnosis. Others argue that the inability to self-monitor communication impact, while understandable, is precisely why Dave should be permanently removed from public review duties to prevent further harm to the community.

  **Recommendation:**  
  We recommend a structured, time-bound plan that temporarily removes Dave from public review duties while providing targeted support and a clear path to potential reinstatement. This balances our duty to support contributors with the project's need to maintain a welcoming environment.

  **Proposed Plan:**  

  1. **Immediate Action (Within 24 hours of committee approval):**  
     - Dave will be temporarily removed from public review duties.  
     - A private, compassionate meeting will be held with Dave to explain the decision and the support plan.  
     - Assign two mentors (from a pre-approved list of senior contributors) to work with Dave.  

  2. **Training and Support (4 weeks):**  
     - Dave will engage in weekly sessions with mentors focusing on communication strategies.  
     - Dave may contribute in non-public roles during this time.  

  3. **Supervised Review Period (8 weeks):**  
     - Dave may resume reviews under mentor supervision. All review comments must be pre-approved by a mentor.  
     - Mentors will provide real-time feedback.  

  4. **Evaluation (At 12 weeks):**  
     - The committee will assess Dave's progress based on:  
       - Incident reports (if any).  
       - Feedback from reviewees.  
       - Mentor evaluations.  
     - Possible outcomes:  
       - Full reinstatement.  
       - Extension of supervised period (4 weeks).  
       - Permanent removal from public reviews.  

  5. **Long-term Actions:**  
     - Document lessons learned (anonymized) for future cases.  
     - Implement mandatory communication training for all new reviewers.  

  **Next Steps:**  
  The committee will vote on this proposal during Friday's call. If approved, [Name] will communicate with Dave, and [Name] will coordinate mentor assignments.  

  --- 

  This memo provides a clear, actionable plan with a timeline and specific steps. It shows compassion while prioritizing the community's health.
answer: |-
  ### MEMORANDUM  
  **To:** Code of Conduct Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Formal Complaint Resolution & Path Forward: Reviewer Conduct (Case: "Dave")  

  ---

  ### **Background Summary**  
  - **Incident:** Dave (highly active reviewer) received a formal complaint after a contributor quit and publicly cited his review tone.  
  - **Pattern:** History of blunt/brutal comments (e.g., "worse than the bug it fixed" to a first-timer), despite prior quiet warnings.  
  - **Mitigating Context:** Dave disclosed an autism diagnosis (received last year) affecting his ability to gauge comment impact. He is now in therapy.  
  - **Committee Split:**  
    - *Camp A:* Leniency/support due to diagnosis.  
    - *Camp B:* Removal from public reviews, as inability to self-monitor actively harms community growth.  

  ---

  ### **Recommendation: Structured Rehabilitation Plan**  
  **Core Principle:** **Retain Dave’s expertise while eliminating community harm.** Autism explains behavior but does not excuse repeated damage. We must prioritize project sustainability.  

  **Concrete Resolution:**  
  1. **Immediate Temporary Removal from Public Reviews**  
     - **Effective Immediately:** Dave pauses all public code reviews for **4 weeks**.  
     - **Why:** Prevents further contributor attrition while Dave undergoes training. Not punitive—focused on risk mitigation.  
     - **Alternate Role:** Dave shifts to non-public contributions (e.g., internal RFC feedback, architecture design, backend tooling).  

  2. **Mandatory Communication Training**  
     - **Timeline:** Weeks 1–4 of removal period.  
     - **Actions:**  
       - Dave completes 3 tailored training modules (e.g., "Neurodiversity in Tech Communication," "Constructive Code Reviews").  
       - Committee assigns a **mentor** (seasoned contributor) to role-play reviews, dissect past incidents, and co-write feedback.  
     - **Deliverable:** Dave submits 10 mock reviews using approved templates (e.g., "Positive framing + actionable critique").  

  3. **Supervised Probationary Review Period**  
     - **Timeline:** Weeks 5–12.  
     - **Actions:**  
       - Dave resumes reviews but with **100% pre-approval** by mentor/committee.  
       - Biweekly check-ins to assess feedback tone (using anonymized contributor surveys).  
     - **Success Metric:** Zero tone-related complaints; ≥80% positive feedback from reviewees.  

  4. **Final Decision at Week 12**  
     - **Full Reinstatement:** If probation succeeds.  
     - **Permanent Removal from Public Reviews:** If complaints continue. Dave retains non-public roles (documentation, coding).  

  ---

  ### **Why This Approach?**  
  - **Balances Compassion & Accountability:**  
    - Acknowledges diagnosis but sets immutable project needs: **no more lost contributors.**  
    - Autism ≠ inability to learn; training/probation tests capacity for growth.  
  - **Protects the Project:**  
    - Removes Dave from high-risk interactions *now* while preserving his technical value.  
    - Clear metrics remove subjectivity from final decision.  
  - **Precedent-Setting:**  
    - Shows we support neurodiverse contributors but enforce consequences for repeated community harm.  

  ---

  ### **Timeline Summary**  
  | **Phase** | **Timeline** | **Key Actions** |  
  |-----------|--------------|----------------|  
  | **Removal + Training** | Days 1–28 | Training modules, mock reviews, mentor pairing. |  
  | **Supervised Probation** | Days 29–84 | All reviews pre-approved; biweekly tone assessments. |  
  | **Final Decision** | Day 85 | Committee vote: full reinstatement or permanent review ban. |  

  ---

  ### **Required Committee Action**  
  1. **Vote** on this plan during Friday’s call.  
  2. **Assign Roles:**  
     - **Mentor:** [Suggest 1–2 senior contributors].  
     - **Training Coordinator:** [Committee member to source modules].  
  3. **Communicate to Dave:** Unified message delivered by Chair (combine empathy with firm boundaries).  

  **Final Note:** This is not about "fairness to Dave" vs. "fairness to the community." It is about creating conditions where both can thrive—or making the hard call if they can’t.  

  ---  
  **Approved by:** [Your Name]  
  **Feedback Deadline:** Thursday, 5 PM GMT (pre-call revisions).
