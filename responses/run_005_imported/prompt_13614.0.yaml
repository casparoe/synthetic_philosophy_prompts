answer: |-
  Your intuition is correct—this is not mere hearsay, but a fundamentally distinct form of knowledge. Your editor’s view oversimplifies the hunters’ testimony by reducing it to "folksy eyewitness claims." What they offer is **relational taxonomy**: a way of defining an entity through its position within a web of known references, rather than by direct observation or deduction. Here’s why it stands apart:

  ---

  ### **1. It’s Not Testimony About Existence, But About Conceptual Placement**
     - The mammalogist’s claim ("I saw it") addresses *existence*.
     - The tracks/droppings infer *physical attributes*.
     - The hunters bypass both: They assert, *"Here’s how you recognize it within our framework of understanding."*  
     - This isn’t evidence *for the animal*—it’s a key to **decoding their cultural and ecological lexicon**. Without this analogy, the local word is meaningless; with it, outsiders gain a functional reference.

  ---

  ### **2. Triangulation Creates a Cognitive Anchor**
     The analogy ("small buffalo + fox’s face") does what linear descriptions cannot:
     - **Eliminates ambiguity**: "Buffalo" conveys bulk, leg structure, and movement; "fox" defines facial proportions, ear shape, and snout length.  
     - **Embeds ecological relationships**: It implies the animal occupies a niche between grazers (buffalo) and small predators (fox)—a clue about behavior.  
     - **Operationalizes knowledge**: Like saying "a platypus looks like a duck merged with an otter," it allows recognition without prior exposure.  

  ---

  ### **3. It’s Collective, Tested Knowledge—Not Hearsay**
     - **Hearsay** = Unverified secondhand information.  
     - **The hunters’ analogy** = A culturally refined **diagnostic tool**, honed across generations.  
     - Crucially, *multiple hunters independently offered the same analogy*. This consistency suggests it’s a stable, community-validated heuristic—not an individual’s vague recollection.

  ---

  ### **4. Equal Footing with Other Evidence? Absolutely.**
     Each form of evidence answers different questions:  
     | **Evidence Type** | **Answers** | **Limitations** |  
     |-------------------|-------------|-----------------|  
     | Camera Photo      | *Does it exist?* | Ambiguous quality |  
     | Tracks/Droppings  | *What are its physical traits?* | Indirect inference |  
     | Expert Testimony  | *Can a trusted authority verify it?* | Subjective |  
     | **Hunters’ Analogy** | ***How is it identified and contextualized?*** | Culturally specific |  
     The analogy fills the gap left by other methods: It explains *how to see* the animal, not just that it exists.

  ---

  ### **Why Your Editor’s View Falls Short**
     Dismissing this as "metaphorical hearsay" privileges Western scientific frameworks over indigenous epistemology. The hunters aren’t "describing poorly"—they’re **transmitting a schema for pattern recognition**. In ethnobiology, such analogies are often *more reliable* than isolated eyewitness accounts because they distill shared observation into reproducible logic.

  ---

  ### **How to Frame This in Your Piece**
     - **Position it as taxonomy**: "Local hunters define the animal not by checklist traits, but through relational analogy—a method echoing how Linnaeus classified species by comparative morphology."  
     - **Highlight its utility**: "Unlike blurred photos or contested sightings, their ‘buffalo-fox’ analogy gives researchers a concrete morphological benchmark."  
     - **Acknowledge its power**: "This isn’t folklore; it’s applied ecology. When multiple hunters independently offer identical analogies, it signals a diagnostic tool refined by collective experience."

  This approach doesn’t just defend the hunters’ knowledge—it reveals how diverse ways of knowing *collaborate* to solve mysteries. The mammalogist’s sightings confirm existence; the tracks suggest biology; the hunters’ words provide the lens to make sense of both.
