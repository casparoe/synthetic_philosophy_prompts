  ### Notes on Contestation
  - **Peacock's train**: Heavily contested. Zahavi/Grafen treat it as a strict handicap (cost reveals fitness), but others (e.g., Prum) emphasize Fisherian runaway as the primary driver. Many modern syntheses view it as hybrid.
  - **Elite university degree**: Not contested *within signaling frameworks* (unanimously modeled as a Spence-style handicap in economics). Broader debates exist about whether education *only* signals vs. builds human capital.
  - **Watches**: Some argue this is a strict handicap (costlier for the poor), but commitment signaling better explains brand-based tribalism and context-dependent value (e.g., luxury goods as group tokens).

  ### Key Refinements to Your Framework
  1. **Fisherian runaway**: Emphasized as *non-functional* (decoupled from quality), per its original definition. This clarifies why the peacock's train is contested—it may signal fitness *and* be subject to aesthetic feedback.
  2. **Commitment signals**: Expanded to include *any group-directed investment* (not just loyalty), as in Cronk's "costly signaling in human cooperation."
  3. **Index signals**: Specified as *morphological constraints* (vs. behavioral costs), aligning with Maynard Smith/Harper's formalization.

