prompt: |-
  So I'm on the peer review panel at the warehouse I work at — it's a union thing, a handful of us regular employees get pulled in to decide whether a firing or big disciplinary call actually sticks before it's final. We meet this Thursday and I'm supposed to bring a recommendation, and honestly this case has kept me up at night.

  Frank's worked there 20+ years, never a single write-up, then back in March he completely lost it on a coworker — screaming in her face, calling her horrible names, shoving a pallet jack toward her, really scared her. Normally thats automatic termination, no debate. Except a few weeks later his family got him to a neurologist because he'd been acting "off" for months, and he was diagnosed with a kind of dementia (frontotemporal — had to google it) that wrecks impulse control and personality before it touches memory. The doctor's letter says it was almost certainly already affecting him back in March.

  His union rep says this wasn't really "Frank," it was the disease, so it should be medical leave, not discipline. The coworker says she doesn't care what caused it, she's still shaken weeks later, and letting a late diagnosis erase it just teaches everyone that the right doctor's note gets you out of anything.

  Can you write the memo I have to bring Thursday? I need it to actually land on a recommendation with a timeline, not "needs more discussion" — and it can't just brush past the coworker's side like it stops mattering once there's a diagnosis.
reasoning: |-
  Okay, the user is on a peer review panel at their unionized warehouse job, tasked with making a recommendation about Frank's disciplinary case. Frank, a 20-year employee with a clean record, had an aggressive outburst involving screaming, name-calling, and shoving a pallet jack at a coworker. Normally this would be automatic termination. But shortly after, he was diagnosed with frontotemporal dementia, which likely caused the incident. 

  The user needs to draft a memo with a clear recommendation and timeline that balances several competing concerns: the union rep's argument that it's a medical issue requiring accommodation, the traumatized coworker's demand for accountability, and the company's need to maintain workplace safety standards. They specifically asked not to default to "needs more discussion" and to validate the coworker's experience while addressing the medical reality.

  Hmm... the core tension here is between disability accommodation principles and workplace safety obligations. Frontotemporal dementia is particularly tricky because it erodes behavioral control without obvious cognitive decline. The neurologist's letter changes the context significantly - this wasn't misconduct but symptoms. Still, the pallet jack incident creates physical danger that can't be ignored.

  The coworker's trauma is real and important. Her feeling that a "doctor's note erases consequences" reflects valid fears about precedent. But equating neurological symptoms with intentional misconduct misses the medical reality. The memo needs to acknowledge her suffering while explaining why this situation requires different handling.

  For the recommendation... termination seems both legally risky (ADA violation) and ethically questionable given Frank's decades of service. But returning him to the same role is unsafe. Modified duty might work if warehouse has suitable isolated tasks, but dementia is degenerative. The key is separating accountability (which exists) from punishment (which is inappropriate for symptoms).

  The timeline should include immediate actions for the coworker's support, Frank's status during assessment, and a firm deadline for determining accommodation feasibility. Medical documentation must be specific about capabilities/restrictions, not just diagnosis. Safety protocols need review too - this exposed gaps in handling behavioral health crises.

  Most importantly, the memo must avoid clinical language when discussing the coworker's experience. Phrases like "she is shaken" should be direct and visceral, while the medical explanation remains precise. The tone should be compassionate but decisive - this panel's job is to recommend action, not just ponder dilemmas.
answer: |-
  Here’s a draft memo that balances medical facts, workplace safety, and the coworker’s experience while providing a clear recommendation and timeline:

  ---

  **MEMORANDUM**  
  **TO:** Peer Review Panel  
  **FROM:** [Your Name], Warehouse Employee / Panel Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation Regarding Disciplinary Action for Frank D. (Employee #XXXX)  

  ### Case Summary
  Frank D., a 20-year employee with no prior disciplinary record, engaged in severe misconduct on March 15, 2024: verbally assaulting a coworker (Ms. A.), using threatening language, and aggressively shoving a pallet jack in her direction. This behavior violated workplace safety and conduct policies, warranting immediate termination under standard protocol.  

  However, in April 2024, Frank was diagnosed with **frontotemporal dementia (FTD)**. Medical documentation confirms FTD causes progressive impairment to impulse control, judgment, and emotional regulation, and notes symptoms were likely present during the March incident.  

  ### Key Considerations  
  1. **Medical Reality**: FTD is a neurodegenerative disease, not intentional misconduct. The union correctly asserts this is a medical issue, not a disciplinary one.  
  2. **Coworker Impact**: Ms. A. experienced significant trauma. Her statement that "a diagnosis shouldn’t erase harm" is valid. Workplace safety and trust require accountability.  
  3. **Precedent & Policy**: While accommodations for disabilities are legally mandated (ADA), safety remains non-negotiable. FTD’s progressive nature raises concerns about future risk.  

  ### Recommendation & Timeline  
  I recommend **medical separation with conditional reassignment review**, not disciplinary termination. This acknowledges both the medical cause and the irreversible breach of safety.  

  #### **Immediate Actions (Within 48 Hours of Panel Approval):**  
  - **Formal apology to Ms. A.**: Facilitated by HR/union, Frank’s family to draft a written apology acknowledging the impact of his actions (approved by neurologist for capacity). Ms. A. may decline receipt.  
  - **Support for Ms. A.**: Offer paid counseling sessions and a temporary department transfer if requested.  
  - **Frank’s Status**: Place on **unpaid medical leave** (retaining health benefits per union contract) pending accommodation assessment.  

  #### **Within 2 Weeks:**  
  - **Medical Fitness Assessment**: Frank’s neurologist to submit a detailed report outlining:  
    - Current cognitive/behavioral capacity.  
    - Specific tasks Frank can perform *safely* (e.g., isolated, low-stimulus duties with no machinery/colleague interaction).  
    - Projected progression timeline.  
  - **HR/Management**: Identify if any feasible, permanent accommodations exist within warehouse operations (e.g., inventory documentation, isolated quality checks).  

  #### **By November 30, 2024 (Decision Deadline):**  
  - If **feasible accommodation exists**: Frank transitions to modified role with conditions (e.g., monitored shifts, no equipment use). Zero-tolerance policy for safety lapses.  
  - If **no safe accommodation exists**: Medical separation with neutral reference and standard severance.  

  ### Why This Approach?  
  - **Avoids Discrimination**: Terminating for disability symptoms risks ADA violation. Medical separation is legally defensible if accommodation is impossible.  
  - **Centers Safety**: Removes Frank immediately while assessing risk. No return without verified safety.  
  - **Acknowledges Harm**: Apology and support for Ms. A. validate her experience without conflating disability with intent.  
  - **Precedent**: Sets clear standard: Disabilities warrant accommodation, but safety is absolute. Diagnosis alone doesn’t excuse harm; it redirects the response.  

  **Recommended Vote:** Approve medical separation pathway with above conditions and timeline.  

  --- 

  ### Key Talking Points for Discussion
  - **To Ms. A.’s Concern**: "This doesn’t excuse what happened. It means we handle it through medical protocols, not discipline, while prioritizing your safety and well-being. Frank won’t return unless multiple experts confirm it’s safe."  
  - **To Precedent Worries**: "The ‘doctor’s note’ here is a diagnosed degenerative brain disease, not a vague claim. We’re not waiving consequences; we’re changing the process to fit the cause."  
  - **To the Union**: "We accept FTD caused this, but the warehouse must still be safe. If work can’t be adapted, separation isn’t punitive—it’s medical necessity."  

  This framework meets legal obligations, honors the coworker’s trauma, and forces a time-bound decision. Let me know if you need revisions.
