answer: |-
  Here's a clear breakdown of Aquinas's position and a verdict for your debate with Priya:

  **Aquinas's Actual Position on Licit Tyrannicide (Summa Theologiae I-II, Q. 42, A. 2 & De Regno, Ch. 6-7):**

  1.  **The Crucial Distinction:**
      *   **Usurper (Tyrannus Absque Titulo):** Someone who seized power *illegitimately* (through force, fraud, without rightful claim or election). Aquinas argues this person **never possessed legitimate authority** in the first place. They are fundamentally an *aggressor* against the political community.
      *   **Oppressive Ruler (Tyrannus Ab Exercitio):** Someone who gained power *legitimately* (election, inheritance, just conquest) but subsequently governs *tyrannically* (oppressing subjects, acting for private gain, subverting the common good).

  2.  **Why the Distinction Matters:**
      *   **Against a Usurper:** Because the usurper lacks *any* legitimate authority, they are essentially an outlaw or public enemy *to the community itself*. Aquinas argues **private citizens** are *not necessarily forbidden* from killing such a tyrant. The usurper has no claim to allegiance or protection; resisting them is akin to self-defense against an aggressor. However, Aquinas still expresses caution due to the risk of vigilantism and chaos.
      *   **Against an Oppressive Ruler:** This is the critical case. Aquinas **explicitly rejects** the idea that a private individual can licitly kill a legitimately installed ruler who has become tyrannical. Why? Because the ruler, despite their wickedness, *still holds the office* by which they were granted legitimate public authority. Killing them is not just killing a man, but an attack on the *institution* of authority itself.

  3.  **The "Public Authority" Requirement (and Why He Insists On It):**
      *   **Who Can Act?** Removal of a legitimately installed but oppressive tyrant **must be undertaken by public authority**. This means:
          *   A superior temporal authority (e.g., an emperor over a king).
          *   The community *acting collectively* through established, representative mechanisms (e.g., a council of nobles, elders, or representatives of the people).
          *   Divine authority (which Aquinas saw as operating through just channels).
      *   **Why Insist on Public Authority?**
          *   **Preserve Order:** Private assassination invites chaos, vendettas, and potentially worse tyranny.
          *   **Uphold Legitimacy:** Authority comes from God *through the community*. Only the community (or its representative superiors) has the right to revoke the authority it originally granted or recognized. This maintains the principle that authority stems from the common good.
          *   **Ensure Justice & Due Process:** Public authority implies a judgment against the ruler's tyranny, not just a private grievance. It aims at restoring just order, not just eliminating an individual.
          *   **Avoid Vigilantism:** Prevents individuals from taking the law into their own hands based on personal judgment, which is prone to error and malice.
          *   **Distinguish Rebellion from Correction:** Actions by public authority aim to *correct* the defect in governance, not destroy the political order itself.

  **Applying Aquinas to a Modern Covert Foreign Drone Strike:**

  **Verdict: Aquinas would categorically reject such an action as legitimate tyrannicide. It fails his core requirements.**

  **Why it Fails:**

  1.  **Fundamental Authority Problem:** Aquinas's "public authority" is intrinsically linked to *the political community suffering under the tyrant*. It is *their* authority to revoke or correct the governance they originally sanctioned (or were subjected to legitimately). A foreign intelligence service **does not and cannot represent the "public authority" of the tyrannized community.** They are an *external* actor imposing their judgment.
  2.  **External vs. Internal:** Aquinas's framework is entirely focused on *internal* political correction. He envisions the community acting against *its own* ruler, or a superior temporal authority acting within a recognized hierarchy (like the Holy Roman Emperor). A foreign state acting covertly is an *alien* power, not a recognized superior authority over the tyrant's state, nor a representative of the tyrannized people.
  3.  **Covert Action ≠ Public Judgment:** Covert assassination by definition bypasses any semblance of public judgment or due process. It is the ultimate act of private judgment imposed by an external force. Aquinas's requirement for public authority is meant to *ensure* a public and communal judgment, replacing private vengeance.
  4.  **Risk of Greater Disorder:** Aquinas would see immense danger in external powers unilaterally deciding to assassinate foreign leaders. It invites retaliation, escalates conflict between states, undermines international order, and could easily be used for cynical power politics disguised as liberation. This is precisely the chaos his "public authority" requirement seeks to prevent *within* a community, and the principle applies *a fortiori* between communities.
  5.  **Category Error:** Priya is fundamentally correct. Aquinas's theory of tyrannicide is about *internal political legitimacy and authority within a single political community*. What you're describing is **interstate force**. Aquinas would analyze it under his theory of *Just War* (Summa Theologiae II-II, Q. 40), not tyrannicide. For it to be potentially just under *that* framework, it would need to meet stringent criteria: just cause (e.g., defense against imminent aggression *by that tyrant's state*), right intention, proper authority (declared by the *foreign state's* legitimate sovereign), proportionality, last resort, and reasonable chance of success. Covert assassination by an intelligence service would struggle to meet several of these, especially "proper authority" (often requiring public declaration) and "last resort" (compared to open war or sanctions).

  **The Verdict for Priya:**

  **Tell Priya she wins.** Aquinas would say a modern covert drone strike by a foreign intelligence service against a foreign dictator, regardless of how bad the tyrant is, **cannot** qualify as legitimate tyrannicide under his framework. It fails the essential requirement that the action must stem from the *public authority of the tyrannized community itself* or its recognized superior. Such an act falls entirely outside the scope of Aquinas's discussion of tyrannicide and into the separate (and also heavily qualified) realm of just war theory, where it faces its own significant hurdles. The "authority grounds" are indeed fatal to classifying it as tyrannicide in Aquinas's sense.
