prompt: |-
  hey so we're doing the hart-fuller exchange this week in my philosophy of law seminar and honestly the textbook version (positivists: law is law even if unjust; natural lawyers: unjust laws aren't really law) feels way flatter than what they were actually arguing about. could you write me a dialogue between a hart-style positivist and a fuller-style natural lawyer, arguing specifically over the grudge informer case -- the wife who denounced her husband to the nazis in '44 for badmouthing hitler and then got prosecuted by a german court after the war? i want the fuller character to actually run the "inner morality of law" argument for why the nazi statute she used doesn't even deserve to count as law, not just gesture at "nazi law = evil," and i want the hart character to push back with his retroactive-statute idea and explain why he thinks thats actually more honest than pretending the statute was void all along. make them respond to each other's specific points instead of just restating their own view, and have them land, by the end, on whether they actually disagree about what "law" IS or just about what should happen to the wife. dont let either one win by strawmanning the other -- they're both pretty sharp.
