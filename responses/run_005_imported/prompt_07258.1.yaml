prompt: |-
  Random thing that's been bugging me since chem lab yesterday: my partner said she'd already calibrated the pH meter before I got there, so we skipped straight to taking readings instead of me redoing it myself. I didn't check it, partly to save time, but mostly because she's usually careful and I had no actual reason to doubt her. Our numbers came out a bit off afterward, though who knows if that was even the meter's fault. Now I can't stop wondering whether just taking her word for it was actually reasonable, or if thats just gullibility with better branding. Can someone's say-so alone ever count as real evidence, with zero independent check on your end, or do you always need some prior reason to trust that specific person (or people in general) first? We've hit some related stuff in my epistemology class but i still can't place this exact case.
