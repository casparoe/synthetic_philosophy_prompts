    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  Please feel free to leave a tier empty, or to place a single case by itself, if that is genuinely your best judgment; a one-line justification for each placement, given as a parallel "notes" object, would also be welcome.
