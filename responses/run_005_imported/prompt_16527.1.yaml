  We are ranking the listed scientific "paradigm shifts" according to how well they fit Kuhn's specific criteria from *The Structure of Scientific Revolutions*. Kuhn's criteria include:
  - A prior state of crisis and proliferating rival schools.
  - Genuine incommensurability (meaning terms and observations don't translate perfectly between paradigms).
  - A Gestalt switch in perception of phenomena.
  - A wholesale rewriting of textbooks and disciplinary matrix, not just accumulation.

