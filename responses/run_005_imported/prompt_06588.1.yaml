prompt: |-
  Ok so this has been living in my head rent-free for about a week and I need someone smarter than my group chat to weigh in. I'm a data scientist at a small gaming/fintech startup, and a few weeks back we were sketching out payout curves for a "streak" betting mechanic (payout roughly doubles each round the streak continues, but also gets divided down the longer it goes), and when I plugged it into a spreadsheet to get the expected value I got completely different numbers depending on the order I summed the terms in -- not rounding-error different, but "ln(2) vs. diverges to infinity vs. literally any number you want" different. Our resident math nerd said this is basicaly a known thing called the Pasadena paradox (Hájek and Nover, I think?), a cousin of the more famous St. Petersburg paradox but supposedly worse, since St. Petersburg at least diverges to infinity in a well-behaved way, wheras the Pasadena-style gamble's "expected value" is only conditionally convergent -- so by the Riemann rearrangement theorem you can literally reorder the infinite list of outcomes to make it sum to anything you want, or to nothing at all.

  I've now spent way too many evenings reading about this and I still don't know what I'm actually supposed to conclude from it, philosophically. So here's what I want from you: write me an essay that actually stakes out a position -- does the Pasadena paradox show that expected-value / expected-utility maximization is fundamentally broken as a normative theory of rational choice (at least for gambles with infinitely many possible outcomes), or is it more of a neat pathological edge case that can be walled off with some technical fix (bounding utility, restricting the theory to absolutely convergent gambles, denying such gambles are ever really "available" to real agents, whatever) without threatening ordinary decision-making, including the kind of stuff we do at my job? Weigh the best arguments you can find on both sides, but don't cop out with "reasonable people disagree" -- actually tell me where you'd land and defend it.
