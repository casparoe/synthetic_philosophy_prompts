  Biggest risk is making it too cold. Need subtle warmth - hence the coordinator noticing the donor's nail polish. That tiny human detail against the sterile environment creates dissonance. The "not dead yet" line is crucial too - it names the epistemological dread without overexplaining. 

  *adjusts narrative lens* Should end right before declaration to preserve the tension. No resolution, just the weight of the moment. The coordinator's final thought about "what we're willing to call death" ties back to the user's core concern about definitions. 

  Word count tight at 800... *trims descriptive flourishes* Sacrificed some atmosphere but kept the stethoscope scene - that tactile detail grounds the abstraction. Hope the user appreciates the choice to make the coordinator female - avoids default male med narratives. 

