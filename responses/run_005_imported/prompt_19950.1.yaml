answer: |-
  Here is a carefully crafted eulogy, balancing rigorous fidelity to your mother's philosophical position with the heartfelt clarity needed for all listeners. It leans into the settled part of her view – the causal efficacy of intentional states – while explicitly respecting her unresolved stance on qualia:

  ---

  # Eulogy for [Mother's Name]

  Thank you all for being here to honor my mother, [Mother's Name]. Many of you knew her as a brilliant philosopher, deeply engaged with the mysteries of the mind for nearly four decades. Others knew her as a devoted friend, a voracious reader in her book club, or simply as family – Grandma, Aunt, Cousin. I knew her as Mom.

  Mom wrestled with big questions. One puzzle, in particular, followed her from the lecture hall to our kitchen table for years: How does the mind – our thoughts, our feelings – actually *do* anything in the physical world? If everything physical has a physical cause, where does the *mind* fit in?

  Her answer, forged through decades of thought, argument, and conviction, was precise and honest. She believed, fundamentally, that we *are* our physical selves. But she also fiercely resisted the idea that the richness of our mental lives – what she called our beliefs, our desires, our plans, our decisions – could be simply reduced to just the firing of neurons, as if that was the only story worth telling. She argued that *what* we believe, *what* we decide, *what* we intend to do, defined by the roles they play in our lives, are real and causally powerful *because* they are realized in that physical system.

  **And this wasn't just academic for her. It was the bedrock of how she lived with us.**

  Mom believed, with utter certainty, that her **choices** mattered. That her **deliberate care** had consequences. That her **decisions** to be present, to listen, to support, to challenge, to nurture – these weren't just fleeting thoughts. They were real forces in the world, particularly in *our* world, the world of her family and friends. Her **intentions**, her **commitments**, her **plans** for us – these were the active, driving engines of so much good in our lives.

  When she **decided** to stay up late helping with homework, that decision caused real understanding. When she **believed** fiercely in our potential, that belief fueled our confidence and pushed us forward. When she **planned** a family gathering or **chose** to drop everything to offer comfort, those choices brought tangible warmth, security, and connection into our lives. She knew, from her deepest philosophical conviction, that these states of mind – these beliefs, plans, and choices, defined by what they *do* – were not passengers. They were the drivers. They were the causes of countless acts of love, support, and wisdom that shaped who we are.

  **She held this truth about the causal power of our intentional lives unshakably.** It was settled for her. She knew her love for us, expressed through her steadfast **decisions** to act, her unwavering **belief** in our worth, her constant **plans** for our well-being – this love-in-action was real, it was powerful, and it built the foundation of our family.

  Now, Mom was also profoundly honest about the limits of what she could claim to *know* for certain. There was another piece of the puzzle she never pretended to solve to her own satisfaction. She distinguished sharply between the active work of believing, deciding, and caring – which she *knew* caused things in the world – and the raw, inner *feeling* of an experience itself. She called this the "qualia" – the sheer *what-it's-likeness* of tasting coffee, seeing a sunset, or, yes, *feeling* love. While she knew the *decision* to love us caused mountains to move in our lives, she remained rigorously agnostic, by her own philosophical lights, about whether the *feeling* itself – the subjective warmth – was an independent cause in the physical chain. She refused to claim causal powers for that feeling that her philosophy couldn't definitively secure. That part remained, for her, an open question, a profound mystery she chose to leave unresolved rather than offer a comforting answer she couldn't fully endorse.

  So, today, we celebrate the immense power she *knew* she had: the power of her choices, her commitments, her deliberate care. We feel the undeniable, tangible results of her beliefs in us and her decisions for us. Her love, in this active, intentional sense – the love that showed up, that acted, that built, that nurtured – that love was fiercely real. It was the most powerful cause many of us have ever known.

  She shaped our world through the choices she made and the care she deliberately gave. That was her conviction. That was her truth. And that is her enduring legacy.

  We will miss her brilliance, her honesty, her fierce love-in-action, and even her unsolved mysteries. Thank you, Mom.

  ---

  ## Why this balance works

  1.  **Honors Her Settled View (For Experts & Family):**
      *   Explicitly names beliefs, desires, plans, decisions, choices, intentions, commitments (intentional states).
      *   Repeatedly emphasizes these are **defined by their causal role** ("defined by the roles they play," "defined by what they *do*").
      *   Uses strong causal language for these states: "real and causally powerful," "active, driving engines," "drivers," "causes," "caused real understanding," "fueled," "brought tangible warmth."
      *   States clearly this part was "settled for her," "unshakably" held, "the bedrock."
      *   Explicitly connects this to love *as action*: "love-in-action," "expressed through her steadfast decisions," "the love that showed up, that acted, that built, that nurtured."

  2.  **Respects Her Agnosticism on Qualia (Crucially):**
      *   Clearly distinguishes the "raw, inner *feeling*" (qualia) from the intentional states.
      *   Explicitly names "qualia" and "the sheer *what-it's-likeness*," signaling precision to the experts.
      *   States her position unflinchingly: "rigorously agnostic," "refused to claim causal powers," "an open question," "a profound mystery she chose to leave unresolved."
      *   Directly contrasts it with the settled view: While the *decision* to love caused things, she was agnostic about the *feeling* itself being a cause.
      *   Uses the specific phrase "by her own philosophical lights" and "comforting answer she couldn't fully endorse," echoing her intellectual integrity.

  3.  **Accessible for Non-Philosophers:**
      *   Explains the core problem simply ("How does the mind... actually *do* anything?").
      *   Focuses on concrete examples of her love-in-action: helping with homework, believing in potential, planning gatherings, offering comfort.
      *   Uses relatable language: "choices mattered," "deliberate care had consequences," "real forces," "warmth, security, and connection," "built the foundation," "mountains to move."
      *   Emphasizes the *reality* and *impact* of her love as everyone experienced it, grounding it in her intentional actions.
      *   The qualia section, while precise, is framed as her intellectual honesty about a deep mystery, not a denial of feeling.

  4.  **Structure & Tone:**
      *   Opens with connection (philosopher, friend, family, Mom).
      *   Introduces the philosophical problem briefly but accessibly.
      *   **Dedicates the central, longest section to celebrating the causal efficacy of her intentional states and love-as-action.** This is the core message for most attendees.
      *   **Addresses the qualia question distinctly and honestly in a separate, shorter paragraph,** respecting her position without letting it overshadow the central message of love's tangible impact.
      *   Closes by reaffirming the power of her choices and care, her legacy, and the love everyone felt.
      *   Tone is warm, respectful, admiring of her intellect and integrity, and deeply appreciative of her love.

  This eulogy allows you to stand before her colleagues and students and state her position accurately, while allowing your children, cousins, and friends to hear, without any ambiguity, that her love was real and actively shaped your lives for the better, exactly as she herself believed intentional love could and did. It doesn't soften her unresolved stance; it presents it as part of her admirable intellectual honesty.
