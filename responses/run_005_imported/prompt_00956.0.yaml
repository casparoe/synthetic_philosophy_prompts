answer: |-
  You're partially misremembering Elizabeth Anscombe's core argument. While she **did** challenge the casualty estimates used to justify the bombings, her primary and most famous argument was **deontological**, **not utilitarian**. She fundamentally rejected the *moral permissibility* of targeting non-combatants, regardless of the consequences. Here's a breakdown:

  1.  **The Core Argument: Targeting Civilians is Murder (Deontological):**
      *   Anscombe, a Catholic philosopher deeply influenced by the Just War tradition, argued that the deliberate targeting of non-combatants (civilians) is intrinsically evil and constitutes murder.
      *   Her central point was that **even if** the bombings *did* ultimately save more lives than an invasion (which she contested), **this would not make them morally permissible**. The act itself – intentionally killing innocent civilians en masse as a means to an end – was absolutely forbidden.
      *   She saw Truman's decision as a stark rejection of the absolute moral prohibition against murdering the innocent. Awarding him an honorary degree, in her view, condoned this act of mass murder. Her protest pamphlet was titled "Mr. Truman's Degree," explicitly framing it as a question of honor for an act she deemed dishonorable.

  2.  **Challenging the Utilitarian Calculation (Secondary Argument):**
      *   **Yes, she did argue that the utilitarian justification didn't hold water.** She contested the predicted casualty figures for a land invasion of Japan (often cited as 500,000 to 1 million Allied lives, plus millions of Japanese). She believed these figures were inflated or unreliable.
      *   She pointed to alternative strategies that *didn't* involve mass civilian slaughter:
          *   **Continuing conventional bombing and naval blockade:** She argued this was already bringing Japan to its knees and would likely have forced surrender without invasion *or* atomic bombs.
          *   **Allowing more time after the Soviet declaration of war:** The USSR declared war on Japan on August 8th (between Hiroshima and Nagasaki). Anscombe believed this seismic shift alone might have prompted surrender, especially combined with the blockade and conventional bombing.
          *   **A demonstration of the bomb:** She suggested (though acknowledged practical difficulties) that demonstrating the bomb's power on an uninhabited area or military target might have sufficed.
      *   **Her critique:** She argued that Truman and his advisors either didn't seriously consider these alternatives or dismissed them too quickly. She contended that the *actual* number of lives saved by the bombs compared to these alternatives was likely much lower than claimed, possibly even negative when considering the immediate and long-term civilian casualties (including radiation sickness). Her point here was that **even on their own (flawed, in her view) utilitarian terms, the decision was unsound.**

  **Why Your Friend Says You're Butchering It:**

  *   **Overemphasis on Utility:** By framing Anscombe's argument as primarily about "the numbers not checking out," you downplay her much stronger, foundational argument: that targeting civilians is *always wrong*, full stop. She wasn't *just* saying Truman's math was bad; she was saying his *entire moral framework* (using utility to justify murder) was corrupt.
  *   **Misattributing the Primary Motivation:** Her protest wasn't *fundamentally* driven by a dispute over casualty figures. It was driven by her absolute moral conviction that mass killing of civilians is murder, and Oxford should not honor someone who ordered it.

  **In Summary:**

  *   **Anscombe's PRIMARY Argument:** Deliberately targeting non-combatants is intrinsically evil murder. This act is morally impermissible *even if* it leads to a net saving of lives. Truman committed mass murder. Honoring him was wrong.
  *   **Anscombe's SECONDARY Argument:** The specific utilitarian justification offered (saving X lives vs. invasion) was flawed. The casualty estimates for an invasion were likely exaggerated, alternatives were not exhausted, and the actual civilian death toll from the bombs was immense. Therefore, **even on the utilitarian grounds used by Truman's defenders, the calculation didn't necessarily hold up.**

  **You were correct that she challenged the numbers**, but that was part of her *counter* to the utilitarian justification, not the core of her own ethical stance. Her main point was a powerful rejection of consequentialism when it comes to the fundamental prohibition against killing the innocent. She believed Truman's decision represented a dangerous erosion of absolute moral principles.
