answer: |-
  You're absolutely right that Bernoulli's expected utility solution resolves the *core mathematical infinity problem* of the St. Petersburg Paradox for a rational agent with concave utility (like log wealth). Your teaching on that point is **fundamentally correct and not outdated**. However, the persistence of the paradox in modern literature isn't due to ignorance of Bernoulli or von Neumann-Morgenstern (vNM). It's because the St. Petersburg setup continues to be a powerful tool to probe the **boundaries, assumptions, and descriptive validity** of expected utility theory (EUT) itself. Here's why it remains a live topic:

  1.  **The "Utility Growth Rate" Problem (Technical Nuance):**
      *   Bernoulli used *log wealth*. This works because the harmonic series (sum of 1/n) converges when multiplied by probabilities decaying as 1/2^n.
      *   **But what if utility grows faster?** Consider U(W) = W^k for k > 0. For k >= 1 (linear or convex), EU diverges, as expected. For 0 < k < 1 (concave!), EU = Σ [ (2^{(n-1)})^k * (1/2)^n ] = Σ [ 2^{(k(n-1) - n)} ] = Σ [ 2^{n(k-1) - k} ]. For k < 1, (k-1) is negative, so this is a geometric series with ratio r = 2^{(k-1)} < 1. **It converges!** So problem solved?
      *   **The Catch:** What if U(W) grows *almost* as fast as linear? Specifically, what if U(W) = W / log(W) or W / log(log(W))? These are still strictly concave, but careful analysis shows that for the St. Petersburg payoffs, **Expected Utility can STILL DIVERGE** with sufficiently "slowly growing" concave utility functions. The paradox re-emerges mathematically *even within concave EUT*. This highlights a deep technical point: not *any* concave utility resolves the paradox; the utility function must grow slowly enough relative to the payoff structure. This probes the limits of the "concavity is sufficient" intuition.

  2.  **Challenging the vNM Axioms Directly (Axiomatic Vulnerability):**
      *   The vNM axioms guarantee the existence of a utility function where you maximize EU. The St. Petersburg game, with its *unbounded payoffs*, creates a situation where these axioms can feel strained or descriptively invalid.
      *   **Continuity Axiom:** Would you really be indifferent between a sure $1 billion and a tiny probability of winning an *astronomical* St. Petersburg payoff (say, 2^100 dollars)? For many people, the sure $1 billion dominates, violating the strict preference ordering required by continuity when probabilities get extremely small. The game forces the axiom to operate at extremes of probability and payoff where intuition rebels.
      *   **Boundedness Implication:** Karl Menger pointed out that for *any* unbounded utility function, a suitably modified St. Petersburg game (with even faster-growing payoffs) can be constructed to make EU infinite again. This suggests that **truly rational agents described by vNM must have bounded utility functions** if they are to assign finite value to *all* gambles. The original St. Petersburg Paradox is the simplest example exposing this necessity. Debates continue about whether bounded utility is a reasonable requirement or a flaw in the framework.

  3.  **Behavioral Economics & Descriptive Failure:**
      *   While Bernoulli/log utility gives a *finite* value (e.g., around $2 if initial wealth is low, maybe $10-$20 for reasonable assumptions), **empirical studies consistently show people's willingness-to-pay (WTP) is far lower** than even this EU calculation (often just a few dollars).
      *   EUT (even with log utility) fails to explain the magnitude of this gap. This opens the door for behavioral explanations:
          *   **Probability Weighting:** People drastically underweight tiny probabilities (1/2^n for large n becomes effectively zero). Prospect Theory captures this.
          *   **Myopia/Bounded Rationality:** People simply don't consider (or can't compute) the implications of extremely long, low-probability tail events. They truncate the game mentally after a few flips.
          *   **Loss Aversion (Entry Fee):** Paying to play feels like a loss. The potential gains need to be very salient to overcome this.
          *   **Bankroll Constraints/Risk of Ruin:** No real player has infinite wealth to cover potential losses or even to guarantee they can pay the entry fee if they lose several rounds. Finite bankrolls truncate the effective game tree.
      *   Modern "resolutions" often focus on explaining this *empirical* WTP gap using these behavioral models, going beyond the mathematical resolution of the infinity problem.

  4.  **Epistemological & Philosophical Dimensions:**
      *   What constitutes a "resolution"? Is it enough to have *a* mathematical framework (EUT) that avoids the infinity? Or does it need to accurately describe *actual human behavior*? The paradox remains a locus for debates about the purpose of economic models (prescriptive vs. descriptive).
      *   It forces confrontation with the meaning of infinity in decision contexts. Can a rational agent truly engage with a gamble offering infinite expected value (or infinite EU under some utilities)? What does rationality even mean in such extreme hypotheticals?

  **What This Means for Your Teaching:**

  1.  **You Did Nothing Wrong:** Teaching Bernoulli's solution as the resolution to the *core mathematical infinity problem* within the classical EUT framework is essential and correct. It's the historical and conceptual foundation.
  2.  **Adding Nuance (Optional but Enriching):** If you want to show the "living" nature of the topic, you could briefly add in future sections:
      *   *"While Bernoulli's insight resolves the infinity problem for a rational agent with sufficiently slowly growing utility (like log wealth), the St. Petersburg game remains a fascinating benchmark. It highlights technical nuances about utility function growth, challenges the limits of the vNM axioms (especially regarding unbounded payoffs and tiny probabilities), and exposes a significant gap between the predictions of classical EUT and actual human behavior, which modern behavioral economics tries to explain."*
  3.  **Contextualize New Papers:** When you see new "resolutions," look closely. Are they:
      *   Proposing a new bounded utility function with specific properties?
      *   Introducing a behavioral model (PT, RDUT, etc.) to explain the low WTP?
      *   Discussing the axiomatic implications of unboundedness?
      *   Analyzing it through a purely philosophical lens?
      *   (Less likely) Claiming Bernoulli/vNM were simply wrong about the math?

  **Conclusion:**

  The St. Petersburg Paradox isn't a "zombie" due to neglect of Bernoulli. It's more like a **permanent stress-test fixture** in decision theory. Bernoulli killed the original naive infinity monster, but the corpse reanimates every time we want to:
  *   Test the robustness of EUT under extreme conditions (`Utility Growth`).
  *   Examine the implications of vNM axioms (`Unbounded Payoffs => Bounded Utility?`).
  *   Measure the descriptive failure of EUT and validate behavioral models (`Why WTP << EU(log)`).
  *   Ponder foundational questions (`Meaning of Rationality/Infinity`).

  Your students got the crucial historical and conceptual resolution. The ongoing literature explores the fascinating cracks and complexities that this deceptively simple game continues to reveal at the frontiers of how we model choice. Your understanding is solid; the paradox's persistence reflects the depth of decision theory, not a flaw in your teaching.
