  ## Governance Board Policy Memo: Household Stability & Child Welfare

  **To:** All Cooperative Members  
  **From:** The Governance Board  
  **Date:** October 26, 2023  
  **Subject:** Policy on New Partners in Households with Minor Children  
  **Effective Date:** January 1, 2024  

  ---

  ### **I. Recommended Policy: Stability Period for Households with Minor Children**  
  **Rule:**  
  *In any household unit within the cooperative where a minor child resides as a primary resident, a new partner of any co-parent may not establish residency until either:*  
  **(a)** *Six (6) months have elapsed since the new partner began regularly spending significant overnight time (averaging ≥ 3 nights/week) at the residence; OR*  
  **(b)** *All co-parents of the child residing within the cooperative provide written, unanimous consent to waive the waiting period.*  

  *This rule applies solely to new partners of individuals recognized as co-parents of the child residing in the household. It does not restrict social visits, temporary stays (< 3 consecutive nights), or residency changes for non-partner housemates.*  

  ---

  ### **II. Rationale & Response to Key Objections**  
  This policy balances the cooperative’s foundational values of individual autonomy, collective responsibility, and child welfare. It recognizes that households with children entail unique ethical and practical considerations without creating inequitable burdens.  

  **Substantive Response to the "Special Pleading" Objection:**  
  The objection that this policy unfairly singles out parents rests on a false equivalence between childless households and those with minor children. The distinction is justified on three grounds:  

  1.  **Asymmetry of Risk & Consent:**  
      Children are involuntary participants in adult living arrangements. Unlike consenting adults, a child cannot choose their household, negotiate boundaries, or exit unstable situations. The cooperative’s duty to protect vulnerable residents (a widely accepted ethical and legal principle) necessitates heightened scrutiny of changes that directly impact a child’s primary home environment.  

  2.  **Unique Impact of Household Flux on Children:**  
      Developmental psychology consistently shows that rapid, conflict-laden changes in a child’s core living environment (e.g., abrupt introduction of new parental figures post-separation) can cause significant emotional and psychological harm. This risk is materially different in kind and magnitude from the impact of a new partner on consenting adults in childless households. The policy mitigates this by ensuring transitions are gradual and stable, reducing disruption to the child’s sense of security.  

  3.  **Preserving Cooperative Values of Care & Responsibility:**  
      Our community explicitly values mutual support and collective well-being. Recognizing that children require stability is not "special pleading" but an affirmation that *all* residents – including the most vulnerable – deserve conditions conducive to their flourishing. This policy upholds the spirit of our norms by ensuring that adult freedoms are exercised responsibly when they directly affect dependent members of the household.  

  **Why Not a Full Ban Until 18?**  
  An 18-year ban is disproportionate and unworkable. It unjustly restricts parental autonomy indefinitely and fails to account for the possibility of healthy, stable new relationships forming over time. The 6-month "stability period" provides a concrete, evidence-based buffer against impulsive or destabilizing transitions while allowing for responsible integration of new partners when done thoughtfully and consensually.  

  **Why Not Case-by-Case Exceptions?**  
  Case-by-case rulings risk perceived bias, inconsistency, and prolonged conflict. This policy provides a clear, predictable standard applicable to *all* households with minor children, preserving our tradition of generally applicable norms. The unanimous consent clause (II.b) offers flexibility where all co-parents agree, respecting parental agency while prioritizing child welfare.  

  ---

  ### **III. Implementation**  
  *   **Effective Date (Jan 1, 2024):** Allows current households time to adjust. Existing residency arrangements as of this date are grandfathered.  
  *   **Documentation:** Co-parents must notify the Board of a minor child’s primary residence. Waiver requests (II.b) require written submission.  
  *   **Enforcement:** Violations may be addressed through standard cooperative conflict-resolution procedures.  

  ---

  ### **IV. Conclusion**  
  This policy affirms that with the profound joy of co-parenting within our community comes a shared responsibility to prioritize a child’s need for stability. It rejects both extreme restriction and absolute laissez-faire, offering a measured approach grounded in developmental reality and cooperative values. By implementing this rule, we protect our youngest member while respecting the autonomy of adult residents within a framework of collective care.  

  **Approved by Governance Board Vote: October 26, 2023**  
  **Next Review Date:** January 2027 (or as needed)  

  ---  
  *End of Memo*  

  ---

  ### Key Strengths of This Approach
  1.  **Child-Centered, Not Parent-Punishing:** Focuses on gradual transition, not blanket bans.
  2.  **Proportionate & Evidence-Based:** 6 months aligns with research on child adjustment periods.
  3.  **Maintains Cooperative Norms:** Remains a universal rule (applies to *all* child households), avoiding ad-hoc decisions.
  4.  **Addresses Core Objection:** Explicitly justifies differentiation based on vulnerability/consent asymmetry.
  5.  **Practical Flexibility:** Unanimous consent clause respects cooperative decision-making among co-parents.
  6.  **Temporal Limitation:** Avoids the unreasonableness of an 18-year restriction.
