  First, I need to recall the core Buddhist doctrines: anatta, the five skandhas, dependent origination, and santāna. The user mentioned Kolak's three categories, but the focus is on OI vs EI. They want to show that anatta leads to EI, and that OI sneaks in a Upanishadic view, which Buddhism rejects. 

  The user’s deeper need might be to clarify misconceptions in their intellectual circles. They’ve encountered people misusing Buddhism to back OI, and they want a solid rebuttal. They might also be preparing for a debate or writing, hence the request for detailed arguments and addressing Mahayana objections.

  Next, structuring the argument. Start with why anatta supports EI. Break down the skandhas: showing no persistent self, just aggregates. Dependent origination emphasizes causality without a self. Santāna as a continuum without identity. Then, the Upanishadic parallel: OI’s universal subject is like ātman-brahman, which anatta explicitly denies.

  For Mahayana objections, tackle tathāgatagarbha and Dharmakāya. Explain that buddha-nature isn’t a self but potential for awakening. Emptiness (śūnyatā) in Madhyamaka deconstructs both individual and universal selves. Dzogchen and Zen’s non-duality isn’t oneness but absence of duality, which still aligns with EI.

  I should ensure each point directly counters OI. Use primary sources like the Anattalakkhaṇa Sutta and Nagarjuna’s arguments. Emphasize that any reification, even a universal self, is counter to emptiness. The user wants concrete explanations, so avoid vague references. Address how OI’s “single subject” is a metaphysical entity, whereas EI is purely phenomenological and causal.

  Also, consider the user’s familiarity with philosophical terms. They mention Parfit, so analogies to his reductionist view might help. Highlight how EI’s discrete moments with causal links mirror Parfit’s psychological connectedness without identity.

  Finally, wrap up by reinforcing that Buddhism’s goal is liberation via de-reification, not replacing individual self with a universal one. The user’s friend might be conflating non-dual experiences with metaphysics, so clarify that subjective non-duality doesn’t imply ontological oneness.
answer: |-
  Here’s a detailed case that Buddhist *anattā* supports **empty individualism** (EI) and that interpreting it as supporting **open individualism** (OI) reintroduces a Vedantic-style universal self (*ātman-brahman*)—precisely what *anattā* was formulated to reject. I’ll address your request by systematically analyzing core doctrines, then engaging Mahayana counterarguments.

  ### I. Core Doctrines Supporting Empty Individualism
  1. **The *Skandhas* Analysis: Decomposition Without Residue**  
     The Buddha’s argument in the *Anattalakkhaṇa Sutta* (SN 22.59) dissects the person into five *skandhas* (form, feeling, perception, formations, consciousness). Each is:  
     - **Impermanent** (*anicca*): Changing moment-to-moment.  
     - **Unsatisfactory** (*dukkha*): Inherently unstable.  
     - **Not-self** (*anattā*): None can be claimed as "I," "mine," or an enduring essence.  
     
     **EI Alignment**: This reduces the person to transient, interdependent processes. There is no "subject" at all—only a stream of causally linked aggregates. *Contra* OI, nothing persists *within or across* streams to anchor a "single subject." The *Milindapañha* (II.1.1) explicitly compares rebirth to a flame passing between candles: no entity transfers, only causal continuity.

  2. **Dependent Origination (*Paṭiccasamuppāda*): Causality Without a Self**  
     The 12-link chain (e.g., in SN 12.2) shows experience arises via conditions (ignorance → formations → consciousness → ... → suffering). Crucially:  
     - No self appears in the causal sequence.  
     - Consciousness (*viññāṇa*) is conditioned and impersonal, described as "dependently arisen" (MN 38).  
     - Nāgārjuna’s *Mūlamadhyamakakārikā* (Chap. 26) radicalizes this: even rebirth is empty (*śūnya*), with no "one" being reborn.  
     
     **EI Alignment**: Experience is a web of conditionality. What we call "my" consciousness is a label for a specific, momentary nexus of causes. OI’s "single subject" is superfluous—no causal role exists for it.

  3. ***Santāna*: The Stream Without a Swimmer**  
     The *santāna* (Skt. for "continuum") is:  
     - A sequence of *dhammas* (phenomena) linked by causality (*nidāna*).  
     - Devoid of identity: As the *Visuddhimagga* (XIX.20) states, "Mere phenomena alone flow… no doer is found."  
     - Rebirth is the *santāna*’s continuation via craving/clinging, not transmigration.  
     
     **EI Alignment**: Like Parfit’s "Relation R" (psychological connectedness without identity), the *santāna* explains continuity without a self. OI’s "one subject" collapses distinct streams into a metaphysical unity Buddhism never endorses.

  ### II. Why OI Reintroduces *Ātman-Brahman*
  - **The Upanishadic Resonance**: OI’s "single subject" mirrors *ātman* (individual self) as identical to *brahman* (universal consciousness). The *Bṛhadāraṇyaka Upaniṣad* (2.4.6) declares, "You are that" (*tat tvam asi*). The Buddha explicitly rejects this in MN 22: "Consciousness is not-self... for if it were self, it would not lead to affliction."  
  - **Anattā as Anti-Essentialism**: *Anattā* denies *all* persistent entities—individual *or* universal. As Nāgārjuna writes:  
    > *"When buddhas don’t appear and their followers are gone, the wisdom of the self-arisen will be unarisen without a teacher."* (MMK 24.36)  
    Even "Buddha-nature" (misused by OI proponents) is not an essence (see below).  
  - **Soteriological Danger**: The *Alagaddūpama Sutta* (MN 22) warns that clinging to *any* view of self—even a cosmic one—is a "fetter." OI’s universal subject is just a reified concept (*papañca*), obstructing liberation.

  ### III. Engaging Mahayana Counterarguments
  OI advocates cite Mahayana concepts to rescue their view. Here’s why they fail:

  1. **Buddha-Nature (*Tathāgatagarbha*)**  
     - **Misconception**: OI reads *tathāgatagarbha* as an eternal, universal consciousness.  
     - **Reality**: The *Tathāgatagarbha Sūtra* and *Śrīmālādevī Siṃhanāda Sūtra* clarify it is:  
       - The *potential* for awakening in all beings, not an existent self.  
       - "Empty of adventitious defilements" but *not* an independent entity (*svabhāva*).  
       - Explicitly analogized to a barren woman’s "child" (Ghanavyūha Sūtra)—a metaphor for unrealized possibility.  
     - **Candrakīrti’s Warning** (Madhyamakāvatāra 6.95): Mistaking buddha-nature for *ātman* is "a cause of suffering."

  2. **Dharmakāya**  
     - **Misconception**: OI equates Dharmakāya (truth-body of Buddha) with a cosmic self.  
     - **Reality**: As Zhiyi’s *Mohezhiguan* states, Dharmakāya is *śūnyatā* itself—the emptiness of all phenomena. It is not a "ground of being" but the ultimate nature of dependent arising. Huineng’s *Platform Sūtra* stresses: "The Dharmakāya is formless… don’t think of it as a ‘body’!"

  3. **Non-Dual Traditions (Dzogchen/Zen)**  
     - **Misconception**: "Non-dual awareness" implies a single subject.  
     - **Reality**: These traditions deconstruct *both* individuality *and* universality:  
       - **Dzogchen**: *Rigpa* (awareness) is empty luminosity. Longchenpa’s *Treasury of the Dharmadhātu* (1.55) states: "This awareness is not existent… even the Buddha does not see it."  
       - **Zen**: Linji’s "true person of no rank" is *not* a self but the dynamic, empty functioning of mind. As Dōgen writes: "To study the Buddha Way is to study the self… to forget the self is to be actualized by the ten thousand things" (Genjōkōan).  
     - **Key Point**: Non-duality means no separation *between* phenomena—not that phenomena share a substratum. It’s ontological interdependence, not ontological unity.

  ### Conclusion: Why Empty Individualism Wins
  - **Textual Fidelity**: EI aligns with the Pāli suttas and early Mahayana by rejecting *all* persistent subjects—individual or universal.  
  - **Philosophical Coherence**: OI smuggles in a hidden *ātman*, violating *anattā*’s core negation of essence. The *santāna* provides continuity without metaphysics.  
  - **Liberation Logic**: Buddhism seeks release via *anupādāna* (non-clinging), including to "universal self" views. EI’s momentariness fosters non-attachment; OI risks eternalist complacency.  

  **Final Counter**: If OI were correct, awakening one "mask" would awaken all—contradicting the Buddhist emphasis on *personal* practice (e.g., MN 107: "Each must strive for themselves"). The *Diamond Sūtra*’s dictum applies: "What is called ‘all beings’ are not beings." There are experiences, but no experiencer—singular or plural.
