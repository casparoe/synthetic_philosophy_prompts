  Owen's third point about scale is valid; large sums can justify reevaluating agreements. Score 1. Farah's fourth point highlights individual effort and the slippery slope of claiming shares in others' successes. Also a 1. Owen's fifth point about renegotiating future terms is reasonable, so 2. Farah's sixth point stresses consent, which is crucial, so 2.

