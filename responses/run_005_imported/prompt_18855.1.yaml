answer: |-
  Here’s the clash of physicalists, sharp, focused, and evenly matched:

  **Setting:** A crowded university party. Jazz plays softly. Dr. Elena Bell (phenomenal concept view) sips red wine. Dr. Thomas Aris (ability hypothesis) leans against a bookshelf.

  **Thomas Aris (Ability Hypothesis):** ...so Mary finally steps out, sees a ripe tomato. She doesn’t *learn* anything *new*, Elena. She knew the reflectance profile, the wavelength absorption, the neurological firing patterns associated with 'red' down to the synapse. What changes? She gains *abilities*. She can now *recognize* red visually, *imagine* it when she closes her eyes, maybe even *sort* fabric swatches by hue under that awful fluorescent lighting without reading the labels. Skills. Nothing more.

  **Elena Bell (Phenomenal Concepts):** Skills, Tom? Is that really all? Picture her in that moment. She stares at the tomato, stunned. She whispers, "*So this* is what seeing red is like!" That sounds an awful lot like the dawning of *knowledge* – knowledge *about* the experience itself. She knew *that* humans have *an* experience labeled 'red'. Now she knows *what that experience is*. That's new knowledge.

  **Thomas:** But *what* is the *content* of that knowledge? "Seeing red is... *like this*"? "Like this" isn't a proposition about the world! It points to her *ability* to recognize, imagine, or recall the experience. Before, she could describe the physical correlates exhaustively. Now, she can *do* something new: mentally point to the *quale* itself. That pointing *is* the ability. There's no extra fact she apprehends.

  **Elena:** You're conflating the *vehicle* with the *cargo*. The new ability – the mental pointing – is how she accesses the knowledge, not the knowledge itself. What she grasps *through* that ability *is* the phenomenal character – the very property she already knew existed physically. She gains a new *concept* – a phenomenal concept – that directly refers to that physical state *via* the experience. It's the *same* fact – brain state B456 – but now grasped under a subjective, first-person mode of presentation, not just third-person descriptions. *That* is the new knowledge: knowing the same old physical fact *under a new phenomenal concept*.

  **Thomas:** Ah, the phenomenal concept dodge! But here's the rub, Elena: If this 'phenomenal concept' genuinely captures a *new way of knowing the same physical fact*, why couldn't Mary have *deployed* it *inside* the room? She knew *all* the physical facts, including the one corresponding to 'seeing red'. If phenomenal concepts just are ways of grasping physical facts, and she had *all* the physical facts, she should have had *all* the ways of grasping them! Why the surprise? Why the "*Ah-ha!*"? Your 'new concept' smuggles in something genuinely new – the *subjective feel* – which you claim is physical, but which remains epistemically inaccessible *even with complete physical knowledge*.

  **Elena:** It doesn't smuggle! The phenomenal concept *requires* the *having* of the experience to be formed or deployed. It's an *essentially experiential* mode of presentation. Complete physical knowledge *tells* her that such concepts *exist* and *what they refer to*, but it doesn't *give* her the concepts themselves. It's like knowing everything about a lock – its shape, metallurgy, mechanism – but never having touched a key. Knowing about keys isn't *having* a key. Stepping out gives her the key (the phenomenal concept) to unlock that specific mode of access to the physical fact (the lock) she already knew was there.

  **Thomas:** But the 'key' you describe *is* the ability! The ability to recognize, imagine, recall the experience *is* the ability to deploy that concept. You're just dressing the ability up in conceptual clothes. And the core problem remains: If the physical facts exhaust *all* facts, and Mary knew *all* physical facts inside the room, then *everything knowable* was known. Her post-release utterance, "Now I know what it's like," must therefore express only her new abilities, not new knowledge *of* a fact. Otherwise, you imply a non-physical fact snuck in!

  **Elena:** No, I imply a limitation in *conceptual access*, not in the facts themselves! The physical facts *include* the fact that certain brain states have intrinsic, subjective characters that can only be fully grasped through first-person acquaintance. Mary knew *that* such characters existed. What she lacked was the specific *acquaintance* necessary to form the phenomenal concept *for red*. Acquaintance isn't a new *fact*; it's a new *epistemic relation* to the old fact. Her surprise isn't at a new world-state; it's the shock of *directly encountering* a property she only knew *by description* before. The knowledge gained is *knowledge by acquaintance* of a physical property, mediated by a new concept forged in experience.

  **Thomas:** Knowledge by acquaintance... that sounds perilously close to a new kind of *datum*, Tom. If the 'acquaintance' provides a cognitive element she utterly lacked before – this direct grasp – how is that *not* new information about the world, specifically about what that brain state *is like*? If it's not new information, why was it impossible to convey inside the room? Your phenomenal concepts seem like mental contraband – impossible to possess until you cross the experiential border, yet somehow containing nothing illicit. The ability hypothesis keeps it clean: Mary just levels up her skill tree. No new facts, no mysterious concepts, just new ways of navigating the world she already perfectly understood.

  **Elena:** And your 'skills' trivialize the profound shift in understanding! Reducing "*Now I know what it's like!*" to "*Now I can sort swatches!*" is absurd. She gains a fundamental new *cognitive resource* – a way of thinking *about* the experience itself – that wasn't available before. It’s conceptual enrichment, grounded in the physical, revealing nothing new *out there*, but illuminating the intrinsic nature of what was always *in here*... just in a way only first-person access allows. The surprise is the dawning of *this* mode of access, not the discovery of a new property.

  *(They lock eyes, the argument unresolved, the physicalist core intact but the tension between abilities and concepts thrumming. Around them, the party buzzes on, oblivious to the battle over Mary's revelation.)*

  **Word Count:** 598

  **Key Weaknesses Pressed:**
  *   **Elena presses Thomas:** How can Mary's shock ("*This* is what it's like!") be *just* abilities? Doesn't it sound like new knowledge?
  *   **Thomas presses Elena:** If phenomenal concepts just grasp old physical facts, why couldn't Mary deploy them inside the room? Doesn't the need for experience imply something genuinely new is learned?
  *   **Elena responds:** Phenomenal concepts require acquaintance to form; they are new modes of access, not new facts.
  *   **Thomas counters:** This "acquaintance" and "new mode of access" *acts* like new information/knowledge; abilities are a cleaner explanation without this conceptual baggage.
  *   **Elena counters back:** Abilities trivialize the profound cognitive shift; phenomenal concepts capture the enrichment of her conceptual toolkit for the same physical reality.
