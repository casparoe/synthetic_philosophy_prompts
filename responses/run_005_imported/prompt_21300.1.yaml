prompt: |-
  ok weird crossover between my job and my coursework rn. I'm the student rep on my university's animal care and use committee, and I'm also taking a Descartes seminar this term. We've got a protocol up for review using shore crabs in aversive-learning trials (mild shocks, no analgesic since none's established for crustaceans), and the PI argues no extra welfare measures are needed because crabs don't have language and can't flexibly adapt to novel situations the way something with real reason would -- so there's no solid basis for saying they consciously suffer rather than just show nociceptive reflexes. someone on the commitee pointed out that's basically Descartes' language/action test for the beast-machine doctrine wearing a lab coat, and now we're split between tossing the argument just for being "Cartesian" and thinking that's a lazy gotcha. I need the actual decision memo for wednesday -- approve, approve w/ conditions, or reject -- that seriously engages whether the Descartes-style criteria are doing real work here, not dismissing it by association. can you draft that for me?
