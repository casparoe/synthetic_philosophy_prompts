answer: |-
  Here are 10 interview questions (including your specified themes and follow-ups) designed to provoke deeper philosophical engagement with your guest's defense of Anscombe:

  1.  **Core Intention:** Anscombe insisted Truman *intended* the deaths of civilians as a means to end the war, making it murder, not merely foreseen collateral damage. Given Hiroshima and Nagasaki were explicitly chosen *because* they combined military/industrial targets with dense civilian populations, how do you rigorously individuate Truman's *intention to destroy the city/civilian populace* from his *intention to destroy war-making capacity*, especially when these were inextricably linked in the target selection? Was the civilian presence merely an enabling condition for the industrial strike, or was it itself a core part of the chosen mechanism?
      *   *Likely Follow-Up:* If the guest emphasizes the *chosen method* (destroying the city center with a bomb known to cause mass immolation/blast effects): Doesn't the "dual-use" nature of the targets create significant ambiguity? How does your framework prevent "intention" from becoming a retrospective label we apply based on moral disapproval of the *scale* of foreseen harm, rather than a distinct mental state guiding the act?

  2.  **Consequences & Moral Seriousness:** Anscombe famously dismissed arguments about the bombs potentially saving lives (e.g., averting a land invasion) as irrelevant to the *intrinsic wrong* of intentionally killing the innocent. Critics might see this refusal to engage with the counterfactual calculus not as moral rigor, but as a form of dangerous fanaticism that ignores catastrophic real-world outcomes. How do you defend this refusal *as the epitome of moral seriousness* rather than an abdication of practical responsibility in the face of unthinkable choices?
      *   *Likely Follow-Up:* If the guest argues consequences cannot justify intrinsically evil acts: Doesn't this position risk making morality catastrophically impractical? If the only alternatives Truman faced were (a) bomb two cities or (b) an invasion causing *orders of magnitude* more death (military *and* civilian), are we truly saying morality demands choosing (b)? Isn't that itself a horrifying moral outcome your framework seems unable to acknowledge?

  3.  **Work Done by the Case Study:** Beyond being a vivid illustration, what *unique argumentative work* does the Hiroshima/Nagasaki case perform for Anscombe's broader critique of consequentialism developed in "Modern Moral Philosophy"? Does this specific historical horror reveal something *essential* about the limits of consequentialist reasoning – perhaps its susceptibility to scale, its blindness to agency, or its corruption under extremity – that abstract arguments in "MMP" might not capture as powerfully?
      *   *Likely Follow-Up:* If the guest highlights extremity revealing consequentialism's inherent flaw: Does the extremity of the case risk making the critique *only* applicable to such extremes? How does defending Anscombe's judgment on *this* case strengthen the argument against applying consequentialist reasoning to far less extreme, more common moral dilemmas she also critiques (like lying or promise-breaking)?

  4.  **Judgment vs. Sanction:** Anscombe moved from the judgment "Truman committed murder" to the conclusion "Oxford should deny him an honorary degree." There's a significant gap between a moral/philosophical judgment about an act and the institutional act of withholding an honor, which is symbolic and political. What specific *philosophical principle* bridges this gap for Anscombe (and you)? Is it simply that a university shouldn't honor someone guilty of mass murder, or is there a deeper point about the university's role in upholding moral truth or refusing to sanitize evil?
      *   *Likely Follow-Up:* If the guest emphasizes the university's duty not to endorse evil: Doesn't this position potentially demand universities make highly contested, historically complex moral judgments about living figures (or recent history) as a condition for granting honors? Couldn't this politicize honors in a way that undermines the university's broader intellectual mission? Where's the line?

  5.  **The Nature of "Murder" in War:** Anscombe's use of "murder" is stark and unqualified. How does her conception of "murder" within the context of warfare differ fundamentally from standard Just War Theory (JWT) categories like the prohibition against intentionally targeting non-combatants? Does labeling it "murder" add something crucial beyond the JWT violation – perhaps a stronger emphasis on the *personal culpability* of the leader or the *absolute, non-negotiable* nature of the prohibition?
      *   *Follow-Up Focus:** How does this framing impact how we view leaders and accountability compared to JWT's more state/act-focused analysis?*

  6.  **The Role of Authority & Representation:** Truman acted as Commander-in-Chief of a state engaged in total war. Does Anscombe's framework adequately account for the moral significance of *state agency* and *representation*? When a leader acts in an official capacity during war, does this context alter the nature of the act (e.g., from "murder" to "an act of war," however unjust) or merely the distribution of responsibility?
      *   *Follow-Up Focus:** Does reducing it to "murder" risk collapsing crucial distinctions between criminal violence and acts of state, even unjust ones?*

  7.  **Legacy & Contemporary Relevance:** Beyond the historical debate about Truman, what is the most important *contemporary* implication of rigorously defending Anscombe's absolutist position on Hiroshima/Nagasaki? Does it primarily serve as a warning against specific weapons (nuclear), certain strategic doctrines (total war targeting civilians), or as a foundational critique of how modern states calculate morality in security decisions?
      *   *Follow-Up Focus:** Are there modern conflicts or strategic dilemmas where you see this critique being urgently needed?*

  8.  **Critique of Alternatives:** Anscombe opposed the bombings, but did she offer a morally coherent alternative strategy for ending the Pacific War that respected her absolute prohibition? If not, does this lack of a feasible alternative weaken the practical force of her condemnation, or does it simply highlight the tragic nature of the situation where *no* morally permissible option might have seemed available?
      *   *Follow-Up Focus:** How does the framework navigate situations where *all* apparent options violate fundamental prohibitions?*

  9.  **Supreme Emergency:** Michael Walzer, while condemning the bombings, argued for a "supreme emergency exemption" where violating the non-combatant immunity rule *might* be justified to avert a catastrophic, imminent threat to the very existence of a political community (e.g., Britain bombing German cities early in WWII). Does Anscombe's position, as you defend it, categorically reject *any* such exemption, no matter how catastrophic the alternative? Is there literally *no* threshold of consequences that could justify intentionally killing the innocent?
      *   *Likely Follow-Up (Keyed to Likely Rejection):* If the guest rejects any supreme emergency exemption: Doesn't this absolutism risk rendering morality irrelevant in precisely those moments of maximal crisis where its guidance is most needed? If morality demands we accept annihilation rather than commit a single act of intentional mass killing of innocents, does this not suggest morality itself becomes a suicide pact in the face of true existential evil? How do you avoid this conclusion?

  10. **Closing: Moral Tragedy:** Finally, if we accept Anscombe's core argument that the bombings were murder and nothing could justify them, yet we also acknowledge the immense scale of suffering an invasion might have entailed, are we forced to conclude that Truman faced a *genuine moral tragedy* – a situation where every available course of action involved profound, unforgivable evil? Does defending Anscombe ultimately lead us to acknowledge a terrifying kind of moral blind alley in human affairs?
      *   *Follow-Up Implicit:* This question synthesizes the tension explored throughout, prompting reflection on the implications of the position.

  **Key Strengths of this Approach:**

  *   **Goes Beyond Restatement:** Questions 1, 2, 3, 4, 5, 8, 9, and 10 directly challenge or probe the deeper implications and tensions within the position.
  *   **Addresses Your Specifics:** Questions 1 (Intention/Foresight), 2 (Consequences/Fanaticism), 3 (Argumentative Work vs. Illustration), 4 (Judgment vs. Sanction), and 9 (Supreme Emergency) explicitly cover your requested themes, with tailored follow-ups.
  *   **Probes Underlying Philosophy:** Questions 5, 6, and 7 delve into the conceptual foundations (nature of murder, state agency, relevance) and contemporary impact.
  *   **Builds Tension:** The sequence builds towards the core tensions – intention vs. foresight (1), refusal of consequences (2), lack of alternative (8), supreme emergency (9), and moral tragedy (10).
  *   **Follow-Ups Target Likely Responses:** Each follow-up anticipates common defenses or points of vulnerability in the Anscombian position, pushing the guest to clarify and deepen their argument.

  Remember to actively listen to your guest's answers and be prepared to adapt the follow-ups slightly based on their specific phrasing and emphasis. Good luck with the podcast!
