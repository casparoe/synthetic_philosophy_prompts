answer: |-
  Your argument is admirably clear, forcefully articulated, and engages deeply with the core tension between Bratman and Gilbert. Here’s a breakdown addressing your three specific queries:

  1.  **Fairness to Bratman’s Interdependence/Self-Governance Move:**
      *   **Accurate Representation:** You represent Bratman’s later move (interdependence, conditional intentions, reliance) accurately and fairly. You correctly characterize his *aim* with this move: to explain why abandonment is costly, undermines the other’s self-governance (by thwarting their reasonable reliance on your persistence), and is irrational (because it violates the conditions under which they formed their own interdependent intention). You avoid straw-manning by explicitly acknowledging the sophistication of this move and its purpose.
      *   **Precise Critique:** Your critique that this move delivers "a complaint about impaired self-governance, not a debt owed to that other person *as such*" is precisely the point Gilbert would make and is the crux of the unresolved issue. You correctly identify that Bratman frames the wrong as a disruption *to the agent's own plans and agency* based on broken reliance, rather than a violation *of an obligation owed specifically to the co-agent*. This distinction is crucial and well-drawn.

  2.  **Effectiveness of the Wardrobe Case:**
      *   **Doing Real Work:** The wardrobe case is **excellent** and **essential** to your argument. It does significant work:
          *   **Concreteness:** It vividly illustrates the practical coordination and vulnerability inherent in joint action.
          *   **Normative Punch:** It effectively isolates the specific normative phenomena Gilbert emphasizes – the *directed* rebuke and the *specific* requirement for release/concurrence. The "solo plan disappointment" contrast is perfect for highlighting what Bratman *might* capture (disrupted expectation/reliance) vs. what Gilbert claims he misses (directed obligation/debt).
          *   **Irreducibility Test:** The case forces the question: "Can the *specificity* of the rebuke (why *she* gets to rebuke *him*) and release (why *she* must concur) be explained *only* by the disruption of individual planning states and mutual reliance, or does it require something more (like a joint commitment)?" Your argument leans convincingly towards the latter.
      *   **Sharper Contrast?** The wardrobe case is hard to beat for clarity and normative force. Alternatives (e.g., painting a house together, singing a duet, walking side-by-side) might work, but the physical interdependence and immediate consequence of letting go in the wardrobe scenario make the normative stakes particularly stark and undeniable. **Stick with the wardrobe.**

  3.  **The Gap: Principled Limit or Contingent Shortfall?**
      *   **Your Argument's Strength:** Your argument, as stated, *strongly suggests* this is a **principled limit** for *any* account attempting to reduce shared intention *solely* to individual attitudes plus mutual belief/knowledge/interdependence.
      *   **Why Principled?** You identify the core issue: directed obligations/debts (owed *to* the specific co-agent) and correlative entitlements/authorities (held *by* the specific co-agent, like the right to rebuke or release) seem fundamentally relational and *bilateral* in a way that doesn't readily emerge from a structure built *only* from individual states (intentions, beliefs, dispositions to rely) held severally, even if they are interdependent and commonly known.
      *   **Searle & Tuomela:** Your brief comment on Searle ("they too are simply had by individuals, one by one") hits the nail on the head. Searle's we-intention is an individual attitude with collective content ("we intend"). While the *content* is collective, the *mode of possession* is individual. The question remains: how does an individual having an attitude with the content "we intend" *generate* a directed obligation *to another specific individual*? Searle doesn't provide a clear mechanism within his irreducible "we-intention" itself to generate this specific bilateral normative relation. Tuomela's we-mode (especially in its stronger forms) comes closer by incorporating collective commitment and group reasons. However, if the "collective commitment" is ultimately analyzed as a complex pattern of individual we-mode attitudes (intentions, beliefs about commitment) plus interdependence and mutual belief, it arguably faces the *same challenge* as Bratman: explaining how this pattern generates obligations *owed specifically to fellow members* and not just general obligations to "the group" or irrationality in violating interdependent commitments. Tuomela might *stipulate* that we-mode attitudes involve mutual obligations, but the *explanatory burden* remains to show how this mutual obligation arises *from* the individual we-mode attitudes without smuggling in a Gilbertian joint commitment. Your argument implicitly raises this burden.
      *   **Could a Resourceful Reductionist Patch It?** This is the hardest question. A truly "resourceful reductionist" (e.g., inspired by Lewisian conventions, sophisticated game theory, or complex mutual recognition theories) *might* attempt to build bilateral normative relations out of individual attitudes plus complex structures of interdependence, common knowledge, expectations, sanctions, and perhaps bootstrapped mutual promises. **However, your argument effectively shows that Bratman's *current* framework, even with interdependence, doesn't achieve this.** More importantly, you identify the *explanatory gap* that any such reductionist must bridge: moving from "My plan relied on you, your change broke my reliance and made my action irrational" (self-governance impaired) to "You specifically owe *me* completion/apology, and *I* specifically have the authority to release you" (directed debt/entitlement). Gilbert argues this gap *cannot* be bridged reductively because the obligations are constitutive of the joint commitment itself. Your argument, by clearly delineating this gap using the wardrobe case and analyzing Bratman's move, **strongly supports the principled limit interpretation** and raises a formidable challenge for *any* purely individualistic account, including Searle's and Tuomela's, unless they can explicitly demonstrate how the bilateral normative relations emerge *without* relying on an implicit joint commitment.

  **Conclusion on Earning its Conclusion:**

  Your argument **successfully earns its core conclusion**: Bratman's interdependence move, while addressing reliance and impaired self-governance, fails to account for the directed obligations and entitlements highlighted by Gilbert and exemplified in the wardrobe case. Furthermore, your analysis strongly suggests this failure points to a **principled limit** for accounts seeking to ground shared intention *exclusively* in individual attitudes (even interdependent ones with collective content) plus mutual belief/knowledge. You fairly represent Bratman, deploy the wardrobe case effectively to expose the gap, and provide a compelling reason to think this gap is not merely contingent to Bratman's specific formulation but inherent to the reductive project. While the door isn't *absolutely* slammed shut on a "more resourceful reductionist," you've erected a very significant barrier they must overcome.

  **Minor Strengthening Suggestion:** You could briefly preempt a potential reductionist counter that "entitled to rely on" *can* ground directed obligations by explicitly stating that in standard reliance/estoppel contexts, the reliance itself is often grounded in a prior promise, representation, or agreement *between the parties*, which is precisely what Gilbert's joint commitment provides and what the reductive account lacks as a foundation for the *specific* entitlement/reliance in joint action. This reinforces your point about "smuggling in."
