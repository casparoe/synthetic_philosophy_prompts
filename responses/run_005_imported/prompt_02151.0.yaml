  The key to spurious unanimity is to have a situation where the individuals agree on the desirability of a social alternative even though they have different beliefs, but the agreement is driven entirely by their divergent beliefs.

  Consider this:

  **Alternative 3:** A lottery that gives each person a contract that pays $100 if the state they think is more likely occurs, and $0 otherwise. But that is not well-defined because we cannot condition on their beliefs. Instead, we condition on the state.

