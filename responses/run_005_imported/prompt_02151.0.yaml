  - U': total 110
  - So Charlie prefers U'.

  Therefore, we have a situation where both Alice and Bob prefer T over U', but Charlie (with equal probabilities) prefers U' over T. And note that any other belief system that is a single probability might also prefer U' if the total is higher. But wait, is there a single probability that would make T better? The total in T is 100, in U' is 110. So no matter what the probability of rain, the expected total of T is 100 and of U' is 110. So any utilitarian with a single probability would prefer U'. But Alice and Bob both prefer T because they each think they have a 90% chance of getting $100 (which they value more than $55) and only 10% chance of getting $0.

  So we have:

  - Alice and Bob unanimously prefer T to U'
  - But from a social perspective (with any single probability distribution) the total is 100 in T and 110 in U', so U' is better.

  Therefore, the unanimity is spurious because it leads to a choice that is worse in terms of actual total utility (if we take the true probability or any single probability) and in fact, it is driven by their disagreement about the probabilities.

  This is the minimal example: two individuals, same linear utility, but different beliefs. They both prefer a state-contingent allocation (T) that pays $100 to one and $0 to the other (depending on the state) over a sure $55 for each. But the sure $55 for each gives a total of $110, which is higher than the $100 total in T. So society as a whole would be better off with U'. However, because each individual is over-optimistic about the state in which they get the money, they both expect a high payoff from T.

  ### Part 2: Why is this "spurious unanimity" normatively troubling?

  The unanimity in the example is spurious because it is not based on a shared understanding of the world. Instead, it is based on mutually inconsistent beliefs. The troubling aspect is that if we take the Pareto principle at face value (if everyone prefers option A to option B, then society should prefer A to B), then we are forced to choose T over U'. However, this leads to a sure loss in total utility (from 110 to 100). 

  Moreover, the choice of T over U' is inefficient: it is possible to make both individuals better off in every state of the world by choosing U' (because in every state, the total is higher in U' than in T). But note: in T, in each state one individual gets $100 and the other $0, so one is worse off than in U' (where they get $55). However, because of their beliefs, they both expect to be the winner and hence prefer T. 

  The normative concern is that the Pareto principle in this case is driven by an illusion. If we could reveal the true state, then in every state of the world, at least one person (and sometimes both) would be worse off in T than in U'. Specifically:
  - In rain: Alice gets $100 in T (which is more than $55) but Bob gets $0 (which is less than $55).
  - In shine: Alice gets $0 (less than $55) and Bob gets $100 (more than $55).

  So in every state, there is a loser and a winner. But the winner gains $45 (100-55) and the loser loses $55 (0-55). So the net loss is $10. Therefore, T is actually a risky allocation that creates a zero-sum transfer and reduces the total. 

  The spurious unanimity is troubling because it shows that the Pareto principle (when applied ex ante, i.e., before the state is known) can lead to choices that are ex post Pareto inferior. After the state is known, we see that one person is worse off and the total is lower. And if we could choose U', we would have a sure improvement in total and both individuals would be better off in every state? Wait, no: in U', both get $55, but in T, in each state one gets $100 and the other $0. So compared to U', in T the winner is better off ($100 > $55) and the loser is worse off ($0 < $55). So it is not ex post Pareto comparable: in each state, one is better off and the other worse off.

  But note: the total in T is 100 and in U' is 110. So if we could redistribute the money in U', we could make both better off. For example, if we take U' (which gives 110) and then redistribute as (55,55), then if we compare to T (which gives either (100,0) or (0,100)), we see that in T the total is less. So if we are allowed to redistribute, we could take the 110 and give, say, 60 to each and have 10 left over (but then that would be 120? wait, no: 55+55=110). Alternatively, if we start from U' (55,55) and we want to compare to T, we see that T is inefficient. The allocation T is actually on the Pareto frontier? Not necessarily.

  The inefficiency comes from the fact that T is a gamble that both individuals take because of their different beliefs, but it is a gamble that has a negative expected total return if we use a single probability. In our example, the total in T is 100 and in U' is 110, so it's clear. But in reality, the true probabilities might be somewhere in between. However, any single probability would lead to the same conclusion: the expected total of T is 100 and of U' is 110. So T is worse.

  The normative trouble is that the Pareto principle (if everyone prefers T to U', then society should too) forces us to choose an allocation that is inefficient and that, if we had a single consistent set of beliefs, we would reject. This suggests that the ex ante Pareto principle (which is applied before the resolution of uncertainty) can be manipulated by divergent beliefs and lead to socially suboptimal outcomes.

  ### Part 3: Assessment of the damage to Harsanyi's theorem as an argument for utilitarianism

  The original Harsanyi theorem is a strong argument for utilitarianism under the assumption of shared beliefs (or "risk" as opposed to "uncertainty"). In that context, the affine aggregation (which becomes a weighted sum of utilities) is compelling. However, when individuals have different beliefs, the theorem breaks down and we get the spurious unanimity problem.

  The restriction of the Pareto principle to situations where beliefs coincide is a significant limitation. In real-world policy decisions, individuals often have different beliefs about the likely outcomes of policies. Therefore, if we want to use the Harsanyi framework, we must either:

  1. Restrict the application of the Pareto principle to cases where beliefs are shared (which may be rare), or
  2. Find a way to aggregate beliefs as well as utilities.

  But aggregating beliefs is a separate and difficult problem. Some have proposed that we should use an "ex post" approach: first aggregate beliefs (to form a social belief) and then aggregate utilities given that social belief. However, this approach has its own problems and may not satisfy the same Pareto conditions.

  The damage to the popular claim that Harsanyi's theorem underwrites utilitarianism is substantial. It shows that the theorem does not straightforwardly extend to the more common situation of heterogeneous beliefs. Therefore, the theorem cannot be used to justify utilitarianism in the broad sense of simply adding up utilities when individuals disagree about probabilities.

  However, it is important to note that Harsanyi's theorem still stands as a powerful result for the case of shared beliefs. In many economic models, it is assumed that probabilities are objective and known, and in that context, utilitarianism is justified. But in the more general and realistic setting of subjective beliefs, the argument becomes much more complex.

  In summary, the restriction to shared beliefs is not just a minor technical patch; it concedes a significant part of the original result's applicability. The original result is interesting because it provides a foundation for utilitarianism from individual preferences under uncertainty. But the extension to heterogeneous beliefs is problematic, and without it, the theorem is less compelling for real-world applications where belief disagreements are common.

  Therefore, while Harsanyi's theorem remains an important milestone, it does not provide a complete justification for utilitarianism in the general case of subjective uncertainty.
answer: |-
  ### Walkthrough of the Belief Disagreement Problem in Harsanyi's Theorem

  I'll break this down step by step with a concrete example, focusing on your three requests. The core issue is that Harsanyi's theorem assumes everyone agrees on the probabilities of outcomes ("shared beliefs"). When this assumption is violated, the theorem's utilitarian conclusion (i.e., "just add up everyone's utilities") can lead to paradoxical results.

  ---

  #### **1. Minimal Concrete Example: The Divergent Beliefs Bet**
  Imagine two people, Alice and Bob, who both value money linearly (i.e., their utility = dollars). They face a choice between two options:  
  - **Option A:** A bet paying $100 if it rains tomorrow, $0 if sunny.  
  - **Option B:** $45 in cash, guaranteed.  

  Now, suppose Alice and Bob have **different beliefs** about the weather:  
  - Alice thinks rain is 90% likely (\(P_{\text{Alice}}(\text{rain}) = 0.9\)).  
  - Bob thinks rain is 10% likely (\(P_{\text{Bob}}(\text{rain}) = 0.1\)).  

  **Individual preferences:**  
  - Alice calculates her expected utility (EU) for Option A:  
    \(EU_{\text{Alice}}(A) = (0.9 \times 100) + (0.1 \times 0) = 90\)  
    She prefers A (EU=90) over B (EU=45).  
  - Bob calculates his EU for Option A:  
    \(EU_{\text{Bob}}(A) = (0.1 \times 100) + (0.9 \times 0) = 10\)  
    He prefers B (EU=45) over A (EU=10).  

  *No unanimity yet.*  

  **Now, introduce Option C:**  
  - **Option C:** A bet paying $100 if it is **sunny** tomorrow, $0 if rainy.  

  **Preferences change:**  
  - Alice's EU for C: \( (0.9 \times 0) + (0.1 \times 100) = 10 \) → Still prefers A (90 > 10).  
  - Bob's EU for C: \( (0.1 \times 0) + (0.9 \times 100) = 90 \) → Prefers C over B (90 > 45).  

  *Still no unanimity between A and C.*  

  **The "spurious unanimity" scenario:**  
  Define a new option:  
  - **Option D:** A **social choice** where:  
    - If it rains, Alice gets $100 and Bob gets $0.  
    - If it’s sunny, Alice gets $0 and Bob gets $100.  

  Now compare Option D to a **fixed alternative**:  
  - **Option E:** Both get $50 guaranteed (total $100).  

  **Alice and Bob's preferences for D vs. E:**  
  - Alice’s EU for D:  
    \( (0.9 \times 100) + (0.1 \times 0) = 90 \)  
    EU for E: 50 → **Prefers D**.  
  - Bob’s EU for D:  
    \( (0.1 \times 0) + (0.9 \times 100) = 90 \)  
    EU for E: 50 → **Prefers D**.  

  👉 **Result:** Alice and Bob **unanimously prefer D over E**.  

  **Why is this unanimity "spurious"?**  
  - Both prefer D because each expects a 90% chance of winning $100 (due to their divergent beliefs).  
  - But in reality, only one can "win" depending on the weather. The total payout is always $100 (same as E).  
  - Critically, D is **strictly worse** than E for *any observer with consistent beliefs*. For example:  
    - A "shared-belief" observer (Charlie) who thinks rain is 50% likely:  
      - EU of D for society: \( (0.5 \times 100) + (0.5 \times 100) = 100 \)  
        (since total money = $100 in all states)  
      - EU of E for society: \(50 + 50 = 100\)  
      → Charlie is indifferent.  
    - But if E is replaced with **Option E'**: Both get $55 guaranteed (total $110):  
      - Alice and Bob still prefer D (EU=90) over E' (EU=55).  
      - Charlie prefers E' (sure $110 > $100 from D).  

  👉 **Problem:** Alice and Bob’s unanimity for D over E' is driven solely by their incompatible beliefs. No single coherent belief system would endorse D over E' (since D pays less total money in every possible world). The Pareto principle ("if everyone prefers X, society should too") forces society to choose an option that is objectively inferior under any consistent worldview.

  ---

  #### **2. Why "Spurious Unanimity" is Normatively Troubling**
  This isn’t just a bookkeeping quirk—it reveals a deep flaw in preference aggregation under belief disagreement:
  - **Illusory gains:** Unanimity arises because Alice and Bob both overestimate their odds of winning. Society "prefers" D based on mutually inconsistent fantasies (Alice thinks rain is likely; Bob thinks sun is likely). In reality, the winner’s gain equals the loser’s loss, but both expect to be the winner.
  - **Ex-post inefficiency:** After the weather is revealed, one person always gets $0 (worse off than E') while the other gets $100. The loser regrets the choice, but the decision was made based on ex-ante preferences.
  - **Moral hazard:** If society defers to unanimous preferences, individuals are incentivized to exaggerate beliefs to manipulate outcomes (e.g., lobbying for policies that exploit others’ misestimates).
  - **Violates the "spirit" of Pareto:** Pareto improvements are meant to reflect genuine welfare gains. Here, unanimity masks a **zero-sum gamble** disguised as mutual benefit. Harsanyi’s original framework assumes preferences reflect "true" values, not belief artifacts.

  ---

  #### **3. Impact on Harsanyi’s Theorem as a Foundation for Utilitarianism**
  The belief-disagreement problem isn’t a minor technicality—it undermines the theorem’s core appeal for real-world applications:
  - **The original theorem’s strength:** Under shared beliefs, Harsanyi shows that utilitarianism (weighted utility summation) is the **only** rational way to satisfy Pareto and vNM rationality. This feels like a "proof" of utilitarianism.
  - **The collapse under belief disagreement:**  
    - Spurious unanimity violates the **ex-post Pareto principle** (after uncertainty resolves, society may not improve everyone’s welfare).  
    - The theorem’s conclusion (affine aggregation) **fails** because utilities can’t be cardinally compared when probabilities differ.  
  - **The "patch" and its cost:**  
    - Later work (e.g., Mongin) restricts Pareto to cases where beliefs *already agree*. This "saves" the theorem mathematically but:  
      - Concedes that utilitarianism **only works when there’s no fundamental disagreement** about how the world works.  
      - In practice, most policy debates (climate, economics, AI risk) involve deep belief disagreements.  
    - Alternative approaches (e.g., "ex-post aggregation") require first aggregating beliefs into a social probability, *then* utilities. But this is arbitrary: Why weight beliefs by the same utilitarianism rule?  
  - **Verdict:**  
    The belief-disagreement problem quietly **concedes most of what made Harsanyi’s result interesting** for real-world ethics. It reduces the theorem to a technical curiosity applicable only in narrow, consensus-driven settings (e.g., gambling with agreed-upon odds). For AI alignment, this implies:  
    > *You can’t naively add up individual utilities under belief uncertainty. You must first resolve belief disagreements or risk encoding spurious conflicts.*  

  The theorem remains a milestone in decision theory, but its failure under belief heterogeneity reveals a gap between abstract rationality and messy human diversity. Utilitarianism needs more than Harsanyi to survive the real world.
