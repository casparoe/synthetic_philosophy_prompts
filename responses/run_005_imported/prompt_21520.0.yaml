answer: |-
  Here’s a eulogy honoring your grandmother’s worldview while offering genuine comfort, rooted in Borges' paradox of intellectual refutation and lived experience. It avoids smuggling in the "enduring self" or "flowing time" she rejected:

  ---

  **Eulogy for [Grandmother's Name]**

  Thank you all for being here. We gather today heartbroken by the absence of [Grandmother's Name]. For many of us, she was the brilliant Comp Lit professor, the fierce intellect, the woman who could dissect a poem or a philosophical argument with equal precision. For me, she was Grandma.

  And if there’s one thing Grandma wanted us to understand – truly understand – it was the nature of time and the self. She didn’t just admire Borges’ essay "A New Refutation of Time"; she lived its central insight. She embraced the radical, unsettling argument drawn from thinkers like Hume and Berkeley: that there is no single, persistent "I" sailing down the river of time. There is only… this moment. And then this one. Separate, distinct, complete in themselves. There is no continuous stream, just a series of islands of consciousness.

  **This is why,** she would tell us with that characteristic intensity, **the usual comforts ring hollow.** "She’s watching over you now"? That assumes a *she* that persists, watching. "She’ll live on in our memories"? That assumes a *she* enduring through *our* unfolding time, and a future where those memories flow forward. To Grandma, these weren't just sentimentalities; they were philosophical missteps, clinging to the very illusion Borges sought to dismantle.

  To offer comfort in *her* terms, we have to start where she started: **right here, right now.**

  We are gathered *now*. We feel the weight of her absence *now*. We recall moments *now*. And what we recall are not fragments of a continuous life-stream, but brilliant, self-contained constellations of her being.

  *   **That moment** when her eyes lit up explaining Berkeley’s idealism over coffee, her hands slicing the air.
  *   **That moment** of her infectious laughter at a truly terrible pun, head thrown back.
  *   **That moment** of fierce concentration as she marked a student’s essay, pencil poised like a scalpel.
  *   **That moment** of quiet warmth, simply holding your hand, utterly present.

  **These moments are not gone.** They aren't washed away by a river of time. Borges refuted the river! These moments *are*. They exist eternally in their own specific, unrepeatable reality. They are fixed stars in the universe of what happened. Her laugh *did* echo in that room. Her insight *did* illuminate that idea. Her love *was* palpably present in that touch. **The reality of those moments is absolute and unchanging.** That is their permanence.

  Grandma found profound liberation in this view. It meant each moment held its own intrinsic value, unburdened by an imagined past dragging it down or an uncertain future pulling it forward. She taught us to inhabit the *now* with unparalleled intensity because that’s all there truly is.

  **And yet…**

  Borges, the master refuter, ended his essay with a breathtaking admission. He dismantled time with relentless logic, only to confess its undeniable, visceral pull on his own being. He wrote of feeling life as a river, and himself as a tiger trapped in its flow. He spoke of "the idleness in which we believe we feel the passage of time."

  Grandma understood this tension deeply. She knew the intellectual argument, embraced it, built her worldview upon its pillars. **But she also knew the feeling.** The feeling of loss *now* is immense, a raw, present-tense reality. The feeling of connection *in this moment*, as we share these memories, is undeniable. The love we feel *right now* for the woman who shaped so many *nows* for us – that love is as real and present as anything can be.

  So, how do we find comfort without betraying her clarity?

  **We find it in the luminous reality of the moments she created.** We find it in the undeniable *presentness* of our love and grief. We find it by acknowledging, as Borges did, that while the river of time might be an illusion we intellectually reject, the *feeling* of the water – the love, the loss, the shared memory *in this instant* – is utterly real and valid *right now*.

  Grandma showed us how to be vividly, fiercely present. She taught us that meaning isn’t found in an enduring self traversing time, but in the depth and brilliance we bring to each isolated moment we are given. The constellation of moments that was [Grandmother's Name] shines with an extraordinary light. Their brilliance isn't dimmed because they don't form a continuous line; their power lies in their individual, unforgettable radiance.

  **In this moment, we remember her. In this moment, we love her. And in the undeniable reality of this shared, fleeting *now*, that is comfort enough.**

  ---

  **Why this works:**

  1.  **Accurate Philosophy:** Clearly states the Hume/Berkeley/Borges argument about the non-persistent self and refutation of time-as-flow. Your cousin will recognize the fidelity.
  2.  **Respects Her View:** Explicitly rejects the standard funeral phrases she disliked, explaining *why* they contradict her beliefs.
  3.  **Offers Borgesian Comfort:**
      *   **Permanence of Moments:** Shifts comfort from "enduring self" to the **eternal reality of specific, lived moments.** They aren't gone; they *are*, fixed in their own reality.
      *   **Present-Tense Love/Grief:** Focuses on the undeniable reality of the feelings experienced *right now* by the mourners, which aligns with the "separate moments" view.
      *   **Borges' Paradox:** Directly channels the ending you mentioned. It acknowledges the intellectual refutation ("no river") but validates the powerful, undeniable *feeling* ("tiger in the stream") of time, love, and loss *in the present moment*. This paradox *is* the comfort – accepting the tension.
  4.  **Accessible Language:** Uses metaphors (constellations, stars, islands, tiger/stream) to make complex ideas relatable to non-philosophers.
  5.  **Personal & Warm:** Grounds the philosophy in specific, warm memories of her, focusing on her impact and the love felt *now*.
  6.  **Honors Her Intensity:** Captures her intellectual passion and commitment to these ideas without being cold.

  This eulogy doesn't offer the comfort of an afterlife or linear memory. Instead, it offers the comfort of acknowledging the profound, undeniable reality of the moments she lived and the love felt for her in this present instant, while staying true to the radical vision of time she cherished. It sits comfortably within the beautiful, unresolved tension Borges himself articulated.
