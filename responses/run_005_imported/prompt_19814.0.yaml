  Yet there's a deeper harmony: Bernoulli's psychology mirrors Kelly's mathematics because diminishing marginal utility structurally resembles growth-rate optimization. Logarithm isn't arbitrary; it's the unique function that linearizes multiplicative wealth processes. Bernoulli intuited this via psychology; Kelly proved it via information theory. 

  So I'll argue Bernoulli would reject geometric rationality's claim to universality—his psychology-based approach opposes prescribing one "rational" utility—but he'd admire Kelly's math as validating his intuition about money's nonlinearity. The convergence isn't coincidence; it reveals how human psychology evolved to handle multiplicative dynamics. 

