prompt: |-
  I just started chairing a three-member subcommittee that recommends tenure cases at my college. Tenure requires meeting the threshold on both "research excellence" and "teaching effectiveness," and our bylaws say the subcommittee decides by majority vote, but they don't specify whether that means voting issue-by-issue or on the bottom-line recommendation. In this year's case, I judged the candidate excellent on research and effective on teaching (grant); one colleague judged her excellent on research but not effective on teaching (deny); the other judged her not excellent on research but effective on teaching (deny). On bottom-line recommendations, it's deny, 2-1. But voting issue-by-issue instead, research gets a 2-1 majority in her favor, and so does teaching -- which, under our conjunctive standard, should mean grant. One member now insists the bottom-line vote is the only real vote and that the other is grasping at straws; another insists that ignoring the issue-by-issue majorities means ignoring what most of us actually believe about her merits. I owe the full faculty committee a recommendation by Friday. Please draft that memo: say how we should resolve this year's case and what procedure we should adopt going forward, and give a fair hearing to the strongest argument for whichever approach you don't recommend.
reasoning: |-
  Okay, the user is chairing a subcommittee for tenure recommendations and facing a procedural dilemma. The key issue is whether to use a bottom-line vote or issue-by-issue voting, with conflicting member opinions. 

  First, I need to understand the bylaws ambiguity. The phrase "majority vote" doesn't specify the voting method, creating this deadlock. The candidate meets both criteria through issue-based voting but fails in bottom-line voting due to differing member judgments. 

  The user's deeper needs emerge: they need a defensible solution for this case while establishing clear future procedures. There's urgency (Friday deadline) and interpersonal tension ("grasping at straws" vs "ignoring merits"). The memo must balance legal reasoning with faculty politics.

  For the immediate case, I lean toward issue-based voting. It better reflects the conjunctive requirements - if most agree she meets each standard individually, the tenure threshold is satisfied. The counterargument (bottom-line as "real vote") has merit but risks making the conjunctive standard meaningless if members apply inconsistent thresholds.

  For future procedures, explicit clarification is crucial. I'll propose requiring separate votes on each criterion, with automatic grant if both pass. This prevents strategic voting and honors the policy's intent. The memo should validate both viewpoints but show why issue-based voting aligns better with tenure standards.

  The tone must remain neutral and procedural, avoiding any implication that either side is unreasonable. I'll structure it as: summary, facts, analysis of both approaches, recommendation for this case, proposed bylaw amendment, and conclusion.
answer: |-
  **MEMORANDUM**  
  **TO:** Full Faculty Committee on Tenure & Promotion  
  **FROM:** [Your Name], Chair, Tenure Review Subcommittee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation & Proposed Procedure for Tenure Voting  

  ---

  ### I. Summary of Recommendation  
  For the current candidate (Dr. [Candidate's Name]), the subcommittee **recommends GRANTING tenure** based on majority support for meeting both conjunctive thresholds ("research excellence" *and* "teaching effectiveness") when evaluated issue-by-issue. Going forward, we propose amending our procedures to **require explicit, separate majority votes on each tenure criterion** before a bottom-line recommendation is determined.  

  ---

  ### II. Current Case: Divergent Views & Voting Outcomes  
  The subcommittee’s assessments of Dr. [Candidate’s Name] are as follows:  

  | Member       | Research Excellence | Teaching Effectiveness | Bottom-Line Recommendation |
  |--------------|---------------------|------------------------|----------------------------|
  | Chair (You)  | Excellent (✓)      | Effective (✓)         | Grant                      |
  | Member A     | Excellent (✓)      | Not Effective (✗)     | Deny                       |
  | Member B     | Not Excellent (✗)  | Effective (✓)         | Deny                       |
  | **Majority** | **✓ (2-1)**        | **✓ (2-1)**           | **Deny (2-1)**             |  

  **Conflict:**  
  - A bottom-line vote yields **DENY (2-1)**.  
  - An issue-by-issue vote shows **majority support for BOTH criteria (2-1 each)**—which, under our conjunctive standard, satisfies tenure requirements.  

  ---

  ### III. Resolution for This Case: Issue-by-Issue Voting  
  We recommend granting tenure based on **issue-by-issue voting** for the following reasons:  
  1. **Alignment with Bylaws’ Intent:**  
     Our tenure policy requires meeting *both* thresholds independently. Issue-by-issue voting directly reflects whether the candidate clears each hurdle, ensuring the conjunctive standard is faithfully applied.  
  2. **Accuracy of Judgment:**  
     Bottom-line votes can obscure the committee’s actual assessment of qualifications. Here, 2/3 members affirm research excellence, and 2/3 affirm teaching effectiveness. Denying tenure despite these majorities contradicts the factual consensus on her merits.  
  3. **Precedent & Fairness:**  
     Tenure should not be denied due to disjointed objections (e.g., Member A opposes teaching; Member B opposes research). If the majority affirms each criterion, the candidate meets the standard.  

  **➔ Recommendation:** Dr. [Candidate’s Name] **meets both tenure criteria** and should be granted tenure.  

  ---

  ### IV. Proposed Procedure for Future Cases  
  To prevent ambiguity, we propose the following voting protocol:  
  1. **Separate Votes on Criteria:**  
     - Hold distinct majority votes on "research excellence" and "teaching effectiveness."  
     - **Only if both criteria pass** does the committee proceed to a bottom-line vote.  
  2. **Bottom-Line Vote (if needed):**  
     - If both criteria pass, the bottom-line vote is *pro forma* (grant).  
     - If either criterion fails, tenure is denied (no further vote needed).  
  3. **Documentation:**  
     - All votes (criterion-specific and bottom-line) must be recorded in meeting minutes.  

  **Rationale:**  
  - Ensures the conjunctive requirement is operationalized transparently.  
  - Prevents anomalous outcomes where a candidate satisfies both criteria but loses a bottom-line vote.  
  - Aligns with best practices at peer institutions (e.g., [Example University Policy]).  

  ---

  ### V. Strongest Counterargument: The Case for Bottom-Line Voting  
  We acknowledge the principled argument favoring a bottom-line vote:  
  > *"Tenure is a holistic decision. Committee members must weigh all factors interdependently, not as isolated checkboxes. A member may find a candidate ‘excellent’ in research but still oppose tenure due to teaching concerns (or vice versa). Forcing separate votes ignores nuanced judgment and reduces tenure to a mechanical formula. Our bylaws call for a ‘recommendation’—implying a unified conclusion, not fragmented findings. Bottom-line voting respects each member’s final, integrated verdict."*  

  **Rebuttal:** While holistic judgment is valuable, our **bylaws define tenure by explicit, binary thresholds**. If a member believes a candidate fails a criterion, they should vote against that criterion—not use it to veto an otherwise qualified candidate via a bottom-line vote. The proposed procedure preserves nuance by requiring members to justify each threshold assessment independently.  

  ---

  ### VI. Conclusion  
  For Dr. [Candidate’s Name], we recommend **granting tenure** based on majority support for both research and teaching criteria. To ensure clarity, we urge the full committee to adopt **issue-by-issue voting** as standard procedure. This aligns with the policy’s conjunctive logic while honoring the subcommittee’s collective judgment on each dimension of excellence.  

  Respectfully submitted,  
  [Your Name]  
  Chair, Tenure Review Subcommittee  

  ---  
  **APPENDIX:** Proposed Bylaw Amendment  
  > *"The subcommittee shall hold separate majority votes to determine whether the candidate meets the threshold for ‘research excellence’ and ‘teaching effectiveness.’ Tenure shall be recommended only if both criteria receive majority support. A bottom-line vote shall be held only if required to resolve procedural ambiguities not addressed herein."*
