  I should clarify that Sidgwick didn't see this as replacing philosophy but as addressing a gap that philosophy couldn't resolve. He needed empirical data to solve a theoretical problem. Also, mentioning his loss of faith contextualizes why he sought evidence instead of returning to religion.

