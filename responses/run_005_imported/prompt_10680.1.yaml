answer: |-
  That's an exceptionally astute connection, and your professor is right to highlight this crucial (though often sidelined) dimension of Sidgwick's life and work. Sidgwick himself saw the link as profound and necessary. Here's a detailed breakdown of his reasoning and the scholarly perspectives:

  **1. The Dualism of Practical Reason: The Core Problem**

  *   **The Impasse:** In *Methods of Ethics*, Sidgwick rigorously argues that both **Rational Egoism** (the principle that it is rational for an individual to seek their own greatest happiness) and **Utilitarianism/Universal Benevolence** (the principle that it is rational to seek the greatest happiness of all) are self-evident, fundamental axioms of practical reason. He concludes that reason cannot reconcile these two principles when they conflict.
  *   **The Stakes:** This creates a profound existential and moral dilemma. If reason cannot tell us which principle ultimately governs our conduct, morality potentially collapses into irrationality or mere subjective preference. Utilitarianism loses its rational authority over the egoist. Sidgwick famously called this "the profoundest problem of ethics."
  *   **Philosophy's Failure:** Sidgwick exhaustively explored philosophical solutions – intuitionism, dogmatic theology, evolutionary ethics, Kantian deontology – and found them all wanting in closing this gap through pure reason or conceptual analysis. His own rigorous methods led him to this dead end.

  **2. Why Empirical Evidence for a "Future Life"? The Proposed Solution**

  Sidgwick didn't believe philosophy *alone* could resolve the dualism. He concluded that a **metaphysical postulate** was needed, specifically one reconciling self-interest and duty through **cosmic justice**. His reasoning unfolds thus:

  *   **Harmony Requires Sanctions:** The only way to ensure that acting for the universal good *always coincides* with acting for one's own greatest good is if there exists a system where virtue is *necessarily* rewarded and vice punished *in the long run*. This requires an order of existence transcending the observable, finite, and often unjust natural world.
  *   **God + Immortality as the Mechanism:** While a benevolent, just God *could* administer such sanctions, Sidgwick (having lost his orthodox Christian faith) found the *empirical* evidence for God's existence and active intervention in the world philosophically weak and insufficient. He focused instead on **personal survival after death (immortality)** as the more empirically tractable component of the necessary postulate.
  *   **The Role of a "Future Life":**
      *   **Extended Timeframe:** Survival provides the *temporal scope* needed for the reconciliation. An infinite future allows for the eventual harmonization of self-interest and universal good, even if they conflict in this finite life.
      *   **Foundation for Cosmic Justice:** Survival makes plausible the existence of a realm or state where the necessary sanctions (rewards for virtue, punishments for vice) can be administered, either by a God or by the inherent nature of that reality. It opens the door to a universe where morality is woven into its fabric.
      *   **Empirical Leverage Point:** Crucially, Sidgwick argued that **evidence for survival is, in principle, empirically investigable.** Unlike purely theological claims about God's nature or justice, phenomena attributed to spirits of the dead (apparitions, communications via mediums, veridical deathbed visions, etc.) could be subjected to observation, testimony collection, and critical analysis. If survival could be *proven*, it would provide the *empirical foundation* for believing in the cosmic justice required to resolve the dualism. It wasn't about proving *heaven* per se, but proving the *continuation of personal consciousness* as a prerequisite for any system of post-mortem sanctions/rewards.

  **3. Psychical Research as the Empirical Arm of Ethics**

  This is why Sidgwick co-founded the SPR in 1882 and devoted immense energy to it. He saw it not as a "hobby," but as **a rigorous, scientific extension of his ethical project:**

  *   **Methodological Rigor:** He applied the same painstaking, critical, evidence-based approach he used in philosophy. The SPR's founding principles emphasized skepticism, careful documentation, cross-verification of testimony, and exposure of fraud. Sidgwick wasn't credulous; he was deeply skeptical but believed the question was too important *not* to investigate scientifically.
  *   **Targeted Inquiry:** While the SPR investigated a wide range of phenomena (telepathy, clairvoyance, hauntings, physical mediumship), Sidgwick was primarily focused on phenomena that seemed to provide **evidential traces of discarnate agency** – verifiable communications from the dead through mediums, deathbed visions coinciding with distant deaths, apparitions conveying unknown information. Proof of telepathy (mind-to-mind contact) was also crucial, as it established a plausible mechanism for communication *without* necessarily invoking spirits, but needed to be distinguished *from* spirit communication to isolate evidence for survival.
  *   **The Hope:** Sidgwick hoped that by accumulating rigorously vetted evidence, the SPR could establish survival as a scientifically accepted fact. This would then provide the missing empirical premise needed to bridge the dualism of practical reason: demonstrating a universe structured such that rational self-interest and universal benevolence ultimately converge.

  **4. Scholarly Perspectives: Coherent Extension or Existential Quest?**

  Scholars are divided, but the pendulum has swung towards seeing greater coherence:

  *   **Coherent Extension:**
      *   **Bart Schultz:** In *Henry Sidgwick: Eye of the Universe*, Schultz meticulously argues that psychical research was the *logical culmination* of Sidgwick's entire philosophical project. The dualism was the central problem, and empirical investigation of survival was the only path he saw to resolve it after reason failed. It was "paraphilosophy" – necessary empirical work required to complete the philosophical system.
      *   **Alan Gauld:** A historian of psychical research, Gauld emphasizes how Sidgwick's ethical concerns directly shaped the SPR's research agenda. Sidgwick steered investigations towards phenomena relevant to survival.
      *   **Key Argument:** Sidgwick's philosophical writings (letters, memoirs, SPR presidential addresses) repeatedly link the dualism to his motivation for psychical research. The chronology and his own stated intentions strongly support this view. He saw it as a *duty* arising from his ethical impasse.

  *   **Existential Reassurance / Parallel Track:**
      *   **J. B. Schneewind (Earlier View):** While acknowledging the link, Schneewind (*Sidgwick's Ethics and Victorian Moral Philosophy*) sometimes framed the psychical research more as a personal, psychological response to the bleakness of the dualism and the loss of religious faith – a search for hope – rather than a strictly *derived* philosophical necessity. He might see it as *motivated* by the philosophy but not strictly *required* by its internal logic in the way Schultz argues.
      *   **Focus on Personal Anguish:** Proponents of this view emphasize Sidgwick's documented personal despair over the dualism and the loss of religious consolation. They argue the psychical research, while methodologically rigorous, served a deep personal need for meaning and cosmic justice that his philosophy could not provide.
      *   **The "Two Sidgwicks" Interpretation:** Some see a disconnect between the ultra-rationalist philosopher and the man seeking solace in séances, suggesting a compartmentalization or a personal quest running parallel to, but not fully integrated with, his formal philosophy.

  *   **Contemporary Consensus:** Schultz's view, emphasizing deep integration, is currently dominant among specialists. Sidgwick's own writings are too explicit about the connection to dismiss it as merely personal. Scholars increasingly recognize that for Sidgwick, the boundaries between rigorous philosophy, empirical science (even of the anomalous), and the search for a rational basis for meaning were permeable. The psychical research *was* his attempt to find the empirical key to unlock the philosophical dead end.

  **Why Not Stronger Philosophy or Return to Faith?**

  *   **Stronger Philosophy:** Sidgwick believed he *had* followed the arguments to their logical conclusion. He saw the dualism as an *insoluble* problem *within* the resources of pure reason and conceptual analysis. More philosophy wouldn't help; it needed a different *kind* of premise.
  *   **Return to Faith:** Sidgwick's loss of faith wasn't casual; it resulted from the same rigorous scrutiny he applied to ethics. He found traditional theological arguments and religious authority intellectually unsatisfying and evidentially weak. He demanded *evidence*. Psychical research offered a path to potentially *empirically grounded* belief in a future state, distinct from faith-based dogma. He sought a foundation that could withstand his own critical standards.

  **In Conclusion:**

  Sidgwick understood psychical research as the **essential empirical investigation required to potentially resolve the fundamental impasse (the dualism of practical reason)** revealed by his philosophical work. He believed that **empirical proof of personal survival after death** was the specific type of evidence that could, in principle, demonstrate the existence of a universe where cosmic justice operates, thereby reconciling rational self-interest and universal benevolence. While driven partly by profound personal anguish over the implications of the dualism and the loss of faith, contemporary scholarship largely views this research not as a disconnected hobby or mere existential quest, but as a **coherent, rigorous, and logically motivated extension of his ethical project** – his attempt to find, through science, the evidence that philosophy could not provide for the ultimate rationality of the moral universe. It was the "Eye of the Universe" seeking empirical confirmation of its own ethical structure.
