answer: |-
  Based on Fisher's writings, polemical style, and core scientific commitments, here’s a historically grounded reconstruction of his likely response to Gould and Lewontin (1978), addressing your three specific threads:

  ### 1. On "Just-So Stories": Quantitative Rigor vs. Narrative Excess
  Fisher **would have sharply distinguished his work from "just-so stories"** but **might have conceded limited ground** on the broader critique of verbal adaptationism.  

  *   **His Defense:** Fisher viewed his mathematics (especially the FTNS) as *demonstrating* universal principles of adaptation, not speculating about specific cases. He explicitly contrasted his approach with "merely plausible narratives," writing in 1934: *"The precise and quantitative character of the conclusions should be contrasted with the merely plausible inferences of the comparative method"* (Proc. R. Soc. Edinb.). He would argue his models (dominance evolution, runaway selection) were *testable hypotheses* grounded in population genetics, not untestable stories. The FTNS claimed *necessary* increase in mean fitness under additive genetic variance – a deductive truth for him, not a narrative.
  *   **Concession (Grudging):** Fisher despised superficial biological reasoning. He might have agreed that *untested, purely verbal* adaptive explanations (like some ethological or paleontological claims) were scientifically weak. In *Genetical Theory*, he critiques "superficial plausibility" in evolutionary arguments. He could acknowledge G&L's point that *some* adaptationist work was slipshod, while fiercely denying it applied to *mathematical* population genetics. His concession would be: "Yes, *their* storytelling is poor science; *mine* is not storytelling at all, but rigorous deduction and quantitative prediction."

  ### 2. Reabsorbing Byproducts & Pleiotropy: The Mathematical Imperative
  Fisher **would absolutely have insisted on subsuming "spandrels" and pleiotropy within his selectionist mathematics**, rejecting them as an *independent* explanatory category.  

  *   **Correlated Responses & Net Selection:** For Fisher, every trait was under *some* net selection pressure, even if influenced by pleiotropy or linkage. The FTNS framework inherently handles genetic correlations. A "spandrel" trait (e.g., a non-adaptive byproduct of architecture/development) would be seen as:
      *   A trait with a current selection coefficient near zero (`s ≈ 0`), maintained because its genetic variation is correlated with variation in traits under stronger direct selection (positive or negative).
      *   A trait where past selection acted on the *developmental system* producing the correlated byproduct. His modifier gene theory (e.g., for dominance evolution) showed how selection could act indirectly to alter the *expression* of traits.
  *   **No "Independent" Category:** Granting "byproducts" a status *outside* selectionist explanation would violate Fisher's core belief that natural selection is the *only* directional force shaping adaptation. Pleiotropy wasn't an *alternative* to selection; it was a *constraint* within which selection operated, quantifiable through genetic covariances (`Cov_w`). He'd argue G&L's "spandrels" were simply traits where the current `s` was negligible or the genetic correlation (`r_A`) with a selected trait dominated their dynamics. The architectural analogy would be dismissed as failing to capture the continuous, covariance-based nature of genetic effects. *"The 'spandrel' is merely a character whose selective value is currently negligible or correlated with another under stronger selection. Its form is still a consequence of past selection acting on the developmental system."*

  ### 3. The Wrightian Lens: Spandrels as Anti-Selectionist Rhetoric 2.0
  Fisher **would overwhelmingly have viewed the Spandrels paper through the lens of his feud with Wright**, interpreting it as a sophisticated revival of anti-selectionist arguments he believed he had mathematically refuted.  

  *   **Drift as the Core Threat:** Fisher saw Sewall Wright's emphasis on drift, subdivision, and multiple peaks as the primary threat to understanding adaptation's power. G&L's emphasis on "non-adaptive" traits, the role of "chance" (drift), and constraints limiting selection would immediately register as Wrightian.
  *   **Rhetorical Update, Same Core:** He'd perceive G&L's architectural analogy and focus on developmental constraints as a new *verbal/rhetorical* strategy promoting the same dangerous idea: that natural selection isn't overwhelmingly dominant in evolution. His response would echo his critiques of Wright: G&L are vastly *underestimating* the power of mass selection acting on additive variance in large populations to overcome constraints and drive adaptation. Their examples (e.g., spandrels, allometry) would be seen as edge cases or misunderstandings of how selection integrates correlated traits.
  *   **Dismissal of Novelty:** Fisher would likely dismiss the specifics of the architectural analogy and developmental constraints as irrelevant window-dressing. The core argument – challenging the *sufficiency* and *ubiquity* of selection – was, to him, the same old Wrightian heresy. *"This 'Spandrels' critique is merely Professor Wright's misplaced emphasis on random survival and non-adaptive peaks, repackaged with Italian architecture for a new generation. My fundamental theorem demonstrates the necessary increase of fitness. Their 'constraints' are simply the genetic correlations and initial conditions within which this law operates."*

  ### Historically Textured Speculation & Nuance

  *   **Probability, Not Certainty:** Fisher might concede that *in very small populations* (which he considered biologically marginal), drift or historical contingency *could* play a larger role, making some outcomes less predictable. But for "any population of realistic size" (as you note), he'd maintain selection swamps this.
  *   **Developmental Biology's Blind Spot:** Fisher had little engagement with embryology. He'd likely dismiss detailed developmental constraints (beyond broad pleiotropy) as irrelevant "proximate" mechanisms. The FTNS operates at the population genetic level – gene frequencies and fitnesses. How phenotypes emerge was secondary to their fitness consequences. He’d see G&L's focus on development as a distraction from the *population-level dynamics* governed by his theorem.
  *   **Tone: Combative, Not Conciliatory:** Expect no rapprochement. Fisher's responses to critics (e.g., his vicious review of Wright's *Genetics* paper in 1931, his cold dismissal of Mayr's "founder effect" ideas) were famously acerbic and dismissive when he felt core principles were attacked. G&L would receive similar treatment: their critique would be seen as mathematically naive, biologically overstated, and fundamentally anti-Darwinian in downplaying selection's power.
  *   **The Ghost of Jenkin:** Fisher might even link G&L's skepticism back to Fleeming Jenkin's pre-Mendelian critique of Darwin – underestimating the power of selection acting on abundant, small variations (now genes) to overcome constraints and drift. The FTNS was his ultimate answer to Jenkin; it would be his answer to G&L.

  **In essence:** Fisher would see the Spandrels paper as a verbose, metaphor-laden attack on the supremacy of natural selection, echoing Wright's erroneous pluralism. He would counter with the immutable logic of the FTNS, the overwhelming power of mass selection in large populations, and his covariance-based framework for handling correlated traits and pleiotropy. He would dismiss "spandrels" as traits under negligible *current* selection or governed by genetic correlations, and reject any notion of non-adaptive traits requiring a distinct explanatory category. While he might grant that *some* biologists engage in loose storytelling, he would vehemently defend his own mathematical work as the antidote to such failings, not an example of them. His response would be less about engaging the architectural analogy and more about reasserting the universal, mathematical primacy of selection.
