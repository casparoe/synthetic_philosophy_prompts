  Potential challenges include maintaining suspense without supernatural events and ensuring the investigator's internal conflict is compelling. Using sensory details—chilly room, the medium's breathing, faint raps—can build atmosphere. The investigator's critical eye dissecting each phenomenon while wrestling with his own hope creates the tension.

