  **Justifications:**  
  - **1 (Ben): -1 (Mostly mistaken)**  
    Ben misrepresents dark matter theory. While halo profiles *are* adjusted for individual galaxies, they follow broadly predictable patterns based on established physics (e.g., ΛCDM simulations). MOND requires *per-galaxy* tuning of its interpolation function or external fields to match diverse rotation curves, contradicting Ben's claim of "one constant." Dark matter isn't arbitrarily flexible.  

  - **2 (Alicia): 2 (Clearly right)**  
    Alicia correctly highlights a major success: the same ΛCDM parameters that fit galaxy halos *predicted* the CMB power spectrum (especially the acoustic peak ratios) with remarkable accuracy *before* precision measurements. MOND has no natural explanation for CMB structure without invoking unseen matter (e.g., sterile neutrinos), undermining its core premise.  

  - **3 (Ben): -1 (Mostly mistaken)**  
    Ben falsely equates the "patches." Dark matter halos are *applications* of a consistent framework (collisionless cold dark matter + gravity). MOND's need for *additional* unseen particles (e.g., for galaxy clusters or CMB) is a *fundamental modification* of its initial claim (modified gravity alone suffices). The adjustments aren't epistemically equivalent.  

  - **4 (Alicia): 2 (Clearly right)**  
    Alicia identifies a critical distinction: the Bullet Cluster prediction. ΛCDM uniquely forecasted spatial separation of lensing mass (DM) from baryonic gas *before* observation. This was a *novel, risky prediction* that could have falsified dark matter. MOND cannot explain this without ad hoc dark matter components.  

  - **5 (Ben): 1 (Mostly right)**  
    Ben raises a valid philosophical concern: confirmation bias can inflate "novel predictions." If a theory is flexible enough to *retrofit* any observation (e.g., inventing new particle properties), a "prediction" loses force. The principled difference (which Ben doubts) lies in whether the fix was *pre-registered* before data collection.  

  - **6 (Alicia): 0 (Neutral/mixed)**  
    Alicia correctly identifies pre- vs. post-hoc as key but admits the line can blur historically. Her point is valid (Bullet Cluster *was* pre-registered), but she concedes defenders can *reinterpret* old fixes as predictions—a real issue in cosmology. She lacks a clear criterion to prevent this, weakening her rebuttal.  

  **Closing Insight:**  
  Both debaters overlook that scientific theories evolve through *constrained* adjustments. A "patch" counts against a theory if it:  
  1. **Reduces testability** (e.g., makes the theory unfalsifiable by adding unlimited free parameters).  
  2. **Contradicts core principles** (e.g., MOND adding dark matter violates its foundational axiom).  
  3. **Fails to enable *new* predictions** (e.g., tweaking a halo to fit one galaxy vs. predicting a *new* phenomenon like the Bullet Cluster separation).  
  Dark matter’s adjustments largely satisfy (3)—generating novel, confirmed predictions—while MOND’s often violate (2) and struggle with (1). The true test isn’t whether adjustments occur, but whether they *productively extend* the theory’s explanatory scope without sacrificing coherence or predictive power.
