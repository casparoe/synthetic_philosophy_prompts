prompt: |-
  A friend and I had a long-running argument this week, prompted by a documentary about the 2022 physics Nobel, that never really got resolved. My position was that because quantum mechanics obeys the no-signalling theorem — entangled particles can never be used to send a message faster than light — Bell's theorem doesn't actually show that nature is nonlocal in any sense that should trouble someone still committed to Einstein's picture of a local universe. Bell and the philosophers who followed him invoke a further condition, "local causality," supposedly violated even though signalling remains impossible, but I argued that once nothing can be transmitted between the two wings of the experiment, insisting on some additional, violated locality condition is just semantics dressed up as physics. My friend was adamant that I was missing something important but couldn't quite say what. Who has the better of this argument: is there a genuine, substantive locality assumption that Bell's theorem rules out beyond the one that no-signalling already secures, or was I right that the further talk of "local causality" does no real work?
reasoning: |-
  Okay, let me start by unpacking the user's question. They had an argument with a friend about whether Bell's theorem implies nonlocality in a way that conflicts with Einstein's local universe view, especially since no-signalling prevents faster-than-light communication. The user thinks that once no-signalling is satisfied, any additional locality condition like "local causality" is just semantics. Their friend disagrees but can't articulate why.

  First, I need to recall Bell's theorem and its implications. Bell showed that no local hidden variable theory can reproduce all quantum mechanics predictions. The key is understanding what "local" means here. The user equates locality with no-signalling, but Bell's locality is more specific—it's about factorizability, meaning outcomes depend only on local settings and hidden variables, without any direct influence from distant settings.

  The no-signalling theorem ensures that you can't use entanglement to send messages faster than light. But Bell's theorem addresses a deeper issue: even without signalling, the correlations themselves can't be explained by local causes. Experiments like Aspect's confirm that quantum correlations violate Bell inequalities, which local theories can't do. So, the user might be conflating the impossibility of communication with the structure of correlations.

  The user's argument hinges on the idea that since no-signalling holds, any additional locality violation is just semantics. But I need to explain why local causality is distinct. Local causality isn't just about signalling; it's about whether correlations stem from past common causes. Quantum mechanics shows correlations that exceed what any local common cause can achieve, implying a form of nonlocality, even if it doesn't allow signalling.

  I should use analogies like Bertlmann's socks. If two particles are correlated due to a common cause, their properties are set at creation. But in QM, measurements create properties that weren't predetermined, and the choice of measurement on one side instantly affects the possible outcomes on the other, without communication. This is the nonlocal aspect Bell highlights.

  The user might be missing that Einstein's locality includes local realism—both no-signalling and deterministic outcomes from pre-existing properties. Bell tests violate local realism, showing that either realism (hidden variables) or locality fails. Since no-signalling holds, locality in the signalling sense is preserved, but locality in the causal sense is violated.

  Also, addressing the philosophical point: Bell's "local causality" is a substantive assumption about how causes operate locally. Its violation indicates that the universe isn't locally causal in the way classical physics assumed, even if it doesn't allow signalling. This is a physical, not just semantic, difference.

  So, the friend is correct that something important is missed. The user's oversight is equating all forms of locality with no-signalling, whereas Bell separates causal locality from signalling. The implications are profound for understanding quantum mechanics versus classical physics.
answer: |-
  You've touched upon one of the deepest and most persistent debates in the foundations of quantum mechanics. While your position is coherent and reflects a significant viewpoint, the prevailing consensus among physicists and philosophers of physics is that **your friend has the better argument, and you are missing something substantive.** Here's why:

  1.  **Distinguishing "No-Signalling" from "Local Causality":**
      *   **No-Signalling (NS):** This is an *operational* constraint. It says you cannot *use* the system to transmit information (a signal) faster than light. Quantum mechanics rigorously obeys this, and Bell's theorem relies on it. NS ensures the impossibility of FTL communication *regardless* of the underlying mechanism.
      *   **Local Causality (LC) / Bell Locality:** This is an *ontological* or *causal* constraint on how physical reality itself is structured. Bell formulated it precisely (often called "Factorizability"): The probability of an outcome (A) on one wing, given the *complete specification of the past light cone* of that wing (including any hidden variables λ), should be *independent* of both:
          *   The *distant setting* (B's choice of measurement direction).
          *   The *distant outcome* (B's result).
          In essence: Once you specify everything in the past light cone of event A (including any relevant hidden variables λ), events *outside* that light cone (specifically, the setting and outcome at B) become irrelevant for predicting A. Causation/influence is constrained to propagate within light cones.

  2.  **What Bell's Theorem Actually Shows:**
      Bell's theorem proves that **any theory that satisfies Local Causality (LC) must obey Bell inequalities.** Crucially, quantum mechanics makes predictions (confirmed by numerous experiments since Aspect) that *violate* Bell inequalities. Therefore:
      *   Quantum mechanics is *incompatible* with any theory satisfying Local Causality (LC).
      *   Since quantum mechanics *does* obey No-Signalling (NS), the conflict is specifically with LC, not NS.

  3.  **Why Violating LC is Substantive, Even with NS:**
      This is the crux of your disagreement. You argue that since NS holds, violating LC is merely semantics. However, the violation of LC points to something profound about the *nature* of correlations and causation, even if it doesn't allow signalling:
      *   **Failure of Local Common Causes:** LC is the formalization of Einstein's hope that correlations between distant events arise *only* from shared past common causes (encoded in λ). Bell's theorem shows this is impossible for QM correlations. There is no local story (no set of instructions λ carried along with the particles from the source) that can fully account for the specific, measurement-dependent correlations observed. The correlations are "nonlocal" in the sense that they depend on the *combination* of settings *at both wings*, in a way that cannot be reduced to pre-existing properties determined solely at the source.
      *   **Holism and Contextuality:** The violation implies a fundamental *holism* or *contextuality* in nature. The outcome on one side isn't just a property of that particle alone, or even just of the particle plus its local measurement device. It depends *in a statistically irreducible way* on the *global* experimental context (the combined settings at both wings). While this dependence doesn't convey a signal (due to the randomness of individual outcomes), its statistical manifestation across many runs is undeniable and incompatible with any local causal story.
      *   **What "Nonlocal" Means Here:** It doesn't mean controllable FTL signalling (which NS forbids). It means that the *causal structure* required to explain the correlations involves a dependence that transcends the local light cone structure in a way incompatible with relativistic spacetime as Einstein conceived it *for causal influences*. The universe doesn't allow you to *send a message* FTL, but it *does* contain correlations that cannot be explained by *any* set of events confined within past light cones. This is a genuine form of nonlocality, distinct from signalling nonlocality.

  4.  **Analogy: Bertlmann's Socks vs. Quantum Twins**
      *   **Bertlmann's Socks (Local Causality):** Dr. Bertlmann always wears mismatched socks (one pink, one green). If you see his left sock is pink, you *instantly know* the right sock is green, even from miles away. This correlation is explained by a *common cause* (Bertlmann's dressing habit λ). Knowing λ (the habit) makes the distant sock color irrelevant for predicting the local one. LC holds.
      *   **Quantum Twins (Violated Local Causality):** Imagine entangled particles are like twins who always give opposite answers to *any* identical question asked of them. But crucially, if you ask Twin A a *different* question than Twin B, the correlation changes in a way that cannot be explained by *any* pre-agreed plan (λ) they made when they separated. The *statistical dependence* between A's answer to question X and B's answer to question Y depends on *both* X *and* Y, in a way no pre-agreed plan could replicate. The "influence" of the distant question choice on the local outcome statistics is irreducible, even though you can't *control* the outcome to send a message. LC is violated.

  5.  **Einstein's Commitment vs. Bell's Result:**
      Einstein was deeply committed to both *locality* (no spooky action-at-a-distance, meaning NS *and* essentially LC) and *realism* (particles have definite properties independent of measurement). Bell's theorem shows you *cannot* have both locality (in the LC sense) *and* realism for quantum systems. The experimental violation of Bell inequalities forces us to abandon at least one:
      *   **Option 1: Abandon Realism (e.g., Copenhagen, QBism):** Particles don't have definite properties until measured. The correlations reflect a fundamental indeterminacy and contextuality.
      *   **Option 2: Abandon Local Causality (e.g., Bohmian Mechanics):** Particles *do* have definite positions, but their behavior is guided by a nonlocal "pilot wave" depending instantaneously on the entire system.
      *   **Option 3: Abandon Freedom/Statistical Independence (Superdeterminism):** The experimenter's choice of measurement setting is not free but is correlated with the hidden variables λ. (This is generally considered a fringe option due to its radical implications for free will and scientific practice).
      Crucially, **NS alone is compatible with both Option 1 and Option 2.** Bell's violation of LC is what forces the choice: *If* you want realism (Option 2), you *must* accept nonlocal causality. *If* you want locality (LC), you *must* abandon realism. NS is satisfied in both cases.

  **Conclusion:**

  While your point that NS prevents FTL signalling is correct and crucial, it does not render the violation of Bell's Local Causality (LC) merely semantic. **LC is a distinct, stronger, and physically substantive assumption about how causes operate within spacetime.** Its violation by quantum mechanics, experimentally confirmed, demonstrates a profound departure from Einstein's vision of a locally causal universe. It shows that the correlations in nature cannot be explained by events confined to the past light cones of the measurement events; there is a fundamental interdependence between spacelike separated events that transcends any local common cause explanation, even though this interdependence cannot be harnessed for signalling.

  Your friend is right that you are missing something important: **Bell's theorem rules out the possibility of a locally causal explanation for quantum correlations, forcing us to choose between abandoning locality (in the causal sense) or abandoning realism.** No-Signalling ensures this nonlocality isn't "usable," but it doesn't negate its existence as a fundamental feature of how quantum correlations arise. The "further talk of local causality" does essential work in pinpointing the specific aspect of Einsteinian locality that quantum mechanics violates.
