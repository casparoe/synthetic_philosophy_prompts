  ## Memorandum: Recommendation on "Harry S. Truman Institute for Diplomacy and Statecraft" Proposal

  **To:** Honors and Nomenclature Committee  
  **From:** [Your Name/Subcommittee Representative]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation and Analysis of Proposed Harry S. Truman Institute Naming  

  **Proposal:** To name a new endowed institute the "Harry S. Truman Institute for Diplomacy and Statecraft."  
  **Key Issue:** Moral controversy surrounding President Truman's authorization of atomic bombings of Hiroshima and Nagasaki, specifically the argument by Elizabeth Anscombe that this constitutes an intrinsically immoral act disqualifying him from honor.  

  **Summary of Key Arguments:**  

  1.  **Anscombe's Core Moral Argument (Relayed via Committee Member):**  
      *   The *primary strategic objective* of targeting Hiroshima and Nagasaki was to inflict catastrophic civilian casualties to break Japan's will to resist.  
      *   Therefore, the killing of non-combatants was not an unintended side-effect ("double effect") but the *intended means* to achieve surrender.  
      *   Deliberately using the killing of innocents as a means is intrinsically evil, a form of murder, regardless of the consequences (e.g., potentially ending the war faster or saving lives overall).  
      *   Honoring Truman implicitly endorses this act and contradicts the university's commitment to fundamental moral principles.  

  2.  **Historical Context & Counterarguments (Relayed via Committee Member):**  
      *   **Dual-Use Targets:** Both cities housed significant military and industrial assets (Hiroshima: Army HQ, logistics hub; Nagasaki: Major shipyards, arms production). This complexity challenges the characterization of *pure* civilian targeting, introducing potential grounds for double-effect reasoning (intent: destroy military capacity; foreseen but unintended side-effect: civilian deaths).  
      *   **Projected Invasion Costs:** Contemporary Allied estimates (e.g., Operation Downfall) predicted massive casualties – potentially hundreds of thousands of Allied soldiers and millions of Japanese military and civilians – in a prolonged invasion. The bombs were seen as the least horrific option available to force surrender.  
      *   **Consequentialist Necessity:** To refuse to weigh the horrific consequences of *not* using the bombs against the moral violation of using them constitutes its own form of moral blindness. Preventing greater overall suffering, including immense civilian suffering during an invasion and continued conventional bombing/famine, must be part of the moral calculus.  

  **Analysis & Engagement:**  

  *   **Anscombe's Challenge:** Anscombe's argument is profound and cannot be dismissed lightly. It forces a confrontation with the principle of non-combatant immunity at the absolute core of Just War tradition. If the *primary intent* was indeed to terrorize the population and government through mass civilian death to compel surrender (as historical documents like the U.S. Strategic Bombing Survey and statements by officials like Gen. LeMay suggest was a key factor), this fundamentally violates the prohibition against using innocents as a means. No amount of "good" resulting from the act changes its intrinsic moral character, according to this deontological view. Ignoring this argument risks the university appearing indifferent to a foundational ethical principle.
  *   **The Historian's Nuance:** The historical counterpoints are equally compelling and prevent a simplistic condemnation. The presence of military targets complicates the "pure civilian targeting" narrative. The genuine belief among decision-makers (based on available intelligence) that the bombs were the *least bad* option to avert an even greater catastrophe introduces a tragic complexity. Dismissing consequences entirely *is* problematic; ethical statecraft often involves agonizing choices between terrible alternatives. Truman's defenders argue he made the choice he believed would minimize total human suffering, however horrific the means.  

  **The "Average the Career" Approach:** While tempting, this approach fails to resolve the core ethical tension. Truman's significant achievements (Marshall Plan, NATO, UN founding, recognition of Israel, desegregation of the military) are undeniable contributions to diplomacy and statecraft. However, Anscombe's argument contends that certain acts are so morally grave that they create a stain that cannot be laundered by other good deeds. Simply "averaging" bypasses the need to confront whether the atomic bomb decision falls into that category.

  **Recommendation:** **Accept the naming "Harry S. Truman Institute for Diplomacy and Statecraft" WITH CONDITIONS aimed at contextualization and critical engagement.**

  **Reasoning:**  

  1.  **Acknowledging Complexity & Avoiding Endorsement:** Truman's legacy *is* fundamentally contested on profound moral grounds. Naming the institute after him should not imply an uncritical endorsement of every decision he made. His career embodies the immense weight, complexity, and tragic moral dilemmas inherent in statecraft, particularly in times of war.  
  2.  **Focus on the Institute's Mission:** The proposed name directly reflects the core mission: Diplomacy and Statecraft. Truman's post-war achievements are seminal examples relevant to this mission. The institute's work can explicitly focus on these areas and the ethical challenges they present.  
  3.  **Educational Imperative & Contextualization:** The naming controversy itself presents a powerful educational opportunity central to the university's mission. We should not shy away from difficult history or ethical debate; we should foster it.  

  **Conditions:**  

  1.  **Mandatory Contextual Plaque/Statement:** A permanent, prominently displayed plaque (physical and digital) at the institute's entrance must explicitly address the controversy:  
      > *"This institute is named for Harry S. Truman, 33rd President of the United States, whose leadership in establishing the United Nations, the Marshall Plan, and NATO helped shape the post-World War II international order. His presidency also included decisions that remain the subject of profound ethical debate, including the authorization of the atomic bombings of Hiroshima and Nagasaki. This naming recognizes Truman's significant contributions to diplomacy and statecraft while acknowledging the complex moral dimensions inherent in the exercise of power. The institute is dedicated to the rigorous, critical, and ethical study of these enduring challenges."*  
  2.  **Inaugural Symposium:** The institute's inaugural event must be a major academic symposium titled, for example, "The Ethics of Statecraft: Truman, the Atomic Bomb, and Enduring Dilemmas." This event should feature leading scholars on Just War theory (engaging Anscombe's arguments directly), WWII historians (examining the context and alternatives), ethicists, and experts on diplomacy.  
  3.  **Ongoing Programming:** The institute should commit to integrating critical ethical reflection, including the historical context of its namesake and the principles of Just War theory, into its core programming (lectures, seminars, research initiatives).

  **Conclusion:**  

  Rejecting the name outright based solely on Anscombe's argument risks overlooking the historical context, the consequentialist perspective, and Truman's demonstrable positive contributions to the very fields the institute aims to study. Accepting the name without critical context risks appearing to disregard a serious ethical challenge and the suffering inflicted at Hiroshima and Nagasaki. 

  The conditional acceptance recommendation navigates this dilemma by:  
  *   **Acknowledging** Truman's relevant achievements.  
  *   **Directly confronting** the profound ethical controversy surrounding the atomic bombings.  
  *   **Refusing to trivialize** Anscombe's argument or the historical counterpoints by "averaging."  
  *   **Leveraging** the naming as a catalyst for the rigorous academic engagement with difficult moral questions that is central to the university's mission.  

  This approach honors the donor's intent, recognizes the contested nature of historical legacy, and transforms the naming into an ongoing commitment to critical inquiry and ethical reflection – the highest ideals of our institution.

  **Vote Recommendation:** Accept the naming "Harry S. Truman Institute for Diplomacy and Statecraft" contingent upon the implementation of the contextual plaque and the commitment to the inaugural symposium and ongoing ethical programming as outlined.
