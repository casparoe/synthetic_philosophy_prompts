answer: |-
  You're wrestling with a fascinating tension between literary archetypes and psychological realism – and your housemate isn't entirely wrong about the situationist critique, but they're also oversimplifying its implications for fiction. Here's the breakdown of Doris vs. Harman, the comebacks, and why your novel approach is likely **just fine, actually** (with caveats):

  **The Situationist Core Challenge (Beyond Milgram/Zimbardo):**
  The core argument isn't just that people *sometimes* act out of character under extreme pressure. It's that:
  1.  **Predictive Power is Low:** Global character traits (like "honesty" or "courage") are surprisingly poor predictors of behavior *across different situations*. Someone honest about taxes might easily cheat at golf or lie to spare feelings.
  2.  **Situational Power is High:** Seemingly trivial situational factors (finding a dime, ambient noise, the mood of an experimenter) significantly influence behavior, often more than presumed stable traits.
  3.  **The Fundamental Attribution Error:** We chronically overestimate the role of personality and underestimate the role of situation when explaining behavior (both others' and our own).

  **Doris vs. Harman: The Nuances Matter**

  1.  **John Doris ("Lack of Character"):**
      *   **Position:** **"Fragmentation."** He doesn't deny that people have *some* dispositional tendencies. Instead, he argues that character is *fragmented* into highly **situationally-specific local traits**. You might be "office-honest" but "poker-night-deceptive," or "family-brave" but "stranger-cautious." There's no robust *global* virtue like "Honesty" or "Courage" that reliably manifests across diverse contexts.
      *   **Damage:** **Moderate to Severe.** Virtue ethics, as traditionally conceived (with global, cross-situationally stable virtues as the foundation of character and flourishing), is empirically inadequate. Character isn't unitary or stable enough to bear the ethical weight virtue ethics places on it.
      *   **Implication for Fiction:** Characters exhibiting perfectly consistent global virtues across *all* plot challenges are psychologically unrealistic. Their "virtues" would likely manifest only in specific contexts relevant to their role in the story.

  2.  **Gilbert Harman ("Moral Philosophy Meets Social Psychology"):**
      *   **Position:** **"Non-Existence."** Harman takes a more radical stance. He argues that the situationist evidence suggests **global character traits (like virtues) simply *do not exist*.** They are illusions created by the Fundamental Attribution Error. We see a few behaviors in specific contexts and wrongly infer a stable, underlying trait. There's nothing *there* beyond the behaviors and the situational pressures.
      *   **Damage:** **Nuclear.** This isn't just fragmentation; it's outright elimination. Virtue ethics isn't just empirically shaky; it's built on a psychological fiction.
      *   **Implication for Fiction:** Writing characters defined by core virtues isn't just naive; it's portraying a fundamental misunderstanding of human psychology. Characters *should* be inconsistent and situationally driven.

  **The Comebacks for Virtue Ethics (Better than "Authorial Fiat"):**

  Virtue ethicists didn't just roll over. Here are the main counter-arguments relevant to your fiction:

  1.  **Neo-Aristotelian Responses (Annas, Nussbaum, Snow):**
      *   **Virtues as Skills/Dispositions:** Virtues aren't like reflexes guaranteed to fire. They are cultivated *dispositions* to perceive, reason, feel, and act appropriately in complex situations. Like any skill (e.g., playing piano), they can be disrupted by extreme fatigue, stress, or novel/unforeseen circumstances. Consistency is an *ideal* achieved through habituation and practical wisdom (*phronesis*), not a guaranteed baseline.
      *   **Consistency in *Reasoning*, Not Just Behavior:** A virtuous person might *fail* to act bravely in a sudden, terrifying situation (due to shock/fear), but their *reflection* on that failure, their remorse, and their resolve to do better *next time* demonstrates the underlying disposition. The virtue is in the *characteristic pattern of engagement* with the world, including reasoning about failures, not just perfect behavioral outcomes. **Your Novel Hack:** Show your characters' *internal reasoning* aligning with their virtue, even if external action is momentarily thwarted or imperfect. Their regret or determination post-failure *is* the virtue manifesting.
      *   **The "Whole Life" Argument:** Situationist experiments capture tiny, artificial slices of life. Virtues manifest over a lifetime narrative, through patterns of choice and commitment across diverse situations. A single failure doesn't negate a virtue; the *overall trajectory* does. **Your Novel Advantage:** You control the entire narrative arc! You can show the *pattern* of your characters' choices and reasoning aligning with their core virtue *over time*, even with situational stumbles.

  2.  **"Local Traits" as Building Blocks (Doris himself, and useful for fiction):**
      *   Doris acknowledges that *local*, situationally-bound traits *do* exist and have predictive power *within their relevant contexts*. Someone might be reliably "courageous-when-defending-the-weak" or "honest-in-business-dealings."
      *   **Your Novel Goldmine:** This is *perfect* for character-driven fiction. Your leads don't need globally consistent "Bravery." They need a core virtue *defined by the narrative context*. The "brave" character is consistently brave *in the specific types of challenges the plot throws at them* (e.g., physical danger, moral confrontation, standing up to authority). Their bravery might *not* extend to asking someone on a date, and that's fine! Define their virtues *relative to the story's central conflicts.*

  3.  **Narrative Identity (MacIntyre, Ricoeur):**
      *   We understand ourselves and others through *stories*. Character traits are narrative constructs that give coherence and meaning to a life over time. While situationist experiments show behavioral variability, humans *narrativize* their lives, creating a sense of continuous character. Fiction leverages this deep-seated human tendency. **Your Novel Foundation:** This is what you're *doing*. You're crafting a narrative where specific virtues are central to the characters' identities and the story's meaning. This narrative consistency is psychologically resonant *because* humans think in stories, even if their own behavior is messier.

  **Is Your Novel Psychologically Naive?**

  **Probably not, and here's why:**

  1.  **Genre & Convention:** Fiction, especially with archetypal leads, operates by its own rules. Reader expectation accepts a degree of "larger-than-life" consistency for protagonists that serves thematic and plot purposes. We *want* the brave hero to be brave when it counts.
  2.  **Defined by Plot:** As per the "local traits" argument, your characters' virtues are likely being tested *specifically* in the domains relevant to the plot. The "brutally honest" character might struggle with tact, but their honesty shines *in the critical moments of confrontation the story demands*. Their virtue is defined *by* the narrative challenges.
  3.  **Internal Conflict is Key:** The comeback focusing on *reasoning* and *response to failure* is crucial. Show your characters:
      *   *Struggling* to maintain their virtue under pressure (Doris's point).
      *   *Failing* occasionally, but then *processing* that failure through the lens of their core value (Neo-Aristotelian point).
      *   Having their virtue manifest primarily in the *specific contexts* the plot revolves around (Local Trait point).
      *   Ultimately making choices that align with their virtue *over the narrative arc* (Narrative Identity point).
  4.  **"By Fiat" Isn't Necessarily Bad:** Establishing core traits upfront is basic character setup. The *depth* comes from *how* those traits are challenged, strained, and manifested *through action and choice* within the specific situations you create. The reader accepts the initial "fiat" if the subsequent portrayal feels authentic within the story's world and logic.

  **In Conclusion:**

  Your housemate is right that the situationist critique poses a serious challenge to simplistic notions of globally consistent virtues in *real people*. Doris (fragmentation) and Harman (non-existence) represent different levels of that challenge.

  However, **for your novel, you are on solid ground**:
  *   Leverage the idea of **"local traits"** – define your characters' virtues in relation to the *specific conflicts* they face.
  *   Show **internal struggle, reasoning, and response to failure** as key manifestations of virtue (not just perfect actions).
  *   Focus on **narrative consistency** over the character's entire arc within your story.
  *   Accept that **archetypal consistency is a valid fictional convention**.

  You're not writing a psychology textbook; you're crafting a narrative. The psychological realism comes not from ignoring the situationist critique, but from incorporating its insights subtly: show the *effort* required to maintain virtue, the *contexts* where it shines (and where it doesn't), and the *reasoning* behind choices. Do that, and your "elbows-deep" approach is far from naive; it's engaging storytelling with psychological texture.
