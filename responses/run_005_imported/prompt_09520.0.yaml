answer: |-
  Your student has made a sharp observation, and the tension you identify between the "two-effects" reasoning and the "public authority" exception is indeed central to a full understanding of Aquinas's Article 7. This passage isn't presenting a single, monolithic "doctrine of double effect" as later systematized; it's grappling with the complex reality of self-defense within a specific theological and legal framework. Here's a breakdown of the distinct moral arguments at work and their relationship:

  1.  **The Core Double-Effect Argument (Private Individuals):**
      *   **Structure:** An act (repelling force) can have two effects: saving one's life (good) and killing the aggressor (bad).
      *   **Key Principle:** The moral species of the act is determined by what is *intended*. The bad effect (killing) must be *unintended* and merely *foreseen* as a possible consequence.
      *   **Justification:** The *intended* good effect (preserving one's own life) is licit because self-preservation is a natural inclination ("natural to everything to keep itself in 'being'").
      *   **Constraint - Proportionality:** The act must use *moderate force* ("repel force with moderation"). Using "more than necessary violence" renders the act unlawful, *even if* the death was unintended. This proportionality is intrinsic to the act being a *defensive* act rather than an offensive one.
      *   **Constraint - No Obligation to Forfeit Life:** One is not required to sacrifice one's own life to avoid causing the aggressor's death ("bound to take more care of one's own life than of another's").
      *   **Scope:** This justification applies to the *private individual* acting in self-defense. The killing is *never* intended; it's a tolerated side-effect under strict conditions.

  2.  **The Public Authority Argument (Soldiers, Judges' Officers):**
      *   **Structure:** Certain individuals (soldiers, officers of the judge) possess "public authority acting for the common good."
      *   **Key Principle:** This authority grants them a *licit object of intention* that is *forbidden* to private individuals: *intending* the death of an aggressor (e.g., enemy combatant, robber).
      *   **Justification:** The intention to kill is rendered lawful *not* because it's unintended, but because it is "referred to the public good." Their role transforms the act from private defense into an execution of public justice or defense of the commonwealth.
      *   **Constraint - Motive:** They must act *for the public good*, not from "private animosity." Acting from personal malice ("moved by private animosity") renders the act sinful, *even if* they have authority.
      *   **Constraint - Proportionality (Implied):** While not explicitly restated here, the context strongly suggests proportionality still applies. The "minister of the judge struggling with robbers" must use force appropriate to subduing them. A soldier using excessive force against a defeated foe would likely violate justice. The principle of moderation is a general norm governing *all* use of force.
      *   **Scope:** This justification applies *only* to those holding specific public offices. For them, the prohibition against *intending* killing is lifted *in the performance of their duty for the common good*. The death *is* intended as a means to the public good.

  **The Relationship Between the Two Arguments:**

  *   **Not Two Independent Licenses Side-by-Side:** Aquinas isn't simply offering two equally valid ways for anyone to justify killing. The arguments are fundamentally distinct and apply to different agents under different conditions.
  *   **Hierarchical/Qualified Permission:** The core permission for *private* individuals rests *solely* on double effect (unintended death). The permission for *public authorities* rests on their role and the referral to the common good, which *supersedes* the general prohibition against *intending* killing in this specific context. The public authority argument is a *qualification* or *exception* carved out of the general prohibition ("it is not lawful for a man to intend killing a man in self-defense, *except for such as have public authority*...").
  *   **Proportionality as a Shared Constraint:** Proportionality ("moderate force," "not more than necessary") is presented within the double-effect argument but functions as a *general principle* governing *any* act of defense, whether private or public. It ensures the act remains *defensive* rather than punitive or excessive. A public official using grossly disproportionate force would violate justice, regardless of their authority or the common good intention.

  **How Many Arguments? Implications for DDE and Trolleys:**

  *   **Two Distinct Moral Arguments:** Aquinas is employing **two distinct justifying strategies** within this single article:
      1.  **Double Effect + Natural Law:** For private individuals (unintended death as a side effect of proportionate self-defense, justified by natural self-preservation).
      2.  **Role-Based Authority + Common Good:** For public officials (intended killing justified by their role in upholding the public good, constrained by motive and implied proportionality).
  *   **The "Referral" and Double Effect:** The phrase "refer this to the public good" is **not** merely a further application of double effect. In double effect, the bad effect is *unintended*. Here, for public officials, the death *is* intended, but its *moral character* is transformed by being embedded within an act of public duty for the common good. It's a different *kind* of justification – appealing to the agent's role and the nature of the act as public service rather than private action.
  *   **Implications for Trolley Problems and the "Origin" of DDE:**
      *   **Limited Scope of Aquinas's Double Effect:** Aquinas explicitly develops the double effect reasoning *only* for the case of a *private individual* defending *themself* against an *unjust aggressor*. This is a very specific scenario.
      *   **Not a General-Purpose Doctrine Here:** The text of Q.64, Art.7 itself does *not* articulate a general-purpose "doctrine of double effect" applicable to bystanders, unintended harm to innocents, medical ethics, or trolley scenarios. It solves *this specific problem* (private self-defense killing) using an intention/foresight distinction *combined* with proportionality and natural law.
      *   **Later Development:** The *genius* of later thinkers (like the Salamanca school, Grisez, Boyle, Finnis, and especially its application by Foot/Thomson to trolleys) was to *abstract* the core logical structure of Aquinas's solution to the private self-defense case (one act, two effects, intention determines species, proportionality, unintended bad effect) and apply it to *novel* scenarios *not* involving self-defense against an aggressor (like trolleys, bombing munitions plants, ectopic pregnancies). They generalized a principle implicit in Aquinas's specific solution.
      *   **The Challenge:** The trolley literature often applies this generalized DDE to *private individuals* (bystanders) causing harm to *non-aggressors* (workers, one fat man) for the sake of saving *others*. While the *logical structure* (intention/foresight, proportionality) is derived from Aquinas, the *context* (no self-defense, no aggressor, saving others vs. self, private individual) is significantly different. Aquinas's text *only* directly justifies the private self-defense case using DDE. Applying it to trolley bystanders is an *extension* of the principle, not a direct application of *this* text. The public authority justification is *irrelevant* to the standard private bystander trolley scenarios.

  **Conclusion for Your Seminar:**

  *   Aquinas's ST II-II, Q.64, Art.7 contains **two intertwined but distinct justifications for killing in defensive contexts.**
  *   The **primary and most elaborated argument** is the **double-effect justification for *private individuals***: unintended death as a side effect of proportionate self-preservation.
  *   The **secondary argument** grants a **qualified exception for *public authorities_**: they may *intend* the death of an aggressor *as part of their duty* to protect the common good, provided they act without private malice and (implicitly) proportionately.
  *   **Proportionality** is a **fundamental constraint** applicable to *both* justifications, ensuring the defensive act remains defensive.
  *   **Regarding the Doctrine of Double Effect:** This text is the *historical source* and provides the *core logical structure* (intention/foresight distinction determining moral species, proportionality) that was later generalized. However, it presents this structure *only* applied to the specific case of private self-defense against an unjust aggressor. It does *not* present it as a freestanding, general-purpose doctrine applicable to all moral dilemmas involving foreseen harm. The trolley literature's application of DDE to private bystanders saving others is a *development* and *extension* of the principle Aquinas used here, not a direct reading of his solution for that scenario.

  This nuanced reading explains the "join" your student noticed: Aquinas seamlessly moves from solving the problem for the private citizen (using DDE) to acknowledging the different moral reality of public officials acting *in their official capacity* (using role-based authority and the common good). Recognizing these two strands clarifies the text's complexity and helps frame discussions about the later development and application of "double effect" in contexts Aquinas never explicitly addressed.
