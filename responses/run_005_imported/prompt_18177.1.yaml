answer: |-
  **MEMORANDUM**  
  To: Graduate Research Grant Committee  
  From: [Your Name], PhD Candidate in Philosophy, Student Representative  
  Date: October 26, 2023  
  Subject: Recommendation on Tie-Break Protocol for Grant Awards  

  ### **I. Introduction**  
  This memo addresses the dispute over our tie-break protocol for grant awards. When proposals tie on composite scores, our standing rule awards the grant to the applicant least recently funded (or never funded). A proposal has been made to replace this with a weighted lottery among tied applicants, on grounds of fairness. After careful analysis, I recommend retaining the status quo. While the lottery proposal raises valid concerns, Harsanyi’s aggregation theorem—invoked by our chair—demonstrates that both protocols yield identical *expected scientific value*. Crucially, however, the status quo better aligns with our committee’s institutional role in promoting equitable access to funding over time. Below, I explain why Harsanyi’s theorem does not resolve the ethical dispute, present the strongest case for the lottery, and defend the status quo as superior.  

  ---

  ### **II. Harsanyi’s Theorem: What It Does (and Does Not) Settle**  
  Our chair correctly notes that Harsanyi’s theorem shows the status quo and a lottery produce identical *expected outcomes* under reasonable assumptions. For non-specialists, here’s a simplified breakdown:  
  1. **The theorem’s logic**: If our committee’s preferences over funding decisions satisfy transitivity, the axioms of expected utility, and unanimity (i.e., if all members agree on a choice, the committee adopts it), then our collective ranking can be represented as maximizing a weighted sum of applicants’ expected scientific value.  
  2. **Implication for tie-breakers**: When two proposals tie, both protocols—  
     - **Status quo**: Award to the least recently funded applicant.  
     - **Lottery**: Random selection with equal odds.  
     —yield the same weighted sum of expected scientific value. Thus, by Harsanyi’s metric, they are equivalent.  

  **Why this doesn’t end the debate**:  
  Harsanyi’s theorem evaluates outcomes solely through the lens of *aggregate expected utility*. It cannot distinguish between a lottery (which gives tied applicants equal *chances*) and the status quo (which gives one applicant a *certain* award based on history). As economist Peter Diamond observed in 1967, fairness sometimes demands equal ex-ante opportunities—not just equal ex-expected payoffs. If two applicants are equally deserving, a coin flip treats them symmetrically; the status quo does not. Harsanyi’s framework is blind to this distinction.  

  ---

  ### **III. The Case for a Lottery: Fairness as Symmetry**  
  The dissenting member’s argument deserves serious consideration. In its strongest form:  
  - **Core principle**: When our committee certifies two applicants as equally meritorious, fairness requires treating them identically. A lottery achieves this by giving each an equal chance (e.g., 50% for two applicants). The status quo, however, discriminates based on an external factor (funding history) unrelated to the proposal’s scientific merit.  
  - **Moral intuition**: Imagine two equally qualified candidates for a single job. Flipping a coin feels fairer than hiring the candidate who was unemployed longer—even if both have the same expected welfare gain. Similarly, granting funds based on history introduces a form of "past-looking" bias that undermines the parity we affirmed in our evaluation.  
  - **Procedural integrity**: A lottery embodies the ex-ante perspective of justice: it ensures the committee’s actions align with its judgment of equality *at the moment of decision*. The status quo, by contrast, relies on historical accidents, potentially perpetuating advantage.  

  This view draws strength from political philosophy (e.g., theories of distributive justice) and legal practice (e.g., random lotteries for scarce resources like visas).  

  ---

  ### **IV. Why the Status Quo Prevails: Equity, Predictability, and Institutional Purpose**  
  Despite the moral force of the lottery argument, three factors favor retaining the status quo:  
  1. **Intertemporal equity**: Our mandate extends beyond allocating funds in a single cycle. The status quo promotes *long-run fairness* by prioritizing applicants with less prior access to grants. This redresses cumulative disadvantage (e.g., early-career researchers or those from underfunded departments) and encourages diverse participation across cycles. A lottery, while symmetric ex-ante, risks concentrating opportunities ex-post (e.g., an applicant could lose multiple ties due to bad luck).  
  2. **Predictability and incentives**: Applicants invest significant effort in proposals. The status quo’s transparency (funding history is public) allows applicants to anticipate their chances in ties. A lottery introduces randomness that may deter submissions from those who perceive grants as capricious—undermining our goal of broad engagement.  
  3. **Institutional legitimacy**: As a recurring committee, we are stewards of sustainable funding distribution. The status quo’s "waiting period" logic is familiar (e.g., analogous to queueing systems) and easily justified to stakeholders. A lottery, though procedurally symmetric, invites criticism that we abdicate responsibility for equitable outcomes over time.  

  Crucially, **Harsanyi’s equivalence reinforces this choice**: If both protocols yield identical expected scientific value, we may reasonably prioritize secondary values like intertemporal equity without sacrificing efficiency.  

  ---

  ### **V. Recommendation**  
  I recommend **retaining the status quo tie-break protocol** (award to the applicant least recently funded). While the lottery’s emphasis on symmetry is compelling in theory, the status quo better serves our committee’s broader mission: to allocate scarce resources in a way that balances merit, fairness, and the long-term health of our research community. Harsanyi’s theorem confirms that we do not sacrifice scientific value by doing so.  

  For this cycle, we should apply the standing rule consistently. If concerns persist, I propose a post-cycle review of historical funding patterns to ensure the rule achieves its equity goals.  

  ---  
  **Vote**: I move to adopt the above recommendation.  
  **Submitted by**: [Your Name], Student Representative
