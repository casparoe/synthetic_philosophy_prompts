  - Conclusion: Reiterate the recommendation.

  Given the context, I recommend sticking with the status quo tiebreaker (least recently funded) for the following reasons:

  1. The status quo tiebreaker is already in place and has been used. Changing it might be seen as unfair to those who have been waiting longer under the existing rule.
  2. The lottery introduces an element of chance that might be perceived as arbitrary and could lead to questions about the committee's commitment to merit (even though it's among equally meritorious proposals). Moreover, the lottery might be more complex to administer.
  3. While the Diamond critique highlights an important point about fairness as equal chances, in the context of a grant committee, the goal is not only to be fair but also to distribute opportunities to those who have had fewer chances in the past. The status quo rule (which rewards those who haven't been funded recently) promotes a form of intertemporal fairness and encourages a wider distribution of funds over time.

  However, note that the Diamond critique is powerful and in some contexts (like fundamental rights) a lottery might be the fairest. But in this context, the committee has a legitimate interest in ensuring that the grants are distributed in a way that supports a diverse set of researchers over time, not just in one cycle.

  Therefore, the memo will:
  - Recommend the status quo tiebreaker (least recently funded).
  - Explain that Harsanyi's theorem shows that both methods yield the same expected utility, but Diamond's critique points out that they are not the same in terms of fairness.
