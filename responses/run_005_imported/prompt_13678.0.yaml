answer: |-
  You've hit on one of the deepest and most fascinating debates in the philosophy of mathematics! Your brother-in-law's Monopoly analogy captures the *formalist* perspective beautifully: mathematics is a game played with symbols according to agreed-upon rules (axioms). Within this view, CH's independence means it simply lacks a truth value within the ZFC "game" – it's like asking if "landing on Free Parking gives you the pot" is "true" in Monopoly *without specifying which house rules you're using*.

  **However, the mathematicians seriously debating CH's "truth" are operating from a fundamentally different perspective – often called *mathematical realism* (or Platonism). Here's why their quest isn't just philosophy in disguise:**

  1.  **The Reality of Mathematical Objects:** Realists believe mathematical entities (like sets, numbers, functions) exist in an abstract, non-physical realm, independent of human minds or formal systems. ZFC is our current *best attempt* to describe the fundamental truths about this realm, but it might be incomplete or even flawed. For them, the Continuum Hypothesis is a *genuine question* about this reality: "Does this specific type of infinite set *actually exist* between the integers and the reals?"
  2.  **ZFC as an Approximation:** Realists see Gödel's incompleteness theorems as proof that *no* finitely describable formal system (like ZFC) can capture *all* mathematical truth. Independence results like CH show specific gaps in ZFC's descriptive power. The search for new axioms is the search for *better approximations* of the underlying mathematical reality.
  3.  **Criteria for "Good" Axioms:** It's not arbitrary like picking Monopoly house rules. Set theorists propose new axioms based on:
      *   **Intrinsic Necessity:** Does the axiom seem *self-evidently true* about the concept of "set"? (e.g., Large Cardinal Axioms often feel this way, extending the cumulative hierarchy naturally).
      *   **Fruitfulness:** Does the axiom resolve many independent questions, simplify complex theories, or reveal unexpected connections? Does it have desirable *consequences* in other areas of math?
      *   **Robustness/Stability:** Does the axiom hold true in many different models or frameworks? Do different intuitively justified principles converge on the same answer?
      *   **Avoiding Paradox/Inconsistency:** Obviously, the axiom shouldn't lead to contradictions.
  4.  **Why Large Cardinals Aren't Enough (for CH):** While large cardinal axioms resolve many questions and feel intuitively plausible, they generally don't settle CH. Gödel believed CH was false. Cohen leaned towards it being false. Hugh Woodin initially thought large cardinals might imply CH is false, but later work showed they don't. He then explored other axioms (like the Ω-conjecture and forcing axioms like MM - Martin's Maximum) which *do* imply CH is false. The point is, large cardinals are powerful, but they don't exhaust the possibilities for new fundamental principles.
  5.  **The Multiverse View:** Some set theorists (like Joel David Hamkins) embrace the independence. They posit a "Set-Theoretic Multiverse" where different universes satisfy different axioms – some where CH is true, some where it's false. This *is* closer to the Monopoly analogy, but even here, the focus is on understanding the relationships *between* these universes and the underlying structures that generate them. It's not *just* "pick your favorite," but studying the landscape of possibilities.
  6.  **The Stakes:** For realists, settling CH isn't just about tidying up the axioms. It's about *understanding the nature of the mathematical universe*, particularly the structure of the continuum (the real numbers). CH is a fundamental question about how "many" real numbers there really are compared to integers. Getting it "right" (according to their criteria) feels like discovering a deep truth.

  **Where the Monopoly Analogy Falters (and Where It Holds):**

  *   **Holds:** For the *formalist*, working strictly within ZFC, CH *is* undecided like a house rule. You can consistently add either `CH` or `not CH` as an axiom and explore the consequences. Many working mathematicians outside set theory adopt this pragmatic view.
  *   **Falters:** The realist argues mathematics *isn't* just a game we invented. Sets and infinity seem to have a reality we *discover*, not invent. The rules (axioms) are attempts to describe this reality, and some descriptions might be fundamentally *better* or *truer* than others. The decades of research are driven by the conviction that there *is* an answer "out there" in the platonic realm, and we just haven't found the right language (axioms) to see it clearly yet. It's less like debating Monopoly rules and more like explorers debating the true nature of a vast, unseen continent based on partial maps, believing there *is* a single, correct geography to discover.

  **Are They "Just Doing Philosophy"?**

  It's a spectrum. The *technical work* of exploring the consequences of potential new axioms, developing forcing techniques, inner model theory, and large cardinal combinatorics is undeniably deep, rigorous *mathematics*. It produces profound theorems and intricate structures. The *motivation* for focusing on certain axioms and interpreting the results often stems from philosophical commitments (realism vs. formalism vs. multiverse). The *evaluation* of which axioms are "good" involves both mathematical and philosophical criteria.

  **Your Sane Take vs. Their Quest:**

  Your take ("CH isn't true or false 'out there'; it's a choice") is perfectly rational and represents a mainstream philosophical position (formalism or perhaps a type of anti-realism). It's the "sane" view if you believe mathematics is fundamentally a human construct.

  The set theorists' quest is rational *if* you start from the realist premise that an objective mathematical universe exists. Their research program is the logical consequence of that belief: if ZFC is incomplete, we must seek better axioms to describe that reality. The decades of effort reflect the depth of the problem and the conviction that the answer matters for understanding the foundations of mathematics.

  **In Conclusion:**

  You understand the independence result perfectly. The Monopoly analogy accurately captures its formal consequence within ZFC. The set theorists debating CH's "truth" are operating under a different, deeply held philosophical assumption: that mathematics describes an objective reality beyond our formal systems. For them, independence signals ZFC's *inadequacy*, not CH's indeterminacy. Their search for new axioms is a profoundly mathematical attempt to better capture what they believe is a pre-existing truth. It's not *just* philosophy; it's mathematics deeply intertwined with and motivated by a specific philosophical worldview about the nature of its subject matter. Whether you find that worldview compelling determines whether you see their quest as profound discovery or an elaborate game.
