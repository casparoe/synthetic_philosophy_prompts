  First, I need to unpack the ethical layers here. The partner explicitly requested help, which is crucial. The user's actions align with that request—they're assisting in behavior change. But the stealth aspect raises questions. Why didn't they explain the changes? The user mentions that if the partner realizes it's a deliberate plan, it might stop working. That makes sense psychologically; people resist feeling manipulated. 

  The user hasn't lied or restricted access. If the partner really wants the phone, they can get it. So autonomy isn't fully compromised. Still, the secrecy feels off to them. They value honesty in their relationship, so this covert approach clashes with that. 

  I should consider psychological principles. Nudge theory comes to mind—environmental tweaks that guide choices without force. It's effective because it doesn't rely on willpower. But ethics in nudging often hinge on transparency. Is it okay if the nudge aligns with the person's stated goals? Maybe, but in personal relationships, transparency builds trust. 

  The user's worry is valid. If discovered, the partner might feel managed rather than supported. Even if the outcome is desired, the method could undermine trust. The partner might wonder, "What else are they doing without telling me?" 

  Also, the user's identity as a supportive partner matters. They want to help but not control. The conflict is between effective help and honest collaboration. Could discussing the method now, after success, mitigate risks? The user fears ruining the effectiveness, but maybe sharing could deepen mutual understanding. 

  Underlying needs: The partner likely craves presence and connection, not just less phone time. The user might want to feel like an honest ally, not a manipulator. Addressing these deeper needs could involve open dialogue about both their needs. 

  Alternative approaches: The user could say, "I tried some tweaks to help; let me show you." Or ask if the partner noticed changes and discuss what worked. That maintains trust while giving credit for the partner's behavioral shift. 

  In summary, the user's method isn't inherently wrong, but the secrecy carries relational risks. Balancing effectiveness with transparency is key. Their awareness of the tension shows their commitment to the relationship's health, which is positive.
answer: |-
  This is a thoughtful ethical dilemma that touches on autonomy, trust, and the line between supportive facilitation and subtle manipulation. Here's a breakdown of the key considerations:

  **Arguments That This Approach is Ethically Defensible:**
  1.  **Consent & Goal Alignment:** Your partner explicitly asked for your help to reduce their evening phone use *multiple times*. You are acting on a direct request to support a goal *they* set.
  2.  **Beneficence & Effectiveness:** Your actions are genuinely helping them achieve their stated goal without coercion. The outcome is positive and desired by them.
  3.  **Preserving Autonomy:** Crucially, you haven't removed the option. The phone is accessible if they truly want it; you've simply made the *default* choice (reaching over) less convenient and offered an appealing alternative (the book). This leverages behavioral psychology (making the desired behavior easier and the undesired behavior harder) without force.
  4.  **Respecting Psychological Reality:** Your intuition is likely correct. Explicit reminders often trigger resistance ("reactance") or guilt, making the desired behavior *less* likely. Subtle environmental changes bypass this defensive reaction, allowing the new habit to feel organic.
  5.  **No Deception (Strictly Speaking):** You haven't lied. You rearranged items in your shared home. They haven't asked about the changes, so you haven't had to withhold information directly.

  **Arguments That There Might Be an Ethical Problem:**
  1.  **The Secrecy Factor:** The core issue is your intentional *concealment* of the method. While you haven't lied, you are deliberately keeping your partner in the dark about *how* you are helping them achieve *their* goal. This feels like managing them rather than collaborating *with* them.
  2.  **Potential Undermining of Trust:** If discovered, this secrecy could damage trust. They might feel:
      *   **Managed or Patronized:** Like you didn't trust them to respond to direct communication or make their own choices with full awareness.
      *   **Deceived:** Even without explicit lies, the *intentional concealment* of your active role in shaping their environment for a specific behavioral outcome can feel deceptive.
      *   **Wondering "What Else?":** It might lead them to question if you use similar covert methods in other areas of the relationship.
  3.  **Diminished Sense of Agency:** Part of the success is that your partner *attributes* their changed behavior to their own willpower or natural inclination (picking up the book). While this makes it effective, it also means they aren't fully aware of the environmental factors influencing their choice. Their sense of "I chose this freely" is partially an illusion *you* constructed.
  4.  **The Slippery Slope:** While this instance is well-intentioned and goal-aligned, normalizing covert behavioral management within a relationship sets a precedent. What if you started doing this for goals *you* had for them, rather than ones *they* explicitly requested? The method itself is neutral, but the intent and consent matter immensely.

  **Finding the Balance & A Path Forward:**

  *   **It's not inherently "wrong," but the secrecy introduces risk.** The ethical defensibility hinges heavily on the *specific context*: their explicit request, the benign nature of the changes, the preservation of ultimate choice, and the positive outcome.
  *   **The moral weight comes from the "behind the scenes" aspect.** Relationships thrive on transparency and partnership. This method, while effective, leans towards unilateral action rather than collaborative problem-solving.
  *   **Your discomfort is valid and insightful.** It reflects a healthy respect for your partner's autonomy and the importance of honesty in your relationship.

  **What Could You Do?**

  1.  **Consider Disclosure (Carefully):** You could say something like: "Hey, remember when you asked me to help you cut back on your phone at night? I thought about how reminders might feel naggy, so I tried making it a tiny bit less convenient to grab and put that book we like right there instead. Seems like it might be helping? I just wanted to let you know what I was thinking." Frame it as sharing a strategy *after* seeing it work, emphasizing your desire to avoid nagging and support their goal. The risk of it "falling apart" exists, but the trust gained might be worth more long-term.
  2.  **Focus on the Positive Outcome:** "I've noticed you're reading more in the evenings lately, it's really nice! How are you finding it?" This opens a conversation about the *result* they wanted without necessarily revealing your method, allowing them to take ownership of the change.
  3.  **Reflect on Future Approaches:** For *future* support requests, could you brainstorm solutions *together*? "You asked for help with the phone in the evenings. What kind of help would feel supportive to you? Would reminders help, or maybe changing where the charger is, or finding something else to do instead? Let's figure something out together." This fosters collaboration and avoids secrecy.

  **Conclusion:**

  You acted with good intentions based on a direct request, using a psychologically sound and non-coercive method that achieved the desired result. **However, the deliberate secrecy is the ethically grey area.** While not necessarily a major transgression in this specific instance, it introduces a small element of paternalism ("I know what's best *for you*, and I'll arrange it without your full awareness") that conflicts with the ideal of equal partnership built on open communication.

  The morally safest and most relationship-strengthening path forward is likely **gentle disclosure** – explaining your reasoning and actions now that the change has taken hold, framed entirely as an attempt to honor their request in a way you hoped would be effective without being annoying. This preserves the benefit while restoring full transparency and respecting their agency to know how they are being supported. If the habit is truly ingrained, the knowledge might not derail it, and the trust gained will be invaluable.
