  Okay, let me unpack this user's question. They're in a philosophy/linguistics seminar focusing on conditionals, specifically Lewis's 1976 triviality proof. Their professor presented the proof as showing that indicative conditionals can't have truth conditions because the Equation (P(A>C) = P(C|A)) can't hold across conditionalizations without collapsing the probability space. The professor concluded that indicative conditionals aren't propositions but rather expressions of conditional credence. 

  But now the user is reading Stalnaker, Kratzer, and von Fintel who all maintain truth-conditional approaches to "if". The user is confused—did Lewis actually prove truth-conditional theories impossible? Are these theorists ignoring the result? Or is there a way around it?

  First, I need to clarify what Lewis's proof actually shows. The key point is that the proof assumes the Equation holds universally and that conditionals are propositions with truth values. The collapse occurs because maintaining P(A>C) = P(C|A) across all probability distributions forces the space to be trivial. So the proof is conditional on these assumptions.

  The user's professor presented this as evidence against truth conditions. But truth-conditional theorists like Stalnaker don't accept the universal applicability of the Equation. Stalnaker's approach separates the logic of conditionals from probabilistic constraints. For him, conditionals have truth conditions but don't obey the Equation in all contexts. 

  Kratzer and von Fintel use a dynamic semantics framework where conditionals' truth depends on contextually supplied information. They might restrict the Equation to specific, non-conditionalized contexts. So their response is to limit the scope of Lewis's assumptions rather than abandon truth conditions.

  The user might be feeling conflicted because their professor presented Lewis's result as definitive, but the syllabus includes theorists who seem unaffected by it. The deeper issue is understanding the philosophical divide: some view the Equation as essential to conditionals' meaning, while others see it as a useful but non-definitive feature. 

  I should explain that Lewis's proof highlights a tension between truth conditions and the Equation under certain probabilistic constraints. But rejecting truth conditions isn't the only solution; restricting the Equation's scope or adopting a different semantics are viable alternatives. The user needs to recognize that the "moral" drawn from Lewis depends on one's prior commitments about conditionals.

  Also, the user mentioned a classmate's unsuccessful counterargument. They might want to explore how truth-conditional theorists formally address the triviality result. Pointing to Stalnaker's near-trueness or context-dependent theories could help them see the nuanced responses available. 

