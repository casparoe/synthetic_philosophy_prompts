answer: |-
  Here's a story playing with that tension:

  The bell in the old watchtower hadn't tolled in living memory. It was said to be a relic of storm-watchers long gone, its bronze gone dull and green. Until the spring equinox, when a tremor unlike any other shook the valley, and the bell let out a single, resonant **BONG** that echoed off the hills. It wasn’t a storm warning. It was… knowledge.

  Old Man Willem, tending the community grain store – the heart of Oakhaven – felt it first. A vision flashed: his wheat fields, impossibly golden and heavy, swaying under a perfect sky. A *certainty* settled in his bones. Others felt it too, a distinct, personal revelation etched into their minds by the bell’s chime. Marta saw her orchard blighted, fruit shrivelled on the branch. Young Thorne saw his cattle fattened beyond measure. Each farmer, each herder, saw their *own* harvest, their *own* fortune, laid bare months before the reaping.

  At first, it felt like pure gift. Thorne strutted, already counting coin. Willem planned barn expansions. Marta wept quietly, but began seeking loans early. The uncertainty that had always hung over Oakhaven, the shared dread of drought or blight, seemed lifted. They could *plan*!

  But Willem, standing before the vast, communal granary – where for generations, everyone had deposited a share of their harvest in good years to draw upon in lean ones – felt a cold dread creep in. He saw Thorne approaching, a familiar sack in hand, but no grain to deposit. "Willem," Thorne said, his voice tight with newfound calculation. "I’ll be withdrawing my family's reserve grain. All of it."

  Willem frowned. "But Thorne, the bell... you saw plenty. Why withdraw *now*?"

  "Exactly!" Thorne leaned in. "I *know* I won’t need the store this year. Why should I leave my good grain here…" his eyes flickered towards Marta’s cottage, "…for *others* to use? It’s mine. I’ll need the space for my own surplus." He took his grain and left.

  Marta came next, pale but resolute. "I saw the blight, Willem. I need my reserve grain *now*, to sell and buy remedies, to try and salvage something."

  "But Marta," Willem protested weakly, "the whole point is that the store supports you *if* the blight hits. Taking it early weakens the pool for everyone."

  "And if the remedies fail? What if there’s nothing left when I truly need it?" Her voice trembled. "I *know* I’ll need it. I have to take it *now*."

  One by one, they came. Those who saw bounty withdrew their contributions, unwilling to subsidize the "losers" whose fates they now knew. Those who saw ruin withdrew their safety net, terrified it wouldn’t be there when their personal disaster struck. The logic was impeccable, individual, rational. Protect your own known future.

  Within a week, the vast granary stood echoing and nearly empty. The intricate, generations-old web of mutual dependence – woven precisely *because* no one knew whose field would fail or flourish – lay in tatters. The bell’s gift of foreknowledge hadn’t just illuminated their futures; it had blinded them to the value of their shared, uncertain present. It had shown each one the path to individual security, and in doing so, had meticulously dismantled the only thing that had ever truly guaranteed it for them all.

  Willem locked the granary door for the last time, the weight of the silent, useless bell hanging heavy in the air. The certainty they’d craved had arrived, and its first harvest was the destruction of their common ground. They were no longer a village sharing risk; they were isolated islands, each adrift on the sea of their own inevitable, lonely fate.
