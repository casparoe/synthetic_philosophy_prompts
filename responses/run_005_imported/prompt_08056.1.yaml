  First, I need to unpack the core concepts. The "dualism of practical reason" is Sidgwick's idea that there's a conflict between rational self-interest and moral duty. If the universe isn't structured to reward virtue, then being moral might not be rational. Sidgwick hoped psychical research could prove an afterlife where virtue is rewarded, thus reconciling the dualism. The historian's thesis links this directly to his utilitarianism.

  For the questions: 
