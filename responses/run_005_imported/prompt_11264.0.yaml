answer: |-
  Your experience is a textbook example of a **discursive dilemma** (or **doctrinal paradox**) in judgment aggregation theory—a profound phenomenon where rational individual judgments lead to seemingly inconsistent collective outcomes depending on the voting procedure. This is not an error, nor does it imply irrationality. Instead, it reveals a fundamental tension in aggregating multidimensional preferences.

  ### 1. The Phenomenon Explained
  - **Individual judgments were coherent**:  
    Each member applied consistent logic:  
    - **You (Voter 3)**: Research ✔️, Teaching ✔️ → **Recommend ✔️**  
    - **Colleague 1**: Research ✔️, Teaching ❌ → **Recommend ❌**  
    - **Colleague 2**: Research ❌, Teaching ✔️ → **Recommend ❌**  

  - **Dimension-by-dimension vote**:  
    - Research: ✔️ (Voters 1+3)  
    - Teaching: ✔️ (Voters 2+3)  
    → *Collective certification: Both dimensions adequate* → **Recommendation passes**.  

  - **Direct vote**:  
    - Recommend: ✔️ (Only Voter 3)  
    - Recommend: ❌ (Voters 1+2)  
    → **Recommendation fails 2–1**.  

  **Why this is not a contradiction**:  
  The paradox arises because the two procedures aggregate judgments differently:  
  - **Dimension-wise voting** treats research and teaching as *independent premises*. Majority approval on each premise mechanically implies the conclusion (recommendation).  
  - **Direct voting** treats the recommendation as a *single holistic decision*, ignoring the internal logical structure.  

  This creates a disconnect between **premise-based** and **conclusion-based** aggregation. Both outcomes are "correct" under their respective rules, but they conflict because the group lacks a unanimous view on *how the premises interact* to form the conclusion.  

  ### 2. Is This a General Phenomenon?  
  Absolutely. The discursive dilemma is:  
  - **Formally identical** to the Condorcet paradox but applied to *logical premises* rather than preferences.  
  - **Ubiquitous in committee decisions** involving conjunctive (e.g., "A and B must hold") or disjunctive rules.  
  - **Proven to be unavoidable** in judgment aggregation: When individual judgments are consistent, collective inconsistency can still emerge (List & Pettit, 2002).  

  Your committee’s votes perfectly illustrate the paradox:  
  | Voter | Research | Teaching | Overall |  
  |-------|----------|----------|---------|  
  | 1     | ✔️       | ❌       | ❌      |  
  | 2     | ❌       | ✔️       | ❌      |  
  | 3     | ✔️       | ✔️       | ✔️      |  
  **Majority on premises**: ✔️/✔️ → Pass  
  **Majority on conclusion**: ❌ → Fail  

  ### 3. Which Procedure Should You Trust?  
  There is **no neutral, principled answer**—the choice depends on institutional priorities:  

  #### Case for Dimension-by-Dimension Voting:  
  - **Aligns with procedural fairness**: Your department’s rules explicitly define certification as satisfying *both dimensions independently*. Overriding this with a direct vote subverts the established process.  
  - **Preserves expertise**: Colleagues may have specialized knowledge (e.g., one excels in research assessment, another in teaching evaluation). Premise-based voting respects this division.  
  - **Avoids "hidden vetoes"**: Voters 1 and 2 each rejected only one dimension but would block the candidate holistically. Premise-based voting prevents a minority from imposing stricter standards.  

  #### Case for Direct Voting:  
  - **Reflects "all-things-considered" judgment**: Voters 1 and 2 deemed the candidate *unacceptable overall* despite partial strengths. Ignoring this may feel undemocratic.  
  - **Exposes preference intensity**: A voter might tolerate weakness in one dimension if compensated by strength in another—but conjunctive rules don’t allow trade-offs.  

  #### Practical Recommendations:  
  1. **Default to the codified procedure**: If departmental policy mandates dimension-by-dimension certification, that outcome should stand. Changing rules mid-process risks arbitrariness.  
  2. **Revise future procedures**: Propose a meta-rule specifying how conflicts are resolved (e.g., "If premises are satisfied but direct vote fails, trigger re-deliberation").  
  3. **Seek consensus**: For your next candidate, discuss *why* members disagree on dimensions. Voter 1 might accept weaker teaching if research is exceptional (or vice versa), potentially aligning judgments.  

  ### Key Insight for Your Research  
  This episode highlights a core limitation of aggregation rules: **No voting system can simultaneously satisfy all democratic ideals** (e.g., consistency, responsiveness, procedural fairness). Your reading group is correct—this parallels Condorcet cycles but in a judgment aggregation framework. The literature (e.g., List, Dietrich, Nehring) shows such paradoxes vanish only under unrealistically restrictive conditions (e.g., unanimous priority orders).  

  In your position, defend the dimension-based outcome as procedurally correct, but advocate for clarifying departmental voting rules to avoid future ambiguity. What you witnessed was not irrationality—it was the collision of impeccable logic with the inherent fragility of collective decision-making.
