  Category 1: Accurate statement of KP and NonO (4 points)
  - KP: p → ◇Kp (for every truth p, it is possible that p is known)
  - NonO: ∃p(p ∧ ¬Kp) (there exists a true proposition that is not known)

  The student's answer:
  - KP: "every truth is at least possibly known: for any p, if p is true then it's possible that someone knows p" -> This is correct. It matches the given definition.
  - NonO: "there's at least one true proposition nobody actually knows, i.e. ∃p(p ∧ ¬Kp)" -> This is also correct.

  Therefore, full marks: 4/4.

  Category 2: Correctness of the reductio itself (8 points)
  The student must correctly reconstruct the proof. Steps should include:
  1. Assume KP and NonO.
  2. NonO gives us a specific true proposition that is not known: let p be such that p ∧ ¬Kp is true.
  3. Apply KP to the conjunction p ∧ ¬Kp: so ◇K(p ∧ ¬Kp).
  4. Knowledge distributes over conjunction: K(p ∧ ¬Kp) entails Kp and K(¬Kp).
  5. Factivity of knowledge: K(¬Kp) entails ¬Kp.
  6. So from K(p ∧ ¬Kp) we get Kp and ¬Kp, a contradiction.
  7. Therefore, the assumption that KP and NonO are both true leads to a contradiction.

  The student's reconstruction:
  - They take the unknown truth from NonO: p ∧ ¬Kp (they say "call it p", but then they use the conjunction, which is correct because NonO asserts the existence of a proposition that is both true and unknown, so they are using the conjunction as the proposition to which KP is applied).
  - They apply KP to the conjunction: ◇K(p ∧ ¬Kp).
  - They note that knowledge distributes: so K(p ∧ ¬Kp) implies Kp and K(¬Kp).
  - They note that knowledge is factive: so K(¬Kp) implies ¬Kp.
  - They then get a contradiction: the knower would both know p (from Kp) and not know p (from ¬Kp).
  - They conclude that KP and NonO are inconsistent.

  This is a correct reconstruction. However, note that the student says: "Because this reasoning never depended on which p we picked, it's a necessary truth that (p ∧ ¬Kp) can't be known by anyone". This is a bit off because the proposition that is unknowable is the specific one that is both true and unknown, but the reasoning does depend on the existence of such a p (from NonO). The contradiction arises from assuming both KP and NonO. The student's conclusion that the conjunction (p ∧ ¬Kp) is unknowable is correct, but note that the argument shows that if NonO is true (so there is such a p), then KP leads to a contradiction. So the inconsistency is between the two principles.

  But the student does say: "So KP and NonO are jointly inconsistent." So that's correct.

  One minor point: the student says "it's a necessary truth that (p ∧ ¬Kp) can't be known by anyone". This is not exactly a necessary truth; rather, the argument shows that if there is an unknown truth (NonO), then KP leads to the claim that it is possible to know (p ∧ ¬Kp), which is impossible. So the conjunction (p ∧ ¬Kp) is unknowable (if it is true). But note that the argument does not show that (p ∧ ¬Kp) is a necessary truth, only that if it is true then it is unknowable. However, the student is correct that the argument shows that (p ∧ ¬Kp) cannot be known (if it is true). And indeed, the argument shows that no such conjunction can be known because it leads to contradiction.

  So overall, the reductio is correctly explained. I don't see any errors. 8/8.

  Category 3: Correctly identifying exactly which proposition the argument shows to be unknowable, and why that matters for anti-realism (4 points)

  The student says: "What the proof ultimately establishes is that KP, combined with the obvious fact that we aren't omniscient, is inconsistent, so holding onto KP forces the absurd conclusion that every truth is already known by someone. The reason this happens is that p itself — not some derivative or exotic proposition, but the very unknown truth we started with — turns out to be unknowable given KP: since assuming p is both true and unknown leads straight to contradiction, p can never, even in principle, be known once KP is on the table."

  But note: the proposition that the argument shows to be unknowable is the conjunction (p ∧ ¬Kp), not p itself. The student first says "p itself" is unknowable, but that is not exactly correct. The unknowable proposition is the conjunction (p ∧ ¬Kp). However, the student also says "the very unknown truth we started with" — but the unknown truth we started with is p (with the property that it is true and not known). But the proposition we apply KP to is the conjunction.

  The key point: the argument shows that if p is true and unknown, then the conjunction (p ∧ ¬Kp) is true but unknowable. However, note that the unknowability of the conjunction does not directly imply that p is unknowable. In fact, p might be knowable, but the conjunction (p ∧ ¬Kp) is not because if you were to know p, then ¬Kp would be false, so the conjunction would be false. Therefore, the conjunction (p ∧ ¬Kp) is only true when p is true and unknown, and in that situation it cannot be known. But p itself might be knowable.

  The student says: "p itself ... turns out to be unknowable given KP". This is incorrect. The argument does not show that p is unknowable. It shows that the conjunction (p ∧ ¬Kp) is unknowable. The student is conflating p and the conjunction.

  However, the student also says: "the very unknown truth we started with" — and the unknown truth is p, but then they say "p can never ... be known". But that's not what the argument shows. The argument shows that if p is true and unknown, then the conjunction is unknowable. It does not show that p is unknowable. In fact, if p is true and unknown, then p might become known in the future. But if it does, then the conjunction (p ∧ ¬Kp) becomes false (because ¬Kp becomes false). So the conjunction is only true in the state of ignorance and is unknowable in that state.

  Therefore, the student's identification of p as the unknowable proposition is incorrect. The unknowable proposition is (p ∧ ¬Kp).

  But then the student says: "That's exactly why the argument is so damaging for verificationists ... who want to equate truth with idealized verifiability". The problem for the verificationist is that KP is a consequence of their view (if truth is verifiability, then every truth is knowable). But then the argument shows that if there is any unknown truth (which there must be, unless we are omniscient), then there is a truth (namely, the conjunction) that is unknowable. This contradicts KP. So the verificationist must deny NonO, i.e., claim that every truth is known, which is absurd.

  The student's explanation of why it's damaging is correct: because KP is a commitment of anti-realism, and the paradox shows that KP implies that we are omniscient, which is absurd.

  But the misidentification of the unknowable proposition is a significant error. The rubric asks for "correctly identifying exactly which proposition the argument shows to be unknowable". The student says it is p (the unknown truth) when it is actually (p ∧ ¬Kp). Therefore, we must deduct points.

