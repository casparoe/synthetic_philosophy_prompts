  I've been slowly working through the "Logical Induction" paper (Garrabrant et al, out of MIRI) with an online reading group, and while a lot of the actual math is over my head, i think ive got the basic picture: you set up a kind of market where a growing pool of "trader" algorithms bet on the truth values of logical and mathematical sentences, and a sequence of probability assignments counts as a good "logical inductor" as long as no trader can guarantee itself unbounded profit off it as time goes on. What makes this more than just abstract math-nerd trivia for me is that I'm a math grad student, and I constantly get these strong gut feelings about whether some unproven conjecture or lemma I'm staring at (something in the spirit of the Collatz conjecture, say) is probably true, way before anything like a proof exists. Someone in the reading group insisted this is basically the exact phenomenon logical induction is supposed to formalize.

  Could you walk me through the most important implications of the logical induction framework for how much I should actually trust (or try to calibrate) these kinds of pre-proof mathematical hunches? Specifically: does the existence of a "logical inductor" with all its nice convergence and non-exploitability guarantees tell me anything real about whether any particular gut feeling of mine is trustworthy, or is it more of an abstract existence-proof type result that doesn't straightforwardly cash out into advice for an actual human (or even a real computer) trying to size up one specific open conjecture today? And is the self-referential stuff -- inductors apparently being able to say something about their own future beliefs -- actually relevant to old worries like the Lobian obstacle to self-trust, or is that a separate issue that just sounds similar?
