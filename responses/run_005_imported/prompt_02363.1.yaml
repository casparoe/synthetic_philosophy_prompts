  We are ranking six responses to Hempel's raven paradox. The goal is to evaluate how well each dissolves the paradox (resolves the core puzzle) as opposed to merely re-describing it or biting a bullet without justification.

   The paradox: 
     - Hypothesis: "All ravens are black" (∀x: Raven(x) → Black(x))
     - Logically equivalent: "All non-black things are non-ravens" (∀x: ~Black(x) → ~Raven(x))
     - Observing a black raven seems to confirm the hypothesis (by Nicod's criterion).
     - Observing a white shoe (a non-black non-raven) should also confirm the hypothesis by the equivalence condition, but intuitively it does not.

   Responses:

   1. Hempel's own response: Accept both Nicod's Criterion and the Equivalence Condition, and accept the paradoxical conclusion. He explains the intuition against it as due to background knowledge (e.g., there are many non-black things and few ravens, so a non-black non-raven doesn't add much).

   2. Standard Bayesian: Non-black non-ravens do confirm, but the degree is extremely small because the class of non-black things is huge. The white shoe confirms, but negligibly.

   3. Good's counterexample: He constructs a scenario (with specific background knowledge) where observing a black raven actually disconfirms the hypothesis. This challenges the Bayesian story because it shows that under some background knowledge, even the direction of confirmation can reverse.

   4. Maher's neo-Carnapian rebuttal to Good: Maher argues that Good's example relies on an unnatural prior and that under a Carnapian approach (with symmetric priors over individuals) the standard Bayesian solution holds.

   5. Scheffler and Goodman: They reject the Equivalence Condition for confirmation. They propose "selective confirmation": an instance confirms a hypothesis only if it does so in a way that is not also an instance of a contrary hypothesis. The white shoe does not selectively confirm "all ravens are black" because it is also an instance of "all non-black things are non-ravens", which they see as a different hypothesis (even though logically equivalent, they are about different classes).

   6. Popperian dissolution: Deny that confirmation (in the sense of inductive support) exists. Theories are only corroborated by surviving severe tests. Observing a white shoe is not a severe test for the raven hypothesis, so it doesn't corroborate. But then, even a black raven doesn't "confirm" in the inductive sense.

