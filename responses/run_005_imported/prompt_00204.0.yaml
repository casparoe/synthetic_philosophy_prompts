  The equivalence between iterated elimination of strictly dominated strategies (IESDS) with mixed strategies and rationalizability holds in two-player games but breaks down in games with three or more players due to differing assumptions about players' beliefs. Below, I clarify the concepts, explain the source of equivalence in two-player games, describe why they diverge in larger games, and provide a concrete three-player example demonstrating the divergence.

  ### Key Concepts
  1. **IESDS with Mixed Strategies**:
     - A strategy (pure or mixed) for a player is **strictly dominated** if there exists another strategy (pure or mixed) that yields a strictly higher payoff against *every possible combination of pure strategies* by the other players (given their current strategy sets).
     - Elimination proceeds iteratively: in each round, strictly dominated strategies are removed, and the process repeats until no more strategies can be eliminated.
     - **Why mixed strategies matter**: Allowing domination by mixed strategies expands the set of dominated strategies that can be eliminated. For example, a pure strategy may not be dominated by any other pure strategy but could be dominated by a mixture. This makes IESDS more powerful than the pure-strategy version.

  2. **Rationalizability (Bernheim-Pearce)**:
     - A strategy is **rationalizable** if it is a **best response** to some belief about opponents' strategies, where beliefs are **independent probability distributions** over each opponent's strategy set. Players assume opponents' choices are uncorrelated.
     - Rationalizability iteratively removes strategies that are never best responses to independent beliefs.

  ### Why Mixed Strategies Enhance IESDS
  - **Power of mixed dominators**: Mixed strategies convexify the set of payoffs, making it easier to dominate other strategies. For example:
    - Consider a two-player game where pure strategy \(s_i\) is not dominated by any pure \(s_i'\), but a mixture of \(s_i'\) and \(s_i''\) yields higher payoffs against all opponent actions. IESDS with mixed strategies will eliminate \(s_i\), while pure IESDS may not.
  - This aligns IESDS with rationalizability in two-player games because:
    - A strategy is not strictly dominated (by mixed strategies) if and only if it is a best response to *some* belief (correlated or not).
    - In two-player games, correlated beliefs reduce to independent beliefs (since there's only one opponent), making the sets identical.

