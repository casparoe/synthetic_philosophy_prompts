  1. **Iterated Elimination of Strictly Dominated Strategies (IESDS)**:
     - A strategy (pure or mixed) for a player is strictly dominated if there exists another strategy (pure or mixed) that yields a strictly higher payoff no matter what strategies the other players choose.
     - The elimination process proceeds in rounds: at each round, we remove all strictly dominated strategies (using the current set of strategies for the opponents). We continue until no more strategies can be eliminated.
