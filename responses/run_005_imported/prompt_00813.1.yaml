  me and a friend got into it for like an hour last night over that bit in Huckleberry Finn where Huck decides to help Jim escape even though he genuinely believes it's a sin and he's damning himself by doing it. she thinks thats about the purest example of a morally good act you could ask for, precisely becuase he does it against his own conscience, for nothing in return. I said the opposite - on a Kantian view that actually undercuts the act's moral worth, since he's not acting from any correct grasp of what's right, he just happens to have good instincts that override his (wrong) principles. neither of us budged. could you write a dialogue between two philosophers hashing this out properly - one defending that Kantian-ish line, the other more of an Arpaly-style view where what matters is being responsive to the actual right-making features of the situation (Jim's suffering, their friendship, etc), regardless of what Huck consciously believes about right and wrong. want a real back-and-forth where they engage with each other's best points, not just two people repeating their opening statement.
