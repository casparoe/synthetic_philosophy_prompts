prompt: |-
  So in my social choice theory seminar this week we raced through Sen's taxonomy of "informational bases" for interpersonal utility comparisons (ordinal non-comparable, cardinal non-comparable, ordinal level comparability, cardinal unit comparability, cardinal full comparability...) and honestly I just nodded along without really getting the punchline. Could you give me the gut-level intuition for why cardinal unit comparability (gains/losses comparable across people, but not absolute levels) is what pins down utilitiarianism, while ordinal level comparability (levels comparable, gains/losses aren't) is what pins down rawlsian maximin instead? I've seen the d'aspremont-gevers-ish proofs but I don't want the formal axiomatics again, i want to actually get why THOSE specific informational assumptions map onto THOSE specific aggregation rules and not, like, the reverse pairing.
reasoning: |-
  Okay, the user is struggling with understanding why specific informational assumptions in social choice theory lead to particular aggregation rules like utilitarianism or Rawlsian maximin. They mentioned Sen's taxonomy and proofs like d'Aspremont-Gevers but want an intuitive explanation without formalities.

  First, I need to recall the key informational bases: cardinal unit comparability (CUC) and ordinal level comparability (OLC). The user is confused about why CUC leads to utilitarianism and OLC to maximin. They want a gut-level intuition, not proofs.

  Breaking it down, utilitarianism adds up utilities. For that, you need to compare the size of gains and losses across people. That's what CUC allows—comparing units but not absolute levels. For example, if Alice gains 5 utils and Bob loses 3, you can say the net gain is 2. But absolute levels don't matter, just the changes.

  Maximin focuses on the worst-off person. Here, comparing absolute levels is crucial. OLC lets you say who is better off in absolute terms, but not by how much. So, you can identify the poorest person but not measure how much poorer they are. Thus, you prioritize improving their position without needing to quantify the utility difference.

  The user might be mixing up why these pairings aren't reversed. If you used OLC for utilitarianism, you couldn't add utilities because you don't know the magnitudes of changes. Similarly, CUC doesn't tell you who's worst off in absolute terms, only changes, so it can't apply maximin effectively.

  I should use analogies. For utilitarianism, think of a scale where you add weights (utility changes), needing consistent units. For maximin, it's like identifying who's drowning first—you need to know who's underwater, not how much water they're taking in.

  Also, the user might need reassurance that their confusion is common, especially after a rushed seminar. Emphasizing the core intuition without jargon will help. Highlighting the key differences in what each assumption allows and how it maps to the decision rule's requirements is essential.
answer: |-
  Okay, let's ditch the proofs and go for pure intuition. The key is understanding **what each informational assumption *forces* you to care about** and **what it *hides* from you**. Think of the informational basis as putting on a specific pair of glasses that only lets you see certain aspects of people's utilities.

  **The Core Idea:**

  *   **Utilitarianism:** Only cares about the *sum total* of utility. To add things up meaningfully, you absolutely need to know the *size of gains and losses* relative to each other across people ("Is Alice's $10 gain bigger or smaller than Bob's $5 loss?"). But it doesn't care *at all* about where people start ("Is Alice already much happier than Bob?").
  *   **Rawlsian Maximin:** Only cares about the *absolute level* of the *worst-off* person. To identify who is worst off and make them better off, you absolutely need to compare *absolute levels* ("Is Alice poorer/miserable-er than Bob?"). But it doesn't care *at all* about the *size* of gains for anyone *except* the worst-off ("Did Alice gain a huge amount? Doesn't matter, Bob is still worse off and only gained a little.").

  Now, let's put on the glasses:

  1.  **Cardinal Unit Comparability (CUC) Glasses:**
      *   **What you SEE:** You see *how much* utility changes for each person (cardinal gains/losses), and you can *compare the sizes of these changes* across people. You know if Alice gains more utils than Bob loses. **Units are comparable.**
      *   **What you are BLIND to:** You *cannot* see or compare the *absolute starting points* of anyone's utility. You have no idea if Alice was already ecstatic or miserable before her gain, or Bob before his loss. **Levels are non-comparable.**
      *   **Why this forces Utilitarianism:** This is *exactly* the information a utilitarian needs! You can add up the gains and losses (because you know their comparable sizes) to see if the total goes up or down. That's *all* utilitarianism requires. Trying to care about absolute levels is impossible – you literally can't see them! Maximin is impossible because you can't tell who is *actually* worst off in absolute terms; you only see *changes*. You might know Bob lost a little, but you don't know if he's still super happy or now destitute.

      **Gut Feeling Analogy:** Imagine you're a cosmic accountant. You only get reports showing *changes* in happiness points (CUC). Alice: +10 pts, Bob: -5 pts, Charlie: +3 pts. Your job is to see if the *total happiness ledger* increased. You add: +10 -5 +3 = +8. "Good! Total happiness increased!" You have *no idea* if Alice started with 1000 points or 5 points, or Bob with 200 or 1. You just know the *net effect* of the changes. That's utilitarianism.

  2.  **Ordinal Level Comparability (OLC) Glasses:**
      *   **What you SEE:** You can *rank* everyone's *absolute utility level*. You know Alice is happier than Bob, who is happier than Charlie. **Levels are comparable.**
      *   **What you are BLIND to:** You *cannot* see *how much* happier Alice is than Bob (no cardinality). You *especially* cannot see or compare the *size of gains or losses* for anyone ("Did Alice's happiness jump a lot or a little?" is invisible and incomparable to "Did Bob's happiness dip a lot or a little?"). **Units (gains/losses) are non-comparable.**
      *   **Why this forces Maximin:** This is *exactly* the information a Rawlsian needs! You can instantly see who is at the *absolute bottom* (Charlie). Your *only* goal is to make *that person* better off. You don't need to know *how much* better off they get, just that they move up *relative to others* (which you *can* see with OLC). Trying to do utilitarianism is impossible – you can't add up gains and losses because you can't measure their sizes or compare them across people! You might know Alice gained *something* and Bob lost *something*, but you have no clue if the gain was bigger than the loss. You can't calculate a sum.

      **Gut Feeling Analogy:** Imagine you're a lifeguard looking at swimmers. Your glasses (OLC) only show you the *depth* each swimmer is at relative to the surface. You instantly see Charlie is deepest underwater (worst off). Your *only* job is to get *Charlie* closer to the surface. You don't care *how fast* Alice swims upwards (+10 utils?), or *how slowly* Bob sinks (-5 utils?) – you only care that Charlie is the deepest and needs help *now*. If a policy pulls Charlie up *even a tiny bit* relative to others (and doesn't make anyone else the *new* deepest), you did your job (Maximin). Calculating the "total swimming speed" is impossible and irrelevant.

  **Why Not the Reverse Pairing?**

  *   **CUC Glasses + Maximin?** Impossible! Maximin needs to know who is *absolutely* worst off. CUC glasses hide absolute levels. You might know Bob lost utility, but you don't know if he's now miserable or still the happiest. You can't identify the worst-off person.
  *   **OLC Glasses + Utilitarianism?** Impossible! Utilitarianism needs to add up gains/losses. OLC glasses hide the *size* of gains and losses. You know Alice gained *something* and Bob lost *something*, but you have no idea if the total change is positive or negative. You can't sum what you can't measure comparably.

  **The Punchline (Gut Level):**

  *   **CUC = "Change Counter" Glasses:** You only see *changes* and can compare their *sizes*. This naturally leads to counting/totaling changes (Utilitarianism). Levels are invisible.
  *   **OLC = "Who's Worst Off?" Glasses:** You only see *relative positions* on the ladder. This naturally leads to focusing laser-like on the person on the bottom rung (Maximin). The size of steps up or down the ladder is invisible.

  The informational assumptions aren't arbitrary labels slapped onto the theories; they are *precisely* the minimum information required to *operationalize* the core ethical principle of each theory and *nothing more*. CUC gives you exactly what utilitarianism eats for breakfast (comparable utility *deltas*) and hides what it ignores (absolute levels). OLC gives you exactly what maximin desperately needs (a reliable ranking of *absolute positions*) and hides what it considers irrelevant (the precise size of gains for the better-off). That's why the mapping is fundamental, not accidental.
