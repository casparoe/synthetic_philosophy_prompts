  ## Memorandum: On the Frege Prize and Commemorative Naming  
  **To:** Society for the Philosophy of Language Advisory Board  
  **From:** [Your Name], Advisory Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the Frege Early-Career Prize  

  The discovery of Frege’s 1924 diary entries presents our society with a profound ethical and commemorative challenge. These writings—expressing virulent antisemitism, contempt for democracy, and alignment with extremist politics—stand in stark, irreconcilable conflict with the values of intellectual inclusivity and rigor our society upholds. After careful consideration of the arguments from both sides, I recommend **retiring Frege’s name from the prize effective immediately, while establishing a contextual statement about his legacy and adopting a forward-looking naming policy**.  

  ### Engagement with Key Arguments  

  **The Case for Retaining the Name (Logician’s View):**  
  Proponents rightly argue that Frege’s contributions to formal logic—the *Begriffsschrift*, the sense/reference distinction, his anti-psychologism—are uniquely *detachable* from his person. His formalism created tools that operate independently of their creator’s flaws, unlike the work of a political theorist whose ideas may be intrinsically tied to harmful ideologies. Renaming the prize risks implying that his logical work is tainted, which it is not. The cogency of modus ponens is unaffected by Frege’s private bigotry. This view emphasizes that our prize celebrates *contributions to logic and philosophy of language*, not moral exemplars.  

  **The Case for Renaming (Historian’s View):**  
  Opponents compellingly note that prizes are acts of *commemoration*, not just intellectual recognition. To name an award after someone is to honor the *person* as a symbol—a role Frege can no longer credibly fulfill. While his logic stands apart, our choice to venerate him does not. We do not extend this separation to figures like Heidegger or De Man without controversy; their names carry inescapable baggage. Further, while the link between Frege’s logical absolutism and political absolutism may be interpretive, it is not irrelevant: it invites critical reflection on whether the desire for context-independent truth can coexist with ethical disengagement.  

  ### Recommendation: A Third Way  
  Retaining the name without comment ignores the harm of celebrating a documented antisemite. Removing it entirely risks erasing history and misrepresenting the logician’s view that the work transcends the worker. Instead, I propose:  

  1.  **Retire "Frege" from the prize name immediately.** The 2024 award cycle should commence under a new name.  
  2.  **Establish a permanent contextual statement.** Published alongside all future prize announcements and on our website, this will:  
      *   Acknowledge Frege’s foundational role in modern logic.  
      *   Cite the existence and nature of his diary as irreconcilable with our society’s values.  
      *   State that the prize was renamed to reflect our commitment to inclusivity while recognizing his intellectual legacy.  
  3.  **Rename the prize to honor a concept, not a person.** Propose "The Sense/Reference Prize" or "The Conceptual Notation Prize." This celebrates the *idea*, avoiding future biographical pitfalls.  

  **Timeline:**  
  - **November 2023:** Board votes on this recommendation.  
  - **December 2023:** If approved, announce the change and draft the contextual statement for membership feedback.  
  - **January 2024:** Finalize new prize name and adopt the contextual statement.  
  - **February 2024:** 2024 Prize call issued under new name.  

  ### A General Principle for Future Commemorations  
  When controversies arise around namesakes, our society should ask: **"Does commemorating this person *today* align with our core values of inclusivity, intellectual integrity, and the ethical responsibilities of our discipline?"** We must judge not by historical relativism, but by contemporary professional standards. If the namesake’s actions or beliefs fundamentally violate these values—particularly where evidence is unambiguous and the harm directly impacts our scholarly community—the name should be retired. Honoring ideas or diverse contributions, rather than individuals, offers a more resilient path.  

  Frege revolutionized logic. He also embodied hatreds that poison scholarly community. We can acknowledge the first without enshrining the second. Retiring his name is not censorship; it is ethical stewardship. Let our prize reflect not just brilliance, but the society we aspire to be.  

  **Vote Recommended:** Approve renaming with contextual acknowledgment.  

  ---  
  **Approved by:** [Your Name]  
  **For Discussion:** November Advisory Board Meeting
