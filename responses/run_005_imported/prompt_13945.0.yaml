prompt: |-
  Back when I was still working in statistical mechanics, I used to burn through my lunch breaks reading Douglas Hofstadter's old "Metamagical Themas" columns, and his idea of "superrationality" -- that two identically-reasoning agents playing a one-shot Prisoner's Dilemma should both cooperate, because whatever argument convinces one of them to defect or cooperate is, by the symmetry of the situation, exactly as convincing to the other one -- always struck me as one of the slicker pieces of reasoning I'd run into outside of actual physics. Now that I'm retired and getting properly into philosophy (slowly, and probably not always correctly), I keep running into a newer-sounding idea out of the effective altruism/longtermist world called "evidential cooperation in large worlds," which from what I can tell takes basically the same superrationality move and blows it up to the scale of the whole universe, or multiverse if its infinite: the thought being that in a big enough world there are bound to be huge numbers of agents totally cut off from us causally, who nonetheless reason in ways correlated with ours, even if they're not exact copies of us and dont share our values.

  I mentioned this to an old colleague of mine over coffee and we ended up arguing about whether there's anything genuinely new here, or whether it's just superrationality wearing a bigger coat. So I'd like you to properly compare evidential cooperation in large worlds with Hofstadter-style superrationality. Where does the large-worlds version really need correlation-without-identity and evidential decision theory to carry weight that plain superrationality never had to carry, and where is it secretly still riding on that same old assumption of near-perfect symmetry between agents? And while you're at it, I'd like your honest take on how serious a problem it is for the large-worlds argument that nobody can actually specify who counts as "correlated enough with me" to be part of the deal, given that Hofstadter got to just stipulate perfect symmetry in his toy examples and the large-worlds crowd doesn't get that luxury.
reasoning: |-
  Okay, the user is asking me to compare Hofstadter's superrationality with the newer concept of evidential cooperation in large worlds (ECL). They want to know if ECL is genuinely new or just superrationality scaled up. They're also concerned about how ECL defines "correlated enough" agents without the luxury of perfect symmetry.

  First, I need to recall both concepts clearly. Superrationality, from Hofstadter, involves identical agents in symmetric games like Prisoner's Dilemma. Since they reason identically, whatever one decides, the other does too. So defecting doesn't make sense because it would lead to mutual defection. Cooperating leads to mutual cooperation, which is better. The key here is perfect symmetry and identical reasoning.

  Now, ECL comes from effective altruism and longtermism. It extends this idea to large worlds, possibly infinite universes or multiverses. The idea is that even without causal contact, agents who reason similarly might be correlated. If I cooperate, it might increase the probability that other correlated agents also cooperate, leading to better overall outcomes. This uses evidential decision theory (EDT), where decisions are based on evidence they provide about other similar decisions.

  The user mentioned their background in statistical mechanics and philosophy. They're retired now, diving into philosophy. Their old colleague argued whether ECL is new or just superrationality with a bigger coat. The user wants a proper comparison, focusing on where ECL needs correlation without identity and EDT, and where it still relies on symmetry. Also, the problem of defining "correlated enough" agents.

  Breaking down the comparison:

  1. **Symmetry Assumptions**: Superrationality requires near-perfect symmetry. Agents are identical copies. ECL relaxes this. Agents don't have to be identical; they just need correlated decision-making. This could be through shared reasoning processes or similar algorithms, even if their values differ. So ECL handles diversity in agents, which superrationality doesn't.

  2. **Scale and Causal Isolation**: Superrationality is for small, defined groups (like two prisoners). ECL scales to vast, possibly infinite worlds with causally isolated agents. The argument here is that in a large universe, there are many agents whose decisions correlate with mine evidentially, even if we can't interact causally.

  3. **Decision Theory**: Superrationality doesn't specify a decision theory; it's more about symmetry. ECL explicitly uses EDT. EDT says you should act based on the evidence your action provides about other events. In ECL, cooperating is evidence that other correlated agents cooperate, leading to better outcomes. Causal decision theory (CDT) wouldn't work here because there's no causal link. So EDT is crucial for ECL, whereas superrationality doesn't rely on a specific decision theory.

  4. **Problem of Defining Correlation**: Hofstadter could stipulate perfect symmetry. ECL can't. Who counts as "correlated enough"? This is a big issue. If the threshold is too broad, almost everyone might be included, leading to overgeneralization. If too narrow, it might not apply. This ambiguity is a serious problem for ECL because without clear criteria, it's hard to apply practically. It might lead to "spooky" correlations where any agent reasoning similarly is included, but how similar is similar enough?

  5. **Where ECL Still Relies on Symmetry**: Even though ECL allows for diversity, it still needs some level of symmetry. The correlation has to be strong enough that my decision provides reliable evidence about others'. If agents are too different, the evidential link weakens. So there's an implicit assumption of sufficient similarity in reasoning processes, which is a softer form of symmetry.

  The user also wants my honest take on the problem of defining correlation. It's a significant issue. Without clear parameters, ECL risks being vague or untestable. In superrationality, the symmetry is clear. In ECL, it's fuzzy. This could lead to practical challenges in applying ECL, especially in real-world scenarios where identifying correlated agents isn't straightforward.

  Additionally, the user's background in statistical mechanics might make them appreciate the symmetry arguments, but also critical of vague concepts. They might be looking for a rigorous philosophical comparison, highlighting both the advancements and flaws in ECL.

  So, to sum up: ECL introduces new elements by scaling up, using EDT, and handling correlation without identity. But it still leans on symmetry through the need for strong correlation, and the definition problem is a serious weakness. The user's colleague might be right that it's an extension, but it does address new challenges like causal isolation and diverse agents, which superrationality doesn't.
answer: |-
  What a fantastic question—it cuts right to the heart of how decision theory scales from tidy thought experiments to messy cosmic realities. Your intuition is spot-on: **evidential cooperation in large worlds (ECL)** *is* fundamentally an extension of Hofstadter-style superrationality (SR), but it tackles new problems by relaxing symmetry assumptions and leaning hard on evidential decision theory (EDT). Crucially, it *doesn't* escape symmetry entirely; it just generalizes it. And yes, the "correlated enough" problem is a serious, possibly debilitating, weakness. Let's break this down.

  ### Core Similarities: The Superrationality DNA
  1. **Symmetry as Foundation**: Both start with symmetry. SR assumes identical agents ("if I defect, so will my twin"). ECL assumes agents with *correlated decision algorithms*—even if values/environments differ, their *reasoning processes* are statistically linked.  
  2. **Evidential Leverage**: Both exploit the idea that your action *reveals* something about others' actions. In SR, your choice to cooperate is evidence your twin does too (because identical reasoning). In ECL, your choice to cooperate is evidence that *other agents using similar algorithms* cooperate.  
  3. **One-Shot Cooperation**: Both justify cooperation in non-iterated dilemmas where causal defection dominates.

  ### Key Innovations in ECL: Where It Carries New Weight
  ECL isn't *just* SR in a bigger coat—it addresses gaps SR couldn't handle, using two key upgrades:

  1. **Correlation Without Identity**:  
     - **SR's Limitation**: Requires near-perfect symmetry (e.g., identical copies). If agents aren't twins, SR collapses.  
     - **ECL's Move**: Uses *algorithmic similarity* without identity. Imagine two AI systems trained on similar datasets but deployed in causally isolated galaxies. They aren't identical, but their decisions correlate because they use Bayesian updating, convex optimization, etc. ECL argues your cooperation *probabilistically signals* cooperation from *any* agent whose decision function correlates with yours, even if their goals differ.  
     - **Why This Matters**: SR can't handle large, diverse worlds. ECL scales to universes with trillions of heterogeneous agents (e.g., humans, AIs, aliens) who share abstract reasoning traits but not values. This is where EDT does heavy lifting: your action provides *evidence* about others' actions, even with no causal link.

  2. **Causal Isolation and Large Worlds**:  
     - **SR's Limitation**: Implicitly assumes agents can "coordinate" via symmetry (e.g., Hofstadter's twins know they're twins).  
     - **ECL's Move**: Works even when agents are causally cut off *and unaware of each other*. In an infinite universe, there are infinitely many "copies" of your decision process (not literal clones, but agents whose choices correlate with yours). Cooperating increases the *evidential probability* that correlated agents cooperate, improving aggregate outcomes.  
     - **Why This Matters**: This addresses real longtermist concerns—e.g., "If I develop safe AI, does that make it more likely *other* safe-AI developers succeed in distant galaxies?" SR can't touch this.

  ### Where ECL Still Rides on Symmetry (and Why That's a Problem)
  Despite its ambitions, ECL *depends* on a generalized symmetry assumption:
  - **Correlation as Soft Symmetry**: ECL requires that your decision algorithm is *strongly correlated* with others' algorithms. But "correlation" here is just symmetry in the *structure of reasoning* (e.g., "all agents using gradient descent in moral calculus"). If correlations are weak, ECL's evidential leverage vanishes.  
  - **The Indispensability of EDT**: SR *can* be justified without explicitly invoking EDT (e.g., via Nash equilibrium selection). ECL *cannot*—it needs EDT to interpret your action as evidence about others. But EDT is controversial precisely because it ignores causality. If you're a causal decision theorist (CDT), ECL collapses: your cooperation *doesn't cause* others to cooperate, so defection dominates.  

  ### The "Correlated Enough" Problem: ECL's Achilles' Heel
  This is where your critique hits hardest. Hofstadter handwaved this by stipulating perfect symmetry. ECL, operating in the real world, can't:
  1. **Vagueness Threshold**: There's no rigorous way to define who is "in" your correlated reference class. Are all humans included? All sentient beings? All Bayesian reasoners? As you broaden the class, correlations dilute. Too narrow, and the argument loses scale.  
  2. **Paradoxical Consequences**: If your reference class includes agents with *opposing* goals (e.g., an AI optimizing for paperclips vs. humans), cooperating could *increase* the probability they pursue *their* goals aggressively. ECL only "works" if correlated agents face similar dilemmas—but how do you guarantee that?  
  3. **Practical Impossibility**: For humans, determining algorithmic correlation is intractable. Are effective altruists correlated with all utilitarians? With AIs trained on human ethics? The argument risks becoming a "just-so story."  

  ### My Honest Take: Brilliant but Fragile
  ECL is a dazzling extension of superrationality that *does* add value: it grapples with causal isolation, diversity, and scale in ways SR never could. It's philosophically significant for longtermists precisely because it suggests cooperation can be rational even when causal payoffs favor defection. **But its reliance on ill-defined correlation and EDT makes it dangerously fragile.**  

  - **For Theory**: It's a fascinating thought experiment that highlights how decision theory breaks at cosmic scales. But without a formal way to bound reference classes or quantify correlation, it's more a provocative metaphor than a practical tool.  
  - **For Practice**: In real-world longtermism (e.g., AI safety), acting *as if* ECL holds might be prudent—but this is a pragmatic hedge, not rigorous application. If you can't specify who's correlated, the argument can't reliably guide action.  

  **In essence**: ECL is superrationality's ambitious cousin who moved to the multiverse. It solves SR's scale problems but inherits its symmetry dependence—now disguised as "correlation"—and adds new vulnerabilities. Whether that's "genuinely new" depends on whether you prize conceptual scalability over operational robustness. But as a fellow admirer of Hofstadter's slick reasoning, I suspect he'd appreciate the audacity, even as he'd probe its soft spots.
