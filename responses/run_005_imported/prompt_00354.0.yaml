prompt: |-
  I'm currently reporting a longform piece on how longtermist and effective-altruist-adjacent researchers think about cooperation that stretches beyond the usual boundaries of bargaining and trade. In interviewing decision theorists at a couple of x-risk research institutes, I kept running into two ideas that initially struck me as nearly identical but that my sources insisted are conceptually distinct: "evidential cooperation in large worlds" (ECL), and what's sometimes called "moral trade" -- the notion that people with different values can each do better by their own lights by dividing moral labor, even without any causal mechanism enforcing the deal. Both seem to rest on the same basic intuition that you can benefit from cooperating with agents you will never meet, but when I pressed further, one researcher told me that ECL only works because of specific assumptions about a large or infinite universe and correlated decision-making, while ordinary moral trade doesn't need any of that machinery.

  For the article, I'd like to get this distinction right rather than gloss over it for the sake of a tidy paragraph. Could you walk me through how evidential cooperation in large worlds differs from moral trade as a mechanism for cross-value cooperation? I'm especially interested in three things: first, whether the cooperation in each case is causal or acausal, and what work the size or structure of the universe is doing in ECL that it isn't doing in ordinary moral trade; second, what kind of epistemic or decision-theoretic commitments -- something like superrationality, or beliefs about the existence of correlated agents elsewhere in the universe -- ECL requires that moral trade simply doesn't; and third, whether moral trade could be understood as a special, causally-mediated case of the more general phenomenon ECL is pointing at, or whether the two are doing genuinely different conceptual work that shouldn't be collapsed into one another. A worked example of each, set side by side, would be especially useful for illustrating the difference to readers who aren't steeped in decision theory.
reasoning: |-
  We are discussing two concepts: Evidential Cooperation in Large Worlds (ECL) and Moral Trade. Both are mechanisms for cooperation, but they differ in their foundations and requirements. Let's break down the differences step by step, addressing your three main points.

  ### 1. Causal vs. Acausal Cooperation and the Role of Universe Size/Structure

  **Moral Trade**:
  - **Causal or Acausal?**: Moral trade is typically thought of as a **causal** mechanism. It involves agents with different values trading in a way that causally benefits each other by their own lights. For example, if Alice values apples and Bob values oranges, they can trade: Alice gives Bob some oranges in exchange for apples, and both end up better off according to their own values.
  - **Role of Universe Size**: Moral trade does not require a large or infinite universe. It can occur in a small, finite world as long as there are agents with different values and a way to exchange goods or actions. The key is that the trade must be mutually beneficial by each agent's own value system and that the agents can causally interact (e.g., through communication and exchange).

  **ECL (Evidential Cooperation in Large Worlds)**:
  - **Causal or Acausal?**: ECL is an **acausal** mechanism. It relies on the idea that your decision can provide evidence about what other similar agents (who are making similar decisions) are doing, even if there is no causal interaction between you. This evidence then affects the expected outcome because if you cooperate, you have reason to believe that others are cooperating too, leading to a better outcome for everyone.
  - **Role of Universe Size**: ECL requires a large or infinite universe because it depends on the existence of many agents who are making similar decisions in similar situations (and thus are "correlated" with you). In a large enough universe, it becomes likely that there are many such agents. The structure of the universe (e.g., having many copies or similar decision-makers) is crucial because it allows for the evidential link: your decision is evidence about the decisions of others.

  ### 2. Epistemic and Decision-Theoretic Commitments

  **Moral Trade**:
  - **Commitments**: Moral trade does not require any special decision theory beyond standard rational choice. Agents must have different values, be able to communicate, and have a way to enforce the trade (though enforcement can be through repeated interactions, reputation, or institutions). The agents are causal decision theorists: they choose actions that causally bring about the best outcome by their own lights.

  **ECL**:
  - **Commitments**: ECL requires a specific decision theory that takes into account evidential reasoning, such as **updateless decision theory** or **functional decision theory**. The core idea is that an agent should consider the expected utility of a policy (a function from observations to actions) rather than just the causal consequences of a single action. This leads to cooperation because choosing a cooperative policy provides evidence that other agents (who are similar and thus likely to follow the same policy) are also cooperating.
  - **Beliefs**: ECL requires the agent to believe that there are many other agents in the universe facing similar decisions and that these agents are sufficiently correlated (i.e., they are likely to use the same decision procedure). This correlation is what allows one's own decision to be evidence about others' decisions.

  ### 3. Is Moral Trade a Special Case of ECL?

  It is tempting to see moral trade as a causally-mediated special case of ECL, but they are doing genuinely different conceptual work.

  - **Moral Trade** is about exploiting differences in values to achieve mutual gains through exchange. It does not require the agents to be similar or to have correlated decision-making. It works even if the agents are entirely dissimilar and in a small world.
  - **ECL** is about achieving cooperation among agents who are similar (and know they are similar) and who face similar problems. The cooperation is achieved by updating on the evidence provided by one's own decision about what others are likely doing. It does not require differences in values; in fact, ECL is often discussed in symmetric situations (like prisoner's dilemmas) where agents have the same values.

  Therefore, while both can lead to cooperation, the mechanisms are distinct. Moral trade relies on value differences and causal interaction, while ECL relies on similarity, evidential reasoning, and a large universe to create the necessary correlations.

  ### Worked Examples

  **Example of Moral Trade**:
  - **Setting**: Two neighboring tribes: the "Grain Growers" who value grain above all and the "Herders" who value livestock. They have no common currency and initially no trade.
  - **Mechanism**: The Grain Growers have a surplus of grain but lack meat, while the Herders have a surplus of meat but lack grain. They agree to trade: the Grain Growers give some grain to the Herders in exchange for meat. 
  - **Outcome**: By their own values, each tribe is better off because they have more of what they value. The trade is causal and requires a physical exchange.

  **Example of ECL**:
  - **Setting**: In a large (possibly infinite) universe, there are many civilizations facing the same decision: whether to contribute resources to a project that prevents an asteroid from destroying a planet. Each civilization is isolated and cannot causally influence the others. However, each civilization knows that there are many others in similar situations and that they all use the same decision procedure (e.g., they all follow a cooperative policy if and only if they believe that a sufficient number of others will cooperate).
  - **Mechanism**: A civilization reasons: "If I decide to contribute, that provides evidence that other civilizations (who are like me) are also contributing. Therefore, my contribution increases the chance that the project succeeds and my planet is saved. If I don't contribute, that suggests others won't either, and the project fails." 
  - **Outcome**: Each civilization contributes, and the asteroid is deflected, saving all planets. Note: there is no causal link between the decisions; the cooperation is acausal and based on the evidence that one's own decision provides about others.

  ### Summary for Your Article

  - **Moral Trade**: Causal cooperation based on differences in values. Works in small worlds. Requires causal interaction and enforcement mechanisms (which can be institutional, repeated, etc.). Uses standard decision theory.
  - **ECL**: Acausal cooperation based on similarity and correlated decision-making. Requires a large universe to have many similar agents and a decision theory that uses evidential reasoning (like updateless decision theory). Cooperation occurs because one's own action is evidence about others' actions.

  They are distinct: moral trade exploits value differences, while ECL exploits similarity and evidential links. They are not two versions of the same thing but two different mechanisms for cooperation that can operate in different contexts.
answer: |-
  ### Distinguishing Evidential Cooperation in Large Worlds (ECL) from Moral Trade  
  Both concepts enable cooperation across value systems, but they rely on fundamentally different mechanisms. Below, I'll clarify the distinction using your three focal points, then provide contrasting examples. For clarity:  
  - **Moral trade** involves agents with *different values* cooperating via causal exchanges (e.g., trades enforced by institutions, repeated interactions, or contracts).  
  - **ECL** involves agents with *similar decision-making* cooperating *acausally* by treating their own choices as evidence about correlated agents in large/infinite worlds.  

  ---

  ### 1. **Causal vs. Acausal Cooperation & Role of Universe Size**  
  - **Moral Trade is Causal**:  
    - Cooperation relies on **direct causal pathways** (e.g., exchanging resources, enforcing agreements).  
    - Example: Two nations trade vaccines for food; each benefits causally by receiving goods.  
    - **Universe size/structure is irrelevant**: Moral trade works in small, finite worlds. All that’s needed is a mechanism to enforce the trade (e.g., laws, trust, or future interactions).  

  - **ECL is Acausal**:  
    - Cooperation is **evidential and correlation-based**—your choice to cooperate provides *evidence* that similar agents elsewhere are cooperating, improving outcomes *without* direct interaction.  
    - **Universe size/structure is critical**: ECL requires a large (or infinite) universe to ensure:  
      - Many "copies" or correlated agents exist who face identical decisions.  
      - Your decision is statistically linked to theirs (e.g., via shared decision algorithms).  
    - Without a large world, the evidential link breaks—your choice doesn’t generalize.  

  ---

  ### 2. **Epistemic and Decision-Theoretic Commitments**  
  - **Moral Trade Requires Only Standard Rationality**:  
    - Agents need **common knowledge of differences in values** and **enforceable contracts**.  
    - Decision theory: **Causal decision theory (CDT)** suffices. Agents choose actions that *cause* the best outcome by their own values.  
    - Example: A vegan trades plant-based tech to a meat-eater for lab-grown meat. Both gain by their values, enforced via a contract.  

  - **ECL Demands Specialized Reasoning**:  
    - **Commitments**:  
      - **Updatelessness**: Agents must evaluate policies (e.g., "always cooperate") *before* knowing their specific situation, to avoid "updating away" correlations.  
      - **Superrationality-like reasoning**: Agents act as if their decision algorithm is shared by correlated others, making their choice *evidence* of others’ choices.  
      - **Belief in correlated agents**: You must believe the universe contains many agents whose decisions are *statistically tied* to yours (e.g., via identical source code).  
    - Decision theory: Requires **updateless decision theory (UDT)** or **functional decision theory (FDT)**, where agents choose outputs of a *function* applied across all similar instances.  
    - Without these, ECL fails—agents might "defect" locally, unaware it predicts widespread defection.  

  ---

  ### 3. **Is Moral Trade a Special Case of ECL?**  
  **No—they are conceptually distinct and address different problems**:  
  - **Moral trade** solves *value conflicts*: Agents with **heterogeneous goals** cooperate by exploiting comparative advantages (e.g., "I’ll help with your cause if you help with mine").  
  - **ECL** solves *coordination problems*: Agents with **aligned or symmetric goals** cooperate by overcoming decision-theoretic traps (e.g., prisoner’s dilemmas) in large worlds.  
  - **Why they shouldn’t be collapsed**:  
    - Moral trade works with *causal enforcement* and doesn’t need similarity between agents.  
    - ECL requires *acausal generalization* and fails without correlated decision-makers.  
    - **Analogy**: Moral trade is like bartering between specialists; ECL is like synchronized dancing by clones who’ve never met.  

  ---

  ### Worked Examples: Side-by-Side  

  #### **Moral Trade Example: Cross-Value Exchange**  
  - **Setting**: Two isolated villages:  
    - *Village A* (utilitarian): Values maximizing crop yields.  
    - *Village B* (aesthetic): Values preserving forest beauty.  
  - **Conflict**: A river between them could be dammed for irrigation (helping A) or left wild (helping B).  
  - **Trade**: Village A promises to preserve forests upstream if Village B shares crop-surplus data.  
  - **Mechanism**:  
    - **Causal**: A written pact enforces the exchange. Village A’s data-sharing *causes* Village B’s preservation.  
    - **No universe size needed**: Works even if only these two villages exist.  
    - **Decision theory**: CDT—each acts to causally optimize their values.  

  #### **ECL Example: Asteroid Defense**  
  - **Setting**: In a large universe, 1,000 planets face identical asteroid threats. Each has an AI deciding whether to contribute to a shared defense fund.  
  - **Conflict**: Contributing costs resources, but if ≥800 planets contribute, all asteroids are deflected. Planets can’t communicate.  
  - **Cooperation**: An AI reasons:  
    - *"My algorithm is identical to others. If I contribute, that’s evidence that ≥800 others likely contribute (since they’d reason like me). If I defect, I signal widespread defection."*  
    - It contributes, expecting others to do the same.  
  - **Mechanism**:  
    - **Acausal**: No direct exchange; cooperation is driven by *evidence* from the AI’s own choice.  
    - **Universe size critical**: Only in a large world are there enough correlated agents for the evidential link.  
    - **Decision theory**: UDT/FDT—the AI chooses the policy ("contribute") that works if all similar agents adopt it.  

  ---

  ### Key Takeaway for Your Article  
  ECL and moral trade both enable "cooperation without borders," but they operate in orthogonal ways:  
  - **Moral trade** thrives on **value diversity** and **causal mechanisms**, fitting small-world contexts.  
  - **ECL** exploits **agent similarity** and **evidential links** in large worlds, requiring advanced decision theories.  
  Merging them obscures why ECL matters for existential risk: it addresses cooperation failures in decentralized, acausal settings (e.g., AI alignment or cosmic-scale threats), while moral trade solves tangible bargaining problems. For longtermists, ECL’s acausal nature makes it uniquely suited to scenarios where traditional enforcement is impossible.
