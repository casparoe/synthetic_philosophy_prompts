   Popper's idea was that a theory A has more verisimilitude than a theory B if:
     (1) the truth content of A is a proper superset of the truth content of B, and
     (2) the falsity content of B is a proper superset of the falsity content of A.

   However, Tichy and Miller showed that this definition leads to contradictions. They demonstrated that if two theories are both false, then it is impossible for one to have both more true consequences and fewer false consequences than the other in the way Popper required.

   We will work in a very simple propositional language with three atomic propositions: P, Q, R.

   Let the actual truth (the whole truth) be given by the state of affairs where P is true, Q is true, and R is false. So the complete truth is: P ∧ Q ∧ ¬R.

   Now, consider two false theories:
     Theory A: P ∧ Q ∧ R   (which is false because R is actually false)
     Theory B: P ∧ ¬Q ∧ R  (which is false because Q is actually true and R false)

   According to Popper, we would like to compare A and B in terms of their verisimilitude.

   Step 1: Enumerate the logical consequences of each theory and the truth.

