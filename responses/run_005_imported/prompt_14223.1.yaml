answer: |-
  ## The Unmaker's Knowledge: Hobbes vs. Wallis

  **Setting:** Thomas Hobbes’s study, London. Late afternoon. Dust motes dance in the shafts of light piercing the shutters. Hobbes, in his late seventies, sits hunched over a diagram-strewn desk, looking both defiant and weary. A sharp knock precedes the entrance of John Wallis, Savilian Professor of Geometry at Oxford, bearing a rolled-up pamphlet. He’s in his forties, radiating intellectual energy.

  **Wallis:** Hobbes. I trust you received my latest… *correction*? (He taps the pamphlet meaningfully.)

  **Hobbes:** (Without looking up) Wallis. Like a persistent ague, you arrive uninvited. Your pamphlet? Aye. A tedious screed of symbols and insults masquerading as refutation. My construction is sound. The fault lies in *your* comprehension, clouded by those meaningless ‘indivisibles’ of yours.

  **Wallis:** Meaningless? They predict, Hobbes! They yield results where your cherished ‘constructions’ stumble and fall. Like this latest attempt to square the circle. Twenty years now? And still, the ratio eludes your compasses. My methods, however ‘meaningless’ you deem them, converge on the truth known since Archimedes. Pi is not rational. It cannot be constructed with straightedge and compass alone. The algebra *tells* us this, unequivocally.

  **Hobbes:** (Slams a hand on the desk, finally looking up, eyes blazing) Algebra! A game for clerks! Scribbles on a page! Where is the *cause*? Where is the *generation*? Geometry is certain because we *make* the figures! We trace the line, we describe the circle – we know *how* it comes to be, therefore we know *why* its properties are so! That is *knowledge*! Not just… *calculation*!

  **Wallis:** (Steps closer, voice low but intense) Ah, yes. The great ‘maker’s knowledge’. The foundation of your *Leviathan*, no? ‘For by Art is created that great LEVIATHAN... which is but an Artificiall Man’. You build the state, therefore you know its causes, therefore your civil philosophy can be as certain as geometry. A compelling analogy, Thomas. Compelling… and *fragile*.

  **Hobbes:** Fragile? It is bedrock! Man constructs the commonwealth, stipulates the covenant, defines the powers of the sovereign – just as the geometer constructs the triangle, stipulates its sides, defines its angles. The causes are known because they are *willed*, *enacted*.

  **Wallis:** Precisely. And therein lies the crack I drive at. Look at *this*! (He gestures wildly at Hobbes’s diagram). You *willed* this construction. You *enacted* it with compass and rule. You claim ‘maker’s knowledge’. Yet, it *fails*. It does not square the circle. The causes you thought you knew… were insufficient. Illusory. Now look at *my* method. (He unrolls his pamphlet, pointing to a dense algebraic expression). These symbols – these ‘scribbles’ – require no ‘making’ of a figure in the world. I manipulate them according to consistent rules derived *from* geometry, but abstracted *beyond* any single construction. And they *land* on the truth. They predict what your painstaking constructions *cannot achieve*.

  **Hobbes:** (Leans forward, gripping the edge of the desk) But *what* do they land on, John? A number? An approximation? Not *knowledge*! You have the *what*, perhaps, but not the *why*! How does your algebra *explain* why the circle cannot be squared? It merely states an impossibility derived from manipulating symbols whose connection to the *true nature* of the circle you have not *constructed*, only *assumed*! Your answer is a brute fact, delivered by a machine you don't fully comprehend. Where is the causal chain? Where is the *scientia*?

  **Wallis:** And your failed constructions? What causal chain do *they* reveal? Only the chain of your own error! My algebra *works*, Hobbes. It navigates complexities your constructions founder upon. It finds truths *without* needing to ‘make’ the impossible figure first. Doesn’t that undermine your analogy? If the very paradigm of maker’s knowledge – geometry – can be pursued *more successfully* by methods that *lack* that maker’s knowledge, that deal in abstract relations… what does that say about the *necessity* of ‘making’ for true knowledge? Can your civil philosophy truly claim the unique certainty of geometry, when geometry itself seems to yield its deepest secrets to… ‘symbol-pushing’?

  **Hobbes:** (A long pause. He stares past Wallis, not at the diagram, but into the philosophical abyss Wallis has opened. When he speaks, it’s slower, more deliberate, but still fierce) You mistake the nature of the analogy, Wallis. And the nature of certainty. My construction *fails* because I erred in the *principles* of the construction. I presumed a possibility that the *true causes* embedded in the nature of the circle itself forbid. The failure *reveals* the deeper necessity! It is not the *making* that failed absolutely; it was my *specific plan* that violated the true generative principles. The certainty lies in understanding *why* the construction *must* fail – a certainty gained through the very attempt to generate it!

  **Wallis:** So failure is instructive? Agreed. But my algebra *avoids* the failure entirely by operating at a level your constructions cannot reach. It finds the truth *without* the messy, error-prone process of physical generation. Doesn't that suggest knowledge can reside in the *relations themselves*, grasped abstractly, independent of our ability to ‘make’ the object in the world? Like understanding the laws of motion without building every conceivable machine?

  **Hobbes:** Abstract relations! Grasped *how*? Your algebra is built upon axioms – points, lines, equality – derived *from* our experience of making and comparing figures in the world! It is a *shorthand*, Wallis, a powerful one, I grant you, for describing the consequences of *possible constructions*. But its foundation, its *meaning*, is parasitic upon that very maker's knowledge! When your symbols yield Pi, they describe a ratio inherent in the *nature* of the circle *as a generated figure*. You have not escaped generation; you have merely outsourced the understanding of it to your symbols. The certainty of the result *still* depends on the certainty of the foundational concepts derived from making.

  **Wallis:** Then why can't *you* derive Pi with *your* method? If maker’s knowledge is primary, why is it so fallible in practice? Why does my ‘parasitic’ shorthand consistently outpace your foundational certainty? What if the algebra reveals truths *about* the possible constructions that your compasses simply cannot execute? Doesn't that imply the relations *transcend* any single act of making?

  **Hobbes:** (Stands up, towering despite his age) It implies the mind, Wallis! The mind that conceives the circle, that understands generation, that *designs* your algebra as a tool! The maker’s knowledge resides ultimately in the *reason* that understands the principles of generation, whether it uses a compass or a symbol! My error was a failure of *reason*, not a failure of the *principle*. The commonwealth! When we reason correctly about the causes of peace, about the generation of sovereign power from the consent of men driven by fear – *that* is where the certainty lies! Not in the messy, contingent history of any *particular* state, any more than the certainty of geometry lies in my flawed diagram! It lies in the *true causes* understood through the act of rational construction!

  **Wallis:** (Shakes his head, a mixture of frustration and reluctant admiration) So, the failed diagram is irrelevant? The state that collapses into civil war due to faulty construction? Mere ‘errors in application’, not undermining the principle? You retreat to the purity of the *idea*, Thomas, while the world – and the circle – resist your practical grasp. My symbols may be ‘parasitic’, but they *work* where your pure constructions falter. That gap – between your ideal of maker’s certainty and the stubborn reality your constructions meet – is where your Leviathan, for all its genius, might yet founder. The commonwealth is built by fallible men, with flawed reason, not by the perfect geometer-God you imagine yourself to be. Algebra accepts the mess. It seems your geometry cannot.

  **Hobbes:** Get out, Wallis. Take your symbols and your doubts. I know the cause of the circle. I know the cause of the commonwealth. Your… *calculations*… prove nothing but your own facility with a clever trick. The *scientia* remains where it has always been: in the understanding of generation. Now leave me to mine.

  **Wallis:** (Rolls up the pamphlet with a sharp snap) As you wish, Hobbes. But the circle remains unsquared. By *your* hand. Ponder *that* cause. (He turns and leaves, the door closing firmly behind him.)

  **Hobbes:** (Stares at the closed door, then slowly down at his flawed diagram. He doesn't pick up the compass. He picks up his pen, dips it in ink, and begins writing furiously on a fresh sheet, not geometry, but philosophy. His jaw is set, but a deep, troubled furrow creases his brow. The fight is far from over, in either sphere.)
