prompt: |-
  For a school research paper on the history of democratic theory, I've been working through Spinoza's unfinished Political Treatise (Tractatus Politicus). He died in 1677 partway through the final chapter, "Of Democracy," so the passage below (from the R.H.M. Elwes translation) is essentially where his final work breaks off. Just before it, in section 3, he defines who counts as a citizen with voting rights in his model democracy, specifying that it excludes "women and slaves, who are under the authority of men and masters, and also children and wards, as long as they are under the authority of parents and guardians." Section 4, the last section he ever completed, defends that exclusion of women:

  "But, perhaps, someone will ask, whether women are under men's authority by nature or institution? For if it has been by mere institution, then we had no reason compelling us to exclude women from government. But if we consult experience itself, we shall find that the origin of it is in their weakness. For there has never been a case of men and women reigning together, but wherever on the earth men are found, there we see that men rule, and women are ruled, and that on this plan, both sexes live in harmony. But on the other hand, the Amazons, who are reported to have held rule of old, did not suffer men to stop in their country, but reared only their female children, killing the males to whom they gave birth. But if by nature women were equal to men, and were equally distinguished by force of character and ability, in which human power and therefore human right chiefly consist; surely among nations so many and different some would be found, where both sexes rule alike, and others, where men are ruled by women, and so brought up, that they can make less use of their abilities. And since this is nowhere the case, one may assert with perfect propriety, that women have not by nature equal right with men: but that they necessarily give way to men, and that thus it cannot happen, that both sexes should rule alike, much less that men should be ruled by women. But if we further reflect upon human passions, how men, in fact, generally love women merely from the passion of lust, and esteem their cleverness and wisdom in proportion to the excellence of their beauty, and also how very ill-disposed men are to suffer the women they love to show any sort of favour to others, and other facts of this kind, we shall easily see that men and women cannot rule alike without great hurt to peace. But of this enough."

  What I can't reconcile is how this squares with Spinoza's own definition of natural right earlier in the treatise, where he insists that a thing has exactly as much right as it has the power "to exist and operate" — right and power are treated as two names for the same fact. Here, though, he seems to run two different arguments together: one that infers women's lack of natural power directly from the historical fact that no society has ever had women ruling on equal terms with men, and a separate one about how sexual jealousy would make joint rule destabilizing even if the sexes were equally capable. The second argument sounds like the kind of appeal to human passions he relies on constantly elsewhere in the book to explain why some constitutions hold together and others fall apart; the first sounds like it is just reading a historical accident as though it were a metaphysical fact about power. Is the "no precedent" argument doing any real work here, or is it really just dressing up the passions-based argument in the language of natural right? And more generally, is there a principled way, on Spinoza's own terms, to tell entrenched custom apart from genuine natural necessity — or does his method more or less guarantee that whatever hasn't happened yet gets classified as impossible by nature?
