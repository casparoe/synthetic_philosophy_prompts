  Also, the user might be interested in practical implications. Even if constructivism is correct, in everyday math, we act as if classical logic holds. So maybe for logical uncertainty purposes, assuming classical logic is pragmatic. But they want to know if there's a deeper philosophical problem. 

  Another point: if we use proof lengths or algorithmic probability, that might align better with constructivism. Credences could reflect the likelihood of finding a short proof. But this shifts the focus from truth to provability. 

  I should also address whether constructivism itself affects which conjectures are assigned probabilities. For example, some statements might be independent of the axioms, leading to no possible proof. But intuitionism might handle that differently. 

