answer: |-
  Your reading of Aquinas as establishing a "standing right" to tyrannicide for *any subject* is a strong interpretation, particularly when emphasizing the *Sentences* commentary. While *De Regimine Principum* introduces crucial nuance that potentially limits this right to *public authority* rather than private individuals, your focus on the radical potential of the *Sentences* passage is well-founded for resistance theory. Here's how to structure the lecture support and contrast with Locke:

  **Key Passages Supporting Your Reading:**

  1.  **Commentary on the Sentences (II Sent., d. 44, q. 2, a. 2, ad 5):** This is the cornerstone for your argument.
      *   **Text:** "Seditionem autem faciunt qui legitimo principi resistunt. Tyrannus autem non est princeps legitimus, sed potius iniustus dominator; et ideo tyrannidem depellere non est seditiosum, nisi forte quando sic inordinate et cum maiori perturbatione multitudinis tyrannus expellitur, quam eius dominatio fuerat."
      *   **Translation/Interpretation:** "Sedition is committed by those who resist a *legitimate* prince. But a tyrant is *not* a legitimate prince, but rather an unjust ruler; and therefore to overthrow a tyranny is *not* seditious, *unless* perhaps it is done so disorderly and with greater disturbance to the multitude than the tyranny itself had been."
      *   **Why it supports your reading:** This is unambiguous:
          *   Tyranny = Illegitimate rule (corruption of dominion).
          *   Resisting it = *Not* sedition (the gravest political crime).
          *   The only limitation is pragmatic (avoiding worse disorder), *not* based on the *status* of the resister. It does *not* say "only public officials" or "only if authorized." The logic flows from the *nature of tyranny itself* rendering resistance licit. This strongly implies the *right* (or at least, the *non-criminality*) resides potentially in *anyone* recognizing the tyranny and acting to end it, provided the means are proportionate.

  2.  **De Regimine Principum (On Kingship), Book I, Chapter 6:** While often seen as moderating the *Sentences*, key passages resonate with your core doctrine and provide the political context.
      *   **Text (on the origin of tyranny):** "Unde patet quod regimen tyranni est iniustum, quia non ordinatur ad bonum commune, sed ad bonum privatum regentis."
          *   *Translation:* "Hence it is clear that the rule of a tyrant is unjust, because it is not ordered to the common good, but to the private good of the ruler." (Reaffirms the *Sentences* definition of tyranny as corrupted dominion).
      *   **Text (on resistance):** "Non autem est excusatio propter timorem periculi, si aliquis non praestet debitum auxilium communitati in tanto periculo constitutae... Si vero ad tyrannum non sit recursus habendus per superiorem iudicem, recurrendum est ad Deum... Si autem non sit humana via per quam contra tyrannidem agi possit, recurrendum est ad Deum regem omnium... Quod si multitudo habeat potestatem super regem... iuste potest multitudo regem deponere vel refrenare eius potestatem."
          *   *Translation:* "It is no excuse because of fear of danger if someone does not render due assistance to the community placed in such danger... If, indeed, there is no recourse to a higher judge against the tyrant, recourse must be had to God... But if there is no human way by which action can be taken against the tyranny, recourse must be had to God, the king of all... But if the multitude has authority over the king... the multitude can justly depose the king or restrain his power."
      *   **Why it supports your reading (with nuance):** While emphasizing recourse to higher authority (human or divine) and the *multitude* acting through its inherent authority ("si multitudo habeat potestatem"), it powerfully argues:
          *   Tyranny is a *grave danger* to the community.
          *   *Not* acting against it out of fear is *not excusable*.
          *   If *no human recourse* exists (no higher judge, no established mechanism), the *duty* to act falls back on the community/multitude ("recurrendum est ad Deum" implicitly empowers human agents as God's instruments when earthly justice fails). The final sentence explicitly grants the *multitude* the right to depose. The crucial question for your interpretation is: Who *is* "the multitude" authorized to act? Aquinas likely means the community acting *through its leaders/representatives*, but the language ("multitudo") is broad and doesn't *explicitly* restrict action *only* to formally constituted bodies. It leaves open the possibility of popular action when all else fails.

  **Situating Aquinas Relative to Locke's Right of Revolution:**

  Both Aquinas and Locke ground resistance in the ruler's fundamental violation of the purpose of government, but their frameworks, scope, and mechanisms differ significantly:

  1.  **Foundation of the Right:**
      *   **Aquinas:** Based on **Natural Law and Theology**. Tyranny violates the divinely ordained purpose of political authority (the common good). Resistance is justified as a restoration of just order and a duty to God/natural law. The *right* stems from the *illegitimacy* of the tyrant's rule itself.
      *   **Locke:** Based on **Popular Sovereignty and Contract Theory**. Government exists by the consent of the governed to protect natural rights (life, liberty, property). When the government systematically violates this trust ("breaches the contract"), it dissolves itself, and power reverts to the people. The *right* stems from the people's inherent sovereignty.

  2.  **Nature of the Right/Holder:**
      *   **Aquinas:** Your *Sentences*-centric reading emphasizes a **negative right/non-criminality potentially residing in any subject** ("whoever kills him cannot be guilty of sedition"). *De Regimine* tempers this, emphasizing **action by the community ("multitudo") or its constituted authorities**. It's more about removing an illegitimate ruler than establishing a new government per se. The focus is on *duty* to resist grave injustice.
      *   **Locke:** A **positive, collective right of "the People"** to judge the breach, dissolve the government, and reconstitute political society. It's explicitly revolutionary and institutional. The right belongs to the community as a whole acting collectively.

  3.  **Trigger/Conditions:**
      *   **Aquinas:** **Tyranny defined as rule for private good, not common good.** Resistance is justified when tyranny is established and *no higher human authority exists* to remedy it. The *De Regimine* caveat about avoiding greater disorder is crucial. The focus is on the *ruler's character/purpose*.
      *   **Locke:** **"A long train of abuses"** demonstrating a systematic design to undermine the ends of government (protecting rights). It's not just bad character, but a pattern of *actions* violating the trust. The focus is on the *government's actions* violating the contract.

  4.  **Mechanism:**
      *   **Aquinas:** Ambiguous on precise mechanism. Favors established channels (higher judges, community mechanisms). Your reading of the *Sentences* leaves open tyrannicide by individuals; *De Regimine* strongly suggests action by the *multitude* collectively. The endpoint is removal of the tyrant.
      *   **Locke:** Explicitly **revolutionary dissolution and reconstitution.** The people, acting as a collective body, judge the breach, dissolve the existing government, and establish a new one. It's a formal, political act of re-founding.

  **Conclusion for the Lecture:**

  *   **For Your Interpretation:** Emphasize the **radical clarity of *Sentences* II, d.44, q.2, a.2, ad 5.** Aquinas states unequivocally that resisting a tyrant is *not* sedition because tyranny is illegitimate rule. The limitation is practical (avoid worse chaos), not based on the resister's status. Argue that *De Regimine* I.6, while introducing the *multitudo* and higher authorities, does not *retract* this core principle but places it within a broader political framework. The *duty* to act when all else fails, falling ultimately on the community, implies a latent right/power residing within the polity, potentially activated by its members when necessary.
  *   **Contrast with Locke:** Frame Aquinas as the **medieval precursor grounded in natural law/theology**, establishing the *principle* that illegitimate rule forfeits its claim to obedience and can be resisted. Locke represents the **early modern secularization and democratization** of this principle. Locke transforms the duty/resistance framework into an explicit doctrine of *popular sovereignty* and *revolutionary right*, grounded in consent and contract, with a clearer mechanism (dissolution/reconstitution) and a focus on rights violations rather than just the ruler's intent. Aquinas provides the moral/theological justification for removing a tyrant; Locke provides the political theory for the people to reclaim their sovereignty and rebuild the state. Your reading highlights how Aquinas, especially in the *Sentences*, comes remarkably close to a universal *negative* right (non-punishability) of resistance, which Locke expands into a universal *positive* right (sovereign power) of the collective people.
