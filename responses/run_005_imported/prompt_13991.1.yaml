prompt: |-
  so in my population ethics seminar we just covered Arrhenius's impossibility theorem, and I get why everyone's so bothered by the repugnant conclusion, but I'm kinda fuzzy on why critical-level utilitarianism actually counts as progress. our prof mentioned in passing that it basically just swaps the RC for the sadistic conclusion instead, but never showed the actual math for it. can you construct that example for me with made-up but concrete welfare numbers and population sizes -- like, compare what a critical-level view says about adding a small number of really badly-off people vs a huge number of people who's lives are positive but fall under the critical level, and show which one it actually ranks as better? then in a couple sentences explain why plain total utilitarianism doesn't run into this specific problem, even tho it eats the RC instead.
