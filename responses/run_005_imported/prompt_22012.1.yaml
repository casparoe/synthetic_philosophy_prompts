answer: |-
  Here are ten targeted interview questions with follow-ups designed to rigorously test expressivism's solution to the Frege-Geach and negation problems, pushing beyond procedural assurances to evaluate substantive success. Each follow-up anticipates a likely response and presses the core philosophical tension:

  1.  **Core Embedding Challenge:** "Let's take the embedded context in the modus ponens argument: *'If breaking a promise is wrong, then getting someone else to break a promise is wrong.'* According to expressivism, what specific *attitude* is the antecedent *'breaking a promise is wrong'* expressing in this unasserted context? It's not an expression of disapproval, as no one is asserting it here."
      *   *Likely Response:* "It expresses a *higher-order* attitude, like disapproval of *not* disapproving of promise-breaking in contexts where the conditional is evaluated."
      *   **Follow-up:** "If the antecedent expresses a higher-order attitude about disapproval (e.g., disapproval of lacking disapproval), but the *consequent* expresses a first-order attitude (disapproval of getting someone to break a promise), how does the *logical connection* between them – the validity of modus ponens – emerge? Aren't we now connecting two *different types* of attitude states?"

  2.  **The Negation Problem - Core Case:** "Expressivism holds that 'Cruelty is wrong' expresses disapproval of cruelty. What attitude, then, does the negated claim 'Cruelty is *not* wrong' express?"
      *   *Likely Response:* "It expresses *tolerance* of cruelty, or the *absence* of disapproval, or perhaps disapproval of *disapproving* of cruelty (a higher-order attitude)."
      *   **Follow-up:** "If it expresses *tolerance*, is tolerance simply the *absence* of disapproval, or is it a *positive* attitude state? If it's just the absence, how does it function as a *commitment* that can stand in logical relations (like inconsistency) with 'Cruelty is wrong'? If it's a positive attitude (like tolerance or higher-order disapproval), how is this different from positing a new primitive attitude for every negation?"

  3.  **Negation Problem - Generalization (Disjunction):** "Building on negation, consider the disjunction: 'Either cruelty is wrong or eating meat is permissible.' What *complex attitude* does this entire disjunction express? It doesn't seem reducible to just disapproving of cruelty or approving of eating meat."
      *   *Likely Response:* "It expresses a complex state like *planning* to disapprove of cruelty *or* planning *not* to disapprove of eating meat, governed by norms of consistency for such plans."
      *   **Follow-up:** "This 'planning' or 'norm-governed state' sounds very abstract. How does it differ, *functionally within the logic*, from simply assigning a *truth-value* (like True or False) to each disjunct and applying the standard truth-functional rule for disjunction? If the functional role is identical, what work is the 'attitude' part doing besides relabeling?"

  4.  **Compositionality & Novelty:** "Your logic of attitudes needs to explain the meaning of infinitely many complex moral sentences built from simple components and logical operators. How do you generate the attitude expressed by a novel, complex sentence (e.g., 'If it's not wrong to lie unless telling the truth causes harm, then...') *compositionally*? Does every new logical combination require inventing a *new*, distinct type of attitude state?"
      *   *Likely Response:* "No, we build complex states systematically from simpler attitudes using operators defined by their inferential roles within the attitude logic system."
      *   **Follow-up:** "If the meaning of the logical operator (like 'if...then...' or 'unless') is defined *entirely* by its inferential role within this system built for *attitudes*, and that inferential role is stipulated to mirror the inferential role of the *truth-functional* operator, isn't the 'attitude' part becoming epiphenomenal to the *logical structure* you're painstakingly reconstructing?"

  5.  **Inconsistency vs. Descriptive Falsehood:** "Cognitivists explain the inconsistency between 'Cruelty is wrong' and 'Cruelty is not wrong' as them asserting contradictory facts. How does expressivism explain this inconsistency purely in terms of attitudes?"
      *   *Likely Response:* "The attitudes expressed are *incompatible* according to the constitutive norms of the attitude system – you cannot coherently hold both disapproval of X and tolerance of X (or whatever the negation attitude is) simultaneously."
      *   **Follow-up:** "What *grounds* this incompatibility? Is it a brute, primitive feature of these specific attitudes? If so, how is this explanation less mysterious or more parsimonious than the cognitivist's appeal to contradiction? If it's grounded in practical incoherence (e.g., you couldn't stably *act* on both), does that mean moral inconsistency is *reducible* to practical inconsistency, raising separate problems?"

  6.  **The Collapse Worry:** "If expressivism successfully builds a logic of attitudes that perfectly mirrors the logic of factual discourse – preserving validity, inconsistency, embedding, etc. – what *substantive content* remains to the claim that moral sentences *aren't* describing facts? Doesn't the elaborate reconstruction suggest moral discourse *behaves* exactly *as if* it were fact-stating, making the expressivist 'attitude' label just a philosophical interpretation layered on top of a cognitivist logical structure?"
      *   *Likely Response:* "The difference lies in the *fundamental metaphysics*: cognitivists posit moral facts *in the world*, while expressivists only posit human attitudes and the logical structures we project onto them to make sense of our practices."
      *   **Follow-up:** "But if the *semantic rules* governing the use of moral terms (their inferential roles, embedding behavior, etc.) are identical under both interpretations, and the *practical role* of moral judgments (guiding action, prompting debate) is also acknowledged by cognitivists, what *observable difference in use or function* does the expressivist's denial of moral facts actually make? Isn't the debate becoming purely metaphysical with no semantic or practical consequences?"

  7.  **The Analogy Challenge:** "We use non-factual language that embeds logically – commands ('Shut the door!'), expressions of taste ('Licorice is delicious'). Yet, we readily understand embedded contexts ('If you shut the door, I'll be happy'; 'If licorice is delicious, why isn't it popular?') without needing a special 'logic of commands/tastes'. Why does *moral* language, on your view, require this uniquely complex attitudinal logic machinery when these other non-factual domains seem to function with simpler semantic treatments?"
      *   *Likely Response:* "Moral discourse has a unique combination of features: it's deeply action-guiding, involves robust disagreement, and crucially, demands *objectivity* and *universality* in a way that tastes or simple commands do not. This necessitates a more complex logic to capture these normative force and apparent objectivity within an expressivist framework."
      *   **Follow-Up:** "Doesn't this appeal to the *unique objectivity demands* of morality implicitly concede that the expressivist project *requires* reconstructing the *semblance* of objectivity (through the logical structure) that cognitivists take at face value? If the reconstructed logic successfully delivers this 'semblance', how is it meaningfully different *in practice* from the cognitivist's 'reality'?"

  8.  **Concrete Embedding Revisited (Belief Contexts):** "Consider the sentence: 'Alex believes that breaking promises is wrong.' Cognitivism straightforwardly analyzes this as Alex standing in a belief relation to the proposition *that breaking promises is wrong*. What does the expressivist analyze Alex as *doing* in this case? What complex state of Alex's is being reported?"
      *   *Likely Response:* "This reports that Alex has a complex, commitment-bearing attitude state of the kind expressed by 'breaking promises is wrong' – perhaps Alex is in a state of disapproval of promise-breaking, governed by the relevant norms of the attitude system."
      *   **Follow-up:** "But 'Alex believes that P' typically reports a *cognitive* state directed towards a *content*. If your analysis of 'Alex believes that breaking promises is wrong' ultimately reports Alex being in a state *functionally identical* to believing a proposition (because it has the same commitment/inferential profile), haven't you just *re-described* belief in expressivist terms without changing the fundamental *structure* of the state being reported?"

  9.  **The Problem of New Attitudes:** "Critics argue expressivism risks a 'proliferation of attitudes': a new attitude type for negation, another for disjunction, another for conditionals, etc. You've mentioned systematic operators. Can you definitively rule out that, for *some* complex logical construction or embedded context we haven't yet fully analyzed, your system *won't* need to postulate a fundamentally *new kind* of primitive attitude state to make the logic work?"
      *   *Likely Response:* "The goal is a *finite, compositional* system built from a small set of core attitudes (like disapproval/approval) and operators defined by their logical roles. We have no evidence yet that this requires genuinely *new primitive attitudes* beyond the core ones; it's about complex combinations governed by rules."
      *   **Follow-up:** "How do you distinguish between a 'complex combination of core attitudes governed by rules' and a genuinely *new, irreducible* attitude state? If a proposed complex state exhibits unique functional properties not derivable from the core attitudes and the rules alone, wouldn't that force you to introduce it as primitive? What principle prevents this?"

  10. **Falsifiability & Moving Goalposts:** "This has been incredibly helpful. To conclude, imagine we discover a specific, complex embedded moral sentence or pattern of inference where your proposed logic of attitudes demonstrably *fails* to replicate the logical properties that are intuitively present or required for ordinary moral reasoning to function. What would such a failure *look like* concretely? What specific kind of breakdown in validity, inconsistency, or embedding behavior would you accept as evidence that the expressivist project *cannot succeed* in fully accounting for moral language's logic within its attitudinal framework, rather than merely indicating an 'engineering' problem requiring further refinement?"
      *   *Likely Response:* "A failure would be if we found an inference pattern universally accepted as valid in moral reasoning that *cannot* be validated by *any* consistent set of norms governing combinations of attitudes, no matter how complex or refined. Or if the machinery required to validate *all* standard inferences became demonstrably ad hoc or generated clearly absurd results elsewhere."
      *   **Follow-up (Final Challenge):** "But isn't there a danger that the expressivist framework is so flexible that *any* apparent counterexample could *always* be absorbed by positing more complex norms or attitude structures? If the project is defined by its *goal* (reconstructing standard logic), and failure to meet that goal is seen as a problem *for the project* rather than evidence *against expressivism*, does expressivism risk becoming unfalsifiable? How do you guard against this?"

  **Key Principles Embedded:**

  *   **Concreteness:** Questions 1, 3, and 8 demand analysis of specific linguistic examples.
  *   **Negation Focus:** Questions 2 and 3 explicitly tackle the negation problem and its generalization.
  *   **Compositionality & Proliferation:** Questions 4 and 9 press the worry about needing endless new attitudes or indistinguishable functional roles.
  *   **Collapse Worry:** Questions 6 and 7 directly challenge whether success means becoming cognitivism in disguise.
  *   **Falsifiability:** Question 10 explicitly asks for failure conditions, preventing endless deferral.
  *   **Anticipatory Follow-ups:** Each follow-up is designed to block a likely escape route and push the guest to defend the *substantive success* and *distinctiveness* of the expressivist solution, not just its possibility.

  Use these to guide a rigorous and revealing discussion. Good luck with the podcast!
