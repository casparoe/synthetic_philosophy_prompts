  First, I need to recall Boorse's theory. He defines disease as a reduction in functional ability below typical efficiency for one's age, sex, and species. Health is value-free and statistical. Kingma's counterexample: pregnancy involves hormonal shifts, immune changes, etc., which are abnormal in the reference class "women," but pregnancy isn't a disease. Boorse might respond by narrowing the reference class to "non-pregnant women" or "women of reproductive age," but Kingma says that's ad hoc and normative because it presupposes that pregnancy is normal.

