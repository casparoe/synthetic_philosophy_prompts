prompt: |-
  I'm teaching a seminar on Popper this term, and yesterday's session was all about the verisimilitude mess -- the idea that even though pretty much every scientific theory we've ever had is technically false, some are still closer to the truth than others, and Popper tried to make that precise in terms of truth-content and falsity-content. I put the Tichy/Miller result on the board: on Popper's own definition, it turns out no false theory can ever come out more verisimilar than any other false theory, which is about as damaging as it sounds given that literally every theory anyone has taken seriously in the history of science is false in some respect. Everyone followed the abstract proof fine, but when I asked them to cook up their own concrete case that actually makes the problem bite, the room went dead quiet, and honestly I dont blame them -- the stock examples in the reading always feel a little rigged to me too.

  So here's what I want from you, partly so I can steal it for next week's handout: invent a small toy example of your own -- a couple of simple false "theories" about some domain, whatever you like, just not the usual weather-forecasting one everybody reaches for -- where most people's intuition would say one theory is clearly closer to the truth than the other. Then actually run it through Popper's machinery: lay out the truth-content and falsity-content each one generates, and show concretely where the comparison collapses or gives the wrong verdict, rather than just re-describing the general theorem. That's the bit my students keep glossing over, and I want to see if a genuinely fresh example makes it click.
reasoning: |-
  We are going to create a toy example. Let's choose a simple domain: a universe with only three objects, and we are interested in a single property P. So the possible states (worlds) are described by which of these three objects have property P.

  Let the domain be {a, b, c}. The set of all possible worlds is the set of all subsets of {a, b, c} (each subset representing the set of objects that have P). There are 8 possible worlds:

  w0: {}          (no object has P)
  w1: {a}
  w2: {b}
  w3: {c}
  w4: {a, b}
  w5: {a, c}
  w6: {b, c}
  w7: {a, b, c}

  Now, suppose the actual world is w4: {a, b} (so a and b have P, c does not).

  We will consider two false theories:

  Theory T1: "Exactly one object has P." This is false because in the actual world, two objects have P.

  Theory T2: "All objects have P." This is false because in the actual world, c does not have P.

  Intuitively, T1 is closer to the truth than T2. Why? Because T1 gets the number of objects with P wrong by one (it says one, but there are two) and also fails to specify which one (so it misses on the specific objects). T2, on the other hand, says that c has P when it doesn't, and also it says that there are three objects with P when there are only two. So T1 seems to be less wrong.

  Now, let's see what Popper's definition of verisimilitude says.

  Popper's definition (simplified for our finite case): 

  For a theory T (which we can think of as a set of possible worlds that it allows), the truth-content of T is the set of true statements that follow from T. But note: in our setting, we can think of the content of T as the set of worlds that T rules out? Actually, it's more common to think of the content as the set of statements (or equivalently, the set of false worlds that T excludes?).

  Actually, Popper defines:

  - The truth-content of T, denoted CT_T(T), is the set of true consequences of T.
  - The falsity-content of T, denoted CT_F(T), is the set of false consequences of T.

  Then, T1 has more verisimilitude than T2 if:
    (i) the truth-content of T1 is greater than that of T2, and the falsity-content of T2 is at least as great as that of T1; or 
    (ii) the truth-content of T1 is at least as great as that of T2, and the falsity-content of T2 is greater than that of T1.

  But note: the Tichy-Miller result shows that for any two false theories, this comparison fails because the sets of truth-content and falsity-content are not independent.

  We are going to represent theories as sets of worlds. But note: in our setting, a theory that is a set of worlds corresponds to the statement that the actual world is one of those. So:

  T1: "Exactly one object has P" corresponds to the set {w1, w2, w3}.
  T2: "All objects have P" corresponds to the set {w7}.

  The actual world is w4.

  Now, we need to consider the logical consequences. In this setting, we can consider the statements as propositions about which objects have P. The set of all possible statements is the set of all subsets of the 8 worlds? Actually, we can think of the language as having atomic propositions: P(a), P(b), P(c). Then every statement is equivalent to a disjunction of worlds (a world being a complete assignment).

  But note: Popper's definition is about logical consequences. We can consider the set of all statements that are true in the actual world and that are entailed by T.

  However, in a finite setting, we can list the truth-content and falsity-content by considering the set of worlds that are ruled out? Actually, let's try to define:

  The content of a theory T (set of worlds) is the set of statements that are true in every world of T. But note: the consequences of T are the statements that are true in every world of T.

  But then:

  - A true consequence of T is a statement that is true in the actual world and that is true in every world of T.
  - A false consequence of T is a statement that is false in the actual world and that is true in every world of T.

  But note: if a statement is true in every world of T, then it is a consequence of T. And if it is true in the actual world, then it is a true consequence. If it is false in the actual world, then it is a false consequence.

  So we can list:

  For T1 (which is {w1, w2, w3}):

  True consequences: statements that are true in w4 and true in every world of T1 (i.e., w1, w2, w3).

  What is true in w4? 
  - P(a) is true, P(b) is true, P(c) is false.

  What must be true in every world of T1? In every world in T1, exactly one of P(a), P(b), P(c) is true.

  So, for example, the statement "P(a) or P(b) or P(c)" is true in every world of T1 and also true in w4 (so it is a true consequence).

  But also, note that in every world of T1, it is not the case that two or more are true. So the statement "It is not the case that (P(a) and P(b))" is true in every world of T1. Is it true in w4? In w4, we have P(a) and P(b) true, so "It is not the case that (P(a) and P(b))" is false in w4. Therefore, it is a false consequence? But wait: we said that in every world of T1, this holds. However, in w4 (the actual world) it is false. So it is a false consequence of T1.

  Similarly, we can generate:

  True consequences of T1:
  - There is at least one object with P. (Because in T1, each world has exactly one, so at least one; and in w4, there are two, so at least one is true.)
  - Not all objects have P. (Because in T1, at most one has P, so not all; and in w4, not all because c does not have P.)

  But note: we must be careful. We are working in a propositional language with three atoms. The statements we can form are arbitrary combinations.

  Alternatively, we can think of the consequences as the set of all disjunctions of the models of T1? Actually, the set of consequences is the set of statements that are true in every model of T1, which is the same as the set of statements that are true in the intersection of the sets of models? But note: the models of T1 are w1, w2, w3. The consequences are the statements that are true in w1, w2, and w3.

  So the set of consequences of T1 is exactly the set of statements that are true in all of w1, w2, w3.

  Similarly, for T2: the set of consequences is the set of statements that are true in w7.

  Now, the truth-content of T1 is the set of consequences of T1 that are true in the actual world (w4). Similarly, the falsity-content is the set of consequences of T1 that are false in w4.

  But note: a statement that is a consequence of T1 is true in w1, w2, w3. It might be true or false in w4.

  Let's list the statements that are consequences of T1. Since the language is generated by three atoms, we can list the strongest statements that are consequences. But note: the strongest consequence of T1 is the disjunction w1 ∨ w2 ∨ w3, i.e., "exactly one of a, b, c has P". However, we are interested in all consequences.

  But we can note: the truth-content of T1 is the set of statements that are true in w4 and also true in w1, w2, w3.

  Similarly, the falsity-content of T1 is the set of statements that are false in w4 but true in w1, w2, w3.

  Now, let's try to find a statement that is a consequence of T1 and true in w4.

  Example: 
  - "P(a) ∨ P(b) ∨ P(c)" is true in w1, w2, w3 and also in w4 -> true consequence.
  - "¬(P(a) ∧ P(b) ∧ P(c))" is true in w1, w2, w3 (because they don't have all three) and also in w4 (because w4 does not have P(c)) -> true consequence.
  - "¬(P(a) ∧ P(b))" is true in w1, w2, w3? 
    - In w1: P(a) true, P(b) false -> so ¬(P(a)∧P(b)) is true.
    - In w2: P(a) false, P(b) true -> true.
    - In w3: both false -> true.
    But in w4: P(a) and P(b) are true, so ¬(P(a)∧P(b)) is false. Therefore, this is a false consequence of T1.

  Similarly, we can see that for T2 (which is {w7}):

  Consequences: statements that are true in w7.

  True consequences: those that are also true in w4.
  - Example: "P(a) ∨ P(b) ∨ P(c)" is true in w7 and in w4 -> true.
  - "P(a)" is true in w7 and also in w4 -> true? But wait: is "P(a)" a consequence of T2? T2 says that all objects have P, so it entails P(a). And P(a) is true in w4. So it's a true consequence.

  False consequences: 
  - "P(c)" is a consequence of T2? Yes, because T2 entails P(c). But in w4, P(c) is false. So it's a false consequence.

  Now, to compare T1 and T2 by Popper's definition, we need to compare their truth-contents and falsity-contents.

  But note: the Tichy-Miller result says that we cannot have both:
    - The truth-content of T1 is a superset of the truth-content of T2, and the falsity-content of T1 is a subset of the falsity-content of T2 (with at least one being proper) OR
    - ... the other way around.

  We need to see if one of the two conditions holds.

  Alternatively, we can try to see if the truth-content of T1 is greater than that of T2 and the falsity-content of T1 is less than or equal to that of T2? But the Tichy-Miller result says that for any two false theories, this fails.

  Let's try to see in our example.

  We need to compare the sets of true consequences and false consequences.

  But note: the set of consequences of T1 is the set of statements that are true in w1, w2, w3. The set of consequences of T2 is the set of statements that are true in w7.

  Now, the truth-content of T1: statements that are true in w1, w2, w3 and also true in w4.
  The truth-content of T2: statements that are true in w7 and also true in w4.

  Similarly for falsity-content.

  But note: we must be cautious because the set of statements is infinite. However, we can consider the strongest statements or use the fact that in propositional logic over n atoms, the Lindenbaum-Tarski algebra is finite (modulo equivalence). There are 2^(2^n) equivalence classes. So we can work modulo logical equivalence.

  But even so, comparing sets of statements by inclusion is tricky because we have to see if one set is included in the other.

  Alternatively, we can use the fact that the truth-content of T is generated by the set of true statements that are entailed by T. Similarly for falsity-content.

  But note: the Tichy-Miller argument typically uses the fact that if T1 and T2 are false, then there is a true statement that is entailed by T2 but not by T1, and a false statement entailed by T1 but not by T2, which breaks the inclusion.

  Let's try to see in our example:

  We want to see if the truth-content of T1 is a superset of that of T2 and the falsity-content of T1 is a subset of that of T2? Or vice versa.

  First, truth-content:

  Consider a statement that is in the truth-content of T2: it must be true in w7 and true in w4. What are some such statements?

  Example: 
    s1: "P(a)" 
    s2: "P(b)"
    s3: "P(a) ∨ P(b)"

  But note: is s1 a consequence of T2? Yes, because T2 entails P(a). And it is true in w4. So s1 is in the truth-content of T2.

  Is s1 in the truth-content of T1? That is, is s1 a consequence of T1 and true in w4? 
    Consequence of T1: must be true in w1, w2, w3. But in w2: P(a) is false. So s1 is not true in w2. Therefore, T1 does not entail s1. So s1 is not in the truth-content of T1.

  Therefore, the truth-content of T2 is not a subset of the truth-content of T1 because s1 is in the truth-content of T2 but not in T1.

  Now, is there a statement in the truth-content of T1 that is not in the truth-content of T2?

  Example: 
    s4: "¬P(c)" 
    Is s4 a consequence of T1? In w1, w2, w3: 
      w1: P(c)=false -> ¬P(c) true.
      w2: P(c)=false -> true.
      w3: P(c)=false -> true.
    So T1 entails ¬P(c). And in w4, ¬P(c) is true. So s4 is in the truth-content of T1.

    Now, is s4 a consequence of T2? T2 is w7: in w7, P(c) is true, so ¬P(c) is false. Therefore, T2 does not entail ¬P(c). So s4 is not in the truth-content of T2.

  Therefore, the truth-content of T1 is not a subset of the truth-content of T2 either (because s4 is in T1 but not in T2).

  So the truth-contents are incomparable.

  Now, falsity-content:

  Falsity-content of T1: false consequences of T1, i.e., statements that are false in w4 but true in w1, w2, w3.

  Example: 
    s5: "¬(P(a) ∧ P(b))" 
      We saw that this is true in w1, w2, w3 (so a consequence) and false in w4 (because in w4, P(a) and P(b) are both true) -> so s5 is in the falsity-content of T1.

  Falsity-content of T2: statements false in w4 but true in w7.
    Example: 
      s6: "P(c)"
        True in w7, false in w4 -> so in falsity-content of T2.

  Now, is the falsity-content of T1 a subset of that of T2? Or vice versa?

  We have s5 in falsity-content of T1. Is s5 in the falsity-content of T2? 
    s5: "¬(P(a) ∧ P(b))" 
    In w7: P(a) and P(b) are true, so P(a)∧P(b) is true, so ¬(P(a)∧P(b)) is false. Therefore, T2 does not entail s5 (because it's false in w7). So s5 is not in the falsity-content of T2.

  Similarly, we have s6 in falsity-content of T2. Is s6 in the falsity-content of T1?
    s6: "P(c)" 
    Is it a consequence of T1? In w1: P(c)=false -> so P(c) is false in w1. Therefore, T1 does not entail P(c). So s6 is not in the falsity-content of T1.

  Therefore, the falsity-contents are also incomparable.

  But note: the Tichy-Miller result says that we cannot have the required inclusion in both sets. In our example, we see that the truth-contents are not comparable by inclusion and the falsity-contents are not comparable by inclusion. Therefore, Popper's definition does not allow us to say that T1 has more verisimilitude than T2.

  However, intuitively we feel that T1 is closer to the truth. So the definition fails.

  But let's see if we can find a true consequence of T2 that is not a true consequence of T1 and a false consequence of T1 that is not a false consequence of T2? That is exactly what breaks the inclusion.

  We already saw:
    - s1 ("P(a)") is a true consequence of T2 but not of T1.
    - s5 ("¬(P(a) ∧ P(b))") is a false consequence of T1 but not of T2.

  Therefore, we have:
    - T2 has a true consequence that T1 lacks (s1).
    - T1 has a false consequence that T2 lacks (s5).

  Thus, neither of the two conditions in Popper's definition holds.

  Condition (i) would require:
    - The truth-content of T1 is greater than that of T2 (i.e., T1 has all the true consequences of T2 and more) and the falsity-content of T2 is at least as great as that of T1 (i.e., T1 has no extra false consequence beyond what T2 has, or even less).

  But we see that T2 has a true consequence (s1) that T1 lacks, so the truth-content of T1 is not greater (by inclusion) than that of T2. Similarly, T1 has a false consequence (s5) that T2 lacks, so the falsity-content of T1 is not contained in that of T2.

  Condition (ii) would require:
    - The truth-content of T1 is at least as great as that of T2 and the falsity-content of T2 is greater than that of T1.

  But we have that the truth-content of T1 is not a superset of T2's (because s1 is missing) and the falsity-content of T2 is not a superset of T1's (because s5 is missing).

  Therefore, by Popper's definition, T1 does not have more verisimilitude than T2.

  But intuitively, T1 is closer to the truth.

  This is the problem.

  To make it concrete for the students:

  - T1: exactly one object has P. (False because two do.)
  - T2: all objects have P. (False because c does not.)

  Actual world: a and b have P, c does not.

  True consequences of T1 that are not in T2: 
    - ¬P(c)   [because T2 entails P(c) and it's false, so ¬P(c) is not a consequence of T2]

  True consequences of T2 that are not in T1:
    - P(a)   [because T1 does not entail P(a) since in w2, P(a) is false]

  False consequences of T1 that are not in T2:
    - ¬(P(a) ∧ P(b))   [because in T2, P(a) and P(b) are true, so T2 entails (P(a)∧P(b)), which is true in w4? Wait, no: in w4, (P(a)∧P(b)) is true, so it's a true consequence of T2? But note: T2 does not entail ¬(P(a)∧P(b)), in fact it entails the opposite. So ¬(P(a)∧P(b)) is not a consequence of T2 at all. However, we have already seen that ¬(P(a)∧P(b)) is a consequence of T1 and it is false in w4. So it is a false consequence of T1. And it is not a consequence of T2 (so not in the falsity-content of T2).]

  False consequences of T2 that are not in T1:
    - P(c)   [because T2 entails P(c) and it's false in w4. T1 does not entail P(c) (in fact, it entails ¬P(c), which is true). So P(c) is a false consequence of T2, but not of T1.]

  Thus, we have:

    Truth-content(T1) has ¬P(c) which is not in Truth-content(T2).
    Truth-content(T2) has P(a) which is not in Truth-content(T1).

    Falsity-content(T1) has ¬(P(a)∧P(b)) which is not in Falsity-content(T2).
    Falsity-content(T2) has P(c) which is not in Falsity-content(T1).

  Therefore, no inclusion holds in either direction for either content.

  Thus, Popper's definition fails to declare T1 as having more verisimilitude than T2, even though intuitively it does.

  This is a concrete illustration of the Tichy-Miller problem.
answer: |-
  Below is a self-contained toy example designed to illustrate the Tichy-Miller problem with Popper's verisimilitude. I've crafted a fresh scenario involving **planetary orbits** to avoid overused examples. The domain is simple, the theories are intuitively comparable, and the calculations are explicit. I’ve structured it for clarity, so you can use it directly in your handout.

  ---

  ### **Toy Example: Planetary Orbits in a Tiny Solar System**
  **Domain**: A simplified solar system with only two planets, X and Y, orbiting a star. We care about two properties:  
  - Whether planet X orbits in **less than 200 days** (denoted \(X_{<200}\)).  
  - Whether planet Y orbits in **less than 300 days** (denoted \(Y_{<300}\)).  

  **Actual truth**:  
  - X orbits in 250 days → \(X_{<200}\) is **false**.  
  - Y orbits in 280 days → \(Y_{<300}\) is **true**.  

  **Possible states (worlds)**:  
  Since there are 2 binary properties, there are 4 possible worlds:  
  | World | \(X_{<200}\) | \(Y_{<300}\) | Description                     | Actual? |
  |-------|--------------|--------------|---------------------------------|---------|
  | \(w_1\) | True         | True         | Both fast orbits                | No      |
  | \(w_2\) | True         | False        | X fast, Y slow                  | No      |
  | \(w_3\) | False        | True         | X slow, Y fast                  | **Yes** (actual world) |
  | \(w_4\) | False        | False        | Both slow orbits                | No      |

  **Theories**:  
  - **Theory A**: "X is fast OR Y is slow" → \(X_{<200} \lor \neg Y_{<300}\).  
    - Allows worlds: \(w_1\) (T,T), \(w_2\) (T,F), \(w_4\) (F,F).  
    - **False** (excludes actual world \(w_3\)).  
  - **Theory B**: "X is fast AND Y is fast" → \(X_{<200} \land Y_{<300}\).  
    - Allows worlds: \(w_1\) (T,T).  
    - **False** (excludes actual world \(w_3\)).  

  **Intuition**:  
  - Theory A is *closer to truth*: It correctly says Y is fast (since "Y is slow" is false) but errs on X.  
  - Theory B is *farther from truth*: It falsely claims X is fast and ignores that Y’s speed is correct only by coincidence.  

  ---

  ### **Popper's Verisimilitude Setup**
  Popper defines verisimilitude using:  
  - **Truth-content** (\(CT_T\)): True logical consequences of the theory.  
  - **Falsity-content** (\(CT_F\)): False logical consequences of the theory.  
  Theory A has more verisimilitude than B iff:  
  > (i) \(CT_T(A) \supset CT_T(B)\) and \(CT_F(B) \supseteq CT_F(A)\), OR  
  > (ii) \(CT_T(A) \supseteq CT_T(B)\) and \(CT_F(B) \supset CT_F(A)\).  

  We now compute these sets for A and B.  

  ---

  ### **Step 1: Truth-Content and Falsity-Content**
  **Language**: Atomic propositions are \(X_{<200}\) and \(Y_{<300}\). Consequences include all logical combinations (e.g., \(X_{<200} \lor Y_{<300}\), \(\neg X_{<200}\), etc.).  

  **Key insight**:  
  - A **consequence** of a theory is a statement true in *all* worlds it allows.  
  - It is **true-content** if it holds in the actual world (\(w_3\): \(\neg X_{<200}, Y_{<300}\)).  
  - It is **falsity-content** if it fails in the actual world.  

  ---

  #### **Theory A** (Allows \(w_1, w_2, w_4\)):  
  - **Consequences**: Statements true in \(w_1\), \(w_2\), *and* \(w_4\).  
    - E.g., \(\neg Y_{<300} \lor X_{<200}\) (from A’s definition), \(\neg (\neg X_{<200} \land Y_{<300})\) (excludes actual \(w_3\)), etc.  
  - **Truth-content** (\(CT_T(A)\)): Consequences that are **true** in actual world \(w_3\):  
    - Example: \(Y_{<300} \lor \neg X_{<200}\) (true in \(w_3\) since \(Y_{<300}\) is true).  
    - **Critical true-consequence**: \(\mathbf{Y_{<300}}\) (true in \(w_1, w_2, w_4\)?  
      - \(w_1\): Y=true → ok.  
      - \(w_2\): Y=false → false! Not a consequence.  
    - *Actual true-consequences*:  
      - \(\neg X_{<200} \lor \neg Y_{<300}\) (false in \(w_3\)? No: \(\neg X_{<200}\) true, so whole statement true).  
      - \(\mathbf{\neg X_{<200}}\) (true in \(w_1\)? No (X=true). Not a consequence!).  
    - **Result**: \(CT_T(A)\) includes:  
      > \(Y_{<300} \lor \neg X_{<200}\),  
      > \(\neg (X_{<200} \land \neg Y_{<300})\) (equivalent to A),  
      > but *not* \(\neg X_{<200}\) or \(Y_{<300}\) alone.  

  - **Falsity-content** (\(CT_F(A)\)): Consequences **false** in actual world \(w_3\):  
    - Example: \(\mathbf{\neg Y_{<300} \lor \neg X_{<200}}\) (true in \(w_1,w_2,w_4\), but false in \(w_3\)?  
      - In \(w_3\): \(\neg Y_{<300}\) is false, \(\neg X_{<200}\) is true → whole statement true. Not false!  
    - **Critical false-consequence**: \(\mathbf{\neg (\neg X_{<200} \land Y_{<300})}\) (i.e., "not both X slow and Y fast").  
      - True in \(w_1,w_2,w_4\)?  
        - \(w_1\): X fast, Y fast → true.  
        - \(w_2\): X fast, Y slow → true.  
        - \(w_4\): X slow, Y slow → true.  
      - False in \(w_3\)?  
        - \(w_3\): \(\neg X_{<200} \land Y_{<300}\) is true → \(\neg(\text{true})\) is false. **Yes!**  
    - **Result**: \(CT_F(A)\) includes \(\neg (\neg X_{<200} \land Y_{<300})\) and others.  

  ---

  #### **Theory B** (Allows only \(w_1\)):  
  - **Consequences**: Statements true in \(w_1\) (both fast).  
  - **Truth-content** (\(CT_T(B)\)): Consequences true in actual world \(w_3\):  
    - Example: \(\mathbf{Y_{<300}}\) (true in \(w_1\) and true in \(w_3\)).  
    - \(\neg X_{<200}\)? False in \(w_1\) → not a consequence.  
    - **Result**: \(CT_T(B)\) includes \(Y_{<300}\), \(X_{<200} \lor Y_{<300}\), etc.  
  - **Falsity-content** (\(CT_F(B)\)): Consequences false in actual world \(w_3\):  
    - Example: \(\mathbf{X_{<200}}\) (true in \(w_1\), false in \(w_3\)).  
    - **Result**: \(CT_F(B)\) includes \(X_{<200}\), \(X_{<200} \land Y_{<300}\) (B itself), etc.  

  ---

  ### **Step 2: Compare Contents**
  We check if A has more verisimilitude than B by Popper's definition.  

  #### **Condition (i):**  
  - Is \(CT_T(A) \supset CT_T(B)\)?  
    - \(CT_T(B)\) contains \(\mathbf{Y_{<300}}\).  
    - Is \(Y_{<300} \in CT_T(A)\)?  
      - Theory A requires \(Y_{<300}\) true in \(w_1,w_2,w_4\). But \(w_2\) has \(Y_{<300}\) false → **no**.  
    - → \(CT_T(A)\) does *not* contain all true-consequences of B.  
  - Condition (i) fails.  

  #### **Condition (ii):**  
  - Is \(CT_T(A) \supseteq CT_T(B)\)?  
    - Same as above: \(Y_{<300} \in CT_T(B)\) but \(\notin CT_T(A)\) → **no**.  
  - Is \(CT_F(B) \supset CT_F(A)\)?  
    - \(CT_F(A)\) contains \(\mathbf{\neg (\neg X_{<200} \land Y_{<300})}\).  
    - Is this in \(CT_F(B)\)?  
      - Theory B allows only \(w_1\). Is \(\neg (\neg X_{<200} \land Y_{<300})\) true in \(w_1\)?  
        - In \(w_1\): \(\neg X_{<200}\) is false → \(\neg X_{<200} \land Y_{<300}\) is false → \(\neg(\text{false})\) is **true**.  
      - But \(CT_F(B)\) only contains statements *false* in actual world \(w_3\).  
      - \(\neg (\neg X_{<200} \land Y_{<300})\) is false in \(w_3\) → it *should* be in \(CT_F(B)\) if B entails it.  
      - **But B does not entail it**: In \(w_1\), it is true, but B doesn’t force it (e.g., B doesn’t entail anything about \(\neg X_{<200}\)).  
    - → \(\neg (\neg X_{<200} \land Y_{<300}) \notin CT_F(B)\).  
    - **Thus, \(CT_F(B)\) does not contain all false-consequences of A**.  
  - Condition (ii) fails.  

  ---

  ### **Conclusion: Verisimilitude Comparison Fails**
  - **Intuition**: A is closer to truth (it captures Y’s speed correctly and only errs on X).  
  - **Popper’s verdict**: Neither condition holds because:  
    - B has a "win" in truth-content: \(Y_{<300}\) is a true consequence of B but not of A.  
    - A has a "win" in falsity-content: \(\neg (\neg X_{<200} \land Y_{<300})\) is a false consequence of A but not of B.  
  - **Result**: Popper’s definition cannot declare A more verisimilar than B, despite intuition.  

  This mirrors the Tichy-Miller theorem: For *any* false theories, such "crossed" consequences exist, blocking a consistent comparison. The problem isn’t the example—it’s intrinsic to Popper’s definition.  

  ---

  ### **Why This Example Works for Students**
  1. **Concrete**: Worlds and consequences are explicit (no handwaving).  
  2. **Minimalist**: Only 2 planets/properties → small state space.  
  3. **Fresh domain**: Avoids weather/clichés, making the logic feel less "rigged".  
  4. **Step-by-step breakdown**: Shows exactly where the comparison derails (e.g., \(Y_{<300}\) missing in A’s truth-content).  

  You can extend this by asking students to try modifying Popper’s definition or explore alternative approaches (e.g., Schurz’s content-partitioning). The key is seeing how the theorem *bites* in practice.
