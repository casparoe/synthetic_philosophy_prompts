  Hmm... the key is recognizing that Spinoza's "normativity" isn't prescriptive but descriptive. When he says democracy is "most natural" or "most absolute," it's an engineering assessment of power dynamics, not moral endorsement. The user's phrase "cash that claim out through conatus and right-equals-power" nails it—I should expand precisely that linkage. 

