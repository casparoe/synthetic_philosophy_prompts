  ...Double-checking TTP Ch.16: yes, "most natural" contrasts with artificial concentration of power. And in Ethics, "useful" (utile) is power-enhancing. Democracy's "betterness" is literally its survival advantage. Should cite Letter 50 on freedom too? Maybe overkill—stay focused. 

