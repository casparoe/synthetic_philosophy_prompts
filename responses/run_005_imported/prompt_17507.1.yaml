  Their last question about "smuggling freedom" is sharp. Spinoza redefines freedom as acting from necessity of one's nature (E1D7). Democracy enables this by aligning individual/collective conatus through participation, unlike regimes where sovereign's nature conflicts with subjects'. No libertarian ghosts here. 

