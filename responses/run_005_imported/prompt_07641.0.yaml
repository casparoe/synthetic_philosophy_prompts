answer: |-
  This is a sharp question that cuts to the heart of why Joyce's generalization works and what makes it "non-pragmatic." Let's break it down intuitively:

  **Why the Generalization Works: The Power of Propriety & Convexity**

  Joyce's key move is imposing **strict propriety** and **convexity** on the inaccuracy measure (scoring rule). Here's why this salvages the domination result without relying on Euclidean geometry:

  1.  **Strict Propriety as Self-Recommendation:** A strictly proper scoring rule has this core feature: *If you have credence `P`, then `P` uniquely expects itself to be more accurate than any other credence function `Q`.* Think of it as epistemic self-endorsement. If you *truly* believe `P`, then based on `P`'s own expectations about the world, `P` looks like the best bet for accuracy. Any other `Q` looks worse *from `P`'s perspective*. This ties accuracy assessment directly to the credences themselves.

  2.  **Convexity & The "Blind Spot" of Incoherence:** Convexity of the inaccuracy measure (for each world) means that if you draw a straight line between two credence functions on an inaccuracy graph for a fixed world, the inaccuracy along that line is never *above* the straight line connecting the inaccuracy values of the endpoints. It ensures the "terrain" of inaccuracy has no unexpected bumps or pits.

  3.  **The Domination Mechanism:** Combine these with the *convexity of the set of coherent credences (prob. functions)*:
      *   Any incoherent credence `C` lies *outside* this convex set.
      *   Because the coherent set is convex, there exists a unique "projection" of `C` onto it – the coherent credence `P*` that is "closest" to `C` *in the sense defined by the strictly proper scoring rule*. (This "closeness" isn't Euclidean distance, but a divergence induced by the scoring rule).
      *   **Crucially, strict propriety forces `P*` to "pull" away from `C` in a specific way.** Because `P*` expects *itself* to be more accurate than `C` (strict propriety), and because the inaccuracy landscape is smooth (convexity), it turns out that `P*` isn't just better *in expectation according to `P*`*; it's actually better *in every single possible world* than `C` is.
      *   **Why?** Imagine `C` and `P*` facing a world `w`. The convexity of the scoring rule and the relationship between `C` and `P*` (stemming from `P*` being the "projection") mean that the improvement in accuracy you get by moving from `C` to `P*` in `w` is *at least* as large as the improvement `P*` *expects* to get by moving from `C` to itself. Because `P*` expects *some* improvement (strict propriety), and the convexity ensures this expected improvement translates into an *actual* improvement in every world, `P*` is guaranteed to be more accurate than `C` in `w`. This holds for every `w`.

  **Analogy (Geometric but Non-Euclidean):** Think of the coherent credences as a smooth, convex island (say, a dome). The incoherent `C` is somewhere in the water offshore. The strictly proper scoring rule defines a unique "downhill" direction from `C` towards the island, leading you straight to the closest point on the shore, `P*`. Crucially, the topography (defined by the convex scoring rule) is such that standing at `P*` puts you *lower* (more accurate) than `C` was *everywhere* – not just relative to `P*`'s location, but relative to *all possible locations* (`w`). `P*` dominates `C` globally because the path downhill from `C` to `P*` was universally beneficial.

  **Why is this "Non-Pragmatic"?**

  This is the crucial philosophical distinction:

  1.  **Dutch Book (Pragmatic):**
      *   **Problem:** Incoherence makes you vulnerable to a *financial loss*.
      *   **Vindication:** "You should be coherent *to avoid losing money*."
      *   **Epistemic Status:** It's about avoiding a practical, *extrinsic* bad consequence (poverty). It doesn't directly say anything about *why* having beliefs that match the world's state is good *epistemically*; it just shows that incoherence has a bad *practical* symptom.

  2.  **Accuracy Domination (Epistemic):**
      *   **Problem:** Incoherence makes your beliefs *less accurate* than some coherent alternative *no matter how the world turns out*.
      *   **Vindication:** "You should be coherent *because coherence is necessary to avoid your beliefs being strictly less accurate than some alternative, irrespective of the truth*."
      *   **Epistemic Status:**
          *   **Internal Goal:** It appeals directly to the purported *intrinsic, epistemic goal* of belief: accuracy, representing the world correctly. Accuracy is what beliefs *aim at* epistemically.
          *   **Guaranteed Failure:** Incoherence isn't just risky; it guarantees epistemic sub-optimality. There's *always* a strictly better (more accurate) coherent option available. Choosing incoherence is like choosing a strictly dominated strategy in a game where your sole goal is accuracy.
          *   **No Bets Involved:** The "domination" isn't about being exploited in a bet; it's about being strictly *worse at representing the truth* in every conceivable scenario. Worlds are considered as *epistemic possibilities* (ways the world could be), not as scenarios where bets are settled.
          *   **Geometry as Illustration, Not Foundation:** While geometric intuition helps, the core argument relies only on the properties of the accuracy measure (strict propriety, convexity) and the goal of accuracy. The Pythagorean analogy is a helpful model for the Brier score, but Joyce shows the *logic* of domination holds for *any* measure satisfying the core epistemic constraints on what makes a belief state better or worse vis-à-vis the truth.

  **In essence:** The Dutch Book argument says, "Be coherent or you'll lose your shirt." The Accuracy Domination argument says, "Be coherent because incoherent beliefs are *inherently defective* at their core epistemic job of matching the world; they are strictly less accurate than some coherent alternative in every possible state of affairs." The latter grounds the norm in the constitutive aim of belief itself (accuracy), not in the practical consequences of holding those beliefs.

  **For your term paper:** This tension between pragmatic and epistemic vindication is rich ground. You could explore:
  *   Whether "avoiding guaranteed inaccuracy" is *truly* non-pragmatic or just a different kind of pragmatism (e.g., achieving an internal goal).
  *   The significance of the choice of scoring rules and the robustness of the domination result under different sets of constraints (e.g., what if propriety is weakened?).
  *   Comparisons to other epistemic goals (e.g., minimizing worst-case loss, as in Minimax).
  *   Critiques of the "accuracy-first" framework itself (e.g., does it capture all epistemic values?).
  *   How this connects to the more general project of "epistemic consequentialism."

  The core intuition is that strict propriety and convexity lock the inaccuracy measure into a structure where the *only* way to avoid being pointlessly accuracy-dominated is to stay within the convex set of probability functions. It replaces the specific geometry of Pythagoras with the more general, goal-driven geometry of coherence defined by the aim of accuracy.
