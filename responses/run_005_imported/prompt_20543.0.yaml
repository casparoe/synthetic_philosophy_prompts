      "3": "Vicarious liability transfers compensatory obligation, not punishment, as damages in tort law primarily restore victims rather than penalize wrongdoers.",
      "4": "The whipping boy endures physical punishment (caning) meant for the prince, constituting a genuine transfer, but it is morally troubling due to the injustice of harming an innocent substitute.",
      "5": "The scapegoat ritual symbolically transfers guilt but inflicts no punitive suffering, as exile (without retributive intent) serves purification, not justice.",
