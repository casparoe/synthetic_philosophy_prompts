   1. Paying off someone else's court-imposed fine.
      - The fine is a financial penalty. By paying it, the payer is transferring the financial burden. However, the punishment (the fine) is being paid and thus discharged. The original offender does not have to pay, but the punishment is not being inflicted on the payer as a penalty for the crime (the payer is not being fined; they are voluntarily paying). In a sense, the financial burden is transferred, but the punishment (as a sanction) is being satisfied. However, note that the payer is not being punished by the court; they are merely covering the cost. Thus, it may not be a genuine transfer of the punishment but a transfer of the cost.

   2. A volunteer who serves someone else's prison sentence, with the court's approval.
      - The prison sentence is a punishment involving loss of liberty. The volunteer is serving the time in prison, which is the punishment. This is a transfer of the punishment to the volunteer. The court's approval makes it legally sanctioned. However, the volunteer is innocent. Is this morally acceptable? Many would find it troubling because an innocent person is suffering for another's crime.

   3. Vicarious liability in tort law: employer pays damages for employee's negligence.
      - The employer is held liable and pays damages. The punishment (if we consider the damages as a form of punishment) is being imposed on the employer. However, tort law is about compensation, not punishment (criminal law). The damages are meant to compensate the victim, not to punish the wrongdoer. Therefore, this is more of a transfer of liability (to pay compensation) than a transfer of punishment. Note: There might be punitive damages in tort, but the example specifies negligence, which typically is about compensatory damages. So, it's not a punishment transfer.

   4. The historical "whipping boy": a servant caned in the prince's place for the prince's misdeeds.
      - The prince was supposed to be punished by caning, but the servant is beaten instead. This is a physical punishment transferred to an innocent person. The servant is punished (beaten) for the prince's misdeed. It is a genuine transfer of punishment. Morally, it is troubling because an innocent person is being physically punished.

   5. The Yom Kippur scapegoat: the community's sins are ritually placed on a goat, which is then driven into the wilderness.
