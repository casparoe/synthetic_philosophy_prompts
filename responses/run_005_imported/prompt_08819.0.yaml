  ### Dialogue: The Trumping Preemption Puzzle

  **Characters:**  
  - **Lewisian (L)**: A counterfactual theorist, defending David Lewis's approach.  
  - **Woodwardian (W)**: An interventionist, working within James Woodward's framework.  

  **Setting:**  
  A philosophy seminar room after a talk on causation. Coffee cups clutter the table.  

  ---

  **L:** Let’s tackle Schaffer’s trumping preemption head-on. The soldiers advance because the senior officer shouts, not the junior. But counterfactual dependence fails: if the senior hadn’t shouted, they’d still have advanced (due to the junior), and vice versa. My tradition handles preemption with fragile events or intermediate chains—but here, no difference in outcome. So I appeal to *quasi-dependence*: the senior’s order is the primary source because the protocol makes it *dispositive*. The asymmetry comes from the *structural role* of rank in the system.  

  **W:** Structural role? That’s a bare stipulation. You’re encoding the verdict—"senior wins"—into your analysis. Lewisians did the same with time’s arrow: you tweaked the similarity metric over possible worlds to *make* causation asymmetric. Here, you’re tweaking "dependence" to favor rank. But that doesn’t *derive* asymmetry; it presupposes it.  

  **L:** Not so! The protocol isn’t arbitrary—it’s a law-like regularity. In closest worlds, we hold such laws fixed. If the senior *hadn’t* shouted, the soldiers *would* have advanced via the junior, preserving the protocol. But that doesn’t make the junior a cause. The senior’s order is *operative*; the junior’s is inert backup.  

  **W:** "Operative" is causal jargon. How do you ground "operativity" without circularity? Your "closest worlds" prioritizes worlds where the protocol isn’t violated, but *that’s the asymmetry you’re trying to explain*. It’s like saying, "The cause is the senior because we’ve rigged the metaphysics to favor him."  

  **L:** Fine—turn your interventionism on this case. Write a structural equation for the soldiers’ advance \(A\). How do you ensure the senior’s order \(S\) trumps the junior’s \(J\)?  

  **W:** Variables:  
  - \(S = 1\) (senior shouts), \(0\) (silent).  
  - \(J = 1\) (junior shouts), \(0\) (silent).  
  - \(A = 1\) (advance), \(0\) (hold).  

  The protocol dictates: when \(S = 1\), \(A\) obeys \(S\) regardless of \(J\). When \(S = 0\), \(A\) obeys \(J\). So:  
  \[ A = \begin{cases} S & \text{if } S = 1 \\ J & \text{if } S = 0 \end{cases} \]  
  Equivalently: \(A = S \lor (J \land \neg S)\). Testing by intervention:  
  - Fix \(J = 1\). Intervene to set \(S = 0\): \(A = J = 1\) (still advances).  
  - Fix \(S = 1\). Intervene to set \(J = 0\): \(A = S = 1\) (still advances).  
  But crucially, \(S\) screens off \(J\): when \(S = 1\), interventions on \(J\) don’t change \(A\). So \(S\) causes \(A\); \(J\) doesn’t.  

  **L:** You’ve baked the asymmetry into the equation! Why not \(A = J \lor (S \land \neg J)\)? That would make the junior trump. Your choice encodes "senior first" as a brute fact. Worse: interventions require manipulating \(S\) or \(J\) independently—but "independence" assumes no hidden causal links. Your framework *presupposes* causation to define interventions!  

  **W:** Independence isn’t causal—it’s modal. Interventions are idealizations: we imagine "wiggling" \(S\) without changing \(J\), via an exogenous force. Like a scientist controlling variables in a lab.  

  **L:** But in *this* case, "shouting" is simultaneous and governed by protocol. Your "exogenous force" must override the officers’ coordination—yet you assume it leaves the protocol intact. That’s circular! You’re sneaking in causal structure to police which interventions are "allowed."  

  **W:** Then let’s hear your alternative. How does Lewisian counterfactualism handle the asymmetry without stipulation?  

  **L:** I refine event fragility. The outcome isn’t just "advance," but "advance *in response to the senior’s order*." In worlds where the senior doesn’t shout, the advance depends on the junior—a *different* causal route. Counterfactual dependence holds between the senior’s order and *this specific outcome type*.  

  **W:** That’s cheating! You’re individuating events by their causes. "Advance via senior" vs. "advance via junior" presupposes the causal asymmetry. And in Schaffer’s case, the advance is token-identical: same soldiers, same time, same behavior. No difference to hang fragility on.  

  **L:** Then your turn: explain how testing by intervention works. What does "intervening on \(S\)" look like? You mute the senior mid-shout? But protocol binds the soldiers to rank *as they shout*. If you alter \(S\), you risk violating the protocol—which you hold sacred.  

  **W:** We intervene hypothetically: imagine a world where an external force (e.g., a gag) silences the senior, but the junior still shouts, and the protocol holds. Then \(A = 1\).  

  **L:** But if the soldiers see the gag, they might doubt the protocol! You’re smuggling in a *ceteris paribus* clause: "all else equal." But "equal" means "no side effects on the causal setup"—again, presupposing causation.  

  **W:** Then your similarity metric does the same! For counterfactuals like "If \(S\) hadn’t shouted...," you prioritize worlds where the protocol holds, \(J\) still shouts, and no miracles violate military law. That’s no less stipulative than my interventions.  

  **L:** Touché. But your structural equation still privileges \(S\) artificially. Why not add a variable for rank?  

  **W:** Let \(R = 1\) (senior), \(0\) (junior). Then:  
  \[ A = \begin{cases} S & \text{if } R = 1 \\ J & \text{if } R = 0 \end{cases} \]  
  Now \(R\) is a background constant. Interventions on \(S\) or \(J\) only affect \(A\) when their rank is active.  

  **L:** Now \(R\) is doing all the work! "Rank" is a causal primitive here. And interventions on \(R\)? If you set \(R = 0\) mid-scene, you’ve altered the protocol—which you can’t do without violating the system’s rules.  

  **W:** Exactly—so \(R\) is fixed. The asymmetry is built into the framework, just as your similarity metric builds in temporal asymmetry.  

  **L:** Then we’re both stuck. You say rank is fundamental; I say protocol is law-like. But neither reduces causation to non-causal facts.  

  **W:** Agreed. Interventionism exposes *how* causes work in a system, but it needs inputs like priority rules. Counterfactualism handles backtracking with similarity metrics, but they encode causal intuitions. Trumping preemption shows that both theories need primitive structure.  

  **L:** So we sharpen the dilemma: causation might be irreducible. Or perhaps "dispositive" facts ground the asymmetry. But then neither theory is reductive.  

  **W:** And that’s where we stand. My equations make the asymmetry precise; your counterfactuals track its contours. But neither derives it from scratch.  

  **L:** Until next time, then. Pass the coffee.  

  **W:** Only if you promise not to intervene on the sugar.  

  ---  
  **End of Dialogue**  

  ### Summary of Disagreement  
  - **Lewisian**: Counters interventionism’s "stipulative equations" by noting that interventions presuppose causal independence. Argues that refining event fragility or similarity metrics avoids bare stipulation but concedes that metrics may encode asymmetry.  
  - **Woodwardian**: Counters counterfactualism’s "rigged similarity" by showing structural equations clarify causal priority but admits that variables like rank are non-reductive.  
  - **Core Tension**: Both theories rely on primitive asymmetries (protocol/rank for Woodward, laws/similarity for Lewis). Trumping preemption reveals that neither reduces causation without residue.
