  Why does sample size cause divergence? In frequentist stats, larger n reduces standard error, making small effects statistically significant. But Bayesians compare the null and alternative hypotheses. The alternative prior is often spread out (diffuse), meaning it includes many possible effect sizes. As n increases, the data might support a very small effect, which the null (exactly zero) can explain better than a diffuse alternative that includes many larger effects. So, the null gets higher posterior probability even if the effect is statistically significant.

