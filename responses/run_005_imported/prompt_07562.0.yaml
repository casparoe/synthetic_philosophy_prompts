prompt: |-
  Quick one for you – I'm building a problem set on moral worth and I don't want the obvious 'Huck Finn refutes Kant's motive-of-duty requirement' essay, my students could write that one in thier sleep by now. Give me an argument for something harder: that Markovits's coincident reasons thesis, despite being pitched as the fix that finally lets someone like Huck get full moral credit without acting from duty, actually can't deliver that verdict — because Huck's motivating reason (his felt attachment to Jim) doesn't coincide in content with whatever reason actually justifies freeing Jim (Jim's standing as a rights-bearing person). So Markovits is stuck: either 'coincide in content' gets loosened until her view just collapses into Arpaly's responsiveness account, or she has to concede Huck comes up short on her own picture too. Push that dilemma as hard as you can, and take on the obvious reply that counterfactual robustness, not exact conceptual match, is what's really doing the work for her.
