answer: |-
  That's an impressive intellectual journey! Arriving independently at Strawson's "Basic Argument" demonstrates deep reflection. Let's break down the reasoning behind your two puzzles:

  **1. Why Indeterminism Doesn't Help (The "Pure Chance" Problem):**

  Strawson's core insight is that *ultimate* responsibility (being the true, buck-stopping author of your actions) requires *causal ultimacy* regarding your character/motivational structure. The argument highlights an infinite regress problem: to be responsible for *how you are* at stage N, you must have chosen to be that way at stage N-1. But that choice at N-1 flowed from *how you were* at stage N-2, and so on, back to your genetic makeup, early environment, and initial conditions over which you had zero control.

  Introducing indeterminism (genuinely random events) into this chain doesn't solve the ultimacy problem; it arguably makes it worse:

  *   **Randomness ≠ Control/Authorship:** If a crucial link in the chain leading to your character or a specific choice is *undetermined* (i.e., random), this doesn't mean *you* controlled it. It just means it happened without a sufficient cause. How does a random quantum fluctuation in your brain, or an uncaused event, make *you* the *author* of the resulting state? You didn't *decide* the randomness; you were just its locus. Chance events are things that *happen to you*, not things *you do*.
  *   **No Escape from the Regress:** Imagine an undetermined event occurs during some "self-shaping" act. Why did *that* undetermined event happen *then*? Why did it result in *that* specific character trait rather than another? If it's truly random, there's no answer – it just happened. If it's influenced by prior states, then we're back to the regress (the prior states weren't ultimately chosen). The randomness itself isn't something *you* authored or could be responsible for.
  *   **Responsibility Requires Determination (of a sort):** For an action to be *attributable* to *you* as an agent, it generally needs to flow from *your* reasons, desires, and character in a reliable way. Indeterminism, by introducing randomness, potentially *severs* the connection between "you" (your prior state) and the action. If the action isn't sufficiently caused by *your* character/psychology, how is it *your* action for which *you* are responsible? It becomes more like a spasm or an external intrusion.
  *   **The Luck Problem:** Indeterminism magnifies the problem of luck. If a random event tips you towards becoming (or acting) bravely rather than cowardly, why are you praiseworthy for the bravery? You just got lucky with the coin flip in your brain. True responsibility requires that the outcome wasn't just a matter of luck, but indeterminism injects luck directly into the core of agency.

  **In essence:** Determinism shows your character/actions are the inevitable consequence of unchosen prior causes. Indeterminism shows your character/actions are the result of unchosen prior causes *plus* uncaused (and therefore uncontrolled) random events. Neither scenario provides the *causal ultimacy* or *self-creation ex nihilo* required for ultimate moral responsibility. Chance doesn't create authorship; it negates deterministic chains but introduces arbitrariness instead of control.

  **2. Why Strawson Doesn't Advocate for Reform:**

  Strawson's stance here is nuanced and distinct from "hard incompatibilists" like Derk Pereboom or Gregg Caruso. His reasons are primarily philosophical and practical:

  *   **Distinguishing Metaphysical Truth from Social Practice:** Strawson sees the Basic Argument as demonstrating a *metaphysical impossibility* (Ultimate Moral Responsibility cannot exist). However, he doesn't necessarily conclude that our *concepts* of praise, blame, resentment, gratitude, etc., are therefore invalid or must be abolished. He might view them as part of a different, non-metaphysical framework.
  *   **Naturalism & Reactive Attitudes:** Following P.F. Strawson (his father), Galen Strawson likely sees our practices of holding responsible as rooted in deep, natural, human "reactive attitudes" – resentment, indignation, gratitude, forgiveness, etc. These attitudes are psychologically fundamental to human social interaction. The Basic Argument attacks a *philosophical justification* for these attitudes (Ultimate Moral Responsibility), but it doesn't necessarily eradicate the attitudes themselves or prove the practices built on them are *practically* unjustifiable or harmful. They serve social functions (regulation, cohesion, expression) that exist independently of their ultimate metaphysical grounding.
  *   **Practical Impossibility & Focus:** Strawson might argue that even if we intellectually accept the Basic Argument, we cannot *live* as if reactive attitudes and practices of holding responsible don't exist. They are too deeply ingrained in human psychology and social life. Trying to eliminate them wholesale might be psychologically impossible and socially destabilizing, even if metaphysically justified. His focus is often on exposing the *conceptual impossibility* of UMR, not on prescribing a social revolution he sees as unfeasible or disconnected from how humans actually function.
  *   **Targeting the Justification, Not Necessarily the Practice:** Strawson's primary target is often the *retributive* justification for punishment and blame – the idea that people *fundamentally deserve* suffering or reward *just because* of their ultimate authorship. He might be more open to consequentialist justifications (deterrence, rehabilitation, protection, moral education) or expressive justifications (communicating societal norms, validating victims) for practices that *look like* praise and blame, even without UMR. He attacks the *desert* based on UMR, not necessarily all forms of social response to behavior.
  *   **Emphasis on the Argument's Simplicity & Power:** Strawson often presents the Basic Argument as so logically compelling regarding UMR that the focus should be on accepting its conclusion, not necessarily on its immediate practical fallout. He might see the practical implications as complex, secondary, or even tangential to the core metaphysical point he wants to establish.

  **In essence:** Strawson separates the *metaphysical truth* (UMR is impossible) from the *practical reality* (human social life runs on reactive attitudes and practices of holding responsible). He doesn't believe the truth of the former automatically invalidates the latter or makes abolishing it desirable or feasible. His work focuses relentlessly on establishing the first point, largely leaving the practical consequences for others to debate, while implicitly or explicitly suggesting that our practices can be reconceived or justified on non-retributive grounds even without UMR.

  Your grasp of the core argument and identification of these key tensions is excellent. Strawson's positions on both points are controversial but represent a rigorous and internally consistent approach focused on the fundamental metaphysics of agency, deliberately sidestepping the practical/political debates that often dominate free will discussions.
