prompt: |-
  I'm taking a bioethics seminar on death, dying, and organ transplantation this term, and for our capstone project I'm recording a podcast-style interview with a bioethicist who has built her career defending the whole-brain criterion of death. Her standard move whenever Alan Shewmon's cases of prolonged, ventilator-supported somatic survival after a whole-brain-death diagnosis come up is to insist that what's doing the integrating in those bodies is the machinery, not the organism. Please draft eight interview questions that make that move progressively harder to sustain: I want at least one question asking why the same "artificial" label shouldn't apply to any ventilator-dependent patient we'd otherwise call alive, one on whether the President's Council on Bioethics' 2008 retreat from "integrative unity" language to talk of the organism's need to engage the world to sustain itself was itself a concession that the original rationale had failed, and one on why the short, variable waiting periods used in donation-after-circulatory-death protocols don't quietly redefine "irreversible" loss of circulation as merely "permanent" loss. End on a question about what finding, short of a revived corpse, would actually count as evidence against the whole-brain criterion. For each question, add a follow-up keyed to the deflection she's most likely to reach for.
reasoning: |-
  Okay, the user is preparing for a bioethics capstone project—a podcast interview with a bioethicist who defends the whole-brain criterion of death. They want to challenge her standard response to Alan Shewmon's cases, where she dismisses somatic survival as machine-driven integration. The user needs eight progressively tougher questions with strategic follow-ups targeting her likely deflections.  

  Hmm, the core tension here is ontological: what constitutes "genuine" biological integration versus "artificial" support? The bioethicist's go-to move—attributing integration to machines—seems fragile when scrutinized. The user explicitly wants three specific angles covered: ventilator dependence as artificiality continuum, the President’s Council’s rhetorical shift, and DCD protocols redefining irreversibility. They also want a knockout question about falsifiability.  

  First, I’ll tackle the ventilator dependency equivalence. If machines "replace" integration in brain-dead bodies, why isn’t every ICU patient equally artificial? The follow-up must preempt the "but the brain!" deflection by forcing her to define integration without presupposing neurological function.  

  Next, the 2008 President’s Council pivot from "integrative unity" to "engagement with environment." That’s a glaring retreat—almost an admission the original standard couldn’t handle Shewmon. The follow-up should corner her into conceding either conceptual failure or ad hoc patching.  

  For DCD protocols, the sleight of hand is linguistic: "irreversible" becomes "we won’t revive" (permanent). The follow-up needs to expose how this smuggles in a social decision masquerading as biological fact.  

  Endgame: what could falsify whole-brain death? If not Shewmon’s cases, then only literal resurrection? The follow-up should challenge whether the criterion is even testable.  

  Other questions will bridge these—escalating from organismic agency to homeostasis without machines—to make the "machines do it" claim absurd. Each follow-up is a trap: she can’t invoke brain function without circularity or concede exceptions that unravel her position.  

