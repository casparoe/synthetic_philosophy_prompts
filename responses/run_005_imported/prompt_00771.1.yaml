answer: |-
  This is an incredibly sophisticated passage from Bentham, dissecting the psychological roots of moral condemnation with remarkable insight for his time. Let's break down the logic step-by-step and address your specific questions:

  **Bentham's Core Argument (Step-by-Step):**

  1.  **The Disconnect:** Bentham observes that the punishment of "offences" like homosexuality arises not from demonstrable harm, but purely from **"antipathy"** (disgust, revulsion) felt by those in power.
  2.  **Physical Antipathy ≠ Moral Wrong:** He identifies the primary source: **"physical antipathy to the offence"** (disgust at the *idea* of gay sex). He argues this disgust is *irrelevant* to morality:
      *   *Analogy:* Just because someone finds eating carrion disgusting doesn't mean it's immoral for others who enjoy it. "He has the same reason for doing it that I have for avoiding it."
  3.  **The Confusion:** However, people consistently fail this logical test. They have a strong, irrational tendency to **"confound physical impurity with moral"** impurity. Disgust (physical reaction) gets mislabeled as immorality (moral judgment).
  4.  **Intolerance Amplified:** This confusion fuels intolerance. From personal aversion, it's a "natural" (though illogical) step to wish punishment on others who engage in the act: **"Any pretence, however slight... is eagerly embraced."**
  5.  **Pride & Hurt Feelings:** Why is this confusion so potent? Because differences in taste/opinion wound our **"sympathetic feelings"** and **"pride."** We take disagreement personally. *This is the core psychological mechanism.*
  6.  **Example: James I (Answering your Q1):**
      *   **Purpose:** Bentham uses James I as a vivid, historical case study to prove points 4 & 5.
      *   **Anabaptists:** James I felt intense *antipathy* (disgust/anger) towards Anabaptists due to *differences in religious opinion*. This wounded his pride/authority. When circumstances allowed (religious persecution was accepted), he acted on his antipathy by **burning them**.
      *   **Tobacco:** James I also felt intense *physical antipathy* (disgust) towards tobacco. *The same psychological mechanism was at play* – it offended his taste/opinion. **BUT,** social norms didn't sanction burning tobacco smokers. So, lacking a "pretext" and "facility," he could only **write an angry book**.
      *   **Proof:** This comparison proves:
          *   The *intensity* of condemnation/punishment stems from the *strength of the antipathy* (whether religious disgust or sensory disgust), not the inherent harm.
          *   The *form* punishment takes (burning vs. ranting) depends entirely on *social/political opportunity*, not the nature of the act.
          *   Disagreement (on theology or taste) feels like a personal affront, provoking a punitive urge.
      *   **The Pardon Joke:** Bentham sarcastically notes James I listed offenses "no Sovereign ever ought to pardon," likely including sodomy. Bentham implies James might himself have needed such a pardon, highlighting the hypocrisy and arbitrariness – the "offence" is defined by the powerful person's personal disgust, not objective harm.
  7.  **"Philosophical Pride" (Answering your Q2):**
      *   **Who:** Bentham targets a broad class of moralists/philosophers, particularly:
          *   **Ascetics/Stoics:** Thinkers (like some interpretations of the Stoics, or religious ascetics) who view pleasure, especially intense physical pleasure, with deep suspicion, associating it with weakness, loss of control, or sin. Pleasure is seen as something to be mastered or denied, not embraced.
          *   **Certain Religious Moralists:** Those who frame morality as obedience to divine law where pleasure is secondary or even sinful if not procreative/within strict bounds.
          *   **Kantian Deontologists (by implication):** While Kant was contemporary, Bentham would likely include any moral system that prioritizes abstract duty, rules, or "purity" over happiness/pleasure as consequences. Systems where "duty for duty's sake" overrides well-being.
      *   **The Mechanism:** "Philosophical pride" refers to the intellectual arrogance of building moral systems that:
          *   **Quarrel with Pleasure (Self):** Tell people they *shouldn't* enjoy certain pleasures, even harmless ones, simply because they *are* pleasures ("merely because we ought").
          *   **Quarrel with Others' Pleasure (Envy):** Disposition others to condemn pleasures enjoyed by others ("envy will always be disposing them to quarrel with what appears to be pleasurable to others").
      *   **The Point:** This philosophical stance *facilitates* the confusion. If pleasure itself is morally suspect, then it's easier to condemn acts *because* they are pleasurable (especially intensely so), further justifying the leap from physical disgust to moral condemnation.
  8.  **The Crux: "It is not the pain that angers them but the pleasure" (Answering your Q3):**
      *   **Meaning:** Bentham argues that the true source of anger and moral outrage directed at acts like homosexuality isn't any actual *harm* ("pain") they cause to others or society. He explicitly states earlier he finds no real harm.
      *   **The Real Trigger:** What truly angers the condemners is the very fact that the participants **derive intense pleasure** from an act that the condemners find disgusting or philosophically/morally objectionable.
      *   **Why?** This pleasure is offensive because:
          *   It contradicts the condemner's own disgust/aversion.
          *   It challenges their philosophical belief that such pleasures *shouldn't* be enjoyed or are base.
          *   It potentially evokes envy ("why do *they* get to enjoy this forbidden thing?").
          *   It feels like a personal affront to their worldview and sensibilities (linking back to wounded pride).
      *   **In essence:** The moralizers are angered not by suffering, but by *happiness* achieved in a way they disapprove of. The pleasure *itself* is the provocation.

  **Does Bentham's Theory Hold Up? Modern Perspectives:**

  Bentham's analysis is **strikingly prescient** and aligns well with modern understandings of moral psychology:

  1.  **Moral Disgust & Purity:** Psychologists like Jonathan Haidt (Moral Foundations Theory) explicitly identify **Purity/Sanctity** as a core moral foundation. Violations trigger disgust, which is readily **"moralized"** – transformed into a judgment of *wrongness*. Bentham perfectly identified this "confounding" of physical disgust with moral impurity centuries before empirical research confirmed it.
  2.  **Harm Principle vs. Disgust:** Bentham champions the **Harm Principle** (only preventing harm justifies interference) long before Mill formalized it. Modern liberal ethics strongly supports this. He correctly identifies that much condemnation stems from non-harm-based feelings like disgust.
  3.  **Motivated Reasoning:** His point about people eagerly embracing "any pretence" to justify punishing what disgusts them aligns perfectly with modern concepts of **motivated reasoning** – we find reasons to support what we already feel.
  4.  **Identity and Morality:** His observation about differences in taste/opinion wounding pride and feelings resonates with the idea that morality is often tied to **group identity** and **social cohesion**. Condemning outgroups reinforces ingroup values.
  5.  **Envy and Schadenfreude:** His mention of envy as a factor in condemning others' pleasure is well-supported by psychology.
  6.  **Critiques/What He Might Miss:**
      *   **Internalized Norms:** While he focuses on external condemnation, he gives less emphasis to how social disgust can become **internalized**, causing shame and psychological harm *to the individuals* engaging in the act, even if no external punishment occurs.
      *   **Social Function of Taboos:** Anthropologists might argue that disgust-based taboos *can* sometimes serve social functions (e.g., hygiene taboos, kinship rules), though these functions are often post-hoc justifications and don't justify applying them to harmless consensual acts like homosexuality. Bentham might underplay how deeply ingrained these social functions *feel*.
      *   **Complexity of Disgust:** Modern research shows disgust is complex, involving core disgust (rotting food), animal-reminder disgust (sex, death), and interpersonal disgust (outgroups). Bentham focuses primarily on the first two in relation to sex acts.
      *   **Power Dynamics:** While he notes "persons who had punishment at their disposal," he could delve deeper into how disgust is weaponized by dominant groups to maintain power and suppress minorities, not just as a personal quirk. Foucault's later work on sexuality and power builds on this terrain.

  **Conclusion:**

  Bentham's analysis is remarkably astute. He correctly identifies the core problem: moral condemnation of harmless acts like homosexuality primarily stems from **personal disgust ("physical antipathy") being irrationally confused with moral wrongdoing**, fueled by **wounded pride** at differing tastes/opinions and amplified by **philosophical systems suspicious of pleasure**. His observation that condemners are often angered **by the pleasure itself**, not any actual harm, is profound and aligns with modern psychological understandings of moralization and motivated reasoning.

  His theory holds up exceptionally well as an explanation for the *psychological origins* of disgust-based moral condemnation. While modern psychology adds nuance (internalization, different types of disgust, social functions), Bentham laid out the fundamental mechanism with stunning clarity decades before anyone dared voice such ideas publicly. He wasn't just defending gay sex; he was exposing a fundamental flaw in how humans often make moral judgments.
