answer: |-
  Your proposed separation between Sidgwick's philosophical work and his psychical research is **problematic and not well-supported by historical scholarship.** While it's understandable to want clear categories, historians of philosophy and the SPR consistently emphasize a **deep and essential connection** between Sidgwick's ethical concerns and his psychical research.

  Here's why presenting them as distinct "personal enthusiasms" is inaccurate and misses the core motivation:

  1.  **The Dualism Wasn't Fully Resolved:** While Sidgwick *argued* in *Methods of Ethics* that the only way to reconcile rational egoism and utilitarianism (rational benevolence) was through theological assumptions (a divine being ensuring harmony, often linked to personal immortality and posthumous rewards/punishments), he was profoundly **dissatisfied** with this conclusion. He found it intellectually precarious to base ethics on unproven theological postulates. His resolution was logical *within the system* but rested on foundations he felt were empirically unjustified.
  2.  **Psychical Research as the Empirical Test:** Sidgwick explicitly saw psychical research as the potential **empirical pathway** to resolve the dualism that his philosophical reasoning couldn't definitively settle. If rigorous scientific investigation could provide evidence for:
      *   **Personal Survival After Death:** This would directly support the theological postulate (immortality) needed for his ethical reconciliation.
      *   **Communication with the Dead:** This could potentially reveal a moral order in the universe where virtue was rewarded and vice punished, aligning self-interest and duty.
      *   **Telepathy/ESP:** Evidence for non-physical connections between minds could challenge purely materialistic views of the universe, making survival more plausible and potentially revealing a deeper unifying principle.
  3.  **Sidgwick's Own Words and Motivations:**
      *   He famously stated his hope that psychical research might provide "a basis for a religious belief or at least for belief in a moral order of the world." This directly addresses the core problem of the dualism.
      *   In letters and discussions with colleagues like Frederic Myers and Edmund Gurney (other SPR founders), he repeatedly linked the SPR's work to the fundamental ethical questions that troubled him.
      *   His involvement wasn't casual curiosity; it was a decades-long, rigorous (if ultimately frustrating) quest driven by a profound philosophical need. He invested immense time and energy, applying his characteristic analytical rigor to a field he hoped would provide the missing empirical piece for his ethical system.
  4.  **Historiographical Consensus:**
      *   **Bart Schultz (Biographer):** In *Henry Sidgwick: Eye of the Universe*, Schultz meticulously documents how the unresolved tension of the dualism was the *primary* driver of Sidgwick's psychical research. It wasn't a hobby; it was an essential extension of his philosophical project.
      *   **Alan Gauld (SPR Historian):** In *The Founders of Psychical Research*, Gauld emphasizes that Sidgwick, Myers, and Gurney were fundamentally motivated by the crisis of religious belief and the search for a new foundation for ethics and meaning in a post-Darwinian, increasingly secular world. Sidgwick's ethical concerns were central to this.
      *   **C.D. Broad & Others:** Philosophers examining Sidgwick's work consistently note the link. Broad saw psychical research as Sidgwick's attempt to find "empirical verification" for the postulates required by his ethics.

  **How to Frame it Accurately in Your Article:**

  Instead of separating them, present the psychical research as **the practical, empirical pursuit driven directly by the unresolved tension in his philosophical masterpiece.**

  *   "While Sidgwick presented a theoretical resolution to the 'dualism of practical reason' in *The Methods of Ethics* by invoking theological postulates, he remained deeply troubled by the lack of empirical evidence for those postulates. It was this profound philosophical dissatisfaction that led him, in the 1880s, to co-found the Society for Psychical Research. He saw the rigorous investigation of phenomena like telepathy and survival after death as a potential pathway to finding the empirical proof needed to securely ground his ethical system, transforming a philosophical postulate into a demonstrable truth."
  *   "Sidgwick's co-founding of the SPR was not merely a personal diversion but a direct consequence of his deepest philosophical concern: the 'dualism of practical reason.' Hoping to find empirical evidence for survival or a moral order in the universe that would reconcile rational self-interest with utilitarian duty, he turned to psychical research as the necessary next step beyond pure philosophical argument."

  **In Conclusion:**

  Historians of philosophy overwhelmingly see Sidgwick's psychical research as **intimately connected to and fundamentally motivated by** his central ethical project, particularly the unresolved anxiety surrounding the dualism of practical reason. Presenting it as a distinct "personal enthusiasm" significantly misrepresents his motivation and diminishes the profound philosophical seriousness with which he approached the SPR's work. His psychical research *was* his attempt to find the empirical foundation his ethical system demanded.
