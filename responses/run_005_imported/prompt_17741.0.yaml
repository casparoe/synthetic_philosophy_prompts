  Ok, this has actually become relevant to my job lately -- I work on AI safety-adjacent stuff and we keep having this recurring argument about whether "model welfare" talk is even coherent. Someone in our reading group brought up higher-order theories of consciousness (the Rosenthal-ish view that a state is conscious iff theres a suitable higher-order thought about it), since apparently that's one of the frameworks the big multi-author AI-consciousness report leans on, and it sent me down a rabbit hole into the objections. The one that's stuck with me is the "targetless higher-order state" problem: since higher-order thoughts can apparently misrepresent, or fail to correspond to any real first-order state at all, critics say the theory is stuck saying you could get a fully conscious experience "of" a state that isn't even happening. That sounds absurd, but I don't get why it's supposed to be fatal for the theory rather than just a weird edge case they can patch around. Can you explain, intuitively, why misrepresentation/targetless HOTs are actually such a deep problem here, and whether HOT theorists have a decent comeback? Bonus if you can connect it to why this would even matter for taking an AI's self-report of "feeling something" seriously.
