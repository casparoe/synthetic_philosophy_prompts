  I recall Armstrong admits his "state of affairs" is primitive, which perfectly illustrates the issue. Russell's distinction between relating/related seems almost question-begging. Frege's chemical metaphor of saturation may not withstand ontological scrutiny. 

  The physicist's demand for "independent content" is key. In physics, forces are explained via mathematical structures; here the philosophical terms lack analogous grounding. I'll structure the argument to show each solution:
