  The user's physics background is crucial here. They're drawing an analogy to how "force" would be unacceptable in physics without mechanistic explanation - a powerful critique from someone who understands explanatory depth. Their request is very specific: build the strongest case that these three proposals don't solve the regress but merely halt it by decree, examining each separately.

