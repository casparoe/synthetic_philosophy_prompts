  Also, practical aspects: testing cortical activity directly isn't straightforward. EEGs can be unreliable due to drugs or hypothermia, leading to false positives or negatives. Brainstem tests are more reliable and quick. Plus, legal standards require irreversible cessation of all brain functions, including the brainstem. 

