prompt: |-
  So I've been down a YouTube rabbit hole on this 'free energy principle' thing (the Karl Friston idea that the brain's basically just a machine for minimizing surprise/prediction error), and something's been bugging me about it. If that's really all the brain is optimizing for, wouldnt the smartest possible move be to just sit in a pitch black, silent room forever, since nothing happening means nothing to predict wrong? But it's the total opposite for me, if I sit in a quiet room too long doing nothing I feel awful, I want new stuff happening, new places, new people, even scary movies. Am I missing something here, or does the fact that brains clearly crave novelty instead of boredom basically break the whole theory?
