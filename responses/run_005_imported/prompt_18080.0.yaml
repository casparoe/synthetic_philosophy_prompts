  The money/gender contrast is particularly thorny. Searle would say a dollar bill's "Y status" requires no oppression, just collective intentionality. Haslanger would counter that gender's "social position" inherently references power differentials. Neither seems reducible to the other - like comparing chess rules to caste systems. 

