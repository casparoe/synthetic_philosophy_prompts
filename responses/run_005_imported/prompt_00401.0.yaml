  So there's this experimental "instant travel" pod that just opened near my town for a science expo, and the way it works is kinda freaky when you think about it — it scans every atom in your body, sends the info somewhere else, and builds an exact copy of you there (same memories, personality, everything), but the original you gets destroyed in the process. The scientists keep saying "dont worry, its just like teleporting, the person on the other end IS you," but something about that doesnt sit right with me. Like if the old body is gone and theres just a copy walking around who *thinks* they're me, is that actually me surviving, or did I just die and some new person got my memories? My friends think im overthinking this and that it's basically no different than falling asleep and waking up. Am I wrong to be freaked out about stepping into this thing?
