prompt: |-
  I'm a PhD student in philosophy drafting part of a seminar paper on Bernard Williams's internalism about practical reasons, and I'd like an outside read before I take it further. The section below responds to John McDowell's well-known objection, in "Might There Be External Reasons?" (1995), that Williams's notion of a "sound deliberative route" is too narrowly instrumental to rule out external reasons. Here is the section:

  Williams's 1979 case against external reason statements rests on what I'll call the explanatory constraint: a reason statement earns its keep only if it can figure in an intelligible account of an agent's coming to be motivated. An internal reason statement satisfies this automatically, since it is true only if there is a sound deliberative route from some element of the agent's subjective motivational set, S, to the relevant action. Williams's challenge to the external reasons theorist is to explain what could make an external reason statement true given that, by hypothesis, its truth does not depend on anything already in S. His diagnosis is that any story about an agent coming to be moved by such a reason will end up smuggling in some element of S after all — a standing concern to be rational, a susceptibility to argument, a latent capacity for sympathy — at which point the "external" reason has quietly become internal relative to that element, and the externalist's original claim has lost its content.

  McDowell's reply — that Williams's "sound deliberation" is instrumental reasoning by another name, and so cannot capture cases in which coming to appreciate a reason (say, through the acquisition of virtue) is not a matter of tracing out what was already implicit in one's antecedent concerns — is usually treated as the live alternative to Williams's picture. I want to suggest the exchange is less substantive than it looks, because of a concession Williams is both willing and, on his own terms, obliged to make: S can contain not just first-order desires and projects but general, largely dispositional capacities — for sympathy, for imaginative identification with others, for being struck by considerations one had not previously weighed. Once S is stocked this generously, there is no case McDowell wants to describe as recognition of an external reason that cannot be redescribed, without strain, as the sound deployment of some such standing capacity. An unsympathetic husband can be told he has reason to be kinder to his wife not because kindness answers to some specific desire he already owns, but because ordinary human beings have a capacity for sympathetic response that correct deliberation could engage — and that, on Williams's own terms, is enough to make the reason internal.

  This generosity, though, is not free. The internal/external distinction was supposed to explain why we can withdraw a reason claim about a committed amoralist — someone for whom, ex hypothesi, no deliberative route from anything in S leads to the relevant motivation — while an externalist supposedly could not. But if merely possessing the general human capacities suffices to seed S, then only a fairly exotic incapacity, rather than mere unwillingness or a differently ordered set of concerns, will ever let an agent escape the reach of internal reasons — and the distinction stops tracking the cases it was invented for. The obvious repair is to individuate S more finely, requiring not just possession of a capacity but its being already "engaged" in some more specific sense; but this turns "engagement" into exactly the question the amoralist case was meant to settle, without supplying any independent criterion for answering it. My tentative conclusion is that the Williams–McDowell debate, staged this way, occupies an unstable middle position: generous enough about S to win every hard case, but not principled enough about what that generosity excludes to preserve the distinction's original point.

  I'd welcome comments along three lines: first, whether I'm being fair to both Williams and McDowell here, or have flattened one of them in a way that loses its real force (I'm particularly unsure whether my gloss on McDowell does justice to the "second nature" idea behind it); second, whether the trivialization objection in the final paragraph actually succeeds, or whether there's a principled, non-question-begging way for an internalist to individuate S that would block it; and third, whichever step in the argument you'd press hardest on if you were refereeing this for a workshop.
reasoning: |-
  Okay, the user is a PhD student in philosophy working on Bernard Williams's internalism about practical reasons, specifically addressing John McDowell's objection. They've shared a section of their seminar paper and want feedback on fairness to both philosophers, the trivialization objection, and which argument step to focus on.

  First, I need to unpack their argument. They argue that Williams's "generous" interpretation of the subjective motivational set (S) can co-opt McDowell's virtue-based reasons by including capacities like sympathy. But this generosity risks trivializing the internal/external distinction, especially regarding amoralists. The user questions if Williams can individuate S without begging the question.

  Hmm, the user seems concerned about accurately representing McDowell's "second nature" concept. They mention possibly flattening it. McDowell's point isn't just about capacities but how virtue transforms perception through Bildung—something innate capacities alone might not capture. The user might be underemphasizing this transformative aspect.

  The trivialization objection is central. If S includes latent capacities, almost everyone has internal reasons, making the amoralist inconceivable. But Williams might counter that capacities must be *exercisable* via deliberation, not merely possessed. The user's challenge about "engagement" criteria is spot-on—Williams needs a non-question-begging way to exclude the amoralist.

  For the refereeing point, the weak link is whether Williams's deliberative routes can handle non-instrumental recognition. McDowell's virtue example involves perceiving reasons directly, not deriving them from existing desires. The user should strengthen how their "generous S" addresses this perceptual shift versus Williams's deliberative framing.

  The user's deeper need might be to position their original contribution: showing the debate's instability. They should clarify why their conclusion matters—perhaps revealing a meta-philosophical point about reason statements' explanatory roles. I should encourage them to leverage Williams's later work (e.g., "Acting as the Virtuous Person Acts") where he engages virtue ethics, which might offer resources or admissions of limitations.
answer: |-
  This is an excellent piece of philosophical writing: clear, precise, dialectically sharp, and tackling a core tension in a major debate. Your central argument about the "unstable middle position" is compelling and original. Here’s a detailed response addressing your three requests:

  1.  **Fairness to Williams and McDowell:**
      *   **Williams:** Your portrayal is largely accurate and charitable. You correctly identify his core "explanatory constraint" and his strategy of "smuggling in" elements of S. Your "generous" reading of S (including capacities) is well-supported by Williams’s own texts (e.g., *Internal and External Reasons*, where he explicitly mentions "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent"). You capture his willingness to expand S beyond crude desires.
      *   **McDowell:** This is where your gloss risks some flattening, specifically regarding **"second nature."** You rightly focus on the *acquisition* of virtue via capacities in S. However, McDowell’s deeper point about "second nature" is that virtue fundamentally *alters how the world appears* to the agent – it’s not merely activating a latent capacity *within* a pre-existing framework of concerns. Virtue, once acquired, allows the agent to *directly perceive* reasons (e.g., the *need* for kindness) as *demands*, not as conclusions derived *from* antecedent concerns like sympathy. The reason is apprehended as external to the agent's *prior*, unvirtuous motivational set, even if the *capacity* to acquire the virtue was latent. Your redescription ("sound deployment of a standing capacity") might seem to McDowell like assimilating the *result* of virtue (a new, perception-like capacity to recognize external demands) back into the *antecedent* S (a dispositional capacity for sympathy/learning). McDowell might argue that the virtuous perception is *sui generis*, not just the "deployment" of something pre-existing in the same way a desire is deployed in instrumental reasoning. **Suggestion:** Briefly acknowledge that McDowell sees virtue as creating a *new form of sensitivity* to reasons that transcends deliberation *from* prior motives, even latent general ones. Your argument still holds if you show that Williams *would insist* this new sensitivity must still connect (via deliberation) to *some* antecedent capacity in S (like a capacity to learn or be rational), thus internalizing it.

  2.  **The Trivialization Objection & Individuating S:**
      *   **Success of the Objection:** Your trivialization objection **succeeds powerfully** in exposing the core instability. If merely possessing generic human capacities (sympathy, rationality, susceptibility to argument) suffices to place something relevant in S, then the amoralist becomes vanishingly rare – perhaps only conceivable as someone pathologically lacking these basic capacities (e.g., severe psychopathy). This clearly undermines Williams's original aim: to explain why we confidently *deny* reasons to (seemingly possible) agents who simply *lack the relevant concern* (e.g., a clever, non-psychopathic but utterly self-interested egoist), not just those lacking fundamental capacities.
      *   **Can Internalists Block It Principledly?** This is the million-dollar question. You rightly dismiss the "engagement" move as question-begging. Here are potential internalist responses and why they likely fail:
          *   **Require Actual Motivation/Concern, Not Just Capacity:** This is the obvious move. S contains only *actual* motivations, desires, projects, commitments, and *exercised* evaluative tendencies – not mere *latent* capacities. The amoralist *has* the capacity for sympathy but lacks any *actual* concern for others in their S. **Problem:** This fatally weakens Williams against McDowell. The unsympathetic husband *has* the capacity but no *actual* desire for his wife's well-being. If S requires an *actual* relevant concern, Williams cannot explain how deliberation *activates* the capacity to *generate* the new concern/knowledge of the reason. His "sound deliberative route" seems to require starting from *some* actual element in S. If deliberation can only start from *actual* concerns, it's hard to see how it gets *to* the recognition of a reason grounded in a *latent* capacity unless that capacity itself is somehow already "engaged" or represented in S. Williams explicitly includes "dispositions" in S, which are *actual* states, even if not occurrent desires. The question is whether a *latent capacity* counts as a "disposition" in the relevant sense.
          *   **Require Deliberative Accessibility:** An element is only in S if it *can* be accessed/activated via sound deliberation *from the agent's current perspective*. The amoralist's capacity for sympathy is so buried or disconnected from their other concerns that no deliberative route *from their actual S* can reach it. **Problem:** This risks collapsing into the "engagement" criterion. What makes a capacity "deliberatively accessible"? If it's the *possibility* of being motivated via sound deliberation, then we're back to the original problem: the amoralist is defined *by* the absence of such a route. This becomes circular. It also seems *ad hoc* – why is the husband's capacity accessible but the amoralist's not? Williams needs a non-circular, non-question-begging criterion for deliberative accessibility that doesn't *just* rely on the outcome we're trying to predict (whether the agent can be motivated).
          *   **Invoke Thick Concepts/Historical Deliberation:** Williams later (e.g., in *Ethics and the Limits of Philosophy*) emphasized the role of "thick" ethical concepts embedded in social practices. Perhaps S is individuated by the agent's *actual* participation in practices involving such concepts. The amoralist has deliberately rejected or stands completely outside such practices, so the relevant thick concepts (and thus the reasons they disclose) aren't in *their* S, even if the raw capacity is. **Problem:** This makes internal reasons heavily dependent on contingent socialization. It struggles with McDowellian cases where an agent *within* a practice comes to see a *new* reason (via virtue) not currently recognized by that practice. It also risks making the amoralist *too* easy to conceive (just opt out of society), potentially conceding too much to externalism about *some* reasons. It doesn't fully solve the "latent capacity" issue within a practice.

      **Conclusion on Trivialization:** Your objection stands strong. While Williams *needs* a "generous" S to handle McDowellian cases, this generosity threatens to dissolve the distinction by making nearly all agents possess the relevant internal reasons via generic capacities. Finding a *principled* way to individuate S that includes the husband's relevant capacity *without* including whatever the amoralist lacks (beyond the brute absence of the deliberative route) remains a fundamental challenge for internalism. Williams doesn't provide a clear, non-circular solution.

  3.  **Step to Press Hardest On (Referee's Perspective):**
      *   **The Crucial Step:** The step I would press hardest on is the claim: **"there is no case McDowell wants to describe as recognition of an external reason that cannot be redescribed, without strain, as the sound deployment of some such standing capacity [in S]."**
      *   **Why Press Here?**
          1.  **McDowell's Core Challenge:** This is the heart of your response to McDowell. McDowell would argue that the redescription *does* involve strain – it mischaracterizes the *phenomenology* and *rational structure* of recognizing a reason through virtue. It makes the reason seem like it was *derived from* or *constructed out of* prior motives, rather than *perceived* as an independent demand that *transforms* the agent's understanding. Can Williams *really* capture the *directness* and *authority* of the virtuous person's perception ("This *is* cruel, so I *must* stop") as just the outcome of a deliberative route *from* a standing capacity? Isn't the capacity *itself* transformed by the process?
          2.  **The "Strain" Test:** You say "without strain." A referee might ask: *How much strain is acceptable?* Does your redescription preserve the *explanatory force* McDowell attributes to the external reason? Does it capture why the agent feels *compelled* by a reason they previously didn't grasp *at all*? Or does it make the process sound more like discovering a hidden implication of something they already valued?
          3.  **Williams's Burden:** You place the burden on McDowell to find a case that *cannot* be redescribed. A referee might ask you to *demonstrate* the redescription for a specific McDowellian example (e.g., coming to see the reason to keep a promise not out of fear or self-interest, but out of a grasp of fidelity *itself*, acquired through moral education). Precisely *what* element in S is the sound deliberative route starting from? The "capacity to learn"? The "capacity to be rational"? Does specifying this feel like explaining the *content* of the reason (fidelity) or just providing a *causal precondition*?
          4.  **Link to Trivialization:** Pressing here connects directly to the trivialization worry. If the only way to make the redescription work is to posit *such* generic capacities ("capacity to be rational," "capacity to respond to reasons") as elements of S, then you've proven your point about trivialization – S becomes a grab-bag ensuring internal reasons are ubiquitous. But if you need to posit *more specific* but still latent dispositions, the question of why the amoralist lacks *those* specific dispositions (beyond lacking the deliberative route) becomes acute.

  **Overall:** Your argument is sophisticated and persuasive. You’ve pinpointed a genuine tension in Williams's project. To strengthen it:

  *   **Refine McDowell:** Briefly address the "second nature" point more explicitly, acknowledging the *transformative* aspect of virtue, then argue that Williams *still* requires the transformation to be rooted in and accessible via deliberation from *antecedent* elements of S (even if generic).
  *   **Sharpen Trivialization:** Emphasize that the problem isn't just the *existence* of the amoralist, but the *explanatory work* the internal/external distinction was supposed to do. If internal reasons become nearly universal via generic capacities, the distinction loses its bite in explaining the *normative force* (or lack thereof) of reasons *for specific agents* in common scenarios (like the egoist).
  *   **Defend the Redescription:** Anticipate the referee's push on the "without strain" claim. Provide a concrete example of how you'd redescribe a McDowellian virtue-acquisition case as a Williams-style deliberative route from a standing capacity. Acknowledge if it feels slightly different, but argue that the difference isn't *substantive* for the truth of the reason statement under Williams's explanatory constraint.

  This is excellent work. Your "unstable middle position" thesis is a valuable contribution to understanding this enduring debate. Good luck with the paper!
