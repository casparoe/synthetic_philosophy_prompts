prompt: |-
  This has been on my mind for a few weeks for personal reasons, but the actual thing I want your take on is an argument between two coworkers of mine, not me. Quick version of the personal part: my older brother skipped my mom's Thanksgiving two years running to go to his in-laws instead, and then this year my younger sister skipped it too (she went on a friend's trip), and he tore into her at Christmas for being disrespectful about it. Listening to that, I honestly couldn't decide if he'd forfeited any right to say that to her, or if that's beside the point and she really was being kind of disrespectful no matter who's pointing it out. Never resolved it in my own head. Then a couple weeks later, two people on my team, Ravi and Beth, had almost the identical shape of argument at lunch, except about our actual manager, and I got to hear the whole thing play out live, so now I actually want a real answer instead of just stewing on it.

  Backstory: our manager Carol has a hard rule that everyone joins the 9am standup on time, no exceptions, and last week she pulled our teammate Jordan aside for showing up a few minutes late two days in a row. Thing is, Carol herself strolls in 8-10 minutes late to those same standups almost every day, and once when someone joked about it she said "when your running three teams, you don't get to be on time to everything." Here's the Ravi/Beth argument, more or less move by move:

  1. Ravi said Carol had zero standing to reprimand Jordan, since she does the exact thing she's punishing him for, only worse.
  2. Beth said that doesn't get Jordan off the hook - he was still wasting everyone's time and being unprofessional, and Carol's own lateness doesn't erase that, so she was right about Jordan regardless of her own track record.
  3. Ravi said sure, Jordan was still in the wrong, but that's not what he's disputing - the question is whether Carol had any business being the one to say it, and he thinks clearly not, since you don't get to enforce a rule you routinely break yourself.
  4. Beth said the two situations aren't actually comparable - Carol's lateness comes from being double-booked running three teams, which is basically forced on her, while Jordan's is just him dawdling, so it's not really the same violation, just superficially similar.
  5. Ravi said that's exactly the move every hypocrite makes, everybody thinks their own excuse is the legitimate one, and if people get to be the judge of their own exceptions then hypocrisy becomes impossible to ever actually pin on someone - and he pointed to Carol's own "you don't get to be on time to everything" line as basically her admitting she's holding Jordan to a standard she's exempted herself from.
  6. Beth said fine, that line does look bad, but there's a difference between "Carol's kind of a hypocrite" and "Carol had no business saying anything at all" - loosing some credibility isn't the same as loosing all of it, especially since nobody else was going to say it and the standups were genuinely getting derailed.

  Could you go through it move by move, 1 through 6, and say who's actually got the better of it at each point? I don't think either of them sweeps it, so I'd rather have a real point-by-point breakdown than a final winner. And if there's some bigger principle about when someone's hypocrisy actually costs them the right to call something out, versus when it's beside the point, that both of them are kind of skating past, I'd like to hear that too.
