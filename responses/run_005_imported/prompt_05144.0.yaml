  First, Bohmian mechanics has deterministic trajectories guided by a quantum potential. The issue is the unobservable quantum potential and non-local effects. Hume would reject the quantum potential as a hidden "necessitating glue" since it's not observable. The non-locality might not bother him if it's part of observed regularities, but the unobservable mechanism is problematic.

  Next, Copenhagen doesn't posit hidden mechanisms; it relies on observed probabilities. Hume might appreciate the focus on observable statistical patterns. However, the measurement problem and wave function collapse involve unobservable processes. Instrumentalism aligns with Hume, but the collapse's lack of regularity could be a sticking point.

  Everett avoids hidden variables and has a deterministic wave function. But the branching worlds are unobservable. Hume might like the regularity in wave evolution but reject the branching as unobservable. The probability issue—why squared amplitudes—is another unobservable element he'd criticize.

