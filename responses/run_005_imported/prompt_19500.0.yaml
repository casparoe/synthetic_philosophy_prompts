answer: |-
  Here’s a dialogue draft between **Sam** (quasi-fideist, Pritchard-inspired) and **Riley** (entitlement theorist, Wright-inspired). Both engage deeply with *On Certainty*, press each other’s objections, and concede real costs by the end.

  ---

  ### **Characters**
  - **SAM**: Quasi-fideist. Hinges are arational "bedrock" – preconditions for justification, not themselves justified.  
  - **RILEY**: Entitlement theorist. Hinges are non-evidentially warranted *within* the space of reasons.  

  ---

  ### **Dialogue: "The Ground Beneath Our Doubts"**  
  *(Setting: University coffee shop, post-seminar)*  

  **RILEY**: ...So when Wittgenstein says doubting *needs* undoubted grounds, I take him to mean hinges *enable* rationality. But that doesn’t make them *outside* it. Wright’s right: we’re *rationally entitled* to trust our senses or memory – not because we have evidence, but because without that trust, inquiry collapses.  

  **SAM**: *[Stirs coffee skeptically]* Collapses *for whom*? That’s the fideist’s point. If hinges are the riverbed letting reason flow, calling them "rationally entitled" is a category error. You’re still trying to drag them into the courtroom of justification! But they’re the walls of the courthouse. You can’t warrant them without circularity.  

  **RILEY**: But then what do we say to the flat-earther? Their hinge is "The Earth is flat; NASA lies." If hinges are *merely* arational reactions, aren’t we just grunting different tribal chants? How is "I’m entitled to my hinges" better than "Ugga dugga mine"?  

  **SAM**: *[Leans in]* It’s not about "better" in a vacuum. Our hinges *work*. They let us build satellites, cure diseases, coordinate shared reality. The flat-earther’s hinges lead to dead ends: contradictions with observable physics, failed predictions. Their framework *malfunctions* pragmatically.  

  **RILEY**: *[Frowning]* But that’s just *our* standard of "works"! By *their* lights, rejecting "elite lies" *does* function – it preserves their community’s coherence. If hinges are arational, you’ve got no *rational* basis to prefer one malfunction to another. You’re stuck with relativism.  

  **SAM**: Not relativism – *naturalism*. Hinges aren’t chosen; they’re inherited. We critique the flat-earther *from within* our inherited framework, showing how their claims *internally* misfire. But yes, I concede: I can’t give a *transcendental* reason why our hinges are "truer." That’s the cost. Now your turn: if entitlement is rational, why aren’t flat-earthers *entitled* to *their* hinges?  

  **RILEY**: Because entitlement isn’t free-floating! Wright’s criteria: a hinge must be *indispensable* for rational inquiry. "There’s an external world" passes – doubting it paralyzes cognition. But "NASA fakes everything" isn’t indispensable; it actively *impedes* inquiry. You can’t test it without relying on the very institutions it denies!  

  **SAM**: *[Eyes gleaming]* Aha! But what makes *indispensability* rational? Isn’t that just a disguised appeal to *our* epistemic goals? If the flat-earther’s goal is "preserve the purity of Genesis," their hinge *is* indispensable. You’re smuggling in *evidential* norms – "inquiry" means *evidence-responsive* inquiry. But Wright promised to avoid that!  

  **RILEY**: *[Pauses]* Fair. But Wright *can* say: rational inquiry *just is* the project of forming beliefs responsively to reasons. The flat-earther *isn’t* entitled because their hinge *blocks* that project – they dismiss counter-evidence as "fraud." Entitlement requires hinges to *facilitate* reason-giving, not insulate against it.  

  **SAM**: But *facilitation* is still measured by *our* standards! And what about the moon-landing denier? Their hinge is "Humans can’t leave Earth’s atmosphere." Isn’t that indispensable for *their* worldview? If entitlement is non-evidential, why privilege *your* brand of inquiry over theirs?  

  **RILEY**: *[Sighs]* Okay, cost conceded: Wright’s "indispensability" *does* depend on a prior commitment to a *specific* picture of rationality – one valuing consistency, prediction, and evidence. If someone rejects *those* values, entitlement can’t force them. But Sam, your view has a bigger problem: if hinges are *outside* rationality, how do you explain that we *argue* about them? We don’t just bark like dogs; we cite coherence, predictive success...  

  **SAM**: *[Nods slowly]* True. We *do* argue – but it’s persuasion, not proof. I show how their hinges fracture under stress: "If the Earth is flat, why don’t we see ships vanish bottom-first?" But if they double down – "Atmospheric lensing!" – I hit bedrock. I can’t *reason* them up from the abyss. That’s why I call it quasi-*fideism*: at bottom, it’s a leap.  

  **RILEY**: Yet you teach students to *trust* science over conspiracies. Isn’t that tacitly endorsing Wright? You’re acting *as if* our hinges are rationally preferable.  

  **SAM**: *[Smiles wryly]* Guilty. But I’d say: this "preference" is embedded in a form of life. We *live* the superiority. We don’t deduce it.  

  **RILEY**: And I live the need to say: that "living" *is* a rational stance. Otherwise, we reduce philosophy to anthropology.  

  **SAM**: Maybe it is, sometimes. *[Stands to leave]* Final concession: if you *need* hinges inside the space of reasons to sleep at night, I get it. But don’t pretend you’ve escaped circularity.  

  **RILEY**: And if you *need* hinges outside it to avoid smuggling, I get that too. But don’t pretend you’ve escaped the specter of "anything goes."  

  **SAM**: Touché. Same time next week?  
  **RILEY**: Only if my memory’s reliable. *[Grins]* Which, of course, I’m *entitled* to trust...  
  **SAM**: *[Rolls eyes]* ...Or just *do*.  

  ---

  ### **Key Philosophical Moves & Concessions**  
  1. **Sam’s Quasi-Fideism**:  
     - **Strength**: Avoids circularity by refusing to justify hinges evidentially.  
     - **Cost (conceded)**: Cannot *rationally* prefer our hinges to radically different ones; only show pragmatic dysfunction *by our lights*. Risks relativism.  
  2. **Riley’s Entitlement**:  
     - **Strength**: Keeps hinges within rationality, allowing critique of alternatives (e.g., flat-earth hinges impede inquiry).  
     - **Cost (conceded)**: "Indispensability" relies on a contestable view of rationality. Struggles to deny entitlement to hinges serving *non-evidential* goals (e.g., ideological cohesion).  

  ### **Seminar Use**  
  - **Discussion Starters**:  
    - Whose concession is more damaging?  
    - Is Riley’s "inquiry-facilitation" criterion *really* non-circular?  
    - Can Sam’s "pragmatic superiority" avoid being question-begging?  
  - **Textual Hooks**:  
    - *OC* §341-343 (hinges as "inherited background").  
    - Pritchard on "epistemic angst"; Wright on "entitlement of cognitive project."  

  Let me know if you'd like to tweak the balance, add a third view (e.g., Moyal-Sharrock), or sharpen any objections!
