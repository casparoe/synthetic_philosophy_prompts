  I'm taking a graduate seminar on formal ethics this semester, and this week we worked through Hilary Greaves' paper on consequentialist cluelessness alongside some of the older Lenman material. I think I understand the surface-level worry: many of our actions have long causal tails whose downstream effects we simply cannot predict, so expected value calculations for those actions seem to rest on guesswork rather than genuine evidence. What I'm struggling with is the distinction Greaves draws between "simple" and "complex" (or "systemic") cluelessness. If both cases involve foreseeable effects we're uncertain about, why does the complex case supposedly pose a much deeper problem for consequentialist decision-making than the simple case, especially once we admit that our uncertainty about the unforeseen effects is symmetric between options?

  Could you walk me through the intuition here in a fairly granular way? I'd like to understand specifically why symmetric unforeseen effects don't just "cancel out" in expectation the way they seem to in cases of ordinary risk, and why some philosophers think this undermines the practice of comparing expected values across actions at all, rather than just making the comparison harder in a garden-variety epistemic sense. If it's useful, feel free to also address how this differs from a Knightian uncertainty framing, since a classmate of mine insists the two problems collapse into the same thing once you're careful about what "unawareness" means.
