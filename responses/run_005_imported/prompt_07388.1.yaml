  Ok so I've been chewing on the coherence-theorem stuff again -- the arguement (Yudkowsky/Omohundro-style) that any agent whose preferences can't be represented by a utility function is exploitable via a money pump, so anything optimized hard enough basically ends up an EU maximizer. What's been bugging me lately is the incomplete-preferences comeback -- i think it was Thornley's "there are no coherence theorems" post that first put this in my head -- where the idea is you just stay resolute (pick a plan and stick to it instead of re-evaluating every trade as it comes up) and dodge the pump without your preferences ever needing to be complete or transitive. Can you write me a dialogue between two people at a rationalist meetup hashing this out? One thinks the money-pump argument really does force coherence on anything that isn't just leaving free value on the table. The other thinks resolute choice is a genuine escape hatch, not a patch. I want the first person to have an actual comeback to "resolute choice defeats the pump," and the second to have an actual comeback to the obvious reply that being resolute just means you've got a coherent ranking over plans instead of outcomes. Don't let either of them win just because the other runs out of things to say -- I'd rather see them both actually grapple with it than watch one flatten the other.
