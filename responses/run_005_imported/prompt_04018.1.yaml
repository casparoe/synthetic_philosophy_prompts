  We learn that the butler's method, when he is the murderer, always involves poisoning the tea if tea is available. That is, we learn that H_butler entails E: if the butler did it, then he poisoned the tea.

  How does this update our belief?

  Prior:
    P_old(H_butler) = 0.5, P_old(H_gardener)=0.5

  Conditional probabilities:

    We are uncertain about the entailment. Let L be "H_butler entails E", i.e., "if the butler did it, then he poisoned the tea".

    Without L, we might think that even if the butler did it, he might have poisoned the tea only with some probability.

    Set:
      P_old(E | H_butler, L) = 1
      P_old(E | H_butler, not L) = 0.6   (without the entailment, we think he might choose tea 60% of the time)

      P_old(L) = 0.3   (we are not very sure about the butler's method)

    Then:
      P_old(E | H_butler) = P_old(L)*1 + P_old(not L)*0.6 = 0.3*1 + 0.7*0.6 = 0.3+0.42=0.72

    For the gardener:
      P_old(E | H_gardener) = 0.8   (the gardener, if he did it, is likely to use the tea because he has access to the garden herbs that might be put in tea)

  But we know E (tea was poisoned). So we update on E.

    P_old(E) = P_old(E | H_butler)*P_old(H_butler) + P_old(E | H_gardener)*P_old(H_gardener)
              = 0.72*0.5 + 0.8*0.5 = 0.36+0.4=0.76

    P_old(H_butler | E) = 0.36/0.76 ≈ 0.4737
    P_old(H_gardener | E) = 0.4/0.76 ≈ 0.5263

  Now, we learn L: that H_butler entails E. We update on L.

  First, we need P_old(L | E).

    P_old(L, E) = P_old(L, E | H_butler)*P_old(H_butler) + P_old(L, E | H_gardener)*P_old(H_gardener)
                 = [P_old(L|H_butler)*1] * P_old(H_butler) + [P_old(L|H_gardener)*P_old(E|H_gardener, L)] * P_old(H_gardener)

  But note: L is a statement about H_butler. It might be independent of H_gardener? And for H_gardener, L being true or false doesn't directly affect the probability of E? 

  We can assume that L is independent of H_gardener. And for H_gardener, E is independent of L. So:

    P_old(L, E | H_butler) = P_old(L | H_butler) * P_old(E | H_butler, L) 
                            = 0.3 * 1 = 0.3   (since we assumed L independent of H? Actually, we set P_old(L)=0.3 and assumed independence, so P_old(L|H_butler)=0.3)

    P_old(L, E | H_gardener) = P_old(L | H_gardener) * P_old(E | H_gardener, L)
                              = 0.3 * 0.8   (since for the gardener, E is independent of L, so P_old(E|H_gardener, L)=P_old(E|H_gardener)=0.8)

  Similarly, for not L:

    P_old(not L, E | H_butler) = P_old(not L | H_butler) * P_old(E | H_butler, not L) = 0.7 * 0.6 = 0.42
    P_old(not L, E | H_gardener) = 0.7 * 0.8 = 0.56

  Then:

    P_old(L, E) = 0.3*0.5 + 0.3*0.8*0.5 = 0.15 + 0.12 = 0.27
    P_old(not L, E) = 0.42*0.5 + 0.56*0.5 = 0.21+0.28=0.49
    Total E: 0.27+0.49=0.76 (matches)

    P_old(L | E) = 0.27/0.76 ≈ 0.3553

  Now, in P_E, we have:

    P_E(L) = 0.3553

    P_E(L | H_butler) = P_old(L | H_butler, E) = P_old(L, E | H_butler) / P_old(E | H_butler) 
                       = 0.3 / 0.72 = 0.4167

    P_E(L | H_gardener) = P_old(L | H_gardener, E) = P_old(L, E | H_gardener) / P_old(E | H_gardener)
                         = (0.3*0.8) / 0.8 = 0.3   [because P_old(E|H_gardener)=0.8, and P_old(L, E | H_gardener)=0.3*0.8]

  Now, update on L:

    P_new(H_butler) = P_E(H_butler | L) 
                    = [P_E(L|H_butler) * P_E(H_butler)] / P_E(L)
                    = [0.4167 * 0.4737] / 0.3553
                    ≈ (0.1974) / 0.3553 ≈ 0.5556

  So we go from about 47.37% to 55.56%. This is a noticeable increase.

  Therefore, in this example, learning the entailment (that if the butler did it, he must have poisoned the tea) does increase the probability of the butler hypothesis, even though we already knew the tea was poisoned.

  Conclusion: The Garber/Jeffrey move can rescue confirmation in the case of old evidence when there is uncertainty about the logical entailment. However, if the entailment is already known (i.e., if we were logically omniscient), then we would not get an update. But in practice, logical omniscience is unrealistic, so this move can explain why old evidence can confirm a new theory.
answer: |-
  Let's construct a novel, non-physics example to explore the problem of old evidence and test the Garber/Jeffrey solution. We'll use a forensic scenario involving a crime investigation, where the "old evidence" is a known fact about the crime scene, and a new hypothesis emerges that retrodicts this evidence.

  ### The Case: The Stolen Diamond
  **Background Knowledge (K):**  
  - A rare diamond was stolen from a museum vault between 2:00 AM and 4:00 AM.  
  - The vault's security log shows that the thief disabled the laser grid at 2:30 AM (event **E**). This fact is already known and accepted.  
  - Two suspects:  
    - **H₁: The Janitor** (hypothesis proposed later).  
    - **H₂: The Curator** (initial suspect).  

  **New Hypothesis (H₁):**  
  A security expert proposes H₁: "The janitor stole the diamond using a specific method that requires disabling the laser grid at exactly 2:30 AM."  

  **Problem:**  
  Since **E** (laser disabled at 2:30 AM) is already in **K**, **P(E|K) = 1**. If we try to update on **E**, we get:  
  - **P(H₁|E, K) = P(E|H₁, K) × P(H₁|K) / P(E|K) = 1 × P(H₁|K) / 1 = P(H₁|K)**.  
  Updating on **E** does nothing. Yet, intuitively, the fact that H₁ *explains the precise timing* of **E** should boost its credibility.  

  ### Standard Rationalist Fix (Simplicity Prior) Fails Here  
  The simplicity prior penalizes ad-hoc theories. But H₁ isn't obviously gerrymandered:  
  - It posits the janitor had a *motive* (grudge) and *means* (access to laser codes).  
  - H₂ (curator) also explains **E** (she knew the codes).  
  With no clear simplicity advantage, the prior can't resolve why H₁'s retrodiction feels like confirmation.  

  ---

  ### Testing the Garber/Jeffrey Solution  
  **Core Idea:** Instead of updating on **E**, we update on the **new realization** that **H₁ entails E**. Since we're not logically omniscient, we might not have *noticed* this entailment earlier. Let:  
  - **L ≡ "H₁ logically implies E"** (i.e., the janitor's method *requires* disabling the laser at 2:30 AM).  

  We now update on **L**, not **E**.  

  #### Step 1: Prior Beliefs (Before Realizing L)  
  Assume initial probabilities:  
  - **P(H₁|K) = 0.3** (janitor plausible but less likely).  
  - **P(H₂|K) = 0.7** (curator is prime suspect).  
  - **P(E|K) = 1** (E is known).  

  Critically, we're *uncertain* about the connection between H₁ and E:  
  - We know H₁ *could* explain E, but we haven't deduced that H₁ *entails* E.  
  - **P(L|K) = 0.4** (40% chance we'd spot the entailment if H₁ were true; low because H₁'s method is technical).  
  - **P(E|H₁, ¬L, K) = 0.6** (if H₁ doesn't entail E, we think it’s only 60% likely the laser was disabled at 2:30 AM).  
  - **P(E|H₂, K) = 0.9** (curator likely disabled it at 2:30 AM but not necessarily).  

  #### Step 2: Probability of E Given H₁ (Accounting for L)  
  \[
  P(E|H₁, K) = P(E|H₁, L, K)P(L|H₁, K) + P(E|H₁, ¬L, K)P(¬L|H₁, K)
  \]  
  - **P(E|H₁, L, K) = 1** (if H₁ entails E, E must occur).  
  - **P(L|H₁, K) = P(L|K) = 0.4** (entailment probability is independent of H₁).  
  - **P(E|H₁, ¬L, K) = 0.6**.  
  - **P(¬L|H₁, K) = 0.6**.  
  \[
  P(E|H₁, K) = (1 \times 0.4) + (0.6 \times 0.6) = 0.4 + 0.36 = 0.76
  \]  

  #### Step 3: Posterior After Learning E (Old Evidence)  
  Since **E** is known, we condition on it:  
  \[
  P(H₁|E, K) = \frac{P(E|H₁, K) P(H₁|K)}{P(E|K)} = \frac{0.76 \times 0.3}{1} = 0.228
  \]  
  **Result:** **P(H₁|E, K) = 0.228** (decreased from 0.3 because H₂ explains E better).  

  #### Step 4: Update on Learning L (H₁ Entails E)  
  We now learn **L**: "H₁ *entails* E." We compute **P(H₁|E, L, K)**.  

  - **Likelihood of L given H₁ and E**:  
  \[
  P(L|H₁, E, K) = \frac{P(E|H₁, L, K) P(L|H₁, K)}{P(E|H₁, K)} = \frac{1 \times 0.4}{0.76} \approx 0.526
  \]  
  - **Likelihood of L given H₂ and E**:  
  H₂ doesn’t entail E, so **P(L|H₂, E, K) = P(L|K) = 0.4** (learning H₂ is true doesn’t affect L’s probability).  

  - **Posterior Ratio**:  
  \[
  \frac{P(H₁|E, L, K)}{P(H₂|E, L, K)} = \frac{P(L|H₁, E, K) P(H₁|E, K)}{P(L|H₂, E, K) P(H₂|E, K)} = \frac{0.526 \times 0.228}{0.4 \times 0.772} \approx \frac{0.120}{0.309} \approx 0.388
  \]  
  Normalizing:  
  \[
  P(H₁|E, L, K) = \frac{0.388}{1 + 0.388} \times (1 - P(\text{other hypotheses})) \approx 0.28
  \]  

  **Result:** **P(H₁|E, L, K) ≈ 0.28** (up from 0.228 after learning L).  

  ---

  ### Does This "Rescue" Confirmation?  
  - **Before learning L**: **P(H₁|E, K) = 0.228**.  
  - **After learning L**: **P(H₁|E, L, K) ≈ 0.28**.  
    → **Increase of 0.052** (22.8% relative boost).  

  **Why?** Learning L means:  
  1. If H₁ is true, E *had* to happen (P(E|H₁) jumps from 0.76 to 1).  
  2. H₂ doesn’t gain this benefit (P(E|H₂) remains 0.9).  
  This asymmetry boosts H₁.  

  ### Does It Just Relocate the Puzzle?  
  The Garber/Jeffrey move *works* here but exposes a **new dilemma**:  
  - **Updated problem**: Why does learning **L** confirm H₁? **L** is a *logical fact*, so shouldn’t **P(L|K) = 1** if we’re omniscient?  
  - **Response**: In practice, we’re not omniscient. Discovering "H₁ entails E" is genuine evidence because:  
    - It reveals H₁ is *more predictive* than we realized (like finding a new fingerprint).  
    - It *reduces uncertainty* about H₁’s explanatory power.  

  **Verification**: If we *were* omniscient (**P(L|K) = 1** initially):  
  - **P(E|H₁, K) = 1** from the start.  
  - **P(H₁|E, K) = P(H₁|K) = 0.3** (no update on E).  
  - Learning **L** would do nothing (**P(H₁|E, L, K) = 0.3**).  
  → **Confirmation vanishes**, as expected.  

  ---

  ### Conclusion  
  - **Garber/Jeffrey works** in this example: Learning "H₁ entails E" *does* confirm H₁, even though E is old evidence.  
  - **Key insight**: The update transfers evidential weight from the *fact* of E to the *discovery of a logical link* between H₁ and E.  
  - **Limitation**: It only works when we’re initially uncertain about the entailment. If the link is obvious, the puzzle returns—but in real science (e.g., Einstein realizing GR entailed Mercury’s orbit), such uncertainty is common.  
  - **Takeaway**: The problem of old evidence isn’t fully "solved," but Garber/Jeffrey provides a viable mechanism for confirmation by exposing how logical ignorance mediates updates.
