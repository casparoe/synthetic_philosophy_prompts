answer: |-
  Based solely on Aquinas's commitments in the *Summa Theologiae* concerning law, the common good, natural law, and interpretation, he would **side decisively with purposivism** over textualism in the modern dispute, **but with a crucial qualification regarding *who* may apply purposive interpretation.**

  Here's the breakdown, defending against the strongest textualist counter-evidence:

  1.  **The Primacy of the Lawgiver's Intention and the Common Good (Purposivist Core):**
      *   **Evidence:** In I-II, q.96, a.6, Aquinas explicitly states that a law binds "according to the intention of the lawgiver" (*secundum intentionem legislatoris*) and "for the common good" (*ad bonum commune*). His besieged city gate example is a paradigmatic case of purposivism: adhering to the *text* ("gates shut") would defeat the *purpose* ("safety of the citizens") in unforeseen circumstances. Obedience to the bare wording becomes "evil" (*malum*) in this context. The virtue of *epikeia* (II-II, q.120) is defined precisely as the correction of the law where it is deficient *due to its universality* – i.e., where following the letter fails to achieve the lawgiver's just purpose in a specific case. Law, for Aquinas, is an *ordinatio rationis* (ordinance of reason) for the common good. Its authority derives from its rationality and alignment with the common good, not merely from its enacted form.
      *   **Why This Favors Purposivism:** Textualism prioritizes the enacted text regardless of whether its application in a specific case aligns with (or even contradicts) its original purpose. Aquinas rejects this, arguing the text *must* yield to the underlying purpose (the lawgiver's intention for the common good) when a strict application would produce an unjust or absurd result contrary to that purpose. This is the essence of purposivism.

  2.  **The Restriction on Private Interpretation (The Textualist Counter-Evidence & Aquinas's Qualification):**
      *   **Evidence:** Aquinas consistently warns that private individuals cannot simply disregard the law's letter based on their *own* judgment of the common good or the lawgiver's intention, except in cases of "manifest and urgent necessity" (e.g., I-II, q.96, a.6 ad 3; q.90, a.3 ad 2; q.95, a.2; II-II, q.60, a.5). Interpreting the law in doubtful or less clear cases belongs properly to public authorities (princes, judges, rulers) who hold the power to "dispense" from the law or interpret it authoritatively. Private judgment is prone to error and self-interest, threatening the stability and predictability that law provides.
      *   **Why This is NOT Textualism:** This restriction is **not** an endorsement of textualism. It is an endorsement of **institutional authority** and the **rule of law** against private anarchy.
          *   Aquinas is *not* saying that judges or rulers themselves must be textualists. On the contrary, he explicitly assigns *to public authorities* the very task of applying *epikeia* and interpreting the law according to the lawgiver's intention and the common good (II-II, q.120). The ruler or judge, when acting in their official capacity, *is expected and authorized* to look beyond the bare wording to the purpose when necessary.
          *   The restriction targets *private individuals*, not the official interpreters. His point is that the *mechanism* for applying purposivism must be controlled and exercised by the legitimate authority, not arbitrarily by every citizen. This protects against chaos but still mandates that the *authorized interpreter* (the judge) looks to purpose. Textualism would bind the *judge* to the text regardless of purpose; Aquinas mandates the judge look *through* the text to the purpose.
          *   The exception of "manifest and urgent necessity" for private individuals *still* relies on purposivism – the individual judges that the *purpose* of the law demands its non-application *in this extreme case*. Aquinas isn't saying the text is supreme then; he's saying the purpose is so overwhelmingly clear that even a private individual can see the text must yield.

  3.  **Natural Law Foundation Undermines Textualism:**
      *   Aquinas's entire legal theory is grounded in natural law. Human positive law derives its legitimacy from its conformity to natural law and right reason, ordered to the common good (I-II, q.95, a.2). The enacted text (*lex scripta*) is an *instrument* to achieve the rational end (common good). Textualism's potential to enforce a law contrary to its purpose (and potentially contrary to justice/reason, as in the gate example) is fundamentally incompatible with this view. Law is not sovereign; reason and the common good (as understood through natural law) are sovereign. The text serves them.

  **Conclusion & Defense Against Counter-Evidence:**

  Aquinas would side with **purposivism** because his core principle is that the authority and binding force of law reside in its alignment with the lawgiver's rational intention for the common good, not in the bare words themselves. When the letter and the purpose conflict, the purpose must prevail. *Epikeia* is the virtue embodying this.

  **The strongest textualist counter-evidence – his restriction on private interpretation – does not support textualism.** It supports institutional authority within a purposivist framework. He mandates that the *official judges* (not private citizens) are the ones tasked with interpreting and, where necessary through *epikeia*, correcting the law's application *according to its purpose and the demands of justice/equity in specific cases*. The textualist position – that judges must adhere to the text even when it contradicts the law's apparent purpose – would be rejected by Aquinas as irrational and potentially unjust, as his besieged city gate example vividly illustrates. He allows textual adherence only where it serves the purpose or where private deviation would cause greater harm than good; he mandates purposive interpretation by authorities where the text, applied strictly, fails its own end. Therefore, his fundamental commitments align with purposivism, albeit a version strictly channeled through authorized interpreters to maintain legal order.
