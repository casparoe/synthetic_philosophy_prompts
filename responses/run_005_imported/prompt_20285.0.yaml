  The resolution? Contextual deployment: negation targets reification; affirmation shows conventional validity. The "fourfold" isn't uniform—sometimes exhaustive, sometimes not. Paraconsistent logic helps model but isn't Nagarjuna's intent. Ultimately, the logical moves serve soteriological goals: freeing minds from clinging. 

