  so my friend and i got into a whole thing last night about the catuskoti in Nagarjuna and neither of us won. she thinks the "not existent, not nonexistent, not both, not neither" move on stuff like nirvana or the self is basically Nagarjuna breaking logic on purpose -- paradox as method, thats the whole point of emptiness. i said there has to be a more principled reading, because he also affirms all four horns as valid in other places depending on context, and if both moves just mean "logic doesn't apply here," then none of his arguments are actually arguments anymore, just assertions dressed up as reasoning.

  can you help settle this, or at least lay out the strongest version of each side? is there a real logical difference between the negating-all-four move and the affirming-all-four move? does the prasajya vs paryudasa (non-implicative vs implicative) negation distinction actually rescue him from the Robinson-style "this is just equivocation" charge, or is that basically a later commentarial patch job by people like Candrakirti? and does the Garfield/Priest paraconsistent reading mean he genuinely wants true contradictions at the edge of thought, or something more modest than that? skip the "emptiness isn't nihilism" 101 stuff, we've both already got that part down.
