  First, I need to recall the core tension: Nagarjuna both rejects all four positions (e.g., on nirvana) and elsewhere accepts them contextually. The friend's "paradox-as-method" view risks making his arguments non-arguments. The user suspects nuanced logic at work. Key angles to cover: 1) Prasajya vs. paryudasa negation—does this distinction legitimately handle equivocation charges? 2) Whether affirming/negating all four is contextually consistent. 3) If Garfield/Priest's paraconsistent approach truly commits to contradictions or is more cautious.

  The user mentions Robinson's critique (likely Richard Robinson's logical objections) and Candrakirti's commentaries. They also reference Garfield/Priest's paraconsistent reading, so I should address whether this implies "true contradictions" or a dialetheic stance. The user dismisses basic "emptiness isn't nihilism" explanations, so focus on advanced logic.

  For the friend's side ("Paradox as Liberative Method"), the strong version is that Nagarjuna uses radical negation to expose conceptual limits—logic fails at ultimate reality. Emptiness isn't a position but a tool to collapse all views. Texts like MMK XVIII.8 support this: even the Buddha's teachings are provisional. Robinson would say this equivocates, using "not" differently each time. 

