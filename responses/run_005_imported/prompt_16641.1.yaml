  We are drafting interview questions for a guest who holds a realist position on neural network representations. The key points to challenge are:
   1. The basic incredulity about directions in activation space being "about" something (syntax vs semantics).
   2. The causal-intervention criterion and the risk of superposition as a universal explain-away.
   3. The regress problem: the role of the interpreter in labeling the concept.

   Additionally, we want a closing question about what evidence would make her abandon representational realism.

   We'll structure:
     - Main question for each point, followed by a likely answer and a pointed follow-up.
     - We'll aim for 8-10 questions in total, including these and others that challenge the position.

   Let's outline:

   I. Question on the basic incredulity (syntax vs semantics)
      Follow-up: if she says the causal role bridges syntax and semantics, push on how that differs from functionalism and whether it avoids the Chinese Room.

   II. Question on the causal-intervention criterion and superposition as an explain-away.
      Follow-up: if she says that superposition is just an engineering challenge, ask why we should expect that every concept we care about will eventually be found as a clean feature.

   III. Question on the regress problem (interpreter's role in labeling).
      Follow-up: if she says the causal role fixes the content, ask how that avoids the fact that the labeling is done by the interpreter and might be arbitrary.

   IV. Other questions to challenge the position (5 more to make 8-10 total):
      a. Question about polysemantic neurons: how does realism handle a single neuron that activates for multiple concepts?
          Follow-up: if she says superposition (multiple features in one neuron), ask how that differs from saying the neuron doesn't represent any one concept.

      b. Question on the underdetermination of features by data: two different autoencoders might find different feature sets that both explain the data. How can we say which one is real?
          Follow-up: if she says we look for the one that generalizes best, ask how we know that the one that generalizes isn't just a useful fiction.

      c. Question on the relationship to human concepts: when we say a feature represents "democracy", is that the same concept a human has? How do we know?
          Follow-up: if she says the causal role aligns with human concepts, ask about features that don't have a clear human analog.

      d. Question on the empirical track record: what are the most compelling examples of features that have been found and validated? What do critics say about those examples?
          Follow-up: if she gives examples, ask whether those features were found by multiple independent groups or just one.

      e. Question on the predictive power: if the features are real, why don't we see more downstream applications (e.g., in model editing) that are robust and reliable?
          Follow-up: if she says we are getting there, ask for a timeline and what milestones she expects.

   V. The closing question: what would falsify representational realism?

