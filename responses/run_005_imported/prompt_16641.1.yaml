prompt: |-
  I'm a software engineer who ended up spending most of my free time over the last year or so reading about mechanistic interpretability rather than anything to do with my actual job, and I've started a small podcast where I talk to people doing that kind of research. My guest for the next episode has a bit of a reputation in that world for taking a hard realist line on neural network representations: she argues that the "features" pulled out of a model's activations by tools like sparse autoencoders are genuine representations with real semantic content, not just convenient labels that we, as interpreters, are pasting onto directions in a high-dimensional space after the fact.

  Her whole position seems to turn on one move. She says a direction counts as representing a given concept exactly when intervening on it — patching it, scaling it, zeroing it out — changes downstream behavior the way that concept would predict, and that this is really all anyone has ever meant by "representation," even in ordinary talk about beliefs and perceptions. Whenever I've seen her field objections — that the same direction often turns out to be polysemantic, that a feature only shows up as clean and monosemantic once you've gone looking for it with an autoencoder built to find something, that two people probing the same model for the same concept can come away with differently-labeled directions — she treats these as engineering problems about superposition and dictionary size, never as evidence against the underlying realism. I don't have the philosophical background to push back on that move on my own, so I'd like your help.

  Could you draft eight to ten interview questions for her, ones that don't just let her restate the position? I want at least one question that presses on the basic incredulity a lot of non-specialists (myself included) feel at calling a direction in activation space "about" something at all, given how closely that resembles the old worry about syntax without semantics; at least one that asks how her causal-intervention criterion for representation could ever come out false, given that superposition is always available as a ready-made explanation whenever a feature turns out messy or unstable; and at least one about the regress this seems to invite once you notice that the "concept" a feature is said to represent is usually fixed by whoever is doing the labeling — doesn't that make the content a fact about the interpreter's procedure rather than something discovered in the network? For each of these, please add a short, pointed follow-up keyed to the answer she's most likely to give, and close the list with a question that asks her to name one concrete interpretability finding that would actually make her abandon representational realism, rather than just patch the theory again.
