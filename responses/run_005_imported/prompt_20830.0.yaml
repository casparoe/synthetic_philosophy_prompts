  - **Money-pump arguments against cyclic preferences**: If an agent has cyclic preferences (A>B, B>C, C>A), then they can be "pumped" for money. For example, they might pay a small amount to trade A for C, then C for B, then B for A, ending up where they started but poorer. This cycle can be repeated until bankrupt. This is a strong argument for transitivity.

  - **Money-pump arguments extended to incomplete preferences**: Incompleteness (no preference between A and B) might lead to indecision, but money-pump arguments for incompleteness are less straightforward. Some argue that an agent with incomplete preferences might be exploited in sequential choice situations, but the vulnerability is less direct and might be avoidable by having a resolute choice. Hence, it is weaker than the cyclic case.

  - **von Neumann–Morgenstern (vNM) representation theorem**: This theorem shows that if an agent's preferences over lotteries satisfy certain axioms (completeness, transitivity, continuity, independence), then they can be represented as maximizing expected utility. The normative force comes from the appeal of the axioms. However, it is a representation result and does not directly show a pragmatic cost. The independence axiom in particular is sometimes questioned.

