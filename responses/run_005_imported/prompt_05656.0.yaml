  The user is confused because usually, a mixed strategy's payoff is a weighted average of the pure strategies. So why is 4/3 higher than both 0 and 1? The answer must lie in the imperfect recall. Since the driver can't distinguish between the intersections, they have to use the same mixed strategy at both. That's different from standard mixed strategies where you can randomize independently at different decision points.

  When the driver uses a mixed strategy with probability p to continue, the expected payoff calculation involves both intersections. The possible paths are: exit at first (payoff 0), exit at second (payoff 4), or go past both (payoff 1). The probabilities depend on p. The driver exits at the first with p=0? No, exiting at first happens if they choose to exit there, which is probability (1-p). Then, if they continue at the first (prob p), they reach the second intersection. At the second, they again choose to exit with prob (1-p) or continue with p. So the expected payoff is (1-p)*0 + p*(1-p)*4 + p*p*1. Simplifying: 4p(1-p) + p².

  Maximizing that: 4p - 4p² + p² = 4p - 3p². Taking the derivative: 4 - 6p. Set to zero, p=4/6=2/3. Then the expected payoff is 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3. Correct.

  Now, why does this break the usual rule? The user thinks that a mixed strategy should be a weighted average of pure strategies. The pure strategies here are always exit (payoff 0) and always continue (payoff 1). But 4/3 isn't between 0 and 1; it's higher. So what's happening?

  The issue is that the pure strategies "always exit" and "always continue" aren't the only pure strategies in this context. Because of the identical intersections and imperfect recall, the driver must commit to the same action at both nodes. So the pure strategies are actually: exit at both, continue at both, or mixed. But "exit at both" is the same as exiting at the first, payoff 0. "Continue at both" gives payoff 1. There's no pure strategy where they exit at the second but not the first because they can't distinguish the intersections. So the deterministic plans are only two: exit immediately or continue through both. 

