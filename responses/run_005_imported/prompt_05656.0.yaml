  Mathematically, the key is that the mixed strategy isn't evaluated as a convex combination of the pure strategies' outcomes. Instead, because the same randomization is applied at both information sets, the probabilities interact in a way that creates a nonlinear payoff. The expected payoff function 4p(1-p) + p² is quadratic, not linear in p. So it has a maximum inside the interval, not at the endpoints. That's why mixing can outperform the pure strategies here. 

  The user's confusion comes from applying the standard game theory principle where mixed strategies are linear combinations. But that principle assumes perfect recall and distinct information sets. Here, the information sets are merged, so the randomization is correlated across nodes. The driver can't condition their strategy on which intersection they're at, so the mixed strategy is constrained to be the same at both, leading to a nonlinear payoff function.

  So the answer lies in the constraints of imperfect recall and the resulting identical mixed strategy at both nodes, causing the expected payoff to be nonlinear in p. That breaks the usual linearity of mixed strategies, allowing for a higher expected payoff than any pure strategy.
answer: |-
  You've hit on a fascinating and counterintuitive aspect of the absent-minded driver problem! Your confusion is well-founded because, **in standard decision theory with perfect recall, mixing *cannot* strictly dominate your best pure strategy**. The payoff of a mixed strategy *is* a convex combination (weighted average) of the payoffs of its pure components. However, **imperfect recall fundamentally changes the structure of the problem and breaks the linear relationship between the mixing probability and the expected payoff.**

  Here's why the usual logic doesn't apply and why mixing *can* be strictly better:

  1.  **The Core Issue: Constrained Randomization (Same Action at Both Nodes)**
      *   In a standard single-agent problem with perfect recall, you randomize *independently* at each decision node. You can choose different actions with different probabilities at different points in the game tree.
      *   In the absent-minded driver problem, **imperfect recall forces you to use the *identical* randomized action at *both* intersections.** You *must* commit to a single probability `p` (of continuing) that applies at *every* information set (every intersection you might be at). You cannot condition your strategy on which intersection you are at because you don't know.

  2.  **Non-Linear Payoff Function:**
      *   Because you use the *same* `p` at both intersections, the probability of reaching each terminal node becomes a *non-linear* function of `p`.
      *   Let's calculate the expected payoff `V(p)`:
          *   **Exit at first intersection:** You choose "Exit" (prob `1-p`). Payoff = 0.
              *   Contribution: `(1-p) * 0 = 0`
          *   **Exit at second intersection:** You choose "Continue" at first (prob `p`) *and* "Exit" at second (prob `1-p`). Payoff = 4.
              *   Contribution: `p * (1-p) * 4 = 4p(1-p)`
          *   **Drive past both:** You choose "Continue" at first (prob `p`) *and* "Continue" at second (prob `p`). Payoff = 1.
              *   Contribution: `p * p * 1 = p²`
      *   **Expected Payoff:** `V(p) = 0 + 4p(1-p) + p² = 4p - 4p² + p² = 4p - 3p²`
      *   **Crucially, `V(p) = 4p - 3p²` is a *quadratic* function of `p`, *not linear*.** It has a maximum where its derivative is zero:
          *   `dV/dp = 4 - 6p = 0` => `p = 4/6 = 2/3`
          *   `V(2/3) = 4*(2/3) - 3*(2/3)² = 8/3 - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3`

  3.  **Why the Pure Strategies are Worse:**
      *   **Pure Strategy 1: Always Exit (`p = 0`)**
          *   You exit at the first intersection. Payoff = 0.
          *   `V(0) = 4*0 - 3*0² = 0`
      *   **Pure Strategy 2: Always Continue (`p = 1`)**
          *   You continue at both intersections. Payoff = 1.
          *   `V(1) = 4*1 - 3*1² = 4 - 3 = 1`

  4.  **Why Mixing Beats the Best Pure Strategy:**
      *   The best pure strategy (Always Continue) yields `1`.
      *   The mixed strategy `p=2/3` yields `4/3 ≈ 1.333`, which is strictly greater than `1`.
      *   **This is possible precisely because `V(p)` is quadratic.** A mixed strategy using the *same* `p` at both nodes is *not* equivalent to a convex combination of the pure strategies "Always Exit" (`p=0`) and "Always Continue" (`p=1`). The function `V(p)` connects these two points (`V(0)=0`, `V(1)=1`), but it **arcs above the straight line** connecting them due to the `-3p²` term. The maximum `4/3` lies *above* this line.

  5.  **What Breaks the Usual Logic? Imperfect Recall!**
      *   The standard "mixed strategy payoff is a weighted average" logic **assumes the decision maker can condition their action (or their randomization) on *which decision node they are at*** (perfect recall).
      *   **Imperfect recall removes this ability.** You are forced to treat both decision nodes identically. The randomization isn't happening "globally" over complete plans (like choosing between "Always Exit" and "Always Continue"). Instead, you are constrained to choose a *single behavioral strategy* (`p`) that must be applied identically at every node in your information set.
      *   This constraint introduces the non-linearity (`p * (1-p)` and `p * p` terms). The driver *wants* to do different things at different nodes (Exit at 1st, Continue at 2nd), but *cannot remember* which node they are at to implement that state-dependent plan. Randomizing with the *same* `p` at both nodes is the best way to *approximate* this desired state-dependent behavior under the constraint of ignorance. The non-linearity arises because the outcome (which exit you take) depends on the outcome of the *same* random device applied at *both* decision points.

  **In Summary:**

  The key mathematical difference caused by **imperfect recall** is that it **forces the decision maker to use an identical randomized action (`p`) at every node within an information set.** This constraint transforms the expected payoff function into a **non-linear (quadratic) function** of the mixing probability `p`. Because the payoff function is non-linear (`V(p) = 4p - 3p²`), it can have a maximum *inside* the interval `[0, 1]` that is strictly greater than the payoff at either endpoint (`V(0)=0`, `V(1)=1`). This is why mixing (`p=2/3`) strictly dominates the best pure strategy (`p=1`), achieving `4/3 > 1`. The usual logic that mixing can't beat your best pure strategy relies on a *linear* payoff function, which only holds under perfect recall where randomization can be state-dependent. Imperfect recall breaks that linearity.
