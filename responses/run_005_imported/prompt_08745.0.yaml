prompt: |-
  At the small developer-tools company where I work, we recently made the source code for our core product publicly visible for the first time, and it has turned into a surprisingly heated internal argument that's been running for weeks. The new license lets anyone read the code, modify it for their own use, and even redistribute their changes, but it forbids repackaging it as a competing hosted service — essentially the same move several well-known infrastructure and database companies have made in recent years after watching big cloud providers resell their software without contributing anything back. About half my team wants the launch announcement and README to call this "open source," since the code is genuinely sitting out in the open and anyone can send us a pull request. The other half, mostly people who have worked on real open-source projects before, say that's misleading, because the license fails a couple of the criteria in the Open Source Initiative's official definition — specifically the ones about not discriminating against particular fields of endeavor or classes of user. What makes the argument strange is that nobody disputes any fact about what the license actually permits; both camps describe its terms identically. They only disagree about whether those terms add up to something that earns the label.

  I've somehow ended up responsible for drafting the final wording, mainly because I don't have a strong enough stake for either side to resent me for it, but I have no background in philosophy and I'm not sure how to settle this beyond picking a side and absorbing the complaints afterward. It occurs to me that since nobody involved is confused or mistaken about any actual fact, more arguing seems unlikely to change anyone's mind — but I can't tell whether that means the disagreement isn't a real one, or whether one side is still simply correct and the other simply wrong. Is there a principled way to work out whether two people who agree on every fact but disagree about what to call the result are disagreeing about anything at all, and if it turns out they aren't, does that mean it genuinely doesn't matter which way we write the announcement?
reasoning: |-
  Okay, let me start by understanding the user's problem. They work at a developer-tools company that just made their source code public with a license that allows viewing, modifying, and redistributing changes but prohibits repackaging as a competing hosted service. The internal debate is whether this can be called "open source." Half the team says yes because the code is accessible and accepts pull requests. The other half, especially those with open-source experience, argue it's misleading because the license violates OSI's criteria by discriminating against fields of endeavor (like cloud hosting).

  The user is tasked with drafting the announcement and needs a principled way to resolve this. They note that both sides agree on the facts of the license terms but disagree on the label. The user feels stuck because they lack a philosophy background and want to avoid arbitrary decisions.

  First, I need to recall the Open Source Definition (OSD) by OSI. The key points here are OSD #6 (no discrimination against fields of endeavor) and possibly #5 (no discrimination against persons or groups). The license's restriction on commercial hosting targets a specific field, which violates OSD #6. So technically, it's not OSI-approved open source. That's a factual point.

  But why the disagreement? One side prioritizes practical accessibility: the code is open, pull requests are welcome. The other values strict adherence to OSI standards. It's a matter of framing: descriptive vs. normative use of "open source." Some use it broadly; others insist on OSI's definition as the authority.

  The user needs a solution that satisfies both camps without misrepresenting. They also worry if the label choice matters beyond internal conflict. Mislabeling could cause backlash from the open-source community or confuse users expecting full freedoms.

  Possible approaches: Avoid the term "open source," use "source-available" instead. Or, clearly state it's not OSI-compliant but highlight the open aspects. Transparency about the license terms is crucial to prevent misunderstandings.

  Also, considering the user's role as a neutral mediator, they need a compromise that respects both viewpoints. Emphasizing factual descriptions over labels might help. For example, in the announcement, detail what the license allows and restricts without using the contentious term upfront.

  The deeper need here is maintaining team cohesion, protecting the company's reputation, and ensuring users aren't misled. The solution should address all three. The user might also need validation that the label choice has real implications, so it's not just semantics. Clarity and honesty in communication are key to avoiding future issues.
answer: |-
  This is a fascinating and surprisingly common semantic dilemma in tech. You're right that both sides agree on the concrete facts (what the license allows/forbids), but disagree on whether that qualifies as "open source." Here's how to break it down:

  **1. The Core Disagreement: It's About Definitional Authority, Not Facts**
     - **Team A ("Call it Open Source")**: They're using a *colloquial, descriptive* definition: "Code is publicly viewable and modifiable." This is common in informal developer circles.
     - **Team B ("Don't Call it Open Source")**: They're using the *formal, normative* definition governed by the Open Source Initiative (OSI). The OSI definition is the industry standard for what legally constitutes "Open Source" software. Your license violates OSD #6 ("No Discrimination Against Fields of Endeavor") by specifically targeting commercial hosting providers. This makes it "source-available" or "shared source," not OSI Open Source.

  **2. Are They Disagreeing About Anything Real?**
     Yes, absolutely. This is a **real disagreement about language conventions and branding implications**, not just pedantry:
     - **Expectation Setting**: Calling it "Open Source" sets expectations for *freedom*. Developers familiar with OSI standards will expect the freedoms defined in the OSD. Discovering the hosting restriction later will feel like a bait-and-switch, damaging trust.
     - **Community Perception**: The OSI definition exists to prevent fragmentation and confusion. Misusing the term invites criticism from the open-source community (like the backlash against "fauxpen source" licenses). Prominent figures and communities *will* call this out.
     - **Legal Clarity**: "Open Source" has legal weight. Using it incorrectly could create ambiguity or even legal risk if someone relies on the OSI definition's guarantees.
     - **Precedent**: Yielding to the colloquial definition weakens the meaning of "Open Source" and makes it harder for projects adhering to the OSD to signal their commitment to true freedom.

  **3. Why "It Doesn't Matter" is Incorrect**
     Labeling *does* matter here:
     - **User Confusion**: Developers *will* interpret "open source" based on the OSI definition. Mislabeling leads to frustration when they discover restrictions they didn't anticipate.
     - **Reputational Risk**: Being accused of "open-washing" harms credibility, especially for a developer tools company. It signals disrespect for community norms.
     - **Competitive Positioning**: Clear labeling helps users understand *your* model. If you compete with true OSS projects, ambiguity hurts you.

  **4. A Principled Path Forward (The Drafting Solution)**

  Don't pick sides. Reframe the language to be **precise, factual, and transparent**, avoiding the contested label where ambiguity exists:

  *   **Option 1 (Preferred - Accuracy & Transparency):**
      > "We're making our core source code **publicly available and modifiable** under the [License Name] license. This allows anyone to view, modify, use, and redistribute the code for any purpose, **except offering it as a competing hosted service**. While this isn't an OSI-approved Open Source license due to this restriction, we welcome community contributions and collaboration. Explore the code, submit fixes, and build with it!"

      *   **Why it works:** Uses descriptive terms ("publicly available," "modifiable"), explicitly states the restriction, *acknowledges* the OSI definition, invites contribution, and avoids the "Open Source" label. It's honest and manages expectations.

  *   **Option 2 (If "Open Source" Must Be Used - With Heavy Caveats):**
      > "We're **open-sourcing our core code** under the [License Name] license! **Important Note:** While the source is publicly accessible, modifiable, and redistributable, this license restricts commercial hosting of the software as a service. This means it **does not meet the Open Source Initiative's (OSI) full definition of Open Source software** (specifically due to field-of-endeavor restrictions). We believe this model protects our ability to sustain development while fostering community collaboration. Dive into the code, send us pull requests, and build with it!"

      *   **Why it's riskier:** Still uses "open-sourcing," which purists will criticize. However, it *immediately* clarifies the deviation from the OSI standard and explains the rationale. Transparency is key.

  **Key Principles for Your Draft:**

  1.  **Prioritize Accuracy Over Marketing:** "Source-available" or "publicly licensed" are more accurate than "open source" here. Use them.
  2.  **Transparency is Non-Negotiable:** Explicitly state the hosting restriction *early* and *clearly*. Don't bury it.
  3.  **Acknowledge the OSI Definition:** If the term "Open Source" comes up, explicitly address its absence of OSI approval. This shows respect for the standard and prevents accusations of deception.
  4.  **Highlight the Positives:** Emphasize the genuine openness: public code, modifiable, pull requests welcome, freedom for most users.
  5.  **Focus on What Developers *Can* Do:** Frame the announcement around the new opportunities (viewing code, contributing, using internally, redistributing modified versions).

  **Why This Resolves the Stalemate:**

  *   **For Team B (OSI Purists):** You avoid falsely claiming "Open Source" per the authoritative definition. You demonstrate respect for the community standard.
  *   **For Team A ("It's Open!"):** You still highlight the significant openness and accessibility of the code. The announcement remains positive and inviting. You use language that resonates with the *practical* openness they value ("publicly available," "modifiable," "pull requests welcome").
  *   **For the Company:** You mitigate reputational risk, set clear expectations, and communicate honestly. This builds long-term trust.

  **Conclusion:** This isn't just semantics; it's about accurate communication and respecting established standards. **The principled solution is to avoid labeling your license "Open Source" without qualification.** Use precise descriptive language ("publicly available," "source-visible," "shared source"), explicitly state the hosting restriction, acknowledge the deviation from the OSI definition if needed, and enthusiastically invite community engagement based on the *actual* freedoms offered. This approach is honest, manages expectations, respects both internal viewpoints by focusing on facts and opportunities, and protects your company's reputation within the developer community. Draft accordingly.
