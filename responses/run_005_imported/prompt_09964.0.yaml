answer: |-
  Let's break down the immodesty argument step-by-step, focusing on *why* modesty is irrational and *why* strict propriety is philosophically essential (not just a technical trick). The core insight is that **modesty reveals a self-undermining inconsistency in your epistemic state.**

  ### Core Concepts Refresher
  1.  **Accuracy-First Goal:** Rational credences should aim to *accurately represent the world* (minimize inaccuracy).
  2.  **Scoring Rule (s):** Measures inaccuracy of credence `b` if proposition `X` is true (`s(1, b_X)`) or false (`s(0, b_X)`). Lower score = more accurate.
  3.  **Strict Propriety:** A scoring rule is strictly proper if, for any coherent (probabilistic) credence function `p`, `p` uniquely minimizes its *own* expected inaccuracy. Formally:
      *   `E_p[s(p)] < E_p[s(b)]` for any alternative credence function `b ≠ p`.
      *   **Translation:** `p` expects *itself* to be strictly more accurate than any other credence function.
  4.  **Immodesty:** A credence function `c` is **immodest** relative to scoring rule `s` if `c` expects *itself* to be the most accurate credence function available (i.e., `E_c[s(c)] ≤ E_c[s(b)]` for all `b`).
  5.  **Modesty:** A credence function `c` is **modest** relative to `s` if `c` expects some *other* credence function `b*` to be *more accurate than itself* (i.e., `E_c[s(b*)] < E_c[s(c)]`).

  ### The Argument Structure (Pettigrew-style)
  1.  **Premise 1 (Accuracy Dominance):** Non-probabilistic credences are accuracy-dominated (Joyce's core argument). There exists *some* probabilistic credence that is guaranteed to be more accurate than the non-probabilistic one, no matter what the world is like. *(You seem comfortable with this part)*.
  2.  **Premise 2 (Strict Propriety):** We adopt a *strictly proper* scoring rule `s` (e.g., Brier score, Log score).
  3.  **Result from Propriety:** *All* probabilistic credences `p` are **immodest** relative to `s` (by definition of strict propriety).
  4.  **Observation:** *Some* non-probabilistic credences `c` are **modest** relative to `s`. That is, `c` itself expects some alternative credence `b*` (often probabilistic) to be more accurate than `c` is.
  5.  **Premise 3 (Immodesty Requirement/Rationality Principle):** It is irrational to adopt a credence function `c` that is **modest** relative to the *only* legitimate measure of epistemic value (accuracy, measured by `s`).
  6.  **Conclusion:** Non-probabilistic credences are irrational (both by dominance *and* by modesty). Probabilistic credences are rational (they avoid dominance *and* satisfy immodesty).

  ### Addressing Your Core Questions

  **Q1: Why is Modesty Irrational? It seems like just a label.**

  Modesty isn't *just* a label; it reveals a **deeply self-defeating inconsistency** within the agent's epistemic state:

  1.  **Self-Condemnation:** If your credence function `c` is modest, then *according to `c`'s own lights* (its own probabilities and the accepted measure of accuracy), there exists a *better*, *more accurate* way to form beliefs (`b*`).
  2.  **Epistemic Self-Sabotage:** Holding `c` while simultaneously believing (via `c`'s own expectation) that `b*` is more accurate is **epistemically incoherent**. It's like saying:
      *   *"Based on my current best judgment (`c`), my current best judgment (`c`) is not the best way to form judgments. A different judgment (`b*`) is better, even though I'm not currently using it."*
  3.  **Pragmatic Analogy:** Imagine choosing to invest all your money in Stock A while simultaneously being certain that Stock B will give you a higher return. This is practically irrational. Modesty is the *epistemic* version of this inconsistency.
  4.  **The Requirement of Self-Trust (Immodesty):** Rationality requires a minimal coherence between your *current* epistemic state and your *evaluation* of epistemic states. Your own epistemic state shouldn't tell you that it's suboptimal *by its own standards*. Immodesty ensures this coherence: your credences endorse *themselves* as the best tool for pursuing accuracy *according to themselves*.

  **Q2: Why is Strict Propriety essential? Doesn't it just bake in the conclusion?**

  Strict propriety isn't just rigging the game; it provides the **normative link** between the scoring rule and the rationality principles at play (avoiding dominance and avoiding modesty). Here's the work it does:

  1.  **Guarantees Immodesty for Probabilism:** It ensures that *every* probabilistic credence function has the key property of endorsing itself as maximally accurate. This makes probabilism *eligible* as a rational norm under the immodesty requirement.
  2.  **Reveals Modesty in Non-Probabilism:** It's the mechanism that *forces* many non-probabilistic credences to be modest. Because `p` expects only itself to be best, a non-prob `c` will often calculate that some `p` (or another `c'`) is expected to be better *than itself* under `c`'s own probabilities.
  3.  **Justifies the Scoring Rule:** The philosophical justification for strict propriety *precedes* the argument for probabilism. Why accept a strictly proper rule?
      *   **Calibration Connection:** Proper scores are sensitive to calibration (a credence of 0.7 should be right 70% of the time). A credence function that isn't "sincere" (expects others to score better) is poorly calibrated *by its own lights*.
      *   **Estimation Justification:** If you want to *estimate* your own inaccuracy based on your beliefs, the strictly proper score is the *only* one where your best estimate is achieved by reporting your true credence. Any other rule would incentivize lying to yourself about your beliefs to make your estimated score look better.
      *   **Avoiding Obvious Dominance:** Using an improper rule can lead to situations where a credence function *knows* another function is *guaranteed* to be more accurate in all worlds, which seems obviously irrational. Strict propriety prevents this pathology.
  4.  **Prevents Trivialization:** Without strict propriety, the immodesty requirement loses its bite:
      *   **Non-Strict Propriety:** Multiple credence functions (probabilistic or not) might tie for minimizing expected inaccuracy from `p`'s perspective. `p` wouldn't be *uniquely* immodest. Many credences could be immodest, making the requirement too weak to single out probabilism.
      *   **Improper Rules:** An improper rule might make *some* non-probabilistic credences immodest too, or fail to make *all* probabilistic credences immodest. The neat connection between probabilism and immodesty breaks down.
  5.  **It's Not *Just* Baking In:** While the conclusion (probabilism) follows from the premises (including strict propriety), the *justification* for strict propriety is independent and compelling based on the core epistemic goal of accuracy and avoiding the pathologies mentioned above (incentivizing insincerity, obvious dominance in estimation). Pettigrew argues we should adopt strict propriety *because* it correctly captures the concept of accuracy estimation and avoids these issues, *not* simply because it yields probabilism.

  ### The Intuitive Flow (The "So What?")

  1.  **Accuracy is the Goal:** We care about believing truths.
  2.  **Measure Accuracy Properly:** We need a scoring rule where being honest/having coherent degrees of belief is the optimal way to *estimate* your own accuracy (strict propriety). Any other rule distorts self-evaluation.
  3.  **Check Your Self-Evaluation:** If your current beliefs (`c`), using the only legitimate accuracy measure (`s`), tell you that some *other* set of beliefs (`b*`) is likely to be *more accurate* than your current ones... **that's a huge red flag!**
  4.  **The Incoherence:** It means your own epistemic standards condemn your current state. You're stuck believing something you *yourself* judge to be suboptimal for pursuing your core epistemic goal. How can you rationally persist?
  5.  **Probabilism as the Fix:** Probabilistic credences avoid this. They are immodest – they look at the accuracy landscape *through their own lens* and rightly conclude, "Yep, I'm the best tool for this job *according to the rules of accuracy we all agree on*." This doesn't guarantee they *are* the most accurate (they might be wrong!), but it guarantees they aren't *self-condemning*. They are coherently committed to themselves in the pursuit of accuracy.

  In essence, modesty is irrational because it's a form of **epistemic self-betrayal.** Strict propriety is essential because it's the feature of the accuracy measure that *makes* non-probabilistic credences self-betraying (modest) and probabilistic ones self-endorsing (immodest), *and* because it can be independently justified as the right way to measure accuracy for epistemic self-evaluation. The argument reveals that probabilism isn't just about avoiding dominance "from the outside"; it's also about achieving a necessary internal coherence in the epistemic agent's pursuit of truth.
