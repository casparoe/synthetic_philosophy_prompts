  First, there's the difference between the truth of the statement and the credibility of the speaker. The brother might be right that overspending on DoorDash is bad, but his own financial irresponsibility undermines his authority to lecture. That's the ad hominem fallacy—rejecting an argument based on the person's character rather than the argument itself. But in this case, the user isn't rejecting the advice because of who said it; they're questioning the brother's right to give it given his actions.

  Then there's the principle of standing or moral authority. If someone is guilty of the same or worse behavior, it's hypocritical for them to criticize others. The brother's sneaker and watch debts are similar to the user's delivery spending—both are discretionary, non-essential purchases. His debt is higher, so his hypocrisy is more glaring. The mom being the source adds credibility since the brother might not have disclosed it himself.

