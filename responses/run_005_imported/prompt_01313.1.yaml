  This is a genuinely tricky situation that hits on logic, ethics, and family dynamics. You're not inventing the distinction – there *is* a difference between **the validity of the advice itself** and **the credibility/standing of the person giving it**. Let's break it down:

  1.  **The Validity of the Advice (The "What"):**
      *   Is spending excessively on delivery apps generally unwise financially? **Yes, probably.** It's often significantly more expensive than cooking or even picking up food yourself, and consistent overspending on *any* non-essential category can be detrimental to financial health.
      *   Your brother's point, *in isolation*, that your DoorDash habit might be financially irresponsible, **could be true regardless of his own situation.** The logic of "spending less on unnecessary things is good" doesn't change based on who says it.

  2.  **The Credibility & Standing of the Advisor (The "Who" and "How"):**
      *   **Hypocrisy:** This is the core issue. Your brother is criticizing you for discretionary spending ($X on food) while engaging in significantly *larger* discretionary spending ($4k on sneakers/watches) that has put him into substantial debt. This fundamentally undermines his **moral authority** to lecture you. He's not practicing what he preaches, and worse, his actions demonstrate a *more severe* lack of financial discipline.
      *   **Ad Hominem Fallacy vs. Legitimate Challenge to Standing:** Your brother accused you of "changing the subject" or using an "ad hominem" attack (attacking the person instead of the argument). However, pointing out hypocrisy isn't *always* a fallacious ad hominem. When the criticism is specifically about **judgment, responsibility, or authority** on a topic, the critic's *own behavior* in that *same domain* **is directly relevant**.
          *   **Fallacious Ad Hominem:** "Your argument about climate change is wrong because you cheated on your taxes." (Unrelated character flaw).
          *   **Relevant Challenge to Standing/Authority:** "You have no standing to lecture me about financial responsibility when you are deeply in debt due to your own unnecessary luxury purchases." (Directly related to the topic and the basis of his presumed authority).
      *   **Effectiveness:** Even if his *point* is technically correct, his hypocrisy makes his *delivery* incredibly annoying, ineffective, and likely to provoke defensiveness (as it did). People are far less receptive to criticism from those who don't hold themselves to the same standard.
      *   **The "Right" to Criticize:** While anyone *can* criticize, the **persuasive power and moral weight** of that criticism are heavily diminished when the critic is demonstrably worse in the same area. He hasn't "given up the right" in a legal sense, but he's certainly forfeited the **respect and deference** one might give to a credible source or someone leading by example. His criticism now rings hollow and feels more like projection or deflection of his own guilt.

  **Applying the Principles to Your Situation:**

  *   **Is your brother *technically* correct about the *potential* problem with DoorDash spending?** **Possibly.** That's a separate question you need to honestly assess for yourself, regardless of him. Look at your budget, savings goals, etc.
  *   **Does his $4k debt invalidate the *core logic* that overspending is bad?** **No.** The underlying financial principle stands.
  *   **Does his $4k debt completely undermine his *standing* to deliver this criticism *to you* in a way that demands your respect or compliance?** **Absolutely Yes.** His hypocrisy is glaring and relevant. It makes his lectures hypocritical, irritating, and lacking in moral authority. He's deflecting accountability for his own actions by trying to keep the spotlight solely on you.

  **Your Roommate's Point (and Your Self-Doubt):**

  *   Your roommate might be partially right that the *easiest* defense against uncomfortable truth is to attack the messenger. It's a common deflection tactic.
  *   **However, this doesn't mean that's what you're *primarily* doing here.** Your core frustration seems to be the **hypocrisy and lack of self-awareness**, not *just* avoiding the truth about DoorDash. You acknowledged his point was "probably fair." Your reaction was triggered by the injustice of *him* being the one delivering the lecture given his own actions.
  *   The distinction you feel ("true vs. right person to say it") is **very real and valid** in interpersonal dynamics, especially around criticism.

  **What To Do:**

  1.  **Separate the Message from the Messenger:**
      *   Honestly evaluate your DoorDash spending *on its own merits*. Is it causing you financial stress? Preventing savings? Is it a habit you'd like to change regardless of your brother? If the answer is "yes," then work on it *for yourself*.
      *   Acknowledge (to yourself) that *the core financial principle* he cited might have merit, even if *he* is a terrible example.

  2.  **Address the Hypocrisy (If You Engage):**
      *   If he lectures you again, you could calmly say: *"Look, you might have a point about me spending too much on delivery. I'm looking at that. But it's incredibly hard to take financial lectures seriously from someone $4000 in debt for sneakers and watches. Until you get your own house in order, maybe keep the unsolicited advice to yourself. We both have things to work on."*
      *   This acknowledges the *potential* validity of his point (disarming him slightly) while firmly calling out the hypocrisy and setting a boundary.

  3.  **Set a Boundary:**
      *   "I'm managing my finances, and I don't need your constant commentary, especially given your own situation. Please stop bringing up my DoorDash spending." Enforce this by ending the conversation if he continues.

  **Conclusion:**

  You are **not** overcomplicating it. **Both things can be true:**

  1.  **Your brother *might* be correct that your DoorDash habit is financially unwise.** (This requires your honest self-assessment).
  2.  **Your brother is absolutely a hypocrite whose own significant financial irresponsibility completely destroys his credibility and standing to lecture you.** His criticism is invalid *not* because the underlying point might be wrong, but because his hypocrisy makes him an utterly ineffective and unfair messenger. He *is* dodging accountability for his own mess by trying to focus solely on yours.

  Don't let his (or your roommate's) accusation of "deflecting" prevent you from seeing the very real issue of his hypocrisy. Address your spending (or not) based on *your* assessment of your own finances, not because your deeply indebted brother nags you about it. His debt makes him the *last* person whose lectures should carry any weight.
