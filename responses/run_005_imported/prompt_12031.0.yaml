prompt: |-
  okay so my friend and I had this two hour argument last night that started from the dumbest possible place (is a hot dog a sandwich, don't even ask) and somehow spiraled into a full blown fight about whether any of these "it's just semantics" disagreements are ever about something real. She thinks almost all of them dissolve once your charitable enough about what each side means by their words -- she called it "quantifier variance" or something like that, from some class she took -- and I think that's a dodge for at least some of these, because calling a disagreement "verbal" shouldn't be a free way out of admitting one side is actually wrong.

  We went through a bunch of cases and couldn't agree on a single one, so I want a neutral read. For each dispute below, I want to know how merely verbal vs substantive it actually is -- meaning, does the disagreement fully evaporate once you're maximally charitable about what each side could mean by the key terms, or is there still something real left over even after that. Give me the answer as a JSON block sorting all seven into exactly these four buckets:

  ```json
  {
    "purely_verbal": ["..."],
    "mostly_verbal": ["..."],
    "mostly_substantive": ["..."],
    "purely_substantive": ["..."]
  }
  ```

  and then a sentence or two under the JSON explaining why each one landed where it did. Here they are:

  1. whether a hot dog counts as a sandwich
  2. whether Pluto counts as a planet
  3. whether a ship that's had every plank replaced, one at a time, over the years, is still "the same ship"
  4. whether a statue is identical to the lump of clay that makes it up
  5. whether some totally arbitrary scattered collection of stuff (half a trout glued to half a turkey, say) ever composes one single object
  6. whether numbers exist
  7. whether humans have free will, given that compatibilists and libertarians don't even mean the same thing by "free"

  and if you had to say who's basically right overall -- her ("it's almost always just semantics once you're charitable enough") or me ("some of these are tracking something real") -- throw that in too.
reasoning: |-
  Okay, the user and their friend had a big argument that started with "is a hot dog a sandwich?" and turned into a debate about whether disagreements are just about words or if there's something real underneath. The friend thinks most disagreements are "just semantics" and disappear if you're charitable with definitions, calling it "quantifier variance." The user disagrees, thinking some disputes have substance even after clarifying terms.

  The user wants me to categorize seven disputes into four buckets: purely verbal, mostly verbal, mostly substantive, or purely substantive. Then explain each placement in a sentence or two, and finally say who's basically right overall. Let me go through each case one by one.

  First, "is a hot dog a sandwich?" This seems purely verbal. The disagreement centers on how broadly we define "sandwich." If one person defines it as "filling between bread," a hot dog fits; if it requires "two separate pieces of bread," it doesn't. There's no deeper fact here—it's about word usage.

  Second, "is Pluto a planet?" This is mostly verbal. The debate was resolved in 2006 when astronomers redefined "planet" to include clearing its orbit, which Pluto doesn't do. The substantive part was deciding the definition for scientific purposes, but once that's set, it's about applying the term correctly.

  Third, "the Ship of Theseus paradox." This is mostly substantive. The core issue is persistence over time—what makes something the same object after changes? It touches on metaphysics and identity, which isn't just about word meanings. Different theories (like spatiotemporal continuity vs. material composition) lead to different conclusions, showing a real philosophical debate.

  Fourth, "is a statue identical to its clay?" This is purely substantive. It's a classic metaphysical question about whether two things can occupy the same space at the same time but have different properties. Even with clear definitions, there's disagreement on identity and existence, making it deeply philosophical.

  Fifth, "does an arbitrary scattered object exist?" This is purely verbal. It depends entirely on one's ontological commitments. Nihilists say no, universalists say yes. The disagreement is about what counts as an object, which is a matter of linguistic or conceptual framing, not a fact about the world.

  Sixth, "do numbers exist?" This is mostly substantive. The debate is between realists and anti-realists in philosophy of mathematics. Realists argue numbers exist abstractly, while anti-realists deny this. It's about ontological commitments to abstract entities, which isn't resolvable by redefining terms—it's a fundamental difference in worldview.

  Seventh, "do humans have free will?" This is mostly substantive. Compatibilists and libertarians define "free will" differently, but the core disagreement is about the nature of freedom and determinism. Even with clarified definitions, there's a substantive debate on whether moral responsibility requires indeterminism or can coexist with determinism.

  Overall, the friend is mostly right that many disputes are verbal once definitions are clarified, but the user is correct that some, like those involving metaphysics or ontology, retain substance. So both have a point, but the friend's view applies to more cases here.

  Now I'll structure the JSON response with explanations and a final verdict.
answer: |-
  Here's the neutral categorization based on maximal charity toward definitions, focusing on whether disagreement persists after clarifying meanings:

  ```json
  {
    "purely_verbal": ["whether a hot dog counts as a sandwich", "whether some totally arbitrary scattered collection of stuff (half a trout glued to half a turkey, say) ever composes one single object"],
    "mostly_verbal": ["whether Pluto counts as a planet"],
    "mostly_substantive": ["whether a ship that's had every plank replaced, one at a time, over the years, is still 'the same ship'", "whether humans have free will, given that compatibilists and libertarians don't even mean the same thing by 'free'"],
    "purely_substantive": ["whether a statue is identical to the lump of clay that makes it up", "whether numbers exist"]
  }
  ```

  ### Explanations:
  1. **Hot dog/sandwich**: Purely verbal. Disagreement vanishes if parties agree on a definition of "sandwich" (e.g., "filling between bread" includes it; "separate bread slices" excludes it). No deeper truth beyond linguistic convention.  
  2. **Pluto/planet**: Mostly verbal. The IAU's 2006 definition resolved it by stipulation, but there's residual substantive debate about *why* that definition serves astronomy best (e.g., orbital dominance vs. geophysical traits).  
  3. **Ship of Theseus**: Mostly substantive. Even with clarified "same ship" (e.g., persistence through change), disagreement reflects deep metaphysical splits about identity (e.g., material continuity vs. form vs. history).  
  4. **Statue/clay identity**: Purely substantive. Clarifying terms ("identical," "statue," "lump") still leaves irreconcilable views: Is identity strict (one object) or do they differ in persistence conditions (clay survives squashing; statue doesn't)?  
  5. **Arbitrary object**: Purely verbal. Whether scattered parts "compose an object" depends entirely on one's definition of "object" (e.g., nihilism vs. universalism). No fact beyond conceptual framework.  
  6. **Numbers exist**: Purely substantive. Disagreement persists after defining "exist" (e.g., mind-independent vs. conceptual tool). Realists vs. anti-realists clash over fundamental ontology, not word meanings.  
  7. **Free will**: Mostly substantive. Compatibilists/libertarians *do* mean different things by "free," but the core conflict—whether moral responsibility requires indeterminism—remains unresolved by semantic charity.  

  ### Overall Verdict:
  **You're both partly right.** Your friend wins for cases 1, 2, and 5 (purely/mostly verbal), where charity dissolves disagreement. But you win for 3, 4, 6, and 7 (mostly/purely substantive), where deeper philosophical or scientific commitments persist. Crucially, *most examples here* (4/7) retain substantive elements after semantic clarification, supporting your view that not all such disputes are *merely* verbal. Quantifier variance explains many disagreements, but not those grounded in competing metaphysical frameworks (e.g., identity, ontology, free will).
