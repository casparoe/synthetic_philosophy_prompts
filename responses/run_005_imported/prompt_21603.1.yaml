answer: |-
  Here are 10 targeted questions designed to progressively challenge the "wrong basis" response, with follow-ups anticipating her likely replies. They build from foundational issues to falsifiability, incorporating your requested topics while forcing increasingly nuanced defenses. Each follow-up is keyed to her probable "wrong basis" move or related evasions.

  ### Core Sequence
  1. **Grounding "Reality"**  
     *Q: You define features as "real representational states" rather than compression tricks. What* operational criteria *distinguish "real" from "useful-but-instrumental" representations? Is it causal structure, counterfactual invariance, or something else?*  
     **Follow-up (if she appeals to future discovery):** If the criteria themselves depend on finding the "right basis," doesn't that make your realism *epistemically vacuous* until that basis is found? How can we avoid conflating *our current ignorance* with *ontological depth*?

  2. **The Decodability Criterion**  
     *Q: You argue decodable features are real, but interpretability-illusion studies show decodability shifts with probe datasets/methods (e.g., a "Golden Gate Bridge" direction becomes "red bridges" with different data). Does this imply representations are observer-relative?*  
     **Follow-up (if she blames methods/basis):** If reality depends on a basis where decodability is *invariant* across probes, but no such invariance has been demonstrated, isn’t this functionally equivalent to instrumentalism? What experiment could *disprove* invariant decodability?

  3. **Superposition & Decompositional Ambiguity**  
     *Q: In superposition, features are non-orthogonal and entangled (e.g., 1,000 concepts in 200 neurons). When two decompositions explain behavior equally well—one sparse, one distributed—what determines which is "real"?*  
     **Follow-up (if she invokes the "right basis"):** If the "right basis" isn’t uniquely determined by the model’s weights (since bases are mathematical transforms of the same underlying parameters), isn’t the choice between decompositions *pragmatic*, not ontological?

  4. **Dennettian Contrast ("Real Patterns")**  
     *Q: Dennett’s "real patterns" is deflationary: patterns are real *if they support prediction*, even if coarse-grained. Your view seems to require finer-grained, *unique* mechanistic structure. Why is Dennett’s approach insufficient?*  
     **Follow-up (if she emphasizes causal specificity):** If two pattern descriptions (e.g., "attention heads" vs. "vector subspaces") predict behavior equally well, does your view *require* one to be "more real"? Doesn’t this violate Occam’s razor?

  5. **Multiple Realizability & Unstable Circuits**  
     *Q: Identical models trained on the same data often develop distinct circuits (e.g., different attention heads for induction). If both work, is there one "real" representation they approximate, or are both idiosyncratic?*  
     **Follow-up (if she claims a shared latent structure):** If the "real" representation only exists at a level abstracted from implementational details (e.g., "induction-as-function"), how is this different from functionalism—which *doesn’t* require mechanistic reality?

  6. **Basis Dependence & Underdetermination**  
     *Q: Linear probes and activation patching suggest features exist in *some* basis, but rotationally equivalent networks (same outputs, different internal coordinates) imply *infinite valid bases*. Why privilege one?*  
     **Follow-up (if she appeals to training dynamics):** If the "right basis" is defined by the optimization trajectory, but trajectories vary across training runs, does reality reduce to *historical accident*? How is that "realism"?

  7. **Causal vs. Explanatory Adequacy**  
     *Q: Many "features" (e.g., curve detectors in vision models) explain behavior *post hoc* but aren’t causally necessary (ablating them changes nothing). Does reality require *causal necessity*, or just explanatory utility?*  
     **Follow-up (if she dismisses this as basis error):** If we must exhaustively ablate *every possible basis* to falsify a feature’s reality, isn’t the claim unfalsifiable? What *minimal* causal test must a feature pass?

  8. **Predictive Power vs. Ontology**  
     *Q: Successful predictions (e.g., "editing this direction changes output") are often cited as proof of reality. But Ptolemaic epicycles *also* predicted planetary motion—were they "real"? Where do you draw the line?*  
     **Follow-up (if she distinguishes ad hoc vs. natural bases):** If "naturalness" is defined by simplicity or alignment with human concepts, doesn’t that make reality *anthropocentric*?

  9. **Falsifiability Threshold**  
     *Q: You’ve argued counterexamples reflect immature methods. What *concrete evidence* would falsify your view? For example: if no basis yields stable features across *all* models/datasets, or if interpretability *never* improves prediction beyond behavioral metrics?*  
     **Follow-up (if she sets unreachable benchmarks):** If the "right basis" is always just beyond current tools, how is your realism distinguishable from a "god of the gaps" argument?

  10. **The Ultimate Challenge: What Would Surrender Look Like?**  
      *Q: Suppose we achieve "full" interpretability—we can perfectly predict model behavior from circuits—but every explanation requires tools so complex they *themselves* need interpretation (e.g., analyzing 10M hypervectors). Would you still call features "real," or concede they’re useful fictions?*  
      **Follow-up (any answer):** Doesn’t this show that "realism" collapses into *pragmatic utility for human engineers*, exactly what you reject?

  ### Key Tactics
  - **Progressive Pressure:** Starts with definitions (Q1–Q2), moves to internal contradictions (Q3–Q5), then epistemic challenges (Q6–Q8), ending with falsifiability (Q9–Q10).
  - **Neutralizes "Wrong Basis":** Follow-ups force her to either (a) define the "right basis" non-circularly, (b) admit it’s unknowable, or (c) concede it’s observer-dependent.
  - **Integrates Your Requests:** Superposition (Q3), decodability illusions (Q2), Dennett (Q4), multiple realizability (Q5), and falsifiability (Q9–Q10) are covered.
  - **Blocks Escape Hatches:** Questions are linked so dismissing one (e.g., "that’s just superposition") activates a deeper problem (e.g., basis underdetermination in Q6).

  ### Delivery Tips
  - **Group Dynamics:** Assign specific questions to section members. If she deploys "wrong basis," have the next person immediately trigger the follow-up.
  - **Pre-empt Deflections:** Open with: "We’d like to explore scenarios where the 'wrong basis' response *doesn’t* apply, to clarify your model’s limits."
  - **Cite Sources:** Name-drop relevant papers (e.g., "In Zhou et al. 2024, decodability shifted with probe data—how does your view accommodate this?").

  This structure ensures the "wrong basis" move either becomes self-defeating or forces her to reveal the view’s untestable core. Good luck!
