  We are going to design a sequence of questions that progressively challenges the "wrong basis" move. The goal is to push the philosopher to clarify her position and to confront potential weaknesses. We'll structure the questions so that the easy "wrong basis" response becomes less tenable as we proceed.

  The questions we need to cover (as per the user's request):
  1. Superposition: How to handle overlapping, non-orthogonal features? What makes one decomposition "real"?
  2. Decodability illusions: If decodability depends on the probing method/dataset, is decodability sufficient for reality?
  3. Comparison to Dennett's "real patterns": How is her realism different (thicker) than Dennett's deflationary version?
  4. Multiple realizability: If different circuits achieve the same function, what happens to the representation?
  5. What would count as evidence against her view?

  We'll design 8-10 questions in total, with follow-ups that anticipate her likely responses (especially the "wrong basis" move) and make that move harder to use as we go.

  Strategy:
  - Start with questions that set up her view and allow her to explain it.
  - Then move to challenges that are classic but for which the "wrong basis" move is still easy.
  - Gradually introduce harder cases (superposition, interpretability illusions) that strain the "wrong basis" response.
  - Then bring in Dennett to force a contrast and highlight the thickness of her realism.
  - Multiple realizability to challenge the uniqueness of representations.
  - End with what would falsify her view, pushing her to specify the conditions under which she would abandon representational realism.

  Let's design the questions:

  1. **Introductory question to set the stage:**
     - Q: You argue that features found in mechanistic interpretability are real representational states. Could you clarify what you mean by "real" in this context? How does this realism differ from instrumentalist or pragmatic views of representation in neural networks?
     - Follow-up (if she gives a standard realist answer): If we accept that the model has a representational structure, but our current methods only give us an approximation, how do we know we are on the right track? What criteria do we use to judge that we have found the "right basis"?

  2. **Question on the role of the basis:**
     - Q: A core part of your view is that when we don't find a clean feature, it's because we haven't found the right basis. What constitutes the "right basis"? Is it defined by the model's architecture, the training data, the loss landscape, or something else?
     - Follow-up (if she says it's defined by the model's internal structure): But the model's internal structure is fixed by the weights, which are the same regardless of the basis we choose to analyze it in. How can there be a fact of the matter about which basis is the right one if the weights are the same in every basis?

  3. **Question on superposition:**
     - Q: In sparse coding, features are often represented in an overcomplete basis, leading to superposition where features are packed into overlapping, non-orthogonal directions. Given that there are more concepts than neurons, what makes one decomposition into features the "real" one, rather than just a useful one for our interpretability purposes?
     - Follow-up (if she uses the "wrong basis" move): But if the model's representational capacity requires superposition and the features are inherently entangled, doesn't that suggest that the model doesn't have a unique decomposition? How can we say there is a fact of the matter about which features are real when multiple decompositions are mathematically equivalent?

  4. **Question on interpretability illusions and decodability:**
     - Q: There's a growing literature on "interpretability illusions" showing that what we decode from a neuron or direction can vary significantly with the probing dataset or method. If decodability is contingent on these factors, does that mean that the representational reality of a feature is also contingent? Or is decodability just a tool that sometimes reveals reality and sometimes doesn't?
     - Follow-up (if she says that illusions occur because we haven't found the right basis): How can we tell the difference between an illusion and a genuine feature? If the same neuron can appear to represent different features under different probes, what grounds do we have for saying that one of them is the real representation and the others are artifacts?

  5. **Question on the relationship between decodability and reality:**
     - Q: You seem to hold that when we can decode a feature, that is evidence for its reality. But is decodability sufficient for reality? Could there be cases where a feature is decodable but not real (an illusion) or real but not decodable (due to our current methods)? How do we navigate this?
     - Follow-up (if she insists that decodability is evidence but not sufficient): Then what additional criteria must be met for a feature to be real? And how do we test for those criteria without circularity (since we rely on interpretability methods to find them)?

  6. **Question comparing to Dennett:**
     - Q: Your view is described as a form of realism. How does it relate to Dennett's "real patterns"? Dennett's view is often seen as a deflationary realism: patterns are real if they are projectible and support counterfactuals, but they don't require a unique or fundamental level of description. Your view seems to want something thicker. Can you clarify the difference?
     - Follow-up (if she distinguishes by appealing to a unique basis or causal structure): But if the model's behavior can be predicted by multiple patterns at different levels (as in multiple realizability), why should we think there is a privileged level of representation? Doesn't Dennett's view accommodate the utility of interpretability without committing to a unique decomposition?

  7. **Question on multiple realizability:**
     - Q: If we train two instances of the same architecture on the same data and they solve a task with different circuits (e.g., one uses an induction head and the other uses a different mechanism), does each model have its own real representations? Or is there a single set of representations that both are approximating? And if they are different, how does that affect the reality of the representations?
     - Follow-up (if she says each model has its own real representations): Then what makes a representation real if it is not shared across models that are behaviorally equivalent? And if we can't generalize across models, what does that say about the project of mechanistic interpretability as revealing general truths about how models work?

  8. **Question on the status of the field and falsifiability:**
     - Q: You often respond to objections by saying that the field is in its early days and we haven't found the right basis yet. What would count as evidence against your view? In other words, what empirical result would make you abandon representational realism?
     - Follow-up (if she says that there is no such evidence, or it's too early): But if the view is unfalsifiable, how is it different from a faith-based position? And if we can only confirm it (by eventually finding the right basis) but never disconfirm it, doesn't that make it unscientific?

  We have 8 questions. We can add two more to deepen the challenge:

  9. **Question on the role of the observer:**
     - Q: Some argue that interpretability is inherently observer-relative: what counts as a feature depends on our interests and the questions we ask. How does your realism account for the role of the observer? Is there a fact of the matter about the model's representations that is independent of our interpretative practices?
     - Follow-up (if she says the representations are objective): But if the same model can be interpreted in multiple ways (e.g., at different levels of granularity) and all are useful, why should we think that one of them is the uniquely correct one? Doesn't that suggest that the reality of representations is relative to a perspective?

  10. **Question on the success conditions of mechanistic interpretability:**
      - Q: If representational realism is true, what should we expect the end state of mechanistic interpretability to look like? Will we eventually have a complete and unique decomposition of the model into its real features and circuits? And if we don't achieve that, at what point should we conclude that the project is failing?
      - Follow-up (if she says we will eventually find the right basis): What is the timeline for this? And what are the milestones we should expect along the way? Without clear benchmarks, how can we avoid the charge that representational realism is just a promissory note?

  Now, let's arrange the questions in an order that builds the challenge:

  1. Start with the introductory question (1) to set the stage.
  2. Then question 2 on the basis to set up the key concept.
  3. Then question 9 on the observer to introduce relativity.
  4. Then question 3 on superposition to challenge uniqueness.
  5. Question 4 on interpretability illusions to challenge decodability.
  6. Question 5 on decodability vs reality to deepen the challenge.
  7. Question 6 on Dennett to compare with a deflationary view.
  8. Question 7 on multiple realizability to challenge generality.
  9. Question 8 on falsifiability to push on the promissory note.
  10. End with question 10 on success conditions to tie it together.

  Alternatively, we can group by theme. But the above order is designed to make the "wrong basis" move harder as we go.

