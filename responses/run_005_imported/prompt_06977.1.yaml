  Closing demands concrete falsifiability. If "unfinished" excuses everything, what wouldn't it excuse? Question 8 forces the scholar to define what evidence could contradict them, exposing circular reasoning. Bonus if the journalist implies that over-reliance on incompleteness might itself be poor scholarship.

