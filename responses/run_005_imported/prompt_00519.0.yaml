prompt: |-
  My colleague and I run a small consulting partnership and split the profits from our joint contracts according to an informal agreement anchored to what each of us would earn if we worked entirely on our own. Recently, my colleague received an extremely lucrative outside job offer that they have no real intention of accepting, but they argue that this offer raises their theoretical "ceiling" in our partnership and therefore entitles them to a larger share of our joint profits, even though neither of our actual fallback positions has changed. It strikes me as strange that a hypothetical outcome neither of us will ever realize should affect how we divide real, current earnings, but I can't quite articulate why this bothers me. Is my colleague's reasoning defensible, or am I right to resist it?
reasoning: |-
  Okay, let me start by unpacking this user's situation. They run a consulting partnership with a colleague, and profits are split based on what each would earn if working alone. Now, the colleague got a lucrative job offer they won't accept but uses it to demand a larger share. The user feels this is unfair but can't articulate why. 

  First, I need to understand the core issue. The colleague's argument hinges on opportunity cost—the offer raises their theoretical ceiling. But the user points out that neither's actual fallback position changed. So the conflict is between theoretical opportunity cost versus real-world alternatives. 

  I recall negotiation theory concepts like BATNA (Best Alternative to a Negotiated Agreement). BATNA is about real alternatives, not hypotheticals. The colleague's offer isn't actionable since they won't accept it, so it shouldn't affect the BATNA. That's a key point. 

  Then there's the fairness aspect. The user might feel this move is opportunistic. If the colleague uses this offer to renegotiate, what stops them from doing it repeatedly? It could destabilize the partnership. Also, the user's contributions might be undervalued now. 

  I should consider the practical implications. If they adjust the split based on this offer, does that mean every future offer reopens negotiations? That seems unsustainable. Plus, the offer isn't a reflection of the colleague's current market value since they're not leaving. 

  The user's discomfort makes sense. The colleague's reasoning conflates theoretical value with actual alternatives. The partnership's profit split should be based on real options, not hypotheticals. Maybe the user needs to frame the discussion around BATNA and mutual benefit to counter the colleague's argument. 

  Also, the colleague might be testing leverage. The user should assess if this is a one-time ask or a pattern. Addressing the underlying concerns—like recognition or perceived value—could resolve this without changing the split. 

  In conclusion, the user's resistance is valid. The colleague's argument isn't defensible because it relies on a non-actionable offer. The response should emphasize real alternatives, stability, and mutual benefit to navigate the negotiation.
answer: |-
  Your discomfort is entirely justified—your colleague's reasoning is economically flawed and risks destabilizing your partnership. Here's why:

  ### Core Problems with Their Argument
  1. **Opportunity Cost Requires Actionable Alternatives**  
     Opportunity cost (the foundation of "what you'd earn alone") only matters when alternatives are *realistic and actionable*. An offer your colleague would never accept is economically irrelevant—it's theater, not leverage. If they wouldn't take the job, it doesn't change their actual best alternative (their true "ceiling").

  2. **BATNA ≠ Hypotheticals**  
     In negotiation theory, your fallback position is your **BATNA (Best Alternative To a Negotiated Agreement)**. BATNAs must be *executable*—otherwise, they’re mere fantasies. Your colleague’s BATNA remains unchanged: it's still what they’d earn working solo *without* this offer.

  3. **The Slippery Slope of "Hypothetical Value"**  
     If unaccepted offers justify recalibration, what stops either of you from:
     - Fabricating offers?
     - Using decade-old peak salaries?
     - Claiming "potential" earnings from industries neither of you work in?
     This turns profit-sharing into speculative gambling, not a stable partnership.

  ### Why Your Resistance Is Correct
  - **Partnerships Thrive on Real Value, Not Fiction**  
    Your profit split should reflect **actual contributions and real alternatives**. Introducing phantom numbers distorts incentives and invites manipulation.
    
  - **This Rewards Bluffing, Not Performance**  
    Your colleague seeks more profit share for *imagined* leverage, not for delivering greater value. This erodes trust—the foundation of any partnership.

  - **Stability Matters**  
    Constantly renegotiating terms based on hypotheticals creates chaos. If their logic stood, every LinkedIn message with a high salary range could justify a new demand.

  ### How to Respond (Strategically)
  1. **Frame It as a Partnership Principle**  
     > *"Our split works because it’s anchored to what we’d realistically earn if we parted ways—not unaccepted offers. If we use fantasies, neither of us can trust the agreement."*

  2. **Call Out the Inconsistency**  
     > *"If you genuinely believed this offer reflects your market value, you’d take it. Since you won’t, it clearly doesn’t change your actual alternatives."*

  3. **Redirect to Shared Success** (If you want to preserve harmony)  
     > *"If you feel undervalued, let’s discuss your contributions—not hypotheticals. What tangible outcomes can we tie your share to?"*

  4. **Set a Boundary**  
     > *"Using unaccepted offers to renegotiate sets a precedent that could destabilize us. I won’t agree to that, but I’m open to revisiting terms if our actual alternatives change."*

  ### If They Persist: The Underlying Issue
  This likely isn’t about the offer—it’s a signal your colleague:
  - Feels undervalued in general, or  
  - Wants to renegotiate terms but lacks justification, or  
  - Is testing how much leverage they can wield.

  **Probe deeper**: *"Help me understand why this offer feels relevant when it doesn’t change your plans. Is there something else about our arrangement that isn’t working?"*

  ### Bottom Line
  Their argument isn’t defensible—it confuses theoretical bragging rights with genuine economic alternatives. Hold firm: partnerships collapse when abstract "what-ifs" override real-world contributions and trust. If they push this, insist on using **verifiable, actionable alternatives only**. Anything less invites perpetual renegotiation in bad faith.
