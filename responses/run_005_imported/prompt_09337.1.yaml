prompt: |-
  I write questions for a podcast segment that stages imagined interviews with historical philosophers, and the next episode "interviews" George Berkeley about the theory of money he develops in The Querist -- not his immaterialism, but his claims that money has no intrinsic value and is better understood as a kind of ticket or counter for a power to command goods and labour, together with his proposal that Ireland's chronic shortage of circulating coin be remedied by a national bank issuing paper credit not fully backed by gold and silver. Draft eight to ten interview questions that go beyond having him restate the position: I want at least one question on how the "power" analysis of money is meant to differ from simply saying that its value is a matter of convention or naming, one that presses on whether his case for unbacked paper credit depends on Ireland's particular predicament -- a persistent drain of specie to absentee landlords and an adverse balance of trade -- rather than holding for any economy, and one that asks whether treating money's value as relational rather than intrinsic actually follows from his immaterialist metaphysics or merely echoes it in convenient terms. For each question, add a short follow-up keyed to the answer he's most likely to give.
