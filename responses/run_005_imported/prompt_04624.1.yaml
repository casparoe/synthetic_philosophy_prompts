answer: |-
  ## The Shelf of Being: A Mereological Duel

  **Setting:** A living room floor littered with flat-pack panels, screws, instruction manuals, and tools. Half a shelf structure leans precariously. **ALEX (Nihilist)** is holding a screwdriver, gesturing at the mess. **SAM (Universalist)** is holding a panel, looking exasperated.

  **ALEX:** ...and *that’s* precisely my point, Sam. Look at it! We have Panel A, Panel B, Screws 1 through 8, these little plastic dowel things… *individual simples*. They’re spatially co-located, interacting via fundamental forces – gluons, electromagnetism, whatever. But where’s the *shelf*? Point to the extra entity, the "shelf substance," that magically popped into existence just because we stuck a few bits together according to IKEA’s pictograms.

  **SAM:** (Taps the leaning structure firmly) Right here, Alex! This coherent, load-bearing *thing* that wasn’t here five minutes ago. You’re suffering from a serious case of *ontological parsimony*. Just because it’s composed of parts doesn’t mean *it* doesn’t exist. Are you denying the existence of *mountains* because they’re just rocks arranged mountain-wise? Or *trees* because they’re just cells arranged tree-wise? Where does it end?

  **ALEX:** It ends with the fundamental constituents, Sam! Mountains and trees are useful *descriptions* of complex arrangements – patterns in the distribution of simples. Saying "the mountain exists" is shorthand for "there are simples arranged mountain-wise over there." We don’t need to posit an extra layer of *things* on top of the simples doing all the work. That’s precisely what "arranged shelf-wise" captures. The aerodynamic properties emerge from the quark-configuration; no "wing" is needed. Same principle.

  **SAM:** But that’s where your view gets *arbitrary*, Alex. Seriously, *when* does composition happen? We just attached this side panel. Was it *not* a shelf before we put this screw in? What about before *that* screw? Is there a magic screw? The **argument from vagueness** demolishes your position. If composition requires some specific, complex arrangement, there must be a precise, non-arbitrary threshold where simples suddenly compose a new object. But such a threshold is impossible! Assembly is a continuous process. Your nihilism forces absurd, sharp boundaries onto a fuzzy world. Universalism avoids that mess entirely – composition *always* happens, no arbitrary lines needed.

  **ALEX:** (Leans back, smirking) Ah, the vagueness siren song. But dodging vagueness by accepting *everything*? That’s like curing a headache with a guillotine, Sam! Lewis might call unrestricted composition **"ontologically innocent"** – just taking the parts we already admit and saying they have a fusion – but it’s *conceptually disastrous*. It forces you to accept the existence of monstrosities! Right now, sitting on this carpet, *there exists an object composed of this screw, that dust bunny under your chair, and the Andromeda galaxy*. You *have* to believe in that thing, Sam! Lewis’s own **trout-turkey** – the mereological sum of a trout and a turkey. What *is* that? What properties does it have besides occupying that scattered region of spacetime? It’s not a biological kind, not a functional unit... it’s ontological junk! Your ontology is cluttered with infinitely many gerrymandered, pointless entities. My "arranged X-wise" paraphrases capture all the *meaningful* unity – functional, causal, spatial cohesion – without polluting reality with every conceivable sum.

  **SAM:** (Points emphatically) First, the "junk" objection is just aesthetics! Reality doesn't care if *you* find trout-turkeys ugly or pointless. Second, you’re conflating *existence* with *significance*. Yes, the screw-dust-Andromeda object exists. So what? It’s causally inert *as a whole*, irrelevant to our lives, not a *natural kind*. We ignore it, just like we ignore most of the vast, boring cosmos. That doesn't mean it *isn't there*. Your "arranged X-wise" *presupposes* the unity you're trying to deny! When you say "arranged *shelf*-wise," you're invoking the *concept* of a shelf – its function, its structure. That concept *defines* the arrangement. But the simples themselves don't "know" they're arranged shelf-wise; they just are. The **unity** – the fact that *these* simples, in *this* configuration, constitute a single functional entity for *us* – is *real*, and universalism captures that by saying there *is* an object there. Denying it forces you into this awkward dance where you talk *as if* shelves exist while insisting they *fundamentally* don't.

  **ALEX:** No! The *unity* isn't a *thing*, Sam, it's a *relation* or a *pattern* instantiated by the simples! The concept "shelf" is a useful cognitive tool for tracking a specific, stable, useful configuration of matter. The simples instantiate shelf-patterned properties *collectively* without needing a "shelf" entity over and above them. The causal powers, the spatial boundaries – they all emerge from the micro-physical interactions. Positing a "shelf" adds *nothing* explanatory. And crucially, it avoids the ontological explosion *you* embrace. Why multiply entities beyond necessity?

  **SAM:** Because "necessity" is doing all the work here, Alex! You’re smuggling in a criterion – functional utility, causal cohesion, human significance – to decide *which* arrangements deserve our *attention*, and then pretending that only the *attended-to* arrangements have composed objects! But reality isn't defined by human interests. The simples *are* arranged screw-dust-Andromeda-wise *right now*, instantiating *that* pattern just as much as they instantiate shelf-wise. Why privilege one pattern over another ontologically? Universalism treats all patterns equally – if there are simples arranged F-wise, then the fusion of those simples exists. The *significance* is separate. Your nihilism privileges certain patterns *as patterns* but denies them ontological status *as objects*, which seems incoherent. If the pattern is real enough to ground all our talk and science, why is it not real enough to count as an object?

  **ALEX:** (Rubs temples, looking at the half-shelf) Okay... let's localize this. Maybe the disagreement isn't *just* about vagueness, or even about what exists in the broadest sense. It feels deeper. For you, Sam, "objecthood" is incredibly cheap – it just requires co-existence and being considered together, even if only as a sum. Existence is permissive. For me... "object" implies a certain *robust unity* – causal integration, spatial boundedness, functional cohesion – that isn't *always* present just because things are near each other. My "arranged X-wise" paraphrase *is* my way of capturing that robust unity *without* reifying it as a distinct entity. It’s about what *counts* as a distinct entity within our fundamental ontology. You see the fusion as a harmless addition; I see it as a category mistake, conflating patterns with substances. Is this about... the very *meaning* of "thing" or "object"?

  **SAM:** (Nods slowly, putting down the panel) I think you’ve hit it. For me, "existence" is minimal: if there are things located in some region (even scattered!), their fusion exists. It *is* a thing. The *salience* of that thing – whether it's a shelf, a trout-turkey, or cosmic dust – is a separate, pragmatic question. For you, "existence" (at least for composite objects) carries a heavier burden – it requires a specific *kind* of unity or function that only *some* arrangements achieve. You think my view makes "existence" too thin and promiscuous; I think yours makes it too demanding and anthropocentric. It’s fundamentally about the *criteria for being an object* – minimal existence vs. robust unity. The shelf assembly... (gestures at the leaning mess) ...it just makes the abstract disagreement painfully concrete.

  **ALEX:** (Picks up a screw, examining it) Painfully concrete indeed. So... we agree there are simples arranged in various ways. We agree some arrangements are more significant to us than others. We *disagree* on whether every arbitrary arrangement of those simples constitutes a *further object* in the world, over and above the simples themselves and the relations between them. You say yes, it’s innocent. I say no, it’s multiplying entities beyond necessity and creating ontological monsters. And *that*... (taps the screw against the panel)... is why this pile isn't a shelf *yet*, just parts arranged... increasingly shelf-*ward*.

  **SAM:** (Sighs, picks up the instruction manual again) Fine. But *philosophically*, Alex, it *is* a shelf. Now, hand me that Allen key before this *robustly unified functional entity* collapses onto your foot, you reductionist heathen. The argument might not resolve, but the shelf needs building.

  **ALEX:** (Hands over the Allen key, grinning) Only because *we're* arranging the simples functional-furniture-wise. Get screwing, universalist. *(They both return to the assembly, the ontological tension momentarily suspended by the practical need for structural stability).*
