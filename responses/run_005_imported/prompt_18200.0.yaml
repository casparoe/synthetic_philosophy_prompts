answer: |-
  Here is a eulogy crafted for Marcus, honoring his specific request, his intellectual rigor, his personal warmth, and the diverse audience who loved him:

  ---

  **For Marcus**

  Good morning. Standing here to speak about Marcus feels… well, it feels like trying to summarize a complex, beautiful equation with only a few variables. He was my closest friend for thirty years, my statistical conscience, and a man whose absence leaves a profound silence.

  Many of you knew Marcus as a husband, father, grandfather – a man who could be delightfully stubborn about the proper way to load the dishwasher, yet infinitely patient teaching a grandchild chess. Others knew him as a mentor, a colleague whose office door was always open, even when buried in proofs. And many knew him as a fierce defender of a particular way of seeing the world – a way grounded in clarity, evidence, and a specific kind of statistical rigor.

  Marcus lived in a world of data and decisions. He dedicated his life to understanding how we can draw reliable conclusions from the messy, noisy reality we observe. For him, statistics wasn’t just arithmetic; it was a philosophy of knowledge, a framework for navigating uncertainty with integrity. He was a champion of the Neyman-Pearson approach – a framework built on clear definitions, controlled error rates, and the careful separation of the decision *to act* from the messy business of *belief*. He believed in setting the rules *before* you saw the data, like setting the course before a voyage, to avoid being swayed by the winds of chance or wishful thinking.

  He watched the recent methodological reforms sweeping science – preregistration, bigger studies, transparency – with approval. These, he argued passionately, were simply *good practice* within the frequentist tradition he upheld. They were about making the voyage more robust, the instruments more precise. What truly vexed him, what brought that characteristic furrow to his brow and a sharpness to his usually warm voice, was when these practical, procedural improvements were claimed as victories for a fundamentally different statistical philosophy – Bayesianism. “They kept the arithmetic,” he’d grumble, “and stole the credit.” He saw it as a misattribution of motive, a blurring of distinct intellectual lineages. It wasn't the *improvements* he objected to; it was the rewriting of their history and their philosophical home.

  This wasn't abstract for him. It touched deep relationships. Two of his own brilliant doctoral students became ardent Bayesians. The intellectual divergence created a distance, a subtle fracture in those bonds that Marcus felt far more acutely than he ever publicly admitted. He respected their intellect, fiercely, but the divergence pained him. It was a personal reminder that the quest for truth can sometimes divide even those united by mutual respect and affection.

  Shortly before he left us, Marcus gave me two very Marcus-like instructions about this moment. Half-joking, but entirely serious: First, I was not to let his funeral become the occasion where “the Bayesians finally won.” Second, and equally important, I was absolutely *not* to turn his eulogy into a defense of significance testing or a polemic against Bayesian ideas. He understood the debate was complex, ongoing, and far bigger than any one person. His point was never that his chosen framework was the *only* valid one, but that its principles – clarity, pre-specified rules, a focus on error control in decision-making – deserved to be understood and respected on their *own* terms, not co-opted or misrepresented.

  So, how do we honor Marcus today? We honor him by remembering his intellectual honesty. He demanded rigor, not because he loved numbers for their own sake, but because he cared desperately about getting it *right*, about building knowledge on solid ground. He championed good practices like preregistration and large samples *because* they made the process more transparent and reliable, within the framework he believed best served science's goals.

  We honor him by remembering his kindness, often hidden beneath a gruff exterior. That open door policy wasn't just for statistical quandaries. It was for life's messier problems too. He listened, truly listened, even when he disagreed.

  And we honor him by remembering his courage. It takes courage to hold fast to a principle, especially when it makes you seem stubborn or out of step. It takes courage to mentor brilliant minds knowing they might choose a different path. It takes courage to face the end with the clarity to joke about statistical philosophy at your own funeral, while also ensuring the focus remained on the human connections that truly matter.

  Marcus was rigorous. He was stubborn. He was deeply, unfailingly kind. He was my friend. He believed in clear rules, honest accounting, and the profound importance of trying to get it right. He believed even more profoundly in the people he loved. That is the equation of Marcus we hold onto today – a brilliant mind, fiercely principled, anchored by a warm and generous heart. We will miss him terribly.

  ---

  **Why this works:**

  1.  **Honors His Specific Request:** Explicitly states his two funeral instructions. Acknowledges the debate without declaring a victor ("complex, ongoing, and far bigger than any one person") and avoids defending significance testing while accurately explaining his position ("clarity, pre-specified rules, a focus on error control... deserved to be understood and respected on their *own* terms").
  2.  **Accurately Represents His Position:** Explains *why* he championed reforms (good frequentist practice) and *why* he objected to their Bayesian branding ("misattribution of motive," "blurring of distinct intellectual lineages"). Uses his exact quote.
  3.  **Humanizes the Conflict:** The story of his students makes the abstract debate personal and poignant, revealing his hidden regret and deep respect for intellectual integrity even in disagreement.
  4.  **Accessible to All Audiences:**
      *   **Family:** Starts and ends with personal warmth ("husband, father," "stubborn about the dishwasher," "teaching chess," "kindness," "warm and generous heart"). Uses relatable metaphors ("summarize a complex equation," "setting the course before a voyage," "the equation of Marcus").
      *   **Working Scientists:** Connects his philosophy to the practical reforms they know (preregistration, large samples) and explains *why* he supported them within his framework.
      *   **Statisticians:** Uses precise terminology (Neyman-Pearson, frequentist, Bayesian, preregistration, error control) and accurately captures the nuance of his irritation and his core principles.
  5.  **Functions as a Eulogy:** Focuses on his character ("intellectual honesty," "rigor," "kindness," "courage"), his relationships (mentorship, friendship, family), and the personal impact of his loss ("profound silence," "miss him terribly").
  6.  **Respectful Tone:** Avoids caricature of either side. Presents his view passionately but fairly, acknowledging the validity of the ongoing discussion.
  7.  **Time:** The core message is delivered concisely, fitting comfortably within an 8-minute personal remembrance window.

  This eulogy celebrates Marcus as a whole person – a brilliant statistician fiercely devoted to his intellectual principles, a dedicated mentor, a loyal friend, and a loving family man – ensuring everyone in the room has something meaningful to hold onto.
