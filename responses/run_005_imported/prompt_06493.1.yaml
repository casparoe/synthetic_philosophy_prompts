answer: |-
  To ensure your Prisoner's Dilemma assignment demonstrates program equilibrium and incentivizes cooperation while accounting for real-world code limitations, here's a streamlined design based on the literature and practical considerations:

  ### **Key Implications from Program Equilibrium Literature**
  1. **Source Code Transparency**:  
     - Programs must condition their actions on proofs about the opponent's behavior (via their source code), per Tennenholtz and Löbian mechanisms (e.g., FairBot).
     - **Practical Shortcut**: Students don’t need full theorem provers. Use **bounded proof-search** (e.g., simulation with recursion limits) to approximate Löbian reasoning.

  2. **Equilibrium Requirements**:
     - **Mutual Cooperation**: Achieved when programs prove their cooperation implies the opponent’s cooperation (via Löb’s theorem).
     - **Robustness**: Programs should cooperate with **semantically equivalent** (not just identical) opponents. Encourage checks for equivalence (e.g., simulation under cooperation assumptions).

  3. **Failure Modes in Practice**:
     - **Incomplete Proof Search**: Finite computation may miss valid proofs, causing unnecessary defection.
     - **Adversarial Code**: Opponents may exploit bugs, timeouts, or simulation loops.
     - **Gödelian Obstacles**: Some programs can’t be proven to cooperate (e.g., if they check for their own proofs).

  ---

  ### **Assignment Design & Grading**
  #### **1. Program Interface & Rules**
  - **Function Signature**:  
    `def strategy(my_source: str, opponent_source: str, depth: int) -> str`  
    Returns `"C"` or `"D"`.  
    - `my_source`, `opponent_source`: String representations of each program.  
    - `depth`: Recursion limit for simulation/proof search (decremented per call).
  - **Helper Function**: Provide `simulate(opponent_source: str, my_action: str, depth: int) -> str`:  
    Simulates `opponent_source` against a bot that always plays `my_action` at `depth-1`.  
    (Prevents infinite recursion; students use this instead of raw eval).

  #### **2. Tournament Setup**
  - **Depth Limit**: Set `max_depth=5` (tradeoff: depth 0 = defect, depth 5 approximates "fair" cooperation).
  - **Timeout**: 1 second per move (auto-defect on timeout).
  - **Match Types**:  
    - Self-play (identical code).  
    - Against known bots (Cooperator, Defector, FairBot).  
    - Round-robin between submissions.
  - **Scoring Matrix**:  
    - Mutual Cooperation: (3, 3)  
    - Defection vs Cooperation: (5, 0)  
    - Mutual Defection: (1, 1)  

  #### **3. Grading Criteria**
  - **Performance (50%)**: Total score across all matches.  
  - **Robustness (30%)**: Points lost when exploited (e.g., cooperating with a defector).  
  - **Code Quality (20%)**:  
    - Does it **cooperate with itself**? (Essential for program equilibrium).  
    - Does it **cooperate with FairBot**? (Tests Löbian reasoning).  
    - Does it **defect against known exploiters**? (e.g., agents that defect if `depth==0`).  
  - **Bonus Points**: For cooperating with diverse opponents (not just clones).

  #### **4. Reference Implementations**
  Provide these bots to test against:

  ```python
  # Cooperates unconditionally
  def cooperator(_, __, ___) -> str:
      return "C"

  # Defects unconditionally
  def defector(_, __, ___) -> str:
      return "D"

  # Cooperates if opponent is a syntactic copy of itself
  def clone_bot(my_source, opponent_source, depth) -> str:
      return "C" if opponent_source == my_source else "D"

  # Depth-limited FairBot (Löbian-style)
  def fairbot(my_source, opponent_source, depth):
      if depth <= 0:
          return "D"  # Base case
      # Simulate opponent's response if we cooperate
      opponent_action = simulate(opponent_source, "C", depth - 1)
      return "C" if opponent_action == "C" else "D"
  ```

  ---

  ### **What Will Break (and How to Mitigate)**
  1. **Incomplete Proof Search**:
     - **Problem**: Students’ proof-search may be too shallow (e.g., depth=2) to find mutual cooperation.
     - **Mitigation**:  
       - Set a **minimum `depth=3`** for submissions.  
       - Provide starter code for `fairbot` to demonstrate bounded Löbian cooperation.

  2. **Adversarial Exploits**:
     - **Problem**: Agents that timeout or error during simulation (e.g., infinite loops).  
     - **Mitigation**:  
       - Use **timeouts** and treat hangs/errors as defection.  
       - Deduct points for strategies vulnerable to known exploits.

  3. **Gödelian Obstacles**:
     - **Problem**: Programs like `spiteful_bot` defect if they can’t prove cooperation, creating mutual defection loops:  
       ```python
       def spiteful_bot(my_source, opp_source, depth):
           if depth > 0 and simulate(opp_source, "C", depth-1) != "C":
               return "D"  # No proof → defect
           return "C"
       ```
     - **Mitigation**: Test submissions against `spiteful_bot` and penalize strategies that defect against cooperators.

  4. **Trivial Solutions**:
     - **Problem**: Students submit `defector` if cooperation seems risky.  
     - **Mitigation**:  
       - **Grade for robustness**, not just raw score.  
       - Run a "cooperation metric": % of matches with mutual cooperation.

  ---

  ### **Example Workflow**
  1. **Pre-Submission**:
     - Release starter code (`cooperator`, `defector`, `fairbot`).  
     - Host a public test server where students can run matches pre-submission.
  2. **Tournament**:
     - Run round-robin matches with `max_depth=5` and 1s timeouts.  
     - Auto-detect hangs/errors → treat as defection.  
  3. **Grading**:
     - Score = (Total Points) × (1 − Exploit Penalty) + Code Quality.  
     - Exploit Penalty = points lost to defectors / total possible.

  By emphasizing **bounded Löbian reasoning** and **robustness to adversarial code**, students will see cooperation emerge while learning the limits of real-world program equilibrium.
