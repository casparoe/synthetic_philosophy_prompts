prompt: |-
  Okay, this is going to sound like a weird tangent but bear with me. My mom's had fibromyalgia for something like 12 years, and for most of that time her old doctor basically treated it like it wasnt a "real" disease, more like a bucket for symptoms nobody could explain, and then a new rheumatologist this year was just like, yeah obviously it's real, let's treat it. That whole back-and-forth sent me down a rabbit hole into philosophy of medicine, specifically this naturalism vs. normativism fight over what "disease" even means, and now I'm kind of obsessed with it.

  Anyway, I co-host a tiny philosophy-adjacent podcast (genuinely small, don't get excited) and we landed a guest for next month who's built her whole research career defending Christopher Boorse's biostatistical theory -- the view that disease is just statistically subnormal functioning relative to your reference class, no value judgments required. I don't want her to just get to restate the theory cleanly for 40 minutes, I want to actually press on it. Can you draft me 8 to 10 interview questions, each paired with a follow-up keyed to whatever answer she's most likely to give? I definitely want one on the reference-class problem -- why age and sex get to be the privileged subgroups when you carve a species up into "normal" populations, and what stops that same move from just defining a disease out of existence in whatever subpopulation it happens to be common in. I want one that uses her own disease/illness/sickness trichotomy against her -- whether "illness" is quietly doing all the value-laden work she claims "disease" manages to avoid. I want one that throws a hard historical case at her, like drapetomania or homosexuality's run in the DSM, and asks how a purely naturalistic theory was ever supposed to protect us from those, given that the reasoning at the time also got dressed up in statistical, naturalistic-sounding language. And I want at least one built around my mom's actual situation: how is BST even supposed to apply to something like fibromyalgia, where for years nobody could point to the specific dysfunction being measured -- was it a disease that whole time on her view, or not, and how would she even know either way. No throat-clearing questions like "what drew you to this field" please, I want ones she can't just answer on autopilot.
reasoning: |-
  Okay, the user's query is quite detailed and specific. They're preparing for a podcast interview with a scholar who defends Christopher Boorse's biostatistical theory (BST) of disease. They want challenging questions that press on the theory's weaknesses, not just a restatement. 

  First, I need to recall what BST is. It's a naturalistic theory where disease is defined as statistically subnormal biological function relative to a reference class (like age and sex groups). The key claim is that it avoids value judgments. The user has highlighted specific angles they want to cover: the reference-class problem, the disease/illness distinction, historical abuses like drapetomania, and fibromyalgia as a case study.

  The user's personal connection to fibromyalgia makes this emotionally charged. Their frustration with how their mom was dismissed by doctors is palpable. That's why they want the fibromyalgia question to be central—it grounds the abstract debate in real suffering. I should make sure that question lands hard, showing how BST might struggle with "invisible" conditions.

  For the reference-class problem, the core issue is that BST privileges age and sex as "natural" reference classes. But why? If we carved populations differently (say, by race or occupation), we could make diseases disappear statistically. The follow-up needs to push on whether this choice is itself value-laden. 

  The disease/illness/sickness trichotomy is clever. Boorse separates disease (objective dysfunction) from illness (subjective suffering). But if doctors only treat "disease," and illness is what matters to patients, isn't BST sidelining the human experience? The follow-up should question if this split is sustainable.

  Historical cases like drapetomania (the "disease" of enslaved people fleeing captivity) are perfect for exposing how statistics can be weaponized. BST claims to be objective, but if past "diseases" used similar naturalistic language, how does BST prevent repeats? The follow-up should challenge the idea that statistics alone can protect against harm.

  For fibromyalgia, the tension is clear: if BST requires identifiable dysfunction, but medicine couldn't find one for years, was it a "disease" then? If yes, how? If no, when did it become one? This forces the guest to confront BST's practical limits.

  The user hates soft questions, so every query must be a scalpel. No warm-ups. I’ll draft 8-10 questions, each with a follow-up that anticipates defenses. The tone should be rigorous but not aggressive—this is philosophy, not a takedown. 

  Finally, I should remind the user to adapt on the fly. If the guest surprises them, they’ll need to pivot. The goal isn’t to "win" but to probe BST’s seams thoughtfully. And maybe, just maybe, give a nod to how theories affect real people like their mom.
answer: |-
  Here are 10 tightly-focused, adversarial questions targeting core tensions in Boorse's BST, each with a prepared follow-up designed to expose contradictions or vulnerabilities. They avoid preamble and force engagement with your key concerns:

  1.  **Core Challenge - Fibromyalgia & Epistemic Access:**  
      *Question:* "BST defines disease as statistically subnormal part-function relative to a reference class. For conditions like fibromyalgia, where the specific 'part' experiencing subnormal function remained elusive or contested for decades, how can BST *ever* definitively say whether it *was* or *wasn't* a disease during that period of diagnostic uncertainty? Isn't BST rendered practically inert for novel or poorly understood syndromes?"
      *Likely Answer/Follow-Up Target:* (She might appeal to future discovery or "dysfunction existing even if unknown").  
      *Follow-Up:* "But doesn't that make the 'disease' status entirely *epistemically contingent* on the current state of biological knowledge? If so, how is this meaningfully different from the normativist position you reject, where disease status is contingent on social/medical consensus? Was fibromyalgia a BST-disease in 2010 only if we *later* found the dysfunction?"

  2.  **The Reference Class Problem (Carving Nature):**  
      *Question:* "BST relies crucially on partitioning a species into 'reference classes' – primarily age and sex – to define 'normal function'. Why are *these* biological variables privileged for defining 'normal' rather than, say, genetic ancestry, geographic location, or socioeconomic status? Isn't this choice inherently normative, reflecting a value judgment about *which* differences are 'natural' and which are 'pathological'?"
      *Likely Answer/Follow-Up Target:* (She might argue age/sex are fundamental to species design, impacting nearly all functions).  
      *Follow-Up:* "But consider a disease like Sickle Cell Trait. It's statistically *normal* function within populations with specific genetic ancestry in malaria-endemic regions, conferring a survival advantage. By BST's logic within *that* reference class, isn't Sickle Cell Trait *not* a disease? Doesn't privileging the *species-wide* reference class over the evolutionarily adaptive sub-class expose a normative choice to prioritize one biological level over another?"

  3.  **Reference Class Problem (Pathologizing Prevalence):**  
      *Question:* "Following the reference class issue: If a dysfunction (say, a specific genetic mutation causing chronic pain) became statistically *prevalent* within a specific, reproductively isolated reference class (e.g., 80% of 40-year-old females in Population X), wouldn't BST be forced to conclude it's *not* a disease within that class, as it's statistically normal? Doesn't this make disease status vulnerable to population genetics in a way that seems counterintuitive and potentially dangerous?"
      *Likely Answer/Follow-Up Target:* (She might argue prevalence alone doesn't negate dysfunction, or redefine the reference class).  
      *Follow-Up:* "But doesn't BST explicitly define statistical subnormality *relative to the reference class*? If the dysfunction *is* the norm for that class, how is it 'subnormal'? If you adjust the reference class (e.g., to 'all humans') to avoid this, haven't you just admitted the initial carving was arbitrary and value-laden?"

  4.  **Disease/Illness/Sickness Distinction - The Value Workaround:**  
      *Question:* "You emphasize Boorse's distinction: Disease (BST dysfunction) vs. Illness (the subjective experience of suffering/need for help) vs. Sickness (social role). You claim BST isolates 'disease' from values. But isn't the entire *point* of identifying a 'disease' in medicine to explain or justify *illness*? Doesn't 'disease' functionally serve as the *reason* we label the 'illness' as warranting medical intervention rather than, say, personal weakness? Isn't 'disease' therefore inextricably value-laden *through its necessary link to 'illness'* in medical practice?"
      *Likely Answer/Follow-Up Target:* (She might insist disease is objective, illness is the value-laden consequence).  
      *Follow-Up:* "If a BST-dysfunction causes *no* illness (no suffering, no limitation), would medicine typically intervene? Conversely, if profound illness exists *without* a discoverable BST-dysfunction (like early fibromyalgia, or severe grief), is medicine wrong to try and help? Doesn't this show that the *driver* for medical action is *illness* (value-laden), and 'disease' is just one possible *explanation* we seek?"

  5.  **Historical Abuse - Drapetomania & Naturalistic Camouflage:**  
      *Question:* "Proponents argue BST's naturalism protects against pathologizing social deviance. Yet historical diagnoses like drapetomania (the 'disease' of enslaved Africans fleeing captivity) or homosexuality in the DSM were *explicitly defended* using naturalistic-sounding, statistical arguments about deviation from presumed biological norms. How does BST's framework *itself* provide any inherent safeguard against this, given it also relies on statistical deviation within a reference class defined by contemporary biological understanding?"
      *Likely Answer/Follow-Up Target:* (She might argue those were bad science/mistakes, not true BST).  
      *Follow-Up:* "But wasn't the *reasoning* structurally similar? They identified a behavior (fleeing, same-sex attraction), defined a 'normal' reference class (docile enslaved person, heterosexual), declared it statistically subnormal function (of the mind/will), and labeled it pathology. If BST offers no *internal* methodological check against flawed biological assumptions shaping the reference class or the function being measured, how is it meaningfully safer?"

  6.  **The "Function" Problem - Circularity & Goals:**  
      *Question:* "BST defines normal function as the contribution to survival and reproduction. But isn't this circular? We identify a part (e.g., the heart) *because* we know its function (pumping blood) is necessary for survival/reproduction. How do we objectively define the 'function' of a part *without* already invoking a goal (survival/reproduction) – which sounds suspiciously like a value?"
      *Likely Answer/Follow-Up Target:* (She might appeal to evolutionary biology/design).  
      *Follow-Up:* "Evolution optimizes for *reproductive fitness*, not necessarily individual health or longevity. Many 'dysfunctions' by BST standards might be neutral or even slightly beneficial to *fitness* in certain environments (e.g., mild alleles linked to disease later in life). Doesn't prioritizing 'survival/reproduction' as the goal itself represent a value choice about what constitutes 'successful' biological function?"

  7.  **Chronic Conditions & Adaptation:**  
      *Question:* "Consider a chronic condition like well-managed Type 1 Diabetes. With insulin, many biological functions (metabolism, energy levels) can be brought into statistically normal ranges for their age/sex reference class. According to BST, does the *disease* disappear when function is normalized via external intervention? If not, where does the 'dysfunction' reside?"
      *Likely Answer/Follow-Up Target:* (She'll likely say the underlying pancreatic islet cell dysfunction persists).  
      *Follow-Up:* "But BST defines disease at the *part-function* level. If the *relevant* function (e.g., blood glucose regulation) is achieved *via* the insulin+pancreas system and is statistically normal, what 'part' is still dysfunctional? Doesn't this force you to define the 'part' at a very specific, arguably arbitrary, level (e.g., 'pancreatic beta cells alone') to maintain the disease label?"

  8.  **Pain & Subjectivity:**  
      *Question:* "Pain perception is a core biological function. Fibromyalgia involves heightened pain sensitivity (hyperalgesia). BST could label this a dysfunction of the nociceptive system. But isn't 'appropriate' pain response inherently linked to *harm avoidance* – a value-laden goal? And how does BST distinguish *dysfunctional* heightened sensitivity from *functional* heightened sensitivity in, say, someone recovering from a nerve injury who needs to protect a healing limb?"
      *Likely Answer/Follow-Up Target:* (She might argue statistical deviation from the norm in pain processing pathways).  
      *Follow-Up:* "But the 'statistical norm' for pain sensitivity varies naturally. If heightened sensitivity leads to *increased* harm avoidance behavior in a generally safe environment (like fibromyalgia), is it dysfunctional, or just *different*? Doesn't labeling it a 'dysfunction' ultimately rest on the *negative value* we place on experiencing pain in the absence of immediate tissue threat?"

  9.  **BST vs. Patient Experience (The Mom Test):**  
      *Question:* "My mother experienced debilitating symptoms for over a decade. Medicine lacked consensus on a biological dysfunction, leading some to dismiss her suffering. BST, requiring identifiable subnormal part-function, might have classified this as 'illness' without 'disease' during that period. How is this framework, which potentially withholds the legitimizing label 'disease' due to epistemic limitations, any less dismissive or harmful to the patient than the old doctor's attitude, especially when the *suffering* was undeniably real?"
      *Likely Answer/Follow-Up Target:* (She might say BST doesn't deny suffering/illness, just separates it conceptually).  
      *Follow-Up:* "But in the real-world context of healthcare resources, stigma, and validation, doesn't the *withholding* of the 'disease' label based on BST criteria *directly contribute* to the dismissal and lack of care my mother experienced? Doesn't this demonstrate that the *practical consequence* of BST's 'value-free' ideal can be deeply harmful when biological understanding lags?"

  10. **The "No Value Judgment" Claim - Medical Practice Reality Check:**  
      *Question:* "Even if we grant BST identifies a 'value-free' dysfunction, doesn't the entire medical *enterprise* of seeking, diagnosing, and treating BST-diseases rest on the fundamental value judgment that survival, reproduction, and freedom from pain/limitation are *goods* worth promoting? Isn't BST's 'value-free disease' concept a philosophical abstraction that becomes immediately entangled with values the moment it interfaces with actual medicine and human needs?"
      *Likely Answer/Follow-Up Target:* (She might agree medicine involves values but insist *disease* is still objective).  
      *Follow-Up:* "If the identification of 'disease' is only medically relevant *because* it connects to things we *value* (preventing suffering, death, etc.), and if the *same* biological state might be a 'disease' in one context (causing illness) and not in another (causing no illness), doesn't this fatally undermine the claim that 'disease' itself is a value-free natural kind? Isn't it always *defined relative to* our values about how humans should function?"

  **Key Interview Tips:**

  *   **Listen & Pivot:** These follow-ups are predictions. If her answer surprises you, ditch the scripted follow-up and press on *her actual answer* using the core concepts (reference class, values, function, consequences).
  *   **Clarify Definitions:** Ensure you're both using "disease," "function," "reference class," "statistical subnormal" identically. Don't let ambiguity slide.
  *   **Bridge to Mom:** Use Q9 strategically to ground the abstract debate in the human cost.
  *   **Control the Frame:** If she tries to retreat into abstract theory, bring it back to concrete implications (historical abuse, fibromyalgia, sickle cell).
  *   **Respectful Adversarial:** Your goal is rigorous critique, not a "gotcha." Frame challenges as genuine philosophical puzzles arising from her defense of BST.

  These questions force engagement with the toughest criticisms of BST – its vulnerability in handling novel conditions, the non-arbitrariness of reference classes, the illusory nature of the value-free claim, its historical impotence against abuse, and its real-world consequences for patients like your mom. Good luck!
