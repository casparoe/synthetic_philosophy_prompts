  **Justification of Scores:**  
  - **Move (1): +1**  
  Miriam correctly identifies AC's indispensable role in core mathematical results (bases, Tychonoff). While not *all* "ordinary mathematics" depends on it, her core point about its load-bearing status is valid. Deducting one point for overstating universality of dependence.  

