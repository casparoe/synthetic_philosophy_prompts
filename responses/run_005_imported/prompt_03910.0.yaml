  Let me mentally walk through the objections I've seen in literature. First, the "real agents aren't that stupid" angle—people don't actually trade endlessly in cycles because they see the big picture. But that feels weak; coherence arguments aren't descriptive. Then there's the dynamic inconsistency angle where preferences shift over time... ah, but the user specified "no further assumptions about deliberation," so that might not satisfy them. 

