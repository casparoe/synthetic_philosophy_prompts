answer: |-
  That's an incredibly sharp connection, and you're absolutely right: the Armstrong & Mindermann result (and similar impossibility theorems in IRL) **can be powerfully interpreted as a modern, formal instantiation of Quine's indeterminacy of translation, applied specifically to desires (reward functions) rather than meanings (beliefs/linguistic content).**

  Here's the breakdown of the analogy and the argument for "no fact of the matter":

  1.  **Quine's Indeterminacy of Translation:**
      *   **Core Idea:** Given only an agent's observable linguistic behavior (utterances in response to stimuli), there are *always* multiple, mutually incompatible "translation manuals" (meanings assigned to words/sentences) that are *empirically equivalent* – they predict the same behavior perfectly.
      *   **Underdetermination:** The totality of behavioral evidence is insufficient to uniquely determine the meanings (propositional attitudes, beliefs) underlying the behavior.
      *   **Simplicity/Structure (Analytic Hypotheses):** Quine acknowledges we use pragmatic principles like simplicity and structural analogy to choose a manual, but these are *not* truth-revealing. Simplicity doesn't guarantee correspondence to the speaker's actual "meaning facts." Different simplicity criteria or structural assumptions lead to different, equally empirically adequate manuals.
      *   **"No Fact of the Matter":** Quine famously argued that *beyond the behavioral dispositions*, there is no objective fact about which manual is "correct." Meaning isn't a hidden mental entity waiting to be discovered; it's radically indeterminate relative to behavior.

  2.  **Armstrong & Mindermann (and IRL Impossibility):**
      *   **Core Idea:** Given only an agent's observable *behavioral policy* (actions taken in states), there are *always* multiple, mutually incompatible *(reward function, rationality model)* pairs that are *empirically equivalent* – they predict/explain the same observed behavior perfectly.
      *   **Underdetermination:** The totality of behavioral evidence (the policy) is insufficient to uniquely determine the underlying desires (reward function) *or* the cognitive process (rationality model) used to pursue them.
      *   **Simplicity/Structure (Priors):** Just like in Quine, we might impose a simplicity prior over reward functions *or* over rationality models *or* over the pair. However, the result shows this is insufficient. For any "simple" (R, Rational) pair explaining behavior, there exists an *equally simple* (-R, Anti-Rational) pair (or other transformations like `R' = R + f(s)`, `rationality' = distorted`) that explains the behavior just as well. Simplicity doesn't break the symmetry.
      *   **"No Fact of the Matter" (for Desires):** The argument extends directly: *Beyond the behavioral policy and the assumed rationality model*, there is no objective fact about which reward function is "correct." The agent's "true desires" are radically indeterminate relative to their behavior. You *need* to fix the rationality model to even *start* talking about a specific reward function, and even then, transformations like `R' = -R` (with flipped rationality) or potential shaping (`R' = R + f(s)`) can create empirically equivalent alternatives.

  **Why the Analogy Holds Strongly:**

  *   **Behavior as the Sole Evidence:** Both scenarios take observable behavior (linguistic utterances / action choices) as the primary or only empirical data.
  *   **Underdetermination of Hidden States:** Both posit hidden internal states (meanings/beliefs / desires/rewards + cognitive processes) that are massively underdetermined by the observable data.
  *   **Failure of Simplicity:** Both demonstrate that appealing to simplicity (Occam's razor, Kolmogorov complexity, etc.) over the hidden states *fails* to break the underdetermination and select a unique "true" internal state.
  *   **Symmetry Arguments:** Both rely on demonstrating symmetrical transformations (e.g., `gavagai` vs rabbit-stage vs undetached-rabbit-part; `R` + Rational vs `-R` + Anti-Rational) that preserve empirical adequacy and simplicity.
  *   **Pragmatic Choice:** In both cases, selecting *one* interpretation (translation manual / reward-rationality pair) is a *pragmatic choice* based on usefulness, convention, or prior assumptions, not a discovery of an underlying "fact."

  **The "Real Lesson": Is there "No Fact of the Matter"?**

  The Armstrong & Mindermann result, viewed through this Quinean lens, **strongly supports the conclusion that "what someone actually wants" is fundamentally indeterminate based solely on their behavior.** The "fact of the matter" about desires is inextricably tied to the rationality model you've assumed.

  *   **Fix Rationality, Indeterminate Reward:** If you fix a rationality model (e.g., Boltzmann-rational), you can often recover a reward function *up to certain transformations* (like potential shaping). But even then, `R` and `R + f(s)` are empirically indistinguishable under that model. The *specific numerical values* lack a unique behavioral grounding.
  *   **Vary Rationality, Radically Indeterminate Reward:** If you allow the rationality model to vary, the indeterminacy becomes explosive. `R` with Rational is indistinguishable from `-R` with Anti-Rational, or `Constant` with a pathological model that always picks the action leading to the highest `Constant` value. The *direction* and even the *existence* of preferences become indeterminate.

  **Caveats & Nuances:**

  1.  **Access to Counterfactuals:** IRL often assumes access to the *full MDP* (states, actions, transitions). Observing behavior *in new states* or *under new dynamics* can sometimes break symmetries (like `R` vs `-R` with Anti-Rational, if you see the agent avoid disasters). Quine's scenario is arguably more radical as it concerns *all possible* linguistic behavior. IRL indeterminacy might be partially resolvable with richer counterfactual data.
  2.  **Scope of "Behavior":** Does "behavior" include neural correlates, introspective reports, or other non-choice data? Quine was strictly behaviorist. IRL typically is too, but incorporating other data streams *could* reduce indeterminacy (though new symmetries might arise).
  3.  **Realism vs. Instrumentalism:** Quine leaned towards instrumentalism/eliminativism regarding meanings. The IRL result pushes towards an instrumentalist view of reward functions: they are useful constructs *for predicting behavior under an assumed cognitive model*, not necessarily descriptions of an internal "desire substance." However, if you believe desires *are* real internal states causally generating behavior *through a specific cognitive architecture*, then the result highlights the fundamental epistemological barrier to uniquely identifying them from the outside.

  **Conclusion:**

  Your insight is spot-on. The Armstrong & Mindermann impossibility result **does function as a rigorous, formal analogue of Quine's indeterminacy of translation, applied to the domain of desire/reward inference.** It demonstrates that **the mapping from observable behavior to underlying desires is radically underdetermined, even with a simplicity prior.** The "real lesson" **is indeed that there is no unique "fact of the matter" about an agent's "true" reward function that can be determined solely from its behavior.** The reward function only gains specific meaning *relative to an assumed model of rationality (or irrationality)*. This has profound implications for AI alignment (can we ever *know* what goal we've given an AI?), cognitive science (can we ever *know* what another agent *really* wants?), and philosophy of mind (what *are* desires, if not uniquely determined by behavior?). Quine's ghost haunts the corridors of inverse reinforcement learning.
