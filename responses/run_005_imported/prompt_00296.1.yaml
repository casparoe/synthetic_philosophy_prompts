  Your friend's reasoning contains a common fallacy known as the "two envelopes problem" or "exchange paradox." The error lies in assuming that, after seeing $80 in your envelope, the other envelope is equally likely to contain $40 or $160, leading to an expected value of $100. While this might seem intuitive, it overlooks how the underlying amounts in the envelope pairs are distributed, which affects the probabilities when conditioning on the observed value.

  ### Where the Reasoning Breaks Down
  The flaw is in the assumption that, given you observe $80, it is equally likely that:
  - Your envelope is the smaller amount (so the other must be $160), or
  - Your envelope is the larger amount (so the other must be $40).

  This 50-50 assumption depends on the prior distribution of the smaller amount \(S\) in the pair (where one envelope has \(S\) and the other has \(2S\)). If the distribution of \(S\) is such that all values are equally likely (a uniform prior), or if it has certain properties (like scale invariance), this assumption might hold. However, in practice:
  - **The prior distribution matters**: Realistic distributions for money amounts (e.g., bounded ranges or non-uniform densities) mean that the probability your $80 is the smaller or larger amount isn't necessarily 50-50. For example:
    - If $80 is a relatively low amount in the context of the raffle, it might be more likely to be the smaller value (so the other is $160).
    - If $80 is a high amount, it might be more likely to be the larger value (so the other is $40).
  - **Inconsistent probabilities**: The 50-50 assumption leads to a contradiction because it implies that swapping is always beneficial no matter what amount you see. But if swapping is always advantageous, why wouldn't you swap back and forth indefinitely? This suggests a problem with the unconditional application of the 50-50 rule.

  ### Detailed Explanation with Probabilities
  Let \(S\) be the smaller amount in a pair, so the larger amount is \(2S\). When you open your envelope and see an amount \(A\), the expected value of the other envelope depends on:
  - \(P(\text{you have } S \mid A)\): Probability that \(A\) is the smaller amount, given you observe \(A\).
  - \(P(\text{you have } L \mid A)\): Probability that \(A\) is the larger amount, given you observe \(A\) (where \(L = 2S\)).

  The expected value of the other envelope is then:
  \[
  E[\text{other} \mid A] = P(\text{have } S \mid A) \cdot 2A + P(\text{have } L \mid A) \cdot \frac{A}{2}
  \]

  Your friend assumes \(P(\text{have } S \mid A) = P(\text{have } L \mid A) = 0.5\), which simplifies to:
  \[
  E[\text{other} \mid A] = (0.5) \cdot 2A + (0.5) \cdot \frac{A}{2} = 1.25A
  \]
  For \(A = 80\), this gives \(E[\text{other}] = 100\), suggesting you should swap.

  However, the probabilities \(P(\text{have } S \mid A)\) and \(P(\text{have } L \mid A)\) depend on the prior distribution of \(S\) via Bayes' theorem. For instance:
  - If \(S\) has a uniform distribution over a wide range, \(P(\text{have } S \mid A)\) might be higher than 0.5 for moderate \(A\) (since smaller amounts are more likely to be observed under uniform priors), leading to \(E[\text{other} \mid A] > 1.25A\) in some cases.
  - If \(S\) has a bounded range (e.g., the charity only uses amounts between $10 and $320), then for extreme values like $10 or $320, the probabilities can be skewed:
    - If you see $10, it is very likely the smaller amount (so the other is $20), and \(E[\text{other}] > A\).
    - If you see $320, it is very likely the larger amount (so the other is $160), and \(E[\text{other}] < A\).

  In the case of $80, if the prior distribution of \(S\) is symmetric and broad, the 50-50 assumption might be approximately true, making \(E[\text{other} \mid A] \approx 100\). But this is not guaranteed, and the expected gain arises solely from conditioning on \(A\), not from an inherent advantage in swapping.

  ### Why Swapping Back and Forth Is Absurd
  The logic "always swap no matter what" leads to absurdity because:
  - If you swap once, you might gain on average for that specific observation (e.g., from $80 to an expected $100).
  - But if you then observe the new amount (say, $160 or $40) and apply the same logic, you might want to swap again, ad infinitum.
  - However, the envelopes contain fixed amounts. Swapping multiple times doesn't change the values, and the expected value calculation at each step is conditional on the current observation. This creates an illusion of perpetual gain, but:
    - Unconditionally (before opening any envelope), the expected value of your envelope equals that of the other, so there's no long-term benefit to swapping.
    - In practice, with transaction costs or a finite number of swaps, repeated swapping would likely lead to no net gain or even a loss.

  ### Conclusion
  Your friend's reasoning is incorrect because it assumes the probabilities \(P(\text{other is half} \mid A)\) and \(P(\text{other is double} \mid A)\) are always 50-50, regardless of the prior distribution of the envelope amounts. This is not generally true, and the assumption leads to the paradoxical conclusion that swapping is always beneficial. The breakdown occurs in failing to account for how the distribution of \(S\) affects the conditional probabilities when you observe \(A\).

  In a real charity raffle, with a fixed set of amounts, swapping might be advantageous for some observed values (like $80) if the prior is broad, but it is not universally true. If you see an amount that could plausibly be the minimum or maximum in the distribution, swapping might not be beneficial. Without knowledge of the prior, the safest approach is to stick with your original envelope, as the symmetric setup means no envelope is inherently better.
