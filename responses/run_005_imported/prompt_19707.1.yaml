answer: |-
  ## Dialogue: Sam vs. Alex on Resoluteness and Preference

  **Alex:** Look, Sam, I get your worry about "option identity." You think my money-pump tree only works if we *assume* the recurring option (say, A) is *the same thing* at each node. But that's built into the *structure* of the decision problem! The tree defines the nodes and the options available there. If the agent treats "A at node 1" and "A at node 2" as fundamentally different objects just because they appear at different times or contexts, then *no* sequential decision theory is possible. The whole point of modeling a dynamic choice is that options persist or recur.

  **Sam:** Exactly, Alex! That’s the substantive assumption I’m challenging. Why *must* the agent see "A" at node 2 as identical to "A" at node 1? If the agent is resolute, they don’t treat the *option* as identical; they treat their *prior commitment* as binding. At node 1, I commit to a *plan*: "Choose A now, and stick with A later *because I said I would*." When I get to node 2, I’m not choosing between A and B *as fresh options*; I’m executing my plan. The "A" at node 2 isn’t evaluated on its own merits—it’s just the next step in the plan I bound myself to. No comparison needed.

  **Alex:** But that’s where I see the disguised ranking! When you "commit to a plan" at the start—say, choosing the plan <A, A> over <A, B> or <B, whatever>—you *are* expressing a preference! You’re saying the *outcome* of sticking with A throughout is better (or at least not worse) than the outcome of switching to B later. You’ve completed your preferences *over the plans themselves*. Resoluteness just hides the fact that you’ve ranked the terminal outcomes by privileging one path through the tree.

  **Sam:** No, that’s the mistake! I don’t need to rank *outcomes* or *plans* in a global preference ordering. My commitment isn’t based on comparing the *goodness* of <A, A> versus <A, B>. It’s based on a *procedural rule*: "Avoid plans where I predictably abandon my past choices." I select <A, A> *because* it’s the only plan where I don’t change my mind, not because I’ve judged <A, A> as inherently superior to <A, B>. The "dominated" plan <A, B> only looks bad *if* you assume I’m re-choosing at node 2. But I’m not—I’m being resolute. The "loss" vanishes because I never face the switch.

  **Alex:** But *how do you choose which plan to commit to* without preferences? If you’re indifferent between A and B *now*, why commit to <A, A> instead of <B, B>? Or why not commit to <A, B>? If you pick <A, A> arbitrarily, you’re vulnerable to a *different* money-pump where I charge you to lock in that specific plan! Resoluteness just pushes the incompleteness up a level: you avoid ranking A vs. B, but now you need a meta-ranking of plans or a binding rule. And that rule *is* your completeness—it’s a preference for consistency over inconsistency!

  **Sam:** The rule isn’t a preference—it’s a *constraint* on deliberation. I don’t say "consistency is better"; I say "deliberation that leads to inconsistency is flawed." I avoid <A, B> *because* it’s dynamically inconsistent, full stop. I don’t compare its outcome to others; I reject it as incoherent *as a plan*. As for choosing between <A, A> and <B, B>, I *can* pick arbitrarily precisely because I lack a preference! The money-pump fails because if you try to pump me *between* two resolute plans, there’s no "switch point" where I’m tempted to abandon one for the other—I’m bound to my initial choice.

  **Alex:** But if you pick arbitrarily, you’re still vulnerable! Suppose I offer you a choice: pay me a penny to commit to <A, A>, or pay nothing to commit to <B, B>. If you’re truly indifferent between the outcomes, you should refuse to pay. But then I can exploit your indifference by forcing you into a dominated sequence where you *wish* you’d paid to lock in consistency. Resoluteness without a prior ranking is either arbitrary (and exploitable) or it smuggles in completeness under the guise of "procedural rationality."

  **Sam:** And you’re smuggling in a demand for global comparability by insisting that avoiding exploitation *requires* completeness! My point is that the "exploitation" only exists if you assume the agent *must* re-evaluate options at each node as independent choices. But if deliberation is plan-based from the start, and inconsistency is ruled out as defective, the "pump" evaporates. The options at later nodes aren’t "the same" as before—they’re contextualized by my commitment. You haven’t shown why I *must* see them as fresh comparisons.

  **Alex:** And you haven’t shown how "ruling out inconsistency" isn’t just a complete preference for consistent plans over inconsistent ones! Until you can define "inconsistency" without reference to what you *would* choose at later nodes if you re-decided—which *does* require comparing options—your resolution is circular. Resoluteness is preference in a trenchcoat.

  **Sam:** And your money-pump is an argument that only works if we conflate dynamic choice with static comparison. We’re at an impasse.

  **Alex:** Seems so. You see plan-commitment as a way to *avoid* preference; I see it as the *expression* of one. Sharp as a knife, but still stuck.  
  *(Both sigh, gesturing at the whiteboard covered in decision trees.)*
