     - However, we still get that there are no unknown truths, which is classically equivalent to omniscience. But in intuitionistic logic, the two are not equivalent. So we avoid the omniscience conclusion. But note that the knowability principle is still in place, and we have derived that there are no unknown truths. But then, if there are no unknown truths, then every truth is known, which is omniscience. But again, in intuitionistic logic, we cannot derive the universal statement from the negation of the existential. However, this might still be problematic because we have that for every p, it is not the case that p is true and not known. That is, ∀p ¬(p ∧ ¬Kp). This is intuitionistically equivalent to ∀p (p → ¬¬Kp). But we cannot get ∀p (p → Kp). So we avoid the strong omniscience, but we are left with the idea that for every truth, it is impossible that it is not known. This is still a strong conclusion and might be seen as a form of omniscience. Moreover, it is not clear that the anti-realist would be happy with this.

  5. **Denying the knowability principle outright and accepting unknowable truths**:
     - This is the straightforward realist response: there are truths that are in principle unknowable. This blocks the paradox because we reject the premise. But it abandons the knowability principle entirely, which is the core of anti-realism. So it is a complete surrender to realism.

  6. **Denying non-omniscience in the sense the argument requires**:
