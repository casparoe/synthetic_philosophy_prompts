     - However, this is a significant retreat because it gives up on the idea that all truths are knowable. Only a restricted class is. This might be acceptable for a moderate anti-realism, but it abandons the global anti-realist thesis.

  4. **Switching to intuitionistic logic without otherwise restricting the knowability principle**:
     - In intuitionistic logic, the law of excluded middle is not accepted, and the meaning of logical constants is given in terms of proof conditions. Some philosophers (like Dummett) have suggested that anti-realism should be based on intuitionistic logic.
