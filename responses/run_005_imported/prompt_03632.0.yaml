prompt: |-
  I spent about thirty years running a long-term field study on stream salamanders before I retired, and like most field biologists of my generation I mostly used significance tests as a black box: run the numbers, see if p sneaks under .05, move on. In retirement I've been working through some philosophy of statistics for fun (Deborah Mayo's book on severe testing, some Ian Hacking), and it's honestly making me squirm about stuff I did on autopilot for decades, like checking my data partway through a field season and quietly deciding whether to keep going. Anyway, I still do a monthly video call with two former postdocs of mine, Ingrid and Marcus, who are both faculty now, and last month they got into an argument on the call that I haven't been able to shake.

  It started when Ingrid mentioned, kind of offhand, that in her new lab they check the data every ten or so subjects and stop as soon as p dips below .05. (1) Marcus pounced: that's "optional stopping," and it's well known that peeking and stopping the moment you hit significance inflates your true false-positive rate way past 5% -- in the limit, if your willing to peek forever, you can more or less guarantee a "significant" result even when the null is true, so her reported p-value doesn't mean what it says. (2) Ingrid said their old labmate, a committed Bayesian, once convinced her this isn't actually a sin if you think like a Bayesian: the likelihood/stopping-rule principle says your evidence, and hence your posterior, depends only on the likelihood of the data you actually got, not on whatever rule made you stop collecting it -- so peeking is a problem for frequentists, not for her. (3) Marcus said fine, that's true for an honestly-computed likelihood from a model that wasn't fiddled with, but that's exactly the catch: nobody's stopping rule is the only flexible thing in a real analysis. We never see whether covariates got added or dropped along the way, how many "looks" happened before the one that got written up, or whether the model itself shifted to fit what was found -- optional stopping is just one researcher degree of freedom among several, and a Bayesian who peeked and quietly adjusted things is no more auditable than a frequentist doing the same, so celebrating the likelihood principle solves a toy version of the problem while ignoring the part that actually drives the replication crisis. (4) Ingrid replied that this is a completely general point about disclosure and has nothing to do with her being Bayesian specifically -- a frequentist who claims to have pre-registered a sequential design with a proper alpha-spending correction can just as easily be lying about that, so Marcus's objection undercuts frequentist fixes exactly as much as it undercuts her. (5) Marcus's comeback was that there's still an asymmetry: the whole culture of pre-registered stopping boundaries and registered reports grew up around frequentist error control, precisely because frequentists needed some public, falsifiable commitment for their error rates to mean anything -- so that accountability machinery already exists for her to borrow, whereas nothing in Bayesian philosophy, on its own terms, ever demanded it.

  I can't tell who's landing real punches versus who's just being stubborn, and nobody else on the call wanted to referee it. Could you go through the exchange move by move (I've marked the five moves above) and say who has the better of it at each one, rather than just declaring an overall winner? I'd also be curious whether there's some important consideration neither of them raised.
reasoning: |-
  Okay, let me start by understanding the user's background. They're a retired field biologist who spent decades using significance tests without deeply questioning them. Now, they're exploring philosophy of statistics and feeling uneasy about past practices, like optional stopping. Their main request is to analyze an argument between two former postdocs, Ingrid and Marcus, about the ethics of optional stopping in frequentist vs. Bayesian frameworks.

  First, I need to break down each of the five moves in their argument. The user wants a move-by-move analysis rather than an overall verdict. They also want to know if there's anything missing in the discussion. 

  Starting with Marcus's first point: he claims optional stopping inflates false-positive rates. That's correct in frequentist statistics because p-values depend on the sampling plan. If you keep testing as data comes in, the chance of a false positive increases beyond 5%. Classic example would be repeatedly testing a coin flip; eventually, you'll get a significant result even if the coin is fair. So Marcus is right here.

  Ingrid's counterpoint about the likelihood principle in Bayesian methods makes sense. Bayesians focus on the data observed, not the stopping rule. So if she's strictly following Bayesian principles, the stopping rule shouldn't affect her posterior. But is that practical? Real-world analyses might involve other tweaks, which Marcus points out next.

  Marcus's third move argues that optional stopping is just one of many researcher degrees of freedom. Even if Bayesians handle stopping rules correctly, they might adjust models or covariates during the analysis. That lack of transparency is the real issue. Ingrid's Bayesian approach doesn't solve the problem of undisclosed flexibility. 

  Then Ingrid responds that disclosure is a general issue, not specific to Bayesians. A frequentist could lie about pre-registration too. That's valid. Both frameworks are vulnerable to dishonesty. But Marcus counters that frequentist methods have built-in structures for accountability, like pre-registration and alpha-spending corrections. These practices arose to control error rates, whereas Bayesianism doesn't inherently demand such transparency.

  The user might be concerned about the replication crisis and how methodological choices contribute to it. Their unease about past practices suggests a desire for clarity on best practices now. They might also want to advise their former postdocs or understand the deeper philosophical issues.

  Key considerations not raised: the difference between ideal vs. applied statistics. Both Ingrid and Marcus might be assuming perfect adherence to their methods, but real-world constraints like time, resources, and publication pressure lead to shortcuts. Also, the role of pre-registration in Bayesian methods isn't discussed much—could Bayesians adopt similar transparency measures effectively?

  Another point is the computational aspect. Bayesian methods with complex models might require more computational resources, which could influence how often researchers check data. Plus, the psychological factor: stopping early when results are significant might be tempting regardless of the statistical framework.

  I should also mention that while the likelihood principle protects against stopping rules in theory, in practice, Bayesian analyses can be hacked through other means, like changing priors or models after seeing the data. The core issue is transparency and pre-specification, which isn't unique to either school but is more culturally embedded in frequentist practices due to historical developments.

  In conclusion, both have valid points at different stages. Marcus is stronger on the practical implications and existing solutions, while Ingrid correctly notes that disclosure issues transcend statistical paradigms. The missing piece is emphasizing that regardless of the method, rigorous science requires transparency, pre-registration, and honesty, which both frameworks can adopt, even if the motivation differs.
answer: |-
  Let's break down this nuanced debate move-by-move. Both Ingrid (Bayesian perspective) and Marcus (Frequentist perspective) land solid points, but the balance shifts throughout the exchange:

  1.  **Marcus: "Optional stopping inflates false-positive rates."**
      *   **Marcus lands a punch.** He's fundamentally correct *within the frequentist framework*. P-values are calculated based on the *intended* sampling plan (e.g., fixed N). Repeatedly testing as data accumulates ("peeking") without adjusting the significance threshold (alpha) inflates the Type I error rate (false positive rate) far beyond 5%. In the extreme, if you keep testing indefinitely under the null hypothesis, you *will* eventually get p < .05 purely by chance. Ingrid's lab's practice *is* statistically invalid under frequentism.

  2.  **Ingrid: "The likelihood principle solves this for Bayesians."**
      *   **Ingrid lands a punch.** She's also fundamentally correct *on the theoretical point*. The likelihood principle (LP) is a core tenet of Bayesian inference. It states that all evidence about a parameter contained in the data is embodied in the likelihood function (P(Data | Parameter)). The *reason* you stopped collecting data (e.g., because p dipped below .05, because it was Tuesday, because you ran out of funding) doesn't affect the likelihood function for the data you *did* collect. Therefore, the posterior distribution (P(Parameter | Data)) based solely on the observed data, computed with a pre-specified prior and model, is unaffected by the stopping rule. The *probability* that a Bayesian procedure *would* stop early under a specific scenario is a frequentist concern, not a Bayesian one. *Theoretically*, her reported posterior isn't invalidated by peeking.

  3.  **Marcus: "But real analysis has other flexible elements; LP solves a toy problem."**
      *   **Marcus lands a significant punch.** This is where the theoretical argument meets messy reality. Marcus concedes the theoretical point (LP) but argues it's largely irrelevant to the *actual* problem driving the replication crisis: **Researcher Degrees of Freedom (RDF)**. Stopping early is just *one* RDF. Others include:
          *   Adding/dropping covariates after seeing results.
          *   Transforming variables based on initial looks.
          *   Changing the model structure (e.g., adding interactions, switching link functions).
          *   Defining/refining hypotheses *after* seeing patterns.
          *   Choosing *which* peek to report (if multiple were taken).
      *   The LP only protects the Bayesian inference *if* the model (likelihood + prior) was *completely pre-specified and fixed* before *any* data collection or peeking began, *and* only the stopping rule was flexible. In practice, peeking almost inevitably leads to *other* adjustments ("quietly adjusted things"). A Bayesian analysis where the model was tweaked after peeks is *not* protected by the LP. Marcus argues that focusing *only* on the stopping rule via the LP ignores the larger, more pernicious issue of uncontrolled RDF that peeking facilitates. The lack of auditability ("no more auditable") applies equally to both paradigms when RDF is uncontrolled.

  4.  **Ingrid: "Disclosure is a general problem, not specific to Bayesians."**
      *   **Ingrid lands a counter-punch.** She correctly points out Marcus's objection (lack of transparency, potential for dishonesty) is not unique to Bayesianism. A frequentist can *claim* to have used a pre-registered sequential design with alpha-spending but might be lying about the pre-registration, the number of looks, or the stopping boundary. Similarly, they could lie about pre-specifying covariates or the model. The core problem Marcus identifies (potential for hidden flexibility and dishonesty) applies equally to both statistical paradigms. The tools for fixing it (pre-registration, transparency) are paradigm-agnostic.

  5.  **Marcus: "But the accountability machinery exists within frequentist culture."**
      *   **Marcus lands the final punch (on practicality).** While Ingrid is correct that dishonesty *could* occur in either paradigm, Marcus identifies a crucial asymmetry in **institutional norms and motivation**:
          *   **Frequentist Motivation:** Controlling Type I error rates *requires* knowing and adhering to the sampling plan. This *necessity* directly motivated the development of solutions like pre-specified sequential designs (with stopping boundaries and alpha-spending functions) and, crucially, the cultural infrastructure supporting them: **pre-registration platforms and registered reports**. These tools were *born* out of the frequentist need to make the sampling plan public and binding for error rates to be interpretable.
          *   **Bayesian Motivation:** Bayesian theory, via the LP, declares the stopping rule irrelevant *to the inference based on the observed data*. There is *no inherent theoretical requirement* within Bayesian philosophy for pre-specification or transparency about the data collection process for the posterior based on the observed data to be valid (under the assumed model). While good scientific practice demands transparency regardless, the *core Bayesian theory itself doesn't necessitate the development of pre-registration machinery*. Marcus argues that Ingrid *can and should* borrow the frequentist accountability tools (pre-reg, reg reports), but the point is that these tools weren't developed *by* Bayesians *for* Bayesian reasons based on their core principles.

  **Important Considerations Neither Raised:**

  1.  **The Practical Reality of "Pre-Specification" for Bayesians:** Even if a Bayesian pre-specifies their model and prior *perfectly* before any peeking, complex models often require tuning (e.g., MCMC diagnostics, prior sensitivity checks) *during* analysis. Distinguishing legitimate tuning from illegitimate model tweaking based on peeking results is incredibly difficult and often subjective, undermining the ideal LP protection.
  2.  **The Computational Angle:** Frequentist sequential designs often require specialized software or complex calculations for adjusted p-values. Bayesian analysis after peeking, while theoretically sound under the LP *if* the model is fixed, is computationally straightforward – just run the model on the current data. This ease might inadvertently encourage more peeking without the cultural guardrails.
  3.  **The "Intent" Problem:** Both paradigms struggle with judging the researcher's *intent*. Was a covariate dropped because peeking showed it wasn't significant, or for a truly pre-planned, principled reason? Pre-registration helps, but it's not foolproof.
  4.  **Bayesian Sequential Designs:** Bayesians *do* have formal sequential methods (e.g., using predictive probabilities or Bayes factors with stopping thresholds). However, these are often motivated by decision theory (e.g., minimizing expected sample size) or resource constraints, not because the LP demands them for valid inference. Ingrid's lab isn't using these; they're just stopping when a frequentist p-value dips below .05, which isn't a coherent Bayesian stopping rule.
  5.  **The Role of Priors:** Marcus didn't press the point that Ingrid's "peek and stop" approach using a p-value threshold isn't purely Bayesian. A truly Bayesian stopping rule might involve monitoring the posterior probability or Bayes factor. Using p<.05 as a stopping criterion smuggles frequentist logic into the process while claiming Bayesian immunity via the LP.

  **In Summary:**

  *   **Marcus Wins:** On the fundamental invalidity of Ingrid's specific practice under frequentism (Move 1) and on the practical argument that uncontrolled RDF, facilitated by peeking, is the core problem that the LP alone doesn't solve (Move 3). He also wins on the point about the existing frequentist-motivated infrastructure for accountability (Move 5).
  *   **Ingrid Wins:** On the theoretical validity of ignoring the stopping rule under the LP *if* the model is truly fixed and pre-specified (Move 2) and on correctly identifying that the transparency/dishonesty challenge applies universally, not just to Bayesians (Move 4).

  **The Overall Verdict (Though you asked for move-by-move):** Marcus has the stronger *practical* and *scientific integrity* argument in the context of real-world research plagued by the replication crisis. While Ingrid's theoretical point (LP) is correct, it provides a false sense of security in practice. The tools developed within the frequentist framework to combat RDF (pre-registration, registered reports) are essential for trustworthy science, regardless of whether the final analysis is frequentist or Bayesian. Ingrid *should* adopt these tools in her lab, not rely solely on the LP as a justification for flexible peeking. Your unease about your past practices is well-founded – the debate highlights how focusing solely on p<.05, without controlling the broader process, was indeed problematic.
