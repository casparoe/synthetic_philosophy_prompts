  Also, Wiener's example of the sorcerer's apprentice highlights irreversible actions. So, he might advocate for layered safety controls—multiple feedback mechanisms that allow humans to intervene at different stages, not just a shutdown button. This ties into his emphasis on communication; the AI should communicate its actions in a way humans can monitor and interrupt.

  Another point: Wiener’s biological metaphors. Homeostasis is about maintaining balance through constant adjustment. An AI should have built-in governors that regulate its actions continuously, not just at shutdown. This contrasts with the preference-based approach, which is more about initial design than ongoing interaction.

