  First, I need to recall Wiener's key ideas. His cybernetics framework emphasizes feedback loops, homeostasis, and communication. He saw purpose in behavior regulated by feedback, not just optimization. The von Neumann-Morgenstern rationality axioms might conflict with his views since they prioritize utility maximization, which Wiener might see as too rigid.

