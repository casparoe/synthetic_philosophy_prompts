answer: |-
  That's a fantastic rabbit hole! You've nailed the core tension Wittgenstein exposes. His critique of Father O'Hara (in the 1938 lectures) and the modern "rationalist" Bayesian approach stem from the same fundamental point: **they commit a *category mistake* by applying the logic of empirical hypotheses to religious belief.**

  Here's what Wittgenstein would likely say to the "15% credence" crowd, building on his arguments against O'Hara:

  1.  **Confusing "Belief" Games:** Wittgenstein argued that "belief" isn't a single, monolithic mental state. Saying "I believe it will rain tomorrow" and "I believe in the Last Judgement" involve utterly different *language games* with different rules, purposes, and relationships to evidence and action.
      *   **Empirical Belief:** Governed by evidence, probability, verification/falsification. Confidence *should* fluctuate (60%, 90%). It predicts observable states of affairs ("If it rains, the streets will be wet"). Doubt is intrinsic and meaningful.
      *   **Religious Belief (as Wittgenstein saw it):** Functions as an *absolute commitment*, a *framework* for seeing the world and living one's life. It's not primarily *about* predicting future sensory data. Expressions like "I believe in the Last Judgement" are closer to expressing trust, allegiance, or a stance on the *meaning* of existence and morality. It provides a "picture" that holds one captive, shaping perception and action.

  2.  **The Nonsense of Probabilistic Religious Belief:** Assigning a 15% credence to "God exists" treats it like a contingent fact about the world, similar to "there is life on Europa." For Wittgenstein, this is incoherent within the religious language game.
      *   **What does "15% certain God exists" *mean* practically?** Does it mean you live 15% as if God exists? Pray 15% of the time? Feel 15% bound by divine commandments? Modify your ethical stance 15%? The probabilistic quantification evaporates when applied to the *role* the belief plays in a believer's life. Belief in God, for the devout, isn't held *tentatively* like a scientific hypothesis awaiting further data; it's the bedrock upon which they build their understanding and actions.
      *   **"Updating" Based on Arguments?** While a believer might engage with arguments, Wittgenstein would argue that core religious convictions aren't *fundamentally* sustained or overturned by logical proofs or empirical evidence in the way a scientific theory is. A new argument might be incorporated, reinterpreted, or rejected based on how it fits the *framework*, not solely on its probabilistic weight. The belief often survives *despite* counter-evidence precisely because its function isn't empirical prediction. Think of how believers reconcile suffering with a benevolent God – it's a *reinterpretation within the framework*, not necessarily a Bayesian update lowering credence.

  3.  **The Danger of Misplaced Criticism:** This is where the "convenient way of putting religion beyond criticism" concern arises. Wittgenstein's point isn't that religion is *immune* to criticism, but that **criticizing it *as if it were bad science* fundamentally misunderstands it and therefore misses the mark.**
      *   **Ineffective Critique:** Saying "There's no evidence for the Last Judgement!" to a believer operating within the religious framework is like criticizing the rules of chess for not being like the rules of football. It fails to engage with what the belief *actually means and does* for the believer.
      *   **Valid Critique:** Wittgenstein would argue *meaningful* criticism must engage with the *internal* logic and consequences of the religious framework itself. Does it lead to harmful actions? Does it involve internal contradictions *within its own terms*? Does it offer genuine meaning or is it ultimately empty? Does it clash with other fundamental human values *in practice*? This kind of critique requires understanding the *grammar* of the specific religious belief, not imposing an alien (empirical/scientific) grammar upon it.

  **Would Wittgenstein have a point? Absolutely.**

  *   He powerfully exposes that the rationalist/Bayesian approach often fails to capture the lived reality, depth, and function of religious belief. Reducing God to a quantifiable hypothesis ignores how the concept operates existentially and ethically for believers. The "15% credence" person is arguably not even talking about the *same thing* as the devout believer when they say "God exists."
  *   He highlights the diversity of human reason and the different ways language and belief function in different forms of life. Not everything is science.

  **Is it a convenient way to put religion beyond criticism? It's nuanced.**

  *   **Not Inherently:** Wittgenstein's goal was *understanding*, not apologetics. He wanted to prevent *misunderstanding* that leads to fruitless arguments (like O'Hara trying to defend religion on scientific grounds, which Wittgenstein saw as a losing battle that missed the point). Meaningful criticism *is* possible, but it has to be on the right terrain.
  *   **But Potentially Exploitable:** Like any sophisticated philosophical distinction, it *could* be misused by believers to deflect *any* criticism by shouting "Category mistake!" whenever challenged. Wittgenstein himself was wary of this. Genuinely harmful or incoherent beliefs *within their own framework* still need to be challenged on their own terms or on the basis of their real-world consequences.
  *   **It Shifts the Burden:** It forces critics to do the harder work of understanding the internal logic and practical effects of the belief they wish to challenge, rather than just pointing to a lack of empirical evidence.

  **In essence:** Wittgenstein would tell the rationalist: "You are playing a sophisticated game of scientific hypothesis-testing. That's fine *for that game*. But you are mistaken in thinking the devout believer is playing the *same game*, just less competently or with worse evidence. They are playing a different game entirely, with different rules and stakes. Assigning probabilities to their moves in *your* game tells you nothing meaningful about the game *they* are actually playing, or the life it shapes. If you want to criticize their game, learn its rules first." Whether this protects religion or simply demands more sophisticated engagement depends on how the distinction is used.
