prompt: |-
  I'm taking History of Modern Philosophy this term (basically Descartes through Kant, with a long stretch on Locke and Berkeley), and I've got a response paper due Friday on Book II of the Essay Concerning Human Understanding. I keep getting stuck on the same bit of text, II.ix.8, where Locke goes from the globe-that-looks-like-a-flat-circle example straight into quoting Molyneux's letter about the cube and the sphere. I already know the "pop philosophy" version of the puzzle from all the sight-restoration/cataract-surgery stuff that gets cited everywhere, but when I actually sit down with Locke's own paragraph I don't think I understand what work the Molyneux case is doing for him specifically, versus just being a fun thought experiment he tacked on. Here's the passage, copied from the Gutenberg edition so the spelling's a little old-fashioned:

  We are further to consider concerning perception, that the ideas we receive by sensation are often, in grown people, altered by the judgment, without our taking notice of it. When we set before our eyes a round globe of any uniform colour, v.g. gold, alabaster, or jet, it is certain that the idea thereby imprinted on our mind is of a flat circle, variously shadowed, with several degrees of light and brightness coming to our eyes. But we having, by use, been accustomed to perceive what kind of appearance convex bodies are wont to make in us; what alterations are made in the reflections of light by the difference of the sensible figures of bodies;—the judgment presently, by an habitual custom, alters the appearances into their causes. So that from that which is truly variety of shadow or colour, collecting the figure, it makes it pass for a mark of figure, and frames to itself the perception of a convex figure and an uniform colour; when the idea we receive from thence is only a plane variously coloured, as is evident in painting. To which purpose I shall here insert a problem of that very ingenious and studious promoter of real knowledge, the learned and worthy Mr. Molineux, which he was pleased to send me in a letter some months since; and it is this:—"Suppose a man BORN blind, and now adult, and taught by his TOUCH to distinguish between a cube and a sphere of the same metal, and nighly of the same bigness, so as to tell, when he felt one and the other, which is the cube, which the sphere. Suppose then the cube and sphere placed on a table, and the blind man be made to see: quaere, whether BY HIS SIGHT, BEFORE HE TOUCHED THEM, he could now distinguish and tell which is the globe, which the cube?" To which the acute and judicious proposer answers, "Not. For, though he has obtained the experience of how a globe, how a cube affects his touch, yet he has not yet obtained the experience, that what affects his touch so or so, must affect his sight so or so; or that a protuberant angle in the cube, that pressed his hand unequally, shall appear to his eye as it does in the cube."—I agree with this thinking gentleman, whom I am proud to call my friend, in his answer to this problem; and am of opinion that the blind man, at first sight, would not be able with certainty to say which was the globe, which the cube, whilst he only saw them; though he could unerringly name them by his touch, and certainly distinguish them by the difference of their figures felt. This I have set down, and leave with my reader, as an occasion for him to consider how much he may be beholden to experience, improvement, and acquired notions, where he thinks he had not the least use of, or help from them. And the rather, because this observing gentleman further adds, that "having, upon the occasion of my book, proposed this to divers very ingenious men, he hardly ever met with one that at first gave the answer to it which he thinks true, till by hearing his reasons they were convinced."

  Two things are tripping me up, and id rather get help untangling them than just get "what Molyneux's problem is" again, which I already have from lecture. First: why does Locke slot this in right here, in the middle of the globe/flat-circle point, instead of somewhere else in the chapter -- is the cube-and-sphere case supposed to be making exactly the same point as the globe case (judgment quietly standing in for sensation without our noticing), or is it doing something extra that the globe case alone couldn't show? Second, my TA mentioned in passing that Berkeley later turns this into a much stronger claim, that sight and touch are basically "heterogeneous," two currencies that can't be directly exchanged at all. But reading Locke's actual wording here, with all the talk of "experience," "habitual custom," and "acquired notions," his own reason for agreeing with the negative answer sounds weaker than that to me -- more like the specific correlation between this look and this feel just hasn't been learned yet, which would leave it open that the man could pick it up fast once he's actually looking at them side by side. Am I right that those are two genuinely different claims, and if so, which one (if either) does Locke's paragraph actually commit him to? I don't want to just gesture vaguely at "heterogeneity" in my paper if that's really more Berkeley's move than his.
