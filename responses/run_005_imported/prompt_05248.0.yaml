  First, I need to unpack the mother's possible motivations. Her expressed loneliness is likely genuine, but her behavior during visits creates a paradox. Why would someone who wants company act in ways that push people away? Common psychological patterns come to mind here. Fear of intimacy could be a factor—maybe closeness triggers anxiety, leading her to criticize as a defense mechanism. Or she might have unspoken expectations that aren't met, causing frustration. It's also possible that her social skills are underdeveloped, making interactions stressful despite her longing for connection.

  The brother's stance is pragmatic: actions speak louder than words. But human emotions aren't that straightforward. Reducing visits might confirm her fears of abandonment, worsening her loneliness. The user's hesitation suggests they sense a deeper complexity. They might be worried about their mother's well-being but feel stuck between her words and actions.

  The user's deeper needs are important here. They probably want to maintain a caring relationship without causing distress. They might need strategies to address the underlying issues rather than just adjusting visit frequency. Also, they might feel guilt—if they visit less, will they be neglectful? If they visit more, will they endure criticism? They need validation that this is a tough situation and guidance on navigating it compassionately.

