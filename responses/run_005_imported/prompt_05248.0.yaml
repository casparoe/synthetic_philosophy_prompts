  Ultimately, the user needs a balance between compassion and self-care. They should acknowledge their mother's loneliness while addressing the behavior that makes visits hard. It's not about choosing words over actions but understanding the conflict between them to find a middle path that respects both her expressed needs and their own emotional limits.
answer: |-
  This is a deeply human and complex dilemma – the conflict between stated desire and behavioral reality is incredibly poignant, especially when it involves a parent. Neither your reading nor your brother's is entirely wrong, but yours likely captures more nuance. Here's a breakdown:

  **Why Your Brother's Reading is Understandable (But Likely Incomplete):**

  1.  **Behavior as the Ultimate Data Point:** He rightly points out that behavior often reveals deeper truths than words. Her consistent pattern of tension, criticism, and relief upon departure *is* powerful data. Ignoring it entirely risks dismissing her genuine discomfort during interactions.
  2.  **Self-Protection:** His approach protects both of you from repeated, predictable distress. Constant criticism is emotionally draining, and calibrating contact based on the actual *experience* of visits is a form of self-care.
  3.  **The "Decisive" Argument:** The consistency and longevity of the pattern make it hard to dismiss as mere "bad days." It suggests a deep-seated dynamic.

  **Why Your Hesitation is Justified (The Nuance You Sense):**

  1.  **Loneliness is Likely Real:** Her expressed loneliness probably *is* genuine. The longing for connection, the idealization of visits, the sadness when alone – these feelings aren't necessarily fabricated.
  2.  **The Core Paradox:** The key isn't that her words are lies *or* that her behavior is the whole truth. **The paradox *is* the truth.** She likely experiences both intense loneliness *and* intense anxiety/dysregulation during actual contact. This is a common, albeit painful, psychological bind.
  3.  **Possible Drivers of the Behavior (Beyond Not Wanting Contact):**
      *   **Fear of Intimacy/Engulfment:** Closeness might trigger unconscious fears of being overwhelmed, controlled, or losing autonomy. Criticism creates distance and reasserts control.
      *   **Unmet (and Unspoken) Expectations:** She might harbor idealized fantasies about visits (perfect harmony, undivided attention, specific behaviors) that reality never matches. The disappointment manifests as criticism.
      *   **Internalized Anxiety/Stress:** The pressure of the visit itself, the fear it won't go well, or unresolved family dynamics bubbling up can cause tension she unconsciously displaces onto trivial criticisms.
      *   **Poor Emotional Regulation/Communication Skills:** She may lack the tools to express her complex needs (e.g., "I feel nervous when you're here," "I miss you but feel criticized myself," "I need more reassurance") so it comes out as negativity.
      *   **Learned Behavior/Patterns:** This could be a long-standing dynamic rooted in her own upbringing or relationship history. It's familiar, even if unpleasant.
      *   **Underlying Mental Health Factors:** Anxiety disorders, depression, or personality traits can manifest in this push-pull dynamic.
  4.  **The Relief Factor:** Her relaxing after you leave doesn't *only* mean she's glad you're gone. It can also mean relief from the *stress* the interaction caused *her*. The stressful interaction ends, and the baseline loneliness returns, which, while painful, might feel less acutely dysregulating than the visit itself.
  5.  **The Risk of His Solution:** Reducing contact based solely on her behavior might:
      *   Confirm her deepest fears of abandonment/rejection, worsening her loneliness and potentially reinforcing the negative cycle ("See? They don't care").
      *   Prevent any possibility of understanding or addressing the *cause* of the disconnect.
      *   Lead to guilt for you and your brother, knowing she's alone and saying she wants you.

  **Whose Reading is More Defensible?**

  **Yours is more defensible in acknowledging the complexity and the likely reality of her conflicting internal states.** Dismissing her expressed loneliness as irrelevant because of her behavior oversimplifies a profound human contradiction. Your brother's view is pragmatic for managing the immediate negative experience but risks being reductive and potentially harmful long-term by increasing her isolation without addressing the root cause.

  **How to Weigh Words vs. Behavior When They Conflict:**

  1.  **Assume Both are "True" (Reflecting Internal Reality):** Start from the premise that the words express a genuine feeling (loneliness) and the behavior expresses another genuine feeling or state (anxiety, dysregulation, fear during interaction). The task is to understand the *relationship* between these truths.
  2.  **Behavior Reveals *How* the Need is Experienced/Managed:** Her behavior doesn't negate the need for connection; it reveals the *distress* or *dysfunction* surrounding how that need is met (or fails to be met) in practice. It shows the *obstacle* to fulfilling the stated desire.
  3.  **Look for Patterns and Context:** As you have, note the consistency, triggers, and what precedes/follows the behavior. This helps discern if it's situational or ingrained.
  4.  **Consider Underlying Needs/Fears:** What unmet need might be beneath the loneliness? What fear might be triggered by the visit causing the criticism? (e.g., Need: Connection, Belonging. Fear: Engulfment, Rejection, Failure).
  5.  **Evaluate Impact:** Acknowledge the real impact of the behavior on *you*. Her internal conflict doesn't obligate you to endure constant criticism.
  6.  **Seek Understanding, Not Just Reaction:** The goal isn't just to choose between believing words or actions, but to understand *why* they are at odds. This understanding guides a more compassionate *and* effective response.

  **Potential Paths Forward (Beyond Choosing Sides with Your Brother):**

  1.  **Gentle, Non-Confrontational Inquiry (During a Calm Moment, Not a Visit):** "Mom, we love you and know you often feel lonely and wish we visited more. We want that too. We've also noticed that sometimes when we *are* together, things feel tense or stressful. We're not sure why that happens. We want our visits to be good for all of us. Is there anything about our visits that feels hard for you, or anything we could do differently to make them easier?" *Focus on the dynamic, not blaming her criticism.*
  2.  **Adjust the *Nature* of Visits (Not Just Frequency):**
      *   **Shorter Duration:** Try significantly shorter visits. Can the "sweet spot" be found before the tension escalates?
      *   **Structured Activities:** Go for a walk, see a movie, play a game. Having a focus can reduce unstructured interaction time where criticism flares.
      *   **Neutral Territory:** Meet for lunch out instead of at her home (or yours). The change of environment can shift dynamics.
      *   **One-on-One:** If dynamics differ, try alternating visits individually.
  3.  **Set Gentle Boundaries Around Criticism:** "Mom, I love seeing you, but comments about [specific topic, e.g., my job, my weight, my parenting] are hard for me. Can we try to focus on other things?" Be prepared to calmly end the visit if boundaries are persistently crossed.
  4.  **Encourage Broader Social Connection (Gently):** If her loneliness is profound, encouraging (not forcing) other social outlets (senior center, clubs, volunteering) could ease the pressure on you as her *only* source of connection, potentially making your visits less loaded for her.
  5.  **Suggest Support (Very Carefully):** If appropriate and feasible, gently suggesting she talk to someone (doctor, therapist) about her loneliness *and* anxiety/stress could be beneficial. Frame it as concern for her well-being: "It seems like you're feeling really lonely, and also sometimes really stressed. Talking to someone who specializes in helping people with those feelings might help you feel better overall."
  6.  **Manage Your Own Expectations & Self-Care:** Accept that visits may always have an element of tension. Protect your own emotional energy. Debrief with your brother (acknowledging both the difficulty *and* her likely genuine pain) or others for support. Your well-being matters too.

  **In essence:** Your mother's loneliness is likely real, and so is her distress during visits. The solution isn't simply to believe one and ignore the other, nor is it necessarily to drastically reduce contact (though protecting yourselves is valid). It's to recognize the conflict within *her*, understand its roots as best you can, and adjust your approach (frequency, duration, structure, communication) to navigate this painful paradox with both compassion for her struggle and necessary boundaries for your own well-being. The goal is sustainable connection, not just reacting to the loudest signal (words or behavior).
