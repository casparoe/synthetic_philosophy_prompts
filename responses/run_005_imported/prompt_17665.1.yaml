prompt: |-
  There's this one paper in my subfield that literally every intro section cites for a pretty specific claim, something like "roughly 70% of users abandon a product after one bad experience," and I've cited it the same way myself without a second thought. I finally read the actual paper properly for my lit review and it just doesn't say that, the real finding is way narrower and more hedged. My advisor shrugged it off when I mentioned it, said that happens in every field, don't loose sleep over it. But dozens of papers, including several from people way more established then me, all repeat this exact number like it's settled fact. Is it more likely they all actually went back and checked the source and I'm the one missing something, or that this basically snowballed from one overstated claim? And should I just cite it the normal way myself, or flag the discrepancy and risk looking like I'm picking a fight with the whole subfield?
reasoning: |-
  Okay, let me start by understanding the user's situation. They found a widely cited paper in their subfield that everyone claims says "70% of users abandon a product after one bad experience." But when they actually read the paper, the finding is more nuanced and narrower. Their advisor dismissed it as common, but the user is concerned about the discrepancy.

  First, I need to assess why this happens. Academic citations can become like a game of telephone. One person misinterprets a study, others cite that without checking, and soon the misstatement becomes accepted fact. The user is worried they might be missing something, but given that even established researchers cite it wrong, it's more likely a snowball effect.

  The user's main question is whether to cite it the usual way or flag the issue. They don't want to pick a fight but value academic integrity. Their deeper need might be to navigate this ethically without alienating peers. They might also want to establish their credibility by showing thoroughness.

  I should consider the risks of each approach. Citing correctly could make their work stand out but might annoy others. Following the crowd maintains status quo but perpetuates error. A middle path might be best: cite the original accurately while noting the common interpretation. This shows diligence without confrontation.

  Also, the advisor's reaction suggests this is normalized, but the user feels uneasy. They might need validation that their concern is legitimate. Emphasizing that their careful reading is a strength could reassure them. Highlighting that correcting such errors strengthens the field might align with their values.

  Finally, advising them to frame the correction diplomatically is key. Positioning it as clarifying rather than accusing can reduce backlash. They can contribute to better scholarship without burning bridges.
answer: |-
  This is a **classic case of academic citation snowballing**, and your instincts are spot on. It's **extremely unlikely** that dozens of authors all independently re-read the original paper and came to the same misinterpretation you initially held. It's far more probable that:

  1.  **One influential paper misinterpreted/overstated the finding** (maybe slightly, maybe significantly).
  2.  **Subsequent papers cited *that* influential paper** (or papers citing it) rather than the original.
  3.  **The overstated claim became detached from the original context**, evolving into a "well-known fact" repeated without verification.
  4.  **Confirmation bias took hold:** Once established, the "70%" figure felt intuitively plausible and fit narratives, making researchers less likely to question it.

  **Why it happens:**

  *   **Time Pressure:** Reading every cited paper deeply is impossible. Skimming abstracts/intros/conclusions is common.
  *   **Citation Cascades:** It's easier to cite a recent, relevant paper that *says* X about the original than to track down and read the (often older, less accessible) original.
  *   **Narrative Convenience:** A clean, impactful statistic like "70% abandon after one bad experience" is rhetorically powerful. A nuanced, hedged finding is less so.
  *   **Social Proof:** Seeing multiple established authors cite it the same way lends credibility and discourages questioning.

  **What should you do?** This is a nuanced decision requiring strategy. **Don't just cite it the "normal way" - that perpetuates the error and undermines your credibility as a rigorous researcher.** However, picking a direct fight with the entire subfield in your intro is also unwise. Here are your options, ranked by recommendation:

  1.  **The Nuanced Correction (Recommended):** Cite the original paper **accurately** and **explicitly note the common misinterpretation**.
      *   *Example:* "While frequently cited as demonstrating that 'roughly 70% of users abandon a product after one bad experience' (e.g., [Author A, 20XX]; [Author B, 20XX]), a close reading of [Original Paper] reveals a more specific finding: [Accurately describe the finding, e.g., 'a 70% drop-off rate was observed *among users who encountered a specific critical error type* during the *initial onboarding phase* of *this particular type of enterprise software*, under controlled lab conditions']. This highlights the importance of context when interpreting user tolerance for negative experiences."
      *   **Why it works:**
          *   **Demonstrates Rigor:** Shows you did the work and read the source.
          *   **Corrects the Record (Subtly):** Sets the facts straight without attacking individuals.
          *   **Contextualizes:** Explains *why* the misinterpretation matters to *your* argument (it's about context!).
          *   **Minimizes Conflict:** You're correcting the *record*, not calling out specific researchers. You cite the common claim neutrally ("frequently cited as") before clarifying.
          *   **Strengthens Your Position:** Positions you as a careful scholar who digs deeper.

  2.  **The Accurate Citation (Minimal Risk):** Simply cite the original paper **only for what it actually says**, without mentioning the misinterpretation. Avoid using the "70% abandon after one bad experience" phrasing *at all*.
      *   *Example:* "User tolerance for negative experiences can be low, with significant drop-off observed even after isolated incidents [Original Paper, which found X in context Y]."
      *   **Pros:** Maintains integrity, avoids confrontation.
      *   **Cons:** Doesn't actively correct the error; readers familiar with the common claim might be confused if your phrasing differs significantly. Less impactful than Option 1 in demonstrating your contribution to rigorous scholarship.

  3.  **The Direct Challenge (High Risk, Context Dependent):** Explicitly state the original finding and call out the widespread misinterpretation more forcefully.
      *   *Example:* "Contrary to the frequently cited claim that 'roughly 70% of users abandon a product after one bad experience' (e.g., [List 1-2 prominent examples]), the foundational study by [Original Authors] actually demonstrated [accurate finding]. This widespread misrepresentation oversimplifies the complex relationship between user experience and retention."
      *   **When to consider:** Only if the misinterpretation is *central* to a flawed argument you are directly challenging in your work, and you have strong backing (like your committee). Use sparingly and diplomatically.
      *   **Risks:** Can come across as arrogant or nitpicky, especially in an intro. Might alienate reviewers/advisors who perpetuated the error.

  **Why NOT to cite it the "normal" way:**

  *   **Academic Integrity:** It's knowingly spreading misinformation.
  *   **Your Credibility:** If a sharp reviewer/reader checks the source (like you did!), *your* work loses credibility.
  *   **Perpetuates the Problem:** You become part of the snowball.
  *   **Missed Opportunity:** Showing you caught this demonstrates valuable critical thinking.

  **Addressing Your Advisor's Point:**

  Your advisor is right that this happens *everywhere*. It doesn't make it *right*, but it means it's a systemic issue, not a personal failing of the subfield. Your job isn't to single-handedly fix academia's citation habits, but **you absolutely *should* practice rigorous scholarship in *your own* work.** Correcting this in your dissertation/thesis is a perfect, low-stakes place to model better practice.

  **Conclusion:**

  **Opt for the Nuanced Correction (Option 1).** It's the most academically honest, professionally savvy, and constructive approach. You correct the record, demonstrate superior scholarship, contextualize the finding for your work, and avoid unnecessary confrontation. Frame it as clarifying the foundation of your research, not attacking your peers. This is how knowledge progresses – by carefully building on (and sometimes correcting) what came before. Your careful reading is a strength, not a reason for anxiety.
