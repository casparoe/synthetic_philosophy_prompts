  First, I need to recall Millikan's teleosemantics. Content is fixed by the historical conditions under which a state was selected. The consumers of a representation are systems that use it to perform functions. In this case, the consumers of state B are the mechanisms that cause hill-climbing. The function of B is to guide behavior that was adaptive in the past. Since the adaptive benefit was avoiding snorfs, not detecting red, B's content should be about snorf avoidance.

  Pietroski's red flag scenario seems to show that the kimu are tracking redness. But from Millikan's perspective, this is a malfunction. The representation B is being triggered by red, but in a context where it doesn't correlate with fewer snorfs. The fact that the kimu go towards the red flag despite danger indicates misrepresentation, not that the content is about redness.

