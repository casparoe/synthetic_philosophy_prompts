  The "custom" question targets the biggest tension in occasionalism: if God’s habits replace natural necessity, isn’t that just causation in disguise? 
  Moral responsibility is thorny—if God causes all acts, how are we blameworthy? They’re right to predict "acquisition" (kasb) as a dodge. 
  And induction… oof. If causes aren’t real, why trust past patterns? That’s a grenade in the lap of any occasionalist. 

  For follow-ups, I’ll need steelman versions of standard replies: 
