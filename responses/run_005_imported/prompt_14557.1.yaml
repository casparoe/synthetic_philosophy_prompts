prompt: |-
  I'm about two-thirds through a novel that follows the same woman from age 17 to almost 80, and theres a big scene where her adult daughter confronts her about something cruel she did as a teenager, and the mother's whole defense is basically "that wasn't me, that was a different person." My partner did a philosophy MA, and when I described the scene she said this is basically what perdurantism says: that it's the "correct," physics-approved view of persistence (something about how its required by relativity and the block universe), and that the self gluing together a person's life is more like a useful fiction than a real thing — really there's just a sequence of "temporal parts," like frames of a filmstrip, and each frame is, strictly speaking, a numerically different entity. Endurantism, on her account, is just the folk view that doesn't survive contact with modern physics.

  This has been nagging at me because if she's basically right, it seems to actually vindicate my character's line as literally true instead of the self-serving dodge I meant it to be, and it would mean stuff like moral responsibility, or being "the same person who grew and learned something," is kind of incoherent for anyone who takes the physics seriously. Is that a fair gloss on perdurantism, or has something gotten garbled here between the metaphysics of persistence, the physics of time, and maybe personal identity too? I'd like the real, in-the-weeds version of this rather than a Wikipedia-level summary, mostly so I know whether that scene is staking out a claim that's genuinely live among philosophers, a bit confused, or just flatly wrong.
