answer: |-
  The wire perch felt cool under Azra’s claws. Outside the aviary window, dawn bled into the sky, painting streaks of rose and ochre – colours Azra knew intimately, could recombine in his mind like notes in a song. *Rose-sky. Ochre-streak. Sky-streak-rose.* That was the gift, the *system*. If he could think "the berry is bright," he could think "the bright is berry." His thoughts were built of movable parts, a structured inner language. It was how he composed his complex, ever-shifting songs, each phrase a rearrangement of sonic elements learned and innate.

  Azra was a Superb Lyrebird, famed for mimicry. But for Azra, it wasn't mere copying. He *understood* the structure. He could isolate the shriek of a kookaburra, the rumble of a distant truck, the drip of water, and weave them into a new narrative: *Kookaburra-warns-dripping-danger*. He could invert it: *Danger-dripping-warns-kookaburra*. The systematicity of his thought was undeniable, the evidence for his own inner ‘Mentalese’. He wasn't just parroting; he was *computing*.

  His current obsession was **red**.

  He’d seen it. A fleeting flash on a researcher’s hat, the startling burst of a flower in the undergrowth beyond his enclosure, the sudden, shocking smear on a white lab coat after someone pricked their finger. It wasn't like the deep brown of the wet earth, nor the vibrant green of the eucalyptus leaves he nested with. It was… *red*. A concept distinct, powerful.

  He needed it for his song. He had a magnificent phrase composed for the dawn display – soaring notes for the sky, trills for the light, a complex rattle for the wind in the leaves. But it lacked… *punch*. It needed that shock, that vibrancy. He needed the sonic equivalent of **red**.

  But how to *learn* it?

  He tried association. When the researcher with the red hat appeared, he sang his loudest, most complex dawn phrase. The researcher looked up, smiled, but offered no specific sound. Azra tried singing *while* staring intently at a red flower pot brought briefly into the aviary. He felt the connection – the object and his desire – but no new *sound-concept* emerged in his mind. He needed the hypothesis: "That *is* red." But to test *that* hypothesis, didn’t he already need to possess the concept 'red' to know what he was testing *for*?

  Frustration crackled through his neural pathways. His structured mind, so adept at rearranging known elements – sky, leaf, danger, call – hit a wall. He could observe the red object. He could feel its visual impact. He could *want* its essence. But he couldn't formulate the concept itself as a new, primitive symbol within his mental language. It remained an ineffable *something*, outside his system.

  One afternoon, the researchers placed a new object in his enclosure: a smooth, perfectly spherical stone, unnaturally crimson. Azra approached cautiously. He tilted his head, his dark eye reflecting the vivid hue. He hopped closer. He knew stone. He knew smoothness. He knew shape. He could think "the stone is smooth," "the smooth stone is round." But **red**? It clung to the stone, inseparable yet… unanalyzable. He couldn’t isolate it as a component to slot into his mental syntax.

  He pecked the stone. Hard. A futile gesture. He sang his frustration – a jumble of alarm calls and harsh rattles. *Stone-hard-unyielding-colour-missing*. The thought was complex, systematic, but the crucial slot – the colour symbol – remained frustratingly blank. He couldn’t hypothesize "this colour is red" because 'red' wasn't a variable he possessed to test. To learn 'red' as a primitive concept, he seemingly needed it *before* he could recognize it *as* red.

  Days blurred. Azra’s dawn songs grew slightly discordant, laced with a searching dissonance where **red** should be. He rearranged his existing sonic palette obsessively, hoping to stumble upon the right combination that would magically unlock the concept, but it felt like trying to build a new fundamental particle out of Lego bricks.

  Then, it happened during a routine cleaning. A researcher accidentally knocked over a container of berries used to feed other birds. Dark, juicy *kakadu* plums, known for their intense, almost fluorescent crimson flesh, scattered across the aviary floor. One landed near Azra’s feet, splitting open.

  The colour bled out, vivid, shocking, *immediate*.

  Azra didn't think. He didn't hypothesize. He didn't need to.

  A deep, resonant click, unlike anything in his usual repertoire, vibrated in his throat. It wasn't learned. It wasn't mimicked. It wasn't a recombination. It was… primal. Instinctive. It *was* the sensory shock of that specific wavelength of light translated directly into sound within his neural architecture. **Red**.

  In that instant, the concept snapped into place within his Mentalese. Not built, but *revealed*. A primitive symbol, atomic and innate, suddenly active. Now, finally, he could think "the berry is **red**." Now he could test hypotheses *about* red – is this leaf red? Is the sky red? Now he could recombine it: **Red**-berry. **Red**-danger (the split fruit looked like a wound). **Red**-sky (at sunset).

  The systematicity of his thought, the very thing that proved his mind operated on symbolic computation, had led him directly to the nativist trap. He could manipulate concepts with breathtaking flexibility, but the foundational blocks – like **red** – couldn't be learned through hypothesis testing alone. To enter the system, they had to be there from the start, dormant, waiting for the right sensory key to activate them. Learning wasn't building the primitive; it was *labeling* the pre-existing innate category with experience.

  Azra looked at the split berry, the innate **red** symbol now a bright, undeniable node in his mental language. He could use it. He could sing it. He could recombine it. His dawn song would finally have its climax. But a faint, unfamiliar hollowness accompanied the triumph. The elegant, self-built logic of his structured mind had, in this one fundamental instance, been breached by something given, not earned. The system worked, brilliantly, but its most basic components were ghosts in the machine, waiting in the wings since birth. He ruffled his feathers, the newly conceptualized **red** of the berry juice staining his grey breast, a vivid mark of the trap he’d just sprung – and been sprung by. The song would be magnificent, but the knowledge of its foundation felt strangely… inherited.
