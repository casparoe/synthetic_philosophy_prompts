prompt: |-
  At Ethics Bowl practice, two of my teammates got stuck in a side debate about moral uncertainty that our coach couldn't fully settle either. (1) Dev argued that if you are genuinely unsure which moral theory is correct, the only defensible policy is to determine which theory you find most credible on reflection and then simply act on its verdicts, since doing anything else means deliberately acting on a theory you believe is more likely false than true. (2) Wren objected that this can't be the whole story: if Dev were, say, 55% confident that eating factory-farmed meat is a minor wrong and 45% confident that it is seriously wrong, Dev's rule says to just go with the 55% verdict and eat the meat, treating that case exactly like a 95/5 split -- which seems to throw away precisely the information that should matter most. (3) Dev replied that Wren's implicit alternative, weighing each theory's verdict by how strongly it condemns or endorses the act, assumes you can compare "strength of wrongness" across theories that share no common scale, so that adding a credence-weighted utilitarian score to a credence-weighted Kantian score is like adding degrees Celsius to kilograms. (4) Wren answered that no such comparison is actually needed to improve on Dev's rule: each theory can at least rank the available options from best to worst, and those rankings can then be combined by a purely ordinal procedure, the same way voting systems aggregate rankings without assuming every voter feels equally strongly about their favorite candidate.

  Could you go through their exchange and adjudicate it move by move, rather than just declaring an overall winner? Please give your verdict as a JSON block of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right) and 0 marks a genuine tie or mixed verdict. Then briefly justify each score, and close with a short note on what, if anything, you think both of them are still missing.
