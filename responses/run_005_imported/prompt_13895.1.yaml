answer: |-
  Below are ten interview questions designed to challenge the core claims of geometric rationality and ergodicity economics, with a focus on preventing evasion by forcing engagement with specific tensions between this framework and orthodox decision theory. Each main question includes a short, aggressive follow-up tailored to likely rebuttals. The questions target the four areas you specified (relation to expected utility, finite horizons, wealth as the privileged variable, and Shannon’s normative force) and close with a demand for empirical differentiation.

  ---

  ### **1. Relation to Expected Utility Theory**  
  **Main Question:** You present geometric rationality as a fundamental alternative to expected utility theory (EUT). But isn’t it simply EUT with a specific utility function—isoelastic utility where relative risk aversion equals one (i.e., log utility)—recontextualized using ergodicity arguments? EUT doesn’t prescribe utility functions; it only requires consistency. If log utility is admissible under EUT, why is geometric rationality more than a terminological repackaging?  
  **Follow-up (if she invokes ergodicity):** If ergodicity is merely a *motivation* for choosing log utility, doesn’t that reduce geometric rationality to a subset of EUT? Why call it a rival framework when EUT can already derive the Kelly criterion without ergodicity?  

  ### **2. Asymptotic Optimality and Finite Decisions**  
  **Main Question:** The Kelly criterion is optimal asymptotically—it maximizes long-run growth *almost surely*. But as Samuelson argued, this doesn’t translate to finite cases: an agent with a 30-year horizon might rationally choose "half Kelly" to reduce volatility and avoid ruin. How does geometric rationality justify the full Kelly fraction for such an agent, given that finite lives don’t have a "long run"?  
  **Follow-up (if she cites bankroll size/repetitions):** Practitioners use fractional Kelly because real agents care about *path-dependent risk* (e.g., drawdowns). If geometric rationality adjusts bets based on bankroll size or repetitions, doesn’t it implicitly reintroduce horizon-dependent utility—undermining its claim to universality?  

  ### **3. Wealth as the Privileged Variable**  
  **Main Question:** Kelly’s 1956 result was derived for a gambler leveraging *information asymmetry* in repeated horse races—it’s a theorem about capitalizing on informational edges, not general rationality. Why should growth of *wealth*, rather than growth of well-being, knowledge, or other compounding variables, be the object of rationality in your framework?  
  **Follow-up (if she defends wealth’s centrality):** If geometric rationality is contingent on multiplicative dynamics (like wealth compounding), doesn’t it collapse in additive contexts (e.g., health decisions)? Why is this not a fatal limitation compared to EUT, which generalizes across outcome types?  

  ### **4. Normative Force from Shannon’s Theorem**  
  **Main Question:** Geometric rationality traces its lineage to Shannon’s information theory, implying this ancestry lends it normative force. But Shannon’s theorem is descriptive: it shows how to *efficiently* transmit information, not how agents *ought* to choose. Isn’t invoking Shannon a sleight of hand that smuggles in log utility as "inevitable" when it’s just one arbitrary choice?  
  **Follow-up (if she ties information to growth):** If information-theoretic efficiency is normative for rational choice, why privilege *growth rate* as the ideal? Couldn’t a different efficiency criterion (e.g., minimax regret) justify a different utility function?  

  ### **5. Risk Aversion and Volatility**  
  **Main Question:** Geometric rationality ignores volatility: it maximizes median wealth but exposes agents to severe left-tail risk (e.g., 90% drawdowns). Yet humans demonstrably prefer reducing volatility—even at the cost of lower growth. Isn’t this evidence that your framework conflates *mathematical* optimality with *rational* choice?  
  **Follow-up (if she dismisses risk aversion):** If agents "irrationally" care about volatility, doesn’t that make geometric rationality descriptively false? And if it’s only normatively compelling, how do you justify ignoring ruin risk for finite agents?  

  ### **6. Ergodicity as a Red Herring**  
  **Main Question:** You argue that EUT fails when processes are non-ergodic because it substitutes ensemble averages for time averages. But in standard EUT, utility functions are defined over *outcomes*, not averages. If an agent maximizes expected utility of *terminal wealth*, doesn’t that already account for non-ergodicity by focusing on their actual trajectory?  
  **Follow-up (if she redefines rationality via time averages):** Why is the time average inherently more "rational" than an ensemble average? For unique decisions (e.g., buying a house), the ensemble *is* the only meaningful average—so isn’t ergodicity irrelevant there?  

  ### **7. Scope of Applicability**  
  **Main Question:** Geometric rationality seems tailored to multiplicative gambles with reinvestment. But most life choices involve consumption, debt, or additive risks (e.g., medical bills). How can your framework handle these without retreating to EUT?  
  **Follow-up (if she extends it to other domains):** If you generalize geometric rationality to non-multiplicative cases (e.g., via stochastic discounting), doesn’t it collapse into EUT with a transformed outcome space?  

  ### **8. Empirical Performance**  
  **Main Question:** In real markets, full Kelly strategies often underperform fractional Kelly due to estimation error and tail risks. If geometric rationality prescribes full Kelly but practitioners consistently reject it, isn’t this evidence that the framework is practically incoherent?  
  **Follow-up (if she blames implementation):** If agents must deviate from geometric rationality to avoid ruin, doesn’t that admit EUT’s core insight—that utility functions *should* incorporate individual risk attitudes?  

  ### **9. Self-Defeating Consistency**  
  **Main Question:** You claim geometric rationality avoids EUT’s pitfalls, but it seems to cherry-pick axioms: it enforces consistency in growth rates but ignores dynamic inconsistency (e.g., preferences shifting with wealth). Isn’t this ad hoc?  
  **Follow-up (if she appeals to ergodicity):** If ergodicity justifies ignoring dynamic inconsistency, why is time consistency inherently rational? People might *reasonably* prioritize survival over growth when poor.  

  ### **10. The Closing Challenge**  
  **Main Question:** To resolve ambiguity: describe one concrete decision problem—with specific payoffs and probabilities—where geometric rationality and orthodox EUT (with a *non-log* utility function, e.g., CRRA ≠ 1) recommend *different actions*. If no such case exists, isn’t this entire debate just a semantic disagreement?  

  ---

  ### **Key Design Notes:**  
  - **Preventing Evasion:** Follow-ups target predictable rebuttals (e.g., ergodicity, bankroll size) by forcing engagement with trade-offs geometric rationality dismisses (volatility, path dependence).  
  - **Pressure Points:** Questions #1 and #4 directly challenge the novelty and normative foundations, while #2 and #5 exploit the tension between asymptotic guarantees and real-world constraints.  
  - **Empirical Test:** The closing question (#10) demands falsifiability—if no distinct prescriptions exist, it weakens the claim of a paradigm shift.  
  - **Tone:** Sharp but professional, using her physics-trained rhetoric against her (e.g., invoking "category error" in #4, "path dependence" in #2).  

  These should force nuanced defenses rather than rehearsed sound bites. Good luck with the interview!
