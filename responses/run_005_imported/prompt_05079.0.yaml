  So in my philosophy elective we covered Pascal's wager (the infinite payoff argument for believing in god) but then I fell down a youtube rabbit hole about AI risk stuff and found this thing called Pascal's mugging — like some guy walks up to you and says he's secretly a wizard/AI from outside the simulation and will hurt some ridiculously huge number of people (i think the original version used a number like 3^^^3?) unless you hand over $5, and because tiny probability times huge payoff still wins the expected value math, your technically supposed to pay him even tho its obviously a scam. That seems like literally the same infinite/huge-payoff logic Pascal used in his own wager though?? If Pascal actually saw this thought experiment, do you think he'd have to admit it wrecks his own argument, or does he have some real principled way to say his bet isn't the same as getting mugged by a random guy with a big number? Like what would he actually say back?
