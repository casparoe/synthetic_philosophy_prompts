prompt: |-
  Hey, I'm prepping for an interview I'm doing for a science-and-ideas piece I write -- next guest is a philosopher of psychiatry who's basically built her whole career in the Hacking tradition (looping effects, human kinds, all that), and her new book argues that the current wave of self-diagnosis on TikTok -- ADHD, autism, and apparently now "systems"/DID content too -- is the cleanest real-time case study of a looping effect anyone's ever gotten to watch happen. She's not Hacking himself, obviously, just someone who works squarely in his framework. I've read Rewriting the Soul and most of Mad Travelers to get ready (still stuck in The Social Construction of What?, ironically) and I really don't want this to turn into forty minutes of her just restating what a looping effect is, which is the risk with a guest this fluent in her own jargon.

  Can you write me 8-10 interview questions? I want at least one that forces her to defend the interactive-kind/indifferent-kind distinction against the charge that its just a fancier way of saying "everything about people is socially constructed and nothing about rocks is" -- like, what extra work is that distinction actually doing. I want one that presses on whether looping effects commit her to saying these categories arent fully real, since the standard dodge is "looping means dynamic, not unreal," and I want a follow-up loaded for when she reaches for that line. I want one that puts real pressure on her TikTok case specifically: is an algorithm-mediated loop (a kid watches a creator list symptoms, adopts the label, performs it back online, the algorithm serves up more of that content) actually the same causal mechanism as the clinician-patient loops Hacking originally described, or just a different process wearing the same name. And I want one on the direction problem -- Hacking's own favorite case, fugue, boomed for a couple decades and then all but vanished, while her cases have so far only ever inflated, so what on her account decides whether a loop winds down instead of just accelerating. For each of those, plus whatever else you come up with to round it out to 8-10, give me a quick line on the answer she'll probably give first and a follow-up that doesn't let her stop there.
reasoning: |-
