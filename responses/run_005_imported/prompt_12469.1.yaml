  Next, the user wants to know who had the better of each exchange. Marcus scored points on practicality with the affected interests, but Ilana's coercion refinement addressed that. Marcus's jurisdictional argument is compelling, but Ilana's meta-point about acknowledging circularity is insightful. Overall, neither wins outright, but Ilana edges slightly ahead by exposing Marcus's assumptions.

