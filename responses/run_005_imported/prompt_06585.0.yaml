  Ok, need a favor before my decision theory seminar tomorrow morning — can you come up with a joke about the Pasadena paradox? You know, the St. Petersburg-style coin flip game where the payoffs are rigged so the expected-value series only converges conditionally, meaning you can rearrange the terms (Riemann rearrangement theorem) and get literally whatever expected value you want, including +/- infinity. I want the joke to actually turn on that — the rearranging, conditional vs. absolute convergence — and not just be a generic "haha infinite money" paradox joke. Basically, if you don't already know what conditional convergence is, you shouldn't get why its funny.
