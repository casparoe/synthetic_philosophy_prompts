  Ah! The critical difference is the blamer's relationship to their own failure. In Case 1, the parent denies their failure's relevance (implicit exemption claim). In Case 2, the ex-addict owns their failure and sees it as grounding solidarity (no exemption claim). That's the minimal difference Wallace would want. 

  I should emphasize the structural parallels: same violation, same blame act, same inconsistency. Only the blamer's self-conception changes. The ex-addict's humility and identification with the blamed person blocks the standing-undermining effect. 

