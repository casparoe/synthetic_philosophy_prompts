answer: |-
  This is a deeply human and intellectually honest struggle—not a sign of "losing the plot." What you're experiencing sits at the intersection of psychology, philosophy, and existential dread. Let's break it down:

  ### 1. **Is This Just "Coping Badly"?**
     Not really. It's a **natural response to a profound existential shift**. Losing religious belief often removes:
     - Cosmic accountability
     - An objective moral framework
     - Ultimate purpose

     Your brain spent years wired to a system where morality had eternal consequences. Neurologically, that reward/punishment circuitry doesn't vanish overnight. Seeking "evidence" of cosmic justice is your mind's attempt to resolve cognitive dissonance: *"If morality matters, surely the universe must enforce it?"*

  ### 2. **Is This Worry Taken Seriously by Smart People?**
     Absolutely. This is core to **meta-ethics** and **moral philosophy**:
     - **The "Is-Ought" Problem** (Hume): Can we derive moral obligations (*ought*) from factual observations about the universe (*is*)? Most philosophers say no.
     - **Moral Realism vs. Anti-Realism**: Do objective moral truths exist independently of humans? Realists (like Derek Parfit) argue yes; anti-realists (like J.L. Mackie) argue morality is subjective.
     - **Evolutionary Ethics**: If morality is an evolved trait (helping social species survive), does that make it "just" biology? (See E.O. Wilson, Robert Sapolsky)

     Even atheist philosophers grapple with this. Thomas Nagel wrote: *"I want atheism to be true... It isn't just that I don't believe in God... I don't want there to be a God; I don't want the universe to be like that."* Your search echoes this tension.

  ### 3. **Does the Search Lead Anywhere?**
     Here’s the honest answer:  
     - **Near-Death Experiences (NDEs)/Mediums**: These are **not** scientifically rigorous paths to cosmic moral validation. NDEs are fascinating neuropsychological phenomena (oxygen deprivation, DMT release), but peer-reviewed studies (e.g., AWARE II) show no verifiable evidence of an afterlife. Mediumship consistently fails controlled tests (e.g., Julie Beischel's work).  
     - **Consciousness Research**: While unresolved (the "Hard Problem"), panpsychism or quantum consciousness theories **don't** imply cosmic justice. They describe *mechanisms*, not moral accountability.

     **The trap**: Seeking scientific "evidence" for transcendent meaning misunderstands science. Science describes *how* things are, not *why* they matter. As physicist Sean Carroll puts it: *"The laws of physics underlying everyday life are completely understood"—and they contain no moral scoring system.*

  ### 4. **A More Productive Path?**
     Your engineering mind might find these approaches more satisfying:
     - **Philosophical Rigor**: Read moral realists like Parfit (*On What Matters*) or anti-realists like Sharon Street. Explore "evolutionary debunking arguments" (Kahane, Joyce).
     - **Existentialism/Absurdism**: Camus argued we *create* meaning despite a silent universe. Morality becomes a courageous choice.
     - **Secular Humanism**: Morality grounded in human flourishing (e.g., Sam Harris' *The Moral Landscape* uses well-being as an objective basis).
     - **Cognitive Science**: Studies show moral intuition is innate (e.g., infant morality experiments by Bloom, Hamlin). This doesn’t make it "fake"—it makes it *biologically fundamental* to being human.
     - **Pragmatism**: Does morality need cosmic enforcement to be real? Love, pain, and justice feel real *to us*. As Daniel Dennett said: *"The world is full of things that matter—but only to things that matter."*

  ### The Key Insight
  **Your anxiety isn’t about ghosts—it’s about whether goodness can *matter* without cosmic reinforcement.** Consider this:  
  - If morality requires divine enforcement to be valid, was it ever truly *moral*—or just obedience?  
  - If the universe is indifferent, does that make human compassion *less* profound? Arguably, it makes it *more* astonishing: fragile beings creating meaning against the void.  

  As an engineer, think in terms of emergent systems: morality isn't a cosmic law, but a **hyper-complex network of evolved empathy, social contracts, and reasoning** that sustains human societies. Its value isn't diminished because it's "man-made"—it's amplified. Bridges aren't less impressive because humans designed them.

  ### Practical Advice
  1. **Redirect your research** from NDEs to moral philosophy/cognitive science. Start with Parfit or Camus' *The Myth of Sisyphus*.  
  2. **Reframe accountability**: Your actions impact real, feeling beings. The "score" is the suffering or joy you create in others—measurable through neuroscience and psychology.  
  3. **Talk to your partner**: Explain this as an existential engineering project. It’s not superstition—it’s mapping a new OS after deleting the old one.  

  What you're feeling is the weight of freedom. It’s terrifying—but it’s where profound integrity begins. As the philosopher Richard Rorty noted, *"Truth is made, not found."* So is meaning. Your weekends aren’t wasted; they’re the workshop where you’re forging yours.
