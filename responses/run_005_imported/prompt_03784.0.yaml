answer: |-
  You've zeroed in on a fascinating and genuinely complex moment in Sidgwick's thought. His SPR Presidential Address reveals a pragmatic, almost institutional epistemology that's distinct from his more abstract ethical reasoning, yet subtly connected. Let's reconstruct his position charitably, identify its vulnerabilities, and contrast it with both his ethical method and Clifford's evidentialism.

  **Charitable Reconstruction of Sidgwick's Position:**

  1.  **The "Scandal":** Sidgwick starts from a profound dissatisfaction with the *state of inquiry*. Credible witnesses report phenomena of immense potential significance, yet "the educated world" remains dismissively incredulous. This impasse is intolerable for someone committed to rational inquiry. The scandal isn't just the *lack* of proof, but the *stalemate* despite significant testimony.

  2.  **The Institutional Goal:** The SPR's primary aim is to *resolve* this scandal. Its members (believers and skeptics alike) unite around the need for a "sustained and systematic attempt" to settle the matter definitively.

  3.  **"Sufficient Evidence" Defined Pragmatically:** This is where your core question lies. Sidgwick deliberately avoids an abstract, philosophical definition of "sufficient evidence." Why?
      *   **The Stalemate Requires Action:** Abstract definitions haven't resolved the dispute. Further philosophical debate won't break the deadlock.
      *   **The Goal is Collective Resolution:** The SPR exists to *change the state of knowledge within the scientific community*. Success is measured by shifting the consensus.
      *   **"The Scientific World" as a Functional Benchmark:** Sidgwick isn't offering a *definition* of truth or justification. He's defining the *operational goal* of the SPR's project: **evidence strong enough to compel acceptance by the relevant epistemic community.** This is a *pragmatic, institutional criterion for success*, not a philosophical definition of evidence *simpliciter*.
      *   **Charitable Interpretation (Regulative Ideal):** While phrased sociologically ("convince the scientific world"), the *intent* leans towards the idealized. Sidgwick implicitly assumes that if the evidence is truly sufficient *in the abstract philosophical sense*, it *should* and *would* eventually convince competent, unbiased scientists applying rigorous methods – precisely the kind of inquiry the SPR aims to foster. The "scientific world" here functions as a proxy for competent, rigorous inquiry *in practice*. He knows they aren't perfect ("many who have given much time... are not yet convinced"), but he sees them as the best available arbiters for phenomena claiming scientific significance.

  4.  **The Implied Epistemic Stance:** Sidgwick is advocating for **epistemic institutionalism**. The focus is on the *process* of inquiry conducted by a dedicated *institution* (the SPR) designed to generate evidence robust enough to meet the *de facto standards* of the established scientific community. It's about changing the *social fact* of belief within that community through rigorous investigation. He's bracketing the *philosophical* question of justification to focus on the *practical* task of inquiry aimed at consensus.

  **Comparison to *Methods of Ethics*:**

  *   **Similarity (Appeal to Consensus):** Both appeal to the judgments of competent inquirers. In *Methods*, Sidgwick uses the "consensus of experts" and "common sense" (after dialectical refinement) as *evidence* for the self-evidence and certainty of ethical axioms (like Prudence and Rational Benevolence). In the SPR address, he points to "competent witnesses" and the lack of consensus among the "educated world" as evidence of a problem needing resolution.
  *   **Crucial Difference (Role & Object):**
      *   **Ethics:** Consensus is used as a *heuristic* or *test* for identifying *self-evident*, foundational *axioms*. The goal is to discover timeless, objective truths about practical reason. The consensus points *towards* the intrinsic truth of the axioms.
      *   **SPR:** Consensus is the *operational goal* regarding *empirical claims* about specific phenomena. The truth of telepathy isn't assumed to be self-evident; it's contingent and must be *demonstrated* empirically. The SPR aims to *produce* the evidence that *will generate* consensus, thereby resolving the scandal. Consensus here is the *outcome* of successful investigation, not a signpost to self-evidence.
      *   **Epistemic Status:** In ethics, the appeal to consensus supports *philosophical certainty* about fundamental principles. In psychics, the appeal defines the *pragmatic success criterion* for an *empirical research program* aimed at overcoming profound skepticism.

  **Vulnerabilities of Sidgwick's SPR Position:**

  1.  **The Sociological Slippery Slope:** The most obvious vulnerability is the one you identified. Defining "sufficient evidence" as "what convinces the scientific world" *could* collapse into pure sociology of knowledge. What if the scientific world is systematically biased, dogmatic, or corrupt? Sidgwick likely assumed good faith and rationality, but history shows scientific communities *can* be unreasonably resistant (e.g., continental drift, germ theory initially). His position risks making truth/conclusive proof hostage to contingent social factors.
  2.  **The Competence Question:** Who defines the "scientific world"? Sidgwick assumes competence, but competence in *what*? Established physics/biology? Or the specific, often anomalous phenomena under investigation? The SPR was investigating areas *outside* the established paradigms of Victorian science. Could "competent" scientists, trained in existing paradigms, fairly evaluate evidence potentially *overturning* those paradigms? (Think Thomas Kuhn on paradigm shifts). This raises the "boundary work" problem in science.
  3.  **Wishful Thinking & Bias:** You rightly note the stronger pull of desire (belief in survival, meaning) in psychical research. Sidgwick acknowledges believers exist, but his definition focuses on convincing *non-believers* (the skeptical scientific world). However:
      *   **Inquiry Design:** Could the SPR's methods, designed to convince skeptics, be subtly biased *against* detecting genuine phenomena if they operated outside expected parameters? Or conversely, could the *desire* to resolve the scandal lead to lowered standards *within* the SPR?
      *   **The Burden of Proof:** Sidgwick places the burden squarely on producing evidence strong enough to overcome skepticism. This is pragmatically necessary but ignores whether the *degree* of skepticism was itself always reasonable. Clifford would say it *was* reasonable.
  4.  **The Ideal vs. Reality Gap:** Sidgwick's charitable reading relies on the scientific world *approximating* the ideal community of competent inquirers. The vulnerability lies in the gap between that ideal and the actual Victorian scientific community's potential biases, methodological limitations regarding the paranormal, and institutional pressures.
  5.  **Evading the Epistemology:** By refusing to define "sufficient evidence" abstractly, Sidgwick avoids grappling with the *unique* epistemological challenges of testimony regarding rare, anomalous, potentially paradigm-shifting events. What *would* constitute proof of telepathy, philosophically? He defers this crucial question to the future consensus.

  **Sidgwick vs. Clifford:**

  *   **Clifford (1877, "The Ethics of Belief"):** Takes a hardline individualist evidentialism: "It is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." The focus is on the *individual's duty* to proportion belief strictly to evidence *they* possess. Insufficient evidence mandates disbelief.
  *   **Sidgwick (1882):** Focuses on the *collective, institutional* response to a *lack of sufficient evidence to settle a dispute*. He implicitly agrees with Clifford that the *current* evidence is insufficient *for scientific consensus* (hence the scandal). However:
      *   **Action over Agnosticism:** While Clifford demands individual suspension of judgment, Sidgwick demands *organized action* to *generate* sufficient evidence. The SPR exists to *create* the conditions where belief (or disbelief) *can* be justified.
      *   **Pragmatic Definition:** Sidgwick defines the *goal* ("sufficient evidence") pragmatically (what convinces the community), while Clifford defines the *duty* abstractly (proportioning belief to evidence).
      *   **Shared Ground:** Both demand rigorous evidence. Clifford focuses on the individual's duty *given current evidence*. Sidgwick focuses on the institutional duty to *obtain better evidence* to resolve a problematic impasse. Sidgwick's approach *presupposes* something like Clifford's ethic for the *individual scientists* involved in the SPR's work – they must investigate rigorously and report honestly. His definition of "sufficient evidence" is the threshold where Clifford's duty *to believe* would finally kick in for the scientific community.

  **Conclusion:**

  The most charitable reading sees Sidgwick making a pragmatic, institutional argument, not a foundational epistemological one. "Sufficient evidence is evidence that will convince the scientific world" is a **goal-setting criterion for the SPR**, defining the *operational success* needed to resolve the "scandal" of the stalemate. He implicitly relies on the scientific world *functioning* as a competent, truth-tracking community (the regulative ideal).

  **Its core vulnerability** is the potential disconnect between this sociological benchmark and ideal epistemic justification, especially concerning phenomena that challenge existing paradigms. The scientific community might be unreasonably resistant, or the SPR's methods might be flawed by the very wishful thinking Sidgwick hoped to overcome. While distinct from his ethical method (which uses consensus to *discover* self-evident axioms), it shares a deep respect for the collective judgment of competent inquirers. Compared to Clifford, Sidgwick is less focused on the individual's duty *now* and more on the institutional duty to *create* the conditions where justified belief (or disbelief) *becomes possible* in the future. He's trying to build the bridge Clifford demands we cross only when it exists. The fragility lies in whether the bridge can ever be built to satisfy the standards of a community deeply invested in the landscape on the near shore.
