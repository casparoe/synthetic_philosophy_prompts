answer: |-
  ## The $5 Gamble: Why I Would Not Pay the Pascal's Mugger (Without Evidence)

  Pascal's Mugging presents a visceral challenge to expected value (EV) maximization. A stranger claims control over the welfare of 3↑↑↑3 people (an incomprehensibly vast number) and demands $5 to prevent their suffering. You assign only a minuscule credence `p` (say, 10^-100) that the claim is true. Yet, the potential negative utility `-U` of allowing that suffering is so astronomically large that `p * -U` dwarfs the disutility of losing $5 (`-u`). The calculation screams: **Pay the $5!** To refuse seems irrational under strict EV maximization. Yet, paying every such mugger leads to bankruptcy and empowers endless scams. This essay argues that while naive EV maximization fails here, **Robin Hanson's leverage penalty provides a rational, defensible solution that blocks the *initial* mugging without crippling our response to extraordinary evidence, whereas utility capping merely relocates the problem and creates worse distortions. Consequently, I would not pay the $5 based solely on the initial claim.**

  **The Core Failure: Unconstrained Multiplication of Vastness and Tininess**
  The mugging exploits the EV formula's (`Σ [P(outcome_i) * U(outcome_i)]`) susceptibility to dominance by the product of an arbitrarily small probability and an arbitrarily large utility. Our intuition rebels because we recognize that credence `p` isn't formed in a vacuum. Hypotheses positing agents with god-like power over hyper-astronomical scales inherently strain credulity *in proportion to the scale of their claimed leverage*. Naive EV ignores this connection, treating `p` as independent of the magnitude of `U`.

  **Solution 1: The Leverage Penalty (Hanson/Yudkowsky)**
  Hanson's insight is that hypotheses granting you decisive influence over `N` entities should be penalized in your prior probability estimate roughly proportionally to `N`. If a hypothesis claims your $5 payment controls the fate of `N` beings, your prior credence `p` should be discounted by a factor like `1/N` (or `1/N^k` for some `k`). Formally, your *effective* probability becomes `p_effective = p_naive / N` (or similar).

  *   **Does it block the initial mugging? YES.**
      The mugger claims leverage over `N = 3↑↑↑3`. Even if your naive `p_naive` was 10^-100, `p_effective = 10^-100 / 3↑↑↑3` becomes vanishingly smaller still (effectively zero for any practical calculation). The expected disutility `p_effective * -U * N` (where `U` is the utility per being) becomes `~ (p_naive / N) * -U * N = p_naive * -U`. The `N` terms cancel! The expected loss reduces to the tiny `p_naive` multiplied by a *normal-scale* utility `U`, which is easily outweighed by `-u` (the loss of $5). Paying $5 now has *negative* expected value. The mugging is blocked.
  *   **Does it merely relocate the problem to Pascal's Muggle? NO, it transforms it.**
      The "Muggle" scenario involves the mugger providing extraordinary evidence (e.g., flawlessly simulating a galaxy on your phone). The leverage penalty *does not* make you unresponsive to evidence. It adjusts your *prior*, not your ability to update. Extraordinary evidence can drastically increase `p_naive`. Crucially, the leverage penalty *still applies*, but the evidence might make `p_naive` large enough that even after the `1/N` penalty, `p_effective * N * U` becomes significant. For example, evidence convincing enough to raise `p_naive` to 0.1 means `p_effective = 0.1 / N`. The expected utility becomes `(0.1 / N) * -U * N = 0.1 * -U`. If `U` represents immense suffering per being, `0.1 * -U` could *easily* outweigh `-u` ($5 loss). **The leverage penalty doesn't make you a Muggle refusing compelling proof; it forces the mugger to provide evidence proportional to their outlandish claim *before* their threat enters your decision calculus.** If they provide sufficient evidence, paying becomes rational. The problem isn't relocated; it's solved by demanding evidence commensurate with the claimed stakes.

  **Solution 2: Utility Capping**
  This solution imposes a maximum possible utility `U_max` (positive or negative) that any single outcome can contribute. No outcome, regardless of how many lives are affected, can have `|U| > U_max`.

  *   **Does it block the initial mugging? YES (technically).**
      Set `U_max` to, say, -10^50 utils. The disutility of the mugger's threat is capped at `-U_max`, not `-U * N`. Therefore, `p * -U_max` remains finite. For sufficiently small `p` (like 10^-100), `p * -U_max` will be less than `|-u|` (the disutility of losing $5). Paying is irrational.
  *   **Does it merely relocate the problem? YES, and creates worse ones.**
      1.  **The Cap Itself is Mugged:** Why `U_max = 10^50`? Why not `10^100`? A mugger can simply claim `N` large enough so that `U * N > U_max`, rendering the cap irrelevant. To block *all* potential muggings, `U_max` must be set so low that it becomes implausible (e.g., capping the disutility of Earth's destruction at -1000 utils). This defeats the purpose of caring about large-scale outcomes.
      2.  **Real Catastrophes Undervalued:** Suppose a *genuine*, detectable threat emerges that would kill `10^40` people. Under a capped utility function, the EV of spending vast resources to avert it is capped at `p * U_max`. If `U_max` is set low to block muggings, the EV might be insufficient to justify the cost, leading to catastrophic underinvestment in real, large-scale prevention (e.g., asteroid defense, pandemic preparedness). The mugging is "solved" by making us irrational about real existential risks.
      3.  **Pascal's Muggle Redux:** If the mugger provides extraordinary evidence *before* demanding $5, the capped agent *still* cannot rationally pay if the capped disutility `-U_max` multiplied by the now-higher `p` is less than `|-u|`. The cap makes the agent permanently unresponsive to the true scale of *verified* hyper-existential threats. This is worse than the leverage penalty's evidence-responsive approach.

  **My Verdict: Withhold Payment (Unless Evidence Emerges)**

  Based solely on the stranger's initial, unsupported claim of controlling 3↑↑↑3 lives, **I would not pay the $5.** The leverage penalty provides a principled, rational justification for this: the sheer scale of claimed leverage makes the *effective* probability of the threat, prior to extraordinary evidence, vanishingly small. Paying under these conditions is not EV maximization; it's capitulation to an exploit of an unrefined decision rule. Utility capping, while technically blocking the initial mugging, imposes an untenable and irrational rigidity on our valuation of large-scale outcomes, potentially dooming us to neglect real catastrophic risks.

  **The conditionality is clear:** My refusal is contingent on the *absence of evidence commensurate with the scale of the claim*. If the stranger provides truly extraordinary proof (e.g., demonstrating power over a vast but non-universal scale in a verifiable way), then the leverage penalty allows my credence to update sufficiently to potentially make payment rational. The mugger must earn their leverage through evidence, not just assertion. Without that evidence, the $5 stays in my pocket, defended not by intuition, but by a rational prior that rightly penalizes claims of infinite leverage. Pascal's Mugging is solved not by abandoning expected value, but by correctly forming the probabilities that feed into it.
