  I recall Lam's replication attempt where rewording the question collapsed the cultural gap. That's damning evidence for task artifacts over deep cognitive differences. Also, the user might appreciate the "false dichotomy" angle - East Asian respondents could be considering pragmatic aspects of name use that Western participants disregard, not endorsing pure descriptivism. 

