prompt: |-
  I host a science-and-ideas interview podcast, and this week's guest is a philosopher who argues that an AI system's moral status should track its calculated probability of consciousness -- scored against a checklist of "indicator properties" drawn from rival scientific theories of consciousness -- and who wants AI companies to adopt low-cost precautionary welfare measures, like letting a chatbot end conversations it flags as distressing, before that probability is ever settled. Draft eight to ten interview questions that go beyond having her restate the framework: I want at least one question on how she aggregates scores across theories that don't even agree on what counts as evidence, one on why a system's own verbal reports of distress should count as data rather than trained mimicry of human self-description, and one on whether her "act under uncertainty" argument has a floor that stops it being exploited by any sufficiently confident claim of possible suffering -- and for each, a follow-up keyed to the answer she's most likely to give.
