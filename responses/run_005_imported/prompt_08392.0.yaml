answer: |-
  Here’s a warm, precise, and crowd-pleasing toast that balances the science with heart—crafted for both the experts and your family. (Time: ~4.5-5 mins, spoken at a natural pace.)

  ---

  **(Raise your glass, smile warmly at your aunt)**  
  "Everyone, if I could have your attention for a moment. For those who don’t know me, I’m [Your Name], [Aunt’s Name]’s nephew/niece—and as a software engineer, I’m usually more comfortable debugging code than explaining biology. So, if I accidentally turn natural selection into a Java class… forgive me.  

  **Aunt [Name]**, tonight we celebrate you—your brilliant 40-year career, your unwavering passion, and your legacy. Now, if there’s one thing everyone in this room knows, it’s that you’ve spent decades championing a powerful idea: **the gene’s-eye view of evolution**.  

  *(Lean in slightly, conversational tone)*  
  For the non-biologists here—imagine nature isn’t really selecting *ants* or *birds* or *us* for survival. Instead, it’s all about tiny stretches of DNA—genes—competing to make copies of themselves. Organisms? They’re like… sophisticated vehicles genes build to survive and replicate. And when a worker ant sacrifices herself for the colony? That’s not for the ‘good of the group’—it’s because those sisters share her genes. The math works out. It’s genes ensuring *their* survival. Ruthless? Efficient? Either way, you’ve always said it’s the clearest lens to see evolution’s logic.  

  *(Pause, shift tone to affectionate irony)*  
  Now… here’s where it gets funny.  

  Because if anyone here embodies the *opposite* of a ‘selfish gene’… it’s Aunt [Name]. *(Smile, glance at family)* Our whole family knows this. We’ve seen it for years:  
  - The way you drop everything to care for a sick friend—*even when they’re not related!*  
  - How you mentored generations of students far beyond what any ‘replicator’ would demand.  
  - That time you drove through a snowstorm to bring soup to Cousin Dave… who, genetically speaking, was practically a stranger! *(Light chuckle)*  

  **(Pivot to heartfelt sincerity)**  
  So how do we square this? The scientist who shows us how self-interest shapes life itself… and the human being who’s spent a lifetime giving *herself* away?  

  I think your work actually holds the key. Because your science isn’t about justifying selfishness—it’s about revealing a deeper truth: **that selflessness is written into life’s code**. That generosity *can* be the winning strategy. That genes for cooperation, for kinship, for sacrifice—they *thrive*.  

  And you? You’re living proof. You didn’t just study this—you *lived* it. You showed your students, your colleagues, and us—your wildly lucky family—that building each other up isn’t just ‘nice.’ It’s how we survive. It’s how we *mean* something.  

  **(Raise glass higher, voice warm with pride)**  
  So Aunt [Name], tonight we celebrate your fierce mind that reshaped how we see life’s machinery… and your even fiercer heart that showed us how to live. You defended the gene’s-eye view with rigor—but you gifted the rest of us a far grander view: that the most enduring thing we replicate isn’t just DNA… **it’s kindness**.  

  To [Aunt’s Name]—may your retirement be as generous, surprising, and full of joy as you’ve made all our lives. Cheers!"  

  ---

  **Why this works:**  
  1. **Accuracy for Experts**:  
     - Correctly frames gene-centric selection ("genes building vehicles," "kin selection math").  
     - Nods to her ant-colony debate *without* oversimplifying (avokes "group selection" vs. "gene math").  
     - Uses precise language ("replicator," "lens," "strategy") experts will respect.  

  2. **Warmth for Family**:  
     - Concrete examples of her generosity (soup, mentoring, care) make it personal.  
     - Gentle humor about the irony ("genetically… a stranger!").  
     - Focuses on *her impact*, not jargon.  

  3. **The Bridge**:  
     - Resolves the "selfish vs. selfless" tension by reframing her work: *cooperation is adaptive*.  
     - Positions *her life* as the ultimate evidence—satisfying both camps.  

  4. **Avoids Pitfalls**:  
     - No deep philosophy.  
     - No mocking "selfish gene" (calls it "ruthless/efficient," not cold).  
     - Ends on legacy + joy → perfect retirement sentiment.  

  **Delivery Tip:** Practice pacing. Pause after "funny" and before "So how do we square this?" to let the contrast land. Look at your aunt during the personal examples—and at the crowd during the science bits.  

  She’ll love it. The room will love it. And you’ll nail the balance. Cheers!
