prompt: |-
  I'm a software engineer with no background in biology or philosophy, but I've been asked to give the toast at my aunt's retirement dinner and I want to get it right. She spent forty years as an evolutionary biologist defending what she calls the "gene's-eye view" of evolution — the idea that natural selection is best understood as acting on individual genes rather than on whole organisms, colonies, or species. She's semi-famous in her field for a decade-long, never-quite-resolved dispute with a colleague over whether a worker ant sacrificing herself for her sisters needs anything more than shared genes to explain it, no appeal to "the good of the colony" required. The joke the whole family already makes is that she is, in real life, about the most generous and self-sacrificing person any of us has ever met — nothing like what "selfish" suggests. Roughly half the room will be former students and collaborators who will notice immediately if I get the actual science wrong; the other half is family who just want something warm. Could you write me a five-minute toast built around that one contrast, something that stays affectionate rather than turning into a lecture, and that both halves of the room can genuinely enjoy?
