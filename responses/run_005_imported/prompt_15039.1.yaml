prompt: |-
  So next week I'm interviewing a theoretical neuroscientist for a piece on the free energy principle — she's built her whole career on the claim that it explains not just perception but basically all of life and self-organization. Shes sharp and has fielded every softball question a hundred times, so I need questions that actually go somewhere, not "what is the free energy principle" 101 stuff. Can you draft 7-8 interview questions, each with a follow-up keyed to whatever answer she'll probably give? I want at least one pushing on the "it's unfalsifiable/tautological" charge (she usually deflects with "it's a principle, not a hypothesis, like least action" — the follow-up needs to catch that move), one on the dark room problem and whether active inference actually solves it or just bakes the answer into the priors after the fact, and one calling out the slide between the modest predictive-processing story about perception and the much grander claim that literally any system with a Markov blanket is minimizing free energy.
