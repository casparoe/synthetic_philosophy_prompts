answer: |-
  ## The Debate at King Śīlāditya's Court  
  *(A dramatized vāda between Vācaspati, Naiyāyika scholar, and Jinadatta, Buddhist logician of the Dignāga-Dharmakīrti tradition. The air hangs thick with incense and intellectual tension. King Śīlāditya leans forward, flanked by ministers and rival scholars.)*

  **Vācaspati (Naiyāyika):** *[Stands firm, voice resonant]* Noble Patron, esteemed assembly! This learned Buddhist *(gestures to Jinadatta)* claims that when your eye meets a mango on your plate, perception delivers only a fleeting, nameless *this* – a unique particular stripped of color, sweetness, even "mango-ness" itself! Only later, he says, does thought impose the label "mango" through mere *exclusion* – "not-non-mango." But I ask him: **How can you exclude "non-mango" unless you already grasp what a mango *is*?** When you point away from the fig tree saying "Not mango!" – does that negation float free? Or does it *presuppose* the very universal "mango-ness" you claim is unreal? Your *apoha* is a thief who steals the king's treasure only after admitting it exists!

  **Jinadatta (Buddhist):** *[Rises smoothly, a faint smile]* Venerable Vācaspati mistakes the lamp for the thief. We exclude darkness *by lighting the lamp*, not by prior knowledge of darkness-as-such. Similarly, the unique particular *(svalakṣaṇa)* – this specific yellow shape, this precise coolness – **causally triggers** the conceptual process leading to "mango" via exclusion of what does *not* produce that effect. We need no prior, freestanding "mango-ness." But let us illuminate *your* treasure, Nyāya-ji. You claim a real universal "cowness" *inheres* in each cow via a real relation, *samavāya*. **But what, pray tell, connects *samavāya* itself to "cowness"?** And what connects *that* connector? Do you not chase an infinity of metaphysical hooks – *samavāya₂* linking *samavāya₁* to "cowness," *samavāya₃* linking *samavāya₂* to *samavāya₁*, and so on? Your foundation is a regress, not bedrock.

  **Vācaspati:** *[Eyes gleam, anticipating the challenge]* A clever thrust, Jinadatta-ji, but it strikes air! *Samavāya* is **self-linking** *(svataḥ sambandha)* – it requires no further connector. It is the fundamental, irreducible tie binding a universal to its particular, like heat to fire. It is known *immediately* in the cognition "This cow possesses cowness." Just as you perceive a rope *as* a rope without perceiving a "ropeness-connector," the inherence relation is grasped *along with* the qualified object in determinate perception *(savikalpaka pratyakṣa)*. Your regress is a phantom conjured by denying perception's inherent intelligibility!

  **Jinadatta:** *[Leans forward, voice sharpening]* Self-linking? A convenient refuge! But tell me, Vācaspati-ji, when fire burns wood, **do you perceive "burning-ness" inhering in the fire via *samavāya*?** Or do you perceive fire (a unique particular with causal power) and wood (another unique particular) interacting – and *infer* a relation? Perception delivers the unique particulars and their causal sequence: *this* hot, bright thing contacts *this* dry, brown thing; then smoke arises. "Burning" is our *interpretation* of that sequence via exclusion (*apoha* – not non-burning). Your "inherence" is a conceptual overlay, not a perceived reality. Why multiply entities needlessly?

  **Vācaspati:** *[Strikes the floor lightly with his staff]* Needlessly? Consider the king's physician! He sees *this* bitter root and recognizes it *immediately* as *viṣaṇḍā* – a specific medicinal herb – because he perceives its universal form qualified by its properties. He acts *at once* to collect it. **If perception delivered only a bare, indeterminate *this***, he would stand bewildered! Action *(pravṛtti)* depends on determinate cognition: "This *is* viṣaṇḍā." Your "unique particulars" are barren islands; universals are the bridges enabling recognition, memory, and successful action. Without them, how do you explain that the physician *recognizes* viṣaṇḍā today as the *same kind* he saw yesterday?

  **Jinadatta:** *[Calmly]* Recognition is memory aided by similarity, not proof of a shared universal essence. The physician remembers the *effects* of that unique particular root – the alleviation of fever. **He groups this new particular *as if* it were the same, based on its similar causal potential** – its capacity to produce a like result. This "grouping" is *apoha*: excluding what does *not* produce that effect. The bridge is built *for the purpose of action*, not discovered in reality. Your bridges of *samavāya* are illusory causeways over a sea of unique, causally efficacious moments. We navigate the sea with practical rafts of exclusion, not by finding eternal islands of "herb-ness."

  **Vācaspati:** *[Voice rising slightly]* Practical rafts? Yet your raft of exclusion *presupposes* the very regularity of nature – the stable connection between a *type* of root and its effect – that you deny has any basis in reality! If each particular is utterly unique, why should *this* root cause an effect *similar* to *that* past root? Without a real universal grounding causal regularity, similarity itself becomes inexplicable magic! Your *apoha* is a name given to ignorance of the real basis for similarity – namely, the shared universal residing in distinct particulars via *samavāya*.

  **Jinadatta:** *[Smiles enigmatically]* The world displays patterns, Vācaspati-ji, like ripples on water. We see similarity because things *function* similarly in specific contexts for beings with specific needs and cognitive apparatus. **But to mistake the pattern for an eternal, inherent universal is the root of *prapañca* – conceptual proliferation and clinging.** Perception, purified, shows only the unique ripple arising and ceasing. *Apoha* is the tool we use to navigate the currents without drowning in the illusion of permanence. Your "real universals" are the anchors that sink the ship of liberation.

  *[A murmur runs through the court. King Śīlāditya raises his hand, his brow furrowed in deep thought. The afternoon sun slants through the high windows, illuminating motes of dust dancing in the charged air.]*

  **King Śīlāditya:** *[Voice measured, but weary]* Enough... for today. Vācaspati-ji, your anchors seem mighty, yet Jinadatta-ji makes them feel like weights upon perception itself. Jinadatta-ji, your raft is agile, yet Vācaspati-ji questions if it can truly bear the weight of the world's regularity. **The sun dips low. We shall reconvene tomorrow.** Let each sage reflect deeply upon the other's current. The truth, like the Ganges, may have many channels. *[He gestures dismissal. The debaters bow, eyes still locked in unyielding intellectual combat, as the court slowly disperses.]*

  ---
  **Key Dialectical Moves Illustrated:**
  1.  **Nyāya Opens:** Challenges *apoha*'s coherence without presupposing universals (The Recognition Problem).
  2.  **Buddhist Counters:** Regress objection against *samavāya* as a real relation.
  3.  **Nyāya Defense:** Invokes *samavāya* as *self-linking* (standard classical Nyāya response).
  4.  **Buddhist Shift:** Uses causal efficacy (*arthakriyā*) of particulars to undermine need for perceived inherence (e.g., fire burning).
  5.  **Nyāya Rebuttal:** Argues determinate perception (*savikalpaka*) is necessary for successful action (*pravṛtti*).
  6.  **Buddhist Reply:** Explains recognition/categorization via memory of effects and *apoha*, denying ontological basis for similarity.
  7.  **Nyāya Presses:** Argues regularity/similarity *requires* universals, making *apoha* parasitic.
  8.  **Buddhist Closes:** Reframes universals as *prapañca* (proliferation), positioning *apoha* as a pragmatic tool for liberation, not ontology.

  **Unresolved Tension:** The core clash persists – Does perception inherently deliver intelligible, structured reality (Nyāya), or only raw material for concept-construction (Buddhist)? Can causal regularity be explained without real universals? Does *apoha* covertly rely on what it denies? The King's adjournment mirrors the historical stalemate.
