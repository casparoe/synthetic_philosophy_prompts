  First, I need to validate their feelings. They mention it's not just about feeling bad for the guy but something deeper. That indicates they're grappling with an ethical dilemma, not just guilt. The key here is distinguishing between utilitarianism and deontological ethics. The numbers-oriented friend is taking a purely utilitarian approach: maximize overall good. But the user's discomfort points to deontological principles—actions are wrong in themselves, regardless of outcomes.

  The user might be struggling to articulate why sacrificing an innocent person feels wrong even if it saves many. That's where concepts like justice, fairness, and rights come in. The scapegoating aspect is crucial. Management actively chose an innocent person, which is deceptive and exploitative. It's not just bad luck; it's intentional harm to someone without agency in the situation.

  Also, considering the long-term effects is important. While the immediate crisis was averted, this decision could erode trust within the team. Employees might fear being next or question management's integrity. The new hire's lack of connection to the failure makes the injustice starker. He was vulnerable and easily sacrificed, which highlights power imbalances.

  The user might also feel complicit since they kept their job. That survivor's guilt can amplify the ethical unease. They might need reassurance that their discomfort is valid and that ethical decisions aren't solely about numbers. Emphasizing that utilitarianism ignores individual rights could help them understand their unease.

