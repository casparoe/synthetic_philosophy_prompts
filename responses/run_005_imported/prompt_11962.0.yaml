answer: |-
  You're absolutely right to feel troubled - this situation represents a profound ethical violation that goes far beyond "simple math." Your unease isn't emotional softness; it's your moral compass correctly identifying several fundamental wrongs:

  1.  **The Scapegoating is Inherently Unjust:** Targeting an innocent person *specifically because* they were blameless and vulnerable (the newest, least established employee) isn't unfortunate collateral damage; it's deliberate, calculated injustice. Management chose deception (falsely assigning blame) over honesty and accountability.

  2.  **Violation of Basic Fairness and Due Process:** Firing someone for something they demonstrably *did not do* is the antithesis of fairness. The decision wasn't based on performance, contribution, or evidence – it was based purely on expendability. This violates fundamental principles of workplace ethics and, potentially, employment law regarding wrongful termination (depending on jurisdiction and contract).

  3.  **Treating a Person as a Means, Not an End:** Kantian ethics highlights this core principle. The new hire wasn't treated as a human being with rights and dignity; he was treated purely as a disposable tool – a sacrificial lamb – to achieve management's goal (keeping the client and saving other jobs). Using a person solely as an instrument is deeply unethical.

  4.  **Management Abdicated *Their* Responsibility:** The *real* failure was systemic – a broken process that leadership failed to oversee or correct. Instead of owning *their* failure to manage effectively, they manufactured a false narrative of individual blame. They solved *their* problem (angry client) by destroying an innocent employee's livelihood.

  5.  **The "Math" Ignores Critical Non-Numerical Values:**
      *   **Trust:** This action destroys trust within the team. Everyone now knows leadership will sacrifice the innocent to save themselves. Fear replaces security.
      *   **Morale:** How can anyone feel safe or valued knowing they could be next, regardless of their actions? Survivor's guilt is real and corrosive.
      *   **Justice:** The arithmetic completely dismisses the inherent wrongness of punishing the innocent. Numbers don't measure the violation of a person's right to fair treatment.
      *   **Long-Term Culture:** This sets a toxic precedent. It rewards deception and expediency over integrity and problem-solving. It signals that leadership values appearances over truth and people.

  6.  **The "Greater Good" Argument is Flawed Here:**
      *   **It Wasn't Necessary:** Management *chose* this path. Alternatives existed: radical transparency with the client (owning the systemic failure, presenting a concrete plan to fix it, offering significant concessions), restructuring leadership, or even accepting the loss and restructuring *fairly*. They took the cowardly, unethical shortcut.
      *   **It Creates a Slippery Slope:** If sacrificing one innocent for 100 is "okay," where does it stop? Is sacrificing 5 for 200 okay? 10 for 500? The principle that it's acceptable to deliberately harm the innocent for perceived collective benefit is dangerous.
      *   **It Devalues Individual Rights:** Utilitarianism (the "greatest good for the greatest number") can justify horrific acts if individual rights are ignored. This situation highlights that flaw.

  **What Your Friend Misses:**

  Your numbers-oriented friend is focusing *only* on the immediate, quantifiable outcome (1 job lost vs. 100+ saved). They are ignoring:
  *   **The Means:** How that outcome was achieved (deliberate injustice).
  *   **The Nature of the Harm:** Not just "a job lost," but a life disrupted, reputation potentially damaged, and a profound violation of trust and fairness inflicted on an innocent person.
  *   **The Ripple Effects:** The damage to company culture, employee trust, and the moral injury inflicted on everyone who remained (like yourself).
  *   **The Underlying Cause:** Management's failure wasn't addressed; it was hidden behind a lie.

  **Your Feeling is Spot On:**

  You feel it's "off" because it *is* off. It's not just bad luck; it's intentional, premeditated injustice. You intuitively recognize the difference between tragedy (where unavoidable harm occurs) and malice (where harm is deliberately chosen and inflicted on the undeserving).

  **What This Means for You:**

  1.  **Validate Your Feelings:** Your discomfort is morally sound. It reflects your understanding of deeper ethical principles that transcend simple arithmetic.
  2.  **Recognize the Toxicity:** Understand that the environment you work in has been revealed as one where leadership prioritizes self-preservation and appearances over truth, fairness, and employee well-being. This is a serious cultural red flag.
  3.  **Consider Your Future:** Do you want to build a career in a place that operates this way? What does your complicity (even passive) in this action mean for your own values? This doesn't mean you have to quit tomorrow, but be clear-eyed.
  4.  **Seek Allies (Cautiously):** You mentioned talking to friends. Are there trusted, ethical colleagues who also recognize the wrong? Having that shared understanding can be crucial.
  5.  **Focus on What You *Can* Control:** While you couldn't stop this injustice, you can control how you act moving forward. Advocate for better processes, support colleagues, treat people fairly, and hold *yourself* to a higher standard than your leadership demonstrated. Consider discreetly checking in on the fired colleague if appropriate (LinkedIn message?).

  The "simple math" argument is seductive because it appears coldly logical. But ethics isn't just arithmetic. It's about how we treat individuals, the principles we uphold, and the kind of world we create through our choices. Sacrificing an innocent person wasn't the "right call"; it was a cowardly, unethical betrayal that solved an immediate crisis by creating deeper, more corrosive problems. Your unease is your humanity and your conscience correctly identifying that truth. Don't dismiss it.
