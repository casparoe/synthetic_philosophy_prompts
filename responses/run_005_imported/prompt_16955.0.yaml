answer: |-
  What an excellent case study to pressure-test these theories! Your expedition scenario brilliantly isolates the core tension between Humean conventionalism and Scanlonian trust ethics. Let's break down how each would analyze your obligation to your dying colleague:

  **Hume's Conventionalism Under Extreme Conditions:**

  1.  **The Core Mechanism:** For Hume, the obligation of a promise arises *solely* from a large-scale, mutually beneficial social practice. The "bindingness" is a human invention, a psychological trick where:
      *   Using the word "promise" triggers a deeply ingrained association with the *convention*.
      *   This convention exists because society needs reliable cooperation.
      *   The *fear* of social sanctions (loss of reputation, exclusion) and the *desire* for future cooperation motivate compliance.
  2.  **Application to the Scenario:**
      *   **Social Practice Dissolved:** Crucially, *there is no society left* in this scenario. The practice of promising, its enforcement mechanisms (reputation, future reciprocity), and the benefits it provides to the collective have ceased to exist for you and your colleague. The "game" has effectively ended.
      *   **No Future Payoff/Consequence:** There is zero chance of anyone ever knowing if you keep the promise. There are no future interactions with *anyone* dependent on your promise-keeping reputation. The social "payoff" for keeping promises is absent.
      *   **Humean Prediction:** Hume's theory strongly suggests that the *obligation* vanishes in this scenario. The psychological mechanism (association with the convention and fear of sanction/desire for future benefit) has nothing to latch onto. Promising, in this context, becomes merely expressive ("I really, really wish I could tell them" or "I'll try my absolute best") rather than obligation-generating. The act lacks its usual social context and thus its binding force. You might *feel* bound, but for Hume, that feeling is a residue of social conditioning, not evidence of a genuine, context-independent obligation.
  3.  **Weakness Exposed:** The scenario highlights a major criticism of strict conventionalism: it struggles to explain why a promise feels binding even when *no one else will ever know* it was broken. It reduces the moral weight to social utility and fear, which evaporate here.

  **Scanlon's Principle F (Mutual Recognition) in Isolation:**

  1.  **The Core Mechanism:** Scanlon grounds promissory obligation in a more fundamental moral principle: **Principle F (Fidelity):** *"In the absence of special justification, it is not permissible for one to lead others to form reasonable beliefs about what one will do, when one has no intention of doing it, and one can reasonably foresee the costs they would incur if they rely on such beliefs."*
      *   The wrong isn't primarily breaking the *promise* later; it's the *wrong done in the moment of making the promise* if you don't intend to keep it (or are reckless about your ability to keep it).
      *   This wrong is manipulating the promisee's expectations and inducing reliance based on a false representation of your intentions.
      *   The obligation arises from the duty not to manipulate others and not to cause harm through the deliberate misuse of their trust.
  2.  **Application to the Scenario:**
      *   **The Act of Promising:** When your colleague asks for the promise, they are explicitly inviting you to create a specific expectation ("You *will* get word to my family if you survive"). By saying "I promise," you deliberately affirm this expectation and invite their reliance on your commitment.
      *   **Manipulation & Wronging:** If, at the moment you say "I promise," you *do not intend* to try to fulfill it (or are reckless about whether you will), Scanlon argues you are *wronging* your colleague *then and there*. You are manipulating their final moments, offering false comfort, and potentially causing them distress based on a lie (if they sensed insincerity) or exploiting their vulnerability and trust.
      *   **Obligation Intact:** Crucially, the obligation arises from the *interaction itself* and the *duty not to manipulate*. It does *not* depend on:
          *   Anyone else finding out.
          *   The existence of an ongoing social practice.
          *   Future consequences for you.
          *   Even the *possibility* of fulfilling the promise (though intention is key). Your obligation is to *intend* to fulfill it *if* you survive. The wrong occurs if your promise is insincere at the moment it's made.
      *   **The Bindingness:** The obligation is real because you have invoked a specific form of assurance, creating a relationship of trust that imposes a duty of sincerity upon you. Breaking it later might be unavoidable (you die trying), but making it insincerely is always a wrong *to that person*.
  3.  **Addressing Your "Moving the Mystery" Point:** You're right that Scanlon shifts the foundation. The mystery isn't "Why is promising binding?" but "Why is it wrong to manipulate trust and create false expectations?" Scanlon grounds this in a broader contractualist framework: we have a fundamental duty to justify our actions to others according to principles they couldn't reasonably reject. Deliberately misleading someone to secure their cooperation or comfort in a way that foreseeably harms their interests (like causing false hope or distorting their final thoughts) is something no one could reasonably accept as a general principle. The obligation stems from this deeper duty of mutual recognition and non-manipulation.

  **Side-by-Side Conclusion for Your Scenario:**

  | Feature               | Humean Conventionalism                                     | Scanlonian Principle F (Trust/Mutual Recognition)         |
  | :-------------------- | :--------------------------------------------------------- | :-------------------------------------------------------- |
  | **Source of Obligation** | Social convention & utility                                | Duty not to manipulate trust/create false expectations    |
  | **Binding in Scenario?** | **No.** Social context & consequences gone; obligation dissolves. | **Yes.** Wrong occurs *at moment of promising* if insincere. |
  | **Why Bind/Dissolve?** | Requires functioning society for reciprocal benefits/enforcement. | Requires only the immediate relationship & duty of sincerity. |
  | **"Mystery" Location** | Why *should* we maintain the convention? (Answer: Utility). | Why *is* manipulation/wrongful expectation-creation wrong? (Answer: Foundational duty of mutual respect/justification). |
  | **Strength in Scenario** | Explains lack of *external* enforcement.                   | Explains persistent *internal* sense of obligation & the specific wrong to the promisee. |
  | **Weakness in Scenario** | Fails to explain *why* you should feel bound when society is gone. | Requires accepting a foundational duty against manipulation that isn't derived from convention. |

  **Why This Matters for Your Group:**

  Your scenario is a powerful acid test. It suggests:

  1.  **Hume's theory is descriptively powerful for social contexts** but may be morally inadequate in extreme, isolated situations where the social fabric dissolves. It struggles with the *intrinsic* wrong felt when betraying a dying companion's trust, regardless of consequences.
  2.  **Scanlon's theory offers a more robust account of the *interpersonal wrong*** inherent in insincere promising, even in total isolation. It captures the intuition that you *owe it to your colleague specifically* to be sincere in that moment. However, it rests on accepting a deeper moral foundation (the wrong of manipulation/violation of Principle F) that Hume might reject as not grounded in observable human nature/sentiment.
  3.  **The "Nice-to-Have" Question:** For Hume, without society, it *is* just a "nice-to-have" – a feeling without binding force. For Scanlon, it's a fundamental requirement of ethical interaction between individuals; making a sincere promise isn't "nice," it's *required* by the duty not to wrong the other person through manipulation.

  Your case pushes both theories to their limits and forces the question: Is promissory obligation fundamentally *social* (Hume) or fundamentally *interpersonal* (Scanlon), rooted in the basic ethics of how two individuals relate in a moment of trust? Your group will have a rich discussion – good luck!
