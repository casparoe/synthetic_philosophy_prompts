  The challenge is threading the needle: praising Ski's character without validating the war's morality. His own words—“I’d do the same thing again for the men next to me”—are key. They shift focus from geopolitical justice to personal bonds, which aligns with the traditionalist emphasis on soldiers' role while sidestepping ad bellum debates. 

  I should anchor the eulogy in universal virtues: loyalty, resilience, devotion. Highlight his postwar life—machinist, deacon, bad fisherman—to show how he channeled service into community roles. This avoids reducing him to just a soldier. The church setting helps; framing his actions through Lutheran values (service, humility) adds neutral, uplifting context. 

  Structure-wise: open with warmth, transition to Vietnam via his perspective (not the war’s), use his quote as emotional climax, then pivot to his civilian contributions. Close with legacy of love and quiet strength. No need to mention the seminar; the classmates will recognize the careful wording as integrity, not evasion. 

  Biggest risk is accidental implication. Words like "duty" or "honor" must be tied to his brothers-in-arms, not the cause. "Answered the call" works because it’s passive—he responded, didn’t champion. The fishing/church details soften the military section, making it one facet of a full life. 

  User’s fear of hypocrisy is valid. The draft forced him; his reflection shows moral depth. By quoting him, the eulogy lets him defend his own choices. That’s the shield: it’s Ski’s voice, not the speaker’s analysis. 

