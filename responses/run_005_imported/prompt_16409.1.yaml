  Now, the dialetheist reply: they always included a non-contractive conditional. So restricting contraction isn't a retreat but a development of their system. I need to evaluate if this reply holds. Is a non-contractive conditional integral to dialetheism, or is it an ad hoc addition when faced with Curry?

