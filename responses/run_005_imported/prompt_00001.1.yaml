  Standard example is:

  Without irrelevant alternative:
  - 5 voters: A > B
  - 4 voters: B > A → A wins

  Add C:
  - 5 voters: A > B > C
  - 4 voters: B > C > A

  Borda:
  A: 2*5 + 0*4 = 10
  B: 1*5 + 2*4 = 5+8=13
  C: 0*5 +1*4=4 → B wins

  Now the ranking between A and B flipped from A>B to B>A due to adding C. This violates IIA.

  But is this intuitive? The 5 voters strongly prefer A over everything, while the 4 have B as top choice. When C is added, the 4 voters can express their strong preference for B over C, while the A voters don't distinguish much between B and C. So B gets higher Borda score. 

  This could be seen as reasonable because the B voters care more about their preference. But it might still feel like a spoiler effect. 

  Perhaps the dinner example with intensity. 

  I recall a better intuitive example: choosing a restaurant where one option is a compromise. 

  Scenario 1: Only Steakhouse and Vegan Restaurant
  - 5 voters: Steakhouse > Vegan
  - 4 voters: Vegan > Steakhouse → Steakhouse wins

  Now add Vegetarian Restaurant (a compromise):
  - 5 steak lovers: Steakhouse > Vegetarian > Vegan
  - 4 vegans: Vegan > Vegetarian > Steakhouse

