  - Voter 3: Pizza > Tofu > Burger

  Borda count:
  Burger: 2+2+0 = 4
  Pizza: 1+1+2 = 4
  Tofu: 0+0+1 = 1 → Burger and Pizza tie

  But this doesn't show a reversal. 

  I found a better one online: 

  3 voters, 3 options: M, C, T
  Voter 1: M > C > T
