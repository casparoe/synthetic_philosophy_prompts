prompt: |-
  I'm putting together the session of my graduate seminar in formal epistemology that pairs van Fraassen's discussion of the Reflection Principle with Lewis's Principal Principle, and before I commit to the analogy in my lecture notes I'd like to pressure-test it. On the surface the two look like instances of a single deference schema: Lewis holds that your credence in A, conditional on the objective chance of A at t being x together with any admissible evidence, should equal x; van Fraassen holds that your credence in A now, conditional on your own credence in A at some later time t' being x, should likewise equal x. Both tell you to set your opinion equal to some credence-fixing quantity you haven't yet directly consulted — the world's chances in one case, your own future self's opinion in the other — and both have been motivated by something in the neighborhood of a diachronic Dutch book, or a "you shouldn't be able to predict the direction of your own belief revision" style argument.

  What I'm less confident about is how far the analogy survives once you look at what each principle needs in order to avoid triviality or outright counterexample. Lewis's principle depends entirely on a notion of "admissible" evidence to have any bite beyond the trivial case, and it famously needed patching — Lewis's own "New Principle" — once critics pointed out that on a Humean view of chance, facts about how the future actually unfolds can retroactively bear on what the chance at t already was, undermining the very ascription the principle was meant to license. Van Fraassen's principle, for its part, needs the proviso that you currently regard your future opinions as issuing from a process you trust; without it, anticipated brainwashing, memory loss, or sheer non-evidential drift would generate obviously absurd deference requirements. My worry is that these two escape clauses aren't doing the same kind of work: admissibility can at least be characterized without presupposing which verdicts it needs to protect, whereas "defer to your future self, except when you shouldn't" can look uncomfortably close to writing the desired answer into the antecedent, which would make Reflection much the more fragile of the two.

  I'd like your help thinking through this carefully. First, are these genuinely the same underlying norm in different guises, or is the surface parallel doing more rhetorical work than philosophical work? Second, in which specific respects — justificatory, formal, or in how each accommodates its exceptions — is the Reflection Principle a harder principle to defend than the Principal Principle, and is there any respect in which it is actually the more secure of the two? And third: suppose I currently have a well-defined chance to defer to, but I also have good independent reason to expect my own future, fully rational credence to diverge from it — not through any defect in me, but because the same undermining-style considerations mean there may be no single settled fact about the current chance for the Principal Principle to have latched onto in the first place. In a case like that, does Reflection quietly end up doing the real work while the Principal Principle becomes inapplicable, or is there a principled way to keep both operative at once?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing a graduate seminar on formal epistemology, specifically comparing van Fraassen's Reflection Principle with Lewis's Principal Principle. The user wants to test how robust this analogy is, especially when considering exceptions and defenses of each principle. 

  First, I need to recall the core of both principles. The Principal Principle (PP) says that your credence in A should match the objective chance of A, given admissible evidence. Reflection requires that your current credence in A should align with your future credence, conditional on what that future credence will be. The user sees both as deference norms but is concerned about how each handles exceptions—admissibility for PP and trust for Reflection.

  The user's main worry is whether the trust condition in Reflection is circular compared to the admissibility in PP. They also question if Reflection is harder to defend and what happens when chance and future credence conflict due to undermining. 

  I should start by addressing the structural analogy. Both principles involve deference to an expert—chance for PP, future self for Reflection. The Dutch book arguments for both suggest that violating them makes you vulnerable to exploitation. But the key difference lies in the exceptions. Admissibility in PP is external, based on what information doesn't contain future outcomes. For Reflection, trust is internal, relying on the agent's judgment about their future rationality. This makes Reflection more subjective, possibly circular.

  Next, considering why Reflection might be harder to defend. The trust condition can be vague. What counts as "trusting" your future self? If you know you'll be brainwashed, you shouldn't defer. But defining "irrational" changes is tricky. PP's admissibility, while not perfectly defined (like in the case of undermining), has more formal criteria, like historical information. Reflection's reliance on the agent's current assessment introduces subjectivity, making it less robust.

  Then there's the undermining problem for PP. If chances depend on future events (Humean view), conditionalizing on the future can make PP inconsistent. Lewis's New Principle adjusts for this. But for Reflection, if the agent expects their future credence to differ due to undermining, should they still defer? Here, Reflection might take precedence if the future self accounts for undermining correctly. But if the agent doubts their future self's ability to handle undermining, trust is broken, and Reflection doesn't apply. So in cases where chance is undefined due to undermining, a rational agent's future credence, which considers all evidence, might be what to defer to, making Reflection operational where PP fails.

  The user's deeper concern might be about the foundations of epistemic norms. They might be questioning whether deference to external chances is more objective than deference to one's future self. Also, they might be exploring how these principles interact in cases of uncertainty about chance itself. 

  I should also consider the seminar context. The user needs to present these concepts clearly, highlighting similarities and critical differences. They might want to provoke discussion on whether Reflection's subjectivity is a weakness or a realistic feature of rationality. Emphasizing the role of trust in epistemic communities could be a point to explore. 

  In conclusion, the analogy holds structurally but differs in handling exceptions. PP is more defensible due to clearer admissibility criteria, while Reflection's reliance on trust makes it more fragile. However, in undermining scenarios, Reflection might guide when PP can't. The user should present both principles' strengths and weaknesses, using examples like brainwashing for Reflection and undermining for PP to illustrate when each applies or fails.
answer: |-
  Your analogy is philosophically insightful and pedagogically valuable, but you're right to pressure-test the deeper parallels, especially regarding exceptions. Let's break down your questions systematically:

  **1. Are they the same underlying norm?**  
  They share a *formal structure* of deference to an "expert" probability (chance/future credence), motivated by avoiding diachronic incoherence. However, they embody *distinct normative foundations*:
  - **Principal Principle (PP):** Deference to an **external epistemic authority** (objective chance). Justified by chance's role as an "expert function" guiding rational belief about the world.
  - **Reflection Principle (RP):** Deference to **one's own future rational self**. Justified by ideals of diachronic rationality and self-trust, avoiding self-prediction of "error."

  The parallel is **substantive but not identity**. PP is fundamentally *metaphysical* (chance as a feature of reality), while RP is *epistemic* (rational credence as a feature of the agent). The surface similarity does significant philosophical work in highlighting deference structures, but the foundations differ.

  **2. Is Reflection harder to defend? Where?**  
  Yes, RP faces unique vulnerabilities compared to PP:

  *   **Justificatory Vulnerability:**  
      - PP's justification (Dutch Books, calibration to world-frequencies) relies on objective features.  
      - RP's justification (diachronic Dutch Books, self-trust) is more easily contested. Why *must* I trust my future self? Brainwashing counterexamples expose this. The "can't predict revision direction" argument is compelling but less anchored than PP's world-connection.  
      - **Key Difference:** PP violations risk *miscoordination with the world*; RP violations risk *diachronic incoherence with oneself*. The former feels more objectively compulsory.

  *   **Formal Vulnerability (The Proviso Problem):**  
      This is RP's Achilles' heel compared to PP:  
      - **PP's Admissibility:** While tricky (especially for Humeans), "admissibility" has *some* objective anchors:  
          - **Formal Definition:** Information about events *before* time *t* is generally admissible; information about *t* or later is generally inadmissible (Lewis's "historical" criterion).  
          - **Functional Role:** Evidence is inadmissible if it *screen's off* chance from the outcome (e.g., knowing the actual outcome).  
          - **Goal:** Isolate the *best current guide* (chance) from information that *trumps* it. The concept exists somewhat independently of the principle it saves.  
      - **RP's Trust Proviso:** This lacks comparable objectivity:  
          - It's defined *entirely* by its role in saving RP from counterexamples ("defer, except when you rationally expect unreliability").  
          - "Trust," "rational," "defect," "non-evidential influence" are **agent-relative and judgment-laden**. What counts as "brainwashing" vs. "rational persuasion"?  
          - **Circularity Risk:** The proviso essentially says "defer only when you rationally believe deference is rational." This risks vacuity or presupposing the rationality it's meant to establish.  
      - **Conclusion:** RP's proviso *is* more fragile and potentially question-begging. PP's admissibility, while problematic (especially under Humeanism), has a clearer, less circular *formal* characterization. RP relies heavily on the agent's *subjective assessment* of their future rationality.

  *   **Where RP is *more* secure?**  
      RP has one potential advantage: **Epistemic Accessibility**.  
      - Knowing the *objective chance* is often difficult or impossible.  
      - Knowing your *own future credence* (or conditionalizing on it hypothetically) is, in principle, accessible *now* if you model your future self.  
      - In practice, RP might be more readily *applicable* for an agent deliberating, even when chances are obscure. (But this doesn't make it *more defensible* normatively).

  **3. The Undermining/Conflict Scenario: PP vs. RP**  
  This is a profound challenge. Imagine:
  - You have a well-defined current chance function *ch* (pre-undermining).
  - You are a Humean, so you know *ch* itself probabilistically depends on the future total history *H*.
  - You rationally expect that by future time *t'*, you'll have evidence strongly suggesting *ch* was *not* the true chance (because *H* turned out incompatible with *ch* being typical). Your rational future credence *cr_{t'}(A)* will diverge from *ch(A)*.

  **What happens to the principles?**

  1.  **Principal Principle (PP) Falters:**  
      - The standard PP *cr_now(A | ch_t = x \& E) = x* breaks down if *E* includes information that *undermines* *ch_t = x* (e.g., evidence about *H*). This is the "big bad bug."  
      - Lewis's **New Principle (NP)** attempts a fix: *cr_now(A | H_t \& T) = ch_T(A)*, where *T* is the complete chance theory true at *t*, and *H_t* is history up to *t*.  
      - **But:** In your scenario, you *don't yet know* *H* or the true *T*. You only have your *current best estimate* of the chance *ch*, which you *expect* future evidence will undermine. The NP tells you how to conditionalize *if you knew* *H_t* and *T*, but you don't. The *current normative grip* of PP/NP weakens precisely because you anticipate its future inapplicability.

  2.  **Reflection Principle (RP) Steps In?**  
      - RP says: *cr_now(A | cr_{t'}(A) = y) = y*.  
      - If you rationally expect your future self at *t'* to have credence *y* in *A* based on *all evidence available then* (including the undermining evidence about *H*), and you *trust* that future self (you believe they processed the undermining evidence rationally), then **RP commands you to align your current credence with that anticipated future credence *y***.  
      - **In this scenario, RP *does* seem to take normative precedence.** Your future self at *t'* incorporates the evidence that undermined *ch* and forms the best *current* (at *t'*) estimate. RP tells you to defer to *that* expert (your future rational self), bypassing the now-suspect *ch*.

  3.  **Can Both Operate?**  
      - **Simultaneously?** Not directly on *A*. PP/NP points to *x* (based on current chance estimate), RP points to *y* (anticipated future credence). If *x* ≠ *y*, they conflict.  
      - **Hierarchically?** Arguably, yes, in a way that favors RP:  
          - PP/NP governs deference to *current objective chance estimates*.  
          - RP governs deference to *your future epistemic state*.  
          - If you rationally *expect* your future epistemic state to have information showing your *current* chance estimate was wrong, then RP instructs you to *already* align with that future state. The rational expectation of future undermining *defeats* the current normative force of PP/NP *for setting your current credence* regarding *A*.  
      - **Principled Integration?** One could see RP as the *overarching diachronic* norm, while PP/NP is a *synchronic* norm *within* a temporal slice *conditional on accepting a chance hypothesis*. When diachronic considerations (like expected undermining) cast doubt on the synchronic chance hypothesis, the diachronic norm (RP) dominates. Your future self, incorporating all evidence (including undermining), becomes the relevant "expert" for your current self to defer to.

  **Conclusion & Teaching Recommendation:**

  1.  **The Analogy Holds (Structurally):** Presenting PP and RP as paradigmatic "deference norms" is sound. Highlight their shared formal structure (C(A | Expert says x) = x) and their shared vulnerability to Dutch Books if violated naively.
  2.  **Highlight the Critical Difference (Exceptions):** Explicitly contrast the nature of their escape clauses. PP relies on the quasi-objective (though problematic) "admissibility." RP relies on the subjective, potentially circular "trust." This makes RP significantly more fragile philosophically. Use the brainwashing vs. undermining examples to illustrate the difference vividly.
  3.  **Address the Conflict Scenario:** Acknowledge that in the deep waters of Humean undermining, where current chance seems fragile, RP can emerge as the dominant norm *if* the agent rationally trusts their future self to incorporate the undermining evidence correctly. In such cases, RP isn't just a fallback; it becomes the primary guide, leveraging the future self's anticipated comprehensive evidence. This shows RP's unique role in diachronic rationality when objective guides become unstable. Emphasize Lewis's New Principle as an attempt to salvage PP *within* the synchronic frame, but note its limitations when future undermining is anticipated *now*.
  4.  **Frame the Debate:** Conclude by framing the core question: Is rational credence ultimately grounded in tracking objective features of the world (favoring PP, even with its patches), or in maintaining coherent, unified agency over time (favoring RP, despite its subjectivity)? This tension lies at the heart of formal epistemology.

  Your analogy is powerful and pedagogically useful. By carefully acknowledging its limits, especially regarding the provisos and the undermining scenario, you turn potential weaknesses into strengths for teaching, demonstrating the nuances and ongoing debates within the field.
