answer: |-
  Here’s a toast that tackles the reference class problem with warmth, humor, and clarity for all audiences:

  **(Clink glass gently, stand confidently with a slightly mischievous smile.)**  

  "Friends, family, and fellow witnesses to this wonderful chaos… as many of you know, I spend my days wrestling with numbers. So, naturally, when [Bride] and [Groom] asked me to speak, I immediately started calculating the odds. *Leans in conspiratorially.* For months, I’ve been threatening to open with the classic statistician’s wedding line: 'Did you know the average marriage has about a 40% chance of ending in divorce?'  

  *(Pause for a knowing chuckle from the data crowd, slightly confused looks from others.)*  

  "But here’s the thing… I’m not going to say that. And it’s not just because I value my life and these open bar privileges. *(Winks at the couple.)* It’s because my *job* is to know why that number is basically useless… *especially* for these two incredible humans standing right here.  

  *(Shift tone slightly more earnest, but keep it light.)*  

  "See, that 40%? It’s an average. It’s like saying the average person has one leg and one arm. *(Pause for beat.)* No, wait, that’s not right… *(Quick correction.)* It’s like saying the average *temperature* in the world is 57 degrees. Sounds specific, right? But it tells you absolutely nothing about whether *you* need a coat in *this* room right now.  

  "The problem is called the ‘reference class problem’. *(Hold up a hand reassuringly.)* Don’t worry, that’s just jargon for: **Which group do we shove [Bride] and [Groom] into to guess their odds?**  

  "Think about it. Are they ‘All Marriages’? Well, sure, but that includes people who got hitched after knowing each other for three days in Vegas… and couples who fundamentally disagree on whether pineapple belongs on pizza. *(Shakes head gravely. Maybe a quick glance at the couple if they have a known pizza stance.)*  

  "Are they ‘College Sweethearts’? That group might do better. Or ‘Second Marriages’? That group might have *different* odds. Or ‘People Who Argue Passionately About Dishwasher Loading Efficiency’? *(Looks pointedly at the couple, likely drawing laughs from friends who know this is a real argument.)* That group… well, I actually don’t have data on that one. Yet.  

  "The point is, there are a *million* different groups we could put them in, each with its own percentage. And there’s no magic math rule that tells me which group is the *right* one for predicting *their* specific future. The statistician’s dirty little secret? **You two defy averages. You built your own dataset.**  

  *(Pivot warmly to the couple.)*  

  "And what an incredible dataset it is. We’ve all seen it grow. It’s not just about shared history, though there’s plenty of that – from questionable college parties to navigating actual adulthood. It’s about the *specifics* that no average could ever capture:  

  *   The way [Bride] can make [Groom] laugh until he snorts, even when he’s trying to be mad about that dishwasher.  
  *   The unwavering support [Groom] gives [Bride] when she’s chasing her latest ambitious dream.  
  *   The fact that you both showed up for each other during [mention a specific tough time or shared challenge, e.g., ‘that insane apartment flood’, ‘job hunts’, ‘family stuff’] – proving your partnership isn’t just fair-weather.  
  *   The shared, slightly terrifying love for [mention a quirky shared hobby/passion, e.g., ‘extreme birdwatching’, ‘competitive board games’, ‘collecting vintage lawn gnomes’].  

  "These aren’t data points in someone else’s spreadsheet. These are the unique ingredients of *your* marriage. Your ‘reference class’ isn’t ‘All Marriages’ – **it’s ‘[Bride] and [Groom]’.** And based on the evidence *we’ve* all witnessed – the respect, the communication (even the dishwasher debates!), the deep friendship, the sheer joy you find in each other – *that* specific class? It looks pretty damn solid.  

  "So, I’m officially retiring the 40% joke. It was lazy statistics and lousy friendship. Instead, my professional prediction – based on the unique variables right in front of me – is a very high likelihood of laughter, adventure, unwavering support, and a love that keeps getting stronger.  

  *(Raise glass high.)*  

  "To [Bride] and [Groom]! May your unique dataset continue to grow richer, your dishwasher debates remain passionate but unresolved, and your marriage be a joyful outlier in the very best way. Cheers!"  

  **Why this works:**  

  1.  **Acknowledges & Dismantles the Joke:** Explicitly mentions the planned opener and explains *why* it’s flawed in an accessible way (analogies like average temperature/one leg, simple explanation of reference class).  
  2.  **Accessible for All:** Uses humor and relatable examples (Vegas weddings, pineapple pizza, dishwasher arguments) to explain a complex statistical concept without jargon overload. The term "reference class" is introduced but immediately demystified.  
  3.  **Funny Throughout:** Maintains a light, self-deprecating (statistician's dirty secret), and observational (dishwasher, quirks) humor. The "one leg" joke and pizza example land broadly.  
  4.  **Shifts to the Positive & Personal:** The core of the toast becomes celebrating the couple's *unique* strengths and relationship, using specific, heartwarming examples familiar to the audience. This is the emotional payoff.  
  5.  **Warm & Sincere Ending:** The final prediction is heartfelt and based on observable qualities, replacing the cold statistic with genuine optimism. The final cheers focus on their unique journey.  
  6.  **Respectful:** It honors the couple by taking their relationship seriously and rejecting a flippant statistical take.  
  7.  **Pacing:** The structure (hook, problem, explanation, pivot to couple, personal examples, heartfelt conclusion, toast) fits comfortably within 3 minutes.  

  **Deliver with:** Confidence, warmth, good eye contact (especially with the couple during the personal part), and genuine smiles. Let the humor land naturally – don't rush the punchlines. The shift from statistician-mode to friend-mode should feel sincere. Enjoy the moment!
