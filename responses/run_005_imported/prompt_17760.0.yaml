    - **-2 pts** for not recognizing that bounded utility *preserves* conditional convergence (and thus rearrangement-dependence) if payouts grow without bound in magnitude.  
    - **No additional deduction** because they correctly described the St. Petersburg fix and noted Pasadena's bidirectional payouts.  
  - **Why this matters:** The student’s answer implies the problem is "unboundedness," but Nover & Hájek show it’s really "order-dependence under conditional convergence." Bounded utility solves unboundedness but *not* order-dependence here.  

