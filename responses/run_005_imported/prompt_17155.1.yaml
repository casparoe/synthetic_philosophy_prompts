prompt: |-
  Okay, random decision theory thing that's been bugging me while I draft a dissertation chapter on acausal cooperation. People talk about 'evidential cooperation in large worlds' (ECL) -- roughly, the idea that in a big enough universe, acting more cooperatively toward value systems other than your own is evidence that agents elsewhere who are correlated with you are doing the same, so you get gains from trade with zero causal contact -- like its some brand new exotic argument. But every time I trace through the reasoning it feels suspiciously close to Toby Ord's old 'moral trade' idea, just with an actual negotiation swapped out for correlation. Can you compare the two properly: what extra assumptions (about correlation between agents, decision theory, the size/structure of the universe, etc.) does ECL need that ordinary moral trade between two people who can actually talk to each other doesn't? And give me your honest take -- does ECL actually get you cooperative gains that plain old moral trade couldn't already deliver, or is it basically the same mechanism wearing an acausal costume? Justify whichever way you land.
