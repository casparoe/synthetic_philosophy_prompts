  For the attention vs. perception question, the guest might argue that attention modulates input but doesn't change the experience itself. The follow-up should challenge whether attention's effects are truly pre-perceptual. Maybe referencing studies where expectations alter perceived qualities despite controlled attention.

  Next, perceptual learning. The guest might say that even with new feature detectors, cognitive states still shape perception during learning. The follow-up could ask if there's a point where learning makes the process cognitively impenetrable, forcing a distinction between acquisition and application.

  The circularity issue is tricky. If perception is shaped by beliefs, how can it independently verify them? The guest might respond with degrees of penetration or error signals. The follow-up should press on how to measure penetration without circularity, maybe using conflicting cues or neural markers.

  For early-vision encapsulation, the guest likely dismisses Fodor's strict modularity. The follow-up can cite cases where high-level knowledge seems to affect early processing, asking if encapsulation is just a methodological stance rather than a reality.

