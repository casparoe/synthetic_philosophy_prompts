answer: |-
  ## The Shifting Sands of Democracy: Assessing AAI and ASP Against Whelan's Boundary Problem

  Frederick Whelan's "boundary problem" exposes a foundational paradox at democracy's core: any democratic procedure requires a pre-defined *demos* (the people) to function, yet defining that *demos* democratically is logically impossible without already assuming its existence. Whelan concludes that the boundary must be set externally, beyond democratic theory itself. Robert Goodin's All-Affected-Interests (AAI) principle and the All-Subjected Principle (ASP) championed by Arash Abizadeh and David Owen are prominent attempts to provide such an external criterion. However, a critical assessment reveals that neither principle fully escapes Whelan's circularity; they primarily relocate it to prior questions about the scope of "affected interests" or "subjection." While both offer valuable moral insights, ASP provides a more practically workable, though still imperfect, foundation.

  **The All-Affected-Interests Principle: Universal Scope, Precarious Definition**

  Goodin's AAI principle holds that everyone whose interests are causally affected by a collective decision should have a say in making it. Its moral appeal is undeniable: it directly links political voice to the consequences of power, grounding inclusion in a fundamental principle of fairness. If a policy impacts you, justice demands you have input. Furthermore, it seems externally grounded – the causal impact exists independently of the democratic process itself.

  However, AAI's escape from circularity is illusory. The principle merely **relocates the boundary problem** to the prior question: *Who counts as "affected," and how significantly must their interests be impacted?* Goodin readily admits the principle tends towards universal inclusion for significant decisions, implicitly acknowledging this indeterminacy. But defining the relevant threshold of "affectedness" is fraught:

  1.  **Causal Chains and Dilution:** Causal chains are potentially infinite. Does a tariff on steel in Country A "affect" a consumer in Country B through global markets? Does a climate policy "affect" future generations? If so, the *demos* becomes impossibly vast and diffuse.
  2.  **Defining "Interests":** What constitutes a relevant "interest"? Is it only material well-being, or does it include cultural, psychological, or moral interests? Who defines this? The answer presupposes a normative framework established *before* the *demos* is constituted.
  3.  **Threshold of Significance:** Is any minuscule effect sufficient, or must the impact reach a certain threshold? Determining this threshold requires a prior decision-maker – reintroducing the very boundary problem AAI seeks to solve.

  Therefore, applying AAI requires an *antecedent, non-democratic determination* of the scope of relevant "affected interests" and the threshold for inclusion. This determination is not provided by the principle itself and is vulnerable to the same circularity Whelan identified. AAI offers a powerful moral *ideal* but lacks the practical machinery to define a bounded *demos* without smuggling in prior assumptions about who matters and how much.

  **The All-Subjected Principle: Coercion as Anchor, Borders as Blind Spot**

  ASP grounds the *demos* in the experience of being subject to a polity's coercive power: only those bound by and coerced through its laws belong to its people. Its strength lies in its focus on a tangible, politically salient fact – the exercise of sovereign authority. Subjection to coercion creates a unique relationship demanding a right to justification and participation (the republican non-domination ideal). It aligns well with the territorial reality of existing states and seems externally verifiable – laws and their enforcement define the subjected.

  Yet, ASP also **relocates, rather than resolves, Whelan's circularity**. The critical prior question becomes: *What defines the jurisdiction to whose laws one is subjected?* The principle assumes a pre-existing territorial or jurisdictional boundary:

  1.  **The Jurisdictional Presupposition:** ASP identifies the *demos* based on subjection to a *specific polity's* laws. But the existence and territorial scope of *that specific polity* is precisely what needs justification in the first place. Who decided the borders within which coercion operates? ASP takes the jurisdiction as given, but its boundaries were likely set non-democratically (through history, force, or prior agreement).
  2.  **Defining "Coercion" and "Subjection":** While seemingly objective, the line between coercion and other forms of influence can be blurry. Are tourists subjected? What about corporations? Individuals subject to indirect effects (e.g., global financial regulations)? Defining the *nature* and *degree* of subjection required again requires prior normative judgments.
  3.  **Multiple Subjections:** Individuals are often subject to overlapping coercive structures (local, national, supranational). ASP struggles to clearly delineate which *demos* they belong to for which decisions.

  Thus, ASP relies on an *antecedent, non-democratic definition of the jurisdiction* whose coercive power defines subjection. It solves the boundary problem *within* a pre-constituted jurisdiction but cannot democratically justify the jurisdiction's initial boundaries.

  **Weighing the Scales: Practicality vs. Idealism**

  *   **AAI's Strength:** Its immense moral power. It captures the intuition that impact demands voice and offers the most *principled* argument for global democratic inclusion, especially regarding transnational issues like climate change. Its weakness is its practical indeterminacy and tendency towards an unworkably vast *demos*.
  *   **ASP's Strength:** Its practical and institutional realism. It provides a clear(er), stable, and administratively feasible criterion that aligns with existing state structures and the core democratic function of legitimating coercion. Its weakness is its conservative acceptance of existing (often arbitrary or unjust) borders and its potential exclusion of those significantly affected but not directly subjected.

  **Verdict: The Imperfect Escape and ASP's Pragmatic Edge**

  Whelan was fundamentally correct: **no principle can *fully* escape the logical circularity of the boundary problem from within a pure democratic theory framework.** Both AAI and ASP relocate the circularity to antecedent questions (defining "affectedness"/"subjection" and jurisdiction). A truly "principled solution" in the sense of a perfectly objective, non-circular, self-grounding criterion is likely unattainable.

  However, this does not mean the problem is utterly insoluble or that we must abandon the search for legitimate foundations. Democracy requires starting points. The question becomes: **which relocated boundary problem offers a more stable, morally defensible, and practically viable foundation for constituting a *demos*?**

  Here, **ASP comes significantly closer to providing a workable solution.** Its reliance on the factual reality of coercive jurisdiction, while historically contingent, provides a concrete anchor point. It acknowledges the inherent link between the authority to make binding laws and the community bound by them. It generates a bounded *demos* capable of collective action and decision-making. While the initial jurisdictional boundary may lack democratic pedigree, ASP provides a *democratic principle for constituting the ongoing demos within that jurisdiction*, demanding that *those coerced* must rule. This offers a path towards *internal* democratic legitimacy once the (externally set) jurisdictional frame exists.

  **A Hybrid Path Forward: ASP Plus**

  ASP should be the primary constitutive principle, but its limitations necessitate supplementation:

  1.  **Second-Order Inclusion via AAI:** Within the ASP-defined *demos*, decision-making procedures should incorporate mechanisms to consult or represent significantly affected outsiders where feasible and proportionate (e.g., on environmental treaties). This injects AAI's moral concern without collapsing the constitutive boundary.
  2.  **Democratic Boundary Revision:** The ASP *demos* must have the democratic capacity to revise its own jurisdictional boundaries (e.g., via treaties, federation, secession referendums) in response to changing realities and moral claims, gradually aligning coercion with affectedness where possible.
  3.  **Supranational Structures:** For issues inherently global in affectedness (e.g., pandemics, climate), new ASP-based demoi at supranational levels (where coercion is applied) need to be built, acknowledging the multi-layered nature of subjection in a globalized world.

  **Conclusion**

  Whelan's boundary problem exposes a deep logical flaw in democracy's self-foundation. Neither AAI nor ASP magically dissolves this circularity; both shift the problem to the definition of their core criteria ("affected," "subjected," "jurisdiction"). However, ASP provides a more pragmatically viable and institutionally coherent starting point by anchoring the *demos* in the undeniable reality of shared subjection to coercive power. Its acceptance of contingent borders is a necessary compromise for functional democracy, but one that must be tempered by the moral insights of AAI through internal inclusion mechanisms and a commitment to democratic boundary revision. The boundary problem may not admit a perfectly circularity-free solution, but ASP, critically augmented, offers the most defensible and workable foundation for building legitimate democratic communities in our complex world. Democracy begins not with a perfect principle, but with the collective project of legitimizing power among those it most directly binds.
