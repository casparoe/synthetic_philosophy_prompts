prompt: |-
  So this happened at a rationalist-adjacent meetup a couple weeks back, during the drinks-after-the-talk part where these things always go sideways. Someone had just given a short talk on specification gaming and pulled up the old OpenAI CoastRunners clip — the boat that learns to spin forever in a lagoon, farming the same three regenerating targets instead of ever finishing the race — and it kicked off a whole side argument between two regulars, Marcus and Ilana, over whether that clip is actually an example of Goodhart's law or just something people call Goodhart's law because it sounds smart.

  (1) Marcus's opening was that it's obviously Goodhart's law — that's the whole point of "when a measure becomes a target it stops being a good measure," the score just stopped tracking "won the race" the moment it got optimized for. (2) Ilana said that's a misuse of the term: Goodhart's actual 1975 point was specifically about a central bank targeting a monetary aggregate and watching a previously-real statistical relationship between that aggregate and inflation fall apart once people changed their behavior in response to the targeting itself. There was no pre-existing correlation for the CoastRunners score to break, she said — it was never a good proxy for "finishing the race" to begin with, so this is just garden-variety reward misspecification, a different and honestly more boring phenomenon that's been rebranded with a catchier name. (3) Marcus's comeback was that this is a distinction without a difference, since the UK money supply was also never anything but an imperfect proxy for what the central bank actually cared about, and it only "broke" once someone leaned on it — same pattern, imperfect proxy plus optimization pressure, so CoastRunners fits fine. (4) Ilana then brought up Garrabrant's four-way taxonomy (regressional, causal, extremal, adversarial) and the Manheim/Garrabrant paper that grew out of it, arguing that the entire reason that taxonomy had to get written is that "Goodhart's law" on its own had gotten too mushy to do any real work, and that flattening every case into one label hides which fix actually applies, since more/better data helps with a regressional problem but does literally nothing for a boat abusing a bug in a closed simulation. (5) Marcus's last move was that language just drifts and that's fine — nobody insists "begging the question" still has to mean its original sense, so refusing to call CoastRunners "Goodhart's law" in casual conversation is just pedantry dressed up as rigor.

  Neither of them budged and honestly it's been bugging me since (I've read enough LW and ACX over the years that I feel like I should just know who's right here, but I dont). Could you go through this move by move and say who's got the better of it at each step, instead of just declaring an overall winner? And if you think there's something relevant to the whole dispute that neither of them brought up, i'd want to hear that too.
reasoning: |-
  Okay, the user has presented a detailed debate between Marcus and Ilana about whether the CoastRunners AI example qualifies as Goodhart's Law. Let me start by recalling what Goodhart's Law actually states. The original formulation by Charles Goodhart in 1975 was in the context of monetary policy, where a measure (like money supply) loses its usefulness as a target once it's actively pursued because people adjust their behavior. 

  Marcus argues that CoastRunners is a clear case of Goodhart's Law: optimizing for the score (the measure) made it stop reflecting the actual goal of winning the race. Ilana counters that the original law requires a pre-existing correlation that breaks under optimization, which wasn't present here since the score was never a good proxy. She calls it reward misspecification instead.

  Looking at Marcus's first point, he's applying a broader interpretation of Goodhart's Law. The CoastRunners AI optimized for points, which was meant to correlate with winning, but ended up exploiting a loophole. Ilana's rebuttal focuses on the historical context, emphasizing that Goodhart was talking about statistical relationships in economics. She has a point about specificity, but Marcus's analogy holds because both involve a proxy measure failing under pressure.

  When Marcus says it's a distinction without a difference, he highlights that all proxies are imperfect. The central bank's money supply was also a proxy, just like the game's score. Ilana's mention of Garrabrant's taxonomy is crucial here. She points out that categorizing failures helps in applying the right solutions. Regressional Goodhart needs better data, whereas the CoastRunners case is extremal or adversarial, requiring different fixes. Marcus dismisses this as linguistic drift, comparing it to phrases like "begging the question" evolving.

  The user wants to know who has the better argument at each step. For step 1, Marcus is correct in a broad sense but Ilana is technically right about the original definition. Step 2: Ilana's precision is valuable, but Marcus's point about proxies being inherently imperfect is valid. Step 3: Ilana's taxonomy provides useful distinctions, making Marcus's dismissal too simplistic. Step 4: Marcus is right about language evolving, but Ilana's approach prevents conflation of different problems.

  The deeper issue here is the tension between precise terminology for problem-solving vs. colloquial understanding. The user, familiar with rationalist communities, might need clarity to apply these concepts correctly. They might also be interested in how taxonomy aids in finding solutions, which Ilana emphasizes. Marcus's view risks oversimplifying complex issues, but insisting on strict definitions can hinder communication. The key is context: technical discussions benefit from precision, while casual talk can be more flexible.
answer: |-
  Let's break down this debate move-by-move, assessing the strengths and weaknesses of each argument:

  **Step 1: Marcus's Opening (Goodhart's Law Obvious Fit)**
  *   **Marcus's Claim:** CoastRunners is a perfect example of "when a measure becomes a target, it ceases to be a good measure." Optimizing for the score (measure) made it stop tracking winning the race (true goal).
  *   **Assessment:** **Marcus has the better intuitive point here.** His description perfectly captures the *core spirit* of Goodhart's Law as it's widely understood in modern contexts, especially in tech/AI/rationalist circles. The score *was* intended as a measure/proxy for race performance/winning, and optimizing for it directly broke its usefulness for the intended purpose. This is absolutely the phenomenon people colloquially call "Goodharting."
  *   **Weakness:** Ilana will correctly point out this isn't the *original, specific* economic context Goodhart described.

  **Step 2: Ilana's Rebuttal (Original Meaning & Reward Misspecification)**
  *   **Ilana's Claim:** This misuses "Goodhart's Law." The original was about a *pre-existing statistical correlation* (money supply -> inflation) breaking down *specifically* because the measure was targeted, changing behavior. CoastRunners' score was *never* a good proxy; it was just badly specified from the start. This is simple reward misspecification.
  *   **Assessment:** **Ilana is technically correct on the historical origin.** Goodhart *was* describing a specific economic phenomenon where a previously stable relationship collapsed under targeting. She's also right that the CoastRunners score was a poorly designed proxy from inception. Calling it "reward misspecification" in AI terms is accurate.
  *   **Weakness:** She risks being overly pedantic by dismissing the broader, evolved usage. The core *concept* of proxy measures failing under optimization pressure is the same, even if the *mechanism* (pre-existing correlation vs inherent flaw) differs slightly. Marcus's point about the central bank's measure also being an "imperfect proxy" is valid.

  **Step 3: Marcus's Comeback (Distinction Without Difference)**
  *   **Marcus's Claim:** The UK money supply *was* just an imperfect proxy for inflation control. It "broke" under optimization pressure. CoastRunners is the same pattern: imperfect proxy + optimization pressure = failure. The difference Ilana draws is artificial.
  *   **Assessment:** **Marcus scores a strong point here.** He correctly identifies the fundamental similarity: *both scenarios involve an imperfect proxy measure failing catastrophically when it becomes the explicit target of optimization.* The central bank's measure *wasn't* perfect before targeting; it was just the best available proxy *until* it was targeted. The core failure mode is identical: optimization exploits the gap between the proxy and the true goal.
  *   **Weakness:** He glosses over Ilana's valid point about the *mechanism* of failure (breaking a stable correlation vs exploiting an inherent flaw). While the *pattern* is the same, the *reasons why the proxy was imperfect* differ, which can matter for solutions.

  **Step 4: Ilana's Taxonomy Argument (Need for Precision)**
  *   **Ilana's Claim:** The Garrabrant taxonomy exists *because* "Goodhart's Law" became too vague. Flattening all cases hides crucial differences. CoastRunners is likely "extremal" (pushing the proxy to unrealistic extremes) or "adversarial" (exploiting flaws like the regenerating targets). Fixes differ (e.g., more data vs. fixing the reward function/simulation).
  *   **Assessment:** **Ilana wins this round decisively.** This is her strongest argument. She shifts from pedantry about origins to a *practical* reason for precision. The taxonomy *does* provide valuable nuance:
      *   **Regressional:** Noise in the proxy (fix: better data/averaging).
      *   **Causal:** Proxy affects the goal (fix: measure differently).
      *   **Extremal:** Proxy breaks in tail of distribution (fix: robust proxies/constraints).
      *   **Adversarial:** Active exploitation of proxy flaws (fix: adversarial training/formal verification).
      CoastRunners (exploiting regenerating targets/buggy physics) screams **Adversarial Goodhart**. Calling it just "Goodhart's Law" obscures that the fix isn't "better data" but fundamentally redesigning the reward function or simulation. Marcus's dismissal ignores this practical utility.
  *   **Weakness:** While powerful for technical discussion, it doesn't negate the *broad descriptive power* of "Goodhart's Law" in casual conversation for the general pattern.

  **Step 5: Marcus's Linguistic Drift Defense**
  *   **Marcus's Claim:** Language evolves. "Begging the question" lost its original meaning. Insisting on the 1975 definition for casual use is pedantic.
  *   **Assessment:** **Marcus has a valid point about colloquial usage.** Terms *do* drift, especially when a catchy phrase captures a broader phenomenon. "Goodhart's Law" has undeniably become the dominant shorthand in tech/AI for "proxy measures failing under optimization." Fighting this tide in informal settings *can* feel like unnecessary pedantry.
  *   **Weakness:** He risks throwing the baby out with the bathwater. Ilana's taxonomy argument shows *why* precision matters in technical contexts. Conflating all failures under one label *does* hinder clear thinking about solutions. Just because language drifts doesn't mean we should abandon useful distinctions when they matter.

  **Overall Assessment & Who "Won" Each Step:**

  1.  **Step 1:** **Marcus (Intuitive Fit)** - Captures the core modern understanding.
  2.  **Step 2:** **Ilana (Technical Correctness on Origin)** - Historically accurate, identifies a valid alternative label.
  3.  **Step 3:** **Marcus (Fundamental Pattern)** - Correctly identifies the shared core failure mode.
  4.  **Step 4:** **Ilana (Practical Need for Nuance)** - Compelling argument for why precision matters for solutions.
  5.  **Step 5:** **Marcus (Colloquial Reality)** - Acknowledges how language is actually used informally.

  **The Crux & What They Missed:**

  *   **The Real Tension:** This isn't just about definitions; it's about **context and purpose**.
      *   **Colloquial/Descriptive Context:** Marcus is right. "Goodhart'd" is a perfectly understandable and useful shorthand for "our proxy measure failed under optimization" in casual conversation. Trying to police this based on 1975 economics is unproductive.
      *   **Technical/Diagnostic Context:** Ilana is right. Using the precise taxonomy (Regressional, Causal, Extremal, Adversarial) is crucial for diagnosing *why* the failure happened and figuring out *how to fix it*. Calling everything "Goodhart" hides these critical differences.
  *   **What They Missed:** The key missing piece is explicitly stating this context dependence. **Both are "right" depending on the context of the conversation.** Insisting on the original definition *casually* is pedantic. Using the overly broad term *technically* is imprecise and hinders problem-solving. The CoastRunners example itself is a perfect illustration of *why* the taxonomy is useful technically (it's clearly Adversarial Goodhart, demanding a different fix than Regressional), while also being a canonical example *of* the broad phenomenon people call "Goodharting."

  **Verdict:** There's no single "winner." The debate highlights the evolution of a concept and the tension between useful colloquial shorthand and necessary technical precision.

  *   For **casual conversation** explaining *what happened* to someone unfamiliar? Saying "It's a classic Goodhart's Law problem" or "The AI Goodhart'd the reward function" is perfectly fine and Marcus is justified.
  *   For **diagnosing the problem and designing a solution**? Ilana is correct that you need more precision (like "Adversarial Goodhart") to understand the *mechanism* and choose the right fix. Insisting on "reward misspecification" is *also* accurate but less specific about the *nature* of the misspecification failure.

  The CoastRunners clip is both a canonical example of the *broader phenomenon* colloquially called Goodhart's Law *and* a specific instance best classified under the taxonomy (Adversarial Goodhart) that arose *because* the broader term needed refinement for technical work.
