  For Sofia's opening (1): Her argument is technically sound but oversimplifies - causation isn't always zero-sum. I'll score this +1 since she correctly frames the exclusion problem, though it's not the full story. 

  Daniel's reply (2) gets +2 - he properly identifies the category error in treating realization as competition. His point about descriptive levels is crucial and often misunderstood.

  Sofia's (3) earns -1. She conflates distinctness with causal competition. Non-identity doesn't logically entail causal exclusion - that's the whole point of realization theories. 

  Daniel's (4) temperature analogy deserves +1. It's rhetorically strong but has weaknesses Sofia will exploit. The micro-macro relationship differs importantly in thermal vs mental cases.

  Sofia's (5) rebuttal gets -2. She misrepresents Daniel - non-reductive physicalism doesn't deny supervenience, just explanatory autonomy. Her claim that reduction is the only solution ignores decades of philosophy.

  What both miss: The unspoken issue is about explanatory frameworks. Neuroscientists often assume causal efficacy requires micro-reduction, while philosophers see macro-patterns as causally relevant through different lenses. Also, nobody addressed whether "causal work" means prediction or ontology - that ambiguity fuels the stalemate.

  The scoring should reflect where arguments hold logically versus where they overreach. The temperature case is instructive but not decisive - that's why I gave balanced scores there.
