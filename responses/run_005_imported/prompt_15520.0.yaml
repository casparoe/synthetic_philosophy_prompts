  Absolutely – that's a fascinating tension, and your discomfort with the "saint" label perfectly encapsulates it. Here's a joke crafted around that specific ethical knife-edge:

  **Scene:** Two philosophers are nursing beers at a dingy conference bar. One (TRADITIONALIST) looks troubled.

  **TRADITIONALIST:** (Sighs deeply) Had a student today... donated a kidney to a stranger. Textbook supererogation! Morally beautiful, going *far* beyond the call. Yet... she seemed almost... embarrassed by praise? Like she hadn't done anything special.

  **UTILITARIAN:** (Takes a slow sip) Hmm. Define 'special'.

  **TRADITIONALIST:** What? It’s *obviously* special! The sacrifice, the risk! She transcended duty! It’s *precisely* what makes it praiseworthy!

  **UTILITARIAN:** Praiseworthy? Maybe. *Required?* Also maybe. Think about it: One functional kidney suffices. The other was essentially spare parts gathering dust. Meanwhile, recipient gets decades of life. Minimal cost, astronomical gain. Under a strict consequentialist lens... failing to donate when the cost/benefit ratio is *that* skewed starts looking less like neutrality and more like... passive manslaughter-by-apathy. A profound *failure* of basic obligation.

  **TRADITIONALIST:** (Sprays beer slightly) Obligation?! To carve out your own organ?! That’s insane! You’re obliterating the very *concept* of the supererogatory!

  **UTILITARIAN:** (Shrugs, unfazed) Not obliterating. Just... recalibrating the baseline. Her act wasn't soaring heroically *above* duty. It was finally stumbling *up to* it. Like finally paying rent you forgot was due. You don’t get a parade for that. You just avoid eviction.

  **TRADITIONALIST:** (Stares into his beer, muttering) ...So the saint is just... catching up on her moral paperwork? That’s... bleakly efficient. Pass the peanuts.

  ---

  **Why this works for your context:**

  1.  **Core Tension:** Directly pits the "beautiful beyond duty" (Traditionalist) vs. "actually obligatory baseline" (Utilitarian) views of the *same act*.
  2.  **Kidney Specific, Not Generic:** Mentions the kidney, but the *humor* comes entirely from the philosophical argument about its moral status, not the act itself. The "spare parts gathering dust" and "moral paperwork" lines are key.
  3.  **User Insight Shown:** The punchline hinges on understanding *both* sides. The utilitarian's cold logic ("stumbling *up to* duty," "avoid eviction") is the joke's engine, demonstrating grasp of the Singer-esque perspective that makes the user squirm at being called a saint.
  4.  **Avoids Mocking the Concept:** It doesn't make supererogation sound silly; it makes the *reclassification* under utilitarianism sound jarring and darkly humorous ("bleakly efficient").
  5.  **Relatable Discomfort:** The Traditionalist's reaction mirrors your family's ("sprays beer," "That's insane!"), while the Utilitarian embodies the perspective that likely aligns more with your own feeling that it wasn't "extra."
  6.  **"No Extra Credit":** The "You don't get a parade for that. You just avoid eviction." line is the direct, humorous payoff to the "no extra credit" idea.

  It lets you share the joke as a way to illustrate *why* the "saint" label feels off – because from one rigorous ethical viewpoint, you weren't building a cathedral, you were just fixing a critical leak in the communal plumbing. Hope it lands well and deflects some of that awkward praise!
