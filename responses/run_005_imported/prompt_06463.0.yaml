  Next, emotional infection. K-pop clearly moves millions globally. That's a point in its favor. Tolstoy might acknowledge its ability to connect people across languages, which aligns with his idea of universal art. But he might question if the emotions are deep or morally significant. K-pop often deals with love, heartbreak, empowerment—common themes. Are these "good" feelings? Tolstoy valued feelings promoting human unity and Christian ethics. If a song encourages positive emotions, maybe. But if it's just about consumerism or superficiality, he'd dismiss it.

