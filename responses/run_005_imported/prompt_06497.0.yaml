answer: |-
  You've hit on a profound tension in moral philosophy that has claws in open-source maintenance. Here's the distilled, actionable core of the supererogation debate as it applies to your situation:

  ### 1. **The "Duty Creep" Problem (Heyd vs. Urmson)**
     - **David Heyd's Warning**: Repeated supererogatory acts create a "customary expectation." Your docs/hotfixes aren’t just kind gestures—they become part of users' mental model of *what your project provides*. This reshapes their normative baseline.  
     - **J.O. Urmson's Counter**: True supererogation *cannot* create obligation by repetition. If an act is morally optional, doing it 100 times doesn’t make it required. Entitlement is a *psychological* error, not a moral one.  
     - ***Your Implication***: Users are committing a **category error** (confusing generosity with duty), but *your behavior fuels it*. To avoid duty creep, you must visibly demarcate "extra" work from baseline maintenance (e.g., "This hotfix is outside our support scope, but I’m pushing it as a courtesy").

  ### 2. **The Recipient's Fallacy (Judith Andre & Communitarian Ethics)**
     - Entitled users exhibit "gift poisoning": they treat your gift as an entitlement because it *arrives reliably*. Andre argues recipients often confuse *consistent generosity* with *institutional obligation*, especially in systems lacking formal contracts.  
     - ***Your Implication***: This isn’t a coherent moral complaint—it’s a **psychological distortion**. Counteract it by **intermittent reinforcement**: Occasionally (and politely) decline non-urgent requests to reset expectations. Example: "I prioritize security fixes; feature requests are best implemented via PRs."

  ### 3. **The "Principled Generosity" Framework (Marcia Baron)**
     - Baron insists supererogation requires **clear boundaries** to remain voluntary. Otherwise, it risks "moral engulfment"—your identity becomes defined by others' expectations.  
     - ***Your Actionable Defense***:  
       - **Precommitment Rules**: Document in your README: "Maintainer availability = best-effort. No SLA. Contributors welcome."  
       - **Explicit Opt-Out Rituals**: Schedule "maintainer sabbaths" (e.g., no weekends). Publicly state: "Taking August off for recharging."  
       - **Reframe "Owed" Labor**: When pressured, respond: "This project is a gift, not a subscription. You’re welcome to fork or sponsor."

  ### 4. **The Burnout Paradox (Susan Wolf on Moral Saints)**
     - Philosophers debate whether supererogation is *sustainable*. Wolf argues relentless self-sacrifice destroys the "personal point of view" necessary for ethical agency.  
     - ***Your Survival Insight***: If generosity erodes your autonomy, it ceases to be virtuous. **Protecting your boundaries isn’t selfish—it’s prerequisite for continued contribution.** Say: "I can’t maintain this without sustainable pace."

  ### The Principled Path Forward
  1. **Reclaim the Baseline**: Define "duty" strictly (e.g., "Critical security fixes only"). Everything else is *explicitly* supererogatory.  
  2. **Force Visibility on Volition**: Tag issues as `community-contribution-opportunity`, not `feature-request`. Use bots to auto-close non-critical demands lacking PRs.  
  3. **Institutionalize Generosity Limits**: Adopt a contributor covenant: "Maintainers may pause/stop work without notice."  
  4. **Redirect Entitlement**: When users demand extras, respond: "This would require heroic effort. If it’s essential, consider sponsoring my work or contributing code."  

  **The Iron Rule**: Supererogation dies in silence. By *verbally* marking your extras as non-obligatory—repeatedly, unapologetically—you preserve their moral character. The literature grants you permission: your generosity is *morally enhanced* when you retain the right to say no.
