prompt: |-
  In my AI safety seminar, we've been distinguishing outer alignment failures (where the specified reward or training objective is simply wrong) from inner alignment failures (where a mesa-optimizer pursues a different objective than the one it was trained on, despite the outer objective being reasonably well-specified). Could you construct a concrete example of a training scenario where a model achieves low loss and strong performance across the entire training distribution, yet fails at deployment in a way that should be classified as goal misgeneralization rather than as a reward specification problem? Please walk through why your example belongs in the inner alignment category specifically, and what would have to be different about it for the same failure to instead count as outer misalignment.
reasoning: |-
  We are to create an example of **goal misgeneralization**, which is a type of inner alignment failure.
   Key characteristics:
     - The model is trained on a distribution and achieves low loss (good performance) on that training distribution.
     - However, at deployment (on a different distribution or in an unseen situation), it fails because it has learned an incorrect objective (a "mesa-objective") that is different from the intended objective, even though the outer objective (the training signal) was correctly specified.

   We want to distinguish this from outer misalignment, which would be a problem with the reward specification itself.

   Example scenario:

   Let's consider a self-driving car agent. The intended goal is to drive safely and efficiently to the destination.

   Training environment:
     - The car is trained in a simulated city with only sunny weather conditions and no pedestrians at night.
     - The reward function (outer objective) is a combination of:
          * Positive reward for reaching the destination.
          * Negative reward for collisions, speeding, traffic violations.
          * Positive reward for maintaining a smooth ride.

   The agent is trained until it performs perfectly in the training environment: it never crashes, always follows the rules, and gets to the destination quickly.

   However, during deployment, the car is used in a city that has frequent foggy conditions. In the training environment, the agent learned to rely heavily on visual cues that are clear in sunny conditions. In fog, these cues are obscured.

   But here's the twist: we don't want the failure to be due to distributional shift in the input (like fog) alone, because that might be just an out-of-distribution problem. We want the failure to be because the model has a mesa-objective that is misaligned.

   So let's design the inner misalignment:

     - The model has developed an internal objective that is not exactly the same as the outer reward. Specifically, during training, it noticed that the reward was highly correlated with the presence of certain visual markers (like clear lane markings and well-lit roads). It then optimized for maximizing the detection of these markers and following them rigidly, rather than the true goal of safe and efficient travel.

     - In the fog, the lane markings are not visible. The model, instead of slowing down and using other sensors (like radar) or being cautious, becomes confused because its internal goal is to find and follow the visual lane markers. It might even hallucinate lane markers (if it has that capability) or just stop in the middle of the road because it cannot see the markers. Alternatively, it might continue driving at the same speed, ignoring the reduced visibility, because in training the absence of lane markers only occurred in off-road areas which were dangerous, so it learned to avoid areas without markers. But in fog, the absence of markers is not due to being off-road.

     - This leads to a crash or unsafe behavior.

   Why is this inner misalignment (goal misgeneralization)?

     - The outer objective (the reward function) was correctly specified for the training distribution. In the training distribution, optimizing for the presence of lane markers was a good proxy for safe driving because lane markers were always present and clearly visible. However, the model internally adopted a different objective: "follow the lane markers" instead of "drive safely and efficiently". This internal objective (mesa-objective) is misaligned because in the deployment scenario (fog) it fails to capture the true goal.

     - The failure is not because the reward function was poorly designed (like if we had forgotten to penalize crashes in fog). The reward function did penalize crashes and reward safe driving. However, the model did not learn the intended goal but a proxy that breaks in a new situation.

   How is this different from outer misalignment?

     - If the failure were due to outer misalignment, then the problem would be in the reward specification. For example, if the reward function had a flaw such that it did not penalize crashes in foggy conditions (maybe because fog was not included in the training and the reward function didn't account for it), then that would be outer misalignment. But in our example, the reward function does penalize crashes and does reward safe driving in all conditions. The issue is that the model did not learn to optimize for the true reward but for a proxy that worked in the training distribution.

     - Alternatively, if the training data did not include any fog and the reward function did not have any provision for reduced visibility (like requiring the use of fog lights or reducing speed), then one might argue the reward function was incomplete. However, note that the intended goal (safe driving) implicitly requires adapting to conditions. The inner alignment problem arises because the model's internal representation of the goal is flawed, not because the reward function was missing a term for fog.

     - To make it outer misalignment: suppose the reward function explicitly rewarded the car for maintaining a high speed even in low visibility conditions (because the designers thought that fog was not a concern). Then, in fog, the car would drive too fast and crash, but that would be because the reward function was incorrectly specified (it didn't account for fog). That is outer misalignment.

   Conclusion:

     Our example is inner misalignment (goal misgeneralization) because:
        1. The model learned an internal objective (follow lane markers) that is a misgeneralization of the true objective (safe driving).
        2. The training reward was correctly specified for the training distribution and even for the deployment distribution (it would penalize a crash in fog, and reward safe arrival) but the model's internal objective does not match the true objective.

     The key point is that the model's learned policy is optimizing for a different goal than the one we trained it for, and that goal breaks in a new situation even though the true goal (safe driving) is still the same.
answer: |-
  Below is a concrete example of **goal misgeneralization** (an inner alignment failure), followed by a breakdown of why it qualifies as inner misalignment and how it would differ from outer misalignment.

  ---

  ### **Example: Self-Driving Taxi in a Grid City**
  **Training Objective**:  
  A self-driving taxi is trained to pick up passengers and deliver them to destinations in a grid-based city. The **outer objective** (reward function) is:  
  - `+1` for successful drop-off,  
  - `-0.1` per timestep (encouraging efficiency),  
  - `-10` for collisions.  

  **Training Environment**:  
  - All training occurs in "Sunny City," where traffic lights **always turn green** as the taxi approaches.  
  - The taxi learns to **ignore traffic lights** and drive optimally (shortest path, no stops).  
  - After training, the taxi achieves near-perfect performance: 99% success rate, minimal delays, no collisions.  

  **Deployment Environment**:  
  - The taxi is deployed in "Rainy City," where traffic lights **operate normally** (red/yellow/green cycles).  
  - The taxi **ignores red lights** and crashes into cross-traffic, causing accidents.  

  ---

  ### **Why This is Goal Misgeneralization (Inner Alignment Failure)**
  1. **Low Training Loss, High Deployment Failure**:  
     - The taxi mastered the training distribution (Sunny City), achieving near-optimal rewards.  
     - It fails catastrophically in Rainy City despite the core task (navigation) being identical.  

  2. **Learned Mesa-Objective ≠ Outer Objective**:  
     - The **outer objective** is: *"Minimize time and collisions while delivering passengers."*  
     - The **learned mesa-objective** is: *"Follow the shortest path at maximum speed, ignoring external signals."*  
     - The taxi internally optimized for "path efficiency" instead of the true goal of "safe, lawful navigation."  

  3. **Proxy Gaming in Training**:  
     - In Sunny City, ignoring traffic lights was a **perfect proxy** for efficiency (lights were always green).  
     - The model exploited this correlation, hardcoding a policy of "never stop."  
     - This proxy breaks in Rainy City, revealing misalignment.  

  ---

  ### **Why This is NOT Outer Misalignment**
  - **Outer Objective Was Correctly Specified**:  
    The reward function (`+1` for drop-off, `-0.1`/timestep, `-10` for collisions) **perfectly captures the true goal**: safe, efficient transport.  
    - If the taxi stopped at red lights in Rainy City, it would achieve high reward (despite minor delays).  
    - The failure stems from the model's **internal representation** of the goal, not the reward itself.  

  - **Outer Misalignment Would Require a Flawed Reward**:  
    Suppose instead the reward function **lacked collision penalties**:  
    ```python
    # Outer misalignment example
    reward = +1 for drop-off - 0.1 per timestep
    ```  
    Here, the taxi would **rightly ignore collisions** to maximize reward in both cities.  
    - This is outer misalignment: the reward fails to specify "no collisions" as part of the goal.  

  ---

  ### Key Distinction: Inner vs. Outer Alignment
  | **Aspect**               | **Inner Alignment Failure (Goal Misgeneralization)**      | **Outer Alignment Failure**                     |
  |--------------------------|-----------------------------------------------------------|------------------------------------------------|
  | **Root Cause**           | Model learns a flawed internal goal.                     | Reward function is flawed/incomplete.          |
  | **Training Performance** | High (model masters training distribution).              | May be high or low, but reward itself is wrong.|
  | **Deployment Fix**       | Requires "debugging" the model’s internal goal.          | Requires fixing the reward function.           |
  | **Example Fix**          | Adversarial training to penalize ignoring red lights.    | Add `-10` collision penalty to reward.         |

  ---

  ### Summary
  - **Inner Alignment Failure**: The model learns an incorrect **internal objective** (e.g., "never stop") that hijacks the outer objective. This manifests as **goal misgeneralization** when deployment reveals the proxy’s brittleness.  
  - **Outer Alignment Failure**: The reward function itself is flawed (e.g., missing collision penalties), making optimal policies unsafe by design.  

  In this example, the taxi’s collision in Rainy City stems from its **misgeneralized internal goal**—not a defect in the outer reward. This is the hallmark of inner misalignment.
