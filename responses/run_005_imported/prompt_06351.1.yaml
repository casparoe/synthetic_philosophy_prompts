answer: |-
  ## Dialogue: The Mutant Rabbit's Coat Function

  **Biologist:** We found a wild rabbit born with a novel mutation thickening its fur. This winter was freakishly harsh, killing most of the population. *This* rabbit survived solely because of the thicker coat, reproduced once, and then... we don't know. The trait might spread, it might be selected against later, or it might just vanish by chance. Right now, *before* we know its evolutionary fate, does this specific rabbit's thicker coat *have the function* of insulation?

  **Etiological Theorist (ET):** Absolutely not. Function requires a history of selection *for* that effect. This mutation is brand new. It hasn't been *selected* yet; it's just a fortuitous accident in this one individual. Its survival is a *consequence*, not the result of fulfilling a selected function. Function isn't about what *did* happen once; it's about why the trait *exists* in the population. Right now, it exists purely by mutation, not because of past selection. Insulation is an *effect*, not its *function*.

  **Causal-Role Theorist (CRT):** That seems arbitrary. *Right now*, in *this* rabbit, the thicker coat is demonstrably performing a crucial causal role: it's contributing directly to the rabbit's capacity to thermoregulate in a cold environment, which is essential for survival. It's causally responsible for maintaining homeostasis where the normal coat failed. Why deny it a function simply because we haven't observed multiple generations? Our explanatory target is the rabbit's *current* survival capacity – and the coat plays a key role in that capacity *at this moment*.

  **ET:** Because calling it a "function" now smuggles in teleology without justification. If we say it *has the function* of insulation *now*, we imply that’s *why* it’s there, which isn't true. It’s there by random mutation. Your view makes function ephemeral. Suppose this rabbit's offspring all get eaten by hawks next summer *because* the thick coat makes them slower. By your view, the coat had the function of insulation *yesterday* but might have the function of attracting hawks *tomorrow*? That’s absurd. Function must be stable, grounded in why the trait type persists.

  **CRT:** Stability isn't the only value; explanatory relevance is key. *For explaining this rabbit's survival through that specific winter*, the causal contribution of insulation is paramount. The hawk scenario changes the *system* we're analyzing (summer survival vs. winter survival). In the *winter survival system*, insulation *was* its functional role. If hawks become the dominant selective pressure later, the *causal role* the thick coat plays in the *summer survival system* might be detrimental. Its function depends on the *explanatory context*. Why privilege history over current causal efficacy for explaining present capacities?

  **ET:** Because privileging history avoids the very absurdity I mentioned! If we define function solely by current effect, then *any* effect a trait has *right now* is potentially its function, depending on what capacity we arbitrarily choose to analyze. A rabbit's foot might *cause* it to trip today – is tripping its function? No. Its function is locomotion, *because* that’s what it was selected for. History anchors function to the trait's raison d'être, not fleeting circumstances. This mutation lacks that history.

  **Biologist:** Interesting. Let's consider futures. Suppose the trait *does* spread through the population over generations because of its insulative advantage. What do you each say *then* about the function of the thicker coat *in descendants*?

  **ET:** *Then* it clearly has the function of insulation. Its persistence in the population is *due to* past selection *for* its insulating effect. That establishes its etiological function. The initial mutation was the raw material, but selection forged the function.

  **CRT:** I agree it *then* has the function of insulation. But crucially, my analysis *also* assigned it that function *in the original rabbit during the harsh winter*. The causal role it played *was* insulation, contributing to survival. The later spread confirms that this causal role had significant fitness consequences, but it doesn't retroactively *create* the function in the ancestor; it just shows the causal role had long-term selective *value*. The function was present in the causal contribution at the time.

  **Biologist:** Now, suppose instead the trait *vanishes*. Maybe the next winter is mild, and the thick coat causes fatal overheating, wiping out the lineage. Or maybe the offspring just don't inherit it. What then?

  **ET:** It confirms my initial point! The trait *never* had a biological function. It was a transient effect of a mutation, not a trait maintained by selection for a purpose. Its brief effect was just happenstance, not function. Function requires successful lineage-level selection.

  **CRT:** The trait's *disappearance* doesn't erase the causal role it played *in the original rabbit during that specific harsh winter*. For *that* rabbit, *in that context*, the thicker coat *functioned* as insulation, contributing causally to its survival and reproduction capacity at that moment. Its later disappearance means that causal role wasn't *selected for* over generations, but it doesn't negate the functional contribution it made *when and where it occurred*. The function existed relative to a specific system (the rabbit's winter physiology) at a specific time.

  **ET:** But that reduces "function" to mere "causal effect within an arbitrarily chosen timeframe." You've severed it entirely from the core biological concept of adaptation shaped by natural selection. A trait that disappears immediately cannot be said to have been *for* anything. Its effect was causally efficacious, yes, but not functional in the biological sense.

  **CRT:** And you've made function hostage to the future, rendering it unknowable in the present for novel traits – precisely when biologists might most need the concept to explain *current* survival! My view provides a framework for analyzing adaptations *as they happen*, based on observable causal contributions within living systems. Yours can only label them in hindsight. Both perspectives have explanatory power, but mine doesn't require waiting for history's verdict to understand how a trait *works* in an organism *now*.

  **ET:** But understanding *how* it works isn't the same as understanding its *function*. You conflate mechanism with purpose. Biology needs both, but function, as *telos*, requires history. This rabbit's coat *mechanism* provides insulation; its *function* remains undefined until selection acts.

  **CRT:** Then for novel mutations, biology is functionally mute until generations pass. That seems a high price to pay to preserve your definition of teleology. I contend the *purpose* of the trait *in the current system* is revealed by its indispensable causal role in maintaining critical capacities. That *is* its biological function *at that time*.

  **(The debate continues...)**
