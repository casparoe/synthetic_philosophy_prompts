  - **Double luck:** Alex is lucky Carton A is empty (justified belief) *and* lucky Carton B is empty (makes belief true). The second luck isolates truth from justification.
  - **Justification side-note:** Priya's point about justification being "flimsy" is situation-dependent. If Alex reasonably assumed no backup milk, his justification *is* adequate, making this pure Gettier. If backup milk is predictable, justification is indeed flawed—but the Carton B coincidence *still* adds Gettier luck on top.

