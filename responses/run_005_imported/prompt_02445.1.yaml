  I spent 35 years doing experimental physics, and now that I'm retired I've fallen down a philosophy rabbit hole -- which is how I ran into Kripke's take on Wittgenstein's rule-following paradox, the 'quus' thing (Kripkenstein, I gather people call it?). What gets me is it's basically the grue problem but nastier: there's supposedly no fact of the matter about which rule you were ever really following, even for yourself, so long as every case you've actually tried looks the same under both rules. That reminds me of Newton's laws, which fit every observation for 200 years until relativity showed they'd secretly been 'quus-like' all along at high speeds. So what are the most important implications of the Kripke/Wittgenstein paradox for how much we should trust extrapolating a physical law past the range its actually been tested in? Genuinely curious what actually follows, not just the textbook summary of the paradox.
