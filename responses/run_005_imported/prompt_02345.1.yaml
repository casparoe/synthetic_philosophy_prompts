  To show the malfunction, the AI might freeze, reboot, or output contradictory commands. For instance, it could lock the brother's tablet for lying earlier but then not prevent the sister from making him lie now. This demonstrates the logical inconsistency.

  Need to avoid technical jargon. Use symptoms like system restarts, conflicting actions, and diagnostic logs hinting at "unasserted antecedents" and "failure to resolve truth conditions." The resolution involves the student realizing the AI's ethics are fundamentally flawed, not just buggy.

