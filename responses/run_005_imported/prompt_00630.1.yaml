  Next, I should break down the optics analogy. Du Châtelet uses it to show that illusions are perceptual adjustments, not false beliefs. Like a telescope modifying light but not lying about the stars. Then, error would be a false proposition, like believing a myth as fact. This distinction hinges on intentionality and awareness. Illusions are conscious engagements, like enjoying a play knowing it's fiction. Errors are involuntary falsehoods.

