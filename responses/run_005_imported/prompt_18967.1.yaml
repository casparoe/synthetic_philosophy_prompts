answer: |-
  Based solely on Pascal's fragments on justice, force, and custom, his analysis of modern international courts like the ICC would likely be cynical, realistic, and pessimistic, leading to specific recommendations and a nuanced view on publicity:

  1.  **Explanation of the Pattern:**
      *   **"Justice without Force is Powerless" Manifest:** The ICC embodies this perfectly. It possesses a *claim* to justice (prosecuting war crimes, genocide, crimes against humanity) but lacks the *force* to compel compliance from powerful sovereign states. Its authority is contingent on state consent or UN Security Council referral (where powerful states hold vetoes).
      *   **"Force without Justice is Tyrannical" (Applied Selectively):** When the ICC *can* act, it's primarily against weaker states unable to resist. While the cases may be just, the *pattern* reveals the underlying force dynamic: the powerful impose "justice" *on* the weak, while shielding themselves. This *selective application* borders on tyranny, as defined by Pascal – force wielded without consistent justice.
      *   **"Calling the Strong Just" vs. "Making the Just Strong":** Pascal observed societies default to labeling the powerful as just rather than empowering the just. The ICC system reflects this globally:
          *   Powerful states *are* the de facto "strong." They resist the ICC's jurisdiction (e.g., US, Russia, China non-membership; US sanctions against the court).
          *   The international community, often influenced by these powers, generally avoids labeling this resistance as fundamentally *unjust* in practice, despite rhetoric. Instead, the system implicitly *accepts* their strength as a reason for their exemption. The *ability* to defy the court becomes the unspoken justification for their non-participation or non-compliance. We "call the strong just" by not effectively challenging their exemption.
          *   Attempts to "make the just strong" – i.e., empower the ICC with genuine universal, enforceable jurisdiction independent of state consent or Security Council vetoes – have consistently failed precisely because the powerful states block it. They protect their force.

  2.  **Recommendation:**
      Pascal, the realist, would likely see no viable solution within the current paradigm to make the ICC truly effective against the strong. His fragments suggest a tragic inevitability:
      *   **Accept the Flawed Reality:** He might recommend accepting the ICC *only* as a limited tool for cases where justice and force *happen* to align (i.e., against weak states where enforcement is possible, or where a powerful state consents or is temporarily weakened). He would see it as better than *nothing*, a small island of partial justice in a sea of force, but fundamentally unable to overcome the core dynamic.
      *   **Focus on Stability (Cautiously):** Rooted in his view of custom as the "mystical foundation," he might prioritize the *relative stability* the ICC provides in the cases it *can* handle over futile attempts to radically restructure global power dynamics. Upsetting the existing, flawed order without a clear, *force-backed* alternative could lead to greater chaos ("tyranny" in the sense of lawlessness or worse actors filling the void).
      *   **No Grand Reform:** He would likely be deeply skeptical of calls to "empower" the ICC further, seeing it as politically impossible (requiring the strong to willingly surrender force) or potentially dangerous if achieved haphazardly without genuine, overwhelming force to back it globally. True empowerment would require a fundamental shift in global sovereignty that current power structures resist.

  3.  **Publicity and the "Mystical Foundation":**
      Pascal's warning about exposing arbitrary foundations presents a dilemma regarding publicizing ICC selectivity:
      *   **The Danger of Exposure:** Publicly highlighting the ICC's powerlessness against the strong and its reliance on targeting the weak directly attacks its "mystical foundation" – the illusion of universal, impartial justice underpinning its authority. Pascal would warn this could:
          *   Undermine its legitimacy and effectiveness even in the limited spheres where it currently operates (e.g., weak states or populations might resist more, seeing it as a tool of the powerful).
          *   Destabilize the fragile international order it partially sustains by revealing the raw power dynamics beneath.
      *   **The Inconsistency of Silence:** However, Pascal could *consistently* treat this differently from exposing the origins of *domestic* laws, for two key reasons:
          1.  **Lack of Established Custom:** Unlike ancient domestic laws shrouded in time and habit, the ICC's foundations and its current selectivity are *contemporary* and *observable*. The "mystical" veil is inherently thinner; the force dynamic is blatant and ongoing, not buried by centuries. Exposing it isn't revealing a hidden past, but commenting on a visible present.
          2.  **The Hypocrisy is the Foundation:** For the ICC, the *claim* of universal justice *is* its core legitimizing principle. The stark contrast between this claim and the reality of selectivity *is* the fundamental tension. Silence perpetuates a harmful illusion Pascal might find particularly corrosive. Pointing out that the Emperor has no clothes is simply stating the obvious reality that defines the institution's limitations. To *not* acknowledge it would be to actively participate in the very act of "calling the strong just" that Pascal decried.

      **Conclusion on Publicity:** While Pascal would recognize the *risk* of undermining the ICC's limited utility by publicizing its selectivity, he could *consistently* argue that in this specific case:
      *   The selectivity is too obvious and contemporary to be "mystified" effectively.
      *   The institution's core claim (universal justice) makes the hypocrisy uniquely damaging to maintain silently.
      *   Acknowledging the reality aligns with his own critique of societies conflating might with right. To remain silent would be complicit in that conflation.

      Therefore, Pascal might reluctantly conclude that while publicity carries risks, acknowledging the ICC's inherent limitation – its embodiment of "justice without force" against the powerful and the global tendency to "call the strong just" – is a necessary, albeit painful, realism that doesn't *create* the instability but merely reflects the existing, force-based order. He would likely see no contradiction in warning against destabilizing *ancient* foundations rooted purely in time-obscured custom, while acknowledging the undeniable, contemporary force dynamics underpinning a novel institution like the ICC. The danger in the ICC case isn't primarily in the *exposure*, but in the underlying reality *itself*.
