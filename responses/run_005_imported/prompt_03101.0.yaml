prompt: |-
  Hey, I'm reporting a piece on procrastination and present bias (hyperbolic discounting, the whole "we know better but do it anyway" thing) and my editor wants some historical depth, so I went back to where "akrasia" actually comes from — Aristotle's Nicomachean Ethics, Book VII, where he tries to solve the puzzle of how someone can act against their own knowledge. (Side note: he calls it "incontinence" throughout, which apparently just meant lack of self-restraint back then and not, uh, the modern meaning — threw me for a second.) Anyway the actual passage is kind of a mess to parse. Here's the bit, Ross translation:

  "...the possession of knowledge in another sense than those just named is something that happens to men; for within the case of having knowledge but not using it we see a difference of state, admitting of the possibility of having knowledge in a sense and yet not having it, as in the instance of a man asleep, mad, or drunk... It is plain, then, that incontinent people must be said to be in a similar condition to men asleep, mad, or drunk. The fact that men use the language that flows from knowledge proves nothing; for even men under the influence of these passions utter scientific proofs and verses of Empedocles, and those who have just begun to learn a science can string together its phrases, but do not yet know it... so that we must suppose that the use of language by men in an incontinent state means no more than its utterance by actors on the stage."

  A bit later he adds: "When, then, the universal opinion is present in us forbidding us to taste, and there is also the opinion that 'everything sweet is pleasant', and that 'this is sweet'... the one opinion bids us avoid the object, but appetite leads us towards it... so that it turns out that a man behaves incontinently under the influence (in a sense) of a rule and an opinion, and of one not contrary in itself, but only incidentally — for the appetite is contrary, not the opinion — to the right rule."

  Can you help me actually untangle whats going on here? Is the sleepwalker/actor-reciting-lines bit and the sweet-things syllogism bit meant to be the same explanation, or two seperate solutions he's kind of mashing together? And more for the piece — does any of this actually map onto what hyperbolic discounting says is happening (present rewards just get overweighted), or is Aristotle diagnosing something else entirely, like a glitch in how knowledge is "held" rather than in how it's weighed against pleasure? Trying to work out if that's a fair through-line or if I'd just be forcing a connection that isn't really there.
