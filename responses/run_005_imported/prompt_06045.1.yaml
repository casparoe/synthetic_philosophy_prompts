  They mention the "Two Generals Problem" from distributed computing. That's similar but distinct. Both deal with communication uncertainty preventing coordination, but Rubinstein focuses on game-theoretic equilibrium with rational players, while the Two Generals is about deterministic protocols in distributed systems. Pointing out this connection could enrich the handout.

  Regarding Aumann's theorem, the contrast makes sense. Aumann assumes common knowledge of posteriors leading to agreement, while Rubinstein shows that without full common knowledge, coordination fails even with near-common knowledge. The tension highlights how crucial common knowledge is in both agreement and coordination, but in different contexts—posterior beliefs vs. actions. Emphasizing this difference would strengthen the framing.

