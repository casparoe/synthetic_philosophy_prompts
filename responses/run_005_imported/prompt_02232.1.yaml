prompt: |-
  I've been down a rabbit hole reading formal social choice stuff for a decision theory reading group I'm in, and a couple people keep bringing up Harsanyi's aggregation theorem as basically a knock-down proof that once you respect everybody's individual preferences (the Pareto condition), the only coherent social welfare function that falls out is straightforward utilitarianism where everyone's utility counts equally. The way it was explained to me: individuals are expected utility maximizers, we want society to also behave like an expected utility maximizer over the same set of lotteries, Pareto forces the social utility function to be a simple sum of the individual ones, and so equal-weight utilitarianism basically just drops out of the axioms, no extra ethical assumptions needed. One guy even said this means the whole debate between utilitarians and prioritarians (people who think we should give extra weight to worse-off individuals) is kind of moot, since prioritarians are just being formally inconsistent whether they realize it or not.

  That conclusion feels way too strong to me but i couldn't really push back on it in the moment. Does Harsanyi's theorem actually force equal weights on everyone the way he was describing, and does it really make prioritarianism some kind of mathematical error rather than a legitimate ethical position? Just trying to figure out if my reading group is overselling what the theorem proves, or if I'm the one missing something here.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're in a decision theory reading group where Harsanyi's aggregation theorem is being presented as a definitive argument for equal-weight utilitarianism. The user feels uneasy about this, especially since some members claim that prioritarianism is mathematically inconsistent. I need to figure out where the confusion lies.

  First, I recall Harsanyi's theorem. It's based on individuals as expected utility maximizers, and society should be too. The Pareto condition requires that if everyone prefers lottery A over B, society should too. The theorem concludes that the social welfare function must be a weighted sum of individual utilities. But the user's group is interpreting the weights as necessarily equal. Is that accurate?

  Wait, Harsanyi's original theorem doesn't actually enforce equal weights. The weights can be different, but the linear aggregation is key. The equal weights come from an additional assumption, like anonymity or impartiality. Without that, the weights could reflect different valuations of individuals. So the group might be conflating the aggregation form with weight equality.

  The user mentions prioritarians wanting to give more weight to the worse-off. Harsanyi's setup doesn't inherently prevent that. Prioritarians could argue that the weights should be higher for those with lower utility. That's an ethical choice, not a mathematical inconsistency. So the group's claim that prioritarianism is inconsistent seems wrong. 

  I should check the axioms. The Pareto condition and linear aggregation are there, but where does equality come in? Ah, yes. If you add anonymity—that individuals are interchangeable—then weights must be equal. But without that ethical premise, unequal weights are possible. The theorem itself is neutral on weights. 

  The user's confusion might stem from the group oversimplifying. They're presenting the theorem as forcing equal weights without mentioning the need for additional assumptions. The user's instinct that prioritarianism isn't mathematically invalid is correct. Prioritarians can accept linear aggregation but assign weights based on utility levels, which Harsanyi doesn't forbid.

  Also, the theorem assumes utilities are on a common scale. But in reality, comparing utilities across people is tricky. If prioritarians question interpersonal comparability, that's another angle. But even within comparable utilities, weights are a separate ethical choice.

  The group's argument that prioritarianism is inconsistent probably comes from misunderstanding the theorem. Prioritarians might reject the linear form entirely, advocating for a concave transformation. That would violate Harsanyi's axioms, but it's a normative choice, not a logical error. The theorem assumes certain premises; rejecting those isn't inconsistent if you don't accept all axioms.

  So the user is right to question. The theorem doesn't settle the utilitarian vs. prioritarian debate; it frames it. The reading group is overreaching by saying Harsanyi proves equal weights without extra assumptions. The user needs to point out the necessity of anonymity for equal weights and that ethical weighting is still possible within the linear model or by rejecting linearity.
answer: |-
  You're absolutely right to be skeptical—your reading group is significantly overselling Harsanyi's theorem and misrepresenting its implications for prioritarianism. Let's break down what the theorem *actually* establishes and where the confusion arises:

  ### 1. **What Harsanyi's Aggregation Theorem Actually Says**
     - **Premises**:
       - **Individual Rationality**: Each person has vNM-rational preferences (satisfy the von Neumann-Morgenstern axioms), represented by a utility function unique up to affine transformations.
       - **Social Rationality**: Society as a whole must also have vNM-rational preferences over the same set of lotteries.
       - **Pareto Efficiency**: If every individual weakly prefers lottery A to B, society weakly prefers A to B. If at least one individual strictly prefers A, society strictly prefers A.
     - **Conclusion**: The social welfare function **must be a *linear* aggregation** of individual utilities:  
       \[ W = \sum_{i=1}^N a_i U_i \]  
       where \(a_i > 0\) are positive weights.

  ### 2. **Where Your Reading Group Goes Wrong: Equal Weights?**
     - **Harsanyi does *not* require equal weights (\(a_i = a_j\))**. The weights \(a_i\) can be *unequal* and still satisfy the theorem.  
     - **Equal weights only follow if you impose an *additional* ethical axiom**:  
       - **Anonymity/Impartiality**: All individuals are treated symmetrically. If you permute individuals' utility functions, social preferences don't change.  
       - Without this extra axiom, **Harsanyi is compatible with elitism, prioritarianism, or any system where weights are unequal** (as long as weights are positive).

  ### 3. **Prioritarianism Isn't Mathematically Incoherent**
     - **Prioritarianism** (giving priority to the worse-off) typically uses a *non-linear* social welfare function:  
       \[ W = \sum_{i=1}^N f(U_i) \]  
       where \(f\) is a strictly concave function (e.g., root or log transform).  
     - **This violates Harsanyi's linearity requirement**, but **not because it's "inconsistent"**—it rejects one of Harsanyi's *assumptions* (that social preferences must be vNM-rational over lotteries).  
     - Prioritarians argue:  
       - vNM rationality is reasonable for *individuals* facing risk, but not for *society* making ethical tradeoffs.  
       - Sacrificing linearity allows sensitivity to utility *levels* (e.g., diminishing marginal moral weight).  
     - **This is a normative disagreement—not a mathematical error**.

  ### 4. **Key Misconceptions in Your Group's Argument**
     - **"Pareto forces equal-weight utilitarianism"**:  
       Pareto + vNM rationality forces *linearity*, not equality. Weights are ethical choices.  
     - **"Prioritarians are inconsistent"**:  
       Prioritarians reject vNM rationality for social preferences. They aren't violating logic—they're rejecting an axiom.  
     - **"No extra ethical assumptions needed"**:  
       Harsanyi hides ethics in the premises:  
       - Requiring social vNM rationality assumes society should mimic individual risk preferences.  
       - Accepting interpersonal utility comparisons (cardinal, comparable utilities) is a major ethical commitment.

  ### 5. **Where Harsanyi *Is* Powerful (and Where It Isn't)**
     - **Strength**: If you accept all premises (including social vNM rationality), **linearity is inescapable**. Non-linear aggregation (e.g., Rawlsian maximin) violates Pareto or vNM rationality.  
     - **Weaknesses**:  
       - **Linearity ≠ utilitarianism**: Weights can be unequal.  
       - **vNM rationality for society is contestable**: Should social choices be risk-neutral? Prioritarians say no.  
       - **Utility comparability**: The theorem assumes utilities are cardinally measurable and comparable across people—a huge ethical leap.  
       - **Ignores fairness**: A lottery giving 99% chance of misery to one person and 1% chance of bliss to another satisfies Harsanyi if weights are equal—but many would call this unfair.

  ### Why Your Skepticism Is Justified
  Your group is conflating **mathematical aggregation** with **ethical impartiality**. Harsanyi shows that *if* society satisfies vNM rationality and Pareto, aggregation *must* be linear. But:  
  - **Unequal weights** are compatible with this (e.g., weighting children more than adults).  
  - **Prioritarianism** rejects vNM rationality for society, so it's outside Harsanyi's framework—not "inconsistent" within it.  

  Harsanyi's theorem is a profound result, but it **doesn't annihilate prioritarianism** or **mandate equal weights**. It clarifies the price of accepting its axioms: if you want Pareto and social vNM rationality, you get linearity. Prioritarians willingly pay the price of dropping vNM social rationality to gain sensitivity to distribution. That's a philosophical choice—not a mathematical blunder.

  ### Practical Response for Your Group
  Next time, ask:  
  1. *"Where in Harsanyi's premises does it say weights must be equal?"* (They won't find it—it's not there.)  
  2. *"If we weight utilities unequally, which axiom is violated?"* (None—Pareto and vNM still hold.)  
  3. *"Why should society be vNM-rational over lotteries if we care about fairness?"*  

  This shifts the debate to the *normative plausibility of the axioms*—which is where it belongs. Harsanyi doesn't resolve ethics; it reveals the tradeoffs.
