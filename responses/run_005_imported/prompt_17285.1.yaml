  ...Wait, is there a risk of misrepresenting Taurek? His original paper insists we shouldn't "do mathematics" with lives. The strongest reply might circle back to that: any probability weighting is still math, still compares incomparable losses. Maybe the real divide is whether morality permits probabilistic representations of value at all. 

