  Hmm, the core tension here lies in whether Taurek's radical individualism—his view that "separateness of persons" blocks aggregation—can consistently accommodate numerical weighting. I recall that proponents like F.M. Kamm and David Wasserman have pressed this point: if equal concern requires giving each person equal moral weight, wouldn't ignoring group size in a lottery violate that principle when more individuals stand to benefit? 

