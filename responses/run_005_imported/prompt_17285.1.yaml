  But I need to anticipate the Taurekian counter. They might argue that probability isn't the right currency for equal concern—what matters is that each group gets an equal chance at being saved as a whole, since the alternative (saving one group) involves a binary choice between intact collectives. The coin flip respects each group's "integrity" rather than dissolving them into atomized individuals. There's also Taurek's deeper worry: weighting probabilities smuggles aggregation in through the back door by making numbers morally decisive.

