answer: |-
  You've pinpointed the core tension: **Dutch Book Arguments (DBAs) demonstrate pragmatic vulnerability, while Joyce's Accuracy-Dominance Argument (ADA) aims for epistemic irrationality.** Both argue for probabilism (credences must obey probability axioms), but they rest on fundamentally different foundations and succeed in showing different things. Here's a careful comparison, defending the claim that **Joyce's ADA delivers a genuine epistemic vindication, but its success hinges on defensible (and non-pragmatic) assumptions about the nature of epistemic value.**

  ### 1. **Dutch Book Arguments (DBAs): Pragmatic Vulnerability**
      *   **Core Claim:** If your credences violate probability axioms, a Dutch bookie can construct a set of bets, each individually acceptable to you (i.e., priced at your credences), that guarantees you lose money *no matter which state of the world obtains*.
      *   **Key Assumptions:**
          *   **Betting Dispositions:** Your credence `C(A) = p` entails you are willing to buy a bet paying $1 if `A` is true for any price `$x < p`, and willing to sell it for any price `$x > p`. (This links credence directly to fair betting odds).
          *   **Value is Linear in Money:** The utility of money is linear (or at least, the bets offered are small enough that non-linearities don't bite). Loss of money is the relevant disutility.
          *   **Rationality as Avoidance of Guaranteed Loss:** Rational agents should avoid situations where they are *guaranteed* to suffer a loss (of value, here money), regardless of how the world turns out.
      *   **What it Shows:**
          *   **Pragmatic Failure:** An agent with incoherent credences is *pragmatically irrational* in a specific decision context (betting). Their willingness to accept bets based on their own stated credences leads them into a *dominated* position: they end up with less money in *every possible world* than if they had simply refused the entire package of bets. Coherent credences avoid this vulnerability.
          *   **Limitation:** It shows incoherence is *exploitable*, not *epistemically mistaken*. An agent could refuse all bets, maintain incoherent credences, and potentially have beliefs that "work for them" in non-betting contexts. The irrationality demonstrated is contingent on the agent's willingness to bet according to their credences.

  ### 2. **Joyce's Accuracy-Dominance Argument (ADA): Epistemic Inaccuracy**
      *   **Core Claim:** If your credence function `b` violates probability axioms, there exists an alternative coherent credence function `c` such that `c` is strictly more *accurate* than `b` in *every possible world*. `b` is *accuracy-dominated*.
      *   **Key Assumptions:**
          *   **Accuracy as Epistemic Goal:** The primary epistemic goal of a credence function is to represent the world *accurately* – to have high credence in truths and low credence in falsehoods. Accuracy is the relevant epistemic utility/disutility.
          *   **Legitimate Accuracy Measure (Scoring Rule):** Accuracy must be measured by a *strictly proper scoring rule* (e.g., Brier score, logarithmic score). A scoring rule `S(b, ω)` measures the inaccuracy of credence function `b` in world `ω`. "Strictly proper" means: *For any coherent credence function `c`, the expected inaccuracy of `c` according to `c` itself is minimized precisely by `c`.* This incentivizes "truth-telling" if you aim to minimize *expected* inaccuracy.
          *   **Rationality as Avoidance of Dominance:** Rational agents should avoid credence functions that are *accuracy-dominated*. If `c` is more accurate than `b` in *every* possible world, `b` is epistemically defective regardless of the agent's practical goals or which world is actual.
      *   **What it Shows:**
          *   **Epistemic Failure:** An agent with incoherent credences is *epistemically irrational* in a fundamental sense. Their credence function is *objectively less accurate* than some coherent alternative, *no matter what the truth turns out to be*. Coherence is a necessary condition for avoiding this kind of global epistemic suboptimality.
          *   **Strength:** The irrationality is demonstrated *independently of any betting scenario or practical interests*. It applies even to an agent who never engages in any wagers. The flaw is inherent to the relationship between the credences and the truth they purport to represent.

  ### 3. **Comparison: Assumptions, Achievements, and the "Epistemic" Question**
      *   **Nature of Assumptions:**
          *   **DBAs** rely on **pragmatic decision-theoretic assumptions**: the link between credences and betting dispositions, the linear value of money, and the irrationality of guaranteed monetary loss. These are fundamentally about *action* and *value*.
          *   **ADAs** rely on **epistemic value assumptions**: the primacy of accuracy as the epistemic goal, the legitimacy of strictly proper scoring rules as measures of accuracy, and the irrationality of accuracy-dominance. These are about *representation* and *truth*.
      *   **What Each Proves About Incoherent Credences:**
          *   **DBAs:** Prove incoherent credences lead to **pragmatic self-sabotage** *if* you act on them in specific (betting) ways. The defect is revealed through potential *interaction*.
          *   **ADAs:** Prove incoherent credences are **inherently epistemically defective**. They are *guaranteed* to be less accurate than some coherent alternative *from the perspective of any possible world*. The defect is intrinsic to the *representation* itself.
      *   **Does ADA Deliver a Purely Epistemic Vindication?** **Yes, fundamentally.**
          *   **The Core Epistemic Advance:** ADA shifts the focus entirely from *practical consequences* (losing money) to *representational fidelity* (distance from truth). The "guaranteed loss" is a loss of *accuracy*, not money. Accuracy-dominance is a *logical* or *alethic* flaw: an incoherent credence function *cannot* be the best possible representation of the truth across possibilities. This flaw exists independently of whether anyone exploits it or whether the agent cares about bets.
          *   **Addressing the "Relocation" Challenge:** The objection that pragmatic assumptions are "relocated" into the scoring rule choice is misplaced.
              *   **Truth-Directedness:** All legitimate scoring rules require being *truth-directed*: lower inaccuracy when a true proposition is believed more strongly or a false one less strongly. This is a core *epistemic* constraint, not a pragmatic one.
              *   **Propriety & Coherence Justification:** Strict propriety isn't an arbitrary "pragmatic" add-on smuggled in. Joyce argues it flows from core epistemic virtues:
                  *   *Coherent Admissibility:* Only coherent credences are admissible (non-dominated) *if* the scoring rule is strictly proper. Propriety ensures coherence is necessary for avoiding dominance.
                  *   *Truth-Directed Calibration Incentive:* Propriety ensures that a coherent agent *expects* their own credences to be most accurate. It aligns epistemic rationality with aiming for truth.
                  *   *Avoiding Epistemic Dilemmas:* Without propriety, an agent might be *required* by dominance arguments to adopt credences they *know* are inaccurate (e.g., if a linear score forced them to adopt 0 or 1 for all propositions). Propriety prevents this pathological scenario. Joyce defends propriety based on what a *sensible measure of accuracy* should do to promote truthful reporting and avoid epistemic incoherence, not based on betting incentives.
          *   **Epistemic Value, Not Decision Value:** The choice of scoring rule encodes a view about *epistemic disutility* – how bad it is to be wrong by varying degrees. While different strictly proper rules (Brier vs. Logarithmic) represent different *weightings* of epistemic disutility (e.g., how harshly to penalize extreme confidence that's wrong), these are still fundamentally *epistemic* value judgments about the nature of accuracy and the cost of error, distinct from *pragmatic* value judgments about money or consequences. Arguing about which strictly proper rule is "best" is a debate *within* epistemology about the nature of epistemic value, not an intrusion of pragmatics.
          *   **The Guarantee is Epistemic:** The key guarantee – "less accurate in every possible world" – is a statement about the *relationship between belief content and truth content* across logical space. This is an epistemic comparison, not a pragmatic prediction of loss.

  ### 4. **Definite Answer: Joyce Succeeds (With Caveats)**
  Joyce's Accuracy-Dominance Argument **does deliver a purely epistemic vindication of probabilism** that Dutch Book Arguments lack. It demonstrates that violating probability axioms isn't merely pragmatically risky; it constitutes an inherent *epistemic failing*. An incoherent credence function is *objectively deficient* in its core epistemic purpose of accurately representing the world, as measured by any sensible standard of accuracy (a strictly proper scoring rule). It is globally dominated by some coherent alternative, guaranteeing worse accuracy no matter what is true.

  **Crucial Caveats & Defense:**
  1.  **Epistemic Values are Assumed:** ADA assumes accuracy is the primary epistemic goal and that strictly proper scoring rules capture "sensible" ways to measure it. This *is* a substantive philosophical commitment. However, these are *epistemic* commitments about the nature of rational belief and its connection to truth, fundamentally distinct from the *pragmatic* commitments (betting, money, action) required by DBAs. Rejecting accuracy as an epistemic goal renders *both* arguments moot, but that's a rejection of epistemology itself.
  2.  **Propriety is Defended Epistemically:** The requirement for a *strictly proper* scoring rule is justified internally to the epistemic project: it ensures coherence is necessary for non-dominance, aligns epistemic rationality with truth-aiming, and avoids epistemic dilemmas. It’s not merely a covert way to enforce betting coherence.
  3.  **Not Tautological:** The argument isn't circular. It starts with a minimal concept of accuracy (truth-directedness), adds propriety as a plausible requirement for a good accuracy measure (defended on epistemic grounds), and then *derives* the necessity of coherence as a consequence. The domination result is non-trivial.
  4.  **Superior Foundation:** While both arguments support probabilism, ADA provides a *stronger* and *more fundamental* rationale. Pragmatic vulnerability (DBA) can be seen as a *consequence* of epistemic defectiveness (ADA) *if* the agent acts on their beliefs in certain ways, but the epistemic defect exists independently. ADA shows why coherence is rationally compelling even for an agent completely isolated from practical decisions.

  **Conclusion:** Joyce's argument successfully relocates the justification for probabilism from the pragmatic domain of avoiding financial exploitation to the epistemic domain of pursuing accurate representation of the truth. It shows that incoherent credences are not just risky bets; they are *guaranteed* to be worse representations of reality than some coherent alternative, according to any reasonable epistemic standard. This constitutes a genuine epistemic vindication, grounded in the intrinsic connection between rational belief and truth, not in contingent facts about betting or decision-making. The assumptions about accuracy measures are substantive but firmly within the realm of epistemic value theory, not pragmatics.
