answer: |-
  Your instinct—that resolute choice merely "jams the pump" without resolving the underlying incoherence of cyclic preferences—is philosophically trenchant. Yet McClennen's framework offers a robust defense of diachronic rationality *without* requiring synchronic transitivity. Below, I construct the strongest case for this view, addressing both the mechanics of resolute choice and why sophisticated choice is insufficient. The core argument hinges on **temporal identity**, **plan-based rationality**, and **outcome superiority**.

  ---

  ### **The Case for Resolute Choice as Genuine Diachronic Coherence**
  1. **Cyclic Preferences as Context-Dependent, Not Irrational**  
     Cyclic preferences (A≻B, B≻C, C≻A) need not reflect logical inconsistency but *contextual valuation*. For example:  
     - A = $120, B = $100 + a friend’s favor, C = $110.  
     - You prefer A≻B (cash dominates), B≻C (the favor outweighs $10), but C≻A when the friend’s favor is irrelevant (pure cash comparison).  
     Here, cycles arise from shifting *frames of reference* (social vs. financial), not fundamental irrationality. Resolute choice treats the cycle as a feature of multidimensional value, demanding a holistic plan to honor all dimensions simultaneously.

  2. **Resoluteness as Temporal Identity, Not Precommitment**  
     McClennen’s agent is not "binding itself" externally (like Ulysses) but **integrating its temporal selves into a single deliberative entity**:  
     - **Plan-as-Intention**: At t₀, the agent forms a *plan* (e.g., "Choose A→B→C→stop") based on its overarching goals. This plan isn’t a constraint but an *expression of its complete preference structure*.  
     - **Diachronic Unity**: When local preferences tempt deviation (e.g., at C, preferring A), the agent recognizes that *satisfying the t₀ intention* is more rational than myopic optimization. This upholds a Lockean "narrative self" where identity persists through time.  
     - **No Menu Manipulation**: Unlike precommitment, the tempting option (A) remains available. Choosing not to take it is an exercise of *higher-order rationality*—honoring the initial judgment that completing the plan maximizes overall value.

  3. **Escaping the Money Pump Without Illusion**  
     - **The Pump’s Hidden Cost**: In perpetual motion, energy conservation is violated. In decision cycles, the "conserved quantity" is *rational agency itself*: the pump works by atomizing the agent into momentary selves. Resolute choice restores integrity by refusing to engage in locally advantageous but globally self-destructive trades.  
     - **Outcome Superiority**: A resolute agent ends with A *without paying pump fees*. A sophisticated agent (as we’ll see) may avoid fees but settles for inferior outcomes. Resoluteness achieves strictly better results by executing the optimal path: it "defangs" the pump by denying its exploitation mechanism.

  ---

  ### **Why Sophisticated Choice is Inferior (and Why Resoluteness is Necessary)**
  Sophisticated choice uses backward induction to avoid money pumps. For a cycle A≻B≻C≻A:  
  - At the final node, the agent would pay to trade C for A (since C≺A).  
  - Anticipating this, it refuses to trade B for C earlier (to avoid ending with C).  
  - Thus, it never starts the cycle.  

  **But this is a Pyrrhic victory**:  
  1. **Passive Surrender to Dominance**:  
     - The sophisticated agent *never achieves its most preferred outcome (A)*. It becomes "stuck" with B or C to avoid exploitation, effectively accepting a dominated option.  
     - *Example*: You prefer A (Paris trip) > B (Berlin trip) > C (stay home) > A (due to budget cycles). A sophisticated agent stays home (C) to avoid paying pump fees—a clear loss.  

  2. **Failure in Positive-Sum Cycles**:  
     - Not all cycles are exploitative. Consider a "benign cycle": Trade A for B (+$1), B for C (+$1), C for A (+$1). Net gain: $3.  
     - Sophisticated choice rejects all trades (fearing a pump), gaining $0.  
     - Resolute choice executes the cycle once, gains $3, and stops—*demonstrating strict superiority*.  

  3. **Dynamic Inconsistency as Pathology**:  
     Sophistication treats preferences as fixed, forcing the agent to "manage" its future selves like adversaries. Resoluteness *transcends* this by unifying agency: it is proactive rather than defensive.

  ---

  ### **Why This Defense Matters: Diachronic Rationality Redefined**
  - **Against Synchronic Tyranny**: Classical rationality demands that *every* momentary preference must align. Resolute choice argues that rationality is inherently temporal—what matters is coherence *over time*, not point-by-point transitivity.  
  - **The Cost of Transitivity**: Forcing transitivity upon cyclic preferences may require abandoning context-sensitive values (e.g., "Never value favors over cash"). Resoluteness preserves nuanced judgment without exploitation.  
  - **Agency Over Algorithms**: Sophisticated choice reduces rationality to predicting one’s own vulnerabilities. Resolute choice asserts that rationality is about *executing intentions*—a view aligned with Bratman’s planning theory of agency.  

  ---

  ### **Conclusion: The Crank That Turns for You**
  Resolute choice is not a "disguised" precommitment but a **positive assertion of diachronic identity**. An agent with cyclic preferences can be rational by:  
  - Forming a plan that respects its holistic values,  
  - Viewing deviation as a betrayal of its temporal unity,  
  - Achieving outcomes unattainable by sophisticated or myopic agents.  

  The perpetual motion metaphor fails because thermodynamics imposes *universal* conservation laws, while decision theory allows *agent-relative* value conservation. Resolute choice ensures that value isn’t leaked to arbitrageurs by integrating the agent across time—proving the pump’s futility not by hiding costs, but by denying its foundational premise: the fragmentation of the self.  

  As you once sought hidden energy sinks in thermodynamic cycles, seek here the *preservation of agential unity*—the true conserved quantity in rational choice.
