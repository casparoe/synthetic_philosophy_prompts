  The user's explicit question is whether their dad's approach has legitimate philosophical grounding or is just nepotism. But reading between the lines, they're also asking: "How do I honor my dad's legacy without failing as a manager?" and "Can I balance family loyalty with business needs without guilt?"

  Key tensions to address:
  - **Fairness vs Flexibility**: Universal standards ensure predictability but may ignore relational contexts. Family businesses thrive on loyalty but risk inefficiency. 
  - **Role Duality**: The dad saw himself as both business owner and family patriarch—a hybrid role modern management theory often ignores.
  - **Practical Wisdom**: The dad's actions (covering shifts for family issues) weren't weakness but investment in social capital. His "different obligations" point suggests he viewed family ties as constitutive, not additive.

