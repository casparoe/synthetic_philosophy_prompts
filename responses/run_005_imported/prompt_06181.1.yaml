prompt: |-
  I spent about thirty-five years as an industrial chemist before retiring, so words like 'soluble,' 'flammable,' and 'corrosive' were just Tuesday to me, and lately I've fallen down a philosophy rabbit hole about what dispositional words like that actually mean. I got to finks and masks and it stopped me cold. The naive story is that 'x is fragile' means 'x would break if struck' — but C.B. Martin's fink example has a live wire hooked up to a gadget that kills the current the instant someone touches it with a conductor, so it never actualy conducts, even though it was live a second earlier — which seems to sink the naive story outright. Then there's masking: the classic poison-and-antidote case, where the disposition and it's whole causal basis are still sitting there intact, but something else in the mix stops it from ever manifesting. Lewis's 'reformed' conditional analysis, which ties the disposition to an intrinsic causal basis, fixes the fink problem fine but apparently still gets bitten by masks.

  Here's my actual question. Robert Boyle spent his career arguing that powers like corrosiveness and solubility are just facts about a body's corpuscular texture interacting with the texture of whatever it acts on — and if I'm remembering the secondary lit right, he even reaches for a key-and-lock case to make the point that a power is always relative to what it's paired with, never some free-floating property sitting in the body alone. Locke gets all the credit for the powers-and-qualities story, but Boyle ran the actual reactions, so I want your best reconstruction of him specifically: does his relational, texture-based account of powers give him a built-in answer to finks and masks, since he never thought powers were context-free to begin with? Or is the mechanical philosophy secretly committed to something close to the naive conditional story that finks and masks are supposed to wreck? Tell me where he'd have a genuinely good answer, and where you think he'd actually be stuck.
