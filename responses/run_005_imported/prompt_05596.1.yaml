  The user mentions Gödel and Cohen's results. Gödel showed CH is consistent with ZFC, and Cohen proved that not-CH is also consistent. Together, they show CH is independent of ZFC axioms. The user wonders if Cantor would side with Gödel, who thought new axioms (like large cardinals) could settle CH, or if the independence would shake his Platonism.

  I need to focus on Cantor's philosophy. He believed in absolute infinity and that the universe of sets is fixed. His distinction between the transfinite and the absolute infinite is key. The continuum was a definite set for him, so CH must have a truth value. The independence results might not undermine that for him because he didn't see ZFC as the final word. He might view ZFC as incomplete, needing stronger axioms to capture the real set universe.

