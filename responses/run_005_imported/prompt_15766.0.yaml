answer: |-
  To resolve the debate between epistemic contextualism and pragmatic encroachment (subject-sensitive invariantism), consider the following scenario, designed to create a divergence by mismatching the practical situations of the attributor (A) and the subject (S):

  ### Scenario: The Emergency Prescription
  - **Proposition p**: "The pharmacy closes at 8 PM tonight."
  - **Subject (S)**: S has a severe allergy and needs a life-saving prescription filled today. If S fails to get the medication by 8 PM, they will suffer a life-threatening reaction. S's evidence for p is:
    - A reliable friend texted S this morning: "The pharmacy closes at 8 PM."
    - S briefly saw a sign at the pharmacy yesterday stating "Hours: 9 AM–8 PM."
    - S has no reason to doubt the friend or the sign, but hasn't verified further (e.g., no call to the pharmacy).
  - **Attributor (A)**: A is a coworker of S, overhearing S mention the pharmacy. A has no stake in S's situation—A is merely curious. A knows S's evidence (the text and the sign) and S's high-stakes context. In a casual conversation, A asserts: "S knows that the pharmacy closes at 8 PM."

  ### Verdicts and Commitments
  1. **Contextualism (Attributor-Centered Standards)**:
     - **Verdict**: A's statement "S knows that p" is **true**.
     - **Commitment Forcing Verdict**: Contextualism holds that the truth of "knows" depends on the **attributor's context**. A is in a **low-stakes situation** (mere curiosity), so the epistemic standards for knowledge are **low**. S's evidence (testimonial and memorial) meets these low standards. Thus, A's assertion is true, regardless of S's high stakes.

  2. **Pragmatic Encroachment (Subject-Sensitive Invariantism)**:
     - **Verdict**: A's statement "S knows that p" is **false**.
     - **Commitment Forcing Verdict**: Pragmatic encroachment holds that the truth of "knows" depends on the **subject's practical situation**. S is in a **high-stakes situation** (life-threatening risk), so the evidence required for knowledge is **higher**. S's evidence is insufficient—e.g., S should have called the pharmacy to confirm hours due to the stakes. Thus, S does not know p, making A's assertion false.

  ### Why This Works
  - **Mismatched Stakes**: A (low stakes) attributes knowledge to S (high stakes), exploiting the core difference:
    - Contextualism **ignores S's stakes**, using only A's context (low standards → knowledge).
    - Pragmatic encroachment **ignores A's context**, using only S's stakes (high standards → ignorance).
  - **Undodgeable**: Unlike bank cases where stakes are aligned, this scenario ensures the theories conflict because:
    - Contextualism cannot appeal to S's stakes (it rejects subject-sensitive standards).
    - Pragmatic encroachment cannot appeal to A's context (it is invariantist).

  This scenario cleanly isolates the disagreement: contextualism prioritizes the attributor's context, while pragmatic encroachment prioritizes the subject's practical situation.
