            - So A would say: "S does not know that p".

        According to Pragmatic Encroachment:
            - The truth of "S knows that p" depends on S's situation, which is low stakes.
            - Therefore, S does know that p (because the evidence is sufficient for low stakes).
            - So the statement "S knows that p" is true.

