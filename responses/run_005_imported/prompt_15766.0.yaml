        We must fix the evidence of S and the practical situation of S. And we must also fix that A is aware of both.

     So:

        A knows:
           - S's evidence: memory and website.
           - S's high stakes: if the check isn't deposited by Saturday, S loses the house.

        Now, if A is a contextualist and in a low-stakes context, then A might think that S's evidence is enough to meet the low standards. So A says "S knows p".

        But if we are subject-sensitive invariantists, then we say that the truth of "S knows p" depends on S's stakes. Since S has high stakes, S does not know. Therefore, A's utterance "S knows p" is false.

     So the opposite verdicts are:

        Contextualism: A's utterance "S knows p" is true.
        Pragmatic Encroachment: A's utterance "S knows p" is false.

     This is a clear divergence.

     Now, let me construct a specific scenario:

     Scenario: The Saturday Bank Deposit

        Subject S: 
