     However, note that in the contextualist view, the attributor's context sets the standards. So even though S is in a high-stakes situation, the attributor A is not in that situation. Therefore, the standards for A are low. Contextualism does not look at the subject's stakes but at the attributor's context.

     On the other hand, pragmatic encroachment looks at the subject's stakes.

     Therefore, we have achieved the goal.

     But what if we reverse the situation? Let's also consider Type 2 for completeness.

     Type 2: Attributor high stakes, subject low stakes.

