answer: |-
  ## Kitchen Table Philosophy

  **OLDER BROTHER (MARK):** Look, Dave. Just... listen. You think I chose to be the screw-up? That I *decided**, back when I was fifteen, sixteen, staring at the broken lock on that warehouse, 'Yeah, this is the path for me'? Like I weighed the options? Like I *made* myself the kind of person who’d think that was a good idea?

  **YOUNGER BROTHER (DAVE):** Nobody said you *chose* to be born a twat, Mark. But you *did* the time because you *did* the crime. Mum paid the price for that too, every day you were inside. That’s just… fact. Responsibility. What else is there?

  **MARK:** Fact? Okay, let’s talk facts. Fact: I did what I did because of the person I *was* in that moment. The impulses I had, the fears, the stupid bravado, the utter lack of seeing a future. Right? That was *me*. The product of… genes, Mum and Dad’s messy divorce, getting beaten up at school, whatever cocktail mixed in this head.

  **DAVE:** Yeah, life shaped you. It shapes everyone. Doesn’t mean you get a free pass.

  **MARK:** Exactly! It *shaped* me. I didn’t *shape* me. I didn’t pick the ingredients. I didn’t build the mould. That person who walked into the warehouse? He was already baked. So how can you hold *me* – this separate, responsible 'me' – accountable for what *that* product did? I *am* that product! Where’s the gap? Where’s the magic little man inside who could have overridden the whole machine if only he’d *chosen* better? He didn’t build the machine! He *is* the machine.

  **DAVE:** So what? We just shrug? ‘Wasn’t me, guv, it was the machine’? You wrecked lives, Mark. Mum’s heart. My trust. Some shopkeeper’s livelihood you helped trash. You want me to just… *understand*? Like you’re a faulty appliance? ‘Oh, Mark’s broken, best just manage him’?

  **MARK:** Maybe! Or maybe… look, imagine this. Imagine someone does something utterly, cosmically good. Saves a thousand kids from a burning orphanage. Pure saint. Now, imagine we discover it’s *only* because they were wired that way from birth, or conditioned perfectly for self-sacrifice. They literally *couldn’t* have done otherwise. Do they deserve heaven? Eternal bliss? Or is it just… how they were built? Flip it. Someone does something unspeakably evil. But only because their brain chemistry was messed up from the womb, or they were tortured into becoming a monster. Do they *deserve* hell? Eternal torment? For being a broken machine? The action’s the same. The consequences are the same. But the *desert*…? That vanishes when you see the blueprint. The responsibility was baked in before the first breath.

  **DAVE:** Christ, Mark. Heaven and hell? Is that what this is? You think I’m sitting here judging your eternal soul? I’m *angry*. I’m *hurt*. I’ve spent years resenting you, worrying about Mum, cleaning up the mess. That’s not about cosmic justice or some… ultimate blueprint! It’s about *us*. Here. Now. At Mum’s bloody kitchen table after burying her.

  **MARK:** But the anger, Dave! The resentment! That’s the point! You *feel* it because you think I *could* have been different. You think there was a *me* separate from the causes who could have chosen the other path. But there wasn’t. There never is. For anyone. It’s an illusion. A necessary one, maybe, to keep society ticking, but an illusion. Once you see the gears turning… the anger just seems… misplaced. Pointless. Like being furious at a hurricane.

  **DAVE:** Misplaced? Pointless? You spent five years in a cell! Was that society just managing a faulty appliance? Or was it *blaming* you? Holding you *accountable*? And you felt it, didn’t you? The shame? Or was that just gears grinding too?

  **MARK:** (Quieter) Felt it. Still feel it. Doesn’t make it *deserved*. Just… part of the program. Pain in, pain out.

  **DAVE:** Okay, Mr. Philosopher. Say you’re right. Say nobody *ultimately* authors themselves. Fine. What’s the alternative? You want me to look at you now… like you’re a virus? A natural disaster? ‘Objective attitude’, right? Just calculate risks, manage outcomes, no hard feelings? Like you’re not my brother, just a problem to be solved? Is *that* more honest? More true?

  **MARK:** Maybe it *is* more true. Harsh, but true.

  **DAVE:** Bullshit. That’s not falling into the *default*. That’s a *choice*. A cold, calculated *move*. To step back like that… it’s not the natural consequence of realizing determinism might be true. It’s giving up on the person. Treating them as less than human. And you *earn* that attitude, Mark, by being… irredeemable. A rabid dog. You haven’t earned it. You pissed me off, you broke Mum’s heart, you made terrible choices driven by who you were… but you’re still *you*. My brother. And brothers get resented. They get blamed. They get held to account. Because the alternative… treating you like a force of nature I just need to navigate around… that kills something between us far more finally than prison ever did. It’s giving up on *us*.

  **MARK:** So what? We just… keep playing the game? Pretending the responsibility is real because the feelings are strong? Because the *practice* demands it? That feels… hollow. Like whistling in the dark.

  **DAVE:** It’s not *pretending*! The feelings *are* the reality! The resentment, the blame… that *is* what responsibility *looks like* in the messy human world! It’s not based on some impossible self-creation. It’s based on… connection. History. Expectation. The sheer fact that we *care* what each other does! You step outside *that*… into the cold, objective view… you don’t do it because logic forces you. You do it when the connection is broken. When someone’s so far gone you can’t engage with them as a person anymore. Is that what you want? Here? Now? After everything? You want me to treat you like a stranger? Like a *thing* that hurt Mum? Because that’s the logical endpoint of your ‘no real responsibility’? It’s surrender.

  **MARK:** (Pauses, rubs his temples) Strawson.

  **DAVE:** What?

  **MARK:** That bit… about the objective attitude. ‘Earning’ it. That sounds familiar. Peter Strawson, right? ‘Freedom and Resentment’?

  **DAVE:** Yeah, maybe. Read it years ago. Why?

  **MARK:** (A dry, almost laugh) Because the guy whose argument I’ve been butchering… the ‘heaven and hell’, ‘you didn’t make yourself’ bit… that’s Galen Strawson. Peter Strawson’s *son*. Literally arguing against his own dad’s idea about responsibility decades later. Like father, like son… fighting the same damn fight across the dinner table. Guess it runs in families, huh? This need to figure out if we’re really to blame.

  **DAVE:** (Stares at him for a beat) So what? You saying *your* argument is just genetic destiny too? Learned it at Daddy Strawson’s knee? Doesn’t count? Or does that loop just keep going forever? You didn’t choose your argument, Galen didn’t choose his, his dad didn’t choose his… where does it stop? Where do *we* start?

  **MARK:** That’s the question, isn’t it? The infinite regress. You do what you do because of who you are. You didn’t choose who you are. So…

  **DAVE:** So maybe we stop chasing the ghost of the ultimate chooser and deal with who we *are*. Right here. With all the messy history and the resentment and the fact that I’m still bloody furious at you for putting Mum through hell, and you’re sitting there looking like you haven’t slept in a week, and we’re both sitting in *her* kitchen after saying goodbye. That’s the reality. Not gears. Not blueprints. *This*. You. Me. This table. The blame. The hurt. The… connection, however frayed. What do we *do* with *that*, Mark? That’s the only responsibility that matters tonight. Forget heaven and hell. What about here? What about *us*?

  **MARK:** (Looks down at the worn tabletop, tracing a scratch with his finger) I don’t know, Dave. Honestly. I don’t know where that leaves us. Or the blame. Or any of it. Just… here.
