  ## The Dignity Toss: A Hart-Devlin Dialogue on Manuel Wackenheim

  **Setting:** A university common room after a seminar on legal moralism.  
  **Characters:**  
  *   **Claire (Defending Devlin):** Believes society has a right to enforce shared moral boundaries to prevent disintegration.  
  *   **Leo (Defending Hart):** Champions individual liberty against moralistic legislation, emphasizing critical morality.  

  **Leo:** (Sighing, stirring his coffee) That Wackenheim case still bothers me, Claire. The French ban on his dwarf-tossing act, upheld *even* by the UN Human Rights Committee citing "human dignity"? It feels like legal moralism in its purest, most pernicious form. A consenting adult, padded for safety, performing for a willing audience, loses his livelihood because the state deems it *offensive*? Hart was right – this is precisely the tyranny of the majority Mill warned about, disguised as "dignity".

  **Claire:** Leo, it's not that simple. Devlin would argue you’re overlooking the *social* dimension. This isn't just about Manuel Wackenheim's individual consent or economic need. It's about what the act *represents* and the message it broadcasts about the value of human beings. Devlin’s "disintegration thesis" holds that a shared public morality is the invisible glue binding society. Acts that outrage that shared morality – that the "reasonable man" would find deeply offensive or degrading – can erode that essential bond. The French court and the UNHRC saw dwarf-tossing as reducing a person to a projectile, an object for amusement. That strikes at the core of human dignity, a foundational value for that society.

  **Leo:** But Hart’s crucial distinction demolishes that! The "reasonable man" test Devlin relies on – and this "dignity" argument seems like its direct descendant – conflates **positive morality** (what people *actually* believe) with **critical morality** (what is *justifiably* moral). Just because a majority *feels* outrage doesn't make that feeling morally sound or a legitimate basis for law. As Ronald Dworkin later argued, Devlin’s test is a trap – it can’t reliably distinguish genuine, reasoned moral conviction from prejudice, disgust, or unthinking tradition. Isn't the outrage here rooted in prejudice against dwarfism itself? The "degradation" comes from associating the act *with* his condition, not the act itself. Wackenheim himself saw it as skilled performance.

  **Claire:** You raise Dworkin’s worry, and it’s valid. But Devlin wasn't just talking about fleeting disgust. He meant a profound, society-wide sense of what’s intolerably destructive to the shared conception of humanity. The UNHRC didn't just cite French sensibilities; it invoked dignity as an *inherent*, *inalienable* human attribute. That’s critical morality territory – asserting a universal principle. They argued dignity isn't something Wackenheim *could* waive by consent, precisely because it defines the minimum threshold of human worth *before* consent even becomes meaningful. Consent to degradation *is* degradation, undermining the very basis of social respect. Isn't that a critical moral claim?

  **Leo:** It *claims* universality, but whose critical morality? Hart’s point is that we need *reasoned argument* to justify coercion, not just an appeal to inherent dignity used paternalistically. This ban *isn't* paternalistic in the Millian sense – it’s not claiming to protect Wackenheim *from himself*. It’s protecting *society's* sense of propriety *from* his choice. That’s pure Devlin. And Hart rightly rejected that as insufficient grounds for criminalization. The cost to Wackenheim – losing one of his few viable livelihoods – is a concrete harm inflicted to uphold an abstract, contested feeling of outrage. How is that just?

  **Claire:** You isolate the harm too narrowly. The harm Devlin feared, and the courts invoked, is the erosion of the shared understanding that *all* people possess inherent worth, not to be commodified or used as literal playthings. Permitting such acts, even consensually, normalizes the idea that some bodies are objects for others' entertainment in a way that *does* degrade the social fabric. It’s not just about *his* act; it’s about the cumulative effect on how we collectively see human value. The "reasonable person" test, applied rigorously, asks if this act strikes at something *fundamental* to society’s self-understanding. The French courts and UNHRC said yes.

  **Leo:** But that's where Hart’s (and my) deepest unease lies. Hart *did* accept some paternalism – laws against suicide, for instance – arguing individuals might not be the best judges of their own long-term interests. But this ban *explicitly* rejects paternalism! They *deny* Wackenheim’s capacity to judge his *own* dignity and interests. They override his lived experience and autonomy based on an external, abstract principle applied *to* him. That’s worse! It treats him like a child or an object incapable of defining his own participation. Hart might accept laws preventing *actual* harm or exploitation, but overriding competent consent based purely on society’s moral offense? That’s the line he drew. Dworkin’s "prejudice trap" feels glaringly evident here – is the outrage truly about universal dignity, or discomfort with a disabled body in an unconventional role?

  **Claire:** And Devlin, or the modern dignity argument, would counter that some lines *must* be drawn to prevent the normalization of degradation, even self-chosen. Society has a legitimate interest in maintaining the minimum conditions for mutual respect. Calling it "prejudice" ignores the reasoned argument that objectification, even consented to, undermines the bedrock of equal human worth *for everyone*. Wackenheim’s consent doesn’t erase the act’s symbolic meaning within the social fabric. The "disintegration" feared isn't chaos, but a slow corrosion of the shared belief in inviolable human dignity. Protecting that, they argue, ultimately protects *him* and others like him from a society that might increasingly see them as less than fully human.

  **Leo:** But at what cost, Claire? At the cost of his autonomy, his livelihood, and the principle that competent adults get to define the meaning of their own actions? Hart’s fear was precisely this: that appeals to vague, profound societal feelings become tyrannical. We end up sacrificing a real person’s freedom and well-being on the altar of an abstract, contested, and potentially prejudiced notion of "dignity" he explicitly rejects. The UNHRC’s "inalienable" dignity feels less like universal critical morality and more like positive morality enforced globally. Hart’s framework demands we prioritize liberty unless clear, concrete harm is proven. Here, the only proven harm is *to* Wackenheim, *by* the ban.

  **Claire:** And Devlin’s framework insists that the harm to the social bond *is* concrete, even if intangible, and that liberty finds its limit where it fatally wounds the shared values that make society possible. Protecting human dignity *from* commodification, even self-commodification, is seen as protecting the foundation of that society. For Devlin, and for those courts, Wackenheim’s case tragically illustrates that limit. The dignity rationale *is* Devlin’s argument evolved – applying his concern for societal foundations to a fundamental, internationally recognized human right. The disagreement remains profound: is society's moral core a legitimate constraint on individual liberty, or is it too often a mask for prejudice and oppression?

  **Leo:** Profound indeed. I see the weight of the social argument, Claire, truly. But I cannot accept that Manuel Wackenheim, seeking dignity through work and self-definition on his own terms, should be sacrificed to preserve a "dignity" he experiences as a denial of his agency. Hart’s distinction between positive and critical morality, and his skepticism of the "reasonable man’s" outrage, feel more necessary than ever. The cost of getting this wrong falls heaviest on the most vulnerable.

  **Claire:** And I see the individual cost, Leo, acutely. But I fear the cost of *not* drawing lines, of allowing anything consented to, risks a different, slower erosion – of the very idea that humans possess inherent worth beyond utility or amusement. For Devlin, and for those upholding the ban, that risk justified the sacrifice. The tension between individual liberty and the moral foundations of community... it seems this case leaves us right where Hart and Devlin did: fundamentally, irreconcilably divided on where the line must fall.

  *(They both sip their coffee, the silence heavy with the unresolved weight of the dilemma.)*
