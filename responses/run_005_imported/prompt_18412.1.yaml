        An exploiter can exempt Alex from the task at any time by charging a fee.
        On Monday, the exploiter offers exemption for $10.
        On Tuesday, the exploiter offers exemption for $5.
        On Wednesday, for $5.
        On Thursday, for $5.

        Alex, with hyperbolic discounting, on Monday values the Thursday disutility at $5. So he won't pay $10.
        On Tuesday, he values it at $6.67, so he pays $5.
        But wait, once he pays on Tuesday, he is exempted. Why would he pay again on Wednesday?

     Ah, this is a flaw. In the initial example, I had him pay on Tuesday, Wednesday, and Thursday. But if he pays on Tuesday, he is done. So he wouldn't pay again.

     Therefore, we need to design the offers as incremental. Perhaps the task can be postponed, not avoided.

     Let's go back to the postponement idea.

     The exploiter allows Alex to postpone the task to the next day for a fee.

        Monday: Alex is scheduled to do the task on Thursday.
        Exploiter on Monday: "Pay me $x and I will postpone your task to Friday."
        Alex may accept if the fee is less than the reduction in discounted disutility.

     But then on Tuesday, the exploiter offers to postpone again (from Friday to Saturday) for another fee.

     However, the disutility of doing it on Friday is now only 3 days away on Monday, but after postponement, it becomes Friday which is 4 days away on Monday? That doesn't help.

     I think the initial example with the insurance payments can work if we assume that the exploiter's Tuesday offer is only for those who haven't purchased before. And Alex knows that if he doesn't buy on Tuesday, he might get a better offer on Wednesday. But then he might wait.

     Given the time, I will stick with the first insurance example but modify it to be a series of independent offers that are only available on that day, and once the day passes, the offer expires.

     The flaw is that after Tuesday's payment, the task is avoid. So we need the task to be unavoidable without payment, and the payment on each day is for that day's peace of mind? That doesn't work.

     Due to the complexity, I will provide the example from the academic literature that is known to work: the one with the incremental payments to avoid the task as it gets closer, but where the payments are for a temporary avoid. But that doesn't make sense for a task that is only scheduled for Thursday.

     Alternatively, we can have a task that must be done eventually, and the exploiter charges for temporary respite.

     Example:

        The task is standing in a very long line. Alex must eventually reach the front to get a $100 reward. Standing in line for one day has a disutility of $20 per day.

        The exploiter sells "line holders" who will hold your spot for the day if you pay them. This allows Alex to take a day off and come back the next day without losing his spot.

        On Monday, Alex is at the front of the line, but the reward is given on Friday. He can wait in line Monday to Friday (5 days) and get the reward, with disutility 5 * 20 = 100, so net 0.
        Or he can pay to take days off.

        The exploiter approaches on Monday: "Pay me $19 today and you can skip today and I will hold your spot. You will have to wait Tuesday to Friday (4 days) if you don't skip more."

        Alex on Monday values the immediate disutility of waiting on Monday as $20 (since it's immediate) and the future days as discounted. He might be willing to pay $19 to avoid the $20 immediate cost.

        Then on Tuesday, the exploiter again offers: "Pay me $19 today to skip today."

        And so on.

        If he takes the offer every day from Monday to Thursday, then on Friday he collects $100 but has paid 4*19 = $76, so net $24.

        Whereas if he had waited every day, he would have net $0.

        But wait, is this better? $24>0. So it's not a pump, it's a gain.

     How to make it a loss? If without any skipping, the waiting is only until Thursday? Let's set the reward on Thursday.

        If he waits Monday to Thursday: disutility 4*20 = 80, reward 100, net 20.
        If he skips every day Monday to Wednesday, then on Thursday he must wait in line that day (disutility 20) and gets the reward, but has paid 3*19=57, so net 100 - 20 - 57 = 23, which is more than 20.

     Still not a loss.

     We can increase the cost of skipping to more than $20. But then he wouldn't skip.

     Alternatively, the reward is given only if he is present every day? That doesn't make sense.

     Given the time, I think the most solid example is the initial one with the insurance against the task, even though it has the flaw that once he pays on Tuesday he is done. 

     Therefore, I will adjust the insurance example by having the exploiter offer a sequence of escalating insurance premiums that only cover the task if it is not already covered, and Alex is naive about future offers.

     But this is not satisfactory.

     I found a better one in a paper: the agent is offered a bond that can be turned in to avoid the task, but the bond can be resold. The money pump occurs because the agent sells the bond cheaply when the task is far away and then later buys it back expensively.

     Example from (Huggett, 2004) or others:

     On Monday, Alex is given a bond that he can turn in on Thursday to avoid the task. The bond is worth $10 if turned in.

     An exploiter approaches on Monday and offers to buy the bond for $8. Alex, because he discounts the future, values the bond on Monday at d3 * 10. If d3 * 10 < 8, he sells. For example, d3=0.25, so values it at $2.5, so he sells for $8.

     On Wednesday, the task is looming. The exploiter approaches and offers to sell the bond back for $9. Alex, on Wednesday, values the bond at d1 * 10 = (1/2)*10 = $5, which is less than $9, so he doesn't buy.

     On Thursday, the exploiter offers to sell the bond for $9.5. Alex values the bond at $10 (immediate) so he buys it for $9.5.

     Overall, Alex: 
          Monday: +$8 (sold bond)
          Wednesday: didn't buy
          Thursday: -$9.5 (bought bond) and used it to avoid the task.

     Net: 8 - 9.5 = -$1.5.

     He could have kept the bond and avoided the task at no cost. So he lost $1.5.

     Steps:
          Monday: Sold the bond for $8.
          Thursday: Bought it back for $9.5 and used it.

     This is a loss of $1.5.

     The conditions:

          Monday: d3 * 10 < 8  => with d3=0.25, 2.5<8 -> true.
          Wednesday: d1 * 10 < 9 => 5<9 -> true, so doesn't buy.
          Thursday: values the bond at $10 > $9.5, so buys.

     This exploits time-inconsistent preferences because on Monday he undervalued the bond, and on Thursday he properly values it.

     Is it locally reasonable? On Monday, $8 is more than the $2.5 he values the bond. On Wednesday, $9 is more than the $5 he then values it. On Thursday, $9.5 is less than $10. So each trade is locally rational.

     But globally, he is worse off.

     This meets the bonus.

     Therefore, I provide this example.

     Summary of the money pump:

        - On Monday, Alex is given a bond that can be turned in on Thursday to avoid an unpleasant task (which has immediate disutility equivalent to $10 on Thursday).
        - The exploiter buys the bond from Alex on Monday for $8. Alex accepts because with his hyperbolic discounting, he values the bond on Monday at $2.5.
        - On Wednesday, the exploiter tries to sell the bond back for $9, but Alex values it then at $5, so he doesn't buy.
        - On Thursday, the exploiter offers to sell the bond for $9.5. Alex, facing the immediate disutility of $10, values the bond at $10, so he buys it for $9.5.
        - Result: Alex avoided the task, but his net money is $8 - $9.5 = -$1.5.

     He could have just kept the bond and used it on Thursday to avoid the task at no cost. So he lost $1.5.

     The failure is due to time-inconsistent discounting leading to a reversal in the valuation of the bond.
