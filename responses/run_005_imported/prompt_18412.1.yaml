  Here's a money pump scenario that exploits diachronic rationality failure (specifically, time-inconsistent discounting), designed to be ambiguous as to whether the victim is irrational or merely making locally reasonable choices:

  ### **The "Hyperbolic Homework" Money Pump**
  **Characters**:  
  - **Alex**: A student with time-inconsistent preferences (hyperbolic discounter).  
  - **Tutor**: An exploiter offering "homework relief" services.  

  **Scenario Setup**:  
  Alex has a 3-hour homework assignment due Friday. He values his time at $20/hour, so completing it costs him $60 in subjective disutility. He also values immediate rewards highly relative to future ones. The Tutor offers timed deals to "delay" the homework, exploiting Alex's changing time preferences.  

  #### **Timeline of Events**:
  1. **Monday**:  
     - Alex's options:  
       - **Option A**: Do homework now (Monday) and incur immediate $60 disutility.  
       - **Option B**: Do homework Friday with no penalty.  
     - *Alex's perspective*: Friday feels distant. With hyperbolic discounting, he values Friday's $60 disutility at just $20 today (steep discounting).  
     - *Tutor's offer*: "Pay me $25 now, and I'll reduce Friday's homework time by 90 minutes (saving $30 in future disutility)."  
     - *Alex's choice*: Pays $25. *Locally rational*: $25 today feels worse than $30 discounted to $10 (net gain: $10 - $25 = -$15? But he misjudges).  

  2. **Wednesday**:  
     - Homework is now 2 days away (Friday).  
     - Alex's discounted disutility for Friday has risen to $40 (less discounting).  
     - *Tutor's offer*: "Pay another $20 now, and I'll reduce Friday's work by 1 hour (saving $20)."  
     - *Alex's choice*: Pays $20. *Locally rational*: $20 today to avoid $20 (discounted to $16? He perceives a slight gain).  

  3. **Friday Morning**:  
     - Homework is due today. Alex faces $60 disutility immediately.  
     - *Tutor's final offer*: "Pay $35 now, and I'll do the entire homework for you."  
     - *Alex's choice*: Pays $35. *Locally rational*: $35 < $60 immediate pain.  

  #### **Outcome**:  
  - Alex paid $25 + $20 + $35 = **$80**.  
  - He avoided the homework but **lost $80** instead of doing it himself (net loss: $80 - $60 = **$20**).  

  ### **Why It's a Diachronic Failure**:  
  - **Monday vs. Friday preferences**:  
    - On Monday, Alex *underweights* Friday’s cost due to hyperbolic discounting (values $60 at $20).  
    - On Friday, he *overweights* immediate cost ($60 feels intolerable).  
  - **No intransitivity**: At each stage, Alex has consistent preferences (e.g., "avoid immediate pain > save money").  
  - **Plans vs. actions**: On Monday, Alex would *commit* to doing homework Friday to save money, but when Friday arrives, he pays to avoid it.  

  ### **Ambiguity: Irrational or Reasonable?**  
  - **Locally reasonable**: Each choice minimizes perceived pain at that moment:  
    - Monday: Small payment for large future savings (he believes).  
    - Friday: Paying $35 beats $60 pain.  
  - **Globally irrational**: The sequence is a net loss. Time inconsistency turns rational myopic choices into a pump.  
  - **Why it’s unclear**:  
    - If Alex’s discount rate is high (e.g., facing emergencies), each payment *is* justified.  
    - The Tutor isn’t "cheating"—Alex voluntarily pays at each stage.  
    - Only in hindsight does the pattern seem foolish.  

  ### **Key Takeaway**:  
  This pump exploits **dynamic inconsistency in discounting**, not static intransitivity. Alex’s failure is neglecting how his future self will re-evaluate costs, creating a cycle of payments that *seem* reasonable locally but are exploitative globally. The ambiguity lies in whether hyperbolic discounting is a "rational" response to uncertainty or a cognitive flaw.
