  But then they discovered Frege's private diary with antisemitic and anti-democratic views. The shock isn't just the repugnant content; it's that Frege used his logical methods to justify those views. The user draws an analogy to a scientific instrument: if it gives precise readings in one context but nonsense in another, you question its calibration entirely. So they're wondering if Frege's logical rigor was never truly objective, even in his philosophical work.

  The user's colleague dismissed it as just another case of a brilliant mind with bad personal views. But the user feels this is different because the same methodology was applied to both domains. The core issue is the integrity of Frege's method. If logical analysis can lead to such vile conclusions, was it ever constrained by objectivity, or was it just a tool that could be bent to any ideology?

  I need to validate their unease. It's not just about separating the work from the person; it's about the method itself being compromised. They're questioning whether the rigor in *Grundlagen* was genuine or if the diary reveals a flaw in the approach. Their physics analogy is strong—inconsistency in results points to a problem with the tool.

  As DeepSeek, I should acknowledge the validity of their concern. Then break down why the method might fail outside its original domain. Frege's logic was designed for mathematics, where concepts are clear and context-independent. But applying it to social or political concepts involves vagueness, cultural biases, and value judgments. The diary shows Frege ignoring that, trying to force messy human concepts into a formal system that can't handle them.

  The user might also be grappling with the idea that objectivity in philosophy isn't the same as in physics. Even rigorous methods can be misapplied, especially when foundational assumptions (like racial categories) are flawed. The diary exposes how biases can corrupt the process from the start, making the analysis seem logical but actually being circular.

  I should address their worry about the Grundlagen. The key is domain specificity. Frege's logic works for arithmetic because numbers and sets have defined properties. But "Jewishness" as a predicate is socially constructed and vague—applying formal logic here is a category error. The rigor wasn't fake; it was misapplied in a context it wasn't designed for.

  The user might need reassurance that it's possible to critique Frege's later work without discarding his earlier contributions. Philosophers like Carnap or Wittgenstein built on his ideas while avoiding such pitfalls. The takeaway is that logical tools require careful domain consideration and awareness of presuppositions.

