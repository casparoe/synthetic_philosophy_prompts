  We are ranking the astrological doctrines by how much genuine credence Kepler gave them, from most credible to least, based on his writings and known views.

  Key points about Kepler's beliefs:
  - Kepler was a key figure in the Scientific Revolution and a founder of modern astronomy, but he also practiced astrology and defended a "purified" version.
  - He rejected much of traditional astrology as superstitious, especially the detailed anthropomorphic interpretations and the idea that celestial bodies directly cause events on Earth.
  - He believed in a harmonious universe designed by God, where celestial patterns (like aspects) could serve as signs or symbols of events on Earth, but not as direct physical causes.
  - He was particularly interested in the mathematical harmonies of the universe (like the music of the spheres) and saw aspects (geometric angles between planets) as having a real, physical basis because they involved light and angles, which could influence the soul (which he thought was sensitive to geometry) and also the weather (by affecting the atmosphere).
  - He dismissed the idea that zodiac signs (which are arbitrary divisions) could have influence, and he was skeptical of natal horoscopes that claimed to predict individual fate in detail.
  - He accepted that comets and eclipses could be omens, but as signs from God rather than direct causes.
  - He put some stock in "great conjunctions" for marking broad historical trends, but again as signs, not causes.
  - He practiced horary astrology and astrological medicine but with reservations, adapting them to his more mathematical and physical framework.

  Ranking (from most credible to Kepler to least):

  1. **planetary aspects (angles between planets) affecting earthly and psychological events**: Kepler wrote extensively about aspects and their physical basis in light and geometry. He believed they could influence the weather and human souls (which are attuned to harmony). This is central to his "purified" astrology.

  2. **weather forecasting from planetary aspects**: He thought the atmosphere could be affected by the angles of planetary rays (light and heat), so this was a physical mechanism he could accept.

  3. **"great conjunctions" of Jupiter and Saturn marking historical epochs**: Kepler used these for broad historical analysis, seeing them as signs of major events (like the birth of Christ) but not as causes. He wrote about this in his work on the Star of Bethlehem.

  4. **comets/eclipses as omens of disaster**: He accepted them as signs from God, but not as direct physical causes of disasters.

  5. **horary astrology (reading the chart of the moment a question is asked)**: He practiced this and defended it in Tertius Interveniens, but only as a symbolic art that might reveal divine will, not as a physical causation.

  6. **astrological medicine (organs and treatments tied to zodiac signs)**: He expressed skepticism about the direct link but thought there might be a symbolic correspondence. He practiced medical astrology but with a focus on critical days calculated from aspects.

  7. **detailed natal horoscopes predicting one person's individual fate**: He cast many horoscopes but was critical of the idea that they could predict individual fate in detail. He saw them as providing general tendencies and as a way to make a living.

  8. **zodiac signs shaping personality/fate**: He rejected the zodiac as an arbitrary human division and denied that the constellations themselves had any power. He called this superstitious.

