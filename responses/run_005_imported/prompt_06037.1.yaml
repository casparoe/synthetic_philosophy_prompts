  ```

  Where Kepler drew the line:
  Kepler drew the line at direct physical causation. He accepted celestial geometry (aspects) as having a physical basis (via light and heat) on the weather and a symbolic or harmonic influence on the human soul. He rejected arbitrary divisions (like zodiac signs) and anthropomorphic interpretations. For him, astrology was about reading divine signs in a mathematically ordered universe, not about deterministic fate. He was a critical believer who aimed to reform astrology by removing superstition and aligning it with natural philosophy.
