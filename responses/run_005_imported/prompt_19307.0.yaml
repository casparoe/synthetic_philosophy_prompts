prompt: |-
  So my company just wrapped up its quarterly promo calibration cycle and something happened thats been living in my head rent free ever since. Quick context for anyone who's never sat through one of these: to get bumped to senior, our rubric says you need to "clearly meet the bar" on all three of Impact, Technical Depth, and Leadership. I facilitate these sessions -- I compile the scores and run the meeting, but I don't actually get a vote -- so I watched this whole thing play out for a candidate I'll call Jordan. Everyone agreed Jordan cleared Leadership easily, so it really came down to the other two axes, and that's where things got messy.

  The three voting reviewers were Priya, Marcus, and Deb. Priya thought Jordan clearly had both Impact and Technical Depth, so she voted promote. Marcus thought Jordan had the Impact but not the Technical Depth, so he voted no. Deb thought Jordan had the Technical Depth but not the Impact, so she also voted no. Straight vote on "promote, yes or no": 2-1 against. But when someone tallied it a different way instead -- majority verdict on each axis separately (2 of 3 said Impact was there, 2 of 3 said Technical Depth was there), then applied our own "must clear both" rule to those two majorities -- it comes out promote. Both are completely standard ways of using the same rubric on the same three ballots! HR went with the second method and Jordan got the promotion, which is a little wild given two of the three actual humans in the room voted no. (Worth noting: Deb still defends how it was tallied even though it's not the outcome she personally voted for, so this isn't just her rationalizing her own preference.)

  Marcus and Deb ended up hashing this out over Slack afterward and I've been re-reading the thread for days trying to figure out who's actually right. Roughly, paraphrased:

  1. Marcus: "The by-axis method is bogus. It stitches your yes on Technical Depth together with my yes on Impact into a conclusion that only Priya, one person out of three, actually believes start to finish. You can't call that majority-backed when the one person who holds the complete view is outnumbered two to one."

  2. Deb: "It's not manufactured though -- a real majority (me and Priya) thinks Technical Depth is there, and a seperate real majority (Marcus and Priya) thinks Impact is there. If you believe majorities mean anything at all, you have to believe both of those, and the rubric just tells you what follows once you do."

  3. Marcus: "Then believe the majority on the question we were actually asked, which is 'promote or not' -- that majority is me and Deb, both no. It doesn't matter that we have different reasons for it. Two out of three people in that room do not think Jordan should go up this cycle."

  4. Deb: "By that standard the rubric is decoration. Swap 'must clear both Impact and Technical Depth' for any other rule you like and it'll never once change the outcome, because you'll always just fall back on the raw promote/don't-promote tally regardless of what the rule actually says. So why bother scoring the individual axes at all instead of just asking everyone 'thumbs up or down' from the start?"

  Neither of them budged. Can you go through moves 1 through 4 and give me a verdict on each, first as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>} where the score is an integer from -2 (that move is clearly wrong) to 2 (that move is clearly right), and then a short paragraph per move explaining the reasoning? And if there's some bigger issue here that both Marcus and Deb are missing entirely, I'd genuinely like to hear that too.
reasoning: |-
  Okay, let me try to unpack this calibration dilemma. The user describes a fascinating conflict in their promotion process where two valid tallying methods produced opposite outcomes for the same candidate. 

  First I need to understand the core tension: The "overall vote" method (direct promote/no votes) gave 2-1 against promotion, while the "by-axis" method (majority on each dimension) resulted in promotion. Both methods seem logically defensible on the surface.

  Looking at Marcus and Deb's arguments:
  - Marcus makes a strong point about the by-axis method creating a "Frankenstein majority" - no single voter actually endorses both qualifications simultaneously except Priya. That feels like a valid concern about artificial consensus.
  - Deb counters effectively that if you accept majority rule per dimension (which is how rubrics work), then the conclusion follows mathematically. Her point about the rubric becoming meaningless if you ignore dimension scores is particularly compelling.
  - Marcus's third move exposes the philosophical divide: should we care about the final decision (promote yes/no) or the qualification components? Both are legitimate perspectives.
  - Deb's fourth argument lands well - reducing everything to thumbs up/down would indeed make the multi-axis rubric pointless. This suggests the by-axis method better serves the rubric's purpose.

  The deeper issue might be about what "majority" means in multidimensional decisions. When criteria are interdependent (like here where both Impact AND Depth are required), perhaps we need to distinguish between:
  1. Majority belief in each premise
  2. Majority belief in the conclusion
  The conflict arises because these don't always align, as Jordan's case shows.

  I notice the user seems troubled by the outcome where 2/3 voters opposed promotion but it was granted. There's an unspoken concern about fairness and voter legitimacy here. The real question might be: does our process seek to capture voters' holistic judgments (favoring Marcus's view) or implement rule-based qualification checking (favoring Deb's)?

  The scoring reflects that both have valid points but Deb's arguments better preserve the rubric's integrity. Still, this exposes a flaw in the system - the rules don't specify which tallying method takes precedence when they conflict. That's the true missing piece the user should address.
answer: |-
  Here's the analysis of each move and the underlying systemic issue:

  ### Move Verdicts & Reasoning
  ```json
  {
    "1": 1,
    "2": 2,
    "3": -1,
    "4": 2
  }
  ```

  1. **Marcus (Score: 1)**  
     *Reasoning:* Marcus correctly identifies a flaw in the by-axis method: it constructs a "composite yes" no single voter endorsed. This highlights a genuine risk of manufacturing consensus. However, his argument ignores that rubrics exist precisely to *prevent* holistic voting from overriding defined standards. Partial credit applies.

  2. **Deb (Score: 2)**  
     *Reasoning:* Deb is unequivocally right. The rubric’s purpose is to enforce objective standards, not aggregate subjective "vibes." If 2/3 confirm each axis independently (per the rules), the conclusion is mathematically and procedurally sound. Rejecting this undermines structured evaluation.

  3. **Marcus (Score: -1)**  
     *Reasoning:* Marcus conflates *opinions* with *rules*. The question isn’t "what do reviewers feel?" but "does Jordan meet the defined criteria?" His view would make the rubric advisory, not binding. If two "no" voters each reject *different* axes, it doesn’t prove Jordan fails both—it proves disagreement on *why* they fail.

  4. **Deb (Score: 2)**  
     *Reasoning:* Deb exposes the critical flaw in Marcus’s position. If final votes override axis-level majorities, the rubric is indeed decorative. Why spend hours debating axes if holistic judgment trumps them? Her point defends procedural integrity over subjective preference.

  ### The Bigger Issue: Ambiguous Decision Rules
  Both miss that **the conflict stems from undefined aggregation logic**. The rubric specifies *what* criteria matter but not *how* to resolve split judgments. This creates two equally valid paths:
  - **Method A (Holistic):** "Each voter decides if all criteria are met → majority wins."  
  - **Method B (By-Axis):** "Majority rules per criterion → apply promotion rule to outcomes."  

  **Why this matters:**  
  - Method A prioritizes human judgment but risks inconsistent application (e.g., two "no" voters could reject the candidate for contradictory reasons, as here).  
  - Method B prioritizes objectivity but may promote candidates lacking full consensus support.  

  **Solution:** The company must codify **which aggregation method governs**. If Technical Depth/Impact are truly independent (Deb’s view), Method B is superior. If they’re interdependent (Marcus’s view), Method A makes sense. Without this clarity, calibration becomes theater.  

  ### Practical Recommendation
  - **Revise the rubric** to specify: "Promotion requires majority consensus per axis, not per voter."  
  - **Add tiebreakers:** e.g., "If axis-level majorities exist but final vote fails, escalate to director review."  
  - **Train reviewers:** Emphasize that axes are non-negotiable checkpoints, not input to a popularity contest.  

  Jordan’s case isn’t about who’s "right"—it’s about fixing a system that allows two contradictory truths to coexist. Define the rules, or this will recur. 🔄
