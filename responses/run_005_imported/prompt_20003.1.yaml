  - Marcus is right that labeling it "bias" presupposes morality-free baselines—a legit philosophical worry. But his "deep self" retreat undermines his initial constitutive claim. 
  - Their tension? Absolutely. Marcus can't simultaneously argue morality defines intentionality AND that the effect stems from neutral character inferences. That's having your cake and eating it too. 

  Alternative explanations... Let me think beyond their duel. Maybe the "skill/luck" asymmetry (harm seems agent-driven, help seems circumstantial)? Or Knobe's own "conversational pragmatics" idea—people emphasize intentionality differently based on what's conversationally relevant? Those could bridge their positions. 

  User's last question about "better diagnosis" is golden. I should offer something fresh like the "counterfactual robustness" theory (would the harm still occur under minor changes? Yes → intentional. Help? No → unintentional). That’s elegant and less moralized. 

