  Notably, the physicist wants explicit engagement with whether du Châtelet's self-directed "illusion" applies here. The key distinction is that dementia removes the ability to participate in what du Châtelet called "examining beliefs," so the ethical burden shifts to caregivers to simulate what the patient might choose for herself. The draft should frame this as preserving residual autonomy rather than overriding it.
