  Le Guin's influence means the resolution should feel unresolved - hence Voss choosing the five but still hearing the "silver disc spinning" in her mind. The last image of the coin in her pocket mirrors Omelas' lingering discomfort. Word count landed at 1120 - tight but room for atmospheric details like the humming lights and dust patterns to ground the philosophy in sensory experience.

