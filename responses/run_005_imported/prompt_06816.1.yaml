answer: |-
  The emergency channel buzzed, a harsh insectile whine in the sterile quiet of Lunar Outpost *Pioneer*’s command module. Commander Elara Voss, her face etched with the fatigue of three consecutive shifts, snapped to attention. On the primary display, two distress signals pulsed – crimson flares against the star-dusted blackness of the Mare Crisium.

  The first was from Survey Team *Kappa*: five geologists, their pressurized rover crippled by a sudden rockfall during core sampling in Tycho’s Shadow. Life support failing, estimated time to critical: 45 minutes. The second signal, fainter, came from Maintenance Duo *Sigma*: two engineers, trapped by a catastrophic seal failure while repairing a malfunctioning atmospheric processor in the abandoned Sector 7 hab. Estimated time to critical: 50 minutes.

  Elara’s breath hitched. *Pioneer* had one operational lunar hopper prepped and fueled. One run. One chance. The hopper could carry six, maximum. Saving both groups was physically impossible. The distances and the unforgiving lunar timetable made shuttling between them a death sentence for the second group.

  Her first thought was instinctive, visceral: *Five lives. Save five.* The logic felt like bedrock. More people breathing, more families spared grief, more value preserved. The math was clear, undeniable. She reached for the comm to authorize the hopper for *Kappa*.

  Her hand froze halfway.

  A memory surfaced, sharp and unwelcome. A graduate seminar, years ago, Earthside. Taurek’s paper, debated late into the night over stale coffee. The unsettling core of it: *There is no single consciousness that experiences the sum of five deaths.* Each death is its own universe of loss, experienced only by the individual extinguished. Can you truly add universes? Is the *wrongness* of five deaths inherently greater than the wrongness of one? Or is it just… more frequent?

  Elara stared at the pulsing signals. Five names on one screen – Chen, Rostova, Singh, Adebayo, Petrov. Two names on the other – Hayes, Mendoza. Strangers to her personally, all equally deserving. No children, no irreplaceable experts, no debts owed. Just… people. Trapped. The only difference was the number huddled in their respective tombs of rock and metal.

  The utilitarian imperative – *save the many* – still pulled like gravity. Yet Taurek’s ghost whispered: *Why is your duty greater to Chen than to Hayes? Because Chen happens to be stranded with four others? Does proximity multiply moral claim?*

  A cold sweat prickled her scalp. The command module felt suddenly cavernous, the hum of life support deafening. The sheer *strangeness* of it struck her. Here she sat, holding the fates of seven lives, and the only distinguishing factor was a number. And that number, according to an argument she’d once dismissed as academic sophistry, might be morally… irrelevant?

  The fair thing, Taurek had argued, was equal chance. Don’t let the accident of grouping decide. Give each *individual* an equal shot.

  Her gaze fell on a small, antique silver dollar embedded in a lucite paperweight on her console, a gift from her grandfather. A randomizer. Impartial. Brutal.

  *Could I?* The thought was vertiginous. *Flip a coin? Heads, send the hopper to the five. Tails, send it to the two?*

  The image filled her mind: the coin spinning in the low lunar gravity, catching the sterile light. Hayes and Mendoza, praying for tails. Chen and the others, praying for heads. Or perhaps, just praying.

  It felt monstrously irresponsible. Letting pure chance decide who lived? When she could *act*, could save five definite lives? The waste! The sheer, avoidable loss of three extra souls!

  But the counter-image was equally potent: Sending the hopper to *Kappa*. Hayes and Mendoza, watching their oxygen tick down on their suit displays, knowing a vehicle *could* have reached them, knowing they were left to die *simply because they were fewer*. Not because they were less worthy, less loved, less needed… but because of arithmetic. Would their deaths be *less* of a loss than if they were part of a larger group? Would the universe feel it less? Taurek insisted: no. Each death was absolute.

  Elara picked up the lucite paperweight. The silver dollar glinted. It felt cold, heavy with implication. Her thumb traced its edge. The chronometer on the main display ticked relentlessly: 38 minutes estimated for *Kappa*.

  The pressure was immense. Protocol, instinct, the weight of responsibility – all screamed *save the five*. It was efficient. It was expected. It was… easier to justify to the brass, to the families, to her own conscience later. *I saved who I could. I saved more.*

  But the quieter, more insidious voice persisted: *Is efficiency justice? Is expectation morality? Are you saving five because it’s right, or because the alternative feels absurdly, terrifyingly arbitrary?*

  She closed her eyes. She saw Hayes, an engineer known for his meticulous logs and dry wit. She saw Mendoza, who’d just sent a message about her daughter’s graduation pictures. She saw Chen’s team laughing over a shared meal in the mess hall yesterday. Seven universes of hope, fear, love, and unfinished business.

  Giving them an equal chance… it wasn’t dismissing their value. It was acknowledging that their value couldn’t be summed against each other. It was refusing to let the geometry of disaster dictate who was more worthy of rescue. It was fairness stripped bare.

  But fairness felt like a luxury she couldn’t afford. The hopper pilot was waiting, tense, on the comm channel. "Commander? Orders?"

  Elara opened her eyes. The silver dollar stared back, a cold, silent judge. The pull of the five was a physical force. The logic of the many was a fortress. Yet the unsettling clarity of Taurek’s challenge had cracked its walls. The numbers didn’t settle it. Not cleanly. Not morally.

  She took a deep, shuddering breath. The coin stayed in the lucite. Her duty, in this terrible moment, felt less like calculation and more like… stewardship. Stewardship of lives she couldn’t aggregate, only acknowledge individually, even as she couldn't save them all.

  "Hopper One," Elara said, her voice surprisingly steady, cutting through the static. "Launch authorization granted. Proceed immediately to Survey Team *Kappa*’s coordinates in Tycho’s Shadow. Five souls. Maximum haste." She paused, the image of Hayes and Mendoza vivid behind her eyes. "Godspeed."

  "Acknowledged, Commander. Launching now."

  The screen showed the hopper’s icon streaking towards the larger group. The decision was made. The greater number would be saved. Yet, as the hopper cleared the docking bay, Elara’s hand drifted back to the lucite paperweight. Her fingers closed around it, not to flip, but to hold. The cold metal seemed to pulse against her palm. She didn't feel the clean relief of a utilitarian choice. She felt the profound, echoing weight of the two universes extinguished in Sector 7, not because they were worth *less*, but because they were… fewer. And the ghostly spin of an untossed coin hung in the air of the command module, a silent testament to the unsettling arithmetic of loss that no sum could ever truly resolve. The silver disc, heavy in her pocket now, felt less like a relic and more like a question mark etched in metal, pressing against her thigh with every beat of her heart.
