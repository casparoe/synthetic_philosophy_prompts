answer: |-
  You're hitting on a really important nuance in Fricker's work, and your question shows a careful understanding. **No, you are not necessarily misusing the term.** Fricker's concept of testimonial injustice *does not require conscious, malicious sexism on the part of the individual hearer (your doctor).** Your experience aligns powerfully with her core argument.

  Here's why:

  1.  **The Crux is Prejudice in Credibility Judgment:** Testimonial injustice occurs when a hearer assigns *less credibility to a speaker than they deserve, specifically because of a negative identity prejudice* (like sexism, racism, etc.). The key element is the *prejudice distorting the credibility judgment*, **not** the hearer's conscious awareness or ill intent.
  2.  **Unconscious/Implicit Bias is Central:** Fricker explicitly addresses that the prejudice operating in testimonial injustice is often *unconscious* or *implicit*. It's about deeply ingrained societal stereotypes influencing perception and judgment below the level of conscious thought. Your doctor genuinely believing he's being fair and objective, while still being influenced by pervasive stereotypes about women's pain ("hysterical," "exaggerating," "it's just their periods," "it's stress"), is **precisely** the kind of scenario Fricker describes. He doesn't need to *think* "I think less of her because she's a woman"; the prejudice operates through systemic biases he's absorbed.
  3.  **Systemic Nature of the Prejudice:** The prejudice Fricker talks about isn't necessarily personal animosity. It's often a *systemic* prejudice embedded in social structures and practices. Medicine has a long, documented history of systemic sexism, particularly regarding women's pain (especially gynecological pain) and mental health. Doctors operating within this system, even well-intentioned ones, can inadvertently enact this systemic prejudice by:
      *   Dismissing reports of pain severity.
      *   Attributing symptoms to psychological causes more readily for women.
      *   Taking longer to investigate or diagnose serious conditions in women.
      *   Assuming "normal" female suffering (like "bad periods").
  4.  **Impact vs. Intent:** Testimonial injustice focuses on the *harm done to the speaker* – the injustice of not being believed *because of who you are* – not primarily on the *intent* of the hearer. Your suffering being dismissed and your diagnosis delayed for years *because you are a woman* experiencing pelvic pain constitutes the harm, regardless of whether your doctor consciously intended to harm you or thought he was biased.
  5.  **The "Sweet Guy" Paradox:** This is incredibly common. People can be personally kind, polite, and well-meaning while still operating under the influence of powerful systemic prejudices that distort their professional judgments. His personal demeanor doesn't negate the possibility that his *credibility assessments* of you as a female patient reporting pain were negatively influenced by unconscious gender bias. He might be a mediocre diagnostician *specifically in this domain* because of these ingrained biases affecting how he hears and weighs female patients' testimony.

  **Why "Testimonial Injustice" Fits Your Case:**

  *   **Identity Prejudice:** You belong to a social group (women) historically subject to negative stereotypes about pain tolerance, emotionality, and the validity of their bodily experiences (especially gynecological ones).
  *   **Credibility Deficit:** Your testimony about your pain and symptoms was systematically discounted or given less weight than it deserved *over years*.
  *   **Harm:** This deficit caused you a *primary harm* (delayed diagnosis and treatment, prolonged suffering) and a *secondary harm* (being made to feel your own experience wasn't credible, potentially damaging your self-trust).
  *   **Source of Deficit:** The deficit stemmed *at least in part* from the pervasive societal prejudice that women's reports of pain, especially pelvic pain, are unreliable, exaggerated, or purely psychological/emotional. This is a systemic bias your doctor, however "sweet," was operating within.

  **It's not "just a mistake":** While misdiagnosis happens, the *persistent pattern* of dismissal over 6 years, the *specific nature of the dismissals* ("bad periods," "stress" – classic tropes used disproportionately against women), and the *well-documented systemic context* of gender bias in pain management and endometriosis diagnosis strongly suggest this wasn't random error. It points to your credibility being discounted due to identity prejudice.

  **In short:** Your understanding of testimonial injustice being validating is spot-on. Fricker's framework brilliantly captures the experience of being disbelieved not because of anything *you* did, but because of unconscious systemic prejudice affecting how your words are heard due to your social identity. Your doctor not being overtly sexist doesn't negate this; it actually highlights how pernicious and invisible these biases can be. Using the term "testimonial injustice" accurately describes the structural nature of the wrong you experienced. It *was* an injustice in Fricker's sense.
