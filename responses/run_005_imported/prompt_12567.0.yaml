prompt: |-
  I'm prepping a handout for my jurisprudence seminar, and I'd rather give the students a dialogue than another dry summary of Hart vs. Fuller. Could you write one between a committed Hartian positivist and an equally committed Fullerian natural lawyer, arguing specifically about the grudge informer case -- the German woman who denounced her husband to the Nazi authorities (1944, I think) over some crack he made about Hitler while home on leave, which got him sentenced to death under a wartime statute (commuted, if I remember right, to service at the front instead). After the war a German court wants to convict her for it, and my two characters disagree about how that conviction can be justified. The positivist should hold that the Nazi statute really was valid law at the time, however monstrous, so punishing her honestly requires a frankly retroactive criminal statute -- better to own the retroactivity than pretend the old statute was void from the start. The natural lawyer should hold that the statute never had the status of law to begin with, since it fell so far short of things like generality, publicity and prospectivity, so the court can rightly treat her as having had no legal cover for what she did.

  Dont let either of them just restate their opening position -- I want real back and forth, where they're actually pressing on eachother's weakest points instead of talking past one another. I have some vague memory of Hart comparing Fuller's "inner morality of law" to the efficiency a competent poisoner needs -- am I misremembering that, or is it a real objection? If it's real, work it in somewhere and give the natural lawyer an actual comeback instead of a shrug; if I've mangled it, just have the positivist reach for whatever the closest genuine version of that objection is. A couple of my students already want to shrug the whole debate off with "well, both sides clearly have a point, so it's basically a wash" -- I want the dialogue to leave the disagreement fully live, sharp enough that that shrug feels too easy.
