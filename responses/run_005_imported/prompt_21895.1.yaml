answer: |-
  ## Kilnside Metaphysics

  **Setting:** The pottery studio, mid-morning. Warmth radiates from the recently unloaded kiln. Shelves hold bisque-fired pieces – mugs, bowls, vases – in warm, chalky white. **MAYA** (early 30s, meticulous, still wearing her kiln gloves) carefully places a slightly warped but intact bowl on a shelf. **LEO** (late 20s, paint-splattered apron over band t-shirt, holding a mug) stares intently at a mug that emerged with a hairline crack running from rim to base.

  **LEO:** (Tracing the crack with a finger) There it is. Proof positive. The mug didn't survive the firing. Kaput. Gone. Mourn the vessel.

  **MAYA:** (Without looking up) Don't be melodramatic, Leo. The *clay* survived just fine. It's right there in your hands. A little cracked, sure, but fundamentally unchanged. Still silica, alumina, flux. Still bisqueware.

  **LEO:** Unchanged? Maya, look at it! It *was* a mug. Now it’s… a cracked lump. The *mug* is destroyed. The thing I spent hours throwing, trimming, dreaming about holding coffee… it’s ceased to be. What you’re holding is just the corpse. The *clay* persists, but the *mug* does not. They were always different things sharing space.

  **MAYA:** (Turns, finally focusing on Leo and the mug) Different things? How? When? Was there a moment throwing it on the wheel where suddenly a brand new 'mug-object' popped into existence, coinciding perfectly with the spinning clay? Did it wink into being when I attached the handle? Or only after the final smoothing? That sounds… arbitrary. Mystical, even.

  **LEO:** It’s not about a magical moment! It’s about *what it is*. The mug had *different properties*, crucially different *modal* properties, from the lump of clay that constituted it *even when they occupied the same space*. That lump of clay, before you shaped it, could have been rolled into a ball, flattened into a tile, or never touched at all. It could have been a bowl instead! *This specific mug*, however, could *only* have been *this* mug. It couldn't have been a bowl. Leibniz's Law! Different properties, different objects.

  **MAYA:** (Takes off one glove, leans against the kiln) Ah, Leibniz. So you *do* think there were two distinct things sitting on my wheel yesterday? The lump-of-clay-object *and* the mug-object, miraculously sharing all their physical properties atom-for-atom? Okay, fine. But *what grounds* that modal difference, Leo? What *makes* it true that the lump could have been a ball but the mug couldn't? Where does that extra 'mug-ness' property reside? It’s not in the physical structure – before firing, the mug-shaped clay *could* physically be reworked into a ball. The teacher literally said we can soak greenware back into slurry! So if the physical stuff doesn’t carry that modal rigidity, what does? Some ghostly 'essence' hovering around? That’s the grounding problem, and it makes your coincident objects seem like spooky doubles.

  **LEO:** (Frustrated, gestures with the cracked mug) It’s grounded in *function*, in *intention*, in *form*! The lump is just stuff. The mug is stuff *arranged mug-wise for a purpose*. That arrangement, that functional essence, is real! That’s why the mug couldn’t survive being crushed back into a lump, even though the clay could. And look! (He points at the crack) The mug *didn't* survive a lesser insult! The clay did. Different persistence conditions. Proof they weren't identical.

  **MAYA:** But *when* did that 'functional essence' latch on? That's the Sorites paradox for constitution! Was it when I first centered the clay? When the cylinder was 3 inches high? 4? When the rim was even? When I *thought* "this is a mug"? If there's no precise moment the mug-object comes into being, maybe it *never* did. Maybe it’s just the clay, arranged pot-wise, and we *call* it a mug. And when it cracks, we stop calling it a mug. The clay persists, slightly rearranged. No need for a second object that mysteriously perishes. The persistence condition is simple: the clay persists as long as its fundamental material composition persists – which it did, through shaping, drying, even firing. It changed state, like water to ice, but it's still H2O... or in this case, still clay-minerals-turned-metakaolin.

  **LEO:** Water to ice is a phase change of the *same substance*. But unfired clay *isn't* the same substance as bisqueware! The teacher said it: chemically different. Hydrated vs. dehydrated, crystalline structure altered. That’s a real change. But even *before* that change, the modal difference was there! The *greenware* mug couldn't have been a greenware bowl – that’s a different form, a different artifact. The lump could have been either. So even pre-fire, they had different modal profiles. You can't soak a *mug* back into slurry; you soak the *clay* that was arranged mug-wise. The mug-form is lost when you do that.

  **MAYA:** Lost, yes. Destroyed, certainly. But destroyed *as an arrangement*, not as a distinct object vanishing. You're confusing the destruction of a *configuration* with the destruction of an *object*. The only object here is the clay-stuff. Its configuration changed from amorphous lump to mug-shape (good!) and now to cracked-mug-shape (bad!). The firing locked that last configuration in chemically, so we can't revert it. But the underlying stuff? It persisted through all those changes. Calling the pre-cracked configuration a whole new *object* just because it has different possibilities… it feels like multiplying entities beyond necessity. Occam’s razor, Leo. Why posit two things when one will do?

  **LEO:** (Looks down at the cracked mug, then at the intact bowl Maya placed) Because one thing *doesn't* do. It doesn't capture why I care about *this* mug cracking and not just any lump of clay breaking. It doesn't capture why its *being a mug* mattered, why its destruction feels like a loss of something *more* than just rearranged dirt. That 'more' is the artifact itself – a distinct entity born from intention and form, coincident with but not identical to its matter, vulnerable in ways its matter isn't. (He sighs, placing the cracked mug gently on the 'seconds' shelf) Your view is cleaner, Maya. But mine… mine feels true to the making, and to the breaking. That cracked thing *was* my mug. Now it’s not. And the clay that’s left… it’s just a reminder.

  **MAYA:** (Looks at the cracked mug, then at Leo, a touch softer) I understand the feeling, Leo. Truly. The care, the intention, the loss… that’s real. I just think we mourn the lost *form*, the lost *possibility*, the lost *work*. Not the passing of some shadow-object that was always hiding inside the clay. (She picks up another warm bowl) This bowl survived. Same clay-stuff, different fate. Still just the clay, arranged bowl-wise… for now. Let’s get these glazed before we argue about whether *that* creates a third object.

  **LEO:** (Manages a small smile) Deal. But I’m watching that bowl. If it cracks in the glaze fire… I’ll be mourning the *bowl*, not the bisqueware.

  *(They both turn back to the kiln shelves, the warm, chalky forms holding the weight of the unsolved paradox between them.)*
