  Let me recall Thomson's lamp paradox first. It's a thought experiment where a lamp is switched infinitely many times within a finite time interval (one minute), with each flip taking half the remaining time. The question is whether the lamp is on or off at the end of the minute. This is a classic supertask paradox.

