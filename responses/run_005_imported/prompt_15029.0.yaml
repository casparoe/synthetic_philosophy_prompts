answer: |-
  You've hit on a profound tension in Lewis's theory that's absolutely worth building your talk around. Your student is *partially* right about arbitrariness being a lever, but the core insight from Lewis is that **arbitrariness alone is insufficient for rapid change because conventions are *sticky* due to the very coordination problems they solve.** The reformer's challenge is overcoming this stickiness by strategically manipulating Lewis's elements (common knowledge, salience, precedent). Here's how to ground "arbitrariness as leverage" in Lewis's apparatus:

  1.  **The Core Problem: Coordination Costs & Risk of Failure**
      *   Lewis's key point: Conventions persist because they solve coordination problems *cheaply and reliably*. Everyone knows what to expect, reducing transaction costs and uncertainty.
      *   **Defecting Alone is Costly:** If only *some* people switch to the alternative regularity (e.g., driving on the other side, rejecting a gender norm), coordination fails disastrously (head-on collisions, social ostracism). The *risk* of being one of the few defectors keeps people complying, even knowing it's arbitrary.
      *   **Common Knowledge of Arbitrariness ≠ Common Knowledge of Willingness to Change:** Knowing the norm is arbitrary doesn't automatically create common knowledge that *enough others are ready and willing to defect simultaneously* to the *same alternative*. This uncertainty is paralyzing.

  2.  **Arbitrariness as Leverage: The Reformers' Strategic Opening**
      *   **Exposing the "Mere" Arbitrariness:** This is crucial consciousness-raising. It does several things:
          *   **Undermines Legitimacy:** It counters arguments that the convention is "natural," "rational," or "morally necessary." It frames it as a historical accident.
          *   **Creates Common Knowledge of Alternatives:** It establishes that *R'* (the alternative regularity) is a *genuine* solution to the underlying coordination problem (e.g., safe driving, social interaction, division of labor). This is step one.
          *   **Reduces Perceived Cost of Change (Potentially):** It suggests that switching *could* be costless *if coordinated*.
      *   **The Goal:** Shift the population from being in a coordination equilibrium around *R* (the old convention) to being in a coordination equilibrium around *R'* (the new convention).

  3.  **Strategies for Effective Change Using Lewis's Tools:**
      *   **Creating Salience for *R'*:** This is paramount. Arbitrariness makes *R'* possible, but salience makes it *focal*. Reformers need to make *R'* the obvious, attention-grabbing alternative.
          *   **Policy Example (Driving):** A government mandate with a clear date ("On January 1st, we switch to driving on the left!") creates massive, undeniable salience. Public campaigns, new road signs, etc., reinforce it. *This works because the state acts as a powerful coordination device.*
          *   **Social Norm Example (Gender):** Mass demonstrations, high-profile defections (celebrities, leaders adopting *R'*), media campaigns showcasing *R'* in action, creating new institutions/rules based on *R'* (e.g., gender-neutral bathrooms, parental leave policies). These make *R'* visible and signal its viability.
      *   **Generating Common Knowledge of Preference for *R'* and Willingness to Defect:**
          *   **Public Commitments:** Getting visible actors to publicly commit to *R'* and encourage others. This signals preference and builds common knowledge that others share it. (e.g., "I pledge to challenge traditional gender roles in hiring" campaigns).
          *   **Creating Precedent for *R'*:** Demonstrating *R'* working successfully in specific, visible sub-contexts. This proves its viability and reduces perceived risk. (e.g., successful companies with gender-balanced leadership, communities adopting new interaction norms).
          *   **Highlighting Coordination Points:** Explicitly identifying moments where coordinated defection is easier or symbolic (e.g., "On International Women's Day, let's all challenge one workplace norm," or "Join the mass bike ride on the new designated left-hand lane").
      *   **Reducing the Cost of Defection & Increasing the Cost of Compliance:**
          *   **Building Critical Mass:** Focused efforts to get a subgroup (a community, an industry, a city) to adopt *R'* together. This creates safe havens where defection isn't costly and provides proof of concept.
          *   **Sanctioning Non-Compliance with *R'* (Carefully):** Once *R'* gains traction, social sanctions can shift to support it (e.g., criticizing sexist remarks, not laughing at non-conforming behavior). *Crucially, this only works once a critical mass is moving, otherwise it backfires.*
          *   **Leveraging "Moments of Disruption":** Times when the *existing* convention is already weakened or coordination is naturally disrupted (e.g., post-conflict, technological change, mass migration, economic shifts) lower the barrier to establishing a new precedent/salience.

  4.  **Why Arbitrariness Isn't Enough & Why Some Norms Are Stickier:**
      *   **Nested Conventions & Sanctions:** Conventions like gender norms aren't *just* solutions to one coordination problem. They're deeply nested within complex systems of other conventions, expectations, identities, and *sanctions*. Defection often triggers punishment (social, economic) that has little to do with the original coordination problem. Exposing arbitrariness doesn't automatically remove these sanctions. Reformers need to tackle these nested layers too.
      *   **"Better" is Often Contested:** Lewis assumes *R* and *R'* are roughly equal solutions *for the specific coordination problem*. But in social norms, *R'* (e.g., gender equality) often challenges power structures and vested interests. Those benefiting from *R* will actively defend it, not just due to coordination inertia, but because *R'* genuinely *isn't* an equally good solution *for them*. Reformers need to address this asymmetry.
      *   **Identity & Habitus:** Conventions become ingrained in identity and habit. Moving away from *R* can feel like a personal loss or require constant conscious effort, even without sanctions. Arbitrariness doesn't dissolve this embodied aspect easily.
      *   **Cost of Coordination:** Organizing mass, synchronized defection is logistically difficult and resource-intensive. Consciousness-raising doesn't pay for the campaign or build the new infrastructure needed for *R'*.

  **Conclusion & Talk Section Core: "Arbitrariness as Leverage, Not a Silver Bullet"**

  *   **Yes, arbitrariness is the reformers' crucial entry point.** It undermines the norm's inevitability and establishes the possibility of *R'*. Consciousness-raising is essential step one – creating common knowledge of the arbitrariness *and* the viability of alternatives.
  *   **But arbitrariness alone doesn't dissolve the coordination problem.** The core challenge is overcoming the *stickiness* of the existing convention due to:
      *   The risk/cost of unilateral defection.
      *   The lack of common knowledge about others' willingness to defect.
      *   The lack of salience for *R'* as the *new* focal point.
      *   Nested sanctions, power dynamics, identity, and habit.
  *   **Effective Strategy:** Reformers must use the exposure of arbitrariness as a foundation to **actively construct the conditions for a new coordination equilibrium around *R'*.** This requires:
      1.  **Making *R'* Salient:** Through mandates (where possible), mass action, media, visible precedents.
      2.  **Generating Common Knowledge of Commitment to *R'*:** Public pledges, signaling mechanisms, building critical mass in subgroups.
      3.  **Reducing Coordination Costs/Increasing Defection Safety:** Leveraging disruption points, creating safe spaces for *R'*, providing resources/templates for defection.
      4.  **Addressing Nested Sanctions & Power:** Explicitly challenging supporting structures and vested interests benefiting from *R*.

  **For your talk:** Frame "arbitrariness as leverage" not as a guarantee of quick unraveling, but as the *necessary first move that unlocks the possibility for strategic action using Lewis's own tools*. The reformer's job isn't *just* pointing out the arbitrariness; it's *engineering the switch* by making the alternative salient, proving its viability, and coordinating the defection. Use the driving side switch (a "pure" coordination norm) as a clear example of how state power can create instant salience and mandate coordination. Contrast this with gender norms to show the added layers of sanctions, power, and identity that make the coordination problem vastly more complex, requiring a multi-pronged strategy beyond mere consciousness-raising, but *starting* from the foundational insight of arbitrariness. This grounds your policy relevance in robust theory. Good luck!
