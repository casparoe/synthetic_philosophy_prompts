  ---

  **MEMORANDUM**

  To: Full Council of the [Scientific Society Name]  
  From: Governance Committee  
  Date: [Current Date]  
  Subject: Recommendation for Presidential Election Method Reform  

  ### Introduction
  After careful consideration, the Governance Committee recommends changing the method for electing the Society's President from the current plurality system to **Approval Voting**. This recommendation follows two instances in the past decade where the plurality system resulted in a candidate winning despite being ranked last or second-to-last by a majority of voters, due to vote splitting among like-minded candidates. We propose a timeline for implementation beginning immediately, with the goal of using approval voting in the next presidential election.

  ### The Problem with Plurality Voting
  Plurality voting in multi-candidate races often leads to the "spoiler effect," where similar candidates split the vote, allowing a less-preferred candidate to win. This violates the principle that the winner should have broad support.

  ### The Case for Approval Voting
  Approval voting is a simple system: each voter may vote for ("approve") as many candidates as they wish. The candidate with the most approval votes wins. It has several advantages:
  1. **Simplicity and Familiarity**: Voters only have to mark candidates they approve of, much like the current system but without the limitation of one vote. It is easier to understand and implement than ranked-choice voting (RCV).
  2. **Mitigates Vote Splitting**: By allowing multiple approvals, voters can support all acceptable candidates without fear of splitting the vote. This encourages candidates to build broad coalitions.
  3. **Resistance to Strategic Voting**: While no voting system is immune to strategic voting (as noted by the Gibbard-Satterthwaite theorem), approval voting is among the least manipulable in practice. Voters are incentivized to vote honestly for all candidates they consider acceptable because there is no penalty for doing so. Strategic voting in approval voting typically takes the form of "threshold voting" (approving only candidates above a certain threshold of support), but this is less likely to change outcomes than the strategic voting in plurality or RCV.

  ### Addressing the Gibbard-Satterthwaite Theorem
  We acknowledge the theorem's insight: any non-dictatorial voting system with three or more candidates is vulnerable to strategic voting in some scenarios. However, the theorem does not imply that all systems are equally manipulable. Approval voting has been shown to have low rates of manipulation in practice because:
  - The optimal strategy (voting for every candidate above a certain level of approval) is intuitive and often aligns with honest voting.
  - Empirical evidence from organizations using approval voting (e.g., the Mathematical Association of America) shows that it produces consensus winners and reduces negative campaigning.

  Moreover, the current plurality system is highly manipulable (as we have seen) and RCV, while an improvement, has its own vulnerabilities (such as non-monotonicity and complexity). Approval voting provides a robust and practical alternative.

  ### Implementation Timeline
  We propose the following timeline:
  1. **Council Approval (Next Month)**: The council will vote on this recommendation. If approved, we will draft the necessary bylaw amendments.
  2. **Membership Vote (If Required, Within 3 Months)**: If the bylaws require a membership vote, we will conduct one promptly.
  3. **Education and Preparation (6 Months)**: Upon approval, we will:
     - Develop educational materials (including sample ballots and online tutorials).
     - Update the voting system and ballots.
     - Conduct mock elections to familiarize members.
  4. **First Election (Next Presidential Election)**: Use approval voting in the next election.
  5. **Review (After First Election)**: The Governance Committee will review the system's performance and report to the council.

  ### Conclusion
  The Governance Committee believes that approval voting offers the best balance of simplicity, fairness, and resistance to strategic voting. We urge the council to approve this change to ensure that the Society's presidential elections reflect the broad support of the membership.

  Respectfully submitted,  
  [Your Name], on behalf of the Governance Committee
answer: |-
  **MEMORANDUM**  
  To: Full Council of the Scientific Society  
  From: Governance Committee  
  Date: [Current Date]  
  Subject: Recommendation for Presidential Election Reform and Implementation Plan  

  ### Introduction  
  After extensive review of our presidential election process—including two instances in the past decade where plurality voting resulted in winners ranked last or second-to-last by a majority of members—the Governance Committee recommends transitioning to **Approval Voting** for all future elections. This memo outlines the rationale for this method, addresses the manipulability objection grounded in social choice theory, and proposes a timeline for implementation.  

  ### The Case for Approval Voting  
  Approval Voting (AV) is straightforward: Voters may select ("approve") *any number* of candidates on the ballot. The candidate with the most approvals wins. We recommend AV over alternatives (e.g., ranked-choice voting) for three reasons:  
  1. **Simplicity and Accessibility**: AV uses a ballot nearly identical to our current system, minimizing voter confusion. Members select all candidates they find acceptable, without ranking. This lowers barriers to participation and reduces invalid ballots.  
  2. **Mitigation of Vote Splitting**: Unlike plurality, AV eliminates "spoiler effects" by allowing voters to support multiple like-minded candidates without penalty. Sympathetic votes unite behind broadly acceptable nominees, reducing the risk of polarizing winners.  
  3. **Empirical Success**: Organizations with similar demographics (e.g., the Mathematical Association of America) report higher satisfaction and legitimacy under AV. Voters find it intuitive, and it consistently elects consensus candidates.  

  ### Engaging the Manipulability Objection  
  We acknowledge the concern raised by our statistics chair: The Gibbard-Satterthwaite (GS) theorem proves *all* non-dictatorial voting systems with ≥3 candidates are vulnerable to strategic voting. However, this does not render reform futile. The key distinctions are:  
  - **Practical vs. Theoretical Vulnerability**: GS demonstrates *possible* manipulation, not its *likelihood* or *impact*. Plurality is highly manipulable in practice (e.g., voters deserting preferred candidates to avoid "wasted votes"). In contrast, AV is among the most strategy-resistant systems. Studies (Brams & Fishburn, 1983) show that honest voting is optimal in AV under most real-world conditions because voters need not predict others’ behavior to vote effectively.  
  - **Severity of Harm**: Manipulation in plurality often leads to undemocratic outcomes (e.g., winners opposed by most voters). AV’s susceptibility is milder: A voter might withhold approval from a marginally acceptable candidate to boost their favorite. Yet this seldom alters outcomes, and AV still reflects aggregate voter sentiment more robustly than plurality.  
  - **Comparisons to Ranked-Choice Voting (RCV)**: RCV (Instant Runoff) is also GS-vulnerable—e.g., voters may misrank candidates to manipulate elimination order. Worse, RCV’s complexity can confuse voters (e.g., exhausted ballots) and obscure transparency. AV offers comparable fairness with greater simplicity and lower risk of unintended consequences.  

  ### Why Not Ranked-Choice?  
  While RCV addresses vote-splitting, its complexity poses risks:  
  - Voter errors increase with ballot exhaustion (e.g., incomplete rankings invalidating votes).  
  - Non-monotonicity anomalies (where ranking a candidate higher causes their defeat) may undermine legitimacy.  
  - Implementation would require costly voter education and software updates.  
  AV achieves similar goals with fewer liabilities.  

  ### Implementation Timeline  
  To ensure a smooth transition:  
  1. **Month 1 (Council Approval)**: Amend bylaws to adopt AV.  
  2. **Months 2–4**: Develop voter education materials (e.g., webinars, mock elections) and update ballot design/voting infrastructure.  
  3. **Month 5**: Pilot AV in a low-stakes election (e.g., committee seats) to test systems.  
  4. **Month 6**: Full deployment for the next presidential election.  
  5. **Post-Election Review**: Solicit member feedback and commission an independent analysis of strategic behavior.  

  ### Conclusion  
  Approval Voting balances fairness, simplicity, and resistance to manipulation. While no system is immune to theoretical vulnerabilities, AV minimizes practical risks and aligns with our society’s need for a credible, accessible process. We urge the council to approve this reform to uphold the integrity of our leadership elections.  

  Respectfully submitted,  
  [Your Name], on behalf of the Governance Committee  

  ---  
  **References**:  
  - Brams, S. J., & Fishburn, P. C. (1983). *Approval Voting*. Birkhäuser.  
  - Gibbard, A. (1973). "Manipulation of Voting Schemes." *Econometrica*.  
  - Empirical AV case studies: Mathematical Association of America, Institute of Electrical and Electronics Engineers.
