prompt: |-
  After forty years as a field ecologist, I have spent much of my retirement reading through the social-choice-theory literature, which has become something of a second career. I sit on the governance committee of a scientific society I have belonged to since graduate school, and we are reconsidering how the society elects its president. Plurality voting among three or more nominees has twice in the past decade put a candidate into office whom most members ranked last or second-to-last, because several like-minded candidates split the sympathetic vote. One committee member, who chairs our statistics section, argues that reform is beside the point: by the Gibbard–Satterthwaite theorem, every non-dictatorial rule with three or more candidates is manipulable, so moving to ranked-choice or approval voting would add complexity without buying any real protection against tactical voting. Others want ranked-choice adopted immediately. I must bring the committee's recommendation to full council next month. Please draft that memo: recommend one specific method with a timeline for phasing it in, and engage the manipulability objection on its merits rather than dismiss it with a slogan about no system being perfect.
reasoning: |-
  We are drafting a memo to the full council of a scientific society regarding the election method for president. The current plurality system has led to winners who were ranked last or second-last by a majority due to vote splitting. The committee is divided: one member cites the Gibbard-Satterthwaite theorem to argue that any non-dictatorial system is manipulable, hence reform is pointless. Others want ranked-choice voting (RCV) immediately.

   We must:
   1. Recommend one specific method (with a timeline for phasing it in).
   2. Engage the manipulability objection on its merits.

   After consideration, I recommend Approval Voting. Here's why:

   - **Simplicity**: Approval voting is simple: voters can vote for as many candidates as they approve of. It doesn't require a ranking, so it's easier to implement and understand than RCV (which requires a ranking and multiple rounds of counting).
   - **Effectiveness in multi-candidate races**: It avoids the spoiler effect because voters can approve of multiple candidates without fear of splitting the vote. If two similar candidates run, voters can approve both, and the one with broader approval will likely win.
   - **Resistance to manipulation**: While no system is immune to manipulation (as per Gibbard-Satterthwaite), approval voting is known to be one of the least manipulable methods in practice. It is "strategy-resistant" in the sense that voters can express their true preferences without worrying about hurting their favorite candidate by also approving a second choice. Moreover, the incentive to vote tactically (by approving only a subset of the candidates one likes) is less severe than in other systems because the best strategy is often to approve all candidates above a certain threshold of acceptability.

   However, we must address the Gibbard-Satterthwaite theorem. The theorem states that for any voting system with three or more candidates that is non-dictatorial and satisfies the condition that every candidate can win (non-imposition), there will be some situations where a voter can achieve a better outcome by misrepresenting their preferences. But:

   - **Practical vs. Theoretical**: While the theorem proves the possibility of manipulation, the frequency and ease of manipulation matter. Some systems are more prone to manipulation than others. Approval voting, in particular, has been shown to be relatively strategy-resistant in practice because the optimal strategy (approving every candidate above a certain threshold) is straightforward and often aligns with honest voting.

   - **Empirical Evidence**: Studies and real-world use (e.g., in scientific societies like ours, and in organizations such as the Mathematical Association of America and the Institute of Electrical and Electronics Engineers) show that approval voting leads to outcomes that reflect the will of the electorate and reduces the incidence of negative campaigning because candidates have an incentive to appeal to a broad base.

   - **Comparison to Ranked-Choice Voting (RCV)**: RCV (also known as Instant Runoff Voting) is also a good alternative, but it has some drawbacks:
     - It can be complex to administer and explain, especially in close elections with many rounds.
     - It is vulnerable to a different kind of strategic voting (e.g., "compromising" or "burying") and can lead to non-monotonicity (where ranking a candidate higher can cause them to lose, and ranking them lower can cause them to win).
     - It requires voters to rank candidates, which might lead to exhausted ballots if voters do not rank all candidates.

   Given the society's history of vote splitting, approval voting is a simpler and more direct solution. It allows voters to express support for all candidates they find acceptable, thus mitigating the spoiler effect.

   Timeline for Phasing In:

   We propose:
   1. **Immediate Adoption for Next Election (if feasible)**: Given the urgency (two problematic elections in the last decade), we should aim to implement approval voting for the next presidential election. However, we must allow time for:
     - **Education**: A 6-month period to educate members about the new system, including sample ballots and mock elections.
     - **Bylaws Amendment**: The society's bylaws will need to be amended. We propose that the governance committee drafts the amendment and presents it at the next full council meeting (next month). Then, if approved by the council, we can have a membership vote (if required by the bylaws) within 3 months.

   2. **Pilot and Review**:
     - Use approval voting in the next election (which we assume is about 12-18 months away) and then review the results and member feedback.
     - After one election cycle, the governance committee will assess the system and report to the council.

   Therefore, the timeline is:
     - Month 1: Council meeting to approve the change (if the council has the authority) or to set a membership vote.
     - Months 2-4: If a membership vote is required, conduct it. Otherwise, proceed with implementation.
     - Months 5-10: Education campaign and preparation (update voting systems, ballots, etc.).
     - Month 12 (or whenever the next election is scheduled): First election using approval voting.
     - Month 13-14: Review and report.

