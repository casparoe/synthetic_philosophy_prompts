  First, I need to parse the passage carefully. Sidgwick mentions that each witness adds credibility, but no single piece of evidence is decisive. He emphasizes accumulating facts and experiments, avoiding debates over individual cases. Then he talks about the fraud allegation: even when all other objections are addressed, critics will still claim the investigator is fraudulent. 

  The user's main confusion is about the status of that fraud claim. Is Sidgwick accepting that it's an inevitable, unanswerable objection? Or is he setting a standard for when researchers have done enough? The user also wonders why more witnesses matter if each could be accused of fraud.

  Looking at the context, Sidgwick is addressing scientific skepticism towards paranormal claims. The fraud allegation is a common dismissal tactic. His argument seems pragmatic. He's not saying fraud is impossible but that after thorough investigation, if the only remaining objection is fraud, then the burden shifts to the critics. The mass of evidence from multiple independent sources makes the fraud hypothesis less plausible because it would require widespread conspiracy or repeated, undetected deception.

  The user might be missing that the accumulation isn't just more of the same evidence but diverse, independent corroborations. Each independent witness reduces the probability that all are fraudulent. Sidgwick's point is about shifting the burden of proof. Once the evidence is robust, the critic must provide positive evidence for fraud rather than just alleging it. 

  Also, the user's question touches on epistemology: when is an objection reasonable? Sidgwick implies that after rigorous investigation, the fraud objection without evidence becomes unreasonable. The mass of evidence makes it a weaker argument. So, it's not that fraud is impossible, but alleging it without proof isn't a valid criticism when the evidence is overwhelming.

  The user's deeper need might be understanding Sidgwick's methodological approach to controversial research. They might also be interested in how to handle skepticism in areas where evidence is disputed. Clarifying the burden of proof and the role of independent corroboration is key here.
answer: |-
  You've pinpointed the core tension in Sidgwick's argument beautifully. Sidgwick is making a **pragmatic and methodological argument about burden-shifting and the limits of reasonable skepticism**, rather than conceding that fraud is logically ineliminable. Here's a breakdown:

  1.  **The Goal: Overcoming "Scientific Incredulity"**: Sidgwick recognizes that skepticism towards paranormal phenomena is deeply entrenched ("has so many and so strong roots"). Overcoming this requires overwhelming evidence, not a single "knock-down" proof. He advocates for a mass of diverse facts and experiments ("burying it alive under a heap of facts").

  2.  **The Role of Individual Investigations & Witnesses**:
      *   Each credible witness/investigator adds a small increment of evidential weight ("his credit alone is not likely to suffice... his draft will help").
      *   The *ideal* outcome of a single investigation is to render it **internally coherent and methodologically sound to the highest possible degree** ("the highest degree of demonstrative force... is limited by the trustworthiness of the investigator").
      *   The investigator's job is done when they have systematically addressed *all plausible objections except one*: the investigator's own deliberate fraud ("We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick").

  3.  **The "Fraud Allegation" Move: Its Status and Function**:
      *   **Not a Logical Concession:** Sidgwick is *not* conceding that fraud is logically impossible to exclude. He's making a point about the *rhetorical tactics of skepticism* and the *pragmatic endpoint of investigation*.
      *   **The Inevitable Last Resort:** He observes empirically that when faced with a well-conducted investigation yielding positive results for the paranormal, the *final, desperate move* of the determined skeptic is to impugn the investigator's integrity ("when he has nothing else left to allege he will allege that").
      *   **Shifting the Burden of Proof:** This is the crucial move. Sidgwick argues that once an investigation has rigorously addressed *all other* potential flaws (poor methodology, misinterpretation, coincidence, environmental factors, unconscious bias, etc.), **the burden of proof shifts to the critic**. It is no longer reasonable for the critic to simply *assert* fraud without evidence; the allegation itself requires justification.
      *   **The Criterion for Discharged Responsibility:** Sidgwick *is* proposing a criterion for when investigators have done their epistemic duty: when their work withstands scrutiny on *all grounds except* the unprovable negative of their personal honesty. At that point, the *reasonable* weight of the evidence stands, even if the *logical possibility* of fraud remains. Pressing the fraud objection *without evidence* after this point becomes unreasonable obstinacy, not legitimate skepticism.

  4.  **Why Accumulation Helps Against the Fraud Hypothesis**:
      *   **Independent Corroboration:** The power of multiple investigators/witnesses lies in their **independence**. If Witness A reports phenomenon X under controlled conditions, and Investigator B (unknown to A, using different methods, perhaps in a different location/time) also reports X under controlled conditions, the hypothesis that *both* are fraudulent requires a *conspiracy or independent identical frauds*.
      *   **Diversity of Methods/Contexts:** Accumulating evidence from different methodologies, locations, times, and investigators makes the "fraud hypothesis" increasingly complex and implausible. It requires positing either a vast conspiracy or an improbable series of unconnected, undetected frauds by numerous individuals who otherwise appear credible.
      *   **Reducing the Plausibility of the Allegation:** While fraud is *logically possible* against the thousandth witness, its *plausibility* diminishes drastically with each independent, credible, and rigorously vetted addition. The mass of evidence makes the *specific, evidence-free allegation* of fraud against *each individual contributor* look increasingly like an *ad hoc* rescue of the skeptical position rather than a serious critique.
      *   **Cumulative Weight vs. Single Point Failure:** Sidgwick's strategy makes the case robust against the failure of any single line of evidence. If one investigator *were* later proven fraudulent, the mass of evidence from *others* remains. The fraud hypothesis must then explain *all* the corroborating evidence, not just discredit one part.

  **In summary, Sidgwick's argument is:**

  1.  **Methodological Perfection (for the individual):** Do everything possible to make a single investigation flawless. The only objection left standing *should* be the unprovable "investigator fraud."
  2.  **Burden Shifting:** At this point, the *onus* is on the critic to *substantiate* the fraud claim, not just assert it. Asserting fraud without evidence is an unreasonable last resort.
  3.  **Cumulative Overwhelm (for the field):** Build a vast body of independent, rigorous investigations. This makes the *systematic* fraud hypothesis (needed to explain *all* the evidence) incredibly implausible, shifting the burden of proof decisively onto the skeptic and making the *evidence-free* fraud allegation against individual investigators appear increasingly desperate and unreasonable.
  4.  **Pragmatic Epistemic Resting Point:** Inquiry can reasonably rest, and conviction can be justified, when the mass of evidence is such that the only counter-argument requires positing widespread, undetected fraud without evidence. This is the point where "scientific incredulity" has been buried under facts.

  Sidgwick is acutely aware of the challenges of his field. He's outlining a strategy to overcome entrenched bias by amassing evidence so overwhelming that the *only* remaining objections are themselves unreasonable without positive evidence. The fraud allegation, while always logically possible, becomes epistemically inert as a *default* objection once the mass of diverse, independent evidence reaches a critical threshold. His closing line ("But when he has nothing else left to allege he will allege that") is a wry acknowledgment of the skeptic's predictable, but ultimately weak, final gambit when faced with such a mass of evidence.
