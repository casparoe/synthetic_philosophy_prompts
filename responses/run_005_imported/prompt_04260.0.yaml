   Let's break down each argument:

  1. **Consensual and produces pleasure, no primary mischief (no harm)**: This is a core utilitarian argument. If an act is consensual and causes pleasure without harm, then by utilitarian principles it should be allowed. This is logically strong because it directly addresses the harm principle and consent. It holds up well today.

  2. **"Unnatural" just means uncommon, and rarity isn't a reason to ban**: This is a solid counter to the natural law argument. The reasoning is that the label "unnatural" is arbitrary and doesn't imply harm. This is a strong point in moral philosophy today.

  3. **Historical precedent in Greece and Rome**: This is an appeal to tradition or historical normality. However, the fact that something was accepted in the past doesn't necessarily make it morally acceptable (e.g., slavery was also common in those societies). It doesn't directly address harm or rights. So this is weaker as a standalone argument.

  4. **Disproportionate punishment (death)**: This is a strong argument about proportionality in justice. Even if one were to concede that the act is wrong, the punishment must fit the crime. This is a fundamental principle in modern legal systems and holds up.

  5. **Inconsistency with punishment for adultery (which causes more harm)**: This is an argument from consistency. If adultery (which causes identifiable harm) is punished less severely, then the law is inconsistent and thus unfair. This is a strong logical point.

  6. **Disgust ("antipathy") isn't a legitimate basis for law**: This is a very strong argument in modern liberal philosophy. Laws based solely on moral disgust or popular sentiment are seen as illegitimate without evidence of harm. This is a cornerstone of the harm principle.

  7. **Discouraging procreation is good due to overpopulation**: This is a utilitarian argument but it's contingent on the overpopulation concern. However, it doesn't address the core issue of individual rights and consent. Moreover, the overpopulation concern might be seen as speculative or not universally accepted. It also doesn't directly argue for the decriminalization on the basis of the act itself but rather an indirect benefit. This is a weaker argument because it could be used to justify other coercive measures and doesn't stand on the same moral foundation as the others.

