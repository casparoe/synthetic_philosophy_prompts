answer: |-
  ## The Duty of Water

  Silas Hartley hated drownings. Not the messy grief, though that was bad enough. He hated the *after*. The way the water, having done its swift, indifferent work, receded into ambiguity, leaving behind only questions of *what if* and *who else*. As an investigator for Oceanic Mutual Insurance, his job wasn’t justice, it was liability. Pinpointing the cause, the *proximate* cause, to see if the policy paid out, and to whom.

  The Mariner’s Cove Beach Club case seemed straightforward at 9 AM. Lifeguard, Kyle Jennings, 19, admitted falling asleep in his elevated chair. Swimmer, Arthur Finch, 68, suffered a suspected cardiac event twenty yards offshore. No shout, no whistle, no splash of rescue. By the time a sunbather noticed the unnatural stillness, it was too late.

  Silas started with Kyle. The boy was hollow-eyed, voice trembling. "I closed my eyes for a second... just the heat, the drone of the waves... I swear. Then the screaming started."

  "Your job was to watch the water, Mr. Jennings," Silas stated, neutral. "You didn't."

  "I *know*," Kyle choked out. "But... if I hadn't dozed... maybe I could've seen him go under sooner. Maybe the EMTs... but he had that heart thing, the coroner said..."

  Silas made a note: *Admits omission. Cites pre-existing condition.* Standard deflection. But the seed was planted. *If he hadn't dozed...* The counterfactual.

  The manager, Brenda Rossi, was defensive. "Kyle knew the rules! No phones, stay alert. We *trained* him. It's on him!"

  "But you were in the office, overlooking the beach?" Silas pressed.

  "Paperwork. I glanced out now and then, sure. But I'm not the lifeguard. I trusted Kyle."

  Silas wrote: *Manager present. Failed to monitor guard.* Was her omission causal too? *If she'd looked at the right moment, seen Kyle asleep...* The chain stretched.

  Then came Mrs. Gable, sunbathing near the lifeguard stand. "I saw the young man nod off. Head bobbing. I thought, 'Someone should tell the manager.' But... it was so peaceful. And not my business, really."

  *Witnessed lifeguard asleep. Failed to report.* Silas’s pen hovered. *If she’d spoken up...*

  Next, Leo Chen, swimming laps parallel to Finch. "I saw him stop. Just floating, face down. Thought he was resting, maybe doing that dead-man’s float. Didn’t look... right. But I was focused on my laps. Figured the lifeguard would handle it if it was serious."

  *Observed victim in distress. Failed to recognize/assist.* *If he’d checked...*

  The coroner’s report confirmed: drowning secondary to cardiac arrest. Death accelerated by failure to receive immediate aid. The water caused the drowning, the heart attack was a factor, but the *timing* of death, the *preventability*... that hinged on action, or inaction.

  Silas sat in his cramped office, rain streaking the window. He spread the notes on his desk like a morbid map. Kyle Jennings: Slept. Brenda Rossi: Didn’t check. Eleanor Gable: Didn’t speak. Leo Chen: Didn’t investigate. Arthur Finch: Drowned.

  He drew arrows. Kyle's sleep led to no rescue. Brenda's inattention meant Kyle wasn’t corrected. Eleanor’s silence meant Brenda remained unaware. Leo’s inaction meant no bystander rescue. Each omission seemed necessary in the chain. Without any *one* of them acting differently, Finch might still be alive. Counterfactually, they all "caused" the death as much as Kyle.

  He felt the absurdity pressing in. What about the sunbather who *did* finally notice? Too late, but *if* she’d looked sooner? What about the beach club member who’d argued for cheaper staffing, leading to longer shifts and guard fatigue? What about the city council that approved the club without mandating backup systems? What about the manufacturer of the comfortable, soporific lifeguard chair? What about Silas himself? *If* he’d finished his report on the Hastings claim yesterday, he might have started this investigation an hour earlier, uncovered Mrs. Gable sooner, and... and what? The chain felt infinite, suffocating, meaningless.

  He found himself sketching a ludicrous diagram. Arrows fanned out from Arthur Finch’s final breath, branching to Kyle, Brenda, Eleanor, Leo, then spiraling outwards: the distracted waiter who didn’t bring Kyle water (dehydration?), the engineer who designed the chair, the budget committee member, the inventor of the smartphone (Kyle *had* been scrolling before dozing off?), the lifeguard trainer who emphasized vigilance but couldn’t instill it… He drew a wavy line representing the ocean itself – the ultimate necessary condition, the ever-present danger. Was *it* the cause? Or was it just... context?

  He slammed his fist on the desk. *This is insane.* Liability couldn’t be infinite. Oceanic Mutual couldn’t pay out to Finch’s family *and* sue the chair manufacturer *and* the city council. The policy covered negligence by the insured – the Beach Club – arising from its operations. But whose negligence *was* it? Kyle’s? Brenda’s for poor supervision? The Club’s for inadequate systems? All of the above?

  The philosophical ghost from his own long-ago college ethics class whispered: *You’re mapping moral responsibility, not causation. The water caused the drowning. The heart attack contributed. The omissions were failures of duty, not causes like a falling brick.*

  But Silas had seen the security footage. The long minutes stretching out. Finch floating, then gone. Kyle’s head lolling. Brenda visible through the office window, head down. Leo Chen powering past. Eleanor Gable adjusting her sunhat. The sheer, agonizing *absence* of action felt as tangible, as causally potent, as any bullet or blade. That void *was* the instrument of death.

  He took a red pen. Slowly, methodically, he began crossing names off his absurd diagram. Not because they *couldn’t* have changed the outcome counterfactually, but because... why?

  * Leo Chen:* Crossed out. *No duty to other swimmers beyond basic safety.*
  * Eleanor Gable:* Crossed out. *No duty to monitor lifeguards.*
  * The Chair Manufacturer:* Crossed out. *Chair functioned as designed. No defect.*
  * The City Council:* Crossed out. *Regulatory failure too remote.*
  * The Ocean:* Crossed out. *Context, not agent.*

  He paused over Brenda Rossi. *Manager. Duty to oversee operations, including lifeguard performance. Present on site. Failed to ensure vigilance.* He didn’t cross her out.

  Kyle Jennings. *Lifeguard. Primary, explicit duty to monitor water and effect rescues. Directly employed for this purpose. Admitted failure.* He left Kyle’s name.

  The fanning out stopped here. Not because Brenda and Kyle were the *only* ones whose actions counterfactually mattered, but because they were the ones whose *roles* defined the expectation. The *duty* carved out the causal significance of their inaction from the vast ocean of general human non-intervention. The lifeguard sleeping wasn't just *a* missing rescuer; he was *the* designated rescuer whose absence *was* the failure of the system. Brenda’s failure wasn't just *anyone’s* inattention; it was the supervisor neglecting to ensure the safeguard functioned.

  It wasn't that causation was *only* about duty. The water and the heart attack were causes too. But when it came to *omissions*, the chain of "but-for" causes was endless and useless. Normative lines – duties, roles, reasonable expectations – weren't smuggled in; they were the essential framework that made causal inquiry *about omissions* possible and meaningful. They defined *whose* inaction counted as *a* cause within the event.

  Silas picked up the phone. "Janine? Draft the preliminary for Mariner’s Cove. Apparent liability. Negligence by employee lifeguard in failing to maintain watch. Potential contributory negligence by management for inadequate supervision protocols. Pre-existing condition reduces but doesn't eliminate claim. Deny liability for bystanders."

  He hung up. The rain still fell. He looked at the red-crossed diagram, the two names left standing near Arthur Finch. It wasn't perfect. It didn't capture the gnawing feeling that everyone on that beach that day shared a sliver of the terrible quiet. But it was *workable*. It reflected how the world, messy and interconnected as it was, actually allocated responsibility. Causation for omissions wasn't found in the physics of absence; it was etched in the lines of duty. The water did its duty. The heart did its fatal duty. Kyle Jennings did not do his. That was the cause Oceanic Mutual could understand, and the only chain that wouldn't drown them all in infinite regress. He wrote two words at the top of the file before closing it: *DUTY. BREACH.*

  The ocean, outside his window and in his mind, remained implacably neutral.
