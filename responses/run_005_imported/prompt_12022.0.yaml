answer: |-
  The amber liquid in the cut-crystal decanter caught the last rays of the setting sun, transforming it into a trapped, molten jewel. Leo stared, the familiar ache blooming behind his ribs. *Just one sip.* The voice was smooth, insistent, *his* voice, but amplified, present-tense. **Present-Self** leaned forward, elbows on the polished oak of his study desk, the scent of aged oak and peat smoke a phantom in his nostrils. "Thirty days clean. A drop won't erase that. Think of the warmth, the sharp clarity it brings *right now*. The report can wait until tomorrow."

  But across the temporal gulf, **Future-Self (Tomorrow Morning)** recoiled. The image was visceral: a pounding headache, dry mouth, the crushing shame as he fumbled through the crucial client presentation, his hard-won credibility crumbling. "No! That 'drop' is the crack in the dam. Remember last time? One became two, became lost days. This presentation is the cornerstone of the quarter. Blow this, and the promotion evaporates." Future-Self projected the consequences: the disappointed face of his boss, the stalled career trajectory, the gnawing sense of failure that would linger for weeks.

  **Present-Self** scoffed, the allure of the whiskey momentarily dimmed by the projected hangover. "Okay, fine. So skip the presentation disaster. But *after*? After the win? A celebratory dram. Surely then?" He conjured the relief post-presentation, the deserved reward. The decanter seemed to glow brighter.

  **Future-Self (Post-Presentation)** wasn't fooled. "Celebratory dram? It *starts* celebratory. Then it becomes 'unwinding'. Then it becomes Tuesday. Leo, you know the slope. We *made* the rule: 'No alcohol. Period.' Not 'no alcohol except when stressed,' or 'no alcohol except to celebrate.' **Period.** That rule isn't just about *now* or *then*; it's the treaty. Break it *once*, even for a 'good reason,' and the whole agreement shatters. **Future-Selves** won't trust it anymore. Why resist *anything* if the rule is flexible?"

  **Present-Self** squirmed. The rule. The personal constitution. It wasn't just about avoiding tomorrow's headache; it was the fragile pact binding all his potential futures together. **Future-Self (Next Month)** chimed in, voice calmer but heavy with implication: "If you break it tonight for stress, what stops you from breaking it next week for celebration, or the week after for boredom? Each breach makes the next easier. The discount curve flattens disastrously. The value of long-term sobriety – the clear head, the health, the respect, the *control* – plummets when immediate relief is an option you've proven you'll choose. Tonight isn't just about whiskey; it's about whether the treaty holds."

  **Present-Self** felt the pressure. The immediate reward – the warmth, the numbing of anxiety about the presentation – was *so* close, its value hyperbolically inflated by proximity. The larger-later rewards – career success, health, self-respect – felt abstract, distant, discounted heavily by the immediacy of his craving. The curves were converging, crossing *right here* at his desk. **Future-Self (Post-Presentation)** amplified the stakes: "Think of the presentation *succeeding*. Think of the confidence, the momentum. That feeling is worth infinitely more than this fleeting burn. But only if you hold the line *now*."

  The decanter was mesmerizing. **Present-Self** reached out, his hand hovering. The warmth, the oblivion... it promised so much *right now*. **Future-Selves** held their breath. The treaty trembled.

  Then, **Future-Self (Next Year)** spoke, a quiet resonance cutting through the immediacy: "Remember the collapse last year? The three months lost? The doctor's warning? That started with 'just one' on a stressful Tuesday. The cost wasn't just that bottle; it was the erosion of trust in *us*. It took months to rebuild the treaty. Is this moment's relief worth risking *that* war again? Worth proving to every future version of you that the rule is paper?"

  The hovering hand clenched into a fist. The hyperbolic discount curve of the whiskey's value was steep, incredibly tempting. But the curve representing the value of the personal rule – the integrity of the treaty – had just intersected it at a critical point. Breaking the rule now wouldn't just mean a drink; it meant declaring the treaty void. It meant empowering every future moment of weakness with the precedent of failure. The cost wasn't just tomorrow's hangover; it was the potential collapse of his entire strategy for self-control, a cascading failure of future bargains.

  With a shuddering breath, Leo pulled his hand back as if burned. He slammed the desk drawer shut on the decanter, the sharp crack echoing in the silent room. The immediate craving screamed, furious and raw. But a different feeling emerged, thin but persistent: not triumph, not yet, but the fragile satisfaction of a bargain upheld. He hadn't conquered the urge through sheer force; he'd negotiated. **Present-Self**, outvoted and overruled by the coalition of **Future-Selves**, sat back, defeated but compliant. The treaty held. The curves, for now, had crossed in favor of the longer game. He picked up his presentation notes, the paper cool under his fingers, the amber jewel banished to the dark. The war wasn't won, but this battle, negotiated in the silent marketplace of his own unfolding time, belonged to the future.
