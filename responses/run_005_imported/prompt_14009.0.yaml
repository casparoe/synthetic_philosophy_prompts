  Random rabbit hole from a piece I'm noodling on about astrology's pop-culture comeback (Co-Star, TikTok astrologers, all that) — I wanted a "well, actually" bit on Kepler, and the version I keep half-remembering from a couple of biographies (Koestler's Sleepwalkers, plus some Kepler biography I read ages ago) is way weirder and more interesting than the usual "genius astronomer moonlighted as an astrologer for cash, wink wink" line. From what I can tell, he actually went after most of the standard astrology of his own day pretty hard, in a pamphlet called something like Tertius Interveniens (1610ish, written against a critic who wanted astrology abolished outright) — the houses, the sign-based personality stuff, most of the predictive apparatus a working court astrologer would've sold you. But he didn't junk the whole enterprise: he kept insisting, and tried to ground it in his own physics of cosmic harmony, that the aspects (the angles planets make with each other as seen from earth) really do something, tied to some kind of earth-soul that responds to certain geometric ratios. And then there's the extra wrinkle that he was doing paid horoscope work for actual patrons — didn't he draw up Wallenstein's chart at one point and then revise it later once Wallenstein got powerful? — which sounds alot more mercenary than "harmonic aspects speaking to the world-soul."

  Could you help me actually sort this out properly instead of going with my half-remembered version? Specifically I want a real compare-and-contrast: Kepler's own astrology versus the mainstream Ptolemaic/scholastic astrology practiced by his contemporaries — what exactly he rejected, what he kept, and how he justified keeping any of it in terms of his own cosmology rather than just inherited habit. And I'd like your honest read on the coherence question: is there a way to square the "sincere harmonic astrology" side of him with the "horoscopes for powerful clients" side, or is that a real tension he never resolved? Feel free to correct me if I'm garbling the Wallenstein detail or the pamphlet's date — I'm working from memory and would rather you get it right than just confirm whatever I already (maybe wrongly) think.
