prompt: |-
  My uncle passed away and left me an ugly painting, plus a line in his will saying I get a bigger cut of the inheritance if I stand up at the family reunion and call it a masterpiece. Ever since I read that clause I've noticed myself actually starting to like the painting, i can even point to specific things about the brushwork and colors i genuinely appreciate now. Problem is, I can't tell if I'm noticing something real about the painting or if I've just talked myself into liking it because of the money. Does the inheritance clause give me any actual reason to think the painting is good, or am I just fooling myself into an opinion I want to have?
