answer: |-
  You've pinpointed a profound flaw in purely descriptive theories of causation-by-omission: their inability to resolve cases like yours without smuggling in normative judgments. Let's argue why **only the normative repair (duties/expectations) can non-arbitrarily identify the "cause" among equally counterfactually relevant omissions:**

  1.  **The Failure of Statistical Rarity ("Abnormal Omissions") in Your Case:**
      *   **Equal Rarity:** As you observe, both omissions (on-call not rechecking muted alerts, neighbor not checking dashboards outside their service) are *statistically similar* in their infrequency based on historical data. Neither is an "abnormal" event relative to its baseline.
      *   **The Arbitrariness Problem:** If causation hinges *only* on statistical abnormality, and both omissions are equally abnormal, then *both* should be named as causes. To name *only* the on-call engineer implies there's an unstated, non-statistical criterion differentiating them. Picking one omission arbitrarily undermines the objectivity the statistical approach claims.
      *   **Shifting Baselines:** What constitutes the "baseline" for rarity? Is it "all engineers," "engineers on-call," "engineers for service X," "engineers who saw the alert earlier"? Each baseline yields a different "rarity" score. Choosing the relevant baseline itself requires a normative judgment about *which roles matter* for *this specific potential cause*.

  2.  **The Normative Repair: Duties & Role-Based Expectations:**
      *   **The Crucial Distinction:** The fundamental difference between the on-call engineer and the neighboring engineer is *not* what they *did* (both omitted to look), but *what they were normatively expected to do*. The on-call engineer had a **role-based duty** explicitly defined by the organization: to monitor and respond to alerts for their service, especially those they have interacted with (like muting). The neighboring engineer had no such duty for *this specific service*.
      *   **The "Ought" Defines the "Cause":** The outage counterfactually depended on the omission *where there was a duty to act*. The on-call engineer *ought* to have rechecked the muted alert as part of their assigned responsibility. The neighboring engineer *could* have looked, but there was no organizational norm or expectation *requiring* them to monitor dashboards for services outside their ownership. Their omission, while factually relevant, lacks the normative grounding that makes an omission a *cause* in the relevant sense for accountability and RCA.
      *   **Non-Arbitrary Selection:** This duty provides a clear, non-arbitrary principle for selecting the cause. It's based on the explicit or implicit contractual/role-based expectations established by the organization's structure and processes. The on-call engineer's omission violated a specific operational norm tied to their function; the neighbor's did not.

  3.  **Why Normative Facts are Irreducible:**
      *   **Duties Aren't Just Frequent Behaviors:** A duty isn't defined *by* how often people fulfill it. A duty exists even if it's frequently neglected. Conversely, common behavior (like the neighbor *sometimes* checking other dashboards) doesn't create a duty. The duty stems from role assignments, job descriptions, SLAs, and organizational design – normative constructs.
      *   **Structure Requires Interpretation:** The organizational "structure" (on-call rotations, service ownership) isn't just a neutral fact. It's a *normative structure* designed to assign responsibilities and expectations. Identifying the "owner" of a service *is* identifying the person who *ought* to be responsible for it. The structure embodies the norms.
      *   **"Reasonable Expectations" are Normative:** The "reasonable expectation" that the on-call engineer would recheck a muted alert isn't derived purely from statistics. It's derived from understanding the *purpose* of muting (a temporary pause requiring follow-up) and the *role* of the on-call engineer. What's "reasonable" depends on the normative context of the role and the action (muting).

  4.  **Causation-by-Omission as Inherently Normative:**
      *   **The Vacuum Problem:** In a purely physical/descriptive world, "omissions" are infinite. I "omitted" to fly in from another continent and fix your server. Why isn't *my* omission the cause? Descriptive theories struggle to limit the scope of relevant omissions without invoking norms (e.g., "only omissions by people physically present," "only omissions by people with access" – but these boundaries themselves often rely on implicit duties or permissions).
      *   **The Selection Problem:** From the infinite set of counterfactually relevant omissions, we select only *some* as "causes." The selection criterion is virtually always normative: *Who should have acted?* Who had the responsibility? Who failed in an expectation placed upon them? Your case perfectly illustrates this: both omissions were counterfactually relevant and statistically similar, but only one involved a breach of a specific, role-based duty.
      *   **Accountability Requires Norms:** The very purpose of an RCA in an SRE context is not just technical description, but learning and improving processes, which inherently involves understanding *where assigned responsibilities failed*. This goal *demands* a normative lens to identify which failures of action (omissions) matter in terms of organizational accountability and process design.

  **Conclusion & Resolution for Your Philosophical Itch:**

  Your postmortem identified the on-call engineer's omission as the root cause *not* because it was statistically rarer than the neighbor's inaction (it wasn't, by your data), but because it represented a **failure to fulfill a specific, role-based duty central to the service's operational integrity.** The neighboring engineer's omission, while unfortunate and counterfactually relevant, lacked this normative dimension – there was no duty breached.

  Therefore, causation-by-omission, especially in complex socio-technical systems like SRE, *is* an inherently normative phenomenon. We identify omissions as causes when they occur in the context of a violated norm, duty, or reasonable expectation. Statistical rarity might sometimes *correlate* with such norms (duties are *usually* fulfilled), but it cannot *define* them or *replace* them as the core criterion for selecting the relevant cause among equally counterfactual omissions. The "blameless" aspect focuses on understanding *why* the duty wasn't fulfilled (fatigue, unclear process, tool failure) rather than assigning moral blame to the individual, but it still fundamentally relies on identifying the *locus of the duty* that failed. Your case brilliantly exposes the normative skeleton beneath the skin of technical causality.
