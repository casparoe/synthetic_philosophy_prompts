  For (6): Elif's vacuum critique hits home. If any value can be redefined as "preference," the premise loses bite. This mirrors Arrow's information restriction critiques. +2. 

  Now the deeper questions: Elif's (2) and (4) are distinct - one about utility scaling (technical), the other about fairness (normative). Marcus's move in (5) technically saves Pareto indifference but at the cost of its thinness, as Elif notes. Both overlook how Harsanyi's later work tries to normalize utilities, though that opens other cans of worms. 

