    "grade": "<x>/20",
    "comments": [
      {"excerpt": "<short quotation from the answer>", "verdict": "correct | incorrect | overstated | unsupported", "note": "<one or two sentences>"}
    ],
    "summary": "<2-3 sentence overall assessment>"
  }
  ```
reasoning: |-
  Alright, let's tackle this. The user is writing a campus novel with a philosophy grad student TA grading exams on Wittgenstein. The scene involves the protagonist losing his religious faith, so the grading needs to reflect his rigorous, precise mindset. 

  First, the exam question has two parts: (a) why Wittgenstein resists calling religious disagreement a matter of opposite opinions on the same fact, and (b) whether this commits him to logical positivism's view of religious utterances as cognitively meaningless, using the "picture" concept. 

  The student's answer starts well by explaining that religious belief isn't empirical. They correctly note that for the believer, the Last Judgement picture regulates their life, which the non-believer doesn't share. This addresses part (a) accurately. However, the student then claims Wittgenstein's view aligns with logical positivists, saying religious statements are meaningless pseudo-propositions. This is a major error. Wittgenstein explicitly opposed the positivist dismissal; his point was that religious language has meaning through its role in life, not factual assertion. The student also misattributes Catholic faith to Wittgenstein, which is factually wrong—he wasn't a lifelong Catholic. 

  The TA would need to pinpoint where the student is correct (part a explanation), where they go off track (equating Wittgenstein with positivists), and the factual error about his faith. The comments should be precise, noting overstatements and unsupported claims. The grade would reflect a strong start but a significant misunderstanding in part (b), leading to a mid-range score. The summary should highlight the accurate grasp of part (a) but the critical misinterpretation of Wittgenstein's stance against positivism.
