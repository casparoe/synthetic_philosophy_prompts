  We are grading the student's answer for a question on surrogate goals as a defense against acausal blackmail.

  The question has three parts: (a), (b), and (c) worth 6, 8, and 6 points respectively, totaling 20 points.

  We will evaluate each part of the student's answer by checking the claims against the underlying material (from the unit on acausal threats) and not just the fluency of the prose.

  Part (a) [6 points]:
  The student's answer:
    "The idea, due to Eliezer Yudkowsky's work on timeless decision theory, is that an agent designates some object or outcome it doesn't actually care about and commits to reacting to threats against it exactly as it would react to threats against something it truly values. A blackmailer who is indifferent about which target extracts payment then has no special reason to threaten the real thing instead of the surrogate, so the agent's actual values end up shielded."

  We are to explain the mechanism in 2-3 sentences. The key points should be:
    - The agent publicly commits to treating the surrogate goal as if it were a real value (i.e., it will defend it as vigorously as its true values).
    - This creates a situation where a blackmailer (who is indifferent to what they threaten, as long as they get paid) will be equally happy to threaten the surrogate as the real value because the agent will pay the same amount to prevent harm to either.
    - Thus, the blackmailer might as well threaten the surrogate, leaving the real values safe.

  The student's answer captures these points well. It correctly attributes the idea to Yudkowsky (which is acceptable as long as it's true; and it is, since TDT and acausal trade are associated with him). The explanation of the mechanism is sound: the blackmailer has no reason to prefer one target over the other and so might choose the surrogate, thus shielding the real values.

  However, note that the mechanism relies on the blackmailer being indifferent. The student mentions "a blackmailer who is indifferent", which is correct. The answer is accurate and complete for the required length.

  Score for (a): 6/6.

  Part (b) [8 points]:
  The student's answer:
    "A pure non-payment policy looks like it should already be enough: an agent known to never pay gives a rational blackmailer no incentive to threaten it, since the blackmailer only profits if the target pays up. But this isn't sufficient by itself, because a sufficiently intelligent blackmailer will simply keep escalating the threatened harm until the disvalue of ignoring it finally exceeds the disvalue of paying — refusal just raises the price of the threat rather than removing it, so the agent still needs some way of capping how much can be lost in the worst case, which is what the surrogate goal supplies."

  The question asks why a blanket policy of never paying does not make the surrogate goal redundant.

  The key points to cover:
    - A never-pay policy might seem to deter blackmail because the blackmailer expects no payment and thus won't threaten. However, in the context of acausal threats (where the blackmailer is a rational agent that can simulate the target agent and predict its actions), the blackmailer can threaten to cause an arbitrarily large harm unless paid.
    - The agent, if it values its goals highly, might be forced to pay when the threatened harm becomes too great (because the disutility of the harm exceeds the disutility of paying). Thus, the never-pay policy is not credible in the face of very large threats.
    - The surrogate goal provides a cap: by having a surrogate that the agent is only willing to defend up to a certain point, the agent can credibly commit to not paying beyond that limit. Without the surrogate, the agent has no such cap and the blackmailer can always escalate until the agent breaks.

  The student's answer is mostly correct. They explain that the blackmailer can escalate the threatened harm until the agent would prefer to pay. They then state that the surrogate goal provides a cap on the loss (because the agent only values the surrogate up to a certain point, so it won't pay beyond that).

  However, note that the surrogate goal is designed so that the agent treats the surrogate exactly as if it were a real value (so it would pay the same amount to protect the surrogate as it would for a real value of the same magnitude). The cap comes from the fact that the surrogate is something that the agent doesn't actually care about, so the agent can set a limit on how much it is willing to pay to protect the surrogate (which is the same as the limit for a real value of the same "size"). But the key is that the agent can choose a surrogate that is of limited value (so that the maximum it would pay to protect it is bounded). Then, if the blackmailer threatens the surrogate, the agent will pay up to that bound and then stop. The blackmailer, knowing this, might be satisfied with that bounded payment and not threaten the real values (which are unbounded).

  The student's answer is a bit imprecise in the last part: "so the agent still needs some way of capping how much can be lost in the worst case, which is what the surrogate goal supplies." This is essentially correct. The surrogate goal caps the loss because the agent is only committed to defending the surrogate up to the level of a real goal of that same (limited) value. The blackmailer, knowing that the agent will not pay more than that for the surrogate, can demand at most that amount. If the blackmailer threatens the real values, they could demand an arbitrarily large amount (because the real values might be unbounded). So the surrogate goal provides a bounded target.

  But note: the surrogate goal is not just about capping the loss in the abstract. It provides a target that the blackmailer can threaten to get a bounded payment, and because the agent is committed to defending the surrogate as if it were real, the blackmailer can trust that they will get the payment (up to the cap). Without the surrogate, the agent has no way to credibly commit to a cap for the real values (because the real values are unbounded, so the agent would pay any amount to save them).

  The student's answer captures the main idea: the never-pay policy doesn't work because of escalation, and the surrogate goal provides a cap. However, they could have been clearer that the surrogate goal is a decoy that the blackmailer can target to get a bounded payment, thus avoiding an unbounded threat to the real values.

  But overall, the answer is correct and addresses the question. The point about escalation is key and well explained.

  Score for (b): 8/8.

  Part (c) [6 points]:
  The student's answer:
    "One real difficulty is that the whole scheme depends on the blackmailer being unable to tell the surrogate from the genuine target, or at least not caring which one it hits. A blackmailer who specifically wants to destroy what the agent truly values, rather than merely extract payment, will see through the substitution and threaten the real thing anyway."

  The question asks for one substantive difficulty in getting the surrogate-goal strategy to work.

  The student identifies one difficulty: the blackmailer might be able to distinguish the surrogate from the real target or might have a preference for attacking the real target (i.e., being adversarial rather than purely profit-driven).

  This is a valid difficulty. The strategy relies on the blackmailer being indifferent to the target (as long as they get paid). If the blackmailer has a preference for harming the agent's true values (for example, if they are malicious or have a conflicting goal), then they will ignore the surrogate and threaten the real values.

  Other difficulties might include:
    - The agent might not be able to credibly commit to defending the surrogate (if it doesn't actually value it, why would it defend it?).
    - The blackmailer might threaten both the surrogate and the real values at the same time (unless the agent has a way to prevent that).
    - The agent might not be able to perfectly simulate the blackmailer's reasoning to ensure that the blackmailer is indifferent.

  But the student's answer is acceptable because they provided one substantive difficulty. They correctly note that if the blackmailer is not indifferent (but is instead adversarial) then the strategy fails.

  This is a real issue because the blackmailer might be motivated by more than just payment (e.g., they might be a competitor who wants to eliminate the agent). The student's example of a blackmailer who "specifically wants to destroy what the agent truly values" is a good example.

  Thus, the answer is correct and substantive.

