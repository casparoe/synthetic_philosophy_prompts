  First, I need to recap the core positions clearly. Smith's fetishism objection targets Kantian accounts for requiring de dicto motivation (concern for rightness itself). Markovits responds by shifting to de re motivation - the agent just needs to be moved by the right-making features, without necessarily thinking about rightness. Her Coincident Reasons Thesis requires only that the agent's motivating reasons match the justificatory reasons. Sliwa adds that the agent must know that these reasons are right-making.

  The user's worry is that Markovits' thesis can't differentiate between someone who acts for the right reasons out of genuine moral concern versus someone who does so because of a reliable but non-moral disposition (like an innate tendency). For example, someone who helps others because they're wired to respond to suffering, without any moral understanding. This seems problematic because moral worth should capture the agent's moral character.

  I should steel-man Markovits first. Her key insight is that focusing on de re reasons avoids fetishism. The agent is motivated by the actual features that make the action right, like suffering, not by the abstract concept of rightness. She argues this preserves the connection to morality through the substance of the reasons. Sliwa strengthens this by requiring knowledge, so the agent must be aware that their reasons are right-making, which adds a cognitive element.

  But the user's objection points out a gap: even with coincident reasons and knowledge, an agent might still lack moral concern. They could know that helping relieves suffering (a right-making feature) and be motivated by that suffering due to a non-moral disposition, like an innate reflex. Their knowledge might be detached; they recognize it's right-making but not in a way that reflects moral engagement. So, the problem is that the motivation isn't properly moral—it's coincidental and not rooted in valuing morality.

  Sliwa's knowledge condition doesn't fully solve this. The agent could know that relieving suffering is right-making but treat it as a fact, not something they care about morally. Their knowledge might be theoretical, not motivating. For instance, they might act because they're disposed to, and their knowledge is just an added belief that doesn't influence their motivation. So, the connection between knowledge and motivation isn't robust enough to ensure moral concern.

  Then, Arpaly's approach comes in. She emphasizes responsiveness to moral reasons. For Arpaly, moral worth requires that the agent is motivated by the right-making features because they recognize their moral significance. It's about the agent's deep alignment with moral values—their reasons must reflect an appreciation of why those features matter, not just coincidental alignment. This builds substantive moral responsiveness into the definition, which addresses the user's worry by tying motivation to the agent's character.

  I need to ensure I'm not straw-manning Markovits or Sliwa. For Markovits, I should highlight her focus on the substance of reasons as inherently moral. For Sliwa, her knowledge condition is meant to ensure the agent connects their reasons to rightness. But the counter is that both still allow for a disconnect between the agent's psychology and moral concern if the motivation isn't rooted in valuing morality.

  The user's deeper need might be to defend a robust account of moral worth that captures genuine virtue. They're likely arguing that internal states matter—motivation must stem from moral engagement, not just external alignment. This ties into broader debates about what makes an action morally praiseworthy. Their dissertation probably aims to show that accounts like Arpaly's better capture the essence of moral character.
answer: |-
  Here's a steel-manned critique of the Coincident Reasons Thesis (CRT) centered on the problem of "coincidental convergence," arguing why it necessitates an Arpaly-style responsiveness requirement for moral worth. I'll rigorously present Markovits's and Sliwa's positions before demonstrating why they fail to resolve this core issue.

  **Steel-Manned Core Positions:**

  1.  **Michael Smith's Fetishism Objection:** Kantian accounts (like Korsgaard's) tie moral worth to acting *because it is right*. Smith argues this requires a *de dicto* desire for rightness *as such*. This, he claims, makes the morally worthy agent a "fetishist" – concerned with the abstract property of rightness rather than the *substantive, naturalistic features* (e.g., relieving suffering, keeping promises) that *make* actions right and are the proper objects of common-sense moral motivation. The virtuous agent cares about suffering *itself*, not just that relieving it is "right."

  2.  **Julia Markovits's Coincident Reasons Thesis (CRT):** Markovits agrees the fetishism objection is fatal to *de dicto* requirements. Her solution is elegant:
      *   Moral worth requires acting *for the reasons that actually make the action right* (the right-making features, RMFs). This is a *de re* requirement.
      *   The agent's *motivating reasons* must *coincide* with the *normative reasons* (the RMFs).
      *   Crucially, **no belief about the action's rightness is necessary.** The agent need not conceptualize their reason as "this is right" or "this makes it right." They simply must be motivated *by* the RMFs themselves (e.g., "I'm helping because she is in pain").
      *   **Steel-Man Strength:** This directly avoids fetishism. The agent is focused on the morally salient *substance* (suffering, promise-breaking) that justifies the action, not an abstract property. The "moral" connection is secured *through* the content of the motivating reasons – RMFs are, by definition, moral reasons. Their presence *as motivators* constitutes moral concern, even without a meta-belief about rightness.

  3.  **Paulina Sliwa's Knowledge-Based Amendment:** Sliwa agrees with CRT's core but argues it's insufficient. An agent might coincidentally act on RMFs without understanding their moral significance.
      *   Moral worth requires acting *for the RMFs* **and** *knowing that these features are right-making*.
      *   **Steel-Man Strength:** Knowledge secures a non-accidental connection between motivation and morality. The agent isn't just *caused* to act on RMFs; they *understand* that these features *count in favor* of the action morally. This adds a cognitive component – grasping the justificatory force of the RMFs – ensuring the agent's perspective aligns with the moral landscape.

  **The Problem of Coincidental Convergence (The Decisive Problem for CRT):**

  Even steel-manned, CRT (and Sliwa's amendment) cannot adequately distinguish **genuine moral concern** from **reliable non-moral behavioral congruence** with the RMFs. Consider:

  *   **The Genuinely Virtuous Agent (GVA):** Helps a stranger in distress *because they recognize the suffering as a bad thing to be alleviated, and this recognition motivates them out of compassion or a sense of duty grounded in the value of wellbeing.* Their responsiveness to the RMF (suffering) stems from a *morally evaluable state* – an appreciation of the moral significance of suffering.
  *   **The Congenitally Congruent Agent (CCA):** Possesses a reliable, innate, non-moral disposition hardwired to respond to distress cues (e.g., intense aversion to the sight/sound of suffering, evolved altruism module, deeply ingrained habit from non-moral training). They help the stranger *because the distress triggers their innate aversion/habit, causing them discomfort they act to remove.* The RMF (suffering) is the *de re* cause of their action, and their motivating reason ("to stop that distressing sight/sound") coincides perfectly with the normative reason (to relieve suffering). They may even *know* that relieving suffering is right-making (per Sliwa), but this knowledge is *inert* – it plays no role in their motivation, which is purely driven by the non-moral aversion/habit.

  **Why CRT Fails to Distinguish:**

  1.  **Coincidence is Enough for CRT:** Markovits's CRT *only* requires coincidence of motivating and normative reasons. The CCA satisfies this perfectly. Their motivating reason (stop the distressing stimulus) *is* the RMF (suffering) under a different description. The action *is* motivated *by* the suffering, albeit via a non-moral psychological mechanism. CRT has no resources to demand that the motivation *arise from* an appreciation of the *moral* character of the RMF. The source of the congruence is irrelevant; only the congruence itself matters. The CCA acts *for* the *de re* right-making reason, fulfilling CRT's condition.

  **Why Sliwa's Amendment Fails to Resolve It:**

  1.  **Knowledge Can Be Inert:** The CCA can possess the *knowledge* that relieving suffering is right-making. However, this knowledge can be purely *theoretical* or *detached*. It plays *no constitutive or motivational role* in their action. Their action is explained *solely* by the wired-in aversion. Sliwa requires knowledge *that* the reason is right-making, but **not** that this knowledge *figures in* the motivation or that the agent *cares about* rightness/morality *because* of this knowledge. The knowledge is a bystander to the motivational psychology.
  2.  **Congruence Without Moral Concern:** The CCA reliably acts on RMFs and knows they are RMFs, yet they lack *moral concern*. They don't value wellbeing *as such*; they value avoiding their own discomfort caused by distress cues. Their reliable congruence is a happy accident of their non-moral psychology. Attributing *moral worth* to their action seems deeply counterintuitive – it lacks the distinctive quality of being *morally* motivated. Sliwa's knowledge condition adds cognitive recognition but fails to mandate that this recognition translates into a *motivating moral concern* or that the underlying disposition is *itself* morally evaluable.

  **The Need for Arpaly's Responsiveness:**

  Nomy Arpaly's (2003) account directly targets the *source* and *nature* of the motivation:

  *   Moral worth requires that an action is done *for the right-making reasons* **and** that the agent's **motivation exhibits a responsiveness to the moral significance** of those reasons.
  *   It's not enough that the agent is *moved by* the RMFs *de re*. The *way* they are moved must reflect an appreciation of the RMFs *as morally significant*. The agent must be "on the side of morality" – their reasons must stem from states that *track* moral value (e.g., caring about wellbeing, respecting persons) and are *themselves* morally praiseworthy (or at least not blameworthy).
  *   **How it Distinguishes:**
      *   **GVA:** Their compassion or sense of duty *is* a responsiveness to the moral significance of suffering (wellbeing matters). Their motivation *arises from* a morally evaluable state aligned with value.
      *   **CCA:** Their wired-in aversion, while causing congruence, is *not* a responsiveness to *moral* significance. It's a responsiveness to *sensory discomfort*. The underlying state (aversion to distress cues) is not morally evaluable in the relevant way; it's akin to a reflex. The action may be *caused* by the RMF, but the agent's psychology is not *responsive to it as a moral reason*. Arpaly demands that the agent's "concern" (broadly construed) is *for the moral substance itself*.

  **Conclusion:**

  The problem of coincidental convergence reveals a fundamental insufficiency in Markovits's Coincident Reasons Thesis. By requiring only the *de re* coincidence of motivating and normative reasons, CRT cannot exclude agents whose reliable alignment with morality stems from non-moral psychological mechanisms devoid of genuine moral concern. Sliwa's knowledge amendment, while adding a valuable cognitive layer, fails because knowledge of right-making status can remain inert, disconnected from the source of motivation. The CCA demonstrates that congruence and knowledge are compatible with a complete absence of moral motivation *in the robust sense required for attributing praiseworthiness*.

  Only an account like Arpaly's, which builds **substantive responsiveness to the moral significance of the right-making features** into the analysis of moral worth itself, can successfully mark the distinction. It moves beyond mere coincidence or cognitive recognition to demand that the agent's motivating psychology itself is *oriented towards* or *tracking* moral value. This ensures that actions possessing moral worth are not just externally aligned with morality but are expressive of the agent's internal alignment with moral reasons – a crucial distinction your dissertation chapter rightly seeks to defend.
