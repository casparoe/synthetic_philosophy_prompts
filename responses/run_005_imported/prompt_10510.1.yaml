prompt: |-
  I'm on the standards committee at the outlet I write for, and we've got an annoying case in front of us. A piece our science desk ran stated flat-out that social media is causing the rise in teen depression, no hedge, leaning on the same correlational and quasi-experimental evidence Haidt uses in The Anxious Generation. A few academics in the Odgers/Orben camp complained that effect sizes are tiny and causation's nowhere near established, so we owe readers a correction. Half the committee thinks we overclaimed; the other half thinks the reporter had plenty of good evidence and that hedging everything with "some scientists believe" is it's own kind of dishonesty, not more honest, just mushier. We meet thursday and I need an actual memo: what to do about this piece, plus a real rule reporters can use for how much evidence is "enough" to assert a contested causal claim outright instead of attributing it. Don't split the difference, and give the anti-hedging camp a fair hearing -- committees like ours usually wave them off too fast.
reasoning: |-
  Okay, let me unpack this standards committee dilemma. The user is grappling with a classic science journalism tension - when can you state causation outright versus hedging? They need concrete guidance by Thursday that doesn't just split the difference between the two camps.

  First, I recognize this isn't just about one article - it's about setting precedent for how their outlet handles contested causal claims. The science desk made a strong assertion about social media causing teen depression, relying on evidence similar to Haidt's work. Now academics from the Odgers/Orben camp are pushing back, arguing the evidence shows only small correlations and causation isn't proven.

  Hmm... the committee is split. Half thinks they overclaimed, half thinks avoiding "some scientists believe" language is actually more honest. The user specifically wants to give the anti-hedging camp proper consideration since they're often dismissed too quickly. 

  I need to approach this carefully. The key is distinguishing between scientific certainty (which rarely exists) and journalistic responsibility. The reporter did have evidence - just not the kind that supports flat causation claims. Correlational and quasi-experimental studies simply can't prove causation alone. The effect size debate matters too - if impacts are tiny, calling it a "cause" of rising depression rates is misleading even if statistically significant.

  For the memo, I should propose specific actions: a correction for the original piece, plus clear guidelines moving forward. The guidelines could require three things before stating causation: 1) consistent experimental evidence, 2) large effect sizes in real-world contexts, and 3) ruling out alternative explanations. Most social science claims wouldn't meet this bar - and that's okay. Precision isn't weakness.

  The anti-hedging camp has a point about "mushy" language being dishonest sometimes. But the solution isn't to overclaim - it's to use precise verbs. Instead of "causes" or "may cause," words like "contributes to" or "exacerbates" can be both accurate and strong. And when evidence is truly mixed, saying so clearly is actually more trustworthy to readers.

  For Thursday's meeting, I'll frame this as upgrading their toolkit rather than admitting defeat. The correction shows integrity, and the new guidelines empower reporters to write with confidence - within the actual boundaries of evidence. That should satisfy both camps: rigor for the critics, clarity for the anti-hedging folks.
answer: |-
  Here's a memo designed for your committee meeting, offering a concrete resolution and a clear rule for future reporting, while giving the anti-hedging position its due:

  **MEMORANDUM**
  **TO:** Standards Committee
  **FROM:** [Your Name/Committee Member]
  **DATE:** [Date before Thursday]
  **SUBJECT:** Resolution on Science Desk Article & Framework for Asserting Causal Claims

  **1. Assessment of the Specific Piece ("Social Media & Teen Depression"):**
  *   **The Claim:** The article asserted "social media is causing the rise in teen depression" as a flat, unqualified statement of fact.
  *   **The Evidence Cited:** Correlational studies and quasi-experimental evidence (e.g., similar to Haidt). This evidence *suggests* a link and potential harm, but by its nature, **cannot definitively establish causation** on a complex societal issue like teen depression.
  *   **The Counter-Evidence:** As noted by the Odgers/Orben camp and reflected in ongoing academic debate (e.g., in journals like *Nature Human Behaviour*, *Journal of Child Psychology and Psychiatry*):
      *   Effect sizes in many studies are small, especially when accounting for individual differences and pre-existing vulnerabilities.
      *   Longitudinal data is often inconsistent.
      *   Alternative explanations (e.g., societal pressures, economic anxiety, pandemic fallout, co-occurring mental health trends) are plausible and difficult to fully rule out.
      *   Causality direction (does depression lead to more problematic SM use, or vice versa?) remains contested.
      *   The field lacks definitive, large-scale, long-term randomized controlled trials (RCTs) – the gold standard – which are ethically and practically near-impossible here.
  *   **Committee Stance:** Asserting flat causation based *solely* on this type and quality of evidence **overclaims**. It presents a highly complex and actively debated scientific question as settled fact. While the reporter cited real evidence, its limitations regarding *causation* are significant enough to require qualification for accuracy.
  *   **Recommended Action:** Issue a **Correction**. The correction should:
      *   Acknowledge the original statement was overly definitive.
      *   State: "While substantial research, including correlational and quasi-experimental studies, suggests a *link* between social media use and increased teen depression rates, the evidence for social media being a *primary cause* of the *rise* in depression is complex and contested within the scientific community. Factors such as effect size, alternative explanations, and the difficulty of proving causation in societal trends require careful interpretation. The article has been updated to reflect this nuance."
      *   Update the article text to clearly attribute the causal claim ("Some researchers, like Jonathan Haidt, argue...") and explicitly mention the limitations of the evidence and the existence of significant counter-arguments.

  **2. A Rule for Asserting Contested Causal Claims (The "Causation Assertion Threshold"):**

  Reporters may state a causal claim outright **without attribution** ("X causes Y") **only** when **ALL** of the following conditions are met:

  1.  **Strong, Consistent Evidence:** The evidence base is robust, including:
      *   **Multiple, high-quality experimental studies (especially RCTs where feasible and ethical)** demonstrating the effect.
      *   **Consistent findings** across diverse methodologies (experimental, longitudinal cohort studies, quasi-experimental) and research groups.
      *   **Large, statistically significant effect sizes** that are *clinically or societally meaningful* in real-world contexts (not just statistically significant but trivial).
  2.  **Established Mechanism:** There is a well-understood and empirically supported biological or psychological mechanism explaining *how* X causes Y.
  3.  **Ruled-Out Confounders:** Plausible alternative explanations (confounding variables) have been rigorously investigated and largely ruled out by the weight of evidence.
  4.  **Scientific Consensus:** There is a clear, overwhelming consensus within the relevant scientific field that the causal relationship is established. *Active, substantive debate among qualified experts means consensus is absent.*
  5.  **Specificity:** The claim is specific about the nature and magnitude of the effect (e.g., "Substantial evidence shows smoking cigarettes *is a primary cause* of lung cancer," "Helmets *significantly reduce* the risk of severe head injury in bicycle accidents").

  **If ANY of these conditions are not met, attribution is REQUIRED.** This is not "mushiness" or dishonesty; it is **precision and intellectual honesty**.

  **3. Addressing the Anti-Hedging Camp (A Fair Hearing):**

  The argument against excessive hedging ("some scientists believe...") is valid and important. Unnecessary qualification can:

  *   **Undermine Confidence:** Make well-established science sound uncertain when it isn't.
  *   **Create False Balance:** Give undue weight to marginal or discredited views.
  *   **Obscure Clarity:** Make writing weak and inaccessible.
  *   **Be Dishonest:** Implying significant doubt where little exists *is* misleading.

  **This rule explicitly addresses these concerns:** It **empowers** reporters to state causation definitively **when the evidence truly warrants it** (e.g., smoking/cancer, vaccines preventing disease, HIV causing AIDS). The problem arises when this power is applied *prematurely* to complex, emerging, or contested fields like the social media/mental health link.

  *   **The social media/depression claim fails the threshold:** It lacks definitive experimental proof (Condition 1), mechanisms are proposed but contested (Condition 2), confounding is significant and not ruled out (Condition 3), and there is *active, high-profile debate* among leading researchers (Condition 4). Claiming "causes" here does not reflect the *actual state* of the science; it reflects *one interpretation* of a subset of the evidence.
  *   **Attribution is the Accurate Solution:** Saying "Research by Haidt and others *suggests* social media use *contributes to* rising teen depression rates, though the strength and nature of this link is debated, with some studies finding small effects or alternative explanations" is **stronger** journalism. It accurately portrays the evidence (suggestive, correlational, debated) and the scientific process. It avoids overclaiming *and* the pitfalls of false balance or excessive mushiness. It uses precise verbs ("suggests," "contributes to") instead of weak qualifiers.

  **4. Recommendation for the Committee:**

  1.  **Approve** the issuance of the correction and article update as described.
  2.  **Adopt** the "Causation Assertion Threshold" rule as editorial policy. Distribute it clearly to all reporters and editors, especially on the Science, Health, and Tech desks, with examples of claims that pass and fail the threshold.
  3.  **Emphasize Training:** Provide brief training/reminders on:
      *   Distinguishing correlational vs. causal evidence.
      *   Understanding effect size and statistical vs. practical significance.
      *   Identifying scientific consensus vs. active debate.
      *   Using precise language (e.g., "linked to," "associated with," "contributes to," "increases risk of," "is a cause of") instead of relying solely on "some scientists believe."

  This approach upholds accuracy and nuance without resorting to meaningless hedging. It allows for definitive statements *when justified* by overwhelming evidence and consensus, while requiring intellectual honesty and precision when dealing with complex, contested science like the impacts of social media. It gives the anti-hedging camp a clear, evidence-based standard for when definitive claims *are* appropriate, while preventing overreach on issues where the science is still evolving.
