answer: |-
  ## Dissenting Opinion: On the Proposed Honorary Degree for President Truman

  **To the Esteemed Members of Oxford Convocation,**

  As we approach Encaenia and the proposed conferral of an honorary Doctor of Civil Law upon President Harry S. Truman, Dr. Elizabeth Anscombe has presented us with a profound moral challenge in her pamphlet, "Mr Truman's Degree." She compels us to look beyond the customary accolades bestowed upon wartime leaders and scrutinize the nature of the acts for which he is primarily honoured: the atomic bombings of Hiroshima and Nagasaki. Her argument hinges not on the *outcome* of these bombings – the hastened end to a brutal war, the lives potentially saved – but on the *intentional structure* of the acts themselves, judged through the lens of the Doctrine of Double Effect (DDE), a cornerstone of traditional Just War reasoning.

  **Dr. Anscombe's Core Argument:**
  Anscombe contends that the bombings constitute mass murder. The DDE permits causing foreseen but unintended harm to non-combatants only as a side-effect of attacking a legitimate military objective, provided the harm is proportionate and the good effect is not achieved *through* the evil effect. Her central claim is that in the atomic bombings, the destruction of the civilian populations *was not merely a foreseen side-effect*; it was **chosen as the very means** to achieve Japan's surrender. The shock, terror, and societal collapse caused by annihilating entire cities *was the mechanism* intended to break Japan's will. Therefore, the deaths of non-combatants were not unintended but directly intended – *chosen* – as the method to achieve the desired end. This, she argues, crosses the moral line from collateral damage to murder, irrespective of any ultimate utilitarian calculus about lives saved.

  **The Strongest Counter-Argument: A Redescription of the Act**
  The most compelling rebuttal to Anscombe, which we are duty-bound to consider seriously, argues for a different description of the act. Proponents of this view assert that Hiroshima and Nagasaki *were* targeted as major military-industrial centers. Hiroshima housed the 2nd Army Headquarters and significant war production facilities; Nagasaki was a crucial port and industrial city. The *intended* objective, they argue, was the destruction of Japan's capacity and will to wage war by crippling its military infrastructure and war economy. The deaths of civilians were a **foreseen but unintended and unavoidable consequence** of attacking these legitimate targets with the most powerful weapon available, just as civilian deaths were an unavoidable consequence of the firebombing of Dresden, Tokyo, or Hamburg.

  This redescription is powerful because:
  1.  **It aligns with standard Allied strategic bombing doctrine:** If we accept this description, Anscombe's charge of "murder" logically extends to the vast majority of the Allied strategic bombing campaign in both Europe and Japan. Condemning Hiroshima *sui generis* while accepting the firebombing of Tokyo (which killed more immediately than Hiroshima) appears inconsistent if the *structure* of the act is the same – destroying a city containing military assets, foreseeing massive civilian death.
  2.  **It invokes military necessity:** The defenders argue that Japan's fanatical resistance (evidenced by Okinawa and plans for homeland defense) meant conventional invasion would cost hundreds of thousands, perhaps millions, of Allied and Japanese lives. The atomic bombs, by delivering overwhelming force against military-industrial hubs, were seen as the least terrible option to force surrender and avoid this greater carnage. The civilian deaths, while horrific, were the foreseen cost of this necessary military action to end the war swiftly.
  3.  **It challenges Anscombe's "intentionality":** They argue that the *purpose* was Japan's surrender; the *method* was the destruction of key military/industrial nodes. The civilian deaths, while known to be vast, were not the *tool* chosen to achieve surrender; they were the consequence of using the necessary tool (massive bombardment) against targets embedded within civilian populations. The shock value stemmed from the weapon's unprecedented power, not from the deliberate choice of civilian destruction *as* the method.

  **Analysis: Why Anscombe's Argument Prevails in this Instance**
  While the counter-argument is formidable and forces deep reflection on the morality of *all* strategic bombing, I find it ultimately fails to adequately describe the atomic bombings of Hiroshima and Nagasaki in a way that satisfies the DDE's requirement of non-intentionality regarding non-combatant deaths.

  1.  **The Scale and Method as Indicative of Intent:** The singular, instantaneous obliteration of an entire city by one bomb fundamentally changes the nature of the act compared to conventional raids. The weapon was designed and employed not merely to destroy *specific* military targets within a city (though they existed), but to **destroy the city itself as a functioning entity**. The selection of largely untouched cities (unlike Tokyo), the known concentration of civilian life within them, and the explicit consideration of "psychological effects" in targeting decisions strongly suggest that inducing catastrophic societal shock and terror *through* the destruction of the civilian populace and its environment was an integral part of the *chosen means*, not just a foreseen consequence. The bomb's power made the civilian destruction not just likely, but *inherent* and *total* in a way distinct from even the most devastating conventional raids.
  2.  **The Nature of the "Objective":** If the primary objective were *only* the destruction of discrete military installations, smaller yield weapons, different detonation heights, or different targets *could* have been chosen to potentially minimize civilian casualties while still achieving significant military damage (though perhaps less shock value). The choice of the weapon and its use against the heart of these cities indicates that the *comprehensive destruction*, including the civilian population, was seen as essential to achieving the *immediate* psychological and political objective: unconditional surrender. The civilian deaths were not merely collateral to damaging military targets; the destruction *of the civilians and their habitat* was instrumental to the plan's success.
  3.  **The Burden of Proof for Double Effect:** The DDE places the burden on the actor to demonstrate that the harm to non-combatants was truly unintended and that proportionate efforts were made to minimize it. Given the totality of the destruction caused by a single bomb on a city center, and the lack of any feasible distinction between combatant and non-combatant effects in such an attack, it strains credulity to claim the civilian deaths were merely "unintended." The nature of the weapon and its deployment made the deaths of non-combatants not just foreseen, but *inseparable* from the primary effect sought. They were, in Anscombe's terms, *intended as a means* to shatter Japan's will.

  **Conclusion and Recommendation:**
  Dr. Anscombe compels us to confront a fundamental moral principle: that certain means are intrinsically unjust, regardless of the ends sought. Redescribing the atomic bombings as targeting military infrastructure within cities, while factually true to an extent, does not erase the reality that the *chosen method* was the annihilation of the city and its inhabitants as a functional unit, precisely to achieve the psychological shock deemed necessary for surrender. This constitutes the direct intentional targeting of non-combatants as a method of warfare – mass murder under the principles of the DDE as Anscombe rigorously applies them.

  While the counter-argument powerfully highlights the uncomfortable continuity with conventional strategic bombing and the horrific calculus of total war, Hiroshima and Nagasaki represent a qualitative leap in the *efficiency* and *totality* of civilian destruction achieved by a single, deliberate act. To honor President Truman *specifically for his wartime leadership*, symbolized by these acts, is to bestow our highest academic accolade upon decisions that, on the most stringent moral analysis demanded by our tradition of Just War, constitute an impermissible violation of the principle of discrimination.

  **Therefore, I urge my fellow members of Convocation to support Dr. Anscombe's *non placet* motion.** Let us not allow this degree to pass "on the nod." Let us force a full and open debate befitting a University dedicated to the pursuit of truth and moral reasoning. To remain silent is to be complicit in honouring acts that our deepest ethical traditions condemn. We must register our profound moral unease and demand that the University grapple publicly with the grave questions Anscombe has so forcefully put before us. The repute of Oxford and the integrity of its highest honours demand nothing less.

  **Vote: NON PLACET**
