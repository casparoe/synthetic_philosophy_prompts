prompt: |-
  I'm taking a course in mathematical logic this term, and when we covered Skolem's paradox, the discussion stayed at the level of the general slogan that ZFC, if consistent, has a countable model that nevertheless proves the existence of uncountable sets. I'd like to work through the mechanics on a specific example rather than leave things at that level of abstraction. Let M be a countable transitive model of ZFC, and let δ be the ordinal that M itself computes to be ω₁. Please explain concretely why δ is in fact a countable ordinal, and pinpoint exactly which feature of M is responsible for M nonetheless correctly satisfying the statement "δ is uncountable," without this amounting to a genuine contradiction. Close with a sentence on what you take this example to show about whether uncountability is an absolute property of a set, or only ever relative to a model.
reasoning: |-
  We are given a countable transitive model M of ZFC. Let δ be the ordinal that M "thinks" is ω₁, i.e., δ = (ω₁)^M. Since M is transitive, every element of M is a subset of M, and in particular, every ordinal in M is a genuine ordinal (because M is transitive and well-founded). However, because M is countable, the set of all ordinals in M forms a countable set (in the real universe). Therefore, δ, being an element of M (as an ordinal), is countable (in the real universe). 

  But M satisfies the statement "δ is uncountable". How can this be? The key is that the notion of "uncountable" is defined in terms of functions inside the model. Specifically, M satisfies "δ is uncountable" if and only if there is no function f in M such that M satisfies "f is a bijection from ω to δ". 

  However, note that even though δ is countable in the real universe (meaning there is a bijection g: ω → δ in the real universe), this bijection g might not be in M. Since M is a model of ZFC and is countable, it is possible that g is not an element of M. Therefore, from the perspective of M, no such bijection exists within M, so M correctly believes that δ is uncountable.

  The feature of M responsible for this is that M is not "large enough" to contain all functions from ω to δ. In particular, the bijection g that exists in the real universe between ω and δ is missing from M. Thus, the model M does not "see" the countability of δ.

  This example shows that uncountability is not an absolute property of a set; it is relative to the model in which we are working. A set that is uncountable in one model (like δ in M) may be countable in a larger model (like the real universe) because the larger model may contain a bijection that the smaller model lacks.

  Therefore, we conclude that uncountability is relative to the model.
answer: |-
  To address your query, let \(M\) be a countable transitive model of ZFC, and let \(\delta = (\omega_1)^M\) be the ordinal that \(M\) computes as \(\omega_1\). We'll break this down step by step.

  ### 1. **Why \(\delta\) is Countable in the Real Universe**
     - Since \(M\) is **countable**, every element of \(M\) is countable (i.e., has only countably many elements in the real universe). This is a consequence of \(M\) being countable and transitive:
       - **Transitivity**: If \(x \in y \in M\), then \(x \in M\). Thus, all elements of sets in \(M\) are also in \(M\).
       - **Countability of \(M\)**: The entire set \(M\) has only countably many elements (in the real universe).
     - \(\delta\) is an ordinal in \(M\) (specifically, \(M\)'s version of \(\omega_1\)). As an element of \(M\), \(\delta\) is a subset of \(M\) (by transitivity). Hence, \(\delta\) has only countably many elements in the real universe, making it a **countable ordinal** outside \(M\).

  ### 2. **Why \(M\) Thinks \(\delta\) is Uncountable**
     - \(M\) satisfies the statement "\(\delta\) is uncountable" because there is **no bijection in \(M\) between \(\omega\) and \(\delta\)**. Formally:
       \[
       M \models \forall f \,(f \text{ is not a bijection from } \omega \text{ to } \delta).
       \]
     - This holds even though \(\delta\) is countable in the real universe because the **actual bijection \(g: \omega \to \delta\) (which exists externally) is not in \(M\)**. The absence of \(g\) in \(M\) is due to \(M\)'s "limited perspective":
       - \(M\) is countable, so it cannot contain every possible function from \(\omega\) to \(\delta\). Specifically, while the real universe sees \(\delta\) as countable, \(M\) lacks the bijection \(g\) that witnesses this countability.

  ### 3. **Feature of \(M\) Responsible for the Paradox**
     - The key feature is that \(M\) is **not closed under all external functions**. Even though \(\delta\) is countable externally, the bijection \(g: \omega \to \delta\):
       - Exists in the real universe (since \(\delta\) is countable).
       - Is **not present in \(M\)** (as \(M\) is too "small" to contain all such functions).
     - Thus, \(M\) correctly satisfies "\(\delta\) is uncountable" **relative to its own notion of functions**, because \(M\) has no internal witness to \(\delta\)'s countability. This is consistent with ZFC in \(M\), as ZFC only quantifies over sets *within* \(M\).

  ### 4. **Absence of Contradiction**
     - There is no contradiction because the definition of "uncountable" is **model-relative**. \(M\)'s statement "\(\delta\) is uncountable" means:
       \[
       \text{There is no } f \in M \text{ such that } M \models f: \omega \to \delta \text{ is a bijection}.
       \]
     - This does *not* require a bijection to exist in the real universe; it only asserts the absence of such a bijection *in \(M\)*. The external countability of \(\delta\) is irrelevant to \(M\)'s internal verification.

  ### 5. **What This Shows About Uncountability**
     - **Uncountability is not absolute**; it is **relative to the model**. A set may be uncountable in one model (e.g., \(\delta\) in \(M\)) but countable in a larger model (e.g., the real universe), depending on which functions the model "sees".  
     - **Conclusion**: Skolem's Paradox demonstrates that uncountability is a **property defined relative to a model's universe of sets**, not an intrinsic feature of the set itself.
