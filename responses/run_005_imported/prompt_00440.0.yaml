prompt: |-
  I've been using a habit-tracking app that awards points for exercise, sleep, and healthy eating, with small rewards unlocked once my weekly score crosses a threshold. Lately I've noticed I'm choosing whichever actions raise my score fastest rather than the ones that actually improve my health—logging a five-minute walk instead of going for a real run, or splitting one meal into several entries to rack up logging credit. By the app's own measure I'm doing great, but I suspect I've quietly substituted the metric for the thing it was supposed to track. Is there a recognized way of thinking about what's going wrong here, and how would I go about correcting it without just scrapping the tracking system entirely?
