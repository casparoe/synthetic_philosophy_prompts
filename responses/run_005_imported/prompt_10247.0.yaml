answer: |-
  Your roommate is applying a narrow form of **economic rationality** (short-term self-interest), but your choice to pay was deeply rational when considering **human psychology, ethics, and long-term consequences**. Here's why:

  ### 1. **The "Rational Self-Interest" Trap**
     - **Roommate's Logic**: Since the service is already rendered, keeping the $300 has no *immediate* cost. Under a strict game-theory model (like a one-off Prisoner's Dilemma), "defecting" (not paying) seems optimal.
     - **The Flaw**: This ignores **psychological utility**. Stiffing the driver would likely cause you guilt, shame, or damage your self-image as trustworthy. Studies show such emotional costs often outweigh short-term gains ([Bénabou & Tirole, 2011](https://www.jstor.org/stable/23015663)). Paying $300 to avoid weeks of regret is rational.

  ### 2. **Reputation Isn't Just About Repeat Interactions**
     - Even if *you* never see him again, your integrity shapes **how you perceive yourself**. Acting against your values creates cognitive dissonance, eroding self-trust. As philosopher Harry Frankfurt noted, being "a person" requires caring about your own principles. Betraying them is a hidden cost.

  ### 3. **The Societal Rationality**
     - The driver trusted you based on a brief call. By paying, you **reinforce his heuristic** that most people are honest. If everyone acted like your roommate suggests, he'd stop helping stranded strangers. Your payment sustains a system where trust reduces transaction costs for everyone (a key insight from Elinor Ostrom's work on cooperation).

  ### 4. **Practical Wisdom > Abstract Theory**
     - Decision theory models often strip away real-world complexity. In practice:
       - **Signaling**: Paying signals to *yourself* and others (e.g., your roommate) that you keep commitments.
       - **Uncertainty**: Could there be unseen consequences? (e.g., the driver knows someone in your new town? A dashcam recording the interaction?)
       - **Emotional Capital**: The relief and pride you felt after paying have tangible value for mental well-being.

  ### 5. **Why It Felt "Wrong" to Cheat**
     - Humans evolved as cooperative beings. Psychologists like Jonathan Haidt show we have innate **moral intuitions** (fairness, loyalty) that override pure self-interest. Ignoring these triggers psychological distress—your brain warning against actions that could isolate you from the tribe.

  **Conclusion**: You made the *more* rational choice. Your roommate's view is myopic, ignoring:
  - The psychological cost of guilt
  - The value of a consistent identity
  - The broader impact on social trust

  **Decision theory in the real world must account for human nature**. As you experienced, ethics aren't sentimental—they're tools for sustainable living. Your payment wasn't just "nice"; it was a wise investment in your self-concept and the ecosystem of trust we all rely on. Well done.
