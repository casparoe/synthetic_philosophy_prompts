answer: |-
  Here's that dialogue, set in the dusty aisles of "Biblio's Basement," where Mara (a medieval philosophy grad student) and Leo (a retired political theory professor) keep circling back to Aquinas and tyranny:

  **The Setting:** The cramped "Philosophy & Theology" aisle at Biblio's Basent. Mara is scanning the S-T section. Leo, holding a worn copy of Augustine's *City of God*, spots her.

  **Leo:** (Chuckling) Mara! Still hunting for that elusive pristine *Prima Pars*? Or have you succumbed to the Aquinas tyranny debate vortex again?

  **Mara:** (Smiling wryly) Leo, always a pleasure. Actually, yes. That *Sentences* passage keeps nagging at me. I think we were too quick last time. Aquinas *does* carve out an exception for the usurper. "He who liberates his country by killing a tyrant is to be praised and rewarded." Pretty unambiguous in Peter Lombard's *Sentences* Commentary, Book II, Dist. 44. He contrasts the *tyrannus ex defectu tituli* (tyrant by defect of title) with the *tyrannus ex parte exercitii* (tyrant by exercise of power). Only the first seems open to... drastic private remedy.

  **Leo:** (Leaning against a shelf, setting Augustine down) Ah, Dist. 44. Classic. But Mara, you’re isolating that passage. You *have* to read it alongside *De Regno* (*On Kingship*), especially Chapter 6. That’s his mature, practical political treatise, written for a *king*. There, the caution is paramount. He explicitly warns against private individuals acting because the risks are too high: the killer might *fail* and make things worse, or succeed and set a precedent for *anyone* to kill *any* ruler they *think* is a tyrant. That way lies anarchy. "Public authority" must act.

  **Mara:** I’m not ignoring *De Regno*. But the distinction *is* fundamental. The usurper *lacks* legitimacy from the outset. He never had the "public authority" Aquinas talks about needing to act. He's fundamentally *outside* the legitimate political order. Killing him isn't overthrowing authority; it's removing a criminal impostor. Aquinas says such a tyrant "has no claim to be obeyed." The "public authority" needed to remove a *legitimate-but-bad* ruler might be a council, the nobility, or even the people collectively – but it’s a *process*. For the usurper? He *is* the crime personified. Private action isn't *ideal*, but Aquinas implies it might be the only recourse when the *real* public authority has been entirely usurped.

  **Leo:** You’re stretching "public authority" thin. Aquinas grounds legitimacy in serving the common good, derived ultimately from God. A legitimate king turned tyrant *still* holds the *office*, however badly. Removing him requires a higher *authoritative* judgment within the system – perhaps the Pope, or the community acting *as a body*, like the Romans deposing Tarquin. The *usurper* is indeed illegitimate, but who declares that? Any individual? That’s the core danger! Aquinas in *De Regno* says private action risks replacing one tyranny with another, often worse, fueled by vengeance or ambition. The *Sentences* passage praises the *result* – liberation – not necessarily endorsing the *private method*. It’s descriptive, not prescriptive.

  **Mara:** But look at his reasoning *in* the *Sentences*. He justifies praising the killer of the usurper precisely *because* the usurper "had no title to begin with" (*nullum habuit titulum in principio*). The risk calculus *changes*. There *is* no legitimate authority structure functioning under a pure usurper; he’s destroyed it. Aquinas *doesn't* say "only if a council approves." He says the liberator is *praised*. That implies moral approval of the *act itself* under those *specific* conditions. The caution in *De Regno* primarily targets killing a ruler who *was* legitimate, where the system for correction *should* still exist, however corrupted.

  **Leo:** And what constitutes "title," Mara? Medieval succession was messy. Was Henry Bolingbroke a usurper to Richard II? Was Edward IV? Aquinas knew history was full of contested claims. Declaring someone a "usurper" with *no* possible claim is often only clear in hindsight. That’s precisely why the *process* matters. Even against a usurper, Aquinas would argue the *best*, safest way is collective action – the people rising *together*, or a legitimate claimant acting. *De Regno*'s warnings about failed attempts and worse tyranny apply just as much to a private stab in the dark against a usurper as against a bad king. One fool with a dagger might get lucky, but likely just sparks a civil war.

  **Mara:** But Aquinas acknowledges reality. In the *Sentences*, he doesn't say "wait for a process that might not exist." He presents the private killer as a *de facto* liberator worthy of praise. He draws the line *exactly* at legitimacy-of-origin. A bad legitimate king still has subjects bound by a broken, but real, compact. The usurper? No compact exists. He rules purely by force and fraud. Removing him *is* akin to self-defense for the body politic. The risks are real, Leo, I grant you. Aquinas wasn't naive. But the *Sentences* shows he recognized a threshold where the danger of inaction outweighs the risk of private action *specifically* because no legitimate public mechanism remains. *De Regno* focuses on preserving the *system*; the *Sentences* acknowledges the system might be *dead* under a usurper.

  **Leo:** I maintain the *Sentences* passage is an early, theoretical point within a commentary on theology, not a practical political manual. *De Regno* is his mature counsel to a ruler *on ruling*. The emphasis on order, process, and the catastrophic risk of vigilantism is his consistent, bottom-line political principle. He might *praise* the *outcome* of liberation in a specific historical case study in the *Sentences*, but the *prescription* in *De Regno* is clear: private tyrannicide is *never* the safe or advisable course. "It is more consonant with apostolic teaching" to endure tyranny for a while than risk the greater evils of disorder and potential worse tyranny. That's the Aquinas you take to the real world. The distinction between usurper and bad ruler informs *who* should act (a claimant vs. the community), but *not* that it's suddenly okay for Joe Citizen to grab a sword.

  **Mara:** And I think you're downplaying the radical implications of his *Sentences* logic. The "title" distinction *isn't* just theoretical; it fundamentally changes the moral status of the ruler *and* the subject's relationship to him. The usurper is *hostis humani generis* – an enemy of the people. Killing him isn't "vigilantism" against authority; it's removing a *foreign* oppressor who possesses no true authority. Aquinas *praises* the act. He doesn't say "they got lucky despite the risk." He says they are *worthy of praise*. That's an affirmative moral judgment on the *private* act against the *specific* kind of tyrant. *De Regno* emphasizes prudence and process where possible, but the *Sentences* establishes the underlying principle justifying extreme action when the tyrant utterly lacks *any* legitimate foundation. They aren't contradictory; they're addressing different facets of a complex evil. The distinction *does* the work.

  **Leo:** (Sighs, picking up Augustine again) Then we remain at an impasse, Mara. You see the *Sentences* as revealing his core permission, tempered by prudence in *De Regno*. I see *De Regno* as stating his definitive political doctrine, with the *Sentences* being an interesting but non-prescriptive observation. Perhaps Aquinas himself wrestled with the tension. But if you ask me which text carries the weight of his considered political thought... (He taps the cover of *De Regno* peeking out of Mara's bag). For practical wisdom, the caution wins. Every would-be Brutus thinks *their* tyrant is the usurper.

  **Mara:** (Smiling, pulling her *De Regno* out) And every suffering people under a pure usurper might find their only hope in the principle Aquinas laid out... *there*. (She gestures vaguely towards the theology section). Same aisle next week? I think I saw a dodgy translation of John of Salisbury's *Policraticus* come in... he makes Aquinas look tame on tyrants!

  **Leo:** (Chuckling) Only if you promise not to plot any liberations in the meantime. See you next week, Mara. Happy hunting.

  **(They nod, turning back to the shelves, the unresolved tension of Aquinas's texts lingering in the dusty air.)**

  ## Key Points Debated

  1.  **The Distinction:** Leo argues it primarily informs *who* (claimant vs. community) should remove a tyrant, not *how* (private action). Mara argues it fundamentally changes the moral calculus, potentially justifying private action *only* against the usurper.
  2.  **Textual Priority:** Leo sees *De Regno* as Aquinas's mature, practical political doctrine. Mara sees the *Sentences* distinction as a core principle applied cautiously in *De Regno*.
  3.  **"Public Authority":** Leo interprets this strictly as a constituted body or process within (or above) the polity. Mara argues a pure usurper destroys this possibility, making private action a last resort analogous to self-defense.
  4.  **The "Praise":** Leo sees it as descriptive approval of the *result* of liberation, not prescriptive endorsement of the *private method*. Mara sees it as affirmative moral judgment on the private *act itself* against a usurper.
  5.  **Risk Assessment:** Both agree on the risks (failure, worse tyranny, chaos). Leo believes these risks categorically outweigh any justification for private action. Mara believes the unique nature of the usurper (no legitimacy, destroyed system) changes the risk-benefit analysis *in extremis*.
  6.  **Nature of the Usurper:** Mara emphasizes the usurper as an *outsider*, a criminal holding power by force alone, outside any legitimate framework. Leo emphasizes the difficulty of *knowing* who truly lacks "title" and the danger of individuals making that call.

  The dialogue captures the genuine scholarly tension around Aquinas's texts – a tension rooted in the inherent difficulty of applying abstract principles to the messy reality of tyranny. Neither Mara nor Leo is "wrong"; they prioritize different aspects of Aquinas's thought and weight the texts differently.
