prompt: |-
  So this is going to sound like a weird rabbit hole but bear with me. A while back my uncle and I got into it at a family dinner over whether it's ever actually okay to kill a dictator -- there'd been some news story, I don't even remember which one now -- and my cousin, who did like a year of history before dropping out, said "oh, Aquinas basically already argued this out 800 years ago, go read him." So I did, sort of. I picked up a cheap copy of On Kingship (the one written for the King of Cyprus) off a used book site, and then found people online quoting bits of his Commentary on the Sentences, and honestly he seems to be saying two different things depending on which book your in. In On Kingship he's really cautious about it, basically telling you to wait on "public authority" to deal with a tyrant, or just pray about it, because a private person taking matters into their own hands is too risky and could make everything worse. But in the Sentences thing there's a bit where he says someone who frees the people by killing a tyrant gets praised, and he seems to draw a line between a guy who just seized power with no real claim to begin with versus a legitimate king who's simply ruling badly -- like the second guy is more protected than the first.

  I can't tell if he's genuinely contradicting himself or if theres some way both bits are true depending on which kind of "tyrant" you're dealing with. Could you write me a dialogue between two people who've each actually sat with this stuff closely and land on opposite sides -- one person thinks Aquinas's real, considered position is that private tyrannicide is basically never okay, full stop, and it always has to go through some public or collective process (the caution in On Kingship is the bottom line, and the Sentences passage is really about resistance/disobedience, not killing), and the other thinks the usurper-vs-bad-legitimate-king distinction is doing real work for Aquinas and that he'd genuinely license an ordinary person killing a straight-up usurper, just not a badly behaving legitimate ruler. I want them to actually go back and forth on the specific texts and reasons -- the stuff about setting a bad precedent, the risk that a failed attempt makes the tyranny worse, what even counts as having "title" to rule in the first place -- instead of just each repeating their own view past the other. Feel free to stage it however, but I keep picturing two people who run into each other at the same used bookstore every couple weeks and just can't drop this argument.
