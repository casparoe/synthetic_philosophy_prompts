answer: |-
  ## The Lifeguard & the Void: A Dialogue on Omission

  **Setting:** The bustling lobby of a philosophy conference hotel. Clusters of academics mingle near coffee urns. **Dr. Anya Finch (Counterfactual Theorist)**, sharp-eyed and animated, spots **Dr. Elias Vance (Process Theorist)**, more reserved, examining the conference program.

  **Finch:** Elias! Caught your panel. Intriguing, but I must say, your dismissal of omissions as causes still feels like denying the sky is blue. Take that lifeguard case we discussed earlier – absorbed in their phone, swimmer drowns unnoticed. Surely, the *absence* of the lifeguard's intervention *caused* the death? If they’d acted, the swimmer lives. That counterfactual dependence *is* causation, pure and simple.

  **Vance:** (Sighs, putting down the program) Anya, the sky *is* blue because of photon scattering. Causation requires a *mechanism*, a physical process – energy transfer, force propagation. What process runs from the *non-event* of the lifeguard not diving in? Nothing. The causal story is the water entering the lungs, the physiological failure. The lifeguard’s omission is a hole in the causal net, a condition that allowed other causes to operate unhindered, but it’s not itself a cause. Calling it one is… a moral placeholder, not physics.

  **Finch:** A placeholder? Then explain why every court in the land, and every person on that beach, would rightly blame the *lifeguard’s* inaction, not just the water or the swimmer’s fatigue? If it’s merely a ‘condition’, why isn’t the absence of a passing dolphin or a sudden gust of wind equally blamed? Your ‘physical process’ account seems disconnected from how we actually *use* causation to assign responsibility.

  **Vance:** (Leans in slightly) That’s precisely where the shorthand comes in! We single out the lifeguard because of their *duty*, their *role*, the *expectation* built into the situation. The beach authority created a structure where *this specific person* was supposed to interrupt the causal chain leading to drowning. Their failure creates a *normative* void we fill with blame. But the *metaphysical* cause of death remains the water in the lungs. The absence of the dolphin isn’t expected or normatively required to intervene.

  **Finch:** So you concede we *treat* it as causal for practical and moral reasons, but insist it’s not *really* causal? That feels like having your cake and eating it too. And it doesn’t solve the core problem: *Why* does the lifeguard’s failure feel so *causally potent* in a way the absence of the dolphin doesn’t? Isn’t the counterfactual dependence – *but for* the lifeguard’s omission, death would not have occurred – capturing the real, operative difference-maker?

  **Vance:** It captures *a* difference-maker, Anya, but is it *the* cause? Or just one of infinitely many? That’s the problem with your counterfactual net – it catches far too much. If the lifeguard’s omission is a cause because *had they acted*, death wouldn’t have occurred, then so is the omission of *every single person* on the beach who didn’t happen to look up and notice the swimmer. So is the omission of the swimming instructor who failed to teach a better distress signal. So is the omission of the beach authority for not funding a second lifeguard. Your account makes *all* these non-actions causes of the single death. That’s absurdly permissive! The world isn’t causally overdetermined to that degree.

  **Finch:** (Pauses, conceding the point) Okay, yes. The counterfactual dependence *is* present for all those potential preventers. I’ll grant that. My account identifies them all as *difference-makers* in the broadest sense – their actions *could* have changed the outcome. But that doesn’t mean they are all *salient* causes, or equally responsible.

  **Vance:** But you called them *causes*. If they are all causes, what distinguishes the lifeguard? Only our *interest*? That reduces causation to mere pragmatics!

  **Finch:** Not *mere* pragmatics, but context matters! Causation *is* relative to a model of the world, to the variables we consider relevant. In the context of the beach, the lifeguard’s role is a *pre-empted potential cause* – their duty means they were *the* agent positioned to reliably prevent the harm. The other bystanders weren’t positioned or expected to act. The instructor’s omission occurred at a different time and place, setting a background condition. The authority’s funding decision is even further removed. The counterfactual dependence is *strongest* and *most direct* for the lifeguard *in that specific scenario*. My account identifies the lifeguard’s omission as *a* cause – the most salient and relevant one in that context – without denying that, in the vast web of counterfactuals, others *could* have made a difference. Responsibility then layers *on top* of that causal base, focusing on duties and capacities.

  **Vance:** So you retreat from saying the others *aren’t* causes? You just say they are less relevant? That seems like watering down your initial claim. And you still haven’t bridged the metaphysical gap: *What is the causal link?* What *connects* the non-diving to the drowning, physically? You have dependence, but dependence isn’t a *connection*, it’s a logical relation. The process account demands a *physical* connection.

  **Finch:** And your account, Elias, seems to demand a connection that doesn’t exist in the way you want it to for *prevention*. Prevention *is* about *absence* – stopping a process from happening. The ‘link’ is the *failure to initiate* the interrupting process. The counterfactual captures the *fact* of that failure making the difference. It *is* the connection in a world where possibilities matter. Your conserved quantity transfer works beautifully for billiard balls, but life is full of preventions and allowings. If your theory can’t handle the lifeguard – the paradigm case of responsibility for omission – without resorting to ‘quasi-causes’ and normative hand-waving, isn’t it failing to describe a fundamental aspect of how events unfold? Why does the law, and ordinary intuition, track the counterfactual so precisely if it’s not touching reality?

  **Vance:** (Takes a deep breath, looking thoughtful) You press hard, Anya. I concede the intuitive pull is immense. The law *does* track the counterfactual, and the lifeguard *is* uniquely responsible. Perhaps… perhaps the *duty* creates a *disposition* – the lifeguard *was disposed* to cause rescue. Their omission is the *frustration* of that disposition. But the disposition itself… it’s a potential, not an actual process. The drowning was caused by actual processes – water, biology – that the disposition, if activated, *would have* interrupted. But the disposition’s non-activation… it’s still not a *cause*. It’s the condition that allowed the harmful actual processes to complete. The law singles out the lifeguard because they held the frustrated disposition *by duty*. The bystander might have had a latent disposition, but no duty, so their omission is morally neutral, causally inert. The instructor’s disposition was activated (or not) long ago, setting a background capacity. The process account *can* accommodate the salience through the *specificity* of the frustrated disposition tied to duty, *without* making non-events into causes.

  **Finch:** But the disposition only exists *because* of the counterfactual! ‘Disposed to cause rescue’ *means* ‘if they saw distress, they would intervene and prevent drowning’. You’re smuggling the counterfactual back in to salvage the intuition! And you still haven’t told me *what physically happens* when the disposition is ‘frustrated’. Nothing! It’s just that the expected interrupting process *doesn’t start*. The difference *is* the counterfactual dependence. Maybe causation *is* fundamentally about difference-making in the space of possibilities. Maybe your physical processes are just the *vehicles* through which difference-making manifests in the actual world. For prevention, the vehicle is… the *absence* of the vehicle.

  **Vance:** (Shakes his head slowly, a small, weary smile) And there we are, Anya. Back at the chasm. You see the world fundamentally shaped by possibilities and dependencies. I see a world of actual, concrete processes. For omissions, your view gives a unified account of causation and responsibility but at the cost of inflation and potential vagueness about relevance. Mine keeps causation physically grounded but requires this awkward, perhaps irreducible, distinction between ‘real’ causes and ‘quasi’-causes for omissions, leaning heavily on normative context to explain salience and blame. The lifeguard’s phone… it’s a void for both of us. You see the void actively causing harm through its negative power. I see the void passively allowing the positive harm to proceed unchallenged. I doubt a conference coffee break will bridge that gap.

  **Finch:** (Returns the smile, raising her cup) Probably not. But at least we agree the lifeguard should be fired. And possibly sued. Metaphysics aside, the swimmer is still dead.

  **Vance:** (Raises his own cup in a small toast) On that, we have perfect, tragic agreement. Duty matters, even if causation… resists.

  *(They sip their coffee, the unresolved tension hanging in the air as lively conference chatter swirls around them.)*
