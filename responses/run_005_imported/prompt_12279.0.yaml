answer: |-
  Here's a toast that threads the needle—rigorous enough for philosophers, heartfelt for family, and anchored in David Lewis's convention theory without jargon. It runs about 3 minutes when spoken with pauses:

  ---

  **(Raise glass, smile at Priya and Daniel)**  

  Hi everyone. For those who don’t know me, I’m Priya’s very proud—and slightly terrified—kid sibling. When Priya asked me to toast her and Daniel, I’ll admit I panicked. Half of you could probably prove my feelings as theorems, and the other half actually changed my diapers. But then I remembered something Daniel taught me over Thanksgiving.  

  He explained David Lewis’s idea about conventions: like how when a phone call drops, we all just *know* the caller should call back. Not because it’s cosmic law, but because we all expect it, and we know everyone else expects it, and somehow that tiny shared understanding stops chaos. It’s a little arbitrary, but it *works* because we keep choosing it.  

  **(Turn to Priya and Daniel)**  
  You two joke that you don’t believe in soulmates—you believe in “coordination equilibria.” And I think that’s why your relationship is so real. Because what I’ve seen isn’t magic. It’s you both *deciding*, day after day, to pick solutions that work for both of you. Like when Priya’s working late, Daniel leaves her that specific brand of terrible gas-station coffee on her desk because he knows she likes it cold by 2 AM. Or how Daniel starts ranting about modal realism, and Priya doesn’t just nod—she *argues back*, even though she studies ethics.  

  **(Softer, to the room)**  
  Lewis would say conventions stick when they become common knowledge: “I know you know I know.” But isn’t that what love is? You two have built this quiet, relentless understanding. You don’t assume you’ll agree—you *coordinate*. You’ve created your own equilibrium: a way of being together so natural now, it feels inevitable. But Grandma? *(Smile at her)* In plain English? It’s not fate. It’s them choosing each other, again and again, until it becomes their world.  

  **(Direct to couple)**  
  So Priya and Daniel—yes, your love is arbitrary in the best way. It didn’t *have* to be you two. But you kept showing up. You turned tiny, thoughtful choices into something self-sustaining. Into a convention so deep, now none of us can imagine you apart. That’s more beautiful than any destiny.  

  **(Raise glass higher)**  
  To the ultimate coordination problem solvers. May your equilibrium hold forever.  

  ---

  **Why this works:**  
  - **Philosophers will catch:**  
    - Nods to Lewis’s "common knowledge" and arbitrariness.  
    - "Self-sustaining equilibrium" as a relational metaphor.  
    - The phone example (classic Lewis) grounding abstraction.  
  - **Grandma follows:**  
    - Concrete examples (coffee, arguing).  
    - Explicitly translates "equilibrium" → "choosing each other."  
    - Emotional throughline: love as daily intention.  
  - **Avoids clichés:** No "meant to be," "cosmic forces," or "perfect halves."  
  - **Personal:** Mentions their joke, includes specific quirks (gas-station coffee, modal realism).  

  **Delivery tip:** Pause after "Grandma?" and smile right at her. It’s a warmth anchor. If Daniel’s eyes light up at "modal realism," the philosophy table will feel seen. You’ve got this—they’ll love it.
