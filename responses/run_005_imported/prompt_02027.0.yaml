  | 8    | 1       | 0.0025 | 0.0900 | **0.0025** | **0.0900** |
  | 9    | 0       | (0-0.95)² = 0.9025 | (0-0.80)² = 0.6400 | 0.0925 | 0.1540 |
  | 10   | 0       | 0.9025 | 0.6400 | **0.1825** | **0.2000** |

  - **Dinah's Total Brier**: \(8 \times 0.0025 + 2 \times 0.9025 = 0.02 + 1.805 = 1.825\)  
    **Avg. Brier**: \(1.825 / 10 = 0.1825\)  
  - **Renata's Total Brier**: \(8 \times 0.09 + 2 \times 0.64 = 0.72 + 1.28 = 2.000\)  
    **Avg. Brier**: \(2.000 / 10 = 0.2000\)  
  **→ Dinah wins on Brier** (0.1825 < 0.2000).

  #### **Logarithmic Score Calculations**
  | Race | Outcome | Dinah's Log | Renata's Log | Dinah's Avg. Log (Cum.) | Renata's Avg. Log (Cum.) |
  |------|---------|-------------|--------------|-------------------------|--------------------------|
  | 1    | 1       | -ln(0.95) ≈ 0.0513 | -ln(0.70) ≈ 0.3567 | 0.0513 | 0.3567 |
  | 2    | 1       | 0.0513 | 0.3567 | **0.0513** | **0.3567** |
  | 3    | 1       | 0.0513 | 0.3567 | 0.0513 | 0.3567 |
  | 4    | 1       | 0.0513 | 0.3567 | **0.0513** | **0.3567** |
  | 5    | 1       | 0.0513 | 0.3567 | 0.0513 | 0.3567 |
  | 6    | 1       | 0.0513 | 0.3567 | **0.0513** | **0.3567** |
  | 7    | 1       | 0.0513 | 0.3567 | 0.0513 | 0.3567 |
  | 8    | 1       | 0.0513 | 0.3567 | **0.0513** | **0.3567** |
  | 9    | 0       | -ln(0.05) ≈ 2.9957 | -ln(0.20) ≈ 1.6094 | 0.3450 | 0.5000 |
  | 10   | 0       | 2.9957 | 1.6094 | **0.6402** | **0.6072** |

  - **Dinah's Total Log**: \(8 \times 0.0513 + 2 \times 2.9957 = 0.4104 + 5.9914 = 6.4018\)  
    **Avg. Log**: \(6.4018 / 10 = 0.6402\)  
  - **Renata's Total Log**: \(8 \times 0.3567 + 2 \times 1.6094 = 2.8536 + 3.2188 = 6.0724\)  
    **Avg. Log**: \(6.0724 / 10 = 0.6072\)  
  **→ Renata wins on Log** (0.6072 < 0.6402).

  ---

  ### **Why the Reversal Happens**
  **Both scoring rules are "strictly proper"**—they reward honest confidence—but **they penalize errors differently**:  
  - **Brier (quadratic)**: Penalizes large errors, but gently. A 95%→0% error costs \((0 - 0.95)^2 = 0.9025\).  
  - **Log (exponential)**: Punishes extreme errors catastrophically. A 95%→0% error costs \(-\ln(0.05) \approx 3.0\)—**6.6× worse** than Renata’s penalty for the same error (\(-\ln(0.20) \approx 1.6\)).  

  **Dinah’s boldness** wins under Brier because her 8 correct 95% calls yield tiny penalties (0.0025 each), outweighing her two large errors. But **Renata’s caution** wins under Log because her two errors are less catastrophic (1.6094 vs. 2.9957), and her moderate penalties when right (0.3567 vs. 0.0513) don’t accumulate enough to overcome Dinah’s disaster penalty.  

  **Boundedness isn’t the core issue**—it’s about **sensitivity to extreme errors**. Log score’s asymmetry (heavily punishing rare misses) clashes with Brier’s symmetry. In epistemic terms:  
  > *Brier prioritizes "calibration" (overall fit), while Log prioritizes "sensitivity" (avoiding ruinous errors).*  

  ---

  ### **Philosophical Implications: A Tension in Accuracy-First Epistemology**
  This reversal isn’t a quirk—it’s a **live problem** for accuracy-first epistemology:  
  - **Shrug-worthy?** To some, yes. Proper scoring rules agree on *how to score truthfulness* (your best bet is honesty), but disagree on *how to rank imperfect forecasters*. This might be a feature, not a bug—different contexts (e.g., elections vs. disaster planning) may demand different scores.  
  - **Real pressure?** Absolutely. If "accuracy" isn’t scoring-rule-invariant, grounding rational credence in a *single, objective measure* becomes shaky. Joyce, Pettigrew, and others wrestle with this:  
    - One response: Argue for a "privileged" scoring rule (e.g., Log for Bayesian updating).  
    - Another: Accept *pluralism*—accuracy is context-dependent.  
    - The risk: If no rule is "best," accuracy-first epistemology may fracture.  

  **Your characters’ stakes**:  
  > Dinah embodies Brier’s worldview—**confidence should be rewarded**.  
  > Renata embodies Log’s—**hubris must be punished**.  
  > Their rivalry mirrors a foundational debate: *Is rationality about avoiding regret or maximizing glory?*  

