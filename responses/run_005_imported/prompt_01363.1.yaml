prompt: |-
  Quick one for you — I'm working on a piece about AI systems that get to inspect each other's source code before acting, and I've gone down the 'program equilibrium' rabbit hole. I get the basic idea: each side submits a program that can read the other's code before choosing cooperate or defect in a prisoner's dilemma. What I cant wrap my head around is why the obvious version of this — cooperate iff the other program's code is literally identical to yours, I think it's called 'CliqueBot' — is apparently too fragile (it breaks if someone just renames a variable), and how the fix, where 'FairBot' uses Löb's theorem to actually prove the other bot will cooperate, avoids just pushing that same infinite regress up a level. Can you give me the gut-level intuition here, not the full provability-logic derivation — why does 'proving' the other program will cooperate sidestep the regress in a way that 'simulating' it doesn't?
