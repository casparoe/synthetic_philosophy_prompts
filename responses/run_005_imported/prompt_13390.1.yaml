  Example: Consider a statement that is a tautology, but the reasoner hasn't proved it yet. Assigning 0.5 would allow a trader to buy shares of this statement at 0.5, knowing that eventually it will be proven true (so the share will be worth 1). The trader can make a sure profit. The logical inductor avoids this by gradually increasing the probability as the proof is developed, so that the trader cannot buy at a fixed low price.

