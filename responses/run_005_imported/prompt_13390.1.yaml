  Now, how would a logical inductor update these beliefs over time?

  In the logical induction framework, there is a sequence of deductive steps (or "time steps") in which the reasoner (the logical inductor) gradually proves more theorems. At each step, it assigns probabilities to sentences based on what it has proven so far.

  Initially, the logical inductor might assign both A and B a probability of about 0.5, or it might have some prior. But let's assume it starts with no knowledge.

