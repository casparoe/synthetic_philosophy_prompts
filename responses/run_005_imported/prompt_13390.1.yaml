  But note: the logical inductor is designed so that it cannot be exploited by traders who know the equivalence before the inductor does. The market prices (probabilities) will adjust in a way that no trader can make a sure profit by betting on the discrepancy without already having the proof of equivalence.

  Now, contrast this with Bayesian updating on empirical evidence.

  In an empirical setting, if I have two hypotheses that are equivalent (say, two different descriptions of the same underlying state), then I would assign them the same probability. But in the deductive setting, the equivalence might be unknown.

  In the empirical case, updating happens when new data comes in. For example, if I have two hypotheses about a decay rate:

  H1: λ = λ1
  H2: λ = λ2

  and they are distinct, then I update as data comes in. But if I later learn that λ1 and λ2 are the same (say, by a mathematical identity), then I would merge the two hypotheses. But that merging is a deductive step.

  The key difference is that in the deductive setting, the evidence is not coming from the world (like detector counts) but from the mind's own deductive process. And the update is not conditionalization on new data but rather the realization of a logical connection.

  Moreover, in the logical induction framework, the reasoner does not wait until the proof is complete to adjust the probabilities. The probabilities change gradually as the proof is being developed. For example, when the reasoner starts to suspect that 11111_2 might be 31, but hasn't fully proved it, the probability of B might start to rise even before the conversion is complete.

  The logical inductor is designed to avoid Dutch books by clever traders who might try to exploit the temporary discrepancy. The traders represent possible deductions that might be made in the future. The inductor's prices are set so that no trader can make a sure profit without actually producing the proof (or at least, without the proof being eventually found).

  This is very different from the empirical case. In the empirical case, we update when new data arrives, and we don't (typically) update gradually as we are about to get the data. But in the deductive case, the update happens gradually as the proof is being constructed.

