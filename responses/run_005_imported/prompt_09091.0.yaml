prompt: |-
  Before retiring, I spent four decades in statistical mechanics, so "ergodic" already had a precise meaning for me by the time I stumbled across the "ergodicity economics" program associated with Ole Peters. Its central claim is that expected utility theory implicitly evaluates a gamble via an ensemble average across possible worlds, whereas any actual agent only ever lives through a single trajectory in time; replacing that ensemble average with the time-average growth rate of multiplicatively compounding wealth recovers Kelly-optimal betting — behavior extensionally equivalent to log-utility maximization — now derived as a theorem about dynamics rather than posited as a fact about psychology. Advocates describe this as replacing an "arithmetic," expectation-maximizing conception of rationality with a properly "geometric" one; critics reply that expected utility theory was never wedded to linear utility, that log-optimal growth strategies were well understood long before this rebranding, and that Samuelson's old objections to treating almost-sure long-run dominance as a universal decision criterion still stand. Rather than rehearsing either side's rhetoric, I would like you to locate the actual crux of the disagreement: is there some decision problem in which a committed "geometric rationalist" and a suitably calibrated expected-utility maximizer prescribe genuinely different actions, or does the whole dispute bottom out in framing rather than substance?
reasoning: |-
  Okay, the user is a retired expert in statistical mechanics with decades of experience, so they're very familiar with the term "ergodicity" in its original context. They've come across Ole Peters' "ergodicity economics" and want to understand the core disagreement between it and expected utility theory (EUT). They're not interested in the rhetoric from either side but want to know if there's a substantive difference in prescribed actions or if it's just a framing issue.

  First, I need to recall the main claims of ergodicity economics. Peters argues that EUT uses ensemble averages (averaging over possible worlds), but real agents experience only one time-averaged path. By focusing on the time-average growth rate of multiplicative wealth, they derive Kelly-optimal betting, which maximizes logarithmic utility. Critics say EUT already accommodates log utility and that Kelly was known long before.

  The user's main question is whether there's a decision problem where a geometric rationalist and a calibrated EU maximizer would choose different actions. If not, the dispute might be just about framing. So I need to find if such a scenario exists.

  I remember that for repeated bets, both approaches converge to Kelly if the utility function is logarithmic. But what about a single bet? Under EUT, with log utility, the optimal bet is the same as Kelly. However, if the utility function is different, say linear, then EU would maximize expected wealth, while geometric rationalists would still use the growth rate, leading to different recommendations. But critics would argue that EUT isn't tied to linear utility; it can use any concave function, including log.

  Ah, but here's a key point: Peters' approach treats non-ergodic processes differently. In cases where time averages and ensemble averages don't converge, the geometric approach uses time averages, while EUT uses ensemble averages. An example is a gamble with multiplicative noise and absorbing barriers. For instance, a bet where you can go bankrupt. In such cases, the ensemble average might be positive, but the time average could be negative due to ruin.

  A specific scenario: a gamble with a 60% chance to double wealth and 40% chance to lose everything. The ensemble average (expected wealth) is positive (0.6 * 2 + 0.4 * 0 = 1.2), so a linear EU maximizer would take it. But the geometric growth rate is (0.6 * ln(2) + 0.4 * ln(0)) which is undefined (ln(0) is -inf). So avoiding ruin is crucial. Geometric rationalists would reject such bets, while linear EU would accept. However, EUT with a utility function that goes to -inf at zero (like log) would also reject it. So if the EU maximizer uses log utility, they agree again.

  So where's the divergence? If the EU maximizer uses a utility function that doesn't explode to -inf at zero, say a power utility (CRRA) with risk aversion, but finite at zero. For example, u(w) = w^{1-γ}/(1-γ). If γ > 0, it's finite at w=0. For γ=1, it becomes log, which goes to -inf. But for γ=2, u(w) = -1/w, which at w=0 is -inf? Wait no, as w→0, u(w)→-∞ for γ>1. For 0<γ<1, u(0) is finite. So if γ=0.5, u(w) = w^{0.5}/0.5 = 2√w. At w=0, u(0)=0. So in the gamble above, EU = 0.6 * √2 + 0.4 * √0 ≈ 0.6*1.414 + 0.4*0 = 0.8484. If initial wealth is 1, the certainty equivalent is (0.8484 * 2)^2? No, utility is √w, so CE = (EU)^2. EU = 0.6*√2 + 0.4*0 ≈ 0.8484, so CE ≈ (0.8484)^2 ≈ 0.72 < 1, so they'd reject since CE < initial wealth. But if the gamble is favorable enough? Suppose a 90% chance to double, 10% to lose all. EU = 0.9*√2 + 0.1*0 ≈ 0.9*1.414 = 1.2726. CE = (1.2726)^2 ≈ 1.62 > 1, so they'd accept. But the geometric growth rate g = 0.9*ln(2) + 0.1*ln(0) → -∞, so geometric rationalists reject. Here, the EU maximizer with γ=0.5 accepts, while geometric rejects. So there's a difference.

  But is this a valid disagreement? The geometric approach requires avoiding ruin at all costs because ln(0) is -∞, but the EU maximizer with finite utility at zero might accept if the upside is high. So in this case, they differ.

  Another scenario: path-dependent risks where outcomes affect future opportunities. If a loss reduces future wealth, affecting compounding, the geometric approach accounts for the entire path. EUT with standard utility might not capture that unless utility is state-dependent or includes dynamic programming. But if EUT is applied myopically, it might overlook compounding effects.

  So the crux is in non-ergodic processes with absorbing states or irreversible losses, and when the utility function in EUT doesn't go to -∞ at ruin. Geometric rationality enforces avoiding ruin, while EUT with certain utility functions might accept such risks if the expected utility is high. This highlights a substantive difference in prescriptions for specific cases.
answer: |-
  The crux of the disagreement lies in **non-ergodic decision problems with absorbing states or irreversible losses**, where a "geometric rationalist" (following Peters' approach) and an expected utility maximizer with a *utility function bounded at zero* prescribe genuinely different actions. Below, I formalize a concrete decision problem demonstrating this divergence, followed by an analysis of why it occurs and when it vanishes.

  ---

  ### **Decision Problem: The Russian Roulette Gamble**
  Consider a single, non-repeated gamble with multiplicative dynamics and an absorbing ruin state:
  - **Initial wealth**: \( w_0 = 1 \) (normalized).
  - **Gamble**: With probability \( p = 0.9 \), wealth doubles (\( w \rightarrow 2w \)); with probability \( 1 - p = 0.1 \), wealth goes to **zero** (\( w \rightarrow 0 \)), and *all future wealth remains zero* (absorbing ruin).
  - **Agent choice**: Accept or reject the gamble.

  #### 1. **Geometric Rationalist's Prescription**
     - Evaluates the long-run *time-average growth rate* \( g \) of wealth:
       \[
       g = \mathbb{E}[\ln(w_t / w_{t-1})] = p \cdot \ln(2) + (1 - p) \cdot \ln(0).
       \]
       Since \( \ln(0) = -\infty \), \( g = -\infty \) regardless of \( p < 1 \).
     - **Action**: Reject the gamble. Any risk of ruin destroys the growth rate, making it catastrophically inadmissible.

  #### 2. **Expected Utility Maximizer's Prescription**
     - Uses a utility function \( u(w) \) and evaluates the ensemble average \( \mathbb{E}[u(w)] \).
     - **Calibration**: Suppose the agent has a constant relative risk aversion (CRRA) utility:
       \[
       u(w) = \frac{w^{1 - \gamma}}{1 - \gamma}, \quad \gamma > 0 \quad (\gamma \neq 1).
       \]
       - For \( \gamma < 1 \), \( u(0) = 0 \) (finite).
       - For example, \( \gamma = 0.5 \) (moderate risk aversion): \( u(w) = 2\sqrt{w} \).
     - Expected utility of the gamble:
       \[
       \mathbb{E}[u(w)] = p \cdot u(2) + (1 - p) \cdot u(0) = 0.9 \cdot 2\sqrt{2} + 0.1 \cdot 0 \approx 0.9 \times 2.828 = 2.545.
       \]
       Certainty equivalent wealth: \( w_{\text{CE}} = \left( \frac{\mathbb{E}[u]}{2} \right)^2 \approx \left( \frac{2.545}{2} \right)^2 \approx 1.62 > w_0 = 1 \).
     - **Action**: Accept the gamble. Expected utility exceeds \( u(w_0) = 2\sqrt{1} = 2 \).

  #### 3. **Result: Genuine Disagreement**
     - **Geometric rationalist**: Rejects (growth rate \( g = -\infty \)).
     - **CRRA EU-maximizer** (\( \gamma = 0.5 \)): Accepts (certainty equivalent > 1).

  ---

  ### **Why This Divergence Occurs**
  1. **Absorbing States & Non-Ergodicity**:
     - The gamble has a non-ergodic component: ruin (\( w = 0 \)) is an absorbing state. Ensemble averages (used by EU) and time averages (used by geometric rationality) diverge:
       - **Ensemble average**: \( \mathbb{E}[w] = 0.9 \times 2 + 0.1 \times 0 = 1.8 > w_0 \).
       - **Time average**: For a single trajectory, wealth \( \to 0 \) with probability \( 0.1 \), terminating growth.
     - Geometric rationality prioritizes survival by rejecting any risk of ruin. EU theory permits acceptance if \( \mathbb{E}[u(w)] \) is high, even with ruin risk.

  2. **Utility Curvature at Zero**:
     - Geometric rationality implicitly assumes \( u(w) = \ln(w) \), where \( u(0) = -\infty \). Any ruin risk dominates the calculation.
     - EU theory allows \( u(0) \) finite (e.g., \( \gamma < 1 \) in CRRA). Here, a high upside can offset ruin risk.

  3. **When Disagreement Vanishes**:
     - If the EU-maximizer uses \( u(w) = \ln(w) \), both agree: \( \mathbb{E}[\ln(w)] = -\infty \) → reject.
     - In repeated gambles *without ruin risk* (e.g., bounded losses), both converge to Kelly/log-optimal behavior under multiplicative dynamics.

  ---

  ### **Substantive vs. Framing Issues**
  - **Framing Agreement**:  
    Both sides agree that log-utility/Kelly betting is optimal for multiplicative growth in ergodic settings (e.g., repeated fractional bets with no bankruptcy). Critics rightly note this was known since Kelly (1956) and Merton (1969).
    
  - **Substantive Disagreement**:  
    Geometric rationality demands a **universal application of time averages** and treats ruin as *infinitely costly*, irrespective of context. EU theory treats utility as a flexible primitive:
    - For an agent with finite \( u(0) \) (e.g., a corporation with limited liability), accepting high-risk/high-reward gambles can be rational.
    - Geometric rationality rejects such gambles *even once*, viewing them as dynamically inconsistent.

  ---

  ### **Conclusion**
  The core disagreement is **substantive** and manifests in non-ergodic problems with irreversible losses (e.g., bankruptcy, death, or irreversible damage). Here:
  - **Geometric rationality** prescribes *pathological risk aversion* toward ruin, as \( g = -\infty \) dominates.
  - **EU theory** allows rational risk-taking if \( u(0) \) is finite and the upside compensates.

  This divergence exposes a philosophical rift:  
  - Peters' program elevates *survival and growth in a single trajectory* as the universal criterion.  
  - EU theory retains its normative flexibility, requiring agents to specify their utility function (including the cost of ruin) for the specific context.  

  Samuelson's critique endures: no single criterion (e.g., "no ruin risk" or "long-run dominance") is universally applicable. The geometric view is a special case—compelling for multiplicative wealth dynamics with ruin risk—but not a general replacement for EU theory.
