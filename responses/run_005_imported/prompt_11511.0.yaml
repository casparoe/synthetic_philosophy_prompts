  Okay, the user is in a medieval political philosophy seminar focusing on Aquinas's views on tyranny. They've presented a debate between two classmates and want me to adjudicate each move with scores and a final verdict. Let me start by recalling Aquinas's relevant texts: Sentences commentary, Summa Theologiae on homicide and sedition, and De Regimine Principum.

  First, classmate (1) claims Aquinas's view narrows over time. In the early Sentences, he allows killing usurpers openly, but in Summa's homicide article, that exception disappears, and later in De Regimine, he warns against private action. Hmm, checking the texts: Sentences does praise killing usurpers, but Summa II-II q.64 a.3 focuses on public authority without mentioning usurpers. De Regimine indeed cautions against private actions. So (1) has a point about textual changes.

  Classmate (2) counters that the distinction between usurpers and legitimate tyrants is consistent. She says Sentences only permits killing usurpers, who are like aggressors, not legitimate tyrants. The sedition article (Summa II-II q.42 a.2) supports this by saying resisting a regime serving private interests isn't sedition. This distinction seems valid. Aquinas consistently differentiates usurpers from bad rulers with legitimate titles.

  For (3), he argues that the homicide article should have restated the usurper exception if it still existed. But since it's not there, it implies Aquinas changed his view. However, Aquinas might see usurpers as a separate category—more like ongoing aggression than judicial punishment. The homicide article deals with punishment, not self-defense. So (3) might be overlooking that distinction.

  (4) responds that the homicide article isn't the right place for the usurper exception because resisting usurpation is self-defense, not punishment. De Regimine's caution is about practical feasibility, not withdrawing the permission. This makes sense. Aquinas emphasizes prudence; the permission exists but is hard to apply. The absence in the homicide article doesn't negate the exception.

  (5) claims that a permission that can hardly be exercised is useless and that the early praise was just glossing Cicero. But Aquinas's conditions (success, no worse outcome) are practical, not theoretical. The permission still stands in principle. Also, Aquinas references Cicero elsewhere, but it doesn't mean he's not endorsing it. So (5) might undervalue Aquinas's consistent principles.

  Both overlook that Aquinas's main concern is the common good. Usurpers directly threaten it, so immediate action might be justified. Legitimate tyrants require due process. Also, they might miss that Aquinas's later works emphasize avoiding greater evils, which is a practical extension, not a retraction. The distinction is stable, but application requires prudence.

  Assigning scores: (1) gets -1 for overstating narrowing. (2) gets +2 for correct distinction. (3) gets -1 for misunderstanding context. (4) gets +2 for explaining the homicide article's context and De Regimine's practicality. (5) gets -2 for dismissing the permission's validity. Overall, (2) and (4) are closer to the truth—Aquinas has a stable position with consistent distinctions.
answer: |-
  Here's a move-by-move adjudication with scores and justifications, followed by the overall verdict:

  ```json
  {
    "1": -1,
    "2": 2,
    "3": -1,
    "4": 2,
    "5": -2
  }
  ```

  **Justifications:**  
  - **Move 1 (-1): Partially mistaken.** While there's a *shift in emphasis* toward caution, (1) overstates "narrowing." The Sentences commentary specifically addresses *usurpers* (lack of title), while *De Regimine* warns against private action against *legitimate-title tyrants*. The homicide article omission is significant but doesn't erase the usurper distinction (as explained in Move 4).  
  - **Move 2 (+2): Clearly right.** She correctly identifies Aquinas's core distinction: *usurpers* (no title) vs. *tyrants by abuse* (valid title, bad rule). The Sentences praise applies *only* to usurpers, and the sedition article (II-II, q.42, a.2) implicitly supports this by exempting resistance to regimes serving only private interests from sedition charges.  
  - **Move 3 (-1): Mistaken.** He wrongly assumes the homicide article *should* contain the usurper exception. Aquinas treats usurpers as *ongoing aggressors* (like foreign invaders), making resistance akin to communal self-defense. The homicide article (II-II, q.64, a.3) concerns *judicial punishment of evildoers* under public authority – a different category.  
  - **Move 4 (+2): Clearly right.** She accurately contextualizes: resisting usurpation is *defensive*, not judicial punishment. *De Regimine*'s caution ("no worse successor," "chance of success") imposes *prudential conditions* on an extant permission (against usurpers), not a retraction. Aquinas consistently prioritizes avoiding greater harm.  
  - **Move 5 (-2): Clearly mistaken.** A permission with strict conditions isn't "no real work" – it sets moral boundaries. The "praised and rewarded" line aligns with Aquinas's later principles (e.g., sedition article). While Cicero influenced Aquinas, the latter integrates it into his systematic theology; dismissing it as mere youthful glossing ignores textual continuity.

  **Overall Verdict:**  
  **She comes closer to the truth.** Aquinas maintains one **stable doctrinal position** across texts:  
  1. **Usurpers (no title):** May be resisted/killed by private individuals to liberate the community (Sentences), akin to repelling an aggressor.  
  2. **Tyrants by abuse (valid title):** Require public authority for removal; private action risks greater harm (implied in homicide/sedition articles, explicit in *De Regimine*).  

  **What both overlook:**  
  - **The role of the common good:** Aquinas's consistency stems from prioritizing the *bonum commune*. Usurpers destroy the very foundation of authority (justice/order), justifying immediate defense. Tyrants with title corrupt an existing structure, requiring ordered removal.  
  - **Ecclesial authority:** Aquinas assumes the Church could guide resistance (e.g., deposing rulers for heresy). This context softens *De Regimine*'s caution – it’s not purely secular.  
  - **Developed conditions:** Later texts don’t retract the usurper exception but *add nuance* about prudential judgment (success probability, proportionality) – a refinement, not reversal.  

  **Key Takeaway:** The apparent "narrowing" reflects Aquinas addressing *different scenarios* (usurpation vs. abuse) and emphasizing *prudence*, not doctrinal change. Her distinction resolves the tension; his focus on textual omissions misses Aquinas's contextual logic.
