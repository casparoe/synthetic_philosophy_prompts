  Here’s a toast that threads the needle—grounded in theory but voiced in warmth, built around that driving detail, and designed to resonate across the room:

  ---

  **The Toast**  

  Everyone, glasses up for a moment? Thank you.  

  My sister has spent her career studying how living things—birds, insects, antelope—send signals to each other. Not with words, but with actions. With choices. The kind that say, clearly, *I am here. I am serious. This is real*.  

  Now, if you know her work, you might glance around today—at this backyard, these folding chairs, the ring she wears—and think: *Hmm. Where’s the grand gesture? The proof?*  

  And yes, on paper, you could tell a story where the quiet way they’ve chosen each other—no fireworks, no diamond mines—looks… unconvincing. Like a signal sent without enough cost behind it to be believed.  

  But here’s what I’ve learned watching them.  

  Real cost isn’t measured in dollars. Or carats. Or rented ballrooms.  

  Real cost is measured in hours. In consistency. In the quiet engine turning over, week after week, season after season.  

  For three years—before they shared a city, before they shared a home—this man got into his car. Friday night. Sunday afternoon. Four hours there. Four hours back. Through sleet, through heat, through the kind of tired that makes your bones ache.  

  He didn’t frame it as a sacrifice. He didn’t make a speech. He just… went.  

  And that? *That* is the signal you can’t fake.  

  It’s not a bright feather you flash when it’s easy. It’s the choice you make when it’s hard. The promise you keep when no one’s watching. The miles you put in, literally and figuratively, not to impress a crowd, but to reach one person.  

  Because the deepest signals aren’t about being seen by everyone. They’re about being true for someone.  

  So today, in this unassuming backyard, surrounded by folding chairs and love, we aren’t seeing a lack of proof. We’re seeing the opposite. We’re seeing evidence written in a language deeper than extravagance.  

  We’re seeing two people who built something real—not on grand gestures, but on the quiet, insistent pulse of showing up.  

  To my brilliant sister and her remarkable husband: Your love isn’t loud. It doesn’t need to be. Because every single one of us here feels its truth—in every mile driven, every choice made, every ordinary, extraordinary day you chose each other.  

  May your life together be as deep, as real, and as steadfast as the love that brought you here.  

  Cheers.  

  ---

  **Why This Works**  

  1.  **Theory as Subtext:** The toast never uses jargon ("handicap principle," "index signal," "Zahavi"), but the logic is precise:
      *   **Reframes Cost:** Shifts from monetary expense to *effort, time, and consistency* as the credible currency—aligning with the idea of "hard-to-fake" signals (index signals).
      *   **Highlights Honesty:** The driving story embodies a signal that's *inherently reliable* because it's too costly (in time/effort) to fake consistently over years—a core tenet.
      *   **Distinguishes Audience:** Explicitly contrasts "signaling to a crowd" (like flashy ornaments) vs. signaling *to your partner* (the true measure). Biologists will recognize this as separating Zahavian signaling (honest due to cost) from Fisherian runaway (driven by preference, potentially arbitrary).
      *   **Avoids the Peacock:** Uses "bright feather" as a subtle, passing metaphor experts will note but won't distract others.

  2.  **Central, Relatable Metaphor:** The driving story is the anchor. It's vivid, emotional, universally understood as commitment, and *perfectly* illustrates the "cost" in behavioral terms (time, effort, reliability). It *is* the proof.

  3.  **Warmth First:** The language is emotional and celebratory ("quiet engine," "insistent pulse," "ordinary, extraordinary," "steadfast"). The theory provides the *why* this quiet love is so powerful, but the *feel* is pure celebration.

  4.  **Respects the Room:**
      *   **Experts:** They’ll hear the correct logic ("signal you can't fake," "choice you make when it's hard," "measured in hours/consistency," "true for someone"). The "bright feather" line nods to their world without dwelling on it. They won't wince; they'll nod.
      *   **Non-Experts:** They hear a beautiful story about dedication, love, and showing up. The "proof" discussed feels natural in the context of commitment, not a biology lecture.

  5.  **Structure:** It’s one sustained argument: "You might think quiet love lacks proof → But real cost isn't money → Here's the real proof (the driving) → This *is* the undeniable signal → Your love is deep and true." It builds to the final, warm affirmation.

  6.  **Toast, Not Lecture:** It’s direct, personal, celebratory, and ends with a clear "Cheers." The biological concepts are the skeleton, not the skin.

  Deliver it with warmth, make eye contact with your sister and her partner during the driving part, and trust that the biologists will feel the intellectual satisfaction while everyone else simply feels the love. Congratulations to your sister!
