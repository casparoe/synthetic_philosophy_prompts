  First, I need to recall Davidson's framework. He uses decision theory to argue that an interpreter must assign beliefs and desires simultaneously, with charity constraining possible interpretations. Quine's indeterminacy of translation suggests that multiple meaning schemes can fit all behavioral data, making meaning indeterminate. Davidson extends this to mental states.

  For IRL, the problem is that without assumptions about the planning process, the same behavior can result from different reward functions paired with different models of planning. Solutions involve simplicity priors or cognitive assumptions, similar to charity in interpretation.

