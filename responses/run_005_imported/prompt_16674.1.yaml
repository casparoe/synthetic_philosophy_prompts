  Question 5 is the skeptical theism duel. Anticipating the "incompatibility" reply, the follow-up asks why God couldn't have morally sufficient reasons for temporary hiddenness. 

  Question 7 handles free will. The follow-up contrasts human relationships with visible persons to highlight the special pleading risk. 

