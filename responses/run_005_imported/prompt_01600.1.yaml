  The key challenge for the defender is whether the agent can consistently reject the first trade using a policy like "never accept something dispreferred to a rejected option." But the attacker might redesign the sequence to force acceptance.

  For the reverse money-pump angle:
  - Start by offering A- when agent has nothing
  - Then offer A for A- (which should be accepted since A > A-)
