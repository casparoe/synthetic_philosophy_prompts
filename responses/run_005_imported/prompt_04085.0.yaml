answer: |-
  The salt-scoured folk of Haven’s Hook had always known the sea was a fickle partner. Some seasons, nets strained silver; others, they came up empty, dragging despair back to shore. So they’d woven a safety net of their own: the Tide Ledger. Each haul, a tithe went into the common pot. When a boat was storm-wracked or nets mysteriously tore, the Ledger kept hearths warm and bellies full. It wasn’t charity, it was covenant. *We weather the lean together, because next time, the lean might be mine.*

  Then came the *Aeolus* project. A sleek satellite, they said, gifted by a mainland university studying micro-weather. Tiny sensors on every boat would feed data into a model so precise, it could predict *individual* catch yields for the coming week. Personal forecasts, delivered to each captain’s wrist-screen before dawn.

  Elara, captain of the *Stalwart*, woke to her first prediction: **72% Probability: Bountiful Haul (Cod/Sole) – Estimated Value: 8,000 Silver.** Her heart soared. She could pay off the mast repairs, maybe even upgrade her nets! Across the harbour, Kael on the *Waverider* stared at his screen: **89% Probability: Minimal Catch (Poor Conditions) – Estimated Value: 500 Silver.** A cold dread settled in his gut. Barely enough for bait, let alone food.

  That evening, at the Tide Ledger meeting, the air crackled. Elara, buoyant, suggested a smaller tithe this week – after all, she *knew* she’d have plenty to cover herself. Kael, pale, argued fiercely for the full tithe – his forecast guaranteed ruin without it. Others chimed in. Those with high-probability bounties – Lars, Mira, Ben – saw Elara’s point. Why subsidize the certain losers? Those with grim forecasts – Anya, Thom, Kael – pleaded for the covenant. "The sea changes!" Kael rasped. "What if *your* forecast turns sour next week?"

  But the numbers on their wrists were seductive, cold, and personal. The forecasts weren't perfect, but they were *probable*. Why pay for someone else's certain misfortune when you could bank your own certain gain? The logic was impeccable, individual. Elara felt a pang of guilt, but the 72% probability shone like a beacon. "It’s just practical," she murmured, avoiding Kael’s eyes.

  One by one, the captains with sunny forecasts voted to slash their tithes, "just this once." The Ledger received barely enough to cover a single broken oar. Kael sold his spare nets to buy flour.

  The next week, Elara’s haul was indeed bountiful – 7,900 Silver. Kael’s was worse than predicted: 300 Silver. He couldn’t pay his crew. The week after, Mira’s forecast promised gold, but a sudden, unpredicted squall shredded her nets. Her actual haul was near zero. She looked towards the Tide Ledger, but its coffers were bare. The captains who’d done well that week clutched their screens showing continued good fortune and stayed silent.

  The covenant didn’t shatter; it dissolved. Why share when you *knew* (or felt you knew) your own fate? Why rely on others when you *knew* (or feared you knew) they wouldn't help you? The *Aeolus* data, hailed as a gift of foresight empowering each captain, had meticulously dismantled the one thing that truly protected them all: the shared uncertainty that bound them to share the risk. Haven’s Hook didn’t drown in a single storm. It slowly starved, each captain isolated on the island of their own foretold fortune, watching the collective safety net they’d meticulously built unravel thread by thread, victim of the very knowledge meant to set them free. The greatest shelter, it turned out, had been their shared ignorance.
