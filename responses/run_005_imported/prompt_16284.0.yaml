  The user mentioned they pick the easiest option for themselves. That might lead to choices that aren't balanced. Over time, the roommate might build resentment. The absence of negative feedback doesn't confirm positive feelings; it's an absence of data. In ML terms, it's like having unlabeled data where the lack of labels doesn't imply a positive class.

