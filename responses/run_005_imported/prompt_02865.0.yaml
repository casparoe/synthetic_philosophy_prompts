  First, they’re bothered by what seems like Socrates switching criteria mid-argument—from practical effectiveness (getting to Larisa) to durability (staying in the soul). The user suspects this might dodge Meno’s original question about value. Second, they’re skeptical about Socrates linking "fastening" to recollection, seeing it as an unsupported leap. 

