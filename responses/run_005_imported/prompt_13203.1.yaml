  First, I need to recall social choice theory basics. The two methods here are sequential majority voting (applying majority rule to each criterion first) and direct vote on the final outcome. The key point is that these methods can yield different results because they aggregate preferences differently. 

  The user mentioned that each committee member has their own weighting of the three criteria. That's crucial. In the sequential approach, the majority decides each criterion independently, which might not reflect individual trade-offs. For example, a member might accept a weak method if the contribution is strong, but that nuance gets lost when criteria are voted on separately. 

  The paradox here resembles the Ostrogorski Paradox, where issue-by-issue voting conflicts with direct preferences. I should explain that. Also, Arrow's Theorem comes to mind—no perfect voting system exists, but that might be too abstract. The user needs practical advice, not just theory.

  They're in poli sci, so framing this in terms of committee governance and decision-making processes might resonate. Emphasizing that both methods have flaws but serve different purposes could help. The sequential method is transparent but rigid, while the direct vote respects individual judgment but might hide disagreements.

  The user's deeper need is probably to resolve the committee dispute. They might want arguments to present to colleagues. Highlighting that the inconsistency isn't about correctness but about the chosen process could reduce tension. Suggesting a discussion on their priorities—consistency across applications or individual discretion—might be useful.

  Also, considering the applicant's perspective: rejecting someone who passed each criterion separately seems harsh. But if most members oppose funding despite that, maybe there's an unspoken concern. The committee needs to decide what their process values more.

  I should avoid taking sides. Instead, present both methods' pros and cons. Recommend discussing the committee's goals. Maybe propose a third approach, like scoring, but that might complicate things. 

