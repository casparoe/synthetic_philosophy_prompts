answer: |-
  You've nailed the core tension in Rorty that trips up so many scientifically-minded readers. Your frustration is completely warranted – the "causal impact but no representational fit" move *does* feel like having your cake and eating it too. Let's break it down slowly, using your geophysics background for concrete examples. Forget "relativism" for now; Rorty *hates* that label because it implies he thinks "anything goes," which he doesn't.

  **1. Rejecting the Mirror: What Rorty Denies (The Representationalist Dream)**

  Imagine you're interpreting seismic reflection data to map an oil reservoir. The representationalist (the "Mirror of Nature" view) assumes:
  *   **The World Has Intrinsic Structure:** The subsurface *already* has discrete layers, faults, reservoirs carved out by nature itself.
  *   **Our Theories Aim to Match:** Your seismic processing algorithms and geological models are successful *because* they produce an image that "corresponds" to that pre-existing structure. The truth of your map lies in its *match* to reality.
  *   **Truth as Correspondence:** "The Brent Group sandstone reservoir is at 2500m depth" is true *because* there is a mind-independent fact "out there" (the actual reservoir at 2500m) that the sentence corresponds to.

  **Rorty rejects this entire picture.** He argues:
  *   The world *causes* our sensory inputs (the raw seismic wiggle traces), but it doesn't come pre-packaged into "layers," "faults," or "reservoirs." Those are *our* ways of *describing* the causal inputs, developed because they are *useful* for our purposes (finding oil, understanding geology).
  *   **There is no "God's Eye View"** from which to judge if our map "matches" the territory. All we ever have are *other descriptions* (more seismic data, well logs, core samples, different theories) against which we check our current description.

  **2. Affirming Causation: What Rorty Keeps (The World Kicks Back)**

  Rorty isn't denying the world exists or that it constrains us:
  *   If you misinterpret the seismic data and drill in the wrong spot, you hit salt, not oil. **The world causes disappointment.** (`kick_the_rock` = `drill_dry_hole`).
  *   Your raw sensory input (the seismic signal) is *caused* by physical processes in the subsurface (acoustic impedance contrasts). Light bounces, rocks hurt feet, seismic waves reflect off interfaces. **Causation is real.**
  *   The world is *not* putty in our hands. We can't just *decide* that salt is oil or that kicking a granite boulder won't hurt. Our descriptions must be responsive to the causal inputs to be useful. "Useful" here means helping us *cope* and *predict*.

  **3. The Davidsonian Move: Causation ≠ Justification (The Crucial Split)**

  Here's where Donald Davidson comes in, and it's the key to resolving your tension. Davidson (and Rorty following him) makes a sharp distinction:

  *   **Causation:** A *physical* relation. The subsurface rock properties *cause* the seismic signal. Kicking the rock *causes* nerve impulses. This is the realm of physics, chemistry, biology.
  *   **Justification:** A *logical/conceptual/social* relation. Why do you *believe* the reservoir is at 2500m? You justify it by:
      *   Pointing to the processed seismic section showing a bright spot.
      *   Referencing the amplitude-versus-offset (AVO) analysis.
      *   Correlating with nearby well logs.
      *   Appealing to rock physics models.
      *   Your peers agreeing after reviewing your work.

  **The Critical Point:** *The world causes you to have sensory inputs (seismic traces, pain), but it does NOT provide the justification for your beliefs.* **Justification always happens *within* the space of reasons, within our current web of beliefs, language, and social practices.** The rock causes the pain, but "This is a hard rock" is justified by its coherence with our other beliefs about rocks, feet, pain, physics, etc., *not* by some direct comparison between the sentence and a "rock-in-itself."

  **4. How This Avoids Collapse: Instrumentalism vs. Relativism**

  *   **Avoiding Boring Instrumentalism:** Yes, Rorty sounds instrumentalist ("theories are tools for prediction and control"). But he goes further. Instrumentalism often *presupposes* a reality the tools are *really* latching onto, even if we can't know it perfectly. Rorty rejects that presupposition. For him, the *only* sense in which a theory is "better" is that it lets us *do* more things we want to do (predict earthquakes better, find more oil, build stabler bridges, have more coherent conversations with other scientists) *compared to previous descriptions*. It's not "better because closer to Reality," it's "better because more useful *for us* in this context." This usefulness *is* constrained by the world's causal powers (e.g., you can't use a theory that ignores gravity to build a bridge that stands, no matter how useful you *wish* it was).
  *   **Avoiding Relativism ("Anything Goes"):** Rorty's "justification is social" doesn't mean *any* belief is as good as any other. Beliefs must:
      1.  **Cohere** with the vast web of our *other* currently accepted beliefs (physics, geology, sensory reports).
      2.  **Prove Useful** in helping us navigate the causal world (find oil, avoid pain, communicate effectively).
      3.  **Withstand Social Scrutiny** within relevant communities (peer review in geophysics journals). The constraints are immense! You can't justify believing the reservoir is made of marshmallow fluff because it utterly fails coherence (contradicts rock physics), usefulness (you'd never find oil), and social scrutiny (your peers would laugh you out of the room). "Truth" for Rorty is something like *"what you can defend against all comers here and now,"* which is incredibly demanding and *not* subjective whim.

  **Geophysics Example: Plate Tectonics**

  *   **Causation:** The earth's internal heat, mantle convection, rock properties *cause* observations: mid-ocean ridges, magnetic striping, earthquake distributions, mountain ranges, GPS plate motion vectors.
  *   **Justification (Then):** Pre-plate tectonics, geologists justified beliefs about fixed continents, land bridges, or contracting earth models based on coherence with *then-accepted* physics, geology, and available data (even if awkwardly).
  *   **Justification (Now):** Plate tectonics is justified because:
      *   It *coheres* incredibly well with modern physics (rheology, heat flow), geochemistry, seismology, geodesy.
      *   It is *immensely useful* for predicting earthquakes, volcanoes, locating resources, understanding mountain building.
      *   It withstands *intense social scrutiny* within the global geoscience community.
  *   **Rorty's Point:** Plate tectonics isn't "true" because it finally "mirrored" the pre-existing plate structure of the earth. The earth *caused* the observations that led to it, but the *truth* of the theory lies in its current **undeniable utility and coherence within our best web of scientific beliefs and practices**. It solved problems previous descriptions couldn't solve as well. If a radically better description emerged tomorrow (one that let us predict megaquakes perfectly, unlock limitless geothermal energy, etc.), *that* would become "true," not because it matches "Reality" better in some absolute sense, but because it *works better for our purposes*.

  **Why it's not just wordplay:**

  Rorty is trying to shift our focus from a **metaphysical** question ("Does this map *really* match the territory?") to a **pragmatic** one ("What new and interesting things can we *do* with this description? Does it solve problems the old one couldn't? Does it let us talk to more people effectively?").

  The world's causal impact ensures we aren't fantasizing. We are forced to constantly adjust our descriptions to cope with it. But "truth" isn't bestowed by the world matching our sentences; it's a compliment we pay to beliefs that are currently indispensable within our human practices of justification and inquiry. It's not that reality isn't "out there"; it's that "truth" isn't a matter of picturing it correctly, but of describing it in ways that serve our evolving purposes exceptionally well.

  This *is* a radical challenge to the "map-making" metaphor you lived by, and it's no wonder it messes with your head! Philosophers are *still* arguing about whether Rorty successfully avoids collapsing into instrumentalism or relativism, or whether he throws out the baby (robust objectivity) with the bathwater (naive representationalism). But hopefully, seeing the Davidsonian split between **causal oomph** and **social/logical justification** clarifies his core move. The world pushes us, but only *we* decide what counts as a good push.
