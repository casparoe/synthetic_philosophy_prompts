  The constitutional analogy they drew is remarkably perceptive. Both systems do share that "tie yourself to the mast" DNA. But the differences are crucial. For their brother, the "future self" isn't just politically different but neurologically compromised. That changes everything about consent and identity continuity. 

  Jon Elster's work feels essential here. His distinction between passion-driven vs interest-driven choices explains why we might distrust manic decisions but trust constitutional amendments. And his "self-binding as self-liberation" framing could help the user see the contract as empowerment rather than restriction. 

  The revocability point is thorny. Constitutions have amendment procedures because societies evolve. But bipolar episodes aren't "evolution" - they're transient states. The contract's non-revocability during mania isn't paternalism; it's honoring the self that understood the illness pattern. 

  I should emphasize that in psychiatry, the "earlier self" is considered the authentic one because it's neurologically intact. That's fundamentally different from constitutional originalism debates. Maybe use the "fever delirium" example to make this concrete. 

  The user's worry about overriding present wishes is valid. The ethical safeguard is that the contract only applies during verified mania - it's time-limited incompetence, not permanent disenfranchisement. That distinction matters. 

  They've done impressive research already. Nodding to their Elster awareness while explaining his key contributions (like the strategic precommitment vs internal willpower distinction) would respect their intellectual effort. The "democratic paradox" angle might particularly resonate given their political theory interest. 

