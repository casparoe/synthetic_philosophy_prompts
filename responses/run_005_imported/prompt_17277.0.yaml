  First, I need to unpack why this is such a big issue for them. With three interleaved timelines and many characters, each fact is interconnected. Changing one event in Timeline A might affect a character's backstory in Timeline C, which then impacts their actions in the present timeline. The user feels they have to manually check everything because they don't have a system to track dependencies.

