  Then there's the skepticism question. At first glance, al-Ghazālī seems wilder—God could make fire not burn!—but Hume might actually be more radical. Al-Ghazālī has a real cause (God), just hidden; Hume has no cause at all, only mental glue. The user senses this irony and wants it confirmed: Does divine agency paradoxically make the world *more* dependable for science than Hume's mental habits?  

