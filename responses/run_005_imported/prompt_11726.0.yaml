  - **Evidentiary retributivism** can argue that the outcome provides evidence that the culpability was higher. Even if we stipulate that the drivers were equally reckless, the occurrence of harm might suggest that the first driver was actually more reckless (e.g., in a way that wasn't observable). However, this might be seen as a bit of a dodge because we are assuming equal culpability.

  - **Risk/endangerment-calibrated retributivism**: One might argue that the driver who caused harm demonstrated a higher level of endangerment because the risk actually materialized. But the risk at the time was the same. However, if we think of desert as being tied to the harm that actually occurs, then it might be similar to resultant luck. Alternatively, we might say that the act of causing harm is a worse act than merely risking harm, even if the risk was the same.

