  We are ranking the positions based on how well they can justify punishing a completed harm more severely than an equally culpable failed attempt using desert (retributivism) alone, without appealing to deterrence.

  The positions:

  1. **Pure culpability-based (harm-independent) retributivism**: This view holds that desert is based solely on the actor's culpable state of mind and the quality of their will, without regard to the outcome. Thus, the two drivers should be punished equally. It cannot justify harsher punishment for the completed harm.

  2. **Resultant-luck-inclusive retributivism**: This view accepts that luck in the outcome can affect desert. Even though the drivers had the same culpability, the one who caused harm deserves more punishment because the actual harm is part of what makes the act more blameworthy.

  3. **Character-based retributivism**: Desert is based on the actor's character. The argument might be that causing harm reveals a worse character, or that the completed harm is evidence of a more dangerous character. However, if both were equally reckless, their character might be judged the same.

  4. **Risk/endangerment-calibrated retributivism**: This view focuses on the degree of risk created. The reckless driver who killed someone created a high risk that materialized, while the other created the same risk but it didn't materialize. However, the risk was the same at the time of acting. Some versions might say that the actual harm shows the risk was more real, but that might be circular.

  5. **Evidentiary retributivism**: The outcome is not intrinsically part of desert but is evidence of the level of culpability. For example, the fact that harm occurred might be seen as evidence that the driver was even more reckless than it appeared, or that their recklessness was more extreme. But if we stipulate that the culpability is equal, this might be a stretch.

  Ranking by how convincingly they can justify the harsher punishment for the completed harm:

