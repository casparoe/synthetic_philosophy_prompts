prompt: |-
  After thirty-odd years in geophysics, I've spent much of my retirement finally reading the philosophers I never had time for, currently working through Locke's *Essay Concerning Human Understanding* alongside some secondary literature on higher-order theories of consciousness (Rosenthal, Armstrong, Lycan). I keep returning to this passage from Book II, Chapter XXVII, §9, where Locke tries to pin down what a "person" is:

  "This being premised, to find wherein personal identity consists, we must consider what person stands for;—which, I think, is a thinking intelligent being, that has reason and reflection, and can consider itself as itself, the same thinking thing, in different times and places; which it does only by that consciousness which is inseparable from thinking, and, as it seems to me, essential to it: it being impossible for any one to perceive without perceiving that he does perceive. When we see, hear, smell, taste, feel, meditate, or will anything, we know that we do so. Thus it is always as to our present sensations and perceptions: and by this every one is to himself that which he calls self:—it not being considered, in this case, whether the same self be continued in the same or divers substances. For, since consciousness always accompanies thinking, and it is that which makes every one to be what he calls self, and thereby distinguishes himself from all other thinking things, in this alone consists personal identity, i.e. the sameness of a rational being: and as far as this consciousness can be extended backwards to any past action or thought, so far reaches the identity of that person; it is the same self now it was then; and it is by the same self with this present one that now reflects on it, that that action was done."

  The clause "impossible for any one to perceive without perceiving that he does perceive" reads, at first glance, like an early statement of a higher-order theory: a mental state is conscious only in virtue of a further mental act directed at it. But Locke seems to make this second-order perceiving necessary and simultaneous, whereas Rosenthal-style HOT theory and Armstrong/Lycan-style HOP theory both treat the higher-order state as a distinct, only contingently connected existent, which is precisely what generates their targetless-state and misrepresentation problems. Given that, would you say this passage commits Locke to something closer to a genuine higher-order view, or to something nearer a same-order/self-representational monitoring theory, and does the fact that he deploys it to define personal identity rather than to explain what makes a single mental state conscious suggest he is simply not answering the question later higher-order theorists are asking?
