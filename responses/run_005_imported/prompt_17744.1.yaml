answer: |-
  Let's unpack "safe Pareto improvements" (SPIs) step by step, addressing your intuition about trust/private information and contrasting it with mediators. We'll use a toy example to clarify mechanics and why non-trivial SPIs aren't always possible.

  ### Core Idea: Safety Against Deviations
  - **Pareto improvement (PI)**: An outcome where ≥1 agent is strictly better off, and no one is worse off, relative to a **baseline** (e.g., Nash equilibrium, status quo).
  - **"Safe" qualifier**: An SPI is a **strategy profile** where:
    1. **Safety**: If you follow the SPI strategy, you get *at least your baseline payoff* **no matter what others do** (even if they deviate).
    2. **Improvement**: If *all* follow the SPI, the outcome is a strict PI over the baseline.

  Safety protects against **unilateral deviations by others**, ensuring you never fall below your baseline. The baseline is typically a "safe" outcome itself (e.g., Nash equilibrium).

  ### Why Not Just a Mediator?
  - **Mediation/revelation principle**: Requires a trusted mediator and truthful revelation of private information. Agents must trust the mediator *and* that others won't lie.
  - **SPI**: No mediator needed. Agents use **publicly observable signals** (e.g., coin flips) to coordinate. Crucially:
    - You don't reveal private information.
    - Safety holds even if others ignore the SPI strategy (no trust required).
    - Works in **one-shot interactions** without repeated play.

  ### Toy Example: The Investment Game
  **Players**: Alice (A) and Bob (B).  
  **Actions**: Each chooses to invest (`I`) or not invest (`N`).  
  **Private information**: Each knows their own investment cost (not observable to the other).  
  - Alice's cost: `c_A` ~ Uniform[0, 2]  
  - Bob's cost: `c_B` ~ Uniform[0, 2]  

  **Payoffs**:  
  - If both invest: Each gets `4 - c_i`  
  - If one invests and the other doesn't: Investor gets `1 - c_i`, non-investor gets `3`  
  - If neither invests: Both get `0`  

  **Baseline**: No one invests (Nash equilibrium).  
  - Why? If you expect the other not to invest, your best response is `N` (investing risks `1 - c_i < 0` if `c_i > 1`).  
  - Baseline payoff: `0` for both.  

  ---

  ### Step 1: A Pareto Improvement Exists...
  Consider a **direct revelation mechanism**:  
  - Agents report costs `c_A`, `c_B` to a trusted mediator.  
  - Mediator instructs both to invest if `c_A ≤ 1.5` and `c_B ≤ 1.5`; else, no one invests.  

  **Result**:  
  - If both have low costs (`c_i ≤ 1.5`), both invest → payoff `4 - c_i ≥ 2.5 > 0`.  
  - If either has high cost (`c_i > 1.5`), no investment → payoff `0` (same as baseline).  
  - **This is a PI**: Strictly better when costs are low; same otherwise.  

  **Problem**: Requires truthful reporting and a trusted mediator. If Alice lies about her cost, she might free-ride (e.g., report high cost when `c_A` is low to get `3` while Bob invests).

  ---

  ### Step 2: ...But Can We Make It *Safe* Without a Mediator?
  **Goal**: Find an SPI strategy using a **public signal** (e.g., a coin flip).  
  - Public signal: Random variable `s` ~ Uniform[0, 2] (observable to all).  

  **Proposed SPI strategy**:  
  > "If your cost `c_i ≤ s`, invest (`I`). Else, don't invest (`N`)."  

  #### Safety Check (for Alice):
  - Alice's payoff if she follows SPI:  
    - If `c_A ≤ s`, she invests. Her payoff depends on Bob:  
      - Bob follows SPI: Invests if `c_B ≤ s` → Alice gets `4 - c_A` (if Bob invests) or `1 - c_A` (if Bob doesn't).  
      - Bob **deviates** (never invests): Alice gets `1 - c_A`.  
    - If `c_A > s`, she doesn't invest → always gets `3` (if Bob invests) or `0` (if Bob doesn't).  

  - **Is Alice safe?** (i.e., does she get ≥ baseline `0` regardless of Bob?)  
    - Case 1: `c_A ≤ s` → min payoff is `1 - c_A` (if Bob doesn't invest). Since `c_A ≤ s ≤ 2`, `1 - c_A ≥ 1 - 2 = -1`, which **can be negative**!  
      - Example: `c_A = 1.8`, `s = 1.9` → Alice invests. If Bob doesn't invest, she gets `1 - 1.8 = -0.8 < 0`.  
    - **Not safe**! Alice can lose money if Bob deviates.

  #### Why Safety Failed
  - When `s` is high, high-cost agents invest and risk negative payoffs if others don't reciprocate.  
  - Baseline (`0`) is not guaranteed because the strategy forces investment for some `c_i > 1` (where investing alone is risky).

  ---

  ### Step 3: A Working SPI
  **Revised SPI strategy**:  
  > "If your cost `c_i ≤ 1`, invest if `s ≥ 1`. Else, don't invest."  

  *(Here, `s ~ Uniform[0,2]` is still public.)*  

  #### Safety Check (for Alice):
  - If Alice follows strategy:  
    - If `c_A ≤ 1`:  
      - Invests only if `s ≥ 1` → payoff `4 - c_A` (if Bob invests) or `1 - c_A` (if Bob doesn't).  
      - Since `c_A ≤ 1`, `1 - c_A ≥ 0`.  
    - If `c_A > 1`: Never invests → payoff `3` (if Bob invests) or `0` (if Bob doesn't).  
  - **Always ≥ 0**!  
    - Worst case: `c_A ≤ 1` and Bob doesn't invest → `1 - c_A ≥ 0`.  

  #### Improvement Check (if both follow):  
  - Both invest only if `c_A ≤ 1`, `c_B ≤ 1`, and `s ≥ 1` → payoff `4 - c_i ≥ 3 > 0`.  
  - If `c_i > 1` or `s < 1`, no investment → payoff `0` (same as baseline).  
  - **Strict PI**: When both have `c_i ≤ 1` and `s ≥ 1`, both are strictly better off.  

  **Key**:  
  - Low-cost agents (`c_i ≤ 1`) only invest when `s ≥ 1` (50% of the time), ensuring they never risk negative payoffs.  
  - High-cost agents never invest, so they never lose.  
  - **No private info revealed**: Agents only observe `s`, not others' costs or actions.

  ---

  ### Why Non-Trivial SPIs Aren't Always Possible
  An SPI fails if:  
  1. **No Pareto improvement exists** (baseline is Pareto efficient).  
  2. **All PIs require "unsafe" actions**:  
     - Example: Prisoner's Dilemma. Baseline: (Defect, Defect) → (1,1).  
     - PI: (Cooperate, Cooperate) → (3,3).  
     - But if Alice cooperates and Bob defects, Alice gets `0 < 1`.  
     - No SPI strategy exists where:  
       - Cooperating is safe (guarantees ≥1 regardless of Bob).  
       - Defecting yields (1,1), not a strict PI.  

  3. **Private information constraints**:  
     - In the Investment Game, if costs could be >2 (e.g., `c_i ~ Uniform[0,3]`), the SPI above breaks because `1 - c_i` can be negative for `c_i > 1`.  
     - Revised SPI might need `s` to be lower, reducing the probability of improvement.

  ---

  ### Key Takeaways
  - **Safe against**: Unilateral deviations by others (no trust needed).  
  - **Baseline**: Typically a Nash equilibrium/status quo.  
  - **Mechanics**: Use **public signals** to coordinate, ensuring:  
    - Following the strategy guarantees ≥ baseline payoff.  
    - Mutual adherence yields strict PI.  
  - **vs. Mediation**: SPIs don't require revelation of private info or trust in others/mediators.  
  - **Non-existence**: If baseline is Pareto efficient, or all PIs require agents to risk payoffs below baseline when others deviate.
