prompt: |-
  okay so for my AP research project i've been going down an AI safety rabbit hole, and i keep seeing "wireheading" and "reward tampering" used like they're basically the same thing. but then i read alex turner's "reward is not the optimization target" post, which seemed to argue that classic wireheading -- the agent literally hacking its own reward signal to get max reward -- isn't actually the default thing a trained RL agent would want to do, since reward acts more like a chisel shaping its policy than a goal its explicitly pursuing. can you explain the actual conceptual difference between wireheading and reward tampering more broadly, and why that "reward isn't the target" idea is supposed to make wireheading less likely rather than more? bc it still seems to me like if an agent COULD mess with its own reward and get more of it, it just... would, so i feel like im missing smth here.
