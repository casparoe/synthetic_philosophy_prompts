  Then there's Dennett's version. In "Cognitive Wheels," his robots fail not because of missing frame axioms but because they can't handle relevance—like ignoring side effects or getting bogged down in infinite considerations. Dennett frames it as a fundamental issue for any finite reasoner: how to determine relevance without exhaustive checks.

