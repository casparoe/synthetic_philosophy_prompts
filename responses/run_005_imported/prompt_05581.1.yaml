  We are ranking six fairness criteria for a high-stakes recidivism-style risk scoring system. The criteria are:
  1. Calibration within groups: The predicted risk score should reflect the true probability of recidivism for each group. For example, if a group has a risk score of 7, then about 70% of that group should recidivate.
  2. Equalized odds: Equal false positive rates and equal true positive rates (or equal false negative rates) across groups. This requires that the model has the same error rates (both FPR and FNR) for all groups.
  3. Equal opportunity: A subset of equalized odds that requires only equal true positive rates (or equal false negative rates) across groups.
  4. Predictive parity: Equal positive predictive value (PPV) across groups. This means that if the model predicts high risk, the probability that the person actually recidivates should be the same for every group.
  5. Demographic parity: The proportion of people predicted as high risk should be the same for each group. This is also called statistical parity.
  6. Treatment equality: Equal ratio of false negatives to false positives across groups.

  We are to assign them to tiers: S (essential), A (important), B (nice to have), C (rarely decisive).

  Reasoning for a recidivism context (high-stakes, potential for significant harm):

  - **Calibration within groups** is crucial because the risk score is used to make decisions (e.g., parole, bail). If the scores are not calibrated, then a score of 7 might mean 70% chance for one group but only 50% for another, leading to unfair treatment. This is about the accuracy of the risk estimate per group.

  - **Equalized odds** (or at least **equal opportunity**) is also very important because it ensures that the model is equally good at identifying recidivists (true positives) and non-recidivists (true negatives) across groups. However, note that equalized odds requires both TPR and FPR parity, which might be harder to achieve when base rates differ. In recidivism, it's particularly important to avoid disparities in who is wrongly detained (false positives) and who is wrongly released (false negatives). But given the trade-offs, we might prioritize TPR (equal opportunity) because missing a recidivist (false negative) can lead to a new crime, while detaining a non-recidivist (false positive) is also a harm.

  - **Predictive parity** (PPV parity) is important because it ensures that when the model predicts high risk, it is equally reliable across groups. This is related to calibration but focuses on the positive predictions. However, note that if base rates differ, PPV parity may conflict with other criteria.

  - **Demographic parity** (statistical parity) requires that the same proportion of each group is labeled high risk. This may be less appropriate in recidivism if the base rates of recidivism differ across groups because it forces the model to ignore the actual risk. In high-stakes settings, we care more about accuracy and avoiding errors than forcing equal rates of positive predictions.

  - **Treatment equality** (equal FNR to FPR ratio) is less commonly discussed. It focuses on the ratio of errors, but it doesn't necessarily align with minimizing harm. For example, one group might have a high FNR (many recidivists released) and a low FPR (few non-recidivists detained), while another group has the opposite. The ratio being equal doesn't tell us about the absolute harm.

