  Okay, let me start by really understanding what the user is asking. They had a long debate with a friend about moral trade, inspired by Toby Ord's concept. The core idea is that two people with opposing moral views can trade actions that each considers minor for something they value highly, making both better off by their own standards. The classic example is a vegetarian trading with someone who's anti-abortion but indifferent about diet.

  The user's friend argues that as long as the trade is voluntary and mutually beneficial, it's fine. But the user feels uneasy, thinking some trades might be exploitative or corrupt, like bribery. They want a concrete example that meets all the formal criteria (voluntary, non-deceptive, no third-party harm, mutually beneficial) but still feels intuitively wrong. Then they want to know what makes that example different from the vegetarian/anti-abortion case and a general principle to distinguish legitimate from illegitimate moral trades.

  First, I need to create such an example. Let me brainstorm scenarios where moral trade could feel icky. What about a judge? Judges are supposed to be impartial. Imagine a judge who personally believes a law is unjust but is committed to upholding it. Suppose there's a wealthy activist who wants to change that law. The activist offers the judge a donation to a charity the judge supports in exchange for the judge resigning and speaking out against the law. 

  Wait, does this fit the criteria? Let's check. Voluntary? Yes, both agree freely. Non-deceptive? Assuming honesty. No third-party harm? The judge resigning might affect court cases, but if we assume cases are reassigned, maybe no direct harm. Both better off? The judge gets resources for their cause; the activist gets a prominent voice against the law. But it feels like bribery because the judge is trading a professional duty for personal gain.

  Contrast this with the vegetarian case. In that scenario, both parties are private citizens acting in their personal capacity. The judge, however, holds a public role with fiduciary duties. The key difference is the role-based obligations. The judge is expected to be impartial and not let personal beliefs or external incentives affect their duties. Resigning for a donation commodifies their judicial position.

  So the general principle could be about the violation of role-specific obligations. When a moral trade involves someone in a role that requires impartiality or sacrifice of personal gain for duty, it becomes problematic. Other examples could include politicians trading votes for donations or doctors prioritizing paying patients. The legitimacy hinges on whether the trade respects or violates the duties attached to a person's role in an institution designed to serve a greater good.
