  Here’s a concrete example that satisfies all formal criteria for "acceptable" moral trade but feels intuitively objectionable, followed by a precise distinction and a general principle:

  **The Case: The Conscientious Judge & The Activist Donor**  
  *Background*: Judge Aris is a principled originalist who believes a specific environmental law (e.g., the "Clean Air Expansion Act") is unconstitutional but feels bound by judicial duty to apply it faithfully. Activist Blair deeply opposes this law, believing it stifles industry. Blair is indifferent to judicial ethics but values overturning the law above all else.  

  *The Trade*:  
  1. **Judge Aris** resigns from the bench immediately (avoiding ruling on any pending cases).  
  2. **Blair** donates $2 million to the "Originalist Legal Education Fund" (Arís’s most cherished cause).  
  3. Upon resigning, **Aris** publicly condemns the law as unconstitutional (a view they genuinely hold).  

  *Formal Conditions Met*:  
  - **Voluntary**: Both freely agree; no coercion.  
  - **Non-deceptive**: Both are honest about their values/intentions.  
  - **No third-party harm**: Cases are reassigned; no one is directly harmed.  
  - **Mutual benefit (by their own values)**:  
    - *Aris* values advancing originalism ($2M > cost of resignation) and considers judicial duty secondary to constitutional fidelity.  
    - *Blair* values defeating the law (removing a judge likely to uphold it > $2M cost).  

  **Intuitive Objection**: This feels like **bribery disguised as moral trade**. Aris is exchanging a public duty (judicial service) for private gain (funding their cause), corrupting an institution meant to be insulated from financial influence.

  ### Key Distinguishing Feature from the Vegetarian/Anti-Abortion Case  
  **Violation of Role-Based Fiduciary Obligations**:  
  - In the classic case, both parties act as *private individuals* exercising personal moral choices (dietary habits, reproductive choices). Their actions impose no institutional duties.  
  - In the judge case, Aris holds a *public role* with **fiduciary responsibilities**: duties to the judiciary, litigants, and public trust that require *insulation from external incentives*. Resigning for financial gain (even if donated) commodifies a position that society deems should be governed by impartiality and service, not tradable interests.  

  ### General Principle: Legitimacy Depends on Contextual Role Constraints  
  > **The Institutional Integrity Principle**:  
  > *A moral trade is illegitimate if it requires a party to violate core fiduciary, professional, or institutional obligations attached to a socially entrusted role—even if voluntary and mutually beneficial by their personal values.*  

  #### Why This Principle Resolves the Dilemma:  
  1. **Blocks Exploitative "Trades"**:  
     - *Objectionable*: A public defender "trading" with a prosecutor to lose a case in exchange for a donation to their favored charity.  
     - *Why*: Violates the lawyer’s duty to zealous representation.  
  2. **Permits Private Moral Exchanges**:  
     - The vegetarian/anti-abortion trade involves no institutional roles. Their choices (eating meat, protesting clinics) are personal acts with no fiduciary dimensions.  
  3. **Clarifies "Commodified Conviction"**:  
     - Moral commitments become "corruptly commodified" when monetized *within roles designed to be incentive-immune* (e.g., judges, jurors, regulators, elected officials).  
  4. **Addresses Exploitation Concerns**:  
     - Even if both parties benefit, society is exploited when institutional roles (like judgeships) are treated as marketable assets, eroding trust in essential structures.  

  ### Conclusion  
  Your intuition likely tracks this principle: moral trades *feel* illegitimate when they transform a role-bound duty into a fungible commodity. The judge’s resignation-for-donation isn’t "wrong" because values changed, but because it monetizes a duty that *should* resist market logic. Meanwhile, the vegetarian’s dietary choice has no comparable institutional weight. By focusing on **whether the trade subverts a socially mandated firewall between duty and external incentives**, you separate benign moral bargaining from corrosive transactions.
