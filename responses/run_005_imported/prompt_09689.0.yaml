answer: |-
  That's an *excellent* question and a very common stumbling block when first encountering Kant. You're absolutely right to notice the difference from the lying example, and you're spot-on to be suspicious of "bad outcome" reasoning sneaking in. Kant isn't being inconsistent or consequentialist here – he's applying a different *type* of contradiction within the universalizability test. Let's break it down:

  1.  **The Two Types of Contradiction:** Kant actually distinguishes two ways a maxim can fail the universalizability test:
      *   **Contradiction in Conception (Logical Contradiction):** This is what happens with the lying promise. When universalized, the maxim *destroys the very condition that makes the action possible or meaningful*. The world becomes conceptually impossible (promises cease to exist as a concept).
      *   **Contradiction in the Will (Volitional Contradiction):** This is what happens with refusing to help. When universalized, the maxim doesn't create a *logically impossible* world, but it creates a world that *no rational being could consistently will for themselves*. Your will contradicts itself.

  2.  **Applying it to Refusing Help:**
      *   **The Maxim:** "I will never help anyone in need, even when I easily could, in order to avoid inconvenience or cost to myself."
      *   **Universalize it:** Imagine a world where *everyone* adopts this maxim (Universal Law of Nature: "No one ever helps anyone in need").
      *   **Is it Logically Contradictory?** As you said, no. This world is conceivable. People *could* (in theory) survive fending only for themselves. The practice of "helping" wouldn't be destroyed *as a concept* – we could still understand it, we'd just never do it. So, it passes the first (logical) test.
      *   **Is it a Contradiction in the Will?** **YES.** Here's the key:
          *   Kant argues that as finite, rational beings dependent on the world and others, *it is a necessary and rational feature of the human condition that we will sometimes need help*. We *know* this about ourselves.
          *   Now, ask: Could you *rationally will* to live in a world where *no one ever helps anyone*?
          *   The contradiction arises because **you simultaneously will two incompatible things**:
              *   You will the universal law: "No one ever helps anyone."
              *   But, as a rational being aware of your own vulnerability, you also necessarily will (at least as a possibility or contingency) that *you receive help when you desperately need it*.
          *   **You cannot rationally will a world where help is universally forbidden *and* also will that you receive help when you need it.** These two volitions clash. Your will undermines itself. It's like saying, "I will that oxygen doesn't exist *and* I will that I continue breathing." You *need* the possibility of help, so willing its universal abolition is irrational self-sabotage for a being like you.

  3.  **Why "Bad Outcome" Isn't the Real Reason (Avoiding Consequentialism):**
      *   Kant isn't saying the maxim is wrong *because* the world would be "colder and worse off" (that *is* consequentialist).
      *   He's saying it's wrong because **willing this universal law involves a contradiction *within your own rational will***. You are trying to will something (universal non-help) that directly conflicts with another necessary rational commitment you have (the will to your own well-being/survival, which inherently includes the potential need for aid).
      *   The "colder world" is merely *evidence* of why this contradiction arises for beings like us. The *reason* it's forbidden is the internal inconsistency of the will, not the external consequences.

  4.  **Imperfect vs. Perfect Duties:**
      *   This distinction maps onto Kant's categories of duty:
          *   **Perfect Duties (like not lying, not killing):** Arise from contradictions in conception. They are strict prohibitions ("never do X").
          *   **Imperfect Duties (like helping others, developing your talents):** Arise from contradictions in the will. They are positive commands ("sometimes do Y"), but leave room for judgment about *when, how, and to whom*. You don't have to help *everyone, always*, but you cannot adopt a maxim of *never* helping. You must make helping a general principle of your will.

  **In Summary:**

  *   You correctly identified the difference: Lying fails due to a **logical contradiction** (the maxim destroys itself).
  *   Refusing help fails due to a **volitional contradiction** (willing the universal law conflicts with another necessary rational volition you have as a vulnerable being).
  *   **Kant isn't cheating with consequences.** The "bad world" isn't the *reason* it's wrong; it highlights *why* willing that world creates an internal conflict for a rational being who knows they might need help.
  *   **The core failure is self-contradiction of the will:** You cannot rationally will a world with universal non-help *while simultaneously* being a being who rationally wills their own preservation/well-being, which sometimes depends on receiving help.

  Your confusion is completely understandable and shows you're thinking deeply about the text! Kant's move from logical contradiction to volitional contradiction is subtle but crucial for grounding positive duties (like beneficence) within his deontological framework. Tell your roommate you found a better answer than Google! 😉
