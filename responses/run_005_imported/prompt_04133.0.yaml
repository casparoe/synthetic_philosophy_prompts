   Let's also recall that there are others, but we must focus on the most discussed and the ones the user might have in mind.

   After reviewing the literature, here is a non-exhaustive list of methods and common critiques:

   - Maximize Expected Choiceworthiness (MEC): 
       Pros: Direct extension of decision theory to moral uncertainty; theoretically well-founded.
       Cons: Requires intertheoretic comparisons (how to compare "choiceworthiness" across theories) and a cardinal scale for each theory. This is a major challenge.

   - Moral Parliament (MP):
       Pros: Avoids direct intertheoretic comparisons by having theories bargain; more robust to scale issues.
       Cons: Bargaining can be complex and may not lead to a unique outcome; the procedure itself is underdefined.

   - My Favorite Theory (MFT):
       Pros: Simple, avoids intertheoretic comparisons.
       Cons: Ignores the possibility that other theories might be correct and might lead to disastrous outcomes from their perspective.

   - Maximin (or Leximin) over theories:
       Pros: Avoids worst-case scenarios.
       Cons: Extremely conservative; may lead to paralysis if any theory forbids almost everything.

   - Variance Voting: Each theory gets to vote for actions, with votes weighted by credence, and the action with the highest vote wins (if the theories can provide a binary verdict). But note: many theories don't give binary verdicts.

   However, the user specifically mentioned three, so we should include at least those. We can add a couple more to have a fuller list.

