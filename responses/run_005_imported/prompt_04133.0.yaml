  We are ranking meta-level decision procedures for moral uncertainty, not the first-order ethical theories.
   The user wants a tier list from S (best) to D (broken) based on how good each procedure is.

   Proposed procedures to consider (based on the user's mention and common ones in literature):
   1. Maximize Expected Choiceworthiness (MEC) - analogous to expected utility, but over ethical theories.
   2. Moral Parliament - each theory gets representation proportional to credence, and they bargain/vote.
   3. My Favorite Theory (MFT) - just follow the theory you assign the highest probability.
   4. Other possibilities: 
      - Maximin (avoid the worst outcome according to any theory you give credence to)
      - Multiplicative Weights (update weights based on how well each theory does in past decisions)
      - Borda Count (each theory ranks actions, then aggregate rankings)

