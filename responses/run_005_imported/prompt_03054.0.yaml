answer: |-
  ## Statistical Aberrations

  Arthur Finch didn’t believe in miracles. He believed in statistics, in wear-and-tear, in the predictable entropy of a well-maintained machine – including his own body. He was an actuary, after all. He calculated risk for a living, a job predicated on the comforting, mundane certainty that improbable things rarely happened, and truly impossible things *never* did. Until, perhaps, they started happening to you.

  It began subtly, a pattern emerging only in hindsight, like constellations forming from scattered stars. The first significant incident was the deer. Driving home late on a rain-slicked county road, headlights carving tunnels through the downpour. One moment, empty asphalt; the next, the impossible bulk of a buck filling his windshield. Instinct yanked the wheel. The car slewed, tires screaming against hydroplaning physics, spun a terrifying 180 degrees, and slammed backwards into a ditch. The impact punched the air from his lungs. Glass rained. Silence, except for the drumming rain and his own ragged breathing.

  He should have been dead. Or paralyzed. The paramedics said so, eyebrows raised as they surveyed the accordioned rear end wrapped around a sturdy oak. Arthur walked away with whiplash that took months to fade and a persistent ache low in his back that became a permanent tenant. A statistical aberration, he told himself. A lucky break. Unpleasant, but survivable.

  Then came the balcony. A colleague’s retirement party, too much cheap champagne, a loose railing on an old fire escape repurposed for smokers. Arthur leaned back, felt the sickening lurch of rotten wood giving way. He flailed, caught the edge of the doorframe with one hand, his body swinging out over a three-story drop onto concrete. Someone grabbed his wrist. He was hauled back in, gasping, the tendons in his shoulder shrieking. Dislocated. It healed awkwardly, leaving his right arm with a limited range of motion, a constant stiffness he learned to navigate. He’d dreamt of falling ever since. The doctors called it trauma. Arthur started calling it, privately, *The First Narrow Miss*. He didn’t know why he capitalised it in his head.

  The pattern solidified. Food poisoning at a conference. Three attendees died. Arthur spent a week in intensive care, kidneys failing, delirious with fever. He survived. His kidneys functioned, but at a diminished capacity, demanding careful hydration and a restrictive diet. A persistent tremor settled in his left hand. *Statistical Aberration Number Two*.

  A gas leak in his apartment building. He’d been home, asleep. The explosion two floors down ripped through the night. His door was blown inwards, debris peppering the room. Concussion, perforated eardrum, lung damage from smoke inhalation. Others perished instantly. Arthur spent months learning to breathe without a constant, ragged wheeze, his hearing permanently muffled on one side. *Aberration Three*. He moved to a ground-floor apartment.

  Each survival extracted a toll. A near-drowning while kayaking (a freak wave, capsizing him in icy water) left him with nerve damage in his legs, a slight but permanent limp, and a deep-seated terror of open water. A mugging gone wrong (he’d fought back, stupidly) resulted in a fractured skull and lingering aphasia – words sometimes danced just out of reach, frustratingly elusive. He took early retirement. The numbers on the page started to blur, their once-clear probabilities mocking him.

  He became a connoisseur of near-misses. The scaffolding collapse he witnessed from across the street, feeling the displaced air buffet him. The aggressive driver who swerved *just* in time, missing his pedestrian crosswalk by inches. The faulty wiring in his new lamp that sparked and died without igniting the curtains. Each event felt less like luck and more like… selection. A winnowing. He wasn’t walking away unscathed; he was being *preserved*, but only in states compatible with continued, diminished observation.

  He stopped talking about it. Who would believe him? It sounded like paranoia, survivor’s guilt metastasizing into cosmic delusion. His friends dwindled. Conversations became exhausting, navigating around the missing words, the need to sit frequently because of his legs, the constant background hum of various pains. His world shrank to the manageable confines of his apartment, his routines meticulously calibrated to minimize risk – soft foods, no stairs, predictable walks in the park during quiet hours. He was a living embodiment of negative space, defined more by what he’d lost than what remained.

  One rainy Tuesday, much like the night of the deer, Arthur stood in the fluorescent glare of the supermarket, leaning heavily on his cart. He was contemplating the soup aisle – low sodium, kidney-friendly. His gaze drifted to the high shelves above the canned vegetables. A bulky can of tomatoes, precariously perched near the edge. A shopper bumped a lower shelf further down the aisle. A tiny vibration.

  Arthur saw it happen in slow motion. The can teetered. Balanced for an impossible fraction of a second on the very lip of the shelf. Then gravity, that most reliable of constants, reasserted itself.

  It fell.

  Directly towards the head of an elderly woman carefully examining a label below. Arthur’s body moved before his damaged brain could fully process the scene. A lurching step forward, his bad leg buckling slightly. His good arm, the one with the stiff shoulder, shot up. Not fast, not graceful, but *there*.

  The can struck his forearm with a solid, meaty *thunk*. Pain lanced up to his shoulder, sharp and familiar. The can clattered harmlessly to the floor at the woman’s feet. She jumped, startled, then looked up at Arthur, her eyes wide with surprise and dawning gratitude.

  "Oh! Oh, goodness! Thank you, young man!" she exclaimed, patting his aching arm. "That could have been nasty!"

  Arthur forced a smile, thin and tight. He flexed his fingers. Nothing broken, probably. Just another deep bruise to add to the collection, another layer of ache settling into the complex topography of his damaged body. "No trouble," he rasped, the words feeling thick. "Glad I was... here."

  He pushed his cart away, leaving the flustered woman and the dented can of tomatoes behind. The fluorescent lights buzzed overhead. The ache in his arm pulsed in time with the ache in his back, his legs, the phantom pain in his vanished full hearing. He thought of the countless shelves in countless supermarkets. The infinite permutations of stacked cans and passing shoppers and tiny vibrations. In how many of those branching realities had that can struck true? How many Arthur Finches ceased, instantly, in that aisle? How many versions of that woman lay bleeding?

  And how many versions of *him* were left standing, like this one? Bruised. Battered. Diminished. Alive only because death, in its myriad messy forms, hadn't quite managed to finish the job *here*. Not yet. Preserved, not for vitality, but for the bleak, necessary continuity of witnessing. The sole observer in a narrowing corridor of possibility, where survival was not a victory, but the only state left in which to register the loss.

  He picked up a can of low-sodium chicken broth. His hand trembled slightly. The numbers, the beautiful, cruel probabilities he’d built his life upon, offered no comfort, only a chilling, unanswerable question: Was this luck? Or was it the inexorable logic of being the last man standing in an ever-thinning crowd of possibilities, each escape leaving him less than he was? He paid for his groceries, the coins slippery in his uncooperative fingers, and limped out into the grey afternoon. The rain felt cold on his face, a sensation he could still feel, for now. Another day survived. Another increment of diminishment logged. The experiment, whatever it was, continued. He was its data point, accumulating damage, perpetually almost-finished.
