prompt: |-
  I've been reading about this AI alignment idea called coherent extrapolated volition (CEV) - the basic idea is that instead of coding an AI with our current messy wants, you get it to figure out what we'd actually want if we were smarter, better informed, and had time to grow and reflect as people, then somehow combine that across everybody into one thing. But something's been bugging me for a while: if you idealize someone enough, changing what they know and how they think, at what point does it stop being their volition and start being some stranger's preferences instead? I've got a feeling philosophers ran into basically this same wall ages ago with theories that define what's actually good for a person as whatever they'd want under "ideal" conditions (fully informed, perfectly rational, that sort of thing) - i think its called something like idealized preference theory? Could you compare CEV to those older idealized-preference views and tell me straight up whether CEV actually has an answer to this "not really me anymore" problem, or if its just quietly inherited the exact same unresolved issue?
