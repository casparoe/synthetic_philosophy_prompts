answer: |-
  Based on Dummett's specific arguments in *On Immigration and Refugees*, particularly his distinction between legitimate state concerns and racist exclusion, it is highly likely he would have condemned the Rwanda scheme and the surrounding "stop the boats" rhetoric as **another instance of the racism he diagnosed in earlier legislation**, rather than a legitimate invocation of a state's limited right against submersion. Here's the reasoning:

  1.  **Violation of the Presumption for Refugees:** Dummett's core principle is the "strong presumption in favour of admitting refugees unless specific and weighty reasons justify refusal." The Rwanda scheme fundamentally circumvented this presumption. Instead of hearing claims *in the UK*, it proposed removing asylum seekers to a third country *without* a full and fair determination of their refugee status *under UK jurisdiction*. For Dummett:
      *   **Lack of Individual Assessment:** The scheme bypassed the essential process of examining individual claims *within the UK system*. This directly contradicts the requirement for "specific and weighty reasons" for refusal *after* consideration. Refusal by blanket removal pre-assessment is anathema to his presumption.
      *   **Deterrence as Primary Goal:** The scheme's stated purpose was deterrence – discouraging people from claiming asylum by threatening removal to Rwanda. Dummett would see this as prioritizing deterrence over the *assessment of need*, which is the cornerstone of refugee protection. He would argue that legitimate state concerns about numbers or process must operate *after* the presumption of hearing the claim, not as a mechanism to avoid it.
      *   **Shirking Responsibility:** Removing claimants to a third country, especially one with a different human rights context and asylum system, would likely be seen by Dummett as an abdication of the UK's direct responsibility under the Refugee Convention to assess claims made on its territory (or at its jurisdiction, like territorial waters).

  2.  **"Stop the Boats" Rhetoric and Racism:** Dummett was acutely sensitive to the role of racist and xenophobic rhetoric in shaping immigration policy. He argued that much postwar legislation was driven by racism disguised as concern for resources or social cohesion.
      *   **Demonization and Dehumanization:** Rhetoric like "stop the boats," "invasion," "swarms," etc., focuses overwhelmingly on the *method* of arrival and the *act* of seeking asylum, often portraying asylum seekers as a threatening, undifferentiated mass. This aligns perfectly with Dummett's analysis of how racism operates – by creating a sense of "otherness" and threat that justifies harsh measures.
      *   **Focus on Method Over Need:** The rhetoric prioritizes stopping the *boats* (the visible symptom) over addressing the *reasons* people flee or creating safe, legal routes (the root causes and solutions). Dummett would see this as a deliberate strategy to frame the issue as one of illegal intrusion and border control, rather than one of international protection and human need, thereby stoking public fear and resentment.
      *   **Echoes of Past Racism:** He would likely draw a direct parallel between the inflammatory language and political focus on "small boats" and Channel crossings with the racist "rivers of blood" rhetoric and anti-immigrant sentiment he critiqued in earlier decades. The target group (often non-white, fleeing conflict and poverty in Africa, Asia, and the Middle East) and the tone of the debate would confirm his diagnosis of persistent underlying racism.

  3.  **Failure to Meet the "Submersion" Threshold:** While Dummett granted a limited state right against submersion, he set a very high bar. The numbers arriving via small boats, while significant and politically charged, were a fraction of overall net migration and a tiny percentage of the UK population. Dummett would be deeply skeptical that this specific flow constituted a genuine threat of "submersion" justifying such an extreme measure as extraterritorial processing and removal. He would likely argue that any logistical challenges posed by Channel crossings could and should be addressed through fairer, faster processing within the UK system and international cooperation on safe routes, rather than a policy designed primarily for deterrence and avoidance of obligations.

  **Conclusion:**

  Michael Dummett would almost certainly view the Rwanda scheme as a blatant violation of the fundamental presumption in favor of hearing refugee claims within the UK. He would see it as a mechanism designed to *avoid* the UK's responsibilities under the Refugee Convention, driven by a desire for deterrence rooted in hostility, not by legitimate, specific concerns meeting the high threshold of justification he required for refusing refugees.

  Furthermore, the "stop the boats" rhetoric surrounding the scheme would confirm his long-standing diagnosis: that much of Britain's restrictive immigration policy, especially concerning asylum seekers and refugees, is fundamentally driven by racist and xenophobic sentiment, strategically amplified for political gain, rather than by genuine, proportionate concerns about national capacity or social cohesion. He would see the Rwanda plan and its accompanying rhetoric as a direct continuation, even an escalation, of the racist tendencies he identified in earlier postwar legislation.
