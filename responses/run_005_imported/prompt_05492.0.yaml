  For finitude: Question on uncomputed cases, follow-up on pattern application. Another on novel problems. 

  Normativity: Question on mistakes, follow-up on idealization. Question on correctness vs. disposition. 

  Idealization: Question on ceteris-paribus conditions, follow-up on non-circular definition. Question on infinite cases. 

  Behaviorism: Comparison question, follow-up on internal states vs. behavior. 

  Also, add one on epistemology—how do I know my dispositions? Follow-up on introspection vs. third-person access. 

  And a question on whether dispositions can be indeterminate, follow-up on rule individuation. 

  That should cover it. Make sure questions are phrased to challenge, not explain. Use "how does your view account for..." or "isn't this circular..." to force defense. 

  User’s anxiety about idealization being cheating—press that hard. The behaviorism angle is smart; prof will likely bring it up. 

