prompt: |-
  Write a short story built around evidential cooperation in large worlds (ECL) -- the decision-theory idea that if the universe or multiverse is big enough, theres almost certainly a huge population of agents out there who you'll never meet, never causally affect, and never get a signal from, but who think enough like you that you can still "cooperate" with them, just by choosing to act like the kind of agent you'd want them to be. No telepathy, no messages, no shared cause allowed -- whatever cooperation happens has to run entirely on that inference, Newcomb-style. Bonus points if your character has to make a real, costly choice on this basis and the story never confirms whether it actually paid off.
reasoning: |-
  Hmm, the user wants a short story based on Evidential Cooperation in Large Worlds (ECL), a decision theory concept. They need a narrative where a character makes a costly choice based on cooperating with unseen, similar agents across a vast universe, without any causal links or communication. The story shouldn't confirm if the choice paid off.

  I recall that ECL is about cooperating with hypothetical agents who are reasoning similarly to you. The challenge is to show this in a story without breaking the rules—no telepathy, messages, or shared causes. It has to be pure inference, like Newcomb's Paradox, where your action is evidence about what others like you might do.

  The user might be interested in philosophy, decision theory, or sci-fi. They could be exploring how abstract ideas translate into human experiences, perhaps seeking inspiration or a way to grasp complex concepts through storytelling. Their deeper need might be for a narrative that illustrates moral choices in isolation, emphasizing that doing good isn't about rewards but about being part of a larger, unseen cooperation.

  For the story, I need a setting that feels vast and isolating. A lone spaceship in deep space works well—it emphasizes the character's solitude. The protagonist should face a dilemma with a clear cost: destroying a unique alien artifact to prevent misuse versus preserving it for potential good. This creates tension, as the cost is real and immediate.

  I'll name the protagonist Aris Thorne, to give him a grounded, human feel. His role as an exobiologist makes sense for the scenario—he'd value discovery but also understand risks. The artifact, a "Resonance Prism," should be mysterious and powerful, symbolizing knowledge that could be used for harm or benefit.

  The core of the story is Aris's internal debate. He considers ECL: in a huge universe, there might be others like him facing similar choices. If he destroys the prism to prevent a disaster, he infers that others would do the same, reducing the overall risk. This cooperation is evidential—it's about acting as he hopes they would act, even with no guarantee.

  I must ensure no confirmation of payoff. The story ends with Aris choosing destruction, but he never learns if it mattered. That ambiguity is key—it highlights the leap of faith in ECL. His sacrifice is for the principle, not the outcome.

  Themes to weave in: isolation versus connection, the weight of responsibility, and hope in uncertainty. The language should be evocative, with sensory details to make the sci-fi setting immersive. End on a note of quiet resolve, leaving the reader pondering the choice.

  Finally, I'll write concisely to keep it short. The story should stand alone but hint at larger ideas, satisfying the user's request while sparking thought about cooperation in an indifferent universe.
answer: |-
  The *Whisper of Dust* coasted through the ink between galaxies. Aris Thorne, its sole occupant for the last seven subjective years, floated before the main viewport, not seeing the impossible density of distant stars, but fixated on the object cradled in the ship’s manipulator arms outside.

  It was the Resonance Prism. Found adrift in the sterile void of an intergalactic void, it was an artifact of staggering elegance and terrifying implication. Analysis suggested it could, under specific conditions, amplify neural patterns across vast distances – not telepathy, but a kind of forced, resonant synchronization. A weapon of unimaginable scale, turning populations into puppets. Or, perhaps, a tool for instantaneous, galaxy-wide consensus-building. The difference lay entirely in the hand that wielded it.

  Aris had found it. He could deliver it to the Consortium. Fame, resources, perhaps even influence to steer its use towards good. Or he could claim it for himself, a god-like power hidden in the void. Or…

  He could destroy it. Here. Now. Erase its potential forever.

  The cost was immense. His career, his purpose, the pinnacle of exobiological discovery – all sacrificed to a fusion pulse from the *Whisper*'s engines. He’d be a footnote, a madman who destroyed the greatest find in centuries, drifting home to obscurity or exile.

  *Why do it?* The thought echoed in the sterile quiet. *If it’s used for evil, you’ll never know. If destroying it saves someone, you’ll never hear about it. Your action changes nothing you can ever perceive.*

  Then he remembered the lecture, years ago, on fringe decision theory. *Evidential Cooperation in Large Worlds.* The universe wasn't just big; it was *inconceivably* vast. Infinite, perhaps. In such a cosmos, the argument went, there weren’t just similar agents *out there*. There were agents *exactly* like him, in *exactly* this situation, right now. Not copies, but counterparts born of cosmic probability, facing their own Resonance Prisms, alone in their own voids, wrestling with the same choice.

  No signal could pass between them. No shared cause linked them. They were causally isolated islands. Yet, their reasoning was entangled. What he did *here* was evidence of what an agent *like him* would do *there*. If he chose destruction, it wasn't just *his* choice; it was evidence that *agents who think like Aris Thorne destroy the Prism*.

  He imagined them. Countless Aris Thornes, each aboard their own lonely ship, each holding their own Prism. If even *one* of them chose power, chose delivery, the potential for catastrophe was amplified across the multiverse. But if they *all* chose destruction? The threat vanished, everywhere, simultaneously. Not through coordination, but through *consistency of character*.

  The cooperation wasn't active. It was inferential. By choosing to destroy the Prism, Aris wasn't *causing* others to destroy theirs; he was *being* the kind of agent whose existence *evidences* that Prisms are destroyed by agents like him. And in a large enough world, that evidence *was* the cooperation. His action here resonated, not through physics, but through the abstract structure of logical possibility and similarity.

  The cost was real. The Consortium's rewards shimmered like a mirage. The power the Prism offered was a dark, seductive whisper. To destroy it was to embrace utter, uncompensated sacrifice. He would gain nothing. He would lose everything tangible.

  But if he kept it, or delivered it… what did that evidence? That agents like Aris Thorne *don’t* destroy the Prism. That they risk it. And if *that* was true of him, wasn't it likely true of his countless unseen counterparts? Wouldn't *their* Prisms then fall into dangerous hands? His choice here wasn't just about *this* Prism; it was a vote on the *kind of agent* he was, and thus, the kind of agents his counterparts were.

  The logic was cold, almost alien. It demanded faith not in gods or fate, but in the sheer scale of existence and the consistency of reason itself. It asked him to sacrifice his tangible world for the sake of an invisible, probabilistic community he would never meet, never affect, and never know.

  Aris floated for a long time. He watched the Prism glint, a captured fragment of cosmic potential. He thought of the trillions who would never know of its existence, or its threat. He thought of the other Aris Thornes, out there in the endless dark, perhaps staring at their own Prisms right now.

  He didn't feel heroic. He felt small, and very alone. But he also felt a strange, tenuous connection, not through space, but through the architecture of decision.

  His fingers moved over the console, inputting the final sequence. Authentication. Confirmation. The fusion pulse protocol.

  "The cost is real," he whispered to the uncaring void, to the counterparts he would never meet. "But the evidence matters. Be the agent you hope they are."

  He pressed the final key.

  Outside, the *Whisper of Dust*'s main engines flared with star-core fury, a brief, violent sun engulfing the Resonance Prism. Sensors screamed overload, then fell silent. Where the artifact had been, only expanding plasma and dissipating energy remained.

  Aris sank back into his chair, the console lights reflecting in his tired eyes. The deed was done. His future was ash. He had gambled everything on an inference about unseen thinkers in an infinite universe.

  He set a course for the long, lonely journey home. He would never know if another Aris Thorne, somewhere in the immeasurable vastness, had looked at a similar glint in the void and made the same choice. He would never know if his sacrifice, multiplied across worlds he couldn't conceive of, had averted untold suffering or merely erased a single, lonely possibility.

  He only knew what kind of agent he had chosen to be. The rest was silence.
