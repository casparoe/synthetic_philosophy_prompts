answer: |-
  It's fascinating how your concrete experience with Fresnel's equations illuminates this central debate in philosophy of science. Let's break down the divergence between Worrall and Psillos on what survived, and then tackle Newman's objection. The key lies in *what kind of knowledge* they believe was preserved in the transition.

  **1. The Shared Starting Point: Laudan's Challenge & Fresnel's Success**
  *   **Laudan's Pessimistic Meta-Induction (PMI):** Past successful scientific theories (like Fresnel's ether optics) contained central theoretical posits (the elastic-solid ether) that we now believe do not exist. Therefore, we have no good reason to believe the central posits of our *current* successful theories (e.g., electrons, quarks) actually exist. Success doesn't guarantee truth about ontology.
  *   **The Fresnel-Maxwell Transition:** Fresnel derived his highly successful equations (R, T) using a mechanical model of light as transverse vibrations in an elastic-solid luminiferous ether. Maxwell derived equivalent (or very similar) equations describing light as transverse electromagnetic waves propagating through a field, eliminating the need for a mechanical ether. The *equations* survived essentially intact; the *ontological picture* (the elastic-solid ether) was discarded.

  **2. Worrall's Epistemic Structural Realism (ESR): What Survives is *Only* Structure**
  *   **Core Claim:** The *only* aspect of past successful theories that we have good reason to believe accurately represents the world is their *mathematical structure*. We should be realists *only* about the structural content of our theories, remaining agnostic or pessimistic about the specific natures (ontology) that realize that structure.
  *   **Application to Fresnel:**
      *   **Survived:** The mathematical structure embodied in Fresnel's equations themselves. The specific functional relationships between incident angle, refractive indices, polarization, and the resulting reflectance/transmittance amplitudes. This structure captures *how* light behaves at interfaces.
      *   **Discarded:** *All* of the specific ontological claims Fresnel used to derive that structure: the elastic-solid ether, light as a mechanical vibration *in a solid*, the specific mechanical properties assigned to the ether, etc. These were merely the "carriers" of the structure.
  *   **Why Comfort for Realism?** While the specific ontology was wrong, the *structural relationships* it was used to derive turned out to be correct (or approximately correct within its domain). Science *does* make progress in uncovering the enduring mathematical structure of the world, even if our pictures of what "fills in" that structure change radically. The equations are the enduring truth-bearers.
  *   **What Kind of Realism?** It's realism about the *structure* of the world, captured mathematically. It's *epistemic* because it claims this is the limit of what we can *know* (we can't know the true underlying natures).

  **3. Psillos's Selective Realism ("Divide et Impera"): What Survives is *Essential* Theoretical Content**
  *   **Core Claim:** Not all parts of a successful theory are equally vulnerable to rejection. We should be realists about the specific theoretical constituents that are *essential* to a theory's successful predictions. We can "divide" the theory into its successful, essential core and its "idle" parts, and "conquer" PMI by showing that realism is warranted only for the essential core, which *is* typically retained.
  *   **Application to Fresnel:**
      *   **Survived:** Crucially, Psillos argues that more than *just* the mathematical equations survived. What survived was the core *theoretical content* that was *essential* to generating Fresnel's successful predictions about light at interfaces. This includes:
          *   The idea that light involves **transverse wave vibrations** (even if the *medium* changed from mechanical ether to electromagnetic field).
          *   The concept that these vibrations have **specific directions** (polarization states) that are crucial for interaction.
          *   The core **mechanism** of wave interaction at an interface governed by continuity conditions (even if the *nature* of what was continuous changed from mechanical displacement/stress to electric/magnetic field components).
      *   **Discarded:** The *specific* ontological carrier of these vibrations and mechanisms – the elastic-solid ether *itself* – was indeed "idle" in a crucial sense. While Fresnel *used* it to derive the equations, Psillos argues that the *successful predictions* didn't *depend* on the ether being a *solid* per se, only on it supporting transverse waves with specific properties. The ether was a dispensable posit for the *specific* predictive success in question. Other auxiliary assumptions about the ether's detailed properties were also discarded.
  *   **Why Comfort for Realism?** Science *does* preserve core theoretical content about the world's *causal structure* or *properties*, not just abstract mathematical relationships. We *can* justifiably believe in the reality of specific theoretical entities/properties (like transverse waves, polarization) when they are demonstrably essential to successful explanations and predictions, even if the *surrounding* theoretical framework changes. The transition wasn't purely structural; key *physical concepts* were preserved and refined.
  *   **What Kind of Realism?** It's a more traditional entity/property realism, but applied selectively only to those constituents playing an indispensable role in a theory's success. It claims we *can* know something about the natures of things (e.g., light *is* a transverse wave phenomenon).

  **The Sharp Divergence:**

  *   **Worrall (ESR):** *Only* the abstract mathematical structure (the equations) survived. The *physical interpretation* (transverse vibrations *in a solid ether*) was completely wrong and discarded. We recovered only the *relations*, not the *relata*.
  *   **Psillos (Selective):** Key *theoretical-physical content* survived: the concept of light as **transverse vibrations** and the associated **mechanism** of wave continuity at interfaces. The equations survived *because* this core physical content was preserved (even if re-described in EM terms). The discarded ether was merely the *carrier* for these vibrations, not essential to the success. We recovered the *relata* (vibrations, polarization states) *and* their relations, just with a better understanding of what the relata *are* (EM fields vs. ether displacements).

  **4. Newman's Objection & Why it Targets Structural Realism**

  *   **Origin:** Max Newman (1928) critiqued Bertrand Russell's early structural realism (which held that we can only know the *structure* of the external world).
  *   **The Core Argument (Applied to Worrall's ESR):**
      1.  **Structure is Purely Relational:** According to ESR, all we know is the abstract, logico-mathematical *structure* of relations between objects/events.
      2.  **The Triviality Problem:** Newman argued that specifying *only* a structure (a set of relations) is trivial unless you also specify *what* objects stand in those relations. Any collection of objects whatsoever can be arranged to satisfy *any* abstract relational structure, provided there are enough objects. For example, you can always find *some* set of objects and *some* relations among them that satisfy Fresnel's equations, even if they are completely unrelated to light (e.g., positions of tea leaves in a cup related in a complex mathematical way). The *specific* structure Fresnel discovered only seems informative because we implicitly assume it's about *light* and *interfaces*.
      3.  **The Consequence:** If ESR says *only* the structure is known and preserved, but *any* domain can instantiate that structure, then claiming to know the structure of the *physical world* becomes vacuous. It doesn't tell us anything specific about the *actual* world beyond the bare fact that *some* set of objects exists that can be arranged to have that structure. The "knowledge" ESR claims we have is too weak and non-specific.
  *   **Why it Targets ESR Specifically:**
      *   **ESR's Limitation:** ESR *explicitly* limits our knowledge *only* to structure and denies knowledge of the nature of the relata. This makes ESR uniquely vulnerable to Newman's point that specifying *only* structure is trivial without constraints on the relata.
      *   **Selective Realism's Escape:** Psillos's selective realism *does* claim knowledge about the specific relata (e.g., transverse vibrations, polarization states). It doesn't just say "there exists some things related like Fresnel's equations say"; it says "*Light waves* (understood as EM fields) *have transverse vibrations and polarization states*, and *these specific properties* interact at interfaces *in this specific structural way* described by the equations." The equations aren't abstract; they describe the behavior of *these specific kinds of things* with *these specific properties*. Newman's objection doesn't bite because the relata *are* specified (even if our understanding of their nature deepens).
      *   **General Scientific Realism's Escape:** Standard scientific realism also claims knowledge about the nature of entities (electrons, fields, etc.), not just abstract structure. It might be vulnerable to PMI, but not specifically to Newman's triviality argument about structure alone.
  *   **Why Newman Doesn't Hurt Selective Realism or General Realism Here:** Both positions ground the structure in specific physical entities and properties. They claim the structure describes the *actual behavior* of *these specific things*. The structure is informative *because* it's tied to the postulated relata. Selective realism further refines this by saying we should only be realists about the relata/properties proven essential. Newman's objection highlights the *insufficiency* of structure *alone*; selective realism and general realism provide the specific content (the relata/properties) that ESR denies we can know, thereby avoiding the triviality.

  **In Summary:**

  *   **Worrall (ESR):** Only Fresnel's *mathematical structure* survived. Realism is only justified for structure. Ontology (ether, mechanical vibrations) was wrong. Newman's objection shows this view risks triviality.
  *   **Psillos (Selective):** Fresnel's core *theoretical content* essential to success survived: the concept of **transverse wave vibrations** and the **mechanism** of continuity. The equations survived *because* this physical content was retained (re-described in EM terms). The ether itself was the "idle" part. Realism is justified for this essential content. Newman's objection doesn't apply because specific relata/properties are retained.
  *   **Newman's Bite:** It specifically undermines the claim that knowing *only* abstract structure provides substantive knowledge about the world. ESR is vulnerable because it limits knowledge to structure alone. Positions that also claim knowledge about the *specific entities/properties* exhibiting that structure (like selective or general realism) avoid this particular problem, even if they face others (like PMI).

  Your deep familiarity with the *success* and *utility* of Fresnel's equations, contrasted with the abandoned ontology, perfectly embodies this philosophical tension. Both Worrall and Psillos offer ways to salvage realism from Laudan's history, but they disagree fundamentally on *what aspect* of Fresnel's achievement constituted the enduring scientific knowledge: pure mathematical form (Worrall) vs. essential physical concepts plus their mathematical description (Psillos). Newman's objection highlights the potential emptiness of the first option if pushed too far.
