prompt: |-
  ok so I'm supposed to be working through my phil of science comps list and instead I fell down a rabbit hole on the "problem of old evidence," so I need to get this out of my system. quick recap in case its useful: Glymour's old complaint is that if E is already sitting in your background knowledge with probability 1, plain Bayesian conditionalization says E can't confirm any H, since P(H|E) just collapses back to P(H) -- but that seems totally wrong given that Einstein deriving the (already-known) anomalous precession of Mercury's perihelion from GR is everyone's favorite example of a theory getting strongly confirmed.

  Can you write me a dialogue between two Bayesians who both fully accept probability theory but have landed on completely different fixes for this. One is running the Garber/Jeffrey "logical learning" move -- drop the logical omniscience assumption built into standard probability, and say what actually confirms H is the agent coming to learn, as new and genuinely uncertain info, that H entails E. The other is running a Howson-style "counterfactual" move -- forget the agent's actual credence in E (its stuck at 1), and instead ask what they would've credenced E at if they hadn't already known it, then define confirmation off of that hypothetical prior instead.

  Don't have them just state their views back to back at each other, I want them actually pressing on each other's weak joints -- the logical-learning person should have to say something real about how you pin down a non-cooked-up probability for a logical/mathematical fact like "H entails E" before anyone's proved it, and the counterfactual person should have to explain why their hypothetical prior isn't just reverse-engineered after the fact to give the answer they already wanted. neither one should fold -- I want to see whether either move actually survives the other's objections or if they're both just band-aids on a theory that's broken here.
