answer: |-
  ## Memorandum: Charter Review Committee Recommendation on Non-Resident Taxpayer Representation

  **To:** Town of [Town Name] Select Board  
  **From:** Charter Review Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Formalizing Non-Resident Taxpayer Input in Local Governance  

  ### I. Background & Issue Statement
  The Charter Review Committee has completed its examination of Town governance structures. A significant point of deliberation centered on the status of non-resident property owners (NRPOs), who:
  1.  Own approximately 33% of taxable properties.
  2.  Contribute an estimated 40-45% of the annual property tax levy.
  3.  Are subject to Town zoning, short-term rental regulations, and other bylaws.
  4.  Are currently excluded from participation in Town Meeting and budget votes due to state voter residency requirements.

  The core tension is between the principle of self-government by full-time residents ("residency defines community") and the principle that significant stakeholders bound by Town rules and funding its operations deserve a formal mechanism for input ("no taxation without representation").

  ### II. Committee Recommendation
  **The Charter Review Committee recommends the establishment of two (2) designated Non-Resident Taxpayer Advisory Seats on the Town Finance Committee (FinCom) and the Planning Board.** These seats will carry the following characteristics:

  1.  **Advisory Capacity:** Holders of these seats will participate fully in committee discussions, receive all materials, review draft budgets and bylaws, and offer formal recommendations. However, they will **not** have a formal voting right on final committee recommendations or decisions.
  2.  **Selection:** NRPOs will be elected to these seats *by the body of non-resident taxpayers*. The Town Clerk will administer an annual mail/online election. Eligibility to vote in this election requires proof of property ownership and non-residency. Eligibility to run requires the same plus a minimum of 3 years of property ownership in Town.
  3.  **Scope:** The primary focus of these advisory roles is to provide input directly related to the financial and regulatory burdens borne by NRPOs:
      *   **FinCom Seat:** Focus on budget development, capital planning, and tax policy implications.
      *   **Planning Board Seat:** Focus on zoning amendments, development regulations, and bylaws impacting property use (e.g., STRs, environmental regulations).
  4.  **Term:** Two-year staggered terms.
  5.  **Reporting:** Advisory members will submit formal, written minority reports if their recommendations diverge significantly from the majority (voting) members of the committee. These reports will be included with the committee's official submissions to the Select Board and Town Meeting.

  ### III. Addressing the Strongest Counterargument
  **The Strongest Counterargument:** Granting *any* formal role to non-residents, even advisory, risks diluting the principle of self-government by residents who live with the daily consequences of decisions and opens the door to undue influence by wealthy part-time residents whose priorities may not align with the long-term well-being of the full-time community.

  **Our Response & Mitigation:**
  1.  **No Dilution of Resident Sovereignty:** Final decision-making power remains exclusively with registered voters at Town Meeting and through elected resident officials. Advisory input is just that – *input*. It does not confer decision-making authority. Resident-majority committees and Town Meeting retain full control.
  2.  **Focus on Stakeholder Input, Not Control:** This model explicitly acknowledges the significant financial contribution and regulatory burden placed on NRPOs by providing a structured, transparent channel for *their specific perspective* to be heard where it is most relevant (finances and property regulation). It does not grant them influence over purely resident-centric issues (e.g., school operations, local social services).
  3.  **Transparency & Accountability:** The election process ensures the advisory representatives are accountable *to the NRPO community*, not self-appointed. Their participation is public, their input documented, and any dissenting views are formally recorded alongside the resident-majority view, providing transparency to all voters.
  4.  **Strengthens Informed Decision-Making:** Incorporating the perspective of 45% of the tax base *before* budgets and key bylaws reach Town Meeting provides resident decision-makers with a more complete picture of potential impacts, consequences, and stakeholder concerns, leading to more durable and well-considered outcomes.
  5.  **Practical Reality:** Ignoring the perspective of such a large bloc of stakeholders breeds resentment, risks non-compliance challenges, and may hinder collaborative solutions to town-wide issues. This model fosters constructive engagement within clear boundaries.

  ### IV. Implementation Timeline
  1.  **Immediate (Select Board Action):** Select Board approves this recommendation concept and directs Town Counsel to draft necessary Charter amendment language and enabling bylaws for the election process and committee compositions by **November 15, 2023**.
  2.  **Short-Term (Public Process):** Draft Charter amendments and bylaws presented for public hearing by **December 15, 2023**. Final versions approved by Select Board for inclusion on the Town Meeting warrant by **January 15, 2024**.
  3.  **Spring 2024:** Proposed Charter amendments voted on by registered voters at **Annual Town Meeting (Spring 2024)**.
  4.  **Summer 2024 (If Approved):** Town Clerk establishes NRPO registry/election process. First election for FinCom and Planning Board Advisory Seats held by **August 31, 2024**.
  5.  **Fall 2024:** Newly elected Advisory Members seated on committees in time for FY26 budget development and relevant Planning Board cycles.

  ### V. Conclusion
  The current exclusion of non-resident taxpayers from any formal input mechanism, despite their substantial contribution and subjection to Town regulations, creates a legitimate grievance and overlooks a valuable perspective. Our recommendation for designated, elected, non-voting advisory seats on the FinCom and Planning Board strikes a principled and practical balance. It formally acknowledges the stake of NRPOs within the bounds of resident sovereignty, provides critical stakeholder input to improve decision-making, and mitigates concerns about undue influence by ensuring resident control of final votes. We urge the Select Board to endorse this proposal and place the necessary Charter amendments before the voters at the next Annual Town Meeting.

  Respectfully submitted,
  The Charter Review Committee

  ---

  **Key Strengths of this Recommendation:**

  *   **Takes a Clear Position:** Moves beyond study to a specific, actionable proposal.
  *   **Addresses Core Concerns:** Provides formal voice for NRPOs while safeguarding resident voting control.
  *   **Directly Confronts Opposition:** Acknowledges and rebuts the strongest "self-government dilution" argument with concrete mitigations (no vote, resident control, focus on relevant issues).
  *   **Practical & Targeted:** Focuses input where NRPOs have the most direct stake (Finances, Property Regs).
  *   **Structured & Transparent:** Formal election, defined role, documented input.
  *   **Realistic Timeline:** Provides specific deadlines leading to Town Meeting vote.
  *   **Legally Sound:** Works within the constraint that voting requires residency under state law.
