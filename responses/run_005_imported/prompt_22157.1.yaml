  So I'm about two-thirds into a historical novel set in Dublin in the 1730s and theres a coffeehouse scene I keep botching. One of my characters is loosely modeled on Bishop Berkeley -- specifically his Querist period, after he'd moved on from arguing that trees don't exist unless someone's looking at them and started writing pamphlets about Ireland's economy instead. In the scene he's going head-to-head with a hard-money merchant over whether Ireland should set up a bank issuing paper credit that isn't backed coin-for-coin in silver. My Berkeley-ish character thinks money is basically just a ticket or counter for keeping track of who owes who what, and that the real wealth of a nation is the industry of its people, not the metal sitting in a vault. The merchant remembers what happened with Law's scheme in France well enough (its only been a decade and a half) and thinks a ticket's worthless the second people stop trusting it's redeemable for something of real value. Can you write me the actual dialogue -- 400 to 500 words, no stage directions, just them talking -- where they're genuinely answering each other's points instead of just restating their own? I don't want either one to come off as the dumb one, they should both be landing real hits.
