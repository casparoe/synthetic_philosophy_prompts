answer: |-
  That's an excellent question that cuts to the heart of contemporary debates about dispositions. While Lewis's Reformed Conditional Analysis (RCA) was a monumental step forward and *does* handle many counterexamples effectively, philosophers like Bird, Fara, and Manley & Wasserman persist for several interconnected reasons, demonstrating that Lewis didn't entirely "close the issue":

  1.  **RCA Doesn't Fully Solve Masking/Antidotes:**
      *   **The Core Issue:** Lewis's requirement is that the *causal basis* (B) persists through the stimulus (S) and would cause the manifestation (M) if S occurred *and* B persisted.
      *   **Masking Problem:** Masking occurs when the disposition (D), its causal basis (B), and the stimulus (S) are all present, but an *external interfering factor* prevents B from causing M *even though B is still present and intact*. RCA requires B to persist *and* be capable of causing M if S occurs *and* B persists. But in masking cases, B *is* present, S occurs, B persists... yet M doesn't occur *because of the mask*. RCA seems to predict that M *should* occur (since B persists and is capable), but it doesn't. The mask disrupts the causal chain *from* B *to* M *without* destroying or altering B itself.
      *   **Example:** A fragile glass (D) has its molecular structure (B). It is struck (S). But it's encased in instant-setting foam (mask). B persists through S, and B *is* capable of shattering (if the foam weren't there). RCA's conditional ("if S occurred and B persisted, B would cause M") seems true – if struck without foam, it shatters. Yet, when struck *with* foam, M doesn't occur. RCA doesn't explicitly require the *absence* of masks; it only requires the *presence and persistence* of B. Masking exploits this gap.

  2.  **Ontological Objections to the "Causal Basis":**
      *   **What *is* the Causal Basis?** RCA relies heavily on the concept of a "causal basis" (B). Critics argue:
          *   **Regress Threat:** If dispositions need a causal basis, what is the causal basis *of the causal basis*? Is it categorical properties? Dispositions all the way down? Lewis aimed to avoid regress by making B categorical, but this is contentious.
          *   **Dispositional Essentialism:** Philosophers like Bird argue that *all* fundamental properties *are* essentially dispositional (powers). If this is true, then the "causal basis" (B) *just is* the disposition (D) itself, or is constituted by further dispositions. RCA's distinction between D and a distinct categorical B becomes ontologically problematic or simply collapses. If D *is* B, then RCA's requirement that B persists *is* just requiring D persists, which brings back the original problems of the Simple Conditional Analysis for masking (as the disposition persists, stimulus occurs, but manifestation is blocked).
      *   **"Would Cause" is Dispositional:** The clause "B would cause M" seems itself to ascribe a disposition to B. This raises questions about whether RCA truly reduces dispositions to something non-dispositional or just pushes the dispositionality down a level.

  3.  **The Need for More Unified or Fundamental Accounts:**
      *   **Handling All Cases Uniformly:** While RCA handles finks well (by requiring B's persistence), its handling of masks feels less natural or requires additional external clauses (like the absence of masks). Philosophers seek analyses that handle finks, masks, antidotes, mimics, etc., within a single, elegant, and ontologically perspicuous framework.
      *   **Dispositional Modality:** Philosophers like Fara and Manley & Wasserman are deeply interested in the *specific kind of modality* involved in dispositions (e.g., how it relates to counterfactuals, time, context-sensitivity). They argue RCA, while an improvement, doesn't fully capture this modality or gets the truth conditions of the associated counterfactuals subtly wrong in complex cases, especially those involving masks or degrees.
      *   **Proportionality & Context:** Manley & Wasserman, in particular, argue that disposition ascriptions are context-sensitive and involve judgments about the "proportionality" of the stimulus-manifestation link. Masking cases highlight this context-sensitivity. RCA's fixed conditional structure might be too rigid.

  4.  **Critiques of Counterfactual Semantics:**
      *   **Fine-Grained Counterfactuals:** RCA relies on a specific counterfactual conditional ("If S and B persisted, then B would cause M"). Critics argue that the semantics of counterfactuals (especially under Lewis's own possible worlds semantics) can be problematic in complex dispositional scenarios involving masks or multiple potential interferers. Getting the exact truth conditions right for the counterfactual in *all* cases, particularly where the mask is intrinsic to the scenario, is challenging and a point of active debate.

  **Why Don't They Just Cite RCA?**

  They *do* cite RCA extensively! It's the foundational modern analysis. However, they argue that:

  1.  **It Fails for Masking:** As explained above, they believe masking cases demonstrate a genuine flaw in RCA's structure.
  2.  **It Relies on Problematic Ontology:** They find the concept of a distinct, persistent categorical "causal basis" ontologically dubious or incompatible with dispositional essentialism.
  3.  **It Doesn't Capture the Full Nuance:** They seek accounts that better capture the modal nature, context-sensitivity, or proportionality of dispositions, aspects they feel RCA handles inadequately.

  **Conclusion:**

  Lewis's RCA was a brilliant solution to finks and a significant advance. It *does* handle many antidote cases where the antidote *destroys* the basis. However, the consensus among many contemporary disposition theorists is that **masking cases expose a genuine residual weakness in RCA**: its requirement for the persistence of the causal basis is necessary but *not sufficient* to rule out cases where that basis is *present and intact* but *prevented from operating* by an external blocker. This perceived gap, combined with ontological concerns about the causal basis and a desire for more fundamental or unified accounts of dispositional modality, drives the ongoing research by Bird, Fara, Manley, Wasserman, and others. They aren't ignoring Lewis; they are grappling with what they see as the limitations of his otherwise powerful solution. Your seminar is tackling a very active and sophisticated debate!
