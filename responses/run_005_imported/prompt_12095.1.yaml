answer: |-
  The dust of Zhao tasted like iron on Gongsun Long’s tongue as he approached the border checkpoint. Ahead, the weathered timbers of the gatehouse stood stark against the scrubland, manned by two guards whose bored posture stiffened at the sight of his distinctive white stallion. The animal, Bai Xue – White Snow – shifted nervously, sensing the tension.

  "Halt!" The senior guard, a man with a face like cracked leather and eyes that missed nothing, stepped forward. His hand rested near his sword hilt. "State your business and your cargo."

  Gongsun Long dismounted smoothly. "Scholar Gongsun Long, traveling to Qi. My cargo is myself, my scrolls, and my mount."

  The guard’s gaze fixed on Bai Xue. "Mount. Horse. No horses may cross into Qi from Zhao. Edict of the Lord of Qi. Contagion fears." He gestured dismissively. "Turn back."

  Gongsun Long offered a thin smile. "Ah, but therein lies a misunderstanding, worthy guard. You say ‘no horses’ may cross. Yet, what you see before you is not a horse."

  The guard blinked, then snorted. "Not a horse? That’s four legs, a mane, a tail, big enough to ride. Looks like a horse, smells like a horse. It’s a horse."

  "Appearances," Gongsun Long countered, stepping closer, his voice dropping into a lecturing cadence, "are the surface of the pond. We must dive to the depths of names and their referents. Tell me, guard, what do we *name* when we say ‘horse’?"

  The guard frowned, suspicious but momentarily engaged. "An animal. Like that one."

  "Precisely! ‘Horse’ names the *form*, the essential attributes that make a thing a horse: four legs, hooves, a certain build, capable of bearing a rider or burden. It names the *shape* of the beast, regardless of its color. Yes?"

  "I... suppose so. It’s what makes it a horse, not a cow."

  "Excellent!" Gongsun Long’s eyes gleamed. "Now, consider the term ‘white’. What does ‘white’ name?"

  "Color. Like snow, or rice flour."

  "Exactly! ‘White’ names a *color*, a specific hue that adorns an object. It does not name the *form* of the object itself. A white stone is still a stone. A white robe is still a robe. The color is an attribute *added* to the form."

  The guard shifted his weight, glancing at his companion who shrugged. "So? Your animal has both. Form of a horse, color of white. A white horse."

  "Ah, but here is the crux!" Gongsun Long raised a finger. "Consider: If a man comes seeking a horse, any horse, because he needs the *form* – the strength, the speed, the ability to carry – would he refuse a black horse? A brown horse? A red horse?"

  The guard thought. "No. He needs *a horse*. Color doesn't matter for pulling a cart."

  "Precisely! ‘Horse’, naming the form, encompasses *all* colors. The man seeking a horse accepts *any* instance possessing the essential horse-form." Gongsun Long paused, letting it sink in. "Now, consider a man who specifically seeks a *white* horse. He desires the color attribute. Would he accept a black horse?"

  "Of course not," the guard scoffed. "He wants white."

  "Indeed! The term ‘white horse’ specifies *both* the form *and* the color. It demands an object that satisfies *two* distinct naming conditions: possessing horse-form *and* exhibiting white-color. Therefore," Gongsun Long spread his hands, "the set of things called ‘white horse’ is *narrower* than the set of things called simply ‘horse’. A white horse possesses horse-form *plus* white-color. But ‘horse’ alone refers *only* to the form, indifferent to color. Hence, the *name* ‘white horse’ cannot be identical to the *name* ‘horse’. A white horse *is* a horse, materially, but it is *not* identical to the *concept* signified by the name ‘horse’ alone. Therefore, a white horse is not a horse."

  The guard stared at Bai Xue, then at Gongsun Long, his brow furrowed in deep concentration. The logic, laid out step by step, was undeniable on its own terms. He scratched his chin. "So... you're saying... because I only care about the horse-part for the ban, and the color doesn't matter for *why* we ban horses... but 'white horse' has extra stuff... so maybe... the ban is just on 'horse' meaning the form... and your thing has extra... white?" He struggled, grappling with the abstraction.

  Gongsun Long beamed. "You grasp it! The edict bars 'horses' – meaning creatures possessing the essential horse-form. My companion here possesses that form, yes, but he is *specified* as a *white* horse. He is a unique instance defined by *both* form and color. The ban targets the *general category* 'horse', not the *specific designation* 'white horse'."

  Silence hung heavy in the dusty air. The guard looked from the philosopher’s triumphant face to the magnificent white stallion. He chewed his lip, wrestling the crystalline logic against the brute reality before him.

  "Scholar," he said slowly, his voice losing its initial gruffness but gaining a harder edge. "That’s clever. Truly. Makes my head spin. But..." He stepped closer to Bai Xue, who snorted and tossed his head. "...this creature has four legs, hooves, eats hay, can carry a man. It *is* horse-formed, as you say. And the Lord of Qi’s edict says ‘no horses’ meaning *anything* with that form. He didn’t say ‘no brown horses’ or ‘no black horses’. He said ‘no horses’. Full stop."

  He placed a calloused hand firmly on Bai Xue’s neck. "The *reason* for the ban – the contagion – doesn't care about color, does it? A sick white horse spreads plague just like a sick black one. The *name* in the edict, ‘horse’, points directly to the *form* that carries the disease. Your white horse," he patted the animal, "has that form. Therefore, it falls under the ban."

  Gongsun Long’s smile faltered. "But the *designation*..."

  "Is words, Scholar. Pretty words, clever words." The guard’s voice was flat, final. "Out here, at this gate, the world doesn't run on your distinctions. It runs on what things *are*, and what they *do*. This *is* a horse. It *can* carry disease. Therefore, it *cannot* cross." He nodded to his companion. "Confiscate the animal."

  The younger guard moved forward, taking Bai Xue’s reins. The stallion whinnied, a sound of protest that cut through Gongsun Long like a blade. He reached out instinctively, his hand brushing the warm, familiar flank.

  "Wait! You acknowledge my logic!"

  "I acknowledge it exists," the senior guard said, not unkindly, but with the implacable certainty of stone. "But your logic lives in scrolls and debates. My duty lives here, at this gate, holding the line drawn by my Lord. Your ‘white horse not a horse’ may be true in the Hall of Names. But at the border of Qi, under this sun, that creature is a horse. And it stays."

  He gestured towards the gate. "You may cross, Scholar. Your scrolls, your self. But not the horse."

  Gongsun Long stood frozen as the younger guard led Bai Xue away towards a holding pen. The animal looked back, its dark eyes wide, questioning. The philosopher felt the victory of his argument curdle in his mouth, tasting only ash. He had dissected the names, proved the distinction with impeccable reasoning, laid bare the separation between universal form and specific instance.

  Yet, the world, in the form of a weary guard bound by duty and the tangible threat of plague, had held him to a simpler, starker category: *thing that looks and acts like a horse*. His perfect logic was a bubble, shimmering and intact, floating uselessly above the hard ground where consequences landed with the thud of hooves on dust. He watched his white horse, the living proof of his paradox, disappear behind the timbers, and understood that the gulf between a watertight argument and the world’s demands was measured in the length of a rein, slipping forever from his grasp. He picked up his scrolls, the weight of them suddenly immense, and walked alone towards Qi, the echo of Bai Xue’s whinny the only counterpoint to the silence of his victory.
