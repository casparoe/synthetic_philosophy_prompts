  Hmm, this is a deep philosophical puzzle. Williams claims that genuine reasons must connect to the agent's existing motivations through "sound deliberation." His key move is that deliberation can only rearrange or extend what's already in S - it can't create motivation ex nihilo. McDowell counters with an Aristotelian view where moral education cultivates perceptual capacities - a virtuous person directly perceives reasons in situations, and this perception itself motivates. For McDowell, this breaks Williams' model because the motivation comes from seeing the reason, not processing prior desires.

  But the user wants me to attack McDowell from a Williams-defending position. Let me reconstruct the core argument: McDowell thinks perception of reasons generates new motivation outside S, but actually... (lightbulb moment) any reliable disposition to perceive and be motivated by reasons must itself become part of S! When the virtuous person acquires hexis (a stable disposition), that disposition just is a new motivational element. So when they "see" a reason, it's not magic - it's S working through this new disposition.

  Important nuance: Williams allows S to contain more than desires - it includes "dispositions of evaluation, patterns of emotional reaction, personal loyalties" etc. (That's from "Internal and External Reasons"). So McDowell's perceptual capacity fits neatly into this broad S. The motivational work is still done by S-components, just more sophisticated ones.

  The user's phrasing suggests they suspect McDowell hasn't escaped the internalist net. Good instinct! Even if reasons are perceived externally, the capacity to perceive them must be internally integrated to motivate. No perception-without-motivation occurs unless the perceptual faculty is motivationally wired - and that wiring is S.

  For the handout, I should present this as a rigorous argument, not just commentary. Structure: (1) State Williams' constraint; (2) Present McDowell's challenge; (3) Deliver the counterstrike: acquired sensitivities are S-additions; (4) Explain why this doesn't violate Williams (broad S); (5) Conclude that external reasons remain unproven. Need to emphasize that motivation still flows from S - now including perceptual dispositions - not from reasons alone.

  User's clearly philosophically sophisticated - they use "S" correctly and cite specific moves. They want "meatier" material, so avoid oversimplifying. The "run the argument" demand means formal logic might help, but keep it accessible for a seminar. Probably grad students?

