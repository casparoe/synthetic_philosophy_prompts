answer: |-
  Here’s a rigorous argument defending Williams against McDowell, structured for your seminar handout. The core claim: **McDowell’s "perceptual model" of moral motivation merely relabels the expansion of the subjective motivational set (S) rather than transcending it, leaving Williams’ internalism intact.**  

  ---

  ### **Williams’ Constraint (The Internalist Thesis)**  
  Williams argues that for agent A to have a *reason* to φ, A must be able to arrive at a motivation to φ through *sound deliberation* from their *existing* subjective motivational set (S). S includes desires, commitments, loyalties, and other dispositional states that ground A’s practical identity. Crucially:  
  - **Sound deliberation** is instrumental: it clarifies, extends, or recombines elements of S (e.g., deriving "I need a passport" from "I want to visit Rome").  
  - **No external reasons**: If no chain of sound deliberation links S to φ-ing, A has no reason to φ. Motivation cannot be "conjured" from outside S.  

  ---

  ### **McDowell’s Challenge: Perception Over Processing**  
  McDowell rejects Williams’ "Humean" deliberation. For McDowell:  
  1. **Virtue as perceptual capacity**: A morally educated agent (e.g., Aristotle’s *phronimos*) *sees* reasons directly in the world.  
     - *Example*: A kind person perceives "This stranger is suffering" as an immediate, motivating reason to help. No deliberation occurs.  
  2. **Motivation is non-derivative**: The reason itself motivates via perception, not via manipulation of prior desires.  
  3. **External reasons preserved**: If perception discloses a genuine reason (e.g., suffering’s wrongness), it binds A *regardless* of prior S-content.  

  **McDowell’s Gambit**: Motivation springs from *cognitive contact with reality*—not S-rearrangement. Williams’ model falsely assumes all deliberation is "calculative."  

  ---

  ### **The Argument: Why McDowell Fails to Escape S**  
  **Premise 1: Reliable perceptual sensitivity requires a stable disposition**  
     - For A to *reliably* perceive facts *as reasons* (e.g., suffering as requiring help), A must possess a standing disposition (*hexis*). This disposition enables correct perception.  
     - *This disposition is not innate*: It is acquired via moral education (training, habituation).  

  **Premise 2: Dispositions to perceive reasons are motivational dispositions**  
     - In McDowell’s model, perceiving a reason *necessarily motivates* A (else it isn’t a full perception of a reason).  
     - Thus, the disposition has two components:  
       (a) *Cognitive*: Recognizing feature F (e.g., suffering).  
       (b) *Motivational*: Being moved to φ by F.  
     - The motivational component cannot be "turned off" without corrupting the perception.  

  **Premise 3: Motivational dispositions are elements of S**  
     - Williams’ S includes *all* "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and projects" (*Internal and External Reasons*).  
     - McDowell’s perceptual disposition:  
       - Is a "disposition of evaluation" (it discerns normative features).  
       - Has a motivational essence (it drives action).  
       - Is subjectively held (contingent on A’s upbringing).  
     - ∴ It is a member of S.  

  **Premise 4: "Seeing a reason" is S-dependent motivation**  
     - When A perceives a reason and is motivated:  
       - The perception depends on A’s acquired disposition (S-element).  
       - The motivation flows *from this S-element*, not from the reason alone.  
     - *Counterfactual test*: If A lacked this disposition (e.g., a callous person), they would not:  
       (i) Perceive the fact *as a reason*,  
       (ii) Feel motivated.  
     - ∴ The reason’s motivational force is mediated by S.  

  **Conclusion: McDowell describes S-expansion, not external reasons**  
  - Moral education *adds a new motivational disposition to S*.  
  - "Seeing reasons" is just this new S-element operating transparently.  
  - Williams’ requirement holds: Motivation still traces to S (now including perceptual dispositions). What McDowell calls "external reasons" are just *newly internalized* reasons.  

  ---

  ### **Objections and Replies**  
  **Objection 1**: *But the disposition is cognitive! Its motivational power comes from the reason itself, not S.*  
  - **Reply**: If the disposition weren’t motivational, perceiving reasons wouldn’t necessitate motivation. But McDowell insists it does. Thus, the disposition itself has motivational content—making it part of S.  

  **Objection 2**: *Williams’ S is "Humean" (desire-based)! Perceptual dispositions aren’t desires.*  
  - **Reply**: Williams explicitly broadens S beyond desires to include "evaluative dispositions" (e.g., loyalty to projects). The perceptual disposition is just a complex evaluative state.  

  **Objection 3**: *This reduces moral perception to subjectivism. Doesn’t the reason exist independently?*  
  - **Reply**: Williams can grant that reasons are mind-independent *facts* (e.g., suffering is bad) while denying they are *reasons for A* unless A has a motivation-tracking disposition in S. McDowell conflates *reasons simpliciter* with *reasons for an agent*.  

  ---

  ### **Why This Matters for Your Seminar**  
  Williams’ internalism survives because **all motivationally efficacious reasons must be anchored in the agent’s practical identity (S)**. McDowell’s move—while enriching our view of deliberation—only describes *how S is transformed* (via habituation into perceptual dispositions). It doesn’t show how reasons motivate *without* S. For externalists, the fight continues elsewhere.  

  **Handout-ready summary**:  
  > *McDowell replaces calculative deliberation with moral perception, but his "external" reasons still depend on acquired dispositions within S. Williams’ internalism stands: reasons must connect to the agent’s subjective motivational architecture.*  

  Let me know if you want to expand on Williams' "sound deliberation" or Aristotle's *hexis* for deeper context!
