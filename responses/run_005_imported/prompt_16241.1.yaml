  I'm a cog sci PhD student knee-deep in the Knobe-style literature on how people attribute causation to omissions (e.g. why we say Sarah's not watering the plant caused it to die, but not the fact that pretty much everyone else on the planet also didn't water it), and I want to actually understand the underlying metaphysical debate instead of just skimming the psych papers for their methods section. Could you write me a dialogue between two philosophers of causation - one a strict physical-process theorist (think Dowe, or Beebee's line in "Causing and Nothingness") who thinks omissions aren't really causes since nothing's being transferred or produced, and the other a counterfactual/difference-making theorist (think Lewis, maybe Schaffer) who's totally fine calling absences causes. Get them arguing over that plant case specifically, and have them really grapple with the "selection problem" - why we treat Sarah's omission as THE cause of the plant's death and not everyone else's on the planet who also didn't water it - rather then just talking past each other reciting their own theories.
