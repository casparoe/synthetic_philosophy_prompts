  ## The Unpublished Argument: Bentham vs. Blackstone on the "Unspeakable"

  **Setting:** A dimly lit, book-lined study, London, circa 1785. Jeremy Bentham, young but fiercely intense, paces near the fireplace. Sir William Blackstone, the epitome of judicial gravitas, sits in a high-backed armchair, his expression one of weary disapproval.

  **Bentham:** Sir William, we dance around the heart of the matter! You cloak prejudice in the robes of ‘Natural Law’, condemning acts between consenting men as ‘crimes against nature’ – unfit even for naming! But *why*? What tangible *harm* flows from such private acts? Where is the victim?

  **Blackstone:** Mr. Bentham, your relentless reduction of all things to mere sensation blinds you. The law, sir, is not merely a ledger of pains and pleasures. It is the guardian of order, rooted in principles discernible by right reason – the *Law of Nature*, coeval with mankind, dictated by God Himself. Sodomy, sir, is a violation of that fundamental order. It perverts the natural design of the sexual faculty, ordained solely for procreation within the sacred bond of marriage. To tolerate such an inversion is to strike at the very foundation of society, the family, and the propagation of the species itself. Its very *unnaturalness* is its criminality.

  **Bentham:** "Unnatural"! A word you wield like a cudgel, Sir William, yet it crumbles under scrutiny. Is it ‘natural’ to sail across oceans in wooden ships? To inoculate against disease? To wear spectacles? We constantly bend ‘nature’ to serve human ends, and rightly so! Your ‘Natural Law’ seems suspiciously selective, conforming only to the prejudices and discomforts of the present age, or perhaps merely to Leviticus. You speak of ‘order’ and ‘foundation’, but where is the *evidence* that two men loving privately shakes society? Does the baker cease baking? The soldier cease defending? The state crumble? I see no such consequence.

  **Blackstone:** Evidence, sir? Look to the consequences you so prize! Such acts breed moral contagion. They undermine the essential virtues of chastity and self-restraint. They corrupt the youth. They render the offender an object of justifiable abhorrence, breeding disorder and contempt for the law itself. The law *must* uphold standards that transcend fleeting pleasure or personal whim. It upholds the *dignity* of man as God intended, not as beast governed solely by appetite. To declare such an act merely a private preference is to abandon all moral discernment.

  **Bentham:** "Moral contagion"? "Corrupt the youth"? These are phantoms, Sir William, conjured by distaste, not data! You prosecute acts performed in private, between consenting adults causing *no perceptible injury* to others. Where is the victim demanding redress? The law, in this instance, becomes the sole aggressor, inflicting immense pain – imprisonment, ruin, death! – upon individuals whose actions harm none. Is *this* justice? Or is it merely the tyranny of the majority’s squeamishness, codified by an appeal to an ill-defined ‘Nature’? You punish not for harm done, but for *offense taken* at the mere *idea* of the act. That is despotism disguised as piety.

  **Blackstone:** You dismiss offense too lightly, Bentham. The public sense of decency, the common moral feeling of the people – these *are* tangible social goods worthy of the law’s protection. The law educates as well as punishes. To declare such acts licit would signal societal approval, eroding the very fabric of sexual morality upon which stable families and ordered communities depend. It is not mere ‘squeamishness’; it is the instinctive recoil of a healthy society from that which is inherently degrading and subversive of its own continuance. The potential for harm lies precisely in the normalization of the unnatural.

  **Bentham:** And there lies the crux! You elevate this "instinctive recoil" – often fueled by ignorance and superstition – to the status of divine mandate. But law based *only* on tradition and aversion is stagnant law. It justified slavery, witch-burning, and the persecution of religious dissenters under the same banner of upholding 'order' and 'morality'. Your ‘Natural Law’ condemns the act because it finds it repugnant, then cites that repugnance as proof of its ‘unnaturalness’. It is circular reasoning, Sir William! True law should maximize happiness and minimize suffering. Here, the law *creates* immense suffering – terror, blackmail, shattered lives – to appease a vague sense of collective disgust. Where is the utility in *that*? Where is the *justice*? You punish a man not for harming his neighbour, but for *being* what his neighbour finds distasteful. That is barbarism wearing a judge's wig.

  **Blackstone:** (Coldly, rising) Barbarism, sir, lies in the abandonment of all fixed principles in pursuit of a fleeting, individualistic notion of happiness. You would reduce society to a calculus of isolated sensations, blind to duty, blind to order, blind to the transcendent. The law against this offense stands as a bulwark against chaos, a reaffirmation of the natural and moral order. Its severity reflects the profound threat it poses to that order. Your arguments, Mr. Bentham, are as dangerous as the vice you seek to excuse. They mistake license for liberty, and sensation for virtue. Good day. (He exits stiffly)

  **Bentham:** (To the empty room, clutching his unpublished manuscript) Dangerous? No, Sir William. Dangerous is a law that sacrifices real, suffering human beings on the altar of an abstraction called 'Nature' that looks remarkably like... just fear. The greatest threat to order is the injustice done in its name. *(He looks down at the manuscript, then towards the door Blackstone exited)* One day... they *must* see the suffering. They *must* weigh the actual consequences. One day.
