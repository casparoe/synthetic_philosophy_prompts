answer: |-
  Alright, let's ditch the statues and ships. This concept ("constitution ≠ identity") pops up in surprisingly mundane places. Here’s a fresh example from the world of **finance and law**: **A signed personal check.**

  ### The Setup
  Imagine you write a check to pay your friend $50. You take a piece of paper (let's say it's standard check stock), fill in the date, your friend's name, the amount ($50.00), sign it, and hand it over. Right now, on your desk, we have:

  1.  **The Physical Document:** A rectangular piece of paper (specific check stock) with specific ink marks arranged in a particular pattern: your handwriting, signature, bank details, etc. Let's call this object **"Paper-001"**.
  2.  **The Financial Instrument:** A legally binding order *to your bank* to pay $50.00 from *your account* to *your friend* (or to whoever possesses the check legally). This isn't just ink on paper; it's a functional object governed by banking law (like the Uniform Commercial Code in the US). Let's call this **"Check-50"**.

  ### Why They Are Co-Located but Not Identical
  At this exact moment, **Paper-001** and **Check-50** occupy the exact same space and are made of the exact same matter (paper + ink). However, they are *different objects* because they have **different persistence conditions** – what it takes for *each* of them to continue existing is different:

  1.  **Scenario: Altering the Physical Document (Without Destroying Financial Function)**
      *   You accidentally spill a tiny drop of coffee on the corner of the check, slightly staining the paper. **Paper-001** is altered – it now has a coffee stain. *But* **Check-50** still exists perfectly intact! The stain doesn't affect the legibility of the payee, amount, or signature. The bank will still honor it. The *physical object* (Paper-001) changed, but the *financial instrument* (Check-50) persisted unchanged. This shows they aren't identical because one changed while the other didn't.

  2.  **Scenario: Destroying the Financial Instrument (While Preserving the Physical Matter)**
      *   Your friend decides they don't want the money after all. They take the check and scribble **"VOID"** in large letters right across the payee line and the amount box, making it clearly unpayable according to banking rules. Crucially, they *don't* destroy the paper.
      *   **What happens to Check-50?** **Check-50 is destroyed.** It is no longer a valid financial instrument. The bank will refuse to process it. Its function as an order to pay is nullified.
      *   **What happens to Paper-001?** **Paper-001 persists.** It's still the *same piece of paper* with the *same ink marks* (plus the new "VOID" scribble). It hasn't been torn, burned, or dissolved. All the original matter is still there, arranged almost identically. It just has some extra ink. It exists now as a *voided check document* or simply as *marked paper*.
      *   **The Key Point:** The *financial instrument* (Check-50) ceased to exist because its *functional essence* (being a valid order to pay) was destroyed by the "VOID" mark. The *physical object* (Paper-001), made of the same matter in the same location, continued to exist. Its existence doesn't depend on being a *valid* check; it just depends on being that piece of marked paper.

  ### Why This is a Genuine "Constitution ≠ Identity" Puzzle (and Not Just a Statue in Disguise)
  *   **Fundamentally Different Domain:** This isn't about art, artifacts, or biology. It's about **functional legal/financial objects** defined by social conventions, contracts, and laws. The "Check-50" exists *because* of the banking system and legal agreements, not because of its physical form *alone*. Its "destruction" (voiding) is a *legal/social act* achieved by altering its appearance in a specific way recognized by the system.
  *   **Different Kinds of "Destruction":** Destroying the statue requires physically altering the clay (squashing it). Destroying the check *as a financial instrument* requires altering its appearance *in a way recognized by the system* (voiding it), even if the physical matter remains largely intact. Conversely, slightly damaging the *physical paper* (like a corner tear not affecting key info) might not destroy the *financial instrument* at all.
  *   **Highlights Social Constitution:** This example emphasizes how many objects in our world are constituted *not just* by their physical matter, but by **social practices, rules, and functions**. "Check-50" is a different *kind* of thing than "Paper-001" because it exists within a network of banking rules and human agreements. Its identity and persistence conditions are defined by that social context, not solely by physics or chemistry.

  ### The Core Takeaway (Same as Statue, Fresh Wrapper)
  While the *domain* is new, the *logical structure* confirms the original puzzle: Two distinct things (**Paper-001** and **Check-50**) share all their matter at a given time. Yet, they are not identical because:
  *   They have different **essential properties** (one is defined by physical composition, the other by legal/functional role).
  *   They have different **persistence conditions** (one can survive changes the other cannot, and vice-versa: voiding kills the check but not the paper; completely dissolving the paper in acid kills both).

  The check example forces you to see that "what something *is*" often depends on more than just the atoms it's made of – it depends on the **role it plays in a system** (like finance) and the **rules governing that system**. That's the heart of "constitution ≠ identity." The statue/clay distinction reveals this for physical artifacts; the check distinction reveals it for socially constructed functional objects.
