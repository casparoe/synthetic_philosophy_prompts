  Me and my friend got into it for like two hours last night about weakness of will and I need someone to settle it. She kept bringing up the whole Aristotle/Davidson thing about how its supposedly this deep unsolved puzzle — like, how can you know the cake is bad for you and still eat it anyway. I said thats kind of a solved problem now, behavioral econ figured it out decades ago with hyperbolic discounting: your discount curve just makes near-term rewards spike in value as they get close, so there's no real paradox left, it's just the math of the discount function flipping your preference order at the last minute. She wasn't buying it but couldn't really explain why not. Am I basically right that hyperbolic discounting is the modern answer to the akrasia puzzle, or is she onto something I'm missing?
reasoning: |-
  Okay, let me unpack this user's debate about weakness of will. They're clearly frustrated after a two-hour argument with their friend about akrasia - that classic philosophical puzzle where you know the right thing but do the opposite anyway. 

