  Hmm... the user's objection about "look for" is actually quite sharp. They're right that different search criteria don't necessarily prove categorical difference. But where they might be missing the point is in how classical Chinese logic handles intensional contexts. The paradox weaponizes that gap between substitutability in extensional vs intensional contexts - something modern logic didn't formalize until much later.

  The friend's class/individual distinction is valid but incomplete. Gongsun Long is really attacking the notion that "white horse" could be identical to "horse" by showing how their functional properties differ in practical reasoning. It's less about classes per se than about identity conditions under different descriptions. 

  What's brilliant here is how the argument exploits ordinary language. When we say "looking for a horse," color becomes irrelevant - it's extensional. But "looking for a white horse" makes color essential - intensional. The paradox emerges because if "white horse" truly equaled "horse," this distinction shouldn't exist. Yet it undeniably does in practice. 

  I should emphasize that this isn't wordplay - it's a legitimate challenge to naive referential theories of meaning. The "yellow horse" example isn't arbitrary; it demonstrates that "horse" and "white horse" have different identity conditions. That's why the user's "just about looking for" objection doesn't quite stick - the verb reveals something fundamental about the concepts themselves.

  The historical context matters too. This was revolutionary thinking for 3rd century BCE China. While Parmenides was declaring change impossible, Gongsun Long was dissecting language with similar precision but reaching very different conclusions about particulars and universals. 

  Ultimately both arguments (shape/color and seeking) are two angles on the same issue: how attributes compose meaning. The first is ontological (what exists), the second is pragmatic (how we use concepts). They're complementary attacks on semantic naivete. 

