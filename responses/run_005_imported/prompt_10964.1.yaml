prompt: |-
  What are the most important implications of Strawson's stuff on reactive attitudes (his "Freedom and Resentment" essay) for how I should think about my brother? He's flaked on plans for years and can be a jerk about it, but last year he told me he has ADHD and thats basically why he acts like that. Does that mean I'm supposed to just drop the resentment and start treating him more like someone to be managed than someone to actually blame, or is that too quick a move?
reasoning: |-
  Okay, the user is dealing with their brother who has ADHD and has been flaking on plans for years. They mentioned Strawson's essay on reactive attitudes, so I need to recall what that's about. Strawson talks about how we hold people morally responsible through reactive attitudes like resentment. But he also says that in some cases, like when someone has a condition affecting their actions, we might shift to an objective attitude, seeing them as someone to manage rather than blame.

  First, the user is conflicted. They feel resentment but know their brother's ADHD explains his behavior. They wonder if they should just drop the resentment and switch to managing him. But they might be worried that doing so could harm their relationship, making it less personal. They need a balance between understanding the ADHD and acknowledging their own hurt feelings.

  The user's explicit question is about applying Strawson's ideas. But deeper, they might want to preserve the relationship without ignoring their feelings. They need validation that their resentment is natural but also a way to adjust expectations without dehumanizing their brother.

  Strawson's key points: reactive attitudes are natural for normal relationships. But exemptions like mental illness can shift us to an objective stance. ADHD isn't a full exemption; it's about impaired capacity. So the brother might understand obligations but struggle with executive function. The user shouldn't completely drop resentment but modify it. They can acknowledge the ADHD while still expecting effort.

  The user might fear that excusing the behavior due to ADHD invalidates their hurt. They need to express their feelings and set boundaries. The brother should take responsibility, perhaps by seeking strategies to manage his symptoms. Compromise is key—adjusting plans to be more ADHD-friendly, like shorter meetups or reminders.

  Also, the user might feel guilty for resenting someone with a condition. Strawson's framework allows for modified attitudes. They can hold both truths: ADHD explains the behavior, but the impact on the user is still valid. Empathy from both sides is crucial. The brother should acknowledge the hurt caused, even if unintentionally.

  In summary, the advice should guide the user to a middle path: reduce blame but not accountability, communicate openly, and find practical solutions. This maintains the personal relationship while adapting to the brother's challenges.
answer: |-
  Strawson's "Freedom and Resentment" offers profound insights for your situation, but **it absolutely does not mean you simply "drop resentment" and treat your brother purely as someone "to be managed."** That would be a misunderstanding and an over-application of his ideas. Here's how Strawson helps frame your dilemma and points towards a more nuanced approach:

  1.  **Reactive Attitudes are Fundamental to Relationships:**
      *   Strawson argues that attitudes like resentment, gratitude, forgiveness, and indignation aren't just emotional fluff; they are the *fabric* of interpersonal relationships. They express our basic demand for goodwill and regard from others.
      *   **Implication for you:** Your resentment isn't irrational or petty. It's a natural, human response to feeling disregarded and treated poorly over years. It signals that you *care* about the relationship and expect a baseline level of consideration. Trying to completely suppress or "logic away" this resentment might actually damage the relationship by depersonalizing it.

  2.  **The "Objective Attitude" is a Limited Tool:**
      *   Strawson contrasts reactive attitudes with the "objective attitude." This is when we see someone not as a participant in a reciprocal relationship of mutual regard, but as an object to be managed, treated, trained, cured, or avoided. We adopt this towards the very young, the severely mentally ill, or those under extreme compulsion.
      *   **Implication for you:** Switching *entirely* to an objective attitude ("he has ADHD, he can't help it, I just need to manage him") is inappropriate and potentially dehumanizing for *both* of you. It removes him from the realm of moral agents you relate to and reduces you to a manager/caretaker. This would likely erode the sibling bond you presumably want to preserve.

  3.  **The Crucial Concept: Impairment vs. Exemption:**
      *   Strawson discusses "exempting conditions" – circumstances (like severe psychosis, extreme compulsion, profound intellectual disability) that genuinely render someone incapable of participating in ordinary interpersonal relationships based on mutual regard. In these cases, the objective attitude *is* appropriate.
      *   **ADHD is NOT typically a full exempting condition.** It's a significant *impairment*, particularly in executive functions (planning, organization, time management, impulse control, emotional regulation). This impairment *mitigates* blameworthiness but **does not eliminate his status as a moral agent capable of understanding obligations and trying to manage his condition.**
      *   **Implication for you:** You shouldn't treat him like a helpless object (objective attitude). Instead, you need to **modify your reactive attitudes** in light of the impairment. Your resentment might transform into:
          *   **Frustration:** At the *impact* of his ADHD symptoms on you and the relationship.
          *   **Disappointment:** That he hasn't found better strategies *sooner* or communicated proactively.
          *   **A demand for effort:** A reasonable expectation that, now aware of his condition, he actively works on managing it *in relation to his commitments to you*.
          *   **Conditional goodwill:** Your goodwill and willingness to make plans depends on seeing *some* effort on his part to mitigate the impact.

  4.  **The Shift is in the *Basis* of Expectations and Blame:**
      *   Before knowing about ADHD, you might have blamed him for sheer thoughtlessness, laziness, or disrespect.
      *   Knowing about ADHD, you shift the basis: **Blame is now appropriately directed at a *lack of effort to manage the condition* in ways that respect your relationship, not (primarily) at the symptoms themselves.** You can reasonably expect:
          *   **Acknowledgment:** That his behavior *has* hurt you, regardless of intent.
          *   **Ownership:** Taking responsibility for managing his ADHD's impact on others ("I know my ADHD makes this hard, I'm working on it," instead of just "It's my ADHD" as a full excuse).
          *   **Proactive Effort:** Using tools (calendars, alarms), seeking strategies (therapy, coaching), communicating *early* when plans might fall through, suggesting ADHD-friendly alternatives (shorter meetups, flexible timing).
          *   **Sincere Apologies:** When he does flake, acknowledging the impact *on you*.

  **How to Think About Your Brother (A Strawsonian-Informed Approach):**

  1.  **He is NOT Exempt:** He remains a participant in the moral community and your sibling relationship. You *can* and *should* hold expectations of him.
  2.  **His Responsibility is Modified:** His responsibility isn't for *having* ADHD symptoms, but for **how he manages them and their impact on others.** The bar for "reasonable effort" is adjusted due to the impairment, but it doesn't vanish.
  3.  **Modify, Don't Abandon, Reactive Attitudes:**
      *   **Reduce "Character Resentment":** Less "He's a selfish jerk," more "I'm incredibly frustrated that his ADHD symptoms keep derailing our plans and he hasn't found reliable ways to prevent that."
      *   **Focus on the Harm & Demand for Change:** Channel your reactive attitude into clear communication: "When you cancel last minute repeatedly, it makes me feel unimportant and wastes my time. Knowing about your ADHD helps me understand *why* it happens, but I need you to work *with me* on strategies to make our plans more reliable. What can we try?"
      *   **Forgiveness/Goodwill is Earned Through Effort:** Your willingness to forgive specific incidents and maintain goodwill should be contingent on seeing *genuine effort* from him to manage the impact. It's not an unconditional blank check.
  4.  **Practical Adjustments (Collaborative, Not Just Management):**
      *   **Work *With* Him:** Instead of *you* just "managing" him, collaborate on ADHD-friendly strategies. "Would setting a reminder the day before help?" "Should we make plans with a shorter time commitment or a more flexible window?" "Can you text me if you're running late or feeling overwhelmed?"
      *   **Adjust Expectations, Not Values:** Expect less *reliability* in the traditional sense, but maintain the expectation of *effort, communication, and regard*.
      *   **Protect Yourself:** It's reasonable to set boundaries. "I love you, but if you cancel last minute without a very good reason and without calling, I won't be able to plan things that require reservations/my time off." This isn't punishment; it's self-protection based on predictable patterns.

  **Conclusion: It's not "blame vs. manage."** Strawson points to a middle path where you:

  *   **Acknowledge the Impairment:** Understand ADHD genuinely makes things harder for him.
  *   **Modify Blame:** Shift blame from the core symptoms to a *lack of responsible management* of those symptoms' impact.
  *   **Maintain the Relationship Framework:** Continue to see him as a participant in a reciprocal relationship deserving of (modified) goodwill, but also subject to (modified) expectations and reactive attitudes.
  *   **Demand Effort & Collaboration:** Expect and encourage proactive steps from *him* to mitigate the impact on you.
  *   **Express Your Feelings Validly:** Your frustration and hurt are legitimate expressions of your regard for the relationship. Communicate them constructively, focusing on the impact and your need for change.
  *   **Set Boundaries:** Protect your time and emotional energy based on his demonstrated level of effort and reliability.

  **So, no, don't just drop resentment and become his manager.** Use the understanding of ADHD to transform your resentment into a demand for collaborative effort and responsible management *from him*, while protecting yourself through realistic expectations and boundaries. This maintains the human connection (reactive attitudes) while acknowledging the real constraints (modified objective understanding) of his condition.
