prompt: |-
  Quick context: in my lab we run a lot of online studies, and my advisor's policy is to just check the Bayes factor every couple days as data trickles in and stop whenever it's convincing -- exactly the kind of "peeking" that the replication-crisis papers flag as a questionable research practice, except her line is that it's totally fine once you're Bayesian because of the likelihood principle. I've started repeating that in lab meetings but honestly I only have a hand-wavy grasp of why its true, and I have this nagging memory of a critique along the lines of Bayesians being able to "sample to a foregone conclusion" too, under the wrong prior. Can you give me the most important implications of the likelihood principle here -- i.e. is our peek-and-stop habit actually kosher once we've swapped p-values for Bayes factors, and if there's a real catch rather than just frequentists being sore losers, what would have to be true of our priors or model for it to bite us?
reasoning: |-
  Okay, let me unpack this user's query. They're in a lab setting where their advisor uses Bayes factors with periodic peeking to decide when to stop data collection, claiming it's fine due to the likelihood principle. The user is repeating this justification but feels uncertain about the underlying reasons and recalls a critique about "sampling to a foregone conclusion." They want to understand if their method is valid and what potential pitfalls exist.

  First, I need to recall the likelihood principle. It states that all evidence from an experiment is in the likelihood function, so the stopping rule shouldn't affect inference. This contrasts with frequentist methods where stopping rules influence p-values. The advisor's Bayesian approach seems to align with this principle.

  But the user mentioned a critique about "sampling to a foregone conclusion." That's from Robbins (1952), showing that with continuous data and certain priors, one could keep sampling until they get a misleadingly high BF. The key here is the prior choice. If the prior is misspecified—say, putting too much mass on an implausible effect size—it could lead to false conclusions even with BF peeking.

  I should explain when the method is safe versus risky. With well-justified priors, peeking isn't problematic. But if priors are too diffuse or misaligned with reality, there's a risk of bias. The user needs to assess if their lab's priors are based on solid domain knowledge or are arbitrary. Also, the model must correctly represent the data-generating process; misspecification here could invalidate results.

  The user's deeper concern might be about maintaining rigor while using this method. They might worry about unintentional p-hacking via priors. Emphasizing the importance of prior justification and transparent reporting is crucial. They should document priors, stopping rules, and all analyses to avoid "researcher degrees of freedom."

  Also, considering their role in lab meetings, they need a clear explanation to defend the practice confidently or critique it constructively. Highlighting that the catch lies in prior/model misspecification rather than the peeking itself addresses their query about the "real catch."

  In summary, the Bayesian approach with BF is theoretically sound under the likelihood principle, but practical validity hinges on appropriate priors and models. Ensuring these are well-founded mitigates risks of erroneous conclusions.
answer: |-
  You've hit on a core philosophical and practical debate in statistics! Your advisor is **largely correct** about the Bayesian justification for peeking *in principle* due to the Likelihood Principle (LP), **BUT** the critique about "sampling to a foregone conclusion" is also valid and points to the **critical dependence on the prior**. Here's the breakdown:

  1.  **The Likelihood Principle (LP) is the Key:**
      *   The LP states: *All the evidence provided by the data regarding the relative plausibility of two hypotheses (H1 vs H0) is contained in the likelihood ratio.* Furthermore, *the experimental context (including the stopping rule) that did not influence the data itself is irrelevant for this evidential interpretation.*
      *   **Implication for Peeking:** Since the likelihood function only depends on the data you *actually observed*, how you decided to stop collecting that data (whether a fixed N, peeking every 10 subjects, or stopping when BF>10) doesn't change the evidence *contained in that specific dataset*. The BF, being a ratio of marginal likelihoods (averaged over the prior), inherits this property. **For the Bayesian evaluating evidence *from the observed data*, the stopping rule is irrelevant.**

  2.  **Why Frequentist P-Values Break Under Peeking:**
      *   Frequentist inference defines error rates (Type I/II) over the *long run* of hypothetical repeated experiments *under a specific sampling plan (stopping rule)*.
      *   Peeking changes the sampling plan. Stopping early because the data *looks* significant inflates the Type I error rate *under the frequentist definition* because you're adding more opportunities to falsely reject H0. The p-value calculation *must* account for the stopping rule to maintain its nominal meaning (e.g., using sequential testing methods).

  3.  **The Bayesian "Get Out of Jail Free" Card (The Good Part):**
      *   **Bayesian interpretation is conditional on the observed data.** It answers "Given *this specific data*, how should I update my beliefs about H1 vs H0?" The LP guarantees that the answer (the posterior odds or BF) depends *only* on the likelihood of the observed data under each hypothesis (averaged over the prior), *not* on what other data you *might* have collected under different stopping rules.
      *   **Therefore:** From a strict Bayesian/LP perspective, **your lab's "peek-and-stop" habit is logically coherent and "kosher" for interpreting the evidence *in the data you actually collected*.** You aren't inflating a Bayesian error rate in the same way peeking inflates frequentist Type I error.

  4.  **The Catch: "Sampling to a Foregone Conclusion" (The Ugly Part):**
      *   The critique you remember is spot on. It stems from a famous result by **Herbert Robbins (1952)**. He showed that for **continuous data**, under **some prior distributions**, a Bayesian can design a sequential testing procedure where they are *guaranteed* to eventually get a BF (or posterior probability) arbitrarily large in favor of *either* H1 or H0, **even if the true state of the world is the *opposite* hypothesis.**
      *   **Why does this happen?** It hinges entirely on **prior misspecification**:
          *   **The Problematic Prior:** If the prior places non-zero probability density on parameter values that are *extremely* implausible or even impossible (e.g., an effect size of δ = 1000 in a psychology experiment), the BF can become very sensitive to random fluctuations early in sampling that happen to align with these absurd values. You can keep sampling until such a fluctuation occurs, "confirming" the absurd hypothesis.
          *   **The Mechanism:** The marginal likelihood (the denominator/denominator in the BF) involves an integral/average over the *entire* prior. If the prior has very thin tails or unrealistic spikes, random noise can make the data look surprisingly likely under one hypothesis *compared to its average likelihood under the other*, especially with small N.

  5.  **What Has to Be True for the Catch to Bite You?**
      For "sampling to a foregone conclusion" to be a *practical* risk in your lab (not just a theoretical curiosity), **one or both of these conditions must hold**:
      *   **1. Severely Misspecified Priors:** Your lab is using priors that are **wildly unrealistic or overly diffuse**.
          *   **Overly Diffuse:** Priors spread probability mass over absurdly large effect sizes (e.g., a Cauchy(0, 1) prior on a standardized effect when realistic effects are |δ| < 1). This makes the marginal likelihood under H1 very small on average, but a single extreme data point can cause a massive spike in the BF favoring H1.
          *   **Pathological Spikes:** Priors concentrating mass on very specific, unrealistic values.
          *   **Mismatched to Reality:** Priors completely at odds with established domain knowledge (e.g., putting significant prior mass on negative effects for a well-established positive phenomenon).
      *   **2. Model Misspecification:** Your statistical model fundamentally misrepresents the data-generating process. If the model is wrong, the likelihood is wrong, and the BF becomes meaningless garbage, regardless of peeking or priors.

  6.  **Practical Implications for Your Lab:**
      *   **Peeking is Kosher *if*:** Your priors are **well-justified** (based on substantive knowledge, previous similar studies, or conservative defaults appropriate for your field) and your **model is correctly specified**. Under these conditions, the LP holds, and the BF from your peek-and-stop procedure validly represents the evidence in your *specific* dataset.
      *   **The Catch Will Bite You *if*:** Your priors are **arbitrary, unreasonably diffuse, or blatantly unrealistic** relative to the actual scientific context. In this case, the BF can be misled by early random fluctuations, and peeking allows you to capitalize on this misleading signal by stopping early. **This is the Bayesian analogue of p-hacking: "prior-hacking" or "model-hacking".**
      *   **The Real Danger - Researcher Degrees of Freedom:** The *biggest* practical risk isn't necessarily "sampling to a foregone conclusion" in the Robbins sense, but the **temptation to *change* the analysis (priors, models, variables, exclusion criteria) *based* on the peeked results** to get the BF you want. *This* invalidates the Bayesian argument just as much as it invalidates frequentist inference. Preregistration of priors, models, and stopping rules is crucial for Bayesian analyses too!

  **Conclusion:**

  Your advisor is right about the theoretical justification from the Likelihood Principle: **for a Bayesian using well-justified priors and a correct model, peeking does not invalidate the interpretation of the BF based on the observed data.** The stopping rule is irrelevant for evidential interpretation.

  **However, the "sampling to a foregone conclusion" critique is a vital caveat:** **This validity critically depends on having reasonable priors.** If your lab uses slapdash, overly diffuse, or unrealistic priors, the BF *can* be driven to extreme values by random fluctuations, and peeking allows you to stop when this misleading signal occurs. The catch isn't about frequentists being sore losers; it's about the **profound sensitivity of the BF to prior specification, especially with small N and sequential peeking.**

  **Recommendation for Lab Meetings:**

  1.  **Acknowledge the LP:** Explain that the BF depends *only* on the likelihood of the observed data, so the stopping rule doesn't change the evidence *in that data*.
  2.  **Emphasize the Prior's Critical Role:** Stress that this validity **absolutely requires well-justified priors**. Defend the lab's chosen priors explicitly using domain knowledge, literature, or arguments for conservatism. If priors are arbitrary defaults, acknowledge the limitation.
  3.  **Guard Against Flexibility:** Advocate for pre-registering the analysis plan (priors, models, stopping rule) to prevent post-hoc changes based on peeked results. This maintains the integrity the Bayesian argument provides against peeking.
  4.  **Use Sensible Stopping Rules:** While theoretically you *can* stop at any BF, practical considerations (desired precision, cost) often make rules like "Stop if BF>10 *or* N>1000" more sensible than indefinite sampling. This also mitigates the (small) practical risk from extreme priors.

  In essence: **Peek-and-stop is kosher Bayes *iff* your priors are kosher science.** The burden shifts from worrying about the stopping rule to rigorously justifying the prior.
