answer: |-
  ## Dialogue: Ashes Over the Lake

  **Characters:**  
  *   **Alex:** Proponent of the Trust/Expectation View (Scanlon/Hume-inspired)  
  *   **Sam:** Proponent of Owens's Normative Authority View  

  **(The scene: A seminar room after class, coffee cups on the table.)**

  **Alex:** Okay, Sam, take this dying father case. He extracts a private promise about his ashes. No one else knows, no consequences for trust or reputation. On your authority view, the daughter is still bound, right? But *why*? What tangible moral force remains? The father is gone. He can't feel let down, can't experience betrayal. The whole machinery of trust and expectation – the *reason* promises bind on my view – evaporates with his last breath. Without a living promisee to rely, to be disappointed, or to have their interests set back by non-performance, the obligation dissolves. It’s a phantom duty.

  **Sam:** Phantom? Hardly, Alex. The force isn't tied to the father’s *post-mortem* feelings or awareness. It’s about the *authority* he exercised *while alive*. By asking for and accepting her promise, he intentionally transferred a specific normative power to himself. He gained the standing to demand she scatter the ashes and, crucially, the standing to resent her if she didn’t. That authority relation was instantiated *at the moment of promising*. His death doesn’t retroactively dissolve the normative structure he created. She wrongs *him*, even if he never knows it. His death ends his capacity to *feel* resentment, but not the fact that resentment *would be fitting*.

  **Alex:** "Would be fitting"? That’s precisely the ghost I’m talking about! Scanlon’s Principle F is grounded in preventing the *actual* harm of exploiting induced reliance. Hume’s convention exists to stabilize *actual* social expectations. But here? There *is* no actual reliance to exploit post-death. The father *can’t* rely. There’s no social expectation to uphold because it’s secret. Principle F bites on causing loss *through disappointed reliance*. What loss is possible here? What actual interest of the father’s is set back *now* by her choice? His experiential interests ceased. His reputational interests are untouched. Your "fitting resentment" feels like a metaphysical abstraction disconnected from the psychological and social facts that give promises their concrete moral weight.

  **Sam:** You’re conflating the *ground* of the obligation with its *effects*. The ground isn’t the *empirical fact* of reliance or feeling disappointment; it’s the *normative power* transferred. Our interest in controlling our normative situation – in having others bound *to us* in specific ways – is fundamental and distinct from our interest in satisfied expectations. Think of wills or deathbed confessions. We respect them not (only) because of the *reliance* of the dead, but because they exercised an authority over their affairs that persists. The daughter, by promising, acknowledged his authority over this aspect of his remains. Violating it disrespects *that* authority, that control he rightfully claimed. It’s about the *wrong done to the promisee*, defined by the violation of the authority they held, not contingent on their current capacity to feel wronged.

  **Alex:** But Sam, if the "wrong done" consists *solely* in violating a transferred normative power, and that power’s exercise leaves no trace in the world of experience, interests, or social relations – no disappointed person, no broken trust, no damaged cooperation – then what *is* the substance of the wrong? It seems reducible to "she broke the rule." But *why* is that rule morally binding in *this* case, isolated from any consequences? On my view, the rule against promise-breaking is binding *because* of the harm breaking it typically causes to reliance and trust. Strip that away, as this case does, and the obligation loses its foundation. Your authority becomes a free-floating norm, disconnected from human interests. The daughter choosing interment isn't *harming* anyone or *damaging* any trust-dependent practice. What moral reason compels her, beyond a bare abstraction?

  **Sam:** It’s not bare! It’s grounded in the profound human interest in normative control – the interest *he* had in determining how *he* would be treated in this specific matter, an interest realized *through* her promise. You reduce morality to a calculus of tangible harms and social utility. But respecting persons means respecting the normative powers they rightfully exercise over us *when they create relationships of obligation*. Her reason is: *He* gave her this instruction *as a demand he had the right to make*, and she accepted that demand as binding. To disregard it is to treat *his* past exercise of that authority, and *his* interest in controlling that aspect of his legacy, as morally inert. It fails to respect *him* as a source of valid claims, even posthumously. The harm isn't empirical disappointment; it's the moral injury inherent in violating a relationship constituted by transferred authority.

  **Alex:** And there’s the rub. You invoke "respecting *him*". But if *he* is gone, incapable of experiencing respect or disrespect, and his *empirical interests* (reputation, relationships, feelings) are untouched, what does this "respect" consist in *concretely*? It seems like respecting a *shadow*, a past act severed from any present connection to a sentient being or a functioning social practice. My view ties respect for promises to respecting the *living interests* of promisees and the social fabric. Here, those are absent. Your view demands respect for a *metaphysical relic* – the frozen moment of transferred authority. Is the daughter really morally bound to prioritize this relic over her own feelings, or family tradition, when *no one* is impacted? Isn’t the insistence on obligation here just fetishizing the form of promising divorced from its function?

  **Sam:** No, it’s recognizing that the function *is* the transfer of authority itself! That *is* a core human interest, distinct from reliance. You keep insisting obligations must serve some *further* interest in satisfaction or social order. But controlling our normative relations *is* the primary interest served by promising, on this view. Her choice isn’t impact-less; it *wrongs him*, violating the specific normative relation *he* established. The concreteness lies in the *relational fact* she created by promising. It’s not a relic; it’s a persisting moral fact about their relationship. To say she isn’t bound reduces promising to a tool for managing expectations, ignoring its role in constituting direct, authority-based obligations between persons. When she promised, she invited him to govern her action in this matter. That invitation stands.

  **Alex:** Govern? From beyond the grave? With no mechanism for enforcement, no possibility of complaint, no effect on any living soul or social good? If the *only* manifestation of this "persisting moral fact" is the daughter’s own feeling of constraint, based on a memory of a transferred power no one else can perceive or validate, how is this different from a personal vow? Why call it an *obligation* rather than a powerful wish? The *crux*, Sam, is this: Can a moral obligation to another person *truly* persist when that person’s existence, experiences, and social presence have completely ceased, and the act has no bearing on any other moral good – when the *only* thing violated is an abstract, unobservable "authority relation" frozen in a past moment? Or does obligation, at its core, require a connection to the *lived reality* of persons and their interactions, like trust, reliance, and the prevention of harm – things extinguished here with the promisee’s death?

  **Sam:** And *that’s* the crux: You see persons only as bundles of experiences and social effects. I see persons as sources of normative claims whose validity can transcend their experiential presence. The authority wasn’t "frozen"; it was *exercised*, creating an enduring obligation. To deny that obligation persists is to deny that the promisee’s normative control over the promisor, validly established, has any moral reality independent of the promisee’s continued sentience. It reduces the moral significance of our promissory acts to their contingent consequences. But the daughter’s act of promising *changed the moral landscape* between her and her father. That landscape doesn’t revert to neutral just because he can no longer survey it. The wrong is in the violation of *what was due to him*, defined by the authority *he held*... *(Sam trails off, seeing Alex poised to challenge the very notion of "due to him" absent a living "him").*

  **(The dialogue ends here, the central disagreement crystallized: Does a promise create an obligation *to the promisee* that can meaningfully persist *solely* as a violation of a past-transferred normative authority, even when the promisee is gone and no other tangible harm or social dysfunction results? Or does obligation require a connection to the ongoing, sentient interests of persons or the functional needs of trust-based society, connections severed in this case? Neither has conceded; the fundamental assumptions about persons, obligation, and the nature of promising itself stand irreconcilably opposed.)**
