prompt: |-
  ok so I'm writing a seminar paper on early modern political thought and keep getting stuck on that Pascal fragment about justice and force -- justice without force is powerless, force without justice is tyranny, plus the bit about how since we can't make what's just strong, we made what's strong just. Most people read that as basically proto-Hobbesian cynicism about power, but that feels too clean given how much skeptical work Pascal's doing elsewhere (the "truth on this side of the Pyrenees, error on the other" stuff about custom and law). Is the force-becomes-justice move meant as a cynical/moral claim, or more of an epistemic one -- like we literally can't access what justice actually is, so force ends up being the only stable thing to hang authority on? And if its the latter, how does that square with the three orders bit (body/mind/charity) -- is he saying genuine justice just isn't available in the political order at all, and only shows up in charity? I feel like there's supposed to be one coherent argument linking the skepticism, the Pyrenees/custom stuff, and the three orders, but the Pensées are so fragmentary that I honestly can't tell if I'm forcing connections that aren't really there. Could you help me get more of a gut-level intuitive read on what's actually going on?
