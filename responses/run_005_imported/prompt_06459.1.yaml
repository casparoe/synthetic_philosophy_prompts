answer: |-
  You're absolutely right to push against the "proto-Hobbesian" reading – it flattens Pascal's radical and uniquely theological skepticism. The key lies precisely in the connections you're sensing: Pascal's critique of reason/custom, the force/justice dynamic, and the Three Orders form a devastatingly coherent, though fragmented, argument about the *impossibility* of grounding earthly justice in reason or inherent right. Here's an intuitive breakdown:

  1.  **The Epistemic Wrecking Ball (Pyrenees/Custom):** The "truth on this side..." fragment isn't just about cultural relativism; it's a profound attack on *reason itself* as a foundation for justice or morality.
      *   **Intuition:** Imagine trying to logically prove why your country's driving on the right/left is "just." You can't. It's pure convention, solidified by force (law enforcement). Pascal extends this to *all* human laws and concepts of justice. Reason is brilliant at geometry, useless at discerning inherent moral truths. What we call "justice" is mostly inherited custom, habit, and power dynamics masquerading as reason. There's no "view from nowhere" to access *true* justice.

  2.  **The Force/Justice Conundrum (Fragment 103):** This isn't *primarily* a cynical observation about power politics (though it includes that); it's a **tragic necessity born of the epistemic collapse.**
      *   **Problem:** True Justice (if it exists transcendentally) is inherently weak in the fallen human world. Force is inherently powerful but morally blind.
      *   **Human "Solution":** Since we lack the epistemic capacity to establish *and enforce* true justice rationally ("cannot make what is just strong"), humanity performs a desperate, self-preserving sleight-of-hand: we sanctify established power ("make what is strong just").
      *   **Intuition:** It's like admitting we can't build a perfect foundation for society. So, we take the biggest, sturdiest rock we find (existing power structures, monarchies, laws backed by armies), declare *it* to be the foundation ("justice"), and build on that. It's not *true* justice, but it prevents utter chaos. This "justice" is fundamentally **custom legitimized by duration and power.** Pascal calls this established order "the mystique of the state" – a necessary fiction.

  3.  **The Three Orders (Body/Mind/Charity):** This is where the *why* becomes clear and separates Pascal utterly from Hobbes.
      *   **The Orders Defined:**
          *   **Order of Bodies (Flesh):** Realm of material power, force, senses, passions. Kings, armies, wealth, physical pleasure reign here. Justice here *is* effectively "might makes right," stabilized as custom/law.
          *   **Order of Minds (Reason):** Realm of intellect, science, philosophy, abstract thought. Great minds (Plato, Descartes) shine here. *But crucially, reason cannot access true justice or ultimate truth.* It can dissect the world and even critique the Order of Bodies, but it hits a wall when seeking foundations for morality or meaning.
          *   **Order of Charity (Heart/Will/Love):** Realm of divine grace, true justice, holiness, love of God. *This is the only realm where true justice resides.* It's accessed not by reason or force, but by faith, humility, and the infused grace of God (the "heart" in Pascal's sense).
      *   **The Political Trap:** Politics operates almost entirely within the **Order of Bodies**, spilling marginally into the Order of Minds (lawyers, philosophers advising rulers). *Genuine Justice (Order of Charity) is utterly inaccessible to political systems.* Why?
          *   Political power is inherently based on force/material control (Bodies).
          *   Political justification relies on custom/habit/reason, which Pascal has shown are incapable of reaching true justice (Minds hit their limit).
          *   True justice belongs to a completely different, transcendent order (Charity), governed by divine love, not human force or reason.

  **The Coherent Argument (Your Gut-Level Synthesis):**

  1.  **Epistemic Skepticism:** Human reason (Order of Minds) is brilliant but fundamentally incapable of discerning *inherent, universal justice* ("Pyrenees" fragment). It's corrupted by self-interest and limited by perspective.
  2.  **Consequence for Politics:** Therefore, any attempt to build a *rational* foundation for political justice in the Order of Bodies is doomed. We simply don't have access to the blueprint for true justice.
  3.  **The Tragic Necessity:** To avoid perpetual war and chaos (Hobbes' fear, which Pascal acknowledges), humanity in the Order of Bodies performs a necessary trick: it takes established force (the strongest rock) and *declares* it just ("make what is strong just"). This creates stability through custom and the "mystique" of authority. **This isn't cynicism endorsing tyranny; it's a bleak anthropological diagnosis of fallen humanity's political predicament.** It's the best we can *do* without grace.
  4.  **The Theological Resolution:** True Justice *does* exist, but only in the **Order of Charity**. It is God's justice, revealed through Christ and accessible only through faith, humility, and grace. This justice is perfect but *belongs to a different realm*. It cannot be implemented by kings, parliaments, or philosophers using force or reason. It operates on a plane beyond politics.

  **Why it's NOT Hobbesian:**

  *   **Hobbes:** Force *creates* right/justice via the Social Contract. Power is the *source* of legitimacy in a mechanistic universe. Reason (Leviathan's calculation) can design this system.
  *   **Pascal:** Force is *mistaken for* justice because of our epistemic failure and need for order. True justice exists *elsewhere* (Charity). Reason is fundamentally *inadequate* for the task of founding justice. Hobbes offers a (grim) solution; Pascal offers a devastating critique pointing to a theological truth *beyond* politics.

  **Your Paper's Gut-Level Core:**

  Pascal argues that the search for rational, earthly justice is a fool's errand. Our "justice" is just powerful custom dressed up. Real politics is the realm of force stabilized by fiction. This isn't because humans are *only* brutish (Hobbes), but because our reason is too weak and corrupted to grasp true justice, which belongs solely to the divine realm (Charity). The "force becomes justice" move is the tragic, necessary coping mechanism of a fallen species trying to build society without access to the true foundations. It's an **epistemic limitation forcing a pragmatic (but ultimately false) moral settlement** in the Order of Bodies. The connection *is* there: skepticism about reason (Pyrenees) explains *why* we must rely on force-as-justice (Fragment 103), and the Three Orders explain *why* true justice remains transcendentally out of reach for politics, residing only in Charity.

  **Think of it like this:** Earthly politics is a dark cave. We can't see true justice (the sun outside). We take the faintest, most stable glimmer we find (force/custom) and call *that* light (justice). Pascal doesn't just say "that's all there is" (Hobbes); he points mournfully to the *real* light source far beyond the cave, accessible only by a path (faith/charity) that leads *out* of the political cave entirely. Your frustration with the "clean" Hobbesian reading is spot-on – Pascal's view is far more tragic and theologically profound.
