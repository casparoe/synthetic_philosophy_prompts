  A friend from my old decision theory reading group is getting married next month and asked me to give the toast. She's obsessed with Kavka's toxin puzzle -- the one where a billionaire pays you a fortune just for sincerely intending to drink something nasty, not for actually drinking it -- so I want to build the speech around it somehow. Problem is half the room is old philosophy people who'll catch every reference, and the other half is her family, who's never heard of Gregory Kavka in their life. Can you write me a 4-5 minute toast that actually uses the puzzle's specific weirdness -- intending now to do something you'll have zero incentive to follow through on later -- to say something true about the two of them, without it turning into a decision theory lecture for the half of the room that didn't sign up for one?
