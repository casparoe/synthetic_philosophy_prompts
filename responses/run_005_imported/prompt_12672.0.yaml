  Underlying needs: They might feel their ecological expertise isn’t adequately addressed in philosophy. They seek a synthesis of their field with utilitarianism, possibly to contribute to the debate or find intellectual satisfaction. They could also want reassurance that their conclusion is logically sound despite societal pushback.

