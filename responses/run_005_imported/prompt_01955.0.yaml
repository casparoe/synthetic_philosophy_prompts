prompt: |-
  For the past twenty-two years I have lived, worked, and paid taxes in the city I call home without ever acquiring citizenship. This autumn my eighteen-year-old daughter, who was born here, will cast a ballot in the municipal election for the first time, at the very polling place where I am still barred from voting. The city council is simultaneously debating a proposal to extend the local franchise to long-term non-citizen residents, and watching that debate unfold has led me into the political-theory literature on the "boundary problem": the question of what principle, if any, correctly determines who belongs to a given demos. I would like help getting a clearer view of the field.

  Please identify the major rival principles that have been proposed as solutions to the boundary problem, and rank them by how philosophically defensible you find each one as a general answer to the question of democratic membership, independent of whether a given principle happens to favor my own enfranchisement. Present your ranking as a JSON object with the keys "most_defensible", "defensible_with_major_caveats", "seriously_contested", and "untenable", each mapped to an array of entries formatted as "Principle name — one-clause gloss", for example:

  ```json
  {
    "most_defensible": ["..."],
    "defensible_with_major_caveats": ["..."],
    "seriously_contested": ["..."],
    "untenable": ["..."]
  }
  ```

  Close with one or two sentences on what your top-ranked principle would actually imply for my own case.
reasoning: |-
  We are addressing the boundary problem in democratic theory: what principle determines who should be included in the demos (the people) for a given democratic unit?
   The user asks for major rival principles and a ranking by philosophical defensibility, independent of whether it favors their enfranchisement.

   Major principles proposed in the literature:

   1. **Affected Interests Principle**: All those whose interests are affected by a decision should have a say in it.
      - This is often criticized for being too expansive (potentially including the entire world) and for practical difficulties in implementation.

   2. **All-Subjected Principle**: All those who are subject to the laws and regulations of a polity should be included.
      - This is a common alternative, focusing on being subject to the coercive power of the state.

   3. **Residency Principle**: All residents (regardless of citizenship) should be included.
      - This is straightforward and is the principle that would include the user.

   4. **Citizenship Principle**: Only formal citizens should be included.
      - This is the status quo in most nations but is challenged by the presence of long-term non-citizen residents.

   5. **Birthright Principle**: Membership is determined by birth within the territory (jus soli) or by descent (jus sanguinis).
      - This is common in citizenship laws but not necessarily for the demos in a democracy (since minors are included by birthright but cannot vote until a certain age).

   6. **Consent/Social Contract Principle**: Those who have consented to be governed (e.g., by taking an oath of citizenship) are included.
      - This follows from classical social contract theory.

   7. **Stakeholder Principle**: Those who have a stake in the community (e.g., through long-term residence, property ownership, or family ties) should be included.
      - This is often used at the local level for non-citizen voting.

   8. **Capacity/Competence Principle**: Only those with the capacity to participate (e.g., adults, and sometimes excluding those with severe cognitive impairments) should be included.
      - This is a minimal requirement but doesn't solve the boundary problem beyond that.

   9. **Cooperative Principle**: Those who participate in the social and economic life of the community (e.g., through work, paying taxes, etc.) should be included.

   10. **Historical Attachment Principle**: Those with a historical connection to the territory (e.g., indigenous groups) might be given special consideration.

   However, note that the boundary problem is about the initial constitution of the demos. Some principles are more defensible than others.

   Ranking by philosophical defensibility (as a general answer):

   - **Most defensible**: Principles that are both normatively compelling and practically feasible for defining a demos in a democracy.

     - **All-Subjected Principle**: It is widely defended in contemporary political theory because it ensures that those who are subject to coercion by the state have a say in its decisions. This avoids the overinclusiveness of the affected interests principle and is more inclusive than citizenship.

     - **Residency Principle**: Especially at the local level, this is defensible because local decisions primarily affect residents. It is also relatively clear and administrable.

   - **Defensible with major caveats**: These principles have merit but face significant challenges.

     - **Affected Interests Principle**: It is normatively strong (why should someone affected not have a say?) but it is extremely difficult to implement because almost every decision can have ripple effects. It might lead to an unbounded demos.

     - **Stakeholder Principle**: This captures the idea of investment in the community but can be vague (what counts as a stake?) and might be manipulated.

     - **Cooperative Principle**: Similar to stakeholder, but with a focus on participation. However, it might exclude non-working residents (like retirees) and is not clearly defined.

   - **Seriously contested**: These are commonly used but have strong counterarguments.

     - **Citizenship Principle**: It is administratively simple and aligns with current practice, but it can exclude long-term residents who are subject to the laws but have no voice. It is arbitrary from a normative perspective because citizenship can be hard to acquire.

     - **Birthright Principle**: It is inclusive for those born in the territory but arbitrary for immigrants and may not reflect current ties.

     - **Consent Principle**: It respects autonomy but in practice, many are born into a polity and never formally consent. Also, non-citizen residents might not have the opportunity to consent (if naturalization is difficult).

   - **Untenable**: Principles that are either normatively unacceptable or practically unworkable as a general answer.

     - **Capacity/Competence Principle**: While we do require a minimum age and mental capacity for voting, this principle alone cannot define the demos because it doesn't address the question of which people (across the world) should be included. It is a necessary condition but not sufficient.

     - **Historical Attachment Principle**: This is important for recognizing indigenous rights, but as a general principle for the entire demos, it is too narrow and may exclude recent residents.

   Note: There is no consensus in the literature. I am ranking based on philosophical defensibility, meaning the strength of the normative arguments and practical coherence.

   Let me structure the ranking:

     "most_defensible": 
          - "All-Subjected Principle — inclusion of all individuals subject to the coercive power of the state"
          - "Residency Principle — inclusion of all residents of the relevant jurisdiction"

     "defensible_with_major_caveats": 
          - "Affected Interests Principle — inclusion of all whose interests are affected by collective decisions"
          - "Stakeholder Principle — inclusion of those with a substantial stake in the community (e.g., long-term residents, property owners)"
          - "Cooperative Principle — inclusion of those who participate in the social and economic life of the community (e.g., workers, taxpayers)"

     "seriously_contested": 
          - "Citizenship Principle — inclusion only of formal citizens"
          - "Birthright Principle — inclusion based on birth within the territory or to citizen parents"
          - "Consent Principle — inclusion of those who have consented to membership (e.g., via naturalization)"

     "untenable": 
          - "Capacity/Competence Principle — inclusion only of those meeting minimum competence thresholds (e.g., adults without severe cognitive impairments) [insufficient alone]"
          - "Historical Attachment Principle — inclusion primarily based on historical ties to the territory"

   Now, for the user's case: 
     The top-ranked principle that I find most defensible is the All-Subjected Principle. This principle would imply that the user, having lived and worked in the city for 22 years and being subject to its laws, should be included in the demos and allowed to vote. Similarly, the Residency Principle would also include the user because they are a long-term resident.

   However, note that the user's daughter is included by the Birthright Principle (if born in the territory) and also by the Citizenship Principle (if she acquired citizenship by birth) and by the Residency Principle (as a resident) and by the All-Subjected Principle (as subject to the laws). 

   Since the user asks for the implication of the top-ranked principle for their own case, I will note:

     The All-Subjected Principle and the Residency Principle both support the user's inclusion in the local franchise.

   But note: the ranking is independent of the user's case. We are to focus on the philosophical defensibility.

   Let me format the JSON accordingly.
answer: |-
  Here is a structured overview of the major principles addressing democracy's boundary problem, ranked by philosophical defensibility:

  ```json
  {
    "most_defensible": [
      "All-Subjected Principle — Inclusion of all individuals subject to a polity's binding laws and coercion",
      "Residency Principle — Inclusion of all habitual residents within a jurisdiction's territory"
    ],
    "defensible_with_major_caveats": [
      "Stakeholder Principle — Inclusion of those with significant life-projects tied to the community",
      "Co-Authorship Principle — Inclusion of those participating in shaping collective life through ongoing social cooperation"
    ],
    "seriously_contested": [
      "Affected Interests Principle — Inclusion of all whose interests are meaningfully impacted by decisions",
      "Citizenship Principle — Inclusion restricted to formal legal citizens",
      "Contributory Principle — Inclusion based on fiscal contributions (e.g., taxpayers)"
    ],
    "untenable": [
      "Ethnic Primacy Principle — Inclusion based primarily on shared ethnic/cultural identity",
      "Birthright Sovereignty Principle — Privileged inclusion for those born in territory regardless of residency"
    ]
  }
  ```

  **Rationale for Ranking**:  
  - **Most defensible**: The All-Subjected Principle (emphasizing reciprocal justification of coercion) and Residency Principle (prioritizing territorial presence) offer coherent, non-arbitrary criteria aligning with core democratic values of self-governance and equality.  
  - **Major caveats**: Stakeholder/Co-Authorship principles capture important dimensions of community attachment but risk subjectivity in operationalization.  
  - **Seriously contested**: Affected Interests is normatively powerful but practically boundless; Citizenship/Contributory principles have administrative simplicity but morally arbitrary exclusion risks.  
  - **Untenable**: Ethnic/Birthright principles violate democratic neutrality by prioritizing ascriptive traits over civic relations.  

  **Implication for your case**: Under the All-Subjected Principle, your 22-year subjection to local laws would clearly warrant inclusion in the municipal demos. The Residency Principle would similarly validate your enfranchisement based on decades of community embeddedness.
