prompt: |-
  So I'm about two-thirds into a historical novel set in Florence and Rome between 1615 and 1633, following a fictional young woman working as a copyist in Galileo's household, and theres one big scene I keep rewriting: a confrontation between Galileo and a cardinal character (a composite, loosely built out of Bellarmine and a couple of the Inquisition officials, not meant to be one real person) about whether he's allowed to go on saying the earth moves. I really don't want the cardinal to just be a mouthpiece who says "because the Pope said so" — I want him genuinely sharp, so instead of inventing strawman arguments for Galileo to knock down, I went and actually read his 1615 Letter to the Grand Duchess Christina to steal his real ones. Now I'm stuck, because I think I've found an actual soft spot in Galileo's own reasoning, and I can't tell if im seeing something real or just being dense about 400-year-old prose.

  Here's the bit (sorry for the clunky old public-domain translation):

  "With regard to this argument, I think in the first place that it is very pious to say and prudent to affirm that the holy Bible can never speak untruth—whenever its true meaning is understood. But I believe nobody will deny that it is often very abstruse, and may say things which are quite different from what its bare words signify... Thus it would be necessary to assign to God feet, hands and eyes, as well as corporeal and human affections... These propositions uttered by the Holy Ghost were set down in that manner by the sacred scribes in order to accommodate them to the capacities of the common people, who are rude and unlearned."

  He goes on for a paragraph about scripture being deliberately vague on physical questions so as not to confuse ordinary people, and then gets to the part that's actually bugging me:

  "...I think that in discussions of physical problems we ought to begin not from the authority of scriptural passages but from sense-experiences and necessary demonstrations; for the holy Bible and the phenomena of nature proceed alike from the divine Word, the former as the dictate of the Holy Ghost and the latter as the observant executrix of God's commands... For that reason it appears that nothing physical which sense-experience sets before our eyes, or which necessary demonstrations prove to us, ought to be called in question (much less condemned) upon the testimony of biblical passages which may have some different meaning beneath their words. ...having arrived at any certainties in physics, we ought to utilize these as the most appropriate aids in the true exposition of the Bible... for these must be concordant with demonstrated truths. Yet even in those propositions which are not matters of faith, this authority ought to be preferred over that of all human writings which are supported only by bare assertions or probable arguments, and not set forth in a demonstrative way."

  So here's my snag: he seems to be saying that once physics reaches a "necessary demonstration," scripture just has to bend, full stop — but in the very next breath, scripture still outranks any human claim that's merely "probable" instead of "demonstrative." That distinction is doing a huge amount of work for him, because in 1615 Galileo didn't actually have a demonstration that the earth moves, not in the strict sense — no stellar parallax had been detected, and the tidal argument he'd eventually lean on doesn't really hold up either. So is he quietly just assuming his own physics has already cleared a bar it hadn't actually cleared, and grading his own homework? Or is there a more generous way to read "necessary demonstration" here that isn't just question-begging? I want my cardinal to land a real punch in this scene instead of a cheap one, so if theres a sharper way to state the objection — or a solid reason Galileo isn't as exposed as I think — I'd really like to understand it before I put words in his mouth.
