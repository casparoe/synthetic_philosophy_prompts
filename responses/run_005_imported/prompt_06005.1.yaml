prompt: |-
  Weird request but bear with me — our philosophy department's history-of-ethics reading group has this end-of-term tradition where someone roleplays a dead philosopher defending their most controversial piece of writing while the rest of us try to dismantle it live. This term it's Anscombe defending "Mr Truman's Degree," the pamphlet where she rips into Oxford for giving Truman an honorary degree, on the grounds that Hiroshima and Nagasaki were just intentional mass murder of innocents, full stop, no matter how many lives it supposedly saved overall.

  I got stuck writing the questions we're gonna hit her with. Can you draft 7 or 8? Nothing generic like "was the bombing wrong" — I want ones that actually engage her specific argument. At minimum I need: one pressing on whether this even counts as a double-effect case at all, since her whole point seems to be that the civilian deaths were the intended means of forcing surrender rather then a foreseen side-effect of hitting a legitimate target (how's that different from, say, a blockade that predictably starves civilians as a side effect of a legal act of war?); one putting the standard "but it plausibly saved more lives net than an invasion would have" reply to her directly; and one on whether her absolutism has any principled way to handle a genuinely catastrophic dilemma, or if she's just committed to biting the bullet forever. For each of those three, give a sharp follow-up keyed to whatever answer she's obviously going to give — don't let her wriggle out of it.
