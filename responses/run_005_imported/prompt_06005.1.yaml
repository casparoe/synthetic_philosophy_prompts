  First, I need to recall Anscombe's core argument: she rejects the principle of double effect (PDE) justification for the bombings, insisting the civilian deaths weren't a side effect but the intended means to force surrender. This distinguishes her from typical just war critiques. The user explicitly wants three mandatory angles covered: 

