answer: |-
  Let's break down Lewis's "big bad bug" and the move to the New Principle using a simple coin example. The core tension arises because Humean Supervenience (HS) defines chances *by* the global pattern of events, while the Principal Principle (PP) demands we base our beliefs *on* those chances. This creates a loop when considering futures that would *disrupt* the very pattern defining the chance.

  **The Setup: A Humean Biased Coin**

  1.  **The World:** Imagine a coin minted under very specific, law-like conditions (HS base). The Humean account says the objective chance of Heads *just is* the limiting frequency (or best fit) of Heads in the *entire* history of coin flips within this universe. Suppose the actual, global frequency stabilizes at 70% Heads. Therefore:
      *   `ch(Heads) = 0.7` for any future flip (at any time).
      *   The proposition `CH` describes this entire chance setup: "The objective chance of Heads on any flip is 0.7, *and* this is determined by the global pattern including all future flips."

  2.  **The Undermining Future:** Now, consider a *very specific*, very long sequence of future flips resulting in Tails almost exclusively. Suppose this sequence `U` (the "underminer") is long enough and Tails-heavy enough that, *if* it were to occur, the *global* frequency of Heads would no longer be 70% – it might drop to, say, 40%.
      *   Crucially, `U` is *physically possible* according to `CH` itself! Each individual flip still has a 0.3 chance of Tails. While extremely improbable, the laws (`CH`) assign `U` a *positive* objective chance: `ch(U) > 0` (even if vanishingly small).
      *   **The Bug:** If `U` *actually* occurred, the global pattern would *not* support `CH` (the 70% chance hypothesis). `U` makes `CH` *false*. `CH` assigns a positive chance to a future (`U`) that would falsify `CH` itself.

  **Why This is a Problem for the Principal Principle (PP)**

  PP says: Your rational credence in proposition `A`, given only that the chance of `A` is `x` *and* that you have no "inadmissible" evidence, should be `x`.
  *   `C(A | ch(A)=x ∧ E) = x` (where `E` is admissible)

  Now, put yourself at time `t0` (before any flips). You *know* the Humean chance law `CH` is true (`ch(Heads)=0.7`). You have no other evidence yet. Consider proposition `U` (the undermining future sequence).

  1.  **Apply PP naively to `U`:**
      *   `CH` tells you `ch(U) = y` (some very small positive number, say 10^-100).
      *   You know `CH` is true.
      *   At `t0`, you arguably have no inadmissible evidence about the future (you only know the chances defined by the *entire* pattern, including the future).
      *   PP says: Your credence in `U` should be `C(U | CH) = ch(U) = y > 0`. You should assign a tiny, but real, credence to `U` happening.

  2.  **The Contradiction:**
      *   But `CH` *entails* that `U` does *not* happen! Why? Because `CH` is defined by the *actual* global pattern. If `U` happened, the global pattern would *not* be the one described by `CH` (70% Heads); it would be a pattern consistent with ~40% Heads. Therefore:
          `CH` → `¬U`
      *   If `CH` is true, `U` is false. Knowing `CH` *logically implies* that `U` won't happen. Your credence in `U`, *conditional on `CH`*, should be **zero**: `C(U | CH) = 0`.

  3.  **The Conflict:**
      *   PP + `CH` ⇒ `C(U | CH) = y > 0`
      *   Logic + `CH` ⇒ `C(U | CH) = 0`
      *   **Contradiction:** `0 = y > 0`

  **The Core Issue:** PP tells you to leave open the (tiny) possibility `U` might happen, based on its chance. But *knowing the Humean chance law `CH` itself* logically closes that possibility (`CH` says `U` *won't* happen because if it did, `CH` wouldn't be true). Your "admissible" evidence (`CH`) is *inadmissible* for `U` under HS, because it contains implicit information about the future pattern that defines the chance. Ordinary conditionalization runs into trouble because PP forces you to assign positive credence to futures that are *logically incompatible* with the chance hypothesis you're conditioning on, under HS.

  **Lewis's New Principle (NP) - The Proposed Fix**

  Lewis's solution is to modify how we apply the chance. Instead of setting credence equal to the *unconditional* chance, set it equal to the chance *conditional on the entire truth about chances*.

  *   **Original PP:** `C(A | H_t ∧ CH) = ch(A)` (for admissible `H_t`)
  *   **New Principle (NP):** `C(A | H_t ∧ CH) = ch(A | CH)`

  **How NP "Solves" the Problem (Using the Coin):**

  1.  **Consider `ch(U | CH)`:**
      *   What is the chance of `U` happening, *given that the chance law `CH` (70% Heads) is true*?
      *   Remember, `CH` being true *means* the global pattern has 70% Heads. `U` is a sequence that would make the global pattern have ~40% Heads.
      *   Therefore, `ch(U | CH)` is **the chance that the global pattern has ~40% Heads, given that it actually has 70% Heads**. This is **zero**! It's a logical impossibility under HS for the global pattern to be both 70% Heads *and* 40% Heads. If `CH` is true, the chance of a pattern that falsifies `CH` is zero.
      *   `ch(U | CH) = 0`

  2.  **Apply NP to `U`:**
      *   NP says: `C(U | H_t0 ∧ CH) = ch(U | CH) = 0`
      *   This matches the logical requirement: Knowing `CH` means `U` is impossible, so your credence in `U` *should* be zero. The contradiction vanishes.

  3.  **Intuition for NP:** NP doesn't just tell you the chance *according to* `CH`; it tells you the chance *according to `CH` while also holding `CH` fixed as a background fact*. It prevents the chance law from "undermining" itself by effectively saying: "Given that this chance law *is* the true one (and thus defines the actual pattern), what's the chance of `A` *within the world described by that law*?" Undermining futures are excluded because they are incompatible with the law being true.

  **Why Commentators Argue NP Merely Relocates the Problem**

  The criticism is that NP pushes the weirdness back into the *chance concept* itself rather than fully resolving the tension:

  1.  **`ch(A | CH)` is Peculiar:**
      *   What does `ch(U | CH) = 0` *mean* physically? The coin-flipping mechanism hasn't changed. Each flip still has a 0.3 objective chance of Tails. The physical propensity for `U` seems unchanged. Yet, `ch(U | CH)` is zero.
      *   NP makes the chance of `U` depend not just on the local physics (the coin's bias), but on the *global fact* `CH`. This feels like the chance is "looking ahead" or being constrained by the final outcome in a way that seems non-Humean or at odds with local causality. The chance seems to "know" its own future truth.

  2.  **The Threat of Triviality:**
      *   Critics worry that `ch(A | CH)` might be trivial or undefined. If `CH` already specifies the entire chance structure, what does it mean to ask for the chance of `A` *given* `CH`? If `CH` fully determines the pattern, then `ch(A | CH)` might just be 1 if `A` is part of the pattern mandated by `CH`, or 0 if it isn't. This reduces chance to deterministic fate, losing its core meaning as objective probability.
      *   Lewis argues `ch(A | CH)` isn't trivial because `CH` specifies the chances, not the specific outcomes. `ch(A | CH)` is the chance `A` has *according to the function specified by `CH`*. It can still be non-extremal. For example, `ch(Heads on next flip | CH) = 0.7`. The zero only appears for propositions logically incompatible with `CH`.

  3.  **The Underlying Tension Remains:**
      *   The fundamental issue is HS: chances supervene on the entire pattern, including the future. This creates a loop between what the chances *are* and what events *happen*. NP tries to break the loop for *credence* by making the chance conditional on its own truth, but it doesn't dissolve the underlying metaphysical loopiness of Humean chance itself. The chance law `CH` *still* assigns a positive unconditional chance `ch(U) > 0` to its own falsification. NP just tells rational agents to ignore that positive chance when they *know* `CH` is true, because `ch(U | CH) = 0`. The strangeness of a law assigning positive probability to its own falsehood is still there; NP just changes how we're told to use that law for belief.

  **In a Nutshell:**

  *   **The Big Bad Bug:** Under Humean Supervenience, a chance law `CH` can assign positive chance `ch(U) > 0` to a future `U` that would make `CH` false. The Principal Principle (PP) then forces a rational agent who knows `CH` to have credence `C(U | CH) > 0`, even though `CH` logically implies `¬U`, requiring `C(U | CH) = 0`. Contradiction.
  *   **The New Principle (NP):** Fixes the contradiction by setting credence equal to the chance *conditional on the chance law itself*: `C(A | H_t ∧ CH) = ch(A | CH)`. For the undermining future, `ch(U | CH) = 0`, so `C(U | CH) = 0`, matching logic.
  *   **The Relocation Criticism:** NP solves the contradiction for *credence* but makes the *chance concept* `ch(A | CH)` itself look peculiar (e.g., `ch(U | CH) = 0` despite local physics suggesting `U` is possible). The core tension of a Humean chance law assigning positive probability to its own falsehood remains inherent in the metaphysics; NP just papers over the contradiction it causes in epistemology by modifying how we're told to use the chance law.

  The debate hinges on whether NP provides an acceptable, albeit slightly strange, Humean account of chance-guided credence, or whether the need for NP exposes a fatal flaw in the Humean reduction of chance to global pattern. Your seminar's heat is well-justified! This remains one of the deepest puzzles in the metaphysics of probability.
