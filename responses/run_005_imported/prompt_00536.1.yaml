answer: |-
  You've hit on a devastating critique. Van Inwagen's life criterion *does* secretly import the very vagueness it sought to escape, and following this logic consistently *does* point towards compositional nihilism. Here's the step-by-step demolition:

  1.  **Van Inwagen's Core Motivation: Eliminating Arbitrary Vagueness:**
      *   He rejects Universalism (any arbitrary collection composes *something*) because it leads to absurd, vague objects like "Cat-Plus-Tailfin" (a cat touching an airplane fin) or "Mountain-Plus-Distant-Pebble." When *exactly* do these objects begin/cease to exist? The boundaries are hopelessly fuzzy.
      *   He rejects Brutal Composition (no principle, composition just *happens* sometimes) as intellectually unsatisfying.
      *   **His Solution:** Restrict composition to a single, principled, seemingly *non-vague* condition: being caught up in a life. Organisms compose objects (organisms themselves); non-living aggregates (rocks, chairs, piles) do not. Life, he suggests, provides a sharp, natural boundary.

  2.  **The Supposed Sharpness of "Life":**
      *   Van Inwagen presents "being alive" as a binary, all-or-nothing property. Something is either caught up in a life or it isn't. A squirrel is a composite object; a pile of squirrel parts is not. A rock isn't; a tree is. This seems to avoid the spectrum problem of "how connected must parts be?"

  3.  **The Fatal Flaw: Life is Fundamentally Vague:**
      *   Biology reveals "life" is *not* a sharp, binary property. It's a cluster concept defined by characteristics (metabolism, growth, reproduction, adaptation, response to stimuli, homeostasis, etc.), **none of which are individually necessary and sufficient, and all of which admit of degrees and borderline cases.**
      *   **The Borderline Cases You Mentioned (and More):**
          *   **Viruses:** They replicate, evolve, and have complex structure... but only *inside* a host cell. Outside, they're inert crystals. Are they "caught up in a life"? *Whose* life? Their own? The host's? Is a virus a composite object only when infecting?
          *   **Prions:** Misfolded proteins that catalyze the misfolding of *other* proteins. They "replicate" their structure and cause disease, but lack genetic material, metabolism, or independent existence. Are they caught up in a life? Are they *part* of the organism's life, or parasitic non-living entities?
          *   **Conception/Zygote Formation:** Fertilization is a *process*, not an instantaneous event. When exactly does the fusion of sperm and egg create a new, distinct life "caught up" in its own existence? Is it at sperm penetration? Pronuclei fusion? First cleavage? Gastrulation? This is a continuum.
          *   **Brain Death/Organismal Death:** When does an organism cease to be "caught up in a life"? Is it when higher brain function ceases but the body is sustained on life support (heart beating, organs functioning)? Is it when the last cell dies? Is a decapitated but briefly twitching body still "alive" and composing an object? Death is a process, not a moment.
          *   **Symbiotic Systems:** Consider lichen (fungus + algae/bacteria) or the human microbiome (trillions of bacteria essential for our "life"). Where does "one life" begin and end? Is the gut bacterium "caught up in *its* life" or *our* life? Does the lichen compose *one* object or two (or more)?
          *   **Dormancy:** Seeds, spores, tardigrades in cryptobiosis – metabolically near-zero, but capable of reviving. Are they "alive" and composing objects during dormancy?
          *   **Simple Replicators:** Self-replicating RNA molecules in abiogenesis research. When do they cross the threshold from complex chemistry to "life"?

  4.  **How This Re-Introduces Vagueness (The Crucial Move):**
      *   Van Inwagen claimed his criterion *eliminated* vague composition. But if "being caught up in a life" is itself vague (as demonstrated by the persistent, fundamental borderline cases in biology), **then the condition *for composition* is vague.**
      *   **Therefore, the *existence* of composite objects becomes vague.** For any borderline case (virus, prion, zygote at t=1ms post-fertilization, brain-dead body on ventilator), the question "Does a composite object exist here?" **lacks a determinate yes/no answer.**
      *   This is **precisely the type of vagueness** van Inwagen objected to in Universalism! Instead of "How connected must particles be to compose?" we have "How 'alive' must something be to compose?" Both questions force us to draw arbitrary lines on a spectrum.

  5.  **Why This Points Towards Nihilism (The Knockout Punch):**
      *   Van Inwagen's *entire project* was motivated by a rejection of vagueness in composition. He argued we *must* find a sharp criterion.
      *   He proposed "Life" as that sharp criterion.
      *   We've shown "Life" is *not* sharp. Its boundaries are inherently fuzzy and resistant to precise definition, leading to the very same compositional vagueness he despised.
      *   **The Logical Conclusion:** If the only plausible candidate for a *sharp* restriction on composition (Life) turns out to *not* be sharp, then we are forced to confront two options:
          *   **Option A: Accept Vagueness in Composition.** Admit that composition *can* be vague. There can be borderline cases where it's indeterminate whether a composite object exists. (But this is what van Inwagen explicitly rejected as absurd and unacceptable).
          *   **Option B: Reject Composition Altogether (Nihilism).** If there is *no* principled, non-vague way to say when composition occurs (and Van Inwagen's best shot fails), then the most consistent position is that composition *never* occurs. Only the fundamental particles ("simples") exist. There are no chairs, rocks, mountains, squirrels, or even organisms – just simples arranged chair-wise, rock-wise, mountain-wise, squirrel-wise, and organism-wise. This eliminates compositional vagueness entirely by denying composite objects exist at all.

  6.  **Van Inwagen's Dilemma:**
      *   He *cannot* consistently accept Option A (vague composition) without abandoning the core motivation for his "Life" answer.
      *   Therefore, the only internally consistent path *from the failure of his own criterion* is Option B: Compositional Nihilism. His attempt to avoid Universalism's vagueness by restricting composition to life, when life's own vagueness is acknowledged, collapses back into the problem and pushes us towards the most restrictive view possible.

  **Conclusion:** Van Inwagen's "Life" criterion doesn't solve the special composition question; it merely relocates the vagueness from spatial/mechanical relations ("how connected?") to the biological concept of life itself ("how alive?"). Because biology demonstrates that "life" is fundamentally a vague, cluster concept with no sharp boundaries, the question "When does composition occur?" remains just as indeterminate for his view as it was for the universalism he rejected. Faced with this failure of the only seemingly plausible *restrictive* answer, and holding onto the intuition that composition cannot be vague, the logically forced conclusion is that composition *never* occurs. The only way to truly escape the vagueness van Inwagen feared is to embrace compositional nihilism: simples exist, composites do not. His elegant solution, upon scrutiny, becomes the strongest argument *for* the view he wanted to avoid.
