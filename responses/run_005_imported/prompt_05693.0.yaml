answer: |-
  You're absolutely right to question your friend's take – Williams isn't simply defending "high art" snobbery. His critique of the "Kerman view" (which he explicitly engages with) is far more philosophically grounded and stems from a fundamental challenge to the ontology and phenomenology of opera itself. Here's the core of Williams' argument against the "drama justifies music" imperative and his alternative vision:

  1.  **Rejecting the Primacy of Drama & the "Justification" Demand:**
      *   **Opera as a Distinct Hybrid:** Williams argues that Kerman's view implicitly treats opera as *drama first*, with music added as a kind of emotional amplifier or illustrator. Williams contends this is a category error. Opera isn't drama *plus* music; it's a *sui generis* art form where music and drama are *constitutively intertwined from the outset*. The "drama" of an opera isn't something pre-existing that the music serves; it's *created* through the music.
      *   **The Tyranny of "Justification":** The demand that every musical element must "justify" itself dramatically is, for Williams, philosophically suspect and practically impoverishing. It imposes an external, puritanical standard (akin to utilitarianism's demand for justification of every pleasure) onto an art form whose power often lies in excess, ornamentation, and moments of pure sonic expression. Why *must* beauty serve a higher dramatic purpose? Can't beauty be an end in itself *within* the operatic context?
      *   **Misdescribing the Audience Experience:** Williams emphasizes phenomenology – how we actually *experience* opera. When a great singer delivers a stunningly beautiful phrase, even in a moment of relative dramatic stasis, the audience isn't thinking, "Ah, this is merely decorative fluff distracting from the *real* drama." They are *moved* by the beauty itself. That moment *is* part of the dramatic fabric *because* of its musical impact. Kerman's standard misreads this lived experience.

  2.  **What *Does* the Work Instead? Williams' Positive Account:**
      *   **"Fictive Energy" and the Power of Convention:** Williams introduces the crucial concept of **"fictive energy"** (central to his essay of the same name). Opera generates its own unique power and reality through its conventions – the fact that people sing rather than speak, the stylization of emotion, the suspension of disbelief required for arias, ensembles, etc. This energy isn't *subordinate* to drama; it *creates* the specific kind of heightened, emotionally charged *world* in which operatic drama unfolds. The conventions *are* the medium, not an obstacle to be overcome.
      *   **Music as the Primary Vehicle of Expression & Reality:** In opera, music doesn't just *express* emotions hinted at by the libretto; it often *defines and constitutes* the emotional reality of the characters and the situation. A character's inner state *is* the music they sing. The tension *is* the harmonic clash. The resolution *is* the cadence. To say the music must justify itself dramatically is like saying the words in a play must justify themselves linguistically – it misses the point that the words *are* the drama. In opera, the music *is* the primary dramatic substance.
      *   **The "Dramatic" is Musically Constituted:** Williams argues that what counts as "dramatic truth" *in opera* is fundamentally shaped by musical possibilities and necessities. Composers choose subjects and shape libretti based on what *music* can do powerfully. A musical structure (like an aria form, a duet, a complex ensemble) often dictates the dramatic structure, pacing, and emotional focus. The "drama" emerges *from* the musical conception, not the other way around.
      *   **The Value of the "Merely Beautiful" (or Spectacle):** Williams doesn't dismiss drama; he argues for a broader understanding of what contributes to operatic success. Moments of sheer vocal beauty, orchestral splendor, or even pure spectacle (like elaborate stage effects in Baroque opera) aren't necessarily "cop-outs." They can be:
          *   **Essential Pauses/Reflections:** Providing emotional breathing space, allowing the audience to absorb preceding drama or anticipate what's next (e.g., a beautiful aria after intense action).
          *   **Celebrations of the Medium:** Reveling in the unique capacities of the human voice and the orchestra, reminding us why we engage with this artificial form.
          *   **Sources of "Fictive Energy":** Contributing directly to the overall power and enchantment of the operatic world, enhancing the audience's immersion and suspension of disbelief.
          *   **Intrinsic Pleasures:** Valid artistic ends in themselves within the complex economy of an opera.

  3.  **The Philosophical Guts:**
      *   **Anti-Reductionism:** Williams resists reducing opera to a single dimension (drama). He champions its inherent hybridity and the irreducible value of its musical components.
      *   **Phenomenological Primacy:** He grounds his argument in the actual, complex experience of the audience, arguing that Kerman's standard imposes an abstract intellectual framework that doesn't match how people *feel* and respond to opera.
      *   **Conventions as Generative, Not Restrictive:** He sees operatic conventions not as limitations to be minimized in favor of "pure drama," but as the very tools that generate opera's unique power and reality ("fictive energy").
      *   **Anti-Puritanism in Art:** This connects to his broader philosophical stance. Just as he criticized utilitarianism for its inability to account for moral "integrity" and "ground projects" that resist constant justification, he criticizes the Kerman view for demanding constant dramatic justification for musical pleasure, thereby failing to acknowledge the intrinsic, complex value within the operatic form itself. It's an argument against overly instrumentalist views of art.

  **In essence:** Williams argues that the "Kerman view" fundamentally misunderstands opera by treating it as a species of drama that uses music, rather than recognizing it as a unique art form where music is the primary substance and constitutive force. The drama *is* the music, expressed through the conventions that generate opera's distinct "fictive energy." Demanding that every musical moment justify itself dramatically is not only unnecessary but actively misdescribes how opera works and why it moves us. The "merely beautiful" or spectacular isn't a failure; it's often an integral part of the operatic experience and its inherent abundance. His position is less about defending "high art" and more about defending the *integrity* and *specificity* of the operatic form against a reductive dramatic standard.
