  Problem is I only have a hazy memory of how he actually argues for that -- read it kind of fast at a friend's place and didn't take notes. My friend, who's way more into music theory than philosophy, reckons it's basically just Williams being precious about high art vs cheap spectacle, but that doesn't sound right based on what little I remember. Can you walk me through what his actual position is -- why he resists the idea that music always has to be justified by drama, and what he thinks is really doing the work in opera instead? Not looking for a plot-summary-level answer, more the actual philosophical guts of the argument.
