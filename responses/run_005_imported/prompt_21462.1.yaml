  Okay, here's a joke specifically built around the "second-highest bidder pays" rule, keeping it short and punchy:

  **Setup:**  
  *Two students, Alex and Ben, are fiercely bidding in the dollar auction. Alex just bid $0.99. Ben hesitates, looking worried.*

  **Punchline:**  
  **Ben:** "$1.00!"  
  **Alex:** *(Immediately throws hands up, relieved)* "Oh thank goodness! Okay, you win the dollar... *and* you just paid ninety-nine cents for absolutely nothing! My turn to watch *you* sweat!"

  **Why it works:**  
  1. **Setup:** Establishes the high-stakes bidding near $1.00. Ben's worry shows he knows the trap.  
  2. **Punchline:** Alex's relief highlights they *avoided* being the loser (second-highest). The punchline explicitly names Ben's fate: paying his bid ($0.99) for nothing while winning the dollar. The core agony of the dollar auction *is* that the second-highest bidder pays, and this joke makes that the entire point of Alex's relief and Ben's new predicament.

  **Tell it quick to your friend:**  
  "Okay, so Alex and Ben are bidding. Alex bids 99 cents. Ben looks scared but says 'One dollar!'. Alex goes, 'Phew! Okay, you win the buck... *and* you just paid ninety-nine cents for zip! My turn to relax!'"

  It's short, hinges entirely on the unique rule, and should get a groan-laugh from anyone who sat through that lesson!
