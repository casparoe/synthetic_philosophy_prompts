prompt: |-
  okay so i've been going down an effective altruism rabbit hole for like two months now (blame the 80,000 hours podcast) and i just learned about "moral uncertainty" - this idea that since nobody can actually be sure which ethical theory is correct, you shouldn't just pick utilitarianism or kantianism and go all in on it, you're supposed to spread your credence across a few theories and let that shape what you actually do. the version that really got stuck in my head is the "moral parliament" thing (i think Bostrom started this?) where each theory you have some credence in gets seats proportional to that credence, and then they basically negotiate and vote on what you should do, kind of like a coalition government except the parties are utilitarianism and Kantian ethics instead of, like, actual political parties.

  completely seperately, for my philosophy elective i've been reading Henry Sidgwick, who apparently everyone in the EA world treats like a patron saint, since his whole book Methods of Ethics tries to referee between utilitarianism, egoism, and common sense morality, and it ends with him basically admitting defeat on this thing he calls the "dualism of practical reason" - he couldnt get egoism and rational benevolence to stop contradicting each other, and it bugged him enough that he ends the book on this note of total philosophical despair. so my question is: if you showed 1800s Sidgwick the moral parliament model, do you think he'd be relieved, like "finally, the tool i needed," or would he actually have a problem with it, since he seemed to think ethics was supposed to work like a science that converges on objective, self evident truths through reasoning, not something where you let theories "vote" like interest groups bargaining with each other. also kind of a side thing but Sidgwick seemed really confident that BOTH egoism and rational benevolence were true at the same time, he wasn't unsure which one was true, so i'm not even sure "credence" is the right frame for what his problem actually was in the first place. anyway curious what you think, this has been living in my head rent free lately lol
