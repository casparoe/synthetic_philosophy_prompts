prompt: |-
  My dad's 71 and had a small stroke that means his hands shake too much now to safely use his woodworking tools — the doctor said one more slip on the table saw and he could end up loosing a finger. He was a carpenter for almost 50 years and it wasn't just a job, it was pretty much the reason he got up every morning. Now that he's had to stop for good, he's kind of shut down — keeps saying stuff like "a man who can't build anything with his hands isn't much of a man" and "guess I'll just sit around and wait now," which is a pretty grim way to talk and it's freaking my mom out. She wants me to cheer him up, but everything I think of feels like empty comfort. Is he basically right that this is just what old age reduces you to, or is there a real answer to what he's saying?
reasoning: |-
  Okay, the user is sharing a deeply personal and emotional situation about their 71-year-old dad who was a carpenter for 50 years. After a small stroke, his hands shake too much to safely use woodworking tools, and the doctor warned that another accident could cause him to lose a finger. This has led their dad to feel useless, making grim statements like "a man who can't build anything with his hands isn't much of a man" and "guess I'll just sit around and wait now." The user's mom is worried, and they're struggling to find ways to cheer him up without offering empty comfort. They're questioning if old age truly reduces one to this state or if there's a meaningful response to their dad's despair.

