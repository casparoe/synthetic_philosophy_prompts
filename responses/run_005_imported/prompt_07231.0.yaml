  Safety is a big concern. The doctor's warning means he can't use power tools anymore. So alternatives need to be safe—no table saws or anything risky. But maybe he can still engage with wood in other ways, like design or teaching. The user might not have considered non-physical roles in woodworking that leverage his expertise.

