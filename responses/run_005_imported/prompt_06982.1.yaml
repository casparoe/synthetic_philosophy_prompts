answer: |-
  Here are 10 sharp interview questions for your Anscombe role-play session, designed to probe the core of her argument against the Hiroshima/Nagasaki bombings and her moral framework, complete with targeted follow-ups anticipating her stance:

  1.  **Question:** Professor Anscombe, your core objection to the atomic bombings hinges on the *intention* to kill innocent civilians as a *means* to end the war. Given that the Target Committee explicitly selected cities (not isolated military bases) partly *because* their dense civilian populations would maximize the weapon's "psychological effect" and demonstrate its power to compel surrender, how can this *not* be understood as intentionally using the deaths of non-combatants as a means?
      *   **Follow-Up (Anticipating "Foreseen but not Intended"):** If you concede the civilian deaths were foreseen with certainty as the direct result of hitting the chosen target *for the purpose* of achieving surrender through shock and awe, how does the doctrine of double effect rescue this act from being an intentional use of innocent life as a tool? Isn't the *chosen method* itself inherently dependent on mass civilian destruction?

  2.  **Question:** You define "innocent" in this context strictly as "non-combatant," not morally blameless. Yet, in a total war context like 1945 Japan, where war production was deeply embedded in urban areas and civilians were mobilized for war support, isn't the line between combatant and non-combatant hopelessly blurred? Couldn't the planners plausibly (even if wrongly, in your view) have redescribed the entire city population as a legitimate "war-making" target?
      *   **Follow-Up (Anticipating Rejection of Blurring):** Doesn't your rigid distinction risk becoming practically irrelevant in modern industrialized warfare? If the justification for bombing rests on *any* connection to war production (however indirect or involving children/the elderly), doesn't this functionally grant carte blanche for attacking civilians, precisely the outcome double effect aims to prevent?

  3.  **Question:** You argue that intentionally killing the innocent is absolutely prohibited. Critics charge this is fanatical: wouldn't refusing the atomic bombs, leading to a horrific land invasion predicted to cost millions more lives (military *and* civilian), be the *greater evil*? Doesn't absolute prohibition force you to prefer an outcome with vastly greater total suffering?
      *   **Follow-Up (Anticipating Rejection of Consequentialist Weighing):** Isn't the core of your "fanaticism" charge really just a rejection of consequentialism itself? If *intending* an intrinsically evil act (murder of innocents) is *never* permissible, regardless of the consequences avoided, does this mean your moral framework is fundamentally incompatible with the tragic, messy realities of statecraft and war, where such choices seem unavoidable?

  4.  **Question:** Your protest focused intensely on Truman receiving an honorary degree. Yet, the conventional firebombing of Tokyo (March 1945) killed more people instantly than Hiroshima, and Dresden's toll was comparable. If your argument is truly about *intention* (killing civilians as a means), not the *means* (atomic vs. incendiary), shouldn't you condemn the firebombing campaigns with equal vigor? Why single out Truman and the atomic bomb for such specific public condemnation?
      *   **Follow-Up (Anticipating Distinctions or Focus on Symbolism):** Was Hiroshima uniquely significant *only* because it involved a new weapon, or was it the *explicitly stated rationale* of using civilian shock for surrender? If the latter, why not protest Churchill (Dresden) or LeMay (Tokyo) with similar intensity? Is the atomic bombing a clearer, more undeniable *symbol* of the deliberate adoption of mass civilian destruction as policy?

  5.  **Question:** In "War and Murder," you discuss double effect concerning bombing a munitions plant knowing workers (non-combatants) will die. How does the Hiroshima scenario differ? Couldn't planners redescribe it as bombing "the Japanese war-making capacity concentrated in Hiroshima city," with the civilian deaths merely foreseen but unintended?
      *   **Follow-Up (Anticipating Rejection of Redescription):** Isn't this redescription disingenuous given the *primary reason* for choosing a city over an isolated plant was precisely *because* the civilian population amplified the destructive and psychological impact? Doesn't the selection criterion itself reveal the true intention?

  6.  **Question:** You famously coined the term "consequentialism" in "Modern Moral Philosophy" to critique theories that justify acts based solely on outcomes. Is your objection to the Hiroshima decision fundamentally that it represents the triumph of consequentialist reasoning ("ends justify the means") over absolute moral prohibitions like "thou shalt not murder"?
      *   **Follow-Up (Anticipating Affirmation):** Doesn't your absolute prohibition itself lead to potentially disastrous consequences (e.g., refusing the bomb, leading to invasion)? How do you respond to the charge that your non-consequentialism, by refusing to weigh outcomes, is itself morally irresponsible in situations of supreme emergency?

  7.  **Question:** Could the atomic bombing be justified under double effect if the *sole* intention was destroying a crucial military headquarters or port facility within the city, with the massive civilian casualties being a foreseen but unintended side-effect of the weapon's power?
      *   **Follow-Up (Anticipating Rejection based on Target Choice/Weapon):** Given the known blast radius and effects of the atomic bomb in 1945, and the deliberate choice of a city center target, isn't the scale of foreseeable civilian destruction so vast and certain that it becomes *impossible* to plausibly claim the civilian deaths were merely a "side-effect" and not an integral part of the chosen method? Doesn't proportionality collapse here?

  8.  **Question:** Truman and his defenders argued Japan was given ample warning (Potsdam Declaration) and opportunity to surrender, making the civilians' deaths a tragic consequence of their government's intransigence. Does this shift in responsibility mitigate the moral burden of the bomber?
      *   **Follow-Up (Anticipating Rejection of Responsibility Shift):** Doesn't this argument still involve *using* the civilians' deaths (as leverage against their government or as punishment for its refusal) as a *means*? How does blaming the Japanese government absolve the actor who deliberately chooses the action that directly kills the innocents?

  9.  **Question:** You argue that accepting Truman's degree constituted Oxford *honoring* an act of mass murder. But states routinely honor leaders associated with controversial wartime decisions involving civilian deaths (e.g., Churchill). Is your protest less about the *act* itself and more about society's *celebration* of it, fearing the normalization of such choices?
      *   **Follow-Up (Anticipating Affirmation of Symbolism):** Doesn't focusing on the *honor* risk obscuring the core moral argument about the act? Or is the public endorsement precisely what makes it a crucial battleground for upholding moral absolutes against consequentialist drift?

  10. **Question:** If we grant your absolute prohibition on *intentionally* killing innocents, how can *any* modern war involving strategic bombing of industrial/urban targets – where civilian deaths are foreseeable and often integral to the strategy's effectiveness – be morally licit? Doesn't your logic lead to near-pacifism in the face of industrialized warfare?
      *   **Follow-Up (Anticipating Distinction or Acceptance of Stricter Limits):** Is the practical implication of your argument that just war theory, as applied to modern conditions, must reject virtually all forms of strategic bombing that foreseeably cause mass civilian casualties, regardless of the weapon used? Isn't this a radical conclusion most states (and philosophers) would reject?

  **Key Angles Covered:**
  *   **Intention/Foresight & Redescription:** Q1, Q2, Q5, Q7 (core double effect pressure).
  *   **"Innocent" Definition:** Explicitly in Q2.
  *   **Fanaticism Charge:** Q3 & its follow-up.
  *   **Comparison to Conventional Bombing:** Q4 & its follow-up.
  *   **Link to Consequentialism:** Q6 & its follow-up.
  *   **Responsibility/Justification Attempts:** Q8.
  *   **Focus on Truman/Symbolism:** Q4 (partly), Q9.
  *   **Broader Implications for Warfare:** Q10.

  These questions force the "Anscombe" to defend the rigor and consistency of her core distinctions (intention/foresight, means/side-effect, innocent/combatant) against historical reality and practical objections, while directly confronting the most common criticisms of her position (fanaticism, inconsistency with conventional bombing, impracticality). Good luck with the session – it sounds intense and fascinating!
