answer: |-
  ## Steering Committee Decision Memo: Global Axioms Proposal

  **To:** Steering Committee Members  
  **From:** [Your Name], Steering Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Decision on Proposal for Global Adoption of Excluded Middle (LEM) and Axiom of Choice (AC)  

  ### Background
  The core library is built on intuitionistic principles, ensuring proofs yield computable witnesses. This is foundational to our mission and directly supports key use cases: university courses teaching constructive verification and industry extraction of certified code for safety-critical systems. Contributors currently have the option to use LEM or AC locally within specific files, clearly flagged, for isolated classical results. A proposal seeks to elevate LEM and AC to *global* axioms, enabling wholesale importation of classical mathematics (analysis, set theory) without constructive reproof.

  ### Arguments Considered

  *   **Pro-Global Adoption:**
      *   **Efficiency & Growth:** Drastically reduces effort to incorporate vast bodies of existing classical mathematics, accelerating library coverage and attracting new contributors familiar with classical methods.
      *   **Practicality:** Local classical usage is already permitted; global axioms simplify development, avoid repetitive declarations, and reflect how classical math is often presented.
      *   **Flexibility:** Maintains constructive core *capability* while removing barriers for classical work. Users needing computation can still write constructively.

  *   **Anti-Global Adoption (Pro Local-Only Status Quo):**
      *   **Foundational Integrity:** A global axiom fundamentally changes the library's logic. A proof of `∃x, P(x)` under global LEM/AC does not guarantee a computable witness, contradicting the core intuitionistic semantics and our library's defining characteristic.
      *   **Value Proposition:** Our unique strength lies in computational content. Global axioms dilute this, making us "just another classical library" and undermining the educational value of teaching constructive reasoning.
      *   **Industry & Education Risk:** Industry relies on witness extraction. Global axioms would require complex filtering mechanisms to prevent non-computational proofs from infiltrating certified code, adding risk and complexity. Courses teaching constructive methods lose a key resource if the core semantics shift.
      *   **Slippery Slope:** While manageable locally, global axioms make it easier for non-computational proofs to permeate core definitions and lemmas, inadvertently breaking computational guarantees elsewhere.

  ### Decision
  **The Steering Committee rejects the adoption of LEM and AC as global axioms.** The library will maintain its intuitionistic foundation. The existing mechanism for **local, explicitly-flagged use of classical axioms within individual files remains the approved approach.**

  ### Rationale
  While the efficiency gains of global classical axioms are undeniable and the desire to expand coverage is valid, they come at an unacceptable cost to our core identity and critical use cases:

  1.  **Erosion of Core Value:** Computability is not merely an option; it is the library's raison d'être. Global LEM/AC fundamentally alters the meaning of existence proofs throughout the library. A proof tagged `[Classical]` is understood to be non-computational; a proof without such a tag in a globally classical context provides false assurance.
  2.  **Threat to Critical Applications:** Our industry partner's ability to extract certified, executable code relies intrinsically on the guarantee of computable witnesses. Introducing global axioms necessitates complex, error-prone safeguards to isolate constructive content, introducing significant risk into safety-critical systems. This is not an acceptable burden for our users.
  3.  **Dilution of Educational Mission:** Universities use our library explicitly to teach constructive verification and the connection between proofs and computation. Global classical axioms would obscure this connection and diminish the library's unique pedagogical value.
  4.  **Local Axioms Suffice:** The current local mechanism already provides a safe and effective pathway for incorporating classical results where truly needed, without compromising the entire library's semantics. The burden of adding `[Classical]` tags is minor compared to the risk of losing our foundational guarantee.
  5.  **Separate Fork is Impractical:** Creating and maintaining a parallel classical fork would fragment community effort, strain resources, create synchronization headaches, and likely fail to achieve the intended growth due to duplicated work and divided focus. It does not solve the core issue of maintaining our primary library's unique properties.

  ### Engaging the Losing Position Seriously
  The proponents of global adoption present a compelling case for practicality and growth. Porting classical mathematics constructively *is* arduous. The desire to leverage existing formalizations and attract classical mathematicians is understandable and aligns with our goal of expanding the library's scope. We acknowledge that the current local tagging can feel cumbersome for large-scale classical developments. Their vision for a more expansive library is shared by the committee.

  **However, the efficiency gains, while significant, cannot justify sacrificing the library's defining characteristic and jeopardizing its most impactful applications.** The computational guarantee is not a minor feature; it is the bedrock upon which our value to industry and education is built. We cannot adopt a solution that fundamentally undermines this bedrock for the sake of expediency, even expediency towards a worthy goal like broader coverage. The risks to our core users and mission are too high. The local axiom mechanism remains the responsible compromise, allowing classical work *without* compromising the library's foundational semantics.

  ### Path Forward
  1.  **Reaffirm Constructive Core:** Clearly document the library's commitment to intuitionistic foundations and computable witnesses.
  2.  **Improve Classical Workflow:** Explore ways to make local classical development *easier* without making it global (e.g., better scoping mechanisms, tooling support for managing `[Classical]` tags in related files, clearer documentation).
  3.  **Prioritize Constructive Porting:** Strategically identify high-impact areas of classical mathematics where constructive formalization is most valuable or feasible, and encourage/coordinate efforts there.
  4.  **Industry/Education Liaison:** Proactively communicate this decision and its rationale to our industry partner and university users, reinforcing our commitment to their needs.

  This decision prioritizes the long-term integrity, unique value proposition, and critical real-world impact of our library over short-term expediency for classical expansion. We remain committed to growth but not at the cost of our foundational principles.
