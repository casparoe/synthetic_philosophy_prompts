prompt: |-
  I'm a software engineer working on LLM evaluation, and I've started relying on "self-consistency" in our pipeline: sampling the same prompt many times at a nonzero temperature and taking the majority answer as the final output. I justified this approach to my team by appeal to the Condorcet Jury Theorem — since each individual sample does better than random guessing, the theorem guarantees that the majority vote converges to the correct answer with near-certainty as we add more samples. We're now considering dropping our more expensive human-verification step even for our hardest eval questions, on the logic that we can always buy arbitrary accuracy by sampling a cheap, weak model more times instead of paying for a stronger one. Does the Condorcet Jury Theorem really license that conclusion, and if not, exactly where does the argument break down?
reasoning: |-
  We are considering the application of the Condorcet Jury Theorem (CJT) to the problem of improving the accuracy of an LLM by taking multiple samples and using majority voting. The theorem, in its classical form, states that if each voter in a group has an independent probability p > 0.5 of voting correctly, then as the group size increases, the probability that the majority vote is correct approaches 1. However, there are several critical assumptions in the CJT that might not hold in the context of LLM sampling. Let's break down the argument.

  1. **Independence**: The CJT assumes that the votes (in our case, the individual samples) are independent. However, in an LLM, the samples are generated by the same model and might be correlated. For instance, if the model has a systematic bias (e.g., always favoring a particular type of response), then errors might be correlated across samples. This breaks the independence assumption.

  2. **Constant p > 0.5**: The theorem requires that every voter (sample) has the same fixed probability p > 0.5 of being correct. But in practice:
     - The probability of a correct answer might vary depending on the question. Some questions might be very hard (p close to 0.5 or even below) and others easy (p much higher). The CJT only helps when p>0.5 for every question. If for a particular question p<=0.5, then the majority vote might actually do worse.
     - The model's accuracy might not be uniform across all types of questions.

  3. **Identical distribution**: The CJT assumes that each voter has the same p. In our setting, we are sampling the same model multiple times. This might be approximately true if the model is deterministic in its randomness (i.e., the same prompt at a fixed temperature leads to independent and identically distributed outputs). However, note that the independence might be violated as discussed above.

  4. **Cost and scalability**: The argument that we can "buy arbitrary accuracy" by sampling more from a weak model might break down in practice because:
     - The cost of sampling multiple times might be linear in the number of samples, and the convergence rate of the majority vote might be slow when p is only slightly above 0.5. For example, if p=0.51, then we would need a very large number of samples to get a high level of confidence. This might be more expensive than using a stronger model that has a higher p (say 0.9) and requires only a few samples.
     - There might be diminishing returns: the improvement in accuracy per additional sample decreases as the number of samples increases.

  5. **Violation of p>0.5 for all questions**: If the model is weak and for some questions p<0.5, then the majority vote will converge to the wrong answer. This is particularly dangerous for the hardest questions, which are the ones we are most concerned about.

  6. **Systematic errors**: The model might have systematic errors (e.g., due to biases in the training data) that cause it to consistently give the same wrong answer. In that case, even with many samples, the majority vote will be wrong.

  Therefore, the Condorcet Jury Theorem does not unconditionally license the conclusion that we can replace human verification with multiple samples from a weak model. The argument breaks down primarily due to:

  - **Lack of independence**: The samples might be correlated, which can lead to the majority vote being incorrect even with many samples.
  - **p not being above 0.5 for every question**: Especially for the hardest questions, the model might perform worse than random (p<0.5) and then majority voting would make things worse.
  - **Cost inefficiency**: It might be cheaper to use a stronger model that requires fewer samples to achieve the same level of accuracy.

  Recommendation:
  - It is important to measure the actual p for the model on a per-question basis, or at least on a representative set of questions. If p is consistently above 0.5 and we can ensure independence (or at least low correlation) among samples, then the CJT argument holds.
  - However, for the hardest questions, it is likely that p is lower and might even be below 0.5. In such cases, we cannot rely on majority voting to correct the errors.
  - We should also consider the cost of sampling multiple times versus the cost of human verification. For very hard questions, human verification might still be necessary.

  Alternative approach:
  - Instead of using a single weak model, consider using multiple diverse models (ensemble methods) to reduce the risk of correlated errors and to potentially achieve higher p.

  In summary, while the Condorcet Jury Theorem provides a theoretical foundation for the idea, the real-world conditions (especially independence and p>0.5 for every question) might not hold, and the cost-benefit analysis might not favor multiple samples from a weak model for the hardest questions.
answer: |-
  Your reasoning touches on a key insight from the Condorcet Jury Theorem (CJT), but **the theorem does not fully license the conclusion that you can replace human verification with arbitrary sampling of a weak model**. Here's why, broken down step by step:

  ### 1. **CJT Assumptions Violated in Practice**
     - **Independence**: CJT assumes voters (samples) are **statistically independent**. In LLMs, samples from the same model/prompt are **correlated**:
       - Shared biases (e.g., training data artifacts) cause repeated errors.
       - Temperature sampling often produces similar reasoning paths for hard questions, making errors systematic.
       - *Result*: Correlated errors reduce the "effective" sample size, breaking CJT’s convergence guarantee.
     
     - **Constant Competence (`p > 0.5`)**: CJT requires every sample to have **fixed probability `p > 0.5`** of being correct. For LLMs:
       - `p` varies per question. For **hard questions**, `p` may be **≤0.5** (e.g., the model guesses randomly or worse).
       - If `p < 0.5`, majority voting **converges to the wrong answer** with near-certainty.
       - If `p = 0.5`, accuracy plateaus at 50% regardless of samples.

  ### 2. **Practical Limits of "Buying Accuracy"**
     - **Diminishing Returns**: When `p` is only slightly >0.5 (e.g., 0.55), CJT convergence is slow. Doubling accuracy from 90% to 99% may require **100× more samples**, not just 2×.  
       - Example: For `p=0.6`, achieving 95% confidence requires ~80 samples; for `p=0.55`, it requires ~1,000.
     - **Cost Tradeoffs**: Sampling a weak model 1,000 times may cost **more** (time, compute) than:
       - Using a stronger model (fewer samples needed).
       - Targeted human verification (for edge cases).
     - **Hard Questions Are the Problem**: Your trickiest evals likely have **low `p`** (near 0.5). Here, massive sampling is inefficient and risks amplifying errors.

  ### 3. **When CJT Applies (and When It Doesn’t)**
     - **Works Well**:
       - For questions where the model has **clear competence** (`p >> 0.5`).
       - With **statistically independent** samples (e.g., diverse models, not correlated).
     - **Fails Dangerously**:
       - When `p ≤ 0.5` for hard questions (majority vote harms accuracy).
       - When errors are correlated (e.g., model "hallucinates" the same wrong fact).

  ### 4. **The Flaw in Dropping Human Verification**
     - **Unknown `p`**: For hardest evals, you **can’t assume `p > 0.5`**. Human verification is precisely for cases where `p` is low/unknown.
     - **False Confidence**: CJT’s theoretical guarantees don’t hold under correlation or variable `p`. Relying solely on self-consistency may **mask systematic errors**.
     - **Edge Cases**: Hard questions often involve rare scenarios where models fail coherently. Sampling won’t fix this.

  ### Recommended Path Forward
  1. **Quantify `p` and Independence**:
     - Measure per-question accuracy on a validation set. If `p > 0.7` (not marginal) and errors are uncorrelated, self-consistency helps.
     - Use techniques like **diverse decoding** (e.g., beam search with randomness) to reduce correlation.

  2. **Hybrid Approach**:
     - Use self-consistency for **medium-confidence** questions.
     - For low-agreement samples (e.g., 60% majority), trigger human verification. This targets cost where it’s needed.

  3. **Cost-Benefit Analysis**:
     - Compare: `(Cost_weak_model × Samples_needed)` vs. `(Cost_strong_model)` vs. `(Cost_human_verification)`.
     - Often, a stronger model (e.g., GPT-4) with 3–5 samples beats a weak model with 100 samples.

  ### Key Takeaway
  CJT is a useful intuition, but **sampling a weak model infinitely doesn’t guarantee arbitrary accuracy** when assumptions break. For high-stakes evals, **human verification remains essential** to catch failures where models are systematically wrong. Use self-consistency as a tool—not a universal replacement—and validate its efficacy per question type.
