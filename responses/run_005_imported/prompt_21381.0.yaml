answer: |-
  Here's a move-by-move breakdown of the Theo/Nadia debate, highlighting strengths, weaknesses, specialist nuances, and the convention-based question:

  **The Core Dispute:** McMahan's Rejection of Moral Equality of Combatants vs. Epistemic/Scope Challenges.

  1.  **Theo's Opening (McMahan's Core Liability Argument):**
      *   **Move:** Unjust combatants are *morally liable* to be killed because they *contribute to an unjust lethal threat*. This liability stems from their *objective role* in the unjust harm, regardless of their *beliefs* about the war's justice. The traditional moral equality is a legal/convenient fiction.
      *   **Strength:** Directly confronts the core moral intuition: intentionally participating in inflicting objectively unjustified lethal harm *should* matter morally. Separates liability from blame/punishment. Challenges the Walzerian separation of *jus ad bellum* (state) and *jus in bello* (soldier).
      *   **Weakness:** Assumes the *objective* injustice of the war is clear and knowable *to the theorist* applying the framework. Glosses over how this objective assessment is made *in practice*.
      *   **Specialist Nuance Missed:** McMahan distinguishes **responsibility** (which grounds liability) from **culpability** (blameworthiness). The unjust combatant is *responsible* for contributing to an unjust threat, making them liable, even if not *culpable* for that responsibility (due to ignorance, coercion). He also emphasizes that liability is about *necessary and proportionate* defense against an *unjust* threat, not just any threat.

  2.  **Nadia's First Objection (Epistemic Access):**
      *   **Move:** Ordinary soldiers (especially conscripts) lack the *epistemic capacity* to reliably determine *jus ad bellum*. This information asymmetry makes it deeply unfair to ground their liability to lethal force on facts they *could not reasonably access*. The "objective role" is invisible to them.
      *   **Strength:** Highlights a crucial practical and moral problem. Soldiers aren't foreign policy experts. They rely on state institutions, propaganda, chain of command. Punishing (via liability) someone for facts they couldn't know violates fairness intuitions. Challenges the *feasibility* of McMahan's moral framework for actual agents.
      *   **Weakness:** Doesn't directly refute McMahan's core *conceptual* point about objective liability. It focuses on the *burden* placed on soldiers and the *practical application*, not the *theoretical truth* of the liability claim. McMahan *acknowledges* the epistemic problem but argues it affects *blameworthiness* (excuse), not *liability*.
      *   **Specialist Nuance Missed:** This is the classic "**evidence-relative** vs. **fact-relative**" distinction. McMahan's liability is primarily *fact-relative* (what's objectively true). Nadia is emphasizing the *evidence-relative* perspective of the soldier (what they could reasonably believe). McMahan argues liability is fact-relative, while justification for acting *on* liability might need to consider the evidence-relative perspective of the *just combatant* acting in self/other-defense.

  3.  **Theo's Response (Non-Culpable Threats & the Hypnotized Attacker):**
      *   **Move:** Liability doesn't require culpability. Someone can be a non-culpable threat (hypnotized, coerced, deceived) and still be *liable* to necessary defensive force. The unjust soldier is *excused* (not blameworthy) but still *liable* to be killed to stop the unjust threat they contribute to.
      *   **Strength:** Deflects the epistemic objection by conceding non-culpability while holding firm on liability. The hypnotized attacker analogy is powerful and standard in self-defense theory. Maintains the core distinction between liability (permissibility of targeting) and blame (desert of punishment).
      *   **Weakness:** While logically consistent within McMahan's framework, it feels morally counterintuitive to many when applied to soldiers. It risks making soldiers mere instruments whose moral status is entirely determined by the objective justice of their state's cause, regardless of their own agency or circumstances.
      *   **Specialist Nuance Missed:** The hypnotized attacker analogy is imperfect. The hypnotized attacker is typically an *immediate, direct, and individualized* threat. The unjust soldier's threat is often *mediated* (through command structures, distant effects), *collective*, and part of a complex political conflict. Critics (like David Rodin) question if the individual self-defense model cleanly scales to war.

  4.  **Nadia's Second Objection (Slippery Slope / Expansion of Liability):**
      *   **Move:** If mere non-culpable causal contribution to an *unjust* threat is sufficient for liability, then liability should logically extend far beyond frontline soldiers to anyone whose actions causally support the war effort: farmers supplying food, factory workers making weapons, taxpayers funding it. This expansion is morally unacceptable and shows the criterion is flawed.
      *   **Strength:** Exposes a major tension in McMahan's framework. If liability hinges on *causal contribution to an unjust threat*, drawing a bright line at combatants is difficult. The "slippery slope" argument effectively challenges Theo/McMahan to provide a *principled* distinction. Points towards the potential collapse of the combatant/non-combatant distinction under a strict liability model.
      *   **Weakness:** McMahan *explicitly* rejects this expansion. She's forcing Theo to articulate the limiting principle McMahan proposes. She hasn't yet shown that McMahan's *proposed* limiting principle fails, only that one *is needed* and that its boundaries are contestable.
      *   **Specialist Nuance Missed:** This is the **"contributory causation"** or **"material contribution"** debate. McMahan (and others like Seth Lazar, Helen Frowe) argue for a threshold: liability requires a *sufficiently direct and substantial* contribution to the *imminent* unjust lethal threat. Farmers/workers contribute too *indirectly* and *insubstantially* (in the individual sense) to the *specific lethal acts* of soldiers. Cécile Fabre, however, *does* argue for extending liability to certain non-combatants based on their necessary contribution to the war effort, highlighting the genuine tension Nadia identifies.

  5.  **Theo's Patch (Directness/Proximity Requirement):**
      *   **Move:** Liability requires a "sufficiently direct and substantial causal contribution" to the *unjust lethal threat*. Combatants pulling triggers meet this; farmers and factory workers do not. This draws the line.
      *   **Strength:** Directly responds to Nadia's expansion objection by offering McMahan's standard limiting principle. Appeals to intuitive distinctions: the person firing the weapon is fundamentally different from the person who grew the wheat in their sandwich.
      *   **Weakness:** As Nadia immediately points out, "sufficiently direct and substantial" is vague and lacks a clear, *independent* theoretical foundation within the responsibility-based model. It *seems* to rely on pre-theoretical intuitions about who "really" poses the threat, intuitions that the Walzerian tradition *also* relies on (but for different reasons). It risks being *ad hoc*.
      *   **Specialist Nuance Missed:** The **problem of thresholds and fungibility**. Is a single soldier's contribution "substantial" given the collective nature of the threat? If a factory worker makes a *specific* vital component for missiles, is that "direct" enough? If a drone pilot is 10,000 miles away, are they "proximate"? Critics argue McMahan's criterion struggles to resolve these cases without appealing to *conventional* understandings of combatancy or implicit judgments about *intentional agency* closer to the traditional view.

  6.  **Nadia's Final Rebuttal (Circularity / Begging the Question):**
      *   **Move:** Theo's "sufficiently direct and substantial" criterion is doing all the work. It lacks a principled grounding *within* the responsibility-based account itself. It simply *reimports* the very intuitions about who is a "fighter" that the responsibility model was supposed to *explain and ground*, rather than assume. The framework fails to *generate* the distinction; it *presupposes* it.
      *   **Strength:** This is a powerful meta-critique. She identifies a potential circularity or explanatory gap. If the responsibility model needs an *external* criterion (directness/substantiality) that isn't itself derived *from* the core concepts of responsibility and unjust threats, then it hasn't fully succeeded in replacing the traditional view it critiques. It highlights the challenge of deriving the combatant/non-combatant distinction *solely* from individual responsibility for contributing to an unjust threat.
      *   **Weakness:** Doesn't offer a positive alternative criterion. While highlighting a problem, it doesn't prove McMahan *can't* provide a satisfactory grounding for "direct and substantial" (though it's widely acknowledged as difficult).
      *   **Specialist Nuance Missed:** This connects to debates about **the nature of causation and contribution in collective action**. Some argue McMahan relies on an overly simplistic "but-for" causation model ill-suited to complex social processes like war. Others (like Christopher Kutz) emphasize *complicity* as a better model than direct causation, but complicity also involves normative judgments about roles and intentions. The "directness" requirement might implicitly track the *intentional role* of combatants as *designated harm-inflicters*, blurring back towards Walzer's institutional definition.

  **Who Had the Better of Each Move?**

  *   **Theo's Opening:** Strong on core moral logic (objective injustice matters), weak on practical epistemology. **Edge: Theo** (for establishing the core challenge).
  *   **Nadia's First Objection:** Strong on practical/moral fairness for soldiers, weak on refuting the conceptual liability claim. **Edge: Nadia** (exposes a major practical flaw).
  *   **Theo's Response (Hypnotized Attacker):** Strong on logical consistency within the framework, weak on moral counter-intuitiveness for soldiers. **Edge: Theo** (successfully deflects the epistemic objection *as a refutation of liability*).
  *   **Nadia's Second Objection (Slippery Slope):** Strong challenge exposing a tension and demanding a limiting principle. **Edge: Nadia**.
  *   **Theo's Patch (Directness/Proximity):** Necessary response but vulnerable. **Edge: Draw** (He offers the standard reply, but its vulnerability is exposed).
  *   **Nadia's Final Rebuttal (Circularity):** Strong meta-critique highlighting a foundational difficulty. **Edge: Nadia**.

  **Overall:** Nadia landed the more telling blows *against McMahan's framework as applied*, particularly exposing the epistemic burden on soldiers and the unresolved tension regarding the scope of liability (the "slippery slope" and the problem of grounding "directness"). Theo successfully defended the internal logic of McMahan's core distinction but couldn't fully resolve its practical and foundational challenges under Nadia's pressure. It was a very good student debate!

  **The Convention-Based Defense (Walzer/Benbaji) and Nadia's Point:**

  *   **What it is:** Walzer (especially in *Just and Unjust Wars*) argues the moral equality of combatants and the combatant/non-combatant distinction are *conventions* essential to limit the horrors of war. Benbaji develops a sophisticated "contractarian" defense: warring parties (or their representatives) would rationally agree to rules granting combatants equal status and immunity to non-combatants *regardless of the war's justice*, because this is the best achievable system to restrain violence. Combatants become "moral equals" *by convention*.
  *   **How it Bears on Nadia's Last Point:** Nadia argued that Theo's "direct and substantial" criterion was unprincipled and reimported traditional intuitions. The convention-based approach **offers a completely different *kind* of justification for the combatant/non-combatant distinction.**
      *   **It *could* strengthen Nadia indirectly:** By showing there's an *alternative, coherent framework* (conventionalism) that *does* provide a principled (though pragmatic/conventional, not fact-relative moral) grounding for the distinction Theo is struggling to ground within the responsibility model. It highlights that McMahan's framework *isn't the only game in town* and that his difficulty grounding "directness" might point towards needing a different kind of justification altogether. It validates her intuition that something else is at work.
      *   **But it's a *different kind* of move:** Nadia was arguing *within* the responsibility framework, pointing out an internal weakness. The convention-based defense *abandons* the project of grounding liability in individual responsibility for the objective injustice of the war. It says: "For the purposes of *fighting* the war, we agree to treat all combatants as legitimate targets *regardless* of objective liability, because the alternative (trying to sort just/unjust combatants in the fog of war and expanding liability) leads to worse outcomes." It doesn't *solve* Nadia's challenge to McMahan; it *sidesteps* it by offering a different moral foundation for the rules of war.
      *   **Does it *help* her last point specifically?** Not directly against Theo *within the responsibility debate*. However, it provides strong support for her *overall skepticism* about McMahan's project by offering a compelling alternative that avoids the epistemic problems *and* the slippery slope worries Nadia raised earlier. It suggests that the traditional distinction, which McMahan rejects, has a powerful justification rooted in the *functional requirements of limiting war*, which might explain why Theo's "directness" criterion intuitively tracks the conventional combatant role.

  **Your Role as TA:** This was a *fantastic* seminar moment! Students were grappling deeply with foundational tensions in the literature. Your instinct not to jump in immediately was likely correct – they needed to thrash it out. Now you have rich material for follow-up: revisit the "direct and substantial" debate, introduce the evidence-relative/fact-relative distinction, discuss Fabre vs. McMahan/Frowe on non-combatant liability, and explore how conventionalism (Benbaji) offers a different *type* of solution to the problems Nadia identified. Don't feel bad about the convention point – it's a complex pivot. Use it now to enrich the discussion!
