answer: |-
  Here's a precise breakdown of the two theses, their relationship, epistemic status, and the *actual* threat posed by quantum computing:

  **1. The Original Church-Turing Thesis (CTT)**
  *   **Core Assertion:** A function on the natural numbers is computable by a human being following an algorithm (effectively calculable) if and only if it is computable by a Turing machine (or equivalently, by lambda calculus, general recursion, etc.).
  *   **Focus:** **Computability in Principle.** It defines the absolute limits of *what* can be computed algorithmically, irrespective of time, space, or resources. It's about the *existence* of an algorithm.
  *   **Epistemic Status:** Deeply debated but generally considered **non-falsifiable and definitional/explicatory**:
      *   **Carnapian Explication:** This is the dominant modern view. CTT provides a precise, formal mathematical model (Turing machines) to explicate the intuitive, pre-theoretic notion of "algorithm" or "effective calculability." Its acceptance stems from the confluence of numerous equivalent models (Turing machines, lambda calculus, recursive functions, register machines) and the lack of any convincing counterexample after nearly a century. It *defines* the boundary of computability for mathematical logic and computer science.
      *   **Kripke's "Theorem" View:** Kripke argues that once we rigorously axiomatize the intuitive notion of computation (e.g., steps must be discrete, deterministic, finite in description, and locally executable), CTT *becomes* a theorem derivable from those axioms. The thesis lies in the claim that the axioms capture the intuitive notion correctly.
      *   **Empirical Generalization?** While its initial plausibility drew from human experience, CTT transcends mere induction. No physically unrealizable hypercomputation model (e.g., accelerating Turing machines, real numbers as inputs) is accepted as demonstrating a genuinely *effective* procedure beyond Turing machines. Its status is fundamentally conceptual, not empirical. We don't *test* CTT; we use it as the definition of computability.
  *   **Status:** **Universally accepted** as the foundation of computability theory. No known algorithmic process challenges it.

  **2. The Extended (Strong) Church-Turing Thesis (ECTT)**
  *   **Core Assertion:** Any physically realizable model of computation can be efficiently simulated by a deterministic Turing machine. More precisely: If a function can be computed by a physically realizable computer in time `T(n)` for inputs of size `n`, then it can be computed by a deterministic Turing machine in time `T(n)^k` for some constant `k` (i.e., with at most polynomial overhead).
  *   **Focus:** **Efficient Computability (Complexity).** It concerns *how* computations scale with input size, specifically the class **P** (problems solvable in polynomial time on a deterministic Turing machine). ECTT claims that **P** captures the class of problems *efficiently solvable by any physically realizable computer*. It asserts that classical Turing machines are not just universal for computability, but also *efficiently universal*.
  *   **Epistemic Status:** A **falsifiable complexity-theoretic conjecture**.
      *   It's a substantive claim about the physical universe: that no physical process can *consistently* solve problems outside **P** (for classical machines) *exponentially faster* than a Turing machine can simulate it. It links physics to computational complexity.
      *   Its justification was primarily empirical: *All* known physically realizable computational models up to the 1990s (deterministic TMs, non-deterministic TMs, randomized TMs, parallel RAMs) could be simulated by deterministic TMs with polynomial overhead. This made **P** seem like a robust class for "tractable" problems.
  *   **Status:** **Seriously challenged** by quantum computing.

  **3. Relationship Between CTT and ECTT**
  *   **CTT is foundational to ECTT:** ECTT presupposes CTT. ECTT operates *within* the realm of computable functions defined by CTT. It makes a *stronger* claim about the *efficiency* of computation within that realm.
  *   **Distinct Claims:** CTT is about *what* can be computed; ECTT is about *how efficiently* it can be computed, specifically within the constraints of physics. CTT is a conceptual/logical thesis; ECTT is a physical/complexity thesis.
  *   **Implication:** If ECTT were true, then **P** would represent the class of problems efficiently solvable in our physical universe. If false, there could be physical processes enabling fundamentally faster computation for certain problems.

  **4. Quantum Computing and the Theses: The Actual Threat**
  *   **CTT is UNTOUCHED:** Quantum computers are provably simulatable by classical Turing machines (albeit very slowly for some problems). Any function computable by a quantum computer is computable by a classical Turing machine. Quantum computing **does not refute or break the original Church-Turing thesis.** It operates entirely within the bounds of computability defined by CTT.
  *   **ECTT is ENDANGERED:** Shor's algorithm factors large integers in polynomial time (`O(n^3)`) on a quantum computer. The best known classical algorithms require exponential time (`O(e^(n^(1/3))`). This represents an *exponential speedup* for a specific problem.
      *   If large-scale, fault-tolerant quantum computers are successfully built, they would physically realize a model of computation that solves a problem (integer factorization) exponentially faster than the best known classical simulation. This would **falsify the Extended Church-Turing Thesis.**
      *   It demonstrates that **BQP** (Bounded-Error Quantum Polynomial Time) contains problems believed to be outside **P** (and even outside **NP**), meaning quantum computers could efficiently solve problems that classical computers *cannot* solve efficiently, based on current knowledge.
  *   **The Caveat (Current Status):** While Shor's algorithm *theoretically* breaks ECTT, the *physical realization* of large-scale, fault-tolerant quantum computers capable of outperforming classical machines for practical instances of such problems is still an immense engineering challenge (decoherence, error correction). The *experimental* falsification of ECTT hinges on overcoming these hurdles. However, the *theoretical* framework of quantum computation provides a compelling counterexample to the ECTT conjecture.

  **Your Plain Statement for Print:**

  > "Quantum computing does *not* threaten the original Church-Turing thesis (CTT), which defines the fundamental limits of what is mathematically computable. Quantum computers themselves fall within CTT's scope, as any quantum computation can, in principle, be simulated by a classical computer – albeit potentially at an excruciatingly slow pace. The claim quantum computing truly challenges is the *Extended Church-Turing thesis* (ECTT). ECTT asserts that any physically realizable computer can be simulated efficiently (with only polynomial slowdown) by a classical Turing machine. Algorithms like Shor's, which offer exponential speedups for problems like integer factorization on a quantum computer, suggest that if large-scale quantum computers are built, they could perform certain calculations fundamentally faster than any classical machine could simulate efficiently, thereby falsifying ECTT. This isn't about breaking computation's ultimate limits; it's about discovering vastly more efficient paths *within* those limits."
