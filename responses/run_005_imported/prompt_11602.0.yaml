  First, the original Church-Turing thesis (CTT) is about computability—what functions can be computed in principle, regardless of resources. It's a hypothesis that any effectively calculable function can be computed by a Turing machine. This isn't a formal theorem but a conceptual assertion. The Extended Church-Turing thesis (ECTT), on the other hand, deals with efficiency. It claims that any physically realizable computation can be simulated by a Turing machine with polynomial overhead, meaning efficient algorithms remain efficient when translated.

