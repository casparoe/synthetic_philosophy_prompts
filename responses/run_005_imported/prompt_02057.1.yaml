answer: |-
  You're wrestling with a profound philosophical tension—one that pits **agency against circumstance** in defining personal achievement. Both perspectives contain truth, but neither is complete alone. Here's a breakdown of why your unease is valid, *and* why your friend's pride is justified:

  ### Why Your Friend is Right (The Power of Agency)
  1. **The "Daily Choices" Argument is Real**:  
     No one *made* her wake up early, study, or resist old habits. Her discipline required consistent cognitive effort, emotional labor, and sacrifice. These were authentic expressions of her will.
  2. **Self-Reinforcing Transformation**:  
     Each disciplined choice reshaped her neural pathways, habits, and identity. The person who *finished* the overhaul was fundamentally different from the one who started—and that evolution was fueled by her actions.
  3. **Moral Ownership**:  
     Claiming credit isn't just about ego; it’s about dignity. To deny her agency risks reducing her struggle to inevitability ("luck" or "privilege made it possible"), which can feel dehumanizing.

  ### Why Your Intuition is Valid (The Hidden Scaffolding)
  1. **Privilege Enables Choice, Not Just Outcomes**:  
     A stable upbringing likely provided psychological safety nets: no crushing debt, no trauma requiring therapy, a baseline self-worth. This freed mental bandwidth to *choose* discipline. Someone in survival mode rarely has that luxury.
  2. **Luck as Opportunity, Not Guarantee**:  
     "Lucky breaks" (e.g., meeting a mentor, timing in her industry) didn’t *cause* her success, but they were doors only unlocked by her effort. Crucially, though, **others with equal effort may never get those doors unlocked**. Her luck amplified her choices; it didn't replace them.
  3. **The Myth of "Self-Made"**:  
     No one is truly self-made. We inherit biology, culture, language, infrastructure, and social capital. Acknowledging this isn’t denying effort—it’s recognizing that achievement exists within ecosystems. As economist **Mariana Mazzucato** notes: *"What looks like individual genius is often collective investment."*

  ### The Core Insight: Credit Isn't Binary
  Your friend sees credit as a **monolith** ("I own 100%"). You sense it’s **layered** ("You own your choices, but the *capacity* to make them wasn’t self-created"). Philosopher **Daniel Dennett** captures this:  
  > *"We are not the authors of our own stories, but we are the editors."*  
  She edited her life brilliantly. But she didn’t create the raw material (genetics, childhood) or the publishing industry (society, luck).

  ### A Balanced Perspective
  | **Factor** | **Her Contribution** | **Circumstantial Influence** |
  |------------|----------------------|------------------------------|
  | **Discipline** | 100% her choice | Requires mental health, time, energy |
  | **Opportunity** | She seized it | Luck made it *available* |
  | **Resilience** | Her cultivated trait | Shaped by upbringing, support systems |
  | **Outcome** | Direct result of actions | Enabled by environment, timing |

  ### Conclusion
  You’re both right—but incomplete.  
  - **She deserves immense credit** for her choices. Without them, her advantages would have meant nothing.  
  - **You’re right that "full credit" overreaches**. Privilege and luck aren’t just about outcomes; they shape the *range* of choices available.  

  This isn’t about diminishing her achievement—it’s about **grounding it in reality**. True empowerment comes from recognizing *both* our agency *and* our interdependence. As author **Tara Westover** wrote:  
  > *"You could call this selfhood many things. Transformation. Metamorphosis. Falsity. Betrayal. I call it an education."*  

  Your friend educated herself into a new life. That’s heroic. But the tuition was paid, in part, by forces beyond her control. Acknowledging this doesn’t rob her of pride—it connects her triumph to the human condition.
