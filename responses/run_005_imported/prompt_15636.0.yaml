answer: |-
  Your dilemma cuts to the heart of historical representation, epistemology, and the ethics of storytelling. Philosophers *have* grappled with the problem of comparing imperfect accounts, and their insights offer frameworks—though not easy answers—for your situation. Let's break this down:

  ### 1. **The Philosophical Ground: Can One False Account Be "Closer" to Truth?**
     - **Verisimilitude (Truthlikeness)**: Philosophers like Karl Popper and later Pavel Tichý developed theories of *verisimilitude*—the idea that some false statements (or models) can be "closer" to truth than others by containing more *true consequences* or aligning better with the *structure of reality*. For example:
       - Claim A: "She was 25 years old (but was actually 24)" has higher verisimilitude than Claim B: "She was 50 years old."
       - Similarly, a portrait capturing someone’s personality *despite* minor factual errors may be "truer" than a technically accurate but lifeless sketch.
     - **Coherence vs. Correspondence**: Your instinct maps onto two classic theories of truth:
       - *Correspondence*: Truth as alignment with facts (the academic biography’s strength).
       - *Coherence*: Truth as internal consistency and fit with other known truths (the memoir’s psychological plausibility).
       Neither is sufficient alone. A coherent account can be mythical; a factually dense one can miss the essence. But **together**, they triangulate truth.

  ### 2. **Why Your Instinct Isn’t Just Self-Deception**
     - **Narrative as Epistemology**: Historian Hayden White argued that historical understanding *requires* narrative shaping. Facts alone are inert; their meaning emerges from structure. The memoirist’s "invented" scenes may distill emotional truths witnessed over time, even if specific dialogues are recreated. The academic biographer, avoiding speculation, may omit connective tissue that makes sense of actions.
     - **The "Human" Truth**: The memoir’s portrayal resonates because it presents a *psychologically coherent agent*—a crucial test for historical understanding. As philosopher R.G. Collingwood noted, history requires *re-enactment of thought*: understanding *why* someone acted as they did. The academic account’s "ambition" thesis may be factually supported but fail this test if her documented actions align poorly with cold ambition (e.g., taking lethal risks for no clear personal gain).

  ### 3. **Tools to Evaluate "Closeness" Beyond Fact-Counting**
     - **Predictive Power**: Which account better explains *all* documented actions? If the memoir’s "reckless loyalty" explains her recruitment choices, network interactions, and fatal decisions better than "calculation," it has higher verisimilitude—even with factual errors.
     - **Resistance to Disconfirmation**: Does new evidence *consistently* undermine one account’s core thesis, while the other integrates it? If archives confirm her protecting comrades at great personal cost, the "ambition" thesis weakens.
     - **Explanatory Scope**: Does either account reconcile the *disagreements* between sources? A superior thesis might explain *why* the memoirist idealized certain aspects or why police records (often coercive/interrogation-derived) suggest coldness.

  ### 4. **A Path Forward for Your Novel**
     - **Reject the False Binary**: You aren’t forced to choose one source. The deepest historical fiction often *synthesizes* or *interrogates* contradictions. Your character can exist in the tension: perhaps she *was* both calculating and idealistic, or her "ambition" was for her cause, not herself.
     - **Make the Dilemma the Point**: Your struggle mirrors the historian’s task. Could the novel incorporate *both* perspectives? (e.g., through competing narrator voices, or the protagonist herself wrestling with how she’s perceived?).
     - **Ethical Guardrails**:
       - **Transparency**: Signal fictionalized elements in an author’s note.
       - **Fidelity to Core Evidence**: Ensure key actions align with undisputed records (e.g., her capture, methods).
       - **Humility**: Acknowledge the unknowable. Some gaps *should* haunt the narrative.

  ### Why Your Instinct is Defensible
  You sense the memoir is "closer" not just because it’s dramatically satisfying, but because it offers a **causally rich explanation** of her life *as a lived experience*. The academic biography, while factually meticulous, may commit the "archivist’s fallacy": prioritizing documentable facts over psychological or social context. A death warrant’s dry language won’t capture why someone chose to die.

  **In short: "Closer to truth" isn’t invalidated by factual errors. It hinges on which account better *explains the evidence in its full complexity*, honors the *human agency* of its subject, and resists *reductionism*. Your task isn’t to choose a source—it’s to build a third, more truthful narrative from their collision.**

  As Hilary Mantel (writing Cromwell) understood: The novelist’s duty isn’t to facts alone, but to the *ghost*—the person who lived, breathed, and made choices in the dark. Trust your sleepless nights; they signal your integrity. Now wield that integrity to craft a story that honors both the record *and* the resonance of a life.
