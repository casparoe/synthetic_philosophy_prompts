  I should structure the argument: first, explain the dualism and its unresolvable nature. Then, show why empirical evidence was necessary. Next, link psychical research to seeking that evidence. Address the null results by emphasizing methodological rigor and high stakes. Use specific quotes from the Methods to strengthen each point. Make sure to directly tackle the objection about null results being evidence against the possibility he sought.
answer: |-
  Here is the strongest possible version of your argument, engaging directly with the *Methods*, Sidgwick's standards, and the "null results" objection:

  **Thesis: Sidgwick's psychical research wasn't a lapse, but the rigorous, necessary *empirical corollary* to the unresolved "Dualism of Practical Reason" in the *Methods of Ethics*. His own stringent standards for rational belief, applied consistently to the metaphysical presupposition required for ethical harmony, compelled him to seek empirical evidence for a "moral order" rather than assume it, making decades of investigation the rational, if ultimately frustrating, consequence of his ethical system.**

  **The Core Commitment: The Unresolved Dualism and the Need for a "Further Fact"**
  1.  **The Intractable Dualism:** Sidgwick concludes the *Methods* by demonstrating that both Egoism (acting for one's own greatest happiness) and Utilitarianism (acting for the greatest happiness of all) are equally rational, self-evident (when clearly apprehended), and fundamental principles. However, they are fundamentally *in conflict* in a world where the individual's greatest good demonstrably doesn't always align with the universal good.
  2.  **The Stalemate & the Requirement:** Sidgwick explicitly states that this "dualism of practical reason" cannot be resolved *within* the system of human knowledge and experience as he rigorously analyzed it. He writes: "The whole system of our beliefs as to the intrinsic reasonableness of conduct must fall, without a hypothesis unverifiable by experience reconciling the Individual with the Universal Reason." He rejects Kant's postulation of God and immortality as a solution precisely because it *is* a postulate – an unverified assumption of faith.
  3.  **The "Moral Order" Hypothesis:** Sidgwick identifies the necessary "further fact" or "hypothesis" that *could* resolve the dualism: the existence of a "moral order" in the universe. This implies a governing intelligence or structure ensuring that virtue (acting universally) is ultimately conducive to, or at least not eternally incompatible with, the individual's deepest happiness and fulfillment. This could involve post-mortem existence, divine justice, or a fundamental teleology linking virtue and individual well-being.

  **Why Empirical Investigation Was the Only Rational Path: Sidgwick's Own Standards**
  1.  **No Intuitive Certainty:** Sidgwick's method demands that fundamental intuitions must be clear, precise, and survive rigorous scrutiny. The *existence* of a "moral order" is *not* a self-evident intuition in this sense. It's a *metaphysical claim* about the structure of reality.
  2.  **Rejection of Faith:** Sidgwick explicitly rejects Kant's solution *because* it relies on faith ("I find it impossible not to hold that a predominant regard to general happiness... must be imposed by a Divine Lawgiver, if we are to rationalise it"). His entire project was to establish ethics on a *rational*, not a dogmatic, basis.
  3.  **The Demand for Verification:** Sidgwick's standard, articulated throughout the *Methods* and embodied in his approach to ethics, is that claims about reality require *evidence*. If the reconciliation of the dualism *depends* on a specific fact about the universe (a moral order), and that fact is not intuitively given nor logically necessary, *then the only rational course is to investigate whether that fact obtains*. As he stated, the hypothesis must be "unverifiable by experience"? He aimed to *make it verifiable*.
  4.  **Psychical Research as the Relevant Empirical Field:** For Sidgwick, phenomena like apparent survival of death, communication with discarnate intelligences, or evidence of a purposeful superintending mind *were* the potential empirical manifestations of the required "moral order." If spirits existed and communicated ethical truths or demonstrated post-mortem justice/fulfillment, this would constitute direct evidence for the hypothesis needed to resolve the dualism. Séances weren't about cheap thrills; they were potential laboratories for observing the structure of ultimate reality relevant to ethics.

  **Meeting the Hardest Objection Head-On: Decades of Null Results**
  **Objection:** *By Sidgwick's own standards of evidence and convergence, decades of essentially null results – pervasive fraud, inconsistent phenomena, lack of replicable proof – should themselves have constituted strong evidence *against* the existence of the phenomena he sought. Persisting despite this, the objection claims, reveals irrationality or a lapse.*

  **Your Counter-Argument (Meeting the Objection):**

  1.  **High Stakes Demand Thorough Investigation:** Sidgwick understood the *enormous ethical stakes*. The unresolved dualism meant the potential collapse of a rationally coherent utilitarianism (and perhaps systematic ethics itself) on a fundamental point. Given the magnitude of what hung in the balance – the rational harmony of the moral universe – a few decades of negative results, however frustrating, were not sufficient grounds for *conclusive* abandonment. Extraordinary claims (a moral order) might require extraordinary evidence, but *disproving* them also requires extraordinary thoroughness when the implications are foundational.
  2.  **Methodological Rigor vs. Premature Closure:** Sidgwick's approach to psychical research *embodied* his rigorous standards. The SPR was founded precisely to apply scientific skepticism and careful investigation to these claims, *to weed out fraud and error*. The null results weren't ignored; they were actively *produced* by the methodology he championed. Persisting *despite* fraud discoveries demonstrates *adherence* to his standards – it showed the need for *more* rigorous controls, not less. Abandoning the search prematurely *because* of early fraud or negative results would have been *less* rational, akin to giving up on a difficult but crucial scientific question after initial failed experiments.
  3.  **"Absence of Evidence is not Evidence of Absence" (Sidgwickan Edition):** Sidgwick understood the limitations of empirical investigation, especially concerning elusive phenomena and potential limitations of human perception/instrumentation. Decades of negative results constituted *absence of evidence*, but not necessarily *conclusive evidence of absence* for the *specific hypothesis* he needed (a moral order). The phenomena sought were inherently difficult to investigate and verify. His own standards demanded that the *possibility* remain open until every reasonable avenue was exhausted with the utmost rigor, which he believed the SPR represented.
  4.  **The Burden of Proof Remained:** The dualism remained unresolved. Without the "moral order" hypothesis, ethics rested on an unstable foundation. Sidgwick felt the rational burden was to *keep seeking* a resolution. Ceasing the search wouldn't make the dualism disappear; it would simply leave it unresolved *and* close off the only empirical path Sidgwick saw towards a potential solution. Persistence was the rational response to an unresolved, foundational problem, driven by the hope that evidence *might* still emerge, not by blind belief in the face of contrary evidence.
  5.  **The Nature of the "Null Result":** Much of the "null result" was actually the *exposure of fraud and misperception*. This didn't disprove the *possibility* of genuine phenomena; it merely proved that *many specific instances* were fake. Sidgwick could rationally hold that while the *current evidence* was insufficient (hence the dualism remained), the *search* was still mandated because the *logical requirement* for a moral order (if ethics was to be fully harmonious) persisted, and no alternative resolution was found.

  **Conclusion:**
  Sidgwick's psychical research was the inevitable, rational consequence of the devastatingly honest conclusion of the *Methods*. Faced with an irreconcilable conflict at the heart of practical reason, and having demolished the option of faith-based postulation, his unwavering commitment to rational inquiry and empirical verification left him only one path: to investigate empirically the only hypothesis that could resolve the impasse – the existence of a moral order manifesting potentially in psychical phenomena. Decades of null results were profoundly disappointing, but within Sidgwick's framework, they represented the arduous, necessary work of rigorously testing a world-saving hypothesis, not a lapse of judgment. To abandon the search would have been to admit defeat on the rational harmonization of ethics far sooner than his demanding standards required. His persistence was not credulity, but the ultimate expression of his commitment to reason: a decades-long, systematic effort to find empirical footing for the ethical harmony his philosophy demanded but could not, on its own, achieve.
