  Bitcoin's fixed supply contradicts this. Berkeley criticized Law's scheme for unlimited issuance, but Bitcoin's problem is the opposite—it's too rigid. So Berkeley would likely see Bitcoin's fixed supply as inadequate for facilitating trade. 

