  Now, Nozick's adaptation. He weakens this to just not making others worse off than they were before. But why? The user mentions historical holdings. If Locke's strict condition were applied, most historical acquisitions would be invalid because eventually, resources become scarce. Nozick needs to justify existing property distributions, so he lowers the bar. His baseline is a state of nature where resources aren't owned yet. If an acquisition doesn't leave anyone worse off than in that pre-ownership state, it's okay. 

