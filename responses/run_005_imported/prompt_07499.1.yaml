prompt: |-
  I'm working on a magazine feature about how demanding morality can reasonably be, and in the course of reporting it I keep running up against Bernard Williams' well-known distinction between "internal" and "external" reasons for action. As it has been explained to me, an internal reason is one you have simply because you already want something, in the way that wanting to avoid pain or preserve a friendship gives you a reason to act; an external reason, by contrast, is supposed to bind you regardless of what you happen to want, the way a duty to send a large share of your income to strangers dying of malaria would presumably bind you even if you felt nothing at all toward people on the other side of the world. Williams was famously skeptical that external reasons of that second sort make any real sense, and this strikes me as a serious problem for the more demanding wing of the effective-altruism movement: if there is no such thing as a reason that holds regardless of your actual desires, then a person who genuinely feels nothing for distant strangers would seem to be, on Williams' own terms, off the hook, and philosophers such as Peter Singer would need some entirely different resource to show that such a person is making a rational error rather than simply following an unfortunate but coherent set of priorities.

  Before I put this argument in front of readers who have never encountered the distinction, I would like to make sure I have the philosophy right. Am I correct that Williams' internalism amounts, in effect, to a rejection of demanding, impartial obligations toward people we have no personal tie or feeling for? I have a nagging sense that "internal" is not simply a philosopher's word for "self-interested," and that the machinery of the "subjective motivational set," together with whatever counts as a "sound deliberative route" leading out from it, is doing more work than my summary allows — though I cannot quite reconstruct the argument on my own. Could you explain what the internal/external distinction actually turns on, correct my summary wherever it misfires, and say whether one can consistently accept Williams' skepticism about external reasons while still maintaining that we owe a great deal to people we will never meet?
reasoning: |-
  Okay, let me unpack this user's query. They're writing a magazine feature on how demanding morality can be, specifically grappling with Bernard Williams' internal/external reasons distinction. The user seems well-versed in the philosophical concepts but wants to ensure they're representing Williams accurately, especially regarding demanding moral obligations like those in effective altruism.

  Hmm, the user's core concern is whether Williams' internalism completely undermines obligations to distant strangers. They suspect their summary might oversimplify by equating "internal" with "self-interested," and they're right—that's a common misinterpretation. The subjective motivational set (S-motivation set) is broader than mere self-interest; it includes values, commitments, and even altruistic desires. 

  Ah, and they're worried about Williams' external reason skepticism creating problems for Singer-style arguments. But Williams isn't saying we can't have reasons to help strangers; he's saying those reasons must connect to the agent's existing motivations. The "sound deliberative route" point is crucial here—it allows for expanding moral perspectives through reflection. 

  The user also asks if one can accept Williams' view while still affirming obligations to distant people. Absolutely. Williams himself argued that moral motivations often emerge from deep human concerns, not abstract duties. The challenge is showing how helping strangers connects to things the agent already cares about, perhaps through consistency or emotional engagement. 

  I should emphasize that Williams rejects external reasons as incoherent, not demanding morality per se. His target is the Kantian/Rawlsian model of pure rationality generating obligations. For the effective altruism debate, this means obligations must be framed in terms of the agent's actual values—which may include impartiality if they hold that value. 

  The user's nagging sense about the S-motivation set doing more work is spot-on. It's not static; deliberation can reveal new connections (e.g., realizing indifference to suffering contradicts one's broader values). This leaves room for demanding morality but grounds it in the agent's psychology. 

  ... I'll structure the response to first clarify Williams' distinction, correct misunderstandings, then address reconciling his view with demanding obligations. The key is stressing that internal reasons aren't selfish—they're about psychological ownership of reasons. The "sound deliberative route" opens space for moral growth without invoking mythical external reasons.
answer: |-
  You've grasped the core tension brilliantly, and your nagging sense is correct: **Williams' internalism is *not* simply "self-interest," and reducing it to that misses its power and its challenge to demanding morality.** While it *does* create problems for certain justifications of highly demanding impartial obligations (like Singer's), it doesn't necessarily let the indifferent person entirely "off the hook" in the way your initial summary suggests. Let's break it down:

  1.  **The Distinction: Internal vs. External Reasons (Corrected & Refined):**
      *   **Internal Reason:** A reason for an agent (A) to φ exists *only if* there is a **sound deliberative route** from A's **"subjective motivational set" (S)** to a motivation to φ.
          *   **S (Motivational Set):** This isn't just "wants" or "desires" in a narrow, selfish sense. It includes *everything* that motivates A: desires, projects, commitments, loyalties, values, dispositions of character, emotional responses, even deeply held beliefs about what matters. It's A's *constitutive practical identity*.
          *   **Sound Deliberative Route:** This means reasoning *correctly* from elements within S. It includes:
              *   Instrumental reasoning (how to achieve X in S).
              *   Considering consistency between elements in S.
              *   Gathering relevant factual information.
              *   Imagining possibilities realistically.
              *   Possibly even recognizing that some element in S *requires* a broader commitment (e.g., valuing fairness *might* lead, via sound deliberation, to recognizing a reason to act fairly in a new situation).
          *   **Key:** The reason is *internal* because its existence *depends* on its link, via sound deliberation, to A's actual motivational constitution. If there's *no possible route* from S to a motivation to φ, then A *has no reason* to φ.
      *   **External Reason:** A reason for A to φ that exists *independently* of A's S and any possible deliberative route from S. It purports to bind A rationally *regardless* of what motivates A. Moral duties, divine commands, or categorical imperatives presented as binding independently of the agent's motivations are classic candidates.
      *   **Williams' Skepticism:** Williams argues **external reasons statements are false, or at best, misleading.** His core argument:
          *   Reasons must be capable of *explaining* action. If a reason is truly external, having no link to S, it cannot explain why A *might* be motivated to act. Saying "A has a reason to φ" implies φ-ing *could* be a motivated action for A, given sound deliberation.
          *   Positing an external reason adds nothing. If the reason *does* motivate A after deliberation, it was actually internal all along (the deliberation connected it to S). If it *doesn't* motivate A, even after sound deliberation, then claiming A still "has a reason" is empty – it fails to explain anything about A's actual or potential motivations and actions. It's just a disguised way of saying "A *ought* to be motivated" or "We wish A were motivated," not a statement about a reason A actually possesses.

  2.  **Correcting Your Summary:**
      *   **Misfire 1: "Internal = Self-Interested/Existing Wants":** Your summary ("reason you have simply because you already want something") leans too close to this. S is vastly richer. Someone's S could deeply include impartial benevolence, a commitment to justice for all, or profound empathy for suffering strangers. *Their* reasons to help distant strangers would be *internal* – grounded in *their* actual motivations. The challenge arises for the person whose S *lacks* these elements.
      *   **Misfire 2: "External = Duty Regardless of Feeling":** This is accurate *as the target of Williams' critique*. But Williams argues such duties *cannot constitute genuine reasons* for the agent *if* they genuinely have no link to S.
      *   **The Crucial Nuance:** The problem isn't *just* "feeling nothing." It's about whether *any sound deliberative route* exists from the agent's *actual* S (whatever it contains) to a motivation to help distant strangers. This route *might* exist even without a direct "feeling" for them (e.g., via a commitment to fairness, consistency, reducing suffering abstractly, or fulfilling a self-conception as a moral person).

  3.  **Does Internalism Reject Demanding, Impartial Obligations?**
      *   **Yes, in their *external* form:** Williams absolutely rejects the idea that there are reasons binding agents *purely* because of abstract, impartial moral principles, *utterly independent* of the agent's motivational set. Singer's argument often relies on the *sheer logic* of impartiality and preventing harm generating a reason *for everyone*, regardless of their motivations. Williams says this logic fails to generate a *reason* unless it connects to the agent's S.
      *   **No, *not necessarily* in their *internal* form:**
          *   For agents whose S *includes* impartiality, empathy, or a strong sense of global justice, the demanding obligation *is* internal. They have powerful reasons.
          *   Williams leaves open the possibility that *sound deliberation* could *expand* an agent's perspective *from within their S*. For example:
              *   An agent valuing fairness might, via deliberation realizing the arbitrariness of location, come to see a reason to act fairly towards distant strangers.
              *   An agent committed to reducing suffering might, via factual deliberation about global poverty, come to see a reason to donate.
              *   An agent valuing consistency might see that their concern for suffering nearby, coupled with facts about distant suffering, generates a reason to act impartially.
          *   **The Challenge:** For the person whose S is truly impoverished – containing *no* evaluative elements (like fairness, compassion, consistency, reducing suffering) that sound deliberation could link to helping distant strangers – Williams *does* seem to say they have *no reason* to help. Their "unfortunate but coherent set of priorities" means Singer cannot accuse them of a *rational error* in ignoring distant suffering *if* no sound deliberative route exists from *their specific S*. The error might be moral or evaluative, but not strictly rational in Williams' internalist sense.

  4.  **Can You Accept Williams' Skepticism AND Affirm Obligations to Distant Strangers?**
      *   **Yes, but the *justification* must shift.**
      *   **Strategy 1: Argue that sound deliberation *from common human S elements* leads there.** Williams himself thought most people have S elements (like basic dispositions to sympathy, a sense of fairness, commitments to projects requiring social cooperation) that, via sound and *radically* imaginative deliberation, *can* lead to recognizing reasons for broader impartial concern. The obligation isn't external; it's an *internal demand of consistency or expanded empathy latent within a very common human motivational set*. You argue the indifferent person *hasn't deliberated soundly enough* or hasn't fully grasped the implications of their *own* values/facts. This is demanding but internal.
      *   **Strategy 2: Ground obligations in *shared social practices/identities*.** Our S is shaped by culture. We can argue that being a member of a modern, interconnected global society fosters an S where recognizing obligations to distant others *is* part of our constitutive identity. The reason is internal to that socially constituted S.
      *   **Strategy 3: Distinguish "reason" from "obligation".** You can accept Williams on *reasons* (as motivationally grounded) but maintain that demanding impartial *moral obligations* exist objectively. However, you then face the challenge: What force does this "obligation" have for the agent *if* it doesn't connect to their reasons? Williams would likely see this as reverting to the externalism he rejects. The obligation only gains practical traction if it becomes an internal reason.
      *   **Strategy 4: Focus on character and the "moral cost".** Williams was deeply concerned with integrity and the potential *moral cost* to an agent of ignoring suffering, even if they technically have no "reason" to act. While not a "rational error," indifference might reflect a *poorly lived life* or a *corrupted character*. The magazine piece could explore this: demanding morality might be less about proving rational errors and more about cultivating S-sets where helping is internal, and highlighting the personal/moral degradation of indifference.

  **Conclusion for Your Article:**

  *   **Correct your summary:** Williams' "internal" reasons stem from the agent's *entire subjective motivational set* (desires, values, commitments, character) via *sound deliberation*. It's not reducible to crude self-interest or existing "wants."
  *   **His skepticism targets external reasons:** He argues reasons *cannot* exist utterly independent of the agent's motivational constitution. Abstract duties, by themselves, don't generate reasons.
  *   **Implications for demanding morality (like EA):** It directly challenges justifications relying *solely* on impartial logic or abstract duties binding regardless of motivation. It suggests you cannot convict the *genuinely* indifferent person (one with no deliberative route from their S to helping) of a *rational error* for inaction.
  *   **But it doesn't eliminate demanding obligations:** You can still argue:
      *   Most people *do* have elements in their S that, via deep, sound deliberation, lead to reasons for demanding impartial action (internal route).
      *   Indifference, while perhaps not *irrational* for some, might represent a profound *moral or characterological failing*.
      *   The focus should be on *cultivating* motivational sets where helping distant strangers is an internal reason, rather than asserting external duties.

  Williams forces a crucial question: **Can demanding impartial morality be shown to be a requirement *of our own practical identities*, rather than an abstract demand imposed from outside?** Answering *that* question is the real challenge for proponents of demanding morality within a Williams framework. Your article can powerfully explore this tension.
