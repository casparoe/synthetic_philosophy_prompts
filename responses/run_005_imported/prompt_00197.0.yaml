prompt: |-
  So I was reading about Hofstadter's idea of superrationality (the thing where in a one-shot prisoner's dilemma, if you assume the other player reasons exactly like you, you should both cooperate cuz whatever logic you use, they use too). That part kinda makes sense to me in the "perfect clone" case. But then I started wondering what happens when the two players aren't exact copies of each other, just... similar-ish reasoners, like two different people who both took the same decision theory class or whatever. Does the whole argument just fall apart, or is there some watered-down version of superrationality that still gives you a reason to cooperate even without perfect symmetry?

  Also my friend said this is basically related to evidential decision theory and "correlation" between agents' choices, but I don't totally get how you're supposed to measure that correlation or why it's supposed to give you a real reason to act different than a normal rational/Nash equilibrium analysis would. Can someone break down the actual mechanics of why imperfect similarity between agents still might justify cooperation, and where the argument gets shakier the less alike the agents are? Not looking for just the standard "twin prisoner's dilemma" explanation, I've read that like 5 times already lol, more interested in the edge cases.
