prompt: |-
  I mostly write about science for a general-interest outlet, but I run a semi-regular side series where I talk to people about the philosophical writing of scientists nobody thinks of as philosophers, and next month's subject is Émilie du Châtelet -- specifically the "Discourse on Happiness," the short, half-private essay on ethics she wrote a couple of years before she died, around the same time she was racing to finish her Newton translation. My guest is a historian of philosophy who's just published a study arguing the essay deserves to be read as a real, worked-out ethics rather than the charming curio it usually gets filed under next to the "brilliant, tragic marquise" capsule bio. I hadn't actually read it properly until she sent me an English translation last week, and honestly that capsule bio undersells how strange and personal the actual argument is -- the stuff on gambling, on needing illusions, on handing out totally different rules to men and women for pursuing love. I want the conversation to get into that texture rather than sitting at the level everybody already knows going in.

  Could you draft me eight or nine interview questions? I need at least one that really presses on the tension between du Châtelet's Enlightenment-style commitment to stripping away prejudice and illusion, and her insistence elsewhere that happiness actually requires cultivating illusions -- about love, about the importance of your own projects -- so don't let my guest off the hook with some too-convenient redefinition of "illusion" that just dissolves the problem. I need one built around the gambling material specifically: du Châtelet was a famously reckless gambler in real life, and the essay reads in places like a general theory built to justify her own temperment, so push on whether this is really autobiography dressed up as ethics. And I need one on the strikingly different advice she hands out to women versus men about pursuing love, given the reputational risk she says falls on women alone -- ask whether that's shrewd non-ideal theorizing about the world as it actually was, or just a dressed-up capitulation to a double standard she otherwise had every reason to resent. For each of those three, give me a line on the answer my guest is most likely to give plus a sharper follow-up question for if she actually gives it, so I'm not stuck live with nothing to come back with.
