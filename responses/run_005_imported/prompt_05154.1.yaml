  ## The Unfastening

  The rain hadn’t stopped for three days. It drummed a relentless, grey rhythm against Leo’s kitchen window as he filled the electric kettle. Plug in. Switch on. The familiar red glow. *Cause: electricity flowing through the element. Effect: water heats. Steam rises. Kettle clicks off.* Simple physics. Predictable as sunrise. He leaned against the counter, waiting for the boil, the comforting ritual a bulwark against the damp chill and the lingering unease from his grandfather’s ICU vigil weeks before. His aunt’s serene conviction – *God’s hand, not the paddles* – had felt like a pebble in his mental shoe ever since.

  He poured the water over the teabag. Steam billowed, carrying the scent of bergamot. He stirred, watching the colour bloom. *Cause: hot water extracting compounds. Effect: tea.* He lifted the cup, feeling its warmth seep into his palms. He took a sip.

  It was cold.

  Not lukewarm. *Cold*. Like water straight from the tap. He frowned, touched the kettle. Its metal sides radiated fierce heat. He touched the water inside the kettle – scalding. But the water in his cup, poured mere seconds ago? Tepid. He stared at the cup, then the kettle, then back. A tiny, absurd disconnect. A skipped beat in the universe’s metronome. He poured another splash from the kettle into the sink. Steam hissed violently. *That* water was boiling. The water in his cup remained stubbornly, impossibly cold.

  He dumped the cup, poured fresh water from the kettle, watched the steam curl. He dipped a finger. Burning. He poured it into a fresh cup. Waited five seconds. Dipped his finger again. Cold.

  Leo felt a coldness of his own spread from his stomach. Not fear, exactly. A vertigo. Like standing on solid ground that suddenly revealed itself as a thin sheet of ice over an abyss. He unplugged the kettle, plugged it back in. The red light glowed. He poured a third cup. Watched the steam vanish unnaturally fast. Touched it. Cold.

  *Impossible.* The word echoed uselessly. Physics didn’t do ‘impossible’ like this. Water didn’t forget how to be hot just because it crossed the threshold of a mug. Unless… unless the heat wasn’t *in* the water at all? Unless the connection between flame (or element) and heat wasn’t a chain forged by nature, but… a gesture? A habit? His aunt’s words, amplified by his friend’s excited lecture on Ghazālī, roared back: *no necessary connection… created directly at each instant… habitual custom…*

  He needed to get out. The kitchen felt suddenly hostile, its reliable objects harbouring secrets. He grabbed his keys, shrugged on his coat. The familiar weight of the Yale key in his hand. *Cause: key inserted, turned. Effect: lock disengages. Door opens.* A fundamental pact with reality. He fitted the key into the deadbolt. Turned it clockwise with practiced ease.

  The key snapped. Cleanly. Just below the head. The serrated end remained jammed in the lock. Leo stared at the smooth, broken shaft in his hand, then at the trapped metal in the lock. No resistance. No grinding. Just… a clean snap, as if the metal had momentarily forgotten its tensile strength. As if the act of turning *could* have succeeded, but this time, the usual consequence – the lock yielding – simply wasn’t supplied.

  Panic, thin and sharp, pricked him. He fumbled for his phone, called Sam, his partner. "Key broke. In the lock. Can you…?"

  Sam arrived twenty rain-soaked minutes later, expertly extracting the broken piece with pliers. "Cheap metal," Sam declared, wiping rain from his forehead. "Happens. Especially in the cold. You okay? You look pale."

  Leo forced a smile. "Just… the kettle was weird earlier. Water went cold instantly."

  Sam chuckled, heading for the kettle. "Old thing’s probably on the blink. We should replace it." He filled it, plugged it in. The red light glowed. Sam poured two cups when it boiled. Steam rose. Leo watched, heart pounding. He touched his cup. Hot. Properly hot. Sam sipped his. "See? Fine now. Probably a glitch. Bad contact or something."

  But Leo knew. He *knew* the kettle hadn’t been unplugged. He *knew* the water had boiled. The coldness hadn’t been a malfunction; it had been an *absence*. An instance where the usual consequence failed to materialize. Like his grandfather’s heart refusing to restart *despite* the voltage, until… until something else decided it should.

  That night, the disorientation deepened. Lying beside the softly snoring Sam, Leo stared at the ceiling. The rain’s rhythm, once comforting, now felt like the ticking of a clock counting down moments of precarious stability. What if the ceiling fan, whirring gently above, simply… stopped holding itself up? Not broke. Just ceased to *be* held. What if the air forgot to carry sound? What if the bed, in the next instant, forgot how to support their weight? Gravity wasn't a law; it was a custom. A very persistent custom, granted, but a custom nonetheless. Enforced not by necessity, but by… what? Habit? Will?

  He thought of the kettle. The key. The defibrillator paddles. *The same shock at the same voltage would have accomplished nothing at all.* His aunt’s certainty wasn’t blind faith; it was an acknowledgement of utter contingency. The world wasn’t a machine; it was a performance. Moment by moment.

  The next morning, making coffee, Leo hesitated before flipping the machine’s switch. His finger hovered. What *would* happen? Would the water heat? Would the pump engage? Or would nothing occur? Or something else entirely – the machine singing opera, the coffee turning to stone? The potentialities felt terrifyingly infinite. He flipped the switch. The machine gurgled obligingly. Dark liquid dripped into the carafe. Relief warred with a profound unease. It had worked. *This time.*

  He sat at the table. Sunlight, weak but real, streamed through the window, illuminating dust motes dancing in the air. *Cause: sunlight? Effect: illumination?* Or was the light simply *appearing* on the table, synchronized with the sun’s position, but not truly *caused* by it? The dust motes – were they buffeted by air currents, or were their paths drawn anew each instant, mimicking the pattern of currents?

  He picked up his coffee mug. It felt solid, real. But was its solidity an inherent property, or a consistent gift? Could the ceramic, in the next heartbeat, decide to become permeable? To dissolve? To turn into feathers? The idea wasn’t ludicrous anymore; it was a genuine, chilling possibility lurking beneath the skin of the habitual.

  He went to sit in his favourite armchair. He lowered himself slowly, testing its reality. It held. But the trust was fractured. He couldn’t *rely* on it, not truly. He could only hope the habit held. Like hoping a train schedule remains unchanged, knowing full well the conductor could alter it on a whim.

  Sam bustled in, grabbing his own coffee. "Big presentation today. Wish me luck!" He leaned down, kissed Leo’s forehead. The kiss felt warm, real. But even this – the pressure, the affection – was it a direct consequence of Sam’s intention and movement, or… a separate event, harmonized? Could Sam intend a kiss, move to deliver it, and Leo feel… nothing? Or a slap? Or the scent of roses?

  "Good luck," Leo managed, his voice tight.

  Sam paused, sensing something. "You sure you're okay? Still rattled by the key?"

  Leo looked at Sam, at his familiar, concerned face. He looked at the coffee, steaming reliably. He looked at the sunlight holding the dust motes in its beam. It all looked so *ordinary*. So dependable.

  "Yes," Leo lied, forcing a smile that felt like cracking ice. "Just tired. Go nail your presentation."

  Sam left. The door clicked shut. *Cause: latch mechanism engaging. Effect: door secured.* Or was it? Leo stared at the closed door. He knew, with a certainty that hollowed him out, that the latch being thrown didn't *make* the door secure. It was merely the occasion. The security, like the heat, like the solidity of the chair, like the very connection between intention and action, was a gift. Renewed, or withheld, moment by infinitesimal moment. Sustained by a custom vast and deep, but fundamentally arbitrary.

  The rain had stopped. Outside, the world dripped and glistened, performing its usual morning routines. Leo sat in his chair, not reading, not thinking, just *being*. Waiting. Not for anything specific. Just waiting for the next instant, and the one after that, each a precarious arrival, utterly disconnected from the last, held together only by the fragile, terrifying thread of divine habit. He reached for his coffee. It was already cold.
