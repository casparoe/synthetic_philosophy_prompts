answer: |-
  The river valley knew only two kinds of rain: too little, or too much. Tomas and Silas, brothers by bond deeper than blood, farmed adjacent strips of land where the river’s silt ran rich but fickle. This season, a trader from beyond the mountains offered sacks of pale, waxy seeds. "Drought-resilient," he claimed. "One sack yields, in good rain, enough grain for ten. In bad rain... maybe enough for two."

  Tomas did the figures on a sun-baked stone. "Listen, Silas. Good rain, ten sacks back. Bad rain, two. Even odds, the trader says. So, average yield: six sacks per sack planted. That’s profit! Planting a whole sack nets you *on average* six times your seed!"

  Silas ran a calloused thumb over the strange seeds. "Six times *on paper*, Tomas. But the rain isn't average. It falls, season after season."

  "Exactly!" Tomas grinned, already envisioning overflowing granaries. "We plant heavy *every* season. Compound the gain! In a few years, we’ll own the valley."

  Silas frowned. "Plant heavy... but not the whole sack. Not every time."

  Tomas stared. "Why starve ourselves of gain? It’s a fair bet tilted *for* us!"

  The first season, skies blazed blue. Tomas planted his entire precious store of the new seed – three sacks – into meticulously plowed furrows. Silas planted only half a sack of the waxy seeds, scattering the rest of his field with hardy, familiar barley that yielded reliably, if modestly.

  Harvest came. Good rain. Tomas’s fields exploded. He hauled in thirty sacks of the new grain, a king’s ransom. Silas harvested five sacks of the new grain and a modest haul of barley. Tomas clapped Silas on the back, his granary groaning. "See? Six times average! Told you! Next season, I plant *all* thirty!"

  Silas watched clouds gather on the horizon, distant and grey. "A fraction, Tomas. Just a fraction."

  The second season brought fitful showers. Tomas planted thirty sacks, confident. Silas planted three sacks of the waxy seed and more barley.

  Harvest was lean. Bad rain. Tomas’s vast fields yielded only sixty sacks – barely two per sack planted. His granary, though still fuller than Silas’s, felt hollow compared to his expectations. Silas got six sacks from his three planted. Modest. Steady.

  "Bad luck!" Tomas declared, brushing dust from his tunic. "But the average still holds! Sixty sacks? That’s... well, it’s still more than I started with two seasons back! Next year, *sixty sacks planted*. The law of averages *demands* a good year!"

  Silas felt a cold knot in his stomach. "Tomas... the law you quote lives in the trader's ledger, not in these fields. Plant less. Hold back seed."

  "Hold back *gain*?" Tomas laughed, a sharp, brittle sound. "You’re leaving wealth in the ground, Silas! Playing small while the prize is there for the taking!"

  The third season dawned dry. Cruelly dry. Weeks stretched into months under a relentless sun. Tomas’s sixty sacks vanished into the thirsty earth. Silas planted only six sacks of the waxy seed, the rest barley struggling against the drought.

  The harvest was a funeral. Bad rain. Tomas walked his fields, boots kicking up puffs of dust where stalks should have stood. Sixty sacks planted. Yield: one hundred and twenty sacks? The arithmetic dream. Reality: parched earth yielded barely one sack per ten planted. Six sacks. A pitiful return for his vast gamble. His granary, once brimming, now echoed.

  Silas’s barley had withered, but his six sacks of waxy seed, stressed but alive, yielded twelve sacks. Enough, barely, combined with the withered barley, to see him and his family through the winter. Lean, but alive.

  Tomas stood at the edge of his brother’s field, watching Silas carefully store the twelve sacks. His own fields were a wasteland. The arithmetic average – six times gain! – echoed mockingly in his mind. It had been correct. Every single sack planted, *on average*, across all possible seasons, should have yielded sixfold. He had taken the rational bet, the positive expectation, every single time. He had averaged across countless imaginary seasons in his ledger.

  But the rain didn’t fall on ledgers. It fell on Tomas. Once. Only once. Season after season after season, compounding not his wealth, but his exposure. The devastating multiplier of loss on his entire, ever-growing stake.

  Silas didn’t say, "I told you so." He offered Tomas a share of the stored grain, his face etched with a weary understanding Tomas couldn't yet grasp. Tomas looked from his brother’s guarded, persistent store to his own empty granary, then out at the vast, silent expanse of his own barren fields. The arithmetic was flawless. The ruin was absolute. The valley held its breath, waiting for the next season's rain, and the next bet. Silas picked up a single waxy seed, rolling it thoughtfully between his fingers, already calculating not the average gain, but the cost of vanishing entirely.
