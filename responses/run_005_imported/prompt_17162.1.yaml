answer: |-
  ## MEMORANDUM  
  TO: Members of the [River Name] Compact Commission  
  FROM: [Your Name], Public Member  
  DATE: October 26, 2023  
  SUBJECT: Recommendation on Permanent Shortage-and-Surplus-Sharing Protocol  

  ### Background
  After a decade of declining snowpack, the fixed-percentage allocation established in the 1950s is no longer sustainable. The Economics Subcommittee has commendably developed two proposed formulas to dynamically allocate the river's flow based on annual water availability. Both formulas use the pre-compact diversions (what each state was *actually* taking) as the foundation ("disagreement point"). They differ significantly in how they handle each state's court-adjudicated maximum entitlement ("paper rights").

  1.  **Kalai-Smorodinsky (KS) Approach:** Uses entitlements as the "ideal point." Any annual change in total river flow (increase or decrease) is allocated proportionally to how much each state's *entitlement exceeds their pre-compact diversion*.  
      *   **Practical Effect:** If State A's entitlement is much larger than its pre-compact use, and State B's entitlement is only slightly larger, State A gets a larger share of any surplus (or bears a larger share of any shortage) year-to-year.
      *   **Key Argument:** Ensures "monotonicity" – a state never receives *less* water in a *wetter* year purely because the *other* state's entitlement increased via litigation. It respects the legal framework established by the courts.

  2.  **Nash Bargaining Solution (Nash) Approach:** Ignores entitlements entirely. Maximizes the product of each state's gain over pre-compact diversions.  
      *   **Practical Effect:** Any annual change in total river flow is split *equally* (50/50) between the states, regardless of their court-adjudicated entitlements.  
      *   **Key Argument:** Provides "independence of irrelevant alternatives" (IIA) – the allocation depends *only* on the disagreement point (pre-compact use) and the total water available. It removes any incentive to relitigate entitlements to gain future advantage under the sharing rule, ensuring long-term stability.

  ### The Core Tradeoff: Fairness Today vs. Stability Tomorrow
  The choice hinges on how we value two competing principles, both crucial but difficult to maximize simultaneously:

  1.  **Respecting Past Litigation & Ensuring Yearly Fairness (KS Strength):** The KS rule explicitly incorporates the outcomes of costly, lengthy court battles that defined maximum entitlements. Its proponents argue that ignoring these legal determinations is fundamentally unprincipled and disrespects the judicial process. Furthermore, KS guarantees "monotonicity." This means:
      *   **No Penalty for Others' Paper Gains:** If State B wins a court case expanding its *paper* entitlement in Year X, and Year X+1 is a wet year, State A is guaranteed *not* to receive *less* water in Year X+1 than it would have before State B's court win. Its share can only increase or stay the same relative to the total available water in that wetter year. This protects a state from being disadvantaged year-to-year by the other state's legal maneuvers.

  2.  **Preventing Future Litigation & Ensuring Protocol Stability (Nash Strength):** The Nash rule's strongest argument is its focus on long-term behavioral incentives and protocol durability. By making the allocation completely independent of entitlements (an "irrelevant alternative" once the rule is set), it severs the direct link between courtroom victories and future water shares under the sharing protocol.
      *   **Removing the Incentive to Litigate:** Under KS, if State A believes it can get a larger entitlement through litigation, it knows this will automatically give it a larger share of *every future surplus* (or a smaller share of *every future shortage*). Similarly, State B is incentivized to litigate defensively to prevent State A from gaining this permanent advantage. This creates a perpetual incentive for both states to challenge entitlements, leading to continuous legal conflict, uncertainty, and potential protocol breakdown. Nash eliminates this incentive – a court ruling changing an entitlement has *no effect* on the annual allocation split under the protocol. Litigation becomes far less strategically useful.

  ### Recommendation: Adopt the Nash Bargaining Solution with a Sunset Review Clause
  **I recommend the Commission adopt the Nash Bargaining Solution as the core allocation formula, coupled with a mandatory review after 10 years.**

  #### Rationale
  1.  **Long-Term Stability is Paramount:** The primary goal of this new protocol is to create a durable, predictable framework for sharing a volatile resource over decades. The most significant threat to this durability is the incentive structure embedded within the protocol itself. KS, by design, makes entitlements directly relevant to annual allocations. This creates a powerful, ongoing incentive for both states to invest in litigation to inflate their entitlements, knowing any win translates directly into future water gains (or loss mitigation). This risks perpetual legal warfare, draining resources and undermining cooperative management. Nash's "independence" from entitlements is the superior mechanism for ensuring the protocol's stability over the coming decades by removing this destabilizing incentive.
  2.  **Simplicity and Predictability:** The equal split of changes (50/50) is simple to understand, administer, and explain to water users. It provides clear, predictable outcomes year-to-year based solely on measurable hydrology and the fixed baseline.
  3.  **Addressing the Fairness Concern (and the KS Strength):** The criticism that Nash ignores legal entitlements is serious and valid. However, the pre-compact diversion baseline itself reflects a historical reality shaped by prior uses and legal understandings. Nash respects this tangible starting point. Furthermore, the **Sunset Review Clause** (recommended below) directly addresses the potential unfairness of permanently ignoring entitlements and accounts for hydrological uncertainty. It allows for reassessment based on real-world experience and evolving conditions.
  4.  **Monotonicity Tradeoff is Manageable:** While KS's guarantee against a state losing out in a wet year due to the other's *paper* entitlement increase is theoretically appealing, the *practical likelihood* of this specific scenario causing significant harm is arguably lower than the *certain instability* introduced by KS's litigation incentive. The real harm from endless litigation is far more probable and damaging to all water users.

  #### Strong Version of the Counterargument (KS Proponents)
  Proponents of Kalai-Smorodinsky offer a powerful critique: The courts have spoken. These entitlements represent the highest legal determination of each state's rightful claim on the river, established through exhaustive, lawful process. To simply discard them in the allocation formula is to disrespect the rule of law and the judicial system. Furthermore, the KS rule provides a crucial guarantee: no state will ever be penalized with less water in a plentiful year simply because the other state managed to inflate its paper rights. This "monotonicity" is a fundamental principle of fairness – your outcome should improve when the overall pie grows, regardless of what happens to irrelevant alternatives. Ignoring entitlements may seem expedient for stability now, but it builds the protocol on a foundation that disregards legal rights, potentially eroding trust and legitimacy over time. Stability achieved by ignoring the law is brittle.

  #### The Hybrid: Sunset Review Clause
  To incorporate the valid concerns about ignoring legal entitlements long-term and to account for profound hydrological uncertainty, I propose embedding a **mandatory review clause**:
  *   "This allocation protocol, based on the Nash Bargaining Solution, shall remain in effect for a period of ten (10) years from its implementation. In the ninth year, the Commission shall undertake a comprehensive review of the protocol's performance, considering:
      *   Hydrological trends and climate science updates.
      *   The practical impacts of allocation on water users in both states.
      *   The status of court-adjudicated entitlements.
      *   The stability of interstate cooperation under the protocol.
      *   The need for continued adherence to the chosen formula or potential modification, including consideration of alternative approaches like Kalai-Smorodinsky based on the experience gained.
      *   The Commission shall vote on whether to renew the protocol unchanged, modify it, or adopt a new framework before the end of the tenth year."

  This clause respects the need for immediate stability (Nash) while acknowledging the legitimacy of legal entitlements and the reality of changing conditions by ensuring a structured, future reevaluation point.

  ### Conclusion
  The Nash Bargaining Solution, supplemented by a 10-year sunset review, offers the best path forward. It prioritizes the long-term stability and cooperative management essential for navigating an uncertain hydrological future by eliminating the perverse incentive for endless entitlement litigation. While it sets aside current paper entitlements for the allocation calculation, it does so not out of disrespect for the law, but out of a pragmatic necessity to protect the protocol itself from self-destructive legal conflict. The sunset clause ensures that this significant decision is revisited with the benefit of experience and updated knowledge, allowing entitlements and other factors to be formally reconsidered at that time. I urge the Commission to adopt the Nash-based protocol with the proposed review mechanism.
