answer: |-
  The issue here revolves around a misunderstanding of how to maximize wealth in a repeated bet with a positive expected return per round. Let's break down the key points to clarify who is thinking correctly.

  ### The Bet and Expected Value
  - In this bet, you win 55% of the time and double your stake (a 100% gain), but lose 45% of the time (a 100% loss of the staked amount).
  - The expected return per dollar bet is:  
    \( (0.55 \times 2) + (0.45 \times 0) = 1.10 \),  
    meaning a 10% positive expected return per bet. This is why your first friend argues that betting 100% of your bankroll each round maximizes expected value—after \( n \) rounds, the expected bankroll is \( B_0 \times (1.10)^n \), which grows fastest when you bet the entire bankroll (fraction \( f = 1 \)).

  However, this focus on expected value alone is flawed for repeated betting because it ignores the risk of ruin (going bust) and the volatility of outcomes. When you bet 100%:
  - If you lose any single bet (45% chance per round), your bankroll drops to zero and you're out of the game.
  - Even though the expected value is high, the probability of eventually going bust approaches 100% as you play more rounds. For example:
    - After 10 rounds, the probability of not being bust (winning all 10) is only \( (0.55)^{10} \approx 0.0025 \), or 0.25%.
    - After 20 rounds, it drops to about 0.00006%, meaning ruin is almost certain.
  - Your experience of going bust twice aligns with this—it's not just "bad variance" but a near-certain outcome over time. The high expected value comes from the tiny chance of winning many times in a row, but this is not a practical strategy for sustained growth.

  ### The Kelly Criterion: Optimal Long-Term Growth
  For repeated bets, the goal should be to maximize the long-term growth rate of wealth, not just expected value. This is where the Kelly criterion comes in:
  - The Kelly criterion maximizes the expected logarithm of wealth growth, which is equivalent to maximizing the long-term exponential growth rate of your bankroll.
  - For this bet (where you double your stake on a win or lose it on a loss), the optimal fraction to bet is \( f^* = 2p - 1 \), where \( p \) is the win probability.
    - Here, \( p = 0.55 \), so \( f^* = 2 \times 0.55 - 1 = 0.10 \), or 10% of your bankroll.
  - Betting 10% per round:
    - On a win, your bankroll grows to \( 1 + f = 1.10 \) times its current value.
    - On a loss, it shrinks to \( 1 - f = 0.90 \) times its current value.
  - The expected log growth per round is positive:
    \[
    g(f) = p \log(1 + f) + (1 - p) \log(1 - f)
    \]
    For \( f = 0.10 \):
    \[
    g(0.10) = 0.55 \times \log(1.10) + 0.45 \times \log(0.90) \approx 0.55 \times 0.0953 + 0.45 \times (-0.1054) \approx 0.005 > 0
    \]
    This positive growth rate means your wealth increases exponentially over time with minimal risk of ruin.
  - In contrast, betting 100% (\( f = 1 \)):
    \[
    g(1) = 0.55 \times \log(2) + 0.45 \times \log(0) = 0.55 \times 0.693 + 0.45 \times (-\infty) = -\infty
    \]
    The expected log growth is negative infinity, meaning ruin is almost guaranteed in the long run.

  ### Why Your Second Friend's Strategy Works
  - Your second friend bets about 10% of her bankroll per round, which matches the Kelly fraction. This strategy:
    - Avoids ruin: Even after a loss, she retains 90% of her bankroll and can continue playing.
    - Achieves steady growth: The bankroll grows at an optimal rate with reduced volatility. Over time, this compounds, leading to reliable increases, as you've observed.
    - Is mathematically optimal: For repeated bets, Kelly betting maximizes the median wealth, minimizes the time to reach a given wealth goal, and balances growth with risk management. After many rounds, the probability of outperforming other strategies (like betting 100%) approaches 100%.

  ### What's Wrong with Your First Friend's Reasoning?
  - **Focus on expected value only**: Betting 100% does maximize expected bankroll after any fixed number of rounds, but this is irrelevant in practice because:
    - Expected value is heavily skewed by extreme outcomes (e.g., a 0.25% chance of massive wealth vs. 99.75% chance of zero after 10 rounds). The typical (median) outcome is zero.
    - For repeated play, you care about compounded growth over time, not just one-off expectations. High volatility (from large bets) erodes long-term growth due to the risk of ruin.
  - **Ignoring risk of ruin**: Your first friend dismisses your busts as "bad variance," but with a 45% chance of ruin per bet, it's a structural flaw, not bad luck. Variance isn't the issue—the asymmetric risk of losing everything is.
  - **Leaving money on the table?**: Your first friend claims that betting less than 100% is "overly cautious," but betting more than the Kelly fraction (like 100%) actually reduces long-term growth. For example:
    - Betting 20% (double Kelly) gives a negative expected log growth:  
      \( g(0.20) = 0.55 \times \log(1.20) + 0.45 \times \log(0.80) \approx -0.00014 < 0 \),  
      meaning wealth tends to decline.
    - Betting 10% yields positive growth without unnecessary risk.

  ### Conclusion
  - **Your second friend is thinking correctly**: By betting approximately 10% of her bankroll per round, she is using the Kelly-optimal strategy for long-term wealth growth. This approach ensures she benefits from the positive expected return while minimizing the risk of ruin, resulting in steady gains.
  - **Your first friend is mistaken**: Betting 100% maximizes short-term expected value but ignores compounding and ruin risk, making it a poor strategy for repeated play. Your busts were not due to variance but to the near-certain outcome of the strategy.
  - **Recommendation**: For repeated favorable bets, always use the Kelly fraction or a conservative variant (like half-Kelly) to protect against risk. Betting 100% is only rational for a one-time bet if you can absorb the loss—but not for ongoing play.
