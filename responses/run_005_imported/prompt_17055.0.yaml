prompt: |-
  I'm drafting a historical novel built around a conspiracy to assassinate a tyrannical prince, and two beta readers -- one a lapsed seminarian, the other a lawyer with a weakness for medieval history -- got into a running argument in the manuscript's margin comments over whether my conspirators could plausibly invoke Aquinas the way I have them do in the scene. I'm passing the exchange along because I honestly can't settle it myself, and neither of them will let it drop.

  She argued that Aquinas gives them cover: in the Summa he says that disturbing a tyrant's rule is not sedition, since a regime aimed at the ruler's private advantage rather than the common good was never a rightly ordered government to begin with, so unmaking it cannot be a sin against order. He answered that this is true but beside the point for my scene, since that passage is usually read as licensing collective or public removal of a tyrant, not one man's knife -- and that in On Kingship, discussing exactly the case of a legitimately established ruler who curdles into cruelty, Aquinas is conspicuously wary of private initiative, warning that letting individuals judge for themselves who counts as a tyrant only invites ambitious men to murder decent rulers under that pretext. She replied that the line between a usurper and a legitimate ruler gone bad cannot be doing much work, since the subjects suffer identically either way, and a doctrine more concerned with a ruler's paperwork than his subjects' welfare is not one Aquinas could seriously have intended. He came back that Aquinas's worry was never welfare versus paperwork but who gets to act as judge in his own case, and that worry does not dissolve just because, in a given instance, the abuse happens to be real.

  Could you go through their exchange move by move, say who has the better of it at each step -- not just who wins overall -- and note anything about Aquinas's actual position that both of them seem to be missing?
reasoning: |-
  Okay, the user is working on a historical novel involving a conspiracy to assassinate a tyrant, and two beta readers are debating whether Aquinas would justify such an act. The seminarian argues that Aquinas's views on tyranny provide cover for the conspirators, while the lawyer contends that Aquinas only supports collective action, not private assassination. The user wants me to analyze each step of their argument, determine who has the better point at each stage, and identify any misunderstandings of Aquinas's position.

  First, I need to recall Aquinas's actual teachings on tyranny. In the Summa Theologiae (II-II, q.42, a.2), he distinguishes between sedition against just rule (sinful) and resisting tyrannical rule (not sedition). However, in De Regno (On Kingship), he explicitly warns against private individuals assassinating tyrants. The key tension here is between the legitimacy of resisting tyranny versus the proper authority to do so.

  Looking at the seminarian's first point: she correctly cites Aquinas's view that disturbing a tyrant's rule isn't sedition because such a regime lacks legitimacy. But she misses Aquinas's emphasis on authority - he's talking about public resistance, not private action. The lawyer counters this effectively by pointing to De Regno's caution against private judgment. Here the lawyer has the stronger argument because he addresses the mechanism of removal.

  The seminarian's rebuttal about suffering being identical under usurpers or legitimate-turned-tyrants is emotionally compelling but theologically incomplete. Aquinas does distinguish between these cases in De Regno regarding the means of removal. The lawyer's response about "who judges" hits Aquinas's core concern about decentralized judgment. This gives the lawyer another point.

  Both miss some nuances: Aquinas does allow extreme individual action if no public remedy exists and the tyrant has no claim to legitimacy, but this is his last resort position. They also overlook that for Aquinas, "public" action could include lower magistrates or nobles, not just the populace. The suffering argument oversimplifies Aquinas's view of political order.

  In the final analysis, the lawyer consistently has stronger textual support regarding Aquinas's warnings against private action. However, for novel-writing purposes, the conspirators could believably invoke Aquinas selectively - radicals often twist doctrines to fit their needs. The seminarian's interpretation, while less textually precise, reflects how historical actors might misapply philosophical justifications.
answer: |-
  Here's a move-by-move analysis of your beta readers' debate, evaluating their points against Aquinas's actual writings and identifying potential misunderstandings:

  **The Scene:** Conspirators invoke Aquinas to justify assassinating a tyrannical prince.

  **The Debate:**

  1.  **Her Move (Seminarian):** "Aquinas gives them cover: Summa (II-II, q.42, a.2) says disturbing a tyrant's rule isn't sedition because a regime for private advantage isn't rightly ordered, so unmaking it can't be a sin against order."
      *   **Accuracy:** She is *textually correct* about this specific passage. Aquinas *does* state that resisting a tyrant isn't the sin of sedition because the tyrant's rule is *already* a form of disorder against the common good.
      *   **Strength:** Strong opening. Provides a direct, relevant citation supporting the *principle* that tyranny can be legitimately resisted.
      *   **Who Has the Better?** **Her.** She establishes a valid foundation in Aquinas for resistance.

  2.  **His Move (Lawyer):** "True but beside the point. That passage licenses *collective or public* removal, not one man's knife. In *De Regno* (On Kingship, I, Ch. 6), discussing a legit ruler turned tyrant, Aquinas is wary of *private initiative*, warning that letting individuals judge invites murder of decent rulers under pretext."
      *   **Accuracy:** He is also *textually correct*. Aquinas's discussion in the Summa is abstract and focuses on the *nature* of the regime. In *De Regno*, specifically addressing the "good king turned tyrant," Aquinas *explicitly* condemns private assassination: "Therefore not only is this [private assassination] the method of delivering a kingdom not to be *followed*; it ought not even to be *countenanced*... [I]t is dangerous both for the multitude and for their rulers. For most of the latter become tyrannical... if the road lay open through which, at the will of the multitude, the king might be slain... Therefore the remedy against the wickedness of a tyrant is not to be sought through the presumption of some private person, but through public authority."
      *   **Strength:** Excellent contextualization. He shifts the focus from the *permissibility of resistance* to the *proper authority and method* for removal, directly addressing the novel's scenario (private assassination).
      *   **Who Has the Better?** **Him.** He successfully argues that her broad principle doesn't automatically sanction the *specific action* in the scene. He introduces Aquinas's core concern about the dangers of private judgment and vigilantism.

  3.  **Her Rebuttal:** "The line between usurper and legit ruler gone bad can't matter much because subjects suffer identically. A doctrine prioritizing 'paperwork' over welfare isn't one Aquinas could have intended."
      *   **Accuracy:** She highlights a genuine tension and moral intuition. Aquinas *is* deeply concerned with the common good and the alleviation of suffering.
      *   **Weakness:** This misrepresents Aquinas's concern. It's not about "paperwork" vs. welfare. Aquinas *agrees* the suffering is identical. His distinction is about *legitimacy of authority to act*. A usurper never had legitimate authority; a legitimate ruler gone bad *did*, and removing him requires a *legitimate authority* (e.g., the community via established mechanisms, superiors like the Pope/Emperor). Her argument risks conflating the *justification for removal* with the *authorization for a specific method* (private killing).
      *   **Who Has the Better?** **Him.** While her moral point is understandable, she sidesteps Aquinas's explicit reasoning in *De Regno*. Aquinas *does* make the distinction, not for bureaucracy's sake, but to prevent anarchy and the usurpation of public judgment by private individuals. His worry *is* the welfare of the community in the *long term*, which he believes is jeopardized by sanctioning private tyrannicide.

  4.  **His Counter:** "Aquinas's worry was never welfare vs. paperwork but *who gets to act as judge in his own case*. That worry doesn't dissolve just because the abuse is real in a given instance."
      *   **Accuracy:** This is a precise and powerful summary of Aquinas's core argument in *De Regno*. Aquinas fundamentally distrusts individuals acting as accuser, judge, jury, and executioner regarding the supreme magistrate, *even when the accusation is correct*. He fears the precedent and the chaos it invites ("ambitious men" using the pretext).
      *   **Strength:** Perfectly captures the essence of Aquinas's caution. It directly addresses her rebuttal by showing that the *reality* of tyranny doesn't automatically legitimize *any* means of removal, especially private, extra-judicial killing.
      *   **Who Has the Better?** **Him decisively.** He articulates the central Thomistic principle at stake: the danger of privatizing the judgment and execution of the highest political authority.

  **Overall Winner:** **The Lawyer.** He consistently provides the more nuanced and textually grounded interpretation relevant to the *specific act* of private assassination. He correctly identifies Aquinas's primary concern in *De Regno*: not *whether* a tyrant should be removed, but *how* and *by whom* it should be done to preserve order and avoid greater evils. The Seminarian correctly identifies the principle of legitimate resistance but fails to adequately grapple with Aquinas's specific and strong reservations about *private individuals* undertaking tyrannicide, especially against a ruler who began legitimately.

  **What Both Might Be Missing About Aquinas's Actual Position:**

  1.  **The Role of Lesser Magistrates/Public Authority:** Aquinas doesn't *only* mean "the whole populace" acting spontaneously. "Public authority" (*auctoritas publica*) in *De Regno* could include established mechanisms like a council of nobles, estates, or even inferior magistrates who hold legitimate authority derived *from* the community or a higher sovereign (like the Pope or Emperor in the medieval worldview). The conspirators *might* try to frame their plot as acting *for* this public authority if they represent a council or nobility, though Aquinas likely envisioned a more formal, judicial process.
  2.  **The "No Human Remedy" Loophole (Contentious):** While Aquinas strongly condemns private initiative as the *preferred* or *safe* method, he *does* leave a tiny, highly qualified opening in *De Regno*: "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." He then immediately adds the warning against private presumption. Some scholars argue that in the *absolute absence of any other human remedy* (no superior authority, no established mechanism for removal), Aquinas *might* reluctantly allow the community (not just an individual) to act. However, he *never* explicitly sanctions private assassination in this scenario. He focuses on deposition/restriction. This loophole is highly theoretical and not applicable to most contexts, especially one likely involving individuals acting secretly.
  3.  **The Primacy of the Common Good:** Both debaters touch on this, but Aquinas's entire political philosophy is anchored in the common good. *All* authority exists to serve it. Tyranny is the ultimate violation. Resistance is justified *because* it serves the common good. However, Aquinas believes that *how* resistance occurs must *also* serve the long-term common good, which requires order and legitimate authority. Private tyrannicide, for Aquinas, usually fails this test because of the precedent it sets.
  4.  **Distinction Between "Tyrant by Usurpation" vs. "Tyrant by Oppression":** Aquinas *does* make this distinction (especially in the Summa passage cited). Resistance against a usurper is generally easier to justify. However, his specific warnings against private action are most forcefully applied in *De Regno* to the case of the legitimately established ruler who *becomes* oppressive. This is the harder case, which is precisely why he addresses it in detail.

  **Implications for Your Novel:**

  *   **The Lawyer is Textually Stronger:** For strict Thomistic orthodoxy, your conspirators are on shaky ground invoking Aquinas to justify a *private assassination plot* against a ruler who was initially legitimate. Aquinas explicitly condemns this method.
  *   **The Seminarian Reflects a Plausible Radical Interpretation:** Conspirators, especially desperate ones, *would* latch onto the "resisting a tyrant isn't sedition" principle and downplay or ignore the specific caveats about method and authority. They might focus solely on the suffering and the end goal (common good) and argue that extreme circumstances demand extreme measures, dismissing the "who judges" concern as a luxury they can't afford.
  *   **Nuance is Key:** Your conspirators could *try* to argue they *represent* the public authority (e.g., "We act for the oppressed people/nobility"), or that there is *no other remedy* (though Aquinas remains skeptical of private action even then). They could also misinterpret or selectively quote Aquinas, focusing only on the Summa passage and ignoring *De Regno*.

  **Conclusion:** The Lawyer wins the debate on Thomistic grounds regarding the specific act of private tyrannicide against a legitimate ruler turned tyrant. However, the Seminarian captures the emotional and moral impulse that desperate individuals might use to *misapply* Aquinas, focusing on the ends while ignoring his profound concerns about the means and the dangers of privatizing judgment. Both miss some nuances of "public authority" and the extremely narrow potential loophole, but the core warning against the "one man's knife" in *De Regno* is clear and decisive for Aquinas.
