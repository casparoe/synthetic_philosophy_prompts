  ## Written Opinion for the Natural History Society Council: Fellowship & Conduct Committee Recommendation  
  **Re: Proposed Censure of Fellow [Fellow's Name] & Interpretation of "Conduct Unbecoming a Fellow"**  
  **From: [Your Name], Member, Fellowship & Conduct Committee**  
  **Date:** [Date before Thursday]

  **I. Introduction**  
  This opinion addresses the motion to censure Fellow [Fellow's Name] under By-law Section [X], prohibiting "conduct unbecoming a Fellow," specifically concerning her participation in a legally licensed hunt abroad. Having thoroughly examined the facts and the principles governing our Society, I recommend **against** censure. Further, I propose a principled interpretation of "conduct unbecoming" to guide future Committee deliberations, ensuring consistency and alignment with our Society's core purpose.

  **II. The Society's Role and the Limits of Its Authority**  
  The Natural History Society exists to advance the study, understanding, and conservation of the natural world through scholarship, education, and public engagement. Our Fellowship recognises distinguished contributions to these ends. While we rightly uphold high standards of professional and personal integrity *relevant to our mission*, we are neither a court of law nor a tribunal of private morality. Our authority over Fellows stems from their relationship to the Society's *work and standing*, not their private lives beyond it.

  **III. Defining "Conduct Unbecoming a Fellow": A Standing Interpretation**  
  The phrase "conduct unbecoming a Fellow" must be interpreted narrowly and purposefully to avoid arbitrary or capricious application. I propose the following standing definition for Committee use:

  > **"Conduct unbecoming a Fellow" constitutes:**
  > **1.  Conduct directly violating the Society's core scientific or conservation mission;** OR
  > **2.  Conduct causing demonstrable, significant harm to the Society's reputation, operations, or ability to fulfil its mission;** OR
  > **3.  Conduct involving illegality, dishonesty, harassment, discrimination, or professional misconduct directly related to the Fellow's engagement with the Society, its members, staff, students, or its work.**

  *   **Key Principles:** This definition requires a *direct and substantial nexus* between the conduct and the Society's functions or well-being. It excludes:
      *   Lawful private activities conducted entirely outside the Society's purview.
      *   Actions merely causing offense or disagreement based on personal or collective moral views unrelated to the Society's specific mission and operations.
      *   Actions lacking a demonstrable, harmful impact on the Society itself.

  **IV. Application to the Present Case**  
  Fellow [Fellow's Name]'s participation in the hunt:
  1.  **Was Legal:** Conducted under host-country law and specific permit.
  2.  **Had No Direct Nexus to Society Functions:** It did not occur during Society activities, involve Society resources, target Society research subjects, or relate to her duties as a Fellow. Her research record and conduct towards colleagues/students remain unimpeached.
  3.  **Lacks Demonstrable Harm to the Society:** While causing significant member upset and negative press, the *nature* of this harm must be scrutinized. The outrage stems from moral disapproval of her *private, lawful action*, not from an action damaging our scientific integrity, hindering conservation projects, misusing funds, harassing members, or falsifying research. The reputational impact flows from *association* with her private choice, not from any malfeasance *by the Society* or *in her role as a Fellow*.

  **Therefore, under the proposed definition, her conduct does not constitute "conduct unbecoming a Fellow."** Censure would constitute punishment for a private choice, not the enforcement of a standard tied to the Fellowship's purpose.

  **V. Engagement with the Opposing Argument (The Devlin Position)**  
  The Committee members advocating censure present a serious and coherent argument deserving of full consideration, rooted in the philosophy of legal moralism as articulated by Lord Devlin. Their core contention is powerful:

  *   **The Shared Morality Argument:** A society, including an association like ours, is fundamentally bound together by shared values and a common moral fabric. For the Natural History Society, a profound commitment to the *preservation and reverence for life*, especially endangered life, is argued to be this essential "cement." Tolerating actions by a Fellow that appear fundamentally antithetical to this core value – the deliberate killing of an endangered animal for sport, even if legal and purportedly conservation-funded – is seen as corrosive. It weakens the internal cohesion of the Fellowship, undermines the collective passion that drives our mission, and fatally compromises the Society's moral authority to advocate for conservation externally. To permit this, they argue, is to declare that our deepest shared principle is negotiable, rendering us hypocrites in the eyes of our members and the public, thereby destroying the very standing ("any standing to speak on these questions at all") that gives our conservation voice weight. The by-law's "conduct unbecoming" clause, they contend, is the legitimate instrument to defend this essential shared morality and the integrity of the collective body.

  **VI. Why This Council Should Reject the Censure Motion (Despite the Strength of the Opposing View)**  
  While acknowledging the sincerity and force of the shared morality argument, censure based *solely* on this ground is inadvisable and exceeds the Society's proper role for these reasons:

  1.  **The Slippery Slope of Moral Enforcement:** Adopting "shared moral outrage" as a standard for censure sets a dangerous precedent. Who defines this shared morality? Which private acts, however legal and unrelated to Society functions, might offend it next? Dietary choices? Travel habits? Political donations? This path leads to arbitrary, divisive, and intrusive policing of members' lives beyond our remit, replacing objective standards with subjective moral majoritarianism.
  2.  **Erosion of the Fellowship's Basis:** The Fellowship honours *contributions to natural history and conservation*. Making it contingent on adherence to a specific, undefined private morality (beyond basic legality and professional ethics) shifts its foundation from achievement to ideological conformity. This risks deterring diverse thinkers and reducing the Fellowship to a badge of moral purity unrelated to scholarly or conservation impact.
  3.  **Mission Drift and Reputational Risk (Paradoxical):** While proponents fear reputational harm from *inaction*, censuring a distinguished Fellow *for a lawful private act* arguably poses a greater, distinct reputational risk. It signals that the Society prioritizes policing private morality over its core scientific and conservation mission, potentially alienating members and collaborators who value intellectual freedom and institutional restraint. It transforms us from a learned society into a moral enforcer.
  4.  **The Hart Distinction (Harm vs. Offense):** H.L.A. Hart's crucial distinction is relevant. The *harm* principle focuses on preventing tangible damage to others or society's essential functions. The *offense* principle, invoked here, deals with causing outrage or disgust. Punishing solely for offense, especially concerning legal private acts, is a significant intrusion justified only by overwhelming necessity. The harm to the Society alleged here – weakened internal cohesion and moral authority – is indirect, stems from the *expression* of disapproval by *other members*, and is not equivalent to harm caused *by* the Fellow's action *to* the Society's operations or mission delivery. Tolerating diverse private views within a shared professional commitment is the hallmark of a robust, liberal institution.

  **VII. Recommendation & Conclusion**  
  For the reasons articulated above, the Fellowship & Conduct Committee should **recommend that Council REJECT the motion to censure or strip Fellow [Fellow's Name] of her Fellowship.** Her private, lawful actions, while deeply controversial and morally objectionable to many members, do not meet the threshold of "conduct unbecoming a Fellow" as it must be properly understood and applied by this Society.

  **Further, I formally propose that Council adopt the definition of "conduct unbecoming a Fellow" outlined in Section III of this opinion as the standing interpretation for future Committee deliberations.** This provides the necessary clarity, limits arbitrary application, and ensures our focus remains on conduct directly impacting the Society's mission and integrity, safeguarding both our standards and the legitimate private sphere of our distinguished Fellows.

  Respectfully submitted,

  [Your Name]  
  Member, Fellowship & Conduct Committee  
  [Your Fellowship Title, if applicable]
