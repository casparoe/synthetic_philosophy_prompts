answer: |-
  You're facing a classic game theory nuance, and your friend is correct: **pure-strategy dominance checks alone are insufficient for proper Iterated Elimination of Strictly Dominated Strategies (IESDS)**. Mixing strategies *can* dominate a pure strategy even when no single pure strategy does. This isn't a corner case—it's fundamental. Here's a clear breakdown:

  ### Why Pure Checks Fail: The Core Issue
  - **Strict dominance** requires that a strategy **always** yields a worse payoff than the dominating strategy(ies), *regardless of opponents' actions*.
  - A pure strategy might be "locally" competitive (beating others in some scenarios) but "globally" inferior to a blend. Mixing allows hedging against opponent moves, creating a robust strategy that no pure strategy can match in all cases.

  ### Concrete Example: The Game Where Mixing Matters
  Consider this **2-player, 3x2 game** (Player 1: rows; Player 2: columns). Payoffs are for Player 1 (Player 2's payoffs are irrelevant for dominance checks on P1):

  |          | **L** | **R** |
  |----------|-------|-------|
  | **A**    | 4     | 0     |
  | **B**    | 0     | 4     |
  | **X**    | 1     | 1     |

  #### Step 1: Check Pure Dominance for X
  - **A vs X**:  
    - If P2 plays L: A (4) > X (1) → A wins  
    - If P2 plays R: A (0) < X (1) → X wins  
    → A *does not* dominate X (fails in R).  
  - **B vs X**:  
    - If P2 plays L: B (0) < X (1) → X wins  
    - If P2 plays R: B (4) > X (1) → B wins  
    → B *does not* dominate X (fails in L).  

  **Pure conclusion**: X isn't dominated by A or B alone. Your current solver would keep X.

  #### Step 2: Check Mixed Dominance
  Now consider a **50/50 mix of A and B**:  
  - **Expected payoff vs L**: \(0.5 \times 4 + 0.5 \times 0 = 2\)  
  - **Expected payoff vs R**: \(0.5 \times 0 + 0.5 \times 4 = 2\)  
  - **Compare to X**: X gets 1 in *both* cases.  

  → **2 > 1** against L *and* R.  
  **Mixed conclusion**: The mix of A and B **strictly dominates X** (higher payoff no matter what P2 does).

  ### Why This Matters
  - **X is strictly dominated** in the full IESDS sense. Failing to eliminate it leaves a suboptimal strategy in the game.  
  - **Real-world analogs**: This mirrors scenarios like:
    - Poker: Blending bluffing/folding (no pure strategy dominates) can dominate always-calling.
    - Economics: Diversifying investments (a mix) dominates single-asset strategies under uncertainty.

  ### Implementation Fix: How to Handle Mixed Dominance
  1. **For each strategy \(s_i\), check against *all probabilistic combinations* of other strategies** (not just pure ones).  
  2. **Linear programming (LP) solves this**:  
     - **Variables**: Weights \(\lambda_j\) (probabilities) for other strategies.  
     - **Constraints**:  
       \(\sum \lambda_j \cdot \text{payoff}(j, a_k) > \text{payoff}(s_i, a_k) \quad \forall \text{ opponent actions } a_k\)  
       \(\sum \lambda_j = 1, \quad \lambda_j \geq 0\)  
     - **Feasibility**: If a solution exists, \(s_i\) is strictly dominated.  
  3. **Iterate**: Remove dominated strategies and repeat until no changes.  

  ### Efficiency Consideration
  - While LP is costlier than pure checks, for small/mid-sized games (e.g., simplified poker), it's manageable.  
  - Optimize by:
    - Using an LP library (e.g., SciPy, CVXPY).
    - Checking pure dominance first (cheap), then mixed only for survivors.

  ### Key Takeaway
  **Your friend is right—this is real IESDS**. Osborne's *An Introduction to Game Theory* (Sec. 4.3) formalizes mixed dominance in IESDS. Ignoring it risks incomplete reduction, leading to spurious equilibria or solver inefficiencies. Update your pruning pass to include mixed checks for correctness. 

  *Example code for LP-based dominance check (Python/Pseudocode):*
  ```python
  import numpy as np
  from scipy.optimize import linprog

  def is_dominated(payoff_matrix, strategy_index):
      """
      payoff_matrix: 2D array of payoffs for the player.
      strategy_index: Index of the strategy to check for dominance.
      Returns: True if dominated by a mixed strategy.
      """
      n_strategies, n_opp_actions = payoff_matrix.shape
      target_payoff = payoff_matrix[strategy_index]
      
      # Payoffs from other strategies (exclude strategy_index)
      other_payoffs = payoff_matrix[np.arange(n_strategies) != strategy_index]
      
      # LP setup: min c @ x → but we only need feasibility
      c = np.zeros(len(other_payoffs))  # Dummy objective
      A_ub = -other_payoffs.T  # Negative for <= constraint → convert to >=
      b_ub = -target_payoff - 1e-5  # Strict inequality (payoff_mix > target_payoff)
      A_eq = np.ones((1, len(other_payoffs)))  # Sum of lambdas = 1
      b_eq = np.ones(1)
      bounds = [(0, None)] * len(other_payoffs)
      
      res = linprog(c, A_ub=A_ub, b_ub=b_ub, A_eq=A_eq, b_eq=b_eq, bounds=bounds)
      return res.success
  ```
