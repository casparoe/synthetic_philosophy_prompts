answer: |-
  Here’s a systematic argument against McMahan’s "responsibility-without-culpability" framework and a defense of a culpability-based conception of liability that preserves Walzer’s moral equality at the level of deep morality:

  ### Core Critiques of McMahan’s Position  
  1. **The Epistemic Problem**:  
     McMahan’s view assumes combatants can *objectively* determine whether their war is just. But in practice:  
     - **Fog of War**: Soldiers operate under institutional propaganda, incomplete intelligence, and time pressure. A conscripted soldier in a dictatorship cannot reasonably access impartial evidence about their war’s justice.  
     - **Reasonable False Beliefs**: If a combatant *reasonably* believes their cause is just (e.g., due to state-controlled media or expert consensus), their contribution to an "unjust threat" stems from **non-culpable ignorance**. Holding them liable for this misattributes blame for circumstances beyond their epistemic control.  

  2. **Moral Excusability**:  
     Liability to lethal force requires **moral blameworthiness**, not mere causal contribution. Consider:  
     - **Civilian Analogy**: A pharmacist who reasonably but mistakenly dispenses poison (due to a supplier’s fraud) causes death but isn’t *liable* to defensive killing. Their act is regrettable but excusable.  
     - **Soldier’s Parallel**: The non-culpable unjust combatant similarly acts on false but reasonable beliefs. Their threat is **materially unjust** but **morally involuntary**, thus failing the threshold for rights forfeiture.  

  3. **Rights Forfeiture Requires Culpability**:  
     The right not to be killed is forfeited only when one:  
     - **Culpably violates others’ rights** (e.g., knowingly committing aggression).  
     - **Freely assumes unjust risk** (e.g., a mercenary ignoring evidence of injustice).  
     The non-culpable unjust combatant does neither. Their involvement is often coerced (conscription) or epistemically constrained, negating the voluntarism needed for liability.  

  4. **Symmetry of Agency**:  
     McMahan’s asymmetry implies that *just combatants* retain full rights because they act permissibly. But:  
     - **Epistemic Parity**: Just combatants may *also* be mistaken (e.g., about proportionality or necessity) and cause unjust harm. If liability hinges on *objective* justice, *both* sides risk being liable—undermining McMahan’s asymmetry.  
     - **Structural Constraint**: Soldiers on all sides are embedded in institutional hierarchies that limit autonomous moral judgment. Punishing those coerced or deceived by institutions confuses **systemic injustice** with **individual guilt**.  

  ### Defending Culpability-Based Liability & Walzer’s Deep Moral Equality  
  1. **Liability Grounded in Culpability**:  
     - A combatant is liable to lethal force **only if** they are **culpable** for an unjust threat—i.e., they act with:  
       - **Knowledge** (or reckless disregard) of their war’s injustice, *or*  
       - **Unreasonable belief** in its justice (e.g., ignoring available evidence).  
     - This distinguishes the *blameworthy aggressor* (e.g., a Nazi officer aware of genocide) from the *misled conscript* (e.g., a Soviet soldier in Afghanistan).  

  2. **Preserving Walzer’s Moral Equality**:  
     Under this culpability standard:  
     - **Non-culpable unjust combatants retain their right not to be killed**. They are moral victims of deception/coercion, not liable targets.  
     - **Just combatants lose immunity only if culpable for war crimes** (e.g., deliberate torture).  
     - **Equality Emerges**: Both sides’ combatants are:  
       - **Permitted to fight** (since non-culpable threats don’t forfeit rights),  
       - **Obligated to avoid atrocities** (culpable acts incur liability),  
       - **Moral equals** in their shared condition: agents in a collective enterprise they did not choose, judged by their adherence to *jus in bello* rules.  

  3. **Deep Morality, Not Mere Convention**:  
     Walzer’s equality isn’t a pragmatic compromise—it reflects:  
     - **Moral Excuse for Reasonable Mistakes**: Excusable ignorance negates blame, preventing liability.  
     - **Reciprocity of Risk**: Soldiers face symmetrical dangers because *neither* side can justly kill non-culpable opponents. This imposes mutual constraints grounded in respect for excusable agency.  
     - **Anti-Consequentialist Foundation**: Killing the non-culpable treats them as *means* to end aggression, violating their dignity. Culpability ensures that liability aligns with **desert**.  

  ### Addressing McMahan’s Counterarguments  
  - **"But They Pose Threats!"**: Material threats alone don’t justify killing; else, we could kill innocent human shields. Defensive force requires **unjust culpable agency**.  
  - **"Incentivizing Unjust Wars"**: Moral equality doesn’t *enable* aggression; it simply denies that foot soldiers bear liability for leaders’ crimes. Deterrence targets planners, not misled pawns.  

  ### Conclusion  
  McMahan’s responsibility-without-culpability model collapses under the weight of **epistemic constraints** and the **moral excusability** of reasonable mistakes. By grounding liability in culpability, we affirm that non-culpable unjust combatants retain their right to life, preserving Walzer’s moral equality as a principle of **deep morality**: soldiers are equally entitled to protection unless they *culpably* commit wrongdoing. This aligns with the maxim that *"ought implies can"*—soldiers cannot be obligated to know the unknowable or forfeit rights for non-voluntary acts.
