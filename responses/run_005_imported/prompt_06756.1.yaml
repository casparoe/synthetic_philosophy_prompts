     - **Note**: We are told that this person is going against the weight of the evidence. So evidence is not inconclusive; it is strong in the opposite direction. Therefore, this is not a case of inconclusive evidence. Clifford would definitely say that believing without evidence (or against evidence) is wrong. Moreover, for James, the option must have inconclusive evidence to apply the will to believe. Since the evidence is clear, James would not allow passional belief to override.
