  1. **Belief in a personal God**
     - **Live**: For many, the idea of a personal God is a live hypothesis (it has cultural, personal, or emotional resonance).
     - **Forced**: The choice between believing in God or not is forced because, in practical terms, one either lives as if God exists or as if not. Agnosticism is effectively the same as disbelief in terms of action.
     - **Momentous**: The consequences are momentous because, if true, believing may lead to eternal life or salvation, and disbelief may lead to damnation (from a religious perspective). Also, the way one lives life is profoundly affected.
     - **Overall**: This is a classic example James uses. It meets all three criteria well.

  2. **A parent's belief that their missing child, given up for dead by the police, is still alive somewhere**
     - **Live**: The hypothesis that the child is alive is very much alive for the parent (emotionally and psychologically).
     - **Forced**: The parent is forced to either believe the child is alive (and continue searching, hoping) or accept the child is dead (and grieve, stop searching). There is no middle ground that avoids the emotional weight of the choice.
     - **Momentous**: The consequences are momentous: continuing to search might lead to finding the child, but it also takes an emotional and physical toll. Accepting death allows closure but might lead to regret if the child is alive. It's irreversible in the sense that stopping the search might mean missing the chance to find the child.
     - **Overall**: Very strong on all three.

  3. **A stage-4 cancer patient's belief that she'll beat a grim prognosis**
     - **Live**: The possibility of beating cancer, even if statistically low, is often a live option for patients (hope is common).
     - **Forced**: The patient must either believe she can beat it (and thus pursue treatment, maintain hope) or resign herself to dying. Not choosing hope might lead to giving up, which could affect treatment outcomes.
     - **Momentous**: The consequences are life and death, and also the quality of life during treatment. Maintaining hope might improve her mental state and even physical resilience (placebo effect, fighting spirit). Resignation might lead to quicker decline.
     - **Overall**: Strong on all three, similar to the parent scenario.

