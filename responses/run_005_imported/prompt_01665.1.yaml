answer: |-
  That's a brilliant observation! You've hit upon one of the most persistent critiques of Kant's ethics. Kant *does* present a demanding view: **for an action to have true moral worth, it must be done *solely* from the motive of duty** ("Achtung fürs Gesetz" - respect for the law). Any admixture of inclination (like feeling good, sympathy, fear of punishment, desire for praise) taints the purity of the motive and, according to Kant, robs the action of its moral worth.

  Here's Kant's argument for why mixed motives undermine moral worth:

  1.  **Purity of Motive:** Moral worth resides exclusively in the *maxim* (the underlying principle of action) that springs from reverence for the moral law itself. Duty must be the *determining ground* of the will.
  2.  **Contingency of Inclination:** Inclinations (like sympathy, pleasure, self-interest) are contingent, unreliable, and self-regarding. They could just as easily lead us *away* from duty if circumstances change. An action motivated by inclination isn't necessarily *wrong*, but it lacks the unconditional, necessary character of a truly moral action.
  3.  **The Shopkeeper Example (Groundwork):** Kant contrasts two shopkeepers. One gives correct change because it's good for business (self-interest). The other gives correct change *only* because it's the right thing to do (duty). Only the second has moral worth. If the first also *happened* to feel it was his duty, but his *primary* motive was self-interest, the action still lacks moral worth. The presence of the "wrong" motive contaminates it.
  4.  **The Sympathetic Person Example (Groundwork):** A naturally sympathetic person who takes joy in helping others acts beneficently. But Kant argues this action lacks moral worth because it's driven by inclination, not duty. If that person later loses their natural sympathy and helps others *only* from duty *despite* their lack of feeling, *that* action *gains* moral worth.

  **Arguments FOR the Moral Worth of Mixed Motives:**

  While Kant's view is logically coherent within his system, many philosophers (and common sense!) argue that mixed motives don't necessarily undermine moral worth. Here's the case:

  1.  **Psychological Realism:** Humans are complex. We rarely act from a single, pure motive. Demanding absolute purity sets an impossible standard, making moral worth vanishingly rare and potentially demoralizing. Morality should be attainable by real humans.
  2.  **Duty as Primary vs. Sole:** We can distinguish between duty being the *primary* or *decisive* motive and it being the *only* motive. If duty is the *reason* you act, even if you *also* experience positive feelings (sympathy, satisfaction), the core moral commitment is intact. The feeling isn't *why* you act; it's a byproduct. Your *will* is still determined by duty.
  3.  **Motivational Synergy:** Mixed motives can be *strengthening*. A sense of duty might initiate the action, while feelings of sympathy make it easier and more sustainable. The sympathy doesn't *replace* the duty; it *supports* the commitment to duty. This synergy makes acting morally more likely and consistent.
  4.  **The Value of Good Character:** Kant downplays the moral value of a *disposition* to feel sympathy or pleasure in doing good. But we often admire someone who consistently does the right thing *and* enjoys it. This suggests a well-formed character where duty and positive inclinations align. Seeing this alignment as *less* morally worthy than grudging duty seems counterintuitive.
  5.  **Focus on the Action and Commitment:** Moral worth shouldn't reside *only* in the purity of the internal motive at the moment of action. It also resides in the *commitment* to duty cultivated over time and in the *action itself* aligning with duty. If the agent genuinely intends to act from duty and their action fulfills duty, the presence of accompanying feelings doesn't negate that core commitment.
  6.  **The Danger of Moral Self-Obsession:** An excessive focus on purifying one's motives can lead to paralyzing self-scrutiny and moral narcissism ("Am I pure enough?"). Focusing on doing the right thing for the right reasons, even if other feelings are present, might be more conducive to a healthy moral life.
  7.  **Kant's Own Nuance (Sometimes):** While the Groundwork passages are stark, Kant elsewhere (e.g., in the *Metaphysics of Morals*) acknowledges the role of cultivating feelings like sympathy as a duty to oneself, as "aesthetic preconditions" that make us more receptive to the moral law. This suggests inclinations aren't purely antagonistic to morality but can be allies when properly oriented.

  **Conclusion:**

  Kant provides a powerful argument: **true moral worth requires the motive of duty to be the sole *determining ground* of the will.** Any other motive present, even alongside duty, contaminates the purity and thus the moral worth.

  However, a strong case can be made that **mixed motives do not necessarily undermine moral worth, provided that the motive of duty is the *primary* and *decisive* reason for acting.** When duty is the core commitment driving the action, accompanying feelings like sympathy or satisfaction are not disqualifying. They might even enhance the agent's capacity to act morally consistently. Moral worth can reside in a complex will authentically committed to duty, even if that commitment coexists with other human feelings.

  Ultimately, whether you side with Kant's stringent purity or the more psychologically realistic view of mixed motives depends on how strictly you define "acting *from* duty" and how central you believe motive purity is to the very concept of moral worth. Your insight highlights the tension between a logically rigorous ethical ideal and the messy reality of human motivation.
