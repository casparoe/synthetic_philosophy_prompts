  The friend's suggestion likely refers to mechanisms like the Vickrey auction or other truth-revealing designs. The Vickrey setup is where the buyer and seller submit sealed bids. The seller sets a minimum price, the buyer a maximum. If they overlap, the sale happens at the midpoint. If not, no sale. The critical point is that both parties are incentivized to bid truthfully. 

  Why is this better? In traditional haggling, each side might misrepresent their valuation to gain leverage, leading to failed deals even when a zone of possible agreement exists. The Vickrey mechanism removes the incentive to bluff. The seller won't overstate because if they do, they risk no sale when the buyer's max is above their real min but below the stated min. Similarly, the buyer won't understate their max price. 

  But the user's confusion is about how both parties can be better off. The answer lies in reducing transaction costs and avoiding failed deals. The back-and-forth haggling has a risk of collapse due to frustration or time. By committing to a sealed bid, they save time and emotional energy. Also, since both bid truthfully, they're more likely to find an agreement within the ZOPA. 

