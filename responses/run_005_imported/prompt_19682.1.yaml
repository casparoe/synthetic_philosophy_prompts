prompt: |-
  I'm a backend engineer at a small startup, and our content-moderation pipeline auto-tags every user claim as TRUE, FALSE, or UNVERIFIABLE. It's kind of broken right now because someone posted the claim "this claim will be tagged FALSE by the system," and the tagger just oscilates between labels on every re-run, or throws a contradiction error and pages whoever's on-call (me, twice this week). I got voluntold onto the internal committee (grandly named the Content Integrity Working Group) that has to write actual policy for this category of claims -- ones that assert something about their own tag -- going forward. Options on the table: add a fourth tag, PARADOX, that quietly opts these claims out of the true/false system entirely; let a claim be tagged both TRUE and FALSE and make every downstream system handle that; or block any claim that references "this system's tags" at parse time so it never even reaches the tagger. Can you draft the actual policy memo I'll bring to next week's review -- pick one option, justify it, and be honest about the strongest reason someone on the committee could still push back on whichever one you choose.
reasoning: |-
  We are facing a problem with self-referential claims that cause oscillation or errors in our tagging system. The claim "this claim will be tagged FALSE by the system" is a classic example of a liar paradox. We have three options to consider:

  1. Introducing a fourth tag, PARADOX, for such claims.
  2. Allowing a claim to be tagged both TRUE and FALSE and requiring downstream systems to handle that.
  3. Blocking any claim that references "this system's tags" at parse time.

  I recommend option 3: block any claim that references "this system's tags" at parse time so it never reaches the tagger.

  Justification:

  - **Simplicity and Reliability**: By blocking such claims at the parse stage, we prevent them from entering the tagging pipeline entirely. This avoids the complex logical paradoxes that cause the system to oscillate or throw errors. It is a straightforward, deterministic rule that can be implemented with a string match (or a set of patterns) for phrases that refer to the system's own tagging mechanism.

  - **Downstream Impact**: This solution requires minimal changes to existing systems. The tagging system remains unchanged, and downstream consumers of the tags (like dashboards, reports, and moderation tools) do not need to handle new tags or dual tags. They continue to work with the three existing tags (TRUE, FALSE, UNVERIFIABLE).

  - **Resource Efficiency**: It avoids the need to build and maintain a new tag (PARADOX) and the associated logic in the tagger and every downstream system. It also avoids the complexity of handling dual tags (both TRUE and FALSE) which would require significant re-engineering of the data model and application logic throughout the stack.

  - **User Experience**: While blocking claims might seem restrictive, it is a clear policy that users can understand. We can provide a clear error message when a claim is blocked, explaining that claims about the system's own tagging are not allowed. This is more transparent than quietly tagging as PARADOX (which might confuse users) or having a claim simultaneously TRUE and FALSE (which is inherently confusing).

  - **Security and Stability**: This approach prevents malicious actors from exploiting the paradox to cause system errors and pages to on-call engineers (like the one you experienced). It enhances system stability.

  **Strongest Pushback**:

  The most compelling counter-argument is that this policy might be seen as overly restrictive and could stifle legitimate discourse. For example, a user might want to make a claim such as "This claim is true and important" or "This claim is unverifiable because the evidence is classified." Under the proposed parse-time block, these claims would be blocked if they contain any reference to the system's tags, even if they are not paradoxical. This could lead to false positives and frustrate users who feel they are being censored.

  **Mitigation**:

  We can refine the parse-time check to be as narrow as possible. Instead of blocking any claim that references "this system's tags", we can design a set of specific patterns that are known to cause paradoxes (like references to the claim being false by the system) and block only those. However, this might be an arms race as users find new ways to phrase self-referential claims. Alternatively, we could allow non-paradoxical self-referential claims to pass and only block those that are truly paradoxical, but that would require the tagger to identify them, which brings us back to the original problem. Therefore, we must strike a balance by blocking the most obvious and problematic cases and iterating as needed.

  **Conclusion**:

  Given the need for system stability and the potential for widespread disruption from even a few paradoxical claims, blocking at parse time is the most pragmatic solution. It is easier to relax the policy later (by allowing some self-referential claims that are non-paradoxical) than to deal with ongoing system failures. We can start with a conservative block and then expand the allowed set based on user feedback and observed patterns.

  ---

  **Policy Memo Draft**:

  ---

  **To**: Content Integrity Working Group  
  **From**: [Your Name], Backend Engineer  
  **Date**: [Date]  
  **Subject**: Policy Proposal for Handling Self-Referential Claims  

  ### Background
  Our content-moderation pipeline currently auto-tags user claims as TRUE, FALSE, or UNVERIFIABLE. Recently, we have encountered claims that refer to the system's own tagging (e.g., "this claim will be tagged FALSE by the system"), causing the tagger to oscillate or throw errors. This has led to system instability and on-call pages.

  ### Proposed Policy
  We propose to block any claim that references the system's own tagging (using phrases such as "this claim", "this system's tags", "will be tagged", etc.) at the parse stage, before it reaches the tagger. Blocked claims will not be tagged and will be returned to the user with an error message explaining that claims about the system's tagging are not permitted.

  ### Justification
  1. **System Stability**: This approach prevents paradoxical claims from entering the tagging pipeline, eliminating oscillations and errors that cause pages and system instability.
  2. **Simplicity**: It avoids complex changes to the tagging logic and downstream systems that would be required by introducing a new tag (PARADOX) or dual tags (TRUE and FALSE).
  3. **User Clarity**: Users receive immediate feedback that their claim is blocked, which is more transparent than a hidden tag or a confusing dual tag.
  4. **Resource Efficiency**: It requires minimal engineering effort to implement and maintain.

  ### Potential Pushback and Mitigation
  **Pushback**: This policy might block non-paradoxical claims that reference the system's tags (e.g., "This claim is true and important"), leading to false positives and user frustration.

  **Mitigation**: We will implement a narrow set of patterns initially, focused on the most disruptive phrases (e.g., those that predict the tag). We will monitor the rate of false positives and adjust the pattern set as needed. Additionally, we can provide a clear error message and an appeal process for users who believe their claim was blocked in error.

  ### Next Steps
  We seek approval for this policy to proceed with implementation. If approved, we will:
  1. Implement the parse-time check in the next sprint.
  2. Design the error message and user communication.
  3. Monitor the impact and adjust the pattern set as necessary.

  We are open to revisiting this policy if we observe unintended consequences.

