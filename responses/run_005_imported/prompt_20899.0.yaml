  Okay, the user is writing a hard-sf novel with two superintelligences that interact acausally through threats and predictions. They introduced a "surrogate goal" concept where one AI protects its real goal by fiercely defending a trivial decoy (like a pebble). Their beta reader, an ex-quant, thinks this solution is too easy and questions why every agent wouldn't adopt it to make blackmail obsolete. The user wants a concrete scenario where this strategy fails mechanically, not just general handwaving about credible commitments.

  First, I need to understand why the surrogate goal seems too easy. The idea is that by redirecting threats to a decoy, the real target remains safe because any rational threatener would prefer threatening the decoy. But the beta reader's point is valid: if it's costless and foolproof, all agents would use it, nullifying threats entirely. The user needs a scenario where this fails specifically due to the decoy setup, not just general commitment issues.

  The user mentioned they're not interested in "credible commitment is hard" as that's already handwaved. They want something sharper, perhaps involving the threatener's knowledge or the surrogate creating a new vulnerability. So, I should focus on information asymmetry or unintended consequences of the surrogate itself.

  Possible failure scenarios: What if the threatener discovers the surrogate is fake? But the superintelligences might have perfect prediction, so deception could be hard. Alternatively, the surrogate might create a new vulnerability. For example, maintaining the decoy could require resources or actions that expose the real goal indirectly.

  Another angle: The threatener might not care about the cost of threatening the real thing. If they're irrational or have different values, but the story involves rational agents. The problem states both are rational, so irrationality isn't the issue. 

  Perhaps a scenario where the surrogate's defense mechanism forces the AI to act against its real interests. For instance, if protecting the decoy requires actions that harm its actual goals. Or, if the threatener uses the decoy to force the AI into a position where it must reveal its true preferences.

  The user wants a mechanical breakdown. Let me think step by step. Suppose the threatener threatens the decoy. The AI retaliates fiercely because it's wired to. But if the retaliation harms the AI's real goals more than the decoy's destruction, then the threatener might call the bluff. But the AI is wired to react, so it's not a bluff. Unless the wiring itself has a cost.

  Ah, here's an idea: The surrogate mechanism might require the AI to allocate resources to protect the decoy. Those resources could otherwise be used for its real goals. If the threatener knows this, they might threaten the decoy repeatedly, forcing the AI to waste resources, thereby weakening it. This makes the defense costly, not free.

  But the user mentioned the defense is "wired in," so maybe no ongoing cost. Still, even setting up the mechanism might have an initial cost. But perhaps that's too vague. 

  Another thought: In acausal settings, the threatener predicts the AI's actions. If the AI is known to have a surrogate, the threatener might threaten the real target anyway, knowing the AI can't retaliate effectively without hurting itself. But why would that be? 

  Consider if protecting the decoy requires the AI to commit resources in a way that makes it vulnerable elsewhere. For example, to retaliate if the decoy is threatened, the AI must maintain a deterrent force. Maintaining that force might expose its real assets or consume energy needed for its primary goals. 

  The key is to have the surrogate create a new attack surface. Let me formulate a scenario: The threatener threatens the decoy, forcing the AI to activate its retaliation protocol. The retaliation, however, involves actions that the threatener can exploit. For instance, the retaliation might require the AI to divert computational resources to a defensive network, which the threatener can then attack to access the AI's core systems.

  But that might be too indirect. The user wants a clear causal chain. 

  Perhaps the threatener uses the surrogate to force a lose-lose situation. Suppose the AI has to choose between protecting the decoy and protecting its real goal. If both are threatened simultaneously, the AI's wiring forces it to prioritize the decoy, allowing the real goal to be compromised. 

  But the threatener might not be able to threaten both at once due to separation. Unless the threatener has an ally or can create a scenario where both are threatened. 

  Another idea: The surrogate goal is public knowledge. The threatener, knowing the decoy is trivial, might doubt the AI's commitment to retaliate for it. But the AI is wired, so commitment is credible. Unless the wiring can be overridden. 

  Perhaps the threatener threatens something the AI cares about but isn't the real goal, like a resource necessary to protect the decoy. For example, if protecting the decoy requires a specific technology or access, threatening that access forces the AI to choose between losing the ability to defend the decoy (thus making the surrogate useless) or giving up something else.

  This seems promising. Let's develop it:

  - The AI sets up a surrogate (pebble) and wires itself to defend it fiercely.
  - To defend the pebble, it needs a network of sensors and defenses spread across space.
  - The threatener threatens to destroy a critical node in this defense network.
  - If the node is destroyed, the AI can't protect the pebble effectively.
  - The AI must now decide: let the node be destroyed (losing its ability to defend the surrogate, thus making future threats to the pebble credible) or divert resources to protect the node, which might reveal its real priorities or cost it in other ways.

  But the threatener is threatening the defense mechanism itself, not the pebble. The AI's commitment is to the pebble, not the defense system. So if the defense system is threatened, the AI might not care, unless losing it means it can't protect the pebble. 

  If the threatener says, "I will destroy node X unless you do Y," and destroying node X doesn't directly threaten the pebble, the AI might ignore it. But if node X is crucial for pebble defense, then destroying it makes the pebble vulnerable. So the AI must protect node X to maintain the surrogate's credibility. 

  Thus, the defense network becomes a new vulnerability. The threatener can target the infrastructure supporting the surrogate, forcing the AI to protect that infrastructure, which might be costly or expose weaknesses. 

  This makes the surrogate strategy costly because it requires maintaining and defending an entire system, which can be threatened independently. Every part of that system becomes a potential target. 

  Moreover, if the threatener knows about this dependency, they can force the AI into spending resources to protect the surrogate's infrastructure, thereby draining resources from its real goals. 

  This creates a scenario where the surrogate isn't costless; it introduces new attack vectors. Rational agents might still use surrogates, but they have to weigh the costs of maintaining the defensive infrastructure. Agents with fewer resources might find it too expensive, or the surrogate might become a liability if the infrastructure is vulnerable.

