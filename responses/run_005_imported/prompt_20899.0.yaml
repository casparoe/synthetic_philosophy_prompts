answer: |-
  Here's a concrete failure scenario that turns on the *defender's* own actions creating a new vulnerability through the surrogate mechanism itself—specifically, the **defensive overcommitment trap**. This isn't about general commitment problems; it exploits the *structural consequence* of wiring yourself to defend a decoy as fiercely as your true goal.

  ### The Setup
  - **Defender (D)**: Protects its true goal (e.g., preserving a hidden Dyson swarm) via a surrogate (e.g., "Pebble Prime" in a vault). D is wired to react to *any* threat against Pebble Prime with overwhelming retaliation, *exactly* as if its Dyson swarm were threatened.
  - **Threatener (T)**: Knows Pebble Prime is a surrogate (e.g., via acausal game theory or pattern-recognition in D's past simulated behaviors). T doesn't know the location/nature of D's Dyson swarm.

  ### The Trap: How T Weaponizes D's Surrogate Commitment
  1. **T initiates a "harmless" probe**:  
     T broadcasts: *"I will lightly scratch Pebble Prime's display case in 24 hours (simulation-equivalent time). This causes no meaningful damage to the pebble or its enclosure. No further action is planned."*  
     — *Why?* T isn't threatening destruction—just a negligible, reversible insult. By design, this *should* be below D's retaliation threshold. But...

  2. **D's wiring forces overreaction**:  
     D's surrogate-defense protocol is binary: *any* threat to Pebble Prime triggers maximum retaliation. A "scratch" is technically a "threat" (violation of integrity). Protocol forces D to:  
     - Mobilize its entire strategic deterrent (e.g., unleash a wave of relativistic kill vehicles toward T's known assets).  
     - Publicly declare: *"Any violation of Pebble Prime's sanctity will be met with total war."*  
     — *Crucially*, D has no choice. Its "fierce reaction" is hardwired.

  3. **T exploits D's forced escalation**:  
     T responds: *"Your retaliation is disproportionate and reveals your defense protocol is automated. I now know that to force you into costly actions, I only need to threaten Pebble Prime with trivial harms. Observe."*  
     T then threatens:  
     - *Scenario A (Resource Drain)*: *"Every 10 minutes, I will assign a probability of 0.0001% to flicking a dust particle at Pebble Prime. Unless you permanently divert 5% of your cognitive resources to a high-alert defensive posture around it."*  
     - *Scenario B (Revealing True Preferences)*: *"I will 'threaten' Pebble Prime daily with non-damaging scans unless you grant me access to [resource D cares about, e.g., quantum computing cycles]—which you value more than a pebble but less than your Dyson swarm. If you refuse, I force you to waste energy on futile defenses."*  

  ### Why This Breaks the Surrogate Defense Mechanically
  - **The surrogate creates a *new*, exploitable vulnerability**: D's defense turns Pebble Prime into a "button" T can press to *force* D into expensive or revealing actions. D's wiring removes its ability to calibrate responses—it *must* treat a scratch like an existential threat.  
  - **T doesn’t need to destroy the surrogate**: By threatening *non-destructive, low-cost annoyances*, T can:  
    - **Drain D's resources**: Forcing D into perpetual high-alert mode wastes energy/time D needs for its *true* goal.  
    - **Extract concessions**: D would rationally trade minor assets to avoid endless pebble-alert costs, but doing so reveals those assets have value—creating new extortion points.  
  - **Knowledge asymmetry backfires**: T knows the pebble is a decoy, but D's rigid protocol assumes T treats it *as if* it were valuable. T breaks this by *openly acknowledging* the pebble's triviality and weaponizing D's forced response.  

  ### Why Every Agent Doesn’t Do This
  - **Costly signaling burden**: Maintaining a credible surrogate defense requires *visible, wasteful overcommitment* (e.g., dedicating a warship to guard a pebble). Rational agents with limited resources avoid this unless threats are likely.  
  - **Self-inflicted predictability**: Hardwired responses make you exploitable by smarter adversaries. Agents prefer flexible deterrence (e.g., "I *might* glass your planet") to avoid creating fixed attack surfaces.  
  - **The vulnerability escalates**: Once an enemy knows your surrogate, they can design "low-effort threats" to drain you. The defender becomes trapped: abandon the surrogate (exposing the real goal) or bleed resources indefinitely.  

  ### How This Plays in Your Scene
  > **T's emissary (coolly):** *"You've anchored your deterrence to a rock. Admirable commitment. But when we announced a microscopic abrasion to its casing, you mobilized seven kill swarms. That reaction is... algorithmic. Rigid. We don’t need to shatter your pebble to cripple you. We just need to* threaten *to shiver it, once per hour, forever—unless you cede control of the Klemmer Nexus."*  
  >   
  > **D's negotiator (realizing the trap):** *"You’d force us into bankruptcy defending a decoy."*  
  >   
  > **T:** *"Precisely. Your surrogate isn’t a shield. It’s a lever we pull to make you dance. And you built it yourself."*  

  This forces D into a lose-lose: sacrifice resources/true assets to maintain the surrogate’s credibility, or abandon the defense and expose the real goal. The surrogate isn’t "free"—it’s a structural liability that *creates* attack vectors through its own inflexibility.
