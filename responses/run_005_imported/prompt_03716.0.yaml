prompt: |-
  Got into a two-hour arguement with my friend last night (he's doing a philosophy phd, i just read this stuff for fun) about why a sentence like "the cat is on the mat" actually says something, instead of just being three concepts sitting next to each other in a list. He brought up this old argument from Bradley - that if a relation connects the cat and the mat, that relation itself needs a further relation tying it to the cat and to the mat, and that new relation needs another one too, and so on forever, so relations can never actually succeed in unifying anything. I said that sounds like a cheap trick - the sentence obviously works fine and everyone understands it, so who cares if there's some regress lurking in the analysis. We argued way too long and neither of us could actually pin down whether the regress is a real problem for the "unity of the proposition" or just confusion about how to describe something that isn't actually confusing in practice. Can you lay out the actual force of Bradley's argument, and why it apparently gave Russell so much trouble, instead of everyone just waving it away the way I wanted to?
