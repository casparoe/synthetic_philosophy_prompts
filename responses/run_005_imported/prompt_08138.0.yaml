answer: |-
  You've hit on one of the most fascinating and frustrating knots in the philosophy of dispositions! Your intuition that finks and masks feel like "one trick wearing two costumes" is spot-on – both expose flaws in the simple conditional analysis ("X is fragile iff X *would* break if struck"). But philosophers treat them as distinct problems because they attack the conditional from **fundamentally different angles**, targeting different parts of the causal chain and requiring different kinds of fixes. Here's the breakdown:

  1.  **The Core Problem They Share:** Both show that the truth of the conditional "If C were to happen, M would happen" (e.g., "If struck, it would break") can be **accidentally true or false** relative to the *actual, intrinsic disposition* of the object *at the time the conditional is assessed*. The conditional doesn't reliably track the underlying property.

  2.  **Why They Are Structurally Different: Targeting Different Links in the Chain**
      *   **Finks (The Live/Dead Wire):** A fink **directly alters the intrinsic basis of the disposition *precisely when* the test condition (C) is about to occur.**
          *   **Mechanism:** The disposition *ceases to exist* (or *comes into existence*) *because* C is imminent. The gadget removes the live charge *as* you touch it (making it non-shocking *just then*), or adds the charge *as* you touch it (making it shocking *just then*).
          *   **What it Breaks:** It breaks the link between the object's *stable intrinsic state* *prior to C* and the *truth of the conditional*. Before C, the wire *is* live (intrinsically shocking), but the conditional "If touched, it would shock" is *false* because the fink will remove the charge. Conversely, a dead wire with a reverse fink *isn't* live intrinsically, but the conditional "If touched, it would shock" is *true* because the fink will add the charge.
          *   **Analogy:** It's like someone erasing the "fragile" label *the instant* you reach to pick up the glass. The glass *was* fragile, but *at the moment of testing*, it isn't anymore (thanks to the fink).
      *   **Masks (Poison + Antidote):** A mask **leaves the intrinsic disposition *fully intact* but *interferes with the causal process* *after* C has occurred, preventing the manifestation (M).**
          *   **Mechanism:** The dispositional base (the poison's chemical structure) remains unchanged. The test condition (ingestion) occurs. But an *external* or *simultaneous* factor (the antidote) *blocks* the disposition's typical causal pathway to the manifestation (death). The poison *is* poisonous (it has the intrinsic power to kill via its chemistry), and it *is* ingested, but it *doesn't* kill because the antidote intervenes.
          *   **What it Breaks:** It breaks the link between the *occurrence of C* and the *occurrence of M*, *even though the intrinsic disposition is present and activated*. The conditional "If ingested, it would cause death" is false for *this particular ingestion event* (because of the antidote), despite the object genuinely possessing the disposition to cause death upon ingestion.
          *   **Analogy:** It's like wrapping the fragile glass in bubble wrap *as* you strike it. The glass *is* fragile (intrinsically), and it *is* struck, but it *doesn't* break because the bubble wrap absorbs the impact. The disposition is masked, not removed.

  3.  **Lewis's Patch (and Why Masks Slip Through):**
      *   David Lewis proposed a revised conditional analysis specifically to handle finks (and mimics, another related problem). The gist is:
          > X is disposed to manifest M in response to stimulus C iff X has some intrinsic property B (the "causal basis" of the disposition) such that, *if X were to undergo C and retain B throughout the process*, then C and B would jointly cause M.
      *   **Why it Handles Finks:** The fink works by *removing B* precisely when C happens. Lewis's conditional explicitly requires B to be *retained* during C. So, for the live wire with a fink: When we consider the closest world where it's touched (C), the fink *removes* B (the live charge). Since B isn't retained during C, the conditional ("if touched *and retains B*, then shock") isn't triggered, correctly reflecting that it *isn't* disposed to shock *at that moment* (due to the fink). The analysis now tracks the intrinsic state *during* the test.
      *   **Why it *Doesn't* Handle Masks:** The mask *doesn't* remove B! The poison retains its intrinsic poisonous structure (B) throughout ingestion (C). Lewis's conditional *is* true: "If the poison is ingested *and retains its poisonous structure (B) throughout*, then ingestion and B would jointly cause death." The problem is that in the *actual* scenario (and the closest possible worlds where it's ingested with the antidote), the antidote *intervenes* in the causal chain *between* B/C and M (death). Lewis's conditional focuses on the intrinsic basis *surviving* the stimulus, but it doesn't guarantee that *nothing else interferes* with the causal path *from* B+C *to* M. The mask exploits this gap.

  4.  **Which is the Bigger Headache? (Masks - Usually)**
      *   **Finks:** Lewis's patch (or variations like Manley and Wasserman's "dispositional essentialism") is widely seen as *largely* successful against finks. By tying the disposition to a *stable intrinsic basis* that must *persist* during the test, it avoids the fink's trick of altering that basis on the fly. Finks feel more like a *technical loophole* that has been plugged, even if implementing the solution perfectly is complex.
      *   **Masks:** Masks remain the more persistent and profound challenge for several reasons:
          *   **Pervasiveness:** Masking is *everywhere* in the real world. Safety glass is fragile but laminated (masked). Fireproof wood is flammable but treated (masked). A person is irritable but on medication (masked). Any robust definition needs to handle these common cases.
          *   **Deep Causal Complexity:** Handling masks requires specifying not just the presence of a stable intrinsic basis during C, but also the *absence of interfering factors* in the *causal pathway* leading from C+B to M. Defining the "right kind" of causal pathway without circularity or triviality is extremely difficult.
          *   **Threat to Simplicity:** Fixing masks often seems to require moving away from a pure *conditional* analysis (if C, then M) towards a more complex *causal process* or *power-based* account. This feels like giving up on the initial simplicity that made the conditional analysis attractive.
          *   **"Finkish" Masks?:** Some argue certain masks can *mimic* finks, or that the line isn't always sharp (e.g., is the antidote *preventing the poison from acting* (masking) or *neutralizing the poison instantly upon ingestion* (acting like a fink?)). This blurs the lines but highlights the difficulty masks pose.
          *   **Lewis's Patch Doesn't Work:** As shown, the standard fink-fix fails against masks.

  **In Summary:**

  *   **Finks** change the object's intrinsic dispositional property *at the moment the test condition occurs*. They attack the link between the *prior intrinsic state* and the *truth of the conditional*.
  *   **Masks** leave the intrinsic disposition intact but prevent its manifestation via an *external interference in the causal process after the test condition occurs*. They attack the link between the *activation of the disposition (C)* and its *manifestation (M)*.
  *   **Lewis's Patch** fixes finks by requiring the intrinsic basis (B) to persist *during* the stimulus (C), ensuring the disposition is "switched on" when tested. It fails against masks because masks don't remove B; they disrupt the causal chain *after* B and C are both present.
  *   **The Bigger Headache:** Masks are generally considered the tougher, more persistent problem. They are more common, require grappling with complex causal processes and interfering factors, resist the conditional analysis more stubbornly, and aren't solved by the main fix developed for finks. They push philosophers towards more complex theories of dispositions or causal powers. Finks feel like a solved puzzle (albeit with complex solutions), while masks remain an open and messy challenge for anyone wanting a simple "if-then" definition. Your instinct that masks represent the deeper unsolved headache is correct.
