  First, I need to recall the definitions. Finks involve a change in the intrinsic property when the test condition is about to happen. Like the live wire example—the gadget removes the disposition right before the test. Masks, on the other hand, keep the disposition intact but block the manifestation. The poison with antidote is still poisonous, but the antidote prevents the effect.

  The user thinks both cases trick the if-then test similarly. But the key difference is in what's altered: the disposition itself vs. external blockers. So, structurally, finks attack the disposition's existence during the test, while masks attack the causal chain after the test starts.

  Lewis's conditional fix added the ceteris paribus clause and intrinsic basis. That handles finks because the intrinsic property remains unchanged during the test. But masks bypass this because the disposition is still there intrinsically; the mask interferes externally. So masks need a different solution, maybe involving causal intermediaries or processes.

  The user also asks which problem is harder. Masks seem tougher because they require tracking the disposition's effect through a process, not just its presence. Plus, masks are more common in real life, like safety features on fragile items. So explaining why something is fragile but doesn't break when dropped (because of packaging) needs addressing masks without giving up on dispositions.

