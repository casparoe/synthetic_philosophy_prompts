answer: |-
  That's an excellent question cutting to the heart of why the Pasadena game is so vexing. Nover and Hájek's core argument against privileging the "natural" (toss-by-toss) order hinges on the **fundamental principle that the expectation of a gamble should depend solely on its possible outcomes and their probabilities, *not* on an arbitrary ordering scheme imposed on those outcomes for the purpose of summation.**

  Here's an intuitive unpacking of why this principle matters and why the natural order isn't privileged:

  1.  **The Gamble is Defined by Outcomes, Not Order:** The Pasadena game is defined by a set of mutually exclusive and exhaustive possibilities:
      *   Outcome 1: Heads on first toss. Payout: `(-1)^(1-1) * 2^1 / 1 = +$2`
      *   Outcome 2: Tails then Heads. Payout: `(-1)^(2-1) * 2^2 / 2 = -$2`
      *   Outcome 3: Tails, Tails, Heads. Payout: `(-1)^(3-1) * 2^3 / 3 ≈ +$5.33`
      *   Outcome 4: Tails, Tails, Tails, Heads. Payout: `(-1)^(4-1) * 2^4 / 4 = -$4`
      *   ... and so on, ad infinitum.
      Each outcome `n` has a well-defined probability `(1/2)^n` and a well-defined payout `(-1)^{n-1} * 2^n / n`. **This list of outcome-probability pairs *is* the complete description of the gamble.** There is no inherent "order" in which these outcomes *occur* that affects their probability or payout value. The coin toss sequence defines *how* the outcome is determined, but once determined, the outcome `n` is just `n`.

  2.  **Summation Order is a Mathematical Tool, Not Part of the Gamble:** Calculating the expected value requires summing `(Probability of Outcome n) * (Payout of Outcome n)` over all possible `n`. Because the series `Σ [ (1/2)^n * (-1)^{n-1} * 2^n / n ] = Σ [ (-1)^{n-1} / n ]` is only conditionally convergent, the *order* in which we perform this summation dramatically affects the result. **The "natural order" (n=1, 2, 3, 4,...) is just one arbitrary way of lining up these mathematical terms.** It corresponds to the order we *discover* the outcomes via the coin tosses, but it doesn't correspond to any inherent ordering *of the outcomes themselves* relevant to their contribution to expected value. Why should the order of discovery dictate how we sum their contributions?

  3.  **The "Privileged Order" Objection Begs the Question:** Saying "the natural order is privileged because it's the order the outcomes happen" subtly smuggles in a temporal or procedural element that isn't part of the *definition* of the gamble's expectation. Expectation is defined as the probability-weighted average of the *outcome utilities*. It's a static property of the gamble description. The *process* of flipping the coin tells us *which* outcome occurs, but it doesn't change the *set* of outcomes or their probabilities/payouts. Privileging the natural order effectively says: "The expectation is defined by summing the outcomes *in the order we learn about them*." But this is **not** the standard definition of expected value. The standard definition aggregates over the outcome space, period. There's no justification within standard decision theory for weighting the order of discovery over any other mathematically possible ordering when summing conditional series.

  4.  **The Specter of Arbitrary Manipulation:** If we accept the natural order as privileged, yielding `ln 2 ≈ $0.69`, what stops someone else from rationally adopting a different ordering? Imagine an entrepreneur offering the Pasadena game. She could calculate the "expectation" using an order that sums to `+$1,000,000` and claim the game is fantastically valuable. A potential buyer, using the natural order, calculates `$0.69` and thinks it's almost worthless. A regulator, using an order summing to `-∞`, declares the game toxic and bans it. **Who is right?** If the natural order is privileged, only the `$0.69` calculation is valid. But Nover and Hájek argue there is no compelling, non-question-begging reason why *only* the natural order calculation counts as the "true" expectation. All orderings use the *same* underlying outcome probabilities and payouts. Accepting any specific finite value (like `ln 2`) as *the* expectation seems arbitrary when other orderings, using the same fundamental data, yield wildly different results.

  5.  **Contrast with St. Petersburg:** This highlights why the Pasadena game is *worse* than the original St. Petersburg paradox.
      *   **St. Petersburg:** `Σ [ (1/2)^n * 2^n ] = Σ [1] = 1 + 1 + 1 + ... ` This series **diverges to +∞** *regardless* of the order you sum it in (because the terms are positive and the series of absolute values `Σ |(1/2)^n * 2^n| = Σ [1]` also diverges). The problem is "merely" that the expectation is infinite. Order doesn't matter.
      *   **Pasadena:** `Σ [ (1/2)^n * (-1)^{n-1} * 2^n / n ] = Σ [ (-1)^{n-1} / n ]` This series **converges conditionally**. Its sum *depends entirely* on the summation order. The series of absolute values `Σ |(-1)^{n-1}/n| = Σ [1/n]` (the harmonic series) **diverges**. This conditional convergence is the root of the problem. **The expectation isn't just infinite; it's *undefined* because no unique sum can be assigned without imposing an arbitrary order.** This strikes at the core definition of expected value for gambles with infinite outcome spaces.

  **In essence:** Privileging the natural order confuses the *process of generating* the outcome with the *definition of the expectation* of the gamble. The gamble is fully defined by its outcome-probability pairs. Summing these pairs in *any* order uses the same fundamental information. Because the series is only conditionally convergent, different summation orders yield different sums. There is no principle *internal to the definition of expected value* that justifies selecting one specific summation order (like the natural one) over any other. To do so seems arbitrary. Therefore, the only consistent conclusion is that the expectation for the Pasadena game is undefined. This exposes a deeper limitation of standard expected utility theory when faced with gambles whose payoff series converge conditionally – the theory simply fails to deliver a unique, order-invariant expected value.
