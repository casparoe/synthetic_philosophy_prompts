prompt: |-
  My brother and I are dividing up our late parents' estate. Before we'd even sat down to discuss it properly, he told the whole family that he is "absolutely firm" on keeping the house and won't consider selling it or splitting the proceeds. Now I feel pressure to lock in an equally firm counter-position of my own before he can box me in any further, even though I haven't really worked out what I want yet. Is matching his move the right way to protect my interests here, or is something about this dynamic likely to backfire on both of us?
