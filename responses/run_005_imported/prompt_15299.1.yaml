prompt: |-
  I'm a retired physicist who's gotten pretty into moral philosophy since retiring, and lately I've been reading about Anscombe's campaign against Oxford giving Truman an honorary degree over Hiroshima and Nagasaki (the "Mr Truman's Degree" pamphlet). Here's what's bugging me though: the standard defense of the bombings has always been that they saved lives overall, since a land invasion of Japan would've been way bloodier for both sides. If thats basically right on the numbers, doesn't it pull the rug out from under Anscombe's whole objection? Seems like her case amounts to a bet about body counts that just didn't pay off once historians ran the estimates. Am I missing something, or does her argument just not really hold up anymore?
reasoning: |-
  Okay, let me tackle this retired physicist's question about Anscombe and the atomic bombings. He's coming from a scientific background but now diving into moral philosophy, which is a cool transition. His main point is that if the utilitarian argument holds (bombings saved lives by preventing a land invasion), doesn't that invalidate Anscombe's absolutist position?

  First, I need to recall Anscombe's core argument. She wasn't just objecting to Truman; she was attacking the entire utilitarian framework that justifies evil means for good ends. Her pamphlet was rooted in Catholic natural law ethics - specifically the absolute prohibition against intentionally killing innocents. 

  The physicist seems to think this is just a numbers game. But Anscombe would say it's about moral categories, not arithmetic. Even if the bombings saved lives, deliberately targeting civilians is intrinsically wrong. It's like that thought experiment: would you kill one healthy person to harvest organs for five dying patients? A utilitarian might say yes, but most ethicists would say no - because some acts are just wrong regardless of consequences.

  I should clarify the historical contingency too. The "saved lives" argument relies on projections about invasion casualties that are hotly debated today. But Anscombe's critique doesn't stand or fall on those numbers. She'd argue that even if the projections were 100% accurate, the moral principle still holds. 

  There's also the institutional angle he might be missing. Her protest wasn't just about Truman; it was about Oxford endorsing his decision by giving him an honor. That's why she focused on the university's moral complicity. 

  The physicist seems stuck on the empirical question ("did it actually save lives?"), but Anscombe is operating on a different plane entirely. It's like comparing Newtonian mechanics to quantum physics - they're different frameworks. I should use that analogy since he'll get it. 

  I wonder if he's encountered the doctrine of double effect? That's crucial here. The Allies didn't intend to kill civilians in conventional bombing (theoretically), but with nukes they specifically chose civilian targets. That intentionality matters in her ethics. 

  Also worth noting: Anscombe predicted that accepting this justification would normalize horrific acts. Looking at how warfare evolved post-WWII... she wasn't wrong. But that's a separate point. 

  The key is making him see that this isn't physics-style consequentialism. In morality, the path matters as much as the destination. Even if the bombings were net-positive (debatable), the means corrupted the end. That's the thread I need to pull.
answer: |-
  That's a fantastic question cutting to the heart of a crucial debate in moral philosophy. You're right that the "saved lives" argument is the dominant utilitarian defense of Hiroshima and Nagasaki, and it *seems* to directly counter Anscombe's objection. **However, Anscombe's critique doesn't stand or fall solely on the accuracy of casualty projections. Her argument operates on a fundamentally different moral plane.** Here's why her objection remains potent, even if the utilitarian calculation were accepted:

  1.  **The Core of Anscombe's Argument: Intention and the Prohibition of Innocent Killing:**
      *   Anscombe, drawing deeply from Catholic natural law tradition (especially Aquinas) and her own Wittgensteinian analysis of intention, argued that **certain acts are intrinsically evil**, regardless of consequences.
      *   The primary evil she identified was the **intentional killing of innocent non-combatants**. For her, this was a moral absolute, grounded in the inherent dignity of the person and the nature of justice.
      *   Her pamphlet focuses relentlessly on Truman's *decision* and *authorization* to deliberately target civilian populations with the specific intent of causing mass death and terror to force surrender. **The act itself, she argued, was murder on a colossal scale.**

  2.  **Why the "Saved Lives" Defense Doesn't Nullify Her Point:**
      *   **Consequentialism vs. Deontology:** The "saved lives" argument is purely *consequentialist* (judging the act by its outcomes). Anscombe's argument is fundamentally *deontological* (judging the act by its inherent nature and the intention behind it). She explicitly rejected consequentialism as a valid basis for moral judgment, especially regarding fundamental prohibitions like killing the innocent. **Saying "it saved lives" doesn't change the nature of the act she condemned.**
      *   **The Problem of "Doing Evil That Good May Come":** Anscombe saw the utilitarian justification as a prime example of this dangerous principle. Even *if* the net outcome was positive (a massive historical "if" she contested), it doesn't make the *means* morally permissible. She argued that deliberately killing innocents as a means to an end corrupts the moral agent and society, regardless of the end achieved. Would we justify deliberately bombing a hospital full of children if it *certainly* saved more lives elsewhere? Her answer was a resounding "no," based on the intrinsic nature of the act.
      *   **Intention Matters Crucially:** For Anscombe, the *intention* to kill innocents was the key moral failing. Military planners considering a land invasion might foresee massive civilian casualties as a terrible but *unintended* consequence of targeting military objectives. The atomic bombings, however, *intentionally* chose civilian population centers as the direct targets to achieve their effect (terror and surrender). This difference in intention was morally decisive for her.

  3.  **The Contingency of the Historical Claim:**
      *   While you state the "saved lives" argument as if it's settled fact, **it's a highly contested historical claim.** Key criticisms include:
          *   Japan was already militarily defeated and seeking surrender terms through back channels (though unconditional surrender remained a sticking point).
          *   Alternatives like a demonstration blast, continued blockade/conventional bombing, or awaiting Soviet entry into the Pacific war (which happened days after Nagasaki) weren't exhausted.
          *   The casualty projections for a land invasion (like the often-cited 500,000-1,000,000 US casualties) were highly speculative, potentially inflated for political reasons, and didn't adequately consider alternatives or Japanese desperation.
          *   The bombings themselves killed ~200,000 civilians almost instantly, with many more dying later. Was a land invasion *certain* to kill *more* Japanese civilians than that? It's far from clear.
      *   **Anscombe didn't need to "win" the historical bet to make her moral point.** Her argument is that *even if* the utilitarian calculation were correct, the act was still intrinsically evil. However, she fiercely contested the historical narrative precisely because she saw it as a smokescreen justifying an atrocity.

  4.  **The Institutional Complicity:**
      *   Anscombe's protest wasn't *just* about Truman. It was about **Oxford University conferring an *honor*.** She argued that by honoring Truman, Oxford was morally complicit in endorsing his decision and the principle that such acts can be justified by perceived good consequences. This institutional endorsement, for her, normalized a deeply dangerous moral corruption.

  **Conclusion:**

  You're not wrong that the "saved lives" argument is the most common rebuttal to Anscombe. **However, it fundamentally misses the core of her critique.** She wasn't primarily making a consequentialist bet about body counts (though she disputed those too). She was making a deontological argument about the absolute moral prohibition against intentionally killing the innocent.

  *   **If you accept consequentialism as the *sole* basis for morality,** then the "saved lives" argument might seem decisive (assuming its historical accuracy).
  *   **If you find Anscombe's deontological framework compelling** (that certain acts like intentionally killing innocents are *always* wrong, regardless of consequences), then the "saved lives" argument becomes irrelevant, or even morally dangerous, as it justifies violating a fundamental prohibition.

  **Her argument "holds up" if you accept its foundational moral premises.** It challenges us to confront whether we believe there are absolute moral limits on action, even in war, or whether *any* act can be justified by sufficiently beneficial consequences. The ongoing debate about Hiroshima and Nagasaki isn't just about historical accounting; it's a profound clash between these two fundamental approaches to ethics. As a physicist turned philosopher, you're uniquely positioned to appreciate the weight of both empirical claims *and* the logical structure of competing moral frameworks. Anscombe forces us to choose which foundation we build upon.
