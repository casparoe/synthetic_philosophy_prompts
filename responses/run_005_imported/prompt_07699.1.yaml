answer: |-
  Here’s a draft of the exchange, aiming for the nuance, mutual respect, and unresolved tension you’re seeking:

  **Setting:** The Philosophy Department’s cramped reception room. Plastic cups of cheap wine, a picked-over cheese board. Low hum of post-colloquium chatter. Ines spots Teodor near the window, nursing his wine.

  **Ines:** Teodor. Still peddling the ‘moral self-reliance’ manifesto? Your talk had whiffs of it.  
  **Teodor:** (Smirking) Ines. Still outsourcing your conscience? Some things never change. Though your question about constitutive norms was sharp. As always.  
  **Ines:** Flattery won’t derail me. Seriously, Teodor. We defer to geologists about rocks, cardiologists about hearts. Why carve out morality as uniquely resistant to testimony? What’s the *relevant asymmetry*?  
  **Teodor:** It’s not about *resistance*, it’s about *what’s transmitted*. Take your cardiologist. I trust her *diagnosis* – the *fact* of the blocked artery. But morality isn’t just about knowing *that* something is wrong. It’s about *grasping why* it’s wrong. Testimony gives you the belief, maybe even a true belief. But it doesn’t give you *understanding*.  
  **Ines:** Understanding? So if I tell you torturing innocents for fun is wrong, and you believe me solely on my say-so, you lack moral understanding? Even if the belief is true and justified?  
  **Teodor:** Precisely. You lack the grasp of the *reasons* – the suffering, the violation of autonomy, the degradation. You can’t *extend* that verdict to a novel case. You can’t weigh conflicting reasons properly. Worse, *caring* about the right thing seems tied to that grasp. Do you really *care* about the suffering if you only know it’s wrong because Ines said so?  
  **Ines:** But that feels like moving the goalposts! Epistemically, the belief *is* justified. It’s true! The asymmetry vanishes. Why demand *more* for moral knowledge than for geological knowledge? If I believe the core is molten on a geologist's say-so, I don't grasp convection currents or radioactive decay. I just have a reliable belief. Why isn't that enough for morality?  
  **Teodor:** Because morality *demands* action guided by the right reasons! Imagine someone who becomes a committed vegetarian *purely* because their trusted partner says "eating meat is wrong." They never think about animal suffering, environmental impact, Kantian respect... nothing. They just obey.  
  **Ines:** And? If eating meat *is* wrong, they hold a true belief and act rightly! What’s the defect?  
  **Teodor:** The defect is *in them*! Epistemically? Fine, maybe their belief is justified if the partner *is* an expert. But *morally*? They’re like a child parroting rules. They lack moral *agency*. They can’t explain *why* to a skeptic. If the partner changes their mind, they switch too. They haven’t internalized the *reasons* – they’re just loyal.  
  **Ines:** But *acting* rightly matters! If they save animals from suffering, does the *source* of their motivation negate the good? And epistemically, why dismiss testimony? Isn’t relying on others’ expertise *rational*? Demanding everyone personally derive every moral truth is paralyzing!  
  **Teodor:** It’s not about *deriving from scratch*. It’s about *engaging* with the reasons, making them your own. Testimony can *start* that process – "Partner says it's wrong? I should look into why." But stopping at "Partner says so" is... intellectually and morally lazy. It avoids the hard work of moral reasoning, which is *part* of being a good person.  
  **Ines:** "Lazy"? That’s harsh. Maybe they trust their partner deeply! Maybe they focus their intellectual energy elsewhere. Is a physicist who trusts their doctor on heart medicine "lazy"? Or just rationally allocating cognitive resources? Why is morality different?  
  **Teodor:** Because the physicist’s trust in the doctor doesn’t absolve them of understanding their *own health* decisions at *some* level. And morality permeates *everything*. It’s about *who you are*. The vegetarian who doesn’t grasp the reasons isn’t *responding* to the moral reality – they’re responding to their partner. Their action isn’t *virtuous*; it’s obedient.  
  **Ines:** So the defect is *character*, not belief? They have a true, justified belief, but they’re... morally deficient *as agents*?  
  **Teodor:** Exactly! The epistemic justification might be there. But the *moral worth* of their action, their *standing* as a moral agent, is compromised. They aren’t *sensitive* to the moral features of the world; they’re sensitive to their partner’s pronouncements.  
  **Ines:** But if the partner is reliably tracking those moral features... isn’t that sensitivity *by proxy*? Like using a Geiger counter for radiation?  
  **Teodor:** (Sighs, takes a sip) A Geiger counter doesn’t need to *understand* radiation. A moral agent *does* need to understand morality. That’s the asymmetry. Morality isn’t just facts *out there*; it’s about *our practical reasoning*, our reasons for action, our character. Testimony can't transmit *that*.  
  **Ines:** So... we agree the vegetarian has a justified true belief? But you think there's a further, *moral* failing in *how* they hold it? While I think it’s a rationally permissible, even praiseworthy, division of epistemic labor?  
  **Teodor:** Praiseworthy? No. Permissible in a pinch, maybe. But ultimately... deficient. Yes. The failing is in their agency, not necessarily their belief’s truth-status.  
  **Ines:** And I still think that sets an impossibly high, strangely individualistic bar for moral life. We *live* on trust, Teodor. Especially in complex worlds.  
  **Teodor:** We do. But perhaps we *shouldn't*, not like this. Not when it comes to what matters most. (He gestures vaguely at the room, the books, the chatter). Seems we still disagree on what morality fundamentally *is*, and what it demands of us.  
  **Ines:** (Raises her plastic cup slightly) Some things never change. Good to see you, Teodor. Still wrong, but good to see you.  
  **Teodor:** (A faint, genuine smile) Likewise, Ines. Still evading the hard work, but likewise.

  **Key Disagreements Sharpened:**
  1.  **The Scope of Epistemic Justification:** They tentatively agree testimony *can* provide justified true moral belief (Ines's core point secured), but...
  2.  **The Moral Significance of Understanding:** Teodor insists true belief via testimony is insufficient for *full moral agency* or *virtuous action*. The "how" matters morally.
  3.  **The Analogy's Limits:** Ines sees the doctor/geologist analogy as holding strongly, emphasizing rational trust. Teodor sees morality as fundamentally different because it inherently involves practical reasoning, character, and responsiveness to reasons *directly*, not just belief in facts.
  4.  **The Vegetarian Case:** Agreed: True belief? Likely. Justified? Probably. Acting rightly? Yes. *But*... Teodor sees a moral defect in the *agent* (lack of understanding/virtue), while Ines sees a rational, potentially praiseworthy reliance on trust within a relationship/division of labor.

  **End State:** No resolution. Mutual respect intact. The core disagreement crystallized around whether morality demands *personal understanding* for genuine agency/virtue (Teodor) or whether reliably true belief and right action, even via trust, is sufficient (Ines), with the asymmetry debate now focused on the unique *practical* and *agential* demands of morality versus other domains.
