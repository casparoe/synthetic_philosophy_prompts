answer: |-
  ## The Problem of Old Evidence: Can Bayesianism Be Saved?

  You've hit on one of the deepest and most persistent wounds in Bayesian confirmation theory. The Mercury perihelion precession *is* a canonical example: Einstein knew Mercury's anomalous precession (E) long before developing General Relativity (GR → H). If P(E) = 1 (because E is known), then Bayes' theorem gives P(H|E) = P(H|E) * P(E) / P(E) = P(H|E) — no confirmation boost. Yet intuitively, E *massively* confirmed GR. This is the **Problem of Old Evidence (POE)**. It exposes a tension between Bayesian formalism (requiring probabilities defined relative to an agent's current knowledge) and scientific practice (where known anomalies become powerful evidence for new theories).

  Let's dissect the major solutions, their objections, and why I believe Bayesianism *can* be salvaged — but only by embracing a specific, radical interpretation.

  ### The Contenders: Proposed Solutions & Their Fatal Flaws

  1.  **The Garber/Jeffrey/Niiniluoto (GJN) Solution: Learning the Entailment**
      *   **Core Idea:** When Einstein derives GR and realizes it entails E, the *new evidence* isn't E itself (which is old), but the proposition **S: "H logically entails E"**. We conditionalize on S, not E. Confirmation comes via P(S|H) / P(S). Since P(S|H) is high (if H is true, it likely entails its consequences) and P(S) might be low (it wasn't obvious *any* theory would entail that exact precession), we get a boost.
      *   **Appeal:** It captures the "aha!" moment. The cognitive effort of deriving E from H feels like genuine learning.
      *   **Devastating Objections:**
          *   **The Logical Omniscience Dodge?** GJN relaxes logical omniscience (agents don't know all entailments). But POE strikes *even if* the agent isn't logically omniscient. Einstein *knew* E before formulating H. P(E) was already 1 *in his actual probability function* before he ever considered GR. Conditionalizing on S doesn't change P(E) from 1.
          *   **The Static Problem Remains:** Imagine a *contemporary* scientist, long after GR is accepted. For *them*, E is known (P(E)=1) *and* S is known (P(S)=1). Calculating P(H|E, S) collapses again. GJN only addresses the *psychological moment of discovery* for the *original theorist*. It doesn't solve how E confirms H *for science in general* once both are known. This is the "static" POE your friend mentioned.
          *   **Is S Really New *Evidence*?** S is a fact about the *relationship* between H and E, not about the world. Conditionalizing on S feels like updating on a logical truth discovered through deduction, not empirical evidence. Bayesianism is supposed to handle empirical confirmation.

  2.  **Howson's Counterfactual Solution: What If We Didn't Know E?**
      *   **Core Idea:** Calculate the *counterfactual* probability of E *before it was known*. The degree of confirmation is P(E|H) / P(E), where P(E) is evaluated in a hypothetical epistemic state **K-**, which is your *current* background knowledge **K** *minus the old evidence E*. We ask: "How surprising would E have been *before* we learned it?"
      *   **Appeal:** It directly targets the intuition that E's power comes from its *prior unexpectedness*. It solves both the "dynamic" (Einstein's moment) and "static" (modern scientist) problems by always using this counterfactual probability.
      *   **Devastating Objections:**
          *   **The Contamination Problem:** Knowledge isn't modular. Removing *just* E from K is often impossible because K contains countless propositions *influenced by* E. Einstein's K in 1915 was saturated with knowledge *dependent* on decades of celestial mechanics relying on Mercury's orbit. Removing *only* E leaves a mangled, incoherent K-.
          *   **Defining K- is Arbitrary & Unworkable:** How far back do we go? What *exactly* gets removed? Does K- include theories developed *because* of the anomaly E? (E.g., Newtonian attempts to explain Mercury). The counterfactual state K- is ill-defined and highly subjective.
          *   **Loss of Actuality:** Bayesian probabilities are traditionally defined relative to the agent's *actual* current knowledge state. Counterfactual probabilities feel like a different beast grafted onto the framework.

  3.  **The "Bite the Bullet" Solution: Deny the Intuition**
      *   **Core Idea:** Strict Bayesians sometimes argue the intuition is wrong. Once E is known, it *cannot* provide *further* confirmation. Any feeling that it does is a psychological error. The confirmation happened when E *was* new evidence supporting whatever theory was current *then* (e.g., Newtonian mechanics plus perturbations). GR's success is just consistency with known facts, not new confirmation.
      *   **Appeal:** It preserves the formal Bayesian machinery untouched.
      *   **Devastating Objection:**
          *   **Contradicts Scientific Practice & Rationality:** This is wildly counterintuitive and clashes with how science works. Mercury's precession *was* a major reason GR was accepted *over* alternatives. If GR had merely *failed to contradict* known facts, it would have been weak. Its power came from *precisely explaining a known anomaly that defeated the reigning theory*. Denying this confirmation force renders Bayesianism descriptively and normatively inadequate for scientific reasoning.

  ### The Verdict: Salvaging Bayesianism with Radical Counterfactuals

  **Bayesian confirmation theory *can* be saved from the Problem of Old Evidence, but only by fully embracing Howson's counterfactual approach and radically rethinking what background knowledge "K" means in scientific contexts.** Here's my defense:

  1.  **The Core Insight:** The confirmatory power of old evidence *is* inherently counterfactual. We are *always* asking: "How much does this hypothesis *H* increase the probability of this phenomenon *E* **compared to how likely we would have thought E was *before* we knew about it and before H existed?**" This comparison is fundamental to assessing explanatory power. Newtonian mechanics set an expectation for Mercury's behavior; GR explained the *deviation* from that expectation. The relevant P(E) is the probability assigned to that *specific deviation* within the pre-GR, pre-anomaly-resolved epistemic framework.

  2.  **Defusing the Contamination Objection:** The contamination problem is real but manageable *if we interpret K- historically and holistically*. We don't surgically remove *only* the fact E. We consider a **plausible historical epistemic state K-**, characteristic of the relevant scientific community *before E was observed (or before its anomalous nature was recognized)* and crucially, *before H was conceived*. For Mercury:
      *   **K- (c. ~1845):** Knowledge includes Newtonian mechanics, perturbation theory, known planetary masses/distances, Le Verrier's calculations predicting orbits *assuming Newton is complete*. Within this K-, the probability P(E | K-) — the probability assigned to Mercury precessing *precisely 43 arcseconds per century more than Newtonian predictions* — was **very low**. It was seen as an unsolved anomaly, perhaps due to observational error or an unknown planet (Vulcan). Let's say P(E | K-) ≈ 0.1 (highly uncertain/residual error).
      *   **P(E | H & K-):** GR, *if it had been proposed within the conceptual framework of K-*, would predict E with extremely high probability (≈1). Einstein derived it specifically to match.
      *   **The Ratio:** P(E | H & K-) / P(E | K-) ≈ 1 / 0.1 = 10. A substantial confirmation boost, capturing the historical significance.

  3.  **Solving the Static Problem:** This approach *directly* solves the static problem. For the modern scientist, the question isn't "What's P(E) given my *current* knowledge (where E is a fact and GR is true)?" That *is* 1. The relevant question for confirmation is: "How much did GR *increase the probability* of E relative to the best understanding *before* GR resolved the anomaly?" The counterfactual ratio P(E | H & K-) / P(E | K-) is a *fixed historical measure* of the hypothesis's explanatory power regarding that specific anomaly. It doesn't change over time. Bayesianism can incorporate this as a measure of **explanatory success relative to prior expectation**, even if the literal probability of E given *current total* K is 1.

  4.  **Why This Over GJN?** GJN focuses on the agent's *logical ignorance*. But POE is fundamentally about *explanatory power*, not ignorance of entailment. Knowing S ("H entails E") is only impressive if E was antecedently surprising or problematic. GJN fails the static test and mislocates the source of confirmation (in the entailment discovery rather than the resolution of prior anomaly). Counterfactuals target the core issue directly.

  5.  **Addressing the "Different Beast" Objection:** Yes, counterfactual probabilities are different from synchronic probabilities relative to current K. But this is a *strength*, not a weakness. Science is a historical process. Confirmation often involves assessing how a hypothesis *changes our understanding of the past*. Bayesianism needs the conceptual tools to model this historical dimension. Counterfactual probabilities are those tools. They aren't "grafted on"; they are essential for a Bayesian account of explanatory power in historical contexts.

  **The Commitment:** Bayesian confirmation theory, augmented by a consistent application of *historically grounded counterfactual probabilities* to evaluate P(E) for old evidence, successfully resolves the Problem of Old Evidence. It preserves the core Bayesian intuition (confirmation as probability-raising) while accommodating the historical and explanatory nature of scientific evidence. The apparent "collapse" of P(E|H)/P(E) when P(E)=1 reflects a *misapplication* of the formalism – using the *wrong* probability measure for P(E). The relevant P(E) is always the counterfactual probability representing the expectation *before* the hypothesis resolved the anomaly. This solution is workable (historians and scientists reconstruct past epistemic states routinely), captures the intuition (Mercury *was* strong evidence because it was a known failure of the old theory), and resolves both dynamic and static versions of POE. **Bayesianism survives, but it requires acknowledging that rational confirmation assessments sometimes necessitate stepping outside an agent's *current* knowledge state to consider the historical trajectory of scientific understanding.**

  *Addendum: The Non-Bayesian Patch Temptation:* While I argue Bayesianism *can* be saved, some (e.g., Clark Glymour) see POE as fatal and advocate for non-Bayesian measures of confirmation based purely on explanatory coherence or entailment relations (e.g., hypothetico-deductivism). These avoid POE but face their own severe problems (irrelevant conjunctions, grue-like hypotheses). The counterfactual Bayesian solution, while demanding, remains the most comprehensive framework integrating probabilistic reasoning with the historical dynamics of science. The bullet does not need to be bitten; Mercury's precession still confirms GR, and Bayesians *can* account for it.
