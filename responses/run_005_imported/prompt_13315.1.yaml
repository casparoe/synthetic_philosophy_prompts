  First, I need to confirm if plate tectonics aligns with Kuhn's model. Wegener's evidence was there, but rejected because he lacked a mechanism. The fixist paradigm couldn't accommodate mobilism. That fits Kuhn's normal science vs. crisis. The revolution wasn't until paleomagnetic data and seafloor spreading provided a mechanism, leading to a paradigm shift.

  Incommensurability means the two sides couldn't fully communicate—different standards, problems, data interpretation. Fixists saw fossil matches as land bridges; mobilists as continental drift. So yes, incommensurability applies. The shift involved generational turnover, as older scientists held onto fixism while new ones embraced mobilism with fresh data.

