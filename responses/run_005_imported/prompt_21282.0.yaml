prompt: |-
  Ok, this has been bugging me since it happened. I sit on the jury for a smallish science journalism prize, and this year we switched to ranked-choice voting because everyone agreed it'd be the fairest way to pick a winner among the five finalists. Afterward, one of the other judges admitted she didn't rank her actual favorite piece first — she put a solid, crowd-pleasing runner-up on top instead, since she figured her real favorite had no shot and didn't want her ballot to end up helping the entry she liked least actually win. That felt like exactly the kind of gaming ranked-choice voting is supposed to make pointless, and yet it clearly worked out fine for her anyway. I write about science and ideas for a living and still can't answer my own question here: is there some voting rule where being honest about your rankings is always your best strategy, no matter how many candidates their are, or is this kind of gaming just unavoidable once you've got three or more options on the ballot?
reasoning: |-
  Okay, the user is a science journalist who served on a jury for a science journalism prize. They switched to ranked-choice voting (RCV) this year, thinking it would be fairer. But after the voting, another judge admitted she strategically ranked her second choice first because she thought her actual favorite couldn't win and didn't want her least favorite to benefit. This has left the user confused because they thought RCV was supposed to prevent such gaming.

  The user's main question is whether any voting system exists where being honest is always the best strategy, regardless of the number of candidates. They're wondering if strategic voting is unavoidable with three or more options.

  First, I need to recall the Gibbard-Satterthwaite theorem. It states that for three or more options, no ranked voting system can be both strategy-proof and democratic. That means in any such system, there will be scenarios where voters can benefit by not ranking honestly. So the user's observation aligns with this theorem.

  The user might be looking for a deeper understanding of why RCV didn't prevent gaming in their case. They might also want to know if there's any alternative system that minimizes this issue, even if it's not perfect. Since they're a science journalist, they probably appreciate a clear explanation of the theoretical limits, possibly for an article or their own knowledge.

  I should explain that while no system is perfect, some alternatives like approval voting or score voting might reduce strategic incentives. Approval voting allows voters to select all candidates they approve of, which is simpler and might encourage honesty. Score voting lets voters rate candidates, which can express preferences more granularly.

  But even these systems have flaws. Approval voting can lead to bullet voting, and score voting might encourage min-max strategies. The key point is that strategic voting is theoretically unavoidable in any system with multiple candidates. However, the frequency and impact can vary.

  The user might also be concerned about the fairness of their prize selection process. They might want reassurance that RCV is still a good choice despite this flaw. It's important to mention that while strategic voting is possible, RCV often works well in practice and is better than plurality voting.

  In summary, the answer is that no perfect system exists, but some systems are better than others. The user's experience with RCV is a common example of the Gibbard-Satterthwaite theorem in action. Providing this context should address their core question and help them understand the limitations of voting systems.
answer: |-
  You've hit on one of the most profound and frustrating truths in social choice theory, and your intuition is spot on. The situation you describe highlights the core dilemma identified by the **Gibbard-Satterthwaite theorem**, a landmark result in economics and political science.

  Here's the breakdown:

  1.  **The Bad News (Gibbard-Satterthwaite Theorem):** This theorem, proven independently by Allan Gibbard (1973) and Mark Satterthwaite (1975), states that **no ranked voting system can simultaneously satisfy all three of these conditions when there are three or more candidates:**
      *   **Non-dictatorship:** No single voter always gets their way.
      *   **Pareto Efficiency:** If every voter prefers candidate A over candidate B, then B cannot win.
      *   **Strategy-Proofness (Incentive Compatibility):** It is always optimal for every voter to honestly reveal their true preferences (ranking), no matter what others do.
      *   **Corollary:** For any "reasonable" (non-dictatorial, Pareto efficient) voting system with three or more alternatives, there will *always* be situations where *some* voters can benefit by voting *strategically* (misrepresenting their true preferences), just like your fellow juror did.

  2.  **What This Means for Your Scenario:**
      *   **Ranked-Choice Voting (RCV/Instant Runoff) is NOT strategy-proof.** Your fellow juror correctly identified a potential situation where her honest vote (ranking her true favorite first) *might* lead to her least favorite winning (if her favorite was eliminated early, and her vote didn't transfer to her compromise candidate). By ranking her "solid runner-up" first, she ensured her vote counted for that candidate throughout the process, increasing their chance of beating her least favorite. This is a classic form of strategic voting called **"compromising"** or **"burial avoidance."**
      *   **Her strategy worked *because* of RCV's mechanics.** RCV's elimination rounds create specific points where a voter's lower preferences become crucial. This structure inherently creates opportunities for strategic manipulation based on predictions about who will be eliminated early.
      *   **It's unavoidable *in principle* for any ranked system.** Gibbard-Satterthwaite tells us this isn't a flaw *specific* to RCV, but a fundamental mathematical limitation of *any* system where voters submit ranked ballots and we want a fair outcome with 3+ options. Strategic voting is theoretically possible in *any* such system.

  3.  **Is There *Any* Hope? Partial Mitigations & Alternatives:**
      *   **No Perfect Solution:** Gibbard-Satterthwaite is a devastating *impossibility theorem*. There is **no** voting rule using ranked ballots that makes honest ranking always the best strategy for every voter in every possible situation with 3+ candidates.
      *   **Systems with Different Ballots:** The theorem applies specifically to systems where voters submit a strict *ranking* of *all* candidates. Systems using different ballot formats *might* have different strategic properties:
          *   **Approval Voting:** Voters can select ("approve") *any number* of candidates they find acceptable. The candidate with the most approvals wins.
              *   **Strategy:** The main strategy is deciding your "approval threshold." It can be optimal to "bullet vote" (approve only your absolute favorite) if you think they have a real chance, or to approve multiple candidates strategically. However, it's often easier to vote sincerely (approving everyone you genuinely like) without major penalty. **It generally has *fewer* and *less severe* strategic incentives than ranked systems.** Your juror could have approved both her true favorite and her solid runner-up.
          *   **Score Voting (Range Voting):** Voters give each candidate a numerical score (e.g., 0-5). The candidate with the highest average score wins.
              *   **Strategy:** The main strategy is "min-maxing" (giving your favorite the max score, your least favorite the min score, and scoring others based on utility). While not perfectly strategy-proof, it allows for more expressive honesty than ranked ballots. Your juror could have given her true favorite a 5, her solid runner-up a 4, and her least favorite a 0.
          *   **STAR Voting (Score Then Automatic Runoff):** Combines Score Voting with an automatic top-two runoff using the scores to determine the top two.
              *   **Aims:** Designed to mitigate some of the min-maxing strategy in pure Score Voting while providing a majority winner. Strategic incentives are complex but potentially less damaging than RCV.
      *   **Reducing *Impact* and *Frequency*:** While no system eliminates strategy, some systems make it:
          *   **Less Rewarding:** The potential gain from strategic voting might be smaller.
          *   **Less Necessary:** Sincere voting might be optimal more often.
          *   **Harder to Execute:** Voters need more precise information about others' preferences to strategize effectively. Systems like Approval or Score can be simpler in this regard.
          *   **Less Damaging:** Strategic votes might distort the outcome less severely.

  **Conclusion for your Jury Prize:**

  *   **The Gaming Wasn't Pointless:** Your fellow juror acted rationally based on Gibbard-Satterthwaite. RCV *didn't* prevent her strategic vote, and it *could* have been optimal for her. Her strategy exploited a known vulnerability in RCV (and any ranked system).
  *   **Unavoidable in Principle:** Yes, this kind of strategic voting is fundamentally unavoidable once you have three or more options, *if* you use a ranked ballot system (and want fair outcomes). No such system exists where honest ranking is *always* the best strategy.
  *   **Alternatives Exist (But Aren't Perfect):** Systems like Approval Voting or Score Voting might reduce the *incentive* or *impact* of this specific type of strategic voting ("compromising" to avoid a worse outcome). They allow voters to express support for multiple candidates without strict ranking, making the strategy your juror used less necessary or impossible. However, they introduce different strategic considerations (like bullet voting in Approval or min-maxing in Score).

  **In essence:** You witnessed Gibbard-Satterthwaite in action. It's a profound limitation of democratic decision-making with multiple options. While no system is perfect, understanding this theorem helps explain why strategic voting occurs and why choosing a voting rule involves trade-offs between fairness, resistance to strategy, simplicity, and the type of ballot used. For a small jury, Approval Voting might be worth considering as a simpler alternative with potentially less incentive for the specific "favorite betrayal" strategy you observed.
