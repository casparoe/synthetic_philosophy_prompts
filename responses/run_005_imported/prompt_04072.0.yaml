  Now they're questioning the diachronic Dutch book argument for conditionalization. Someone in a thread claimed that failing to update via conditionalization makes you vulnerable to a similar sure-loss setup across time. The user feels this inference is too quick but can't articulate why. They want to understand the disanalogy between the synchronic and diachronic cases, especially whether sure-loss vulnerability implies the same kind of irrationality, and what extra assumptions the diachronic argument relies on.

  First, I need to recall the key differences between the two arguments. The synchronic argument is about static consistency—your beliefs at a single time must cohere to avoid a Dutch book. The diachronic argument involves beliefs changing over time in response to evidence. The user suspects that time adds complexity, and they're right. 

  The diachronic argument assumes that the bookie knows your updating rule in advance. That's a big deal. In the synchronic case, the bookie only needs your current betting quotients. But for the diachronic argument, the bookie must know how you'll update upon seeing E. This implies you're pre-committed to an update rule, which feels different. Are we rationally required to have such pre-commitments? That's debatable.

  Also, the diachronic Dutch book doesn't just target conditionalization. Any deviation from it can be exploited, but only if the bookie knows your rule. If your update rule is private or changes unpredictably, the bookie can't set up the bets. So vulnerability here depends on transparency of your rule, which isn't an issue in the synchronic case. That seems like a key disanalogy.

  The user is also asking whether sure-loss vulnerability means the same kind of irrationality in both cases. In the synchronic argument, it's about internal consistency—your beliefs contradict each other. In the diachronic case, it's more about failing to follow through on a plan. If you plan to update one way but do another, that's a different flaw. It's like a New Year's resolution you break—not necessarily irrational at the moment, just inconsistent with past intentions. 

  Another point: conditionalization requires that your prior credences are defined over the evidence space. If you didn't consider E possible initially, conditionalizing on it is undefined. Real people often encounter unexpected evidence. The diachronic argument assumes you've already assigned non-zero probability to E, which isn't always realistic. The synchronic argument doesn't have this limitation.

  I should also mention that there are other updating rules, like Jeffrey conditionalization for uncertain evidence, which the standard diachronic argument doesn't cover. This suggests conditionalization isn't the only rational option, whereas probabilism is more broadly accepted as necessary for coherence.

  The user's deeper need might be to reconcile practical forecasting with formal rationality. They want to know if deviating from conditionalization in real-world scenarios is defensible. They might be encountering cases where strict conditionalization feels impractical, like when evidence is messy or beliefs shift unpredictably. Highlighting the extra assumptions (pre-commitment, transparency, defined priors) shows where the argument's idealizations clash with reality.

  In summary, the disanalogy lies in the assumptions about time, transparency, and prior credences. Sure-loss in diachronic contexts points to a different kind of potential flaw—inconsistent planning rather than static inconsistency. The user's intuition that time changes things is spot-on, and their skepticism about generalizing the argument is justified.
answer: |-
  You've hit on a profound and contentious point in formal epistemology. Your skepticism is well-founded: the synchronic and diachronic Dutch book arguments (DBAs) **do not carry equivalent normative force**, and generalizing from one to the other requires significant, contestable assumptions. Below is a structured critique of the diachronic DBA for conditionalization, highlighting key disanalogies and extra assumptions.

  ---

  ### **1. Core Disanalogy: Static vs. Dynamic Rationality**
     - **Synchronic DBA (Probabilism):**  
       Targets *logical inconsistency within a single belief state*. If your credences violate probability axioms (e.g., P(A) + P(¬A) ≠ 1), you hold contradictory beliefs *simultaneously*. The bookie exploits this internal contradiction.  
       **→ Irrationality:** Violating basic logic/consistency at a fixed time.  
       
     - **Diachronic DBA (Conditionalization):**  
       Targets *inconsistency between belief states across time*. If upon learning E, your posterior Pₜ(H|E) ≠ your prior conditional P₀(H|E), the bookie exploits the mismatch between your *past* and *present* commitments.  
       **→ Disanalogy:** It conflates *intratemporal* coherence (consistency now) with *intertemporal* coherence (consistency with your past self). Failing the latter isn't obviously "irrational" in the same way—it may reflect learning, context shifts, or new insights.

  ---

  ### **2. Critical Extra Assumptions in the Diachronic DBA**
  The diachronic argument **only works under strong idealizations** absent in the synchronic case:

  - **Assumption 1: Pre-Commitment to an Updating Rule**  
    The bookie must know *in advance* how you plan to update on *any possible evidence E*. This assumes you publicly pre-commit to a specific updating policy (e.g., "I'll set Pₜ(H) = P₀(H|E) if I see E").  
    **Problem:** Rational agents aren't required to pre-commit to belief updates. If you update differently because E surprises you or reveals flaws in your prior model, that isn't irrational—it's *learning*. The synchronic DBA requires no such pre-commitment.

  - **Assumption 2: Bookie's Omniscience of Your Rule**  
    The bookie exploits you *only if* they know your updating rule beforehand. If your response to E is unpredictable (e.g., you reassess your entire model), no Dutch book is possible.  
    **Synchronic contrast:** A bookie can exploit synchronic incoherence *solely* from your current odds—no knowledge of your past/future beliefs is needed.

  - **Assumption 3: Rigid Designation of Evidence**  
    Conditionalization requires E to be a "certain" observation (P(E) = 1 after update). If evidence is ambiguous (e.g., "I saw something blue, but I'm not sure"), Jeffrey conditionalization is needed—and the diachronic DBA *fails* for Jeffrey updating.  
    **Problem:** Real-world evidence is rarely certain. The synchronic DBA applies universally, regardless of evidence type.

  - **Assumption 4: No Belief Revision Beyond E**  
    The argument assumes learning E doesn't alter your trust in other beliefs (e.g., your probability model). If E causes you to doubt your prior model (e.g., "This data suggests my whole calibration is off"), conditionalizing on the prior becomes suspect.  
    **Example:** If E is "I see 10,000 coin flips of a fair coin, all heads," sticking to P₀(H|E) is *less rational* than doubting your fairness assumption.

  ---

  ### **3. Does Sure-Loss Vulnerability Imply the Same Irrationality?**
     - **Synchronic Loss:** Demonstrates *actual inconsistency* in your current beliefs. You simultaneously endorse bets that contradict logic (e.g., betting for both A and ¬A at odds guaranteeing loss). This is a clear defect.  
     - **Diachronic Loss:** Demonstrates *vulnerability due to predictability*. Your "loss" arises from a bookie exploiting your *past* commitments, not your current beliefs. If you rationally change your mind upon seeing E (e.g., "My prior was poorly calibrated"), the loss reflects the bookie's manipulation of your earlier state—not present incoherence.  
     **→ Key Point:** Diachronic sure-loss is about *failing to satisfy your past self's expectations*, not holding inconsistent beliefs *now*. This is a weaker form of "irrationality" (if it is one at all).

  ---

  ### **4. Alternatives to Conditionalization Can Be Rational**
  The diachronic DBA pretends conditionalization is the *only* rational update rule. But consider:
  - **Jeffrey Conditionalization:** Updates on uncertain evidence (e.g., P(E) < 1).  
  - **Objective Bayesian Updates:** Adjust beliefs using principles like maximum entropy.  
  - **Model-Switching:** Abandon a prior model entirely after E (e.g., "This evidence proves my prior was wrong").  
  All can be rational but are vulnerable to diachronic Dutch books *if pre-committed and predictable*. This vulnerability doesn't condemn them—it condemns rigidity.

  ---

  ### **5. A Better Defense of Conditionalization?**
  Conditionalization isn't without merit—it minimizes belief revision (per the *principle of minimum cross-entropy*) and avoids memoryless updates. But the diachronic DBA is a poor argument for it. Stronger justifications include:
  - **Conservation of Relative Odds:** If E doesn't affect hypotheses H₁/H₂ equally, P(H₁|E)/P(H₂|E) should equal P(H₁)/P₂(H₂) × P(E|H₁)/P(E|H₂).  
  - **Coherence with Decision Theory:** Conditionalization ensures future decisions respect past beliefs *if no new model violations occur*.  
  These don't require Dutch books.

  ---

  ### **Conclusion: Where the Inference Fails**
  The diachronic DBA does **not** show that conditionalization is "forced by rationality" like probabilism. It shows that **pre-committing to conditionalization makes you predictable to bookies across time**—a pragmatic, not logical, vulnerability. The synchronic DBA reveals an *immediate logical contradiction*; the diachronic reveals a *potential mismatch in temporal commitments*. Rationality doesn't demand slavish adherence to past beliefs—it demands *responsive, evidence-based reasoning*, which sometimes requires abandoning your prior framework. Your instinct that "time changes everything" is correct: diachronic coherence is a *different game* with *different rules*.

  ###### *Further reading:*
  - *David Lewis* (1976) first proposed the diachronic DBA but later expressed doubts.  
  - *Sherri Roush* ("Tracking Truth", 2005) critiques DBAs as conflating pragmatic and epistemic norms.  
  - *Richard Pettigrew* ("Accuracy and the Laws of Credence", 2016) defends conditionalization via *accuracy dominance* instead of Dutch books.
