answer: |-
  You're absolutely right to feel that your friend's reasoning is flawed - it's a classic example of "diffusion of responsibility," a psychological phenomenon where people in a group feel less personal accountability because the action is shared. Here's why "everyone did it" doesn't mean "no one is responsible":

  1.  **Individual Actions Matter:** While no *single* person *orchestrated* the entire pile-on, every single person who participated made an *individual choice* to:
      *   Share the video (initial spread).
      *   Repost it.
      *   Make a joke.
      *   Add a mocking comment.
      *   Laugh along.
      *   Fail to speak up or defend her.
      *   Fail to report the bullying/harassment.

  2.  **Collective Harm is Built from Individual Choices:** The massive, humiliating impact on the girl ("Video Girl") is the *direct result* of hundreds of these individual choices adding up. Each person who joined in *increased* the harm. Removing responsibility from individuals ignores the causal link between *their specific actions* and the *overall outcome*.

  3.  **The Bystander Effect & Conformity Pressure:** Your friend describes *how* it happens ("everyone just kind of joined in"), but this doesn't *excuse* it. People often join in because:
      *   **Bystander Effect:** They think "someone else will stop it" or "it's not my place."
      *   **Conformity:** They want to fit in, avoid being targeted themselves, or fear being seen as "too sensitive."
      *   **Deindividuation:** In a group (especially online), people feel less personally identifiable and thus less restrained by their usual morals.
      These are *explanations* for the behavior, not *justifications*. Understanding *why* people act badly doesn't mean they aren't *responsible* for choosing to act that way.

  4.  **Shared Responsibility:** In situations like this, responsibility is often **shared**. The person who first shared it outside a trusted context bears significant responsibility. Those who amplified it bear responsibility. Those who mocked bear responsibility. Those who stood by silently bear a different kind of responsibility (for enabling it through inaction). It's not that "no one" is responsible; it's that *many* people share responsibility for their specific contributions to the harm.

  5.  **The Outcome is the Proof:** The result – a girl being publicly humiliated, reduced to a meme, and dehumanized ("Video Girl") – demonstrates that real harm was done. Harm doesn't occur without actions causing it. Attributing this harm solely to an abstract "everyone" or "the group" ignores the concrete actions of the individuals within that group.

  6.  **"Not Deciding" is Still a Choice:** Your friend says "nobody in particular decided to make it a thing." But *choosing to participate* when something cruel is happening *is* a decision. Choosing *not* to stop it or speak against it *is* a decision. Passivity in the face of cruelty enables it.

  **What's wrong with your friend's reasoning:**

  *   **It's a logical fallacy:** Specifically, it resembles "Appeal to the Masses" (argumentum ad populum) – just because many people do something doesn't make it right or absolve individuals.
  *   **It removes agency:** It treats people as mindless automatons swept along by the crowd, ignoring their capacity for independent thought and moral choice.
  *   **It ignores the victim:** The focus is on excusing the perpetrators ("no one's at fault") rather than acknowledging the harm done to the girl.
  *   **It perpetuates harm:** This reasoning allows bullying and public shaming to continue unchecked because "everyone does it."

  **You are correct.** What happened to that girl is messed up. The widespread participation *increases* the responsibility, it doesn't erase it. Every person who shared, joked, or piled on contributed to her humiliation and dehumanization. Every person who saw it and did nothing allowed it to continue. While the *scale* makes it complex, the *responsibility* is distributed among the many individuals who chose to act (or not act) in harmful ways.

  It takes courage to recognize this when others are excusing it. Your empathy and sense of justice are spot on. What happened wasn't inevitable or blameless; it was the result of many individual choices that collectively caused significant harm.
