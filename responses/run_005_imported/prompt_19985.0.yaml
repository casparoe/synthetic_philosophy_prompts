prompt: |-
  Okay, this has been rattling around in my head since the weekend. I tried to cancel a subscription and it took like 20 minutes -- three different "wait, don't go!" discount pop-ups, a screen warning me I'd "lose all my progress," and the cancel button kept relabeling itself every time (one version literally said "no thanks, I like paying full price"), so I had to hunt for it. My partner shrugged it off as normal business stuff, but here's the actual problem: I'm a PM on my own team's app, and our growth lead just pitched the identical playbook for our cancellation flow next quarter -- a countdown timer, a "here's everything you'll lose" screen, and routing cancellations through a phone line instead of a button. Nothing we'd be showing users would technically be false (the discount's real, the features really do go away), so I can't just say we'd be lying to people, but my gut says somethings still off, and "I have a bad feeling" isn't gonna survive a roadmap meeting. Is there an actual principled line between what we'd be doing and a salesperson just being good at their job, or am I overthinking a UX pattern that's basically industry standard at this point?
reasoning: |-
