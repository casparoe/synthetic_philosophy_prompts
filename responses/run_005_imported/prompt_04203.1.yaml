  First, Rousseau argues that theatre doesn't reform morals; it mirrors and flatters existing passions. Then there's the actor's corruption—their profession requires faking virtues, leading to moral decay. Finally, his alternative: participatory festivals where everyone is both performer and audience. The user wants to apply these to influencers. 

  For the mirroring argument, influencers thrive on engagement, so they amplify existing trends rather than challenging them. Algorithms reinforce this, creating echo chambers. That's a direct parallel. 

  Next, the actor's self-corruption. Influencers curate personas, which can lead to a disconnect between their real selves and online identity. Monetization pressures might push them into inauthenticity, similar to Rousseau's actors. 

  The participatory festivals part. Burning Man's "no spectators" rule fits, as do community events like flash mobs or local sports. But once monetized, they lose that essence. The user mentioned pickup basketball vs. watching TV—exactly, the participation is key. 

  The user also wonders if any modern format passes Rousseau's test. Free, non-commercial events might, but anything with monetization or passive consumption would fail. Even Burning Man's commercialization could be an issue. 

  Need to ensure each Rousseau point is clearly tied to modern examples. Also, address the classmate's claim by showing the relevance to influencer culture's curated personas and audience passivity. Highlight how Rousseau's critique of spectatorship applies to streaming and social media today. 

