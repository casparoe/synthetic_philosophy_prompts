answer: |-
  Here's the strongest case for Peters' position, dismantling Samuelson's dismissal by focusing on the core physics of wealth dynamics and the implications of non-ergodicity:

  1.  **Samuelson's Fundamental Error: Misapplying Additive Reasoning to Multiplicative Dynamics:**
      *   Samuelson treats wealth evolution as if it were *additive*, where ensemble averages (expected value) and time averages (realized growth) converge. This is valid for ergodic systems (e.g., wage income). **Wealth under investment/gambling compounds *multiplicatively***. The relevant operator is multiplication, not addition.
      *   Maximizing *expected wealth* (E[W]) is the correct objective *only* for additive dynamics or a single bet. For multiplicative dynamics over time, maximizing E[W] systematically selects strategies that are *guaranteed* to bankrupt almost all individuals in the long run. Consider the classic example:
          *   Bet: 50% chance to double wealth (2x), 50% chance to lose 40% (0.6x).
          *   Expected *Wealth Multiplier per Bet*: E[return] = (0.5 * 2) + (0.5 * 0.6) = 1.3 > 1. Samuelson's E[Utility] (for any concave utility) might accept this bet.
          *   *Realized Time-Average Growth Rate per Bet*: g = (0.5 * ln(2)) + (0.5 * ln(0.6)) ≈ (0.5*0.693) + (0.5*-0.511) ≈ 0.3465 - 0.2555 = 0.091. This implies growth.
          *   **Now, make the bet slightly worse:** 50% chance to triple (3x), 50% chance to lose *everything* (0x).
          *   Expected *Wealth Multiplier*: E[return] = (0.5 * 3) + (0.5 * 0) = 1.5 > 1. E[Utility] (log or otherwise) might still accept if the probability of tripling is high enough relative to ruin.
          *   *Realized Time-Average Growth Rate per Bet*: g = (0.5 * ln(3)) + (0.5 * ln(0)) = (0.5*1.099) + (0.5*(-∞)) = **-∞**. The system is *non-ergodic*. The ensemble average (1.5) is positive, but the time-average growth rate along *any* individual path where ruin eventually occurs (which happens with probability 1 over infinite time) is infinitely negative. Maximizing E[W] leads almost surely to ruin. Maximizing E[ln(W)] = -∞ correctly identifies this as a disastrous bet to avoid. Samuelson's framework fails catastrophically here because it ignores path dependence and absorbing states (ruin).

  2.  **The Irrelevance of Infinite Repetitions (Samuelson's Misplaced Focus):**
      *   Samuelson dismisses the long-run argument by saying "no one lives forever" and that single-bet choices shouldn't depend on hypothetical repetitions. **Peters' point is deeper:** The problem of time-average vs. ensemble average divergence arises *immediately* with multiplicative dynamics, even for *finite* sequences or *single* decisions with future consequences.
      *   Consider an investor with initial wealth W₀ facing two sequential investment opportunities. The outcome of the *first* investment (W₁) becomes the base for the *second* multiplicative growth (W₂ = W₁ * Return₂). The *realized* two-period growth rate is (1/2) * ln(W₂/W₀) = (1/2) * [ln(W₁/W₀) + ln(W₂/W₁)]. This *depends entirely on the specific path taken* (the realized W₁).
      *   Maximizing E[W₂] (the ensemble average) selects a strategy that might make large bets on the first opportunity, potentially leaving little capital (or ruin) for the second, thereby harming the time-average growth *along the actual path*. Maximizing E[ln(W)] inherently respects this path dependence and compounding, allocating capital to balance risk and growth *across the sequence*.
      *   **The "long run" isn't about infinite time; it's about the inherent path dependence and irreversibility introduced by *any* sequence of multiplicative changes.** Samuelson's focus on "indefinitely many repetitions" as the *only* justification for Kelly misses that the justification arises from the *mathematical structure* of wealth dynamics itself, applicable to sequences of any length >1.

  3.  **Utility is Not Arbitrary in Multiplicative Dynamics:**
      *   Samuelson argues log utility is just one arbitrary concave function. **Peters shows that log utility (and hence geometric mean maximization) is uniquely *derived* from the physics of the system, not assumed.**
      *   The *only* quantity whose expectation *equals* the almost-sure long-term time-average growth rate (lim_{T->∞} (1/T) ln(W_T / W_0)) for multiplicative processes is the exponential growth rate, g = E[ln(1+r)]. Maximizing g = E[ln(1+r)] is therefore *objectively* the correct way to maximize the rate at which wealth grows *along an individual's realized path*.
      *   Choosing a *different* utility function (e.g., U(W) = W^{1-γ}/(1-γ), γ ≠ 1) maximizes a *different* objective. If that objective isn't the time-average growth rate (which it generally isn't for γ ≠ 1), then it is *not* optimizing the actual realized wealth trajectory of the individual. It optimizes something else, like the expectation of a psychological valuation at a snapshot in time (the ensemble average), which demonstrably diverges from the individual's realized experience (the time average) in non-ergodic systems.

  4.  **Ensemble Averages vs. Individual Fates: The Crux of Non-Ergodicity:**
      *   Samuelson's expected utility operates on the ensemble average. It tells you what happens *on average* across a large group of identical individuals each following the strategy once, or *on average* across all possible futures for one individual. **Peters emphasizes that an individual doesn't experience the ensemble average; they experience a single path.**
      *   In multiplicative processes with risk (especially with the possibility of significant losses), the ensemble average (E[W_T]) is dominated by a tiny fraction of paths with astronomically high wealth (the "lucky few" who never have a significant loss). The vast majority of paths (representing most individuals) end up with vastly lower wealth. This is the essence of non-ergodicity: the ensemble average (E[W_T]) grows much faster than the *typical* path or the median path.
      *   **Maximizing E[W_T] benefits the lucky few at the expense of the typical individual.** Maximizing the time-average growth rate E[ln(1+r)] (the Kelly criterion) maximizes the growth rate experienced by *virtually every individual path* (excluding a measure-zero set). It aligns the objective with the outcome experienced by the individual making the decisions along their single, unique history.

  5.  **Addressing Samuelson's "Single Bet" Objection:**
      *   Peters argues that *no* rational decision exists in complete isolation. Every financial decision (even a "single" bet) occurs within the context of an individual's ongoing financial life, which unfolds multiplicatively over time. Capital used for one bet is capital *not* available for future opportunities. A large loss impacts *all* future compounding. The multiplicative, sequential nature is inherent.
      *   Furthermore, the Kelly criterion itself provides the optimal fraction of capital to bet *given* that the capital might be used again in the future, even if the specific future opportunities are unknown. It inherently respects the irreversibility of losses in a multiplicative world. Using E[U] with a different utility for a "single" bet ignores this inherent context of ongoing wealth dynamics. Maximizing E[ln(1+ f*r)] for a single bet with fraction `f` isn't about infinite repetitions; it's about optimally preserving capital for the *implicit future* within the multiplicative framework.

  **Conclusion:**

  Samuelson's dismissal fails because it fundamentally misunderstands the implications of multiplicative wealth dynamics. He applies the logic of ergodic (additive) systems to a profoundly non-ergodic system. The divergence between ensemble averages (expected utility) and time averages (realized growth) isn't a theoretical curiosity requiring infinite time; it's an immediate and critical feature governing individual outcomes in any sequence of multiplicative bets or investments.

  Peters demonstrates that maximizing the expected logarithm of wealth (the geometric mean growth rate) is not merely one arbitrary utility choice. It is the *unique* objective function whose expectation equals the almost-sure long-term time-average growth rate realized along an individual's actual wealth trajectory. It avoids the catastrophic ruin inherent in strategies maximizing E[W], respects path dependence and compounding, and optimizes the outcome for the typical individual path rather than benefiting a vanishingly small lucky subset within the ensemble. Kelly isn't justified by infinite repetitions; it's justified by the non-ergodic physics of multiplicative growth. Samuelson's framework, by ignoring this physics, risks prescribing strategies that are optimal *on average across parallel universes* but disastrous for the individual *in their single, realized history*. Peters' ergodicity economics reframes the problem correctly: **optimize the time-average growth of your one realized path, not the ensemble average over paths you will never experience.**
