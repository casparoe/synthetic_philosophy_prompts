  The strongest objections will depend on which path they take. If recommending self-certification, the "due diligence abandonment" argument needs serious engagement. If keeping documentation, the "systemic distrust" critique must be addressed. 

  Noticing the user seems to lean toward self-certification - they called the documentation requirement excessive in their dinner argument analogy. But as committee member, they need neutral framing. The memo can't sound ideological.

  Biggest challenge: proposing a middle path that doesn't just split the difference. The grandfather clause idea from my draft actually came from real university policies - it's about proportionate scrutiny. The fraud concern is real but shouldn't dominate policy; data shows abuse rates are low where self-certification exists.

  Ah, and the timeframe - 2 academic years makes sense because it covers different seasonal pressures (exam periods, internship seasons etc) and allows for COVID-style disruptions which often trigger EC claims. Must emphasize this is a trial period though, not permanent.

  The objection handling section is crucial. Need to validate both sides: "You're right that trust can be exploited... but also right that default suspicion harms education." No strawmanning. 

