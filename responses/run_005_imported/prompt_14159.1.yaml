answer: |-
  You've pinpointed a crucial distinction in cosmological arguments, and your confusion is completely understandable. **Your friend is defending a *specific type* of cosmological argument (often called the "Kalam" argument), which *is different* in a fundamental way from the arguments presented by Leibniz and Aquinas (often called "Leibnizian" or "Thomistic" arguments).** While both types aim to establish a necessary being (God), they rely on *different premises* and address *different kinds* of dependency.

  Here's a breakdown of the key differences:

  1.  **The Kalam Cosmological Argument (Your Friend's Approach):**
      *   **Core Premise:** **Everything that *begins to exist* has a cause.**
      *   **Scientific Support:** Relies heavily on cosmology (Big Bang, Borde-Guth-Vilenkin theorem) to argue **the universe *began to exist***.
      *   **Conclusion:** Therefore, the universe has a cause. This cause must be timeless, spaceless, immensely powerful, and personal (uncaused) – identified as God.
      *   **Dependency:** **Temporal Causation.** It focuses on a *first event* in time. An infinite past is seen as logically impossible or ruled out by physics.
      *   **Vulnerability:** Its success *critically depends* on the scientific claim that the universe had an absolute temporal beginning. If future cosmology showed the universe *could* be eternal (e.g., certain quantum gravity models, cyclic models), this argument would be severely weakened or fail.

  2.  **The Leibnizian/Thomistic Cosmological Argument (Contingency Argument):**
      *   **Core Premise:** **Every *contingent* thing requires an explanation for its existence (a "sufficient reason").** Contingent = could possibly not exist.
      *   **Focus:** Explains *why there is something contingent rather than nothing at all*. It asks for the reason for the *existence* of the contingent series/whole, *regardless of its duration in time*.
      *   **The Series:** Argues that the *entire collection* of contingent things (whether finite *or* infinite in past duration) is itself contingent. An infinite chain of contingent causes doesn't explain why *any* contingent things exist at all. It's like an infinite chain of hanging books – each book is held up by the one above, but the *entire chain* still needs something to hold *it* up, or it wouldn't exist.
      *   **Dependency:** **Explanatory Dependency / Ground of Being.** It focuses on *ontological* dependence, not necessarily temporal sequence. Why is there being rather than non-being? What sustains the existence of contingent reality?
      *   **Conclusion:** Therefore, there must exist a *necessary being* (a being whose non-existence is impossible) that explains the existence of the contingent universe. This being exists in and of itself (*ens a se*), is non-contingent, and is identified as God.
      *   **Vulnerability:** Its success depends on the metaphysical principles (Principle of Sufficient Reason - PSR) and the claim that the totality of contingent things requires an external explanation. It is largely *immune* to discoveries about the universe's *age*. An eternal universe composed of contingent beings would still require a necessary ground.

  **Why They Are Different Arguments:**

  *   **Different Starting Points:** Kalam starts with *beginning to exist*; Leibniz/Aquinas start with *contingency*.
  *   **Different Concepts of Dependency:** Kalam is about *temporal causation* (first cause in time); Leibniz/Aquinas are about *ontological explanation* (ground of being).
  *   **Different Relationship to Time:** Kalam *requires* a temporal beginning; Leibniz/Aquinas work *even with* an eternal universe.
  *   **Different Vulnerability to Science:** Kalam is vulnerable to cosmology; Leibniz/Aquinas are primarily vulnerable to philosophical critiques of the PSR or the concept of a necessary being.

  **Where the Real Disagreement Lies (and How to Approach Your Friend):**

  1.  **Your Friend is Defending Kalam, Not Leibniz/Aquinas:** He is correct that *if* the universe began to exist, that *supports* the Kalam argument. However, he is *incorrect* if he claims this is the *only* or the *historically primary* form of the cosmological argument, or that Leibniz/Aquinas relied on a beginning. They explicitly did not.
  2.  **His Argument Isn't Necessarily "Weaker," Just Different:** Kalam is a powerful argument *if* its premises are accepted (especially the universe's beginning). It has modern defenders (like William Lane Craig). However, its *dependence* on a specific scientific interpretation *is* a point of vulnerability compared to the metaphysical independence of the Leibnizian/Aquinas version.
  3.  **The Core Disagreement:** The fundamental difference is about **what kind of explanation the universe ultimately needs.**
      *   **Your Friend (Kalam):** "The universe needs a *cause* because it *started*."
      *   **Leibniz/Aquinas:** "The universe (as contingent) needs an *explanation* for its *existence* (whether it started or not)."

  **How to Raise It:**

  1.  **Acknowledge Agreement:** Start by agreeing that *if* the universe began, that *does* strongly support a version of the cosmological argument (Kalam).
  2.  **Clarify the Historical Distinction:** "I was reading about Leibniz and Aquinas, and I found it fascinating that their versions of the cosmological argument were designed to work *even if the universe had no beginning*. They weren't arguing from a start in time, but from the idea that *any* contingent reality, even an eternal one, needs a necessary ground for its existence."
  3.  **Highlight the Difference:** "So, it seems like there are two distinct types: one (like your Kalam argument) that relies on cosmology showing a beginning, and another (like Leibniz/Aquinas) that relies on the philosophical principle that contingent things need a sufficient reason for existing at all, regardless of time."
  4.  **Focus the Discussion:** "I'm trying to understand the strengths and weaknesses of each approach. Do you see the Leibnizian 'contingency' argument as compelling *independently* of the Big Bang evidence? Or do you think the Kalam version, relying on the beginning, is the stronger or only valid one?"

  This approach clarifies that you understand his point, introduces the legitimate historical alternative, and shifts the discussion towards evaluating the *different kinds* of dependency each argument addresses, rather than conflating them. The real disagreement lies in whether the ultimate explanation required is a *first temporal cause* or an *ontological ground of being* for contingent existence.
