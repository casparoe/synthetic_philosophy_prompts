prompt: |-
  So I've been going back and forth with some people in a Discord that spun off from a rationalist forum about the paradox of voting, and I keep running into the same wall. The standard Riker-Ordeshook calculus-of-voting framing always felt like a bit of a strawman to me: if you model casting a ballot as a causally isolated act and you're a strict CDT agent, the expected utility of swinging a national election (probability like 1 in 10 million, further discounted by uncertainty over whether your preferred candidate is actually better) is obviously going to be swamped by the cost of standing in line for an hour. But I've seen people gesture at superrationality / EDT-style reasoning (kind of a Parfit "each-we" move, or the idea that sufficiently similar deciders should treat their choices as correlated with other similar voters) as a way to rescue voting as rational for a purely outcome-focused agent, without smuggling in "warm glow" civic-duty utility as a fudge factor.

  I'd love an actual argument here rather than a survey of both sides. Please argue that something like evidential decision theory (or updateless decision theory) - not a taste for voting as an end in itself - is what's really doing the work in making voting rational for a self-interested agent who only cares about outcomes. Get into the weeds a bit on how the correlation across like-minded voters would have to be modeled for this to go through (e.g. how similar do two voters need to be for the "sameness" reasoning to kick in, and does this generalize past voting to other diffuse collective-action problems), and say something about whether this ends up being evidence for EDT/UDT over CDT more generally, or whether it's more of a special-case patch.
reasoning: |-
  Okay, let me tackle this user's query. They're deep into a debate about the rationality of voting, specifically challenging the standard cost-benefit analysis that deems voting irrational. They mention Riker-Ordeshook and CDT, where the miniscule probability of swinging an election doesn't justify the personal cost. But they're interested in whether EDT or UDT could make voting rational without invoking civic duty as a "warm glow."

  First, I need to unpack why CDT fails here. CDT's problem is treating each vote as independent, ignoring correlations between similar voters. If all rationalists think "my vote won't matter" and abstain, their preferred policy loses. But if they recognize their similarity and act collectively, voting becomes rational. The key is modeling decision correlation.

  The user wants a concrete argument for EDT/UDT over CDT. EDT considers the evidence your decision provides about others' actions. If you vote, it's evidence that other like-minded people vote too, making the outcome better. UDT takes a timeless perspective, asking what policy all similar agents should follow. Both approaches handle the coordination problem better than CDT.

  Next, the similarity threshold. How alike must voters be? Probably shared identity, like being in the same rationalist Discord. If they see each other as part of a group with common reasoning, then one's decision signals others'. But this might not extend to all collective actions—only where agents recognize their similarity and can coordinate implicitly.

  The user also asks if this is a special case or general evidence for EDT/UDT. While voting is a classic example, similar issues arise in other collective actions, like charitable donations or environmental efforts. However, it might not apply universally. In asymmetric situations, CDT could be better. So it's not a silver bullet but highlights CDT's limitations in coordination problems.

  I should address potential objections. Someone might argue that in large elections, even correlated votes are negligible. But with clustered groups (e.g., swing states), the impact is significant. Also, UDT's precommitment avoids the circularity of EDT's evidence.

  Finally, tie this back to the broader debate. The user wants to know if this supports EDT/UDT generally. Yes, in scenarios requiring collective action among similar agents, these theories outperform CDT. But they require agents to identify with a reference class, which introduces subjectivity. This isn't just a patch; it's a fundamental difference in handling correlated decisions.
answer: |-
  You're absolutely right to reject the Riker-Ordeshook CDT framing as inadequate and see the "warm glow" solution as unsatisfying for a purely outcome-focused agent. The core problem *is* CDT's failure to handle correlated decisions among similar agents in collective action problems. Let's build the EDT/UDT case rigorously.

  **The Core Argument: Correlation Defeats Independence**

  1.  **The CDT Failure:** CDT models your vote as an independent coin flip in a vast sea of randomness. The probability *your specific vote* is pivotal (changes the outcome) in a large election is astronomically small (<< 1e-6). The expected benefit (`P(pivotal) * Utility_Gain`) is dwarfed by the cost (`C`). Abstention dominates. Game over.

  2.  **The Collective Action Insight:** Voting isn't a solitary act against a random background. It's an action taken by *many agents facing similar reasoning*. Crucially, *like-minded* agents (e.g., rationalists in your Discord, liberals in a swing state, environmentalists) are likely using similar decision procedures and have access to similar information. Your decision process isn't isolated; it's *correlated* with the decision processes of others in your reference class.

  3.  **EDT: Voting as Evidence of Collective Action:**
      *   EDT evaluates actions based on the *evidence* they provide about the state of the world, including the actions of others.
      *   **Conditional:** If *you* decide to vote, what does that tell you about the *likely actions of other similar agents*?
      *   **Reasoning:** You know you are a member of a group (G) that prefers candidate/outcome (O). You know members of G are likely using similar reasoning. If *you*, a typical G-member, conclude voting is rational and do it, that is strong evidence that *other* typical G-members are *also* concluding voting is rational and doing it. Your act of voting is *diagnostic* of a broader pattern within G.
      *   **The Calculation (Simplified):** EDT compares:
          *   `EU(Vote) = P(O Wins | I Vote) * U(O) - C`
          *   `EU(Abstain) = P(O Wins | I Abstain) * U(O)`
      *   **The Key:** `P(O Wins | I Vote)` is likely **significantly higher** than `P(O Wins | I Abstain)`. Why? Because your vote isn't just +1 vote; it's evidence that *many* other G-members are also voting (since they reason similarly). Conversely, `P(O Wins | I Abstain)` is likely lower because it's evidence that many other G-members are also abstaining (using the flawed CDT reasoning).
      *   **Result:** The *difference* `[P(O Wins | I Vote) - P(O Wins | I Abstain)] * U(O)` can easily exceed `C`, even if your individual vote's causal power is negligible. You rationally vote because your action *signals* (and is part of) the collective action needed for O to win.

  4.  **UDT: Choosing the Policy for All Similar Agents:**
      *   UDT takes a "view from nowhere." Instead of asking "What should *I* do now?", it asks "What *decision rule* should all agents *like me* follow?"
      *   **The Choice:** UDT considers two candidate decision rules (policies) for all members of the reference class (G):
          *   **Policy V:** "If you are a member of G, vote for O."
          *   **Policy A:** "If you are a member of G, abstain."
      *   **Evaluating Policies:** UDT calculates the expected utility *if all G-members follow Policy V* vs. *if all G-members follow Policy A*.
          *   `EU(Policy V) = P(O Wins | All G Vote) * U(O) - |G| * C / |G| = P(O Wins | All G Vote) * U(O) - C` (Cost per agent)
          *   `EU(Policy A) = P(O Wins | All G Abstain) * U(O)`
      *   **The Obvious Win:** `P(O Wins | All G Vote)` is vastly higher than `P(O Wins | All G Abstain)`. Unless `U(O)` is negligible or `C` is astronomical, `EU(Policy V) >> EU(Policy A)`.
      *   **Result:** The superior decision rule for all similar agents is Policy V (Vote). Therefore, as an agent in G, you follow Policy V. You vote. Crucially, UDT avoids the circularity of "I vote because others vote" by pre-committing to the globally optimal policy. You vote *because if everyone like you votes, the good outcome is likely, and you are simply implementing the best universal rule*.

  **Getting Into the Weeds: Similarity, Correlation, and Generalization**

  1.  **How Similar is "Similar"? (The Reference Class Problem):**
      *   **Core Requirement:** Agents must be sufficiently similar that they (a) identify with the same goal (O), (b) recognize they are part of a group (G) relevant to achieving O, and (c) are likely using *highly correlated decision procedures* when faced with this choice.
      *   **Threshold:** The correlation needs to be strong enough that `P(O Wins | I Vote)` is substantially larger than `P(O Wins | I Abstain)` (for EDT) or that `P(O Wins | All G Vote)` is substantially larger than `P(O Wins | All G Abstain)` (for UDT). This depends on:
          *   **Group Cohesion & Identity:** How strongly do members identify as G? (Rationalist Discord vs. "vaguely liberal voters").
          *   **Shared Reasoning & Information:** Do they have access to the same arguments (e.g., this very EDT/UDT reasoning)? Are they likely to converge on the same conclusion?
          *   **Group Size Relative to Margin:** The effect is strongest when G is large enough to be pivotal *as a bloc* but small enough that coordinated action (even implicit via correlated reasoning) makes a difference (e.g., a key demographic in a swing state, not all voters nationally).
      *   **Example:** Members of your specific Rationalist Discord debating *this exact argument* are a highly correlated reference class. "All voters who prefer O" is a weakly correlated class. "All humans" is uselessly broad for this purpose.

  2.  **Generalization to Other Collective Action Problems:**
      *   **Yes, Absolutely.** This reasoning directly applies to any situation involving:
          *   A large number of agents.
          *   A desired collective outcome requiring contributions from many.
          *   Individual costs to contributing.
          *   Agents who can be grouped into "similar" reference classes likely to use correlated reasoning.
      *   **Examples:**
          *   **Charitable Donations:** If you are part of a group (G) passionate about cause C, donating (`D`) signals others in G are likely donating, increasing `P(C is Funded | I Donate)`. Abstaining signals the opposite. UDT says all G should donate. (Applies best to coordinated campaigns within communities).
          *   **Environmental Actions:** Reducing personal carbon footprint. If you are part of an environmentally conscious group (G), your action evidences similar actions by others, increasing `P(Impact | I Act)`. UDT prescribes universal action within G. (Effectiveness depends on G's size/pivotalness).
          *   **Boycotts/Strikes:** Participation signals wider participation, increasing `P(Success | I Participate)`. UDT mandates participation for all in G.
      *   **Limitation:** The effect diminishes if:
          *   The reference class is too large/weakly correlated.
          *   The action has no natural "diagnostic" power within the class (unlike voting/donating).
          *   The cost is extremely high relative to the *group's* potential impact.

  **Is this Evidence for EDT/UDT over CDT? Special Case or General Principle?**

  1.  **Evidence for EDT/UDT:** **Yes, strongly.** Voting (and collective action problems generally) is a canonical example where CDT fails spectacularly due to its assumption of causal independence. EDT and UDT explicitly handle the correlation inherent in groups of agents using similar reasoning in strategic situations. They provide a coherent, outcome-focused rationale where CDT cannot.
  2.  **A Special-Case Patch?** **No, it reveals a fundamental flaw in CDT.** The inability to handle correlated decisions among similar agents isn't unique to voting; it's a general weakness of CDT in many game-theoretic and collective scenarios (e.g., Newcomb's Paradox is the ur-example). Voting is just a particularly clean and socially relevant instance.
  3.  **The Nature of the Fix:** This isn't *just* a patch for voting; it's demonstrating that **CDT's causal model is incomplete** in realistic multi-agent settings where agents recognize their similarity. EDT/UDT offer more robust frameworks for these situations. The "sameness" reasoning is a core feature of how rational agents *should* think when their decisions are entangled with others like them.
  4.  **Trade-offs:** EDT can be vulnerable to "smoking lesion" type problems where correlation isn't based on decision similarity but on spurious links. UDT requires solving the complex reference class problem. CDT often excels in causally isolated, non-strategic individual decisions. **The takeaway isn't that EDT/UDT always dominate, but that CDT is fundamentally inadequate for a large class of important real-world problems involving collective agency and correlated reasoning, of which voting is a prime example.**

  **Conclusion**

  For a purely outcome-focused agent in your rationalist Discord, rejecting the civic-duty fudge factor, EDT and UDT provide the compelling argument:

  *   **EDT:** Your vote isn't evaluated in isolation. It's evidence about the actions of other like-minded rationalists. Voting increases the probability you assign to your preferred candidate winning *because it increases the probability that enough other rationalists are also voting*. This evidential boost in expected utility outweighs the cost.
  *   **UDT:** You shouldn't ask "What should I do?" but "What should all agents like me do?". The policy "All rationalists vote" leads to a much better expected outcome than "All rationalists abstain". Therefore, you follow the superior policy and vote.

  The correlation works because you recognize yourselves as a group using similar reasoning facing a shared problem. This reasoning rescues voting as rational without warm glow, generalizes to many collective actions, and highlights a fundamental advantage of EDT/UDT over CDT in handling the strategic interdependence of similar decision-makers. It's not a patch; it's exposing a core limitation of the standard causal model. The "paradox" arises from applying the wrong decision theory to a coordination problem.
