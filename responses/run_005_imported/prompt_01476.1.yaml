prompt: |-
  Ok this has been bugging me for a while. Ive read about stuff like how a hill looks way steeper if you're worn out or out of shape, and those studies where stressed out cops 'see' a gun in some guys hand when he's actually just holding a phone or a wallet. If what we expect or fear can reach all the way into our actual eyesight like that, doesn't that mean what we 'see' is never really independent proof of anything? Feels like eyewitnesses, and honestly our own eyes in general, are basically just confirmation bias wearing a trenchcoat at that point. Am i wrong to think this pretty much wrecks the whole idea that seeing something is a good reason to believe it?
