  So I'm about two-thirds through a novel set in a fictional eastern European country dealing with the messy aftermath of a collapsed authoritarian regime, and there's a courtroom scene I keep rewriting that I just can't get right. A minor official is on trial for reporting his neighbor to the secret police over a joke about the Party leader; the joke was, at the time, a genuine crime under the old regime's statutes, and the neighbor ended up executed for it. My defense attorney character wants to argue that the old statute was never actually valid law to begin with, because it was the kind of arbitrary, monstrous rule that doesn't even deserve the name "law" -- basically channeling the natural-law side of the actual Hart-Fuller debate about the "grudge informer" cases in postwar Germany, plus Radbruch's whole "extreme injustice isn't law" idea, if im remembering that right (its been a while since grad school, so forgive me if I'm mangling some of it).

  Here's my problem though: I don't want this speech to be a strawman that the prosecutor casually flattens two pages later with "well, it WAS on the books, sorry." I want the actual strongest, most careful version of that argument -- the one that supposedly gave Hart real trouble, not just "it was SO evil it doesn't count." What I remember of Hart's comeback is something like: saying the old law was never valid is really just a sneaky way of punishing someone retroactively while pretending you're not doing anything retroactive at all, and that it would've been more honest to just pass a new law openly and own up to the unfairness of it. So could you build me the best version of the "it was never valid law" argument, one that actually has a real answer to that retroactivity worry baked into it? I want to find where the actual pressure point in that exchange is, not the two-line textbook version of "positivism says yes, natural law says no."
