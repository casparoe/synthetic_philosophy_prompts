  *   **Recantation Nuance:** While Popper did significantly change his view to accept testability, he didn't fully abandon seeing it as a *metaphysical* framework guiding research. The answer implies a more complete reversal ("recant") than Popper articulated. He moved it into the realm of *scientific* (because testable) metaphysical programs. (Cost 1 point).
  *   **"One-off events" Slight Misemphasis:** While Popper *was* concerned about historical sciences, his primary critique of Darwinism in the 70s was its *logical structure* (the tautology), not *solely* its focus on unique past events. The answer slightly overemphasizes the "unrepeatable, one-off events" aspect as *the* reason, rather than *a* related concern. The tautology was the core problem applicable even hypothetically. (Cost 1 point).
