  Random one, but I'm a software engineer and I've read Turing's 1950 'Computing Machinery and Intelligence' paper (the one that introduces the imitation game) a bunch of times over the years, always for the CS side of it. Rereading it last week I actually slowed down at section 6, where he runs through objections to his own argument, and noticed the very last one, 'the argument from extra-sensory perception,' is not played as a joke -- he says the statistical evidence for telepathy is basically overwhelming, and seriously proposes you'd need a 'telepathy-proof room' to keep the imitation game valid. I must've skimmed past that bit on every previous read assuming it was some dated throwaway line. Can you actually break down what he's claiming there, why ESP (if it were real) would specifically threaten the test rather than just being a weird aside, and whether the whole thing reads as more interesting or more embarrassing in hindsight? Dont need the standard 'what is the Turing test' background, just the guts of that one section.
