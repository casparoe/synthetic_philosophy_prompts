answer: |-
  That's a razor-sharp observation about Douglass's interpretive shift and its modern resonance. You're right: Douglass's later constitutionalism was fundamentally **text-based and deliberately *opposed* to the framers' pro-slavery intentions.** Predicting his view on modern originalism requires dissecting the core conflict you identified:

  1.  **Douglass's Method (Post-1847):**
      *   **Text Supremacy:** He argued the *words on the page* were paramount. Terms like "persons," "people," "citizens," "service or labour," "other persons" had meanings independent of the framers' compromises.
      *   **Rejection of Framers' Intent:** He explicitly acknowledged the framers *intended* to protect slavery through compromises, but argued their *private intentions* were irrelevant if the *public text* they signed didn't *explicitly* establish or mandate slavery. The text, he argued, contained no guarantees for slavery and actually empowered the federal government to restrict/abolish it (e.g., Preamble's goals, General Welfare, Necessary and Proper Clause, power over territories).
      *   **Purpose:** This wasn't abstract legal theory. It was a *strategic weapon* against slavery. Denying the Constitution's pro-slavery character allowed him to argue for abolition *within* the constitutional framework, using federal power, voting, and political engagement – rejecting Garrisonian disunion and non-voting. He used the text's potential for justice against its creators' unjust intentions.

  2.  **Modern Originalism (Dominant Forms):**
      *   **Original Public Meaning (Scalia-esque):** Focuses on the meaning the constitutional text would have had to an ordinary, reasonable person *at the time it was adopted*. This *includes* understanding the historical context and common linguistic usage.
      *   **Original Intent (Less common now):** Focuses on the specific intentions of the framers/drafters.
      *   **Key Point:** Both dominant forms (especially Original Public Meaning) **rely heavily on historical context and 18th/19th-century understandings** to determine what the words meant *then*. This inevitably incorporates the pro-slavery compromises, legal realities (like the *Dred Scott* logic), and societal norms Douglass explicitly rejected as determinative.

  **Why Douglass Would Almost Certainly Reject Modern Originalism:**

  1.  **It Revives the Very Thing He Rejected:** Modern originalism's reliance on historical context and contemporary public understanding *is precisely the approach* that led Garrison (and the early Douglass) to conclude the Constitution was pro-slavery. Originalism asks: "What did 'persons' mean *in the context of 1787/1788, when slavery was legal and widespread?'*" Douglass's answer was: "That context *is the problem*. Look only at the *words themselves* – 'persons' means human beings, full stop." Originalism demands immersion in the historical understanding he deemed morally corrupt and legally irrelevant for interpreting the text's *potential*.
  2.  **It Locks in Historical Injustice:** Douglass saw the *text* as a tool for *progress* precisely because it wasn't bound by the framers' bad intentions. He argued the text's *language* allowed for, even demanded, a reading compatible with liberty. Modern originalism, by seeking to fix meaning based on the past (even if just linguistic meaning), would, in his view, lock in the very pro-slavery understandings he fought to overcome. It risks making *Dred Scott*-style reasoning (rooted in historical context) the correct methodology.
  3.  **His Pragmatism & Moral Imperative:** Douglass wasn't a disinterested scholar. His interpretive method was chosen *specifically* to serve the moral imperative of abolition and equality. He would see modern originalism, when applied to clauses touching on slavery or equality (like the 14th Amendment), as potentially resurrecting historical justifications for oppression that his textual approach sought to circumvent. He'd argue originalism privileges the understanding of a society steeped in white supremacy over the plain meaning of words promising liberty and justice.
  4.  **Text vs. Context:** Douglass championed the *text itself* as the sole legitimate authority, divorced from the compromised context of its creation. Modern originalism (especially Original Public Meaning) sees context as *essential* to understanding the text. This is a fundamental methodological clash. Douglass would see originalism's contextualism as a Trojan horse smuggling the framers' pro-slavery intentions back into constitutional law.

  **The Possible Counter-Argument (and Why it Fails):**

  *   *Couldn't Douglass embrace Scalia's textualist form of originalism?* Scalia emphasized dictionary definitions and grammar over subjective intent. However, Scalia *also* insisted on understanding words *as they were used at the time*. For example, interpreting "cruel and unusual punishment" requires knowing what was considered cruel *then*. Applied to clauses like the 3/5 Compromise ("other persons") or Fugitive Slave Clause ("person held to service or labour"), this methodology *forces* the interpreter to confront the historical reality of slavery as the context defining those terms. Douglass rejected that contextual definition *as binding*. He argued the text's *inherent meaning* ("person" = human being) overrode the context of its application. Scalia's method would likely lead to conclusions about the original Constitution's protection of slavery that Douglass spent his career arguing against *based on the same text*.

  **Conclusion:**

  Based solely on his mature interpretive philosophy – **text supreme, framers' intent irrelevant, historical context (especially pro-slavery context) to be rejected as a guide to meaning** – Frederick Douglass would be **dead against modern originalism.** He would see it as the methodological resurrection of the very approach (prioritizing historical understanding and framers' compromises) that he broke from William Lloyd Garrison to defeat. Originalism's core reliance on historical context to fix meaning would appear to him as a betrayal of the Constitution's *textual* potential for justice, binding it instead to the oppressive realities of its flawed origins. His fight wasn't just *for* civil rights; it was *against* using the framers' intent or historical context as the key to unlocking the Constitution's meaning, especially when that context was morally abhorrent. Modern originalism generally does the opposite.
