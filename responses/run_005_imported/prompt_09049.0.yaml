answer: |-
  Your frustration is utterly understandable—you're grappling with two brilliant minds dissecting the bedrock of knowledge, using an example *from your lived expertise*. That makes this profoundly concrete. Let's dissect the kilogram case to pry Wittgenstein and Quine apart, respecting both the depth of your experience and the genuine philosophical divergence. Your philosopher friend is right that they differ fundamentally, but the difference lies in the *nature* of the certainty and the *mechanism* of change, not necessarily the empirical outcome.

  **1. Wittgenstein's Hinge: The Grammar of Measurement**

  *   **What a Hinge Is:** For Wittgenstein (OC 341-343+), a hinge proposition isn't a highly confirmed empirical belief. It's part of the **scaffolding** or **"riverbed"** (OC 96-99) that makes *empirical investigation and doubt possible in the first place*. Doubting it isn't merely impractical; it **paralyzes the language-game**.
  *   **The IPK as a Hinge (Pre-2019):** Before 2019, "One kilogram is the mass of the International Prototype Kilogram (IPK)" wasn't a hypothesis you tested. It was **constitutive** of the meaning of "one kilogram" within the international metrology system. It functioned as:
      *   **The Rule:** It defined the unit. Asking "Is the IPK *really* one kilogram?" was akin to asking "Is the standard meter bar in Paris *really* one meter long?" under the old definition. The question misfires—the object *defined* the unit.
      *   **The Anchor:** All calibrations, traceability chains, and uncertainty budgets *presupposed* this definition. Doubting its mass (as *the* definition) wouldn't lead to experiments to "check" it; it would dissolve the very framework for *having* a calibrated instrument or reporting a mass value. Your "certainty" wasn't belief in a fact, but **acting according to a rule**.
      *   **Beyond Justification:** As you sensed, hinges aren't justified by evidence; they are what *allows* justification. Your certainty wasn't high credence; it was **acting without doubt** as part of the practice. It was normative, not descriptive.
  *   **The "Fluid" Riverbed (Post-2019):** Wittgenstein *does* allow hinges to change (OC 96-99). The riverbed shifts. But crucially:
      *   **It's not Revision via Argument:** The change isn't driven by *falsifying* the old hinge through empirical evidence *within the old system*. The IPK wasn't proven "wrong." What changed was the **entire framework of meaning and practice**. Fixing Planck's constant redefined the *concept* of the kilogram, shifting the riverbed.
      *   **The Nature of Change:** This shift isn't a rational choice *within* the old game based on costs/benefits. It's a **change in the form of life or language-game itself**. The old rule ("kg = IPK") didn't get disproven; it became obsolete within a new, more fundamental physical framework. The certainty didn't fade; the *game* changed.

  **2. Quine's Web: Holism and Pragmatic Revision**

  *   **What the Web Is:** Quine rejects any analytic/synthetic divide or foundational "hinges." All beliefs (logical, mathematical, physical, observational) form an interconnected **web of belief**. Facing "recalcitrant experience" (anomaly), we can adjust *any* part of the web.
  *   **The IPK in the Web (Pre-2019):** For Quine, the statement "The mass of the IPK is one kilogram" was a **highly central, extremely well-confirmed node** within the vast web of physics, engineering, and metrology.
      *   **Centrality & Entrenchment:** It was deeply connected to countless other beliefs and practices (laws of motion, material science, manufacturing tolerances, calibration procedures). Giving it up would cause massive disruption, requiring adjustments throughout the web. This made it *de facto* immune to revision under normal circumstances.
      *   **Empirical (in principle):** Crucially, for Quine, *no* belief is *in principle* immune to revision, not even logical laws (though they are extremely central). The IPK's status was due to its **pragmatic utility and entrenchment**, not because doubting it was nonsensical. In principle, an anomaly *could* have targeted it directly (e.g., if it seemed to violate conservation laws in a way traceable *only* to its mass definition).
      *   **Credence?:** Quinean holism is more about **commitment under the pressure of experience** than Bayesian credence. The IPK node held a privileged position because disturbing it maximally disturbed the web's equilibrium.
  *   **Revision (2019):** The redefinition *is* a quintessential Quinean revision.
      *   **Pragmatic Optimization:** Metrologists faced "recalcitrant experience" – the limitations and instability of an artifact-based standard in an era demanding atomic-scale precision. The "cost" of maintaining the IPK definition (uncertainty, lack of universal accessibility) became too high relative to the benefits of fixing a fundamental constant.
      *   **Holistic Adjustment:** Revising the IPK node wasn't done in isolation. It involved recalculating countless other connections (values of other constants, calibration chains) to **restore coherence and maximize predictive power/pragmatic utility** across the *entire* web of physical theory and measurement. It was a deliberate, rational choice based on global considerations.
      *   **No Sacred Core:** The revision demonstrates Quine's core point: **even the most central beliefs can be revised** when the overall benefit to the system warrants it. The committee vote *was* the rational argument put into practice.

  **The Kilogram Crucible: Pulling Them Apart**

  1.  **Nature of Certainty Pre-2019:**
      *   **Wittgenstein:** You were **certain** in the hinge sense. Your relationship to the IPK was **non-propositional, normative certainty**. It was the rule you acted upon, the foundation enabling your doubt about *other* masses. Doubting its mass (as definition) wasn't an option within the practice; it would have been like doubting the rules of chess while playing.
      *   **Quine:** You assigned the IPK definition **maximal pragmatic commitment/entrenchment** within the holistic web. It was treated *as if* certain because revising it was unthinkably costly *under current conditions*, but it was *always* revisable in principle based on future experience and pragmatic needs.

  2.  **Mechanism of Change (2019):**
      *   **Wittgenstein:** The **language-game/riverbed shifted**. "One kilogram" acquired a new, more fundamental grammar (tied to Planck's constant). The old hinge ("kg = IPK") didn't get falsified; it ceased to be the rule defining the game. The change was a **paradigm shift**, not a falsification *within* the old paradigm. The committee vote ratified a *new framework*, not the falsity of the old one.
      *   **Quine:** This was a **deliberate, pragmatic revision of a central node** to optimize the entire web of belief in response to evolving needs and capabilities. The cost/benefit analysis tipped. The physical argument (linking mass to fundamental constants) provided the *rationale* for the revision, demonstrating its coherence within the *adjusted* web. The IPK *was* revised based on argument.

  3.  **The Crucial Difference Revealed by the Kilogram:**
      *   **Can a hinge be "argued away" by committee?** This is the critical point *against* Wittgenstein fitting perfectly. Wittgenstein's hinges don't get *revised by rational argument within the system*; the system *changes*, and the hinge becomes obsolete. The fact that metrologists *deliberately argued* for the change based on physical principles and practical benefits, voted on it, and implemented it *as a reasoned revision* aligns much more strongly with **Quine's model of holistic, pragmatic adjustment**. For Wittgenstein, such a committee would be changing the rules of the game, not proving an old rule wrong. The *explicit, reasoned justification* feels more Quinean.

  **Conclusion: Which Fits Your Pre-2019 Experience Better?**

  *   **For your *lived certainty* while working:** **Wittgenstein** captures the *phenomenology* better. The IPK wasn't just a really solid belief; it was the **unchallengeable foundation** of your daily practice. You didn't *assign it credence*; you *acted* with it as the bedrock rule. Doubting its mass (as definition) wouldn't have made sense *within your metrological practice*. This normative, enabling certainty is Wittgenstein's hinge.
  *   **For the *process and nature of the change* in 2019:** **Quine** provides the superior framework. The revision was a **rational, holistic, pragmatic optimization** of the web of belief, driven by arguments about coherence, precision, and universality, decided by committee. The IPK's centrality didn't make it logically immune; it just made revision costly until the benefits of a new structure became overwhelming. This is Quinean revision in action.
  *   **The Tension:** Your insight is sharp: the IPK *functioned* as a hinge but was *revised* like a Quinean node. This exposes a potential limitation in Wittgenstein for describing *how* such deep changes occur in modern, rational, institutional science. Quine better accounts for the *deliberate, reasoned* overthrow of what was once foundational.

  **In short:** Pre-2019, you were relating to the IPK with **Wittgensteinian hinge certainty** – it was the unchallenged rule enabling your work. The fact it *could* be, and *was*, deliberately revised through rational argument and committee vote based on physical principles and pragmatic benefits, however, demonstrates the **Quinean truth**: even the most entrenched beliefs are part of a holistic, empirically constrained web, open to revision when the overall equilibrium demands it. The kilogram redefinition shows Quine's model more accurately describes *how* such profound changes *actually happen* in scientific practice, even if Wittgenstein better captures the *feeling* of bedrock certainty before the shift. They are complementary lenses, but the mechanism of change pulls them decisively apart.
