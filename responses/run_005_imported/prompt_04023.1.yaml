prompt: |-
  I'm putting together a session for my grad seminar on practical rationality and want to pressure-test an argument before I inflict it on the students. You know the standard money-pump story: if your preferences over A, B and C are cyclic (A over B, B over C, but C over A), a sufficiently patient bookie can walk you through a sequence of trades -- each one a trade you'd make given just the two options on offer at that moment -- charging you a small fee each time, and leave you back where you started, over and over, for as much money as they like. This is usually presented as a knock-down case that cyclic preferences aren't merely imprudent but flatly irrational, on a par with holding inconsistent beliefs.

  Thing is, I've never fully bought that this settles it, mostly because of the resolute-choice move out of McClennen: an agent who just commits to a plan at the outset of the sequence and sticks to it, even at the node where they'd "locally" prefer to defect, never gets pumped. A colleague of mine down the hall thinks this is basically a cheat -- refusing the trade you'd prefer in the moment just IS a further bit of incoherence, so all resoluteness shows is that one irrationality can be used to patch over another, which isnt much of a vindication. I go back and forth on this, honestly, but I'd like to see the strongest version of the pro-resolute-choice case laid out properly, since most treatments I've seen just assert that resoluteness "solves" the problem without doing the work.

  So here's what I want: argue, as rigorously as you can, that a resolute chooser with cyclic preferences is not thereby irrational, and that the money-pump argument therefore fails to establish transitivity (or even mere acyclicity) as a requirement of practical rationality. Don't just wave at resoluteness -- actually engage with the mechanics. In particular, say something about why declining the trade at a given node doesn't require that your preference at that node has secretly changed (which would just concede that the intransitivity was never real to begin with), and how this differs, if it does, from the ordinary sophisticated backward-induction story we tell about agents whose preferences change over time because of something like hyperbolic discounting -- where its uncontroversial that planning ahead is rational precisely because the future self really does have different preferences.
reasoning: |-
  Okay, the user is prepping a grad seminar on practical rationality and wants to pressure-test an argument about money pumps and resolute choice. They're familiar with the standard money-pump argument against cyclic preferences but are skeptical about whether resoluteness genuinely solves the problem. They want a rigorous defense of resolute choice, specifically addressing why declining a trade doesn't imply a preference change and how this differs from cases like hyperbolic discounting.

  First, I need to recall the money-pump setup. The standard scenario involves three options: A preferred over B, B over C, but C over A. A patient bookie can exploit this by offering trades that seem beneficial at each step but leave the agent worse off. The key challenge here is to defend a resolute agent who commits to a plan and sticks to it, refusing trades that would lead to a money pump.

  The user mentioned McClennen's resolute choice. The colleague argues that refusing a locally preferred trade is itself irrational. So, I need to argue that resoluteness isn't just patching one irrationality with another. The user wants a distinction from hyperbolic discounting cases, where preference changes over time make planning rational. Here, the preferences are stable but cyclic, so resoluteness is about commitment, not adapting to changing preferences.

  I should start by clearly defining the resolute approach. The agent treats the decision problem as a single extended choice rather than isolated steps. By committing to a plan, they avoid the pump. But the crux is explaining why refusing a trade isn't a preference shift. The argument hinges on the agent's evaluation of entire plans rather than pairwise choices at each node. So at the moment of the trade, the agent prefers the plan's outcome over the immediate trade, even if pairwise they'd choose differently. That doesn't mean their underlying preferences changed; they're applying a different evaluation framework.

  Next, distinguishing this from hyperbolic discounting. In discounting, future selves have different utility functions, so planning binds them. Here, the resolute agent has consistent cyclic preferences throughout. Their commitment is a rational exercise of will to achieve their overall goal, not a response to changing preferences. They see the local choice as part of a larger action, so refusing the trade aligns with their global preference.

  The user wants rigor, so I need to formalize the argument. Maybe use decision trees or state-dependent preferences. Emphasize that rationality includes the ability to coordinate actions over time. Sophisticated agents (using backward induction) end up with the money pump because they myopically follow local preferences. Resolute agents avoid it by sticking to the plan. But is this rational? The answer lies in whether rationality requires separability—evaluating each choice independently. If not, then resoluteness is valid.

  Also, addressing the colleague's point: refusing a locally preferred option isn't incoherent if the agent values plan adherence as part of their rationality. They're not denying the pairwise preference but prioritizing the plan's outcome. It's a meta-preference for consistency over time. The cyclic preferences aren't problematic if the agent never faces all pairs simultaneously. Resoluteness prevents such exposure.

  Finally, the conclusion should state that money pumps don't prove cyclic preferences irrational because resoluteness provides a coherent alternative. The debate hinges on whether rationality permits such commitment over separability. That's the core issue for the seminar discussion.
answer: |-
  Here’s the strongest possible case for resolute choice as a rational response to cyclic preferences, engaging rigorously with the mechanics and objections. The core argument is that **rationality requires evaluating extended plans holistically rather than myopically at each choice node**, and that this holistic evaluation justifies refusing locally preferred trades without implying a preference change. Let’s break it down step by step.

  ---

  ### **1. Clarifying the Resolute Stance**
  - **The Setup**: An agent has stable, cyclic preferences:  
    \( A \succ B \), \( B \succ C \), \( C \succ A \) (where "\(\succ\)" denotes strict preference).  
  - **The Threat**: A bookie offers:  
    - Trade 1: Swap \( A \) for \( B \) plus \( \$ε \) (accepted since \( A \succ B \)).  
    - Trade 2: Swap \( B \) for \( C \) plus \( \$ε \) (accepted since \( B \succ C \)).  
    - Trade 3: Swap \( C \) for \( A \) minus \( \$δ \) (accepted since \( C \succ A \)), leaving the agent with \( A \) minus net payments.  
  - **Resolute Response**: At \( t_0 \), the agent commits to a plan (e.g., "reject all trades"). At Trade 1, they refuse \( A \rightarrow B + \$ε \), despite the local preference for \( B + \$ε \) over \( A \).  

  ---

  ### **2. Why Refusal Doesn’t Imply Preference Change**
  The key is distinguishing **local choice dispositions** from **global preference rankings**.  
  - **Stable Preferences, Dynamic Contexts**:  
    The resolute agent’s preferences over outcomes remain cyclic *throughout*. Refusing a trade isn’t evidence of preference change but reflects:  
    - **Plan-Based Evaluation**: At \( t_0 \), the agent evaluates *entire trajectories of action*. The plan "keep \( A \)" yields outcome \( A \). The plan "accept Trade 1" leads to a path ending in \( A - \$δ + \$ε \) (net loss). Globally, \( A \succ A - \text{net loss} \), so committing to "keep \( A \)" is rational.  
    - **Node-Specific Rationality**: At Trade 1, the choice is between:  
      - Option 1: *Execute the plan* → outcome \( A \).  
      - Option 2: *Defect* → outcome \( A - \$δ + \$ε \) (after later trades).  
      Since \( A \succ A - \$δ + \$ε \), refusing Trade 1 is *locally* rational *given knowledge of the plan’s consequences*.  
    - **No Preference Shift**: This doesn’t mean \( B + \$ε \prec A \) suddenly holds. Rather, the agent isn’t evaluating \( A \) vs. \( B + \$ε \) *in isolation*; they’re evaluating \( A \) (via plan adherence) vs. \( A - \text{net loss} \) (via defection). The pairwise preference \( A \prec B + \$ε \) still exists but is *irrelevant* to the choice context.  

  **Mechanical Difference**:  
  - **Myopic Chooser**: Evaluates options *only* pairwise at each node, ignoring downstream paths.  
  - **Resolute Chooser**: Sees each node as part of a larger action-sequence. The "option" at Trade 1 isn’t just \( B + \$ε \) but the *entire future trajectory* it enables.  

  ---

  ### **3. Contrast with Hyperbolic Discounting (Sophisticated vs. Resolute)**  
  In hyperbolic discounting, preferences *genuinely change over time*:  
  - At \( t_0 \), I prefer \( \$100 \) in 1 year over \( \$90 \) today.  
  - At \( t_1 \) (today), I prefer \( \$90 \) now over \( \$100 \) tomorrow.  
  - **Sophisticated Response**: I use backward induction to pre-commit (e.g., lock away money) because I know my future self has *different preferences*. This is rational adaptation to changing utility functions.  

  **Crucial Disanalogy**:  
  - In cyclic cases, preferences are *stable*: \( C \succ A \) holds at all times. Resoluteness isn’t about managing preference shifts but **upholding a global evaluation** that avoids dominated outcomes. Refusing a trade isn’t a concession that \( B + \$ε \prec A \) now holds—it’s a recognition that *choosing* \( B + \$ε \) *at this node* leads to an inferior *overall outcome*.  

  ---

  ### **4. Rationality of Holistic Planning**  
  The argument hinges on two principles:  
  - **Principle of Dynamic Consistency (Resolute Version)**:  
    > *If a plan yields a preferred outcome overall, and no new information justifies revising the plan, rationality requires sticking to it.*  
    Here, "no new information" is key: the bookie’s trades are foreseen, so no surprise justifies re-evaluation.  
  - **Dominance Avoidance**:  
    Cyclic preferences only cause money pumps under *myopic* choice. A resolute agent avoids the dominated outcome \( A - \text{net loss} \) by coordinating their choices over time. This coordination isn’t "irrational incoherence" but **structural rationality**—recognizing that decisions are temporally extended.  

  **Objection**: "But at Trade 1, you *should* prefer \( B + \$ε \) over \( A \)!"  
  - **Reply**: Rationality doesn’t require maximizing at every *atomic* choice if atomic choices are artificial divisions of a unified agency. The resolute agent treats the *sequence* as a single "meta-choice" between:  
    - Meta-option 1: \(\{A\}\) (by rejecting all).  
    - Meta-option 2: \(\{A - \$δ + \$ε\}\) (by accepting all).  
    Their cyclic preferences don’t rank these meta-options cyclically—\( \{A\} \succ \{A - \$δ + \$ε\} \) is consistent and acyclic.  

  ---

  ### **5. Why This Isn’t "Cheating"**  
  Your colleague’s objection conflates two levels:  
  - **Local Dispositions ≠ All-Things-Considered Preferences**:  
    Having a disposition to choose \( B + \$ε \) over \( A \) *in a pairwise comparison* doesn’t entail you must choose it *when it triggers a loss-inducing sequence*. Rationality can demand overriding local dispositions when they conflict with higher-order goals (here, avoiding exploitation).  
  - **No Bootstrapping**: This isn’t "patching irrationality with irrationality." Cyclic preferences *are* anomalous (they violate Independence of Irrelevant Alternatives), but they don’t *necessarily* lead to irrational outcomes if the agent uses resolute planning. We can grant that cyclic preferences are *pro tanto* irrational while denying they’re *practically self-defeating*.  

  ---

  ### **6. Conclusion: What the Money Pump Fails to Prove**
  - **Money pumps show**: Myopic choice + cyclic preferences → exploitation.  
  - **They don’t show**: Cyclic preferences → inevitable exploitation *or* incoherence.  
  Resoluteness provides a **coherent, non-exploitable deliberative procedure** for agents with cyclic preferences. Such an agent:  
  1. Has stable, cyclic preferences over outcomes.  
  2. Evaluates *plans* holistically, yielding acyclic preferences over trajectories.  
  3. Refuses locally attractive trades *for global reasons*, without preference change.  

  **Seminar Takeaway**: The debate isn’t settled because the money pump assumes *separability* (choices must be evaluated node-by-node). Resoluteness rejects separativity, arguing that rationality requires *temporal unity of agency*. Whether rationality permits this is the real dispute—but resolute choice isn’t an *ad hoc* cheat. It’s a defensible view of rational planning under foreseen challenges.  

  For your students: Press *them* on whether rationality must be "separable." If not, the money pump loses its force against cyclic preferences. If yes, then cyclic preferences *are* irrational—but that’s the premise under dispute.
