  Move (5) gets a -1. Theo's neuroscience analogy is weak because brains have evolutionary history and behavioral contexts that provide natural norms for misrepresentation, unlike artificial networks where representations are purely functional.

  Both debaters miss important points: Theo underestimates how representations are constructed through training rather than discovered, while Ash doesn't acknowledge that "mine/yours" might reflect the network's actual computational use. The key missing element is considering the network's internal computational purposes versus external philosophical criteria for representation.

