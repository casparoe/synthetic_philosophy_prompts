  - Emotional objections (if the view feels cold, is that a philosophical flaw?) 

  Each follow-up anticipates her likeliest rebuttals. For example, on predation, she might say intervention disrupts ecosystems; the counter asks why natural suffering isn't as urgent as factory farming. 

