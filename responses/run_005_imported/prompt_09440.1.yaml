  Hmm... the species question is crucial because it exposes the human exclusivity problem. If moral status relies on capacities like rationality, then humans lacking those (infants, cognitively impaired) might fall into the utilitarian bucket. The follow-up should challenge any appeal to "species-typical" capacities or potentiality, since those seem ad hoc. 

  Predation intervention is a practical nightmare for utilitarianism. If animal suffering matters aggregatively, shouldn't we stop lions from eating gazelles? The follow-up must block deflection—like claiming intervention causes more harm—by asking why humans don't count as "natural" predators too. 

