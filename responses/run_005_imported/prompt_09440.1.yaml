answer: |-
  Here are 10 focused, critical questions designed to push the dual-view framework ("Utilitarianism for Animals, Kantianism for People") on its core tensions, including your specified areas, with anticipatory follow-ups to prevent retreat:

  1.  **Core Justification & Species Boundary:**  
      *Question:* If the grounding for inviolable Kantian constraints is a specific capacity (e.g., rationality, autonomy, moral agency), why use the *proxy* of species membership (human) rather than directly applying the capacity criterion? Doesn't this inevitably exclude humans lacking the relevant capacity (e.g., infants, severely cognitively disabled individuals) from Kantian protection, placing them in the utilitarian calculus alongside animals?  
      *Likely Response/Anticipatory Follow-Up:* If the response appeals to "species-typical potential," "intrinsic human dignity," or "marginal cases" arguments, ask: **"Doesn't relying on 'species-typicality' or 'human essence' risk becoming a circular justification ('humans have constraints *because* they're human') that fails to address why the underlying capacity *itself* isn't the true moral delimiter, especially given its variable presence?"**

  2.  **The Replaceability Problem:**  
      *Question:* If animal value is purely aggregative (utilitarian), does this commit the view to accepting the "replaceability argument"? Specifically, if a painlessly killed animal is replaced by another equally happy one, is there *any* intrinsic wrong in the killing itself, or is the net welfare simply unchanged?  
      *Likely Response/Anticipatory Follow-Up:* If the response downplays replaceability by emphasizing suffering minimization or the *act* of killing causing indirect harm, ask: **"Doesn't the core aggregative logic *require* that the killing itself, absent suffering or indirect harms, is neutral if replacement occurs? If you deny this, aren't you smuggling a non-utilitarian (perhaps quasi-Kantian) constraint against killing animals *as such* into the framework?"**

  3.  **Predation & Intervention:**  
      *Question:* Taking aggregate animal suffering seriously seems to demand minimizing it. Given the immense suffering caused by natural predation (e.g., slow deaths, fear), does a consistent application of "utilitarianism for animals" obligate large-scale human intervention (e.g., predator sterilization, habitat separation, or even eradication) to prevent this suffering?  
      *Likely Response/Anticipatory Follow-Up:* If the response appeals to ecological complexity, unintended consequences, hubris, or "naturalness," ask: **"If preventing equivalent suffering caused by *human* actions (e.g., factory farming) is obligatory, why does the *source* (natural vs. anthropogenic) of the suffering change our obligation under an aggregative view? Doesn't prioritizing ecosystem stability over individual suffering implicitly value something *other* than aggregate welfare?"**

  4.  **Moral Weight & Differential Treatment:**  
      *Question:* How does the view determine the *relative moral weight* of human vs. animal interests within the aggregative calculus when they conflict? If preventing immense animal suffering requires a trivial human inconvenience, it seems clear. But what about significant human interests versus severe animal suffering? What principle governs this trade-off?  
      *Likely Response/Anticipatory Follow-Up:* If the response suggests a significant discounting of animal interests or an implicit lexical priority for human interests, ask: **"Doesn't significant discounting or lexical priority effectively undermine the seriousness of 'utilitarianism for animals' by making human interests nearly always trump? If not discounting, what objective metric prevents the framework from demanding extreme human sacrifices for marginal animal gains?"**

  5.  **Kantian Constraints & Instrumentalization:**  
      *Question:* The prohibition against using persons "merely as a means" is central. Yet, in the animal utilitarian calculus, *are* animals used merely as means? For instance, in animal testing aimed at human benefit, even if suffering is minimized, isn't the animal's fundamental interest in life/liberty sacrificed *for* an aggregate end? Doesn't this precisely constitute "using as a means"?  
      *Likely Response/Anticipatory Follow-Up:* If the response distinguishes this as permissible within aggregation or denies animals are "ends-in-themselves," ask: **"If aggregative welfare *justifies* using an individual solely as a means to a greater good, doesn't this expose a fundamental conflict between the two moral frameworks when applied *by humans*? How can the Kantian agent *act* on utilitarian principles towards others without violating their own Kantian integrity regarding the treatment of sentient beings?"**

  6.  **Environmental Ethics & Holism:**  
      *Question:* How does the dual-view framework accommodate concerns that seem orthogonal to individual welfare aggregation, like species extinction, biodiversity loss, or ecosystem health, when these conflict with minimizing individual animal suffering (e.g., culling invasive species)?  
      *Likely Response/Anticipatory Follow-Up:* If the response tries to subsume holism under long-term aggregate welfare or dismisses it, ask: **"Doesn't valuing ecosystems or species intrinsically, or prioritizing them over current individual suffering, require abandoning a strict individualistic welfarist utilitarianism for animals? Isn't this another point where the aggregative model proves insufficient?"**

  7.  **The "Unfinished" Defense:**  
      *Question:* Professor, you've developed Nozick's sketch into a robust position. Given the persistent tensions we've discussed (species boundary, replaceability, predation, trade-offs), what specific *modifications* or *additions* to the core dual framework do *you* propose are necessary to resolve them, moving definitively beyond Nozick's admitted uncertainty?  
      *Likely Response/Anticipatory Follow-Up:* If the response lists complexities or reiterates the framework's core appeal, press: **"Can you point to a *specific theoretical adjustment* within the dual-model structure (e.g., a threshold of sentience for stronger protections, a modified aggregation rule, a limited constraint on killing) that directly resolves one of these core tensions without collapsing the strict Kantian/Utilitarian divide?"**

  8.  **Political & Practical Implications:**  
      *Question:* Translating this theory into policy seems fraught. Does the stark moral divide risk legitimizing practices that treat animals as mere renewable resources, provided aggregate welfare is maintained? Conversely, how can a society respecting strict Kantian constraints for humans effectively implement large-scale utilitarian calculations for animals without hypocrisy or arbitrariness?  
      *Likely Response/Anticipatory Follow-Up:* If the response focuses on incremental welfare reforms or procedural safeguards, ask: **"Doesn't the *theoretical justification* provided by the dual view – animals as subjects of aggregation without inviolability – inherently enable and legitimize exploitative systems (like 'humane' factory farming) as long as the numbers work out? How does the theory itself prevent this?"**

  **Key Strengths of this Question Set:**

  *   **Avoids Summary:** Assumes familiarity with Nozick's passage and the guest's work.
  *   **Targets Core Tensions:** Directly addresses the philosophical pressure points you identified (Species/Capacities, Replaceability, Predation) and adds critical others (Moral Weight, Instrumentalization, Holism, Practicality).
  *   **Anticipates Deflections:** Each follow-up is designed to counter likely responses that retreat to complexity, consequences, or Nozick's tentativeness, forcing engagement with the *substance* of the objection.
  *   **Pushes Development:** Question 7 explicitly asks the guest to move *beyond* Nozick's sketch and defend her own developed solutions.
  *   **Practical Angle:** Question 8 connects the high theory to real-world implications and potential contradictions.
  *   **Respectful but Rigorous:** The questions are challenging but framed to engage with the guest's expertise and contributions.

  Use these as a springboard for a dynamic and critical discussion. Good luck with the meetup!
