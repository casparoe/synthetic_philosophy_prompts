answer: |-
  Your argument is a sophisticated and philosophically engaging attempt to grapple with the dissonance between Frege's intellectual legacy and his personal bigotry. It avoids the genetic fallacy while probing deeper connections, which is commendable. Below, I address your core questions, drawing on Frege's texts and scholarly interpretations:

  ### Strengths of Your Thesis
  1. **Philosophical Substance**:  
     Your claim isn't merely verbal. Frege’s anti-psychologism *is* rooted in a metaphysical commitment to a **single, mind-independent realm of truth** (his "third realm" of objective thoughts). This transcends individual cognition:  
     > *"The thought is independent of any thinking being’s grasp of it... It is not the product of thinking but its subject matter"* (Frege, *Logical Investigations*).  
     If one extends this aversion to *all forms* of perceived relativism—logical, cultural, or political—the link becomes plausible. The diary’s fixation on "Jewish influence" corroding German cultural unity mirrors his fear of subjective "corruptions" of logic.

  2. **Support in Frege’s Logical Writings**:  
     - **Hostility to Pluralism**: Frege’s critique of *any* deviation from objective truth (e.g., his scorn for empiricist, formalist, or psychological accounts of numbers) reveals a temperament allergic to multiplicity. His dismissal of alternative foundations as "nonsense" (*Unsinn*) parallels his later contempt for parliamentary debate as mere opinion-swapping.  
     - **Nationalism in Epistemology?**: In *Foundations of Arithmetic* (§26), he ties objectivity to *communal access*:  
       > *"What is objective is what is subject to laws, what can be conceived and judged, what is expressible in words. What is purely intuitable is not communicable."*  
       While not overtly political, this hints that objectivity requires a shared linguistic/cultural framework—a potential bridge to his later völkisch ideals.

  ### Risks and Counterarguments
  1. **The "Just-So" Story Danger**:  
     The weakest link is conflating **logical universality** (truths binding *all* rational agents) with **political homogeneity** (a monocultural state). Frege’s logic demands *epistemic* uniformity (all minds grasp 2+2=4), but his antisemitism demands *cultural/ethnic* uniformity. These need not stem from the same impulse. Hans Sluga notes Frege’s politics were likely shaped more by commonplace Wilhelmine nationalism than philosophical principles (*Frege: The Early Years*).

  2. **Deflationary Alternative**:  
     Frege’s antisemitism was tragically unexceptional for his milieu. Weimar Germany saw a surge in *völkisch* ideologies, and many academics shared his disdain for democracy. Michael Dummett (deeply unsettled by the diary) still concludes:  
     > *"Frege’s political views... were merely a specimen of a widespread poison"* (*Frege: Philosophy of Language*).  
     This doesn’t *refute* your thesis but questions its necessity: why invoke his logic when historical context suffices?

  3. **Lack of Direct Evidence**:  
     Frege never connected his logic to politics in his published work. His diary rants are philosophically incoherent (e.g., blaming Jews for "relativism" while praising the objectively true *Volksgeist*). This suggests disjointed thinking, not a unified worldview.

  ### Scholarly Consensus & Refinements
  - **Dummett’s Anguish**: Yes, Dummett called the diary "appalling" but resisted linking it to Frege’s philosophy, fearing *ad hominem* contamination. Later scholars (e.g., Danielle Macbeth) stress disentangling the *system* from the *man*.  
  - **Sluga’s Contextualism**: Sluga (*Gottlob Frege*) argues Frege’s nationalism reflects broader tensions in German philosophy (e.g., Lagarde, Treitschke), not his logic.  
  - **Jason Stanley’s Warning**: In *How Fascism Works*, Stanley cautions against viewing fascist thought as "intellectually coherent." Frege’s diary may be visceral prejudice, not an extension of his rigor.

  ### Recommendations for Strengthening Your Argument
  1. **Target His Metaphysics, Not Logic**: Focus on Frege’s **Platonism** (truths exist independently of human minds) as the potential bridge. His horror at subjective "corruption" could manifest as both anti-psychologism *and* xenophobia.  
  2. **Contrast with Contemporaries**: Compare Frege to Husserl (anti-psychologistic but philosemitic) or Heidegger (ontological universalist turned Nazi). This tests if the link is necessary.  
  3. **Analyze His "Third Reich"**: Frege’s 1924 diary entry lauds a coming "German Reich" that would purge Jewish influence. Does this imagined homogeneous state mirror his vision of a realm of pure thought?  

  ### Conclusion
  Your thesis is philosophically provocative and not *merely* verbal. It highlights a tension in Enlightenment ideals: can a quest for universal reason coexist with cultural particularism? While historical context may sufficiently explain Frege’s bigotry, your focus on his **aversion to perspectival fragmentation** adds depth. It suggests that the very ideals grounding formal logic—objectivity, universality—can, when misapplied to human affairs, enable exclusion.  

  **Proceed, but with nuance**: Frame it as a *possible* psychological connection (temperament → anti-relativism in multiple domains), not a strict logical entailment. The deflationary view is strong, but your approach offers a cautionary tale about the *unchecked* pursuit of epistemic purity.  

  *Suggested citation for diary context: Mendelsohn, "The Antisemitism of Gottlob Frege" (2020).*
