answer: |-
  ## The Currency of Justice: A Dialogue

  **Characters:**  
  *   **Diana (Resourcist):** Argues for Ronald Dworkin’s resource egalitarianism, emphasizing responsibility and the hypothetical insurance market.  
  *   **Sam (Capability Theorist):** Advocates for Amartya Sen’s capability approach, focusing on freedom to achieve valuable functionings.  

  **(The scene: A university common room. Diana and Sam are debating over coffee after a seminar on distributive justice.)**

  **Diana:** ...so Sam, I just don’t see how Sen avoids the responsibility problem. If justice is about equalizing *capabilities* – the freedom to achieve various functionings – doesn’t that absolve individuals of responsibility for their choices? If someone freely cultivates expensive tastes, like a craving for vintage Château Lafite, why should society subsidize that preference? Resources, starting from an equal baseline, are the fair metric. What you do with them is on you.

  **Sam:** Diana, the baseline *is* the problem. Equal resources don’t translate to equal freedom to live well. Take our first case: **Alex, born with a severe physical disability requiring constant, expensive care.** Suppose you give Alex and Ben – who has no disability – identical resource bundles at birth: say, $1 million each.

  **Diana:** Right. That’s the starting point. Equality of resources achieved.

  **Sam:** But Alex immediately faces costs Ben doesn’t: specialized equipment, personal care, home modifications, maybe reduced earning capacity. That $1 million evaporates *fast* meeting basic needs Ben meets effortlessly. Alex’s freedom to achieve functionings like ‘mobility’, ‘health maintenance’, or even ‘social participation’ is radically constrained compared to Ben’s, *despite* identical starting resources. Resources alone tell us nothing about Alex’s real opportunities. Justice requires compensating for that disadvantage to equalize their real freedom to live a decent life – their capabilities.

  **Diana:** I agree Alex starts with a disadvantage! But the resource metric *can* handle this fairly, without resorting to vague capabilities. Enter Dworkin’s **hypothetical insurance market**. Imagine everyone *before birth*, behind a veil of ignorance where they know the statistical distribution of disabilities in society, but not their own fate. They have an equal initial resource share to spend. Prudent people would spend some of that share to buy insurance against being born severely disabled.

  **Sam:** Okay, set the stage. They know the risks, have equal purchasing power in this hypothetical auction. How much insurance do they buy?

  **Diana:** They’d buy coverage that provides them with the resources necessary to achieve a decent life *if* they turn out disabled. The premium is paid from their initial share. The payout isn't based on some pre-defined "decent life" capability list; it's determined by what prudent people, knowing the risks and wanting to protect themselves against catastrophe, would rationally choose to spend. The market aggregates those choices. Society then taxes everyone equally (reflecting the premium) and uses the funds to provide the actual disabled person (Alex) with a resource bundle equivalent to what that insurance payout would have been. This respects ambition and endowment – Alex gets compensated for bad luck (endowment), but the *level* of compensation is set by what people would choose for themselves, reflecting a shared sense of sufficiency.

  **Sam:** That’s clever, Diana, but I think G.A. Cohen was right: **it just pushes the question back a step.** *How* do these hypothetical prudent agents decide "how much is enough" insurance? What informs their calculation of the resources needed for a "decent life" if disabled?

  **Diana:** They know the costs associated with various disabilities in the real world – the price of wheelchairs, carers, medical care. They’d insure up to the point where the marginal cost of more insurance outweighs the marginal benefit of extra security against a catastrophic outcome. It’s about mitigating brute bad luck to a level prudent people find acceptable.

  **Sam:** But that “acceptable level” *presupposes* a normative judgment about what constitutes an unacceptable level of deprivation! When they imagine "life as a disabled person," what do they imagine *must* be secured? Mobility? Freedom from pain? Social inclusion? Access to fulfilling work? Isn’t their calculation implicitly driven by a judgment about the *capabilities* they find essential to a minimally decent life? They’re trying to insure against falling below a threshold of *capability* – the freedom to achieve certain functionings they deem fundamental. You’re smuggling in a capability metric through the back door of hypothetical prudence. The market doesn't *solve* the "equality of what?" question; it operationalizes an answer that *relies* on an underlying, unarticulated notion of sufficiency defined in terms of... well, capabilities.

  **Diana:** (Slightly frustrated) It relies on people’s *own* judgments about risk and sufficiency in a fair initial position! It’s procedural, not substantive. It doesn’t require philosophers like us to define a definitive list of "essential capabilities." The market aggregates individual preferences under fair conditions.

  **Sam:** But those "individual preferences" about sufficiency aren't formed in a vacuum. They're shaped by societal norms about what a disabled life *should* be like. More crucially, let’s test this asymmetry you prize. Case two: **Charlie, who has deliberately cultivated a taste for incredibly rare and expensive wines.** He gets no joy from cheaper alternatives. He claims his welfare is drastically reduced without his daily Château Pétrus. Under resource egalitarianism, you treat Charlie very differently from Alex.

  **Diana:** Absolutely. Alex had no choice about his disability. It was brute bad luck. Charlie *chose* to develop this expensive taste. He could have cultivated a taste for perfectly nice $20 bottles. Justice doesn't require compensating people for the consequences of their own deliberate choices. Giving Charlie extra resources to satisfy his cultivated taste would be unfair to those who content themselves with less expensive pleasures. Resources were equal at the start; Charlie chose the expensive path. Tough luck.

  **Sam:** But here’s the pressure point: **Where do you draw the line between "brute luck" endowment and "option luck" choice?** Is Alex's disability *entirely* brute luck? What if aspects of his condition could be mitigated by choices he made earlier? Conversely, is Charlie's taste *entirely* voluntary? Didn't his upbringing, social circle, maybe even innate predispositions, influence his susceptibility to cultivating that taste? You call it "deliberate cultivation," but how pure is that choice? More fundamentally, *why is the metric different*?

  **Diana:** The metric *isn’t* different! It’s resources throughout. The difference is in the *cause* of the disadvantage. For Alex, the cause is unchosen circumstance (bad brute luck). The insurance market compensates for that. For Charlie, the cause is his own choice (option luck). No compensation. The resource metric handles both, but applies compensation only for unchosen disadvantages.

  **Sam:** But the *reason* you compensate Alex is that his resource deficit translates to a capability deficit in areas deemed fundamental – mobility, health. You don’t compensate Charlie because you judge his deficit – the inability to drink Pétrus – as not fundamental; it’s a luxury preference. So again, lurking beneath the resource surface is a capability judgment! You’re using the resource transfer *to achieve capability sufficiency* in core areas for Alex, while denying it to Charlie for non-core areas. The asymmetry *relies* on an implicit hierarchy of capabilities – mobility good, expensive wine bad. Your "resource" solution only works because you’ve smuggled in a capability threshold for what counts as a compensable disadvantage due to brute luck. If Charlie claimed his expensive taste was essential for his mental health or social standing, you’d likely dismiss it, making a *capability judgment* about what constitutes a legitimate need versus a frivolous preference.

  **Diana:** (Pauses) That’s... an interesting challenge, Sam. But the insurance market *is* the filter. Prudent agents wouldn’t insure against failing to cultivate expensive tastes. They *would* insure against being unable to walk or care for themselves. The market reflects the distinction between fundamental needs and luxury preferences *without* the theorist having to define "fundamental capabilities" arbitrarily. The distinction emerges from rational choice under fair conditions.

  **Sam:** But doesn’t that just relocate the indeterminacy problem *you* raise against me? You ask, "How do we select the *right* list of capabilities? Isn't it arbitrary?" I ask, "How do we know the hypothetical insurance market converges on the *right* level of coverage? What counts as a 'prudent' choice? Isn't *that* indeterminate?" Your market depends on assumptions about risk aversion, available information, and the very definition of "catastrophe" or "decent life" that agents use. Is insuring for basic mobility enough, or should it cover enabling Alex to pursue a demanding career? Where’s the line? Isn't defining the parameters of the hypothetical market just as contested as defining a capability list? Cohen’s "midfare" idea – resources dedicated to generating specific functionings – was an attempt to bridge this, but it still faces the "which functionings?" question.

  **Diana:** Perhaps, but the market offers a *procedural* answer grounded in hypothetical individual choice, not a *substantive* list imposed top-down. It respects pluralism about the good life while ensuring a fair baseline. People might disagree on the perfect capability list, but they can agree on a fair procedure for handling risk. The indeterminacy is bounded by rationality and known costs.

  **Sam:** And I argue the capability approach offers a more *direct* focus on what ultimately matters – human freedom and flourishing. We *can* have reasoned public debate about core capabilities essential for dignity and participation in society – like Nussbaum proposes. Yes, the list requires justification and is contestable, but so does the design of your hypothetical market and the interpretation of its results. At least capabilities force us to confront the ethical question of "what kind of lives can people live?" head-on, rather than hiding behind the aggregating mechanism of a market that itself relies on unexamined normative assumptions about sufficiency. Alex’s plight shows resources alone are inert; it’s the ability to *do* and *be* that justice should equalize, especially when disadvantage stems from unchosen circumstances.

  **Diana:** And Charlie’s case shows why we *must* hold people responsible for their choices, otherwise justice becomes a bottomless pit subsidizing any preference. The insurance market, for all its hypothetical nature, provides the best tool we have for distinguishing the Alexs from the Charlies in a way that respects both fairness and freedom. The indeterminacy in setting the market parameters is less problematic, I think, than the indeterminacy of defining "essential capabilities" outside of any procedural fairness.

  **Sam:** Yet the Alex/Charlie asymmetry only holds water, Diana, because deep down, your procedural market is calibrated to secure a substantive level of core capability security for the unlucky, while denying it for the voluntarily extravagant. You haven’t escaped the capability metric; you’ve embedded it within your mechanism. The real disagreement might be whether that embedding makes the capability judgments more objective and choice-respecting, or just obscures them.

  **Diana:** (Sighs, takes a sip of coffee) We’re back to the fundamental divide, aren’t we? Resources versus freedom, procedure versus substance, the limits of responsibility... I suspect Priya and your friend could argue this all night too.

  **Sam:** (Smiles wryly) Probably. But at least now we’ve mapped the trenches a bit more clearly. The pressure points are real – the indeterminacy cuts both ways, and the asymmetry rests on foundations both sides will keep probing. Another coffee?

  **Diana:** Please. This could take a while.

  **(The dialogue ends without resolution, highlighting the deep philosophical tensions: the procedural appeal vs. potential normative smuggling of the insurance market, the challenge of drawing the brute luck/option luck line, the shared but differently manifested problem of indeterminacy in defining sufficiency, and the fundamental question of whether resources are truly the end or merely a means to the real end of human freedom.)**
