  For intuition: The base rate difference is like two cities with different crime rates. Even with identical security systems (the model), the city with higher crime will have more false alarms because there are simply more actual criminals to confuse with innocent people. No camera upgrade can fix that underlying demographic reality. 

  For thresholds: Imagine setting lower bar for "suspicious behavior" in high-crime areas. Yes, you'll catch more criminals there (reducing FNs), but you'll also arrest more innocent people (increasing FPs). And crucially, you're now profiling by location - which is essentially what COMPAS would be doing racially. The model becomes explicitly discriminatory, which violates both ethical norms and likely the 14th Amendment. 

