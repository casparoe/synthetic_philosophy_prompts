answer: |-
  Here’s a dialogue between **Alex** (defender of the counterfactual analysis) and **Morgan** (skeptic who sees dispositions as primitive). They’re sparring over coffee after a philosophy seminar.  

  ---

  **Alex:** Look, I get why you’re skeptical about counterfactual analyses after finks and masks. But Lewis’s “causal basis” patch *works*. A live wire isn’t just “would shock if touched”—it’s *because* it has a stable physical structure (say, electrons primed to flow) that *would* cause the shock *if* contacted. The finkish wire fails because the *basis* vanishes the moment before contact. The sensor *removes* the disposition by altering its causal basis. No mystery.  

  **Morgan:** Fine, but what about **masking**? Take your poison example: cyanide has the causal basis to kill by binding to cytochrome c oxidase. You ingest it with its antidote—hydroxocobalamin—which *immediately* binds the cyanide first. The causal basis is *intact*—the cyanide’s molecular structure hasn’t changed—yet “would kill if ingested” is false. Your analysis says it’s *not* poisonous in that moment. But that’s absurd! The disposition doesn’t vanish—it’s just **counteracted**.  

  **Alex:** Not absurd! The disposition *is* there, but the counterfactual’s *antecedent* isn’t met cleanly. When you say “if ingested,” you imply *normal conditions*—no antidote present. Lewis’s fix handles this: the disposition holds *iff* the causal basis *would* produce the effect *in conditions where nothing interferes*. The antidote is interference.  

  **Morgan:** Oh, so now we’re smuggling in “normal conditions”? That’s a blank check for ad-hoc exceptions! Let’s make it worse: **reverse masking**. Imagine a vial of liquid that’s *not* poisonous—say, water—but it’s hooked to a sensor that *adds* poison the instant it touches your tongue. Now, “would kill if ingested” is *true*, but it has no poisonous causal basis until ingestion! Your analysis calls this “poisonous,” but intuitively, it *wasn’t*—it was inert until the finkish mechanism activated.  

  **Alex:** Touché. But we can refine: the causal basis must be *intrinsic* and *stable*. The water’s “disposition” isn’t intrinsic—it depends on an external machine. Real dispositions are grounded in the object’s *own* properties.  

  **Morgan:** Then try this: **self-masking poison**. The cyanide molecule is engineered to release its own antidote *if and only if* ingested by a human (say, via pH sensitivity). In the bottle, it has the causal basis for toxicity. The moment it hits your stomach, it neutralizes itself. So: intrinsic basis, but “would kill if ingested” is false. Is it still “poisonous” in the bottle? Your counterfactual says no. I say yes—it’s *poison* that self-destructs on contact.  

  **Alex:** ...Alright, maybe we need a *modal* layer. Dispositions aren’t about *single* counterfactuals but a *cluster*. The poison is disposed to kill *unless* specific interferers arise. We can model it with *ceteris paribus* laws—  

  **Morgan:** **No.** Now you’re retreating into vagueness. Every “unless” is a new patch for a new edge case. Meanwhile, my view is simple: “poisonous” is a primitive property. We *observe* it in the cyanide’s structure and behavior across contexts. When we say “would kill if ingested,” we’re *describing the symptom* of the disposition, not defining it. The antidote masks the *symptom*, not the property.  

  **Alex:** But then what *is* the property? How do you explain why the poison *doesn’t* kill when masked?  

  **Morgan:** Same way we explain charge or mass: it’s fundamental. Dispositions have *manifestation conditions*. The poison has the power to kill, but that power requires a pathway (ingestion without antidote). When the pathway’s blocked, the power doesn’t vanish—it’s unmanifested. Like your toaster’s heating element: it’s “dangerous” because it *can* burn—even if the cutoff switch *usually* masks it.  

  **Alex:** That’s circular! “Power” is just disposition repackaged. And without counterfactuals, how do you distinguish a “dangerous” toaster from a cold brick?  

  **Morgan:** Through its *categorical basis*: the nichrome wire’s resistance, the electrical contacts. But crucially, I’m *not reducing* “dangerous” to those. The disposition *supervenes* on them but isn’t *defined* by them. Your counterfactual approach chases its tail because reality is messy—there’s always another fink, mask, or mimic.  

  **Alex:** ...What if we go *subjunctive* with time? “Object O is disposed to M when C iff, *were C to occur and no external intervention to alter O’s basis during C*, O would M.”  

  **Morgan:** **Time-travel fink.** Imagine a wire that’s dead *now*, but if touched, a nanobot *from the future* zaps back to make it live *just before* contact. “No external intervention during C”? The nanobot alters the basis *during* contact. Now your analysis says it *wasn’t* live pre-touch—but it *shocks you*.  

  *[Alex stares into their coffee, Morgan sips theirs. A beat of silence.]*  

  **Alex:** Maybe... maybe we need to accept that dispositions are *mind-dependent*. We pick the relevant counterfactuals for our purposes. Your toaster isn’t “dangerous” *simpliciter*—it’s dangerous *for customers* but not *for engineers who know the cutoff works*.  

  **Morgan:** Then we’ve abandoned objectivity. And my poison is poisonous *even if* every human carries the antidote. Face it: we point to the poison and say “that’s toxic,” the wire and say “that’s live,” because these are real, irreducible features of the world. Your patches are clever, but they’re a leaky boat—you’ll always be bailing.  

  **Alex:** And you’re calling “magic” on something science explains causally. But fine—I’ll build a better patch. There’s *always* a way.  

  **Morgan:** And I’ll dream up a weirder fink. There’s *always* a counterexample.  

  *[They both laugh, neither conceding. The waiter brings the check.]*  

  ---

  **Key moves recap:**  
  - **Alex** leans on **Lewis’s causal basis** + **normal conditions** → countered by Morgan’s **self-masking poison**.  
  - **Morgan** pushes **primitive dispositions** → challenged by Alex’s “how do you explain non-manifestation?”  
  - **New edge cases**: **reverse masking** (inert→toxic upon contact), **time-travel fink** (avoids temporal clauses).  
  - **Stalemate**: Alex’s optimism (patching is infinite but possible) vs. Morgan’s pessimism (patches are ad-hoc; dispositions are bedrock).  

  Neither "wins"—the debate mirrors the literature’s unresolved tension. Did it leave you torn?
