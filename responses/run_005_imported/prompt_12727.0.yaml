answer: |-
  ## Dialogue: The Dam and the Demos

  **Setting:** A university coffee shop after a seminar on democratic boundary problems. **Elena** defends the all-affected-interests principle. **David** defends the all-subjected-to-coercion principle. They debate the case of "Aquastan" building a dam affecting downstream "Farmlandia."

  **Elena:** Okay, David, concrete case: Aquastan’s parliament votes tomorrow on the "Riverbend Dam." Their engineers admit it *will* leach toxins into the River Azure, poisoning Farmlandia’s crops downstream. Farmlandian farmers have zero say. Goodin’s principle screams injustice: their vital interests are profoundly affected. They *must* have a formal voice – consultation at minimum, ideally enfranchisement for this decision.

  **David:** Hold on, Elena. I agree it’s a terrible outcome, but jumping straight to enfranchisement? Your "all-affected-interests" principle is a recipe for infinite regress. *Every* significant state action affects *someone* outside its borders! Trade policy affects global markets, emissions affect climate, even cultural subsidies affect global artists. If we enfranchise every potentially affected person globally for *every* decision, we dissolve national democracies into an unworkable global soup. Coercion is the key boundary. Who is *subjected to Aquastan's coercive legal order*? Farmlandians aren’t. They live under Farmlandia’s laws. Aquastan isn’t *commanding* them; it’s *harming* them, which is different.

  **Elena:** Different? Is it? Let’s press your coercion line, David. When Aquastan’s border guards turn away Farmlandian migrants at gunpoint, *that’s* coercion, right? You’d say *that* act needs justification *to* those migrants, even if they’re non-citizens?

  **David:** Yes, absolutely. The act of forcibly excluding or including someone within a jurisdiction, subjecting them to its enforcement power, requires justification *to them*.

  **Elena:** Precisely! Now, apply that to the *consequences* of the dam. Aquastan’s decision actively *imposes* poisoned water on Farmlandia. They *know* it will destroy livelihoods. Isn’t that also an act of force – an environmental imposition – backed ultimately by Aquastan’s state power? If border guards using guns to exclude is coercion justifying a claim to justification, why isn’t a state apparatus knowingly poisoning a shared resource *also* a coercive imposition justifying a claim to justification? It’s force applied *across* the border, just less direct. If you include the migrant facing the gun, consistency demands you include the farmer facing the poison. Otherwise, your "coercion" line is arbitrary – drawn just to exclude inconvenient outsiders.

  **David:** Hmm. That’s a sharper point. But there’s a distinction in the *mechanism of subjection*. The migrant is directly confronted by Aquastan’s enforcement agents acting under its laws. The farmer suffers harm *caused* by Aquastan, but isn’t *subject to its ongoing legal authority*. Aquastan doesn’t tax her, arrest her, or command her. The harm is an *externality*, however severe. Coercion requires direct subjection to the sovereign’s *authoritative commands and enforcement*. The dam is a policy *within* Aquastan that *happens* to spill over.

  **Elena:** "Happens to"? They *choose* the toxic design knowing the impact! That’s deliberate imposition. But let’s grant your distinction for argument's sake. What about resident non-citizens *in* Aquastan? Say, Farmlandian migrant workers living there. Under your principle, Aquastan’s laws *do* coercively apply to them – they can be arrested, taxed, deported. So you’d enfranchise them, right? Because they are subjected to coercion?

  **David:** Yes, resident non-citizens are clearly subjected to the state’s coercive power. They should have a voice in the demos governing that power – ideally through citizenship, but at minimum strong consultative rights.

  **Elena:** But here’s the rub: *Why* are they subjected? Only because Aquastan *already decided its borders*! Its coercive jurisdiction is premised on a prior act of bounding – deciding who is inside and subject to coercion, and who is outside and not. That prior bounding act *itself* coerces outsiders (like the migrants at the border) and insiders (by defining the rules). Yet *that* foundational act wasn’t justified to *everyone* it coerced! Farmlandians weren’t consulted when Aquastan drew its borders centuries ago. Your principle demands justification *for coercion*, but the very *existence* of a bounded demos exercising coercion *presupposes* an unjustified, foundational act of coercion defining who is subject! It smuggles in the boundary it’s supposed to justify.

  **David:** ...You’ve hit the foundational paradox. Abizadeh acknowledges this. The point is that *ongoing* exercises of coercive power, including the *maintenance* of borders *now*, require justification to all those currently subjected – insiders *and* those outsiders coerced by border enforcement. The *origin* might be non-democratic, but the *present* practice must be justifiable. For the dam, while the *external harm* is awful, it’s not an act of *sovereign coercion over Farmlandians*, unlike the border guards actively repelling migrants *today*. We need harm mitigation – treaties, compensation, international courts – not necessarily dissolving the demos for every spillover effect.

  **Elena:** But David, doesn’t building the dam *presuppose* and *rely on* that prior, unjustified boundary? Aquastan feels entitled to dam *their* river segment *only* because they assume exclusive jurisdiction based on that coercively established border. The harm *depends* on the prior act of exclusion your principle condemns as needing justification! And if maintaining borders requires justification to outsiders, why doesn’t maintaining an environmental policy that actively destroys their lives *also* require it? The distinction feels artificial when the consequence is existential harm.

  **David:** It’s about the *nature of the power being exercised*. The dam is an exercise of *internal* resource sovereignty (however harmful externally). Border enforcement is the exercise of *constitutive* sovereignty – the power to define the demos itself. That constitutive power *always* requires justification to those it defines as subject to it (insiders) *and* those it forcibly excludes. For the dam, the harm, while terrible, is a *consequence* of an internal decision, not the *direct application* of sovereign authority over Farmlandians. We need robust transnational mechanisms for such harms, but enfranchising Farmlandians in Aquastan’s legislature conflates distinct issues and makes democratic self-government impossible.

  **Elena:** And *your* principle makes the scope of justification for borders potentially global – anyone coerced by them anywhere. Doesn’t *that* explode into a global demos for foundational boundary questions? We both face the regress. My principle struggles with scope for *every decision*; yours struggles with scope for the *foundational act of bounding* and defining what counts as "coercion." Neither escapes the need for a prior, contested boundary to *apply* the principle itself.

  **David:** True. The regress looms for both. But I think coercion offers a *principled* and *operationally necessary* anchor point. We start with those demonstrably subject to the state’s *ongoing, direct coercive authority* – its laws and enforcement. That’s knowable: residents within territory. External harms require different, non-electoral remedies. Granting Farmlandians a *vote* here dissolves the very unit needed for collective action. Consultation? Absolutely. Compensation? Mandatory. But not voting rights.

  **Elena:** And I think affected vital interests, especially when foreseeably and deliberately imposed, create a *moral claim* to direct input that trumps administrative convenience. Ignoring it because they’re outside an arbitrarily drawn coercive circle perpetuates the foundational injustice. We agree the harm demands remedy, but disagree fundamentally on *who gets to decide the remedy*. You trust the bounded demos plus external pressure; I demand the affected be *inside* the decision-making circle for decisions that destroy them. The boundary problem remains: we both need an initial "we" to adopt our preferred principle... and that "we" is precisely what’s in question.

  **David:** Exactly. So we circle back. My "we" starts with the coercively bounded community striving for internal legitimacy *and* justifying its boundaries. Yours starts... where? With a map of affected interests for each issue? The concrete disagreement narrows to this: Is knowingly imposing catastrophic harm *across* a border via sovereign action *sufficiently like direct coercion* to require inclusion in the demos *for that specific decision*, or is it a tragic externality demanding other forms of justice? That’s where we’re stuck.

  **Elena:** That’s it. And the dam vote happens tomorrow. Let’s hope Farmlandia has a good lawyer... and that Aquastan's demos has a conscience. Another coffee?

  **David:** (Sighs) Please. Black. The abyss of democratic theory is thirsty work.

  **(End Scene)**

  **Key Disagreements Narrowed:**
  1.  **Nature of Harm vs. Coercion:** Is knowingly imposing severe, direct harm across a border via state action *equivalent to* subjection to sovereign coercion, justifying inclusion in the demos *for that decision* (Elena), or is it a distinct category of externality requiring different (non-electoral) remedies (David)?
  2.  **Operational Scope:** Does applying the all-affected principle *inevitably* dissolve bounded democracy for most significant decisions (David), or can it be pragmatically bounded by focusing on vital, direct, and foreseeable impacts (Elena)? Conversely, does applying the coercion principle *only* at the border maintenance level avoid impractical global scope (David), or does its logic *also* explode when considering the coercive foundations of *all* state actions (Elena)?
  3.  **The Foundational Act:** Both acknowledge the regress. David prioritizes stabilizing a (retrospectively justified) bounded demos for internal decisions. Elena prioritizes disrupting the bounded demos when its actions foreseeably devastate outsiders, seeing the boundary itself as implicated in the harm. Neither has a clean solution to *who initially adopts the principle*.
