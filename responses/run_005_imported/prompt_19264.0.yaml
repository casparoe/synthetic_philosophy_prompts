  Okay, the user is dealing with a real-life argument with his brother about being a bad uncle and not helping with their mom. He's confused because he learned that calling out hypocrisy (tu quoque) is a fallacy, but now he's hearing philosophers talk about "standing to blame" as a valid concept. He wants to understand how these fit together and whether his brother's criticism holds any weight despite being hypocritical.

  First, I need to explain the difference between the fallacy and the philosophical concept of standing. The tu quoque fallacy is about dismissing an argument just because the person is hypocritical, which doesn't address the truth. But standing is about the moral authority or position to blame someone. So even if the accusation is true, the hypocrite might lack the right to deliver that blame because they're guilty of the same thing.

  The user's main questions are: (1) How to understand standing without falling back into the fallacy, and (2) whether hypocrisy completely invalidates the blame or just weakens it. He also wants to apply this to his situation with his brother.

  For the first question, I should outline the key theories. Wallace talks about equal standing, where you need to have lived up to the norm yourself to blame others. Cohen uses the "casting the first stone" idea, where hypocrisy involves misrepresenting your own moral record. Fritz and Miller emphasize the expressive function of blame—how it communicates shared norms. The common thread is that blame isn't just about facts; it's a social act that requires credibility.

  For the second question, there's a spectrum. Some philosophers think hypocrisy completely undermines standing, making the blame void. Others see it as a pro tanto issue, where the blame is weakened but not erased, especially if the wrongdoing is severe. The user's case involves both parties failing in different areas (uncle duties vs. parental care), so it's not identical. But the brother's hypocrisy might still weaken his moral authority to call out the user.

  Applying this to the user's situation: His brother's accusation about not visiting might be true, but his own absence in caregiving undermines his standing. However, since the brother is right, the user should still reflect on his actions. The brother's hypocrisy doesn't erase the truth, but it makes his delivery less credible. The user needs to separate the validity of the criticism from the brother's right to express it. 

  The user might also be seeking validation that his brother was out of line, but the deeper need is understanding how to navigate moral conflicts where both parties have faults. He wants to resolve the family tension by grasping the principles behind the argument. Clarifying that standing is about the act of blaming, not the truth, helps him see why his brother's hypocrisy matters without ignoring his own shortcomings.
answer: |-
  That's a fascinating and deeply relatable real-life puzzle! You've nailed the core tension: **tu quoque** (calling out hypocrisy) **is** a logical fallacy when used to *dismiss the truth* of a claim, yet philosophers of "moral standing" argue that hypocrisy *does* genuinely undermine one's *right or authority* to level the blame, even if the claim is true. Here's how to untangle it, focusing on your core questions:

  **1. Understanding "Standing" Without Smuggling in Tu Quoque**

  The key is separating two distinct elements:

  *   **The Truth/Validity of the Accusation:** Is the claim "You are a bad uncle because you barely visit" *true*? This is about *your* actions and the norms of uncling.
  *   **The Standing to Blame:** Does your *brother* have the *moral authority* or *rightful position* to *level this specific blame* against *you*? This is about *his* relationship to the norm he's invoking and his own conduct.

  **Standing theorists argue hypocrisy undermines the *second* element without necessarily affecting the *first*. Here's the core reasoning (drawing on Wallace, Cohen, Fritz & Miller, etc.):**

  *   **Blame as a Communicative, Second-Personal Act:** Blame isn't just stating a fact ("X is bad"). It's a *demand* for accountability, an expression of a *shared commitment* to a norm, and an implicit claim to speak *for* that norm. Think of it like a judge sentencing a criminal – the judge must be impartial and not guilty of the same crime *to have the legitimate authority to impose the sentence*, even if the criminal is guilty.
  *   **Hypocrisy as a Failure of Shared Commitment/Representation:**
      *   **Wallace (Hypocrisy & Equal Standing):** To blame someone for violating a norm, you must genuinely accept that norm *as binding on yourself* and hold yourself accountable to it. Blaming while *habitually violating the norm yourself* demonstrates you *don't* truly accept its authority over *you*. You lack "equal standing" – you're not playing by the same rules you're trying to enforce on others. Your brother demanding you adhere to "family duty" norms while flagrantly violating them himself regarding your mom shows he doesn't genuinely accept those norms as binding *on him*.
      *   **Cohen ("Casting the First Stone"):** A hypocritical blamer misrepresents their *own moral record*. They present themselves as a virtuous upholder of the norm when they are actually a violator. This misrepresentation poisons the communicative act of blame, making it dishonest or manipulative. Your brother presents himself as the champion of family responsibility while hiding (or dismissing) his own major failure in that domain.
      *   **Fritz & Miller (Expressive Function):** Blame expresses shared values. Hypocrisy expresses a *contradiction*: "This norm is so important *for you* that I blame you, but it's not important *for me*." This undermines the sincerity and shared understanding necessary for blame to function as a moral communication.

  **How this avoids Tu Quoque:** The tu quoque fallacy says: "You're a hypocrite, therefore *what you say about me is false*." Standing theory says: "You're a hypocrite, therefore *you lack the moral authority to level this specific demand for accountability against me, even if I am culpable*." It's about the *speaker's position*, not the *truth value of the claim*.

  **2. Does Hypocrisy Void the Blame Entirely or Just Weaken It?**

  This is where the major philosophical debate lies! There's a spectrum:

  *   **The "Voiding" (Misfire/Full Loss of Standing) View:**
      *   **Argument:** Hypocrisy is so corrosive to the communicative act of blame that it renders it *invalid* or *moot*. The blame simply doesn't land as a legitimate moral demand; it "misfires" (like promising something impossible). The hypocrite has forfeited their right to speak *for* the norm they violate. On this view, your brother's criticism doesn't just *feel* off, it *is* off – it fails *as blame* directed by him to you.
      *   **Proponents:** Often associated with a strong reading of Cohen or Wallace. If standing is a *necessary condition* for the speech act of blame to be valid, hypocrisy makes it invalid.
      *   **Implication for You:** Your brother's words might contain a true description ("you don't visit much"), but they fail *as an act of blaming you*. You can rightly dismiss *him* as the source of this blame.

  *   **The "Weakening" (Pro Tanto/Partial Loss of Standing) View:**
      *   **Argument:** Hypocrisy is a *defeater* or *underminer* of standing, but it doesn't necessarily annihilate it completely. It creates a *pro tanto* reason (a reason that holds unless outweighed) to discount the blame *as coming from that person*. However:
          *   **Severity Matters:** If the violation you're being blamed for is *extremely* serious (e.g., abuse vs. infrequent visits), the hypocrite's own failing might seem less relevant to the *truth* and *weight* of the accusation against *you*.
          *   **Repentance/Reform:** If the hypocrite has genuinely acknowledged and reformed their own behavior, they might regain standing.
          *   **The Norm Itself:** The core wrongness of *your* action isn't erased by the hypocrite's failing. The *truth* of the accusation remains.
      *   **Proponents:** This is a more common, nuanced view. Fritz & Miller often lean this way. It acknowledges the force of hypocrisy without making blame entirely speaker-dependent.
      *   **Implication for You:** Your brother's hypocrisy significantly weakens his position to lecture you about absence. It makes his criticism *less authoritative, less credible, and perhaps unfair in its delivery*. However, the *underlying point* about your lack of visits being a potential failing *as an uncle* might still stand on its own merits and warrant your reflection, regardless of who said it. You should separate the *message* (is being an absent uncle bad?) from the *messenger* (is my brother the right person to call me out?).

  **The Shape of the Disagreement & Applying it to Your Thanksgiving:**

  *   **The Core Debate:** Is standing an *absolute requirement* for blame to be valid (voiding view), or is hypocrisy a *strong but potentially overcomable defeater* (weakening view)? The weakening view is generally more popular, recognizing that while hypocrisy is a serious flaw in the blamer, the moral reality of the wrong done by the blamed party doesn't vanish.
  *   **Your Brother's Point (The Truth):** He's likely correct that barely visiting *does* make you a less good uncle. That factual claim stands independently.
  *   **Your Brother's Standing (The Hypocrisy):** His complete absence from helping your mom for two years *severely undermines his standing* to blame you for absence within the family. He demonstrates a lack of genuine commitment to the "family duty" norm he's invoking against you (Wallace) and misrepresents his own record (Cohen). This makes his blame hypocritical, potentially manipulative, and lacking in moral authority *coming from him*.
  *   **Does He Have *Any* Point?**
      *   **On the Truth:** Yes. His accusation likely contains factual accuracy about your actions.
      *   **On His Standing to Blame You:** **No, he lacks the moral authority *to be the one delivering this specific blame*.** His hypocrisy is highly relevant to *his* position as the blamer. You were right to feel it was "off" for *him* to say it.
      *   **The Weakening View Nuance:** While his hypocrisy voids *his authority* to blame you, it doesn't erase the potential truth that you *could* be a better uncle. That's something to reflect on *separately* from his hypocrisy. However, his hypocrisy gives you a very strong *pro tanto* reason to reject *his specific act* of blaming you and to feel his criticism is unfair *as delivered by him*.

  **Conclusion & Practical Takeaway:**

  1.  **Tu Quoque Fallacy:** You were correct that "you do it too!" doesn't *disprove* that you might be an absent uncle. The truth stands.
  2.  **Standing to Blame:** You were *also* correct that your brother's hypocrisy makes *him* uniquely unqualified to deliver that criticism. His actions show he doesn't genuinely uphold the norm he's weaponizing against you. He lacks standing.
  3.  **Voiding vs. Weakening:** While philosophers debate the *absolute* effect, the practical reality aligns with the **weakening view**:
      *   Your brother's blame **lacks moral force *coming from him*** due to his hypocrisy. You are justified in rejecting *his lecture* and pointing out his double standard. His criticism "doesn't land" *as his authoritative judgment*.
      *   However, the **underlying issue** (your involvement as an uncle) might still be a legitimate area for self-reflection, *independent* of his hypocrisy. Don't let his bad standing blind you to potential truth about your own actions, but also don't let the truth of the accusation legitimize *his* hypocritical performance.

  **In short: Your brother was factually right about your absence but morally wrong to be the one calling you out on it given his own checked-out behavior. His hypocrisy doesn't erase your potential failing, but it completely undermines his right to lecture you about it.** Your instinct that it "felt off" was spot-on, grounded in a real philosophical principle about moral authority.
