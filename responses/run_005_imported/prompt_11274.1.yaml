  so my decision theory seminar just covered the Pasadena game (Nover and Hajek's St. Petersburg-style gamble): you flip a coin til it lands heads, and if that happens on toss n you get paid (-1)^(n+1) * 2^n/n dollars -- so $2 if it's heads on the first flip, -$2 on the second, and so on, growing without bound. the expectation works out to the alternating harmonic series, 1 - 1/2 + 1/3 - 1/4 + ..., which only converges conditionally, so by the Riemann rearrangement theorem you can reorder the terms to make it sum to literally anything, or +/- infinity. that's supposedly what makes Pasadena worse than St. Petersburg, where the expectation is at least well-defined (just infinite).

  can you invent a different gamble -- not the Altadena variant Nover and Hajek also cooked up, and not just a rescaled Pasadena -- that runs into that same undefined-expectation problem for the same underlying reason (conditional, not absolute, convergence)? briefly show why the sum isn't absolutely convergent for your example, and give me your take on whether this is genuinely a different kind of problem for expected utility theory than plain St. Petersburg-style divergence, or just the same issue wearing a costume.
