  ### Key Takeaways:
  1. **Strongest fits**: Meter-stick (paradigm contingent a priori) and necessary a posteriori identities (Hesperus/water) are core successes of 2D.  
  2. **Moderate friction**: Descriptive reference-fixing ("Julius") faces rigidity objections.  
  3. **Weakest fits**: Phenomenal and moral identities expose limitations in reconciling epistemic intensions with metaphysical claims, remaining hotly debated.  

  Chalmers' framework excels at epistemic/metaphysical distinctions for rigid designators but struggles with intrinsic properties (consciousness) and normativity where primary intensions resist reduction.
