  The core idea of Chalmers' two-dimensional semantics is to distinguish two intensions:
  - Primary intension: captures the epistemic dimension (how reference depends on the actual world considered as actual). It is often described as what a term picks out in a scenario (a centered world) when we consider that scenario as actual.
