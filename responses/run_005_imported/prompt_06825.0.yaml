  Here’s a toast that honors Priya’s intellectual work while celebrating her character in situationist-compatible terms, weaving philosophy into genuine warmth without lecturing. (Word count: ~650; delivery time: ~4.5 mins):

  ---

  ### Priya's Wedding Toast  
  *(Raises glass)*  

  Priya, my friend—and soon-to-be Dr. Sharma—once told me that if anyone stood here today and called you "the same person in every situation," she’d draft a new dissertation chapter on the spot. *(Gentle laughter, especially from philosophers)*. So, for the sake of her already-overflowing workload—and because I’ve learned from her—I won’t say that.  

  Instead, I want to talk about what makes Priya remarkable in a way that even the strictest situationist would admire: her **uncanny ability to notice what a moment needs**.  

  See, most of us stumble through life waiting for big, obvious cues to be kind or brave. But Priya? She’s a virtuoso of the subtle. She spots the dime in the phone booth of everyday life—and lets it move her. *(Nods from philosophers; curious smiles from others)*.  

  When I was drowning in seminar stress last winter, she didn’t just offer generic “you’ve got this!” cheer. She noticed *how* I was drowning—that it was the loneliness of the work, not the work itself—and showed up at my door with chai, Marx’s *Grundrisse* (open to a very specific page), and zero pressure to perform optimism. That’s not “Priya the always-generous robot.” That’s Priya reading a fragile situation with the precision of a moral cartographer.  

  Or when undergrads come to her office, terrified of sounding foolish? She doesn’t just “be patient.” She *sees* their fear—the slight hesitation at her door—and reshapes the whole space. A deliberate pause. A question about their band shirt. A way of dissolving hierarchy so gently, you’d think it was situational alchemy.  

  And that’s the thing: Priya’s brilliance isn’t in being identically “good” everywhere. It’s in her **practical wisdom**—what Aristotle called *phronesis*. She’s exquisitely tuned to the moral texture of a moment. She knows when a seminar debate needs rigor, when it needs warmth, and when it needs someone to say, “Let’s get tacos.” *(Laughter)*.  

  Which brings me to you, Arjun. *(Turns to partner)*. Priya’s work tells us virtues aren’t monoliths—they’re responsive, evolving things. And if anyone understands that, it’s you. You’ve seen how her compassion at 2 AM during a family crisis looks different from her courage during a thesis defense. You know her patience when teaching your nephew chess versus her fierce advocacy in faculty meetings. You love her not because she’s identically “Priya-shaped” in every context, but because she brings such profound discernment to every context she enters.  

  That’s the quiet magic of what they’re building today: a partnership where two people commit to noticing—deeply noticing—what the other needs in a thousand shifting situations. Not assuming, not generalizing, but *attending*.  

  So, let’s raise our glasses:  
  To Priya and Arjun—two extraordinary perceivers of life’s subtle cues.  
  May you always notice the dimes in each other’s phone booths.  
  May your marriage be a masterpiece of situational wisdom.  
  And may you never, ever need to write that second dissertation chapter. *(Smile at Priya)*.  
  Cheers!  

  ---

  ### Why This Works  
  1. **Philosophical Integrity**:  
     - Praises **local, cue-sensitive traits** (perceptiveness, responsiveness) instead of global virtues.  
     - Highlights *phronesis* (situational discernment) as her core strength—central to neo-Aristotelian defenses (Kamtekar/Sreenivasan).  
     - Explicitly rejects cross-situational consistency ("identically Priya-shaped").  
     - Nods to key studies (Isen & Levin’s dime experiment) without explaining them.  

  2. **Accessibility**:  
     - Concrete stories (chai during stress, undergrads) ground abstract ideas in emotion.  
     - "Dime in the phone booth" is a vivid, intuitive metaphor—no jargon needed.  
     - Humor ("tacos," "dissertation chapter") keeps it warm.  

  3. **Honors Her Work**:  
     - Shows you understand her critique ("not a robot," "no monoliths").  
     - Positions her marriage as the ultimate expression of her ethics: a context for co-created, responsive virtues.  

  4. **For the Room**:  
     - Philosophers hear the rigor: *phronesis*, rejection of globalism, situationist nods.  
     - Non-philosophers hear: "She pays attention," "She knows what people need," "They’re perfect together."  

  **Delivery Tip**: Lean into the stories. Your warmth when describing her act of bringing chai will do more to convey "virtue" than any abstract claim. Pause after "moral cartographer" / "situational alchemy" for philosophers to savor it—then move swiftly to the next human moment.  

  This toast makes Priya’s academic life *deepen* the celebration, rather than intrude on it. And I suspect she’ll appreciate the irony: a speech defending virtue ethics by meticulously avoiding its folk-psychological caricature. Break a leg!
