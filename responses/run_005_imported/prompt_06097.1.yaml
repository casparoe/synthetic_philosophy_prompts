  I'm working on a newsletter piece about the deep history of skepticism about causation, and everyone always jumps straight to Hume, but a philosopher I interviewed for it pointed out that al-Ghazali ran basically the same move centuries earlier in the Tahafut, using that example about fire and cotton, and that Averroes actually wrote a whole book, the Tahafut al-Tahafut, going through it argument by argument to defend real causal powers in nature against him. I dont want to do the lazy "medieval Hume" take that's been done a million times, so I was hoping you could write me a dialogue between the two of them arguing it out face to face over the cotton-and-fire case.

  I'd like Averroes to press Ghazali with his sharpest objections -- something like: if you deny that fire has a nature that necessitates burning, don't you also wreck the necessity that holds any logical demonstration together (including Ghazali's own arguments), and doesn't that undercut the argument from design that's supposed to prove God is wise in the first place, and how would you even tell a genuine miracle apart from ordinary sorcery if nothing has a fixed nature to begin with? And I want Ghazali to have real answers, not just "God can do whatever he wants" -- I gather he's got a more careful position built around habit/custom (al-'ada) that's supposed to block exactly that objection. Keep them evenly matched, have them actually respond to each other's points rather than talking past one another, and maybe aim for 600 words or so of real back-and-forth rather than two speeches stapled together.
