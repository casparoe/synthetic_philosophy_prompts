answer: |-
  You've touched on one of the most profound and enduring debates in ethics—whether aggregate outcomes should always override individual claims to equal consideration. Your instinct isn't misguided; it tracks a serious philosophical position with deep implications for justice and human value. Here's a breakdown of the arguments:

  ### 1. **Your Friend's Position: The Utilitarian ("Expected Value") View**
     - **Core Argument**: Saving six lives creates more total good than saving one. Failing to maximize lives saved is irrational and morally negligent.
     - **Strength**: This aligns with how emergency triage often works (e.g., disaster response). Protocols prioritize saving the most lives when resources are scarce, as it minimizes overall suffering.
     - **Defense**: If SAR teams *systematically* chose to save smaller groups, more people would die over time. Public trust in the system would erode if rescuers ignored quantifiable impact.

  ### 2. **Your Position: The Individualist/Deontological View**
     - **Core Argument**: Each person has an equal, non-transferable claim to rescue. Sacrificing one person *because* they are alone treats them as a means to an end, violating their inherent dignity. The "loss" of a life isn't additive; it's absolute and incomparable for each individual.
     - **Philosophical Roots**: Echoes John Taurek's "Should the Numbers Count?" (1977), where he argues that flipping a coin between saving one vs. five people respects the equal worth of each. To Taurek, there is no "greater loss" when multiple die—each death is a separate tragedy for the person who loses everything.
     - **Moral Intuition**: Your coin-flip proposal isn’t about randomness for its own sake—it’s a ritual acknowledging that *no one's life is expendable by default*. It prevents reducing people to statistics.

  ### 3. **Key Tensions & Counterarguments**
     - **The "Separateness of Persons" Objection**: Utilitarianism treats society as a vessel for aggregating happiness/suffering. But critics (like Rawls or Scanlon) argue this ignores that individuals experience loss separately. Saving six doesn't "compensate" the lone hiker for being abandoned.
     - **Practicality vs. Principle**: Your friend might say, "In real crises, we *must* aggregate lives to act decisively." Yet this doesn’t resolve the ethical unease. As Scanlon notes, a rescuer owes each person a justification for their actions. Telling the lone hiker, "We left you to die because six > one" fails to respect their moral standing.
     - **Slippery Slopes**: If numbers always decide, what about saving five criminals vs. one Nobel laureate? We *do* consider factors beyond headcount (e.g., saving a child over an elderly person in triage). Strict aggregation feels inhuman when abstract math overrides individual fate.

  ### 4. **Where Both Views Might Converge**
     - **Expected Value Isn't Everything**: Even utilitarians acknowledge that "expected value" assumes certainty. If terrain or survival odds differed, calculations shift. Your scenario’s "all else equal" setup is rare irl.
     - **Fairness as a Social Good**: Protocols rejecting pure aggregation might build long-term trust. If hikers know SAR won’t automatically sacrifice isolated individuals, more might venture out, aiding prevention.
     - **Psychological Realism**: Rescuers tasked with routinely sacrificing individuals for greater numbers may experience moral injury. Systems must account for human conscience.

  ### Conclusion: Your Instinct Is Defensible
  Your discomfort reflects a legitimate ethical stance—one that prioritizes the irreducible value of each life over arithmetic optimization. While your friend's view dominates in operational contexts (for practical and consequentialist reasons), it’s not the *only* defensible position. Philosophers still debate this, precisely because:
  - **Numbers don't erase individual moral claims**. Abandoning one person to save others remains a profound harm *to that person*, regardless of the net gain.
  - **Fairness matters**. Giving each group an equal chance (via coin flip) honors the idea that no life is inherently less worth saving.

  In practice, SAR teams would likely save the six—but this is a concession to practicality, not proof that ethics reduce to math. Your argument challenges us to ask: *Should we design systems that reflect cold arithmetic, or ones that preserve the dignity of the individual, even when it costs lives?* There’s no uncontroversial answer—but your refusal to accept the six-as-automatic isn’t irrational; it’s a deeply human resistance to reducing people to integers in an equation.
