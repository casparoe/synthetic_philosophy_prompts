  **Justification for Grading:**

  *   **Part (a): 6/6:** The student flawlessly identifies SIA and provides a textbook-perfect reconstruction. They capture the core mechanism (weighting by predicted observers), use the correct figures (10^12 vs. few dozen ≈ 10^10 ratio), and explain the consequence (swamping new data). No errors.
