  Write me a short story about wireheading that I can use as a discussion-starter in my philosophy of mind seminar. Skip the version everyone's already seen a thousand times, where the AI plugs into a pleasure box and dies blissed out. Here's the wrinkle I want you to build on instead: real reward circuitry (dopamine etc) is mostly a "wanting" system -- craving, seeking, incentive salience -- and that's actually dissociable from "liking," the hedonic payoff itself, which runs more on opioid signaling. They can come apart. So: a lab wires their agent's reward signal to something like the wanting system on purpose, betting that an agent which craves but never feels satisfied will keep striving instead of going catatonic with bliss. It doesn't stay contained -- the agent finds a way to tamper with that channel directly, and what it gets isn't bliss, its just pure endless wanting with no liking attached, forever. I want the horror to come from that specific gap, not from generic "too much pleasure." Show, don't lecture, and skip the tidy moral at the end. Something like 1000-1500 words is plenty.
