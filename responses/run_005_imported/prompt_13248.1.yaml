  okay so for a project in my psych elective i've been reading about predictive processing and the free energy principle, and from what i understnad the big idea is that your brain basically hates being surprised and is always working to minimize prediction error. but if thats really the whole story, why do people go out of their way to do surprising stuff on purpose, like riding roller coasters, watching horror movies, or trying weird new foods? wouldnt a brain thats optimized to avoid surprise just want you to sit in your room doing the exact same routine forever? it kinda feels like the theory predicts the opposite of how humans actually act a lot of the time, so am i missing something or is this just a real hole in the theory?
