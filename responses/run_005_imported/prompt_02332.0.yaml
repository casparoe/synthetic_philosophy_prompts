answer: |-
  Here is a dialogue between two deeply informed characters engaging rigorously with Harsanyi's theorem, the Diamond objection, and the separateness-of-persons critique. **Alex** finds the theorem powerfully supportive of utilitarianism, while **Bailey** believes its formal conditions fail to capture core ethical demands, leaving aggregation unresolved.

  **Setting:** A university common room after a seminar on social choice theory.

  **Characters:**  
  *   **Alex:** Persuaded Harsanyi provides near-decisive formal support for utilitarian aggregation.  
  *   **Bailey:** Believes the theorem’s conditions are insufficient for settling interpersonal aggregation ethically, due to fairness and separateness concerns.  

  **(The dialogue begins as they review seminar notes.)**

  **Alex:** I keep coming back to the sheer elegance of Harsanyi. It feels like cutting through centuries of philosophical debate with a mathematical scalpel. If we grant that individuals are rational expected utility maximizers (EU axioms), that the *social planner* is rational in the same EU sense, and that society respects unanimity (Pareto Indifference: if all indifferent, society is indifferent; Pareto Preference: if one prefers and none oppose, society prefers), then the *only* social welfare function consistent with this is a weighted sum of individual utilities! Utilitarianism isn't just *one* option; it's the *only* coherent option under these plausible constraints.

  **Bailey:** I admire the elegance too, Alex, but I think its power is illusory for ethical purposes. It smuggles in controversial ethical commitments *within* those "modest" assumptions, particularly regarding how we model choice under uncertainty for the social planner and what Pareto really demands. The formalism works, but it doesn't settle the ethical question.

  **Alex:** How so? The axioms seem like bedrock requirements for rational choice under uncertainty, applied consistently to individuals *and* the entity making choices on their behalf. Pareto is just non-controversial respect for unanimous preferences. Where's the smuggling?

  **Bailey:** Let's take Peter Diamond's coin-flip case. Imagine two individuals, Identical Twins A and B, with identical utility functions. There's one indivisible lifesaving drug. Option 1: Give it outright to Twin A. Option 2: Flip a fair coin; heads A gets it, tails B gets it. Diamond argues Option 2 is *fairer*. Yet, under Harsanyi's setup with identical individuals:

  1.  **Ex Ante:** Before the coin flip, both twins are *indifferent* between Option 1 and Option 2. Getting it for sure (if they are A in Option 1) has the same *expected utility* (0.5 * U(drug) + 0.5 * U(no drug)) as the coin flip.
  2.  **Pareto Indifference:** Since both individuals are indifferent between Option 1 and Option 2, society must be indifferent (by Pareto Indifference).
  3.  **Conclusion:** Harsanyi's theorem leaves society indifferent between the fair lottery and the arbitrary allocation. But fairness demands a preference for the lottery! The theorem seems incapable of capturing this basic fairness intuition *even though its axioms are satisfied*.

  **Alex:** Ah, the classic objection. But I think this misunderstands the role of states of the world in the EU framework. We need to model the *outcomes* properly.

  *   **Option 1 (Give to A):** One state: A gets drug (U_A = high, U_B = low), B does not.
  *   **Option 2 (Coin Flip):** *Two* states:
      *   State H (50%): Coin heads. A gets drug (U_A = high), B does not (U_B = low).
      *   State T (50%): Coin tails. A does not (U_A = low), B gets drug (U_B = high).

  **Bailey:** Precisely. And since the individuals are identical, their *ex ante* expected utility is identical for both options. Hence Pareto Indifference applies, forcing social indifference. But fairness cares about the *ex post* distribution across states!

  **Alex:** Hold on. The social planner, being an EU maximizer, must evaluate prospects state-by-state. Look at the *realized utilities* in each possible state under the two options:

  *   **In State H:** Option 1 gives (High, Low). Option 2 *also* gives (High, Low). Identical outcome.
  *   **In State T:** Option 1 *still* gives (High, Low) (A has it, B doesn't). Option 2 gives (Low, High).

  **Bailey:** There it is! Option 1 yields the *same* utility vector (High, Low) in *every* possible state. Option 2 yields *different* utility vectors depending on the state: (High, Low) in H, (Low, High) in T.

  **Alex:** Exactly. Now, apply **State-Wise Pareto Dominance**, a consequence of the EU axioms for the social planner: If one prospect yields at least as good an outcome as another in *every possible state*, and strictly better in at least one state, it must be preferred.

  *   In State H: Options 1 and 2 yield the same (High, Low).
  *   In State T: Option 1 yields (High, Low). Option 2 yields (Low, High).

  **Bailey:** And if we think fairness matters, we judge (Low, High) in State T as better than (High, Low) in State T *from a social perspective*, precisely because it gives the good to the other twin. But the EU framework for the social planner *doesn't automatically grant that*.

  **Alex:** That's the crucial point! **State-Wise Pareto** demands we compare the outcomes *within* each state. In State T:
  *   Is (High, Low) at least as good as (Low, High) for *every individual*? No! Twin B is strictly worse off under Option 1 (Low) than under Option 2 (High) in State T.
  *   Is (Low, High) at least as good as (High, Low) for every individual? No! Twin A is strictly worse off under Option 2 (Low) than under Option 1 (High) in State T.

  **Bailey:** So, in State T, neither Option 1 nor Option 2 state-wise Pareto dominates the other. Option 1 is better for A, worse for B; Option 2 is better for B, worse for A. State-Wise Pareto is silent here. It only forces indifference via *Ex Ante* Pareto because the *expected utilities* are equal. The theorem's machinery *prevents* it from registering the fairness gain of the coin flip because that gain isn't captured by state-wise comparisons of individual utilities within a single state – it’s a property of the *distribution across states*.

  **Alex:** You're right that State-Wise Pareto alone doesn't force a preference for the coin flip. But the theorem doesn't *preclude* it either! The social welfare function is a weighted sum: W = w_A * U_A + w_B * U_B. If we value fairness, we might set w_A = w_B. Now evaluate the options:

  *   Option 1 (Give to A): W = w_A * High + w_B * Low
  *   Option 2 (Coin Flip): Expected W = 0.5 * (w_A * High + w_B * Low) + 0.5 * (w_A * Low + w_B * High)

  **Bailey:** And if w_A = w_B, those two expressions are *equal*! The weighted sum is blind to the *correlation* of outcomes across individuals in different states. It only sees the *expectation* of the sum. The fair lottery and the arbitrary allocation yield identical *expected social welfare* when weights are equal. The formalism cannot distinguish them on fairness grounds; it washes out the distributional symmetry achieved by the lottery. Diamond's point stands: the theorem's conditions, satisfied perfectly, lead to social indifference where fairness requires preference. This shows the *limitation* of the EU/Pareto framework for capturing fairness – it's not just a competing intuition, it's a failure of the framework to express a morally relevant social value *despite* satisfying the axioms.

  **Alex:** Hmm, that’s a sharper way to put Diamond than I usually hear. Let me concede that if fairness is an *independent* social value about the *process* or *ex post symmetry across states*, beyond just the vector of expected individual utilities, then yes, the EU social planner framework, focused solely on aggregating individual *utilities* under uncertainty, doesn't capture it. The axioms restrict the social planner to caring only about the aggregated individual *consequences*, probabilistically weighted. Fairness might require caring about the pattern of assignments itself.

  **Bailey:** Exactly. And this connects to the deeper "separateness of persons" critique. Harsanyi treats social choice under uncertainty *exactly* like an individual choice under uncertainty. The social planner is modelled as one big EU maximizer gambling with *its own* composite "utility" (W). But society isn't a single entity experiencing the sum of sensations. When the coin lands tails in Option 2, *A suffers while B benefits*. The social planner's indifference, derived from the equality of expected W, masks the fact that real gains for one person are offset by real losses for another *in the same event*. Utilitarian aggregation under the EU framework encourages seeing this as a mere transfer *within* a single consciousness, ignoring the distinct experiences of A and B *in that outcome*. It neglects the moral significance of the distribution *across persons at a point in time* because it's fixated on the expectation of the sum *over time/states*.

  **Alex:** But isn't the Original Position / Veil of Ignorance (VOI) precisely designed to handle separateness? Both Harsanyi and Rawls use it! Harsanyi argues that rational, impartial choosers behind the VOI, ignorant of who they will be but *assuming equal probability* of being anyone, would maximize their *expected utility* – which is just average utility! That seems like a direct ethical argument incorporating separateness via impartiality.

  **Bailey:** And here Rawls's divergence is crucial, exposing another hidden commitment. Rawls *denies* that the parties behind the veil are *entitled* to assume any particular probability distribution over who they might be. He argues they lack the information to justify *any* probabilistic belief. Therefore, they cannot maximize *expected* utility. Instead, facing radical uncertainty about their identity, they adopt the maximin rule: choose principles that make the worst possible position (whichever person they turn out to be) as good as possible. This prioritizes the separateness of persons by focusing on protecting each individual's minimum guarantee, refusing to gamble with anyone's fundamental interests for the sake of a higher average or sum.

  **Alex:** But is maximin *rational* under the EU axioms? It violates them! It's incredibly risk-averse. Harsanyi's use of equal probability assumes symmetry where there's no information – a principle of insufficient reason. It's the uniquely rational way to handle complete ignorance under the EU framework. Rawls rejects the applicability of the EU framework itself to this fundamental ethical choice, precisely *because* of the separateness of persons and the high stakes involved. He thinks it's irrational to apply probabilistic gambling reasoning to one's fundamental life prospects when the "gamble" involves potentially being someone whose basic rights are violated.

  **Bailey:** Precisely! And this highlights my core contention. Harsanyi's theorem assumes the social planner's preferences obey the EU axioms. Rawls argues that for *fundamental social choices*, especially under a veil of ignorance designed to ensure fairness by respecting separateness, obeying the EU axioms is *not* rationally or ethically compulsory. The Diamond case shows a concrete instance (fairness) where satisfying the EU axioms + Pareto fails to capture a compelling social value. Rawls challenges the very idea that the EU model of rational choice under uncertainty is appropriate for the ethical problem of interpersonal aggregation. The theorem is sound mathematics, but its conclusion is only as compelling as its premises. If the premises (especially the EU axioms applied to the social planner) embed a controversial *ethical* stance – like treating social choice as analogous to individual gambling, or assuming specific probabilities behind the veil – then it hasn't *derived* utilitarianism from neutral rationality; it has *assumed* a utilitarian perspective within the rationality conditions.

  **Alex:** So, to summarize your challenge: 1) The Diamond case shows the EU/Pareto framework cannot express a fairness preference even when satisfied (a technical limitation for ethical purposes). 2) The separateness critique, highlighted by Rawls's VOI, argues that applying the EU model to the social planner *is itself* an ethically loaded move that ignores the moral distinctness of persons by treating society like a single gambler. Therefore, satisfying Harsanyi's conditions is necessary for coherence *if* you accept that specific model of social rationality, but not sufficient to settle the ethical question of aggregation, because that model itself might be ethically inadequate.

  **Bailey:** That's it. The theorem shows that *if* you model social rationality under uncertainty *exactly like individual rationality*, and demand Pareto, then utilitarianism falls out. But the big ethical question is: *Should* we model fundamental social choices that way? Diamond and Rawls, in their different ways, argue "No." Fairness and the separateness of persons demand a different structure – one that can recognize the moral significance of ex post distributions (Diamond) or prioritize protection against the worst-case scenario (Rawls) in ways the EU framework flattens or excludes. The mathematics is impeccable, but it operates within an ethically contestable box.

  **Alex:** That’s a powerful case, Bailey. It doesn’t make me think Harsanyi is *wrong*, but it forces me to see that its "decisiveness" hinges entirely on accepting that the EU axioms *are* the correct model of *social* rationality under uncertainty – a premise deeply intertwined with a utilitarian outlook itself. The theorem brilliantly clarifies the link between that model and utilitarianism, but it doesn't provide a neutral foundation that compels acceptance from all ethical viewpoints. The disagreement lies one level deeper, in the choice of the rationality framework for the social planner. That’s where the real ethical debate resides.

  **Bailey:** Exactly. And that's a much more interesting and productive place to focus the discussion. Thanks for the rigorous engagement, Alex. It helps clarify why this disagreement persists among people who all understand the theorem perfectly well.

  **(They gather their things, the conversation clearly continuing in their minds.)**
