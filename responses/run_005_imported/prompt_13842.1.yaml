prompt: |-
  I'm on the editorial board for a new student anthology of Frege's writings -- the sense/reference essay, bits of the Grundlagen -- and we're stuck on the biographical intro. One member wants a paragraph noting that Frege kept a diary in 1924 full of stuff about stripping Jews of political rights and wanting an authoritarian "leader" to fix the Weimar Republic, and wants to at least raise whether that connects to his actual philosophy -- his insistence that logical "thoughts" are objective and mind-independent, his contempt for psychologism, that sort of thing. Others think that's a seperate question from what a book meant to teach undergrads sense and reference should even be doing, that it's amateur psychoanalyzing dressed up as scholarship, and that a one-line footnote is plenty. I need to send round a memo before Friday's meeting recommending what we actually do -- can you draft it? Take a real position and defend it, but deal seriously with whichever side you don't take, not just wave at it.
