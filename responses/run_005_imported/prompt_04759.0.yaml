  The user clearly wants rigorous engagement, so the dialogue should have substantive moves and countermoves. Maybe Cass proposes that the loss function acts as a normative standard, to which Morgan replies that it's merely causal, not justificatory. Then Cass could argue that human normativity might similarly reduce to causal processes... and so on.

