  I need to explain the core dilemma: complete-preference agents inevitably develop incentives regarding shutdown (either resisting or pursuing it), except in the fragile case of exact indifference. Thornley's proposal avoids this by making shutdown vs. non-shutdown trajectories incomparable and using Timestep Dominance instead of expected utility maximization. 

  The key question is whether this approach is reflectively stable - whether the AI would want to maintain its incomplete preferences once it understands its own exploitability. I recall that Timestep Dominance is designed to block standard money-pump sequences by never allowing dominated choices. But the user's friend is concerned about higher-order exploitation where the AI might pay costs to avoid potential future exploitation, creating a new vulnerability.

