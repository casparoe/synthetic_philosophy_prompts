  For reflective stability, I need to consider whether the AI would have instrumental reasons to self-modify. If it believes that completing preferences would better achieve its goals (which are undefined across the shutdown boundary), this might create pressure to change. But without a complete preference ordering, it can't rank "staying incomplete" versus "becoming complete" - they might be incomparable.

