  Egalitarianism treats all omissions equally as causes but uses pragmatics to explain why we blame the gardener. This keeps causation clean but shifts the workload to pragmatics. The big objection is that it trivializes causation. If every possible omission is a cause, the concept loses its meaning. Pragmatics might not salvage this, especially in legal or moral contexts where specificity matters.

