prompt: |-
  Hey, so I'm about a third of the way into a novel structured as a set of linked chapters, each one narrated from inside a different animal's head — kind of an anti-anthropomorphic bestiary, a nature documentary crossed with a chorus of unreliable narrators. The craft problem I keep running into, which my editor keeps poking at too, is how much interior "something it's like to be them" experience (the Nagel bat-thing, sort of) I'm allowed to write for each narrator before I'm just making stuff up wholesale. Right now the octopus chapter reads like a rich stream of consciousness and the C. elegans chapter is basically three sentences about a chemical gradient, and I'd like a better justification for that gap than "vibes."

  So here's the actual ask: rank the following ten creatures by your credence that they have at least some minimal form of phenomenal conciousness — not self-awareness, not language, just the bare "is there something it's like to be this thing at all" question. The ten are: honeybees, jumping spiders, octopuses, decapod crustaceans (crabs, lobsters), zebrafish, crows, fruit flies, C. elegans nematodes, sea sponges, and Aplysia sea hares. Dont just tell me "it depends what you mean by consciousness," I already know that — pick a reasonable working notion and defend the placements, especially whichever ones you're least sure of, based on whatever's actually doing the work case by case (behavioral flexibility, nociceptor-type evidence, degree of neural centralization, evolutionary distance from us, learning under analgesia, whatever).

  Give me the ranking as a JSON object with five tiers, like this:

  ```json
  {
    "very likely conscious": [...],
    "probably conscious": [...],
    "genuinely torn": [...],
    "probably not": [...],
    "very likely not conscious": [...]
  }
  ```

  Then, in two or three sentences after the JSON, tell me which single placement you'd bet money on being wrong if we ever actually settle this — that's probably the chapter I end up cutting.
