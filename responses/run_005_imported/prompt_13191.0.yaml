  ## Memorandum: Policy Recommendation on AI-Detector Thresholds for Academic Integrity Cases

  **To:** University Academic Integrity Board  
  **From:** [Your Name/Title]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Sole Reliance on AI-Detection Scores in Academic Integrity Decisions  

  ### 1. Recommendation
  **I recommend amending the policy to *require specific corroborating evidence* beyond an AI-detection score alone to establish a finding of "responsible" for unauthorized AI use.** A detection score above the confidence threshold should be treated as *probative evidence* requiring further investigation, not as dispositive proof.  

  ### 2. Proposed Policy Change  
  **Revised Standard:**  
  > "A submission flagged above the stated confidence threshold by an approved AI-detection tool may initiate an academic integrity review. However, a finding of 'responsible' requires additional, specific corroborating evidence beyond the detection score itself. Corroborating evidence may include, but is not limited to:  
  > - Inconsistencies in writing style, knowledge, or technical ability within the submission or compared to prior student work.  
  > - Discrepancies in document metadata or drafting history.  
  > - Admissions during the investigatory process.  
  > - Inability to explain or defend submitted content during a follow-up assessment.  
  > - Witness testimony or digital trail indicating AI use."  

  **Implementation Timeline:**  
  *   **Effective Immediately:** For all cases opened after [Date 7 days from memo adoption].  
  *   **Grandfather Clause:** Cases already in process may proceed under the current policy at the board’s discretion, but the new standard is strongly encouraged.  
  *   **Training Mandatory:** All board members and investigators must complete updated training on interpreting detection reports and identifying corroborating evidence before adjudicating new cases.  

  ---

  ### 3. Rationale: Addressing the Lottery Paradox and Ensuring Just Outcomes
  My recommendation directly addresses the core concern raised by the "lottery paradox" analogy:  
  *   **The Paradox:** The board can statistically *know* that a certain percentage of "above threshold" flags are false positives (based on the detector's documented error rate), while simultaneously judging each *individual* case as "more likely than not" responsible based solely on that flawed metric. This creates a systemic inconsistency where the board knowingly condemns innocent students.  
  *   **Inconsistency vs. Unavoidability:** This **is a real inconsistency**, not merely an unavoidable feature of individual adjudication. While *some* error is inherent in any human or technical judgment system, **relying solely on a probabilistic tool with known false positives guarantees wrongful findings in a predictable number of cases**. Individual case review should be a safeguard *against* this, not a justification for ignoring aggregate error rates.  

  **Key Reasons for Requiring Corroboration:**  
  1.  **Mitigating Known False Positives:** AI detectors have documented false positive rates (e.g., flagging human-written text, particularly from ESL students or those with unconventional styles). Sole reliance ignores this inherent risk.  
  2.  **Preserving Individual Justice:** Academic integrity findings carry severe consequences (failing grades, suspension, expulsion). Decisions must be based on the *specific evidence pertaining to the individual student*, not just statistical likelihoods derived from a tool.  
  3.  **Strengthening the Board's Legitimacy:** Policies perceived as inherently unfair or statistically unjust erode trust in the academic integrity process. Corroboration enhances fairness and perceived legitimacy.  
  4.  **Encouraging Robust Investigation:** Sole reliance on detectors discourages meaningful investigation into the *context* of the submission and the student's work, which is crucial for accurate findings.  
  5.  **Adapting to Evolving AI:** AI tools and student writing styles constantly evolve. Detectors struggle to keep pace. Corroboration provides a necessary human check against technological limitations.  

  ---

  ### 4. Addressing the Strongest Counterargument
  **Strongest Argument for Sole Reliance on Detection Scores:**  
  *Proponents argue that a high-confidence detection score *is* compelling evidence of AI use ("beyond reasonable doubt" or "clear and convincing" in many cases). Requiring corroboration creates an unrealistic burden, especially for sophisticated AI use or large classes, allowing guilty students to escape consequences due to lack of additional "smoking gun" evidence. The detector's aggregate error rate is irrelevant to the *specific probability* in a single case where the tool indicates high confidence, and the board is best positioned to weigh that specific evidence.*

  **Response:**  
  This argument rightly emphasizes the detector's potential strength as evidence. However, it conflates *probative value* with *conclusive proof* and underestimates the ethical and practical risks:  

  1.  **The Specific Probability Fallacy:** While the board focuses on the specific case, the *validity of the evidence itself* (the detection score) is intrinsically linked to the tool's *aggregate* performance. A "95% confidence" score from a tool with a 5% false positive rate *does* mean that statistically, 1 in 20 flags at that level are wrong. Ignoring this when making binary "responsible/not responsible" decisions based *only* on this score is illogical and unjust.  
  2.  **Burden vs. Justice:** While finding corroboration requires effort, the primary burden is on the *institution* to prove misconduct, not on the *student* to prove innocence. Protecting innocent students from potentially life-altering errors outweighs the inconvenience of deeper investigation. Corroboration doesn't require a "smoking gun"; it requires looking for *any* supporting inconsistency or contextual clue (e.g., sudden change in style, inability to discuss core concepts).  
  3.  **Sophisticated Cheating & Burden:** Sophisticated cheaters may evade corroboration, but they are also more likely to evade *or fool* detectors. Sole reliance creates a dangerous illusion of security. The solution to sophisticated cheating is better investigation and diverse tools (including oral defenses), not doubling down on a single fallible method.  
  4.  **Board Expertise:** The board *is* positioned to weigh evidence – but its expertise is best applied when the evidence includes contextual and human elements, not just a raw algorithmic output. Requiring corroboration *enhances* the board's ability to make truly informed, case-specific judgments.  

  ---

  ### 5. Conclusion
  While AI-detection tools are valuable screening mechanisms, sole reliance on their scores for adverse findings is statistically inconsistent and ethically fraught. It guarantees wrongful outcomes for some students and undermines the integrity and fairness of the process. **Mandating specific corroborating evidence aligns the policy with principles of individual justice, acknowledges the limitations of the technology, strengthens the validity of findings, and protects the university from reputational and legal risk.** I urge the board to adopt the proposed amendment effective immediately for new cases, ensuring mandatory training accompanies the change.  

