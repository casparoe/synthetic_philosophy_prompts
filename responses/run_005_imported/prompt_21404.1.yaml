  First, I need to recall Anscombe's position. She used double-effect reasoning to argue that intentionally targeting civilians as a means to an end is murder, which Truman did by bombing Hiroshima and Nagasaki to shock Japan into surrender. Marcus supports this, saying the civilians were the mechanism, not collateral. Deb counters that this logic would condemn all strategic bombing in WWII, making the standard too strict or diluting Truman's blame.

  Looking at point 1: Marcus is correct. Anscombe's double-effect principle clearly distinguishes intended means from unintended side effects. The bombings targeted civilians to break Japan's will, making their deaths intended, not collateral. So Marcus is solid here.

  Point 2: Deb's observation is accurate—strategic bombings like Britain's also targeted civilians. But she's wrong to think this undermines Anscombe. Anscombe would condemn all such actions, not just Truman's. Her argument isn't about singling out Truman but challenging the moral reasoning that permits such acts. Deb's point doesn't damage the principle; it shows its consistent application. So Deb is partially right but misses Anscombe's broader critique.

  Point 3: Marcus is spot on. Anscombe's pamphlet targets the "necessity" reasoning used by statesmen to justify atrocities. The historical argument about the Soviet invasion vs. the bombs is relevant but secondary. Marcus correctly identifies her main aim as attacking consequentialist justifications.

  Point 4: Deb makes a valid distinction between judging the act and the agent's blameworthiness. Truman's decision was based on available information, so his personal culpability might be mitigated. However, Anscombe's focus is on the act's morality, not Truman's character. Deb isn't moving goalposts but highlighting a nuance Anscombe might overlook. Still, Anscombe would argue that even well-intentioned acts using evil means are immoral. So Deb is partially right but doesn't negate Anscombe's core argument.

  Point 5: Marcus correctly notes that Deb's point about Truman's beliefs concedes the act's immorality. Anscombe rejects consequentialism—good outcomes don't justify evil means. So even if Truman believed the bombings saved lives, the act remains murder. Marcus reinforces that Anscombe's critique is about moral principles, not just Truman's judgment.

  Now, what's missing? Both debaters overlook Anscombe's emphasis on absolute moral prohibitions and her Catholic natural law basis. Historically, they miss that Japan's surrender involved multiple factors, but Anscombe's argument isn't contingent on historical outcomes.

  Scoring:
  - Point 1: Marcus is correct (+2)
  - Point 2: Deb is half-right; accurate observation but wrong implication (0)
  - Point 3: Marcus is correct, though the historical point is secondary (+1)
  - Point 4: Deb is half-right; valid distinction but doesn't refute Anscombe (+1)
  - Point 5: Marcus is correct (+2)

  Total: Marcus +5, Deb +1. Marcus is ahead, especially on reinforcing Anscombe's anti-consequentialism. However, Deb's point about agent blameworthiness adds nuance, even if it doesn't counter the main argument.
