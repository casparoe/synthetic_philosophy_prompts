  - Chronic fatigue syndrome: objective pathology suspected but biomarkers still emerging. Suffering is real, yet diagnostic criteria rely heavily on subjective reports. Genuinely contested.
  - Infertility: biological dysfunction is measurable, but "disease" status depends entirely on personal reproductive goals. Mostly normative despite biological basis.
  - Prolonged grief disorder: duration thresholds are arbitrary, and grief responses vary culturally. Harm assessment is inherently value-laden. Mostly normative.
  - Deafness: Cochlear function deviation is biological, but many in Deaf community reject "disease" label as pathologizing cultural identity. Quintessential example of normative judgment.

