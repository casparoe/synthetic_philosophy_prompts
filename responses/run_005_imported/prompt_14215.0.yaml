  - Type 1 diabetes: absolute insulin deficiency causing measurable organ damage. Strong biological basis, minimal controversy about harm. Mostly naturalistic.
  - High cholesterol: borderline case. While biomarkers exist, harm depends on context (e.g., age, other risk factors) and thresholds are debated. Leans naturalistic but needs qualification.
