  I recall the philosophical frameworks here - Christopher Boorse's naturalistic "biostatistical theory" where disease is statistical deviation from species-typical functioning, versus normative views (like Jerome Wakefield's "harmful dysfunction") that require both biological dysfunction AND value judgments about harm. 

  Now, assessing each condition:
