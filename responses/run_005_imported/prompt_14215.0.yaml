prompt: |-
  So a few weeks back I got into it with my sister (she's a nurse) about whether stuff like ADHD and alcoholism are "real" diseases or just labels doctors slap on things they've decided are bad. That sent me down a rabbit hole and turns out theres an actual academic fight about this. Some people say whether something counts as a disease is basically just a biological fact — like a body part or process isn't working the way its "supposed to," statistically speaking, no values involved at all (I think the term is "naturalism," theres a guy called Boorse who's big on this). Other people think that's basically impossible and that calling something a disease always sneaks in some judgement about what's bad or undesirable for a person — and as evidence they point to stuff like how being gay was an official DSM diagnosis up until 1973, which in hindsight is obviously just values dressed up as biology.

  Anyway, instead of just talking about this in the abstract, I want to see how it actually holds up on real conditions. Can you sort/rank the following on a spectrum from "basically just naturalistic biology, no value judgement needed to call this a disease" to "can't really be called a disease without a value judgement doing most of the work": a broken leg, type 1 diabetes, high cholesterol, obesity, ADHD, alcohol addiction, chronic fatigue syndrome, infertility, grief that doesn't go away after a long time (I think theres an actual diagnosis for this now, "prolonged grief disorder"?), and deafness. Can I get it as a JSON with tiers so I can actually see the groupings, something like:

  ```json
  {
    "mostly_naturalistic": ["...", ...],
    "leans_naturalistic": ["...", ...],
    "genuinely_contested": ["...", ...],
    "leans_normative": ["...", ...],
    "mostly_normative": ["...", ...]
  }
  ```

  and then maybe a couple sentences under each item on why it ended up there, because the ranking alone won't mean much to me without that. I'm not looking for some "objectively correct" answer, I'm mostly just curious where you'd actually put things once you try to sort real cases into these buckets instead of just describing the theories in general.
