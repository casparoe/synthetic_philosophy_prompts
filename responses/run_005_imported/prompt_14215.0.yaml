  For the JSON structure, I'll group conditions where biological dysfunction is objectively measurable and consensually harmful (naturalistic end) versus those where harm depends on goals/context (normative end). Middle categories capture gradients. Explanations will highlight:
  1. Objective measurability of dysfunction
