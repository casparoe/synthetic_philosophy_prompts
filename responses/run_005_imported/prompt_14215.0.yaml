  ### Key Tensions Illustrated
  - **Biology vs. Values**: Conditions like *broken legs* or *type 1 diabetes* sit at the naturalistic end because dysfunction is objectively measurable and universally harmful across contexts. *Deafness* and *grief disorders*, conversely, highlight how "harm" depends on societal context/goals.
  - **Threshold Problems**: *High cholesterol* and *obesity* show how "normal" vs. "abnormal" cut-offs rely on statistical risk calculations infused with values about prevention/acceptable longevity.
  - **Identity & Environment**: *ADHD* and *deafness* demonstrate how impairment often depends on environmental fit (e.g., demanding focus in schools vs. thriving in Deaf community).
  - **Subjectivity**: *Prolonged grief* and *CFS* reveal challenges in pathologizing experiences without definitive biomarkers, leaving room for value judgments about "appropriate" responses.

  This spectrum shows few conditions are **purely** naturalistic; even "objective" diseases like diabetes involve values in defining "harm" (e.g., is managing insulin a "burden"?). Normative elements become dominant when dysfunction is tied to societal expectations, identity, or subjective distress without unambiguous biomarkers.
