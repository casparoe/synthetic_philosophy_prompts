  3. Cultural/value influences on diagnosis

  Notably, conditions can move categories with new science (e.g., CFS if biomarkers validate). The tier labels ("leans," "contested") acknowledge this fluidity. Deafness gets special handling due to cultural identity factors beyond medical pathology.

