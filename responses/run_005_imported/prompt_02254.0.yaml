answer: |-
  Your friend's reductio doesn't land on your position but instead targets a meaningfully stronger (and deeply flawed) doctrine. Let's dissect the core issues, starting with Sanchez's analogy and then contrasting probabilism with modern moral uncertainty frameworks. I'll conclude with a concrete assessment of whether your view is implicated.

  ### 1. Sanchez's Analogy: A Fatal Equivocation
  Sanchez argues:  
  > *"If testimony has weight for factual claims (e.g., 'an event occurred in Rome'), why not for moral claims?"*  

  **The flaw:** This equivocates between two distinct concepts of "probability":  
  - **Evidential probability (facts):** Testimony about empirical events relies on *epistemic reliability*. We trust a source because they have perceptual access, expertise, and a track record of accuracy.  
  - **Authority-based "probability" (morals):** Here, "probability" is detached from likelihood. A "grave doctor" renders an opinion "probable" simply by endorsing it, regardless of evidence or consistency with other principles.  

  **Why it fails:**  
  - **Moral claims aren't empirical:** Facts about Rome are verifiable; moral permissibility is normative. Testimony can transmit *knowledge* of facts but not *justification* for moral truths without independent reasoning.  
  - **No error-correction:** In factual testimony, conflicting reports trigger scrutiny. In probabilism, any single authority suffices, even if 99% of others disagree.  
  - **Bootstrapping:** An opinion becomes "probable" *because* a credentialed person holds it, creating circularity.  

  **Pascal's critique:** The casuists exploit this equivocation to sever "probability" from truth-seeking. The analogy isn't just weak—it's a rhetorical sleight of hand that enables the rest of the doctrine.

  ### 2. Probabilism vs. Modern Moral Uncertainty Frameworks
  Probabilism isn't a primitive version of *any* mainstream modern approach. It’s a distinct error arising from conflating authority with permissibility. Here's how it contrasts:

  | **Framework**              | **Core Principle**                                                                 | **Relationship to Probabilism**                                                                 |
  |----------------------------|------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------|
  | **My Favorite Theory (MFT)** | Act *only* on the theory you deem most probable.                                  | **Opposite:** Probabilism allows acting on *less* probable opinions. MFT would reject probabilism entirely. |
  | **Maximizing Expected Choiceworthiness (MEC)** | Weigh actions by: Σ [P(M_i) × Choiceworthiness of A under M_i] | **Fundamentally different:** MEC uses *all* credences to maximize expected value. Probabilism ignores probabilities and aggregates no values—it declares any "probable" opinion *sufficient* for permissibility. |
  | **Minimal Permissibility**  | An act is permissible if *any* plausible theory endorses it.                       | **Closest cousin, but still distinct:** Probabilism is more extreme—it lowers the bar for "plausible" to "any single authority's view," regardless of safety or personal judgment. |

  **Probabilism's unique error:** The Jesuit leap from *"Authority renders opinion probable"* to *"You may follow the less probable/safer opinion"* relies on two illicit moves:  
  - **The Sufficiency Fallacy:** Treating *any* "probable" opinion as *sufficient justification* for action, even when better options exist.  
  - **Erasure of Personal Judgment:** "It does not signify" that you find another opinion more probable/safer. This actively *discourages* updating beliefs based on evidence.  

  ### 3. Does the Reductio Hit Your Position?
  **No.** Your view (that credences in alternatives are decision-relevant) aligns with MEC, while probabilism is its antithesis. Consider:

  - **Your position:**  
    - *Requires* weighing all credences.  
    - *Demands* acting on the balance of evidence (e.g., if Theory A has 60% credence and Theory B 40%, you don’t arbitrarily privilege B).  
    - *Rejects* deferring to authority without epistemic justification.  

  - **Probabilism:**  
    - *Ignores* credences entirely.  
    - *Allows* acting against your own judgment of probability/safety.  
    - *Defers* to authority as an independent source of permissibility.  

  **Concrete example:**  
  Suppose you have 70% credence in utilitarianism (donate to effective charities) and 30% in egoism (keep your money).  
  - **Your view:** Likely requires donation (unless egoism’s choiceworthiness vastly outweighs).  
  - **Probabilism:** If *any* "grave doctor" endorses egoism, you may keep your money—*even if you think utilitarianism is 99% likely and safer*.  

  ### Key Takeaway
  The reductio only works against positions that:  
  1. Decouple "permissibility" from personal epistemic judgment.  
  2. Treat minimal authority-based endorsement as sufficient.  
  3. Actively permit overriding what the agent sees as more probable/safe.  

  Your stance rejects all three. The core of your disagreement with your friend may stem from conflating two questions:  
  - **Your claim:** Credences across theories *should inform action* (MEC).  
  - **Probabilism:** Any theory with non-zero institutional support *may be acted upon* regardless of credence.  

  These are orthogonal. Pascal’s target isn’t moral uncertainty—it’s the *weaponization* of uncertainty to rationalize convenience. Your view survives unscathed. If anything, probabilism is what happens when *deference to authority* masquerades as moral uncertainty.
