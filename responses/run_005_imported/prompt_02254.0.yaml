prompt: |-
  A friend and I spent most of a long train ride arguing about moral uncertainty, and neither of us walked away convinced. The disagreement began narrowly: if you're genuinely unsure which moral theory is correct, is it ever reasonable to act on a theory you don't currently think is most likely true, just because it's a position serious people hold and you give it real, non-trivial credence? I was defending a version of "yes" — not that you should defer to whatever's popular, but that always acting on your single best-guess theory throws away information (your credence in the alternatives) that seems obviously decision-relevant. She thought this reasoning proves too much: interrogate what counts as "a position serious people hold, with real credence behind it," and there's no principled place left to stop someone from rationalizing whatever they wanted to do anyway.

  Trying to work out whether any of this was new, we went looking for historical precedent and ended up, of all places, in Pascal's Provincial Letters — specifically Letter V, where Pascal, posing as a credulous layman being tutored by a Jesuit casuist, reconstructs the seventeenth-century doctrine of "probabilism": roughly, the view that an opinion becomes safe to act on once it counts as "probable" in a technical sense that turns out to have almost nothing to do with likelihood. Here is the exchange, from the Rev. Thomas M'Crie's nineteenth-century English translation, lightly trimmed for length (the omission is marked) but not otherwise altered:

  I expressed my satisfaction and requested him to explain what was meant by a probable opinion?

  "That," he replied, "our authors will answer better than I can do. The generality of them, and, among others, our four-and-twenty elders, describe it thus: 'An opinion is called probable when it is founded upon reasons of some consideration. Hence it may sometimes happen that a single very grave doctor may render an opinion probable.' The reason is added: 'For a man particularly given to study would not adhere to an opinion unless he was drawn to it by a good and sufficient reason.'"

  "So it would appear," I observed, with a smile, "that a single doctor may turn consciences round about and upside down as he pleases, and yet always land them in a safe position."

  "You must not laugh at it, sir," returned the monk; "nor need you attempt to combat the doctrine. The Jansenists tried this; but they might have saved themselves the trouble- it is too firmly established. Hear Sanchez, one of the most famous of our fathers: 'You may doubt, perhaps, whether the authority of a single good and learned doctor renders an opinion probable. I answer that it does; and this is confirmed by Angelus, Sylvester, Navarre, Emanuel Sa, &c. It is proved thus: A probable opinion is one that has a considerable foundation. Now the authority of a learned and pious man is entitled to very great consideration; because (mark the reason), if the testimony of such a man has great influence in convincing us that such and such an event occurred, say at Rome, for example, why should it not have the same weight in the case of a question in morals?'"

  "An odd comparison this," interrupted I, "between the concerns of the world and those of conscience!"

  [...]

  "But, father," I remarked, "a person must be sadly embarrassed in choosing between them!" "Not at all," he rejoined; "he has only to follow the opinion which suits him best." "What! if the other is more probable?" "It does not signify." "And if the other is the safer?" "It does not signify," repeated the monk; "this is made quite plain by Emanuel Sa, of our Society, in his Aphorisms: 'A person may do what he considers allowable according to a probable opinion, though the contrary may be the safer one. The opinion of a single grave doctor is all that is requisite.'"

  "And if an opinion be at once the less probable and the less safe, it is allowable to follow it," I asked, "even in the way of rejecting one which we believe to be more probable and safe?"

  "Once more, I say yes," replied the monk. "Hear what Filiutius, that great Jesuit of Rome, says: 'It is allowable to follow the less probable opinion, even though it be the less safe one. That is the common judgement of modern authors.'"

  My friend thinks this passage is basically a reductio of my position: let people act on any opinion "some grave doctor" can be found to endorse, rather than on the opinion they themselves find most credible, and you get exactly this. I suspect something goes wrong earlier and worse than that — somewhere in how the casuist moves from "a single respected authority can render an opinion probable" to "you may follow the less probable, less safe opinion even over one you yourself judge more probable and safer" — but I couldn't reconstruct the actual chain of reasoning clearly enough to locate the mistake. Could you help with two things: first, whether Sanchez's analogy is doing any real work or is just equivocating between "probable" as in evidentially likely and "probable" as in defended-by-a-credentialed-person — his argument seems to trade on treating testimony that some fact occurred ("such and such an event occurred... at Rome") as equivalent to testimony that an act is morally permissible; and second, whether the doctrine Pascal is attacking here is best read as an extreme cousin of what the moral uncertainty literature now calls "My Favourite Theory," a garbled anticipation of something more like maximizing expected choiceworthiness, or a distinct error that even a fairly permissive contemporary view would reject. I'd like to know, as concretely as you can make it, whether my friend's reductio actually lands on the view I was defending, or only on something meaningfully stronger.
