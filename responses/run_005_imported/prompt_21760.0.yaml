answer: |-
  Here’s a 4-minute toast weaving the ergodicity insight into a heartfelt tribute, with a wink to the rationalists and warmth for everyone else:

  ---

  **(Clink glass gently)**  
  Alright, everyone. Deep breaths. I promise not to embarrass the groom *too* much... mostly because he’d fact-check my stories later.  

  Some of you know I’ve been friends with [Groom] since college. And if you’ve ever been cornered by him at 2 a.m. while he passionately explains why *this* voting system is mathematically superior, or why *that* AI alignment paper keeps him up at night… *(pause, knowing glances from nerds)* …you’ll understand when I say: his brain works differently.  

  Take last weekend. Most guys at bachelor parties are talking about… well, let’s just say *not* probability theory. But a few drinks in, [Groom] hits us with this thing called the **St. Petersburg Paradox**. Now, stick with me—I’ll translate.  

  *(Lean in conspiratorially)*  
  Imagine a casino game where you could win *millions*… in theory. Math says you should bet your life savings on it. But no sane person would. Why? Because the math assumes you’re playing that game infinite times, across infinite parallel universes. *(Smile)* **But as [Groom] put it: "The ensemble average and the time average come apart—and only one describes the life you actually live."**  

  *(Pause, soften tone)*  
  **Translation for the non-nerds:** Life isn’t about averaging every possibility. It’s not about all the paths you *could* take. **It’s about walking the one path you’re given—step by step, day by day—with your eyes wide open.**  

  *(Turn to the couple)*  
  [Groom], you’ve always chased truth. You dissect ideas like a watchmaker taking apart clocks. But when I see you with [Bride], I see something deeper: you’ve stopped calculating possibilities. **You’ve chosen to live *this* life—your one, real, non-parallel-universe life—with her.**  

  *(Light joke for the nerds)*  
  Honestly, it’s the ultimate rationality hack. Why optimize for hypothetical worlds when you can build something beautiful in *this* timeline? *(Raise eyebrow at rationalist friends)* Though I’m sure someone here will later argue we’re in a simulation anyway…  

  *(Back to warmth)*  
  [Bride], you’ve anchored him in the best way. You didn’t just show him love—you showed him **why** it matters to invest everything in a single, fragile, irreplaceable story. Together, you’re not gambling on infinite rolls of the dice. **You’re building something that only exists once: your marriage.**  

  **So here’s to the time average.**  
  To the messy, glorious, un-repeatable experiment of sharing one life.  
  To the courage it takes to stop measuring “what if” and start living “what is.”  
  And to my brilliant friend—who finally found the only thing worth betting it all on.  

  **(Raise glass)**  
  To [Groom] and [Bride]: May your shared timeline be long, ergodic in its joys, and full of the only kind of math that really counts… the kind that adds up to a lifetime of love.  

  ---

  **Why this works:**  
  - **The Nerd Nod:** Rationalists catch the deep cut (Peters' angle, not Bernoulli) and the "simulation" joke.  
  - **Universal Heart:** Parents hear "one path," "step by step," "building something beautiful"—no jargon needed.  
  - **Romantic Core:** Framing commitment as the "rational choice" honors his worldview while feeling deeply human.  
  - **Time:** Runs ~4 mins speaking at a moderate pace.  
  - **Key Line:** The central quote shines as both intellectual and poetic.  

  Deliver it with warmth, pause after the joke, and lock eyes with the couple at the end. They’ll feel seen—and the room will feel the love. Cheers! 🥂
