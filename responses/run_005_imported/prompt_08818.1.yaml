  To counter Strawson's authorship requirement, I can argue that demanding authorship leads to an impossible standard, much like demanding infinite justifications leads to skepticism. Moral responsibility can function with a practical foundation, just as knowledge does with basic beliefs. Also, Strawson's insistence on authorship might conflate origin with current ownership. An agent can own their traits without having created them, especially if those traits reflect their true self.

