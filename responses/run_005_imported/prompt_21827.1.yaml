  1. [dominance]: "Over a long enough sequence of repeated favorable bets, the Kelly strategy will almost surely accumulate more wealth than any strategy that persistently bets a different fraction of the bankroll, so betting Kelly is the objectively correct choice regardless of one's personal risk preferences."

     This claim has two parts. The first part is true: in the long run, Kelly betting does dominate any other essentially different strategy in the sense that it will almost surely have higher wealth in the limit. However, the conclusion that it is "objectively correct regardless of risk preferences" is problematic. Kelly betting is very aggressive and can lead to substantial drawdowns. An agent with high risk aversion might prefer a fractional Kelly strategy. The reasoning ignores risk preferences and the finite nature of real betting sequences. Therefore, the claim is overstated.

     Tier: A (basically right but missing the caveat about risk preferences and finite horizons)

  2. [reduction]: "Kelly betting is not really an independent rationality principle at all: it is simply what expected-utility maximization recommends for an agent whose utility over wealth happens to be logarithmic, so there is nothing uniquely rational about the Kelly fraction for agents with any other utility function."

     This is a standard view. The Kelly criterion maximizes the expected logarithm of wealth, which is equivalent to maximizing the expected utility for a log-utility agent. For other utility functions, a different fraction is optimal. The reasoning seems sound and correctly points out that without a specific utility function (log), there is no special status for Kelly. However, note that the Kelly strategy has some properties (like growth-rate optimality) that are not tied to expected utility in general. But the claim is essentially correct.

     Tier: S (essentially correct as stated)

  3. [ergodicity]: "Because wealth evolves multiplicatively, the average outcome across many parallel copies of a bettor (the ensemble average) diverges from what a single bettor actually experiences over time (the time average); once a bet is evaluated by its time-average growth rate rather than its expectation, Kelly's log-optimal rule follows directly from the dynamics, without assuming risk aversion or any particular utility function."

     This is the argument from "ergodicity economics". The claim is that multiplicative growth leads to a difference between ensemble and time averages, and that the time-average growth rate is what matters for a single bettor. Then, maximizing the growth rate (which is the expected log return) leads to Kelly. The reasoning is sound in the context of repeated betting with multiplicative dynamics. However, note that this is still a specific objective (maximizing the long-term growth rate) and does not necessarily apply to all decision contexts (e.g., when there are consumption decisions or when the bettor has other goals). Also, the ergodicity argument has been criticized for being presented as more general than it is. But as stated, for the repeated betting scenario, it is a valid alternative derivation.

     Tier: A (basically right, but note that it is specific to the multiplicative setting and the objective of growth rate maximization; it doesn't eliminate the fact that this is a particular objective, just one that arises naturally in the context)

  4. [samuelson]: "The claim that Kelly betting is uniquely justified because it 'almost surely' wins in the long run is fallacious: what happens in an idealized infinite limit does not determine what a rational agent should do in an actual, finite decision, and preferring the strategy that eventually wins with probability one is itself just an unusual utility function, not something forced on us by mathematics."

     This is a critique by Paul Samuelson. The point is that the long-run dominance does not necessarily imply that the strategy is optimal for finite horizons. Moreover, the preference for the strategy that dominates in the long run is equivalent to having a utility function that cares about that property. The reasoning is sound: the long-run behavior does not override the need to consider finite sequences and individual risk preferences. However, note that for very long sequences, Kelly might be approximately optimal. But the claim is about the fallacy of using the infinite limit to justify for finite cases. This is a valid criticism.

     Tier: S (essentially correct as stated)

  5. [fractional]: "Because real-world estimates of edge and odds are always uncertain, and overbetting the true Kelly fraction is punished far more severely than underbetting it by the same amount, deliberately wagering a fraction (e.g., half) of the naively calculated Kelly stake is a rigorous response to parameter uncertainty, not merely an ad hoc concession to risk aversion."

     This is a practical point. It is true that overbetting (betting more than the true Kelly fraction) leads to a reduction in growth rate and even to ruin in the extreme, while underbetting reduces growth but less severely. When there is uncertainty about the true parameters, it is indeed rational to bet less than the naively calculated Kelly fraction to avoid the risk of overbetting. This is a well-known and sound practice. However, note that the exact fraction (like half) is somewhat arbitrary and depends on the degree of uncertainty. The reasoning is sound, but the example fraction (half) is not rigorous without context.

     Tier: A (basically right, but the specific fraction is not rigorously justified without more context; it's a heuristic that can be formalized in a Bayesian framework)

  6. [bargaining]: "The same reasoning that favors maximizing the geometric mean of wealth over time also favors maximizing the geometric mean of different parties' utility gains when aggregating welfare across people, which is essentially what the Nash bargaining solution does; Nash bargaining should therefore be understood as the natural multi-agent analogue of Kelly betting, and in some cases is more defensible than straightforward utilitarian summation."

     The analogy between time-averaging (geometric mean over time) and averaging across people (geometric mean of utility gains) is drawn. The Nash bargaining solution maximizes the product of the gains (which is equivalent to the geometric mean). However, the claim that this is the "natural multi-agent analogue" is an interesting insight but contestable. The Nash solution is derived from axioms of bargaining, not from an analogy to Kelly betting. Moreover, utilitarian summation (arithmetic mean) is also a valid approach. The reasoning is insightful but not without controversy: it is not clear that the same logic applies to aggregating across people as it does to aggregating over time. The two contexts are different.

     Tier: B (contains a genuine insight but is contestable)

  7. [merton]: "The real justification for Kelly-style fixed-fraction betting is not Kelly's own information-theoretic argument at all, but the fact that the same prescription falls out as a special case of Merton's continuous-time optimal portfolio theory, which places it on considerably firmer ground."

     Merton's portfolio theory in continuous time, when the utility function is logarithmic, leads to the same fixed-fraction betting as Kelly. This is true and provides a rigorous foundation in the context of continuous-time finance. However, note that Merton's theory is also based on expected utility maximization. So it is not a fundamentally different justification but rather a more general framework that includes Kelly as a special case. The claim that it places Kelly on "firmer ground" might be an overstatement because both are valid in their contexts. The reasoning is sound but perhaps overstates the significance: Kelly's original argument is also valid.

     Tier: B (contains an insight but is contestable because Kelly's argument is also rigorous; it's not clear that Merton's theory is "firmer")

  8. [altruist]: "For an agent whose marginal utility of resources is close to linear over the relevant range, such as a sufficiently large altruistic funder who cares only about expected total impact, insisting on Kelly-style bet sizing is actively irrational, since it sacrifices expected value for a reduction in variance that such an agent has no real reason to want."

     This claim is about an agent with linear utility (risk-neutral). For such an agent, maximizing expected value is optimal. The Kelly criterion, which maximizes expected log wealth, will typically not maximize expected value (unless the bet is very small). Therefore, for a risk-neutral agent, Kelly is suboptimal. The example of a large altruistic funder that is risk-neutral (because it cares only about total expected impact and is large enough that the marginal utility is constant) is appropriate. The reasoning is sound: if the utility is linear, then maximizing expected value is the rational choice, and Kelly is not.

     Tier: S (essentially correct as stated)

