  The user's real frustration seems to be how this undermines the Turing Test's behaviorist purity. They're spot-on that giving machines "paranormal-equivalent capability" contradicts the idea that observable behavior alone defines intelligence. But maybe Turing saw this as patching an edge case rather than compromising fundamentals? After all, the RNG isn't helping the machine think - just leveling the informational playing field.

  What's clever about their question is how it exposes behaviorism's dirty secret: no test exists in a vacuum. All experiments make assumptions about what variables matter. Turing's ESP fix accidentally reveals his own boundary between relevant cognitive behavior and irrelevant "noise" (which for him apparently included psi phenomena). 

  I should emphasize that modern philosophers like Dennett have since addressed this by arguing that any practical test must ignore theoretically possible disruptions. That reframing might help the user see Turing's move not as a crack in behaviorism, but as an early recognition of its necessary pragmatism.

