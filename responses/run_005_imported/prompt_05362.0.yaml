  Hey, quick one for my current book project. I'm writing a novel partly set around Restoration-era Oxford/London, and Thomas Hobbes is a recurring side character, specifically during his decades-long fight with John Wallis after Hobbes convinced himself he'd squared the circle. I dont want to just write him as a "stubborn old crank who cant admit hes wrong," that feels cheap and I think misses whats actually interesting about him. Can you lay out the most important implications of Hobbes's actual views on geometry (why he was so fixated on Euclidean-style demonstration, and what he thought it had to do with certainty in general and with his civil philosophy) for how his refusal to concede to Wallis should be portrayed? I want the real intellectual stakes for him, not just a character flaw.
