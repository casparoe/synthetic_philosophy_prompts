prompt: |-
  So I've been chewing on this for my formal epistemology seminar and I can't shake the feeling that something is actually broken here, not just "philosophically puzzling." The example is the "Judy Benjamin problem" -- a soldier's platoon gets dropped somewhere in a region split into Red and Blue territory, each of which is further split into a "Headquarters Company" half and a "Second Company" half, so there's four equally likely quadrants to start with. Radio contact comes through just long enough for HQ to say "we don't know if you've strayed into Red territory, but if you have, it's 3:1 odds you're in their Headquarters half" -- and then the radio dies. If you actually run the standard update on that, Judy's probability of being in Blue territory goes UP (something like .53), even though the message was seemingly only about how the Red quadrant splits internally, and said literally nothing comparing Red to Blue at all.

  That seems completely bonkers to me -- like a textbook case of Bayesian conditionalization giving an answer that any sane person would call wrong. Doesnt this basically show that conditionalization, the thing every epistemology class treats as THE objectively correct way to update credences on new evidence, is actually not as reliable as advertised? My prof just shrugged and called it "a known open problem in formal epistemology" when I brought it up, which felt like kind of a dodge to me. Am I missing something here, or is this a genuine case where the textbook theory gives the wrong answer?
