  Alright, let's raise a glass to love, logic, and the beautifully constructed fiction of it all. Friends, family, metaethicists, and those who just came for the cake – welcome! It’s an absolute joy to be standing here, celebrating [Bride] and [Groom].

  Fifteen years ago, in the wilds of the internet, on a forum called LessWrong dedicated to thinking *really hard* about stuff, I stumbled into a comment thread. The topic? Probably something like “Is ‘ought’ even possible?” Riveting stuff, I know. And there they were – [Bride] and [Groom] – wielding arguments like laser scalpels, dissecting moral claims with terrifying precision. Little did I know, clicking 'refresh' on that page was like buying a ticket to the front row of the greatest, most stubbornly persistent double act I’d ever see.

  Now, for those blissfully unaware of the rabbit hole these three dove down for the better part of a decade… picture this. Most people say things like, “Stealing is wrong,” or “You should be kind,” and believe they’re stating facts as real as gravity. [Bride] and [Groom], after years of rigorous debate (some might say relentless pedantry), landed firmly on the position that, strictly speaking… those statements are all false. *Poof!* No objective ‘shoulds’ hovering in the universe. Mackie’s “argument from queerness” convinced them – moral facts would be utterly bizarre entities! And Joyce sealed the deal: best to treat morality like a *really* useful fiction.

  *(Lean in conspiratorially)* So, they’ve asked me, half-joking but entirely seriously, to keep this toast… well… *honest*. By *their* lights. That means no “written in the stars,” no cosmic “meant to be,” no smuggled-in objective prescriptivity. Which, honestly, takes all the easy outs off the table! How *do* you celebrate two people whose love story is intertwined with the conclusion that categorical imperatives are probably nonsense?

  Here’s how: We celebrate the *fiction* they’ve chosen to build *together*. Because that’s the beautiful twist Joyce offered, and that these two embody: **Just because the universe isn’t handing out objective ‘shoulds’, doesn’t mean we can’t write our own damn script.**

  Look at them. After 15 years of dissecting why words like "deserve" or "right" *can't* refer to cosmic facts... they *chose* this. They chose the elaborate, joyful, sometimes messy fiction of commitment. They looked at the void and said, “You know what? We’ll build our own meaning right here.” They saw the utility, the sheer *practical awesomeness*, of acting *as if* certain things matter profoundly – like honesty, respect, deep care, and showing up for each other, day after day. They saw that this particular story – the story where their well-being is inextricably linked, where their joys are shared and burdens halved – is a story worth telling, worth inhabiting, worth fiercely protecting.

  It’s not that the universe *demands* their happiness; it’s that they *demand* it of themselves and each other. That’s not a weaker foundation; in many ways, it’s stronger. It’s conscious. It’s chosen. It’s built brick by brick through countless conversations (many, I suspect, still involving Mackie and Joyce), shared laughs, quiet support, and the deliberate, ongoing decision to prioritize *this* connection above others. It’s a commitment forged not in the fires of cosmic destiny, but in the clear light of mutual recognition: "You. This. *Us*. It works. Let's keep doing it, intentionally, joyfully, weirdly."

  So, to [Bride] and [Groom]: You are masters of your own narrative. You navigated the treacherous metaethical swamps and emerged hand-in-hand, ready to author the next, brilliant chapter of your supremely useful, deeply felt, and wonderfully real fiction. You didn’t find objective meaning; you built subjective meaning that looks suspiciously like the real thing – only better, because it’s authentically, uniquely *yours*.

  May your shared story continue to be rich, resilient, and ridiculously rewarding. May you keep choosing each other, delighting in each other, and finding profound joy in the magnificent, self-authored project that is your life together.

  Ladies and gentlemen, raise your glasses: To [Bride] and [Groom]! May their fiction be long, hilarious, deeply satisfying, and contain absolutely no smuggled objective prescriptivity! (Unless they decide to ret-con that chapter later… we’ll see how the comments go). Cheers!
