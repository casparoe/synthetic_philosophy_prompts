answer: |-
  The salvage yard smelled of rust and rain. Elias Varga surveyed his kingdom of twisted metal: eviscerated cars stacked like broken toys, mountains of copper wire gleaming dully, the skeletal remains of industrial machinery slowly surrendering to the weeds. His kingdom, and his burden. Thirty years of breathing in the metallic tang of decay, of coaxing value from what others discarded. His right arm, the one that had hauled engines and wielded the cutting torch, throbbed with a familiar, insistent ache – the Great Clod’s little joke, wearing him out with living.

  A figure emerged from the maze of scrap, picking his way carefully in polished loafers entirely unsuited to the oily mud. Dr. Aris Thorne, philosophy professor, clutching a thermos like a shield. His weekly pilgrimage to "observe the practical man." Elias grunted a greeting.

  "Elias! Found something rather… macabre today," Thorne announced, holding up a plastic evidence bag. Inside, stained a dull ochre, lay a human skull. "By the perimeter fence. Probably washed down from the old cemetery during the floods. Police said it’s archaeological, nothing suspicious. They’ll collect it later."

  Elias eyed the skull. The empty sockets seemed to gaze back, indifferent. "So you brought it here? My yard’s not a reliquary."

  "Thought you might appreciate the historical resonance," Thorne said brightly, placing the bag carefully on an upturned oil drum. "Memento mori and all that. Fits your… environment."

  Elias snorted. "Dead’s dead. Less trouble than the living, usually." The ache in his arm flared, a sharp counterpoint. He massaged it roughly, the motion ingrained. Thorne launched into a monologue about Stoic acceptance, the fleeting nature of existence. Elias tuned it out, focusing on the skull. It looked peaceful, absurdly so. Like it knew a joke the rest of them were too busy breathing to get. *How did you end up here, old bone?* he thought. *Bailiff? Thief? Just unlucky?* The questions felt strangely direct, aimed at the vacant sockets.

  That night, rain lashed the corrugated roof of Elias’s trailer. The skull, bagged and silent, sat on his small kitchen table. He’d told Thorne he’d keep it safe until collection, a decision he now regretted. The ache in his arm was worse, a deep, grinding pulse that defied painkillers. He lay down, the skull a pale blur in the dim light. Exhaustion pulled him under.

  *He stood in the yard, but it was different. Cleaner, quieter. The mountains of scrap gleamed like polished silver under a moon too large. The skull sat on the same oil drum, but now it was whole, pristine ivory, and it spoke. Its voice was dry, like pebbles tumbling in a stream.*

  *"Took you long enough to ask, Salvage King."*

  *Elias wasn't startled. Dream-logic held. "Ask what?"*

  *"How I ended up roadside rubble. The usual suspects: war, plague, a bad oyster. Does it matter? The point is, I’m here. And you’re… there." The skull seemed to chuckle, a sound like wind through dry grass. "You living cling so tightly to your little vantage point. Like a mayfly lecturing the mountain on permanence."*

  *Elias gestured at his yard. "This is my vantage point. Built it myself."*

  *"Built it?" The skull’s tone was amused. "You assembled it. From pieces the Great Smith discarded. Like this." It indicated itself. "One shape discarded, reshaped. Now, I ask *you*, Salvage King: Would you trade places? Be me? Cold bone in the mud?"*

  *Elias looked at the aching arm he didn't have in the dream. "No."*

  *"Exactly! Provincialism!" The skull declared triumphantly. "You assume your current arrangement – the pulse, the ache, the worry about rusting inventory – is inherently superior. But have you *been* dead? How do you know it’s not… preferable?"*

  *"Preferable? To nothing?"*

  *"Who says it’s nothing? Maybe it’s just… different. Less… *frictional*. No aching limbs. No demanding professors. No inventory. Think of it! Would you rather be a king, harnessed to duty, plagued by assassins and indigestion? Or be… pleasantly inert? The Great Smith works the metal, Elias. Sometimes it’s a sword, sometimes a plowshare. Sometimes… a skull. Who’s to say the skull’s the worst shape?"*

  *Elias woke with a gasp. Rain still drummed on the roof. The skull was a dark lump on the table. His arm screamed. The dream’s bizarre calm lingered, clashing violently with the physical agony. *Provincialism? Pleasant inertness?* It was ludicrous. Yet, the skull’s casual irreverence, its refusal to be tragic, echoed in his mind. *The Great Smith.* The phrase resonated with the relentless transformation in his yard, the crushing, melting, reshaping. Was his own body just another piece of salvage, temporarily assembled, destined for disassembly?

  Two days later, the pain in his arm became a white-hot vice. Diagnosis: severe, chronic tendonitis, likely degenerative. Aggravated by decades of labour. Surgery possible, success uncertain. The doctor prescribed rest, a concept alien to Elias. Rest meant decay, unpaid bills, the yard falling into chaos. Thorne arrived, brimming with concerned platitudes and Kantian imperatives about duty to the self.

  Elias sat in his office, a tiny prefab hut overlooking the yard. The skull, now in a cardboard box awaiting the archaeological society, seemed to watch from the corner. The doctor’s words warred with the skull’s dry laughter in his head. *Wears you out with living…*

  He walked out into the yard, the late afternoon sun casting long, distorted shadows from the piles of scrap. His arm hung useless, a dead weight. He stopped by the pile where they sorted smaller, reusable parts: hinges, brackets, oddly shaped bits of metal. He picked up a heavy, polished steel cylinder with his good hand – the piston from a small engine, smooth and cool. An idea, absurd and unbidden, surfaced.

  He walked back to the prefab, ignoring Thorne’s questioning look. He cleared his desk. Using his good hand and his teeth, he awkwardly wrapped a thick cloth around the seized, painful joint of his right elbow. Then, with grim determination, he lodged the smooth steel piston into the crook of the cloth-bound elbow. He clamped his arm down, trapping it. The pressure was immense, agonizing for a moment… and then, a strange thing happened.

  The pressure seemed to *contain* the deeper ache. The sharp, grinding pain lessened, replaced by a solid, almost bearable throb. He picked up a discarded aluminium cocktail shaker with his left hand. Tentatively, he raised his right arm, the piston acting like a crude, rigid extension. He brought the piston down onto the upturned base of the shaker.

  **CLANG.**

  The sound was sharp, clear, resonant in the still air. Not the sound of pain, but of impact. Purposeful.

  Thorne stared. "Elias? What in God’s name are you doing?"

  Elias brought the piston-arm down again. **CLANG.**

  "Testing a theory," he grunted. He moved the shaker. **CLANG.** He hit it harder. **CLANG!** A rhythm emerged, slow, deliberate. Each impact sent a vibration up his arm, a counter-rhythm to the pain. It didn’t erase it, but it *engaged* with it. Transformed it.

  *If my arm turns into a rooster, I'll use it to crow at dawn…* The line from the Zhuangzi translation Thorne had once read him surfaced, bizarrely apt. His arm wasn't a rooster, but it wasn't *just* a source of agony anymore. It was a… piston-hammer. A thing of salvage. Repurposed.

  He imagined the skull’s dry chuckle. *See? Even the worn-out parts have potential. Maybe especially those.*

  Thorne looked horrified. "This is… perverse! You need rest, rehabilitation, not… not turning yourself into some kind of industrial percussionist!"

  **CLANG!** Elias hit the shaker again, a defiant punctuation. "Rest?" He gestured out at the yard with his good hand, encompassing the mountains of decaying metal. "What do you think happens out there, Professor? Everything rests, eventually. But first…" He raised the piston-arm. "...it gets reshaped." **CLANG.** "This arm? It’s wearing out. The Great Smith’s loading me down with age. Fine." **CLANG.** "So, for now, it’s a hammer. Later?" He shrugged, a flicker of something like the skull’s dream-amusement in his eyes. "Maybe it becomes part of a fence. Or melts down for casting. Who knows? Point is," he brought the piston down with a final, ringing **CLANG!**, "it’s not *over* until the Smith stops working the metal. And I don’t hear any anvil going quiet."

  He lowered his arm, the ache returning, insistent but somehow… familiar. Manageable. Not a sentence, just a condition. Thorne stood speechless, caught between intellectual fascination and visceral discomfort.

  Elias looked at the box containing the skull. He didn't know if being dead was better than being a king. But right now, with the fading echo of the clang hanging in the oily air, the ache in his reshaped arm, and the absurdity of it all thick enough to taste, being Elias Varga, Salvage King with a piston for a hammer, felt… strangely sufficient. It was just this shape, for now. And the Smith, as Zhuangzi’s dying man implied, was never in a hurry to explain the final design. Maybe the dead knew something. Or maybe, Elias thought, looking at Thorne’s bewildered face and then at his own crude, functional arm, they just enjoyed the quiet. He picked up the cocktail shaker with his good hand. It was dented, but intact. Still useful.

  "Tea, Professor?" he asked, his voice rough but calm. "Or something stronger? I think my arm makes a decent cocktail shaker now, too." He didn’t wait for an answer, already turning towards the kettle, the question hanging, unresolved, like the echo of metal on metal in the gathering dusk. The skull, silent in its box, offered no opinion, but Elias fancied it approved of the lack of tidy endings.
