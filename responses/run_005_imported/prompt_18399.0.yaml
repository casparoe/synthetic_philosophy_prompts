answer: |-
  That's a deeply frustrating situation, and your confusion is completely understandable. Your roommate's behavior sits squarely in the realm of **deception through technically-true-but-misleading statements (often called "paltering").** Here's a breakdown:

  1.  **It's Deception, Not Just "Careful Wording":**
      *   **Intent to Mislead:** The key factor isn't just whether the words were *literally* true, but whether they were *intentionally chosen* to create a false impression. Your roommate knew she'd paid almost nothing ($9 out of $160 is 5.6%). Saying "I've paid for *some*" when the context was your concern about her lack of payment was clearly designed to make you think her contribution was *significantly more substantial* than it was. She wanted you to back off based on a false understanding.
      *   **Exploiting Ambiguity:** She deliberately used a vague word ("some") whose meaning can range wildly depending on context, *knowing* you would interpret it generously (meaning 20%, 30%, maybe even 50%) in the context of your complaint about her lack of payment. She then hid behind the *literal minimum possible meaning* of the word ("more than zero") when called out.
      *   **The Defense is Part of the Deception:** Her defensive argument ("I never said half or most!") is classic paltering behavior. It focuses *only* on the technical truth of the words to deflect from the *intended and understood* false impression she created. It's shifting blame to you ("your fault for assuming") instead of taking responsibility for her misleading communication.

  2.  **Paltering vs. Outright Lying:**
      *   **Literal Lie:** "I paid $80 towards groceries." (Factually false)
      *   **Paltering:** "I've paid for some of the groceries." (Technically true, but designed to imply a significant contribution far beyond the actual $9).
      *   **The Ethical Difference is Minimal:** While philosophers and linguists debate the *exact* definition of a "lie," the practical and ethical impact is often identical. Both aim to make you believe something untrue. Paltering relies on the listener making a reasonable inference that the speaker *intends* them to make. Your roommate *wanted* you to believe she'd paid a decent chunk. That's the core dishonesty.
      *   **It's Often *Worse*:** Paltering can feel more manipulative because it allows the deceiver to maintain a veneer of plausible deniability ("But I *told* the truth!") while still achieving the deceptive goal. It's a form of gaslighting where they make *you* feel unreasonable for drawing the natural conclusion they engineered.

  3.  **Responsibility for the "Gap":**
      *   **Primarily on the Speaker (Your Roommate):** Communication is a shared responsibility, but the primary burden for being clear and *not* intentionally misleading falls on the *speaker*, especially in a context like shared finances where trust and clarity are paramount.
      *   **Reasonable Interpretation:** Your interpretation of "some" in the context of your complaint about her lack of payment was entirely reasonable. Virtually no one would hear "I've paid for *some*" in that context and think "Oh, she means $9 out of $160." The reasonable inference was a non-trivial amount.
      *   **Your Responsibility (Minor):** Your responsibility is to listen carefully and clarify if something seems ambiguous *in the moment*. However, in the heat of an annoyed confrontation, and given the seemingly straightforward statement, it's understandable you didn't immediately demand a dollar amount. Her defensiveness afterward also shut down clarification. Your responsibility *after* realizing the deception was to call it out, which you did.
      *   **Her Weaponizing the Gap:** By saying "that's on you for reading into it," she's weaponizing the inherent ambiguity of language *that she exploited* to avoid accountability. It's disingenuous.

  **Conclusion & What It Means:**

  *   **Your roommate deceived you.** She used a technically true statement with the clear intent to create a false impression about her financial contribution. This is ethically equivalent to lying in its intent and effect. Calling it "technically true but misleading" *is* giving it better PR, but it doesn't change the dishonest core.
  *   **Your friend who calls it a cop-out is closer to the mark.** The *point* of communication is shared understanding, not word games. Deliberately engineering a false understanding is deceptive, regardless of the literal truth of the words used.
  *   **The responsibility lies overwhelmingly with your roommate.** She chose the misleading word, exploited your reasonable interpretation, and then blamed you for it. This is a breach of trust in your shared financial arrangement.

  **What Now?**

  This isn't just about $80. It's about trust and communication in your living situation.

  1.  **Address the Behavior, Not Just the Money:** When things calm down, have a direct conversation. Focus on the *impact* of her communication: "When I expressed concern about your lack of payment, and you said 'I've paid for some,' I reasonably understood that to mean you'd covered a significant portion. Discovering it was only $9 felt deceptive. Using technically true statements to create a false impression damages trust."
  2.  **Set Clearer Communication Standards:** "Going forward, for financial matters, let's avoid vague terms like 'some.' If I ask about contributions, I need specific amounts or percentages to avoid misunderstandings. Honesty includes clarity, not just technical truth."
  3.  **Reinforce Expectations:** Remind her that the Splitwise system relies on timely and accurate contributions. $9 against $160 is not fulfilling her commitment, regardless of wordplay.
  4.  **Observe Her Response:** Does she acknowledge the manipulation and apologize? Or does she double down on the technicality? Her reaction will tell you a lot about whether this is a one-off moment of defensiveness or a pattern of behavior you need to manage carefully (or consider if this living arrangement is sustainable long-term).

  Your annoyance is entirely justified. This wasn't a misunderstanding; it was a calculated attempt to mislead you while maintaining deniability. That's dishonest, regardless of the dictionary definition of "lie." Trust your gut on this one.
