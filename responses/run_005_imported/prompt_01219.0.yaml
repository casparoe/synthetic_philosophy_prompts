answer: |-
  The cicadas screamed in the heat. Arthur stood in the overgrown backyard of his father’s house, now *his* house, holding a chipped coffee mug filled with lukewarm water. Two months. Dust motes danced in the shafts of light spearing through the neglected willow oak. He hadn’t touched the garden tools leaning against the shed. They looked accusatory.

  His friend Mei had sent the passages. *Zhuangzi*. Not "I'm sorry for your loss," but pages about skulls used as pillows and men singing at funerals. Comfort? It felt more like being pushed off a cliff into a cold, clear lake. The image that wouldn’t leave: the metal on the forge, refusing to be anything but the sword it once was. An ill omen.

  Arthur kicked at a dandelion puffball. It exploded into white nothingness. *Transformations*, Zhuangzi called it. Breath, shape, birth… death. Just the next step. But the *particularity* of his father – the smell of pipe tobacco and motor oil, the way he cleared his throat before telling a bad joke, the specific curve of his knuckles around a wrench – that felt irreducible. To grieve felt like acknowledging that irreducible thing was *gone*. Yet Zhuangzi seemed to whisper: *Was it ever really that solid? Were you?*

  That night, sorting through boxes in the attic – a task he’d avoided – Arthur found his father’s old slide hammer, a heavy, blunt tool for pulling bearings. He hefted its cold weight. A specific tool for a specific job. Dust coated everything, thick and choking.

  Exhaustion hit him like a wave. He didn’t make it to the bed. He slumped onto the threadbare rug near the boxes, the slide hammer still in his hand. The dust motes seemed to thicken, swirling in the dim light from the bare bulb.

  He dreamed.

  He wasn’t in the attic. He stood on a vast, featureless plain under a sky the colour of hammered bronze. The air hummed, not with sound, but with potential vibration. Before him stood an immense, rudimentary forge. Not fire, but a seething, liquid light pulsed within its stone basin. A Smith, featureless yet radiating immense, impersonal focus, stood beside it.

  In the Smith’s hand was a glowing shape. Arthur *knew* it. Not as a person, but as a distinct pattern of light – the unique resonance of his father. The Smith examined it, not with sentiment, but with the assessing eye of a craftsman considering material. Then, the Smith plunged the glowing shape into the liquid light of the forge.

  Arthur cried out, a sound swallowed by the humming air. He lunged forward, not thinking, only feeling the wrenching loss. "No! That’s *him*! That’s my father! Put him back!"

  The Smith paused. The shape still glowed within the forge-light, beginning to soften at the edges, its distinct pattern blurring. The Smith turned its attention to Arthur. There was no malice, no kindness. Only immense, patient *work*.

  **"Why do you interrupt the casting?"** The voice wasn’t sound; it was pressure against Arthur’s mind. **"The metal is sound. It is ready for the next form."**

  "But it was a *man*," Arthur insisted, the words feeling flimsy. "A *good* man. My father. Doesn’t that matter? Doesn’t *he* matter?"

  The Smith seemed to consider. The glowing shape within the forge pulsed, shedding tiny sparks that vanished into the bronze sky. **"Matter? It is matter. Good matter. Strong pattern."** A pause. **"But the pattern was always changing. Breath condensed, took shape, lived. Now it loosens. The forge is hot. The work continues."**

  Arthur looked at his own hands. They seemed insubstantial, flickering. "What about me? Am I… just metal waiting too?"

  The Smith didn’t answer directly. It gestured vaguely, encompassing the plain, the sky, the forge. **"Is the dream of the butterfly less than the man who dreamed it? Is the man more than the dream? The forge works. The metal is good. Insisting it remain only a sword…"** The Smith tilted its headless form, a sense of profound, alien disapproval radiating. **"...is an ill omen. It wastes good metal. It resists the work."**

  The Smith turned back to the forge. The glowing shape was almost entirely dissolved now, its light merging seamlessly with the greater light. The Smith raised a tool – not a hammer, but something that bent light – ready to shape whatever emerged next. Not a sword. Something entirely new, unimagined.

  Arthur woke with a gasp. He was on the attic rug, covered in dust, the cold slide hammer still clutched in his hand. Dawn light, grey and thin, filtered through the grimy window. His throat was raw, as if he’d been screaming. The dream vibrated within him, not fading, but settling into his bones like a deep, resonant hum.

  He sat up, wiping dust from his face. It felt different now. Not just dirt, but… transformed matter. Ground-down rock, decayed wood, skin cells, maybe even atoms that once were his father’s pipe smoke. He looked at the slide hammer. A heavy, blunt tool. Useful for one specific thing. But just metal. Good metal.

  Downstairs, the empty house echoed. He filled his mug at the sink. Outside, the cicadas were starting again. He saw the recycling bin by the back door, overflowing with cardboard boxes he’d broken down. Impulsively, Arthur picked up the slide hammer. He walked outside into the humid morning.

  He didn’t think of his father’s hands. He thought of the forge. He thought of the vast, humming plain. He thought of the Smith’s disapproval at wasted metal.

  He raised the slide hammer and brought its heavy end down hard on the side of the blue plastic bin. *CLANG!* The sound was shockingly loud, shattering the cicadas' drone. He did it again. *CLANG!* And again. *CLANG!*

  It wasn't singing. It wasn't wailing. It was just noise. Loud, percussive, jarring noise. Striking metal against hollow plastic. Striking the specific tool against the container for transformed things.

  *CLANG! CLANG! CLANG!*

  He didn't feel better. He didn't feel resolved. He felt ridiculous. He felt raw. He felt the immense, impersonal vibration of the forge humming in his teeth. He felt the dust, which was everything and nothing, coating his skin. He felt the *particular* ache of missing his father’s laugh, a pattern dissolved into the seething light.

  He kept drumming on the bin. Not for comfort. Not for catharsis. But because the metal was good, and the work, however incomprehensible, continued. The sound was the only honest thing he could offer to the vast, uncaring hum of transformation.
