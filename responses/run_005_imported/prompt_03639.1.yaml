prompt: |-
  I'm a retired research chemist (forty-one years between industrial and then academic labs before I hung up the lab coat), and for the last couple of years I've been trying to actually read philosophy from primary sources instead of just absorbing the pop-science digest version of it — my reasoning being that I never would have accepted a claim in the lab without going back to the original data, so I don't see why philosophy should get an exception. Right now I'm slowly working through William James's "The Will to Believe" (the free Gutenberg copy, on my e-reader) after stumbling into the whole James-vs-Clifford business via a footnote somewhere and getting curious enough to read the actual essay. The famous opening stuff — live and dead hypotheses, forced and avoidable options — went down easy enough. But there's a stretch further in, in the section numbered V, right where he's setting up the difference between the "empiricist" and "absolutist" ways of believing in truth, that I've now reread about five times and it still won't sit still in my head.

  Here it is, copied out exactly as printed, Latin and all, except for one sentence I trimmed for length (marked with the ellipsis):

  "Scholastic orthodoxy, to which one must always go when one wishes to find perfectly clear statement, has beautifully elaborated this absolutist conviction in a doctrine which it calls that of 'objective evidence.' ... The final ground of this objective evidence possessed by certain propositions is the adaequatio intellectûs nostri cum rê. The certitude it brings involves an aptitudinem ad extorquendum certum assensum on the part of the truth envisaged, and on the side of the subject a quietem in cognitione, when once the object is mentally received, that leaves no possibility of doubt behind; and in the whole transaction nothing operates but the entitas ipsa of the object and the entitas ipsa of the mind. We slouchy modern thinkers dislike to talk in Latin,—indeed, we dislike to talk in set terms at all; but at bottom our own state of mind is very much like this whenever we uncritically abandon ourselves: You believe in objective evidence, and I do. Of some things we feel that we are certain: we know, and we know that we do know. There is something that gives a click inside of us, a bell that strikes twelve, when the hands of our mental clock have swept the dial and meet over the meridian hour. The greatest empiricists among us are only empiricists on reflection: when left to their instincts, they dogmatize like infallible popes. When the Cliffords tell us how sinful it is to be Christians on such 'insufficient evidence,' insufficiency is really the last thing they have in mind. For them the evidence is absolutely sufficient, only it makes the other way. They believe so completely in an anti-christian order of the universe that there is no living option: Christianity is a dead hypothesis from the start."

  Two things have got me stuck, and I'd appreciate help with both. First, my Latin is nonexistant, so I honestly can't tell whether those scholastic phrases are doing real argumentative work or whether James is just parading them past us ironically before he knocks the whole picture down — the tone is hard for me to catch on the page. Second, and this is the one I keep chewing on: what's the actual force of the crack about "the Cliffords" at the end there? My best reading is that James is saying Clifford isn't really the neutral, evidence-weighing referee he presents himself as — he's just as much a dogmatist as any believer, only dogmatic about naturalism instead of Christianity. But even granting that's true of Clifford the man, I don't see how it lays a glove on Clifford's actual rule, which was a claim about what you ought to do given your evidence, not a boast that he personally does it perfectly. So has James found a genuine weakness in Clifford's position here, or is this just a psychological jab that leaves the principle itself standing untouched? Would appreciate someone walking through it with me line by line.
