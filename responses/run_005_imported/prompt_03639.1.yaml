  Also, the user's scientific background means they value principles over personal attacks. So, clarifying that James is not just attacking Clifford but highlighting a flaw in the principle's assumption—that evidence assessment can be neutral—addresses their concern. James is saying Clifford's rule presupposes a neutral standpoint, which doesn't exist for fundamental beliefs.

