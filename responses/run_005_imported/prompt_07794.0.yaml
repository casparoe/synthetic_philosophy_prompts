  ### Key Methodological Reasoning:
  - **Top choice (Perceptual-expertise)**: Expertise cases (e.g., radiologists) involve *acquired perceptual capacities* enabling direct detection of features invisible to novices, strongly suggesting perceptual restructuring rather than cognitive bias or judgment. Trained experts don't just *interpret* ambiguous data differently—they gain new sensory access (e.g., differentiating tumor parenchyma), satisfying Firestone & Scholl's demand for phenomenology-altering changes.
    
  - **Bottom choice (Delk & Fillenbaum)**: The effect is fragile and easily explained by demand characteristics (participants guessing the hypothesis) or semantic associations (hearts → red) altering *judgments* about identical hues. Crucially, no evidence shows subjects *see* different colors; they merely *rate* them as redder.
