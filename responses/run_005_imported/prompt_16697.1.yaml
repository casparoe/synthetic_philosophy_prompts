answer: |-
  ## Whiteboard Duel: Dispositionalism vs. The Skeptic

  **Setting:** A cluttered philosophy department common room. Whiteboard covered in symbols. **Dana** (Dispositionalist) is writing. **Karl** (Kripkean Skeptic) leans against a desk, arms crossed.

  **Dana:** (Writing `DISPOSITIONALISM: Meaning = Dispositions to Apply` on the board) Look, Karl, it’s straightforward. When I say I mean *plus* by ‘+’, it’s constituted by my *dispositions* – how I *would* answer addition problems. If you ask me ‘2+3?’, I’m disposed to say ‘5’. If you ask ‘68+57?’, I’m disposed to say ‘125’. That *is* what I mean. No mysterious mental facts needed.

  **Karl:** (Steps forward, picks up a marker) Ah, the comforting allure of dispositions! But let’s test this, Dana. Take ‘68+57’. You say you’re disposed to answer ‘125’. Fine. But *why* does that disposition reflect *meaning plus* rather than *quus*? Remember quus? (Writes: `quus(x, y) = x + y if x, y < 57, else 5`)

  **Dana:** Because my disposition *is* to add according to the plus function! For *every* pair of numbers, my disposition tracks the correct sum. That’s constitutive of meaning addition.

  **Karl:** (Circles `68+57`) First Problem: **Finitude**. You’ve only ever computed a *finite* number of sums in your life. You’ve *never* been asked about 68+57 before this moment. So, *prior* to this instant, what fact about your dispositions *specified* that you’d answer ‘125’ rather than ‘5’ for *this* novel case? Your past dispositions only covered the sums you’d *actually* computed or considered. The dispositional fact for *this specific case* didn’t exist until now! How can a disposition that *didn’t exist* fix the meaning *yesterday*?

  **Dana:** (Points emphatically) That’s a mischaracterization! Dispositions aren’t just a list of past outputs. They’re *subjunctive* – they encompass how I *would* respond *if* asked *any* sum, including ones I’ve never encountered. My cognitive machinery – my brain state, my learning history – grounds a *general* disposition to compute sums according to the plus rule. The fact that I *would* say ‘125’ *if* asked 68+57 *was* true yesterday, even if the specific counterfactual hadn’t been triggered. It’s a standing capacity.

  **Karl:** (Nods slowly, then smiles) Ah, the retreat to subjunctives. Enter Second Problem: **Misfire**. Suppose I ask you ‘68+57’ *right now*. You say ‘125’. Bravo. But what if I asked you after you’d pulled three all-nighters, or had three glasses of scotch? You might slur “Uh… 5?”. According to dispositionalism *simpliciter*, doesn’t that mean that *in that state*, you meant *quus* by ‘+’? But that’s absurd! You didn’t *change your meaning*; you made a *mistake*. Dispositionalism conflates what I *would* say with what I *should* say – it can’t ground the normativity of meaning! Meaning implies correctness conditions, dispositions only give you *actual* (or counterfactual) outputs, some of which are *errors*.

  **Dana:** (Steps back, thinks) Okay, fair. We need to refine. Not *any* disposition under *any* condition. We appeal to dispositions under *ideal* or *normal* conditions – conditions of competence. When I’m sober, well-rested, paying attention, my disposition reliably outputs the sum. *Those* dispositions fix the meaning. The error cases are deviations *from* those core, meaning-constituting dispositions.

  **Karl:** (Leans in, voice sharp) **Smuggling!** You said the magic word: ‘competence’. What *are* ‘ideal conditions’? Conditions where I don’t make mistakes? Conditions where I compute *correctly*? But ‘correctly’ according to *what*? According to the very rule you’re trying to define! You’re trying to define what ‘plus’ means in terms of dispositions, but then you define the relevant dispositions as those that produce the *correct* plus-answers. That’s blatantly circular! You’ve smuggled the intentional fact – *knowing what plus is* – back in through the back door to *define* which dispositions count. ‘Ideal conditions for computing plus’ presupposes we already know what ‘plus’ is! Dispositionalism collapses.

  **Dana:** (Paces, then turns) Not necessarily! We can cash out ‘ideal conditions’ *non-intentionally*. They’re the conditions under which my cognitive system is functioning *as it was designed to*, or *as it standardly does* for this task, without external interference. Think neurophysiologically: conditions where my arithmetic-processing modules are online, synaptic pathways are firing optimally, no noise or damage. The disposition grounded in *that* state is the meaning-constituting one. The normativity comes from the system’s own functional norms – what it *does* when working right. We don’t need prior intentional facts.

  **Karl:** (Scoffs) ‘Designed to’? By evolution? That just pushes the problem back. How does evolution ‘design’ me to mean *plus* specifically rather than *quus*? The physical state of my brain yesterday under ‘optimal conditions’ was compatible with an infinite number of functions, including quus, that yield the *same* answers for all sums *I’d actually computed up to that point*. 68+57 was the first divergence! Your ‘optimal neurophysiological state’ doesn’t magically point to one unique function. And ‘functioning as it standardly does’ – standard for *what*? For *adding*? Again, circular! You’re describing the state that produces *plus-like* outputs, but that presupposes plus is the target.

  **Dana:** But the causal role matters! My learning history – being taught ‘plus’ with small numbers, the feedback I received – causally shaped my neurophysiology to implement the *plus* function. My disposition isn’t brute; it’s the causal product of training on paradigmatic cases. The system’s robust tendency, grounded in its causal structure, *is* the fact that constitutes meaning plus. It’s messy, physical, but real.

  **Karl:** Robust tendency *towards what*? Towards the answers that align with the *communal standard* of addition? But then you’ve shifted to a communal dispositionalism, which just kicks the skeptical can down the road – what fixes *their* meaning? And we’re still stuck: How does this causal structure *yesterday* mandate ‘125’ *today* for 68+57, rather than ‘5’, when both are physically possible outputs compatible with prior structure? The skeptic isn’t denying you *will* say 125; they’re denying there’s a *fact* that this is what you *meant* to do, that this answer is *required* by your past meaning. Dispositions tell me what you *do* or *would do*. They don’t tell me what you *ought* to do. Meaning is normative, dispositions are descriptive. You haven’t bridged that gap. Your ‘ideal conditions’ are a leaky lifeboat.

  **Dana:** (Wipes the board partially, starts sketching a neural network diagram) The normativity *emerges* from the system’s own stable, trained dispositions! ‘Ought’ just *is* ‘would under conditions of competence’. It’s not some ghostly rule hovering above the causal machinery; it’s *in* the machinery’s reliable operation. Your skepticism demands a fact beyond all possible use and manifestation – a fact that plays no role in my actual practice or dispositions. That’s the *real* mystification!

  **Karl:** (Points at the neural net sketch) And what does *that* net *mean* by its output layer? The same puzzle applies! Does it mean plus, or quus? Its training data was finite. Its weights are fixed, but compatible with quus for unseen cases. Its ‘dispositions’ are just its outputs on test sets. Where’s the *meaning* fact? (He taps the board where `68+57= ?` remains). The gap yawns. Dispositions tell us about behavior, Karl. They don’t tell us about *content*. The skeptic’s challenge stands: Show me the *fact* that constitutes meaning plus rather than quus. Your dispositions are just more behavior to be interpreted. The rule remains... (He lets the phrase hang) *skeptically elusive*.

  **(The dialogue ends here. Dana stares at the neural net diagram, then back at `68+57`. Karl watches, a skeptical eyebrow raised. The whiteboard, filled with arguments and counter-arguments, offers no clear resolution. The tension between causal dispositions and normative meaning remains palpably unresolved.)**
