prompt: |-
  Me and a friend run a tiny podcast where we interview researchers about stuff that's tangentially related to my day job (I do ML / backend engineering) but way weirder. She's got the actual philosophy PhD between the two of us, I'm just the numbers guy, but she's buried in conference prep this week so guest-question duty landed on me. Next episode's guest is a formal epistemologist who works on "accuracy-first epistemology" / epistemic utility theory -- keeping her unnamed here since I don't want to put words in a real person's mouth if I mangle some detail of her actual published view, so just treat her as someone who fully endorses the accuracy-dominance argument for probabilism (the move where you define accuracy with a scoring rule, show that incoherent credences are always dominated by some coherent credence function across every possible world, and conclude you're epistemically required to be coherent -- I think the guy who originally came up with this is named Joyce but don't quote me on that).

  I got nerd-sniped by this because at my job we use Brier score and log-loss to check whether a model's probability outputs are calibrated, and apparently that's the exact same math this corner of epistemology runs on. So instead of just having her re-explain the pitch, I want questions that lean on the parts that seem shaky to me. Can you draft six to eight questions: at least one on the "immodesty" feature, where because the scoring rule is strictly proper, your current credence always comes out as the one you expect to be most accurate, which feels suspiciously self-congratulatory and maybe hard to square with taking seriously the possibility that you're miscalibrated; at least one on how you even decide which scoring rule counts as "legitimate" to measure accuracy with in the first place, since restricting to strictly-proper ones looks a little like reverse-engineering whichever rule spits out the answer you wanted; and at least one pushing on whether stretching this framework to also justify updating rules like conditionalization -- via some "expected accuracy from your prior's point of view" argument -- quietly smuggles back in the same expected-value reasoning that Dutch-book arguments use, undercutting the whole "non-pragmatic" selling point. For each question, tack on a quick follow-up keyed to whatever answer she'd most likely give, so were not just nodding along at the first response she has ready.
