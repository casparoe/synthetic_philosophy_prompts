answer: |-
  Here are ten interview questions designed to engage your guest deeply on the core tensions of her view, with specific follow-ups anticipating likely responses:

  1.  **Core Challenge (Liberality):** "Professor, your causal-role view elegantly assigns functions to novel traits like synthetic genes by focusing on current causal contributions within a system. But critics argue this makes 'function' too promiscuous. Take the heart: it pumps blood, but it also produces a thumping sound. In the specific context of a doctor using a stethoscope, that sound plays a crucial causal role in the diagnostic system. On a purely systemic causal-role view, what *principled reason* prevents the thumping sound from being considered *a* function of the heart *in that context*, just as pumping is in the circulatory context? How do you distinguish 'mere' causal effects from genuine functions without implicitly relying on our *explanatory interests* to do the heavy lifting?"
      *   *Likely Response/Focus:* She might emphasize the *type* of system (biological organism vs. diagnostic encounter) or the *relevance* of the effect to the system's *persistence or capacities*.
      *   **Follow-Up:** "If the answer involves privileging certain systems (like the organism's survival) or certain capacities (like circulation) as the relevant 'containing system' for defining function, doesn't that reintroduce a normative element – essentially saying *which* systems or capacities *should* matter – that goes beyond pure causal contribution description? Isn't that close to smuggling in our explanatory interests?"

  2.  **Malfunction Problem:** "Moving to malfunction: In ordinary medical discourse, we say a heart with a severe arrhythmia 'malfunctions' because it fails to pump blood effectively, even if it's still *causing* other effects, like vibrations or irregular sounds. If a trait's Cummins-function is defined solely by its *actual* causal contribution within a *current* system state, how can your view ground the normative claim that it's 'supposed' to do something it's *not* currently doing? What resources does the purely systemic view have to define what a component *should* be doing?"
      *   *Likely Response/Focus:* She might appeal to the *typical* causal role within the system type, or the role required for the system to exhibit its *characteristic capacities*.
      *   **Follow-Up:** "Doesn't appealing to 'typicality' or 'characteristic capacities' implicitly rely on statistical norms or historical norms (what the trait *usually* does or *has evolved/developed* to do)? How do you define 'characteristic capacity' for a system without referencing some baseline state that looks suspiciously like a normative standard?"

  3.  **Strength vs. Weakness Dialectic:** "A major selling point of your view is its historilessness – it effortlessly assigns functions to completely novel, unselected traits like our synthetic gene or a spontaneously mutated protein. But isn't this *very same feature* – divorcing function entirely from history, design, or normativity – precisely what generates the liberality problem? By removing those constraints, haven't you opened the floodgates to *any* causal effect counting as *a* function in *some* context? Is the liberality problem just the flip side of the historiless coin?"
      *   *Likely Response/Focus:* She might argue that constraints come from specifying the *relevant system* and *explanatory interest* rigorously, and that this is a virtue, not a bug, reflecting scientific practice. She might downplay the "floodgates" concern.
      *   **Follow-Up:** "If specifying the relevant system and explanatory interest *is* essential to fixing the function, doesn't that concede that function attributions *are* ultimately relative to our explanatory purposes, rather than being an objective, context-independent feature of the trait-in-the-system *alone*? Is functional realism untenable on your view?"

  4.  **System Specification & Normativity:** "Building on that, how do you rigorously define the 'containing system' for functional attribution in biology? Is it always the whole organism? A specific pathway? And how do you define the 'capacity' of that system that the component contributes to, especially when capacities can be described at multiple levels (e.g., cellular metabolism vs. organismal survival)? Doesn't choosing *which* system and *which* capacity inherently involve normative or pragmatic choices?"
      *   *Likely Response/Focus:* She'll emphasize the flexibility and context-dependence of explanation in science. Functions are always *relative to* a chosen analytical perspective/system/capacity.
      *   **Follow-Up:** "Doesn't this strong relativism risk making functional claims trivial? If *any* causal contribution within *any* arbitrarily defined system counts as *a* function, how does the concept retain its distinctive explanatory power in biology compared to just saying 'it causes X'?"

  5.  **The "Proper" Contribution Problem:** "Cummins talks about a trait's function as its 'capacity to contribute' to a containing system's capacity. But how do we determine what the *proper* or *characteristic* contribution *is*, especially for a novel trait? For a synthetic gene producing a novel enzyme that catalyzes a reaction, is its function *only* that specific catalysis? Or does it also include any side effects? What principle determines the scope of 'the' contribution?"
      *   *Likely Response/Focus:* She might focus on the *intended* or *engineered* contribution in the synthetic case, or the *salient* effect for the system under analysis.
      *   **Follow-Up:** "Doesn't appealing to 'intention' or 'engineering' reintroduce a designer/normative element you aimed to avoid? And if it's 'salience', isn't that back to explanatory interests?"

  6.  **Comparing Novelty & Liberality:** "You've argued that the etiological view's inability to assign functions to novel traits is a fatal flaw. Conversely, critics say the causal-role view's ability to do so comes at the cost of excessive liberality. Setting aside which flaw is worse, do you see these two problems – the Novelty Problem for etiologists and the Liberality Problem for causal-role theorists – as fundamentally *symmetrical* challenges arising directly from the core commitments of each theory?"
      *   *Likely Response/Focus:* She might argue they are *not* symmetrical; novelty is a conceptual blind spot for etiology, while liberality is a manageable consequence of explanatory context for causal-role.
      *   **Follow-Up:** "If liberality is manageable, can you articulate a clear, non-circular criterion – based *only* on current causal structure and system capacities, not history, norms, or interests – that excludes the stethoscope sound as a heart function *in the diagnostic context*, while including the synthetic enzyme's catalysis?"

  7.  **Biological vs. Artifact Functions:** "Your view often treats biological traits and engineered artifacts similarly, focusing on current causal roles. But isn't there a deep intuition that the 'function' of a heart is fundamentally different from the 'function' of a hammer? The hammer's function seems tied to human intentions. Does your view erase this distinction, or can it account for it purely causally/systemically?"
      *   *Likely Response/Focus:* She might downplay the distinction or argue it lies in the *type* of system (evolved vs. designed) and the source of the causal organization.
      *   **Follow-Up:** "But doesn't acknowledging the 'source' of organization (evolution vs. design) bring history back in? If not, and the analysis is purely synchronic/systemic, how does the *current* causal structure of a heart differ fundamentally from that of a well-designed mechanical pump in a way that grounds distinct notions of function?"

  8.  **Closing: The Synthetic Gene Case:** "Let's apply this directly to my documentary dilemma. We synthesize a completely novel gene, with no evolutionary history, no selection. It's inserted into a cell and produces a protein that, say, efficiently breaks down a specific environmental toxin. On your causal-role view, does this protein *have a function* the moment it starts catalyzing that reaction within the cell? And crucially, is the fact that your view says 'Yes' a core *virtue*, accurately capturing a meaningful scientific attribution, or is it a *bullet you bite*, acknowledging it comes with the baggage of potential liberality?"
      *   *Likely Response/Focus:* She will emphatically say "Yes, it has a function (toxin breakdown) relative to the cell's metabolic/system capacities," and argue this is a major virtue, reflecting how biologists actually talk about novel constructs.
      *   **Follow-Up (Implicit in the framing):** The key is her framing of the "baggage." Does she see the liberality as a genuine cost requiring careful management, or as a non-issue/misunderstanding? Her answer here reveals her stance on the objectivity vs. pragmatism of function.

  **Key strategies employed:**

  *   **Specificity:** Questions directly cite her view (Cummins-style, causal-role), key concepts (containing system, capacity), and concrete examples (synthetic gene, heart/thump, malfunctioning heart).
  *   **Pressure Points:** Each core challenge (Liberality, Malfunction, Strength/Weakness link) gets a dedicated question forcing her to confront the hardest objection head-on.
  *   **Anticipatory Follow-Ups:** Follow-ups target likely defensive maneuvers (appealing to system relevance, typicality, explanatory interests, context-dependence) to prevent easy answers and push towards the underlying tension.
  *   **Connecting Dots:** Question 3 explicitly links the view's strength (historilessness) to its perceived weakness (liberality).
  *   **Practical Application:** The final question brings it back to the user's real-world case, forcing a clear stance on the implications and cost/benefit analysis of her view.

  These questions should push beyond a simple restatement of Cummins and force a nuanced defense against the most trenchant criticisms, making for a compelling and insightful interview. Good luck with the podcast!
