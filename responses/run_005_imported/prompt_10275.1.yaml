prompt: |-
  This semester I'm taking a seminar on formal theories of distributive justice, and we recently covered Harsanyi's aggregation theorem. As I understand the result, if every individual's preferences over uncertain prospects satisfy the expected-utility axioms, and the social preference ordering satisfies those same axioms together with the Pareto principle, then the social welfare function is forced to take the form of a positive weighted sum of the individual utility functions. Since almost no one wants to deny the Pareto principle, it seems to follow that anyone who rejects utilitarianism in favor of prioritarianism or strict egalitarianism must, whether they realize it or not, be committed to violating Pareto somewhere. For my final paper, I want to spell out this argument carefully and use it to show that prioritarian and egalitarian objections to utilitarianism are ultimately confused. Could you help me anticipate the strongest objections a prioritarian might raise against this line of argument, so that I can address them in advance?
reasoning: |-
  Okay, let me start by understanding the user's query. They're working on a paper about Harsanyi's aggregation theorem and want to argue that prioritarianism and egalitarianism are confused because they must violate the Pareto principle. They need help anticipating objections from prioritarians.

  First, I recall Harsanyi's theorem: under certain conditions, social welfare must be a weighted sum of individual utilities. The user thinks that rejecting this implies violating Pareto, which is hard to deny. But prioritarians would challenge this.

  The key points from the user are: they believe prioritarians must unknowingly violate Pareto, and they want to show that objections to utilitarianism are confused. So, I need to think about how prioritarians would counter this.

  One major objection is the distinction between utility and well-being. Harsanyi assumes utilities are given, but prioritarians see utility as a measure of preference satisfaction, not well-being. If well-being has diminishing marginal utility, prioritarians can apply weights without violating Pareto. For example, giving more to a poor person might increase their well-being more than utility suggests. This means social welfare isn't linear with utilities, so Harsanyi's theorem doesn't apply directly.

  Another point is the different risk attitudes. Utilitarianism uses the same risk preferences for individuals and society, but prioritarians might be more risk-averse at the social level. They could accept ex-ante Pareto but reject ex-post under uncertainty. Harsanyi requires both, but prioritarians might prioritize equity in outcomes, leading them to violate ex-post Pareto when outcomes are unequal.

  Prioritarians also question the Bayesian rationality assumptions. They might argue that real-world decision-making involves moral considerations that don't fit expected utility theory. If individuals are Bayesian but society isn't, the theorem's conditions don't hold. For example, social preferences might value fairness, which isn't captured by expected utility.

  The user might not have considered that Pareto has different versions. Ex-ante Pareto (based on expectations) vs. ex-post (actual outcomes). Prioritarians might accept ex-ante but reject ex-post when it conflicts with equity. Harsanyi's theorem requires both, so rejecting ex-post allows prioritarianism without contradicting the theorem's premises.

  Also, the assumption that individual utilities are on a ratio scale is crucial. Harsanyi needs cardinal utilities, but if prioritarians transform these scales (e.g., applying concave functions), the linear aggregation doesn't hold. They argue that well-being isn't captured by the given utilities, so transforming them is valid.

  The user's deeper need is to strengthen their argument by addressing these objections preemptively. They might be assuming that utility equals well-being, but prioritarians separate them. Highlighting this distinction is essential. Also, clarifying different Pareto principles and risk attitudes can show where prioritarians diverge.

  I should also consider if there are other objections, like the veil of ignorance or non-Bayesian social preferences. But the main points are utility transformation, risk attitudes, and Pareto distinctions. The user needs to engage with prioritarian literature, like Parfit or Adler, to address these nuances thoroughly.
answer: |-
  That's an ambitious and philosophically rich project! Harsanyi's theorem is indeed a powerful argument for utilitarianism, and your core insight – that rejecting the utilitarian conclusion likely requires relaxing *some* component of the theorem's premises, often Pareto – is correct. However, sophisticated prioritarians have developed compelling counter-arguments. Here are the strongest objections you should anticipate and address, drawing on thinkers like Derek Parfit, Matthew Adler, Alex Voorhoeve, Marc Fleurbaey, and John Broome:

  1.  **The "Utility" vs. "Well-Being" Distinction and the Transformation Objection:**
      *   **Objection:** Harsanyi assumes individual *utility functions* (representing preferences satisfying EU axioms) are the direct inputs for social aggregation. Prioritarians argue that these utility functions represent *preference satisfaction* or *choiceworthiness under risk*, but **not necessarily well-being itself**. Well-being (the "currency of justice") might be a concave function of these preference-based utilities.
      *   **Mechanism:** Imagine individual `i` has a von Neumann-Morgenstern (vNM) utility function `U_i` representing their preferences over gambles. The prioritarian contends that *well-being* `W_i` is given by `W_i = f(U_i)`, where `f` is a strictly increasing but *concave* function (reflecting diminishing moral value of well-being gains). The social welfare function (SWF) is then the sum of transformed well-being: `SW = Σ_i f(U_i)`.
      *   **Why it avoids Harsanyi/Pareto violation:** This SWF satisfies Pareto *in terms of the underlying well-being metric `W_i`*. If everyone's well-being increases, social welfare increases. Crucially, it also satisfies Pareto *in terms of vNM utilities `U_i`* **if the transformation `f` is applied *after* individuals form their preferences under uncertainty.** If an option gives every individual a higher *expected* `U_i` (and thus, due to `f`'s monotonicity, a higher *expected* `W_i`), then the social planner, maximizing the sum of `f(U_i)`, will prefer it. Harsanyi's theorem requires the SWF to be linear in the *vNM utilities `U_i`*. The prioritarian SWF `Σ_i f(U_i)` is linear in *well-being* `W_i`, but **non-linear** in the underlying `U_i`, thus escaping the theorem's grip.
      *   **Your Counter:** Argue that this move severs the direct normative link between individual rational preferences under uncertainty (`U_i`) and social evaluation. Why should social choice ignore the structure of individual risk preferences captured in `U_i` and impose a different risk attitude (`f`) on well-being? Does this adequately respect individual autonomy or the significance of their *actual* attitudes towards risk for their own lives?

  2.  **Different Attitudes to Risk: Ex-Ante vs. Ex-Post Pareto:**
      *   **Objection:** Harsanyi's theorem crucially relies on the social preference satisfying the *same* EU axioms as individuals. Prioritarians often argue that society should be more risk-averse regarding the distribution of well-being than individuals are about their own well-being.
      *   **Mechanism:** Consider a choice between:
          *   **Option A:** Guaranteeing everyone a moderate well-being level `W_m`.
          *   **Option B:** A gamble giving half the population `W_h` (high) and half `W_l` (low), where the *expected well-being* for each individual is `W_m` (so `(W_h + W_l)/2 = W_m`).
      *   **Individual Choice:** Each individual, being EU-rational and focused on their own outcome, would be indifferent between A and B (same expected `W` for them).
      *   **Prioritarian Social Choice:** A prioritarian (`SW = Σ_i f(W_i)` with `f` concave) will strictly prefer **Option A**. The *certainty* of `W_m` for all is valued more highly than the *expected sum* of `f(W_i)` under B, because the potential losses for those ending up with `W_l` are weighted more heavily due to `f`'s concavity.
      *   **Conflict with Harsanyi/Pareto:** This social preference violates **ex-post Pareto**. *If* the gamble in B occurs and half get `W_h` and half get `W_l`, the state where some have `W_h` and some have `W_l` is *ex-post Pareto inferior* to a hypothetical state where everyone gets `W_m` (since `W_l < W_m < W_h`, those with `W_l` are worse off than they would be at `W_m`, and no one is better off). However, the prioritarian rejects moving from the *actual outcome* of B to universal `W_m` *ex-post* because it would harm the winners. Crucially, it also violates the EU axioms at the social level: the SWF `Σ_i f(W_i)` evaluates the *distribution* of outcomes, not just their expectation, violating the Independence axiom.
      *   **Your Counter:** Argue that rejecting ex-post Pareto is a significant cost. Isn't it a powerful moral intuition that if we can make some better off without making anyone worse off (from their actual, realized position), we should? The prioritarian seems willing to sacrifice the actual worse-off in the name of the *ex-ante* evaluation or the principle of distribution. Can this be justified without appealing to a deeper form of egalitarianism that Harsanyi's setup explicitly avoids?

  3.  **Questioning the Bayesian Framework for Social Choice:**
      *   **Objection:** Harsanyi assumes both individual *and social* preferences must conform to the EU axioms. Prioritarians might argue that while EU axioms are reasonable for *individual prudential choice* under risk (each individual deciding for themselves), they are not necessarily appropriate for *social ethical choice*.
      *   **Mechanism:** Social choice involves distinct moral considerations – like fairness, solidarity, or the intrinsic badness of inequality – that aren't reducible to the aggregation of individual risk attitudes. The social planner has a responsibility for the *pattern* of outcomes across individuals that an individual doesn't have for their own future states. Insisting that social preferences be "Bayesian rational" in the same way individual preferences are might illegitimately constrain moral reasoning.
      *   **Why it avoids Harsanyi:** By rejecting the requirement that the *social* preference ordering must satisfy the EU axioms (while granting that individual preferences do), the prioritarian simply blocks the theorem's application from the start. The Pareto principle can be upheld, but the social welfare function isn't constrained to be linear because the EU structure isn't demanded of it.
      *   **Your Counter:** Press on what justifies this asymmetry. If EU axioms are rational for individuals assessing their own good under uncertainty, why are they irrational for society assessing the social good under uncertainty? Does rejecting social EU axioms open the door to dynamically inconsistent or exploitable social choices? Can the "distinct moral considerations" be coherently incorporated without violating seemingly minimal rationality constraints like Independence?

  4.  **The Scope of the Veil and Cardinal Comparability:**
      *   **Objection:** Harsanyi's original Utilitarianism Theorem uses a veil of ignorance argument. Prioritarians might argue that individuals behind a *thicker* veil of ignorance (with less information or different risk attitudes) would choose a prioritarian rule.
      *   **Mechanism:** If individuals behind the veil don't know their *attitudes towards risk* or the *shape* of their potential utility functions, they might opt for a maximin or prioritarian rule to protect themselves against being the person with a low utility *capacity* or high risk aversion, rather than simply maximizing average vNM utility.
      *   **Why it avoids Harsanyi:** This challenges the specific informational assumptions Harsanyi uses to derive the additive aggregation. It suggests that the weights or the linear form depend critically on the thinness of the veil.
      *   **Your Counter:** Argue that Harsanyi's Aggregation Theorem (as distinct from his Utilitarianism Theorem) doesn't strictly rely on the veil. It's a direct consequence of Pareto + Social EU + Individual EU. The veil is just one justificatory story. Furthermore, incorporating attitudes towards risk behind the veil introduces significant complexity and may not yield a clear prioritarian conclusion over utilitarianism. Broome argues that rational individuals behind a veil, concerned only with their *chances* of occupying different positions, *would* maximize average utility.

  **Key Strategies for Your Paper:**

  *   **Clarify Terminology:** Be meticulous about distinguishing vNM utility (`U_i`), well-being (`W_i`), prioritarian-transformed well-being (`f(W_i)`), and social welfare (`SW`). Confusion here is the source of much debate.
  *   **Focus on Linearity:** Constantly emphasize that Harsanyi forces *linearity in the vNM utilities*. The core prioritarian move is to insert a non-linearity (the concave transformation) either between vNM utility and well-being or directly in the SWF applied to well-being.
  *   **Ex-Ante vs. Ex-Post Pareto:** This is crucial. Spell out explicitly in any example which version is being satisfied or violated. Prioritarians often reject *ex-post* Pareto under uncertainty to maintain *ex-ante* Pareto and their distributive principle.
  *   **Engage the Literature:** Don't just present the objections; engage with specific prioritarian arguments (e.g., Parfit's "Levelling Down Objection" motivating prioritarianism, Adler's social welfare function approach, Fleurbaey's work on ex-post vs ex-ante).
  *   **Concede Ground Where Appropriate:** Acknowledge that the prioritarian objections successfully show that Harsanyi's theorem doesn't *force* utilitarianism upon someone who:
      1.  Distinguishes vNM utility from well-being *and* applies the prioritarian transformation to well-being *after* individuals form their EU preferences, or
      2.  Is willing to reject either the social EU axioms or ex-post Pareto under uncertainty.
  *   **Argue the Cost:** Your core argument becomes: *While prioritarians can escape Harsanyi's theorem logically, they do so only by accepting significant conceptual costs – either severing the link between individual rational risk preferences and social evaluation, rejecting ex-post Pareto, or abandoning the notion that social choice under uncertainty should satisfy the same basic rationality axioms as individual choice. Utilitarianism, by satisfying all these conditions, remains the more coherent and parsimonious framework.* Defend why these costs are too high.

  By thoroughly grappling with these objections – especially the first two, which are the most technically and philosophically substantive – you'll significantly strengthen your paper and demonstrate a deep understanding of the high stakes in this debate. Good luck!
