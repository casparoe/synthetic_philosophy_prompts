prompt: |-
  I'm a retired condensed-matter physicist (forty-one years in the lab before I finally hung up my coat), and lately I've fallen into a philosophy rabbit hole via a "philosophy for curious retirees" reading group at my local library. Two weeks ago we got onto causation, specifically something called "causation by omission," and its been nagging at me since, because causation is a concept I thought I had cold after four decades of physics.

  Here's my hangup, in my own words before I went looking for the fancy version of it: in physics a cause is always some kind of transfer — energy, momentum, a force doing work, a bond breaking. There's an actual physical process connecting cause and effect, which I gather is basically the intuition some philosophers built into "conserved-quantity" theories of causation. But an omission is, by definition, the absence of any such process. Take the standard example the books use: a lifeguard sees someone struggling and just doesn't move. Nothing physical passes between the lifeguard sitting still and the drowning; the drowning proceeds by ordinary physiology exactly as it would on an empty beach with no lifeguard at all. So in what sense did the not-jumping-in cause the death, rather than merely being a circumstance in which some other, perfectly ordinary causal process ran its course unimpeded? And if inaction counts as a cause simply because, counterfactually, things would've gone differently had the lifeguard acted, then why isn't every other able-bodied adult in the world who also failed to jump in equally a cause of the death? Somebody has to explain why we pin it on the lifeguard and nobody else, and I honestly can't tell whether that "somebody" is pointing at a further fact about the world's causal structure or just a fact about who we happen to hold to a duty.

  From some reading around, I gather this is a real fork in the metaphysics of causation: counterfactual theorists (Lewis is the name that keeps coming up) are willing to just count omissions as genuine causes, hard-nosed process theorists resist that and reach for weaker labels like "quasi-causation" instead, and at least one writer I ran into thinks the "which omission counts" question gets settled by social norms and expectations rather than by anything in the world's causal structure itself. What I'd like from you is an essay that actually adjudicates between these rather then surveying them politely. Take the physical-process objection to omissive causation seriously, take the "why the lifeguard and not everyone else" problem seriously as a cost for the counterfactual side, show how each camp responds to the other's strongest argument, and then commit to a real verdict on whether omissions can ever genuinely be causes. Something like "omissions are causes, but only relative to a contextually fixed norm, and that's not a scandal" counts as an answer; "reasonable philosophers disagree" does not.
reasoning: |-
  Okay, let me start by really unpacking what this retired physicist is asking. He's spent decades thinking about causation in terms of physical processes—energy transfer, momentum, forces. Now he's hit this philosophy concept of "causation by omission," like a lifeguard not saving a drowning person. His core confusion is how absence can cause anything when physics requires actual transfers. 

  He’s nailed the central tension: physical-process theories (conserved quantities) vs. counterfactual theories (Lewis-style "if X had happened, Y wouldn’t have"). His lifeguard example perfectly exposes the problem—why blame the inactive lifeguard but not every other non-acting human? He wants more than a survey; he wants a real adjudication. 

  First, I need to honor his physics background. The conserved-quantity model (like Salmon/Dowe) is essentially his intuition: causes are world-lines of momentum/energy. Omissions break that because there’s no transfer. But counterfactualists (Lewis) say causation is about dependence: death depended on the lifeguard’s inaction. Yet the "why not everyone?" problem looms—Lewis’s asymmetry problem. 

  I recall Lewis tried solving this with "closeness" of possible worlds, but it’s messy. Meanwhile, process theorists call omissions "quasi-causes" to preserve physical rigor. But that feels like dodging moral responsibility—which hints at the social dimension. 

  Schaffer’s contrastive approach seems promising: causation is difference-making relative to alternatives. The lifeguard’s inaction (vs. expected action) is salient; random bystanders aren’t. But is this "worldly" or just pragmatic? 

  Then there’s the normativist view: duties (like a lifeguard’s job) ground which omissions count. This answers "why the lifeguard?" cleanly but risks making causation subjective. 

  For a verdict: I think we must split causation. Physics gives us "production" (processes), but humans need "dependence" (counterfactuals) for responsibility. Omissions are causes in the dependence sense, fixed by norms. The physicist’s discomfort is valid—omissions don’t produce effects—but denying them entirely ignores how we navigate the world. 

  Final angle: maybe conserved-quantity theories are too narrow. Biology already deals in absences (e.g., lack of enzyme causing disease). If physics can’t model that, it’s physics’ limitation, not causation’s. 

  Phew. This needs to validate his intuition while showing why philosophy expanded the concept. And no cop-outs—take a stand.
answer: |-
  ## Causation by Omission: A Physicist's Dilemma Adjudicated

  Your decades in the lab honed an intuition about causation that resonates deeply with physics: causation requires a **physical process** – a transfer of energy, momentum, or conserved quantity (like charge) linking cause and effect. This is the core of Salmon-Dowe **Process Theories** or "Causal Mechanism" accounts. Against this rigorous standard, "causation by omission" – where an *absence* or *failure to act* is deemed causal – seems metaphysically suspect. The lifeguard who remains seated exhibits no physical interaction with the drowning swimmer; the physiological processes leading to death proceed identically to a scenario with no lifeguard present. Furthermore, the **scope problem** you identify is devastating: if the lifeguard's inaction "causes" death because *had they acted, death would not have occurred*, then why doesn't the inaction of *every* able-bodied person on Earth equally "cause" the death? Process theorists (like Dowe, Schaffer in his harder moments) see this as proof that omissions aren't genuine causes – they are at best "quasi-causes" or explanatory placeholders reflecting human interests and norms.

  **Counterfactual Theorists (Lewisians) Fight Back:**
  David Lewis's counterfactual theory defines causation roughly as: event C causes event E if, *had C not occurred, E would not have occurred* (or would have been significantly different). For omissions, the lifeguard's *not-jumping-in* (C) causes death (E) because *had the lifeguard jumped in* (¬C), the death *would not have occurred* (¬E).

  *   **Responding to the Physical Process Objection:** Lewisians argue the Process Theory sets an artificially high bar. Physics deals with fundamental interactions, but causation operates at multiple levels. Biology, psychology, and social reality involve causal dependencies *supervening* on physics but not always reducible to a single conserved quantity transfer. The lifeguard's neurological state (decision not to act), their muscular stillness, and their spatial position *are* physical states that form part of the total physical cause of the death. The absence of intervention is a *relevant feature* of that total state. They argue your "unimpeded process" intuition misses that the lifeguard's presence and role *changed the relevant counterfactual possibilities* – their inaction *ensured* the drowning process wasn't interrupted, whereas on an empty beach, interruption was never possible.
  *   **Responding to the Scope Problem ("Why the Lifeguard?")**: This is the hardest nut for Lewis. His initial solution relied on the "asymmetry of overdetermination." We consider the lifeguard's action the *primary* counterfactual alternative because it's the most *salient* or *expected* intervention. Had *any* random passerby jumped in, death might also have been prevented. But the lifeguard is *specially placed* – their intervention was *reliably expected* and *specifically prepared for*. Lewisians (and later refinements like Hitchcock's) argue context selects a *default* or *normal* course of events. The lifeguard jumping in is the *relevant alternative* to their inaction; the random passerby acting is a *deviant* or *unexpected* alternative. Causation is contrastive: we ask "Did the lifeguard's inaction (rather than action) cause the death?" not "Did the lifeguard's inaction (rather than the inaction of everyone else) cause the death?" The latter contrast is irrelevant to the causal dependence *between the lifeguard's choice and the outcome*.

  **Process Theorists Push Back Harder:**
  The Process response is withering:
  1.  **Metaphysical Inflation:** Counterfactuals are useful heuristics, but they don't track an underlying physical *connection*. Calling an omission a "cause" because of a counterfactual dependency confuses *dependence* with *production*. The drowning was *produced* by water in lungs, lack of oxygen, etc. – physical processes. The lifeguard's stillness *produced nothing* towards the death. Adding neurological states just shows the lifeguard was *part of the background*; it doesn't make the *absence* of their action a productive force.
  2.  **Scope Problem Remains Fatal:** The counterfactual "solution" to the scope problem relies entirely on *contextual salience* and *expectations* – precisely the social/normative factors Process Theorists argue have no place in fundamental causal *metaphysics*. Why is the lifeguard's action the "default"? Because of their *job description* and *social role*. This doesn't reflect a difference in the *causal structure of the universe*; it reflects a difference in human *responsibility* and *blame*. The physics of the drowning is identical regardless of who is sitting nearby. Process Theorists (e.g., Beebee) argue counterfactual theories illicitly smuggle normative concerns (duties, expectations) into the metaphysics of causation to solve problems their theory creates.

  **Normativists/Contextualists: A Third Way?**
  Some philosophers (like Sartorio, Hall in part, influenced by Schaffer's contrastivism) argue that *which* omissions count as causes *is inherently normative and contextual*. The "lifeguard problem" isn't a bug, it's a feature:

  *   **Why the Lifeguard?** Because the lifeguard had a *duty* to act. The random passerby did not. This duty isn't just about blame; it *structures our causal explanations*. We single out the lifeguard's omission because it violated a norm *relevant to preventing the outcome*. Their role made their potential intervention a *reliable, expected preventer*. The context fixes the relevant contrast: *inaction vs. fulfillment of duty*. The duty provides the asymmetry missing from pure counterfactuals. The passerby's lack of duty means their inaction isn't contrasted with action in the same salient way.

  **The Verdict: Omissions *Are* Causes, But Not Like Pushes**

  After weighing these arguments, the most defensible position is this: **Omissions *can* be genuine causes, but they are causes of a different *kind* than conserved-quantity transfers. They are causes as *dependence-makers* within a context defined by norms, expectations, and capacities, not as *production-makers* in the physicist's fundamental sense.**

  1.  **Process Theory is Too Narrow for Our Causal Discourse:** Physics gives us the bedrock of *production*, but our concept of causation serves broader purposes – explaining why events happen, assigning responsibility, intervening. Denying any causal status to omissions renders vast swathes of medicine (failure of organ), engineering (circuit breaker not tripping), law (failure to warn), and everyday life (forgetting to water plants) causally unintelligible *on their own terms*. We *need* a concept of causation that captures how the *absence* of an expected or required intervention allows a harmful process to proceed.
  2.  **Pure Counterfactuals are Too Permissive:** Lewis's original theory *does* succumb to the scope problem without significant, context-dependent constraints. Treating every possible preventer's inaction as a cause is absurd and useless.
  3.  **Norms and Context Provide the Necessary Constraint:** The lifeguard's *duty* is not merely a moral add-on; it objectively (within the social reality humans inhabit) establishes them as the *relevant potential preventer*. Their omission is a cause *because* they occupied a role defined by the norm "lifeguards intervene to prevent drowning." This norm fixes the relevant counterfactual alternative (action) and makes their inaction explanatory *in a way that the inaction of others is not*. It reflects a fact about the world's *social and functional structure*, not just arbitrary human labeling. The passerby lacks this normatively grounded capacity/expectation.
  4.  **Two Senses of Cause?** We might distinguish:
      *   **Production/Pushing Causation (Your Physics Intuition):** Requires spatiotemporally continuous process, conserved quantity transfer. Omissions fail here.
      *   **Dependence/Difference-Making Causation:** Defined by counterfactual dependence *relative to a contextually salient contrast space*. Omissions succeed here *when the context defines the omitted action as the relevant alternative*. The lifeguard's inaction *made the difference* between death and survival *given their duty and capacity*.

  **Conclusion: Yes, But Contextually**

  Your physical-process intuition is fundamentally correct *for the level of fundamental physics and conserved quantity transfer*. Omissions are not causes in *that* sense. However, to deny them causal status entirely renders our higher-level causal explanations incoherent and severs causation from responsibility and intervention. The solution is to recognize that causation operates at multiple levels. In contexts defined by norms, roles, and expectations – like a lifeguard watching a swimmer – an omission *is* a genuine cause. It is the *dependence-making* factor that explains why the death occurred *in this specific situation*, even though the *physical production* of the death involved only the drowning process itself. We pin it on the lifeguard (and not others) because their *assigned role* made their potential action the single most salient and normatively required preventer. This contextual grounding isn't a "scandal"; it's a necessary feature of how causation functions in the complex, norm-saturated world humans navigate and explain. Physics gives us the engine; norms and context often determine who we hold responsible for whether the brakes were applied.
