answer: |-
  ## Eulogy for a Public Defender: Holding the Line Against the Tide

  Good morning. Thank you all for being here to honor my father. To his colleagues from the public defender’s office – seeing you here means more than I can say. And to our family and old friends, thank you for the lifetime of love and support you gave him. He was a man who showed up – for his family, for his friends, and for four decades, day after day, for people most of us never see, in a courtroom most of us hope to never enter.

  Dad wasn’t a man for easy platitudes. He had a clear-eyed view of the world, especially the world he navigated professionally. And there was this one idea… this persistent, almost haunting thought he’d bring home, especially after a particularly tough week. He’d sit down at the dinner table, maybe push his food around a bit, and eventually, it would come out, sometimes wryly, sometimes with a weary sigh. He’d talk about justice and force. How justice without the power to enforce it is ultimately helpless. How force, unchecked by justice, is pure tyranny. And then the kicker: since we humans seem spectacularly bad at making what’s *just* actually *strong*, we’ve settled for the far easier, far uglier trick of simply calling whatever *is* strong, ‘just’.

  For years, I just thought it was Dad being Dad – wrestling with the frustrations of his job in his own philosophical way. It was only a few years ago I discovered he was quoting Blaise Pascal, a 17th-century thinker. But the fact that he didn’t coin the phrase himself? That almost makes it more powerful. Because it meant this wasn't just his personal gripe; it was a profound, centuries-old observation about the brutal mechanics of power that he saw playing out, raw and unfiltered, every single day in that courtroom.

  It *is* a bleak thought. Unflinchingly so. And Dad saw that bleakness up close. He saw the immense, often crushing, force of the state brought down on individuals – disproportionately on the poor, the marginalized, the struggling. He saw how easily that force could drape itself in the robes of "justice," while the people he stood beside often had nothing but their own vulnerability and his voice to push back against it. He knew the deck was stacked. He knew the tide was strong.

  **But here’s the thing, the essential truth about my father that this Pascal idea reveals:** He looked that bleakness square in the face… and he showed up anyway. For forty years.

  He didn’t recite that passage as a surrender. He recited it as a diagnosis. And his entire life’s work was the treatment. If the world’s tragic flaw is that it sanctifies power instead of infusing justice with strength, then his answer was to step into that breach. He couldn’t single-handedly make force just – that’s a task for societies, for revolutions, for the slow grind of history. But what he *could* do, what he *chose* to do, day after relentless day, was lend justice whatever force he possessed.

  He lent it the force of his mind – meticulously dissecting cases, finding flaws in procedure, understanding the law inside and out, even without a university degree, proving brilliance isn't conferred by diplomas. He lent it the force of his voice – speaking clearly, passionately, sometimes fiercely, for those whose voices were ignored or silenced. He lent it the force of his presence – showing up, bearing witness, forcing the system to at least *look* at the human being standing before it, insisting they be seen not just as a case number, but as a person. He lent it the force of his empathy – understanding the stories, the struggles, the broken roads that led people into that courtroom, reminding everyone that context matters.

  He knew he wouldn’t always win. He knew the force arrayed against his clients, against the *idea* of equal justice, was immense. But he understood that without someone like him standing there, lending justice *his* force – his knowledge, his voice, his effort, his sheer stubborn commitment – the imbalance Pascal described becomes absolute. Tyranny, dressed as law, wins by default.

  To his colleagues here: You know this. You’ve lived it alongside him. You’ve seen him do it. You’ve felt the weight of that Pascal truth, and you’ve also witnessed the quiet, profound dignity of refusing to accept it as the final word. You know he didn’t soften it, and he wouldn’t want us to soften it now. He fought *because* it was hard, *because* the force was uneven, *because* calling power "justice" was the oldest trick in the book.

  To our family and friends: You heard him talk about “the Pascal thing” for years. This is what it meant to him. It wasn’t cynicism; it was clarity. And his response wasn’t despair; it was defiant, persistent action. His courtroom wasn’t just a workplace; it was his chosen ground to contest that ancient, unfair equation.

  Dad’s life answered Pascal’s bleakness not with grand pronouncements, but with relentless, practical humanity. He couldn’t make force just, but he could – and he did – lend justice his own strength. Case by case. Client by client. Year after year. He bent the curve, ever so slightly, away from tyranny and towards something resembling fairness. He held the line. He fought the tide. He ensured that the state’s force, at least when he was in the room, had to answer to the demands of justice.

  That was his answer. That was his life’s work. That is his legacy. It wasn’t powerless. It was powerful beyond measure. Thank you, Dad, for showing us how it’s done. We will miss you more than words can say.
