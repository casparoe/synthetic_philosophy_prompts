prompt: |-
  I'm outlining a novel about two rival AI labs racing toward superintelligence, and while researching it I fell down a rabbit hole on this thing called the "commitment races problem" -- basically the idea that agents rush to lock themselves into aggressive, irreversible bargaining stances early, before they've had time to fully think things through, because whoever commits first and hardest wins the standoff (think of the guy in a game of chicken who visibly throws his steering wheel out the window). Now I can't stop seeing it everywhere, including my own life: my agent wants me to have my lawyer tell the studio optioning my last book that I won't budge an inch on final-cut approval, take it or leave it, no negotiaton. Can you walk me through the most important implications of the commitment races problem for whether that's actually a savvy move, or just a recipe for both sides digging in until the whole deal falls apart?
