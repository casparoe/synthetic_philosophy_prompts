  3. Assess whether the argument shows that no redistributive taxation could be justified within Nozick's own theory.

  The response is broken down into three sections for grading:

  - Wilt Chamberlain reconstruction (0-8 points)
  - Historical vs. patterned distinction (0-6 points)
