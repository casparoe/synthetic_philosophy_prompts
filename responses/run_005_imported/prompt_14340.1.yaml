  a) "This tells against Rawls's difference principle specifically, since it too fixes a pattern (shares tied to the position of the worst-off) that free exchange will inevitably disturb."

  b) "The argument also establishes a positive conclusion: because most actual holdings are patterned by illegitimate acquisitions somewhere in their history, it shows that taxation to rectify those particular injustices remains justified, even where taxation to re-impose a pattern is not."

  Now, the question asks:

  - Does the argument, on its own, show that Rawls's difference principle cannot be stably maintained?
  - Does it show that no redistributive taxation could be justified within Nozick's own theory?

  The student's answers:

  For Rawls: The student says the argument tells against the difference principle because it is patterned and thus will be disturbed by free exchange. This is correct. The Chamberlain argument is meant to show that any patterned principle (including Rawls's) cannot be maintained without continuous interference, hence it is not stable. So the argument does show, on its own, that the difference principle cannot be stably maintained without violating liberty.

  For taxation: The student claims that the argument does not rule out redistributive taxation for rectification of past injustices. This is because Nozick's entitlement theory allows for rectification. The student even says that "most actual holdings are patterned by illegitimate acquisitions" and thus taxation for rectification is justified. This is a point Nozick makes: his theory does allow for redistribution to correct past injustices.

  However, note that the question is: does the Chamberlain argument, on its own, show that no redistributive taxation could be justified? The Chamberlain argument is about the instability of patterns due to liberty. It does not directly address rectification. The student is correct that within Nozick's full theory, redistributive taxation for rectification is justified, but the Chamberlain example by itself does not establish that. The student is using the broader entitlement theory to answer the second part of the question.

