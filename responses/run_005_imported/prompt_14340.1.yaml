  ### 1. Wilt Chamberlain reconstruction (max 8 points)

  The student's reconstruction:
  - Correctly sets up D1 as a just distribution (according to a patterned principle, e.g., equality).
  - Explains that Chamberlain's contract allows him to take 25 cents per ticket from a million fans voluntarily.
  - Notes that this leads to D2, which breaks the pattern.
  - Points out that the transfers are voluntary and thus, by entitlement theory, D2 is just.
  - Concludes that to maintain the pattern, one must either forbid such transfers or continuously redistribute, which interferes with liberty.

  What the student gets right:
  - The core steps of the argument are present and correctly explained.

  What might be missing or slightly off?
  - The student says "the pattern can only be maintained by continuous interference", which captures the idea that liberty upsets patterns. This is correct.

  However, note that the argument is about any patterned principle, not just equality. The student uses equality as an example but then ties it to Rawls. That's acceptable because the example is illustrative.

  Score: The reconstruction is thorough and accurate. I would give full marks: 8/8.

  Comment: "Accurately reconstructs the steps of the Chamberlain example, showing how voluntary exchanges disrupt a patterned distribution and require continuous interference to maintain."

  ### 2. Historical vs. patterned distinction (max 6 points)

  The student's explanation:
  - Defines historical principles (justice depends on how the distribution came about) versus end-result (current time-slice) principles.
  - Defines patterned principles (holdings must track a natural dimension) and notes that end-result principles are patterned because they require a specific structure at a time.
  - Correctly states that Nozick's entitlement theory is historical and unpatterned.

  What the student gets right:
  - The definitions are clear and correct.
  - The independence of the two axes (historical vs. end-result and patterned vs. unpatterned) is implied by the description, though not explicitly stated as independent. However, the student says "sorts ... along two independent axes", so that's good.
  - The distinction between patterned and unpatterned is well explained.

  Potential issue: The student says that patterned principles are like end-result principles because "justice can be read off the current distribution". This is true for end-result patterned principles, but note that a principle can be historical and patterned? Nozick actually argues that all patterned principles are end-result in the sense that they require a particular distribution at a time, regardless of history. The student's phrasing might be a bit too strong, but it's in the spirit of Nozick.

  Nozick's point is that any patterned principle will require continuous intervention to maintain because of voluntary exchanges. The student captures this.

  Score: I think this is a very good explanation. 6/6.

  Comment: "Clear and correct definitions of historical vs. end-result and patterned vs. unpatterned, with accurate characterization of Nozick's entitlement theory."

  ### 3. Evaluation of Rawls and taxation claims (max 6 points)

