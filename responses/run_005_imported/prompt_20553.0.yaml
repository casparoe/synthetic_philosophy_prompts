answer: |-
  Here’s a toast that threads the needle: warm and funny for everyone, philosophically airtight for Priya’s cohort, with a stealthy reef-reference for the philosophers. Aim for 5 minutes with good delivery.

  **(Clink glass, warm smile, eye contact with the room)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], an old friend and former philosophy officemate of Priya’s... and, crucially, someone who escaped that particular labyrinth *before* having to write 300 pages on why love might be an impossible project." *(Light laugh, glance at philosophy table)* "Diego, I promise, I won’t quiz you on Hegel later."

  "Seriously, Priya and Diego, you look incredible. Radiant. And looking at you both, it’s tempting – *so* tempting – to say something grand. Something like, 'You two were destined for each other!' Or, 'You’ve finally found your other half!'"

  *(Pause, look directly at Priya with a knowing smirk, then scan the room)*

  "Priya, however, has made it abundantly clear – only *half*-joking – that if I utter words like 'destiny' or 'other half,' I will be excommunicated from future game nights. Possibly with prejudice." *(Laugh)* "And honestly? She’s right. Because what’s truly amazing about you two isn’t some cosmic guarantee written in the stars. It’s something far more profound, and frankly, more human."

  "Priya spent years wrestling with giants like Sartre, who argued there’s no grand script, no 'human nature' blueprint forcing us down paths. We’re radically free. Every single day, we choose who we are and what we do. Diego... *(turn to Diego, grin)* ...you teach teenagers how elements react under pressure. You know better than most that stability isn’t magic; it’s the result of active choices, careful bonds, constant attention. Things don't just *stay* stable; you make them stable."

  *(Shift tone slightly more earnest)*

  "So, when Priya and Diego say 'I do,' it’s not because the universe *made* them do it. It’s the opposite! It’s two fiercely free people looking out at this vast, uncertain world and saying, 'Okay. You. Me. Let’s build something *together*, deliberately, day by day.' It’s not finding a missing piece; it’s two complete people choosing to create something new. Something neither could have built alone."

  *(Lighten the mood again)*

  "And let’s be honest, their choices are brilliant. Priya, your mind is a lightning storm – intense, illuminating, capable of dissecting the existential weight of a sideways glance." *(Nod to philosophy table)* "Diego, you bring this grounded, patient, joyful energy – you explain complex reactions while somehow making it feel like fun. You balance Bunsen burners *and* teenage chaos. Together? You’re this incredible reaction. Not an inevitable one, but one that creates something uniquely stable and vibrant and warm."

  *(Time for the "Reefs" Nod - Deliver this smoothly, as a natural metaphor)*

  "Now, anyone who’s been in love, or even just watched a rom-com, knows it’s not always smooth sailing. Love’s this incredible voyage, but it navigates some pretty **tricky currents**. You’ve got to be alert, you know? Avoid those hidden reefs where you might run aground – places where you might forget the other person isn’t just a character in *your* story, or where you might try too hard to *be* just a character in theirs..." *(Subtle eye contact with philosophy table, slight emphasis on "reefs" and the concepts)* "...because the real magic happens when both navigators are fully present, fully themselves, freely choosing the shared course *again* and *again*."

  *(Pivot back to universal warmth)*

  "And that’s what’s so moving about Priya and Diego. You see it in how Priya’s eyes light up when Diego explains some fascinating chemical quirk she’s never heard of. You see it in how Diego beams with pride listening to Priya talk about her work, even if the finer points of 'the Look' sail gloriously over his head. *(Look at Diego)* 'Bad faith,' buddy? Just nod and smile, it’s working." *(Laugh)*

  "They don’t assume. They don’t take for granted. They *choose*. They choose curiosity about each other's worlds. They choose laughter. They choose patience. They choose to show up, fully themselves, every single day. That’s not destiny; that’s courage. That’s commitment. That’s the kind of love that builds a future, brick by intentional brick."

  *(Raise glass higher)*

  "So, let’s raise a glass to Priya and Diego! Not to fate, or stars, or finding missing halves. But to two gloriously free, complex, and wonderful individuals who keep looking at each other, across the breakfast table or the chaos of life, and freely, bravely, joyfully saying: 'Yes. You. Again. Today. And tomorrow.'"

  "To your radical, beautiful, endlessly chosen adventure together. Cheers!"

  **Why it works:**

  1.  **Acknowledges Priya's Demand:** Directly addresses her warning about "destiny" and "other half," framing it humorously but seriously.
  2.  **Explains Freedom Accessibly:** Uses Diego's chemistry ("active choices," "careful bonds," "stable compound") to explain radical freedom and commitment in terms everyone understands. "Build together," "create something new" are warm, active verbs replacing passive destiny.
  3.  **The "Reefs" Nod:** The line about "tricky currents" and "hidden reefs" is the stealth bomb. Non-philosophers hear a lovely, slightly poetic metaphor for relationship challenges. The philosophy table hears *exactly* Sartre's reefs of sadism/masochism and objectification ("forget the other person isn’t just a character in *your* story... try too hard to *be* just a character in theirs"). The emphasis and slightly specific phrasing tip them off without alerting others.
  4.  **Warmth & Humor:** Funny moments (escaped labyrinth, excommunication, Diego nodding at "bad faith," Bunsen burners) keep it light. Genuine admiration for their differences and how they complement each other ("lightning storm" + "grounded energy").
  5.  **Uplifting Conclusion:** Focuses on the *beauty* of continuous choice ("Yes. You. Again. Today. And tomorrow"), which is both profoundly Sartrean (authenticity) and universally moving for a wedding. "Radical, beautiful, endlessly chosen adventure" sums it up perfectly.
  6.  **Respects Diego:** Highlights his strengths (patience, joy, teaching) and his perspective. Makes his "ignorance" of philosophy a charming point of connection and difference, not a lack.

  **Delivery Tips:**

  *   **Pacing:** Don't rush the philosophical bits, but keep the rhythm moving. The humor helps.
  *   **Eye Contact:** Spread it around – Priya/Diego, philosophy table (especially during the reefs bit), Diego's family (during warm/funny Diego moments), the whole room during the big finish.
  *   **Tone:** Start warm and slightly self-deprecating, shift to earnest for the freedom/choice part, lighten for humor, build to sincere warmth for the final toast.
  *   **The Reefs Line:** Deliver it naturally, like any other metaphor. Don't wink or linger *too* long on the philosophy table. Their ears will perk up at "reefs" and the specific descriptions of the dangers.

  This toast honors Priya's intellectual world, celebrates Diego's, and ultimately delivers a deeply felt message about love that resonates with everyone – precisely because it avoids the easy clichés she forbade. Good luck! You've got this.
