answer: |-
  ## The Architectonics of Murder: Anscombe's Intention and the Atomic Verdict

  Elizabeth Anscombe's opposition to President Truman's honorary degree from Oxford in 1956, articulated in her pamphlet "Mr. Truman's Degree," was no mere footnote to her philosophical career. It was a searing moral indictment demanding a rigorous philosophical foundation. Your suspicion is astute: the intricate technical machinery meticulously constructed in *Intention* (1957) appears purpose-built to provide the unshakeable conceptual framework necessary to sustain the damning charge she had already leveled – that the atomic bombings of Hiroshima and Nagasaki constituted murder, specifically because they involved *intending* the deaths of innocent civilians *as a means* to victory. Engaging this specific machinery – the intended/foreseen distinction and its link to unconditional surrender – against the strongest consequentialist counter-arguments reveals a profound tension. While Anscombe's logic within her own framework is compelling and largely withstands its critics on this specific point, the verdict ultimately exposes the immense weight placed on a distinction potentially strained by the abyss of "supreme emergency."

  **Anscombe's Charge: Intention, Means, and the Shadow of Unconditional Surrender**

  Anscombe’s accusation hinges on the Doctrine of Double Effect (DDE), refined through her later work on intention. She explicitly distinguishes between:
  1.  **Intended as Means:** An effect one aims at *in order to* achieve one's end. This effect is constitutive of the action's success.
  2.  **Merely Foreseen:** An effect one anticipates but does not aim at *as part of the plan*; it is a regrettable by-product.

  For Anscombe, directly intending the death of the innocent *as a means* is always murder, violating the absolute prohibition against killing the innocent. Merely foreseeing such deaths while pursuing a legitimate military target (e.g., bombing a munitions factory knowing nearby civilians will die) *might* be permissible under strict proportionality.

  Her analysis of Hiroshima and Nagasaki is unequivocal: the destruction of the cities and their inhabitants was not a *side-effect* of attacking a military target. It *was* the target. The terror, demoralization, and societal collapse caused by the mass slaughter of civilians *was the chosen mechanism* to compel Japanese surrender. As she states in the pamphlet, "For men to choose to kill the innocent as a means to their ends is always murder." The bombs were weapons of terror, not precision; their efficacy depended on maximizing civilian annihilation to achieve the political goal.

  Crucially, Anscombe locates the "root injustice" not solely in the bomb itself, but in the Allied policy of **unconditional surrender**. This demand, she argues, created a situation where achieving victory seemed to *require* morally abhorrent means. By refusing any negotiated peace or conditions, the Allies painted themselves into a corner where only the utter devastation of the enemy populace appeared feasible to end the war swiftly. The bombs, therefore, were the horrific instrument necessitated by a prior, flawed policy that excluded less brutal paths to peace.

  **The Consequentialist Rebuttal: Necessity and Supreme Emergency**

  The most potent challenge to Anscombe comes from consequentialist reasoning framed by the perceived realities of August 1945 and arguments akin to Walzer's "supreme emergency":

  1.  **The Invasion Calculus:** The projected costs of Operation Downfall (the invasion of Japan) were staggering. Estimates, based on the horrific battles of Okinawa and Iwo Jima, predicted hundreds of thousands of Allied casualties (including your grandfather's likely fate) and millions of Japanese military *and civilian* deaths in a protracted, fanatical defense. The bombs, by inducing immediate surrender, *actually saved lives overall* compared to the foreseeable alternative. This isn't just hindsight; it was the dominant strategic assessment at the time.
  2.  **"Supreme Emergency" (Walzer):** Walzer argues that when a community faces imminent annihilation or enslavement by an aggressor embodying a radical evil (like Nazism or Imperial Japan's militarism), the usual moral constraints *may* be overridden. The sheer magnitude of the ongoing catastrophe – millions dying across Asia, the Holocaust, Japanese atrocities – and the prospect of even greater carnage in an invasion created an existential crisis. In such an extreme, unique moment, actions normally forbidden (like intentionally targeting civilians) *might* be tragically necessary to avert a greater evil. The bombs, therefore, were a horrific but *lesser evil* chosen to end the greater evil of the war.
  3.  **The Problem of Alternatives:** Consequentialists argue the alternatives were illusory or worse:
      *   **Continued Conventional Bombing/Blockade:** Prolonged suffering, starvation of millions of Japanese, continued high casualties in occupied territories, and no guarantee of surrender before the invasion.
      *   **Demonstration or Warning:** Unlikely to convince a militarized regime in denial; risked wasting scarce resources and hardening resolve if the bomb proved a dud or less devastating than hoped.
      *   **Awaiting Soviet Entry:** While the Soviet declaration of war (Aug 8th) contributed to the surrender decision, relying solely on it risked a partitioned Japan, prolonged conflict, and Soviet expansion in Asia.
      *   **Negotiation:** The Allies believed (with reason, given Japanese internal communications like the "Big Six" deadlock) that any negotiated peace would leave the militarist regime intact, violating the core war aim of eliminating the threat posed by Japanese militarism. Unconditional surrender, however brutal its *de facto* requirement, was seen as the only guarantee of this.

  **Engagement and Verdict: Murder Holds, but the Abyss Strains the Distinction**

  Does Anscombe's charge of murder hold up? **Within the strict confines of her intentionalist framework and its application to the historical facts as she interprets them, the charge stands.**

  1.  **Intention as Means is Indisputable:** The historical record is clear: the Target Committee explicitly selected cities (not isolated military bases) to maximize the bomb's psychological impact *through* civilian devastation. Secretary of War Stimson's agonizing over Kyoto's cultural significance, but not its *civilian* status, underscores that civilian death was central to the weapon's purpose. Truman's diary entry ("fifteen or twenty thousand" killed, a vast underestimate revealing a focus on *effect* rather than precise targeting) and the Potsdam Ultimatum's vague threat of "prompt and utter destruction" confirm the *means* was terror via annihilation. The bombs were dropped to shatter the Japanese *will* by shattering Japanese *cities and people*. This fits Anscombe's definition of intending innocent death as a means.
  2.  **Consequentialism Doesn't Refute, It Overrides:** The consequentialist arguments are powerful, but they do not *refute* Anscombe's claim about intention. They implicitly *concede* the point about intentional targeting but argue the *consequences* justified overriding the moral prohibition. Walzer's "supreme emergency" is an *exception* carved out *because* the normal rule (thou shalt not murder the innocent) is acknowledged. Anscombe would reject this exception as incoherent and dangerous: if the prohibition isn't absolute in *precisely* these horrifying cases, it ceases to be a meaningful prohibition at all. The "lesser evil" argument, for her, collapses into utilitarianism, which she fundamentally rejects as a basis for moral absolutes.
  3.  **Unconditional Surrender as Catalyst, Not Absolution:** While the unconditional surrender policy created the perceived necessity for extreme measures, it does not absolve the *choice* of means. Anscombe's point highlights a deep moral failure in war policy – the refusal to contemplate any end state that didn't require the enemy's utter humiliation and destruction. However, the policy explains the *context* of the choice; it doesn't change the intrinsic nature of the chosen *action*. Choosing mass murder remains murder, even if the alternative paths seem closed by prior decisions. The architects of the bombs still *chose* to use civilian annihilation as their instrument.

  **The Qualified Verdict:**

  **Anscombe's charge of murder, as defined by her intentionalist framework – the deliberate choice to kill the innocent as a means to an end – holds against the atomic bombings of Hiroshima and Nagasaki.** The consequentialist and "supreme emergency" arguments, however compelling in their depiction of the horrific alternatives, function as justifications *for* overriding the prohibition against murder in extremis; they do not demonstrate that the prohibition wasn't violated. They weigh consequences *against* the moral law Anscombe insists is absolute.

  **However, the qualification lies in the immense strain this case places on her framework.** The sheer scale of the "supreme emergency" – the ongoing genocide, the projected apocalyptic invasion casualty figures, the fanatical resistance encountered – forces a confrontation with the *limits* of applying neat philosophical distinctions like intended/foreseen to the molten core of total war. While her logic holds internally, the historical reality screams that *any* choice available to Truman in August 1945 involved profound, perhaps unforgivable, moral horror. The bombs *were* different in kind and scale, and Anscombe is right to spotlight the unique moral corruption of *choosing* civilian destruction as a weapon. Yet, the abyss of 1945 challenges the very possibility of clean moral hands, making her absolute prohibition feel both philosophically rigorous and existentially agonizing. The verdict of "murder" stands by her definition, but the context reveals why that verdict, while technically correct within her system, remains a source of unending moral torment and debate – a torment vividly embodied in your conversation with your grandfather. Her *Intention* provided the formidable scaffolding for her charge, but the historical horror of the bombs ensures that the weight of that charge will never feel purely academic.
