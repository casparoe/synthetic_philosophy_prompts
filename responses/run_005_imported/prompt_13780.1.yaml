answer: |-
  Here’s a rigorous reconstruction of the tension and its resolution, designed as a one-page seminar handout focusing on your core questions. It synthesizes primary texts and avoids handbook summaries.

  ---

  ### **Handout: Resolving the Tension in Nyāya-Sūtra 1.1.4 on Perception**  
  **Key Sūtra**: *indriyārthasannikarṣotpannam jñānam avyapadeśyam avyabhicāri vyavasāyātmakaṃ pratyakṣam*  
  ("Perception is cognition produced by sense-object contact, **non-verbal** [avyapadeśya], **non-erroneous** [avyabhicāri], and **determinate** [vyavasāyātmaka].")

  ---

  ### **The Apparent Contradiction**  
  1. **Avyapadeśya**: Literally "not associated with speech/names." Implies freedom from linguistic mediation.  
  2. **Vyavasāyātmaka**: "Determinate cognition" (e.g., "This is a cow"). Requires identifying an object *as* something (invoking universals like *cowness*).  
  3. **Problem**: If "cow" presupposes the universal *cowness* and its associated word (*śabda*), how can the cognition be both *determinate* and *free from verbal association*?  

  ---

  ### **(1) Resolving the Tension: Three Interpretive Strategies**  
  #### **A. Vātsyāyana’s Bhāṣya (Epistemic Independence)**  
     - **Avyapadeśya ≠ Non-Conceptual**: It means the cognition **does not derive from verbal testimony** (śabda-pramāṇa).  
     - **Key Move**: Determinate perception arises *directly* from sense-object contact, not from hearing the word "cow."  
     - **Example**: Seeing a cow and judging "this is a cow" relies on sensory input, not a teacher’s utterance.  
     - **Weakness**: Doesn’t fully address how the universal (*sāmānya*) is accessed without language.  

  #### **B. Udayana’s Semantic Distinction (Nyāyakusumāñjali)**  
     - **Avyapadeśya** targets *name-dependence*, not concept-use.  
     - **Determinacy** involves *recognition of a particular-qua-universal* (e.g., this individual *as instantiating cowness*), which is pre-linguistic.  
     - **Analogy**: An infant perceives "cowness" in a cow (determinately) without knowing the word "cow."  
     - **Strength**: Separates linguistic competence (*śabda-jñāna*) from perceptual recognition (*artha-sākṣātkāra*).  

  #### **C. Gaṅgeśa’s Two-Tiered Refinement (Tattvacintāmaṇi)**  
     - **Vyavasāyātmaka** is *savikalpaka pratyakṣa* (determinate perception), but its foundation is *nirvikalpaka* (non-conceptual "raw" perception).  
     - **Avyapadeśya** primarily describes *nirvikalpaka*: a pre-predicative grasp of "this-ness" (*idam iti jñānam*).  
     - **Sūtra 1.1.4 Synthesis**: Gautama compresses the perceptual *process*:  
       - *Nirvikalpaka* (non-verbal, non-conceptual) → *Savikalpaka* (determinate, conceptual).  
     - **Textual Defense**: Vātsyāyana’s Bhāṣya mentions indeterminate cognitions (*avikalpaka*) as foundational.  

  > **Consensus**: *Avyapadeśya* excludes **linguistic mediation**, not **conceptual content**. Determinacy emerges from the object’s own form (*svarūpa*), not imposed words.  

  ---

  ### **(2) Why This Tension Matters: The Nyāya-Buddhist Battle Over Universals**  
  #### **Buddhist Critique (Dignāga/Dharmakīrti)**  
     - **Kalpanā (Conceptual Construction)**: All determinacy (*vyavasāya*) involves *kalpanā*—mentally associating a perceived particular with a universal/name.  
     - **Sūtra 1.1.4 Contradiction**: If perception is *avyapadeśya* (free from *kalpanā*), it cannot be *vyavasāyātmaka* (which requires *kalpanā*).  
     - **Core Argument**: Universals (*sāmānya*) are mental constructs (*vikalpa*), not perceived. Only unique particulars (*svalakṣaṇa*) are objects of perception.  

  #### **Nyāya Defense (Post-Gautama)**  
     - **Universals are Perceptible**: *Sāmānya* is a real property (*padārtha*) contacted by senses (*indriyārthasannikarṣa*).  
     - **Jayanta Bhaṭṭa’s (Nyāyamañjarī) Move**:  
       - *Avyapadeśya* means the cognition is **not caused by words**, but it can *later* be verbalized.  
       - The universal "cowness" is *in the object itself*; perception grasps it non-verbally (*nirvikalpaka*) before judgment (*savikalpaka*).  
     - **Epistemic Stakes**: If universals aren’t perceived, perceptual judgments ("this is a cow") become inferential—undermining Nyāya’s realism.  

  #### **The Fault Line**  
     - **Buddhist**: Perception = *Only* non-conceptual (*nirvikalpaka*). Determinacy = Inference (*anumāna*).  
     - **Nyāya**: Perception *culminates* in determinacy (*vyavasāya*), with concepts grounded in reality.  
     - **Outcome**: This definition forced Nyāya to refine its theory of universals and perception, leading to Gaṅgeśa’s explicit two-stage model.  

  ---

  ### **Key Takeaway for Seminar Discussion**  
  - **Gautama’s Sūtra** is a compressed formula describing a *process*, not a single static cognition.  
  - **Avyapadeśya** is **epistemological** (no reliance on testimony/words), not **phenomenological** (no concepts).  
  - **The Buddhist-Nyāya Clash** centers on whether perception can directly grasp universals. Nyāya’s insistence that it can (via *vyavasāyātmaka*) defends realism against Buddhist conceptualism.  

  ---

  ### **Seminar Prompts**  
  1. Does Udayana’s "infant perception" thought experiment successfully decouple determinacy from language?  
  2. Can *avyapadeśya* coherently mean "non-testimonial" while allowing conceptual content?  
  3. Is Gaṅgeśa’s two-tiered model a faithful interpretation of Gautama or a later innovation?  

  **Primary Sources**: Vātsyāyana’s *Nyāya-Bhāṣya* (on 1.1.4), Udayana’s *Nyāyakusumāñjali* (5.7), Gaṅgeśa’s *Pratyakṣa-khaṇḍa* (Tattvacintāmaṇi).  

  ---  
  This reframes the tension as a productive engine for Nyāya’s evolution, emphasizing how exegesis of *avyapadeśya* became pivotal in defending perceptual realism against Buddhist nominalism. Let me know if you'd like expanded textual citations or dialectical scenarios for the seminar.
