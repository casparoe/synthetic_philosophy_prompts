answer: |-
  Your intuition as an experimentalist is deeply understandable—interventionist causation *feels* like it should vindicate mental causation. Yet Kim's exclusion argument presents a profound metaphysical challenge that, I'll argue, withstands even the most sophisticated interventionist defenses. Let's dissect why, engaging with the strongest versions of the rescue attempt.

  ### Core Problem: The Supervenience Constraint on Interventions
  The crux lies in the *supervenience* of mental states (M) on physical states (P): there can be no change in M without a change in P. For an interventionist account (following Woodward), a variable X causes Y only if:
  1. There exists a possible intervention I on X that changes Y.
  2. I sets X independently of other causes of Y (modularity).
  3. I doesn’t directly affect Y except via X.

  **The fatal constraint**: To test M's causal autonomy, we need an intervention I that changes *M while holding fixed its supervenience base P*. But supervenience entails that holding P fixed *necessitates* holding M fixed. Any change in M *requires* a change in P. Thus, no intervention can satisfy the independence requirement (condition 2) for M relative to P.

  ### Engaging the Strongest Interventionist Rescue Attempts
  Defenders (e.g., List & Menzies, Woodward, Raatikainen) propose these strategies:

  1. **Multiple Realizability to the Rescue?**  
     *Claim*: Since M can be realized by different P-states (P₁, P₂, ... Pₙ), we can intervene on M by changing its realization *while holding fixed the relevant causal role*.  
     *Rebuttal*: This confuses *type*-level with *token*-level causation. In a *specific instance*, M is realized by a *particular* P. To change M *in this token case*, you *must* change that very P (or its context). Holding that exact P fixed while changing M is metaphysically impossible. The intervention always changes P first, making P the direct difference-maker.

  2. **"Difference-Making" at Higher Levels?**  
     *Claim*: M can be a difference-maker if varying M (via different realizers) produces changes in behavior *while P is varied in a way that doesn't correlate with M's causal role*.  
     *Rebuttal*: This demonstrates M's *explanatory* relevance, not *causal autonomy*. When M changes via P₁→P₂, it is P₁ and P₂ doing the causal work. M's apparent causal power is derived from the physical realizers. Kim's challenge is about *token causation*: in *this* instance, how can M add anything beyond what P contributes? Interventionism shows M is *correlated* with outcomes, not that it *produces* them independently.

  3. **Yablo's Proportionality Argument?**  
     *Claim*: M may be a *better* cause than P because it is "proportional"—e.g., wanting water (M) is a more precise cause of reaching for a glass than the microphysical state (P).  
     *Rebuttal*: Proportionality addresses *explanatory salience*, not *causal exclusion*. Even if M is the "right" level of description, it doesn't follow that M has independent causal power. P remains minimally sufficient for the effect. The supervenience relation still implies that M's causal contribution is *screened off* by P.

  ### Parallel Cases from Special Sciences
  1. **Genetics vs. Molecular Biology**:  
     - *Claim*: "Gene for trait T" causes T, even though realized by different DNA sequences.  
     - *Exclusion Problem*: In a specific organism, the exact DNA sequence (P) is sufficient for T. Varying the gene concept (M) across contexts shows *generality*, but in any *single* case, P does the work. Changing the "gene" without changing DNA is impossible.

  2. **Economics (Interest Rates)**:  
     - *Claim*: Raising interest rates (M) causes reduced inflation, regardless of underlying mechanisms (central bank operations, market psychology).  
     - *Exclusion Problem*: In a specific instance, the physical implementation of the rate hike (e.g., Fed's digital transaction, P) is sufficient for its economic effects. M cannot be intervened upon without altering P.

  3. **Software Engineering**:  
     - *Claim*: A program's algorithm (M) causes output O, realized by varied hardware states (P).  
     - *Exclusion Problem*: On a specific computer, the physical state (P) is sufficient for O. "Changing the algorithm" without changing the physical computation is impossible *in that token system*.

  ### Why the Interventionist Test Fails for Mental Causation
  - **The Asymmetry Problem**: Interventions on P *automatically* change M (by supervenience), but interventions on M *require* changing P. This asymmetry shows P is privileged: it can disrupt the M→P* link without M changing, but not vice versa.  
  - **Overdetermination is Inescapable**: If M and P both cause P*, it would be systematic overdetermination (every physical effect has two distinct causes). But non-reductive physicalists reject this, as it’s ontologically profligate and unlike standard overdetermination (e.g., two bullets).  
  - **The Causal Drain Argument**: If M has independent causal power, energy/information must flow from M to P*. But physical closure implies all energy/information is already accounted for by P. Where could M's extra "oomph" come from?

  ### Conclusion: Why Your Instinct Was (Understandably) Hasty
  As an experimentalist, you treated M as a *pragmatic causal variable*—a move perfectly justified in practice. But Kim targets *metaphysical causation*: what *fundamentally produces* the effect. Interventionism confirms M’s *practical utility* for prediction and control, but not its *ontological autonomy*. The supervenience relation reduces M to a *causally inert byproduct* of P in any token case. Thus, no interventionist account can secure *non-reductive* mental causation; it either reduces M to P or renders it epiphenomenal. Your instinct reflects science’s success in *tracking patterns*, but philosophy exposes a deeper truth: when we peel back the layers, only the physical base is doing the work. This doesn’t diminish the mind’s explanatory value—but it does confine its causal power to the physical realizer.
