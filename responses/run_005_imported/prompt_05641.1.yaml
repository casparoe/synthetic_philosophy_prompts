  Okay, the user is asking me to grade a student's exam answer on Nyāya epistemology. They've inherited grading duties mid-term and want an external assessment since this isn't their specialty. The question is worth 20 points and has four specific parts: (a) list pramāṇas, (b) reconstruct the fire-smoke inference, (c) explain vyāpti's role, and (d) contrast with a rival school. 

  The student's answer seems quite strong at first glance. For part (a), they correctly list all four Nyāya pramāṇas and even contextualize them against other schools - that's textbook perfect. For (b), they nail the five avayavas with precise Sanskrit terms and the classic kitchen example. Part (c) is also well-handled with a clear vyāpti definition. 

  Where things get interesting is part (d). The student makes two contrast attempts: first against Cārvāka (good but slightly underdeveloped), then an unexpected pivot to upamāna. While the upamāna explanation itself is accurate, it doesn't fulfill the "contrast" requirement since they're comparing Nyāya's own pramāṇas rather than rival schools. The concluding paragraph has a problematic reductionist claim about all pramāṇas terminating in perception - that's actually a Cārvāka/Buddhist position, not orthodox Nyāya! 

  The coherence issues are subtle but real. The upamāna tangent breaks flow, and that erroneous conclusion could mislead. Still, the core requirements are largely met with sophistication. I'm thinking 16/20: full credit for (a)-(c), partial for (d), minus some coherence points. 

  Noticing the user seems anxious about fair grading - they emphasized "justify the grade" and requested a rubric. I'll make sure my feedback is precise and pedagogical, not just critical. The JSON format will help them apply this consistently to other papers. Might also subtly reassure them that inheriting this course is manageable by modeling careful assessment.
