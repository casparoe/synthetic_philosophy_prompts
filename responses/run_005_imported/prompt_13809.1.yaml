  First, I need to break down the Kelly criterion. It's about maximizing the geometric mean growth rate, which leads to the formula f* = (bp - q)/b. The key point is that it prevents ruin and maximizes long-term wealth growth. But Samuelson argued that Kelly only makes sense if you have log utility, which isn't the only rational choice. He thought expected utility theory (EUT) with different utility functions could justify different bet sizes.

  Then there's the ergodicity economics angle from Ole Peters. He says that time averages (what you actually experience over time) differ from ensemble averages (expected value over many parallel trials). For multiplicative growth, like investing, the time average growth rate is geometric. So Kelly aligns with avoiding ruin in non-ergodic processes.

  Garrabrant's geometric rationality frames decisions in terms of scale-invariance. If you care about proportional wealth changes, geometric reasoning is natural. This isn't just log utility; it's a different way to handle uncertainty when growth is multiplicative.

