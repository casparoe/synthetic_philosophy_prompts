  The friend's guilt is understandable but misplaced. The maintenance guy had the clearest obligation. His failure was direct negligence. The friend had no such duty - her role was informal. Her inaction was passive, while his was active neglect of duty. The distinction between "allowing" vs. "causing" harm is crucial here. 

  Also worth noting how psychological factors distort blame assignment: the friend's guilt makes her a visible target, while the maintenance guy's lack of remorse makes him less salient. The "last clear chance" fallacy makes people overemphasize the most recent preventable action.

