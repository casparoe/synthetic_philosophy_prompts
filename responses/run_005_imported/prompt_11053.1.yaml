  First, I need to unpack the layers here. There's the maintenance guy with explicit contractual duty who ignored the messages. Then there's the friend who, as the de facto building manager, saw the messages but didn't act. And other tenants who also saw the messages. The building design without hardwired detectors adds another factor. The friend is internalizing blame disproportionately.

