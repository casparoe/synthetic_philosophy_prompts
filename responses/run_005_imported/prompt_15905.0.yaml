  Here's the setup: every attempted fix for how a proposition (or fact, or state of affairs) manages to be a genuine unity rather than just a heap of consituents seems to either quietly relocate the regress somewhere else, or just posit a primitive unifier and call it a day. Rank the following from best to worst at actually blocking the regress (as opposed to merely redescribing it):

  - Frege's unsaturated concepts
  - Russell's multiple relation theory of judgement
  - Wittgenstein's Tractarian "showing not saying" / picture theory
  - Armstrong's non-mereological states of affairs
  - Bergmann-style nexus / non-relational tie theories
  - Possible-worlds propositions (structure dissolved rather than explained)
  - Soames/King-style act- or use-based theories of propositional unity

  Give it to me as a tier list in JSON, like:

  ```json
