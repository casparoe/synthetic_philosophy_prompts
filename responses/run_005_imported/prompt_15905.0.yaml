reasoning: |-
  We are ranking the responses to Bradley's regress from best to worst at actually blocking the regress (as opposed to merely redescribing it). The regress arises when trying to explain the unity of a proposition: what holds the constituents together? If we posit a relation to bind them, then we need a further relation to bind that relation to the constituents, and so on.

  The goal is to assign each theory to a tier (S, A, B, C, D) and provide a one-line reason for each.

  Theories:

  1. Frege's unsaturated concepts: Concepts are inherently incomplete (unsaturated) and thus require an object to complete them, which avoids the need for a separate binder.

  2. Russell's multiple relation theory of judgement: Rejects that there is a single proposition; instead, judgment is a multiple relation between the mind and the constituents, so there's no unified proposition to begin with.

  3. Wittgenstein's Tractarian "showing not saying" / picture theory: The structure of the proposition (as a picture) shows its unity, which cannot be said without falling into the regress.

  4. Armstrong's non-mereological states of affairs: States of affairs are fundamental unities that are not mereological sums; they have a non-mereological mode of composition.

  5. Bergmann-style nexus / non-relational tie theories: Introduces a special entity (nexus) that is not a relation but a tie that binds without needing further binding.

  6. Possible-worlds propositions: Propositions are identified with sets of possible worlds, thus avoiding the structure (and hence the unity problem) by dissolving structure.

  7. Soames/King-style act- or use-based theories of propositional unity: The unity comes from the act of predication by a cognitive agent; the proposition is unified by the act of thinking.

  Ranking criteria: We want to see how effectively each theory blocks the regress without just pushing it back or being a primitive posit.

  Analysis:

  - Frege: The unsaturated/unsaturated distinction avoids the regress by making the concept inherently in need of completion. This is often seen as a strong solution because it doesn't require an extra entity to bind.

  - Russell: By denying the existence of a proposition as a single entity and making judgment a multiple relation, the regress is avoided because there is no single complex to unify. However, this has been criticized as not solving the problem but avoiding it by changing the subject.

  - Wittgenstein: The picture theory avoids the regress by making the unity of the proposition a feature that is shown by the structure and cannot be expressed in language. This is a form of dissolution, but it's a sophisticated one.

  - Armstrong: States of affairs are taken as primitive unities. This might be seen as a brute force solution, but Armstrong argues that they are fundamental and not further analyzable.

  - Bergmann: The nexus is introduced as a non-relational tie. However, this seems to be a primitive that is designed to stop the regress, but it might be accused of being an ad hoc posit.

  - Possible-worlds: By reducing propositions to sets of worlds, the internal structure is lost. This dissolves the problem by removing the structure, but it doesn't explain the unity of structured propositions.

  - Soames/King: The unity comes from the act of the subject. This might push the problem to the psychological realm, and it's unclear if it avoids a regress in the act of predication.

  Tier assignment:

  S: Best at blocking the regress without redescription or primitive posits.
  A: Very good, but maybe a minor issue.
  B: Adequate, but with some concerns.
  C: Weak, mostly redescribes or pushes the regress.
  D: Fails to block the regress.

  My reasoning:

  - Frege: Often considered the classic solution. The unsaturatedness is built into the nature of concepts. This seems to block the regress without introducing a new entity. So I put it in S.

  - Wittgenstein: The showing/saying distinction is a profound way to avoid the regress by making the unity ineffable. It's a dissolution rather than a solution, but it's effective. I'd put it in A, because it doesn't explain how the unity arises but rather says it must be shown.

  - Armstrong: Takes states of affairs as primitive. This is a common move but it might be seen as a brute posit. However, Armstrong's account is robust and non-mereological. I'd put it in B because it's a primitive, but a well-motivated one.

  - Bergmann: The nexus is explicitly a primitive tie. This is a straightforward primitive posit, and it might be accused of being ad hoc. I'd put it in C because it doesn't really block the regress but just stops it by fiat.

  - Russell: The multiple relation theory avoids the proposition, but then the problem of unity reappears in the judgment relation. Russell himself abandoned it because of problems. I think it doesn't solve the problem, so I put it in C or D.

  - Possible-worlds: This avoids the problem by removing structure. But for structured propositions, it doesn't address the issue. So it's a dissolution by changing the subject. I put it in D.

  - Soames/King: The act-based theory makes unity dependent on the agent's act. But then what unifies the act? It might lead to a regress in the act of predication. I put it in D.

  But note: King's theory has evolved and is more sophisticated. However, the criticism is that it pushes the problem to the mental act.

  After reconsideration, here is a possible tier list:

  S: Frege (unsaturated concepts) - because it builds the unity into the very nature of the constituents.

  A: Wittgenstein (picture theory) - because it dissolves the problem by showing that the unity cannot be said but is shown in the structure.

  B: Armstrong (non-mereological states of affairs) - because it takes states of affairs as fundamental unities, which is a reasonable primitive.

  C: Bergmann (nexus) - because it introduces a primitive tie, which might be seen as a regress-stopper by fiat.

  C: Russell (multiple relation) - because it avoids the proposition but then the judgment relation might require unity.

  D: Possible-worlds propositions - because it dissolves structure rather than explaining unity.

  D: Soames/King (act-based) - because it relies on the act of the subject, which might not block a regress in the act.

  But let me adjust:

