answer: |-
  **MEMORANDUM**  
  To: Staff Engineer Promotion Committee  
  From: [Your Name], Senior Engineer, Promotion Committee  
  Date: October 26, 2023  
  Subject: Recommendation: Redesign the "Signature Project" Requirement  

  ### **Recommendation**  
  I recommend we **redesign the "signature project" requirement** to prioritize equity, flexibility, and holistic assessment of Staff-level competencies. Retaining the current requirement risks systemic bias, while abandoning it entirely forfeits a valuable assessment tool. A redesigned framework can preserve rigor while accommodating diverse contexts and mitigating inequities.  

  ---

  ### **Rationale: Why Redesign Is Necessary**  
  1. **The Current Requirement Has Structural Biases**  
     As critics note, the status quo disproportionately advantages engineers with:  
     - Low caregiving responsibilities (e.g., no dependents, elder care, or health constraints).  
     - Managers willing to allocate high-visibility, "glamorous" projects.  
     - Job security allowing risky multi-month commitments.  
     This filters out talented candidates who excel in critical but less-visible work (e.g., system resilience, mentorship, or scaling foundational systems).  

  2. **"Extravagance ≠ Excellence"**  
     While supporters rightly argue that Staff Engineers must drive high-impact work, the *form* of that work must vary. The "peacock’s tail" analogy conflates *visibility* with *competence*. Staff-level impact can manifest as:  
     - Architectural leadership in complex migrations.  
     - Cross-org influence (e.g., standards, tooling, or mentorship).  
     - Deep system optimizations without fanfare.  
     **→ Redesign Goal:** Define Staff impact by outcomes (e.g., scaled technical influence, risk mitigation, enabling teams), not just project theatrics.  

  3. **Sustainable Excellence > Heroics**  
     Sustained high performance in core responsibilities—amidst context-switching, collaboration, and ambiguity—better predicts Staff success than a one-off "moon shot." The current requirement incentivizes neglecting baseline duties for a trophy project.  

  ---

  ### **Proposed Redesign Framework**  
  Replace the "signature project" with **"Staff Impact Pathways,"** requiring candidates to demonstrate **TWO** of the following:  
  1. **High-Visibility Project Lead:** *Optional.* Leading a complex project (current requirement), but with:  
     - **Guardrails:** Managers must justify why this project was assigned equitably.  
     - **Flexible Scope:** Short-term, high-stakes initiatives (e.g., incident recovery, security patches) qualify.  
  2. **System-Wide Influence:** Driving cross-team technical change (e.g., adoption of a new architecture, reliability framework, or productivity tool).  
  3. **Scale Amplifier:** Work enabling multiple teams (e.g., documentation systems, onboarding redesign, or abstraction layers).  
  4. **Deep Technical Leverage:** Solutions with outsized impact (e.g., 10x cost reduction, eliminating entire classes of incidents).  

  **Assessment Criteria:**  
  - **Impact:** Measurable outcomes (e.g., "reduced onboarding time by 40%," "eliminated 50% of Sev-2 incidents").  
  - **Scope:** Influence beyond a single team/product.  
  - **Leadership:** How they navigated ambiguity, influenced stakeholders, and uplifted others.  

  ---

  ### **Strongest Counterargument: Why Not Keep or Abolish?**  
  **Supporters’ Valid Concern (Why Not Abolish?):**  
  *"Without an objective, high-stakes test, promotions risk becoming subjective or politicized. The signature project forces candidates to prove they can own ambiguous, org-critical work end-to-end—precisely what defines Staff scope."*  
  **Rebuttal:** Our redesign preserves this proof-of-scope requirement but makes it *one option among several*. We add objectivity via outcome-based metrics and peer validation.  

  **Critics’ Valid Concern (Why Not Abolish Entirely?):**  
  *"Manager/peer reviews alone suffice. Google/Meta promote Staff Engineers without 'signature projects' by assessing scope and influence holistically."*  
  **Rebuttal:** While true, our culture currently lacks calibrated benchmarks for "scope." Pathways provide tangible evidence, reducing bias in subjective reviews.  

  ---

  ### **Implementation Plan**  
  1. Pilot the framework for 6 months with clear rubrics.  
  2. Require promotion packets to include:  
     - Impact narratives with metrics.  
     - Peer feedback (min. 3 engineers, including 1 outside the candidate’s team).  
     - Manager’s assessment of *how* the work reflects Staff scope.  
  3. Train managers on equitable opportunity allocation.  

  ---

  ### **Conclusion**  
  Redesigning the requirement balances rigor with fairness. It signals that Staff Engineers create impact in diverse ways—whether through a "peacock’s tail" or by strengthening the flock. I move to adopt the "Staff Impact Pathways" framework and refine it during our pilot phase.  

  **Recommended Vote:** ✅ **Approve Redesign**  
  Attached: Draft rubric for "Staff Impact Pathways."
