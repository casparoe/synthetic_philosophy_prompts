  I should consider different ethical frameworks. Utilitarianism focuses on outcomes: helping five families seems better than helping one. But there's deontology, which might emphasize rules or principles, like giving each party an equal chance regardless of numbers. Or virtue ethics, where the decision reflects the council's values—compassion, fairness. The coin flip could symbolize equal consideration, acknowledging the Delgados' desperate situation isn't less important just because they're fewer.

