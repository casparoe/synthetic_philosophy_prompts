answer: |-
  What a fascinating synthesis! Your physicist's eye for methodological rigor combined with deep philosophical engagement yields a compelling reading of Sidgwick. Let's break down your questions:

  **1. The Link Between Psychical Research & the Dualism: Not Oversold, Core Motivator.**
     *   **Scholarly Consensus:** You've hit the nail squarely on the head, and this is the dominant scholarly interpretation. Henry Sidgwick himself explicitly linked the two pursuits. Key evidence:
          *   **Letters & Memoirs:** He wrote to friends about his "desire for evidence of a future life" stemming directly from the "dilemma" or "impasse" created by the dualism. His wife Eleanor and colleagues (like Frederic Myers) confirmed this motivation.
          *   **The "Deepest Problem":** Sidgwick framed the conflict between egoism and utilitarianism as the "profoundest problem in Ethics." He saw the potential harmony of duty and self-interest (via cosmic justice/rewards) as the *only* intellectually satisfying resolution. Psychical research wasn't a hobby; it was the empirical arm of his ethical inquiry.
          *   **Scholarship:** Major Sidgwick scholars like Bart Schultz ("*Henry Sidgwick: Eye of the Universe*"), C. D. Broad, J. B. Schneewind, and David Phillips unequivocally endorse this connection. Schultz, in particular, details how the SPR was an integral part of Sidgwick's lifelong project to reconcile reason, ethics, and the cosmos.
     *   **Conclusion:** Your reading isn't just defensible; it's the mainstream scholarly view. Sidgwick's psychical research was a direct, sustained, and serious empirical attempt to find evidence for the premise (cosmic moral order/future life) that would resolve the dualism.

  **2. The "Triumph of Method" & Agnosticism: Defensible, but the Tension Remains.**
     *   **Defending the Triumph:** Your framing is *highly* defensible and speaks powerfully to your background:
          *   **Scientific Integrity:** Sidgwick's meticulousness with the Census of Hallucinations (demanding strict criteria, calculating base rates, seeking naturalistic explanations first) and the telepathy experiments (exposing fraud like the Creery sisters, demanding rigorous controls) demonstrates exceptional scientific integrity *for his time*. He actively sought falsification.
          *   **Resisting Wishful Thinking:** His lifelong agnosticism, despite immense personal investment in a positive outcome, is a testament to intellectual honesty. He *wanted* evidence for survival/harmony, but his methodological standards wouldn't let him claim it prematurely or based on weak data. As you say, this is the physicist's ethos: letting the data speak, even when it whispers "maybe not."
          *   **A Point *For* His Character/Method:** This absolutely speaks *for* Sidgwick's character and the robustness of his empirical approach. It shows he prioritized truth-seeking over confirming a desired philosophical conclusion.
     *   **The Unresolved Dualism & Ethical Implications:**
          *   **The Core Problem Persists:** You're right that the agnosticism leaves the dualism unresolved. Sidgwick himself acknowledged this. The *ethical theory*, as a rational system, remained incomplete. The "proof" he sought for the harmonizing premise wasn't found.
          *   **Does This "Cut Against" the Ethics?** Here's the nuance:
              *   **Against:** Critics (e.g., Bernard Williams, some contemporary ethicists) argue the *need* for such an empirical quest reveals a fatal flaw. If the only resolution to the fundamental conflict in your ethical theory requires empirical evidence of a specific cosmic order that remains elusive, doesn't that suggest the theory is unstable or rationally unsatisfying *on its own terms*? It makes ethics contingent on unproven (and arguably unprovable) metaphysics/empirics.
              *   **For/Sidgwickian:** Sidgwickians argue the dualism *correctly* identifies a deep, perhaps unresolvable, tension in practical reason itself. The failure to find empirical proof doesn't invalidate the *analysis* of the conflict; it just confirms its intractability. Sidgwick's honesty about this impasse is a *strength* – he didn't paper it over with dogma. His method *prevented* him from adopting an unjustified belief to resolve it artificially.
     *   **Conclusion:** Your "triumph of method" framing is valid and highlights Sidgwick's admirable intellectual rigor. However, it doesn't *dissolve* the critique that the dualism's persistence, *because* of the negative empirical result, exposes a potential weakness *within the ethical system's structure* – its dependence on an unverified premise for coherence. The triumph is personal/methodological, not theoretical.

  **3. Sharpening the Stakes: Integrity of Method vs. Coherence of Theory.**
  The core distinction between your reading (largely sympathetic) and the "undermines ethics" reading hinges on **what we take the primary failure to be, and what standard we hold the ethical theory to.**

  *   **Your Reading (Integrity of Method Focus):**
      *   **Primary Success:** Sidgwick identified a profound problem (dualism), rigorously analyzed it, and honestly pursued the *only conceivable empirical resolution* with impeccable scientific integrity.
      *   **Primary "Failure":** The empirical world didn't cooperate to provide the evidence needed. This is an *external* failure (nature didn't reveal the secret), not an *internal* failure of Sidgwick's reasoning or character.
      *   **Ethical Theory Status:** The dualism stands as a valid, perhaps tragic, insight into the limits of practical reason. Sidgwick's honesty *enhances* the credibility of his ethical analysis, even if it leaves it unresolved. The quest wasn't "propping it up" illegitimately; it was the responsible, rational next step.
      *   **Analogy:** A physicist devises a brilliant experiment to detect a theorized particle. The experiment is flawlessly executed but finds nothing. This doesn't invalidate the physicist's skill or the theoretical reasoning that *motivated* the search; it just means the particle (as theorized) isn't there, or is undetectable. The negative result is scientifically valuable.

  *   **The "Undermines Ethics" Reading (Coherence of Theory Focus):**
      *   **Primary Failure:** The ethical theory itself is structurally flawed because its coherence *depends* on an empirical/metaphysical claim (cosmic harmony) that lacks rational justification and resists empirical verification. The *need* for the 20-year quest *is* the evidence of the flaw.
      *   **Sidgwick's Integrity:** While admirable, is secondary. His methodological rigor simply prevented him from *masking* the flaw with bad evidence. The agnosticism highlights the *absence* of the required foundation.
      *   **Ethical Theory Status:** The dualism isn't just an intractable problem; it's a symptom that the theory fails to provide a rationally compelling, *self-contained* account of practical reason. It's incomplete in a way that renders it unstable or less authoritative. The quest wasn't "propping it up" as much as desperately searching for a missing keystone that may not exist.
      *   **Analogy:** An engineer designs a bridge relying on a novel, untested material for a critical support. The engineer rigorously tests the material for 20 years but can't prove it's strong enough. The integrity of the testing is commendable, but the bridge design remains fundamentally *unsafe* until that proof is found. The negative tests highlight the design's inherent risk.

  **The Sharpened Stake:** The core disagreement is whether Sidgwick's psychical research primarily reveals:
  1.  **The Heroic Integrity of a Thinker Grappling Honestly with a Deep Problem (Your View):** The flaw is in the universe/reason, not the theory/method. The quest was a necessary and honorable investigation driven by the theory's implications.
  2.  **The Symptom of a Structural Weakness in the Ethical Theory Itself (Critic's View):** The theory's dependence on an unverifiable premise *is* the flaw. The quest, however rigorously conducted, underscores that dependence and the theory's consequent lack of self-sufficiency.

  **In Conclusion:**

  Your reading is insightful, well-supported by scholarship, and highlights Sidgwick's remarkable scientific-philosophical integrity brilliantly. The link to the dualism is central and correct. Your "triumph of method" framing is a strong defense of Sidgwick's character and process. However, the unresolved dualism *does* remain a point of vulnerability for the *coherence* of his ethical system, which the negative result accentuates rather than alleviates. The sharper distinction lies in whether we see the quest as a noble but unsuccessful attempt to find external validation for a sound internal analysis, or as an indicator that the internal analysis itself rests on shaky, unverifiable ground. Sidgwick's enduring fascination lies precisely in this tension between rigorous method, profound ethical insight, and an unresolved metaphysical yearning.
