answer: |-
  You're absolutely right – this is the crucial distinction that gets buried in most pop-sci accounts. Theo's "nonlocality, full stop" position oversimplifies a profound subtlety. Let's break down the Jarrett-Shimony decomposition (though others like Abner Shimony, Jon Jarrett, and Don Howard contributed significantly).

  **1. Setting the Stage: Bell's Factorizability Condition**

  Bell's theorem shows that any theory satisfying **Local Realism** (or **Local Causality**) must obey statistical constraints (like the Bell/CHSH inequalities). Quantum Mechanics (QM) violates these inequalities, and experiments confirm these violations. Local Realism is captured by Bell's **Factorizability Condition**:

  For a pair of entangled particles (A & B), with measurement settings `a` and `b` chosen at the last instant, and outcomes `A` and `B`:

  `P(A, B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`

  *   `λ`: Represents the complete physical state of the particle pair at the source *before* measurement (the "hidden variables" or "ontic state"). This encodes *everything* physically relevant about the pair.
  *   `P(A, B | a, b, λ)`: Joint probability of outcomes `A` and `B` given settings `a`, `b`, and state `λ`.
  *   `P(A | a, λ)`: Probability of outcome `A` for particle 1 given *only* its *own* setting `a` and `λ`.
  *   `P(B | b, λ)`: Probability of outcome `B` for particle 2 given *only* its *own* setting `b` and `λ`.

  **Factorizability says:** Once you know `λ`, the outcome `A` depends *only* on `a` (the local setting near A) and `λ`. It doesn't depend on the *distant* setting `b` or the *distant* outcome `B`. The same holds for `B`. The joint probability factorizes into independent local probabilities.

  **2. Decomposing Factorizability: Jarrett's Conditions**

  Jarrett realized factorizability is the conjunction of two logically independent conditions:

  *   **Parameter Independence (PI) / Setting Independence:**
      `P(A | a, b, λ) = P(A | a, λ)` and `P(B | a, b, λ) = P(B | b, λ)`
      *   **What it says:** The probability of an outcome (`A`) at one location depends *only* on the measurement setting (`a`) chosen *at that location* and `λ`. It does **NOT** depend on the measurement setting (`b`) chosen at the *distant* location.
      *   **Why it matters:** Violating PI would mean that *choosing* what measurement to do on particle B *instantly changes* the probabilities for outcomes on particle A (or vice-versa), even when A and B are spacelike separated. **This would allow Faster-Than-Light (FTL) signaling.** If Alice changes her setting `b`, it instantly changes Bob's outcome statistics `P(A | a, λ)`. By observing many outcomes, Bob could infer Alice's setting choice faster than light.

  *   **Outcome Independence (OI):**
      `P(A | a, b, B, λ) = P(A | a, b, λ)` and `P(B | a, b, A, λ) = P(B | a, b, λ)`
      *   **What it says:** Given the settings `a`, `b` and `λ`, the probability of an outcome (`A`) at one location does **NOT** depend on the *actual outcome* (`B`) at the *distant* location.
      *   **Why it matters:** Violating OI means that the *specific outcome* obtained at B is correlated with the *specific outcome* at A, *even after* accounting for `λ` and the settings. This correlation persists instantaneously over distance. **Crucially, this violation *does not* allow FTL signaling.** Knowing the *outcome* `B` tells you something about `A`, but you have no way to *control* or *choose* `B` to send a signal. Outcomes are random and uncontrollable.

  **3. How They Combine & What Experiments Force Us to Abandon**

  *   **Factorizability = PI + OI:** If both PI and OI hold, the joint probability `P(A, B | a, b, λ)` factorizes as `P(A | a, λ) * P(B | b, λ)`. PI ensures `P(A | a, b, λ) = P(A | a, λ)` and `P(B | a, b, λ) = P(B | b, λ)`. OI ensures that the joint probability is just the product of these marginals: `P(A, B | a, b, λ) = P(A | a, b, λ) * P(B | a, b, λ) = P(A | a, λ) * P(B | b, λ)`.
  *   **The Experimental Bullet:** Experiments confirm the violation of the Bell/CHSH inequalities derived under Factorizability. Therefore, *at least one* of PI or OI must be false.
  *   **Which One Falls?** Quantum Mechanics itself, and crucially, **all known empirically viable theories that reproduce the QM predictions (like Bohmian Mechanics or Collapse Theories), explicitly satisfy Parameter Independence (PI).** They do *not* allow FTL signaling. The statistical predictions for one side *only* depend on the local setting and `λ` (or the quantum state), not the distant setting.
  *   **The Sacrifice: Outcome Independence (OI).** QM explicitly violates OI. The outcome `B` *is* correlated with the outcome `A` even when `λ` (the quantum state) and the settings are specified. Knowing `B` tells you with certainty what `A` was (in the perfect correlation case), information not contained solely in `λ` and the local setting `a`.

  **4. Your Crucial Insight: Holistic Correlation, Not Causal Influence**

  **Yes, precisely.** The asymmetry means the experimentally forced "nonlocality" is primarily the violation of **Outcome Independence (OI)**. This is a form of **non-separability** or **holism**:

  *   **It's about Correlation, Not Causation:** The measurement outcomes are intrinsically, instantaneously correlated in a way that cannot be explained by any pre-existing local properties (`λ`) alone. The whole system possesses properties that aren't reducible to properties of the individual parts *plus* local causal influences.
  *   **No FTL Signaling:** Because PI holds, you cannot use this correlation to *send a signal* faster than light. The correlations only become apparent *after* the outcomes from *both* sides are brought together and compared classically (slower than light).
  *   **"Spooky Action" Muted:** Einstein's "spooky action at a distance" implied a *causal influence* propagating FTL from one measurement to affect the other. The violation of OI, while maintaining PI, shows something different: the universe enforces a **global constraint on joint outcomes**. When you measure A, you aren't *causing* B's outcome; you are *revealing* which branch of a pre-existing, non-separable correlation you are in. The "action" is the holistic correlation itself, not a causal push from A to B.

  **5. Interpretations: Where the Bullet Hits Different Assumptions**

  This is where it gets fascinating. All interpretations must account for the violation of OI while preserving PI (to avoid FTL signaling). They do this by locating the "weirdness" differently:

  *   **Bohmian Mechanics (Pilot-Wave):** Explicitly **violates PI (and thus Factorizability) *at the hidden variable level*.** The *actual* particle positions (`λ` includes the wave function *and* particle positions) are influenced *instantaneously* by the distant setting `b` when determining outcome `A`. However, Bohm cleverly constructs the theory so that the *statistical predictions* (`P(A | a, λ)`) **still satisfy PI empirically.** The influence is "hidden" in the uncontrollable initial positions, preventing FTL signaling. **It bites the bullet on nonlocal causation.** Theo would say this proves his point.
  *   **Everettian (Many-Worlds) Interpretation:** **Preserves both PI and OI *fundamentally* and denies true collapse.** The apparent violation of OI is an illusion. When Alice measures, the universe splits: in one branch she gets `A=+1`, in another `A=-1`. Bob's measurement similarly splits his world relative to his local state. The *correlation* arises because the only branches where Alice *and* Bob exist to compare results are those where their outcomes match the entangled state's prediction. The "nonlocality" is in the global structure of the wave function and the relativity of outcomes across branches, not in any FTL influence. **It locates the weirdness in non-separability (holism) and the ontology of branching.**
  *   **Collapse Theories (GRW, CSL):** Introduce a *stochastic*, **spontaneously localized** collapse process. This collapse is *fundamentally nonlocal*: when a collapse happens near Alice, it instantly reduces the wave function everywhere, including near Bob, affecting the probabilities for Bob's outcome. However, the collapse mechanism is designed to **satisfy PI statistically** – the *average* effect doesn't allow signaling. **It violates OI via a nonlocal physical process (collapse), but carefully restricts it to prevent FTL signaling.**
  *   **Superdeterminism:** **Rejects Statistical Independence (aka "Free Will" or "Measurement Independence").** It challenges the assumption that the experimenter's choice of settings `a` and `b` are statistically independent of the hidden variable state `λ` at the source (`P(λ | a, b) ≠ P(λ)`). If `λ` is correlated with the future settings, the perfect correlations can be explained *locally*. PI and OI *could* both hold. The Bell inequality violation is explained by this correlation, not nonlocality or true randomness. **It dodges Bell's conclusion by rejecting an assumption *before* Locality/Realism.** (This is highly controversial and faces severe fine-tuning objections).
  *   **Orthodox/Copenhagen Interpretation:** Often vague, but generally attributes the violation of OI to the **nonlocal, instantaneous effect of wave function collapse.** Like collapse theories, it posits a nonlocal process but relies on the impossibility of controlling individual outcomes to preserve PI and prevent signaling. The "bullet" is nonlocal collapse.

  **Key Takeaways for Theo:**

  1.  **Bell's "Locality" is Factorizability:** Which combines Parameter Independence (PI - no FTL influence via settings) and Outcome Independence (OI - no correlation beyond local state).
  2.  **Experiments Violate OI, Not PI:** Quantum Mechanics and all viable theories **preserve PI** to prevent FTL signaling. The violation is specifically of **OI** – the existence of irreducible, instantaneous correlations between distant outcomes.
  3.  **Holism, Not Necessarily Causation:** This means the universe exhibits **non-separable correlations**, not necessarily that one measurement *causes* the distant outcome FTL. The "spookiness" is the holistic nature of the entangled state.
  4.  **Interpretations Matter:** While all agree OI is violated and PI holds empirically, they explain *why* very differently:
      *   Bohm: Nonlocal causation (violates PI fundamentally, hides it statistically).
      *   Everett: Branching universe, relativity of outcomes (preserves PI & OI fundamentally).
      *   Collapse: Nonlocal stochastic collapse (violates OI via nonlocal process).
      *   Superdeterminism: Rejects free choice/settings independence (could preserve both PI & OI).
  5.  **Einstein Didn't Quite "Lose":** His core objection to "spooky action" (FTL *causation/signaling*) is upheld – PI holds. However, his hope for a *local* description of reality (Local Realism) is indeed refuted – OI must be violated. The world *is* nonlocal in the sense of having irreducible non-separable correlations (violation of OI).

  Armed with this, you can tell Theo that while Bell's theorem refutes *Local Realism*, the specific nature of the nonlocality revealed by experiments is the violation of **Outcome Independence**, not Parameter Independence. This means instantaneous *correlations* exist, but not FTL *causation* or *signaling*. The "full stop" is on Local Realism, but the *character* of the nonlocality is nuanced and interpretation-dependent. Good luck!
