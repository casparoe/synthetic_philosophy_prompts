  2. **First Degree Entailment (FDE)**: This is a four-valued logic (true, false, both, neither) and is the foundation for LP (which is a three-valued subset by excluding "neither"). FDE can be seen as a general framework that can be interpreted in different ways. It does not force dialetheism because one can use it without accepting that any sentence is both true and false (by restricting to consistent and complete models). However, it does allow for the possibility of dialetheic truth values. But since it is often used as a basis for dialetheism (especially by Priest) and is the logic behind LP, it is often associated with dialetheism. But note: one can use FDE without being a dialetheist (for example, to handle gaps and gluts). So it is less committed than LP.

