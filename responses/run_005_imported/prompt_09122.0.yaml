prompt: |-
  I sit on the board of a mid-sized foundation that funds global-health work, and I'm now facing a live version of a question I've only ever debated on Overcoming Bias and LessWrong. Our executive director wants to settle next year's strategic bet -- bed-net scale-up versus pandemic-preparedness advocacy -- by defining a combined welfare metric (DALYs averted per dollar plus a grantee-capacity index), running conditional prediction markets among staff and trustees on each option, and pre-committing to fund whichever one the market prices higher once trading settles. Half the board is enthusiastic; the other half warns that advocacy's payoff is inherently harder to price, so its market will stay thin and never really get tested -- meaning we'd be dressing up a foregone conclusion as a forecast, with the further risk that a donor leak makes this look like a miniature 2003 DARPA "terrorism futures" episode. Draft the memo I'll circulate before the December board meeting: recommend adopt, reject, or adopt with modifications, with a concrete timeline, and engage the thin-market objection on its own terms rather than just invoking Hanson's standard rebuttal that manipulation is usually self-defeating.
reasoning: |-
  Okay, the user is on the board of a foundation focused on global health. They're facing a strategic decision between funding bed-net scale-up or pandemic-preparedness advocacy. The executive director proposes using prediction markets to decide, but there's concern about thin markets for advocacy. 

  First, I need to understand the core tension. Bed-net programs have clear, measurable outcomes (DALYs averted), while advocacy outcomes are nebulous and long-term. The board is split—half excited about prediction markets, half worried the advocacy market won't function properly. 

  The user's hidden request stands out: they want to address the thin-market objection seriously, not just hand-wave it away with Robin Hanson's usual "manipulation fails" argument. That means I need concrete solutions, not theory. 

  Hmm... the terrorism futures scandal is a real reputational risk. Foundations hate looking foolish or unethical. The memo must preempt that comparison. Also, trustees aren't traders—participation might be low. 

  For modifications: maybe a staged approach? Phase 1 could be a dry run with play money to stress-test the advocacy market. If it flops, we pivot. Phase 2 uses real money but caps stakes to limit noise. 

  Key additions: 
  - A "narrative layer" where advocates justify their bets to enrich the data. 
  - A backup decision rule if markets stay thin. 
  - Explicitly framing this as an experiment, not an oracle. 

  Timeline matters. They need this decided by December, so backward planning from there. Late October setup, mid-November trading, post-Thanksgiving analysis. 

  The tone should balance innovation with prudence—respect both halves of the board. No "fanboyism" for prediction markets; acknowledge limits. 

  ...And crucially, kill the combined metric. Splitting DALYs and capacity avoids muddying the debate. Separate markets for separate bets.
answer: |-
  ## MEMORANDUM  
  **TO:** Board of Trustees, [Foundation Name]  
  **FROM:** [Your Name], Trustee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Prediction Market Proposal for 2024 Strategic Bet & Mitigating Thin-Market Risks  

  **Recommendation: Adopt with Significant Modifications & Concrete Safeguards**  
  While the Executive Director's proposal to use conditional prediction markets (PMs) is innovative and aligns with evidence-based decision-making, the unique risks associated with pricing pandemic-preparedness advocacy necessitate structural modifications. I recommend adoption *only* under the following conditions, designed explicitly to address the "thin-market objection" and reputational risks. **The core flaw in the original proposal is the attempt to force inherently dissimilar interventions (tangible nets vs. intangible advocacy) into a single combined metric via markets likely to have asymmetric liquidity.**

  ### Key Modifications to Address Thin Markets & Objections
  1.  **Abandon the Combined Metric; Run Parallel, Independent Markets:**  
      *   **Market 1:** "DALYs Averted per Dollar" for Bed-Net Scale-Up (over defined 5-year horizon).  
      *   **Market 2:** "Grantees' Policy Influence Capacity Index Change" (over defined 5-7 year horizon). *This metric must be rigorously defined upfront (e.g., weighted score of policy adoption milestones, funding increases from key governments, institutional reforms).*  
      *   **Market 3 (Optional but Recommended):** "Probability of Major Pandemic (WHO PHEIC declared) within 10 years" as a general background market to inform context.  
      *   **Rationale:** Combining metrics forces apples-to-oranges comparisons, guaranteeing the advocacy market will be thinner and noisier. Separating them allows each market to function based on its own inherent tradability and provides clearer signals on *why* one might outperform.

  2.  **Implement a Multi-Stage "Liquidity Engine" for the Advocacy Market:**  
      *   **Stage 1 - Seeding & Education (2 Weeks):**  
          *   Dedicated facilitator runs workshops explaining *only* the advocacy metric, potential influence pathways, and historical analogs.  
          *   Initial seeding trades by ED, senior program staff, and *willing* trustees using play money to demonstrate mechanics and stimulate discussion.  
          *   Anonymous discussion forum opens specifically for Market 2, focusing on evidence for/against influence pathways.  
      *   **Stage 2 - Real-Money Trading with Liquidity Incentives (3 Weeks):**  
          *   **Small Stakes:** Cap individual investments (e.g., $100-$500 max per person per market) to reduce risk, encourage participation, and limit potential "noise" from large manipulative bets.  
          *   **Targeted Incentives:** Offer modest bonuses (e.g., $50 extra charity donation in their name) to the top 3 *traders in Market 2* based on volume *and* final profit (rewarding informed participation, not just gambling).  
          *   **"Designated Market Makers" (DMMs):** Appoint 3-5 staff/trustees *known for skeptical views on advocacy impact* as DMMs for Market 2. Provide them a small additional budget ($500 each) *explicitly* to take the opposite side of trades if they believe the price is wrong, forcing engagement and improving liquidity. Their trades & reasoning (anonymized) become part of the record.  
          *   **Narrative Capture:** Require traders placing larger orders (>$50) in Market 2 to submit a brief, anonymous rationale citing specific evidence or assumptions. This qualitative data supplements the price signal.  
      *   **Stage 3 - Resolution & Analysis (1 Week):**  
          *   Markets close. Analysis focuses not just on final prices but on:  
              *   Trading volume & volatility in each market.  
              *   DMM activity and rationales.  
              *   Key arguments from the discussion forum/narrative capture.  
              *   Comparison against traditional expert elicitation (conducted in parallel, confidentially).

  3.  **Define Clear Decision Rules *Including* Thin-Market Contingencies:**  
      *   **Primary Rule:** If *both* markets achieve a minimum liquidity threshold (e.g., >50 unique traders, >$2000 total volume), fund the option where the *ratio* of (Market Price) / (Baseline Cost-Effectiveness Estimate) is highest. This accounts for differing scales.  
      *   **Thin-Market Contingency:** If Market 2 (Advocacy) fails the liquidity threshold **but** Market 1 (Bed Nets) meets it:  
          *   **Do NOT default to Bed Nets.**  
          *   **Trigger Hybrid Analysis:** Convene a panel (including external experts, skeptical trustees, and DMMs) to review:  
              *   The *direction* and *volatility* of the thin Market 2 signal (even if weak).  
              *   DMM rationales and narrative capture summaries.  
              *   Results of the parallel expert elicitation on advocacy impact.  
              *   The robust Market 1 result.  
          *   This panel makes a final recommendation to the ED/Board within 1 week, bound by the pre-committed process but informed by the *attempted* market and supplemental data.  
      *   **Decision Authority:** ED makes the final call based on the pre-defined rules/panel output, presenting rationale to the Board for ratification.

  4.  **Mitigate Reputational Risk ("Terrorism Futures" Parallel):**  
      *   **Internal Only:** Strictly limit participation to staff and trustees. Absolutely no external donors or public trading.  
      *   **Clear Communication:** Frame this internally as an *experimental decision-aid tool focusing on quantifiable metrics*, not a "bet on human suffering." Emphasize learning.  
      *   **Pre-Brief Key Donors (Post-Decision):** *After* the decision is made (and funded), proactively brief major donors on the *process* used, emphasizing the structured approach, capped stakes, focus on measurable outcomes, and safeguards. Position it as innovative due diligence.

  ### Concrete Timeline
  *   **By Nov 1:** Board votes to approve *Modified Proposal* (Metrics defined, Liquidity Engine plan, Decision Rules, DMMs appointed).  
  *   **Nov 2-15:** Stage 1 (Advocacy Metric Workshops, Play-Money Seeding, Forum Opens).  
  *   **Nov 16 - Dec 6:** Stage 2 (Real-Money Trading with Incentives).  
  *   **Dec 7-13:** Stage 3 (Market Close, Analysis, Hybrid Panel if triggered).  
  *   **Dec 14:** ED Makes Final Funding Decision based on Rules.  
  *   **Dec 15:** ED Presents Decision & Rationale to Board for Ratification at December Meeting.  
  *   **Jan 2024:** Confidential donor briefings (as needed).

  ### Why This Addresses Thin Markets on Their Own Terms
  This modified approach doesn't assume away thin markets; it actively *combats* them through targeted design:  
  1.  **Separation of Metrics:** Prevents the easier-to-price bed-net market from dominating or obscuring the advocacy signal.  
  2.  **Aggressive Liquidity Provision:** DMMs (specifically skeptics) and volume/profit incentives directly counter the "no one wants to trade this" problem by subsidizing and forcing engagement.  
  3.  **Lowered Barriers:** Small stakes and play-money seeding reduce participation friction.  
  4.  **Capturing Sparse Wisdom:** Narrative capture and DMM rationales extract value even from limited trading activity.  
  5.  **Explicit Contingency:** Acknowledges that a truly failed market shouldn't dictate the outcome but ensures the *attempt* informs a structured fallback analysis involving skeptics.  

  This structure transforms the "thin market" from a fatal flaw into a known risk with specific countermeasures and a backup plan. It leverages the PM's potential to surface disaggregated beliefs and hidden insights on advocacy without naively assuming perfect liquidity. The focus shifts from "which market price is higher" to "what did the *process* of trying to price these distinct interventions, with safeguards, tell us?"

  **I recommend we adopt this modified, staged approach.** It preserves the innovative spirit and potential insight gains of the original proposal while directly confronting its most significant practical and reputational risks through concrete design features and contingency planning.

  **Attached:** Draft Detailed Protocol Document (Metrics Definitions, DMM Roles, Incentive Structure, Panel Composition, Comms Plan).
