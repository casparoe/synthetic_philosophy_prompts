  For the ID comparison, Popper's demarcation criterion cuts both ways. While he might sympathize with questioning Darwinism's status, ID's supernatural designer makes it inherently unfalsifiable - precisely what Popper's criterion excludes from science. His later writings clearly treat evolutionary biology as progressing toward testability, whereas ID offers no such pathway. 

