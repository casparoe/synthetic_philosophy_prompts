  The user might be conflating the two because both show majority rule causing incoherence. But structurally, they're different. Condorcet is about preferences over alternatives, while discursive dilemma is about truth evaluations on logically connected propositions. The frameworks are distinct: one uses preference orderings, the other uses logical consistency.

  I should highlight the formal differences. Condorcet's cycles are about binary choices in pairwise comparisons, whereas the discursive dilemma involves a set of premises and a conclusion. The aggregation rules differ too—Condorcet uses pairwise majority, while judgment aggregation uses proposition-wise majority. 

  Also, the discursive dilemma reveals a deeper issue: even if the conclusion is directly voted on, it can contradict the collectively accepted premises. This path-dependence isn't present in Condorcet. Plus, the doctrinal paradox aspect shows that the order of voting matters, which is a new layer.

  The user might be minimizing the discursive dilemma's significance because it feels like a repackaging. But the theoretical implications are broader. Judgment aggregation applies to areas like legal decisions or expert panels where logical consistency matters more than preferences. Condorcet is more about social choice in elections.

  I should also address why theorists see them as distinct. The discursive dilemma generalizes beyond preferences, showing that any aggregation of judgments can face similar issues. It's a formalization that reveals a wider class of problems, not just a special case.

