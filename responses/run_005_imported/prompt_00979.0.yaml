answer: |-
  That's an incredibly sharp observation – you've nailed the core tension between theoretical elegance and practical reality. The disconnect exists because full Kelly *is* mathematically optimal **under its own strict set of assumptions**, which rarely hold in the messy real world of trading or gambling. Here's why fractional Kelly (like 1/2) is overwhelmingly preferred:

  1.  **Parameter Uncertainty & Estimation Error (The Biggest Reason):**
      *   **The Assumption:** Kelly requires *perfectly known* probabilities and odds/edge.
      *   **Reality:** Your edge (`b`) and win probability (`p`) are *estimates*, often with significant error. You might be overconfident in your model, data might be noisy, or market dynamics might shift.
      *   **The Problem with Full Kelly:** If you overestimate your edge even slightly and bet full Kelly, you **massively increase your risk of ruin and volatility**. Full Kelly is hyper-sensitive to input errors. A bet size that's optimal with a true 5% edge can be disastrously ruinous if your actual edge is only 3% or 1%. Fractional Kelly acts as a crucial buffer against this estimation error.

  2.  **Violation of I.I.D. Assumptions:**
      *   **The Assumption:** Outcomes are Independent and Identically Distributed (I.I.D.). Each bet is statistically identical and unaffected by previous bets.
      *   **Reality:** Markets exhibit volatility clustering, trends, mean-reversion, and structural breaks. Gambling outcomes can be correlated (e.g., betting on multiple games influenced by the same weather event). Your model might decay over time. Full Kelly doesn't account for this serial correlation or non-stationarity, leading to overbetting during risky periods.

  3.  **Utility Beyond Pure Geometric Growth:**
      *   **The Assumption:** Your *only* goal is maximizing long-run geometric growth rate (log utility).
      *   **Reality:** Humans and institutions have different utility functions:
          *   **Drawdown Tolerance:** A 50% drawdown with full Kelly might be mathematically "optimal" for long-term growth but is psychologically devastating and practically unsustainable. Most people/firms prioritize capital preservation and sleep at night. Fractional Kelly drastically reduces drawdowns and volatility.
          *   **Risk of Ruin:** While full Kelly theoretically has a zero probability of ruin for positive edge bets with infinitely divisible capital, in practice (finite capital, discrete bets, estimation error), the risk is non-negligible. Fractional Kelly significantly lowers the practical risk of ruin.
          *   **Opportunity Cost:** Preserving capital allows you to capitalize on future, potentially better opportunities that might arise after a drawdown. Blowing up your account/bankroll eliminates this optionality.
          *   **Leverage Costs & Constraints:** Full Kelly might require leverage that is expensive or simply unavailable. Margin calls can force liquidation at the worst times.
          *   **Fees & Slippage:** Transaction costs eat into the edge. Full Kelly doesn't explicitly account for this friction, potentially leading to overbetting relative to net returns.

  4.  **Simultaneous Bets & Correlation:**
      *   **The Assumption:** Kelly is often presented for a single, isolated bet.
      *   **Reality:** Traders/gamblers make *many* bets simultaneously or in rapid succession.
      *   **The Problem:** Calculating the *true* optimal Kelly fraction for a *portfolio* of correlated bets is computationally complex and often intractable. Betting full Kelly on each bet individually *ignores correlation*, leading to massive overexposure during systemic events. Fractional Kelly is a pragmatic way to reduce this aggregate portfolio risk without needing impossibly precise correlation matrices.

  5.  **Psychological Factors & Career Risk:**
      *   **Volatility:** The wild swings of full Kelly can lead to emotional decision-making, abandoning sound strategies at the worst time, or getting fired (for fund managers) after a sharp drawdown, even if long-term prospects were good.
      *   **"Picking Up Pennies in Front of a Steamroller":** Full Kelly on strategies with a small positive edge but a tiny chance of catastrophic loss (e.g., some options strategies, tail-risk hedging) can mathematically work but feels insane in practice because one wipeout destroys years of gains. Fractional Kelly mitigates this.

  **Why Half-Kelly Specifically?**

  Half-Kelly (`f* = (bp - q)/2`) is popular because it offers a remarkably good practical compromise:
  *   **Volatility Reduction:** Cuts variance by ~75% compared to full Kelly.
  *   **Drawdown Reduction:** Drawdowns are roughly half as deep.
  *   **Growth Sacrifice:** Typically only sacrifices about 25% of the long-term growth rate of full Kelly.
  *   **Robustness:** Provides a substantial buffer against estimation error and model misspecification.
  *   **Simplicity:** Easy to calculate and implement.

  **In Summary:**

  | **Factor** | **Full Kelly Assumption** | **Real-World Challenge** | **Fractional Kelly Solution** |
  |------------|---------------------------|--------------------------|------------------------------|
  | **Parameters** | Perfectly known edge and probabilities | Significant estimation errors | Buffers against overestimation |
  | **Market Behavior** | IID outcomes | Volatility clustering, correlations | Adapts to non-stationary markets |
  | **Risk Tolerance** | Pure log utility growth | Human/institutional risk aversion | Manages drawdowns and ruin risk |
  | **Portfolio Complexity** | Single isolated bets | Multiple correlated positions | Pragmatic risk reduction |
  | **Practical Constraints** | Frictionless execution | Leverage limits, fees, slippage | Maintains sustainability |

  Full Kelly is the North Star for *theoretical* optimality under idealized conditions. But the practical universe is filled with asteroids (estimation error), black holes (correlation), and gravitational waves (changing markets). Fractional Kelly, especially half-Kelly, is the robust spacecraft designed to navigate that dangerous reality. Traders aren't leaving *risk-adjusted* growth on the table – they're rationally managing the gap between theory and practice. For your algo-bot, start with fractional Kelly (1/4 to 1/2 is common) – it's the pragmatic choice of those who've survived the markets. The mathematical purity is beautiful, but the real world demands robustness above all else.
