  - Suggest deepening the malaria example's "sign uncertainty" point

  The grade feels like a 7/10 - solid on basics but lacking nuance in the critical evaluation part. I'll make sure the feedback encourages engagement with counterarguments while acknowledging what they got right. 

  ...Double-checking: yep, Greaves' "value uncertainty" critique is exactly the missing piece here. The student needs to see that sometimes you can't even assign meaningful probabilities to distant outcomes.
answer: |-
  Here's the graded evaluation with actionable feedback:

  ```json
  {
    "grade": "7/10",
    "rubric": {
      "distinction_and_attribution": "3/3",
