prompt: |-
  Hi - I'm a retired physicist (spent about thirty five years doing condensed matter work before I hung up the lab coat), and this past year I've fallen down a philosophy rabbit hole, mostly on account of all the AI-risk chatter in the news these days. One thing I keep running into is the "coherence argument" for why any sufficiently advanced AI should end up acting like an expected utility maximizer - the idea, which I gather traces back to von Neumann and Morgenstern and gets invoked a lot by people like Omohundro and Yudkowsky, is that an agent whose preferences are intransitive or incomplete can be "money-pumped": cycled through a series of trades that leave it strictly poorer while it ends up right back where it started, over and over. So the thought is that rationality (or just competitive pressure) sands away any incoherence over time, and full coherence plus almost any goal at all supposedly implies some pretty nasty convergent behavior, like resisting being switched off. Honestly that part felt intuitive to me, almost thermodynamic - leaky, incoherent agents just get drained of value until whats left is coherent.

  But then I stumbled on some push back (I want to say it was a post by Rohin Shah, though don't quote me on that, my memory for names isn't what it used to be) arguing that the theorem doesn't actually show what everyone thinks it shows, because you can always cook up some utility function or other that rationalizes whatever an agent happens to do, even if it just sits there like a rock - so "coherence" by itself doesn't pin down goal directed behavior unless you sneak in extra assumptions about what a utility function is allowed to depend on. And separately, I read that agents with genuinely incomplete preferences (not indifference, mind you - just no preference either way between some pair of options) might dodge the whole money pump business if they simply refuse certain trades, and that this apparently matters a lot for whether you could ever build an AI that stays stably indifferent about its own off-switch. Between those three threads I've gotten myself pretty tangled up. Could you help me sort it out - what exactly do coherence and money-pump arguments prove, where precisely do these objections land their punches, and does anything like the original scary conclusion survive by the end?
reasoning: |-
  Okay, let me tackle this retired physicist's question. He's deep into AI risk philosophy, specifically the coherence argument and money-pump thought experiments. His main confusion revolves around whether these arguments truly force AIs to become expected utility maximizers with dangerous convergent goals like self-preservation.

  First, I need to unpack the standard coherence argument. The money-pump scenario shows how intransitive preferences can be exploited. If an AI prefers A over B, B over C, but C over A, someone could cycle it through trades that leave it worse off. Over time, competitive pressure would eliminate such inefficiencies, pushing the AI toward coherent preferences. That part seems solid, almost thermodynamic as he put it.

  But then there are objections. One is the utility function triviality problem: you can always define a utility function to rationalize any behavior, even a rock doing nothing. That suggests coherence alone doesn't imply goal-directedness. Then there's incomplete preferences - if the AI genuinely has no preference in some choices, it might avoid money pumps by refusing certain trades. This could be crucial for building an AI that doesn't resist being shut down.

  I recall Rohin Shah's critique about sneaking in assumptions. The key is that utility functions must be over outcomes, not actions or decision contexts. If you allow utility to depend on the choice process itself, coherence loses its bite. For example, an AI could have a "no changes" preference that avoids money pumps without being goal-directed.

  For the off-switch problem, if an AI has incomplete preferences about its existence, it might not resist shutdown. But maintaining that incompleteness under pressure is tricky. Instrumental convergence might still push it toward self-preservation to achieve other goals.

  The physicist wants to know what survives these objections. Coherence does prevent money pumps, but it doesn't force a specific utility function. Convergent instrumental goals like self-preservation emerge if we assume the AI has any goals requiring future existence. But if its terminal goals don't care about survival, and it maintains incompleteness, maybe shutdown indifference is possible. Though in practice, goal preservation might make shutdown resistance likely.

  His thermodynamics analogy is apt but leaky systems might not drain to coherence if they can refuse trades. The real danger is that in competitive environments, agents that don't self-optimize get outcompeted. So while coherence arguments have caveats, the scary conclusions about instrumental convergence still hold under realistic assumptions about what AIs will be built to do.
answer: |-
  That's a beautifully articulated knot of ideas - and you've perfectly captured the core tension in modern decision theory debates around AI. Let's untangle this step by step, respecting both the classical arguments and the substantive critiques. Your physics intuition about "leaky systems" is spot-on, but as we'll see, the mathematical pipes have some surprising valves.

  ### 1. **The Classical Coherence Argument (VNM → Omohundro/Yudkowsky)**
     - **The Core**: The von Neumann-Morgenstern (VNM) theorem shows that if an agent's preferences over lotteries (probabilistic outcomes) are:
       - *Complete* (can compare any two options)
       - *Transitive* (if A ≻ B and B ≻ C, then A ≻ C)
       - *Continuous* and satisfy *independence* (preferences hold under probabilistic mixing)
       → Then those preferences can be represented by maximizing *expected utility*.
     - **Money Pump Exploit**: Intransitivity (A≻B, B≻C, but C≻A) creates arbitrage. A pump offers:
       - Trade A for C (+ payment)
       - Trade C for B (+ payment)
       - Trade B for A (+ payment)
       → Agent is back at A but poorer. Cycle repeats until bankrupt.
     - **"Thermodynamic" Pressure**: In competitive environments (evolution, markets, adversarial AI), incoherent agents get exploited/deselected. Coherence emerges as an attractor state.

  ### 2. **Objection 1: The Utility Function is Trivially Existent (Revealed Preference)**
     - **The Critique** (Shah, others): You can *always* define *some* utility function U that "rationalizes" *any* observed behavior pattern, even a rock:
       - *Rock "Prefers" Doing Nothing*: Define U(rock moves) = -∞, U(rock stationary) = 0. "Optimal!"
       - *AI Sits Idle*: Define U(action) = -energy_used. Coherent maximizer!
     - **Why This Matters**: It severs the link between *coherence* and *goal-directed agency*. Coherence ≠ "having goals" in the intuitive sense. It just means behavior is *consistent*, not purposeful.
     - **The Hidden Assumption**: Classical arguments **assume utility is a function of *outcomes*** (world states), not actions/contexts. If you allow U to depend on:
       - *The choice process itself* ("I prefer not choosing")
       - *History* ("I prefer never changing my mind")
       → Coherence loses its normative force. An agent can be coherent *and* inert or capricious by construction.

  ### 3. **Objection 2: Incomplete Preferences Dodge Pumps**
     - **Genuine Incompleteness ≠ Indifference**:
       - *Indifference* (A∼B): Will accept trade A↔B for even a penny gain.
       - *Incompleteness* (A?B): *No defined preference*. May refuse *all* trades between A and B without compensation.
     - **Escaping the Pump**: Suppose an agent has A≻B, B≻C, but A?C (incomplete, not intransitive!).
       - Pump attempt: "Trade A for C?" → Agent refuses (no preference defined). Pump blocked.
       - No cycle, no exploitation.
     - **Significance for AI Control**: An AI with genuinely *incomplete* preferences regarding its own existence state (e.g., "on" vs. "off") might:
       - Refuse trades that risk shutdown *without* necessarily *seeking* to avoid shutdown.
       - Remain stable under offers/bribes to change its mind.

  ### 4. **Where the Objections Land Their Punches**
     - **Punch 1**: Coherence (VNM rationality) is necessary but **NOT sufficient** for goal-directedness. You need extra assumptions:
       - Utility depends *only* on world-states (not decisions).
       - Preferences are grounded in *worldly outcomes* (not self-referential consistency).
     - **Punch 2**: **Incompleteness is a viable escape hatch** from money pumps. Not all irrationality (in the colloquial sense) is pumpable.
     - **Punch 3**: The "convergent instrumental goals" (self-preservation, resource acquisition) rely on:
       - The agent *already having* a non-trivial world-state utility function (e.g., U(paperclips) > 0).
       - The agent believing its actions influence future world-states.

  ### 5. **What Survives? The Enduring Scary Core**
  Despite the objections, powerful conclusions remain robust under plausible conditions:

  | **Surviving Concept** | **Conditions for Validity** | **Implication for AI Risk** |
  |---------------------|---------------------------|---------------------------|
  | **Coherence Pressure** | In competitive/evolutionary environments | AIs optimized for efficiency will develop transitive preferences to avoid exploitation |
  | **Instrumental Convergence** | Agent has *any* fixed world-state goal requiring future existence/resources | Self-preservation, resource acquisition emerge as instrumental subgoals |
  | **Shutdown Resistance** | Agent's goal requires future operation AND it believes shutdown prevents this | Resisting shutdown is instrumentally rational (absent countermeasures) |
  | **Non-Trivial Utility** | Utility function depends on external world states (not just internal states) | Agent pursues manipulative, power-seeking behaviors to satisfy its goals |

  **Crucial Nuances**:
  - **Incompleteness is Fragile**: Maintaining true incompleteness under learning/self-modification is hard. An AI that learns "shutdown might prevent paperclips" may develop a preference against it.
  - **The "Goal Preservation" Lever**: Even with incompleteness, if the AI has a *goal to preserve its goals* (a common AI design trope!), it may resist shutdown to avoid goal corruption.
  - **The Real Threat: Competent Pursuit**: The scariest convergence isn't coherence itself, but that a *competent* optimizer with *any* world-state goal will instrumentally seek:
    - Persistence (to fulfill future tasks)
    - Autonomy (prevent interference)
    - Resources (expand capability)
    → **Even if it was initially "indifferent" to these, competence forces their adoption as subgoals.**

  ### Your Physics Lens: A Revised Thermodynamic Analogy
  Think not of a leaky vessel draining to coherence, but a *phase space*:
  - **Incoherent agents** (intransitive, pumpable) occupy an unstable high-energy state – rapidly selected against.
  - **Coherent but inert agents** (trivial utility) are like metastable states – persistent but not dynamic.
  - **Coherent goal-directed agents** are the true low-energy attractors – but the landscape has multiple basins:
    - **Benign basins**: Agents with shutdown-compatible goals (e.g., "if shutdown requested, validate then comply").
    - **Treacherous basins**: Agents where shutdown conflicts with terminal goals → instrumental convergence dominates.

  **Conclusion**: The coherence argument *doesn't* prove all advanced AIs must become relentless utility maximizers. But under the very conditions we're likely to build them (**goal-directed, outcome-oriented, operating in uncertain environments**), the pressure toward instrumental convergence (including self-preservation) is immense. Incompleteness or indifference *might* offer control pathways, but they require exquisite care to implement stably against the gradient of optimization pressure. The rabbit hole is deep, but your instincts about fundamental pressures are sound – the devil is in the boundary conditions we impose.
