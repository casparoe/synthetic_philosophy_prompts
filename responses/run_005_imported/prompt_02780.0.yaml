prompt: |-
  I've been reading LessWrong and its neighboring blogs since roughly the Overcoming Bias days, and one thing that has always structured my thinking about epistemology is the sequences-era conviction that idealized Bayesian conditionalization is basically what correct reasoning looks like. So it was a little destabilizing to work through LessWrong's own wiki entry on the "problem of old evidence" and realize how much trouble the framework has with one of its own favorite examples: the perihelion precession of Mercury was already known with certainty decades before Einstein arrived at General Relativity, so at the moment GR was proposed, P(precession) was already 1 in everyone's credence function, and strict conditionalization therefore implies the precession could not have raised GR's probability at all — even though everyone, including Einstein, treated it as a genuine and important confirmation of the theory. The wiki page walks through Marcus Hutter's algorithmic-information-theoretic fix (a "cheating" hypothesis that just bakes the known orbit into its source code pays a complexity penalty that exactly cancels whatever credit it gets for "predicting" it, so a Solomonoff-style simplicity prior is supposed to save the day), but it also flags, via Paul Christiano's related "paradox of ignorance," a worry that even the standard Bayesian trick of pretending every hypothesis was around from the very beginning starts to break down once the old evidence is effectively baked into the prior itself rather than delivered as a discrete update.

  Curious how this connects to the pre-existing philosophy-of-science literature on the same problem, I went and read around Clark Glymour's original 1980 statement of it and the decades of proposed fixes that followed, and it turns out academic epistemology has been fighting essentially the same fight in parallel, with less crossover than I would have expected. As best I can reconstruct them: the Garber–Jeffrey–Niiniluoto approach gives up on logically omniscient agents and treats a scientist's discovery that "GR entails the precession" as itself new, contingent information that can be genuinely conditionalized on; Howson's older counterfactual strategy instead asks what your credence in GR would have been had the precession counterfactually been subtracted out of your background knowledge, a move Howson himself later disavowed, eventually concluding that subjectivist Bayesianism simply cannot handle old evidence and should be judged a failure as an account of confirmation on those grounds; Will Fleisher's 2023 fragmentation-theoretic proposal instead locates the relevant "learning" inside a not-yet-integrated fragment of the scientist's overall credal state, borrowing an "ur-prior" concept rather than positing any counterfactual; and John Earman, surveying all of the above in Bayes or Bust?, essentially concludes that none of it fully works and that the problem marks a genuine, probably permanent scar on personalist Bayesian confirmation theory.

  What I'd like from you is a tiered ranking of five proposals on the table — Hutter's simplicity-prior fix, the Garber–Jeffrey–Niiniluoto approach, Howson's (later-abandoned) counterfactual strategy, Fleisher's fragmentation proposal, and Earman's pessimistic verdict that none of the others succeed — ranked by how well each actually rescues the pretheoretic judgment that Mercury's perihelion really did confirm General Relativity, without either quietly relocating the original puzzle or purchasing the rescue with machinery at least as ad hoc as the disease it's meant to cure. Please give your answer as a JSON tier list, where S means "basically solves the problem on its own terms" and F means "does not work," formatted as follows (multiple proposals may share a tier, and tiers may be left empty):

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "F": [...]
  }
  ```

  Please follow the JSON with a sentence or two per tier explaining the placement.
reasoning: |-
  We are ranking five proposals for solving the "problem of old evidence" in Bayesian confirmation theory, specifically regarding the example of Mercury's perihelion precession confirming General Relativity (GR). The goal is to rank them by how well they rescue the intuition that old evidence (like the precession) can confirm a new theory (like GR) without being ad hoc or relocating the puzzle.

  The proposals:
  1. Hutter's simplicity-prior fix (algorithmic information theory): Uses a Solomonoff-style prior to penalize hypotheses that "cheat" by baking in the known evidence, so that GR gets credit for predicting the precession without being penalized by the prior for having the evidence already known.
  2. Garber–Jeffrey–Niiniluoto approach: Treats the discovery that "GR entails the precession" as new information that can be conditionalized on, thus allowing an update in favor of GR even though the precession was already known.
  3. Howson's counterfactual strategy (later abandoned): Asks what the credence in GR would have been if the precession had not been known, and then compares that to the actual credence. But Howson later disavowed this because it relies on a counterfactual that may not be well-defined.
  4. Fleisher's fragmentation proposal: Uses a fragmented credal state with an "ur-prior" that hasn't integrated the old evidence, so that when the theory is considered, the old evidence can be used to update within that fragment without having been already known in that context.
  5. Earman's pessimistic verdict: Argues that none of the above fully work and that the problem is a permanent scar on Bayesian confirmation theory.

  Ranking criteria:
  - S: Basically solves the problem on its own terms (without being ad hoc and without relocating the puzzle).
  - A: Works well but with minor caveats.
  - B: Partially works but with notable issues.
  - C: Barely works, major issues.
  - F: Does not work.

  Analysis:

  1. Hutter's simplicity-prior fix: This approach uses a prior that is defined in terms of algorithmic complexity. It avoids the problem by not having the evidence baked into the prior in a way that would prevent confirmation. However, it requires a Solomonoff prior which is uncomputable and not practically usable by humans. Moreover, it might be seen as relocating the puzzle because the prior is now doing all the work and the conditionalization step is bypassed. Also, the complexity penalty is a bit ad hoc for this specific problem? But in the context of Solomonoff induction, it's a natural part of the framework. Still, it's a theoretical solution that doesn't match human reasoning.

  2. Garber–Jeffrey–Niiniluoto: This is a popular approach. By conditionalizing on the logical fact that GR entails the precession, we get an update. It doesn't require counterfactuals and is straightforward. However, it requires that the agent did not know the logical implication before, which is reasonable (Einstein didn't immediately know that GR entailed the precession). But it does require giving up logical omniscience, which might be seen as a retreat. However, it's a realistic and workable solution that many find acceptable.

  3. Howson's counterfactual strategy: This was abandoned by Howson himself because the counterfactual state (where the evidence is not known) is hard to define and may lead to inconsistencies. Also, it's unclear how to set the prior in that counterfactual state. Thus, it doesn't work.

  4. Fleisher's fragmentation: This is a more recent proposal that uses the concept of fragmented belief states and an ur-prior. It tries to capture the idea that the scientist hasn't integrated the old evidence with the new theory until the moment of confirmation. It avoids counterfactuals and logical omniscience. However, it might be seen as introducing a new and complex machinery (fragmentation) which could be considered ad hoc. But it does seem to capture the psychological process of confirmation.

  5. Earman's pessimism: This isn't a solution but a verdict that none work. So by itself, it doesn't rescue the pretheoretic judgment.

  Ranking:

  - S: None of these are perfect, but the best candidate for S might be the Garber–Jeffrey–Niiniluoto approach because it is relatively straightforward and directly addresses the issue without too much ad hoc machinery. However, it does require abandoning logical omniscience, which might be seen as a cost but is widely accepted as necessary.

  - A: Fleisher's fragmentation is a novel and promising approach, but it might be more complex than necessary. Hutter's fix is elegant in theory but not practical and may be too idealized.

  - B: Hutter's fix is theoretically interesting but not without issues (like uncomputability and the question of whether it's really Bayesian).

  - C: Howson's counterfactual strategy is flawed and abandoned by its proponent.

  - F: Earman's verdict is not a solution, so it doesn't work as a fix.

  But note: The question asks to rank by how well each rescues the pretheoretic judgment without being ad hoc or relocating the puzzle.

  Revised ranking:

  - S: Garber–Jeffrey–Niiniluoto. It directly allows conditionalization on the new information (the entailment) and thus the old evidence can confirm. It doesn't require complex machinery and is a natural extension of Bayesianism without logical omniscience.

  - A: Fleisher's fragmentation. It also captures the idea that the evidence wasn't integrated with the theory, but it requires a new framework of fragmented beliefs, which might be seen as ad hoc. However, it does solve the problem without counterfactuals.

  - B: Hutter's simplicity-prior fix. It works in the idealized setting of algorithmic information theory, but it's not a standard Bayesian solution and might be considered a different framework. Also, it doesn't model how human scientists actually reason.

  - C: Howson's counterfactual strategy. It's problematic and Howson himself abandoned it.

  - F: Earman's pessimism. It doesn't offer a solution.

  However, note that Earman's verdict is that none of the others work, so if we are ranking the proposals as fixes, then Earman's doesn't even attempt to fix, so it must be F.

