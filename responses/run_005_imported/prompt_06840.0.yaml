answer: |-
  ## Sidewalk Debate (Desert Payment Paradox)

  **Characters:**  
  *   **ALEX:** Lean, pragmatic, wiping dust from his eyes. Causal Decision Theorist.  
  *   **SARAH:** Observant, intense gaze fixed back down the road. Dispositionalist.  
  *   *(Setting: Hot sidewalk on the edge of a dusty desert town. A battered pickup truck disappears around a corner.)*

  **SARAH:** Okay, she’s gone. Let’s go pay her. Diner’s probably got a phone, we can call a cab after.

  **ALEX:** Pay her? Sarah, we’re *here*. We made it. Mission accomplished.

  **SARAH:** We promised. She drove us forty miles through that oven. Saved our dehydrated hides.

  **ALEX:** Exactly. *Past tense*. The ride happened. Done. Paying her now doesn’t *cause* us to have gotten the ride. It doesn’t reach back in time and make her pick us up. That decision is fixed. History.

  **SARAH:** (Turns sharply) And if she *knew* we’d think like that? That weird vibe she had? She practically *smelled* intentions. If she thought we were CDT bots, she’d have left us baking on the asphalt back there!

  **ALEX:** (Shrugs, but looks uncomfortable) Maybe. But she didn’t. She picked us up. That’s the *actual* past. Right now, standing here? Paying costs us $20 each we desperately need for a motel and food. Not paying gains us that $20. The causal chain *from* paying *to* our survival? Broken. It’s severed. Paying now is pure cost, zero benefit. Irrational.

  **SARAH:** Benefit? Alex, look at me. We *are alive*. That’s the benefit! The benefit was *conditional* on her *believing* we’d pay. Her belief was based on *what kind of people we are* – or at least, what kind of decision-makers. If we *are* the kind who only look at immediate, local causality *after* the fact… then next time, someone *like* her *won’t pick us up*. We *die*.

  **ALEX:** Next time is hypothetical! This is *now*. This specific choice. You’re conflating types and tokens. My *disposition* might be relevant *for future interactions*, but this is *one* interaction, concluded. The cost/benefit is isolated.

  **SARAH:** Is it? What *is* your disposition, Alex? Is it some abstract label, or is it *exactly this tendency to make choices like this one*? If your disposition *is* "only pay if it causally benefits you *right now*," then anyone who can sniff that out – like she clearly could – *will treat you accordingly*. They won’t give you the ride in the first place! Your 'rational' choice *now* is only possible *because* your disposition *wasn’t* fully transparent or acted upon *before*. But it *is* being revealed *now*.

  **ALEX:** So I should… what? Pretend to be someone I’m not? Pay *irrationally* just to maintain a facade? That’s self-deception! Rationality has to mean making the best choice *with the information you have now*.

  **SARAH:** No! Rationality gets scored *ex ante*, Alex! *Before* the choice! It’s about the *policy* you carried into that truck. The policy "always keep promises, even when locally costly" *got us the ride*. That policy *works*. The policy "only pay if it causes a benefit right now" *wouldn’t have gotten us the ride*. It *fails*. *That’s* why paying now *is* rational – it’s acting *consistently* with the successful policy that saved us. Breaking the promise reveals we were running the *failing* policy all along… meaning we shouldn’t have gotten the ride. We *should* be dead.

  **ALEX:** (Kicks a pebble, frustrated) That… that feels like cheating. Like rewarding past behavior that’s already paid off. It’s sunk cost fallacy dressed up.

  **SARAH:** It’s acknowledging that *what we are* – our decision-making architecture – *is part of the causal landscape*. She didn’t just react to our words; she reacted to *us*. To the kind of agents we signaled we were. If we signal we’re untrustworthy *now*, we confirm her worst assessment. And we doom our future selves. *Not* paying is locally rational but globally suicidal. *Paying* is locally costly but proves the globally successful policy. That’s not irrational; it’s *meta*-rational. Now, are you coming? Or do you want to test your theory next time you’re stranded?

  *(Sarah starts walking determinedly towards the diner. Alex hesitates, staring at the $20 bill in his hand, then the vanishing dust trail of the truck. He glances at Sarah’s retreating back, then down the endless road they just left. He pockets the bill, takes a deep breath, and jogs after her.)*

  ---
  **Word Count:** 498

  **Key Elements:**
  1.  **Stakes & Setting:** Concrete survival scenario replaces abstract boxes. Driver's lie-detection makes dispositions causally relevant.
  2.  **Core Conflict:** Alex focuses on *isolated choice causality* ("Past is fixed, paying now does nothing"). Sarah focuses on *dispositional consistency* ("The successful policy *requires* paying now to validate its past/future effectiveness").
  3.  **Engagement:** Alex *does* engage with "you'd be dead" – he admits the driver *might* have left them, but argues *that specific past is fixed now*. Sarah counters that *this choice reveals the disposition* that *would have* gotten them killed, making it globally self-defeating.
  4.  **No Strawmen:** Alex's position is logically coherent (causality *is* asymmetric). Sarah's position isn't mystical; it's about the consequences of revealed decision-rules in a world where others observe/anticipate them.
  5.  **"Rational Irrationality":** Sarah explicitly argues paying is "locally costly but globally successful," tying the action to validating the *ex ante* rational policy.
  6.  **Ambiguous Ending:** Alex's hesitation and action show internal conflict, not capitulation. The philosophical debate isn't "solved," but the practical choice is made.
