answer: |-
  ## MEMORANDUM

  **TO:** Members, State Parole Board  
  **FROM:** [Your Name], Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Resolution of Conflicting Risk Scores & Proposed Standing Policy for Actuarial Risk Assessment Interpretation  

  ### I. The Present Case: Inmate [Inmate ID/Name - Optional]
  The conflicting risk scores presented (6%, 24%, 38%) illustrate a fundamental challenge inherent in actuarial risk assessment: **the reference class problem.** No single comparison group uniquely defines an individual's "true" risk. All three figures are mathematically valid interpretations of the *same* underlying data, reflecting different, defensible choices about which historical group provides the most relevant comparison.

  *   **The Attorney's Narrow Group (6%):** Maximizes specificity but suffers from extreme small sample size (n=17). While intuitively appealing, such small groups are highly unstable and vulnerable to random variation; they offer poor predictive power and are statistically unreliable.
  *   **The Victim's Family's Broad Group (38%):** Maximizes sample size but potentially sacrifices relevance. Grouping all offenders within a broad offense category ignores critical individual differences (age, program completion, etc.) known to impact recidivism. This risks over-generalization.
  *   **The Instrument's Default Group (24%):** Represents the tool's designed and validated balance. It was selected based on statistical analysis during development to optimize predictive accuracy *across the population* while maintaining reasonable group sizes and incorporating key factors. It undergoes ongoing validation.

  **Recommendation for This Case:** **Utilize the instrument's default score (24%) as the primary actuarial reference point for decision-making.**  

  **Reasons:**  
  1.  **Designed Validity:** The default grouping reflects the tool's intended structure, chosen based on rigorous development and validation processes aimed at maximizing overall predictive accuracy and fairness.  
  2.  **Statistical Stability:** It avoids the pitfalls of both extremes – the unreliability of very small groups and the potential irrelevance of overly broad groups.  
  3.  **Consistency & Fairness:** Adhering to the default output ensures consistent application across all cases, preventing individualized "data shopping" that could introduce bias or arbitrariness.  
  4.  **Transparency:** The default score is transparently generated by the adopted tool. Alternative calculations, while informative context, represent external interpretations.  

  **However, the 6% and 38% figures are not irrelevant.** They serve as crucial context highlighting the *sensitivity* of the risk estimate to grouping choices. The panel should explicitly note this range in the record and consider what it signifies: this inmate's profile sits near a boundary where classification significantly impacts the computed risk. This sensitivity, combined with the clinical assessment of the individual (his hearing presentation, institutional record, release plan, victim impact), must inform the holistic judgment required for the parole decision. The actuarial score is a vital input, not the sole determinant.

  ### II. Proposed Standing Policy: Handling Multiple Defensible Comparison Groups
  The reference class problem is inherent and unavoidable. A bigger dataset might create more *potential* groups but doesn't resolve *which* group is "correct" for a unique individual. Therefore, we need a policy that acknowledges this reality while ensuring consistency, fairness, and reliance on the best available evidence.

  **Proposed Policy:**  

  1.  **Primary Reliance:** The actuarial risk score generated by the Board-adopted risk assessment instrument **using its standard, default comparison groups and methodology** shall serve as the primary actuarial input for parole decisions. This score is presumed valid based on the tool's development and validation.  
  2.  **Presentation of Alternative Analyses:**  
      *   Parties (defense, prosecution, victim representatives) may submit alternative risk calculations derived from the *same underlying dataset* used by the instrument.  
      *   **Admissibility Criteria:** Any alternative calculation must:  
          *   Be statistically valid and methodologically sound.  
          *   Clearly define the alternative comparison group(s) and selection criteria.  
          *   Demonstrate relevance to the specific inmate's characteristics beyond mere data manipulation.  
          *   Avoid reliance on groups with sample sizes below a minimum threshold (e.g., n=50; TBD by Board/statistician consultation) due to instability.  
  3.  **Board Consideration of Alternatives:**  
      *   Alternative calculations are **not** treated as competing "true" scores but as **contextual information** illuminating the sensitivity and limitations of the risk estimate.  
      *   The Hearing Panel **must** acknowledge the existence and range of alternative defensible estimates in the record.  
      *   The Panel should consider *why* alternatives yield different results (e.g., emphasizing very specific factors vs. broad categories) and what this implies about the inmate's profile.  
      *   **Deviation from Default:** The Panel may accord significant weight to an alternative analysis **only if**:  
          *   It meets the admissibility criteria.  
          *   It demonstrates a *compelling and statistically robust justification* for why the alternative group is *more relevant* for *this specific individual* than the default group, based on factors not adequately captured by the default model.  
          *   The justification is explicitly documented in the hearing record.  
  4.  **Holistic Integration:** The default actuarial score, contextualized by any admissible alternatives and their implications, **must be integrated with** the panel's clinical assessment of the individual inmate (based on the hearing, file review, institutional behavior, release plan, victim statements, etc.) to reach a final decision. The actuarial score informs but does not replace human judgment.  
  5.  **Transparency:** The rationale for relying primarily on the default score, or for significantly weighting an alternative, must be clearly articulated in the decision record.  

  ### III. Rationale for Proposed Policy
  *   **Acknowledges Reality:** Accepts the reference class problem without futilely seeking a nonexistent "perfect" group. Bigger data doesn't fix this fundamental epistemological issue for individuals.
  *   **Prioritizes Validated Methodology:** Centers the decision on the tool *as adopted and validated*, ensuring we leverage its intended predictive power and avoid arbitrary deviations.
  *   **Ensures Consistency & Fairness:** Prevents case-by-case "group shopping" that could lead to inconsistent or biased outcomes. All inmates are evaluated against the same standard baseline.
  *   **Manages Subjectivity:** Provides clear guardrails for considering alternative analyses, preventing unstructured clinical judgment from completely overriding the tool while still allowing for justified, documented exceptions.
  *   **Promotes Transparency:** Requires explicit documentation of how risk scores were considered and integrated, enhancing accountability and understanding.
  *   **Balances Structure & Flexibility:** Maintains the core benefit of actuarial tools (structure, reduced bias) while allowing for nuanced consideration in cases where the default grouping seems demonstrably ill-fitting *for identifiable, documentable reasons*.
  *   **Practical & Actionable:** Provides a clear, implementable framework for the current case and future recurrences without requiring new data, tool redesign, or paralysis.

  ### IV. Conclusion
  The case before us underscores that actuarial tools are powerful guides, not infallible oracles. The inherent uncertainty in selecting a comparison group mandates a structured approach. I recommend resolving **Inmate [ID/Name]**'s case by utilizing the **default score of 24%** as the primary actuarial input, explicitly acknowledging the presented range (6%-38%) as context for the estimate's sensitivity, and integrating this with a thorough clinical assessment.

  Further, I propose adopting the standing policy outlined above. It respects the science behind the instrument we adopted, manages the unavoidable reference class problem transparently, ensures consistency, and provides a principled, documented basis for decisions when multiple risk figures arise. This approach allows us to leverage actuarial tools effectively while fulfilling our duty to make individualized, holistic parole determinations.

  I urge your support for this approach at our vote on the 14th.
