  can you rank the major competing explanations of the effect - knobe's own "concept is normative" view, the pragmatics account, machery's trade-off hypothesis, sripada's deep self concordance model, the motivated-bias accounts (alicke's culpable control stuff, nadelhoffer, etc), and the uttich & lombrozo norm-based theory-of-mind account (add more if you think im missing an important one) - by how well they actually explain the full pattern of results, not just the original CEO vignette but stuff like the epistemic side-effect effect and the cross-cultural replications too.

