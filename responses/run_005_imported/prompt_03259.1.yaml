prompt: |-
  I'm revising my seminar notes on Hume's discussion of promising and keep getting stuck on the same footnote. By this point in Book III, Part II, Section 5 of the Treatise ("Of the obligation of promises"), Hume has already argued that the "act of the mind" supposedly expressed by a promise can be neither a resolution, nor a desire, nor a willing of the promised action itself, and so — if it is anything — must be a willing of the obligation that the promise creates. In a note appended to that discussion (Treatise 3.2.5, n. 77, SBN 517–18), he tries to block an escape route available to a rationalist about morality. Here is the note in full, spelling unmodernized:

  "Were morality discoverable by reason, and not by sentiment, 'twou'd be still more evident, that promises cou'd make no alteration upon it. Morality is suppos'd to consist in relation. Every new imposition of morality, therefore, must arise from some new relation of objects; and consequently the will cou'd not produce immediately any change in morals, but cou'd have that effect only by producing a change upon the objects. But as the moral obligation of a promise is the pure effect of the will, without the least change in any part of the universe; it follows, that promises have no natural obligation. Shou'd it be said, that this act of the will being in effect a new object, produces new relations and new duties; I wou'd answer, that this is a pure sophism, which may be detected by a very moderate share of accuracy and exactness. To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination. 'Tis impossible, therefore, we cou'd ever will a new obligation; and consequently 'tis impossible the will cou'd ever accompany a promise, or produce a new obligation of morality."

  I can follow the reasoning as far as "it follows, that promises have no natural obligation." But the move from the imagined objection to the charge of "pure sophism," and from there to the regress, compresses several steps into very few words. Could you reconstruct that regress premise by premise: what, exactly, would have to be true of "willing a new relation of objects" for the will to be forced to "return upon itself in infinitum" rather than simply succeeding in creating the relation at a stroke? And is this note doing independent argumentative work against a rationalist who thinks morality "consists in relation," or is it, at bottom, the same point Hume already made in his own sentimentalist terms earlier in the section, merely restated in the rationalist's vocabulary?
