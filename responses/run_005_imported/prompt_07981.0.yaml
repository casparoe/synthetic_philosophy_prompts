  Okay, let me unpack this user's query. They had a debate with Priya about whether Aquinas would justify a foreign intelligence service assassinating a foreign dictator. The user initially thought Aquinas's tyrannicide argument gives a green light, but Priya argued it's more nuanced, involving distinctions between usurpers and oppressive rulers, and requiring public authority. Their unresolved point was whether an outside state's covert action could ever count as legitimate public authority under Aquinas's framework.

  First, I need to recall Aquinas's exact position. From the Summa Theologiae, Question 42, he distinguishes between usurpers (illegitimate rulers) and tyrants who started legitimately but became oppressive. The usurper isn't a true authority, so killing them isn't tyrannicide but removing a private aggressor. For legitimate rulers turned tyrants, Aquinas allows removal only through public authority, not private individuals. The public authority requirement prevents chaos and ensures the act serves the common good, not personal vendettas.

  Now, applying this to a modern drone strike by an outside state. The key issues are agency and jurisdiction. Aquinas's public authority is the tyrant's own community—their citizens or institutions. An external state isn't part of that political community. Even if the tyrant is a usurper, the outside state would be acting as a foreign power, not as the aggrieved community. Covert actions bypass any due process, which Aquinas emphasizes. The UN Security Council might be a modern analog to public authority, but unilateral actions don't qualify.

  The user wants a clear verdict for Priya. Aquinas would reject the drone strike because it lacks the proper authority and due process. It's not tyrannicide but an act of war. The distinction between usurpers and tyrants is crucial here, but even for a usurper, an external hit fails Aquinas's criteria. The user needs this to settle their debate, so I'll structure the answer with Aquinas's position, then a direct application to the scenario, ending with a definitive "no."
answer: |-
  Here's a breakdown of Aquinas's position and the verdict you're looking for:

  **Aquinas's Actual Position on Tyrannicide (Summa Theologiae, I-II, Q. 42, A. 2 & II-II, Q. 64, A. 3):**

  1.  **The Crucial Distinction (Usurper vs. Legitimate Tyrant):**
      *   **Usurper (Tyrannus Absque Titulo):** This ruler seized power *illegitimately* (through force, fraud, etc.). Aquinas argues this person **never possessed true public authority** in the first place. They are fundamentally a *private aggressor* against the common good and the rightful political order. Killing such a person is **not technically "tyrannicide"** in the sense of killing a ruler; it's more akin to killing a dangerous criminal or defending the community against an invader. It's potentially licit for *anyone* acting for the common good (though prudence and proportionality still apply).
      *   **Oppressive Ruler (Tyrannus Ab Exercitio):** This ruler was *legitimately* installed (e.g., elected, inherited properly) but then *became* tyrannical, ruling for their own benefit, not the common good. Here, Aquinas is **extremely cautious**.

  2.  **The "Public Authority" Requirement (Why it Matters):**
      *   **For Legitimate Tyrants:** Aquinas **firmly rejects** private individuals assassinating a ruler who was legitimately installed, *no matter how oppressive*. His reasoning is profound:
          *   **Preserving Order:** Private individuals lack the authority to judge and execute the ruler. Allowing this creates chaos, vigilantism, and invites worse tyranny as factions vie for power through assassination.
          *   **Authority's Source:** Legitimate authority, even when abused, stems from God (or the natural order/community). Only a *higher* or *constituted public authority* within that same political community possesses the right to judge and depose the ruler. This could be:
              *   The community itself acting through a representative body (like nobles, elders, or an assembly).
              *   A superior authority (like an Emperor over a King, if applicable).
          *   **Due Process:** Removal should follow a public judgment and process, not stealth. This maintains the rule of law and legitimacy for the successor.
      *   **For Usurpers:** While theoretically open to action by individuals, Aquinas *still prefers* action by some form of constituted public authority within the oppressed community, as this is more orderly and clearly serves the common good. He doesn't explicitly *require* it for usurpers like he does for legitimate tyrants, but it's the strongly implied prudent course.

  **Aquinas's Verdict on a Modern Covert Drone Strike by an Outside State:**

  Based strictly on Aquinas's principles as outlined above, **he would categorically reject the legitimacy of a foreign state's covert assassination of *any* ruler, whether a usurper or a legitimate tyrant, as "tyrannicide."**

  Here's why it fails his criteria:

  1.  **Fatal Authority Problem:** The core failure is the "public authority" requirement. The foreign intelligence service/drone operator **is not acting as a public authority *within the tyrant's political community***.
      *   Aquinas's "public authority" is explicitly the authority *of the community suffering under the tyrant* (or a superior within *that* hierarchy, like an Emperor). An outside state is a fundamentally *different* political community with its own separate authority structure.
      *   Acting against the ruler of *another* community is not exercising *public authority* over that ruler; it's an act of one state against another. This makes it **fundamentally an act of war or aggression**, not tyrannicide.

  2.  **Usurper Scenario Doesn't Save It:** Even if the target is a clear usurper (Tyrannus Absque Titulo):
      *   Aquinas envisions action by the *aggrieved community* or its representatives. A foreign state is not part of that community.
      *   The foreign state is acting based on *its own* interests and judgment, not as an agent *of* the oppressed community exercising *its* authority.
      *   Covert action bypasses any semblance of public judgment or due process, which Aquinas values even in removing usurpers.

  3.  **Legitimate Tyrant Scenario Fails Harder:** If the tyrant was legitimately installed, the failure is absolute. Only the tyrant's *own* community (or its superior) has the authority to judge and remove them. A foreign assassination is the ultimate violation of this principle – the epitome of a private, external actor usurping the judgment and authority that belongs solely to the afflicted political community.

  4.  **Covert Nature Compounds the Problem:** The stealth and deniability inherent in covert ops are anathema to Aquinas's emphasis on public judgment and due process. Tyrannicide, for him, is a public act restoring order under authority, not a hidden strike.

  **The Verdict for Priya:**

  **Aquinas would say: "No. A foreign state's covert assassination of a dictator, regardless of whether he is a usurper or a legitimate ruler turned tyrant, is never legitimate 'tyrannicide' under my framework. It fundamentally lacks the requisite 'public authority' – which must be the authority *of the tyrant's own community* or its superior. Such an act is not tyrannicide at all; it is an act of war by one state against the ruler of another state, which must be judged by the very different criteria governing the justice of war (jus ad bellum), not the criteria for removing a domestic tyrant."**

  **In short:** Priya is correct. Aquinas's insistence on the "public authority" being *internal* to the political community suffering the tyranny is the insurmountable barrier for justifying foreign covert action as tyrannicide. He would see it as a category error.
