prompt: |-
  Me and my friend Priya got into a whole thing last night about whether it'd ever be okay for, like, a country's intelligence service to just quietly kill a foreign dictator -- drone strike, poisoning, whatever -- instead of going through the whole song and dance of war or sanctions. I brought up Aquinas, who I read a chunk of for a medieval philosophy seminar, and said his tyrannicide stuff was basically a green light for this kind of thing. Priya, who remembers her assigned reading better then I do, pushed back hard: she said his actual view is way more hedged, and turns on a distinction between a ruler who seized power illegitimately in the first place (a usurper, never a true public authority to begin with) versus one who was properly installed and only later started governing badly -- and that even in the case where he's most permissive, he still wants any removal to go through some kind of public or communal authority rather than whoever privately decides a given ruler needs to go. We argued in circles for like an hour about whether a foreign government's black-ops team could ever count as "public authority" in his sense, or whether that's a category error since he was obviously picturing the tyrannized community acting against its own ruler, not some outside power reaching in from elsewhere.

  Neither of us could settle it, so I want your take. First lay out what Aquinas's actual position on licit tyrannicide is -- the usurper/oppressive-ruler distinction and why it matters, and what work the "public authority" requirement is doing and why he insists on it -- and then use that to give me your honest best guess at how he'd rule on a modern covert drone strike carried out entirely by an outside state, with zero involvement from anyone inside the tyrant's own country. Does that ever clear his bar for legitimate tyrannicide, or does it fail on authority grounds no matter how bad the tyrant is, making it a totally different question about one state's use of force against another rather than tyrannicide at all? Don't just tell me "it's complicated" -- I want an actual verdict I can bring back to Priya.
