  So a few weeks back I went down one of those internet rabbit holes about the axiom of choice, starting with the Banach-Tarski thing (splitting a solid ball into a handful of weird pieces and reassembling them into two balls the same size as the original - still messes with my head, not gonna lie). Somewhere in there I kept running into "Zorn's Lemma" getting mentioned like it's basically the axiom of choice's sidekick, and apparently its actually logically equivalent to it, and also to this other thing called the well-ordering theorem, which says you can supposedly line up even the real numbers in an order where every non-empty chunk of them has a smallest member (which sounds nuts to me - real numbers don't feel like something you can just "line up" like that). I tried reading the actual statement of Zorn's Lemma and it's all "chains" and "upper bounds" and "maximal elements" of a "partially ordered set," and my eyes kind of glazed over, but heres the thing that's actually bugging me: the axiom of choice, phrased as "you can always grab one item out of each box in a giant pile of boxes, even infinitely many boxes," sounds like the most obvious thing in the world to me. Zorn's Lemma gives me no gut feeling at all - I genuinely can't tell if it's obvious or insane, even though apparently it's the exact same fact just wearing different clothes. I even asked my brother about it and he just said "they're the same thing lol," which, cool, but that's not actually an answer.

  I'm not a math person, so I'm not asking for a formal proof of why they're equivalent - I'll take that part on faith. What I actually want is for you to properly compare Zorn's Lemma with the "boxes" version of the axiom of choice, as ideas, not as symbols. Why does one register as plain common sense to a normal person while the other registers as nothing at all? What is Zorn's Lemma really asking you to accept once you strip away the chains-and-upper-bounds packaging, and is that hidden thing actually just as intuitively fine as picking-from-boxes, or is there something genuinely dicier buried in there that the boxes framing hides from you? As a bonus: if I go around using Zorn's Lemma the way mathematicians apparently do all the time (like to show every vector space has a basis), am I just as on the hook for weird stuff like Banach-Tarski as someone who openly admits to accepting the axiom of choice, or is there some wiggle room there? I'd like you to actually pick a side on which one deserves more trust, rather than just telling me they're proven equivalent so it doesn't matter - that's the non-answer I'm trying to get past.
