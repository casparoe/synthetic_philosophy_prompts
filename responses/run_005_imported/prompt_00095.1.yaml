    where μ = P(B1 | P1 chose C in Stage 1) = ε / [ε + q(1-ε)] 

  If we assume that R1 in Stage 1 chooses C (q=1), then μ = ε / [ε + 1*(1-ε)] = ε.

  So R2 will choose C if ε > 1/3.

  Then the expected payoff to R1 from choosing C in Stage 1 is:
     - if P2 is B2 (prob ε): R1 gets 3.
     - if P2 is R2 (prob 1-ε): then if ε>1/3, R2 chooses C, and then in Stage 3, R1 chooses T and gets 3.
                       if ε<=1/3, R2 chooses T, and R1 gets 0.

  Therefore, if ε>1/3, expected payoff = ε*3 + (1-ε)*3 = 3.
     Since 3>1, R1 chooses C.

   if ε<=1/3, expected payoff = ε*3 + (1-ε)*0 = 3ε.
     Choose C if 3ε>1 -> ε>1/3, which is not true for ε<=1/3.

  Therefore, in equilibrium, for ε>1/3, R1 chooses C and then in Stage 2, R2 chooses C, and in Stage 3, R1 chooses T. 
     Outcome: Stage 3 termination by P1 -> (3,1)

  For ε<=1/3, R1 chooses T in Stage 1 -> (1,0)

  So cooperation (continuing) only happens when ε>1/3.

  To get cooperation for arbitrarily small ε, we need more stages. For example, in a long centipene game, the required ε for cooperation in early stages can be small. 

