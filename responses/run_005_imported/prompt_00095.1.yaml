  Could you construct a concrete example—with a small number of rounds and explicit payoffs—where you walk through how the standard common-knowledge-of-rationality argument forces one equilibrium, but where perturbing the epistemic assumptions (say, each player assigns even epsilon probability to the other being a "always cooperate until round k" type) radically changes the predicted outcome? I'd like the example to make vivid exactly which premise is doing the work: is it common knowledge itself, or the assumption that off-path behavior doesn't update beliefs, or something else entirely?
