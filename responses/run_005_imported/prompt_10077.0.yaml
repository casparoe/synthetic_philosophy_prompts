answer: |-
  Here's a 5-minute speech weaving the handicap principle into a heartfelt toast, designed to resonate with both experts and non-experts while staying warm and celebratory:

  ---

  **The Speech:**

  (Loud clink on glass) Everyone, gather ‘round! For those who don’t know me, I’m [Your Name], the incredibly proud, slightly nervous, and frankly *relieved* older brother of the groom. Relieved, because after years of watching [Brother's Name] meticulously calculate the cost-per-scoop of ice cream… finding someone incredible like [Bride's Name] felt like winning the lottery! Seriously, we love you, [Bride's Name]. Welcome to the family – chaos and all.

  Now, being best man means you get to dig up a few stories. And anyone who knows [Brother's Name] knows he has… let’s call it a *deep appreciation* for value. (Smile, light laughter). He’s the guy who’ll drive an extra ten miles to save three cents on gas. Who still has the receipt from a sandwich he bought in 2017… just in case. We love him for it! It’s part of his… unique charm.

  Which is why, when we heard what he did for the proposal, our jaws didn’t just drop – they practically needed retrieval from the basement. See, [Brother's Name] knew how much [Bride's Name] values family. And he knew the most important people to her, her parents and both her grandmothers, were oceans away. So, what did Mr. Frugality himself do?

  **(Lean in, lower voice slightly for emphasis)** He quietly, secretly, spent *months* of savings. Not on a flashy ring, not on a fancy trip just for them… but on plane tickets. To fly her parents, and both her grandmothers, all the way here. Just so they could be part of that moment. He orchestrated this whole surprise, bringing her entire world together for the most important question of his life.

  **(Pause for effect)** And when we heard that story? We didn't just believe he loved her. We *knew* it. Instantly. Deep in our bones. Why? Because it wasn't just expensive. It wasn't just grand. **It was costly in a way that only [Brother's Name] could truly feel.** For anyone else, flying family over might be a generous gesture. But for *him*? Spending months of savings like that? That wasn't just opening his wallet; that was fundamentally rewriting his own rulebook. It was proof written in a language he *never* speaks: extravagance. And that made it utterly, undeniably real.

  **(Shift tone to more reflective, but warm)** You see, the most powerful proof of commitment often isn't the easy gesture. It's the one that carries a real cost, a genuine sacrifice, *especially* when that cost hits *you* right where it counts. It’s the gesture that says, "This matters so much to me, I'm willing to pay a price *I* would normally find unthinkable." That’s not just spending money; that’s investing a piece of your very nature. That’s the kind of proof that silences any doubt. Because it’s impossible to fake. Only the real thing could justify that kind of personal cost.

  **(Turn directly to the couple)** [Brother's Name], that day, you showed everyone who you truly are for [Bride's Name]: someone willing to move mountains, or at least navigate complex international flight itineraries, to make her world complete. You proved your love not despite the cost, but *because* of the profound cost *it represented to you*. That’s the foundation of something incredible.

  And [Bride's Name], you saw that. You understood the depth of what that gesture meant, coming from *him*. You recognized that incredible signal for what it was – the real deal.

  **(Raise glass)** So, here’s what your marriage teaches us: True love isn't about finding someone where everything is easy. It’s about finding someone worth the effort, worth the sacrifice, worth changing your own rules for. It’s about building a partnership where you both willingly carry what matters to the other, even when it’s heavy. Where the "cost" is just another word for "commitment."

  To [Brother's Name] and [Bride's Name]! May your life together be filled with joy that makes every effort worthwhile, with a love that’s proven genuine not by its ease, but by its depth and the beautiful, unique sacrifices you’ll gladly make for each other. Cheers!

  ---

  **Why this works:**

  1.  **Accessible Core Story:** The brother's frugality and the grand gesture are front and center, told engagingly. Everyone gets the emotional impact.
  2.  **Nuanced Handicap Principle (For Experts):** The key lines ("costly in a way that only [Brother's Name] could truly feel," "rewriting his own rulebook," "proof written in a language he never speaks," "pay a price *I* would normally find unthinkable," "impossible to fake") capture the essence:
      *   **Signal Credibility:** The gesture is credible *because* it's costly *specifically to the signaler* (his frugality).
      *   **Unfakeability:** A less committed person (or a generally spendthrift person) couldn't fake the *personal sacrifice* it represented *for him*. The cost is differential.
      *   **Honest Signal:** It reliably indicates his true commitment level.
      *   Experts will recognize this instantly without jargon.
  3.  **No Lecture, Just Insight:** The biological theory is translated into universal human terms – sacrifice, cost, proof, changing your nature. It feels like a profound emotional observation, not science.
  4.  **Emphasis on the "Why" it Mattered:** It explicitly links the *nature* of the cost (it being *his* weakness) to why the family believed it instantly.
  5.  **Connects to Marriage:** It seamlessly pivots the concept into a broader metaphor for marriage – mutual effort, sacrifice, and commitment.
  6.  **Tone:** Stays warm, humorous (early on), heartfelt, and celebratory. It's a toast first.
  7.  **Flow:** Natural progression: Intro -> Brother's character -> The gesture -> Why it was uniquely powerful (the handicap insight) -> What it reveals about him -> What it reveals about her seeing it -> Toast connecting it to their future.

  **Delivery Tips:**

  *   **Pace:** Don't rush the description of the gesture or the "why it mattered" section. Let the weight of it sink in.
  *   **Emphasis:** Stress the key phrases mentioned above (e.g., "*only [Brother's Name] could truly feel*", "*rewriting his own rulebook*", "*pay a price I would normally find unthinkable*").
  *   **Eye Contact:** Connect with the couple during the direct address to them, and sweep the room during the toast.
  *   **Humor:** Keep the early frugality jokes light and affectionate. The focus quickly shifts to admiration.
  *   **Heart:** Let your genuine pride and love for your brother and happiness for the couple shine through, especially at the end.

  This speech honors the profound truth behind your brother's action using the handicap principle's logic, while ensuring every single guest feels the warmth, humor, and love of the moment. Good luck! He's lucky to have you.
