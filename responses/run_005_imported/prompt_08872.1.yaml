answer: |-
  Here's a structured analysis comparing the etiological (selected-effects) and causal-role accounts regarding exaptation, using feathers as a case study. I'll address your core concerns about historical scope, theoretical principledness, and liberalness, concluding with a verdict.

  ### **1. Core Accounts & Exaptation Challenge**
  - **Etiological Account (Wright/Millikan/Neander):**  
    A trait's function is the effect for which it was *historically selected* (its "proper function"). For feathers, the original thermoregulatory effect explains their evolutionary origin and fixation.  
    *Problem with exaptation:* If flight is a *new* effect maintaining feathers *now*, but thermoregulation explains their *origin*, the account risks assigning thermoregulation as the "true" function, misdescribing current biology.  

  - **Causal-Role Account (Cummins):**  
    A trait's function is its *current causal contribution* to a containing system's capacity (e.g., flight in birds). Functions are context-dependent and forward-looking.  
    *Problem with exaptation:* Feathers contribute causally to *both* thermoregulation and flight. How do we non-arbitrarily privilege flight as "the" function without smuggling in history or norms?

  ### **2. Etiological Responses to Exaptation**
  - **Godfrey-Smith's "Modern History" Move:**  
    Restrict function attribution to effects maintained by selection in the *recent past* (e.g., the last 5–10% of a trait's history). For feathers, flight (not thermoregulation) is the function because it’s the effect under *current* selective maintenance.  
    - **Principled or Ad Hoc?**  
      - **Principled:** Aligns with the etiological core (selection shapes function) while acknowledging evolution’s dynamism. Selection acts *now* to maintain traits; "recent" selection reflects current adaptive pressures (Godfrey-Smith, Griffiths).  
      - **Potential Ad Hoc:** "Recent" lacks a strict definition. Yet, "modern" selection can be grounded in population genetics: if current fitness differences depend on flight (not thermoregulation), flight is the function. **Verdict: Principled refinement**, not a patch.  

  - **Griffiths' "Stabilizing Modern History":**  
    Functions require *ongoing* stabilization by selection. Thermogenesis ceased to stabilize feathers once insulation was decoupled from fitness (e.g., in flying birds). Flight now provides stabilizing selection.  
    **Advantage:** Avoids arbitrary historical cutoff; focuses on *current* maintenance.

  ### **3. Causal-Role Response to Exaptation**
  - Cummins can assign flight as the function *if* we analyze feathers within the context of the bird's *flight system*. Thermoregulation is a causal effect but not the system capacity of interest.  
    - **Liberalness Worry:**  
      Without specifying the "relevant system," feathers could have infinite functions (e.g., display, buoyancy).  
    - **Mitigation Strategies:**  
      1. **Contextual Constraints:** Functions are relative to a *specific investigative context* (e.g., "How do birds fly?").  
      2. **Fitness Integration:** Some hybrid accounts (e.g., Buller) link causal roles to *current fitness contributions*. Flight may be the primary fitness-enhancing effect.  
    **Problem:** This risks covertly reintroducing selectionist norms. Pure causal-role lacks resources to privilege *fitness-critical* effects over incidental ones.

  ### **4. Verdict: Which Handles Exaptation Better?**
  **The etiological account (with modern-history refinements) succeeds more robustly** for three reasons:

  1. **Explanatory Power for Normativity:**  
     Etiology captures why flight is the *proper* function of feathers in birds: failure to facilitate flight impairs fitness, while failure in thermoregulation may not (e.g., in warm climates). Causal-role can’t explain this normativity without teleology.  

  2. **Theoretical Cohesion:**  
     Godfrey-Smith/Griffiths’ moves extend the etiological core (selection explains function) to dynamic evolution. "Recent" selection isn’t arbitrary—it’s defined by *current* stabilizing pressures. By contrast, causal-role must borrow norms from elsewhere (e.g., fitness) to avoid liberalism, undermining its anti-historical stance.  

  3. **Alignment with Biological Practice:**  
     Biologists ask, "What is this trait *for*?" expecting an answer grounded in evolutionary maintenance (e.g., "Feathers are *for* flight"). Etiology delivers this; causal-role often defaults to "what it does now," which conflates function with mere causal contribution.

  ### **5. Remaining Challenges**
  - **Etiology:** Must clarify "recent" selection (e.g., is it 1,000 vs. 1 million years?) without circularity. Griffiths' "stabilizing" criterion avoids this by focusing on *ongoing* selection.  
  - **Causal-Role:** Can handle exaptation descriptively but struggles to explain why flight is *functionally significant* while thermoregulation is not—without implicitly appealing to selection history.

  ### **Conclusion**
  The **modern-history etiological account** (e.g., Griffiths, Godfrey-Smith) best resolves exaptation. It assigns flight as the function for feathers in birds by tethering function to *current selective maintenance*, not ancient origins. This refinement is **principled**: it retains the selected-effects core while accommodating evolution’s temporal layers. Causal-role, while flexible, either dissolves normative distinctions or covertly relies on etiological criteria to avoid liberality—failing to provide a self-sufficient solution. For philosophy of biology, this suggests that a historically informed teleology remains indispensable for functional ascriptions in evolving systems.
