  **Key Difficult Calls Explained:**  
  - **Insulin Pump (A-tier)**: Meets all criteria *except* arguably "cognitive" function (it manages physiological processes, not beliefs). But its seamless, trusted integration and role in decision-making (dosing) push it toward extension.  
  - **Married Couple (A-tier)**: Perfectly satisfies criteria *if* we accept shared interbrain systems. The hitch is Clark & Chalmers explicitly avoid "other minds" to prevent overextension—but this deep interdependence tests that boundary.  
  - **AI Chatbot (B-tier)**: Fails on *conscious endorsement* (you didn’t author/verify the source) and *reliability* (LLMs hallucinate). It’s a parasitic tool, not a reciprocal extension.  
  - **Tarot App (C-tier)**: Meets reliance/access/automatic-use criteria, but lacks *truth-tracking* and *endorsement* (you admit it’s arbitrary). It extends superstition, not cognition.  

  **Quick Rejects**:  
  - **Pianist (F)**: Bodily skill (internalized competence), not external resource.  
  - **Palm Notes (F)**: Episodic, not constant/reliable integration.  
  - **Textbook (F)**: Archived memory, not active process.  

  **Tier Logic**: S-tier perfectly mirrors Otto; A-tier has functional parity with minor quibbles; B/C fail core criteria but superficially resemble extension; F-tier is categorically distinct. The GPS case is *stronger* than people assume—its decade-long trust and atrophy of internal capacity make it a near-perfect cognitive prosthesis.
