  Then Rachel introduces ergodicity economics, saying VNM averages across parallel worlds, but real wealth is non-ergodic. She claims maximizing time-average growth (log utility) is necessary. Sam replies that this presupposes long-run growth as the goal, which is a preference, not a requirement.

