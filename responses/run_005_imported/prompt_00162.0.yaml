  So my editor just sent back notes on my new manuscript and next to the big twist ending she only wrote "well, that's certainly one way to do it." No other comments anywhere near it. My co-writer swears this is just a polite way of saying its bad, but I feel like if she hated it she'd just say so directly. Is there some actual logic to how we're supposed to read into flat, neutral-sounding comments like that instead of just what they literally say? Feels like theres some pattern to how people mean more than their words on the surface, and I want to understand it well enough to use it in dialogue too, not just decode my editor.
