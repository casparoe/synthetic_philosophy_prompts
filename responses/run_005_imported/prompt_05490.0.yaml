  So I've been down a Lucas-Penrose rabbit hole for a philosophy of math reading group I'm in (my actual PhD is in proof theory, not philosophy), and I want to sanity check something with you. The standard move against Lucas's 1961 argument is that he never actually shows the human mind is consistent, he just needs to assume it, and the second incompleteness theorem means that's not something you can establish from inside the system anyway. Penrose supposedly reworks the whole argument in Shadows of the Mind to run on soundness rather than mere consistency, specifically to dodge that objection. Can you compare the two versions and tell me wheter swapping in soundness actually gets Penrose out of the Putnam/Benacerraf-style trap, or if it just relocates the same unearned assumption one level up? And which version, if either, do you think is the more serious anti-mechanist argument?
