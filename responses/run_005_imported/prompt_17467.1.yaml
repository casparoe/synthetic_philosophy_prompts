prompt: |-
  I don't work in ethics myself (philosophy of language is more my thing), so I've been chewing on this without really having the tools to sort it out, and it's been bugging me since a faculty meeting last week. We have a colleague — call her Meera, not her real name — who for years has done a ton of stuff for our job-market students that was never part of anyone's actual job: mock interviews on weekends, marathon calls about cover letters, checking in individually with every student every week each fall. None of it was ever asked of her, and nobody else does anything close to it. The problem is it's quietly become the expectation. Our newest hire, who just does the ordinary required advising and nothing more, is getting side-eyed by students and even a little by the chair, like he's shirking something, even though there's nothing beyond standard advising in his contract or anyone else's. Meanwhile Meera is completely burnt out and would love to scale back, but feels like she can't without everyone concluding she's stopped caring.

  Something about this feels philosophically off in a way I can't quite pin down. The whole point of doing more than duty strictly requires is supposed to be that no one else is on the hook for not doing it themselves — thats what's supposed to make it praiseworthy rather than merely expected. But here, doing it seems to have generated a new hook for everybody, including, weirdly, future-Meera. When I brought this up, a friend in ethics just said "yeah, that's basically why people fight over whether moral saints are even a coherent ideal to hold up," which didn't fully clarify things for me. Could you actually walk me through what's going on here in careful terms — is this a recognized problem, does it suggest that the whole category of act I'm gesturing at is less stable than it looks, and is there a principled way for Meera to pull back that doesn't just amount to "stop being so nice"? And please don't just tell me "people have different role-obligations" — that's true but it's clearly not what's actually bothering me about the case.
reasoning: |-
  Okay, the user is a philosophy of language professor who's grappling with an ethical dilemma from their workplace. They've observed how a colleague's extraordinary voluntary efforts (Meera) have unintentionally created new expectations that now pressure others and trap Meera herself. The user wants this analyzed philosophically, not just as a matter of role obligations. 

  Hmm, what's really nagging at them isn't the surface-level unfairness but the conceptual contradiction: supererogatory acts are supposed to be beyond duty, yet here they've rewritten duty itself. That's fascinatingly paradoxical. The ethics friend's comment about moral saints gives me a starting point - this connects to debates about whether exemplary goodness can exist without distorting moral norms.

  Let me unpack this systematically. First, the core issue is the transformation of supererogation into obligation through social perception. Meera's acts started as clearly supererogatory: unpaid, outside job descriptions, exceeding institutional norms. But repetition and visibility made them seem part of "how we do things here." This is a textbook case of norm creep. 

  The philosophical tension arises because supererogation relies on a bright line between duty and extra, but social practice constantly redraws that line. Bernard Williams' work on moral luck seems relevant here - Meera's good intentions had the bad luck of creating a new moral trap. And Margaret Urban Walker's expressive-collaborative model explains why the community's interpretation matters as much as individual intent.

  What's especially cruel is how this binds Meera temporally. Her past generosity becomes a debt she must keep paying, a "supererogatory mortgage" as it were. The user's phrase "future-Meera" is perceptive - it's a form of moral hysteresis where the system retains the memory of her sacrifice.

  For solutions, mere role-obligation talk won't suffice because the problem is meta-ethical. We need to separate the act's original status (supererogatory) from its current perception (expected). A performative speech act might help: Meera could formally declare she's returning to baseline duties while affirming their adequacy. That leverages the user's philosophy of language expertise - using language to reshape reality.

  The chair's role is crucial too. By publicly affirming current standards as sufficient, they can absorb the normative shock of Meera stepping back. Otherwise students will perceive it as loss rather than normalization.

  Ultimately this shows supererogation's fragility. It exists in a social ecosystem where repeated extraordinary acts become ordinary through familiarity. That doesn't make supererogation incoherent, just context-dependent - which is why Meera can still reclaim it by strategically withdrawing.
answer: |-
  This is a profound and beautifully articulated ethical dilemma that cuts to the heart of supererogation, moral expectations, and the social dynamics of virtue. Your instinct that something philosophically "off" is happening is spot-on. Let's break it down carefully:

  ### 1. The Core Problem: The Transformation of Supererogation into Obligation
     *   **Supererogation Defined:** Acts that are morally praiseworthy but *beyond* what duty requires. Their moral value *depends* on their being optional and non-obligatory. (Think saints, heroes, extraordinary generosity).
     *   **The Mechanism of Transformation:** Meera's acts *started* as supererogatory. However, through consistent performance, visibility, and perceived benefit:
          *   **Descriptive Norm → Prescriptive Norm:** What *is* done (Meera's practice) becomes what *should* be done. Students and the Chair now perceive her level of effort as the baseline "good advising," not the exceptional "extraordinary advising."
          *   **Benefit Dependency:** The tangible benefits (intensive support) become integrated into students' expectations of departmental support. Withdrawing them feels like a loss of a service they've come to rely on, not the cessation of an optional bonus.
          *   **Reciprocity & Fairness Distortion:** Colleagues who perform only their contractual duties now appear, by comparison, to be doing *less than* what is "normal" or "expected" within *this specific context*, even though they are meeting the formal standard. This creates unfair negative judgments (side-eye).
          *   **The "Moral Saint" Bind:** By setting an extraordinarily high bar through voluntary action, Meera inadvertently redefined the local moral landscape. Future-Meera is now judged against *Meera's own past standard*, not against the formal job description or reasonable expectations. Scaling back looks like moral backsliding, not a return to normalcy.

  ### 2. Recognized Problems This Illustrates
     *   **The Problem of Moral Over-Demandingness:** If supererogatory acts become obligatory, morality becomes impossibly demanding. If *everyone* must be a "moral saint" to be considered minimally adequate, the category collapses under its own weight. Your ethics friend was hinting at critiques of "moral sainthood" as an ideal (e.g., Susan Wolf's "Moral Saints").
     *   **The Erosion of Supererogation:** This case demonstrates how fragile the supererogatory space is. Social perception and institutional inertia can easily convert "above and beyond" into "the new minimum." This challenges the stability of the category in practice, even if it remains coherent in theory.
     *   **The Tyranny of "Nice":** Meera is trapped by the perception that her "niceness" (extra effort) is an essential character trait. Reducing effort is misread as a character flaw ("stopped caring") rather than a rational adjustment to unsustainable demands. This exploits her goodwill.
     *   **Institutional Injustice:** The department (represented by the Chair's implicit endorsement through side-eye) is *free-riding* on Meera's unpaid labor and allowing it to distort performance evaluations of others. This creates an unjust situation where meeting contractual obligations is penalized relative to an unofficial, unsustainable standard.

  ### 3. Why "Different Role-Obligations" Doesn't Cut It
  You're right to dismiss this. The problem isn't that Meera has different *formal* obligations. It's that her *voluntary supererogation* has *created new, informal, and unfair obligations* for *everyone else* (colleagues to match her effort, students to expect it, future-Meera to sustain it). The baseline itself has shifted illegitimately.

  ### 4. A Principled Way for Meera to Pull Back (Beyond "Stop Being Nice")
  The key is to **explicitly re-establish the normative boundary** between contractual obligation and supererogation. This requires strategic communication and institutional support:

  *   **Meera's Action (Reframing the Narrative):**
      1.  **Acknowledge the Shift & Her Burnout (Privately to Chair):** "Chair, I need to discuss the advising situation. For years, I provided X, Y, Z support because I cared deeply and had the capacity. However, this level is unsustainable and has led to burnout. Crucially, I realize my voluntary efforts have unintentionally created expectations that go far beyond anyone's job description, including mine. This is unfair to [New Hire] and creates an impossible standard. I need to scale back to the contractual standard for my own well-being and to restore a fair baseline for everyone."
      2.  **Public Communication (Managed with Chair):** This is delicate. Meera shouldn't apologize for scaling back, but frame it as a *return to normalcy* and a *correction of expectations*. With Chair support:
          *   **Option A (Meera & Chair Jointly):** Chair announces a "departmental review of student support structures." They affirm the *formal* advising requirements as sufficient and commendable. They *thank* Meera for her "exceptional past contributions *above and beyond* her role" but state clearly that "such intensive support was never a formal expectation and is unsustainable long-term. Moving forward, all faculty advisors will focus on providing the excellent standard support outlined in our contracts." Meera can briefly echo this: "I'm grateful I could offer extra support when possible, but I'm confident our core advising meets all professional standards."
          *   **Option B (Chair Leads):** Chair proactively addresses the department (or just students, if appropriate) *before* Meera scales back significantly: "I want to clarify expectations around faculty advising. Our contractual commitments [list them] represent the high standard we expect all faculty to meet. Some faculty, like Meera, have generously provided *additional* support at times, but this was always voluntary and beyond their required duties. It should not be seen as the expected standard, nor should colleagues adhering to the formal standard be judged negatively. We value the excellent work all our advisors do within their defined roles." This shields Meera and legitimizes the scaling back.
      3.  **Consistent Modeling:** Meera must visibly adhere *only* to the contractual standard after the reset. Refer students seeking "extra" back to the Chair or department resources. Be warm and supportive *within* the defined role.

  *   **The Chair's Crucial Role (Restoring Justice):**
      1.  **Public Affirmation:** As above, clearly state the formal standard as sufficient and praise-worthy. Explicitly decouple adherence to the contract from judgments about "caring."
      2.  **Protect the New Hire:** Call out any unfair criticism: "[New Hire] is meeting all their advising obligations excellently. Our expectations are based on the contract, not on individual past practices that were always voluntary extras."
      3.  **Address the Systemic Gap (If Real):** If students genuinely *need* more support than the contract provides, the Chair must advocate for *institutional solutions* (e.g., dedicated career advisor, structured peer mentoring, funded workshops) – *not* rely on exploiting individual faculty goodwill. This removes the justification for the inflated expectations.
      4.  **Support Meera:** Publicly frame her scaling back as responsible and necessary, not a loss of caring.

  ### 5. Philosophical Implications: The Fragility and Power of Practice
  This case highlights that moral categories like supererogation aren't static. They exist within a social ecosystem:

  *   **Practice Defines Norms:** Consistent action, even if initially supererogatory, can reshape what a community perceives as normal, expected, or obligatory. Moral boundaries are permeable through social practice.
  *   **The Danger of Uncritical Virtue:** Unilateral, uncoordinated supererogation, while individually virtuous, can create systemic distortions and unfair burdens if not carefully managed within an institution. Virtue needs context-sensitivity.
  *   **The Necessity of Meta-Ethics:** Maintaining the supererogatory space requires *active work* – clear communication about norms, distinguishing between baseline and extra, and institutional structures that prevent the exploitation of the virtuous. It doesn't happen automatically.

  **In Conclusion:** What's "off" is the alchemy turning gold (supererogation) into lead (coerced obligation). It *is* a recognized pitfall of exemplary behavior. While supererogation remains a coherent *concept*, its *practice* is vulnerable to social reinterpretation. The principled escape for Meera requires a deliberate, collaborative effort (especially from the Chair) to *reassert the normative boundary* linguistically and institutionally, framing her reduction not as "being less nice" but as a *necessary correction* to restore fairness, sustainability, and the true meaning of going "above and beyond." It requires using the tools of language (your field!) to reshape the social reality that her actions inadvertently created.
