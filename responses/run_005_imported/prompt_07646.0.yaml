prompt: |-
  I'm taking a seminar this semester on the semantics of conditionals, and last week's session centered on the classic puzzle of why indicative and counterfactual conditionals can diverge in truth value even when they look like minimal variants of one another. The standard illustration is the Oswald/Kennedy pair: "If Oswald didn't kill Kennedy, someone else did" (which nearly everyone accepts) versus "If Oswald hadn't killed Kennedy, someone else would have" (which nearly everyone rejects), despite the two sentences appearing to share the same antecedent and consequent. Afterward, two classmates of mine, Jonah and Sasha, kept arguing about it over coffee, and I mostly just listened, since I could see something to each side and didn't want to nudge the discussion either way.

  (1) Jonah opened by saying the pair shows that "if" is ambiguous between two genuinely distinct conditional operators, an indicative one and a counterfactual one, since nothing else could explain how two conditionals sharing an antecedent and consequent diverge in truth value; if "if" had a single meaning, he said, changing the mood alone shouldn't flip the verdict. (2) Sasha answered that this proves too much, because the two conditionals were never being evaluated against the same set of worlds to begin with: on her view, both are handled by one mechanism along the lines of a Ramsey test, where you provisionally add the antecedent and see what follows, but the indicative version is restricted to worlds compatible with what conversational participants already accept (so it inherits everyone's knowledge that Kennedy is dead), while the counterfactual version ranges over worlds merely similar to actuality prior to the antecedent's falsity, with no such restriction. So the divergence is a difference in contextual input, not in the lexical meaning of "if" -- about as informative as noting that "tall" picks out different heights for a building and a toddler. (3) Jonah replied that the analogy undersells the problem: "tall" varies continuously along one dimension, whereas indicative and counterfactual conditionals seem to differ in kind rather than degree -- most tellingly, he said, the indicative conditional doesn't even look like it expresses a stable proposition, since Adams' Thesis holds that its assertability tracks the conditional probability of the consequent given the antecedent, rather than the probability of whatever proposition it's supposed to express, while the counterfactual plainly gets bivalent truth conditions from a Lewis-style similarity ranking of possible worlds. (4) Sasha pushed back that Adams' Thesis is a fact about assertability conditions, not a proof that indicatives lack truth conditions altogether: Stalnaker's own selection-function semantics -- which picks out the closest antecedent-world relative to context -- assigns truth conditions to indicative conditionals too, constrained by the conversational context set, and still recovers most of what Adams noticed, so Jonah, she said, was treating one contested position in an open debate as though it had already settled the matter.

  Could you go through Jonah and Sasha's exchange move by move and adjudicate it -- not just hand down an overall winner, but say specifically where each of the four numbered moves gets something right and where it overreaches? I would also be curious whether there is an important consideration neither of them raised that bears on who ultimately has the stronger position.
reasoning: |-
  Okay, the user is deeply engaged in a semantics seminar focusing on the indicative/counterfactual conditional puzzle, specifically the Oswald/Kennedy example. They've presented a nuanced debate between two classmates (Jonah arguing for lexical ambiguity, Sasha for contextual unity) across four moves, and want a granular adjudication plus any missed considerations. 

  Hmm, the user's framing suggests they're not just seeking textbook answers but want to understand the philosophical tension points—they explicitly note having "seen something to each side" during the coffee debate. Their request for "where each move overreaches" signals they're comfortable with technical semantics but want the dialectical weaknesses exposed. The "important consideration neither raised" request is particularly telling; they likely sense both positions have blind spots.

  First, unpacking Jonah's Move 1: His lexical ambiguity claim is intuitively strong—same A/C, different truth values *does* scream different operators. But I should flag how he oversimplifies by implying mood *alone* causes the flip; the modal shift interacts with background knowledge. His "nothing else could explain" is overconfident—contextualists like Sasha *do* offer explanations. 

  Sasha's Move 2 response is elegant: unifying both conditionals under Ramsey-test pragmatics accounts for the data without multiplying operators. Her "tall" analogy is apt for context-sensitivity but undersells the *structural* differences in how worlds are selected (epistemic vs. ontic). Jonah's right that this feels like more than scalar adjustment. 

  Ah, Jonah's Move 3 is where it gets meaty. Invoking Adams' Thesis against truth-conditional indicatives is a classic move, but he conflates "assertability tracks conditional probability" with "therefore no truth conditions"—a non sequitur Stalnaker explicitly rejects. His Lewis-style counterfactual contrast is solid though; those similarity orderings *are* fundamentally different from Stalnaker's context-restricted selection functions. 

  Sasha's Move 4 rebuttal is sharp: She correctly notes Stalnaker *does* assign truth conditions to indicatives constrained by the context set, and Adams' observations fall out naturally. Jonah's treating contested claims (e.g., "indicatives aren't propositions") as settled is indeed a rhetorical overreach. Still, she sidesteps whether Stalnaker's unified "if" *fully* resolves the divergence—after all, his semantics still needs distinct parameters for indicatives vs. counterfactuals. 

  Neither mentions the elephant in the room: *epistemic contradictions*. "If Oswald didn't do it, he’s innocent" sounds fine, but "Oswald didn't do it and if he didn't, he’s innocent" is gibberish—which *only* makes sense if indicatives presuppose antecedent compatibility with context. This bombshell (from von Fintel/Gillies) nukes Jonah's ambiguity claim because counterfactuals don't behave this way, yet a unified "if" + contextual constraints predict it perfectly. 

  Also worth noting: Sasha's Ramsey-test framing risks downplaying how *radically* counterfactual similarity metrics depart from epistemic contexts. Lewisian "miracles" have no analogue in indicatives. But her core point stands—the divergence *can* emerge from a single mechanism fed different inputs. 

  Final adjudication: Sasha wins on points. Jonah's ambiguity argument is simpler but crumbles under scrutiny (epistemic contradictions!), while her contextual unity explains more with less. Still, she should concede that "contextual parameters" here involve fundamentally different *kinds* of world-selection—not merely degree adjustments like "tall."
answer: |-
  Here's a breakdown of Jonah and Sasha's exchange, assessing each move's strengths and weaknesses, followed by an adjudication and a crucial missing consideration:

  ### Move-by-Move Analysis

  1.  **Jonah's Opening (Ambiguity Claim):**
      *   **Right:** Highlights the core puzzle effectively. The Oswald/Kennedy pair *is* a powerful illustration of how minimal changes (mood/tense) yield dramatic truth-value differences with identical A/C content. He correctly identifies this as demanding explanation.
      *   **Overreach:** Assumes lexical ambiguity is the *only* possible explanation ("nothing else could explain"). This ignores sophisticated contextualist/unified accounts (like Sasha's). He also oversimplifies the difference as merely "changing the mood," neglecting the complex interplay of tense, mood, *and* context in determining the relevant set of worlds.

  2.  **Sasha's Response (Contextualist Unity):**
      *   **Right:** Correctly identifies the fundamental issue – the *domain of worlds* differs. Her Ramsey-test-inspired account captures a core insight: both conditionals involve hypothetical reasoning, but under different constraints (current knowledge vs. historical similarity). The "tall" analogy is apt for illustrating context-sensitivity in meaning.
      *   **Overreach:** The "tall" analogy *does* undersell the problem, as Jonah claims. Height variation is scalar and continuous along a single dimension. The shift between indicative and counterfactual domains involves qualitatively different *kinds* of reasoning (epistemic supposition vs. historical alteration) and often radically different world-sets. Calling it merely a difference in "contextual input" downplays this qualitative shift.

  3.  **Jonah's Rebuttal (Adams' Thesis & Difference in Kind):**
      *   **Right:** Effectively counters the "tall" analogy by emphasizing the *categorical* difference in the domains and the reasoning they support. His invocation of **Adams' Thesis** is powerful: the robust empirical observation that assertability of indicatives tracks P(C|A) *is* a major challenge for truth-conditional accounts and suggests something fundamentally different from counterfactuals. Highlighting the Lewis-style similarity semantics for counterfactuals underscores their starkly different structure.
      *   **Overreach:** Conflates "Adams' Thesis poses a challenge to truth conditions" with "indicatives lack truth conditions altogether." As Sasha counters, unified accounts *like Stalnaker's* *do* assign truth conditions to indicatives while aiming to accommodate Adams' Thesis (e.g., via conditional probability of the selection function's output). He presents the non-truth-conditional view of indicatives as settled fact when it's a highly contested position.

  4.  **Sasha's Pushback (Stalnaker & Truth Conditions):**
      *   **Right:** Correctly points out that Jonah treats a contested view (indicatives lack truth values) as definitive. Stalnaker's unified selection-function semantics *is* a major contender that assigns truth conditions to *both* types within a single framework. The contextual parameter (the "context set" for indicatives, the similarity ordering for counterfactuals) determines the domain. This framework *can* explain Adams' Thesis: if the context set is the set of live possibilities, the probability of "If A, C" being true often approximates P(C|A).
      *   **Overreach:** While Stalnaker's account is elegant and unified, it doesn't *fully* resolve all puzzles. Explaining the *precise* constraints on the context set for indicatives (why must it include the speaker's knowledge?) and the *nature* of the similarity ordering for counterfactuals (why does it prioritize historical match?) requires additional, potentially distinct, principles. The account unifies the *mechanism* (selection function) but still relies on fundamentally different *inputs* (epistemic context vs. ontic similarity).

  ### Adjudication

  *   **Sasha has the stronger overall position.** The contextualist/unified approach (exemplified by Stalnaker) offers a more parsimonious and theoretically satisfying explanation.
      *   **Lexical Ambiguity (Jonah) is Weak:** Postulating two distinct lexical meanings for "if" is ad hoc. It struggles to explain why the choice between indicative/counterfactual *systematically* correlates with tense/mood and context (knowledge vs. historical supposition). It also fails to capture the deep similarities in their conditional logic (e.g., Modus Ponens).
      *   **Contextual Unity (Sasha) is Stronger:** A single core conditional meaning (e.g., selection of a relevant A-world) modulated by massive contextual parameters (domain of quantification) explains the divergence *and* the similarities. It naturally accounts for the correlation with linguistic markers (tense/mood signal which contextual parameter is active). It avoids multiplying lexical meanings unnecessarily.
  *   **Jonah's Key Insight:** He correctly identifies a profound *functional* difference that Sasha's initial presentation downplayed. Indicatives primarily serve an *epistemic* role (reasoning under uncertainty within our knowledge), while counterfactuals serve an *ontic* or *metaphysical* role (exploring alternative histories). This difference *is* categorical, not merely scalar. However, this functional difference is better explained by the *context* feeding into a unified mechanism than by lexical ambiguity.

  ### Important Missing Consideration: Epistemic Contradictions

  Neither Jonah nor Sasha mentioned a powerful argument *for* contextual unity and *against* lexical ambiguity: **Epistemic Contradictions**.

  *   **Observation:** Sentences like this are inherently contradictory:
      *   *"Oswald didn't kill Kennedy, but if he didn't kill Kennedy, someone else did."*
  *   **Why?** The first conjunct *asserts* that Oswald didn't do it. The indicative conditional *"If he didn't, someone else did"* presupposes that its antecedent (*he didn't*) is compatible with the current context (the conversational common ground). But the first conjunct has just made the antecedent *true* in the common ground, making the indicative conditional's presupposition trivial (it *must* hold). However, the conditional itself is then interpreted against a context where we *know* Oswald didn't do it, making its content equivalent to the trivial "Someone else did" – which is exactly what the second conjunct asserts. So, it reduces to "Oswald didn't do it and someone else did," which is fine, not contradictory.
      *   **The Real Contradiction:** The contradiction arises because the indicative conditional *itself* carries the presupposition that the antecedent is epistemically possible. Saying "A, but if A, C" directly clashes: the first part asserts A, making A epistemically necessary, while "if A, C" presupposes A is epistemically possible (i.e., *not* necessary). Hence the felt contradiction: "A (so A is necessary/certain), but [if A, C - which assumes A is possible/uncertain]".
  *   **Significance for the Debate:**
      1.  **Against Ambiguity (Jonah):** If "if" in indicatives were a genuinely distinct operator, why would it carry this powerful presupposition of epistemic possibility? This presupposition flows naturally from the *contextualist* view: the indicative conditional is evaluated relative to the context set (live possibilities), so the antecedent *must* be compatible with that set for the evaluation to be non-trivial. A distinct lexical operator wouldn't necessarily have this presupposition built-in.
      2.  **For Unity & Context (Sasha):** This phenomenon is elegantly explained by the Stalnakerian view. The indicative conditional presupposes that its antecedent is compatible with the context set. Asserting the antecedent *updates* the context set to make the antecedent true, destroying that compatibility for the subsequent conditional. The contradiction arises from violating this presupposition. Crucially, **counterfactuals do not exhibit this behavior**: "Oswald didn't kill Kennedy, but if he hadn't, someone else would have" sounds odd, but *not* inherently contradictory like the indicative version. This difference is predicted by the contextualist account: counterfactuals don't presuppose antecedent compatibility with the *current* context set; they shift to a different domain (similar worlds).

  This unmentioned argument strongly favors Sasha's contextual unity view over Jonah's lexical ambiguity claim. It shows a deep semantic/pragmatic property (the epistemic possibility presupposition) tightly linked to indicative conditionals *specifically because* of their core contextual parameter (evaluation within the epistemic context set), a property not shared by counterfactuals *because* of *their* different contextual parameter. This asymmetry emerges naturally from a unified "if" operating on distinct contextual inputs, not from two distinct lexical meanings.
