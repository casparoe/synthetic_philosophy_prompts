  ok so last night I went down a rabbit hole on the Stanford Encyclopedia of Philosophy about "norms of assertion" - basically the debate over what has to be true for it to be okay to just flat out SAY something. One camp says you can only assert stuff you actually know, another camp says its totally fine as long as you've got solid justified reasons even if it doesn't technically rise to the level of "knowledge." Could you write me a short dialogue between two people holding these views, hashing it out using the classic lottery ticket case (you're like 99.9999% sure your ticket lost, but you haven't checked the numbers yet, so can you just flat out assert "my ticket lost")? I want them to actually engage with each other's specific points instead of just repeating themselves, and don't let the knowledge-norm guy steamroll the other side - give the justified-belief person a genuinely good comeback too.
