prompt: |-
  Quick research question for the novel I'm drafting: I've got a tech billionaire character who justifies his ridiculous spending (fourth yacht, gold-plated everything) to a skeptical journalist by rattling off "costly signaling" and the handicap principle like they're settled science that explains basically all status behavior, animal and human alike. I want him to sound smart but also a little insufferable, so before I put words in his mouth I need to know which examples he'd reach for actually hold up as genuine handicap-principle cases, and which ones are shakier then he thinks (or just wrong). Can you sort the following into tiers: peacock trains, gazelle stotting, Arabian babblers' sentinel/helping behavior, Veblen goods, potlatch ceremonies, suicide bombing, and costly religious fasting rituals.

  JSON please, formatted like:

  ```json
  {
    "rock_solid": [{"example": "...", "why": "..."}],
    "contested": [...],
    "weak_or_miscast": [...]
  }
  ```

  One short reason per item is enough, no need for a full essay on each.
reasoning: |-
  We are classifying the given examples into three tiers: "rock_solid", "contested", and "weak_or_miscast" based on how well they are established as genuine handicap-principle cases.

  The handicap principle, proposed by Amotz Zahavi, suggests that signals are reliable only if they are costly to produce, such that only high-quality individuals can afford to produce them. Thus, the signal is a handicap that honestly advertises the individual's quality.

  Let's go through each example:

  1. **Peacock trains**: The classic example. The peacock's train is heavy and makes the bird more vulnerable to predators. Only high-quality males can bear this cost. This is a well-established example.

  2. **Gazelle stotting**: When gazelles jump high in the presence of predators (stotting), it is thought to be a signal to the predator that the gazelle is fit and can escape, so the predator might choose to chase another. This is a classic example of the handicap principle in predator-prey communication.

  3. **Arabian babblers' sentinel/helping behavior**: Arabian babblers take turns acting as sentinels, which is risky. This altruistic behavior might be a signal of status and quality within the group. However, there are alternative explanations (e.g., reciprocal altruism, kin selection) and the handicap principle interpretation is debated.

  4. **Veblen goods**: These are goods for which demand increases as the price increases, often because they signal status (e.g., luxury cars). This is a direct application of costly signaling in economics and is well-accepted.

  5. **Potlatch ceremonies**: These are competitive feasts among Pacific Northwest Native Americans where hosts give away or destroy wealth to display status. This is a classic example of costly signaling in anthropology.

  6. **Suicide bombing**: This is a complex behavior. Some have proposed that it can be seen as a costly signal of commitment to a group or cause, but it is highly controversial and not a straightforward example. There are many alternative explanations (e.g., coercion, indoctrination, psychological factors). Also, the handicap principle typically applies to signals that enhance reproductive success, but suicide bombing leads to death, so it's an extreme case that may not fit well.

  7. **Costly religious fasting rituals**: Fasting can be seen as a signal of religious commitment. It is costly and might signal devotion. However, the interpretation as a handicap signal is debated and there are other explanations (e.g., internal discipline, community bonding, health benefits). Also, the cost might not be as directly tied to individual quality as in biological examples.

  Now, let's assign tiers:

  - **Rock Solid**: Well-established, classic examples with strong empirical support.
    - Peacock trains
    - Gazelle stotting
    - Veblen goods (in the context of economics as costly signals of status)
    - Potlatch ceremonies (as a cultural example of costly signaling)

  - **Contested**: Examples that have been proposed but are subject to debate and alternative explanations.
    - Arabian babblers' behavior: There is a signaling component but it's mixed with other evolutionary mechanisms.
    - Costly religious fasting rituals: They can be interpreted as costly signals, but the evidence is not as clear and there are other factors.

  - **Weak or Miscast**: Examples that are either not well-supported by the handicap principle or are controversial and have better alternative explanations.
    - Suicide bombing: While it is costly, it is not a typical example of the handicap principle because it results in death and does not lead to direct reproductive benefits. It is often explained by other theories and is a controversial application.

  Note: We have to be cautious with the potlatch. It is a classic example in anthropology, but some might argue about the exact interpretation. However, it is widely accepted as a form of costly signaling.

  Let's structure the JSON accordingly.
