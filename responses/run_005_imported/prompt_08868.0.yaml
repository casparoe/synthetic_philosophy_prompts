  Hmm... what makes this thorny is that both explanations are technically plausible. Okonkwo's math isn't wrong - that variance *is* suspiciously tight. But Lindqvist's contextual knowledge about real-world lab shortcuts adds nuance. Reminds me of that philosophy thought experiment about peer disagreement where both sides have rational warrant. 

