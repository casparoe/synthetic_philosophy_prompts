answer: |-
  Constructing a Frankfurt-style case that genuinely escapes the classic dilemma requires satisfying **two conditions simultaneously**:  
  1. **No Causal Sufficiency**: The "prior sign" must *not* be causally sufficient for Jones's decision (avoiding determinism).  
  2. **No Alternative Possibilities**: Jones must *lack* the ability to do otherwise in the actual sequence where he acts.  

  John Martin Fischer's **"buffered" cases** (developed with Mark Ravizza) offer the most promising solution. Here’s a refined version that threads the needle:  

  ---

  ### **The Buffered Frankfurt Case**  
  **Setup**:  
  - Jones is deciding whether to steal a rare artifact.  
  - Black (the intervener) implants a device in Jones’s brain that can force a theft decision *if activated*.  
  - **The "Buffer"**: The device activates **only if** it detects a *specific neural precursor* (NP) at **t₁**. NP is a *non-decisional*, subpersonal brain state that *reliably precedes but does not cause* a theft decision.  
  - NP occurs randomly in Jones’s brain due to indeterministic quantum noise. It is **necessary for intervention but insufficient for action**:  
    - If NP occurs at t₁, Black can intervene at t₂ to force a theft.  
    - If NP *does not* occur at t₁, Black’s device remains inert.  
  - Jones’s decision at t₃ is **libertarian-free**: if NP occurs but Black *doesn’t* intervene, Jones’s choice remains undetermined until t₃.  

  **Scenario**:  
  - At t₁, NP occurs randomly (not caused by Jones).  
  - Jones deliberates and freely chooses to steal at t₃.  
  - Black *does not intervene* because Jones chose as desired.  

  **Key Claim**: Jones is morally responsible, yet couldn’t have done otherwise.  

  ---

  ### **Escaping the Dilemma**  
  **Horn 1: Is NP causally sufficient?**  
  - **No**. NP is a **necessary gatekeeper for intervention**, but it does *not* cause Jones’s decision.  
    - NP is a passive, non-rational state (e.g., a random fluctuation in neural noise).  
    - Jones’s decision at t₃ remains undetermined until it occurs.  
  - **Why it avoids determinism**:  
    - Even *with* NP present, Jones could still:  
      - Freely choose *not* to steal (if Black doesn’t intervene).  
      - Hesitate, triggering Black’s intervention.  
    - NP only enables *intervention*; it doesn’t constrain Jones’s choice.  

  **Horn 2: Could Jones have done otherwise?**  
  - **No**. In the actual sequence:  
    - NP *occurred* at t₁ (randomly).  
    - If Jones had *started* to choose otherwise (e.g., hesitated at t₃), Black would have forced a theft.  
  - **Why alternatives are blocked**:  
    - Jones’s freedom only extends to choices *after* NP appears.  
    - Once NP exists at t₁, *all* paths lead to theft:  
      - Jones freely steals → Theft occurs.  
      - Jones hesitates → Black forces theft.  
      - Jones refuses → Black forces theft.  
  - **But crucially**: Jones *lacks control over NP*. He cannot prevent or cause it. Thus, his responsibility stems *only* from his actual undetermined choice.  

  ---

  ### **Why This Isn’t Question-Begging**  
  1. **No covert determinism**:  
     - Jones’s decision is indeterministic. NP’s presence doesn’t affect his mental states or reasons-responsive process. Libertarians can accept this.  
  2. **Alternatives preempted non-determinedly**:  
     - The absence of alternatives arises from Black’s *contingent intervention setup* (triggered by NP), not determinism.  
  3. **Responsibility grounded in actual sequence**:  
     - Jones is responsible because he *freely performed the action* without intervention. The inability to do otherwise is irrelevant because it played no role in his choice.  

  ---

  ### **Objections and Replies**  
  **Objection**: *"If NP reliably precedes theft, doesn’t that imply determinism?"*  
  - **Reply**: No. NP could be a *statistical correlate* without causation (e.g., "trembling hand" neural noise). Libertarians allow undetermined events to have reliable precursors.  

  **Objection**: *"Jones could have avoided NP!"*  
  - **Reply**: NP is designed as **non-agential** (e.g., a random neurotransmitter surge). Jones has no control over it, so it doesn’t count as a "robust alternative possibility."  

  **Objection**: *"Black’s setup *causes* Jones’s lack of alternatives!"*  
  - **Reply**: True, but not via determinism. The *source* of responsibility is Jones’s undetermined choice, not the setup. The setup merely removes alternatives *irrelevantly*.  

  ---

  ### **Conclusion**  
  This "buffered" case avoids the dilemma by:  
  - Making the prior sign (NP) **non-causal and non-sufficient** for action.  
  - Ensuring alternatives are eliminated **only after** an undetermined event (NP) occurs randomly.  
  - Grounding responsibility **solely** in the actual, libertarian-free choice.  

  While hard incompatibilists (e.g., Derk Pereboom) may still reject responsibility, this satisfies *semi-compatibilists* and forces libertarians to concede that **responsibility without alternatives is conceptually possible**—without smuggling in determinism. The needle is threaded.
