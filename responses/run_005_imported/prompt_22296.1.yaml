  **Justifications:**

  1.  **Naomi (Score 2):** Clearly right. She correctly identifies all core Lewisian elements:  
      - **Regularity:** Established boarding order.  
      - **Coordination Equilibrium:** Everyone prefers conformity once established (order > chaos).  
      - **Arbitrariness:** Numbered tickets, lottery, etc., *could* have solved the coordination problem.  
      - **Precedent/Expectation:** Emerged without explicit agreement, sustained by mutual expectations ("each day's order sets expectation for the next").  
      This *is* a paradigmatic Lewis convention.

  2.  **Felix (Score 1):** Partially right, but overstates/misapplies. He's right that Lewis's core model focuses on coordination and expectation, not fairness *per se*. He's also right that the *intensity* of the anger (outrage, rebuke) seems stronger than pure coordination frustration (like mild confusion over merging). However, he's mistaken to imply Lewis *cannot* account for strong reactions. Lewis acknowledges that conventions become embedded in plans and expectations, and violating deeply relied-upon expectations *can* cause significant frustration/anger, even if the origin is arbitrary. His "mild confusion" analogy (merging) downplays how integral the queue convention is to *planning* (arrival time).

  3.  **Naomi (Score 2):** Clearly right. This is a direct and accurate application of Lewis. Conventions become common knowledge (everyone knows the rule, knows others know, etc.). People *build plans* around them (arrival time, mental effort). Violating the convention directly frustrates these plans and the common-knowledge-backed expectations. The "anger" *is* plausibly the "felt cost" of this specific frustration. Lewis doesn't require reactions to be mild; he requires the *basis* of the convention to be coordination, not inherent morality. This fits.

  4.  **Felix (Score -1):** Clearly mistaken in his core argument. His observation about differing reactions (escalator vs. queue) is valid. However, his conclusion – that this proves the queue isn't arbitrary or relies on an "independent fairness rationale" exposing a gap in Lewis – is wrong. As Naomi will counter, Lewis's arbitrariness condition applies to the *origin and selection* of the convention: multiple solutions were possible (arbitrariness). The *stakes* and *what is allocated* (scarce seats/time vs. smooth flow) are different between a queue and an escalator rule. Higher stakes (scarce good) naturally lead to stronger reactions when the convention is violated, *even if the convention itself remains arbitrary*. Lewis's model *can* accommodate varying intensities based on the importance of the coordinated outcome. Felix confuses the *consequence* of violation (strong due to stakes) with the *nature* of the convention (arbitrary coordination device).

  5.  **Naomi (Score 2):** Clearly right and decisive. She correctly separates:  
      - **Convention (Lewis):** The coordination device itself (FCFS queueing) *is* arbitrary and meets all Lewis's conditions.  
      - **Moralization:** The *feeling of injustice* arises *because* the convention is used to allocate a scarce good perceived as valuable (time/seat priority). This moral charge is a *separate layer* that can attach *to* a convention, especially one allocating scarce resources. Lewis's theory aims to explain the *coordination device*, not why some devices *become morally charged* due to context (resource allocation). His arbitrariness condition rules out the convention being *inherently* non-arbitrary/fair, not that it can't *become associated* with fairness norms later.

  **Final Verdict:**

  1.  **Does FCFS queueing satisfy Lewis's definition?** **Yes, unequivocally.** It exhibits the required regularity, is a coordination equilibrium, persists due to precedent and mutual expectation, is arbitrary (other solutions were possible), and is common knowledge among commuters.
  2.  **Does the moral charge expose a gap in Lewis's account?** **No.** The intense anger and sense of unfairness stem from two factors Lewis's account *can* accommodate:
      *   The **high stakes**: Violation frustrates *significant* individual planning and effort (arriving early) invested based on common-knowledge expectations.
      *   The **context of scarcity**: The convention allocates a perceived valuable, scarce resource (priority boarding, likely a seat). Violation is seen as taking an unfairly gained advantage.
  3.  Lewis's account explains the *existence and stability* of the queue as a coordination device. It wasn't designed to fully explain the **phenomenon of moralization** that can attach *to* conventions, especially those governing scarce resources. The moral outrage is a consequence *of* the convention's function and the context it operates in, not evidence that the convention itself fails to meet Lewis's criteria or that his account of conventions is fundamentally flawed for excluding a built-in fairness module. Naomi is correct: the moral charge is an *additional* normative layer annexed *to* an underlying arbitrary convention.
