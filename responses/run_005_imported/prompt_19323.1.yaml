  Let me test that against Wittgenstein's river-bed metaphor (OC 97-99). If hinges are the river-bed enabling belief-currents, then judging "wrong" hinges isn't about propositional truth but functional failure: does witchcraft-belief actually sustain inquiry? His door-hinge analogy (OC 341-343) reinforces this—hinges aren't asserted but shown in how the door (language-game) moves. 

