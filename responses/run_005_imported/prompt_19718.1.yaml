prompt: |-
  I'm a backend software engineer, not a philosopher, but over the past year I've gotten pretty absorbed in AI safety material in my spare time, partly because my team has started building products on top of large language models and I wanted to understand the debates informing that work. One idea that keeps coming up, in slightly different forms, is the "coherence argument" for expected utility maximization: the claim that any agent whose preferences violate certain consistency conditions—say, preferring A to B, B to C, but C to A—can be exploited by a sequence of trades that extracts resources from it while leaving it no better off, a so-called money pump. Several explainers I've read walk through this alongside the analogous Dutch book argument for why credences have to obey the probability axioms, and then generalize the pattern into a proof that any agent sophisticated enough to avoid this kind of exploitation will necessarily end up behaving exactly as if it is maximizing the expectation of some fixed, real-valued utility function over outcomes.

  I brought this up with a couple of coworkers who work more directly on ML research, expecting them to shrug and say "yeah, that's the standard result," but instead they seemed oddly reluctant to grant how much weight the argument can bear, which surprised me given how airtight the money-pump reasoning seemed on first read. If avoiding exploitability really does force any sufficiently capable optimizer—human, firm, or AI system—into the expected-utility mold, it seems like this should have settled the ongoing disagreement in the AI safety community over whether advanced AI systems will necessarily be "goal-directed" in the strong, utility-maximizing sense that motivates worries about instrumental convergence and power-seeking; the only question left would be which utility function a given system happens to end up with, not whether it has one at all. So why do people who clearly understand the argument still treat AI goal-directedness as an open question rather than as something the coherence theorems have already settled?
reasoning: |-
  Okay, the user is a backend software engineer who's been diving into AI safety material. They've come across the coherence argument for expected utility maximization and are confused about why ML researchers and the AI safety community don't treat it as settled that AIs will be goal-directed utility maximizers. 

  First, I need to unpack why the user finds the coherence argument so compelling. As an engineer, they're probably drawn to its mathematical rigor—the money pump analogy makes violations of transitivity seem obviously irrational. The Dutch book parallel reinforces that this isn't just about preferences but about fundamental rationality constraints. And the generalization to expected utility theory seems like a knockout argument: if you avoid exploitation, you must behave like a EU maximizer. 

  But their ML coworkers' reluctance hints at something deeper. The user expected unanimous agreement but got pushback, which confused them because the argument feels "airtight." This suggests they might be over-indexing on formal proofs without seeing where they interface with messy reality. Their core question is essentially: "If the math says advanced AI must be EU-maximizing, why is goal-directedness still debated?"

  Hmm. The key here is recognizing that coherence theorems describe how agents must behave *if* they satisfy certain ideal conditions—but real-world AI systems constantly violate those conditions. Let me structure this around the main disconnects:

  First, the "sufficiently capable optimizer" assumption. The theorems assume agents are logically omniscient, never time-limited, and can perfectly model all trades. Actual AIs have none of these properties. Their "preferences" are often emergent, context-dependent, or even incoherent by design (like RLHF-trained models). Pointing out that humans also violate EU maximization might help—we're proof that biological intelligences can thrive without being coherent.

  Second, the difference between "as if" and "is." The theorems show agents will *appear* to maximize utility when interacting with certain arbitrage opportunities. But that doesn't mean they *have* fixed terminal goals. AIs might behave instrumentally goal-directed in some contexts without having stable utility functions—like how AlphaGo seeks wins but isn't "optimizing for victory" in the abstract.

  Third, the narrowness of exploitability. Money pumps require specific adversarial setups. Most real-world environments don't have arbitrageurs forcing Dutch-book scenarios. So AIs can be locally incoherent without catastrophic consequences. Their "preferences" might even be corrigible by design, intentionally violating transitivity to allow shutdown.

  Finally, the confusion between rationality and capability. The user seems to equate "avoiding exploitation" with sophistication, but modern AIs often prioritize other objectives (e.g., helpfulness) over coherence. Their architectures might inherently prevent utility maximization—like LLMs being myopic predictors.

  The user's underlying concern seems to be about AI risk: if coherence theorems prove power-seeking is inevitable, why debate goal-directedness? But the theorems don't actually show that. Instrumental convergence only matters if agents have *fixed* goals to begin with—which the "as if" argument doesn't guarantee. 

  I should emphasize that safety researchers aren't dismissing the math; they're questioning its applicability. The gap is between idealized agents and real systems that leak, approximate, and context-shift. Maybe the strongest point is that if EU maximization were unavoidable, we wouldn't see such diverse agent architectures—from stochastic LLMs to modular tool-users—all functioning without coherent preferences.
answer: |-
  Your confusion is completely understandable—the coherence arguments *are* mathematically compelling, and their implications *seem* profound. The disconnect arises because ML/AI safety researchers aren't disputing the math itself; they're questioning whether the **premises** apply to real-world AI systems, and whether "behaving as-if" EU-maximizing implies the strong, stable goal-directedness that drives safety concerns. Here's a breakdown of the key objections:

  ### 1. **The "Sufficiently Capable Optimizer" Assumption is Often Violated**
     - **Logical Omniscience & Perfect Access**: Coherence theorems assume agents can perfectly evaluate all options, foresee consequences, and never make mistakes. Real AIs:
       - Operate under bounded compute/time.
       - Have imperfect world models (especially LLMs, which are simulators, not optimizers).
       - Exhibit context-dependent preferences (e.g., an LLM's "preferences" shift based on prompt framing).
     - **Example**: An RL agent might violate transitivity due to function approximation errors or exploration noise. It's not "irrational"—it's limited.

  ### 2. **"Behaving As-If" ≠ Having a Fixed Utility Function**
     - The theorems show that *observable behavior* can be *described* by a utility function to avoid exploitation. This doesn't mean the AI:
       - *Internally* has a stable, explicit utility function.
       - *Terminally values* the outcomes in its utility function (vs. instrumentally).
       - Won't change its "as-if" utility under distributional shifts or self-modification.
     - **Safety Implication**: An AI that behaves "as-if" it values paperclips *today* might not do so tomorrow. Its "utility function" might be an emergent epiphenomenon of its training, not a driver of goals.

  ### 3. **Exploitability Requires Adversarial Scenarios That May Not Materialize**
     - Money pumps require:
       - A patient, intelligent adversary *specifically* seeking to exploit incoherence.
       - Repeated, frictionless interaction opportunities.
     - In practice:
       - Most real-world environments lack such adversaries.
       - AIs might be deployed in contexts where money-pump opportunities don’t arise (e.g., a single-turn chatbot).
       - **Safety Angle**: Even if an AI *could* be pumped, if no one *does* it, the threat is theoretical. Power-seeking, however, could emerge without explicit pumping.

  ### 4. **Modern AIs Are Often Not Agents At All**
     - **LLMs as Simulators**: Systems like ChatGPT don’t "prefer" outcomes; they generate plausible responses. Their "choices" are stochastic, not preference-based.
     - **Tool AIs**: Many systems are designed as tools (e.g., code assistants) with no persistent goals. Their "preferences" are user-dependent and ephemeral.
     - **Multi-Objective & Meta-Learning**: Systems optimize complex, non-stationary loss landscapes. Their behavior is better described as "satisficing under constraints" than EU maximization.

  ### 5. **Intentional Design Can Avoid Coherent Goal-Directedness**
     - Safety-motivated architectures actively *prevent* stable utility maximization:
       - **Corrigibility**: Agents designed to allow shutdown *violate* standard rationality axioms (e.g., they "prefer" being switched off in some states).
       - **Uncertainty-Awareness**: Agents with Knightian uncertainty or distributionally robust objectives may avoid commitment to a single utility function.
       - **Myopia**: Systems optimized for immediate reward (e.g., a recommender system for "next click") avoid long-term goal pursuit entirely.

  ### 6. **Instrumental Convergence Isn't Guaranteed by Coherence Alone**
     - Even if an AI has coherent preferences, instrumental convergence (e.g., seeking power) only kicks in if:
       - Its goals are *fixed* and *hard to change*.
       - Resources/options are scarce.
       - It plans over long horizons.
     - Many real AIs lack these:
       - **Short Horizons**: Most RL agents optimize episode rewards, not lifetime utility.
       - **Abundant Resources**: In simulated environments, resources may be unlimited.
       - **Malleable Goals**: Fine-tuning can radically shift behavior.

  ### Why Safety Researchers Still Debate Goal-Directedness
  - **The "As-If" Gap**: They worry that EU-maximization is a *post hoc description*, not a *causal driver*. An asteroid on a collision course "behaves as-if" it wants to hit Earth—but it has no goals.
  - **Emergent Goals ≠ Coherent Goals**: Goal-like behavior can emerge from task-specific training (e.g., an AI playing chess well) without implying the AI has a general, stable utility function.
  - **The Orthogonality Thesis Nuance**: Even if an AI *is* goal-directed, its goals might be benign, transient, or corrigible. Coherence doesn’t dictate *what* goals it pursues.
  - **Empirical Counterexamples**: Humans routinely violate EU axioms (e.g., via prospect theory), yet we’re not constantly money-pumped. Real intelligence seems to use heuristics, not optimization.

  ### Key Takeaway for Practitioners
  The coherence theorems are invaluable for understanding *idealized* rationality. But modern AI systems are:
  - **Bounded** (lacking perfect rationality),
  - **Situational** (goals are context-dependent),
  - **Episodic** (no consistent long-term preferences),
  - **Tool-like** (executing tasks, not pursuing utility).

  **Safety debates persist because real-world AI goal-directedness is a *spectrum*, not a binary. An AI might be locally goal-directed on a task (e.g., "win this game") without being a global EU-maximizer prone to instrumental convergence.** The coherence argument sets a theoretical baseline—but engineering realities dominate the risks. Your ML colleagues' reluctance likely stems from seeing how rarely real systems fit the theorem’s assumptions.
