  Your analysis is perceptive: Augustine's argument relies on a crucial unstated premise about the intrinsic nature of sin and the moral equivalence of bodily members as instruments. Here's a reconstruction of his reasoning, its dependence on that premise, and an assessment of its strength:

  **Reconstructed Argument:**

  1.  **Premise (Stated):** The proposed tactic justifies "blasphemous lies" (lying about religious truth/affiliation to infiltrate heretics) *solely* because they are committed with the good intention of exposing hidden heretics.
  2.  **Premise (Unstated - Moral Structure):** Certain acts are intrinsically evil (*mala in se*). Their moral character (being sinful) is determined by their *objective nature* (the "act itself") and is *not* overridden or justified by a good intention or a good consequence. The sin resides in the *act* chosen.
  3.  **Premise (Unstated - Equivalence of Members):** Bodily members (like the flesh/genitals used in sexual acts) and verbal/mouth "members" (like the tongue used in speech acts) are morally equivalent "instruments" or "members" (*membra*) that can be yielded to sin (Romans 6:13). Sinning with one member is morally equivalent in kind to sinning with another, as both constitute yielding an instrument of the self to unrighteousness.
  4.  **Application to Adultery Analogy:**
      *   If the *only* justifying factor for a blasphemous lie is the good intention (exposing heretics)...
      *   ...then, logically, *any* intrinsically evil act committed with that *same* intention should also be justified.
      *   Adultery is universally recognized as an intrinsically evil act (a *malum in se*).
      *   Therefore, if a Catholic man could *certainly* expose hidden heretics by committing adultery with a Priscillianist woman (as per the hypothetical), the logic of justifying blasphemous lies *demands* that adultery in this case is also justified.
  5.  **Reductio ad Absurdum:** The conclusion that adultery could be justified in this scenario is morally repugnant and absurd. Any reasonable person would reject it ("shall we judge that it ought to be done? Or shall we understand that by no means must such a price be paid...").
  6.  **Conclusion:** Therefore, the initial premise (that blasphemous lies are justified by the good intention of exposing heretics) must be false. The good intention does *not* justify committing an intrinsically evil act, whether it involves the "flesh committing lasciviousness in adultery" or the "mouth committing fornication in blasphemy."

  **Addressing Your Specific Questions:**

  1.  **The Covert Premise:** You are correct. The **crucial unstated premise** is the combination of **#2 (Intrinsic Evil)** and **#3 (Equivalence of Members)**. Augustine *is* relying on the broader claim that no bodily or verbal member may be used to commit an act intrinsically forbidden by God, regardless of the end sought. The tongue uttering a blasphemous lie and the flesh committing adultery are both "instruments of unrighteousness" (Romans 6:13). The sin lies in the *act of yielding the member to sin*, making the specific member involved morally secondary to the nature of the sinful act performed with it. The "fornication" of the tongue (blasphemous lie) is parallel to the fornication of the flesh (adultery) because both are acts of infidelity – one against God/Truth, the other against the marital covenant.

  2.  **The Analogy's Work:**
      *   **Not Just Vivid Restatement:** While the core principle *is* established in *De Mendacio* (lying is intrinsically evil), the analogy here does significant *independent argumentative work*.
      *   **Force of the *Reductio*:** The adultery analogy is a powerful *reductio ad absurdum*. It forces Consentius (and the reader) to confront the *logical consequence* of their position. By shifting the sin to a universally condemned act (adultery), Augustine bypasses potential quibbles about the *degree* of sinfulness in lying or the specific nature of "blasphemy" in this context. The visceral rejection of justifying adultery exposes the flawed foundational logic (good ends justify intrinsically evil means) that underlies justifying the lies. It makes the abstract principle concrete and undeniable.
      *   **Highlighting the Equivalence Premise:** The analogy vividly *demonstrates* the "equivalence of members" premise (#3). By placing adultery and blasphemous lies side-by-side as parallel applications of the same flawed principle, Augustine shows *why* the tongue isn't exempt from the rule governing other members. The analogy makes the Romans 6:13 principle operational in a specific debate.

  **Assessment of Success Against a Critic Denying "Blasphemy":**

  *   **Strength within Augustine's Framework:** If the critic accepts Augustine's core premises (#2 & #3), the argument is logically airtight. The analogy successfully demonstrates that *if* lying in this context is sinful (intrinsically evil), then justifying it by intention leads to justifying other evils. The *reductio* holds.
  *   **Vulnerability:** The argument's success hinges entirely on the critic accepting:
      *   **Premise #2 (Intrinsic Evil of Lying):** That *all* lies, including deceptive speech to heretics about one's faith, are intrinsically evil acts. Augustine assumes this based on Scripture (e.g., Ps. 5:6, Prov. 6:16-19, John 8:44) and natural law reasoning developed in *De Mendacio*. A critic who denies lying is *intrinsically* evil (e.g., seeing it as sometimes permissible or even obligatory, like in just war deception or protecting the innocent) rejects the foundation.
      *   **Premise #3 (Equivalence of Members/Sins):** That sins of the tongue (especially false witness/blasphemy) are morally equivalent in *kind* to sins of the flesh like adultery. A critic might argue they belong to different moral categories with different weights or implications.
      *   **The "Blasphemy" Label:** The argument is particularly vulnerable if the critic **denies that deceptive speech to heretics qualifies as "blasphemy."** Augustine uses "blasphemous lies" (*mendacia blasphema*) to emphasize the gravity – lying about divine truth, professing false belief, perhaps even uttering heretical formulae. A critic could argue:
          *   Feigning heresy to infiltrate isn't a *real* profession of belief; it's tactical deception, not blasphemy in the heart.
          *   The target (heretics) are undeserving of truth or are actively hostile to it, altering the moral calculus.
          *   The sin isn't against God/Truth *itself* but against the *heretics' understanding* of it, which is already corrupted.
  *   **Augustine's Response Implied:** Augustine would likely counter that:
      1.  **The Act Itself:** The objective act is *uttering falsehood about divine things* to another person. The internal disbelief doesn't change the external act's nature as a lie against truth.
      2.  **The Object:** The lie concerns the highest good (God/Truth), making it particularly grave, akin to blasphemy. Misrepresenting religious allegiance *is* misrepresenting one's relationship to God.
      3.  **Instrument of Unrighteousness:** Regardless of the target's worthiness, the speaker is still using their God-given faculty of speech (a "member") to utter falsehood, yielding it to unrighteousness (Romans 6:13). The act corrupts the *speaker* and violates the order of creation where speech is for truth.

  **Conclusion:**

  Augustine's argument is a powerful *reductio ad absurdum* that effectively demonstrates the dangerous logical consequence of justifying intrinsically evil acts based on good intentions. Its force within his absolutist framework, particularly the premises of intrinsic evil and the moral equivalence of members as instruments of sin, is undeniable. The adultery analogy is not merely illustrative; it's essential to exposing the contradiction.

  However, its success against a critic hinges entirely on the acceptance of those core Augustinian premises, especially the *intrinsic evil of all lying* and the *classification of deceptive religious speech to heretics as "blasphemous."* A critic who rejects either premise, particularly the latter, can block the analogy. Augustine anticipates this implicitly by grounding his entire case against lying in *Contra Mendacium* and *De Mendacio* on Scripture and the intrinsic disorder of falsehood, making the "blasphemy" label a specific application of that broader, non-negotiable principle for him. The argument brilliantly exposes the internal logic of his absolutism but doesn't *prove* the absolutism itself to a skeptic; it assumes it and demonstrates its consistent application.
