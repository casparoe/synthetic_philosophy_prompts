prompt: |-
  So this semester I'm in a seminar on moral responsibility and we just spent like two weeks on blame and hypocrisy, and now my brain is stuck between two things that feel like they should agree but maybe don't. Back in intro logic we learned that "tu quoque" (the "you're a hypocrite too" move) is a textbook fallacy — pointing out that your critic is guilty of the same thing doesn't make their accusation false, so responding that way is just a dodge. But now in this seminar we're reading stuff like Wallace's paper on hypocrisy and equal standing, plus that Cohen piece about who actually gets to condemn terrorists, and the whole point of those seems to be that hypocrites really can loose the standing or authority to blame someone for X, even when the accusation is 100% true. Which sounds like its basically saying the "you're a hypocrite so back off" response is legit after all, not fallacious??

  Can you help me actually compare these two properly instead of just gesturing at "well its complicated" — the informal-logic tu quoque fallacy vs. the philosophical "standing to blame" thesis about hypocrisy? Like, are they just operating on different levels (the truth of the accusation vs. the accuser's right/authority to voice it), so there's no real conflict, or is the standing-to-blame stuff secretly just smuggling the fallacy back in with fancier vocabulary? To make it concrete: say someone who's cheating on their partner tells off a friend for cheating on theirs, and the friend claps back with "you're literally doing the same thing right now." Is the friend making a logical error, scoring a genuine moral point, or something in between, like the cheater is still wrong to have cheated but the guy calling him out has no standing to be the one saying it? I don't want a wishy-washy "different philosophers say different things" answer — pick which framework should govern how we read a case like that, and explain what the other one is missing.
