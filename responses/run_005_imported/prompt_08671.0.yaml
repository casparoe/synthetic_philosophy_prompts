answer: |-
  You're absolutely right that this feels like a collision – but it's a **productive** one. Both concepts are valid, but they operate on fundamentally different levels. The key distinction is this:

  *   **Tu Quoque (Logical Fallacy):** Concerns the **truth value of the accusation itself.** ("Is the accused person *actually* guilty of X?")
  *   **Lack of Standing to Blame (Moral Thesis):** Concerns the **moral authority of the accuser to *level* the accusation.** ("Does *this specific person*, given their own conduct/position, have the right to *hold the accused accountable* for X in *this specific way*?")

  **Your Concrete Case: The Cheaters**

  *   **Accuser:** Cheats on their partner, then tells off a friend for cheating.
  *   **Friend:** "You're literally doing the same thing right now!"

  **Analyzing with Both Frameworks:**

  1.  **Tu Quoque Fallacy (Logic):**
      *   The friend's response ("You're doing it too!") **is logically fallacious** *if* it's intended to prove that *cheating itself is not wrong* or that *the friend's own cheating is somehow justified*.
      *   The *truth* of the accusation ("You cheated on your partner") is unaffected by the accuser's hypocrisy. Pointing out the accuser's hypocrisy does nothing to falsify the claim that the friend cheated. If the friend is trying to say "Therefore, my cheating isn't bad," that's a textbook tu quoque fallacy – dodging the substance by pointing fingers.

  2.  **Lack of Standing to Blame (Moral Philosophy - Wallace/Cohen):**
      *   The friend's response **scores a genuine moral point** *about the accuser's authority*.
      *   The accuser, by actively engaging in the *very same wrong*, undermines the conditions necessary for *them* to have the standing to blame *others* for it:
          *   **Hypocrisy:** They violate the requirement of *fairness* and *sincerity* inherent in holding others accountable. Their own actions demonstrate they don't genuinely endorse the norm they're invoking against the friend (or they hold themselves to a different standard).
          *   **Compromised Normative Position:** Their blame lacks moral force because they are actively *participating* in the undermining of the norm (fidelity). They are part of the problem they're condemning.
          *   **Lack of Moral High Ground:** Their criticism rings hollow and manipulative. It comes across less as a genuine concern for the wrongness of cheating and more as an attempt to deflect attention from their own guilt or exert control.
      *   **The key point:** The friend *isn't* saying "Therefore, cheating is okay." They are saying, "Therefore, *you* are not the person who gets to lecture *me* about this right now." The wrongness of the friend's cheating *remains*, but the accuser has forfeited their right to be the one delivering the condemnation.

  **Resolving the Conflict & Picking the Governing Framework:**

  *   **There is no direct conflict:** The fallacy addresses *logical validity* (does the response prove the accusation false?), while the standing thesis addresses *moral authority* (is this person entitled to deliver this rebuke?).
  *   **The "Standing to Blame" framework should govern how we read the case** in the context of moral responsibility and blame practices. Here's why the other misses the point:
      *   **What Tu Quoque Misses:** Informal logic focuses narrowly on the truth value of propositions. It treats blame as a simple factual assertion ("You did X"). But moral blame is **not just an assertion of fact.** It's a complex, normatively laden *practice* involving:
          *   Invoking shared standards.
          *   Expressing disapproval.
          *   Claiming a position of authority relative to the norm.
          *   Demanding accountability or a response.
          *   Presupposing the blamer's own adherence (or at least endorsement) of the norm.
      *   **The Standing Thesis Captures the Practice:** Wallace's conditions (relationships, normative competence, *fulfilling relevant obligations oneself*) explicitly recognize that effective blame requires more than just stating a true fact. It requires occupying a specific *position* within a normative community. Hypocrisy directly undermines that position. Cohen highlights how hypocrisy destroys the *credibility* and *authority* needed for condemnation to be effective or justified coming from *that particular source*.

  **Conclusion for Your Cheating Case:**

  1.  **The Accuser's Cheating:** Remains morally wrong (truth value intact).
  2.  **The Friend's Cheating:** Remains morally wrong (truth value intact - tu quoque doesn't negate this).
  3.  **The Accuser's Blame:** Is **illegitimate** due to their hypocrisy. They lack the standing or moral authority to level this condemnation *at this friend* for *this specific wrong* at *this moment*. Their blame is hypocritical and thus morally defective *as an act of blaming*, even if the factual content is true.
  4.  **The Friend's Clapback:** Is **not primarily a logical rebuttal** of the wrongness of cheating (that would be fallacious tu quoque). It is **a valid moral challenge** to the accuser's *right to deliver this specific blame*. It points out the accuser's compromised position within the normative practice of blaming. The friend is effectively saying, "Your words carry no moral weight *because of who you are right now*."

  **In short:** The "standing to blame" thesis doesn't smuggle in the fallacy; it reveals that the fallacy only captures a tiny, simplistic part of what's happening in the rich, complex practice of moral blame. Hypocrisy doesn't make the accusation *false*, but it can absolutely make the *act of blaming* by *that person* morally inappropriate and ineffective. Your friend's clapback scores a genuine moral point about the accuser's hypocrisy and lack of authority, even though it doesn't (and shouldn't try to) absolve the friend's own wrongdoing. The governing framework for understanding the *social and moral dynamics of blame* is the standing thesis. Tu quoque only helps us see that the factual claim hasn't been refuted – which is necessary but far from sufficient for understanding blame.
