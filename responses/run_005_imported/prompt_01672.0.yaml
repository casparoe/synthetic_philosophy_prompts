  Maybe through a "two-tiered" system: basic welfare for animals (anti-cruelty laws), but permitting overriding interests for vital human needs. But where's the line? Malaria research feels more defensible than cosmetics testing. 

  The 3R framework (Replace, Reduce, Refine) offers practical compromise, but doesn't resolve the philosophy. Ultimately, students must confront if the distinction is principled or speciesist. I'll structure this as a dialectic - present theories, expose contradictions, push them to defend coherent criteria. 

  Key questions for discussion: Does suffering magnitude differ across species? Can "species membership" itself be moral grounds? If we protect non-rational humans, why not primates? The tension between moral intuition (animals matter) and cultural practice (animal testing) is fertile ground. 

  The user's "hunch" about interests vs rights is astute. I'll sharpen that: interests demand consideration, but rights create inviolable boundaries. The debate is whether animals get the latter. Neuroscience complicates this - if primates show self-awareness, does that change their status? 

  Realpolitik absolutely plays a role (humans hold power), but students should probe if stronger justifications exist. Maybe relational duties: we owe more to humans because of social bonds. Or perhaps "personhood" requires more than sentience. 

