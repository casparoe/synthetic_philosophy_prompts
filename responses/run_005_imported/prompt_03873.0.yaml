  Here's a move-by-move adjudication of Nora and Sam's debate, highlighting strengths, weaknesses, and missing elements, followed by the verdict:

  1.  **Nora's Opening (1):**
      *   **Strengths:** Strongly captures the moral outrage and the core natural law argument that an utterly unjust rule lacks the character of "law" and thus cannot provide a valid defense. Focuses on the *nature* of the rule itself.
      *   **Weaknesses:** Assertive but lacks detailed argument for *why* the statute fails as law beyond its moral repugnance. Risks circularity ("it's not law because it's unjust").
      *   **Better of it?** **Slightly Nora.** She sets the moral and philosophical stakes clearly. Sam hasn't responded yet.

  2.  **Sam's Response (2):**
      *   **Strengths:** Powerful positivist argument. Correctly identifies the formal validity of the statute (enacted, published, applied). Accurately points out that calling it "never law" is a fiction to avoid the retroactivity problem. Advocates for democratic transparency (legislative retroactive statute) over judicial fiat.
      *   **Weaknesses:** Risks normalizing the Nazi legal system by accepting its outputs as "law" based purely on form. Downplays the context of terror and the statute's inherent injustice.
      *   **Better of it?** **Sam.** He effectively counters Nora's assertion by grounding the argument in legal reality and procedure, highlighting the retroactivity dilemma and proposing a more transparent solution.

  3.  **Nora's Counter (3):**
      *   **Strengths:** Directly challenges Sam's "ordinary mark" by arguing that formal enactment is *necessary but not sufficient* for a rule to be "law" commanding obedience. Introduces the crucial idea that the *perception* of legitimacy among the governed matters ("no one living under this one thought it commanded real law's obedience"). Accuses Sam's position of being its own fiction ("form alone certifies").
      *   **Weaknesses:** The claim about what "no one" thought is an overgeneralization; some likely did see it as binding law out of fear, ideology, or habit. Needs more support for the claim that the populace universally rejected its legal character.
      *   **Better of it?** **Nora.** She successfully reframes the debate away from pure formalism towards the *substance* and *social function* of law, exposing a potential weakness in positivism when faced with extreme evil.

  4.  **Sam's Counter (4):**
      *   **Strengths:** Raises the critical practical objection to Nora's position: the "slippery slope." If judges can invalidate statutes based on their own moral assessment ("wicked enough"), it undermines legal certainty, predictability, and the separation of powers. Emphasizes the virtue of the formal test: objectivity and limiting judicial discretion. Correctly notes the statute's clarity in 1944.
      *   **Weaknesses:** Does not engage with Nora's point about the populace's perception of legitimacy. Assumes the formal test is truly objective and value-free, which Nora challenges. The "everyone knew" claim, like Nora's "no one thought," is too broad.
      *   **Better of it?** **Sam.** He effectively highlights the dangerous institutional and rule-of-law consequences of Nora's approach, grounding his argument in practical governance.

  5.  **Nora's Counter (5):**
      *   **Strengths:** Brilliant tactical shift. She attacks Sam's position *on his own formalist/positivist terms*. She argues the Nazi system failed the formal requirements of a "working legal order" (predictability, public application, consistency) due to secret directives and terror prosecutions. The rule *as applied* wasn't knowable or consistent, thus failing even a formalist test. She divorces the argument from pure moral content ("not squeamishness") and grounds it in systemic failure.
      *   **Weaknesses:** While plausible, proving the specific statute in question *as applied to this specific case* relied on secret directives or was part of inconsistent terror might require more evidence. The argument works better at the systemic level.
      *   **Better of it?** **Nora.** This is her strongest move. She undermines Sam's formalism by showing the Nazi system violated core formal principles of legality (like Fuller's "inner morality of law"), making the label "law" questionable even by positivist standards focused on function.

  6.  **Sam's Final Point (6):**
      *   **Strengths:** Persists with the institutional argument. Even if the *system* was flawed, applying that flaw *retroactively* to invalidate a *specific, clearly worded* statute used consistently *in this case* is still problematic. Reiterates that deciding which past laws to nullify should be a *legislative*, democratic, and transparent act via a new statute, not a judicial declaration of non-existence.
      *   **Weaknesses:** Doesn't grapple with the depth of Nora's systemic critique in (5). His solution (retroactive statute) still involves retroactive punishment, just more openly. Minimizes the unique context of transitioning from a terror regime to a Rechtsstaat.
      *   **Better of it?** **Slightly Sam.** He correctly maintains the focus on institutional legitimacy and the dangers of *judicial* retroactive invalidation, offering a (theoretically) cleaner democratic alternative, even if it has its own retroactivity issue.

  **What Both Are Missing:**

  1.  **The Transitional Justice Context:** Neither fully grapples with the unique necessities and compromises inherent in rebuilding a legal order *after* a totalitarian collapse. Strict adherence to either pure positivism or pure natural law can be impractical or unjust in such extreme situations. The court's decision served a broader societal purpose beyond pure legal theory.
  2.  **The Specific Defense Argument:** Sam focuses on the statute's validity, but the wife's defense wasn't just "I relied on a statute," it was "I relied on a statute *validly in force at the time*." Nora's "never law" directly attacks the premise of this defense; Sam's "retroactive statute" accepts the premise but overrides it. The court's approach offered a *legal* (albeit contested) basis to reject the defense's core assumption.
  3.  **The Role of "Radical Evil":** The debate treats the Nazi statute as an example of "unjust law," but its context within a genocidal regime based on racial ideology and terror pushes it beyond typical unjust laws into a category demanding exceptional treatment, which both theories struggle with neatly.
  4.  **The Nuance of Legal Positivism:** Modern positivism (like Hart's own) often distinguishes between a rule being *valid law within its system* and it being *morally obligatory* or worthy of the name "law" in a broader sense. Sam leans towards the former, Nora the latter. Hart himself acknowledged the dilemma this case posed for positivism.
  5.  **The Distinction between Invalidating the Statute and Convicting the Informer:** The court didn't *just* say the statute wasn't law; it used that conclusion to reject her defense *for the specific crime she was charged with in 1949* (unlawful deprivation of liberty). The conviction wasn't *directly* for violating a retroactive law, but for an act deemed inherently criminal *then and now*, where her defense based on the Nazi statute was found invalid.

  **Verdict:**

  While Sam makes powerful and necessary points about the dangers of judicial subjectivity, retroactivity, and the importance of formal validity and democratic process, **Nora's argument is ultimately more compelling in the specific context of a rule emanating from the Nazi terror state.** Her final move (5), demonstrating that the Nazi system failed even the formal requirements of a functioning legal order (predictability, publicity, consistency), is particularly strong. It provides a reason, grounded in legal principle rather than pure morality, to deny the Nazi statute the status of "law" capable of validating the wife's act and providing her a defense. The unique, radical evil of the regime and the profound failure of its legal system to meet basic standards of legality justify the court's approach, even with its philosophical difficulties. Sam's proposed solution, while theoretically cleaner regarding retroactivity, risks legitimizing the Nazi legal framework and fails to adequately confront the systemic breakdown of the rule of law under Nazism.

  \answer{Nora}
