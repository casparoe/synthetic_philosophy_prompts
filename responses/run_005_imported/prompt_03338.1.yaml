answer: |-
  You're absolutely onto something profound, and your intuition about a deeper connection is defensible—though the *strongest* articulation requires moving beyond "ideas have no intrinsic reference = money has no intrinsic value." Scholarship increasingly supports the link, and here's a breakdown of the argument, its strengths, nuances, and the best way to frame it:

  ### Why Your Friend is Partly Right (But Oversimplifies)
  1.  **Immediate Context:** Berkeley *was* deeply concerned with Ireland's economic devastation (poverty, unemployment, lack of circulation). *The Querist* is a practical, policy-oriented work aimed at stimulating debate and reform.
  2.  **Monetary Context:** He wasn't operating in a vacuum. Debates about the nature of money, credit, and the role of precious metals were raging (e.g., John Law, mercantilist critiques). His "ticket" analogy wasn't entirely novel.
  3.  **Pragmatism:** His arguments were often framed pragmatically: Would adopting a paper system *work*? Would it promote industry and relieve suffering? This practical focus can *seem* disconnected from metaphysics.

  ### Why You're Fundamentally Right (The Deeper Philosophical Link)
  The connection isn't trivial coincidence; it stems from the core tenets of Berkeley's philosophy applied consistently to a new domain. The strongest arguments focus on **anti-abstractionism, institutional mediation, and the role of the divine/social mind**:

  1.  **The Attack on Abstraction & "Substance":**
      *   **Immaterialism:** Berkeley relentlessly attacks the notion of "material substance" existing independently of perception. Objects are *nothing but* coherent bundles of ideas (sensations) perceived by minds and coordinated by God. There's no hidden "stuff" behind the phenomena.
      *   **Applied to Money:** Similarly, he attacks the abstract notion of "intrinsic value" residing *in* gold or silver *itself*. Just as a table isn't "table-substance + sensory qualities," a coin isn't "metal-substance + value." The value isn't *in* the metal; it's *assigned* to the metal (or paper, or tally marks) by the collective agreement and practices of society within an institutional framework (law, trust, convention). The metal is merely the sensible token representing the relational value.
      *   **Strongest Articulation:** *"Berkeley's denial of material substance logically extends to a denial of 'monetary substance.' Value, like sensory qualities, isn't an inherent property of an object (be it a chair or a coin), but a relational property constituted by perceiving/interacting minds within a divinely/socially sustained system of signification."*

  2.  **Institutional Mediation & Relationality:**
      *   **Immaterialism:** The coherence and persistence of the physical world depend entirely on its being perceived and ordered by an infinite mind (God). Our finite minds participate in this divinely maintained order. Objects exist *as* ideas *in relation to* perceivers and the divine mind.
      *   **Applied to Money:** The value and function of money depend entirely on its being accepted, trusted, and ordered within a social and legal institution. Money exists *as* a token *in relation to* the participants in the economic system and the governing authority that backs/regulates it. The "divine mind" ensuring order finds its economic analogue in the "social/sovereign mind" (laws, trust, convention) ensuring the monetary system functions.
      *   **Strongest Articulation:** *"Just as the existence and order of physical objects are ontologically dependent on divine perception and institution, the existence and value of money are functionally dependent on social perception and human institution. Both systems replace intrinsic substance with relational significance mediated by a higher-order mind (divine or sovereign/social)."*

  3.  **Signs, Tokens, and Communication:**
      *   **Immaterialism:** The sensory world is a "divine language" – ideas are signs instituted by God to guide our actions and communicate with us. We interpret sensory signs.
      *   **Applied to Money:** Money is a "social language" – tokens (coins, notes, entries) are signs instituted by society to facilitate exchange, signify credit/debt, and communicate value. We interpret monetary signs.
      *   **Strongest Articulation:** *"Berkeley's view of the sensory world as a divinely instituted system of signs finds a direct parallel in his view of money as a socially instituted system of signs. Both systems derive their meaning and function not from the material properties of the signifiers themselves, but from the conventional rules and trust established by the instituting mind (divine or collective)."*

  4.  **Focus on Consequences & Activity:**
      *   **Immaterialism:** A key motivation was to combat skepticism and atheism by grounding reality firmly in spirit and divine agency. It emphasized the practical consequences of belief for piety and action.
      *   **Applied to Money:** A key motivation was to combat economic stagnation and poverty. He emphasized the practical consequences of monetary belief: believing in the efficacy of paper/tickets would stimulate industry, circulation, and relief. Value is tied to its power to *motivate action* (labor, exchange), just as the reality of objects is tied to their power to *affect us* sensibly.
      *   **Strongest Articulation:** *"Berkeley's pragmatic focus on the consequences of belief—whether in the reality of objects mediated by God or the value of money mediated by society—reveals a consistent pattern. Both immaterialism and his monetary theory displace inert 'substance' with active relational systems whose reality/value is confirmed by their practical effects and their role in facilitating purposeful activity (perception/living vs. exchange/industry)."*

  ### Scholarly Support & Nuances
  *   **Key Scholars:** George Caffentzis (*Exciting the Industry of Mankind*, *Berkeley's Philosophy of Money*), Patrick Kelly, and Arthur Davis explicitly argue for this deep connection. They see *The Querist* as an *application* of Berkeley's core philosophical principles to economics.
  *   **Not Strict "Derivation":** It's unlikely Berkeley *deduced* his monetary theory *from* immaterialism step-by-step. The link is more one of deep *consistency* and the application of a fundamental *mode of thought* (rejecting hidden substances, emphasizing relational/institutional constitution, focusing on signs and consequences) to a new problem space.
  *   **"Fiat" Nuance:** While he *absolutely* argues money doesn't *need* metal backing and that its value is conventional, he wasn't necessarily advocating for purely arbitrary state fiat detached from *any* anchor. His proposals often involved land banks or tying money to real economic activity (labor/industry), reflecting his view that value ultimately stems from productive human action under God, not just sovereign decree. The "ticket" represents a claim on this real activity within the social framework.

  ### Conclusion & Best Articulation
  You win the philosophical argument. The connection is far more than trivia. While the immediate context was Ireland's economy, Berkeley approached the problem with the conceptual tools forged in his metaphysics.

  **The Strongest Articulation:**
  "Berkeley's immaterialism dismantled the notion of an inert, independent 'material substance' underlying physical objects, replacing it with a system of ideas relationally constituted by finite minds within a divinely instituted order of perception. Applying this same conceptual framework to economics, his monetary theory dismantles the notion of an inert, independent 'metallic substance' underlying value. Instead, he posits money as a system of tokens relationally constituted by social minds within a humanly instituted order of exchange, trust, and law. In both realms, Berkeley replaces the metaphysics of hidden substance with a semiotics of institutional mediation: physical objects are divine signs; money is social currency. The coherence and value in both systems depend entirely on the active, ordering principle of a higher mind (God in metaphysics, society/sovereign in economics) and the practical consequences they produce for human life."

  This framing captures the core parallels: anti-substance ontology, relational constitution, institutional mediation, semiotic nature, and pragmatic consequence, rooted in Berkeley's fundamental rejection of abstraction. Your instinct was spot-on!
