answer: |-
  Here’s the argument, structured to address your seminar’s needs and the constraints you specified:

  ---

  **Title: Why Triviality Demands Assertability Constraints, Not Truth-Valuelessness**  

  The triviality results are profound, but their lesson is widely misread. Lewis didn’t refuse NTV out of timidity; he saw that the data driving Adams’ Thesis—our intuitions about *when conditionals are assertable*—need not force us to abandon truth-conditional semantics. The collapse arises only if we insist that Adams’ Thesis (AT) governs *truth conditions* universally. Reinterpret AT as a *pragmatic* constraint on assertion, and the tension dissolves. Here’s why this is stronger than default NTV—and why it survives the two key objections.

  ### 1. Why Restricting AT to Actual Credences Fails (and Why Closure Isn’t the Real Issue)
  NTV proponents often concede that AT holds for an agent’s *current* credence function but deny it must hold under conditionalization. Lewis preempted this: triviality regenerates with minimal closure. Consider:  
  - **The Dynamical Problem**: Rational agents *update* beliefs on new information. If "If A, C" lacks truth conditions, learning A should shift credence in C to 1. But if AT holds only for your current credence, updating on A (where P(A) > 0) forces P(C|A) = 1—absurd if C was merely probable given A.  
  - **The Minimal Closure Fix**: To avoid this, we might require AT to hold *only* for credence functions closed under *learning A itself*. But even this meager closure resurrects triviality: if P(*If A, C*) = P(C|A) *and* P(*If A, C* | A) = P(C|A ∧ A) = 1, Lewis’s original proof (via factorization) still runs.  
  **The lesson**: Retreating to “actual credences only” cripples the semantics’ ability to model belief revision. The collapse shows AT *cannot* be a universal truth-conditional law—not that conditionals can’t be true.

  ### 2. Why Material Truth Conditions + Robustness Beat NTV on "False Antecedent" Cases
  NTV’s strongest point: if "If A, C" is true whenever A is false (per material conditional, ⊃), then "If I sneeze, the moon is cheese" is vacuously true—but intuitively, it’s *false* or nonsense. NTV avoids this; the material conditional seemingly doesn’t. Reply:  
  - **Truth vs. Assertability**: The material conditional *does* get the *truth conditions* right in key cases:  
    - When A is true, "If A, C" is true iff C is true (matching intuition).  
    - When A is false, the conditional is *true*—but this doesn’t license assertion. We judge such conditionals "false" because they violate pragmatic constraints on *appropriate speech*.  
  - **Jackson’s Robustness**: Assert "If A, C" only if your belief in C is *robust* under the supposition of A: i.e., P(C|A) is high *and* this probability survives learning A. When A is false and C is absurd, P(C|A) is low—so we *don’t assert* it. But when we *do* assert a conditional with false antecedent (e.g., "If the test was yesterday, you passed"), it’s because P(C|A) is high *and_ we’re unsure about A. Here, truth conditions align: ⊃ holds iff ¬A ∨ C, which is true if A is false.  
  - **Why NTV Misdiagnoses "Falsity"**: NTV conflates unassertability with lack of truth value. Consider:  
    - *Embedded contexts*: "It’s not true that if I sneeze, the moon is cheese." Intuition favors truth-valuation here. NTV must call this embedding illicit or reinterpret it pragmatically—a cost.  
    - *Known false antecedents*: "If Napoleon had a B-21 stealth bomber, he won Waterloo." We reject this, but not because it’s truth-valueless—it’s *false* because having a stealth bomber wouldn’t cause victory. The material conditional gets this right: A is false, so ⊃ is true only if C is true. C is false, so the conditional is false.  

  ### The Positive View: Lewis’s Pragmatic Insight
  Lewis’s alternative is this:  
  - **Truth conditions**: "If A, C" has the truth conditions of A ⊃ C.  
  - **Assertability conditions**: Assert "If A, C" iff P(C|A) is high *and_ this probability is *robust*—i.e., it wouldn’t plummet if you learned A (Jackson), or if your beliefs were refined (Lewis). This explains why we withhold assertion when A is false and C is irrelevant: P(C|A) is low or non-robust.  
  - **Why this satisfies the data behind AT**: AT captures when conditionals are *fit to assert*, not their truth conditions. When we *do* assert them, P(*If A, C*) ≈ P(C|A) because asserting ⊃ when P(C|A) is high is a good communicative bet (if A is true, C likely is; if A is false, ⊃ is true).  

  ### Why This Is Preferable to NTV
  1. **Explanatory unity**: Treats conditionals as truth-apt but subject to special assertability rules (like presuppositional triggers). NTV fragments semantics.  
  2. **Solves triviality without loss**: Rejects AT as a *semantic* universal but retains it pragmatically—unlike NTV, which must abandon truth-conditional logic for conditionals entirely.  
  3. **Handles embeddings**: "Either if A, C or if B, D" has a truth value under ⊃; NTV must posit ad-hoc pragmatic projection.  
  4. **Lewis’s insight vindicated**: Triviality shows conditionals are *profoundly context-sensitive* in use—but context-sensitivity need not imply truth-valuelessness (cf. "I am here").  

  NTV is a surrender to the proof’s pressure. Lewis’s path—divorcing truth from assertability—saves the logic while explaining the pragmatics. The burden is on NTV to show why *this* elegant division of labor fails.

  ---

  **Handout-ready summary**: This argument equips students to see NTV as one option among theoretically balanced alternatives. It credits Lewis with recognizing that probabilistic constraints can be *pragmatic* without being *semantic*, and forces NTV to defend its more radical claim—that conditionals *cannot* embed in truth-conditional logic—rather than resting on triviality as a knockdown proof.
