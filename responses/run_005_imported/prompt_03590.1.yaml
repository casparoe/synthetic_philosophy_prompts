  **Justifications:**  
  - **Move 1 (Nadia):** Partially correct (+1). The sunk cost fallacy *is* a driver in dollar auctions, but Theo's forward-looking logic shows it's not the *only* factor. Her characterization oversimplifies the strategic dilemma.  
  - **Move 2 (Theo):** Clearly right (+2). At $26, his choice *was* rationally forward-looking: bidding $28 risked an $8 loss (if Nadia dropped) versus a guaranteed $26 loss if he quit. This minimizes expected loss *at that moment*.  
  - **Move 3 (Nadia):** Clearly right (+2). She correctly identifies the trap: Theo's logic applies recursively at *any* bid level, creating a vicious cycle where "rational" individual choices lead to collective disaster. This is the auction's core paradox.  
  - **Move 4 (Theo):** Partially correct (+1). The initial bid past $20 *is* the critical error, but he ignores that the same "least-bad option" logic *starts before $20*. Once bids near $19–$20, the second-highest bidder already faces sunk costs (e.g., $19), incentivizing escalation.  

  **What both are missing:**  
  Neither addresses **asymmetric information** or **credible commitments**. Rational players could avoid the trap by:  
  1. **Pre-commitment:** Setting a personal bid limit *before* the auction (e.g., $15) and treating it as binding.  
  2. **Signaling:** Early coordinated dropouts (e.g., refusing to bid past $5) to establish mutual trust, though this is fragile.  
  The dollar auction’s pathology stems from the *combination* of individual rationality and the lack of coordination mechanisms—not just sunk costs or late-stage decisions.
