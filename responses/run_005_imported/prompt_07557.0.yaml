  ## Dialogue: The Nature of Hinge Commitments

  **Characters:**
  *   **Avery:** Proponent of the "Belief Model" (inspired by Crispin Wright's entitlement epistemology). Views hinges as genuine, truth-apt beliefs we are rationally entitled to hold without evidence.
  *   **Brooks:** Proponent of the "Non-Belief Model" (inspired by Danièle Moyal-Sharrock). Views hinges as non-propositional, non-truth-apt certainties manifested in action, not held as beliefs open to justification or doubt.

  **Setting:** A university common room after the seminar.

  **(The scene opens with Avery and Brooks lingering over coffee, still energized from the seminar discussion.)**

  **Avery:** (Leaning forward) Look, Brooks, I understand the impulse to say hinges aren't beliefs. Wittgenstein *does* say things like "My life consists in my being content to accept many things." But I think Wright gets it right. Take "The Earth has existed for many years." That *is* a belief! It’s a proposition with truth-value – it’s *true*! And crucially, I’m *rationally entitled* to hold it without evidence. That’s the key. It’s not irrational; it’s *precisely* rational to accept this groundlessly as a framework for *other* inquiries. Calling it a belief captures its cognitive role.

  **Brooks:** (Shaking head slowly) Avery, that's exactly where the danger lies. By calling it a "belief," even a "groundless" one, you sneak in the very baggage Wittgenstein spent *On Certainty* trying to jettison. You imply it *could* be justified, or doubted, or assessed for evidence *in principle*, even if you say it doesn't *need* it right now. But Wittgenstein shows that doubting "The Earth is old" isn't just *unjustified*; it's *nonsensical*, like doubting you have hands while using them. It’s not a candidate for belief *or* doubt. It’s the riverbed, not the water. Moyal-Sharrock is clear: these are *animal* certainties, manifested in *how we act*, not propositions we *hold*.

  **Avery:** But doesn't your view render hinges cognitively inert? If it's not a belief, not truth-apt, how does it *do* the work of grounding? How does "manifested in practice" explain why I confidently build geology on the assumption of an ancient Earth? My *confidence* seems propositional. Wright’s entitlement *explains* that confidence rationally. It *is* a cognitive attitude, just one with a unique epistemic status. If it weren’t truth-apt, how could it even *be* true? And it *is* true!

  **Brooks:** Ah, there’s the rub! You’re still trapped in the representational picture! The *truth* of the hinge isn’t something we *grasp propositionally*; it’s shown in the *success* and *intelligibility* of the practices it enables. My certainty that I have hands isn’t a *belief about* my hands; it’s shown when I reach for my coffee. Calling it "true" in the propositional sense *after the fact* is a grammatical illusion. Its "truth" is its role in the language-game, its indubitable bedrock status. Saying it *could* be false is literally unimaginable within our form of life – not improbable, but *meaningless*. Your "entitlement" still pictures me *deciding* to accept it rationally. I don’t *decide*; I *act*.

  **Avery:** Okay, concrete objection: What about when hinges *change*? Wright’s model handles this. We *were* entitled to believe Newtonian physics framed our inquiries, even if we later revised it based on evidence *within* that framework. It *was* a rationally held hinge-belief. On your view, was Newtonian mechanics just a different "animal certainty"? How does practice alone account for the *rational revision* of frameworks? Doesn't that require seeing the old hinge as a *falsifiable belief* we held?

  **Brooks:** (Points emphatically) Excellent point, but it proves my case! Newtonian mechanics wasn’t a *hinge*; it was a *theory* operating *within* a framework of hinges (e.g., the reliability of mathematics, the existence of a physical world, the persistence of objects). When Einstein revised it, he didn’t *doubt* those hinges; he used them to build a *new* theory. The hinges themselves – the truly foundational certainties like "There are physical objects" or "The world existed before me" – don’t change based on evidence. They are the *preconditions* for theories like Newton's or Einstein's to even be formulated and tested. Shifts in scientific paradigms operate *above* the bedrock. Hinges are the immovable foundation the house rests on; theories are the rooms we rearrange inside it.

  **Avery:** But take "The Earth is round." Wasn't *that* once doubted, even nonsensically to some? Now it's bedrock. Doesn't this show hinges *can* become justified or revised, blurring your hard line? Wright’s model allows for hinges to be *provisionally* held via entitlement, potentially revisable as our overall system evolves rationally.

  **Brooks:** "The Earth is round" *as a hinge*? I disagree. For most of history, it wasn't a hinge at *all*; it was an empirical claim, sometimes doubted. Its *becoming* seemingly indubitable for us now rests on a *vast network* of deeper hinges: the testimony of astronauts, the reliability of photography and physics, the existence of a shared external world. Its "hinge-ness" is parasitic on those more fundamental certainties. The *real* hinge is something like "My senses generally inform me about an external world" or "The testimony of experts in established institutions is generally reliable." *Those* aren't revised by seeing a photo from space; the photo *presupposes* them. The doubt you picture for "Earth is round" only makes sense *within* a framework of deeper, unchallenged hinges.

  **Avery:** Hmm... So you're saying the *depth* matters. The deepest hinges – existence of the external world, reliability of memory in basic ways, the reality of the past – are truly immune, manifested only in practice. More superficial "hinges" might actually be empirical claims resting *on* them, which *could* be revised, but revising them doesn't touch the true bedrock. Wright might call those superficial ones "inherited background certainties" rather than core hinges.

  **Brooks:** Precisely! Wittgenstein distinguishes between the "hard rock" and the "soft ground" that can shift. Moyal-Sharrock focuses on the "hard rock" – the *logico-pragmatic* necessities that make language and thought possible. Calling *those* "beliefs," even entitled ones, fundamentally mischaracterizes their role. They are *enacted*, not *entertained*. To call them beliefs is to remain within the very epistemological framework Wittgenstein is dismantling.

  **Avery:** And I worry that calling them "non-propositional certainties" risks making them mysterious or ineffable, and doesn't adequately capture the *rational force* they seem to exert on our cognitive lives. Entitlement explains why it's *reasonable* to structure inquiry this way.

  **Brooks:** But the "rational force" you feel *is* the force of the practice itself, of being embedded in a form of life. It’s not a *separate* rational warrant; it *is* the condition for rationality to get started. Trying to give it a separate "rational warrant" is like trying to pull yourself up by your bootstraps – it presupposes the very framework it's trying to justify.

  **(A moment of thoughtful silence)**

  **Avery:** ...So, is our disagreement substantive or verbal?

  **Brooks:** I think it’s deeply substantive. It reflects a fundamental difference in how we understand Wittgenstein’s project. You see him offering a *new kind of epistemology* for foundational commitments (entitlement). I see him performing a *therapeutic dissolution* of the epistemological quest *for* foundations at that level, showing that the search itself is based on a misunderstanding. We’re offering different *pictures* of the foundation.

  **Avery:** I agree it’s substantive. We disagree on the *nature* of the foundational element. Is it a cognitive state (belief) with a unique epistemic warrant, or is it a pre-cognitive condition of sense (certainty manifested)? This shapes how we understand doubt, justification, rationality, and the point of *On Certainty* itself. Wright sees it contributing to epistemology; Moyal-Sharrock sees it ending a particular philosophical anxiety.

  **Brooks:** Exactly. Verbal agreement on the *list* of hinges might mask a profound disagreement on *what kind of thing* they are. Calling it a "belief" vs. an "enacted certainty" isn't just a label; it commits us to different conceptions of mind, language, and knowledge. The verdict? No clean synthesis. We represent two compelling, but ultimately incompatible, ways of reading Wittgenstein’s final thoughts.

  **Avery:** (Nods, raising coffee cup) To the ongoing dialogue, then. May our hinges hold fast.

  **Brooks:** (Raises cup) And may our practices continue to manifest them. Cheers.
