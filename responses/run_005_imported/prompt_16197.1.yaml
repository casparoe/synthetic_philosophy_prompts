  Galileo argues that in Ptolemy, stopping the sun's proper motion wouldn't stop the diurnal cycle because the primum mobile still moves. But in Copernicus, stopping Earth's rotation halts the day-night cycle directly. However, Joshua commanded the sun to stop, not Earth. So Galileo points out that in a geocentric view, commanding the sun doesn't make sense to stop the diurnal motion since it's controlled by the primum mobile. But in Copernicus, the sun's rotation causes its axial turn, which isn't directly related to the day-night cycle. 

  Wait, that seems inconsistent. The user is confused because both systems have issues. The key is Galileo's rhetorical move: he's showing that a literal interpretation creates problems for both models, but Ptolemy's is worse. For Ptolemy, stopping the sun doesn't stop the day, so God would have to stop the primum mobile, but the command was to the sun. In Copernicus, stopping Earth's rotation stops the day, but Joshua spoke to the sun. However, since the sun governs the planets (as per Copernicus), commanding the sun makes symbolic sense. Also, stopping Earth's rotation would naturally affect the sun's apparent motion. 

