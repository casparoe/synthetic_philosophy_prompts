  The user's confusion is understandable. On the surface, ignoring your own evidence seems irrational. But in the model, it's about Bayesian updating. Each person updates their belief with all available information—previous actions and their private signal. When public information (from prior actions) is strong, one's private signal isn't enough to outweigh it. So following the crowd is actually the Bayes-optimal choice.

