  hey, we just went over information cascades in my social epistemology seminar (the bikhchandani/hirshleifer/welch style models, where people choose one after another and only see everyone else's actions, not their actual signals). feels to me like this is basically a formal proof that herding is irrational — the whole point is that after enough people go, everyone stops using their own private info and just copies whoever went before them, which sounds like a textbook bias to me. but my professor keeps calling this exact behavior "rational herding," and that phrase seems like a flat-out contradiction? like if your throwing out your own evidence just to copy the crowd, how is that supposed to be the rational move? can someone explain what im missing here, bc right now "rational herding" just sounds like an oxymoron to me.
