prompt: |-
  A friend and I spent a long portion of this weekend arguing about something that happened at my company, and neither of us managed to persuade the other, so I would welcome a third opinion. I manage a small customer support team, and some months ago we hired a representative, Maya, who quickly became our strongest performer: for a long stretch, she had the highest rate of glowing sign-offs on the team, with customers thanking her warmly at the end of nearly every call. Nearly everything she handled during that period consisted of routine billing disputes, simple enough that there was no way to earn an effusive thank-you without actually resolving the customer's problem, so we came to treat her sign-off rate as a reliable indicator that she was doing good work, and praised her accordingly.

  Two months ago, we moved her onto complaint escalations: messier cases where the right outcome is often a firm but fair refusal, or a slow and careful conversation with someone who was never going to hang up delighted, whatever happened. Since then, Maya has quietly begun waiving fees she has no real authority to waive and promising expedited refunds she cannot guarantee, seemingly whenever a call risks ending without the kind of grateful sign-off she used to receive automatically. She is not cutting corners out of laziness, and I do not think she is even aware that she is doing anything differently; if asked, she would say, quite sincerely, that she is doing exactly what made her successful in the first place. My friend's position is that this is simply a matter of her gaming the incentive: she noticed what got rewarded and is now exploiting it, so the fix is just to stop rewarding the thank-yous. I am not convinced that is the whole story, since nothing was actually being gamed for months - the trouble only appeared once the situations changed - and I cannot quite articulate why that distinction should matter, or what it implies about how we ought to train and evaluate her, and future hires, going forward. Who do you think has the better read on what is happening here, and what would you actually do differently, both with Maya and with how we bring new hires up to speed?
reasoning: |-
  Okay, let me start by understanding the core of this problem. The user manages a customer support team and has an employee, Maya, who was exceptional in handling routine billing disputes. She consistently received glowing feedback from customers. However, after moving her to complaint escalations, she started making unauthorized concessions like waiving fees and promising refunds just to get positive sign-offs. 

  First, I need to figure out why Maya is doing this. The user's friend thinks she's gaming the incentive system. But the user points out that this behavior only started after her role changed. That's a key point. Maya was genuinely good at her previous role, where resolving issues led naturally to positive feedback. In the new role, the situations are different—sometimes the best outcome is a firm refusal, which won't get a happy customer response. 

  So, why did Maya start bending the rules now? It's possible that she didn't understand the shift in expectations. In her old role, positive feedback correlated with good performance. In the new role, that correlation breaks. Maya might not realize that the metrics need to be different. She's applying the same strategy that worked before because it was rewarded, not out of malice but habit. 

  The friend's solution is to stop rewarding thank-yous. But that might not address the root cause. Maya needs to understand that the success metrics for escalations are different. Training should focus on teaching her how to handle difficult conversations where the outcome isn't a happy customer but a correct resolution. 

  Also, the company's evaluation system might be flawed. Relying on customer feedback alone doesn't work for all scenarios. For escalations, metrics like compliance with policies, accurate documentation, and escalation avoidance are more relevant. 

  For Maya specifically, the manager should have a coaching conversation. Instead of accusing her of gaming the system, explain the differences in the roles. Provide specific examples where waiving fees was inappropriate and discuss alternative approaches. Role-playing difficult calls could help her build confidence without resorting to concessions. 

  Long-term, the onboarding process needs adjustment. New hires should be trained on different scenarios with clear KPIs for each. Regular feedback sessions can help them understand evolving expectations as they move between roles. Also, the reward system should be tied to role-specific metrics rather than a one-size-fits-all approach like customer thank-yous. 

  In summary, the issue isn't just Maya gaming incentives but a misalignment between her understanding of success metrics and the new role's requirements. The solution involves clarifying expectations, adjusting training, and refining evaluation criteria to match the specific challenges of each position.
answer: |-
  You've hit on a crucial challenge in performance management: **metrics that work perfectly in one context can become dysfunctional incentives in another.** Your friend focuses on Maya "gaming the system," but your instinct that **this is more about a misalignment of expectations and training than cynical exploitation is likely closer to the truth.** Here's why:

  **Why Your Read is Stronger:**

  1.  **Lack of Initial Gaming:** As you note, Maya *wasn't* gaming the system before. Her actions on routine disputes genuinely delivered great outcomes *and* earned praise. The metric (glowing sign-offs) was a valid proxy for success *in that context*.
  2.  **The Context Shift Changed Everything:** Moving to escalations fundamentally altered what "success" looks like. Success here often requires:
      *   **Saying "No" Firmly & Kindly:** Preventing unreasonable expectations.
      *   **Managing Anger/Frustration:** De-escalation without capitulation.
      *   **Setting Realistic Timelines:** Not overpromising.
      *   **Documenting Clearly:** For legal/compliance/continuity.
      *   **Knowing When to Escalate:** Not trying to solve the unsolvable alone.
      *   **Policy Adherence:** Especially regarding waivers and refunds.
  3.  **Maya's Likely Mindset (Unconscious Competence -> Misapplied Competence):** Maya internalized "Glowing Sign-Off = Success = Reward." In her new role, she's desperately trying to replicate that success signal using the *only* tool she knows worked brilliantly before: making the customer happy *at the end of the call*. She hasn't been equipped with new tools or shown how success looks different here. Her actions seem driven by **anxiety and a desire to succeed under the old rules**, not malice or laziness.
  4.  **The System Failed Her:** The company moved a high performer into a radically different role without:
      *   **Clear Redefinition of Success:** What *are* the KPIs for escalations? It clearly wasn't explained that "glowing sign-off" is no longer the primary goal, or that it might even be counterproductive.
      *   **Training on the New Skillset:** How to deliver bad news, manage difficult conversations, uphold policy while being empathetic, understand the *limits* of her authority.
      *   **Re-aligned Incentives/Rewards:** Continuing to implicitly (or explicitly) value the old metric in the new context created this trap.

  **What Your Friend Misses:** Stopping the praise for thank-yous *alone* won't fix Maya's behavior. It might just leave her feeling confused, unsupported, and demotivated ("I did what worked before, now it doesn't work *and* I'm not praised? What *do* they want?"). It doesn't teach her *how* to succeed in her new role.

  **What to Do Differently (With Maya & System-Wide):**

  1.  **The Crucial Conversation with Maya (Coaching, Not Accusation):**
      *   **Frame it Positively:** "Maya, you were phenomenal on the billing disputes, and we moved you to escalations because we see your potential to excel in more complex situations. We need to ensure you have the right tools and understanding to succeed here, just like you did before."
      *   **Acknowledge the Shift:** "Escalations are fundamentally different. Success here isn't always measured by a happy customer *at the end of the call*. Sometimes, success is protecting the company fairly, setting clear boundaries, or preventing future problems, even if the customer is still frustrated."
      *   **Address the Behavior Specifically & Objectively:** "We've noticed instances where fees were waived outside policy or refunds were expedited without guarantee. Let's look at a couple of anonymized examples. What was your thought process? What outcome were you aiming for?" (Focus on *actions* and *outcomes*, not "gaming").
      *   **Explain the *Why* Behind Policy:** Don't just say "rules." Explain the risks: unsustainable costs, setting precedents, creating customer expectations that *can't* be met later, potential compliance issues, unfairness to other customers.
      *   **Redefine Success for Escalations:** Co-create clear expectations:
          *   **Primary Goals:** Correct resolution per policy, accurate documentation, de-escalation, knowing when/where to escalate, protecting company interests fairly.
          *   **Secondary/Contextual Goals:** Customer satisfaction *where possible*, but *not* at the expense of the primary goals. Explain that a calm, resigned "Okay, I understand" from an initially furious customer is a *massive win*.
          *   **Authority Limits:** Crystal clear guidelines on what she *can* and *cannot* do autonomously.
      *   **Provide Tools & Training:**
          *   Role-play saying "no" effectively.
          *   Teach de-escalation techniques focused on empathy without capitulation ("I understand this is incredibly frustrating, Mr. Smith. While I can't waive that fee, here's what I *can* do...").
          *   Train on managing expectations ("The refund process takes 7-10 days. I cannot expedite it, but I will flag it for priority processing within that timeframe.").
          *   Provide scripts/templates for complex refusals.
      *   **Change the Feedback Loop:** Shift your praise and coaching to the *new* metrics. "Maya, great job documenting that complex escalation thoroughly" or "The way you calmly explained the policy boundary to that angry customer was excellent, even though they weren't happy with the answer."

  2.  **System-Wide Changes (Training & Evaluation):**
      *   **Role-Specific KPIs:** Ditch one-size-fits-all metrics. Define success criteria *for each role type*.
          *   *Routine Disputes:* Resolution rate, CSAT, handle time (within reason).
          *   *Escalations:* Policy adherence %, escalation accuracy (did it *need* escalation?), documentation quality, *reduction* in repeat contacts on the same issue, de-escalation success rate (measured by tone shift, not final happiness). CSAT becomes *less* critical or interpreted differently.
      *   **Onboarding & Transition Training:** When moving reps between role types (routine -> escalations, escalations -> technical, etc.), provide *specific* training for the *new* context. Explicitly state:
          *   How the challenges differ.
          *   How the definition of success changes.
          *   What the new KPIs are and *why*.
          *   The specific skills and tools needed.
      *   **Focus on "Good Judgement" & "Appropriate Outcome":** Train reps (especially in escalations) to think beyond the immediate call. What is the *right* outcome for the customer *and* the company long-term? How does this decision impact others?
      *   **Monitor for Metric Distortion:** Regularly audit calls, especially high performers in new roles or when metrics seem "too good." Look for *how* results are achieved, not just the result itself. Is policy being followed? Are sustainable solutions being applied?
      *   **Calibrate Quality Assurance:** Ensure QA scorecards align with the specific role's goals. A QA form for escalations should heavily weight policy adherence, documentation, and de-escalation, not just CSAT.

  **In short:** Maya isn't primarily "gaming" the system; **the system failed Maya by not adapting the rules of the game when her role changed.** Your friend's solution (stop rewarding thank-yous) addresses the symptom but not the disease. The cure involves:

  1.  **Coaching Maya** on the realities of her new role, redefining success, and providing the skills to achieve it *without* policy breaches.
  2.  **Fixing the System** by creating role-specific metrics, providing context-specific training during transitions, and monitoring for unintended consequences of incentives.

  This approach treats Maya as the valuable asset she is, corrects the behavior constructively, and builds a more robust framework to prevent similar issues with future hires and role changes.
