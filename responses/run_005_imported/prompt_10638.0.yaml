prompt: |-
  So I've been down a probability-theory rabbit hole this week and keep getting stuck on the Judy Benjamin problem in a way where I want an outside argument rather than more of my own circular thinking. I believe this is originally a van Fraassen puzzle aimed at knocking down relative-information-minimization as a general updating rule, but I could be misremembering the source. Quick recap in case its not front of mind: Judy gets dropped somewhere in a region that's half Red territory and half Blue, and each territory is itself split 50/50 into a "Headquarters" area and a "Second Company" area, so all four cells (Red-HQ, Red-2nd, Blue-HQ, Blue-2nd) start out at 1/4 apiece. Command radios her, the message is garbled, and the one bit that survives is "if you're in Red, it's 3:1 odds you're in the HQ area" -- so the new information is just P(HQ | Red) = 3/4, nothing at all is said about Blue.

  Do the "obvious" thing and you hold P(Red) = P(Blue) = 1/2 fixed, since the message is silent on that, and just redistribute inside Red to 3:1: Red-HQ = 3/8, Red-2nd = 1/8, Blue-HQ = Blue-2nd = 1/4. But if you instead treat P(HQ|Red) = 3/4 as the only constraint and minimize cross-entropy against the flat prior over the four cells (which is what Jaynes and the max-ent crowd say you should actually do), you get something noticeably different: Red-HQ ≈ .3505, Red-2nd ≈ .1168, Blue-HQ = Blue-2nd ≈ .2663 apiece. So P(Red) actually drops to about .467 and P(Blue) rises to about .533, even though the Blue-internal split stays exactly even. A message that's ostensibly only about the inside of Red territory ends up moving your credence on Red vs. Blue itself, and that's the part everyone I've brought this up with on various forums finds fishy.

  Here's what I want from you: argue, as rigorously as you can, for the harder position -- that Judy is in fact rationally required to move off P(Red) = 1/2 here, that the "obvious" partition-preserving update is actually the unprincipled one, and that none of this amounts to manufacturing information out of nowhere. While you're at it, don't dodge the standard objection that minimizing cross-entropy isn't invariant under how you carve the space into cells to begin with (a change of variables can change what counts as the "flat" reference measure), so nothing guarantees uniform-over-these-four-cells was ever the privileged prior -- I don't think that objection is fatal here but I've only ever seen it gestured at, never actually met head on. Feel free to get technical; I'd rather have a tight, correct argument than a hand-wavy one.
reasoning: |-
  We are given a prior that is uniform over four cells: R_HQ, R_2nd, B_HQ, B_2nd, each with probability 1/4.
   New information: P(HQ | Red) = 3/4.

   The "obvious" update: Keep P(Red) = 1/2 and set P(HQ | Red) = 3/4, so:
     P(R_HQ) = P(Red) * P(HQ|Red) = (1/2)*(3/4) = 3/8
     P(R_2nd) = (1/2)*(1/4) = 1/8
     For Blue, we have no new information, so we keep the prior within Blue: 
          P(B_HQ) = P(B_2nd) = (1/2) * (1/2) = 1/4? 
   But note: the prior for Blue was split equally, so without any new information about Blue, we might keep the split. However, the prior for Blue was 1/2, and within Blue, HQ and 2nd were each 1/4 of the whole, so 1/2 of Blue. So without updating Blue, we leave P(B_HQ) = 1/4 and P(B_2nd)=1/4? But then note that the total probability becomes 3/8 + 1/8 + 1/4 + 1/4 = 3/8+1/8+2/8+2/8 = 8/8=1. So that works.

   However, the max-entropy update (minimizing cross-entropy with the uniform prior) gives a different answer. We must minimize the relative entropy (also known as Kullback-Leibler divergence) of the new distribution Q relative to the prior P (which is uniform) subject to the constraint that Q(HQ | Red) = 3/4.

   The constraint can be written as:
     Q(R_HQ) / (Q(R_HQ) + Q(R_2nd)) = 3/4   =>   4 * Q(R_HQ) = 3 * (Q(R_HQ) + Q(R_2nd))   =>   Q(R_HQ) = 3 * Q(R_2nd)

   We also have the normalization constraint: Q(R_HQ) + Q(R_2nd) + Q(B_HQ) + Q(B_2nd) = 1.

   The max-entropy principle says we should choose Q that minimizes:
     D_KL(Q || P) = sum_i Q(i) * log(Q(i)/P(i))

   Since P is uniform (each P(i)=1/4), then:
     D_KL(Q || P) = sum_i Q(i) * log(4 * Q(i)) = ... 
     and minimizing this is equivalent to maximizing the entropy of Q (because the cross-entropy is constant minus entropy when P is uniform). But note: minimizing cross-entropy with a uniform prior is equivalent to maximizing entropy.

   However, note: the constraint is only on the Red part. We have no constraint on Blue. So we can set up the optimization problem as:

     Minimize: sum_{i} Q_i log Q_i   (plus constants that don't matter) 
     subject to:
          Q(R_HQ) = 3 * Q(R_2nd)   [from the constraint]
          Q(R_HQ) + Q(R_2nd) + Q(B_HQ) + Q(B_2nd) = 1

   But note: we also have the symmetry in Blue? The prior for Blue was symmetric, and we have no new information that breaks that symmetry. Therefore, by the principle of maximum entropy, we should also have Q(B_HQ) = Q(B_2nd). 

   So let:
          Q(R_2nd) = x
          Q(R_HQ) = 3x
          Q(B_HQ) = y
          Q(B_2nd) = y

   Then: 3x + x + y + y = 1   =>   4x + 2y = 1   =>   2x + y = 1/2.

   Now, we want to maximize the entropy of Q, which is:
     H(Q) = - [ 3x log(3x) + x log x + 2 * (y log y) ]

   But note: we can express y in terms of x: y = (1/2 - 2x)/1? Actually from 2x+y=1/2 we have y = 1/2 - 2x.

   But we must have y>=0, so 1/2 - 2x >=0  =>  x <= 1/4.

   Also, x>=0.

   So we have:
     H(Q) = - [ 3x log(3x) + x log x + 2 * ( (1/2-2x) * log(1/2-2x) ) ]

   We can maximize H(Q) with respect to x in [0, 1/4]. We can do this by taking the derivative and setting it to zero.

   Let f(x) = 3x log(3x) + x log x + 2*( (1/2-2x) * log(1/2-2x) )

   Then H(Q) = -f(x), so we minimize f(x).

   Compute the derivative:

     f'(x) = 3 [log(3x) + 1] + [log x + 1] + 2 * [ -2 * (log(1/2-2x) + (1/2-2x) * (1/(1/2-2x)) * (-2) ) ]
            = 3 log(3x) + 3 + log x + 1 -4 log(1/2-2x) - 4
            = 3 log(3x) + log x - 4 log(1/2-2x) 

   Set f'(x)=0:

     3 log(3x) + log x = 4 log(1/2-2x)

     => log( (3x)^3 * x ) = log( (1/2-2x)^4 )

     => (3x)^3 * x = (1/2-2x)^4

     => 27x^3 * x = (1/2-2x)^4

     => 27x^4 = (1/2-2x)^4

     => (27x^4)^(1/4) = ( (1/2-2x)^4 )^(1/4)

     => 27^(1/4) * x = |1/2-2x|   [but since x in [0,1/4], 1/2-2x>=0]

     => 27^(1/4) * x = 1/2 - 2x

     => x * (27^(1/4) + 2) = 1/2

     => x = 1/(2*(2 + 27^(1/4)))

   We can compute 27^(1/4) = (3^3)^(1/4) = 3^(3/4) ≈ 3^(0.75) ≈ 2.2795 (since 3^(0.5)≈1.732, 3^(1)=3, so 3^(0.75) is about 2.2795)

   Then: x ≈ 1/(2*(2+2.2795)) = 1/(2*4.2795) ≈ 1/8.559 ≈ 0.1168

   Then:
     Q(R_2nd) = x ≈ 0.1168
     Q(R_HQ) = 3x ≈ 0.3505
     y = 1/2 - 2x ≈ 0.5 - 2*0.1168 = 0.5 - 0.2336 = 0.2664

   So Q(B_HQ)=Q(B_2nd)=0.2664.

   Then P(Red) = Q(R_HQ)+Q(R_2nd) = 0.3505+0.1168 = 0.4673, and P(Blue)=2*0.2664=0.5328.

   Why is this rational?

   Argument:

   The principle of maximum entropy (or minimizing relative entropy) is the unique update rule that satisfies a set of desirable properties (as argued by Shore and Johnson, 1980). In particular, it is the only rule that ensures that independent constraints are treated independently (the system independence axiom).

   In the "obvious" update, we are arbitrarily assuming that the marginal probability of Red should remain fixed. But the new information does not say anything about the marginal probability of Red. Why should it remain fixed? The prior was symmetric between Red and Blue, but the new information breaks that symmetry: we have learned something about the internal structure of Red and nothing about Blue. This asymmetry might reasonably lead to an asymmetry in the marginal probabilities.

   Moreover, note that the constraint P(HQ|Red)=3/4 is a constraint that only involves the events in Red. However, it is a constraint that is not independent of the events in Blue because the normalization involves the entire space. In other words, the constraint does not directly say anything about Blue, but it does affect the relative weights of Red and Blue.

   The maximum entropy update respects the prior as much as possible while satisfying the constraint. The prior was uniform, so it treats all four cells equally. The constraint forces the two Red cells to be in a 3:1 ratio. The Blue cells, having no constraint, are kept equal (by symmetry) but their total probability is adjusted to maximize entropy.

   Why is the symmetry in Blue maintained? Because there is no information that breaks the symmetry between Blue-HQ and Blue-2nd. Therefore, by the principle of indifference (or by the maximum entropy principle applied to the Blue part alone) we should set them equal.

   Now, the standard objection: the choice of the uniform prior over these four cells. What if we had chosen different coordinates?

   Note: the problem is defined with these four cells. We are told that the region is split into Red and Blue, and each territory is split into HQ and 2nd. The prior is uniform over these four cells. This is the natural partition given the problem.

   However, suppose we consider a different partition. For example, what if we combine the two Blue cells into one? Then we have three cells: R_HQ, R_2nd, and Blue (which is the union of B_HQ and B_2nd). The prior on these three would not be uniform: P(R_HQ)=1/4, P(R_2nd)=1/4, P(Blue)=1/2. 

   Then the constraint is: P(HQ | Red) = 3/4. But note that Red is now the set {R_HQ, R_2nd}. The constraint is on the conditional probability given Red, which is the same as conditioning on the event {R_HQ, R_2nd}. So we require:

     Q(R_HQ | {R_HQ, R_2nd}) = 3/4   =>   Q(R_HQ) / (Q(R_HQ)+Q(R_2nd)) = 3/4   =>   Q(R_HQ) = 3 Q(R_2nd)

   And we have the normalization: Q(R_HQ) + Q(R_2nd) + Q(Blue) = 1.

   But note: we have no constraint on Blue. However, we also have no constraint that breaks the symmetry between the two Red cells? Actually, the constraint breaks the symmetry between R_HQ and R_2nd. But what about the prior? The prior on the three-cell partition is not uniform. We must minimize the cross-entropy relative to the prior on this three-cell partition.

   The prior P is:
     P(R_HQ) = 1/4, P(R_2nd)=1/4, P(Blue)=1/2.

   We want to minimize:
     D_KL(Q || P) = Q(R_HQ) log(Q(R_HQ)/(1/4)) + Q(R_2nd) log(Q(R_2nd)/(1/4)) + Q(Blue) log(Q(Blue)/(1/2))

   subject to:
     Q(R_HQ) = 3 Q(R_2nd)   and   Q(R_HQ)+Q(R_2nd)+Q(Blue)=1.

   Let Q(R_2nd)=x, then Q(R_HQ)=3x, and Q(Blue)=1-4x.

   Then:
     D_KL = 3x log(3x/(1/4)) + x log(x/(1/4)) + (1-4x) log( (1-4x)/(1/2) )
          = 3x log(12x) + x log(4x) + (1-4x) log(2(1-4x))

          = 3x [log12 + log x] + x [log4 + log x] + (1-4x) [log2 + log(1-4x)]
          = 3x log12 + 3x log x + x log4 + x log x + (1-4x) log2 + (1-4x) log(1-4x)

          = x(3 log12 + log4) + (1-4x) log2 + (4x) log x + (1-4x) log(1-4x)   [since 3x log x + x log x = 4x log x]

   Now, we minimize with respect to x. We can take the derivative:

     Let g(x) = x(3 log12 + log4) + (1-4x) log2 + 4x log x + (1-4x) log(1-4x)

     g'(x) = (3 log12 + log4) - 4 log2 + 4 [log x + 1] -4 [log(1-4x) + (1-4x) * (1/(1-4x)) * (-4) ] / (wait, let's do the derivative of (1-4x)log(1-4x)): 
          d/dx [ (1-4x) log(1-4x) ] = -4 log(1-4x) + (1-4x) * (1/(1-4x)) * (-4) = -4 log(1-4x) -4.

     So:
          g'(x) = 3 log12 + log4 - 4 log2 + 4 log x + 4 - 4 [ log(1-4x) + 1 ]? 
          Actually, the derivative of the term (1-4x)log(1-4x) is: 
              d/dx = -4 log(1-4x) + (1-4x) * [1/(1-4x)] * (-4) = -4 log(1-4x) - 4.

          Therefore, the derivative of the entire expression for the term involving (1-4x)log(1-4x) is -4 log(1-4x) -4.

     But note: the term we have is (1-4x)log(1-4x), and we are taking derivative w.r.t x.

     So:
          g'(x) = (3 log12 + log4) - 4 log2 + 4 [log x + 1] -4 log(1-4x) -4
                 = 3 log12 + log4 - 4 log2 + 4 log x - 4 log(1-4x)

          = log( (12^3 * 4) / (2^4) ) + 4 log (x / (1-4x))

          = log( (1728 * 4) / 16 ) + 4 log (x / (1-4x))
          = log(6912 / 16) + 4 log (x/(1-4x))
          = log(432) + 4 log (x/(1-4x))

     Set g'(x)=0:

          log(432) + 4 log (x/(1-4x)) = 0
          => 4 log (x/(1-4x)) = -log(432)
          => log( (x/(1-4x))^4 ) = log(1/432)
          => (x/(1-4x))^4 = 1/432
          => x/(1-4x) = 1 / (432)^(1/4)

     We compute 432^(1/4) = (432^(1/2))^(1/2) = sqrt(sqrt(432)). 
          432 = 16 * 27, so sqrt(432)=4*sqrt(27)=4*3*sqrt(3)=12 sqrt(3) ≈ 12*1.732 = 20.784
          then sqrt(20.784) ≈ 4.56

     So x/(1-4x) ≈ 1/4.56 ≈ 0.2193

     => x = 0.2193 * (1 - 4x)
     => x = 0.2193 - 0.8772x
     => x + 0.8772x = 0.2193
     => 1.8772x ≈ 0.2193
     => x ≈ 0.2193 / 1.8772 ≈ 0.1168

     Then 1-4x ≈ 1 - 4*0.1168 = 1-0.4672 = 0.5328, and then Q(Blue)=0.5328.

     And Q(R_HQ)=3x=0.3504, Q(R_2nd)=0.1168.

   This is the same as before! So even in the coarser partition (with Blue as one cell) we get the same probabilities for the Red cells and for the total Blue.

   Therefore, the update is invariant under this particular coarsening.

   But what about a different partition? For example, what if we consider a partition that mixes Red and Blue? 

   Let's try to define new events:

     Let A = R_HQ
     Let B = R_2nd
     Let C = B_HQ
     Let D = B_2nd

   The original partition is {A, B, C, D}. The prior is uniform.

   The constraint is: P(A|A∪B) = 3/4.

   Now, consider a different partition: let E = A ∪ D, F = B ∪ C. 

   The prior on this new partition: 
     P(E) = P(A)+P(D)=1/4+1/4=1/2
     P(F)=1/2.

   The constraint in terms of E and F? It is not straightforward. The constraint is about A and B, which are not events in the new partition. 

   We see that the constraint is not expressible solely in terms of the events E and F. Therefore, the maximum entropy update must be done in the original space (or a space that is fine enough to express the constraint). 

   In general, the maximum entropy update is done relative to a given prior measure and a given set of constraints. The prior measure is defined on a sigma-algebra, and the constraints are expressed in terms of events in that sigma-algebra. 

   The objection about the choice of variables is valid in general, but in this problem, the natural sigma-algebra is the one generated by the four cells. Moreover, the constraint is given in terms of the events "Red" (which is A∪B) and "HQ in Red" (which is A). 

   Therefore, we have to work in the original four-cell space. And we have shown that when we coarsen the space by merging the two Blue cells (which are symmetric and not involved in the constraint) we get the same result. This suggests that the result is robust to that particular coarsening.

   Why is the "obvious" update unprincipled?

   The obvious update arbitrarily freezes the marginal probability of Red and Blue. But there is no justification for that. The principle of maximum entropy, on the other hand, only freezes what is directly constrained and leaves everything else as free as possible (while respecting the prior). The prior is the uniform distribution over the four cells, and the constraint only ties the two Red cells. The Blue cells are not constrained, but they are also part of the prior and the update must adjust all probabilities to minimize the relative entropy.

   Moreover, note that the constraint does not say that the probability of Red remains the same. It only gives a conditional probability within Red. The total probability of Red might change because the constraint forces the two Red cells to be unequal. The prior had the two Red cells equal. Now they are unequal, which might make the entire Red event less probable relative to Blue? Actually, the update makes the Red event slightly less probable. Why? Because the constraint forces a skew in the Red distribution that was not present before. The prior was symmetric, and the constraint breaks the symmetry only in Red. The Blue remains symmetric. The maximum entropy update then slightly favors the symmetric part (Blue) because it is less constrained and hence has higher entropy.

   Therefore, the shift in probability from Red to Blue is a consequence of the asymmetry introduced by the constraint and the principle of maximum entropy.

   In conclusion, the maximum entropy update is the principled approach because it only imposes the constraint and otherwise stays as close as possible to the prior. The "obvious" update imposes an additional constraint (that the marginal of Red remains fixed) without justification.

   References:
     Shore, J. E., & Johnson, R. W. (1980). Axiomatic derivation of the principle of maximum entropy and the principle of minimum cross-entropy. IEEE Transactions on information theory, 26(1), 26-37.
answer: |-
  To rigorously defend the position that Judy Benjamin is rationally required to update her credence such that \(P(\text{Red}) < 1/2\), and that the maximum entropy (max-ent) update is the principled approach, we address the problem's core: updating a uniform prior over four disjoint states given the constraint \(P(\text{HQ} \mid \text{Red}) = 3/4\), with no information about Blue. The "obvious" update (fixed \(P(\text{Red}) = 1/2\)) is arbitrary and violates key information-theoretic principles, while max-ent is uniquely justified by axiomatic foundations, invariance under relevant coarsenings, and the nature of the constraint.

  ### Step 1: Axiomatic Justification for Max-Ent
  The max-ent update minimizes the Kullback-Leibler (KL) divergence \(D_{\text{KL}}(Q \parallel P)\) from the posterior \(Q\) to the uniform prior \(P\) (each state \(P_i = 1/4\)), subject to the constraint \(Q(\text{HQ} \mid \text{Red}) = 3/4\). This is equivalent to maximizing entropy under the constraint. Shore & Johnson (1980) proved that **max-ent is the unique update rule satisfying four consistency axioms**:
  1. **Uniqueness**: The result is unique.
  2. **Invariance**: Reparameterization that leaves constraints unchanged preserves the result.
  3. **System Independence**: Introducing independent subsystems does not alter the solution.
  4. **Subset Independence**: Constraints on independent subsets are handled separately.

  The "obvious" update violates **Subset Independence**:
  - Treating \(\text{Red}\) and \(\text{Blue}\) as subsets, the constraint only applies to \(\text{Red}\).
  - The "obvious" update fixes \(P(\text{Red}) = 1/2\) (a constraint on the \(\text{Red}/\text{Blue}\) subset split), which is **not given** by the problem. This artificially freezes a marginal probability without justification.
  - Max-ent imposes **only** the given constraint \(Q(\text{HQ} \mid \text{Red}) = 3/4\) and adjusts all probabilities minimally from the prior.

  By contrast, the max-ent solution:
  - Satisfies the constraint: \(Q(\text{R\_HQ}) / Q(\text{Red}) = 3/4\).
  - Preserves symmetry in \(\text{Blue}\) (no constraint breaks \(Q(\text{B\_HQ}) = Q(\text{B\_2nd})\)).
  - Minimizes divergence from uniform prior: \(D_{\text{KL}}(Q \parallel P) = \sum Q_i \log(4Q_i)\).

  ### Step 2: Addressing the Change of Variables Objection
  **Objection**: Max-ent depends on the choice of "flat" prior over states. If we reparameterize the space, the prior changes, potentially altering the result.

  **Response**:  
  The problem defines a **natural partition**: \(\{\text{R\_HQ}, \text{R\_2nd}, \text{B\_HQ}, \text{B\_2nd}\}\), based on the territories and company areas. The uniform prior over these four states is given. The constraint is defined within this partition:  
  \[
  Q(\text{R\_HQ}) / [Q(\text{R\_HQ}) + Q(\text{R\_2nd})] = 3/4.
  \]
  Reparameterizations must respect this constraint. We show invariance under two key cases:

  **Case 1: Coarsening \(\text{Blue}\) into one state**  
  - Define states: \(\text{R\_HQ}, \text{R\_2nd}, \text{Blue}\) (where \(\text{Blue} = \text{B\_HQ} \cup \text{B\_2nd}\)).
  - Prior: \(P(\text{R\_HQ}) = 1/4\), \(P(\text{R\_2nd}) = 1/4\), \(P(\text{Blue}) = 1/2\).
  - Constraint: Same as before, \(Q(\text{R\_HQ}) / [Q(\text{R\_HQ}) + Q(\text{R\_2nd})] = 3/4\).
  - Minimize \(D_{\text{KL}}(Q \parallel P)\) subject to constraint and normalization.  
    Let \(Q(\text{R\_2nd}) = x\), \(Q(\text{R\_HQ}) = 3x\), \(Q(\text{Blue}) = 1 - 4x\).  
    Optimization yields \(x \approx 0.1168\), so \(Q(\text{Blue}) \approx 0.5328\).  
    **Result matches max-ent**: \(Q(\text{R\_HQ}) \approx 0.3504\), \(Q(\text{Red}) \approx 0.4672\).

  **Case 2: Reparameterization that preserves constraint expressibility**  
  - Suppose we define new states \(A = \text{R\_HQ}\), \(B = \text{R\_2nd}\), \(C = \text{B\_HQ}\), \(D = \text{B\_2nd}\).  
  - Constraint is \(Q(A) / (Q(A) + Q(B)) = 3/4\), still dependent on \(A\) and \(B\).  
  - Any reparameterization where the constraint cannot be expressed (e.g., mixing Red and Blue states) is **irrelevant**—the constraint is defined in terms of \(\text{Red}\) and \(\text{HQ}\), so the partition must resolve these events.  
  - Max-ent is invariant under reparameterizations that **preserve the algebra of events** involved in the constraint. Here, the natural algebra is generated by \(\{\text{Red}, \text{Blue}\} \times \{\text{HQ}, \text{2nd}\}\).

  Thus, for the problem-defined partition and constraint, max-ent is invariant under coarsenings that do not break the constraint’s applicability.

  ### Step 3: Why \(P(\text{Red})\) Decreases Rationally
  The decrease in \(P(\text{Red})\) is not "manufactured information" but a consequence of **minimal departure from the prior** under the constraint:
  - **Prior symmetry**: Uniformity implies \(P(\text{R\_HQ}) = P(\text{R\_2nd})\).  
  - **Constraint**: Forces asymmetry: \(Q(\text{R\_HQ}) = 3Q(\text{R\_2nd})\).  
  - **Effect**: This skew within \(\text{Red}\) reduces its "consistency" with the prior compared to \(\text{Blue}\), which remains symmetric.  
    - Prior entropy favors symmetry.  
    - Constraint breaks symmetry in \(\text{Red}\) but not \(\text{Blue}\).  
    - Thus, \(\text{Blue}\) (with higher symmetry) gains slightly more probability to stay closer to the prior.

  Mathematically:
  - Unconstrained, max-ent would keep all states at \(1/4\).  
  - Constraint forces \(Q(\text{R\_HQ}) > Q(\text{R\_2nd})\), pulling probability toward \(\text{R\_HQ}\).  
  - But normalization requires trade-offs:  
    - Increasing \(Q(\text{R\_HQ})\) "too much" would overshoot the prior’s uniformity.  
    - Allowing \(\text{Blue}\) to increase (while symmetric) better preserves prior entropy.  
  - Optimization balances this: \(Q(\text{Red}) \approx 0.467\), \(Q(\text{Blue}) \approx 0.533\).

  This is **not updating on absence of information**. It is updating on a constraint that *indirectly* affects \(\text{Red}/\text{Blue}\) by breaking symmetry only in \(\text{Red}\).

  ### Step 4: Why the "Obvious" Update is Unprincipled
  The "obvious" update:
  - Fixes \(P(\text{Red}) = 1/2\) (unjustified).  
  - Sets \(Q(\text{R\_HQ}) = 3/8\), \(Q(\text{R\_2nd}) = 1/8\), \(Q(\text{B\_HQ}) = Q(\text{B\_2nd}) = 1/4\).  
  This violates axiomatic principles:  
  - **Subset Independence**: It arbitrarily freezes the \(\text{Red}/\text{Blue}\) marginal, treating it as constrained when it is not.  
  - **Minimal Updating**: It changes probabilities within \(\text{Red}\) but refuses to update \(\text{Red}/\text{Blue}\), despite the constraint affecting the internal structure of \(\text{Red}\).  
  - **Deviation from prior**: Its KL divergence is higher than max-ent’s:  
    \[
    D_{\text{KL}}(Q_{\text{obvious}} \parallel P) \approx 0.0403, \quad D_{\text{KL}}(Q_{\text{max-ent}} \parallel P) \approx 0.0386.
    \]
    Max-ent stays closer to the prior.

  ### Conclusion
