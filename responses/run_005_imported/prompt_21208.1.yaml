answer: |-
  Here’s a rigorous dialogue between **Oscar (Ockhamist)** and **Sylvia (Supervaluationist)**, focusing *solely* on whether the statement "There will be a sea battle tomorrow" is **true right now**. Each directly engages the other’s core objection.

  ---

  ### **Setting:** Philosophy Department Lounge, late evening.  
  *(Oscar sips coffee; Sylvia adjusts her glasses, both weary but focused)*

  **Oscar (Ockhamist):**  
  Look, Sylvia, let’s cut to the chase: "There will be a sea battle tomorrow" is *either true or false right now*. It’s just that we don’t *know* which. The future is open in the sense that multiple possibilities exist, but one branch is metaphysically privileged—the *actual* future. That’s the Thin Red Line (TRL). Without it, you deny reality to future truth.

  **Sylvia (Supervaluationist):**  
  Oscar, your TRL is a phantom. If the future is genuinely open—if nothing *now* determines whether the admirals choose peace or war—then there’s **no fact of the matter** about which branch is "privileged." Belnap was right: your TRL is undetectable, ungrounded, and just smuggles determinism in through the back door.  

  **Oscar:**  
  But your alternative collapses into absurdity! If "There will be a sea battle" is *neither true nor false* today, you violate excluded middle. "Either P or not-P" is a tautology! Yet under supervaluationism, "There will be a battle or there won’t" is "supertrue," but *neither disjunct is true*. That’s not saving truth—it’s redefining it into irrelevance.  

  **Sylvia:**  
  Not at all. Supertruth *is* truth—it’s truth relative to how things *actually turn out*. Today, with open possibilities, the sentence "There will be a battle" simply **lacks a truth-value** because reality hasn’t settled which branch is actualized. But excluded middle holds at the level of *propositions*: "P or not-P" is supertrue because *every* possible future makes one or the other true. We preserve logic without pretending we have truths we can’t possibly ground.  

  **Oscar:**  
  Ah, but *why* can’t we ground it? The TRL isn’t "undetectable" in principle—it’s just epistemically inaccessible *now*. Tomorrow, we’ll know which branch was actual. The metaphysical fact exists *today*; our ignorance doesn’t erase it. Your "truth-value gap" is what’s ungrounded—you’re saying reality hasn’t decided yet, but reality *is* decided; it’s just that we’re temporally located before the decision manifests.  

  **Sylvia:**  
  That’s the crux: you’re conflating *temporal becoming* with *retrospective truth*. If the admirals haven’t even met yet, what *present fact* makes one future "actual"? Point to it! Your TRL adds nothing except a label—it doesn’t *explain* why one branch is special. Whereas I say: truth *supervenes* on how history unfolds. Until it unfolds, there’s nothing *to* be true about the contingent future.  

  **Oscar:**  
  But then answer this: When the battle *does* happen tomorrow, wasn’t it **true all along** that it would happen? If not, then even after the fact, "There will be a battle" *wasn’t* true yesterday—which is nonsense! The TRL explains that: the sentence was true yesterday relative to the *actual* future (which was fixed but unknown). You can’t have retrospective truth without past truth.  

  **Sylvia:**  
  I *can*! "There will be a battle" *becomes* true tomorrow when the battle occurs. Yesterday, it was **indeterminate**—not false, but not yet true. Retrospectively, we can say "It was true" as shorthand for "It later became true," but strictly speaking, *at the time of utterance*, no truth-value existed. That’s not a trick; it’s respecting the openness of the future. Your TRL pretends openness is compatible with a secret, invisible completed future—which is a contradiction.  

  **Oscar:**  
  But then is "supertruth" *really* truth? When I say "It *is* true that there will be a battle," I mean it’s true *now*—not that it’ll be true later. By reducing truth to "supertruth," you’ve changed the subject. And worse: if I say today, "Either there’s a battle tomorrow or there isn’t," that’s supertrue—but neither disjunct is true! How is that not a hollow victory for logic?  

  **Sylvia:**  
  Because logic governs *possibilities*, not just actualities. The disjunction is supertrue because every possible future verifies one disjunct. That’s the logic of *openness*. Whereas you—by insisting one disjunct is *already* true—collapse possibilities into actuality. That’s the determinism we’re fighting! As for "truth": yes, supertruth is what we *mean* by truth in a temporal world. We assert "P" only when P is settled. Before that, we should say "It might happen," not "It *will*."  

  **Oscar:**  
  But ordinary language *demands* we say "It will or won’t happen"—and we take that as a claim about present reality! Your view forces us into radical revisionism. And determinism? No! The TRL is compatible with freedom: admirals *choose* the battle, and that choice—though future—makes the present proposition true.  

  **Sylvia:**  
  If the choice makes it true *tomorrow*, it can’t make it true *today*. That’s the point. Until they choose, no truth-maker exists. Your "present truth" has no present truth-maker. That’s cheating.  

  *(Silence. Both lean back, unsatisfied but out of ammunition.)*  

  **Oscar:**  
  So you’re content saying that today, "There will be a sea battle" is just… *undefined*?  

  **Sylvia:**  
  Yes. Because today, reality hasn’t defined it.  

  **Oscar:**  
  And I say reality *has* defined it—we just can’t see the definition yet.  

  **Sylvia:**  
  Then show me the ink.  

  **Oscar:**  
  I would… if I could time-travel. But I know it’s written *somewhere*.  

  **Sylvia:**  
  And I say the book isn’t written yet.  

  *(They share a tired smile. The sea battle remains unresolved.)*  

  ---

  ### Key Engagement Points:
  1. **Oscar answers "TRL is ungrounded":**  
     *Claims TRL is metaphysically real but epistemically hidden; retrospective truth requires past truth.*  
  2. **Sylvia answers "Supertruth isn’t truth":**  
     *Argues supertruth *is* truth for temporal propositions—truth is settled by actual history.*  
  3. **Oscar answers "Excluded middle is hollow":**  
     *Insists supervaluationism violates the intuition that "P or not-P" means one is *now* true.*  
  4. **Sylvia answers "Determinism worry":**  
     *Counters that TRL smuggles in actuality, erasing genuine openness.*  

  Both positions stand unrefuted but deeply challenged—precisely as in the literature. The dialogue mirrors the stalemate between Belnap/Green (anti-TRL) and Øhrstrøm (pro-TRL), with Sylvia channeling Thomason’s supervaluationism. Neither "dunks"; both expose the other’s cost.
