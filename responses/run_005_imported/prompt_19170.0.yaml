  The challenge is crafting questions that feel fresh despite the philosopher's prepared defenses. For the multiplication problem, I'll focus on whether baseline selection just moves the arbitrariness upstream. For explanatory order, I'll invert her "positive causation uses norms too" argument to show circularity. The baseline conflict question needs vivid examples where statistics and norms diverge. The non-agential case is crucial - using their weevil example to pressure "norm" without agents. Finally, falsifiability must force her to specify what could disprove the theory, preventing retreat to quasi-causalism.

  For structure, I'll sequence questions to escalate pressure: start with conceptual issues (Q1-2), move to operational problems (Q3-5), then test limits with ecology cases (Q6-7), and end with falsifiability (Q8). Each follow-up counters her probable responses - e.g., if she says baselines aren't arbitrary because they're community-based, the follow-up asks how to resolve inter-community disagreement without circularity.

