prompt: |-
  I'm a PhD student in philosophy working on social ontology, and this term I've been sitting in on a reading group slowly working through David Lewis's *Convention*. Last week, two of the other regulars, Nadia and Elias, ended up in a disagreement that the rest of us just watched unfold rather than settle, and it's been nagging at me since. The question on the table was whether ordinary queueing — lining up at a bus stop or a coffee counter and being served in the order you arrived — is a genuine instance of a Lewis convention, or whether it only looks like one.

  (1) Nadia opened by arguing that queueing is about as clean a case as you could ask for: it is arbitrary, since a population could just as easily allocate service by lottery, by need, or by seniority; it persists purely because everyone expects everyone else to comply; and it would unravel the moment that expectation broke down — exactly the self-perpetuating structure Lewis attributes to a coordination equilibrium. (2) Elias objected that this skips over something load-bearing in Lewis's actual definition: a coordination equilibrium requires that no one would have done better by acting otherwise, given what everyone else does, and that's false of queueing, since whoever cuts to the front is always better off than if they had waited, regardless of how everyone else behaves — so "everyone queues" isn't a coordination equilibrium of the underlying game at all, and the practice holds together only because cutting gets punished with glares, confrontation, or worse. (3) Nadia replied that plenty of paradigm Lewis conventions share this feature: in the meeting-place case, I might privately prefer that you come find me rather than the reverse, and with a shared language, someone might privately gain from lying to me — yet Lewis doesn't treat a little private incentive to deviate as disqualifying, since all he requires is that coincidence of interest predominate, not that conflict be wholly absent. (4) Elias came back that the cases aren't parallel: in the meeting-place and language cases, the private incentive concerns which equilibrium obtains or how it gets used once it's in place, whereas queue-jumping is a standing incentive to defect from the equilibrium itself no matter which regularity is in force — which is exactly why theorists like Ullmann-Margalit treat sanction-backed norms of this kind as a separate category from coordination conventions proper. (5) Nadia's rejoinder was that this concedes too much to labels: a practice that is still arbitrary, still sustained by precedent, and still dependent on common knowledge doesn't stop being a coordination convention just because sanctions are doing some of the stabilizing work — for all Elias has shown, the sanctions might be how a fragile coordination equilibrium gets made stable, rather than proof that no coordination equilibrium was ever there to begin with.

  Could you adjudicate this move by move? For each of the five moves, I'd like to know whether it represents Lewis's actual view correctly and whether it succeeds dialectically against what came just before it, and then a final verdict on whether queueing, as they've described it, satisfies Lewis's definition of a convention — along with anything you think both Nadia and Elias are overlooking.
reasoning: |-
  Okay, the user is a PhD student in philosophy focusing on social ontology, specifically discussing whether queueing qualifies as a Lewis convention based on a debate between Nadia and Elias. Let me start by recalling Lewis's definition from *Convention*. He emphasizes coordination equilibria where no one benefits from unilateral deviation, mutual expectations, and arbitrariness. 

  Nadia argues queueing is a clear case: arbitrary, expectation-driven, and self-perpetuating. Elias counters that queue-jumping offers a standing incentive to defect, violating the coordination equilibrium requirement. 

  I need to check each move against Lewis's work. For move (1), Nadia is right about arbitrariness and expectations, but Lewis requires strict no-incentive-to-defect. Queueing might not meet that because cutting in could benefit the individual. 

  Move (2): Elias correctly points out the incentive to defect, which Lewis's definition forbids. But is queue-jumping a deviation within the equilibrium or outside? Lewis allows some conflicts but only if they don't undermine the equilibrium itself. 

  Move (3): Nadia's examples of meeting places and language involve choosing equilibria, not defecting from an existing one. Queue-jumping is different; it's a direct incentive to break the norm, which might require sanctions. 

  Move (4): Elias distinguishes between selecting equilibria and defecting. This aligns with Lewis. Ullmann-Margalit's separation of norms backed by sanctions supports Elias here. 

  Move (5): Nadia argues sanctions stabilize a fragile equilibrium. But Lewis's definition doesn't include sanctions; the equilibrium must be self-sustaining through expectations alone. 

  Final verdict: Queueing isn't a pure Lewis convention because of the standing incentive to defect, necessitating sanctions. Both might overlook that Lewis's model is idealized, and real-world practices like queueing blend coordination and enforcement. Maybe queueing has elements of both, but strictly speaking, it doesn't fit Lewis's criteria without sanctions. 

  Also, considering the user's deeper needs: They might be interested in applying social ontology to real-life examples, so highlighting the nuances between theory and practice could be valuable. They might also want to explore how norms evolve from coordination to enforcement mechanisms, which isn't covered in Lewis's model.
answer: |-
  Based on Lewis's *Convention* and the structure of the debate, here's a move-by-move adjudication, followed by a final verdict and overlooked aspects:

  **Adjudication of Moves:**

  1.  **Nadia's Opening (Clean Case):**
      *   **Lewis Correctness:** Partially Correct. Nadia correctly identifies arbitrariness, persistence via expectations, and potential unraveling as key Lewisian features. However, she **overlooks the strict requirement** that a coordination equilibrium requires *no unilateral incentive to deviate* (Lewis's Condition (2) for a coordination equilibrium: "no one would have been better off had *any one* agent alone acted otherwise"). She assumes queueing meets this.
      *   **Dialectical Success:** Initially plausible, setting up the conventional structure well. But it sets a trap by not addressing the core equilibrium condition head-on, leaving her vulnerable to Elias's counter.
      *   **Verdict:** Incomplete/Partially Correct.

  2.  **Elias's Objection (Incentive to Defect):**
      *   **Lewis Correctness:** **Correct.** Elias pinpoints the critical flaw: the existence of a *standing incentive for unilateral deviation* (cutting the line) regardless of others' actions. This violates Lewis's definition of a coordination equilibrium ("everyone queues" isn't one). His reference to sanctions as the *actual* stabilizer is crucial and aligns with Lewis's distinction between coordination problems and other norm types.
      *   **Dialectical Success:** **Strong.** This directly challenges Nadia's core assumption that queueing is a coordination equilibrium. It shifts the burden back to her to explain how queueing meets this specific condition.
      *   **Verdict:** Correct & Dialectically Effective.

  3.  **Nadia's Reply (Private Incentives in Paradigms):**
      *   **Lewis Correctness:** **Misapplied.** While Nadia is right that Lewis allows *some* conflict of interest ("coincidence of interest predominates"), she misdiagnoses the *type* of conflict. In her examples:
          *   *Meeting Place Preference:* This is a conflict over *which* coordination equilibrium to adopt (meet here vs. there), *not* an incentive to unilaterally defect from an *established* equilibrium. Once a place is established, no one benefits from unilaterally going elsewhere *that day* (given the expectation others are there).
          *   *Lying with Language:* This concerns the *use* of the convention for non-coordinative purposes (deception), *not* an incentive to defect from the convention *itself* (e.g., speaking gibberish instead of English). The convention (speaking English) remains the coordination equilibrium for communication.
      *   **Dialectical Success:** **Weak.** She fails to address Elias's core point. The conflict in queueing (cutting) *is* a direct incentive to defect from the established regularity itself, analogous to unilaterally speaking gibberish or unilaterally going to the wrong meeting spot *after* the convention is established. Her examples don't parallel the queue-jumping incentive.
      *   **Verdict:** Incorrect (Misreads Lewis) & Dialectically Ineffective.

  4.  **Elias's Comeback (Distinguishing Defection from Equilibrium Choice/Use):**
      *   **Lewis Correctness:** **Correct.** Elias accurately distinguishes between:
          *   Conflicts over *selecting/using* an equilibrium (which Lewis accommodates).
          *   Conflicts providing a *standing incentive to defect from the equilibrium state itself* (which violates the definition of a coordination equilibrium).
      *   **Dialectical Success:** **Strong.** He successfully refutes Nadia's attempted parallel, reinforcing his core argument that queue-jumping is a fundamental deviation, not just a preference over which norm or how to use it. Invoking Ullmann-Margalit strengthens his case for a distinct category.
      *   **Verdict:** Correct & Dialectically Effective.

  5.  **Nadia's Rejoinder (Sanctions Stabilizing Fragile Equilibrium):**
      *   **Lewis Correctness:** **Incorrect.** This is the crux. Lewis's definition of convention (Def. C, p. 78) requires the regularity to be sustained *primarily* by the expectations and preferences inherent in the coordination equilibrium itself ("preference for general conformity... *condition* (C)... expectation of general conformity... *condition* (E)"). Sanctions are **not** part of the core mechanism. If sanctions are *necessary* to prevent deviation (because the unilateral incentive exists), then the regularity **fails** to meet condition (C) – the preference for conformity isn't robust enough on its own. Lewis explicitly contrasts conventions with norms sustained by sanctions (pp. 97-100).
      *   **Dialectical Success:** **Weak.** While clever, it fundamentally misrepresents Lewis. Lewisian conventions are *defined* by being self-sustaining through coordination payoffs and expectations. Introducing necessary sanctions means it *isn't* self-sustaining in that way. Elias has shown the "fragile coordination equilibrium" *doesn't exist* because the incentive to defect is inherent, making sanctions necessary proof that it's not a pure Lewis convention.
      *   **Verdict:** Incorrect (Contradicts Lewis) & Dialectically Ineffective.

  **Final Verdict on Queueing:**

  Based **strictly on Lewis's definition**, **queueing as described (requiring sanctions to prevent cutting) is NOT a Lewis convention.**

  *   **Why?** The core issue is the **standing incentive for unilateral deviation** (cutting the line). This violates the definition of a **coordination equilibrium**, which requires that *no single individual* could benefit by unilaterally choosing a different action, given the actions of others. In queueing, the cutter *does* benefit by defecting (they get served faster). Sanctions may exist to *deter* this defection, but their very necessity demonstrates that the pure coordination payoff structure (everyone preferring to conform if others do) is insufficient. The preference for conformity is conditional on the threat of sanction, not inherent in the coordination structure itself.

  **What Nadia & Elias Overlooked (Potentially):**

  1.  **Gradations of Conformity Preference:** Lewis's "preference for general conformity" might be interpreted as a spectrum. In queueing, most people might *intrinsically* prefer conformity (fairness, aversion to conflict), making sanctions a backup for the minority. Elias assumes the incentive to cut is universal, while Nadia downplays it. Lewis might allow that *if* the intrinsic preference for conformity (due to fairness, etc.) is strong enough in *most* people to outweigh the temptation to cut *without relying on fear of sanction*, then it *could* qualify. The debate hinges on whether the incentive to cut is *always* dominant absent sanctions.
  2.  **The Role of "Meta-Conventions":** The sanctioning behavior itself (glares, confrontation) might be governed by a *different* Lewis convention – a norm of enforcing fairness or punishing defectors. Queueing might be a composite: a coordination *norm* stabilized by a secondary enforcement *convention*. Lewis doesn't explore this layering deeply.
  3.  **Lewis's Idealism:** Lewis's model is a highly abstract, rational-choice idealization. Real-world practices like queueing often involve mixed motives, internalized norms, varying levels of sanctioning, and historical/cultural baggage that don't fit neatly into his boxes. Both debaters might be applying the definition too rigidly to a messy reality.
  4.  **The "Underlying Game":** Elias correctly points to the underlying game structure. However, defining the "game" of queueing precisely is complex. Is the choice strictly "queue" vs. "cut"? Or does "cut" involve a risk of sanction? If the sanction risk is high enough, "queue" *could* become the dominant strategy *in the actual game being played*, making it a coordination equilibrium *if* we include the sanction in the payoff structure. But this moves away from Lewis's pure coordination focus towards a Hawk-Dove or norm game. Lewis wants conventions to solve pure coordination problems, not conflictual ones stabilized by punishment.

  **Conclusion:**

  Elias wins the debate on Lewisian grounds. The presence of a standing incentive for unilateral defection (queue-jumping) means "everyone queues" fails to be a coordination equilibrium. Sanctions are necessary precisely *because* the coordination payoffs alone are insufficient to sustain conformity, disqualifying queueing as a Lewis convention under the strict definition. Nadia's arguments capture important *aspects* of conventionality (arbitrariness, expectations, precedent) but stumble on the core equilibrium condition and the role of sanctions. Both might benefit from considering whether queueing involves a blend of coordination and norm enforcement mechanisms not fully captured by Lewis's pure model.
