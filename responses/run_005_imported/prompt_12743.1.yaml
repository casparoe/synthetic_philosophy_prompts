  First, I need to recall Williamson's anti-luminosity argument. He argues that there are no luminous conditions—situations where if you're in that condition, you know you are. The example is feeling cold on a gradually warming morning. At 9:03, you feel cold and know it. By 11:00, you don't. But around some intermediate time, say 9:45, you might feel cold but not know it because the change is too subtle. This challenges the KK principle: knowing P doesn't imply knowing that you know P.

