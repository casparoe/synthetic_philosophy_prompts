prompt: |-
  I got roped into joining my newsroom's editorial standards committee last month, right after two incidents that happened almost back to back and that everyone's now arguing about without realizing it's actually the same underlying question. First, we ran a whole piece on a state senator's fundraising hedged six ways from Sunday ("sources allege," "according to documents obtained by our reporter"), and a rival outlet scooped our follow-up by just stating flatly that he'd broken campaign finance law — turns out they were right, and we looked gutless. Then two weeks later a reporter on the schools beat wrote flatly that a superintendent had "ordered records destroyed," based on one very confident source, and it turned out the source had the timeline wrong, so we had to run a mortifying correction. Now the committee has to write an actual house rule for when a reporter can state something as flat fact ("X did Y") instead of hedging it, and we've split into three camps: one editor wants the bar to be something like "you could defend this under oath," basically requiring the reporter to really know it; another says that's an impossible standard on deadline and all that should matter in hindsight is whether the claim turns out true, since punishing a reporter for a claim that held up seems crazy; a third camp (mine, tentatively) wants it to turn on whether the reporter was reasonable and responsible given what they had at the time, accepting we'll occasionally be wrong anyway. My housemate, who has a philosophy MA, told me this is an actual live debate in epistemology about what "norm" governs assertion — knowledge, truth, or justified belief — and that all three camps have genuine arguements and genuine embarrassing counterexamples on their side, which did not help my stress levels.

  Could you draft the memo I'm bringing to Tuesday's meeting? I need an actual recommendation for the house standard, not just a survey of the options — ideally with example language for at least two hedge tiers below full flat assertion, so reporters have something concrete to reach for — plus some kind of trial period with a built-in review point rather than treating this as settled forever. Please also take the strongest argument for whichever camp(s) you're not recommending seriously, since I'll get pushback in the room and "the philosophers who disagree with me are wrong" isn't going to land with this committee.
reasoning: |-
  Okay, the user is part of a newsroom's editorial standards committee dealing with a big dilemma. They need to establish guidelines on when reporters can state facts outright versus using hedges. There are three camps: one demanding near-certain knowledge (defendable under oath), another prioritizing eventual truth, and the user's camp focusing on reasonable judgment at the time. 

  The user's deeper needs are becoming clear. They need a practical solution that withstands committee scrutiny, not just theoretical debate. The philosophy reference about epistemology norms (knowledge vs. truth vs. justified belief) is interesting but stresses them out—they need actionable policy, not academic discourse. 

  Breaking this down: First, the knowledge standard (defendable under oath) seems unrealistic for journalism. Deadlines and imperfect access to evidence make it unworkable. The truth standard is equally problematic—it’d punish reporters for honest mistakes and incentivize reckless claims that happen to be right. 

  The justified-belief approach aligns best with journalism’s realities. It emphasizes process over outcome, which is fair and teachable. But how to sell this to the other camps? For the knowledge advocates, I’ll acknowledge their rigor but point out how it’d paralyze breaking news. For the truth camp, I’ll agree hindsight matters for corrections but stress that initial publication can’t rely on crystal balls. 

  For the memo, concrete language is crucial. The user asked for "hedge tiers"—maybe "confirmed" for high confidence (multiple sources/docs), "indicate/suggest" for medium, and "allege/report" for single sources. Examples will help reporters grasp the nuance. 

  The trial period idea is smart. It shows flexibility and lets the committee adjust after real-world testing. I’ll suggest a 3-month review with incident tracking. 

  Biggest challenge: balancing philosophy with practicality. The user’s housemate isn’t wrong—this *is* an epistemology debate—but the memo must translate that into newsroom operational terms. I’ll frame justified belief as the professional standard, not the philosophical "winner." 

  Final thought: The user’s stress about pushback is valid. I’ll arm them with counterarguments—e.g., "If we require omniscience, we concede scoops to rivals; if we only punish falsehoods, we reward lucky guesses." The goal is a standard that’s both principled and possible.
answer: |-
  ## MEMO: Proposed Standard for Factual Assertion in Reporting  
  **TO:** Editorial Standards Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation for House Standard on Unhedged Assertions & Hedge Tier Framework  

  ### I. Recommended Standard: The "Justified True Belief at Time of Publication" Standard  
  After evaluating the three proposed approaches ("Defendable Under Oath," "Ultimate Truth," and "Reasonable Belief at Time"), the committee should adopt a **"Justified True Belief at Time of Publication" standard** for unhedged assertions.  

  **Standard Definition:**  
  > Reporters may state a fact as unhedged ("X did Y") **only if**:  
  > (a) They possess **multiple, independent, credible sources or documentary evidence** supporting the claim;  
  > (b) They have **rigorously verified** the evidence (e.g., cross-checked timelines, contexts, and motives);  
  > (c) They can **articulate a defensible rationale** for why the evidence justifies the assertion, even if later disproven; and  
  > (d) A senior editor **explicitly approves** the unhedged language after reviewing the evidence.  

  **Why This Standard?**  
  1. **Balances Rigor and Realism**: Requires concrete verification steps without demanding omniscience ("defendable under oath" is impractical for fast-moving news).  
  2. **Focuses on Process, Not Outcome**: Recognizes journalism’s epistemic limitations—we judge decisions based on available evidence, not hindsight ("ultimate truth" penalizes bad luck, rewards guesses).  
  3. **Aligns with Professional Ethics**: Matches SPJ/AAPOR guidelines emphasizing "diligent verification" over guarantees of infallibility.  

  ---

  ### II. Addressing Counterarguments  
  **A. For the "Defendable Under Oath" Camp:**  
  *Strongest Argument:* Prevents institutional liability and reputational damage by ensuring near-certainty.  
  *Response:* While noble, this conflates *legal* standards (beyond reasonable doubt) with *journalistic* ones. In practice, it would:  
  > - Cripple breaking news coverage (e.g., investigative scoops rely on sources who can’t testify publicly).  
  > - Cede ground to less scrupulous outlets. Our senator story failed because we *had* the evidence but lacked confidence—not verification.  

  **B. For the "Ultimate Truth" Camp:**  
  *Strongest Argument:* Readers care about accuracy, not process. Punishing reporters for correct assertions is irrational.  
  *Response:* This incentivizes reckless speculation. A reporter could assert a true claim on a hunch, face no consequence, then assert a false one tomorrow. *Accountability requires judging methodology*, not luck.  

  ---

  ### III. Hedge Tier Framework: Precision in Uncertainty  
  Use these standardized phrases to replace vague hedging ("sources allege," "reportedly") with **transparent, evidence-based language**:  

  | **Confidence Level** | **Language Tier**               | **When to Use**                                                                 | **Example**                                                                 |
  |----------------------|----------------------------------|---------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Tier 1: High**     | "Confirmed" / "Established"     | Multiple independent sources + documents; no plausible denial.                 | "Records *confirm* the senator accepted illegal donations."                |
  | **Tier 2: Medium**   | "Indicate" / "Demonstrate"      | Strong evidence (e.g., docs + one source), but minor gaps remain.              | "Emails *indicate* the superintendent ordered records destroyed."          |
  | **Tier 3: Low**      | "Suggest" / "Raise questions"   | Single source or circumstantial evidence; requires further reporting.          | "A whistleblower’s account *suggests* campaign funds were misused."        |
  | **Unverified**       | "Allege" / "Reported"           | Uncorroborated claims; attribution required.                                   | "Prosecutors *allege* the contractor bribed officials."                    |

  ---

  ### IV. Implementation: Trial Period & Review  
  1. **Trial Phase**: Adopt this standard for **3 months**.  
  2. **Track Incidents**: Log all uses of unhedged assertions and Tier 2/3 hedges; note outcomes (upheld, corrected, pending).  
  3. **Editor Training**: Mandate workshop on evidence assessment and hedge tiers.  
  4. **Review Point**: At 3 months, analyze:  
     - Frequency of corrections for unhedged vs. hedged claims  
     - Reporter/editor feedback on workflow impact  
     - Compare with pre-trial error rates  

  ---

  ### V. Why This Works  
  This standard **prevents both gutlessness and recklessness** by tethering assertions to verifiable processes. It accepts that journalism operates under uncertainty while demanding rigor. The hedge tiers replace murky language with a **spectrum of confidence**, empowering reporters to communicate nuance without retreating into vagueness.  

  **Recommended Motion:**  
  > "Move to adopt the 'Justified True Belief at Time of Publication' standard with the accompanying hedge tier framework for a 3-month trial period, pending review on [Date]."  

  ---  
  **Appendices**:  
  - A: SPJ Code of Ethics (Verification Section)  
  - B: Hedge Tier Quick-Reference Guide  
  - C: Incident Tracking Template  

  Let’s discuss amendments on Tuesday. This framework honors journalism’s duty to truth while acknowledging we aren’t oracles—we’re accountable professionals working with the best available evidence.  

  // End memo //  

  **Key Persuasion Notes for Committee:**  
  - **To "Knowledge" Camp**: "Our standard requires *documentable justification*—it’s the practical shadow of 'defendable under oath.'"  
  - **To "Truth" Camp**: "We’ll still correct falsehoods aggressively, but we can’t incentivize guessing. This standard rewards *responsible* truth-telling."  
  - **Universal Pitch**: "This isn’t philosophy—it’s *practical epistemology for deadline journalism*. Tiers replace anxiety with agency."
