    B: Wittgenstein's picture-theory provides an elegant account of unity through logical form, but it is abstract and doesn't explain the mechanism. Act-based theories shift the problem to mental acts, which is innovative but doesn't address the objective side of propositions.

    C: Russell's multiple relation theory fails because it doesn't account for the unity of the proposition itself, only in judgment. Bradley's monism avoids the problem by denying the reality of relations and plurality, but at the cost of rejecting the world of appearances.

