  First, I need to recall the statistical principle here. The colleague's advice sounds like the "Doomsday Argument" or the "mediocrity principle" in probability. The core idea is based on the Copernican principle: without additional information, you should assume you're observing something at a random point in its existence. So, if you're at position n in a sequence, the total N is likely around 2n. That's why doubling the current number is the best guess.

  But why is that the median? Let me think about the uniform prior assumption. If you assume that the total N is equally likely to be any value from n to infinity, the probability distribution becomes proportional to 1/N². Then, the median value where you're equally likely to be in the first or second half of the sequence would indeed be 2n. That makes sense mathematically.

  Now, the user mentions that in reality, we have more information about webcomics. That's crucial. The principle assumes total ignorance, but in practice, we know things like typical lifespans of webcomics, creator's age, update frequency, etc. So applying the uninformed prior disregards all that contextual knowledge, which could make the estimate worse. For example, if most webcomics run for about 500 strips, even if one is at 1,847, the double estimate might be way off because the prior knowledge suggests it's already past the typical lifespan.

  The bigger question the user half-remembers is likely the Doomsday Argument. That's where this is applied to humanity's future. If you consider humanity's birth position in its timeline, you can estimate total lifespan. That's unsettling because it suggests we might be closer to the end than the beginning. But the same critiques apply: it ignores outside information, like existential risks or historical trends.

  The user wants to explain that the colleague is technically correct under strict ignorance but oversimplifies by ignoring real-world context. So, for the webcomic, the doubling method might be a starting point but should be adjusted with actual data. Similarly, for the dive bar or Broadway show, without any info, doubling works, but with context, it's better to use industry averages.

  I should also note the limitations: the uniform prior on N is problematic because it's improper (infinite mass). Using a different prior, like exponential, changes the result. Plus, real-world distributions aren't uniform; they have modes and variances.

