prompt: |-
  So my small group leader dropped "middle knowledge" on us last week while I was venting about a decision that blew up in my face (took a job offer instead of another, and the one I picked tanked). He basically said God knew via middle knowledge exactly how I'd choose in that circumstance and let it happen anyway. I didn't wanna argue in the moment but it's been bugging me all week. Can you lay out the most important implications of Molinism/middle knowledge for how I should actually think about my own choices and pray about future ones? Like does this mean my "free" choices were ever really up for grabs, or is that just a fancier way of saying it was all predetermined and I'm coping.
