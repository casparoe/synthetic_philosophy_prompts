prompt: |-
  For a while now I've been trying to work out on my own why a promise actually obligates the person who makes it — not just why breaking one gets punished or damages someone's reputation, but what it is about saying "I promise" that is supposed to create a duty in the first place. I have no formal training in philosophy, but while reading around I came across a passage in Hume's *A Treatise of Human Nature* (1739–40), Book III, Part II, Section V, "Of the Obligation of Promises," that seems to go right at this question. The reasoning is compressed enough that I keep losing the thread halfway through, and I'd like help working through it properly rather than just skimming a summary.

  Here is the passage:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question, then, is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man cou'd fall into, whose ideas are not confounded by prejudice and the fallacious use of language.

  All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it."

  I can follow each sentence on its own, but I'm struggling to hold the whole argument together. Could you help me with the following:

  1. Reconstruct, step by step, why Hume rules out a resolution, a desire, and a willing of the promised action itself as the "act of the mind" behind a promise, and why he concludes that what's left over must be a willing of the obligation itself.
  2. Spell out exactly where the "manifest absurdity" is supposed to lie in that idea — how the point about sentiments in the second paragraph is meant to rule it out.
  3. Give me your own assessment of whether this argument really shows that a promise is unintelligible prior to convention, or whether it quietly relies on a premise — say, about what sentiments are and how they can or can't change — that someone who thinks promises bind us naturally could reasonably reject.

  I'd like to come away understanding not just what Hume says, but whether his argument actually earns its conclusion.
