answer: |-
  This is an excellent and challenging passage—you're right to find it dense! Hume is dismantling the intuitive idea that a promise creates a moral obligation solely through an individual's mental act. Here's a breakdown addressing your questions:

  **1. Hume's Elimination of Candidates & the "Willing Obligation" Conclusion**

  Hume systematically rejects common candidates for the "act of the mind" that supposedly creates the obligation in a promise:

  *   **Not a Resolution:** Saying "I resolve to do X" expresses an *intention*. While breaking a resolution might be weak or imprudent, it doesn't inherently create a *moral duty* owed to another person. Resolutions are self-directed, not other-binding.
  *   **Not a Desire:** You can promise something you actively *don't want* to do ("I promise to pay you back, though I hate doing it"). The obligation persists despite the lack of desire. Desire is about motivation, not obligation.
  *   **Not the Willing of the Action Itself:** The will operates on *present* actions. When I promise, I'm committing to a *future* action. I cannot "will" a future action into existence *now*; I can only form an intention or resolve to will it later. Willing is inherently present-tense.

  **Conclusion:** If the obligation-creating mental act isn't resolution, desire, *or* willing the future action itself, Hume argues the *only* thing left is **willing the obligation itself**. He frames it as: The mental act must be "the willing of that obligation, which arises from the promise." In simpler terms: When I say "I promise," my mental act is supposedly an act of will *directly creating the moral duty* ("I hereby will that I am bound to do X").

  He notes this aligns with common language: "we are bound by our own consent," "the obligation arises from our mere will and pleasure."

  **2. The "Manifest Absurdity" & the Role of Sentiments**

  Hume now argues that this conclusion – that we "will the obligation" – is absurd. His argument hinges on his core moral theory: **Moral Sentimentalism.**

  *   **Premise 1: Morality Depends on Sentiments:** Hume asserts that all moral distinctions (virtue/vice, obligation) arise from our feelings (sentiments). Calling something "virtuous" means it pleases us in a specific (disinterested, general) way. Feeling "under an obligation" means the *neglect* of an action displeases us in that same specific way.
  *   **Premise 2: Obligation Requires Sentiment:** Therefore, for an obligation to exist, there *must* be a corresponding sentiment (displeasure at neglect). A *change* in obligation requires a *change* in sentiment. Creating a *new* obligation requires a *new* sentiment to arise.
  *   **Premise 3: Sentiments Cannot Be Changed by Will Alone:** Hume argues we have no direct, voluntary control over our sentiments. We cannot simply *decide* to feel pleasure or displeasure about something arbitrarily ("we can naturally no more change our own sentiments, than the motions of the heavens"). I can't, by sheer act of will, make myself find an action morally good if I naturally find it neutral or bad.
  *   **The Absurdity:** To "will the obligation" is to will a *new sentiment* (the displeasure at neglecting the promised action). But Premise 3 states we *cannot* create new sentiments by an act of will alone. Therefore, willing the obligation is impossible. It's as absurd as willing the planets to change course. Promises cannot naturally create a new sentiment (the displeasure at breaking them) out of thin air just because I will it.
  *   **Consequence:** If the only candidate mental act (willing the obligation) is absurd and impossible, then **there is no intelligible natural "act of the mind" that constitutes a promise and creates its obligation.** A promise, understood this way, is "naturally something altogether unintelligible."

  **3. Assessing the Argument: Does it Earn its Conclusion?**

  Hume's argument is powerful and internally consistent *within his system*. Whether it definitively proves promises are unintelligible prior to convention depends on whether you accept his foundational premises, particularly about sentiments. Here's the assessment:

  *   **Strengths:**
      *   **Destroys Simple Voluntarism:** He successfully demolishes the idea that obligation magically springs *just* from saying "I will it so." He exposes the mystery in thinking a mental act alone binds us morally.
      *   **Highlights Need for Convention:** His argument strongly pushes towards the solution he offers elsewhere: promises only work within a *social convention*. The convention provides the context where promise-breaking *naturally* (through sympathy, self-interest, social pressure) evokes the displeasure (sentiment) that constitutes the feeling of obligation. The words "I promise" trigger expectations and sentiments established by the convention.
      *   **Coherent within Sentimentalism:** If you accept Hume's core view that morality *is* sentiment, and sentiments are involuntary, then his conclusion follows logically.

  *   **Potential Weaknesses/Premises a Naturalist Could Reject:**
      *   **The Nature of Sentiments:** This is the *crucial* point. Hume assumes sentiments are passive, involuntary states we merely observe. A naturalist (e.g., someone influenced by Aristotelian virtue ethics or natural law) could argue:
          *   Moral sentiments might be *responses* to perceived objective reasons or relationships, not brute feelings. Recognizing a promise creates a *reason* for action, which then evokes the sentiment. The will might not create the sentiment *ex nihilo*, but it might activate a pre-existing natural capacity to recognize duties arising from voluntary commitments.
          *   Sentiments *can* be cultivated and shaped by reason and commitment over time. While I can't instantly will a sentiment, making a solemn commitment *is* an act that can initiate a process altering my sentiments and relationship to the duty.
      *   **The Nature of "Willing Obligation":** Hume's characterization of the opponent's view might be a straw man. A naturalist might *not* claim we "will the sentiment of obligation" directly. Instead, they might argue that by promising, we perform a special kind of *speech act* or enter a natural relational state (like creating a debt) that *objectively* grounds the obligation. The sentiment *follows* from recognizing this objective state, it isn't willed directly. Hume dismisses this possibility because he rejects objective moral facts independent of sentiment.
      *   **Reduction of Obligation to Sentiment:** The entire argument hinges on reducing moral obligation *entirely* to a feeling (displeasure at neglect). A naturalist could reject this reductionism. They might argue obligation is a genuine normative reality (a "to-be-doneness") that our sentiments *track* or *respond to*, rather than being identical to the sentiment itself. If obligation is more than just a feeling, then willing *could* create an obligation (understood as this normative fact) through the act of commitment, and the sentiment follows.
      *   **The Scope of the Will:** Hume has a narrow view of the will as only efficacious for present bodily actions. A naturalist might argue the will *can* effectively commit future actions through a present act of commitment, creating a persisting normative state.

  **Conclusion on Earning the Conclusion:**

  Hume *does* earn his conclusion **if you accept his core sentimentalist meta-ethics and his specific views on the passivity of sentiments and the limited scope of the will.** Within that framework, the idea of a natural, pre-conventional promise creating obligation *is* rendered unintelligible.

  However, **the argument does *not* definitively prove promises are unintelligible prior to convention to someone who rejects Hume's foundational premises.** A naturalist who believes in objective moral reasons, a more robust conception of the will's ability to create commitments, or a different view of how sentiments relate to obligation can reasonably reject the premise that willing a new obligation is absurd because it requires impossibly willing a new sentiment. They would argue Hume has misidentified the nature of the obligation or the capacity involved in promising.

  Hume's genius lies in exposing the deep puzzle and showing why *if* morality is just sentiment, promises *must* be conventional. His argument powerfully challenges simplistic voluntarism but doesn't *necessarily* refute all forms of natural obligation arising from promising, especially those grounded in different philosophical foundations. The battleground is fundamentally meta-ethical: what *are* moral obligations, and how do they arise?
