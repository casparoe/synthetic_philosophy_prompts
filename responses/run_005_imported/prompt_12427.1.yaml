  Next, does Strawson improve on Nietzsche? His formalization makes the argument harder to refute because it lays out each step, forcing engagement with each premise. Nietzsche's rhetoric might let readers avoid the logical core. Strawson's explicit definition of "ultimate responsibility" clarifies the argument's demands, whereas Nietzsche's critique is more intuitive. However, Strawson's rigidity might miss some nuances Nietzsche captures, like the existential weight of the desire for self-authorship.

