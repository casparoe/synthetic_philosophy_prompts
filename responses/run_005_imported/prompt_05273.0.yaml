  Here’s a draft of the committee’s guidance, addressing all three requested elements concisely and neutrally:

  ---

  **Craft-and-Conduct Committee Guidance**  
  *For Workshop Session: Thursday, [Date]*

  **1. Concrete Recommendation for Thursday’s Session:**  
  Facilitators will frame discussion around **observable narrative patterns across the author’s submitted manuscripts**, focusing on:  
  - How recurring traits of "desirable" characters (e.g., thin, white, able-bodied) versus "non-desirable" characters (e.g., fat, disabled, characters of color) shape reader perception of the work’s emotional logic and worldbuilding.  
  - Whether these patterns unintentionally limit the novels’ thematic resonance or character dimensionality.  
  Feedback must cite specific textual examples from the *manuscripts themselves* (e.g., "In Novel A, B, and C, romantic leads share X traits, while marginalized characters in Y roles consistently lack Z development"). Discussion of authorial intent, psychology, or dating preferences is out of scope.  

  **2. Standing Policy for Future Cases:**  
  When a *recurring pattern across multiple works* is raised:  
  - The committee will assess if the pattern is textually demonstrable and materially impacts craft elements (e.g., character consistency, narrative tension, thematic depth).  
  - Discussion will be permitted *only* if:  
    a) The pattern is evidenced in 3+ submissions from the same author,  
    b) Feedback cites manuscript excerpts, not inferred author beliefs,  
    c) The focus remains on craft consequences (e.g., "Does this pattern simplify the story’s emotional range?"), not moral judgments.  

  **3. Response to the Dating-Preference Analogy:**  
  While personal attraction is subjective, fiction constructs *narrative universes with internal rules*. Unlike dating profiles, novels:  
  - **Amplify selectivity into systems**: Repeated exclusion of entire groups from romantic/desirable roles creates implicit world rules (e.g., "In this story’s universe, only thin/white bodies merit complex desire").  
  - **Demand craft justification**: If a pattern (e.g., all villains are disabled) would raise craft concerns, so can patterns of desirability. Writers must ask: *Does this serve the story, or reflect unchallenged assumptions?*  
  - **Shape reader experience**: Unlike private attraction, published patterns signal who the narrative *invites readers to invest in*. Craft critique examines whether unintentional patterns undermine authorial goals (e.g., depth, relatability).  

  ---  
  **Key Principles Applied:**  
  - **"Manuscript on the page"**: Limits critique to textual evidence, not author’s identity.  
  - **Craft focus**: Patterns become craft issues when they recur predictably, potentially flattening stakes or character arcs.  
  - **Neutral framing**: Avoids "policing taste" by treating desirability patterns like any recurring narrative device (e.g., tropes, archetypes) subject to craft analysis.  

  This approach respects authorial autonomy while upholding the workshop’s mission to interrogate craft choices that may unintentionally constrain a work’s power or reach.
