answer: |-
  Here's a story designed for your seminar, focusing purely on the informational cascade mechanics:

  **The Whispering Stones of Kalgara**

  The island of Kalgara was renowned for one thing: its Whispering Stones. Scattered across the northern cliffs and southern jungle, these porous rocks would sometimes, inexplicably, emit faint, melodic hums when the wind blew just right. Legend held they sang loudest near the resting place of the Sky Queen’s lost diadem. Professor Thorne, leading his archaeology seminar’s field trip, saw it as the perfect final exercise.

  "Each of you," Thorne announced, holding up sealed envelopes, "receives a private clue fragment recovered from the archives. Some strongly indicate North, some South. Some are... ambiguous. Observe the choices of those who go before you. Choose North or South. We meet at the chosen location at dusk. Good luck."

  Kenji went first. His clue, a water-stained sketch, showed a stone near twisted roots. Roots could be jungle (South) or cliff-pines (North). Weak signal. He flipped a mental coin and headed North.

  Lena saw Kenji leave North. Her clue was a fragment of text: "...bathed in the *setting* sun’s glow." The northern cliffs faced west, catching the sunset; the southern jungle canopy blocked it. Moderately strong signal for North. Seeing Kenji already North, she followed without hesitation.

  Elias saw two people choose North. His clue was a tiny, carved feather – the Sky Queen’s symbol. Neutral. It could point anywhere sacred. Two prior choices for North? He reasoned the combined weight of Kenji and Lena’s private clues (whatever they were) likely outweighed his ambiguous one. North it was.

  By the time Priya’s turn came, three people were heading North. Her clue was specific: a soil sample analysis showing high volcanic ash content – unique to the geologically distinct southern jungle. A *strong* signal for South. Priya paused. Three people had chosen North. Even if Kenji’s clue was weak (possible), Lena and Elias likely had decent signals. The probability that *all three* were wrong, or had weak clues pointing North by chance, seemed lower than the probability her soil analysis was flawed (lab error? contamination?). Reluctantly, rationally, she ignored her own strong evidence and followed the crowd North.

  **This was the moment.** Priya’s choice, driven purely by the accumulated weight of prior *actions*, not their reasons, cemented the path. Her decision, in turn, became powerful public evidence for those behind her.

  Rashid saw four for North. His clue mentioned "vines thick as pythons" – strongly suggestive of the southern jungle. But *four* people? The odds that four independent clues all erroneously pointed North, especially after Priya (who seemed sharp) joined them, felt vanishingly small compared to the odds his "vines" clue was metaphorical or misread. South felt right privately, but the public evidence was overwhelming. North.

  Then came Dr. Aris, the visiting geologist. Her clue was unequivocal: a core sample coordinate tag, **A-7**. She’d cross-referenced it meticulously. A-7 was definitively in the *southern* grid sector. It was the strongest possible private signal – direct, unambiguous physical evidence for South.

  She watched Rashid, the fifth, trudge North. Five people. Five choices. Her mind became a cold calculation engine. *What are the chances?* Kenji, Lena, Elias, Priya, Rashid. Assume Kenji had a weak signal (50/50). Assume Lena had moderate (say, 70% accurate). Elias neutral (50%). Priya and Rashid? They must have had *some* reason, however strong or weak. The combined probability that *all five* independently received clues misleading them North, while her single, admittedly strong clue pointed South... it was miniscule. Statistically irrational. The public evidence – the sheer *number* of choices – drowned out her private certainty. A-7 screamed South in her mind, but Bayesian logic demanded she ignore it. The cascade had long since started, but Aris, with her powerful contrary evidence, was its most striking captive. Jaw tight, she shouldered her pack and followed the path North.

  Anya watched Aris, the respected geologist, join the line northward. Six people now. Anya’s clue was a blurry photo of a hummingbird species found only near the southern waterfalls. Strong South signal. She barely glanced at it. Six people, including Dr. Aris? The matter was settled. North.

  Only young Leo remained, clutching his clue: a single word, "sunrise." East-facing was ambiguous. He looked at the empty southern path, then at the line of figures disappearing towards the cliffs. Seven choices. Seven pieces of overwhelming public evidence. He took a step north, then paused. A small, skeptical frown creased his forehead as he watched the last of them vanish. The sheer *weight* of the choices pulled him, yet... *It only took two or three at the start, really,* he thought vaguely. *What if they were all like Kenji? What if the first clue was terrible?* But the math still favored following. He sighed, took one last look south, and followed the herd.

  High on the windy northern cliffs, the first students searched diligently. Kenji kicked a loose stone. Lena peered at a non-descript rock. Priya stared miserably at her soil sample kit, useless on volcanic basalt. Dr. Aris quietly rechecked her map, the coordinate A-7 burning in her mind. Below, in the dense southern jungle, unseen by anyone, a Whispering Stone nestled amongst thick vines hummed a clear, sweet note into the gathering dusk.

  ---

  **Key Elements Embedded:**

  1.  **Pure Informational Cascade:** Every character uses observed *choices* (not reasons, expressions, or pressure) as public evidence to update their Bayesian priors. No social fear.
  2.  **Cascade Trigger:** Priya is the pivot. Her strong private signal (soil = South) is rationally overridden by the accumulated public evidence of three prior North choices. This makes ignoring strong private signals the rational norm from then on.
  3.  **Dr. Aris - Strong Signal Ignored:** Her unambiguous coordinate (A-7 = South) is the strongest possible private evidence. Yet, the weight of *five* prior choices makes ignoring it the strictly rational Bayesian decision. This highlights the core paradox.
  4.  **Fragility Hinted:** Leo's final hesitation and thought ("*It only took two or three at the start, really... What if they were all like Kenji?*") directly addresses the fragility. The entire cascade rests on the early, potentially weak signals (like Kenji's coin flip). A single new public revelation (e.g., someone loudly declaring their initial clue was weak, finding Kenji's ambiguous sketch) could shatter it. The humming stone in the south underscores the potential reality diverging from the cascade.
  5.  **Non-Finance Setting:** Archaeology/treasure hunt.
  6.  **Under 1000 Words:** ~850 words.
  7.  **No Tidy Moral:** Ends with the cascade in place, people doubting privately but conforming rationally, and the potential truth humming unseen in the south.

  This story provides a clear, narrative illustration of the Bikhchandani-Hirshleifer-Welch mechanics before diving into the formal model. Good luck with the seminar!
