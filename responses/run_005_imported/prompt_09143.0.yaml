  First, I should recall the core mechanics of informational cascades: individuals sequentially decide based on private signals and prior choices. Once public information outweighs private signals, rational actors ignore their own data. The story must avoid emotional conformity—pure Bayesian updating only.

  The user dislikes finance settings, so alternative scenarios are needed. Possible ideas: art authentication, wildlife sightings, food safety rumors, or treasure hunting. A treasure hunt feels fresh—vague clues about an artifact's location could create ambiguity. Participants receive private hints (some strong, some weak) and observe others' choices without knowing their reasons.

