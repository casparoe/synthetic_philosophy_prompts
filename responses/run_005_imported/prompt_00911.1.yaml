answer: |-
  You've hit on a fascinating and contentious point! Harsanyi's Aggregation Theorem (1955) is indeed a powerful result that seems to bypass the traditional objections to utilitarianism raised by Lionel Robbins and the ordinalist revolution. However, it hasn't "dissolved" the interpersonal comparison problem in the eyes of most moral philosophers or many welfare economists. Here's a breakdown of why:

  1.  **What Harsanyi Actually Shows (The Core Argument):**
      *   **Premise 1: Individual Rationality:** Each individual has preferences over lotteries that satisfy the von Neumann-Morgenstern (vNM) axioms. This means their preferences can be represented by a cardinal utility function, unique up to affine transformation (i.e., scale and origin).
      *   **Premise 2: Social Rationality:** Society *as a whole* also has preferences over the same lotteries, and these preferences *also* satisfy the vNM axioms. Society thus has its own cardinal social welfare function.
      *   **Premise 3: Pareto Indifference:** If every individual is indifferent between two social outcomes, then society must also be indifferent.
      *   **Conclusion:** The social welfare function (SWF) *must* be a **weighted sum** of the individual vNM utility functions: `W = a1*U1 + a2*U2 + ... + an*Un` (where `ai > 0`). This is a weighted utilitarian SWF.

  2.  **The "Bypass" Argument (Why it *Seems* to Solve Interpersonal Comparisons):**
      *   The key move is that the vNM framework provides a **cardinal measure of utility for each individual *within* their own preference structure**. We know what it means for *Individual A* to prefer X over Y *twice as much* as they prefer Y over Z, based purely on their choices under risk.
      *   Harsanyi doesn't require us to know if "one util of A equals one util of B" in some external, interpersonally comparable sense *before* aggregation. The aggregation happens using these internally cardinal individual utility functions.
      *   The weights `a_i` appear as part of the *social* vNM utility function. They are determined by how society (via its vNM preferences) trades off lotteries affecting different individuals.

  3.  **Why the Problem Isn't Fully Dissolved - The Critiques:**

      *   **The Weights (`a_i`) *Are* Interpersonal Comparisons in Disguise:** This is the most fundamental critique.
          *   Choosing the weights `a_i` *is inherently* an interpersonal comparison. Giving A a higher weight than B means society values a unit increase in A's vNM utility *more* than a unit increase in B's vNM utility.
          *   Harsanyi derives the weights from the *social* vNM preferences. But where do *those* preferences come from? They must be formed by some entity (a "social planner," a constitution, a voting mechanism) that *implicitly or explicitly makes interpersonal comparisons* about whose gains or losses matter more. The theorem doesn't magically generate these weights; it assumes they exist within the social preference ordering.
          *   As philosopher John Broome puts it, Harsanyi shows utilitarianism is the correct form *if* social preferences are vNM and satisfy Pareto, but it doesn't tell us what those social preferences *should be*. Setting the weights requires a normative judgment about the relative importance of different people's well-being.

      *   **The Scope of vNM Rationality:** The theorem assumes that *social* choices under risk can and should obey the same axioms as *individual* choices under risk. Many philosophers (e.g., John Rawls) argue this is inappropriate. Society shouldn't be "risk-neutral" in the same way an individual gambler might be. Concerns about fairness, equality, or the "separateness of persons" might lead us to reject the vNM axioms for social choice, especially when lotteries involve fundamental distributions of well-being.

      *   **vNM Utility vs. Well-being:** Heraanyi identifies an individual's vNM utility function with their *well-being*. Critics argue:
          *   vNM utility reflects *rational preference satisfaction under risk*, but well-being might be something else (e.g., objective goods, capabilities, happiness). A rational individual might prefer a risky option leading to lower expected well-being due to misperception, addiction, or adaptive preferences.
          *   Even if vNM utility tracks well-being *for an individual*, the affine uniqueness means we can only compare *ratios of utility differences* within an individual, not absolute levels. Harsanyi's aggregation *requires* comparing the *levels* of the `U_i` functions scaled by `a_i`. The affine freedom of individual utilities is absorbed into the choice of weights (`a_i`), meaning the choice of weights *is* the choice of how to interpersonally scale the utility functions. There's no escaping it.

      *   **Pareto is Too Weak:** Pareto Indifference (the condition used) is a very minimal requirement. Stronger Pareto principles (like Pareto Superiority - if someone gains and no one loses, society prefers it) are often needed for compelling arguments, but Harsanyi's core result uses the weaker version. Some argue stronger conditions might lead to different conclusions or reintroduce comparison problems more starkly.

      *   **The "Quiet Solution" Perception:** While influential in economics (especially game theory and mechanism design), Harsanyi's theorem has been extensively debated *within* economics. Welfare economics textbooks still dedicate significant space to the problem of interpersonal comparisons. Philosophers like Amartya Sen, John Rawls, Ronald Dworkin, Derek Parfit, and many others have engaged deeply with Harsanyi, often arguing his framework doesn't adequately capture justice, fairness, or equality.

  4.  **Conclusion: What Harsanyi Achieved and What Remains:**

      *   **Achieved:** Harsanyi provided a brilliant and rigorous **formal foundation** for weighted utilitarianism. He showed that *if* you accept the vNM axioms for individuals *and* for society, *and* accept Pareto Indifference, then utilitarianism (with weights) is the *only* consistent social welfare function. This is a major theoretical achievement.
      *   **What Remains:** The theorem **does not eliminate the need for interpersonal comparisons**. It **relocates** them:
          *   The interpersonal comparisons are embedded in the **social vNM preferences** (and thus the weights `a_i`), or in the **identification of vNM utility with well-being**.
          *   Justifying the social vNM preferences or the weights `a_i` requires normative arguments about the relative moral importance of different individuals' welfare gains and losses – the core of the interpersonal comparison problem.
          *   Many moral philosophers reject the premise that social choice should mirror individual choice under risk via the vNM axioms.

  So, while economists haven't been "quiet" about it (it's a cornerstone of modern social choice theory), and Harsanyi provided a profound formalization, moral philosophers haven't "failed to catch up." They've actively engaged with it, recognized its power, and argued persuasively that the deep normative questions about *whose well-being counts, and how much* – the essence of Robbins's worry – are not resolved by the theorem alone. The weights (`a_i`) are the point where interpersonal comparisons re-enter the picture decisively. The debate continues, enriched by Harsanyi's contribution but not ended by it.
