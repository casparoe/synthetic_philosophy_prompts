  I should mention the practical implications. When a model retrodicts old data, check if that data was problematic for previous theories. Also, see if the new model offers new predictions. The user wants to know how to evaluate such claims critically. They might be a student or someone interested in philosophy of science, trying to understand scientific rhetoric.

