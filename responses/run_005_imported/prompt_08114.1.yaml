answer: |-
  You've hit the nail on the head with Glymour's "problem of old evidence" (POE). It's a profound challenge to the naive application of Bayesian confirmation theory (BCT), and your Mercury/perihelion example is the *classic* illustration. Your suspicion when scientists emphasize "explaining" old data is *absolutely justified*, but the situation is nuanced. Here's a breakdown of the implications and how to weigh such claims:

  ### The Core Problem & Bayesian "Patches"

  1.  **The Formal Problem:** As you stated, if evidence E (Mercury's perihelion) is *already known* (P(E) = 1), then Bayes' Theorem says:
      `P(H|E) = P(E|H) * P(H) / P(E) = P(E|H) * P(H) / 1 = P(E|H) * P(H)`
      Since P(E|H) ≤ 1, `P(H|E) ≤ P(H)`. Conditioning on E *cannot increase* the probability of *any* hypothesis H (like GR). This clashes violently with the intuition that GR explaining this *stubborn anomaly* was powerful evidence.

  2.  **The Main Bayesian "Patch": Counterfactual Probability (The Standard Solution)**
      Bayesians argue we misapply the theorem. We shouldn't use our *current* probability assignment (where P(E)=1). Instead, we should consider our *belief state **before** E was known*:
      *   Imagine ourselves in a state of ignorance about E (Mercury's orbit).
      *   In that counterfactual state, P_old(E) was *not* 1. Newtonian mechanics couldn't fully explain it, so P_old(E) based on background knowledge (B) alone was arguably *low* or at least uncertain.
      *   GR, however, *entails* E (or makes it very probable). So P_old(E | GR) ≈ 1.
      *   *Now* apply Bayes in that counterfactual state: Learning E *would* have dramatically increased the probability of GR relative to Newtonian physics because P_old(E | GR) >> P_old(E | ~GR) ≈ P_old(E | Newton).
      *   **Implication for You:** When a scientist says "our model explains known result X," ask: "How surprising was X *before* this model? Was it an anomaly for previous theories?" If yes, the explanation *is* significant confirmation via this counterfactual reasoning. If X was entirely expected under old theories, its "explanation" is less impressive.

  3.  **Other Responses & Complications:**
      *   **Changing Background Knowledge (B):** GR didn't just explain E; it radically changed our fundamental background knowledge (B) about space, time, and gravity. Incorporating GR into B *itself* changes how we view E. While E was known, the *meaning* of E and its relationship to fundamental physics changed. Confirmation might arise from this conceptual shift and unification.
      *   **Logical Learning:** Discovering that H *entails* E (even if E is known) can be informative. If you didn't *know* that GR entailed the perihelion shift, learning this logical connection *can* boost your credence in GR, as it demonstrates GR's ability to unify and resolve known puzzles within its framework. This is trickier to formalize purely in probability.
      *   **The Problem of Setting P_old(E):** The counterfactual solution relies on estimating P_old(E) – the probability of the evidence *without* the new theory but *with* the old background knowledge. This is often difficult and subjective. How *should* we have probabilistically assessed Mercury's orbit pre-GR, knowing Newton was mostly successful but had this specific anomaly?
      *   **Not Fully Patched:** Philosophers debate if any solution is entirely satisfactory. The counterfactual approach is the dominant one, but issues like setting P_old(E) and handling logical learning persist. POE highlights that BCT might not capture *all* aspects of scientific confirmation (e.g., explanatory power, unification).

  ### Implications for Weighing "Explains Old Evidence" Claims

  1.  **Suspicion is Warranted (But Context Matters):** You are *right* to be more suspicious of "explains old evidence" compared to a genuine novel prediction. The latter is often seen as the "gold standard" because it avoids potential accusations of fitting the model *to* the known data (accommodation). However:
  2.  **Key Question: Was it an Anomaly?** This is crucial. *Why* was the evidence "on the books"?
      *   **If it was a known *anomaly* for the dominant theory (like Mercury for Newton):** Explaining it is **highly significant confirmation** via the counterfactual argument. It resolves a persistent problem. This is the GR scenario. Discounting this would be a mistake.
      *   **If it was well-explained/expected by existing theories:** A new model "explaining" it adds **little to no new confirmatory weight**. It's merely showing the new model can match the old model's success on this point. The bar is low.
      *   **If its status was ambiguous or unknown:** Explanation adds *some* weight, demonstrating the model's applicability, but less than explaining a clear anomaly or making a novel prediction.
  3.  **Look for Novelty *Within* the Explanation:** Even when explaining old data, *how* does the new model do it?
      *   Does it provide a *simpler*, more *unified*, or more *fundamental* explanation than the old theory? (GR vs. Newton on gravity).
      *   Does the explanation *naturally fall out* of the model's core principles, or does it require *ad-hoc adjustments* specifically for this data point?
      *   Does explaining this old data point *simultaneously* explain *other* phenomena or resolve *other* inconsistencies? (Unification is powerful).
  4.  **Demand Novel Predictions (Eventually):** While explaining a major anomaly is strong evidence, a truly robust theory *must* make testable *novel* predictions that go beyond the data it was designed to explain (or the old anomalies it resolved). GR predicted light bending, gravitational redshift, and gravitational waves. A theory that *only* retrodicts known data, especially non-anomalous data, is suspect. Ask: "What *new* phenomena does this model predict that we haven't seen yet?"
  5.  **Beware of "Just-So" Storytelling:** Be highly skeptical if the model seems overly complex, heavily parameterized, or appears to have been *tailored* specifically to fit the known old data points without a compelling independent motivation or novel predictions. This is accommodation, not confirmation.

  ### Conclusion & Your Gut Feeling

  *   **Bayesians have a patch (counterfactual probability),** and it's logically coherent. It explains *why* explaining a known anomaly like Mercury's orbit *is* strong evidence: because relative to our prior state of knowledge *before knowing the theory*, the evidence was unlikely, and the theory makes it likely.
  *   **Your suspicion is fundamentally correct.** "Explains old evidence" is *not* as strong, *ceteris paribus*, as a successful novel prediction. It *can* be strong evidence, but *only if* the old evidence was genuinely problematic (anomalous) for previous theories. If it wasn't anomalous, the "explanation" adds little.
  *   **Weigh it by asking:**
      1.  **Was this evidence a headache for the old theory?** (If yes, significant plus).
      2.  **Does the explanation feel natural and unified, or forced and ad-hoc?**
      3.  **Does the model *also* make genuinely novel, testable predictions?** (Essential for long-term credibility).

  So, next time a scientist highlights their model's ability to "explain" or "retrodict" old data, don't dismiss it outright, but immediately interrogate: "Was that data point actually a *problem* before? Or was it just another data point everyone expected?" The confirmatory power hinges entirely on the answer. The Mercury example feels like huge confirmation precisely because it was a glaring, decades-old problem – the counterfactual P_old(E) was low, and P_old(E|GR) was high. If they're "explaining" something mundane, feel free to be deeply unimpressed.
