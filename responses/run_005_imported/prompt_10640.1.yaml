prompt: |-
  Me and my friend Dana got into it last night over Kripke's Wittgenstein book -- we're both in this informal reading group and had just gone through the "quus" chapter again. We actually agreed on most of it: nothing about my finite past use of "+" settles whether I mean plus or some deviant quus-type function, and the obvious fix (say it's fixed by my dispositions) doesn't work, since dispositions are finite and can misfire, so they can't carry the "shoulds" that meaning something seems to require. Where we started yelling at each other (nicely) was over the skeptical solution.

  Dana's position was basically: fine, so Kripke can't find a fact about ME that fixes what I mean, so he punts to the community -- now what makes it true that I mean plus is that my answers match what everyone else would say. But that's just relocating the exact same problem one level up, since the community's collective dispositions are just as finite and just as capable of misfiring as mine were, so nothing's actually been solved, he's basically just found a bigger disposition to hide behind. I had this strong intuition that this is missing the point of calling it a "skeptical" solution rather than a "straight" one -- like Kripke isn't offering communal agreement as the new truth-maker at all -- but I couldn't actually reconstruct the argument for why that's not just a dodge, and neither of us could remember how the Hume-on-induction comparison is suppossed to make this less circular. Can you walk through, fairly intuitively, what the straight/skeptical distinction is actually doing here, whether it genuinely blocks Dana's "you've just relocated the problem" objection or whether she's basically right and it's a verbal trick, and how much of this rests on that Hume analogy actually holding up?
