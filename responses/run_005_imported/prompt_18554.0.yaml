  I notice the stakes asymmetry is particularly thorny. In classic pragmatic encroachment examples (like deciding whether to stop for gas), the believer bears the risk. Here, the council judges while the student faces consequences. That might weaken the case for variable standards since the council isn't personally impacted. 

  The user's memo must navigate institutional constraints too. The bylaws mention "sufficient evidence" without defining it—that ambiguity is where contextualism could shine. But the invariantist member has a point: if evidence isn't strong enough for expulsion, is it ethical to issue any sanction? A hybrid approach might work: keep one standard for findings but require higher confidence for serious charges. That aligns with how some legal systems use "clear and convincing evidence" for severe penalties.

  For structure, I'll start by neutrally framing all three positions before recommending tiered standards. The rebuttal to invariantism should emphasize that sanctions depend on findings—so confidence in the finding itself must match the sanction's gravity. The appendix translating philosophical terms into bylaw language should help practical implementation.

