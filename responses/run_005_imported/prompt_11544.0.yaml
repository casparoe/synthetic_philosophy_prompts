  So this happened at my cousin's engagement party this weekend and I haven't been able to stop thinking about it. My aunt's husband Marco and my cousin's friend Renata ended up in this whole debate about their mutual friend Sofia, who's been going back and forth for like a year over whether to have a baby (apparently she even made a pros and cons spreadsheet about it). Marco's take was that Sofia can't actually make this decision "rationally" in the normal sense, because the thing you'd need to know to weigh it properly -- what it's actually like, and whether you'd be glad you did it -- only becomes available once you're already a parent, and becoming a parent might change what you even care about, so the person who'd be doing the enjoying later isn't quite the same person doing the deciding now. He said talking to other parents doesn't really fix this, because their reports come from inside a headspace Sofia doesn't have access to yet. Renata said that's a cute idea but it proves way too much, since literally every big decision changes you at least a little -- moving away for college does, a serious relationship does -- and we don't say those can't be decided on rationally, so something must be wrong with the argument, not with Sofia. Marco's comeback was that having a kid isn't a change of degree like those, it's a change of kind, since basically every parent says it reorganizes their whole value system rather than just adding one more preference to the pile. Renata's next move was that Sofia should still just weigh the testimony -- sure, any one story is unreliable, but a thousand consistent stories ("rough at first, glad later") is real evidence, and refusing to use it because it isn't perfectly first-person is just an excuse to stay stuck. Marco's response to that was that testimony can hand Sofia the facts about outcomes, but not how she'll personally value those facts once her values have already shifted, and that's the actual missing piece, not just a lack 