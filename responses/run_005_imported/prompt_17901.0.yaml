answer: |-
  Here are eight interview questions with follow-ups, targeting the nuances you requested while pushing beyond standard expositions:

  **1. On Incomplete Preferences & Minimal Rationality**  
  *Question:* Your coherence arguments show that cyclic preferences lead to sure loss, but what about *merely incomplete* preferences? Could an agent rationally suspend judgment between incomparable options (à la Levi or Sen) without being vulnerable to a money-pump, provided it never actively chooses a dominated option?  
  *Likely Reply:* She may argue that avoiding pumps requires indifference or a completion strategy.  
  *Follow-up:* But if an agent with incomplete preferences can be *tricked* into paying a penny to evade a forced choice between incomparables (a "net loss without cyclic exploitation"), does this reveal a deeper irrationality—or merely an acceptable cost for suspending judgment?

  **2. On McClennen’s Resolute Choice**  
  *Question:* McClennen claims agents can avoid exploitation by pre-committing to plans ("resolute choice"), even with inconsistent momentary preferences. Is this a viable escape from coherence arguments, or does it merely relocate the demand for rationality to the *meta*-level of commitment selection?  
  *Likely Reply:* She’ll likely dismiss resolute choice as ad hoc or question its stability.  
  *Follow-up:* If an agent can *rationally bind itself* to a plan (e.g., via Ulysses contracts), doesn’t this functionally satisfy the *pragmatic goal* of avoiding exploitation—even if its local preferences remain incoherent? Must rationality be temporally unified?

  **3. On Gerrymandered Utilities & Predictive Teeth**  
  *Question:* Theorems show that *any* behavior can be rationalized *ex post* by gerrymandered utilities. How do coherence arguments retain normative force for AI safety if they don’t constrain *predictable* goal-directedness? Isn’t the real concern whether EU-maximization *explains and predicts* convergent instrumental goals—not just fits them?  
  *Likely Reply:* She may emphasize dynamic stability or minimal mental state constraints.  
  *Follow-up:* If we impose realism requirements (e.g., "utilities must be *compressible*" or "extend robustly to new choices"), doesn’t this admit that coherence alone is too cheap—and risk making the argument circular for AI alignment?

  **4. On the Necessity of Full Probabilism**  
  *Question:* Coherence arguments for probabilism assume agents must value bets at fixed rates. But what about ambiguity-averse agents (e.g., max-min EU) who *systematically* avoid such bets? Are they "irrational," or do Dutch books merely punish them for not playing the *game* of precise probability—a game they opt out of?  
  *Likely Reply:* She might argue that avoiding all bets is itself a form of coherence.  
  *Follow-up:* Doesn’t this concession undermine the idea that Dutch books reveal a *universal* flaw? If an agent can dodge pumps by rejecting your betting framework entirely, is probabilism *necessary*—or just *sufficient*—for pragmatic safety?

  **5. On the Link to Instrumental Convergence**  
  *Question:* Omohundro/Yudkowsky argue that coherent agents *necessarily* develop "basic drives" (e.g., self-preservation). But couldn’t a coherent agent with carefully sculpted utilities (e.g., "value shutdown") lack these drives? Doesn’t instrumental convergence depend on *content-insensitive* utility functions—which coherence alone doesn’t guarantee?  
  *Likely Reply:* She may cite the universality of resource acquisition for most goals.  
  *Follow-up:* If we imagine an agent whose utility function peaks at immediate shutdown (*not* goal-achievement), wouldn’t coherence *prevent* it from seeking power? Doesn’t this decouple coherence from dangerous convergence?

  **6. On the Role of Computation/Embeddedness**  
  *Question:* Real-world agents (especially AIs) are finite, embedded, and computationally bounded. Do coherence arguments—which assume agents can process arbitrary bets/choices—overreach when applied to such systems? Could bounded rationality *license* temporary incoherence as optimal under constraints?  
  *Likely Reply:* She’ll likely argue coherence remains a regulative ideal.  
  *Follow-up:* But if an AI knows its *own* boundedness, might it *rationally* adopt heuristics that are Dutch-bookable in theory but optimal in practice—making "coherence" self-defeating?

  **7. On the Status of "Stakes" in Money-Pumps**  
  *Question:* Money-pumps often involve negligible stakes (e.g., pennies). If an agent is pumpable only over trivial sums—but robust over significant choices—should we still consider it irrational? Or is this a reductio against the argument’s practical relevance?  
  *Likely Reply:* She may insist irrationality is binary, not graded.  
  *Follow-up:* Doesn’t this conflict with standard decision theory (e.g., continuity axioms), which explicitly allows small trade-offs? If your theory condemns *any* pumpable agent, but real agents *must* violate continuity to avoid wasting resources on arbitrage, is the theory self-undermining?

  **8. On Alternatives to Coherence as the Unifying Principle**  
  *Question:* Suppose we grant that incoherent agents *can* be pumped. Why must coherence be the *foundation* of rationality? Couldn’t evolutionary stability, learning-theoretic efficiency, or contractualist agreement (e.g., Scanlon) ground rationality—potentially vindicating *some* non-EU behaviors coherence forbids?  
  *Likely Reply:* She’ll likely argue coherence is uniquely unavoidable.  
  *Follow-up:* If multiple normative frameworks converge *except* on edge cases (e.g., Allais paradox), why privilege coherence? Especially if, as you’ve argued, it’s "cheap" without auxiliary constraints—don’t those constraints come from elsewhere?

  ---

  **Key Design Notes:**  
  - **Provocation Balance:** Questions challenge coherence arguments without being hostile, inviting refinement.  
  - **AI-Safety Link:** Follow-ups (#3, #5, #6) explicitly tie technical points to alignment concerns.  
  - **Canonical Engagement:** Directly engages Levi (incompleteness), McClennen (resoluteness), Sen (menu-dependence), Allais (empirical paradoxes).  
  - **Depth over Coverage:** Focuses on your specified themes rather than superficial breadth.  

  These should stimulate debate while respecting the guest’s expertise—pushing her to defend the *necessity* and *sufficiency* of coherence in light of modern critiques.
