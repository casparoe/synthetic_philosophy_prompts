  For Reny's point: The second question forces the speaker to confront how players should interpret surprises. The follow-up challenges whether common knowledge can survive unexpected moves, preventing the speaker from hand-waving antecedent failure. 

  For forward induction: The third question pits backward against forward induction after observed passes. The follow-up demands why rationality would ignore such evidence, blocking the antecedent-failure dodge by forcing engagement with the paradox. 

