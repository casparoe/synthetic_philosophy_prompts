  First, I need to recall McMahan's arguments. His key point is that deep morality concerns individual moral liability, while the law of war is a practical framework for real-world application. The students think switching to convention-based rules abandons revisionism. I need to show this distinction is principled, not ad hoc.

  The user asks which horn the distinction addresses. McMahan's approach primarily tackles the contingent pacifism horn by allowing deep morality to be stringent but using legal/conventional norms to permit necessary actions in war. However, the near-total war horn might still be an issue in deep morality but is managed by legal distinctions.

  I should emphasize the independent motivations McMahan uses: epistemic limitations, moral corruption, and the need for effective conventions. These aren't just pulled out of nowhere; they're grounded in practical philosophy. Also, the value of having workable rules that reduce harm overall supports maintaining symmetrical rules in law, even if deep morality is asymmetrical.

  The user wants clarity on which horn is resolved versus relocated. Contingent pacifism is defused in practice by the law, but the deep moral issue remains. Near-total war is relocated to deep morality, where McMahan might argue civilians aren't liable, but the legal framework prevents targeting them, avoiding the practical consequences.

  I should also address the criticism that this abandons revisionism. McMahan's project isn't just about theory; it's about reforming how we think about war. The distinction allows him to critique existing practices while proposing feasible improvements. By separating ideal theory from non-ideal theory, he maintains the revisionist stance without impractical outcomes.

  Need to structure the response: start with explaining the dilemma, then McMahan's distinction, independent motivations, which horn it addresses, and how it handles the other horn. Conclude by reinforcing that this is a principled approach to balancing morality and practicality in war ethics.
answer: |-
  Here’s the strongest case for McMahan’s distinction as a principled response to Lazar’s dilemma, addressing your specific queries about which horns it resolves and relocates:

  ### **Core Argument: The Distinction as Principled, Not Ad Hoc**
  McMahan’s distinction isn’t a retreat but a *necessary structural feature* of applying moral theory to complex institutional practices like war. It rests on three independently motivated pillars:

  1.  **The Epistemic Gap:** Deep morality assesses objective permissibility under full knowledge. But war is defined by radical uncertainty (fog of war, propaganda, intelligence failures). Combatants cannot reliably discern who is *truly* liable in real time. A legal/conventional framework that simplifies moral criteria (e.g., combatant status) is epistemically necessary to prevent catastrophic errors and self-serving judgments. This isn’t unique to war; criminal law uses "reasonable person" standards for similar reasons.

  2.  **The Moral Corruption Hazard:** Asymmetric rules ("kill only *truly* unjust combatants") create perverse incentives. The *unjust* side, knowing it faces greater liability, has *less reason* to follow *any* constraints (e.g., sparing POWs, avoiding human shields). Symmetry, even if morally imperfect, sustains mutual restraint—a paramount good in minimizing suffering. This draws from game theory (assurance problems) and historical lessons (e.g., brutalization in ideological wars).

  3.  **The Function of Law vs. Ideal Morality:** Law aims at *feasible coordination* under non-ideal conditions. Deep morality sets the aspirational target; law navigates toward it *within constraints*. Demanding that law directly mirror deep morality ignores its role in regulating fallible agents. McMahan parallels this with domestic law: we condemn murder as deeply immoral but accept plea bargains or imperfect statutes as practically necessary tools.

  ---

  ### **Which Horn(s) Does the Distinction Defuse?**
  1.  **The "Contingent Pacifism" Horn (Primarily Defused):**
      *   **How:** McMahan *concedes* this horn bites at the level of **deep morality**. Yes, many unjust combatants (and civilians) may *objectively* lack liability due to duress/ignorance. Hence, deep morality *does* often forbid killing them—and many real wars are deeply unjust.
      *   **The Distinction's Work:** The *law/convention* tier operates precisely to avoid pacifist paralysis *when fighting is necessary to prevent greater injustice*. It provides *agent-relative permissions* for just combatants: "Given your epistemic limits and the need for a workable convention, you may permissibly target *combatants* (as legally defined) on the unjust side, even if deep morality might deem *some* individually non-liable." This *doesn't* make the killing deeply *morally justified* for the individual killer, but it provides a *pragmatic justification* for the rule-system permitting it.
      *   **Principled Justification:** This isn’t abandoning revisionism; it’s *applying* it realistically. Revisionism exposes the *moral tragedy* of war—that just causes often require acts (killing non-liable persons) that are *objectively* wrong but *excusable or pragmatically necessary* under systemic constraints. The distinction prevents contingent pacifism from crippling necessary defense.

  2.  **The "Near-Total War" Horn (Mostly Relocated, Partially Addressed):**
      *   **Relocation:** The distinction *relocates* the core challenge of this horn to **deep morality**. McMahan *must still argue* within deep morality why civilians (taxpayers, workers) generally *aren't* liable to lethal force, even if minimally responsible. He typically does this by emphasizing:
          *   **Thresholds of Causality/Intent:** Civilian contributions are often indirect, small-scale, and lack *sufficiently direct causal link* to specific unjust harms to meet liability thresholds.
          *   **Intentionality:** Munitions work may be economically motivated, not specifically intended to enable *unjust* wars.
          *   **Moral Distinction:** Combatants are *direct agents* of violence; civilians are not (even if enabling).
      *   **Partial Address via Convention:** Crucially, the *law/convention* tier *reinforces* civilian immunity as a bright-line rule *regardless* of deep moral debates. This rule is justified independently by:
          *   **Epistemic Limits:** Distinguishing "guilty" from "innocent" civilians is impossible in practice.
          *   **Humanitarian Imperative:** Unrestricted warfare is catastrophic; a firm rule minimizes harm.
          *   **Preventing Slippery Slopes:** If liability were the *legal* standard, states would inevitably stretch "contributing civilian" to include vast populations.
      *   **Why Not Fully Resolved?** Deep morality *might* still condemn some civilians as liable (e.g., a propagandist knowingly inciting genocide). McMahan likely accepts this but argues the *practical rule* must err on the side of non-targeting. The distinction *contains* the near-total war risk by making civilian immunity a bedrock convention, even if deep morality's liability standard is theoretically contested.

  ---

  ### **Countering the "Dodge" Accusation: Vindication, Not Abandonment**
  *   **Preserving the Core Revisionist Insight:** The distinction *relies on* the revisionist denial of MEC at the deep level. It *uses* that insight to explain *why* the existing laws/conventions are morally flawed (they protect the objectively liable) and to guide *long-term reform* (e.g., better defining aggression, enhancing civilian distinction protocols). It doesn't retreat *from* asymmetry; it explains why symmetry persists *pragmatically*.
  *   **Engaging Non-Ideal Theory:** War occurs in a non-ideal world. McMahan's two-tier structure is classic non-ideal theory: 1) Identify the ideal (deep morality), 2) Craft the best *feasible* rules to approximate it under constraints (law/convention). Dismissing this as a "dodge" ignores the necessity of transition rules in moral progress.
  *   **The Cost of Purity:** Insisting that battlefield practice mirror deep morality *perfectly* guarantees paralysis or disaster (contingent pacifism *or* near-total war). McMahan's approach minimizes foreseeable harm while pushing for incremental moral improvement. This *is* vindication: it shows revisionism provides both the critical standard *and* a responsible path toward its (partial) realization.

  **In summary:** McMahan's distinction *defuses the practical bite* of the contingent pacifism horn by providing a justified pragmatic framework for action under non-ideal conditions, rooted in epistemic humility and the imperative of restraint. It *relocates the theoretical challenge* of the near-total war horn to deep morality (where McMahan offers arguments against civilian liability) while using the convention tier to *prevent* its practical realization. This isn't ad hoc; it's a structured response to the tragic realities of war, grounded in independent principles of moral epistemology, institutional design, and non-ideal theory. It allows revisionism to be both radically critical *and* practically relevant.
