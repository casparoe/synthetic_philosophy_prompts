answer: |-
  I'll argue that treating a slur's derogatory force as **non-at-issue content**—specifically, as a **presupposition**—provides a more empirically and theoretically sound account of projection and reclamation than Hom-style truth-conditional externalism. Here’s the strongest case for your friend’s position, addressing your objections while leveraging the data you both find puzzling.

  ### 1. **Projection Data: Non-At-Issue Content Explains Embedding Robustness**  
     Slurs project derogatory force universally across embeddings:  
     - Conditional: *"If Hans is a Boche, he’s militaristic"* still offends.  
     - Negation: *"Hans isn’t a Boche"* implies offense toward Germans.  
     - Question: *"Is Hans a Boche?"* feels bigoted regardless of the answer.  
     
     **Presuppositional Treatment**:  
     - The derogatory content (e.g., *Hans is despicable/lesser because he’s German*) is a presupposition triggered by "Boche." Presuppositions survive embedding because they are **preconditions for the utterance to be interpretable**, not part of what’s asserted.  
     - *Projection follows automatically*: Just as *"The King of France is bald"* presupposes a king exists (even under negation), *"Hans is a Boche"* presupposes Germans are contemptible. This explains why offensiveness persists in complex sentences.  

     **Hom-Style Failure**:  
     Hom treats "Boche" as expressing a complex property like *German + despicable*. This:  
     - Creates truth-value gaps: *"If Hans is a Boche..."* becomes *"If Hans is German and despicable..."*. But if Hans is German and not despicable, the antecedent is false—**no offense should arise**, contradicting intuition.  
     - Fails under negation: *"Hans isn’t a Boche"* would mean Hans isn’t German *or* isn’t despicable. But the offensive implication targets Germans, not Hans’s character.  
     - **Result**: Hom must stipulate ad-hoc mechanisms to force derogation to project, violating compositionality. Presupposition handles this systematically.

  ---

  ### 2. **Reclamation: Contextual Suspension, Not Semantic Change**  
     You worry that non-at-issue views can’t explain how in-group use (e.g., "queer" in LGBTQ+ contexts) sheds derogation without becoming a new term. Presuppositionalism elegantly resolves this:  
     
     **Presupposition Suspension**:  
     - Presuppositions are **context-dependent**. In reclaimed uses, the derogatory presupposition is *actively blocked* by the speech context.  
     - Example: When a gay person says *"I’m a queer"*, the utterance occurs against a backdrop of shared defiance. The presupposition of contempt isn’t triggered because the speaker **denies its contextual common ground** (Potts 2007; Nunberg 2018).  
     - The *descriptive content* (e.g., *homosexual*) remains identical—it’s not a new word, just a context where the presupposition fails to activate.  

     **Hom-Style Incompatibility**:  
     - Hom’s view requires "queer" to express *homosexual + despicable*. Reclamation would demand a **semantic rupture**: the word must now express *only* the descriptive content (or worse, a positive property). But this:  
       - Ignores that reclaimed slurs often *retain* edginess (e.g., "queer" as radical, not neutral).  
       - Can’t explain why out-group use instantly reactivates derogation: If "queer" were a new neutral term, bigots couldn’t weaponize it.  
     - Presuppositionalism avoids this: The same lexical entry persists; context determines if the presupposition fires.

  ---

  ### 3. **Your Truth-Concession Objection: Separating Truth from Toxicity**  
  You objected that calling *"Hans is a Boche"* true (if Hans is German) concedes legitimacy to bigotry. But this misconstrues the non-at-issue view:  
     - **Truth ≠ Endorsement**: The sentence is true iff Hans is German *because that’s the truth-conditional core*. The presupposition (*Germans are contemptible*) is **not part of what’s made true by the world**—it’s a backgrounded commitment of the *speaker*.  
     - **Accountability**: We condemn the utterance not because it’s false, but because the speaker *presupposes* something vile. This mirrors how *"Even JOHN passed the test"* is offensive if John is brilliant, even if true.  
     - **Hom’s Problem**: By making slurs *necessarily false* (since "despicable" is uninstantiated), Hom implies bigots are *semantically incompetent* when they assert slurs. But they aren’t: They know Germans exist—they’re expressing hatred. Presuppositionalism captures this by letting the claim be true while exposing the speaker’s bigotry.

  ---

  ### 4. Theoretical Advantages: Parsimony and Scope  
     - **Generalizes to Other Phenomena**: Presupposition explains why slurs pattern with other non-at-issue content (e.g., honorifics, pejoratives like "cur"). Hom’s complex properties lack independent motivation.  
     - **Avoids Truth-Conditional Overload**: Hom requires every utterance containing a slur to refer to an "uninstantiated property," making discourse about slurs (e.g., *"‘Boche’ is offensive"*) nonsensical. Presupposition suffers no such issue.  
     - **Reclamation as Pragmatic Negotiation**: Presupposition’s context-sensitivity explains why reclamation is gradual and contested—it’s a battle over shared assumptions, not lexical meaning (Nunberg 2018).

  ---

  ### Conclusion: Why Non-At-Issue Wins  
  Treating derogation as presupposition **explains projection without truth-conditional chaos**, **accounts for reclamation as contextual modulation**, and **distinguishes factual truth from speaker bias**. Hom’s view, while morally intuitive, overcomplicates semantics, mishandles embeddings, and can’t explain how slurs flexibly lose derogation *without* changing meaning. The presuppositional approach doesn’t "concede" to bigotry—it exposes it as a malignant precondition, not a fact about the world.  

  *Recommended Reading*:  
  - Potts (2007) on expressive content.  
  - Nunberg (2018) *"The Social Life of Slurs"* for reclamation.  
  - Schlenker (2007) on presupposition projection.
