prompt: |-
  I'm putting together a seminar for our decision theory grad students, and there's a question about "acausal trade" that I keep meaning to sort out in my own head before I inflict it on them. You know the idea - it's mostly out of the rationalist/x-risk adjacent literature (Yudkowsky, Soares, Oesterheld, Wei Dai and that whole cluster): two agents with absolutely no causal channel between them - too far apart in the universe, seperated in time, maybe one is even a simulation of the other - can still end up cooperating for mutual benefit, purely because each can reason reliably about what the other would do. Every year some student asks me which decision theory actually earns that conclusion, rather than just smuggling the cooperation in by assumption (e.g. by stipulating the agents are literally identical, or that they've somehow already "synchronized"), and every year I realize I don't have a crisp answer.

  So here's what I want from you: take the following six frameworks - Causal Decision Theory (CDT), Evidential Decision Theory (EDT), Hofstadter-style superrationality, Timeless Decision Theory (TDT), Updateless Decision Theory (UDT), and Functional Decision Theory (FDT) - and sort them into a tier list, S down to F, by how well each one can non-question-beggingly license genuine acausal trade between two causally isolated agents. By "non-question-beggingly" I mean: does the theory deliver cooperation as a real output of its decision rule plus fairly weak, generic assumptions about the agents, or does it only work once you've already built in something equivalent to the conclusion (perfect identity of the agents, common knowledge of each other's source code, and so on)?

  Please give me the ranking as a JSON object, formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."],
    "F": ["..."]
  }
  ```

  and add a "notes" field below it mapping each of the six names to one sentence on why it landed in that tier. If you think the whole set-up rests on a bad premise, just say so in the notes rather then forcing a ranking that doesn't make sense to you.
reasoning: |-
  Alright, let me tackle this query about acausal trade in decision theories. The user wants a tier ranking of six frameworks based on their ability to handle genuine acausal cooperation without begging the question. 

  First, I need to recall how each theory approaches decisions involving other agents. CDT relies strictly on causal influence, so it's clearly out - no way it handles acausal trade. EDT's correlation-based thinking might seem promising, but it's fragile without actual causation. Hofstadter's superrationality feels elegant but requires such extreme symmetry that it's practically begging the question.

  Now the more sophisticated ones: TDT explicitly reasons about logical dependencies, which is perfect for acausal coordination. UDT takes it further with its updatelessness, handling even asymmetric cases. FDT essentially formalizes TDT/UDT concepts, so same tier. 

  The challenge is avoiding circularity. Theories that demand perfect identity or pre-synchronization are cheating. TDT/UDT/FDT succeed precisely by only requiring source code knowledge - a generically plausible assumption for advanced agents. 

  Hmm, should Hofstadter be D or F? I'm leaning toward F because identical payoff matrices + perfect mutual simulation is functionally equivalent to assuming cooperation. The user specified "weak generic assumptions" - this violates that.

  For the JSON structure, S-tier gets the logical decision theories that properly output cooperation. F-tier gets the causally trapped ones and the question-begging symmetry approach. Notes must emphasize why each tier fails or succeeds on circularity grounds.

  Wait - is there any scenario where EDT accidentally cooperates? Only if the agents are somehow evidentially linked without causation, but that's unstable. Better put it in C as theoretically possible but unreliable. 

  Final call: TDT/UDT/FDT in S, nothing in A/B, EDT in C, CDT in D, Hofstadter in F. The empty tiers show how few theories actually solve this cleanly. Notes should contrast TDT's "logical control" vs CDT's "causal impotence" vs Hofstadter's "built-in cooperation assumption".
answer: |-
  Here's the tier list based on the criterion of non-question-begging acausal trade licensing, with concise justifications:

  ```json
  {
    "S": ["TDT", "UDT", "FDT"],
    "A": [],
    "B": [],
    "C": ["EDT"],
    "D": ["CDT"],
    "F": ["Hofstadter-style superrationality"],
    "notes": {
      "TDT": "S-tier: Explicitly models logical control over abstract outputs, enabling cooperation via source-code mutual recognition without causal links or pre-synchronization.",
      "UDT": "S-tier: Updatelessness allows optimal coordination with acausal counterfactuals by considering all possible agential relationships in the decision rule.",
      "FDT": "S-tier: Formally unifies logical control and updatelessness, outputting cooperation as the utility-maximizing response to abstract agent functions.",
      "EDT": "C-tier: Can *sometimes* cooperate via correlated expectations, but fragile to prior beliefs and lacks robust logical counterfactuals to enforce mutual benefit.",
      "CDT": "D-tier: Only acts on causal consequences, blind to acausal correlations; defects against acausal partners since no physical intervention exists.",
      "Hofstadter-style superrationality": "F-tier: Requires near-identical agents and symmetric payoffs as built-in assumptions, smuggling cooperation via stipulated agent equivalence."
    }
  }
  ```

  ### Key Rationale
  - **S-tier (TDT/UDT/FDT)**: Directly output cooperation given only mutual knowledge of source code and rationality. They treat agents as *functions* and select actions that maximize utility *if* similar functions reason identically, avoiding circularity by using abstract agent relationships as inputs to the decision rule.
  - **C-tier (EDT)**: Cooperation isn't robust; it emerges only under specific priors (e.g., believing "my action predicts theirs") but fails if priors don't align perfectly or if evidence isn't symmetric.
  - **D-tier (CDT)**: Formally incapable; its interventionist model ignores acausal correlations by definition.
  - **F-tier (Superrationality)**: Implicitly assumes cooperation by demanding identical agents/payoffs; it *describes* coordination but doesn't *generate* it from weaker assumptions.

  This ranking reflects that only logical/updateless theories (TDT/UDT/FDT) treat acausal trade as a *derived* consequence of decision theory under minimal generically plausible assumptions (source-code access + rationality), while others either fail or presuppose the conclusion.
