prompt: |-
  I'm a software engineer with no formal training in philosophy, but conversations at work about "emergent behavior" in multi-agent and ML systems sent me down a rabbit hole into where that concept actually comes from in philosophy of science. That led me to C. D. Broad's 1925 book "The Mind and Its Place in Nature," where he uses a thought experiment about a "mathematical archangel" — a being with complete knowledge of the microscopic structure of matter — to distinguish mechanistic reduction from genuine emergence. Here's the passage I'm stuck on:

  "Take any ordinary statement, such as we find in chemistry books; e.g., 'Nitrogen and Hydrogen combine when an electric discharge is passed through a mixture of the two. The resulting compound contains three atoms of Hydrogen to one of Nitrogen; it is a gas readily soluble in water, and possessed of a pungent and characteristic smell.' If the mechanistic theory be true the archangel could deduce from his knowledge of the microscopic structure of atoms all these facts but the last. He would know exactly what the microscopic structure of ammonia must be; but he would be totally unable to predict that a substance with this structure must smell as ammonia does when it gets into the human nose. The utmost that he could predict on this subject would be that certain changes would take place in the mucous membrane, the olfactory nerves and so on. But he could not possibly know that these changes would be accompanied by the appearance of a smell in general or of the peculiar smell of ammonia in particular, unless someone told him so or he had smelled it for himself. If the existence of the so-called 'secondary qualities,' or the fact of their appearance, depends on the microscopic movements and arrangements of material particles which do not have these qualities themselves, then the laws of this dependence are certainly of the emergent type."

  What I can't work out is why Broad treats facts like "is a gas," "soluble in water," and "combines in a three-to-one ratio" as things the archangel could deduce in principle, while "smells pungent" gets placed in a totally different, undeducible category — on the face of it, both look like ordinary facts about how a substance behaves under certain conditions. Is the real dividing line here that smell is a subjective, experienced quality rather than a structural one, so that Broad is essentially smuggling in something like today's "hard problem of consciousness" under the heading of emergence? And if that's right, does it mean his notion of emergence is a fundamentally stronger claim than what people mean now when they call something like flocking behavior or patterns in a cellular automaton "emergent," since nothing like subjective experience is at issue there at all?
