  **Justifications:**

  1.  **Nadia (-1):** Nadia correctly applies the strict etiological view (insulation/display = *original* selected effect). However, she oversimplifies by dismissing flight as "just loose talk." Feathers *now* have a derived selected effect for flight in birds, and modern biology *does* recognize this as a legitimate function. Her "full stop" ignores evolutionary repurposing (exaptation), making her position too rigid. Score: -1 (partially correct but flawed/misleading).
  2.  **Owen (2):** Owen powerfully exposes a key weakness in a naive etiological view: "arbitrary privileging" of the *earliest* function. He correctly notes that modern flight feathers are complex adaptations shaped *by later selection for flight*. Denying "function" status to this ignores the reality of cumulative evolution. Score: 2 (clearly right, compelling critique).
  3.  **Nadia (1):** Nadia adapts well. She concedes that functions can evolve ("earned" via later selection), making her etiological view more nuanced and defensible. Her point about needing historical evidence ("layer by layer") is valid for the etiological account. However, she doesn't fully address Owen's "privilege" concern about *why* the initial function is still primary. Score: 1 (mostly right, good refinement).
  4.  **Owen (0):** Owen makes a valid *practical* point: biologists often infer function from current utility *before* confirming evolutionary history. However, he overstates this as "giving away the game" and wrongly equates it with Cummins' view. Cummins *explicitly decouples* function from evolutionary history – function is *defined* by current causal role relative to a chosen capacity. Nadia still insists function *is* historical selection. Owen conflates the *epistemology* (how we figure it out) with the *ontology* (what function *is*). Score: 0 (mixed – valid observation but mistaken conclusion/equivalence).

  **What Both Are Overlooking:**

  1.  **Complementarity, Not Exclusivity:** Both accounts answer different questions.
      *   **Etiological (Nadia):** "Why is this trait *present*? What explains its existence/maintenance?" (Ultimate cause).
      *   **Causal-Role (Cummins/Owen's implied preference):** "What does this trait *do* in the current system? How does it contribute to a specific current capacity?" (Proximate cause).
      *   Feathers *have* an etiological function (insulation/display originally, flight later) *and* causal-role functions (insulation, display, flight, potentially others like protection, waterproofing, sensory input depending on context). Insisting on only one "true" function is often unhelpful.

  2.  **Simultaneity of Functions:** Traits can have *multiple* functions *simultaneously*, both historically selected and current causal roles. Insulation remains a causal-role function (and potentially a maintained selected effect) in birds *alongside* flight. Neither account fully grapples with this multiplicity. Nadia focuses on historical sequence, Owen on one current capacity.

  3.  **The Problem of "The" System/Capacity:** Cummins' account depends heavily on *which system* and *which capacity* the analyst chooses. Is the system the whole bird? The flight apparatus? The thermoregulatory system? Is the capacity flight? Thermoregulation? Display? The function assigned changes based on this arbitrary choice. Neither Nadia nor Owen explicitly addresses this inherent relativism in the causal-role approach.

  4.  **Exaptation Nuance:** While Nadia acknowledges exaptation (flight being co-opted), her framework struggles to fully integrate it. If flight was *not* the original selected effect, but *became* one later, is the *current* etiological function *only* flight, or flight *and* insulation? The etiological account needs careful specification of the relevant evolutionary period. Owen's critique highlights this tension but doesn't resolve it.

  **In essence:** Nadia defends a nuanced etiological view allowing for evolved functions but struggles with arbitrary origin-privilege and multiplicity. Owen effectively critiques rigid origin-focus and champions present utility but wrongly conflates practical inference with Cummins' theory and dismisses historical explanation. Both miss that the theories serve distinct purposes and that traits often have layered, simultaneous functions best understood through complementary lenses.
