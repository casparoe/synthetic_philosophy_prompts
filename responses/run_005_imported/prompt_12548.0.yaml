answer: |-
  You've hit upon one of the deepest and most persistent debates in quantum foundations. While your position is understandable and held by some physicists, the consensus view (supported by Bell himself, most quantum foundations researchers, and philosophers of physics) is that **Bell's theorem *does* rule out a substantive form of locality beyond no-signalling, and your friend has the better argument.** Here's why:

  1.  **Distinguishing "No-Signalling" from "Local Causality":**
      *   **No-Signalling:** This is an *operational constraint*. It states that the *choice* of measurement setting (e.g., angle of polarizer) on one wing of the experiment *cannot influence the observable statistics of outcomes* on the other wing. You cannot *use* entanglement to send a controllable message or information faster than light. QM respects this, and Bell's theorem doesn't challenge it.
      *   **Local Causality (Bell's Locality Condition):** This is a principle about the *causal structure of the underlying reality* (or any candidate theory describing it). It states that events in one spacetime region can only be influenced by events in its *past light cone*. More formally, for spatially separated events A and B:
          `P(A | λ, B) = P(A | λ)` and `P(B | λ, A) = P(B | λ)`
          where `λ` represents the complete physical state of the union of the past light cones of A and B just before the measurements occur. In simpler terms: **Given the complete specification `λ` of the relevant past common causes, the outcome at A should be statistically independent of both the *setting chosen* and the *outcome obtained* at B (and vice-versa).**

  2.  **What Bell's Theorem Shows:**
      *   Bell proved that **any theory satisfying Local Causality (as defined above) must obey specific statistical constraints (Bell inequalities) on the correlations between outcomes at A and B for different measurement settings.**
      *   Quantum Mechanics (QM) predicts correlations that **violate** these Bell inequalities.
      *   Crucially, experiments confirm these QM predictions and the violation of Bell inequalities.
      *   Therefore: **No theory satisfying Local Causality can reproduce the predictions of QM (and the observed experimental results).**

  3.  **Why Violating Local Causality is Substantive, Even with No-Signalling:**
      *   **The Nature of the Correlation:** No-signalling prevents *controllable* influence. However, Bell's theorem shows that the *correlation itself* – the way the outcomes *depend* on the *distant setting* – cannot be explained by any common cause (`λ`) in the shared past *alone*. The dependence on the distant setting is *essential* to get the right statistics. While you can't *choose* the outcome at B to send a message to A, the specific outcome *you happen to get* at B *is* instantaneously correlated with the specific outcome *you happen to get* at A *in a way that depends on both settings*. This dependence on the distant setting is the nonlocal link Bell exposes.
      *   **Einstein's Real Concern:** Einstein wasn't primarily worried about *signalling* (he knew QM didn't allow that). His "spooky action at a distance" objection was precisely about this *dependence* – the idea that the state of one particle seems to depend *instantaneously* on what happens to the other, distant particle. Bell's theorem proves that this "spooky" dependence is a *necessary* feature of *any* theory matching the QM predictions, not just an artifact of the Copenhagen interpretation. **Bell formalized Einstein's intuition about "spooky action" into the mathematically testable Local Causality condition and proved it is violated.**
      *   **The "λ" Matters:** Your argument implicitly assumes that "no-signalling" is the *only* locality condition needed. Bell's local causality condition includes `λ` – the complete specification of the relevant past. This is crucial. It shows that *even if you knew absolutely everything* physically relevant in the overlapping past light cones of A and B (`λ`), the outcomes at A and B *still* exhibit a statistical dependence that should not exist if influences were confined to light cones. No-signalling doesn't require this level of completeness in `λ`; local causality does.
      *   **It Rules Out a Class of Theories:** Bell's theorem definitively rules out *local realistic theories* (theories satisfying both Local Causality and some form of realism, like predetermined outcomes encoded in `λ`). While interpretations of QM like Bohmian mechanics maintain realism by embracing explicit nonlocality (violating Bell's local causality), interpretations like Many-Worlds avoid the nonlocal *influence* by denying a single outcome exists until observed. Crucially, **no interpretation of QM satisfying Bell's Local Causality is possible.**

  4.  **Addressing Your "Semantics" Point:**
      *   Bell's local causality is **not** just semantics dressed as physics. It is a precise, well-defined mathematical condition motivated by a fundamental principle of relativistic spacetime: causes should precede effects within light cones. Its violation demonstrates that **the correlations observed in entangled systems cannot be explained by any causal story confined to the relativistic spacetime structure.** The dependence between spacelike separated events is irreducible. This is a profound physical statement about how the universe generates correlations, not a linguistic trick.

  **Conclusion:**

  You are correct that **no-signalling holds**, and this prevents faster-than-light communication. However, Bell's theorem demonstrates the violation of a **deeper locality principle – Local Causality.** This violation means that **the physical processes generating the correlated outcomes inherently depend on *both* measurement settings *spacelike separated* from each other.** While this dependence cannot be controlled for signalling, its existence reveals a fundamental nonlocal feature of reality that conflicts with Einstein's vision of a locally causal universe where all influences propagate within light cones. **Your friend is right: you *are* missing something important – the distinction between operational constraints preventing signalling (no-signalling) and a fundamental principle about causal structure (local causality) that is demonstrably violated by nature.** Bell's theorem forces us to abandon either locality (in the causal sense he defined) or realism (the idea that measurement outcomes reveal pre-existing properties), or both.
