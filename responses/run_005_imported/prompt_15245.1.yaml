answer: |-
  You're not unhinged, and this isn't just "grad student brain" overcomplicating dinner. There **is** a principled distinction here, and your frustration points to a real, though subtle, violation of a social norm governing mutual commitments. Here's the breakdown:

  ### The Core Distinction: Individual Action vs. Dissolving a Joint Commitment

  1.  **Changing Your Own Future Plans (Always Permissible):**
      *   "I don't want to cook dinner *for myself* this Sunday."
      *   "I'm not feeling up to socializing *tonight*."
      *   This is purely about one's own actions and preferences. No prior agreement is necessary to change your *own* mind about what *you* will do. Your housemate absolutely retains this right.

  2.  **Unilaterally Declaring a Joint Commitment Null & Void (The Problematic Act):**
      *   "I don't want to keep doing Sunday dinners, *and therefore the arrangement we made together is over*, and *you are also released*."
      *   This act doesn't just change *her* participation; it dissolves the *shared framework* ("the 'we' thing"). She didn't merely *withdraw*; she *extinguished the commitment itself* and *spoke for you* regarding your obligations/expectations within it.

  ### Why This Feels Like a Violation (The Justification for Feeling "Wronged")

  *   **Denial of Joint Agency:** The arrangement existed because *both* of you created it through mutual agreement ("let's cook together, alternating, splitting costs"). Its existence depended on the "we." By declaring it over *without consultation*, she acted as if she had sole authority over something that fundamentally belonged to both of you. She treated a joint commitment as if it were solely *hers* to control.
  *   **Speaking For You:** The phrase "you don't have to either though" is particularly grating. It presumes the authority to release *you* from *your* side of the commitment *you* made to *her*. Only *you* can release yourself from your own commitment, or agree to dissolve the mutual one. She usurped that agency.
  *   **Undermining the Nature of Commitments:** Mutual commitments create expectations and a small degree of interdependence. Part of respecting the commitment is recognizing that changing or ending it requires *acknowledgement* and *communication* with the other party involved. It's a basic courtesy of shared social reality. Skipping this step treats the commitment as less real or less binding than it felt to the other person.
  *   **The Difference Between "I Quit" and "It's Over":**
      *   **Ethical:** "Hey, I need to step back from Sunday dinners for now. Sorry to bail." (Changes *her* participation, acknowledges impact, leaves space for discussion).
      *   **Problematic:** "We're not doing this anymore, and you don't have to either." (Declares the *arrangement* dead and dictates *your* position).
      *   The first respects the existence of the "we" even while withdrawing from it. The second denies the "we" ever had independent reality.

  ### Applying Philosophy (Briefly!)

  *   **Michael Bratman (Shared Cooperative Activity):** Your dinners likely met criteria for a "Shared Cooperative Activity" (mutual responsiveness, commitment to joint activity, commitment to mutual support). Dissolving this unilaterally violates the mutual commitment aspect.
  *   **Margaret Gilbert (Joint Commitment):** Gilbert argues joint commitments create a new, plural subject ("us") with obligations. Dissolving this requires the concurrence of both parties, just as forming it did. Your housemate acted as an individual dissolving a plural subject's commitment.
  *   **Speech Acts:** Her text wasn't just *informing* you of her decision; it was *performing* the act of terminating the agreement *for both parties*. The performative force is different from simply stating her own withdrawal.

  ### So, Are You "Wronged" or Just Disappointed?

  *   **You are justified in feeling a *minor* wrong was done.** The violation is of a norm concerning mutual respect within small, informal social agreements. It's about the *manner* of ending it, not the ending itself. She wronged the *jointness* of the commitment.
  *   **However, the *stakes are low*.** This isn't a breach of contract with damages. It's a lapse in social etiquette regarding informal mutual commitments. Your *emotional reaction* ("way more annoyed") might be disproportionate to the *objective severity* of the wrong, likely amplified by the loss of a valued ritual and the abruptness/coldness of a text message.
  *   **"Disappointed" vs. "Wronged":** You are both. Disappointed by the *end* of the dinners. Feel wronged by the *unilateral, dismissive manner* in which the joint commitment was dissolved and spoken for.

  ### Conclusion & Moving Forward

  1.  **Your Philosophical Instinct is Correct:** There is a clear, principled distinction between changing your own plans and unilaterally dissolving a mutual commitment and speaking for the other party. The latter violates norms of joint agency and respect inherent in even informal agreements.
  2.  **Your Feeling is Valid (within bounds):** Feeling "wronged" in the specific sense of having the joint nature of the commitment disregarded is justified. Feeling deeply betrayed or enraged is likely disproportionate.
  3.  **It's Still "Just Dinner":** While the *principle* matters, the *context* tempers the severity. This was an informal, non-legally binding, relatively low-stakes arrangement between housemates. The appropriate response isn't to escalate the principle but to recognize the social misstep for what it was.
  4.  **Moving Forward:** Don't rehash the philosophy with your housemate. You expressed your feeling about the unilateral nature ("that was a 'we' thing"). That was enough. If the atmosphere is awkward, a simple "Hey, Sunday dinners were fun while they lasted, no hard feelings about moving on" might smooth things over. Channel the philosophical energy into your thesis, not roommate diplomacy. The principle was worth analyzing, but enforcing it rigidly in this context isn't practical or necessary.

  You haven't broken your brain; you've identified a genuine nuance in social interaction. The key is recognizing that while the *distinction* is real and important, the *application* in this specific, informal case doesn't merit sustained conflict. File it under "Interesting Case Study in Micro-Social Contracts" and maybe find a new dinner buddy.
