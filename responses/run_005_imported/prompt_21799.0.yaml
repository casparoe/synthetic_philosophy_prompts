answer: |-
  Your intellectual puzzle beautifully captures a fundamental tension between abstract decision theory and real-world economic institutions. The apparent contradiction arises because Hirshleifer's scenario violates a critical background assumption in Good's theorem. Let's dissect this systematically:

  ### Core Assumption in Good's Theorem That Fails in Hirshleifer's Scenario
  **The Invariance of the Action Set (Ω)**

  Good's theorem relies on the assumption that **the set of available actions remains unchanged** by the acquisition of information. Formally:
  - Let Ω be the set of all possible actions *before* acquiring information.
  - After acquiring information *I*, the agent still chooses from the *same* Ω.
  - The information only updates beliefs (via Bayes' theorem), not the feasible actions.

  **Hirshleifer's Attack on Invariance:**
  In Hirshleifer's scenario (e.g., early revelation of an impending earthquake), information acquisition *destroys actions* that were previously available:
  1. **Pre-Information Actions (Ω):**  
     Agents can buy/sell actuarially fair insurance against *unknown* seismic risk.  
     *Example:* Alice can pay $10 premium for $1000 coverage if quake probability is 1%.

  2. **Post-Information Actions (Ω'):**  
     If "quake imminent" is revealed:  
     - Insurance sellers *exit the market* (no profit possible).  
     - Action "buy insurance" *vanishes* from Ω.  
     If "no quake" is revealed:  
     - Insurance becomes irrelevant (no buyers).  
     → Ω' is a *strict subset* of Ω, missing key risk-mitigation actions.

  ### Why This Violation Matters
  | **Good's World**                     | **Hirshleifer's World**               |
  |--------------------------------------|---------------------------------------|
  | Information only affects *beliefs* (P(world⎮I)) | Information affects *institutions* (insurance markets collapse) |
  | Actions remain possible (Ω = Ω')     | Actions become *impossible* (Ω' ⊂ Ω) |
  | Expected utility weakly increases: E[U⎮I] ≥ E[U] | Expected utility may decrease: E[U⎮I] < E[U] |

  ### Formal Reconciliation
  Good's expected utility gain from information *I* is:  
  ΔE[U] = E[ max<sub>a∈Ω</sub> U(a) ⎮ I ] - max<sub>a∈Ω</sub> E[U(a)]  
  **Crucially, the max is taken over the same Ω in both terms.**

  In Hirshleifer's case, after learning *I*, the max must be taken over diminished Ω':  
  ΔE[U] = E[ max<sub>a∈Ω'</sub> U(a) ⎮ I ] - max<sub>a∈Ω</sub> E[U(a)]  
  Now Ω' lacks Pareto-improving actions (insurance), so the first term can be smaller.

  ### A Concrete Example
  Suppose a community faces 10% chance of a $1M disaster.  
  - **Pre-information:** Fair insurance costs $100k.  
    - Utility without insurance: 0.9×U($1M) + 0.1×U($0)  
    - Utility with insurance: U($1M - $100k) = U($900k)  
    (Assuming U concave, insurance improves ex-ante EU)  

  - **Post-disclosure (disaster imminent):**  
    - Insurance market vanishes.  
    - Only action left: "bear full loss" → Utility = U($0)  
    → EU *decreases* by U($900k) - [0.9×U($1M) + 0.1×U($0)]  

  ### Philosophical Implication
  Hirshleifer exposes that **information isn't "costless" when it alters institutional constraints**. Good's theorem holds in "closed" decision problems (fixed Ω), but fails in open social systems where information changes game-theoretic rules. The tension resolves once you recognize:
  > **Information has material consequences, not just epistemic ones.**

  This distinction is why economists stress *sequential rationality* and *market completeness*. Your intuition about a paradox is astute—it reveals where pure Bayesianism meets institutional economics. Both theorems are correct within their domains of assumption.
