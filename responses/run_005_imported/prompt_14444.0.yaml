  So, Ramsey might accept the expected-value calculus mathematically but reject its application here. He'd argue that the value of potential future lives is negligible if discounted for time and uncertainty. More importantly, his ethical stance values present consciousness and relationships over abstract future quantities. Sacrificing current meaningful experiences for uncertain future gains would contradict his "map of importance."

