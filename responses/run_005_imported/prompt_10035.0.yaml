  Ellie's (4) is where things get meta. Her "no further fact" stance is coherent within radical interpretation theories, but feels unsatisfying. She's technically consistent but maybe too quick to flatten human and machine cognition. Also, demanding Dan define the "extra ingredient" sets up his next move...

