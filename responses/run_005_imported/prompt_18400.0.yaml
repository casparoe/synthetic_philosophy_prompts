  Let me think of a counterexample. What if someone knows the objective chance but can't express it empirically? Like a coin with a known bias but flipped only once. Or conversely, someone who's calibrated by sheer luck without knowing true chances—like a weather forecaster who's right 70% of the time but has no clue about atmospheric physics. 

  Ah—the quantum mechanics example feels solid. If an agent knows a particle's decay chance is 50% but their calibrated model says 30%, they're violating the Principal Principle despite calibration. That highlights the gap: calibration is about past performance, while the Principal Principle is about aligning with known truths. 

  The user also hinted at "actual tension," so I should emphasize why this matters. In ML, we optimize for calibration because it’s testable, but philosophers care about rationality under uncertainty. The reverse case—obeying the Principal Principle but being uncalibrated—would involve rare events where true chances exist but frequencies haven’t converged yet. 

  ...Wait, is there a risk of overcomplicating? The user deals with models daily, so they’ll appreciate the quantum edge case. I’ll structure it as: (1) calibration without credence alignment, (2) credence alignment without calibration. Then hammer home why the gap exists—frequency vs. ontology. 

  They’ll likely push back on "objective chance" being metaphysical, so I’ll preempt that: Lewis treats chances as real but unobservable, while ML cares about measurable outcomes. That’s the core friction. 

