answer: |-
  ## The Geometer's Quarrel

  **Setting:** Thomas Hobbes' study, Oxford, 1669. Books and manuscripts overflow shelves and tables. A large, flawed diagram of a circle "squared" dominates one wall. John Wallis leans against a bookcase, holding a slim pamphlet – his latest rebuttal. Hobbes paces, his face flushed, a crumpled copy of the same pamphlet in his fist.

  **Hobbes:** *(Slamming the pamphlet down)* "Symbols! Nothing but symbols, Wallis! You weave these... these *cabalistic marks* into patterns that yield a number, and you call it knowledge? *Scientia*? It is calculation, not comprehension! You know *that* it seems to work, but you know not *why*!"

  **Wallis:** *(Calmly, tapping the pamphlet)* "And yet, Thomas, my 'cabalistic marks' predict the motions of the heavens, describe the trajectory of cannon shot, and yes," *(he gestures pointedly at Hobbes' diagram)* "...consistently demonstrate the impossibility of your quadrature. Your 'comprehension' yields flawed constructions. My 'calculation' yields truth. Which, pray tell, serves *Scientia* better?"

  **Hobbes:** "Truth?!" *(He stops pacing, eyes blazing)* "Your truth is hollow! It is a puppet show! You push symbols according to rules you stipulate, divorced from the *real causes* inherent in the figures themselves! Geometry is certain *because* we know the cause – we generate the figure by construction! A circle *is* the path traced by a fixed point moved around a center. That is its essence, its knowable cause! Your algebra... it is mere manipulation of shadows on the cave wall!"

  **Wallis:** *(Pushing off the bookcase, his calm turning sharp)* "Ah, yes. The vaunted 'maker's knowledge'. You generate the figure, therefore you *must* know its properties perfectly. And by extension," *(his voice lowers, becomes pointed)* "...since men *make* the Commonwealth through covenant, civil philosophy can attain the same certainty as geometry. A neat analogy, Thomas. Very neat. And utterly *shattered* by this very room."

  **Hobbes:** "Shattered? How dare--"

  **Wallis:** "How? Look around you! For *decades* you have 'made' circles. You have 'made' squares. You have 'made' constructions you believed squared the circle, armed with your precious maker's knowledge. And for decades, *I* – using the very symbols you deride as 'shadows' – have shown, demonstrably, rigorously, *why* your constructions fail. Your 'maker' is fallible, Thomas. Deeply fallible."

  **Hobbes:** *(Clenching his fists)* "A man may err in his construction! The method itself remains sound! The certainty lies in the *potential* for perfect generation, in the clarity of the causal chain we define!"

  **Wallis:** "But does it? My method – the 'shadows' – requires no such perfect generation. It operates on the *properties* themselves, abstracted. It finds relationships your painstaking constructions miss. It *discovers* truths about the circle you, as its putative 'maker', failed to grasp! If your 'maker's knowledge' is the unique path to certainty in geometry, why does it fail you so consistently, while my 'meaningless symbol-pushing' *succeeds*? Doesn't that suggest your 'knowledge' is incomplete, perhaps even illusory?"

  **Hobbes:** *(Silent for a moment, the flush deepening. He walks to his flawed diagram, stares at it. When he speaks, it's quieter, more intense)* "You mistake the nature of the failure, John. My error lies in the *execution*, not the *principle*. The principle remains: true knowledge requires understanding the *generation*, the efficient cause. Your symbols... they describe a relationship, yes. But do they *explain* it? Do they tell you *why* the ratio of circumference to diameter is constant? Or do they merely *state* that it is, and allow you to compute it?"

  **Wallis:** "They allow me to *prove* it is constant, Thomas! Rigorously! Without recourse to dubious physical generation! The symbols *are* the explanation when manipulated correctly. The 'why' *is* the logical relationship revealed by the algebra."

  **Hobbes:** "No! The 'why' is in the *motion*! The 'why' is that a circle *is* generated by that uniform revolution! Your symbols capture a *consequence* of that generation, but they are divorced from the *cause*. They are descriptive, not constitutive! They lack the ontological grounding of a constructed figure. Your 'proof' is a chain of logic about phantoms, not about the real, generable object!"

  **Wallis:** "And yet, my 'phantoms' constrain the real object perfectly. They tell me what *cannot* be generated – like your squared circle. If your maker's knowledge were truly sufficient and certain, it would have revealed that impossibility to you directly. It did not. My methods did. What does that say about the *scope* and *reliability* of your vaunted certainty?"

  **Hobbes:** *(Turns from the diagram, facing Wallis squarely, a stubborn light in his eyes)* "It says that the human hand and eye are imperfect! It says that the path to certainty through construction is arduous and requires the utmost rigor to avoid error! It does *not* say that the *nature* of the knowledge gained, when correctly attained, is inferior to your symbol-juggling! In civil philosophy, the 'construction' is the covenant, the act of authorization that creates the Sovereign. We *know* its cause – fear of violent death, the desire for peace. We know the generation of the artificial man. Does its imperfection in execution – rebellion, tyranny – invalidate the *certainty* of the principle? Does your failure to perfectly calculate the trajectory of every atom in the air invalidate the principles of motion?"

  **Wallis:** "A fair point, Thomas. But in civil philosophy, your 'construction' is made of fallible men, prone to passion and error. Its outcomes are messy, uncertain. Just like your geometric constructions. My algebra... it deals in pure relations. Its truths are absolute, independent of faulty execution. *That's* the certainty you crave for your Commonwealth, isn't it? But you cannot achieve it by your method, neither in geometry nor in politics. You cling to generation, but generation fails. I deal in necessary relations, and they hold. Perhaps your analogy is backwards. Perhaps the certainty of civil philosophy, if it exists, is more like algebra – a system of abstract obligations and powers – than like your perfect, but unrealizable, geometric construction."

  **Hobbes:** *(A long pause. He picks up Wallis's pamphlet again, looks at the dense equations, then back at his own diagram. His voice is low, firm, but weary)* "No, John. The Commonwealth is no abstract relation. It is a real thing made, an artificial man *breathed into life* by covenant. Its cause is human will and fear, as tangible as the compass point tracing a circle. Your symbols may describe its proportions, perhaps, but they cannot capture its *life*, its *cause*. Just as they cannot capture the *why* of the circle, only the *what*. I may fail in the execution... but the principle stands. Knowledge of causes *is* true knowledge. Without it..." *(He gestures dismissively at the pamphlet)* "...you have only a well-ordered dream. A beautiful, precise, and utterly bloodless dream. Now, if you'll excuse me, I have a construction to reconsider." *(He turns his back, deliberately picking up a compass and ruler, focusing intently on a blank sheet of paper).*

  **Wallis:** *(Watches him for a moment, a mixture of frustration and grudging respect on his face. He sighs quietly, pockets his pamphlet, and turns to leave. At the door, he pauses)* "Dreams that predict the world, Thomas, have a power of their own. Even over those who insist they are awake. Good day." *(He exits, leaving Hobbes alone with his instruments and his defiance).*

  **Hobbes:** *(Murmurs to the empty room, not looking up from his nascent lines)* "Power without understanding... is the tool of tyrants and sophists. The circle *will* be squared. The cause *will* be known." *(His hand trembles slightly as he draws the first arc).*
