answer: |-
  You've pinpointed a classic and much-debated passage in Hume! While it *looks* contradictory on the surface, Hume is making a sophisticated distinction between the **long-run neutrality of money** and the **short-run stimulative effects of a *gradually increasing* money supply**. Here's how it works:

  1.  **The Long-Run Neutrality of Money (The "Oil" Argument):**
      *   Hume argues that in the long run, once prices have fully adjusted, the *absolute quantity* of money in a closed economy is irrelevant to its real wealth or happiness.
      *   Doubling the money supply would eventually just double all prices and wages ("prices of commodities are always proportioned to the plenty of money"). A crown in Henry VII's time bought roughly what a pound does now because prices adjusted to the available money.
      *   Real wealth comes from goods, services, labor, and resources – the "wheels of trade." Money is just the "oil" facilitating their exchange. More oil doesn't mean more wheels or better wheels; it just means the existing wheels turn a bit more smoothly (with less friction in transactions). But fundamentally, the *real capacity* of the economy (its ability to produce goods and services) hasn't changed.

  2.  **The Short-Run Stimulus of a *Gradual Increase* (The "Good Policy" Argument):**
      *   Hume's key insight is that the *process* of increasing the money supply *does* have real effects *before* prices fully adjust. This is the crucial distinction.
      *   **Mechanism:** When new money enters the economy (e.g., through trade surplus, mining, or – though Hume wrote before central banking as we know it – an increase in bank credit), it doesn't instantly raise all prices equally and simultaneously.
      *   **Sequence Matters:**
          *   The new money enters specific hands first (miners, exporters, banks, those who borrow first).
          *   These recipients find themselves with more money than before. *Perceiving themselves wealthier*, they increase their spending on goods, services, and labor.
          *   This increased demand hits the economy *before* prices have had time to fully rise. Producers and merchants see demand increasing.
          *   To meet this higher demand, they hire more workers, increase hours, or invest in more production. This "keeps alive a spirit of industry."
          *   **Result:** During this transition period, *real* output (the "stock of labour") increases. More goods and services are actually being produced.
      *   **The "Spirit of Industry":** Hume emphasizes the *psychological* effect. Seeing demand rise and feeling temporarily richer (due to nominal money holdings increasing faster than prices) incentivizes people to work harder and produce more. It creates economic momentum.

  3.  **Why "Still Increasing" is Key:**
      *   Hume argues that this stimulative effect *only* occurs during the *phase of increase*. Once the new money is fully circulated and prices have risen proportionally, the economy settles back into its long-run equilibrium. The real gains achieved during the increase phase (more workers employed, more goods produced) become the *new normal* level of real output, supported by the now higher price level.
      *   **Standing Still vs. Increasing:** A nation with a stagnant money supply misses out on this stimulative transition. Its economy operates at its existing capacity without the temporary boost in demand and production incentives. Its *real* output is potentially lower than it could be if it were experiencing the positive effects of an increase.
      *   **Decreasing is Worse:** If the money supply is shrinking (deflation), the reverse happens. People *feel* poorer (nominal holdings decrease), demand falls *before* prices fully adjust, producers cut back, unemployment rises, and real output falls. This makes the nation "weaker and more miserable."

  **Defusing the Tension: The Core Distinction**

  *   **Static Quantity vs. Dynamic Process:** Hume is *not* saying the quantity of money *itself* creates real wealth in the long run. He *is* saying that the *process of gradually increasing* the quantity has beneficial *transitional effects* that boost real output and industry *before* neutrality sets in.
  *   **Level vs. Rate of Change:** What matters isn't the *level* of money (which is neutral), but its *rate of change* (increasing vs. stagnant vs. decreasing). A positive rate of change acts as a temporary stimulus.
  *   **Real Output vs. Nominal Prices:** The increase in money doesn't *ultimately* change real output potential *caused by the money itself*, but it can temporarily *activate* idle resources (like unemployed labor) by boosting demand before prices catch up. The increased real output achieved *during* the transition becomes the new baseline.

  **Why This Matters for Policy ("Good Policy of the Magistrate"):**

  Hume believed a wise ruler should aim for a *slow, steady increase* in the money supply. This:
  1.  Provides a continuous, mild stimulus to demand and industry.
  2.  Keeps the "spirit of industry" alive by creating positive expectations.
  3.  Avoids the damaging effects of deflation (shrinking money supply).
  4.  Harnesses the beneficial short-run effects without triggering runaway inflation (as long as the increase is moderate and gradual).

  **In Summary:**

  Hume is **not** contradicting himself. He's making a nuanced argument:

  1.  **Long Run:** Money is neutral. Its absolute quantity doesn't determine real wealth or happiness ("Of no consequence").
  2.  **Short Run (Transition):** A *gradually increasing* money supply stimulates real economic activity, employment, and output *before* prices fully adjust ("Good policy... keeping it still increasing").
  3.  **Policy Goal:** Exploit the short-run stimulus of gradual increases to maximize real output and industry, while avoiding the stagnation of a flat money supply or the misery of a shrinking one.

  Your instinct about the *direction* of change being crucial was spot on. The tension dissolves when you recognize Hume's sophisticated understanding of the difference between the long-run equilibrium state (where money is neutral) and the dynamic process of getting there (where money growth has real effects). He valued the *process* of increase for its stimulative power, not the resulting higher money stock itself.
