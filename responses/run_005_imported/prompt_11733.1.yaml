  **Constance's Internal Monologue (For Your Novel):**

  *The wine’s gone properly tepid now. Priya Patel. Always precise. Good on the history – spot on about ’62 and the racial coding, better than half the postgrads. Shame about the anti-realism wobble; trying too hard to sound like she’s done the metaphysics paper, bless her. Classic undergrad move, linking the famous thing to the current thing whether it fits or not. And the Carens point… *sighs, takes a small, warm sip*. They always want it to be cleaner, don’t they? Dummett’s messy. He guts the justifications but won’t quite burn the house down like Carens would. Priya sees the wreckage and assumes the demolition’s complete. Not quite. Still… solid. Clear. Knows the text. Deserves the 65. Right, next one. God, is that the time?*
