prompt: |-
  Okay so this has been bugging me for like a week now. I'm a backend engineer, no philosophy background at all, but I got into game theory recently after a coworker pointed out its basically the theoretical backbone behind some of the auction and multi-agent RL stuff we deal with at work, so I've been slowly working through a textbook in the evenings. The pure-strategy version of iterated elimination of dominated strategies makes total sense to me: if one option is never better and sometimes worse than another, no rational person keeps it around. But then I ran into the wrinkle where you're also supposed to check domination against mixed strategies, and I made up my own numbers to test it rather than just copy the book's example: row player has options T, M, B, column player has L, R, and the row player's payoffs are T=(4,0), M=(1,1), B=(0,4) for (L,R) respectively. Neither T nor B dominates M on its own — T wins against L but loses against R, B is the mirror image — but if the row player randomizes 50/50 between T and B, the expected payoff is 2 no matter what the column player does, which beats M's guaranteed 1 either way. So apparently M is "irrational" to play and gets eliminated too, even though nothing that beats it exists in pure form.

  I can follow the arithmetic fine, that's not where I'm stuck. What I don't have is an actual gut feeling for why that's the right move conceptually — like, why does hedging between two options that each individually lose to M half the time suddenly make M the dominated one? It smells like allowing comparisons against mixtures is quietly importing a bigger assumption about the player's rationality than the pure-strategy version needed, something about treating your own randomization device as governed by expected utility rather than just having ordinary preferences over sure outcomes. A friend also mentioned this is somehow tangled up with "common knowledge of rationality" and a concept called rationalizability, and that the two supposedly don't line up as neatly once you've got three or more players instead of two, but I couldn't follow why that would even matter — isn't a strategy either dominated or it isn't, regardless of how many other people are at the table? Could you unpack this whole thing for me in a way that actually builds intuition (geometric picture, story, whatever works) instead of just re-deriving the inequalities again? I don't need the fully rigorous treatment, I just want to get why the procedure is doing what its doing.
