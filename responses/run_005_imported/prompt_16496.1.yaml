answer: |-
  I love this question—you've hit on one of the most subtle conceptual jumps in game theory. As a backend engineer, think of this like discovering that your distributed system's consistency model has hidden assumptions you never articulated. Let's break it down intuitively, step by step.

  ### Core Intuition: Rationality = Maximizing Expected Payoff, Not Avoiding Regret
  Your confusion stems from a perfectly natural interpretation: "If no pure strategy *always* beats M, why is M irrational?" But game theory defines rationality more strictly: **a rational player doesn't just avoid "always worse" options; they maximize their *expected payoff* across all possible randomized plans.** Allowing comparison to mixed strategies isn't an added assumption—it's *required* by the definition of expected utility maximization.

  **Hedging as a Superpower:**  
  Imagine you're optimizing a portfolio:
  - T = Tech stock (pays 4 if AI boom, 0 if bust)  
  - B = Biotech stock (pays 0 if AI boom, 4 if bust)  
  - M = Government bonds (pays 1 always)  

  If you *must* go all-in on one asset, M looks safe. But if you can diversify (50% T, 50% B), your expected return is 2 regardless of market conditions—strictly better than M's 1. Refusing to diversify when it guarantees a higher payoff *is* irrational under expected utility theory. M isn't "beaten" by T or B alone; it's beaten by the *existence of a superior randomized plan*.

  ### Geometric Insight (Where the Magic Happens)
  Visualize the row player's payoffs as vectors in 2D space (L vs. R payoffs):  
  - T: (4, 0)  
  - M: (1, 1)  
  - B: (0, 4)  

  Plot these points:  
  - T is far right on the x-axis  
  - B is far top on the y-axis  
  - M is near the origin at (1,1)  

  The **convex hull** of T and B is the line connecting (4,0) to (0,4). Every point on this line represents a mixed strategy between T and B. Crucially:  
  - **M (1,1) lies *strictly below* this line** → it's dominated.  
  - Any mixed strategy with >50% T/B would give >2 in one scenario but <2 in the other. But the 50/50 mix (2,2) *strictly dominates* M (1,1) because 2 > 1 in both dimensions.  

  This is why mixed strategies matter: they let players access payoff vectors unreachable by pure actions. Rational players exploit this convexity.

  ### Why "Common Knowledge of Rationality" (CKR) Changes Everything
  You asked: "Isn't domination independent of player count?" **No—and this is critical.** Domination is absolute, but *iterated elimination* relies on CKR. Here's why player count matters:

  1. **In 2-player games:**  
     - When you eliminate M, it's because you know *your opponent* won't play dominated strategies.  
     - In your example: if Row eliminates M, Column faces a game where Row only plays T or B. Now L might be dominated for Column (if Row's mix makes L worse than R).  
     - But the elimination order is unambiguous with two players.

  2. **In 3+-player games:**  
     - **Domination becomes context-dependent.** Strategy S might be dominated *only if* Players 2 *and* 3 avoid *their* dominated strategies.  
     - Example: Player 1's payoff depends on Player 2 *and* Player 3. If Player 3 hasn't eliminated a strategy yet, Player 2's best response might change, affecting what's dominated for Player 1.  
     - **CKR ensures everyone iteratively eliminates in sync.** Without it, Player 1 might assume Player 2 eliminated a strategy that Player 2 thinks Player 3 might still play... causing chaos.

  ### Rationalizability: The "Why" Behind the Procedure
  Rationalizability asks: *"Is there any belief I could have about opponents' actions that would justify this strategy as my best response?"*  
  - In your game:  
    - Can Row ever believe Column will play in a way that makes M optimal?  
    - Suppose Row believes Column plays L with probability *p*.  
    - M's expected payoff: *p*×1 + (1-*p*)×1 = **1**  
    - 50/50 T/B mix: *p*×2 + (1-*p*)×2 = **2**  
    - **2 > 1 for all *p*** → *No belief justifies playing M.*  

  Mixed strategies expose that M isn't just risky—it's *never* a best response. Iterated elimination prunes all such "irrationalizable" strategies.

  ### Engineering Analogy
  Think of pure strategies as individual servers in a cluster:  
  - T handles L-requests well but chokes on R-requests.  
  - B handles R-requests well but chokes on L-requests.  
  - M handles all requests poorly but consistently.  

  A rational system administrator wouldn't *only* use M—they'd load balance between T and B. Even if T/B each fail half the time under stress, the *expected* throughput (2) beats M's guaranteed low throughput (1). Allowing randomization isn't an extra assumption; it's fundamental to optimal resource allocation.

  ### Key Takeaway
  Mixed-strategy domination reveals deeper irrationality:  
  > A strategy isn't just dominated if another *action* beats it—it's dominated if another *plan* (pure or mixed) yields a strictly higher payoff *no matter what opponents do*.  

  This tightens the solution concept, pruning more strategies. And yes, it assumes players not only maximize expected utility but also *consider randomization as a tool*—which is baked into the standard definition of rationality in non-cooperative game theory. When extended to iterated elimination with CKR, it ensures players progressively eliminate *all* strategies that could never be part of a rational playbook.  

  The jump from pure to mixed feels counterintuitive precisely because in real life, we often fixate on discrete choices ("should I do X or Y?"). Game theory forces us to consider the full space of probabilistic play—and that's where the real optimization happens.
