answer: |-
  To resolve your debate, I'll construct a scenario that cleanly separates epistemic contextualism (EC) and pragmatic encroachment (PE). The key is to **decouple the subject's practical stakes from the conversational context's salience of error possibilities**. Standard bank cases fail to do this because the subject's stakes *and* the conversational context are aligned (e.g., the high-stakes subject is *in* a high-stakes conversation). In our scenario, the subject has **low practical stakes** but the conversational context **makes high-stakes error possibilities salient**, exploiting the structural difference in what each theory treats as relevant:

  - **EC** (DeRose): The truth of "S knows P" depends on the *conversational context* (e.g., which error possibilities are salient to the attributor/audience).  
  - **PE** (Hawthorne/Stanley): The truth of "S knows P" depends on *S's practical stakes* (i.e., the cost to S of being wrong).  

  ### Scenario: The Trivial Bet with High-Stakes Eavesdroppers  
  **Characters**:  
  - **Alex**: A trivia enthusiast with low stakes.  
  - **Bailey**: Alex’s friend, equally low stakes.  
  - **Dr. Chen**: A surgeon in the next booth, eavesdropping.  

  **Evidential Situation**:  
  Alex wants to win a $1 bet with Bailey about whether the downtown bank is open on Saturday. Alex checked the bank’s official website this morning, which stated: "Open Saturdays 9 AM–1 PM." The website is generally reliable but has rare errors (e.g., it fails to update for unscheduled closures). Alex has no reason to suspect an error today.  

  **Conversation**:  
  Alex and Bailey are casually debating the bet at a café. Unbeknownst to them, Dr. Chen is listening intently. Dr. Chen is treating a patient who will die unless a time-sensitive medication is picked up from that bank’s safety deposit box by Saturday noon. If the bank is closed, the patient dies.  

  Alex declares:  
  > "I **know** the bank is open tomorrow! I saw it on their website this morning. The bet is mine!"  

  **Question**:  
  Is Alex’s utterance "I know the bank is open tomorrow" **true**?  

  ---

  ### Verdicts from Each Theory  
  1. **Pragmatic Encroachment (PE)**:  
     - **Verdict**: *True*.  
     - **Reasoning**: PE ties knowledge to the **subject’s practical stakes** (Alex’s). For Alex, the cost of being wrong is losing a $1 bet—minimal stakes. Given Alex’s evidence (the reliable website), PE holds that Alex meets the *epistemic standard* for low-stakes contexts. The eavesdropper’s stakes are irrelevant because PE focuses solely on the subject’s practical situation.  

  2. **Epistemic Contextualism (EC)**:  
     - **Verdict**: *False*.  
     - **Reasoning**: EC ties knowledge to the **conversational context**. Here, Dr. Chen’s presence makes high-stakes error possibilities (e.g., "The website is wrong today") salient. Since the audience (Dr. Chen) faces dire consequences, the context elevates the epistemic standard. Alex’s evidence—while sufficient for low-stakes contexts—is now inadequate. EC treats Dr. Chen as part of the "contextual audience," so Alex’s claim must satisfy the high standards Dr. Chen’s stakes impose.  

  ---

  ### Why the Theories Diverge Here  
  **Structural Feature**: *Misalignment between the subject’s stakes and the conversational context’s salience*.  
  - In this scenario, Alex (the subject) has **low stakes**, but the context (via Dr. Chen) introduces **salient high-stakes error possibilities**.  
  - **PE only cares about Alex’s stakes**, so it permits knowledge.  
  - **EC only cares about the conversational context**, so it denies knowledge.  

  **Why Standard Bank Cases Lack This Feature**:  
  In classic bank cases (e.g., DeRose’s high-stakes Hannah), the subject’s stakes and conversational context are **aligned**:  
  - *High-stakes version*: Hannah worries about ruin if wrong, *and* she voices these worries in conversation. Her stakes *make* error possibilities salient in the context.  
  - *Low-stakes version*: The subject has no stakes and discusses the bank casually.  
  Both theories converge because the subject’s stakes directly shape the context. There’s no "pull" to separate them.  

  ---

  ### Theoretical Implications  
  - **PE’s Commitment**: Knowledge is a function of the *subject’s* practical reasoning environment. Eavesdroppers don’t affect whether the subject knows.  
  - **EC’s Commitment**: Knowledge attributions are sensitive to *attributor context*. Here, Dr. Chen’s stakes make skeptical alternatives relevant, raising the standard for "knows."  
  - **Key Difference**: EC allows "knows" to shift truth-value within the same conversation if new stakes are introduced (e.g., if Dr. Chen speaks up). PE denies this: Alex’s knowledge depends only on Alex’s fixed stakes.  

  This scenario isolates the core disagreement: **whether practical stakes affect knowledge by changing the subject’s epistemic position (PE) or the semantic standard for ‘knows’ (EC)**. Your friend is correct that aligned-stakes cases can’t distinguish them—but decoupling the stakes from the context reveals their divergence.
