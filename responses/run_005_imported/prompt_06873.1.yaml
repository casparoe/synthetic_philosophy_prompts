  The tone should be warm and personal, not academic. Share specific memories—how she taught, her humor, her passion. That grounds the philosophy in her lived experience, making it accessible. For the family, this makes her real; for the specialists, it shows her authenticity. 

  Structure-wise: open with personal loss, transition to her teachings (using the basin story as metaphor), explain Zhuangzi's view of death plainly, then emphasize her enduring impact. End with a quiet image of transformation—like mist dissolving into rain—that feels peaceful without implying persistence. 

  The tricky part is making dissolution comforting. The key is to frame it as returning to the whole, like a wave merging back into the ocean. The family might find solace in nature imagery; the specialists will see the Zhuangzi underpinnings. 

