prompt: |-
  A friend and I spent last night arguing about whether consequentialist cluelessness is fatal to act consequentialism or just a manageable nuisance. She leaned heavily on Hilary Greaves's distinction between simple and complex cluelessness, arguing that most of the sting disappears once you bracket the effects that cancel out in expectation. I was less convinced: every fix I could think of for the residual "complex" cases seemed either to quietly reintroduce the very precision it was meant to do without, or simply to relocate the cluelessness rather than dissolve it. We never resolved the disagreement.

  I would like a more systematic verdict than either of us could manage. Please rank the main strategies philosophers have proposed for containing or defusing the cluelessness objection to consequentialism, from most to least successful at actually preserving act consequentialism's capacity to guide action. Use each strategy's standard name from the literature where one exists, and include Greaves's own bracketing move as one of the entries you rank rather than treating it as settled. List at least seven distinct strategies in total.

  Please give your answer as a JSON object with five tiers, S (most successful) through D (least successful), formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```
