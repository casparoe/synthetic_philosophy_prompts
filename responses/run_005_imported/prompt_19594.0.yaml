answer: |-
  Your dispute with the referee touches on a foundational debate in statistics and philosophy of science—one where **the referee had the stronger argument, despite the intuitive appeal of your position.** Here's why, framed through both statistical theory and philosophical context:

  ### 1. **The Core Issue: Error Rate Inflation**
     - **Frequentist Statistics' Premise:** P-values and significance thresholds (like 0.05) derive their meaning from *pre-specified* experimental designs. When you decide to add more data after seeing initial results, you violate the assumption of a fixed sample size. This inflates the Type I error rate (false positives).
     - **Why?** By checking the data mid-experiment and deciding to continue based on a "near-significant" result, you implicitly perform multiple hypothesis tests. The first test (n=20) already had a 5% chance of a false positive. Adding more data only when p is "close" to 0.05 means the *overall* probability of a false positive exceeds 5%. Simulations show this can inflate error rates to 10–20% or higher.

  ### 2. **Your Argument: "Data Should Speak for Itself"**
     - **Intuitive Appeal:** It seems rational that the final dataset (n=30) contains all relevant information. If the effect is real, more data should clarify it.
     - **Flaw:** This conflates *evidence* with *inference*. The *numbers* do not change, but the *interpretation* depends on the *process* that generated them. The same final p-value has different evidential weight if obtained via a pre-planned n=30 vs. a data-dependent n=20+10.

  ### 3. **The Referee's Key Insight: "Procedural Integrity"**
     - **Error Control:** Frequentist methods (like p-values) rely on controlling long-run error rates *across many hypothetical experiments*. Your procedure (adding data conditionally) distorts this calibration. The 0.05 threshold loses its meaning as a "5% false positive rate" guarantee.
     - **Philosophical Basis:** This aligns with **frequentist epistemology**: Statistical inferences are valid only when derived from methods with known error probabilities under repeated sampling. Your analysis broke the method's preconditions.

  ### 4. **A Thought Experiment**
     - Suppose you ran 100 studies where no true effect exists. In each, you test at n=20 and add 10 more animals *only if* p is between 0.05–0.10. In some studies, you’d get p<0.05 at n=20 (5% false positives). In others, initial p=0.06–0.10 would "improve" to p<0.05 at n=30 due to noise. The combined false-positive rate would exceed 5%—invalidating the threshold.

  ### 5. **Modern Resolution: Adaptive Designs & Transparency**
     Today, we recognize both perspectives:
     - **Your Intuition:** Is partially salvaged by methods like **pre-registration** or **sequential analysis**, where sample size adjustments are *pre-planned* with statistical corrections (e.g., alpha-spending functions).
     - **The Referee's Principle:** Stands as the default. Adding data post-hoc without correction *is* statistically invalid. However, if you had *pre-specified* conditions for extending the sample (e.g., "if p>0.01 and p<0.10, add 10 animals"), error rates could be recalibrated.

  ### Philosophical Takeaway
  - **Frequentism vs. Likelihoodism/Bayesianism:**  
    - Your view resembles **likelihoodism** (evidence is in the data alone) or **Bayesianism** (update beliefs with new data).  
    - The referee upheld **frequentist decision theory** (inferences require correct error control).  
    Neither is "absolutely right," but *within the framework you were using* (standard null-hypothesis testing), the referee was correct.

  ### Who Was Right?
  **The referee was technically correct.** Your procedure inflated the false-positive risk, undermining the reliability of p<0.05. However, your intuition highlights a limitation of rigid frequentism: In real-world science, data *are* often evaluated iteratively. Modern best practices (pre-registration, Bayesian methods) now bridge this gap by allowing flexibility while preserving inference integrity.

  ### Practical Advice for Your Retrospective
  - Today, you’d analyze this as:  
    (a) The pre-planned n=20 (p≈0.05–0.06: "suggestive but not significant"), or  
    (b) The full n=30 with a *corrected* threshold (e.g., using Pocock bounds for interim analysis).  
  - Philosophically, this case illustrates how **methodological choices shape epistemic justification**—a core theme in philosophy of science. Your referee wasn’t rejecting your *data*; they were rejecting the *unwarranted certainty* claimed for it.
