answer: |-
  Here are 8 focused interview questions delving into key debates around Lewisian convention, incorporating your specific requests and designed to spark substantive discussion with your guest:

  1.  **The Psychological Reality of Common Knowledge:** Lewis requires an infinite hierarchy of mutual expectations ("I expect you to expect me to expect...") for common knowledge. Critics like Binmore or Gintis argue this is psychologically unrealistic for most everyday conventions. How do you defend the *explanatory necessity* of this strong common knowledge requirement against simpler models relying on bounded rationality or mere mutual expectation?
      *   *Likely Follow-up (if she argues for a "weaker" or dispositional interpretation):* If we reinterpret common knowledge as a *dispositional state* or grounded in public *salience* rather than actual infinite cognitive iterations, doesn't this risk collapsing the distinction Lewis needed it to maintain – particularly between conventions and merely accidental regularities, or conventions sustained purely by immediate precedent?

  2.  **Gilbert's Challenge - From Mistake to Fault:** Margaret Gilbert argues Lewis's individualistic, expectation-and-preference model cannot capture the distinctive *normativity* of convention – why breaking one feels like a *fault* (a transgression) inviting blame, rather than just a *mistake* (like miscalculating a best response). How does your updated Lewisian framework account for this sense of obligation or "joint commitment" inherent in conventions, without resorting to Gilbert's collectivist intentionality?
      *   *Likely Follow-up (if she emphasizes higher-order expectations/sanctions):* If the sense of "fault" arises primarily from the anticipation of *sanctions* (disapproval, coordination failure costs) embedded in higher-order expectations ("I expect you to expect me to conform, and to sanction me if I don't"), does this reduce the normativity to purely strategic concerns? Does this adequately distinguish the "ought" of convention from the instrumental "ought" of avoiding a speeding ticket?

  3.  **Skyrms' Evolutionary Challenge:** Brian Skyrms and others model the emergence of stable conventions (e.g., in signaling games or division problems) using evolutionary dynamics (replicator dynamics, reinforcement learning) or simple adaptive heuristics, often *without* invoking common knowledge. They show convergence to coordination equilibria based on past success, not necessarily mutual expectations about expectations. Should these results worry a Lewisian, or do they simply describe the *genesis* of a regularity, leaving Lewis's common-knowledge-sustained *state* as the best account of a mature convention?
      *   *Likely Follow-up (if she argues for complementarity - genesis vs. state):* If robust conventions *can* emerge and persist in populations of agents following simple rules, unaware of each other's beliefs beyond immediate responses, does this suggest that Lewisian common knowledge is more of a *theoretical gloss* we apply *after the fact* to describe the system, rather than a *causal mechanism* actively sustaining it? Is common knowledge then epiphenomenal in many real-world cases?

  4.  **Evidence Against Common Knowledge:** Lewisians often respond to apparent counterexamples (where coordination succeeds without obvious common knowledge) by arguing the coordination problem was mis-specified, or that common knowledge *was* present but grounded in subtle cues. What would constitute *genuine, compelling evidence* against the *necessity* of the common knowledge clause in Lewis's definition? Can you sketch a hypothetical (or real?) scenario where a clear convention demonstrably exists *and* solves a recurring coordination problem with an alternative, yet where the infinite hierarchy of mutual expectations is provably absent or irrelevant?
      *   *(Implicit Follow-up to the whole line):* How do we avoid the "mis-specified problem" defense becoming unfalsifiable?

  **Bonus Question (Flow/Engagement):**

  5.  **The "Focal Point" Lifeline:** Lewis heavily relied on Salience (focal points) to bootstrap common knowledge and solve coordination problems initially. In your defense/update of his framework, does Salience carry *more* or *less* theoretical weight than Lewis assigned it? Can salience alone sometimes *substitute* for deeper layers of common knowledge in sustaining a convention, especially in complex or novel situations?

  **Closing Question (Evidence & Falsifiability - Addressing your specific concern):**

  6.  **Concrete Falsification:** Building on the evidence question, let's get concrete. Imagine a longitudinal study tracking the emergence and persistence of a novel coordination norm (e.g., a traffic flow pattern after a new roundabout, a platform choice in a new online community). What specific empirical findings – perhaps about individual belief structures measured through surveys/experiments, behavioral patterns, or breakdowns – would you accept as strong evidence that Lewis's specific common knowledge requirement *wasn't* met, yet a stable convention *was* present? How do we empirically distinguish a "mis-specified problem" from a genuine absence of the required mutual expectations hierarchy?

  **Key features of these questions:**

  *   **Avoid Definition Rehash:** They assume familiarity with Lewis's core definition and jump straight to the controversies.
  *   **Targeted Critiques:** Directly address the psychological realism, Gilbert's normativity, and Skyrms' dynamics challenges as requested.
  *   **Strategic Follow-ups:** Anticipate common defenses (weaker CK, sanctions, genesis/state distinction) and push further.
  *   **Falsifiability Focus:** The final question directly tackles the "mis-specified problem" escape hatch by demanding concrete empirical criteria.
  *   **Engagement:** The "focal point" question offers a slightly different angle while staying core to Lewis's machinery.
  *   **Rigor:** They require the guest to defend the *explanatory necessity* and *distinctiveness* of Lewis's specific common knowledge clause against alternatives.
