  I'm a novelist drafting a short piece in the form of an apocryphal essay -- a "newly discovered" fragment in which Jorge Luis Borges reviews Carlo Rovelli's The Order of Time, the 2018 physics book arguing that a single flowing present is not fundamental but emerges from thermodynamics and our own coarse, partial view of the world. For the piece to work, the Borges in it has to reason like Borges himself, not merely gesture at labyrinths and mirrors. Ground him specifically in "A New Refutation of Time": the case, built on Berkeley's denial of matter and Hume's denial of a persisting self, that without substance there is nothing for time to inhere in -- together with that essay's own famous refusal, on its last page, to actually live inside that conclusion. Give me notes rather than finished prose, covering: where Borges would say Rovelli's physics arrives late at something his idealism had already granted him; where he'd think it stops short of his own, more drastic conclusion; and whether a universe without fundamental time dissolves that closing admission of his, or only sharpens it.
