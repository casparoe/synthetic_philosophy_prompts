answer: |-
  You're absolutely right to be confused—Tolstoy **never explicitly uses *War and Peace* as a positive example in "What Is Art?"** Your MFA leader likely conflated Tolstoy's *theory* with its (perceived) application in his great novel. This is a common critical shorthand, but it's not actually in the text. Let's untangle the reality:

  1.  **The Misconception:** The idea that Tolstoy holds up *War and Peace* as the model for "infectious" art in "What Is Art?" is widespread but incorrect. He *doesn't* use his own fiction as a positive case study there.
  2.  **What "What Is Art?" *Actually* Says About His Own Work:**
      *   **Implicit Rejection:** Tolstoy's late-life views were radically ascetic and moralistic. By the time he wrote "What Is Art?" (1897), he largely *rejected* his own masterpieces (*War and Peace*, *Anna Karenina*) as belonging to "bad art" or at best, "exclusive art" for the upper classes. He saw them as too complex, too focused on the aristocracy, and not sufficiently focused on universal Christian love and moral instruction.
      *   **The "Good Art" Examples:** Instead, Tolstoy praises simple, universal, morally unambiguous art: folk songs, Bible stories (like the parable of the lost sheep), paintings depicting humble labor, and works like *Uncle Tom's Cabin* (for its clear moral stance against slavery).
      *   **The Core Theory (Infectiousness):** His central argument *is* that art's value lies in its "infectiousness" – its ability to transmit a genuine feeling experienced by the artist to the audience. For this to happen, the art must possess:
          *   **Sincerity:** The artist *must* genuinely feel the emotion they transmit.
          *   **Clarity:** The feeling must be expressed so clearly the receiver perceives it exactly.
          *   **Individuality:** The feeling must be unique and specific, not generic.
          *   **Accessibility/Universality:** The feeling must be one accessible to *all* people, not just a privileged elite. This is where he condemns much "high art" as exclusive and decadent.

  3.  **Why People *Think* *War and Peace* is the Example:**
      *   **The Theory Fits (Retroactively):** Critics and readers *apply* his theory *back* to *War and Peace* and find it fits remarkably well, despite Tolstoy's later rejection of the novel.
      *   **Scale & Feeling:** *War and Peace* transmits incredibly powerful, universal feelings (the horror of battle, the joy of love, the search for meaning, the pain of loss, the comfort of family) with immense sincerity and clarity. Its vast scope allows it to touch on *many* fundamental human experiences.
      *   **Tolstoy's Own Earlier Goals:** In his *drafts* and letters *written during the creation* of *War and Peace*, Tolstoy expressed desires to capture the "truth" of human experience and historical events, which aligns *conceptually* with sincerity and clarity, even if he didn't use the term "infectiousness" then.

  **So, What *Does* Make *War and Peace* "Infectious" (According to the Theory)?**

  Here's how Tolstoy's *theory* explains the power of *War and Peace*, even if he wouldn't have admitted it later:

  1.  **Profound Sincerity:** Tolstoy grapples with fundamental questions (life, death, love, war, history, free will) with raw, relentless honesty. You feel he *needed* to write this.
  2.  **Unparalleled Clarity of Feeling:** He doesn't just tell you Natasha is excited; he makes you *feel* her youthful exuberance at the ball through concrete details (her rapid breathing, her flitting movements, the reactions of others). He doesn't just describe battle; he makes you feel the chaos, fear, and disorientation (Pierre at Borodino). The physical sensations and psychological states are rendered with astonishing immediacy.
  3.  **Vivid Individuality:** Characters feel like unique, complex individuals (Pierre's intellectual clumsiness and moral searching, Natasha's impulsive vitality, Prince Andrei's hauteur and vulnerability). Their specific feelings are palpable.
  4.  **Universality Through Specifics:** While set in a specific time/place/social class, the *feelings* explored are universal: first love, grief, courage, cowardice, the search for purpose, the bond of family, the absurdity of war, the awe of nature. Tolstoy digs down to the fundamental human level beneath the historical trappings.
  5.  **Concrete Sensory Detail:** Tolstoy grounds abstract feelings and ideas in tangible, sensory experiences. You *see* the dust, *hear* the cannonballs, *feel* the tension in a room. This makes the transmitted feelings visceral.
  6.  **Moral Clarity (of a Kind):** While not the simplistic moralizing of his late period, the novel has a deep moral core exploring authenticity vs. falseness, selflessness vs. egoism, and the search for genuine meaning. This resonates universally.

  **Applying This to Your Novel: Reverse-Engineering the "Infectiousness"**

  Forget Tolstoy pointing to his own work. Focus on how the *theory* explains its power and apply those principles:

  1.  **Dig Deeper into Sincerity:** Are you writing scenes *you* feel deeply about? Does the emotion (joy, terror, despair, love) come from an authentic place within you? Don't write a "battle scene" because epics need one; write it because you have something visceral to convey about the human experience within it.
  2.  **Amplify Clarity Through Concrete Details:** How can you make the reader *feel* the emotion *physically* and *immediately*? Instead of "he felt afraid," show the cold sweat, the trembling hands, the narrowed tunnel vision, the roar in the ears. What specific, unique sensory details embody the feeling *in this specific moment for this character*?
  3.  **Prioritize Universal Human Moments:** Even amidst grand battles and political machinations, it's the intimate moments that often transmit feeling most powerfully: a soldier looking at a locket before charging, families reuniting (or not) after long separations, quiet acts of unexpected kindness or cruelty amidst chaos, the simple exhaustion after trauma. Ensure your sprawling narrative is punctuated by these deeply relatable human experiences. **This is likely the core of what your agent senses as "Tolstoyan."**
  4.  **Seek the Universal Within the Specific:** Your multi-generational families and battles are the vessel. What fundamental human truths about love, loss, duty, fear, resilience, betrayal, or hope are you exploring *through* them? How do the specific historical/social conflicts reveal timeless aspects of the human condition?
  5.  **Embrace Complexity, Strive for Clarity:** Characters can be complex (like Andrei or Pierre), but the *feelings* they experience in key moments should be rendered with clarity. The reader might not understand *why* a character feels a complex mix, but they should clearly *feel* the individual components (e.g., the sharp sting of betrayal layered over dull grief).
  6.  **Moral Exploration, Not Sermonizing:** Like Tolstoy in *War and Peace*, explore moral ambiguity and complex choices. Let the reader feel the weight of decisions. The "infectiousness" comes from the *honest exploration* of moral struggle, not from providing simplistic answers. Focus on the *feeling* of making a difficult choice, living with its consequences, or witnessing its impact.

  **In short:** Your workshop leader was wrong about the essay, but right about the connection. Stop looking for the passage where Tolstoy praises *War and Peace* – it doesn't exist in "What Is Art?" Instead, use his *theory* of infectiousness (sincerity, clarity, individuality, universality) as a lens to analyze *why* the feelings in *War and Peace* resonate so powerfully, and ruthlessly apply those principles to the emotional core of *your* sprawling epic. Focus on making the reader *feel* the universal human truths within your specific, complex world through concrete, authentic, vividly clear moments. That's the real Tolstoyan lesson. Good luck with the final third!
